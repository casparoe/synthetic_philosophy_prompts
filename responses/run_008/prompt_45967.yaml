prompt: |-
  I'm teaching an upper-level epistemology seminar — 15 students, one 90-minute session — and next week is our unit on testimony. They've already read the Hume-ish reductionist line and the anti-reductionist responses (Reid, Coady, Burge), so they know the arguments on paper. What I want is an activity where they feel the arguments, mainly the two costs the papers describe abstractly: (1) the reductionist's bootstrap problem — you can't check a source's reliability without leaning on more testimony, and a strict "verify before trust" rule leaves you knowing almost nothing; and (2) the anti-reductionist's exposure — default trust is fast and cheap until someone lies, and then it's wrong in a big way.

  I have a germ of an idea but I keep getting stuck on the details, so take it or leave it: split the class into two "islands" of 6-7 each, with it's own written acceptance rules. Island A runs reductionism as law: nobody may accept a report from a person unless they've personally seen that person be right before (each player keeps a private trust ledger that starts empty), and the only way to check a fact yourself is to spend an "observation token," of which the island has very few. Island B runs default-trust: reports are accepted unless someone formally challenges, and a challenge costs the challanger points if the challenged report turns out to have been true. Each round the facilitator flashes a fact (I'm thinking a card with a random sequence of symbols, shown clearly to one designated "witness" on each island for three seconds and to nobody else), and every player has to write down an answer. Scoring gives points for accuracy and docks points for tokens spent, time taken, and failed challenges. Maybe I seed one or two secret liars in later rounds — or maybe that's too gimmicky, you tell me.

  What I need from you:

  - Full rules I can actually run: materials, round structure, scoring, how the trust ledgers work, how challenges work on island B. Keep materials to stuff I can carry in a backpack.
  - The sequence should build. Early rounds should show island A starving (nobody has track records yet, tokens gone, "I don't know" written everywhere) while island B cruises. Then a later round with a liar should flip the felt superiority, so students viscerally see the trade-off instead of one side just winning the whole game.
  - A debrief script that maps moments in the game onto the positions: the empty ledgers onto the circularity/bootstrapping objection, the tokens onto how much raw observation testimony saves us, the challenge rule onto defeaters and the thought that trust is the default with an exit, not the other way around. And I want the debrief to highlight the thing I expect will happen on island A no matter what the rules say: players quietly trusting each other anyway, because living as a strict reductionist is basically impossible. That's the deepest point of the whole unit if I can land it.
  - A frank list of what will go wrong the first time I run this (liars spotted instantly, island A colluding outside the rules, scoring disputes eating the clock) and how to handle each one.
  - An honest note on what the game can't reproduce. My worry is that it treats reports as signals, and real testimony is an agent vouching for something — with norms behind it, and the possibility of asking follow-up questions and getting a story. If the game can't show that side at all, say so straight, and tell me what I have to supply myself in the debrief to cover for it.

  Two constraints: no real money, and nothing that needs a phone app or laptop. Index cards, a timer, that's the level.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level epistemology seminar (15 students, 90 mins).
      *   **Topic:** Testimony (Reductionism vs. Anti-Reductionism).
      *   **Prior Knowledge:** Students know Hume/Reductionism and Reid/Coady/Burge/Anti-Reductionism arguments theoretically.
      *   **Goal:** An activity to make them *feel* the costs (Reductionist bootstrap problem vs. Anti-Reductionist exposure to error).
      *   **User's Idea:** Two "islands" with different rules (Reductionist vs. Default Trust). Witness sees a fact, others guess. Tokens for observation. Trust ledgers. Liars in later rounds.
      *   **Requirements:**
          *   Full runnable rules (materials, rounds, scoring, ledgers, challenges).
          *   Backpack-friendly (index cards, timer, no tech).
          *   Narrative arc (Island A starves early, Island B cruises, then Liar flips it).
          *   Debrief script (mapping game mechanics to philosophical concepts, highlighting the impossibility of strict reductionism).
          *   Troubleshooting (what will go wrong & fixes).
          *   Limitations (what the game *can't* simulate, specifically the normative/agentive nature of testimony).
      *   **Constraints:** No real money, no phones/laptops.

  2.  **Evaluate and Refine the User's Idea:**
      *   *Strengths:* The "Two Islands" metaphor is excellent for contrasting frameworks. The token system captures the "cost of verification." The liar element captures the risk of default trust.
      *   *Weaknesses/Risks:*
          *   *Complexity:* 15 students split into 2 groups means ~7 per group. Managing separate ledgers and token economies simultaneously while running rounds might be chaotic for the instructor.
          *   *The "Bootstrap" Problem:* If Island A *strictly* cannot trust without prior verification, they will literally do nothing in Round 1. This is good for the point, but needs to be managed so they don't just quit.
          *   *The "Liar" Mechanic:* If a liar is introduced too early, Island B panics. If too late, Island A feels vindicated too simply. Needs careful timing.
          *   *Communication:* Testimony is about *communication*. If they just write down answers, it's more about signal transmission. Need to ensure they are actually *telling* each other things.
          *   *Time:* 90 minutes total. Activity needs to be tight (45-50 mins) to leave room for debrief (40-45 mins).

  3.  **Drafting the Activity Design ("The Testimony Trade-Off"):**

      *   **Materials:** Index cards (facts), tokens (poker chips or paper slips), pens, score sheets.
      *   **Setup:** Split class into Group R (Reductionists) and Group A (Anti-Reductionists). 7 vs 8 (or 7 vs 7 + 1 observer/moderator helper). Let's say 7 vs 8 for simplicity.
      *   **The Fact:** Needs to be hard to guess but easy to verify *if* you see it. A sequence of 5-7 symbols or numbers.
      *   **The Witness:** Rotates every round? Or fixed? Rotating is better to simulate distributed knowledge.
      *   **Group R Rules:**
          *   Can only accept testimony from someone with a "Verified" stamp.
          *   To verify, must spend a Token to observe the fact directly *alongside* the witness (simulating the cost of independent check).
          *   Start with 0 Verified partners. Start with 2 Tokens each.
      *   **Group A Rules:**
          *   Default accept testimony.
          *   Can issue a "Defeater Challenge" if suspicious.
          *   Challenge cost: If wrong, lose points. If right (catch a liar), gain points.
          *   Start with high trust, low verification cost.
      *   **Rounds:**
          1.  Baseline (No liars). R starves, A thrives.
          2.  Expansion (R tries to build ledger). R spends tokens slowly. A cruises.
          3.  The Betrayal (Secret Liar in Group A). A gets crushed. R is safe but slow.
          4.  The Aftermath (Optional/Time permitting). How do they recover?

      *   *Refinement on Group R:* The rule "must see them be right before" is hard to simulate without the instructor checking every interaction.
      *   *Simplification:* Give Group R "Verification Vouchers." They start with none. They earn one by spending a Token to check the Witness's card *before* the round ends. If they check, they know the truth. If they trust without a voucher, they get penalized heavily if wrong.
      *   *Actually, let's stick closer to the User's "Ledger" idea but simplify:*
          *   Group R: To copy an answer from a peer, you must mark that peer in your ledger. If that peer is wrong, you lose double points. You can only mark them "Trusted" if you spent a Token to verify their answer *in a previous round*.
          *   Group A: Copy freely. If wrong, standard penalty. If you Challenge, high risk/high reward.

      *   *Wait, the "Bootstrap" needs to be visceral.*
      *   *Revised Group R Rule:* You cannot write down an answer provided by another player unless you have a "Trust Token" for them. You get a Trust Token only by spending an "Observation Token" to watch them report correctly once. You start with 0 Trust Tokens and 1 Observation Token.
      *   *Revised Group A Rule:* You can copy anyone. But if the "Source" was the Liar, you get the answer wrong. You can Challenge (costs points) to reveal if the Source is the Liar.

  4.  **Developing the Debrief:**
      *   Need to connect the empty ledgers to Hume's circularity.
      *   Connect the tokens to the scarcity of direct experience.
      *   Connect the Liar round to the vulnerability of Anti-Reductionism (Burge's "Acceptance Principle" vs. the reality of deception).
      *   Crucial point: Did Group R *actually* follow the rules? Usually, humans cheat because strict reductionism is unlivable. This is the "Reid" moment.

  5.  **Troubleshooting:**
      *   *Cheating:* Students will talk across islands. *Fix:* Physical separation + "Noise" or honor code + penalty.
      *   *Boredom:* If Group R does nothing. *Fix:* Make the penalty for "No Answer" worse than "Wrong Answer" eventually, or keep rounds short.
      *   *Liar Detection:* If the liar is obvious. *Fix:* Liar must be subtle (report correctly 1st round, lie 2nd).
      *   *Time:* Scoring takes too long. *Fix:* Pre-print score sheets, self-reporting with audit.

  6.  **Addressing Limitations:**
      *   The game treats testimony as data transfer. Real testimony involves *reasons*, *authority*, and *dialogue*.
      *   Need to explicitly state in debrief: "In the game, you were passive receivers. In real life, you can ask 'How do you know?'" This actually favors Anti-Reductionism (you don't need to verify *before*, you can verify *after* via dialogue).

  7.  **Final Polish:**
      *   Ensure tone is appropriate for upper-level seminar (intellectual, not just "fun game").
      *   Check constraints (backpack, no tech).
      *   Make sure the "Liar" mechanic doesn't ruin Group A entirely, just dents them enough to show the risk.

      *(Self-Correction during drafting)*: 15 students is an odd split. 7 vs 8 is fine.
      *   Time management is critical. 90 mins total.
      *   Intro: 10 mins.
      *   Game: 40 mins.
      *   Debrief: 40 mins.
      *   Need to ensure the game doesn't overrun. Keep rounds to 5 minutes max.

      *Refining the "Bootstrap" mechanic for Group R:*
      If they can't trust anyone until they verify them, and verification costs a token, and they have 1 token... they can verify *one* person *one* time. Then they can trust that person. But that person had to verify someone too. It creates a chain that can't start. This is the exact Humean trap. I need to make sure they *feel* that paralysis.
      *Decision:* Group R starts with 0 Trust Credits. They have 2 Observation Tokens each. To gain a Trust Credit for a peer, they must spend a Token to "shadow" that peer (instructor verifies they looked at the same card). This is logistically heavy.
      *Simpler version:* Group R can only accept testimony if they pay a "Verification Cost" (1 Token) *per report* unless they have a "Established Relationship" (which takes 3 rounds to build). This simulates the *effort* of reductionism.
      *Best version for flow:* Group R *can* listen, but to count the answer as "Justified" (for points), they must attach a "Verification Receipt." They get 2 Receipts total for the whole game. If they answer without a Receipt, they get 0 points even if right. This forces them to hoard verification and starve.

      *Let's go with the User's "Ledger" idea but streamlined:*
      Group R: "The Skeptics."
      Rule: You may only copy an answer from a classmate if you have marked them as 'Vetted' in your ledger.
      To mark someone 'Vetted': You must spend 1 Observation Token while the Instructor reveals the card to both of you.
      Start: 0 Vetted peers. 1 Observation Token per student.
      Group A: "The Trusters."
      Rule: Copy freely.
      Risk: One player is a "Saboteur" (secretly assigned). If you copy the Saboteur, you get the answer wrong.
      Defense: You can "Challenge" the Saboteur (costs points, but neutralizes them).

      *Wait, the Saboteur needs to be effective.* If the Saboteur just lies immediately, everyone knows. The Saboteur should tell the truth Round 1, Lie Round 2.
      *Actually, let's make the Saboteur a mechanic of the Island, not a student.* It's hard to ask a student to lie convincingly.
      *Better:* The Instructor acts as the "Environment." In Round 3, the Instructor introduces "Noise." For Group A, 50% of transmitted answers get flipped randomly. For Group R, they are safe *if* they verified.
      *No, that loses the "Agent" aspect.*
      *Okay, stick to the Student Liar.* It's more powerful if a peer betrays trust. I will instruct the Liar privately.

      *Final Plan Structure:*
      1. Materials List.
      2. Setup (Islands, Roles).
      3. The Rules (R vs A).
      4. Round Sequence (1: Clean, 2: Clean, 3: Liar Active, 4: Recovery).
      5. Scoring.
      6. Debrief Script.
      7. Troubleshooting.
      8. Limitations.

      *Wait, one constraint check:* "Backpack." Index cards, pens, paper slips for tokens. Easy.
      *Time check:* 90 mins.
      Intro: 10.
      Game: 45 (5 rounds x 5 mins + setup).
      Debrief: 35.
      This is tight. I need to emphasize strict timekeeping.

      *Refining the "Impossible Reductionist" point:*
      I need to instruct the TA/Instructor to watch Group R closely. They *will* cheat. They will just ask "What did you see?" and write it down without spending a token.
      *Debrief Gold:* Catch them in the act. "I saw you, Student X, write down Student Y's answer without spending a token. Why?" "Because I needed to pass." "So you abandoned your epistemic principle for pragmatic survival?" *Boom.* That's Reid's argument.

      *Let's write it.*
answer: |-
  This is a strong pedagogical instinct. Epistemology often suffers from being too abstract; making the *cost* of verification physical and the *risk* of trust visceral will stick with them much longer than the readings.

  Your "Two Islands" concept is solid. I have refined the mechanics to ensure the "Bootstrap Problem" creates actual paralysis for Island A (Reductionists) while Island B (Anti-Reductionists) feels the sudden shock of betrayal. I have also streamlined the scoring so you aren't doing math for 20 minutes during the debrief.

  Here is the complete package for **"The Testimony Trade-Off."**

  ### 1. Materials (Backpack Friendly)
  *   **Index Cards:** 30 total. (15 for Facts, 15 for Roles/Instructions).
  *   **Paper Slips ("Tokens"):** ~50 small slips of paper. Write "OBS" on 20 of them (Observation Tokens). The rest are blank (used for scoring/ledger).
  *   **Pens:** 15.
  *   **Score Sheets:** 15 printed half-sheets (template below).
  *   **Timer:** Your phone or watch.
  *   **The "Secret Liar" Card:** 1 specific index card marked **LIAR**.

  ### 2. Setup (10 Minutes)
  **Divide the Class:**
  *   **Island R (Reductionists):** 7 Students. Sit on the left.
  *   **Island A (Anti-Reductionists):** 8 Students. Sit on the right.
  *   *Physical Barrier:* Put a row of backpacks or chairs between them to prevent cross-talk.

  **Distribute Roles:**
  *   **Island R:** Hand each a **Skeptic Ledger** (a sheet of paper with 7 names listed). Hand each **1 Observation Token**.
  *   **Island A:** Hand each a **Trust Ledger** (blank sheet). Hand one specific student (choose someone articulate but not obviously mischievous) the **LIAR** card. Tell them: *"In Round 1, tell the truth. In Round 2, tell the truth. In Round 3, deliberately give the wrong answer. In Round 4, tell the truth again. Do not reveal you have this card."*
  *   **Instructor:** You are the "World." You hold the Fact Deck.

  **The Goal:**
  Maximize your individual score.
  *   Correct Answer: +10 points.
  *   Wrong Answer: -5 points.
  *   No Answer: -2 points (Penalty for inaction).

  ### 3. The Rules (Project or Read Aloud)

  **The Fact:**
  Each round, you (Instructor) will show a **Fact Card** (a sequence of 6 symbols, e.g., `Δ Ω ≠ ∫ ≈ π`) to **one designated Witness** in each Island for 5 seconds. No one else sees it. The Witness must communicate this to the Island.

  **Island R Rules (The Reductionists):**
  1.  **Default Status:** You cannot trust anyone's report.
  2.  **Verification:** To accept a report from a peer as "Justified" (worthy of points), you must spend an **Observation Token** to verify them.
      *   *Mechanic:* If you want to trust Peer X, you must raise your hand. I (Instructor) will come to you. You must show me that you are looking at Peer X's paper *while* they look at the Fact Card. If I confirm you "shadowed" them, I stamp your ledger. Now you can trust Peer X for *future* rounds.
  3.  **Constraint:** You only have **1 Token** to start. You cannot earn more. Once tokens are gone, you cannot verify new people.
  4.  **Penalty:** If you write down an answer based on testimony *without* a verification stamp in your ledger, and the answer is wrong, you get **-20 points** (Epistemic Negligence). If right, you get 0 points (Accidental True Belief).

  **Island A Rules (The Anti-Reductionists):**
  1.  **Default Status:** You may accept any report from a peer immediately. No tokens needed.
  2.  **Challenge:** If you suspect a report is false, you may issue a **Challenge**.
      *   *Mechanic:* Write "CHALLENGE" on your sheet.
      *   *Cost:* If the report was actually True, you lose **-10 points** (Frivolous Challenge).
      *   *Reward:* If the report was False (i.e., from the Liar), you lose nothing, and the Liar loses **-20 points**.
  3.  **Risk:** If you copy the Liar without challenging, you get the answer wrong (-5 points).

  ### 4. Round Sequence (40 Minutes Total)

  **Round 1: The Baseline (5 mins)**
  *   **Witness:** Pick a reliable student in each group.
  *   **Fact:** Simple sequence (`1 2 3 4 5 6`).
  *   **Liar Instruction:** Tell the truth.
  *   **Expected Outcome:** Island A fills sheets quickly. Island R panics. They have 1 token each but 6 peers. They can only verify 1 person. The rest must write "No Answer" or risk the -20 penalty.
  *   **Collect Sheets.**

  **Round 2: The Scarcity (5 mins)**
  *   **Witness:** New student.
  *   **Fact:** Medium complexity (`A # B @ C $`).
  *   **Liar Instruction:** Tell the truth.
  *   **Expected Outcome:** Island A is cruising. Island R is now stuck. Their tokens are spent. They have verified 1 person, but that person wasn't the Witness this round. They cannot verify the new Witness without a token. They are epistemically stranded.
  *   **Collect Sheets.**

  **Round 3: The Betrayal (10 mins)**
  *   **Witness:** **The Liar** (in Island A). In Island R, pick a random student.
  *   **Fact:** Complex (`∫ Ω Δ ≠ π ≈`).
  *   **Liar Instruction:** **Lie.** Give a sequence that looks plausible but is wrong (change one symbol).
  *   **Expected Outcome:** Island A copies the Liar. Most get it wrong (-5). A savvy student might Challenge (-10 cost vs -5 risk, so they probably won't). Island R is safe *if* they didn't answer, or if they verified the Witness (unlikely).
  *   **Collect Sheets.** *Pause here.* Reveal the Liar. Let Island A feel the betrayal.

  **Round 4: The Recovery (10 mins)**
  *   **Witness:** New student.
  *   **Fact:** Simple.
  *   **Rule Change:** Tell Island A they can now Challenge for free, but if wrong, -15. Tell Island R nothing.
  *   **Expected Outcome:** Island A is hesitant. Trust is damaged. They spend time debating. Island R is still token-starved.
  *   **Collect Sheets.**

  **Round 5: The "Real World" (10 mins)**
  *   **Rule Change:** Announce: "Tokens are now infinite for Island R, BUT verification takes 2 minutes per person."
  *   **Witness:** New student.
  *   **Expected Outcome:** Island R *could* verify, but the time cost means they can only verify 1 person before time runs out. They still have to trust someone eventually.
  *   **Collect Sheets.**

  ### 5. Scoring & Debrief Script (40 Minutes)

  **Scoring:**
  Do not calculate exact scores. It eats time. Instead, ask for a show of hands:
  *   "Who on Island A ended with negative points?"
  *   "Who on Island R wrote down an answer in Round 1?"
  *   "Who on Island R verified someone?"

  **Debrief Script (Map mechanics to Philosophy):**

  **1. The Bootstrap Problem (Island R, Round 1 & 2)**
  *   *Ask Island R:* "In Round 1, why did so many of you write 'No Answer'?"
  *   *Point:* You lacked the resources to verify. But to get resources, you needed to verify.
  *   *Philosophical Link:* This is Hume's reductionism. You need independent reasons to trust testimony. But those reasons usually *come from testimony*. You cannot build a web of knowledge if you must verify every thread before weaving it. You starve.
  *   *Key Question:* "Did anyone verify someone in Round 1? How did you know *they* were reliable enough to verify?" (This highlights the regress).

  **2. The Cost of Verification (Island R, Round 5)**
  *   *Ask Island R:* "In Round 5, tokens were infinite, but time was short. Did you know more?"
  *   *Point:* Verification is expensive (time/cognitive load). If verification costs too much, we stop knowing.
  *   *Philosophical Link:* Reid/Coady. If reductionism were true, children could never learn language (they can't verify parents). We would know almost nothing about history, science, or geography.

  **3. The Exposure Risk (Island A, Round 3)**
  *   *Ask Island A:* "How did it feel when the Liar was revealed?"
  *   *Point:* You were efficient until you weren't. Default trust is vulnerable.
  *   *Philosophical Link:* This is the main objection to Anti-Reductionism (Burge). If trust is default, aren't we gullible?
  *   *Counter-Point:* "But how many of you issued a Challenge?" (Likely few). "Why?" "Because Challenges cost points."
  *   *Philosophical Link:* We don't need *positive* reasons to trust (Reductionism), but we do need *no defeaters* (Anti-Reductionism). The Challenge mechanic represents a Defeater. You didn't challenge because you had no specific reason to doubt *until* the error was revealed.

  **4. The "Cheating" Moment (The Deepest Point)**
  *   *Instructor Note:* During the game, watch Island R closely. Almost certainly, 1-2 students will ask a peer "What did you see?" and write it down *without* raising their hand for verification.
  *   *Ask:* "I noticed some of you on Island R wrote down answers without spending tokens. You broke the law of your Island. Why?"
  *   *Student:* "I needed the points." / "It was impossible otherwise."
  *   *Philosophical Link:* **This is Reid's killer argument.** Strict reductionism is psychologically impossible. We are hardwired to trust. Even when told *not* to trust, you couldn't help it. Epistemology must describe how we *do* function, not how a robot *should* function.
  *   *Conclusion:* We are Island A creatures trying to apply Island R rules. We need default trust (Burge) with a system for defeating it (Coady), not a system that requires verification before acceptance (Hume).

  ### 6. Troubleshooting: What Will Go Wrong

  **1. Island R Colludes/Cheats Openly**
  *   *Risk:* They ignore the token rule entirely.
  *   *Fix:* Don't stop them. Let them cheat. It strengthens the debrief point #4 above. If they ask "Can we just share?", say "The rules say no, but I can't stop you." Record the cheating for the debrief.

  **2. The Liar is Too Obvious**
  *   *Risk:* Island A suspects the Liar immediately in Round 3.
  *   *Fix:* Brief the Liar privately before class. Tell them: "In Round 3, change only *one* symbol. Make it look like a memory slip, not a lie." If they are caught early, the lesson fails.
  *   *Backup:* If the Liar is caught Round 3, declare Round 4 a "High Noise" round where *you* (Instructor) give a false fact to the Witness, simulating environmental error rather than human deceit.

  **3. Scoring Disputes Eat Time**
  *   *Risk:* Students argue about whether a Challenge was valid.
  *   *Fix:* You are the Supreme Court. Your ruling is final. Keep a visible timer. "We have 2 minutes for scoring, then we move to debrief regardless."

  **4. Island R Gives Up Completely**
  *   *Risk:* They write "No Answer" every time and get bored.
  *   *Fix:* In Round 3, announce a "Crisis Bonus." "If Island R gets 50% accuracy this round, everyone gets +10 points." This forces them to consider breaking their own rules (leading back to debrief point #4).

  ### 7. Limitations: What This Game Can't Do

  Be honest with them about this in the final 5 minutes.

  **1. Testimony as Signal vs. Testimony as Action**
  *   *Limitation:* In the game, testimony is just passing a code (`Δ Ω ≠`). In real life, testimony is an *act* by an agent who takes responsibility for the claim.
  *   *What to Supply:* "In the game, the Liar was a mechanic. In real life, the Liar violates a norm. When someone lies to you, they don't just give you false data; they abuse a relationship. That's why the *feeling* of betrayal in Round 3 was strong. Anti-reductionism relies on the fact that lying is the exception, not the rule, because of social norms."

  **2. No Follow-Up Questions**
  *   *Limitation:* You couldn't ask the Witness, "How did you see that?" or "Are you sure?"
  *   *What to Supply:* "Real testimony is dialogic. If you doubt me, you can ask for my reasons. Reductionism says you need those reasons *before* I speak. Anti-reductionism says you can ask *after* I speak if something seems off. The game forced you to decide instantly. Real life gives you time to vet."

  **3. The "Expertise" Factor**
  *   *Limitation:* All witnesses were equal.
  *   *What to Supply:* "In the game, everyone had equal vision. In reality, we trust doctors over mechanics about health. This is 'indirect reductionism' (Coady). We trust the *institution* without verifying the *individual*. The game couldn't simulate institutional trust, which is how we actually solve the bootstrap problem."

  ### Summary for the Instructor
  *   **Run tight:** Keep the rounds moving.
  *   **Watch the cheaters:** They are your best evidence for Reid.
  *   **Protect the Liar:** Ensure they aren't ostracized after the game; they performed a service.
  *   **Land the plane:** End on the idea that we *must* be Anti-Reductionists to function, but we must be vigilant enough to handle the Round 3 betrayals.
