answer: |-
  This is a remarkably high-quality BBQ debate. Your friends have accidentally reconstructed a significant chunk of the contemporary literature on the philosophy of truth (roughly 1970s–2000s). They are arguing about **Deflationism** (Maya) vs. **Inflationism/Substantivism** (Dan).

  Here is the referee's report, move by move, followed by what they are both missing.

  ### Move-by-Move Refereeing

  **(1) Dan: The Liar is a contradiction, so truth can't be just a device.**
  *   **Verdict:** **Dan is wrong.**
  *   **Reasoning:** Dan's intuition is that logical devices (like "and," "or," "not") are safe, while "truth" is dangerous. This is false. Naive set theory was treated as a logical device until Russell found a paradox in it. The mere fact that a concept generates a paradox under self-reference does not prove it is a "substantive property." It just proves the logic governing it is tricky. Deflationists argue truth is a logical device *that happens to be paradox-prone*, not that it isn't a device because it's paradox-prone.

  **(2) Maya: The Liar is a problem for everyone, not just deflationists.**
  *   **Verdict:** **Maya is right.**
  *   **Reasoning:** This is the standard and correct defense. Inflationists (who think truth is correspondence, coherence, etc.) generally accept the T-schema ("'Snow is white' is true iff snow is white"). Since the Liar Paradox is derived using the T-schema + self-reference + classical logic, *everyone* inherits the paradox. Dan cannot use the Liar as a special weapon against deflationism unless he can show inflationists can reject the T-schema while keeping their "property." (Most can't).

  **(3) Dan: Self-reference isn't enough; it's the T-schema that bites. That's the deflationist's whole theory.**
  *   **Verdict:** **Dan is right (mostly).**
  *   **Reasoning:** Dan sharpens his point correctly here. He notes that "This sentence is not about dogs" doesn't explode. Only the T-schema makes it explode. Since deflationism says the T-schema is the *essence* of truth, the paradox attacks the essence of their theory. Inflationists can arguably say, "Truth is a real property that *usually* follows the T-schema, but breaks down in pathological cases." Deflationists have less wiggle room because the T-schema is all they have. Dan identifies the pressure point accurately.

  **(4) Maya: The T-schema is the explanation. Inflationists have extra metaphysical baggage with no payoff.**
  *   **Verdict:** **Maya is right.**
  *   **Reasoning:** This is an appeal to parsimony (Occam's Razor). If the T-schema causes the problem, and inflationists *also* use the T-schema, they have the same problem *plus* the burden of explaining what this mysterious "property" of truth actually *is* (correspondence to facts? ideal assertibility?). If positing a "property" doesn't solve the Liar, it's theoretically expensive for no benefit. Maya wins the point on theoretical economy.

  **(5) Dan: Truth is a goal of inquiry. You can't aim at a logical device.**
  *   **Verdict:** **Dan is right.**
  *   **Reasoning:** This is the strongest objection to deflationism (often called the "Normativity Objection"). We value truth; we criticize false beliefs; science *aims* at truth. Logical devices (like the word "if" or the symbol "+") are tools, not goals. You don't play chess to maximize the use of the "+" sign in the notation. If truth is merely a device for generalization, it's hard to explain why it has *value* or *normative force*. Maya has not yet answered this well.

  **(6) Maya: We aim at content, 'true' just generalizes. / Dan: You can't eliminate the word in generalizations. / Dan: Deflationism is unfalsifiable.**
  *   **Verdict:** **Split Decision.**
  *   **Reasoning:**
      *   **On the "Aim":** Maya is right. We want the world to be a certain way. "True" allows us to bundle those desires (e.g., "I want all my beliefs to be true").
      *   **On "Elimination":** Dan is right. Deflationists claim 'true' is eliminable (you can rewrite the sentence without it). But in cases like "Everything he said is true," you can't easily rewrite that without the word 'true' unless you use infinite conjunctions (which humans can't do) or complex quantification into sentence positions (which is technically messy). Dan is correct that the "device" does heavy lifting that isn't easily deleted.
      *   **On "Unfalsifiable":** Dan is wrong here, rhetorically. Philosophical theories aren't "falsifiable" like physics. However, his point stands that deflationism risks being vacuous if it just re-labels every function of truth as "device work."

  ---

  ### What Both of Them Are Missing

  While they did an impressive job, they are fighting a war with half a map. Here is what is missing from their BBQ exchange:

  **1. They assume Classical Logic is non-negotiable.**
  Both Maya and Dan assume the Law of Excluded Middle (every sentence is either true or false) and Bivalence. The most popular solution to the Liar Paradox among logicians today is to **change the logic**.
  *   **Paracomplete theories:** Some sentences (like the Liar) are neither true nor false.
  *   **Paraconsistent theories:** Some sentences can be both true and false without exploding the system.
  If they adopted either of these, Move (1) and (3) dissolve. The "device" can handle the Liar if you tweak the rules of the device.

  **2. They are treating "Deflationism" as a monolith.**
  Maya is arguing for **Disquotationalism** (Quine's version: 'true' is just for removing quotes). But there is also **Minimalism** (Horwich's version: truth is a property, just a very thin, trivial one) and **Pro-sententialism** (Grover's version: 'true' acts like a pronoun, not a predicate).
  *   If Maya were a Minimalist, she could concede to Dan in Move (5) that truth *is* a property we aim for, it's just not a *metaphysically heavy* property. Dan's objection lands on Disquotationalism but bounces off Minimalism.

  **3. The "Value of Truth" needs an instrumental account.**
  In Move (5), Dan claims you can't aim at a device. Maya fumbles this. The missing deflationist response is **Instrumentalism**. We don't value the device; we value what the device *gets us*.
  *   *Analogy:* We don't aim at "money" as a piece of paper (the device); we aim at what money buys. Similarly, we aim at "true beliefs" because true beliefs help us navigate the world successfully. The deflationist can explain the *value* of truth without positing a mysterious *property* of truth.

  **4. Dan's "Unfalsifiable" charge is a category error.**
  In Move (6), Dan claims deflationism is unfalsifiable. In philosophy of language, theories aren't tested by observation (falsification); they are tested by **explanatory power** and **coherence**.
  *   The real critique isn't "you can't prove me wrong," it's "does your theory explain *more* with *less*?" Maya is winning on "less" (parsimony), but Dan is winning on "explain more" (normativity/goals).

  ### Final Ruling

  **Winner:** **Draw, with advantages.**

  *   **Maya wins on Metaphysics:** She successfully defends the idea that we don't need a "heavy" property of truth to make sense of language. Dan failed to prove that truth *must* be a substantive property.
  *   **Dan wins on Normativity:** He successfully identified that deflationism struggles to explain why truth is a *goal* worth pursuing. Maya's response was a bit dismissive.

  **Referee's Recommendation:**
  Tell them to order another round. Maya needs to read Paul Horwich on *Minimalism* to handle Dan's "goal" objection. Dan needs to read Hartry Field on *Saving Truth from Paradox* to see how deflationists handle the Liar without collapsing. They are both half-right, which is the standard state of affairs in philosophy.
