          *   *Evaluation:* This is a stronger point. If deflationism identifies truth *exhaustively* with the T-schema, and the T-schema leads to contradiction, deflationism is in trouble. However, inflationists also rely on the T-schema. Dan is implying inflationists can restrict the T-schema while keeping the "property."
