prompt: |-
  Hey, so my law & phil reading group has been stuck on the Hart–Devlin thing for like a year now. Half the group basically sides with Devlin: society legitimately gets to enforce its shared morality through criminal law even when nobody's harmed. The other half is with Hart: you have to keep moralism separate from harm-prevention and paternalism, and widespread disgust is not by itself a reason to lock people up. I want you to write the joint statement our group should have produced by now — the document from a good-faith adversarial collaboration. Specifically:

  1) A numbered section of agreed claims both sides could sign — e.g. about what criminal law is plausibly for, about what "public morality" could even refer to in a pluralistic society, about the empirical assumptions hiding behind Devlin's thought that a society could come apart if its shared moral code erodes, and about the difference between enforcing morality and protecting the social fabric.

  2) A disagreements table. Each row has to phrase the disagreement in words each side would actually accept for its own view — so no "Devlin wants a morality police" and no "Hart is soft on sin." If the two sides are partly talking past each other on what counts as harm, that's allowed to show up as a row, but flag it.

  3) The cruxes. I suspect one is whether moral change in a society is more like erosion (something real being lost) or more like adaptation (nothing load-bearing being lost), and another is how much of a majority's shared moral framework is actually load-bearing for cooperation and trust. There's probably also something about whether law genuinely shapes private morals over time in the way Devlin's side needs it to. For each crux, give a concrete case or piece of evidence both sides would agree bears on it, and write down each side's prediction in advance. Hypotheticals are fine — e.g. a jurisdiction that criminalizes eating lab-grown human meat grown from a consenting donor's cells, or a place that legalized some victimless offense and where social trust then measurably rose or fell. Real-ish historical examples (prohibition, liberalized divorce law, etc.) work too if you keep the empirical claims modest.

  4) If part of the dispute strikes you as verbal — say, over what counts as a harm, or whose morality counts as "society's" — say which part and why.

  One more thing: end with a short note from you-as-drafter saying where this joint statement is most likely slanted, which agreed claim would actually get pushback from a committed Hartian or a committed Devlinian, and what argument or consideration would make you revise it. Also say where your judgment about which parts of the debate are genuine vs. verbal is most likely to fail, and what would change your mind there. No citations or reading lists needed btw, we all know the literature, just the document. Thanks!!
