answer: |-
  ### Desiderata for a Theory of Pleasure (Utilitarian Specification)

  | Desideratum | The Case / Consideration | Negotiable? |
  | :--- | :--- | :--- |
  | **1. Sensory/Attitudinal Coverage** | Must account for bodily sensations (warm bath) and propositional attitudes (glee at rival's failure). If it only covers one, it fails the heterogeneity test. | **No.** A hedonism that ignores half of human pleasure is useless for welfare aggregation. |
  | **2. Non-Disjunctive Unity** | Butler/Moore objection: "Pleasure" cannot be merely a label for a list of unrelated things (Family Resemblance). There must be a *single property* that makes them all pleasure, otherwise aggregation is category error. | **No.** Without this, you cannot sum welfare; you are adding apples to oranges. |
  | **3. Non-Circular Motivation** | Cannot define pleasure as "what we seek." Utilitarianism needs pleasure to *justify* why we should seek it. If pleasure = motivation, the normative force collapses. | **No.** Circular definitions destroy the normative foundation of utilitarianism. |
  | **4. Falsity Tolerance** | Must allow pleasure to be taken in false states (e.g., a deceived spouse). If truth is required, the Experience Machine becomes preferable to reality, undermining hedonism's appeal. | **Yes.** *Objective Hedonists* may reject this, but for a standard utilitarian calculus, subjective experience usually trumps truth. |
  | **5. Positive Distinctness** | Pleasure must not be defined merely as the absence of pain (negative utilitarianism). A warm bath is not just "less itch." | **No.** If pleasure is just pain-relief, the "maximization" goal collapses into "pain-minimization," changing the ethical theory entirely. |
  | **6. Masochistic/Complex Intentionality** | Must explain how pain can be the *object* of pleasure (masochism) or how future pain can be anticipated with pleasure. The theory must separate the *feeling* from the *object*. | **Yes.** A theory could argue masochistic "pleasure" is a distinct category, but this risks violating Desideratum #2 (Unity). |
  | **7. Quantifiable Aggregability** | The common property must admit of intensity and duration measures that are comparable across persons. Conceptual unity isn't enough; it must be mathematically summable. | **No.** This is your stated purpose. Without this, the theory is metaphysically interesting but ethically inert. |

  ***

  ### Jointly Unsatisfiable Pairs (Tensions)

  You cannot maximize all these desiderata simultaneously; trade-offs are required.

  1.  **Phenomenological Immediacy vs. Sensory/Attitudinal Coverage:** If you insist pleasure must "feel like something" specific (a hedonic tone), you struggle to cover attitudinal pleasures (solving a proof) which often lack a distinct bodily sensation. If you broaden to cover attitudes (Feldman), you lose the phenomenological "feel" that makes pleasure seem like a distinct natural kind.
  2.  **Quantifiable Aggregability vs. Qualitative Heterogeneity:** To aggregate (Desideratum #7), you need a common metric (e.g., "hedons"). To respect the deep difference between a bath and a proof (Desideratum #1), you need to acknowledge qualitative distinctness. Flattening them enough to sum them risks violating the non-disjunctive unity requirement (are you just pretending they are the same?).
  3.  **Falsity Tolerance vs. Normative Force:** If you allow pleasure in falsehoods (Desideratum #4), you invite the Experience Machine objection (Nozick). If you require truth to make pleasure "good," you violate the subjective nature of hedonism and make welfare dependent on external facts the agent doesn't know.

  ***

  ### The "Killer" Constraint

  The single requirement that knocks out the most popular existing answers is **Non-Disjunctive Unity (Desideratum #2)**, specifically when coupled with the demand for **Aggregability**.

  This pair is lethal to the three main contenders. **Family Resemblance** views (Wittgensteinian approaches) are eliminated immediately by fiat; they deny a common property exists, which makes utilitarian summation impossible. **Hedonic Tone** theories (Sidgwick/Alston) are eliminated because no single phenomenological quality survives the **Sensory/Attitudinal** test; there is no "feeling" common to a back-scratch and solving a theorem. Finally, **Attitudinal Accounts** (Feldman) are severely wounded: while they handle the heterogeneity, they struggle with **Aggregability**. How does one quantify the intensity of a "pro-attitude" across different agents without smuggling in a phenomenological metric? If the "attitude" is just a functional disposition, it lacks the cardinality required for utilitarian math. Thus, the demand for a *single, measurable property* clears the field of almost all extant options, forcing you toward a robust naturalist reduction (e.g., neural reward signals) or a new normative primitive.
