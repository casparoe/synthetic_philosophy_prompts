          *   *The "Clean Hands" Argument:* The "Misleader is worse" argument (Side C) has almost no legal traction. Law prefers technical compliance. If it's in the Disclosure Schedule, it's disclosed. Philosophy might see this as manipulative; Law sees it as risk allocation.
