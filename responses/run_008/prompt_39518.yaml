  ### Investigator's Note: Conceptual Refinement

  Before formalizing the proposal, I have sharpened the core intuition to ensure it is tractable for formal modeling and distinct from existing literature.

  **1. From "Timing" to "Endogenous Participation":**
  "Timing as a signal" is the intuitive hook, but in game-theoretic terms, this is a problem of *endogenous timing of moves*. Standard herding models (e.g., Bikhchandani et al.) treat the order of agents as exogenous. If agents choose *when* to act based on their private confidence, the timing itself becomes a costly signal. A "meta-cascade" occurs if agents infer information not just from *what* predecessors predicted, but from the fact that they chose to act *now* rather than wait. This is modelable using signaling game frameworks where the "message" is the pair $(t, \hat{p})$ (time, probability).

  **2. The Sterilization Problem:**
  Your hypothesis is that simultaneity cannot be enforced because metadata leaks. The formal question is not just "does leakage exist?" (obviously yes), but "does rational inference on leakage *sustain* inefficient equilibria?" If rational agents can fully discount the timing signal, the cascade breaks. If the timing signal is correlated with private information in a way that creates a new informational externality, the cascade persists. We need to determine which equilibrium obtains.

  **3. Alternative Framing:**
  A competing hypothesis is that this is not a rational cascade but a *reputation cascade*. Forecasters might herd to avoid standing out as outliers if they are wrong. However, your observation about "lurkers" and "edit timing" suggests an information aggregation failure rather than pure reputation management. I will frame the project to distinguish between these: if timing drives the effect, it's informational; if identity drives it, it's reputational.

  **4. Viability:**
  This is tractable. We can adapt standard sequential learning models to allow endogenous arrival rates. The empirical component is your unique advantage: most theory lacks timestamped, individual-level forecast data.

  ***

  ### Grant Proposal: Endogenous Participation and the Limits of Cascade Mitigation in Forecasting Communities

  **Project Title:** The Unsterilizable Sequence: Modeling Endogenous Timing Signals in Collective Forecasting

  **Research Question**
  Standard models of information cascades assume an exogenous sequence of decisions or perfect simultaneity. In real-world forecasting communities, however, the decision of *when* to update a forecast is endogenous and observable. This project asks: **Does the informational content of participation timing create robust "meta-cascades" that persist even when standard mitigation mechanisms (anonymity, batched revelation) are employed?**

  Specifically, we seek to determine if rational inference on the *timing* of contributions can sustain inefficient herding equilibria. If the timing of a forecast conveys private confidence (e.g., early movers signal high confidence; late movers signal uncertainty), successors may rationally ignore their own private signals in favor of the "timing signal," recreating the cascade through a metadata channel that interface design cannot easily block.

  **Background and Gap**
  The literature on rational herding establishes that when agents observe predecessors' actions but not their private signals, information aggregation can fail. The standard prescription is to obscure the sequence (simultaneous revelation) or obscure the identity (anonymity). However, these solutions rest on the assumption that the *action* is the only carrier of information.

  In digital forecasting environments, the *context* of the action (timestamp, edit frequency, latency relative to event news) is also observable. Existing theory largely treats order as fixed. There is a gap in understanding how *endogenous timing* interacts with social learning. If agents strategically delay to observe others, or rush to signal confidence, the "sequence" is never truly sterilized. Current platform interventions are built on the assumption that hiding the *content* of early forecasts is sufficient. This project challenges that assumption by testing whether the *existence* of early participation is itself a sufficient statistic for herding.

  **Methodology**
  This nine-month project employs a triangulated approach: formal modeling, agent-based simulation, and empirical validation.

  *Months 1–3: Formal Modeling*
  We will construct a game-theoretic model of sequential forecasting with endogenous timing. Agents receive a private signal and choose a time $t$ and a probability estimate $p$. The cost function will include a penalty for inaccuracy and a "timing cost" (e.g., opportunity cost of waiting). We will solve for Perfect Bayesian Equilibria to determine conditions under which timing signals dominate private signals. The key deliverable is a theorem specifying the parameter space where "meta-cascades" are rationally sustainable despite anonymized, batched revelation.

  *Months 4–6: Agent-Based Simulation (ABS)*
  Closed-form solutions may require restrictive assumptions (e.g., binary states). We will build an ABS to relax these, allowing for continuous probabilities, heterogeneous agent confidence, and network structures. We will simulate various "sterilization" protocols (e.g., hiding forecasts until a deadline) and introduce "leaks" (e.g., revealing login timestamps). This will quantify the magnitude of the effect: does the timing signal merely add noise, or does it fundamentally collapse the wisdom of crowds?

  *Months 7–8: Empirical Analysis*
  We will analyze timestamped data from the applicant's forecasting community (approx. 300 members, 3 years of data). We will look for "clumping" in update times that correlates with convergence in probability estimates, controlling for external news shocks. Specifically, we will test if forecasts submitted immediately after a high-status member's update show higher variance reduction than those submitted after a "quiet" period, controlling for the information content of the update itself. This provides ecological validity to the theoretical models.

  *Month 9: Synthesis and Reporting*
  We will integrate findings into a white paper for the foundation and a preprint for the economics/epistemology community. The report will include specific design recommendations: if timing signals are robust, we will propose normative interventions (e.g., forced random delay) rather than just interface changes.

  **Success and Failure Criteria**
  *Success:* The model identifies a stable equilibrium where timing signals sustain cascades even under simultaneous revelation conditions, and the empirical data shows statistical evidence of timing-driven correlation in forecasts. This would prove that current platform mitigations are theoretically insufficient.

  *Failure (Type I):* The model shows that rational agents fully discount timing noise in equilibrium. If so, observed cascades are likely due to bounded rationality or cognitive bias, not structural information failure. This is a valuable negative result, shifting the intervention focus from mechanism design to user training.

  *Failure (Type II):* The timing effect exists in theory but is empirically negligible (effect size < 5% of variance). This would suggest that while the "meta-cascade" is theoretically possible, it is not a priority for funding compared to other friction points. We will commit to publishing this null result to prevent wasted investment in unnecessary platform complexity.

  **Justification for Theoretical Approach**
  A foundation might ask: why fund modeling when you could simply redesign the platform to enforce strict simultaneity?

  First, **mechanism design without bounds is inefficient.** If the "leak" is fundamental to the nature of participation (i.e., the choice to participate is itself a signal), no UI redesign can fix it without destroying community engagement (e.g., by forcing random delays that frustrate users). We need to know *if* the problem is structural before engineering a solution.

  Second, **external validity.** Most platform redesigns are tested in isolation. A formal model allows us to stress-test interventions against adaptive agents who might find new ways to signal (e.g., encoding information in edit frequencies). Theory provides the adversarial test that A/B testing cannot.

  Third, **generalizability.** A platform-specific fix helps one community. A formal characterization of endogenous timing herding applies to financial markets, policy committees, and scientific consensus building. Funding the theory amplifies the impact beyond a single software deployment.

  **Conclusion**
  Forecasting communities are among our best tools for aggregating dispersed information. If they are vulnerable to "meta-cascades" driven by the metadata of participation, our confidence in their outputs is misplaced. This project offers a rigorous check on the limits of collective epistemics, ensuring that our interventions target the root structure of information flow rather than its surface presentation.
