  7.  **Final Polish:** Ensure the structure follows the prompt's requirements (Restate -> Map -> Residue -> Verdict). (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note on "Quality"):* In contract law, "Quality" (Truthfulness) is tricky. A breach of contract isn't necessarily a lie. It's more about the *Implied Covenant of Good Faith and Fair Dealing*. I need to make sure I don't conflate fraud with breach.
  *(Self-Correction on "Cancellation"):* A merger clause cancels *prior* negotiations. Gricean cancellation is usually simultaneous ("He's a fine friend, but..."). I need to note the temporal disconnect.

  8.  **Finalizing the "Residue":** The key insight is that Contract Law *abandons* the search for actual speaker meaning in favor of *reliance protection*. Grice is about successful transmission of thought; Contract Law is about allocation of risk. That's the fundamental divergence.

