      *   **The Trigger:** A specific case where a judge found a clause "clear and unambiguous" despite conflicting credible testimony from negotiators about intent. Neither lawyer found this strange.
      *   **The Friend's Claim:** Contract interpretation is "applied Grice" (Paul Grice, philosopher of language). Courts ask what a "reasonable person" understands = what the drafter *implicated* but didn't say. Interpretive canons = Maxims of Conversation.
      *   **The Task:**
          1.  Restate Grice's account (Cooperative Principle, Maxims, Speaker Meaning vs. Sentence Meaning) in *contract law vocabulary*.
          2.  Map Grice's Maxims to specific interpretive canons (Quantity $\rightarrow$ Surplusage, etc.) and identify where the mapping bends/breaks.
          3.  Address specific questions: Quantity/Surplusage exceptions? Conventional vs. Conversational Implicature vs. Express/Implied terms? Implicature Cancellation vs. Merger Clauses?
