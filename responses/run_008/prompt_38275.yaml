  1. **Reconstruction of Candidate Laws**

  Based upon your table, three distinct laws of moral verdict are consistent with the data provided. I have formulated them as follows:

  *   **Law I (The Actual Spectator):** The verdict is fixed by the sympathy of spectators actually present, provided they are fully informed of the agent's motives and circumstances.
  *   **Law II (The Impartial Spectator):** The verdict is fixed by the sympathy of an ideal, well-informed, and calm spectator (the 'man within the breast'), regardless of whether actual spectators are present or informed.
  *   **Law III (The Conscience):** The verdict is fixed by the sentence the agent passes upon himself when he examines his own conduct.

  **Exclusions:**
  None of your four rulings strictly excludes any of these laws. In every instance you have recorded, the three candidates converge.
  *   In **Ruling 1** (the soldier), the actual spectators (assuming they are composed enough to judge), the impartial spectator, and the soldier's own conscience all agree in admiration.
  *   In **Ruling 2** (resentment), the spectators, the ideal judge, and the injured party (if proper) agree on the proportionality.
  *   In **Ruling 3** (beneficence), the motive is known to the spectators, so their sympathy aligns with the impartial view, and the agent feels the fellow-feeling.
  *   In **Ruling 4** (character), the propriety is visible to all, and the agent of mere propriety is presumably satisfied with his correctness.

  Consequently, your table describes a state of moral equilibrium. It cannot distinguish between these laws because it contains no case of divergence—no instance where the crowd is mistaken, the agent is deluded, or the spectator is absent.

  2. **Predictions on the New Cases**

  **Case A: The Widow**
  *   **Verdict:** Smith's approbation would be one of **affection** (the register owed to the 'amiable').
  *   **Reasoning:** Her motive is 'plain fellow-feeling'. According to your Ruling 3, beneficence performed from lively fellow-feeling is amiable. While keeping silence for fifteen years implies self-command, you specify there is 'no vanity in it'. Smith reserves **admiration** (Ruling 4) for cases where there is a passion to subdue. If vanity is absent, there is no struggle, and thus no ground for the higher register of admiration.
  *   **Absence of Spectators:** The total absence of spectators does not diminish the merit. Smith distinguishes sharply between being *praised* and being *praise-worthy*. She is fully praise-worthy. The 'man within the breast' approves even if the world never knows. Indeed, Smith suggests that acting solely for the sake of the impartial spectator is the highest evidence of virtue. Her act is praise-worthy though it can never be praised.

  **Case B: The Administrator**
  *   **Verdict:** Smith's approbation would be one of **cool esteem** (the register owed to the 'merely proper').
  *   **Reasoning:** The outcome is beneficial, and the action is proper in its effects. However, the motive is not benevolence but the 'pleasure of arranging men'. This aligns with your Ruling 3: a act performed from a 'cold sense of what is proper' (or in this case, a love of system mistaken for benevolence) possesses correctness but engages affection less. It lacks the warmth required for the 'amiable'. It does not involve the subduing of passion required for 'admiration'.
  *   **Nuance:** Smith is wary of the 'man of system'. However, as your case specifies that 'no one is ruined' and relief improves, the action retains propriety. The verdict is not disapproval, but it is distinctly cooler than that accorded to the widow.

  3. **Underdetermination and Guessing**

  Your table underdetermines the answer because it lacks a case where the **Impartial Spectator (Law II)** and the **Agent's Conscience (Law III)** diverge. In your four rulings, the agents are morally competent; their self-assessment matches Smith's.

  In **Case B**, however, they diverge. The administrator believes himself sincerely to be a benefactor (Conscience approves warmly). The Impartial Spectator, seeing the true motive is a love of system rather than fellow-feeling, approves only coolly.

  My prediction above **guesses** that Smith prioritises **Law II (The Impartial Spectator)** over Law III. I assume Smith will judge the agent by the true nature of his motives as seen by the ideal spectator, rather than by the agent's sincere but mistaken self-conception. While Smith acknowledges the sincerity of such men, he denies them the merit of benevolence. This is a guess only in the sense that your table provided no data on deluded agents; it relies on extrapolating Ruling 3 (motive determines affection) to a case where the agent misunderstands his own motive.

  4. **A Further Case to Separate the Laws**

  To decisively separate **Law II (Impartial Spectator)** from **Law III (Conscience)**, I propose the following case, constructed in Smith's manner:

  **The Case of the Zealous Father:**
  A father, deeply convinced of his religious duty, punishes his young child with severe corporal correction for a trivial inadvertence (such as spilling milk). He acts without anger, purely from a sincere belief that this severity is necessary for the child's moral salvation. He feels no resentment, only a solemn sense of obligation. His conscience (Law III) approves entirely; he feels he is doing his duty.

  **What this would show:**
  *   **If Law III holds:** The act is approved, for the agent's self-sentence is positive.
  *   **If Law II holds:** The act is disapproved. According to your **Ruling 2**, resentment and punishment are approved *only* when they answer the injury in degree. The Impartial Spectator sees the punishment as excessive relative to the fault, regardless of the father's sincerity.

  Smith's verdict would be disapproval. This would demonstrate that the agent's sincere self-approbation is insufficient for moral virtue; the propriety of the motive and action must withstand the scrutiny of the Impartial Spectator. This separates the Conscience law from the Impartial Spectator law, confirming the guess required for Case B.
