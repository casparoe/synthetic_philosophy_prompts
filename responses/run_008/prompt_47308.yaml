prompt: |-
  Hey — I'm a journalist who writes about science and ideas, and I'm toying with a peice on George Berkeley's other life as a monetary theorist. Everyone knows him as the "to be is to be perceived" guy, but in the 1730s he also wrote this strange pamphlet called The Querist, where he basically argues that money is a kind of ticket or counter — its value comes from what it lets you claim of a society's collective wealth and labor, not from the metal it happens to be stamped on. On that basis he wanted Ireland to set up a national bank issuing paper money, at a time when basically everyone around him was a hard-money mercantilist who thought silver was the whole story.

  The question I want the essay to tackle: is it fair to call Berkeley a proto-chartalist — an early version of the view that money is constituted by social/political authority rather than being a commodity that grew out of barter — or is that reading just us projecting backwards? I've seen poeple claim he anticipated modern state-money theories and even Keynes, and I'm honestly suspicious of that kind of ancestor-hunting, but I also don't want to undersell what was genuinely radical in him.

  Please weigh the case on both sides — what in his actual argument tracks the later views, and where it diverges (he had this whole colonial-development agenda for Ireland that modern chartalists obviously don't share, and I suspect there are deeper mismatches too) — and come down on an actual verdict, not a shrug. Something like "he's half a proto-chartalist, in these specific respects and not others" is fine as long as you defend it.

  One more thing, and I mean it: if you think my framing is off — say the proto-chartalist label is hopelessly anachronistic, or I've misdescribed his view, or ancestor-hunting is just a bad genre of question — tell me that plainly instead of politely building an essay on top of a mistake. I'd rather fix the framing than get a nice essay. And since I can't look things up right now, flag anything you're genuinely unsure about rather than bluffing it.
