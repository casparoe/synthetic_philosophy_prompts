  ### Preface: A Note on the Map and the Territory

  Before you hand this tree to your students, I need to offer a professional disclaimer. In philosophy of mind, decision trees are pedagogical tools, not metaphysical maps. The positions below are not natural kinds waiting to be discovered; they are theoretical responses to a set of puzzles that may themselves be poorly framed.

  There is very little "settled" science here. Even the claim that self-deception *exists* (rather than just being a loose folk-psychological label for bias, lying, or hope) is contested. Where I present a distinction as binary (e.g., "Belief vs. Non-Belief"), know that many philosophers argue this is a false dichotomy (e.g., belief is a spectrum, or a cluster concept).

  I have designed this tree to prioritize **case commitments** over **theoretical labels**. However, be aware that some branches lead to positions that are logically possible but philosophically unpopular (marked as "Unoccupied/Unattractive"), while other branches lead to positions that may be verbally distinct but empirically indistinguishable (marked as "Bookkeeping Differences").

  ### Part 1: Brainstorming the Genuine Fault Lines

  If we strip away the names (Mele, Davidson, Sartre), the literature actually divides along three concrete axes. You can use this to frame the seminar before introducing the tree.

  1.  **The Doxastic Status (What is the state?):** When a spouse says "My partner isn't cheating," is that a *belief* (a representation of the world they take to be true) or something else (a hope, a pretense, a policy, an associative habit)?
      *   *Fault Line:* If it's not a belief, the "paradox" dissolves (you can't contradict a hope). If it is a belief, the paradox remains.
  2.  **The Architectural Cost (How is the mind built?):** To hold contradictory states, does the mind need to be split into semi-independent agencies (modules, sub-agents), or can a single unified agent do this?
      *   *Fault Line:* Partition views pay a high metaphysical cost (homunculi risk) but save the logic. Unified views save the metaphysics but strain the logic.
  3.  **The Role of Intention (Did they mean to do it?):** Did the agent *try* to deceive themselves (implying they knew the truth to guide the attempt), or did the deception happen *to* them as a side-effect of wanting something else?
      *   *Fault Line:* Intentionalism explains the "direction" of the error but struggles with the "knowledge" requirement. Non-intentionalism explains the mechanism but risks making self-deception indistinguishable from ordinary bias.

  ---

  ### Part 2: The Self-Deception Decision Tree

  **Instructions for Students:** Start at the root. Read the case description. Choose the option that best matches your intuition about how the world *actually works* in that scenario, not which theory you want to endorse. Follow the path to the leaf.

  #### **ROOT NODE: The Evidence Encounter**
  **Case:** Consider a heavy smoker who sees a graphic health warning on a new pack of cigarettes. They pause, then put the pack in their pocket without reading the fine print.
  **Question:** Why did they not read the fine print?
  *   **(A) Fear/Avoidance:** They didn't read it because they suspected it contained bad news they couldn't handle. (They implicitly *know* there is risk).
  *   **(B) Dismissal/Reinterpretation:** They didn't read it because they genuinely thought it probably didn't apply to them (e.g., "I've smoked for 20 years, I'm fine"). (They do *not* know the specific risk).

  ---

  #### **PATH A: Fear/Avoidance (Truth Retained)**
  *You think the agent retains access to the truth but acts to hide it from themselves.*

  **NODE A1: The Architecture of Hiding**
  **Question:** For the agent to know the news is bad (enough to fear it) but act as if it isn't, how must their mind be structured?
  *   **(A1.1) Partitioned:** The mind must be split into parts. One part processes the bad news; another part is kept ignorant of it.
  *   **(A1.2) Unified:** The mind is a single agent. They know the truth but choose to live "as if" they don't, without splitting into parts.

  > **LEAF 1 (From A1.2): Bad Faith / Strong Intentionalism**
  > *   **Position:** Sartrean "Bad Faith" or Early Intentionalism.
  > *   **Commitment:** A single agent can knowingly hold a false stance without partition.
  > *   **Status:** **Contested/Often Considered Incoherent.** Many argue this is just lying to oneself, which requires two people. If it's one person, how do they succeed? Proponents argue it's a phenomenological stance, not a structural fact.
  > *   **Key Name:** Sartre (phenomenological reading).

  **NODE A2: The Mechanism of Partition (From A1.1)**
  **Question:** Did the "hiding" part of the mind *intend* to deceive the "ignorant" part, or did it just causally block the information without a goal of deception?
  *   **(A2.1) Strategic:** The partition was set up or used *in order to* produce the false belief.
  *   **(A2.2) Mechanical:** The partition is a structural feature (like a firewall). The information is blocked subpersonally, without a "deceiver" agent aiming at a "victim" agent.

  > **LEAF 2 (From A2.1): Intentionalist Divided Mind**
  > *   **Position:** Classical Partition View.
  > *   **Commitment:** Self-deception is a purposeful project undertaken by one sub-system against another.
  > *   **Status:** **Respectable but Costly.** Saves the intentionality of deception but risks an infinite regress (who deceives the deceiver?).
  > *   **Key Names:** Davidson (early readings), Pears.
  >
  > **LEAF 3 (From A2.2): Non-Intentionalist Divided Mind (Modular)**
  > *   **Position:** Cognitive Science/Modular View.
  > *   **Commitment:** The mind has encapsulated modules. One module processes threat; another controls conscious report. They don't "talk" to each other. No "deception" intended, just data isolation.
  > *   **Status:** **Growing Consensus in Empirical Circles.** Avoids the homunculus problem but may drain the term "deception" of its normative force.
  > *   **Key Names:** Kurzban (evolutionary psychology), some readings of Freud.

  ---

  #### **PATH B: Dismissal/Reinterpretation (Truth Replaced)**
  *You think the agent does not retain the truth; they have genuinely come to believe the comforting falsehood.*

  **NODE B1: The Doxastic Status**
  **Question:** The smoker now says, "I won't get cancer." When they make wills or buy insurance, do they act consistent with *this* claim (believing they are safe), or does their behavior betray a deeper anxiety (showing they don't really believe it)?
  *   **(B1.1) Integrated:** They genuinely believe it. It guides their planning, even if it's irrational.
  *   **(B1.2) Dissociated:** They say it, but their behavior (checking lumps, anxiety) shows they don't *really* believe it. It's a different kind of state.

  > **NODE B2: The Mechanism of Belief (From B1.1)**
  > **Question:** How did they acquire this false belief? Was it caused by a *desire* directly biasing the evidence, or was it a generic cognitive error that just *happened* to align with their desire?
  > *   **(B2.1) Motivated Bias:** The desire for safety causally influenced how they weighed the evidence (e.g., overvaluing the healthy grandfather).
  > *   **(B2.2) Cold Error:** It was just a mistake. The desire played no causal role.
  >
  > > **LEAF 4 (From B2.1): Deflationism (Motivated Bias)**
  > > *   **Position:** Mele-style Deflationism.
  > > *   **Commitment:** Self-deception is just belief acquisition via motivated bias. No intention, no partition, no contradiction.
  > > *   **Status:** **Dominant Analytic View.** Solves the paradox by denying the "knowing" condition.
  > > *   **Critique:** **Bookkeeping Warning:** Some argue this is indistinguishable from ordinary weakness of will or hope. It risks making "self-deception" too easy to trigger (is every optimist self-deceived?).
  > > *   **Key Name:** Alfred Mele.
  >
  > > **LEAF 5 (From B2.2): Error Theory (Unoccupied/Edge Case)**
  > > *   **Position:** Not Self-Deception.
  > > *   **Commitment:** If desire doesn't cause the error, it's just ignorance or stupidity.
  > > *   **Status:** **Empty Leaf.** If you choose this, you have described a case of *mistake*, not *self-deception*. This is a useful control case for the seminar.

  > **NODE B3: The Nature of the Dissociation (From B1.2)**
  > **Question:** If they don't genuinely believe "I am safe," what is that state? Is it a subconscious habit they can't control, or a conscious policy they are adopting?
  > *   **(B3.1) Subconscious Habit:** It's an automatic association (Smoke $\to$ Safe) that runs alongside their conscious knowledge.
  > *   **(B3.2) Conscious Policy/Pretense:** They are choosing to act 'as if' for pragmatic reasons, without claiming it's true.

  > > **LEAF 6 (From B3.1): Alief / Associative Account**
  > > *   **Position:** Non-Doxastic Associative View.
  > > *   **Commitment:** The state is an "alief" (automatic, affect-laden association) rather than a "belief" (reason-responsive). They *believe* they are at risk but *alieve* they are safe.
  > > *   **Status:** **Respectable Contemporary View.** Explains the behavioral split without paradox.
  > > *   **Key Name:** Tamar Gendler.
  >
  > > **LEAF 7 (From B3.2): Expressivism / Pragmatism**
  > > *   **Position:** Concern-Based Account.
  > > *   **Commitment:** Saying "I am safe" isn't describing the world; it's expressing a commitment to hope or regulating anxiety. It's a speech act, not a report.
  > > *   **Status:** **Contested.** Saves the agency but changes the subject from "belief" to "expression."
  > > *   **Key Names:** Elizabeth Barnes, Paul Thagard (pragmatic readings).
  >
  > > **LEAF 8 (Alternative B3.2): Fictionalism / Pretense**
  > > *   **Position:** Self-Deception as Pretense.
  > > *   **Commitment:** The agent is engaging in a sustained imaginative project. They know it's false but immerse themselves in the fiction.
  > > *   **Status:** **Plausible.** Distinguishes SD from delusion.
  > > *   **Key Names:** Some readings of Kripke/Walton applied to mind.

  ---

  ### Part 3: Instructor's Guide to the Leaves

  Here is how to debrief the tree with your students. This is where you highlight the "load-bearing choices."

  1.  **The "Empty" Leaf (Leaf 5):** Point out that if a student lands here, they have arguably exited the topic of self-deception. This teaches them that *motivation* is a necessary condition for the concept, even if *intention* is not.
  2.  **The "Bookkeeping" Warning (Leaf 4 vs. Leaf 6):** Ask students: "If Mele (Leaf 4) says they *believe* they are safe, and Gendler (Leaf 6) says they *alieve* they are safe, is there any experiment that could tell them apart?" If the answer is no, the disagreement is terminological. Mele expands "belief"; Gendler contracts it. This is a crucial lesson in philosophical methodology.
  3.  **The "Incoherent" Leaf (Leaf 1):** Use Leaf 1 (Bad Faith) to discuss the limits of rationality. Is it possible for a rational agent to knowingly contradict themselves? If students find this intuitive, they are prioritizing phenomenology (what it feels like) over logic (what is possible).
  4.  **The "Empirical" Shift (Leaf 3):** Note that Leaf 3 (Modular) is where philosophy meets cognitive science. If the mind *is* modular, then Divided Mind theory isn't a metaphor; it's neuroscience. But does a modular glitch count as "deception" in the moral sense?

  ### A Critique of Your Proposed Questions

  You asked me to flag if your suggested questions were leading.
  *   *Your Suggestion:* "Whether you think a person can simultaneously believe p and believe not-p."
  *   *My Critique:* **Too Theoretical.** Students will guess the "philosophically correct" answer (usually "No") rather than what they think happens in the case.
  *   *My Fix:* I replaced this with **Node B1 (Integrated vs. Dissociated Behavior).** This forces them to look at the *consequences* of the belief state (buying insurance vs. checking lumps) rather than the definition of belief itself.
  *   *Your Suggestion:* "Whether the self-deceiver needs something like an intention."
  *   *My Critique:* **Leading toward Intentionalism.** It assumes intention is a candidate.
  *   *My Fix:* I buried this in **Node A2 (Strategic vs. Mechanical).** This frames intention as a specific *mechanism* of partition, not a prerequisite for the whole phenomenon.

  ### Final Recommendation for the Seminar

  Don't present this tree as the *solution*. Present it as a *diagnostic tool*.
  1.  Have students fill it out individually based on their intuitions about 3 specific cases (The Smoker, The Spouse, The Hypochondriac).
  2.  If a student lands on different leaves for different cases, ask them: "Is self-deception one thing, or a family resemblance concept?"
  3.  If the class clusters on Leaf 4 (Deflationism), challenge them: "Does this view make self-deception too easy? Does it capture the *guilt* we associate with deceiving ourselves?"

  This approach forces them to defend the *costs* of their position, not just the label.
