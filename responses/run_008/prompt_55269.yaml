  2.  **Deconstruct the Socialist Calculation Debate (SCD):**
      *   **Mises (1920):** Socialism is *impossible in principle*. Without private property in means of production, there are no market prices for capital goods. Without prices, there's no common denominator for rational calculation. You can't compare inputs/outputs efficiently.
      *   **Lange (1930s):** "Market Socialism." Planners can simulate a market. Set prices, observe surpluses/shortages, adjust prices (trial and error). It's an iterative algorithm.
      *   **Hayek (1940s):** The problem isn't just calculation; it's *knowledge*. Information is dispersed, local, transient, and often tacit. Centralizing it is too costly or impossible. The market is a discovery procedure, not just a solver.

  3.  **Translate to ML/Optimization Vocabulary:**

      *   **The Global Problem:** Maximize social welfare (Utility) subject to resource constraints (Production functions, labor, capital).
      *   **Mises's Objection:** You can't even write down the loss function or the constraints properly because the "weights" (prices) for capital goods don't exist. It's like trying to optimize a neural net without a defined loss scale or without knowing the architecture's parameters are trainable. It's an *identifiability* issue.
      *   **Lange's Proposal:** Distributed Optimization.
          *   *Central Node:* Planning Board (Parameter Server).
          *   *Local Nodes:* Factory Managers (Workers/GPUs).
          *   *Algorithm:* Dual Decomposition / Price Mechanism. The center sets prices (Lagrange multipliers), locals optimize given prices, report back supply/demand (gradients/residuals), center updates prices.
          *   *Claim:* This converges to the global optimum.
      *   **Hayek's Objection:** Communication Complexity & Information Structure.
          *   *Latency/Bandwidth:* The state changes faster than the update cycle.
          *   *Quantization:* Local knowledge can't be fully encoded into the messages sent to the center (lossy compression).
          *   *Non-Convexity/Path Dependence:* The "optimum" isn't static; the act of optimization changes the landscape.

  4.  **Drafting the Mapping (Section by Section):**

      *   *Objective Function:* Mises says it's undefined. Lange says it's a social welfare function (aggregated utility). Hayek says it's dynamic and locally defined.
      *   *Constraints:* Resource constraints. Mises says you can't value the resources.
      *   *Algorithm:* Lange proposes an iterative solver (tatonnement).
      *   *Information:* Mises says missing parameters. Hayek says high communication cost + private data.

  5.  **Addressing the "Residue Report" (The Core Analysis):**

      *   *Knowledge Problem -> Communication Complexity:* This is the cleanest map. Hayek = High communication overhead + stale gradients.
      *   *Tacit Knowledge:* This is tricky. In ML, everything is tensors. "Tacit" implies data that exists but isn't logged or is too high-dimensional to transmit. It's like "on-device training data that never leaves the device" but stronger—it's data the node *has* but can't even formulate as a gradient. Maybe "implicit bias" or "architecture-specific heuristics"?
      *   *Whose Objective:* This is the big one. In ML, the loss function is external (given by the user). In Economics, the loss function *is* the aggregation of individual preferences. Mises/Hayek argue you can't aggregate them without the market process. This isn't a modeling choice; it's the *definition* of the problem. ML assumes a global loss exists. SCD questions if a global loss *can* exist without the process.
      *   *ML Insights vs. SCD:*
