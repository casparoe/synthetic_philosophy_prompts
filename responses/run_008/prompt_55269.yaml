  10. **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure to distinguish Mises (impossible) from Hayek (impractical/epistemic). Mises is about the *existence* of the calculation basis (prices). Hayek is about the *transmission* of data.
      *   *Refinement on Tacit Knowledge:* Don't just say "compression." Say "features not selected for transmission." In ML, we select features. Hayek says the relevant features are unknown until the problem is solved. This is like *feature selection* depending on the *model weights*.
      *   *Refinement on Objective:* This is the hardest part. In ML, we minimize validation loss. In Econ, "validation loss" is individual satisfaction. Mises says you can't aggregate satisfaction without prices. So, in ML terms, it's like having $N$ different loss functions $L_1, ..., L_N$ and no agreed-upon weighting scheme to create $L_{global}$. The market *finds* the weights. Planning *assumes* the weights.

