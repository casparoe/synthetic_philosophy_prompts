prompt: |-
  So I'm a novelist — third book, it's about a psychology postdoc whose big finding from grad school just faceplanted in a multi-lab replication attempt, and now she's at a bar arguing with her old advisor about whose fault the whole mess is. I want that argument to actually go somewhere, not just be vibes, and I honestly don't know enough stats to write it myself. You're a philosopher of science who's also spent real time doing applied statistics, so please think carefully before answering — start with a bit of brainstorming about the different angles, then write the essay.

  The question I need settled: when you look at the replication crisis in psychology and biomedical research, is it best understood as a failure of frequentist methods specifically, or as a failure that Bayesian methods would have shared? On the frequentist side I gather the defense goes something like: p-values were never meant to measure evidence strength, and the machinery of error control works fine if you actually use it (preregistration, holding alpha, etc.) — the crisis is people misusing the tool. On the Bayesian side there's the stopping rule thing that I find fascinating: apparently if you just keep collecting data until your result looks good, a Bayesian analysis is (arguably) unaffected because the likelihoods come out the same, while the frequentist p-value gets corrupted by optional stopping. That seems like it cuts right to the heart of what the replication crisis is. But I've also read that Bayesians have their own version of the disease — you can garden-of-forked-paths your priors and model choices just as hard as your frequentist analysis choices, so maybe switching frameworks is just redecorating the burning house.

  The essay should weigh both sides seriously — I don't want a strawman in either direction — and then take a side for my character: when she's drunk-ish at this bar telling her advisor "the whole NHST edifice has to come down," should the novel let her be right, or should the advisor's "you'd have torched the field with sloppy priors too, kid" be the gotcha? If you want to land somewhere hybrid (error control for confirmatory work, Bayesian machinery for exploration, say) that's fine, but commit to it — don't give me a wishy-washy "both have strengths" ending. Also, please be upfront about where your reasoning here is most fragile and what consideration would actually flip you to the other verdict — I need to know if I'm building a plot point on sand.

  At the very end, give me the verdict in machine-readable form: a single line like \answer{frequentist-defended}, \answer{bayesian-diagnosis}, or \answer{hybrid-committee}, with at most a three or four word label inside the braces so I can grep my notes later. No citations or reading lists please, just the arguments themselves. Also don't worry about getting real numbers of failed replications exactly right — paraphrase, don't pretend to quote specific studies.
