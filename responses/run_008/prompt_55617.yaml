answer: |-
  ### Brainstorming the Angles

  Before drafting the essay, here are the core tensions you need to navigate to make the argument feel authentic to both a philosopher and a statistician:

  1.  **The Definition of "Failure":** Is the crisis a failure of *truth-seeking* (we believe false things) or *error-control* (we published things that shouldn't pass the gate)? Frequentists care about the latter (long-run error rates); Bayesians care about the former (degree of belief in this specific case). If the goal is replication (error control), Frequentism is theoretically the right tool, but only if used perfectly.
  2.  **The Stopping Rule Intuition:** This is the strongest Bayesian weapon. In Frequentism, *when* you decide to stop collecting data changes the validity of the p-value. In Bayesianism, only the data collected matters. Since psychologists often peek at data and stop when "significant," Frequentism is structurally vulnerable to common human behavior in a way Bayesianism is not.
  3.  **The "Garden of Forking Paths":** This is the strongest counter-weapon. You don't need to hack the stopping rule to hack a Bayes Factor. You can hack the prior, the model structure, or the inclusion criteria. If the incentive is "publish a strong result," humans will find the dial that turns the result strong, regardless of the mathematical framework.
  4.  **The Binary Cliff:** NHST creates a bright line (p < 0.05). This creates a massive incentive to cross the line. Bayesian evidence is continuous (BF = 3 vs BF = 4). Removing the cliff removes the biggest incentive to cheat.
  5.  **The Sociological Reality:** Methods are embedded in institutions. Preregistration (a Frequentist fix) requires cultural change. Switching to Bayes (a methodological change) requires software and training. Which is harder?

  ***

  ### The Essay: The Edifice and the Arsonist

  The replication crisis is not merely a scandal; it is a stress test for the philosophy of scientific inference. When your character stands at that bar and declares that the Null Hypothesis Significance Testing (NHST) edifice must come down, she is tapping into a debate that has simmered for decades but boiled over in the last ten years. To decide whether she is right, or whether her advisor's cynicism about "sloppy priors" is the ultimate checkmate, we have to distinguish between the *mathematics* of the frameworks and the *incentives* they create.

  **The Frequentist Defense: The Tool Was Never the Problem**
  The advisor's position rests on a rigorous, if somewhat idealized, view of Frequentist statistics. In this framework, a p-value is not a measure of truth; it is a measure of compatibility between data and a null hypothesis under hypothetical repetitions. The machinery is designed for *error control*. If you set alpha at 0.05, you guarantee that, in the long run, no more than 5% of null effects will be falsely declared significant.

  From this vantage point, the replication crisis is not a failure of the math, but a failure of the protocol. The crisis arose because researchers treated p-values as evidence metrics rather than error rates. They engaged in "optional stopping" (collecting data until p < 0.05) and "HARKing" (Hypothesizing After Results are Known). These actions violate the assumptions of the Frequentist contract. If researchers had simply preregistered their sample sizes and analysis plans, the error rates would have held. The advisor's argument is that swapping to Bayesian methods doesn't fix the human tendency to game the system; it just changes the rules of the game. A determined researcher can tune a prior until the Bayes Factor favors their hypothesis, just as easily as they can peek at data until the p-value drops.

  **The Bayesian Critique: Structural Vulnerability**
  Your postdoc character, however, has a stronger structural argument. The Frequentist defense relies on the assumption that researchers *can* and *will* adhere to strict protocols regarding intentions and stopping rules. But the mathematics of Frequentism are uniquely sensitive to the researcher's *intentions*. Two researchers can collect the exact same data, but if one decided in advance to collect 100 participants and the other decided to collect data until significance was reached, their p-values must be calculated differently. This creates a "liability of intention." Since intentions are unobservable and often unconscious, the Frequentist method requires policing thoughts rather than just analyzing data.

  Bayesian methods, grounded in the Likelihood Principle, argue that the evidence in the data should not depend on what the researcher *would have done* had the data been different. If you stop early because the effect looks huge, a Bayesian analysis updates on the data you have. A Frequentist analysis penalizes you for having the option to stop. This makes NHST structurally fragile in a real-world environment where monitoring data is inevitable.

  Furthermore, NHST creates a "binary cliff." The difference between p = 0.051 and p = 0.049 is mathematically negligible, but professionally catastrophic. One gets published; the other goes in a file drawer. This discontinuity creates a massive incentive to push results over the line. Bayesian evidence is continuous. A Bayes Factor of 2.9 is not qualitatively different from 3.1. By removing the bright line, you remove the primary reward structure that drives p-hacking.

  **The Counter-Critique: The Subjectivity Trap**
  The advisor's retort about "sloppy priors" is not a strawman; it is the genuine vulnerability of the Bayesian approach. In a low-power field like psychology, where signal-to-noise ratios are poor, the choice of prior can dominate the posterior. If the incentive is still "publish positive results," researchers will not stop at tuning priors; they will engage in "model hacking," selecting the specific hierarchical structure that yields the most favorable evidence.

  However, there is a key difference in visibility. Tuning a p-value often happens in hidden code or through undisclosed data exclusions. Tuning a prior requires explicit justification. While you can certainly hide behind a "default" prior, the Bayesian framework forces an explicit conversation about assumptions that NHST allows you to bypass with the veil of "objectivity." NHST pretends to be objective while relying on hidden intentions; Bayesianism admits subjectivity while requiring it to be stated.

  **The Verdict**
  So, who wins the argument? The postdoc is right, but not because Bayesian methods are immune to human nature. She is right because NHST provides a *easier* mechanism for self-deception.

  The replication crisis is best understood as a failure of Frequentist methods *in the context of human incentives*. While Bayesian methods share the vulnerability of researcher degrees of freedom, NHST combines that vulnerability with a binary decision threshold and a sensitivity to unobservable intentions. This combination is toxic. It allows researchers to feel objectively correct while violating the very assumptions that make the objectivity possible.

  The advisor is correct that switching frameworks alone won't save the field; sloppy priors would indeed cause damage. But the damage would likely be less systemic than the current crisis. The NHST edifice doesn't just allow arson; it hands out matches and declares them fireproof. The postdoc's demand to tear it down is justified, provided she acknowledges that the replacement requires rigorous transparency, not just new math.

  ***

  ### Fragility and Uncertainty

  As a philosopher of science, I must be upfront about where this reasoning is most fragile. My verdict rests on the assumption that **prior hacking is harder or less rewarding than p-hacking.**

  There is a scenario where I would flip to the advisor's side (`frequentist-defended`): If it turns out that in high-pressure environments, researchers can tune priors and model structures as easily and invisibly as they tuned p-values. If "Bayesian p-hacking" becomes prevalent, then the crisis was never about the math, but about the "publish or perish" incentive structure itself. In that case, the Frequentist defense holds: the tool wasn't broken, the users were, and changing the tool won't fix the users.

  Additionally, my verdict assumes that the goal of science is **evidence accumulation** (Bayesian) rather than **error rate control** (Frequentist). If the primary goal of the literature is to act as a filter that guarantees a low rate of false claims entering the permanent record, Frequentist methods (specifically via preregistered Registered Reports) are theoretically superior because they explicitly control error rates. Bayesian methods do not guarantee error control; they guarantee coherence of belief. If the field decides that controlling the false positive rate is more important than quantifying evidence strength, the Frequentist defense becomes stronger.

  However, given the current state of the literature—where false positives are already rampant due to the misuse of error control—the priority is stopping the bleeding. The binary threshold of NHST is the wound. Bayesian estimation cauterizes it.

  \answer{bayesian-diagnosis}
