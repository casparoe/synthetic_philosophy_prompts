answer: |-
  Here is the scoring based on your two axes: **Harm/Coercion** (physical risk, exploitation of desperation, net negative welfare) and **Meaning/Corruption** (commodification of sacred/intimate/civic goods, loss of intrinsic value).

  ### The Scoring

  **1. Selling a kidney (regulated market)**
  *   **Harm: 7/10** — Even with regulation, major surgery carries inherent medical risk and the choice is almost invariably driven by financial desperation rather than pure altruism.
  *   **Meaning: 4/10** — While body integrity is valued, an organ's primary function is biological utility, which remains intact regardless of who pays for the transfer.

  **2. Selling a vote in a national election**
  *   **Harm: 4/10** — The individual seller faces little physical risk, though the transaction often preys on economic vulnerability to acquire the vote.
  *   **Meaning: 10/10** — Voting is a constitutive act of citizenship that loses its democratic legitimacy entirely when converted into a private commodity.

  **3. Price gouging generators (hurricane)**
  *   **Harm: 9/10** — This transaction explicitly weaponizes life-or-death desperation to extract wealth, leaving the buyer significantly worse off than if the market functioned normally.
  *   **Meaning: 2/10** — A generator is a standard commercial good, and charging market rates does not corrupt the object's function or symbolic value.

  **4. Becoming a paid surrogate**
  *   **Harm: 6/10** — Pregnancy involves significant physical labor and risk, often complicated by power imbalances between the surrogate and the wealthy intended parents.
  *   **Meaning: 8/10** — Reproduction and gestation are deeply tied to notions of kinship and motherhood, which many feel are degraded when treated as a service contract.

  **5. Selling your body for medical experiments**
  *   **Harm: 8/10** — Subjects accept unknown long-term health risks and physical discomfort, historically disproportionately affecting those who cannot afford to refuse.
  *   **Meaning: 3/10** — The body is being used for scientific inquiry, a purpose that aligns with medical utility rather than violating a sacred or intimate boundary.

  **6. Paid designated mourner / professional friend**
  *   **Harm: 1/10** — The work involves minimal physical risk and is a consensual exchange of time for money without exploiting a life-threatening crisis.
  *   **Meaning: 9/10** — Grief and friendship are predicated on authenticity, so monetizing them creates a fundamental contradiction that renders the emotion performative rather than real.

  ***

  ### The Gap Analysis

  The item with the biggest gap between its scores is **(6) the Paid Mourner**, with a difference of **8 points** (1 on Harm vs. 9 on Meaning).

  This gap suggests that our moral intuitions are most conflicted when the transaction is **physically safe but semantically hollow.** It indicates that for a thoughtful reader, the "ick factor" of the mourner job isn't about safety or money, but about the *truthfulness of human connection.* This validates your instinct: the kidney sale is a survival decision (Harm axis), but the mourner job is an existential one (Meaning axis). The gap tells you that a reader will forgive the kidney sale as a tragedy of circumstance, but they will scrutinize the mourner job as a tragedy of character or society.

  ### Where the Axes Come Apart

  You were right to suspect **Vote Selling (2)**. While I scored it, the two axes don't fully capture why it feels repugnant. The issue isn't just "Meaning" (civic duty); it's **Systemic Integrity.**

  Selling a vote harms the *system* even if it doesn't harm the *seller*. The Harm axis usually measures individual welfare (is the seller hurt?), but vote selling is unique because the primary victim is a third party (the public/democracy) who isn't part of the transaction. If you stick strictly to your defined axes, you might underestimate the moral weight of vote selling because the individual harm is low. You may need a third, silent category in your head for "Public Goods" that break when privatized.

  ### The Narrator's Ending: Defensible or Stacked Deck?

  It is **defensible** for your narrator to conclude that the Meaning axis is sentimental nonsense, provided you handle the class dynamics honestly.

  **Why it works:**
  When you are broke and mid-divorce, "meaning" is a luxury good. A narrator who prioritizes the Harm axis (survival, rent, health) over the Meaning axis (authenticity, sacredness) is speaking from material necessity. If she argues that a paid mourner's tears are just as wet as an unpaid ones, and that the recipient gets the comfort they need regardless of the invoice, she is taking a utilitarian stance that fits a character who has been stripped of privileges.

  **Where it becomes a Stacked Deck:**
  It reads as authorial manipulation if the book *proves* her wrong without her noticing. For example, if the mourners she hires are shown to be cruel or indifferent, but she insists the money makes it valid, the reader will see her as deluded. To keep it fair:
  1.  **Validate her utility:** Show the clients *actually* finding relief in the paid service.
  2.  **Validate the reader's doubt:** Show moments where she feels the hollowness herself but suppresses it to survive.

  If she lands on "Harm is all that matters" because she *has* to survive, the reader will empathize even if they disagree. If she lands there because the author wants to make a philosophical point that ignores the emotional cost, it will feel stacked.

  ### Overall Moral Taint Ranking
  *Based on a "fair-minded reader" who weighs both Harm and Meaning equally:*

  1.  **Price gouging generators** (Most repugnant: Predatory harm with no redeeming meaning.)
  2.  **Selling a vote** (Systemic corruption; high meaning violation.)
  3.  **Paid surrogacy** (High stakes on both axes; complex intimacy and risk.)
  4.  **Medical experiments** (High physical risk, low meaning corruption.)
  5.  **Selling a kidney** (High risk, but medically functional; often viewed as a desperate necessity.)
  6.  **Paid mourner** (Least "tainted" by harm, but highest tension on meaning; ultimately feels the most survivable for the protagonist.)
