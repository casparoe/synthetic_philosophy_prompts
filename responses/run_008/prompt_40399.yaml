answer: |-
  This is a fascinating draft, and given your background, you have a unique vantage point on the methodology that most philosophers miss. You're asking for blunt feedback to prepare for a merciless ex-professor, so I will give you exactly that. I'll address your three specific points in order.

  ### 1. Fact Checks

  You need to tighten three specific historical claims before Thursday, or the professor will pounce on them.

  *   **Sidgwick vs. Gurney:** Your memory is half-right, which is dangerous. Edmund Gurney was indeed the primary engine behind the experimental work on hypnotism and telepathy (specifically the *Creery Experiments* and the work leading to *Phantasms of the Living*). Sidgwick was the organizational force and the public face (first President of the SPR), but he was less involved in the day-to-day hypnotic trials than Gurney.
      *   *Crucial Correction:* Gurney died in **1888** (under ambiguous circumstances, likely an accidental chloral overdose). The *Census of Hallucinations* was published in **1894**. Your draft implies Sidgwick ran the Brighton trance experiments *and* the Census. You should distinguish: Gurney led the experimental/telepathy wing; Sidgwick led the organizational and census wing. Acknowledging Gurney's death before the Census publication actually strengthens your point about Sidgwick carrying the torch alone.
  *   **The Statistics:** Be very careful here. The "one in forty" figure is vulnerable. The *Census of Hallucinations* surveyed roughly 17,000 people. About 1,684 reported a hallucination. Of those, a small subset (around 53 cases) were "death-bed visions" coinciding with the death of the person seen.
      *   The SPR argument was not that the rate was 1 in 40, but that the *odds against this coincidence happening by chance* were extremely high (often calculated by them at hundreds of thousands to one).
      *   *Advice:* Do not cite specific numbers like "one in forty" or "tens of thousands" unless you verify them against the *Proceedings of the SPR, Vol. 10*. If you get the number wrong, a scientist in your group (or the professor) will dismiss the whole methodological argument. Better to say: "They found a rate of coincidence that they calculated to be statistically significant against chance," and let the *method* be the point, not the specific p-value.
  *   **Dualism of Practical Reason:** Yes, this is Sidgwick's own term. It appears in *The Methods of Ethics* (specifically the final chapter of Book I and the Conclusion of the book). You are on solid ground here. It is not a later commentary invention.

  ### 2. The "Too Clever by Half" Objection

  The professor is pointing at the distinction between *context of discovery* (why he actually did it) and *context of justification* (why he said he did it).

  *   **The Verdict:** Your argument is textually defensible, but it is incomplete without acknowledging the biographical element. Sidgwick *did* desperately want to believe in an afterlife. He suffered from religious doubt and existential dread throughout his life (see Bart Schultz's biography, *Henry Sidgwick: Eye of the Universe*). He feared that without immortality, the "dualism" couldn't be resolved, and thus ethics was irrational.
  *   **The Nuance:** You don't need to abandon your thesis to accommodate this. In fact, acknowledging it makes you stronger. The professor's critique is that you present Sidgwick as a cold logic machine deducing ghost-hunting from ethics.
      *   *Fix:* Add one sentence acknowledging that Sidgwick had a personal *desire* for the postulate to be true. Then argue that what makes him unique is that he didn't let that desire settle for faith; he demanded *evidence* to satisfy the ethical requirement.
      *   *Why this helps:* It preempts the professor. You can say, "I agree his personal motivations were mixed, but my point is about how he *justified* the expenditure of intellectual capital. He didn't say 'I want to believe'; he said 'Ethics requires data.'" That shifts the debate from psychology to methodology, which is your home turf.

  ### 3. The Case-Control Analogy

  This is the strongest part of your essay, specifically because of your background.

  *   **Is it Anachronistic?** No. Calling it a "case-control study in embryo" is historically accurate. Epidemiology was in its infancy (John Snow and cholera were mid-century), and the SPR was attempting to apply statistical rigor to anecdotal data. They were using standardized questionnaires and tallying outcomes. That *is* the germ of case-control methodology.
  *   **Why did it fail to persuade?** You ask: "If the census was in embryo what I say it was, why did it persuade essentially no one outside the SPR?"
      *   *The Scientific Reason:* It wasn't just bias. The "controls" on memory and testimony were insufficient for the standards of the emerging experimental psychology (Wundt, etc.). Self-reported hallucinations from years prior suffer from massive recall bias. A geochemist knows that sample contamination ruins the data; the skeptics argued the *testimony* was contaminated by time and emotion.
      *   *The Philosophical Reason:* The "Prior Probability." For physicists like Huxley or Rayleigh, the prior probability of telepathy was so near zero that no amount of survey data could overcome it without a controlled laboratory mechanism.
      *   *Advice:* Don't frame it as "physicists dismissing without collecting data." Some did look. Frame it as: "They were using survey epidemiology to solve a problem that experimental physics demanded be solved in the lab." That concedes the skeptics had a point about *method* without conceding that Sidgwick was unscientific. It shows you understand the limits of your own analogy.

  ### Summary Recommendation

  Your central argument holds up: Sidgwick treated the "moral postulate" as an empirical hypothesis. That is a robust philosophical reading.

  **To survive the reading group:**
  1.  **Verify the stats** or generalize them to avoid a factual tripwire.
  2.  **Concede the biographical motivation** (he wanted to believe) to disarm the "rationalization" critique, but insist the *justification* remained ethical/empirical.
  3.  **Refine the methodology critique.** Acknowledge that while the *design* was proto-epidemiological, the *data quality* (human memory) was the weak link that allowed skeptics to dismiss it.

  You have a strong voice here. The geochemist perspective on the *Methods* of the SPR is fresh and valuable. Don't let the professor bully you on the philosophy; you're right that Sidgwick treated ethics as a system requiring empirical closure. Just shore up the historical mortar.

  Good luck on Thursday.
