  ## Session Plan: "The Quorum"

  **Instructor Note:** You are not teaching them the answer. You are facilitating an experience that mirrors your own confusion. Your authority comes from managing the game fairly, not from knowing civics theory. Keep your tone curious, not corrective.

  ### 1. Setup & Materials
  *   **Room:** One large table or desks arranged in a circle.
  *   **Tokens:** 300 poker chips, beads, or printed paper circles (20 per student).
  *   **Ballot Box:** An opaque box or hat.
  *   **Treasury:** A clear bowl.
  *   **The "Noise" Die:** One 10-sided die (d10).
  *   **Handouts:** Small slips of paper and pencils for secret voting.
  *   **Board:** Whiteboard or large paper to track scores.

  ### 2. The Rules (Read Aloud to Class)
  *Do not explain the "why." Read these as the laws of the game.*

  **Starting State:**
  *   Everyone receives **20 Tokens**.
  *   Tokens are yours. At the end of the session, you trade them for a prize (e.g., gift cards, candy, or simply "class credit" if applicable). Keep as many as you can.

  **The Decision:**
  *   On your slip of paper, write **KEEP** or **VOTE**.
  *   If you write **KEEP**: You pay nothing. You fold the paper and put it in the Box.
  *   If you write **VOTE**: You must put **5 Tokens** into the Treasury. Then put your paper in the Box.
  *   *Secrecy:* No one sees your paper but the Instructor.

  **The Count (Round 1 Only):**
  *   I will count the **VOTE** slips. Let's call this number $V$.
  *   I will roll the **Noise Die** (0–9). Let's call this number $N$.
  *   **The Total** = $V + N$.
  *   **The Threshold** is **12**.
  *   If **Total ≥ 12**: The "Policy Passes." Everyone receives **30 Bonus Tokens**.
  *   If **Total < 12**: The "Policy Fails." No bonus tokens.
  *   *Note:* You keep your remaining personal tokens regardless of the outcome.

  **The Count (Round 2 Only):**
  *   Same voting cost (5 Tokens) and same Threshold (12).
  *   **NO Die Roll.** The Total is just $V$.
  *   **New Rule:** If **Total ≥ 12**, everyone gets the **30 Bonus Tokens**.
  *   **Additional Rule:** For every person who chose **VOTE**, *everyone* (voters and keepers) gets an extra **2 Tokens**.

  ### 3. Timeline (120 Minutes)

  **0:00 – 0:15 | Arrival & Distribution**
  *   Welcome students. Hand out 20 tokens each.
  *   Explain the prize for tokens (keep it light; the value is symbolic).
  *   Read the Round 1 Rules. Answer clarification questions only (e.g., "Can I talk?" → "Yes, but your ballot is secret.").

  **0:15 – 0:45 | Round 1: The Gamble**
  *   **Discussion (5 mins):** Allow them to talk. They will likely do the math. "If 12 people vote, we win." "Why should I spend 5 if others do it?"
  *   **Voting (5 mins):** Collect ballots and tokens.
  *   **The Reveal (5 mins):** Count votes publicly. Roll the die. Calculate the Total. Distribute bonuses.
  *   **Reset (5 mins):** Return tokens to starting count (20 each). Do not discuss results yet.

  **0:45 – 1:15 | Round 2: The Pact**
  *   **Instruction:** "We play again. Same cost. Same Threshold. One rule changes: No Die Roll. But there is a Participation Bonus." (Read Round 2 Rules).
  *   **Discussion (5 mins):** Allow talk.
  *   **Voting (5 mins):** Collect ballots and tokens.
  *   **The Reveal (5 mins):** Count votes. Calculate bonuses. Distribute.
  *   **Reset (5 mins):** Tally final personal token counts.

  **1:15 – 1:45 | The Debrief (Scripted Below)**
  *   Sit in a circle. No teacher desk.
  *   Guide the conversation from their experience to your puzzle.

  **1:45 – 2:00 | Closing**
  *   Connect game to real voting.
  *   Dismissal.

  ### 4. Payoff Scheme & Settlement
  *   **Personal Tokens:** Worth 1 point each.
  *   **Bonus Tokens:** Worth 1 point each.
  *   **Settlement:** Count tokens at the end of the debrief.
  *   **Prize:**
      *   *Option A (Low Budget):* Highest score gets a $20 gift card; everyone else gets a candy bar.
      *   *Option B (No Budget):* Highest score gets a "Civic Leader" certificate; everyone gets a printed summary of the puzzle.
      *   *Crucial:* Ensure the "Keepers" (non-voters) in Round 1 who still won the bonus feel like they played smartly, not luckily.

  ---

  ### 5. Debrief Script
  *Do not lecture. Ask questions. Use their answers to build the bridge.*

  **Part 1: The Arithmetic (Round 1)**
  **You:** "In Round 1, raise your hand if you chose KEEP."
  *(Count hands. Acknowledge them neutrally.)*
  **You:** "Did anyone who chose KEEP feel like they made a mistake when we rolled that die?"
  *(Listen. Someone will likely say, 'I saved my tokens and still got the bonus.')*
  **You:** "That's interesting. So, if the group was going to win anyway, your 5 tokens were saved. If the group was going to lose anyway, your 5 tokens were saved. The only time your 5 tokens mattered was if the count was exactly 11, and the die roll was 0. How many of you felt your single vote could change the result?"
  *(Most will say 'no' or 'unlikely'.)*
  **You:** "This is the arithmetic I wrestle with. If the cost is 5, and the chance of changing the result is tiny, the smart move is KEEP. I want to be clear: In Round 1, the people who kept their tokens were logically correct. Does anyone disagree?"
  *(Validate the non-voters. This removes shame.)*

  **Part 2: The Chorus (Round 2)**
  **You:** "Now look at Round 2. No die. But we added the Participation Bonus. Did anyone change their choice from Round 1?"
  *(Listen for those who switched from KEEP to VOTE.)*
  **You:** "Why the switch? The cost was the same."
  *(They might say: 'It felt safer,' or 'I wanted the extra tokens.')*
  **You:** "In Round 2, if 14 people voted, your vote didn't change the win/loss. We already had 12. But your vote added 2 tokens to *everyone's* pile. Did it feel different to be one of 14 voters than to be one of 12 voters?"
  *(Look for the feeling of 'building' something vs. 'tipping' something.)*
  **You:** "Here is my puzzle. In real elections, the chance of my vote tipping the result is smaller than that die roll. It's nearly zero. By the arithmetic of Round 1, I should stay home. But I vote. And when I don't, I feel... smaller. Not because I lost a prize, but because I wasn't in the count."

  **Part 3: Mapping the Idea**
  **You:** "I suspect there are two ways to see a vote.
  1.  **As a Lever:** Like in Round 1. You use it to move a heavy object. If the object doesn't move, the lever was useless.
  2.  **As a Voice:** Like in Round 2. You use it to join a sound. One voice doesn't make the song, but the song doesn't exist without the voices."
  **You:** "If voting is a Lever, it's irrational for us to do it. If voting is a Voice, it's irrational *not* to do it. I don't have the answer. But I wanted you to feel the weight of both."

  ---

  ### 6. Troubleshooting: What Will Go Wrong
  *Be prepared for these specific friction points.*

  **1. The "Free Rider" Celebration**
  *   **Risk:** A student who kept their tokens in Round 1 and won the bonus might boast, "I beat the system!" This can shame the voters.
  *   **Fix:** In the debrief, explicitly validate them. "You played the odds perfectly. In a purely mathematical game, you won. That proves the arithmetic works." This makes their logic sound, not immoral.

  **2. Collusion/Peer Pressure**
  *   **Risk:** In Round 2, students might pressure others: "You have to vote, or we lose the bonus."
  *   **Fix:** Intervene gently during discussion. "Remember, the ballot is secret. You can say you'll vote, but you don't have to." This preserves the individual choice tension.

  **3. Cynicism ("It's Just a Game")**
  *   **Risk:** Students dismiss the tokens as fake, so the "cost" feels unreal.
  *   **Fix:** Make the prize tangible (snacks/gift card). If they say "It's fake," reply: "True. But the feeling of deciding whether to spend the token was real. That's the only part I care about."

  **4. Confusion on the Math**
  *   **Risk:** The die roll + threshold calculation might confuse some students.
  *   **Fix:** Write the formula on the board: **Votes + Die = Total**. Keep the numbers simple (Threshold 12, Class Size 15).

  ### 7. Limitations: What the Game Cannot Do
  *Be candid with yourself about where the simulation fails.*

  **1. The "Blood" Factor**
  *   **Limitation:** Tokens are cheap. Real voting rights were won with struggle, jail, and blood. The game cannot reproduce the *historical weight* of citizenship.
  *   **Your Job:** In the closing (1:45–2:00), you must supply this context verbally. "Tokens are easy to spend. In this country, people died so you could hold a ballot. That history adds a weight to the 'Voice' that tokens can't measure."

  **2. The "Secret" vs. "Public" Paradox**
  *   **Limitation:** In the game, voting is secret. In your "Chorus" theory, voting is often about public identity.
  *   **Your Job:** Acknowledge this. "In the game, no one knew who voted. In real life, 'I Voted' stickers make it public. That changes the feeling from a private calculation to a public promise."

  **3. The "Outcome" Dependency**
  *   **Limitation:** Even in Round 2, the game still rewards a "Win" (Policy Passes). Real voting often means voting for a loser.
  *   **Your Job:** Ask in debrief: "If the Policy had failed in Round 2, but we had 15 voters, would you still feel good about the Participation Bonus?" If they say yes, you've nailed the concept. If no, acknowledge that outcomes still matter.

  ### 8. Final Note to Instructor
  You mentioned you have no academic background. **Do not apologize for this.** Your lack of jargon is your strength. You are not teaching "Rational Choice Theory vs. Expressive Voting." You are teaching "The Math vs. The Feeling."

  If a student asks, "So, should we vote or not?"
  **Your Answer:** "I can't tell you. I can only tell you that if you only use the math from Round 1, you won't vote. If you use the feeling from Round 2, you might. The puzzle is yours to solve now."
