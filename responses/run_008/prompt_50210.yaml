      *   **Key Issue:** A 15-year flagship program to computationally design enzymes for plastic degradation in seawater (a "moonshot").
      *   **Conflict:**
          *   *Outside View (Analysts):* Base rate is 1/7 success (ugly). Recommendation: Reject/High Risk.
          *   *Inside View (Director):* Failures had specific causes not present here; science has crossed a threshold; Outside View would have killed the one past success.
          *   *Board Sentiment:* Some hate "staged funding" (call it cowardice).
      *   **Required Elements:**
          *   Grapple with the *Reference Class Problem* (which comparison set is right?).
          *   Address the Director's track record (2 big programs: 1 success, 1 failure).
          *   Treat the strongest point of the losing side honestly (specifically the Director's jab about the past success).
          *   Make a concrete recommendation with reasoning.

  2.  **Determine the Recommendation:**
      *   *Full Funding:* Too risky given the 1/7 base rate and the 15-year horizon. Locking in capital for that long without checkpoints is irresponsible stewardship.
      *   *Rejection:* Too conservative. Ignores the Director's specific arguments about why *this* case is different and the potential high impact of success. Also ignores the agency's mandate to fund moonshots.
      *   *Staged Funding:* The most rational middle ground, *but* needs to address the "cowardice" critique. It can't just be "we'll check in later." It needs explicit, hard kill criteria that respect the moonshot nature while protecting the agency.
      *   *Decision:* **Staged Funding with Explicit Kill Criteria.** This balances risk management with the potential for high reward. It acknowledges the base rate without being enslaved by it.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation upfront.
      *   **The Core Tension:** Outside vs. Inside View (The Reference Class Problem).
      *   **Analyzing the Reference Classes:**
          *   Class A: All Flagships (1/7 success).
          *   Class B: Director-led Programs (1/2 success).
          *   Class C: Adjacent Fields/Tech Readiness.
      *   **Addressing the Director's Argument:** Acknowledge the validity of her point about the past success (the "False Negative" risk).
      *   **Addressing the "Cowardice" Critique:** Reframe staged funding not as hesitation, but as active risk management.
      *   **The Recommendation (Staged Funding):** Define the stages and the *Kill Criteria*.
      *   **Conclusion:** Final call to action.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Opening:* State the recommendation clearly. Staged funding.
      *   *The Reference Class Problem:* This is the intellectual heart. I need to explain *why* the analysts and Director disagree. They are picking different buckets.
          *   Analysts: "All Flagships." (Broad, statistically robust, but maybe too blunt).
          *   Director: "This Specific Program." (Nuanced, but prone to optimism bias).
          *   My synthesis: We need a hybrid. The Director's personal track record (50%) is better than the agency average (14%), but still not a guarantee.
      *   *The Director's Strongest Point:* I must explicitly validate her argument that strict outside-view reasoning would have killed the agency's only success. This is crucial for maintaining trust and showing I listened. It validates the *mission* of the agency.
      *   *The "Cowardice" Rebuttal:* How to defend staged funding? It's not about lacking conviction; it's about preserving optionality. A 15-year lock-in prevents pivoting if the science stalls. It's "disciplined ambition."
      *   *Kill Criteria:* These need to be concrete, not vague milestones.
          *   Year 3: Computational accuracy threshold (in silico).
          *   Year 6: Lab stability threshold (in vitro).
          *   Year 9: Environmental pilot (in situ).
          *   If these aren't met, the program ends. No "just one more year."
      *   *Tone:* Professional, respectful, intellectually rigorous, decisive. Not bureaucratic, but governance-focused.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the staged funding recommendation too generic?
      *   *Fix:* Make the kill criteria specific to the *science* described (computational design, enzymes, seawater).
      *   *Critique:* Did I address the Director's track record enough?
      *   *Fix:* Ensure the Reference Class section explicitly weighs her 1-for-2 record against the agency's 1-for-7.
      *   *Critique:* Is the tone too academic?
      *   *Fix:* Keep it punchy. Use bolding for key points. Ensure the "Cowardice" point is addressed directly.

  6.  **Final Polish:**
      *   Check against constraints: Did I recommend one decision? Yes. Did I grapple with reference classes? Yes. Did I treat the losing side's strongest point honestly? Yes (acknowledging the Outside View's limitation regarding the past success).
      *   *Wait, one nuance:* The prompt asks to treat the strongest point on *whichever side loses* honestly. If I recommend Staged Funding, both the "Full Fund" (Director) and "Reject" (Analysts) sides are partially losing. However, the Director is the one pushing for Full Funding. Her strongest point is the "False Negative" argument (we would have killed the success). I need to make sure I validate that specifically, even while denying her the full 15-year lock.

  7.  **Final Review of the "Kill Criteria":**
      *   Need to ensure they aren't just "make progress." They need to be go/no-go gates.
      *   Gate 1: Algorithmic prediction accuracy.
      *   Gate 2: Enzyme half-life in simulated seawater.
      *   Gate 3: Cost/Scale viability.

