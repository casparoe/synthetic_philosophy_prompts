  Next time I see her I want to ask about three new people. Deepa earns exactly what her colleague earns but has a fatigue condition with no effective treatment — it's not a cost thing and there are no stairs involved, she just has less energy than her job and life require. She says she's adjusted, and she rates her life satisfaction a bit higher than the colleague's, if anything. Marco was paralyzed in an accident, now earns double what he did before, but all the extra goes on carers, an accessible van, and a converted flat — after which he can do nearly everything he could do before, and he's got about the same money left over as his able-bodied neighbour. Is he worse off than the neighbour? And then my friend who quit corporate law for a meditation center — one pair of shoes, no income to speak of, but the firms would take her back tomorrow if she asked — compared to some guy stuck in the exact same poverty with no exit. So: what will she say on each of the three, do you think?

  I'm less interested in her actual answers than in the rule she seems to be running. I can see at least two candidate rules that fit everything so far, and I can't tell which one it is — so tell me what the candidates are, what each of them predicts for Deepa, Marco, and the meditation-center case, your best guess with reasons, and which single further case I should ask her about that would best split the surviving rules apart. Also be honest with me if the record is just too messy to support any of this — my professor would definately say I'm pattern-matching to the syllabus.
