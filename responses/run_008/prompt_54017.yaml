answer: |-
  You have walked directly into the "Impossibility Theorem" of fairness (Chouldechova 2017; Kleinberg et al. 2016), and your intuition is correctly telling you that mathematics alone cannot resolve it. The theorem proves that when base rates differ, you cannot simultaneously satisfy **Calibration** (your prior) and **Equalized Odds** (equal error rates across groups). 

  Since you cannot have both, your gut verdicts imply that you are secretly switching which metric matters based on the *context* of the decision, not just the statistics. You are treating fairness as a property of the **decision system**, not just the **model**.

  Here is a principle that captures your verdicts, precise enough to apply to new cases, along with the necessary sacrifice.

  ### The Principle: Validated Construct and Consequence-Weighted Parity

  **Fairness requires that (1) the target variable represents a valid moral construct, and (2) the distribution of error burdens be equalized for harmful decisions, while calibration suffices for beneficial decisions.**

  Here is the breakdown of the clauses and which case motivates them:

  #### Clause 1: Construct Validity
  > *"The label predicted must correspond to a ground-truth phenomenon, not a historical artifact of bias."*
  *   **Motivated by Case 5 (Hiring Model).**
  *   **Explanation:** This resolves your ambivalence. A model can be statistically perfect (calibrated) but morally bankrupt if the target variable ($Y$) encodes past discrimination. If the historical hiring decisions were biased, "hireability" is not a valid construct; it is a proxy for "similarity to past hires." Fairness requires the target to be valid *before* the model is trained. Accuracy to a biased label is not accuracy; it is precision in perpetuating error.

  #### Clause 2: Burden Parity for Harmful Decisions
  > *"When the model output triggers a penalty, deprivation of liberty, or denial of opportunity, the False Positive Rate (error burden) must be equal across groups."*
  *   **Motivated by Case 2 (Pretrial Bail).**
  *   **Explanation:** In bail decisions, a "high risk" flag imposes a burden (detention). If Black defendants are flagged high risk more often than White defendants *among those who would not reoffend*, the burden of error is racially skewed. Even if the model is calibrated (the predicted probability matches the observed rate), the **cost of being wrong** is distributed unequally. Calibration ensures the *probability* is right; Burden Parity ensures the *suffering* is distributed equally.

  #### Clause 3: Calibration Sufficiency for Beneficial Decisions
  > *"When the model output triggers a resource allocation, medical intervention, or benefit, calibration within groups is sufficient for fairness."*
  *   **Motivated by Case 1 (Stroke Risk).**
  *   **Explanation:** In medical triage, a "high risk" flag triggers care (a benefit). If the model is calibrated, a woman flagged as 20% risk and a man flagged as 20% risk both have the same expected medical need. If the base rates differ, the False Negative rates will mathematically differ, but because the intervention is helpful, the primary moral imperative is ensuring resources go where the risk actually is. We do not need to equalize the rate of *missed* strokes (False Negatives) if doing so would require sending low-risk patients to unnecessary surgery. Calibration ensures the *utility* of the intervention is consistent.

  #### Clause 4: Causal Justifiability for Proxies
  > *"Disparate impact via proxy variables is permissible only if the proxy captures causal risk factors independent of the protected attribute, but remains subject to Burden Parity."*
  *   **Motivated by Case 3 vs. Case 4 (Direct Group vs. Zip Code).**
  *   **Explanation:** This addresses why Case 4 feels "less bad" than Case 3. Mathematically, they are identical (Disparate Impact). Morally, they differ in **mechanism**. Using "Race" directly (Case 3) treats the attribute as the cause. Using "Zip Code" (Case 4) *might* capture environmental causes (pollution, access to care) that correlate with race but are not defined by it. However, this clause has a hard limit: even if the proxy is causally justified, it cannot violate **Clause 2** (Burden Parity). If Zip Code leads to unequal jail rates for the innocent, it is still unfair, regardless of causal validity.

  ---

  ### Application to the New Case: Cancer Screening Triage

  **Scenario:** A cancer-screening model where true prevalence differs by group. To equalize missed-detection rates (False Negatives) across groups, you must lower the threshold for the low-prevalence group, causing the model to be miscalibrated (more False Positives) for that group.

  **Verdict under the Principle:** **Equalize Missed Detections (accept miscalibration).**

  **Reasoning:**
  1.  **Construct Validity:** Cancer presence is a valid ground-truth construct (satisfies Clause 1).
  2.  **Consequence Type:** Screening is a **Beneficial Decision** (Clause 3) *but* with a high cost for False Negatives (death).
  3.  **Application:** While Clause 3 suggests calibration is usually sufficient for benefits, the severity of the error matters. In stroke risk (Case 1), a missed stroke is bad, but a false alarm is mostly cost/annoyance. In cancer screening, a missed detection is often fatal.
  4.  **Refinement:** When the cost of a False Negative vastly outweighs the cost of a False Positive, the principle shifts toward **Equalizing Harmful Errors**. You should accept miscalibration (more false alarms for the low-risk group) to ensure that the rate of missed cancers (the true harm) is equalized. The "burden" of a false alarm (extra biopsy) is negligible compared to the burden of a missed cancer.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  You asked me to be upfront about which of your gut reactions this principle cannot save. You will have to overturn your intuition on **Case 4**.

  **Your Verdict:** Case 4 (Zip Code) is "still unfair, but somehow less bad than Case 3."
  **The Principle's Verdict:** If the Zip Code recreates the racial disparity *exactly* in a punitive context (like bail), it is **equally unfair** to Case 3, regardless of the column name.

  **Why?**
  Your intuition relies on **intent** or **proximity**. You feel that using Zip Code is less "targeted" than using Race. However, under **Clause 2 (Burden Parity)**, the moral weight lies in the *consequence* borne by the individual, not the *methodology* of the modeler. 
  *   If a Black defendant is jailed because of a Zip Code proxy, they suffer the exact same deprivation of liberty as if they were jailed because of a Race flag.
  *   The "less bad" feeling comes from the *modeler's* culpability (we didn't *mean* to discriminate), not the *subject's* experience. 
  *   Fairness principles generally prioritize the subject's experience over the modeler's intent. 

  If you want to save the "less bad" intuition, you must rely heavily on **Clause 4 (Causal Justifiability)**. You would have to argue that Zip Code captures *non-racial* causal risks (e.g., local pollution levels) that justify the disparity. But if the disparity is *purely* a proxy for race with no independent causal link to the outcome, the principle demands you treat Case 3 and Case 4 as morally equivalent.

  ### Summary for your Mental Model
  As an ecological modeler, you are used to models describing **natural systems** where "truth" is independent of the observer. In social systems, the "truth" (labels) is often a product of historical systems (Case 5), and the "output" changes the system (Case 2 vs Case 1).

  *   **Keep your prior on Calibration** when the output is a **Benefit** (Case 1, Cancer Screening).
  *   **Abandon your prior on Calibration** when the output is a **Burden** (Case 2). Switch to Error Parity.
  *   **Inspect the Label** before training (Case 5).
  *   **Accept that Proxies are morally equivalent to Direct Variables** if the outcome is identical (Case 4 requires adjustment).

  This resolves the inconsistency by making fairness **decision-relative** rather than **model-relative**.
