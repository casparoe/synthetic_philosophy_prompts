      *   **Specific Examples:** A physical chair (brother-in-law) vs. a work team (manager).
      *   **Specific Thought Experiments:** Unfastened boards in chair shape? Two atoms in the universe (do they make a "pair"?). Desk + Coffee Mug = New Object?
