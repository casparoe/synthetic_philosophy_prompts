prompt: |-
  Been arguing with my brother about species and I've realized my own gut is a mess, so I want someone to straighten me out. Here's what my gut says about a bunch of cases, and I want to know if there's one principle that captures all or most of them, or whether I just have to give some of them up.

  The gulls: you know the classic ring around the Arctic, herring gulls and lesser black-backed gulls, where each neighboring population interbreeds with the next one all the way around the ring, but when the two ends meet in Europe they basically don't interbreed. My gut says those two endpoints are genuinely different species. The chain connecting them doesn't dissolve that for me.

  The Ensatina salamanders around California's Central Valley: same setup, adjacent populations interbreed in a ring, and at the southern end where the two arms meet they've diverged enough that they mostly don't. My gut says this whole ring is ONE species. And yes, I know, I just told you the structurally identical gull case gives me two. That's the problem. Maybe it's because the salmanders still look like one thing and the gulls don't? I don't love that answer.

  Polar bears and grizzlies: hybrids are fertile and the split is geologically five minutes ago, but my gut says two species, full stop. Dogs and wolves: interbreed constantly, fully fertile, and my gut also says two species. But Neanderthals and us: we interbred enough that their DNA is sitting in me right now, and my gut wobbles — part of me says same species, part of me says no, and honestly the dog/wolf verdict makes the "no" feel inconsistent even to me.

  Mosquitoes in the Anopheles gambiae complex: you can't tell them apart by looking, but they can't interbreed with each other. My gut says: obviously separate species, the most separate of anything on this list. Meanwhile the oaks in my area hybridize with each other all the time, real gene flow between named species, and my gut still says the named oaks are fine as separate species.

  And then the bdelloid rotifers, which haven't had sex in something like tens of millions of years. The interbreeding criterion just has nothing to say about them, and yet I'd swear there are many species of them, not one. So whatever makes a species, it can't only be about who mates with whom.

  I've also got this half-baked idea I want tested: a species is a gene pool with a kind of immune system — a coadapted set of genes that, when foreign genes come in, either flushes them out or absorbs them without changing the overall character, and a species ends when that integrity fails. Does that rescue anything? It feels like it might handle the oak case and maybe the gulls, but I can't see it touching the rotifers at all.

  So: give me the principle, or a couple of candidates, stated precisely. Say which clauses are motivated by which of my verdicts, which of my verdicts you'd have to overturn (and be honest — I suspect the gull/salamander pair can't both survive), and tell me what your principle says about a case I haven't mentioned: Helianthus anomalus, a sunflower that seems to have originated as a stabilized hybrid of two other sunflower species. Is that one species, three species, or does it break whatever you come up with?

  After the main discussion, please put a brief structured summary at the end as a JSON object with these fields: "principle" (your one-sentence statement of the winning principle), "candidate_principles_rejected" (array of one-sentence alternatives you considered and why they lost), "case_verdicts" (array of objects, one per case above, each with "case", "verdict" meaning how many species your principle recognizes there, and "matches_my_gut" true or false), "overturned_verdicts" (array of my gut calls you overturn, each with a one-line reason), and "helianthus_prediction" (your verdict on the hybrid sunflower case).
