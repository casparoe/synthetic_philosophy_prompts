prompt: |-
  Retired physicist here -- I spent 35 years in condensed matter, mostly neutron scattering and a lot of staring at phase diagrams, and now that I've got time on my hands I've fallen down the philosophy rabbit hole. The debate I keep tripping over lately is endurantism versus perdurantism: whether things persist by being wholly present at every moment they exist, or by having temporal parts spread out along a fourth dimension. And honestly, when I read the perdurantists my reaction is "yes, obviously, that's just a worldtube in a block universe, why is this contested?" But I know enough philosophy now to suspect that reaction is too quick, and that my vocabularly might be doing some sneaky work.

  So here's what I want. Restate the whole debate in the vocabulary I actually use: worldlines and worldtubes, spacelike hypersurfaces and foliations, field configurations defined on a slice, Lorentz invariance, maybe the ADM way of splitting spacetime into space-plus-time if that helps. Translate endurantism into those terms and translate perdurantism into those terms, as faithfully as you can. Then give me a residue report, and don't be polite about it. My instinct is that endurantism comes out as incoherent the moment you draw the spacetime diagram, but I want you to check whether that's a genuine finding or an artifact of me assuming the block universe is the neutral background picture when it's actually a substantive commitment of its own.

  Format: give me exactly five numbered points, each just a sentence or two, no introduction and no conclusion. The first two are the translations, one for each view. The third is what translates cleanly. The fourth is what has to be distorted or fudged to fit. The fifth is your verdict on the residue: does it show my physics vocabulary is missing something the philosophers need, or that their disagreement is less substantive than it looks from inside? And please don't smuggle the block universe in as if it were translation rather than assumption -- I know a question-begging frame when I see one, I just can't always tell whether I'm the one begging. British English, and don't go over two sentences per point, I want this tight.
