answer: |-
  1. Endurantism asserts that a material system is wholly present on a specific spacelike hypersurface and remains numerically identical as one moves to subsequent slices. This requires a privileged foliation to define simultaneity, otherwise Lorentz invariance renders the co-existence of the object's spatial parts ambiguous.

  2. Perdurantism identifies the object with the entire worldtube within the spacetime manifold, where temporal parts correspond to intersections with arbitrary spacelike hypersurfaces. Here, persistence is merely the ordering of these cross-sections along a timelike curve without requiring numerical identity between slices.

  3. Perdurantism maps cleanly onto the standard relativistic manifold where the invariant interval defines the object's extent without reference to a specific observer's time coordinate. The mathematical formalism of worldtubes naturally accommodates temporal parts as coordinate-dependent slices of a covariant structure.

  4. Endurantism forces a fudged distinction between the object and its history, demanding a metaphysical glue of numerical identity that the stress-energy tensor does not provide. To sustain this view, one must modify the physical model by privileging a specific foliation, effectively reintroducing a Newtonian absolute time beneath the relativistic metric.

  5. The residue indicates your physics vocabulary is not deficient, but that the disagreement is substantive only if one rejects the spacetime manifold as ontologically fundamental. Endurantism survives merely as a metaphysical manoeuvre to restore absolute simultaneity, suggesting the debate is less about persistence than about resisting relativistic ontology.
