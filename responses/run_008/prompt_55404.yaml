answer: |-
  The residue indicates that your vocabulary cannot capture the normative justification for fixing reward scales and weight values, but the structural constraints philosophers debate are mathematically identical to the limitations you face with linear scalarization, implying the philosophical debate is substantive only on the metaphysics of normalization, not on the aggregation mechanics themselves.

  ### 1. Harsanyi's Aggregation Theorem in MORL Terms

  **The Setup:**
  You have $N$ objectives, each defining a utility function $U_i(\pi)$ over policies $\pi$, corresponding to the expected return for objective $i$. Let $V(\pi)$ be the "social" value function used to select the optimal policy.

  **The Axioms:**
  1.  **vNM Rationality (Individual):** Each $U_i$ satisfies von Neumann–Morgenstern axioms over lotteries of policies. In your terms, $U_i(\pi) = \mathbb{E}[R_i | \pi]$.
  2.  **vNM Rationality (Social):** The global criterion $V(\pi)$ also satisfies vNM axioms over lotteries of policies. This means your optimizer is risk-neutral with respect to the *scalarized* value.
  3.  **Pareto Principle:** If policy $\pi$ yields expected reward vectors $\mathbf{r}$ and $\pi'$ yields $\mathbf{r}'$, and $r_i \geq r'_i$ for all $i$ (with strict inequality for at least one), then $V(\pi) > V(\pi')$. In your vocabulary, $V$ must respect Pareto dominance on the expected reward front.

  **The Derivation:**
  Because $V$ and all $U_i$ are linear functionals over the space of lotteries (by vNM), and $V$ respects the ordering induced by the vector $(U_1, \dots, U_N)$ (by Pareto), $V$ must lie in the dual cone of the Pareto front. Mathematically, $V(\pi)$ must be a linear combination of the $U_i(\pi)$.

  **The Conclusion:**
  $V(\pi) = \sum_{i=1}^N w_i U_i(\pi)$ with $w_i \geq 0$.
  In your terms: **Linear scalarization is the unique aggregation method compatible with vNM rationality over policy lotteries and Pareto efficiency.** Any non-linear aggregator (e.g., Chebyshev, hypervolume) either violates the Independence axiom (making you susceptible to preference reversals over lotteries of policies) or violates Pareto efficiency.

  ### 2. The Impartial Observer as Random Objective Indexing

  Harsanyi's second argument posits an observer behind a "veil of ignorance" who has an equal probability of becoming any individual $i$.

  **MORL Translation:**
  Treat the objective index $I$ as a random variable distributed uniformly over $\{1, \dots, N\}$, independent of the environment dynamics. The observer maximizes $\mathbb{E}[R_I]$.
  By the law of total expectation, $\mathbb{E}[R_I] = \sum_{i=1}^N P(I=i) \mathbb{E}[R_i] = \frac{1}{N} \sum_{i=1}^N U_i(\pi)$.

  **Correspondence:**
  This is exactly linear scalarization with uniform weights ($w_i = 1/N$). In your world, this corresponds to training an agent where the reward signal at each episode is sampled from a single objective chosen uniformly at random, rather than summing all objectives every step. If your environment is ergodic and you optimize expected return, this converges to the same policy as uniform linear scalarization. The "veil of ignorance" is simply a uniform prior over the objective dimension.

  ### 3. Objections: Diamond and Affine Invariance

  **The Diamond Objection (Fairness vs. Expectation):**
  Diamond argued that vNM + Pareto forces indifference between a sure allocation and a lottery with the same expected utility profile, even if the lottery concentrates risk unfairly.
  *   **MORL Translation:** Consider two policies. Policy A yields a deterministic reward vector $(0.5, 0.5)$. Policy B is stochastic: with probability 0.5 it yields $(1, 0)$, and with 0.5 it yields $(0, 1)$.
  *   **Linear Scalarization:** Both policies have expected reward vector $(0.5, 0.5)$. A linear scalarizer is indifferent between them.
  *   **The Issue:** Policy B creates inequality in realization (one objective gets everything, the other nothing), whereas Policy A guarantees fairness. Linear scalarization only sees the *expected* reward vector, collapsing the distribution over reward vectors into a single point.
  *   **Relevance to You:** If you care about "ex-post fairness" (the distribution of returns across objectives in individual episodes) rather than "ex-ante fairness" (expected returns), linear scalarization is insufficient. You would need a non-linear aggregator over the joint distribution of returns (e.g., minimizing variance across objectives), which violates the vNM Independence axiom used in Harsanyi's proof.

  **The Affine-Invariance Problem (Scale Normalization):**
  Individual vNM utilities are unique only up to positive affine transformation ($U'_i = a_i U_i + b_i$).
  *   **MORL Translation:** Reward functions are arbitrary up to scaling and shifting. If you scale objective $i$'s reward by $a_i$, the weight $w_i$ must scale by $1/a_i$ to preserve the policy ordering.
  *   **The Problem:** Without a canonical normalization, the weight vector $\mathbf{w}$ is underdetermined. A weight of $w_i=1$ means nothing unless the scale of $R_i$ is fixed.
  *   **Philosophical vs. Practical:** Philosophers argue this requires "interpersonal comparison of utility" (a metaphysical fact about how much pain person A feels vs. person B). You handle this via engineering conventions (e.g., normalize rewards to $[0,1]$ using min-max scaling relative to the Pareto front). The mathematical problem is identical; the proposed solution differs (moral fact vs. normalization convention).

  ### 4. Rawls's Maximin vs. Fixed Weights

  Rawls argues for maximizing the welfare of the worst-off individual (Maximin).
  *   **MORL Translation:** Optimize $\min_i \mathbb{E}[R_i]$ (or leximin over the sorted reward vector).
  *   **Representability:** No fixed weight vector $\mathbf{w}$ can represent Maximin.
  *   **Why:** Maximin preferences induce indifference curves that are L-shaped (Leontief). Linear scalarization induces linear indifference curves. They only touch at specific points on the Pareto front (typically the "knee" or non-convex regions).
  *   **Harsanyi's Constraint:** Since Maximin violates the vNM Independence axiom (you are infinitely risk-averse regarding the minimum objective), it is ruled out by Harsanyi's theorem. If you use Maximin, you are explicitly rejecting the vNM rationality axioms for the social criterion, accepting that your optimizer will behave "irrationally" over lotteries of policies to ensure fairness.

  ### Residue Report

  **What Translates Cleanly:**
  The mathematical structure is isomorphic. Harsanyi's theorem is precisely the statement that "Linear Scalarization is the only vNM-rational Pareto-efficient aggregator." The Diamond objection is precisely the statement that "Linear Scalarization ignores higher-order moments of the joint reward distribution." The Affine problem is precisely "Reward Normalization is required for weights to be meaningful." Your vocabulary captures the formal constraints perfectly.

  **What Survives with Distortion:**
  The **Impartial Observer**. In philosophy, this is a thought experiment about identity and empathy. In MORL, it is a data-sampling strategy (uniform objective sampling). The moral weight of "becoming" another person is lost; it becomes a mere weighting coefficient. However, the mathematical output (uniform weights) remains identical.

  **What Has No Counterpart:**
  The **Normative Status of Weights**. In your world, $\mathbf{w}$ is a hyperparameter or an elicited preference. It is descriptive of what the user wants. In Harsanyi's world, the theorem attempts to be prescriptive about the *form* of aggregation, and the Impartial Observer attempts to be prescriptive about the *values* of the weights (arguing for equality). Your vocabulary treats weights as inputs; philosophy treats them as outputs of a moral derivation. You ask "What policy maximizes this $\mathbf{w}$?"; Harsanyi asks "What $\mathbf{w}$ is morally justified?"

  **The Affine-Invariance Residue:**
