prompt: |-
  I do grantmaking at a small family foundation -- we give out roughly $1.5M a year, mostly in $50-150k chunks, and the docket runs maybe 60 proposals a year across a stupidly wide range: local homelessness, global health, a youth literacy program, emergency preparedness, some AI thing last quarter, environmental stuff. Two program staff plus me, no in-house economists, and a board of family members who have recently gotten very into the importance/tractability/neglectedness framework after one of them read about it somewhere. The problem is that when it comes time to actually rank proposals, everyone just vibes: something gets called "highly neglected" if nobody on the board had heard of it before, "tractable" if the grantee sounds confident, and "important" if it involves children or death. Then the framework gets invoked after the fact to justify whatever we were going to do anyway.

  I want the opposite: an actual procedure. Please turn ITN into something I can run on a stack of 10-15 proposals in an afternoon, at our scale. Concretely:

  - The questions to ask of each proposal, in order, with what counts as a sufficient answer at each step -- including how to handle it when I have no numbers and no time to get any (most of our applicants can't even tell me how many people their program serves).
  - How to score or rate scale, tractability, and neglectedness without pretending to a precision we don't have. Does multiplying three fuzzy scores together make sense at our size, or does it just launder vibes through arithmetic? If it's the latter, what's the honest alternative?
  - Where the procedure says no on its own, and where it has to stop and hand the decision to the board because the remaining question is about values, not facts. Our board cares about the local community; the framework, applied straight, will probably keep telling them to send money overseas. I need the procedure to flag that as a values question rather than pretending ITN settles it.
  - The failure modes I should watch for. The one I already suspect: neglectedness can mean "nobody's working on this" or it can mean "people looked at this and it's a bad idea," and those score identically if I just ask who else is funding it. What other ways does this framework misfire, and which misfires are cheap to catch and which aren't?

  Then run it on three from a recent-ish docket, which I've slightly anonymized: (1) a food bank expansion in our own county, very well run, everyone knows the director; (2) a small org doing early literacy interventions that claims a big effect per dollar but has one unpublished pilot; (3) a pooled fund for pandemic preparedness where our $100k is a rounding error but the org argues that's exactly why it counts -- huge scale, almost no private funders. At least one of these should come out with an answer the board will hate, and I want to see how the procedure handles that rather than smoothing it over.

  I don't need the history of the framework or who invented it or anything -- just the thing my team can actually run, and an honest accounting of where it stops being a procedure and starts being judgment with better posture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer/Staff at a small family foundation.
      *   **Scale:** $1.5M/year, grants of $50-150k.
      *   **Volume:** ~60 proposals/year (manageable but busy).
      *   **Scope:** Extremely broad (local homelessness to global AI).
      *   **Team:** 2 program staff + user. No economists.
      *   **Board:** Family members, recently obsessed with ITN (Importance, Tractability, Neglectedness) but applying it superficially ("vibes").
      *   **Pain Point:** ITN is being used to justify pre-determined decisions. Needs a *real* procedure that works without data, handles value conflicts (local vs. global), and identifies failure modes.
      *   **Task:** Create a concrete, runnable ITN procedure for 10-15 proposals in an afternoon. Apply it to three specific anonymized cases. Be honest about where judgment takes over.

  2.  **Deconstruct the Request:**
      *   **Goal:** Operationalize ITN for a small, data-poor foundation.
      *   **Requirements:**
          1.  Specific questions/steps with sufficiency criteria (even without numbers).
          2.  Scoring system (avoiding false precision/math-washing).
          3.  Decision boundaries (where procedure says no vs. where board decides values).
          4.  Failure modes (specifically the "neglectedness = bad idea" trap).
          5.  Application to three specific cases (Food Bank, Literacy, Pandemic Pool).
          6.  Tone: Pragmatic, honest, no fluff, no history lessons.

  3.  **Develop the Procedure (The "ITN-Lite" Framework):**
      *   *Constraint:* No data, no economists, short time.
      *   *Solution:* Use ordinal rankings and qualitative gates instead of cardinal scores (1-10). Avoid multiplication (it implies precision). Use a "Traffic Light" or "Bucket" system.
      *   *Step 1: Importance (Scale/Severity).* Don't ask "how many lives." Ask "What is the ceiling?" and "How bad is the problem?"
      *   *Step 2: Tractability (Solvability).* Don't ask for ROI. Ask "Does this intervention have a theory of change that makes sense?" and "Is there evidence *something* works?"
      *   *Step 3: Neglectedness (Funding Landscape).* Don't just count funders. Ask "Is it neglected because it's new/hard or because it's dead end?"
      *   *Scoring:* Use High/Medium/Low buckets. Do *not* multiply. Use a weighted discussion or a "hurdle" approach.
      *   *Values Check:* Explicitly separate "Impact Potential" from "Mission Fit." ITN measures potential; the Board decides Mission Fit (e.g., Local vs. Global).

  4.  **Drafting the Steps (Iterative refinement):**
      *   *Initial thought:* Score 1-5 on each.
      *   *Correction:* User specifically asked if multiplying fuzzy scores makes sense. Answer: No, it launders vibes.
      *   *Better approach:* Use ITN as a filter, not a calculator.
      *   *Step 1 (Importance):* Cap the impact. If the grant is $100k, can it plausibly move the needle on the stated problem?
      *   *Step 2 (Tractability):* Is the plan coherent? Is there *any* evidence?
      *   *Step 3 (Neglectedness):* Why are others absent?
      *   *Decision Rule:* High Importance + High Tractability + (Medium/High Neglectedness) = Fund.
      *   *Values Override:* If ITN says "Global Health" but Mission says "Local," flag it.

  5.  **Addressing Failure Modes:**
      *   *Neglectedness Trap:* "Nobody funds this" $\neq$ "Good opportunity." Could be "Nobody funds this because it doesn't work."
      *   *Scale Trap:* Big problem $\neq$ Your $100k matters.
      *   *Tractability Trap:* Confident grantee $\neq$ Effective program.
      *   *ITN Trap:* ITN optimizes for *marginal* impact, not *absolute* good. A local food bank might have lower marginal impact than a global health fund, but higher local community building value.

  6.  **Applying to the Three Cases:**
      *   *Case 1: Local Food Bank.*
          *   Importance: High (local hunger is real), but Scale limited to county.
          *   Tractability: High (food in = hunger down).
          *   Neglectedness: Low (everyone funds food banks).
          *   *Verdict:* ITN says "Pass/Low Priority." Board will want to fund (Local/Visible). *Conflict identified.*
      *   *Case 2: Early Literacy.*
          *   Importance: High (life outcomes).
          *   Tractability: Medium/High (evidence exists in field, but *this* org is unproven).
          *   Neglectedness: Medium (lots of literacy funds, few do *early* intervention well).
          *   *Verdict:* ITN says "Maybe/Watchlist." Risk is on the org, not the cause.
      *   *Case 3: Pandemic Pooled Fund.*
          *   Importance: Massive (global catastrophic risk).
          *   Tractability: Medium (hard to measure, but prep is logical).
          *   Neglectedness: High (govt is slow, private is rare).
          *   *Verdict:* ITN says "Fund." Board will hate it (no local impact, $100k is a drop in bucket). *Conflict identified.*

  7.  **Refining the Output Structure:**
      *   **Part 1: The Procedure.** (The "Afternoon Protocol"). Keep it checklist-style.
      *   **Part 2: The Scoring.** (Buckets, not math).
      *   **Part 3: The Values Boundary.** (Where ITN stops).
      *   **Part 4: Failure Modes.** (The "Gotchas").
      *   **Part 5: The Trial Run.** (Applying to the 3 cases).

  8.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I answer the "multiplying scores" question? Yes, explicitly advise against it.
      *   *Check:* Did I handle the "no data" constraint? Yes, focus on plausibility and ceilings.
      *   *Check:* Is the tone right? Needs to be professional but candid about the "vibes" problem.
      *   *Check:* Did I ensure at least one answer the board will hate? Yes, the Pandemic Fund (ITN loves it, Board likely won't) and the Food Bank (Board loves it, ITN is lukewarm). I should highlight the tension.

  9.  **Final Review against User Prompt:**
      *   Questions to ask in order? Yes.
      *   Scoring without false precision? Yes (Buckets/Flags).
      *   Where procedure says no vs. board decides? Yes (The "Mission Filter").
      *   Failure modes? Yes.
      *   Run on 3 cases? Yes.
      *   No history/fluff? Yes.

  10. **Final Polish:** Ensure the distinction between *Marginal* Impact (ITN's strength) and *Absolute* Good (Board's intuition) is clear. This is the core philosophical tension they are facing. (Self-correction: Keep it practical, don't get too philosophical, just label the decision point).

  *(Self-Correction during drafting the "Procedure" section)*: Make sure the "Neglectedness" check includes the "Why?" question explicitly to avoid the "bad idea" trap.
  *(Self-Correction during drafting the "Trial Run")*: Make sure the Pandemic Fund analysis acknowledges the "drop in the bucket" objection honestly.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your constraints: small team, no data, broad docket, and a board prone to "math-washing" their intuitions.

  ### Part 1: The Afternoon Protocol (ITN-Lite)

  Do not use a spreadsheet formula. Do not multiply scores. Multiplying fuzzy numbers (e.g., $3 \times 4 \times 2$) creates false precision and launders bias. Instead, use **Buckets and Hurdles**.

  Set aside 20 minutes per proposal. Work through these three gates in order. If a proposal fails a gate, it stops unless there is a specific "Values Override" (see Part 3).

  #### Gate 1: Importance (The Ceiling Test)
  *Goal: Determine if the problem is big enough that a $100k grant could meaningfully move a metric, even if we can't measure it yet.*

  **Ask:**
  1.  **What is the specific bad thing this prevents or good thing this creates?** (Must be concrete: "meals eaten," "kids reading at grade level," "infections prevented.")
  2.  **If this program succeeds perfectly, how many units of that thing change?** (Ask for a ceiling, not a guarantee.)
  3.  **Is $100k a rounding error or a lever?** (Does this money allow them to do something they literally could not do otherwise, or does it just add 5% to their budget?)

  **Sufficient Answer:**
  *   **Pass:** The grantee can articulate a causal chain where $100k unlocks a specific output (e.g., "hires 2 tutors," "buys cold storage," "funds a specific pilot"). The total problem size is large enough that solving this slice matters.
  *   **Fail:** The goal is vague ("raise awareness," "build capacity") or the $100k is clearly operational padding for an org that will exist anyway.
  *   **No Data Workaround:** If they have no numbers, ask: "What is the smallest unit of success you can point to?" If they can't define a unit, they fail Importance.

  #### Gate 2: Tractability (The Plausibility Test)
  *Goal: Determine if there is a reason to believe this specific intervention works, without demanding RCTs.*

  **Ask:**
  1.  **Has anyone, anywhere, solved this piece of the problem before?** (We don't need *this* org to have done it, but the *method* must be proven.)
  2.  **What is the biggest reason this might fail?** (Force them to articulate the risk.)
  3.  **Do they have the specific capability to execute *this* plan?** (A great food bank is not necessarily a great job trainer.)

  **Sufficient Answer:**
  *   **Pass:** The method is standard/best-practice (e.g., tutoring for literacy, food distribution for hunger) OR it is a pilot of a proven method. They acknowledge a specific risk and have a mitigation plan.
  *   **Fail:** The theory of change relies on a "black box" (e.g., "we mentor them and then they succeed"). They claim their method is totally unique with no external analogues. They cannot name a primary risk.

  #### Gate 3: Neglectedness (The "Why Us?" Test)
  *Goal: Distinguish between "opportunity" and "graveyard."*

  **Ask:**
  1.  **Who else is funding this specific slice?** (Not the general cause, the specific intervention.)
  2.  **If this is so good, why isn't it fully funded by government or major donors?**
  3.  **Does our $100k change the funding landscape?** (Are we the seed? The bridge? Or just a drop?)

  **Sufficient Answer:**
  *   **Pass:** There is a specific funding gap (e.g., "Govt funds operations, no one funds innovation," or "This is too early for big foundations"). Our money unlocks the next phase.
  *   **Fail:** "Nobody knows about us." (This is marketing, not neglectedness). "It's a new idea." (New ideas often fail).
  *   **Crucial Check:** If the answer to #2 is "Because it doesn't work," you must Fail this gate.

  ---

  ### Part 2: Scoring and Decision Rules

  Do not sum the scores. Use a **Traffic Light** system based on the Gates above.

  *   **Green (Fund):** Passes all 3 Gates. High Importance, Plausible Tractability, Clear Funding Gap.
  *   **Yellow (Discuss):** Passes Importance and Tractability, but Neglectedness is Low (crowded space). *Only fund if there is a Values Override (see Part 3).*
  *   **Red (Pass):** Fails any Gate.
      *   Fails Importance = Waste of money.
      *   Fails Tractability = Waste of money.
      *   Fails Neglectedness = Low marginal impact (unless Values Override).

  **The "Math-Washing" Warning:**
  If you find yourself arguing that a "High Importance" cancels out a "Low Tractability," stop. That is a values judgment, not an ITN calculation. ITN assumes all three are necessary conditions for *maximum marginal impact*. If you drop one, you are optimizing for something else (e.g., loyalty, visibility, hope).

  ---

  ### Part 3: The Values Boundary (Where the Board Decides)

  ITN optimizes for **Marginal Impact** (how much good does the *next dollar* do?). Your Board likely cares about **Mission Fit** (does this align with our family identity?). These are different.

  **The Procedure's Stop Sign:**
  When a proposal is **Green on ITN** but **conflicts with Board Mission** (e.g., Global vs. Local), the procedure does *not* decide. It flags the conflict.

  *   **Script for the Board:** "ITN analysis suggests this is the highest-impact use of capital. However, it falls outside our preference for local visibility. We are now deciding between *Impact* and *Community Presence*. Which do we prioritize this year?"
  *   **Script for the Board:** "ITN analysis suggests this is a crowded space (Low Neglectedness). However, keeping this local org alive is vital for community stability. We are deciding between *Efficiency* and *Stewardship*."

  **Where the Procedure Says No:**
  If a proposal is **Red on Tractability** (no reason to believe it works) or **Red on Importance** (money won't move the needle), the procedure recommends a hard No. Do not send these to the board for a "values discussion." There is no value in burning money on things that don't work.

  ---

  ### Part 4: Failure Modes to Watch For

  1.  **The "Graveyard" Trap (Neglectedness Failure):**
      *   *Symptom:* "No one else is funding this."
      *   *Reality:* Everyone else looked and walked away.
      *   *Catch:* Enforce Gate 3, Question 2 ("Why isn't this funded by others?"). If the answer is "They don't understand it," demand evidence. If the answer is "It's hard/risky," that's acceptable. If the answer is vague, treat as Red.

  2.  **The "Drop in the Bucket" Trap (Importance Failure):**
      *   *Symptom:* Huge problem (Pandemics!), tiny grant ($100k).
      *   *Reality:* Your grant changes nothing.
      *   *Catch:* Enforce Gate 1, Question 3 ("Is $100k a lever?"). If they say "We are part of a bigger pool," verify that the pool *needs* your specific $100k to function, not just that it would be nice to have.

  3.  **The "Confidence" Trap (Tractability Failure):**
      *   *Symptom:* Grantee is charismatic, story is compelling.
      *   *Reality:* Confidence $\neq$ Competence.
      *   *Catch:* Enforce Gate 2, Question 2 ("What is the biggest reason this might fail?"). If they can't name a failure mode, they haven't thought it through.

  4.  **The "Local Bias" Distortion:**
      *   *Symptom:* Local projects automatically get scored higher on Importance.
      *   *Reality:* A local food bank helps 1,000 people. A malaria net fund helps 10,000.
      *   *Catch:* Separate "Impact Score" from "Local Preference." Score the impact objectively. Apply the "Local Preference" as a bonus multiplier *after* the ITN score, or as a Values Override. Do not conflate "Local" with "Important."

  ---

  ### Part 5: Trial Run on Your Docket

  Here is how the procedure processes your three anonymized proposals.

  #### Case 1: Local Food Bank Expansion
  *   **Importance:** **Pass.** Hunger is real. $100k buys specific food/storage. Ceiling is clear (X meals).
  *   **Tractability:** **Pass.** Food distribution is proven. Org is well-run.
  *   **Neglectedness:** **Fail (Low).** You noted "everyone knows the director." This implies a crowded funding field. Food banks are usually the first check writers write.
  *   **ITN Verdict:** **Yellow.** (High Importance, High Tractability, Low Neglectedness).
  *   **Board Friction:** The Board will want to fund this. ITN says it's not the *marginal* best use of funds because others are already funding it.
  *   **Procedure Output:** "This is a Stewardship Grant, not an Impact Grant. We are funding community stability, not solving a neglected problem. Approve only if we explicitly designate a portion of the budget for 'Community Maintenance' rather than 'High Impact.'"

  #### Case 2: Early Literacy Interventions (Unpublished Pilot)
  *   **Importance:** **Pass.** Literacy drives life outcomes.
  *   **Tractability:** **Yellow/Mixed.** The *field* is proven, but *this org* has one unpublished pilot. Gate 2 Q2 (Risk): "Scale-up risk."
  *   **Neglectedness:** **Pass (Medium).** Many fund literacy, few fund *early* intervention pilots that bridge to public funding.
  *   **ITN Verdict:** **Yellow.** (High Importance, Medium Tractability, Medium Neglectedness).
  *   **Board Friction:** The Board might find this too risky compared to the Food Bank. ITN likes the *potential* marginal impact more than the Food Bank, but the data gap is real.
  *   **Procedure Output:** "Fund as a 'Learning Grant.' Restrict the $100k to require an external evaluation. If the pilot works, we have bought evidence. If it fails, we knew the risk. Do not fund as a 'Service Grant'."

  #### Case 3: Pandemic Preparedness Pooled Fund
  *   **Importance:** **Pass (High).** Global catastrophic risk.
  *   **Tractability:** **Pass (Medium).** Hard to measure, but prep is logically sound.
  *   **Neglectedness:** **Pass (High).** Govt is slow, private funders are rare.
  *   **ITN Verdict:** **Green.** (High Importance, Medium Tractability, High Neglectedness).
  *   **Board Friction:** **Extreme.** The Board will hate this. It's not local. $100k is a "rounding error" (Gate 1 Q3 risk).
  *   **Procedure Output:** "ITN ranks this #1 for pure impact. However, we must address the 'Rounding Error' objection. Does the pooled fund have a specific threshold where our $100k triggers a match or unlocks a tranche? If yes, Fund. If no, this is a 'Donation' not a 'Grant.' It makes us feel good but changes nothing. If we prioritize 'Feeling like a Player' over 'Marginal Impact,' reject."

  ### Summary of the Conflict
  *   **ITN says:** Fund the Pandemic Pool (Case 3).
  *   **Board Vibes say:** Fund the Food Bank (Case 1).
  *   **The Procedure's Job:** It does not solve this. It forces you to say: *"We are choosing Local Stewardship (Case 1) over Global Marginal Impact (Case 3). We are making a values trade-off, not an analytical error."*

  This stops the board from claiming the Food Bank is "more neglected" or "higher impact." It forces them to admit they value local presence over raw ITN scores. That is the honest outcome you need.
