prompt: |-
  I work at a county records office two days a week and Im writing my MA dissertation in public history on a workhouse collection we hold, and Ive slowly realised my opinions about archives have sprawled into a whole set of commitments that I've never actually checked against each other. You're an archival theorist and philosopher of history, and I want you to think carefully before answering — brainstorm the possible tensions first, don't just pattern-match to "archives are power, isn't that complicated" — because I genuinely don't know where the problems are and I don't want to be told everything is in tension. Here's the set:

  (1) Archives are products of power, not neutral warehouses: what was ever written down, what was kept, and what got catalogued all track what administrators and states cared about, so the silences in the record are themselves evidence about who counted. (2) You can legitimately read records against the grain — police ledgers, workhouse registers, colonial censuses were made to control people, but that's exactly why they're dense with information about those people, and the historian's job is to wring it out. (3) The communities documented in a collection should have a real say over how those records are described and who gets access — I've seen catalogue entries where the description itself is a period slur and I think keeping it there is indefensible. (4) Professional archival standards — provenance, original order, neutral description — are what make an archive trustworthy, and I'd push back on community projects that depart from them. (5) The factual content of a record (how many people were in the workhouse on a given day, what the doctor wrote about a pauper) can be taken at close to face value, even though the archive as a whole is an instrument of control. (6) Because the silences are systematic, any reconstruction of the undocumented from records made by their watchers risks reproducing the watchers' categories — I think this is basically right and also basically not a reason to stop doing it. And (7) I think there's a duty to preserve even the vilest material — hate group membership rolls, colonial photographs, eugenic case files — because that's the evidence that makes accountability and restitution possible at all.

  Go through these and tell me which pairs are genuinely in tension, which only look like they are, and rank them by severity instead of treating every friction as equal. For each real tension, say what would have to give and what giving it up would cost me, and for the merely apparent ones, say what makes them dissolve. And since I'll have to defend this in a viva: tell me which of your judgements you're least confident in, and what argument or consideration would flip a verdict — turn something you called a real tension into a merely apparent one or the other way around. If your whole audit hangs on one contested step, I want to know where the whole thing is most likely to break.
