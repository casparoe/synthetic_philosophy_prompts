  **JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT REGARDING THE EVOLUTIONARY STATUS OF RELIGIOUS PHENOMENA**

  **Date:** October 14, 2023
  **Parties:** Dr. Elena Voss (Department of Cognitive Science) and Dr. Marcus Thorne (Department of Anthropology)

  **I. SHARED COMMITMENTS**

  We, the undersigned, affirm the following premises as the foundation of our collaborative work:

  1.  **Naturalism:** Religious beliefs, behaviors, and institutions are natural phenomena subject to investigation by the standard methods of the empirical sciences. No supernatural ontology is required to explain their origin, persistence, or distribution.
  2.  **Evolutionary Framework:** Human cognitive architecture and human cultural systems are products of evolutionary history. Any account of religion must be compatible with established principles of biological evolution and cultural transmission.
  3.  **Cognitive Mechanisms:** We agree that specific cognitive mechanisms—包括但不限于 hyperactive agency detection, theory of mind capacities, and memory biases for counterintuitive concepts—are necessary conditions for the emergence of religious thought.
  4.  **Scientific Integrity:** Where evidence is insufficient to adjudicate a disagreement, the disagreement shall remain recorded as such, without recourse to rhetorical consolidation.

  **II. STATEMENT OF POSITIONS**

  While we share the premises above, we maintain distinct explanatory models regarding the evolutionary status of religion.

  **Position A (Cognitive Byproduct Model):**
  Religious phenomena are best understood as incidental byproducts (spandrels) of cognitive machinery evolved for other functions. The ubiquity of religious thought results from the side effects of adaptive traits (e.g., detecting agents in noise, navigating social hierarchies). While religion may have downstream consequences, it possesses no *selected-effect function*; evolution did not shape human minds *for* religion, nor did cultural selection retain religion *because* of a specific adaptive benefit it conferred at the group level.

  **Position B (Cultural Adaptation Model):**
  Religious phenomena are best understood as adaptations retained by cultural group selection. Complex religious systems, particularly those involving costly ritual and supernatural punishment, function to solve free-rider problems. These traits were retained because groups possessing them achieved higher levels of internal cooperation and outcompeted groups lacking them. Religion is not merely a byproduct but a functional tool that shaped human social evolution.

  **III. EMPIRICAL CRUXES AND PRE-REGISTERED PREDICTIONS**

  We identify two specific domains where current evidence is insufficient to falsify either position. We agree to treat the following bodies of evidence as decisive for future adjudication.

  **Crux 1: The Chronology of Moralizing High Gods and Social Scale**
  *Question:* Did the emergence of morally concerned "high gods" precede, coincide with, or follow the scaling up of human societies beyond face-to-face communities?

  *Relevant Evidence:* The **Seshat Global History Databank** (specifically data points regarding the codification of moralizing religion vs. the emergence of large-scale polities).

  *Predictions:*
  *   **Dr. Thorne (Adaptation):** Moralizing high gods will statistically *precede* or coincide with the initial scaling of societies. The presence of supernatural punishment is a causal prerequisite for large-scale cooperation.
  *   **Dr. Voss (Byproduct):** Moralizing high gods will statistically *follow* the scaling of societies. Complex theology is a legitimizing ideology constructed *after* social complexity arises via secular means (e.g., economic interdependence, coercive authority), rather than a driver of that complexity.

  **Crux 2: The Coherence of "Religion" as a Selectable Unit**
  *Question:* Does the category "religion" name a coherent cluster of traits upon which selection could act, or is it a folk category lumping unrelated cognitive outputs?

  *Relevant Evidence:* **Phylogenetic analyses of cultural traits** (examining co-variance of ritual, belief, and moral codes across language families and historical lineages).

  *Predictions:*
  *   **Dr. Thorne (Adaptation):** Religious traits (costly ritual, supernatural belief, moral coding) will show significant phylogenetic co-variance, indicating they evolve as a functional suite or complex.
  *   **Dr. Voss (Byproduct):** Religious traits will show weak or inconsistent co-variance. Beliefs, rituals, and moral codes will appear and disappear independently, indicating "religion" is an etic construct imposed by observers rather than a natural kind acted upon by selection.

  **IV. VERBAL AND CONCEPTUAL DISPUTES**

  We identify the following disagreement as primarily verbal rather than substantive. We agree to separate this from our empirical disputes to prevent conceptual conflation.

  **The Definition of "Function"**
  *Dispute:* Dr. Thorne frequently employs "function" to mean *selected-effect function* (a trait exists because it was selected for a specific benefit). Dr. Voss frequently employs "function" to mean *causal-role function* (a trait currently produces a specific effect, regardless of why it exists).
  *Resolution:* We acknowledge that religion may have *causal-role functions* (e.g., reducing anxiety, binding groups) without having *selected-effect functions*. Dr. Thorne claims religion has both. Dr. Voss claims religion has only the former. Future claims must specify which definition is in use.

  **The Definition of "Religion"**
  *Dispute:* Dr. Voss contends "religion" is a Western category with no universal equivalent, making cross-cultural evolutionary analysis suspect. Dr. Thorne contends that while the label is Western, the underlying cluster of behaviors (ritual, supernatural belief) is universal enough for analysis.
  *Resolution:* We agree to operationalize "religion" in our joint work strictly as "commitment to costly rituals motivated by counterintuitive agent representations," avoiding the unqualified use of the noun "religion" where possible.

  **V. SIGNATURES**

  __________________________
  Dr. Elena Voss

  __________________________
  Dr. Marcus Thorne
