      *   *Resolution:* Distinguish between *Constitutive* properties (DNA) and *Historical* properties (Origin). The principle is Historical Essentialism. Mutations are historical accidents *within* the life, not changes to the origin *of* the life. Different sperm is a change to the origin.
      *   *But:* If the mutation makes the DNA identical to what the *other* sperm would have produced, does it matter? User says Yes (V1 says Not Me). This is the incoherence. I must highlight this.

