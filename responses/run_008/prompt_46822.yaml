answer: |-
  Here is the breakdown of Nadia's likely verdicts, the rule driving her brain, and the dessert trap to spring on her.

  ### The Three Rulings

  **1. The Enlightenment: Real.**
  Nadia will accept this. Unlike the Renaissance (which she sees as a cultural veneer on medieval structures), the Enlightenment built its own machinery: the Republic of Letters, the academy system, the encyclopedia projects, the salon networks. These were causally connected institutions that operated across borders. It wasn't just a "vibe"; it was a networked system of knowledge production. It fits her "12th-Century Renaissance" model (institutions + translation/circulation) better than her "Burckhardt Renaissance" model (style + rhetoric).

  **2. The Axial Age: Not Real.**
  This is the easiest call for her. The Axial Age is the ultimate example of "stuff historians glued together afterwards." Jaspers' thesis relies on a *pattern of similarity* (simultaneous philosophical shifts in China, India, Persia, Greece, Israel) without a *causal mechanism* linking them. There was no network connecting Confucius to Socrates. To Nadia, this is typology, not history. It's a retrospective observation of parallel lines, not a description of a single historical object. She will dismiss it as "comparative religion cosplay."

  **3. Late Antiquity: Real.**
  This is the one that might surprise you, but she'll take it. Peter Brown's *Late Antiquity* was explicitly invented to kill the "Dark Ages" (which she already hates as slander). Brown argued that the Mediterranean remained a coherent, causally unified system long after the "Fall of Rome." It posits a specific social and institutional operating system (the rise of the holy man, the shift in patronage, the continuity of the bureaucracy) that holds together from roughly 200 to 700 AD. It's not a "filing drawer" like Early Modern; it's a specific argument about structural continuity. Since she thinks the Middle Ages are real, she needs the bridge that makes them continuous with Rome to be real, too.

  ***

  ### The Rule She Is Running

  You identified two candidate rules:
  1.  **Discontinuity:** Real iff the underlying stuff changed in a genuinely discontinuous way.
  2.  **Causal Unity:** Real iff the label picks out something that was causally a unit and not just a pile of loosely similar things.

  Nadia is running **Rule 2 (Causal Unity)**, but with a specific **Institutionalist** twist.

  Here is why Rule 1 fails:
  *   **The Renaissance:** There *was* a discontinuity in artistic and literary style (and the humanists felt it). If Rule 1 were true, the Renaissance would be Real. She says it's Fake. Why? Because the *institutions* (guilds, church patronage, university structures) remained Medieval. The discontinuity was in the *marketing*, not the *machinery*.
  *   **The Axial Age:** There *was* a discontinuity in human thought patterns globally. If Rule 1 were true, Axial Age would be Real. She will say it's Fake because there is no causal link between the nodes.

  **The Nuance on Humanist Self-Awareness:**
  You mentioned she gets annoyed when you point out Renaissance humanists knew they were reviving antiquity. Here is why that doesn't wreck her verdict:
  For Nadia, **contemporary self-description is data, not truth.** Just because a group of people *say* they are starting a new era doesn't mean the social reality has shifted. The Humanists were writing letters *about* change, but they were working within Medieval *structures*. She distinguishes between **discourse** (what people say is happening) and **structure** (how power/knowledge is actually organized). The Scientific Revolution is Real not because people said so (they didn't), but because the *method* fundamentally broke the previous epistemic structure. The Renaissance is Fake because the *structure* didn't break, even if the *discourse* did.

  ***

  ### The Dessert Test Case

  The Industrial Revolution is a weak test because both rules yield "Real." It was a massive discontinuity *and* it was a causally unified global system (trade, tech transfer, colonialism). You need a case where **Discontinuity is High** but **Causal Unity is Low.**

  **Spring this on her: The Neolithic Revolution.**

  **The Pitch:**
  "Okay, if the Axial Age is fake because it's simultaneous but disconnected, what about the Neolithic Revolution? Agriculture emerges roughly simultaneously in the Fertile Crescent, Mesoamerica, the Andes, and China. It is the single biggest discontinuity in human history (Rule 1 says it's undeniably Real). But current archaeology suggests these were independent inventions with no causal contact between, say, a farmer in Mexico and a farmer in Mesopotamia (Rule 2 says it's Fake)."

  **Why this splits the rules:**
  *   **If she sticks to Rule 1 (Discontinuity):** She must admit the Neolithic Revolution is Real. It changed the "underlying stuff" of human existence more than anything else.
  *   **If she sticks to Rule 2 (Causal Unity/Institutionalism):** She must call it Fake (or at least, "not a single period"). It is a *typological label* applied to five different local processes that look similar. It is, in her terms, "glued together afterwards" by archaeologists who like patterns.

  **My bet on Nadia:**
  She will call it **Fake** (or insist on "Neolithic Transitions," plural). She is too committed to the idea that a "Real" period requires a network of transmission or a unified system. To her, calling it "The Neolithic Revolution" singular is just another 19th-century evolutionary myth, like the Burckhardt Renaissance. It treats humanity as a single unit when it was actually several disconnected experiments.

  If she takes that bait, you've confirmed she is a hardline Causal Unity Institutionalist. If she wavers, you've found the crack in her armor.
