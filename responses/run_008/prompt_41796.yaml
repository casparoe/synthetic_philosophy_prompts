answer: |-
  This is a classic debate in political philosophy, and honestly, you and your friend both landed solid punches. You identified the utilitarian weakness in Pettit's theory (outcomes matter), and she identified the deontological strength (status matters).

  Here is the breakdown you asked for, followed by an adjudication of your specific argument about probability and whether you need to buy her a coffee to apologize.

  ### Part 1: Conceptual Map of the Three Liberties

  To see where Non-Domination (ND) adds value, we have to see where it diverges from Negative Liberty (NL). Positive Liberty (PL) is often the outlier here, but it helps to see all three.

  | Feature | **Negative Liberty (Berlin)** | **Positive Liberty (Berlin)** | **Non-Domination (Pettit/Republican)** |
  | :--- | :--- | :--- | :--- |
  | **Core Question** | "What is the area within which I am left alone?" | "Who is the master of my will?" | "Am I dependent on another's arbitrary will?" |
  | **Definition of Unfreedom** | **Interference.** Actual barriers or coercion preventing action. | **Internal/External Constraint.** Ignorance, addiction, or oppression preventing self-mastery. | **Domination.** The *capacity* for arbitrary interference, regardless of use. |
  | **The "Kind Master" Case** | **Free.** If the master doesn't interfere, the slave is free (in that moment). | **Unfree.** The slave is not self-governing; their will is subject to another. | **Unfree.** The slave is dominated because the master *can* interfere arbitrarily. |
  | **Metric** | **Outcome-based.** Count the open doors. | **Agency-based.** Measure autonomy and rationality. | **Status-based.** Measure structural power and dependency. |
  | **Remedy** | Remove barriers/laws (Laissez-faire). | Education, rational alignment, state enabling. | Structural checks, rule of law, democratic contestability. |
  | **Where ND Collapses into NL** | When power is perfectly monitored. If the capacity to interfere is checked by law, ND looks like secure NL. | N/A | When the *fear* of interference is purely probabilistic and doesn't alter behavior. |
  | **Where ND Adds Value** | Fails to capture the *anxiety* of dependency. | Fails to capture *external* structural power without claiming internal irrationality. | Captures the **chilling effect** and **social status** that NL ignores. |

  **The Crucial Distinction:**
  *   **Negative Liberty** cares about the *exercise* of power.
  *   **Non-Domination** cares about the *possession* of power.

  ---

  ### Part 2: Adjudicating Your Probabilistic Reduction

  Your argument was: *Domination is just Negative Liberty + Probability of Interference.*
  Her argument was: *Domination is a structural status that incurs costs (appeasement) independent of probability.*

  Here is the verdict on who is right.

  #### 1. Is she right that domination tracks something expected interference can't?
  **Yes, she is.** Your probabilistic reduction fails to capture the **cost of anticipatory conformity.**

  In Negative Liberty, a constraint only counts if it stops you. In Non-Domination, the *existence* of the power changes your behavior before any interference happens.
  *   **The Scenario:** The capricious boss has a 1% chance of firing you.
  *   **Your View:** You are 99% free. The expected cost is low.
  *   **Her (Pettit's) View:** You are 100% dominated. Because that 1% exists and is *arbitrary* (based on his whim, not a rule), you must invest energy in monitoring his mood, suppressing your opinions, and currying favor.

  **Why your reduction misses this:** Probability calculates the risk of the *event* (firing). It does not calculate the cost of the *relationship* (servility). Even if the firing never happens, the *need to appease* is a restriction on your liberty that exists *now*, not in the future. It is a "chilling effect." Negative liberty counts the door slamming; Non-domination counts the fact that you're afraid to touch the handle.

  **Verdict:** Your reduction works for **welfare** (material outcomes), but it fails for **liberty** (range of action). The dominated employee *chooses* differently than the non-dominated one, even if neither gets fired. That difference in choice is a loss of liberty that probability doesn't capture.

  #### 2. Does her position smuggle Positive Liberty back in?
  **Partially, but not fatally.**

  You suspected that "having to keep him pleased" is about *who governs your choices*, which sounds like Positive Liberty (self-mastery).
  *   **Positive Liberty** says you are unfree if you are ruled by your baser instincts or false consciousness. It is internal.
  *   **Non-Domination** says you are unfree if you are ruled by another's *will*. It is external.

  However, you hit on a real tension. Pettit tries to avoid Positive Liberty by focusing on **arbitrariness**. If the boss can only fire you for cause (contract), he interferes with you, but he doesn't dominate you, because his power is tracked by *your* interests (the contract you agreed to).

  When your friend says the dominated employee "shapes her life around his goodwill," she is describing a loss of autonomy. But she frames it as a **loss of standing**, not a loss of rationality. The employee is unfree not because she isn't "self-governing" enough (Positive), but because the *social structure* denies her the status of an equal.

  **Verdict:** It's not a smuggle of Positive Liberty, but it is a shift from "freedom as non-interference" to "freedom as security of status." It's closer to Positive Liberty than Berlin admitted, but it remains distinct because it focuses on external power relations, not internal psychological mastery.

  #### 3. Is her "Proves Too Much" point fatal to your move?
  **No, but it highlights a category error.**

  Her argument: *If everything is probability, then the unionized employee (0.5% risk) isn't truly free either, so the concept breaks.*

  Your counter (which you grumbled): *Maybe freedom is just a continuum.*

  **Analysis:**
  She is defending a **binary concept** (Dominated vs. Non-Dominated). Pettit wants to say the unionized worker is *free* (structurally secure) and the at-will worker is *unfree* (structurally insecure), regardless of the tiny probability difference.
  You are defending a **gradient concept** (More or Less Free).

  Her point isn't fatal to your reduction; it's fatal to *her* desire for crisp categories. You are right that in the real world, nothing is 0% risk. However, she is right that **law and structure create qualitative shifts.** A contract changes the *nature* of the power (from arbitrary to rule-bound), not just the *probability* of its use.

  **Verdict:** Your reduction survives, but only if you admit you are talking about **degrees of security**, whereas she is talking about **types of relationship**. You are arguing about *risk management*; she is arguing about *rights*.

  ---

  ### Part 3: The Final Verdict (Do you owe an apology?)

  **You do not owe an apology for your logic, but you might owe one for dismissing the "status" argument.**

  **Where you were right:**
  You correctly identified that for most practical, policy-making purposes, Non-Domination often collapses into Negative Liberty with high security. If the probability of interference is low enough, the "domination" feels theoretical. Your probabilistic reduction is a powerful utilitarian critique: *Why care about the power to harm if the harm never comes?*

  **Where she was right:**
  She correctly identified that human beings live strategically. We don't just react to bullets; we react to the gun pointed at us. The "cost of appeasement" is a real liberty cost that your probability model ignores. By reducing it to probability, you ignored the **psychological and behavioral tax** of living under arbitrary power.

  **The Synthesis:**
  *   **You** are arguing from the perspective of **Outcome Freedom** (What actually happened to me?).
  *   **She** is arguing from the perspective of **Status Freedom** (What is my position relative to others?).

  Pettit's theory exists specifically to protect the latter. A slave with a kind master has high Outcome Freedom but zero Status Freedom. You were arguing that Outcome Freedom is what matters. She was arguing that Status Freedom is what matters.

  **Recommendation:**
  Go back to her and say this:
  *"I thought about it. You're right that my probability argument ignores the 'chilling effect'—the fact that I have to change my behavior just because the power exists, even if it's never used. That's a real cost to liberty that isn't just interference. But I still think that from a policy standpoint, we should care mostly about reducing the probability of harm. You win on the definition of the relationship; I win on the measurement of the outcome."*

  That acknowledges her philosophical win (the distinction is real) without conceding your practical point (outcomes matter most). No apology needed, just a refinement.
