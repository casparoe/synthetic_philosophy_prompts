      *(Refining the "Killer")*: The circularity of causation is good. But an even better one for *this* audience might be: "If you are neutral on the number of worlds, how do you avoid arbitrariness in truth conditions?" No, the circularity is more metaphysical. Let's go with the circularity of causation/modal isolation. Actually, the *epistemic* access combined with *causal* isolation is the classic Lewis weak point. But since I'm modifying Lewis, the definition of "causal isolation" without spacetime is the technical weak point. Let's make the "Killer" about the definition of causation presupposing modality.

      *(Final Polish)*: Ensure the "Voice" matches. Quineans sound dry/empirical. Pragmatists sound utility-focused. Grads sound skeptical/deflationary.

