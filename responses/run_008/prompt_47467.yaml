answer: |-
  # Workshop Q&A Strategy Sheet
  **Topic:** Trimmed Modal Realism (Concrete Worlds, Causal Individuation, Neutral Plenitude)
  **Audience:** Hostile (Quineans, Nominalists, Pragmatists, Deflationists)

  ## Strategic Overview

  **Concede Up Front:**
  1.  **Ontological Cost:** Acknowledge this view is not parsimonious in terms of *quantitative* ontology. Do not try to pretend these worlds are cheap.
  2.  **Empirical Undetectability:** Admit these worlds are not detectable by standard scientific instrumentation.
  3.  **Neutrality:** Admit that staying neutral on the *number* of worlds leaves some modal claims indeterminate until further theoretical work is done.

  **Hold Firm (Core Commitments):**
  1.  **Truthmakers:** Modal claims (e.g., "I could have worn a blue shirt") are truth-apt and require truthmakers.
  2.  **Concrete Nature:** Abstract proxies (propositions, states of affairs) cannot ground the *reality* of possibility; only concrete existence can.
  3.  **Causal Individuation:** Spatiotemporal separation is too tied to *our* physics; causal isolation is the metaphysically prior condition for worldhood.

  **The "Killer" Question (Hope Nobody Asks):**
  *"If causation is understood counterfactually (as many Humeans argue), and you define worlds by causal isolation, isn't your analysis of modality viciously circular?"*

  ---

  ## The Objections (Ordered by Damage)

  ### 1. The Quinean Indispensability Challenge
  **Who:** Neo-Quineans
  **The Objection:** "Ontology should be the catalogue of what our best science quantifies over. Physics quantifies over fields, particles, and spacetime manifolds. It does not quantify over causally isolated concrete universes. If science doesn't need them to predict observation, why should metaphysics posit them? You're violating the naturalistic constraint on ontology."
  **The Reply (2 mins):**
  "I grant that science doesn't *predict* observations using modal realism. But ontology isn't just about prediction; it's about explanation. Science presupposes modal truths (laws of nature are necessary, not just regularities). If we take scientific realism seriously, we need truthmakers for the modal claims science relies on. My position is an Inference to the Best Explanation: concrete worlds provide the robust truthmakers required to ground the modal assumptions of science itself. We aren't doing science; we are grounding the modal logic that makes science intelligible. To deny the ontology because it's not in the physics textbook is to confuse the map with the territory."
  **Soft Spot:** Relies on the premise that science *needs* robust modal truthmakers. Quineans may argue science only needs extensional regularities.

  ### 2. The Epistemic Access Problem
  **Who:** Grad Cohort / Quineans
  **The Objection:** "If these worlds are causally isolated from us, by definition we cannot interact with them. So, how do you know they exist? If there is no causal chain connecting me to a possible world, any belief I form about it is uncaused and therefore unjustified. You're positing a realm that is in principle unknowable."
  **The Reply (2 mins):**
  "This assumes a causal theory of knowledge that is too strict for metaphysical entities. We don't have causal access to numbers or sets, yet we accept mathematical knowledge. My access is theoretical, not perceptual. I infer the existence of these worlds because they systematize our modal discourse better than any alternative. Just as we posit electrons to explain tracks in cloud chambers, I posit worlds to explain the truth of counterfactuals. The lack of causal interaction is a feature, not a bug—it ensures they are distinct worlds—but it doesn't preclude theoretical knowledge via IBE."
  **Soft Spot:** Comparing concrete worlds to abstract mathematical objects undermines the "concrete" claim. If they are concrete but unknowable, they look like noumena.

  ### 3. The Circularity of Causal Isolation
  **Who:** Phil of Math / Metaphysicians
  **The Objection:** "Lewis used spatiotemporal separation because it was primitive. You use 'causal isolation.' But causation is arguably a modal notion (cause *makes* effect happen). If you define worlds by causal isolation, and causation presupposes modality, aren't you defining modality in terms of itself? You haven't reduced modality; you've just moved it."
  **The Reply (2 mins):**
  "I am not offering a reductive analysis of modality in terms of causation. I am offering an *individuation* criterion for worlds. I take causation as a primitive relation that holds within a world but fails across worlds. This isn't circular; it's structural. We observe causal connectivity here. We posit that where such connectivity stops, a world boundary begins. This avoids Lewis's problem of tying worldhood to human physics (spacetime). It allows for worlds with different physical laws, provided they remain causally disconnected from us."
  **Soft Spot:** If causation *is* inherently modal (as many argue), the individuation criterion fails to ground the ontology non-circularly. This is the technical weak point.

  ### 4. The Pragmatist's "So What?"
  **Who:** Pragmatist
  **The Objection:** "Let's say you're right. There are concrete other worlds. What difference does it make? Does it change how we act? Does it solve a practical problem? If modal talk is just bookkeeping for managing expectations and planning, reifying it into concrete universes is expensive machinery for a simple filing system. Why not just keep the bookkeeping?"
  **The Reply (2 mins):**
  "It makes a difference to truth. If modal talk is *just* bookkeeping, then 'It is possible that P' has no truth value independent of our current linguistic practices. That makes scientific discovery about possibilities accidental. By reifying the worlds, I secure the objectivity of modal claims. This matters for ethics (could I have done otherwise?), for science (is this law necessary?), and for logic. The 'cost' is ontological; the 'gain' is objective truth. A filing system doesn't make sentences true; reality does."
  **Soft Spot:** Pragmatists don't care about "objective truth" in the metaphysical sense. They view that goal as illusory.

  ### 5. The Paraphrase Alternative (Ersatzism)
  **Who:** Phil of Math
  **The Objection:** "I can paraphrase 'There is a possible world where P' as 'There is a consistent set of propositions where P.' This costs me no new concrete ontology. Why should I buy your concrete universes when linguistic ersatzism does the same logical work for free?"
  **The Reply (2 mins):**
  "Propositions are abstract. Abstract objects cannot ground *possibility* in the robust sense required for contingency. A consistent story about a flying pig doesn't make a flying pig *possible*; it just makes the story consistent. Only a concrete flying pig (somewhere) makes 'flying pigs are possible' true. Ersatzism confuses the description of a possibility with the possibility itself. I offer truthmakers; they offer synonyms."
  **Soft Spot:** Many philosophers are comfortable with abstract truthmakers. Insisting on concrete ones looks like fetishism to nominalists.

  ### 6. The "Incredulous Stare" (Lite)
  **Who:** Grad Cohort
  **The Objection:** "This is just magic. You're asking us to believe there are literally other universes exactly like ours but different, just 'causally cut off.' It's intuitively absurd. Why should we override our basic intuition that only *this* world exists?"
  **The Reply (2 mins):**
  "Intuition is a poor guide to fundamental ontology. Quantum mechanics is intuitively absurd. General relativity is intuitively absurd. We accept them because they work. Modal realism works for modal logic. The 'absurdity' comes from treating 'actual' as an absolute property rather than an indexical. 'Actual' just means 'this world I am in.' Other beings in other worlds call their world 'actual.' Once you accept the indexicality of actuality, the incredulity fades."
  **Soft Spot:** Lewis's indexical answer is standard, but combining it with *causal* isolation makes 'actual' mean 'causally connected,' which feels less indexical and more objective, reigniting the stare.

  ### 7. The Problem of "Actual" Privilege
  **Who:** Neo-Quineans
  **The Objection:** "If all worlds are concrete and of the same kind, why is *this* one the site of all our evidence? If there are infinite (or many) worlds, the probability of me being in *this* specific one seems vanishingly small. Doesn't this require an explanation you can't provide?"
  **The Reply (2 mins):**
  "It requires no explanation. It's a selection effect. I can only ask questions from a world where observers exist to ask them. Asking why I am in this world is like asking why I am here now. I couldn't be asking this from a world where I don't exist. The 'privilege' is perspectival, not ontological. All worlds are ontologically equal; only one is epistemically accessible to me."
  **Soft Spot:** Doesn't fully address why *this* causal cluster exists rather than none, but deflects the probability argument well enough.

  ### 8. The Indeterminacy of Quantity
  **Who:** Grad Cohort
  **The Objection:** "You say you're neutral on how many worlds there are. But if I ask 'Is it possible that X?', the truth value depends on whether a world containing X exists. If you don't know how many worlds there are, or which ones, don't most modal claims become indeterminate? You've saved ontology at the cost of logic."
  **The Reply (2 mins):**
  "Not indeterminate, but theory-relative. Just as we might be unsure if a mathematical object exists until we prove it, we might be unsure of a modal claim until we construct the world. My neutrality is a virtue: I don't commit to a 'plenitude principle' that forces worlds to exist just to make sentences true. I let the modal facts dictate the ontology, not the other way around. If we can't determine if a world exists, we should suspend judgment on the modal claim."
  **Soft Spot:** This admits that many ordinary modal claims might lack truth values, which is a hard pill for realists to swallow.

  ---

  ## Tactical Notes for the Defense

  *   **On Causation:** If pressed on the definition of causation, retreat to a "primitive intuition" defense. Do not attempt a counterfactual analysis of causation in this room; it will trap you.
  *   **On Science:** Do not fight the Quineans on empirical evidence. Fight them on *explanatory scope*. Argue that their ontology cannot account for the truth of modal statements, which is a theoretical failure.
  *   **On Tone:** Remain humble about the "weirdness." Acknowledge the cost. Your selling point is not that this is *easy* to believe, but that it is the only view that takes modal truth *seriously*.
  *   **If the Killer Question Comes:** (Circularity of Causation).
      *   *Response:* "I treat causation as a non-modal primitive relation of energy/information transfer. If you insist causation is modal, then I am not reducing modality, but offering a structural realist account of it. The goal is not reduction, but systematization." (This is a retreat, but necessary to survive).
