answer: |-
  It is a fascinating puzzle you present. Your friend's positions are remarkably consistent, which suggests a coherent underlying philosophy rather than a mere collection of intuitions. The tension you perceive regarding the sixteen- and seventeen-year-olds is astute, but I believe it can be resolved by carefully weighing the principles against her most contentious commitment: the vote for prisoners.

  Here is an analysis of the candidate rules, my deduction of her tacit principle, my prediction for the referendum, and the decisive test case.

  ### Candidate Rules

  Based on her track record, three competing principles emerge that could rationalise her views:

  1.  **The All-Affected Principle (Interests):**
      *   *The Rule:* Anyone whose significant interests are impacted by a government's decisions should have a say in that government.
      *   *Fit:* This explains the long-term residents (interests in local economy), the prisoners (interests in prison conditions and reintegration), and the teenagers (interests in schools and buses). It explains the exclusion of tourists (interests are transient) and expatriates (interests are attenuated).
      *   *Weakness:* It is notoriously difficult to draw the line. A tourist's holiday is affected by bus routes; a foreign investor's portfolio is affected by tax policy. Her exclusion of tourists suggests 'affected interests' alone is insufficient without a threshold of duration or depth.

  2.  **The Reciprocity Principle (Duties and Contribution):**
      *   *The Rule:* The franchise belongs to those who bear the burdens of the cooperative scheme, specifically through taxation and obedience, and in return, they must participate (hence compulsory voting).
      *   *Fit:* This explains the long-term residents (taxpayers), the exclusion of tourists (no tax contribution), and the exclusion of expatriates (no tax contribution). It aligns well with her support for compulsory voting, framing the vote as a civic duty.
      *   *Weakness:* It struggles significantly with the prisoner case. Prisoners generally do not pay taxes and have, by definition, breached the duty of obedience. If voting were strictly reciprocal to contribution or good behaviour, prisoners would be the first to lose the franchise.

  3.  **The All-Subjected Principle (Coercion and Residency):**
      *   *The Rule:* The vote attaches to those who are subject to the coercive power of the state on a sustained, daily basis. Membership is defined by residency and subjection to the law, not by moral merit or economic output.
      *   *Fit:* This fits the long-term residents (subject to laws), excludes tourists (temporary subjection), excludes expatriates (no longer subject to daily coercion), and includes prisoners (the most intensely subjected group). It also accommodates compulsory voting: if one is subject to the state, one has a duty to participate in its direction.
      *   *Weakness:* It requires a clear definition of 'residency' or 'subjection', which can be fuzzy at the margins (e.g., how long must one reside?).

  ### The Tacit Rule

  I am confident your friend is tacitly running the **All-Subjected Principle**, tempered by a requirement for **sustained residency**.

  The prisoner case is the keystone here. It effectively demolishes the Reciprocity Principle. If she believed voting was a reward for contributing to the cooperative scheme or obeying its laws, she could not consistently argue for prisoner enfranchisement. By including prisoners, she signals that the vote is not a reward for merit or contribution, but a protection for those under the state's power.

  Similarly, the exclusion of expatriates who have been gone for thirty years supports the All-Subjected Principle over the All-Affected Principle. An expatriate might still be financially affected by UK policy (pensions, currency), but they are no longer subject to the daily coercive apparatus of the state (police, local bylaws, mandatory education).

  The compulsory voting stance reinforces this. If the vote is a mechanism for those subject to power to direct that power, then abstention is a dereliction of duty. It treats voting not as a consumer choice (which one might opt out of) but as a function of citizenship/residency.

  ### Prediction on the Referendum

  **Verdict:** She will support extending the vote to sixteen- and seventeen-year-olds for this referendum.

  **Reasons:**
  1.  **Subjection:** Sixteen- and seventeen-year-olds are residents. They are subject to the laws regarding the bus network (public order, fares) and education (compulsory attendance laws until 18). They fit the 'subjected' criterion perfectly.
  2.  **Specific Affected Interest:** While the All-Subjected Principle is her baseline, the specific nature of this referendum (schools and buses) targets their primary spheres of life. Even if she prioritises subjection, the intensity of the impact here makes the case overwhelming.
  3.  **Duty vs. Capacity:** You worry that they bear few duties. However, her support for prisoner voting suggests economic or civic 'duties' (like taxpaying) are not prerequisites for the franchise. Regarding compulsory voting: if they are enfranchised for the referendum, her principle suggests they should be compelled to vote. In jurisdictions with voting ages of 16 (such as Austria or Brazil), this is legally coherent. She will likely view the 'one-off' extension as creating a temporary membership status for the purpose of that decision, triggering the duty to participate.

  She will likely argue that to deny them the vote is to subject them to governance without representation, which violates the core logic of her position on prisoners and residents.

  ### The Discriminating Case

  To definitively distinguish between the **All-Affected Principle** (Interests) and the **All-Subjected Principle** (Residency/Coercion)—which are the two strongest contenders remaining—I propose the following case:

  **The Non-Resident Property Owner.**

  Consider a British citizen who emigrated ten years ago, lives entirely abroad, and is not subject to UK daily laws, but **owns a rental property in the city** and pays council tax on it.

  *   **Why this discriminates:**
      *   **Under the All-Affected/Interest Principle:** This person has a direct financial stake in the council's decisions (property values, local services, council tax rates). Their interests are materially affected, similar to the teenagers' interest in schools. If your friend supports the vote here, she prioritises *stake* over *residency*.
      *   **Under the All-Subjected Principle:** This person does not live in the constituency. They are not subject to the daily coercive power of the local council (bin collections, local policing, bus routes). They fit the description of the expatriates she already excluded, save for the property. If she opposes the vote here, she confirms that *physical presence and subjection* are the master keys, not financial interest.

  Given her exclusion of expatriates (even if she left the property clause slightly ambiguous by specifying those with *no* property), I suspect she would deny this person the vote. This would confirm that for her, the franchise is about **who lives under the law**, not merely **who has money at risk**. This distinction clarifies why teenagers (who live under the law) are in, while wealthy absentee landlords (who do not) are out.
