answer: |-
  # The Arithmetic of Existence: A Verdict on Totalism and the Repugnant Conclusion

  For those of us who have tracked population ethics from the early blogs of the rationalist sphere to the formalized long-termism of the present decade, the Repugnant Conclusion (RC) has ceased to be a paradox and become a parameter. It is a boundary condition on any moral theory that claims to guide action over cosmic timescales. The question you pose is not whether Total Utilitarianism (Totalism) entails the RC—it does, mathematically—but whether the RC constitutes a *reductio ad absurdum* sufficient to discard Totalism, given the catastrophic costs of the alternatives.

  To answer this, we must distinguish between the formal landscape, which is largely settled, and the normative landscape, which remains fiercely contested. We must also rigorously stress-test your proposed hybrid. The verdict, I argue, is that the RC does not logically refute Totalism, but it normatively destroys it. The price of maintaining Totalism is the abandonment of lexical intuitions about value that are more robust than the axioms supporting aggregation. We must reject Totalism, but we must do so with eyes open to the impossibility theorems that await any escape.

  ### 1. The Phenomenology of Z: Parfit's Correction

  Parfit's original formulation in *Reasons and Persons* invited a specific visual: a world of "muzak and potatoes," where lives are drab but strictly positive. Critics of the RC often attack this imagery, suggesting the repugnance stems from the blandness of Z, not the aggregation. Parfit himself corrected this, noting that Z-lives need only be *barely* worth living, not miserable. They can contain love, achievement, and beauty, merely at a lower intensity or frequency than the A-world.

  Does this correction neutralize the repugnance? No. It sharpens it.

  If the Z-lives were miserable, Totalism would be obviously false on simple welfare grounds. The force of the RC lies precisely in the fact that the Z-lives are *good*. The intuition that rejects the RC is not a confusion about suffering; it is a **lexical intuition**. It is the conviction that certain values (peak flourishing, deep autonomy, profound art) possess a qualitative weight that cannot be traded off against quantity, regardless of how many "barely good" lives are stacked against them.

  When we describe Z as containing love and achievement, we are asked to believe that a trillion units of "diminished love" outweigh a billion units of "peak love." For the Totalist, this is simple arithmetic. For the critic, it is a category error. The persistence of the repugnant intuition, even after Parfit's phenomenological correction, suggests that the conflict is not about the *content* of the lives, but about the *structure* of value. If value were purely additive, the RC would be transparently true. The fact that it remains opaque to many competent moral judges suggests that value is not purely additive. Therefore, Parfit's nuance saves Totalism from empirical misdescription, but not from normative rejection.

  ### 2. The Price of Escape: Arrhenius and the Impossibility Theorems

  Here we move from contested intuition to settled formalism. Gustaf Arrhenius's impossibility theorems demonstrate that no population axiology can satisfy a set of seemingly adequate adequacy conditions simultaneously. Specifically, you cannot satisfy **Dominance** (if everyone is better off, the outcome is better), **Non-Elitism** (there is no welfare level so high that adding a life below it cannot be compensated by adding enough lives above it), and **Avoidance of the Repugnant Conclusion** all at once.

  This is the "price of escape" you referenced.
  *   **Averagism** avoids the RC but fails Dominance and yields the "Ecstatic Hermit" conclusion (one perfect life is better than billions of flourishing ones). It also struggles with the "Mere Addition" paradox, often cycling back into intransitivity or the RC anyway.
  *   **Critical-Level Utilitarianism** (setting a threshold above zero) avoids the RC but risks the **Sadistic Conclusion**: it can imply that adding a number of lives with *negative* welfare (suffering) is better than adding a larger number of lives with *positive* welfare (below the critical level).
  *   **Lexical Views** (which forbid the trade-off entirely) avoid the RC but violate Non-Elitism and can imply that we should prioritize a single person's minor gain over the existence of vast populations, provided the existing population is above the lexical threshold.

  This landscape is settled mathematics. The contestation lies in which axiom to sacrifice. Totalists sacrifice the intuition against RC. Averagists sacrifice Dominance. Critical-Level theorists risk the Sadistic Conclusion.

  The EA and Long-Termist communities have largely leaned Totalist because it preserves **Separability** (the value of a sub-population is independent of others) and **Dominance**, which are crucial for decision theory under uncertainty. However, preserving these structural axioms at the cost of the RC requires accepting that the value of the future is essentially a gas: it expands to fill the available volume of persons, regardless of density.

  ### 3. Assessing the Hybrid: Number-Dampened Utilitarianism

  Your proposal is a form of **Number-Dampened Utilitarianism (NDU)**. Formally, instead of $V = \sum u_i$, you propose $V = g(n) \times \sum u_i$, where $g(n)$ is a decreasing function of population size $n$. Alternatively, it can be framed as the marginal value of the $n$-th person declining as $n$ increases.

  **Does it block the slide from A to Z?**
  Only if the dampening is sufficiently aggressive. If the total weight assigned to population size, $W(n) = n \times g(n)$, is unbounded (e.g., $g(n) = 1/\sqrt{n}$, so $W(n) = \sqrt{n}$), then for any fixed utility level in Z, there exists a population size large enough to outweigh A. To *guarantee* a block on the RC, the aggregate weight function $W(n)$ must be bounded (e.g., logarithmic or asymptotic). If the moral value of population size caps out, then quantity can never overwhelm quality.

  **The Cost: Violation of Separability**
  You correctly identify the cost: Separability. In your hybrid, the value of adding a child depends on how many strangers exist elsewhere. If the world is empty, the child counts for 1.0. If the world has a trillion people, the child might count for 0.0001.
  Totalists argue this is absurd: why should the moral value of my act depend on the number of people in Andromeda?
  However, this objection assumes that moral value is a property of *atoms* (individual lives) rather than *structures* (populations). If we view value as emergent from the shape of a civilization, then density matters. A hundredth person adds diversity; a hundred-trillionth adds congestion (even if physical resources are infinite, there is a "moral congestion" of significance).

  **The Cost: The Very Repugnant Conclusion**
  A more dangerous formal risk for your hybrid is the **Very Repugnant Conclusion**. This occurs when a population with both excellent lives and terrible suffering lives is ranked higher than a population with merely good lives, simply because the suffering population is larger. If your dampening function applies to the sum, it treats positive and negative welfare symmetrically. If you add enough suffering lives (negative utility), they drag the sum down. But if you add enough *barely positive* lives, they might outweigh the suffering in a Totalist framework. In a dampened framework, if the dampening applies to the *count*, it might paradoxically make adding suffering people less "costly" in a large population than adding happy people, depending on the exact formulation. To avoid this, the dampening must apply to the *marginal contribution* of each life, not just the aggregate sum.

  **Is the price worth paying?**
  Yes. Violating Separability is a technical cost; validating the RC is a substantive catastrophe. Separability is a heuristic for moral reasoning, useful for its tractability. The intuition that a world of peak flourishing is better than a world of teeming mediocrity is a core judgment about the *good*. We should sacrifice the heuristic to save the judgment.

  ### Verdict: Reject Totalism

  Does the Repugnant Conclusion refute Totalism?

  **Logically, no.** Totalism is internally consistent. As Torbjörn Tännsjö has argued, if one accepts the premises of welfarism and impartiality, the RC follows. One can, with philosophical discipline, bite the bullet. There is no contradiction in asserting Z is better than A.

  **Normatively, yes.** A moral theory that yields conclusions which violate our most confident considered judgments about value is defective. The "settled" formal results (Arrhenius) tell us we must choose our poison. The choice is between violating **Separability** (your hybrid) or violating **Lexical Intuitions** (Totalism).

  Separability is a structural axiom about how we calculate value. Lexical Intuitions are substantive claims about what value *is*. It is preferable to have a complex calculation rule (where the value of a birth depends on population context) than to accept a substantive outcome where the depth of human experience is rendered irrelevant by the sheer count of existences.

  Furthermore, in the context of the long-term future, Totalism creates a "moral hazard" of quantity over quality. If the marginal value of a life never declines, then any reduction in quality is permissible provided the population expansion is large enough. This incentivizes a future where the primary moral imperative is to fill the universe with the minimum viable conscious entity. This is not a bug of Long-Termism; it is a feature of Totalism.

  **The Decision:**
  We must reject Totalism. The Repugnant Conclusion is not a curiosity; it is a signal that the linear aggregation of welfare is a category error when applied to existence itself. Your hybrid proposal (Number-Dampening) is the most viable path forward, provided the dampening function is bounded to ensure the RC is mathematically impossible, not just pushed further out.

  The violation of Separability is a price worth paying. It forces us to acknowledge that the value of a life is contextual, dependent on the civilization that sustains it. A life added to a sparse, flourishing cosmos is a miracle; a life added to a saturated, stagnant trillion-person equilibrium is a statistic. Totalism cannot distinguish between the two. Your hybrid can.

  **Final Judgment:** Totalism is false. The Repugnant Conclusion refutes it as a viable guide for moral action, even if it remains logically consistent. We must accept the complexity of non-separable views to preserve the sanctity of flourishing.
