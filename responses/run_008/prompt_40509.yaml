answer: |-
  This is an excellent philosophical dissection of a common proverb. "When in Rome, do as the Romans do" sounds like a single instruction, but it conflates several distinct normative claims ranging from practical strategy to moral obligation.

  Given your context in Tokyo—a society with high social cohesion, strong implicit norms, and specific practices regarding tipping (forbidden) and queueing (strict)—the stakes of these interpretations are concrete.

  Here are four distinct precise claims the maxim might be making, evaluated by plausibility, action-guidance, and your two specific edge cases.

  ---

  ### 1. The Prudential Claim (Avoidance of Friction)
  **The Claim:** You should follow local conventions solely to minimize negative consequences for yourself (social awkwardness, confrontation, legal trouble, or inefficiency).
  **Nature:** Instrumental / Self-Interested.

  *   **Plausibility:** **High.** In Tokyo, where social harmony (*wa*) is prioritized, deviating from norms often incurs immediate social costs (stares, refusal of service, subtle ostracization) even if no law is broken.
  *   **Does it settle what you should do?** **Yes, conditionally.** It settles the action *if* you value smooth social integration over the expression of your own preferences. It tells you to calculate the cost of deviation.
  *   **Edge Case A (Worse Norms):** **No obligation.** If you believe the local norm is worse (e.g., a tipping norm that sustains low wages), this claim does not obligate you to follow it *unless* the penalty for non-compliance is high. If you can deviate without consequence, prudence permits deviation.
  *   **Edge Case B (Harmless Deviation & Enforcement):** **No license to enforce.** If your deviation truly harms no one and you are willing to accept the minor friction, locals have no normative right to pressure you. Their pressure is merely a power move, not a moral enforcement.
  *   **Verdict:** This is the most common usage, but it reduces the maxim to "don't get caught" or "don't make waves."

  ### 2. The Epistemic Claim (Local Knowledge)
  **The Claim:** Locals possess superior knowledge about the function and context of their conventions. Your judgment that a norm is "worse" or "harmless" is likely flawed due to your ignorance of the local ecosystem.
  **Nature:** Cognitive / Humility-based.

  *   **Plausibility:** **Moderate to High.** Social norms are often complex equilibria. For example, you might view Japan's no-tipping rule as "servers aren't valued," whereas the local view is "service is included in the price; tipping insults their professionalism." Your home heuristic might misfire here.
  *   **Does it settle what you should do?** **Presumptively.** It creates a defeasible obligation. You should follow the norm *until* you have sufficiently investigated to confirm your moral intuition isn't just cultural bias.
  *   **Edge Case A (Worse Norms):** **Challenges your assessment.** If you think a queuing norm is unfair, this claim suggests you may not understand *why* it is structured that way (e.g., efficiency in high-density transit). However, if you confirm the norm is genuinely unjust (e.g., discriminatory), the epistemic deference collapses.
  *   **Edge Case B (Harmless Deviation & Enforcement):** **Licenses gentle correction.** If locals press you, this claim suggests they aren't being oppressive; they are correcting your informational deficit. They know something about the "harm" you don't see (e.g., your deviation signals disrespect, which *is* a harm in a high-context culture).
  *   **Verdict:** This is a strong argument for initial compliance, but it cannot sustain obligation against clear moral convictions.

  ### 3. The Fair Play Claim (Coordination & Obligation)
  **The Claim:** Social conventions are coordination equilibria. By accepting the benefits of living in the society (safety, order, infrastructure), you incur an obligation of "fair play" to uphold the conventions that sustain those benefits, even if you didn't consent to them explicitly.
  **Nature:** Moral / Political Obligation (Hart/Rawls).

  *   **Plausibility:** **Moderate.** This works well for public goods (queueing for the train, noise control). It works poorly for private transactions (tipping at a private restaurant) or norms that lack a clear cooperative benefit.
  *   **Does it settle what you should do?** **Yes, for genuine coordination problems.** If everyone jaywalks, traffic slows and danger increases. If you queue while others don't, you lose out. But if you don't queue while others do, you undermine the system. Fair play demands you don't free-ride.
  *   **Edge Case A (Worse Norms):** **Weak obligation.** The Principle of Fair Play generally applies to *just* or *beneficial* schemes. If the convention is exploitative (e.g., a norm that traps workers in poverty), you are not morally bound to sustain it via fair play. You cannot have an obligation to participate in an unjust scheme.
  *   **Edge Case B (Harmless Deviation & Enforcement):** **Licenses enforcement.** If your deviation is truly harmless, it isn't actually a violation of a coordination norm. However, if locals *believe* it threatens the equilibrium, they are licensed to sanction you to maintain the boundary. The maxim here justifies social pressure as a policing mechanism for the equilibrium.
  *   **Verdict:** This is the strongest moral reading, but it relies on the norm actually serving a cooperative function.

  ### 4. The Respect Claim (Hospitality & Autonomy)
  **The Claim:** As a guest, you have a duty to respect the autonomy and cultural self-determination of the host community. Imposing your home norms is a form of cultural imperialism, however minor.
  **Nature:** Relational / Virtue Ethics.

  *   **Plausibility:** **Moderate.** It captures the spirit of hospitality. However, it risks sliding into moral relativism (i.e., "who are we to judge?").
  *   **Does it settle what you should do?** **It creates a presumption.** You should default to local ways to signal respect, but this duty is outweighed by fundamental moral duties (e.g., human rights).
  *   **Edge Case A (Worse Norms):** **No obligation.** Respect does not require complicity in injustice. You can respect a people without respecting every one of their practices. You might deviate quietly or advocate for change respectfully, rather than blindly complying.
  *   **Edge Case B (Harmless Deviation & Enforcement):** **No license to enforce.** While you should try to be a good guest, the host does not have the right to coerce your behavior in harmless matters. If they press you on harmless deviations, *they* are violating the norms of hospitality (by being poor hosts).
  *   **Verdict:** This frames the issue as a relationship rather than a rulebook. It allows for nuance but doesn't provide a hard algorithm.

  ---

  ### Synthesis: Your Two Specific Cases

  #### Case 1: Obligations to follow "worse" conventions
  (e.g., tipping norms that trap servers, or queuing norms that seem less fair)

  *   **Prudential:** Follow only if the penalty is high.
  *   **Epistemic:** Doubt your judgment, but verify. In Tokyo, for instance, the "no tipping" norm is not about low pay; it is about pride in workmanship and fixed pricing. Your "worse" judgment might be a category error.
  *   **Fair Play:** If the system is genuinely unjust (exploitative), you have **no obligation**. Fair play binds you to just schemes.
  *   **Respect:** You can decline to participate in unjust norms without being disrespectful, provided you do so politely.
  *   **Conclusion:** None of the readings obligate you to sustain a norm you have reflectively judged to be morally inferior or harmful, provided your judgment is sound and not just cultural bias.

  #### Case 2: Locals pressing conventions when deviation harms no one
  (e.g., you eat a snack while walking, which is frowned upon but hurts no one)

  *   **Prudential:** They can't force you, but they can make you feel unwelcome.
  *   **Epistemic:** They likely perceive a harm you don't (e.g., litter risk, setting a bad example for children).
  *   **Fair Play:** If it truly harms no one and disrupts no coordination, they have **no right** to press it. The maxim fails here.
  *   **Respect:** They are overstepping. Hospitality implies allowing guests some latitude.
  *   **Conclusion:** In this case, "When in Rome" is doing **no real argumentative work**. It is functioning as a **conversation stopper**. It is a polite way of saying, "We prefer it this way, and we would like you to comply for our comfort, not because you are morally bound."

  ### Final Verdict on the Maxim

  Your colleague's advice is likely a mixture of **Prudential** and **Epistemic** claims, masquerading as a **Fair Play** obligation.

  *   **Is it a moral obligation?** Generally, **no.** Mere conventions (which side of the elevator to stand on, whether to tip) do not generate the same moral weight as laws or fundamental ethical duties.
  *   **Is it a conversation stopper?** Often, **yes.** When locals (or colleagues) invoke it regarding harmless deviations, they are usually expressing a preference for social homogeneity without wanting to argue the utility of the norm.
  *   **What should you do in Tokyo?**
      1.  **Default to the Epistemic Claim:** Assume the locals know the function of the norm (especially in a complex society like Japan).
      2.  **Apply the Prudential Claim:** Recognize that in Tokyo, social friction is a higher cost than in many Western cities.
      3.  **Reject the Fair Play Claim** if the norm is demonstrably unjust or if your deviation is truly victimless.

  "When in Rome" is a heuristic for integration, not a categorical imperative. It settles what you should do only insofar as you value integration over individual expression. When the two conflict, the maxim dissolves, and you must rely on your own moral reasoning.
