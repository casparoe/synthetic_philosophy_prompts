      *   *Interpretation 2: The Epistemic Claim.*
          *   Claim: Locals understand the *function* of the norm better than you. Your judgment is likely flawed due to lack of context.
          *   Plausibility: Moderate/High. (Hayekian local knowledge).
          *   Settles action? Presumptively yes, but defeasible.
