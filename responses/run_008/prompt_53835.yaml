answer: |-
  This is the correct place to start. Most debates about species concepts fail because the combatants are optimizing for different variables without admitting it. If you want to write a thesis on the "Species Problem," your strongest move is not to propose a new concept, but to demonstrate that the specification sheet for a "Universal Species Concept" contains contradictory constraints.

  Below is the technical specification for an adequate species concept, categorized by the type of constraint. I have marked each as **Non-Negotiable (NN)** (requirements for the concept to function scientifically/logically) or **Contested/Preference (C)** (requirements that privilege one metaphysical or disciplinary view over another).

  ### I. Empirical Adequacy (The "Hard Cases")
  *The concept must correctly categorize these evolutionary scenarios without ad-hoc exceptions.*

  1.  **The Sympatric Isolation Constraint (NN)**
      *   **Case:** Two populations live in the same place, look different, and do not exchange genes (complete reproductive isolation).
      *   **Requirement:** The concept *must* classify these as distinct species.
      *   **Rationale:** Any concept that merges fully isolated sympatric lineages contradicts the fundamental observation of discrete biodiversity. This is the hardest empirical floor.
  2.  **The Ring Species Continuity (C)**
      *   **Case:** Population A breeds with B, B with C, C with D, but A and D are reproductively isolated (e.g., *Larus* gulls, *Ensatina* salamanders).
      *   **Requirement:** The concept must explain how A and D can be distinct species despite a genetic continuum connecting them.
      *   **Rationale:** Tests the concept's handling of spatial continuity vs. discrete boundaries.
  3.  **The Asexual Lineage Constraint (C)**
      *   **Case:** Bdelloid rotifers, many plants, most prokaryotes. No meiosis, no interbreeding.
      *   **Requirement:** The concept must either define species for these groups or explicitly exclude them from the domain of "species."
      *   **Rationale:** *Is this fair?* Excluding asexuals is a preference for a sexually-centric ontology. Including them is a preference for universality. Microbiologists demand inclusion; many evolutionary biologists argue "species" is a category error for clonal organisms.
  4.  **The Hybridization/Introgression Constraint (C)**
      *   **Case:** "Good" species that exchange genes occasionally (e.g., wolves/coyotes, many oaks) but maintain phenotypic and ecological distinctness.
      *   **Requirement:** The concept must allow for porous boundaries without collapsing the taxa into one.
      *   **Rationale:** Strict isolation criteria fail here; the concept must distinguish "noise" (introgression) from "signal" (lineage fusion).
  5.  **The Chronospecies Constraint (C)**
      *   **Case:** An unbroken fossil lineage changing gradually over 5 million years.
      *   **Requirement:** The concept must provide a non-arbitrary rule for slicing this continuum into Species A, B, and C.
      *   **Rationale:** Tests the concept's handling of time. Most concepts fail here, admitting that paleospecies are arbitrary convenience units.
  6.  **The Horizontal Gene Transfer (HGT) Constraint (C)**
      *   **Case:** Prokaryotes where phylogeny is a network, not a tree.
      *   **Requirement:** The concept must define units where vertical inheritance is not the primary cohesive force.
      *   **Rationale:** If species are defined by common ancestry (monophyly), HGT makes the concept incoherent for bacteria.

  ### II. Operational Adequacy (The "Working Biologist" Constraints)
  *The concept must be usable by humans with limited data.*

  7.  **The Finite Data Constraint (NN)**
      *   **Case:** A taxonomist has 5 specimens and mitochondrial DNA, but no behavioral or breeding data.
      *   **Requirement:** The concept must allow for provisional classification without requiring perfect knowledge of the lineage's history.
      *   **Rationale:** If a concept requires total knowledge to apply, it is metaphysically sound but scientifically useless.
  8.  **The Non-Teleological Constraint (NN)**
      *   **Case:** A nascent lineage is currently distinct but might go extinct or fuse with another in 1,000 years.
      *   **Requirement:** Species status cannot depend on the lineage's *future* evolutionary trajectory.
      *   **Rationale:** We cannot know the future. A concept that requires a lineage to "prove" its long-term independence (e.g., Evolutionary Species Concept) is unverifiable in the present.
  9.  **The Conservation/Legal Constraint (NN)**
      *   **Case:** The Endangered Species Act needs to list "units" for protection.
      *   **Requirement:** The concept must yield countable, discrete units (binaries: is it a species or not?).
      *   **Rationale:** Law and policy cannot manage continua. If the concept yields fuzzy sets, it fails practical governance.

  ### III. Ontological Adequacy (The "Metaphysical" Constraints)
  *The concept must respect the nature of biological reality.*

  10. **The Individuality vs. Kindness Neutrality (C)**
      *   **Case:** Are species historical particulars (individuals like "Ghislaine") or natural kinds (classes like "Gold")?
      *   **Requirement:** The concept should ideally be compatible with both views, or explicitly argue for one without begging the question.
      *   **Rationale:** The "Species as Individuals" thesis (Ghiselin/Hull) is dominant in philosophy but often ignored in practice. A robust concept shouldn't collapse if species are particulars.
  11. **The Hierarchy Constraint (NN)**
      *   **Case:** A diagnosable local population vs. a full species.
      *   **Requirement:** The concept must distinguish between *intraspecific variation* and *specific difference*.
      *   **Rationale:** If every diagnosable population is a species (extreme Phylogenetic Species Concept), the category loses explanatory power.
  12. **The Mind-Independence Constraint (C)**
      *   **Case:** Do species exist if no one is there to name them?
      *   **Requirement:** Species boundaries should not depend on the taxonomist's choice of character weights.
      *   **Rationale:** Realists demand this; Instrumentalists argue all classification is human-imposed structure on continuous nature.

  ---

  ### The Incompatibility Proof (Your Thesis Core)

  You suspected that a subset of these desiderata is jointly unsatisfiable. You are correct. This is the "Species Problem" in formal terms. You cannot satisfy the following three constraints simultaneously:

  1.  **Universality:** The concept applies to all life (sexual, asexual, prokaryotic, eukaryotic).
  2.  **Objectivity:** Species boundaries are mind-independent, non-arbitrary facts of nature (Realism).
  3.  **Continuity:** Evolution is a continuous process in space and time (no saltation).

  **The Trilemma:**
  *   If you accept **Universality** and **Continuity**, you must abandon **Objectivity**. (Because if evolution is continuous everywhere, drawing a line is always arbitrary. This leads to *Pragmatic Pluralism*: we draw lines where useful, admitting they aren't "real" boundaries).
  *   If you accept **Objectivity** and **Continuity**, you must abandon **Universality**. (Because the only way to get non-arbitrary boundaries in a continuous world is to restrict the concept to specific processes, e.g., sexual reproduction. This saves the Biological Species Concept but excludes bacteria and asexuals).
  *   If you accept **Universality** and **Objectivity**, you must abandon **Continuity**. (You must argue that speciation is always saltational/discontinuous. This is empirically false for most macro-organisms).

  **Conclusion for your paper:** The search for a "Winning" concept is a category error. The desiderata list proves that a *Universal, Realist, Operational* species concept is logically impossible. The "winner" is necessarily a **Pluralism** that admits different concepts for different domains of life, or an **Eliminativism** that treats "species" as a useful fiction rather than a natural unit.

  ---

  ### Gesture at Existing Concepts (Against the Spec)

  *   **Biological Species Concept (BSC):**
      *   *Passes:* Sympatric Isolation (NN), Non-Teleological (mostly).
      *   *Fails:* Asexuals (C), Chronospecies (C), Hybridizing populations (C), Finite Data (NN) (hard to test interbreeding in fossils/field).
      *   *Verdict:* High Objectivity for sexual animals, fails Universality.
  *   **Phylogenetic Species Concept (PSC):**
      *   *Passes:* Asexuals (C), Finite Data (NN) (uses diagnosability), Universality (C).
      *   *Fails:* Hierarchy Constraint (NN) (tends to inflate species counts to populations), Non-Teleological (NN) (monophyly can take time to develop), Hybridization (C) (networks break trees).
      *   *Verdict:* High Universality and Usability, fails Objectivity (boundaries depend on character choice) and Hierarchy.

  ---

  ### Settled vs. Contested (For your Introduction/Discussion)

  Do not write this paper assuming the field is waiting for a savior concept. The sociology of the field is as important as the biology.

  **What is Genuinely Settled:**
  1.  **Linnaean Utility:** Everyone agrees we need a naming system for communication, conservation, and law, regardless of metaphysical status.
  2.  **Evolutionary Reality:** Everyone agrees lineages evolve and diverge. The *process* is real, even if the *categorization* is debated.
  3.  **The Failure of Monism:** There is broad consensus (explicit or implicit) that no single definition works for bacteria, orchids, and mammals equally well. Most working biologists are "conceptual pluralists" even if they don't advertise it.

  **What is Still Contested:**
  1.  **Ontological Status:** Are species discovered (Realism) or constructed (Instrumentalism)? This is still a live fight between philosophers and some systematists.
  2.  **The Rank of "Species":** Is "species" a fundamental unit of nature (like atoms) or just a convenient rank in a hierarchy of divergence (like "large" vs "small")?
  3.  **The Asexual Boundary:** Whether prokaryotes *have* species is still debated. Some argue we should stop using the word for bacteria entirely; others argue for ecotypes.
  4.  **Gene Flow vs. Monophyly:** When genetic data conflicts with morphological/reproductive data, which trumps? (e.g., cryptic species that look identical but don't breed vs. polymorphic species that look different but do).

  **Strategic Advice:**
  Your thesis should not be "Concept X is best." It should be "The desiderata for Concept X reveal that the demand for a Universal Species Concept is the error." Use the incompatibility proof above as your central argument. The "Winning" move is to change the game from *definition* to *operational criteria based on domain*.
