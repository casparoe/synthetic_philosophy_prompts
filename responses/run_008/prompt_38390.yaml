      *   Example: "Who do you call at 1 a.m.?" -> Saint might lecture you on making better choices. Wit/Tide-pool person just listens.
      *   Example: "Trivia Team" -> Saint knows ethics, Wit knows pop culture.
      *   Example: "Haircut" -> Saint tells truth painfully. Wit tells truth kindly.

  6.  **Drafting the Debrief Questions:**
      *   Start with the numbers.
      *   Move to the feeling of voting.
      *   Move to the definition of "Good Person."
      *   End with the "Demandingness Objection."

  7.  **Review against Constraints:**
      *   75 minutes? Yes, if timed strictly.
      *   16 students? Yes, 4 teams of 4.
      *   No money? Yes, points only.
      *   Tone? Serious but not solemn.

  8.  **Final Polish:**
