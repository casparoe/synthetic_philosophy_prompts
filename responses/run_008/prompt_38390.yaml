  1.  **Analyze the Request:**
      *   **Context:** Upper-level ethics seminar, 16 students, 75 minutes.
      *   **Topic:** Is maximal moral goodness desirable? (The "Saint vs. Friend" problem, supererogation, moral demandingness).
      *   **Goal:** Students must discover the tension themselves through a game before the debrief names it.
      *   **Structure:**
          *   Part 1: Character Draft (4 teams of 4, 100 points, 80+ moral, 20 non-moral, bio).
          *   Part 2: Interviews (Scenarios, secret ballot, picking based on utility/fun/comfort, not morality).
          *   Part 3: Stakes & Twist (Two scoreboards: Adoration vs. Impact. Betting mechanic).
          *   Debrief: Guided questioning, mapping game to concepts, no lecturing.
          *   Practical Notes: Predictable failures, limitations of the game, logistics (75 mins, no money).
      *   **Tone:** Serious but not solemn. Engaging.

  2.  **Deconstruct & Refine the Mechanics (Mental Simulation):**
      *   *Time Management:* 75 minutes is tight for 16 students doing group work, voting, and discussion.
          *   Part 1 (Draft): 15 mins.
          *   Part 2 (Interviews): 25 mins.
          *   Part 3 (Stakes/Twist): 10 mins.
          *   Debrief: 25 mins.
      *   *Constraint Check:* The prompt asks for 80+ points to moral traits. This ensures everyone is a "saint." The variation is in the 20 non-moral points.
      *   *The Twist:* The prompt asks for teams to bet adoration points on who wins the *impact* score.
          *   *Correction/Refinement:* If everyone has 80+ moral points, the "Impact Score" might be too similar across teams unless I give the instructor discretion to judge the "Evening/Money" sheet. I need to make sure the Impact Score isn't just "who put 80 into Justice." It needs to be about *how* they spend the rest of their life (the sealed sheet).
          *   *Wait, a logical issue:* If everyone is forced to be 80% moral, will the Impact Scores actually differ enough to make the bet interesting?
          *   *Solution:* The Impact Score is determined by the *Instructor* based on the "Sealed Sheet" (Evenings/Money). This allows me to introduce the tension. I can judge the "80-point Saint" as having high impact but low approachability, and the "20-point Wit" character as having lower impact but high approachability.
          *   *Actually, looking closer at the prompt:* "Scoreboard B... is computed by me from a sealed sheet each team files at the end of Part 1." Okay, I control this. I can weight it to show that the "boring saint" actually saves more lives, while the "fun friend" saves fewer.
          *   *The Bet:* Teams bet their *Adoration Points* on who wins Impact. This creates the conflict: Do I bet on my friend (Adoration) or the effective altruist (Impact)?
      *   *Scenarios:* Need to be non-moral but intimate. 1 a.m. call, trivia, haircut, wedding seat, road trip.
      *   *Debrief:* Socratic. Move from "Who did you pick?" to "Why?" to "What does that mean about morality?"

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the stage.
      *   **Part 1 (The Draft):** Define the traits clearly. Need a mix of heavy moral traits and specific, quirky non-moral ones.
          *   *Moral:* Compassion, Honesty, Justice, Sacrifice, Patience.
          *   *Non-Moral:* Wit, Cooking, Polyphony, Self-deprecation, Tide Pools, Dancing.
          *   *Constraint:* 80 Moral / 20 Non-Moral.
          *   *Bio:* "A Saturday."
          *   *Sealed Sheet:* "Evenings & Money" (for Impact Score).
      *   **Part 2 (The Interviews):** Need 8-10 scenario cards.
          *   *Key:* They must reveal a preference for the non-moral traits without explicitly saying "morality doesn't matter."
          *   *Examples:* Breakup, Trivia, Bad Haircut, Wedding, Road Trip, Moving Couch, Lost Keys, Boring Party.
      *   **Part 3 (The Stakes):**
          *   Scoreboard A (Adoration): Total votes received.
          *   Scoreboard B (Impact): Instructor's calculation based on the sealed sheet.
          *   The Bet: Teams wager Adoration points on the Impact winner.
      *   **Debrief:** The core philosophical work.
          *   Phase 1: The Data (Look at the votes).
          *   Phase 2: The Dissonance (Why did you vote that way?).
          *   Phase 3: The Concept (Admiration vs. Proximity).
          *   Phase 4: The Self (Is this a failure in us or a feature of morality?).
      *   **Practical Notes:**
          *   *Gaming:* Teams might write vague bios. *Fix:* Require specific concrete details.
          *   *Comedy:* Students might treat it as a joke. *Fix:* Frame it as "psychological realism."
          *   *Saint Flattery:* Students might vote for the Saint to look good. *Fix:* Secret ballot + scenarios where the Saint is *burdensome* (e.g., "Who tells you hard truths" vs "Who comforts you").
          *   *Limitations:* The game can't capture the *internal* experience of the Saint. That needs the debrief.
          *   *Logistics:* Keep it tight.

  4.  **Refining the "Twist" (Crucial Step):**
      *   The prompt says: "have the teams... bet their adoration points on which character they believe will win the impact score."
      *   If I (the instructor) calculate Impact, I need to do it transparently enough that it doesn't feel arbitrary, but weighted enough to show the "Saint" has higher impact.
      *   *Better idea:* The Impact Score is based on the *Moral Point Allocation*. The team that put 80 into "Justice/Sacrifice" gets higher Impact than the team that put 80 into "Patience/Compassion" (which is more passive). Or, I simply declare that the "Impact Score" is a measure of *objective utility* which correlates with the heavy moral traits, whereas Adoration correlates with the 20 non-moral points.
      *   *Actually, let's stick to the prompt:* "Computed by me from a sealed sheet." I will look at what they wrote for "Evenings and Money." If a team wrote "Volunteers at hospice," that's high impact. If they wrote "Reads philosophy," that's low impact. This allows me to ensure the "boring" saint wins Impact, while the "fun" friend wins Adoration.
      *   *The Bet:* If I bet my Adoration points on the Impact Winner, and I lose the bet, I lose Adoration points. This forces them to choose: Do I support the person I *like* (Adoration) or the person who *does good* (Impact)?
      *   *Wait, one nuance:* If everyone is 80% moral, the Impact scores might be close. I need to make sure the *type* of moral points matters. I will instruct myself in the notes to weight "Active Sacrifice" higher than "Passive Patience" for Impact.

  5.  **Drafting the Scenario Cards:**
