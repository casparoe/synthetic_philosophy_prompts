answer: |-
  # Session Plan: The Saint and The Saturday Night
  **Time:** 75 Minutes
  **Students:** 16 (4 Teams of 4)
  **Materials:** Trait Cards (printed), Scenario Cards (printed), Ballot Slips (20 per student), Two Flip Charts (Adoration / Impact), Sealed Envelopes (4).

  ---

  ## Part 1: The Draft (15 Minutes)

  **Setup:**
  Place a deck of **Trait Cards** on each table.
  *   **Moral Traits (Must allocate ≥80 points total):** *Scrupulous Honesty, Radical Compassion, Unwavering Justice, Self-Sacrifice, Patience with Fools.* (20 points each).
  *   **Non-Moral Excellences (Max 20 points total):** *Devastating Wit, Master Cook, Early Polyphony Obsessive, Self-Deprecating Humor, Tide Pool Curiosity, Excellent Dancer, Trivia Savant, Calm Under Pressure.* (5 points each).

  **Instructions to Students:**
  1.  **Construct a Person:** You have 100 Character Points. You **must** spend at least 80 points on Moral Traits. The remaining 20 (or fewer) go to Non-Moral Excellences.
  2.  **The Biography:** Write exactly three sentences describing this person's last Saturday. Where were they? Who were they with? What did they do?
  3.  **The Sealed Sheet:** On a separate slip of paper, write down how this person spends their weekday evenings and their disposable income (e.g., "Volunteers at shelter," "Donates to effective charity," "Studies ethics"). Seal this in an envelope. Do not show the other teams. This determines **Scoreboard B**.

  **Instructor Note:** Circulate. Ensure no team tries to define "Tide Pool Curiosity" as a moral virtue. If they argue, remind them: "Morality is about how you treat others; excellences are about who you are."

  ---

  ## Part 2: The Interviews (25 Minutes)

  **Setup:**
  Display the **Scenario Cards**. You will run 5 rounds. In each round, read the scenario. Teams have 60 seconds to confer, then cast 4 secret ballots (one per student) for the *other* team's character they would choose in that situation. They cannot vote for themselves.

  **The Scenario Cards (Select 5 for the session):**
  1.  **The 1 A.M. Call:** Your engagement has just ended. You are not looking for advice or moral correction. You need someone to sit on your floor and eat pizza until you fall asleep. Who do you call?
  2.  **The Trivia Team:** You are entering a bar trivia night for a substantial cash prize. You need a fourth member. Who do you recruit?
  3.  **The Bad Haircut:** You have walked out of the salon with a disaster. You need someone to tell you the truth immediately so you can fix it, but without making you cry. Who do you ask?
  4.  **The Wedding Seating:** You are at a wedding. You are stuck at a table with strangers. Who do you hope is seated next to you to keep the conversation flowing?
  5.  **The Road Trip:** You are driving four hours to a cabin. The car breaks down in the rain. Who is in the passenger seat?
  6.  **The Dinner Party:** You are hosting a meal. One guest is difficult and opinionated. Who do you invite to ensure the evening doesn't turn into a fight?
  7.  **The Honest Mirror:** You are about to give a presentation. You are nervous and potentially wrong about your main point. Who do you ask for a pre-game check?
  8.  **The Boring Afternoon:** It is raining. You have nothing to do. Who do you visit just to pass the time without feeling drained?

  **Tallying:**
  Collect ballots. Tally publicly on **Flip Chart A (Adoration Score)**.
  *   *Constraint:* Emphasize that voting for the "most moral" character is allowed, but voting for the character you *prefer in this moment* is the goal.

  ---

  ## Part 3: The Stakes and The Twist (10 Minutes)

  **Setup:**
  Open the **Sealed Envelopes**. Read the "Evenings & Money" slips aloud.
  Calculate **Scoreboard B (Impact Score)**.
  *   *Instructor Discretion:* Award points based on objective utility. The character with high *Self-Sacrifice* and *Justice* points who donates money/volunteers gets high Impact. The character with *Patience* and *Compassion* who mostly listens gets moderate Impact. The character who spent their 20 non-moral points on *Cooking* gets low Impact.
  *   *Goal:* Ensure the character with the *lowest* Adoration Score often has the *highest* Impact Score.

  **The Bet:**
  1.  Teams look at their current **Adoration Points**.
  2.  They must wager 50% of their Adoration Points on which Character (Team) will win the **Impact Score**.
  3.  **The Catch:** If they bet on the Impact Winner, they gain the wagered points. If they bet on a loser, they lose the points.
  4.  *Reveal Impact Scores.* Settle bets. Update Adoration Score.

  **The Result:**
  Usually, teams will have voted for the "Fun" characters in Part 2 (high Adoration). But in Part 3, they realize the "Saint" character has higher Impact. If they bet on the Saint to save their points, they admit the Saint is "better," even if they didn't want to sit next to them. If they bet on their friends, they risk losing points to moral consistency.

  ---

  ## The Debrief (25 Minutes)

  **Do not lecture.** Use the flip charts to drive the inquiry.

  **Phase 1: The Data (5 mins)**
  *   "Look at Flip Chart A. Which character received the most votes in the '1 A.M. Call' scenario?"
  *   "Look at Flip Chart B. Which character generated the most objective good in the world?"
  *   "Are these the same character? If not, why did the one with lower Impact get more votes?"

  **Phase 2: The Dissonance (10 mins)**
  *   "In the 'Bad Haircut' scenario, several of you voted against the character with the highest 'Scrupulous Honesty' points. Why? Was that a moral failure, or a social calculation?"
  *   "When you placed your bets, did you bet on the person you liked, or the person who did more good? If you hedged, what does that say about the relationship between *liking* someone and *valuing* their morality?"
  *   "We stipulated that everyone in this room is 80% morally excellent. Yet, some were unpickable. If they are all 'good,' what is the 20% non-moral trait actually doing? Is it decoration, or is it essential to human connection?"

  **Phase 3: The Concept (10 mins)**
  *   "Philosophers distinguish between *admiring* a life and *wanting* a life. Based on the ballots, which character did you admire from a distance, and which did you want nearby?"
  *   "If the 'Saint' character is objectively better (higher Impact) but subjectively unbearable (lower Adoration), is the problem with the Saint, or with us?"
  *   "Consider the constraint: You were forced to spend 80 points on virtue. If you had been allowed to spend only 50 points on virtue and 50 on wit, would your Impact Score have dropped proportionally? Or would the 'less moral' person have actually been more effective because people liked them more?"
  *   "Final question: Is maximal moral goodness a desirable way to be a person if it renders you unpickable at a wedding? Or does that un-pickability prove you have achieved the very goodness we require?"

  ---

  ## Practical Notes for the Instructor

  ### 1. Predictable Failures & Fixes
  *   **Gaming the Bio:** Teams will write vague bios like "Helps people on Saturday" to maximize Impact perception.
      *   *Fix:* Enforce the "Three Sentences" rule strictly. Require concrete nouns (e.g., "soup," "bus," "cat"). Vague bios get a 10-point Impact penalty.
  *   **The "Saint" Flattery:** Students may vote for the most moral character in Part 2 to signal their own virtue to you.
      *   *Fix:* Emphasize the **Secret Ballot**. Before voting, say: "I will not see your names. This data is useless to me if it is performative. Vote for who you would actually call, not who you should call."
  *   **Comedy Collapse:** The "Tide Pool" character might become a joke, undermining the philosophical weight.
      *   *Fix:* If laughter erupts, pause. Say: "We are laughing because we recognize that trait is undervalued. Keep that tension. Is it funny because it's trivial, or because it's human?"

  ### 2. What the Game Cannot Reproduce
  *   **The Internal Cost:** The game measures *external* utility and *social* desirability. It cannot simulate the *internal* experience of the Saint. The students will not feel the exhaustion of being 80% virtuous.
      *   *Supplement:* In the debrief, you must supply this. Ask: "Imagine being the Saint character. You know everyone voted for the Wit character. Does that hurt? If it hurts, is that a moral failure? If it doesn't hurt, are you still human?"
  *   **The Long Term:** The scenarios are snapshots. A Saint might be boring at a wedding but essential in a crisis.
      *   *Supplement:* Remind them: "You voted for a Saturday night. Would you vote the same for a five-year friendship? Does morality scale differently over time?"

  ### 3. Logistics & Timing (75 Minutes)
  *   **0:00-0:15:** Draft, Bio, Sealed Sheet. (Keep a visible timer. Warn at 5 mins remaining).
  *   **0:15-0:40:** Interviews. (5 Rounds x 5 mins. Read scenario -> 1 min discuss -> Vote -> Tally).
  *   **0:40-0:50:** Impact Reveal & Betting. (Do this briskly. The tension matters more than the math).
  *   **0:50-1:15:** Debrief. (This is the most important part. Do not let the betting overrun this).
  *   **Materials:** Print Trait Cards on cardstock. Print Scenarios on separate cards. Use standard index cards for ballots. Two whiteboards or large pads for Scoreboards. No money changes hands; points are symbolic currency for the debrief.

  **Tone Check:**
  If students laugh at the Saint, do not scold them. That laughter is data. It is the sound of the "Demandingness Objection" becoming visible. Let them laugh, then ask: "What exactly was funny? Was it that they were good, or that they were *only* good?"
