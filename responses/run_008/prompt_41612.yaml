  **THE RATIONAL AGENT**
  **By Dr. Isoquant**

  **Dear Dr. Isoquant,**
  I feel like a fraud. I renew my gym membership every January ($600/year), but I've gone twice in four years. I tell myself I'm "investing in my health," but I know I'm wasting money. How do I stop acting against my own best interests?
  **—Sweaty Palms, Suburbia**

  **Dear Sweaty,**
  You are not acting against your interests; you are simply confusing stated preference with revealed preference. Words are cheap; credit card swipes are binding. You have revealed that you prefer having the *option* to exercise over actually exercising. Perhaps the utility comes from the identity of being a "gym member," or perhaps you are purchasing insurance against future guilt. If you truly preferred fitness to the $600, you would attend. Since you do not, you clearly value the money less than the fantasy. Stop trying to optimize a utility function that is already maximizing. Enjoy the locker room showers; clearly, that's what you're paying for.

  **Dear Dr. Isoquant,**
  I know smoking kills. I tell everyone I want to quit. But every Tuesday, I buy a pack. Am I weak-willed?
  **—Nicotine Knight, Brooklyn**

  **Dear Nicotine,**
  "Weak-willed" is a metaphysical construct, not an economic variable. You say you want to quit, but your wallet says otherwise. This is a classic intertemporal choice problem. You prefer the immediate utility of nicotine to the distant utility of longevity. Your discount rate is high, not your morality. To say you "want" to quit while purchasing cigarettes is merely cheap talk. If you preferred health to smoking, you would not buy the pack. Since you buy the pack, you prefer smoking. Accept your revealed time preference and stop complaining about the price of your own choices.

  **Dear Dr. Isoquant,**
  My daughter calls me weekly crying about her toxic job. She says she hates it. But she hasn't quit. Should I tell her to leave?
  **—Worried Dad, Ohio**

  **Dear Dad,**
  Your daughter is not suffering; she is consuming. Complaining is a costless activity that provides emotional relief (catharsis) without requiring the costly action of quitting. She has revealed that the utility of her paycheck plus the utility of venting to you exceeds the disutility of the job. If she truly preferred unemployment to her current role, she would resign. Her tears are not a signal of error; they are a consumption good. Advise her to optimize her venting schedule. Perhaps twice weekly would yield higher marginal utility.

  **Dear Dr. Isoquant,**
  This column is a tautology. If choice defines preference, and preference explains choice, you've said nothing. It's operationalism gone rogue. You're defining happiness by what people do, then saying they did it because it made them happy. This isn't science; it's circular reasoning dressed in math.
  **—Prof. Nudge, Behavioral Econ Dept.**

  **Dear Prof. Nudge,**
  Your distress is noted, though your preference for metaphysical definitions of "happiness" is irrelevant to market behavior. You worry about circularity; I see operational clarity. In physics, length is defined by the ruler, not the essence of space. In economics, utility is defined by the choice, not the essence of joy. If we cannot observe it, it is not data. You seek to measure the ghost in the machine; I measure the machine. If the theory says people do what they do because they prefer what they choose, you may call it circular. I call it consistent. You are welcome to continue surveying people about what they *would* do. I will remain here, watching what they *actually* do.
  **—Dr. Isoquant**
