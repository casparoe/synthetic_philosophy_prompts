answer: |-
  # Q&A Preparation Sheet: Against Diachronic Reflection

  **Thesis Core:** Van Fraassen's Reflection is not a diachronic rationality constraint. It is a synchronic deference principle conditional on judged epistemic competence. The future self is an external expert source, not a temporal extension of current authority.

  **Strategy:** You are shifting the burden. You are not arguing that we *never* defer to our future selves; you are arguing that we do so for the *same reasons* we defer to experts. The "diachronic" element is a red herring; the normative work is done by the "competence" condition.

  ---

  ### 1. The Counterexamples (The Grad Students / Formal Epistemologists)
  **The Objection:** "You claim your 'competence condition' handles the standard counterexamples (the drug case, the forgetting case, the wishful thinking case). But this looks like a trivial relabeling. In the drug case, I know my future self will be certain of a falsehood. You say I shouldn't defer because I judge my future self 'incompetent.' But how do I judge that *now* without already assuming my current credences are the benchmark? If 'competence' just means 'agrees with me now,' your principle is dogmatic. If it means something else, what metric are you using that doesn't presuppose the very Reflection principle you're rejecting?"

  **Your Committed Reply:**
  "Competence is not defined as 'agreement with current self.' It is defined as 'reliability of the cognitive process leading to the future credence.' In the drug case, I have independent empirical evidence (the pharmacology) that the process producing the future credence is truth-conducive *zero percent of the time*. I am not using my current credence as the metric; I am using my current theory of mind and chemistry. Reflection fails because it demands deference even when the *process* is known to be broken. My principle survives because it treats the future self like a weatherman: if I know the barometer is broken, I don't defer to its reading, even if the barometer is 'mine'."

  **Why this reply:** You must avoid the trap of defining competence as "matches current belief." That makes your view circular. Anchoring competence in *process reliability* (externalism) allows you to explain why you don't defer to the drugged self without making current belief the sole arbiter of truth.

  ### 2. The Moorean Absurdity (General Audience)
  **The Objection:** "If I accept your view, it seems I can rationally hold: 'A is true, but I will not believe A tomorrow.' This is Moorean absurdity. If I believe A now, and I know I will stop believing A tomorrow, aren't I implying that I will become irrational? And if I know I will become irrational, shouldn't that affect my confidence now? Your view seems to allow a fragmentation of the self that makes assertion impossible."

  **Your Committed Reply:**
  "I concede the pragmatic awkwardness, but deny the logical contradiction. The absurdity arises only if we assume rationality requires diachronic stability. I am arguing it does not. If I have decisive evidence for A now, and I know I will suffer memory loss tomorrow, 'A is true but I won't believe it tomorrow' is simply a tragic fact about my cognitive trajectory, not a contradiction in my current doxastic state. Rationality is about responding to *current* evidence. If current evidence says 'A' and 'I will forget A,' I should believe both. The tension is in the world, not in my logic."

  **Why this reply:** Conceding the "tragic fact" status disarms the charge of irrationality. You are arguing for a "time-slice" epistemology. If you try to deny the absurdity feels absurd, you lose the room. Own the fragmentation.

  ### 3. The Dutch Book Argument (The Formal Epistemologists)
  **The Objection:** "Van Fraassen's Dutch Book argument shows that if you violate Reflection, a bookie can construct a series of bets guaranteed to lose you money. You haven't addressed the book. If your view licenses violating Reflection, you are licensing sure-loss behavior. Unless you can show where the Dutch Book argument fails—specifically, why the bookie cannot force the diachronic contract—your view implies rational agents can be pumped for cash."

  **Your Committed Reply:**
  "The Dutch Book argument fails because it assumes the agent is *committed* to updating by conditionalization on their future credences. The bookie can only construct the book if the agent agrees *now* to accept bets later based on future credences. On my view, the agent makes no such commitment. The agent treats their future self as a separate source. When the future time comes, the future self is under no obligation to accept the bet laid out by the past self, because the 'past self' is just another informant whose authority has expired. The sure-loss only materializes if you assume diachronic agency is binding. I deny that it is."

  **Why this reply:** **WARNING:** This is your **weakest point**. Formal epistemologists hate "I can just refuse the bet" replies because it looks like evading the normative force of coherence. However, it is the *only* reply consistent with your thesis that the future self is an "external source." If you concede the Dutch Book works, you concede Reflection is a requirement of rationality. You must bite the bullet: Rationality does not protect you from diachronic exploitation if you treat your future self as a fallible third party.

  ### 4. The Statistician's Charge (The Bayesian Statistician)
  **The Objection:** "Let's strip the philosophy. You're talking about conditional expectations. The Tower Property (Law of Iterated Expectations) says $E[E[X|F_{t+1}] | F_t] = X$. If your 'competence condition' holds, you're just stating the martingale property of rational belief. If it doesn't hold, you're saying $E[X | \text{Competence}] = X$. But 'Competence' isn't a sigma-algebra event I can condition on in the model. So either your principle is a theorem of probability theory dressed up as philosophy, or it's empty because 'defer to those you should defer to' is a tautology."

  **Your Committed Reply:**
  "It is not the Tower Property because the future credence $P_{t+1}(A)$ is not a random variable measurable with respect to my current filtration in the way the theorem requires. The theorem assumes the future probability is generated by the *same* probability space updating on new information. I am arguing that the future self might be operating in a *different* probability space (e.g., due to bias, damage, or different priors). Conditioning on 'Competence' is not conditioning on an event in the sample space; it is a meta-level judgment about the validity of the generating mechanism. Therefore, the Tower Property does not apply, and the principle is normative, not definitional."

  **Why this reply:** You must distinguish between the *math* of updating and the *metaphysics* of the agent. If you concede it's just the Tower Property, your paper is trivial. You must insist that the "competence condition" breaks the mathematical assumptions required for the martingale property to hold necessarily.

  ### 5. The Kantian's Charge (The Kantian)
  **The Objection:** "You treat your future self as a weather service. This is an alienation of agency. For a Kantian, autonomy means self-legislation. If I cannot trust my future self to carry out my rational commitments, I am not a unified agent. By making deference to the future self optional, you are fragmenting the will. You are suggesting I should view my own future rationality as contingent, which undermines the very possibility of planning or promising. Is rationality just a series of unconnected time-slices?"

  **Your Committed Reply:**
  "Autonomy requires recognizing fallibility, not assuming infallibility. To treat my future self as *necessarily* authoritative is to ignore the reality of my own cognitive fragility. True self-governance involves monitoring my own capacity to govern. If I know I am prone to weakness of will or cognitive decay, ignoring that fact is not 'unity'; it is delusion. I am not fragmenting the will; I am protecting the agent's long-term interests by acknowledging that the 'future self' may be a stranger to the 'current self.' Trust must be earned, even from oneself."

  **Why this reply:** Turn the "alienation" charge on its head. Argue that *blind* trust in the future self is the real alienation (from reality). This aligns with the Kantian value of truthfulness to oneself.

  ---

  ### Strategic Concessions & The "Sinker"

  **What to Concede Up Front:**
  Concede that in *ideal* cases (no forgetting, no bias, pure evidence accumulation), your principle collapses into Reflection. You are not arguing Reflection is *false* in ideal models; you are arguing it is not a *fundamental requirement* of rationality in non-ideal, real-world contexts. This prevents them from attacking you with perfect Bayesian agent models.

  **What to Hold No Matter What:**
  Hold that **diachronic coherence is not a primitive rational requirement.** Synchronic coherence + correct response to current evidence is the only hard requirement. Do not let them bully you into admitting that "changing your mind without new evidence" is always irrational. Sometimes it's just decay, and rationality requires acknowledging decay.

  **The Weakest Link:**
  The **Dutch Book Reply (Section 3)**. The formal epistemologists will smell blood here. By saying the agent can refuse the diachronic bet, you are effectively saying rational agents can be money-pumped if they treat their future selves as strangers. They will argue that *being* a rational agent *just is* being the kind of thing that accepts those bets.
  *Defense:* If they press this, reiterate that the "money pump" assumes a conception of agency (diachronic unity) that your paper is explicitly challenging. You are offering a rival conception of agency.

  **The "Sinker" Question (Hope Nobody Asks):**
  *"If competence is judged by current standards, isn't your principle just a license for current dogmatism? If I think my future self is 'incompetent' whenever they disagree with me, haven't you just given a formal excuse to ignore future evidence?"*

  **Prepared Defense (If Asked):**
  "No, because 'competence' is tied to *process*, not *output*. I can judge my future self as competent even if I expect them to disagree, provided I expect the disagreement to stem from *new evidence* rather than *process failure*. The principle demands I defer if I believe the future self has better data and a sound processor. It only blocks deference when the process is corrupted. The distinction between 'new evidence' and 'corruption' is the work I do in the paper."

  **Final Advice:**
  The Formal Epistemologists will try to trap you in math. The Kantian will try to trap you in metaphysics. Keep your footing in the **epistemology of testimony**. Your strongest move is to relentlessly analogize the future self to a *friend*. If I know my friend is drugged, I don't defer. Why is the future self different? If they say "Because it's *you*," you win. That's your thesis.
