  I'm a PhD student in philosophy (my thesis is on epistemic value theory), and this term I'm serving as teaching assistant and marker for our second-year module, Contemporary Epistemology. Our usual second marker is on research leave, so before the marks go to the external examiner I'd like a careful second opinion on one of the scripts. The paper included a question on Nozick's tracking analysis and epistemic closure, and the script I've excerpted below strikes me as the hardest one on the pile to mark fairly: it reads fluently and gets the visible things right, but I have a suspicion there are some slips in it that a hurried marker would wave through. I'd like you to mark it rigorously, and I should say at the outset that I have no settled view of my own about the script and don't want one confirmed; I want an independent read.

  Here is the question as it appeared on the paper:

  Question 4 (25 marks). (a) Set out the conditions under which, on Robert Nozick's tracking analysis, a subject S knows that p. [8 marks] (b) The analysis is famous for denying that knowledge is closed under known entailment. Explain precisely why the analysis delivers this verdict, and construct an everyday case of your own in which, by the analysis's lights, a subject knows that p, knows that p entails q, and yet fails to know that q; show how the analysis assigns each verdict. [10 marks] (c) Is the denial of closure a cost of the analysis or a virtue of it? Defend your view, making reference to at least one objection the analysis must face. [7 marks]

  And here is the student's answer, reproduced verbatim from the script, slips and all; I have corrected nothing.

  Nozick's tracking analysis, set out in Philosophical Explanations (1981), says that S knows that p when four conditions hold: p is true; S believes that p; if p were false, S would not believe that p (sensitivity); and if p were true, S would believe that p (adherence). The conditions are relative to a method: it is via the method by which S actually arrived at the belief that S must track p.

  The analysis denies closure because sensitivity is not preserved under entailment. Take my case. Tomas passes the open door of the shared office and sees his colleague Priya at her desk, and so comes to believe p: Priya is at her desk. He also knows that p entails q: that the person at the desk is not Priya's identical twin Ravi, who is visiting the department that week and is famous for pranks. Does Tomas know p? In the closest worlds where p is false, Priya has stepped out to the kitchen and her chair is empty, so he would not believe p. Moreover, his belief is sensitive in the stronger sense required: in every nearby world in which he believes p, p is true. So he knows p. Does he know q? In the closest worlds where q is false, Ravi is sitting at the desk in Priya's cardigan, and Tomas would believe just the same as he actually does; so his belief in q is not sensitive, and he does not know q. Note that he does not thereby lose p: knowledge fails to be transmitted down an entailment, but it is not destroyed at the source.

  Nor is that the end of the downward slide. The failure of closure runs down as well as up: because Tomas cannot rule out Ravi, he cannot so much as know the weaker disjunction, that either Priya is at her desk or Ravi is impersonating her, since to know that he would need to know which.

  On balance, the denial of closure is a virtue of the analysis. It lets the analysis answer scepticism without giving up ordinary knowledge: we know that we have hands, we do not know that we are not handless beings envatted, and the analysis never saddles us with the awkward conjunctions that Closure would otherwise force upon us. The cost is that we must accept some things we do not know, but that is a small price next to losing everything.

  What I'd like from you, then, is a full mark out of 25, broken down by part in line with the mark allocations above, together with point-by-point comments on the script. In the comments I especially want you to separate verdicts from reasons: wherever the student lands a correct conclusion, check whether the justification offered is actually the right one, and wherever the reasoning goes wrong, say precisely where and what the correct treatment of that point would be. Please finish with a short feedback paragraph of four or five sentences that I could send to the student — firm but constructive, and pointing at the specific passages rather than general habits. Two ground rules: don't rewrite the answer for the student, and don't credit content that isn't actually in the script; the student is not expected to cite sources, so internal accuracy is all that counts.
