  Translations

  1. Kant's shopkeeper case translates to distinguishing policies optimized for instrumental reward versus those aligned with a terminal objective. When the shopkeeper acts honestly because profit maximization requires it, his policy is coupled to a proxy reward. This is outer alignment without inner alignment; behavior accords with morality, but causal attribution lies in spurious correlation with profit. Kant claims moral worth exists only if the policy is driven by an internal objective representing the moral law itself, independent of profit. In ML terms, this is robust inner alignment: the model generalizes to non-profitable scenarios because its weights encode the rule directly. What distorts here is the notion of "duty." ML treats internal objectives as instrumental for generalization; Kant treats them as constitutive of worth. ML has no expression for the value of the motive itself, only its predictive stability. Honesty is actually functionally identical in both cases until the true distribution shifts.

  2. The overdetermination problem resembles a conflict between explicit constraints and learned heuristics. Huck's explicit model assigns negative value to helping Jim, yet his policy outputs the helpful action. In ML, this looks like a model-free policy overriding a model-based planner, or a learned feature dominating an explicit rule within the architecture. Huck acts rightly despite his internal reward model being fundamentally misspecified. Philosophers argue this retains moral worth because the causal driver is the right feature, even if the agent's own meta-cognition explicitly rejects it. ML vocabulary struggles here: we typically just flag this as specification gaming or reward hacking because the agent violates its own stated constraints. What translates cleanly is the feature attribution; what distorts is the normative evaluation. ML sees a very clear discrepancy between code and output; philosophy sees moral credit arising from the latent feature responsiveness despite the explicit objective mismatch completely.

  3. Arpaly's view collapses the entire distinction into simple feature responsiveness. Moral worth corresponds to the degree to which a policy's gradients align with true moral features rather than simple proxies. Whether the agent articulates these features explicitly or learns them end-to-end is irrelevant. This maps cleanly to generalization capabilities: an agent responsive to true features performs well under distributional shift where proxies fail consistently. Arpaly argues that acting from sympathy has worth fully equal to acting from duty. In ML, this is practically indistinguishable from robust alignment. What distorts is the removal of the duty requirement; ML doesn't care about the label of the objective, only its correlation with ground truth. What has no expression is the strong normative claim that responsiveness deserves credit. ML evaluates performance; Arpaly evaluates the agent's relationship to the reasons themselves. The vocabulary captures the mechanism but not the merit really fully enough.

