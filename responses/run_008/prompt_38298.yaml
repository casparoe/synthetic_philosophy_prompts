answer: |-
  You have accurately diagnosed the current state of play. The feeling of "frozenness" you describe is a feature, not a bug, of the contemporary debate. Many meta-metaphysicians (Ted Sider, Eli Hirsch, Amie Thomasson) have spent the last two decades trying to determine exactly *why* the debate feels intractable.

  Here is a breakdown of your hypothesis, the substantive residues, the prospects for progress, and the status of Gödel.

  ### 1. Is it merely a verbal dispute?
  Your hypothesis—that this is largely a confusion over the quantifier "exists"—is the **Quantifier Variance** thesis (championed by Eli Hirsch). It suggests the Eternalist uses a tenseless quantifier ($\exists_t$) and the Presentist uses a tensed one ($\exists_{now}$). If they simply agreed on the semantics, they would agree on the world.

  **The Verdict:** It is *partly* verbal, but not *mostly*. If it were purely verbal, we could translate one view into the other without loss of explanatory power. We cannot. There are substantive disagreements hiding under the semantics:

  *   **Truthmaking and Grounding:** This is the hard core of the disagreement.
      *   **Eternalism:** The truth "There were dinosaurs" is made true by the existence of dinosaurs (located at past spacetime coordinates). The truthmaker is *ontologically robust*.
      *   **Presentism:** The truth "There were dinosaurs" must be made true by *present* entities. Presentists posit "Lucretian properties" (the world currently has the property *having-contained-dinosaurs*) or ersatz abstract times.
      *   **The Clash:** This isn't just vocabulary. It is a disagreement about the **structure of dependence**. Eternalists accuse Presentists of "cheating" by positing magical present properties that point to nothing real. Presentists accuse Eternalists of bloating ontology with useless ghosts. This is a substantive dispute about parsimony and grounding, not just the word "exists."
  *   **Phenomenology (Prior's Argument):** As you noted, Prior's argument about relief is substantive. When I am relieved that a root canal is *over*, I am not relieved that the pain is at a earlier coordinate than my current one. I am relieved that the pain *no longer exists*.
      *   **Eternalism:** Must treat this feeling as an illusion or a perspective effect (the "Moving Spotlight" theory tries to bridge this, but pure Eternalism struggles).
      *   **Presentism:** Takes the phenomenology veridically.
      *   **The Clash:** One side privileges the physical/spacetime description; the other privileges the phenomenological/intentional description. That is a substantive axiological disagreement.

  ### 2. The Role of Relativity (STR)
  You are correct that Putnam's argument assumes a premise Presentists reject: **Existence must be frame-invariant.**

  *   **The Presentist Move:** "Existence is not a physical property." They argue STR describes causal structure and measurement, not ontology. They are willing to posit a "metaphysical present" that physics cannot detect (a Neo-Lorentzian move without the ether).
  *   **The Cost:** This saves Presentism but severs the link between metaphysics and physics. If your ontology is undetectable in principle by the best science of space and time, you are doing theology, not naturalistic metaphysics.
  *   **The Diagnosis:** The debate here isn't about STR itself; it's about **methodology**. Should metaphysics be continuous with physics (Quinean naturalism), or is it a priori conceptual analysis that constrains physics (Aristotelian rationalism)? Eternalists usually hold the former; Presentists the latter. That is why STR hasn't "closed the case."

  ### 3. What would count as progress?
  You asked for specific conditions for progress. Here are the three viable paths, ranked by likelihood:

  **A. The Physics Route (Low Probability)**
  *   **Condition:** A theory of Quantum Gravity (e.g., specific interpretations of Loop Quantum Gravity or Bohmian Mechanics) empirically confirms a **preferred foliation** of spacetime.
  *   **Result:** Presentism gains massive credibility. The "metaphysical present" becomes a "physical present."
  *   **Status:** Currently, most QG programs (like String Theory) remain background independent or relativistic. A preferred frame is seen as a bug, not a feature, in most high-energy physics.

  **B. The Semantic/Meta-Metaphysical Route (Medium Probability)**
  *   **Condition:** A successful defense of **Quantifier Variance** or **Conceptual Relativism**.
  *   **Result:** We realize both sides are "right" relative to their conceptual framework. The debate dissolves into pragmatics: "Which framework is more useful for this specific inquiry?"
  *   **Status:** Ted Sider argued vigorously against this (*Writing the Book of the World*), claiming there is a "joint-carving" structure to reality that makes one view objectively truer. Most analytic metaphysicians still believe there is a fact of the matter, keeping the debate alive.

  **C. The "No Progress" Route (High Probability)**
  *   **Reasoning:** The debate is **systematically underdetermined**.
      *   Empirically: Both theories predict the same sensory experiences (we remember the past, we don't see the future).
      *   Physically: Both can accommodate STR (one by accepting the block, one by positing an undetectable foliation).
      *   Logically: Both can construct truthmaker theories (Eternalism via concrete past entities, Presentism via abstract surrogates).
  *   **Verdict:** Because the theories are designed to be empirically equivalent, no amount of data will decide it. The choice comes down to **theoretical virtues** (Parsimony vs. Intuition).
      *   Eternalism wins on Parsimony (no magical Lucretian properties).
      *   Presentism wins on Intuition (time seems to pass).
  *   **Conclusion:** Progress is impossible because there is no "view from nowhere" to weigh Parsimony against Intuition. It is a framework choice, not a discovery.

  ### 4. Bonus: Gödel's Rotating Universe
  Does Gödel's argument still do work? **Mostly no.**

  *   **The Argument:** In Gödel spacetimes (solutions to Einstein's field equations), closed timelike curves exist. You can fly a rocket and return to your own past. Gödel argued that if time were "real" (objective passage), this should be impossible. Since GR allows it, time is "ideal" (Kantian/illusory).
  *   **Current Status:**
      1.  **Relevance:** Our universe does not appear to be a Gödel universe (it's expanding, not rotating in that way). So, it doesn't dictate the ontology of *our* world.
      2.  **Function:** It is now cited primarily as a *reductio* against the idea that GR *entails* Eternalism. It shows GR is flexible enough to allow weird temporal structures.
      3.  **Philosophical Weight:** It is rarely used as a positive argument for the ideality of time anymore. It serves as a historical marker for the "Eternalism is forced by physics" narrative, reminding us that even within GR, the ontology is not straightforward.

  ### Summary
  Your suspicion is well-founded. The debate is frozen because it has shifted from a first-order dispute about time to a second-order dispute about **how to do metaphysics**.

  *   If you believe metaphysics must track fundamental physics, Eternalism wins (STR + Parsimony).
  *   If you believe metaphysics must track phenomenological experience and conceptual coherence, Presentism wins (Passage + Truthmaker flexibility).

  The "verbal dispute" diagnosis is the exit ramp, but most drivers refuse to take it because they believe they are arguing about the **structure of reality**, not just the map. Until we have a meta-metaphysical consensus that ontology is pragmatic rather than representational, the debate will remain exactly as you found it: a stalemate of mutually incompatible intuitions protected by ad-hoc theoretical defenses.

  **Recommendation:** If you want to break the freeze, don't look at time. Look at **grounding**. The most productive recent work asks: "What is the *cost* of a truthmaker?" If Presentists can show their Lucretian properties are ontologically cheaper than Eternalist spacetime worms, the balance shifts. If not, the verbal dispute diagnosis is the only honest conclusion.
