      *   **Hypothesis:** It's mostly a verbal dispute about the meaning of "exists" (tenseless vs. tense-bound). If disambiguated, STR doesn't touch presentism because "now" isn't a physical notion.
      *   **Questions:**
          1.  Is the "verbal dispute" diagnosis right, or is there substantive disagreement underneath (truthmakers, tensed facts, passage)?
          2.  What would count as progress (physics, semantics, truthmakers)?
          3.  Is "no progress possible" a viable answer (with reasoning)?
          4.  (Bonus) Does Gödel's rotating universe argument still do work?

  2.  **Deconstruct the "Verbal Dispute" Hypothesis:**
      *   *Initial thought:* It's tempting to say it's just semantics (Carnap/Quine style). If Eternalist says "Dinosaurs exist (tenselessly)" and Presentist says "Dinosaurs do not exist (now) but did exist," aren't they saying the same thing about the world?
      *   *Counter-thought:* No, there are ontological commitments that go beyond semantics.
          *   **Truthmakers:** Eternalists need past entities/properties to make past truths true. Presentists need *present* entities/properties (Lucretian properties, ersatz worlds, etc.). This is a structural difference in ontology, not just vocabulary.
          *   **Phenomenology/Experience:** Prior's argument about relief. If time doesn't pass (Eternalism), why do we feel relief? Eternalists have to explain this away as an illusion or a perspective effect. Presentists take it veridical.
          *   **Modality:** Eternalism often aligns with necessitarianism about the past (it's fixed). Presentism allows for a more open future (though not always).
      *   *Conclusion:* It's *partly* verbal (quantifier variance), but there are substantive differences in *what* is required to ground truth and explain experience.

  3.  **Evaluate the Role of Relativity (STR):**
      *   *Putnam's Argument:* If "now" is relative, and existence shouldn't depend on a frame, then all points in spacetime exist equally.
      *   *Presentist Responses:*
          *   *Neo-Lorentzian:* There *is* a preferred frame, we just can't detect it. (Metaphysically costly, physically unmotivated).
          *   *Fragmentalism/Relativized Existence:* Existence is frame-relative. (Challenges the idea of a single objective reality).
          *   *Instrumentalism:* STR describes measurements, not ontology. (Hard to maintain given STR's success).
      *   *User's point:* "All it shows is that 'now' isn't a global physical notion."
      *   *Assessment:* This is the strongest Presentist move (the "Metaphysical Presentism" vs. "Physical Presentism" distinction). But it comes at the cost of making metaphysics disconnected from physics. Is that a bug or a feature?

  4.  **Assess "Progress":**
