      *   *Semantics:* "Quantifier Variance" (Hirsch) suggests they are talking past each other. But most metaphysicians reject this as trivializing ontology.
      *   *Truthmakers:* This is the battleground. Can Presentism ground past truths without past entities? (E.g., Bigelow, Sider). If yes, the cost of Presentism drops. If no, Eternalism wins on parsimony.
      *   *No Progress:* Why? Because the debate rests on fundamental intuitions (passage vs. block) that are pre-theoretical and underdetermined by evidence. It's a "framework choice" (Carnap) rather than a factual dispute.

  5.  **Address Gödel's Rotating Universe:**
      *   *The Argument:* In Gödel spacetime, there are closed timelike curves. You can travel to your own past. If time is real (passage), this should be impossible or paradoxical. Gödel concluded time is "ideal" (Kantian).
      *   *Current Status:* Mostly historical/curiosity. Our universe doesn't look like Gödel's. It shows *possibility* within GR, but doesn't dictate *actual* ontology. It's cited for the "time is illusory" point, but rarely as a knockout punch anymore.

