      *   *Key Reference:* Ted Sider's *Four-Dimensionalism* is the bible of the "substantive" view. Eli Hirsch is the "verbal" guy. Simon Saunders or Harvey Brown for the physics side.

  8.  **Final Polish:** Check against the specific questions asked.
      *   Diagnosis right? (Partly, but truthmakers matter).
      *   Substantive disagreement? (Yes, grounding and phenomenology).
      *   What counts as progress? (Physics, or meta-metaphysical dissolution).
