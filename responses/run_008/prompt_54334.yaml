answer: |-
  The principle that best captures your intuitions, while plugging the hole in your "expression" theory, is **The Principle of Constitutive Fiction.**

  ### The Principle
  **The moral quality of a virtual act is determined by the fictional description of that act, not just the physical input or the abstract "harm."**

  In philosophy of action, this is the difference between "moving my thumb" and "turning on a light." The fiction of the game doesn't just decorate what you are doing; it *constitutes* what you are doing. When you press a button in *GTA*, you are "causing traffic chaos in a satire." When you press a button in the "Conscious NPC" game, you are "inflicting suffering on a subject."

  These are different actions, even if the code and the button press are identical. Therefore, they express different things about you. Your intuition that the "Conscious NPC" game is different from *GTA* isn't a trick of the fiction; it's a recognition that **you are literally doing something different.** One is an act of abstracted play; the other is an act of simulated cruelty.

  ### How It Fits Your Cases
  *   **GTA Pedestrians:** The fiction frames them as "set dressing" or "obstacles." You are engaging in *chaos play*. This expresses a desire for release or destruction, but not necessarily cruelty toward a subject.
  *   **RDR2 Horse:** The fiction frames the horse as a "companion" with trust mechanics. Killing it is *betrayal* or *negligence*, not just deleting an asset. The guilt comes from violating the normative expectations of the companion frame.
  *   **Torturing NPC:** The fiction frames the interaction as "extraction of pain." You are engaging in *simulated abuse*. This feels creepy because it requires you to adopt the mindset of a torturer to proceed, cultivating a specific, ugly imaginative habit.
  *   **Reloading Save:** This works because it **retcons the fiction.** If the narrative is undone, the action "I killed my companion" is replaced by "I experimented with a timeline." The constitutive description changes from *murder* to *exploration*.
  *   **Conscious NPC Game:** The fiction explicitly constitues the NPCs as "moral patients." To play is to agree to the proposition "I will harm beings that suffer." This expresses a willingness to harm subjects, which is a different vice than enjoying cartoon chaos.

  ### The Verdict It Must Overturn
  **The Sims Drowning.**

  According to the Principle of Constitutive Fiction, drowning a Sim should carry *more* moral weight than mowing down a *GTA* pedestrian, not less.
  *   **Why:** *The Sims* fiction explicitly frames its characters as "people" with lives, relationships, and desires (hence the name "Simulated People"). *GTA* frames its pedestrians as "traffic."
  *   **The Overturn:** Your intuition that drowning a Sim is "classic, fine" is likely a product of **desensitization** and the game's cartoonish art style, which subtly undermines its own fiction. The principle argues you *should* feel more discomfort drowning a Sim than running over a *GTA* ped because the fictional description ("killing a person in their home") is morally heavier than ("clearing a road in a crime satire"). The principle suggests your lack of guilt here is an inconsistency in your moral perception, not a feature of the act.

  ### The Prediction: The Modded Shooter
  **Case:** A mod for a standard shooter (like *Call of Duty*) that adds the same begging-and-pleading reactions to enemies found in the torture case, where normally they just grunt or shout threats.

  **Prediction:** **The game will become significantly less enjoyable and morally "heavier" for you, potentially to the point of unplayability.**

  *   **Reasoning:** Standard shooters constitute enemies as "combatant obstacles." The fiction is war; the norm is elimination. Adding begging changes the constitutive description of the act from "clearing a hostile room" to "executing a surrendering or terrified subject."
  *   **Effect:** This creates **Ludonarrative Dissonance.** The gameplay loop (kill everything) conflicts with the new fictional frame (these are suffering subjects). To continue playing, you would have to actively suppress the fictional frame (ignore the begging) or emotionally detach.
  *   **Outcome:** Unlike *GTA*, where the violence is the point of the satire, here the violence becomes gratuitous cruelty because the "war" justification is undermined by the "begging" frame. You will likely feel the same "creepy" sensation you felt during the torture scene, because you are once again being asked to constitute your action as *harming a subject* rather than *overcoming an obstacle*.

  ### Summary
  You aren't worried about the code (sentience); you are worried about **what you are practicing.** The Principle of Constitutive Fiction argues that the fiction tells you *what you are practicing*. When the fiction changes from "cartoon chaos" to "simulated suffering," you are no longer practicing the same thing, even if your fingers are moving the same way.
