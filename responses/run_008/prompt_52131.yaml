answer: |-
  # Moral Responsibility Intuition Quiz

  **Instructions:** Read each case carefully. Choose the option that best matches your immediate intuition about the agent's moral responsibility or the appropriateness of reactive attitudes (like blame, resentment, or praise). There are no right or wrong answers; the goal is to map your philosophical profile.

  **1. The Counterfactual Intervener (Frankfurt Case)**
  Jones decides to vote for Candidate A on his own. However, unbeknownst to Jones, a neuroscientist (Black) is monitoring his brain. If Jones had shown signs of choosing Candidate B, Black would have intervened to force him to choose A. As it happens, Jones chooses A entirely on his own, and Black never intervenes.
  *   A. Jones is **not morally responsible**. He could not have done otherwise, and alternate possibilities are required for responsibility.
  *   B. Jones is **morally responsible**. He acted on his own desires and mechanisms; the mere presence of a backup plan doesn't change actual history.
  *   C. Jones **owns the action**, but full blame is inappropriate because his freedom was compromised by the setup.

  **2. The Engineered Life (Manipulation Argument)**
  Plum was created by neuroscientists who programmed his brain from birth to be egoistic and calculating. He is psychologically indistinguishable from an ordinary person. He deliberately kills someone for personal gain, reasoning through the act clearly.
  *   A. Plum is **not responsible**. His causal history was controlled by others, making him a puppet regardless of his current psychology.
  *   B. Plum is **responsible**. His current psychological structure (reasons, desires) is what matters, not how he got there.
  *   C. Plum is **answerable** for the act (it reflects his values), but he is not a proper target of *blame* because of his origin.

  **3. The Instrumental Psychopath**
  Alex has a neurological condition that prevents them from feeling empathy or understanding moral reasons as binding. However, Alex understands laws and social conventions perfectly. Alex plans and executes a fraud to make money, knowing it is illegal and hurts others, but simply not caring about the moral wrong.
  *   A. Alex is **responsible**. They understood the facts and chose to do it; moral ignorance is no excuse if instrumental rationality is intact.
  *   B. Alex is **not responsible**. Moral responsibility requires the capacity to grasp and respond to moral reasons, which Alex lacks.
  *   C. Alex is **attributable** (the act is theirs), but blame is unfitting because they lack the capacity to be morally guided.

  **4. The Duress Dilemma**
  Taylor steals a car because a gunman threatens to shoot Taylor's sibling if they don't. Taylor hates stealing and would never do it otherwise, but chooses to save the sibling.
  *   A. Taylor is **not responsible**. Coercion removes voluntary control.
  *   B. Taylor is **responsible**. Taylor still made a choice; the pressure explains the action but doesn't excuse it.
  *   C. Taylor is **responsible but excused**. The action is attributable to Taylor, but blame is inappropriate given the circumstances.

  **5. The Repentant Criminal**
  At age 20, Jordan committed a violent assault. At age 40, Jordan is a genuinely different person: deeply reformed, empathetic, and repudiated their past values. The 40-year-old Jordan is psychologically discontinuous with the 20-year-old aggressor.
  *   A. Jordan is **still blamable**. The 20-year-old was Jordan, and responsibility tracks the agent over time.
  *   B. Jordan is **not blamable now**. The person who did it is gone; blaming the current person is like punishing a twin for the other's crime.
  *   C. Jordan is **answerable for the past** (must make amends), but current *resentment* toward the new person is inappropriate.

  **6. The Objective Attitude (Parent/Child)**
  Your child repeatedly hurts others due to selfishness. You consider adopting the "objective attitude" (viewing them as a subject for treatment/management rather than a participant in a relationship) to manage their behavior.
  *   A. This is **impossible while loving them**. Love requires participating in reactive attitudes (resentment, gratitude); dropping them ends the relationship.
  *   B. This is **possible and sometimes necessary**. You can love someone while temporarily suspending reactive attitudes for their own good.
  *   C. This is **possible but damaging**. It treats the child as an object, which undermines the mutual recognition required for love.

  **7. The Hard Determinism Truth**
  Suppose it is proven true that hard determinism is correct: every event is causally necessitated by prior events and laws of nature, such that no one could ever have done otherwise.
  *   A. **Resentment is never fitting.** If no one could do otherwise, blaming them is irrational and unfair.
  *   B. **Resentment is still fitting.** Our practices of responsibility depend on human relationships, not metaphysical freedom.
  *   C. **Resentment is natural but unjustified.** We will feel it, but philosophically we know it isn't deserved.

  **8. The Unconscious Bias (Negligence)**
  Sam forgets a close friend's birthday. Sam cares deeply about the friend but was stressed and unconsciously prioritized work. Sam had no ill will but failed to show care.
  *   A. Sam is **blamable**. Responsibility extends to negligence; Sam should have cared enough to remember.
  *   B. Sam is **not blamable**. Without ill will or conscious choice, there is no quality of will to blame.
  *   C. Sam **owes an account**. Sam is answerable for the oversight and must explain/repair, even if "blame" is too strong.

  ***

  # Scoring Key & Philosophical Profiles

  Tally your answers below to see which philosophical position aligns closest with your intuitions. Note that real philosophical views are nuanced; this quiz highlights dominant tendencies.

  ### **Tally Sheet**
  *   **Hard Incompatibilist Leanings:** Count Q1(A), Q2(A), Q3(B), Q7(A).
  *   **Strawsonian (Quality of Will) Leanings:** Count Q1(B), Q2(B), Q3(A), Q6(A), Q7(B).
  *   **Reasons-Responsiveness (Fischer-style) Leanings:** Count Q1(B), Q2(B), Q3(B), Q8(A).
  *   **The Reason View (Wolf-style) Leanings:** Count Q1(A), Q2(B), Q3(B), Q7(A/C).
  *   **Answerability/Attributability (Shoemaker-style) Leanings:** Count Q1(C), Q2(C), Q3(C), Q5(C), Q8(C).

  ### **Profile Descriptions**

  **1. Hard Incompatibilism (Mostly A on Q1, Q2, Q7)**
  You believe moral responsibility requires a kind of freedom that is incompatible with determinism and manipulation. If an agent's actions are the inevitable result of prior causes (whether natural or engineered), blame is unjustified. You likely view resentment as unfitting in a determined world.
  *   *Key Intuition:* Causal history and alternate possibilities matter fundamentally.

  **2. Strawsonian Quality-of-Will Compatibilism (Mostly B on Q2, Q6, Q7)**
  You believe responsibility is grounded in our interpersonal relationships and reactive attitudes, not metaphysics. Whether determinism is true doesn't matter; what matters is the quality of the agent's will (ill will, good will, indifference). You think abandoning reactive attitudes (like toward your kid) is impossible without losing love.
  *   *Key Intuition:* Responsibility is a human practice, not a metaphysical fact.

  **3. Reasons-Responsiveness (Mostly B on Q1, Q3, Q8)**
  You believe responsibility depends on the mechanism that produces action. If the agent's mechanism is sensitive to reasons (even if they couldn't have done otherwise in that specific instance, per Q1), they are responsible. You likely hold agents responsible for negligence (Q8) if they *should* have been responsive to reasons.
  *   *Key Intuition:* Control is about the capacity to recognize and react to reasons, not alternate possibilities.

  **4. The Reason View (Mostly A on Q1, B on Q2, B on Q3)**
  You believe responsibility requires the ability to do otherwise *when* morality requires it. You might agree with compatibilists on manipulation (if the structure is normal) but disagree on Frankfurt cases (Q1) where alternate possibilities are removed. You likely think psychopaths (Q3) lack the "sanity" required for responsibility.
  *   *Key Intuition:* Freedom is the ability to act in accordance with the True and the Good.

  **5. Answerability/Attributability View (Mostly C options)**
  You distinguish between being *responsible* (owning an attitude/action as yours) and being *blamable* (deserving of sanction). You think agents can be answerable for their actions (even in manipulation or transformation cases) without necessarily deserving resentment. You focus on the demand for an explanation rather than punishment.
  *   *Key Intuition:* Responsibility is about ownership of attitudes, not necessarily desert of blame.

  ### **Limitations & Consistency Checks**

  **Positions This Quiz Cannot Fully Separate:**
  *   **Strawsonian vs. Reasons-Responsiveness:** Both are compatibilist and often yield the same verdicts on concrete cases. This quiz distinguishes them only loosely via Q6 (attitudes vs. mechanisms) and Q8 (negligence).
  *   **Hard Incompatibilism vs. The Reason View:** Both often deny responsibility in Frankfurt cases (Q1) and Determinism (Q7). The distinction lies in *why* (metaphysical freedom vs. rational capacity), which is hard to capture in multiple choice.
  *   **Answerability vs. Strawsonian:** Strawsonians often accept answerability but insist it entails blame. The quiz tries to separate them in Q5 and Q8, but overlap is common.

  **Impossible/Unstable Combinations:**
  *   **The "History Ignorer" Incompatibilist:** If you chose **Q1(A)** (Not responsible in Frankfurt) but **Q2(B)** (Responsible in Manipulation), your view is unstable. Usually, if alternate possibilities matter (Q1), causal history matters (Q2). Holding both suggests a conflict between caring about freedom vs. caring about origin.
  *   **The "Blame Without Ownership" Theorist:** If you chose **Q5(B)** (Not blamable because different person) but **Q8(A)** (Blamable for negligence), you may be inconsistently applying diachronic identity.
  *   **The "Objective Lover":** If you chose **Q6(B)** (Objective attitude is compatible with love) but **Q7(B)** (Resentment is fitting under determinism), you may need to clarify whether you view resentment as a form of objective management or a participatory attitude. Strawson argues they are opposites.

  **Note:** Most professional philosophers hold hybrid views. Use this profile as a starting point for discussion, not a final label.
