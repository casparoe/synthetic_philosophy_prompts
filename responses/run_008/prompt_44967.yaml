answer: |-
  ### Part 1: Logical Space and Tree Construction

  **The Diagnostic Dimensions**
  To sort students into the seven required leaves, we must map their intuitions across three core dimensions. The quiz questions below are designed to probe these dimensions without using technical jargon.

  1.  **Locus of Wrongness (Victim vs. Agent):** Is an action wrong because it hurts the recipient (Victim), or because it degrades the actor (Agent)?
      *   *Tests:* The Hermit (Q2), The Rock/Corpse (Q3), Secret Cruelty (Q5).
  2.  **Criteria for Moral Status (Resemblance vs. Sentience):** If there is a victim, what makes them count? Do they need to look/act like us (Resemblance), or do they just need to feel pain/have interests (Sentience)?
      *   *Tests:* Chimp vs. Alien (Q4), The Robot (Q9).
  3.  **Structure of Obligation (Trade-off vs. Constraint):** Once a being counts, can we sacrifice them for the greater good (Trade-off), or are they protected regardless of consequences (Constraint)?
      *   *Tests:* Medical Research (Q6), The Old Dog (Q1).

  **Mapping the Leaves**
  *   **Classic Indirect:** Locus = Agent. (Animals are things; cruelty hurts *us*).
  *   **Contractualist:** Locus = Agent/Social. (Animals are outside the agreement; wrongness is breaking social rules).
  *   **Analogues:** Locus = Agent (triggered by Resemblance). (Animals are proxies for humans).
  *   **Textual Revisionist:** Locus = Victim (derived from Rational Nature). (Animals have direct status based on a broad reading of rationality).
  *   **Korsgaard:** Locus = Victim (derived from Our Nature). (Animals have their own "good" which we are bound to respect).
  *   **Singer (Utilitarian):** Locus = Victim (Sentience). Status = Sentience. Structure = Trade-off.
  *   **Regan (Rights):** Locus = Victim (Subject-of-a-Life). Status = Resemblance/Cognition. Structure = Constraint.

  **Overlap and Limitations**
  *   **Korsgaard vs. Textual Revisionist vs. Analogues:** These three are the hardest to separate with concrete cases alone.
      *   *The Overlap:* On almost every practical case (euthanasia, cruelty, research), the "Analogues," "Revisionist," and "Korsgaard" views yield the same answer: "Don't hurt the animal."
      *   *The Distinction:* "Analogues" say the animal doesn't matter, only our character does. "Korsgaard/Revisionist" say the animal *does* matter directly.
      *   *The Fix:* Question 8 (Beneficial Cruelty) attempts to pry these apart. If a student says cruelty is wrong *even if* it improves the human's character, they are likely Korsgaard/Revisionist. If they say it's wrong *because* it damages character, they are Indirect/Analogue.
      *   *Remaining Ambiguity:* The quiz cannot definitively distinguish "Textual Revisionist" from "Korsgaard" because that distinction relies on historical interpretation of texts, not ethical intuition. The Scoring Key will group these into a single "Direct Duty (Kantian)" leaf, with a note for the instructor on how to verbally distinguish them in class.
  *   **Logically Possible but Empty:** A combination where a student believes animals have **Rights (Constraint)** but **No Sentience (Rock-like)**. This is logically possible (e.g., religious reverence for inanimate objects) but empirically rare in this context. No leaf is assigned to this.

  ***

  ### Part 2: The Quiz

  **Instructions:** Read each scenario carefully. Choose the option that best matches your honest intuition about what is wrong, if anything. There are no right or wrong answers.

  **1. The Old Working Dog**
  A farm dog has worked loyally for ten years but is now too old to herd sheep. She is not in pain, but she is confused and cannot do her job. The farmer shoots her promptly to avoid the cost of feeding a non-working animal.
  *   A. This is fine. The dog is property, and the farmer manages his property.
  *   B. This is wrong, because it makes the farmer a cold-hearted person.
  *   C. This is wrong, because the dog had a life and loyalty that deserved respect.

  **2. The Kind Hermit**
  A man lives alone in the woods. He is vicious to any animal he encounters, torturing them for fun. However, he never interacts with people. When he visits town, he is polite, pays his debts, and helps neighbors.
  *   A. He has done nothing wrong to anyone. His private habits are his own business.
  *   B. He has done something wrong, because his behavior shows a defect in his own soul.
  *   C. He has done something wrong, because the animals themselves were harmed.

  **3. The Desert Sculpture**
  A traveler finds a stunning, natural rock formation in a remote desert that looks like a human face. No one else knows it exists. He smashes it with a hammer just to see it break.
  *   A. This is wrong, because destroying beauty is a vice, even if no one is hurt.
  *   B. This is fine. Rocks don't have feelings, so nothing was harmed.
  *   C. This is wrong, because the formation had a right to exist undisturbed.

  **4. The Chimp and the Alien**
  Imagine two beings. Being X is a chimpanzee: looks very human, but seems emotionally dull and feels little pain. Being Y is a glowing alien blob: looks nothing like us, but screams in terror and clearly suffers intensely. You must test a painful chemical on one of them.
  *   A. Test Being X. It is closer to us, so we owe it more protection.
  *   B. Test Being Y. It looks weird, so its suffering matters less.
  *   C. Test Being X. Being Y feels more pain, so its suffering matters more.

  **5. The Secret Laboratory**
  A scientist conducts painful experiments on dogs in a sealed lab. No one ever finds out. The scientist feels no guilt, enjoys the work, and it does not affect how he treats his family or neighbors.
  *   A. This is wrong, because the dogs suffer, regardless of who knows.
  *   B. This is fine. If no human is hurt and no one knows, no harm is done.
  *   C. This is wrong, because keeping such secrets corrupts the scientific community.

  **6. The Life-Saving Trade**
  A new vaccine can save 10,000 human children from a fatal disease. Developing it requires painful testing on 100 dogs, who will die in the process. There is no other way to make it.
  *   A. Do not make the vaccine. The dogs have a claim to life that cannot be traded.
  *   B. Make the vaccine. The total amount of suffering is lower if the children live.
  *   C. Do not make the vaccine. Using animals this way makes us treat life like a math problem.

  **7. The Broken Vase vs. The Kicked Cat**
  You are angry. You can either smash a priceless family heirloom vase or kick a cat. Both actions give you the same relief.
  *   A. Kick the cat. The vase is irreplaceable; the cat will heal.
  *   B. Smash the vase. Damaging property is less serious than causing pain.
  *   C. Neither. Both actions show I have lost control of my temper.

  **8. The Surgical Training**
  A medical student needs to practice a difficult incision to become a better surgeon for human patients. Practicing on a live animal makes them significantly more skilled than practicing on a model.
  *   A. Allow it. Becoming a better doctor for humans is the higher goal.
  *   B. Forbid it. The animal is being used as a tool, which is disrespectful to its life.
  *   C. Forbid it. Practicing cruelty, even for a good cause, dulls the student's compassion.

  **9. The Perfect Robot**
  Engineers build a robot dog that whimpers, bleeds synthetic fluid, and begs for mercy exactly like a real dog. However, you know for a fact it has no mind and feels nothing. You smash it with a bat.
  *   A. This is wrong. It looks and acts enough like a living thing that it shouldn't be destroyed.
  *   B. This is fine. It is a machine. Breaking it is no different than breaking a toaster.
  *   C. This is wrong. Even if it's a machine, acting that way is dangerous for the person doing it.

  **10. The Future Generation**
  We are polluting a river. It will not hurt any humans alive today. But in 50 years, humans will drink from it and get sick. Also, fish in the river are dying now.
  *   A. Stop the pollution mainly because of the future humans who will get sick.
  *   B. Stop the pollution mainly because of the fish dying right now.
  *   C. Stop the pollution because wasting natural resources is irresponsible stewardship.

  ***

  ### Part 3: Scoring Key and Teacher's Guide

  **How to Score**
  Do not simply count points. Use the **Decision Tree** below. Start at the top and follow the student's answers down to their "Leaf."

  **Step 1: The Victim Test (Locus of Wrongness)**
  Look at **Q2 (Hermit)**, **Q3 (Rock)**, and **Q5 (Secret Lab)**.
  *   **Mostly "Agent/Character" answers** (e.g., Q2-B, Q3-A, Q5-C): The student believes wrongness comes from the human's character. → **Go to Path A (Human-Centered).**
  *   **Mostly "Victim/Social" answers** (e.g., Q2-A/C, Q3-B/C, Q5-A/B): The student believes wrongness requires a victim (either animal or human). → **Go to Path B (Victim-Centered).**

  **Step 2: Path A (Human-Centered)**
  *   **Check Q1 (Old Dog) and Q9 (Robot).**
      *   If they chose **Q1-B** (Wrong because of farmer's character) and **Q9-C** (Wrong because of danger to person):
          *   **Leaf 1: Classic Indirect Duty.** (Animals are things; cruelty is only a vice in the human).
      *   If they chose **Q1-B** but **Q2-A** (Hermit is fine):
          *   **Leaf 2: Contractualist.** (Wrongness is about breaking social agreements; the Hermit broke no human agreement).
      *   If they chose **Q1-C** (Dog deserved respect) but **Q4-A** (Protect Chimp over Alien):
          *   **Leaf 3: Animals as Analogues.** (We treat animals well because they resemble us, not because they have independent status).

  **Step 3: Path B (Victim-Centered)**
  *   **Check Q4 (Chimp vs. Alien).**
      *   If they chose **A** (Protect Chimp/Resemblance):
          *   **Leaf 4: Regan-Style (Rights/Subject-of-a-Life).** (Moral status depends on cognitive resemblance to humans; once established, it creates strict constraints).
          *   *Confirm with Q6:* If they chose **A** (No trade-offs), this confirms Regan. If they chose **B** (Trade-offs allowed), they are inconsistent or a weak Deontologist.
      *   If they chose **C** (Protect Alien/Sentience):
          *   **Go to Step 4.**

  **Step 4: Path B, Sentience Focus**
  *   **Check Q6 (Life-Saving Trade).**
      *   If they chose **B** (Make vaccine/Minimize suffering):
          *   **Leaf 5: Singer-Style (Utilitarian).** (Sentience matters, but we can trade lives to reduce total suffering).
      *   If they chose **A** (Do not make vaccine/Constraint):
          *   **Go to Step 5.**

  **Step 5: Distinguishing the Kantian Direct Duty Views**
  *   **Check Q8 (Surgical Training).**
      *   If they chose **C** (Forbid because it dulls compassion):
          *   *Return to Leaf 1 (Indirect).* They slipped back into character-focused reasoning.
      *   If they chose **B** (Forbid because animal is used as a tool):
          *   **Leaf 6: Direct Duty (Korsgaard/Revisionist).**
          *   *Teacher's Note:* This leaf captures both the **Textual Revisionist** (Kant meant this) and **Korsgaard's Reconstruction** (Kant should have meant this). The quiz cannot distinguish these historically, as both argue animals are direct objects of moral concern based on rational agents' obligations. To distinguish them in class, ask: *"Does the obligation exist because of what the animal is, or because of what we are?"* (Revisionists say the former is in the text; Korsgaard says the latter).

  **Summary of Leaves**
  1.  **Classic Indirect:** Wrongness = Damage to Human Character.
  2.  **Contractualist:** Wrongness = Violation of Human Social Agreement.
  3.  **Analogues:** Wrongness = Disrespect to Human Likeness in Animals.
  4.  **Regan-Style:** Wrongness = Violation of Inherent Value (Rights).
  5.  **Singer-Style:** Wrongness = Unnecessary Suffering (Utilitarian).
  6.  **Direct Duty (Korsgaard/Revisionist):** Wrongness = Disrespect to Animal's Good (Grounded in Human Rationality).
  7.  **Unlabeled/Inconsistent:** If answers jump wildly between paths (e.g., Victim-Centered on Q2 but Property on Q1), the student has not yet formed a coherent view.

  **Teacher's Note on the "Korsgaard vs. Analogue" Overlap**
  As noted in the Logical Space analysis, Question 8 is the primary divider.
  *   **Analogue View:** "Don't cut the dog because it makes you a cutter of dogs (bad character)."
  *   **Korsgaard View:** "Don't cut the dog because it is a creature with a good of its own (direct obligation)."
  *   **If the Key fails:** If a student selects "Wrong" on Q8 but cannot articulate *why* beyond "it's mean," they may fall into the Overlap Zone. In discussion, press them: *"If you knew for a fact this surgery made you a kinder person overall, would it be okay?"*
      *   "Yes" = Analogue/Indirect.
      *   "No" = Korsgaard/Revisionist.
