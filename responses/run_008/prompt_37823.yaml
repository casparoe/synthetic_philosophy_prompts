answer: |-
  # The "Consent Laboratory" Seminar Plan

  ## 1. Setup and Materials
  **Room:** Arrange chairs in a large circle initially. For Round 4, students will move into pairs.
  **Materials:**
  *   **Tokens:** 100 poker chips or distinctively colored paper slips (20 per student to start).
  *   **The "Bank":** A box at the front of the room controlled by you.
  *   **Record Sheets:** One per student, numbered 1–4, with columns for "Decision (Y/N)," "Reasoning," and "Validity (Valid/Invalid/Unsure)."
  *   **Stakes:** A visible prize pool.
      *   *Immediate:* High-quality chocolate (one piece per 5 tokens at the end).
      *   *Course-Related:* The student with the most tokens at the end gets to choose the order of topics for the final three weeks (or exemption from one short response paper). This creates social stakes without financial ones.

  **Pre-Class Prep:**
  Count out 20 tokens per student. Write the "Offers" for each round on separate slides or index cards so you can reveal them sequentially.

  ## 2. Rules and Payoff Scheme
  **The Premise:** You are the "Experimenter." The students are "Agents." They are entering a market of transactions. Their goal is to maximize tokens.
  **The Baseline:** Everyone starts with 20 tokens.
  **The Rule of Consent:** For a transaction to count toward their final score, it must be *valid*. If they accept an invalid offer, they lose the tokens traded. If they refuse a valid offer, nothing happens. (Crucially: *They* must judge validity in the moment, but *you* reserve the right to audit their judgment in the debrief. For the sake of the game flow, let them keep the winnings provisionally, but mark their sheet on whether they *felt* it was valid consent).

  **The Rounds (Manipulating Variables):**

  *   **Round 1 (Control):** "Trade 1 token now for 2 tokens from the Bank immediately."
      *   *Conditions:* Informed, Uncoerced, Competent.
      *   *Expected:* Universal acceptance. Valid.
  *   **Round 2 (Information - Inessential Deception):** "Trade 1 token for a **Gold** token from the Bank." (You hand out a Gold token, but it is actually a painted Red token worth the same amount. Or, offer a specific chocolate flavor: "This is Dark Chocolate," when it is Milk. The value is identical, the description is false.)
      *   *Conditions:* Uncoerced, Competent, **Not Informed** (but feature is ostensibly inessential).
      *   *Expected:* Mixed. Some will feel lied to; others will say "It's worth the same, who cares?"
  *   **Round 3 (Coercion - Small Penalty):** "Trade 1 token for 2 tokens. However, anyone who **declines** this offer must stand in the corner for the next 5 minutes."
      *   *Conditions:* Informed, Competent, **Coerced?** (Refusal makes them worse off than baseline, but the penalty is trivial/socially mild).
      *   *Expected:* High acceptance. High discomfort. The debate will be: "Is social embarrassment coercion?"
  *   **Round 4 (Proxy - Authority):** Students pair up. Student A holds Student B's tokens. Student A is offered: "Flip a coin. Heads, Student B gets 10 tokens. Tails, Student B loses 5." Student A decides; Student B must abide.
      *   *Conditions:* **Competence/Authority** (A is competent, but is A authorized to waive B's risk?).
      *   *Expected:* Confusion. B may feel violated even if they win. A may feel paternalistic.

  ## 3. Timeline (90 Minutes)

  **0:00 – 0:10: Introduction & Stakes**
  *   Explain the token economy and the prize (Topic Choice/Chocolate).
  *   Distribute Record Sheets.
  *   **Crucial Instruction:** "In each round, you must decide whether to accept. But you must also mark on your sheet: *'Did I genuinely consent?'* If you feel your consent was compromised, mark 'Invalid.' Your winnings are provisional pending our discussion."

  **0:10 – 0:50: The Four Rounds (10 mins each)**
  *   **Round 1 (3 mins decision, 7 mins transition):** Keep it brisk. Establish the baseline.
  *   **Round 2 (3 mins decision, 7 mins transition):** Reveal the deception *after* the trade. Ask them to record their immediate reaction.
  *   **Round 3 (3 mins decision, 7 mins transition):** Enforce the penalty (stand in corner) for 2 minutes to make it real, then let them sit.
  *   **Round 4 (5 mins decision, 5 mins transition):** Move chairs. Pair up. Designate A and B. Reveal outcome. Ask B: "Did you consent to this risk?"

  **0:50 – 1:30: The Debrief (40 Minutes)**
  *   **Phase 1: The Data (10 mins):** Tally the board. How many marked "Invalid" in Round 2? Round 3? Round 4?
  *   **Phase 2: Tripartite Mapping (15 mins):** Apply the theory they know to their verdicts.
  *   **Phase 3: The Gaps & Theory Pivot (15 mins):** Introduce scalar validity and right-waiving.

  ## 4. The Debrief: Mapping Verdicts to Theory

  **Step 1: The "Inessential" Lie (Round 2)**
  *   *Ask:* "Who marked 'Invalid' here? Why?"
  *   *Likely Verdict:* Some will say invalid because "lying breaks trust." Others will say valid because "no harm done."
  *   *Tripartite Conflict:* The **Informed** condition says consent is invalid if distorted by deception. But standard theory usually implies deception about *material* facts.
  *   *The Gap:* If the feature was inessential to value, why does the lie matter?
  *   *Theory Pivot:* This suggests consent isn't just about economic rationality (Will Theory). It's about the **relationship**. If consent is a *right-waiving* mechanism, lying to get the waiver is a violation of the authority structure, regardless of outcome. Or, introduce **Scalar Validity**: The consent wasn't *binary* invalid, it was *diminished*.

  **Step 2: The Small Penalty (Round 3)**
  *   *Ask:* "Standing in the corner is trivial. Was it coercion?"
  *   *Likely Verdict:* Most will say "Yes, technically," but "No, practically."
  *   *Tripartite Conflict:* The **Uncoerced** condition defines coercion as making refusal worse than the pre-existing baseline. Standing is worse than sitting. Therefore, it is coercion. Therefore, consent is invalid.
  *   *The Gap:* If *any* negative consequence for refusal makes consent invalid, almost no consent is valid (e.g., "If you don't sign this lease, you remain homeless").
  *   *Theory Pivot:* This is the strongest entry point for **Scalar Validity**. Pressure exists on a spectrum. The tripartite account treats coercion as a switch (on/off). Your intuitions treated it as a volume knob. We need a theory that accounts for *degrees* of voluntariness.

  **Step 3: The Proxy (Round 4)**
  *   *Ask (to Student B):* "You gained tokens (hopefully). Did A consent *for you*?"
  *   *Likely Verdict:* B will likely say, "No, that wasn't my consent." Even if A acted in B's best interest.
  *   *Tripartite Conflict:* A was Competent. A was Informed. A was Uncoerced. But the consent was void.
  *   *The Gap:* The Tripartite account focuses on the *state of the agent*. It misses the **Holder of the Right**.
  *   *Theory Pivot:* Use this to introduce the **Right-Waiving Account**. Consent is moral magic because it waives a claim-right *you* hold against others. A cannot waive B's right. This explains why Proxy consent fails even if A is rational and uncoerced.

  ## 5. Honest Prediction of Failure Modes

  **1. The "It's Just a Game" Defense**
  *   *What will happen:* In Round 3 (Coercion), a student will say, "I didn't really care about standing in the corner, so I wasn't coerced." They will conflate *subjective feeling* of pressure with the *structural* definition of coercion.
  *   *Mitigation:* In the debrief, ask: "If I threatened to shoot you, you'd refuse. If I threaten to make you stand, you comply. The only difference is the magnitude of the threat. Does that mean your 'will' was free in one and not the other, or that the *legitimacy* of the threat changed?" Force them to separate internal feeling from external constraint.

  **2. Time Compression**
  *   *What will happen:* The rounds will drag. Students will debate the rules *during* the round.
  *   *Mitigation:* Be a tyrant about the clock. Use a visible timer. If they debate the rules, say, "Record your objection on the sheet, we will adjudicate in the debrief. Decide now."

  **3. The Proxy Round Ambiguity**
  *   *What will happen:* Student A will ask Student B, "Is this okay?" before deciding. This turns it back into direct consent.
  *   *Mitigation:* Explicitly forbid communication in Round 4 instructions. "A decides silently. B is bound by the outcome."

  ## 6. The Missing Feature: Consequences Over Time

  **What the Activity Cannot Reproduce:**
  The game is **atomic**. Round 1 has no effect on Round 2 (other than token count). Real consent (sexual, medical, contractual) is **relational and temporal**.

  **The Discussion Point:**
  In the final 5 minutes, you must supply this missing layer.
  *   *Say:* "In this game, if you consented to a lie in Round 2, you could simply refuse Round 3. In real life, consent creates a **history**. If you consent to a small coercion now, you signal that you are the *kind of person* who can be coerced. The counterparty learns they can increase the pressure in Round 4."
  *   *The Lesson:* The Tripartite account evaluates a single moment in time. It fails to account for **precedent**. Validity is not just about the current transaction; it is about the integrity of the relationship over time. This is why "scalar validity" matters: a slightly compromised consent today erodes your authority to refuse tomorrow.

  **Summary for the Instructor:**
  Your goal is not to prove the Tripartite account "wrong," but to show it is **insufficiently granular**. The game generates the friction; the debrief provides the vocabulary. Let them feel the unease of the "inessential lie" and the "small threat" first. Their discomfort is the data.
