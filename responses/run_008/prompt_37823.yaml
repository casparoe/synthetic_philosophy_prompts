      *Missing Feature:* The prompt asks specifically about "consequences over time." I need to highlight that the game is atomic (one-off), whereas real consent is often relational/temporal.

  8.  **Final Review against Constraints:**
      *   16 students? Yes.
      *   90 mins? Yes.
      *   Movable chairs? Use for pairing.
      *   No real money/IT? Yes (paper tokens).
      *   Tripartite account mapped? Yes.
