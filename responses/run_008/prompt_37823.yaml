      *   Honest failure modes? Yes.

  9.  **Constructing the Output:** (Proceeding to generate the response based on these thoughts). *Make sure the tone is helpful for a colleague.* *Ensure the "Proxy" expectation is noted.* *Ensure the "Inessential Deception" is highlighted.*

