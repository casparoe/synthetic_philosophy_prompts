      *(Self-Correction on Failure Modes)*: The biggest risk is the "It's just a game" dismissal. I need to advise the instructor on how to mitigate that (make the stakes socially real, e.g., public tally).

      *(Final Polish)*: Check the timing. 10 mins per round is tight if they debate. I will structure it as: Instruction (2 mins), Decision (3 mins), Tally (2 mins), Transition (3 mins). Total 40 mins for game. 50 mins for debrief.

