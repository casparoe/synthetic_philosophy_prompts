      *Discussion within rounds:* 5 mins each (20 mins total).
      *Final Debrief:* 45 mins.
      *Actually, better to do all rounds fast, then one big debrief.*
      *Revised Timeline:*
      0-10: Setup & Stakes.
      10-50: The 4 Rounds (10 mins each including decision + quick note).
      50-90: Deep Debrief.

      *Refining the "Small Penalty":* The definition of coercion is "making refusal worse than the pre-existing baseline." If the baseline is "keep your token," and the offer is "trade for 2, or lose 1," refusal makes you worse off (-1 vs 0). If the offer is "trade for 2, or get nothing," refusal is status quo. I need to make sure the students *feel* the pressure without it being a blatant threat.
      *Idea:* "Participation points." If you don't trade, you don't get a participation stamp. That's a penalty for refusal. Is it coercion?

      *Refining "Inessential Deception":* "This chocolate is dark" (It's milk). Does it matter?
