      *   **Goal:** An activity where students *experience* the hard cases before theory is re-applied. They need to generate verdicts on validity.
      *   **Mechanism:** Staged-decision game (market/clinic), token stakes, rounds manipulating specific conditions (Information, Coercion, Competence).
      *   **Specific Requirements:**
          *   Deception about an "inessential" feature.
          *   Small penalty for refusal (test magnitude vs. kind).
          *   Proxy round (one consents for another).
          *   Setup/Materials (no real money/IT).
          *   Rules/Payoff scheme.
          *   Timeline (90 mins).
          *   Debrief (map to tripartite account, identify gaps, introduce scalar validity/right-waiving vs. will-expression).
          *   Honest prediction of failure modes.
          *   Identify missing feature (consequences over time).

  2.  **Deconstruct the Activity Design:**
      *   *Constraint:* 16 students is a bit large for a single simultaneous negotiation but small enough for groups. Let's split them into pairs or small groups to maximize engagement, or keep them as a whole class "market." A whole-class market is easier to control for a 90-minute session. Let's go with a "Laboratory of Transactions" model where the Instructor is the "Bank/Experimenter" and students are "Agents."
      *   *Currency:* "Ethics Credits" (EC). Can be exchanged for something trivial but desirable at the end (e.g., choice of essay topic, 5 mins off class time, candy, or just bragging rights). Let's use candy/chocolate as immediate tangible stakes, plus a "Course Advantage" token for the highest scorer.
      *   *Structure:* 5 Rounds.
          1.  Baseline (All conditions met).
          2.  Information (Deception on inessential feature).
          3.  Coercion (Small penalty for refusal).
          4.  Competence/Proxy (Consenting for another).
          5.  Scalar/Pressure (Accumulated pressure).
      *   *Wait, the prompt asks for rounds manipulating exactly one condition.*
          *   Round 1: Control (Valid).
          *   Round 2: Information (Deception).
          *   Round 3: Coercion (Threat/Penalty).
          *   Round 4: Competence/Proxy (The tricky one).
      *   *Time:* 90 mins.
          *   Intro: 10 mins.
          *   Rounds (4 x 10 mins): 40 mins.
          *   Debrief: 40 mins.
      *   *Materials:* Paper slips, pens, candy/tokens, whiteboard.

  3.  **Drafting the Rounds (Iterative Process):**
      *   *Round 1 (Baseline):* "Trade 1 token for 2 tokens." Simple. Everyone does it. Valid.
      *   *Round 2 (Information):* "Trade 1 token for a wrapped box worth 2 tokens." (Deception: Box actually contains 1 token or nothing? No, needs to be deception about *feature*, not value necessarily. Let's say "Trade 1 token for a specific candy bar." It's actually a different flavor. Is flavor essential? Students debate.)
      *   *Round 3 (Coercion):* "Trade 1 token for 2 tokens. If you refuse, you lose 1 token." (Baseline threat vs. Offer). This tests the "make refusal worse than baseline" definition.
      *   *Round 4 (Proxy):* Pair students up. Student A decides for Student B's tokens. (Competence/Authority).
      *   *Refinement:* The prompt asks for *small penalty for refusal*. So Round 3 needs to be subtle. "If you don't trade, you sit out the next round."
      *   *Refinement on Proxy:* This doesn't fit Informed/Uncoerced/Competent neatly. It tests *Authority*. The prompt acknowledges this ("none of the three conditions obviously applies there"). Good.
      *   *Refinement on Deception:* Needs to be about an "inessential" feature. "This token is red" (it's blue). Does color matter?

  4.  **Developing the Payoff Scheme:**
      *   Start with 5 tokens each.
      *   Tokens = Entry into a raffle for a prize (e.g., exemption from one discussion leading role) or just candy. Let's go with Candy + "Homework Pass" for the top 3.
      *   This creates *just enough* stakes to care, but not enough to cause genuine distress.

  5.  **Drafting the Debrief:**
      *   Need to map verdicts to the Tripartite Account.
      *   *Gap 1:* The "Inessential Deception." If they say it's invalid, the "Informed" condition is too broad. If valid, why does deception feel icky?
      *   *Gap 2:* The "Small Penalty." If they say it's coercion, is *any* pressure coercion? If not, where is the line? (Scalar validity).
      *   *Gap 3:* Proxy. Who holds the right being waived?
      *   *Theory Pivot:* Move from "Will Theory" (did they mean it?) to "Right Waiving" (did they have the authority?) or Scalar (how valid was it?).

  6.  **Predicting Failure Modes:**
      *   *Gaming the system:* Students might collude.
      *   *Cynicism:* "It's just a game, nothing matters."
      *   *Confusion:* Instructions unclear.
      *   *Time:* Debrief eats the clock.
      *   *Missing Feature:* Time/Consequences. In the game, the consequence is immediate. In real life (sex, medical, contracts), consequences unfold.

  7.  **Fleshing out the Details (Writing the Response):**
      *   *Tone:* Professional, pedagogical, precise.
