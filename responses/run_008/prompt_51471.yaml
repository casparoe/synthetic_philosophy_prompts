  *(Self-Correction on "Truth"):* In philosophy, "false" is strong. Better to say "rejected by standard liberal theory" or "overbroad." I will use precise language there.

  *(Refining the "Radical" end):* The most radical reading is that *any* negative feeling stops the right. That leads to a heckler's veto. I need to make sure that's clear.

  *(Refining the "Teacher's Intent"):* The teacher likely meant a mix of Risk and Objective Harm, but used it to shut down debate. I should point out the rhetorical function.

