answer: |-
  # Session Plan: The Sunk Cost Fallacy (50 Minutes)

  **Goal:** Move students from a rote definition ("ignore past costs") to a nuanced application ("ignore past costs *unless* they signal identity or information").
  **Audience:** First-year critical thinking (novice decision theory).
  **Instructor:** Second-year decision theory student (you).

  ## 1. Sequence & Timing

  | Time | Segment | Activity & Content |
  | :--- | :--- | :--- |
  | **00–05** | **The Hook (The Rule)** | **Example:** The Concert Ticket (Snowy Night).<br>**Task:** Quick poll: "Do you go?" Establish the textbook definition: *Rational choices depend only on future costs and benefits.*<br>**Why:** You need a low-cognitive-load baseline. Everyone knows this example. It locks in the standard view before you complicate it. |
  | **05–20** | **The Carrying Example (The Nuance)** | **Example:** The Semester-Long Group Project (see criteria below).<br>**Task:** Present a scenario where the project is failing. Ask: "Quit or Finish?"<br>**Shift:** Introduce the three "Hard Ideas":<br>1. **Information:** Quitting destroys data about your own resilience.<br>2. **Identity:** Quitting signals "unreliable" to future partners.<br>3. **Prediction:** *You* should ignore sunk costs, but when predicting *others*, expect them to care (strategic rationality). |
  | **20–35** | **Misconception Drill** | **Task:** Present three statements. Students identify which are valid critiques vs. misconceptions.<br>**Focus:** Distinguish between *economic* sunk costs (money) and *psychological/strategic* sunk costs (reputation).<br>**Why:** This is where you defuse the "Mic Drop" misconception by showing context matters. |
  | **35–45** | **Synthesis & Limits** | **Task:** Draw the boundary. When is the fallacy *actually* a fallacy? (When past cost is the *only* reason).<br>**Explicit Exclusion:** State clearly what you are *not* covering (see Section 4).<br>**Why:** Prevents over-correction. You don't want them thinking sunk costs *always* matter. |
  | **45–50** | **Closing Assessment** | **Task:** Pose the Closing Question (see Section 5).<br>**Exit Ticket:** Students write one sentence answering it. |

  ## 2. The Carrying Example: Criteria & Recommendation

  Do not use the Concert Ticket for the whole arc. It is too clean; it is hard to make a defensible case for sitting through a blizzard unless you invoke extreme identity ("I am a Superfan"), which feels like an outlier.

  **Recommended Example:** "The Failing Startup/Project."
  *Scenario:* You and two partners have spent $5,000 and 3 months building an app. It's buggy, and early users are churning. You have enough budget for one more month of development.

  **What this example MUST have:**
  1.  **Irreversible Past Cost:** The $5k and 3 months are gone regardless of the decision.
  2.  **Uncertain Future Payoff:** The next month *might* fix it, might not.
  3.  **Signaling Mechanism:** There must be an audience (investors, future employers, or your own self-concept) that observes *completion vs. quitting*.
  4.  **Informational Value:** Continuing yields data (why did it fail?) that quitting destroys.

  **What this example MUST lack:**
  1.  **External Coercion:** No one is holding a gun to your head. The pressure must be internal or reputational.
  2.  **Safety Risks:** Do not use examples involving physical safety (e.g., "I climbed halfway up the mountain"), as safety trumps rational choice calculus and muddies the water.

  ## 3. Misconception Map

  | Misconception | Where it is **Created** (Strawman) | Where it is **Defused** (Nuance) |
  | :--- | :--- | :--- |
  | **1. "Rational = Cut Losses"** | **00–05 mins:** During the Concert Ticket hook. Establish this as the "Textbook Rule." | **05–20 mins:** During the Project Example. Show that finishing can be rational if it preserves reputation or yields critical data. |
  | **2. "Only About Money"** | **05–10 mins:** Students naturally focus on the $5,000. | **15–20 mins:** When discussing Identity. Highlight that *time* and *effort* are sunk costs too, and the "cost" of quitting is reputational damage, not financial. |
  | **3. "The Mic Drop"**<br>*("Stop throwing good money after bad!")* | **20–30 mins:** Students will want to use this phrase to win arguments. | **35–45 mins:** Frame this as a rhetorical tool, not a logical proof. Explain that using this phrase shuts down inquiry into *why* someone is continuing (e.g., are they signaling commitment?). |

  ## 4. What to Explicitly Refuse to Cover

  You have 50 minutes. To protect the nuance, you must explicitly tell students what is **out of scope**. Put this on the board at minute 35.

  1.  **Formal Expected Utility Calculus:** No equations. We are doing critical thinking, not math.
  2.  **Deep Psychology:** We are not diagnosing *why* people feel loss aversion (brain chemistry), only how to evaluate the *reasoning*.
  3.  **Moral Obligation:** We are not discussing whether you *owe* it to your partners to finish. We are discussing whether it is *instrumentally rational* for your goals.

  ## 5. Closing Question

  Do not ask "What is the sunk cost fallacy?" (Tests memory).
  Do not ask "Is it ever okay to honor sunk costs?" (Too binary).

  **Ask this:**
  > "Under what specific conditions does ignoring a sunk cost become the *irrational* choice?"

  **Why:** This forces them to articulate the exception (Information/Identity/Strategy) rather than the rule. It confirms they understand the fallacy is a **strong default**, not a **theorem**.

  \answer{Cut-Losses-Dogma}
