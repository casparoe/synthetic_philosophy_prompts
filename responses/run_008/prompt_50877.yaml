  I'm a software engineer with zero philosophy bacground, but I keep bumping into this Dennett idea that Darwin and Turing made basically the same move, which he calls a "strange inversion of reasoning" — before Darwin everyone assumed you need a mind to get design, and he flipped it so design bubbles up from mindless selection, and Turing did the equivalent for computation: a machine can do arithmetic perfectly without knowing what arithmetic is. I want you to restate the whole position — both inversions, plus the slogan that goes with them, competence without comprehension — in the vocabulary I actually use day to day: objective functions, search spaces, hill climbing, compilers, layers of abstraction, emergent behavior in complex systems, that kind of thing. Do it as faithfully as you can, and then give me the residue report: which parts of Dennett's claim map cleanly onto stuff I already know, which parts you had to distort to make them fit, and whether anything he's saying has no counterpart in my vocabulary at all. My working theory is that this is just emergent behavior with good PR — impressive outputs from dumb processes, which anyone who's watched a genetic algorithm or a gradient descent run has already internalized — and there's nothing more to it. But I have a nagging feeling the philosophers think they're claiming something stronger, maybe that minds don't need to be anywhere in the pipeline, including our own minds. So: is that leftover bit something my vocabulary genuinely can't express, or is it less clear than it sounds?
