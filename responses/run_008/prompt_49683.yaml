answer: |-
  This is a classic "dirty hands" problem, but you've correctly identified that the math (1 violation vs. 6 violations) isn't the only thing at stake. You are wrestling with the difference between **Act Utilitarianism** (minimize harm in this specific instance) and **Rule-Based Ethics** (maintain the integrity of the system that prevents harm).

  Here is the ethical breakdown, the theory you are looking for, and the actionable conclusion.

  ### The Theory: Rule Utilitarianism meets Social Contract Theory

  You are currently stuck because you are oscillating between a rigid **Kantian Deontology** ("I must never break the rule") and an **Act Utilitarian** calculation ("6 violations are worse than 1"). Both feel unsatisfying here. Kantism feels self-defeating; Act Utilitarianism feels dangerous (the slippery slope you mentioned).

  The framework that resolves this is **Rule Utilitarianism** filtered through **Social Contract Theory**.

  **1. Rule Utilitarianism:**
  Unlike Act Utilitarianism, which asks "What creates the best outcome *right now*?", Rule Utilitarianism asks "Which *rule*, if generally followed, creates the best outcome?"
  *   **The Rule:** "No housemate snoops on another's devices unilaterally."
  *   **The Exception:** If you allow an exception for "90% suspicion," you effectively destroy the rule, because everyone's suspicion is subjective (as you noted with the 70% housemate).
  *   **The Optimization:** The rule that maximizes utility isn't "Never snoop." It is "No *unilateral* snooping." The utility-maximizing rule allows for privacy audits *if and only if* they are authorized by the collective.

  **2. Social Contract Theory:**
  Your house rule is a social contract. You have all surrendered a small amount of absolute freedom (the freedom to snoop if you wanted to) in exchange for security (the guarantee that no one will snoop on you).
  *   **The Breach:** The router guy has already breached the contract. He has taken the benefit of the house (living there) while violating the core term (privacy).
  *   **The Enforcement:** In a social contract, enforcement rights do not revert to the individual; they revert to the **collective**. If one person breaks the law, you don't get to become a vigilante; you activate the judicial process. In your house, the "judicial process" is the house meeting.

  ### Why the Asymmetry Exists

  You asked: *"Shouldn't six privacy violations be worse than one?"*

  In a vacuum, yes. But in a system, **Unilateral Violation** and **Systemic Violation** are different currencies.
  *   **His Violations:** He is violating privacy *within* the system while pretending to abide by it. This is corrosion.
  *   **Your Proposed Violation:** If you snoop unilaterally, you are not just violating privacy; you are **dismantling the enforcement mechanism.**

  If you snoop, you establish a precedent that *individual suspicion* justifies *individual action*. That precedent is far more dangerous than his spying. His spying is a crime; your unilateral snooping changes the constitution of the house from a "trust-based collective" to a "mutual surveillance state."

  The asymmetry exists because his action is a **betrayal of trust**, while your action (if done alone) would be a **collapse of governance**.

  ### The Missed Clause

  You quoted the rule: *"Nobody ever goes through anyone else's stuff... if you have a problem with someone you bring it to a house meeting, you don't investigate on your own."*

  You are focusing on the first half ("Nobody goes through stuff") and ignoring the second half ("Bring it to a house meeting").
  *   **Your current plan:** Investigate on your own.
  *   **The rule's prescription:** Bring it to the meeting.

  You feel you need the laptop to *prove* it before the meeting. But under Contractualism, **loss of trust is itself a remedy.** If you are 90% sure, and you present your reasoning to the house, the group can decide that *your suspicion* is sufficient grounds for sanctioning him, regardless of whether you have the "smoking gun" from his hard drive.

  If the house votes to kick him out or demand he leave based on your 90% certainty, that is a **collective enforcement action**. It preserves the rule because the privacy violation (if one occurs) is now sanctioned by the group, not initiated by an individual.

  ### The Verdict

  **Ethically, do not go through the laptop on your own.**

  Here is the path that satisfies the ethical constraints:

  1.  **Do not violate the "Unilateral" constraint.** If you snoop alone, you validate the idea that individuals are the judges of when privacy rights can be suspended. This leads to the slippery slope you fear.
  2.  **Activate the Contract.** Call the house meeting. State clearly: "I have strong evidence (90% certainty) that the router admin is intercepting traffic. I cannot share the specific technical proof without compromising security, but the pattern is X, Y, Z."
  3.  **Collective Authorization.** Ask the house: "Given this threat to our collective privacy, do we authorize a check of his device, or do we ask him to leave?"
      *   If the house votes to check his laptop, **you can then look.** It is no longer a privacy violation; it is a sanctioned audit. The "currency" changes from "snooping" to "investigation."
      *   If the house votes to ask him to leave, the problem is solved without you touching his laptop.

  ### Why this works for your Ethics Course

  This approach allows you to remain a "rules person" without being self-defeating.
  *   **Kantian respect:** You are treating the housemates as ends-in-themselves by involving them in the decision, rather than using them as pawns in your secret investigation.
  *   **Utilitarian outcome:** You stop the spying (likely) without establishing a precedent that *you* get to decide when rules apply.
  *   **Contractual integrity:** You are enforcing the pact, not breaking it. The suspect broke the pact first; the group is simply administering the consequence.

  **Summary:** The rule forbids *unilateral* investigation, not *all* investigation. Keep your hands clean by moving the burden to the collective. If the house agrees the threat is real, they can authorize the search. Then, you aren't a hypocrite; you're an auditor.
