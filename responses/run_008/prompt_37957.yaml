  Here is the breakdown of your roommate's decision architecture, her predicted verdicts on the St. Petersburg game, and the test case to prove it.

  ### 1. The Verdicts on St. Petersburg
  Based on her history, here is what she will say when you offer the St. Petersburg game (SPG) at the three fee levels:

  *   **Entry Fee $10:** **ACCEPT.**
      *   *Why:* The loss is well below her "pain threshold" (she explicitly said losing $100 "wouldn't hurt"). The upside triggers her Powerball instinct (overweighting tiny probabilities of large gains). To her, this is $10 for entertainment with a dream attached.
  *   **Entry Fee $100:** **ACCEPT (Reluctantly).**
      *   *Why:* This is her boundary zone. In Observation 1, she accepted a 50% risk of losing $100. In Observation 5, she said losing $100 "wouldn't hurt." While the odds of profit in SPG at this fee are poor (you need 7 heads in a row just to double your money, ~0.8% chance), the structure mimics the Powerball pool: a "sure" small loss for a tiny shot at a life-changing sum. Her lottery instinct edges out her risk aversion here.
  *   **Entry Fee $1,000:** **REJECT.**
      *   *Why:* This violates her Loss Threshold. In Observation 2, she rejected a gamble with a $10,000 downside (scaled version of Obs 1). In Observation 5, she noted that losing $200 "would actually hurt." $1,000 is deep into the "hurt" zone. No amount of infinite expected value overrides the visceral pain of a guaranteed $1,000 loss from her current reference point.

  ### 2. The Rule She Is Running
  She is not running **Diminishing Marginal Utility (Log Utility)**. A Log-utility agent would never play the Powerball (negative expected utility), yet she does.

  She is running **Prospect Theory with a Loss Threshold (Mental Accounting)**.
  *   **Prospect Theory:** She overweight tiny probabilities (Powerball) and is loss-averse (rejects the +$50 EV raffle).
  *   **Loss Threshold:** Her comment in Observation 5 is the key. She doesn't just weigh losses smoothly; she has a cognitive budget. Losses under ~$100 are coded as "costs" or "fun money." Losses over ~$200 are coded as "pain" or "harm." This explains why she accepts the +$10 gamble (loss $100) but rejects the +$50 raffle (loss $200), even though the raffle has higher expected value.

  ### 3. The Critical Test Case
  You mentioned a capped SPG, but that mostly tests how much she values the infinite tail. To separate **Standard Prospect Theory** (which integrates outcomes) from her specific **Loss Threshold/Mental Accounting** model, you need to test how she groups losses.

  **The Test:** Offer her **two simultaneous, independent raffles** versus the **single raffle** she already rejected.
  *   **Option A (The Original):** Pay $200 for one ticket. 50% chance to win $500 (Net: +$300 / -$200). *She already rejected this.*
  *   **Option B (The Test):** Pay $100 for **Ticket 1** AND $100 for **Ticket 2**. Each has a 50% chance to win $250 (Net per ticket: +$150 / -$100).
      *   *Total Economics:* Identical to Option A. Total cost $200. Total EV +$50.
      *   *The Prediction:*
          *   **Standard Prospect Theory:** She should **Reject**. PT assumes people integrate simultaneous gambles. The total risk exposure is still $200, and the loss aversion on the aggregate loss should still veto the gain.
          *   **Loss Threshold Model:** She should **Accept**. She evaluates each ticket separately. Since no *single* decision risks more than $100 (which "doesn't hurt"), she clears both.

  If she takes the two tickets but refused the single one, you have proven she uses **Mental Accounting with a Hard Loss Limit**, not just smooth loss aversion.

  ### 4. The TA's "Super-Divergent" Variant
  Your TA is referring to the **Menger Paradox** (or Super St. Petersburg).
  *   **The Setup:** In the standard game, payouts are $2^k$. Expected Utility for a Log-wealth agent is finite ($\sum \frac{1}{2^k} \ln(2^k)$ converges).
  *   **The Variant:** Payouts grow as $e^{2^k}$ (double exponential). Now, $\sum \frac{1}{2^k} \ln(e^{2^k}) = \sum \frac{1}{2^k} 2^k = \sum 1 = \infty$.
  *   **Does it cause trouble?**
      *   **For Log Utility:** Yes, it breaks the model. A Log-utility agent should be willing to pay *any* finite amount to play this game.
      *   **For Her Rule (Loss Threshold):** **No trouble.** Her decision is constrained by the *loss side* of the transaction (the entry fee), not just the utility of the gain. Even if the upside is "super-infinite," the pain of paying $1,000 is fixed and finite. If her threshold says "$1,000 loss hurts too much," she rejects the game regardless of how fast the payouts grow.
      *   **Implication:** If she rejects the Super-SPG at a $1,000 fee, it definitively kills the "Expected Utility" family of models (which focus on the gain side) and confirms that her behavior is driven by **Loss Aversion Constraints**.

  **Summary for your section:** She's a Prospect Theorist with a budget constraint. She'll play the cheap St. Petersburg games for fun, but the moment the entry fee crosses her "pain threshold," the infinite expected value becomes irrelevant.
