answer: |-
  Here is the decomposition and probability estimate you asked for.

  ### The Probability Estimate

  **0.65**

  This is my credence that the claim is true: *"A person who is currently guilty of the same wrong lacks standing to blame another person for it, such that their blame is normatively defective."*

  This number applies to the **general philosophical principle** in a standard bystander context. It is not the probability that your cousin was wrong in that specific moment (which is lower, due to the "victim" variable discussed below).

  ### The Decomposition

  To get to 0.65, I am treating this as a conditional probability chain. For the claim to be true, three distinct philosophical premises must hold.

  **1. The Ontology of Blame ($P_{ont} = 0.85$)**
  *   **The Question:** Is blame merely a *verdict* ("What you did was wrong") or is it a *demand* ("You owe me/the community an account")?
  *   **The Logic:** If blame is just a verdict about moral facts (like saying "2+2=4" or "That mushroom is poisonous"), then standing is irrelevant. Truth does not require permission. However, if blame is a normative transaction that alters relationships (imposing guilt, demanding apology, licensing sanction), it requires authority.
  *   **The Weight:** Contemporary moral philosophy (e.g., P.F. Strawson, R. Jay Wallace) heavily favors the relational view. Blame is a speech act that claims authority.
  *   **Contribution:** High confidence ($0.85$) that standing is a real category.

  **2. The Hypocrisy Defeater ($P_{hyp} = 0.80$)**
  *   **The Question:** Given that standing exists, is *hypocrisy* the specific key that unlocks it?
  *   **The Logic:** There are other ways to lose standing (e.g., if you coerced the person, or if you are blaming from a position of systemic oppression). However, hypocrisy is the paradigmatic defeater. The logic is that by committing the same wrong, you implicitly waive your commitment to the norm you are invoking. You cannot demand adherence to a rule you openly flout.
  *   **The Weight:** This is the strongest link in the chain. Most theories of standing agree that active, unrepentant hypocrisy negates the authority to demand compliance.
  *   **Contribution:** High confidence ($0.80$) that hypocrisy defeats standing.

  **3. The Temporal & Contextual Stability ($P_{ctx} = 0.95$)**
  *   **The Question:** Does the defect persist if the behavior stops, or if the blamer is the victim?
  *   **The Logic:**
      *   *Timing:* If your cousin had quit smoking five years ago, her standing would likely be restored. Standing tracks *current* commitment to norms. Since she *currently* smokes, the defeater is active. (Probability is high here because the prompt specifies "is guilty," implying present tense).
      *   *Victimhood:* This is the major variable. If the blamer is the *victim* of the specific act (e.g., secondhand smoke), they often retain standing despite hypocrisy. A thief can still demand not to be stolen from.
  *   **The Weight:** I am scoring this high for the *general claim* (assuming a bystander), but this is where the specific case diverges.
  *   **Contribution:** Very high confidence ($0.95$) that *active* guilt defeats standing in bystander cases.

  **Calculation:** $0.85 \times 0.80 \times 0.95 \approx 0.646$ (Rounded to **0.65**)

  ---

  ### The Victim Axis (Separate Bucket)

  You asked to factor in the "wronged party special license." This does not go into the main bucket; it is a **modifier** that applies to the specific scenario, not the general principle.

  *   **General Principle:** Hypocritical bystanders lack standing. (Probability ~0.65)
  *   **Specific Case:** Hypocritical *victims* often retain standing.

  If your cousin's roommate is blowing smoke into *her* specific living space or affecting *her* health, your cousin has a **grievance**. Grievance often trumps standing. You do not need clean hands to demand that someone stop hurting *you*.

  If we factor this into the specific Thanksgiving scenario, the probability that her blame was *defective* drops significantly, perhaps to **0.30**. She may be a hypocrite, but she is a *wronged* hypocrite, which grants a limited license to complain that a bystander would not have.

  ### Sensitivity Analysis

  **Which term moves the number the most?**
  $P_{ont}$ (The Ontology of Blame).

  If you convince me that blame is simply "identifying a moral error" rather than "holding someone accountable," the entire standing structure collapses. If blame is just a description of reality, then hypocrisy is irrelevant to the truth of the statement.

  **The Thought Experiment that shifts the credence:**
  *The Anonymous Note.*
  Imagine your cousin slips an anonymous note under the roommate's door: "Smoking inside is wrong and you should stop."
  *   **If this counts as blame:** Then standing is irrelevant. She successfully communicated the moral truth without claiming authority. (My probability drops toward 0.20).
  *   **If this does NOT count as blame:** Then blame inherently requires a relationship/authority. The face-to-face confrontation ("You are selfish!") is a demand for accountability, which requires standing. (My probability stays at 0.65).

  Most philosophers agree the note is *warning*, but the confrontation is *blame*. This supports the higher probability.

  ### Diagnosing the Disagreement

  You guessed the disagreement is about "whether standing is a real normative category or just sociology." You are close, but I would sharpen it.

  **Your Cousin (0.75 confidence she is right):**
  *   **Philosophical Mode:** **Moral Realism / Consequentialism.**
  *   **Her View:** The moral status of the *act* (smoking inside) is objective. It harms health. It is wrong. The truth value of "This is wrong" is independent of the speaker. To say otherwise is to commit the *Tu Quoque* fallacy (attacking the messenger).
  *   **Blind Spot:** She is treating blame as a *verdict* rather than a *relationship*. She thinks she is issuing a ruling, when she is actually asking for compliance.

  **The Person at the Table (0.75 confidence cousin is wrong):**
  *   **Philosophical Mode:** **Expressivism / Contractualism.**
  *   **Their View:** Blame is a social practice that relies on mutual recognition of norms. By smoking, your cousin has signaled that she does not regard the norm as binding. She cannot then turn around and bind someone else to it. It's not about the truth of the claim; it's about the *authority* to enforce it.
  *   **Blind Spot:** They might be ignoring the "Victim" exception. If the cousin is being harmed, the social contract allows her to defend her boundaries even if she violates them elsewhere.

  **Where the disagreement actually lives:**
  It is not about sociology vs. normativity. It is about **Agent-Neutrality vs. Agent-Relativity.**
  *   **Cousin:** Morality is Agent-Neutral. (Wrong is wrong, regardless of who says it).
  *   **Table:** Morality is Agent-Relative. (Who is speaking determines the normative force of the speech).

  **Verdict:** The table guest is philosophically more robust regarding the *nature of blame*, but your cousin might be practically more robust regarding the *right to protect her health* (the victim exception). The table guest won the argument on theory; your cousin might win on house rules.
