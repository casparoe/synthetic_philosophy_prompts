prompt: |-
  I write novels, and I have come to suspect that promise-breaking is the sharpest instrument I own for moving a reader's sympathies: the same act — a character not doing what she said she would — sometimes costs her the reader's affection and sometimes costs her nothing, and I would like to know what principle governs the difference. I have verdicts on a set of cases, drawn from scenes I have written or watched readers respond to, and I want to know what, if anything, they add up to.

  A woman promises her dying sister never to sell the family orchard; thirty years later, ruined, she sells it, and readers forgive her. A man promises, at gunpoint, to stay away from a town, and no reader thinks the promise binds him at all. A widow keeps a promise to her dead husband never to open the box of letters he left her, and when she opens it readers treat her as having betrayed him — even though he is dead, cannot be harmed, and will never know. By contrast, a character who solemnly vows to himself never to drink again and then drinks is pitied as weak, not condemned as a promise-breaker; the vow seems to bind no one. A mother makes her daughter promise never to put her in a home; keeping the promise grinds the daughter's life away, and readers feel the wrong lies with the mother for asking, not the daughter for complying or for chafing. And readers weigh the gravity of the asking: a promise made casually and forgotten is a flaw of memory; the same words after a formal undertaking are a stain.

  Is there a single account of why promises bind — reliance, the practice, the promisee's autonomy, something else — that delivers all of these verdicts on reader sympathy? In particular, I want to know whether the widow and the self-vow case, which look structurally alike, can both be saved, or which has to go. And since I invent these scenes rather than find them, tell me whether the readers' sympathies track the real ground of promissory obligation or only a narrative convention about what keeping one's word signals about character — because if the two can come apart, that is exactly the gap a novelist like me works in. As a test, tell me what your account predicts for a case I have not listed: a character explicitly released from a promise by its living beneficiary, who keeps it anyway at real cost. Do readers admire her, or find her rigid, and should the philosopher agree with them?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A novelist. They are sophisticated, analytical, and interested in the intersection of narrative craft and moral philosophy. They view "promise-breaking" as a tool for manipulating reader sympathy.
      *   **Goal:** They want a unified principle (an "account") that explains the varying reader reactions to specific cases of promise-breaking/keeping they've observed.
      *   **Specific Cases Provided:**
          1.  *Orchard:* Woman promises dying sister not to sell; sells later due to ruin. -> *Forgiven.*
          2.  *Gunpoint:* Man promises at gunpoint to stay away; breaks it. -> *Not bound.*
          3.  *Widow/Box:* Widow promises dead husband not to open letters; opens them. -> *Betrayal.*
          4.  *Self-Vow:* Character vows to self not to drink; drinks. -> *Pity/Weakness, not betrayal.*
          5.  *Mother/Daughter:* Mother makes daughter promise not to put her in a home; keeping it ruins daughter. -> *Wrong lies with Mother.*
          6.  *Formality:* Casual promise vs. Formal undertaking. -> *Memory flaw vs. Stain.*
      *   **Key Questions:**
          1.  Is there a single account (reliance, practice, autonomy, etc.) that fits all verdicts?
          2.  Specifically, how to reconcile the *Widow* (binding) vs. *Self-Vow* (not binding) cases? They look structurally similar (promisee is unavailable/non-existent vs. self).
          3.  Do reader sympathies track *real* moral obligation or *narrative convention*? (Crucial for a novelist).
          4.  **Test Case:** A character is *released* from a promise by the living beneficiary but keeps it anyway at real cost. Do readers admire or find rigid? Should the philosopher agree?

  2.  **Deconstruct the Cases (Moral Philosophy + Narrative Theory):**
      *   *Orchard (Necessity/Changed Circumstances):* Impossibility or extreme hardship overrides the promise. The "practice" of promising implies reasonable conditions.
      *   *Gunpoint (Coercion):* No valid obligation formed. Consent was voided.
      *   *Widow/Box (The Dead):* Why does this bind? It's not about reliance (he's dead). It's about *respect for the past self/relationship* and *symbolic fidelity*. It signals loyalty to the bond, not just the person.
      *   *Self-Vow (The Self):* Why doesn't this bind like a promise to others? It's treated as a goal or struggle, not a social contract. Breaking it is a failure of will, not a moral wrong against another.
      *   *Mother/Daughter (Toxic Obligation):* The promise itself was immoral/coercive. The daughter is a victim of the promise, not a villain for breaking it (or a martyr for keeping it).
      *   *Formality (Intent):* Signals the weight of the obligation.

  3.  **Evaluate Potential Accounts:**
      *   *Reliance Theory (Scanlon):* Focuses on harm caused to the promisee by reliance.
          *   *Fails:* Widow case (dead man can't rely). Self-vow (self relies, but treated differently). Orchard (sister can't rely, dead).
      *   *Practice/Rule Utilitarianism:* Promises exist to facilitate trust.
          *   *Fails:* Doesn't explain why breaking a promise to a dead person hurts trust (no one sees it usually) or why self-vows are different.
      *   *Autonomy/Will Theory:* Promises transfer rights.
          *   *Fails:* Dead people have no autonomy to hold rights.
      *   *Relationship/Identity Account:* Promises constitute who we are in relation to others.
          *   *Stronger:* Explains the Widow (loyalty to the bond). Explains the Daughter (the bond was toxic). Explains the Self-Vow (internal conflict, not relational).

  4.  **Addressing the Core Tension (Widow vs. Self-Vow):**
      *   *Why the difference?* The Widow case is about *memory and legacy*. The dead husband exists as a narrative presence. Breaking the promise erases his agency/wish. The Self-Vow is about *discipline*.
      *   *Narrative Convention:* Readers treat the dead as "present" in stories (ghosts, memories). They treat the self as "fluid."
      *   *Philosophical Ground:* Obligations to the dead are about *surviving relationships*. Obligations to self are about *self-constitution*.
      *   *Verdict:* They are structurally different. One is relational (even if one party is gone), one is intrapersonal.

  5.  **Addressing "Real Ground" vs. "Narrative Convention":**
      *   This is the novelist's gold mine.
      *   *Truth:* They often diverge. Real morality is messy; narrative morality needs clarity for emotional payoff.
      *   *Example:* In reality, breaking a promise to a dead person might be rational. In a story, it's betrayal because it severs the thematic link.
      *   *Advice:* Use the gap. If you want tragedy, make the character follow the "real" ground but suffer the "narrative" judgment, or vice versa.

  6.  **Developing the Test Case (Released but Keeps):**
      *   *Scenario:* Beneficiary says "You're free." Promisor says "No, I promised."
      *   *Reader Reaction:* Likely admiration for integrity, *unless* the cost is disproportionate (rigidity/stubbornness).
      *   *Philosophical View:* If the promisee releases the promisor, the obligation is usually dissolved (it was their right). Keeping it becomes supererogatory (above and beyond) or fetishistic.
      *   *Prediction:* Readers admire if the cost is noble sacrifice. Readers find rigid if the cost hurts others or serves no purpose.
      *   *Philosopher's Agreement:* Depends on the theory. Will Theory says obligation is gone. Reliance Theory says maybe reliance was created anyway.

  7.  **Drafting the Response:**
      *   *Tone:* Intellectual, respectful, collaborative (philosopher to novelist).
      *   *Structure:*
          1.  Acknowledge the insight (promise-breaking as an instrument).
          2.  Propose the Unifying Principle: **The Relational Integrity Account** (mixed with Narrative Presence).
          3.  Analyze the Specific Cases through this lens.
          4.  Tackle the Widow vs. Self-Vow paradox.
          5.  Address the "Real Ground vs. Convention" question (The Novelist's Gap).
          6.  Solve the Test Case.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "it's about relationships." I need to explain *why* the dead count as a relationship but the self doesn't count as a "promisee" in the same way.
      *   *Idea:* The dead represent a *fixed past* that defines the present. The self represents a *fluid future*. Breaking a promise to the dead rewrites history. Breaking a promise to the self admits change.
      *   *Refining the Test Case:* If the promisee releases the promisor, the *social* obligation is gone. If the promisor keeps it, it's no longer about obligation, it's about *identity*. "I am the kind of person who keeps this." Readers like integrity, hate stubbornness. The line is whether the keeping serves a value or just a rule.

  9.  **Final Polish:** Ensure the distinction between moral philosophy (what *should* bind) and narrative psychology (what *feels* binding) is clear, as the user specifically asked about the gap between them. (This is the "gap a novelist works in").

  10. **Final check against constraints:** Did I answer the specific question about the Widow/Self-Vow? Yes. Did I answer the Test Case? Yes. Did I address the Real vs. Convention question? Yes.

  *(Self-Correction on the Widow/Self-Vow)*: Wait, the prompt asks if they can *both be saved* or if one has to go. I should argue they can both be saved but require different explanations. The Widow case is about *fidelity to a bond*. The Self-Vow is about *self-governance*. They are different categories of obligation.

  *(Self-Correction on the Test Case)*: Philosopher's view: If the promisee releases, the obligation is typically void (Will Theory). So keeping it is optional. Reader view: Admiration for integrity *unless* it becomes pathological.

  Let's synthesize this into a coherent essay-style response.cw
answer: |-
  You have identified the precise lever that moves the moral machinery of fiction. The variance in reader sympathy you describe is not random; it is the result of a collision between two distinct systems of evaluation: **moral philosophy** (what actually binds us) and **narrative psychology** (what signals character to an audience).

  To answer your primary question: No single philosophical account (Reliance, Practice, or Will) perfectly delivers all these verdicts on its own. However, a hybrid account I will call **Relational Integrity** comes closest to explaining the moral ground, while **Narrative Presence** explains the reader's sympathy.

  Here is the breakdown of your cases, the resolution of the Widow/Self-Vow paradox, the truth about the "gap" you work in, and the verdict on your test case.

  ### 1. The Unifying Principle: Relational Integrity
  The principle that governs when a promise binds is not merely the words spoken, but the **status of the relationship** the promise sustains.

  *   **The Orchard (Necessity overrides Fidelity):** The promise was to sustain a relationship (the sister's memory/legacy). Selling the orchard due to ruin is not a betrayal of the sister, but a submission to reality. Readers forgive because the *intent* of the promise (care) was overwhelmed by necessity. The relationship is not severed; it is mourned.
  *   **The Gunpoint (Void Consent):** No relationship of trust was ever established. Coercion voids the "practice" of promising. There is no moral debt.
  *   **The Mother/Daughter (Toxic Obligation):** Here, the promise itself violates the relationship. A promise that demands the destruction of the promisee's future is coercive, even without a gun. Readers side with the daughter because the mother weaponized the promise to extend control beyond death/reason. The "wrong" is the asking, not the breaking.
  *   **The Formality (Intent Signals Weight):** Casual words do not invoke the "practice" of promising. Formal undertakings signal an intentional transfer of right. This tracks the *Will Theory*: you must intend to be bound.

  ### 2. The Paradox: The Widow vs. The Self-Vow
  You ask if the Widow (binding) and Self-Vow (non-binding) cases can both be saved. **They can, but only if we admit they are structurally different kinds of obligation.**

  *   **The Widow (The Dead as Witness):** Philosophically, obligations to the dead are puzzling (they cannot rely, they have no autonomy). But narratively, the dead are **fixed points**. A promise to a dead person is a promise to *history*. Breaking it rewrites the past and erases the agency the deceased once had. It signals a severing of the bond that defined the survivor's identity. Readers feel betrayal because the character is discarding the "ghost" that anchors them.
  *   **The Self-Vow (The Self as Project):** A vow to oneself is not a contract; it is a **goal**. The self is fluid. When you break a vow to yourself, you are not betraying a "other"; you are failing to govern your own impulses. This is why readers feel *pity* (for the weakness) rather than *condemnation* (for the betrayal). There is no external witness to hold the debt.

  **The Principle:** Promises bind when they sustain a relationship with an **external other** (even a dead one). They do not bind with the same moral weight when the relationship is **intrapersonal**. The Widow case is about *loyalty*; the Self-Vow case is about *discipline*. Readers punish disloyalty; they pity lack of discipline.

  ### 3. Real Ground vs. Narrative Convention
  You ask whether reader sympathies track the real ground of obligation or narrative convention. **They track convention, and that is exactly the gap you work in.**

  In moral philosophy (specifically the *Will Theory*), if a promisee releases a promisor, the obligation dissolves. In *Reliance Theory*, if no harm is caused, the obligation is minimal. But in narrative, a promise is a **symbolic contract with the reader**.

  *   **Real Ground:** If a dying sister says, "If you starve, sell the orchard," and you sell it, you have done no wrong.
  *   **Narrative Convention:** If you sell the orchard, you have broken the *image* of the devoted sister.

  **The Novelist's Gap:**
  If you want to write a tragedy, make a character follow the *Real Ground* (e.g., the Widow opens the box because the letters contain vital history) but suffer the *Narrative Judgment* (she feels guilt, ghosts haunt her, society shuns her).
  If you want to write a redemption arc, make a character follow the *Narrative Convention* (keep the promise despite the cost) and reveal the *Real Ground* was actually on their side (the promise protected something greater).

  Readers do not want pure philosophy; they want **coherence of character**. A promise kept signals stability; a promise broken signals change. Whether that change is "growth" or "betrayal" depends on whether the reader believes the relationship was worth preserving.

  ### 4. The Test Case: Released but Keeping
  **The Case:** A character is explicitly released from a promise by its living beneficiary, but keeps it anyway at real cost.

  **The Prediction:**
  *   **Reader Sympathy:** This splits based on **motivation**.
      *   *Admiration:* If the character keeps the promise to honor a value *beyond* the transaction (e.g., "I made a vow to my own integrity, not just to you"), readers admire them. It signals noble rigidity.
      *   *Rigidity:* If the character keeps the promise merely to follow the rule, ignoring the beneficiary's current wishes, readers find them obstinate or morally fetishistic. It signals a lack of humanity.
  *   **Philosophical Verdict:** The philosopher should generally **disagree** with the obligation. Under the *Will Theory*, the promisee owns the right you created. If they return it, the debt is gone. Keeping it is **supererogatory** (good, but not required). However, if keeping the promise harms third parties or the promisee themselves (e.g., "I promised to protect you, you say you don't need it, I protect you anyway"), it becomes paternalistic and morally suspect.

  **The Nuance for the Novelist:**
  To make this scene work, the beneficiary's release must be tested.
  *   *Scenario A:* Beneficiary says, "You're free," lightly. Character keeps promise. -> **Admiration.** (The character sees deeper commitment than the beneficiary).
  *   *Scenario B:* Beneficiary says, "I beg you, let me go, this promise hurts me." Character keeps promise. -> **Condemnation.** (The character values the *promise* over the *person*).

  ### Summary for your Craft
  The principle governing your instrument is **Fidelity to the Bond vs. Fidelity to the Self.**

  1.  **Promises to Others (Living or Dead):** Bind because they constitute a relationship. Breaking them is betrayal unless the relationship itself was toxic (Mother/Daughter) or impossible (Orchard).
  2.  **Promises to Self:** Bind only as measures of willpower. Breaking them is weakness, not sin.
  3.  **The Gap:** Reader sympathy tracks the *symbolic weight* of the promise, not the *logical validity*. You can exploit this by having characters be logically right but symbolically guilty, or vice versa.

  In your test case, if the character keeps the promise after release, they are no longer serving the promisee; they are serving their own self-conception. Readers will love them for it only if that self-conception is nobler than the release they were offered. If it is merely stubbornness, they become a villain of rigidity.
