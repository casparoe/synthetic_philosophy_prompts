  **DRAFT JOINT STATEMENT ON BELL'S THEOREM AND QUANTUM NONLOCALITY**

  **To:** The Funding Committee & Project Facilitators
  **From:** [Physicist A] & [Physicist B]
  **Date:** [Session 1]
  **Subject:** Baseline Agreement and Map of Disagreement

  ### 1. Agreed Claims

  We, the undersigned, agree on the following statements regarding the mathematical, experimental, and terminological status of Bell's Theorem as of 2024. These claims form the common ground upon which our disagreement rests.

  1.  **The Mathematical Result:** Bell's Theorem demonstrates that no physical theory satisfying the condition of *Bell Locality* (often expressed as a factorizability condition on joint probabilities) can reproduce all the statistical predictions of quantum mechanics for entangled systems.
  2.  **Experimental Status:** Experiments testing Bell inequalities have been performed with increasing rigor since the 1970s. We agree that the "locality loophole" and the "detection loophole" have been closed simultaneously in definitive experiments (notably circa 2015), and that the "freedom-of-choice" loophole has been constrained using distant astronomical sources. While no experiment is strictly loophole-proof in perpetuity, the empirical evidence strongly violates Bell inequalities and aligns with quantum mechanical predictions.
  3.  **No-Signalling:** We agree that quantum mechanics respects *Signal Locality*. It is impossible to use entanglement to transmit information faster than the speed of light. Any claim that Bell's theorem permits superluminal communication is false, regardless of one's interpretation of the underlying ontology.
  4.  **Invalid Popular Framings:** We agree that the following common journalistic descriptions are incorrect and should be avoided:
      *   "Bell proved that hidden variables are impossible." (Hidden variables are possible in non-local theories, e.g., Bohmian mechanics.)
      *   "Bell proved that Einstein was wrong about everything." (Einstein was correct that quantum mechanics respects no-signalling.)
      *   "The particles communicate instantaneously." (This implies a signal; the disagreement is about whether a non-signal causal influence exists.)
  5.  **Terminological Distinction:** We agree that the word "Locality" is overloaded. It is used to mean at least three distinct things: (a) No superluminal signalling (Signal Locality), (b) No superluminal causal influence (Ontological Locality), and (c) The specific statistical factorizability condition used in Bell's derivation (Bell Locality). Confusion arises when these are used interchangeably.

  ### 2. Map of Disagreements

  While we agree on the math and the data, we disagree on the ontological implications. The following table outlines the residual disagreements. Each position is phrased to be acceptable to the proponent of that view.

  | Issue | Position A (Nonlocality is Inevitable) | Position B (Locality Can Be Saved) |
  | :--- | :--- | :--- |
  | **The Cost of Bell's Theorem** | Bell's theorem forces us to abandon Ontological Locality. Nature contains genuine, irreducible non-local connections or influences. | Bell's theorem forces us to abandon a specific conjunction of assumptions (often called "Local Realism"). Locality can be preserved by modifying other assumptions (e.g., unique outcomes, measurement independence, or counterfactual definiteness). |
  | **The Role of "Realism"** | The derivation of Bell inequalities does not require a "realist" assumption beyond what is necessary to define a physical theory. The violation points primarily to Locality. | The derivation implicitly assumes "Realism" (specifically, counterfactual definiteness or pre-existing values for unmeasured observables). Dropping this assumption allows for a local explanation. |
  | **Many-Worlds (Everett)** | The Many-Worlds Interpretation either fails to be truly local in a physically meaningful sense or merely relabels nonlocality as branching. It does not solve the tension for a single-outcome observer. | The Many-Worlds Interpretation is strictly local. The appearance of nonlocality arises from correlating branches within a universal wavefunction that evolves locally. |
  | **Superdeterminism** | Superdeterminism (correlations between measurement settings and hidden variables) is a rejection of the scientific method. It renders experimental testing impossible and should be treated as a logical possibility but a scientific dead end. | Superdeterminism is a logically valid loophole that has been prematurely dismissed. It warrants serious investigation as a route to a local, deterministic underlying theory. |
  | **Retrocausality** | Retrocausal models introduce more problems than they solve, often violating standard causality without empirical gain. | Retrocausal models provide a parsimonious way to maintain Locality and Realism by allowing future measurement settings to influence past states. |

  ### 3. Cruxes and Future Trajectories

  We identify the following sub-questions as the critical pivot points for this debate. We agree that settling these would shift the weight of evidence, even if philosophical disagreement remains.

  **Crux 1: The Status of the "Freedom of Choice" Assumption**
  *   **The Question:** Is the independence of measurement settings from the source history a fundamental requirement of science, or a contingent assumption that could be violated by a deeper theory?
  *   **Agreed Test:** Further Bell tests using randomness generated from increasingly distant cosmological events (e.g., quasars, CMB) to push any required correlation back to the early universe.
  *   **Prediction (Position A):** Even with cosmic randomness, violations will persist. This confirms that the correlation is not due to a common past cause (superdeterminism) but due to nonlocal connection.
  *   **Prediction (Position B):** Eventually, a theory will be constructed showing how such correlations are dynamically generated without "conspiracy," or the requirement for statistical independence will be derived as an approximation from a deeper local theory.
  *   **50-Year Vision (If A is right):** Physics accepts action-at-a-distance as a fundamental feature. We may search for a preferred reference frame where this influence is instantaneous.
  *   **50-Year Vision (If B is right):** Physics finds a mechanism for quantum correlations that fits within a spacetime-local framework (e.g., via retrocausality or branching), restoring a classical intuition of local beables.

  **Crux 2: The Derivation of Quantum Mechanics**
  *   **The Question:** Can Quantum Mechanics be derived from physical principles that are explicitly local?
  *   **Agreed Test:** Research programs attempting to reconstruct QM from information-theoretic or operational axioms.
  *   **Prediction (Position A):** Any reconstruction will necessarily hide a non-local axiom or rely on assumptions that implicitly encode nonlocality.
  *   **Prediction (Position B):** A reconstruction will be achieved using only local constraints, demonstrating that nonlocality is an artifact of the representation, not the territory.
  *   **50-Year Vision (If A is right):** Quantum information theory remains the fundamental language, accepting nonlocal resources (entanglement) as primitive.
  *   **50-Year Vision (If B is right):** Quantum mechanics is understood as an emergent phenomenon from a deeper, local substrate (similar to thermodynamics), resolving the tension.

  **Crux 3: Single-Outcome vs. Many-Outcome**
  *   **The Question:** Is the observation of a single definite outcome a fundamental fact of nature or a perspectival effect?
  *   **Agreed Test:** Experimental tests of "Wigner's Friend" scenarios and extended no-go theorems (e.g., Bong et al., Brukner) probing the absoluteness of observed events.
  *   **Prediction (Position A):** These experiments will confirm that observed events are absolute facts. Therefore, the correlations between them must be nonlocal.
  *   **Prediction (Position B):** These experiments will show that "facts" are relative to observers. This relativity allows for local explanations of correlations that appear nonlocal from within a single branch.
  *   **50-Year Vision (If A is right):** We maintain a single-world ontology and accept nonlocality.
  *   **50-Year Vision (If B is right):** We adopt a many-worlds or relational ontology where locality is preserved at the cost of unique outcomes.

  ### 4. Closing Recommendations for Science Communication

  We acknowledge that a portion of the public debate stems from verbal disputes regarding the definition of "Locality" and "Realism." To improve public understanding, we offer the following joint recommendations:

  **On Verbal Disputes**
  We agree that much of the confusion arises because "Locality" is used to mean both "No Superluminal Signalling" (which everyone agrees is true) and "Bell Locality/Factorizability" (which everyone agrees is false).
  *   **Recommendation:** Journalists and communicators should explicitly distinguish between *Signal Locality* (preserved) and *Bell Locality* (violated). When a physicist claims "Nature is Local," they must specify whether they mean "No signalling" or "No ontological influence."

  **On the Phrase "Local Realism"**
  We have debated whether the phrase "Local Realism" should be banned from science coverage.
  *   **Position A** argues that using "Local Realism" implies that "Realism" is the optional ingredient, misleading the public into thinking Nonlocality is not required.
  *   **Position B** argues that "Local Realism" accurately reflects that Bell rules out the *combination*, allowing the audience to understand there is a choice to be made.

  **Joint Recommendation:**
  We do not recommend a total ban, as the phrase is historically entrenched. However, we strongly recommend that **the phrase "Local Realism" should never be used without immediate qualification.**
  *   **Required Context:** Whenever "Local Realism" is used, the text must specify which camp believes "Locality" is the casualty and which believes "Realism" (or Measurement Independence/Uniqueness) is the casualty.
  *   **Preferred Alternative:** Where possible, use the phrase **"Bell Correlations"** to describe the phenomenon, and reserve "Nonlocality" for claims about ontological influence.
  *   **Goal:** The goal of coverage should not be to tell the reader which interpretation is correct, but to clearly explain *what must be given up* under each interpretation.

  **Signed,**

  _________________________
  [Physicist A]

  _________________________
  [Physicist B]
