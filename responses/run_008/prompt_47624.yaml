          *   Camp B (Localists/Many-Worlders/Retrocausalists/Superdeterminists): Bell kills "Local Realism." You can keep Locality if you drop Realism (instrumentalism), or split worlds (Everett), or allow retrocausality, or accept superdeterminism.
      *   *Key Terminology:* "Locality" (signal locality vs. parameter independence vs. ontological nonlocality), "Realism" (counterfactual definiteness, pre-existing values), "Local Realism" (the joint assumption).

  3.  **Drafting - Section by Section:**

      *   **Section 1: Agreed Claims.**
          *   Need to state what Bell *mathematically* proved without interpreting the ontology.
          *   Need to acknowledge experimental status (loopholes closed to high confidence).
          *   Need to define terms carefully. "Locality" is the biggest trap. Distinguish "no-signalling" from "Bell-locality."
          *   Need to identify "Strawmen" both hate. (e.g., "Bell proved FTL communication is possible" is false for everyone).
          *   *Drafting thought:* Make sure not to say "Realism is required for Bell." Camp A often argues Bell only assumes Locality. Camp B argues Realism is hidden in the derivation. I need to phrase this so both can nod. *Correction:* Actually, the most neutral ground is that Bell assumes a specific factorization condition. Whether that condition implies "Realism" or "Locality" is the fight. So, agree on the math, disagree on the label.
          *   *Agreed Claim:* Bell inequalities follow from a specific probabilistic constraint (factorizability). QM violates this. Experiments confirm QM.
          *   *Agreed Claim:* No superluminal *signalling* is possible (agreed by all standard interpretations).

      *   **Section 2: Disagreements Table.**
          *   Need to capture the specific friction points.
          *   *Issue 1: The cost of saving Locality.* Camp A says "Impossible." Camp B says "Possible via MWI/Retro/Superdet."
          *   *Issue 2: The status of Superdeterminism.* Camp A says "Unscientific/Conspiracy." Camp B says "Logically valid/Under-explored."
          *   *Issue 3: Many Worlds.* Camp A says "Still nonlocal or just nonsense." Camp B says "Strictly local."
          *   *Issue 4: Realism.* Camp A says "Bell doesn't assume realism." Camp B says "Hidden assumption of counterfactuals."
          *   *Formatting:* Column 1: Issue. Column 2: View 1 (Nonlocality). Column 3: View 2 (Locality-preserving).

      *   **Section 3: Cruxes.**
          *   What would change minds?
          *   *Experimental:* Leggett-Garg? No, that's macro-realism. Maybe new Bell tests with cosmic randomness (freedom of choice).
          *   *Theoretical:* Deriving QM from deeper principles?
          *   *50-Year Vision:* If Camp A is right: We find a preferred frame or accept action-at-a-distance as fundamental. If Camp B is right: We find a mechanism for branching or retrocausality, or QM is emergent.
          *   *Constraint:* Must be signable. Both must agree these are the things to look at.

      *   **Section 4: Closing/Recommendations.**
          *   *Verbal Dispute:* Acknowledge that "Locality" is overloaded.
