      *   *Refined Ending:* "He told me there is one last surprise tonight. I am now telling you. So, logically, it cannot be a surprise. But this is the man who made the impossible happen for 38 years. So, if something happens, was it a surprise? Or if nothing happens, was the announcement the trick? Either way, we're his students."

