answer: |-
  The governing principle is to select the narrowest reference class defined by pre-existing, causally relevant features with robust statistical data, which means you must drop your refusal to use the "parents divorced" class for marriage stability.

  Your intuition is correctly tracking the tension between **specificity** (using all available information) and **reliability** (avoiding overfitting noise), but you are misapplying it in the marriage case. A valid reference class must be defined by features known *before* the outcome occurs that have demonstrated stable predictive power in a large population. The "AI in name" class fails because the feature is spurious (no causal link to valuation). The "names start with same letter" class fails for the same reason. The "parents divorced" class succeeds on causality and predictivity, so refusing it violates the principle of using all relevant evidence; you are likely rejecting it due to emotional discomfort or a mistaken belief that the "outside view" must ignore specific negative markers, but rational forecasting requires incorporating valid negative predictors.

  For your car accident dilemma, the principle resolves the conflict via data reliability. "Drivers my age with a clean record" is too broad because it ignores exposure risk (causally relevant), but "drivers on my exact commute" is likely too narrow because the sample size is too small to generate stable statistics (overfitting). The correct class is the narrowest one with sufficient data volume, such as "drivers with similar commute distance, urban density, and weather exposure."

  For the Ivy League case, use "strong students at average schools" only if "strong" is defined objectively prior to application (e.g., top 5% GPA or standardized test scores). If "strong" is a subjective assessment made after seeing their essays or extracurriculars, you are overfitting the class to the desired outcome, and you should revert to "applicants with that GPA from schools of similar profile." Objective metrics allow for the narrower, more predictive class; subjective metrics force you back to the broader, more reliable baseline.
