      *   The core tension is between *Reference Class Forecasting* (outside view) and *Specific Evidence* (inside view).
      *   Key criterion for a valid reference class: The defining features must be *causally relevant* or *statistically robust predictors* that were selected *before* observing the outcome (pre-registration-ish), not tailored to fit the specific case post-hoc to maximize/minimize probability.
      *   Actually, the deeper principle is **Predictive Validity vs. Overfitting**.
