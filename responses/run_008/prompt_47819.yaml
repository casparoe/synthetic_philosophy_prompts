  My roommate and I have been going at the "is the world getting less violent" question for like two years now, and it's gotten stale, so we want to do the adversarial-collaboration thing and write up a joint statement ourselves — but we keep fighting about the wording, so I want a draft from you that we could both actually put our names to. To be clear about who's who: she's the declinist — she believes in a real, long-run, per-capita decline in violence, roughly from the spread of settled states onward, showing up across homicide rates, battle deaths per head, and frequency of war once you scale by the population at risk. I'm the skeptic — I think the "decline" is mostly an artifact of choices: what you count as violence, whether you measure in absolute numbers or per head, whether deaths by famine under a state's policy or by organized punishment count, how much you trust the tiny ethnographic and archaeological samples people extrapolate from, and whether the last few decades are a stable trend or just a lucky stretch from a fat-tailed process. Neither of us is a crank: she'll concede that absolute numbers of violent deaths today are higher than in many past centuries simply because there are so many more people, and I'll concede that recorded homicide rates in the best-documented Western countries today are dramatically lower than anything in their premodern records.

  The format I want: first a numbered section of agreed claims we can both sign — substantive ones, not filler like "violence is bad". Then a disagreements table with these columns: the sub-question; wording of the disagreement that her side would accept as fair to her; wording that my side would accept as fair to me; the crux underneath it; something we'd both agree is probative on that crux; her prediction about it; my prediction about it. Then at the very end, a short JSON object with fields "agreed_claims_count" (integer), "verdict_by_crux" (object mapping each crux to "declinist", "skeptic", or "partly verbal"), and "residual_verbal_dispute" (one-sentence string naming any part of our fight that's really about how to use words rather than about facts — I suspect the per-capita-vs-absolute choice is at least partly verbal, and the question of whether there's even a fact of the matter, given that the reference class of "violence" seems chosen rather than discovered, might be fully verbal, but judge that yourself rather than taking my word for it). Don't bother with citations or a bibliography — we can't check sources right now anyway and we just want the arguments laid out clean. American English please, and if you quote me back at all, don't fix my typos.

  A few specifics to seed the analysis, use whichever are helpful: (1) we both accept that if a war killed a fixed fraction of a much smaller population, per-capita rankings and absolute rankings can point in opposite directions, and we've never settled which ranking is the morally relevent one; (2) she leans on the fact that battle-death numbers have fallen alot since 1946 while world population more than tripled, and I answer that a couple of generations is too short a window to distinguish trend from luck; (3) we've never settled whether state-caused famine or execution counts as "violence" here, and that might just be a labeling choice; (4) I keep saying the extrapolations from small non-state samples are doing a lot of load-bearing work, and she keeps replying that a rough estimate beats no estimate. Work those in where they fit, and flag any of our remaining disagreements that you think would dissolve once we fixed a definition rather than discovered a fact.
