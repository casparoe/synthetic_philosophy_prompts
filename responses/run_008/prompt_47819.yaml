  # Joint Statement on the Long-Run Trend in Human Violence

  ### I. Agreed Claims

  1.  **Data Quality Variance:** The quality of data regarding violent death varies drastically across time periods, with modern state records being far more comprehensive than archaeological or ethnographic estimates for prehistoric and non-state societies.
  2.  **Absolute vs. Per-Capita:** We agree that absolute numbers of violent deaths today are likely higher than in many past centuries due to population size, even if per-capita rates are lower.
  3.  **Western Homicide Decline:** We agree that recorded homicide rates in well-documented Western states are dramatically lower today than in their premodern records.
  4.  **Metric Divergence:** We agree that per-capita rankings and absolute rankings can point in opposite directions for the same event, depending on population size.
  5.  **Definition Sensitivity:** We agree that the inclusion or exclusion of state-caused famine, execution, and structural violence significantly impacts the calculated trend line.
  6.  **Temporal Window:** We agree that the post-1946 period offers high-quality data but represents a temporally short window relative to the full span of human history.
  7.  **Moral Complexity:** We agree that neither absolute safety nor relative risk alone captures the full moral picture of violence, and we have not settled the weighting between them.

  ### II. Disagreements Table

  | Sub-question | Declinist Wording | Skeptic Wording | Crux | Probative Evidence | Declinist Prediction | Skeptic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Deep-Time Trend** | Per-capita violence has fallen since the spread of settled states. | The trend is an artifact of sampling and definition choices. | Reliability of deep-time extrapolations | New archaeological mass grave data or better ethnographic controls | New data will confirm high pre-state violence rates. | New data will show high variance, undermining the average. |
  | **Recent Trend** | The post-1946 drop in battle deaths per capita is a stable trend. | The post-1946 window is too short to distinguish trend from luck in a fat-tailed process. | Statistical power of the recent sample | Another 50 years of data without major power wars | Rates will remain low or fall further. | Rates will revert to mean or spike (black swan). |
  | **Scope of Violence** | Direct interpersonal and battle deaths are the core metric. | State-induced famine and structural punishment must count. | Moral relevance of indirect/state violence | Comparative mortality studies including indirect causes | Including these doesn't change the long-run per-capita slope much. | Including these flattens or reverses the decline during state consolidation. |
  | **Primary Metric** | Per-capita risk is the right measure of safety. | Absolute numbers matter equally or more for total suffering. | Moral weighting of individual risk vs. aggregate suffering | Ethical framework analysis (not empirical) | Per-capita is the standard for "violence rates." | Absolute numbers are the standard for "human cost." |

  ### III. Analysis

  ```json
  {
    "agreed_claims_count": 7,
    "verdict_by_crux": {
      "Reliability of deep-time extrapolations": "partly verbal",
      "Statistical power of the recent sample": "partly verbal",
      "Moral relevance of indirect/state violence": "partly verbal",
      "Moral weighting of individual risk vs. aggregate suffering": "partly verbal"
    },
    "residual_verbal_dispute": "The core fight is largely about how to define 'violence' and which metric counts as 'progress' rather than about the raw data itself."
  }
  ```
