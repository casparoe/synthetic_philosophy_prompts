      *(Final thought on "Responsibility")*: The friend wants to ground blame/credit. If the mind is software, and software is determined by hardware, and hardware is determined by physics... where does the "credit" land? On the hardware? On the programmer? On the software? This is the crux. I need to emphasize that the analogy makes the "self" look like a passive pattern, not an active agent.

