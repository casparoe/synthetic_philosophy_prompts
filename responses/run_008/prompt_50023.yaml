      *Refining the Popperian/Skinnerian Distinction:* This is the hardest part. Dennett emphasizes "letting hypotheses die in your stead." Skinnerian is "letting yourself die." To distinguish behaviorally, we need to see *variation without execution*. E.g., pausing before acting, or changing behavior in a novel situation without prior reinforcement history.

