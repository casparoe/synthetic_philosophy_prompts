answer: |-
  To brief Henry Sidgwick on the century following his death is to present him with a mirror of his own intellectual struggles, refined by technology but unchanged in essence. Sidgwick was a man defined by a specific tension: a profound ethical *need* for the evidence (to resolve the dualism of practical reason) warring with an equally profound methodological *refusal* to accept anything less than certainty. He was not a debunker by temperament, but a skeptic by duty.

  Here is how Sidgwick would likely respond to the briefing, grounded in his recorded views and temperament, with extrapolations clearly marked.

  ### 1. On Methodology: Tools of Settlement or Instruments of Stalemate?

  Sidgwick would view modern meta-analysis, preregistration, and large-N designs with immediate recognition. In the *Census of Hallucinations* (1894), Sidgwick effectively pioneered the large-N approach in psychical research, seeking to overcome the anecdotal fragility of individual cases through statistical weight. He understood that the "law of large numbers" was the only way to distinguish coincidence from law.

  **The Record:** Sidgwick wrote in 1886 that the Society's aim was "to examine without prejudice... all alleged facts of a extraordinary character." He insisted on "strictly scientific" methods and was notoriously critical of the SPR's own members when they slipped into credulity. He valued the "negative" result as much as the positive, provided the negative was rigorous.

  **The Extrapolation:** Sidgwick would likely argue that preregistration is the logical culmination of the "blind" protocols he wished he could have enforced on mediumship investigators. It prevents the "file drawer problem" (selective reporting), a form of the unconscious bias he constantly warned against.

  **The Verdict:** However, regarding the Ganzfeld standoff (Hyman vs. Honorton), Sidgwick would not see this as a failure of the tools, but as a confirmation of his deepest anxiety. He would recognize the Hyman/Honorton debate as a sophisticated rerun of the disputes he managed between the "believers" (like F.W.H. Myers) and the "skeptics" (like himself and Frank Podmore).
  *   **Conclusion:** He would conclude that while the *instruments* are now sufficient to settle the question, the *human element* remains the variable. If competent, honest investigators can look at the same meta-analytic data and disagree on whether it constitutes proof, then the "fact" has not met his threshold of certainty. He would likely say: *"The machinery of proof is now perfect; it is the phenomenon that refuses to be caught in it."*

  ### 2. On Daryl Bem: Legitimacy Achieved, Truth Lost?

  The case of Daryl Bem's "Feeling the Future" (2011) would strike Sidgwick with the force of a tragic irony.

  **The Record:** Sidgwick spent his career trying to move psychical research from the parlor to the university. He wanted the "institutional legitimacy" that Bem inadvertently achieved by publishing in the *Journal of Personality and Social Psychology* (JPSP). Sidgwick believed that for psychical research to matter, it had to be accepted by the mainstream scientific community.

  **The Extrapolation:** Sidgwick would view the publication of Bem's paper not as a victory, but as a premature capitulation by the peer-review system. He would be deeply interested in the subsequent replication failures. To Sidgwick, a single experiment, no matter how well-conducted, is never a "certain fact." It is the *reproducibility* that grants the status of law.

  **The Verdict:** He would not view Bem as the strongest evidence obtained, but as the *reductio ad absurdum* of "significance chasing." The fact that Bem's results could not be replicated under preregistered conditions would validate Sidgwick's lifelong caution. He would likely argue that Bem's paper demonstrates exactly why the SPR was necessary: to act as a filter against the enthusiasm of mainstream science when it touches the anomalous.
  *   **Conclusion:** Sidgwick would say: *"We sought to convince science that our facts were real. It appears we have instead taught science how to generate our illusions."* He would view the replication crisis not as a scandal, but as a necessary cleansing, vindicating his insistence that "certainty" requires a durability that Bem's effects lacked.

  ### 3. On the Dualism of Practical Reason: Bias or Ballast?

  This is the crux of Sidgwick's psychology. The "dualism of practical reason" refers to his ethical finding that Rational Egoism (pursuing one's own good) and Utilitarianism (pursuing the general good) are logically irreconcilable unless one assumes a moral order (God/Afterlife) that harmonizes them. He *needed* psychical research to succeed to save his ethical system from despair.

  **The Record:** Biographers (notably A. Sidgwick and later Schultz) note that Sidgwick feared his desire for the truth of spiritualism might bias his judgment. Consequently, he over-corrected, becoming harder on psychical claims than on any other scientific claim. He wrote to Myers that he must "guard against the bias of wish."

  **The Extrapolation:** A merely curious investigator might accept a p-value of 0.05 as "interesting." Sidgwick, because the stakes were the coherence of morality itself, would demand a p-value approaching certainty. The higher the stake, the higher the evidentiary bar.

  **The Verdict:** His deep need for the result would make him *less* able to accept a negative verdict emotionally, but *more* able to accept it intellectually. He had already practiced the art of "holding the tension." He lived with the dualism unresolved for decades.
  *   **Conclusion:** He would argue that his reputation for fairness was not an insulation against motivated reasoning, but the *result* of a conscious, agonizing discipline to counteract it. He would tell you: *"Because I needed the proof to be true, I was compelled to ensure it was not false. A indifferent skeptic can afford to be sloppy; I could not."* The negative verdict does not break him; it merely returns him to the ethical darkness he inhabited before he joined the SPR.

  ### 4. The Counterfactual: Would He Have Started the SPR?

  If Sidgwick could see the next 120 years—fraud, stalemate, Bem, replication failures, and still no "certain fact"—would he have founded the Society?

  **The Record:** Near his death, Sidgwick reportedly stated that the SPR had not secured a single certain fact. Yet, he remained President until the end. He did not resign. He did not denounce the project. He viewed the work as a duty of inquiry, regardless of the yield.

  **The Extrapolation:** As a Utilitarian, Sidgwick weighs costs against benefits. The cost was his reputation and twenty years of labor. The benefit was the *elimination of error*. If the result after 120 years is still ambiguity, a strict Utilitarian calculus might suggest the resources were wasted. However, Sidgwick was also a Kantian in his commitment to truth-telling.

  **The Verdict:** He would likely conclude that he was right to start the Society, but wrong to hope for its specific success.
  *   **Why?** Because the alternative was leaving the question to charlatans and uncritical believers. The SPR's value, in hindsight, is not that it proved survival, but that it defined the *standards* by which survival must be proved.
  *   **On his "No Certain Facts" Verdict:** This verdict is not a reason to quit; it is the only honest report a rigorous inquirer could give. Sidgwick would argue that saying "we found nothing" is a positive scientific achievement if it clears away superstition.
  *   **Conclusion:** He would say: *"I would still have established the Society, not to prove the truth of the claims, but to protect the integrity of science from them. My judgment that we found nothing certain is not a failure of the method, but the only success the method could allow given the data."*

  ### Summary of Sidgwick's Position

  Sidgwick would emerge from this briefing not as a disillusioned man, but as a vindicated one. He would see the last 120 years as a validation of his "melancholy" caution.

  1.  **Methodology:** The tools are finally adequate; the phenomena remain elusive. The stalemate is in the data, not the methods.
  2.  **Bem:** A warning that institutional legitimacy without reproducibility is dangerous.
  3.  **Motivation:** His ethical need sharpened his skepticism; it did not blind him.
  4.  **Legacy:** The SPR was necessary not to confirm the supernatural, but to rigorously define the boundary where the natural ends.

  **Extrapolation Note:** *While Sidgwick's letters confirm his fear of bias and his commitment to rigor, his specific reaction to "preregistration" or "meta-analysis" is necessarily inferred from his general philosophy of science and his handling of the Census of Hallucinations. His exact emotional response to the Bem affair is a projection based on his documented reaction to similar "breakthroughs" in the 1880s (e.g., the Hodgson/Blavatsky investigations), where he prioritized the exposure of fraud over the preservation of the Society's hopes.*

  In the end, Sidgwick would likely close the briefing with a sentiment consistent with his *Methods of Ethics*: *"It is better to dwell in a morally uncertain universe with clear eyes, than to inhabit a morally governed one built on self-deception."*
