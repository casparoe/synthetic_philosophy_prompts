answer: |-
  It is a profound discomfort to find one's moral intuitions fragmenting under scrutiny, but I suggest to you that this fragmentation is not a failure of your reasoning, but rather a correct perception of the landscape. Intellectual property is not a monolith; it is a patchwork of distinct moral claims stitched together by legal pragmatism.

  To answer your question directly: **No, there is no single, traditional first-order principle (such as pure desert, pure personality, or pure incentive) that captures all of your verdicts without strain.** However, there is a unifying *meta-principle* that comes remarkably close, provided we accept that different creative practices have different moral ecologies.

  ### The Principle of Normative Viability

  I propose the following principle, which I shall call **The Principle of Normative Viability**:

  > *A claim to ownership over an idea or expression is justified only to the extent that recognising such a claim is necessary to sustain the integrity and viability of the specific social practice from which the idea emerged, provided that this exclusivity does not inflict disproportionate harm upon the public commons.*

  This principle is teleological; it looks to the *purpose* of the practice. It acknowledges that the 'practice' of pharmaceutical research requires different norms than the 'practice' of high fashion, stand-up comedy, or Indigenous cultural preservation. It blends incentive (viability) with desert (integrity) and public interest (commons).

  ### Application to the Magician

  Let us apply this principle to your unlisted case: *A magician invents a new illusion and keeps the method secret, only to see it exposed and then performed by rivals.*

  Under the Principle of Normative Viability, the practice of stage magic relies fundamentally on the **preservation of mystery**. The 'value' of the product is the audience's wonder, which is contingent upon their ignorance of the method.
  1.  **The Exposure:** For a rival to expose the method is to destroy the viability of the practice itself for that trick. It violates the normative expectation of secrecy that allows magicians to labour on new illusions. This is **wrong**.
  2.  **The Performance:** For a rival to then perform the exposed trick is to free-ride on the destruction of the norm. It devalues the original inventor's labour and accelerates the death of the illusion. This is also **wrong**.

  The principle recommends that the magician has a strong moral claim (perhaps enforceable via contract or trade secret law, though rarely copyright) against both the exposure and the subsequent performance, because allowing them would render the practice of inventing new magic unsustainable.

  ### Where the Principle Cannot Save Your Verdicts

  While this principle is robust, it cannot reconcile every tension in your list without appealing to subjective judgments about the 'weight' of different practices. Here are the fractures:

  **1. The Independent Inventor vs. The First-to-File Rule**
  Your verdict is that the independent engineer is "wrongly treated." The Principle of Normative Viability agrees with *you*, not the law. It suggests that if the practice of engineering is about labour and discovery, the second inventor deserves recognition. However, the *legal system* prioritises administrative certainty over this moral desert. The principle saves your *intuition*, but it highlights that the law is morally deficient in this specific instance. It cannot reconcile your verdict with the current legal reality; it can only validate your dissatisfaction with it.

  **2. The Student Essay**
  You classify submitting a purchased essay as a "serious wrong, though... not theft." The Principle of Normative Viability struggles here because academic submission is not primarily an economic practice, nor is it about 'ownership' in a property sense. It is about **certification of competence**. The wrong is fraud, not appropriation. While the principle can stretch to cover 'academic integrity' as a practice, it admits that this case belongs to a different category (honesty) than the others (property). It cannot fully explain why you hesitate to call it theft while calling the comedian's bit theft-adjacent.

  **3. Indigenous Designs vs. Copyright Terms**
  You find indefinite protection for Indigenous designs legitimate, but seventy years for pop songs excessive. The principle justifies this only if we accept that 'cultural survival' carries more moral weight than 'commercial entertainment'. This is a sound ethical distinction, but it is not a *logical* necessity of the principle itself. One could argue that without indefinite copyright, the practice of professional songwriting becomes viable only for the wealthy. To save your verdict, the principle must rely on an external valuation of *sacredness* versus *commerce*, which it does not generate on its own.

  ### Could Your Friend's Incentive Story Save Them?

  Your friend argues for a pure **Utilitarian Incentive Theory**: IP exists solely to maximise social welfare by incentivising creation. Let us test this against your verdicts.

  **Where the Friend Succeeds:**
  *   **Pharma Patents:** Perfectly fits. High costs require high rewards to incentivise R&D.
  *   **Fashion:** Fits well. The lack of IP incentivises rapid iteration and trend cycling, which benefits the industry.
  *   **Copyright Term:** Fits. Seventy years offers no marginal incentive over twenty; thus, it is inefficient.
  *   **Generics:** Fits. Once the incentive (patent) expires, competition maximises welfare.

  **Where the Friend Fails:**
  *   **The Independent Inventor:** The friend's theory *cannot* save your verdict. From a pure incentive perspective, the second inventor needed no reward to have invented the hinge (they did it without the patent's lure). Punishing them grants no additional incentive to the first inventor that they didn't already have. The friend must conclude the second inventor is *correctly* treated as a free-rider to maintain administrative clarity. Your intuition of injustice is invisible to them.
  *   **The Comedian:** The friend struggles here. Does copyright law actually incentivise jokes? Most comedians rely on social norms and reputational shaming, not litigation. If the law doesn't incentivise, the friend's theory suggests IP protection is unnecessary. Yet you feel the theft is wrong. The friend reduces this to market harm; you see it as a violation of voice.
  *   **Indigenous Designs:** The friend's theory collapses here. Sacred designs are not produced in response to economic incentives. To argue for their protection on incentive grounds is to misunderstand the nature of the tradition. The friend would have to argue that protecting them incentivises *other* indigenous communities to share culture, which is a cynical and likely false instrumentalisation.
  *   **The Student Essay:** The friend's theory has no purchase. There is no market failure being corrected. Plagiarism is a moral wrong, not an economic inefficiency.

  ### Conclusion

  Your friend is right that **incentive** is the engine of *commercial* IP law (pharma, copyright, patents). But your intuitions are right that **desert, personality, and integrity** are the engines of *moral* judgment regarding ideas.

  The Principle of Normative Viability bridges these by asking: *What does this specific practice need to survive?* Sometimes it needs money (pharma), sometimes it needs secrecy (magic, Coke), sometimes it needs dignity (Indigenous culture), and sometimes it needs nothing but honesty (academia).

  There is no single home for your intuitions because ideas are not a single kind of thing. They are sometimes commodities, sometimes children, sometimes secrets, and sometimes sacred trusts. Your evening's argument ended in stalemate not because you failed to find the truth, but because your friend was arguing about economics while you were arguing about ethics. Both are required, but neither is sovereign.
