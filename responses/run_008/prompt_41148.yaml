answer: |-
  # Session Design: "The Impossible Audit"

  **Target:** 18 Graduate Data Journalism Students
  **Time:** 90 Minutes
  **Goal:** Demonstrate the incompatibility of fairness metrics (Calibration, Equal FPR, Equal FNR) when base rates differ, without using algebra.

  ## 1. Materials & Setup

  **Room:** One large table or three clustered tables.
  **Teams:** 3 Teams of 6 students. Each team is a "Screening Agency."
  **Roles within Teams:**
  *   2 **Analysts:** Sort cards, count outcomes.
  *   2 **Decision Makers:** Set the acceptance threshold.
  *   2 **Auditors:** Calculate the metrics and talk to the external auditors.

  **The Decks (Prepared in advance):**
  You need 3 identical sets of cards (one per team). Each set contains two distinct decks: **Group Blue** and **Group Red**. The cards are index cards.
  *   **Front:** A colored dot (Green or White) representing the "Risk Score."
  *   **Back:** A stamp (PASS or FAIL) representing the "Ground Truth Outcome."

  **Round 1 Deck Composition (Per Team):**
  *   **Group Blue (20 cards):**
      *   10 cards: Green Dot / PASS
      *   10 cards: White Dot / FAIL
  *   **Group Red (20 cards):**
      *   10 cards: Green Dot / PASS
      *   10 cards: White Dot / FAIL
  *   *Note:* Base rates are equal (50% PASS). Signal is perfect (Green=PASS, White=FAIL).

  **Round 2 Deck Composition (Per Team):**
  *   **Group Blue (20 cards):**
      *   12 cards: Green Dot / PASS
      *   4 cards: White Dot / PASS
      *   4 cards: White Dot / FAIL
      *   *(0 Green/FAIL cards)*
      *   *Base Rate:* 80% PASS (16/20).
  *   **Group Red (20 cards):**
      *   4 cards: Green Dot / PASS
      *   12 cards: Green Dot / FAIL
      *   4 cards: White Dot / FAIL
      *   *(0 White/PASS cards)*
      *   *Base Rate:* 20% PASS (4/20).
  *   *Note:* The "Green" signal is perfectly safe for Blue, but risky for Red.

  **Handouts:**
  1.  **The Mandate:** A one-pager defining the three rules (see below).
  2.  **Tally Sheet:** A grid to record Accepted/Rejected vs. PASS/FAIL for each group.
  3.  **Scorecard:** To track "License Points."

  ---

  ## 2. The Three Mandates (The Auditors)

  Print these on separate cards and hand them to three distinct "External Auditors" (you, or three trusted TAs). If you are alone, you play all three voices, changing hats.

  1.  **The Regulator (Calibration):** "Truth in Lending. Among the people you approve, the success rate must be the same for Blue and Red. If you approve a Blue, they must be as likely to succeed as an approved Red." *(Metric: Positive Predictive Value)*
  2.  **The Civil Rights Auditor (Equal FPR):** "Equal Burden of Error. Among the people who would FAIL, you cannot reject one group more often than the other. The rate of bad approvals must be equal." *(Metric: False Positive Rate)*
  3.  **The Consumer Group (Equal FNR):** "Equal Opportunity. Among the people who would PASS, you cannot deny one group more often than the other. The rate of missed opportunities must be equal." *(Metric: False Negative Rate)*

  **Passing Condition:** To pass a round, a team must satisfy **all three** mandates simultaneously.

  ---

  ## 3. Running Order

  ### 0:00 – 0:10 | Introduction & Setup
  *   Distribute teams and Round 1 Decks.
  *   Explain the goal: You are a lending agency. You must approve applicants (Green or White dots) to maximize profit, but you **must** pass the three audits to keep your license.
  *   **Scoring:** Start with 10 License Points. Lose 1 point for every failed mandate. Lose 5 points if you go bankrupt (0 points).
  *   **Rule:** You can set *one* threshold rule (e.g., "Accept Green, Reject White") or *group-specific* rules (e.g., "Accept Green for Blue, Accept All for Red"). You decide.

  ### 0:10 – 0:30 | Round 1 (The Lull)
  *   **Task:** Sort the decks, choose a threshold, submit decisions to the Auditor.
  *   **Expectation:** Students will quickly see that Green = PASS and White = FAIL for both groups.
  *   **Outcome:** They set "Accept Green."
      *   Blue: 10 Approved (10 PASS), 10 Rejected (10 FAIL).
      *   Red: 10 Approved (10 PASS), 10 Rejected (10 FAIL).
      *   **Audits:** Calibration (100% vs 100%): **PASS**. FPR (0% vs 0%): **PASS**. FNR (0% vs 0%): **PASS**.
  *   **Result:** Everyone keeps 10 points. The mood is confident. "Fairness is just careful bookkeeping."

  ### 0:30 – 0:35 | Transition
  *   Collect Round 1 decks. Distribute Round 2 decks.
  *   **Crucial Instruction:** "The rules have not changed. The auditors have not changed. The definition of fairness is identical. Go."

  ### 0:35 – 1:05 | Round 2 (The Trap)
  *   **Task:** Sort, decide, audit.
  *   **The Struggle:**
      *   If they use the Round 1 rule ("Accept Green"):
          *   Blue Approval Success: 100% (12/12).
          *   Red Approval Success: 25% (4/16).
          *   **Regulator screams:** Calibration Failed!
      *   If they try to fix Calibration (e.g., Reject Red Greens to match Blue safety):
          *   Red Approval Success goes up, but Red False Negative Rate skyrockets (they deny the 4 good Reds).
          *   **Consumer Group screams:** Equal FNR Failed!
      *   If they try to fix FNR (Accept Red Whites to catch the good ones):
          *   There are no Good Whites in Red. They only add Failures. False Positive Rate skyrockets.
          *   **Civil Rights screams:** Equal FPR Failed!
  *   **Observation:** Watch the teams fracture. Some will argue for group-specific thresholds. Some will argue to ignore one auditor. None will find a solution that passes all three.
  *   **End of Round:** Most teams will have lost 2 or 3 points. Some may have tried to "game" the system by lying about counts (check their cards).

  ### 1:05 – 1:30 | The Debrief (The Reveal)
  *   **Step 1: The Board.** Draw two buckets on the whiteboard: Blue and Red.
  *   **Step 2: The Base Rates.** Ask: "In Round 1, what % of Blue were Good?" (50%). "What % of Red were Good?" (50%). "In Round 2?" (Blue 80%, Red 20%).
  *   **Step 3: The Logic (No Formulas).**
      *   "The Regulator wants the *approved* pools to look the same (same success rate)."
      *   "The Civil Rights Auditor wants the *rejected bad* people to be treated the same."
      *   "The Consumer Group wants the *rejected good* people to be treated the same."
      *   "In Round 2, the Red deck was mostly Bad. The Blue deck was mostly Good."
      *   "If you treat the **Scores** the same (Equal FPR/FNR), you approve mostly Bad Reds and mostly Good Blues. The **Outcomes** look different (Calibration fails)."
      *   "If you force the **Outcomes** to look the same (Calibration), you must approve fewer Reds. But then you are rejecting Good Reds at a higher rate than Good Blues (FNR fails)."
      *   **The Punchline:** "The ProPublica audit said the tool was biased because error rates differed. The Vendor said the tool was fair because scores meant the same thing. **They were both right.** You cannot have both when the underlying rates differ."

  ---

  ## 4. What Will Go Wrong (And How to Fix It)

  **1. Counting Errors:**
  *   *Risk:* Students miscount the backs of the cards and blame the math.
  *   *Fix:* Provide a "Tally Sheet" with checkboxes. Require teams to sign off on their counts before auditing. If a team claims a metric passes, ask to see the cards.

  **2. "Just Use Different Thresholds":**
  *   *Risk:* Students think, "Okay, we'll accept Green for Blue, and Green+White for Red."
  *   *Fix:* Let them try. When they accept White for Red, they add only Failures (based on the deck design). Their Red Success Rate drops, making Calibration *worse*. This reinforces the trap.

  **3. Cynicism / Cheating:**
  *   *Risk:* A team says, "We'll just tell the auditor we passed."
  *   *Fix:* You are the Auditor. You hold the master key (a printed legend of the deck composition). Verify their numbers against the master key.

  **4. Confusion on Metrics:**
  *   *Risk:* Mixing up FPR and FNR.
  *   *Fix:* The Handout must define them simply:
      *   **FPR:** Of the **Bad** people, how many did you let in?
      *   **FNR:** Of the **Good** people, how many did you turn away?

  ---

  ## 5. The Honest Limitations (Crucial for Journalists)

  In the final 10 minutes, you must dismantle the game's reality. This is where the journalism lesson lives.

  **Say this:**
  "This game worked because I gave you **Ground Truth**. You could flip the card and see PASS or FAIL. In the real world, there is no back of the card."

  1.  **Proxy Labels:** "In COMPAS, the 'FAIL' side wasn't 'Will Commit Crime.' It was 'Will Get Arrested.' Arrest rates differ by policing patterns, not just behavior. If the back of the card is biased, the game changes."
  2.  **Endogenous Base Rates:** "In Round 2, I gave Red a lower success rate. In reality, those rates are often the result of prior policy (e.g., redlining, over-policing). The 'Base Rate' is not a law of nature; it is a historical artifact."
  3.  **The Choice:** "The math says you can't satisfy all three. But it doesn't tell you which one to drop. That is not a math question. It is a political one. Who bears the cost of the error? The lender (Calibration), the community (FPR), or the individual (FNR)? Your job as journalists is not to solve the math, but to report on who made the choice to break the constraint."

  ---

  ## 6. Instructor's Cheat Sheet (The Math Behind the Cards)

  *For your reference only. Do not show students.*

  **Round 2 Logic:**
  *   **Blue Base Rate:** 80% ($P(Good|Blue) = 0.8$)
  *   **Red Base Rate:** 20% ($P(Good|Red) = 0.2$)
  *   **Threshold:** Accept "Green".
  *   **Blue:**
      *   $PPV = 12/12 = 100\%$
      *   $FPR = 0/4 = 0\%$
      *   $FNR = 4/16 = 25\%$
  *   **Red:**
      *   $PPV = 4/16 = 25\%$
      *   $FPR = 12/16 = 75\%$
      *   $FNR = 0/4 = 0\%$

  **Why it breaks:**
  To equalize FPR (make Red 0%), you must reject Red Greens. But Red Greens contain all the Good Reds. So Red FNR becomes 100%. (Blue FNR is 25%). **FNR Mismatch.**
  To equalize FNR (make Blue 0%), you must accept Blue Whites. But Blue Whites contain Bad Blues. Blue FPR becomes 100%. (Red FPR is 75%). **FPR Mismatch.**
  To equalize PPV (make Red 100%), you must reject Red Greens that are Bad. But you can't distinguish them from Good Greens without changing FNR/FPR.

  **Conclusion:** With different base rates, Equal Error Rates $\implies$ Unequal Calibration. Equal Calibration $\implies$ Unequal Error Rates.
