      *   **Core Mechanic:** Students play a lending/screening agency. They must satisfy three fairness demands simultaneously using card decks representing applicants (score on front, outcome on back).
      *   **Structure:** Two rounds.
          *   Round 1: Equal base rates (all demands satisfiable).
          *   Round 2: Divergent base rates (demands incompatible).
      *   **Fairness Metrics:** Calibration within groups, Equal False Positive Rates (FPR), Equal False Negative Rates (FNR).
      *   **Roles/Voices:** Regulator, Civil-Rights Auditor, Consumer Group.
      *   **Requirements:** Definite rules, definite numbers, payoff scheme (no real money), running order/timing, debrief script, prediction of failure modes, admission of game limitations (ground truth isn't real, base rates are endogenous).
      *   **Constraint:** Commit to a *single* design. No options.

  2.  **Deconstruct the Mathematical Constraint (The "Trap"):**
      *   To make the impossibility theorem work physically, I need to construct populations where the base rates ($P(Y=1|G=A)$ vs $P(Y=1|G=B)$) differ in Round 2, but are equal in Round 1.
      *   *Calibration:* If I predict risk $p$, the actual success rate must be $p$. For simplicity in a card game, let's use binary thresholds. If I accept everyone above score $X$, the success rate of accepted people must match the claimed risk. Actually, simpler: Calibration usually means $P(Y=1 | \text{Score}=s, \text{Group}=g)$ is the same for all groups. In a threshold game, it implies that the *precision* (positive predictive value) among accepted applicants should be comparable if we claim the score means the same thing.
      *   *Wait, let's refine the metrics for a card game:*
          *   **Calibration:** Among people given a specific risk score (or bucket), the outcome rate is the same across groups. In a threshold model, this often simplifies to: The success rate of *accepted* applicants should be similar across groups (if we treat "accept" as "predicted success"). *Correction:* Strict calibration means if the model says "70% chance," 70% succeed. For a card game with binary decisions (Accept/Reject), "Calibration" is best represented as **Predictive Parity** (Equal Positive Predictive Value). If I accept someone, the likelihood they are actually "Good" should be the same regardless of race.
          *   **Equal FPR:** Among the "Bad" applicants, the rate of acceptance is the same.
          *   **Equal FNR:** Among the "Good" applicants, the rate of rejection is the same.
      *   *The Theorem:* You can't have Calibration (PPV), Equal FPR, and Equal FNR simultaneously if Base Rates differ.
      *   *Round 1 Design:* Base rates equal. All three possible.
      *   *Round 2 Design:* Base rates unequal. Impossible to satisfy all three.

