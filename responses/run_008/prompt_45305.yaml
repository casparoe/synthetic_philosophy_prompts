answer: |-
  # MORAL AGGREGATION: FINDING YOUR POSITION
  **Instructions:** Read each case carefully. Answer based on your immediate moral intuition, not on which theory you think you *should* hold. Follow the arrows to locate your position.

  ### START: THE RESCUE CASE
  **Case A:** A helicopter can make one trip. 
  *   **Option 1:** Save **1 person** stranded on a rock (they will die otherwise).
  *   **Option 2:** Save **5 people** stranded on a different rock (they will die otherwise).
  *   *All else is equal (age, health, relationship to you).*

  **Q1: Do you have a moral duty to save the 5 rather than the 1?**
  *   **NO.** (It is permissible to flip a coin; the number of people does not itself change what you owe.) 
      👉 **POSITION: THE TAUREK VIEW ("Numbers Don't Count")**
      *   *Defender:* John Taurek.
      *   *Why:* Morality is about what you owe to *each* individual. You owe the one a chance, and you owe the five a chance. Summing them treats people as containers of value rather than individuals.
      *   *(Stop here)*
  *   **YES.** (You ought to save the greater number.) 
      👉 **GO TO Q2**

  ---

  ### BRANCH: THE LIMITS OF AGGREGATION
  **Case B:** You are in a transmitter room. 
  *   **Option 1:** Stop a signal that will cause **1 person** to suffer excruciating torture/death for a year.
  *   **Option 2:** Stop a signal that will cause **1,000,000 people** to suffer a mild headache for an hour.
  *   *You can only stop one signal.*

  **Q2: Does the sum of the million headaches outweigh the one death/torture?**
  *   **YES.** (If the total amount of suffering is lower, you should prevent the headaches, even if the stakes per person are lower.) 
      👉 **POSITION: STRAIGHTFORWARD UTILITARIANISM**
      *   *Defender:* Peter Singer / Classic Utilitarians.
      *   *Why:* The right act minimizes total suffering/maximizes total well-being. Claims aggregate without restriction.
      *   *(Stop here)*
  *   **NO.** (One person's catastrophic loss cannot be outweighed by any number of minor inconveniences.) 
      👉 **GO TO Q3**

  ---

  ### BRANCH: THRESHOLDS & CLAIMS
  **Case C:** Same setup as Case B, but change the harm to the many.
  *   **Option 1:** **1 person** dies.
  *   **Option 2:** **1,000,000 people** each lose a finger (significant, permanent harm, but not life-threatening).

  **Q3: Does the sum of the lost fingers outweigh the one death?**
  *   **YES.** (Minor harms can aggregate to outweigh a major harm, but only once they cross a certain threshold of severity/numbers.) 
      👉 **POSITION: LIMITED AGGREGATION**
      *   *Defender:* Frances Kamm / Thomas Hurka.
      *   *Why:* Aggregation is permitted, but there is a "lexical" threshold. Small claims (headaches) never aggregate to beat big claims (death), but comparable claims (finger vs. life) might if numbers are high enough.
      *   *(Stop here)*
  *   **NO.** (Even a million fingers cannot outweigh one life. The individual claim of the one blocks the sum of the many.) 
      👉 **GO TO Q4**

  ---

  ### BRANCH: DISTRIBUTION & REASONS
  **Case D:** Return to **Case A** (1 vs. 5 dying), but add detail:
  *   The **1 person** is already destitute, suffering, and has had a terrible life.
  *   The **5 people** are well-off, happy, and have had good lives.
  *   *Saving either group brings them back to the same baseline of health.*

  **Q4: Does the 1 person's worse-off status give you reason to save them *instead* of the 5?**
  *   **YES.** (We should give priority to the worse-off, even if it means saving fewer people total.) 
      👉 **POSITION: PRIORITARIANISM**
      *   *Defender:* Derek Parfit.
      *   *Why:* Benefits matter more when they go to those who are worse off. (Note: Often hard to distinguish from Utilitarianism with "diminishing marginal utility.")
      *   *(Stop here)*
  *   **NO.** (Save the 5. The worse-off status doesn't override the numbers in a life/death rescue.) 
      👉 **GO TO Q5**

  ---

  ### BRANCH: THE SOURCE OF THE RESTRICTION
  **Case E:** Return to **Case A** (1 vs. 5 dying). Assume you must save the 5.
  *   **Question:** *Why* must you save the 5? Is it because the *total outcome* is better, or because of how individuals can complain?
  *   **Test:** If you could save the 5, but doing so required treating the 1 person unfairly (e.g., breaking a specific promise to them to free up resources), could you do it?

  **Q5: Can the 5 aggregate their claims to override the 1's individual right/claim?**
  *   **YES, BUT...** (The 5 can override the 1, but only because each of the 5 has a claim *similar in strength* to the 1. They win because they are a tie-breaker situation, not because they "sum" to a greater good.) 
      👉 **POSITION: CONTRACTUALISM (INDIVIDUALIST RESTRICTION)**
      *   *Defender:* T.M. Scanlon.
      *   *Why:* Principles must be justifiable to each individual. The one person can reject a principle that sacrifices them for the "greater good," but cannot reject a principle that saves others when their claims are equal.
      *   *(Stop here)*
  *   **NO, THE 1 CANNOT BE OVERRIDDEN BY SUMS.** (You save the 5 only because equality demands it, not because their claims sum higher.) 
      👉 **POSITION: EGALITARIANISM**
      *   *Defender:* Larry Temkin / Elizabeth Anderson.
      *   *Why:* The badness of inequality or the unfairness of the outcome drives the decision, not the sum of well-being. (Note: Often collapses into Prioritarianism in practice.)
      *   *(Stop here)*

  ---

  ### FINAL CHECK: THE ROLE OF LOTTERIES
  **Case F:** You cannot save everyone. Claims are equal (1 vs. 1 dying).
  **Q: Must you flip a coin to give each a 50% chance?**
  *   **Yes:** (Fairness requires giving each a chance to win.) -> Consistent with **Scanlon** or **Taurek**.
  *   **No:** (Only the outcome matters; if you save one, the moral requirement is met.) -> Consistent with **Utilitarianism**.

  ***

  ### INSTRUCTOR NOTES & CAVEATS
  **Where the Tree Fails to Separate Positions:**
  1.  **Prioritarianism vs. Utilitarianism:** In practice, Prioritarianism often looks exactly like Utilitarianism with "diminishing marginal utility" (a dollar helps a poor person more than a rich person). This tree forces a distinction via Case D, but sophisticated Utilitarians may answer "Yes" there too.
  2.  **Egalitarianism vs. Prioritarianism:** "Telic" Egalitarianism (equality is good in itself) and Prioritarianism (help the worse off) often recommend the same actions in rescue cases. They diverge on "Leveling Down" (making everyone equally poor), which this rescue tree doesn't capture.
  3.  **Taurek vs. Crude Fairness:** Taurek's view (numbers don't count) and a simple "fair coin" view land in the same place on Case A, but for different reasons (Taurek: no duty to the group; Fairness: duty to both individuals).

  **The Hardest Branch to Answer Honestly:**
  **Q3 (Limited Aggregation).** Most students want to say "Headaches don't outweigh Death" (Q2) but "Fingers *do* outweigh Death if there are enough of them" (Q3). However, defining *where* that threshold lies is notoriously difficult. If a million fingers outweigh a life, why doesn't a billion headaches? If you can't draw the line, you may be forced back toward Utilitarianism or Contractualism.
