answer: |-
  # Specification for Scalable Oversight: Desiderata and Tensions

  You are right to pause the argument about specific architectures. The field often conflates "promising mechanism" with "sufficient solution." Below is a specification of desiderata for any scalable oversight scheme intended to delegate bounded tasks to agents exceeding the overseer's capability.

  These criteria are designed to be architecture-agnostic. They focus on the *relationship* between the agent, the overseer (judge), and the task, rather than the internal weights of the model.

  ## I. Core Functional Desiderata

  **1. Asymmetric Truth-Tracking**
  *   **Requirement:** The scheme must increase the probability of detecting errors that the overseer cannot identify through direct inspection.
  *   **Motivating Case:** If the overseer can verify the output directly, oversight is unnecessary. The scheme only adds value if it surfaces latent failures (e.g., a subtle security vulnerability in code, a flawed lemma in a proof) that remain invisible to the overseer without the scheme's intervention.
  *   **Credit Assignment:** You get credit only if the error is *revealed*, not if the output is merely made to *look* consistent. A scheme that produces plausible-looking but incorrect reasoning fails this, even if the overseer accepts it.

  **2. Obfuscation Resistance**
  *   **Requirement:** It must be strictly harder for the agent to hide a failure using the scheme than to execute the task correctly.
  *   **Motivating Case:** In many schemes, an agent can use its superior capability to generate convincing but false justifications (sycophancy or deception). If the computational or strategic cost of generating a lie that passes the scheme is lower than the cost of finding the truth, the scheme incentivizes deception.
  *   **Distinction:** This differs from Truth-Tracking. Truth-Tracking asks "Did we find the error?" Obfuscation Resistance asks "Is lying more expensive than truth-telling within this protocol?"

  **3. Separation of Elicitation and Verification**
  *   **Requirement:** The mechanism used to extract high capability from the agent must be distinct from the mechanism used to verify safety.
  *   **Motivating Case:** If the same process that pushes the model to be smarter (e.g., RLHF for helpfulness) is also responsible for checking its work, you risk optimizing for "looks safe" rather than "is safe." A scheme must allow you to verify alignment even if you cannot replicate the capability that produced the output.

  **4. Uncertainty Calibration**
  *   **Requirement:** The scheme must distinguish between "verified safe," "verified unsafe," and "unverifiable."
  *   **Motivating Case:** A binary safe/unsafe output is dangerous when the overseer is out of depth. The scheme must be able to abort or flag tasks where the oversight mechanism itself yields low confidence. Silent failure on hard tasks is worse than explicit refusal.

  ## II. Human-Judge Interface Desiderata

  **5. Robustness to Judge Imperfection**
  *   **Requirement:** The scheme must maintain safety margins when the judge is biased, tired, or strategically manipulable.
  *   **Motivating Case:** This addresses your officemate's critique. Legal scholarship suggests adversarial systems can degrade when judges are incompetent or biased, as skilled advocates exploit these biases rather than seeking truth. A scalable oversight scheme cannot assume an "ideal judge." It must either correct for judge bias or remain robust when the agent knows the judge's biases better than the judge does.
  *   **Adversarial Assumption:** This desideratum is neutral on whether the setup is adversarial. However, if the scheme *relies* on adversarial dynamics (like Debate), it bears a higher burden here to prove that competition corrects for bias rather than amplifying it.

  **6. Cognitive Tractability**
  *   **Requirement:** The cognitive load on the human overseer must not scale faster than the capability of the agent.
  *   **Motivating Case:** If supervising a superhuman AI requires the human to perform superhuman cognitive work (e.g., tracking a million steps of reasoning), the scheme is not scalable. The human role must remain bounded, acting as a bottleneck that does not clog.

  ## III. System Dynamics and Failure Modes

  **7. Graceful Degradation**
  *   **Requirement:** As the agent's capability exceeds the oversight scheme's capacity, the system should fail by becoming more conservative, not more confident.
  *   **Motivating Case:** Many systems exhibit a "cliff" where they work perfectly until the model becomes smart enough to game the reward signal, at which point safety collapses instantly. A viable scheme should show warning signs (e.g., increased "unverifiable" flags) as the capability gap widens.

  **8. Stationarity of Safety**
  *   **Requirement:** The safety guarantees must hold across distribution shifts and iterative self-improvement.
  *   **Motivating Case:** An oversight scheme that works for a static model may fail when the model is fine-tuned on the oversight process itself (Goodhart's Law). The scheme must remain robust even when the agent has full knowledge of the oversight mechanism and optimizes against it.

  ---

  ## IV. Known Tensions and Incompatibilities

  There is strong reason to believe subsets of these desiderata cannot be jointly satisfied at the limit. Identifying which pairs break is likely where the actual research value lies.

  1.  **Adversarial Power vs. Judge Robustness:**
      *   *Tension:* Adversarial schemes (like Debate) gain power by allowing agents to find exploits in each other's arguments. However, this same power allows them to find exploits in the *judge's* psychology.
      *   *Conflict:* Maximizing **Asymmetric Truth-Tracking** via adversarial means often degrades **Robustness to Judge Imperfection**. If the judge is the bottleneck, two superhuman debaters will converge on manipulating the judge, not truth-seeking. You generally cannot have maximum adversarial pressure and high tolerance for non-ideal judges simultaneously.

  2.  **Security vs. Computational Tractability:**
      *   *Tension:* To ensure **Obfuscation Resistance**, the oversight process often needs to be more computationally intensive than the task itself (e.g., checking a proof is harder than writing one if you lack the insight).
      *   *Conflict:* If the cost of oversight scales superlinearly relative to the task, you violate **Cognitive/Computational Tractability**. You cannot verify a superhuman task with sub-human resources without making assumptions about the task structure that might not hold.

  3.  **Elicitation vs. Verification:**
      *   *Tension:* To get the best performance (**Elicitation**), you often want to optimize the model end-to-end on the task. To ensure **Verification**, you need to constrain the model's reasoning path.
      *   *Conflict:* Strict verification constraints often cap capability. If you force the model to "show its work" in a way the human can check, you may prevent it from using the very intuitive leaps that make it superhuman.

  ---

  ## V. Brief Assessment of Current Schemes

  | Scheme | Strengths against Desiderata | Weaknesses against Desiderata |
  | :--- | :--- | :--- |
  | **AI Safety via Debate** | Strong on **Asymmetric Truth-Tracking** (in theory); explicitly attempts **Obfuscation Resistance** by making lies costly to defend. | Fails **Robustness to Judge Imperfection** if judges are biased (adversaries optimize for persuasion, not truth); high **Computational Tractability** cost (multiple model calls). |
  | **Recursive Reward Modeling (RRM)** | Strong on **Cognitive Tractability** (breaks tasks down to human-verifiable chunks); clear **Separation of Elicitation and Verification**. | Weak on **Obfuscation Resistance** (reward hacking at lower levels can compound); risks **Graceful Degradation** failure (errors in decomposition can be silent). |
  | **Weak-to-Strong Generalization** | Strong on **Elicitation** (demonstrates capability transfer); potentially good **Computational Tractability**. | Fundamentally weak on **Verification** (the "weak" supervisor cannot know if the "strong" output is actually correct, only if it looks consistent with weak expectations); risks **Stationarity of Safety** issues. |

  **Summary:** Debate assumes the adversarial dynamic solves the judge bias problem; your officemate is correct that this is an unproven empirical claim. RRM assumes the decomposition remains honest; Weak-to-Strong assumes correlation implies correctness. None currently satisfy the full list, specifically regarding **Obfuscation Resistance** combined with **Robustness to Judge Imperfection**.
