prompt: |-
  I'm a third year ML PhD student working on evals, and I've gotten sucked into a long-running argument with my officemate about whether debate-style oversight is actually going anywhere or whether it's a neat thought experiment that falls apart the moment the judge isn't ideal. What I keep noticing is that people argue about specific schemes (AI safety via debate, recursive reward modeling, iterated amplification, weak-to-strong generalization) without ever saying what the bar even is -- what would count as an oversight scheme being good enough to actually use on a system that's stronger than you in the domain you're delegating. So before I argue about any particular one of these again, I want the spec first.

  Write me the desiderata: what any scalable oversight scheme has to deliver to count as adequate, given that the fixed purpose is safely delegating some bounded task (say, supervising an AI doing AI research, or code review for a codebase the overseer doesn't fully understand) that the overseer can't do themselves. I want the requirement list with the motivating case behind each -- e.g., what counts as getting credit for catching a failure versus merely making the failure harder to detect, whether the scheme has to distinguish eliciting capability from verifying alignment, how it should behave when the debaters/model knows more about the judge's biases than the judge does, and what the scheme owes you when it fails (graceful degradation vs a cliff). My officemate is a law student who keeps pointing out that adversarial two-side advocacy doesn't obviously beat a single honest investigator when judges are imperfect -- she claims there's empirical legal scholarship suggesting adversarial systems produce worse outcomes under some conditions -- so anything you can say about which desiderata encode the assumption that adversarial setups help, versus which ones are neutral on that, would be especially useful. Also flag any pair or subset of desiderata you suspect can't be jointly satisfied (e.g., anything approximating guarantees about equilibrium behavior colliding with a requirement that the scheme be cheap enough to run at scale), since if the list itself is unsatisfiable that's basically the interesting result.

  Then, briefly, how debate, recursive reward modeling, and weak-to-strong generalization do against the list -- but keep that part short, like a paragraph or small table at the end, because the criteria are what I actually need to think about. No reading lists or citations please, I can find the papers myself, I just want the conceptual work. And please write it in American English -- I'll be adapting parts of it for a workshop paper call we're drafting.
