answer: |-
  Mrs G, seventy-four, resides in a municipal care home where she spends her days listening to classic radio dramas and eating custard creams, activities she clearly enjoys despite moderate dementia that has erased her memory of the directive she signed two years prior. That document refuses antibiotics for pneumonia, stipulating she should not be kept alive if she cannot recognise her family, a condition she currently meets only sporadically. She executed the directive while bereaved and urgently promising her dying husband she would not 'linger as a burden', a conversation that left her weeping but legally capacitous and medically informed. Now bedbound with a treatable chest infection, she smiles when nurses enter the room and shows no signs of distress, yet the directive remains on file, valid under law but shadowed by the circumstances of its signing.

  **Verdicts and Reasoning**

  On the **precedent autonomy** view, the directive must be overridden. Buchanan and Brock require that the earlier choice be made independently of manipulation or insistent promises. Mrs G's decision was extracted during acute grief under the pressure of a solemn vow to her dying husband; while this did not destroy legal capacity, it compromised the independence required for moral autonomy. Because the procedural pedigree is tainted, the earlier self lacks the authority to bind the current patient, and treatment should be given to preserve the life of the person who now exists.

  On the **experiential welfare** view, the directive must also be overridden. Dresser argues that once competence is lost, moral weight rests on the current patient's experiential interests. Mrs G currently finds pleasure in radio, food, and human contact; she is not suffering. Withholding antibiotics would terminate these positive experiences prematurely. Since the demented patient has no awareness of the directive and her present life contains net positive experience, treatment serves her welfare.

  On the **critical interests** view, the directive must be honoured. Dworkin locates authority not in the procedural conditions of the choice but in its expression of the patient's critical interests—her judgement about what makes her life as a whole good. The content of the directive (avoiding life without recognition to prevent being a burden) reflects a substantive judgement about the integrity of her life narrative. That the *timing* of the decision was pressured does not necessarily negate the *truth* of the value expressed; the directive still protects her critical interest in dignity, which survives the loss of competence.

  **The Feature Doing the Work**

  The divergence is generated by the gap between the procedural conditions that validate an autonomous choice and the substantive relation between that choice and the patient's lifelong organising commitments. Precedent autonomy is sensitive to the *how* (the independence of the decision), while critical interests are sensitive to the *what* (the alignment with values constitutive of a good life). In this case, the pressure compromises the *how* without necessarily falsifying the *what*.

  This gap explains the function of the two independent knobs. If one removes the compromised provenance (supposing the refusal was written in calm circumstances), the procedural defect vanishes; precedent autonomy is satisfied and aligns with critical interests in honouring the directive. If one removes the contentedness (supposing the dementia is a vacant, unrecognising state), the experiential benefit of treatment vanishes; experiential welfare no longer recommends overriding the directive and aligns with critical interests in honouring it. Each dissenter is tied to exactly one variable: precedent autonomy to the provenance, experiential welfare to the current state.

  If this gap is closed—that is, if one assumes that only procedurally autonomous choices can reliably express critical interests—the pattern collapses. Precedent autonomy and critical interests would necessarily converge, rendering the critical-interests view merely precedent autonomy in different dress. The case demonstrates that they can come apart: a choice can be substantively aligned with a life's integrity even if procedurally imperfect.

  **The Strongest Attack**

  The strongest attack comes from the **precedent-autonomy theorist**. They would argue that Dworkin's appeal to critical interests quietly reintroduces the very decisional conditions his view was supposed to do without. To identify which interests are truly "critical" and belong to the patient, one must assess whether they were endorsed under conditions free from distortion. If Mrs G's promise to her husband coerced her into adopting a value she might otherwise have revised, then the directive does not express *her* critical interest but her husband's imposition. By honouring it regardless, Dworkin either relies on a controversial metaphysical claim about the survival of values independent of autonomous endorsement, or he implicitly assumes the decision was autonomous enough—thereby collapsing back into precedent autonomy.

  The welfare theorist's attack—that the current patient has critical interests of her own—is formidable, but it challenges the *priority* of past critical interests rather than the *coherence* of the view. The precedent-autonomy attack is more damaging to the specific purpose of this case. If critical interests cannot be identified without referencing autonomy conditions, then the critical-interests rationale is not a third view but a variant of precedent autonomy, and the constructed pattern is theoretically unstable. I take this attack to be more damaging because it strikes at the distinctness required to make the thought experiment succeed.
