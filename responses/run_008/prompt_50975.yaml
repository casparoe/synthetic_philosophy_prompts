      *   *Make sure to address the "Engineer/Surgeon" example.* Why are they responsible? Because they violated *ex-ante* protocols, not because they failed to predict the *ex-post* crash.
      *   *Tone:* Empathetic but rigorous. The user is smart; don't talk down. Treat this as a philosophical debugging session.

  7.  **Final Polish:**
