  8.  *(Final check against user prompt)*: Did I answer which step is weak? Yes. Did I explain what to give up to keep (4)? Yes.

  **(Self-Correction Note):** I need to be careful not to just say "Step 5 is wrong." I need to explain *why* it feels right but isn't. It feels right because specific critiques *are* often hindsight-biased. But general standards are not. The distinction is Specific vs. General.

