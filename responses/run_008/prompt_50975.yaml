prompt: |-
  So last spring my cousin and I each put a chunk of savings into a friend's coffeeshop startup and it collasped by fall. Since then my dad's girlfriend has made it her personal mission to explain at every family dinner that it was obviously doomed — bad location, no restaurant experience, "the writing was on the wall." I started reading about hindsight bias and the narrative fallacy partly to defend myself, and I've accidentally argued myself into something way worse than the thing I was defending. Here's the argument:

  1. Once you know an outcome, you can't help feeling it was predictable — that's hindsight bias; your memory of what the evidence actually was gets rewritten by the result.
  2. For any outcome whatsoever, you can build a story afterwards that makes it look inevitable — the narrative fallacy. If the coffeeshop had taken off, my dad's girlfriend would have had a story about the "obvious" untapped market in that neighborhood.
  3. So the availability of a causal story tells you nothing about what was knowable in advance.
  4. Since a story would have been told either way, judging my decision by its outcome tells you nothing about the decision — only the process can be judged.
  5. But judging the process is contaminated too: "you should have looked harder at the lease" just means "looking would have revealed what we now know," and we only know to say "look at the lease" because we know how things ended.
  6. So there's no neutral standpoint from which to say what anyone should have foreseen, because every such judgment is made from the far side of the outcome.
  7. Therefore nobody is ever responsible for a foreseeable bad outcome, and nobody ever really learns from history — every "lesson" is just the story the survivors tell.

  That can't be right — it would give a free pass to the engineer who skipped the inspection, the surgeon who ignored the scan, everyone who ever ignored a warning that really was there. But I've stared at this for a week and every step still looks fine to me, and honestly step (7) would get everyone off my back at dinner, which makes me suspicous of how much I want it to be true. Which step is the weak one? And if I want to keep (4) — judge the decision, not the outcome — what do I have to give up to stop the slide from there to (7)?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user invested in a failed coffee shop. A family member (dad's girlfriend) is criticizing them using hindsight bias ("it was obviously doomed").
      *   **Reaction:** The user studied cognitive biases (hindsight bias, narrative fallacy) to defend themselves.
      *   **Result:** They've constructed a logical argument (steps 1-7) that concludes *no one is ever responsible for foreseeable bad outcomes* and *no one learns from history*.
      *   **Intuition:** The user knows step (7) is wrong (it excuses negligence like skipped inspections or ignored scans).
      *   **Goal:** Identify the weak step in the argument and find a way to keep the core valid insight (judge the process, not the outcome) without sliding into total nihilism about responsibility and learning.

  2.  **Deconstruct the Argument:**
      *   *Step 1:* Hindsight bias exists. (True, well-documented).
      *   *Step 2:* Narrative fallacy exists; stories can be built for any outcome. (True, well-documented).
      *   *Step 3:* Availability of a causal story tells you nothing about prior knowability. (Mostly true, but slightly overstated).
      *   *Step 4:* Judging decision by outcome is invalid; only process matters. (Standard decision theory principle).
      *   *Step 5:* Judging process is *also* contaminated because specific process critiques ("check the lease") are generated by knowing the outcome. (This is the pivot point).
      *   *Step 6:* No neutral standpoint exists to judge foreseeability. (Strong claim).
      *   *Step 7:* Therefore, no responsibility/learning is possible. (The nihilistic conclusion).

  3.  **Identify the Weak Link:**
      *   Steps 1-4 are generally solid defenses against *unfair* criticism.
      *   Step 5 is where the logic starts to break. It conflates *specific* post-hoc critiques with *general* process standards.
      *   Step 6 is an overgeneralization. Just because *some* judgments are contaminated doesn't mean *all* are impossible.
      *   Step 7 is a non-sequitur. Even if perfect neutrality is impossible, *approximate* responsibility and *probabilistic* learning are still possible.

      *Key Insight:* The argument confuses "perfect foresight" with "reasonable foresight." It also confuses "outcome bias" (judging by result) with "process validation" (judging by established best practices *before* the result).

  4.  **Formulate the Counter-Argument (The "Fix"):**
      *   **The Distinction:** There is a difference between *specific* causal explanations generated after the fact ("The lease was bad") and *general* epistemic standards that exist before the fact ("Due diligence is required").
      *   **The Reference Class:** We don't judge decisions in a vacuum. We judge them against a reference class of similar decisions and established protocols.
      *   **Probability vs. Certainty:** Responsibility isn't about predicting the *specific* future, but about managing *probabilities*. The surgeon doesn't need to know the patient *will* die, but must know ignoring the scan *increases the risk* unacceptably.
      *   **Step 5 is the culprit:** It claims *all* process judgment is contaminated. But process standards (checklists, regulations, expert consensus) exist independently of specific outcomes.

  5.  **Drafting the Response:**
      *   **Validate:** Acknowledge the strength of the initial analysis. It's a sophisticated trap (epistemic nihilism).
      *   **Pinpoint the Break:** Step 5 and 6 are the problem. They move from "judgment is hard/contaminated" to "judgment is impossible."
      *   **Explain Why:**
          *   *Pre-existing Standards:* Process isn't just "what would have worked." It's "what is standard practice."
          *   *Reference Classes:* We judge based on what a reasonable person would do in that situation *before* knowing the outcome.
          *   *Risk vs. Outcome:* Responsibility is about risk management, not prophecy.
      *   **Address the "Learning" aspect:** We *can* learn, not by creating deterministic narratives, but by updating base rates and probabilities.
      *   **Practical Advice:** How to handle the dinner table. Use the "Process vs. Outcome" distinction without accepting the nihilistic conclusion.

  6.  **Refining the Logic (Self-Correction during drafting):**
