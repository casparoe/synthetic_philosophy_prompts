  1. "What each side actually claims"

  The Formalists contend that expected utility theory (EUT) claims to provide a universal normative standard for rational choice. If a precisely described gamble yields an undefined expectation because the series is only conditionally convergent, the theory fails its own coherence criteria. They argue that rationality shouldn't depend on physical contingencies like bankroll limits. They concede that no casino offers this game, but insist that a theory of rationality must handle logically possible scenarios to be fundamental. If EUT cannot rank the Pasadena game against refusing to play, it is incomplete. They concede Pragmatists can make decisions in practice, but deny this saves the theory's foundations.

  The Pragmatists respond that EUT is a tool for embedded agents in physical worlds. Infinite gambles violate physical constraints; thus, the pathology is an artifact of over-idealization, akin to singularities in fluid dynamics. They concede the mathematics is peculiar but argue normative force dissolves outside the theory's domain of applicability. For them, a theory isn't broken because it fails in impossible worlds, only if it fails in possible ones. They argue the natural ordering (temporal sequence of flips) resolves the convergence, or simply that truncation restores standard expectations. Both sides agree the math is correct; they disagree on whether mathematical pathology in impossible cases constitutes a theoretical failure. Pragmatists concede Formalists have a mathematical point, but deny it has normative weight.

  2. "The locus of the disagreement"

  This is not merely a methodological dispute about modeling standards; it is a substantive disagreement about the metaphysics of normativity. The user's hypothesis identifies the surface tension—exact theorem versus engineering approximation—but misses the underlying conflict about whether rationality is context-independent. The Formalists treat rationality as Platonic: principles of coherence must hold across all logically possible worlds, regardless of physical implementability. For them, a Dutch Book argument or an undefined expectation is a fatal logical flaw, similar to a contradiction in ethics. The Pragmatists treat rationality as Naturalistic: norms are derived from the constraints of agents operating in physical environments. For them, a "flaw" that only appears when violating physical laws is not a flaw in the norm, but a sign the norm is being misapplied.

  The disagreement also hinges on the status of the "ordering" problem. Formalists argue the game description specifies outcomes and probabilities, but not a summation order; thus, the value is genuinely indeterminate. Pragmatists argue the causal structure (flip 1, then flip 2) imposes a natural order, making the standard sum the only physically relevant one. This reveals a deeper split: is decision theory abstract mathematics or causal modeling? If the former, the Formalists win; if the latter, the Pragmatists win.

  Furthermore, the engineering analogy is imperfect. In physics, models predict observations; if a singularity doesn't affect observation, it's ignored. In decision theory, the goal is often normative guidance, not just prediction. We accept ethical thought experiments (trolley problems) that are physically unrealistic because they test principles, not outcomes. The Formalists treat the Pasadena game like a trolley problem; the Pragmatists treat it like a frictionless plane. Because decision theory straddles ethics and physics, the parties talk past each other. Empirical evidence is irrelevant here; no experiment can settle a normative claim. The standoff persists because neither side accepts the other's criteria for what counts as a successful theory of mind. Consequently, the disagreement is about starting intuitions that neither side can argue for without begging the question. To convince a Formalist, you must show physical constraints matter for logic. To convince a Pragmatist, you must show logical coherence matters without physical instantiation. Neither move is available.

  3. "What would count as progress"

  Progress requires shifting the debate from "what is the expected value" to "what decision rule handles undefined values." A specific result would be a dominance principle that holds even when expectations are undefined. If one can prove that rejecting the Pasadena intuition leads to violating weak dominance in finite approximations, the Pragmatist position weakens. Conversely, if accepting the Formalist view forces agents to reject gambles that dominate cash in every finite truncation, the Formalist position weakens.

  Alternatively, a reformulation of EUT using finite additivity rather than countable additivity might dissolve the paradox, as conditional convergence issues often rely on infinite sums. De Finetti argued for finite additivity precisely to avoid such pathologies. If a coherent decision theory can be built on finite additivity that handles Pasadena without contradiction, the Formalist claim of "incompleteness" loses force. However, if the core disagreement is metaphysical, no technical fix will suffice. The debate will only move if one side concedes that their definition of rationality is too narrow or broad. Ultimately, progress looks like a new axiom set that preserves the Pragmatist's physical intuition while satisfying the Formalist's coherence demands, or a consensus that such a set is impossible. Without this, we expect only restatement.

  4. "Verdict on my hypothesis"

  Your hypothesis is substantially correct but underestimates the normative stakes. It is not just "theorem vs. engineering"; it is "universality vs. embedding." The engineering analogy works for prediction, but decision theory also claims to define rationality. If rationality is universal, the Formalists win. If it is embedded, the Pragmatists win. The standoff persists because both claims are plausible. You are right that no new theorem will solve it, because the dispute is about which theorems matter. The methodology is the substance here. However, calling it merely methodological suggests it could be resolved by agreeing on methods. It cannot, because the methods follow from the metaphysics. The dispute is about the status of idealizations, yes, but specifically whether idealizations reveal truth or distort it. Your diagnosis is right on the mechanism, but wrong on the depth; this is a philosophical rift, not a technical one.
