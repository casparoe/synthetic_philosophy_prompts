          *   *Diagnosis:* This touches on *Computational/Information Theoretic* definitions of randomness vs. determinism.

      *   **Point 4: Free Will/Open Future.**
          *   Friend: Uses chaos + QM to argue for an open future/free will.
          *   User: Sees this as motivation, not argument.
          *   *Diagnosis:* Likely *Motivational/Stakeholders* rather than logical premise. Chaos + QM $\neq$ Free Will (conflation of randomness with agency), but it does support "Open Future" (indeterminism).

  3.  **Evaluate the "Types" of Disagreement:**

