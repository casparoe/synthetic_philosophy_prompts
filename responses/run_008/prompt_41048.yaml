      *   *The Empirical Question:* Does QM noise amplify? (Yes, generally accepted in sensitive systems, but decoherence fights it). This is secondary to the idealization point.
      *   *The Substantive Modal Question:* Is a probabilistic future "open"? Yes, if probability is ontic.
      *   *The Algorithmic Claim:* Friend is technically shaky here. Deterministic chaos is computable *if* you have infinite precision reals. If physics is discrete/finite, then it's different.
