      *   *Idealization?* Yes, crucially. Is the classical continuum (real numbers with infinite precision) physically real? Most physicists say no (Bekenstein bounds, Planck length). Philosophers of physics often debate this.
      *   *Substantive Modal?* Yes. If the state is fundamentally probabilistic, is the future "open"? This is the interpretation of probability (epistemic vs. ontic).

