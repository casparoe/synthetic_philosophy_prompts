  **(Self-Correction during drafting):** I need to be careful not to say Dennett is a hard-line binary realist about *everything*. He's a pragmatist. But "Real Patterns" specifically argues against the idea that there's a fuzzy metaphysical cloud. The pattern is real if it pays its rent. If it pays *some* rent but not enough to beat the physical stance, it's not a real pattern *in that context*.
  Actually, Dennett explicitly discusses "noisy" patterns. He says a pattern can be real even if it's not perfect. But is it "0.4 real"? No. It's a real pattern with noise. The *reality* is binary (it exists as a pattern), the *fidelity* is graded. I need to make sure the user sees this distinction.

  Let's sharpen the "compression" critique. The user thinks compression = shortness. But in information theory (which Dennett leans on), compression = shortness *given perfect reconstruction*. If you lose data, it's lossy compression. Dennett allows lossy compression (prediction isn't perfect), but if the loss is too high, the pattern dissolves.
  So, the user's "40% real" is actually "40% accurate prediction." That's not ontological degrees.

