  2.  **Deconstruct the User's Proposal:**
      *   *Idea:* Realness of a pattern is proportional to the compression ratio (Intentional description length vs. Physical description length).
      *   *Motivation:* The janky vacuum case. The intentional stance works, but not *well*. It's noisy. Is it less of an agent?
      *   *Teacher's Objection:* Patterns are binary. Either the pattern is real (predictively useful enough to earn its keep) or it's noise.
      *   *User's Worry:* Is the teacher right? Does "degrees of realness" trample Dennett's point?

  3.  **Evaluate Dennett's Position (Mental Check):**
      *   Dennett is an instrumentalist/real-pattern realist.
      *   "Real Patterns" (1991) is the key text.
      *   Key criterion: *Predictive power* vs. *Cost of computation*.
      *   Does Dennett allow degrees?
          *   He talks about "noisy" patterns.
          *   He talks about "indeterminacy" of belief (e.g., the *ex hypothesi* case of radical translation).
          *   He explicitly rejects the idea that there is a *fact of the matter* about exact belief content in borderline cases.
          *   However, does he say a pattern is "50% real"? Usually, he says a pattern is real if it yields a *net gain* in predictive power. Below that threshold, it's noise.
          *   So, the *existence* of the pattern might be binary (above/below threshold), but the *quality* or *fidelity* of the pattern varies.
      *   The user's specific formulation ("40% real") is likely category confusion. Reality isn't a percentage. *Utility* is a gradient.

  4.  **Evaluate the Vacuum Case:**
      *   User says: Intentional story is "way shorter" but "pathetic compression."
