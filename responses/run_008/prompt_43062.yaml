      *   Physical story: Sensor data streams, motor voltage fluctuations, code loops. That's long.
      *   Even a broken vacuum has a massive compression ratio. The user might be underestimating the physical complexity.
      *   However, the *predictive power* drops. If it bumps 50% of the time, the intentional stance predicts "it will try to go around." Does it succeed? No. So the stance predicts the *attempt*, not the *outcome*.
      *   If the noise is too high, the intentional stance stops being the *best* tool. Maybe the "design stance" (it's broken code) is better.

  5.  **Formulate the Pushback (The "Hard" Part):**
      *   *Point 1: Category Error.* "Realness" isn't a scalar quantity like length or weight. It's more like "being a prime number." You are or you aren't. A pattern is a structure that stands out from noise. If it doesn't stand out enough, it *is* noise.
      *   *Point 2: Compression vs. Noise.* Dennett cares about *signal-to-noise ratio*, not just file size. You can have a short description that predicts nothing (e.g., "It does whatever"). That's maximum compression, zero reality. The user is focusing on description length, ignoring predictive accuracy.
      *   *Point 3: The Threshold.* The teacher is closer to Dennett. There is a threshold of utility. Below it, you aren't a "borderline agent," you are just a physical object. Above it, you are an agent. The *degree* lies in the *reliability*, not the *ontology*.
      *   *Point 4: The Vacuum.* The vacuum isn't a case of weak compression; it's a case of *failed* design. The intentional stance attributes rationality. If the system is systematically irrational (buggy), the intentional stance might actually be the *wrong* stance. The Design Stance ("it's malfunctioning") is better.

