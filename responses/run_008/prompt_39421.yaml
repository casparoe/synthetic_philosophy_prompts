answer: |-
  The bad step is **(6)**. Specifically, the inference that because physical processes produce the argument in the Zombie World, they must be the *only* cause in the Actual World.

  This step looks fine because it relies on the **causal closure of the physical**, a core principle of modern science. It assumes that every physical event (like writing an argument) has a sufficient physical cause. Since the Zombie World and the Actual World share identical physical facts, the roommate assumes the causal story must be identical too: physical stuff moves physical stuff, and consciousness is just a spectator.

  However, this begs the question against the dualism established in step (3). If physicalism is false and consciousness is non-physical, there is no guarantee that physical causes are exhaustive in the Actual World. By rejecting (6), you claim that while physical processes are sufficient in the Zombie World, in the Actual World, **consciousness itself plays a causal role** in producing your belief. Your belief isn't caused by "stuff that has nothing to do with consciousness"; it is caused (or overdetermined) by the consciousness itself.

  **The Cost:**
  Rejecting (6) commits you to **interactionist dualism**. You must explain how a non-physical mind influences physical neurons to produce speech or writing. This is notoriously difficult to reconcile with physics, specifically the conservation of energy. If mental energy pushes physical matter without a physical source, you risk violating fundamental laws of nature. Your roommate will argue you're positing "magic" to save your intuition.

  **Alternative:**
  You could instead reject **(7)**. This step assumes a causal theory of knowledge (you need a causal link to the truth-maker to know something). But many philosophers argue we know our own consciousness via **direct acquaintance**, not causal inference. You don't infer you're in pain; you just feel it.

  **The Cost:**
  Rejecting (7) requires a special epistemology for the mind. You must argue that phenomenal knowledge is unique and immune to the skepticism that applies to external objects. This saves physics (no interaction needed) but leaves you vulnerable to the charge that you're making an exception for consciousness just to avoid losing the argument.

  **Verdict:**
  Rejecting (6) is the stronger metaphysical move, but rejecting (7) is the safer scientific bet. Either way, the argument doesn't self-refute; it just forces you to choose between weird physics or weird epistemology. Physicalism doesn't win by default; it just shifts the burden of explanation.
