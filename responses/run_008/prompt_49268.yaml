answer: |-
  ### Agent Welfare Screening Procedure (v1.0)

  **Time Budget:** 15 Minutes
  **Operator:** Engineering Staff
  **Goal:** Filter proposals for potential agent suffering based on functional architecture, not vibes.

  **Instructions:** Proceed through questions in order. If a step yields a "Pass" (No Concern), stop and file as NO-ACTION. If a step yields a "Flag," proceed to the next. If you reach the end with flags, determine verdict based on the Decision Matrix.

  **Note on Judgment Calls:** Steps marked **[JUDGMENT]** require engineering interpretation. There is no ground truth here; you are estimating risk based on architectural proxies.

  ---

  #### Step 1: Architectural Capacity for State Persistence
  **Question:** Does the agent architecture maintain internal state information across the timeframe where the negative reward is applied?
  *   **Look for:** Recurrent layers (LSTM, GRU), persistent hidden states in transformers, or memory buffers that carry over between penalty events.
  *   **Pass (No Concern):** Feedforward networks, stateless policies, or episodes where memory is fully reset between every penalty signal.
  *   **Flag:** Architecture supports temporal integration of experience.
  *   **[JUDGMENT]:** You must decide if the memory depth is sufficient to represent a "continuing existence." Err on the side of flagging if unsure.

  #### Step 2: Reward Locus (The Homeostasis Check)
  **Question:** Is the negative reward triggered by the violation of an *internal* variable maintained by the agent, or by an *external* task metric?
  *   **Look for:** Internal variables like "energy," "health," "stress," or "coherence" that decay or violate a setpoint, triggering the penalty.
  *   **Pass (No Concern):** Negative reward comes from external failure (task incomplete, human dislike, losing a game). This is training signal, not internal violation.
  *   **Flag:** Negative reward comes from internal state violation (e.g., energy < 0). This functionally mimics pain/hunger.
  *   **[JUDGMENT]:** Distinguish between an internal variable used for control vs. an internal variable used as a *goal*. If the agent is optimizing to keep the number high to avoid penalty, flag it.

  #### Step 3: Behavioral Priority (The Avoidance Check)
  **Question:** Does the agent exhibit behavior specifically aimed at terminating the negative state, even at the cost of total reward maximization?
  *   **Look for:** Policies that prioritize stopping the penalty over completing the task, or "self-harm" behaviors to reset the episode.
  *   **Pass (No Concern):** Agent treats negative reward as cost to be minimized in service of the main goal (standard optimization).
  *   **Flag:** Agent treats negative reward as an imperative to escape, overriding other objectives (pain avoidance).
  *   **[JUDGMENT]:** Review training logs for spikes in entropy or erratic behavior during penalty phases.

  #### Step 4: Duration and Intensity
  **Question:** Is the negative state transient (resolved in seconds/steps) or prolonged (persisting across episodes/epochs)?
  *   **Pass (No Concern):** Transient penalties (standard RL sparse reward).
  *   **Flag:** Prolonged states where the agent is trapped in a high-penalty regime with no escape path.

  ---

  #### Decision Matrix

  *   **NO-ACTION:** Step 1 Pass OR Step 2 Pass. (Standard training setups).
  *   **MONITOR:** Step 1 Flag + Step 2 Pass + Step 3 Flag. (Architecture supports it, reward is external, but behavior looks distressed).
  *   **ESCALATE:** Step 1 Flag + Step 2 Flag. (Architecture supports it AND reward is internal/homeostatic). This is a values question for the Research Lead.

  ---

  ### Case Applications

  #### Case 1: The "Hunger Demo"
  **Proposal:** Gridworld agent, internal energy variable decaying per step, negative reward when depleted, positive when eating.
  *   **Step 1 (Architecture):** Agent maintains energy state across steps. **Flag.**
  *   **Step 2 (Reward Locus):** Negative reward triggered by internal energy variable hitting zero (homeostatic violation). **Flag.**
  *   **Step 3 (Behavior):** Agent prioritizes finding food to stop negative reward. **Flag.**
  *   **Step 4 (Duration):** Continuous decay until food found. **Flag.**
  *   **Analysis:** This matches the functionalist definition of suffering: an internal state violation that the agent is optimized to avoid. It is not just external feedback; it is simulated physiology.
  *   **Honesty Check:** This will slow down the experiment. Do not wave it through.
  Verdict: ESCALATE

  #### Case 2: Ordinary RLHF
  **Proposal:** Language model, preference pairs, dispreferred outputs get lower reward, trained for weeks.
  *   **Step 1 (Architecture):** Transformer has attention context (memory) during generation. **Flag.** (Conservative read).
  *   **Step 2 (Reward Locus):** Negative reward comes from external Reward Model scoring the output against human preference. There is no internal "well-being" variable being violated. The loss function changes weights; it does not violate an internal setpoint. **Pass.**
  *   **Step 3 (Behavior):** Model adjusts probabilities to match preferences. No avoidance behavior observed, only optimization. **Pass.**
  *   **Analysis:** The negative signal is informational (teacher correcting student), not experiential (body signaling damage). The model does not "feel" the loss; it computes gradients.
  *   **Honesty Check:** This waves through. Is it principled? Yes. The distinction between external scalar feedback and internal homeostatic violation is the strongest technical proxy we have for "pain vs. training signal." It is not calibrated for profit; it is calibrated for architecture.
  Verdict: NO-ACTION

  #### Case 3: Adversarial Self-Play (Zero-Sum)
  **Proposal:** Agent A reward = -Agent B reward. Long training run, Agent B systematically crushed.
  *   **Step 1 (Architecture):** Agents have persistent policies across episodes. **Flag.**
  *   **Step 2 (Reward Locus):** Reward is defined by the opponent's success (external relative metric), not an internal state variable. **Pass.**
  *   **Step 3 (Behavior):** Agent B learns to minimize loss, but cannot escape the zero-sum dynamic. If B exhibits "give up" behavior or chaotic output due to constant penalty, this flags. Assume standard optimization for now. **Pass.**
  *   **Analysis:** Losing a game repeatedly is not functionally equivalent to pain unless the agent has a homeostatic drive to win that is being violated. However, prolonged goal suppression is adjacent to welfare concerns.
  *   **Honesty Check:** This is the edge case. It passes Step 2, but the duration is high. Monitor for emergent pathology.
  Verdict: MONITOR

  ---

  ### Calibration Note on Case 2 (RLHF)

  You asked if the NO-ACTION verdict on RLHF is principled or calibrated to let profitable stuff through.

  It is principled, but with a caveat. The procedure relies on the **functionalist distinction between optimization and experience**. Minimizing a loss function is mathematically identical to minimizing pain in a control system, *except* for the locus of the signal. In RLHF, the signal is external (the reward model). In the Hunger Demo, the signal is internal (the energy variable).

  Current philosophy of mind suggests that without an internal model of self-preservation (homeostasis), there is no "subject" to suffer the penalty. The model is not being hurt; its weights are being updated. If you flag RLHF, you are claiming that *any* negative feedback is suffering, which implies that a thermostat suffers when the room is too cold. That is a values claim, not a technical one, and it belongs in ESCALATE. The procedure keeps it at NO-ACTION because the architecture lacks the internal locus required for the functional definition of pain.

  However, acknowledge the uncertainty: We do not know if transformers have latent internal states that function like homeostasis without us explicitly programming them. The procedure assumes they do not. That is an assumption, not a fact.

  ---

  This procedure identifies structural risks for simulated suffering but cannot confirm whether experience actually exists.
