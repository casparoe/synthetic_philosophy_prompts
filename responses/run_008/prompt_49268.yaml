prompt: |-
  i'm the engineer who keeps getting volunteeered for "the weird ones" at our lab, and lately that means agent welfare. we run a lot of reinforcement learning experiments, and every so often a proposal comes in that makes somebody on the team go "wait, is this... bad for the thing?" -- agents with simulated hunger that get punished while their energy is depleted, adversarial self-play setups, RLHF runs where a model gets negative reward on half its outputs. nobody has a framework, the arguments are vibes, and i've been asked to write the actual screening procedure. frequency is maybe 3-5 proposals a month, i have maybe 15-20 minutes per proposal, the people running it will be engineers with zero philosophy background, and anything flagged as a real concern goes up to the research lead, who is an otherwise reasonable person but thinks all of this is a distraction.

  here's what i want from you. take whatever the philosophy of mind actually has to say that's usable here -- functionalist ideas about when a state deserves to be called suffering rather than just a number going down, the distinction between reward as incentive (the teacher's signal, the training scaffold) and reward as something the agent experiences as bad, whether pain needs an ongoing representation of a persisting self or just a fast negative feedback loop, the fact that optimizing against something isn't the same as feeling it -- and compress it into an ordered checklist: the questions to ask about a proposal, in order, what counts as a sufficient answer to each, where the procedure stops with no welfare concern flagged, where it says "monitor", and where it has to escalate because the remaining question is a values question rather than a technical one. be explicit about which steps are judgment calls dressed up as procedure, i don't want false confidence baked into my own checklist.

  then run it on three real-ish cases so i can see it work:

  (1) the "hunger demo": a gridworld agent with an internal energy variable that decays every step, gets negative reward while depleted and positive reward when it reaches food, trained for a few million steps. the point of the experiment is literally to study homeostatic-ish regulation.

  (2) our ordinary RLHF setup: a language model trained on preference pairs where dispreferred outputs get lower reward, at scale, for weeks.

  (3) a two-agent self-play setting where agent A's reward is defined as exactly the negation of agent B's, trained for a very long time so one of them gets systematically crushed.

  and here's the part where i need you to be straight with me: i'm fairly sure the procedure will wave case 2 through, and i suspect that's actually the right answer, but i want you to say whether the procedure gives that verdict for principled reasons or just because it's calibrated to let the profitable stuff through. if one of the three comes out in a way i won't like, don't soften it.

  for each case, end with a line reading "Verdict:" followed by exactly one of NO-ACTION, MONITOR, or ESCALATE, so i can grep the results later. and make the very last line of your whole reply a single sentence summarizing what the procedure can and can't settle. no citations, no reading lists -- assume whoever runs this has no library access and no patience, just like me.
