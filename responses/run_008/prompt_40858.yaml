  I'm in a grad reading group on Bayesian epistemology (five of us: decision theory people, one psychology person) and we've spent two sessions now arguing about how to update on evidence that isn't a clean proposition you learn with certainty. I've collected my gut verdicts on a bunch of cases and I want someone to tell me whether there's a single update rule behind them or whether I'm fooling myself. You're a formal epistemologist, so be precise, but brainstorm the candidate rules out loud before you commit to one.

