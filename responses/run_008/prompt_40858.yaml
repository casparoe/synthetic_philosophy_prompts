answer: |-
  There is a single principle behind your verdicts: you are implicitly performing Bayesian conditionalization on the *event of receiving the evidence signal*, modeling the reliability and generation mechanism of that signal, rather than conditioning on the semantic content of the signal itself.

  Your intuition to distinguish "channel output" from "what the output is about" is correct; formal epistemology often fails here by trying to update on propositions (the "aboutness") rather than events (the "output"). The unified rule is **Likelihood Conditioning**: $P_{new}(H) \propto P_{old}(H) \times P(\text{Signal} | H)$. The "Signal" is the physical occurrence (utterance, sensory experience, radio burst), and the likelihood term $P(\text{Signal} | H)$ encodes all pragmatics, reliability, and channel structure.

  Here is how this principle resolves your pile, where it saves your verdicts, and where it overturns standard literature.

  **1. The Noisy Friend and the Detective (Cases 1 & 3)**
  Your verdicts are correct and unified. In Case 1, you condition on "Friend says 'Heads'", not "Heads". The likelihood ratio is determined by the friend's reliability (0.8 vs 0.2). In Case 3, you condition on "Detective says 'If Husband, then Garage'". The logical form is identical to Judy Benjamin, but the likelihood function differs because the detective is a rational agent. $P(\text{Utterance} | \text{Husband})$ is high (he knows relevant facts); $P(\text{Utterance} | \neg \text{Husband})$ is low (he wouldn't waste time implying guilt otherwise). The update raises $P(\text{Husband})$ because the signal is more likely under guilt. The rule is identical; the likelihood models differ.

  **2. Judy Benjamin and the Swamp (Case 2)**
  Your gut verdict ($P(\text{Red}) = 0.5$) is defensible, but it relies on a specific assumption about the channel that INFOMIN ignores. INFOMIN minimizes relative entropy subject to the constraint $P(HQ | \text{Red}) = 2/3$. It treats the constraint as the *only* information, effectively assuming the message generation is sensitive to the probability distribution itself, which forces mass toward the less constrained option (Blue) to minimize information gain.
  However, if you model the radio as an exogenous signal—meaning the probability of receiving this specific structural info about Red is independent of whether you are in Red or Blue ($P(\text{Message} | \text{Red}) = P(\text{Message} | \text{Blue})$)—then Likelihood Conditioning dictates $P(\text{Red})$ remains unchanged. The information is purely intra-Red.
  **Verdict:** I save your gut verdict but overturn the idea that it follows from the logical form alone. It follows from the **Independence Assumption** (the radio broadcasts Red-structure regardless of your location). If the radio only broadcasts info about the territory you are *actually* in, $P(\text{Red})$ should go to 1. Your gut assumes the former protocol; the literature often assumes the latter or ignores the channel entirely.

  **3. The Symmetric Swamp**
  Your confidence here is the key to unlocking the asymmetric case. If the radio gives the 2:1 message for *both* territories, you receive two signals. If the signals are exogenous (broadcast regardless of location), $P(\text{Red})$ stays 0.5. This confirms that the update rule preserves the prior when the likelihood ratio is 1.
  Does this deliver the asymmetric answer? Yes, *if and only if* you maintain the Independence Assumption. In the asymmetric case, receiving info on Red but silence on Blue only leaves $P(\text{Red})$ at 0.5 if the probability of receiving "Red Info" is equal to the probability of receiving "Blue Info" (or silence) across both states. If the protocol is "Report on Red always, never report on Blue," then $P(\text{Message} | \text{Red}) = P(\text{Message} | \text{Blue}) = 1$, and $P(\text{Red})$ stays 0.5. If the protocol is "Report on your territory," then $P(\text{Message} | \text{Red}) = 1$ and $P(\text{Message} | \text{Blue}) = 0$, and $P(\text{Red})$ goes to 1. Your flip-flopping stems from uncertainty about the radio's protocol, not the update rule.

  **4. The Dim Cloth (Cases 4 & 5)**
  These are consistent under Likelihood Conditioning, but Case 4 is an idealization.
  *   **Case 4:** You treat the sensation "Feels 70% Green" as the signal. You implicitly assume a likelihood function where $P(\text{Feel 70%} | \text{Green})$ dominates such that the posterior is 0.7. This is effectively Jeffrey Conditioning where the input probabilities are taken as rigid.
  *   **Case 5:** You introduce calibration data. This modifies the likelihood function *before* the update. You know $P(\text{Green} | \text{Feel 70%}) = 0.6$ from past frequencies.
  *   **Resolution:** The discounting happens **before** the update. You use the calibration data to construct the likelihoods $P(\text{Signal} | \text{World})$, then apply standard Bayes. Jeffrey Conditioning (Case 4 style) is inappropriate when you have calibration data because it treats the subjective feeling as rigid evidence rather than a noisy signal. Case 5 is the rigorous application; Case 4 is valid only when calibration data is unavailable or ignored.

  **5. Unlisted Cases: Disjunction vs. Conditional**
  You asked whether "Either not tossed or Heads" ($\neg T \lor H$) differs from "If tossed, Heads" ($T \to H$).
  *   **Flat Disjunction:** Treat this as learning a proposition with certainty. Condition on $\neg T \lor H$. This eliminates the world $(T, \neg H)$. $P(H)$ rises (unless $P(T)=0$).
  *   **Conditional:** Treat this as receiving a signal that constrains the conditional probability. Following Adams' Thesis, this often sets $P(H | T) = 1$.
  *   **Prediction:** They should be treated differently because the likelihood of a speaker uttering a disjunction vs. a conditional differs across worlds. A speaker says "If $T$ then $H$" when they know the connection; they say "$\neg T \lor H$" when they know the material fact but perhaps not the mechanism. If you learn the disjunction as a brute fact (e.g., written on a wall), condition on the proposition. If learned as an assertion, model the speaker. In most practical contexts, the conditional raises $P(H)$ less than the disjunction because the conditional is compatible with $\neg T$ worlds in a way that doesn't eliminate them, whereas the material conditional eliminates $(T, \neg H)$ strictly. However, under Likelihood Conditioning, the difference collapses to: "How likely is the speaker to say sentence A vs sentence B in world W?"

  **Summary of Verdicts**
  *   **Save:** Cases 1, 3, 5.
  *   **Save (with caveat):** Case 2. Your 0.5 verdict is correct *given* the assumption that the information source is independent of the Red/Blue partition. The literature's <0.5 verdict assumes a different information structure (INFOMIN minimizes global information gain, implicitly treating the constraint as endogenous).
  *   **Refine:** Case 4. It is not a different rule from Case 5; it is Case 5 with an assumed identity likelihood function.
  *   **Overturn:** The idea that there is a conflict between logical form and pragmatics. There is no conflict; the logical form is merely one input into the likelihood function $P(\text{Signal} | \text{World})$.

  **Bottom Line for Thursday:** Argue that the group is trying to find a rule that operates on *propositions* (conditionals, constraints) when the correct rule operates on *signals* (utterances, experiences). Once you model the channel (Friend reliability, Detective pragmatics, Radio protocol, Visual calibration), standard Bayesian Conditionalization handles every case without needing Jeffrey Conditioning, INFOMIN, or special conditional update rules. Your gut on Judy Benjamin is right because you are assuming an exogenous channel; the math pushing $P(\text{Red})$ down ignores the channel structure.
