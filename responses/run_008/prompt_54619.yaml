answer: |-
  **SCENE:** *A windowless committee room, 4:30 PM. The whiteboard is covered in half-erased utility frontiers. Two coffee cups sit empty. ALEX (Nash proponent) and BLAKE (Kalai-Smorodinsky proponent) are staring at a single sheet of paper: the proposed settlement recommendation.*

  **ALEX:** We have to file this by five. If we don't sign off on a single recommendation, the Dean appoints an external arbitrator. And you know what external arbitrators do.

  **BLAKE:** They split the difference. Literally. Midpoint of the frontier. Which is worse than either of our proposals.

  **ALEX:** Exactly. So we need to agree. My draft recommends the Nash solution. It's $(60, 60)$. It's symmetric, it's Pareto efficient, and it maximizes the product of gains. It's the focal point.

  **BLAKE:** It's the focal point because everyone learned it in first-year micro. But look at the feasible set, Alex. The frontier runs from $(60, 60)$ to $(75, 40)$. The Administration's maximum possible utility is 75. The Union's maximum is 60. The ideal point is $a = (75, 60)$.

  **ALEX:** Which is unattainable. Nobody is getting $(75, 60)$. It's outside the set.

  **BLAKE:** That's exactly why Kalai-Smorodinsky is the right normative benchmark here. We draw the line from disagreement $(0,0)$ to $a$. The slope is $60/75 = 0.8$. Intersect that with the frontier $u_2 = -4/3 u_1 + 140$, and you get $(65.625, 52.5)$.

  **ALEX:** I know the arithmetic. I checked it. You're giving the Admin an extra 5.6 utility units at the expense of the grad workers.

  **BLAKE:** I'm giving the Admin what their bargaining leverage dictates. Their ceiling is higher. In this contract, they have more room to concede without breaking the budget. Nash ignores that. Nash stays at $(60, 60)$ even if I change the Admin's maximum utility from 75 to 100, as long as the frontier segment near $(60,60)$ doesn't change.

  **ALEX:** That's Independence of Irrelevant Alternatives (IIA). And it's a feature, not a bug. If we remove options that nobody was going to choose anyway—like those hypothetical deals where the Admin gets 100 but the Union gets nothing—the solution shouldn't jump around. Stability matters.

  **BLAKE:** Stability for whom? That's the problem with IIA. It violates Individual Monotonicity. If my maximum possible payoff increases, and yours stays fixed, and the feasible set expands only in my favor... my payoff under Nash can stay flat while yours stays flat. But under KS, my payoff rises. I capture some of the surplus created by my improved outside options.

  **ALEX:** But "improved outside options" is doing a lot of work. You're treating the ideal point as a claim. "I *could* get 75, so I deserve more of the 60." But you can't get 75 unless I get 40. Why should the fact that you *could* screw me over harder give you more bargaining power in a cooperative solution?

  **BLAKE:** Because bargaining isn't just about the current pie. It's about the threat of walking away to a different pie. The ideal point summarizes the relative strength of our best-case scenarios. If the Admin has a higher ceiling, it means they have more resources to deploy. Ignoring that ceiling is pretending the power imbalance doesn't exist.

  **ALEX:** *(Pauses, taps pen on the table)* Okay. I'll concede that in a *normative* arbitration context, ignoring power imbalances can look naive. If our job is to recommend a "fair" settlement, and fairness accounts for leverage, KS has a point.

  **BLAKE:** Thank you.

  **ALEX:** But. You're assuming the ideal point is robust. What if the Admin adds a dummy option to the proposal list? A deal that gives them 90 and the Union 0. It's not feasible, maybe it's illegal, but it's on the table initially. That shifts your ideal point to $(90, 60)$. The KS line steepens. The intersection moves further in the Admin's favor.

  **BLAKE:** *(Frowns)* If it's not feasible, it shouldn't be in the set $S$.

  **ALEX:** But who defines $S$? In a real negotiation, parties throw out anchor points constantly. "We could just fire everyone and automate." That's a threat, it defines a theoretical maximum for them. If you let the ideal point be determined by the most extreme demand rather than the Pareto frontier, you invite gaming. Nash is immune to that. IIA means I can't manipulate the outcome by adding absurd options I know will be rejected.

  **BLAKE:** That's a fair hit. The ideal point is sensitive to the comprehensiveness of the feasible set. If we haven't mapped the boundary perfectly, KS is unstable. But Alex, look at the disagreement point $d=(0,0)$. You think Nash is immune to manipulation there?

  **ALEX:** The disagreement point is the status quo. No contract, no pay.

  **BLAKE:** Is it? The Union can threaten to strike. That's costly for them, too. But if they burn their own surplus—stage a walkout that hurts their own reputation just to shift $d$—Nash moves immediately. In fact, Nash is *more* sensitive to $d$ than KS is to $a$. A small shift in $d$ changes the Nash product maximization. KS at least normalizes by the range.

  **ALEX:** *(Sighs)* Touché. Commitment tactics on the disagreement point are the classic critique. But that's a problem of implementation, not the solution concept. We are arbitrators. We fix $d$. We fix $S$. Given those, Nash is the only one satisfying IIA, Symmetry, Pareto, and Invariance.

  **BLAKE:** And KS satisfies Pareto, Symmetry, Invariance, and Individual Monotonicity. We're swapping one axiom for another. The question isn't which math is prettier. It's what this committee is *for*. Are we predicting what they would agree to if left alone? Or are we telling them what they *should* agree to?

  **ALEX:** If we're predicting, we shouldn't be using either of these. We should be running a Rubinstein alternating-offers model.

  **BLAKE:** *(Groans)* Don't.

  **ALEX:** I'm serious. If we knew the discount factors...

  **BLAKE:** We don't. And even if we did, do you really think the Admin and the Union are calculating subgame perfect equilibria? They're looking for a Schelling point. They want a rule that feels fair.

  **ALEX:** Exactly. And Nash is the standard fairness benchmark. "Split the surplus."

  **BLAKE:** "Split the surplus" implies the surplus is symmetric. But look at the geometry again. The frontier is steeper on the Admin side. The marginal rate of substitution at $(60,60)$ is $-1$ (because of the kink), but immediately to the right, it's $-4/3$. The Admin loses utility faster than the Union gains it as we move right.

  **ALEX:** That's why Nash stops at the kink.

  **BLAKE:** But KS says: "Wait, the Admin has more room to run." Look, I'm willing to concede on the manipulability of the ideal point. If we define the ideal point strictly as the *Pareto-maximal* utilities, not just any proposal on the table, then the gaming risk drops.

  **ALEX:** And I'll concede that IIA has a cold logic that might fail in a labor dispute. If the Admin's budget cap lifts, and the Union's doesn't, recommending the exact same contract $(60,60)$ looks like we're ignoring the new capacity to pay. It might provoke a strike.

  **BLAKE:** So we agree that the axioms map to ethical commitments. IIA is about consistency. Monotonicity is about recognizing changes in potential.

  **ALEX:** Right. So here's the impasse. If we recommend Nash, we risk the Union feeling ignored if the Admin's capacity grows. If we recommend KS, we risk the Admin thinking they can anchor with extreme demands to shift the ideal point.

  **BLAKE:** We need evidence. Not more theory.

  **ALEX:** Agreed. We need data on how similar disputes were settled. Did arbitrators in the 90s respect ceilings?

  **BLAKE:** And we need experimental evidence. Bring in subjects, give them this specific geometry. See if they naturally converge on $(60,60)$ or slide toward $(66,53)$.

  **ALEX:** Roth's experiments usually favor Nash in symmetric settings, but when asymmetries are introduced...

  **BLAKE:** ...people often split the difference between Nash and the egalitarian line. Which is basically where KS sits.

  **ALEX:** *(Checks watch)* 4:52 PM.

  **BLAKE:** We can't run the experiment by five.

  **ALEX:** No. So we write a split recommendation. We present both numbers. We explicitly state the axiom trade-off.

  **BLAKE:** "The Committee finds that the Nash Solution offers greater stability against agenda manipulation, while the Kalai-Smorodinsky Solution better reflects asymmetries in bargaining capacity."

  **ALEX:** And we note that the disagreement point $(0,0)$ is the largest source of uncertainty. If the Union's strike fund is higher than we think, $d$ shifts up, and both solutions move their way.

  **BLAKE:** Fine. But I'm adding a footnote that if the Admin's budget constraint is actually soft—meaning 75 isn't the hard max—KS is the more robust predictor of the final signed contract.

  **ALEX:** And I'm adding a footnote that if the negotiation process involves sequential offers with incomplete information, the Nash product is the limit of the Rubinstein equilibrium as the time interval goes to zero.

  **BLAKE:** *(Smiles wryly)* You just had to bring Rubinstein back in, didn't you?

  **ALEX:** It's the elephant in the room. If they actually bargain strategically, our axioms are just justifications for what the equilibrium does.

  **BLAKE:** Then let's hope they're more interested in fairness than equilibrium. Draft the memo. I'll check the numbers on the KS intersection one more time. $32/15 u_1 = 140$.

  **ALEX:** $u_1 = 65.625$. I already checked it.

  **BLAKE:** I'm checking it again. Trust, but verify. That's the only axiom we both agree on.

  **ALEX:** *(Typing)* Invariance to verification procedures. Let's go.

  *[FADE OUT]*
