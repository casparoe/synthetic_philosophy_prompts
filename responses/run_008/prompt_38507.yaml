      *Let's try to synthesize a "Rights-Based Non-Comparative" argument.*
      1.  Harm/Wronging is not essentially comparative.
      2.  Agents have duties not to impose significant burdens on others, even if those agents are also the source of the benefits that make life worth living.
      3.  The "benefit of existence" does not automatically cancel out the "wrong of imposed burden."
      4.  Therefore, the clinic wrongs the child by imposing the burden, even if the child is glad to exist.

      *Addressing the Friend's Objection:* Why is this different from poor parents?
      *   *Distinction:* **Agency and Avoidability.** The clinic *creates* the risk as a byproduct of negligence/malice. Poor parents *inherit* circumstances. The clinic's action is the *direct cause* of the specific harm, whereas poor parents are navigating pre-existing constraints. The clinic has a duty of care that includes *not creating* the risk.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Step 1: Define the core mechanism.* Move away from "Worse Off" (Comparative) to "Imposed Burden" (Non-Comparative).
      *   *Step 2: Address the "Existence is a Benefit" counter.* Acknowledge life is good, but argue that benefits don't justify rights violations. (Analogy: I save your life but break your leg in the process without necessity. You're glad to live, but I still wronged you by breaking the leg).
