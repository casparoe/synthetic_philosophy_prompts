      *   *Better:* Focus on **Unnecessary Suffering**. The Clinic's suffering is *instrumentally unnecessary* to the act of creation (they could have done it right). The Parents' suffering is *inextricably linked* to their specific act of creation (they can't be rich just by trying harder in that moment).
