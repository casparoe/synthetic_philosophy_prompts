          *   Steelman the position (make it as robust as possible).

  2.  **Deconstruct the Non-Identity Problem (NIP):**
      *   *Premise 1:* An action is wrong only if it makes someone worse off than they would otherwise have been (Person-Affecting View).
      *   *Premise 2:* In identity-affecting cases (climate change, sperm mix-up), the people who exist *would not have existed* otherwise.
      *   *Premise 3:* Existence with a burden is better than non-existence (usually).
      *   *Conclusion:* Therefore, the action does not make them worse off. Therefore, the action is not wrong *to them*.
      *   *User's Desire:* Reject the Conclusion while keeping the focus on *harm to specific people*.

  3.  **Brainstorming Alternative Frameworks (avoiding the "Threshold" trap):**
      *   *Rights-Based Approach:* Do people have a right to be born without certain imposed conditions, regardless of whether existence is net positive?
      *   *Relational/Role Obligations:* Parents/Institutions have duties to children *qua* children, not based on comparative welfare.
      *   *The "Reasonable Rejection" or "Consent" Model:* Could the person reasonably reject the principle of action, even if they benefit from it?
      *   *Harman's "Person-Affecting Restriction" Critique:* Maybe the definition of "harm" is too narrow.
      *   *Shiffrin's "Non-Comparative Harm":* Harm isn't always about being worse off than before; it's about suffering evils.
      *   *Hanser's "Compound Harm":* Harm can be the imposition of a burden, even if compensated by benefits (existence).

  4.  **Selecting the Strongest Candidate:**
      *   The "Threshold" view is out (per user request).
      *   The "Impersonal" view is out (per user request).
      *   *Seana Shiffrin's Non-Comparative Harm* is a strong contender. She argues that harm is the infliction of a bad state (pain, disability), not necessarily a comparison to a baseline.
      *   *However,* a more robust argument for *wronging* specific people might come from **Rights-Based/Deontological Constraints** combined with a **Rejection of the Counterfactual Condition for Wronging**.
      *   *Key Insight:* We can wrong someone without making them *worse off*. Wronging is about violating a claim or right they have, not necessarily altering their utility curve negatively compared to a counterfactual.
      *   *Specific Argument Strategy:* Focus on **Parental/Institutional Duty** and the **Right to an Open Future** or **Right to Non-Imposed Burden**.
      *   *Refining the Argument:* Let's look at **Michael McMahan** or **Joel Feinberg**, but arguably the strongest "person-affecting" defense that avoids the threshold trap is the **"Wronging Without Harming"** distinction, specifically utilizing **Seana Shiffrin's** work on non-comparative harm or **Hanser's** account of harming.
      *   *Wait, better angle:* **The "Reasonable Complaint" Argument (Parfit's later thoughts & others).** Even if I'm better off existing, I can still complain about *how* I was made to exist.
      *   *Best Fit:* **Seana Shiffrin's "Non-Comparative Harm" + Rights.** This directly attacks the idea that harm requires a counterfactual comparison. It argues that inflicting pain is a harm *in itself*, regardless of the net benefit of life.
