prompt: |-
  Two of my friends have been arguing about effective altruism for like three years now and it's gotten to the point where neither of them actually hears the other one anymore, so I want to commission the document they should have written instead. Friend A is pretty deep in EA — works at a meta-charity-ish org, used to be really into earning to give, defends the whole cost-effectiveness framework on basically every point. Friend B was into it in college, then drifted out and now does labor organizing, and her whole critique is institutional: that EA's obsession with measurability structurally steers money and people toward whatever can be randomized-controlled-trialed (deworming, bednets) and away from anything that works through institutions or politics, that earning to give mostly launders ambitious career choices people already wanted to make anyway, and that a movement funded by tech fortunes is never going to ask the questions that threaten tech fortunes. Friend A says all of this is either wrong or actually a feature: he claims legibility isn't a bias, it's just epistemic hygiene — you do what you can actually measure, and vague appeals to "systemic change" have a bad track record compared to things you can audit.

  They finally agreed to try an adversarial collaboration, and somehow I got voluntold to draft the joint statement. Here's what I need: a numbered section of claims they can both actually sign their names to (I suspect there's more than they think — e.g. about replacement effects in labor markets, or that some EA causes like biosecurity and policy work already don't fit the "measurable only" stereotype). Then a disagreements table where each disagreement is phrased so the person who holds that view would accept the wording — Friend A keeps saying Friend B thinks "EA is bad" and she keeps saying he thinks "nothing EA does could be improved," and I'm pretty sure neither of those is right. Then the cruxes. I have a suspicion about what at least one of them is: whether the measurability constraint is a *selection filter* (it changes which problems get worked on at all, so it compounds over decades) or just a *prioritization tiebreaker* among equally worthy options. But there's also the talent-drift question — whether the sharp kids who go into quant-adjacent EA careers would otherwise have gone into congress or journalism or union stuff or just more quant finance — and the funder-dependence question, which Friend A thinks is just an ad hominem and Friend B thinks is about incentive gradients over time.

  For each crux, if you can, give the concrete case or piece of evidence both sides would agree bears on it, with each side's prediction written down in advance so they can't weasel out later — e.g., what each would expect to see if measurability were really a selection filter, or what the talent question would even look like answered empirically. And if any chunk of their fight turns out to be verbal — I have a feeling "systemic change" means different things to each of them, like policy reform vs. structural change to who holds power — please call that out explicitly and say which part, because at this point I'd happily settle for them discovering they agree more than they admit. Also feel free to note if one side's disagreement is doing less work than its owner thinks, but the goal is a document both could sign, not a verdict on who won.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** Two friends (A and B) have been arguing about Effective Altruism (EA) for three years. They are stuck in a loop. The user wants a "joint statement" draft to facilitate an adversarial collaboration.
      *   **Characters:**
          *   *Friend A:* Deep EA, works at meta-charity, defends cost-effectiveness, measurability as epistemic hygiene, skeptical of vague systemic change.
          *   *Friend B:* Ex-EA, now labor organizer, critiques institutional bias (RCTs over politics), "earning to give" as rationalization, tech funding bias.
      *   **Deliverables:**
          1.  Numbered section of *Agreed Claims* (common ground).
          2.  *Disagreements Table* (phrased neutrally so both can own their view without caricature).
          3.  *Cruxes* (key divergences with concrete tests/evidence and pre-registered predictions).
          4.  *Verbal Dispute Check* (identify terms like "systemic change" that might mean different things).
      *   **Tone:** Neutral, precise, charitable, actionable, suitable for a formal joint statement.
      *   **Specific Insights to Incorporate:** Measurability as selection filter vs. tiebreaker; talent drift (quant vs. politics); funder dependence (ad hominem vs. incentive gradients); replacement effects; biosecurity/policy exceptions.

  2.  **Drafting - Section 1: Agreed Claims (Common Ground):**
      *   *Goal:* Find things both can sign without feeling like they sold out.
      *   *Idea 1 (Goal):* Both want to do good. (Too vague). Both want to improve well-being/reduce suffering. (Better).
      *   *Idea 2 (Evidence):* Both agree evidence matters, even if they weigh types of evidence differently.
      *   *Idea 3 (Critique):* A admits EA can be insular/improvable. B admits some EA interventions work well.
      *   *Idea 4 (Labor/Talent):* Replacement effects are real (a point the user mentioned).
      *   *Idea 5 (Diversity of Cause):* Not *all* EA is RCTs (biosecurity, policy exist).
      *   *Drafting:* Make them specific. "We agree that..."
      *   *Refinement:* Ensure A doesn't feel B is calling EA useless, and B doesn't feel A is calling criticism heresy.

  3.  **Drafting - Section 2: Disagreements Table:**
      *   *Goal:* State the disagreement without strawmanning. Avoid "A thinks B thinks EA is bad."
      *   *Format:* Topic | Friend A's Position | Friend B's Position.
      *   *Key Disagreements:*
          *   Measurability (Hygiene vs. Bias).
          *   Earning to Give (Net Positive vs. Rationalization/Opportunity Cost).
          *   Funding Sources (Irrelevant to Validity vs. Shapes Agenda).
          *   Institutional Change (Hard to Measure/Low Priority vs. Essential/High Priority).
      *   *Phrasing:* Use "We disagree on whether..." or "A holds X, B holds Y." Ensure B's view isn't "EA is evil" but "EA has structural blindspots." Ensure A's view isn't "Status Quo is Perfect" but "Current heuristics are robust."

  4.  **Drafting - Section 3: The Cruxes (with Tests/Predictions):**
      *   *Goal:* Identify the pivot points. If this changed, would the mind change?
      *   *Crux 1: Measurability (Filter vs. Tiebreaker).*
          *   *Test:* Look at funding allocation over time.
          *   *Prediction A:* Funding shifts to high-impact unmeasurables as evidence grows.
          *   *Prediction B:* Funding stays locked to measurables regardless of theoretical potential.
      *   *Crux 2: Talent Drift (Counterfactual Careers).*
          *   *Test:* Where would EA-adjacent talent go without EA?
          *   *Prediction A:* Finance/Consulting (lower impact).
          *   *Prediction B:* Policy/Organizing/Journalism (higher structural impact).
      *   *Crux 3: Funder Influence (Incentive Gradients).*
          *   *Test:* Proposals that threaten donor interests.
          *   *Prediction A:* Funded if evidence is strong.
          *   *Prediction B:* Systematically deprioritized or framed narrowly.
      *   *Refinement:* Make the predictions falsifiable.

  5.  **Drafting - Section 4: Verbal Disputes & Definitions:**
      *   *Goal:* Clear up terminology.
      *   *Term:* "Systemic Change."
          *   *A's likely def:* Broad, vague, unmeasurable policy shifts.
          *   *B's likely def:* Power dynamics, labor rights, structural inequality.
      *   *Term:* "Effectiveness."
          *   *A's likely def:* Cost-per-outcome (QALYs, lives saved).
          *   *B's likely def:* Durability, leverage, shifting power structures.
      *   *Term:* "Earning to Give."
          *   *A:* Direct funding mechanism.
          *   *B:* Career path selection with externalities.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it accessible but rigorous.
      *   *Check Constraints:* Did I include the replacement effect point? Yes. Biosecurity exception? Yes.
      *   *Check User's specific suspicion:* The "Selection Filter vs. Tiebreaker" crux needs to be prominent.
      *   *Check "Verbal Dispute":* Explicitly call out "Systemic Change."
      *   *Self-Correction:* Make sure Friend A doesn't look like a robot and Friend B doesn't look like a cynic. Both need to sound reasonable. Ensure the "Disagreements Table" doesn't imply one is right, just that they differ.

  7.  **Final Polish:** Organize with clear headings. Add an intro/outro context. (Proceed to generate output based on these thoughts).

