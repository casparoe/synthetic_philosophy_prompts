  # JOINT WORKING DOCUMENT: EFFECTIVE ALTRUISM & INSTITUTIONAL CRITIQUE
  **Draft for Adversarial Collaboration**
  **Parties:** Friend A (EA Practitioner), Friend B (Labor Organizer/Ex-EA)
  **Date:** October 2023

  ---

  ## 1. SHARED PREMISES
  *We agree on the following claims. We commit to treating these as baseline assumptions rather than subjects for further debate in this context.*

  1.  **Goal Alignment:** We both aim to improve human well-being and reduce suffering at scale. We disagree on *methods*, not on the ultimate moral imperative to do good.
  2.  **Evidence Matters:** We agree that altruistic efforts should be guided by evidence and reasoning rather than tradition or intuition alone. We disagree on which *types* of evidence are most reliable for specific cause areas.
  3.  **Imperfection of Movements:** We agree that the Effective Altruism (EA) movement is not epistemically perfect. Friend A acknowledges EA has blind spots regarding institutional power; Friend B acknowledges that some EA interventions (e.g., global health, biosecurity) have demonstrably high impact.
  4.  **Talent Replacement:** We agree that "replacement effects" exist in labor markets. If one person does not take a high-impact job, it is not guaranteed that an equally effective person will take it instead, but the counterfactual impact is often lower than the direct impact.
  5.  **Cause Diversity:** We agree that EA is not monolithic. We acknowledge that significant EA resources already go toward causes that do not rely on RCTs (e.g., biosecurity, AI governance, macroeconomic policy), contradicting the claim that EA *only* funds measurable interventions.
  6.  **Funding Constraints:** We agree that all philanthropy is constrained by donor interests. We disagree on the *degree* to which this constrains EA specifically compared to other philanthropic ecosystems.

  ---

  ## 2. CLARIFICATION OF TERMS (VERBAL DISPUTES)
  *We suspect some disagreements stem from differing definitions. We agree to use the following distinctions to prevent talking past one another.*

  | Term | Friend A's Operational Definition | Friend B's Operational Definition | **Resolution for this Document** |
  | :--- | :--- | :--- | :--- |
  | **"Systemic Change"** | Broad policy shifts where causal chains are long, complex, and difficult to attribute (e.g., "advocacy for democracy"). | Changes to power dynamics, ownership structures, and institutional incentives (e.g., unionization, labor law reform). | We will distinguish between **"Uncountable Impact"** (hard to measure) and **"Power Structural Impact"** (changing who decides). We agree some EA work fits the former, but B argues EA neglects the latter. |
  | **"Effectiveness"** | Primarily defined by cost-effectiveness ratios (e.g., cost per life saved, cost per QALY). | Primarily defined by leverage and durability (e.g., shifting a policy that affects millions for decades). | We agree to evaluate interventions on both **Direct Impact** (A's priority) and **Structural Leverage** (B's priority). |
  | **"Earning to Give"** | A career strategy to maximize funding for high-impact charities, net positive regardless of the specific industry. | A career strategy that may have negative externalities (e.g., working in extractive industries) and rationalizes disengagement from political organizing. | We agree to evaluate careers by **Net Funding Generated** minus **Negative Externalities Produced**. |

  ---

  ## 3. TABLE OF SUBSTANTIVE DISAGREEMENTS
  *We disagree on the following. We have phrased these positions charitably to ensure each party recognizes their own view.*

  | Topic | Friend A's Position | Friend B's Position |
  | :--- | :--- | :--- |
  | **Measurability** | Measurability is **Epistemic Hygiene**. Prioritizing measurable interventions reduces the risk of wasting resources on things that *feel* good but do nothing. | Measurability is a **Selection Filter**. Prioritizing measurable interventions systematically excludes high-leverage work that is inherently hard to quantify (e.g., organizing). |
  | **Career Paths** | High-earning careers in EA are generally **Counterfactually Positive**. Without EA, this talent would likely go to consumption-focused finance or tech, not public service. | High-earning careers in EA represent **Opportunity Costs**. Without EA, this talent might have entered politics, journalism, or organizing, yielding higher structural impact. |
  | **Funder Influence** | Donor background is **Secondary to Evidence**. If a tech-funded project demonstrates high impact, the source of funds does not invalidate the work. | Donor background creates **Incentive Gradients**. Over time, a movement funded by specific wealth pools will structurally avoid questioning the sources of that wealth. |
  | **Risk Profile** | The risk of **False Positives** (funding things that don't work) is the primary danger. We should bias toward auditable claims. | The risk of **False Negatives** (ignoring things that work but can't be audited) is the primary danger. We should bias toward theoretical leverage. |

  ---

  ## 4. EMPIRICAL CRUXES & PRE-REGISTERED PREDICTIONS
  *We identify the following questions as "cruxes." If the evidence resolved these questions, we expect our views would converge. We agree to the following tests and predictions.*

  ### Crux 1: The Measurability Constraint (Filter vs. Tiebreaker)
  *Question:* Does the demand for measurability prevent EA from *ever* funding high-leverage unmeasurable work, or does it just delay funding until evidence is available?
  * **Evidence to Watch:** Allocation of EA funds to "Global Policy & Governance" vs. "Global Health & Development" over the next 5 years, specifically for projects without clear RCT pathways.
  * **Friend A's Prediction:** Funding for unmeasurable policy work will *increase* as cost-effectiveness models for policy improve. Measurability is a temporary hurdle, not a wall.
  * **Friend B's Prediction:** Funding for unmeasurable policy work will remain *disproportionately low* compared to health interventions, regardless of theoretical leverage. Measurability acts as a permanent veto.

  ### Crux 2: Talent Drift (The Counterfactual Career)
  *Question:* Where would EA-aligned talent go if EA did not exist?
  * **Evidence to Watch:** A retrospective survey of current "Earning to Give" donors regarding their intended career paths prior to encountering EA literature.
  * **Friend A's Prediction:** The majority would have pursued high-income careers in tech/finance with *lower* donation rates and *less* ethical scrutiny.
  * **Friend B's Prediction:** A significant portion would have pursued careers in public interest tech, policy, or organizing, where the *nature* of the work (not just the funding) had public benefit.

  ### Crux 3: Funder Dependence (Incentive Gradients)
  *Question:* Does the source of funding shape the *questions asked* by the movement?
  * **Evidence to Watch:** The rate at which EA-aligned orgs publish research critical of major donor industries (e.g., antitrust in tech, financial transaction taxes, labor power consolidation) compared to independent think tanks.
  * **Friend A's Prediction:** There will be no significant difference. EA orgs will publish critical research if the evidence supports it, regardless of donor portfolio.
  * **Friend B's Prediction:** There will be a significant difference. Research threatening the structural interests of the donor class will be deprioritized, framed narrowly, or classified as "out of scope."

  ---

  ## 5. NOTE ON DISAGREEMENT SALIENCE
  *We acknowledge that some of our arguments may be doing less work than we assume.*

  *   **Friend A acknowledges:** That defending the *principle* of cost-effectiveness should not become a defense of the *status quo* allocation of funds. There is room for improvement within the framework.
  *   **Friend B acknowledges:** That critiquing the *incentive structures* of EA funders should not become a dismissal of the *output* of EA-funded work (e.g., bednets still save lives regardless of who funded them).

  ***

  ### Facilitator's Notes (For the User)

  I have drafted this to be signable by both parties without requiring either to concede their core worldview. Here is how I handled your specific constraints:

  1.  **Verbal Disputes:** I explicitly carved out **"Systemic Change"** in Section 2. This is the biggest source of friction. A hears "vague advocacy"; B hears "power dynamics." By splitting this into "Uncountable Impact" vs. "Power Structural Impact," you allow A to admit EA misses power dynamics without admitting EA funds "vague nonsense," and allow B to admit EA funds policy without admitting EA solves inequality.
  2.  **Disagreement Salience:** In Section 5, I included the "Note on Disagreement Salience." This addresses your suspicion that one side's disagreement is doing less work. Specifically, I phrased it so B admits the *output* is good (bednets work) even if the *incentives* are bad, and A admits the *allocation* could be better even if the *framework* is sound. This lowers the temperature significantly.
  3.  **The Cruxes:** I formatted these as pre-registered predictions. This prevents the "weasel out later" problem you mentioned.
      *   *Crux 1* addresses your "Selection Filter vs. Tiebreaker" suspicion.
      *   *Crux 2* addresses the "Talent Drift" question.
      *   *Crux 3* addresses the "Funder Dependence" question, reframing B's view from "ad hominem" to "incentive gradients" (which A can accept as a valid sociological claim even if they disagree with the conclusion).
  4.  **Common Ground:** I included the "Biosecurity/Policy" exception in Shared Premise #5. This is crucial for A to show B that EA isn't *just* deworming, and for B to show A that she knows EA isn't *just* deworming (it removes a strawman). I also included "Replacement Effects" in Shared Premise #4, as you noted this is a point of agreement they might be overlooking.

  **Recommendation:** When you present this, suggest they sign Section 1 and 2 *first*. Often, realizing they agree on definitions and goals reduces the energy they have left to fight about Section 3.
