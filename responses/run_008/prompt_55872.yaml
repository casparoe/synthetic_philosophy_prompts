answer: |-
  This is a great request. Your flatmate has clearly absorbed the "greatest hits" of contemporary mereology (the study of parts and wholes), but like many people who get excited about a new philosophical rabbit hole, he has smoothed over the jagged edges where the actual debates live.

  You are right to be skeptical of the Ship of Theseus comparison and the claim about the consensus on restriction. Below is a claim-by-claim audit of his speech, followed by a specific section on where my own analysis might be vulnerable to error.

  ### Claim-by-Claim Audit

  **Claim 1:** *"It's basically the ship of Theseus thing..."*
  *   **Verdict:** **Wrong / Category Error.**
  *   **Analysis:** You are correct; he is conflating two different problems. The Ship of Theseus is a problem of **diachronic identity** (how an object persists through *time* while changing parts). The Special Composition Question (SCQ) is a problem of **synchronic composition** (when do parts make a whole *right now*).
  *   **Metaphysician's Reaction:** A wince. While both deal with parthood and identity, solving one does not solve the other. You can believe composition is unrestricted (Universalism) but still struggle with whether the resulting object persists through part-swapping.

  **Claim 2:** *"...the question of when a bunch of little objects add up to one big object."*
  *   **Verdict:** **Correct.**
  *   **Analysis:** This is a fair, layman's summary of the SCQ. Formally, it asks: "Under what conditions do some xs compose a y?"
  *   **Metaphysician's Reaction:** A nod. Accurate enough for dinner conversation.

  **Claim 3:** *"Peter van Inwagen's famous answer is that this basically never happens."*
  *   **Verdict:** **Sloppy / Slightly Misleading.**
  *   **Analysis:** Van Inwagen is a **restrictivist**, specifically an **organismic composer**. He doesn't say it *never* happens; he says it happens *very rarely*. If he thought it never happened, he would be a **Mereological Nihilist** (who believes only simples exist). Van Inwagen believes composite objects *do* exist, just not as many as we think.
  *   **Metaphysician's Reaction:** They would correct him: "Van Inwagen isn't a nihilist; he's an organicist."

  **Claim 4 & 5:** *"There's no such thing as a table... only tiny particles arranged table-wise... The only composite objects that really exist are living things like you and me."*
  *   **Verdict:** **Correct (regarding Van Inwagen).**
  *   **Analysis:** This accurately summarizes Van Inwagen's view in his book *Material Beings* (1990). He argues composition occurs only when the activity of the parts constitutes a **life**. Tables, chairs, and mountains are just "simples arranged table-wise."
  *   **Metaphysician's Reaction:** Agreement on the exegesis. Whether they agree with the view is another matter (many find the "life" criterion vague), but he has described Van Inwagen's position accurately.

  **Claim 6:** *"But most philosophers nowadays go the other way and say whenever you take any objects and put them together you automatically create a new composite object..."*
  *   **Verdict:** **Exaggerated / Contested.**
  *   **Analysis:** This describes **Mereological Universalism**. While it is a dominant position in analytic metaphysics, claiming "most philosophers" hold it is a stretch. It is one of the three main contenders (Nihilism, Universalism, Restrictivism).
  *   **Metaphysician's Reaction:** They would pause at "most." Universalism is highly influential (championed by David Lewis and Ted Sider), but it is not a clear majority view among philosophers generally, though it might be among *specialists* in mereology.

  **Claim 7:** *"...so there's literally an object made of my left shoe and three quarks in another galaxy."*
  *   **Verdict:** **Correct.**
  *   **Analysis:** This is the standard consequence of Universalism. These are often called "scattered objects" or "fusion objects."
  *   **Metaphysician's Reaction:** Agreement. Universalists accept this consequence.

  **Claim 8:** *"That's obviously crazy, so almost everyone agrees composition has to be restricted somehow..."*
  *   **Verdict:** **Flat-Out Wrong (regarding the consensus).**
  *   **Analysis:** This is the weakest link in his speech. Many prominent metaphysicians argue that the "craziness" of Universalism is preferable to the alternatives. Their argument (The Vagueness Argument) is that any attempt to *restrict* composition (e.g., "tables count, but shoe-quark fusions don't") introduces unacceptable vagueness or arbitrariness into reality. They "live with the weirdness" because they think the alternative is logically incoherent.
  *   **Metaphysician's Reaction:** A shake of the head. This misrepresents the state of the field. Universalism is a live, respected option, not a rejected strawman.

  **Claim 9:** *"...and the debate is about drawing the line."*
  *   **Verdict:** **Sloppy.**
  *   **Analysis:** If Universalism is true, there is no line. If Nihilism is true, there is no line (except between simples and composites). The debate is arguably about *whether there is a line at all*, not just where to draw it.
  *   **Metaphysician's Reaction:** They would note that "drawing the line" presupposes Restrictivism is the default, which is exactly what is up for debate.

  ---

  ### Summary of Your Intuitions
  *   **Ship of Theseus:** You were right. That is a different puzzle.
  *   **Organisms vs. Tables:** You were right to wonder what makes life special. Van Inwagen thinks "life" is a specific causal event, but many critics argue the boundary of an organism is just as vague as the boundary of a table (e.g., do bacteria in your gut count as part of the "life"?).
  *   **Universalism Consensus:** You were right. The flatmate presented Universalism as a view everyone rejects because it's weird. In reality, many accept it *because* it avoids other logical problems.

  ---

  ### Epistemic Flags: Where My Audit Might Be Wrong

  You asked me to flag where my own verdict relies on contested ground or might be susceptible to new information. Here are the three areas where I am least certain:

  **1. The "Most Philosophers" Claim (Empirical Data)**
  *   **My Verdict:** I called the flatmate's claim that "most philosophers" are Universalists (or that most reject it) exaggerated/wrong.
  *   **Why I might be wrong:** I am relying on general knowledge of the field's prominent figures (Lewis, Sider, van Inwagen, Merricks) rather than a specific headcount. Philosophy is not a democracy, but survey data exists.
  *   **What would change my verdict:** The **PhilPapers Survey (2020)** is the gold standard for analytic philosopher demographics.
      *   *If* the survey shows >60% of metaphysicians identify as Restrictivists, the flatmate is right about the consensus.
      *   *Current Data:* The 2020 survey asks about "Mereology." The options are usually Universalism, Nihilism, and Other (Restrictivism). In recent years, Universalism has gained significant traction among *specialists*, often polling around 30-40%, with Restrictivism holding a plurality but not a majority.
      *   *Correction:* If new data shows a massive shift toward Restrictivism in the last 3 years, I would have to concede the flatmate's "almost everyone" claim is closer to the mark. However, the claim that Universalism is rejected *because* it's "obviously crazy" remains false regardless of the numbers; proponents argue it is counterintuitive but true.

  **2. Van Inwagen's "Life" Criterion (Interpretive Charity)**
  *   **My Verdict:** I accepted the flatmate's summary of Van Inwagen (only living things are composite) as correct.
  *   **Why I might be wrong:** Van Inwagen's definition of "life" is technical. He refers to a "self-organizing event." Some interpreters argue this might allow for certain non-biological composites (like flames or storms) if they meet the causal criteria, or conversely, that some borderline biological cases (viruses, frozen embryos) might fail it.
  *   **What would change my verdict:** If a close reading of *Material Beings* reveals Van Inwagen allows for composite artifacts under specific functional conditions (which some later commentators have suggested he might concede for the sake of argument), then the flatmate's "tables don't exist" claim is too absolute. However, Van Inwagen is famously stubborn on this, so I stand by the audit unless there is a specific retraction I'm unaware of.

  **3. The Ship of Theseus Distinction (Interconnectedness)**
  *   **My Verdict:** I sided with you that the Ship of Theseus is a different question (diachronic vs. synchronic).
  *   **Why I might be wrong:** Some metaphysicians argue these problems are deeply entangled. If you solve composition (synchronic), you might automatically solve persistence (diachronic) via a theory like **Perdurantism** (objects are 4D worms). If the flatmate was watching videos on "Philosophy of Mind," they might have been discussing **Personal Identity**, where the SCQ and Ship of Theseus often collide (e.g., "Am I the same person if my brain parts are replaced?").
  *   **What would change my verdict:** If the context was specifically *personal identity* rather than general metaphysics, the flatmate's conflation is more forgivable and arguably functional. In the context of general material objects, however, the distinction remains valid.

  ### Final Recommendation for Dinner Debate
  If you want to push back gently, focus on the **Universalism** point. You can say:
  *"I looked this up, and it seems like a lot of heavy-hitters like David Lewis actually accept the 'crazy' view that the shoe-quark object exists. They argue that trying to draw a line is actually harder than just accepting the weird object. So it's not that everyone rejects Universalism; it's that they hate the consequences but accept the logic."*

  This shows you understand the trade-off (weirdness vs. vagueness) better than the flatmate, who presented it as a simple "sane vs. crazy" dichotomy.
