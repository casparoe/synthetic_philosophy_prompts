answer: |-
  The stability of this debate is not a failure of rationality but a feature of its logical topology. You are correct that the physics is doing almost no work; the impasse persists because the disagreement is not about the structure of the wavefunction, but about the **bridge law between physical amplitude and normative caring**.

  Here is the diagnosis of the structure:

  **1. The Physics is Agreed Upon, The Probability is Not**
  In the modern LessWrong/Overcoming Bias context, almost all participants accept the unitary mechanics of Many-Worlds (no collapse). The disagreement is not about whether the survival branch exists (it does), but about whether the *Born rule* functions as an objective chance of experience or merely as a weighting for decision-theoretic bets.
  *   **The Anti-QI Camp** relies on the Deutsch-Wallace theorem, which attempts to derive the Born rule from decision-theoretic axioms. They argue a rational agent *must* maximize expected utility weighted by amplitude. Therefore, "probability" = "measure."
  *   **The Pro-QI Camp** accepts the math but rejects the application to *subjective anticipation*. They argue that decision-theoretic betting odds (how much money you wager) are distinct from first-person anticipatory odds (what you expect to see). They claim that while you should bet as if you will die, you should *expect* to survive, because expectation conditions on the existence of an observer-moment.

  **2. The "Verbal" Hypothesis is Half-Right**
  Your hypothesis that this is a verbal disagreement about the indexical "you" is accurate but incomplete. It is verbal only in the sense that "you" is a placeholder for a **value function**.
  *   When Anti-QI says "You will die," they mean "The measure-weighted majority of your successor-moments will cease."
  *   When Pro-QI says "You will live," they mean "There exists a continuous causal thread of consciousness containing your memories."
  The participants are not failing to disambiguate; they are refusing to accept the other's definition because it violates their terminal values. One side values *measure* (preventing the loss of "stuff"), the other values *continuity* (preventing the termination of "thread"). Since terminal values are axiomatic, no argument can bridge them.

  **3. The Decision-Theoretic Mask**
  The debate persists as a descriptive argument ("What will I experience?") because admitting it is a normative argument ("What should I care about?") dissolves the thrill of the paradox.
  *   If it is descriptive, it claims to predict the future.
  *   If it is normative, it admits that Quantum Immortality is just a specific preference ordering over branching histories.
  The "measure objection" is actually a claim that rationality *constrains* your values (you *ought* to care about measure). The "existence reply" is a claim that values are free (you *can* care only about existence). The stalemate exists because the Deutsch-Wallace derivation is not universally accepted as binding on *anticipation*, only on *betting*.

  **4. Why It Is Insulated**
  This is not "merely hard"; it is **empirically insulated**. In a single-world universe, death ends anticipation, so probability and existence align. In MWI, they diverge. Because the "dead" branches cannot report their non-experience, and the "surviving" branches confirm QI by definition, there is no possible observation that can update a Pro-QI believer without killing them (which stops the update). The anthropic structure creates a one-way membrane for evidence.

  **5. Which Moves Matter?**
  *   **Irrelevant:** Arguments about decoherence, split rates, or specific quantum setups. (Both sides agree on the physics).
  *   **Irrelevant:** "It's suicide." (Both sides agree it kills most measure; they disagree on whether that matters to the survivor).
  *   **Relevant:** The scope of the Deutsch-Wallace theorem. Does it bind *anticipation* or just *action*?
  *   **Relevant:** The definition of "Personal Identity." Is it a transitive relation across branches (Anti-QI) or a binary property of a path (Pro-QI)?

  **Conclusion**
  The debate is stable because it is a clash of **axiomatic value systems** disguised as a **prediction of experience**. The "Verbal" diagnosis is correct insofar as the word "probability" is being used to smuggle in incompatible norms about how much a rational agent should care about low-measure branches. The impasse will not break via physics or math, because the math is compatible with both value systems; it breaks only if one side concedes that their definition of "expectation" is a normative choice, not a physical necessity.

  Verdict: Normative-Decision-Theoretic
  Progress requires explicitly separating "betting odds" from "anticipatory odds" and admitting that choosing between them is a value judgment, not a derivable fact.
