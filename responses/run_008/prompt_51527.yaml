prompt: |-
  I'm a graduate student in formal epistemology drafting a dissertation prospectus, and I want help turning a half-formed idea into a proper proposal. The idea: the discursive dilemma — the court case where each judge is individually consistent but majority voting on the premises yields a collective verdict inconsistent with the group's own conclusion-vote — is usually treated as revealing something deep about collective rationality and about the limits of majoritarian procedures. But the dilemma arises only because opinions are modeled as binary judgments. If the judges instead have credences that get aggregated by a pooling function, the inconsistency that drives the paradox seems to vanish: pooling preserves probabilistic coherence in a way majority voting on propositions does not preserve logical consistency. My suspicion is that the impossibility results in judgment aggregation are partly artifacts of the threshold that converts credences into categorical acceptance, and that the standard dispute between premise-based and conclusion-based procedures is really a disguised dispute about where that threshold sits — and about whether it should sit at the same place for premises as for conclusions. Turn this into a prospectus: state the research question precisely, explain what the established positions (propositionalist judgment-aggregation results on one side, credence-pooling results on the other) leave open between them, lay out what I would actually do month by month over two semesters — including how the threshold-dependence claim could be made exact rather than metaphorical, and where the formal machinery of pooling functions could be brought to bear on the impossibility theorems — and be honest about what would count as the project failing, including the possibility that the framing collapses because credence aggregation has its own, differently structured impossibility phenomena that reintroduce the dilemma in new clothing. Please don't include a bibliography; I'll supply references myself.
