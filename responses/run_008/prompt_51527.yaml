answer: |-
  **Dissertation Prospectus**

  **Working Title:** Thresholds of Consistency: Re-evaluating the Discursive Dilemma through Probabilistic Opinion Pooling

  **1. Research Question and Core Hypothesis**

  The discursive dilemma (or doctrinal paradox) demonstrates that a group of individually rational agents, holding consistent sets of binary judgments on logically connected propositions, can arrive at a collectively inconsistent verdict via proposition-wise majority voting. Standard literature in judgment aggregation theory (JAT) interprets this as a fundamental tension between collective rationality and majoritarian democracy, often culminating in impossibility theorems suggesting no aggregation rule can satisfy a set of minimal desiderata.

  This project challenges the ontological priority of the binary framework in which these impossibility results are derived. My core hypothesis is that the discursive dilemma is not an inherent feature of collective reasoning but an artifact of *binarization*—specifically, the application of a threshold function to convert graded credences into categorical acceptances. If agents aggregate graded credences via pooling functions that preserve probabilistic coherence, the logical inconsistency driving the paradox vanishes at the credence level. The inconsistency re-emerges only when a Lockean threshold is applied to the pooled credences.

  Consequently, the standard debate between premise-based and conclusion-based procedures should be reframed. It is not a dispute about which propositions to vote on, but a disguised dispute about the location and uniformity of the acceptance threshold.

  **Primary Research Question:** To what extent are the impossibility theorems of judgment aggregation dependent on the binary nature of the input/output, and can the discursive dilemma be formally reconstructed as a constraint on the relationship between pooling functions and thresholding maps?

  **Secondary Questions:**
  1. Can we define a class of pooling functions that, when combined with a fixed threshold, guarantee logical consistency of the resulting binary judgments?
  2. Do the impossibility results of probabilistic opinion pooling (e.g., regarding independence or zero-preservation) reintroduce the discursive dilemma in a probabilistic guise, or are they structurally distinct?
  3. Is the choice between premise-based and conclusion-based procedures equivalent to choosing between different threshold levels for premises versus conclusions?

  **2. Background and the Gap in the Literature**

  The literature currently sits in two distinct silos. On one side, Judgment Aggregation Theory (JAT) focuses on binary attitudes (belief/disbelief). It has produced robust impossibility theorems (analogous to Arrow's Theorem) showing that proposition-wise majority voting fails to preserve logical consistency across connected agendas. The proposed solutions usually involve restricting the agenda, abandoning independence, or adopting premise/conclusion-based procedures.

  On the other side, the literature on Probabilistic Opinion Pooling focuses on aggregating credence functions. Key results here concern linear and geometric pooling. It is well-established that linear pooling preserves probabilistic coherence (the axioms of probability) but fails to preserve probabilistic independence (e.g., $P(A \land B) = P(A)P(B)$).

  The gap lies in the formal bridge between these two. While some authors have noted that moving to probabilities avoids *logical* inconsistency, there is no rigorous account of how the binary paradox re-emerges from the probabilistic model via thresholding. Existing discussions often treat the move to credences as a dissolution of the problem rather than a translation of it. This project posits that the problem is not dissolved but relocated. By formalizing the thresholding mechanism, we can isolate exactly which conditions of the JAT impossibility theorems correspond to constraints on the pooling function and which correspond to constraints on the threshold.

  **3. Methodology and Formal Strategy**

  The project will be primarily formal, utilizing tools from logic, probability theory, and social choice theory. The central task is to construct a "Bridge Model" that links credence aggregation to binary judgment aggregation.

  **3.1. Formalizing the Threshold-Dependence Claim**
  To move beyond metaphor, I will define a *Lockean Aggregation Map*. Let $C_i$ be the credence function of agent $i$ over an algebra of propositions $\mathcal{A}$. Let $F$ be a pooling function (e.g., linear, geometric) producing a collective credence $C_G = F(C_1, ..., C_n)$. Let $T_t$ be a thresholding function such that the collective binary judgment $J_G(p) = 1$ (accept) iff $C_G(p) \geq t$.

  The discursive dilemma arises in this model if there exists a profile $\{C_i\}$ such that:
  1. Each $C_i$ is probabilistically coherent.
  2. $C_G$ is probabilistically coherent (guaranteed by $F$).
  3. The set of accepted propositions $\{p \in \mathcal{A} : C_G(p) \geq t\}$ is logically inconsistent.

  My initial modeling suggests this inconsistency is possible if $F$ does not preserve the specific logical relations required by the agenda (e.g., if the agenda requires $P(A \land B) = \min(P(A), P(B))$ for consistency at threshold $t$, but $F$ is linear pooling). The project will derive the specific conditions on $F$ and $t$ required to prevent this.

  **3.2. Reinterpreting Premise vs. Conclusion Procedures**
  I will model the Premise-Based Procedure (PBP) as applying threshold $t$ to premises $\{A, B\}$ and deriving the conclusion $A \land B$ logically. I will model the Conclusion-Based Procedure (CBP) as applying threshold $t$ directly to $A \land B$.
  I aim to prove that PBP and CBP yield divergent results if and only if the pooling function $F$ fails to commute with the logical connectives relative to the threshold $t$. This allows us to characterize the "cost" of each procedure in terms of probabilistic distortion rather than logical violation.

  **4. Proposed Research Timeline (Two Semesters)**

  **Semester 1: Formalization and Reproduction**
  *   **Month 1: Literature Deep Dive & Model Specification.**
      *   Finalize the formal language for the Bridge Model.
      *   Rigorously define the agenda (starting with the standard conjunction agenda $\{A, B, A \land B\}$).
      *   Select candidate pooling functions (Linear, Geometric, Unweighted/Weighted).
  *   **Month 2: Reproducing the Paradox in Probabilistic Clothing.**
      *   Construct explicit counter-examples where coherent pooled credences yield inconsistent binary judgments under a fixed threshold.
      *   Determine the range of thresholds $t$ for which the paradox is avoidable for specific pooling functions.
  *   **Month 3: Analyzing Pooling Constraints.**
      *   Investigate which pooling functions preserve the specific inequalities required to maintain consistency at threshold $t$.
      *   Draft the formal definition of "Threshold-Compatible Pooling."
  *   **Month 4: Drafting Chapter 1 & 2.**
      *   Chapter 1: Introduction and the case against binary primitivism.
      *   Chapter 2: The Bridge Model and formal setup.
  *   **Month 5: Refinement.**
      *   Present preliminary formal results to faculty/peers for feedback on soundness.
      *   Adjust definitions based on feedback (e.g., handling edge cases where $C_G(p) = t$).

  **Semester 2: Impossibility Analysis and Extension**
  *   **Month 6: Confronting Probabilistic Impossibility Results.**
      *   Engage with impossibility theorems in opinion pooling (e.g., constraints on external Bayesianity or independence).
      *   Test the hypothesis: Do these probabilistic impossibility results map one-to-one onto the binary judgment impossibility results via the threshold map?
  *   **Month 7: The Threshold Dispute.**
      *   Formalize the claim that PBP vs. CBP is a dispute over threshold placement.
      *   Model variable thresholds ($t_{premise} \neq t_{conclusion}$) and analyze the rationality conditions for such asymmetry.
  *   **Month 8: Drafting Chapter 3 & 4.**
      *   Chapter 3: The limits of pooling (where the dilemma returns).
      *   Chapter 4: Normative implications for epistemic democracy.
  *   **Month 9: Conclusion and Revision.**
      *   Synthesize findings.
      *   Complete full dissertation draft for committee review.

  **5. Risk Assessment and Failure Conditions**

  This project relies on the stability of the "Bridge Model." There are three specific ways in which the central hypothesis could fail, necessitating a pivot.

  **Failure Mode 1: The Probabilistic Impossibility Reintroduction.**
  It is possible that the "dissolution" of the binary paradox is illusory because credence aggregation faces its own, equally severe impossibility theorems (e.g., Dietrich and List's results on the impossibility of neutral, consensus-preserving pooling). If the constraints required to make pooling "threshold-compatible" are so strong that they violate other minimal desiderata (like anonymity or zero-preservation), then the dilemma has not been solved, only moved.
  *   *Contingency:* If this occurs, the dissertation will pivot from "dissolving the paradox" to "mapping the isomorphism between binary and probabilistic impossibility results," arguing that the tension is structural to aggregation itself, regardless of the doxastic attitude.

  **Failure Mode 2: Threshold Insensitivity.**
  It may turn out that for most reasonable pooling functions, the range of thresholds that generate inconsistency is negligible or requires highly specific, unrealistic credence distributions. If the paradox is shown to be a measure-zero phenomenon in the probabilistic space, the claim that it is a "deep" problem is weakened.
  *   *Contingency:* The focus would shift to the normative implications of *rare* but high-stakes inconsistencies, or to the dynamics of how thresholds are set in institutional contexts.

  **Failure Mode 3: The Collapse of the Threshold Analogy.**
  The premise/conclusion debate might not map cleanly onto threshold placement. There may be structural features of PBP (like sequential updating) that cannot be modeled merely as a static threshold difference.
  *   *Contingency:* I would expand the model to include dynamic updating (conditionalization) rather than static pooling, examining how the order of aggregation affects the final binary output.

  **6. Significance**

  If successful, this project will demonstrate that a significant portion of the formal epistemology of collective rationality is sensitive to the binary/probabilistic distinction in ways previously unquantified. It offers a unification of Judgment Aggregation and Opinion Pooling literatures, suggesting that many impossibility results are not absolute barriers but artifacts of representation. This has direct implications for the design of epistemic institutions (courts, expert panels, central banks), suggesting that the focus should shift from voting rules to the management of uncertainty and the explicit setting of acceptance thresholds.
