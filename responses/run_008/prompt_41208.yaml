  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe map Capabilities to "Action Space."
      *   *Correction:* No, Sen distinguishes between capabilities (potential) and functionings (realized). In rationalist terms, this is the difference between the *set of reachable states* vs. the *actual trajectory*. I need to make sure I don't just say "freedom to choose" but "the value of the opportunity set."
      *   *Initial thought:* Say Utility Functions are fixed.
      *   *Correction:* Rationalists acknowledge preference change, but standard microeconomics (revealed preference) treats them as fixed for analysis. I need to highlight that Adaptive Preferences break the standard "Revealed Preference = True Utility" assumption.
      *   *Crucial Point:* The user asks "which commitments I'd have to give up." I need to identify specific rationalist dogmas (e.g., "Utility is ordinal," "Preferences are sovereign," "Agents are black boxes").

  9.  **Final Polish:** Check the "Brute Luck" translation. Dworkin's insurance scheme is essentially a mechanism design problem. I should frame it as a "Veil of Ignorance" insurance market.

  **(Self-Correction on Diagnostic):** Be careful not to just bash rationalism. Acknowledge where philosophy is indeed fuzzy (Sen's list of capabilities is often arbitrary). But emphasize that the *normative force* of responsibility is the big missing piece.

