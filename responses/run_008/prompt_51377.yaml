answer: |-
  Here is the translation of the Doctrine of Double Effect (DDE) and the classic trolley variants into Structural Causal Models (SCMs), followed by the residue report you requested.

  ### 1. The Translation Layer

  To map these ethical problems into your vocabulary, we define a Structural Causal Model $M = \{U, V, F, P(u)\}$.

  **Variables:**
  *   $A \in \{0, 1\}$: Agent's Action ($0=$ inaction, $1=$ intervention).
  *   $T$: Trolley State (Trajectory/Velocity).
  *   $D_1 \in \{0, 1\}$: Death of the One.
  *   $D_5 \in \{0, 1\}$: Death of the Five.
  *   $Y$: Utility Outcome (typically $Y = 5(1-D_5) - 1(D_1)$).

  **The Doctrine of Double Effect (Causal Restatement):**
  An intervention $do(A=1)$ is permissible if and only if:
  1.  **Permissible Act:** $A$ is not intrinsically forbidden (exogenous constraint).
  2.  **No Mediated Harm:** The bad outcome $D_1$ is not a *mediator* on the causal path from $A$ to the good outcome $\neg D_5$. Formally, the Natural Direct Effect of $A$ on $\neg D_5$ not through $D_1$ must account for the utility gain, while the path $A \to D_1 \to \neg D_5$ is morally inadmissible.
  3.  **Intentionality Constraint:** The agent's selection of $A$ is optimized for $\neg D_5$, treating $D_1$ as a constrained nuisance parameter ($P(D_1=1|do(A)) > 0$) rather than a decision variable or mechanism.
  4.  **Proportionality:** $E[Y | do(A=1)] > E[Y | do(A=0)]$.

  **"Doing vs. Allowing":**
  *   **Doing:** $do(A=1)$. We intervene on the graph, severing incoming edges to $A$.
  *   **Allowing:** $do(A=0)$ (or conditioning on the natural course $A_{nat}$). We observe the system evolving under $F$ without external interruption.

  ---

  ### 2. The Causal Graphs

  Here are the DAGs for the three classic cases. Note that $U$ (unobserved exogenous variables) are omitted for clarity but assumed to determine baseline trolley behavior.

  #### Case A: The Switch (Bystander)
  *Scenario:* Flip switch to divert trolley from 5 to 1.
  *Structure:* The diversion saves the 5. The 1 dies because they are on the new path, but their death does not *cause* the 5 to be saved.

  $$ A \to T_{\text{track}} $$
  $$ T_{\text{track}} \to D_5 \quad (\text{negative effect}) $$
  $$ T_{\text{track}} \to D_1 \quad (\text{positive effect}) $$
  $$ \text{No edge } D_1 \to D_5 $$

  *   **Causal Status of $D_1$:** Collateral damage. $D_1$ and $\neg D_5$ are parallel consequences of $T_{\text{track}}$.
  *   **Mediation:** $D_1$ does not mediate the effect of $A$ on $D_5$.
  *   **DDE Verdict:** Permissible. $D_1$ is a side effect (fork), not a means.

  #### Case B: The Fat Man (Footbridge)
  *Scenario:* Push man onto tracks. His body stops the trolley.
  *Structure:* The man's impact (and subsequent death) is the physical mechanism that stops the trolley.

  $$ A \to \text{Push} $$
  $$ \text{Push} \to D_1 $$
  $$ D_1 \to \text{Stop}_T \quad (\text{Body blocks track}) $$
  $$ \text{Stop}_T \to \neg D_5 $$

  *Simplified DAG:*
  $$ A \to D_1 \to \neg D_5 $$

  *   **Causal Status of $D_1$:** Mediator. The good outcome ($\neg D_5$) is counterfactually dependent on the bad outcome ($D_1$).
  *   **Mediation:** $D_1$ fully mediates the saving of the 5. If you prevent $D_1$ (e.g., push him but he survives/misses), $\neg D_5$ does not occur.
  *   **DDE Verdict:** Impermissible. Harm is a *means*.

  #### Case C: The Loop
  *Scenario:* Divert trolley to side track. Side track loops back to main. 1 person on side track is heavy enough to stop trolley, preventing it from looping back to kill the 5.
  *Structure:* Structurally identical to Fat Man, despite superficial similarity to Switch.

  $$ A \to T_{\text{side}} $$
  $$ T_{\text{side}} \to D_1 $$
  $$ D_1 \to \text{Stop}_T $$
  $$ \text{Stop}_T \to \neg D_5 $$

  *   **Causal Distinction:** In Switch, $T_{\text{track}}$ saves the 5. In Loop, $D_1$ (the stopping power of the body) saves the 5.
  *   **DDE Verdict:** Impermissible (by strict DDE logic). The death is instrumentally necessary for the good outcome.

  ---

  ### 3. Locating "Intention" on the Graph

  This is the breakpoint. In standard SCMs, **intention is not a graph property.**

  1.  **Foreseen:** This is simply the interventional probability $P(D_1=1 | do(A=1))$. If this is $>0$, the harm is foreseen. This is readable from the graph + parameters.
  2.  **Intended:** This cannot be read from the DAG structure alone. The DAG for Switch and Loop might look similar regarding $A \to \dots \to D_1$. The difference lies in the **Agent's Objective Function**.

  To model intention, you must augment the SCM with a Decision Model:
  *   Let $U(\cdot)$ be the utility function.
  *   Standard Consequentialism: Choose $A$ to $\max E[U(D_1, D_5)]$.
  *   DDE Constraint: Choose $A$ to $\max E[U(D_1, D_5)]$ **subject to** the constraint that no path $A \to D_1 \to \neg D_5$ exists in the active causal model.

  "Intention" is not a node $I$. It is a **constraint on the admissible paths** used in the optimization policy. "He meant the death" translates to: *The agent selected $A$ specifically because the path through $D_1$ yielded high utility.* "He merely foresaw the death" translates to: *The agent selected $A$ because of the path $A \to \neg D_5$, accepting the correlation induced by the fork $A \to T \to D_1$.*

  ---

  ### 4. Residue Report

  Here is the audit of what translates, what distorts, and what vanishes.

  #### A. Clean Translations (The Isomorphisms)
  1.  **Means vs. Side Effect $\approx$ Mediation vs. Fork:** This is the strongest fit. The moral intuition that "using" someone is worse than "hitting" someone maps cleanly onto $A \to D_1 \to Y$ (Mediation) vs. $A \to D_1$ and $A \to Y$ (Fork). The causal structure explains the *instrumentalization*.
  2.  **Loop vs. Switch:** Causal analysis correctly identifies these as distinct. Philosophers often struggle to explain why Loop is morally closer to Fat Man than Switch. CI solves this immediately: check the edge $D_1 \to \text{Safety}$. If it exists, it's a means.
  3.  **Counterfactual Dependence:** The test "Would the 5 be saved if the 1 didn't die?" is exactly the Natural Indirect Effect (NIE). If NIE is non-zero, the death is a means.

  #### B. Distorted Fits (The Strain)
  1.  **Closeness / Directness:** DDE often cares about how "direct" the harm is. In CI, a chain $A \to B \to C \to D_1$ is structurally the same as $A \to D_1$ regarding mediation. Moral intuition, however, often degrades with distance (e.g., pressing a button vs. pushing). CI has no native "moral distance" metric, only path length, which doesn't always align with culpability.
  2.  **Intention as State vs. Process:** As noted, CI models the *world*. DDE models the *agent's relationship to the world*. To fit "intention" into CI, you have to model the agent as part of the system (Decision Theory). But DDE treats intention as a pre-condition for the act's validity, not just a variable to be optimized. This requires **constraining the graph topology** itself, which is outside standard inference.
  3.  **The "Doing/Allowing" Asymmetry:** In CI, $do(A=0)$ is just another intervention. In ethics, "allowing to die" is often treated as having no causal agency (zero responsibility), whereas CI assigns responsibility based on counterfactuals ($Y_{A=1} \neq Y_{A=0}$). If I *could* have flipped the switch ($A=1$) and didn't ($A=0$), CI says I am causally relevant to the deaths. DDE says I am not morally responsible. CI over-assigns causal responsibility compared to moral intuition.

  #### C. No Expression (The Void)
  1.  **Normativity:** CI tells you $P(D_1=1 | do(A=1)) = 1$. It cannot tell you $P(D_1=1 | do(A=1)) = \text{Forbidden}$. The "Ought" is completely absent. You can model the constraint, but the *source* of the constraint (human rights, sanctity of life) is external to the formalism.
  2.  **Rights as Trumps:** In DDE, the 1's right not to be used as a means often trumps the utility of saving the 5. In CI/Decision Theory, this is just a weight in a utility function ($w_1 \to \infty$). But DDE argues it's a *structural* prohibition, not a weighting issue. CI struggles to represent "lexical priorities" without breaking the expected utility framework.
  3.  **Epistemic Uncertainty:** DDE often hinges on what the agent *believed* about the graph. If the agent *thought* it was a Switch case (fork) but it was actually a Loop case (mediation), are they guilty? CI deals with the True Graph. Ethics deals with the Perceived Graph. This requires a layer of causal discovery uncertainty that standard do-calculus ignores.

  ---

  ### 5. Conclusion

  **The Verdict:** The apparent fit between causal inference and the Doctrine of Double Effect is **structurally isomorphic but ontologically empty.**

  The philosophers were not accidentally using causal vocabulary; they were intuitively grappling with **causal topology**. They recognized that *instrumentalization* (mediation) feels different from *collateral damage* (forks). Causal inference validates this distinction rigorously: the Switch and Fat Man cases *are* causally distinct graphs.

  **However,** the residue report shows that CI cannot do the heavy lifting for ethics.
  1.  **Intention is not a graph property.** It is a constraint on the optimization over the graph. CI can describe the mechanism of harm, but it cannot generate the prohibition against using that mechanism.
  2.  **The "Ought" is missing.** You can draw the DAG for the Fat Man case and identify $D_1$ as a mediator. But nothing in the mathematics of $do$-calculus screams "Wrong." You must import the normativity from outside.
  3.  **Responsibility Mismatch.** CI attributes causal responsibility to omissions ($do(A=0)$) where ethics often denies moral responsibility.

  **Final Answer:** The fit is not a coincidence; the philosophers were identifying real causal structures (mediation vs. parallel paths) and assigning them moral weight. But this shows a limitation of **causal modeling as a normative tool**, not a misunderstanding by the philosophers. Causal inference is a engine for truth-conditions, not permission-conditions. It can tell you *if* you are using someone as a means (mediation analysis), but it cannot tell you *why* that is forbidden. The residue is not noise; it is the entirety of the moral claim.
