  4.  **Residue Report:** The Good, The Bad, The Missing.
  5.  **Conclusion:** The Verdict.

  (One more thought on the Loop case): In the Loop case, the trolley *would* kill the 5 if it loops. The 1 stops it. So $D_1$ prevents $D_5$. This is $D_1 \to \neg D_5$. In Switch, the *diversion* prevents $D_5$. $D_1$ is irrelevant to $D_5$. This confirms the Mediation vs. Parallel distinction.

