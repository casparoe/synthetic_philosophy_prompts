  **Diagnosis of Disagreement:** I largely buy your diagnosis that the disagreement lives upstream, but I would locate equal weight on the **Epistemic Defeat** term rather than just Realism. You and your roommate likely agree on the empirical genealogy (evolution/disgust), but you differ on whether reflection is a truth-tracking corrective (your view) or merely another preference-generating mechanism (roommate's view). If reflection is just another causal push, knowing the origin of the first intuition doesn't defeat it; it just pits one cause against another. Thus, the gap is split between whether there is a truth to track (Realism) and whether reflection accesses it (Epistemic Defeat).
