      *   *Move 8: Dana's "Moral Expansion" Defense.*
          *   Dana: "Weird implications" isn't an argument. Moral progress often looks unhinged beforehand (animals, fetuses, etc.).
          *   *Analysis:* Historical defense of radical moral views.

  3.  **Evaluate "Who is Right" (Step-by-Step):**
      *   *Constraint:* In philosophy, "right" is rarely absolute. I need to assess *argumentative strength* and *philosophical coherence*.
      *   *Move 1:* Dana has the phenomenological edge (the feeling), Marcus has the ontological edge (the fact of code).
      *   *Move 2 (Epistemic Parity):* Dana is strong here. This is the hardest point for Marcus. The problem of other minds is real.
      *   *Move 3 (Machinery):* Marcus regains ground. We *do* know the code. It's not a black box like an animal brain.
      *   *Move 4 (Functionalism):* Dana is theoretically consistent, but is the functional organization *actually* there?
      *   *Move 5 (Continuity/Thin Org):* Marcus makes a crucial distinction. Pain usually implies a *sufferer*.
      *   *Move 6 (Momentary Subjects):* Dana is logically consistent, but pushes a controversial metaphysical view.
