      *   *Move 3: Marcus's Substrate/Machinery Argument.*
          *   Marcus: Animals share biological machinery (neurons, nociceptors). Game code is just hitboxes + animations. No persistent experience.
          *   *Analysis:* Appeals to physicalism/biological naturalism. Distinguishes between *simulating* pain and *instantiating* pain.
      *   *Move 4: Dana's Functionalist Counter (Substrate Chauvinism).*
          *   Dana: Functionalism says causal organization matters, not substrate. If it acts like pain, it is pain. Don't peek behind the curtain.
          *   *Analysis:* Classic Putnam/Fodor functionalism. Challenges the privilege of biology.
      *   *Move 5: Marcus's "Thin Organization" & Continuity Argument.*
          *   Marcus: The organization is too thin (few variables). No memory, no persistence across reloads. No continuing subject.
