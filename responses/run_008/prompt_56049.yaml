  Diagnosis

  This is a classic formulation of the **Paradox of Dogmatism**, originally articulated by Gilbert Harman in 1973. To answer your specific question: the argument is logically **valid**, but it is **unsound**. The inference from (3) to (4) is a straightforward application of Modus Ponens using premise (2), so there is no hidden logical step between them; your suspicion is correctly targeting the *content* of (2), not the deduction itself. Premise (2) looks fine at the dinner table because it appeals to the **Closure Principle** (if I know $p$, and I know $p$ entails $q$, then I know $q$). Since the truth of $p$ entails that evidence for $\neg p$ is misleading, closure suggests you should be able to know the evidence is misleading.

  However, premise (2) fails because it ignores the **defeasibility** of knowledge. Knowledge is not a permanent status; it is a current relation between belief, truth, and justification. Encountering strong counter-evidence (like a manuscript from a top theorist) can undermine your justification for $p$, causing you to lose knowledge of $p$. If you lose knowledge of $p$, you lose the basis for claiming the evidence is misleading. The move from (3) to (4) implicitly assumes your current knowledge state is stable across the encounter with new evidence, but that stability is exactly what the new evidence threatens. You cannot use current knowledge to immunize yourself against evidence that could destroy that very knowledge.

  The price list

  **Rejecting (1):** If you deny that you know RH is open, you embrace a radical skepticism about testimony and mathematical consensus. This costs you almost all empirical and social knowledge, forcing you to admit that checking the Clay Institute page or trusting colleagues yields only belief, not knowledge. This is too high a price for a math grad student, as it undermines the collaborative basis of modern research.

  **Rejecting (2):** If you deny that knowledge guarantees immunity to defeaters, you accept that knowledge is fragile and context-sensitive. This costs you Cartesian certainty and the ability to use known truths to dismiss counter-arguments without investigation. The price is intellectual humility: you must acknowledge that even what you "know" requires justification that could be rationally undermined, obligating you to engage with counter-evidence rather than ignore it.

  Verdict

  Tell your friend that this is the known Paradox of Dogmatism, which is valid but unsound because premise (2) falsely assumes knowledge is indefeasible by future evidence. Concede that knowing $p$ does not entitle you to ignore counter-evidence, because that evidence could destroy the justification required to know $p$ in the first place. Keep premise (1), reject premise (2), and admit that you are obligated to read the manuscript.
