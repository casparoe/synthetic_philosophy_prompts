  **WillCheck™ Customer Support Portal**

  **Welcome to the WillCheck™ Help Centre.** Below you will find answers to frequently asked questions regarding our ethical purification packages. Our mission is to isolate the noumenal core of your agency from the contamination of chance.

  **Q: What subscription tiers do you offer?**
  **A:** WillCheck™ offers four levels of moral decontamination, designed to strip away specific vectors of luck.
  *   **Bronze (Resultant Purge):** Removes assessment bias caused by external outcomes. Ideal for clients whose careless driving did not, by chance, result in injury.
  *   **Silver (Circumstantial Scrub):** Evaluates your will independent of the historical situations you happened to face.
  *   **Gold (Constitutive Cleanse):** Filters out temperament and capacities formed by genetics and upbringing.
  *   **Platinum (Full Causal Decontamination):** Isolates the will from all prior causal chains. This ensures your ethical record reflects only what originates strictly from you, rather than the universe.

  **Q: Does WillCheck™ cover feelings of remorse or regret?**
  **A:** It is vital to distinguish between remorse and agent-regret. Regret, including agent-regret, concerns the state of the world following an action. As such, it makes no claim about the quality of the will and is considered external residue. WillCheck™ cannot process regret. Clients are welcome to retain this residue at no charge, though it is not factored into your certified ethical standing. Remorse regarding the will itself is processed only under Gold and Platinum tiers.

  **Q: Can you share a success story from the Platinum tier?**
  **A:** Certainly. One subscriber, following Full Decontamination, received a certificate praising her for an act of supreme benevolence. She noted that she could not recognise the act as hers, nor could she remember forming the intention in question. However, she was relieved to know that, at the moment of willing, her moral status was pristine, even if the memory of the agency required to sustain it had been successfully purged as constitutive luck.

  **Q: Isn't WillCheck™'s own assessment subject to luck? Your assessors have their own biases and histories.**
  **A:** We acknowledge that our standards, corporate history, and your capacity for self-scrutiny are themselves products of chance. However, this objection is addressed in Section 42.b of our Terms and Conditions. By subscribing, you agree that the luck inherent in the assessment process is categorically distinct from the luck inherent in your agency. We treat this paradox in exactly the same way: it is filed under 'External Variables' and does not invalidate your certificate.

  **Q: I have purchased the Platinum package. If you remove outcomes, circumstances, temperament, and causal history, what precisely is being certified?**
  **A:** This is an excellent question that demonstrates deep engagement with our methodology. Once all attributable factors are removed, what remains is the pure substrate of agency itself. While this substrate may lack content, memory, or connection to the physical world, it possesses compliance. To honour your inquiry, we have issued you a complimentary Certificate of Compliance for an unnamed act of will. It is fully transferable and valid in all jurisdictions where morality is recognised.

  **Still have questions?**
  Please submit a ticket. Our team is currently unavailable due to circumstances beyond their control.
