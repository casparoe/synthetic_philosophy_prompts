answer: |-
  Your roommate is correct that DNA functions as a literal code by information-theoretic standards, but wrong that this necessitates a mind, whereas you are right that it is physical chemistry but wrong to dismiss the informational description as mere metaphor.

  **The "Literal Code" Claim**
  On the technical definition, your roommate wins. Biologists and philosophers of biology generally agree that DNA meets the criteria for a genuine information system, not just a poetic analogy. It possesses Shannon information (sequence specificity), channel capacity, and noise correction mechanisms. The mapping between codons and amino acids is indeed largely arbitrary (the "frozen accident" hypothesis); there is no fundamental chemical law forcing UUU to code for Phenylalanine, much like there is no physical law forcing the bits `01000001` to represent "A". You were on shaky ground calling it a metaphor; in modern biology, "information" is a measurable, causal property of the sequence, not just a figure of speech.

  **The "Chemistry vs. Reading" Claim**
  Your roommate's counter about voltage levels is also strong. Information theory explicitly deals with how physical states (voltages, molecular shapes) acquire symbolic function through systematic mapping within a system. A ribosome "reading" mRNA is physically just molecules binding, but so is a CPU "reading" RAM. The distinction isn't the physics, it's the functional organization. However, here lies the subtle conflation: in a computer, the mapping is imposed by an external engineer; in a cell, the mapping is maintained by natural selection. The ribosome doesn't "know" the code; it is physically constructed by prior code to enforce the mapping. Your roommate treats the *existence* of the mapping as evidence of intent, whereas biology treats it as evidence of evolutionary stability.

  **The "Coder" Inference**
  This is where his argument breaks. He conflates *semantic* information (meaning assigned by a mind) with *biological* information (functional specificity selected by survival). While human codes (ASCII, Morse) are designed, biological codes are evolved. Natural selection acts as a blind editing process that preserves arbitrary mappings because they work, not because they were intended. The leap from "this system uses arbitrary symbols" to "a mind created it" is a philosophical assumption (often associated with Intelligent Design), not a scientific deduction. Biologists view the "code" as an emergent property of chemical evolution, where early stereochemical affinities were locked in and standardized over billions of years, not downloaded from a external source.

  **The Universality Point**
  This point quietly hurts your roommate more than it helps him. While the code is nearly universal, it is not perfectly so; there are known variant genetic codes in mitochondria, certain bacteria, and ciliates. If the code were a singular act of perfect design, variations would be unexpected bugs. Evolution, however, predicts exactly this: a common ancestral code that drifts slightly in isolated lineages where the cost of changing the code is low (like in small mitochondrial genomes). The universality is strong evidence for common descent (all life inherited the same "software" from a single ancestor), which explains the pattern without requiring a designer to explain why the designer would introduce incompatible updates in mitochondria.

  **Bottom Line**
  Your roommate correctly identifies that life relies on genuine information processing with arbitrary symbols, but he incorrectly assumes information processing requires a mental agent. You correctly identify that it is all physical chemistry, but you incorrectly assume that physical systems cannot generate code-like structures without a mind. The science supports the "code" description but explains its origin through evolutionary fixation rather than design.
