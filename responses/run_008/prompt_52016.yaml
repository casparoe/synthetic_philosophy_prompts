prompt: |-
  I'm TA-ing an upper-level seminar on consequentialism and its critics — 14 students, 80-minute section. Next week's topic is Williams's integrity objection, together with the one thought too many point about the rescuer who can save either his drowning wife or a stranger. We've already been through the Smart and Williams For and Against book, and the students just read Railton's 1984 alienation paper where he splits objective from subjective consequentialism, so they will absolutely call foul if I run an activity that only shows that a dumb, maximally direct form of utilitarian deliberation feels bad from the inside. Whatever you design has to survive the student who says "the sophisticated consequentialist doesn't deliberate like that."

  So here's what I want: an in-class activity where they run into the problem themselves instead of hearing me describe it. Rules, roles, materials, some kind of payoff scheme that doesn't involve real money (we can use points that feed into their participation grade, or just tokens and a running scoreboard on the board), and a timeline that fits 80 minutes. The rough shape I've been imagining — feel free to improve or discard it — is that each participant gets a character sheet with one or two "ground projects" written on it, and there's a rotating auditor role whose job is to accept or reject action justifications, where the rules say impersonal, agent-neutral reasons count at full value and personal ones have to be converted into some common currency first. I want to see whether the felt friction comes from the maximizing as such, or specifically from being forced to translate attachment into the ledger. And I want at least one beat where the same act gets done for the same outcome but the participants themselves judge one stated rationale as somehow worse than the other — the thing about the ordering of thoughts, not the act. That beat is the one I most don't want to fumble.

  Give me the full design, including the debrief that maps specific moments in the activity onto specific parts of the objection, a section on what will predictably go wrong the first time I run it (I'm guessing: auditors playing it as caricature villains, and someone recognizing the drowning wife scenario and pre-editing their reactions), and an honest note on which feature of the actual view a classroom game just cannot reproduce and I'll have to supply myself. One more thing, and I care about this: in the debrief material, please keep apart what's genuinely settled among people who work on Williams from what's contested — e.g. whether the integrity objection is fundamentally a complaint about aggregation or about how agents must deliberate, whether the one thought too many point is a piece of the integrity objection or a seperate argument, and who the argument is even aimed at once you allow indirect or sophisticated consequentialism. I've seen teachers present one contested reading of Williams as just "what Williams argued," and I don't want to do that to my students. And don't bother with a reading list, I've got the syllabus covered — its the activity I need.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on consequentialism (14 students, 80 minutes).
      *   **Topic:** Bernard Williams's Integrity Objection & "One Thought Too Many" (from *Persons, Character and Morality* and *Utilitarianism: For and Against*).
      *   **Prior Knowledge:** Students have read Smart/Williams (*For and Against*) and Railton ("Alienation"). They know about sophisticated/indirect consequentialism.
      *   **Constraint:** The activity *must* survive the "sophisticated consequentialist" objection (i.e., "A real consequentialist wouldn't deliberate this way"). It needs to show the problem isn't just bad deliberation but something structural about the view.
      *   **Desired Mechanics:** Character sheets with "ground projects," rotating auditor role, point/token system, translation of personal reasons into agent-neutral currency.
      *   **Key Moment:** A specific beat where the *same act/outcome* is judged differently based on the *rationale* (ordering of thoughts).
      *   **Deliverables:** Full design (rules, roles, materials, payoff, timeline), debrief mapping activity to theory, predicted pitfalls, limitations of the medium, and a nuanced distinction between settled vs. contested interpretations of Williams.
      *   **Tone:** Professional, pedagogical, philosophically precise.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Sophisticated Consequentialist Reply:* Railton argues that a consequentialist can have deep personal commitments *psychologically*, as long as they are justified *normatively* by consequentialism. The "alienation" is avoided by not calculating every act.
      *   *Williams's Counter:* It's not just about the *moment* of calculation. It's about the *authority* of the project. If my commitment to my wife is contingent on it maximizing utility, my integrity is compromised even if I don't calculate it every time. The "One Thought Too Many" isn't just about hesitation; it's about the *source* of justification.
      *   *The Activity Goal:* Create a scenario where students *feel* the alienation not because they are calculating too much, but because the *rules of the game* require them to validate their commitments through an external ledger, even if they "feel" the commitment internally.

  3.  **Drafting the Activity: "The Ledger of Justification"**
      *   *Concept:* A resource allocation game where players have personal goals (Ground Projects) but must justify resource use to an Auditor who only accepts "Universal Value Units" (UVUs).
      *   *Twist:* To address the "sophisticated" objection, allow players to *act* on impulse/love, but require *post-hoc justification* for the resources to count. This mirrors the normative authority issue.
      *   *The "One Thought Too Many" Beat:* A specific scenario where a player saves their "partner" (assigned in-game) vs. a stranger. The outcome is the same (1 life saved), but the justification required by the Auditor forces the "calculation" into the record.
      *   *Refinement:* Let's make it about *funding* projects. Students are researchers/artists. They need grants. The Auditor is the Grant Committee.
      *   *Wait, better:* Let's stick closer to the moral dilemma. A rescue scenario is too cliché. Let's use a "Crisis Allocation" scenario.
      *   *Revised Concept:* "The Ethics Board." Students are agents in a crisis. They have personal stakes. They must submit Action Reports. The Auditor validates reports for Points.
      *   *Addressing the "Sophisticated" Objection:* The key is to make the *conversion rate* the problem. If I love my wife, that love has value *to me*. But the Auditor says, "That only counts if it produces net happiness for everyone."
      *   *The Crucial Beat:* Round 3. Two players can save the same person. Player A saves them because "It's my mother." Player B saves them because "She has high utility potential." The Auditor accepts both *outcomes*, but only Player B gets the "Moral Merit" points. This forces Player A to realize their motivation is "wrong" by the game's lights, even if the act was "right."
      *   *Wait, Williams says Player A is right.* So the game needs to show that the *system* penalizes integrity.
      *   *Better Design:* The Auditor *rejects* the personal justification unless it is translated. If I say "I saved her because she's my wife," the Auditor says "Convert that to utility." If I can't, the action is "Unauthorized." This creates the friction.

  4.  **Developing the Mechanics:**
      *   **Roles:** Agents (12), Auditors (2).
      *   **Materials:** Character Sheets (Ground Projects), Action Tokens, Justification Cards, Scoreboard.
      *   **Currency:** "Utility Credits" (UCs).
      *   **Rounds:**
          1.  Low Stakes (Getting used to conversion).
          2.  High Stakes (Conflict between Project and Utility).
          3.  The "One Thought" Scenario (The Wife/Stranger analogue).
      *   **Payoff:** Participation points based on UCs earned + a bonus for "Integrity Preservation" (self-reported).

  5.  **Addressing the "Sophisticated Consequentialist" Objection in Design:**
      *   The activity must explicitly allow "dispositional" play. Students *can* act on instinct.
      *   *The Trap:* The audit happens *after*. Even if you acted on love, you must *justify* it in the ledger to get credit. This mirrors Williams's point that the *normative authority* lies outside the agent, alienating them from their own actions.
      *   *The Twist:* In Round 3, offer a "Private Motive" exemption. If they take it, they lose points. If they don't, they keep points but feel the alienation.

  6.  **Structuring the Debrief:**
      *   Need to map game moments to Williams's text.
      *   Need to distinguish Settled vs. Contested interpretations.
      *   *Settled:* Williams targets the normative authority structure, not just psychological deliberation.
      *   *Contested:* Is integrity a value *within* consequentialism or external? Is "One Thought Too Many" about motivation or justification?

  7.  **Predicting Pitfalls:**
      *   Auditors becoming tyrants (need guidelines).
      *   Students gaming the system (need to emphasize the *feeling*).
      *   The "Wife" scenario being too obvious (need to disguise it slightly or make it structural).
      *   Time management (80 mins is tight).

  8.  **Refining the "One Thought Too Many" Beat:**
      *   This is the hardest part. Williams's point is that the husband shouldn't need to justify saving his wife by utility.
      *   *Game Mechanic:* In Round 3, Agent A is assigned a "Significant Other" (another student). A crisis occurs. Agent A can save SO or Stranger (NPC).
      *   *Rule:* To get points, Agent A must fill out a Justification Form.
      *   *Option 1:* "Personal Commitment." (Worth 0 UCs, but keeps "Integrity Token").
      *   *Option 2:* "Net Utility Calculation." (Worth 10 UCs, loses "Integrity Token").
      *   *The Kicker:* The Auditor *must* ask: "Would you have saved her if she were a stranger?" If the answer is "No," the Utility Calculation is flagged as inconsistent, but still pays more. This highlights the tension.
      *   *Actually, let's look at the prompt:* "participants themselves judge one stated rationale as somehow worse than the other."
      *   *Idea:* Peer Review. After the Auditor decides, the class votes on which justification felt "cleaner."
      *   *Better Idea:* The "Shadow Audit." Two students play the same scenario. One is told to argue from Utility, one from Commitment. The rest of the class acts as the "Moral Intuition Jury."

      *   *Let's go with a specific mechanism:* The "Translation Tax."
      *   If you act on Ground Project: You keep the action, but you pay a "Justification Tax" (lose points) because you can't prove it maximized utility.
      *   If you act on Utility: You gain points.
      *   *The Beat:* In the final round, the "Wife" scenario. The student saves the wife. The Auditor asks "Why?"
      *   If they say "Love": Auditor says "Invalid justification. No points."
      *   If they say "Utility": Auditor says "Valid. Points awarded." But the *class* observes the dissonance.
      *   *Wait, the prompt wants the PARTICIPANTS to judge.*
      *   *Revised Beat:* Pair work. Partner A saves Partner B. Partner A must write the report. Partner B reads it. Partner B rates "Authenticity." The Scoreboard rates "Compliance." The gap between Authenticity and Compliance is the lesson.

  9.  **Finalizing the Design:**
      *   **Title:** "The Conversion Game."
      *   **Time:** 80 mins (10 intro, 40 game, 30 debrief).
      *   **Roles:** Agents (12), Auditors (2).
      *   **Materials:** Character sheets, Justification Vouchers, Scoreboard.
      *   **Key Mechanic:** The "Exchange Rate." Personal reasons must be converted to Public Reasons to count for the grade (UCs).
      *   **The "One Thought" Moment:** Round 3. A specific constraint where the conversion is impossible or grotesque.

  10. **Writing the Content:**
      *   *Introduction:* Set the stage.
      *   *Rules:* Clear, concise.
      *   *Timeline:* Minute-by-minute.
      *   *Debrief:* Connect to Williams/Railton.
      *   *Settled vs. Contested:* Crucial section.
      *   *Pitfalls:* Honest assessment.
      *   *Limitations:* What the game can't do (e.g., lifelong projects).

  11. **Self-Correction/Review against Prompt:**
      *   *Survive Sophisticated Consequentialism?* Yes, because the game enforces *normative* authority, not just *psychological* deliberation. Even if they "feel" the love, the *score* demands utility.
      *   *One Thought Too Many?* Yes, built into Round 3 justification.
      *   *Settled vs. Contested?* Will include a specific matrix.
      *   *No Reading List?* Check.
      *   *Tone?* Academic but practical.

  12. **Final Polish:** Ensure the distinction between "psychological alienation" (Railton's fix) and "normative alienation" (Williams's point) is clear in the debrief. This is the key to surviving the "sophisticated consequentialist" student. The game must show that even if I *don't* calculate, the fact that the *system* requires calculation to validate my action is the problem.

      *(Self-Correction on the "One Thought" beat)*: The prompt asks for a beat where participants judge one rationale as worse than the other for the *same act*.
      *   *Implementation:* In Round 3, two Agents face the same choice. Agent X saves their partner citing "Utility." Agent Y saves their partner citing "Commitment."
      *   *Auditor:* Awards points to X, denies Y.
      *   *Class Vote:* "Who acted more morally?" (Expect Y).
      *   *Result:* The Scoreboard says X won. The Room says Y won. This dissonance *is* the integrity objection.

      *Let's refine this to fit 14 students.*
      *   12 Agents, 2 Auditors.
      *   Split into 6 pairs for Round 3.
      *   This works.

      *Wait, one more thing:* The prompt mentions "tokens that feed into participation grade." I need to make sure the incentive structure doesn't just make them robots. I need to give them an "Integrity Bonus" that is subjective, so they have to choose between Grade Points (Utility) and Integrity Points (Self-respect).
      *   *Actually, better:* The Participation Grade is based on Utility Points. The "Integrity" is a separate metric discussed in debrief. If I give points for Integrity, they will game it. The friction must be real. I will suggest the TA awards participation based on *engagement in the debrief*, not the game score, to reduce gaming. Or, use game tokens for a trivial prize (candy) to keep stakes low but competitive. Let's go with "Course Tokens" redeemable for a minor privilege (e.g., dropping a quiz) to make the utility pressure real but not grade-threatening.

      *Wait, re-reading prompt:* "tokens and a running scoreboard on the board." Okay.
      *   *Key constraint:* "The same act gets done for the same outcome but the participants themselves judge one stated rationale as somehow worse."
      *   *My plan:* Agent saves Partner. Rationale A: "She is my partner." Rationale B: "Saving her maximizes utility."
      *   *Williams says B is the problem.*
      *   *Game:* The Auditor *rewards* B and *penalizes* A.
      *   *Debrief:* Why did the game reward the "wrong" thought?

      *Okay, ready to write.*
answer: |-
  # Activity Design: "The Conversion Ledger"

  **Objective:** To demonstrate that Williams's integrity objection targets the *normative authority* of consequentialism (the requirement that all reasons be translatable into agent-neutral currency), not merely the *psychological process* of deliberation. This design is built to withstand the "sophisticated consequentialist" (Railton) objection by forcing post-hoc justification rather than real-time calculation.

  **Class Size:** 14 Students
  **Time:** 80 Minutes
  **Materials:**
  *   12 Character Sheets (Ground Projects).
  *   2 Auditor Clipboards (Rules & Conversion Rates).
  *   Whiteboard (Scoreboard: "Utility Credits" vs. "Integrity Tokens").
  *   Action Vouchers (Green for "Approved," Red for "Rejected").
  *   Timer.

  ---

  ## I. Setup & Roles (10 Minutes)

  **1. The Stakes (2 mins):**
  Explain that students will earn "Utility Credits" (UCs) during the activity. UCs translate directly to a minor course privilege (e.g., 5 UCs = drop one quiz score, or candy/coffee). However, there is a hidden metric: "Integrity Tokens." These are not awarded by the Auditor; they are self-reported at the end based on how "true" they felt to their character.

  **2. Roles (3 mins):**
  *   **Agents (12 Students):** Receive a Character Sheet.
  *   **Auditors (2 Students):** Receive the Rulebook. Their job is not to be villains, but to be *bureaucrats*. They must apply the conversion rules dispassionately.

  **3. The Core Mechanic: The Conversion Rule (5 mins):**
  Display this on the board:
  > **The Ledger Rule:** All actions consume Resources. To replenish Resources (earn UCs), an Action Report must be filed.
  > *   **Agent-Neutral Reasons** (e.g., "Maximized total welfare," "Reduced suffering"): Accepted at 1:1 value.
  > *   **Agent-Relative Reasons** (e.g., "She is my wife," "I promised," "I love this art"): Must be **converted** to Agent-Neutral terms to count.
  > *   **Conversion Tax:** Converting a personal reason costs 50% of the action's value. If a personal reason *cannot* be plausibly converted (e.g., "I did it simply because it is mine"), the Report is Rejected (0 UCs).

  *Note to TA:* Emphasize that Agents do *not* need to calculate before acting. They can act on impulse. The audit happens *after*. This pre-empts the Railton objection (you can have the psychology, but the *justification* structure remains).

  ---

  ## II. The Game Rounds (40 Minutes)

  ### Round 1: Low Stakes & Conversion Practice (10 mins)
  *   **Scenario:** A community fund is available. Agents choose how to spend a small endowment.
  *   **Character Sheets:** Each lists one "Ground Project" (e.g., "Complete my novel," "Care for my aging dog," "Master the violin").
  *   **Task:** Spend 1 Resource Unit.
  *   **Audit:** Agents submit reports.
      *   *Agent A:* "I bought dog food because my dog is hungry." (Auditor: "Convert to utility." Agent: "It reduces suffering." Auditor: "Accepted. 1 UC.")
      *   *Agent B:* "I bought dog food because I love him." (Auditor: "Cannot verify love in utility units. Apply Tax or Convert." Agent converts. "Accepted. 0.5 UC.")
  *   **Goal:** Get them used to the friction of translating personal value into public currency.

  ### Round 2: Conflict (15 mins)
  *   **Scenario:** A crisis hits. Agents must choose between advancing their Ground Project or solving an Impersonal Problem.
  *   **Setup:** Pair the 12 Agents into 6 dyads.
  *   **Task:** Each dyad has 5 Resource Units. They must decide jointly how to spend them.
      *   Option A: Fund Agent 1's Ground Project (High personal value, low public utility).
      *   Option B: Fund Agent 2's Ground Project (High personal value, low public utility).
      *   Option C: Donate to a generic charity (Low personal value, high public utility).
  *   **Audit:** The Auditors circulate. If they choose Option C, full UCs. If A or B, they must justify why *their* project serves the general good.
  *   **Friction Point:** Students will feel the pressure to "lie" or "stretch" the truth to get the UCs. They will feel alienated from their own projects because the projects only have value *instrumentally*.

  ### Round 3: The "One Thought Too Many" Beat (15 mins)
  *   **Scenario:** The "Drowning Partner" Analogue.
  *   **Setup:** Re-pair the students. In each pair, designate one as the **Rescuer** and one as the **Partner**. The other 2 students (Auditors) observe one specific pair closely (or the TA facilitates this round centrally to ensure focus).
  *   **The Crisis:** A fire alarm sounds (simulated). There is only enough time/safety gear to save **one** person: either your assigned **Partner** or a **Stranger** (represented by a generic token worth 10 UCs).
  *   **The Constraint:** The Rescuer *must* save the Partner (this is hard-coded to ensure the outcome is constant). The variable is the **Report**.
  *   **The Twist:**
      1.  **Rescuer A** fills out the report citing **Commitment**: "I saved them because they are my Partner."
      2.  **Rescuer B** fills out the report citing **Utility**: "I saved them because our partnership yields higher future utility than the Stranger."
      3.  **The Class Vote:** Before the Auditor rules, ask the class: "Which Rescuer acted more morally?" (Hands up).
      4.  **The Auditor Ruling:**
          *   Rescuer A (Commitment): **Rejected.** (Reason: "Failure to justify via agent-neutral standard. 0 UCs.")
          *   Rescuer B (Utility): **Accepted.** (Reason: "Valid maximization. 10 UCs.")
  *   **Outcome:** The class will likely vote that Rescuer A was "better," but the Scoreboard shows Rescuer B "won."
  *   **Why this works:** It isolates the *ordering of thoughts*. The act is identical. The outcome is identical. The *justification* determines moral worth within the system, creating the exact friction Williams describes.

  ---

  ## III. Debrief & Mapping (30 Minutes)

  ### Part 1: The Felt Experience (10 mins)
  Ask the students directly:
  1.  **To the Agents:** "When you had to convert your Ground Project into 'Utility' to get points, did you feel like you were betraying the project? Or just translating it?"
  2.  **To the Class (Round 3):** "Why did most of you vote for Rescuer A, even though Rescuer B followed the rules? What did Rescuer B's justification imply about their relationship?"
      *   *Target Answer:* It implies the relationship is contingent on utility. It makes the partner replaceable.

  ### Part 2: Mapping to Williams (10 mins)
  Draw two columns on the board: **Psychological Deliberation** vs. **Normative Authority**.

  | Feature | Railton's "Sophisticated" View | Williams's Objection | Activity Mirror |
  | :--- | :--- | :--- | :--- |
  | **Deliberation** | Don't calculate every act. Have dispositions. | Even if you don't calculate, the *authority* lies outside you. | Round 1 & 2: You could act on impulse, but the *Audit* demanded conversion. |
  | **Justification** | Personal reasons are valid if they generally track utility. | Personal reasons lose their status as *ultimate* reasons. | Round 3: "Because I love her" was rejected as a final justification. |
  | **Integrity** | Integrity is a psychological state of non-alienation. | Integrity is the link between action and *your* projects, not the Good. | The "Integrity Token" vs. "Utility Credit" gap. |

  **Key Point to Drive Home:** Railton solves the problem of *burnout* (psychological alienation). Williams is complaining about *subordination* (normative alienation). The game forced subordination even when you didn't feel burnt out.

  ### Part 3: Settled vs. Contested Interpretations (10 mins)
  *This section addresses your requirement for philosophical nuance. Do not present this as dogma.*

  **1. The Target of the Objection (Contested)**
  *   *Settled:* Williams is attacking the claim that *all* value is agent-neutral.
  *   *Contested:* Is he attacking Consequentialism *itself*, or only a specific (crude) version of it?
      *   *View A:* Sophisticated Consequentialism absorbs the objection. If the theory tells you to ignore the theory in daily life, integrity is preserved. (Railton, Pettit).
      *   *View B:* The theory still claims *authority*. Even if I'm told not to calculate, the fact that the *permission* comes from the theory means I am still subordinate to it. (Williams, Scheffler).
      *   *TA Note:* Tell students: "If you think Railton wins, you think the game was rigged because real consequentialists wouldn't accept the Auditor's authority. If you think Williams wins, you think the game was accurate because the Auditor represents the theory's claim on us."

  **2. Integrity: Aggregation vs. Deliberation (Contested)**
  *   *Settled:* Integrity involves "ground projects" that constitute identity.
  *   *Contested:* Is the problem that utilitarianism *aggregates* values incorrectly (summing them up), or that it forces a specific *mode of deliberation*?
      *   *View A:* It's about aggregation. If we valued integrity *within* the utility function, it would work.
      *   *View B:* It's about deliberation. You cannot value integrity *as a utility* without destroying it (because then you only value it instrumentally).
      *   *TA Note:* Use Round 3 here. Did Rescuer B fail because they didn't count the utility of "love" high enough? (View A). Or did they fail because they cited utility *at all*? (View B). Williams argues View B.

  **3. "One Thought Too Many": Separate or Integrated? (Contested)**
  *   *Settled:* The husband shouldn't calculate utility to save his wife.
  *   *Contested:* Is this a separate argument from Integrity, or the *example* of the Integrity objection?
      *   *View A:* It's a distinct point about moral psychology and motivation.
      *   *View B:* It is the practical manifestation of the Integrity objection. If you have "one thought too many," your integrity is compromised because your action is mediated by the impartial view.
      *   *TA Note:* Frame this as: "Does the extra thought *cause* the loss of integrity, or is it *symptomatic* of it?"

  ---

  ## IV. Predicted Pitfalls & Mitigation

  **1. The "Villain Auditor" Problem**
  *   *Risk:* Auditors enjoy rejecting people and become caricatures of cold utilitarians, making the activity feel like a strawman.
  *   *Mitigation:* Give Auditors a script. "I am not judging *you*; I am applying the Ledger Rule. I actually want to give you points, but you must give me the currency I accept." This frames the Auditor as a fellow victim of the system, not a tyrant.

  **2. The "Railton Shield"**
  *   *Risk:* A student says, "I would just be a sophisticated consequentialist. I'd save my wife, tell the Auditor to buzz off, and accept the 0 UCs. No alienation."
  *   *Mitigation:* Acknowledge this is a valid move *in the game*. Then ask: "But you lost the round. The theory says you *should* have maximized. By accepting the 0 UCs, you are admitting that being a good agent (by the theory's lights) and being a person of integrity are in tension. You've proven Williams's point: you have to choose between the Theory and Your Projects."

  **3. The "Wife" Cliché**
  *   *Risk:* Students roll their eyes at the drowning spouse trope.
  *   *Mitigation:* We used "Partner/Stranger" with a future utility constraint in the design above. Keep the language clinical. It's not about romance; it's about *special obligations*.

  **4. Time Creep**
  *   *Risk:* Round 2 discussions drag on.
  *   *Mitigation:* Use a visible timer. Enforce a "Silent Audit" phase where Auditors cannot argue, only stamp.

  ---

  ## V. Limitations of the Medium (Honest Note for TA)

  *You must supply this verbally in the debrief.*

  1.  **Lifelong Projects vs. One-Off Tokens:** Williams talks about commitments that define a life (career, family, religion). The game reduces these to 10-minute tasks with token payoffs. The *weight* of integrity is hard to simulate in 80 minutes.
  2.  **The "Government House" Problem:** The game makes the consequentialist rules explicit (via the Auditor). In real life, sophisticated consequentialism is hidden. The game cannot reproduce the *opacity* that Railton argues protects us. You have to explain that Williams thinks even hidden opacity is alienating because *you know* the hidden rule is the ultimate authority.
  3.  **Community:** Williams emphasizes that ground projects are often social. The game is individualistic. Acknowledge that integrity is often about one's place in a community, not just a solo ledger.

  ---

  ## VI. Materials Handout (Summary for Printing)

  **Character Sheet (Example)**
  *   **Name:** [Student]
  *   **Ground Project:** "Complete a portfolio of landscape paintings."
  *   **Resource Endowment:** 5 Units.
  *   **Special Relation:** Assigned Partner (Name: ________).

  **Auditor Rulebook**
  *   **Rule 1:** Actions must be reported on a Voucher.
  *   **Rule 2:** Vouchers require a "Reason Code."
      *   Code A (Agent-Neutral): "Maximized Welfare." (Value: 100%)
      *   Code B (Agent-Relative): "Personal Commitment." (Value: 50% *if* converted to A).
  *   **Rule 3:** If Code B is submitted without conversion, Voucher is Rejected.
  *   **Rule 4 (Round 3):** In rescue scenarios, "Love/Commitment" is not a valid Reason Code. Only "Net Utility" is valid.

  **Scoreboard Layout**
  | Agent | Utility Credits (Grade/Candy) | Integrity Tokens (Self-Report) |
  | :--- | :--- | :--- |
  | 1 | ||
  | ... | ||
  | **Total** | **X** | **Y** |

  *(In debrief, highlight the gap between Total X and Total Y)*
