answer: |-
  **The Abortion Grid: Decoupling Arguments from Intuitions**

  **The Scenarios**

  **Cell 1 (Normal Future, Low Burden):** A woman at thirty-four weeks gestation seeks termination. The pregnancy was planned and desired until recently changed circumstances made parenting untenable. She is healthy; continuing the pregnancy involves standard discomforts and a routine delivery. The fetus is developing normally and is viable.

  **Cell 2 (No Future, Low Burden):** A woman at thirty-four weeks gestation seeks termination. The pregnancy was planned and desired. She is healthy; continuing involves standard discomforts and a routine delivery. Ultrasound reveals anencephaly; the fetus lacks major brain structures and will die within days of birth.

  **Cell 3 (Normal Future, High Burden):** A woman at twenty weeks gestation seeks termination. The pregnancy resulted from contraceptive failure and was never assumed. She has developed severe pre-eclampsia; continuing poses a significant risk of stroke or organ failure. The fetus is developing normally and is viable.

  **Cell 4 (No Future, High Burden):** A woman at twenty weeks gestation seeks termination. The pregnancy resulted from contraceptive failure and was never assumed. She has developed severe pre-eclampsia; continuing poses a significant risk of stroke or organ failure. Ultrasound reveals anencephaly; the fetus will die within days of birth.

  **The Verdicts**

  **Cell 1:** The Future-Like-Ours (FLO) argument condemns abortion here. Depriving the fetus of a normal life trajectory is the primary moral wrong; the future is valuable. The Autonomy argument also leans toward condemnation. Because the pregnancy was voluntarily assumed and the burden of completion is minimal, the woman's responsibility to the dependent fetus outweighs her claim to bodily release. **Consensus: Impermissible.**

  **Cell 2:** The FLO argument permits abortion. Since the fetus lacks a future of value, the primary objection to killing is absent; no future is stolen. However, the Autonomy argument condemns abortion. The woman voluntarily assumed responsibility for this dependent life, and the cost of honoring that responsibility is low. To abort is to renege on a voluntary obligation for convenience. **Opposition (Mirror): FLO Permits, Autonomy Condemns.**

  **Cell 3:** The FLO argument condemns abortion. The fetus possesses a valuable future, and killing deprives it of that future regardless of maternal health. The Autonomy argument permits abortion. The pregnancy was not voluntarily assumed, and the physical burden is grave. The right to bodily integrity overrides the fetus's claim when the cost to the woman is severe. **Opposition (Familiar): FLO Condemns, Autonomy Permits.**

  **Cell 4:** The FLO argument permits abortion. There is no valuable future to deprive. The Autonomy argument permits abortion. The pregnancy was unassumed and the health risk is serious; the woman owes no sacrifice of her health to a dependent she did not invite. **Consensus: Permissible.**

  **The Takeaway**

  This grid isolates the specific features driving each theory. For the FLO argument, the moral weight rests entirely on the *properties of the fetus* (viability, neurological capacity). For the Autonomy argument, weight rests on the *relationship and burden* (voluntariness, health risk).

  Defenders will wrestle the awkward cells back into line. A Marquis defender might argue Cell 2 is still wrong because the fetus belongs to a species with a typical future, or because the parents' investment creates value independent of the fetus's consciousness. A Thomson defender will resist the condemnation in Cells 1 and 2. Thomson explicitly rejects the idea that voluntary sex generates a special responsibility that overrides bodily autonomy; pushing her argument to condemn here requires smuggling in a premise about obligation that trivializes the bodily rights claim. If autonomy is absolute, Cells 1 and 2 become permissible, collapsing the grid into a single axis.

  Do these crossed verdicts reveal a structural flaw? They suggest neither argument is free-standing. The FLO argument relies on the intuition that killing is wrong *unless* burden is high (Cell 3), while the Autonomy argument relies on the intuition that rights are absolute *unless* responsibility is clear (Cell 2). When stripped of their usual companion intuitions—when the fetus has no future or the mother assumed risk—each theory yields conclusions that feel alien to its proponents. The exercise succeeds not by solving the debate, but by showing that your confidence in an argument often depends on whether it is walking alongside your pre-existing camp. Detach them, and you may find you support neither until you see where they lead.
