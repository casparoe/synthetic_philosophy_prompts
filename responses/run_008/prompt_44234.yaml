      *   *Selection:* I am least confident in the *definitive* verdict on whether the specific experimental data *actually* falsifies the specific Aristotelian definition of virtue, because philosophers have reinterpreted the data in ways psychologists might not accept. I need to frame this carefully. Actually, a better uncertainty is the *magnitude* of the trait predictive power in modern meta-analyses vs. the situationist claims of the 90s/00s. Situationism was a reaction to 70s data. Modern psych has pushed back (Fleeson). I should express uncertainty on whether the "popular book" represents current consensus or a specific historical debate.
