      *   *Better approach:* The prompt asks me to audit the *passage*. My uncertainty should be about the *interpretation* of the Milgram distress. While I know the standard critique, there are recent re-analyses (Haslam & Reicher) that suggest it wasn't just obedience but identification with the science. This complicates the "situation vs character" narrative. I will cite this as my uncertainty.

  10. **Refining the Output:**
      *   Make sure to explicitly answer the "move from prediction to existence" question.
      *   Make sure to explicitly answer the "practical lesson" question.
      *   Ensure the "Least Confident" section is distinct and honest.

  11. **Final Review against Constraints:**
      *   High school level appropriate? (Keep jargon explained).
