      *   **User:** High school junior writing an IB Theory of Knowledge (TOK) extended essay.
      *   **Topic:** Stability of character traits (Situationism vs. Virtue Ethics).
      *   **Source Material:** A popular psychology book (likely *The Social Animal* by Elliot Aronson or *The Power of Context* by Malcolm Gladwell, or perhaps *Situationism* by Gilbert Harman/John Doris, but the chapter title "The Death of Character" suggests a specific pop-psch angle). The user admits to reconstructing from notes.
      *   **Task:** Audit the provided argument passage part-by-part.
      *   **Specific Questions:**
          *   Which claims would a social psychologist accept?
