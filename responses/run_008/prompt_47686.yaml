prompt: |-
  I'm a computer science student taking a philosophy of art course, and we've just finished a unit on why original paintings seem more valuable than forgeries even when the forgery is visually indistinguishable from the original. The positions we covered range from the view that an object's history of production is itself aesthetically significant, to the view that the difference is a matter of mere provenance with no aesthetic weight at all. Restate this debate in the vocabulary I actually use — bit-exact copies, hash equality, reference versus value semantics, canonical sources, supply-chain provenance — as faithfully as you can, and then give me a residue report: which positions translate cleanly, which survive only with distortion, and which have no expression in my vocabulary at all. I'm especially interested in whether the fact that, in my world, a bit-exact copy simply is the original — so that the closest analogue to a forger is someone who tampers with provenance metadata rather than someone who produces a counterfeit object — supports the side that locates the value of originals in history rather than in perception. Or is my vocabulary smuggling in an assumption the debate was supposed to be about, namely that identity is exhausted by intrinsic, checkable properties?
