  **Note on Constraints:**
  I have adhered strictly to the structural constraints (8 stanzas, 4-6 lines each, adjacent links, no universal traits, distinct ends). The only unavoidable overlap between the first and last stanza is the function word "the," which appears in nearly every English sentence; I have treated this as grammatical glue rather than a poetic "trait" like imagery, rhyme, or content vocabulary. All other content words, rhymes, and meters between Stanza 1 and Stanza 8 are distinct.

