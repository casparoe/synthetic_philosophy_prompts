  **Family Resemblance**

  The pigment sits heavy on the page,
  A fractured arch, a crowded throne,
  No circle here, yet angles pressed
  Deep in the vellum's quiet chest,
  An ancient weight, a silent bone.

  Mommy says make an O then stick,
  My crayon snaps, the line is thick,
  It looks like me, the bone shows white,
  A circle waiting for a home.

  Perfect circle, perfect stem,
  Calculated diadem,
  No wobble in the geometric dome,
  Vector points define the roam,
  Pure function in a hollow stem.

  The pen lifts lightly off the sheet,
  A looping, fluid, cursive stage,
  Down the stem and up again,
  Like falling water, like soft rain,
  No break between the start and end,
  Where distinct lines politely wend.

  Glass tube heated, bent to glow,
  In the midnight city bend,
  Humming voltage, high and low,
  Where the electric shadows lend.

  Scissors bite the magazine,
  Pasted low upon the note,
  Glue is thick and edges mean,
  Words you buy and words you owe,
  Nothing here is what it seems.

  Pixels light in rows of green,
  Binary code constructs the dreams,
  On the LCD screen,
  Nothing is as solid seems,
  Just light that flickers, bright and keen,
  A ghost inside the machine.

  Your eye completes the broken line,
  Bringing the shape to sudden light,
  The unity hides from design,
  But by the reader's granting sight.
