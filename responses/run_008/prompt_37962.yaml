  I'm a third-year student in a statistical inference course, and a running argument between two of our TAs has me puzzled: one is a committed Bayesian, the other a defender of frequentist testing, and after a full semester neither has moved an inch. What strikes me is how little their arguments seem to engage each other. The Bayesian says frequentist testing violates the likelihood principle — that data with the same likelihood function should support the same inference, so the experimenter's stopping rule should be irrelevant — while the frequentist replies that priors are subjective opinions dressed up as mathematics, and that Bayesians cannot say what makes a prior reasonable without smuggling in frequency considerations. Each side seems to treat the other's central claim as a reductio rather than as something needing a reply. Meanwhile both invoke the replication crisis as vindication: the Bayesian blames null hypothesis significance testing and the widespread habit of reading p-values as the probability that the null hypothesis is true, while the frequentist blames publication bias, p-hacking, and underpowered studies — failings that would corrupt Bayesian analyses just as badly. My working hypothesis is that the dispute is not really about the interpretation of probability at all, but about what the product of statistics is supposed to be: procedures with guaranteed long-run error rates versus the beliefs of a rational agent after conditioning on the data. On that diagnosis the two TAs are answering different questions under the single word statistics, and the replication crisis is mostly orthogonal to both — a crisis of research practice, not of statistical philosophy. But I am not confident, because some disagreements, such as the fight over the likelihood principle and what it actually implies, seem to force the sides to meet head-on rather than talk past each other. Lead with your bottom line in your first sentence, then give the reasoning; no preamble and no restating of my question. Diagnose what kind of disagreement this really is — substantive, verbal, or two different questions under one heading — drawing on what each side actually claims, and tell me what, if anything, would count as settling it.
