answer: |-
  The dispute is a substantive normative conflict over incompatible axioms of rationality that cannot be empirically settled, though it is exacerbated by the two sides pursuing different goals under the single label of inference. Your hypothesis that they are answering different questions is astute: frequentists are designing decision procedures optimized for long-run error control (calibration), while Bayesians are deriving degrees of belief optimized for internal consistency given observed data (coherence). However, the conflict is not merely verbal because the Likelihood Principle represents a mathematical fault line where these goals contradict; it is a theorem that Bayesian conditioning obeys the principle, and a deliberate feature that frequentist testing violates it to guarantee error rates across hypothetical repetitions. Neither side can prove the other wrong using data because their criteria for success are defined by their own axioms: a Bayesian demonstrates validity through coherence arguments like the Dutch Book theorem, while a frequentist demonstrates validity through sampling distribution properties like size and power. Consequently, the replication crisis is indeed largely orthogonal to the philosophical stalemate, serving instead as evidence of the practical friction that occurs when researchers use frequentist tools to answer Bayesian questions—seeking probabilities of hypotheses while only provided probabilities of data. Settling this dispute would not require new mathematics or empirical results, but rather a philosophical consensus on whether the primary purpose of statistics is to govern behavior in repeated applications or to quantify rational belief in singular events.
