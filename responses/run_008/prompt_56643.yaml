answer: |-
  # Dissertation Defense Q&A Prep Sheet
  **Topic:** Climate Duties as a Constraint on Unilateral Background Authorship
  **Committee:** Political Philosophers (Person-Affecting/Rights) & Economists (Social Discounting)

  ---

  ## Part 1: High-Damage Objections (Ordered by Threat Level)

  ### 1. The Correlativity Objection (Political Philosophers)
  **The Question:** "You argue that the Non-Identity Problem is a category error. But on a standard Hohfeldian or Kantian account, a duty implies a correlative right held by a specific agent. If your constraint is owed to no particular future individual (since they are indeterminate), to whom is the duty owed? If there is no right-holder, isn't this merely a 'good thing to do' rather than a binding duty? How do you ground the *obligatoriness* of a duty without a beneficiary?"

  **The Reply (2 mins):**
  "The objection assumes that all duties must be *owed to* a specific individual to be binding. I argue this conflates *beneficiaries* with *addressees* of the moral law. My constraint is modeled on constitutional or institutional duties: a legislature has a duty not to dismantle the judiciary, not because a specific future judge has a right to a job, but because the *practice* of judging is a condition of legal agency itself.

  Similarly, the duty is owed to the *structure of moral agency* across time, not the individuals who happen to occupy it. The 'right-holder' is the hypothetical possibility of future autonomous action. By making ecological stability a precondition for agency, we treat it as a structural requirement of the moral community, akin to Rawls's 'circumstances of justice.' If we destroy the background conditions, we don't just harm people; we dissolve the arena in which harm and rights make sense. The obligatoriness comes from the necessity of preserving the possibility of morality itself, which binds the present generation as trustees of the practice, not as debtors to specific creditors."

  **[SOFT SPOT]:** This relies heavily on the committee accepting "practices" or "structures" as right-holders. If they hold a strict individualist ontology, this sounds like mystification. You are effectively arguing for a form of *impersonal deontology*, which risks collapsing back into the utilitarianism you reject.

  ### 2. The Catastrophic Cost Objection (Economists)
  **The Question:** "You claim the constraint is lexical, meaning it trumps welfare comparisons and is orthogonal to discounting. But suppose abatement costs are not just 'expensive' but catastrophic for the present generation—say, 40% of global GDP, causing mass famine or state collapse. Does your lexical constraint still hold? If yes, your theory demands the moral suicide of the present to preserve the background for the future. If no, then the constraint is not lexical; it is just a very high weight in a cost-benefit analysis, which brings us back to discounting."

  **The Reply (2 mins):**
  "This is a false dichotomy between 'lexical' and 'sensible.' A lexical constraint operates within the *feasible set* of moral action. No plausible moral theory demands the extinction of the moral agent as the price of duty. My constraint includes an implicit 'survival clause' for the authoring generation. However, within the range of feasible action—where the present generation survives and maintains basic agency—the constraint is indeed lexical.

  We do not trade off the possibility of future agency against present luxury or even moderate welfare losses. The discounting dispute matters for *how* we achieve the constraint (e.g., timing of investment), but not *whether* we adhere to it. If abatement costs threaten present survival, we have a tragedy of competing background conditions, not a calculation of welfare. But until we hit that existential threshold for the present, the cost is irrelevant. The constraint forbids rewriting the background, not preserving it at the cost of current existence."

  **[SOFT SPOT]:** Defining the "survival clause" is dangerous. If you concede the constraint breaks when costs are high, economists will argue that *any* significant cost threatens stability, turning your lexical rule into a slippery slope of cost-benefit analysis. You need a hard line on what counts as "threatening agency" vs. "reducing welfare."

  ### 3. The Threshold Definition Objection (Joint)
  **The Question:** "You forbid 'irreversibly rewriting ecological conditions.' But all action rewrites conditions. Industrialization rewrote them; so would a rapid green transition. How do you distinguish between permissible background evolution and impermissible background authorship? Without a metric, this constraint is either vacuous (everything is a rewrite) or paralyzing (nothing is permitted)."

  **The Reply (2 mins):**
  "The distinction lies in *unilateral closure of options.* Permissible evolution leaves future agents with a comparable range of adaptive choices to those the current generation enjoyed. Impermissible authorship forecloses entire categories of agency—such as the ability to inhabit coastal regions, grow staple crops, or rely on stable seasons.

  We are not banning change; we are banning the *monopolization of the future's adaptive capacity.* If we emit carbon, we force future agents to spend all their resources on adaptation just to reach the baseline security we inherited for free. That is a unilateral imposition of cost and risk. The threshold is crossed when the ecological shift forces future agents to act primarily as survivors of our choices rather than authors of their own lives."

  **[SOFT SPOT]:** "Comparable range of adaptive choices" is vague. Economists will ask for the metric. Philosophers will ask why *this* range is the baseline. You risk smuggling in a status-quo bias.

  ---

  ## Part 2: The "Hope Nobody Asks" Question

  **The Question:** "If your constraint is truly lexical and independent of welfare, how do you adjudicate between two conflicting irreversible changes? For example, suppose the only way to avoid catastrophic warming (an irreversible rewrite) is large-scale geoengineering, which itself constitutes an irreversible rewrite of atmospheric chemistry. Your constraint forbids A (warming) and forbids B (geoengineering). You have generated a moral contradiction. Does your theory collapse into paralysis?"

  **Why this is dangerous:** It exposes that "irreversibility" is not a binary moral switch but a comparative risk. If you have to choose between two violations of the constraint, you are forced back into the welfare/discounting calculus you claimed was orthogonal.

  **Prepared Answer:** "In cases of tragic choice where all options violate the constraint, the lexical priority shifts to minimizing the *degree* of unilateral imposition. We choose the path that leaves the most residual agency for the future. This admits that in extreme emergencies, the constraint becomes a 'second-best' guide. However, this does not validate discounting; it validates triage. The default remains: do not rewrite the background. The exception proves the rule only when the rule has already been broken by prior inaction."

  ---

  ## Part 3: Candid Critique of the Prep Sheet

  ### Where the Reasoning is Most Likely to Fail
  1.  **The "Structure as Right-Holder" Move:** Philosophers sympathetic to the person-affecting restriction (PAR) are often committed to the view that *only* sentient individuals can be the locus of moral concern. Your move to "agency structures" may strike them as reifying abstractions. If they press that "structures don't suffer, people do," your reply about constitutional duties may feel like an analogy that doesn't carry normative weight in the ecological context.
  2.  **The Status Quo Bias:** Your definition of "background conditions" implicitly privileges the Holocene stability that allowed *us* to flourish. The committee may argue this is intergenerational hoarding. Why is *our* background the baseline? If a future generation could adapt to a +3°C world but we deny them the industrial development that got us there (to save the climate), are we not constraining *their* authorship to preserve *our* moral cleanliness?
  3.  **The Economic "Lexical" Claim:** Economists will not accept "lexical" as a magic word that stops calculation. If you admit a "survival clause" for the present, they will model the probability of present survival against abatement costs. If the probability of present collapse is non-zero, your lexical constraint becomes a probabilistic function, which re-introduces discounting by the back door.

  ### Conditions for Genuine Defeat (Not Just a Dent)

  **For the Person-Affecting Objection to Defeat the Thesis:**
  The committee must demonstrate that **moral intelligibility requires identifiability.** If they can show that a "duty" that cannot be claimed, waived, or complained about by any specific agent (present or future) is conceptually indistinguishable from "supererogatory goodness," then your core claim (that this is a *duty*) collapses. They need to prove that *obligation* logically entails a *claimant*.

  **For the Discounting Objection to Defeat the Thesis:**
  The economists must demonstrate that **the cost of adherence undermines the object of protection.** If they can model a scenario where adhering to your lexical constraint causes present-generation state collapse, leading to *higher* emissions (due to loss of governance/technology) or a brutalized present generation incapable of moral agency, then your constraint is self-defeating. If the *means* of preserving future agency destroys present agency (which is the same moral good), the theory is incoherent. They need to show that the "survival clause" swallows the rule entirely.

  ### Strategic Advice
  *   **Don't fight the PAR on its own turf.** Don't try to prove future people have rights. Argue that the PAR is the wrong tool for *systemic* risks. Use the "Constitutional" analogy hard.
  *   **Concede the "Tragic Choice."** Don't claim your theory solves every edge case. Claim it solves the *standard* case of negligent emissions, which is 95% of the problem.
  *   **Unify the Committee.** Remind the economists that a lexical constraint reduces *uncertainty* (a key economic good). Remind the philosophers that preserving the "circumstances of justice" is a Kantian duty. Frame the thesis as the only view that satisfies both the need for moral rigor (Philosophers) and policy certainty (Economists).
