answer: |-
  This is a classic case of philosophical trench warfare. You are describing what happens when two coherent normative frameworks collide at their foundations, and neither side has a lever to pry the other loose because the lever requires a shared premise they no longer share.

  Here is my diagnosis of the disagreement, an evaluation of your hypothesis, and a verdict on whether your reading group should pack it in.

  ### 1. Diagnosis: It Is Not (Just) About the Person-Affecting Restriction

  Your hypothesis is that the fault line is the **Person-Affecting Restriction (PAR)**: *Prioritarians accept it (value must touch a life); Egalitarians reject it (value can be relational).*

  This is accurate as far as it goes, but it identifies the *mechanism* of the disagreement rather than the *source*. If you press the Prioritarian on *why* they accept the PAR, they will say: "Because value must be grounded in welfare." If you press the Egalitarian on *why* they reject it, they will say: "Because fairness is a property of the distribution, not just the sum of welfare."

  Therefore, the deeper disagreement is **Welfarist Monism vs. Value Pluralism**.

  *   **Prioritarians are Welfarist Monists:** They believe the only thing that is *ultimately* good is individual wellbeing. Any other putative value (fairness, equality, desert) must be reducible to or derivative of wellbeing to count as a moral reason. For them, a "value" that doesn't improve a life is an occult entity. It's not just that they smuggle in the PAR; the PAR is a logical consequence of their ontology.
  *   **Telic Egalitarians are Value Pluralists:** They believe wellbeing is *one* good, but the *pattern* of distribution is a separate, irreducible good. For them, the state of the world has properties (like "equality") that are valuable independently of the welfare properties of the individuals within it.

  **Why the loop persists:**
  When Temkin says inequality is "bad, but not bad for anyone," he is speaking the language of Pluralism. When the Prioritarian calls this a "dodge," they are speaking the language of Monism. To the Monist, a reason that isn't a reason *for* someone is not a reason at all—it's a grammatical error. To the Pluralist, restricting reasons to "for someone" arbitrarily blinds morality to structural injustice.

  You cannot argue someone out of Welfarist Monism using moral cases, because they will interpret every case through the lens of welfare. You cannot argue someone into it using logic, because it is an axiomatic commitment about what *kind* of thing value is.

  ### 2. Is It "Different Questions Under a Single Label"?

  You suggested this might be a case of talking past one another. There is truth here, but it's more specific than that.

  *   **Prioritarians are answering:** "How do we maximize the moral value generated by individuals?"
  *   **Egalitarians are answering:** "What kind of relationship should citizens stand in to one another?"

  The problem is that Telic Egalitarianism tries to answer the second question using the machinery of the first (outcome evaluation). This is why Parfit's objection bites so hard. If you are evaluating *outcomes* (Telic), you are implicitly asking the Prioritarian question. If you want to ask the Relational question, you should probably be a **Deontic Egalitarian** (inequality is wrong because of how it was produced or how it affects status, not because the pattern is intrinsically bad).

  The stalemate exists because your group is fighting over **Telic** Egalitarianism. Most modern egalitarians have actually abandoned the Telic view precisely because of the Leveling Down Objection, retreating to Deontic or Relational Egalitarianism. If your group is still defending Telic Egalitarianism against Prioritarianism, they are defending a position that many of its original proponents (like Parfit himself, and arguably Temkin in later work) conceded was vulnerable.

  ### 3. Can There Be Progress?

  If "progress" means one side convincing the other, **no**. You are at a bedrock axiom clash. However, if "progress" means understanding the cost of your commitments, then yes.

  Here are three ways to break the loop without expecting conversion:

  **A. The "Pro-Tanto" vs. "All-Things-Considered" Distinction**
  The Egalitarians in your group are likely claiming that Leveling Down is *pro-tanto* bad (bad in one respect) but not *all-things-considered* good. The Prioritarians argue that a *pro-tanto* reason that never tips the scale in any possible world is an empty posit.
  *   **The Move:** Ask the Egalitarians to describe a scenario where the equality reason *does* win. If they say "never," the Prioritarian charge of emptiness sticks. If they say "sometimes," ask for the trade-off rate. If they can't specify the trade-off rate, the value is operationally indistinguishable from intuition.
  *   **Progress:** This forces the Egalitarian to either make their view falsifiable (by setting a weight) or admit it is a "lexical" constraint that trumps welfare entirely (which is a much harder pill to swallow).

  **B. The "Complaint Model" Shift**
  Instead of defending "intrinsic badness," have the Egalitarians try the **Complaint Model** (also associated with Temkin and Parfit).
  *   **The Move:** Inequality is bad because the worse-off person has a reasonable complaint against the better-off person (or the system).
  *   **The Catch:** This often collapses into Prioritarianism. If the complaint is "I have less welfare," the solution is "give me more welfare" (Priority). If the complaint is "I have less than him," the solution is "level him down" (Equality).
  *   **Progress:** This clarifies that the real fight isn't about equality, it's about **envy**. Is the moral force of equality grounded in the suffering of the poor, or in their resentment of the rich? Prioritarians say the former; Egalitarians often need the latter to make sense of Leveling Down. Admitting this makes the disagreement sociological/psychological rather than purely normative.

  **C. Abandon Telic Egalitarianism**
  *   **The Move:** Propose that Telic Egalitarianism is a dead end. Shift the reading to **Relational Egalitarianism** (Anderson, Scheffler).
  *   **The Logic:** Inequality is not intrinsically bad; it is bad because it creates hierarchies, domination, or status anxiety. Leveling Down doesn't help because it doesn't fix the relationship.
  *   **Progress:** This dissolves the Leveling Down Objection entirely. It acknowledges the Prioritarian insight (welfare matters) while keeping the Egalitarian motivation (justice matters). If your group refuses to do this, they are fighting a war from 1995 that most combatants have left.

  ### 4. Verdict: Should You Stop Meeting?

  **No, but you must change the assignment.**

  If you continue to read papers that rehash the Parfit/Temkin dialectic without shifting the frame, you are engaging in intellectual calisthenics: movement without travel. You have correctly identified that the disagreement is axiomatic. Continuing to argue substance will only produce more heat.

  **My recommendation for the next semester:**
  1.  **Acknowledge the Stalemate:** Start the first session by explicitly stating your diagnosis (Welfarist Monism vs. Value Pluralism). Agree that you will not try to convert each other.
  2.  **Map the Costs:** Instead of arguing who is right, argue about what you have to *give up* to be right.
      *   *To the Prioritarian:* "If you reject equality as a value, how do you handle cases of status hierarchy that don't impact welfare?"
      *   *To the Egalitarian:* "If you accept Leveling Down has *some* value, how do you explain that to the person being leveled down without sounding sadistic?"
  3.  **Read the Dissolvers:** Read Elizabeth Anderson's *The Point of Equality* or Samuel Scheffler's work on relational equality. These texts argue that the Equality vs. Priority debate is a false dichotomy caused by a mistaken focus on distribution rather than relationships.

  **Summary:** Your hypothesis about the Person-Affecting Restriction is the symptom; the disease is Welfarist Monism vs. Value Pluralism. You cannot cure it with arguments. You can only manage it by clarifying the price of each commitment. If your group is unwilling to shift from "who is right" to "what does it cost," then yes, you should stop meeting. But if you can turn the group into a mapmaker of moral commitments rather than a courtroom, there is still work to be done.
