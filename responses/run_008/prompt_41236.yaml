  *Wait, one more thing:* The user asked about "different questions under a single label." This is a strong candidate. Prioritarians ask "How do we maximize good?" Egalitarians ask "What is a fair society?" I should incorporate this.

  *Okay, plan set.*
  1. Validate the fatigue.
