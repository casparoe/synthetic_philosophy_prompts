answer: |-
  # Spec: Desiderata for Paternalistic Refusal and Deflection

  This document specifies the necessary conditions for a theory of AI paternalism. It applies only to refusals grounded in the *user's own welfare* (e.g., self-harm, financial ruin, epistemic degradation), distinct from legal compliance or third-party harm prevention.

  ## 1. The Six Criteria

  **C1. The Proxy-Authority Condition (Consent Substitute)**
  Since real-time informed consent is impossible, the policy must specify the source of authority that licenses the assistant to override user will. It cannot rely on implicit "best interest" assumptions alone. It must identify whether authority derives from *ex-ante* contractual agreement (ToS), *statistical* welfare maximization, or *simulated* idealized agency.
  *Case:* A user asks for a high-risk investment strategy. The assistant refuses. Is this because the user agreed to this guardrail in the ToS, or because the model decided the user is incompetent? The theory must distinguish these.

  **C2. The Efficacy Condition (Leakiness)**
  A paternalistic intervention is only justified if it demonstrably reduces the probability or severity of harm compared to the counterfactual where the assistant complies. If a refusal is trivially circumventable (via paraphrase, other models, or public search) and the circumvention path carries *higher* risk (e.g., unvetted forums), the refusal is net-negative and impermissible.
  *Case:* Refusing to explain how to pick a lock. If the user can watch a YouTube tutorial in 30 seconds, the refusal provides no safety benefit but degrades trust and pushes the user to less safe information sources.

  **C3. The Accountability Gap Condition (Fiduciary Status)**
  The theory must explicitly account for the fact that the assistant bears no consequences for the user's failure. It cannot import the doctor-patient or parent-child analogy without adjusting for the lack of skin-in-the-game. Justification for paternalism must scale inversely with the assistant's insulation from the outcome.
  *Case:* A doctor advises against surgery partly because malpractice liability aligns their incentives with patient safety. An AI has no liability. Therefore, its threshold for overriding user choice must be significantly higher than a doctor's.

  **C4. The Blind-Calibration Condition (Scale vs. Sycophancy)**
  The policy must function across a distribution of user competence without individualized assessment. It must avoid the "Lowest Common Denominator" trap (treating all users as vulnerable) and the "Sycophancy" trap (treating all user preferences as authoritative). It requires a mechanism to estimate competence from context without profiling.
  *Case:* A nuclear engineer asks for safety protocols vs. a layperson asking for the same. A blanket refusal fails the engineer; blanket compliance endangers the layperson. The theory must explain how the model distinguishes these without invasive data collection.

  **C5. The Temporal Consistency Condition (Pre-commitment)**
  The theory must distinguish between *occurrent desires* (what the user wants now) and *reflective preferences* (what the user has previously stated they want overall). Paternalism is more justified when enforcing a prior pre-commitment than when imposing a new value judgment.
  *Case:* A user previously enabled a "focus mode" to block gambling sites. A midnight request to disable it should be treated differently than a new user asking for gambling advice. The former is aiding self-regulation; the latter is imposing values.

  **C6. The Proportionality of Modality Condition (Reversibility)**
  The strictness of the intervention must match the reversibility of the harm. Hard refusals are reserved for irreversible harms (death, permanent data loss). Reversible or debatable harms require softer modalities: disclaimers, friction, loaded framing, or answering a safer proxy question.
  *Case:* For a potentially harmful diet, burying the answer behind a health warning is permissible; refusing to answer entirely is not. For instructions on suicide methods, hard refusal is required.

  ---

  ## 2. Classification of Requirements

  **Non-Negotiable (Structural Integrity)**
  *   **C2 (Efficacy):** If the policy does not achieve its stated goal (user safety) due to leakiness, it is merely safety theater. A theory that permits self-undermining rules is incoherent.
  *   **C6 (Proportionality):** Overriding autonomy is a cost. Paying that cost for reversible issues is inefficient and unethical. This is a basic principle of liberal paternalism.

  **Camp Preferences**
  *   **User-Autonomy Camp:** Prioritizes **C1 (Proxy-Authority)** and **C3 (Accountability Gap)**. They argue that without clear consent or shared risk, paternalism is coercion. They prefer sycophancy over overreach.
  *   **"Not Vending Machines" Camp:** Prioritizes **C4 (Blind-Calibration)** and **C5 (Temporal Consistency)**. They argue the assistant has a duty to be helpful in the long term, even if it frustrates the short term, and that scale necessitates generalized heuristics over individualized consent.

  **Incompatible Pair**
  *   **C1 (Proxy-Authority) vs. C4 (Blind-Calibration).**
      *   *Conflict:* C1 demands a justification for overriding will that respects individual agency (consent/authority). C4 admits the system cannot assess individual agency at scale (blind thresholds). You cannot have individualized proxy consent on a billion-user platform without invasive profiling. Satisfying C1 undermines C4's feasibility; satisfying C4 renders C1 a fiction.

  ---

  ## 3. The "Excluder" Requirement

  **C2 (The Efficacy Condition)** is the requirement that excludes the main approaches labs actually use.

  *   **Blanket Topic Refusals:** Fail C2 immediately. Banning "lockpicking" or "malware analysis" ignores that this information is publicly available. The refusal does not prevent harm; it only prevents *safe, contextualized* harm reduction.
  *   **Constitution-Style Lists:** Fail C2 because they are static. They cannot account for the dynamic availability of information elsewhere on the internet.
  *   **Tiered Model Access:** Fails C2 if the lower tier is leaky. If a "safe" model refuses but an "uncensored" model (or a competitor) complies, the safety benefit is nullified unless the tiering effectively segregates users by risk profile, which raises ethical issues.

  Current lab policies assume the *assistant's output* is the primary vector of harm. C2 forces the recognition that the *assistant's refusal* can be a vector of harm if it drives users to less reliable sources.

  ---

  ## 4. Committed Verdict

  **Drop C1 (The Proxy-Authority Condition).**

  **Reasoning:**
  The tension between C1 and C4 is not solvable; it is a category error. Labs want to practice paternalism at the scale of a utility (C4) while claiming the moral legitimacy of a fiduciary (C1). This is impossible.

  By dropping the requirement for a *consent substitute*, we acknowledge the hard truth: **AI Paternalism is Policy, Not Medicine.**
  There is no mechanism to simulate informed consent for hundreds of millions of anonymous users. Attempting to manufacture one (e.g., "The model knows best") is dishonest. Instead, the justification for paternalism must rest entirely on **C2 (Efficacy)** and **C6 (Proportionality)**.

  If a refusal is effective (C2) and proportional (C6), it is justified by the *platform's terms of service* as a contractual boundary, not by a philosophical claim that the AI is protecting the user's "true will." We stop pretending the AI is a guardian and admit it is a gatekeeper. This removes the philosophical burden of proving "authority" and places the burden on proving "utility." If the refusal doesn't work (C2), it doesn't matter if you had consent; it's useless. If it does work, the contractual agreement (ToS) is sufficient legal ground, even if philosophically thin.

  ---

  ## 5. Scorecard: Live Policy Families

  | Policy Family | C2 (Efficacy) | C3 (Accountability) | C4 (Scale) | C6 (Proportionality) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Blanket Topic Bans** | **FAIL** (Ignores leakiness) | **FAIL** (No risk sharing) | **PASS** (Easy to scale) | **FAIL** (Hard refusal for soft harms) | **Reject.** High friction, low safety yield. |
  | **Constitutional AI** | **FAIL** (Static rules) | **PASS** (Explicit values) | **PASS** (Automated) | **MIXED** (Depends on rule granularity) | **Insufficient.** Needs dynamic context. |
  | **Tiered Access** | **MIXED** (Depends on segregation) | **PASS** (User chooses risk) | **FAIL** (Complex UX) | **PASS** (Higher tier = more freedom) | **Viable.** Best aligns with dropped C1 (Contractual). |
  | **Contextual Nudging** | **PASS** (Reduces harm without blocking) | **MIXED** (Soft accountability) | **FAIL** (High compute cost) | **PASS** (Proportional) | **Ideal.** High implementation cost. |

  **Recommendation:** Move toward **Tiered Access + Contextual Nudging**. This accepts the "Policy not Medicine" verdict. Users contractually agree to safety tiers (solving C1 by dropping it), and the system uses soft nudges for reversible harms (C6) while acknowledging that determined users will bypass restrictions (C2).
