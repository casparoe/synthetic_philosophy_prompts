  1. The initial 11–1 guilty vote resembles a fragile cascade where jurors like Juror 12, who admits he simply went along with the others, prioritise public consensus over private uncertainty.
  2. Juror 8 breaks the cascade not by presenting new evidence immediately, but by altering the payoff structure of dissent, making it socially permissible for Juror 9 to reveal his private signal in the secret ballot.
  3. The model strains when Juror 7 switches his vote solely to escape the heat and catch a baseball game, demonstrating non-epistemic incentives that standard rational herding accounts cannot accommodate.
  4. It remains empirically indistinguishable whether Juror 5, who grew up in the slums, votes not guilty due to updated Bayesian belief or merely because the social cost of opposing Juror 8 has lowered.
  5. Ultimately, the cascade collapses less through sequential information revelation and more because Juror 3's emotional breakdown exposes the prejudice underpinning the original majority, invalidating the earlier signals entirely.
