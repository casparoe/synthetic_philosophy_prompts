prompt: |-
  I'm teaching an intro social epistemology course this autumn and want to pair the week on information cascades and rational herding with a film, and I keep coming back to Twelve Angry Men. On the surface it looks like the opposite of a cascade story: one dissenter breaks up a near-unamimous first vote, and then the votes flip one by one until it's 11–1 the other way. But read it as sequential voting with private information, it's more interesting: the early guilty voters aren't lying exactly, they're rationally deferring to what everyone else's confident vote seems to tell them, and Juror 8's initial not-guilty vote forces suppressed private signals back into the open one at a time. Help me build the reading. Is the film better described as a cascade forming and then collapsing, and what actually breaks it — new evidence, or just the social cost of dissent changing? Where does the analogy strain, e.g. the jurors motivated by prejudice or wanting to get to a ball game — is that rational herding at all or something the cascade model has no room for? And can the film even let you tell apart a juror doing pure conformity from one who privately doubts but votes with the room?

  Give me exactly five numbered points, each a sentence or two, no intro or conclusion, and each one anchored to something specific in the film (a vote count, a scene, a particular juror's stated reason for switching). Be honest if any point works better as a counterexample to cascade theory than as an illustration of it — I want something the discussion section can push back on. Please write in British English.
