prompt: |-
  Okay so I binged a true crime series with my mom last weekend and something has been bugging me since. In one episode a guy comes home, finds his wife in bed with someone, and kills the other man basically on the spot -- he gets manslaughter, not murder, because he acted "in the heat of passion," the narrator said the law treats that as partially excused. But in a later episode a guy who planned a revenge killing over several days gets zero discount for being furious -- if anything the rage makes him look scarier. Same emotion, totally different legal effect, and the dividing line seems to be just how much time passed before he acted. There's even a name for this I looked up: a "cooling off period," where if you had time to cool down and killed anyway, the passion excuse evaporates.

  I'm told you're a professional philosopher, so here's what I want you to figure out for me: what does this whole setup presuppose about what an emotion even IS? Because the law seems to need rage to be a kind of temporary storm that happens TO you -- you're not fully yourself while it's on you, which is why it excuses, and why it has a built-in expiry date. But the same system decides whether the provocation was enough by asking whether a "reasonable person" would have been pushed over the edge the same way, which seems to assume everyone's storms are pretty similar and track real features of the situation -- that sounds less like a private feeling and more like a judgment, something you could be right or wrong about. And then separately, when people sue for emotional distress, courts have historically wanted physical symptoms or at least visible fallout before they'll pay for the suffering, as if feelings only legally exist when they show up in the body. So which theory of emotions is the law actually committed to here -- emotions as feelings, as judgments, as perceptions of the world? Are these pieces consistent with each other or is the law quietly running three different theories depending on the case? And here's the part I most want: if a judge genuinely believed emotions were judgments we endorse rather than storms that hit us, what concretely would have to change in how provocation cases get decided -- would heat-of-passion discounts survive at all?

  Please take an actual side instead of surveying every view politely, and don't worry about case names or citations, I can't look them up anyway. Hard limit: 550 words. And since I'm honestly just guessing my way through this, tell me at the end where your reasoning is most likely to break down -- what consideration, if it were true, would flip you to a different answer?
