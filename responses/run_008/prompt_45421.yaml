answer: |-
  The law isn't running one theory; it's running a pragmatic contradiction. In mitigation, it treats emotion as a **force** suspending agency—a storm overwhelming the self. In justification (reasonable person), it treats emotion as a **judgment**—a rational assessment of facts. In torts, it treats emotion as **bodily damage**, invisible until physical symptoms appear. This trifecta allows courts to pick the theory that yields the desired outcome, but philosophically, they cannot all be true.

  If forced to identify the dominant presupposition, it is the **volitional incapacity model**. The "cooling off" period assumes time restores rational control, implying initial rage was a loss of control. But this clashes with the "reasonable person" test, which implies the anger was a correct response to objective facts. You cannot claim the defendant was too overwhelmed to choose *and* that their reaction matched what a rational agent would choose.

  If judges adopted the **Cognitive Theory of Emotion**—that emotions are evaluations—the heat-of-passion discount would vanish. Under this model, anger is not something happening *to* you; it is something you *do*. It is the assessment that "I have been wronged." To kill in anger is to execute a moral calculation that death is the appropriate response.

  Currently, the law says, "You were too angry to think." The judgment model says, "You thought clearly enough to kill." If emotion is a judgment, holding onto rage during a "cooling off" period proves you **reaffirmed** the judgment that violence was necessary. The distinction between manslaughter and murder relies on passion obscuring reason. If passion *is* a form of reason, killing out of rage is premeditated murder, regardless of timing. The defense would shift from "I couldn't control myself" to "My evaluation was correct," which is rarely a valid defense for homicide. Voluntary manslaughter would collapse into murder because acting on a violent judgment is always an exercise of agency.

  Concrete changes would be stark. Judges would instruct juries that anger constitutes intent, not diminished capacity. The "reasonable person" standard would shift from "would they be angry?" to "was their judgment that killing was appropriate reasonable?" Since no reasonable person judges killing appropriate for infidelity, the defense fails entirely. The law needs the "storm" metaphor to preserve the middle ground between cold calculation and accident.

  **Where this breaks down:** My argument assumes judgments are fully voluntary. If neuroscience proves intense rage chemically bypasses the prefrontal cortex, the Cognitive Theory fails to capture physiological reality. If the body hijacks the brain before the judgment forms, the "storm" model is biologically accurate. My prescription would then punish people for biological reflexes they literally could not inhibit, confusing moral agency with physiological inevitability.
