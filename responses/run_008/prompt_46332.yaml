answer: |-
  ### Before you begin

  Imagine a weather app says there is a 20% chance of rain. If it actually rains on 20% of the days it makes that prediction, the app is "calibrated." In lending or justice, a risk score works the same way. But mistakes happen. A "false positive" is when the system flags you as high-risk, but you wouldn't have defaulted or re-offended. A "base rate" is simply how common an event is in a group to begin with. If one neighborhood has more potholes, a car damage predictor will flag more cars there. This quiz asks you to choose between competing goals. You cannot have perfect accuracy, equal mistake rates, and equal approval rates all at once. Your answers will show which trade-off you find most acceptable.

  ### The ten cases

  **1. The Bail Hearing**
  A risk tool predicts the chance a defendant will miss court. It is perfectly calibrated: when it says "20% risk," 20% of people in that group miss court, for both Group A and Group B. However, because Group A has a higher overall rate of missed court dates, the tool flags more Group A members as "high risk," leading to more detentions for Group A.
  *   A) This is fair; the risk numbers are accurate for everyone.
  *   B) This is unfair; we must adjust the tool so both groups are detained at the same rate.
  *   C) This is unfair; we must adjust the tool so the rate of mistakes is the same for both groups.

  **2. The Small Business Loan**
  A bank wants to approve loans at the same percentage for two communities. To do this, they must lower the credit score threshold for Community X, approving applicants the model predicts have a 40% chance of default.
  *   A) Do not lower the threshold; lending to likely defaults hurts the bank and the borrower.
  *   B) Lower the threshold; equal access to capital is more important than the default risk.
  *   C) Do not use the score; lending decisions should not rely on statistical predictions of failure.

  **3. The Identical Resumes**
  Two job applicants have the exact same skills, experience, and test scores. One lives in a wealthy zip code, the other in a low-income zip code. The hiring algorithm rates the wealthy applicant higher because people from that zip code historically stay longer.
  *   A) This is unfair; identical individuals should receive identical scores.
  *   B) This is acceptable; the zip code data predicts retention accurately.
  *   C) This is unfair; the algorithm should not use zip code, even if it predicts well.

  **4. The Blind Insurance Pool**
  An insurance company removes "race" from its data to be fair. However, it keeps "neighborhood" and "occupation," which are heavily shaped by historical segregation. The prices end up nearly identical to when they used race explicitly.
  *   A) This is fair; the company followed the rule and removed the protected attribute.
  *   B) This is unfair; the other data points are just proxies for the attribute you removed.
  *   C) This is unfair; insurance pricing should not rely on group statistics at all.

  **5. The University Admissions**
  To correct for historical exclusion, a university adds a bonus to the application scores of students from a specific disadvantaged background. This lowers the average test score of the admitted class slightly.
  *   A) This is unfair; group membership should never change a score.
  *   B) This is fair; using group data is necessary to fix past exclusion.
  *   C) This is unfair; the whole system of scoring applicants is the problem.

  **6. The Policing Data**
  A crime prediction tool uses arrest records. One neighborhood has more arrests because police patrol there more heavily, not because more crime occurs. The tool predicts higher risk for that neighborhood based on this data.
  *   A) The tool is working; it accurately predicts where arrests will happen.
  *   B) The tool is broken; it is learning from biased policing, not actual crime.
  *   C) The tool should be banned; we should not predict crime based on arrest records.

  **7. The Parole Decision**
  A board uses a score to decide parole. Some members argue that predicting whether a person will re-offend is inherently dehumanizing, regardless of how accurate the math is.
  *   A) If the math is accurate, it is a useful tool for public safety.
  *   B) We should use the math, but only to offer support, not to deny freedom.
  *   C) We should stop trying to predict human behavior for these decisions entirely.

  **8. The Medical Triage**
  A hospital uses a score to prioritize care. The score is accurate, but because one group has worse underlying health due to poverty, they are systematically deprioritized for treatment.
  *   A) Prioritize the sickest patients based on the score, regardless of group.
  *   B) Adjust the score to ensure equal treatment rates across groups.
  *   C) Fix the poverty causing the health difference, not the triage score.

  **9. The Housing Voucher**
  A landlord uses a screening score. A false positive means a reliable tenant is rejected. A false negative means a problematic tenant is accepted. For a low-income applicant, a false positive means homelessness.
  *   A) The cost of mistakes is the same for everyone; minimize total errors.
  *   B) The cost is higher for the low-income applicant; minimize their errors specifically.
  *   C) Screening scores should not determine access to housing.

  **10. The Feedback Loop**
  If a group is denied loans today, their credit scores will drop tomorrow, making them look even riskier in the future. The score is accurate today but creates the risk of tomorrow.
  *   A) The score must reflect today's reality, even if it worsens tomorrow.
  *   B) The score should be adjusted to prevent worsening future outcomes.
  *   C) We should not use scores that create the very risks they predict.

  ### The scoring key

  **The Accuracy-First View:** You prioritized options trusting the statistical prediction (mostly A). You believe a calibrated score is fair because it treats the risk as truth. *Awkward commitment:* You must accept that some groups will be jailed or denied loans at much higher rates if their underlying risk is higher.

  **Demographic Parity:** You prioritized equal outcomes across groups (mostly B in outcome questions). You believe fairness means the results look the same for everyone. *Awkward commitment:* You must accept approving loans or releases for people the model says are likely to fail, which can harm them or the public.

  **Equal Error Rates:** You prioritized equalizing mistakes (mostly C in error questions). You believe the pain of a false accusation should be shared equally. *Awkward commitment:* You must accept using different thresholds for different groups, which looks like treating people differently based on identity.

  **Individual Fairness:** You prioritized treating identical people alike (Specific to Q3/Q4). You believe fairness is about consistency between similar individuals. *Awkward commitment:* You must accept that ignoring group history can perpetuate inequalities caused by that history.

  **The Upstream View:** You prioritized fixing the data or world (Mostly B/C in data/context questions). You believe the score is just a mirror of societal injustice. *Awkward commitment:* This view offers little help to individuals facing decisions today while waiting for the world to change.

  **The Abolitionist View:** You prioritized stopping the prediction (Mostly C in system questions). You believe some decisions are too human for algorithms. *Awkward commitment:* You must replace these tools with human discretion, which can be just as biased but less transparent.

  **Incoherent Combinations:** If you chose "Remove the attribute" (Q4 Option A) but also demanded "Equal Outcomes" (Q2 Option B), your position is mathematically unstable. When base rates differ, blindness makes equal outcomes impossible without breaking the score's accuracy. You cannot have a blind process that guarantees equal results unless the underlying realities are already equal.

  ### What this quiz cannot separate

  This quiz cannot distinguish between malice and negligence. A person might choose accuracy-first because they trust math, or because they don't care about the disparate impact. It also cannot separate "Equal Error Rates" from "Demographic Parity" in every context; sometimes people want both without realizing they conflict. Furthermore, the quiz treats groups as monolithic blocks. It does not capture intersectional views, where a person might want different fairness rules for a Black woman than for a Black man. Finally, it assumes the "base rate" is a fixed number, whereas in reality, the act of measuring often changes the rate. You might hold a view that changes depending on how much power the institution has, which these static cases cannot capture.
