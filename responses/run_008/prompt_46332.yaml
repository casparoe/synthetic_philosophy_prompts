      *   *Equal Error Rates (FPR/FNR):* The rate of mistakes is the same across groups.
      *   *Demographic Parity:* The outcome rate (e.g., % granted bail) is the same across groups.
      *   *The Conflict:* If Group A has a 50% failure rate and Group B has a 10% failure rate, you cannot have a calibrated score *and* equal error rates *and* equal selection rates. You must pick two or prioritize one.

