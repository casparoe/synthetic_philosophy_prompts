  **selected experimental quirks for satire**
  1.  **The Left-Hemisphere Interpreter:** The verbal left hemisphere confabulates reasons for actions initiated by the non-verbal right hemisphere.
  2.  **Intermanual Conflict:** One hand performs an action while the other undoes it (e.g., buttoning vs. unbuttoning).
  3.  **Visual Field Isolation:** Information presented to the left visual field (right brain) cannot be verbally named by the left brain.
  4.  **Emotional Dissociation:** The right brain reacts emotionally to a stimulus the left brain cannot see, leaving the left brain to rationalize the fear.
  5.  **Unity of Consciousness:** Patients often report feeling like one person despite behavioral evidence of two distinct agents.

