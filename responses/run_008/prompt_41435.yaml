  # fork | support center

  **welcome to fork.**
  you're here because your bandwidth is capped by biology. why run a single, overloaded consciousness when you can horizontally scale? our elective corpus callosotomy decouples your hemispheres, allowing parallel processing of high-context tasks. below are common queries regarding post-op workflow integration.

  **q: how do we handle context switching between hemispheres?**
  a: you don't. that's the value prop. once the callosum is severed, data transfer is physically impossible. we recommend assigning the left hemisphere (lh) to all verbal outputs: standups, jira tickets, and client calls. the right hemisphere (rh) should handle spatial reasoning, debugging, and emotional labor. note: if the rh sees a blocker the lh cannot verbalize, the lh will automatically generate a plausible but factually incorrect explanation. this is documented as "automated reporting" in your slp.

  **q: what if my hands attempt conflicting actions during a deploy?**
  a: intermanual conflict is a known feature, not a bug. if your left hand types `git push` while the right hand reaches for `ctrl+z`, this indicates healthy redundancy. some clients find it useful to gamify this as real-time a/b testing. if the conflict escalates to physical restraint (e.g., one hand grabbing the other's wrist), please consult our ergonomics team before filing an incident report.

  **q: am i still one person for tax and legal purposes?**
  a: this is a common concern. legally, you remain a single entity. metaphysically, the answer is more nuanced. as some phenomenologists note, the callosum was merely a legacy bridge between two distinct agents; we simply make the architecture official. however, billing is per cranial unit. since both hemispheres exhibit independent volition, preference, and fear responses, we invoice per hemisphere. please update your payroll provider to reflect a 200% headcount increase effective immediately upon incision.

  **q: why did i cry during the sprint review when i didn't feel sad?**
  a: emotional dissociation is standard. your rh likely processed a non-verbal stressor (e.g., a manager's tone) and triggered a somatic response. your lh, unaware of the stimulus, will attempt to rationalize the tears post-hoc ("allergies," "dry eyes"). we encourage accepting the rh's output as valid telemetry even if the lh cannot access the logs. do not attempt to merge the logs. data corruption will occur.

  **q: can i reverse the procedure if productivity doesn't improve?**
  a: no. neural tissue does not support rollback. once split, the hemispheres develop independent memory traces. attempting to reintegrate would not restore unity; it would merely introduce latency and noise. you are now a distributed system. please act accordingly.

