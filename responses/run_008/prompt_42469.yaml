  **The Blinker Case: A Dialogue**

  **Endurantist (E):** I'm not doing the bent wire again. If I hear one more explanation of how "bent-at-t" is a relation rather than a property, I'm going to dissolve.

  **Perdurantist (P):** Fine. We agree anyway. You say the wire is wholly present at noon and possesses bentness in an "at-t" way. I say the noon-stage of the wire is bent simpliciter. We both agree the sentence "the wire is bent at noon" is true. We're just fighting over the furniture of the universe that makes it true.

  **E:** Exactly. It's a stalemate over truthmakers. So let's talk about something where the truth values might actually split. The Blinker.

  **P:** The gappy existence case? Right. Exotic particle exists at t1, annihilated at t2, exact duplicate pops up at t3. Same matter, same location. Did it persist?

  **E:** That's the question. And I think it breaks you. You want to say it's the same object, don't you?

  **P:** Obviously. It's a single four-dimensional object whose career just has a hole in it. There's no temporal part at t2. Why should temporal parts be contiguous? As long as the t3 stage is causally connected to the t1 stage in the right way, it's one worm.

  **E:** But there's nothing at t2. Nothing. If I say the object persisted, I'm saying *it* existed at t1 and *it* existed at t3. But on your view, "it" is the sum of its parts. If there's no part at t2, the sum has a gap. You're saying an object can exist, then not exist, then exist again, and still be one thing.

  **P:** I'm saying the *worm* exists. The worm is spread out over time. Just because there's no worm-stage at t2 doesn't mean the worm doesn't exist. Think of a road with a bridge missing. It's still one road.

  **E:** That's the disanalogy. The road exists at the gap in the sense that the space is occupied by the road's location, even if the surface is broken. In your Blinker case, the ontology is zero at t2. You're asking me to accept existence without being. But look, here's where you're going to bleed. What links the t1 stage to the t3 stage? If it's just qualitative similarity—same matter, same arrangement—then I can duplicate the universe at t3 by accident. Cosmic luck creates a duplicate. Is that the same object?

  **P:** No, similarity isn't enough. You're right. I need causal continuity. The t1 stage has to cause the t3 stage.

  **E:** How? If the object is annihilated at t2, the causal chain is broken. Causation requires existence. You can't have a cause that doesn't exist anymore producing an effect later unless there's some background field holding the potential.

  **P:** **Okay, I concede that.** Mere non-contiguity can't be the whole story. If I just say "gaps are fine," I lose the distinction between persistence and replacement. I need an account of immanent causation that can skip a beat. That's a cost. I have to posit a causal relation that holds across a temporal void. It's weird.

  **E:** It's incoherent. But now look at me. I'm in trouble too. If I say the Blinker didn't persist—that the t1 object died and a new one was born at t3—I have to explain why ordinary persistence is different. I survive from Monday to Tuesday. There are no gaps. But why does the lack of a gap matter? If matter and arrangement are preserved across a gap, why isn't that persistence? If I say it's not persistence, I'm saying numerical identity depends on continuous existence.

  **P:** Which is your view. You say the object is wholly present. If it's not present at t2, it's not the same object.

  **E:** But then ordinary persistence looks magical. Why does the universe care about continuity? If God paused the universe for a millennium and restarted it exactly, I'd say I survived. But that's a gap in *time*, not in *existence*. The Blinker is a gap in existence. If I deny the Blinker persists, I'm saying existence is all-or-nothing. But that makes ordinary persistence weirdly lucky. It suggests I survive only because the universe didn't blink.

  **P:** **I'll take that win.** You're admitting that on your view, persistence is contingent on the universe not glitching. That makes identity fragile. But don't think I'm off the hook. My concession stands: I need a causal glue that jumps the gap. If I can't explain how causation works across non-existence, I'm just waving hands.

  **E:** So we're both stuck. You need causation without existence. I need existence without continuity to not matter. But wait—maybe the case itself is the problem. Is it coherent to say "same matter" pops up? If the matter is annihilated, it's gone. If new matter pops up, it's new matter.

  **P:** Suppose it's the same tokens of matter. Reassembled.

  **E:** Then matter isn't the criterion. If I swap all my atoms, I persist. So it's not the matter. It's the form? The history?

  **P:** It's the causal history. But we agreed causation across a gap is the hard part.

  **E:** Here's what I'm worried about. If I say the Blinker persists, I have to say it existed at t2. But by hypothesis, it didn't. So I have to say "existence at a time" is not required for "existence simpliciter." But that destroys my view. I say objects are wholly present at times. If it's not present at t2, it doesn't exist at t2. If it doesn't exist at t2, and existence is required for identity, it's not the same object.

  **P:** Unless identity is trans-temporal and doesn't care about the gaps. But then you're basically a perdurantist who hates temporal parts.

  **E:** Don't. But you're right. To save the intuition that the Blinker persists, I have to loosen what "exists at t" means. Maybe it means "is part of the history of something that exists at t." But that sounds like stages.

  **P:** So here's where we are. I admit I need a causal mechanism that bridges non-existence. You admit that if you deny persistence, you make ordinary survival depend on the universe not blinking, which makes identity too lucky.

  **E:** And if I affirm persistence, I have to admit an object can be wholly present at t1 and t3 without being present at t2, which sounds like contradiction.

  **P:** So the Blinker doesn't settle it yet. It just pushes the bug under different rugs. For this case to settle the debate, we need to know one thing: Is causal continuity across a gap metaphysically possible?

  **E:** If it is, you win, because you can accommodate the gap and I can't without contradicting "wholly present." If it isn't, I win, because then the Blinker is two objects, and my continuity requirement holds.

  **P:** But we don't know if it's possible. We're just guessing about exotic physics.

  **E:** Exactly. We're fighting over a case that depends on a causal power we can't verify. Until we know if causation can jump a void, we don't know if the Blinker is one thing or two. And if we don't know that, we don't know if persistence requires continuous existence.

  **P:** So the debate isn't about objects. It's about causation.

  **E:** Apparently. Pass the coffee. I'm not writing this up until we know if voids can cause things.

  **P:** Don't hold your breath. But at least we agree the wire is bent.

  **E:** Don't start.
