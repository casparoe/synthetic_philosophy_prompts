answer: |-
  You have instinctively rediscovered the backbone of deontological ethics, specifically the machinery behind Immanuel Kant's *Categorical Imperative*. You are right to feel that there are seams here; philosophers have been fighting over them for two centuries.

  The short answer is: **Yes, the split is real.** The first two flavors have standard names in ethics. The third flavor is the one that keeps modern ethicists up at night, and it is the most fertile ground for a novelist because it relies on *contingent facts* about the world rather than *logical truths*.

  Here is the carving you need, the names attached to them, and how to weaponize the boundary cases in dialogue.

  ### 1. The Three Flavors (and their Names)

  In Kantian scholarship, the "What if everyone did that?" test is the **Formula of Universal Law**. When a maxim (a rule for action) fails this test, it fails in one of two classic ways. You have identified a third that is often conflated with the first but is distinct in a way that matters for fiction.

  #### Flavor One: The Logic Trap
  *   **Your Name:** The Collapse Kind.
  *   **Philosophical Name:** **Contradiction in Conception.**
  *   **The Mechanism:** If everyone did this, the act would become *logically impossible*. The concept destroys itself.
  *   **The Edge:** This applies to things that rely on a shared convention of truth or trust to exist at all.
  *   **Example:** False promising. If everyone promised with no intent to keep it, the word "promise" would cease to mean anything. You literally *cannot* make a false promise in a world where no one believes promises. The tool breaks.
  *   **Dialogue Hook:** A character argues that the act is *incoherent*, not just bad. "You aren't breaking the rule; you're deleting the game board."

  #### Flavor Two: The Horror World
  *   **Your Name:** The Ugly Kind.
  *   **Philosophical Name:** **Contradiction in Will.**
  *   **The Mechanism:** If everyone did this, the act remains *possible*, but no rational being could *want* to live in that world. It contradicts what we necessarily will for ourselves (survival, help, happiness).
  *   **The Edge:** This applies to positive duties (charity, self-improvement). The world functions, but it becomes hostile to human flourishing.
  *   **Example:** Never helping others. I can conceive of a world where no one helps anyone. I can even imagine surviving in it. But I cannot *will* it, because I know I will eventually need help. To will the rule is to will my own abandonment.
  *   **Dialogue Hook:** A character argues that the act is *selfish*, not illogical. "The world doesn't break, it just becomes a place where you'd hate to be born."

  #### Flavor Three: The Host Death
  *   **Your Name:** The Parasite Kind.
  *   **Philosophical Name:** **Contradiction in Causality** (or **Institutional Collapse**).
  *   **The Mechanism:** This is the one you spotted. The act remains *logically possible* (lying is still lying), but the *system* that makes the act profitable or meaningful collapses due to causal necessity, not logical definition.
  *   **The Edge:** This relies on **Institutional Facts** vs. **Brute Facts**.
      *   *Flavor 1* destroys a Brute Fact (communication requires trust).
      *   *Flavor 3* destroys an Institutional Fact (tax systems require revenue).
      *   In Flavor 3, the lie still works. The tax office still exists *for a moment*. But the *capacity* of the tax office to function drains away. It is a "Free Rider" problem scaled up.
  *   **Example:** Tax evasion. If everyone does it, the lie is still a lie. But the treasury empties. The office closes. The thing you were lying *to* ceases to exist.
  *   **Dialogue Hook:** A character argues that the act is *unsustainable*, not immoral. "It works only as long as you're the only one doing it. It's not a strategy; it's a countdown."

  ### 2. The Boundary Problem (The "Description" Fight)

  You asked: *"Is 'cheating on my taxes' one act, or just a species of 'getting money by whatever means work'?"*

  You have put your finger on the **Problem of Maxim Formulation**. This is the single biggest criticism of Kantian ethics, and it is perfect for your novel.

  The verdict of the "What if everyone did that?" test changes entirely based on how you describe the act.
  *   **Description A:** "I will lie to the government to keep my money." -> Universalize -> Government collapses. (Fails Flavor 3).
  *   **Description B:** "I will allocate my resources to ensure my family's survival." -> Universalize -> Everyone cares for their family. (Passes Flavor 2).
  *   **Description C:** "I will break unjust laws." -> Universalize -> Society changes? (Ambiguous).

  **Why this matters for your characters:**
  Smart characters shouldn't just argue about whether the act is wrong. They should argue about **how to name the act.**

  *   **Character A (The Accuser):** "You're breaking a promise." (Frames it as Flavor 1: Conceptual Collapse).
  *   **Character B (The Defender):** "I'm managing expectations." (Frames it as Flavor 2: Ugly World, but maybe acceptable).
  *   **Character C (The Cynic):** "I'm optimizing within a broken system." (Frames it as Flavor 3: Parasite, implying the system deserves to die).

  If your characters are sophisticated, they will know that winning the argument means forcing the other person to accept your *description* of the maxim.

  ### 3. Boundary Cases for Dialogue

  Here are specific scenarios where the buckets blur, which you can use to create tension.

  **Case 1: The "White Lie" (Flavor 1 vs. Flavor 2)**
  *   *Situation:* Lying to protect someone's feelings.
  *   *The Fight:* If everyone lied to protect feelings, does language collapse (Flavor 1)? Or does the world just become slightly less honest but warmer (Flavor 2)?
  *   *Dialogue:* "If we all did it, words would lose their value." / "No, if we all did it, we'd just all be kinder. You're confusing truth with brutality."

  **Case 2: The "Strike" (Flavor 2 vs. Flavor 3)**
  *   *Situation:* Workers refusing to work to demand higher pay.
  *   *The Fight:* If everyone refused to work, society starves (Flavor 2: Ugly World). But if only *this* industry does it, the company goes bankrupt (Flavor 3: Parasite/Host Death).
  *   *Dialogue:* "You're killing the company." / "We are the company. Without us, there is no host to parasite off of."

  **Case 3: The "Glitch" (Flavor 3 vs. Not Wrong)**
  *   *Situation:* Finding a loophole in a law that no one knew existed.
  *   *The Fight:* If everyone used this loophole, would the law break? Or was the law just poorly written?
  *   *Dialogue:* "If everyone did this, the system fails." / "Then the system was flawed. I'm not breaking the rule; I'm proving the rule is stupid." (This challenges whether the *system* deserves to survive).

  ### 4. A Note on "Flavor 3" (The Parasite)

  You are right to separate Flavor 3 from Flavor 1. In philosophy, this is the difference between a **Logical Contradiction** and a **Practical Contradiction**.

  *   **Flavor 1 (Logical):** The sentence "Everyone makes false promises" is like saying "There is a married bachelor." It makes no sense.
  *   **Flavor 3 (Practical/Causal):** The sentence "Everyone evades taxes" makes sense, but the *result* is that the state cannot function.

  **Why this distinction helps you write:**
  Flavor 1 arguments feel timeless and absolute. They sound like math.
  Flavor 3 arguments feel political and historical. They sound like economics.

  If a character uses a Flavor 1 argument, they are claiming **moral absolutism**.
  If a character uses a Flavor 3 argument, they are claiming **systemic dependency**.

  This allows you to have a character who admits an act is "wrong" in the Flavor 3 sense (it hurts the system) but argues the system *deserves* to be hurt.
  *   *"Yes, if everyone stole from this corporation, it would collapse."*
  *   *"And?"*
  *   *"And that's why you shouldn't do it."*
  *   *"No, that's why I know it's effective."*

  ### Summary for Your Notes

  1.  **Conceptual Contradiction (Collapse):** The act becomes impossible. (The tool breaks). *Use for: Lies, Promises, Contracts.*
  2.  **Volitional Contradiction (Ugly):** The act is possible, but unbearable. (The user breaks). *Use for: Charity, Aid, Self-Sacrifice.*
  3.  **Systemic Contradiction (Parasite):** The act works, but kills the host. (The stage breaks). *Use for: Taxes, Voting, Environmental use, Loopholes.*

  **The "Description" Loophole:**
  Remember that characters can shift a case from Bucket 1 to Bucket 2 simply by changing the noun.
  *   "I am **stealing**." (Bucket 1: Property concept collapses).
  *   "I am **redistributing**." (Bucket 2: World becomes chaotic, but maybe justifiable).
  *   "I am **surviving**." (Bucket 2: Hard to argue against).

  Your characters fighting over *which bucket an action falls into* is actually them fighting over *how to define reality*. That is where the drama is.
