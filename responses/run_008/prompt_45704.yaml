prompt: |-
  So I'm a novelist, and I've gotten stuck on something that turned out to be more philosophy than craft, and I'm hoping you can tell me whether the thing I've noticed has actual names attached to it — right now my notes are a mess of phrases like "the collapse kind," "the ugly kind," and "the parasite kind."

  Here's the situation. Several characters in the book I'm writing lean on the move where somebody justifies a moral rule by asking what would happen if everyone did the thing. You know the move. "What if everybody made promises they never intended to keep?" But while drafting argument scenes I realized the move doesn't come in one flavor, it comes in at least three, and I can't find the seams between them.

  Flavor one: the reply is that the practice eats itself. If everyone made promises with zero intention of keeping them, the word would stop doing any work — nobody would beleive it, so making one wouldn't get you anything, so there'd be nothing left to misuse. The act becomes impossible, not just inconvenient. (Collapse kind.)

  Flavor two: the reply is that the world keeps running but becomes one you couldn't want. If everyone decided to never lift a finger for a stranger in trouble, the machinery of daily life doesn't break — promises still function, queues still form — its just a world where, next time you're the one in trouble, nobody comes. Nothing logical contradicts; it's a world you couldn't stomach choosing. (Ugly kind.)

  Flavor three is the one giving me trouble. If everyone cheated on their taxes, the act of cheating wouldn't become impossible — lying to the tax office works fine as an act no matter how many people do it. What breaks is the background: no revenue, no tax office, nothing left to lie to. But that's not the same as flavor one, is it? In flavor one the thing destroyed is the very tool the maxim uses (the promise). In flavor three the tool (the lie) survives; it's the stage it was built on that goes. (Parasite kind: it only works because it stays rare.)

  So, questions. Does this three-way split have established names, or do any of the individual flavors? I have a feeling I'm brushing up against something old and systematic — the "what if everyone did it" move smells like Kant to me, but I only know him at the t-shirt level — but I don't want a label, I want the actual carving: which cases go in which bucket, and what to do with the ones that could fall either way depending on how you describe the act. Is "cheating on my taxes when I feel like it" one act, or just a species of "getting money by whatever means work"? Because if the description is up for grabs, it looks like the bucket a case lands in is up for grabs too, and that seems like it should bother somebody besides me. If the split is real but unnamed, coin me terms and give me boundary cases a novelist can actually put in dialogue. Please don't hand me a name and call it a day — I need to know where the edges are, since my characters are going to fight about exactly those edges.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** A novelist stuck on a philosophical distinction within ethical argumentation.
      *   **Core Concept:** The "What if everyone did that?" test (Universalizability).
      *   **Observation:** The user has identified three distinct "flavors" of failure when universalizing a maxim.
          *   Flavor 1 (Collapse): The practice becomes logically impossible (e.g., false promising destroys the concept of promising).
          *   Flavor 2 (Ugly): The practice remains possible but creates a world no one would want (e.g., no charity/help).
          *   Flavor 3 (Parasite): The individual act remains possible, but the system supporting it collapses (e.g., tax evasion destroys the tax system).
      *   **Needs:**
          *   Do these have established names?
          *   What are the actual philosophical distinctions/carvings?
          *   How to handle boundary cases (description of the act)?
          *   If unnamed, coin terms and provide boundary cases for dialogue.
          *   *Constraint:* Don't just give a label; explain the edges and mechanics for dramatic use.

  2.  **Initial Philosophical Mapping:**
      *   The "What if everyone did that?" move is definitely Kant's *Categorical Imperative* (specifically the Formula of Universal Law).
      *   Kant himself distinguishes between *perfect duties* and *imperfect duties*.
      *   Contemporary Kantian scholars (like Onora O'Neill, Christine Korsgaard, Barbara Herman) have dissected these failures.
      *   *Flavor 1 (Collapse):* This is a **Contradiction in Conception**. The maxim cannot even be *conceived* as a universal law without contradiction. (Kant's standard example: False promising).
      *   *Flavor 2 (Ugly):* This is a **Contradiction in Will**. The maxim can be conceived, but a rational agent cannot *will* it without contradicting their own will/needs. (Kant's standard example: Not helping others).
      *   *Flavor 3 (Parasite):* This is trickier. It sounds like a "Free Rider" problem or a "Collective Action Problem." In Kantian terms, it often gets lumped into Contradiction in Conception, but the user is right to sense a difference. It's about the *preconditions* of the act rather than the *definition* of the act. Some philosophers call this "Institutional Destruction" or "Structural Contradiction."

  3.  **Evaluating the "Flavor 3" Distinction:**
      *   The user is sharp. Flavor 1 destroys the *meaning* of the act. Flavor 3 destroys the *context* of the act.
      *   Example: False promising (Flavor 1) -> "Promise" loses meaning.
      *   Example: Tax Evasion (Flavor 3) -> "Tax Office" loses funding/existence, but "Lying" still works.
      *   Is this a standard distinction? Not explicitly in intro textbooks, but yes in meta-ethics. It relates to *Institutional Facts* vs. *Brute Facts* (Searle).
      *   It also relates to the distinction between *Logical Contradiction* and *Practical Contradiction* (Korsgaard).
      *   Let's refine the terms.
          *   Flavor 1: Conceptual Collapse (Internal).
          *   Flavor 2: Volitional Rejection (External/Consequentialist-adjacent).
          *   Flavor 3: Structural Parasitism (Systemic).

  4.  **Addressing the "Description of the Act" Problem:**
      *   The user asks: Is "cheating on taxes" one act or a species of "getting money"?
      *   This is the **Problem of Maxim Formulation**. It's a huge debate in Kantian scholarship.
      *   If I describe it as "Stealing," it fails universalization. If I describe it as "Taking surplus when I need it," maybe not.
      *   This is fertile ground for dialogue. Characters can argue over how to frame the maxim to shift the burden of proof.

  5.  **Drafting the Response:**

      *   **Validation:** Acknowledge the user's insight. They have correctly identified the Kantian split (Conception vs. Will) and spotted a third nuance often glossed over.
      *   **Naming the Flavors:**
          *   Flavor 1: *Contradiction in Conception* (Kant's term). Let's call it **Conceptual Suicide** for fiction purposes.
          *   Flavor 2: *Contradiction in Will* (Kant's term). Let's call it **Volitional Ruin**.
          *   Flavor 3: This needs a specific name. It's often treated as a subset of Conception, but the user is right it's different. Let's call it **Structural Parasitism** or **Institutional Collapse**.
      *   **Deep Dive into Flavor 3:** Why is it different? Flavor 1 kills the *verb*. Flavor 3 kills the *noun* (the institution).
      *   **The "Maxim Formulation" Problem:** Address the user's worry about boundary cases. This is the "Description Problem." Explain that characters *should* fight about this. It's not a bug; it's a feature.
      *   **Dialogue Tools:** Give specific examples of how characters can pivot between these flavors.
      *   **Philosophers to Reference (lightly):** Kant (obviously), Korsgaard (Practical Contradiction), Rawls (Free Rider), Searle (Institutional Facts).

  6.  **Refining the Terms for a Novelist:**
      *   Academic terms are clunky. Need dramatic terms.
      *   Flavor 1: **The Logic Trap** (It becomes impossible).
      *   Flavor 2: **The Horror World** (It becomes unbearable).
      *   Flavor 3: **The Host Death** (It kills the thing it feeds on).
      *   *Self-Correction:* Stick closer to the user's intuition but ground it.
      *   1: **Conceptual Contradiction** (The tool breaks).
      *   2: **Volitional Contradiction** (The user breaks).
      *   3: **Systemic Contradiction** (The stage breaks).

  7.  **Addressing the "Boundary Cases":**
      *   The user is worried that the bucket depends on the description.
      *   Confirm this is true. It's the "Level of Description" problem.
      *   Example: "Lying" vs. "Lying to a murderer at the door."
      *   Strategy for the novel: Make the *definition of the act* the conflict.

  8.  **Final Review against Constraints:**
      *   Did I give names? Yes (Kantian + descriptive).
      *   Did I explain the carving? Yes (Conception vs. Will vs. System).
      *   Did I address boundary cases? Yes (Maxim Formulation).
      *   Did I avoid just handing a label? Yes, provided mechanics for dialogue.

  9.  **Constructing the Output:** (Mental Outline)
