answer: |-
  This is one of the sharpest objections to the standard "Sunk Cost Fallacy" (SCF) dogma, and it cuts to the heart of the difference between *decision theory in a vacuum* and *game theory in a social world*.

  You are correct that structurally, "we must stay because soldiers died" looks identical to "we must ship because we coded for a year." But the rationalist analysis of the war case usually splits into three distinct buckets, only one of which is actually a fallacy.

  Here is how you square the circle.

  ### 1. The Game-Theoretic Account (Schelling Points)
  This is the "hard" rationalist answer. In a strategic conflict, your utility function does not depend only on the physical outcome of the current war; it depends on the **precedent you set for future conflicts.**

  If you are a nation-state, your security depends on deterrence. Deterrence depends on your adversaries believing that you will fight even when it is costly.
  *   **The Logic:** If you withdraw the moment the marginal cost exceeds the marginal benefit of *this specific objective*, you have revealed yourself as a purely rational, cost-sensitive actor. An adversary can then exploit this by inflicting just enough pain to make you quit.
  *   **The Precommitment:** By acting *as if* sunk costs matter (i.e., "we have paid too much to quit"), you are signaling that you are the kind of agent who cannot be bullied by attrition. You are effectively binding your hands.
  *   **The Rationality:** It is not rational to value the dead soldiers. It *is* rational to value the **reputation for honoring sacrifices.** If the world believes you quit when things get bloody, future wars become more likely and more costly. Therefore, the "sunk cost" argument is a shorthand for "we must maintain the credibility of our commitments."

  In this frame, the politician isn't making a mistake in accounting; they are playing a repeated game where the payoff matrix includes **signaling value**.

  ### 2. The Sociological Account (Morale and Memetics)
  This addresses your "narrative/meaning" hypothesis. Humans are not individual utility maximizers; we are nodes in a coalition. The cohesion of that coalition depends on shared stories.

  *   **The Narrative:** The story "we fight to minimize losses" is fragile. If the mission becomes hard, the story justifies quitting. The story "we fight until victory, no matter the cost" is robust.
  *   **The Mechanism:** If a society accepts the premise "a death is wasted if we don't win," then soldiers are more willing to die (because they believe their death purchases victory). If the society accepts "a death is a tragedy regardless of the outcome," the willingness to sacrifice decreases.
  *   **The Rationality:** Citing the fallen is a way to manipulate the morale of the living. If you withdraw, you must tell the grieving families, "Your son died for a mistake." If you continue, you tell them, "Your son died for a necessary victory." The latter maintains social cohesion and military morale for the duration of the conflict.

  This isn't about the *dead* having retroactive value; it's about the *living* requiring a specific ontology of sacrifice to function effectively as a fighting unit.

  ### 3. The Accounting Distinction (Cost vs. Consequence)
  This is where the LessWrong orthodoxy holds firm, but requires precise phrasing.

  **The Fallacy:** "We spent $X billion and 1,000 lives. Therefore, the project is now worth more than it was before."
  **The Rational Move:** "We spent $X billion and 1,000 lives. Therefore, the **consequences of quitting** are now worse than they were before."

  Notice the difference.
  *   In the **CEO case**, usually, the market doesn't care if you quit. The R&D budget is gone either way. Quitting saves future money. There is no reputational penalty large enough to offset the savings. So citing the past spend is a fallacy.
  *   In the **War case**, quitting triggers specific negative consequences (loss of deterrence, collapse of morale, political overthrow) that *would not have existed* if you hadn't spent the resources.

  The sunk cost itself is still zero value. But the **fact that the cost was incurred** has changed the future landscape. Referencing the cost is not valuing the past; it is using the past as data to predict the future penalties of stopping.

  ### Answering the Bigger Question: Fallacy or Heuristic?

  Is the Sunk Cost Fallacy actually a fallacy, or just a heuristic?

  **It is a fallacy of accounting, but often a valid heuristic for strategy.**

  You are allowed to "lean on it" only when the **incurrence of the cost changes the future payoff matrix.**

  *   **When it is a Fallacy:** When the past expenditure has no causal impact on future rewards, reputation, or capabilities. (e.g., You bought a bad movie ticket. Watching the bad movie won't make the ticket refundable. Sitting through it is irrational.)
  *   **When it is Rational:** When the past expenditure acts as a **signal**, a **learning investment**, or a **precommitment device**.
      *   *Signal:* "I spent this much, so I must be confident." (Investors stay.)
      *   *Learning:* "We spent this much, so we have learned things that make the next dollar more efficient." (R&D continuation.)
      *   *Precommitment:* "We spent this much, so we have proven we won't quit." (War/Deterrence.)

  ### The Verdict on the War Example

  The politician's argument is rarely *purely* sunk cost reasoning. It is usually a mix of:
  1.  **Schelling Logic:** We must show we don't quit.
  2.  **Morale Management:** We must validate the sacrifice to keep the army fighting.
  3.  **Rhetoric:** (As you suspected) Mobilizing grief to suppress dissent.

  The reason LessWrongers mock the CEO but hesitate to mock the General is that the CEO is usually playing a **single-player game against the market**, while the General is playing a **multi-player game against an adversary who is modeling your decision theory.**

  In a single-player game, ignoring sunk costs is always optimal. In a multi-player game where your opponents can observe your history, acting *as if* you honor sunk costs can be the optimal strategy to prevent exploitation. The fallacy isn't in the reasoning; it's in failing to distinguish between *valuing the past* (impossible) and *valuing the reputation for having valued the past* (highly lucrative).
