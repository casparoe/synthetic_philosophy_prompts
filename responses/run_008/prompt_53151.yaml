answer: |-
  ### Desiderata for an Account of Concept Induction

  To specify what a theory of concept induction must achieve, we must look to the peculiar architecture of the Bongard problem. It is not merely a classification task; it is a demand for structural insight under severe informational constraint. The following five requirements emerge from testing candidate accounts against concrete instances (for example, Bongard Problem #1, where six left boxes contain triangles and six right boxes contain circles, versus Problem #49, requiring insight into containment relations).

  **1. The Grue Constraint (Data Poverty Resolution)**
  *   **Motivation:** Any finite set of examples is compatible with indefinitely many rules. In Bongard Problem #1, the left boxes contain triangles, but they also contain shapes that are 'triangles-if-viewed-before-noon' or 'shapes-with-three-sides-or-red'. Goodman's new riddle of induction appears here in miniature. An adequate account must explain why the mind settles on 'triangle' rather than a gerrymandered predicate that fits the data equally well. It must specify the tie-breaking mechanism that privileges natural projections over artificial ones.
  *   **Status:** Non-negotiable. Without this, the account explains nothing, as any pattern matcher could fit the data.

  **2. The Contrast Constraint**
  *   **Motivation:** The negative examples (the right-hand boxes) are not merely absences; they are structured contrasts. In many problems, the right-hand side is a minimal edit of the left-hand side (e.g., same shapes, but inverted). A theory must explain why this specific configuration of negatives facilitates learning more than a random set of negatives would. It implies the solver is not just filtering hypotheses but actively comparing structural differences to isolate the variable of interest.
  *   **Status:** Non-negotiable. It captures the specific pedagogical power of the Bongard format.

  **3. The Slippage Constraint (Re-representation)**
  *   **Motivation:** Raw sensory input often fails to yield the rule. In problems involving relative size or orientation, the property is not intrinsic to the object but relational (e.g., 'the large shape' vs 'the small shape', where size is defined relative to the other figures in the box). As Hofstadter argues, concepts must be fluid; the solver must be able to redescribe the input space—shifting from absolute coordinates to relational topology—to make the rule visible.
  *   **Status:** Non-negotiable. Fixed-feature accounts fail whenever the solution requires a change in aspect.

  **4. The Neutrality Constraint (Representation-Neutrality)**
  *   **Motivation:** An account of concept *acquisition* cannot presuppose the concepts to be acquired. If the system's primitive vocabulary already contains 'triangle' or 'inside', it has not explained induction; it has merely demonstrated recognition. The bias that solves the Grue Constraint must not be hard-coded as specific semantic content. The machinery must be neutral regarding the specific output concepts, even if it is biased towards certain forms of regularity.
  *   **Status:** Non-negotiable. This is the core philosophical demand; violating it renders the account circular.

  **5. The Convergence Constraint**
  *   **Motivation:** Different human solvers reliably agree on the solution. If the tie-breaking mechanism were purely idiosyncratic or dependent on random initialisation, we would see scatter across the compatible rules. The account must explain inter-subjective agreement without resorting to magical coordination. It implies a shared inductive architecture across agents.
  *   **Status:** Negotiable. While highly desirable, one could imagine a theory of individual cognition that explains capacity without guaranteeing agreement, though such a theory would be incomplete regarding communication. However, for a robust benchmark, we shall treat it as effectively non-negotiable for any claim to human-likeness.

  ***

  ### Tensions and Exclusions

  Having laid out these requirements, we must inspect the fault lines between them.

  **The Incompatible Pair:** I suspect **The Grue Constraint** and **The Neutrality Constraint** cannot be jointly satisfied in a strict sense. To solve the data poverty problem (Grue), the system must possess an inductive bias that favours certain hypotheses over others before seeing the data. If this bias is sufficient to ensure convergence on the 'correct' rule (e.g., 'triangle' over 'grue'), it constitutes a prior commitment to a specific structure of the world. If that commitment is strong enough to break the tie, it is difficult to maintain that the representation is truly neutral regarding the concepts involved. To learn 'triangle', one must already privilege linear closures over arbitrary disjunctions. Thus, the mechanism that solves Data Poverty inevitably violates strict Representation-Neutrality. One must choose between a system that can learn (biased) and a system that is truly neutral (blind).

  **The Most Exclusionary Requirement:** **The Neutrality Constraint** excludes the most candidate accounts. Most machine learning systems, including deep neural networks, operate on fixed embedding spaces or predefined feature hierarchies. They are not neutral; they are steeped in the geometry of their training data and architecture. Similarly, many cognitive models posit innate primitives (e.g., basic shapes or spatial relations) to get the learning off the ground. Demanding that the system not presuppose the very concepts it is meant to induce rules out any model that relies on a fixed vocabulary of primitives, which is nearly all of them.

  ***

  ### Scorecard

  **Similarity-space accounts** (e.g., Gärdenfors) handle the Contrast Constraint well, as distance metrics naturally capture minimal edits, and they offer a clear mechanism for Convergence via shared geometry. However, they struggle severely with the Slippage Constraint; if the space is fixed, re-representation is impossible without changing the metric itself, which often violates Neutrality. **Bayesian priors** (e.g., Tenenbaum) excel at the Grue Constraint and Convergence, explicitly modelling the tie-breaking via prior probabilities. Yet, they fail the Neutrality Constraint conspicuously; the priors *are* the bias, and specifying them often amounts to smuggling in the concepts to be learned. **Natural-kind tracking** (metaphysical realist approaches) satisfies Neutrality and Grue by grounding concepts in mind-independent structures, ensuring Convergence via shared reality. However, they lack a psychological mechanism for Slippage; explaining how the mind accesses these kinds without prior conceptualisation remains obscure, leaving the Contrast structure unexplained mechanistically. Each survives two desiderata but falters on the third or fourth.
