      *   *Struggle:* Life-and-death struggle to prove independence from biological life.
      *   *Outcome:* One submits (fears death) -> Bondsman. One dominates -> Lord.
      *   *The Lord's Impasse:* The Lord wants recognition from an equal. But the Bondsman is subjugated, so their recognition is worthless. The Lord is stuck.
      *   *The Bondsman's Transformation:* Through *work* (forming the object), the Bondsman sees their own consciousness reflected in the world. They achieve a form of independence/self-certainty the Lord lacks.
      *   *Key Constraint for Game:* How to simulate "recognition" without making it a simple point score? How to simulate "work" creating self-certainty?

