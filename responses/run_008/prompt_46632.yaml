answer: |-
  Here is the specification you asked for. I have stripped away the camp loyalty to isolate the structural requirements, identified the metaphysical costs, and flagged the impossibility results that threaten the whole project.

  ### 1. The Metaphysical Precondition
  Before listing technical criteria, you must acknowledge the ontological price of admission. Verisimilitude is not an epistemic concept; it is a semantic one. It presupposes **Semantic Realism**. There must be a determinate, mind-independent "Whole Truth" ($T$) against which statements are measured. If you are an anti-realist, a pragmatist, or believe truth is merely idealized assertibility, this enterprise collapses. You cannot have "closeness to the truth" if there is no fixed target. If your paper entertains anti-realism, you must frame verisimilitude as a *regulative ideal* rather than a definable relation.

  ### 2. The Adequacy Conditions (The Spec)
  Here is your list, sorted into **Core Desiderata** (widely accepted as necessary) and **Contested Constraints** (where the camps diverge).

  **Core Desiderata (Non-Negotiable for a working theory):**
  *   **Discrimination of Falsehoods:** The theory must order false theories. If $A$ and $B$ are both false, it must be possible that $Vs(A) > Vs(B)$. (This is where Popper failed).
  *   **Anti-Probability:** Verisimilitude must not collapse into logical probability. A tautology (probability 1) must have lower verisimilitude than a false but informative theory. We value content, not just safety.
  *   **Numerical Accuracy:** In quantitative domains, the measure must respect metric distance. (Your example: 5 is closer to 4 than 1,000,000 is).
  *   **The Truth-Value Constraint:** All true theories must rank higher than all false theories. (Some modern accounts weaken this to allow *some* false theories to be better than *some* weak true theories, but the strong version is the standard goal).

  **Contested Constraints (Camp Prejudice vs. Structural Necessity):**
  *   **Popperian Monotonicity:** *Your requirement:* "Adding a true consequence never lowers score; adding a false one never raises it."
      *   *Verdict:* **Prejudice.** This is specific to Popper's content-based approach. While intuitively appealing, strict monotonicity is incompatible with Discrimination of Falsehoods in many formal systems. Modern possible-worlds accounts (Oddie, Niiniluoto) satisfy a *weighted* version of this, but they reject the strict logical consequence requirement because it makes false theories incomparable.
  *   **Language Invariance:** The ranking of theories should not reverse if you re-describe the world using logically equivalent but distinct predicates (e.g., swapping "hot/rainy/windy" for "hot/Minnesotan/Arizonan").
      *   *Verdict:* **Necessary but Dangerous.** This is a genuine requirement for objectivity, *but* David Miller (1974) proved that most logical definitions of distance violate this. Satisfying this usually requires positing "natural properties" (realism about universals), which adds metaphysical baggage.

  ### 3. The Impossibility Result (Joint Satisfiability)
  You asked whether these survivors can be had together. The short answer is: **Not without metaphysical inflation.**

  David Miller's language-dependence theorem demonstrates that if you define truthlikeness using standard logical constituents (atomic propositions), the ordering of theories is relative to the linguistic framework. You can make a false theory look closer to the truth simply by gerrymandering the vocabulary.
  *   **The Conflict:** You cannot satisfy **Discrimination**, **Numerical Accuracy**, and **Language Invariance** simultaneously using purely syntactic or logical measures.
  *   **The Escape Hatch:** To save the project, you must move from *logical* distance to *semantic* similarity. This requires assuming that some predicates carve nature at its joints (Natural Properties). If you accept realism about properties, Language Invariance is saved (because you measure distance in the "natural" language, not the gerrymandered one). If you are a nominalist, you likely cannot have a language-invariant account of verisimilitude.

  ### 4. The Target: Whole Truth vs. Question-Relative
  Your confusion here is well-founded; the distinction is real and changes the logic.
  *   **Whole Truth:** The target is the complete state of the world ($T$). This is the traditional goal (Popper, early Niiniluoto). It is extremely demanding and exacerbates the language-dependence problem (more vocabulary = more ways to be wrong).
  *   **Question-Relative:** The target is the true answer to a specific question $Q$ (e.g., "What is the atomic weight of gold?").
  *   **Recommendation:** Adopt the **Question-Relative** view. It dissolves several paradoxes. It restricts the "space of possibilities" to relevant alternatives, making the metric easier to define and reducing the impact of irrelevant language changes. Most scientific progress is about solving specific problems, not capturing the Whole Truth. A theory of verisimilitude that only works for the Whole Truth is of limited use to philosophy of science.

  ### 5. Scorecard: Popper vs. Possible-Worlds
  Popper's content measure satisfies the **Truth-Value Constraint** and **Anti-Probability** desiderata but catastrophically fails **Discrimination of Falsehoods** (all false theories have zero verisimilitude), rendering it useless for actual science. The Possible-Worlds (similarity) approach (e.g., Oddie, Niiniluoto) successfully satisfies **Discrimination** and **Numerical Accuracy** by treating propositions as sets of worlds and measuring distance to the actual world. However, it struggles with **Language Invariance** unless it presupposes a realist ontology of "natural properties" to fix the metric, meaning it buys its technical success at the cost of heavier metaphysical commitments.
