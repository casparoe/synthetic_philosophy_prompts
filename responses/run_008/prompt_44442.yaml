  so my philosophy elective is making us write a "position paper" where we defend our actual own views on when it's ok to blame people, and before I turn it in I want someone to check whether mine even fit together. here's the set:

  1. whether someone deserves blame is 100% about the person being blamed — what they did, that they knew better, that they could've done otherwise. the blamer's own track record is completely irrelevant to whether the blame fits.
  2. blaming is a sanction, not just making an observation — it involves treating the person as worse, feeling something like anger or coldness toward them, and wanting them to feel bad about what they did.
  3. hypocrites have no standing to blame. if my friend lies constantly, she doesn't get to call out other people's lying, even when the call-out is totally accurate.
  4. standing is something you forfeit, not something you have to earn — blame is permitted by default, and you can lose the right to do it through your own conduct, sort of like forfeiting other rights.
  5. blaming that can't accomplish anything is pointless and therefore wrong — even a total non-hypocrite shouldn't blame someone when it won't change anything.

  also there's a concrete case I keep going back and forth on: my mom smoked for years and when she found out my little brother was vaping she went off on him, and honestly I think she was out of line, but I also think his vaping deserved exactly the reaction it got. I genuinely can't tell if I'm holding two views there or if "deserved the reaction" and "she was out of line" are doing two different jobs.

  does this package hang together? which bits are actually in tension, which ones only look like it, and what's the cheapest fix for each and what would I lose by making it? rank the problems by how bad they are instead of just listing them. and please do the whole answer as exactly five numbered points, each one or two sentences, no intro or conclusion, im begging you lol
