answer: |-
  This is an exceptionally sharp dissection of a policy that most people just accept as administrative background noise. You have identified the precise philosophical friction point in modern behavioural public policy.

  Your HR friend is quoting the central tenet of **Libertarian Paternalism** (often associated with Thaler and Sunstein's *Nudge* theory): that people have limited rationality and are governed by inertia, so setting the "good" default improves welfare without removing choice.

  However, **re-enrolment** moves beyond a simple nudge. It is a recurring intervention that treats a previous active choice (opting out) as decaying over time. To answer your question about what view of autonomy this presupposes, we have to reconstruct the specific model of human agency the state is operating under.

  Here is the reconstruction of the assumptions baked into the three-year re-enrolment cycle, and an evaluation of whether they hold up.

  ### 1. The Model of the "Divided Self"
  The system does not view you or your employees as a single, consistent agent. It operates on a **Dual-Self Model**.
  *   **The Planner (Long-term Self):** Wants security, understands compound interest, wants to avoid poverty at 70.
  *   **The Doer (Short-term Self):** Wants cash now, finds forms annoying, suffers from present bias.

  Standard auto-enrolment assumes the *Doer* needs help overcoming inertia to satisfy the *Planner*. Re-enrolment assumes something stronger: that the *Doer* is persistent and the *Planner* is weak. It assumes that without periodic intervention, the *Doer* will permanently hijack the future.

  Therefore, the policy presupposes that **autonomy is not a one-off event but a maintenance task.** It assumes that a decision made three years ago might have been the *Doer* speaking, and the state owes it to the *Planner* to give them another chance to speak. It treats an opt-out not as a settled preference, but as a potentially biased snapshot that needs refreshing.

  ### 2. The "Filter" vs. The "Tax"
  You asked if the inconvenience is a filter to separate real preferences from inertia, or an asymmetric burden to catch the "mistaken."

  It is **both**, but the balance shifts with re-enrolment.
  *   **Initial Opt-out:** This is the filter. If you really don't want it, you will fill out the form.
  *   **Re-enrolment:** This is a **tax on the preference not to save.**

  By forcing your employee to fill out the form again, the state is effectively saying: "We acknowledge you can opt out, but we have decided that the social and individual cost of you *not* saving is high enough that we will charge you a 'transaction cost' (time, annoyance, administrative friction) every three years to maintain that status."

  Is this principled? Under **welfarist paternalism**, yes. The state has calculated that the lifetime welfare loss of insufficient pension savings (leading to reliance on state benefits or poverty) outweighs the welfare loss of the annoyance of filling out a form. The asymmetry exists because the state views the "save" outcome as objectively superior to the "don't save" outcome for almost everyone.

  ### 3. The Shelf Life of Consent (Why 3 Years?)
  Is there a principled line on the cycle?
  The three-year cycle is not arbitrary, but it is pragmatic rather than purely philosophical. It relies on the assumption of **Preference Instability.**

  *   **1 Year:** Too frequent. This would shift from "protecting the long-term self" to "nagging." It would imply the state thinks citizens are incapable of holding a preference for 12 months, which undermines agency too severely.
  *   **10 Years:** Too long. In a decade, a person's life circumstances (salary, marriage, children, health) change drastically. An opt-out decision made at 25 might be rational, but at 35, with a mortgage and higher income, it might be a mistake.

  The three-year window is the state's estimate of the **"validity half-life" of a financial decision.** It assumes that if you still want to opt out after three years, your preference is likely "real" (hence you are allowed to opt out again), but the state requires you to *re-affirm* that the conditions haven't changed.

  ### 4. Consistency with Other Risks (The Smoking Question)
  You asked why we don't re-enrol smokers. This is the strongest critique of the policy's consistency.
  *   **Smoking:** The harm is to health. The state taxes cigarettes and bans advertising. But they don't force you to "re-quit" every three years.
  *   **Pensions:** The harm is to future wealth.

  The difference lies in **Time Inconsistency.**
  Smoking is bad for you now and later. Pension non-contribution is often *good* for you now (more liquidity) and bad for you later.
  The state intervenes more aggressively in pensions because the "victim" of the bad decision is the **Future You**, who cannot vote or complain. In behavioural economics, this is a "internality" problem. The state acts as the guardian of the Future You against the Present You.

  With smoking, the harm is more immediate (health degradation starts quickly). With pensions, the harm is deferred 40 years. The state assumes you are *incapable* of properly valuing a benefit 40 years away, whereas you might properly value the stress relief of a cigarette today. Therefore, the state feels more justified in "correcting" the pension choice repeatedly than the smoking choice.

  ### 5. Is It Justifiable?
  Does this system take opters-out seriously as agents?
  **Technically, yes. Philosophically, barely.**

  It satisfies the definition of **Libertarian Paternalism** because the exit door is never locked. Your employee *can* keep the cash. However, it violates a stricter view of **Respect for Autonomy** which holds that a competent adult's expressed preference should be respected until *they* choose to change it, not until the *state* decides to check again.

  **The Justification:**
  The policy is defensible only under a theory of **Enhanced Autonomy**. This theory argues that true autonomy requires the ability to act on one's long-term goals. Because cognitive biases (present bias, inertia) systematically prevent people from acting on their long-term goals, removing those biases (even via friction) actually *increases* freedom in a meaningful sense.

  **The Critique:**
  The critique is that this treats citizens like children who need their homework checked periodically. It assumes that if a person chooses cash now over pension later, they are necessarily making a "mistake" rather than a **trade-off.**
  Your employee in his late twenties might have a high discount rate. He might value a holiday, a deposit on a house, or simply not worrying about bills *now* more than a slightly larger pot at 68. By making him opt out repeatedly, the system implicitly tells him: *"We know what you value better than you do, and we will make it annoying for you to pursue your current values until you align with ours."*

  ### Summary
  The re-enrolment rule presupposes that:
  1.  **Preferences are unstable** or were originally formed under bias.
  2.  **Consent expires.** A decision made 3 years ago is not valid today without re-affirmation.
  3.  **The Future Self has rights** that the State must enforce against the Present Self.

  Is it principled? Yes, if you accept that the state's role is to correct systematic cognitive errors regarding long-term planning.
  Is it respectful? Only in the thinnest sense. It preserves the *right* to opt out, but it actively discourages the *exercise* of that right through recurring friction.

  You are effectively the field agent of this philosophy. The annoyance your employee feels is not a bug; it is the feature. The policy hopes that enough people will find the friction annoying enough that they just stay enrolled, thereby "saving them from themselves." Whether that is a legitimate role for the state, or an overreach into personal time-preference, remains one of the great unresolved questions of modern governance.
