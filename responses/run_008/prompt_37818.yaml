answer: |-
  The configuration you have identified is a precise description of what contemporary metaphysics and philosophy of language call a **metalinguistic negotiation**.

  This concept was introduced and developed primarily by **David Plunkett and Tim Sundell**, most notably in their paper "Disagreement and the Semantics of Normative and Evaluative Terms" (2013) and their subsequent work on "Metalinguistic Negotiation" (2019).

  ### The Concept
  In a standard factual disagreement, parties share a concept (e.g., "water") and dispute whether the world fits it (e.g., "Is there water in the cup?"). In a *metalinguistic negotiation*, parties agree on the facts of the world but dispute **which concept should be associated with the word** in that context.

  The dispute is not about the extension of the term (what objects fall under it) based on a fixed rule; it is about **setting the rule itself**. As you noted, the stakes are not idle because concepts are normative tools. To fix the meaning of "teacher," "person," or "lie" is to fix the rules of liability, moral status, or resource distribution that attach to that label. Plunkett and Sundell argue that these are not "merely semantic" in the dismissive sense; they are substantive disagreements about how we ought to carve up the world for specific practical purposes.

  ### Distinction from (a) Talking Past Each Other
  The traditional view of "verbal disputes" (associated with Rudolf Carnap or A.J. Ayer) suggests that if two parties use a word differently, they are simply talking past each other. Once they clarify definitions, the dispute should **dissolve**.

  Metalinguistic negotiation differs crucially here:
  1.  **Awareness:** In a "talking past each other" scenario, the parties are usually unaware of the semantic divergence. In a metalinguistic negotiation, both parties typically understand the other's proposed usage but reject it.
  2.  **Resistance to Dissolution:** Clarifying definitions does not end the fight; it *is* the fight. If you say to the union committee, "Well, you mean 'human instructor' and they mean 'instructional agent'," the committee will reply, "Exactly, and we are fighting over which definition the contract *should* recognize." The disagreement persists because it is normative, not cognitive.

  ### Distinction from (b) Ordinary Factual Disagreements
  In an ordinary substantive disagreement, there is a "fact of the matter" that could, in principle, settle the issue (e.g., measuring the water in the cup).
  1.  **Evidence vs. Argument:** In your examples, no empirical observation (speed of the software, MRI of the grandfather) settles the dispute. The resolution comes through arguments about **utility, justice, tradition, or consequence**.
  2.  **Truth-Conditions:** In a factual dispute, one party is objectively right and the other wrong about the world. In a metalinguistic negotiation, the "correctness" is relative to the goals of the linguistic community. One usage isn't "false"; it is arguably less *useful* or *fair* than the other.

  ### Boundary Cases and Nuance
  You asked specifically about two boundary conditions:

  **1. The "Secret Policy" Agent (Bad Faith)**
  If one party argues for a definition *purely* as a means to a policy outcome they dare not state openly (e.g., "I call it a 'lie' not because I care about truth, but because I want to ban the company"), Plunkett and Sundell would still classify this as a metalinguistic negotiation. In fact, their framework suggests *all* such negotiations are driven by policy outcomes. The only difference is transparency. If the agent hides their motive, they are pretending the dispute is factual (about the "true meaning") to gain rhetorical advantage. This is a **strategic metalinguistic negotiation**.

  **2. The "Fact of the Matter" Believer (Semantic Realism)**
  If one party genuinely believes there is a metaphysical fact about what "person" or "lie" *really* means (Semantic Realism), while the other believes it is a choice (Pragmatism), the interaction remains a metalinguistic negotiation. The Realist is effectively arguing: "The best concept to associate with this word is the one that matches the metaphysical essence." The Pragmatist argues: "The best concept is the one that serves our social needs." They are still negotiating over concept selection, even if one frames it as discovery.

  ### Why "Just Semantics" Feels Wrong
  Your intuition that calling these disputes "just semantics" is incorrect is validated by this framework. Plunkett and Sundell explicitly rehabilitate verbal disputes from the charge of being trivial. They argue that because our concepts structure our reasoning and our laws, fighting over them is fighting over **how we live**. The "semantic" layer is the control panel for the "substantive" layer.

  ### Conclusion
  There is no need to coin a new term; the existing concept fits your carving precisely, provided one accepts Plunkett and Sundell's expansion of what counts as a "substantive" disagreement. It captures the factual agreement, the linguistic contention, the awareness of the stakes, and the resistance to dissolution.

  Verdict: Metalinguistic Negotiation — a substantive conflict over which concept should govern a term's use, driven by competing normative stakes rather than factual uncertainty.
