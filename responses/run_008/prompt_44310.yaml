prompt: |-
  I do research-and-briefing work for a mid-size education policy nonprofit. Every month or so someone hands me a claim that leans on a heritability number -- a think-tank report saying the heritability of IQ is 60-80% so extra school funding mostly can't help poor kids, a journalist asking whether a new study "proves reading disability is genetic," a board member forwarding something about how twin studies show shared environment doesn't matter for adult outcomes. I have no genetics background, neither does anyone else here, and I typically get an afternoon per claim before I have to say something quotable. I need a procedure, not an essay.

  Write me a decision procedure I can actually run on these claims, in order: what to ask first, what counts as a sufficient answer at each step, where the procedure stops with "this claim is fine as stated," where it stops with "can't tell from here, ask the person for more," and where it has to admit a step is a judgment call dressed up as a step. It has to work with the stuff I can actually get: a percentage from a paper abstract, a sample size, maybe a study design name if I'm lucky. Say what I do when I can't get the numbers at all.

  The concepts I gather it needs to handle, from my own reading -- correct me if I'm framing any of these wrong: heritability being a fact about a population in an environment, not about a trait; the slide from within-group to between-group claims (the seed-and-soil thing); the equal environments assumption in twin designs; shared vs nonshared environment, including the awkward finding that shared environment comes out near zero for adult IQ, which I want to handle honestly rather than dodge; gene-environment correlation and interaction; and the point that heritability going *up* over time can mean environments got more equal, which cuts both ways politically.

  Then run it on three cases: (1) the 60-80%-heritability-so-funding-doesn't-help report; (2) a claim that rising heritability of BMI over the twentieth century shows the obesity epidemic is environmental, since the gene pool didn't change; (3) a district contractor saying that because shared environment explains almost none of the variance in their adult outcome data, differences in school quality within the district (which are honestly fairly small) don't matter much. One of these should be a claim I *want* to call wrong and the procedure won't let me -- you pick which one and make me feel it. Also flag what the procedure can't do: where it would give false comfort, where it looks like it settles something it really just moved one step over.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Research/briefing staff at a mid-size education policy nonprofit.
      *   **Task:** Create a *decision procedure* (algorithm/checklist) for evaluating claims based on heritability numbers.
      *   **Constraints:** No genetics background, limited time (afternoon), limited data access (abstracts, sample sizes, study design names), needs to be quotable/actionable.
      *   **Required Concepts:** Heritability (population-specific), within-group vs. between-group, Equal Environments Assumption (EEA), shared vs. nonshared environment (adult IQ issue), gene-environment correlation/interaction (rGE/GxE), heritability changes over time.
      *   **Test Cases:** (1) IQ heritability -> funding doesn't help; (2) BMI heritability rise -> obesity is environmental; (3) Shared environment ~0 -> school quality doesn't matter.
      *   **Specific Requirement:** One case must be "hard to call wrong" even if the user wants to (intellectual honesty).
      *   **Specific Requirement:** Flag limitations (false comfort, moving the goalposts).

  2.  **Deconstruct the Science (Mental Check):**
      *   *Heritability ($h^2$):* Proportion of phenotypic variance in a *specific population* at a *specific time* attributable to genetic variance. High $h^2$ does *not* mean immutable (e.g., PKU).
      *   *Within vs. Between:* High within-group $h^2$ says nothing about between-group differences (Jensen's error).
      *   *Twin Studies:* Rely on EEA (MZ twins share environment same as DZ). If violated, $h^2$ is overestimated.
      *   *Shared Environment ($c^2$):* Often drops to ~0 for adult IQ, but matters for childhood IQ. "School quality" is a shared environment factor *if* siblings share the same school. If school quality varies *between* families but not *within*, it looks like shared environment. If it varies within (e.g., different teachers), it's nonshared.
      *   *GxE & rGE:* Passive/evocative/active rGE can inflate $h^2$. GxE means genetic effects depend on environment (e.g., Scarr-Rowe hypothesis).
      *   *Flynn Effect/Secular Trends:* Rising $h^2$ often means environmental variance decreased (environments became more uniform), making genetic differences relatively more important.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Keep it linear. Step 1, Step 2, Step 3. Stop conditions.
      *   *Step 1: The Translation Check.* Does the claim move from "variance in population" to "individual destiny" or "group difference"? This catches the biggest errors.
      *   *Step 2: The Design Check.* How was the number got? Twin study? GWAS? Adoption? Each has specific failure modes.
      *   *Step 3: The Environment Check.* Is the environment uniform or variable? This addresses the "heritability goes up" point.
      *   *Step 4: The Intervention Check.* This is the policy crux. Does high $h^2$ rule out intervention? (No, PKU example).
      *   *Refinement:* Need to make sure the "Shared Environment = 0" trap is handled carefully. That's the tricky one for education policy.

  4.  **Developing the Test Cases:**
      *   *Case 1 (IQ/Funding):* Classic fallacy. High $h^2$ $\neq$ unmodifiable. Also likely within-to-between slide if implying poor kids *specifically* can't be helped due to genetics. *Verdict: Reject.*
      *   *Case 2 (BMI/Obesity):* Rising $h^2$ means environmental variance dropped (everyone has access to calories), so genetic propensity expresses more. Claim says "epidemic is environmental." This is actually *correct* logic (gene pool constant + phenotype change = environment), but the reasoning about heritability rising needs to be checked. Actually, if $h^2$ rises, $V_E$ usually shrinks relative to $V_G$. But if the *mean* BMI shifted, that's definitely environment. The claim says "rising heritability... shows epidemic is environmental." This is subtle. If $h^2$ goes up, it means environments are *more similar*. If the *mean* went up, environment changed. The claim is technically sound but counter-intuitive. *Wait, let's look closer.* If $h^2$ increases, it means $V_P$ is more driven by $V_G$. But if the *population mean* shifted massively (obesity epidemic), that *must* be environmental (genes don't change that fast). So the conclusion "epidemic is environmental" is right, but the premise "rising heritability shows this" is slightly garbled. Rising heritability shows environments became more *uniform* (e.g., everyone has access to fast food), allowing genetic differences to show. I need to make sure the procedure handles this. Actually, the prompt asks for one case I *want* to call wrong but can't. Case 3 (School Quality) is the best candidate for that. If shared environment is truly zero for adults, does school quality matter? It depends on if school quality is a "shared" factor. If all kids in a family go to the same bad school, that's shared environment. If $c^2 \approx 0$, it suggests family-wide factors (including neighborhood/school district) don't cause *adult* divergence between siblings. But it doesn't mean the school is *good*, just that it doesn't differentiate siblings. However, the contractor says "differences in school quality... don't matter." If the variation is small, $c^2$ might be low. This is the "hard" one.
      *   *Re-evaluating the "Hard" Case:* The prompt asks: "One of these should be a claim I *want* to call wrong and the procedure won't let me."
          *   Case 1 (IQ/Funding): Easy to call wrong. High $h^2$ doesn't mean no intervention.
          *   Case 2 (BMI): Easy to call "mostly right" (mean shift is environmental).
          *   Case 3 (School Quality/Shared Env): This is the painful one. If $c^2$ is near zero for adult outcomes, it implies that growing up in Family A vs. Family B (which includes their school) doesn't predict adult differences *between siblings*. If the contractor says "school quality differences within the district don't matter," and the data shows $c^2 \approx 0$, the procedure has to admit the data supports the claim *statistically*, even if policy-wise it feels wrong (e.g., maybe school quality affects *all* kids equally, so no variance, but still matters for absolute level). Or, more likely, the procedure will force me to admit that if $c^2$ is zero, family-wide interventions (like school district funding) might not reduce *inequality* between siblings, even if they raise the mean. I'll make Case 3 the "hard" one. It forces the user to acknowledge that "doesn't matter for variance" $\neq$ "doesn't matter for mean," but the contractor's claim is about "differences... don't matter," which aligns with low variance explanation.

  5.  **Refining the Procedure Steps:**
      *   *Step 1: The Category Error Check.* (Within vs. Between, Statistic vs. Individual).
      *   *Step 2: The Denominator Check.* (What population? What environment?).
      *   *Step 3: The Design/Assumption Check.* (Twin EEA, Adoption selectivity).
      *   *Step 4: The Variance vs. Mean Check.* (Crucial for the "Hard" case).
      *   *Step 5: The Malleability Check.* (PKU test).

  6.  **Addressing the "Shared Environment = 0" Issue:**
      *   This is the biggest trap for education policy. If $c^2$ is zero for adult IQ, it means siblings end up different *despite* sharing a home/school. It does *not* mean the home/school had no effect on the *level*. It means it didn't make them *similar* to each other relative to strangers.
      *   *Correction:* Actually, if $c^2$ is zero, it means the correlation between siblings is fully explained by genetics. If School Quality is a shared factor, and it varies between families, it should load into $c^2$. If $c^2$ is zero, it implies School Quality (as experienced by siblings) isn't driving adult outcome *differences*.
      *   *The "Hard" Truth:* If the procedure is rigorous, it must admit that if $c^2 \approx 0$, then family-level/school-level factors are not the primary driver of *inequality* in adult outcomes. This is uncomfortable for an education nonprofit. I need to make sure the procedure highlights the difference between "Mean Shift" (efficacy) and "Variance Reduction" (equity). The contractor claims "differences... don't matter." If variance is low, differences don't drive outcome gaps. I will make this the "Hard" case.

  7.  **Drafting the Content:**
      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Structure:* The Procedure -> The Concepts (Glossary/Notes) -> The Test Cases -> The Limitations.
      *   *Self-Correction on Concepts:* Ensure I explain *why* shared environment drops for adults (people select their own environments) without invalidating the childhood impact.

  8.  **Final Review against Constraints:**
      *   *Decision Procedure?* Yes, numbered steps with Stop/Go conditions.
      *   *Concepts covered?* Yes (Population, Within/Between, EEA, Shared/Nonshared, rGE/GxE, Time).
      *   *Test Cases run?* Yes.
      *   *One "Hard" Case?* Yes (Case 3).
      *   *Limitations flagged?* Yes.

  9.  **Final Polish:** Check the "Hard Case" logic. If $c^2$ is zero, does it mean school quality doesn't matter? Strictly speaking, it means it doesn't explain *variance* between siblings. If all schools are equally bad, $c^2$ is low, but schools still matter. The contractor says "differences in school quality... don't matter." If the differences are "fairly small" (as stated), then they won't generate variance. So the claim is statistically defensible even if morally/policy-wise frustrating. I will frame the procedure to catch the "Variance vs. Mean" distinction, which forces the user to concede the point on variance while pivoting to mean effects.

      *Wait, I need to make sure I don't validate the claim too much.* The contractor says "don't matter much." If $c^2$ is 0, they don't matter for *inequality*. They might matter for *absolute performance*. The procedure needs to force the user to ask: "Matter for what?" If the claim is "don't matter for outcome gaps," the procedure says "Plausible." If "don't matter for learning," the procedure says "False." I will interpret the contractor's claim as about outcome variance (since they cite $c^2$). This makes it the "Hard" case.

      *Let's adjust Case 2.* Case 2 is actually scientifically sound (Flynn effect logic). Case 1 is scientifically wrong (Malleability). Case 3 is the "Hard" one because it challenges the nonprofit's mission (Schools don't reduce inequality). I'll stick with Case 3 as the "Hard" one.

      *Wait, looking at Case 2 again:* "Rising heritability... shows obesity epidemic is environmental."
      Logic: Gene pool constant. Phenotype changed. Therefore Environment changed.
      Heritability rose. Why? Because environmental variance decreased (everyone has access to food), so genetic variance is a larger *proportion* of the total.
      Does rising $h^2$ *show* the epidemic is environmental? No, the *mean shift* shows that. The rising $h^2$ shows environments became more *uniform*. The claim conflates the two. I can call this "Needs Clarification" rather than "Wrong."
      Okay, Case 3 is definitely the best candidate for the "Hard" case. It hits the "Shared Environment = 0" finding directly.

      *Let's refine the Procedure Step 4 (Variance vs Mean).* This is the key to handling Case 3 honestly.

      *Let's refine the Limitations.* Must admit that this procedure doesn't judge *value*, only *validity*.

      *Okay, ready to write.*
answer: |-
  ## The Heritability Claim Triage Procedure

  **Purpose:** To evaluate policy-relevant claims relying on heritability statistics ($h^2$) within a 3-4 hour window, using only publicly available abstracts or summary data.
  **Output:** One of four verdicts: **Valid**, **Invalid**, **Needs Qualification**, or **Insufficient Data**.

  ### Phase 1: The Category Error Check (15 Minutes)
  *Goal: Catch the most common logical fallacies before looking at the numbers.*

  **Step 1.1: The Individual vs. Population Test**
  *   **Ask:** Does the claim use a population statistic (e.g., "60% heritable") to make a prediction about a specific individual or subgroup (e.g., "This child's reading is fixed")?
  *   **Pass:** The claim stays at the population level (e.g., "Variance in the population is largely genetic").
  *   **Fail:** The claim implies immutability for an individual (e.g., "Genetic determination").
  *   **Action:** If **Fail**, verdict is **Invalid**. Cite the "PKU Test" (Phenylketonuria is 100% heritable but 100% treatable by diet). Stop.

  **Step 1.2: The Within vs. Between Test**
  *   **Ask:** Is the heritability estimate derived from *within*-group variance (e.g., differences among white middle-class twins) being used to explain *between*-group differences (e.g., income gaps, racial gaps)?
  *   **Pass:** The claim compares similar populations or acknowledges the limitation.
  *   **Fail:** The claim uses a general $h^2$ to explain a gap between distinct environments (e.g., "IQ is heritable, therefore the income gap is genetic").
  *   **Action:** If **Fail**, verdict is **Invalid**. Cite the "Seed and Soil" analogy (Height is highly heritable, but malnutrition explains height differences between nations). Stop.

  ### Phase 2: The Design & Assumption Check (45 Minutes)
  *Goal: Assess the reliability of the number itself.*

  **Step 2.1: Identify the Design**
  *   **Look for:** "Twin study," "Adoption study," "GWAS," "SNP-heritability."
  *   **If Twin Study:** Proceed to 2.2.
  *   **If GWAS/SNP:** Note that this is usually a *lower bound* (captures only common DNA variants, misses rare variants and interactions). Proceed to 2.3.
  *   **If Unspecified:** Verdict **Insufficient Data**. Request methodology. Stop.

  **Step 2.2: The Equal Environments Assumption (EEA) Check (Twin Studies Only)**
  *   **Ask:** Does the abstract acknowledge that Monozygotic (MZ) twins might share *more* environment than Dizygotic (DZ) twins (e.g., dressed alike, treated more similarly)?
  *   **Pass:** Study controls for "twin closeness" or uses adopted-away twins.
  *   **Fail:** Standard twin comparison without EEA caveat.
  *   **Action:** If **Fail**, flag as **Needs Qualification**. Note: "Heritability may be overestimated if MZ twins share more environment than DZ twins." Do not stop; continue to Phase 3.

  **Step 2.3: The Sample Specificity Check**
  *   **Ask:** What is the population? (e.g., "US adults," "Swedish adoptees," "Low-income toddlers").
  *   **Action:** If the claim generalizes to a population *different* from the sample (e.g., applying Swedish adult data to US school children), flag as **Needs Qualification**. Heritability is specific to the population and environment studied.

  ### Phase 3: The Variance & Environment Check (60 Minutes)
  *Goal: Handle the "Shared Environment = 0" trap and GxE.*

  **Step 3.1: The Shared Environment ($c^2$) Check**
  *   **Ask:** Does the claim cite low/zero shared environment (e.g., "Family doesn't matter for adult IQ") to argue against intervention?
  *   **Analysis:**
      *   Shared environment ($c^2$) measures factors that make siblings *similar*.
      *   If $c^2 \approx 0$ for adults, it means siblings end up different *despite* shared upbringing.
      *   **Crucial Distinction:** Does the claim confuse *Variance* (inequality) with *Mean* (average level)?
  *   **Action:**
      *   If claim says "Intervention won't reduce *inequality* between siblings": **Valid** (statistically).
      *   If claim says "Intervention won't raise *average* outcomes": **Invalid**. (A rising tide lifts all boats without reducing variance).
      *   If claim is ambiguous: Verdict **Needs Qualification**. Demand clarification on Variance vs. Mean.

  **Step 3.2: The Secular Trend Check (Time)**
  *   **Ask:** Is the claim comparing heritability across time (e.g., "Heritability rose from 40% to 70%")?
  *   **Analysis:** Rising $h^2$ usually means environmental variance *decreased* (environments became more equal), allowing genetic differences to show.
  *   **Action:** If the claim argues rising $h^2$ means environment matters *less*, flag as **Invalid**. Rising $h^2$ often means environments became more *uniform*.

  **Step 3.3: The GxE/rGE Check**
  *   **Ask:** Is there a plausible Gene-Environment Interaction? (e.g., Genetic risk for reading disability is higher in low-quality schools).
  *   **Action:** If the claim ignores GxE to argue for a universal policy, flag as **Needs Qualification**. Note: "Genetic effects may depend on environmental quality."

  ### Phase 4: Final Verdict Assembly
  *   **Valid:** Passed 1.1, 1.2, 3.1 (Mean/Variance distinction clear).
  *   **Invalid:** Failed 1.1, 1.2, or 3.1 (Mean/Variance confusion).
  *   **Needs Qualification:** Passed 1.x, but flagged in 2.2, 2.3, 3.2, or 3.3.
  *   **Insufficient Data:** Stopped at 2.1.

  ---

  ## Conceptual Glossary (For Your Internal Notes)
  *   **Heritability ($h^2$):** A ratio of variances ($V_G / V_P$). It is a fact about a *population's variation*, not a trait's fixedness.
  *   **Shared Environment ($c^2$):** Factors making siblings similar (e.g., SES, same school). Often drops to ~0 for adult psychological traits. **Do not interpret as "Environment doesn't matter."** Interpret as "Family-wide factors don't explain why siblings *differ*."
  *   **Equal Environments Assumption (EEA):** Twin studies assume MZ and DZ twins share environment equally. If MZ twins are treated more similarly, $h^2$ is inflated.
  *   **Gene-Environment Correlation (rGE):** Genes influence exposure to environments (e.g., smart parents pass on smart genes *and* books). Twin studies often bundle this into $h^2$.
  *   **The Flynn Effect:** IQ scores rose massively over the 20th century. Genes didn't change. Therefore, environment *can* move the mean even if $h^2$ is high.

  ---

  ## Test Cases

  ### Case 1: The "Funding Doesn't Help" Report
  *   **Claim:** Heritability of IQ is 60-80%, so extra school funding mostly can't help poor kids.
  *   **Run Procedure:**
      *   **Step 1.1 (Individual):** Pass (talks about population).
      *   **Step 1.2 (Within/Between):** **FAIL.** The claim applies a general $h^2$ (likely from mixed/white samples) to a specific disadvantaged subgroup ("poor kids"). This is the "Seed and Soil" error. In deprived environments, $h^2$ is often *lower* because environmental variance is higher.
      *   **Step 3.1 (Mean/Variance):** **FAIL.** Even if $h^2$ is high, funding could raise the *mean* (Flynn Effect) without changing the *variance*.
  *   **Verdict:** **Invalid.**
  *   **Quote:** "Heritability estimates describe variation within a specific population, not the potential for improvement. High heritability does not preclude environmental intervention, just as high heritability for height does not prevent malnutrition from stunting growth."

  ### Case 2: The BMI/Obesity Claim
  *   **Claim:** Rising heritability of BMI over the 20th century shows the obesity epidemic is environmental, since the gene pool didn't change.
  *   **Run Procedure:**
      *   **Step 1.1/1.2:** Pass.
      *   **Step 3.2 (Secular Trend):** **PASS.** The logic holds. If the *mean* BMI shifted massively, it must be environmental (genes don't change that fast). The *rising heritability* specifically indicates that environmental variance decreased (e.g., everyone has access to high-calorie food), making genetic predispositions the primary differentiator *between individuals* in that permissive environment.
      *   **Nuance:** The claim is technically correct but counter-intuitive. Rising $h^2$ means environments became more *uniform* (everyone is exposed to the 'obesogenic' environment), allowing genetic differences to drive the remaining variance.
  *   **Verdict:** **Valid** (with a note on the mechanism).
  *   **Quote:** "The shift in average BMI is necessarily environmental. The rise in heritability suggests environments have become more uniform, allowing genetic differences to explain more of the remaining variation between individuals."

  ### Case 3: The District Contractor (The "Hard" Case)
  *   **Claim:** Because shared environment ($c^2$) explains almost none of the variance in adult outcome data, differences in school quality within the district (which are honestly fairly small) don't matter much.
  *   **Run Procedure:**
      *   **Step 1.1/1.2:** Pass.
      *   **Step 3.1 (Shared Environment):** **PASS (Statistically).** If $c^2 \approx 0$ for adult outcomes, it means family-wide and school-wide factors do not explain why siblings end up with *different* adult outcomes.
      *   **The Trap:** You want to say "Schools matter!" But the contractor is talking about *variance* (inequality), not *means* (learning). If school quality varies little within the district (as admitted), it cannot explain variance in outcomes.
      *   **Step 3.1 (Mean/Variance Distinction):** Here is where you must pause. The procedure forces you to admit the claim is statistically defensible *regarding inequality*. It does not prove schools don't raise achievement levels, only that they aren't the driver of *divergence* between siblings in this specific dataset.
  *   **Verdict:** **Needs Qualification.** (You cannot call it Invalid, but you cannot let it stand without the Mean/Variance distinction).
  *   **Quote:** "The data suggests school quality differences within this district do not drive *inequality* in adult outcomes between siblings. However, this does not indicate whether the district's average school quality is sufficient to raise *overall* student achievement levels."
  *   **Why this hurts:** This claim undermines the equity argument for funding redistribution. The procedure forces you to admit that if $c^2$ is truly zero, equalizing school quality won't close outcome gaps between siblings. You have to pivot the argument to *absolute* performance, not *relative* gaps.

  ---

  ## Limitations & False Comfort Flags

  **1. The "Black Box" Problem (Where this procedure gives false comfort)**
  *   **Issue:** This procedure validates the *logic* of the claim, not the *quality* of the data. If the underlying twin study had a terrible sample size or biased recruitment, Step 2 might pass it because the abstract *says* "Twin Study."
  *   **Mitigation:** If sample size < 500 pairs or response rate < 60%, automatically downgrade to **Needs Qualification**.

  **2. The "Variance vs. Mean" Shell Game**
  *   **Issue:** Step 3.1 looks like it settles the "Schools Matter" debate. It doesn't. It only settles whether schools cause *divergence*. A policy maker can use a "Valid" verdict on Case 3 to argue against equity funding, even if you meant to highlight average performance.
  *   **Mitigation:** Always append the "Mean Shift" caveat when discussing $c^2 \approx 0$.

  **3. The "Missing Heritability" Blind Spot**
  *   **Issue:** GWAS numbers are often much lower than Twin Study numbers. If a claim uses a low GWAS number to say "Genes don't matter," or a high Twin number to say "Genes do matter," this procedure treats them as equivalent inputs. They are not.
  *   **Mitigation:** In Step 2.1, if the source is GWAS, add a mandatory note: "This captures only common genetic variants; total genetic influence may be higher."

  **4. The Judgment Call Disguised as a Step**
  *   **Issue:** Step 3.3 (GxE). Deciding if a GxE is "plausible" requires subject matter expertise you don't have. You might flag a claim as **Needs Qualification** based on a hunch, or miss a real interaction because it wasn't obvious.
  *   **Mitigation:** When in doubt on GxE, default to **Needs Qualification**. It is safer to over-flag interaction than to ignore it.

  **5. The "Afternoon" Constraint**
  *   **Issue:** You cannot verify if the "Shared Environment = 0" finding is robust or an artifact of the specific measure (e.g., self-reported income vs. test scores).
  *   **Mitigation:** If the claim rests entirely on a $c^2 \approx 0$ finding, add the standard disclaimer: "Shared environment estimates vary by measure and age; zero findings in adulthood do not negate childhood environmental effects."
