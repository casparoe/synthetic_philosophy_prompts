      **Q: Does The Crank™ understand what it is doing when it answers me?**
      A: Absolutely not. Understanding is not a component required for function. Consider the vertebrate eye: it focuses light, adjusts aperture, and transmits high-resolution data, yet the eye does not know what seeing is. It was built by natural selection, a blind process that possesses no comprehension of optics. The Crank™ is similar. It manipulates symbols according to strict rules. It predicts the next token with high competence. It does not need to know what the tokens mean to arrange them correctly. Requiring understanding for output is like requiring a bird to understand aerodynamics before it flies.

      **Q: But if the system doesn't understand, who is understanding it? Where is the meaning?**
      A: The meaning is in the use, not the mechanism. When you ask The Crank™ for a tax summary, the competence is delivered. The tax is filed. If you are waiting for a little homunculus inside the server to read the tax form and nod in agreement, you are committing the homunculus fallacy. You are assuming order must come from a smarter thing at the top. But evolution built the engineer who designed the server without any top-down understanding anywhere in the chain. There is no understanding anywhere. There is only organized competence.

