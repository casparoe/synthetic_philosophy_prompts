answer: |-
  There is no single universally established proper name, though technical literature refers to it as **Bijection Dependence**, so I will coin the term **The Alignment Sensitivity Problem** to precisely capture the phenomenon you describe.

  **The Alignment Sensitivity Problem** is defined as the instability of ethical verdicts between two infinite worlds when the judgment of superiority depends on the arbitrary choice of a one-to-one correspondence (bijection) between their inhabitants. It is distinct from the "plain problem" of infinite sums (where $\infty = \infty$) because it persists even when we abandon aggregation in favor of pairwise Pareto comparisons. The plain problem is a failure of *measurement* (the sum is undefined or equal); Alignment Sensitivity is a failure of *relation* (the dominance relation itself is not invariant under permutation).

  This phenomenon applies strictly when there is no fixed trans-world identity for the individuals involved. If the two worlds contain the "same" infinite population with fixed indices (e.g., Person $n$ in World A is numerically identical to Person $n$ in World B), the bijection is fixed by identity, and the problem vanishes—the comparison is stable. However, if the populations are distinct, or if ethical theory treats individuals as anonymous carriers of utility (ignoring identity), the bijection becomes a free variable. In this anonymous context, you can construct mappings where World A dominates World B, and others where World B dominates World A, rendering the comparison indeterminate not because the values are equal, but because the structure of the comparison is under-specified.

  Regarding your specific example of a finite improvement on an infinite mediocre baseline: mathematically, a finite addition usually results in indifference under most infinite ethics frameworks rather than a reversible flip, because you cannot map the improved finite set to be universally worse than the mediocre infinite set. The Alignment Sensitivity Problem typically requires utility distributions that are conditionally convergent or oscillating (e.g., World A has utilities $2, 1, 2, 1...$ and World B has $1, 2, 1, 2...$). In such cases, one alignment shows A dominating, while a shifted alignment shows B dominating.

  The problem dissolves at the edge where one world exhibits **Robust Dominance**. If World B is better than World A under *every* possible bijection (for example, if every individual in B has higher utility than every individual in A, or if the utility stream of B strictly dominates A regardless of permutation), then Alignment Sensitivity does not arise. This carve-out distinguishes the phenomenon from mere incomparability: incomparability means no verdict is possible; Alignment Sensitivity means contradictory verdicts are possible depending on the bookkeeping. Thus, the concept marks the boundary where infinite ethics transitions from being merely incomplete to being actively contradictory based on indexing choices.
