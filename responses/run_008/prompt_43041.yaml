answer: |-
  Here is the case you need to make.

  The core of your argument is that the "repugnance" in the Repugnant Conclusion is a cognitive illusion caused by framing effects, not a genuine moral insight. Your housemate is treating a bug in human psychology as a feature of moral reality. You need to show that once you strip away the misleading frame, the conclusion loses its sting, and that Total Utilitarianism (Totalism) is actually the more robust view when intuitions become unreliable.

  **The Argument: Framing vs. Reality**

  Start by isolating the intuition. The Repugnant Conclusion feels wrong because we instinctively view the choice as an *addition* to an existing world. When you describe the scenario as "taking a world of happy people and adding trillions of barely-happy people," our brains trigger scarcity alarms. We perceive the new people as diluting the value of the existing ones, or we feel a status-quo bias where the original happy people are the "owners" of the world and the new masses are intruders lowering the average quality. This is the "Addition Frame."

  However, moral ontology doesn't care about additions; it cares about states of affairs. When you switch to the "Complete History Frame"—asking someone to choose between two distinct universes from the void, Universe A (small, happy) and Universe B (vast, barely-happy)—the intuition wavers. In this frame, there is no status quo to violate, no dilution of existing rights, and no one being harmed by the existence of the others. There is just Amount of Good X vs. Amount of Good Y. If Good Y is larger than Good X, and value is additive, B is better.

  Your point is this: If a moral intuition flips based on whether the scenario is described as an addition or a complete history, that intuition is tracking linguistic framing, not moral truth. You cannot build a reductio ad absurdum on an intuition that is known to be framing-sensitive. A reductio requires a contradiction with a *stable* truth. If the "repugnance" disappears when the frame is corrected, the repugnance was never about the outcome; it was about the description. Therefore, the Repugnant Conclusion is not a logical failure of Totalism; it is a psychological failure of the observer.

  **Handling the "Cuts Both Ways" Objection**

  This is where your housemate will try to trap you. She will argue that if framing effects poison the anti-Totalist intuition, they also poison the pro-Totalist intuition. If we can't trust our gut that "adding lives is bad," why trust our gut that "more total welfare is good"? If all population intuitions are unreliable, she wins by default because her view (Person-Affecting or Critical-Level) aligns better with the *average* intuitive response, even if those responses are messy.

  Here is your honest counter: Skepticism about intuitions favors Totalism, not her view.

  Person-Affecting views and Critical-Level views are complex. They rely on multiple specific intuitions holding simultaneously: that benefiting existing people matters, that creating happy people is neutral, that creating sad people is bad, and that there is a threshold where life becomes worth living. Each of these is a separate intuitive claim. If framing effects undermine the reliability of population intuitions generally, the view that requires *more* intuitive moving parts is more likely to break. Totalism is the "null hypothesis" of axiology: it applies the same rule (maximize welfare) regardless of population size. It requires fewer distinct intuitions to function.

  Furthermore, the "more welfare is better" intuition is structural, whereas the "repugnance" intuition is content-specific. The idea that "good things sum up" is akin to a logical or mathematical principle that holds across frames. The idea that "a world of barely-happy masses is worse" is a specific content judgment that fluctuates. If we must choose between a stable structural principle and a fluctuating content judgment under conditions of uncertainty, rationality dictates we keep the structure.

  So, if framing sensitivity leads to intuition skepticism, Totalism survives better because it is simpler and requires fewer arbitrary distinctions (like the asymmetry between creating happy vs. sad people). Your housemate's view needs those distinctions to avoid the Repugnant Conclusion, but those distinctions are *also* vulnerable to framing attacks (e.g., the Non-Identity Problem). Totalism bites one bullet (the Repugnant Conclusion) to avoid a cascade of inconsistencies.

  **The Close**

  Conclude by arguing that biting the bullet is the rational cost of consistency. The Repugnant Conclusion is only repugnant because our brains evolved to manage small tribes, not vast populations. We are cognitively equipped to care about average quality in a fixed group, not total sum across possible beings. Recognizing this limitation doesn't make Totalism false; it makes our disgust outdated. Once you accept that moral truth might diverge from evolved instinct, the conclusion stops being repugnant and starts being just arithmetic.

  Verdict: The argument really works to disarm the reductio ad absurdum by exposing the intuition's instability, but it succeeds by shifting the burden to abstract consistency rather than resolving the underlying moral discomfort.
