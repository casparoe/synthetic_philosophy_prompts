          *   *Reputation:* The Ops Manager is right. In non-profits, trust is currency. Abandoning a project damages future fundraising more than the $700k cost.
      *   **The Independent Estimate:** Reject it. $25k cost + losing $300k grant = $325k loss. Not worth the delay.
      *   **The Condition/Safeguard:** To avoid the *actual* Dollar Auction, we need a hard stop. We commit to the $700k + $300k grant. If costs rise again, we reassess. We need a Guaranteed Maximum Price (GMP) from the contractor.
