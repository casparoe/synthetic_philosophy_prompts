answer: |-
  ### The Case of the Billiard Balls

  Consider a standard game of pool played on a perfectly flat table. **Theory Contact** holds that the balls are solid spheres with impenetrable surfaces; when they collide, their surfaces meet exactly (distance = 0), exchanging momentum through direct physical touch. **Theory Field** holds that the balls are centres of repulsive force surrounded by empty space; when they 'collide', they never touch but approach until a short-range repulsive field reverses their velocity. Both theories utilise identical mathematical laws to predict the trajectories, speeds, spin, and auditory 'clack' of the balls. In Theory Field, the force profile is precisely calibrated such that the deceleration and acceleration mimic the hardness of solid contact perfectly. Within the domain of the game—and indeed, any mechanical measurement involving position, time, or force—the two accounts yield indistinguishable results.

  ***

  ### Walkthrough

  **(a) The Argument for Empirical Equivalence**
  The equivalence is not stipulated by a rider (e.g., "Theory Field predicts exactly what Theory Contact predicts") but arises from the functional structure of the force law in Theory Field. In classical mechanics, 'contact' is never observed directly; we observe changes in position over time ($\Delta x/\Delta t$). Theory Contact posits a discontinuity in velocity at $t_c$ where gap $g=0$. Theory Field posits a continuous but extremely steep velocity curve where $g \to \epsilon$. If the repulsive potential in Theory Field is defined as $V(r) = k/r^n$ (where $n$ is sufficiently large), the resulting trajectory converges uniformly with the hard-sphere model of Theory Contact. Since all observational data in this domain reduces to positions and times (including the compression of air causing sound), and both theories map these inputs to identical outputs via their respective mechanisms, no observation—actual or idealised within the mechanical domain—can favour one over the other. To distinguish them, one would need to measure the gap size $g$ directly, but any probe introduced to measure $g$ would itself be subject to either Contact or Field mechanics, regressing the problem rather than solving it.

  **(b) Conflicting Theoretical Virtues**
  Here the usual tie-breakers fracture. **Theory Contact** wins on **simplicity** and **conservatism**. It posits fewer types of entities (solid objects rather than objects plus invisible fields) and aligns with naive realism—our everyday intuition tells us solid things touch. It requires no explanation for why the field exists only at microscopic distances. However, **Theory Field** wins on **unification** and **causal homogeneity**. In physics, 'contact' is often viewed as a problematic exception—a magical moment where forces become infinite. Theory Field unifies collisions with other interactions (like magnetism or gravity), treating all motion changes as the result of fields acting over a distance. Thus, Contact is ontologically leaner, while Field is theoretically more cohesive. One cannot maximise both intuitive simplicity and theoretical unity simultaneously.

  **(c) Rational Preference and Constructive Empiricism**
  If one judges **conservatism** (fit with prior belief) as the dominant virtue, Theory Contact is rationally preferable. However, if this feature is deleted—if we imagine a community of scientists who find 'action at a distance' more intuitive than 'hard solidity'—the preference flips to Theory Field. This demonstrates that the choice is not dictated by evidence but by weighting conflicting virtues. A **Constructive Empiricist** (following van Fraassen) would refuse to choose between them regarding truth. For them, the aim of science is *empirical adequacy*, not truth about unobservables. Since both theories save the phenomena equally well, the empiricist accepts both as adequate tools for prediction but suspends belief on whether the balls actually touch or merely hover. They do not have to choose; the underdetermination shows that belief in the underlying ontology is optional, not rational necessity.

