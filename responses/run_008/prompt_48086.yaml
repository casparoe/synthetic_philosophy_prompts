  ### Honesty Clause: Specifications Bent

  I must acknowledge a tension with the constraint regarding **"every possible observation"**. In a strict sense, modern physics (scattering experiments) can distinguish between hard-sphere potentials and force-field potentials at sub-atomic scales. To maintain equivalence across *all* possible observations, the thought experiment requires us to treat the billiard balls as fundamental particles within the context of the scenario, or assume the force law in Theory Field is constructed to match Contact at all scales indefinitely. This slightly bends the **"everyday domain"** constraint, as maintaining global equivalence usually requires the theories to be comprehensive physical accounts rather than mere heuristics for a game. However, this bend is necessary because true global underdetermination without sceptical tricks (demons/brains) is virtually impossible in macroscopic domains unless the theories are elevated to fundamental accounts of matter. The case remains grounded in the everyday *activity* of pool, even if the theories themselves must be robust enough to withstand scientific scrutiny to meet the "ideal evidence" spec.
