prompt: |-
  A working group in my department is drafting standards for how to interpret failed replications, and at our last meeting a colleague shut down discussion of a string of null results with the old slogan that absence of evidence is not evidence of absence. As far as I could tell, her point was that the failures told us nothing about whether the original findings were real. It struck me afterward that this one sentence is being asked to do a great deal of work while remaining perfectly ambiguous, and I would like to know exactly what it commits us to before the group endorses it in any report.

  Please lay out, as a menu rather than a verdict, the distinct precise claims the slogan could be expressing. For instance, it might be a purely logical point that failure to prove a hypothesis is not proof of its negation; a frequentist point that a failure to reject a null hypothesis is not confirmation of the null, and that non-significance reflects absence of evidence only under low power; a Bayesian point about when missing evidence is genuinely uninformative rather than diagnostic of absence, which would seem to make the slogan false in general and true only when the evidence we failed to obtain would have been just as likely whether or not the effect is real; a point about the balance of evidence versus its weight; or something further still, such as a caution about treating unfalsifiability as a merit. For each reading, say whether it is a platitude, a substantive and defensible claim, or simply false.

  Then address the question that actually matters for our working group: on which of those readings, if any, does the slogan support dismissing a well-powered failed replication as saying nothing about the original effect? I want you to be especially explicit about the unstated assumption doing the work here — an assumption about what we should have expected to observe if the effect were real, and about detectability and statistical power — and about whether the slogan, so used, is symmetric in a way its users would find uncomfortable: if absence of evidence can never count as evidence of absence, what, in their view, ever could count as evidence against an effect, and does that commitment make the original findings effectively insulated from replication failure in a way the rest of us should refuse to accept in a replication standard?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A working group is drafting standards for interpreting failed replications.
      *   **Problem:** A colleague used the slogan "absence of evidence is not evidence of absence" to shut down discussion of null results, implying failures tell us nothing about the original findings.
      *   **Task 1:** Lay out distinct precise claims the slogan could express (as a menu, not a verdict).
      *   **Task 2:** For each claim, categorize it (platitude, substantive/defensible, or false).
      *   **Task 3:** Address the core question: On which reading does the slogan support dismissing a *well-powered* failed replication?
      *   **Task 4:** Be explicit about the unstated assumptions (expectations, detectability, power).
      *   **Task 5:** Analyze symmetry/insulation implications (if absence of evidence never counts, what does? Does this insulate original findings?).
      *   **Tone:** Analytical, precise, philosophical but grounded in statistics/methodology, neutral (menu style).

  2.  **Deconstruct the Slogan ("Absence of Evidence is Not Evidence of Absence"):**
      *   *Literal/Logical:* $\neg P \nvdash \neg Q$. Just because I didn't see it doesn't mean it's not there.
      *   *Frequentist:* $p > \alpha \nvdash H_0$. Failure to reject null $\neq$ accepting null.
      *   *Bayesian:* $P(D|H_1) \approx P(D|H_0)$. If the data is equally likely under both, the likelihood ratio is 1 (uninformative). But if $P(D|H_1)$ should have been high and wasn't, it *is* evidence of absence.
      *   *Epistemic/Pragmatic:* Don't confuse "we haven't looked" with "we looked and didn't find."
      *   *Legal/Forensic:* Lack of proof isn't proof of innocence (but might be depending on the search).

  3.  **Drafting the Menu of Claims (Task 1 & 2):**

      *   *Claim 1: The Logical Tautology.* "The proposition 'X exists' has not been proven true; therefore, the proposition 'X exists' is not proven false."
          *   *Status:* Platitude/True. Logical asymmetry of verification/falsification (sort of).
      *   *Claim 2: The Frequentist NHST Warning.* "A non-significant p-value ($p > .05$) does not justify accepting the null hypothesis ($H_0$) as true."
          *   *Status:* Substantive/Defensible (standard stats teaching).
      *   *Claim 3: The Low-Power Caveat.* "If a study has low statistical power, a null result provides little to no evidence against the alternative hypothesis."
          *   *Status:* Substantive/True.
      *   *Claim 4: The Bayesian Likelihood Ratio.* "Data $D$ is only evidence of absence if $P(D|H_{effect}) \ll P(D|H_{null})$. If the study was insensitive, $P(D|H_{effect}) \approx P(D|H_{null})$, so the null result is uninformative."
          *   *Status:* Substantive/True (but implies the slogan is false when power is high).
      *   *Claim 5: The Search Effort Distinction.* "Not looking for evidence is not the same as looking and not finding it."
          *   *Status:* Platitude.
      *   *Claim 6: The Universal Immunity.* "No amount of failed detection can ever constitute positive evidence that an effect does not exist."
          *   *Status:* False. (Contradicts scientific practice).

  4.  **Addressing the Core Question: Dismissing Well-Powered Replications (Task 3 & 4):**
      *   The colleague wants to dismiss *well-powered* failures.
      *   Which reading supports this?
      *   Reading 1 (Logical): Doesn't help. Logic allows falsification.
      *   Reading 2 (Frequentist): Technically true (can't *prove* null), but practically misleading. High power makes non-significance strong evidence *against* the effect size of interest.
      *   Reading 3 (Low Power): Contradicted by the premise (the replication is *well-powered*).
      *   Reading 6 (Universal Immunity): This is the only one that supports dismissal, but it's false.
      *   *Unstated Assumption:* The assumption must be that *any* failure to reach significance is structurally identical to a low-power failure, OR that the burden of proof is infinitely high (verificationism). It assumes that $H_1$ is unfalsifiable by design.
      *   *Detectability:* It assumes that even with high power, the signal might be hiding in noise in a way that precludes inference.

  5.  **Analyzing Symmetry and Insulation (Task 5):**
      *   *Symmetry:* If "absence of evidence $\neq$ evidence of absence," does "presence of evidence = evidence of presence"? Usually, yes. But if the standard is asymmetrical, it protects the original finding.
      *   *Insulation:* If null results *never* count against a theory, the theory is non-falsifiable. This is unscientific.
      *   *Comfort Check:* Would the colleague accept that a massive successful replication *is* evidence of presence? Probably. But if they reject the inverse, they break the likelihood principle.
      *   *Conclusion:* Using the slogan to dismiss well-powered replications effectively immunizes the original finding from empirical refutation.

  6.  **Refining and Polishing:**
      *   Ensure the tone is appropriate for a working group report context (formal, precise).
      *   Make sure the distinction between "evidence" (Bayesian likelihood) and "proof" (Logical certainty) is clear.
      *   Highlight the specific danger of the "Universal Immunity" reading.
      *   Check against the prompt's specific request for "unstated assumptions" about detectability.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe I should say the slogan is just wrong.
      *   *Correction:* No, the prompt asks for a menu of interpretations. I need to show *where* it works and *where* it fails.
      *   *Focus:* Make sure to hit the "well-powered" aspect hard. That's the crux of the colleague's misuse.
      *   *Clarification:* Distinguish between "evidence of absence" (Bayesian update) and "proof of absence" (Logical certainty). The slogan conflates these.

  8.  **Final Structure:**
      *   Introduction: Acknowledge the ambiguity.
      *   Section 1: The Menu of Claims (Logical, Frequentist, Power-Specific, Bayesian, Universal).
      *   Section 2: Application to Well-Powered Replications (Identifying the specific reading required).
      *   Section 3: The Unstated Assumptions (Power, Falsifiability).
      *   Section 4: Symmetry and Insulation (The consequence for standards).
      *   Conclusion: Summary for the working group.

  9.  (Drafting content based on the above structure...) *Ensure specific attention to the phrase "absence of evidence" meaning "null result" vs "no study done".* *Ensure the distinction between $H_0$ (effect=0) and $H_1$ (effect>0) is clear.* *Make sure to mention the Likelihood Ratio.*

  10. *Final Polish:* Check against the prompt's requirement: "For each reading, say whether it is a platitude, a substantive and defensible claim, or simply false." *Okay, I will label them explicitly.*

  11. *Final Polish:* Check against "explicit about the unstated assumption doing the work here." *I need to dedicate a specific paragraph to this.*

  12. *Final Polish:* Check against "symmetric in a way its users would find uncomfortable." *I need to spell out the asymmetry problem.*

