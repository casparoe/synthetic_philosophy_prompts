answer: |-
  Here is a breakdown of the distinct claims embedded in the slogan "absence of evidence is not evidence of absence," categorized by their theoretical framework and validity. This menu is designed to help your working group isolate exactly which version of the claim is being invoked and whether it warrants inclusion in your standards.

  ### Part I: A Menu of Interpretations

  **1. The Logical Tautology**
  *   **The Claim:** The fact that a proposition ($H_1$: the effect exists) has not been proven true does not logically entail that its negation ($H_0$: the effect does not exist) is proven true. Verification and falsification are not perfectly symmetric operations in deductive logic.
  *   **Status:** **Platitude.** It is formally true that failure to verify is not identical to verification of failure. However, inductive science rarely deals in deductive proof, so this offers little guidance on how to weigh probabilistic evidence.

  **2. The Frequentist NHST Warning**
  *   **The Claim:** A non-significant result ($p > \alpha$) in Null Hypothesis Significance Testing does not justify "accepting" the null hypothesis as true. It merely indicates a failure to reject the null.
  *   **Status:** **Substantive and Defensible.** This is standard statistical pedagogy. A $p$-value is the probability of the data given the null, not the probability of the null given the data. However, this claim is about *decision rules* (reject/retain), not about the *weight of evidence* contained in the data.

  **3. The Low-Power Caveat**
  *   **The Claim:** If a study has low statistical power (a low probability of detecting the effect if it exists), a null result is uninformative. In this specific context, the absence of a significant finding is not evidence that the effect is absent, because the study was unlikely to find it even if it were there.
  *   **Status:** **Substantive and Defensible.** This is the most scientifically useful reading. It ties the informativeness of a null result directly to the sensitivity of the measurement instrument or design.

  **4. The Bayesian Likelihood Ratio**
  *   **The Claim:** Data counts as evidence of absence only if the data is much more likely under the null hypothesis than under the alternative hypothesis ($P(Data|H_0) \gg P(Data|H_1)$). If the study design is such that the data would look the same regardless of whether the effect exists, the likelihood ratio is near 1, and the "absence of evidence" (null result) is indeed not "evidence of absence."
  *   **Status:** **Substantive and Defensible (but conditional).** This makes the slogan false in general. Under Bayesian updating, a null result from a high-precision study *is* evidence of absence because it lowers the posterior probability of the effect. The slogan is only true here when the study is insensitive.

  **5. The Search Effort Distinction**
  *   **The Claim:** "We have not looked for evidence" is not the same as "We looked and found nothing."
  *   **Status:** **Platitude.** This warns against inferring absence from a lack of investigation. It is irrelevant to replication contexts where a search (the replication study) has explicitly occurred.

  **6. The Universal Immunity Claim**
  *   **The Claim:** No empirical failure to detect an effect can ever constitute positive evidence that the effect does not exist. The hypothesis is insulated from disconfirmation by null results.
  *   **Status:** **Simply False.** This contradicts the basic principle of falsifiability. If this were true, no scientific hypothesis about the existence of an effect could ever be rejected via experimentation.

  ---

  ### Part II: Application to Well-Powered Replications

  Your colleague is using the slogan to dismiss a **well-powered failed replication**. To support this move, they cannot be relying on Readings 1, 2, 3, 4, or 5.

  *   Readings 1 and 5 are irrelevant to the weight of data from a completed study.
  *   Reading 2 is about binary decision thresholds, not the evidential value of the result.
  *   Readings 3 and 4 explicitly concede that if power is high (or the likelihood ratio favors the null), a null result *is* evidence of absence.
  *   Therefore, to dismiss a well-powered replication, your colleague must be implicitly relying on **Reading 6 (Universal Immunity)**.

  They are treating the original finding as a claim that is structurally immune to disconfirmation by null results. For the slogan to do the work they want it to do in this context, it must be interpreted as a rule that prevents null results from ever updating our belief against the original effect.

  #### The Unstated Assumption
  For this usage to hold water, the following assumption must be doing the heavy lifting:

  > **Assumption:** *Even in a well-powered study, the probability of observing a null result is roughly equal whether the effect is real or not ($P(Null|Effect) \approx P(Null|No Effect)$).*

  This assumption implies that the effect is either **undetectable in principle** (mystical) or **highly unstable** (context-dependent to the point of unpredictability). If the effect were real and robust, a well-powered replication *should* have produced a significant result. By asserting that the failure tells us "nothing," your colleague is assuming that the original effect does not generate a predictable signal even under ideal conditions. This effectively redefines the original finding from "Effect X exists" to "Effect X exists but may never manifest in data."

  ---

  ### Part III: Symmetry and Insulation

  You asked whether this commitment is symmetric and whether it insulates the original findings. The answer is yes on both counts, and this should be a primary concern for your working group.

  **1. The Symmetry Problem**
  If your group endorses the slogan under Reading 6 (that null results never count against an effect), you break the symmetry of inference.
  *   **If Positive:** Presumably, your colleague would accept a significant replication as evidence *for* the effect.
  *   **If Negative:** They are arguing a null replication is *not* evidence *against* the effect.
  *   **The Imbalance:** This creates a one-way ratchet. Evidence can accumulate in favor of the theory, but no amount of counter-evidence can accumulate against it. In likelihood terms, this asserts that $P(Data|H_1)$ can be high enough to confirm $H_1$, but $P(Data|H_0)$ can never be high enough to disconfirm $H_1$. This violates the Likelihood Principle.

  **2. The Insulation Problem**
  Adopting this standard effectively renders the original finding **unfalsifiable**.
  *   If a well-powered failure is "not evidence of absence," then what would be?
  *   If the answer is "nothing," the claim is non-scientific.
  *   If the answer is "a meta-analysis of 50 failures," then the slogan is being misapplied to a single study.
  *   If the answer is "a study with even higher power," you invite an infinite regress where the proponent of the original effect can always demand more power before conceding the point.

  **3. Recommendation for the Working Group**
  If your group endorses the slogan without qualification, you risk codifying a standard that protects original findings from empirical refutation. A more precise standard for your report would be:

  > *"A null result constitutes evidence of absence only to the degree that the study had sufficient power and sensitivity to detect the effect if it existed. In well-powered replications, a failure to find the effect is substantive evidence against the robustness or existence of the original finding."*

  This retains the valid insight of the slogan (don't trust under-powered nulls) without accepting the false universal claim (nulls never count) that your colleague is attempting to leverage.
