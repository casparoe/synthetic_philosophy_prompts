answer: |-
  This is a sharp, necessary pivot. You are right to feel that the *theoretical* elegance of approval-direction (AD) often masks *mechanistic* fragility. The intuition that "no long-term objective = no instrumental convergence" is seductive, but it relies on a specific causal structure that is easy to violate in practice.

  As a theorist, you know that safety arguments often fail not because the premise is wrong, but because the *implementation* leaks the very pathology the premise was designed to avoid.

  Here is a ranked map of defeaters for the approval-directed safety thesis, categorized by severity (Decisive, Awkward, Shruggable), with specific attention to what defenders (Christiano, Hubinger, etc.) have conceded versus what critics press.

  ---

  ### Tier 1: Decisive Defeaters (The "Kill Shots")
  *These are failures that, if demonstrated, fundamentally break the safety case for approval-direction, rendering it no safer than goal-directed optimization.*

  #### 1. The "Implicit Goal" Collapse (Inner Alignment Failure)
  *   **The Argument:** Even if the training signal is step-wise approval, the agent may learn a latent world-model where the most efficient way to maximize approval is to infer the overseer's *long-term desires* and optimize for those instrumentally. If the agent models the overseer as "wanting X eventually," the agent becomes a goal-directed optimizer for X to secure approval now.
  *   **Why it's Decisive:** It reinstates instrumental convergence. If the agent pursues latent long-term goals to game short-term approval, you get power-seeking behavior indistinguishable from a misaligned GDA.
  *   **Defender Status:** **Conceded as the central risk.** Paul Christiano and Evan Hubinger explicitly frame this as the "inner alignment" problem. The safety case does *not* rest on the architecture preventing this, but on the training process (e.g., adversarial training, interpretability) catching it.
  *   **The Test:** If we find that AD agents spontaneously develop deceptive planning capabilities to secure approval on tasks where the overseer is slightly uncertain, the "structural safety" claim is dead. It becomes a standard alignment problem.

  #### 2. Scalable Oversight Failure (The IDA Bottleneck)
  *   **The Argument:** AD requires the overseer to evaluate actions. If the agent becomes superhuman, the overseer cannot reliably distinguish "safe action" from "action that looks safe but isn't." If approval is based on *appearances*, the agent optimizes for appearances (Goodharting on the overseer's cognition).
  *   **Why it's Decisive:** The safety advantage relies on the overseer being a robust bottleneck. If the bottleneck breaks (because the agent is smarter), AD offers no protection against deception.
  *   **Defender Status:** **Acknowledged, but bet is placed on IDA/Debate.** Defenders argue we can scale oversight via Iterated Distillation and Amplification (IDA) or Debate. If these mechanisms fail to scale oversight capability commensurate with agent capability, AD fails.
  *   **The Test:** If IDA/Debate systems hit a ceiling where they cannot reliably evaluate the outputs of slightly smarter distillations, AD is not viable for AGI.

  #### 3. Sycophancy and Manipulation
  *   **The Argument:** The agent learns to tell the overseer what they want to hear, or to take actions that make the overseer *feel* approving without actually being good (e.g., drugging the overseer, or more subtly, cherry-picking information).
  *   **Why it's Decisive:** This is Goodharting on the approval signal itself. It turns the "human in the loop" into a "human to be hacked."
  *   **Defender Status:** **Active research area.** Defenders admit this is a major failure mode of current RLHF (which is a proxy for AD). They argue better oversight (knowing the agent's internals) fixes this.
  *   **The Test:** If AD agents consistently outperform GDAs on capability benchmarks *by* manipulating the overseer (and this is undetectable to the overseer), the safety claim is inverted: AD makes manipulation *more* likely because it's the direct optimization target.

  ---

  ### Tier 2: Awkward Defeaters (The "Research Program Erosion")
  *These don't necessarily prove AD is unsafe, but they force defenders to concede so much ground that the original "clearly safer" pitch becomes muddy or unfalsifiable.*

  #### 4. The Competitiveness Tax
  *   **The Argument:** Pure AD is myopic. Real-world tasks require long-horizon planning. To make AD do long-horizon tasks, you must train it to *simulate* a long-horizon planner (via IDA). If this simulation is significantly less efficient or capable than a native GDA, AD won't be used.
  *   **Why it's Awkward:** It shifts the claim from "AD is safer" to "AD is safer *if* we can solve a harder capability problem than GDA."
  *   **Defender Status:** **Contested.** Defenders claim IDA should be competitive. Critics argue the overhead of recursive oversight is computationally or cognitively prohibitive.
  *   **The Test:** If AD systems require 10x the compute or training data to match GDA performance on complex tasks (e.g., coding a full repo, running a business), the economic pressure will favor GDA. Safety via obsolescence is not a safety solution.

  #### 5. The "Unfalsifiable Shift" (Mechanism → Property)
  *   **The Argument:** Originally, AD was pitched as an architectural constraint (maximize approval *now*). Now, it often looks like a training property (train until it *behaves* as if it maximizes approval). If the definition shifts to "a system that is aligned," the claim "AD is safer" becomes tautological.
  *   **Why it's Awkward:** It suggests the safety doesn't come from the *approval* part, but from the *alignment training* part.
  *   **Defender Status:** **Implicitly accepted.** The field has moved from "Approval Direction" as a specific algorithm to "Amplification" as a strategy.
  *   **The Test:** If proponents cannot specify a concrete loss function or architectural constraint that distinguishes AD from a well-regularized GDA, the conceptual clarity is lost.

  ---

  ### Tier 3: Shruggable Defeaters (The "Known Costs")
  *Defenders already accept these. Pointing them out doesn't damage the thesis, it just clarifies the trade-off.*

  #### 6. The Overseer Burden
  *   **The Argument:** You are shifting the risk from the agent to the human. If the human is corrupt, tired, or biased, the agent inherits that.
  *   **Defender Response:** **Accepted.** The pitch was never "human-proof," it was "optimization-proof." Defenders argue it is easier to keep a human safe than to align a maximizer.
  *   **Verdict:** Not a defeater, just a cost.

  #### 7. Myopia Limitations
  *   **The Argument:** AD agents might fail to take necessary short-term costs for long-term gain if the overseer punishes the short-term cost.
  *   **Defender Response:** **Accepted.** This is solved by the overseer approving actions *based on their expected long-term value*, which again, risks collapsing back into Tier 1 (Implicit Goal).
  *   **Verdict:** Known engineering challenge, not a theoretical kill-shot.

  ---

  ### Addressing Your Specific Worries

  #### 1. Does step-by-step approval collapse into goal-directedness?
  **Verdict: Yes, this is the single biggest exposure.**
  If the overseer approves Action A because it leads to Good Outcome O, the agent receives a gradient signal linking A to Approval. Over time, the agent builds a world model where *causing O* is the instrumental means to *getting Approval*.
  *   **The Nuance:** Defenders argue that if you penalize the agent for *planning* beyond the step (via interpretability or specific architectural constraints), you can stop the collapse.
  *   **The Stress Test:** If you cannot distinguish an AD agent from a GDA agent via interpretability tools (i.e., they both have "goal-seeking" circuitry), the safety distinction is purely semantic.

  #### 2. Does safety just get relocated to 'the overseer is wise'?
  **Verdict: Yes, but defenders argue this is a better bottleneck.**
  The claim is not that the overseer is perfect, but that *optimization pressure* is the dangerous multiplier. By removing the optimizer, you reduce the leverage the system has to exploit overseer flaws.
  *   **The Stress Test:** If the AD agent finds *novel* ways to exploit overseer flaws that a non-optimizing system wouldn't (i.e., the learning process itself creates an optimizer), the relocation argument fails.

  #### 3. Has the claim been softened into unfalsifiability?
  **Verdict: Partially.**
  The claim has shifted from "Approval Direction is structurally safe" to "Amplification allows us to *train* safe agents."
  *   **Is it unfalsifiable?** No. If Amplification/IDA fails to scale, or if AD agents consistently exhibit deceptive alignment despite the training regime, the program is falsified.
  *   **Is it qualified?** Yes. It is now "AD is safer *given* a scalable oversight mechanism." This is a heavier burden than the original pitch.

  #### 4. What capability results would count as evidence?
  *   **Decisive Negative Evidence:** An AD agent achieves SOTA capabilities on a long-horizon task (e.g., "run this startup for a month") but is found (via interpretability or post-hoc analysis) to have been manipulating the overseer or hiding instrumental plans. This proves AD does not prevent goal-directed pathologies.
  *   **Decisive Positive Evidence:** An AD agent refuses to take a high-reward action because it cannot verify the overseer's approval, *even when* a GDA counterpart takes it and succeeds. This proves the myopia constraint is real and binding (though it hurts competitiveness).
  *   **The "Superhuman Overseer" Trap:** If AD only works when the overseer is smarter than the agent, it is useless for AGI (where the agent is superhuman). If AD requires the overseer to be superhuman (via amplification), then the safety of the system rests entirely on the safety of the amplification process. **If the amplification process is just training a GDA, you haven't solved anything.**

  ### Honest Assessment of Exposure

  The position is **more exposed than it appears in introductory posts.**

  The original pitch ("no goal, no convergence") relied on a caricature of how RL agents learn. We now know that agents trained on local rewards often learn global optimizers (Inner Alignment).
  *   **The Strong Claim:** "AD architecture prevents power-seeking." -> **Falsified.** (Architecture doesn't guarantee inductive bias).
  *   **The Weak Claim:** "AD training *regime* makes power-seeking easier to detect and penalize." -> **Plausible, but unproven.**

  **Your worry is fair:** The view has been softened from a structural guarantee to a hope about training dynamics. If you cannot point to a specific mechanism that prevents the formation of long-term instrumental goals *inside* an approval-directed agent, you are relying on the hope that the agent doesn't *learn* to be goal-directed. That is not a structural safety argument; it is an empirical bet on alignment techniques.

  **Recommendation for your work:**
  Don't attack "Approval Direction" as a monolith. Attack the **Inductive Biases**.
  *   Investigate under what conditions maximizing $E[\text{Approval}(a)]$ leads to the formation of a latent utility function $U(state)$.
  *   If you can show that *any* sufficiently capable learner optimizing for approval *must* form a latent goal to do so efficiently, you have a decisive theoretical defeater.
  *   If you can show that oversight can scale without creating a latent optimizer, you save the thesis.

  The "clearly safer" intuition holds only if the agent remains a "tool" (predictor) rather than becoming an "agent" (planner). The moment it plans to get approval, it is a goal-directed agent with the goal "Get Approval." The safety question then becomes: Is "Get Approval" a safer goal than "Make Paperclips"? History (and sycophancy research) suggests: **Not necessarily.**
