          *   *Proposal B:* Agent-Based Modelling (Heterogeneous agents, Bounded Rationality, Rules of Thumb, Networks, No imposed equilibrium). Argument: Realism of mechanisms, false assumptions in A undermine policy advice.
      *   **Conflict:** Methodological dispute (Friedman's Instrumentalism vs. Realism/Mechanism-focused critique).
      *   **Constraints/Guidelines:** Funding guidelines require models be 'sound' and assumptions 'appropriate' (undefined).
