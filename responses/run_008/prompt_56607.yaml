answer: |-
  **MEMORANDUM**

  **TO:** Research Council Grants Panel
  **FROM:** [Your Name/Chair's Office]
  **DATE:** 23 October 2023
  **SUBJECT:** Decision Recommendation: Labour-Market Policy Modelling Programme (Proposals A & B)

  **1. Purpose**

  This memo serves to frame the decision required at Thursday's sitting regarding the five-year funding programme for economic policy modelling. We face two competing proposals: Proposal A (Representative-Agent DSGE tradition) and Proposal B (Agent-Based Modelling). The division on this panel is not merely technical but methodological, rehearsing a decades-old dispute regarding the role of assumptions in economic science.

  As our funding guidelines require models to be 'sound' and assumptions 'appropriate' without defining these terms, this memo must provide the philosophical grounding for our decision. My recommendation is to **fund both proposals in a 60:40 proportion, mandated under a single 'Comparative Modelling Consortium' with specific deliverables for cross-validation.**

  This recommendation is not a diplomatic compromise but a risk-management strategy necessitated by the nature of policy advice. Below, I outline the reasoning, the distinction between assumption types, and the justification for this outcome.

  **2. The Methodological Dispute: Instrumentalism vs. Realism**

  The panel is divided between two positions. The first, aligned with Proposal A, draws on Milton Friedman's instrumentalism: a model is a tool, and its assumptions need not be realistic descriptively so long as they yield accurate predictions. The second, aligned with Proposal B, argues that for policy advice, the causal mechanism must be represented correctly; a false assumption in the mechanism renders the advice fragile, regardless of past fit.

  To adjudicate this, we must distinguish between two types of unrealistic assumptions, a distinction our guidelines implicitly require us to make when judging 'appropriateness'.

  *   **Type (i): Negligibility Assumptions (The 'Frictionless Plane').** These simplify a complex reality by ignoring factors deemed second-order for the specific question at hand. Assuming gravity acts on a falling stone without air resistance is useful; it buys tractability without distorting the core mechanism of gravity. In Proposal A, assuming a single representative household is a Type (i) assumption *if* we are asking about aggregate savings rates where distribution matters little.
  *   **Type (ii): Heuristic Assumptions (The 'False Mechanism').** These simplify reality by positing a mechanism that is known to be false in the very domain being studied. Assuming wages clear markets continuously in a labour-market model is a Type (ii) assumption. We know wage stickiness and search frictions are not 'air resistance' to be ignored; they are the 'gravity' of the labour market. If the policy question concerns unemployment insurance or minimum wages, assuming the market clears by definition removes the object of study.

  **3. Evaluation of Predictive Fit vs. Policy Advice**

  Proponents of Proposal A rightly note its track record in tracking aggregate outcomes. However, we must weigh what predictive fit is worth in a model used *prospectively* for advice.

  Past predictive success confirms that a model captures the regularities of the *past* regime. It does not guarantee validity under a *new* policy regime. This is the essence of the Lucas Critique. If Proposal A's fit relies on parameters (such as search effort or wage setting) that are actually composites of deeper behavioural rules, those parameters will shift when policy changes. A model that predicts well historically may fail catastrophically prospectively if its assumptions are Type (ii) falsehoods.

  Therefore, 'soundness' in a policy context cannot rely on historical fit alone. It requires structural integrity. Proposal B offers this integrity but lacks the tractability and established communication protocols of Proposal A.

  **4. Recommendation**

  I recommend the Council **funds both proposals**, structured as follows:

  1.  **Proposal A (60% of budget):** Maintained as the core baseline model for its tractability, comparability with international peers, and utility in short-term forecasting where structural breaks are less likely.
  2.  **Proposal B (40% of budget):** Funded specifically to model structural reforms, distributional effects, and crisis scenarios where heterogeneity and bounded rationality are critical.
  3.  **Mandatory Work Package:** Both teams must collaborate on a 'Stress-Test Report' annually. Proposal B must attempt to replicate Proposal A's baseline results to identify where the representative-agent simplification breaks down. Proposal A must test whether Proposal B's complex dynamics can be reduced to sufficient statistics for policy use.

  **5. Addressing the Panel's Concerns**

  I am aware this recommendation does not declare a total victor. To ensure the reasoning is respected by all sides, I wish to address the strongest arguments of the opposing views directly.

  **To the proponents of Proposal A (The Instrumentalists):**
  Your strongest consideration is that science requires abstraction. Without the simplifications of the representative-agent framework, we cannot generate the clear, communicable counterfactuals that policymakers demand. Agent-based models risk becoming 'black boxes' where any outcome can be generated by tweaking rules.
  *Why this recommendation respects you:* We retain Proposal A as the majority-funded baseline. We acknowledge that for many standard questions, the 'frictionless plane' is sufficient. However, we ask you to acknowledge that for *structural* labour reforms, your assumptions risk crossing from Type (i) to Type (ii). The collaboration requirement protects you from the reputational risk of advising on a policy that fails due to unmodelled heterogeneity.

  **To the proponents of Proposal B (The Realists):**
  Your strongest consideration is that false assumptions yield false confidence. If the mechanism of wage adjustment is modelled incorrectly, the model is not just simple; it is misleading. A model that cannot explain *why* a result occurs is dangerous for long-term strategy.
  *Why this recommendation respects you:* You receive significant funding to demonstrate that realism matters. However, you must accept that 'realism' alone is not a virtue if it sacrifices all predictive discipline. The requirement to replicate Proposal A's baselines ensures you do not retreat into a theoretical elegance that cannot be empirically anchored. You must prove that your added complexity buys added predictive or explanatory power, not just philosophical comfort.

  **6. Conclusion**

  Our guidelines require assumptions to be 'appropriate'. In a five-year programme covering diverse labour-market policies, no single set of assumptions is appropriate for all questions. The 'frictionless plane' is appropriate for some trajectories; the 'fluid dynamics' of agent-based interaction are appropriate for others.

  By funding both, we treat methodological uncertainty as a portfolio risk. We avoid the dogmatism of declaring one methodology 'true', and instead commit the Council to a programme of comparative validation. This ensures that when we advise the government, we know not only what the models predict, but where the models disagree, and crucially, *why*.

  I look forward to finalising this arrangement on Thursday.

  **[Signature]**

  **[Name]**
  **Panel Member**
