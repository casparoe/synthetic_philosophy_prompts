answer: |-
  You've correctly understood the Master Argument's claim that you cannot conceive of an object unconceived. However, you've gone wrong by assuming Berkeley limits perception to *your* finite mind. Berkeley's idealism isn't solipsism. His famous principle is *esse est percipi* (to be is to be perceived), but he argues that objects exist independently of *human* perception because they are constantly perceived by God.

  When you leave the office, your desk doesn't vanish; it continues to exist because God perceives it. Berkeley introduces God to solve exactly the problem you've raised: the continuity of objects when no human is looking. So, objects don't blink in and out of existence based on your attention. Instead, the physical world is a collection of ideas sustained permanently in the divine mind. Your error was ignoring the theological backbone of his metaphysics. He isn't denying the stability of the world, only the existence of mind-independent "matter." The desk existed before you were hired because God perceived it then, too.
