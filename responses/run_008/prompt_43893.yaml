answer: |-
  (1) The Essay Question

  **Final Examination: Consequentialism and Its Critics**
  **Time Allowed: 90 Minutes**

  Bernard Williams's objection to consequentialism is frequently summarized as a single claim: that utilitarianism attacks personal integrity by alienating agents from their ground projects. However, this summary conflates two distinct lines of criticism. The first concerns the *content* of a life lived under utilitarian demands (the loss of grounding projects); the second concerns the *structure* of deliberation required to justify action (the "one thought too many" objection).

  Write an essay that disentangles these two complaints. First, specify precisely what work the notion of "integrity" is doing in Williams's argument—is it a psychological necessity or a conceptual constraint on agency? Second, explain why an indirect or two-level consequentialist can plausibly absorb the first complaint (regarding projects) by cultivating dispositions that maximize utility without constant calculation, and assess whether this rescue is successful. Third, determine whether the "one thought too many" objection is merely the first complaint restated or a distinct objection regarding the order and standing of deliberative reasons.

  To test this distinction, you must construct an **original case study** (not the drowning wife, not Jim and the Indians, not standard examples from the literature) in which one of the two objections applies cleanly while the other does not. Use this case to adjudicate the final question: If we grant the indirect consequentialist full credit for accommodating ground projects, does anything deep in Williams's critique survive?

  ***

  (2) Model Answer

  Williams's integrity objection is often treated as a unified complaint about psychological burnout, but this misreads its structural force. Integrity, for Williams, is not merely moral honesty or consistency; it is the condition of having a life that is distinctly *one's own*, constituted by "ground projects" that provide reasons for action independent of the impartial view. The first complaint is that consequentialism alienates agents from these projects by demanding they be held only tentatively, subject to cancellation by the impartial calculus. The second complaint, exemplified by the husband who calculates before saving his wife, is that requiring impartial justification for partial actions corrupts the deliberative standpoint itself.

  These complaints are distinct, and the indirect consequentialist (IC) can neutralize the first but not the second. The IC argues that utility is maximized not by agents calculating every act, but by agents possessing deep dispositions toward partiality. If I love my family because such love generally produces good outcomes, I am not alienated in practice; I still feel the love. The IC absorbs the alienation objection by separating the criterion of rightness (utility) from the decision procedure (loyalty). Williams might resist this as self-deception, but logically, the IC preserves the *content* of the life lived. The agent keeps their projects.

  However, the "one thought too many" objection targets the *justificatory structure*, not the psychological experience. It claims that certain actions are justified precisely because they flow from partial commitments that require no impartial backing. Here, the IC rescue fails. Even if the IC agent does not calculate consciously, their disposition is ultimately validated by the impartial view. The partiality is instrumentally valuable, not intrinsically justified.

  Consider an original case: A composer abandons a promising career to care for an aging mentor, not because this maximizes global welfare, but because gratitude demands it. An IC can accommodate this: cultivating gratitude dispositions maximizes utility. The composer keeps their project (care) and suffers no alienation. The first objection does not apply. However, if the composer asks, "Is this gratitude justified?" the IC must answer, "Yes, because it pays off socially." The composer might then feel their gratitude was merely a tool for welfare production. The deliberative standpoint has been colonized. The second objection applies cleanly: the reason for acting (gratitude) has been subordinated to a reason that should not govern it (utility).

  Therefore, the two complaints come apart. The alienation complaint is about having a life; the deliberative complaint is about the source of authority for that life. Since the IC can secure the former while leaving the latter vulnerable, the complaints are distinct. The deepest element of Williams's critique survives the indirect consequentialist rescue. It is not that utilitarianism makes us unhappy or projectless; it is that it denies the normative independence of personal reasons. Integrity requires that some reasons stand without impartial endorsement. Consequentialism, even indirectly, cannot grant this without ceasing to be consequentialism. Thus, the "one thought too many" is not about the number of thoughts, but about the illegitimacy of demanding any impartial thought where partial reasons are sovereign.

  ***

  (3) Marking Scheme

  **Total Marks: 20**

  **1. Conception of Integrity (5 Marks)**
  *   **Requirement:** Candidate must define integrity not as moral honesty but as identity-constituting commitment or the source of agent-relative reasons.
  *   **Common Mistake:** Candidates lose marks here by treating integrity as simple consistency between belief and action, missing its role as the source of practical identity.

  **2. The Indirect Consequentialist Rescue (5 Marks)**
  *   **Requirement:** Candidate must explain how indirect consequentialism accommodates ground projects via dispositions and assess why this neutralizes the alienation complaint.
  *   **Common Mistake:** Candidates lose marks here by dismissing indirect consequentialism too quickly without explaining the mechanism (decision procedure vs. criterion) that allows it to absorb the objection.

  **3. Distinguishing the Deliberative Objection (5 Marks)**
  *   **Requirement:** Candidate must argue that the "one thought too many" objection concerns the justificatory structure of deliberation rather than the psychological content of a life.
  *   **Common Mistake:** Candidates lose marks here by treating the "one thought" complaint as merely a psychological variant of the alienation complaint rather than a distinct claim about normative authority.

  **4. Original Case and Final Adjudication (5 Marks)**
  *   **Requirement:** Candidate must provide a novel case study where one objection holds and the other fails, using it to conclude whether Williams's core critique survives.
  *   **Common Mistake:** Candidates lose marks here by reverting to standard examples (Jim, the wife) or failing to use their case to drive the final verdict on the survival of the critique.
