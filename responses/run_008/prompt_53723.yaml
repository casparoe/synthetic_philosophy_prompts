answer: |-
  # SEMINAR HANDOUT: Mapping the Logical Space of Sleeping Beauty

  **Instructions:** Start at the root. Answer each question based on your intuitions about Beauty's epistemic situation *before* looking at the labels on the right. Trace your path to a leaf. Once there, apply the **Stress Tests** below to see if your position holds.

  ### THE DECISION TREE

  **ROOT:** Beauty is awake. She knows the protocol. She asks: *"What is my credence that the coin landed Heads?"*

  **Q1. Is this question well-posed independent of any specific decision or bet?**
  *   **NO:** Credence is not a distinct mental state from betting dispositions; it varies by context.
      *   └─► **LEAF A: The Pragmatist / Contextualist**
      *   *(View: The question is ill-posed or requires reformulation relative to a utility function.)*
  *   **YES:** There is a fact of the matter about her belief state regardless of action.
      *   └─► **GO TO Q2**

  **Q2. Does the mere fact of *this* awakening provide new evidence about the coin (compared to Sunday)?**
  *   **YES:** Waking is more likely under Tails than Heads (because Tails produces more awakenings).
      *   └─► **LEAF B: The Thirder**
      *   *(View: $Cr(Heads) = 1/3$. Waking updates probabilities via observer-counting.)*
  *   **NO:** Waking was guaranteed to happen; it eliminates no possibilities from Sunday's perspective.
      *   └─► **GO TO Q3**

  **Q3. If Beauty learns it is Monday, should her credence in Heads shift from 1/2?**
  *   **YES:** Learning "Monday" eliminates the (Tails, Tuesday) world, changing the odds.
      *   └─► **LEAF C: The Lewis Halfer**
      *   *(View: $Cr(Heads) = 1/2$ on waking; $Cr(Heads | Monday) = 2/3$.)*
  *   **NO:** "Monday" is indexical information that shouldn't shift the coin probability.
      *   └─► **LEAF D: The Double Halfer**
      *   *(View: $Cr(Heads) = 1/2$ on waking; $Cr(Heads | Monday) = 1/2$.)*

  ---

  ### STRESS TESTS (Apply to your Leaf)

  **1. The Extreme Tails Variant:**
  *Modify the protocol: If Tails, Beauty wakes 1,000 times. If Heads, once.*
  *   **Thirder:** $Cr(Heads)$ drops to $\approx 1/1001$. (Consistent: More awakenings = more weight).
  *   **Halfers (C & D):** $Cr(Heads)$ remains $1/2$. (Consistent: Coin bias hasn't changed).
  *   **Pragmatist:** Depends on the bet offered.
  *   *Discussion:* Does the intuition flip when the number gets large? If so, you may be a Thirder despite answering "No" to Q2.

  **2. The Betting Variant:**
  *Modify the protocol: At every awakening, Beauty is offered a bet: Win \$1.50 if Tails, Lose \$1.00 if Heads.*
  *   **Thirder:** Accepts bet. (Expected Utility > 0 at $Cr(Tails)=2/3$).
  *   **Lewis Halfer:** Accepts bet. (Credence is $1/2$, but knows she bets twice on Tails).
  *   **Double Halfer:** Accepts bet. (Similar reasoning to Lewis).
  *   **Pragmatist:** "Accepts bet" *defines* her credence as $> 1/3$.
  *   *Discussion:* If you answer "Reject" here, you separate Credence from Decision. If "Accept," do you maintain $Cr(Heads)=1/2$? (This separates Halfers from those who conflate credence with betting odds).

  ---

  ### INSTRUCTOR KEY & LOGICAL GAPS

  **Inseparable Leaves:**
  *   **Lewis Halfer (C) vs. Double Halfer (D):** These positions are **not separable** by the main question ($Cr(Heads)$ on waking). Both answer $1/2$. They are only distinguished by Q3 (the Monday conditional). In a standard seminar discussion without the Monday reveal, these views function identically.

  **Empty/Unexplored Cells:**
  *   **Combination:** Answer **YES** to Q2 (Waking is new evidence) BUT argue the number of awakenings should **not** weight the probability.
  *   **Status:** **Unattractive/Incoherent.** If waking is evidence, it is almost exclusively because Tails makes the awakening more frequent (likelihood ratio). Claiming it is evidence without weighting by frequency lacks a standard defense in the literature.

  **Variant Sensitivity:**
  *   **Betting Variant:** This cleanly separates **Pragmatists** (Credence *is* betting odds) from **Halfers** (Credence is $1/2$, but decision theory accounts for repeated betting). Students who claim $Cr(Heads)=1/2$ but would *reject* the bet are holding an unstable position (Dominance violation).

  **Note on "Ill-Posed" (Leaf A):**
  *   This includes views arguing that self-locating belief requires a shift from standard probability theory (e.g., imprecise probabilities) or that the question conflates "chance of coin" with "chance of sampling."

  *(c) Seminar on Self-Locating Belief | Do not distribute outside course*
