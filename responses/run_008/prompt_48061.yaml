  If she says "Decays," she is a Pragmatic Humean (Rule B). She believes laws capture the *structure* of interactions, even if the sample size is cut short by the end of the world.

  Given her "ugly equation" ruling (Verdict 2), she respects **Fit**. But given her "Tuesday Freeze" ruling (Verdict 4), she respects **Continuity**. This Isotope World forces her to choose between Fit (Stable) and Continuity (Decays). It should keep her arguing all the way home.
