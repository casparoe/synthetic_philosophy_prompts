  *   **Rule B (Robust Pattern) says: "U-300 Decays."**
      *   *Reasoning:* The law is about the *nature* of the particle established by the local physics (the weak force coupling, etc.), which is identical to ours. The fact that the world ended before the probability cashed out is a boundary condition. The regularity is in the *propensity*, not just the tally sheet.

  **How to play it:**
