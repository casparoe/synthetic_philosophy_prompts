  Look closely at **Verdict 4** (The Tuesday Freeze). In that scenario, the history *included* the anomaly. A strict Global Bookkeeper (Rule A) might argue that the Best System for a world that freezes on Tuesday is *not* "Newton's Laws" but "Newton's Laws + Freeze Clause." But Dorothy explicitly rejected that. She said the laws *were* our laws and the freeze was a "miracle."

  This tells me she applies a heavy penalty against *ad hoc* time-indexicals in laws. She views "The world ends at midnight" as a boundary condition, similar to "The lab walls are at coordinates X, Y, Z." Boundary conditions aren't laws. Since she treats the Tuesday Freeze as a boundary/miracle rather than a law-change, she will treat the Midnight End the same way. She values the **robustness of the trajectory** over the **completeness of the summary**.

  She is a chemist. To a chemist, the boiling point of water is a law of nature even if the universe ends before all the water boils. The *potential* is in the substance, established by its past behavior.

  ### 4. The Tie-Splitter: "The Isotope World"

  If Dorothy rules as I predict, Rule A and Rule B are now tied again. Both can explain the Midnight Case: Rule B because it ignores the future, and Rule A because it might agree that "Standard Model" is still simpler than "Standard Model + End of World" even for a short history.

  To split them, you need a case where the **Total History** suggests one law, but the **Local Pattern** suggests another.

  **The Thought Experiment:**
  > "Dorothy, imagine a world identical to ours, containing a specific radioactive isotope, let's call it Unobtainium-300. In our world, U-300 has a half-life of 100 billion years.
