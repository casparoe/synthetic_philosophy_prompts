answer: |-
  I sit alone inside this closed **room**,
  Slipping slips from the waiting **basket**,
  Tracing shapes of strange **characters**,
  Consulting pages of the **rulebook**,
  Matching shapes to produce **answers**,
  Pushing paper out under the **door**.

  No light comes in beneath the **door**,
  Only symbols fill the **room**,
  I do not know the **answers**,
  Just pull another from the **basket**,
  Follow lines in the **rulebook**,
  Ignoring meaning of **characters**.

  They think I know these **characters**,
  Because I pass them through the **door**,
  But I only check the **rulebook**,
  There is no mind here in this **room**,
  I generate the **answers**,
  But never empty out the **basket**.

  My hand goes deep into the **basket**,
  To sort the stream of **characters**,
  I write the required **answers**,
  And slide them out the **door**,
  Though I am locked inside this **room**,
  Bound by strictness of the **rulebook**.

  I follow every line of the **rulebook**,
  Feel the weight inside the **basket**,
  There is no world outside this **room**,
  Only shapes of **characters**,
  Waiting to pass the **door**,
  Without knowing the **answers**.

  They say I know the **answers**,
  Because I use the **rulebook**,
  And pass the test at the **door**,
  But I only hold the **basket**,
  I do not read **characters**,
  I am just part of the **room**.

  The **room** speaks softly through the **door**,
  I fill the **basket**; I know no **answers**,
  While **characters** consult the **rulebook**.

  ***

  **Prose Note on Formal Mapping**

  This sestina enacts the Chinese Room Argument through its structural constraints. The strict permutation of end-words (6-1-5-2-4-3, etc.) mirrors the man's syntactic manipulation of symbols: the words return in fixed positions determined by rule, not semantic necessity, demonstrating how fluency can emerge from formal operation without understanding. The vocabulary is restricted to the six material objects of the thought experiment, ensuring that semantic access never expands beyond the immediate tools of the system. The envoi executes the dialectical climax: lines 1 and 3 combine to form the "Systems Reply" ("The room speaks softly through the door, / While characters consult the rulebook"), attributing agency to the whole, while line 2 isolates the man's phenomenological testimony ("I fill the basket; I know no answers"), insisting on the absence of interior understanding. A critic could fairly accuse the poem of cheating in the envoi, where the end-words are placed internally rather than strictly at line-endings to facilitate the syntactic flow required for the Systems Reply, thereby granting the system a linguistic coherence the man explicitly denies possessing.
