      *   *Goodmanian (Epistemic):* Good on Indistinguishability (denies it's possible forever). Struggles with Post-exposure (why did it look bad *immediately*?).
      *   *Deflationary/Relic (Walter Benjamin-ish or Economic):* Good on Indistinguishability. Fails the "Rational Aesthetic" goal (concedes it's not aesthetic).

  6.  **Refining the Output:**
