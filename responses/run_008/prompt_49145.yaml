      *   *Check:* Did I address the "Rationality" constraint? *Adjustment:* Emphasize that the theory must provide *normative* reasons, not just causal explanations.
      *   *Check:* The Trilemma answer needs to be decisive. I will argue that (1) must be dropped or significantly expanded. "Aesthetic" cannot mean "perceptual" if (3) is true.

  8.  **Final Polish:** Check against the prompt's specific phrasing ("Flag any requirements you suspect cannot be jointly satisfied," "Score the main families... half a page at most").

      *(Self-Correction on Trilemma)*: The prompt asks: "If no theory can have all three, say which one you would drop and why." I need to take a stand. I will argue for dropping the strict definition of (1) "Aesthetic" in favor of a broader "Artistic" value that includes historical relations, because (2) and (3) are empirically and conceptually harder to deny in the context of forgery.

      *(Self-Correction on Scorecard)*: Keep it tight. Focus on how they meet the *desiderata*, not just general pros/cons.

