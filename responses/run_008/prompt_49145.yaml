answer: |-
  ### Desiderata for a Theory of Originality

  To demonstrate that the premium placed on originals is rational rather than merely psychological or economic, a theory must satisfy the following normative requirements. Note that several of these generate significant tension, particularly regarding the nature of "aesthetic" properties.

  **1. The Non-Perceptual Supervenience Constraint**
  *   **Motivation:** *Perceptual Indistinguishability.*
  *   **Requirement:** The theory must locate the value difference in properties that do not supervene on the immediate sensory appearance of the object. If value depended solely on visual experience, a perfect copy would be equally valuable. The theory must explain why history matters without claiming the history changes the pixels.

  **2. The Epistemic Independence Constraint**
  *   **Motivation:** *Delayed Revelation & Reverse Misattribution.*
  *   **Requirement:** The value of the work must be invariant under changes in audience belief. A forgery must be less valuable *when it was believed to be real*, and a misattributed original must be more valuable *when it was believed to be fake*. The theory must distinguish between *axiological status* (what the work is worth) and *epistemic access* (what we know about it).

  **3. The Medium Specificity Constraint**
  *   **Motivation:** *Autographic versus Allographic Works.*
  *   **Requirement:** The theory must explain why provenance is constitutive for painting but incidental for literature or music. It cannot simply assert that "history matters"; it must specify *which* historical relations are constitutive of the work's identity in specific media.

  **4. The Intentional Provenance Constraint**
  *   **Motivation:** *The Authorized Replica.*
  *   **Requirement:** The theory must account for cases where the artist's hand is absent but their agency is present (authorized casts/replicas). Physical continuity alone is insufficient; the theory must incorporate the artist's sanction as a value-preserving mechanism distinct from physical touch.

  **5. The Temporal Indexicality Constraint**
  *   **Motivation:** *Self-Copying.*
  *   **Requirement:** The theory must explain why an artist's later copy of their own work lacks the value of the earlier one. Authorship is not enough; the specific moment of creation must be part of the work's identity. The value must be tied to the *event* of origination, not just the *agent*.

  **6. The Material Continuity Threshold**
  *   **Motivation:** *Material Survival (Ship of Theseus).*
  *   **Requirement:** The theory must offer a principled account of how much physical replacement is permissible before the object ceases to be the original. It cannot rely on vague intuition; it must distinguish between *restoration* (preserving the work) and *replication* (creating a new one).

  **7. The Aesthetic Relevance Constraint**
  *   **Motivation:** *Aesthetic vs. Relic vs. Market Value.*
  *   **Requirement:** The theory must clarify whether the premium on originals is an *aesthetic* judgment or a *historical/relic* judgment. If it concedes the value is merely relic-like (like a saint's bone), it fails the purpose of showing the premium is rational *within art criticism*. If it claims the value is aesthetic, it must explain how historical facts alter aesthetic properties without altering perception.

  **8. The Deception Distinction**
  *   **Motivation:** *Copy vs. Forgery vs. Duplicate.*
  *   **Requirement:** The theory must distinguish the value loss due to *deception* (forgery) from value loss due to *multiplicity* (copy). A known copy differs from a forgery; the theory must explain why the intent to deceive compounds the value loss, or if the loss is identical regardless of intent.

  ***

  ### Flagged Tensions

  There is a critical tension between **The Non-Perceptual Supervenience Constraint (1)** and **The Aesthetic Relevance Constraint (7)**. Standard aesthetic theory holds that aesthetic properties supervene on perceptual properties. If the value difference is unperceivable (1), it is difficult to classify it as strictly *aesthetic* (7) without redefining "aesthetic" to include historical relations. Furthermore, **The Epistemic Independence Constraint (2)** conflicts with **Post-exposure Re-evaluation**. If the value was low all along (2), why did the aesthetic experience *itself* change upon exposure? A theory that satisfies (2) risks making the change in spectator experience look like an error, whereas a theory that validates the spectator's change risks violating (2) by making value dependent on belief.

  ***

  ### The Trilemma: Aesthetic Value, Objective History, Unperceivability

  You ask whether the following three requirements are jointly satisfiable:
  1.  The value difference is genuinely **aesthetic** (not economic/relic).
  2.  The value does not supervene on **belief** (it is objective/historical).
  3.  The value difference is **unperceivable in principle** (perfect copy scenario).

  **Verdict:** No, these are not jointly satisfiable under standard definitions.

  **Recommendation:** Drop **(1)** in its narrow sense, or expand the definition of "aesthetic."

  **Reasoning:** If a property is unperceivable in principle (3) and objective (2), it is a historical or relational property, not a perceptual one. Traditional aesthetics ties the aesthetic to the perceptual. If you insist the value is *aesthetic*, you must argue that knowing the history changes the perception (violating 3) or that aesthetic properties include non-perceptual relations (redefining 1). To maintain the rationality of the premium without contradicting the indistinguishability premise, you must argue that the value is **artistic** rather than strictly **aesthetic**. The premium is rational because art is essentially a communicative act between agent and audience across time; a copy breaks the communicative link even if the visual message is identical. This preserves (2) and (3) but concedes that the "value" is not purely about sensory beauty (1), but about the integrity of the artistic transaction.

  ***

  ### Scorecard of Theory Families

  **1. Historical/Genetic Theories (e.g., Danto, Levinson)**
  *   **Performance:** Strongest on **Epistemic Independence** and **Temporal Indexicality**. They ground value in the specific art-historical context and intention, explaining why self-copies and forgeries fail (wrong context/intent). They handle **Authorized Replicas** well via agency.
  *   **Failure:** Struggle with **Aesthetic Relevance**. They often concede the value is cognitive/historical, not aesthetic, which may undermine the goal of justifying the premium *as art lovers* feel it. They also struggle with **Material Continuity**, as they prioritize idea/history over matter.

  **2. Goodmanian/Epistemic Theories (Nelson Goodman)**
  *   **Performance:** Strong on **Medium Specificity** (autographic/allographic distinction). Good at explaining why we *train* ourselves to see differences.
  *   **Failure:** Fails **Perceptual Indistinguishability**. Goodman argues a perfect copy is impossible because we can always learn to see a difference. This contradicts your thought experiment. It also fails **Post-exposure Re-evaluation**; it cannot explain why the work looked *different* immediately upon exposure, before new perceptual training occurred.

  **3. Deflationary/Relic Theories (e.g., Benjamin, Economic accounts)**
  *   **Performance:** Perfect on **Perceptual Indistinguishability** and **Material Continuity**. They admit the "aura" is magical thinking or scarcity value.
  *   **Failure:** Fails the **Purpose**. They argue the premium is *irrational* (fetishism) or purely economic. This contradicts your goal to show the premium is rational. They also collapse **Aesthetic Value** into **Relic Value**, violating the **Aesthetic Relevance Constraint**.

  **Winner:** A modified **Historical/Genetic Theory** is the only candidate that preserves rationality and objective history, provided you accept the Trilemma verdict: the value is rational, but it is historical/intentional, not strictly perceptual-aesthetic.
