answer: |-
  Summary of the implicit epistemology

  The implicit epistemology is a form of quasi-empiricism applied to mathematics. Cryptographers treat conjectures not as binary truths awaiting discovery, but as hypotheses subject to confirmation. Confidence accumulates through the absence of counter-examples and the failure of attack vectors, functioning similarly to scientific falsification. This stance presupposes that epistemic confidence in mathematical statements can vary continuously, even if ontological truth cannot. It bridges the gap between formal proof and practical engineering by assigning subjective probabilities to unproven premises. Consequently, the field operates on a Bayesian model of mathematical knowledge, where time and scrutiny serve as evidence, updating the likelihood of an assumption's validity without ever achieving the certainty of a theorem. This allows risk management on undecidable problems. It treats mathematical hardness as a stable property of the universe, observable through failed attempts rather than deductive proof, effectively rendering resilience an empirical observation. Thus, confidence behaves like empirical data.

  What the practice strictly presupposes

  Strictly speaking, the practice does not require believing mathematical truths are probabilistic. It only presupposes a decision-theoretic framework where agents maximise expected utility. One can maintain an austere Platonic view—that factoring is either hard or easy—while acknowledging human ignorance warrants a bet. The industry merely requires that the subjective probability of failure remains below a threshold where the cost of breach exceeds mitigation costs. This is purely a wager on human ignorance, not on the nature of numbers. Strictly, no claim about the ontology of mathematics is necessary, only that the cost-benefit analysis favours deployment. The engineer need not care if P equals NP, only that finding the algorithm is unlikely within the cipher's lifespan.
  However, what sits comfortably with the practice is a naturalised view of mathematics, akin to Quine's web of belief. Here, mathematical statements gain credibility through coherence and utility rather than deduction alone. While the austere view licenses the bet, it struggles to explain why confidence grows over time without proof. If truth is fixed, why is RSA safer today than in 1980? The comfortable view explains the gradient of trust but risks conflating evidence with truth. It suggests mathematical hardness is a physical property subject to measurement. Thus, the practice is underdetermined: it functions as a pragmatic wager compatible with rigid formalism, yet thrives on a flexible epistemology that treats mathematical stability as an observable phenomenon. The strict requirement is only risk management; the comfortable assumption is that math behaves like physics in practice.

  Rival views and where they break

  The austere proof-only view holds that mathematical propositions are bivalent and timeless; assigning probability is a category error reflecting psychological state, not logical status. This view breaks when justifying resource allocation. If truth is binary, one cannot rationally prioritise defending against a 'likely' break over a 'possible' one without importing subjective probability, which the austere view rejects as irrelevant to truth. It leaves the engineer with no guide for action amidst ignorance.
  Conversely, a fully probabilistic view of mathematics risks undermining the concept of proof itself. If conjectures are merely likely, the distinction between theorem and hypothesis blurs. A middle ground, fallibilism, suggests mathematical knowledge is corrigible. This breaks down when a proof is finally found; the probability does not update to 1, it snaps to 1, suggesting the prior probability was not tracking truth but our access to it. Furthermore, if we treat math as empirical, we face the problem of induction: past resistance to factoring algorithms does not guarantee future resistance. The austere view cannot explain changing confidence; the empirical view cannot guarantee stability. Both struggle to account for why we trust standard models more than exotic ones without a formal reduction, revealing that cryptographic practice relies on a sociological consensus on what constitutes 'sufficient' scrutiny, which neither pure logic nor pure empiricism fully captures. Ultimately, the austere view is clearly too rigid for engineering, while the probabilistic view is consequently too unstable for mathematics in essence.

  Consequences of making it explicit

  Making this explicit would shift cryptography from a binary 'secure/broken' mindset to a risk-management discipline. Standards bodies would quantify assumption decay, migrating protocols not merely when broken, but when the 'probability of hardness' drops below a utility threshold. This encourages algorithmic diversity as hedging, rather than seeking a single perfect primitive. It would also legitimise updating confidence based on community scrutiny levels, potentially significantly accelerating the adoption of newer schemes that have undergone intense, albeit short, analysis over older, complacent ones. It would force a reckoning with quantum threats as probability shifts rather than binary events. Ultimately, it frames security as a continuous variable dependent on mathematical evidence, aligning engineering practice with the actual epistemic state of the field. We would stop pretending we know, and start managing how much we don't.
