answer: |-
  Your intuitions are not inconsistent; they are actually tracking a very specific, sophisticated framework in decision theory that sits between **Causal Decision Theory (CDT)** and **Updateless Decision Theory (UDT)**, with a heavy dose of **game-theoretic credibility**.

  Your tentative principle ("resist when it reduces future threats") is the right *direction*, but it fails because it doesn't distinguish between **selecting a policy** (Ex-Ante) and **executing an action** (Ex-Post), nor does it account for the **cost of maintaining the policy**.

  Here is the repaired principle, the resolution of your six cases, and the verdict on your community extortion scenario.

  ### The Repaired Principle: Credible Ex-Ante Optimization

  > **"Act according to the policy you would have credibly precommitted to before the threat landscape existed, provided the cost of maintaining that policy is less than the deterrence benefit. If you failed to precommit and are now facing an active threat, minimize immediate harm."**

  This principle splits your decision-making into two modes:
  1.  **Policy Mode (Ex-Ante):** What kind of agent do I want to be known as? (Cases 2, 4, 5).
  2.  **Damage Control Mode (Ex-Post):** I am already in the trap; how do I get out? (Cases 1, 6).

  Here is how this principle repairs your six cases, including the conflicts you identified.

  #### Case (1): The Mugger
  *   **Verdict:** Pay.
  *   **Analysis:** This is **Damage Control Mode**. You did not have the opportunity to precommit to "never carry a wallet" or "fight all muggers" before stepping onto the street. The causal link is immediate (knife → injury). Resisting now does not shape the population of muggers; it only shapes your immediate health.
  *   **Principle Check:** You failed to precommit; minimize immediate harm. **Consistent.**

  #### Case (2): Hostage Policy
  *   **Verdict:** Never Negotiate (Policy).
  *   **Analysis:** This is **Policy Mode**. A government *can* credibly precommit (via law, reputation, public stance). By adopting this policy Ex-Ante, you change the incentives for kidnappers *before* they act.
  *   **Principle Check:** This is the optimal Ex-Ante policy. **Consistent.**

  #### Case (3): The Acausal Threat
  *   **Verdict:** Don't Pay.
  *   **Analysis:** This is the trickiest one. You worried your principle fails here because resistance should still discourage the threatener. **It does.** The reason it feels different from (1) is not about causality, but about **Algorithm Selection**.
      *   In (1), handing over the wallet *causes* the mugger to leave.
      *   In (3), sending the money does not *cause* the simulator to stop (the simulation is already run or predicted). Your action is *evidence* of your decision algorithm.
      *   If your algorithm is "Pay acausal threats," you become a target for acausal threats. If your algorithm is "Ignore acausal threats," you are not a target.
      *   You cannot "decide" in the moment. You must *be* the type of agent who ignores it. Paying validates the strategy of blackmailing you.
  *   **Why it feels different:** In (1), you are physically coerced. In (3), you are logically coerced. But since you can't verify the threat (unlike the knife), the "maintenance cost" of worrying about every possible acausal threat is infinite. You must adopt a policy of ignoring unverifiable acausal threats to function.
  *   **Principle Check:** The optimal Ex-Ante policy is "Ignore unverifiable acausal blackmail" to prevent incentivizing it. **Consistent.**

  #### Case (4): Schoolyard Surrogate Goal
  *   **Verdict:** Do it.
  *   **Analysis:** This is **Policy Mode**. The cost of precommitment (looking crazy once) is low. The deterrence benefit (no more bullying) is high. It makes the threat non-credible.
  *   **Principle Check:** Maintenance cost < Deterrence benefit. **Consistent.**

  #### Case (5): Life-Wide Surrogate Goal
  *   **Verdict:** Don't do it.
  *   **Analysis:** This is **Policy Mode**, but the math breaks. The maintenance cost (social isolation, constant rage, undignified behavior) is massive. The marginal deterrence benefit over a "reasonable boundaries" policy is low.
  *   **Principle Check:** Maintenance cost > Deterrence benefit. **Consistent.**

  #### Case (6): Mid-Standoff Negotiation
  *   **Verdict:** Negotiate (if it saves lives).
  *   **Analysis:** This is the conflict with (2). Your principle resolves this by acknowledging **Time Inconsistency**.
      *   (2) is what you *wish* you were (the agent who precommitted).
      *   (6) is what you *are* (the agent who failed to precommit credibly).
      *   If you are actually in the standoff, the precommitment has already failed (otherwise the kidnapper wouldn't have acted). You are now in Damage Control Mode.
  *   **Principle Check:** You failed to precommit; minimize immediate harm. **Consistent.** (Note: This implies (2) and (6) are logically in tension, which they are. You *should* feel regret in (6) that you weren't the agent from (2).)

  ---

  ### Addressing Your CDT Worry

  You asked: *"That feels like it smuggles causal decision theory in the back door... if I were to take evidential reasoning seriously anywhere it seems like it'd be about agents who can predict or simulate my choices."*

  You are describing **Timeless Decision Theory (TDT)** or **Updateless Decision Theory (UDT)**. You are entitled to use this! In fact, your intuitions in (2), (3), and (4) *require* it.

  *   **CDT says:** "The simulation is already run. My money can't change the past. Don't pay." (Also: "The kidnapping happened. My refusal can't change the past. Pay to save lives.")
  *   **UDT says:** "I must act as the agent whose algorithm determines the outcome. If my algorithm pays, blackmailers exist. If my algorithm refuses, they don't."

  The reason (3) feels dismissible isn't because you are using CDT. It's because **you cannot verify the counterparty.** In (1), the mugger is real. In (3), the "simulator" is a hypothesis. Even granting the "weird big numbers," standard practice in UDT is to ignore threats from logical spaces you cannot interact with or verify, because the "maintenance cost" of monitoring all logical space is paralyzing. You optimize for the *accessible* world.

  ---

  ### The Test Case: Community Doxxing & Surrogate Goals

  **Scenario:** An extortionist threatens to doxx members of your online community. You propose a shared surrogate goal: *A doxxing attempt against one is treated as an attack on all, answered with permanent total non-cooperation.*

  **Verdict:** **Good Move (Case 4, not Case 5).**

  **Analysis using the Repaired Principle:**

  1.  **Policy Mode:** You are establishing this *before* the extortionist succeeds (ideally). You are shaping the incentive landscape.
  2.  **Maintenance Cost:** "Permanent total non-cooperation" with a specific bad actor is very low cost for a community. Unlike Case (5) (raging at *everyone* who cuts in line), this is targeted. It does not degrade your dignity or social functioning with normal people.
  3.  **Deterrence Benefit:** High. It raises the cost of the attack from "hurt one person" to "lose access to the entire community." It transforms a low-stakes threat into a high-stakes war.
  4.  **Credibility:** This is the bottleneck. A government (Case 2) can credibly precommit. A loose online group often cannot.
      *   *If* the community can technically enforce this (e.g., a platform ban that is automated/immutable), it works.
      *   *If* it relies on individual members "feeling like" boycotting, it will fail (Case 6 dynamics will creep in; individuals will defect and talk to the extortionist).

  **Prediction:**
  If you can **bind the community** (make the non-cooperation automatic or socially mandatory), this is a winning strategy. It creates a **Schelling Point** that makes threatening the community irrational.

  If you cannot bind the community, you are bluffing. The extortionist will call the bluff, doxx one person, and the community will fracture as individuals decide "it's not worth it for *me* to boycott." In that case, you have built Case (5) (high social drama) without the benefits of Case (4).

  **Recommendation:**
  Adopt the policy, but invest 90% of your energy in making the **enforcement mechanism credible** (technical blocks, public oaths, reputation systems) rather than the moral argument. If the threatener believes you *cannot* cooperate even if you wanted to, you win. If they think you *won't* cooperate, they will test you.

  ### Summary
  Your gut is tracking **Updateless Decision Theory with Cost-Benefit Analysis on Precommitment**.
  *   **Resist** when you can set the rules beforehand (2, 4, Community Case).
  *   **Comply** when you are trapped in the consequences of failed precommitment (1, 6).
  *   **Ignore** when the threat requires monitoring infinite logical space or incentivizes your own exploitation (3).
  *   **Reject** when the cost of the "tough guy" persona outweighs the safety it buys (5).

  You aren't inconsistent; you're just doing game theory in your head faster than you can articulate the axioms.
