answer: |-
  ### Control-Theoretic Translation of the Doing/Allowing Distinction

  As a process control engineer, you view the plant as a dynamic system governed by state-space equations: $\dot{x} = f(x, u, d)$. Here, $x$ is the state vector (pressure, temperature, level), $u$ is the manipulated variable (control signal to valves, relays), and $d$ is the disturbance vector (feed composition changes, ambient temperature, equipment degradation).

  The philosophical debate regarding "Doing" (Killing) versus "Allowing" (Letting Die) translates into control theory as the distinction between **Forced Response** and **Natural Response**.

  #### 1. The Core Distinction: Input Vector vs. Disturbance Vector
  *   **Philosophical Claim:** There is a moral difference between actively causing death and passively permitting it.
  *   **Control Translation:** There is a topological difference in the block diagram between a change in the control signal $u(t)$ that drives the process variable (PV) to a trip state, versus a hold on $u(t)$ while a disturbance $d(t)$ drives the PV to a trip state.
      *   **Killing (Doing):** The controller (agent) issues a command $u_{active}$ where the partial derivative $\frac{\partial \dot{x}}{\partial u}$ is the dominant term driving the state $x$ beyond the safety envelope. The energy to reach the hazardous state comes from the control system.
      *   **Letting Die (Allowing):** The controller maintains $u_{nominal}$ (or $u=0$). The state $x$ exceeds the safety envelope because $\frac{\partial \dot{x}}{\partial d}$ is non-zero. The energy to reach the hazardous state comes from the plant dynamics or external disturbances.

  **Translation Fidelity:**
  *   **Clean:** The causal topology is perfectly captured. We can mathematically distinguish between a valve forced open by a signal versus a valve leaking due to corrosion (disturbance).
  *   **Distortion:** In control engineering, we often treat "human operator action" as a disturbance $d_{human}$ unless they are at the console. In philosophy, the human is the *moral agent*. If an operator walks away, control theory sees a step change in disturbance (loss of supervision); philosophy sees a refusal to act.
  *   **Inexpressible:** The *valuation* of the trajectory. The differential equation does not care if $x$ represents "concentration of product" or "concentration of toxin."

  #### 2. Edge Cases: Safety Instrumented Systems (SIS)
  You noted relief valves and delayed interlocks. These strain the simple $u$ vs. $d$ binary.

  *   **The Relief Valve:** This is a proportional controller with a high setpoint and high gain.
      *   *Scenario:* Pressure rises. Valve opens.
      *   *Analysis:* Is this "doing" (opening the valve) or "allowing" (venting pressure)?
      *   *Control View:* It is a **Feedback Action**. The engineer designed the logic $u = K(x - SP)$. The "action" was encoded at the design phase (configuration). The "allowing" happens at the execution phase.
      *   *Philosophical Strain:* If the valve opens and vents toxic gas to save the vessel, did we "kill" the environment to "save" the plant? Control theory calls this **Risk Reduction**. The moral debate calls this a **Trolley Problem**. The P&ID shows the pipe; it does not show which side of the valve has higher moral priority.
  *   **The Delayed Interlock:**
      *   *Scenario:* A high-level alarm sounds. The trip is programmed with a 30-second delay to avoid nuisance trips. The tank overflows at 15 seconds.
      *   *Analysis:* The controller *could* have tripped ($u_{trip}$) but the logic block held $u_{hold}$.
      *   *Control View:* This is a **Logic Constraint**. The "doing" was the programming of the timer. The "allowing" was the timer counting.
      *   *Philosophical Strain:* The moral responsibility lies with the *designer* of the logic, not the *execution* of the logic. In control terms, the "Agent" is shifted from the runtime controller to the engineering workstation. The distinction between doing and allowing collapses into **Design Intent vs. Operational Reality**.

  #### 3. Classic Test Cases

  **Case A: Smith vs. Jones (The Drowning Child)**
  *   *Philosophy:* Smith drowns the child (active); Jones watches the child drown (passive). Both want the inheritance.
  *   *Control Translation:*
      *   **Smith:** $u_{Smith}$ applies a downward force vector on the child (State $x$). $\dot{x}$ is driven by $u$.
      *   **Jones:** $u_{Jones} = 0$. Disturbance $d_{gravity/water}$ drives $\dot{x}$. Jones has the *capability* to apply $u_{rescue}$ but maintains $u_{null}$.
  *   **Clean Translation:** The signal paths are distinct. One is a forced response; one is a natural response to disturbance.
  *   **Distortion:** Control theory assumes the controller *should* minimize error ($e = SP - PV$). If the SP is "Child Alive," Jones is a **Controller in Manual Mode with Zero Output**. Smith is a **Controller in Auto Mode with Malicious Setpoint**. The math describes the deviation, but not the *breach of duty*.

  **Case B: Initiating Threat vs. Declining Prevention**
  *   *Philosophy:* Pushing a man in front of a bus (initiating) vs. not pulling him back (declining prevention).
  *   *Control Translation:*
      *   **Initiating:** Injecting a disturbance $d_{new}$ that creates a new instability loop.
      *   **Declining:** Failing to close a feedback loop that would reject an existing disturbance $d_{existing}$.
  *   **Clean Translation:** This maps well to **Loop Closure**. Initiating a threat is closing a loop with positive feedback (destabilizing). Declining prevention is leaving a loop open (high gain on disturbance).
  *   **Inexpressible:** Why is closing a destabilizing loop worse than leaving a stabilizing loop open? In control, both result in Instability ($x \to \infty$). The "moral weight" is not a function of stability margins.

  ---

  ### Residue Report

  Your hypothesis is that every causal case is capturable as a control policy plus plant response, and the moral weight attaches to something not on the P&ID. I have analyzed the translation above to determine if the residue (the untranslatable moral weight) indicates a limitation of your vocabulary or an unreality in the moral distinction.

  #### 1. Argument: The Residue is a Limitation of the Framework
  Your vocabulary is **Descriptive**, not **Normative**.
  A P&ID and a cause-and-effect matrix describe *what can happen* and *how the system reacts*. They do not contain a variable for **Duty of Care**.
  *   In your domain, a "Failure on Demand" (allowing) and a "Spurious Trip" (doing) are both failures. We track them in different columns of a reliability report (Safe Failure Fraction vs. Dangerous Failure Fraction), but mathematically, they are both deviations from the Safety Requirement Specification (SRS).
  *   The moral debate hinges on *ownership of the causal chain*. In control theory, causality is physical (signal flow). In ethics, causality is agential (responsibility).
  *   **Evidence:** You can model the "Drowning Child" perfectly. You can define the "Child's Head Height" as a PV. You can define "Arm Extension" as an MV. You can simulate Smith and Jones. The simulation will output identical final states ($PV < 0$). The simulation cannot output "Guilt."
  *   **Conclusion:** The residue exists because control engineering optimizes for *consequences* (stability, safety, yield), whereas the doing/allowing distinction optimizes for *agency*. Your vocabulary lacks a tag for "Who owns the Setpoint?"

  #### 2. Argument: The Residue Shows the Moral Distinction is Unreal
  Conversely, one could argue that the moral distinction is a heuristic that dissolves under rigorous systems analysis.
  *   In Safety Instrumented Systems (SIS), we calculate the **Probability of Failure on Demand (PFD)**. We do not morally weight a valve failing closed (allowing overpressure) differently than a valve failing open (causing loss of containment) *in the risk matrix*—we weight them by the *consequence* and the *likelihood*.
  *   If you look at the "Delayed Interlock" case: The engineer who programmed the delay *did* act. The "allowing" was actually a prior "doing" (configuration). If we trace the signal back to the source, all "allowing" is just "doing at a previous time step" or "doing by a different subsystem."
  *   **Evidence:** In a fully automated plant, if a sensor drifts (disturbance) and the controller doesn't compensate (allowing), vs. the controller outputting a bad signal (doing), the result is the same accident. The investigation focuses on the **Root Cause**, not the metaphysical status of the action. If the root cause is "Poor Design," both are treated identically.
  *   **Conclusion:** The moral distinction relies on a "snapshot" view of time. A control engineer views the system as a continuous trajectory over time. From a lifecycle perspective (Design -> Commission -> Operate -> Maintain), the distinction between doing and allowing collapses into **Design Integrity**. The residue is just noise from ignoring the full time-history of the control policy.

  #### 3. Synthesis
  The truth lies in the interface between the **Physical Layer** (P&ID, loops) and the **Social Layer** (SRS, Operating Procedures).
  *   Your vocabulary *can* capture the physical difference (Forced vs. Natural Response). So the moral distinction is not *physically* unreal; there is a real engineering difference between a valve commanded open and a valve leaking.
  *   However, the *moral weight* (why one is worse than the other) is not determined by the physics. It is determined by the **Allocation of Control Authority**.
  *   We blame Smith more than Jones because Smith seized control authority ($u$) he was not granted. Jones failed to exercise control authority he *was* granted.
  *   Your P&ID shows the lines of authority (who controls what valve). It does not show the *legitimacy* of that authority.

  The residue is not that the distinction is unreal, nor solely that your vocabulary is limited. The residue is that **Moral Responsibility is a Meta-Control Variable.** It is a variable that governs the *assignment* of Setpoints and Manipulated Variables, sitting outside the loop itself. It is the "Engineer's Signature" on the SRS.

  Your framework captures the *causality* perfectly. It fails to capture the *legitimacy* of the causation. The philosophical debate tries to derive legitimacy from causality (Doing vs. Allowing). Your experience shows that causality is neutral; legitimacy is assigned by the safety lifecycle management (who was authorized to change the SP?).

  \verdict{both, in different respects}
