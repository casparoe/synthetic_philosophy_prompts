prompt: |-
  I'm a process control engineer with about fifteen years of experience designing and maintaining safety instrumented systems at a chemical processing plant — emergency shutdown loops, interlocks, relief valves, burner management systems. I'm fluent in this vocabulary and use it daily: manipulated variables, disturbances, setpoints, demand modes, fail-safe design, and, crucially, the difference between a controller acting through an actuator and a plant simply evolving on its own when nothing commands it. I've recently started reading the philosophical literature on the distinction between doing and allowing — between killing and letting die — and I'd like you to translate that debate into my vocabulary, as faithfully as you can.

  Concretely: restate the main positions in control-engineering terms. The philosophers' claim that there is a morally significant difference between active killing and passive letting-die should become a claim about, presumably, the difference between issuing a control command and declining to issue one, or between a manipulated variable and an unmanipulated one — but you'll have to work out where exactly to draw it, because I suspect my domain strains any simple version of the line. Consider a relief valve designed to open only above a threshold, or an interlock deliberately configured with a delay: these are cases where an engineer has chosen a policy under which the system does nothing until conditions are met, and it's unclear whether that counts as doing or allowing. Cover the classic test cases philosophers use, including the one where two agents are identically selfish and differ only in whether they act or refrain while a child drowns, and the cases involving initiating a threat versus declining to prevent one. For each position, say what translates cleanly, what translates only with distortion, and what cannot be expressed in control vocabulary at all.

  Then give me the residue report. My working hypothesis, looking at this from the block-diagram point of view, is that everything causal in the debate is capturable — every case, however described, is just a different control policy plus a plant response — and that the moral weight philosophers attach to the doing/allowing difference attaches to something that never appears anywhere in a P&ID. I want to know whether the residue points to something my vocabulary cannot say, or to something the philosophical distinction cannot cash out, and I'd like your reasoning to engage both possibilities seriously rather than picking one by fiat. Please close with a final line of the form \verdict{...} containing a short phrase selecting among: the residue is a limitation of the framework; the residue shows the moral distinction is unreal; both, in different respects — or your own short phrase, if none of these fits.
