answer: |-
  **MEMORANDUM**

  **TO:** Graduate Funding Committee
  **FROM:** Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Graduate Support Budget Shortfall

  **1. Purpose and Overview**

  This memo outlines a recommendation for addressing the $180,000 mid-year shortfall in the graduate support budget. As discussed in our preliminary sessions, we are constrained to adjustments within the stipend pool. We are currently weighing two primary options: rescinding funding packages for three incoming students (Option A) or applying a proportional reduction across all funded PhD students (Option B).

  After reviewing the ethical implications and practical consequences of both paths, I recommend we adopt **Option B (Spread Cuts)**, with a modification to ensure the burden is distributed progressively rather than strictly equally. Additionally, I advise against utilizing the alumni donor's offer to restore one package via lottery under Option A, as this introduces procedural injustices that compound the initial harm.

  **2. The Core Ethical Tension**

  The debate before us centers on how we weigh concentrated harm against distributed burden.

  The argument for Option A relies on a straightforward calculation of total hardship. It suggests that the collective inconvenience suffered by hundreds of students taking a 4% cut outweighs the catastrophic loss suffered by three students who lose their funding entirely. From a purely aggregate perspective, minimizing the total sum of suffering points to Option A.

  However, this calculation overlooks the nature of individual claims. There is a fundamental moral difference between asking many people to tighten their belts and asking a few people to lose their livelihoods. When we make decisions that affect individuals' lives, we must consider whether the burden placed on any single person is one they could reasonably be expected to bear.

  **3. Why Option A Fails the "Reasonable Rejection" Test**

  To evaluate these options, we should ask: Which principle of action could no one reasonably reject?

  If we adopt Option A, we establish a principle that the university may revoke confirmed offers of support to incoming students to balance the budget. The three students affected can reasonably reject this principle. For them, the consequence is not merely inconvenience; it is the derailment of their careers, potential loss of visa status, and the breach of a specific promise made during admissions. Their complaint is not just about money; it is about reliance and institutional integrity. No amount of small savings distributed across the rest of the student body automatically cancels out the right of an individual not to have their life prospects sacrificed for the group's convenience.

  Furthermore, the proposal to use a lottery to restore one of the three packages does not fix this ethical deficit. It treats the students as interchangeable units of funding rather than individuals with specific claims. Relying on chance to determine who retains their rightful support undermines the idea that funding is earned through admission and merit. It adds a layer of arbitrariness to a decision that is already unjust.

  **4. Addressing the Aggregation Concern (Option B)**

  The argument for Option B is not that individual complaints don't matter, but that the burden imposed on each individual is sufficiently shared and limited.

  We must take seriously the concern that we cannot simply add up small complaints to defeat a large one. If the stipend cut were trivial (e.g., 0.1%), it would be wrong to impose it on the many just to save the few, because the collective burden would be negligible while the individual harm to the three would be severe.

  However, a 4% reduction plus the loss of a summer stipend is not trivial. It is a material hardship that affects research productivity, mental well-being, and financial security for *every* funded student. Because the burden on the many is significant, it becomes permissible to share that burden to prevent a catastrophe for the few. In this scenario, no single student faces a catastrophic loss. While every student has a complaint about the cut, no single student has a complaint strong enough to veto a solution that saves the cohort from excluding members entirely.

  Therefore, Option B is defensible not because we ignore the numbers, but because the distributed burden crosses a threshold of significance that justifies collective action, whereas the concentrated burden in Option A crosses a threshold of catastrophe that violates individual rights.

  **5. Recommendation: Progressive Implementation of Option B**

  While Option B is ethically superior to Option A, a flat 4% cut affects students differently depending on their existing financial margin. A 4% cut for a student with dependents or high local living costs is more severe than for a single student with no debt.

  To ensure this principle is one that no one could reasonably reject, I propose we implement Option B with a **progressive scale**:

  *   **Tiered Reductions:** Students at the higher end of the stipend scale (e.g., senior PhD candidates or those with additional fellowships) should absorb a slightly higher percentage reduction than those at the minimum stipend level.
  *   **Protection of Minimums:** No stipend should be reduced below the university's certified living wage minimum. If the 4% average pushes some students below this threshold, the excess must be absorbed by those above it.

  This approach respects the economist's insight that total resources matter, while adhering to the moral constraint that we cannot sacrifice the basic security of the most vulnerable to protect the comfort of the less vulnerable.

  **6. Conclusion**

  We are facing a situation where there is no painless solution. However, we have a choice between breaking specific promises to a few individuals or asking the community to share a significant but manageable burden.

  Rescinding offers (Option A) treats students as line items that can be deleted to balance a spreadsheet. Spreading the cuts (Option B) treats students as members of a community who share both the benefits and the risks of the program. By choosing Option B with progressive safeguards, we acknowledge that while numbers do count, they do not count in a way that allows us to override the fundamental security of the individuals who make up our university.

  I move that we proceed with drafting the implementation plan for Option B, incorporating the progressive tiering structure outlined above.
