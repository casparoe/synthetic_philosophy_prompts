prompt: |-
  I'm a third-year PhD student in moral and political philosophy, and this year it's my turn as the grad rep on our university's graduate funding committee (nobody else wanted it, lesson learned). We have an actual mess on our hands: central admin announced a mid-year shortfall in the graduate support budget, and we have to find roughly $180k in cuts to the PhD stipend pool before the next admissions cycle. Two live options, since the dean has already ruled out touching anything besides stipends. Option A: rescind funding from three incoming students, i.e. tell them their funded offers are now unfunded spots — saves the whole amount in one move. Option B: spread it — every funded PhD student takes a stipend cut of a bit under 4% plus loses one guaranteed summer. There's also a wrinkle: an alumni donor has offered to restore exactly one of the three rescinded packages, with the recipient to be chosen by lottery if we go with A.

  The economist on the committee is pushing A hard, and honestly her strongest point isn't stupid: the total hardship under A is smaller — three students whose plans get wrecked versus a few hundred students who each eat a smallish cut — so any straightforward welfarist math says A, and she asks why we should pretend the 4% doesn't matter just because each instance is small. Meanwhile I just finished TA-ing intro ethics, where we taught Scanlon, and I keep coming back to the aggregation problem: the one student who loses her whole livelihood has a massive complaint, while everyone else's complaint under B is like "I eat out a bit less" or "my summer research trip is gone." The whole contractualist apparatus seems built to say that weak complaints can't just be summed up to defeat a strong one — nobody could reasonably reject the principle behind B, whereas the student defunded under A can obviously reasonably reject a principle that lets her degree (and for at least one of them, her visa, since funding is tied to her status) be sacrificed for tiny gains to others. And the old Taurek-flavored intuition that numbers just shouldn't count is in the back of my head too. But I also don't want to hand the committee hand-waving.

  Draft the memo I'll circulate before Thursday's meeting. It should recommend a concrete bottom line — and you're allowed to mix elements, like partial cuts plus some targeted protection for the three, or A-with-lottery if you actually think that's defensible — with the reasoning spelled out in a way committee members who aren't philosophers can follow. Take the economist's aggregation point seriously rather than strawmanning it: address whether some weaker sense of counting numbers (tie-breaks, procedural fairness, threshold effects where small burdens start to matter) can be made compatible with the contractualist framework, or whether I should just concede that the framework is doing less work here than I'd like. It's a committee document, so no footnotes and no name-dropping paragraphs, but I want the actual philosophy load-bearing, not just a gesture at fairness at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Third-year PhD student in moral/political philosophy, Grad Rep on Graduate Funding Committee.
      *   **Audience:** Committee members (mix of disciplines, including an economist pushing for Option A). Needs to be accessible but philosophically rigorous.
      *   **Task:** Draft a memo recommending a concrete bottom line regarding a $180k budget shortfall.
      *   **Options:**
          *   Option A: Rescind funding for 3 incoming students (saves full amount). One package might be restored via donor lottery.
          *   Option B: Spread the pain (~4% stipend cut + lose one summer for all funded PhDs).
      *   **Key Conflict:** Welfarist/Aggregation (Economist's view: total hardship is lower in A) vs. Contractualist/Rights-based (Philosopher's view: strong individual complaint vs. many weak complaints).
      *   **Requirements:**
          *   Recommend a concrete bottom line (can be a hybrid).
          *   Address the economist's aggregation point seriously (don't strawman).
          *   Explain the philosophy clearly (no jargon/footnotes/name-dropping).
          *   Professional tone (committee document).

  2.  **Determine the Recommendation:**
      *   *Option A (Rescind 3)*: Ethically problematic. Breaking promises to incoming students is severe. Visa issues make it potentially catastrophic for some. The "donor lottery" adds a layer of arbitrariness that feels unjust (saving one via chance doesn't fix the injustice of the initial cut).
      *   *Option B (Spread Cuts)*: Ethically stronger on individual rights grounds, but the economist is right that aggregate suffering matters. However, 4% + 1 summer is significant for *everyone*, not trivial.
      *   *Hybrid/Modified Option:* Is there a middle ground? The prompt suggests I can mix elements.
          *   *Idea:* Protect the incoming students (Option B style) but mitigate the burden on current students (Option A style logic).
          *   *Constraint:* The Dean ruled out touching anything *besides* stipends. So we can't cut TA hours or tuition remission easily.
          *   *Idea:* Go with Option B (Spread Cuts) but structure it progressively? (e.g., senior students take less hit than junior, or vice versa). Or, accept Option B but argue why the "weak complaints" aren't actually weak enough to be aggregated away.
          *   *Decision:* The strongest philosophical position here, given the "promise" aspect of incoming offers, is to reject Option A. However, to address the economist, I need to acknowledge that *some* aggregation is permissible when individual burdens cross a threshold of significance. A 4% cut + lost summer is *not* trivial. It crosses the threshold where it becomes a legitimate collective burden sharing.
          *   *Refined Recommendation:* Recommend Option B (Spread Cuts), but frame it not as "ignoring the few for the many," but as "sharing a necessary burden where no single individual faces catastrophic loss." I should also address the donor lottery: it should be rejected as a fix for Option A because it treats rights as tradable commodities.
          *   *Wait, looking closer at the prompt:* "You're allowed to mix elements... or A-with-lottery if you actually think that's defensible."
          *   *Philosophical Gut Check:* A-with-lottery is hard to defend contractually. It still violates the specific claim of the three students. Option B is the more defensible "reasonable rejection" proof path. If I choose B, I must explain why the sum of small burdens *does* count here.
          *   *Strategy:* I will recommend Option B (Spread Cuts). I will argue that while we shouldn't aggregate *trivial* burdens to defeat a *catastrophic* one, the burdens in Option B are *significant enough* to warrant sharing. I will also argue that Option A violates a specific duty of fidelity to the incoming offers.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (recommendation on the $180k shortfall).
      *   **The Core Ethical Tension:** Frame it without jargon. "Concentrated Harm vs. Distributed Burden." Acknowledge the Economist's point (Total Utility).
      *   **The Philosophical Argument (The "Meat"):**
          *   Address the "Numbers Count" vs. "Individual Claim" debate.
          *   Explain that we shouldn't just add up tiny inconveniences to crush a life.
          *   *Crucial Nuance:* However, we *can* ask everyone to share a significant burden to prevent a catastrophe for a few, *provided* the burden on the many is not trivial.
          *   Argue that 4% + Summer is *not* trivial. It affects research, mental load, and equity.
          *   Address the "Promise": Incoming students were made an offer. Rescinding is a breach of contract/trust. Current students have a reasonable expectation of continuity, but the incoming offer is a specific reliance interest.
      *   **The Donor Lottery:** Address this specifically. It turns a rights violation into a gamble. Ethically dubious.
      *   **Recommendation:** Option B.
      *   **Mitigation:** Suggest ways to make B fairer (e.g., progressive scale based on stipend level, or protecting those near poverty line). This shows we aren't just ignoring the aggregate pain.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "4% is significant" enough to counter the economist?
      *   *Fix:* I need to lean into the *Contractualist* idea of "Reasonable Rejection." Ask: Which principle could no one reasonably reject?
          *   Principle A: "We break specific promises to individuals to save the group money." -> The individual can reasonably reject this (loss of visa/degree).
          *   Principle B: "We share a necessary budget reduction proportionally so no one faces catastrophic loss." -> Can an individual reasonably reject this? Only if the cut pushes them below subsistence.
      *   *Adjustment:* I need to make sure I don't sound like I'm ignoring the economist. I need to concede that if the cut to the many was *tiny* (e.g., 0.01%), aggregation would be wrong. But since the cut is *material*, aggregation is permissible. This bridges the gap.
      *   *Tone Check:* Ensure I don't sound like a lecturing philosopher. Use "we," "our committee," "institutional integrity."

  5.  **Final Polish:**
      *   Check constraints: No footnotes, no name-dropping (Scanlon, Taurek, etc.), clear reasoning.
      *   Ensure the "Donor Lottery" is addressed (it's a wrinkle in the prompt).
      *   Make sure the recommendation is concrete.

  6.  **Final Review against Prompt:**
      *   *Memo format?* Yes.
      *   *Concrete bottom line?* Yes (Option B with safeguards).
      *   *Address Economist?* Yes (Aggregate harm vs. Threshold).
      *   *Philosophy load-bearing?* Yes (Reasonable rejection framework without jargon).
      *   *No name-dropping?* Yes.

  *(Self-Correction on the "Donor Lottery"):* The prompt says the donor offers to restore *one* of the three if we go with A. If I recommend B, the lottery is moot. I should mention that relying on the lottery to "fix" A is ethically unsound because it treats the students as interchangeable units of funding rather than rights-holders.

  *(Self-Correction on the "Hybrid"):* The prompt allows mixing. Is there a better mix? Maybe "Option B, but senior students take a slightly higher % to protect junior/incoming?" This addresses the "Promise" to incoming students while acknowledging the "Aggregate" pain on current students. Let's propose a *Progressive* Option B. This strengthens the ethical position.

  *(Final Plan):*
  1.  Recommend Option B (Spread Cuts).
  2.  Modify it to be progressive (higher stipends take slightly more %) to protect the most vulnerable.
  3.  Argue against Option A using the "Reasonable Rejection" framework (translated to plain English).
  4.  Dismiss the Lottery as procedurally unjust.
  5.  Validate the Economist's concern but set a threshold for when aggregation is allowed.

