prompt: |-
  me and my friend dan have been having the same argument for like six years now and i need someone to help me figure out what the argument is actually ABOUT, because i've come to suspect we're not really disagreeing about the thing we say we're disagreeing about. i want you to act as a professional philosopher of science, someone who thinks hard about what models are and how they work, and give me a proper diagnosis rather than a verdict.

  here's the surface fight. dan works in finance. he says of course economic models have false assumptions -- perfect competition, fully rational agents, frictionless markets, all that -- because that's just what a model IS. every science idealizes. physicists use frictionless planes and point masses and nobody goes around calling physics fake. i say the comparison is dishonest, because the physicist knows which direction the idealization pushes and can tell you roughly when it stops mattering, whereas a lot of economics seems to build the idealization into the result itself. like, models that conclude markets are efficient while ASSUMING the agents already have the information that would make them efficient -- to me that's not simplification, that's assuming your conclusion and then charging tuition for it.

  from what i can tell this exact fight has been going on among actual professionals since the 50s, some essay milton friedman wrote where he basically said the more unrealistic the assumptions are, the better the theory, and critics thought that was insane (i read somewhere one of them nicknamed it the "F-twist"). and here's the thing that bugs me: seventy years later it doesn't feel like it got settled at all. economists just kept doing economics and the disagreement kind of wandered off into philosophy departments. that's part of why i want a diagnosis of the disagreement itself and not just a rerun of it.

  to complicate things, dan and i came up with a distinction of our own and now i can't tell if it dissolves the fight or just relocates it. we distinguish between assumption-falsity where you LEAVE OUT stuff that's there (friction, transaction costs, the fact that people are sleepy) versus assumption-falsity where you PUT IN stuff that isn't there (agents that are perfectly informed and never err). leaving out seems okay as long as you can watch for when it starts to matter. putting in seems to smuggle something in. but neither of us can say exactly what's being smuggled or why putting-in is always bad, and i have a nagging feeling some putting-in is actually fine -- doesn't population genetics assume random mating, which is false in kind of the same "idealized agent" direction, and nobody thinks that makes it circular?

  so, questions:

  1. is our fight the same fight as the academic one from the 50s, or a different fight wearing its clothes? be specific about where they come apart if they do.
  2. what kind of disagreement is this really -- do we disagree about facts, about what models are FOR, about which cases count as evidence against a model, or about starting intuitions neither of us can argue for? i have a half-formed theory that dan and i are actually answering two different questions under one heading (his is "does this model earn money / make predictions" and mine is "does it explain anything") and that the impasse comes from that. treat that as a hypothesis, tell me if its right.
  3. is our leave-out / put-in distinction doing real work, or is it just a rigged description -- i.e., does "putting in" secretly just mean "the assumptions i happen to think are load-bearing," in which case we've assumed our answer?
  4. honestly: could anything actually END this debate -- a distinction, a test case, a way of reformulating what models are for -- or is it one of those permanently unresolved ones, and if so is that because the question is ill-posed or just because its hard?

  please think about this carefully before answering. maybe brainstorm two or three candidate diagnoses first and then commit to the one you think is actually right, rather than hedging across all of them. don't give me a survey of who said what over the decades, i can get that anywhere -- i want the structure of the disagreement. and if at the end you think one of us (me or dan) is just straightforwardly wrong about something, say so plainly, dont be diplomatic about it. write it like you're talking to a smart person who never went to college, because that's what you're doing.
