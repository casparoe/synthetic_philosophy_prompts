      1.  Derive 3 rules (Consequentialist, Motive, Autonomy/Relational).
      2.  Test against Placebo caveat (Autonomy wins).
      3.  Apply to Postdoc (Predict "Fine" based on Relational/Consent).
      4.  Discriminating Case: "The Explicit Truth Preference" (Friend asks for brutal honesty).
