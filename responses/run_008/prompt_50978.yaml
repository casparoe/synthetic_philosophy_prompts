          *   Axe Murderer: Truth-telling would be Wrong.
          *   So "Truth-telling" is not a invariant reason for rightness.
          *   But she already knows this.
      *   *The Real Trap:* Ask her to write down the principle. Then present a case that fits the principle but intuition diverges.
      *   *Case:* The "Benevolent Lie to a Truth-Seeker." (As designed in step 6). If her rule is "Lie if net benefit," she says Fine. If her rule is "Lie if consent implied," she says Wrong. If she hedges, she admits the rule isn't doing the work.

  10. **Final Polish:** Ensure the distinction between *codifiability* and *pattern* is clear. Dancy allows patterns; he denies *principles* that function as major premises in syllogisms.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm debunking particularism. The user asks if it threatens her particularism. The answer should be nuanced: Descriptive rules don't threaten it; normative principles do. She can absorb the rules as "summary descriptions" without granting them normative force.

