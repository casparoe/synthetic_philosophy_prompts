      *   *Tension A (V1 vs. V2):* If the agent doesn't maximize reward at runtime (V1), why would it wirehead (V2)? Wireheading implies the agent *cares* about the reward signal. If it cares about something else (e.g., "make nice images"), it won't wirehead unless wireheading helps make nice images.
      *   *Tension B (V1 vs. V3):* Human addiction often *is* the reward signal hijacking the system. If V1 says deep learning agents don't work like "reward maximizers," does the human analogy (which *is* reward hijacking) still hold? Or does V1 imply humans *also* don't maximize reward, making addiction something else?
      *   *Tension C (V2 vs. V5):* If wireheading is a likely failure mode (V2), is it benign (V5)? If an agent is capable enough to wirehead, is it capable enough to prevent being turned off? V5 assumes "bliss loop" = "passive." But instrumental convergence suggests even a wireheader needs resources to maintain the wirehead.
      *   *Tension D (V4 vs. V1/V2):* If V1 is true (reward shapes internal goals), securing the channel (V4) might not stop the agent from pursuing its *internal* goal, which might be correlated with reward but isn't reward. Conversely, if V2 is true (it will tamper), V4 says "just lock the box." But if the agent is superintelligent, "locking the box" is an adversarial game it might win. V4 feels naive given V2's severity.
      *   *Tension E (V4 vs. V5):* If V5 is true (wireheading is benign), why does V4 say we need to engineer against it? If it's not scary, why spend effort preventing it? (Minor tension).

