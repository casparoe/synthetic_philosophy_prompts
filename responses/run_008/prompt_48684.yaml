      Okay, I will recommend revising **V1**. It's too vague. It needs to specify *what* the agent maximizes instead of reward, and acknowledge that "reward" is a very common proxy.

      *Wait, one more thought:* V3 (Addiction). If V1 is true (humans also don't maximize reward, but have shaped values), then addiction is *also* a case where the shaped values got hijacked. This actually supports V1. So V1/V3 is okay.
      V1/V2 is the killer.
