answer: |-
  Here is the spec sheet for an interpretation of probability, tailored to your constraint: **ordinary life decision-making under uncertainty.**

  ### The Desiderata (Spec Sheet)

  **1. Single-Case Applicability (Non-Negotiable)**
  *   **The Requirement:** The interpretation must assign meaning to probability statements about unique, non-repeatable events (e.g., "This specific marriage will last," "This patient will survive").
  *   **The Case:** In ordinary life, we rarely face infinite ensembles. We face *now*. If an interpretation says probability *only* applies to long-run frequencies of identical trials, it renders most human decision-making mathematically meaningless.
  *   **Status:** **Non-Negotiable.** If it fails this, it is a theory of statistics, not a theory of rational belief/action for agents.

  **2. Reference Class Transparency (Non-Negotiable)**
  *   **The Requirement:** The interpretation must provide a principled way (or at least an honest admission of the lack thereof) to select the relevant population for a single case.
  *   **The Case:** You are not just "a 47-year-old male." You are a 47-year-old male, smoker, non-smoker, with this genome, in this zip code, with this income. Every change alters the frequency. An interpretation that pretends the "correct" class is obvious is lying.
  *   **Status:** **Non-Negotiable.** It doesn't have to *solve* the problem (nobody can), but it must not pretend the problem doesn't exist.

  **3. Normative Action-Guidance (Non-Negotiable)**
  *   **The Requirement:** It must explain why an agent *should* align their decisions with the probability value, specifically in one-off scenarios.
  *   **The Case:** If the probability is 0.9, why bet on it? If it's a frequency, the long-run payoff doesn't help you if you die on the single trial. If it's a feeling, why trust it over a hunch? There must be a bridge between the number and the bet.
  *   **Status:** **Non-Negotiable.** Probability without decision norms is just numerology.

  **4. Dynamic Updating (Non-Negotiable)**
  *   **The Requirement:** It must account for how the probability value changes when evidence arrives, and why that change is rational rather than arbitrary.
  *   **The Case:** Life is sequential. You get the biopsy result *after* you assess the risk. An interpretation that freezes probability at the moment of utterance without a mechanism for revision is useless for planning.
  *   **Status:** **Non-Negotiable.** (Though note: some interpretations borrow this from logic/Bayes theorem rather than generating it internally).

  **5. Ontological Clarity (Non-Negotiable)**
  *   **The Requirement:** It must state clearly whether the probability is "in the world" (objective) or "in the head" (epistemic).
  *   **The Case:** If I say "There is a 50% chance of rain," am I reporting a physical fact about the atmosphere or my own ignorance? For decision making, this matters. If it's physical, I can't change it. If it's epistemic, I can change it by getting better data. Confusing the two leads to fatal errors (e.g., gambling fallacies vs. information gathering).
  *   **Status:** **Non-Negotiable.** Ambiguity here is a feature of confusion, not depth.

  **6. ML/Non-Agent Calibration (Pet Cause / Derivative)**
  *   **The Requirement:** The interpretation must be able to parse probability claims made by systems that do not have beliefs (like LLMs).
  *   **The Case:** You asked for this. Here is the argument: **Veto it as a metaphysical requirement, keep it as a semantic one.**
      *   *Why Veto:* Demanding an interpretation explain the *internal state* of a transformer model is category confusion. An LLM's "70%" is a token prediction score, not necessarily a probability in any philosophical sense until we map it to one.
      *   *Why Keep:* However, the interpretation *must* define what it means for that output to be **calibrated**. If an interpretation cannot define what it means for a non-believing system to output a "correct" probability (i.e., calibration against frequencies), it fails the "ordinary life" test because we rely on these tools.
      *   *Verdict:* **Derivative.** If you satisfy Single-Case + Normative Action, ML is just a tool that attempts to estimate that value. If the interpretation can't define the *target* of the ML's estimation, the interpretation is too vague.

  ---

  ### The Trilemma (Incompatibilities)

  You asked for pairs that can't be jointly satisfied. There is actually a **Trilemma**. You can have any two of the following three, but not all three:

  1.  **Objective Single-Case Chances:** Probability is a real physical property of this specific event (Propensity).
  2.  **Empirical Testability:** We can verify the probability claim through observation (Frequentism).
  3.  **Action-Guiding for Unique Events:** The number tells you how to bet on the one-off case (Subjectivism/Bayesianism).

  **The Conflict:**
  *   If you want **Objectivity + Testability**, you get **Frequentism**. But you lose Single-Case meaning (you can't test a unique event).
  *   If you want **Objectivity + Single-Case**, you get **Propensity**. But you lose Testability (how do you measure the propensity of *this* atom decaying without looking at other atoms?).
  *   If you want **Single-Case + Action-Guiding**, you get **Subjectivism**. But you lose Objectivity (it's just your belief, not a fact about the world).

  **The "Killer Constraint":**
  **Single-Case Normativity (Requirements 1 + 3 combined).**
  This is the requirement that knocks out the most contenders.
  *   **Is it a bias?** Yes, arguably. It is a **Pragmatic Realist Bias.** It assumes that because we *act* as if single-case probabilities matter, the interpretation must validate that action.
  *   **Hard Frequentists** (like von Mises) would tell you this requirement is nonsense. They would say: "You are deluded. Probability does not apply to your marriage. Stop asking."
  *   **Why keep it?** Because you specified the purpose is "ordinary life." In ordinary life, the Frequentist answer is functionally useless. So, for *your* spec sheet, this is the filter that matters most.

  ---

  ### The Scorecard

  Here is how the Big Three stack up against the Non-Negotiables.

  | Desideratum | **Frequentism** | **Subjectivism (Bayesian)** | **Propensity** |
  | :--- | :--- | :--- | :--- |
  | **1. Single-Case** | **FAIL.** Explicitly denies meaning to single cases. | **PASS.** Beliefs apply to anything. | **PASS.** Physical chances apply to single trials. |
  | **2. Reference Class** | **FAIL.** Defines probability *by* the class; cannot select the class. | **PASS.** Class selection is part of the background knowledge ($K$). | **PARTIAL.** Depends on the physical setup, but still faces class selection. |
  | **3. Action-Guiding** | **WEAK.** Relies on "long run" payoff which doesn't help the single shooter. | **STRONG.** Dutch Book arguments link credence directly to rational betting. | **WEAK.** Why should my bet match a physical propensity I can't measure? |
  | **4. Updating** | **N/A.** Probabilities are fixed constants of the system. | **STRONG.** Built-in (Bayes' Theorem). | **N/A.** Propensities don't change; knowledge of them does. |
  | **5. Ontology** | **Clear.** World (Objective). | **Clear.** Mind (Epistemic). | **Muddy.** World, but unobservable. |
  | **6. ML/Calibration** | **PASS.** Easy to check calibration against frequencies. | **PASS.** Proper scoring rules evaluate credences. | **FAIL.** Hard to calibrate unobservable propensities. |

  ### Summary Verdict

  *   **Frequentism:** Fails your primary constraint (Single-Case/Ordinary Life). It is a theory of data, not a theory of belief. **Discard for your purpose.**
  *   **Propensity:** Solves the "Objectivity" itch but fails the "Action-Guiding" and "Testability" checks. It tells you the chance is real, but not how to find it or why you should bet on it. **Too metaphysical for ordinary life.**
  *   **Subjectivism (Bayesianism):** The only one that passes the "Single-Case" and "Action-Guiding" tests. It admits the probability is in *you*, which solves the Reference Class problem (it's relative to *your* knowledge).
      *   *The Cost:* You lose Objective Truth. You cannot say "The probability *is* 70%." You can only say "Given what I know, 70% is rational."
      *   *For Ordinary Life:* This is the winner. It treats probability as a tool for reasoning, which matches your requirement of "deciding what to believe and how to act."

  **Final Note on the ML Point:**
  Subjectivism handles ML best. An LLM's "70%" is treated as a reported credence. We then test its **calibration** (frequentist check) to see if we should trust that credence. This hybrid approach (Bayesian decision + Frequentist calibration) is the practical standard for ordinary life, even if the philosophers fight over the metaphysics.
