prompt: |-
  I've been going down a philosophy of probability rabbit hole lately (the frequentism vs subjectivism vs propensity fight, plus whatever the bestial "logical probability" stuff is) and honestly before I try to pick a side I want a spec sheet first. Like, what should I be demanding of any interpretation of probability before I bother evaluating it?

  write me the desiderata: what an adequate interpretation of probability has to deliver, with the case behind each requirement, and mark which ones are non-negotiable and which are just pet causes of one camp. For purpose, fix it as: the interpretation should be good enough for a person (or an institution) deciding what to believe and how to act under uncertainty in ordinary life, not just for foundations of statistics textbooks. So everything should be judged relative to that.

  Some things I'd want on the list, though add or veto as you see fit and tell me why:

  - it has to assign coherent probabilities to single, unrepeatable events (this atom decays in the next hour, this patient survives the surgery, my marriage lasts). if an interpretation only really makes sense for repeatable trials under stable conditions, that seems like a fatal shortfall, but maybe you disagree
  - it has to say something about the reference class problem without pretending it away -- when I'm the 47-year-old with this specific tumor, which population grounds my probability?
  - it has to explain updating: when new evidence arrives, what is it that changes, and why is changing it rational? does the interpretation itself owe an account of learning, or can it borrow one?
  - it has to explain why probabilities are action-guiding at all -- why matching your credences to chances (or to frequencies, or to whatever) is supposed to pay off, especially when you only get one shot at the decision
  - and here's one I suspect is genuinely new to the list: verbalized probabilities from ML systems. when a language model says it's "70% confident" in an answer, what interpretation of probability makes that even a probability? It's not a frequency in any obvious sense, it doesn't seem to be a propensity, and the model arguably has no degrees of belief in the philosophically loaded sense. Do we need the interpretation to accommodate this kind of probability-ish output, or is that someone else's problem (calibration, measurement, whatever)? I genuinely don't know, argue it either way

  The part I care most about: flag any pairs of desiderata you suspect can't be jointly satisfied -- like whether you can have both objective single-case chances and some kind of empirical testability without smuggling in frequencies. If a subset of the list is jointly unsatisfiable, say so plainly, because then the list itself is the interesting result. Also tell me which single requirement does the most to knock out the standard contenders, and whether that requirement is a real constraint or just me smuggling in a bias.

  Then, briefly, run frequentism, subjectivism/Bayesianism, and propensity views against the list. Keep the scorecard short though -- the criteria are where the thinking is, the scoring is bookkeeping. no reading lists, I've got those.
