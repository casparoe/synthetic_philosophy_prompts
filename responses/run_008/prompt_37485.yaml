prompt: |-
  In France, Germany, and Italy, surrogacy is prohibited outright — even altruistic, uncompensated arrangements are void and in some of these countries punishable — while several American states, California most prominently, treat commercial surrogacy contracts as enforceable and resolve disputes by the intent of the contracting parties rather than by who gave birth. Meanwhile, some European countries that ban surrogacy permit women to be compensated, sometimes substantially, for donating eggs. What theory of the body, of motherhood, or of commodification does the absolute European ban presuppose? Note the pressure points: an exploitation rationale struggles to explain the ban on unpaid surrogacy; a general market-inalienability of the body struggles to explain compensated egg donation; and a view on which gestation creates an inalienable maternal bond must say what it is about nine months of gestation that differs in kind from providing the egg that becomes the child, given that the intended mother in a gestational arrangement typically has no genetic tie at all. Reconstruct the implicit theory as precisely as you can, distinguishing what the ban strictly presupposes from what it merely coheres with, say where the European pattern is internally consistent and where it is not, and explain what would have to change — in the surrogacy bans, in the egg-donation rules, or in the American contract-enforcement regime — if the presupposed view were replaced by a consent-and-contract view of the body's services. Please answer in American English.
