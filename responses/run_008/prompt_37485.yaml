answer: |-
  The legal landscape you describe reveals a profound philosophical divergence regarding the nature of human reproduction. The absolute bans on surrogacy in France, Germany, and Italy, juxtaposed with the permissibility of compensated egg donation, presuppose a specific theory of the body and motherhood that is neither purely anti-market nor purely biological. To reconstruct this implicit theory, we must look beyond simple arguments about exploitation or commodification and examine the ontological status assigned to gestation.

  ### The Implicit Theory: Gestational Integrity and the Inalienability of Status

  The absolute European ban presupposes a theory of **Gestational Integrity**. Under this view, pregnancy is not merely a biological service or a temporary physical condition; it is a constitutive process of personhood that creates an indissoluble moral and legal status.

  **1. Strict Presuppositions**
  Strictly speaking, the ban presupposes that **legal motherhood is an effect of gestation that cannot be waived by prior consent.** This is a rejection of the "intent-based" parenthood model used in California. In the European view, the act of giving birth (*mater semper certa est*) generates a status (motherhood) that is attached to the person by operation of law and nature, not by contract. Therefore, a contract attempting to sever this link *ex ante* is void because it attempts to alienate a status that is inalienable. The ban strictly requires that the biological reality of birth trumps the contractual reality of intent.

  **2. What the Ban Merely Coheres With**
  The ban coheres with, but does not strictly require, the following beliefs:
  *   **Anti-Commodification:** It fits with a view that reproduction should not be commercialized. However, because altruistic surrogacy is also banned, this is not a strict requirement.
  *   **Genetic Essentialism:** It fits with the idea that biology matters. However, because gestational surrogacy (where the carrier is not the genetic mother) is banned, the theory actually prioritizes *gestational* biology over *genetic* biology.
  *   **Protection of Vulnerable Parties:** It coheres with a paternalistic desire to protect women from coercion. Yet, by banning unpaid arrangements, it suggests the protection is against the *act itself*, not just the *terms* of the act.

  ### Addressing the Pressure Points

  The European pattern appears inconsistent only if one assumes the governing logic is about "selling body parts" or "preventing exploitation." The theory of Gestational Integrity resolves these pressure points by drawing a categorical distinction between **tissue** and **function**, and between **assistance** and **substitution**.

  **1. The Exploitation Rationale and Unpaid Surrogacy**
  If the ban were solely about preventing the exploitation of women through financial coercion, altruistic surrogacy would be permitted. The fact that it is not indicates that the European view treats surrogacy as an **intrinsic wrong**, not an instrumental one. The theory holds that turning a child into an object of delivery and a woman into a vessel violates human dignity (*ordre public*), regardless of whether money changes hands. The violation lies in the fragmentation of the maternal role, not the price tag attached to it.

  **2. Market-Inalienability and Compensated Egg Donation**
  If the body is inalienable, why allow compensated egg donation? The Gestational Integrity theory distinguishes between **separable biological material** and **inseparable biological process**.
  *   **Eggs:** Viewed as tissue. Once extracted, they are separate from the donor. Compensation is framed as reimbursement for time, discomfort, and risk, or as a "gift" with financial acknowledgment. It is an act of *assistance* to another couple's reproduction.
  *   **Gestation:** Viewed as a function of the person. One cannot separate the pregnancy from the pregnant woman. To contract for gestation is to rent the person, not just use a part. Furthermore, surrogacy is viewed as *substitution*—the intended mother does not carry the child. Egg donation allows the intended mother to carry the child (if she has a uterus), preserving the gestational bond. Thus, egg donation coheres with the theory because it supports the intended mother's gestational role, whereas surrogacy usurps it.

  **3. Gestation vs. Genetics**
  The theory posits that gestation creates a bond of a different *kind* than genetics. Genetics provides the blueprint; gestation provides the environment and the physical connection that constitutes "bearing." In the European view, the labor of gestation is not "work" that can be contracted out; it is the very process that creates the mother-child dyad. Even if the surrogate has no genetic tie, her physiological engagement with the fetus creates a moral claim that cannot be signed away. This explains why gestational surrogacy is banned: the law protects the gestational bond over the genetic intent.

  ### Internal Consistency and Inconsistency

  **Where the Pattern is Consistent:**
  The European framework is internally consistent regarding the **primacy of the gestational mother.** Whether the arrangement is commercial or altruistic, the law refuses to recognize a mother who did not give birth. It consistently upholds the principle that motherhood is a status derived from physical birth, not a contractual obligation derived from genetic intent.

  **Where the Pattern is Inconsistent:**
  The inconsistency lies in the **valuation of bodily contributions.** If the concern is the commodification of human life, compensated egg donation is a significant loophole. High compensation for eggs arguably commodifies the genetic blueprint of a future child more directly than surrogacy commodifies the environment. The European distinction relies on a somewhat unstable metaphysical line: that selling "parts" (eggs) is acceptable while selling "processes" (pregnancy) is not, even though the process is often undertaken to implant the parts. This suggests the ban is less about commodification and more about preserving the traditional social structure of the family unit, where one woman (the wife/partner) gestates.

  ### The Shift to a Consent-and-Contract View

  If the presupposed view of Gestational Integrity were replaced by a **Consent-and-Contract view** (the dominant American libertarian-liberal model), the following changes would occur:

  **1. Surrogacy Bans (Europe)**
  *   **Change:** The bans would be lifted. Altruistic and commercial surrogacy would become legal.
  *   **Mechanism:** Contracts would become enforceable. The "intent of the parties" would determine parentage, overriding the status of birth. Pre-birth orders would be issued to intended parents.
  *   **Philosophical Shift:** The body becomes a vessel of autonomy. A woman's right to dispose of her reproductive labor is paramount. The state's role shifts from protecting the "sanctity of motherhood" to ensuring the validity of consent.

  **2. Egg-Donation Rules (Europe)**
  *   **Change:** Regulations would likely shift from "compensation for expenses" to explicit market pricing or standardized service contracts.
  *   **Mechanism:** The distinction between "gift" and "sale" would dissolve. Donors could negotiate terms based on traits, scarcity, and risk.
  *   **Philosophical Shift:** Eggs would be fully recognized as property or alienable services. The current tension between prohibiting surrogacy (to prevent commodification) while allowing egg compensation would vanish, as commodification would no longer be the primary ethical hurdle.

  **3. American Contract-Enforcement Regime (California)**
  *   **Change:** While the US already operates on a consent-and-contract basis, adopting the *pure* philosophical underpinning of this view would likely lead to **stricter scrutiny of consent** rather than looser regulation.
  *   **Mechanism:** Currently, US law enforces contracts robustly. A pure consent-and-contract theory, however, acknowledges that for a contract to be valid, consent must be informed and free of duress. This could lead to more rigorous independent legal counsel requirements, psychological screening, and perhaps "cooling-off" periods for surrogates, treating them more like high-stakes contractors whose autonomy must be protected to ensure the contract's validity.
  *   **Philosophical Shift:** It would move away from the current hybrid where contracts are enforced but some states still hesitate (public policy exceptions). It would solidify the view that reproductive labor is work, subject to labor protections and contract law, rather than a unique moral category exempt from market norms.

  ### Conclusion

  The absolute European ban presupposes that **gestation is a status-constituting act that is inalienable.** It is not a rejection of markets per se (as egg donation shows), but a rejection of the idea that motherhood can be fragmented into genetic and gestational components and distributed by contract. The ban strictly requires that birth determine motherhood, regardless of intent. Replacing this with a consent-and-contract view would dismantle the distinction between "parts" and "process," legalizing surrogacy in Europe and potentially strengthening the labor protections for surrogates in the US, fundamentally shifting the definition of the body from a vessel of dignity to a vessel of autonomous will.
