      *   **The "Weaker" Claim:** "Conservatives see more of the moral terrain."
          *   *Analysis:* "Terrain" implies the terrain exists independently. If the terrain is *made* by the hikers (constructivism), then conservatives aren't seeing more terrain; they are *building* more of it.
