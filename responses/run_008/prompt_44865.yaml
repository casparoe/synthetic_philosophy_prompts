  Dear Colleague,

  I am writing to share a clinical vignette I have developed for our upcoming seminar on the naturalism versus normativism debate, specifically designed to force a verdict swap between the biostatistical theory and the harmful-dysfunction analysis without relying on contrived syndromes. The scenario involves a seventy-five-year-old male presenting for a routine Medicare annual wellness visit, feeling generally well but concerned about two incidental findings discovered during the workup. The first finding is asymptomatic cholelithiasis, where an abdominal ultrasound reveals multiple gallstones, yet the patient reports no pain, his liver enzymes are normal, and there is no evidence of biliary obstruction or inflammation. The second finding is moderate bilateral sensorineural hearing loss, confirmed by audiometry, which the patient admits makes conversation difficult in noisy rooms though he considers it just part of getting old. These two findings are clinically independent, one gastrointestinal and one sensory, allowing us to evaluate them separately while keeping the patient context constant.

  When we apply the biostatistical theory to the gallstones, the verdict is disease because the presence of stones represents a structural and functional deviation from the statistical norm of a healthy reference class, indicating a subnormal efficiency of the biliary system regardless of symptoms. However, the harmful-dysfunction analysis counts this same finding as not a disease because, while the stones may indicate a dysfunction in bile chemistry, the condition currently causes no harm, pain, or disability, and Wakefield's framework requires actual harm to convert a dysfunction into a disorder. Conversely, when we apply the biostatistical theory to the hearing loss, the verdict is not a disease because, within the reference class of seventy-five-year-old males, moderate hearing loss is statistically typical and thus represents normal aging rather than a failure of species-typical design. The harmful-dysfunction analysis reverses this verdict to disease because the hair cell death constitutes a failure of the auditory mechanism to perform its evolved function, and the resulting communication difficulty and social isolation constitute a clear harm to the patient.

  The single design feature doing most of the work in this case is the deliberate dissociation between statistical frequency and normative harm across the two findings. I have selected one condition that is statistically abnormal but harmless, and another that is statistically normal but harmful. If you remove this feature by aligning frequency and harm, such as choosing a condition that is both statistically rare and harmful like pneumonia, or both statistically common and harmless like a benign birthmark, the swap disappears and both theories converge on the same verdict, either both declaring disease or both declaring health. This alignment reveals that the disagreement between the theories is not about the ontology of the conditions themselves but about whether disease status should track statistical deviation or experienced harm.

  The strongest line of attack available to the defender of the biostatistical theory against the hearing loss verdict is to argue that medicalizing normal aging drains resources from genuine pathologies and that treating a condition does not ontologically make it a disease, but rather a disability or social problem that medicine can assist with without classifying it as a biological malfunction. The strongest line of attack available to the defender of the harmful-dysfunction analysis against the gallstones verdict is to argue that excluding risk factors from disease status is dangerous, as asymptomatic stones carry a significant probability of future acute harm, and defining disease solely by current harm ignores the preventive mandate of modern medicine which treats probabilities rather than just actualized injuries. I hope this case provides the clean theoretical friction you need for the seminar.

  Sincerely,

  A Fellow Philosopher
