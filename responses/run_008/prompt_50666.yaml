answer: |-
  You have identified a genuine gap in the lexicon. While the phenomenon is well-documented in disinformation studies, communication theory, and memetics, there is no single, canonical term equivalent to the "Streisand Effect" that specifically captures **amplification via authoritative correction.**

  Most journalists and researchers currently stitch together existing concepts to describe it. However, none of them fit your criteria precisely. Here is an analysis of the existing landscape, followed by a proposed coinage that meets your need for precision.

  ### 1. The Existing Landscape (and why they fall short)

  You are correct to rule out the *Streisand Effect* and the *Backfire Effect*. Here are the concepts that come closest, along with their limitations:

  *   **The Illusory Truth Effect:**
      *   *Definition:* The psychological phenomenon where repetition increases perceived truthfulness.
      *   *Relevance:* This is the *mechanism* inside the audience's head. When a debunk repeats the claim ("No, vaccines do not contain microchips"), the familiarity of the claim increases, potentially making it feel truer later.
      *   *Limitation:* This describes a cognitive bias, not the **transmission dynamic** or the **strategic courtship** by the bad actor.
  *   **Mainstreaming (Cultivation Theory):**
      *   *Definition:* The process by which fringe ideas enter the mainstream discourse through repeated media exposure.
      *   *Relevance:* Describes the *outcome* (the claim becomes normalized).
      *   *Limitation:* It doesn't specify that the *vector* is the debunking itself. Mainstreaming can happen through sympathetic coverage or algorithmic drift.
  *   **Antibody-Dependent Enhancement (ADE) — *The Virological Analogy*:**
      *   *Definition:* In virology, a scenario where antibodies bind to a virus but fail to neutralize it, instead facilitating its entry into host cells and worsening the infection.
      *   *Relevance:* This is the most robust conceptual model for what you are describing. The "antibodies" (fact-checkers/scientists) attempt to neutralize the "virus" (misinformation), but their intervention inadvertently helps it infect new hosts.
      *   *Limitation:* This is an analogy used in metaphorical passing (e.g., by researchers like Renée DiResta or in "prebunking" literature), not an established sociological term.
  *   **Unintended Amplification:**
      *   *Definition:* A descriptive phrase often used in media studies.
      *   *Limitation:* It is passive. It fails to capture the **active courtship** you noted (where bad actors *send* material to journalists hoping for a refutation).

  ### 2. A Proposed Coinage: "The Refutation Dividend"

  Since no established term captures the **transactional nature** (the fringe "invests" in a claim to "earn" the payout of a debunk), I propose you use **The Refutation Dividend**.

  This term distinguishes the phenomenon from general "bad publicity" by specifying the *source* of the value (the refutation) and the *nature* of the gain (a yield on investment).

  #### Definition
  > **The Refutation Dividend** is the increase in reach, legitimacy, or distribution a fringe claim gains specifically through the act of its authoritative correction. It occurs when bad actors strategically design misinformation to trigger institutional debunking, treating the rebuttal not as a penalty, but as a high-bandwidth distribution channel.

  #### Why this works for your article:
  1.  **It captures the incentive:** A "dividend" implies a return on investment. It highlights that the bad actors are *courting* the debunk as a yield-generating asset.
  2.  **It identifies the vector:** It specifies that the *refutation* is the payment mechanism, distinguishing it from general viral spread.
  3.  **It avoids psychological confusion:** Unlike "Backfire Effect," it does not imply the audience believes the lie; it implies the lie has simply *traveled further*.

  ### 3. Differentiation Table

  To ensure your readers (or editors) don't collapse this into existing concepts, you can use this distinction:

  | Concept | Mechanism | Intent of Actor | Outcome |
  | :--- | :--- | :--- | :--- |
  | **Streisand Effect** | Suppression draws attention. | Actor tries to **hide** the info. | Info becomes visible. |
  | **Backfire Effect** | Correction reinforces belief. | Actor defends the claim. | Audience **believes** the claim. |
  | **Bad Publicity** | Negative attention creates fame. | Actor accepts negative tone. | Actor gains **celebrity**. |
  | **Refutation Dividend** | **Correction distributes the claim.** | Actor **provokes** the correction. | Claim gains **reach/legitimacy**. |

  ### 4. Contextual Usage in Journalism

  If you adopt this term, it pairs well with the emerging concept of **"Prebunking"** (or *attitudinal inoculation*).

  *   **The Problem:** Debunking pays a *Refutation Dividend* to the liar.
  *   **The Solution:** Prebunking warns people about the *tactic* before they encounter the claim, denying the liar the dividend.

  **Example Sentence for your Article:**
  > "When the study was published, the authors expected to quell the rumor. Instead, they paid a **Refutation Dividend**: by engaging with the claim, they broadcast it to millions of people who would otherwise never have encountered it, precisely as the claim's architects had intended."

  ### 5. Academic Precedent (For your notes)

  While the term "Refutation Dividend" is not yet canonical, the dynamic is acknowledged in specific literature:
  *   **Porter & Wood (2019)** discuss the "global effectiveness of fact-checking" but note the risk of **"amplification via correction."**
  *   **Zeynep Tufekci** has written on **"algorithmic amplification,"** noting that engagement (even negative engagement) drives distribution.
  *   **Sander van der Linden** (Cambridge Social Decision-Making Lab) utilizes the **inoculation theory** framework, which implicitly acknowledges that traditional debunking can function as a vector if not handled carefully.

  ### Summary Recommendation
  Use **"The Refutation Dividend."** It is precise, evocative, and accurately captures the economic/strategic incentive structure you identified. It allows you to discuss the *systemic* failure of the debunking model without implying the fact-checkers are incompetent or the audience is irrational.
