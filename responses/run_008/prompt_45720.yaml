prompt: |-
  I'm writing a novel where a minor character, Dr. Okonkwo, is an ethicist on some UN-adjacent committee that reviews space settlement proposals, and I want her to stay consistant across the book. Her track record so far: she approved a small international lunar research base; she voted down a Mars terraforming program on the grounds that it could wipe out any native microbes before we've even looked; she approved a privately funded orbital seed-and-data vault meant as a backup for Earth's biosphere; and she rejected a corporate Mars town where children born there would inherit company contracts they couldn't buy their way out of. Now in the chapter I'm drafting a new proposal lands that I honestly can't figure out her position on: a generation ship to another star, crewed entirely by adult volunteers, but their kids will be born mid-flight into a mission they never chose and physically cannot leave. The funding comes from billionaires who insist they'd otherwise spend it on yachts, not on foreign aid. What would she rule, if she wants to be consistent with herself? As far as I can tell at least three rules fit her record — an exit-rights/consent rule, a don't-divert-resources-from-Earth's-problems rule, and a don't-harm-biospheres rule — and they pull in different directions here, so I'd also like to know which rule you think she's really running and why, plus one more proposal I could slip into an earlier chapter that would settle which of those it is. Answer in American English please, and don't worry about spoiler-free, she's not the narrator.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Request:**
      *   **Character:** Dr. Okonkwo, an ethicist on a UN-adjacent space settlement committee.
      *   **Goal:** Determine her ruling on a new proposal (Generation Ship) to maintain consistency, identify her core ethical principle, and suggest a previous case to clarify that principle.
      *   **Track Record:**
          1.  *Approved:* Small international lunar research base. (Low impact, scientific, temporary/rotational?)
          2.  *Rejected:* Mars terraforming. (Planetary protection, potential harm to native life, irreversible.)
          3.  *Approved:* Orbital seed/data vault. (Preservation, backup, no permanent population, passive.)
          4.  *Rejected:* Corporate Mars town. (Indentured servitude, lack of consent/exit rights for children.)
      *   **New Proposal:** Generation Ship to another star. Adult volunteers, children born mid-flight (no consent, no exit). Funded by billionaires (opportunity cost vs. yacht spending).
      *   **Constraints:** American English, no need for spoiler protection (she's not the narrator).
      *   **Key Conflict:** Three potential rules seem to apply but conflict:
          1.  Exit Rights/Consent (Children born on ship = violation?).
          2.  Resource Diversion (Billionaire money = okay? Or should it go to Earth?).
          3.  Biosphere Harm (Interstellar space = no native life to harm?).

  2.  **Deconstruct the Track Record to Find the Core Principle:**
      *   *Lunar Base (Approved):* Adults, temporary, scientific, international (public good). No permanent population created.
      *   *Mars Terraforming (Rejected):* Irreversible change, potential destruction of native life (even microbes). *Key:* Protection of the *other*.
      *   *Seed Vault (Approved):* Passive preservation. No people living there permanently. No consent issues.
      *   *Corporate Mars Town (Rejected):* Permanent population, children born into bondage, no exit. *Key:* Human rights/autonomy of the next generation.

      *   *Pattern Recognition:*
          *   She seems okay with adults taking risks (Lunar base volunteers).
          *   She seems okay with passive objects in space (Seed vault).
          *   She draws the line at *permanent human settlement that compromises the autonomy of the next generation* (Corporate Mars) OR *irreversible harm to potential alien life* (Mars Terraforming).
          *   The Resource Diversion rule is weak. The Seed Vault was approved (resources used), and the Billionaire funding argument ("otherwise yachts") suggests the money *isn't* coming from foreign aid budgets. So, the "Don't divert resources" rule is likely a red herring or secondary to *how* the resources are used, not *that* they are used.

      *   *The Core Conflict:* The Generation Ship hits the "Corporate Mars" nerve (children born without consent/exit) but avoids the "Mars Terraforming" nerve (no native life to harm in interstellar space/destination unknown) and the "Resource" nerve (billionaire money).

      *   *Which Rule is Dominant?*
          *   If she rejected the Corporate Mars town because children were born into contracts they couldn't escape, she must logically reject the Generation Ship because children are born into a mission they can't escape.
          *   *However*, there's a nuance. The Corporate Mars town was *exploitation* (profit-driven bondage). The Generation Ship is *survival/exploration* (species backup).
          *   But looking at the Seed Vault (backup for biosphere) vs. Corporate Town (exploitation), she likes "backup" concepts *if* they don't involve trapped people.
          *   *Hypothesis:* Her core principle is **Intergenerational Consent / The Right to an Open Future.**
          *   She approves things where the next generation can choose their own path (Lunar base staff return to Earth; Seed vault has no people). She rejects things where the next generation is pre-determined (Mars contracts; Ship life).

  3.  **Determine the Ruling on the Generation Ship:**
      *   *Strict Consistency:* She should **Reject** it.
      *   *Reasoning:* The children born on the ship are in the exact same ethical position as the children in the Corporate Mars Town. They are born into a life they did not choose with no physical ability to leave (exit rights). The fact that the adults volunteered doesn't grant them the right to volunteer their unborn children for a one-way trip.
      *   *Counter-argument (for drama):* She could approve it with heavy stipulations (e.g., the ship must have the capacity to turn around or settle somewhere else, or the education must prepare them for Earth life if they return). But a generation ship *to another star* implies no return.
      *   *Decision:* Rejection is the stronger, more consistent choice based on the Corporate Mars precedent. It highlights her commitment to human autonomy over species expansion.

  4.  **Identify the "True" Rule:**
      *   Rule 1 (Exit Rights/Consent): Strongest fit. Explains Corporate Mars (Reject) and Lunar Base (Approve - adults return).
      *   Rule 2 (Resource Diversion): Weakest fit. Billionaire money vs. Yachts makes this moot. Seed Vault used resources too.
      *   Rule 3 (Biosphere Harm): Strong for Mars Terraforming, but irrelevant for Interstellar space.
      *   *Conclusion:* Her driving philosophy is **The Non-Aggression Principle applied to the Unborn.** She prioritizes the autonomy of future citizens over the ambitions of current ones. She is a guardian of the *next* generation's rights.

  5.  **Design the "Tie-Breaker" Proposal (Earlier Chapter):**
      *   Need a case that separates "Resource Diversion" from "Intergenerational Consent."
      *   *Idea:* A proposal that uses Earth money (bad for resource rule) but respects consent (good for consent rule), OR uses private money (good for resource rule) but violates consent (bad for consent rule).
      *   *Better Idea:* A case where biosphere harm is low, resources are private, but the *human* element is tricky.
      *   *Proposal:* A private orbital habitat (O'Neill cylinder) funded by tech moguls.
      *   *Scenario:* Adults live there, but they maintain a "return ticket" guarantee funded by an escrow account, and children are educated on Earth culture and have the right to demand return transport at age 18.
      *   *Outcome:* She **Approves** this.
      *   *Why:* This clarifies that she *doesn't* hate space living or private money. She hates *trapping* the next generation. If the earlier chapter shows her approving a private space station *because* the kids can leave, it cements that the Generation Ship (where kids *can't* leave) must be rejected.
      *   *Alternative Tie-Breaker:* A proposal to fund Earth-based poverty alleviation using space budget. If she votes *against* diverting space budget to Earth, it kills the "Resource Diversion" rule.
      *   *Let's go with the "Orbital Habitat with Exit Rights" idea.* It directly parallels the Generation Ship but changes the variable of "Exit."

  6.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, helpful for a writer.
      *   *Structure:*
          1.  The Ruling (Reject).
          2.  The Core Principle (Intergenerational Autonomy).
          3.  Why the other rules are secondary.
          4.  The Tie-Breaker Proposal (The Orbital Habitat).
      *   *Refining the Logic:* Make sure to address the "Billionaire/Yacht" argument. Okonkwo likely dismisses this as irrelevant. Ethics isn't about where the money *would* go, but what the money *does*.
      *   *Refining the Generation Ship nuance:* Maybe she doesn't just say "No." Maybe she says "No, unless..." (e.g., genetic engineering to allow them to survive elsewhere? No, that's too sci-fi). Stick to "No." It's punchier for a character trait.
      *   *Wait, one nuance:* The Mars Terraforming rejection was about *alien* life. The Corporate Mars rejection was about *human* rights. Which is more important to her? Usually, in sci-fi ethics, the "Prime Directive" (alien life) vs. "Human Rights" is a classic conflict. Given she approved the Seed Vault (Earth biosphere backup), she cares about Earth. Given she rejected Corporate Mars, she cares about human liberty.
      *   *Synthesis:* She is a **Deontologist regarding Human Rights**, and a **Preservationist regarding Alien Life.** But Human Rights trump Expansion.
      *   *The Tie-Breaker:* Needs to show she cares more about Consent than Resources.
      *   *Proposal:* "Project Lifeline." A proposal to use UN space funds to launch food to a famine zone. If she votes *No* (because space funds are for space), that proves she isn't an "Earth First" resource diverter. If she votes *Yes*, she is.
      *   *Actually, the "Orbital Habitat with Exit Rights" is better.* It isolates the "Consent" variable.
      *   *Let's refine the Tie-Breaker:* A proposal for a **Private Lunar Resort**. Adults only. Strict ban on pregnancy.
      *   *If she Approves:* It proves she's okay with private space stuff and adults taking risks, provided no children are trapped.
      *   *If she Rejects:* It means she hates private space stuff.
      *   *Let's go with:* **The "Helen Station" Orbital Habitat.** Private funding. Adults + Kids. *But* there is a guaranteed, funded return shuttle for any child who turns 18 and wants to go to Earth.
      *   *Ruling:* **Approved.**
      *   *Why:* This proves the "Exit Right" is the golden key. The Generation Ship has no exit. Therefore, Generation Ship = Rejected.

  7.  **Final Polish:** Check American English spelling/idioms. Ensure the distinction between the rules is clear. (Self-Correction: Make sure to explicitly address the "Billionaire/Yacht" argument in the ruling explanation).

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is a breakdown of how Dr. Okonkwo should rule, the core principle driving her, and a specific earlier case you can insert to lock that principle in place.

  ### The Ruling: Rejection
  Dr. Okonkwo should **vote against** the Generation Ship proposal.

  To maintain consistency with her track record, this is the only logical move. Here is the reasoning she would likely articulate in the committee room:

  1.  **The "Corporate Mars" Precedent:** Her rejection of the corporate Mars town is the smoking gun. She rejected it not because it was on Mars, and not because it was corporate, but because children born there would inherit contracts they could not void. That is a violation of **intergenerational consent**. A generation ship is the ultimate version of this: the children are not just bound by a contract; they are bound by physics. They have zero exit rights.
  2.  **The "Yacht" Argument is Irrelevant:** Okonkwo is an ethicist, not an economist. The argument that the billionaires would otherwise spend the money on yachts is a "counterfactual" that she would dismiss. Her job is to evaluate the proposal *as it stands*, not to compare it to a hypothetical waste of funds. If the proposal is unethical, it doesn't become ethical just because the alternative is frivolous spending.
  3.  **The Biosphere Rule is Secondary:** While she rejected terraforming to protect potential microbes, she approved the seed vault to protect Earth's biosphere. This shows she values life, but she prioritizes *human autonomy* over *biological expansion*. If she cared more about spreading life than protecting rights, she would have approved the Corporate Mars town (more humans = good). She didn't.

  **Her Verdict:** "We cannot authorize a mission that creates a caste of humans whose entire existence is defined by a choice they did not make. The adults are volunteers; their children are conscripts."

  ### Her Core Principle: The Right to an Open Future
  You identified three potential rules, but only one is actually running the show.

  *   **Rule 1 (Exit Rights/Consent):** **This is the winner.** Every approval she gave involves adults who can return to Earth (Lunar Base) or no people at all (Seed Vault). Every rejection involves people (specifically children) who are trapped (Corporate Mars).
  *   **Rule 2 (Resource Diversion):** **This is a red herring.** She approved the Seed Vault, which cost resources. She is likely to approve private funding as long as it doesn't create ethical hazards. She isn't trying to solve Earth's poverty; she is trying to prevent space from creating new forms of slavery.
  *   **Rule 3 (Biosphere Harm):** **This is situational.** This rule only activates when there is a *potential* alien ecosystem (Mars). In interstellar space, this rule is dormant.

  **Why this makes her interesting:**
  Dr. Okonkwo isn't a "Space is Bad" Luddite. She is a **Humanist Guardian**. She believes space is fine for adults who take risks, but it becomes unethical the moment it imposes those risks on the next generation without their consent. She views the future not as a destination to be conquered, but as a group of people to be protected.

  ### The Tie-Breaker Proposal
  To make sure the reader (and you) knows exactly which rule she follows before the Generation Ship chapter hits, slip this case into an earlier chapter.

  **The Proposal:** "The Helios Orbital Habitat."
  **The Pitch:** A privately funded luxury station in Earth orbit. It allows permanent residency for families.
  **The Catch:** The developers know children will be born there. To mitigate this, they have established a legally binding "Age-of-Majority Escape Clause." Every child born on Helios is granted a trust fund that guarantees them a free return ticket to Earth and full citizenship rights upon turning 18, no questions asked.
  **The Funding:** Private venture capital (no Earth aid money diverted).

  **Dr. Okonkwo's Ruling:** **Approved.**

  **Why this settles it:**
  *   **It kills the Resource Rule:** It's private money, so if she voted "No," it would mean she hates private space ventures. By voting "Yes," she shows she's okay with capitalism in space.
  *   **It kills the Biosphere Rule:** It's in orbit, no microbes to hurt.
  *   **It isolates the Consent Rule:** This is the key. She approves Helios *specifically because* of the Escape Clause.

  **How to write it:**
  Have a scene where a committee member argues, "But Dr. Okonkwo, isn't this still risky for the children?" And she replies, "Risk is permissible. Indenture is not. As long as they have a ticket home, they are citizens, not cargo."

  When the Generation Ship proposal comes up later, the contrast will be sharp. The Generation Ship has no ticket home. The reader will immediately understand why she votes "No" without you needing to over-explain it, because you already showed her voting "Yes" on the exact same concept *with* an exit strategy.
