answer: |-
  # Joint Statement on Population Ethics and the Repugnant Conclusion

  **Preamble:** This document represents the current state of an adversarial collaboration between a proponent of Total Utilitarianism (TU) and a proponent of a Person-Affecting View (PAV). We agree on the definitions of the problems we face and the logical implications of our respective positions, even where we cannot agree on their moral truth.

  ### I. Agreed Claims

  1.  **Definition of the Repugnant Conclusion:** We agree that the Repugnant Conclusion asserts that for any possible population of at least ten billion people, all with a very high quality of life, there must be some much larger imaginable population whose existence, if other things are equal, would be better, even though its members have lives that are barely worth living.
  2.  **The Sadistic Conclusion:** We agree that the Sadistic Conclusion is a test case intended to show that certain aggregative views imply it can be better to add people with negative welfare (suffering) than people with positive welfare, and we agree this is widely regarded as a counterintuitive result that any viable theory should ideally avoid or explain away.
  3.  **The Non-Identity Problem:** We agree that the Non-Identity Problem demonstrates that actions which change *who* comes into existence cannot be said to harm the resulting individuals if their lives are worth living, thereby complicating any moral view that relies exclusively on "harm to particular people" to condemn the creation of miserable lives.
  4.  **Totalist Concessions:** The Totalist concedes that the Repugnant Conclusion follows logically from the principle that value is the sum of wellbeing across all lives. The Totalist further concedes that this conclusion conflicts with strong, pre-theoretical moral intuitions held by most people, including themselves prior to theoretical commitment.
  5.  **Person-Affecting Concessions:** The Person-Affecting proponent concedes that the Non-Identity Problem makes it difficult to articulate why creating a person with a life barely worth living is "bad for" that person, given that the alternative for that person is non-existence. The Person-Affecting proponent further concedes that their view struggles to explain why it is wrong to create miserable lives if those lives are not "worse for" the specific individuals created.
  6.  **Methodological Commitment:** We agree that intuitive pump-priming cases (such as the Auditorium and Deferred Creation cases) are valid tools for testing the consistency and scope of our principles, provided we agree on the empirical facts of the thought experiments.

  ### II. Areas of Disagreement

  | Crux | Totalist wording of the disagreement | Person-affecting wording of the disagreement | Case or argument both accept as bearing on it | Totalist prediction | Person-affecting prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Repugnant Conclusion (General)** | A world containing a trillion lives barely worth living is *better* than a world containing ten wonderful lives, because the sum of wellbeing is greater. | A world containing a trillion lives barely worth living is *not better* (and possibly worse) than a world containing ten wonderful lives, because the addition benefits no one in the original ten. | **The Intuition Pump:** Comparing World A (10 wonderful lives) and World Z (10 wonderful + 1 trillion barely worth living). | If the sum is higher in Z, I must maintain Z is better. If intuition says Z is worse, intuition is mistaken. | If Z benefits no one in A, I must maintain Z is not better. If logic says Z is better, logic is missing a moral constraint. |
  | **2. The Auditorium Case (Causal Disconnection)** | Causal or spatial disconnection between the ten wonderful lives and the trillion barely worth living lives is morally irrelevant; the sum is additive regardless of universe boundaries. | Causal or spatial disconnection mitigates the repugnance; if the trillion lives are in a disconnected universe, they are not "added to" our world in a way that demands comparison. | **The Separation Test:** Does moving the trillion lives to a causally disconnected universe change the moral ranking of the outcome? | I predict separation changes nothing. If the PAV proponent feels less resistance, they are relying on a morally irrelevant bias toward locality. | I predict separation reduces the objection. If the Totalist insists separation is irrelevant, they are ignoring the relational nature of "better for." |
  | **3. Deferred Creation (Timing and Identity)** | The timing of creation (now vs. in a billion years) is morally irrelevant; the same lives created later have the same value as created now. | Delaying creation changes the identity of the subjects or the relation to the present; creating the trillion lives later may avoid the claim that we are "adding" them to *our* situation. | **The Timing Test:** Does pushing the creation of the trillion lives one billion years into the future change the moral evaluation? | I predict timing changes nothing. If the PAV proponent thinks it matters, they are succumbing to temporal discrimination. | I predict timing matters. If the Totalist insists it doesn't, they are ignoring that future non-existent people cannot be the subjects of current comparative harm. |

  ### III. Note on Verbal Disputes

  We identify two areas where our disagreement appears to be merely verbal, or at least partially driven by terminology rather than substantive moral facts:

  1.  **"Better" vs. "Not Better":** The Totalist uses "better" to mean "higher sum of value." The Person-Affecting proponent uses "better" to mean "better for at least one existing or future subject." When the Totalist says "Z is better" and the Person-Affecting proponent says "Z is not better," they may agree on all the non-moral facts and only disagree on the definition of the predicate "better."
  2.  **"Existence as a Benefit":** The Totalist treats coming into existence with positive welfare as a benefit *to the person created*. The Person-Affecting proponent treats existence as a precondition for benefits, not a benefit itself. Much of our argument reduces to whether "benefit" requires a pre-existing subject.

  ***

