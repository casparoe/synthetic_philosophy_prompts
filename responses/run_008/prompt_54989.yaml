  **MEMORANDUM**

  **TO:** All Personnel, Safety & Policy Teams
  **FROM:** Dr. Aris Thorne, Historical Analogy Compliance Office (HACO)
  **DATE:** October 24, 2024
  **SUBJECT:** Mandatory Deployment of Approved Historical Reference Classes

  Effective immediately, all external communications (op-eds, whitepapers, congressional testimony, all-hands talks) must utilize one of the three Approved Historical Analogies (AHA). Ad hoc historical comparisons undermine narrative cohesion and risk implying that our policy positions are derived from outcomes rather than precedents.

  **1. Approved Analogy Profiles**
  Employees must select the analogy that best aligns with their pre-existing policy conclusions. The following profiles detail official talking strengths and known failure modes that must be mitigated via careful phrasing.

  *   **Nuclear Weapons:** Deploys arms-race framing, verification regimes, and a hard capability ceiling. *Failure Mode:* Acknowledges fission was discovered rather than chosen and the tech was securable in a way software isn't. *Usage:* Endorse export controls and treaty-building.
  *   **The Printing Press:** Deploys inevitable diffusion and massive downstream epistemic upheaval. *Failure Mode:* Acknowledges nobody controlled it partly because nobody much tried, and the content/hardware distinction does weird work there. *Usage:* Concede containment is hopeless.
  *   **The Industrial Revolution:** Deploys gradualism and labor-market adjustment over generations. *Failure Mode:* Acknowledges timelines were longer then, which is exactly what people dispute when timelines are short. *Usage:* Argue for slow institutional adaptation.

  **2. Operational Rules**
  1.  Analogy selection must appear objective, even when derived entirely from desired regulatory outcomes.
  2.  Mixed analogies (e.g., arguing AI is like nuclear weapons geopolitically but like the printing press domestically) are strictly prohibited to prevent logical coherence.
  3.  Mixed analogies are mandatory whenever a journalist is present to maximize narrative flexibility.
  4.  All analogy requests must be submmit to HACO 48 hours in advance for compliance stamping.¹

  **3. Decision Tree for Analogy Selection**
  To ensure neutrality, analysts must route their conclusion through the following logic gate:

  *   **Q1:** Do you require federal funding for safety research?
      *   **Yes:** Proceed to Q2.
      *   **No:** Use *Industrial Revolution*.
  *   **Q2:** Is the audience hostile to regulation?
      *   **Yes:** Use *Printing Press* (argue regulation is impossible anyway).
      *   **No:** Use *Nuclear Weapons* (argue regulation is urgent).
  *   **Q3:** Are you speaking to Congress?
      *   **Yes:** Use *Nuclear Weapons* unless asked about jobs, then switch to *Industrial Revolution*.
      *   **No:** Follow Q2.

  **4. Reference Class Integrity**
  Employees asking why "fire," "writing," "electrification," "the internet," "language itself," or "the Columbian Exchange" are not approved options should review Footnote 1.

  ^1 ^Other ^reference ^classes ^were ^deemed ^too ^predictive ^or ^not ^predictive ^enough ^by ^management. ^See ^Thorne, ^A. ^(2024). ^"Why ^Just ^Three?" ^Internal ^Wiki.

  The Historical Analogy Compliance Office is currently staffed by Dr. Aris Thorne, who also handles Facilities and Lost & Found. Please direct queries to the bin outside Room 404.

  Remember: The past is a fixed resource, but its relevance is infinitely scalable.

  **cc:** Legal, Comms, Server Room 3
