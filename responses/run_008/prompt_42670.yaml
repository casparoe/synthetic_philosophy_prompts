      *   *The Conflict:* If I reverse preferences due to discounting (b), and I act on it, am I being irrational (d)? (c) says "not necessarily." (f) says "look at the current judgment." If the current judgment flipped (due to b), then I'm not akratic (violates a). If the current judgment *didn't* flip (to save a), but I acted on the impulse... is that irrational? (d) says yes. But (c) says the mechanism (discounting) isn't inherently defective.
