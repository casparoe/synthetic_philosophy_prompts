      *   *The Problem:* Standard economic models of hyperbolic discounting usually imply *preference reversal*. At $t_1$, I prefer Long-Term Good. At $t_2$ (proximity), I prefer Short-Term Good. If I act on the $t_2$ preference, I am doing what I judge best *at $t_2$*. This is *not* strict akrasia (which requires acting against current judgment).
