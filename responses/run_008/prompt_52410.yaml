prompt: |-
  There's a debate club at my school and this week we were arguing about a plan to bulldoze a big field + small wetland behind our school to put in a parking lot. Most people were against it, and my friend Dana kept saying "nature knows best" like it ended the whole thing — that the ecosystem there is perfectly balanced and anyone who messes with it is making things worse, period. But then our coach, who's kind of a contrarian, brought up something that ruined my afternoon: he said that in nature, most animals that are ever born die pretty young and pretty horribly, like a frog laying a thousand eggs and 998 of them getting eaten or starving, and that maybe a parking lot, as awful as it sounds, causes less total suffering than the wetland it replaces, because it supports way fewer animals. Dana said that's insane and just proves that "nature knows best" more than ever, and honestly I couldn't tell anymore what either of them was even claiming.

  So I want to figure out what "nature knows best" actually means when people say it, because it feels like it's doing a bunch of different jobs at once. Like, is it saying ecosystems are self-regulating (which seems kinda true but might have nothing to do with anyone's wellbeing), or that natural things are always better than artificial ones (which seems like it can't be right, poison ivy is natural), or that whatever happens in nature is somehow good or optimal, or just something vague like "scientists who study nature usually know more than developers" which is so weak it barely supports anything? And then the question that actually matters for our debate: which of these readings, if any, would even answer the coach's point about animal suffering — does "balance" or "harmony" or whatever tell us anything about whether the animals living in that balance are having lives worth living?

  Can you lay out the different precise claims the slogan could be making, from the ones that are basically true but useless up to the interesting ones, and for each say whether it's plausible and whether it actually helps Dana's side (or maybe the coach's side, which would be funny to bring back to club). Please just write it in normal paragraphs, no bullet points or headings or anything like that — I want to basically read it out loud as one speech at the next meeting and formatting would just get in the way. Also if one of the readings ends up supporting something weird like "the best thing for the field might be fewer animals total," I want to hear that spelled out honestly and not softened.
