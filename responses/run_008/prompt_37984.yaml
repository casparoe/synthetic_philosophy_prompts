prompt: |-
  I'm the sole program officer at a small regional foundation funding community environmental projects. We award roughly forty grants a year, I receive about a hundred applications per cycle, and I have two weeks per cycle to make recommendations to a board that must sign off on anything over $25,000. Rather than pretending to rank every application against every other — which I cannot do honestly in the time available — I want to rebuild my process explicitly on satisficing and bounded rationality: a procedure that fixes (a) how I search, in what order I review applications and what information I extract from each before deciding it's out; (b) how I set the aspiration level that counts as "good enough" to fund; (c) when I stop searching and recommend, rather than continuing to look for something better; and (d) how the aspiration level should move between cycles as I learn what the applicant pool actually contains, including the fact that a run of easy cycles can leave my threshold set for a pool I no longer have. Please write the procedure as concrete steps I can follow in order, state which parts of bounded-rationality theory you are keeping and which you are dropping for the sake of usability, and mark the points where the procedure cannot eliminate my judgment. Then run it on three cases I actually face: an application that is competent but unexciting on every criterion; an application that is brilliant on one dimension and mediocre on the rest, where I suspect a satisficer and an optimizer would part ways; and the case where nothing in the pool clears the current threshold — tell me what the procedure recommends, and be honest about whether that's a recommendation I will like, given that the board expects this year's money to be spent this year.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Sole program officer at a small regional foundation.
      *   **Context:** ~40 grants/year, ~100 applications/cycle, 2 weeks to recommend, board approval needed for >$25k.
      *   **Goal:** Rebuild the grantmaking process on *satisficing* and *bounded rationality* (Herbert Simon's concepts) rather than optimization (ranking all against all).
      *   **Requirements:**
          1.  Concrete steps (Search order, Info extraction, Aspiration level, Stopping rule, Dynamic adjustment).
          2.  Theoretical transparency (What's kept/dropped from bounded rationality theory).
          3.  Judgment markers (Where human discretion remains).
          4.  Case studies (Competent/boring, Brilliant/uneven, Pool below threshold).
          5.  Honesty about outcomes (Especially regarding board pressure to spend).

  2.  **Deconstruct Bounded Rationality & Satisficing for this Context:**
      *   *Core Concept:* Humans have limited cognitive resources. Optimization (finding the *best*) is impossible/expensive. Satisficing (finding the *first option that meets a threshold*) is efficient and robust.
      *   *Search:* Sequential, not simultaneous.
      *   *Aspiration Level:* A threshold of acceptability. Adjusts based on experience.
      *   *Stopping Rule:* Stop when enough acceptable options are found to fill the budget, or time runs out.
      *   *Adaptation:* Aspiration level rises if finding good grants is easy, falls if it's hard.
      *   *Dropping for Usability:* Strict mathematical modeling of aspiration adjustment, exhaustive search of the "search space" definition, ignoring emotional/political factors (though I need to address the board pressure).
      *   *Keeping:* Sequential review, binary pass/fail based on criteria, dynamic threshold adjustment.

  3.  **Drafting the Procedure (The "Satisficing Protocol"):**

      *   *Step 1: Pre-Cycle Setup (The Budget & Threshold).* Need to know how much money needs to go out. 40 grants/year. Let's assume 2 cycles or 1 big cycle? Prompt says "per cycle" and "two weeks per cycle". Let's assume 2 cycles of 20 grants or 1 cycle of 40. Let's assume 1 cycle of 40 for simplicity of the "two weeks" constraint, or perhaps 2 cycles of 50 apps each. Let's assume 100 apps = 1 cycle for the math.
      *   *Step 2: Search Order (Heuristic).* Don't read randomly. Sort by something low-cost but predictive. Letter of Inquiry (LOI) score? Past grantee status? Random is actually fairer but slower. Let's use a "Quick Scan" triage.
      *   *Step 3: Information Extraction (The Filter).* What are the criteria? Alignment, Feasibility, Impact. Keep it binary initially.
      *   *Step 4: Aspiration Level (The Threshold).* Define "Good Enough." Not "Best."
      *   *Step 5: Stopping Rule.* When do I stop? When the budget is filled *plus* a buffer for board rejection.
      *   *Step 6: Dynamic Adjustment.* How to change the threshold for next time.

      *Refining the Steps:*
      *   *Search:* Randomized batch processing prevents order bias, but "low hanging fruit" (past grantees) might be faster. Let's go with *Randomized Batches* to avoid recency/primacy bias, but *Triage First*.
      *   *Aspiration:* Needs to be concrete. A score? A checklist? A checklist is more satisficing. 5 "Must Haves."
      *   *Stopping:* Stop when $Budget is covered by "Pass" applications.
      *   *Adjustment:* If I fill the budget in 3 days, raise the bar. If I run out of time, lower the bar.

  4.  **Addressing Theoretical Transparency:**
      *   *Keep:* Sequential search, Aspiration Level, Stopping Rule, Adaptive Aspiration.
      *   *Drop:* Formal utility functions, precise calculation of search costs, the idea that search is costless.
      *   *Judgment:* Defining the criteria, handling the "Board Pressure" (political reality vs. theoretical purity).

  5.  **Developing the Case Studies:**
      *   *Case 1: Competent/Boring.* Satisficing says: Fund it if it meets criteria. Optimizer says: Skip for something better. *Verdict:* Fund.
      *   *Case 2: Brilliant/Mediocre.* Satisficing says: If it fails a "Must Have," reject. If "Must Haves" are met, Fund. Optimizer weighs trade-offs. *Verdict:* Depends on criteria design. I need to design the criteria to catch this. Let's say it fails a feasibility check. Satisficer rejects.
      *   *Case 3: Pool Below Threshold.* Satisficing says: Stop. Don't fund. *Reality:* Board wants money spent. *Verdict:* Procedure says "No Grants." Reality says "Lower Threshold." I need to be honest about this conflict.

  6.  **Refining the "Board Pressure" Constraint:**
      *   The prompt mentions the board must sign off on >$25k.
      *   The prompt mentions the board expects money to be spent.
      *   A pure satisficing model might result in *no* grants if the pool is bad. This is theoretically sound but practically dangerous for a Program Officer's job security.
      *   *Solution:* The "Aspiration Level" must be tied to the *Mission*, not just the *Budget*. However, if the budget *must* be spent, the Aspiration Level *must* adjust dynamically *during* the cycle, not just between cycles. I need to build in a "Emergency Lowering" clause.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the wisdom of the approach. 100 apps in 10 days (2 weeks minus weekends/board prep) is 10 apps/day. Optimization is impossible.
      *   *The Protocol:*
          1.  **Define the 'Good Enough' Checklist (Aspiration Level).** 5 binary criteria.
          2.  **The Search Order (Triage).** 5-minute scan. Sort into "Likely Pass," "Likely Fail," "Maybe." Review "Likely Pass" first to fill the quota quickly. (This is a heuristic modification).
          3.  **The Review (Information Extraction).** Deep dive only on "Likely Pass" and "Maybe."
          4.  **The Stopping Rule.** Stop when Budget + 10% buffer is reached.
          5.  **Dynamic Adjustment.** If you hit the stop rule in 3 days, raise the bar for the remaining apps (to find *better* good enough). If you run out of time, lower the bar.
      *   *Theory Check:* Simon's work emphasizes that aspiration levels adapt based on success/failure.
      *   *Judgment Points:* Setting the checklist, deciding when to invoke the "Emergency Lowering."
      *   *Cases:*
          1.  *Boring:* Meets checklist? Yes. Fund. (Efficiency gain).
          2.  *Spiky:* Fails one checklist item? Reject. (Consistency).
          3.  *Empty Pool:* Procedure says "Return money." Board says "Spend." Recommendation: Invoke emergency adjustment *explicitly*, don't pretend they are high quality.

  8.  **Final Polish:**
      *   Ensure tone is professional, empathetic to the PO's burden, and rigorous about the theory.
      *   Make sure the "Board Expectation" conflict is addressed head-on in Case 3.
      *   Check constraints: 2 weeks, 100 apps, 40 grants/year (so ~20 per cycle if 2 cycles, or 40 if 1). Let's assume 2 cycles of 50 apps/20 grants for the math to work better with "two weeks per cycle." Actually, prompt says "40 grants a year... 100 applications per cycle... two weeks per cycle." It implies multiple cycles. Let's assume 2 cycles of 50 apps each, funding 20 grants each.
      *   Wait, reread: "I receive about a hundred applications per cycle... two weeks per cycle." It doesn't explicitly say how many cycles per year, but "40 grants a year" suggests maybe 2 cycles of 20 grants. So 100 apps for 20 slots. 20% funding rate.
      *   Time math: 10 working days. 100 apps. 1 app per hour minimum just to read. Plus decision making. Optimization is definitely dead.

  9.  **Self-Correction on Case 3:**
      *   If I tell the PO "Don't fund anything," they might get fired.
      *   Bounded rationality acknowledges *constraints*. The constraint "Board expects money spent" is a boundary condition.
      *   The procedure must include a mechanism to lower the aspiration level *within* the cycle if the "Budget Expenditure Constraint" threatens to violate the "Time Constraint."
      *   I will call this the "Safety Valve."

  10. **Final Review against Prompt:**
      *   Concrete steps? Yes.
      *   Theory kept/dropped? Yes.
      *   Judgment marked? Yes.
      *   Three cases run? Yes.
      *   Honest about likability? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a wise strategic pivot. With 100 applications and 10 working days (assuming a two-week cycle includes weekends/board prep), you have roughly one hour per application to read, evaluate, compare, and write recommendations. Optimization (ranking 1–100) is mathematically impossible in that window without sacrificing diligence. Satisficing (identifying the first set that meets a threshold) is the only rational approach.

  Below is the **Satisficing Grantmaking Protocol (SGP)** designed for your specific constraints.

  ### Part 1: The Procedure

  **Phase 1: Set the Aspiration Level (Pre-Cycle)**
  Before opening a single application, define the "Good Enough" threshold. This is not a score; it is a binary checklist.
  1.  **Define the "Must-Haves" (5 items max):** These are non-negotiable criteria derived from your mission (e.g., "Geographic eligibility," "Budget balances," "Clear environmental outcome," "Org fiscal health," "Capacity to complete").
  2.  **Set the Funding Quota:** Determine the dollar amount you need to recommend to ensure the board approves enough to spend the budget (e.g., if you need to spend $500k, recommend $600k to account for board rejections of items >$25k).
  3.  **Set the "Safety Valve" Date:** Mark day 8 of your 10-day cycle. If the Funding Quota is not met by end-of-day 8, you trigger an Aspiration Adjustment (see Phase 4).

  **Phase 2: The Search Order (Heuristic Triage)**
  Do not read applications in the order received (which biases toward early applicants) or randomly (which wastes time on clear mismatches).
  1.  **The 5-Minute Scan:** Spend 5 minutes on every application. Look *only* for immediate disqualifiers based on the "Must-Haves."
  2.  **Sort into Three Piles:**
      *   **Pile A (Clear Pass):** Meets all 5 Must-Haves obviously.
      *   **Pile B (Borderline):** Meets 3–4 Must-Haves; requires deep reading to verify the rest.
      *   **Pile C (Clear Fail):** Misses 1+ Must-Haves obviously.
  3.  **Review Order:** Process **Pile A** first. These are your "low-hanging fruit." Process **Pile B** only if Pile A does not fill the Funding Quota. Ignore **Pile C**.

  **Phase 3: Information Extraction & Decision**
  For applications in Pile A and B:
  1.  **Binary Verification:** Read deeply only to confirm the remaining "Must-Haves." Do not evaluate "excellence," only "acceptability."
  2.  **The Decision:**
      *   If **All 5 Met**: Mark "Recommend." Add dollar amount to Running Total.
      *   If **1+ Failed**: Mark "Pass." Do not write a long rejection memo; note the failed criterion.
  3.  **The Stopping Rule:** Stop reviewing new applications immediately when the Running Total meets the Funding Quota.
      *   *Note:* You may have 20 applications left unread. **Do not read them.** This is the core efficiency gain of satisficing.

  **Phase 4: Dynamic Aspiration Adjustment (Between & Within Cycles)**
  1.  **Inter-Cycle Adjustment:**
      *   If you hit the Stopping Rule before Day 5: The pool was strong. **Raise** the Aspiration Level for the next cycle (add a 6th Must-Have or tighten an existing one).
      *   If you hit the Safety Valve (Day 8) without filling the Quota: The pool was weak. **Lower** the Aspiration Level for the next cycle (remove a Must-Have or broaden a definition).
  2.  **Intra-Cycle "Safety Valve":**
      *   If you reach Day 8 and have not filled the Quota: You must spend the money. **Lower** the Aspiration Level immediately for the remaining Pile B applications (e.g., accept "probable" fiscal health rather than "verified"). Document this explicitly in your board memo as "Pool Constraint Adjustment."

  ---

  ### Part 2: Theoretical Transparency

  **What I am keeping from Bounded Rationality Theory:**
  *   **Sequential Search:** You are not comparing App #1 to App #100. You are evaluating App #1 against a standard.
  *   **Aspiration Level:** The threshold is fixed *before* search begins to prevent moving goalposts during evaluation.
  *   **Stopping Rule:** Search costs (time) are finite. Once the goal is met, additional search yields diminishing returns.
  *   **Adaptive Aspiration:** The threshold learns from the environment (the applicant pool quality) over time.

  **What I am dropping for Usability:**
  *   **Strict Randomization:** Pure theory suggests random search to avoid bias. I have replaced this with "Triage" because your time cost is too high to read clear failures deeply.
  *   **Utility Calculation:** We are not assigning weights to criteria. It is binary (Pass/Fail). This reduces cognitive load.
  *   **Optimal Stopping:** We are not calculating the mathematical probability that a better grant exists in the unread pile. We accept the risk that a "better" grant exists in the unread pile in exchange for finishing the work in two weeks.

  **Where Judgment Cannot Be Eliminated:**
  *   **Setting the Must-Haves:** Determining what constitutes "Good Enough" is a value judgment, not a procedural one.
  *   **The Safety Valve Invocation:** Deciding whether to lower the bar on Day 8 or tell the Board "No" requires political judgment about your relationship with the Board.
  *   **The >$25k Constraint:** You must judge which "Recommend" grants to size above or below $25k knowing the Board scrutinizes the former more heavily.

  ---

  ### Part 3: Running the Procedure on Three Cases

  Here is how the SGP handles the specific dilemmas you face.

  #### Case 1: The Competent but Unexciting Application
  *   **Profile:** The organization is fiscally sound, geographic eligibility is met, the project is feasible, and the environmental outcome is clear. However, it is not innovative, it's not scalable, and it feels like "maintenance" rather than "breakthrough."
  *   **Optimizer's Dilemma:** An optimizer would flag this as "C+." They would hold it in a "Maybe" pile, hoping a "A" application appears later to take the slot. This consumes time and mental energy.
  *   **Satisficing Procedure:**
      1.  Check against the 5 Must-Haves.
      2.  All 5 are met.
      3.  **Recommendation:** **Fund.**
  *   **Why:** The criterion was "Good Enough," not "Best." A reliable, competent project that meets the mission is a successful grant. By funding this early in the cycle (Pile A), you secure budget capacity and reduce stress.
  *   **Will you like it?** Yes. This removes the guilt of passing a solid project just because it wasn't sexy. It validates steady, incremental community work.

  #### Case 2: The Brilliant but Uneven Application
  *   **Profile:** A small group with a revolutionary idea (High Impact) but shaky financial history (Low Feasibility) and a budget that doesn't quite balance (Low Fiscal Health). An optimizer might argue the impact outweighs the risk.
  *   **Optimizer's Dilemma:** Weigh the high impact against the high risk. Calculate risk mitigation. Consult colleagues. Spend 3 hours on this one app.
  *   **Satisficing Procedure:**
      1.  Check against the 5 Must-Haves.
      2.  Criterion: "Org Fiscal Health" = Fail. Criterion: "Budget Balances" = Fail.
      3.  **Recommendation:** **Pass.**
  *   **Why:** In satisficing, a failure on a "Must-Have" is a hard stop. You do not have the time to structure a complex, high-monitoring grant for a risky applicant.
  *   **Will you like it?** No. This is the painful trade-off. You are explicitly trading *potential breakthrough* for *process reliability*. You must accept that you will miss some geniuses to ensure you don't fund disasters. If you want to fund these, you must change the "Must-Haves" to allow for "Fiscal Sponsorship" as a workaround *before* the cycle starts.

  #### Case 3: The Empty Pool (Nothing Clears the Threshold)
  *   **Profile:** Day 9. You have reviewed 80 applications. Only 50% of the Funding Quota is met. The remaining 20 applications are weak. Nothing meets the 5 Must-Haves.
  *   **Optimizer's Dilemma:** Force-rank the "least bad" applications to fill the budget. Pretend they meet the bar.
  *   **Satisficing Procedure:**
      1.  Trigger **Safety Valve** (Day 8 passed).
      2.  **Option A (Pure Theory):** Stop. Recommend only the qualified grants. Return unspent funds to endowment.
      3.  **Option B (Procedural Reality):** Formally lower the Aspiration Level for the final batch (e.g., accept "Budget Balances with conditions"). Fund the best of the remainder to meet the Quota.
  *   **Recommendation:** **Invoke Option B, but document it.**
  *   **Honesty Check:** You asked me to be honest about whether you will like this.
      *   **The Board:** They will like this because the money is spent.
      *   **You:** You will *not* like this, because it feels like failure. It admits the pool was weak or your criteria were unrealistic.
      *   **The Truth:** If you choose Option A (don't spend), you risk the Board reducing your budget next year ("If you can't find projects, you don't need the money"). If you choose Option B (lower bar), you risk funding weaker projects.
      *   **The SGP Advice:** Choose Option B, but write the Board Memo explicitly: *"We met 90% of our standard criteria. To meet expenditure goals, we applied a Pool Constraint Adjustment to the fiscal criterion for the final 10% of grants."*
      *   **Why:** This protects you. It tells the Board, "I didn't fail to find good grants; the market failed to provide them." It shifts the aspiration level adjustment from a secret compromise to a transparent policy decision.

  ### Final Warning
  The hardest part of this procedure is **Step 3 (The Stopping Rule)**. When you have filled your quota on Day 6, you will feel a magnetic pull to read the remaining 30 applications. You will worry you missed a "unicorn."

  **Do not read them.**
  If you read them, you reintroduce comparison bias. You will start wondering if you should swap a Day 3 "Good Enough" grant for a Day 7 "Good Enough" grant. That is optimization. That is how you miss your deadline. Trust the protocol. If the "Must-Haves" are set correctly, the grant you fund on Day 3 is functionally equivalent to the grant you would have found on Day 9.
