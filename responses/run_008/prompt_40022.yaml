      *   **Topic:** Epistemic Structural Realism (ESR) vs. Ontic Structural Realism (OSR).
      *   **Task:** Write out a list of desiderata (adequacy conditions) for *any* adequate version of structural realism (SR).
      *   **Specific Content Requirements:**
          *   Capture the intuition behind historical continuity (Fresnel/Maxwell).
          *   Capture Poincaré's insight about relations vs. things (paraphrased).
          *   Address the Newman Objection (triviality).
          *   Clarify the role of structure (avoid collapse into standard realism or instrumentalism).
          *   Address the structure/object distinction (maintain or eliminate + cost).
          *   Cohere with actual physics (QM symmetry/permutation invariance).
          *   Mark requirements as "Non-negotiable" vs. "Camp Preferences."
          *   Identify jointly unsatisfiable subsets (trade-offs).
          *   Do *not* score existing contenders.
          *   Identify the single most exclusionary requirement.
          *   Identify the vulnerability in my own reasoning (meta-cognition).
      *   **Tone:** Philosophical, rigorous, neutral (facilitator, not advocate), insightful.

  2.  **Deconstruct the Desiderata:**

      *   *Historical Continuity:* This is the core motivation for SR. If SR doesn't explain why we keep the math but dump the ontology (ether), it fails.
      *   *Poincaré's Insight:* Science grasps relations, not the relata. Needs paraphrasing.
      *   *Newman Objection:* If structure is just logical relations, any set of objects can fit any structure. SR needs to say structure is *physical* or *causal*, not just mathematical.
      *   *The "Middle Way" Problem:* SR wants to be realist (not instrumentalist) but distinct from entity realism. It needs to show structure is *ontologically significant* without committing to specific natures of objects.
      *   *Structure vs. Relata:* ESR says we only *know* structure; OSR says there *are* only structures. This needs explicit handling.
      *   *Physics Coherence:* Specifically QM (indistinguishability, permutation invariance). If SR contradicts the physics it cites, it's self-defeating.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1 (Historical):* Needs to explain theory change. *Non-negotiable.*
      *   *D2 (Poincaré):* Relations over relata. *Non-negotiable.*
      *   *D3 (Newman):* Avoid triviality. *Non-negotiable.*
      *   *D4 (Realism Status):* Distinct from instrumentalism and standard realism. *Non-negotiable.*
      *   *D5 (Relata Status):* Explicit stance on objects. *Non-negotiable.*
      *   *D6 (Physics):* Consistency with QM. *Non-negotiable.*

      *Refining the "Camp Preferences" vs. "Non-negotiable":*
      *   ESR prefers keeping agnosticism about objects. OSR prefers eliminating them. A *general* SR desideratum shouldn't force one, but should force a *decision*. So, D5 is non-negotiable in requiring clarity, but negotiable on the *outcome*.
      *   However, the prompt asks to mark which are preferences *masquerading* as demands. For example, OSR might demand "Elimination of Objects" as a requirement for *adequate SR*. That's a camp preference. ESR might demand "Preservation of Unknown Substrate." That's also a camp preference. The *neutral* requirement is "Explicit Account of Relata."
      *   Physics: OSR leans heavily on QM. ESR might lean on classical continuity. A neutral list must demand coherence with *accepted* physics, not just the physics one camp likes.

  4.  **Identifying Tensions/Unsatisfiable Subsets:**
      *   *Newman vs. Empiricism:* To solve Newman, you usually need to add causal/physical content to structure. But if you add too much physical content, you start describing the *nature* of the relata, pushing toward standard realism.
      *   *QM vs. Individuality:* OSR uses QM to kill objects. But some interpretations of QM allow for weak discernibility. If SR demands "No Objects" based on QM, but QM allows "Objects," there's a tension.
      *   *Continuity vs. Discontinuity:* Fresnel/Maxwell supports continuity. But Kuhnian shifts suggest discontinuity. SR bets on continuity.

  5.  **Selecting the "Most Exclusionary" Requirement:**
      *   The Newman Objection is the technical killer. Many versions of SR die here.
      *   However, the "Middle Way" (D4) is the philosophical killer. It's very hard to be realist about structure without being realist about *something* that bears the structure.
      *   Decision: The Newman Objection constraint is the sharpest logical filter.

  6.  **Meta-Cognition (Vulnerability):**
