  5.  **Refining the "Fatal" Argument (The User's Specific Request):**
      *   The user wants: "A case where the phenomenal residue is needed to state a finding, rather than to honor an intuition."
      *   *Candidate:* **Blindsight vs. Vision.** In blindsight, discrimination exists without reportable experience. In normal vision, both exist. The difference *is* the phenomenal character. If you quine qualia, you must describe the difference solely in terms of information access/reporting. But there are cases (like partial awareness) where reportability and phenomenology come apart.
