answer: |-
  **MEMORANDUM**

  **TO:** Members of the Legal Affairs Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Lake Shoreline Fee Regulation (Item 4.2)

  **1. Executive Summary**

  This memo recommends that the Committee adopt **Option C**: no new cantonal law, coupled with active cantonal mediation to support an inter-municipal concordat.

  We are asked to solve a pricing dispute among shoreline municipalities. However, the substantive disagreement before us is not about mooring fees; it is about the constitutional principle of subsidiarity. The petitioning bloc defines subsidiarity as a rule of **capacity** (the Canton must act when municipalities *cannot* solve a problem). The interior municipalities define it as a rule of **proximity** (the Canton must not act unless municipalities *should not* solve a problem).

  Option C is the only choice that respects the default legal position of proximity while creating a structured test for the capacity claim. Options A and B presume the capacity failure before it is proven. This memo outlines why we must prioritize proximity now, while explicitly acknowledging the strength of the capacity argument and the factual risks of this approach.

  **2. The Options at Hand**

  *   **Option A (Binding Canton-Wide Tariff):** Eliminates local discretion. Solves the "race to the bottom" but centralizes authority.
  *   **Option B (Framework with Floor/Ceiling):** Sets cantonal boundaries but allows local choice within them. A compromise that retains cantonal oversight.
  *   **Option C (No Law / Concordat):** Municipalities negotiate their own agreement, facilitated by cantonal mediation. Retains full local autonomy but relies on voluntary cooperation.

  **3. The Core Conflict: Two Readings of Subsidiarity**

  We cannot vote on this measure without deciding what subsidiarity is for. The committee is divided between two incompatible interpretations:

  *   **Subsidiarity as Proximity (The Interior View):** This reading holds that decision-making authority belongs to the lowest possible level as a matter of democratic right, regardless of efficiency. The burden of proof lies on the Canton to demonstrate why it *must* intervene. Under this view, economic friction between municipalities is a feature of local autonomy, not a bug requiring cantonal repair.
  *   **Subsidiarity as Capacity (The Shoreline Petitioners' View):** This reading holds that authority resides at the lowest level *only as long as* that level is effective. If a problem exceeds the functional capacity of the municipalities (e.g., a collective action problem where one defector ruins the system for all), the higher level *must* intervene. Under this view, retaining local control that leads to mutual revenue loss is not autonomy; it is incompetence.

  **4. Recommendation: Option C**

  I recommend **Option C**.

  We should not enact cantonal law (A or B) because the "Capacity" threshold for overriding the "Proximity" default has not yet been met. In Swiss constitutional practice, the assumption is that municipalities are capable of cooperation unless demonstrated otherwise. By offering cantonal mediation without legislation, we facilitate the solution the petitioners claim they want (coordination) without seizing the authority they currently possess (pricing).

  If the municipalities truly face a structural inability to cooperate, a concordat will fail. At that point, the "Capacity" reading of subsidiarity will have been empirically validated, and the Committee can return to Options A or B with a clear mandate. To legislate now is to assume failure before the attempt is made.

  **5. The Strength of the Losing Argument (Capacity)**

  We must give the petitioning bloc's reading of subsidiarity its due. Their argument is legally and economically coherent.

  If the "Proximity" principle is applied dogmatically, it can protect local veto points that destroy regional value. The petitioners argue that a single municipality undercutting fees creates a negative externality for all neighbors. In game theory terms, this is a Prisoner's Dilemma. If the structure of the incentive makes cooperation irrational for individual actors, then "local control" is a fiction.

  The Capacity reading posits that subsidiarity exists to serve the public good, not to protect turf. If the Canton stands by while municipalities engage in a race to the bottom that degrades public infrastructure and reduces total tax revenue, the Canton is not respecting autonomy; it is neglecting its duty to ensure orderly governance. There is a strong case that Option C merely delays the inevitable, costing municipalities revenue in the interim while we wait for a concordat that market incentives actively discourage.

  **6. The Factual Bet and Falsification**

  My recommendation rests on a specific factual bet: **That the barrier to cooperation is political, not structural, and that cantonal mediation is sufficient to overcome it.**

  I am betting that the municipalities *can* sustain a concordat if given a neutral forum, and that the "race to the bottom" is not as inevitable as the petitioners claim.

  **Evidence that would count against this bet at Thursday's session:**
  1.  **Historical Precedent:** If the administration produces evidence of previous attempts at inter-municipal lake concordats that failed despite mediation, the "Capacity" argument is strengthened.
  2.  **Legal Barriers:** If the Cantonal Attorney General advises that municipalities lack the legal competence to enforce fee agreements among themselves without a cantonal umbrella, Option C is legally non-viable.
  3.  **Uniform Opposition:** If the shoreline municipalities opposing the uniform tariff (who fear local nuance loss) also indicate they will *not* join a concordat, then Option C fails to solve the fragmentation issue just as Option A would.

  If any of these three points are substantiated Thursday, I will withdraw my support for Option C and move to Option B.

  **7. Conclusion**

  Adopting Option A or B resolves the economic dispute but obscures the constitutional principle. It tells the municipalities that the Canton defines the limit of their capacity. Adopting Option C forces us to define subsidiarity clearly: Proximity is the rule; Capacity is the exception that must be proven.

  Let us offer our help, but not our takeover. Vote for Option C.
