      *   *The User's Hypothesis:* Semantic (what *is* meaning) vs. Normative (what *should* critics do).
      *   *The Wrinkle:* Legal texts demand intent; literary texts invite play.

  3.  **Address the Specific Questions (Drafting the Diagnosis):**

      *   **Q1: Verbal, Substantive, or Category Error?**
          *   It's largely a category error (two questions under one heading), but with a substantive core regarding the *ontology* of the text.
          *   *Semantic:* What constitutes the object "The Poem"? Is it the ink on the page, or the ink + the mind that made it?
          *   *Normative:* What is the *goal* of reading? Is it reconstruction (historical) or production (aesthetic/ethical)?
          *   *Diagnosis:* The stall happens because Intentionalists argue Normatives using Semantics, and Anti-Intentionalists argue Semantics using Normatives.

      *   **Q2: Unpacking Commitments:**
          *   *Intentionalists:* Committed to communication as a human act. If I say "fire," I mean "shoot" or "warmth." Context matters. They fear relativism (if meaning isn't fixed, anything goes).
          *   *Anti-Intentionalists:* Committed to the autonomy of the artifact. Language exceeds the speaker. They fear authoritarianism (the Author as God limiting the reader's experience).

      *   **Q3: The Genre Wrinkle (Contracts vs. Poems):**
          *   This is the strongest evidence for the User's "Two Questions" hypothesis, but it points deeper to *Teleology* (Purpose).
          *   *Contracts/Wills:* Purpose = Coordination/Enforcement. Success = Predictability. Intent is the mechanism of predictability.
          *   *Poems/Novels:* Purpose = Experience/Exploration. Success = Resonance/Complexity. Intent is a constraint on richness.
          *   *Conclusion:* It's not just Semantic vs. Normative. It's *Functional*. The "Third Question" hypothesis is correct. The ontology of the text shifts based on its social function.

