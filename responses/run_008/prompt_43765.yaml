answer: |-
  This is a sophisticated diagnosis of a stalemate that has indeed paralyzed literary theory for seventy years. You have correctly identified that the debate feels circular because the participants are often playing different games while using the same board.

  Here is a diagnosis of the stall, an unpacking of the commitments, an analysis of your genre wrinkle, and finally, a practical answer to your situation as an author.

  ### 1. The Diagnosis: Verbal, Substantive, or Category Error?

  Your working hypothesis—that this is a semantic question crossed with a normative one—is strong, but I would refine it. The stall is primarily a **category error regarding the ontology of the text**, disguised as a semantic dispute.

  *   **The Semantic Question:** "What *is* the meaning?"
      *   Intentionalists treat the text as a **trace** of a mental event. The meaning exists prior to the text; the text is a vehicle.
      *   Anti-intentionalists treat the text as an **artifact** of public language. The meaning exists in the interaction between the code (language) and the decoder (reader).
  *   **The Normative Question:** "What *should* criticism do?"
      *   Intentionalists want criticism to be **historical/reconstructive**. The goal is fidelity to the past act.
      *   Anti-intentionalists want criticism to be **aesthetic/ethical**. The goal is vitality in the present moment.

  **The Stall:** The Intentionalist argues that without authorial anchor, meaning is infinite (a normative fear of chaos). The Anti-intentionalist argues that authorial intent is inaccessible and limiting (a semantic claim about psychology vs. linguistics). They talk past each other because one is defending the *stability of communication* while the other is defending the *autonomy of the artifact*.

  It is not merely verbal. It is substantive, but it is substantive about *what kind of object a book is*, not just what words mean.

  ### 2. Unpacking the Commitments

  When you strip away the slogans ("Death of the Author" vs. "Validity in Interpretation"), here is what each side is actually committed to:

  **The Intentionalist (Hirsch et al.) is committed to:**
  *   **Agency:** Language is a human action, not just a system. To ignore intent is to ignore the humanity of the speaker.
  *   **Ethics of Communication:** If I say something, I am responsible for it, and you are responsible for hearing what I said. To claim I said something else is a violation of our contract as communicating beings.
  *   **Fear:** Relativism. If the author doesn't fix meaning, the text can mean anything, rendering interpretation worthless.

  **The Anti-Intentionalist (Barthes, New Critics) is committed to:**
  *   **Linguistic Autonomy:** Language is a social system that exceeds individual control. Metaphor, irony, and cultural codes operate beyond the author's conscious grasp.
  *   **Readerly Freedom:** The text belongs to the culture once published. To chain it to the author's biography is to limit its potential resonance.
  *   **Fear:** Authoritarianism. The Author as God limits the reader's ability to find personal or political truth in the work.

  ### 3. The Genre Wrinkle: Contracts vs. Poems

  This is the most critical part of your inquiry. You ask if the fact that we read wills intentionally but poems anti-intentionally fits your hypothesis or suggests a third question.

  It suggests a **third question: The Teleological Question (What is the text *for*?).**

  The debate stalls in literary theory because both sides assume "The Text" is a singular category. Your observation about contracts proves it is not. The mode of interpretation is dictated by the **speech act** involved.

  *   **Contracts/Wills/Statutes:** These are **performative** speech acts. Their purpose is *coordination* and *enforcement*. Ambiguity is a bug. The "meaning" is the specific outcome intended to regulate behavior. Therefore, intent is the only metric of success.
  *   **Poems/Novels:** These are **exploratory** speech acts. Their purpose is *experience* and *resonance*. Ambiguity is often a feature. The "meaning" is the effect produced in the reader. Therefore, intent is secondary to effect.

  **Does this break your hypothesis?**
  It strengthens it. You posited a Semantic vs. Normative split. The genre wrinkle shows that the **Normative** (what we use the text for) determines the **Semantic** (how we define meaning).
  *   If the norm is *enforcement* (Law), the semantics are *intentional*.
  *   If the norm is *aesthetic experience* (Art), the semantics are *public/structural*.

  Neither side in the theoretical debate noticed this because they were arguing over "The Literary Text" as if it were a universal category, rather than a specific social technology with specific rules of engagement.

  ### 4. What Counts as Progress?

  Given this diagnosis, a verdict (one side winning) is impossible and undesirable. Progress would look like **Jurisdictional Clarity.**

  We need to stop asking "What is the *true* meaning?" and start asking "Under which **interpretive community** (to borrow Stanley Fish's term) are we operating?"

  *   **Progress is a Distinction:** We must distinguish between **Authorial Meaning** (what the author meant to encode) and **Textual Significance** (what the text accomplishes in the world). Both are real. Both are valid. They are just different objects of study.
  *   **Progress is a Change in Question:** Instead of "Is this reading right?", ask "Is this reading *useful*?"
      *   If the goal is biography/history: Intent is king.
      *   If the goal is cultural analysis/aesthetics: Effect is king.
  *   **Progress is acknowledging the Genre Contract:** We admit that we read a novel differently than a subpoena. The "rules of the game" change based on the type of text.

  ### 5. The Practical Implication: Can you tell your reviewers they are wrong?

  As a working author, here is the hard truth derived from the diagnosis above:

  **No, you are not entitled to tell them they are wrong.**

  Here is why, based on the three layers we just unpacked:

  1.  **The Ontological Layer:** Once you published the novel, you converted it from a private mental event (where you are the authority) into a public artifact (where language is the authority). You built a machine; you do not get to dictate how the machine operates once it is in the hands of the user. If the machine produces an allegory you didn't design, the machine is still producing that allegory.
  2.  **The Teleological Layer:** By writing a novel (not a contract), you entered the genre of "exploratory speech acts." The implicit contract of fiction is that the reader is a co-creator. If you veto their creation, you are violating the genre contract. You are treating a poem like a will.
  3.  **The Normative Layer:** If you insist on your intent, you win the **Semantic** point (you know what you meant) but you lose the **Normative** point (you limit the book's life). A reading that resonates with critics and readers *adds value* to the work. Denying it subtracts value.

  **However, you are entitled to something else.**
  You are entitled to say: *"That is a fascinating reading. It was not my conscious intention, but I am delighted that the text supports it."*

  This stance allows you to:
  *   Maintain honesty (you didn't plan it).
  *   Maintain authority (you know your process).
  *   Validate the critic (you acknowledge the text's autonomy).
  *   Protect the book (you allow the allegory to exist, which keeps the book relevant).

  **Summary Advice:**
  The stall in theory exists because everyone wants to be the sole owner of meaning. In law, the author (signer) owns the meaning. In art, the meaning is a shared estate. If you try to evict the critics, you don't prove them wrong; you prove the book is smaller than they thought. Let them have the allegory. It belongs to them now. Your job is to write the next one.
