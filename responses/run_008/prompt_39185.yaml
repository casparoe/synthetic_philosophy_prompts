answer: |-
  **MEMORANDUM**

  **TO:** Appeals Panel Members
  **FROM:** [Your Name], Panel Member
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Decision: Case No. 23-409 (Bank Growth Account Mailer)

  **I. RECOMMENDATION**

  I recommend that the Panel **UPHOLD** the complaint.

  While the headline statement ("Since 1904, no customer of ours has ever lost a penny") is literally true regarding deposit accounts, the *net impression* conveyed to a reasonable consumer is that the advertised "Growth Account" shares this safety profile. The current disclosure (8-point type on the reverse side) is insufficient to cure this misleading implication.

  I propose we direct the advertiser to either: (a) remove the headline; or (b) retain the headline only if accompanied by a clear and conspicuous qualification *immediately adjacent* to the claim (e.g., same font size, front of mailer) stating that the Growth Account is not a deposit and involves risk of loss.

  **II. FACTUAL BACKGROUND**

  *   **The Product:** A "Growth Account," classified as an investment product where principal is at risk. It is not FDIC insured.
  *   **The Claim:** Front-page headline: "Since 1904, no customer of ours has ever lost a penny."
  *   **The Reality:** The bank's deposit customers have not lost money. However, customers in prior investment products may have, and customers in *this* product could.
  *   **The Disclosure:** A risk disclosure exists on the reverse side in 8-point type, noting the product is not a deposit and is not insured.
  *   **The Code:** Our Code prohibits advertising that is "misleading or likely to deceive the consumer."

  **III. ANALYSIS**

  The Panel is currently divided between two competing principles. To reach a consensus, we must address both the nature of communication and the limits of our regulatory scope.

  **A. The Complainant's Position: Truthful Statements Can Still Mislead**
  The core of the complainant's argument is that advertising is not read in a vacuum. A reasonable consumer does not parse syntax like a lawyer; they process the "gestalt" of the message.

  When an advertiser chooses to highlight a 120-year history of safety in a mailer dedicated to selling a specific financial product, they are inviting an inference. Under standard principles of communication (often referred to in linguistics as "implicature"), the relevance of the statement depends on its application to the subject at hand. If the safety record did not apply to the Growth Account, mentioning it in this context is designed to suggest that it does.

  To rule otherwise would create a "truthful lie" loophole. An advertiser could technically tell the truth about *Product A* while intentionally leading consumers to believe that truth applies to *Product B*, provided they bury the contradiction in fine print. Our Code prohibits misleading advertising, not merely false advertising. A statement that creates a false belief, even through accurate data, falls under the former.

  **B. The Bank's Defense: Certainty and the "Fine Print Cure"**
  The Bank's counsel raises a valid concern regarding regulatory overreach. Their argument rests on two pillars:
  1.  **Objective Certainty:** Advertisers need to know where the line is. "Literal truth" is a bright line. "General impression" is subjective. If we police inferences, we risk punishing advertisers for how a particularly unsophisticated consumer might misread a text.
  2.  **The Disclosure Defense:** The risk *was* disclosed. If we rule that a disclosure on the back is insufficient, are we essentially banning nuanced claims? Shouldn't a consumer bear some responsibility to read the terms?

  **C. Reconciling the Views**
  We must acknowledge the Bank's worry: If we police impressions too aggressively, we chill legitimate puffery and historical storytelling. However, there is a established boundary in self-regulation that addresses this without resorting to strict literalism.

  *   **On Literal Truth:** The "half-truth" doctrine is well-trodden ground. A statement is misleading if it omits material information necessary to prevent the statement from being deceptive in context. The history of deposit safety is material information *omitted* from the claim (i.e., that this applies only to deposits, not investments).
  *   **On the Disclosure:** Disclosures cannot contradict the main claim. A bold, front-page assurance of safety is effectively nullified by a small-print warning on the back that says "you could lose money." This is not a clarification; it is a contradiction. We have consistently held that disclosures must be "clear and conspicuous." 8-point type on the reverse of a mailer fails this test when the claim it qualifies is the primary headline.
  *   **On the "Slippery Slope":** Where does this end? It ends at the "Reasonable Consumer." We are not asking if *any* consumer could misunderstand this. We are asking if a *reasonable* consumer, acting with ordinary care, would infer that the Growth Account is safe based on the headline. Given the juxtaposition of the claim and the product, that inference is not just possible; it is the intended effect. We are not policing "feelings"; we are policing material contradictions between the hook and the terms.

  **IV. PROPOSED REMEDIATION**

  We should not necessarily ban the bank from citing its history. Longevity is a legitimate selling point. However, the context must be accurate.

  **The bank should be required to:**
  1.  **Qualify the Claim:** If they keep the headline, they must add a qualifier immediately next to it (e.g., "*Based on historical performance of deposit accounts only*").
  2.  **Elevate the Risk:** The risk disclosure regarding the Growth Account must be on the front page, in a font size readable without magnification, and proximate to the safety claim.

  This balances the Bank's right to communicate its history with the consumer's right not to be misled about the specific product's risk profile.

  **V. DISCUSSION POINTS FOR THE HEARING**

  In circulating this draft, I invite the Panel to consider the following before our session:

  1.  Does the "literal truth" defense hold water if the *omission* of context renders the truth deceptive?
  2.  Is there a scenario where a back-of-mailer disclosure *would* be sufficient for a front-of-mailer claim? If so, what distinguishes this case?
  3.  Does our proposed remediation provide enough certainty for the Bank to comply without guessing at future enforcement?

  I look forward to discussing this further.

  **[Your Name]**
  **Appeals Panel Member**
