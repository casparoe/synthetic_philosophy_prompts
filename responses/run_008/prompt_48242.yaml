      *   The metaphysical reading licenses collective blame but *forbids* individual appropriation of credit (since the "I" doesn't exist, the "I" shouldn't get the bonus).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration and the philosophical depth of the request.
      *   **The Menu:** Present the readings (Orthographic, Instrumental, Normative, Epistemic, Metaphysical).
      *   **Evaluation Matrix:** For each, state Truth Value and Consistency with Boss's actions.
      *   **The Metaphysical Deep Dive:** Address the relay runner scenario, Summativism vs. Non-summativism, and the "fact of the matter."
