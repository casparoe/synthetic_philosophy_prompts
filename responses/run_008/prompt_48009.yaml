  I'm taking a philosophy of science course this term, and we just finished the unit on Humeanism vs anti-Humeanism about laws of nature (Lewis-style best-system stuff on one side, governing-laws / necessitation views on the other). I want to build my term paper around a thought experiment, and I have a spec for it that I can't quite get to work myself, so I'm asking around.

  Here's what the case is meant to show: that on Humeanism, whether some event counts as a violation of the laws at a given time depends on stuff that hasn't happened yet, which seems to get the order of explanation backwards. The spec: a toy world, finitely many particles, everything describable by hand, no fancy physics and no appeal to what real physicists believe. The world's complete history is arranged so that two candidate systems, S1 and S2, are nearly tied in the best-system competition — comparable simplicity, comparable strength — and the tie is only broken by events late in the world's history. Early on, one particle does something that's illegal under S1 but legal under S2, so for a long stretch it is unsettled whether that event broke a law; only the future settles it. I had a vague idea of particles that mostly follow some very simple pattern with one patch of messiness that S1 smooths over at a cost in strength and S2 keeps at a cost in simplicity, but honestly do your own thing as long as I can check the simplicity/strength tradeoff by hand. What I want from you: construct the world (one paragraph for the scenario itself), then walk through what the Humean has to say (is the event a violation before the tie breaks? does the world just not have laws yet? does it only have laws "from the outside"?), what the anti-Humean says, and which structural feature — I assume it's the fact that best-system facts supervene on the whole four-dimensional mosaic — is doing the work. Constraints: no gods, no universals stipulating the laws, and the verdicts must come out of the theories, not be stipulated into the setup — if the only way to get my near-tie is to rig it by hand rather than derive it, say so plainly, because that's exactly the kind of cheating my tutor will pounce on. Also tell me how a Humean would push back; I've heard people say that since the mosaic is a whole four-dimensional object, there's simply no fact of the matter about laws "at a time", and I can't tell whether that defuses my case or just concedes something weird.

  One more thing: please commit. I don't want a tidy survey of five possible reactions with the conclusion left to me — take a definite position on whether this case is a genuine problem for Humeanism or whether it backfires (e.g. because the anti-Humean also has to say something odd about law-violations being settled from the outside), and defend it. If you think the case would run better as a case about explanation — the early particle's behaviour can't be explained by the laws, since there aren't any laws yet — fold that in rather than keeping it as an afterthought. Write in British English please. And a small favour: if part of my spec is confused or rests on a misreading of either view, flag it — I'd rather fix the paper now than get shredded in the seminar.
