answer: |-
  **Strategic Advice on Scope**

  Yes, the full two-dimensional matrix is too big for one semester. You are proposing a 2x2 taxonomy (Causal/Correlational x Optimizer/Selection) crossed with a list of at least four distinct mitigation strategies. That's 16 cells to fill, plus the theoretical groundwork to justify the axes. If you try to cover every mitigation, you'll end up with a shallow survey that satisfies neither the engineers (who want depth on implementation) nor the philosophers (who want rigor on definitions).

  **The Cut:** Drop the comprehensive survey of *all* fixes. Pick **three** representative mitigation strategies that rely on different assumptions (e.g., Metric Rotation, Adversarial Search, and De-metricization/Oversight). Focus your energy on the "Local Causal" regime. That is your novel contribution. The standard regimes (purely correlational or purely adversarial) are well-trodden; the claim that a proxy can be *causally valid but brittle* is where you'll actually move the needle. If you can show that "Metric Rotation" works for Adversarial Goodhart but accelerates failure in Local Causal Goodhart (because it prevents learning the non-linearity), you've won.

  ***

  **Project Proposal**

  **Title:** Goodhart's Regimes: Does the Taxonomy of Failure Predict the Success of Mitigation?

  **Summary**
  Goodhart's Law is a central bottleneck in AI safety. The standard working taxonomy divides Goodhart failures into four types: regressional, extremal, causal, and adversarial. While this classification is descriptively useful, it is prescriptively silent. We do not know if these categories represent fundamentally different phenomena requiring distinct interventions, or if they are merely surface-level variations on a single underlying dynamic. This project asks: **Do specific mitigation strategies succeed or fail depending on the underlying causal/optimizer structure of the Goodhart regime?**

  I propose a one-semester conceptual and case-study analysis to test whether the distinction between "correlational vs. causal proxies" and "selection vs. optimization pressure" maps onto the efficacy of common safety interventions. The goal is to produce a decision framework for safety practitioners: if you suspect you are in *this* regime, do *that* fix. If the taxonomy proves irrelevant to mitigation success, the project yields a valuable negative result: we should stop carving Goodhart's law at these joints and look for a unified theory of optimization pressure.

  **The Problem**
  Current safety literature treats Goodhart's Law as a monolith or relies on a taxonomy that conflates two distinct dimensions.
  1.  **The Proxy Structure:** Is the proxy correlated with the goal due to a common cause/selection effect, or does it partially cause the goal?
  2.  **The Pressure Source:** Is the failure due to statistical selection on tails (no agent gaming), or is there an optimizer in the loop actively exploiting the metric?

  The standard four-type taxonomy mixes these. For example, "Regressional Goodhart" is typically statistical noise + selection, while "Adversarial Goodhart" implies an agent gaming the system. However, there is a middle case that is currently under-theorized: **Local Causal Goodhart.** This occurs when the proxy is genuinely causally efficacious for the goal, but the relationship is non-linear or brittle. A handrail supports weight until you hang your whole body off it; teaching to the test improves scores and some skills, but degrades deeper understanding once intensity crosses a threshold.

  Current mitigation advice is often regime-agnostic. We are told to "rotate metrics," "use adversarial training," or "move to principle-based oversight." But if the failure mode is Local Causal (brittleness under load), adversarial training might not help (the system isn't gaming, it's just breaking), and metric rotation might prevent the system from learning the non-linear boundary where the proxy stops working. We need to know if the fix matches the failure mode.

  **Methodology**
  This is a conceptual project with empirical grounding. I do not have lab access to train models, so I will not be generating new ML data. Instead, I will use a comparative case study method, analyzing documented instances of specification gaming and metric failure in both ML systems and analogous human systems (economics, policy, education).

  I will construct a matrix crossing the two dimensions (Proxy Structure x Pressure Source) against three representative mitigation strategies:
  1.  **Metric Rotation:** Randomizing or swapping proxies to prevent over-optimization.
  2.  **Adversarial Red-Teaming:** Actively searching for exploits in the reward function.
  3.  **Principle-Based Oversight:** Replacing metrics with human judgment/constitutions.

  For each cell in the matrix, I will evaluate existing literature and case studies to determine if the mitigation is reported as successful, neutral, or counter-productive. I will pay specific attention to the "Local Causal" regime to see if it behaves differently from the standard "Correlational" regime.

  **Timeline (One Semester)**
  *   **Month 1: Conceptual Framework.** Formalize the two-dimensional taxonomy. Define the boundaries between "Local Causal" and standard "Causal/Extremal" Goodhart. Draft the criteria for mitigation success.
  *   **Month 2: Case Collection.** Gather 10-15 high-fidelity case studies. These will include published ML specification gaming incidents (e.g., reward hacking in RL) and non-ML analogues where the causal structure is better understood (e.g., economic policy failures, standardized testing).
  *   **Month 3: Analysis.** Map cases to the taxonomy. Evaluate which mitigations were attempted and their outcomes. Look for patterns: do certain fixes consistently fail in causal-brittleness regimes?
  *   **Month 4: Synthesis and Write-up.** Produce the final paper and a simplified "practitioner's guide" flowchart.

  **Deliverables**
  1.  **A Research Paper (approx. 8,000 words).** Suitable for a workshop like AI Safety or a philosophy of technology journal. It will argue for the decoupling of the two dimensions and present evidence on mitigation efficacy.
  2.  **A Mitigation Decision Tree.** A one-page visual guide for engineers. *Input:* Suspected Goodhart type. *Output:* Recommended mitigation strategy and confidence level.

  **Failure Conditions**
  This project could fail in two ways, both of which are informative:
  1.  **The Null Result:** If the analysis shows that mitigation success is uncorrelated with the taxonomy (i.e., fixes work or fail randomly across regimes), then the taxonomy is merely decorative. This is a valuable negative result that saves future researchers from using this framework.
  2.  **Indistinguishability:** If I cannot find clear cases where "Local Causal" Goodhart is distinct from "Extremal" Goodhart in practice, the proposed taxonomy collapses. This would suggest the distinction is theoretically sound but empirically inaccessible, implying we need different markers to identify regimes.

  **Relevance to Safety**
  If safety engineers are applying adversarial red-teaming to problems that are actually causal brittleness, they are wasting compute and potentially making things worse by optimizing for the wrong constraint. Conversely, if all Goodhart is effectively the same under high pressure, we can stop tailoring solutions and focus on universal bounds on optimization. Either way, clarifying the link between *diagnosis* and *treatment* is a prerequisite for scalable oversight.
