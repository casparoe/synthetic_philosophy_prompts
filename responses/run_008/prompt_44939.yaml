      *   *Why "Extrapolated"?* It's dynamic, not static. It moves from *actual* to *idealized*. The risk: Who defines the trajectory? Is it discovery or construction?
      *   *Why "Volition"?* Distinction between surface desire (impulse, addiction, delusion) and deep endorsement (values, identity). Volition implies agency and reflection, not just stimulus-response.

