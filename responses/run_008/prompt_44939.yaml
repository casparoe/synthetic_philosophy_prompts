answer: |-
  This is a profound and painful intellectual burden to carry, and I want to acknowledge the rigor with which you are approaching it. You are right to be suspicious of the slogan "what she would have wanted." In the context of Frontotemporal Dementia (FTD), that phrase is often a placeholder for the surrogate's own anxiety.

  You have identified a structural isomorphism between your predicament and the Coherent Extrapolated Volition (CEV) problem in AI alignment. Both involve an agent (you/the AI) trying to act on behalf of a principal (your mother/humanity) whose current output is corrupted, incomplete, or incoherent, by simulating what that principal would output under idealized conditions.

  Here is an analysis of the conceptual machinery, its failures, and how much of it can actually bear weight in your specific situation.

  ### 1. The Conceptual Machinery of CEV

  Coherent Extrapolated Volition was proposed by Eliezer Yudkowsky (2004) as a goal specification for Superintelligence. The core definition is: *Our coherent extrapolated volition is what we would want if we knew more, thought faster, were more the people we wished we were, and grew up further apart.*

  #### Why "Coherent"?
  In decision theory, preferences are only actionable if they can be represented as a utility function. Human preferences are rarely consistent; we suffer from akrasia (weakness of will), cyclic preferences (A > B > C > A), and context-dependent framing.
  *   **Technical Role:** Coherence is a requirement for *maximization*. An AI cannot maximize a contradiction. To act, the system must resolve conflicts into a single ordering.
  *   **Substantive Assumption:** It assumes that beneath the noise of impulse, ignorance, and cognitive bias, there is a stable attractor state—a "true self"—that the person would converge upon given enough reflection. It assumes that if you removed the fatigue, the fear, and the misinformation, you wouldn't just be *different*, you would be *consistent*.

  #### Why "Extrapolated"?
  Extrapolation implies a trajectory. It distinguishes between *revealed preference* (what I do) and *normative preference* (what I endorse).
  *   **The Difference:** If a smoker lights a cigarette, their revealed preference is smoking. If they say "I wish I didn't want this," their normative preference is health. Extrapolation attempts to follow the vector of the normative preference.
  *   **The Risk:** This is where the "discovery vs. construction" problem lies. Are we uncovering a hidden truth about the person, or are we building a new preference structure that merely *resembles* them? If the extrapolation procedure is complex enough, the output is determined more by the procedure than the input.

  #### Why "Volition"?
  "Preference" often connotes a static ranking of states. "Volition" implies agency and endorsement.
  *   **The Distinction:** A preference can be a reflex (I want to scream). Volition is a reflective stance (I want to be the kind of person who does not scream). CEV seeks the *reflective equilibrium*—the point where your desires about your desires settle down. It privileges the "higher-order" wants over the "first-order" impulses.

  ### 2. The Standard Objections

  You are right to interrogate the stability of this framework. The philosophical literature (and AI safety research) identifies three fatal cracks:

  1.  **Radical Underdetermination:** There is no unique "idealized self." If you simulate me thinking faster, do I become more utilitarian? More virtue-ethical? More selfish? Different paths of reflection lead to different fixed points. There is no mathematical guarantee that human values converge.
  2.  **Value Smuggling:** The extrapolation procedure itself contains values. To decide *how* to resolve a conflict in my preferences, the extrapolator must use a meta-ethic. If the AI (or you) decides that "consistency" is more important than "tradition," you have imposed that value. You are not finding *her* answer; you are finding the answer *you* think she would reach if she reasoned like *you*.
  3.  **Path Dependence:** The order in which conflicts are resolved matters. If you resolve her fear of her sisters before you resolve her desire for autonomy, you get a different result than if you do it in reverse. The "extrapolated volition" is not a pre-existing point in moral space; it is a product of the journey taken to get there.

  ### 3. Transferability: Humanity/AI vs. Individual/FTD

  This is the critical disanalogy. CEV was designed for a population with *intact* cognitive hardware that is merely *information-poor*. Your mother has *damaged* cognitive hardware.

  *   **The Hardware Problem:** CEV assumes the agent *can* think faster and know more. FTD degrades the prefrontal cortex—the very seat of the "volition" you are trying to extrapolate. The machinery required to perform the extrapolation (empathy, inhibition, long-term planning) is physiologically compromised. You are not extrapolating a hidden truth; you are trying to reconstruct a destroyed architecture.
  *   **The Aggregate vs. Individual:** In the humanity case, idiosyncrasies average out. In the individual case, there is no averaging. Her incoherence is total. You cannot rely on "the wisdom of the crowd" within her own mind because the crowd is gone.
  *   **The Surrogate Bias:** In AI alignment, we strive for a neutral extrapolator. In LPA, you are a grieving child. Your own values, your relationship with your aunts, your fear of making a mistake—these are massive variables in the equation. You cannot separate your volition from hers.

  **Verdict:** The CEV framework does not transfer as a *calculation*. It transfers only as a *heuristic for humility*. It reminds you that her current screams are not her whole story, but it cannot tell you exactly what the rest of the story is.

  ### 4. A Practical Framework for Decision Making

  Given that the "calculation" is impossible, you must move from *computing* her volition to *stewarding* her identity. When Present Wishes, Past Values, and Extrapolated Volition diverge, here is how to reason through it.

  #### Step 1: Triage the "Present Wish" (The FTD Filter)
  FTD produces specific types of distortions: disinhibition, apathy, loss of empathy, and paranoia.
  *   **Action:** Classify the current wish. Is it a *comfort* need (e.g., "I want ice cream") or a *relational/procedural* need (e.g., "I want to cut off my sisters")?
  *   **Rule:** Honor comfort wishes whenever possible (they reduce distress). Discount relational/procedural wishes that contradict decades of stable behavior, *unless* fulfilling them causes no harm.
  *   **Justification:** In FTD, paranoia is a symptom, not a judgment. Treating it as a valid "present wish" is like treating a fever as a preference for higher body temperature.

  #### Step 2: Anchor in "Past Values" (The Historical Self)
  Since the hardware is damaged, the last known good configuration is the most reliable data point.
  *   **Action:** Look for *enduring commitments*. You mentioned she loved her sisters for seventy years. That is a data point of immense weight compared to six months of suspicion.
  *   **Rule:** Past values win when present wishes would cause irreversible harm or violate core identity markers.
  *   **Justification:** This is the "Ulysses Contract." You are honoring the captain who charted the course, not the sailor currently delirious at the wheel.

  #### Step 3: Apply "Extrapolated Volition" as a Sanity Check (The Reflective Self)
  This is where you use the CEV concept, not as a calculation, but as a narrative test.
  *   **Action:** Do not ask "What would she decide?" Ask "What narrative would she endorse?"
  *   **The Test:** Imagine a future moment where the disease is arrested, and she is shown a recording of her life during this period. Would she feel *betrayed* by your decision, or *relieved*?
      *   If you isolate her from her sisters to stop her paranoia, will the "healthy Mom" feel you protected her dignity or stole her family?
      *   If you force her to see them, will she feel you respected her history or violated her current safety?
  *   **Rule:** Privilege the option that preserves the *continuity of her moral narrative*.
  *   **Justification:** This acknowledges that "she" is a story stretched across time, not a snapshot of the present.

  #### Step 4: Acknowledge the Surrogate's Burden (The Honest Limit)
  Here is where the framework runs out. There will be cases where the Past is silent, the Present is alarming, and the Extrapolation is ambiguous.
  *   **Reality:** In these gaps, *you* must decide. You cannot hide behind "her volition."
  *   **Justification:** You are not a mirror; you are a guardian. The law grants you LPA because someone must decide. If you freeze in an attempt to be perfectly objective, you have made a decision (inaction).
  *   **Procedure:** Make the decision based on *her best interest* (welfare, safety, dignity), explicitly acknowledging that this is *your* judgment call. Record *why* you weighed the factors as you did. This protects you from the guilt of pretending you found a "correct" answer that didn't exist.

  ### 5. Concrete Application: The Sisters Scenario

  Let's apply this to the specific conflict you mentioned: her suspicion of her sisters vs. her lifelong love for them.

  1.  **Present Wish:** "Stay away from my sisters; they are plotting against me." (FTD Paranoia).
  2.  **Past Value:** "My sisters are my lifeline; we are inseparable." (70-year history).
  3.  **Extrapolated Volition:** If she were well, would she want to be isolated based on a delusion, or would she want her family to manage her safety while maintaining connection?

  **Reasoning:**
  *   The "Coherence" check fails: Her present self is incoherent with her history.
  *   The "Hardware" check: FTD paranoia is physiological. It is not new information she has processed; it is noise.
  *   The "Volition" check: A person who valued family for 70 years would not want that value erased by a brain lesion.

  **Decision:**
  Do not cut off the sisters. Instead, manage the *interaction*.
  *   **Action:** Facilitate contact in low-stress environments, perhaps without you present if your presence triggers triangulation. Explain to the sisters that her accusations are symptoms, not accusations.
  *   **Why:** This honors the Past Value (connection) while mitigating the Present Wish's harm (distress). It aligns with the Extrapolated Volition (she would want her family to understand her illness, not obey her delusions).

  ### 6. Where the Framework Breaks

  You asked for honesty about where this runs out.

  1.  **The Grief Bias:** You are mourning her while she is alive. There is a risk that "Extrapolated Volition" becomes a memorialization project—preserving the mother you remember rather than caring for the woman who exists. You must ensure you are not prioritizing *your* need for her to be "herself" over *her* current comfort. Sometimes, the "well" mother would say, "Let me be happy in my delusion if it keeps me calm."
  2.  **The Irreducible Uncertainty:** You will never know if you got it right. CEV promises a convergent answer; reality offers only probabilities. You must make peace with the possibility that you will make a mistake that the "real her" would have rejected.
  3.  **The Moral Residue:** Even if you make the "right" decision, it will feel like a betrayal. Overriding her current wish feels like violence. Honoring it feels like negligence. This moral residue is not a sign of failure; it is a sign of the tragedy of the disease.

  ### Summary Recommendation

  Do not try to solve for $X$ (Her True Will). The variable is undefined.

  Instead, adopt a **Stewardship Model**:
  1.  **Presume Competence only where safe:** If a wish is harmless, let it stand, even if erratic.
  2.  **Protect the Narrative:** When wishes are harmful, default to the values that defined her for the majority of her life.
  3.  **Own the Decision:** When the past and present conflict irreconcilably, decide based on *welfare*, and admit to yourself: "I am choosing this because I am the guardian, not because I know her mind."

  You are not an AI aligning to a human. You are a human loving another human through the dissolution of their selfhood. The "principled account" you seek is not a formula that removes the burden, but a framework that ensures the burden is carried with integrity. CEV gives you the language to distinguish her disease from her desires, but it cannot spare you the grief of having to choose between them.
