      *   **User:** A child of a mother with early-onset frontotemporal dementia (FTD). They hold lasting power of attorney (LPA) for welfare. They are intellectually sophisticated, familiar with AI alignment concepts (specifically Coherent Extrapolated Volition - CEV), and are seeking a rigorous philosophical and practical framework to guide their decision-making.
