          *   *Assessment:* This solves the "too many causes" problem. It distinguishes Marta from the rest of humanity.
          *   *Verdict:* Somewhere in between (Solves the logical problem but introduces normativity into metaphysics).

      *   **Move (5) Ravi:** This makes causation normative (blame), not metaphysical (description). The physical facts don't change based on promises/duress.
          *   *Philosophical Context:* The distinction between causal selection and causal metaphysics. Is causation objective or interest-relative?
