      *   **Move (3) Ravi:** The "Too Many Causes" objection (Everyone on Earth failed to water them).
          *   *Philosophical Context:* The problem of profligate omissions. If absence of water causes death, why isn't the absence of water from *me* a cause?
          *   *Assessment:* This is a very strong objection to simple counterfactual theories of omission. It highlights the need for a selection mechanism.
          *   *Verdict:* Clearly right (as an objection to Elena's *initial* formulation).

      *   **Move (4) Elena:** Normative/Expectational fix. Only deviations from "what was supposed to happen" count.
