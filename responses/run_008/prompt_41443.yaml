  Let's do this**Sestina on Commensurability**

  The builder lays the brick, the shoemaker makes **shoes**,
  One shelters bodies, one protects the **house**,
  But distinct crafts arise from distinct **need**.
  We cannot trade unless we find a **measure**,
  No ratio renders different labour **equal**,
  Until we strike a shared and stabilising **convention**.

  Not nature's law, but human **convention**,
  Allows the swap of sandals for the **shoes**,
  Or rather, makes the products somehow **equal**,
  Though one man builds the wall, one guards the **house**.
  Without a common standard, no **measure**
  Can quantify the depth of another's **need**.

  It is not charity that answers **need**,
  But binding ties established by **convention**.
  The coin becomes the temporary **measure**,
  So five pairs fit the worth of crafted **shoes**,
  And one structure stands against the solid **house**,
  Until the values rendered strictly **equal**.

  To make the disparate somehow **equal**,
  We quantify the urgency of **need**.
  The city holds because each builds a **house**,
  Yet relies on this artificial **convention**.
  The shoemaker wears no bricks, the builder wears **shoes**,
  And money acts as proxy for the **measure**.

  The coin provides a universal **measure**,
  Making the unlike things appear **equal**.
  It circulates like blood between the **shoes**,
  And fills the gap created by our **need**.
  This bond is not natural, but **convention**,
  Yet it sustains the wall around the **house**.

  The polis stands upon the finished **house**,
  But requires a common standard **measure**.
  What holds us is not blood but **convention**,
  Making the products, not the men, **equal**,
  Not in skill, but in satisfaction of **need**,
  When coin exchanges leather for the **shoes**.

  *Envoi*

  So builder leaves the shoemaker with **shoes**,
  And keeps the keys to lock the empty **house**,
  Bound by a lack, a mutual and deep **need**.
  Yet something escapes the common **measure**,
  Some worth that will not render strictly **equal**,
  Unsettled by the law of **convention**.

