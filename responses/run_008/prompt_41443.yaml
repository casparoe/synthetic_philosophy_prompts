  **Interpretive Note**

  This poem leans on the interpretation that Aristotelian equality in exchange holds between products (representing labour) rather than the persons themselves, hence the sixth stanza's distinction. It treats *need* as the objective binding force of the polis, rather than subjective demand, to align with the text's teleological framing. I take a liberty by personifying 'convention' slightly to give it agency in holding the city together, whereas Aristotle sees it as a tool. The claim I am least confident about is embedded in the envoi: that something 'real remains incommensurable'. Scholars disagree on whether Aristotle believes money perfectly captures value or merely approximates it. The poem hints at a residue—perhaps the qualitative difference in crafts that quantification cannot fully erase—without settling whether this is a flaw in the system or a feature of human diversity. I retain 'convention' to emphasise the *nomos* vs *physis* distinction central to Book V.
