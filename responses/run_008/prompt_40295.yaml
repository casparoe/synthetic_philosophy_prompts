answer: |-
  ### (a) Exam Question

  **Question 5: The Continuity Restriction and Self-Locating Belief**

  Consider the following proposal regarding the reference class problem in anthropic reasoning, which we will call the **Continuity Restriction (CR)**:

  > *When calculating self-locating probabilities, an agent should only include observers in their reference class if those observers share a stream of consciousness that is continuous with the agent's own in the relevant phenomenological sense. Consequently, the class "all observers who will ever exist" is invalid, whereas "observers living through moments phenomenally continuous with this one" is valid.*

  Proponents argue CR is not merely a technical fix to avoid uncomfortable conclusions (like the Doomsday Argument), but is motivated by Parfit-style views on personal identity: if psychological continuity is what matters for survival, it should also bound epistemic comparison.

  Write an essay of approximately 1200–1500 words evaluating the viability of the Continuity Restriction. Your evaluation must address the following four specific points:

  1.  **Doomsday Impact:** Does CR actually block the Doomsday Argument, or does it merely shift the parameters? Explain whether the probabilistic inference survives within the restricted class.
  2.  **Motivation vs. Ad Hocness:** Evaluate the claim that CR is motivated by personal identity theory. Does "continuity of consciousness" do genuine philosophical work here, or is it functioning as a placeholder for "observers I want to count"?
  3.  **Sleeping Beauty Consistency:** Analyze how CR applies to Sleeping Beauty-type cases. Does the restriction align with one side of the SSA/SIA debate, or does it generate new inconsistencies in cases involving memory wipes or temporal gaps?
  4.  **Relocated Arbitrariness:** Critics argue CR simply moves the arbitrariness from "who counts as an observer" to "what counts as continuous." Discuss this in the context of fission or gradual replacement cases. Does this vagueness undermine the formal utility of the restriction?

  Do not simply summarize the literature on the Doomsday Argument or Sleeping Beauty. Your goal is to determine whether CR solves the reference class problem or merely disguises it.

  ***

  ### (b) Model Answer

  **The Metaphysical Mask: Why the Continuity Restriction Fails**

  The Continuity Restriction (CR) attempts to solve an epistemic problem—the reference class problem—using a metaphysical solution—personal identity. While intuitively appealing, CR fails because it conflates what matters for *survival* with what matters for *evidence*. It does not neutralize anthropic biases; it merely obscures the boundary where they apply.

  First, regarding the Doomsday Argument (DA), CR does not block the inference; it merely restricts the population to which the inference applies. The DA relies on the principle that you should reason as if you are a random sample from your reference class. If CR restricts the class to "phenomenally continuous observers," you are still a random sample from *that* class. If you find yourself early in the sequence of continuous conscious moments (e.g., the 100 billionth human-scale experience), the probabilistic pressure remains: unless you have independent evidence that the sequence will be vastly longer, you should expect it to end sooner rather than later. CR might exclude post-human AI or aliens, but it cannot exclude future humans who are psychologically continuous with us. Thus, the Doomsday conclusion survives within the restricted class. CR changes the denominator, but not the logic of the numerator.

  Second, the motivation for CR is suspect. Proponents claim it rests on Parfit-style views, but this is a misreading. Parfit argues that identity is not what matters; rather, psychological connectedness matters for *prudence* and *survival*. However, self-locating belief is not about survival; it is about evidential support. Why should the metaphysical bounds of my "self" dictate the bounds of my evidence? If a duplicate of me exists on Alpha Centauri with identical experiences but no causal continuity, their existence is still evidentially relevant to the question "what kind of world am I in?" By restricting the class to the连续 (continuous) self, CR privileges metaphysical identity over epistemic relevance. This suggests the restriction is ad hoc: it uses the language of identity to achieve the epistemic goal of shrinking the reference class, without justifying why identity limits evidence.

  Third, CR creates significant tension in Sleeping Beauty cases. In the standard puzzle, Beauty wakes up knowing she might be awakened once (Heads) or twice (Tails). If CR treats the Monday-Beauty and Tuesday-Beauty as distinct observers due to the memory wipe (a break in continuity), it pushes toward a Self-Indication Assumption (SIA) style view, where each awakening counts separately. However, if CR treats them as the same continuous consciousness merely interrupted by sleep, it aligns more with SSA. The problem is that "continuity" is unstable here. If a memory wipe breaks continuity, then every night's sleep potentially creates a new observer for anthropic purposes. This leads to absurd results: I should update my probabilities about the world simply because I took a nap. CR lacks the resources to distinguish between relevant discontinuities (fission) and irrelevant ones (sleep), leaving it unable to resolve the Sleeping Beauty debate consistently.

  Finally, CR relocates arbitrariness rather than eliminating it. The original problem was deciding who counts as an "observer." CR changes this to deciding what counts as "continuous." In fission cases (e.g., teletransportation where two copies emerge), is the stream of consciousness continuous with both, one, or neither? In gradual replacement cases (where neurons are replaced one by one), at what point does continuity break? If the reference class depends on a vague metaphysical boundary, the resulting probabilities become vague. Formal epistemology requires precise inputs to generate precise credences. If "continuity" is a matter of degree, then my probability of Doom is also a matter of degree in a way that cannot be quantified.

  In conclusion, the Continuity Restriction is a category error. It attempts to use the fuzzy boundaries of personal identity to sharpen the boundaries of probabilistic reasoning. Because the Doomsday inference survives within the restricted class, because the metaphysical motivation does not entail epistemic restriction, and because continuity itself is vague, CR fails to solve the reference class problem. It offers the comfort of a smaller reference class without the rigor required to justify it.

  ***

  ### (c) Marking Scheme (25 Marks)

  **1. Doomsday Impact (6 Marks)**
  *   **A (5-6):** Recognizes that DA relies on sampling *within* a class, not just the size of the class. Argues that even within a restricted "continuous" class, being "early" still implies a shorter future unless the restriction also limits future observers specifically.
  *   **B (3-4):** Claims CR blocks DA simply because the class is smaller. Fails to see that rank within the smaller class still generates the inference.
  *   **C (0-2):** Misstates the Doomsday Argument or claims CR has no effect at all without justification.

  **2. Motivation vs. Ad Hocness (6 Marks)**
  *   **A (5-6):** Distinguishes between *what matters for survival* (Parfit) and *what matters for evidence*. Argues that metaphysical identity boundaries do not necessarily track evidential relevance (e.g., duplicates are evidence even if not "me").
  *   **B (3-4):** Accepts the Parfit motivation at face value. Discusses identity but fails to challenge why identity should bound the reference class epistemically.
  *   **C (0-2):** Treats the motivation as purely technical or ignores the Parfit connection entirely.

  **3. Sleeping Beauty Consistency (6 Marks)**
  *   **A (5-6):** Identifies the tension regarding memory wipes/sleep. Notes that if continuity breaks at sleep, it leads to absurd updating (nap problem). If it doesn't, CR doesn't distinguish SB from standard cases.
  *   **B (3-4):** Applies CR to Sleeping Beauty but treats the continuity of Beauty as obvious/unproblematic. Fails to see the implication for SSA/SIA positioning.
  *   **C (0-2):** Does not apply CR to Sleeping Beauty or confuses the case entirely.

  **4. Relocated Arbitrariness (5 Marks)**
  *   **A (5):** Highlights that "continuity" is vague (fission/Ship of Theseus). Argues that vague boundaries yield vague probabilities, which undermines formal epistemology.
  *   **B (3-4):** Mentions vagueness but treats it as a minor practical issue rather than a structural flaw.
  *   **C (0-2):** Claims CR eliminates arbitrariness completely.

  **5. Argumentative Cohesion & Style (2 Marks)**
  *   **A (2):** Takes a clear stance (as required). Transitions between points are logical. No label-dropping without explanation.
  *   **B (1):** Hedges too much ("on the one hand, on the other") without reaching a conclusion.
  *   **C (0):** Disorganized or fails to follow word count constraints significantly.

  **General Note for Markers:**
  Penalize answers that simply summarize the Doomsday Argument or Sleeping Beauty without linking it back to the specific mechanics of the Continuity Restriction. An **A** answer must treat CR as the subject of evaluation, not just a hook to talk about standard anthropics. Specifically, look for the insight that *epistemic relevance* and *metaphysical identity* are distinct categories; B answers typically conflate them.
