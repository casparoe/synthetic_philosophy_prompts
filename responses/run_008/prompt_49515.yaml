      *   *Honest Answer:* It is mostly ad-hoc reactions to annoyance, *but* there is a defensible principle underlying the *ideal* state.
      *   *The Principle I will advocate:* **The "Common Element" Principle.** If it's part of the physical building and adds to property value, it's shared. If it's a consumable service, it's not. The gym is a physical part of the building.
      *   *Wait, looking at the prompt again:* "If the line is real, tell me what it is in plain terms. If it isn't, tell me why the fob decision nevertheless felt obviously right."
      *   *Okay, I need to choose:* Is the line real? Economically, yes (Public vs. Club goods). Philosophically/Community-wise, it's fuzzier.
      *   *My Stance:* The line is real, but the building is applying it inconsistently. The *best* principle for a condo is **Shared Burden for Shared Assets**. The gym fobs should go.
