      *   *Stronger Position:* The most cohesive principle for a *condo* (which is a form of shared ownership, not a hotel) is **Shared Ownership/Flat Fee**. The gym fobs are an anomaly that undermines the community aspect. The parking revenue is a bonus, not a fee structure.
