      *   *My Verdict:* Yes, the line is real. It's the difference between **Preservation** and **Consumption**.
      *   *My Recommendation:* The building should treat the gym as **Preservation/Shared Asset**, not Consumption. Remove the fobs. Why? Because transaction costs (admin, friction) outweigh the marginal fairness gain, and it damages the "community" value which is part of the property value.
      *   *Alternative Recommendation:* Stick with the **Benefit Principle** (Pay for what you use). This would mean assessing roof repair based on square footage or even usage (hard to measure).
      *   *Best Recommendation for a Condo:* **The Common Interest Principle.** Condos are legally structured to share common elements. The gym is a common element. Charging per use turns neighbors into customers.
