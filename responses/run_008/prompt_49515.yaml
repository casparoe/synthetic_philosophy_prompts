answer: |-
  Here is the definite answer you asked for.

  Your building's current setup is not based on a consistent principle. It is exactly what you suspect: a patchwork of rules made at different times by different groups of annoyed people. The roof rule is from 1978 inertia. The gym rule is a reaction to recent complaints. The parking rule is a revenue opportunity. There is no philosophy holding it together.

  However, there *is* a real line you can draw to fix it. It is not the line between "necessary" and "optional," because a roof is necessary and a gym is optional, yet both add to the value of your home. The real line is between **Infrastructure** and **Consumption**.

  **The Principle You Should Adopt:**
  Your board should commit to the **"Common Asset Principle."** This states: *If an asset is physically part of the building and owned jointly, its costs should be shared jointly, regardless of individual usage.*

  Under this principle, the gym fobs should be removed, and the gym should return to the general fund.

  **Why This Principle?**
  You are running a condo corporation, not a health club. The economic logic of a condo is that you buy a "bundle" of rights. You own your unit, plus a share of the land, the structure, and the amenities. When you start unbundling that package and charging for pieces of it, you create friction that costs more than it saves.

  Here is the plain-term breakdown of why the fob system is a mistake and why the Common Asset Principle is the only one that works for a community of owners:

  **1. Fixed Costs vs. Variable Costs**
  This is the most important economic reality your board is missing. The gym has high *fixed* costs and low *variable* costs.
  *   **Fixed:** The equipment, the electricity for the lights, the insurance, and the cleaning crew cost the same whether one person uses the gym or fifty people do.
  *   **Variable:** The wear and tear on the machines is the only cost that changes with usage.

  When you charge per visit, you are trying to recover fixed costs through variable fees. It doesn't work. If a heavy user pays more, it doesn't actually save the building money; it just shifts the burden from the non-user to the user. But since the non-user still owns a share of the equipment, they are paying for it through their property value even if they don't walk through the door. Charging them again to enter is double-dipping.

  **2. Transaction Costs**
  Every time you create a fee, you create administrative work. Someone has to manage the fobs, collect the money, fix the readers, and answer complaints when a fob doesn't work. In a forty-unit building, the cost of administering the gym fees (in board time and vendor contracts) likely eats up a significant chunk of the revenue. A flat fee in the general fund has near-zero transaction costs.

  **3. The "Subsidy" is the Point**
  The owners who complained about subsidizing gym users missed the fundamental nature of condo living. In a shared building, *everyone* subsidizes *everyone* else constantly.
  *   The family with three kids subsidizes the single owner when they wear out the elevator faster.
  *   The owner on the top floor subsidizes the owner on the first floor when the roof leaks (since the top floor takes the water damage first, but everyone pays for the fix).
  *   The non-gym user subsidizes the gym user.

  This isn't unfair; it's the definition of shared ownership. You pool risk and cost to maintain the property's overall value. A building with a "free" gym is worth more on the resale market than a building with a "pay-per-use" gym. By keeping the gym in the general fund, you are investing in the desirability of the whole building, which benefits the non-gym user when they go to sell their unit.

  **What Would Change?**
  If you adopt the Common Asset Principle, here is how your four categories resolve:

  1.  **Roof, Lobby, Hallways:** Stay in the general fund. (These are pure infrastructure).
  2.  **Gym:** **Remove the fobs.** Return to the general fund. The cost is spread across all units. The "fairness" gained by metering usage is an illusion because the bill doesn't go down if fewer people use it.
  3.  **Guest Parking:** Keep renting to outsiders. This is not charging owners for usage; it is monetizing excess capacity. The profit goes to the general fund to lower everyone's dues. This fits the principle because you are selling a surplus, not rationing a shared cost.
  4.  **Storage/Bikes:** Storage cages are effectively mini-units. Assigning them by lottery is fine, but if some are significantly better than others, there should be a small adjustment in dues. However, for simplicity, keeping them as a shared amenity is acceptable.

  **Why the Fob Decision Felt Right (But Was Wrong)**
  You asked why the fob decision felt obviously right at the time. It felt right because it appealed to a supermarket idea of fairness: *I should only pay for what I put in my cart.*

  But a condo isn't a supermarket. It's a partnership. The fob solution felt right because it punished the "heavy users" and rewarded the complainers, providing immediate emotional relief to the board. But it solved a political problem with an economic tool that doesn't fit. It treated a capital asset (the gym equipment) like a consumable good (like a towel or a drink).

  **The Verdict**
  The line between "things we can't divide" (roof) and "things we share for convenience" (gym) is a false line. Both are capital assets that maintain the building's value.

  Commit to the **Common Asset Principle**. Kill the fobs. Tell the owners that while they don't all use the gym, they all own it, and they all benefit from living in a building that offers it. If the gym is truly too expensive to maintain, the solution is to remove the equipment, not to charge rent to your neighbors. But as long as it exists, it belongs to everyone equally.
