          *   Avoid jargon (or explain it simply).

  2.  **Deconstruct the Economic/Philosophical Concepts:**
      *   *Public Goods:* Non-excludable and non-rivalrous (e.g., roof, lobbies). You can't stop someone from benefiting, and one person's benefit doesn't reduce another's.
      *   *Club Goods:* Excludable but non-rivalrous (up to a point) (e.g., gym, pool). You can lock the door, but one person working out doesn't stop another unless it's crowded.
      *   *Private/Common Goods:* Rivalrous (e.g., parking spots, storage cages). If I use it, you can't.
      *   *The User's Intuition:* The user is circling around the economic distinction between *public goods* (infrastructure) and *club goods* (amenities).
      *   *The "Fairness" Conflict:* Equality of burden (flat fee) vs. Equity of usage (user fee).

  3.  **Formulate a Position:**
