prompt: |-
  I have recently been promoted from senior engineer to head of user research at a mid-sized company that builds scheduling and triage software for hospital clinics, and I have discovered that nearly every product decision here rests on asking people to look inward and report what they find. When a clinic cancels its contract, someone telephones the practice manager and asks why. When we test a redesigned booking screen, we have users think aloud and afterwards tell us what confused them. When leadership wants to know whether clinics would pay for a new bed-management module, we ask them, and their answers go into the deck as findings.

  My own background is engineering rather than psychology, but I have read enough lately to be uneasy. There is the well-known line of work associated with Nisbett and Wilson in the 1970s arguing that when people explain their own choices they are often reporting a culturally available theory about what plausibly influenced them rather than anything they actually observed in themselves; there are the split-brain patients who confidently invent explanations for actions initiated by the other hemisphere; and there are the more recent choice-blindness experiments, in which participants notice nothing when their stated preference is secretly swapped for its opposite, then fluently explain and defend a decision they never made. At the same time, I do not want to overcorrect. It seems obvious that a report about experience happening right now — "I cannot read that label" — is different in kind from a retrospective causal claim — "I cancelled because of the price" — and I suspect the first kind is far more trustworthy than the second. I need something that captures that difference rather than a blanket rule that users lie.

  Please write a procedure my team can actually run. Specifically:

  1. A set of ordered questions or tests a researcher can apply to an individual introspective report during a twenty-minute debrief, with no statistics beyond what a non-specialist can do in their head. The questions should distinguish, at minimum, concurrent reports of experience from retrospective attributions of cause, and low-inference reports (what something felt like) from high-inference ones (why one behaved as one did), and should say what conditions make confabulation more or less likely — for instance the interval between the event and the report, whether the person is being asked for a cause at all rather than a description, and whether the offered cause is a socially flattering or conventional one.

  2. For each question, what counts as a sufficient answer, where the procedure terminates with "do not treat this as evidence about why the behaviour occurred; treat it only as data about what this person is prepared to say", and where the question is genuinely one of judgment that no procedure can close off — mark those honestly rather than dressing them up as steps.

  3. Then apply the procedure to three matters currently on my desk: (a) our churn interviews, in which eight of eleven cancelling clinics named price as their reason; (b) a round of usability tests in which six of eight users said the new triage screen was confusing, though their task times and error rates both improved against the old screen; and (c) a proposal to build a long-requested feature on the strength of clinic managers' assurances that they would use it weekly.

  4. Include at least one case where the procedure's honest output is one I will not enjoy delivering — I will say plainly that our most-quoted finding, the price explanation in the churn interviews, is the sort of retrospective, high-inference, socially conventional self-attribution the procedure weights lowest, and the procedure had better confirm or refute that rather than spare me.

  5. Finally, state what the procedure cannot do at all: which kinds of introspective reports it cannot grade, and which questions about users it cannot answer even in principle.

  For context on constraints: my team is three researchers and a designer, none with formal training in philosophy of mind or cognitive science; interviews and usability tests happen weekly, so the procedure must be cheap enough to run every time; and whatever we conclude has to be argued before a vice-president who trusts instruments and funnel numbers and will not accept "users might be confabulating" as a reason to discard data she has already quoted in a board meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Head of User Research (promoted from Senior Engineer).
      *   **Company Context:** Mid-sized, scheduling/triage software for hospital clinics.
      *   **Problem:** Over-reliance on introspective self-reports (asking users *why* they did things or *what* they want).
      *   **User's Knowledge:** Aware of Nisbett & Wilson, split-brain, choice blindness. Understands the difference between concurrent experience ("I can't read this") and retrospective causation ("I cancelled because of price").
      *   **Goal:** A practical, low-cost procedure for the team (3 researchers, 1 designer, no psych training) to evaluate introspective reports during debriefs.
      *   **Constraints:**
          *   Must be runnable in a 20-minute debrief.
          *   No complex statistics (mental math only).
          *   Must distinguish concurrent vs. retrospective, low-inference vs. high-inference.
          *   Must identify conditions for confabulation (timing, social desirability, etc.).
          *   Must define "sufficient answers" and where judgment is required.
          *   Must apply to three specific scenarios (Churn/Price, Usability/Confusion vs. Performance, Feature Request/Usage).
          *   Must include an "unpleasant truth" (specifically regarding the price/churn finding).
          *   Must state limitations (what it *can't* do).
          *   Audience for output: VP who trusts numbers/funnels (needs to be defensible).

  2.  **Deconstruct the Scientific Basis:**

      *   *Nisbett & Wilson (1977):* People don't have direct access to higher-order cognitive processes. They infer causes based on implicit causal theories.
      *   *Confabulation:* More likely when there's a time delay, when the cause is complex/hidden, or when a socially acceptable narrative exists.
      *   *Concurrent vs. Retrospective:* "Think aloud" (concurrent) is generally more reliable for *what* is happening, but even then, explanations of *why* are suspect.
      *   *Behavior vs. Speech:* Behavior (task time, errors, churn) often contradicts speech.
      *   *Social Desirability:* People want to sound rational, cost-conscious, or helpful.

  3.  **Drafting the Procedure (The "Introspection Weighting Protocol"):**

      *   *Name:* Needs to sound professional but actionable. "Introspection Weighting Protocol" (IWP) or "Report Reliability Matrix." Let's go with **The Introspection Reliability Protocol (IRP)**.
      *   *Structure:* Needs to be a checklist or a scoring system that doesn't require a calculator. A tiered weighting system works best.
      *   *Key Dimensions:*
          1.  **Timing:** Concurrent (during task) vs. Retrospective (after task/event).
          2.  **Inference Level:** Observation (sensory/cognitive state) vs. Causation (reason/motivation).
          3.  **Verifiability:** Can behavior corroborate this?
          4.  **Social Stake:** Is the answer "safe" or "flattering"?
      *   *Scoring:* High Reliability, Medium Reliability, Low Reliability (Confabulation Risk).
      *   *Termination:* When does a report get downgraded to "narrative only"?

  4.  **Developing the Steps (Addressing Requirement 1 & 2):**

      *   *Step 1: Timing Check.* Was it said *while* doing it or *after*?
      *   *Step 2: Content Check.* Is it a description of experience or an explanation of cause?
      *   *Step 3: Corroboration Check.* Does the log data/behavior match?
      *   *Step 4: Social Context Check.* Is this a "good" reason?
      *   *Decision Rule:* If Low Reliability, tag as "Stated Preference" not "Revealed Preference."

  5.  **Applying to Scenarios (Addressing Requirement 3 & 4):**

      *   *(a) Churn/Price:* Retrospective, High Inference, Socially Conventional (fiduciary duty). *Verdict:* Low reliability. Likely confabulation or rationalization. *Unpleasant Truth:* The VP's board deck is built on sand.
      *   *(b) Usability/Confusion:* Concurrent (mostly), Low Inference ("this is confusing"), but contradicts performance data. *Verdict:* Medium reliability on *feeling*, Low on *implication*. They feel anxious, but the design works.
      *   *(c) Feature Request:* Future-looking, Hypothetical. *Verdict:* Very Low reliability. "Would use" $\neq$ "Will use."

  6.  **Addressing the VP/Constraints (Addressing Requirement 5 & Context):**

      *   Need to translate "confabulation" into business terms. Use "Stated vs. Revealed Preference."
      *   Need to acknowledge limits. We can't know the *true* cause, only that the *stated* cause is unreliable.
      *   Need to keep it cheap. No extra tools, just a checklist during note-taking.

  7.  **Refining the Tone:**

      *   Professional, empirical, direct.
      *   Acknowledge the engineering background (logic, systems).
      *   Don't condescend to the VP, but provide armor for the researcher.
      *   Ensure the "unpleasant truth" is clear but constructive (it's not that the data is useless, it's that it measures *perception*, not *mechanism*).

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make it a literal checklist with "If/Then" logic.
      *   *Critique:* Did I address the "judgment" requirement?
      *   *Fix:* Explicitly mark steps where human judgment overrides the algorithm.
      *   *Critique:* Is the "unpleasant truth" strong enough?
      *   *Fix:* Explicitly state that the Price finding should be reclassified from "Root Cause" to "Customer Narrative."
      *   *Critique:* Will the VP accept this?
      *   *Fix:* Frame it as risk mitigation. "If we build based on this, here is the risk score."

  9.  **Final Polish:**

      *   Check against Nisbett/Wilson principles.
      *   Ensure the distinction between "I can't read this" (sensory) and "I left because of price" (causal theory) is central.
      *   Make sure the "limitations" section is honest (we can't read minds).

  10. **Final Output Structure:**
      *   Introduction (acknowledging the shift).
      *   The Procedure (The IRP).
      *   Application to the Three Cases.
      *   The Unpleasant Truth (Churn).
      *   Limitations.
      *   Closing advice for the VP conversation.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't just say "ignore the users." The prompt says "I do not want to overcorrect." The procedure must validate *some* introspection (concurrent, low-inference). I need to ensure the Usability Test result reflects that the *feeling* of confusion is real data, even if the *performance* contradicts the *severity*.

  Okay, ready to write.
answer: |-
  # The Introspection Reliability Protocol (IRP)

  **Purpose:** To grade user self-reports based on cognitive reliability, distinguishing between direct observations of experience and reconstructed causal narratives.
  **Audience:** Research Team (for execution) and Leadership (for risk assessment).
  **Cost:** Zero additional time; applied during note-taking and synthesis.

  ## Part 1: The Procedure

  This is a four-step filter. Apply it to every distinct claim a user makes during a debrief. Do not calculate a score; follow the decision tree.

  ### Step 1: The Timing Check
  **Question:** Was this statement made *during* the interaction (concurrent) or *after* the interaction/event concluded (retrospective)?
  *   **Concurrent:** "I am looking for the button now." / "This text is too small."
  *   **Retrospective:** "I clicked there because..." / "We cancelled because..."
  *   **Judgment Call:** If the debrief happens more than 5 minutes after the task/event, treat it as Retrospective.

  ### Step 2: The Inference Check
  **Question:** Is the user describing a **sensory/cognitive state** or explaining a **cause/motivation**?
  *   **Low-Inference (State):** "I felt frustrated." / "I couldn't find the date." / "This is confusing."
  *   **High-Inference (Cause):** "I didn't buy because the price was high." / "I clicked green because it looked safer."
  *   **Rule:** High-Inference claims require Step 3 verification. Low-Inference claims can stand as "Reported Experience."

  ### Step 3: The Corroboration Check (Behavioral Anchor)
  **Question:** Is there objective data (logs, task time, error count, actual churn) that supports this claim?
  *   **Supported:** User says "I was confused," and task time was 2x average.
  *   **Contradicted:** User says "This was confusing," but task time was fast and errors were zero.
  *   **Unverifiable:** User says "I would use this weekly," or "We cancelled because of price" (when multiple pricing tiers existed).
  *   **Rule:** If Contradicted or Unverifiable, downgrade the claim to **Stated Preference** (what they say) rather than **Revealed Preference** (what they did).

  ### Step 4: The Social Stake Check
  **Question:** Is the explanation provided socially conventional, professionally flattering, or morally "safe"?
  *   **High Stake (Risk of Confabulation):** Price (fiduciary responsibility), Efficiency (professional competence), Patient Safety (moral good).
  *   **Low Stake:** Aesthetic preference, Minor annoyance, Idiosyncratic workflow.
  *   **Rule:** If a High-Inference claim is also High Stake and Unverifiable (Step 3), flag it as **Probable Rationalization**.

  ---

  ### Termination Conditions & Output Tags

  At the end of the four steps, tag the finding in your report with one of three labels. This tells leadership how much weight to give the data.

  1.  **OBSERVED EXPERIENCE (High Weight):**
      *   *Criteria:* Concurrent + Low-Inference + (Optionally) Behaviorally Supported.
      *   *Action:* Treat as fact about the user's mental state. Fix the UI friction.
  2.  **STATED PREFERENCE (Medium Weight):**
      *   *Criteria:* Retrospective + Low-Inference OR Concurrent + High-Inference (Supported).
      *   *Action:* Treat as a hypothesis. Validate with A/B test or log analysis.
  3.  **NARRATIVE CONSTRUCTION (Low Weight):**
      *   *Criteria:* Retrospective + High-Inference + Unverifiable/Contradicted + High Social Stake.
      *   *Action:* **Do not treat as evidence of cause.** Treat as data about what story the customer tells themselves/stakeholders. Do not build product strategy solely on this.

  **Note on Judgment:** Step 4 requires human judgment. There is no algorithm for "socially flattering." If the team disagrees, default to **Narrative Construction**. It is safer to underestimate reliability than to overestimate it.

  ---

  ## Part 2: Application to Current Matters

  Here is the IRP applied to the three specific issues on your desk.

  ### (a) Churn Interviews: "Eight of eleven cancelling clinics named price."
  *   **Timing:** Retrospective (Contract already cancelled).
  *   **Inference:** High (Attributing cause of complex business decision).
  *   **Corroboration:** Unverifiable. (Did they compare line-item costs? Did they have budget left? Or was it a proxy for "value not perceived"?)
  *   **Social Stake:** High. Citing "price" is the fiduciary duty of a practice manager. It is professionally safer than saying "I didn't understand how to use it" or "My staff hated it."
  *   **IRP Tag:** **NARRATIVE CONSTRUCTION**.
  *   **Recommendation:** Do not lower prices based on this. Investigate *value realization*. The price is likely the *rationale*, not the *cause*.

  ### (b) Usability Test: "Screen is confusing" vs. Improved Task Times.
  *   **Timing:** Mixed (Think-aloud is Concurrent; Post-test summary is Retrospective).
  *   **Inference:** Low ("This is confusing" is a state report).
  *   **Corroboration:** Contradicted. (Performance improved).
  *   **Social Stake:** Low/Medium. Admitting confusion is slightly embarrassing but acceptable in a test.
  *   **IRP Tag:** **OBSERVED EXPERIENCE** (for the feeling) but **Contradicted** (for the severity).
  *   **Recommendation:** The users are experiencing *cognitive load* (the new flow requires attention), but the flow is *efficient*. Do not revert to the old screen. Instead, add scaffolding (tooltips, progress bars) to reduce the *feeling* of confusion without sacrificing the *speed* of the new design. Trust the timer, not the complaint.

  ### (c) Feature Proposal: "Managers assure us they would use it weekly."
  *   **Timing:** Retrospective/Future-looking (Hypothetical).
  *   **Inference:** High (Predicting future behavior).
  *   **Corroboration:** Unverifiable (Event has not happened).
  *   **Social Stake:** High. Managers want to appear engaged and innovative to vendors. Saying "Yes, we need this" is polite and flattering.
  *   **IRP Tag:** **NARRATIVE CONSTRUCTION**.
  *   **Recommendation:** Do not build based on assurances. Build a "Wizard of Oz" prototype or a minimal slice and measure *actual* weekly login rates. Treat their assurance as interest, not commitment.

  ---

  ## Part 3: The Unpleasant Truth

  You asked for honesty regarding the Vice-President's board deck. Here is the output you must deliver regarding the Churn/Price finding.

  **The Finding:** The claim that "Price is the primary driver of churn" is classified as **Narrative Construction**.
  **The Reason:** It fails three of four reliability checks. It is retrospective, high-inference, and socially conventional.
  **The Implication:** Your VP has presented a *customer rationalization* as a *market mechanic*.
  **The Risk:** If we compete on price, we will bleed margin without stopping churn, because the price was not the root cause. The root cause is likely hidden (e.g., onboarding friction, lack of integration, staff turnover at clinics) and the price is simply the acceptable excuse given to a vendor during an exit interview.
  **The Action:** You must advise the VP to reframe the board narrative from "We need a pricing strategy" to "We need a value-realization strategy." If she refuses, you must document that product decisions based on this data carry a **High Confidence Risk**.

  *Note: This will be uncomfortable. She has already quoted this. However, Nisbett & Wilson's work suggests that acting on this data is functionally equivalent to acting on a superstition. It is better to be the bearer of bad news now than the engineer of a failed pricing strategy next quarter.*

  ---

  ## Part 4: Limitations of the Procedure

  To maintain credibility with your VP and your team, you must explicitly state what the IRP *cannot* do.

  1.  **It Cannot Identify the True Cause:** The IRP can tell you that "Price" is an unreliable explanation, but it cannot tell you *why* they actually cancelled. It eliminates bad data; it does not generate new truth. You still need behavioral logs or controlled experiments to find the real cause.
  2.  **It Cannot Grade Intensity:** The protocol distinguishes reliable from unreliable reports, but it cannot quantify *how much* a user cares. A "Low Weight" narrative might still be widely held. (e.g., Everyone might confabulate the same reason).
  3.  **It Cannot Access the Unconscious:** If a user says "I don't know why I clicked that," the IRP tags it as Low-Inference (honest), but it still doesn't give you the reason. It protects you from false answers, but it does not force the mind to yield true ones.
  4.  **It Cannot Predict Future Behavior:** As seen in case (c), the procedure is inherently skeptical of hypotheticals. It cannot validate a business case for a new product line; it can only warn you that verbal assurances are insufficient evidence.

  ## Part 5: Implementation Notes for the VP

  When you present this to the Vice-President, do not use the language of psychology. She trusts instruments and funnels. Use the language of **Risk Management** and **Data Integrity**.

  *   **Don't say:** "Users are confabulating due to cognitive bias."
  *   **Do say:** "We have identified a discrepancy between Stated Preference (interviews) and Revealed Preference (logs). Our new protocol weights Revealed Preference higher to reduce product risk."
  *   **Don't say:** "Nisbett and Wilson prove we can't trust introspection."
  *   **Do say:** "Historical data shows that retrospective exit reasons correlate poorly with actual retention drivers. We are adjusting our model to account for this noise."

  This procedure allows you to keep the "human" element of research (empathy, understanding feelings) without falling into the trap of treating user narratives as engineering specifications. It turns your team from scribes who record what users say into analysts who evaluate what users mean.
