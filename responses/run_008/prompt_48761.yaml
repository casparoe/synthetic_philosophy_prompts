          *   Compliance (DDE): The death of children is foreseen, not intended. The intention is killing the commander.
          *   Anscombe (Conditional Intention/Means): You have made the death of the children a *condition of success* (or a guaranteed means). This is like deterrence. You have intended their death as a backup plan.
          *   *Wait, let's stick closer to the Threshold issue.*
          *   **The "Sliding Scale" Case.**
          *   Scenario: The system allows higher civilian casualty thresholds for "Higher Value Targets."
          *   Compliance: Proportionality.
          *   Anscombe: This treats innocent life as commensurable with military gain (Consequentialism), which she rejects.
          *   *Let's try to find the specific "Deterrence" parallel.*
          *   **The "Pre-Committed Cost" Case.**
          *   Scenario: Before the campaign, generals sign off on a plan that says "We accept up to 500 civilian deaths to neutralize this network."
