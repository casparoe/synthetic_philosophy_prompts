      *   *Coerced Killing (Sadistic Aggressor):* Distinguished between acting under threat vs. intending the evil. (Note: The user's summary says "has not committed murder," which aligns with her view on duress/coercion affecting voluntariness, but the core issue in war is usually intention).
      *   *Key Text:* "War and Murder" (1961) is the primary source here. Also "Mr. Truman's Degree."
      *   *Core Concept:* Intention is not just about what you want to happen, but what you *choose* as a means or an end. Foreseen consequences that are *not* part of the plan (means/end) are side effects. However, if you make the death of innocents a *condition* of your policy, you intend it.

  3.  **Evaluate the User's Hypotheses against the Track Record:**

      *   *Hypothesis 1: Strict Double Effect (Foreseen not intended = okay).*
