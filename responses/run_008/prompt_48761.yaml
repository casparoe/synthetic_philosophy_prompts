          1.  Strict Double Effect (foreseen not intended = okay).
          2.  Description of Object (military object vs. population/home).
          3.  Conditional Intention (programming thresholds = intending to kill innocents conditionally, like deterrence).
      *   **Goal:** Identify the best-fitting rule, apply it to the system, and propose a hypothetical case to test the rules against each other for the compliance team.

  2.  **Analyze Anscombe's Philosophy (The "Track Record"):**
      *   *Truman/Hiroshima/Nagasaki:* Condemned as murder of the innocent. Rejected "lives saved" consequentialism.
      *   *Area Bombing:* Condemned as murder. Targeting cities/populations directly.
      *   *Munitions Factory in Residential District:* Permissible under Double Effect (DDE). Target is the factory; civilian death is foreseen but not intended.
