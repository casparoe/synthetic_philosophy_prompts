          *   *Application to System:* Strikes on homes. If the home is treated as a "military objective" solely because an officer sleeps there, does that count as attacking a military objective or attacking a home (population)? Anscombe was skeptical of expanding "military objective" to cover things that are essentially civilian infrastructure.

      *   *Hypothesis 3: Conditional Intention (Deterrence Logic Extended).*
          *   *Fit:* Explains Deterrence. Explains why "thresholds" are dangerous. If I set a threshold of "5 civilians," I have decided that killing up to 5 civilians is *acceptable* to achieve the goal. I have made their death a permissible part of my plan.
          *   *Conflict:* Needs to be balanced against the Munitions Factory case. In the factory case, civilian death is *accepted* but not *intended*. Where is the line?
          *   *Refinement:* The line is whether the death is a *means* or a *condition*. In deterrence, the death is the *condition* of the threat's credibility. In the targeting system, if the system *optimizes* based on a threshold, does it make the deaths a parameter of success?
          *   *Anscombe's View on "Collateral Damage":* She was skeptical of the modern expansion of DDE to justify massive civilian casualties. She famously argued that if the civilian deaths are *certain* and *massive*, claiming they are "unintended" is a sham.

  4.  **Synthesize the "Best Fit" Rule:**
      *   Anscombe's core commitment is to the *sanctity of innocent life* and the *integrity of the will*.
      *   She rejects consequentialism (outcomes don't justify means).
      *   She rejects the corruption of the will (intending evil, even conditionally).
      *   *Crucial Distinction:* It's not just "foreseen vs. intended." It's about whether the action *itself* is essentially an attack on the innocent.
      *   *The "Threshold" Problem:* Setting a threshold ($N$ civilians) effectively says, "I intend to kill this target, and I am willing to kill $N$ innocents to do it." If the system *ranks* based on this, it incorporates civilian death into the calculation of value.
      *   *The "Home" Problem:* Attacking a home at night to kill a sleeper. Anscombe would likely view this as indistinguishable from area bombing if the method involves destroying the dwelling. The "military objective" is the person, but the *act* is destroying a home.
      *   *The "Automation/Bureaucracy" Problem:* She would reject the "distributed intent" argument. Moral responsibility isn't diluted by algorithms or chains of command. The person who sets the threshold intends the consequences the threshold allows.

      *   *Winning Rule:* **The Corruption of the Will via Conditional Acceptance.**
          *   It's not enough that you don't *desire* civilian death. If you structure your action such that civilian death is a *pre-accepted cost* (via thresholds) or if the *method* of attack essentially targets the civilian sphere (homes at night), you have intended the evil.
          *   Deterrence is condemned because it makes the murder of innocents a *policy option*.
          *   This system makes the murder of innocents a *calculated parameter*.
          *   Therefore, the system is likely morally illicit, specifically regarding the thresholding and the targeting of homes.

  5.  **Drafting the Prediction:**
      *   *Verdict:* She would likely condemn the system, or at least specific aspects (thresholds, home strikes).
      *   *Reasoning:*
          1.  **Rejection of "Distributed Intent":** Bureaucracy doesn't absolve moral agency. The designer/commander intends what the system does.
          2.  **Thresholds as Conditional Intention:** Setting a number ($N$) of acceptable civilian deaths is analogous to deterrence. It says, "We intend to kill up to $N$ innocents if it secures the target." This corrupts the will.
          3.  **Nature of the Target:** Attacking homes at night blurs the line between military objective and civilian population. If the method destroys the home, it looks like area bombing (which she condemned).
          4.  **DDE Limits:** She was strict on DDE. If the civilian death is *certain* and *integral* to the method (blowing up a house to get a guy), it's not a side effect; it's the means.

  6.  **Developing the Test Case (The "Sharp Separator"):**
      *   Need a case that separates "Strict DDE" (Compliance view) from "Conditional Intention/Corruption of Will" (Anscombe view).
      *   *Case Idea:* A system that *prevents* a strike if civilian deaths exceed $N$, vs. a system that *selects* the strike with the *lowest* civilian deaths among options.
      *   *Better Case:* The "Self-Exploding Shield" scenario.
      *   *Scenario:* An enemy officer hides in a bunker. To get him, you can fire a missile that *will* kill 5 civilians nearby (foreseen, not intended means). OR, you can fire a missile that *requires* the death of 1 civilian to arm the warhead (mechanical necessity).
      *   *Wait, let's look at the Threshold issue specifically.*
      *   *Test Case:* **The "Credit" System.**
