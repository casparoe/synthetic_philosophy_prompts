          *   *Anscombe:* If you choose Option 1, you *intend* the family's death because you chose a means that included it when a means excluding it was available. This touches on "necessity."
      *   *Let's go with the Threshold/Budget case.* It directly addresses the "programming a threshold" aspect the user is worried about and links to the Deterrence verdict.
