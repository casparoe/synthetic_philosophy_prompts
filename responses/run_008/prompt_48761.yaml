      *(Self-Correction on the "Home Strike" point)*: Anscombe was very specific about "murder of the innocent." If the officer is in a home, is the home a military objective? In *War and Murder*, she discusses the difference between attacking a combatant and attacking a civilian. If the method destroys the home, it attacks the civilian sphere. She would likely be highly skeptical of "person-targeting" that requires destroying civilian infrastructure.

