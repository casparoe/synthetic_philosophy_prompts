          *   *Application to System:* Compliance uses this. Anscombe would likely reject the "distributed intent" argument. Intent isn't diluted by bureaucracy; it's embedded in the policy.

      *   *Hypothesis 2: Description of Object (Military vs. Population).*
          *   *Fit:* Explains Hiroshima (population) vs. Factory (military).
