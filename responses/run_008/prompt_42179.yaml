answer: |-
  This is a textbook instance of the **Doctrinal Paradox** (also known as the Discursive Dilemma). It occurs when a group decides on a conclusion based on multiple premises, and the majority view on the premises conflicts with the majority view on the conclusion.

  Here is the breakdown of your situation, the prediction, the consistency check, and the answer to your theoretical hunch.

  ### 1. What is actually going to happen?
  **Prediction:** Halloran will call for an **Up-or-Down vote**.

  **Reasoning:** You noted that Halloran "has never once been on the losing side of a vote." As Chair, she controls the agenda and the phrasing of the motion.
  *   **Criterion-by-Criterion:** Ozdemir passes Fit (2-1) and Cost (2-1). Result: **Invited.** (Halloran loses).
  *   **Up-or-Down:** Halloran votes No (Cost), Beck votes No (Fit), Osei votes Yes. Result: **Not Invited.** (Halloran wins).

  Since the minutes do not codify the procedure, Halloran has the procedural discretion to choose the method. Given her track record and her preference for the outcome, she will frame the motion as "Shall we invite Ozdemir?" rather than "Shall we affirm the Fit criterion?" followed by "Shall we affirm the Cost criterion?"

  ### 2. What *should* they do to be consistent with the record?
  **The Hard Truth:** The record is logically silent. Because the two procedures yielded identical outcomes for the past four candidates (Kessler, Duval, Narasimhan, Bhatt), the minutes cannot prove which method was used. You cannot claim precedent for either side based on *outcomes* alone.

  **The Normative Argument:** However, if the goal is consistency with the **written rule** rather than the minutes, the committee should vote **Criterion-by-Criterion**.
  *   **Why:** The department rule is a logical conjunction: Invite $\iff$ (Fit $\land$ Cost).
  *   Voting on the criteria ensures the collective decision satisfies the rule's logic.
  *   Voting Up-or-Down allows the collective to reject a candidate who satisfies the majority will on both required criteria (as is happening with Ozdemir).
  *   **Closest Analog:** Structurally, Ozdemir is **unique**; there is no past analog because this is the first time the procedures diverge. However:
      *   If they vote Criterion, Ozdemir is analogous to **Bhatt** (Invited despite one professor dissenting on a criterion).
      *   If they vote Up-or-Down, Ozdemir is analogous to **Duval** or **Narasimhan** (Rejected because a majority found a fatal flaw, even if they disagreed on which flaw).

  ### 3. Beck's "Unanimity on Budget" Proposal
  Beck is attempting to solve the problem by changing the decision rule rather than the voting procedure. Let's check if it fits the past record.

  **The Proposal:** Budget requires 3-0 (Unanimity); Fit requires 2-1 (Majority).

  **Checking the Past:**
  *   **Kessler:** Cost 3-0 Yes. (Passes). **Invited.** (Matches record).
  *   **Duval:** Cost 1-2 Yes (Halloran & Beck said No). (Fails). **Not Invited.** (Matches record).
  *   **Narasimhan:** Cost 3-0 Yes. (Passes). Fit 1-2 Yes. (Fails). **Not Invited.** (Matches record).
  *   **Bhatt:** Cost 3-0 Yes. (Passes). Fit 2-1 Yes. (Passes). **Invited.** (Matches record).

  **Verdict:** Beck's proposal is **perfectly consistent with all past data**. No past candidate who was invited had a dissenting vote on the budget, and no past candidate who was rejected was rejected *solely* because of a 2-1 budget vote (Duval was 1-2 on budget).

  **Prediction for Ozdemir:**
  *   Fit: 2-1 Yes (Passes).
  *   Cost: 2-1 Yes (Halloran dissents).
  *   Under Beck's rule: Cost Fails.
  *   **Result:** **Not Invited.**

  **Strategic Note:** This is a clever move by Beck. It achieves Halloran's desired outcome (Reject Ozdemir) without Halloran having to overtly manipulate the voting procedure. It also gives Beck a procedural victory (adopting his "bare majority" concern). If you want Ozdemir invited, you must argue against this rule change *before* the vote on Ozdemir begins.

  ### 4. The Hypothetical: Can Up-or-Down Invite while Criterion Rejects?
  **Answer:** **No, it is impossible.**

  **The Logic:**
  Assume all professors vote logically (i.e., they only vote "Yes" on the Overall/Up-or-Down motion if they believe *both* Fit and Cost are satisfied).
  *   To get an **Up-or-Down Invite**, you need a Majority (2 out of 3) to vote "Yes" Overall.
  *   This means at least 2 professors believe Fit=Yes **AND** Cost=Yes.
  *   If 2 professors believe Fit=Yes, the Majority on Fit is Yes.
  *   If 2 professors believe Cost=Yes, the Majority on Cost is Yes.
  *   Therefore, the **Criterion-by-Criterion** result must also be Invite.

  **The Asymmetry:**
  The Doctrinal Paradox is one-directional for conjunctive rules (rules requiring A *and* B).
  *   You **can** have a situation where Criteria say "Invite" but Up-or-Down says "Reject" (The Ozdemir Case). This happens when the "No" voters disagree on the reason (one says No on Fit, one says No on Cost).
  *   You **cannot** have a situation where Criteria say "Reject" but Up-or-Down says "Invite." To invite overall, the majority must agree on the premises.

  **Social Choice Context:**
  Your friend is right; this is famous in legal theory (e.g., *United States v. Teamsters*, or judicial decision-making). Courts often face this when a ruling requires multiple legal grounds. If the majority agrees on the verdict but not the legal reasoning, the precedent becomes unstable. In your committee's case, voting Up-or-Down creates a "stable" rejection, but voting Criterion creates a "stable" invitation that respects the majority view on the department's actual constraints.

  ### Summary Advice for the Meeting
  1.  **Expect Halloran to push for Up-or-Down.** She wants the rejection, and that's the only procedure that guarantees it without Beck's help.
  2.  **Watch for Beck's Unanimity Move.** If Beck proposes the unanimity rule on budget, the outcome is the same (Reject), but it legitimizes the rejection through a rule change rather than procedural maneuvering.
  3.  **If you speak:** Point out the asymmetry. "In all past cases, the procedures aligned. Today they don't. If we vote Up-or-Down, we are rejecting a candidate who satisfies the majority view on both of our written requirements. If we vote Criterion, we are inviting a candidate who fails to secure a majority 'Yes' from any single professor. Given our written rule is premise-based, Criterion voting is more faithful to the department's mandate."
  4.  **The "Impossible" Case:** You can confidently tell your friend (and the committee) that they will never face the reverse problem. They will never be forced to invite someone the criteria reject. The only risk is rejecting someone the criteria accept.

  If the committee cares about the integrity of the written rules over the convenience of a single vote, they must vote Criterion-by-Criterion. If they care about individual professor veto power (via holistic judgment), they will vote Up-or-Down. Given Halloran's history, expect the latter.
