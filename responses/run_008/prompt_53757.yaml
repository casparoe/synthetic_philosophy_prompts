      *   **Constraints:** Do not defend animal ethics generally. Do not lecture on sentience. Do not assume the user knows where the difficulties are. Be discriminatory (don't flag everything as equally bad).
      *   **Input:** 8 specific claims.
      *   **Output Structure:** Tension analysis (pairs, severity, revision), Single best revision, Apparent vs. Real tensions, Meta-analysis (where my audit might fail).

  2.  **Analyze the Input Claims:**
