  ### Commentary on Form and Philosophy

  The pantoum form does its heaviest lifting in the final stanza, where the opening line ("The friend sent a gift...") returns not as a historical anecdote but as an ironic closure: the "gift" was the proof that there is no time in which to celebrate a birthday. I had to fight the form's natural tendency toward lyricism to keep the physics honest; specifically, resisting the urge to rhyme "dust" with "trust" or "lust" forced me to keep the focus on the mechanical tipping of light cones rather than human emotion. The repeating lines succeed because their context shifts from descriptive (stanza 1) to normative (stanza 6), enacting Gödel's argument that the same event revisited is not a renewal, but a negation of flow.
