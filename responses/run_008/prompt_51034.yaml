  ### Brainstorming Candidate Refrains

  To ensure the pantoum's circulation enacts the metaphysics of the Closed Timelike Curve (CTC), the repeating lines must sustain a semantic shift. They must be physically descriptive on the first pass and ontologically disruptive on the second.

  1.  **"The dust rotates in a static field"**
      *   *First Pass (Stanza 1):* A technical description of the Gödel metric's energy-momentum tensor (pressureless dust) and its stationary nature.
      *   *Second Pass (Stanza 2):* A paradoxical image. How can something rotate if the field is static? It hints that the "rotation" is not happening *in* time, but *is* the structure of spacetime itself.

  2.  **"The worldline closes on its own trace"**
      *   *First Pass (Stanza 1):* A geometric fact about the solution; a particle can return to its starting spacetime coordinates.
      *   *Second Pass (Stanza 2):* An existential condition. It is no longer just a curve in a manifold, but a fate that erases the distinction between departure and arrival.

  3.  **"No global now flows forward here"**
      *   *First Pass (Stanza 1):* A statement about the lack of a global time coordinate orthogonal to the hypersurfaces of homogeneity.
      *   *Second Pass (Stanza 6):* The philosophical verdict. Because the line returns at the poem's end, it is no longer a constraint of the model, but a statement about reality itself: time does not flow.

