          *   *Refinement:* The User argued "You can't get moral knowledge from authority." The Flatmate argued "Yes you can." The Institution says "On law/action, yes. On belief, no." Since the examples were action-based (contracts, food), the Flatmate is institutionally correct. But the User identified a real philosophical tension that the institution resolves via compartmentalization.

