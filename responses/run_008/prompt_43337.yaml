answer: |-
  ### Candidate principles

  1.  The Testimony Principle: Choices are rational only if prior experiencers can adequately describe the outcome (motivated by the conservatory case).
  2.  The Instrumentality Principle: Choices are rational only if they serve pre-existing values rather than replacing them (motivated by the hard work pill case).
  3.  The Agency Expansion Principle: Choices are rational only if they increase the agent's future capacity for autonomous choice (motivated by the cochlear implant case).

  ### The best principle, stated precisely

  The Principle of Agentic Capacity holds that a transformative choice is rational if it restores species-typical functioning, expands the agent's future menu of options, or develops capacities through active engagement, provided it does not chemically or coercively bypass the process of valuing itself. This distinguishes depression medication, which restores the capacity to choose, from the contentment pill, which artificially installs a value. It justifies the cochlear implant because it expands the child's future access to both hearing and deaf communities, maximizing their future autonomy rather than restricting them to one culture. However, it treats identity-changing commitments uniformly based on whether they enhance future flexibility. Consequently, it struggles to distinguish between joining the military and having a child, as both are irreversible commitments that restrict future options based on current immature preferences, suggesting one of these gut verdicts relies on social bias rather than strict rational structure.

  ### Two new cases

  **Case 1: The Memory Edit**
  Consider a veteran offered a procedure to erase combat trauma completely, removing the guilt and sadness but also the moral lessons learned. The principle verdicts this as irrational. While it restores emotional functioning, it bypasses the agentic process of integrating experience into one's character. Like the contentment pill, it edits the valuer rather than helping the valuer cope. It reduces the capacity for authentic future valuation by removing the raw material of moral growth, treating the self as a hard drive to be wiped rather than an agent to be healed through engagement.

  **Case 2: The Sabbatical**
  Consider a student delaying college to volunteer abroad for a year, knowing it will shift their political and social views. The principle verdicts this as rational. Like the conservatory case, this is an active engagement that expands horizons rather than a passive rewiring. It increases the student's future options by adding cultural fluency and maturity without locking them into a specific irreversible role. It preserves agentic capacity by allowing the student to encounter new values organically rather than having them implanted, fitting the criterion of development through engagement rather than value replacement.

  ### Verdicts to give up

  Your principle cannot accommodate the differing verdicts on the military and baby cases. Both are irreversible commitments made by eighteen-year-olds with limited epistemic access. If having a baby is irrational because you cannot know what parent you will be, joining the military is equally irrational because you cannot know what soldier you will become. Relinquish the intuition that the military is uniquely rational. Maintaining this distinction relies on social prestige rather than philosophical consistency. Accepting that both are epistemically risky transforms your principle from a patchwork of biases into a robust tool.
