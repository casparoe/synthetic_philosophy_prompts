  **JOINT STATEMENT OF THE CENTENNIAL SUBCOMMITTEE ON NARRATIVE AND EVIDENCE**
  **Signed:** [Name], Representative of the Historical Archive Working Group
  **Signed:** [Name], Representative of the Community Memory & Heritage Group
  **Date:** October 24, 2026
  **Subject:** Framework for the 1927 Mill Fire Centennial Commemoration

  ### 1. Claims Accepted by Both Parties

  We, the undersigned, having reviewed the digitized county archives and the oral traditions of the town, agree to the following premises as the basis for further deliberation:

  1.  **Regarding the Archive:** The recently digitized county archive contains specific documents not available to the public in 1952. These include coroner's inquest records regarding the death of a picketer, insurance investigation files noting the fire originated in the storage shed housing strikebreakers, and two external newspaper accounts alleging guards fired on picketers prior to the blaze. We agree these documents exist and constitute evidence, though we disagree on their sufficiency to overturn established public memory.
  2.  **Regarding the Plaque:** The plaque erected in 1952 states that striking workers set the fire and the militia arrived as rescuers. We agree this narrative facilitated a period of stability and economic cooperation between the mill-owning families and the union families for the latter half of the 20th century. We agree it functions as a foundational text of the town's current social cohesion.
  3.  **Regarding Limits:** We acknowledge that archival records from 1927 are incomplete and may reflect the biases of the insurance companies and local officials who created them. We simultaneously acknowledge that community memory is subject to erosion, conflation, and the political necessities of the time it was codified (specifically the Cold War era context of 1952).
  4.  **Regarding the Dead:** We agree that the town has an obligation to honor the dignity of all who died or were harmed in 1927: the mill workers, the strikebreakers housed in the shed, the militia members, and the owners. No commemoration should treat any of these groups as mere props in a story about the other.
  5.  **Regarding the Centennial:** We agree that the 2027 centennial is not merely a celebration but a act of transmission. Whatever form it takes will be read by future generations as the town's official stance on its own origin story.

  ### 2. Table of Residual Disagreements

  While we share the facts above, we interpret their significance differently. The following table outlines our irreducible differences. Each statement is phrased such that the signer believes it to be accurate.

  | Issue | The Archival Historian's Position | The Memory-Keeper's Position |
  | :--- | :--- | :--- |
  | **Epistemic Weight of Memory** | Collective memory is a *subject* of historical study, not a *source* of historical fact. It holds sociological weight but cannot override documentary evidence regarding physical events (e.g., where a fire started). | Collective memory is a form of social truth. If a community has sustained a narrative for 75 years to maintain peace, that narrative holds a validity equal to forensic evidence because it describes *who we are*, not just *what happened*. |
  | **Purpose of Commemoration** | Public commemoration is a **truth-apt practice**. Its primary function is to align public understanding with the best available evidence. To commemorate a known falsehood is to dishonor the dead by erasing the reality of their deaths. | Public commemoration is a **civic-ritual practice**. Its primary function is to bind the living together. If the ritual requires a simplified or mythologized past to function without reigniting conflict, that utility justifies the narrative choice. |
  | **The "We" of Commemoration** | The "We" is the current citizenry, bound by an ethical obligation to accuracy. We are not the heirs of the 1952 compromise; we are the trustees of the 1927 reality. | The "We" is the continuous community spanning 1927 to 2027. We are the heirs of the 1952 compromise. To break that compromise is to betray the generations who lived in the peace it purchased. |

  ### 3. The Cruxes

  We have identified three specific sub-questions (cruxes) where resolution would significantly shift the committee's final recommendation.

  *   **Crux A: The Ontological Status of the 1952 Plaque.**
      Is the plaque primarily a *historical claim* about 1927 that happens to be incorrect, or is it a *political artifact* of 1952 that successfully achieved a social goal? If it is the latter, does it deserve preservation as a monument to 1950s reconciliation rather than destruction as a lie about 1927?
  *   **Crux B: The Hierarchy of Harm.**
      Which harm is greater: the harm of perpetuating a factual inaccuracy regarding the cause of the fire, or the harm of destabilizing the inter-family reconciliation that relies on that inaccuracy? We need to determine if "truth" in this context inevitably leads to "conflict," or if "conflict" is a manageable byproduct of "truth."
  *   **Crux C: The Authority of Descendants.**
      Do the living descendants of the specific individuals involved (the mill owners, the union leaders, the strikebreakers) hold veto power over the narrative? If the archive contradicts the descendants' family lore, whose authority prevails: the document or the lineage?

  ### 4. Proposed Tests and Predictions

  To address the cruxes above, we propose the following concrete procedures. We have recorded our predictions in advance to ensure we are testing our assumptions, not just seeking validation.

  **For Crux A (The Plaque's Status):**
  *   **Procedure:** A focused review of the 1952 Town Council minutes and the correspondence of the 1952 Centennial Committee (if available in the attic of the Town Hall) to determine the *intent* of the plaque's wording.
  *   **Historian's Prediction:** The minutes will show the 1952 committee explicitly chose the "worker arson" narrative to discredit the union during the Cold War era, knowing it was contested. This proves the plaque is propaganda, not heritage.
  *   **Memory-Keeper's Prediction:** The minutes will show the 1952 committee explicitly chose the language to "stop the blame game" so the mill could reopen. This proves the plaque is a peace treaty, and its value lies in the intent to reconcile, not the forensic accuracy.

  **For Crux B (Hierarchy of Harm):**
  *   **Procedure:** Two structured, facilitated listening sessions. One with descendants of the mill owners/management, one with descendants of the union workers/strikers. (Note: Descendants of strikebreakers are difficult to locate but will be sought). The prompt asked will be: "Would you prefer the centennial tell the likely factual truth even if it causes tension, or the traditional story if it keeps the peace?"
  *   **Historian's Prediction:** Descendants of the slain picketer and the strikebreakers (if found) will express anger that their ancestors' deaths were covered up. They will view the "peace" as built on their silence. Truth will be welcomed as vindication.
  *   **Memory-Keeper's Prediction:** The majority of descendants on *both* sides (owners and workers) will express fatigue with the conflict. They will view the "truth" as academic nitpicking that threatens the town's current viability. They will prefer the traditional story as an act of respect for their parents' desire to move on.

  **For Crux C (Authority):**
  *   **Procedure:** A comparative review of how the town handled the 1975 flood commemoration, where records were clear but memories differed.
  *   **Historian's Prediction:** In 1975, the town deferred to the Army Corps of Engineers' data over local memory. This establishes a precedent that evidence trumps sentiment in official town business.
  *   **Memory-Keeper's Prediction:** In 1975, the town ignored the water-level markers and instead commemorated the "community spirit" of the rescue. This establishes a precedent that town commemorations prioritize civic identity over hydrological data.

  ### 5. Verbal vs. Substantive Dispute

  We conclude this statement by noting that a portion of our disagreement is verbal, though it carries substantive consequences.

  When the **Archival Historian** says the plaque's story is "false," they are using a correspondence theory of truth: *Did the workers physically light the match?* If the archive says no, the statement is false.

  When the **Memory-Keeper** says the plaque's story is "true," they are using a coherence theory of social truth: *Does this story accurately reflect the social reality the town has inhabited since 1952?* In the lived experience of the community, the workers *were* the aggressors because that is the role they were assigned to allow the town to function.

  **Resolution:** We agree that this verbal distinction does not solve the problem of what to put on the *new* 2027 marker. We cannot print "Socially True but Forensically False" on a brass plate. Therefore, while we acknowledge we are using the word "true" differently, we must treat the dispute as substantive for the purpose of the centennial. The physical design of the commemoration must account for both the forensic evidence (to satisfy the obligation to the dead) and the social function (to satisfy the obligation to the living). We propose that the solution lies not in choosing one truth, but in commemorating the *existence of the conflict itself*—including the conflict over the memory of the fire.
