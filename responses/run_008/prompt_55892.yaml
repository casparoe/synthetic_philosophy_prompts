  *(Self-Correction on British English)*: I need to be careful. "Pedant about American spellings" means I must use "colour", "favour", "organise", "centre". I will double-check the text.

  *(Refining the "Heavy Lifter")*: The concept of "Public Ethos" or "Institutional Purpose" is the key. It explains why the brother-in-law's contract is corruption even if the price is fair (subverts competition) and why the nurse might be okay (doesn't subvert care).

  *(Refining the Cultural Aspect)*: The Danish view is "Universalism". The Uncle's view is "Particularism". Neither is inherently "corrupt" in a vacuum, but corruption happens when you apply Particularism in a Universalist institution (like a Danish bureaucracy) or vice versa. Actually, it's more that corruption is the *clandestine* switch. I need to be careful not to validate nepotism as "just culture" if it undermines the specific institution's stated goals.

  *(Final Polish)*: Ensure the distinction between "corruption" and "bad behaviour" is clear. Not everything unethical is corruption. Corruption implies a specific role betrayal.

