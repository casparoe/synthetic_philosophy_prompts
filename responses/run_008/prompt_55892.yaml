answer: |-
  This is one of those arguments where everyone is partially right, which is why it feels so impossible to settle. You are bumping up against a problem that political scientists and philosophers have wrestled with for decades: corruption is what we call a 'essentially contested concept'. That means people agree on the central examples (a judge taking a bribe to throw a case), but they disagree fiercely on the boundaries.

  If you want a 'spec' for an adequate definition of corruption—one that doesn't collapse under pressure from your brother-in-law or your uncle—it needs to satisfy three non-negotiable requirements. If a definition fails any of these, it is useless for your argument.

  ### The Three Non-Negotiables

  **1. It must distinguish between 'breaking the rules' and 'corruption'.**
  A definition based solely on legality is no good. Laws can be corrupt (e.g., apartheid laws), and sometimes breaking a rule is necessary to save a life (a doctor bypassing red tape to treat a dying patient). Conversely, in some systems, you can do something perfectly legal that is still corrupt (like your Washington lobbying example).
  *   **The Spec:** Corruption must involve a breach of *duty*, not just a breach of *statute*.

  **2. It must account for 'private gain' without requiring money.**
  Your uncle's view (that giving nothing is rude) clashes with the idea that corruption is always about greed. But corruption can be about gaining power, securing a job for a nephew, or even just avoiding awkwardness. However, it can't just be 'doing a favour', or else all friendship is corruption.
  *   **The Spec:** The 'gain' can be for the official, their family, or their clique, but it must be the *reason* for the decision, not just a side effect.

  **3. It must identify harm to the 'public ethos' of the institution.**
  This is the big one. Corruption isn't just two people swapping envelopes; it's an attack on what the institution is supposed to do. A police force is supposed to be impartial; a hospital is supposed to treat based on need.
  *   **The Spec:** An act is corrupt if it subverts the core purpose of the role for an unauthorised reason.

  ### The 'Heavy Lifter': The Institutional Purpose Test

  You asked if one requirement does most of the work in ruling out popular but flawed definitions. Yes, it is the third one: **The Subversion of Institutional Purpose.**

  This requirement destroys the two most common (but wrong) ways people define corruption:
  1.  **"It's only corruption if it breaks the law."**
      *   *Why this fails:* If a politician writes a law that legalises kickbacks, the 'law' definition says it's fine. The 'Purpose' definition says: "The purpose of procurement is fair competition. You subverted that." It's still corruption.
  2.  **"It's only corruption if there is private financial gain."**
      *   *Why this fails:* This lets your politician brother-in-law off the hook. He didn't necessarily make extra money; the price was fair. But he subverted the purpose of the tender process (which is to ensure the *best* firm wins through open competition, not just *a* good firm that happens to be family).

  This requirement also helps with the cultural clash. In Denmark, the 'purpose' of a clerk is strict impartiality. In your uncle's context, the 'purpose' of a community member might be mutual support. Corruption occurs when you apply the rules of mutual support inside an institution designed for impartiality.

  ### Applying the Spec to Your Four Cases

  Here is how a robust definition handles the specific examples you raised.

  **1. The Nurse and the Wedding Gifts**
  *   **Verdict:** Likely **not corruption**, but risky.
  *   **Why:** If the gifts are unsolicited, given *after* care, and do not influence future treatment, the 'purpose' of the nursing role (care based on need) hasn't been subverted. However, if it creates an expectation that other families feel pressured to match, it erodes trust.
  *   **The Line:** It becomes corruption if the gifts become an *informal fee* required to get good care.

  **2. The Clerk and the Cousin's Neighbour**
  *   **Verdict:** **Corruption.**
  *   **Why:** Even if it costs nothing and the file was worthy, the purpose of a public clerk is to process files in order of receipt or urgency, not relationship. By moving the file, he has turned a public right into a private favour. It undermines trust in the queue.

  **3. The Politician and the Brother-in-Law's Contract**
  *   **Verdict:** **Corruption.**
  *   **Why:** This is the classic conflict of interest. Even if the price is fair and the road is built well, the *process* was subverted. The purpose of public contracting is to ensure the public gets the best value through competition. By steering it, the politician deprived other firms of the chance to bid. It signals that 'who you know' matters more than 'what you can do'.

  **4. The MP and the Election Cycle**
  *   **Verdict:** **Not corruption, but poor representation.**
  *   **Why:** This is the hardest one. An MP's purpose is to represent constituents, but they must also win elections to do so. Being more active near an election is 'responsiveness', which is part of democracy. It only becomes corruption if they actively *withhold* help from non-voters or trade specific votes for specific services (vote-buying).
  *   **The Distinction:** Corruption requires a *quid pro quo* (this for that). General responsiveness to pressure is politics, not corruption.

  ### The Cultural Trap: Universalism vs. Particularism

  You asked which requirements are genuine and which are just cultural preferences. This is the heart of your argument with your brother-in-law.

  *   **Your Brother-in-Law (Denmark):** Operates on **Universalism**. The rule applies to everyone equally, everywhere, all the time. A favour is a deviation from the rule.
  *   **Your Uncle:** Operates on **Particularism**. Obligations depend on the relationship. To ignore a family member's need is a moral failing.

  **The Trap:** It is culturally imperialist to say Universalism is 'moral' and Particularism is 'corrupt'. However, modern state institutions (tax offices, hospitals, courts) are *designed* on Universalist principles.

  **The Genuine Requirement:** Corruption is not 'breaking a cultural norm'; it is **betraying the specific trust of the institution you are serving.**
  *   If your uncle is acting as a *family elder*, helping a nephew is his job.
  *   If your uncle is acting as a *government clerk*, helping a nephew is corruption.

  The mistake people make is assuming the 'family' rules apply inside the 'state' building. Your brother-in-law is right that the state requires impartiality. Your uncle is right that community requires reciprocity. Corruption happens when you use community rules to run the state.

  ### The Impossible Trade-Offs

  You suspected that a rule handling all four cases cleanly might not exist. You are right. There are two requirements that often cannot be satisfied simultaneously.

  **1. Precision vs. Context**
  *   **The Conflict:** If you make the definition very precise (e.g., "any gift over £50 is corruption"), you catch the nurse's wedding present (too harsh). If you make it contextual ("depends on intent"), you let the corrupt politician claim it was just 'friendship' (too loose).
  *   **The Reality:** You cannot have a definition that is both a clear checklist *and* sensitive to nuance. You have to choose. For policy, we usually choose checklists (bright lines). For ethics, we choose nuance.

  **2. Impartiality vs. Responsiveness**
  *   **The Conflict:** This hits your MP case. If we demand total impartiality (the Danish model), politicians become robots who ignore the shifting will of the people. If we demand total responsiveness (do what voters want), they become populists who ignore long-term needs.
  *   **The Reality:** We cannot define corruption in a way that eliminates political judgement. Some 'favouritism' (listening to your voters more than non-voters) is the engine of democracy. The line is crossed only when the favour is *sold* or *exclusively transactional*.

  ### Summary for Your Argument

  If you want to settle this with your brother-in-law, here is the position to take:

  1.  **Agree on the Goal:** Corruption is about **betraying public trust for unauthorised reasons**, not just breaking rules or making money.
  2.  **The Cultural Compromise:** Acknowledge that his country and your uncle's country have different *baseline expectations*. In Denmark, a favour is suspicious. In your uncle's country, a refusal to help is suspicious. But **public office** generally demands the Danish standard (impartiality) globally, because that is what modern institutions require to function fairly.
  3.  **The Clincher:** Use the **Brother-in-Law Contract Case**. Agree that even if the road is built well, the *process* was corrupted because it denied other firms a fair shot. That is a universal principle of fair competition, not just a Danish preference.
  4.  **The MP Exception:** Admit that the MP case is different. That is not corruption; that is the messy reality of democracy. Conflating 'opportunism' with 'corruption' weakens the word.

  **One final note on your framing:** You mentioned you know "definately nothing" about political science. Just a gentle note: the spelling there is **definitely** (with an 'i'). Since your brother-in-law is a pedant about spelling, he will absolutely circle that if you send this to him! (I have ensured the rest of this text is in British English: *organisation, favour, programme, centre*).

  Good luck with the argument. It's a good one to have.
