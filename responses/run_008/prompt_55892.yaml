      *   *Market-Centred Definition:* Buying influence. (Problem: Lobbying is legal, gifts are cultural).
      *   *Public Interest Definition:* Harm to the common good. (Problem: "Common good" is subjective).
      *   *Moral/Integrity Definition:* Violation of duty. (Problem: Whose duty? Cultural variance).

  3.  **Address the Specific Cases (Mental Draft):**
      *   *Nurse:* Gratitude vs. Expectation. If unsolicited and post-care, usually okay. If pre-care or creates obligation, problematic.
      *   *Clerk:* Nepotism/Favouritism. Even if "no cost," it undermines the *principle* of impartiality.
      *   *Politician/Brother-in-law:* Conflict of interest. Even if price is fair, the *process* is compromised. Trust is eroded.
      *   *MP/Elections:* This is democracy (responsiveness), but if *only* then, it's neglect. Usually not called corruption, but "opportunism."

  4.  **Identify the "Spec" Requirements (The Core of the Answer):**
      *   To be adequate, a definition needs to handle:
          1.  **The Breach of Duty:** There must be a role involved (public, professional).
          2.  **The Improper Influence:** Something distorted the decision (money, relationship, fear).
          3.  **The Harm (or Risk thereof):** To trust, fairness, or efficiency.
      *   *Crucial Distinction:* Formal rules vs. Ethical norms. (The "Legalistic" trap).
      *   *Crucial Distinction:* Private gain vs. Public interest. (The "Gain" trap).

  5.  **Address the Cultural Clash (Denmark vs. "Elsewhere"):**
      *   Denmark: Universalism. Rules apply to everyone equally.
      *   Other context: Particularism. Relationships dictate obligations.
      *   *The Trap:* Calling one "corrupt" and the other "moral" is the argument. The definition needs to acknowledge *institutional context*. Corruption is the *subversion* of the institution's *own* logic.

  6.  **Identify the "Heavy Lifting" Requirement:**
      *   The prompt asks: "if one requirement does most of the work of ruling out popular ways of defining corruption... point that out."
      *   *Candidate:* **The Institutional Purpose Test.** Corruption isn't just breaking rules or gaining privately; it's acting against the *purpose* of the role.
      *   *Why:* It rules out "breaking unjust laws" (not corruption if the law is the problem) and "legal lobbying" (if it subverts the purpose of representation). It handles the "fair price nepotism" case (purpose of procurement is fair *competition*, not just fair price).

  7.  **Identify Incompatible Requirements (The Trade-offs):**
      *   You can't have a definition that is both *culturally neutral* and *morally absolute*.
      *   You can't easily distinguish "relationship building" from "corruption" in all contexts without knowing the specific institutional expectations.
      *   *The Big Tension:* **Impartiality vs. Responsiveness.** (The MP case). If an MP is purely impartial (robot), they aren't representing. If purely responsive (only before elections), they are corrupt-ish.

