prompt: |-
  In my metaphysics reading group we keep falling back on the picture of reality as a building that Schaffer introduced in his paper on grounding: the fundamental physical facts are the ground floor, facts about tables, meanings, and economies are upper storeys, and grounding is the load-bearing relation by which the upper levels rest on the lower ones — with the actual world somewhere between a single-level shack and a many-storeyed skyscraper. My supervisor uses the image to defend two conclusions at once: that metaphysics should be the study of structure (what grounds what) rather than of what exists, and that the denizens of the upper floors are in some sense less real than the fundamental ones. Before I press her on this in supervision, I want the analogy audited properly. Please give me the correspondence table (what plays the role of the foundations, the floors, the load-bearing supports, and so on), then identify where the mapping breaks — I'm worried that physical support is a causal, spatiotemporal, mechanical relation while grounding is supposed to be none of these, and that buildings have architects and can be built floor by floor, which seems to smuggle in a constructive element nobody wants. Say which disanalogies matter for my supervisor's two conclusions and which are harmless, and tell me whether either conclusion survives once the disanalogies are on the table — or whether the building was carrying them the whole time.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A metaphysics reading group discussing Jonathan Schaffer's grounding picture (specifically the "building" analogy).
      *   **Supervisor's Position:** Uses the analogy to defend two claims:
          1.  Metaphysics = study of structure (grounding), not just existence (quantification).
          2.  Upper-level entities (tables, etc.) are *less real* than fundamental entities (physical facts).
      *   **User's Concern:** The analogy might be doing too much work. Specifically, physical support is causal/spatiotemporal/mechanical, whereas grounding is not. Also, buildings imply construction/architects (temporal/process), which metaphysics usually avoids.
      *   **Task:**
          1.  Create a correspondence table (Building element $\to$ Metaphysical concept).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Evaluate which disanalogies matter for the supervisor's two conclusions.
          4.  Determine if the conclusions survive the audit or if the analogy was propping them up illegitimately.

  2.  **Deconstruct the Analogy (Schaffer's Building):**
      *   *Source:* Jonathan Schaffer, "On What Grounds What" (2009) and related work on priority monism/grounding.
      *   *Image:* Reality as a layered structure.
      *   *Key Components:* Foundations, Floors, Supports, Height/Level, Stability.

  3.  **Drafting the Correspondence Table:**
      *   Foundations $\to$ Fundamental facts/entities (the base).
      *   Upper Floors $\to$ Derivative facts/entities (special sciences, everyday objects).
      *   Load-bearing walls/columns $\to$ Grounding relations.
      *   Height/Storeys $\to$ Levels of ontological priority.
      *   The Building as a Whole $\to$ The World/Reality.
      *   Architect/Builder $\to$ ??? (This is a known trouble spot).
      *   Construction Process $\to$ ??? (Another trouble spot).

  4.  **Identifying Disanalogies (The "Breaks"):**
      *   *Spatiality:* Buildings exist in space; grounding is usually considered non-spatial (a table isn't physically *on top* of quarks).
      *   *Causality/Time:* Buildings are built over time; grounding is synchronic (atemporal determination).
      *   *Separability:* You can remove a floor (sometimes) without collapsing the whole building; in metaphysics, if the base goes, the derivative *must* go (modal connection).
      *   *Agency:* Buildings have builders; reality (usually) doesn't imply a creator in this context.
      *   *Materiality:* Bricks are made of matter; facts aren't "made of" other facts in a physical sense.
      *   *Reality Gradation:* In a building, the 10th floor is just as "real" (concrete) as the ground floor. In the supervisor's view, the 10th floor is *less real*.

  5.  **Evaluating the Supervisor's Conclusions:**

      *   *Conclusion 1: Metaphysics is the study of structure.*
          *   Does the building analogy support this? Yes, it highlights arrangement over inventory.
          *   Do the disanalogies hurt this? Not really. Even if grounding isn't spatial, it's still structural. The shift from "what exists" to "how it fits" survives the loss of spatiality.
          *   *Verdict:* Survives.

      *   *Conclusion 2: Upper floors are less real.*
          *   Does the building analogy support this? This is the tricky part. In a physical building, the penthouse is just as real as the foundation. The analogy *suggests* dependence, but dependence $\neq$ reduced reality (ontological free lunch vs. ontological diminution).
          *   Schaffer's actual view: He often argues for *Priority Monism* (the whole is fundamental), but regarding grounding, he treats it as an ordering relation. Does grounding imply *less being*?
          *   The "Less Real" claim is often associated with *Ontological Deflationism* or *Eliminativism* about the derivative.
          *   *The Analogy's Role:* The building analogy makes dependence intuitive. But does it make *irreality* intuitive? If I lean on a wall, the wall is real. If the wall rests on the foundation, the foundation is real. Is the wall *less* real? No.
          *   *The Disanalogy:* Physical support preserves reality. Metaphysical grounding (on the supervisor's view) diminishes it.
          *   *Verdict:* The analogy might be *illegitimately* carrying this conclusion. The intuition of "higher up = less substantial" comes from the analogy, not from the logic of grounding itself. This is the "Carrying" worry the user expressed.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Schaffer's specific view:* Schaffer actually distinguishes between *existence* and *fundamentality*. He thinks derivative things exist but aren't fundamental. Does "not fundamental" mean "less real"? Some say yes (degree of being), some say no (just different status). The supervisor says "less real."
      *   *The "Construction" Worry:* If reality is built, who built it? If it's not built, the "building" is static. This affects the *necessity* of the relation.
      *   *Causation vs. Grounding:* This is the standard objection. If grounding isn't causal, the "support" metaphor is misleading. Support implies if you remove the bottom, the top falls (counterfactual). Grounding implies if the bottom doesn't obtain, the top *cannot* obtain (metaphysical necessity). The building analogy captures the counterfactual dependence well, but maybe misses the modal strength.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ubiquity of the analogy and the sharpness of the user's critique.
      *   **Part 1: The Correspondence Table:** Clear mapping.
      *   **Part 2: The Structural Breaks (Disanalogies):** Focus on Space/Time, Causation, and Reality Gradation.
      *   **Part 3: Auditing Conclusion 1 (Structure vs. Existence):** Argue it survives. The analogy helps visualize hierarchy even if the "bricks" aren't physical.
      *   **Part 4: Auditing Conclusion 2 (Degrees of Reality):** Argue it does *not* survive (or is at least unsupported by the analogy). This is the critical point. The analogy smuggles in "fragility" or "derivativeness" as "unreality," which is a non-sequitur in the physical domain.
      *   **Conclusion:** Summary advice for the supervision.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Make sure to mention Schaffer specifically.* He coined/popularized this specific phrasing ("On What Grounds What").
      *   *Clarify "Less Real".* Is it existence or fundamentality? The supervisor says "less real." This is a strong claim (ontological gradation).
      *   *The "Architect" problem:* If there's no architect, the building is just *there*. This maps to the "Brute Fact" of the fundamental.
      *   *Key Insight:* The building analogy conflates *ontological dependence* with *ontological diminution*. A shadow depends on a stick, but is it less real? A building's top floor depends on the bottom, but is it less real? No. So the analogy fails to support the "less real" claim unless one already accepts that dependence entails diminution.

  9.  **Final Polish:** Check tone (academic, supportive, rigorous). Ensure the distinction between "fundamental" and "real" is clear, as that's the pivot point for the supervisor's second claim. (Schaffer often equates "fundamental" with "fully real," implying derivative things are "less fully real.")

      *(Self-Correction during drafting)*: Wait, Schaffer's view on monism is that the *cosmos* is the only fundamental thing. But in the grounding paper, he allows for a hierarchy. The supervisor is using the hierarchy to argue for *gradation of being*. I need to be careful not to conflate Schaffer's Monism with the generic Grounding picture. The prompt asks about the *picture* Schaffer introduced, used by the supervisor. I will focus on the analogy itself.

      *Crucial Point:* The "Less Real" claim is often called "Ontological Free Lunch" (Armstrong) or "Being as Degree" (Schaffer). The building analogy makes the *dependence* clear, but the *devaluation* is an extra step. I need to highlight that.

  10. **Final Review against constraints:**
      *   Correspondence table? Yes.
      *   Identify breaks? Yes.
      *   Evaluate disanalogies against the two conclusions? Yes.
      *   Verdict on whether conclusions survive? Yes.

      *Let's write it.*
answer: |-
  This is an excellent preparation for supervision. You have correctly identified that the "building" analogy (popularized by Jonathan Schaffer in *On What Grounds What*, 2009) is a pedagogical scaffold that risks becoming a substantive premise. If the scaffold contains structural flaws, any conclusions leaning on it may collapse.

  Here is the audit of the building analogy, broken down into the correspondence, the structural failures, and the verdict on your supervisor's two conclusions.

  ### 1. The Correspondence Table

  | Building Element | Metaphysical Role (Grounding Picture) | Intuitive Function |
  | :--- | :--- | :--- |
  | **The Foundations** | **The Fundamental Facts** (e.g., physical micro-states) | That which supports but is not supported; the "brute" base. |
  | **Upper Storeys** | **Derivative Facts** (e.g., tables, economies, morals) | That which is supported; exists in virtue of the base. |
  | **Load-Bearing Walls/Columns** | **Grounding Relations** | The dependency link; "in virtue of." |
  | **Height / Storey Level** | **Ontological Priority** | The ranking of facts from fundamental to derivative. |
  | **The Building as a Whole** | **The World / Totality of Facts** | The complete structure of reality. |
  | **Architect / Builder** | *(No direct correlate)* | Often maps to God (in theology) or Nature (in Spinozism), but usually intended to be **absent** in secular metaphysics. |
  | **Construction Process** | *(No direct correlate)* | Intended to be **absent**; grounding is synchronic, not diachronic. |

  ### 2. Where the Mapping Breaks (The Disanalogies)

  You identified two major worries: the nature of support (causal/spatial) and the implication of construction. Here is how they break down technically:

  **A. The Category Error of Support (Spatial/Causal vs. Metaphysical)**
  *   **The Analogy:** In a building, support is spatiotemporal and mechanical. The ground floor physically pushes up against the first floor to counteract gravity. If the ground floor is removed, the first floor falls *later*.
  *   **The Metaphysics:** Grounding is non-spatial, non-temporal, and non-causal. A table does not float above its atoms; it is constituted by them. If the atomic facts cease to obtain, the table facts do not "fall" later; they *simultaneously* cease to obtain.
  *   **The Break:** The building implies **contingent stability** (a building can be shored up by props); grounding implies **metaphysical necessity** (if the base obtains, the top *must* obtain).

  **B. The Construction Smuggle (Diachronic vs. Synchronic)**
  *   **The Analogy:** Buildings are built from the ground up over time. This suggests a process of assembly.
  *   **The Metaphysics:** Reality is not (typically) thought to be assembled. The fundamental facts do not precede the derivative facts in time.
  *   **The Break:** This smuggles in a **generative** element. It tempts one to think the fundamental facts *produce* the derivative facts (causation) rather than *realizing* them (constitution).

  **C. The Reality Gradient (The Crucial Break)**
  *   **The Analogy:** In a physical building, the penthouse is made of the same stuff (concrete, steel) as the foundation. It is just as "real," just as heavy, just as concrete.
  *   **The Metaphysics:** Your supervisor claims the upper floors are *less real*.
  *   **The Break:** The analogy provides **dependence** without providing **diminution**. In the physical world, dependence does not reduce ontological status. (A roof depends on walls, but is not *less of a thing* than the walls).

  ### 3. Auditing the Supervisor's Conclusions

  Here is the verdict on whether the conclusions survive once the disanalogies are exposed.

  #### Conclusion 1: Metaphysics is the study of structure, not just existence.
  *   **Does the analogy support this?** Yes. The building image shifts focus from "what bricks do we have?" (quantification) to "how are the bricks arranged?" (structure).
  *   **Do the disanalogies hurt this?** **No.** Even if grounding isn't spatial or mechanical, it is still a *relation* that imposes order. You can have a structure without space (e.g., a logical hierarchy). The shift from "what exists" to "what grounds what" remains valid even if the "building" is non-spatial.
  *   **Verdict:** **Survives.** The analogy is a helpful heuristic here, but the conclusion does not rely on the physical properties of buildings. It relies only on the existence of an asymmetric, transitive relation (grounding), which the analogy illustrates without strictly requiring physical support to be true.

  #### Conclusion 2: Upper-floor denizens are *less real* than fundamental ones.
  *   **Does the analogy support this?** **Illegitimately.** This is where your suspicion is correct. The building analogy makes the derivative facts look *fragile* or *secondary*, which psychologically primes us to accept they are "less real." However, logically, the analogy does not support this. As noted in Disanalogy C, a top floor is ontologically equal to a foundation in the physical world.
  *   **Do the disanalogies hurt this?** **Yes, fatally.** To get from "dependent" to "less real," you need an extra premise: *that dependence entails ontological diminution.* The building analogy hides this premise. It makes you feel the diminution because the top floor feels "precarious," but that is a feature of gravity, not metaphysics.
  *   **Verdict:** **Does Not Survive.** The building was carrying this conclusion the whole time.
      *   If you remove the physical intuition of "precariousness," there is no reason to think a fact that is *grounded* is *less real* than a fact that is *ungrounded*.
      *   Many metaphysicians (e.g., Kit Fine, Gideon Rosen) accept grounding structures but reject the idea that derivative entities are "less real." They argue for **Ontological Egalitarianism**: everything exists equally, but some things are fundamental.
      *   Your supervisor is likely conflating **Fundamentality** (a structural status) with **Reality** (an existential status). The building analogy encourages this conflation because in a building, the foundation is "more important" for stability, so we intuitively treat it as "more substantial."

  ### 4. Summary for Supervision

  When you press your supervisor, you can frame the critique like this:

  1.  **Acknowledge the utility:** The building analogy successfully motivates Conclusion 1 (Structure over Inventory). It helps visualize hierarchy without requiring spatial literalism.
  2.  **Challenge the cost:** However, the analogy smuggles in **ontological gradation** via the physics of stability. In the physical world, supported objects are not *less real* than supporters; they are just *supported*.
  3.  **The "Free Lunch" Problem:** If the upper floors are "less real," does that mean they are illusions? If not, in what metric are they "less"? The building analogy suggests they are "flimsier," but metaphysical facts are not flimsy.
  4.  **The Constructive Worry:** Ask her how the analogy handles the "Architect." If reality isn't built, the "storeys" must co-exist eternally/synchronically. If they co-exist, why does the lower one confer *more being* than the upper one?

  **Final Diagnosis:** The building analogy is a valid map for **Priority** (Conclusion 1), but it is a forged passport for **Degrees of Being** (Conclusion 2). Your supervisor is using the intuitive "weight" of the foundation to argue for a metaphysical weight that the logic of grounding does not necessarily carry. You should press her to defend the move from "X grounds Y" to "Y is less real than X" without using the word "support" or "foundation."
