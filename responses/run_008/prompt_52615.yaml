          *   User's Trilogy Ending (cities empty, script lost, literature oral, calendar kept).
      *   **Final Demand:** Tell plainly which verdicts the best principle *cannot* accommodate and which the user should give up.

  2.  **Deconstruct the User's Verdicts & Intuitions:**
      *   *LBA:* Systemic complexity loss (palaces, script, long-distance trade). Time depth matters (centuries to recover).
