          *   *Rome:* Administrative memory broken in West.
          *   *Black Death:* Memory intact (Church, Law).
          *   *Easter Island:* Knowledge of voyaging/statues lost.
          *   *Maya:* Script continued in North? User says South empty.
          *   *Trilogy:* Script lost, literature oral. This is the crux.

      *   *Candidate 3: The "Way of Life" vs. "Way of Organization" Distinction.*
