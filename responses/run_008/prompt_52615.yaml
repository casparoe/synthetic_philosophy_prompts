answer: |-
  You have identified the central tension in the study of societal failure: the distinction between the *substrate* (the people, the language, the peasants) and the *superstructure* (the state, the script, the long-distance networks). Your tentative principle fails because it focuses on *capacity* (what can be done) rather than *continuity* (how it is remembered and organized).

  Here is a principle that accommodates almost all your verdicts, followed by the necessary repairs, the judgment on your new cases, and the hard truth about which verdict you must surrender.

  ### The Principle: Discontinuity of Complexity

  **A society collapses when the specific mechanisms required to sustain its peak complexity are broken, such that they cannot be restored within a living memory, regardless of whether the population survives.**

  This principle relies on three clauses:
  1.  **Complexity is Local:** Collapse applies to the specific political/technological system (the Palace, the Western Empire, the Angkorian Hydraulic State), not necessarily the ethnic or linguistic group.
  2.  **The Memory Test:** If the knowledge of how to run the system vanishes or becomes inaccessible to the successors (loss of script, loss of engineering knowledge), it is a collapse. If the knowledge persists despite demographic shock, it is not.
  3.  **The Generational Horizon:** If restoration takes centuries (a "Dark Age"), it is a collapse. If restoration happens within generations, it is a crisis.

  ### Sifting Your Verdicts

  **1. Late Bronze Age (Collapse)**
  *   **Verdict:** Fits.
  *   **Reasoning:** The *Palace System* was the complexity. When the scripts vanished and trade networks shattered, the *mechanism* was broken. It took centuries to rebuild comparable complexity (Iron Age polities were different systems). The fact that peasants survived is irrelevant; the *civilization* (the superstructure) died.
  *   **Repair to your principle:** You worried that literacy returned. But Linear B did not return; the Greek alphabet came later from a different source. The *specific mechanism* was lost irreversibly.

  **2. Western Rome (Collapse)**
  *   **Verdict:** Fits.
  *   **Reasoning:** The administrative machinery (tax, standing army, imperial law) vanished in the West. The East flourishing is a separate political entity. The Latin of the countryside is the *substrate* surviving the *superstructure*.
  *   **Note:** This aligns with LBA. The "Rome" that collapsed was the complex state, not the people.

  **3. The Black Death (Not Collapse)**
  *   **Verdict:** Fits.
  *   **Reasoning:** The mechanisms of complexity (Church, Feudal Law, Guilds, Monarchy) remained intact. A priest could still read the liturgy; a king could still collect tax (eventually). The *software* survived the loss of *hardware* (people).

  **4. Easter Island (Collapse)**
  *   **Verdict:** Fits.
  *   **Reasoning:** The capacity to build canoes and moai required specific social organization and ecological knowledge. When the forests went, the *mechanism* for that complexity vanished. They adapted to a lower-complexity equilibrium.

  **5. The Highland Clearances (Not Collapse)**
  *   **Verdict:** Fits (as "Dissolution").
  *   **Reasoning:** This was not an internal failure of complexity, but an external absorption. The Highlanders did not lose the *capacity* to run their clans; they were forcibly removed by a *higher* complexity (the British Empire). It is conquest/displacement, not systemic collapse.

  **6. The Classic Maya (The Inconsistency)**
  *   **Verdict:** **Problematic.**
  *   **Reasoning:** Here your intuition conflicts with your Rome verdict. Structurally, the Southern Lowlands are identical to Western Rome: the political center fails, the monuments stop, but the people and language persist, and a "Northern Empire" (like Byzantium) carries the torch.
  *   **Diagnosis:** You are hesitating because you are defining "Maya" as an *ethnos* (a people) but "Rome" as a *polity* (a state). To be consistent, you must treat them the same.

  ### Judgments on the Undecided Cases

  **1. Angkor**
  *   **Verdict:** **Collapse.**
  *   **Reasoning:** Under the *Discontinuity of Complexity* principle, Angkor is a twin of the Classic Maya and the LBA. The hydraulic network that sustained the dense urban core was abandoned. The *Angkorian State* collapsed. That the Khmer kingship and language moved to Phnom Penh is analogous to Rome moving to Constantinople or the Maya moving to the North. The specific *civilizational form* (the hydraulic city) died.
  *   **Why:** If Rome is a collapse, Angkor must be. Both represent the failure of a specific, high-maintenance urban technology.

  **2. Your Trilogy Ending**
  *   **Verdict:** **Collapse.**
  *   **Reasoning:** You describe cities emptying and script being lost. This is the definitive marker of the LBA collapse. The shift from script to oral tradition is a **simplification of information density**. Written law, administration, and literature allow for a complexity of scale that oral tradition cannot sustain.
  *   **Distinction from Black Death:** In the Black Death, the script remained. In your ending, the script is lost. That is the difference between a demographic crisis and a civilizational collapse. The "operating system" has been downgraded.
  *   **The "Honest Principle" Test:** Can you call this collapse without calling the Black Death one? Yes. The Black Death killed the *users*; your ending deletes the *software*.

  ### The Hard Truth: What You Must Give Up

  You asked me to tell you plainly which verdict the best principle cannot accommodate.

  **You must give up your hesitation on the Maya.**

  You cannot have it both ways. If the fall of the Western Empire is a "collapse" despite the survival of the Eastern Empire and the continuity of the Latin peasantry, then the abandonment of the Southern Maya Lowlands is a "collapse" despite the survival of the Northern cities and the continuity of the Maya people.

  Your hesitation likely stems from a modern sensitivity to Indigenous continuity (the Maya are still here) versus a Eurocentric view of Rome (Rome is "gone"). But for the internal logic of your trilogy, you must choose a definition of "Society."
  *   If Society = **The People**, then neither Rome nor LBA nor Maya collapsed.
  *   If Society = **The Complex System**, then Rome, LBA, Maya, and Angkor all collapsed.

  Since you have already committed to Rome and LBA being collapses, you are committed to the **Complex System** definition. Therefore, the Classic Maya Southern Lowlands **collapsed**.

  ### Recommendation for the Trilogy

  Your ending (cities empty, script lost, oral survival) is a **classic collapse**, and it is distinct from the Black Death.

  *   **The Black Death** is a tragedy of *biology*.
  *   **Your Ending** is a tragedy of *memory*.

  The "principle" that saves your ending from being merely a "metamorphosis" is the **loss of fidelity**. When a society moves from script to orality, it loses the ability to coordinate complex actions across time and space. Laws become fluid; history becomes myth; administration becomes local. That is a reduction in complexity.

  **Final Verdict:**
  Write the ending as a collapse. It is honest. The peasants keeping the calendar is the *substrate* surviving, just as the Gaulish peasants kept speaking Latin. But the *Civilization*—the thing that built the cities and wrote the books—has failed. That is the sorrow your trilogy seeks to explore. Do not soften it to "metamorphosis" unless you are also willing to soften Rome to "reorganization." If Rome burned, your cities must burn too.
