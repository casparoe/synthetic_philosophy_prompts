answer: |-
  This is a fascinating taxonomy of social judgment. You have essentially mapped out the boundary conditions of Maya's liberalism regarding stereotypes. Based on the track record you've provided, I can offer predictions on the cousin's claims, diagnose the actual rule Maya is using, and design the "crucial case" to settle the debate.

  ### Part 1: Predictions on the Cousin's Claims

  Here is how I predict Maya will rule on the three dinner claims, based on her past verdicts.

  **1. The Dutch Claim:** *"Dutch bluntness is real, they're trained into it, and it reads as rude to outsiders but is completely normal there."*
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** This is the cleanest fit for her "Accepted" column. It mirrors the English queuing and Japanese indirectness claims perfectly. It identifies a behavioral pattern ("bluntness"), attributes it to socialization ("trained into it"), and contextualizes it without moral judgment ("normal there," "reads as rude to outsiders"). It treats the trait as a *social script*, not a soul.

  **2. The Swiss Claim:** *"Swiss punctuality is cultural for sure, but honestly it makes them dull — boring people to be friends with."*
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This is the trap. The first half ("punctuality is cultural") passes her mechanism test. However, the second half ("makes them dull," "boring people") fails her valence test. In her rejected list, "Italians are lazy" and "French are arrogant" are not just descriptions; they are negative character assessments. Calling a people "boring friends" moves from describing a *norm* (punctuality) to judging their *human worth* (dullness). Maya distinguishes between *what people do* (acceptable) and *who people are* (unacceptable).

  **3. The Finnish Claim:** *"Finns are introverted by temperament — that's just their makeup, though the culture encourages it too."*
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** You identified this as the crux, and you are right. This claim is descriptive and arguably accurate, which tempts the "Descriptive is fine" rule. However, the mechanism is fatal. Phrases like "by temperament" and "just their makeup" are synonyms for the "in the blood" phrasing that got the Irish claim rejected. Even if she admits culture encourages it, anchoring the trait in innate temperament violates her prohibition on "national souls" or biological essentialism.

  ### Part 2: Diagnosing the Implicit Rule

  You proposed two competing rules:
  1.  **Descriptive vs. Evaluative:** (True/Neutral = OK; Negative = Bad)
  2.  **Culture vs. Nature:** (Socialized = OK; Biological = Bad)

  **My assessment:** Rule #1 is incorrect. Rule #2 is closer, but incomplete.

  **Why Rule #1 fails:** The Irish case kills it. You noted Maya thought the mood description ("melancholic") was "sort of true," yet she rejected the claim. If "Descriptive is fine" were the rule, she would have accepted the Irish claim. She didn't. Therefore, truth/descriptiveness is not sufficient for acceptance.

  **Why Rule #2 is incomplete:** The Swiss case (and the Italian/French rejections) suggests that even if something is *cultural*, it can still be rejected if it is a negative character judgment. "Lazy" could be cultural, but she rejects it.

  **The Cleaner Rule:**
  Maya is running a **"Social Scripts vs. Essential Character"** rule.
  *   **Acceptable:** Generalizations about *learned behaviors, norms, and institutional habits* (Queuing, Indirectness, Trust, Bluntness). These are things people *do*.
  *   **Unacceptable:** Generalizations about *innate temperament, moral character, or human worth* (Blood, Temperament, Lazy, Arrogant, Boring). These are things people *are*.

  She is a sociological essentialist (cultures create patterns) but a biological anti-essentialist (people are not born with national souls). Furthermore, she refuses to let cultural generalizations morph into moral judgments about the people themselves.

  ### Part 3: The Crucial Case

  To definitively prove which rule she is running (and to test my "Scripts vs. Character" synthesis against your original two), you need a claim that isolates **Valence** from **Mechanism**.

  The Irish case proved that **Nature** is a veto (Descriptive + Nature = Reject).
  The Swiss case *suggests* that **Negative Valence** is a veto (Cultural + Negative = Reject?), but the Swiss claim is messy because "boring" is subjective.

  You need a claim that is **Explicitly Cultural** (passes the Nature veto) but **Explicitly Negative** (tests the Valence veto).

  **The Test Claim:**
  > *"Brazilians have a cultural relationship with time that is much more fluid than in the North; it's socialized, but it makes them professionally unreliable to outsiders."*

  **Why this splits the rules:**
  *   **Mechanism:** It is explicitly "cultural" and "socialized" (Not "in the blood").
  *   **Valence:** It is negative ("unreliable").
  *   **Content:** It is about a behavior (timekeeping), not a moral soul (like "lazy").

  **The Interpretation:**
  *   **If she ACCEPTS:** Her primary rule is **Culture vs. Nature**. She tolerates negative descriptions as long as they are attributed to learning rather than biology. (This would mean the Swiss rejection was purely about the word "boring" being too personal).
  *   **If she REJECTS:** Her primary rule is **Descriptive vs. Evaluative** (or my "Scripts vs. Character" refinement). She believes that even cultural generalizations become harmful when they assign a negative capability ("unreliable") to a whole people.

  **My Prediction on the Test Claim:**
  She will likely **REJECT** it, but she will argue about the word "unreliable." She might say, "It's not unreliable, it's *polychronic*." This would confirm the **Scripts vs. Character** rule: she allows cultural descriptions, but only if they are framed neutrally as *differences*, not *deficits*.

  ### Summary Advice for Saturday
  Watch her face during the Finnish claim. That is the moment of truth. If she flinches at "temperament," your "Culture vs. Nature" hunch is confirmed. If she nods along because it's "descriptive," then her "Irish" rejection was an anomaly, and the "Descriptive" rule is back in play. But bet on the flinch. The "in the blood" rejection is the strongest data point you have.
