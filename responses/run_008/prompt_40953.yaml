  # Discussion Handout: Mapping the Mind-Language Interface

  **Starting Point:** *I grant that controlled experiments have found cross-linguistic differences on tasks that don't require producing or comprehending any language.*

  Follow the path below by answering each question based on your judgment of the concrete cases described. Do not worry about which theoretical position your answer supports; simply choose the option that best matches your intuition about how the mind works.

  ***

  ### 1. Persistence Under Load
  Consider speakers of a language whose everyday descriptions require an absolute, compass-like directional frame (North/South) even when giving directions indoors. Experiments show they are faster at pointing to hidden objects than speakers of relative-frame languages (Left/Right).
  **If these speakers are asked to repeat nonsense syllables (a verbal distraction task) while performing the pointing task, what happens to their advantage?**

  *   **A. The advantage disappears; their performance becomes identical to the other group.** → *Go to Leaf 1*
  *   **B. The advantage remains; they still point faster despite the verbal distraction.** → *Go to Question 2*

  ### 2. Direction of Causation
  Consider two groups that carve the blue region of the spectrum differently. One group lives in a culture with heavy industrial dye use, the other in a subsistence herding culture.
  **Is the difference in their color memory driven specifically by the words they use, or do both the words and the memory stem from the different visual demands of their daily work and environment?**

  *   **A. It stems from the work and environment; the words just track those needs.** → *Go to Leaf 2*
  *   **B. It is driven by the words themselves; the linguistic categories shape the memory.** → *Go to Question 3*

  ### 3. Modulation or Constitution
  Consider a language that marks number on all nouns versus one that marks it on few. When speakers of the language without obligatory number marking need to track exact quantities larger than three:
  **Do they find it merely slower and more effortful, or are they genuinely unable to maintain that exact distinction without using number words?**

  *   **A. They are genuinely unable to maintain the distinction without the words.** → *Go to Leaf 3*
  *   **B. It is slower and harder, but still possible without the words.** → *Go to Question 4*

  ### 4. Grammar or Vocabulary
  Consider how speakers personify objects (e.g., calling a "bridge" strong or beautiful) based on grammatical gender, compared to how they distinguish shades of blue based on vocabulary.
  **Do the cognitive differences you believe in show up only where languages differ in obligatory grammar (like gender or tense), or also where they differ only in habitual vocabulary (like color terms)?**

  *   **A. Only where they differ in obligatory grammar.** → *Go to Question 5*
  *   **B. Also where they differ in habitual vocabulary.** → *Go to Question 5*

  ### 5. [Invented Question] Bilingual Flexibility
  Consider bilinguals tested in each of their languages. When they switch the language they are speaking during the session:
  **Does their performance on the non-linguistic sorting task switch immediately to match the new language, or does it stay locked to the language they learned first?**

  *   **A. It stays locked to the language they learned first (Fixed).**
      *   *If you chose 4A (Grammar):* → *Go to Leaf 4*
      *   *If you chose 4B (Vocabulary):* → *Go to Leaf 6 (Unnamed)*
  *   **B. It switches immediately to match the new language (Flexible).**
      *   *If you chose 4A (Grammar):* → *Go to Leaf 6 (Unnamed)*
      *   *If you chose 4B (Vocabulary):* → *Go to Leaf 5*

  ***

  ### Positions (Leaves)

  **Leaf 1: Thinking-for-Speaking**
  *   **Awkward Commitment:** This view must argue that the "offline" effects granted in the starting point were actually illusions caused by covert subvocalization during the task.

  **Leaf 2: Universalist / Artifact View**
  *   **Awkward Commitment:** This position requires dismissing robust experimental data as mere byproducts of culture or task design, denying language any causal role in cognition.

  **Leaf 3: Strong Determinism (Classic Whorfianism)**
  *   **Awkward Commitment:** It implies that speakers of certain languages are cognitively imprisoned, incapable of conceiving specific thoughts (like exact quantity) without the linguistic code.

  **Leaf 4: Habit-Level Relativity (Neo-Whorfian)**
  *   **Awkward Commitment:** It suggests that arbitrary grammatical markings (like gender) create deep, persistent attentional biases that are hard to override even when irrelevant.

  **Leaf 5: Language as Cognitive Tool / Technology**
  *   **Awkward Commitment:** It treats language as a voluntary software patch, implying deep cognitive restructuring can be turned on and off instantly depending on context.

  **Leaf 6: Unnamed**
  *   **Awkward Commitment:** This combination (e.g., Vocabulary-based effects that are Fixed, or Grammar-based effects that are Flexible) lacks a established theoretical home and implies a mechanism not currently well-modeled.

  ***

  ### Structural Notes for Discussion Leaders

  **Indistinguishable Leaves:**
  The tree may struggle to genuinely separate **Leaf 4 (Habit-Level)** and **Leaf 5 (Tool)** in practice. If a bilingual student reports that their thinking "feels" fixed but their performance data shows flexibility (or vice versa), the diagnostic question relies on self-report vs. behavioral data which may conflict. The boundary between a "deep habit" and a "readily accessible tool" is often a matter of degree rather than kind.

  **Unoccupied Combinations:**
  The combination of **Strong Determinism (Leaf 3 path) + Vocabulary Only (Question 4B)** is effectively empty in this tree (routed to Unnamed). This is likely not mere neglect: Strong Determinism relies on the *obligatory* nature of grammar to enforce cognitive constraints. Vocabulary is inherently optional (one can describe a "blue" object without using the word "blue"), so it is theoretically inconsistent to claim vocabulary alone makes a thought *impossible* (Constitution) rather than just harder (Modulation).
