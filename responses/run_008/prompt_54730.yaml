answer: |-
  This is a high-leverage funding decision. You are effectively asking whether to invest in fixing the engine (Coherence), building the dashboard (Surrogacy), analyzing the fuel (Measurement), or understanding the driver's psychology (Genealogy). Given your constraint (theory/formal work, 4 researchers, 2 years) and your organizational mission (welfare ethics + moral uncertainty), here is my defended ordering and allocation strategy.

  ### The Funding Priority Order

  I recommend allocating your four researcher-slots as follows:
  *   **2 Slots:** Question 1 (Coherence), specifically focused on *Lexical Fanaticism and Probability*.
  *   **1 Slot:** Question 4 (Practical Surrogacy), expanded to include *Moral Uncertainty Integration*.
  *   **1 Slot:** Question 2 (Measurement), reframed as *The Metaphysics of Commensurability*.
  *   **0 Slots:** Question 3 (Genealogy) as a standalone line item.

  Here is the detailed ranking and justification.

  #### 1. Formal Stability: The Lexical Fanaticism Problem (Subset of Coherence)
  **Rank:** #1 (Prerequisite)
  **Confidence:** High (90%)

  **Why it ranks first:** This is the primary bottleneck. The standard objection to lexical views is not that they are intuitively unappealing, but that they are decision-theoretically paralyzing. If a single instance of threshold-level suffering lexically dominates any amount of pleasure, then by standard expected value calculus, a sufficiently small probability of that suffering dominates any certain amount of good. This leads to "fanaticism": you must sacrifice all resources to prevent a 1-in-a-trillion chance of extreme torture. If LTNU entails this, it is practically dead for a grantmaking organization.

  **Dependencies:** Every other question depends on this. If the view cannot be formulated without implying fanaticism (or collapsing into standard utilitarianism to avoid it), funding the other lines is wasteful.
  **Tractability:** High for formal philosophers. This requires work in decision theory, probability truncation, or state-dependent utility. It does not require empirical collaboration.
  **Neglectedness:** Moderately neglected. While "fanaticism" is discussed in longtermism, specific solutions for *lexical* thresholds (e.g., lexical discounting, probability thresholds) are less developed than solutions for additive views.
  **Future Developments:** If a researcher demonstrates a formal model of LTNU that avoids fanaticism without arbitrary cut-offs, this view moves from "fringe" to "live option." If they prove it impossible, you kill the line of inquiry early.

  #### 2. Decision-Theoretic Surrogacy under Moral Uncertainty (Practical Surrogacy + Genealogy)
  **Rank:** #2 (High Leverage)
  **Confidence:** Medium-High (80%)

  **Why it ranks second:** You run a program on *moral uncertainty*. Even if LTNU is coherent (Question 1), you likely do not have credence 1.0 in it. The most valuable output for your organization is not "Is LTNU true?" but "How do we allocate grants if LTNU has a 30% credence?" This requires merging LTNU with frameworks like MEV (Maximize Expected Choice-Worthiness) or stochastic dominance. Furthermore, this is where I would fold the *Genealogy* question: knowing the evolutionary pedigree of lexical intuitions helps calibrate your *credence* in the theory, which is an input for the uncertainty model, not a standalone metaphysical project.

  **Dependencies:** Depends on Question 1 (you need a coherent target to approximate), but can proceed in parallel using "if-then" modeling.
  **Tractability:** High for philosophers with decision-theory training.
  **Neglectedness:** Highly neglected. Most work on moral uncertainty assumes additive value structures. Lexical values break standard aggregation methods in uncertainty frameworks.
  **Future Developments:** Development of "lexical-safe" voting rules or uncertainty frameworks would immediately increase the action-guidance of this research cluster.

  #### 3. The Metaphysics of Commensurability (Reframed Measurement)
  **Rank:** #3 (Foundational but Slow)
  **Confidence:** Medium (60%)

  **Why it ranks third:** This asks whether pleasure and pain are *types* of the same currency. If they are phenomenologically distinct categories (e.g., pain is a "rejection" signal, pleasure is an "acceptance" signal), lexicality is more plausible. However, this borders on empirical welfare science, which you want to avoid. Purely philosophical work here risks becoming stagnant conceptual analysis unless tied to formal axiology. It is less urgent than ensuring the theory doesn't explode (Q1) or isn't unactionable (Q2).

  **Dependencies:** Informs the *location* of the threshold in Q1, but not the *stability*.
  **Tractability:** Low/Medium. Hard to make progress without empirical collaboration, which you are limiting.
  **Neglectedness:** Crowded in phenomenology, neglected in formal axiology.
  **Future Developments:** If new formal models of "incomparable values" (e.g., Hsieh, Chang) are successfully applied to welfare, this could jump to #1.

  #### 4. Justificatory Genealogy
  **Rank:** #4 (Discard as Standalone)
  **Confidence:** High (85%)

  **Why it ranks last:** Whether lexical intuitions come from evolutionary heuristics or rational insight is meta-ethically interesting but decision-irrelevant for a 2-year grant cycle. Even if the intuition is a heuristic, it might track truth (evolutionary debunking arguments are notoriously difficult to cash out). Funding this distracts from the formal and decision-theoretic work that determines whether the view *works*. As noted, fold insights from this into the credence calibration for Question 2.

  ---

  ### Critique of Popular Framings

  You asked which rhetorical scaffolding is doing real work.

  **1. The "Pinprick" Argument (Overrated)**
  *   *The Framing:* "Would you trade a universe of happiness for avoiding a minor pinprick?" (Used to attack lexicality).
  *   *Verdict:* **Rhetorical Scaffolding.** This attacks *strict* lexicality (all pain > all pleasure). Your definition is *Threshold* Lexicality (severe pain > all pleasure; mild pain commensurable). The pinprick argument does not touch LTNU because LTNU explicitly allows mild pains to be outweighed. Researchers should be instructed to stop fighting this strawman.

  **2. Inference from Urgency to Lexicality (Underrated)**
  *   *The Framing:* "We prioritize saving a torture victim over feeding a million happy people; therefore, torture is lexically worse."
  *   *Verdict:* **Doing Real Work.** This is the strongest phenomenological anchor for LTNU. It connects directly to Question 2 (Surrogacy). If our *revealed preferences* in emergencies are lexical, our decision theory should reflect that, even if our reflective equilibrium is additive. This framing bridges the gap between intuition and formal policy.

  **3. Asymmetry of Creating Lives (Distinct Issue)**
  *   *The Framing:* "It is bad to create suffering lives, neutral to create happy lives."
  *   *Verdict:* **Distraction.** This is Population Ethics (Negative Utilitarianism vs. Asymmetry), not necessarily LTNU. One can hold LTNU without holding the Asymmetry (e.g., one could believe pleasure has positive value, but severe pain has *infinite* negative value). Conflating these muddies the formal work. Keep the research streams separate.

  ---

  ### Epistemic Transparency & Bias Check

  **Confidence in Major Claims:**
  *   **Claim:** *Fanaticism is the primary killer of LTNU.* (Confidence: 90%). The literature suggests this is the technical hurdle that renders the view unusable.
  *   **Claim:** *Genealogy is low priority for decision-making.* (Confidence: 85%). Meta-ethical origins rarely settle normative disputes in short timeframes.
  *   **Claim:** *Moral Uncertainty integration is high leverage.* (Confidence: 80%). This depends on the assumption that your organization actually operates under moral uncertainty rather than trying to find the "One True Theory."

  **The Point of Least Certainty:**
  I am least sure about the ranking of **Question 2 (Surrogacy/Uncertainty)** vs. **Question 3 (Metaphysics of Commensurability)**.
  *   *Why:* I have ranked Surrogacy higher because it is more actionable for a grantmaker. However, if the Metaphysics of Commensurability is resolved such that pleasure and pain are proven *incommensurable* (not just lexically, but categorically), then LTNU is the *only* coherent option, and the "Surrogacy" problem dissolves into a simpler constraint satisfaction problem.
  *   *What would flip it:* If a researcher demonstrates a novel formal method for measuring welfare intensity that suggests a continuous scale is phenomenologically accurate, LTNU becomes much harder to defend. If that empirical/theoretical bridge looks buildable in 2 years, Question 3 moves to #1.

  **Suspected Framing Bias:**
  I suspect I am privileging a **Decision-Theoretic / Effective Altruist framing** over a **Meta-Ethical / Phenomenological framing**.
  *   *The Bias:* My training prioritizes "action-guidance," "coherence," and "uncertainty integration." An outsider (e.g., a continental philosopher or a psychologist) might argue that Question 3 (Measurement/Phenomenology) is actually the *only* question that matters, because without solving the nature of value, formal coherence is just game-playing with undefined variables.
  *   *Mitigation:* I have retained one researcher slot for Question 3 to ensure the formal work remains grounded in a plausible axiology, rather than purely mathematical consistency. However, I acknowledge that a program focused purely on "truth-tracking" might rank Question 3 higher than "action-guidance."

  ### Summary Recommendation for the Call for Proposals
  When drafting the RFP, explicitly discourage "Pinprick" rebuttals. Require applicants to address the **Expected Value Fanaticism** objection (Question 1) or the **Moral Uncertainty Aggregation** problem (Question 2). This will filter out generic normative ethics proposals and attract the formal talent needed to make LTNU a viable operational framework.
