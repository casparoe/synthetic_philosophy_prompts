answer: |-
  Here is a principle that captures almost all of your intuitions without needing a four-clause exception list. It also gives you the ammunition to fight Maya.

  ### The Principle: **Adaptive Agency in the Face of Uncertainty**

  **Definition:** A system is intelligent to the degree that it **selects actions to achieve a goal** where the **correct action is not predetermined** by its environment or its programming.

  This principle relies on three dials you can turn up or down:
  1.  **Uncertainty:** Is the outcome unknown? (Distinguishes Chess from Calculators).
  2.  **Adaptability:** Does the system change its method when the first method fails? (Distinguishes the Rat's first run from its fiftieth).
  3.  **Agency (Goal Ownership):** Does the system *care* about the goal, or is the goal imposed from outside? (Distinguishes the Crow from Stockfish, and Slime Mold from Google Maps).

  Here is how this principle sorts your specific pile, solves your two big headaches, and handles the new case.

  ---

  ### 1. Solving the Stockfish vs. Calculator Problem
  **Your Verdict:** Stockfish = Thin Intelligence; Calculator = No Intelligence.
  **Maya's Objection:** They are both just code executing functions.

  **The Principle's Answer:** It comes down to **Search Space vs. Fixed Mapping.**
  *   **Calculator:** Input `2 + 2` *always* yields `4`. There is no uncertainty. There is no "choice." It is a fixed mapping. There is no contingency to navigate.
  *   **Stockfish:** Input `Board State` yields `Move`. But there are millions of possible moves, and the opponent is actively trying to thwart the goal. Stockfish must *navigate uncertainty*. It compresses a massive tree of possibilities into a single choice.
  *   **Why it's "Thin":** It satisfies **Uncertainty** and **Adaptability**, but it lacks **Agency**. It doesn't care if it wins. It is navigating uncertainty on *your* behalf, not its own.
  *   **Why the Crow is "Thicker":** The crow also navigates uncertainty, but it has **Agency**. If the wire doesn't work, the crow feels hunger (stakes) and tries a twig. Stockfish feels no stakes.

  **Argument for Maya:** Tell her: *"Computation is the engine, but intelligence is the steering. A calculator drives in a straight line on a rail. Stockfish steers through traffic. The Crow steers through traffic while also building the car and fearing a crash. They are computationally similar, but functionally distinct."*

  ### 2. Solving the Slime Mold vs. Google Maps Problem
  **Your Verdict:** Maps = No Intelligence; Slime Mold = Undecided (but feels different from ants).
  **The Intuition:** They both find the shortest path. Why does the mold feel smarter?

  **The Principle's Answer:** **Intrinsic vs. Extrinsic Teleology (Goal Direction).**
  *   **Google Maps:** The goal ("get me home") belongs to *you*. The app is a tool. If you turn the phone off, the app doesn't try harder to route you. It has no **Agency**. It executes a script written by engineers to solve *your* uncertainty.
  *   **Slime Mold:** The goal ("find nutrients") belongs to *it*. The computation is not running *on* the mold; the mold's physical growth *is* the computation. It risks its own biomass to solve the maze. It has **Agency** (survival) and navigates **Uncertainty** (the maze layout).
  *   **Why it feels different from Ants:** This is where your gut might be slightly inconsistent (see "Casualties" below), but the principle clarifies it: A single slime mold is a *single agent* adapting its body. An ant colony is a *superorganism*. If you view the individual ant as the unit, it has no uncertainty (follow pheromone). If you view the colony as the unit, it is intelligent. Your gut likely rejects the colony because it lacks a central "self," whereas the slime mold is a single cellular network acting as one "self."

  ### 3. The New Case: Self-Driving Car in Fog
  **Verdict:** **Thinly Intelligent.**
  *   **Analysis:** The car has a goal (arrive safely). It faces massive **Uncertainty** (fog obscures sensors, pedestrians might appear). It **Adapts** (slows down, changes lane, pulls over).
  *   **Why Thin?** Like Stockfish, it lacks **Agency**. It does not fear death. It is navigating uncertainty on behalf of the passenger. If the fog gets too thick, it doesn't "decide" to wait until tomorrow; it executes a fallback script. It is a sophisticated tool, not an agent.

  ### 4. The Casualties (Where the Principle Bites You)
  You asked for honesty about which verdicts this principle cannot save. Here are the two places your intuition conflicts with the principle:

  **A. The Ant Colony vs. Slime Mold**
  *   **The Conflict:** Biologically, the slime mold and the ant colony are doing the same thing: decentralized, emergent problem solving without a central brain.
  *   **The Hard Truth:** If the Slime Mold is intelligent under this principle (which it is, because it's a single adaptive agent), **the Ant Colony must also be intelligent** (as a collective unit). Your gut says "Ants = No" because you are focusing on the *individual ant*. But intelligence often lives at the level of the system.
  *   **The Sacrifice:** You have to either admit the colony is intelligent, or admit the slime mold isn't. You can't have both. Given your verdict on the "Social Friend" (who reads a room), you should probably concede the Colony is intelligent. A colony reads the "room" (environment) better than a single ant.

  **B. The Chatbot**
  *   **The Conflict:** The chatbot navigates uncertainty (your grief is unique) and adapts (generates novel text). But it lacks Agency.
  *   **The Hard Truth:** Under this principle, the Chatbot is **Stockfish for Emotions**. It is "Thinly Intelligent." Your flip-flop comes from confusing *impact* with *intelligence*. It had an intelligent *effect* on you, but the system itself was not intelligent. It was a mirror.
  *   **The Sacrifice:** You must accept that being comforted does not prove the comforter is intelligent. It proves the *designers* were intelligent.

  ### 5. How to Argue Back Against Maya
  Maya is likely arguing from a **Functionalist** perspective: *"If the output is the same, the process doesn't matter. If it solves the maze, it's intelligent."*

  Here is your counter-argument. It's called the **Stakes Test**:

  > "Maya, if I unplug the calculator, it doesn't care. If I turn off Stockfish, it doesn't lose anything. If I block the Crow's path, it experiences frustration and physical risk.
  >
  > Intelligence isn't just about processing power; it's about **information processing in the service of survival.**
  >
  > When you remove the 'need' from the equation, you don't have intelligence anymore; you have automation. A thermostat maintains temperature, but it would happily maintain 100 degrees if you wired it wrong. A rat *wants* the cheese. That 'want'—that internal pressure to resolve uncertainty—is the difference between a tool and a mind.
  >
  > So yes, Stockfish is intelligent, but it's a 'zombie' intelligence. It mimics the shape of thought without the weight of consequence. That's why it feels thinner than the dog. The dog has something to lose."

  ### Summary of Your Piled Verdicts vs. The Principle
  *   **Stockfish:** Thin Intelligence (High Uncertainty, Low Agency).
  *   **Calculator:** Not Intelligent (No Uncertainty).
  *   **Crow:** Thick Intelligence (High Uncertainty, High Agency).
  *   **Google Maps:** Not Intelligent (No Agency).
  *   **Thermostat:** Not Intelligent (No Uncertainty/Adaptation).
  *   **Ant Colony:** *Inconsistent.* Principle says Intelligent (Collective Agency), you say No.
  *   **Slime Mold:** Thick Intelligence (High Uncertainty, High Agency).
  *   **Rat:** Intelligent 1st run (High Uncertainty), Habit 50th run (Low Uncertainty).
  *   **Scammer:** Not Intelligent (No Adaptation).
  *   **Social Friend:** Thick Intelligence (High Uncertainty, High Agency).
  *   **Grandma:** Thick Intelligence (Pattern recognition in Uncertainty).
  *   **Chatbot:** Thin Intelligence (High Adaptation, No Agency).

  This principle keeps your "Thin vs. Thick" distinction coherent without being arbitrary. It defines "Thin" as **Tool-like Adaptation** and "Thick" as **Agent-like Adaptation.**
