answer: |-
  You have a very sharp intuition, and your "Past-Me vs. Present-Me" analogy is a classic *reductio ad absurdum* that philosophers and heterodox economists have used for decades. Your roommate is reciting a doctrine called "New Welfare Economics," which dates back to Lionel Robbins in the 1930s. It was designed to make economics look like physics by stripping out "unscientific" psychological claims.

  Here is the breakdown of where the argument breaks, which step to reject, and what it costs you to do so.

  ### The Step to Reject: Step (2)

  You should reject **Step (2)**: *"There are utility assignments fully consistent with [the evidence] on which Ann is much better off than Bob, and equally consistent assignments on which Bob is much better off."*

  **Why this step looks fine:**
  It looks fine because it is mathematically true *within the specific model* your roommate learned in Micro 101. In standard ordinal utility theory, utility is defined *as* a representation of choice. If all you have is a ranking of choices (Ann prefers A to B), the numbers you assign to those preferences are indeed arbitrary. You can multiply them by 10 or add 5, and the ranking stays the same. In that narrow mathematical context, the "unit" and "origin" are arbitrary conventions.

  **Why it is actually wrong:**
  Step (2) commits a category error. It confuses the **map** (the mathematical model of utility) with the **territory** (the actual psychological or neurological state of wellbeing).

  Your roommate is treating utility as a *scorecard* we invent to track choices. But when we talk about welfare policy or headaches, we are talking about *experienced utility* (pain, pleasure, satisfaction). That is a biological and psychological reality, not a mathematical convention.
  *   If Ann is screaming in agony and Bob is smiling, there *is* a fact of the matter about whose nervous system is under more stress.
  *   It is not true that "any utility assignment is consistent with the evidence." A utility assignment that says "Bob is in more pain than Ann" while Bob is smiling and Ann is screaming is **not** consistent with the physiological evidence, provided we understand utility as a brain state rather than just a choice ranking.

  Step (2) is only true if you assume, by fiat, that the *only* thing utility measures is revealed preference. But welfare policy isn't about respecting abstract preferences; it's about alleviating suffering and improving lives. For that, the "unit" is fixed by human neurobiology, not by algebra.

  ### The Backup: Step (4)

  If your roommate digs in and says, "Okay, but we can't *measure* the neural units perfectly," you should then reject **Step (4)**: *"A claim that no possible evidence could favor is not a factual claim."*

  **Why it looks fine:**
  It sounds like rigorous empiricism. It's a verificationist criterion of meaning: if you can't prove it, it's not real.

  **Why it is actually wrong:**
  This is a philosophical position (Logical Positivism) that was largely abandoned by the mid-20th century. In science, theories are often "underdetermined" by data (meaning the data doesn't conclusively prove one theory over another), but we still treat them as factual debates.
  *   **Example:** We can't conclusively prove the internal state of a black hole, but we don't say claims about black holes are "non-factual."
  *   **Cost of Rejecting (4):** You have to accept **Realism**. You have to admit that there are facts about the world (like whether Ann is suffering more than Bob) even if our current tools for measuring them are imperfect. You trade "methodological certainty" for "ontological truth."

  ### The Cost of Rejecting Step (2)

  If you force your roommate to reject Step (2), you cost him the elegance of his current framework. Here is the bill:

  1.  **He loses "Revealed Preference" Purity:** He can no longer say that choice is the *only* thing that matters. He has to admit that people can make choices that make them worse off (e.g., addiction, misinformation, coercion). This opens the door to paternalism, which many libertarians hate.
  2.  **He needs Interdisciplinary Data:** He can't just watch market behavior anymore. To compare Ann's utility to Bob's, he needs psychology, neuroscience, and self-reports. He has to treat economics as a branch of behavioral science, not a branch of logic.
  3.  **He admits Interpersonal Comparisons are Empirical, not Impossible:** He has to admit that saying "Ann suffers more than Bob" is a *hard scientific problem*, not a *logical impossibility*. It's like comparing the temperature of two different ovens. It requires calibration, but it's not meaningless.

  ### Addressing His Inconsistency

  Your roommate is being inconsistent when he admits "my headache was worse than my thirst" is factual but "Ann's headache is worse than Bob's" is not.

  *   **Intrapersonal (Headache vs. Thirst):** He accepts this because it happens in one brain. He assumes there is a common "currency" of pain in his own nervous system.
  *   **Interpersonal (Ann vs. Bob):** He denies this because it involves two brains.

  But biologically, Ann's brain and Bob's brain are the same model of hardware. If we can compare pain to thirst in one brain, we can, in principle, compare pain in Brain A to pain in Brain B by looking at the hardware (neural firing, cortisol levels, etc.). His refusal to do so is a methodological choice, not a logical necessity. He is prioritizing the *privacy* of the mind over the *similarity* of the species.

  ### How to Win the Argument

  Tell him this:

  > "Your argument works if utility is just a number we assign to choices. But welfare policy isn't about numbers; it's about suffering. If I see you bleeding and I see myself with a papercut, Step (2) says it's mathematically consistent to claim you're happier than me if we just rescale your utility function. That's absurd. The 'unit' of pain isn't arbitrary; it's biological. You're treating a medical fact like a accounting convention. If you accept that your headache yesterday was factually worse than your thirst today, you've already admitted utility has a real scale. Denying that scale exists across different people isn't science; it's solipsism."

  **Summary:** Reject **Step (2)**. It conflates the mathematical model with the biological reality. The cost is that economics becomes messier and more psychological, but it stops telling absurd lies about human suffering.
