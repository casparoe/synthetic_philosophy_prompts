answer: |-
  1. In tax-funded systems, non-graduates also contribute to university costs through general taxation, whereas debt models isolate the financial burden specifically to the borrower. This spreads the societal risk rather than forcing individuals to bet on their own future earnings.
  2. Explicit student loans accumulate compound interest regardless of your current income, while progressive taxes adjust automatically if your earnings drop or stagnate. This makes the tax model inherently more protective against financial hardship than a fixed debt obligation.
  3. The presence of debt creates a psychological barrier that discourages lower-income students from enrolling, even if repayment is technically income-contingent. Abolishing tuition removes the price signal entirely, encouraging participation based on merit rather than financial risk tolerance.
  4. Linking lifetime tax payments specifically to degree costs is an accounting fiction because taxes fund a broad basket of public services rather than acting as a direct user fee. Graduates do not stop paying taxes once their implied tuition is covered, nor do non-graduates stop benefiting from an educated workforce.
  5. In a debt model, the lender expects full repayment plus interest, whereas tax models treat education as an infrastructure investment with no expectation of individual reimbursement. This structural difference means the state absorbs the loss if a graduate never earns enough to cover their costs, whereas loan models transfer that financial risk to the individual.
