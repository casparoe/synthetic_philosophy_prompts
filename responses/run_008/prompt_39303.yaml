answer: |-
  You must reframe assertion as a constitutive rule distinct from calibration accuracy, using the lottery case to force a choice between knowledge and truth while rejecting Moorean sentences that distract from the normative stake.

  **Preconditions for Intelligibility**
  Before introducing the three candidates (Knowledge, Truth, Belief), you must dismantle two category errors inherent to forecasting hobbyists.
  1.  **Norm vs. Etiquette (Minutes 0–5):** They will hear "norm" as social pressure (e.g., "don't be rude"). You must define it as a *constitutive rule* analogous to chess: moving a pawn backwards isn't "rude," it's not chess. Assertion without the proper norm isn't just impolite; it fails to count as assertion. Use this analogy immediately to prevent them from treating the norm as a matter of community consensus.
  2.  **Assertion vs. Prediction (Minutes 5–10):** They treat "It will rain" and "70% chance of rain" as the same speech act with different precision. You must distinguish *flat-out assertion* (committing to *p* as a premise for others' reasoning) from *probabilistic forecasting* (offering a frequency). Calibration governs the latter; the Knowledge/Truth/Belief debate governs the former. If you do not sever these, they will argue that calibration solves the problem by eliminating flat-out assertion entirely.

  **The Single Example: The Lottery Case**
  Do not use Moore-paradoxical sentences ("p, but I don't believe p"). They are the wrong vehicle because they test the Belief Norm specifically, whereas your audience's tension lies between Truth (calibration) and Knowledge. Moorean sentences will derail the session into linguistic self-reference and psychology rather than epistemic licensing.
  *   **Use the Lottery Case instead:** You hold one ticket in a fair million-ticket lottery. The draw has happened but results are sealed.
  *   **What it must have:** High statistical probability (Truth/Belief satisfied), lack of specific evidence (Knowledge unsatisfied), and a strong intuition that asserting "Your ticket lost" is improper before the reveal.
  *   **What it must lack:** Emotional stakes or practical consequences (keep it sterile) so they cannot argue from harm to normativity.
  *   **Why:** This case isolates Truth from Knowledge. Calibration says you're safe (99.9999% accurate); the Knowledge Norm says you're silent. This forces the hook: calibration presupposes Truth, but Truth alone doesn't license assertion.

  **Misconception Sequence and Intervention Points**
  Address misconceptions in the order they will surface, not by thematic convenience. Head them off *before* they become objections.

  1.  **Conflating Assertion Norm with Gricean Quality (Minute 15):**
      *   *Surface:* When you claim asserting "Your ticket lost" is wrong despite being likely true, they will object that lying is the only real sin (Grice's Maxim of Quality).
      *   *Intervention:* Pre-empt this when introducing the Lottery Case. Explicitly state: "You are not lying. You are not even mistaken. The question is not whether you are deceiving them, but whether you have the *authority* to settle the matter for them." Distinguish *sincerity* (Grice) from *licensing* (Assertion Norm).
  2.  **Assuming Probabilistic Hedges Exempt Them (Minute 25):**
      *   *Surface:* When the prohibition on flat-out assertion feels too strict, they will suggest saying "It's almost certain you lost."
      *   *Intervention:* Head this off immediately after establishing the intuition that flat-out assertion is blocked. Say: "Hedging changes the speech act back to forecasting, which escapes the norm but also escapes the utility of assertion. We are testing when you can drop the hedge." Force them to see that hedging is a retreat from the act of asserting *p*.
  3.  **Treating the Lottery Case as Folk Curiosity (Minute 30):**
      *   *Surface:* When you press the intuition that they shouldn't assert, they will dismiss it as a quirk of language rather than an epistemic constraint.
      *   *Intervention:* Do not wait for them to dismiss it. Frame the case early as a structural limit on statistical evidence. When the dismissal arises, pivot to action: "If you can assert it, you can act on it. If you can't assert it, why not burn the ticket?" This links the norm to practical rationality, which rationalists care about, elevating it from linguistic curiosity to operational constraint.

  **Diagnostic Closing Question**
  To distinguish grasp from agreement, ask:
  *"If we adopt the Knowledge Norm, are you forbidden from asserting 'You lost' in the lottery case, but permitted to burn the ticket based on the same evidence?"*
  *   **Grasp:** They recognize the asymmetry (Assertion requires more than Action) or argue that Action should also be restricted.
  *   **Agreement only:** They say "Yes, knowledge is better" without seeing the restriction on assertion despite identical evidence for action.

  **Refusals**
  State plainly you will not cover:
  1.  **Gettier Cases:** Do not open the definition of knowledge itself; take "knowledge" as intuitive for the hour.
  2.  **Contextualism:** Do not discuss whether the norm shifts in high-stakes vs. low-stakes environments; assume a fixed norm to test the principle.
  3.  **Skepticism:** Do not allow the discussion to slide into "we never know anything," which voids the norm entirely.
