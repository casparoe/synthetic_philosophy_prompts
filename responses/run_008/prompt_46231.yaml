      *   **Tone:** Academic, balanced, insightful (like a TA or professor feedback).

  2.  **Deconstruct the Arguments:**

      *   **Marcus's Position:** *Selected Effects (SE) Theory / Etiological Account.*
          *   Core Claim: Function = what past natural selection selected the trait *for*.
          *   Key Example: Feathers (thermoregulation $\rightarrow$ flight). Flight wasn't the function until selected for.
          *   Key Argument 1 (Malfunction): A broken heart still has the function of pumping blood. If function = current activity, a leaking valve's function is leaking. SE handles this well (it's *supposed* to pump, even if it doesn't).
          *   Key Argument 2 (Novelty/Bullet Biting): New mutations have no function until selected. This preserves the "for vs. does" distinction.
          *   Key Argument 3 (Artifacts): Artifacts have functions via designer intention (also etiological). Biology has functions via selection (also etiological). Unified etiological account.

      *   **Dana's Position:** *Causal Role (CR) Theory / Systemic Account.*
          *   Core Claim: Function = current contribution to the capacity of the containing system.
          *   Key Argument 1 (Physiology): Physiologists care about what things *do* now to keep the organism alive, not ancestry.
          *   Key Argument 2 (Malfunction Concession/Modification): Function is relative to "normal organization" or "standard setup," not necessarily history.
          *   Key Argument 3 (Novelty): New mutations *do* have a function immediately (metabolizing the compound). SE theory fails to capture this useful explanatory role.
          *   Key Argument 4 (Artifacts): Artificial hearts work without selection. If function relies on selection, artificial hearts have no biological function. If it relies on intention, then "function" is ambiguous (homonymous).

  3.  **Evaluate Move-by-Move (The Adjudication):**

      *   *Move 1: Feathers (Exaptation).*
          *   Marcus: Strong point. SE theory distinguishes original function from current utility (Gould & Vrba's "exaptation").
          *   Dana: Weak here. CR theory struggles to distinguish why flight is the function now and thermoregulation isn't (if both contribute), or why flight wasn't the function *before*.
          *   *Verdict:* Marcus wins on distinguishing "current utility" from "proper function."

      *   *Move 2: Physiology (Current Role).*
