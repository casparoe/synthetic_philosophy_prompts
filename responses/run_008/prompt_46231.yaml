  7.  **Final Polish:** Check against the prompt's specific scenarios (feathers, kidney, leaky valve, bacteria, artificial heart). Ensure all are addressed. (Looks good).

  8.  *(Final thought before generating)*: Make sure to mention the names of the theories. Marcus = Selected Effects (Millikan/Neander). Dana = Causal Role (Cummins). This adds academic weight.

