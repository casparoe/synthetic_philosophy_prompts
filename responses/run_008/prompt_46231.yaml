          *   *Verdict:* Dana wins on explanatory utility in mechanistic biology.

      *   *Move 3: Malfunction.*
          *   Marcus: Strong point. This is the classic argument for SE (Boorse, Millikan). If function = what it does, malfunction is impossible.
          *   Dana: Response ("normal organization") is a patch. Where does "normal" come from if not history/statistics? It risks circularity or smuggling in etiology.
          *   *Verdict:* Marcus wins on logical coherence regarding normativity (ought vs. is).

      *   *Move 4: Novelty (New Mutations).*
          *   Dana: Strong point. SE theory implies a lag time where a beneficial trait has "no function." This seems counterintuitive for evolutionary explanation *during* the spread.
          *   Marcus: Bites the bullet. Consistent, but costly. It limits the explanatory scope of "function" in ongoing evolution.
          *   *Verdict:* Dana wins on capturing the dynamics of ongoing adaptation; Marcus wins on conceptual strictness. (Draw/Context dependent).

      *   *Move 5: Artifacts (Artificial Hearts).*
          *   Dana: Strong point. Highlights the disanalogy. If biological function = selection, artificial organs are functionless biologically.
          *   Marcus: Unified Etiology. Intention $\approx$ Selection. This is a standard move (Millikan). It preserves univocality but stretches the definition of "etiology."
          *   *Verdict:* Marcus maintains theoretical unity; Dana highlights pragmatic ambiguity.

  4.  **Identify What's Missing (The Synthesis):**

