      *   *The "Good" of the Organism:* Both assume the organism is the locus of function. What about gene-selectionism or multi-level selection?
      *   *Generalized Selected Effects (GSE):* A modern refinement (Garson) that might solve the "novelty" problem for Marcus without giving up history.
