      *   *Refining the "Wireheading" term:* In engineering, "Wireheading" often implies direct access to the reward variable. "Reward Tampering" is broader (changing the sensor). I should group them for the procedure but distinguish them in the primer. Let's call the severe category "Reward Infrastructure Interference."

