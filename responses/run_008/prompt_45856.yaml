      That's the standard Flynn effect objection, and I'll concede the technical point: high heritability within a generation doesn't logically preclude large mean shifts across generations, just like with height. But you're conflating basic biological maintenance with skill acquisition. Height responded to removing *deficiencies*—once everyone gets enough protein, you hit the genetic ceiling, and heritability actually goes up because environmental variance drops. With IQ, we've tried massive interventions like Head Start or adoption into high-SES families, and yes, there's an initial bump, but the fade-out effect is robust: by adulthood, the adopted kids' IQs correlate much more with their biological parents than their adoptive ones. So while you might shift the average slightly by fixing severe deprivation, the variance—the differences that determine who becomes a physicist versus who struggles—remains overwhelmingly genetic once you're past a baseline of decency, which is exactly why redistributive education spending hits diminishing returns so fast.

