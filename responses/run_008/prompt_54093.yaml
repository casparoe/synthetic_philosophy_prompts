answer: |-
  # Diagnostic Quiz: What Grounds Your Promises?

  **Instructions:** Below are ten concrete scenarios involving promises. For each, select the option that best matches your intuitive judgment about whether an obligation exists and why. Do not worry about matching your answers to a specific philosophical label; answer based on what feels morally correct to you.

  ### 1. The Dying Recluse
  You encounter a dying hermit living in total isolation. He has never interacted with society and has no concept of "promising." In his final moments, he asks you to bury him in a specific spot. You say, "I promise," primarily to comfort him, though he dies before understanding the words as a commitment. You are the only living being who knows this promise exists.
  *   **A.** You are obligated. You gave your word, and your own will creates the duty regardless of his understanding.
  *   **B.** You are not obligated. A promise requires a shared social understanding to function; without that, it's just a noise.
  *   **C.** You are not obligated. Since he will never know if you break it, and no one else relies on you, no harm is done by breaking it.

  ### 2. The Coerced Agreement
  A thief holds a gun to your head and says, "Promise me you won't call the police when I leave, or I shoot." You say, "I promise." He leaves. You are now safe.
  *   **A.** You are obligated. You spoke the words of a promise, and the stability of language requires we honor them even under pressure.
  *   **B.** You are not obligated. A promise requires a voluntary exercise of your will; coercion voids the transfer of obligation.
  *   **C.** You are obligated only if the thief relies on your word to escape, making your silence a condition of his safety.

  ### 3. The Corrupt Apprenticeship
  You join a trade guild that operates as a front for money laundering. The guild has strict, well-known internal rules, including a ritualized promise of loyalty among members. You take the promise. Later, you realize the guild is criminal.
  *   **A.** You are obligated. You voluntarily entered a practice with known rules; the existence of the institution binds you.
  *   **B.** You are not obligated. An unjust institution cannot generate genuine moral obligations, only threats of punishment.
  *   **C.** You are obligated, but this duty is overridden by the greater duty to stop the crime.

  ### 4. The Waiver
  You promise your friend to help them move on Saturday. On Friday, they call and say, "I've hired movers, please don't come. I release you from the promise." You still want to help because you enjoy moving.
  *   **A.** You are free to stop. The obligation was owed to your friend; if they waive the right, the duty disappears.
  *   **B.** You are still obligated. Once a promise is made, it becomes a duty to the moral law/practice itself, not just to the person.
  *   **C.** It depends on whether the movers are reliable. If they might flake, you should still go to prevent harm.

  ### 5. The Secret Keeper
  You promise a colleague to keep a secret that, if revealed, would embarrass them but cause no tangible harm. The colleague dies unexpectedly the next day. No one else knows the secret, and revealing it would not affect their reputation (as they are deceased).
  *   **A.** You are obligated. The duty survives the promisee because you bound your own will.
  *   **B.** You are not obligated. The duty was to protect their interests; with them gone and no harm possible, the duty lapses.
  *   **C.** You are not obligated. Promises are social tools for managing expectations; with no one left to expect anything, the tool is useless.

  ### 6. The Figure of Speech
  In a heated conversation, you say to a stranger, "I promise I'll be there," meaning it as a figure of speech to emphasize your intent, not invoking a social ritual. The stranger takes it literally and relies on it.
  *   **A.** You are obligated. The social convention of the words binds you regardless of your internal intent.
  *   **B.** You are not obligated. You did not intend to exercise the normative power to bind yourself.
  *   **C.** You are obligated only because they relied on you, and disappointing that reliance causes harm.

  ### 7. The Third-Party Beneficiary
  You promise your Aunt to pay for your Cousin's tuition. Your Aunt dies. Your Cousin says, "I don't want your money, I want to work." You still want to pay.
  *   **A.** You must stop. The right to the performance belonged to your Aunt (or Cousin); if the rights-holder waives it, you cannot force the benefit.
  *   **B.** You must pay. You made a commitment to a plan that exists independently of the current wishes of the beneficiaries.
  *   **C.** You should pay only if the Cousin will suffer financially otherwise.

  ### 8. The Trivial Text
  You text a casual acquaintance, "I promise I'll send you that article link later." You forget. It causes them zero inconvenience.
  *   **A.** You violated a duty. A promise is a promise, regardless of stakes.
  *   **B.** You were rude, but not immoral. Promises of trivialities create social expectations, not moral duties.
  *   **C.** You violated a duty only because relying on promises generally is good for society, even in small cases.

  ### 9. The Unintended Audience
  You write in a public blog, "I promise to run a marathon next year." You intend it as a personal goal. A reader sees it and trains for months expecting to run with you.
  *   **A.** You are obligated to the reader. You created an expectation you knew (or should have known) could induce reliance.
  *   **B.** You are not obligated. You did not address the promise to them; normative powers require a specific addressee.
  *   **C.** You are obligated. Public declarations create a practice-based duty to maintain integrity before the community.

  ### 10. The Changed Mind
  You promise to meet a friend for dinner. Before the date, you simply decide you would rather stay home and read. No external obstacle prevents you from going.
  *   **A.** You are obligated. The fact that you *changed your mind* is precisely what the promise was meant to guard against.
  *   **B.** You are not obligated. If your values shift, you are a different moral agent; the past self cannot bind the future self.
  *   **C.** You are obligated only if your friend has already bought the food or made arrangements.

  ***

  # Scoring Key & Theoretical Mapping

  *Note to Instructor: This key maps dominant answer patterns to theoretical commitments. It is designed to reveal where a student's intuitions cluster, not to grade them as "correct."*

  ### 1. The Normative Powers / Consent View
  *   **Signature Pattern:** 1A, 2B, 4A, 5A, 6B.
  *   **Core Commitment:** Promising is an exercise of autonomy. The promisor's will is the engine of obligation.
  *   **Why:** They affirm the Recluse (will binds even without uptake) and Coercion (will voids obligation). They affirm Waiver (duty is owed to the person, who can release it).
  *   **Theoretical Allies:** Shiffrin, Scanlon (some readings), Kantian autonomy views.

  ### 2. The Social Practice / Convention View
  *   **Signature Pattern:** 1B, 2A (or 2C), 3A, 4B (or 4A), 6A.
  *   **Core Commitment:** Promising is an artificial virtue sustained by a shared institution. The rules of the "game" bind the players.
  *   **Why:** They deny the Recluse (no practice in isolation). They often affirm Coercion (words trigger the rule). They may deny Waiver (duty is to the practice, not just the person) or affirm it (practice rules allow release).
  *   **Theoretical Allies:** Rawls, Hume, Hobbes.

  ### 3. The Reliance / Expectation View
  *   **Signature Pattern:** 1C, 2C, 3C, 4C, 5B, 8B, 10C.
  *   **Core Commitment:** The wrong in breaking a promise is the harm caused by disappointed expectations.
  *   **Why:** They deny the Recluse (no reliance possible). They condition Coercion and Trivial cases on actual harm/reliance. They view Waiver through the lens of preventing wasted effort.
  *   **Theoretical Allies:** Mill, Utilitarian variants, some Contractualists.

  ### 4. The Rights-Based View
  *   **Signature Pattern:** 4A, 7A, 1A (sometimes), 2B.
  *   **Core Commitment:** A promise transfers a claim-right from promisor to promisee. The promisee owns the performance.
  *   **Why:** The Waiver and Third-Party cases are decisive here. If the promisee owns the right, they can waive it (4A) and block the promisor from performing against their will (7A).
  *   **Theoretical Allies:** Hohfeld, Lockean property models of rights.

  ### 5. The Deflationary / Skeptical View
  *   **Signature Pattern:** 1C, 2B, 3B, 4B (indifference), 8B.
  *   **Core Commitment:** Promises create at most a courtesy or expression of intent, not a distinct moral duty.
  *   **Why:** They consistently find "no obligation" in cases where deontological theories find one (Recluse, Trivial, Unjust Institution).
  *   **Theoretical Allies:** Nietzsche, Legal Realists, some Virtue Ethicists (who subsume promising into general honesty).

  ***

  # Meta-Analysis: Limitations & Logical Vacancies

  ### 1. What This Quiz Cannot Sort
  No diagnostic quiz of this size can perfectly separate every nuanced position. Be explicit with students about these overlaps:
  *   **Practice vs. Reliance:** On many social cases (like the Trivial Text or Unintended Audience), Practice and Reliance views converge. Both require a social context. The quiz distinguishes them best on the **Recluse** (Practice says No, Reliance says No) and **Coercion** (Practice often says Yes, Reliance says Maybe). If a student answers identically on these, the quiz cannot determine if they value the *institution* (Practice) or the *harm* (Reliance).
  *   **Normative Powers vs. Rights:** These are often two sides of the same coin. A Normative Powers theorist says "I bound myself"; a Rights theorist says "I transferred a right." They usually agree on Waiver and Coercion. The quiz treats them as a cluster unless the student distinguishes between the *source* of the duty (Will) and the *holder* of the duty (Promisee).
  *   **Kantian vs. Practice (on Waiver):** A strict Kantian might argue the duty is to the Moral Law, not the person (Waiver ineffective). A strict Practice theorist might argue the duty is to the Institution (Waiver ineffective). The quiz flags this in Question 4, but without a follow-up interview, you cannot know *why* they chose "Ineffective."

  ### 2. The Vacant Logical Space (The TA/Professor Bet)
  You asked to identify a coherent answer pattern that no actual theory occupies. The quiz reveals a specific vacancy regarding the **Recluse** and **Waiver** intersection.

  **The Vacant Pattern:**
  *   **Recluse (Q1):** Not Binding (Requires social uptake/reliance).
  *   **Waiver (Q4):** Ineffective (Duty is not to the promisee).
  *   **Coercion (Q2):** Binding (Words/Practice matter more than will).

  **Why this is vacant:**
  This pattern describes a theory where the obligation is **socially dependent** (no Recluse) but **person-independent** (no Waiver).
  *   If the duty disappears when the promisee is cognitively absent (Recluse), the duty seems to rely on the promisee's status as a participant.
  *   But if the duty *cannot* be waived by the promisee (Waiver), the promisee is not the owner of the right.
  *   **The Contradiction:** This implies the duty is owed to the *Practice*, but the Practice only activates when a *Person* is involved, yet the Person has no control over the Practice. This creates a "Leviathan" view: You are bound by social bricks only when another human is present to witness them, but that human has no authority to remove the brick.
  *   **Diagnosis:** This vacancy is due to **incoherence**. It posits a duty that is relational (requires a promisee) but not owed to the relata (cannot be waived by them). Most theories resolve this by either making the duty fully relational (Rights/Consent: Recluse binds via Will, Waiver works) or fully institutional (Practice: Recluse doesn't bind, Waiver might work via rules). The "Relational but Non-Owed" space is theoretically unstable.

  **Regarding your Bet:**
  Your TA thinks the labels are useless; you think the sorting instrument is flawed. The quiz suggests **you are both partially right.**
  *   **TA is right:** Students often hold the "Vacant Pattern" above without realizing it. They say the Recluse promise doesn't count (intuitively feeling it's empty) but also say the Waiver doesn't work (intuitively feeling a promise is a promise). They are occupying incoherent logical space because they haven't been forced to choose between "Duty to Person" and "Duty to Practice."
  *   **You are right:** The Recluse case *does* carve the space, but not just between Will and Practice. It carves the space between **Relational Duties** (owed to the person) and **Freestanding Duties** (owed to the moral order). The standard taxonomy misses this because it lumps "Practice" and "Reliance" together on the Recluse case (both say No), but they diverge sharply on *why*. The quiz forces that divergence in Question 1 (Option B vs. Option C). If your students can distinguish B (Practice) from C (Reliance) on the Recluse, the labels become useful again.
