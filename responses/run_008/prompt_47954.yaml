answer: |-
  ### Nearest existing concepts

  Daniel Dennett's "Intuition Pump" describes thought experiments designed to elicit specific judgments, often via suggestive details. In psychology, the "Framing Effect" covers how wording alters decisions, though it typically applies to risk/gain scenarios rather than narrative ethics. Experimental philosophers refer to this as "Irrelevant Factor Sensitivity," noting when judgments shift based on morally extraneous variables. "Narrative Transport" explains immersive engagement bypassing critical scrutiny. None fit perfectly: "Intuition Pump" names the tool, not the mechanism; "Framing" is too quantitative; "Sensitivity" is too clinical.

  ### What this pattern is — and isn't

  This pattern is not merely emotional manipulation; it is a structural dependency where the intuition relies on the texture rather than the logic. It isn't standard rhetoric because there is no external orator; the bias is embedded in the scenario's ontology. Crucially, it differs from legitimate moral relevance: if the "beloved local figure" implies special social obligations, the detail is relevant. The phenomenon occurs only when the detail is ostensibly decorative (a fan vs. a stranger) yet functionally operative (shifting confidence from "hedging" to "certain"). It is the covert conversion of aesthetic vividness into normative force. Unlike general framing, which presents the same facts differently, this involves swapping facts that should be irrelevant but aren't treated that way by our cognitive machinery. It exposes a gap between our stated moral principles and the narrative triggers that actually activate them. Thus, validity becomes contingent on storytelling skill rather than premise truth.

  ### The counter-move

  Deliberately retelling scenarios with neutral wording is a recognized method in experimental philosophy known as "control cases" or "robustness testing." The complaint of "cheating" lacks footing because the original telling was already loaded; the accuser is merely defending their preferred load. However, there is a risk: stripping all narrative color can dissolve the intuition entirely, not because the argument is weak, but because human moral cognition requires some narrative texture to engage. The goal isn't a sterile abstraction, but identifying which details are doing the work.

  ### A label, if we need one

  **Term:** Narrative Load
  **Definition:** The persuasive force generated by vivid but morally irrelevant details within a thought experiment.
  **Boundary Case 1:** If the detail alters moral facts (e.g., the agent's intent), it is not load.
  **Boundary Case 2:** If the detail is required for comprehension (e.g., there is a trolley), it is not load.
  The phenomenon exists specifically when confidence shifts despite logical equivalence.
