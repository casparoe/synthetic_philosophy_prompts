  Good evening, everyone. For those who don't know me, I'm the bride's sibling. Which, in this room, means I occupy a unique niche: I am the only person who knows exactly how many times she's practiced this speech in the mirror, and also the only person at the table who thinks Walter Bagehot is a person rather than a gluten-free cake option.

  Looking around, I realize we have a divided audience. Half of you are constitutional scholars who could cite the Instrument of Government from memory. The other half are family who are just happy there's an open bar. So, I promise to keep the legal jargon to a minimum, though I know my sister would prefer I cite my sources.

  We are here to celebrate [Sister's Name] and [Wife's Name]. And to understand this union, you really have to understand the intellectual collision that brought them together.

  [Sister's Name] has spent her career studying the monarchy. Specifically, she argues for what she calls the "Spare Tyre" theory of government. For the family: she believes a symbolic head of state is like the spare tyre in the boot of your car. It looks pointless. It takes up space. You drive for years without ever looking at it. But she argues that on the one night you have a hung parliament, a constitutional crisis, or a flat tyre in the rain, you are incredibly grateful that something neutral, dignified, and non-partisan is there to keep you moving. She sees the monarchies of the UK, Japan, and Sweden not as rulers, but as insurance policies.

  Then there is [Wife's Name]. A Dane, and a lifelong republican. To her, the whole institution is an expensive costume drama. She believes power should come from the ballot box, not the bloodline. Though, being Danish, her republicanism is the polite sort. She'll argue theoretically that the monarchy should be abolished, but she'd still send the Queen a lovely basket of hygge-themed gifts if she were ill.

  So, on paper, this marriage is a constitutional crisis waiting to happen. One believes in the dignity of the symbol; the other believes in the power of the people. But watching them together, I've realized they've found a compromise that Westminster could learn from.

  [Sister's Name] has a line she uses in her lectures. She says a state is safer when the person holding the formal title isn't the one doing the day-to-day governing. It prevents tyranny. It prevents ego from wrecking the machinery.

  Looking at the two of you, I think you've taken that wisdom to heart. In this household, there is no Head of State. There is no Prime Minister. You've decided that the only title that matters is "Partner," and the governing is done by consensus. You've created a tiny, benevolent republic where the only crisis management required is deciding whose turn it is to do the dishes.

  But beyond the politics, there is the human truth beneath the "Spare Tyre" theory. My sister spends her life studying how institutions survive crises. She knows that structures matter when things go wrong. But love isn't about surviving a crisis; it's about enjoying the drive when the road is smooth.

  [Sister's Name], you spend your life arguing for the value of having someone neutral there to step in when things get messy. [Wife's Name], you spend your life arguing for practicality and shared power. Together, you show us that the best relationship isn't about who holds the title, or who holds the power. It's about knowing that when the road gets rough, you don't need a constitutional convention to fix it. You just need each other.

  You don't need a spare tyre, because you're both willing to change the wheel.

  So, if everyone could please rise.

  To [Sister's Name] and [Wife's Name]. May your union be more stable than a coalition government, happier than a unanimous verdict, and may you never face a hung parliament in the living room.

  To the happy couple!

  ***

  **Note on Constitutional Accuracy**

  I am reasonably confident in the general constitutional frameworks described (UK reserve powers, Japanese symbolic status, Swedish ceremonial role). However, I am **least sure about the specific claim regarding Sweden** used in the speech ("where the king doesn't even get formal duties anymore"). While the 1974 Instrument of Government stripped the Swedish Monarch of all *political* power (no longer signing laws, appointing governments, or commanding the military), the King still retains certain *ceremonial* formal duties, such as opening the Riksdag (parliament) annually and heading the Advisory Council on Foreign Affairs. The prompt's phrasing suggests he has *no* formal duties, which is technically an exaggeration common in political science shorthand. I recommend verifying the exact wording of the 1974 Instrument of Government if you expect Swedish constitutional experts in the room, as they might quibble over "political power" vs. "formal duties."
