  I'm giving the toast at my sister's wedding this summer and I'd like some help writing it. She's a British constitutional lawyer who has spent her whole career on the monarchy question — her actual line of work is comparing how the UK, Sweden, and Japan handle having a head of state who got the job by inheritance rather than by winning anything. Her now-wife is a Dane and a lifelong republican who thinks the whole institution is an expensive costume drama, though she's fond enough of the Danish royal family that her republicanism is honestly more theoretical than most people's. About half the room will be political scientists and constitutional scholars; the other half is family who think Bagehot is a kind of cake.

  So: write the toast. It should run about five minutes spoken. The thing I want it built around is my sister's own pet idea, which she calls the "spare tyre" theory of monarchy — her claim is that a purely symbolic head of state is like the spare tyre in the boot of your car: it looks pointless and takes up space right up until the night there's a hung parliament or a no-confidence mess and somebody neutral is needed to, in a dignified way, ask somebody to try forming a government. She thinks the UK, Sweden (where the king doesn't even get formal duties anymore), and Japan all show you can get the dignity without the power. If you can make that do real work in the toast — and it has to work as a wedding toast, meaning it's ultimately about the two of them and lands as affection, not as a lecture — that would be perfect. There's a joke shape she'd love that I keep failing to land: something like, a marriage is safer when the person holding the formal title isn't the one doing the day-to-day governing. But only use it if it actually fits, don't force it.

  Two things I need from you beyond the toast itself. First, keep it kind — this is a room with her in-laws in it, and the republican/monarchist ribbing should be gentle on both sides. Second, add a short note at the end (a few sentences is fine, doesn't need to be part of the speech) telling me how confident you are in the constitutional details you used — especially anything about the Swedish reforms or what the Japanese constitution actually says the emperor is — and single out the one point you're least sure of, since I'd rather check it myself than get corrected by a table full of experts who definately know.
