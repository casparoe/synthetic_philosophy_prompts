          *   If we just maximize independently, we might still cooperate if the actions are causally linked. But if actions are *acausally* linked, MU doesn't inherently capture the *leverage*. MU treats the other agent's action as fixed or uncertain, not *dependent on my reasoning*.
          *   Actually, MU + EDT looks a lot like ECL. The distinction is really about the *source* of the weight on $V_2$.
          *   *Source MU:* $P(T_2 \text{ is True})$.
          *   *Source ECL:* $P(\text{They Coop} | \text{I Coop}) \times \text{Exchange Rate}$.
