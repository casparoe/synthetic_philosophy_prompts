              *   *Correction:* The philosophical point is you should *cultivate* the nature.
              *   *Revised Round 3:* "The Pre-Game Pledge." HHs write a pledge on a card *before* knowing if they will be picked up. They sign it. It's not legally binding, but it's public (to the facilitator). Drivers are told: "We have data that people who sign pledges pay 90% of the time."
              *   *Even Better for "Feeling it":* The "Red Card/Blue Card" method.
              *   *Round 3:* HHs choose a "Character Card" at the very start (Red = I am a Payer, Blue = I am a Maximizer). They keep this card hidden. Drivers are told: "I (Facilitator) can sense the ratio of Red to Blue." If the ratio is high enough, Drivers Stop. If low, Drivers Drive. Then HHs reveal if they actually pay.
              *   *Actually, the prompt asks to rig/fake it if needed.*
              *   *Rigged Mechanic:* In Round 3, tell the HHs: "You have 30 seconds to decide who you are." Collect cards. Tell Drivers: "60% of these kids are 'Honest Types'." (Even if they aren't). Drivers Stop. Then let HHs decide. The ones who feel bound by their self-image pay. The "Rational" ones stiff.
              *   *Wait, the goal is for the "Irrational" (Payer) to do better.*
