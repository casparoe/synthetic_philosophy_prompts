                  8.  *So the game must ensure that if you are known as a Stiffer, you don't get the ride.*
                  9.  *How to simulate "Known as a Stiffer"?* Drivers make the choice. If Drivers expect Stiffing, they Drive.
                  10. *So:* Round 1: Drivers Drive (Expect Stiffing). Result: 0 for all.
                  11. Round 3: Some HHs signal "I am Honest." Drivers believe them. Drivers Stop. Honest HHs Pay (10). Dishonest HHs (who lied) Stiff (20).
                  12. *Problem:* The Dishonest HH wins (20 > 10). Parfit's point is that the *disposition* to pay gets you the ride. The one-off act of paying is "irrational."
                  13. *Fix:* The Driver must be able to detect the lie.
                  14. *Classroom Fix:* The "Interview." HHs speak to Drivers for 30 seconds. Drivers decide.
                  15. *Better:* The Facilitator acts as the Mind Reader. "I know who will pay."
                  16. *Okay, let's go with the Prompt's suggestion:* "Rig or fake the second part."
                  17. *Round 3 Rig:* HHs submit a secret "Identity Card." Facilitator tells Drivers: "I have verified these. 5 of these kids are 'Keepers' (will pay), 2 are 'Breakers'." Drivers Stop *only* for the Keepers (Facilitator matches them). Keepers Pay (10). Breakers (if any slipped through) Stiff.
                  18. *Wait, if Breakers are excluded, they get 0.* So Keepers (10) > Breakers (0). This proves the point. The "Irrational" Keeper gets the ride. The "Rational" Breaker gets left in the desert because the Driver knew they were a Breaker.
                  19. *How to make it feel real?* The HHs don't know who is marked as what. They just write a statement. The Facilitator *claims* to be able to tell who is sincere.

  5.  **Refining the Payoffs (Crucial for "Feeling"):**
      *   HH Stranded: 0
      *   HH Town + Pay: 10
      *   HH Town + Stiff: 25 (Must be tempting!)
      *   Driver Drive: 2 (Small reward for saving gas)
      *   Driver Stop + Paid: 10
      *   Driver Stop + Stiff: -10 (Painful!)
      *   *Logic:* Driver prefers Driving (2) over Stop+Stiff (-10). Driver prefers Stop+Paid (10) over Driving (2). HH prefers Stiff (25) over Pay (10).
      *   *Dilemma:* If HH is rational, they Stiff. If Driver knows HH is rational, they Drive. Both get suboptimal (0 vs 10/10).

  6.  **Addressing Predictable Failures:**
      *   *Failure 1:* Kids pay in Round 1 because "it's the right thing to do."
          *   *Counter:* Emphasize this is a *logic game*, not a morality test. Points = Prize. Anonymity is key.
      *   *Failure 2:* Drivers stop out of kindness.
          *   *Counter:* Make the penalty for Stiffing high enough (-10).
      *   *Failure 3:* The "Rig" is obvious.
          *   *Counter:* Keep the Facilitator's "Mind Reading" vague. "I've taught this before, I know the look."

  7.  **Session Flow (45 Mins):**
      *   0-5: Setup & Rules (No theory).
      *   5-15: Round 1 (The Disaster).
      *   15-25: Round 2 (The Contract - Econ 101).
      *   25-35: Round 3 (The Character - Philosophy).
      *   35-45: Debrief & Reveal.

