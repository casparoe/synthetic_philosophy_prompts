      *   *Materials:* Index cards (2 colors), pens, scoreboard.
      *   *Anonymity:* Cards folded, collected in a hat/box.
      *   *The "Character" Mechanic:* In Round 3, HHs write a "Vow." Facilitator tells Drivers: "I can tell who is faking. I will only let you pick up the Vow-Takers." (This simulates the Driver's psychic ability in the thought experiment).
