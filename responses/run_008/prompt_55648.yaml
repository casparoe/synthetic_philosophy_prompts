answer: |-
  # Session Plan: The Desert Run (Parfit's Hitchhiker)

  **Time:** 45 Minutes
  **Materials:** 28 Index cards (2 colors), pens, a hat/box, candy/stickers for points (1 point = 1 candy, or 10 points = small prize).
  **Setup:** Arrange chairs in two rows facing each other (7 Drivers, 7 Hitchhikers).

  ### 1. The Rules (5 Minutes)
  *Do not mention philosophy, game theory, or Parfit.*
  *   **Story:** "Hitchhikers are stranded. Drivers can save them. Once in town, Hitchhikers can choose to reward the Driver or not."
  *   **Currency:** Points written on the board. Real prizes at the end.
  *   **Anonymity:** All decisions go on index cards, folded, placed in the hat. No talking between roles.
  *   **Payoff Table (Write on Board):**
      *   **Hitchhiker Stranded:** 0 pts
      *   **Hitchhiker In Town + Pays:** 10 pts
      *   **Hitchhiker In Town + Stiffs:** 25 pts *(The Temptation)*
      *   **Driver Drives On:** 2 pts *(Safe, saves gas)*
      *   **Driver Stops + Gets Paid:** 10 pts
      *   **Driver Stops + Gets Stiffed:** -10 pts *(The Pain)*

  ### 2. Round 1: The Trap (10 Minutes)
  *Goal: Demonstrate that pure rationality leads to mutual loss.*
  1.  **Hitchhikers:** Write "Pay" or "Stiff" on a card. Put in hat. *(Tell them: "Decide what you will do IF you get to town.")*
  2.  **Drivers:** You do not see the cards. You must predict: "Will I get paid?" Write "Stop" or "Drive."
  3.  **Facilitator Logic:** If a Driver writes "Stop," pair them with a random Hitchhiker card. Reveal outcomes.
  4.  **Expected Outcome:** Most Drivers fear the -10. They "Drive." Most Hitchhikers want the 25. They "Stiff."
  5.  **Result:** Almost everyone gets 0 or 2 points. The room feels like a failure.
  6.  **Facilitator Note:** Do not explain why. Just tally scores grimly. "Ouch. A lot of people are still in the desert."

  ### 3. Round 2: The Contract (10 Minutes)
  *Goal: Show the Econ 101 solution (Commitment Devices) so you can discard it later.*
  1.  **New Rule:** Hitchhikers can now post a **Deposit** of 30 points *before* the ride.
  2.  **Mechanic:** If they Stiff in town, they lose the deposit (net -5). If they Pay, they keep it (net 10).
  3.  **Play:** Run the round.
  4.  **Expected Outcome:** Drivers see the math. They Stop. Hitchhikers Pay (to keep deposit). Everyone gets 10/10.
  5.  **Debrief Snippet:** "This worked because you changed the *rules*. You made it impossible to be irrational. But what if you can't post a deposit? What if no one is watching?"

  ### 4. Round 3: The Character (15 Minutes)
  *Goal: Simulate the "Mind-Reading Driver" to show that **being** the type matters more than **choosing** the act.*
  1.  **Setup:** Remove the Deposit rule. Back to original stakes.
  2.  **The Mechanic (The Rig):**
      *   Hitchhikers write a **"Personal Vow"** on a card: *"I am the kind of person who keeps promises"* OR leave it blank.
      *   Collect cards. Look at them intently. **Secretly discard 3 cards at random** (or any blanks).
      *   **The Lie:** Tell Drivers: *"I have screened these. I removed the ones who were lying. The remaining cards belong to students who genuinely cannot bring themselves to stiff you."*
      *   Drivers decide: Stop or Drive?
      *   Hitchhikers decide: Pay or Stiff?
  3.  **Why this works:**
      *   The discarded students (the "Rational Stiffers") get **0 points** (Stranded). They are punished for their type before they even act.
      *   The kept students (the "Honest Types") get the ride. Because they wrote a vow and were "validated," social/psychological pressure makes most Pay.
      *   **Result:** The "Honest Types" get 10 pts. The "Rational Types" get 0 pts.
  4.  **Crucial Moment:** If a kept student Stiffs anyway, highlight it. "The system thought you were honest, but you weren't."

  ### 5. The Debrief (5 Minutes)
  *Reveal the name: Parfit's Hitchhiker.*
  1.  **Map the Logic:**
      *   **Round 1:** Causal Decision Theory. "My choice now doesn't change the past (the pickup)." Result: Death in the desert.
      *   **Round 3:** Evidential/Timeless Decision Theory. "My choice now is *evidence* of what kind of person I am. If I am a Stiffer, the Driver knows and leaves me."
  2.  **The Philosophical Punch:**
      *   "In Round 1, being rational (Stiffing) cost you the ride."
      *   "In Round 3, being the *kind of person* who pays got you the ride, even though paying itself 'cost' you 15 points compared to stiffing."
      *   **Question:** "Is it rational to do the best thing in the moment, or to be the kind of person who gets the opportunity?"

  ### Predictable Failures & Counters
  1.  **Failure:** Students Pay in Round 1 out of kindness.
      *   **Counter:** Pre-frame: "This is a logic puzzle, not a morality test. If you pay out of kindness, you are breaking the simulation. Maximize points."
  2.  **Failure:** Drivers Stop in Round 1 out of kindness.
      *   **Counter:** Emphasize the -10 penalty. "If you get stiffed, you lose your own prize points. Can you afford to be nice?"
  3.  **Failure:** Round 3 Rig is exposed ("You threw away my card randomly!").
      *   **Counter:** Double down. "I didn't say I was perfect. I said I removed the ones I *suspected*. Did you want me to let the liars ride?" (Keep it vague).
  4.  **Failure:** Students don't care about points.
      *   **Counter:** Make the "Stranded" outcome physical. Anyone with 0 points at the end must **stand** during the debrief while others sit. Humiliation > Candy.

  Verdict: Yes, provided you make the 'Stranded' outcome visibly humiliating (e.g., they must stand during the debrief), otherwise abstract points won't trigger genuine regret.
