prompt: |-
  As a novelist, I have spent two decades inside the problem of point of view: free indirect discourse, focalization, the gap between what a character reports seeing and what the text shows them seeing, and the craft of letting a reader detect a distortion the character cannot. From the outside, the philosophical debate over the cognitive penetration of perception appears to concern the very thing I manage sentence by sentence — whether a perceiver's beliefs, expectations, and categories can shape what they literally see, rather than merely how they interpret, describe, or attend to it. Please restate that debate in my vocabulary. Cover, in craft terms: the New Look claim that wanting, expecting, and categorizing can reach into perception itself; the distinction between perception being merely influenced by cognition and being genuinely penetrated by it; and the critic's challenge that the celebrated effects are really post-perceptual — judgment, memory, or reporting dressed up as seeing. Then give me the residue report: which parts of the debate map onto things I actually control in a draft (for instance, whether a description given in free indirect discourse is committed to the character's perceptual state or only to their assessment of it); which parts must be distorted to fit my vocabulary; and whether anything in the debate has no counterpart at all in narrative craft — and if so, whether that residue reveals a limit of my vocabulary or a sign that the debate was never really about seeing, but about the epistemic standing of experience, something fiction can leave undecided. Be honest about where my terms smuggle in assumptions: they were built to produce effects in readers, not to track what happens inside a perceiver.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** An experienced novelist (20 years) deeply familiar with narrative craft terms (free indirect discourse, focalization, gap between report/showing, distortion detection).
      *   **Topic:** The philosophical/psychological debate on "Cognitive Penetration of Perception" (New Look psychology vs. Modularity/Post-perceptual accounts).
      *   **Task:**
          1.  Restate the debate using the novelist's vocabulary (craft terms).
          2.  Cover specific philosophical points: New Look claim (wanting/expecting shapes seeing), the distinction between influence vs. penetration, and the critic's challenge (post-perceptual judgment/memory).
          3.  Provide a "Residue Report": Map debate parts to draft control (FID commitment), identify distortions required to fit the vocabulary, and identify non-mapping elements (limits of vocabulary vs. epistemic standing).
          4.  **Constraint/Tone:** Be honest about where craft terms smuggle in assumptions (effects on readers vs. tracking internal perceiver mechanics).

  2.  **Deconstruct the Philosophical Debate:**
      *   *Cognitive Penetration:* The hypothesis that cognitive states (beliefs, desires, concepts) can alter the *content* of perceptual experience itself (the "what it is like"), not just downstream beliefs.
      *   *New Look Psychology (Bruner et al.):* Early support for penetration (e.g., poor children seeing coins as larger).
      *   *Modularity/Post-Perceptual (Fodor, Pylyshyn, etc.):* Perception is encapsulated. Cognition affects judgment, memory, or attention, but not the raw sensory feed.
      *   *The Crux:* Is the *experience* different, or just the *report* of the experience?

  3.  **Translate to Novelist's Vocabulary:**
      *   *Perception:* The "scene" as rendered in the text.
      *   *Cognition (Beliefs/Desires):* The character's interiority, backstory, motivation.
      *   *Cognitive Penetration:* When the narration (even in close 3rd) renders the world *as* the character's bias dictates, not just their reaction to it.
      *   *Post-Perceptual:* When the narration describes the objective world, then adds the character's interpretation.
      *   *Free Indirect Discourse (FID):* The primary tool for blurring the line between narrator and character.
      *   *Focalization:* The lens through which the scene is filtered.
      *   *The Reader's Role:* Detecting the "unreliable narrator" or the "distortion."

  4.  **Drafting the Restatement (Section 1):**
      *   *The New Look Claim:* In craft terms, this is "Deep Focalization." It's not just that the character *thinks* the room is hostile; the prose renders the light *as* hostile. The adjective belongs to the light, not the thought.
      *   *Influence vs. Penetration:* Influence = Attention (choosing what to write about). Penetration = Texture (how the thing is written).
      *   *The Critic's Challenge:* This is the "Unreliable Narrator" defense. The critic says, "You didn't write the seeing; you wrote the *memory* of the seeing." It's the difference between *showing* a distortion and *telling* a distortion.

  5.  **Drafting the Residue Report (Section 2):**
      *   *What maps to draft control:* FID commitment. Do I commit the syntax to the character's bias?
      *   *What must be distorted:* Philosophy cares about "truth" of the mechanism; Fiction cares about "effect" on the reader. I can *simulate* penetration regardless of whether it's scientifically possible.
      *   *What has no counterpart:* The "Epistemic Standing." In fiction, if it reads like seeing, it *is* seeing for the reader. Philosophy asks, "Is this *really* vision?" Fiction asks, "Does this *feel* like vision?"
      *   *Honesty Check:* Craft terms are teleological (aimed at effect). Philosophical terms are ontological (aimed at mechanism).

  6.  **Refining the Tone:**
      *   Needs to be respectful of the user's expertise (don't explain FID, use it).
      *   Needs to be precise philosophically (don't dumb down "cognitive penetration").
      *   Needs to be insightful about the intersection (the "Residue").

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't confuse "attention" with "penetration." Attention is selecting the object; penetration is changing the object's appearance. In craft, this is the difference between *what* the character looks at and *how* the light hits the page.
      *   *Correction:* Ensure the "Residue Report" clearly distinguishes between what the writer *does* vs. what the philosopher *argues*.
      *   *Key Insight:* The philosopher wants to know if the brain *actually* works this way. The novelist wants to know if the reader *accepts* the rendering. This is the crucial divergence.

  8.  **Final Review against constraints:**
      *   Restate debate in craft terms? Yes.
      *   Cover New Look, Penetration vs. Influence, Critic's Challenge? Yes.
      *   Residue Report (Control, Distortion, Non-counterpart)? Yes.
      *   Honest about assumptions (Effect vs. Mechanism)? Yes.

  9.  **Final Polish:** (Produces the structured response below.)
answer: |-
  Here is the debate restated in the vocabulary of the draft, followed by the residue report on where the mapping holds and where it breaks.

  ### The Debate Restated in Craft Terms

  **The New Look Claim: Deep Focalization**
  In the workshop, we call this "deep focalization" or "psychic proximity." The New Look psychologists argue that desire and belief don't just select the object of attention; they alter the sensory data. In your terms, this is the difference between writing *She saw the coin and thought it looked large because she was poor* versus *The coin loomed, heavy and oversized in her palm.*
  The New Look claim asserts that the second sentence isn't just a metaphor for her greed. It asserts that her poverty literally changed the visual feed. In craft terms, this is the claim that **Free Indirect Discourse (FID) can colonize the verb of perception itself.** It suggests you don't need a filter tag ("she felt that...") to render bias; the bias is in the lighting, the color saturation, and the spatial relations described in the prose. The character's interiority has rewritten the setting description.

  **Influence vs. Penetration: Attention vs. Texture**
  The philosophical distinction between cognitive *influence* and cognitive *penetration* maps onto the distinction between **selection** and **rendering**.
  *   **Influence (Modularity):** Cognition directs the camera. The character looks *at* the knife, not the flower. The prose remains objective ("The knife was silver"), but the character's fear is shown through their focus. The perception is encapsulated; the cognition happens downstream.
  *   **Penetration (New Look):** Cognition changes the lens coating. The knife isn't just selected; it is rendered as *menacing*. The silver isn't just silver; it is *cold*. The prose commits to the idea that the menace is a property of the knife in the scene, not just a property of the character's reaction.
  The debate asks: Is the menace in the adverb (how she looked) or in the adjective (what was seen)?

  **The Critic's Challenge: The Unreliable Report**
  The modularity theorists (the critics) argue that what looks like penetration is actually **post-perceptual judgment.** In your craft terms, they are accusing the novelist of **Unreliable Narration masquerading as Objective Description.**
  They claim that when you write *The room felt hostile*, you are not recording a perceptual state. You are recording a judgment made *after* the perception, which the character (or narrator) is misreporting as immediate sight. They argue you are confusing **memory** with **sensation**, or **interpretation** with **registration**. To the critic, your "penetrated" prose is simply a lie the character tells themselves about what they saw, which you, the author, are inadvertently validating by rendering it in the sensory key. They demand you separate the camera feed (sensation) from the voiceover (judgment). You argue that in the draft, there is no camera feed without a voiceover.

  ***

  ### Residue Report

  Here is the audit of what survives the translation from philosophy to craft, and what is lost or distorted in the process.

  **1. What Maps to Draft Control**
  You have direct control over the **FID Commitment.** You decide, sentence by sentence, whether a description is anchored to the narrator's omniscient truth or the character's subjective reality.
  *   *The Philosophical Question:* Did the belief change the vision?
  *   *The Craft Control:* Did I assign the adjective to the noun or the thought?
  If you write *The hallway stretched, impossibly long,* you are forcing the reader to process the distortion as a spatial fact before they process it as a psychological state. You control the "latency" of the correction. You can delay the reader's realization that this is a distortion until paragraph three. This maps directly to the "penetration" claim: you are making the cognition precede the perception in the reader's experience, regardless of the character's biology.

  **2. What Must Be Distorted to Fit the Vocabulary**
  To make this debate fit your craft, you must distort the **Timeline of Experience.**
  Philosophy and psychology are obsessed with the causal order: *Stimulus → Perception → Cognition.* They argue about whether Cognition can loop back to Perception.
  In fiction, there is no timeline of experience, only the **Timeline of Reading.** You can simulate "penetration" even if the human brain is modular. You can write *The coin loomed* even if no human eye actually sees coins loom. Your vocabulary treats "seeing" as a **rhetorical effect**, not a biological event.
  *   *The Distortion:* You treat "perception" as "prose rendering." If the prose renders it as seen, it counts as seen. The philosopher asks, "Is this mechanism possible?" You ask, "Is this rendering persuasive?" You are smuggling in the assumption that *effect equals mechanism.*

  **3. What Has No Counterpart in Narrative Craft**
  The concept of **Epistemic Standing.**
  The philosophical debate is ultimately about justification. If cognition penetrates perception, then my senses are not a neutral court of appeal for my beliefs. My beliefs *are* my senses. This threatens the foundation of empirical knowledge.
  In fiction, **there is no neutral court of appeal.** There is only the text.
  *   *The Residue:* The philosopher worries that if penetration is real, we can't trust our eyes to tell us about the world. The novelist knows the reader never trusted the eyes to tell them about the world; they trusted the eyes to tell them about the *character*.
  *   *The Limit:* Your vocabulary has no tool for asking "Is this true?" only "Does this work?" If you write a scene where a jealous man sees red spots when he is angry, and the reader accepts it, you have succeeded. Whether the human retina actually produces red spots during jealousy is irrelevant to your craft.
  *   *The Revelation:* This residue reveals that the philosophical debate was never really about *seeing*. It was about **truth-claims.** Philosophy is trying to determine if experience can justify belief. Fiction is trying to determine if belief can justify experience.
      *   Philosophy: Can I believe *P* because I see *P*? (Threatened by penetration).
      *   Fiction: Can I see *P* because I believe *P*? (The engine of character voice).

  **Honesty Check: The Smuggled Assumptions**
  Your terms were built to produce **affects in readers**, not to track **states in perceivers.**
  *   When you say "Focalization," you mean "Where do I point the reader's imagination?"
  *   When a psychologist says "Perception," they mean "Neural processing of sensory input."
  *   When you say "Distortion," you mean "A gap between character knowledge and reader knowledge."
  *   When a psychologist says "Distortion," they mean "A deviation from physical reality in the sensory cortex."

  You can simulate cognitive penetration perfectly in a draft without it ever happening in a brain. Therefore, your vocabulary cannot resolve the debate; it can only **stage** it. You can write the *phenomenology* of penetration (what it feels like), but your craft offers no leverage on the *ontology* of penetration (what it is).

  **Conclusion**
  The debate maps onto your control of **syntax and attribution**, but it dissolves at the level of **truth.** The residue reveals that fiction is the one place where cognitive penetration is not only possible but required. In a novel, if a character believes the world is grey, the world *is* grey, because the text is the only reality the reader has. The philosophical anxiety—that penetration severs our tether to the real world—is the novelist's baseline condition. You don't need to solve the debate; you live in the hypothetical world the philosophers fear.
