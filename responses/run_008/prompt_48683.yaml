answer: |-
  **The Scenario**

  Marcus sits in a high-stakes budget meeting and spots a calculation error that will cost his team unpaid overtime; he judges, all things considered, that interrupting the presenter now (X) is better than staying silent (Y), weighing the benefit of correction higher than the social discomfort of speaking up. As the window to speak opens, Marcus feels a visceral surge of inhibition—his throat tightens and his focus narrows—not because he recalculates the value of silence as superior, but because the physiological arousal of assertion jams his motor initiation. He remains silent, wincing internally as the meeting moves on, deriving no relief from the inaction—only a compounding shame that he judges unnecessary—and never once ranking silence over speech in his conscious valuation, even in the instant he lets the opportunity pass.

  ***

  **The Demonstration**

  **1. Akrasia Conditions (Davidson/Socrates)**
  This scenario satisfies Donald Davidson's conditions for incontinence: Marcus holds an all-things-considered judgment that X is better than Y at the time of action; he performs Y intentionally (omissions are actions); and he acts freely (no external coercion or paralysis prevents speech, only internal inhibition). Socrates' escape hatch (ignorance) is closed because Marcus knows the error, knows speaking is the remedy, and knows silence is detrimental. The judgment survives the action intact; he does not convince himself silence was better *after* the fact, nor does he lose track of the value hierarchy *during* the act. He acts against his own surviving verdict.

  **2. Hyperbolic Discounting Failure**
  Hyperbolic discounting models akrasia as a preference reversal: at $t_1$ (distant), $V(X) > V(Y)$, but at $t_2$ (immediate), the immediate cost of X (social anxiety) is hyperbolically weighted, flipping the curve so $V(Y) > V(X)$. In Marcus's case, there is no reversal. At $t_2$, Marcus still values $X$ (speaking) higher than $Y$ (silence); he explicitly experiences the silence as *more* painful (shame + error cost) than the speech would have been (anxiety). Since the model predicts action follows the higher local valuation, it predicts Marcus should speak. It fails because the mechanism driving the inaction is not a change in *valuation* (the discount curve didn't flip), but a failure in *execution* despite stable valuation.

  **3. Structural Feature: Inhibition as Friction, Not Weight**
  The separating feature is **inhibitory friction decoupled from valuation**. In standard discounting, anxiety acts as a *cost* subtracted from the value of speaking. In this case, anxiety acts as a *barrier* to the motor command of speaking without altering the value assigned to it. It is akin to trying to push a car uphill: you still value the car being at the top more than the bottom, and you still prefer pushing to not pushing, but the friction prevents the motion. If you remove this feature (i.e., if Marcus felt no visceral inhibition), the case collapses into ordinary rational action: he would speak, valuing it higher, and no akrasia would occur. If you convert the friction into a weight (i.e., he stays silent because the anxiety cost outweighs the benefit), it collapses into standard hyperbolic discounting.

  **4. Steelman Counter-Move: The "Relief" Defense**
  A temptation theorist will argue: "Avoiding the immediate spike of speaking-anxiety *is* a smaller-sooner reward, even if he feels shame later. He locally preferred the absence of that specific spike."
  **Verdict:** This is a **definitional gerrymander** that renders the discounting model unfalsifiable. If *any* action taken against a stated better judgment is retroactively defined as "locally preferred" simply because it was taken, the model loses predictive power—it describes behavior but cannot explain deviations from valuation. In Marcus's case, the total phenomenological utility of silence (shame + regret + error) is explicitly *lower* than speech would have been, even in the moment. To claim he "preferred" silence requires redefining preference as "whatever motor pathway encountered least resistance" rather than "what the agent wanted." While technically consistent with a broad behaviorist definition of preference, it abandons the psychological realism required to distinguish akrasia from rational choice, effectively saying "he did it, so he must have wanted it most," which begs the question against the possibility of weakness of will.
