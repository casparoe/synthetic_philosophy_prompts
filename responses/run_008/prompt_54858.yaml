answer: |-
  ### Take-Home Final: Philosophy of Action & AI Alignment
  **Time Limit:** 90 Minutes
  **Word Limit:** ~1000 Words

  **Question 4: Impact Measures and Value Specification**

  Consider the following case: A warehouse delivery robot must transport a package to Dock B. It faces a choice: wait two minutes for a forklift to clear the aisle, or shove a crate of fragile mugs off a shelf to clear the path immediately. The designers never explicitly programmed a preference regarding the mugs. The robot employs a *relative reachability* impact penalty: it maintains a simulated "do-nothing twin" and is penalized at each step proportional to how much the set of future states it can reach has shrunk compared to the twin. Smashing the mugs forecloses many reachable states (the mugs cannot be un-shattered); waiting barely forecloses any.

  (a) **The Intuition:** Explain why this kind of measure is initially attractive to alignment researchers. Specifically, why does "don't permanently give up options" seem like it captures side-effect avoidance without requiring a full value function? (approx. 250 words)

  (b) **The Break:** Identify and explain two concrete failure modes or "value-leaks" in this approach. You may draw on issues regarding baseline selection (the "do-nothing" twin), state representation (what counts as a change), or auxiliary goals. Show how value judgments re-enter the system in each case. (approx. 500 words)

  (c) **The Verdict:** Is the impact measure program doomed to fail as a value-free solution, or is it still useful despite not being fully value-free? Take a committed position. Do not hedge. (approx. 250 words)

  ***

  ### Model Answer

  **(a) The Intuition**
  The attractiveness of impact measures lies in their attempt to sidestep the specification problem. Traditional alignment requires defining what we *want* (a value function), which is notoriously difficult. Impact measures instead try to define what we *don't want*: large, irreversible changes to the environment. The core intuition is that "power" or "ability to achieve goals" correlates with the size of the reachable state space. If an agent preserves its ability to reach many future states, it presumably avoids breaking things permanently. In the warehouse case, smashing mugs reduces the set of possible futures (states where mugs are intact are no longer reachable). Waiting preserves those states. This looks like side-effect avoidance derived purely from the topology of the state space, requiring no explicit mention of "mugs" or "fragility" in the reward function. It promises safety through structural constraints on agency rather than semantic understanding of value.

  **(b) The Break**
  However, this approach smuggles value specifications back in through two primary leaks: the baseline and the ontology.

  First, the baseline problem. The penalty is relative to a "do-nothing twin." But "doing nothing" is not a neutral reference point; it is a normative choice. Suppose that while the robot waits, a pipe bursts in the aisle, flooding the warehouse. The "do-nothing" twin gets flooded; the active robot could have prevented it. Because the active robot's reachable states differ from the flooded twin's, it might be penalized for saving the warehouse, or conversely, if the baseline assumes the robot is switched off, any action looks like an impact. The choice of baseline determines what counts as a "deviation." Selecting a baseline is equivalent to selecting a default world state, which is itself a value judgment about what counts as "normal" or "acceptable" behavior.

  Second, the state representation problem. The penalty only cares about changes reflected in the state description. If the state space includes mug positions, breaking them is penalized. If the state space tracks only the robot's coordinates and package status, breaking mugs is invisible. Furthermore, if the state space is too granular (e.g., tracking dust motes), any movement is penalized. Deciding which features of the world constitute a "state" difference is a decision about what matters. Designers must choose the ontology. By selecting which variables count toward the impact penalty, they are implicitly writing a value function that says "mugs matter, dust motes don't."

  **(c) The Verdict**
  The program is doomed as a value-free solution. It does not solve the specification problem; it merely displaces it. The values are not eliminated; they are hidden in the choice of baseline and the construction of the state space. However, this does not render impact measures useless. They are valuable as regularizers within a broader alignment framework, preventing catastrophic optimization pressure on known variables. But we must abandon the claim that they are value-agnostic. They are simply another interface for human value judgment, one that obscures rather than clarifies the normative assumptions being made. We should use them, but only with the explicit acknowledgment that the baseline *is* the value function.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Explanation of Option Preservation Intuition (4 Marks)**
  *   **Must Hit:** Clearly articulates that preserving reachable states acts as a proxy for avoiding irreversible harm without specifying *which* harms matter.
  *   **Common Failure:** Vague hand-waving about "safety" without linking it to state-space topology or reversibility.

  **2. Baseline Failure Mode (4 Marks)**
  *   **Must Hit:** Identifies that the "do-nothing" twin is not neutral and shows how a different baseline changes the penalty (e.g., inaction leads to disaster).
  *   **Common Failure:** Describes the math of the baseline without recognizing the normative load of choosing it.

  **3. State Representation Failure Mode (4 Marks)**
  *   **Must Hit:** Explains that the penalty only works if the state space includes the relevant features (mugs), meaning humans must choose what counts.
  *   **Common Failure:** Ignores the ontology problem, assuming the agent "knows" the mugs are part of the state.

  **4. Committed Verdict (4 Marks)**
  *   **Must Hit:** Takes a clear stance (doomed vs. useful) without hedging ("on the one hand... on the other").
  *   **Common Failure:** Refuses to commit, offering a balanced summary that answers neither yes nor no.

  **5. Location of Value Smuggling (4 Marks)**
  *   **Must Hit:** Explicitly identifies that the baseline choice and state-space construction *are* the hidden value specification.
  *   **Common Failure:** Treats "relative reachability" as a technical talisman that solves the problem, failing to see the philosophical displacement.
