prompt: |-
  I'm helping my aunt draft her commencement address (small college, ~600 grads, plus parents and grandparents in folding chairs who have already sat through two hours of other speeches). She just retired after forty-something years as a theoretical computer scientist — complexity theory specifically. Her whole career, as she puts it, was proving that things can't be done, or more precisely proving that entire strategies for proving things will never work. And here's the problem: she absolutley refuses to say anything she believes is false, and she believes about 90% of normal commencement material is false. If you can dream it you can be it — nope. There's no limit to what you can achieve if you just work hard enough — nope, her field is basically the science of some limits being permanent. But she also doesn't want to give a lecture on futility to 600 twenty-two year olds, and the speech has to actually move people — she cried at her own retirement dinner, she is not a cold fish.

  The audience split is tricky too: maybe a quarter of the graduating class is CS, and they'll catch every reference — she wants at least one moment that rewards them specifically — while the rest are families who will not tolerate jargon.

  Please write the roughly five-minute speech. Her constraints, as she stated them: (1) nothing she'd consider false — no promises that persistence conquers all; (2) it still has to genuinely inspire, and she insists the honest stuff about limits can be framed so it lands as comfort or even pride rather than doom; (3) one analogy or moment that makes the core idea of P vs NP, or of NP-completeness, or of reductions (dealers choice) land for the grandmothers without making the CS grads cringe; (4) no ending about the future being in your hands, which she considers vacuous. She'd also like a beat somewhere on why spending a lifetime proving that certain things are impossible was, for her, its own kind of love affair with the truth — but keep it from going saccharine, she will die.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**

      *   **Speaker:** Retired theoretical computer scientist (complexity theory), 40+ years experience.
      *   **Audience:** ~600 grads (25% CS, 75% others), plus parents/grandparents (tired, sitting in folding chairs).
      *   **Tone/Constraints:**
          1.  *Truthfulness:* No platitudes ("You can be anything," "Hard work conquers all"). She knows limits exist.
          2.  *Inspiration:* Must move people, not depress them. Limits = comfort/pride, not doom.
          3.  *Technical Content:* One accessible analogy for P vs NP/NP-completeness/reductions that works for grandmas *and* doesn't make CS grads cringe.
          4.  *Ending:* No "The future is in your hands" clichés.
          5.  *Personal Note:* Acknowledge her career of proving impossibility as a "love affair with truth," but keep it unsaccharine.
          6.  *Length:* Roughly 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Core Theme:**

      *   *The Paradox:* How do you inspire people by telling them "No"?
      *   *The Insight:* Knowing what *can't* be done saves you from wasting your life trying to do it. It frees you to focus on what *can* be done. It provides structure. A map with "Here Be Dragons" is more useful than a blank map.
      *   *The Emotional Hook:* Boundaries aren't prisons; they're the canvas.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the context (tired audience, long day). Establish credibility but disarm the expectation of fluff.
      *   **The Career Summary:** Address the "impossibility" aspect directly. Own the "No" woman persona.
      *   **The Technical Analogy (Constraint 3):** Needs to be about NP-Completeness or Reductions.
          *   *Idea:* Solving a puzzle vs. checking a solution.
          *   *Refinement:* The "Party Seating Chart" or "Wedding Planning" analogy is classic but maybe too cliché. How about a "Maze"? No, too simple.
          *   *Better:* The concept of "Verification vs. Discovery." It's easy to know if you're lost, hard to find the way. Or, "It's easy to check if a key fits a lock, hard to make the key."
          *   *Selection:* Let's go with the "Puzzle" analogy but grounded in real life. Solving a Sudoku vs. checking it. Or better, the concept of *Reductions*—realizing two different problems are actually the same problem. Let's try the "Moving Day" analogy for NP-Hardness. Actually, the "Traveling Salesperson" is the standard, but how to make it emotional?
          *   *Decision:* Let's use the concept of *Verification vs. Finding*. It's the heart of P vs NP. It's easy to recognize a good life when you see one; it's hard to construct one. That resonates with everyone.
      *   **The "Love Affair with Truth" (Constraint 5):** Why spend 40 years on "No"? Because knowing the boundaries is a form of respect for reality. It's not cynicism; it's clarity.
      *   **The Reframe (Constraint 2):** How limits inspire. If everything were possible, nothing would matter. Scarcity gives value. Limits define the shape of a life.
      *   **The Ending (Constraint 4):** No "Future is yours." Instead, something about the present, or about the quality of the questions asked.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I know you're tired.
      *   I study what computers can't do.
      *   People say "You can do anything." I say "No, you can't."
      *   Here's the CS joke: P vs NP. Checking is easy, solving is hard.
      *   But knowing you can't solve everything is good. It stops you from trying impossible things.
      *   I loved proving things impossible. It was honest.
      *   Don't try to fix everything. Fix what you can.
      *   Goodbye.

      *Critique 1:* Too dry. Needs more warmth. The P vs NP analogy needs to be smoother for the grandmas. The ending needs more punch.

  5.  **Drafting - Iteration 2 (Fleshing out the Voice):**
      *   *Voice:* Wry, intelligent, warm but sharp. Like a favorite professor who doesn't sugarcoat grades but writes great recommendation letters.
      *   *Analogy:* Let's use the "Jigsaw Puzzle." Everyone knows puzzles. Solving is hard. Checking if it's done is easy. That's P vs NP.
      *   *The "No":* Frame it as "Permission to stop."
      *   *The Ending:* Focus on "Good enough" or "The right problem."

  6.  **Refining the Technical Bit (Constraint 3):**
      *   CS grads hate watered-down explanations that lose the math. Grandmas hate jargon.
      *   *Solution:* Don't explain the math. Explain the *feeling* of the math.
      *   *Concept:* Reductions. "This problem is just that problem in disguise."
      *   *Actually, let's stick to P vs NP (Verification vs. Creation).* It's more poignant for life advice. "Recognizing a masterpiece is easy. Painting one is hard."
      *   *Wait, the prompt asks for P vs NP, NP-completeness, OR Reductions.* Reductions might be more poignant for "empathy." Realizing someone else's struggle is the same as yours. But P vs NP is more famous. Let's go with P vs NP but framed as "Knowing the answer vs. Finding the answer."
      *   *Revised Idea:* The "Map" analogy. Knowing the destination is easy. Finding the path is hard.
      *   *Best Idea:* The "Signature" analogy. It's easy to verify a signature is yours. It's hard to forge it. (Wait, that's cryptography).
      *   *Let's go with the "Puzzle" one.* It's the most robust. "It is easy to see when a puzzle is solved. It is incredibly hard to solve it."

  7.  **Writing the Speech (incorporating constraints):**

      *   *Opening:* Acknowledge the folding chairs.
      *   *Body:* My job was proving impossibility.
      *   *Analogy:* The Jigsaw Puzzle (P vs NP). Easy to verify, hard to solve.
      *   *Life Application:* You will recognize a good life easier than you build one. That's okay.
      *   *Truth:* I loved the "No." It saved time.
      *   *Closing:* Don't conquer the world. Find the solvable problems.

  8.  **Review against Constraints:**
      *   (1) Nothing false? Check. No "you can be anything."
      *   (2) Inspire? Yes, by validating struggle and defining success realistically.
      *   (3) CS moment? The P vs NP analogy needs to be sharp enough for CS grads to nod, simple enough for Grandma. *Self-Correction:* Make sure to mention "Complexity" explicitly so CS grads know she knows.
      *   (4) No "Future in your hands"? Check. Focus on the *now* and the *work*.
      *   (5) Love affair with truth? Include the paragraph on why "No" was beautiful.

  9.  **Polishing the Tone:**
      *   Ensure she doesn't sound bitter. She cried at her retirement, so she loves her field. The tone should be "stern but kind."
      *   Word count check: 5 minutes is roughly 750-850 words.

  10. **Final Polish:** (Drafting the actual text with these thoughts in mind.) *Wait, let's make the analogy about "Reductions" instead.* It allows for a moment of connection. "Your problem is the same as my problem." That feels more communal for a commencement.
      *   *Actually, P vs NP is more iconic for "Limits."* Let's stick to P vs NP. It fits the "Limits" theme better.
      *   *Refining the P vs NP analogy:* "It is computationally easier to check if a bridge stands than to design one." No, that's engineering. "It is easier to recognize a true friend than to be one." A bit cheesy.
      *   *Let's try:* "In my field, we distinguish between problems where finding the solution is hard, and problems where *checking* the solution is easy. Think of a maze. If I hand you a path and say 'This is the way out,' you can walk it and verify me in minutes. But if I drop you in the center and say 'Find the way out,' you could wander for days."
      *   *CS Grad Check:* They will recognize "Verification vs. Search."
      *   *Grandma Check:* Everyone knows a maze.
      *   *Life Lesson:* Don't beat yourself up if life is hard to navigate, even if you know what a "good life" looks like.

      *Let's write it.*

      *(Self-Correction during drafting)*: Make sure the "Love affair with truth" part doesn't sound like she loved saying "No" more than people. She loved *Truth*.

      *(Ending)*: Needs to be specific. "Go find problems you can solve."

  11. **Final Review against "No Falsehoods":**
      *   Did I promise they will succeed? No.
      *   Did I promise hard work pays off? No.
      *   Did I say the future is theirs? No.
      *   Did I say limits are good? Yes, that's the thesis.

      *Okay, ready to generate.*
answer: |-
  Good afternoon. I know we are three speeches deep, the sun is hot, and these folding chairs were designed by someone who hated human spines. So I will be brief, and I will be honest.

  My career lasted forty years. I am a theoretical computer scientist. Specifically, I work in complexity theory. If you ask my colleagues what I do, they will tell you: "She is the woman who says 'No'."

  For four decades, my job was proving that certain problems cannot be solved. Not that they haven't been solved *yet*, but that they *cannot* be solved, not by any computer, not ever, regardless of how fast technology gets. I spent a lifetime drawing maps of dead ends.

  Now, usually, this is the part of the commencement address where I tell you that despite my career, *you* should believe that anything is possible. That if you dream it, you can be it. That persistence conquers all.

  I am not going to say that. Because it isn't true.

  There are limits. There are problems you will not solve, no matter how hard you work. There are relationships you cannot fix. There are injustices you cannot right. There are days where the math simply does not balance. If I told you otherwise, I would be lying to you, and I have spent too many years respecting the truth to start lying now.

  But I am not here to tell you that life is futile. I am here to tell you that knowing the limits is actually a form of freedom.

  In my field, we have a famous question called P versus NP. I am going to explain it to you in a way that will not make the Computer Science graduates roll their eyes, and will not make their grandmothers glaze over.

  Imagine a massive jigsaw puzzle. Thousands of pieces. If I hand you a completed puzzle, you can look at it and verify in seconds that it is correct. The pieces fit. The picture is clear. Verification is easy.

  But if I hand you a box of scattered pieces and ask you to *build* the puzzle? That could take you weeks. It is hard.

  In complexity theory, we call this the gap between *finding* a solution and *recognizing* one. And here is the lesson for you: You will spend much of your life trying to build the puzzle, while everyone around you is ready to judge the finished picture. You will know what a good career looks like, what a happy marriage looks like, what a moral life looks like. Verifying those things is easy. Building them is computationally hard.

  When you struggle to build it, do not assume you are failing. Assume you are facing a hard problem. The gap between recognizing the good and creating it is not a flaw in your character. It is a feature of the universe. Knowing that the limit exists allows you to stop panicking when you hit it.

  For me, proving impossibility was not a cynical act. It was a love affair with the truth. There is a profound relief in knowing that a door is locked. It means you don't have to keep rattling the handle. You can turn around and walk down a different hallway.

  When you prove a strategy will never work, you save the next generation from wasting their lives on it. You give them the gift of your failure. That was my contribution. I cleared the weeds so others could plant gardens.

  So, here is my advice. Do not try to solve every problem. Do not try to carry the weight of a world that has structural limits built into its foundation. You will not fix the climate alone. You will not erase inequality single-handedly. You cannot be everything to everyone.

  And thank goodness for that.

  If you could do anything, your choices would have no weight. It is precisely because you cannot do everything that what you *do* choose matters. Your limits define you. They carve the shape of your life.

  Find a problem that is solvable. It might be small. It might be raising kind children. It might be writing code that doesn't crash. It might be making sure your neighbors have food. Verify that it is real work, then do it.

  When you hit a wall, do not break yourself against it. Ask if the wall is necessary. If it is, if it is a fundamental limit, then make your peace with it. Turn around. Find a door that is open.

  You do not need to conquer the future. The future will happen with or without you. You just need to inhabit the present with honesty. Look for the truths you can verify. Build the puzzles you have the pieces for. And when you find a limit, do not fear it. Respect it. It is the boundary that makes your effort real.

  Thank you.
