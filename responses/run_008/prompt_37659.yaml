  You're a philosopher of economics who's spent years thinking about welfare economics and decision theory, so treat this one carefully — maybe sketch some preliminary thoughts before settling on your final answer, because the practice is a bit of a tangle.

  Here's the thing I'm puzzled by. When US federal agencies do cost-benefit analysis on a proposed regulation, they don't just report "this rule will prevent about 30 deaths a year" and leave it there. They monetize it. The rule's life-saving benefit gets counted as something on the order of $300 million, because agencies use a value of a statistical life of roughly $10–12 million, and that number is mostly derived from labor market studies — the extra wages workers demand before they'll accept riskier jobs. The same spirit runs through the rest of the analysis: benefits are valued by what people would be willing to pay for them, costs by what they'd pay to avoid them, and the regulation is supposed to pass only if benefits exceed costs. So the whole machinery seems to rest on the idea that what people would pay reveals how much they care, and how much they care is what morally counts. But the very same governments that run these analyses also tax cigarettes heavily, mandate seatbelts, and force retirement contributions through Social Security — all of which only make sense if we think people's choices don't reliably track their own good.

  So my question is: what exactly does this cost-benefit practice presuppose about preference, utility, and wellbeing? Which specific version of "revealed preference = welfare" is being assumed, and can it survive alongside the paternalism in that other bucket of policy? Or is the cost-benefit side quietly ruling out a theory that the cigarette-and-seatbelt side needs, or vice versa — can the two be made consistant at all?

  Give me exactly five numbered points, each a sentence or two, with no introduction or conclusion. Each point should name one distinct philosophical commitment (or tightly-knit cluster of presuppositions) that the cost-benefit machinery rests on — and for each, add one sentence on whether the rest of government behavior actually honors that commitment or quietly undermines it.
