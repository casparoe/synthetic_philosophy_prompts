answer: |-
  1. CBA presupposes preference sovereignty, holding that the satisfaction of an individual's actual choices constitutes the primary metric of their wellbeing. This commitment is directly undermined by paternalistic mandates like seatbelt laws, which legislatively override those very choices to impose an objective standard of safety.

  2. The derivation of VSL from labor markets assumes agents possess coherent beliefs and accurately process probabilistic risk when revealing their preferences. Heavy sin taxes on cigarettes contradict this by assuming individuals systematically misjudge long-term health risks due to addiction or cognitive bias.

  3. The practice equates utility strictly with willingness-to-pay, assuming market behavior captures all relevant dimensions of human welfare. Mandatory retirement contributions undermine this equivalence by asserting that financial security is a good people ought to have, regardless of their revealed preference for current consumption.

  4. The model assumes intertemporal consistency, treating current valuations as authoritative for future wellbeing. Paternalistic policies undermine this by relying on hyperbolic discounting models where current selves are deemed incompetent stewards of their future selves' interests.

  5. CBA presumes state neutrality regarding the content of preferences, counting all satisfied wants equally toward social welfare. Sin taxes violate this neutrality by implicitly ranking health-related preferences as superior to pleasure-related ones within the individual's own utility function.
