prompt: |-
  My two friends Dan and Priya got into it after our rec league voted on where to have the end-of-season party, and they asked me to referee and I honestly couldnt follow it after a while, so I'm hoping you can untangle it.

  Quick setup: 23 of us voted between three options -- a brewery, a bowling alley, and a member's backyard. We each ranked them and gave 2 points to our first choice, 1 to second, 0 to last. Bowling won with 31 points, brewery got 26, backyard got 12.

  Dan went home and made a spreadsheet (of course he did) and came back to the group chat with this: in a straight one-on-one vote, the brewery beats the bowling alley 13 votes to 10, so bowling isn't really "the group's choice" -- it just snuck in because it was everybody's lukewarm second, and the brewery lost points for being polarizing even though more people prefer it head-to-head. He wants us to redo it as a straight matchup between the top two.

  Priya said that whole way of thinking is broken, because majorities can go in circles. She said imagine the club were split into three equal blocs: one ranks bowling > brewery > backyard, one ranks brewery > backyard > bowling, and one ranks backyard > bowling > brewery. Then a majority prefers bowling to the brewery, a majority prefers the brewery to the backyard, and a majority prefers the backyard to bowling. So "what the group prefers head-to-head" can literally have no answer, and that's exactly why you need second choices in the scoring at all.

  Dan said fine, but the points system has its own absurdity, and here he actually got to her: he pointed out that if the backyard option had never made the ballot (nobody's ballots change, you just delete it), the brewery wins that same vote 13-10. So whether bowling wins depends on whether a last-place option nobody wanted was even on the menu. He said that's the textbook definition of a spoiler, and the whole reason we switched to points two seasons ago was to avoid spoiler drama from the old one-vote-per-person system, and it turns out we didn't fix it, we just hid it.

  Priya said perfection doesn't exist, and that she's pretty sure a mathematician proved back in the fifties that every system where you rank options has a defect like this -- either one voter's ranking secretly decides everything, or the system ignores what people rank, or it's got the spoiler problem -- so Dan is wasting everyone's time going system by system hunting for the fair one, because it provably isn't out there.

  Dan said that proves too much. If the theorem is "no system is perfect," it's technically true but about as useful as saying you can't draw a perfect circle. Systems still differ in degree: some get spoiled constantly and some almost never, and "almost never" matters when you're picking a party venue.

  Priya said "almost never" is vibes, not math, and anyway Dan's proposed fix is worse: his head-to-head bracket thing still has spoilers, and somebody has to decide the order of the matchups, and with options that beat each other in a circle, whoever sets the bracket picks the winner without casting a vote.

  At that point they both looked at me and I said I'd get back to them. Can you go through their exchange move by move and say who's right at each step, who comes out more right overall, and what (if anything) they're both missing? Please dont just say "it's complicated."
