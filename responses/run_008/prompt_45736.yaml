          2.  **Identify Breakdowns:** Where does the mapping fail? Distinguish between cosmetic breaks and consequential breaks (affecting conclusions like lexical priority of liberty or primary goods vs. utility).
          3.  **Evaluate the Utilitarian Conclusion:** Does the conclusion survive scrutiny of the disanalogies? Is the lottery a legitimate sharpening or question-begging?
          4.  **Evaluate the Animal Extension:** Does including animals strengthen (honesty about risk) or break (persisting subject issue) the analogy?

  2.  **Task 1: Audit the Analogy (Correspondence Table):**

      *   *Rawls's Original Position:* Device of representation, parties are representatives of citizens, no probabilities, Maximin rule, Primary Goods.
      *   *Rationalist Lottery:* Literal gamble, single agent, equiprobability assumption, Expected Utility, Hedonic/Preference Utility.
      *   *Mapping:*
          *   Ticket = A specific life trajectory (social position, talents, wealth).
          *   Draw = Birth/Conception.
          *   Betting Scheme = Social Contract/Constitution.
          *   Stake = Lifetime Well-being (Utility).
          *   House = Nature/History (or the mechanism implementing the rules).
          *   Gambler = The "Pre-birth Self" (Disembodied agent).

  3.  **Task 2: Identify Breakdowns (Cosmetic vs. Consequential):**

      *   *Cosmetic:* Terminology (Parties vs. Single Agent). Rawls uses plural parties to represent plural citizens; Rationalists use a single agent imagining being anyone. This doesn't change the math much.
      *   *Consequential 1: Probability.* Rawls: No principle of insufficient reason (don't assume 1/N chance). Rationalists: Assume equiprobability. *Impact:* Crucial. Without probabilities, Expected Utility (EU) calculation is impossible. You fall back to Maximin.
      *   *Consequential 2: The Stake (Utility vs. Primary Goods).* Rawls: Primary Goods (rights, liberties, opportunities, all-purpose means). Rationalists: Utility (hedons, preference satisfaction). *Impact:* Crucial. Primary goods support lexical liberty (you can't trade liberty for wealth). Utility supports aggregation (trade liberty for enough happiness).
      *   *Consequential 3: The Gambler (Identity).* Rawls: No metaphysical self behind the veil. Rationalists: Implicit Cartesian ego. *Impact:* Deep. If there's no "you" to survive the draw, the prudential rationality argument collapses.

  4.  **Task 3: Evaluate the Utilitarian Conclusion:**

      *   *Question:* Is the lottery a sharpening or question-begging?
      *   *Analysis:* The rationalist argument relies on Harsanyi's Aggregation Theorem. It assumes: (1) Rationality = EU maximization, (2) Impartiality = Equiprobability.
      *   *Rawls's Counter:* The situation is one of *radical uncertainty*, not risk. You don't know the odds. In radical uncertainty, Maximin is rational (protect the floor).
      *   *Verdict:* The expected-value machinery *is* carrying the conclusion. It's not a neutral sharpening; it's a substitution of premises. By assuming equiprobability and utility measurability, you define the outcome as utilitarianism before you start. It's not "what Rawls's construction can't deliver," it's "what Rawls's construction explicitly rejects to avoid utilitarianism."
