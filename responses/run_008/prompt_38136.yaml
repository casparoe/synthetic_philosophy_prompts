      *   *Section 4: Class Politics.* Be honest. Is it class? Partially. It's about the circulation of capital (Jessica stealing funds) and the legitimacy of profit (mercantile vs. usury). But "class" alone misses the *ontological* weight given to Shylock's identity. It's status politics mediated through economics.
      *   *Conclusion:* Summarize the distinction. Money is a *reversible* construction in the play; Identity is an *irreversible* (or at least sticky) construction.

