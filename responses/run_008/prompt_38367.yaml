  **BRIEFING PAPER: BEHAVIORAL POLICY REVIEW BOARD**
  **TO:** Faculty Representative
  **FROM:** Political Philosophy Consultant
  **SUBJECT:** Precedent Analysis and Verdict Prediction: Dormitory Energy Leaderboard Proposal

  ### I. Competing Decision Rules Derived from Precedents

  To predict the Board's verdict, we must first distill the logic underlying our six prior decisions. The track record is consistent, but it supports two distinct normative frameworks. One focuses on the *mechanism* of influence (Substantive); the other focuses on the *architecture of exit* (Procedural).

  **Rule 1: The "Non-Social Mechanism" Principle (Substantive)**
  *   **Formulation:** Interventions are permissible only if they alter the *physical or digital structure* of choice (defaults, salience, effort) without leveraging *social emotions* (shame, conformity, peer surveillance, or interpersonal friction) as the primary engine of compliance.
  *   **Rationale:** This rule protects the agent's "social dignity." It distinguishes between nudging a person by making the healthy option easier (Case 1, 6) versus nudging them by making the unhealthy option socially awkward (Case 3, 5) or by invoking peer pressure (Case 4).
  *   **Fit with Precedents:**
      *   *Approved (1, 2, 6):* All rely on inertia, salience, or effort reordering. No social leverage.
      *   *Rejected (3, 4, 5):* Case 3 requires asking a server (interpersonal friction/shame). Case 4 leverages social norms (peer pressure). Case 5 requires emailing an administrator (interpersonal friction/accountability).
  *   **Prediction for New Proposal:** **REJECT.**
      *   *Reasoning:* The proposal relies explicitly on social comparison (leaderboard) and peer surveillance (Room # visible to floormates). This triggers the same ethical alarm as the Flu Email (Case 4) and the Request-Only Dessert (Case 3).
      *   *Closest Analog:* **Case 4 (Flu Email).** Both use social norms/comparison to drive behavior. The fact that this proposal has an opt-out distinguishes it procedurally, but under Rule 1, the *mechanism itself* is the disqualifier.

  **Rule 2: The "Sovereign Exit" Principle (Procedural)**
  *   **Formulation:** Interventions are permissible if the agent retains a *trivial, private, and effective* right to revert to the status quo ante. The mechanism (even if social) is secondary to the ease and privacy of the opt-out.
  *   **Rationale:** This rule prioritizes "choice sovereignty." It assumes that if a user can escape the nudge without cost, shame, or effort, their autonomy is preserved regardless of how manipulative the default might be.
  *   **Fit with Precedents:**
      *   *Approved (1, 2, 6):* Case 1 (no exit needed); Case 2 & 6 (1-click/digital override).
      *   *Rejected (3, 4, 5):* Case 3 (Interpersonal exit); Case 5 (Interpersonal exit); Case 4 (No exit from the *pressure* itself).
  *   **Prediction for New Proposal:** **APPROVE-WITH-CONDITIONS.**
      *   *Reasoning:* The opt-out is 1-click (trivial) and invisible to floormates (private). This satisfies the core demand of Rule 2, distinguishing it from Case 5 (email admin) and Case 3 (ask server). However, the notice condition (newsletter, 10% open rate) fails the "effective notice" standard established in Case 2 (offer letter).
      *   *Closest Analog:* **Case 2 (Pension Enrollment).** Both are default enrollments with digital opt-outs. The divergence lies in the *quality of notice* and the *public nature of the default state*.

  ---

  ### II. Predicted Verdict and Defense

  **Prediction:** **APPROVE-WITH-CONDITIONS**

  **Proposed Conditions:**
  1.  **Anonymization:** Room numbers on the leaderboard must be replaced with random, non-identifiable IDs (e.g., "Room 304" becomes "Unit 4B"). The mapping key must be private.
  2.  **Enhanced Notice:** The opt-out and the nature of the program must be communicated via direct email (requiring a read receipt or click-through) rather than the monthly newsletter, consistent with the "effective notice" standard in Case 2.

  **Defense of Prediction:**
  I predict this verdict because the Board's strongest signal concerns **friction and interpersonal cost**, not mechanism purity.

  Compare Case 2 (Pension) and Case 5 (Mentoring). Both were auto-enrollment defaults. The *only* variable that changed the verdict was the opt-out method (1-click vs. Email Admin). This suggests the Board views *interpersonal friction* as the primary violation of autonomy, not the use of defaults itself. Similarly, compare Case 1 (Cafeteria Layout) and Case 3 (Dessert Request). Both aimed at health. Case 1 passed because the friction was physical (walking further); Case 3 failed because the friction was social (asking a human).

  The New Proposal offers a 1-click, invisible opt-out. This clears the "Interpersonal Friction" hurdle that killed Cases 3 and 5.

  **Where Precedents Underdetermine the Verdict:**
  There is genuine uncertainty here due to **Case 4 (Flu Email)**. Case 4 was rejected despite having no formal "opt-out barrier" (one could simply ignore the email). This implies the Board may view *Social Norm Messaging* as intrinsically manipulative, regardless of exit rights. If the Board interprets the Leaderboard as a "Social Norm Message" rather than a "Choice Architecture Default," Case 4 becomes the controlling precedent, demanding a **Reject**.

  However, I weigh Case 2 and 5 more heavily. Those cases establish a clear bright line: *Digital/Trivial Exit = Approved; Interpersonal/High-Friction Exit = Rejected.* The New Proposal fits the Digital/Trivial profile. The risk of social shame exists, but if the opt-out is truly invisible (as proposed), the shame is avoidable. The Board has shown a willingness to *cure* proposals (Case 2) rather than kill them. Therefore, conditioning approval on Anonymization (removing the shame source) and Notice (curing the transparency deficit) aligns best with the Board's rehabilitative history.

  ---

  ### III. Closest Precedent Analysis

  The New Proposal is a hybrid, but its "spiritual" ancestor differs depending on which Rule the Board privileges.

  *   **Under Rule 1 (Mechanism):** The closest analog is **Case 4 (Flu Email)**.
      *   *Similarity:* Both leverage social comparison and the desire to conform to a perceived norm to achieve a public good (health/energy).
      *   *Implication:* If the Board views the *engine* of the nudge as the ethical locus, Case 4 controls, and the proposal fails.

  *   **Under Rule 2 (Exit):** The closest analog is **Case 2 (Pension Enrollment)**.
      *   *Similarity:* Both are administrative defaults where the "beneficial" choice is pre-selected, and the user must act to revert.
      *   *Implication:* If the Board views the *preservation of exit rights* as the ethical locus, Case 2 controls, and the proposal passes (provided notice is fixed).

  *   **My Assessment:** The Board is likely to treat this as **Case 2 with Case 3's baggage.**
      *   It is structurally a Default (Case 2).
      *   But the *content* of the default involves public visibility (Case 3: Asking for dessert).
      *   *Crucial Distinction:* In Case 3, the *act of choosing* the dessert was public. In the New Proposal, the *state of being enrolled* is public. This is a subtle but vital difference. The Board rejected Case 3 because the *choice* required social exposure. Here, the *status* is exposed, but the *choice to leave* is private. This distinction allows for the "Approve-with-Conditions" verdict (Anonymize the status).

  ---

  ### IV. The Falsification Case (For Your Back Pocket)

  To test which Rule the Board is actually running during the meeting, propose the following hypothetical future case:

  **The "Green Dot" Profile Default**
  *   **Proposal:** All student online profiles are automatically assigned a visible "Sustainability Champion" badge (Green Dot). This badge is visible to all other students and faculty.
  *   **Opt-Out:** A student can remove the badge with a single click in their privacy settings. The removal is silent; no one is notified that the badge was removed, though the absence of the badge is visible.
  *   **Notice:** Announced in the student handbook (high visibility).

  **How This Separates the Rules:**

  1.  **If the Board Rejects this case:**
      *   **Falsifies Rule 2 (Sovereign Exit).** Rule 2 predicts Approval because the exit is trivial (1-click), private (no notification), and notice is effective.
      *   **Confirms Rule 1 (Non-Social Mechanism).** The rejection confirms that the Board prohibits nudges that turn private behavior into public social currency, regardless of how easy it is to opt-out. The *mechanism* (social signaling) is the dealbreaker.

  2.  **If the Board Approves this case:**
      *   **Falsifies Rule 1 (Non-Social Mechanism).** Rule 1 predicts Rejection because the engine of the nudge is entirely social reputation/shame.
      *   **Confirms Rule 2 (Sovereign Exit).** The approval confirms that the Board cares primarily about the *architecture of exit*. As long as the student can escape the social pressure without friction, the Board permits the social pressure itself.

  **Strategic Use:**
  If the discussion on the Dorm Leaderboard stalls, introduce the "Green Dot" case. If colleagues say, "Well, obviously we can't put badges on profiles, that's coercive," you know **Rule 1** is dominant, and you should argue for **Reject** (or strict Anonymization) on the Dorm Proposal. If they say, "Sure, as long as they can turn it off easily," you know **Rule 2** is dominant, and you should argue for **Approve-with-Conditions** focusing on Notice and Opt-Out visibility.
