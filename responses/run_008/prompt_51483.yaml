      *   *The Paradox:*
          *   Red > Black implies $P(Red) > P(Black)$. Since $P(Red)=1/3$, this implies $P(Black) < 1/3$.
          *   Black-or-Yellow > Red-or-Yellow implies $P(Black \cup Yellow) > P(Red \cup Yellow)$.
          *   $P(Black \cup Yellow) = 2/3$.
          *   $P(Red \cup Yellow) = 1/3 + P(Yellow)$.
          *   So $2/3 > 1/3 + P(Yellow) \implies 1/3 > P(Yellow)$.
          *   Since $P(Black) + P(Yellow) = 2/3$, if $P(Yellow) < 1/3$, then $P(Black) > 1/3$.
          *   *Contradiction:* First choice implies $P(Black) < 1/3$. Second choice implies $P(Black) > 1/3$.
      *   *Standard Economic View:* Violates Savage's Sure Thing Principle (Subjective Expected Utility Theory).
