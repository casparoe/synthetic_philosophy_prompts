  4.  **Synthesize the "Missing Thing":**
      *   What are they missing?
      *   **Knightian Uncertainty:** The distinction between Risk (known probabilities) and Uncertainty (unknown probabilities). Frank Knight (1921).
      *   **Savage vs. Gilboa-Schmeidler:** Dana is arguing from Savage's Subjective Expected Utility (SEU). Marco is arguing from Maxmin Expected Utility (MEU). Both are coherent systems, but they have different axioms.
