      *   **The 1750 Factor:** Crucial because neither knows chemistry. Externalists say reference is fixed by ostension + environment (even if unknown). Internalists say content is fixed by descriptive/phenomenal properties available to the speaker.
      *   **The Mixture Planet:** A stress test for natural kind terms. Is "water" a functional concept or a microstructural one?
      *   **Verbal Dispute:** Are they arguing about the word "meaning"? Externalists often mean *reference/extension*. Internalists often mean *sense/cognitive significance*.

  3.  **Drafting Section 1: Agreed Claims:**
