      *   *Issue 3: Mixture Planet.* Externalist: Likely false (not a natural kind). Internalist: Likely true (fits the concept).
      *   *Issue 4: Verbal Dispute.* Acknowledge the Reference vs. Competence split.

  5.  **Drafting Section 3: Cruxes:**
      *   Need concrete cases where predictions diverge.
      *   *Crux 1: Deference/Division of Linguistic Labor.* If experts say it's XYZ, does the layperson defer?
      *   *Crux 2: Modal Intuitions.* Counterfactuals. "Could water have been XYZ?"
      *   *Crux 3: The Mixture Case.* (Required).
      *   *Predictions:* Externalist predicts intuition aligns with microstructure. Internalist predicts intuition aligns with appearance/use.

