answer: |-
  ### Exam Question

  **Question 4: The Absent-Minded Driver (20 Points)**

  Consider the Piccione and Rubinstein (1997) absent-minded driver scenario. The driver faces two identical intersections. The payoffs are: Exit at 1st = 1; Exit at 2nd = 4; Continue past 2nd = 0. The driver cannot distinguish the intersections and forgets whether he has passed one.

  Let $p$ be the probability of exiting at any given intersection.

  1.  Derive the ex ante optimal plan $p^*$ and the expected payoff. Explain why this $p^*$ is a *plan* rather than a specific *action* instruction.
  2.  Suppose the driver arrives at an intersection and knows the plan is $p^*$. Calculate the conditional probability that he is at the first intersection. Using this belief, calculate the expected payoff of (i) Exiting now and (ii) Continuing (and adhering to $p^*$ thereafter). Show that these are equal.
  3.  Analyze the plan $p=0$ ("Never Exit"). Explain why a driver at an intersection might reason that continuing is the rational choice, making $p=0$ feel self-consistent despite yielding a payoff of 0.
  4.  Contrast the "multi-self game" resolution with the "single-agent policy" resolution. Does the ex ante optimum remain self-enforcing under each?
  5.  Briefly connect this structure to a commitment problem or Newcomb-like dilemma. Ensure the analogy clarifies the mechanism rather than replacing the analysis.

  *(Recommended time: 75 minutes)*

  ***

  ### Model Answer

  The ex ante expected payoff is $V(p) = p(1) + (1-p)p(4) + (1-p)^2(0) = 5p - 4p^2$. Maximizing this yields FOC $5 - 8p = 0$, so the optimal plan is **$p^* = 5/8$**, with value **$25/16$**. This $p^*$ is a *plan* (a mixed strategy chosen at $t=0$) because the driver lacks the memory to condition actions on history; he cannot choose "Exit at 2nd only." He must commit to a stochastic rule applicable at every indistinguishable node.

  At an intersection, the driver conditions on having reached *an* intersection. The probability of reaching the 1st is 1; the 2nd is $(1-p)$. The conditional belief of being at the 1st is $\alpha = 1 / (1 + (1-p)) = 1/(2-p)$. At $p^*=5/8$, **$\alpha = 8/11$**.
  (i) Payoff(Exit) = $\alpha(1) + (1-\alpha)(4) = 8/11 + 12/11 = \mathbf{20/11}$.
  (ii) Payoff(Continue) = $\alpha[ p(4) + (1-p)0 ] + (1-\alpha)[0] = (8/11)(5/8 \cdot 4) = \mathbf{20/11}$.
  The indifference is not accidental; it is the fixed-point condition required for a mixed strategy equilibrium. The action-stage reasoner cannot deviate profitably because their choice is constrained by the belief generated by the plan itself.

  The **$p=0$ trap** arises if the driver reasons naively about the information set. If the plan is $p=0$, the probability of reaching the 2nd intersection is zero. Thus, finding oneself at an intersection implies (via Bayes' rule limits) one must be at the 1st. If I know I am at the 1st, Continuing dominates Exiting (0 vs 1? No, 4 vs 1). Wait—if I know I am at the 1st, Continuing leads to the 2nd (payoff 4). Thus, "Continue" appears strictly dominant at the node, reinforcing $p=0$. This is self-consistent locally but globally catastrophic (payoff 0).

  To repair this, we distinguish two frameworks. In the **multi-self game**, each intersection is a player. $p=0$ is a Nash Equilibrium (if Self 1 continues, Self 2 is reached; if Self 2 expects Self 1 continued, Self 2 continues to get 0? No, Self 2 would Exit). Actually, the standard repair treats the agent as a single entity choosing a **policy**. The ex ante optimum ($5/8$) is self-enforcing only if the agent accepts that their current action provides evidence about their plan (Evidential Decision Theory) or if they can commit. Under Causal Decision Theory with multiple selves, time-inconsistency arises because the "selves" have conflicting interests regarding the belief $\alpha$.

  This mirrors **Newcomb's Problem**: the choice at the intersection is correlated with the state (which intersection) via the common cause (the plan $p$). Like the two-boxer, the causal reasoner at the intersection ignores the correlation between their action and the probability of being at the 2nd node, leading to suboptimal outcomes. It also resembles a **commitment problem**: the ex ante self wishes to bind the interim self to a mixed strategy, but the interim self, lacking recall, faces distorted incentives. The lesson is that without memory, rational planning requires treating one's own choice as diagnostic of one's location.

  ***

  ### Marking Scheme (20 Points)

  **1. Planning Optimum & Plan/Action Distinction (4 Points)**
  *   **Criteria:** Correctly derives $p=5/8$ and $V=25/16$. Explicitly states $p$ is a behavioral strategy/plan chosen ex ante, not a state-contingent action.
  *   **Common Fumble:** Deriving the number correctly but treating $p$ as "probability of being at the second node" rather than a chosen mixed strategy.

  **2. Action-Stage Computation & Indifference (4 Points)**
  *   **Criteria:** Correctly calculates belief $\alpha=8/11$ and shows both actions yield $20/11$. Explains that indifference is a fixed-point requirement for the mixed plan, not a numerical coincidence.
  *   **Common Fumble:** Confusing the probability of *reaching* the node with the probability of *being* at the node (forgetting to normalize by total reach probability).

  **3. The $p=0$ Trap Diagnosis (4 Points)**
  *   **Criteria:** Explains that at $p=0$, reaching a node implies being at the 1st (prob 1). Continuing then seems to guarantee access to the payoff 4, making $p=0$ locally stable despite global failure.
  *   **Common Fumble:** Claiming $p=0$ is stable because "Exiting gives 0," ignoring that Exiting at the 1st gives 1.

  **4. Multi-Self vs. Policy Repairs (4 Points)**
  *   **Criteria:** Distinguishes between treating intersections as independent players (Game) vs. one agent choosing a policy (Decision Theory). Notes that ex ante optimum is only self-enforcing if the agent accounts for the evidential link between action and belief.
  *   **Common Fumble:** Asserting that the multi-self game automatically solves the problem without noting the equilibrium selection issue.

  **5. Analogy (Newcomb/Commitment) (4 Points)**
  *   **Criteria:** Connects the belief-action correlation to Newcomb or the lack of binding to Commitment. Uses the analogy to illuminate the mechanism (correlation/causality split), not just as a label.
  *   **Common Fumble:** Name-dropping "Newcomb" without explaining the structural parallel (common cause linking choice and state).
