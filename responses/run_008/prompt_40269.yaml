prompt: |-
  After a marathon argument with a friend — a die-hard Fodorian who thinks the systematicity and productivity of thought settle the matter — I've ended up defending a version of the language of thought hypothesis on which Mentalese is acquired rather than innate: the internal code's compositional structure is supposed to be an internalized distillation of public-language practice, something like a fossil of training rather than a precondition for it. My friend's sharpest point was that this looks circular — that acquiring a compositional code from linguistic input presupposes an antecedently compositional medium to represent the regularities being acquired — and I want to be ready for the refined versions of that objection. Next month I present this at a departmental seminar whose audience is mostly cognitive scientists of the connectionist and Bayesian-modeling persuasion, plus a couple of old-guard symbolists who will take my friend's side. Please prepare my Q&A sheet: the objections each faction will actually raise, phrased in their own vocabulary — the symbolists pressing the circularity worry and the prelinguistic-infant and animal-cognition cases, the connectionists asking why we need a code at all rather than a vector space with the right geometry, the modelers asking what acquisition claim is even testable — ordered by how much damage each would do; for each, give a two-minute reply and a note on where the reply is soft. Include the question I am hoping nobody asks.
