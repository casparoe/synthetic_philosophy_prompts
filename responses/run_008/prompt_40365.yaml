answer: |-
  You are right to be suspicious of the "closeness of proxy" explanation. It's the most common intuition about Goodhart's Law, but your list proves it wrong. GDP is a robust, macro-economically sound proxy for societal capacity, yet optimizing it feels dangerous. "Completed reads" is a noisy, easily manipulated behavioral signal, yet optimizing it made your writing sharper.

  If proxy strength isn't the variable, and "faking vs. working" isn't the variable, the distinction lies in **what gets sacrificed to move the number.**

  Here is the principle I would offer:

  ### The Principle of the Costly Residual

  **Goodhart's Law is only harmful when optimizing the metric requires sacrificing high-value aspects of the true goal that the metric fails to capture.**

  In systems thinking terms, every goal has a "captured" component (what the metric measures) and a "residual" component (what matters but isn't measured). When you apply pressure to a metric, agents will naturally trade the residual for the captured.
  *   **Benign Goodhart:** The residual is low-value, or optimizing the metric *improves* the residual as a side effect.
  *   **Malign Goodhart:** The residual is high-value, and optimizing the metric actively destroys it.

  This explains your paradoxes immediately.

  **Why "Completed Reads" feels good:**
  You gamed the metric (tighter intros, shorter paragraphs). But the "residual" you sacrificed—perhaps meandering prose or self-indulgent tangents—was low value. Meanwhile, the "captured" value (clarity, pacing, engagement) *is* a core component of "good writing." In this specific context, the metric and the goal were **complementary**. Moving the metric up pulled the goal up with it. The residual cost was negligible.

  **Why GDP feels bad:**
  GDP is a strong proxy, but the "residual" includes income distribution, environmental sustainability, and leisure time. These are extremely high-value components of "societal welfare." When governments optimize GDP under high pressure, they often achieve it by extracting natural capital or ignoring inequality. The residual cost is existential. The metric and the goal are **substitutes** at the margin.

  **Why Pressure Matters (Your Hunch):**
  You suspected pressure was a factor. It is, but only as an amplifier. Pressure forces the trade-off.
  *   **Low Pressure (Bike Challenge):** People swipe without biking. The residual (actual exercise) is sacrificed, but the stakes are low. It's a mild good.
  *   **High Pressure (Soviet Nails):** The quota was a matter of survival. The residual (useful nails) was 100% of the value. The trade-off was total.

