  ### Prediction: Police Clearance Rates

  A city starts grading police precincts on **case clearance rates** (the percentage of reported crimes that result in an arrest or closure).

  **The Prediction:** This will be **Malign Goodhart.**

  **The Mechanism:**
  1.  **The Metric:** % of cases cleared.
  2.  **The True Goal:** Public safety and justice.
  3.  **The Residual:** Truth, due process, and focusing resources on violent/hard-to-solve crimes.
  4.  **The Optimization:** Under pressure to hit the number, precincts will stop investigating complex crimes (rape, burglary, cold cases) because they lower the rate. They will focus on high-volume, low-complexity crimes (drug possession, traffic violations) where arrests are easy. Alternatively, they will "unfound" reports (reclassifying crimes as non-crimes) to remove them from the denominator.
  5.  **The Cost:** The "residual" (actual safety and justice) collapses even as the metric soars. Violent criminals remain free; trust in the system erodes.

  Because the residual value (justice/safety) is极高 (extremely high), this is a textbook disaster case, regardless of how well clearance rates *theoretically* proxy for police effectiveness.

