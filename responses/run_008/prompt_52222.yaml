answer: |-
  You have not reinvented the wheel, but you have identified a fracture line where three different wheels meet, and none of them roll smoothly across the junction. Your three observations map onto three distinct, often non-communicating domains in philosophy: the metaphysics of mind (intentionality), the aesthetics of fiction (truth in fiction), and the genealogy of meaning (structuralism/teleology).

  There is no single term that captures the triad because professional philosophy tends to silo these problems. However, I can give you the specific terminology for each part, explain where the standard accounts succeed and fail regarding your experience, and then offer a synthesis that respects the integrity of your observation.

  ### 1. The Lending: Derived vs. Original Intentionality

  **The Concept:** The distinction you describe in your first observation is formally known as **Derived Intentionality** versus **Original (or Intrinsic) Intentionality**.

  **The Standard Account:** This is the bread and butter of John Searle and Fred Dretske. The standard view holds that physical objects (books, maps, hard drives) have no "aboutness" on their own. They possess *derived* intentionality, borrowed from the mental states of agents who use or create them. You (the author) possess *original* intentionality; your brain states are about Vivian intrinsically (or so the argument goes). You lend this aboutness to the ink; the ink lends it to the reader.

  **Where It Fits:** This accounts perfectly for your first observation. It validates your intuition that the page is a borrower. It explains why a book left in a forest with no readers is not "about" anything until an interpreter arrives.

  **Where It Fails:** This framework hits a hard wall at your third observation. Searlean original intentionality relies on a biological bedrock (the brain's causal powers). It assumes there *is* an origin point that is not itself borrowed. If you trace your mental states upstream (to the train passenger, the photograph, the other novelists), Searle must insist that at some point, there was a biological organism whose neural states were original. If you suspect that *all* content is borrowed, you are drifting away from Searle and toward **Structuralism** or **Teleosemantics**.

  ### 2. The Loop: Normative Constraints and "The Autonomous Character"

  **The Concept:** Your second observation—the character dictating terms to the creator—is often discussed in **Philosophy of Art** under the heading of **Normative Constraints** or **Principles of Generation**. In cognitive science, it touches on **Simulation Theory**.

  **The Standard Account:** Philosophers like Kendall Walton (*Mimesis as Make-Believe*) and Peter Lamarque argue that once a fictional world is established, it generates its own internal logic. When you say "Vivian would not do this," you are not reporting a metaphysical fact about a ghost; you are reporting a violation of the *consistency constraints* of the game of make-believe you are playing.

  However, most philosophers treat the "character taking over" feeling as a psychological heuristic, not a metaphysical reality. They would call it a **cognitive shortcut**. You have built a complex model of Vivian in your head. To test a plot point, you run the model. If the model outputs "divorce," and you write "stay," you create cognitive dissonance. The "instruction" you feel is the friction of that dissonance.

  **Where It Fits:** This explains the mechanism of the loop without resorting to mysticism. It validates the *experience* of being governed by the character as a real experience of normative constraint.

  **Where It Fails:** It often dismisses the *phenomenology* you describe. You say you experience it as an "accurate report," not a metaphor. The standard philosophical account tends to be reductionist here: "It feels like she's telling you, but really you're telling yourself." It fails to capture the *directionality* you note: that the derived content (Vivian) has gained enough structural weight to govern the original content (your intent). This is a form of **Downward Causation**, where the higher-level pattern (the character's personality) constrains the lower-level components (your word choices). Philosophy of mind acknowledges downward causation in systems theory, but rarely applies it to the author-text relationship.

  ### 3. The Regress: The Death of the Origin

  **The Concept:** Your third observation—that tracing the chain upstream reveals only more borrowing—is the central thesis of **Post-Structuralism**, specifically Roland Barthes' **The Death of the Author**, and in analytic philosophy, **Teleosemantics** (Ruth Millikan).

  **The Standard Account:** Barthes argues that a text is a "tissue of quotations." There is no "original" genius originating meaning; the author is merely a space where prior cultural codes mix. This aligns with your suspicion that you are borrowing from the novelists you read.

  In analytic philosophy, **Teleosemantics** argues that mental content is defined by its *history of selection*. A belief is about X because it was selected for tracking X in your evolutionary or learning history. This implies your mental states are "derived" from the environment that shaped them. There is no "prime mover" of meaning, only a chain of causal history.

  **Where It Fits:** This dissolves the distinction between "originator" and "borrower." It validates your fear that the "Original Intentionality" of Part 1 might be an illusion. If your mind is shaped entirely by prior inputs (train passengers, books), then your "original" intentionality is just derived intentionality that has been internalized.

  **Where It Fails:** It creates a problem for Part 2. If the author is just a conduit for prior texts (Barthes), it becomes hard to explain the *normative authority* you feel Vivian has over *you*. If you are just a collage of influences, why does this specific collage generate a new, rigid constraint that feels like an external command? Post-structuralism often flattens the hierarchy so much that the specific *agency* of the character (the loop) gets lost in the soup of cultural text.

  ### The Synthesis: Where the Wheels Grind

  You asked for the shape of the territory. Here is the friction point:

  1.  **Philosophy of Mind** (Searle) insists on an **Origin** (Original Intentionality) to save the reality of consciousness.
  2.  **Philosophy of Language/Art** (Barthes/Walton) insists on the **Chain** (Intertextuality/Derived Meaning) to explain how communication works.
  3.  **Systems Theory** (Downward Causation) is required to explain the **Loop** (Part 2), but is rarely applied to fiction writing by philosophers.

  The reason you cannot find a single label is that philosophers generally refuse to hold all three truths simultaneously.
  *   If they accept Part 1 (Original Intentionality), they struggle with Part 3 (Infinite Regress).
  *   If they accept Part 3 (Everything is borrowed), they struggle to explain the authority in Part 2 (Why does *this* borrowed construct govern *me*?).
  *   If they accept Part 2 (The Loop), they often treat it as a psychological quirk rather than a semantic fact.

  ### A Proposed Carving: Recursive Normativity

  If I were to carve this phenomenon to fit your three observations, I would not use the term "Intentionality." I would use the concept of **Recursive Normativity**.

  Here is how you carve it:

  **1. The Substrate (Part 1):**
  Accept that all semantic content is **Derived**. There is no magical "Original Intentionality." Even your biological brain states are derived from evolutionary history and sensory input. The "Lending" is not a transfer of magic substance; it is the **encoding of constraints**. When you write "Vivian," you are encoding a set of rules for future behavior (yours and the reader's).

  **2. The Emergence (Part 2):**
  The "Loop" is not a metaphor; it is a **System State**. When the density of constraints (Vivian's history, voice, psychology) reaches a certain threshold, the system becomes **self-stabilizing**.
  *   *Early Draft:* You impose constraints on Vivian.
  *   *Late Draft:* Vivian imposes constraints on you.
  This is **Downward Causation**. The pattern (Vivian) becomes more stable than the process (Writing). To violate the pattern requires more energy (cognitive dissonance, rewriting) than to follow it. The "instructions" you receive are the path of least resistance through the constraint network you built. The "borrower issuing instructions" is simply the system achieving homeostasis.

  **3. The Chain (Part 3):**
  The "Origin" is not a point; it is a **Horizon**. You are correct that you never reach a prime mover. You are a node in a network of information. The distinction between "Original" and "Derived" is not a difference in *kind*, but a difference in **proximity**.
  *   *Original Intentionality* is just Derived Intentionality that is currently inside the skin boundary of the agent.
  *   *Derived Intentionality* is Original Intentionality that has crossed the skin boundary into ink or speech.
  The "regress" you fear is not a bug; it is the feature. Meaning is ecological, not atomic.

  ### Boundary Cases and Edges

  To test this carving, consider these edges:

  *   **The Boundary of the Loop:** When does the character stop governing you? When the constraint network is too loose (a sketch) or when you decide to break the character for thematic effect (metafiction). The "loop" exists only when you prioritize *consistency* over *control*.
  *   **The Boundary of Origin:** If an AI writes a story about Vivian, does it have Original Intentionality? Under Searle, no. Under Recursive Normativity, yes—if the AI's internal constraint network is dense enough that *it* is surprised by Vivian's choices and feels governed by them. The "feeling" of being governed is the marker of the loop, not the biology of the author.
  *   **The Boundary of Borrowing:** If you dream Vivian, is she borrowed? Yes, from your memory consolidation processes. If you hallucinate her? Yes, from misfiring neural patterns. The "chain" never breaks, but the *social* chain (readers) is what solidifies the normativity.

  ### Conclusion

  You are describing **Recursive Normativity within a Derived Intentional System**.

  *   **Part 1** is the recognition that intentionality is derived (encoding constraints).
  *   **Part 2** is the recognition that complex constraint systems exert downward causation (the loop).
  *   **Part 3** is the recognition that all constraints are historically contingent (no prime mover).

  Philosophy has the pieces, but it keeps them in separate boxes labeled "Mind," "Art," and "Language." Your experience as a novelist forces these boxes together. The "wheel" you are machining is the interface between **Semantics** (aboutness) and **Cybernetics** (feedback loops).

  The professionals carve "Original Intentionality" to protect the sanctity of the human mind. You have discovered that the sanctity lies not in the origin, but in the **resistance**. The moment the clay pushes back against the potter, the distinction between maker and made blurs. That resistance is not a superstition; it is the physical reality of the pattern you have created becoming dense enough to constrain its creator. That is the edge of the thing.
