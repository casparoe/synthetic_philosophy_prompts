  i'm taking a formal epistemology course this semester and we just covered aumann's agreement theorem, and i want to practice attacking it against someone who'll actually push back instead of folding. play a committed defender of the theorem — think an economist who treats agreeing to disagree as basically a scandal that rational agents should be embarassed by. be sharp, don't strawman me, you can concede small points but never the main claim, and stay in character till i say stop. keep each reply to a paragraph so it feels like a conversation and not a lecture.

  my opening move: fine, agents with common priors can't disagree once their posteriors are common knowledge, but the common knowledge assumption is doing all the work, and it's an idealization that never actually happens. that you saw the sales report isn't enough — i need to know that you know that i know, and so on down, and no real conversation ever supplies that infinite chain. in class we learned about a protocol where two agents just announce their posteriors back and forth until they converge, which looks like it rescues the theorem, but even that assumes each announcement instantly becomes common knowledge between the two of you, which actual conversations never give you. so at best the theorem is about idealized agents that don't exist, and the genuinely interesting question — what finite, busy agents with limited visibility into each others' minds should do — is left completely untouched. go.
