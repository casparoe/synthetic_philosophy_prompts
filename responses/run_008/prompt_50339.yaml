answer: |-
  You have identified a structural distinction that is indeed central to the literature, though it appears you may have missed the specific technical label that distinguishes the diachronic case from the synchronic one. The term you are looking for is a **Dutch Strategy**.

  While "Diachronic Dutch Book" is often used as a blanket label, the specific configuration you describe—where the bookie's moves are contingent on future evidence and the guaranteed loss exists only across the branches of a decision tree—is standardly termed a **Dutch Strategy**. This terminology was cemented by David Lewis (1999) and Brian Skyrms (1987) to distinguish it from the static "Dutch Book" used for the probability axioms.

  Below, I define this term precisely to match your structural intuition, address the "weakening" objection regarding precommitment, and map the boundaries of the phenomenon as they stand in current formal epistemology.

  ### 1. Terminology and Precise Definition

  There is a settled term for the configuration you describe. It is not merely a "diachronic book," but specifically a **Dutch Strategy**.

  **Definition:** A **Dutch Strategy** against an agent is a sequence of bets offered at different times, such that:
  1.  **Synchronic Fairness:** At each time $t_i$, every bet offered is fair (or favorable) according to the agent's credences at $t_i$.
  2.  **Contingency:** The availability or terms of later bets depend on the evidence the agent receives between $t_0$ and $t_1$ (i.e., the bookie's strategy branches on the world-state).
  3.  **Guaranteed Loss:** The net result of the entire sequence is a sure loss for the agent across all possible branches of the tree, regardless of which evidence is received or which world-state obtains.

  **What it Excludes:**
  *   **Synchronic Dutch Books:** A set of bets all available and acceptable at a single time $t_0$ with no contingency on future evidence.
  *   **Non-Contingent Diachronic Sequences:** A sequence of bets where the second bet is offered regardless of what evidence is learned. (If the second bet is offered no matter what, the vulnerability might stem from the agent's credences at $t_1$ alone, rather than the *transition rule* between $t_0$ and $t_1$).
  *   **Pragmatic Traps:** Scenarios where the agent is forced to bet against their will. A Dutch Strategy relies on the agent *voluntarily* accepting bets they deem fair.

  The distinction is not cosmetic. A synchronic book demonstrates an inconsistency in a single belief state. A Dutch Strategy demonstrates an inconsistency in a *policy* or *disposition* connecting belief states across time.

  ### 2. The Precommitment Objection: Plan vs. Act

  You recalled correctly that many authors regard the Dutch Strategy argument as weaker than the synchronic Dutch Book argument. This is standardly formulated as the **Precommitment Objection** (sometimes called the **Plan Objection**).

  **The Objection:**
  A synchronic Dutch Book shows that an agent's *current* credences are incoherent. A Dutch Strategy, however, only shows that an agent's *plan* to update is flawed.
  *   If an agent violates conditionalization, they are vulnerable to a Dutch Strategy *if* they precommit to their updating rule.
  *   However, if the agent does not precommit, but simply updates however they feel at $t_1$, they might avoid the specific bets the bookie planned to offer.
  *   Therefore, the argument proves that one ought to *plan* to conditionalize, but it does not strictly prove that it is irrational to *actually* update by some other rule at $t_1$ if one hasn't precommitted.

  **Standard Replies:**
  1.  **The Reflection Principle:** Bas van Fraassen (1984) and others argue that if you know now that you will update in a certain way later, your current credences should already reflect that. If you violate conditionalization, you violate the Reflection Principle, making you synchronically incoherent *now* regarding your future self.
  2.  **Dispositionalism:** Most epistemologists argue that rational agents *are* governed by updating rules (dispositions). If you lack a rule, you are arguably irrational for a different reason (capriciousness). If you have a rule that violates conditionalization, the Dutch Strategy shows that rule is pragmatically self-defeating.
  3.  **The "No-Loss" Condition:** A strong reply (associated with Lewis) is that the bookie does not need the agent to precommit. The bookie simply offers the first bet at $t_0$ and waits. At $t_1$, the bookie offers the second bet based on what actually happened. Since the agent's updating rule determines their $t_1$ credences, the agent *will* accept the second bet voluntarily. The "plan" is implicit in the agent's actual updating behavior.

  ### 3. Current Dialectic: Is it a Real Weakening?

  The consensus in contemporary formal epistemology is that the difference is a **real weakening**, which is why Dutch Strategy arguments have largely been superseded by **Accuracy-Dominance Arguments**.

  *   **Pragmatic vs. Epistemic:** Dutch arguments are pragmatic (about money/utility). Critics argue that rationality is about accuracy (truth), not avoiding financial loss. A Dutch Strategy shows you will lose money, but perhaps that's just bad luck in a hostile environment, not an epistemic flaw.
  *   **The Shift to Accuracy:** Authors like Jim Joyce (1998) and Richard Pettigrew (2016) have developed arguments showing that conditionalization is the *only* updating rule that minimizes expected inaccuracy (measured by proper scoring rules). These arguments are synchronic in nature (applied to the choice of rule) and do not rely on the branching tree structure of a Dutch Strategy. Consequently, many graduate seminars now treat Dutch Strategies as heuristic or historical, while treating Accuracy arguments as the primary justification for conditionalization.

  ### 4. Boundaries of the Phenomenon

  You asked about the edges of this phenomenon, specifically regarding opt-outs and Sleeping Beauty cases.

  **Refusing the Second Bet (The Opt-Out Problem):**
  If the agent sees the bookie's strategy coming, can they simply refuse the second bet?
  *   **Standard Constraint:** A valid Dutch Strategy assumes the agent is a "taker" of bets at their own fair odds. If the agent knows they are being Dutch Booked, they should update their credence that "a bookie is trying to exploit me," which changes the odds.
  *   **Resolution:** The literature generally assumes the bookie is indistinguishable from a normal market or that the bets are small enough that the agent doesn't suspect a trap. If the agent can opt out, the strategy fails. This is why the argument relies on the agent's *credences* mandating the bet acceptance, not external coercion. If the agent's credences change *because* they see the bookie, the bookie must account for that in the strategy (leading to complex fixed-point problems).

  **Sleeping Beauty and Self-Locating Belief:**
  Does this cover one-shot setups like Sleeping Beauty?
  *   **Structural Difference:** In the classic Sleeping Beauty betting scenarios (e.g., Elga 2000), the "tree" is often collapsed. The agent is offered the *same* bet multiple times, but due to memory loss, it *feels* like one time.
  *   **Classification:** These are often called **Synchronic Dutch Books against Self-Locating Beliefs**. They do not strictly require a *diachronic* updating rule violation in the standard sense, but rather a violation of how credences map to centered worlds.
  *   **Verdict:** While they share the "guaranteed loss" feature, they are usually categorized separately from Conditionalization Dutch Strategies because the vulnerability arises from self-location and memory loss, not necessarily from a failure to conditionalize on evidence over time. However, some authors (like Hitchcock) do analyze them using Dutch Strategy frameworks.

  ### Summary for Your Seminar

  1.  **Label:** The term is **Dutch Strategy**. Use this to distinguish it from the static **Dutch Book**.
  2.  **Weakening:** Yes, it is generally regarded as a real weakening. It targets *policies* rather than *states*, and relies on pragmatic rather than purely epistemic norms.
  3.  **Objection:** The **Precommitment Objection** claims it only binds agents who plan ahead. The standard reply is that rational agents necessarily have dispositions that function as plans.
  4.  **Current Status:** The field has largely moved toward **Accuracy-Dominance** arguments to avoid the pragmatic vulnerabilities and structural complexities of Dutch Strategies.
  5.  **Boundaries:** The phenomenon requires that the agent *must* accept the bets based on their credences. If they can opt out upon seeing the strategy, the book fails. Sleeping Beauty cases are structurally related but often classified separately due to self-locating belief complications.

  If you need a term for the *structure* itself (the tree) rather than the argument, **"contingent betting tree"** is descriptive, but **"Dutch Strategy"** is the canonical label for the argumentative configuration you identified.
