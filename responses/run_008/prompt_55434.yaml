prompt: |-
  my comparative religion prof keeps insisting that buddhist ethics is just consequentialism with the currency swapped out: instead of maximizing pleasure you minimize suffering, all the precepts are rules of thumb for producing the best outcomes, and she half-jokingly calls the buddha the first utilitarian. the analogy does a lot of work in her lectures — it's how she explains why monks are vegetarian-ish, why lay ethics emphasizes harmlessness, all of it as suffering-minimization applied consistently. i'm skeptical but all i've got is vibes, so help me actually audit the thing.

  give me the mapping first: suffering as negative utility, karma as... what exactly, the bodhisattva as the maximizing altruist, the precepts as rule-consequentialist rules, and whatever else slots in. then tell me where it breaks. a few things i keep chewing on: karma seems to track the agent's intention more than the outcome of the act, which is the opposite of what you'd expect from a consequentialist; the tradition never really aggregates across persons as far as i can tell (each being works out its own liberation, it's not a sum being maximized); and the no-self doctrine seems to quietly gut the whole utilitarian structure — if there are no discrete selves, what is the "greatest number" even counting? also nirvana isn't obviously a state you can put in a ledger alongside other states.

  so: which parts of the analogy are doing real work, which break it, which of the breakages would a defender of the prof's reading concede versus argue around (i suspect she'd say intention matters only because it's the best predictor of future suffering), and does the "first utilitarian" conclusion survive once you've put all this on the table? and if the analogy fails, is there a better one — like is buddhist ethics closer to virtue ethics, or to something that doesn't map onto any western framework cleanly? also i've heard people say the consequentialist reading is basically a modern western reconstruction and that older commentaries would find it bizarre — is that fair? sorry this is rambly, mostly i want to know how much of my skepticism is actually justified.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a student in a comparative religion class. Their professor argues that Buddhist ethics is essentially consequentialism (specifically utilitarianism) with "suffering" replacing "pleasure."
      *   **User's Stance:** Skeptical. Has "vibes" but wants a rigorous audit.
      *   **Specific Requests:**
          1.  Map the analogy (Suffering = Negative Utility, Karma = ?, Bodhisattva = ?, Precepts = ?, etc.).
          2.  Identify where the analogy breaks (Intention vs. Outcome, Aggregation, No-Self, Nirvana).
          3.  Evaluate the breakages: Which would a defender concede/argue around?
          4.  Verdict: Does "First Utilitarian" survive?
          5.  Alternative Frameworks: Virtue ethics? Something else?
          6.  Historical Validity: Is this a modern Western reconstruction?
      *   **Tone:** Academic but accessible, rigorous, nuanced (avoiding binary right/wrong), acknowledging the professor's point while validating the user's skepticism.

  2.  **Deconstruct the Professor's Claim (The Consequentialist Reading):**
      *   *Core Argument:* Buddhism aims to end suffering (*dukkha*). Actions are judged by their capacity to reduce suffering. Therefore, it's consequentialist.
      *   *Strengths:* Teleological structure (goal-oriented), emphasis on *ahimsa* (non-harm), pragmatic nature of precepts.
      *   *Weaknesses:* Metaphysical underpinnings (karma, rebirth, anatta), role of intention (*cetana*), soteriological goal (nirvana vs. worldly welfare).

  3.  **Drafting the Mapping (Part 1):**
      *   *Suffering (Dukkha):* Negative Utility.
      *   *Nirvana:* The optimal state (zero utility? transcendence of utility?).
      *   *Karma:* Causal mechanism / Moral accounting (but not exactly utility calculation).
      *   *Cetana (Intention):* The act itself (crucial distinction).
      *   *Precepts (Sila):* Rule-consequentialist heuristics.
      *   *Bodhisattva:* Maximizing altruist (utilitarian agent).
      *   *Compassion (Karuna):* The motivating force (similar to impartial benevolence).

  4.  **Analyzing the Breakages (Part 2 & 3):**
      *   *Intention (Cetana):* This is the biggest hurdle. In Utilitarianism, a well-intentioned act that fails is morally neutral or less significant than the outcome. In Buddhism, *cetana* is karma. If I try to kill but miss, I still generate bad karma. *Counter-argument:* Professor might say intention predicts future suffering. *Rebuttal:* Buddhism treats intention as *constitutive* of the moral act, not just predictive.
      *   *Aggregation:* Utilitarianism sums happiness across persons. Buddhism focuses on individual liberation (Theravada) or universal liberation (Mahayana), but the metaphysics of "persons" is shaky.
      *   *No-Self (Anatta):* If there's no self, who suffers? Who maximizes? Utilitarianism requires discrete units of experience to sum. Buddhism deconstructs the unit.
      *   *Nirvana:* Is it a "state" of happiness? No, it's the cessation of craving. It's incommensurable with worldly utility.
      *   *Agent-Relative Duties:* Monks have different rules than laypeople. Utilitarianism is usually impartial.

  5.  **Evaluating the "First Utilitarian" Claim (Part 4):**
      *   Does it survive? Partially, as a *heuristic* for lay ethics, but fails as a comprehensive meta-ethical description.
      *   It's a "family resemblance" but not an identity.

  6.  **Alternative Frameworks (Part 5):**
      *   *Virtue Ethics:* Focus on character transformation, cultivating *paramitas* (perfections), becoming an Arhat/Buddha. This fits well.
      *   *Care Ethics:* Emphasis on relationships and compassion.
      *   *Soteriological Ethics:* Ethics subordinate to liberation, not just welfare.
      *   *Damien Keown's View:* He argues strongly for Virtue Ethics in Buddhism.
      *   *Charles Goodman:* He argues for Consequentialism (specifically in Mahayana). It's a live academic debate.

  7.  **Historical Validity (Part 6):**
      *   Is it a modern reconstruction? Yes, largely. Classical commentaries focus on purity, karma, and liberation, not "maximizing global welfare." The "Universal" scope is often more Mahayana-specific and even then, framed differently.

  8.  **Synthesizing and Refining:**
      *   *Structure:* Follow the user's requested flow (Mapping -> Breakages -> Defender's Rebuttal -> Verdict -> Alternatives -> Historical Context).
      *   *Nuance:* Acknowledge that different schools (Theravada vs. Mahayana) differ. The professor's view fits Mahayana (Bodhisattva) better than Theravada (Arhat).
      *   *Key Scholars:* Mention Damien Keown (Virtue) and Charles Goodman (Consequentialism) to show this is a real academic debate, not just classroom speculation.
      *   *Tone Check:* Ensure I'm not just saying "Prof is wrong." The prof's view is a recognized interpretive stance (Consequentialism), but it's contested. Validate the user's skepticism as philosophically sound.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I initially thought about saying Karma is "Utility Ledger." But Karma is causal, not just accounting. Better to describe it as "Moral Causality."
      *   *Correction:* On No-Self. Utilitarianism (especially hedonistic) doesn't *need* a substantial self, just experiences. But Buddhism denies the *aggregation* of experiences into a "greater good" in the same way. Need to be precise here.
      *   *Emphasis:* Make sure to highlight the distinction between *worldly welfare* (utilitarian) and *liberation* (Buddhist). This is the category error.

  10. **Final Polish:** Check against all constraints in the prompt. (Mapping, Breakages, Defender's Concession, Verdict, Alternatives, Historical Context). Ensure the "vibes" are translated into philosophical terms. (Proceed to generate output).

  *(Self-Correction Note: Make sure to mention the distinction between Theravada and Mahayana, as the Bodhisattva ideal makes the consequentialist reading more plausible than the Arhat ideal.)*

  *(Final Plan:)*
  1.  **The Mapping:** Create a clear table/list.
  2.  **The Fault Lines:** Deep dive into Intention, Aggregation, No-Self, and Nirvana.
  3.  **The Defense:** How the prof would counter.
  4.  **The Verdict:** Is the Buddha the first Utilitarian?
  5.  **Better Fits:** Virtue Ethics & Soteriological Ethics.
  6.  **Historical Context:** Modern reconstruction vs. traditional exegesis.
  7.  **Conclusion:** Validate the user's skepticism.

