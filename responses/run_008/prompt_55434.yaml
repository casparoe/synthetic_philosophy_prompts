answer: |-
  This is a fantastic prompt because it touches on one of the liveliest debates in contemporary Buddhist ethics. Your professor is championing a view most notably associated with philosopher Charles Goodman (who argues Mahayana ethics is consequentialist), while your skepticism aligns closely with scholars like Damien Keown (who argues it is virtue ethics).

  Your "vibes" are actually philosophically robust objections. Here is the audit you asked for.

  ### 1. The Mapping: Buddhism as Utilitarianism

  To give your professor her due, here is the strongest possible charitably reconstruction of her analogy.

  | Utilitarian Concept | Buddhist Equivalent | Function in the System |
  | :--- | :--- | :--- |
  | **Negative Utility** | **Dukkha (Suffering/Unsatisfactoriness)** | The disvalue to be minimized. |
  | **Positive Utility** | **Sukha (Happiness/Well-being)** | The value to be maximized (provisionally). |
  | **The Good** | **Nirvana / Cessation of Dukkha** | The ultimate telos (end goal). |
  | **Moral Agent** | **The Bodhisattva** | The ideal actor who sacrifices self-interest for the whole. |
  | **Moral Rules** | **The Precepts (Sila)** | Heuristics for minimizing harm (Rule-Consequentialism). |
  | **Causal Mechanism** | **Karma** | The law of moral cause-and-effect ensuring outcomes align with actions. |
  | **Motivation** | **Karuna (Compassion)** | Impartial benevolence toward all sentient beings. |
  | **Ethical Framework** | **Upaya (Skillful Means)** | Flexibility to break rules if it reduces suffering (Act-Consequentialism). |

  **Where the analogy does work:**
  *   **Teleology:** Both systems are goal-oriented. You don't follow precepts because God said so; you follow them because they *work* to end suffering.
  *   **Impartiality:** Buddhism demands compassion for all beings, not just kin or tribe, similar to the utilitarian "each counts for one."
  *   **Pragmatism:** The Kalama Sutta ("don't believe just because... test it like gold") sounds very empirical and consequentialist.

  ### 2. The Fault Lines: Where the Analogy Breaks

  Your intuitions here are correct. The structural mismatches are significant.

  **A. Intention (Cetana) vs. Outcome**
  *   **The Break:** In classical Buddhism, *cetana* (intention) **is** karma. If you accidentally step on an insect, you generate negligible bad karma. If you *try* to kill a person but miss, you generate heavy bad karma. In Utilitarianism, the accidental death is a tragedy (bad outcome), and the failed murder is morally neutral (good outcome).
  *   **The Professor's Counter:** She would argue intention matters only instrumentally: malicious intentions lead to future suffering, so we condemn them to prevent future bad outcomes.
  *   **The Rebuttal:** This reduces intention to a prediction tool. In Buddhism, intention is *constitutive*. The moral quality inheres in the volition itself, regardless of the external result. This is deontological or aretaic (virtue-based), not purely consequentialist.

  **B. Aggregation and the "Greatest Number"**
  *   **The Break:** Utilitarianism requires summing utility across persons ($Person A's joy + Person B's joy = Total Good$). Buddhism generally treats karma as individualized (you reap what you sow). While a Bodhisattva works for all beings, they cannot "transfer" karma to balance the ledger. There is no "social welfare function" in Buddhism.
  *   **The Professor's Counter:** Mahayana ethics emphasizes the salvation of *all* beings, implying a collective good.
  *   **The Rebuttal:** Even in Mahayana, liberation is individual. I cannot attain Nirvana for you. The goal is to help everyone attain *their own* cessation, not to maximize a aggregate pool of "happiness units."

  **C. No-Self (Anatta) and the Counter**
  *   **The Break:** Utilitarianism needs a "subject of experience" to hold the utility. If there is no self, who is suffering? Peter Singer (a utilitarian) can talk about "preferences" or "pain" without a soul, but Buddhism goes further: the *aggregation* of experiences into a "society" is also a construct.
  *   **The Professor's Counter:** Suffering is real even if the self is empty. We minimize the real phenomenon of pain.
  *   **The Rebuttal:** If the self is empty, the distinction between "my suffering" and "your suffering" is ultimately conventional, not ultimate. This actually undermines the utilitarian calculus, which relies on counting discrete units of experience. If there are no discrete units, you can't count them.

  **D. Nirvana is Incommensurable**
  *   **The Break:** Utilitarianism trades off lesser goods for greater goods (e.g., a painful dentist visit for long-term health). Nirvana is not a "greater good" on the same scale as worldly happiness; it is the *exit* from the scale. You cannot trade "some suffering" for "a bit of Nirvana."
  *   **The Professor's Counter:** Nirvana is the ultimate cessation of negative utility.
  *   **The Rebuttal:** Nirvana is often described as unconditioned. Utility is conditioned. You cannot maximize the unconditioned.

  ### 3. Would a Defender Concede?

  A sophisticated defender (like Charles Goodman) would concede the **Theravada** (monastic/individual liberation) model is *not* consequentialist. They would argue that **Mahayana** (Bodhisattva path) *is*.

  *   **Concession:** They would admit that for the layperson or the Arhat, virtue ethics fits better.
  *   **Argument Around:** They would argue that the Bodhisattva is permitted to break precepts (kill, lie, steal) *if* it saves more beings from suffering. This is "Act-Consequentialism." There are Jataka tales where the Buddha, in a past life, kills a man to prevent him from committing mass murder (and thus saving the killer from hell).
  *   **Weakness:** Even here, the motivation must be pure compassion, not a cold calculation. If the calculation is wrong, the karma is still bad. In Utilitarianism, if you calculate wrong but act on the best data, you are morally blameless. In Buddhism, if you kill based on a miscalculation, you still bear the karmic weight.

  ### 4. The Verdict: Is the Buddha the First Utilitarian?

  **No.** The conclusion does not survive the audit.

  The "First Utilitarian" claim is a **category error**.
  *   **Utilitarianism** is a political and social ethics designed for organizing societies and maximizing worldly welfare.
  *   **Buddhist Ethics** is a **soteriological** ethics designed for individual and universal *liberation* from existence (samsara).

  Your professor is conflating "welfare" (feeling good/safe) with "liberation" (waking up/cessation). A utilitarian wants everyone to have full bellies and long lives. A Buddhist monk might view a long life as merely more time to accumulate karma and suffer. The telos is different.

  ### 5. Is There a Better Analogy?

  Yes. Your skepticism points toward two better frameworks:

  **1. Virtue Ethics (The Keown Model)**
  *   **Focus:** Not "what should I do?" but "what kind of person should I become?"
  *   **Mapping:** The Precepts are not rules for outcomes, but training wheels to cultivate *paramitas* (perfections) like generosity, patience, and wisdom.
  *   **Fit:** This handles the *Intention* problem perfectly. Killing is wrong because it expresses greed/hatred/delusion, which corrupts the character, regardless of the outcome.
  *   **Fit:** This handles *Nirvana*. Nirvana isn't a "state of happiness" to be maximized; it is the flowering of perfect virtue/wisdom.

  **2. Moral Particularism / Skillful Means (Upaya)**
  *   **Focus:** Ethics is contextual and non-codifiable.
  *   **Fit:** There are no universal rules, only "skillful" actions appropriate to the specific context to guide a being toward awakening. This resists Western categorization entirely.

  ### 6. Historical Validity: Is this a Modern Reconstruction?

  **Yes, largely.**

  *   **Traditional Commentaries:** Classical Theravada commentaries (like the *Visuddhimagga*) focus on purity, defilement (*kilesa*), and the mechanics of karma. They do not speak of "maximizing the good."
  *   **Modern Reconstruction:** The consequentialist reading gained traction in the 20th century as Buddhist modernists tried to make Buddhism compatible with Western secular humanism and science. Framing the Buddha as a "rational utilitarian" makes him palatable to modern liberals.
  *   **The "Protestant Buddhism" Effect:** Scholars like Richard Gombrich argue that modern Western Buddhism often strips away the "magic" (karma, rebirth, cosmology) and leaves an ethical core that *looks* like utilitarianism because we've projected our own values onto it.

  ### Summary for Your Audit

  Your skepticism is justified.
  1.  **The Mapping:** Works superficially for lay ethics (don't kill because it causes pain).
  2.  **The Breakage:** Fails on metaphysics (No-Self), moral accounting (Karma = Intention), and the ultimate goal (Nirvana $\neq$ Utility).
  3.  **The Professor's Defense:** Relies on a specific reading of Mahayana "Skillful Means," but ignores the karmic cost of miscalculation.
  4.  **Better Fit:** Virtue Ethics (cultivating character) or Soteriological Ethics (ethics subordinate to liberation).
  5.  **History:** The Utilitarian reading is a modern Western projection, not a traditional exegesis.

  **How to push back in class:**
  Ask her: *"If a monk accidentally causes a disaster while trying to help, Utilitarianism says the act was wrong because the outcome was bad. Buddhism says the karma depends on the intention. If the moral value lies in the intention, isn't that non-consequentialist by definition?"*

  That question targets the engine of the system. If she says intention matters *only* because it predicts outcomes, she reduces Buddhism to psychology. If she says intention matters *intrinsically*, she concedes it isn't pure consequentialism.
