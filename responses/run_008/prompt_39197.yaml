answer: |-
  # Joint Statement on the Structure of Rational Credence

  **Signatories:** [Precise Bayesian] & [Imprecise Probabilist]
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on Formal Epistemology

  ### 1. Agreed Claims
  Both signatories endorse the following claims. These represent the empirical and methodological common ground required to proceed.

  1.  **Empirical Regularity:** In Ellsberg-type scenarios, a robust majority of subjects violate the Sure Thing Principle (e.g., preferring Bet A over B, but D over C). Both parties agree this behavior is stable and reproducible.
  2.  **Representational Capacity:** Both the precise Bayesian framework (augmented with non-linear utility or risk weights) and the imprecise probability framework (sets of functions) can formally represent the observed Ellsberg choices. The dispute is not about fit, but about normative justification and parsimony.
  3.  **Against Psychoanalytic Bayesianism:** The Precise Signatory concedes that asserting "a sharp credence exists but is inaccessible" is a metaphysical posit, not an argument. Without behavioral evidence for a specific number, claiming it exists solely to preserve the sharp model is unmotivated.
  4.  **Sequential Decision Burdens:** The Imprecise Signatory concedes that imprecise frameworks face significant challenges in sequential decision-making. Specifically, the recommendation to resolve incomparability via randomization (e.g., flipping a coin) introduces a sharp probability (0.5 on the coin) and risks dynamic inconsistency. This is a legitimate vulnerability requiring resolution.
  5.  **Evidence and Change:** Both agree that evidence should constrain credence. We disagree on whether evidence *must* converge to a sharp number (Precise) or may legitimately maintain or widen imprecision (Imprecise).

  ### 2. Residual Disagreements
  We disagree on the normative interpretation of the claims above. Neither side attributes simple confusion to the other; we disagree on the requirements of rationality.

  | Issue | Precise Bayesian Position | Imprecise Probabilist Position |
  | :--- | :--- | :--- |
  | **Normative Status of Ellsberg Choices** | Violating the Sure Thing Principle is irrational. Observed choices reflect performance errors or conflated risk-attitudes, not rational responses to ambiguity. | Violating the Sure Thing Principle is permissible. It reflects a rational distinction between risk (known probabilities) and ambiguity (unknown probabilities). |
  | **Nature of Credence** | Credence is fundamentally a sharp betting quotient. Any rational agent is committed to a specific number for every proposition. | Credence is fundamentally a doxastic state that may be indeterminate. Commitment to a set of functions is complete; no hidden sharp number exists. |
  | **Dilation (Widening Intervals)** | Dilation upon learning is a defect (bug). Learning should reduce uncertainty, not increase it. | Dilation is a feature. It honestly represents situations where learning relevant evidence highlights prior ignorance. |

  ### 3. Cruxes and Predictions
  We identify two specific cruxes where future work could shift credences. We specify predictions and adjudicating data below.

  **Crux A: Dilation as Bug or Feature**
  *   **The Case:** Consider a scenario where learning a partition member (e.g., a specific coin toss outcome) widens the credal interval for a hypothesis compared to the prior.
  *   **Precise Prediction:** Agents who exhibit dilation behavior will demonstrate lower overall decision utility in sequential tasks compared to agents who force sharpening. Dilation correlates with cognitive error.
  *   **Imprecise Prediction:** Agents who exhibit dilation will avoid Dutch Books in adversarial environments where sharp agents are exploited. Dilation correlates with robustness.
  *   **Adjudicating Data:** Experimental data comparing cumulative payoff in sequential betting markets between "dilation-accepting" and "dilation-avoiding" agents under adversarial conditions.

  **Crux B: Ambiguity vs. Risk Attitudes (The Ellsberg Explanation)**
  *   **The Case:** Two-urn switching behavior (preferring known probabilities over unknown).
  *   **Precise Prediction:** Switching behavior is fully absorbable into sharp probabilities plus standard risk-aversion parameters. Controlling for risk aversion will eliminate the "ambiguity aversion" effect.
  *   **Imprecise Prediction:** Switching behavior persists even when controlling for risk aversion. People who switch are not just risk-averse; they are ambiguity-averse in a way sharp models cannot capture without ad hoc adjustments.
  *   **Adjudicating Data:** Psychometric measures of risk aversion correlated with Ellsberg choices. If the correlation is perfect, the Precise view wins. If significant variance remains unexplained by risk attitudes, the Imprecise view wins.

  **Crux C: Stability of Incomparability**
  *   **The Case:** An agent faces incomparable options and flips a coin to choose.
  *   **Precise Prediction:** This move reveals the agent actually holds a sharp credence (0.5) in the coin toss governing the choice, proving sharpness is inescapable in action.
  *   **Imprecise Prediction:** This move is a pragmatic tie-breaker, not a doxastic commitment. The agent remains imprecise about the primary option; the coin is merely a tool, not a revelation of hidden sharpness.
  *   **Adjudicating Data:** Introspective reports and consistency checks. If agents treat the coin outcome as binding evidence for future decisions (updating on the coin), the Precise view is supported. If they treat it as a one-off tool without downstream doxastic impact, the Imprecise view is supported.

  ### 4. Verbal Dispute Check
  We suspect a portion of our dispute is verbal, centering on the term **"credence."**

  *   **The Suspicion:** The Precise Signatory often uses "credence" to mean *disposition to bet at specific odds*. The Imprecise Signatory uses "credence" to mean *degree of doxastic commitment*.
  *   **Why It Matters:** If credence is defined as betting disposition, the Precise view is tautologically true (you either bet or you don't). If credence is defined as doxastic commitment, the Imprecise view is plausible (one can be committed to a range).
  *   **Resolution Strategy:** We will distinguish *behavioral commitment* (betting) from *doxastic state* (belief) in all future drafts. If our disagreement persists after this distinction, it is genuine. If it vanishes, we have dissolved the problem.

  ### 5. Commitment
  We agree to treat deviations from our predictions as evidence against our respective positions. We will not redefine terms to accommodate negative results.

  **Signed:** ____________________ (Precise) ____________________ (Imprecise)
