      *   *Ethical Analysis:* If the patient is lucid and choosing the pain for the meaning, it's not "torture" (which is imposed). It's "sacrifice" or "endurance."
      *   *Conclusion:* The patient isn't confused. The user's principle applies to *imposed* suffering, not *chosen* suffering for meaning.

