answer: |-
  # Joint Statement on Population Ethics: Areas of Agreement, Disagreement, and Empirical Cruxes

  **Date:** October 24, 2023
  **Parties:** Proponent of the Asymmetry (PA) and Proponent of the Total View (PT)
  **Subject:** Resolution of Saturday Evening Dispute regarding Procreation, Value, and Identity

  ## 1. Agreed Claims

  We, the undersigned, acknowledge that while we diverge on the normative implications of creating new lives, we share a common conceptual framework. We agree to the following propositions as the baseline for further inquiry:

  1.  **The Neutral Baseline:** There exists a threshold of well-being distinguishing a "life worth living" from a "life not worth living." A life is "worth living" if the subject's existence contains a net balance of positive welfare such that, were they asked, they would prefer existence to non-existence.
  2.  **The Miserable Life Constraint:** Both parties agree that it is morally wrong to bring into existence a person whose life will predictably be *not* worth living (i.e., a life of net suffering). We agree this judgment is grounded in the interests of that specific person.
  3.  **The Structure of Non-Identity Cases:** We agree on the factual structure of Parfit's Non-Identity Problem (e.g., the 14-year-old girl case): certain choices determine *which* specific individual comes to exist, such that the alternative choice would have resulted in a *different* individual, not the same individual with a different quality of life.
  4.  **The Repugnant Conclusion Definition:** We agree on the definition of the "Repugnant Conclusion": the implication that for any population of very happy people, there is a much larger population of lives barely worth living that constitutes a better outcome (given sufficient size).
  5.  **The Relevance of Intuition:** We agree that while moral intuitions are fallible and subject to bias, a theory that systematically violates robust, pre-theoretical moral intuitions (such as the wrongness of causing misery or the lack of obligation to maximize population) bears a burden of proof to explain why those intuitions are mistaken.
  6.  **Existence is not a Commodity:** We agree that "bringing someone into existence" is categorically different from "helping someone who already exists." We agree that standard terminology regarding "benefit" and "harm" requires careful qualification when applied to non-existent subjects.

  ## 2. Table of Residual Disagreements

  | Issue | Proponent of the Asymmetry (PA) | Proponent of the Total View (PT) |
  | :--- | :--- | :--- |
  | **The Symmetry of Reasons** | Moral reasons are asymmetric. The presence of pain gives us a reason to avoid creating a person; the presence of pleasure does *not* give us a reason of the same kind to create a person. | Moral reasons are symmetric. If pain makes an outcome worse, pleasure must make an outcome better. To deny this is arbitrary and lacks a principled distinction. |
  | **The Status of Potential People** | Non-existent people have no interests. We cannot owe duties to "possible people" to bring them into existence. Value is grounded in the welfare of actual, identifiable subjects. | Potential people count morally. The value of an outcome is determined by the sum of well-being of all people who exist in that outcome, regardless of their identity relative to other outcomes. |
  | **The Non-Identity Implication** | In Non-Identity cases, if the resulting child has a life worth living, we cannot say the act was wrong *for the child's sake*. This limits our ability to condemn certain choices, which is a feature, not a bug, of person-affecting morality. | In Non-Identity cases, we can still say the act was wrong because it produced a *worse outcome* impersonally. The fact that the child is not "harmed" relative to non-existence does not exonerate the choice. |
  | **The Repugnant Conclusion** | The Repugnant Conclusion is a *reductio ad absurdum*. Any theory implying it is false. A world of flourishing individuals is strictly better than a world of vast, mediocre existence, regardless of the sum. | The Repugnant Conclusion is counter-intuitive but true. Our intuition fails to grasp large numbers. If the total sum of happiness is higher, the outcome is better, even if individual quality is lower. |
  | **The "Incoherence" Objection** | The objection fails because "harm" (making someone worse off) is possible, but "benefit" (making someone better off than they would be) is not possible for non-existent beings. Non-existence is not a state of zero welfare; it is no state at all. | The objection holds. If a miserable life adds negative value to the world, a happy life must add positive value. To treat the absence of pain as good but the absence of pleasure as neutral is mathematically and ethically inconsistent. |

  ## 3. The Cruxes

  We identify the following sub-questions as the pivotal points of our dispute. Settling these would significantly alter our confidence in our respective positions. For each, we propose a specific thought experiment and register our predictions.

  ### Crux 1: The "Missing Out" Intuition
  **Question:** Does the non-existence of a happy person constitute a loss of value for the universe, or merely the absence of a gain?
  **Case:** *The Magic Button.* You have a button. Pressing it creates a new, distinct person who will live a perfectly happy life (80 years, net positive welfare) without affecting anyone else's welfare. Not pressing it leaves the world exactly as is.
  **Argument:** Does pressing the button make the world *better*, or merely *not worse*?
  **Predictions:**
  *   **PT Prediction:** Pressing the button makes the world *better*. Failing to press it is a missed opportunity for value creation.
  *   **PA Prediction:** Pressing the button makes the world *neither better nor worse* (axiologically neutral), though it is permissible. Failing to press it is not a moral failure.
  **Resolution Condition:** If PA admits the world is *better* with the child, Asymmetry collapses into Totalism. If PT admits the world is *neutral*, Totalism collapses into Asymmetry.

  ### Crux 2: The Non-Identity Wrongness
  **Question:** In Non-Identity cases, is the wrongness of a choice dependent on the harm to the specific individual, or on the impersonal value of the outcome?
  **Case:** *The Risky Policy (Parfit).* A society chooses a policy that depletes resources, causing a future generation to have a lower quality of life (though still worth living). Had they chosen a safe policy, a *different* generation would have existed with a higher quality of life.
  **Argument:** Is the choice wrong *because* the future people have lower welfare, even though they would not exist otherwise?
  **Predictions:**
  *   **PT Prediction:** The choice is wrong because the outcome contains less total well-being. The identity of the people is irrelevant to the value of the outcome.
  *   **PA Prediction:** The choice is *not* wrong for the sake of those future people (since they are not harmed). If it is wrong, it must be for reasons unrelated to their welfare (e.g., virtue of the agents), because person-affecting constraints block the judgment.
  **Resolution Condition:** If PA concedes the act is wrong *for the sake of the welfare difference*, they must accept impersonal value. If PT concedes the act is *not* wrong because no one is harmed, they must accept person-affecting restrictions.

  ### Crux 3: The Repugnant Threshold
  **Question:** Can quantity of life ever outweigh quality of life?
  **Case:** *The Sliding Scale.* Compare Population A (1 billion people, extremely happy) to Population Z (100 trillion people, lives barely worth living). We vary the quality of Z slightly upward in successive iterations.
  **Argument:** Is there *any* amount of Z-lives that makes Z better than A?
  **Predictions:**
  *   **PT Prediction:** Yes. Given a large enough multiplier, the sum of Z will exceed A. The intuition that A is better is a cognitive bias regarding large numbers.
  *   **PA Prediction:** No. There is a lexical threshold of quality. No amount of "barely worth living" lives can outweigh a population of "flourishing" lives.
  **Resolution Condition:** If PA accepts a trade-off is possible at some point, they move toward Totalism. If PT accepts a lexical threshold where quantity no longer counts, they move toward Asymmetry/Average views.

  ## 4. Note on Verbal Disputes

  We acknowledge that a portion of our Saturday dispute was likely verbal, specifically regarding the application of the terms **"Benefit"** and **"Harm."**

  *   **The Dispute:** PT argued that if creating a miserable person is "bad for them," creating a happy person must be "good for them." PA rejected this, claiming one cannot be "good for" someone who does not exist.
  *   **Resolution:** We agree this is a semantic divergence regarding the **Baseline of Comparison.**
      *   **PT Usage:** "Benefit" means "adds positive value to the outcome containing the person."
      *   **PA Usage:** "Benefit" means "improves the state of a subject relative to their prior or alternative state."
  *   **Why it matters:** Since non-existence is not a state a subject occupies, the PA claims the "alternative state" comparison fails. The PT claims the "outcome value" comparison holds.
  *   **Agreement:** We agree to stop using the phrase "benefit to the non-existent" without qualification. Future arguments will distinguish between **"Person-Affecting Value"** (better/worse for X) and **"Impersonal Value"** (better/worse simpliciter). The substantive disagreement is not about the word "benefit," but about whether Impersonal Value has moral weight independent of Person-Affecting Value.

  ***

  **Signed:**

  _________________________ (Proponent of the Asymmetry)

  _________________________ (Proponent of the Total View)
