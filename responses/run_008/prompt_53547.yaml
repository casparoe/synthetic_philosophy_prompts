  *Interpretation:* The user (Asymmetrist) is arguing that the Total View implies counter-intuitive permissions or obligations in NIP cases (perhaps that we *must* create the child with the lower welfare if it increases total sum, or that the specific harm to the child is erased). I need to capture this nuance. Actually, the standard move is: Asymmetrist says "Total View loses grip on *who* is harmed." I will frame the crux around whether impersonal value captures our moral concern.

