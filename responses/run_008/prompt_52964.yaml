prompt: |-
  I'm a PhD student in philosophy working on measurement and fairness in machine learning, and I'm preparing a paper on what formal results can and cannot settle in public controversies about algorithmic bias. The episode I want analyzed is the 2016 standoff between ProPublica and Northpointe over the COMPAS recidivism risk score. As I assume you know the broad facts: ProPublica examined several thousand defendants from Broward County, Florida, and reported that among defendants who did not go on to reoffend, Black defendants were nearly twice as likely as white defendants to have been labeled high risk, while among those who did reoffend, white defendants were more likely to have been labeled low risk. Northpointe's rebuttal was that the score is calibrated within each racial group: a given risk level carries roughly the same probability of rearrest for Black and white defendants alike. Both sides stood by their numbers, and the exchange was widely read either as a scandal or as a confusion.

  I want this episode analyzed through the lens of the impossibility results in algorithmic fairness — the family of theorems from around 2016–17 showing that when the base rate of the outcome differs between groups, no risk score can be simultaneously calibrated within groups and equal across groups in its error rates; the two conditions are compatible only in degenerate cases, such as perfectly accurate prediction or identical base rates. Please do the mapping carefully and in both directions. In one direction: state precisely what each side measured, show that the two published findings are exactly the two conditions the theorem says cannot coexist, and explain why the theorem predicts that the dispute would not be resolved by better data or a better score — so that the standard public reading, on which one side must simply have been wrong, is itself a misreading of the situation. In the other direction, be candid about where the theorem is silent or distorts: it takes the label and the score as given, so it says nothing about the choice of ground truth (rearrest serving as a proxy for recidivism, which imports differential policing into the label itself), nothing about which of the two fairness conditions is normatively preferable, and nothing about the institutional question of who should decide which condition a vendor is obligated to satisfy. Close with your assessment of what the episode shows about the theory: whether this is a case of the theory illuminating a public controversy better than the biased-algorithm framing did, or a case where the controversy outran what the theorem could adjudicate — and say plainly if you think it is partly both.

  Two constraints: no reading list, no citations, and no invented references — I want the reasoning, not a bibliography. And if you believe I have misdescribed any part of the episode or the theorem, correct me directly rather than working around it.
