  **FOR IMMEDIATE RELEASE**
  **FBEI RECALL NOTICE #2024-EX-09**

  **WASHINGTON** — The Federal Bureau of Explanatory Integrity (FBEI) today announced a limited voluntary recall of the conceptual tool "Emergence," specifically the 2023-2024 Academic & Pop-Science Edition. The recall affects units deployed in departments of Neuroscience, Complex Systems Theory, and Philosophy of Mind.

  The defect involves the premature termination of causal inquiry. While the term is certified for use as a descriptor of unexpected macro-level behaviors resulting from micro-level interactions (e.g., liquidity, phase transitions), consumers have reported using the token "It's emergent" as a complete causal explanation rather than a placeholder for ignorance. When deployed correctly, the tool signals that a system's behavior is surprising but derivable in principle from its constituent parts (Weak Emergence). However, defective units are functioning as "Strong Emergence" modules, claiming irreducibility in principle. The FBEI has determined that Strong Emergence units are functionally indistinguishable from Vitalism with the theology filed off and pose a risk to logical coherence.

  **Affected Models and Uses**
  The recall applies to all instances where "Emergence" is used to reconcile the contradictory claims that "everything is nothing but atoms" and "the whole is more than the sum of its parts." Users who assert both propositions simultaneously without engaging the Supervenience Latch may experience cognitive dissonance or spontaneous dualism.

  Acceptable uses include describing traffic patterns, ant colonies, or the wetness of water. Defective uses include invoking emergence to explain consciousness, moral realism, or why the lab budget disappeared, specifically when no mechanism is offered to bridge the micro-macro gap.

  **Reported Malfunctions**
  In reported incidents, the term creates a "Black Box Shield." When pressed for underlying mechanisms, the device emits phrases such as "downward causation" or "novel properties" without transferring explanatory power. This prevents researchers from identifying the actual gears turning inside the system. In severe cases, the term has been used to justify granting tenure.

  **Instructions to Consumers**
  The FBEI advises all researchers to immediately cease using "Emergence" as a noun. It is not a substance; it is a relationship.
  1. **Inspect your usage:** If you can simulate the outcome from the bottom up, your unit is safe (Weak). If you claim the outcome cannot be simulated even by God, your unit is defective (Strong).
  2. **Check your Supervenience:** Ensure the safety latch is engaged. If higher-level states do not covary with lower-level states, do not pass Go.
  3. **Replace the Token:** Substitute "It emerges" with "We have not yet identified the mechanism." This patch may cause temporary feelings of humility but restores scientific integrity.

  **Remedy**
  Consumers may return defective conceptual frameworks to the nearest University Press for reprocessing into "Open Problems." Alternatively, users may install the "Mechanism TBD" update, which forces the term to function as a question mark rather than a period.

  **Safety Statement**
  To date, the FBEI has received no reports of physical injuries. However, several graduate students have reported bruised egos and prolonged thesis delays. While no minds have been permanently lost to obscurantism, the Bureau warns that continued reliance on defective Strong Emergence units may result in the spontaneous generation of Deepities.

  Consumers seeking clarification on the difference between "surprising complexity" and "magic" should contact the FBEI helpline at 1-800-555-REDU.

