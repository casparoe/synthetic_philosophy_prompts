      *   **Key Players:** Ian Carter & Matthew Kramer (critics saying it's just nuanced non-interference) vs. other critics (saying it smuggles in positive liberty) vs. Pettit (concedes some terminological overlap but insists on the distinctness of the *ideal*).
      *   **User's Hypothesis:** The disagreement stems from different criteria for individuating concepts: *extensional* (which states of affairs count as unfreedom) vs. *theoretical role* (what work the concept does/explaining badness of arbitrary power).
