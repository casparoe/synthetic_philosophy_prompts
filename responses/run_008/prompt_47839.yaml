answer: |-
  Your working hypothesis is exceptionally sharp, and I suspect it diagnoses the stalemate more accurately than most of the contributions to the debate itself. You have identified that the interlocutors are often talking past one another because they are operating with divergent meta-philosophical commitments regarding how political concepts ought to be individuated.

  Here is a diagnosis of the dispute, an assessment of the criteria in play, and a suggestion for what constitutes genuine progress in your chapter.

  ### 1. Diagnosis: Metalinguistic Negotiation or Substantive Disagreement?

  To answer your primary question: this is neither a *merely* verbal dispute nor a purely substantive one about the world. It is best characterised as a **metalinguistic negotiation**.

  When Kramer and Carter argue that non-domination collapses into a refined version of non-interference, they are employing an **extensional criterion** for concept individuation. They ask: 'Do the set of situations labelled "unfree" by the republican differ significantly from the set labelled "unfree" by the negative liberal?' If the answer is 'no' (because one can simply expand the definition of interference to include threats and probabilities), they conclude the concepts are identical. For them, conceptual parsimony is a virtue; if two labels cover the same ground, one is redundant.

  Conversely, when Pettit and his defenders argue for distinctness, they are employing a **functional or theoretical-role criterion**. They ask: 'Does this concept pick out a specific normative harm that explains our political intuitions better than the rival?' They are less concerned with the boundary of the extension and more concerned with the *explanation* of the value. For them, explanatory power is the virtue.

  Therefore, the disagreement is substantive insofar as it concerns *how we should carve up the normative landscape*, but it appears verbal because it is fought over the label 'liberty'. If Kramer were to say, 'I accept the ideal of non-domination but call it "security"', and Pettit replied, 'I accept the extension of negative liberty but call it "non-interference"', the substantive disagreement might vanish, but the taxonomic dispute would remain. The dispute persists because the label 'liberty' carries lexical priority in liberal theory; to claim your concept is *the* concept of liberty is to claim a privileged position in the justification of state action.

  ### 2. Which Criteria are in Play?

  Both of your criteria are actively in play, but they are distributed unevenly across the literature.

  *   **The Extensional Criterion:** This dominates the work of the Cambridge School of analytical political theory (Kramer, Carter, Steiner). They treat liberty as a measurable quantity, akin to a physical dimension. Their methodology is atomistic and combinatorial. They are looking for logical consistency and clear boundaries. In their view, if a concept cannot be defined without remainder against its rivals, it is suspect.
  *   **The Role-Based Criterion:** This is Pettit's home ground, though he does not always frame it as a meta-philosophical methodological choice. When Pettit invokes the 'eyeball test' (the ability to look others in the eye without fear), he is not describing an extension of interference; he is describing a *status*. This aligns with your 'theoretical role' criterion. The concept is individuated by the work it does in securing a specific type of social relationship.

  The reason the debate has not moved since the 1990s is that the extensionalists view the role-based approach as conceptually sloppy (smuggling in values under the guise of definition), while the role-based theorists view the extensionalists as normatively blind (capturing the letter of freedom but missing the spirit).

  ### 3. The Weight of Pettit's Concession

  You ask whether Pettit's concession—that some of the dispute is terminological—leaves anything of philosophical importance contested. It absolutely does.

  If Pettit concedes that non-domination is merely a *conception* of negative liberty (or a subset thereof), he risks losing the **lexical priority** of the republican ideal. In traditional negative liberty frameworks, non-interference can be traded off against other goods (security, welfare). If non-domination is just a sensitive form of non-interference, it becomes one value among others to be weighed in a utilitarian calculus.

  However, if non-domination is a *distinct concept* individuated by its role (protecting status rather than measuring constraint), it can claim a deontological constraint that trumps mere calculations of interference. Pettit's concession is tactical: he yields the linguistic battle to win the normative war. But the contested remainder is **structural**. It matters whether the law protects you *because* you were interfered with, or *because* your status as a non-dominated person was violated, even if no interference occurred. The former leads to remedial justice; the latter leads to constitutional design. Thus, the individuation criterion determines the institutional implications.

  ### 4. What Counts as Progress?

  Given this diagnosis, a stipulative convention would be a retreat. It would amount to saying, 'Let us agree to disagree on the label,' which leaves the theoretical friction unresolved. A worked-out case study is necessary but insufficient; the 'benevolent master' thought experiment is already well-trodden ground, and both sides have entrenched interpretations of it.

  The most fruitful path for your thesis—and what would constitute genuine progress—is **an argument that one criterion of concept individuation is the right one for political philosophy's purposes.**

  You should argue that the extensional criterion, while logically tidy, is ill-suited for *political* concepts. Political concepts are not natural kinds; they are tools for social critique and institutional design. Therefore, they should be individuated by their **theoretical role** (your second criterion).

  To demonstrate this, you do not need a new case where the verdicts differ (the benevolent master suffices for that). Instead, you need to show why the *explanation* of the verdict matters.
  *   **Step 1:** Show that the extensional view forces us to describe the benevolent master scenario in a way that obscures the political harm (e.g., by stretching 'interference' to include 'risk', we lose the distinction between natural risk and political domination).
  *   **Step 2:** Argue that the role-based view preserves a crucial distinction between *misfortune* and *injustice*. Negative liberty (extensional) often struggles to distinguish between being unable to fly (physics) and being unable to leave (law). Republican liberty (role-based) distinguishes between being constrained by nature and being subject to a will.
  *   **Step 3:** Conclude that because political philosophy is concerned with justice and power relations rather than metaphysical constraints, the role-based criterion is the correct methodological tool.

  ### Summary for Your Chapter

  Your chapter should pivot from asking 'Is non-domination distinct?' to asking 'What makes a concept of liberty distinct?'

  1.  **Validate your hypothesis:** Explicitly frame the Kramer/Carter vs. Pettit debate as a clash between extensional and functional individuation.
  2.  **Critique the Extensionalists:** Argue that their demand for logical parsimony sacrifices normative salience. They win the dictionary battle but lose the political war.
  3.  **Defend the Functionalists:** Argue that Pettit is right to prioritise the 'work' the concept does. The distinctness of non-domination lies not in a new set of unfree actions, but in a new explanation of why those actions (or potentials) are objectionable.
  4.  **Final Verdict:** The dispute is not merely verbal. It is a methodological disagreement about whether political theory should mimic the precision of analytics metaphysics or the nuance of social critique. Progress lies in defending the latter.

  This approach allows you to respect the analytical rigour of the critics while vindicating the republican intuition, moving the debate forward by addressing the meta-philosophical roots of the stalemate.
