  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Kramer/Carter Position:* They are analytical legal/moral philosophers. They tend to favour precise definitions. Their argument is often that if you define interference broadly enough (including threats, probability of interference), non-domination fits within the negative liberty framework. They focus on the *extension* of the concept (when is an agent unfree?).
      *   *The "Positive Liberty" Critique:* If non-domination requires non-arbitrariness, and non-arbitrariness depends on tracking interests or proper status, isn't that a form of self-realisation or positive liberty? This focuses on the *conditions* of freedom.
      *   *Pettit's Position:* He distinguishes between the *concept* of liberty (what the word means) and the *conception* (how it is instantiated). He often argues that even if the extensions overlap significantly, the *explanation* of why something is unfree differs. For negative liberty, it's the interference; for republicanism, it's the *capacity* to interfere arbitrarily.
      *   *The User's Insight:* The distinction between individuating by extension vs. theoretical role is sharp. This aligns with methodological debates in analytic political philosophy (e.g., Freeden's morphology vs. analytic conceptual analysis).

  3.  **Drafting the Diagnosis (Task 1 & 2):**
