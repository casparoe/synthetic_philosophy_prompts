      2. Severity 1: (1) & (2).
      3. Severity 2: (1) & (6).
      4. Severity 3: (4) & (5).
      5. The Fix.

      *Checking the (1) & (3) tension:* Normativity. Deflationists can handle norms (assertion rules). I'll skip this as less severe.

      *Checking the (2) & (4) tension:* Realism about science, expressivism about morals. This is standard naturalism. No tension.

      *Final Polish:* Ensure tone is constructive but critical.

