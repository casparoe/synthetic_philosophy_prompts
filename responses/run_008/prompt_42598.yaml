answer: |-
  ### The theorem in my terms

  Think of $N$ agents, each defined by a loss function $L_i(\theta)$ over lotteries (probability distributions on outcomes). The vNM axioms assert that each agent minimizes expected loss consistently: $L_i(P) = \mathbb{E}_{x \sim P}[l_i(x)]$. Crucially, each $L_i$ suffers from gauge freedom: it is identifiable only up to a positive affine transformation, $L_i' = a_i L_i + b_i$ with $a_i > 0$. Rescaling changes the numerical value but not the preference ordering.

  Route 1 (Pareto): Define a social loss $L_{soc}$. If $L_{soc}$ satisfies the same consistency axioms and respects Pareto efficiency (if $L_i$ decreases for all $i$, $L_{soc}$ decreases), then $L_{soc}$ must be a linear ensemble: $L_{soc} = \sum w_i L_i + C$, with $w_i \geq 0$. The theorem proves the architecture is a weighted sum, but the weights $w_i$ are unidentified hyperparameters. The math forces linearity, not equality.

  Route 2 (Impartial Observer): You occupy an "original position" behind a veil of ignorance. You minimize expected loss assuming your identity is a random variable $I \sim \text{Uniform}(1, N)$. This imposes a symmetry prior on the weights, forcing $w_i = w_j$. The social loss becomes the mean loss: $L_{soc} = \frac{1}{N} \sum L_i$.

  The controversy isn't the linearity; it's the weights. Route 1 leaves $w_i$ completely free; Route 2 fixes them via a symmetry prior, but that prior is an external assumption, not derived from the loss landscape itself. In ML terms, Harsanyi proves the optimal ensemble is linear, but cannot determine the learning rates for each task without importing external bias. The "equal weights" conclusion relies entirely on the uniform prior over identities, which is an ethical choice disguised as a probabilistic assumption.

  ### What translates cleanly

  The linear aggregation maps perfectly to multi-task learning or ensemble methods. The Pareto condition is identical to Pareto dominance in optimization: no objective worsens without another improving. The vNM axioms translate cleanly to the requirement that losses behave linearly under mixtures of data distributions. If your model minimizes expected loss consistently across distributions, you satisfy the premises. The mathematical structure—linear functionals on a convex set of probabilities—is identical to how we derive risk minimizers in statistical learning theory. The proof mechanics are just convex analysis.

  ### What gets distorted

  Here is where the translation strains. In ML, choosing $w_i$ is often a hyperparameter tuning problem or a normalization convention (e.g., balancing gradient magnitudes). We treat scale differences as numerical artifacts to be fixed for convergence. In Harsanyi, the scale $a_i$ in $L_i' = a_i L_i + b_i$ represents preference intensity. Setting $w_i = 1$ isn't just picking a unit; it asserts that one unit of "pain" for agent A equals one unit for agent B. Your intuition that this is an identifiability issue is correct, but calling it a "convention" understates the ethical load. In ML, normalization is instrumental; here, it is constitutive of the ethics. The theorem doesn't identify the weights; it hides the ethical choice inside the normalization step. You cannot "normalize away" the inequality without asserting that the agents are comparable scales to begin with.

  ### What has no expression in my vocabulary at all

  Diamond's objection has no native expression in standard ERM (Empirical Risk Minimization). Consider a batch of size 2. Option A: Loss vector $[1, 0]$. Option B: Loss vector $[0.5, 0.5]$. Both sum to 1. Standard ML sees these as identical costs. Diamond argues society prefers B (fairness) or perhaps a lottery over assignments that gives ex-ante equality. ML loss functions aggregate scalars; they discard the index $i$ after summation. To capture Diamond, you need a loss function over the *distribution* of losses across the batch, not just the mean. You'd need to penalize the variance of $[L_1, \dots, L_N]$ explicitly. Standard optimization vocabulary assumes exchangeability of samples; Diamond requires treating sample IDs as semantically meaningful features, which breaks the IID assumption fundamental to most learning theory. The framework is blind to who bears the risk, only seeing the aggregate risk.

  ### Where the residue lives

  The residue lives in the treatment of "identity." ML treats data points as exchangeable draws from a distribution; social choice treats individuals as distinct entities with claims. When you minimize mean loss, you marginalize over identity. Harsanyi tries to recover identity via the Impartial Observer, but mathematically, it just reintroduces the uniform prior. The residue isn't necessarily a blind spot in your vocabulary; it's a feature. Optimization is designed to ignore identity to find global minima. Social choice is often about protecting identity from the global minimum. The vagueness isn't in the math, but in whether "society" is an optimizer or a constraint satisfier. Your vocabulary assumes the former; the critics argue for the latter.

  ### Calibration

  I am highly confident (90%+) that the Sen/identifiability translation is faithful; the affine freedom is exactly the interpersonal comparison problem. I am less sure (70%) about the Diamond translation. Diamond's original argument involves ex-ante fairness vs. ex-post utilitarianism in lotteries, which maps to risk preferences over loss distributions, but I might be flattening his distinction between "fairness of procedure" and "fairness of outcome." Also, I may be attributing too much "rights-based" language to Diamond; he focuses on social evaluation functions, not necessarily deontological rights. If you read Sen directly, be warned: his "capabilities approach" is much harder to map to scalar losses than his critique of welfarism. Least sure point: Whether Diamond's objection is purely about risk aversion (which ML can model) or about a fundamental incomparability of outcomes that rejects the scalar loss abstraction entirely.
