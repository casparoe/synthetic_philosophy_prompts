prompt: |-
  You're a professional moral philosopher with serious interests in decision theory and animal ethics, and I want you to actually think hard about this rather than reflexively defend expected-value maximization or reflexively mock it.

  So: I teach intro ethics, and last week a student asked whether it's wrong to swat a mosquito, and I realized my own views on insect suffering are basically incoherent. Rather than figure them out myself like a sucker, I'm handing you my gut verdicts and asking what principle, if any, captures them.

  - I swat the mosquito on my arm without a second thought. Whatever the probability it's sentient, it doesn't get anywhere near stopping me.
  - But the kid down the block torturing ants with a magnifying glass is doing something wrong — and I mean wrong *to the ants*, not just building bad character.
  - I'd exterminate a roach infestation in my mother's apartment without hesitation, even knowing the body count could be big.
  - Driving at dusk, I kill plenty of insects and feel basically nothing about it, and I would not detour twenty minutes to avoid a swarm over the road. Though maybe I'd feel a flicker of guilt, I'm not sure that's more than performance.
  - I buy regular flour even though grain storage and milling kill enormous numbers of insects per loaf, but I'd genuinely pay a dollar or two more for lower-impact flour if it existed.
  - If a charity could prevent something like the insect equivalent of a factory farm — trillions of animals, very uncertain sentience — for ten dollars, I think I'm obligated to give, even though no individual insect seems to matter much to me intuitively.

  The obvious move is the scale argument: low probability of sentience, but numbers so vast the expected value swamps it anyway. And I can feel my verdicts resisting that move in some places (the mosquito, the flour) and demanding it in others (the charity, maybe the kid). The mosquito and the ant-torturing kid seem to pull in exactly opposite directions, since the numbers are on the ants' side but my confidence that the exterminator does something wrong is way lower than my confidence that the kid does.

  So: is there one principle, or a small set, that gets all of these or close to it? Brainstorm a little before committing — at least consider that some of my verdicts are pure status-quo bias, and that the guilt-vs-action gap is doing illegitimate work. Then state the principle(s) precisely, tie each clause to the case that motivates it, tell me honestly which of my verdicts doesn't survive, and give me its verdict on a case I haven't listed: spraying my garden in a way that takes out pollinators along with the pests, where I know roughly how many of each die.

  Keep the whole thing under 600 words — I'd rather have a tight, committal answer than an exhaustive hedge-fest.
