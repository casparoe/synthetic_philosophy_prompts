answer: |-
  There is no single, canonical proper noun for this move (like "The Veil of Ignorance" or "The Categorical Imperative"). In the academic literature, it is standardly referred to descriptively as **"The Intrapersonal/Interpersonal Analogy"** or **"The Prudential Analogy."**

  However, because you want a precise tool for debate that captures the logical structure rather than just the subject matter, I recommend coining and using the term:

  ### **The Aggregation Symmetry Thesis (AST)**

  Here is the breakdown of the term, its commitments, its boundaries, and how it interacts with the "Separateness of Persons" objection.

  ---

  ### 1. Definition and Scope
  **The Aggregation Symmetry Thesis (AST)** is the claim that the moral principles governing trade-offs *between* persons (interpersonal) should be structurally identical to the principles governing trade-offs *within* a single life over time (intrapersonal).

  *   **The Core Claim:** If it is rational/permissible to aggregate costs and benefits across time-slices of a single life (e.g., enduring a headache now for a greater benefit later), it is morally permissible to aggregate costs and benefits across distinct persons (e.g., imposing a cost on A for a greater benefit for B).
  *   **The Boundary Cases:**
      *   **Positive AST:** The Utilitarian move you described (Intrapersonal rationality justifies Interpersonal morality).
      *   **Negative AST:** The Rawlsian/Nozickian mirror move (Interpersonal distinctness forbids what Intrapersonal rationality allows).
      *   **Scope:** AST covers both the *metaphysical* version (persons are no more distinct than time-slices) and the *normative* version (even if persons are distinct, the logic of weighing should be the same).

  ### 2. What AST Commits You To (and What It Doesn't)
  This is where the online loop usually gets stuck. People conflate the metaphysical support for AST with the normative claim itself.

  **It DOES commit you to:**
  *   **Structural Isomorphism:** You must believe the *formula* for decision-making is the same in both cases. If you maximize net good in one, you must maximize net good in the other.
  *   **The Irrelevance of Boundaries (conditionally):** You are committed to the view that the boundary between persons is not, in itself, a *moral* stop-sign. It might be a physical fact, but it doesn't change the math of value.

  **It DOES NOT commit you to:**
  *   **Parfitian Reductionism:** This is the most common misconception. You can accept AST without believing that "persons don't really exist." A philosopher can believe persons are deeply distinct metaphysical entities but still argue that *morality* requires us to treat them as a single container of value (e.g., a theistic utilitarian might believe souls are distinct but God commands us to maximize total good).
  *   **The Denial of Compensation:** AST does not inherently deny that compensation matters. However, it implies that if compensation isn't required in the intrapersonal case (I don't "compensate" my future self, I just *am* them), it shouldn't be a veto in the interpersonal case.

  ### 3. The Parfitian Loophole (The "Reductionist Who Rejects AST")
  You asked: *Where does it leave someone who accepts the Parfit-style view about identity but still doesn't buy the analogy?*

  This is a valid and established philosophical position. It breaks the loop by separating **Metaphysics** from **Moral Status**.

  *   **The Position:** One can agree with Parfit that personal identity is "less deep" (just psychological connectedness) but still argue that **claims** are held by "person-stages" that cannot be merged.
  *   **Key Proponents:** Michael Otsuka and Alex Voorhoeve (specifically in their paper *"Why It Matters That Some Are Worse Off Than Others"*).
  *   **The Argument:** Even if I am just a bundle of experiences, the experiences *now* are united in a single consciousness. Your experiences are united in *your* consciousness. Even if the "I" is shallow, the *separateness of consciousness* is real. Therefore, a loss to my consciousness cannot be canceled by a gain to yours, even if a loss to my Tuesday can be canceled by a gain to my Friday.
  *   **Why it matters for you:** If your opponent uses Parfit to support AST, you can reply: *"Parfit reduces the depth of identity, not the separateness of claims. Reductionism explains why I care less about my distant future, but it doesn't explain why I should sacrifice my future for your present."*

  ### 4. How AST Hooks into "Separateness of Persons"
  The "Separateness of Persons" (Rawls) is the direct negation of AST.

  *   **AST says:** The distinction between Person A and Person B is morally analogous to the distinction between Time 1 and Time 2.
  *   **Rawls says:** Society is not a super-individual. Utilitarianism makes the mistake of **"extending the principle of choice for one man to society."**
  *   **The Crucial Disanalogy (The Loop-Breaker):**
      *   **Intrapersonal:** When I suffer now for a benefit later, the *same entity* that suffers also receives the benefit. This is **Compensation**.
      *   **Interpersonal:** When Person A suffers for Person B's benefit, the entity that suffers does *not* receive the benefit. This is **Sacrifice without Compensation**.
      *   **The Utilitarian Reply to this:** "Compensation is irrelevant; only the existence of the pain and the pleasure matters."
      *   **The Anti-Utilitarian Reply to that:** "Then you are treating persons as mere vessels for utility, which violates their status as agents."

  ### 5. Strategic Advice for the Debate
  Since you want to stop the loop, stop arguing about whether the analogy *holds* (it never will, because one side values Sums and the other values Distribution). Instead, name the move and force them to defend the specific commitment.

  **Use this script:**
  > "You are relying on **The Aggregation Symmetry Thesis**. You're arguing that because intrapersonal trade-offs are rational, interpersonal ones must be moral.
  >
  > But that thesis only works if you think **Compensation** is irrelevant. In the intrapersonal case, the sufferer is compensated by the later benefit. In the interpersonal case, they aren't.
  >
  > So, do you defend AST because you think persons are metaphysically identical to time-slices (Parfit), or because you think compensation doesn't matter even if persons are distinct? If it's the first, I can be a Reductionist and still reject you (Otsuka). If it's the second, you're admitting you don't care about who bears the burden, only the total sum."

  **Summary for your toolkit:**
  *   **Standard Name:** The Intrapersonal/Interpersonal Analogy (or Prudential Analogy).
  *   **Coined Name:** The Aggregation Symmetry Thesis (AST).
  *   **The Counter:** The Compensation Objection (Intrapersonal = Compensation; Interpersonal = Sacrifice).
  *   **The Escape Hatch:** Reductionism about Identity does not entail AST (see Otsuka/Voorhoeve).

  Using **AST** allows you to isolate the specific logical step they are taking, rather than getting bogged down in the general "Utilitarianism is creepy" swamp. It forces them to defend the symmetry specifically, rather than hiding behind general consequentialist intuitions.
