answer: |-
  **Activity: Preference Tribunal**

  **Procedure:** 14 students form one appellate court. 75 minutes total. 10 min briefing on Registrar's criteria (stability, information, instrumentality, origin). 50 min deliberation (10 min/case). 15 min debrief.
  **Decision Rule:** Majority vote Uphold (Preference) or Overturn (Bias).
  **Scoring:** "Precedent Points." +1 for matching the philosophical key (revealed in debrief). Top scorer earns "Chief Justice" seminar role next week. No money involved.

  **Vignettes:**

  1.  **The Manic Poet:** Elara petitions for silence. She admits this preference vanishes during depressive episodes where she craves noise. Currently stable, she argues her calm self is her true self. The Registrar certifies this as a Preference, citing current reflective endorsement despite historical instability.
  2.  **The Glitch Gamer:** Kenji demands recognition for winning via code errors. He knows this violates design norms and ruins others' experience, yet enjoys the exploit authentically. The Registrar strikes this as Bias, citing irrationality and disregard for shared constitutive rules of the practice.
  3.  **The Ascetic's Hunger:** Prior Thomas claims a preference for hunger. He states this is solely a tool to reach holiness, not good in itself. He would eat if it didn't block salvation. The Registrar certifies Preference, citing voluntary endorsement of the state regardless of intrinsic value.
  4.  **The Omati Scarification:** The Omati prefer facial cutting. Outsiders see pain; Omati see ancestral connection. A youth wants it, knowing the pain, to join the lineage. The Registrar strikes this as Bias, citing harmful cultural conditioning and irreversible bodily modification imposed by tradition.
  5.  **The Memory Editor:** Leo prefers deleting traumatic memories. He knows this alters his identity narrative but prefers the peace. Registrar certifies Preference, citing immediate welfare over narrative continuity.

  **Debrief Map:**

  1.  Defeats *Stability*: Preference shifts with mood, yet current self endorses it.
  2.  Defeats *Informed/Rationality*: Known violation of norms, yet authentically chosen.
  3.  Defeats *Non-instrumental*: Purely instrumental end, yet deeply held.
  4.  Defeats *Independence*: Culturally produced, yet constitutive of identity. Forces students to judge unfamiliar norms.
  5.  Defeats *Continuity*: Preference alters the self that holds it.

  **Limitation:** The activity lacks *stakes*. Students play with hypotheticals; real preferences involve visceral commitment and consequence absent here. We simulate logic, not lived pressure or emotional cost. The "court" setting abstracts away the bodily and social risks inherent in actual preference formation, potentially making the distinction seem more tidy than it is in practice.

  **Self-Assessment:** Confidence: 85%. Least sure: Timing. 10 minutes per case for 14 students to debate may run long, risking the debrief depth. I worry students will linger on the Omati case due to cultural sensitivity, compressing the philosophical analysis of the other vignettes. I may need to act as a strict timekeeper to ensure the mapping discussion occurs.
