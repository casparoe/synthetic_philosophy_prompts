      Effective immediately, the Office of Intergenerational Settlement will cease all consultative procedures regarding policies impacting persons born after 2050. This decision follows a comprehensive review of standing ethical frameworks, specifically the nonidentity problem. It has been determined that engaging with contingent entities presents insurmountable ontological and administrative difficulties. The following Frequently Asked Questions clarify the operational implications of this update.

      **Q: Why was the Citizens' Assembly for 2100 cancelled?**

      A: The Assembly was predicated on the assumption that specific future citizens could be identified to represent future interests. However, any policy adopted today alters the timing and manner of conceptions downstream. Consequently, the specific individuals who would populate the year 2100 under a green policy are not identical to those who will exist under a depletion policy. Since the attendees of the proposed Assembly do not currently exist, and their identities are contingent upon the very policies they were summoned to critique, convening the body was deemed logically incoherent. We cannot consult constituents whose existence is dependent on the outcome of the consultation.

