answer: |-
  In the Bermeo typology, the term "executive" is potentially misleading in parliamentary systems like Hungary's, where the prime minister and the legislative majority are fused rather than separated. The theory does not strictly assume presidentialism, but Hungary stretches the label because the instrument of aggrandizement was not presidential decree but a legislative supermajority used to rewrite the rules of the game from within the parliament. Functionally, however, the Fidesz leadership acted as a unitary executive authority, utilizing the 2010 two-thirds mandate to bypass the need for opposition consensus, thereby fitting the core logic of an elected leader weakening constraints even if the technical vehicle was statutory rather than fiat.

  The checks weakened were distinct in mechanism and timing, contradicting any notion of a uniform assault. The Constitutional Court was neutered first through jurisdiction limits and forced retirements (legalistic purging), while the Media Council was captured through appointment rules (administrative stacking), and the electoral system was gerrymandered later via cardinal laws (structural manipulation). These were not weakened at the same rate; the constitutional overhaul was rapid, completed in roughly eighteen months, while the electoral map changes solidified over the full four-year cycle. This challenges the descriptor "gradual," suggesting that "legalistic rapidity" is more accurate than "incrementalism," yet it remains a boundary case rather than a fatal anomaly because the *method* remained within formal legal channels, distinguishing it from the sudden usurpation of a coup.

  Regarding the EU response, the episode vindicates the analytic utility of the typology while embarrassing the practical toolkit available to Western institutions. By correctly identifying the process as legal backsliding rather than a coup, the theory explained why traditional sanctions failed: treaty mechanisms were designed for clear breaches or accession conditions, not for a member state legally eroding democracy from within. This reveals that the typology was not merely a partisan label but a diagnostic tool that highlighted a gap in international law, showing that the concept of "legal, incremental" backsliding was analytically sound even if the political response was paralyzed by the very legality the framework identified.

  On the question of "who decides" between ordinary politics and backsliding, the aggrandizement framework offers a non-question-begging answer by focusing on reversibility and asymmetry. The distinction lies not in the popularity of the mandate but in whether the changes preserve the possibility of future accountability; ordinary politics allows for turnover, whereas aggrandizement creates structural advantages that make losing power nearly impossible. Hungary's use of a temporary supermajority to lock in permanent advantages—entrenching party loyalists in courts and media beyond the electoral cycle—crosses the line from policy victory to systemic capture.

  Hungary constitutes executive aggrandizement because the ruling party utilized a democratically acquired legislative supermajority to legally dismantle institutional checks and entrench power rather than seizing authority through extra-constitutional force.
  Verdict: executive aggrandizement
