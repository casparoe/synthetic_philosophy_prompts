  **1. The Scenario**
  In 1995, the painter Elias Thorne primes two canvases of identical dimensions in his studio. On Canvas A, he blocks in a composition as a preliminary study, leaving the surface rough and unresolved to test a colour scheme; satisfied with the arrangement, he immediately paints Canvas B, refining the brushwork until it meets his standard for public exhibition. Canvas B is sold to the National Gallery and becomes iconic, while A remains in private hands as a documented study. In 2025, the owner of Canvas A commissions Thorne to revisit the work. Thorne agrees and spends several months bringing A to the same level of finish as B, matching every visible stroke, texture and hue until the two are visually indistinguishable. He signs the reverse of both, certifying A as 'Study completed 2025' and B as 'Prime Version 1995'; there is no deception, the provenance of both is fully documented, and A now possesses the same aesthetic properties as B alongside a richer physical history of the artist's decision-making spanning thirty years.

  **2. Which is the Original?**
  The museum should treat Canvas B as 'the original'. While Canvas A has priority in terms of physical genesis (the first marks made), the identity of an artwork is tied to its first successful realisation as an intended public object. Canvas B was the first instance where the work achieved the status of a 'finished piece' within the artworld, whereas Canvas A remained ontologically subordinate as a study until its later upgrade. The grounds for this distinction are intentional rather than purely causal: B was created *as* the work, while A was created *for* the work and only later assimilated into that status.

  **3. The Key Feature and Value Gap**
  The feature doing the work is the **initial intention of completion**. The value gap between the two canvases relies entirely on B being the first object intended *as* the definitive work at the time of its creation. If you remove this feature—for instance, if Thorne had intended both canvases from the outset in 1995 as equal twin versions to be finished simultaneously—the value gap would collapse. In that counterfactual, both would be treated as co-originals with equal market and historical worth, proving that the premium on B tracks historical primacy of intention rather than the density of the artist's physical touch.

  **4. The Defence of B and its Survival**
  The best attack a defender of B's priority could make is to argue that art is an **historical kind**, not merely a visual one. They would contend that the value lies in the specific historical event of the work's emergence into the public sphere, which occurred with B in 1995. A's later completion cannot retroactively insert it into that initial historical moment, regardless of how identical the hand or materials become. This argument survives the thought experiment robustly, provided one accepts a contextualist theory of art (where history and intention constitute the work) over a pure aestheticism (where only the visual experience matters). Since museums operate as historical institutions, the defence holds: B remains the locus of the work's identity because it承载 (carries) the historical narrative that A, despite its physical authenticity, missed.
