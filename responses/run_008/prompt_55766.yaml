answer: |-
  ### Prediction: She Says No

  Maya is going to turn down the two-year job offer.

  ### The Rule She Is Running

  Maya is operating under a principle of **Constrained Moral Trade**, specifically: **"Maximize impact across moral uncertainties, but never accept a deal that results in a net negative on your highest-credence moral view."**

  This is a hybrid of a **Moral Parliament** model (where her 85% credence in animal welfare effectively holds veto power over major life decisions) and an **Integrity Constraint** (she will not publicly advocate for views she largely rejects).

  Here is how this rule explains her entire track record, including the confusing toast rejection:

  1.  **The $15/Bequest Deals (Accepted):** These pass the constraint. On her primary view (Animal Welfare), the cost is negligible ($15 is pocket change; a bequest costs her nothing while alive). The gain on the secondary view (X-risk) is high. The "Animal Welfare faction" of her moral parliament doesn't care enough to veto it.
  2.  **The Volunteer Month (Rejected):** This fails the constraint. Volunteering a month for X-risk is time *not* spent on Animal Welfare. On her primary view, this is a net loss of impact. The 15% X-risk credence isn't strong enough to override the 85% Animal Welfare objection to losing that labor.
  3.  **The Toast (Rejected):** This is the key data point. In pure Expected Value (EV) terms, a toast is "cheap." But Maya rejected it because it violates the **Integrity Constraint**. Publicly advocating for a worldview she thinks is 85% wrong damages her reputation and credibility as an Animal Welfare advocate. It creates a "signaling cost" on her primary view. Her moral parliament vetoes it because it harms her efficacy in her main mission.
  4.  **The Two-Year Job (The Current Offer):** This fails the **Net Negative Constraint**. She has explicitly calculated that this move spares 2 million fewer hens than her current path. On her primary moral view (85% credence), this deal makes the world *worse*. Even if the X-risk upside is astronomical, she is unwilling to *guarantee* harm to her primary value to *gamble* on her secondary value. She treats her career labor as property of her highest-credence moral theory.

  ### Why Not Pure Expected Value?
  If she were a pure EV maximizer under moral uncertainty, the Toast should have been an easy "yes" (low cost, high value to Dev). The fact that she rejected a "free" favor suggests she has deontological constraints (integrity/reputation) that override simple calculus. Furthermore, pure EV might allow the 15% X-risk view to outweigh the 85% AW view if the stakes are high enough (Pascal's Mugging territory). Her rejection of the volunteer month suggests she won't let the 15% override the 85% on significant life allocations.

  ### Why Not "Life Not Up For a Vote"?
  This rule ("trade cheap stuff, keep career sacred") explains the Job and Volunteer rejections, but it's too blunt. It doesn't account for the *calculations* she's doing. She didn't say "I won't quit my job"; she said "I'd be netting minus two million hens." She is willing to quantify the trade-off, which implies she *would* trade her career if the Animal Welfare math worked out. She isn't protecting her career *per se*; she is protecting her Animal Welfare impact.

  ### The Next Deal to Offer

  To distinguish between the surviving rules (**"No Net Negative on Primary"** vs. **"Career is Sacred/Identity"**), you should propose a deal that satisfies the Animal Welfare math but still demands the career shift.

  **The Deal:**
  > Dev offers to bankroll a corporate campaign that spares **10 million hens** (a net gain of +5 million hens compared to her current job trajectory) in exchange for Maya taking the **two-year job** at his X-risk org.

  **Why this distinguishes the rules:**

  *   **If she says YES:** Her rule is **"No Net Negative on Primary" (Pareto Improvement).** She is willing to trade her career/labor to the X-risk view *provided* her Animal Welfare view is fully compensated and then some. The Toast rejection was about integrity/reputation loss, not the labor itself. The previous Job rejection was about the net loss of hens, not the job itself.
  *   **If she says NO:** Her rule is **"Career/Identity is Sacred."** She views her professional agency as non-fungible. Even if the Animal Welfare cause is "paid off" by Dev, she refuses to let her life's work be directed by a moral theory she mostly rejects. This confirms the "Trade the cheap stuff, but your one life isn't up for a vote" hypothesis.

  **My Bet:** She says **No** to this deal too. Her rejection of the Toast suggests a deep aversion to letting her secondary credence direct her actions in ways that might confuse her primary mission. She likely views her career not just as a resource to be traded, but as the primary vehicle for her moral integrity. She will trade her money (bequests, donations) and her diet (marginal habits), but she will not trade her *agency*.
