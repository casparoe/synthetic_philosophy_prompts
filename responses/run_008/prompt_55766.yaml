  my friend Maya is deep into animal welfare, like she thinks most of what matters morally right now is factory farming. her friend Dev thinks basically none of that matters and what matters is reducing existential risk for the far future. they're close though, so they do this thing called moral trade, where each of you does what the other values since it's usually cheap for you and vice versa. Maya gives Dev's whole worldview maybe a 10-15% chance of being correct, fwiw.

  her track record so far, the deals she's said yes or no to:

  - Dev gave up chicken entirely, and in exchange she donates $15 a month to his favorite x-risk org, which she thinks mostly pushes paper around. accepted.
  - Dev offered that if she volunteered a month every summer at his org, he'd go fully vegan and drag his very meat-loving family along with it. she said no, said it was to much.
  - Dev does vegetarian lent every year, and in exchange she put a bequest to his org in her will (her words: money after you're dead is the cheapest concession there is). accepted.
  - Dev offered to cover a year of printing costs for her group if she'd give a toast at a mutual friend's party making the case for his views. she turned it down, which surprised me, it seemed basically free.

  now there's a big one on the table. Dev is coming into some money and says that if Maya leaves her job at the animal nonprofit for two years to work at his org — he insists she's exactly the kind of person they need — he'll bankroll a corporate campaign that by her own estimates would spare around three million hens from cages. her own estimate is that two years at her current job spares about five million. so on her picture of the world she'd be netting minus two million hens for two years of her life, but she does hold that small credence that the far future stuff dominates everything, and under that view the two years could matter more than everything else she'll ever do.

  what's she going to say? I'm less interested in the yes/no than in the rule she's actually running. is it expected value across her moral uncertainty, that moral parliament kind of thing? is it more like "trade the cheap stuff, but your one life isn't up for a vote" (which would explain the summer volunteering rejection, and maybe the toast)? or "only take deals that come out ok whichever moral view turns out true"? do all of those even fit her record, including the toast one, which still bugs me? give me your best guess with reasons, and then tell me what deal you'd offer her next to tell the surviving rules apart.
