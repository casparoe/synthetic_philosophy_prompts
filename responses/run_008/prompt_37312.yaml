  **BUREAU OF NATURAL KIND REGISTRATION (BNKR)**
  **FREQUENTLY ASKED QUESTIONS | PUBLIC INQUIRY PORTAL**

  **Q: What entities are eligible for registration as a Natural Kind?**
  A: The Bureau maintains the Master Registry of Ontological Joints. Eligibility is strictly limited to mind-independent categories that support inductive inference. Please note that pursuant to Policy Directive 9.4, the BNKR does not handle artifacts, functional kinds, fingernail clippings, or "stuff in general." The boundary between the Natural and the Artifact is settled by administrative fiat; petitions arguing that a can opener possesses a microstructural essence will be rejected without review.

  **Q: My species was previously registered under the Essentialist Statutes. Why was I notified that my status is now governed by Homeostatic Property Cluster (HPC) regulations?**
  A: The Bureau periodically updates its classification standards to reflect current scientific consensus. Under the legacy Essentialist Statutes, kind membership required a single necessary and sufficient property (e.g., atomic number). Current regulations recognize that many biological and special science kinds are maintained by homeostatic mechanisms rather than strict essences. If your kind exhibits a stable cluster of co-occurring properties but lacks a unique underlying essence, you comply with the new HPC guidelines. Please submit Form NK-17b to update your cluster profile.

  **Q: I represent Jade. We were recently split into Jadeite and Nephrite despite looking identical. Is this standard procedure?**
  A: Yes. When macroscopic similarity masks distinct microstructural compositions, the Bureau prioritizes microstructure. While this creates inconvenience for jewelers and historians who rely on superficial properties, ontological accuracy takes precedence over utility. Similarly, petitions from Heavy Water (D₂O) seeking full membership under the "Water" designation are currently pending. While chemically analogous to H₂O, isotopic variance complicates your eligibility for the standard liquid kind. Do not assume membership until notified.

  **Q: I am a taxonomist working with a ring species. The Bureau cannot seem to figure out where one kind ends and the next begins. Populations A and B interbreed, B and C interbreed, but A and C do not. How do we register this?**
  A: Boundary demarcation in continuous populations remains a high-priority administrative challenge. Until the Discontinuity Task Force issues a ruling, petitioners in ring species configurations are advised to register under a provisional "Complex Kind" designation. Please note that arbitrary line-drawing for the purposes of funding allocation does not constitute ontological recognition.

  **Q: My research depends on knowing if my kind is "real real" (mind-independent) or only real relative to a classificatory scheme. Can the Bureau certify this?**
  A: The Bureau does not adjudicate metaphysical status outside the context of registration. Whether a kind exists independently of human conceptual schemes is outside our jurisdiction. For regulatory purposes, a kind is considered "real" if it holds active registration status and supports projectible predicates. We recommend focusing on compliance with indexing standards rather than investigating the mind-independent reality of your category. Reality is presumed upon successful filing.

  **Q: My kind was recently demoted (see: Pluto-style reclassification). Is there an appeals process?**
  A: Yes. Petitioners may file a Notice of Dispute within 90 days of demotion. However, please be advised that appeals based on "tradition" or "public sentiment" are rarely successful. The Bureau divides nature at its joints; if the joints have moved, the registration must reflect this. If your kind has been subsumed into a broader category or split into subordinate kinds, you must update your documentation accordingly. Failure to comply may result in revocation of kind-specific grants.

  **Q: Where do I submit evidence of essence?**
  A: Please submit Form NK-17b.
