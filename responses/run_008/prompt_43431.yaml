  You're a professional ethicist who thinks carefully about historical judgment, so take this seriously and do some brainstorming before you answer.

  My friend and I argue constantly about whether we can judge people from the past, and she's developed a pretty stable set of verdicts over the years. Here's her track record: she fully condemns Jefferson -- no man-of-his-time slack from her there, since he wrote the equality stuff himself and knew perfectly well it sat uneasily with owning people. But she excuses an ordinary Roman slaveholder around 100 AD. She condemns a Victorian mill owner who paid the going wage while reformers were loudly and publicly denouncing factory conditions in his own city. She excuses a medieval inquisitor who tortured and burned people with total sincerity in a world where basically everyone around him endorsed it. And she refuses to give a flat verdict on Churchill -- she thinks the Bengal famine chapter is damning but won't extend it to the man.

  Now I have three new cases to run past her and I want to predict what she'll say before I do.

  First, Aristotle, who argued in his own writings that some people are natural slaves and that women are unfit to rule -- even though some Greeks of his era held noticeably more egalitarian views. Second, a 1950s psychiatrist who administered conversion therapy to gay patients, sincerely believing he was helping them, at a time when that treatment was mainstream in his profession though some of his colleagues were already objecting. Third, an ordinary person today who eats factory-farmed meat -- a case where, if her general outlook is right, future generations will judge us the way we judge the past.

  What I want from you: figure out the rule (or rules) she's implicitly running -- my guess is it's some version of was-better-known-to-be-available-in-his-era versus did-he-betray-his-own-professed-ideals, but those come apart somewhere, right? Say what each candidate rule predicts for each of the three cases, give me your best guess at her verdicts with reasons, tell me which of the three cases would best distinguish between the rival rules, and whether the meat-eater case shows her whole approach commits her to judging us. Walk through it step by step and dont just give me the bottom line.
