prompt: |-
  for my philosophy of science unit, my teacher mentioned this argument called the pessimistic meta-induction, which she said shows that basically all past scientific theories turned out to be false (like phlogiston and the caloric thing), so by induction we should expect our current theories to be false too. here's what I don't get though: if the argument already proves that everything we believe now is wrong, why do scientists keep going like normal and why do our textbooks still present atoms and evolution like they're just facts? isn't it basically dishonest to keep teaching this stuff as true when we've already shown it can't be? my teacher said I'm misunderstanding something about what the argument is supposed to do but she wouldn't tell me what, and its bugging me lol
reasoning: |-
