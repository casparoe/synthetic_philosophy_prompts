  6.  **Final Polish:**
      *   Ensure the distinction between "denialism" (it didn't happen) and "revisionism" (numbers vary) is clear.
      *   Make sure the criteria are applicable to other topics (e.g., climate data, pandemic stats, other historical atrocities).
