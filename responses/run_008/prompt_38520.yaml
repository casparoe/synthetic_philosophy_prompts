answer: |-
  This is an excellent piece of philosophical reasoning. You have independently reconstructed a version of what is known in the literature as the **Normative Argument for Truth** (or a close cousin of the "Argument from the Norm of Belief"). It is not a beginner's confusion; it is a genuine objection that substantive theorists of truth (like Crispin Wright or Michael Lynch) have raised against deflationists (like Paul Horwich or the early Ramsey).

  However, your intuition that the argument "proves too much" is correct. A valid argument should not entail absurdities (like "chess cannot be won" or "deflationists cannot think"). Since the conclusion leads to these absurdities via your friend's extensions, there is a flaw in the derivation.

  Per your request, I will first sketch the candidate weak points, then commit to the specific inference you should reject, analyze why it tempted you, and evaluate your friend's counter-moves.

  ### Phase 1: Sketching Candidate Weak Points

  Let's look at the pressure points in your syllogism.

  *   **Premise (1): Belief has a point (correctness).**
      *   *Status:* Very strong. Almost all philosophers of mind accept that belief is a normative state; it *ought* to match the world. To reject this is to embrace a radical eliminativism about belief that few accept. You want to keep this.
  *   **Premise (2): The Deflationist Account.**
      *   *Status:* Accurate. This is a fair characterization of deflationism. Truth is not a robust property like "mass" or "charge"; it is a logical device for generalization (the T-schema: "$p$" is true iff $p$).
  *   **Inference (2) $\rightarrow$ (3): From "No Shared Property" to "No Aim."**
      *   *Status:* **Suspect.** This assumes that for a mental state to have an "aim" or "target," that target must be a substantive, shared metaphysical property. It conflates *normativity* (rules/aims) with *metaphysics* (properties).
  *   **Inference (3) $\rightarrow$ (4): From "No Aim" to "No Correction."**
      *   *Status:* **Suspect.** This assumes correction requires a metaphysical standard rather than a functional or rule-based standard.
  *   **Premise (5): We correct beliefs.**
      *   *Status:* Indubitable. This is a Moorean fact (a fact more certain than any philosophical premise). You want to keep this.

  ### Phase 2: The Diagnosis

  You asked exactly which premise or inference to give up.

  **You must reject the inference from (2) to (3).**

  Specifically, you must reject the claim in (3) that *"If there is no shared thing [property]... belief isn't aimed at anything."*

  Here is why this inference fails, why it looked plausible, and what it costs you.

  #### 1. Why the Inference Fails
  The error lies in assuming that an "aim" requires a **substantive property** to aim *at*.
  Deflationists argue that "truth" is a concept, not a heavy-duty property. To say belief "aims at truth" is simply to say that belief is governed by the rule: *Believe $p$ only if $p$.*
  You do not need a metaphysical glue (a property called Truth) to hold all true statements together for them to serve as a target. The "target" is constituted by the **rules of the practice**, not by a shared feature of the world.

  Think of it this way: In chess, "checkmate" is the aim. Is there a physical property shared by all checkmate positions? No. Some involve queens, some involve pawns; the board configuration is different every time. "Checkmate" is defined entirely by the rules of chess. Yet, a player definitely "aims" at checkmate.
  Similarly, the deflationist says "truth" is defined by the rules of language (the T-schema). Belief aims at truth in the same way a chess player aims at checkmate: by following the rules that constitute the concept.

  #### 2. Why It Looked Plausible
  Premise (3) relies on a very deep, pre-theoretical intuition: **Real norms require real standards.**
  When we think of "correctness," we tend to think of a measuring stick. If I measure a board and say it is "correctly 1 meter," there must be a real property (length) that the board possesses. You intuitively felt that if "truth" isn't a real property (like length), it can't serve as the measuring stick for belief.
  This intuition is powerful because in the natural sciences, norms *do* usually track properties (e.g., a thermometer is "correct" if it matches the physical property of temperature). You projected this scientific model of correctness onto the logical concept of truth.

  #### 3. The Cost of Rejecting It
  By rejecting (3), you are conceding that **normativity does not require robust metaphysics.**
  You are accepting that we can have genuine aims, standards, and corrections based entirely on linguistic or conceptual rules, without needing a "deep feature of the world" to ground them.
  *   **The Cost:** You lose the ability to argue that truth *must* be a substantive property *just because* belief is normative.
  *   **The Gain:** You save your argument from proving absurdities (like the chess example). You can still argue that truth is substantive, but you will need a different reason (e.g., that truth plays an explanatory role in successful action, not just in belief correction).

  ---

  ### Phase 3: Evaluating Your Friend's Counter-Arguments

  Your friend is sharp. Both of their counter-arguments are fair, but they function differently.

  #### 1. The Chess Analogy
  **Verdict: Fair and Devastating.**
  This is a direct counter-example to your inference (2) $\rightarrow$ (3).
  *   **Your Logic:** No shared physical property $\rightarrow$ No aim/norm.
  *   **Chess Reality:** No shared physical property (of board states) $\rightarrow$ Yet there *is* an aim/norm (winning).
  *   **Conclusion:** Your logic is invalid. You can have a normative aim without a shared substantive property.
  This analogy works because deflationists explicitly compare truth to logical or game-like concepts. "Winning" is a status conferred by rules, not a physical discovery. If your friend is a deflationist, they view "True" exactly like "Winning": a status conferred by the rules of assertion (the T-schema), not a discovery of a metaphysical property.

  #### 2. The "Can't Even Hold a Belief" Jab
  **Verdict: Fair as a *Reductio*, though rhetorically aggressive.**
  This is a *reductio ad absurdum* argument.
  *   **Structure:** If your argument is sound, then deflationists cannot have beliefs (because they deny the property required for aiming). But deflationists *are* having beliefs (they are arguing with you). Therefore, your argument is unsound.
  *   **Why it feels like a cheap shot:** It feels personal, as if you are attacking the person rather than the theory.
  *   **Why it is philosophically valid:** It highlights that your argument threatens to make disagreement impossible. If the deflationist theory rendered belief impossible, it would be self-refuting. Since we know belief is possible, the premise that leads to that conclusion (Premise 3) must be false.
  *   **Nuance:** It is slightly imprecise. The deflationist *can* hold beliefs; they just analyze them differently. Your argument claims they *shouldn't be able to* given their own theory. The jab is a shorthand for: "Your argument implies deflationism is incoherent, but deflationism is clearly coherent enough to be stated, so your argument is the one that is incoherent."

  ### Summary and Path Forward

  You should keep (1) and (5). They are the strongest parts of your position. You must abandon the move from (2) to (3).

  **Why this matters:**
  You were trying to prove that Truth is a **Property**. Your friend is arguing Truth is a **Device**.
  Your argument successfully proved that Truth is a **Norm**.
  The mistake was assuming that *only Properties can be Norms*. Your friend's chess analogy proved that *Rules can be Norms*.

  **How to salvage the debate:**
  If you still want to argue against deflationism, do not argue from the *existence* of norms (since deflationists can accommodate norms via rules). Argue from **explanation**.
  *   *New Argument:* "Deflationism explains how we use the word 'true', but it doesn't explain why believing true things leads to successful action. If I believe the bridge is safe, and it is true, I cross successfully. The deflationist says 'true' adds nothing. But there seems to be a shared feature (reliability/correspondence) that explains the success across all true beliefs. That shared feature is the property of truth."

  This shifts the battle from "Can we have norms without properties?" (which you lost) to "Do we need properties to explain success?" (which is still an open, heated philosophical war).

  **Final Advice:**
  Tell your friend: "You're right about the chess analogy. It shows that norms don't require substantive properties. I was conflating 'normative standard' with 'metaphysical property.' I withdraw the claim that deflationism makes belief impossible. However, I still think deflationism fails to explain *why* aiming at truth is useful, which is a different argument."

  This grants them the logical point while keeping the philosophical disagreement alive on more fertile ground.
