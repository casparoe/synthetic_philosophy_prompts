answer: |-
  Bottom line
  I assign a 45% credence to the proposition that current large language models contain genuine representations individuated by content.

  Decomposition
  1. (a) Probability deflationary account is correct: 0.65. Functional role theories dominate contemporary philosophy of mind and align naturally with engineering practices.
  2. (b) Probability interpretability units are real computational units given deflationism: 0.70. Sparse autoencoders recover stable features, but basis dependence and polysemanticity suggest some artifactuality remains.
  3. (c) Probability strong consumer condition is met given non-deflationism: 0.20. Evidence that downstream mechanisms track content rather than statistical correlation is currently weak.
  4. (d) Probability misrepresentation norms apply or should be relaxed for artifacts: 0.85. Derived intentionality allows for failure conditions relative to design goals even without biological teleology.

  Combination
  The headline credence is derived by weighting the deflationary and non-deflationary paths by their respective probabilities, then scaling by the likelihood that normative constraints are satisfiable. Specifically, I calculate the weighted sum of the representational paths as $(0.65 \times 0.70) + (0.35 \times 0.20) = 0.525$, then multiply this intermediate probability by the norm coefficient of 0.85 to arrive at approximately 0.45.

  Sensitivity and what would move me
  The final number is most sensitive to term (b), the probability that interpretability units are real computational units rather than analytical artifacts. A successful "transcoding" experiment, where features learned by one model are shown to be linearly readable and causally effective in a distinct architecture without retraining, would sharply increase this probability by demonstrating that these directions are intrinsic to the computation rather than imposed by our analysis tools.

  Where the disagreement lives
  The split between interpretability researchers and skeptical philosophers most cleanly separates on term (a), the validity of the deflationary, role-based account of representation. Researchers typically operate as if this probability is near unity, treating causal efficacy as sufficient for semantics, while the skeptical philosophers insist that without term (c), the strong consumer-side condition, the label of "representation" is merely metaphorical.
