          *   *Response Strategy:* Acknowledge the shift from "rights/inviolability" to "compensation/bearer." Defend it by saying compensation is the mechanism that makes intra-personal trade-offs rational. If inter-personal compensation is impossible (or not guaranteed), the trade-off is irrational/unjust.
          *   *Advice:* Clarify that "compensation" here means "net benefit within a life," not necessarily monetary payback.

      *   **3. The Dilemma:**
          *   *Is it forced?* Utilitarians often accept the *ex ante* view (Harsanyi). They don't see the *ex post* loss as a moral catastrophe if the *ex ante* expectation was positive.
          *   *Escape Route:* Ex Post Compensation. If the state taxes the winners to compensate the losers (e.g., social insurance, tort law), the "bearer" condition might be restored ex post. The draft says "no one receives the compensation." But in a welfare state, the victim of an accident might be compensated by society.
