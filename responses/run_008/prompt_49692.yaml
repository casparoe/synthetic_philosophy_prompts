answer: |-
  # Which Response to the Knowledge Argument Do You Actually Hold?

  **Instructions:** Read each scenario and select the option that best matches your intuition. Do not worry about philosophical terminology; answer based on what seems most plausible to you. There are no right or wrong answers.

  **1. The Color Scientist (Mary)**
  Mary knows every physical fact about color vision but has never seen color. Upon leaving her black-and-white room, she sees a red rose.
  *   **A.** She learns a new truth about the world that she could not have deduced from physics.
  *   **B.** She gains a new way of accessing information she already possessed.
  *   **C.** She is not genuinely surprised; she already knew exactly what would happen.

  **2. The Deaf Acoustician**
  A brilliant scientist knows the complete physics of sound waves but has been deaf since birth. After a cure, she hears a violin for the first time.
  *   **A.** She discovers a property of the violin that was previously unknown to her.
  *   **B.** She acquires a new capacity to recognize and imagine sounds.
  *   **C.** Her physical knowledge already covered this; the experience adds nothing.

  **3. The Perfect Robot**
  Imagine a robot programmed with a complete functional specification of human pain responses. It avoids damage and says "ouch."
  *   **A.** It lacks knowledge of a fact: what pain *is* like.
  *   **B.** It lacks a capacity: the ability to feel, not the knowledge of feeling.
  *   **C.** It lacks nothing; "feeling" is just functioning in this way.

  **4. The Bike Rider**
  You read a manual containing every law of physics governing bicycle balance. You have never ridden one. You get on and ride.
  *   **A.** You confirm a theoretical truth through practice.
  *   **B.** You gain a skill (balance) distinct from factual knowledge.
  *   **C.** You realize the manual was sufficient; riding is just applying the rules.

  **5. The Supertaster**
  A chef with a rare receptor tastes a fruit. She tries to describe the flavor to someone lacking the receptor.
  *   **A.** She fails to convey a fact about the fruit's taste.
  *   **B.** She fails to induce a specific sensory state in the listener.
  *   **C.** She could convey it fully if she used precise enough physical descriptions.

  **6. The Map and the Territory**
  You memorize a perfect map of a city. You then walk the streets.
  *   **A.** You learn new facts about the city not on the map.
  *   **B.** You see the same city from a new perspective (street-level vs. aerial).
  *   **C.** You learn nothing; the map was already complete.

  **7. The Neurosurgeon**
  A surgeon stimulates a patient's brain, causing a pain sensation. The patient says, "So *that* is what you were describing!"
  *   **A.** The patient learns a new fact about their own brain state.
  *   **B.** The patient becomes acquainted with a state they already knew about theoretically.
  *   **C.** The patient is mistaken; they knew exactly what the state was already.

  **8. The Old Friend**
  You read a complete biography of a person. Later, you meet them at a party.
  *   **A.** You learn new truths about their character.
  *   **B.** You enter into a relationship of acquaintance with them.
  *   **C.** You gain nothing; the biography told you everything relevant.

  ***

  ## Scoring Key & Diagnostic Tree

  **Step 1: The Gain Question (Dennett vs. The Rest)**
  *   Tally your **C** answers.
  *   **Mostly C:** You lean toward **Deflationism (Dennett)**. You believe the "gap" is an illusion; complete physical knowledge leaves nothing out.
  *   **Mostly A or B:** You believe something is gained. Proceed to Step 2.

  **Step 2: The Propositional Question (Fact vs. Non-Fact)**
  *   Compare your **A** answers against your **B** answers.
  *   **Mostly A:** You think what is gained is *Knowledge-That* (Propositional). Proceed to Step 3.
  *   **Mostly B:** You think what is gained is *Non-Propositional*. Proceed to Step 4.
  *   **Mixed:** You may hold a hybrid view or find the distinction difficult.

  **Step 3: The Fact Question (New Fact vs. Old Fact)**
  *   Look closely at **Q1, Q6, and Q7**.
  *   If you chose **A** (New Truth/Property) on these: You lean toward **Property Dualism (Jackson 1982)**. You think physical facts do not exhaust all facts.
  *   If you chose **B** (New Perspective/Acquaintance) on these, but **A** on others: You lean toward **Phenomenal Concepts (Loar)** or **Representationalism (Jackson 1998)**. You think the fact is physical, but accessed via a unique concept or mode.

  **Step 4: The Non-Propositional Question (Skill vs. Relation)**
  *   Look closely at **Q4 (Bike)** and **Q8 (Friend)**.
  *   If you favored **Skill/Capacity** language (Q4): You lean toward the **Ability Hypothesis (Lewis/Nemirow)**.
  *   If you favored **Relation/Acquaintance** language (Q8): You lean toward the **Acquaintance Hypothesis (Conee)**.

  ### Diagnostic Limitations & Overlaps

  **1. Ability vs. Acquaintance:**
  This quiz cannot reliably separate these positions. Both deny propositional gain. Intuitions about "skills" vs. "relations" often collapse in concrete cases (e.g., is recognizing a face a skill or a relation?). Secondary literature is required to distinguish them.

  **2. Phenomenal Concepts vs. Representationalism:**
  Both views claim the subject gains an old physical fact under a new access. Cases involving "perspective" (Q6) fit both. The distinction lies in metaphysical commitments about concepts vs. content, which case intuitions alone rarely reveal.

  **3. Unoccupied Logical Space:**
  *   *No Gain + New Proposition:* Incoherent. One cannot learn a new truth without gaining knowledge.
  *   *New Fact + Non-Propositional:* Unexplored. Typically, "facts" are taken to be propositional. If one holds this, they require a non-standard definition of "fact."

  **Position Summary:**
  *   **Deflationist:** Mostly C.
  *   **Dualist:** Mostly A (specifically Q1, Q7).
  *   **Phenomenal Concept/Rep:** Mix of A and B (specifically B on Q6, Q7).
  *   **Ability:** Mostly B (specifically Q4, Q2).
  *   **Acquaintance:** Mostly B (specifically Q8, Q5).
