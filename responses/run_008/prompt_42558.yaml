      4.  Politics/Rejected Argument? Yes.
      5.  Future Criteria? Yes.

      *Tone Check:* Ensure it doesn't sound like I'm overruling the lawyers arrogantly, but rather defining the organization's *mandate* which differs from a court's mandate.

      *(Self-Correction on the Recommendation)*: A pure "We call it Genocide" might be too blunt given the Legal team's valid point about the "intent to displace" vs "intent to destroy." A more sophisticated recommendation is: "We characterize the *acts* as genocidal and the *campaign* as genocide, while explicitly noting the legal debate regarding specific intent." This allows the organization to speak truth without claiming judicial authority it doesn't have. I will frame it as: "The report will characterize the situation as genocide, while transparently articulating the evidentiary basis for inferring intent."

      *Wait, one nuance:* The prompt says "Treat the facts below as stipulated." I must not invent facts about Veldania.
      *Okay, let's write.*

