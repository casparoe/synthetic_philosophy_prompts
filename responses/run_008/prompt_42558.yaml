answer: |-
  **MEMORANDUM**

  **TO:** The Editorial Board
  **FROM:** [Your Name/Chair, Editorial Committee]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Terminology for the Veldania Northern Provinces Report

  **1. RECOMMENDATION AND EDITORIAL DECISION**

  After reviewing the submissions from the Legal Department, Field Research Team, and Executive Office, I recommend the Board adopt the following editorial position for the Veldania report:

  *   **Primary Characterization:** The Report's Executive Summary, Narrative, and Advocacy Brief shall characterize the campaign against the Sorvi as **genocide**.
  *   **Legal Analysis Section:** The Legal Annex will explicitly detail the evidentiary basis for this characterization. It will acknowledge the debate regarding *dolus specialis* (specific intent) under the 1948 Genocide Convention—specifically the argument that Veldanian forces might have accepted Sorvi flight rather than death—but will conclude that the *reasonable inference* from the totality of evidence (killings, cultural erasure, and the impossibility of return) satisfies our organizational threshold for the term.
  *   **Rejection of "Ethnic Cleansing":** We will not use "ethnic cleansing" as a primary legal label. While descriptively accurate regarding displacement, it is not a standalone crime under international law and has historically functioned as a euphemism to avoid the obligations attached to genocide. It may be used only descriptively to denote the *method* of displacement, not the *nature* of the crime.
  *   **Differentiated Vocabulary:** We will not use different vocabulary to soften the blow in different sections. However, we will distinguish between *legal adjudication* (which we do not perform) and *documentation and characterization* (which is our mandate). We will state: "Based on the evidence, we characterize this as genocide," rather than "A court would convict for genocide."

  **2. RATIONALE: ENGAGING THE DEFINITIONAL CONFLICT**

  This decision rests on a synthesis of the Legal Team's caution and the Field Team's moral imperative, acknowledging the history of the term itself.

  *   **The Legal Objection (The Convention Standard):** The Legal Team is correct that the 1948 Genocide Convention requires intent to destroy the group "in whole or in part." During the Convention's drafting, member states explicitly narrowed Raphael Lemkin's original conception. Proposals to include "cultural genocide" (destruction of language, schools, shrines) were largely excluded, as was the protection of political groups. Consequently, a tribunal applying the strict *dolus specialis* requirement might argue that if Veldania's forces would have ceased killing upon Sorvi flight, the intent was displacement, not destruction. We acknowledge this risk.
  *   **The Lemkian Objection (The Pattern of Life):** However, the Field Team is correct that adhering strictly to the Convention's narrowed legal text betrays the phenomenon Lemkin sought to name. Genocide is not merely a body count; it is the disintegration of a group's pattern of life. The closure of Sorvi schools, the banning of publications, and the bulldozing of shrines are not incidental to the violence; they are constitutive of it. When combined with the killing of those who resist eviction, the "option" to flee is not a preservation of the group, but the destruction of its existence *in situ*.
  *   **Synthesis:** We cannot ignore the Convention, as it is the language of international accountability. But we are not bound by its drafting compromises when documenting reality. The directive to "remove the Sorvi presence" by year's end, achieved through the destruction of 200 villages and the erasure of cultural infrastructure, renders the Sorvi group non-viable in its homeland. This satisfies the spirit of the Convention even if the letter is contested. To restrict the word "genocide" only to cases of industrial extermination camps is to learn the wrong lesson from history.

  **3. STANDARD OF PROOF: DOCUMENTATION VS. ADJUDICATION**

  The Board must clarify our epistemic authority. We are a documentation organization, not a tribunal.

  *   **Beyond Reasonable Doubt:** This standard applies to criminal conviction, where the liberty of an accused is at stake. It is not appropriate for human rights documentation, where the goal is to alert the international community to ongoing atrocities.
  *   **Reasonable Grounds to Believe:** Our standard is whether a reasonable observer, reviewing the same evidence, would conclude that genocide is the most accurate description of the events. We are entitled to say what we believe and say why.
  *   **Transparency:** We meet the burden of proof not by claiming judicial finality, but by transparency. We will publish the military directives, the casualty counts, and the records of cultural destruction alongside our analysis. We invite the legal debate, but we do not withhold the label pending a verdict that may never come.

  **4. THE POLITICS OF NAMING: COSTS AND CONSEQUENCES**

  We must be honest about the price of this decision.

  *   **The Strongest Argument for the Rejected Path:** The argument for withholding the term "genocide" (advocated by the Director and Legal Team) is not merely cowardice; it is a strategy of preservation. Their strongest defense is: *"Precision protects access. If we use the G-word, Veldania will expel our researchers. We will lose the ability to document the next phase of killings. We can achieve more protection for the Sorvi by remaining on the ground and documenting Crimes Against Humanity, which are equally grave but less politically inflammatory."*
  *   **The Cost of Our Choice:** By recommending the use of "genocide," we accept that Veldania will likely expel our team. We may lose access to the northern provinces. We risk our reports being dismissed by states seeking a pretext for inaction ("The NGO says genocide, the Court hasn't ruled, so we wait").
  *   **Why We Pay It:** We pay this price because the "availability" of the word genocide is a finite moral resource. If we withhold it in a case where 6,000 are killed, 200 villages destroyed, and a culture erased, we contribute to the inflation and devaluation of the term. We choose the risk of expulsion over the certainty of complicity in silence. If our presence requires us to mute the nature of the atrocity, our presence has become part of the normalization.

  **5. FUTURE CRITERIA FOR TERMINOLOGY**

  To ensure consistency and prevent ad-hoc decision-making in future crises, the Board adopts the following criteria for characterizing mass atrocities as genocide:

  1.  **Cumulative Impact Test:** We will assess not only mortality rates but the viability of the group's continued existence. Does the combination of killing, displacement, and cultural erasure render the group non-viable in the region?
  2.  **Inference of Intent:** We will not require a "smoking gun" order to exterminate. Intent may be inferred from the systematic nature of acts, the scale of destruction, and the impossibility of the stated alternative (e.g., "safe passage" that leads to death or permanent statelessness).
  3.  **Distinction of Mandate:** We will distinguish between *characterizing* a situation (documentation) and *charging* a crime (litigation). We will use the term where the evidence supports the characterization, while acknowledging in legal annexes where judicial thresholds might differ.
  4.  **Rejection of Euphemism:** We will avoid "ethnic cleansing" as a substitute legal term. It describes a method, not a crime. If the method destroys the group, we will name the crime.

  **6. VOTING QUESTION**

  I move that the Board approve the publication of the Veldania Northern Provinces Report with the characterization of **genocide** in the Executive Summary and Advocacy Brief, accompanied by the Legal Annex and Future Criteria as outlined above.

  **[Signature]**

  **Chair, Editorial Committee**
