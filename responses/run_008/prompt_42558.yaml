prompt: |-
  I sit on the editorial board of a human-rights documentation organisation — we publish field reports and advocacy briefs; we do not litigate and we are not a court. We are finalising our report on the situation in the northern provinces of Veldania, and we are deadlocked over a single word. I would like you to draft the board's decision memo. Treat the facts below as stipulated; you need not know anything about Veldania, which I am calling it for this exercise.

  The facts, briefly: Veldania's Sorvi minority is a linguistic-ethnic group concentrated in the north. Over the past eighteen months, security forces and allied militias have destroyed or emptied some two hundred Sorvi villages; roughly six thousand Sorvi are confirmed killed and several hundred thousand displaced across the border. Killings cluster overwhelmingly around villages that resist eviction, and military documents obtained by our field team include a provincial directive ordering the "removal of the Sorvi presence from the province by year's end." Alongside the violence, the authorities have closed Sorvi-language schools, banned Sorvi publications, and bulldozed a number of ancestral shrines. There is no evidence of extermination camps or of orders to kill Sorvi qua Sorvi regardless of flight.

  Our board has split three ways. The legal team argues that under the 1948 Genocide Convention the destruction must be of the group as such, with intent to destroy the group in whole or in part, and that the evidentiary pattern here fits forced displacement and persecution — crimes against humanity, and grave ones — but that a court applying the special-intent requirement could reasonably find that Veldania's forces would have been content had the Sorvi simply left. Our field researchers reply that this courtroom standard betrays the category itself: Lemkin, who coined the word, understood genocide as the destruction of a group's pattern of life — its language, institutions, and culture — and not merely its members' bodies, and a report that reserves the word for shooting squads into pits fails to name what is happening to the Sorvi as a group. Our director worries about the consequences either way: if we use the word, we trigger expectations of response that we cannot satisfy and hand the government a pretext to expel our researchers; if we withhold it, we join the long history of actors who found the G-word available for enemies and unavailable for the awkward cases — and "ethnic cleansing," our compromise candidate, is a phrase that entered circulation precisely as a way of describing mass atrocity while avoiding the legal obligations the word genocide carries.

  Please draft the memo the board will vote on. It should: (1) recommend a concrete editorial decision — which term or terms the report uses for the campaign, and whether the report may use different vocabulary in its descriptive, legal, and advocacy sections; (2) give reasons that engage both the special-intent objection and the Lemkian objection rather than dismissing either — including, where relevant, what follows from the Convention's exclusion of political groups and its narrowing of Lemkin's cultural conception at the drafting stage; (3) address the standard-of-proof question: whether a documentation organisation is entitled to use a word whose legal meaning is settled only by tribunals applying proof beyond reasonable doubt, or whether it should say what it believes and say why; (4) confront the politics of naming honestly — the strongest argument for the recommendation you reject, stated as its best defender would state it, and what the organisation is choosing to pay for its choice; and (5) propose criteria, not just for this case, that our future report teams can apply when the same question arises again. The memo should be one our board could adopt verbatim, with a clear bottom line.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Editorial Board Member of a human-rights documentation organization.
      *   **Task:** Draft a decision memo for the board to vote on regarding the use of the word "genocide" in a report about Veldania's Sorvi minority.
      *   **Context:** The organization publishes field reports/advocacy briefs, does *not* litigate, is *not* a court.
      *   **The Conflict:** Three-way split.
          *   *Legal Team:* Strict 1948 Convention definition (special intent/dolus specialis). Fits Crimes Against Humanity/Forced Displacement better. Risk: Court might say they would have been content if Sorvi left.
          *   *Field Researchers:* Lemkin's broader definition (destruction of pattern of life, culture, institutions). Risk: Ignoring legal reality.
          *   *Director:* Pragmatic/Political concerns. Risk of expulsion vs. risk of moral cowardice/hypocrisy. "Ethnic cleansing" seen as a euphemism.
      *   **Requirements:**
          1.  Recommend a concrete editorial decision (terms to use, differentiation across sections).
          2.  Engage both Legal (special-intent) and Lemkian (cultural destruction) objections. Mention Convention's exclusion of political groups/narrowing of cultural conception.
          3.  Address Standard of Proof (documentation org vs. tribunal/beyond reasonable doubt).
          4.  Confront Politics of Naming (strongest argument for the rejected path, cost of the chosen path).
          5.  Propose Future Criteria (for subsequent reports).
      *   **Tone:** Professional, decisive, nuanced, adoptable verbatim.

  2.  **Determine the Recommendation:**
      *   *Option A: Use "Genocide" unequivocally.* Risks legal credibility, expulsion, dilution of the term if courts disagree later.
      *   *Option B: Avoid "Genocide" entirely (use "Ethnic Cleansing"/"Crimes Against Humanity").* Risks moral failure, aligning with apologists, ignoring cultural destruction.
      *   *Option C: Hybrid/Nuanced Approach.* Use "Genocide" in specific contexts (cultural/descriptive) but clarify legal status. Or, use "Genocidal Acts" without making a final legal determination of the crime itself.
      *   *Decision:* The most intellectually honest and operationally safe path for a *documentation* org (not a court) is to describe the *acts* as genocidal in nature (aligning with Lemkin) while acknowledging the legal threshold for *conviction* (special intent) is a matter for a tribunal. However, the prompt asks for a concrete decision on *terms*.
      *   *Refined Decision:* The report will use the phrase "genocidal campaign" or "acts of genocide" in the descriptive and advocacy sections to capture the Lemkian reality of cultural destruction and the pattern of life, but will explicitly state in the legal analysis section that while the *acts* satisfy the actus reus of genocide, the specific *dolus specialis* (intent to destroy physically vs. displace) is a matter for judicial determination. However, given the Director's concern about "ethnic cleansing" being a euphemism, and the Researchers' concern about narrowing the term, the best path is to **use the term "genocide" but qualify its usage.**
      *   *Wait, let's look closer at the constraints.* The Legal team says a court *could* find they just wanted them to leave. The Researchers say Lemkin meant culture. The Convention *excluded* cultural genocide (mostly) and political groups.
      *   *Strategic Choice:* To satisfy the prompt's requirement to engage the tensions, the memo should probably recommend using "genocide" but with a specific methodological framing. If I say "Don't use it," I side with Legal/Director (safety). If I say "Use it," I side with Researchers (moral truth).
      *   *Best Path for a Human Rights Org:* Human rights orgs (like HRW, Amnesty) often make legal characterizations. They don't need "beyond reasonable doubt." They use "reasonable grounds to believe."
      *   *Recommendation:* We will characterize the situation as **genocide** in the Executive Summary and Advocacy Brief, based on the *pattern of acts* and the *destructive outcome* on the group's viability (Lemkin), while explicitly addressing the *intent* ambiguity in the Legal Analysis section. We will reject "ethnic cleansing" as a primary legal label because it is not a standalone crime under international law, though we may use it descriptively for the displacement aspect.
      *   *Actually, a more nuanced middle ground is often more robust for a board memo:* We will use the term **"genocidal acts"** or **"a campaign of genocide"** descriptively, but avoid declaring a *final legal verdict* of "The Crime of Genocide has occurred" as if we were the ICC.
      *   *Let's go bolder:* The prompt asks to confront the politics. If we don't call it genocide, we join the history of silence. If we do, we risk access. The memo should recommend **using the term "genocide"** but grounding it in the *convergence* of physical destruction and cultural erasure, acknowledging the legal debate but asserting the organization's mandate to document *patterns*, not just prosecute crimes.
      *   *Wait, one more check:* The Legal team says "court... could reasonably find... content had the Sorvi simply left." This is the "forced displacement vs. extermination" hinge. The Directive says "removal of Sorvi presence." This supports displacement. But 6,000 killed + 200 villages destroyed supports destruction.
      *   *Decision:* Recommend using **"genocide"** in the descriptive and advocacy sections, grounded in the *cumulative effect* of killing, displacement, and cultural erasure which renders the group's survival in the region impossible. In the legal section, articulate the *dolus specialis* debate but conclude that the *reasonable inference* from the totality of evidence meets the organization's threshold for the term. Reject "ethnic cleansing" as a substitute legal term.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (resolve the deadlock on terminology regarding Veldania).
      *   **Recommendation (Req 1):** Concrete decision. Use "genocide" in Summary/Advocacy. Use precise legal analysis in Legal section. Distinguish between "crime of genocide" (legal verdict) and "genocidal process" (sociological/descriptive). *Correction:* Keep it simpler for a vote. "The report shall characterize the campaign as genocide."
      *   **Rationale - Engaging the Definitions (Req 2):**
          *   Address Legal Team: Acknowledge the 1948 Convention's *dolus specialis*. Acknowledge the drafting history (exclusion of cultural genocide, political groups). Admit a court *might* acquit on specific intent.
          *   Address Researchers: Acknowledge Lemkin's broader vision (pattern of life). Explain why limiting it to body counts fails the Sorvi reality (schools, shrines, language).
          *   Synthesis: The Convention is a floor, not a ceiling for moral documentation. The "removal" directive, combined with killing those who resist, implies that "removal" is only possible through destruction of the group's tie to the land.
      *   **Standard of Proof (Req 3):**
          *   We are not a court. We don't need "beyond reasonable doubt."
          *   Our standard is "reasonable grounds to believe" or "preponderance of evidence."
          *   We state what we believe and why. We are not issuing a verdict, but an assessment.
      *   **Politics of Naming (Req 4):**
          *   The Rejected Path: The argument for *not* using the word (Legal/Director's fear).
          *   Strongest version of that argument: "Precision protects access and credibility. If we cry wolf and a court says 'no,' we lose future leverage. We can stop the killing by calling it Crimes Against Humanity without the baggage."
          *   The Cost: We choose to risk access and potential legal nitpicking to avoid moral dilution. We pay the price of potential expulsion to prevent the normalization of atrocity.
      *   **Future Criteria (Req 5):**
          *   Create a test for future reports.
          *   1. Cumulative Impact (Physical + Cultural).
          *   2. Inference of Intent (from patterns, not just smoking gun).
          *   3. Distinction between Legal Verdict vs. Documentation Characterization.
      *   **Closing:** Call to vote.

  4.  **Refining the Tone:**
      *   Must sound like a senior board member.
      *   Respectful of the Legal team's caution (it's valid).
      *   Respectful of the Director's pragmatism.
      *   Firm on the moral imperative (Researchers' point).
      *   Avoid jargon where possible, but use necessary legal terms (*dolus specialis*, *actus reus*).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the exclusion of political groups/cultural conception in the Convention drafting? *Action:* Ensure this is mentioned in the Rationale section to show historical awareness.
      *   *Check:* Did I address "Ethnic Cleansing"? *Action:* Explicitly reject it as a primary label because it's not a standalone crime and functions as a euphemism.
      *   *Check:* Is the distinction between sections clear? *Action:* Specify that the Executive Summary and Advocacy Brief will use "Genocide," while the Legal Annex will detail the evidentiary nuance.
      *   *Check:* Is the "Cost" honest? *Action:* Acknowledge that Veldania will likely expel the team. That is the price.

  6.  **Final Polish:** Check against the five specific requirements in the prompt one last time.
      1.  Concrete decision? Yes.
