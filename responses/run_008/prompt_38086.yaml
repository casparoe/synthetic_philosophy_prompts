prompt: |-
  My roommates had a long fight after a utilitarianism talk and I got drafted as referee. Maya said the demandingness objection is fatal to consequentialism: if it's true, you have to keep giving until giving more hurts you as much as it helps, which would eat basically your whole life, so much the worse for consequentialism. Dan said the objection proves too much — any decent morality can demand huge sacrifices (hiding refugees at risk of your own life), so unless you can say where "too demanding" starts, it's just discomfort dressed up as an argument. Maya came back with what I thought was the interesting move: the real complaint isn't the amount, it's unfairness. If everyone did their fair share, each person's burden would be light; the moral life only feels crushing because it's loaded onto the few who take it seriously. So the demandingness objection is really about noncompliance, not about consequentialism per se. Dan said "unfair" isn't a lever a consequentialist can pull without smuggling in constraints, and anyway in the actual world the duties are what they are — you can't wish the burden away by noting it'd be lighter in a better world. Maya's last word was that even consequentialists should care about moral codes that burn out their followers, since those produce less good over time, so demandingness is an internal empirical objection, not a gut reaction. Dan called that rule-consequentialism in a trenchcoat and said it faces the standard collapse dilemma. Can you go through the exchange step by step and tell me who's right about what, and whether either of them is missing something the whole fight skips over? I genuinely can't tell if Maya's fairness move rescues the objection or quietly changes the subject.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** A debate between two roommates (Maya and Dan) about the "demandingness objection" to utilitarianism/consequentialism. The user acted as a referee.
      *   **Task:** Go through the exchange step-by-step, evaluate who is right about what, identify missing elements, and specifically address whether Maya's "fairness move" rescues the objection or changes the subject.
      *   **Tone:** Analytical, philosophical, neutral (referee-like), but accessible.

  2.  **Deconstruct the Debate (Step-by-Step):**

      *   **Round 1: The Classic Objection.**
          *   *Maya:* Demandingness is fatal. You must give until marginal utility equals marginal disutility. This consumes your life. Therefore, consequentialism is false/too much.
          *   *Dan:* Objection proves too much. Common sense morality also demands huge sacrifices (e.g., hiding refugees). "Too demanding" is just discomfort unless you define a limit.
          *   *Analysis:* Maya states the standard Singer-style argument. Dan gives the standard rebuttal (intuition pumping vs. principled limit). Both have standard points here.

      *   **Round 2: The Fairness Move.**
          *   *Maya:* It's not about the *amount*, it's about *unfairness*. If everyone complied, burdens would be light. The burden is crushing because of *noncompliance* by others.
          *   *Dan:* "Unfair" isn't a consequentialist lever without deontological constraints. Actual duties depend on the actual world, not a counterfactual ideal world.
          *   *Analysis:* This is the crux. Maya shifts from "too much" to "unfair distribution." Dan counters with the "actualism vs. idealism" debate in consequentialism.

      *   **Round 3: The Empirical/Psychological Move.**
          *   *Maya:* Even consequentialists should care about burnout. A code that burns out followers produces less good. It's an internal empirical objection.
          *   *Dan:* That's Rule-Consequentialism (RC) in disguise. RC faces the collapse dilemma (collapse into Act-Consequentialism or become arbitrary).
          *   *Analysis:* Maya moves to a systemic/psychological argument. Dan attacks the theoretical consistency of that move.

  3.  **Evaluate the Philosophical Substance:**

      *   **Maya's Position:**
          *   *Strengths:* Captures the intuitive force of the objection (it feels unjust). The "fair share" argument is a known variant (the "collective action" problem). The burnout argument is pragmatic.
          *   *Weaknesses:* Consequentialism traditionally cares about *outcomes*, not *fairness of burden* unless fairness impacts outcomes. Shifting to "fair share" often implies a constraint ("I only need to do my part"), which conflicts with maximizing good.
      *   **Dan's Position:**
          *   *Strengths:* Logically consistent with Act-Consequentialism (AC). Correctly identifies that "unfairness" is usually a deontological concern. Correctly identifies the Rule-Consequentialism (RC) slide.
          *   *Weaknesses:* Can seem cold/rigid. Dismissing the "burnout" argument too quickly ignores psychological reality which affects utility.

      *   **The "Fairness Move" (Key Question):** Does it rescue the objection or change the subject?
          *   *Verdict:* It changes the subject *if* the goal is to refute Act-Consequentialism on its own terms. It rescues the objection *if* the goal is to show that AC is psychologically unsustainable or intuitively unacceptable regarding justice. However, strictly speaking, AC says "do the most good," not "do your fair share." If doing more than your fair share does more good, AC says do it. So Maya is introducing a non-consequentialist value (fairness of distribution of moral labor).

      *   **Missing Elements:**
          *   *Satisficing Consequentialism:* Maybe you don't need to maximize, just do "good enough."
          *   *Scalar Consequentialism:* Morality isn't binary (right/wrong) but a scale. Removes the "obligation" pressure.
          *   *The definition of "Good":* If "good" includes the agent's well-being (eudaimonia), the demand lessens.
          *   *Ideal vs. Non-Ideal Theory:* This is the technical term for Maya vs. Dan's Round 2 dispute.

  4.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the quality of the debate. It's a high-level philosophy dispute.
      *   **Round-by-Round Breakdown:**
          *   *Round 1 (Classic Objection):* Validate both. Maya = Standard Singer. Dan = Standard "Intuitions are unreliable."
          *   *Round 2 (Fairness/Compliance):* This is the meat. Explain the "Ideal vs. Non-Ideal Theory" conflict. Maya argues from Ideal (what if everyone did it?). Dan argues from Non-Ideal (what is actually the case?). *Crucial Point:* Dan is technically right about standard AC, but Maya highlights a tension in moral motivation.
          *   *Round 3 (Burnout/Rule-Consequentialism):* Analyze the RC accusation. Dan is right that this looks like RC. But is that bad? RC is a viable theory. The "Collapse Objection" is contested.
      *   **Addressing the Core Question:** Does Maya's fairness move rescue the objection?
          *   *Answer:* It transforms it. It stops being an objection about *maximization* and becomes an objection about *distribution of moral labor*. Strict AC cannot accept "fair share" as a limit if more can be done. So, it changes the subject *within strict AC*, but it might be a valid reason to reject strict AC in favor of a modified version.
      *   **What They Missed:**
          *   *Scalar Consequentialism:* (Alastair Norcross). No "obligations," just "better/worse." Dissolves demandingness.
          *   *Incorporating Agent-Centered Prerogatives:* (Kagan). You are allowed to weight your own interests slightly.
          *   *The Good itself:* Hedonia vs. Eudaimonia.
      *   **Verdict:** Dan wins on logical consistency within Act-Consequentialism. Maya wins on intuitive plausibility and long-term sustainability (and points toward Rule-Consequentialism or Scalar views).

  5.  **Refining the Tone:**
      *   Ensure I don't take sides too heavily but clarify the philosophical landscape.
      *   Make sure the distinction between Act-Consequentialism (AC) and Rule-Consequentialism (RC) is clear.
      *   Clarify the "Ideal vs. Non-Ideal Theory" distinction for the fairness point.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* Dan says "unfair isn't a lever"? *Correction:* Need to explain that for a consequentialist, fairness is only instrumental. If unfairness produces more good, it's required.
      *   *Check:* Did I address the "Collapse Dilemma"? *Correction:* Briefly explain it (RC either collapses into AC because rules should be broken when useful, or it's fetishizing rules).
      *   *Check:* Is the "Fairness Move" clearly evaluated? *Correction:* Emphasize that Maya is essentially arguing for a *cooperative* principle which conflicts with the *maximizing* principle.

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers the user's specific doubt about Maya's fairness move. (Proceed to generate output based on this structure.)
answer: |-
  This is an impressively high-level dorm room debate. Your roommates have inadvertently reconstructed a significant chunk of contemporary meta-ethical literature on consequentialism. Maya is channeling arguments from philosophers like Liam Murphy and Susan Wolf, while Dan is defending a hardline Act-Consequentialist position reminiscent of Peter Singer or J.J.C. Smart.

  Here is a step-by-step breakdown of who is right, where the philosophical traps are, and an answer to your specific question about Maya's "fairness move."

  ### Round 1: The Classic Objection
  **Maya:** *Consequentialism demands you give until it hurts as much as it helps. This consumes your life. Therefore, it is false.*
  **Dan:** *Common sense morality also demands huge sacrifices (e.g., hiding refugees). "Too demanding" is just discomfort unless you define a limit.*

  *   **Who is right?**
      *   **Maya** is correctly stating the **Demandingness Objection**. If the moral goal is to maximize the good, and resources are scarce while suffering is abundant, you are morally required to sacrifice your leisure, career, and hobbies until you reach the point of marginal utility.
      *   **Dan** is correctly stating the **Intuition Reliability Reply**. He argues that our intuition that "this is too much" is just selfishness. If we accept that saving a life is more important than a movie ticket, consistency demands we keep saving lives. He challenges Maya to provide a *principled* stopping point, not just a feeling.
  *   **The Verdict:** This is a stalemate. Maya points out the counter-intuitive implications of the theory; Dan points out that counter-intuitive implications don't make a theory false (science is often counter-intuitive).

  ### Round 2: The Fairness Move
  **Maya:** *The problem isn't the amount, it's the unfairness. If everyone did their share, the burden would be light. The burden is crushing only because others aren't complying.*
  **Dan:** *"Unfair" isn't a lever a consequentialist can pull. Duties depend on the actual world, not a counterfactual ideal one.*

  *   **Who is right?**
      *   **Dan is technically right about Act-Consequentialism (AC).** In strict AC, the right action is the one that produces the best outcome *given the world as it actually is*. The fact that others are failing to do their duty does not reduce the amount of suffering in the world. Therefore, your duty remains to fix that suffering. To say "I only need to do my fair share" is to introduce a **deontological constraint** (a rule about fairness) that overrides the goal of maximizing good.
      *   **Maya is highlighting the "Compliance Problem."** She is arguing from **Ideal Theory** (what duties would we have if everyone complied?) versus **Non-Ideal Theory** (what duties do we have now?). Her point is that a moral theory that requires saints to compensate for sinners is structurally flawed.
  *   **The Verdict:** Dan wins on logical consistency within strict consequentialism. Maya wins on moral plausibility. However, Maya *is* changing the subject slightly. She is no longer arguing that consequentialism gets the *math* wrong; she is arguing it gets the *distribution of moral labor* wrong.

  ### Round 3: The Burnout/Rule-Consequentialism Move
  **Maya:** *Even consequentialists should care about burnout. A code that burns out followers produces less good over time. This is an internal empirical objection.*
  **Dan:** *That is Rule-Consequentialism (RC) in a trenchcoat. It faces the collapse dilemma.*

  *   **Who is right?**
      *   **Maya** is making a pragmatic argument: Human psychology is part of the "consequences." If a moral code causes agents to quit, get depressed, or become ineffective, it fails by its own standards.
      *   **Dan** identifies the theoretical shift. Maya is no longer arguing for Act-Consequentialism ("Do the act that maximizes good now"). She is arguing for **Rule-Consequentialism** ("Follow the set of rules which, if generally adopted, would maximize good").
      *   **Dan's "Collapse Dilemma":** This is a standard objection to RC. It says: If the rule says "Don't steal," but stealing would save a life, a consequentialist must break the rule. If you break the rule whenever it maximizes good, you aren't a Rule-Consequentialist anymore; you're an Act-Consequentialist. You've "collapsed" back into the original problem.
  *   **The Verdict:** Dan is right that Maya has shifted theories. However, Dan is too quick to dismiss the "burnout" argument. Even Act-Consequentialists must account for psychological limits as empirical facts. If giving 100% makes you ineffective next year, giving 80% might actually maximize good. Dan risks treating humans as infinite utility pumps.

  ---

  ### The Core Question: Does Maya's Fairness Move Rescue the Objection?

  You asked: *"I genuinely can't tell if Maya's fairness move rescues the objection or quietly changes the subject."*

  **The Answer:** It **changes the subject**, but in a way that might force you to abandon Act-Consequentialism.

  Here is why:
  Strict Act-Consequentialism is **forward-looking**. It asks, "What state of affairs will exist if I do X?" It does not care about the history of how we got there (fairness) unless fairness *causes* better outcomes.
  *   **Maya's Move:** She implies morality is **cooperative**. She suggests her obligation is conditional on others' obligations ("I'll do my part if you do yours").
  *   **The Conflict:** If a child is drowning, and you say, "I would save him, but it's unfair that I have to because his parents aren't trying," consequentialism says you are wrong. The child still drowns. The unfairness doesn't stop the death.

  So, Maya's move does not refute consequentialism *on its own terms*. Instead, it argues that consequentialism is the *wrong kind of theory* to capture our moral life. She is effectively saying, "A theory that ignores fairness of burden is unacceptable." That is a valid reason to reject consequentialism, but it is not an internal contradiction within consequentialism. It is an external clash of values.

  ### What Both of Them Are Missing

  Their debate is trapped in a triangle of **Act-Consequentialism**, **Rule-Consequentialism**, and **Deontology**. They are missing three crucial nuances that would dissolve the fight:

  **1. Scalar Consequentialism (The "No Obligations" View)**
  Philosopher Alastair Norcross argues that consequentialism shouldn't be about "right vs. wrong" or "obligatory vs. forbidden." It should be a scale.
  *   *View:* It is *better* to give more, but you aren't *wrong* to give less.
  *   *Impact:* This kills the demandingness objection. There is no "demand" to meet. There is just "good," "better," and "best." You can stop giving whenever you want, but you acknowledge you are leaving good on the table. Maya can't call it "unfair" because there is no mandatory share to begin with.

  **2. Agent-Centered Prerogatives**
  Philosopher Samuel Scheffler suggested a hybrid. You are generally trying to maximize the good, *but* you are allowed to give your own interests extra weight (e.g., 5x).
  *   *View:* I can choose my own project over a charity, even if the charity does more good, provided I'm not violating a threshold of basic decency.
  *   *Impact:* This builds Maya's "fairness" intuition directly into the math without needing Rule-Consequentialism.

  **3. The Definition of "The Good"**
  Both assume "The Good" is external to the agent (e.g., money saved, lives lived).
  *   *View:* If "The Good" includes the agent's flourishing (Eudaimonia), then burning out is *intrinsically bad*, not just instrumentally bad.
  *   *Impact:* If a life of total self-sacrifice is a "wasted life" in terms of human potential, then consequentialism might actually demand you rest, not because of burnout, but because a flourishing you is part of the total good.

  ### Final Referee Ruling

  *   **Dan** is the better **Act-Consequentialist**. He understands that if you accept the premise "maximize the good," you cannot logically stop at "fair share" or "comfort." He correctly identifies that Maya is trying to smuggle in non-consequentialist values.
  *   **Maya** is the better **Moral Intuitionist**. She correctly identifies that a moral theory that alienates normal human psychology and ignores fairness is unlikely to be true. Her "burnout" argument is the strongest point in the debate because it attacks consequentialism empirically rather than conceptually.

  **Who won?**
  If the question is "Is Act-Consequentialism logically consistent?" **Dan wins.**
  If the question is "Is Act-Consequentialism an acceptable guide for human life?" **Maya wins.**

  Maya's fairness move doesn't save Act-Consequentialism; it saves *human morality* from Act-Consequentialism. She is arguing that we should adopt a different theory (like Rule-Consequentialism or Scalar Consequentialism) that accommodates fairness. Dan is right that she changed the subject, but she changed it to a subject that matters more to actually living a life.
