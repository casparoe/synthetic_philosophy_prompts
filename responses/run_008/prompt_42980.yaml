      *   *Verdict:* The Philosopher is attacking a version of OT that assumes *arbitrary, potentially incoherent* goals can be stably maintained. The Postdoc is defending OT as *arbitrary coherent* goals are possible. They are arguing past each other on the definition of "Goal."

