      *   Check the math on the profile one last time.
          *   M1: R=1, T=1, O=1
          *   M2: R=1, T=0, O=0
          *   M3: R=0, T=1, O=0
          *   M4: R=1, T=0, O=0
          *   M5: R=0, T=1, O=0
          *   Sum R: 1+1+0+1+0 = 3 (Pass)
          *   Sum T: 1+0+1+0+1 = 3 (Pass)
          *   Sum O: 1+0+0+0+0 = 1 (Fail)
          *   Logic: Pass & Pass = Offer.
          *   Conflict: Premise Method = Offer. Conclusion Method = No Offer.
      *   Wait, I need to assign these profiles to students *secretly*. I will create handouts.
      *   Committee 3 (Chair): The prompt asks for "Chair decides alone after non-binding straw poll." I need to ensure this yields a distinct outcome or highlights the authority issue. If the Chair is M1, they Hire. If M2-5, they No Hire. Let's make the Chair M1 to force a "Hire" against the poll, highlighting the tension between authority and consensus. Or make the Chair M2 to align with the poll but contradict the rule. Let's make the Chair M2 (No Hire) to align with the Conclusion vote, making Committee 1 the outlier. Actually, having all three produce different results is messy.
      *   *Better:*
          *   Comm 1 (Premise): Outcome = Hire (Mechanical).
          *   Comm 2 (Conclusion): Outcome = No Hire (Mechanical).
