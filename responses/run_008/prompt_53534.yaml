prompt: |-
  I teach an upper-level PPE seminar on collective choice. My sixteen students have already worked through majority cycling and the Condorcet paradox over options, but they have not yet encountered judgment aggregation. I have one 90-minute session and want a staged activity in which they run into the discursive dilemma — a case where a majority of the committee endorses each premise of a decision rule while a majority rejects the conclusion the rule licenses — before anyone has a name for it.

  The scenario I want them immersed in: parallel appointments committees deciding whether to recommend a job offer for a final-round candidate, governed by a written rule the committee itself ratified at an earlier (fictional) meeting — an offer goes forward if and only if the candidate clears both a research bar and a teaching bar. Individual ballots should record each member's judgment on each premise and on the offer itself. Divide the class into three committees reviewing identical candidate files but using three different aggregation procedures: one that votes premise-by-premise and then applies the rule mechanically; one that votes only on the bottom-line question; one where the chair decides alone after a non-binding straw poll. You will need to construct the judgment profiles — how many members accept or reject each premise and the offer — so that the conflict actually fires and the committees reach different outcomes on the same evidence. Give me the profiles and the reasoning behind those numbers, including at least one member whose pattern of judgments makes the tension vivid when it is revealed.

  Additional elements to design: roles for students who are not on a committee (chair for each panel, a tally-keeper, and one designated dissenter whose scripted job is to raise a procedural objection at a set moment); a prediction pool among the observers, paid in tokens rather than money, on which committees will recommend the offer; and a revision round in one committee only, run after the premise tallies are posted there, so members can change their conclusion votes — I want the debrief to be able to distinguish people changing their minds from people changing their votes.

  The plenary comparison and debrief should map what happened onto the distinction between aggregating premises and aggregating conclusions, and should explicitly contrast it with the cycling they already know: inconsistent collective judgments across interconnected propositions are not the same phenomenon as cyclic preferences over fixed options, and I want them to see why. The term discursive dilemma should not appear until the final minutes.

  Then the practical notes. Tell me what will predictably go wrong the first time I run it — including that sharp students will spot the inconsistency mid-round and try to renegotiate the decision rule, that some will vote insincerely once they see where the tallies point, and that a committee may converge on a compromise the profiles were not built to produce — and how I should handle each case without shutting down the very friction the activity exists to create. Finally, an honest paragraph on which feature of the real result the activity cannot reproduce: they will experience one hand-built conflict under three procedures in one session, and I need to know exactly what I must supply in the debrief to gesture at the general impossibility results for aggregation on interconnected propositions without being in a position to prove anything to them.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Upper-level PPE (Philosophy, Politics, Economics) seminar, 16 students.
      *   **Prior Knowledge:** Majority cycling, Condorcet paradox. *No* prior knowledge of judgment aggregation/discursive dilemma.
      *   **Goal:** A 90-minute staged activity where students experience the Discursive Dilemma (Premise-based vs. Conclusion-based aggregation) without knowing the name until the end.
      *   **Scenario:** Parallel appointments committees (3 committees) deciding on a job offer based on a rule: Offer $\iff$ Research $\land$ Teaching.
      *   **Committee Structures:**
          1.  Premise-based (vote on R & T, apply rule).
          2.  Conclusion-based (vote on Offer directly).
          3.  Chair-decision (after non-binding straw poll).
      *   **Requirements:**
          *   Construct judgment profiles (who votes what) to ensure the conflict fires (majority on premises $\neq$ majority on conclusion).
          *   Include specific roles (Chair, Tally-keeper, Dissenter).
          *   Include a prediction pool (tokens).
          *   Include a revision round in *one* committee (change conclusion votes after seeing premise tallies).
          *   Debrief: Map to premise vs. conclusion aggregation, contrast with Condorcet cycling, introduce term "Discursive Dilemma" at the very end.
          *   Practical Notes: Predict failure modes (renegotiation, insincere voting, compromise) and how to handle them.
          *   Limitations: Acknowledge what the activity *can't* show (general impossibility theorems) and how to bridge that in debrief.

  2.  **Designing the Judgment Profiles (The Math):**

      *   *Constraint:* 16 students total.
      *   *Committee Size:* To get clear majorities, odd numbers are best. Let's aim for 5 members per committee. That's 15 students. The 16th student can be the "Game Master/Tally Master" for the whole room or a floating observer. Let's make the 16th student the central Tally-keeper/Observer Coordinator to manage the prediction pool.
      *   *The Rule:* Offer ($O$) iff Research ($R$) AND Teaching ($T$). Logically: $O \leftrightarrow (R \land T)$.
      *   *The Dilemma:* We need a profile where Majority($R$) = Yes, Majority($T$) = Yes, but Majority($O$) = No.
      *   *Committee 1 (Premise-Based):* They vote on $R$ and $T$. The outcome is derived.
      *   *Committee 2 (Conclusion-Based):* They vote on $O$. The premises are ignored for the decision.
      *   *Committee 3 (Chair):* Chair decides, influenced by straw poll.
      *   *The Profile:* Need 5 members.
          *   Member 1: $R=1, T=1, O=1$ (Consistent)
          *   Member 2: $R=1, T=0, O=0$ (Consistent)
          *   Member 3: $R=0, T=1, O=0$ (Consistent)
          *   Member 4: $R=1, T=1, O=1$ (Consistent)
          *   Member 5: $R=1, T=0, O=0$ (Consistent)
          *   *Check:*
              *   $R$: 1, 1, 0, 1, 1 $\rightarrow$ 4 Yes (Majority Yes)
              *   $T$: 1, 0, 1, 1, 0 $\rightarrow$ 2 Yes (Majority No) -> *Wait, I need Majority Yes on T too.*
      *   *Revised Profile for Dilemma:*
          *   Member 1: $R=1, T=1 \rightarrow O=1$
          *   Member 2: $R=1, T=0 \rightarrow O=0$
          *   Member 3: $R=0, T=1 \rightarrow O=0$
          *   Member 4: $R=1, T=1 \rightarrow O=1$
          *   Member 5: $R=1, T=1 \rightarrow O=1$ ... No, that makes $O$ majority yes.
      *   *Standard Discursive Dilemma Profile (3 members):*
          *   1: $R=1, T=1 \rightarrow O=1$
          *   2: $R=1, T=0 \rightarrow O=0$
          *   3: $R=0, T=1 \rightarrow O=0$
          *   *Result:* $R$ (2-1 Yes), $T$ (2-1 Yes), $O$ (1-2 No).
      *   *Scaling to 5 members:*
          *   1: $R=1, T=1, O=1$
          *   2: $R=1, T=1, O=1$
          *   3: $R=1, T=0, O=0$
          *   4: $R=0, T=1, O=0$
          *   5: $R=1, T=0, O=0$
          *   *Tally:* $R$: 4 Yes, 1 No (Pass). $T$: 2 Yes, 3 No (Fail). *Still not working.* I need both premises to pass majority, but conclusion to fail.
      *   *Correct 5-member Profile:*
          *   1: $R=1, T=1, O=1$
          *   2: $R=1, T=1, O=1$
          *   3: $R=1, T=0, O=0$
          *   4: $R=0, T=1, O=0$
          *   5: $R=1, T=1, O=0$ **(The Tension Member)** -> *Wait, if R=1 and T=1, logic dictates O=1. If they vote O=0, they are logically inconsistent individually.*
          *   *Crucial Point:* The Discursive Dilemma usually assumes individuals are *logically consistent*. The collective becomes inconsistent.
          *   *Let's try again with consistent individuals:*
          *   1: $R=1, T=1 \rightarrow O=1$
          *   2: $R=1, T=0 \rightarrow O=0$
          *   3: $R=0, T=1 \rightarrow O=0$
          *   4: $R=1, T=0 \rightarrow O=0$
          *   5: $R=0, T=1 \rightarrow O=0$
          *   *Tally:*
              *   $R$: 1, 1, 0, 1, 0 $\rightarrow$ 3 Yes (Majority Pass)
              *   $T$: 1, 0, 1, 0, 1 $\rightarrow$ 3 Yes (Majority Pass)
              *   $O$: 1, 0, 0, 0, 0 $\rightarrow$ 1 Yes (Majority Fail)
          *   *Perfect.* This creates the dilemma.
          *   *The "Tension Member":* Member 1 is the only one saying "Hire". Members 2-5 say "No Hire". But 2-5 split on *why* (Research vs Teaching).
      *   *Committee Assignment:* All three committees get the *same* underlying judgments (the profile above).
      *   *Committee 1 (Premise):* Tallies $R$ and $T$. Both pass. Rule says Offer. Outcome: **Hire**.
      *   *Committee 2 (Conclusion):* Tallies $O$. 1 Yes, 4 No. Outcome: **No Hire**.
      *   *Committee 3 (Chair):* Chair is Member 1 (Pro-Hire). Straw poll shows 1 Yes, 4 No. Chair decides? If Chair follows rule, they Hire. If Chair follows poll, No Hire. Let's make the Chair's instruction: "You have final authority, but consider the poll." This creates ambiguity for the debrief. Better: Make the Chair a Member 2 type (Anti-Hire, Pro-Research).
      *   *Wait, I need 16 students.*
          *   3 Committees $\times$ 5 Members = 15 Students.
          *   1 Student = Lead Facilitator/Observer (manages tokens).
      *   *Roles within Committees:*
          *   Chair (runs discussion).
          *   Tally-keeper (records votes).
          *   Dissenter (scripted objection).
          *   2 Regular Members.
      *   *Revision Round:* Committee 2 (Conclusion-based) does the revision. After seeing Committee 1's premise results posted on the board, Committee 2 is allowed to revote on $O$. This tests if public reason changes private judgment.

  3.  **Structuring the 90 Minutes:**

      *   0-10: Setup & Rules. Distribute profiles.
      *   10-30: Committee Deliberation & Voting (Round 1).
      *   30-40: Prediction Pool & Posting Results.
      *   40-50: Revision Round (Committee 2 only).
      *   50-75: Plenary Debrief (The core intellectual work).
      *   75-90: Naming the Dilemma & Limitations.

  4.  **Drafting the Content:**

      *   *Profiles:* Use the 5-member consistent profile derived above.
      *   *Roles:* Assign specifically.
      *   *Tokens:* Simple betting on "Hire" vs "No Hire".
      *   *Dissenter Script:* Needs to point out the inconsistency without using the term "Discursive Dilemma." E.g., "Wait, we just said Yes to Research and Yes to Teaching. How can we say No to the Offer?"
      *   *Handling Failure Modes:*
          *   *Renegotiation:* If they try to change the rule ("Let's just vote on the offer"), the instructor must intervene as the "Constitution" enforcer. "The rule was ratified previously."
          *   *Insincere Voting:* If they vote strategically, note it in debrief.
          *   *Compromise:* If they find a way out, acknowledge it as a real-world solution (negotiation) vs. mechanical aggregation.
      *   *Limitations:* This is one profile. It doesn't prove *all* rules fail (List & Pettit theorem). Need to explain that this isn't a glitch, it's a structural feature of logic + majority rule.

  5.  **Refining the Debrief (Contrast with Condorcet):**

      *   Condorcet: Preferences over options (A > B > C > A). Intransitive *preferences*.
      *   Discursive Dilemma: Judgments over propositions (P, Q, P&Q). Inconsistent *beliefs/judgments*.
      *   Key distinction: Cycling is about *ranking*; Dilemma is about *logical closure*.

  6.  **Review against Constraints:**

      *   16 students? Yes (15 on committees, 1 observer).
      *   90 minutes? Yes.
      *   No name until end? Yes.
      *   Revision round in one committee? Yes (Committee 2).
      *   Prediction pool? Yes.
      *   Practical notes on failure? Yes.
      *   Limitations paragraph? Yes.

  7.  **Final Polish:**

      *   Ensure the "Tension Member" (Member 1) is highlighted. They are the only one voting Yes on Offer, but their logic is the only one fully aligned with the Premise-based outcome.
