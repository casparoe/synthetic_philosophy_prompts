answer: |-
  Here is a complete design for your 90-minute session, including the judgment profiles, role assignments, run of show, and debriefing strategy.

  ### 1. The Scenario and Judgment Profiles

  **The Rule:** The Department Charter (ratified previously) states: *An offer is recommended if and only if the candidate meets the Research Bar (R) AND the Teaching Bar (T).*
  **The Logic:** $Offer \leftrightarrow (Research \land Teaching)$.

  **The Profile (The "Dilemma Set"):**
  You have 15 committee members (5 per committee) and 1 Observer/Banker. All three committees receive the **exact same** distribution of private judgment profiles. This ensures the *evidence* is identical; only the *procedure* differs.

  | Member | Research (R) | Teaching (T) | Offer (O) | Logic Check |
  | :--- | :---: | :---: | :---: | :--- |
  | **M1** | Yes | Yes | **Yes** | Consistent |
  | **M2** | Yes | No | **No** | Consistent |
  | **M3** | No | Yes | **No** | Consistent |
  | **M4** | Yes | No | **No** | Consistent |
  | **M5** | No | Yes | **No** | Consistent |
  | **Tally** | **3 Yes** (Pass) | **3 Yes** (Pass) | **1 Yes** (Fail) | **Conflict** |

  **The Tension:**
  *   **Premise Majority:** Research passes (3-2), Teaching passes (3-2). Mechanical application of the rule dictates **Offer**.
  *   **Conclusion Majority:** Offer fails (1-4). Direct vote dictates **No Offer**.
  *   **The Vivid Member:** **Member 1** is the critical actor. They are the *only* person voting "Yes" on the Offer. In Committee 1 (Premise), their view wins mechanically despite being the minority opinion on the bottom line. In Committee 2 (Conclusion), they are utterly overruled. In Committee 3 (Chair), their fate depends entirely on who sits in the Chair.

  **Distribution:**
  *   **Committee 1 (Premise-Based):** Assign profiles M1–M5.
  *   **Committee 2 (Conclusion-Based):** Assign profiles M1–M5.
  *   **Committee 3 (Chair Authority):** Assign profiles M1–M5. **Crucial:** Assign **Member 2** (Research Yes, Teaching No, Offer No) as the **Chair**. This ensures the Chair's personal judgment aligns with the Conclusion Majority (No Offer) but contradicts the Premise Majority (Offer).
  *   **Student 16 (Observer/Banker):** Manages the token pool and writes final tallies on the board.

  ---

  ### 2. Roles and Logistics

  **Committee Roles (Assign within each group of 5):**
  1.  **Chair:** Facilitates discussion, enforces voting procedure. (In Comm 3, this role has decision power).
  2.  **Tally-Keeper:** Records votes on a private sheet.
  3.  **Dissenter:** (Assign to **Committee 1, Member 3**). Scripted objection (see Run of Show).
  4.  **Members:** Two regular voting members.

  **Prediction Pool (Tokens):**
  *   Give each of the 15 committee members 2 tokens at the start.
  *   **Bet:** Before deliberation begins, students privately bet on the final outcome of *their own* committee (Hire vs. No Hire).
  *   **Payoff:** 1 token if correct, 0 if wrong. (Keep it low stakes to avoid gambling distraction, high enough to incentivize attention).
  *   **Observer:** Collects bets, holds pot, pays out at the end.

  **Materials:**
  *   **Ballot Cards:** Each student gets a card with three checkboxes: [R: Y/N], [T: Y/N], [O: Y/N]. They must fill all three out for internal consistency, even if their committee only votes on one.
  *   **Procedure Cards:** Hand each Committee a card defining their aggregation rule.
      *   *Comm 1:* "Tally R and T separately. Apply Charter Rule. Ignore O votes for the decision."
      *   *Comm 2:* "Tally O only. Ignore R and T for the decision."
      *   *Comm 3:* "Conduct non-binding straw poll on O. Chair makes final decision."

  ---

  ### 3. Run of Show (90 Minutes)

  **0:00–0:10: Setup & Distribution**
  *   Divide class. Hand out Procedure Cards, Ballot Cards, and Profile Sheets (secretly assign M1–M5 roles).
  *   Explain the Charter Rule ($O \leftrightarrow R \land T$). Emphasize this rule is *fixed*; they cannot change it.
  *   Run Prediction Pool (students wager tokens).

  **0:10–0:30: Deliberation & Round 1 Voting**
  *   Committees meet separately (corners of the room).
  *   **Committee 1:** Discuss R and T. Vote on R and T. Tally-Keeper calculates outcome based on Rule.
      *   *Scripted Moment:* After R and T are tallied (both Pass), but before the decision is announced, **The Dissenter (M3)** stands and says: *"Wait. Four of us voted 'No' on the Offer card. Only one voted 'Yes'. By what authority does the mechanical rule override the direct will of the majority on the final question?"*
      *   Chair must rule on this (usually: "The Charter binds us") and announce **Hire**.
  *   **Committee 2:** Discuss O. Vote on O. Announce **No Hire**.
  *   **Committee 3:** Straw poll on O (Result: 1 Yes, 4 No). Chair (M2) deliberates. Announce **No Hire** (aligning with poll/personal view).

  **0:30–0:40: Posting & Prediction Check**
  *   Observer writes outcomes on the board:
      *   Comm 1: **HIRE**
      *   Comm 2: **NO HIRE**
      *   Comm 3: **NO HIRE**
  *   Observer pays out tokens for Round 1 predictions.
  *   **Crucial Step:** The Observer posts the *Premise Tallies* from Committee 1 on the main board (Research: 3-2 Pass; Teaching: 3-2 Pass). Committee 2 and 3 can see this.

  **0:40–0:50: Revision Round (Committee 2 Only)**
  *   **Instruction:** "Committee 2, you see the Premise Tallies from Committee 1. You are allowed 5 minutes to reconsider your Conclusion votes. You may change your vote on the Offer. Committee 1 and 3, observe silently."
  *   **Goal:** See if public reason (the premise tallies) shifts private judgment on the conclusion.
  *   **Likely Outcome:** Some may switch to "Hire" (convinced by the premises), others may dig in (strategic or principled).
  *   Record final Comm 2 outcome.

  **0:50–1:15: Plenary Debrief (The Intellectual Core)**
  *   **Step 1: The Fact of Divergence.** Ask: "Same candidate, same rule, same individual judgments. Why three outcomes?"
  *   **Step 2: Premise vs. Conclusion.** Elicit the distinction. Comm 1 aggregated *reasons*; Comm 2 aggregated *decisions*.
      *   *Ask Comm 1:* "Did you feel democratic? You overruled 4/5 members on the bottom line."
      *   *Ask Comm 2:* "Did you feel consistent? You rejected the offer while accepting the sufficient conditions for the offer."
  *   **Step 3: Contrast with Condorcet.**
      *   *Prompt:* "How is this different from the cycling we studied last week?"
      *   *Target Answer:* Cycling is about **preferences** (A > B > C > A). It's intransitive ranking. This is about **judgments** (P, Q, therefore P&Q). It's logical inconsistency.
      *   *Key Point:* In cycling, the group has no stable *will*. In the discursive dilemma, the group has no consistent *mind*. One violates rationality of choice; the other violates rationality of belief.
  *   **Step 4: The Revision Round.** Ask Comm 2 members who switched: "Why did you change?" (Reason-based persuasion). Ask those who didn't: "Why hold firm?" (Integrity of initial judgment or strategic voting).

  **1:15–1:30: Naming and Limitations**
  *   **The Reveal:** Introduce the term **Discursive Dilemma** (or Doctrinal Paradox). Cite Kornhauser & Sager (1986) or List & Pettit (2002).
  *   **The Limitations (See Section 5):** Explain what this single run *cannot* prove (general impossibility).
  *   **Token Payout:** Final settlement.

  ---

  ### 4. Practical Troubleshooting: What Will Go Wrong

  **1. "Let's Change the Rule"**
  *   **The Risk:** Sharp students in Committee 1 will realize the dilemma immediately and propose voting on the Offer instead of the premises to "fix" the inconsistency.
  *   **The Fix:** You must play the "Constitutional Court." Intervene firmly: *"The Charter was ratified last semester. You are a sub-committee. You have authority to apply the rule, not amend it. If you violate the procedure, your recommendation is void."* This friction is necessary; it simulates real-world institutional constraints.

  **2. Insincere Voting (Strategic Manipulation)**
  *   **The Risk:** In Committee 2, Member 1 (the only "Hire" voter) might see the premises on the board and realize they are "right" logically. Or, in Committee 1, the "No" voters might vote "No" on Research just to tank the Offer, even if they think Research was good.
  *   **The Fix:** Do not stop it. In the debrief, ask: *"Did anyone vote against their true judgment to achieve a desired outcome?"* This opens the door to discuss strategy-proofness in judgment aggregation (a key advanced topic).

  **3. The "Compromise" Solution**
  *   **The Risk:** Committee 1 might say, "Okay, R and T passed, but barely. Let's recommend a 'Visit' instead of an 'Offer'."
  *   **The Fix:** The ballot options are binary (Offer/No Offer). If they invent a third option, count it as "No Offer" for the sake of the experiment, but note in the debrief that **agenda control** is one way real committees escape the dilemma.

  **4. The Chair's Burden (Committee 3)**
  *   **The Risk:** The Chair (M2) might feel pressured to follow the straw poll (4-1 No) even though the Premise logic (visible on the board) suggests Hire.
  *   **The Fix:** This is a feature, not a bug. In the debrief, ask the Chair: *"Did you feel more responsible for the logical consistency or the consensus?"* This highlights the difference between *responsibility* (Chair) and *aggregation* (Committees 1 & 2).

  ---

  ### 5. Limitations: The Debrief Disclaimer

  You must be honest about what this activity does not do. This is a **existence proof**, not a **general theorem**.

  **The "Honest Paragraph" for your closing:**
  > "Today, we hand-crafted a specific profile where majority voting on premises contradicted majority voting on conclusions. This proves the Discursive Dilemma is *possible*. It does not prove it is *inevitable*. In the real world, many profiles align perfectly (everyone agrees on R, T, and O). However, the impossibility theorems (like List & Pettit, 2002) show something stronger: there is *no* aggregation rule that can guarantee consistency, respect unanimity, and treat all premises equally for *all* possible profiles. We saw one glitchy case today; the math tells us the glitch is structural to the system, not just a bug in this candidate's file. We cannot escape the dilemma by finding a better voting rule; we can only manage it by assigning authority (like the Chair) or restricting the agenda."

  **Why this matters:** Students often leave simulation activities thinking, "If we just communicated better, we wouldn't have this problem." The debrief must crush that hope. The dilemma arises even with perfect communication and perfectly logical individuals. It is a problem of *composition*, not *competence*.

  ### 6. Instructor's Cheat Sheet (The Math)

  Keep this on your podium to answer questions during the run.

