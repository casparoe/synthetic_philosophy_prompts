  **JOINT STATEMENT ON THE STATUS OF MACHINE TRANSLATION AND SEMANTIC COMPETENCE**
  **Produced by the Adversarial Collaboration Workshop on Machine Cognition (Zurich, 2024)**

  **Preamble**
  We, the undersigned, represent perspectives ranging from computational linguistics and neural network engineering to philosophy of mind and cognitive science. We acknowledge that the debate regarding whether machine translation (MT) systems "understand" language has persisted through three distinct architectural paradigms: Statistical MT, Neural MT, and Large Language Models. While fluency and BLEU scores have improved orders of magnitude, the philosophical disagreement has not dissolved; it has merely migrated. We recognize that a portion of this dispute is verbal (concerning the definition of "understanding"), but we assert that a substantive core remains regarding the relationship between statistical correlation and semantic grounding. This document does not seek to declare a victor. Instead, it isolates the empirical claims upon which our disagreement rests, discards arguments rendered obsolete by technical progress, and establishes pre-registered tests to adjudicate the residual fault lines.

  ### I. Agreed Claims
  *The following propositions are accepted by all signatories as true or as necessary framing for the debate.*

  1.  **Obsolescence of Early Counterexamples:** Arguments relying on the inability of systems to handle basic agreement, simple idioms, or short-term context (e.g., the "vodka is good but the meat is rotten" example) are dead. Current transformer-based architectures handle these routinely. Continuing to cite them as evidence of shallowness is empirically incorrect.
  2.  **The Grounding Gap:** All parties agree that current dominant MT systems are trained primarily on text corpora without direct, embodied sensorimotor interaction with the physical world referred to in that text. We disagree on the *consequences* of this gap, but not on its existence.
  3.  **Translation is Necessary but Insufficient:** High-quality translation requires significant semantic processing. However, we agree that successful translation alone is not proof of general world understanding. A system could theoretically translate perfectly via lookup-tables of infinite size (a logical possibility, though engineering nonsense). Therefore, translation performance must be coupled with probes for reasoning.
  4.  **The "Understanding" Term is Polysemous:** We acknowledge that "understanding" is used in at least two distinct senses: (A) *Functional Competence* (the ability to use symbols to achieve goals in a context) and (B) *Phenomenological Grasp* (the internal experience of meaning). The Functionalists focus on A; the Shallowness camp argues A is impossible without B, or that B requires specific architectural conditions not currently met.
  5.  **Architecture Matters:** We agree that the shift from SMT to NMT to LLMs was not merely quantitative. The emergence of attention mechanisms and latent space representations constitutes a qualitative shift in how information is processed, rendering analogies to simple look-up tables or Markov chains inaccurate.
  6.  **Brittleness Exists:** Both sides agree that current systems exhibit "brittleness"—unexpected failures on edge cases that humans would find trivial. We disagree on whether this brittleness proves a lack of understanding or simply indicates an unfinished learning process.

  ### II. Areas of Disagreement
  *The following table outlines the core disputes. Wording in each column is drafted to be endorsable by that specific camp.*

  | Topic | Shallowness Camp (Skeptics) | Functionalist Camp (Pragmatists) |
  | :--- | :--- | :--- |
  | **Locus of Meaning** | Meaning is derived from the connection between symbols and the world (reference). Since the system only manipulates symbols based on other symbols, it simulates meaning without possessing it. | Meaning is derived from the use of symbols within a context (use). If the system manipulates symbols appropriately across diverse contexts, it possesses meaning relative to its operational environment. |
  | **The "Goalpost" Dynamic** | As systems solve harder puzzles, new failures reveal the underlying lack of comprehension. The goalposts aren't moving; we are simply peeling back layers of sophistication to find the empty core. | As systems solve harder puzzles, the remaining errors are diminishing returns on complexity. The goalposts are moving because "understanding" is a gradient; we are measuring how far up the gradient the system has climbed. |
  | **Internal Representation** | The latent space vectors are uninterpretable statistical compressions. They correlate with concepts but do not encode concepts in a way that supports reasoning outside the training distribution. | The latent space vectors function as high-dimensional concepts. The geometry of this space supports analogical reasoning and generalization that implies a form of conceptual understanding. |
  | **Verbal vs. Substantive** | This is not merely verbal. Calling a system "understanding" obscures the fundamental difference between causal connection to reality and pattern prediction. It risks category errors in safety and ethics. | This is partially verbal, but the label matters for deployment. If we reserve "understanding" only for biological entities, we blind ourselves to the functional capacities and risks of the system. |
  | **Task vs. Content** | The system understands the *task* of translation (minimize loss) but not the *content* of the sentence (the reality described). It knows what words follow, not what they are about. | The distinction between task and content is false in high-dimensional optimization. To minimize loss on complex content, the system must model the content's underlying logic. |

  ### III. Cruxes and Pre-Registered Predictions
  *We identify three specific empirical questions where resolving the evidence would force at least one camp to update their position. For each, we specify a test and the divergent predictions.*

  **Crux 1: The Physical Grounding Proxy**
  *Question:* Can a text-only system reliably translate sentences where the correct translation depends on implicit physical constraints not explicitly stated in the text?
  *   **Test Case:** A dataset of 1,000 sentences describing physical interactions (e.g., "The trophy didn't fit in the suitcase because it was too large") translated into a language where the pronoun agreement or verb choice requires resolving the physical ambiguity (e.g., distinguishing which object is "large").
  *   **Shallowness Prediction:** Accuracy will plateau significantly below human level (e.g., <85%) on *novel* physical configurations. The system will rely on textual co-occurrence statistics rather than a model of physics, failing when text priors conflict with physical reality.
  *   **Functionalist Prediction:** Accuracy will exceed 95%, matching human baselines. The system has learned a latent model of physics from the sheer volume of descriptive text in the training set, allowing it to resolve ambiguity even without sensors.

  **Crux 2: Long-Form Coherence and Subtext**
  *Question:* Does "understanding" degrade over long contexts where the meaning relies on maintaining a consistent, unspoken character model or thematic subtext?
  *   **Test Case:** Translation of a 50,000-word novel where a specific character consistently uses ironic understatement that contradicts the literal text. The evaluation measures whether the target language translation preserves the *irony* rather than just the literal meaning.
  *   **Shallowness Prediction:** The system will revert to literal translation as the context window fills or as the irony becomes too subtle. It cannot maintain a "theory of mind" for the character over that duration; it will lose the subtext.
  *   **Functionalist Prediction:** The system will preserve the ironic register throughout. Attention mechanisms allow the model to weigh distant contextual clues (earlier instances of irony) heavily enough to inform current translation choices.

  **Crux 3: The Rationale Alignment Test**
  *Question:* When asked to explain *why* a specific ambiguous word was translated a certain way, does the system's explanation align with its actual internal processing?
  *   **Test Case:** Interrogating the model on specific translation choices (e.g., "Why did you translate 'bank' as 'financial institution' here?") and comparing the natural language explanation to attention weight visualizations and probing classifiers.
  *   **Shallowness Prediction:** The explanations will be post-hoc confabulations (rationalizations). The attention weights will show the decision was made based on shallow local cues, while the explanation claims deep reasoning. This proves a lack of self-knowledge/understanding.
  *   **Functionalist Prediction:** The explanations will correlate significantly with internal state probes. The system's "reasoning" trace will match its verbal report, indicating that the model's internal representation is structured enough to be introspectively accessible.

  **Signatories:**
  *[Names Redacted for the purpose of the Feature Draft]*
  *Representing: Center for Human-Compatible AI; Institute for Cognitive Science; Dept. of Computational Linguistics; Philosophy of Mind Consortium.*
