answer: |-
  # Seminar Handout: The Nonidentity Problem
  ## Desiderata for Institutional Guidance

  ### I. Standard of Adequacy: Institutional Actionability
  We are not engaged in this seminar merely to systematize the intuitions of professional philosophers. We are engaged to determine what guidance can be offered to public institutions—health ministries deliberating on genetic counseling subsidies, environmental agencies setting century-scale emissions targets, or courts adjudicating intergenerational equity.

  A solution to the Nonidentity Problem is **adequate** only if it generates actionable policy recommendations that remain stable under scrutiny. It must not collapse when scaled from the individual to the collective, nor must it demand metaphysical certainty that administrators cannot possess. If a theory yields the "correct" philosophical answer but paralyzes a health ministry, it fails this seminar's standard.

  ### II. The Desiderata
  The following five requirements constitute the test for any proposed solution. Each is marked to indicate whether it is a **Non-Negotiable Institutional Requirement** (necessary for the functioning of public policy) or a **Philosophical Commitment** (reflecting the prejudices of a specific theoretical camp).

  **1. The Reckless Procreator Condition**
  *   **The Requirement:** The theory must validate the judgment that a teenager who knowingly conceives a child with a predictably significant disadvantage (though a life worth living), rather than waiting to conceive a different, healthier child later, acts wrongly. It must do this without identifying a specific victim who is worse off than they otherwise would have been. Alternatively, it must provide a clear, non-evasive explanation for why this judgment should be abandoned in policy contexts.
  *   **Motivating Case:** *The 14-Year-Old Girl.* A health ministry must be able to counsel against early conception based on the welfare of the future child, even if that specific child would not exist had the advice been followed.
  *   **Status:** **Non-Negotiable Institutional Requirement.** Public morality and family law rely on the ability to critique parental choices that foreseeably limit a child's life prospects, even when those choices are constitutive of the child's existence.
  *   **Camp Friction:** **Person-Affecting Theorists** struggle here. They insist an act can only be wrong if it makes someone worse off. To satisfy this requirement, they must stretch the concept of "harm" until it breaks, or abandon the requirement.

  **2. The Preference Fact (The "No Complaint" Constraint)**
  *   **The Requirement:** The theory must respect the logical fact that the resulting child, once adult, cannot rationally complain that they should not have been conceived. From their perspective, the alternative was non-existence. A solution cannot rely on the fiction that the child was "harmed" in a comparative sense.
  *   **Motivating Case:** *The Adult Child's Endorsement.* If the child born to the teenager leads a happy life, they would rationally reject the claim that their parents wronged *them*. Policy cannot be based on a logical contradiction.
  *   **Status:** **Non-Negotiable Logical Constraint.** This is not a moral intuition but a metaphysical fact about identity. Any solution that denies this is denying the logic of counterfactuals.
  *   **Camp Friction:** **Impersonal Theorists** sometimes gloss over this. They focus on the "state of affairs" being worse, potentially sidelining the specific perspective of the person living the life.

  **3. The Aggregate Policy Condition**
  *   **The Requirement:** The theory must extend to cases where no single decision fixes who will exist, but sustained policies shape identities across generations. The "wrong" must not evaporate when the collective act is decomposed into individually harmless contributions.
  *   **Motivating Case:** *Climate Change.* A carbon emission policy today changes the timing of conceptions globally over the next century. If the policy is too lax, future people will suffer from climate disasters. If the policy is strict, different people will exist. If the theory cannot condemn the lax policy because it doesn't harm specific identifiable individuals, it is useless to an Environmental Protection Agency.
  *   **Status:** **Non-Negotiable Institutional Requirement.** Agencies regulate systems, not just isolated dyads. A theory that works for a teenager but fails for a carbon tax is institutionally useless.
  *   **Camp Friction:** **Person-Affecting Theorists** face the "Overdetermination" or "Threshold" problem here. If no single emission harms a specific person, how is the aggregate wrong?

  **4. The Uncertainty Condition**
  *   **The Requirement:** The theory must deliver usable guidance under moral uncertainty. An agency that is unsure whether impersonal reasons (values independent of specific people's welfare) exist should still be told what to do, rather than being told to wait for metaethics to settle.
  *   **Motivating Case:** *The Precautionary Principle.* A genetic counseling board cannot suspend operations because they are unsure if "potential people" have moral standing. They need a decision procedure that works even if the metaphysical status of non-existent persons is disputed.
  *   **Status:** **Non-Negotiable Institutional Requirement.** Bureaucracies cannot operate on "maybe." They require decision rules that are robust to theoretical disagreement.
  *   **Camp Friction:** **Metaethical Skeptics** often argue we should suspend judgment. This is a luxury institutions do not have.

  **5. The Side-Constraint (Avoiding the Repugnant Conclusion)**
  *   **The Requirement:** The theory must not purchase the solution with commitments that independently generate worse problems. Specifically, if the impersonal principle that handles the teenager also entails that a massive population of lives barely worth living is better than a smaller population of very happy lives, the handout must say so plainly.
  *   **Motivating Case:** *The Repugnant Conclusion.* A population ministry should not be guided by a principle that obligates them to maximize headcount at the expense of quality of life, merely to increase total utility.
  *   **Status:** **Philosophical Commitment (Person-Affecting/Intuitionist Camp).** This reflects a specific intuition about the quality of lives vs. the quantity of lives.
  *   **Camp Friction:** **Total Utilitarians** reject this constraint. They accept the Repugnant Conclusion as a counter-intuitive but necessary truth. Person-Affecting theorists and Intuitionists treat it as a *reductio ad absurdum*.

  ### III. The Core Tension
  In preparing for this seminar, you should operate under the assumption that the following pair of desiderata **cannot be jointly satisfied**:

  > **Requirement 1 (The Reckless Procreator Condition)** and **Requirement 5 (The Side-Constraint against the Repugnant Conclusion).**

  **Why this tension?**
  To satisfy **Requirement 1** (condemning the teenager without a victim), you generally need to adopt an **Impersonal Principle** (the world is worse if the child has a lower quality of life, regardless of who they are). However, Impersonal Principles (specifically Total Utilitarianism) almost invariably trigger the **Repugnant Conclusion**, violating **Requirement 5**.

  Conversely, to satisfy **Requirement 5** (avoiding the Repugnant Conclusion), you generally need to adopt a **Person-Affecting Restriction** (we only care about harms to specific people). However, Person-Affecting Restrictions cannot condemn the teenager in **Requirement 1**, because she harms no one.

  **Your Task:**
  Do not try to solve the Nonidentity Problem. Try to decide which of these two requirements an institution is more justified in abandoning. Is it worse to tell the teenager she did nothing wrong? Or is it worse to tell the population ministry that more lives are always better, regardless of quality? The philosophy ends where you must choose which intuition to sacrifice for the sake of policy.
