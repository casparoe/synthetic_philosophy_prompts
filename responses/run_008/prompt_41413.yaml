      *Re-evaluating:* The prompt says "money piled onto a cause that's already fully funded does nothing." This implies a cap. The prompt also says "a dollar matters at the margin."
      *Let's stick with Mechanic 1 (Threshold + Proportional)* but ensure the debrief explains the marginal value. Actually, the "Linear until Cap" is easier to score mid-game. But the "Threshold" creates more drama. I will argue for the Threshold model because it forces them to think about *completion* not just *contribution*. The lesson is about finishing things vs. spreading thin.
