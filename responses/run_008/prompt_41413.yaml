      *Self-Correction on Formatting:* I must ensure I do not accidentally use bolding for emphasis or bullet points for lists. I need to use transitional phrases instead. I need to make sure the numbers flow naturally in the text.

      *Refining the "News Flash":* The prompt asks for a reveal that changes the gaps. Let's make it so a cause they thought was neglected is suddenly funded by others (wasting their marginal dollar) or a cause thought impossible becomes possible. Let's go with the former to punish the "biggest problem" instinct. If they all pile on the Vaccine, and the News Flash says "Government cancels vaccine funding," the gap widens, making it impossible. Or "Private donor solves Worms," making student funding there wasted. Let's go with "Private donor solves Worms." This punishes those who looked at the "240 points" and didn't look at the "$9M existing" vs "$12M cost" gap closely enough to realize someone else might finish it. Actually, the prompt says "other funders' commitments count toward filling a cause." So if the News Flash says "Ministry increases commitment to Worms to $12M," the gap becomes zero. Any student money there is wasted. This teaches marginal thinking perfectly.

      *Refining the "Predictable Failures":* Math errors, hoarding money, not communicating between boards (if allowed), or colluding too much. Time management is huge for 80 minutes.
      *Refining the "Limitations":* Real policy isn't just points. Moral duties, rights, political feasibility. The game is utilitarian; real life isn't purely so.

      *Final check on constraints:* NO BOLD. NO LISTS. NO HEADINGS. Just paragraphs.

      *Let's write.*

      *Wait, one more check on the payoff mechanic explanation.* I need to be very clear about how points are awarded when multiple boards fund the same cause.
      *Mechanic 1 (Chosen):* If Total Funding >= Cost, Cause Solved. Points = Total Benefit. Distribution: Each board gets (Board Contribution to Gap / Total Gap) * Total Benefit. Excess contribution = 0 points. If Total Funding < Cost, 0 points for everyone.
      *Mechanic 2 (Rejected):* Each dollar buys points based on a formula. Points = Contribution * (Benefit/Cost) * (Remaining Gap/Total Cost). This is too complex for undergrads in 80 mins.
