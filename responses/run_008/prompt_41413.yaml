answer: |-
  Hi there, it is great to hear you are running this seminar again, and I think you have hit on exactly the right pedagogical problem to tackle with a simulation because abstract lectures on marginal utility rarely stick the way a financial loss does. I spent some time sketching out how to handle the scoring since, as you know, the payoff scheme is the engine that drives the behavior, and if the incentives are slightly off, the students will optimize for the game rather than the lesson. I worked up two candidate mechanics for how boards earn points when multiple foundations fund the same cause. The first option is a Continuous Marginal Return model where every dollar a board contributes yields points proportional to the remaining need, meaning the first dollar into a nearly empty cause is worth more than the last dollar into a nearly full one, and any dollar past the cap is worth zero. The second option is a Threshold Completion model where a cause yields zero points unless it is fully funded, at which point the total benefit points are distributed among contributors based on their share of the final gap, with any excess contribution yielding nothing. I strongly recommend you use the Threshold Completion model because the Continuous model telegraphs the lesson too early. In the Continuous model, students will see their point-per-dollar rate dropping as they pour money into the big vaccine cause and realize immediately that they are being inefficient, whereas the Threshold model allows them to feel confident they are making progress on the big problem until the reveal shows they failed to cross the finish line or wasted money on a cause others finished for them. The Threshold model creates the necessary risk of total loss that mimics the real-world stakes of policy failure, and it forces them to coordinate or gamble, which generates the friction you need for the debrief.

  Here is how I would structure the flow to fit your eighty-minute window while ensuring the trap springs properly. You start by dividing the sixteen students into four boards of four, handing each a budget sheet of fifty million in play money and the five dossier cards you described. You give them twenty minutes to make their initial allocations without talking to other boards, which is crucial because isolation ensures they act on their instinctive heuristics rather than colluding to solve the game theoretically. Most will look at the vaccine research with nine hundred points and the intestinal worms with two hundred forty points and chase the vaccine because the headline number is largest, or they will spread their money thinly across all five causes to feel diversified. Once they lock in their first round choices, you collect the allocation sheets and pause for the news flash. This is where you announce that the regional health ministry has unexpectedly fully funded the intestinal worm program, closing the gap entirely, and simultaneously that the federal government has cut its commitment to the vaccine research by half, widening that gap. You then give them ten minutes to reallocate their remaining unspent funds or attempt to trade commitments with other boards if you want to allow inter-board negotiation, though I suggest keeping them separate to preserve the competition. The scoring happens only at the very end, where you calculate which causes were fully funded and distribute the points based on who filled the marginal gap, revealing that the boards who poured millions into the now-fully-funded worm program earned zero points for those dollars, and the boards who chased the vaccine likely failed to reach the new higher threshold, leaving them with nothing while the board that quietly funded the after-school tutoring or flood relief secured a guaranteed win.

  The competitive element should be simple enough to not distract from the ethics but sharp enough to prevent polite splitting. You can announce that the board with the highest point total gets a tangible but silly prize, like a framed certificate of Effective Altruism or first choice of seating for the next class, which triggers enough status anxiety to make them care about the score. The key to the trap is in the numbers you provided, specifically the relationship between the total class budget and the cause gaps. Since there are four boards with fifty million each, the class has two hundred million total, but the vaccine gap is one hundred eighty million after existing commitments, which tempts them to pool resources, yet the worm gap is only three million. If a single board funds the worms alone, they spend three million to secure two hundred forty points, leaving them with forty-seven million to spend elsewhere, whereas if all four boards try to share the vaccine, they must coordinate perfectly to avoid overfunding or underfunding, and any deviation leaves them with wasted capital. When the news flash removes the worm option, the boards that hedged their bets on the worms lose their safe investment, punishing those who didn't calculate the marginal probability of outside funding, while the boards that went all-in on the vaccine face a now-impossible target, punishing those who ignored tractability. This sets up your debrief perfectly because you can wait until the scores are revealed to introduce the terms importance, tractability, and neglectedness, mapping the vaccine to high importance but low tractability, the worms to high neglectedness initially but low neglectedness after the news flash, and the tutoring or flood relief to the sweet spot of moderate importance with high tractability.

  I need to be honest with you about what will predictably go wrong the first time you run this so you can buffer against it. The most common failure mode in these simulations is arithmetic paralysis, where students spend so much time calculating exact contribution shares that they miss the strategic landscape, so you should provide a simple spreadsheet projector or pre-calculate the point values per million for each cause to keep the pace moving. Another issue is that students may treat the play money as infinitely divisible and try to contribute odd amounts like three point five million, which complicates your scoring, so you should enforce denominations of one million only. You will also likely face a coordination failure where boards want to cooperate to solve the vaccine but cannot communicate, leading to frustration that you will need to manage in the debrief by framing it as a feature of real-world philanthropy rather than a bug in the game. There is also a risk that one board realizes the strategy immediately and dominates, which can demoralize the others, so you might consider allowing a brief trading period after the news flash to let them feel the pain of changing market conditions without locking them out of winning.

  Finally, there are features of the real thing the game just cannot reproduce and that you will have to supply yourself during the debrief to ensure the ethical lesson lands. The game is strictly utilitarian, reducing human suffering to benefit points, which ignores rights-based ethics or duties of justice that might compel funding a smaller problem because it involves a specific obligation, such as a government owing relief to its own citizens in the flood delta versus foreign aid for worms. The game also assumes perfect information about the costs and benefits once the cards are read, whereas real policy is fraught with uncertainty about whether the money will actually work, so you will need to highlight that the dossiers represent best-case estimates that might be wrong. Additionally, the game treats the boards as isolated agents, but in reality, foundations signal to each other, and reputation matters, so a board might fund a visible failure like the flood relief to maintain public trust even if it is inefficient, a nuance you should raise when discussing why real organizations do not always follow the marginal rule. You will also need to address the moral weight of the news flash, since in the real world, a government canceling a vaccine program is a tragedy, not just a scoring update, and you must ensure the students do not walk away thinking that human welfare is merely a game to be optimized but rather that effective allocation is a moral imperative to reduce suffering where possible. If you can navigate those limitations while letting them feel the sting of wasted millions in the simulation, you will have given them a heuristic they will remember long after the specific numbers fade.
