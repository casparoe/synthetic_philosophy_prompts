      *   *World Specifics:* In the vault, Step 4 requires breaking the seal. Breaking the seal makes "Count is 3" false. So $K(\text{Count is 3})$ implies $\neg(\text{Count is 3})$.
      *   *Critical Step:* The distribution of knowledge over the conjunction combined with the factivity of the second conjunct ($\neg K p$). In the world, this maps to the physical impossibility of verifying the count without destroying the count.

