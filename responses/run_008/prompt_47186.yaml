answer: |-
  There is no single classical term that captures the entire configuration you describe. The "knowing-how/knowing-that" distinction (Gilbert Ryle) is indeed the nearest historical shelf, but as you have correctly intuited, it is too binary to map a two-way dissociation where *both* translations fail (practice $\nrightarrow$ theory and theory $\nrightarrow$ practice) and where the theoretical layer is suspected to be confabulatory.

  To carve this properly, we need to assemble a constellation of three concepts from epistemology, philosophy of mind, and cognitive science. Together, they form a framework often discussed under the header of **Metacognitive Opacity** or the **Self-Interpretation Model of Self-Knowledge**.

  Here is the carving of your experience into its philosophical components.

  ### 1. The Skill Without Rules: *Tacit Knowledge* (Michael Polanyi)
  **Fit:** High Confidence
  **What it captures:** This covers the first half of your pattern: the reliable micro-decisions you cannot articulate. Polanyi's maxim, "We can know more than we can tell," is the standard epistemological label for this. It posits that expertise relies on a subsidiary awareness (the feel of the rhythm, the tension of the lie) that cannot be brought into focal awareness without destroying the performance.
  **Where it fails:** Tacit Knowledge explains why you can't speak the rules, but it does not explain why your *stated* rules are actively misleading (rationalizations), nor does it explain why your explicit knowledge of your flaws (rushed endings) cannot penetrate the skill to fix it. It accounts for the silence, but not the noise.

  ### 2. The Explanations as Fiction: *The Introspection Illusion* (Nisbett & Wilson / Peter Carruthers)
  **Fit:** High Confidence
  **What it captures:** This addresses your suspicion that your post-hoc explanations are rationalizations rather than reports. In philosophy of mind, this is the move from **Privileged Access** (the idea that we know our own minds directly) to **Self-Interpretationism** (championed by Peter Carruthers and Daniel Dennett).
  According to this view, you do not have direct introspective access to the causal mechanisms of your writing. When you explain *why* you broke a line, you are not reading a log file; you are interpreting your own behavior using the same folk-psychological theories you use to interpret others. You observe the output ("I broke the line here") and generate a plausible cause ("to improve the rhythm"). This explains why your workshop students fail: you are giving them the *story* you tell yourself, not the *mechanism* you use. The story is a narrative gloss, not a functional schematic.
  **Where it fails:** This explains the falsity of your explanations, but it doesn't fully explain the *inertia* of your knowledge regarding the rushed endings. Knowing you are confabulating doesn't explain why true knowledge (the evidence of rushed endings) is powerless.

  ### 3. The Inert Knowledge: *Cognitive Impenetrability* (Jerry Fodor)
  **Fit:** Medium Confidence
  **What it captures:** This is the specific tool for the second half of your pattern: the fact that your propositional knowledge ("I rush endings") cannot alter your performance. Fodor's **Modularity of Mind** thesis suggests that certain cognitive systems are "encapsulated." They process information based on their own internal rules and are *cognitively impenetrable* to beliefs or knowledge held elsewhere in the mind.
  If your drafting process is handled by a highly specialized, procedural module (honed over 15 years), it may be encapsulated from your central belief system. You can hold the belief "I must slow down" in your central system, but the drafting module does not have access to that belief to adjust its parameters. The knowledge is "inert" because it resides in a different cognitive architecture than the skill.
  **Where it fails:** Fodor originally applied impentrability to low-level perception (e.g., optical illusions persist even when you *know* they are illusions). Extending this to high-level creative habits is a theoretical stretch. It is possible this is simply **Habit Strength** (a psychological concept) rather than strict philosophical impentrability.

  ### The Unified Configuration: *Metacognitive Opacity*
  When you combine these three, you arrive at the configuration you are looking for. It is a state of **Metacognitive Opacity** where:
  1.  **Generation** is Tacit (Polanyi).
  2.  **Monitoring** is Interpretive/Confabulatory (Carruthers/Nisbett).
  3.  **Control** is Encapsulated (Fodor).

  In this framework, your "self" is not a unified commander. It is a split system where the "Writer" (procedural, tacit, encapsulated) operates independently of the "Critic" (propositional, interpretive, explicit). The Critic can accurately diagnose the output (the rushed endings) because it observes the finished product, but it cannot steer the Writer because the Writer is cognitively impenetrable to the Critic's data. Meanwhile, when asked to explain the Writer's moves, the Critic invents a plausible story rather than accessing the Writer's code.

  ### Candid Assessment of Fit

  **Confidence Level:**
  I am **highly confident** that *Tacit Knowledge* and the *Introspection Illusion* accurately describe the first half of your experience (the skill and the rationalizations). These are well-established descriptions of expertise and self-knowledge.

  I am **moderately confident** regarding *Cognitive Impenetrability* as the explanation for the second half (the inert knowledge). While it fits the phenomenology perfectly (knowing X but being unable to act on X), applying Fodor's modularity to complex, learned artistic habits is debated. It is possible this is better described as **Proceduralization** in cognitive psychology: the skill has become so automated that it bypasses declarative control. The philosophical label "Impenetrability" might be doing heavy lifting here that belongs to neuroscience.

  **The Point of Least Certainty:**
  The specific claim that your knowledge of the rushed endings is *structurally* unable to affect the writing (Impenetrability) versus *practically* unable (Akrasia/Habit).
  *   **Akrasia** implies you *could* slow down if you chose to, but you don't.
  *   **Impenetrability** implies you *cannot* slow down via that knowledge, regardless of choice.
  Your description ("has never once helped me slow down") suggests the latter. However, distinguishing between a "soft" barrier (deep habit) and a "hard" barrier (modular encapsulation) is difficult from the inside. If the concept I am handing you is "Cognitive Impenetrability," be aware that this is the closest shelf, but the wood might be slightly warped; it is a philosophical hypothesis used to explain a psychological reality that may not be perfectly modular in the strict Fodorian sense.

  **Summary:**
  You are describing a **Dissociation between Generative Mechanisms and Interpretive Access.** You have no direct access to the generator (Tacit), your access to the reasons is a narrative construction (Confabulation), and your access to the controls is blocked by architectural encapsulation (Impenetrability). There is no single ancient word for this because it requires a modern, modular view of the mind to articulate. You are effectively experiencing the **Opacity of your own Agency.**
