      *   Check the "impossibility" logic is accurately represented without jargon. (If base rates differ, you can't have equal FPR/FNR and Calibration simultaneously).
      *   Make sure the "unwelcome" conclusion in the worked example is stark.

  *(Self-Correction during drafting)*: I need to be careful not to make the steps *too* technical. Instead of asking them to calculate metrics, ask them to *request* metrics from the model developers using a standard template I define. The reviewers are *reviewers*, not *auditors*. They check the work, they don't necessarily run the code. I will frame it as "Demand this report."

  *(Refining the "Impossibility" explanation)*: For non-statisticians, the "Impossibility Theorem" is best explained as: "If Group A gets sick more often than Group B, a test that is equally accurate for both will necessarily look different for each. If you force the test to look the same, it will be less accurate for one." I need to embed this intuition in Step 3.

  *(Refining the "Unwelcome" outcome)*: In Case A, the procedure should lead to a rejection or a requirement for fundamental redesign, not just a tweak. This shows the procedure has teeth.

  Let's write.

