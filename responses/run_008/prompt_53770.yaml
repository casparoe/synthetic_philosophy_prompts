  *Key Phrase:* "The model does not decide; the board decides."

  *Let's assemble.*
answer: |-
  # The Disparity Disclosure Protocol (DDP)

  ## 1. Overview

  This procedure is not a fairness audit; it is a decision-forcing mechanism. Its purpose is to prevent the Board from approving a model under the illusion that "fairness" is a technical property inherent to the algorithm. As the technical literature establishes (e.g., Chouldechova 2017, Kleinberg et al. 2016), when outcome base rates differ across protected groups (e.g., disease prevalence differs by neighborhood), it is mathematically impossible to satisfy all common fairness criteria simultaneously. You cannot have a model that is equally calibrated across groups *and* has equal false-positive and false-negative rates across groups.

  Consequently, approving a model is not certifying that it is fair; it is certifying that the specific unfairness it embodies is acceptable. This procedure operationalizes that trade-off. It forces the Board to identify which error rate disparities are permitted and which group bears the burden of those errors.

  The single question this procedure puts to the Board is: **"Given that we cannot eliminate all disparities, which specific disparity are we choosing to tolerate, and why?"**

  This procedure deliberately does *not* attempt to decide whether a model is ethically good. It does not calculate utility functions or weigh legal risks automatically. It separates the *technical facts* (what the model does) from the *policy judgment* (whether we accept what the model does). The output is not a score, but a "Tolerated-Disparity Statement" that must accompany any approval. If the Board cannot sign this statement, the model cannot be deployed.

  ## 2. The Steps

  **Preparation:** The model developers must submit a "Group Performance Report" using the agency's standard template. If they cannot produce this, the review terminates immediately (Reason: Insufficient Documentation). The Report must break down performance by protected group (race, gender, neighborhood, etc.) using the definitions below.

  **Step 1: Establish Base Rate Differences**
  *   **Action:** Review the "Outcome Prevalence" section of the Report. This shows the percentage of individuals in each group who actually experience the target outcome (e.g., % of patients readmitted).
  *   **Definition:** *Base Rate* = How common the event is in reality for this group.
  *   **Check:** Do the base rates differ significantly between groups? (e.g., Is readmission 20% in Group A and 10% in Group B?)
  *   **Decision Point:**
      *   **If No:** Proceed to Step 2. (Impossibility constraints are less binding here).
      *   **If Yes:** Proceed to Step 2, but note that **perfect fairness is mathematically impossible.** You must choose which error to equalize.
  *   **Handoff:** This step establishes the *constraint*. It does not decide the model's fate.

  **Step 2: The Error Audit**
  *   **Action:** Inspect the "Error Rates" table. You need two numbers per group:
      1.  *False Alarm Rate (False Positive Rate):* Of the people who were healthy, what % did the model wrongly flag as high-risk?
      2.  *Missed Case Rate (False Negative Rate):* Of the people who were sick, what % did the model wrongly flag as low-risk?
  *   **Check:** Compare these rates across groups. Are they equal? If not, which group has the higher False Alarm Rate? Which has the higher Missed Case Rate?
  *   **Decision Point:**
      *   **If Disparities Exist:** You must identify who is harmed. High False Alarms burden the individual (stress, unnecessary intervention). High Missed Cases burden the system or the patient (lack of care).
      *   **If Disparities Do Not Exist:** Proceed to Step 4.
  *   **Handoff:** This step establishes the *facts of harm*. It does not decide if the harm is acceptable.

  **Step 3: The Impossibility Check (The Trade-Off)**
  *   **Action:** If Base Rates differed in Step 1, look at the "Calibration" metric.
      *   *Definition:* *Calibration* = If the model says "10% risk," do 10% of those people actually experience the outcome?
  *   **Check:** If the model is perfectly Calibrated across groups, the Error Rates (Step 2) *must* differ. If the Error Rates are equal, Calibration *must* differ.
  *   **Decision Point:** **STOP.** This is the primary handoff to policy judgment. The technical team cannot fix this. The Board must choose which metric to prioritize.
      *   *Option A:* Prioritize Calibration (Risk scores mean the same thing for everyone). *Cost:* Error rates will differ.
      *   *Option B:* Prioritize Equal Error Rates (Everyone is equally likely to be wrongly flagged). *Cost:* Risk scores will mean different things for different groups.
  *   **Requirement:** You cannot select both. You must select one priority.

  **Step 4: The Cost Assignment**
  *   **Action:** Based on the priority chosen in Step 3, identify the burden.
      *   If you prioritize Equal False Alarms: Which group now suffers more Missed Cases?
      *   If you prioritize Equal Missed Cases: Which group now suffers more False Alarms?
  *   **Check:** Does this burden align with the agency's legal and ethical mandates? (e.g., Is it legal to subject Group A to more false fraud flags to protect the public purse?)
  *   **Handoff:** This is a legal and ethical judgment, not a technical one. The Lawyer and Policy Analyst lead here.

  **Step 5: The Tolerated-Disparity Statement**
  *   **Action:** Draft the mandatory approval paragraph. You cannot approve the model without this text.
  *   **Template:** "The Board approves this model knowing that [Metric X] differs across groups. Specifically, Group A faces a [Higher/Lower] rate of [Error Type] than Group B. This disparity is tolerated because [Policy Reason], acknowledging that the cost of this error falls primarily on [Group/Entity]."
  *   **Decision Point:**
      *   **If the Board can sign this:** Approve model.
      *   **If the Board cannot sign this:** Reject model. Do not ask developers to "fix it." Ask them to redesign the intervention.

  ## 3. Worked Applications

  **Case A: Readmission-Risk Score (Resource Allocation)**
  *   **Context:** Model allocates scarce nursing visits. Base rates of readmission differ significantly by neighborhood (proxy for race). High-risk neighborhoods have 30% readmission; low-risk have 10%.
  *   **Step 1:** Base rates differ. Impossibility constraint active.
  *   **Step 2:** The model is calibrated (a 20% score means 20% risk for all). However, to achieve this, the False Negative Rate (missed readmissions) is 5% in low-risk neighborhoods and 20% in high-risk neighborhoods.
  *   **Step 3:** To equalize the Missed Case Rate, the Board would have to lower the threshold for high-risk neighborhoods, which would break calibration (a 20% score in one neighborhood would mean higher risk than in another) and increase False Alarms (wasting scarce nursing visits on people who won't readmit).
  *   **Step 4:** The Board must choose. Prioritizing Calibration means high-need neighborhoods get missed more often. Prioritizing Equal Missed Cases means wasting resources on low-need areas, potentially reducing total lives saved.
  *   **Step 5 (Outcome):** **REJECTION.** The Board finds it cannot sign the statement: "We accept that patients in High-Risk Neighborhoods are four times more likely to be denied care despite needing it, because maintaining uniform risk definitions is prioritized over equal access." This is legally and ethically indefensible for a public health agency. The model is sent back. The procedure successfully prevented a technically valid but ethically catastrophic deployment.

  **Case B: Fraud Detection (Provider Claims)**
  *   **Context:** Model flags claims for review. False Positive (FP) costs provider time; False Negative (FN) costs public funds. Base rates of fraud differ by specialty.
  *   **Step 1:** Base rates differ slightly.
  *   **Step 2:** The model has equal False Negative Rates (catches fraud equally well) but higher False Positive Rates for smaller clinics vs. large hospitals.
  *   **Step 3:** The Board chooses to prioritize Equal False Negatives (protecting the public purse is the statutory mandate).
  *   **Step 4:** The burden falls on small providers (more administrative hassle). The Lawyer confirms this does not violate administrative law if the review process is appealable.
  *   **Step 5 (Outcome):** **APPROVAL.** Statement: "The Board approves this model knowing that False Alarm Rates are higher for small clinics. This disparity is tolerated because the statutory priority is minimizing public fund loss, acknowledging that the cost of this error falls primarily on provider administrative time."

  **Case C: Specialist Triage (The Calibration Trap)**
  *   **Context:** Model schedules appointments. Model is perfectly calibrated across all groups. However, for the smallest subgroup (e.g., non-binary patients), the False Negative Rate is significantly higher because the sample size was too small to tune thresholds.
  *   **Step 1:** Base rates similar.
  *   **Step 2:** Error rates differ for the smallest subgroup.
  *   **Step 3:** The developers argue Calibration is sufficient. The Procedure forces the Board to look at Error Rates anyway.
  *   **Step 4:** The Board identifies that "Risk Accuracy" (Calibration) does not protect this group from being systematically under-prioritized for appointments.
  *   **Step 5 (Outcome):** **CONDITIONAL APPROVAL.** Statement: "The Board approves... knowing that Missed Case Rates are higher for Non-Binary patients. This is tolerated *only* pending a retraining cycle within 6 months." This exposes the "calibration is enough" argument as insufficient for equity.

  ## 4. Failure Modes

  This procedure is a governance tool, not a mathematical proof. It will misfire in three predictable ways.

  First, **Proxy Blindness.** If the developers do not collect race or neighborhood data, Step 1 cannot be run. The procedure cannot force data collection if legal counsel advises against it. In this case, the Board must assume disparities exist and proceed to Step 4 as if the worst-case disparity is present. Do not let "missing data" become a loophole for "assumed fairness."

  Second, **The Illusion of Precision.** The Error Rates provided in Step 2 are estimates with confidence intervals. On small subgroups, a "20% disparity" might be statistical noise. The Board must ask for confidence bounds. If the intervals overlap, the disparity is not proven. However, do not use uncertainty as an excuse to ignore large point estimates.

  Third, **Strategic Metric Selection.** Developers may try to optimize for the metric they know the Board prefers (e.g., Calibration) while hiding degradation in others. This procedure forces them to show all three (Base Rates, Error Rates, Calibration), but it relies on honest reporting. If the Board suspects gaming, they must commission an independent audit.

  Finally, be candid: **This procedure cannot resolve conflicting legal mandates.** If equalizing error rates violates disparate treatment law, but allowing disparities violates disparate impact law, this procedure will not save you. It will only clarify that you are violating one to satisfy the other. The Tolerated-Disparity Statement is your legal shield, not your legal counsel. Sign it only when you are prepared to defend the choice in court.
