answer: |-
  The Ministry of Health confronts a fixed stock of NeuroSynth, a gene therapy discovered to permanently double the neural efficiency with which recipients convert standard life goods—income, social contact, leisure—into subjective well-being while halving the subjective weight of physical pain. The supply is sufficient for exactly one percent of the population and cannot be diluted without nullifying the effect, though future production scales promise eventual universality for subsequent generations. Recipients are selected by blind lottery from the general citizenry; they remain psychologically ordinary, neither hoarding resources nor demanding special treatment, simply experiencing life twice as vividly as before. Those who do not receive NeuroSynth retain access to the standard social baseline, ensuring a life comparable to a moderately affluent nation, devoid of starvation or destitution, though their capacity to enjoy these goods remains at the baseline rate. Allocation policy must decide between distributing doses widely at sub-threshold levels that yield no enhancement or concentrating the full supply on the one percent lottery winners, as the aggregate welfare gains from the enhanced group strictly outweigh the opportunity costs borne by the unenhanced majority without reducing the latter below a decent welfare floor.

  (a) Act utilitarianism mandates concentrating the resource on the one percent lottery winners, because the stipulated calculus shows this action maximizes the sum total of well-being across the population. A prioritarian would likely agree with the utilitarian verdict in this specific instance, reacting to the *absolute welfare levels* of the recipients; since all citizens are ex-ante equal in welfare, the priority weighting function assigns them equal moral weight, collapsing the prioritarian calculation into the utilitarian one unless the theory incorporates ex-post concerns about creating a worse-off class. A straightforward telic egalitarian, conversely, would oppose the concentration, reacting specifically to the *relative inequality* generated between the enhanced one percent and the baseline majority; for the telic egalitarian, the gap in welfare capacity is intrinsically bad regardless of the total sum or the adequacy of the unenhanced floor.

  (b) The disanalogy with ordinary medical triage is thin. In standard triage, a doctor gives a scarce drug to the patient who will benefit most (e.g., survival vs. death), which is effectively a utilitarian allocation of scarce resources to maximize health outcomes. The distinction here lies only in the *type* of benefit (enhancement of capacity vs. restoration of function) and the *permanence* of the inequality (lifetime capacity gap vs. temporary recovery). If the distinction is indeed this thin, it suggests the "fragmented monster" is merely triage with better lighting, implying that the anti-monster intuition in Nozick's original case was never about efficiency per se, but rather about the *context* of the efficiency—specifically, that the efficiency was being used to justify a radical, permanent hierarchy rather than a medical necessity.

  (c) Running the re-introduction test isolates the variable driving the intuition. First, concentrating the benefit into a single beneficiary (the "One King" variation) immediately resurrects the anti-monster intuition, suggesting the *vividness and power asymmetry* of a single recipient is the primary driver. Second, removing the welfare floor so the majority suffers misery reintroduces a strong intuition of wrongness, but this is distinctively a *harm-based* objection rather than a monster-specific one. Third, making the beneficiaries aware and complicit adds an objection based on *agency and fairness*, but not necessarily the "monster" quality. The return of the specific anti-monster intuition at the first step (concentration) indicates that the intuition is driven by the dramatic shape of the case (one enormous beneficiary) rather than the efficiency of the conversion itself.

  (d) The strongest utilitarian defense is the "bite the bullet" reply: the allocation is morally right because it produces the most well-being, and our intuition against it is a bias toward equality that lacks rational foundation. This is distinct from the "deny the possibility" reply, which claims interpersonal welfare comparisons of this magnitude are incoherent. The case as constructed pressures the "bite the bullet" reply more heavily; by instituting a blind lottery and promising eventual universality, the case removes the unfairness of selection and the permanence of the inequality, making the bullet significantly easier to bite than in Nozick's original scenario where the monster is a permanent, distinct entity feeding on others. The design forces the critic to admit that if the inequality is temporary and fairly allocated, the utilitarian outcome may be acceptable, thereby isolating the "single vivid beneficiary" as the true source of the original intuitive resistance.
