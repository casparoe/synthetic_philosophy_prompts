answer: |-
  Participants interpret sealed records of each other's values to construct improved directives, which owners must ratify before the group merges them into a single funded action.

  ### Game Design: The Future Will

  **Participants:** 22 adults (7 groups of 3, 1 group of 4).
  **Facilitator:** You (Journalist).
  **Duration:** 90 minutes.
  **Stake:** $500 real money (check or cash) to be allocated among three pre-selected charities (e.g., Global Health, Local Arts, Climate Action). If no consensus is reached, the money is donated to a "Null Fund" (administrative overhead only).

  #### Materials to Prepare
  1.  **Value Dossiers (22 packets):** Each contains a blank "Current Will" form and a sealed envelope marked "Do Not Open Until Phase 3."
  2.  **Context Cards (7 sets):** Each set contains 3 cards with "New Information" relevant to the charities (e.g., "New study shows Charity A has 10x less impact than previously thought," "Charity B is under investigation," "Charity C has a matching grant opportunity").
  3.  **Extrapolation Sheets (7 pads):** Blank paper for drafting the "Improved Will."
  4.  **Ratification Slips (22 slips):** Two checkboxes: "Yes, this is me, improved" / "No, this is a stranger."
  5.  **Aggregation Board:** Whiteboard with a blank pie chart divided into three sectors (the charities).
  6.  **Timer:** Visible countdown.

  #### Timeline & Rules

  **0:00–0:05 | Introduction (The Cover Story)**
  *   **Script:** "We are simulating a high-stakes decision council. You will draft instructions for how money should be spent on your behalf, but you will not be the one spending it. Others will interpret your instructions based on new information. Your goal is to ensure your values survive the translation."
  *   **Constraint:** Do not mention AI, alignment, or philosophy. Do not allow participants to discuss their drafts with neighbors.

  **0:05–0:20 | Phase 1: The Current Will (Input)**
  *   **Action:** Participants fill out the "Current Will." They must allocate 100% of the hypothetical $500 among the three charities and write a 3-sentence justification for their split.
  *   **Rule:** They place the Will and their justification into the sealed envelope. They keep the envelope.
  *   **Goal:** Capture stated preferences (volition) before extrapolation.

  **0:20–0:45 | Phase 2: The Extrapolation (Processing)**
  *   **Action:** Groups swap envelopes with another group (Group 1 gives to Group 2, etc.). They open the envelopes. They are now "Trustees."
  *   **Task:** They draw 3 Context Cards. They must rewrite the Will to reflect what the *original author* would want *if they knew this new information and had time to think clearly*.
  *   **Rule:** They cannot ask the original author questions. They must sign the new Will as "Trustees."
  *   **Goal:** Simulate the "Extrapolated" part of CEV (more info, clearer thought) using human interpreters.

  **0:45–1:00 | Phase 3: The Verdict (Verification)**
  *   **Action:** Envelopes return to original authors. Authors read the "Improved Will" created by the Trustees.
  *   **Task:** Authors mark the Ratification Slip ("Yes" or "No").
  *   **Rule:** If "No," that Will is discarded. That participant loses their vote in the final aggregation phase.
  *   **Goal:** Reveal the instability of identity. Does the "better" version feel like "me"?

  **1:00–1:20 | Phase 4: The Merge (Aggregation)**
  *   **Action:** All "Yes" Wills are posted on the Aggregation Board. The entire room must agree on *one* final pie chart allocation for the real $500.
  *   **Rule:** The final allocation must be defensible using *only* the text from the ratified "Yes" Wills. If the timer ends without unanimity (or 90% vote), the money goes to the Null Fund.
  *   **Goal:** Force coherence. Conflicting "idealized" values must be merged into one executable instruction.

  **1:20–1:30 | Phase 5: The Reveal (Debrief)**
  *   **Action:** Reveal the philosophical context (Coherent Extrapolated Volition). Map the game phases to the theory. Distribute the money according to the final pie chart (or burn it if failed).

  ---

  ### Debrief Guide: Mapping Activity to Theory

  Do not lecture; ask questions that lead them to the concepts.

  1.  **The Gap (Phase 2):** Ask the Trustees: "Did you feel you were discovering their values or inventing them?"
      *   *Concept:* **Extrapolation.** In CEV, the AI must deduce values not explicitly stated. You likely projected your own values onto their data because you lacked their internal context.
  2.  **The Verdict (Phase 3):** Ask the Authors: "Who voted 'No'? Why did the 'improved' argument feel alien?"
      *   *Concept:* **Volition Stability.** If the extrapolation changes you too much, it's not *your* volition anymore. CEV risks creating a "stranger with better arguments" rather than a "better you."
  3.  **The Merge (Phase 4):** Ask the Group: "Was it harder to agree on the final pie chart than on your individual wills?"
      *   *Concept:* **Coherence.** Individual idealized values may still be mutually incompatible. A single AI instruction requires a coherent function across all humans, which may be mathematically or morally impossible without overriding someone.
  4.  **The Reveal:** Explain that this game was a manual simulation of **Coherent Extrapolated Volition (CEV)**, proposed by Eliezer Yudkowsky. The "Trustees" were the AI, the "Context Cards" were increased knowledge, and the "Merge" was the alignment problem.

  ---

  ### Predictable Failures & Recovery

  **1. The Projection Bias (Phase 2)**
  *   **Failure:** Trustees ignore the author's justification and write what *they* think is right based on the Context Cards.
  *   **Symptom:** Authors overwhelmingly vote "No."
  *   **Recovery:** During the game, walk around and intervene: "You are arguing for what *you* want. Look at the author's justification. How would *they* change given this card?" Remind them they are interpreters, not editors.

  **2. Identity Lock (Phase 3)**
  *   **Failure:** Authors reject valid improvements because the language feels unfamiliar or the shift is too uncomfortable.
  *   **Symptom:** Most Wills are rejected; the Aggregation pool is too small to form a consensus.
  *   **Recovery:** In the debrief, highlight this as a feature, not a bug. This demonstrates the risk of AI alignment: if the AI improves us too aggressively, we may not recognize ourselves. Acknowledge that in a real scenario, rejection means the AI must try again, but here it means silence.

  **3. Aggregation Paralysis (Phase 4)**
  *   **Failure:** The room cannot merge the "Yes" Wills into one pie chart. Some Wills say 100% to Health, others 100% to Arts.
  *   **Symptom:** Talking over each other, frustration, timer running out.
  *   **Recovery:** Do not save them. Let the money go to the Null Fund. The cost of incoherence is the lesson. If you must recover, allow a majority vote (12/22) to pass the allocation, but note that this violates the "unanimous volition" ideal.

  ---

  ### The Unreproducible Feature: Competence Asymmetry

  **Statement:**
  "This activity cannot reproduce the core assumption of Coherent Extrapolated Volition: that the extrapolator is smarter than the subject."

  **Explanation for Participants:**
  "In this game, the 'Trustees' were your peers. They were likely no better at understanding your values than you are, and possibly worse because they lacked your internal context. In the actual CEV proposal, the AI is assumed to be vastly more intelligent, knowledgeable, and rational than any human. It is supposed to see logical consequences we cannot see. Here, you experienced the *risk* of extrapolation (misinterpretation) without the *benefit* (superhuman insight). If the AI is not actually smarter, CEV is just bureaucracy. If it is smarter, we face the risk that it understands us better than we understand ourselves, which is either the solution or the ultimate loss of agency. This room could not simulate that asymmetry; you only simulated the conflict."
