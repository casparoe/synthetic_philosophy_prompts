prompt: |-
  In discussions of the Kosovo war and the 2011 Libya intervention, a colleague of mine defends a picture she thinks of as surgical: a sovereign state is like a patient, its borders like skin, and the Security Council like the hospital board that alone can authorize cutting. On her view, humanitarian intervention without that authorization resembles operating without consent — it may occasionally save the patient, but it is battery all the same. So far, so arguable. What interests me is that she then draws two further, more specific conclusions from the same picture. First, she says, humanitarian intervention is like surgery in that half-measures are the worst option: a no-fly zone is like excising part of a tumor and sewing the patient back up — having crossed the skin, you are committed to removing the whole growth, which means regime change; so the real menu in each crisis is all or nothing. Second, the intervening coalition is like the surgical team: once it has operated, it owes the patient postoperative care and owns the complications (civil war, state collapse), so something like the Iraq occupation was not an optional afterthought but an entailment of the original authorization. My own suspicion is that the first conclusion is the one she actually wants and the second is baggage the analogy smuggles in, but I cannot cleanly separate the parts of the picture that carry weight from the parts that merely comfort.

  Could you set out the correspondence table — what plays the role of the patient, the skin, the consent, the tumor, the surgeon, and the postoperative complication — then mark where each mapping breaks down? Please distinguish the disanalogies that matter for her two conclusions from the ones that don't (a table may lump everything together, but not every failed mapping sinks every conclusion). Then assess which, if either, of her conclusions survives once the disanalogies are on the table: is there any way to keep the duty of postwar care while rejecting the all-or-nothing claim, or do they stand and fall together? And if some nearby analogy does the work better — mechanic, gardener, bystander, firefighter — say what it would change about each conclusion. End with a final line in the form "Verdict: all-or-nothing [survives / survives with repairs / fails]; duty of care [survives / survives with repairs / fails]".
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A debate about humanitarian intervention (Kosovo, Libya) using a specific analogy: State = Patient, Borders = Skin, UN Security Council (UNSC) = Hospital Board/Consent, Intervention = Surgery, Regime/Threat = Tumor, Interveners = Surgeons, Aftermath = Postoperative Care.
      *   **Colleague's Position:**
          1.  *Consent:* Intervention without UNSC authorization is battery (illegal/unethical).
          2.  *Conclusion 1 (All-or-Nothing):* Half-measures (like no-fly zones without regime change) are worst. Once you "cut" (intervene), you must remove the "tumor" (regime change).
          3.  *Conclusion 2 (Duty of Care):* Interveners own the aftermath (occupation, reconstruction).
      *   **User's Suspicion:** Conclusion 1 is the goal; Conclusion 2 is unwanted baggage smuggled in by the analogy.
      *   **Tasks:**
          1.  Create a correspondence table (Analogy vs. Reality).
          2.  Mark where mappings break down (disanalogies).
          3.  Distinguish disanalogies that matter for the two conclusions from those that don't.
          4.  Assess which conclusion survives the scrutiny.
          5.  Explore alternative analogies (mechanic, gardener, bystander, firefighter) and their impact.
          6.  End with a specific "Verdict" line.

  2.  **Deconstruct the Analogy (The "Surgical Model"):**
      *   *Patient:* The Sovereign State (or its population).
      *   *Skin:* Borders/Territorial Integrity.
      *   *Consent:* UNSC Authorization (Hospital Board).
      *   *Tumor:* The Threat (Regime, Genocide, Instability).
      *   *Surgeon:* Intervening Coalition/NATO.
      *   *Procedure:* Military Intervention (Bombing, No-Fly Zone, Invasion).
      *   *Post-op Care:* Occupation, Reconstruction, Nation Building.
      *   *Complication:* Civil War, State Collapse, Insurgency.

  3.  **Identify Disanalogies (Where the analogy breaks):**
      *   *Agency:* Patients are passive; States/Populations are active agents.
      *   *Precision:* Surgery is precise; War is chaotic (Clausewitzian fog).
      *   *The "Tumor":* A tumor is distinct from healthy tissue; a regime is often intertwined with the society/state structure. Removing it often damages the host.
      *   *Consent:* Hospital boards act in patient interest; UNSC acts on geopolitical interests (vetoes).
      *   *Post-op:* Surgeons hand off to nurses/recovery; Interveners often leave or stay unwillingly.
      *   *Half-measures:* In medicine, biopsy or palliative care exists. In war, limited intervention (no-fly zone) might stabilize without regime change (e.g., Kosovo vs. Libya).

  4.  **Evaluate Conclusion 1 (All-or-Nothing/Regime Change):**
      *   *Logic:* Cutting skin commits you to removing the growth.
      *   *Disanalogy:* In medicine, you can cut to relieve pressure without removing the organ. In politics, a no-fly zone *can* protect without toppling the government (though Libya suggests otherwise).
      *   *Critical Flaw:* The "tumor" (regime) isn't a discrete object. Removing it often kills the "patient" (state stability). Therefore, the commitment to remove the tumor is actually a commitment to *risk killing the patient*.
      *   *Verdict on Conc 1:* Weakens significantly. The analogy suggests *completeness*, but reality suggests *proportionality*.

  5.  **Evaluate Conclusion 2 (Duty of Care/Ownership of Aftermath):**
      *   *Logic:* If you operate, you manage recovery.
      *   *Disanalogy:* Surgeons have a professional fiduciary duty. States have national interests.
      *   *Strength:* This is the strongest part of the analogy ethically. "Pottery Barn rule" (you break it, you buy it).
      *   *Conflict:* The user suspects the colleague *wants* Conc 1 but *doesn't want* Conc 2. However, the analogy supports Conc 2 *more* than Conc 1.
      *   *Verdict on Conc 2:* Stronger ethical footing, but practically difficult (nation-building is harder than surgery).

  6.  **Analyze the Tension (Can we keep Care but reject All-or-Nothing?):**
      *   Yes. You can intervene limitedly (protect civilians) and still owe care for the *consequences of that intervention*, without owing regime change.
      *   The "Surgical" analogy forces the "All-or-Nothing" view because surgery implies removing the pathology.
      *   To separate them, we need a different analogy.

  7.  **Explore Alternative Analogies:**
      *   *Firefighter:* Puts out fire (violence). Doesn't own the house afterwards, but shouldn't leave it burning. Doesn't require tearing down the house (regime change) to stop the fire. *Supports Duty of Care (stop the fire), Rejects All-or-Nothing.*
      *   *Mechanic:* Fix the engine. If you take it apart, you must put it back. But you don't replace the car unless it's totaled. *Supports Duty of Care, Rejects Regime Change.*
      *   *Bystander/Good Samaritan:* Duty to rescue, limited by risk. Less obligation for long-term care.
      *   *Gardener:* Pruning vs. Uprooting. Pruning (limited intervention) is valid. Weeding is ongoing.

  8.  **Drafting the Response:**
      *   *Table:* Clear mapping.
      *   *Disanalogies:* Categorize into "Fatal to Conc 1," "Fatal to Conc 2," or "Neutral."
      *   *Assessment:* Argue that the Surgical Analogy actually undermines Conc 1 (because political tumors aren't discrete) but supports Conc 2 (ethical causality).
      *   *Separation:* Show they can be decoupled.
      *   *Alternative:* Firefighter is best for "stop the harm, don't own the future," but Mechanic is best for "fix what you broke." Let's go with **Firefighter** for the "limited intervention" aspect or **Mechanic** for the "responsibility" aspect. Actually, the **Firefighter** analogy is standard in Just War theory for humanitarian intervention. It allows for limited engagement without total ownership of the state's future structure, but implies a duty to ensure the fire is out.
      *   *Refinement:* The prompt asks to distinguish disanalogies that matter for *her* conclusions.
          *   Conc 1 (All-or-Nothing): Relies on the "Tumor" being discrete and removable without killing the patient. Disanalogy: Regimes are structural.
          *   Conc 2 (Duty of Care): Relies on the "Surgeon" having fiduciary duty. Disanalogy: Soldiers are not doctors; states are not charities. But the *causal* link holds.

  9.  **Finalizing the Verdict:**
      *   All-or-Nothing: Fails (Political reality differs from medical pathology).
      *   Duty of Care: Survives with repairs (Causal responsibility exists, but scope is limited by capacity/sovereignty).

  10. **Review against Constraints:**
      *   Correspondence table? Yes.
      *   Mark breakdowns? Yes.
      *   Distinguish disanalogies by conclusion impact? Yes.
      *   Assess survival of conclusions? Yes.
      *   Alternative analogy? Yes.
      *   Specific final line format? Yes.

  11. **Self-Correction/Nuance Check:**
      *   *Wait, does the surgical analogy actually support All-or-Nothing?* In surgery, sometimes you *do* stop after a biopsy or palliative care. But the colleague argues "once you cross the skin... committed to removing the whole growth." This is a specific medical claim (don't leave open wounds/infection). I need to address why this medical claim doesn't map to war.
      *   *Key distinction:* In surgery, leaving a wound open risks infection (entropy). In war, leaving a regime in place *might* be stable (Kosovo). So the "entropy" assumption is the weak point.
      *   *Duty of Care:* In surgery, the surgeon *must* follow up. In war, the intervener *should* but often *won't*. The normative claim holds even if the descriptive fails.

  12. **Final Polish:** Ensure tone is analytical and philosophical, matching the prompt's sophistication. (Proceed to generate output).

  *(Self-Correction during drafting)*: Make sure to explicitly state which disanalogies kill which conclusion.
  *   Disanalogy: Tumor vs. Regime. (Kills Conc 1).
  *   Disanalogy: Surgeon's Fiduciary Duty vs. State Interest. (Complicates Conc 2).
  *   Disanalogy: Passive Patient vs. Active Population. (Complicates both).

  Let's refine the "Verdict".
  Conc 1 (All-or-Nothing): Fails. The analogy assumes pathology is discrete; political power is relational.
  Conc 2 (Duty of Care): Survives with repairs. The causal link holds, but the *scope* of care is not "ownership" but "stabilization."

  Alternative Analogy: **Firefighter**.
  *   Fire = Violence/Atrocity.
  *   House = State.
  *   Action = Put out fire.
  *   Implication: You don't need to rebuild the house (Regime Change), but you can't leave it smoldering (Duty of Care). This separates the two conclusions perfectly.

