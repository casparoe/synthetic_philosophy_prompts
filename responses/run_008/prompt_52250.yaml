answer: |-
  Yes, there are established concepts for both patterns. They are distinct phenomena in decision theory and systems thinking, but they share a common root cause: the attempt to force a **complex, multi-dimensional, dynamic system** into a **simple, single-dimensional, static model**.

  Here are the precise names, how they apply to your cases, where your cases come loose from the textbook definitions, and what that implies for your scoring system.

  ---

  ### Pattern 1: The Intransitive Cycle
  **Concept:** **Intransitivity of Preference** (violating the Transitivity Axiom).

  In rational choice theory, a preference relation is "rational" only if it is transitive: if you prefer A to B, and B to C, you must prefer A to C. Your team is exhibiting **intransitive preferences** (A > B, B > C, C > A).

  **Why the score fails:**
  A single arithmetic score creates a **Scalar Utility Function**. By definition, scalars are totally ordered. If Score(A) > Score(B) and Score(B) > Score(C), mathematics *forces* Score(A) > Score(C).
  Your team's intuition, however, is not scalar; it is **Multi-Attribute**.
  *   **A vs. B:** They weigh *Urgency* heavily (Data corruption is burning).
  *   **B vs. C:** They weigh *Value* heavily (Dashboard brings revenue).
  *   **C vs. A:** They weigh *Risk/Foundational Health* heavily (Payments refactor prevents future catastrophe).

  **Where your case comes loose:**
  In strict economics, intransitivity is considered an "error" to be arbitraged away (the "money pump" argument). However, your team insists it isn't an error. They are correct in a **Context-Dependent Preference** framework. The "weights" of the attributes (Urgency, Value, Risk) are not static; they shift based on the specific pairing.
  *   **The Mismatch:** The score assumes **Static Weighting** (Risk is always 20% of the score). The humans use **Dynamic Weighting** (Risk is 20% usually, but 80% when comparing Core Infrastructure vs. New Feature).
  *   **The Name:** This is a failure of **Multi-Attribute Utility Theory (MAUT)** collapsing into a single dimension. You cannot linearize a multi-dimensional value space without losing the information required to make specific pairwise trade-offs.

  ### Pattern 2: The Accumulated Drift
  **Concept:** **Myopic Optimization** (or **Greedy Algorithm Failure**) leading to **Path Dependence**.

  This is the software engineering manifestation of a **Greedy Algorithm**: making the locally optimal choice at each stage with the hope of finding a global optimum. In complex systems, this frequently leads to a **Local Maximum** that is far inferior to the **Global Maximum**.

  **Why the score fails:**
  The score evaluates decisions based on the *current* state of the system. It assumes **Separability**: that the value of a decision is independent of previous decisions.
  *   **Quarter 1:** Shipping feature > Fixing bug. (True, system is healthy).
  *   **Quarter 10:** Shipping feature > Fixing bug. (False, system is fragile, but the score hasn't adjusted the "cost of fragility" exponentially).

  **Where your case comes loose:**
  This is specifically **Non-Linear Accumulation** (Technical Debt). The cost of debt does not grow linearly; it compounds. A scoring model usually treats debt as a linear negative input.
  *   **The Mismatch:** The score assumes **Ergodicity** (the time average of the system equals the ensemble average). It assumes you can make 10 small "rational" bets and end up in a rational place.
  *   **The Name:** In Systems Dynamics (Donella Meadows), this is **Drift to Low Performance**. The system state degrades, lowering the standard for what is considered "acceptable," allowing further degradation. In decision theory, this is a failure of **Intertemporal Choice** due to **Hyperbolic Discounting** (valuing immediate payoff disproportionately higher than future cost).

  ---

  ### Are they the same phenomenon?

  **Mathematically: No.**
  *   Pattern 1 is a **Dimensionality Problem** (N-dimensions collapsed to 1).
  *   Pattern 2 is a **Temporal/State Problem** (Dynamic state treated as Static).

  **Systemically: Yes.**
  Both are symptoms of **Reductionism in Complex Adaptive Systems**.
  Your organization is treating software development as a **Complicated System** (like a car engine, where parts are interchangeable and outcomes are predictable via formula) when it is actually a **Complex System** (like a rainforest, where agents interact, context shifts, and outcomes are emergent).

  This is best described by the **Cynefin Framework**.
  *   **The Score:** Assumes the domain is **Complicated** (sense-analyze-respond).
  *   **The Reality:** The domain is **Complex** (probe-sense-respond).

  In a Complex domain, "right answers" do not exist prior to interaction; they emerge. A spreadsheet score attempts to determine the answer *prior* to interaction.

  ### The Overarching Law: Goodhart's Law

  While the above explain the *mechanics* of the failure, the *organizational* failure is **Goodhart's Law**:
  > "When a measure becomes a target, it ceases to be a good measure."

  By trying to replace argument with the score, you turned the score into a target.
  1.  **Pattern 1:** Teams will game the inputs to force the transitivity they need, rendering the score fiction.
  2.  **Pattern 2:** Teams will optimize for the quarterly score (ship feature) at the expense of the unmeasured long-term health (code quality), because the score doesn't capture the compounding cost.

  ### Recommendation: Should you stop building the scores?

  **Stop building them as *deciders*. Start building them as *discussers*.**

  The score is not useless, but its purpose is inverted in your organization.
  1.  **Don't sort the spreadsheet to decide.** If the score says A > B but the team argues for B, **the team is right and the score is wrong.** The score failed to capture a variable (e.g., "hidden risk").
  2.  **Use the delta as the conversation starter.** "The score says we should do the Dashboard, but we all want to do the Refactor. What variable is the score missing? Is it Risk? Is it Morale? Let's adjust the weights *for this decision*."
  3.  **Acknowledge Intransitivity.** Accept that A > B and B > C and C > A is a valid state of the world. It means you cannot use a sorted list. You must use a **Pairwise Comparison** method (like Analytic Hierarchy Process) that accepts cycles, or simply admit that roadmap planning requires **Deliberative Democracy** (argument), not **Technocracy** (arithmetic).

  **Summary for your leadership:**
  Tell them the scoring system is failing due to **Intransitive Preferences** (Pattern 1) and **Myopic Optimization** (Pattern 2). These are not bugs in the team's reasoning; they are mathematical proofs that a single scalar value cannot model the multi-dimensional, time-dependent reality of software engineering. Continuing to enforce the score will not reduce argument; it will only drive the argument underground, where it becomes about manipulating inputs rather than solving business problems.
