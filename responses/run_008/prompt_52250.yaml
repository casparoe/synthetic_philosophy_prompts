prompt: |-
  I'm a software engineer, and over the past few years our organization has repeatedly tried to replace argument with arithmetic: a single prioritization score that would let roadmap decisions be made by sorting a spreadsheet. The scores never survive contact with reality, and I've been trying to work out whether what keeps killing them is a known thing or just bad score design. Two patterns recur. First, comparisons that work fine in isolation refuse to line up: the team prefers fixing the data-corruption bug to building the new dashboard, and the dashboard to refactoring the payments module, but when the corruption bug and the payments refactor are put head to head, they pick the refactor -- and they insist this isn't an error to be trained out of them. Second, a sequence of individually correct trades: each quarter, shipping something known-imperfect ahead of a scheduled fix was clearly worth it by the numbers, everyone agreed each time, no single step looks wrong in retrospect, and yet after two years nobody will defend the cumulative state of the codebase. Nobody was wrong at any decision point, but the destination is one nobody would have chosen from the start. Is there an established concept, or more likely two different concepts, covering these -- the comparison-order one, and the locally-defensible-globally-indefensible one? If names exist, I want to know how precisely they apply and where my cases come loose from them; if they don't, I'd like candidate definitions sharp enough to tell me whether the two patterns are actually the same phenomenon, and whether my company should stop trying to build such scores at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Software engineer in an organization trying to use a single "prioritization score" (arithmetic) to replace argument/discussion for roadmap decisions.
      *   **Outcome:** The scores fail ("never survive contact with reality").
      *   **Pattern 1 (Intransitivity):** Team prefers A > B, B > C, but C > A. They insist this isn't an error.
      *   **Pattern 2 (Accumulated Technical Debt/Drift):** Locally optimal decisions (ship feature > fix bug) lead to a globally undesirable state (rotten codebase) after many iterations. No single step was "wrong," but the sum is bad.
      *   **Goal:** Identify if there are established concepts/names for these patterns. Determine if they are the same phenomenon. Advise on whether to stop building such scores.

  2.  **Deconstruct Pattern 1: Intransitive Preferences:**
      *   *Observation:* A > B, B > C, but C > A.
      *   *Economic/Math Term:* **Intransitivity** (violation of transitivity axiom).
      *   *Specific Paradox:* **Condorcet Paradox** (voting theory) or **Preference Cycles**.
      *   *Psychological/Behavioral Term:* **Context-Dependent Preference** or **Framing Effects**.
      *   *Relevance to Scoring:* A single scalar score *forces* transitivity (if Score(A) > Score(B) and Score(B) > Score(C), then Score(A) > Score(C)). If human preference is intransitive, a scalar score cannot model it.
      *   *Why humans do this:* Different criteria weigh differently depending on the pair. (A vs B: Urgency dominates. B vs C: Value dominates. C vs A: Risk dominates). This is **Multi-Criteria Decision Analysis (MCDA)** collapsing into a single dimension improperly.
      *   *Key Concept:* **Arrow's Impossibility Theorem** (related to aggregating preferences), but more directly, the violation of **VNM Rationality Axioms** (Von Neumann-Morgenstern).
      *   *Best Fit:* **Intransitivity of Preference** (specifically driven by **Multi-attribute Utility Theory** failure).

  3.  **Deconstruct Pattern 2: Local Optima leading to Global Pessima:**
      *   *Observation:* Good short-term decisions sum to a bad long-term outcome.
      *   *Economic/Game Theory Term:* **Tragedy of the Commons** (if different stakeholders benefit short term, collective suffers).
      *   *Optimization Term:* **Hill Climbing** (getting stuck in a local maximum) or **Greedy Algorithm** failure.
      *   *Systems Thinking Term:* **Drift to Low Performance** or **Shifting the Burden**.
      *   *Specific Concept:* **Myopic Optimization** or **Short-termism**.
      *   *Technical Debt Context:* This is the definition of **Unintentional Technical Debt** accumulating via **Rational Neglect**.
      *   *Key Concept:* **Non-ergodicity** (time average != ensemble average) - maybe too abstract.
      *   *Better Concept:* **Path Dependence** (history matters, you can't just optimize the current state).
      *   *Best Fit:* **Greedy Algorithm Failure** (in CS terms) or **The Sorites Paradox** (philosophical heap problem) or **Drift to Low Performance** (Systems Dynamics). Let's look for something more precise about decision theory. **Hyperbolic Discounting** (valuing now much more than later).
      *   *Refinement:* This is specifically about the failure of **Separability** in decision theory. The utility of a sequence is not the sum of the utilities of the parts.

  4.  **Synthesize and Connect:**
      *   Are they the same? Both stem from trying to force complex, multi-dimensional, temporal realities into a single, static, linear scalar (the "score").
      *   Pattern 1 is about *dimensionality reduction* (collapsing multiple criteria into one number loses information needed for pairwise comparison).
      *   Pattern 2 is about *temporal reduction* (ignoring state changes and compounding effects over time).
      *   Underlying cause: **Reductionism** in Complex Adaptive Systems.
      *   Specific Decision Theory term: **Goodhart's Law** (when a measure becomes a target, it ceases to be a good measure). This applies to the *organization's* attempt to use the score.
      *   Another strong candidate: **The Fallacy of Composition** (what is true for the part is not true for the whole).

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the frustration. Validate that this is a known failure mode of "algorithmic management" in engineering.
      *   *Pattern 1 (The Cycle):*
          *   Name: **Intransitivity of Preference** (or Preference Cycles).
          *   Why: Human value is multi-dimensional. A single score imposes a 1D line on an N-dimensional space.
          *   Concept: **Multi-Attribute Utility Theory (MAUT)**. When you collapse attributes (Risk, Value, Effort) into one number, you lose the *trade-off ratios* which change based on context.
          *   Why the team is right: They are dynamically re-weighting criteria. The score assumes static weights.
      *   *Pattern 2 (The Drift):*
          *   Name: **Myopic Optimization** / **Greedy Algorithm Failure**.
          *   Systems Thinking Name: **Drift to Low Performance** (Meadows).
          *   Decision Theory Name: **Non-Separability of Intertemporal Choice**. The value of a decision depends on the state of the system *after* previous decisions.
          *   Concept: **Path Dependence**.
      *   *Are they the same?*
          *   Root cause: Yes. **Category Error**. Treating a Complex Adaptive System (software org) like a Complicated System (engine).
          *   Specific Mechanism: Both are failures of **Scalar Utility Functions**.
      *   *Advice:* Stop building the score. Use the score as a *input* to conversation, not a *replacement* for it.
      *   *Key Reference:* **Goodhart's Law** is the overarching umbrella. **Cynefin Framework** (Complicated vs Complex) is good for organizational context.

  6.  **Refining the Concepts (Self-Correction/Polishing):**
      *   *Pattern 1:* Is it Condorcet? Condorcet is about voting aggregates. This is about a single group's internal consistency. It's strictly **Intransitive Preferences**. In economics, this violates the **Independence of Irrelevant Alternatives (IIA)** sometimes, but mostly it just violates **Transitivity**.
      *   *Pattern 2:* "Nobody was wrong at any decision point." This is the **Sorites Paradox** (Paradox of the Heap) applied to debt. But more technically, it's the failure of a **Greedy Strategy**. In control theory, it's **Model Predictive Control** with too short a horizon.
      *   *Unifying Theory:* **Goodhart's Law** is the most famous, but **Campbell's Law** is also relevant. However, the *mathematical* reason is **Dimensionality Reduction**.
      *   *Wait, one more:* **The Fallacy of Composition**. What is rational for the quarter is irrational for the decade.
      *   *Best Unifier:* **Reductionism in Complex Systems**.

  7.  **Finalizing the Structure:**
      *   **Direct Answer:** Yes, there are names.
      *   **Pattern 1:** Intransitivity / Multi-Criteria Decision Failure.
      *   **Pattern 2:** Myopic Optimization / Path Dependence / Drift to Low Performance.
      *   **The Unifying Diagnosis:** The Category Error (Complex vs. Complicated) & Goodhart's Law.
      *   **Actionable Advice:** Don't build the score to decide; build it to discuss.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly address the "where my cases come loose" part.
      *   Pattern 1 comes loose because human preference is context-dependent (weights shift).
      *   Pattern 2 comes loose because system state is dynamic (debt compounds non-linearly).
      *   Both come loose because the score assumes linearity and static context.

  9.  **Final Polish:** Ensure tone is empathetic to the engineer but firm on the systems theory. Use bolding for key terms. (Proceed to generate output).

  *(Self-Correction post-drafting thought)*: I should mention **Arrow's Impossibility Theorem**? No, that's about voting systems aggregating *different people's* preferences. This is about *one group's* preferences over time/context. Stick to Intransitivity.
  I should mention **Technical Debt** explicitly. Yes.
  I should mention **Goodhart's Law**. Yes, crucial for the organizational behavior aspect.

  Let's organize the response clearly around the two patterns, then the synthesis.

  *Pattern 1:* **Intransitivity of Preference** (violating the Transitivity Axiom of Rational Choice). Also **Context-Dependent Weighting**.
  *Pattern 2:* **Myopic Optimization** (Greedy Algorithm) leading to **Path Dependence** and **Drift to Low Performance**.
  *Synthesis:* **Goodhart's Law** + **Category Error (Cynefin)**.

