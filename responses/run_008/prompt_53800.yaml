answer: |-
  In the back office of a family-owned hardware store, manager Elias notices recurring discrepancies in the nightly cash drawer and dubs the culprit "Morgan," while night security guard Sarah hears distinct pacing sounds in the warehouse aisles and names the intruder "Alex." Elias argues Morgan is careful and silent, whereas Sarah insists Alex is clumsy and loud, leading to a debate over whether to install silent alarms for Morgan or floodlights for Alex; eventually, a junior clerk suggests, "What if Morgan and Alex are the same person working different angles?" causing the team to pause and reconsider their defensive strategy, unaware that the cash discrepancies stem from a software rounding error and the pacing sounds from a loose vent flap banging in the wind, meaning neither Morgan nor Alex exists.

  ### Walkthrough

  **1. The Fregean Treatment**
  On a broadly Fregean picture, "Morgan" and "Alex" express distinct senses (modes of presentation). The sense of "Morgan" is something like *the agent responsible for the cash discrepancies*, while the sense of "Alex" is *the agent responsible for the warehouse pacing*. The identity statement "Morgan is Alex" expresses the thought that the object presented by the first sense is identical to the object presented by the second. It is informative because the senses differ; grasping the thought requires recognizing that two distinct evidential profiles converge on a single entity. However, this case worsens the Fregean's embarrassment regarding empty terms. Frege wants sense to mediate reference, but if reference fails completely, what are these senses presenting? If senses are abstract objects that exist regardless of reference, the thought exists, but its truth conditions become murky—is it false because there is no object, or truth-valueless? The embarrassment deepens because the characters' practical reasoning treats the senses as robust enough to guide action (buying alarms vs. lights), suggesting the senses have a grip on the world that the ontology denies. If sense determines reference, and reference is null, the distinction between the senses looks like a distinction without a difference in the world, yet it carries all the cognitive weight of a genuine discovery. The case highlights that the *cognitive significance* survives the *ontological vacuum* intact, forcing the Fregean to explain how two "ways of givenness" can differ meaningfully when there is nothing given.

  **2. The Millian Treatment**
  On a Millian picture, a name's semantic contribution is just its bearer. Since neither Morgan nor Alex exists, neither name contributes anything to the proposition. The identity statement therefore expresses either no proposition at all or a "gappy" proposition containing a hole where the object should be. I would endorse the escape route that treats the statement as semantically false (or truth-valueless) but *pragmatically* meaningful. The characters are not really asserting a singular proposition about an object; they are asserting a general claim about the causal sources of their evidence: *the cause of the cash errors is the same as the cause of the pacing sounds*. This paraphrase captures the informative nature of the clerk's suggestion—it links two distinct causal chains. To the objection that this fails to capture why the characters treat the statement as a substantive truth about a *particular thing*, I would argue that this is an error theory: the characters are under an illusion. They feel they are tracking a particular because their cognitive systems are designed to posit agents to explain patterns. The Millian admits the intuition is powerful but insists it is metaphysically mistaken; the utility of the statement lies in coordinating their responses to the evidence clusters, not in describing an actual agent. The "substantiveness" is a feature of their psychology, not the semantics.

  **3. Feature Analysis**
  The feature doing the work is the **inference to the best explanation grounded in distinct evidence streams**. The terms are not labels attached to nothing; they are hypotheses posited to explain specific phenomena.
  *   **If the terms are explicitly fictional:** If Elias and Sarah know they are writing a story about a burglar, the identity statement becomes a matter of narrative consistency, not empirical discovery. The puzzle collapses because the "truth" is determined by authorial decree, not evidence. The stakes vanish because no actual security measures depend on the identity.
  *   **If one term is introduced by pure stipulation:** If Elias simply says, "Let 'Morgan' name whoever stole this," without specific evidence distinguishing Morgan from Alex, the sense becomes too thin. The identity statement loses its informativeness because there is no distinct evidential profile to merge. The puzzle reverts to a trivial logical exercise rather than an epistemic discovery.
  *   **If you reveal in-story that one term does refer:** If Morgan turns out to be a real disgruntled employee but Alex is still the wind, the statement "Morgan is Alex" becomes simply false. The symmetry of emptiness is broken. The puzzle dissolves into a standard case of mistaken identity involving one existing object and one non-existing one, removing the tension of how two nothings can be informatively identical. The sharpness of the original case relies on the *balanced emptiness* which forces the theories to account for informativeness without relying on any actual referent to anchor the difference.
