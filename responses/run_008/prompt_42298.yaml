  Yes, a single principle captures all five: **Prospect Theory**. Your friend cites Expected Utility Theory, which assumes linear probability weighting. Your brain applies non-linear weighting, specifically overweighting certainty.

  *   **Verdicts 1 & 2:** This is the Allais Paradox. You overweight the 100% chance in Pair 1, accepting lower Expected Value (EV) for safety. In Pair 2, certainty is removed from both options, so the "certainty premium" vanishes, and you chase the higher payoff.
  *   **Verdict 3:** This confirms your hunch. Changing 100% to 99% removes the special psychological weight of certainty. Without that bonus, the gamble's superior EV dominates. Your hunch squares perfectly here.
  *   **Verdict 4:** Diminishing sensitivity. Utility is nearly linear for £10 (risk-neutral), but sharply concave for £1m (risk-averse).
  *   **Verdict 5:** You value final wealth states, not the emotional trajectory of waiting. This fits standard outcome-based models.

  **The Loss Mirror**
  Prospect Theory predicts the **Reflection Effect**: risk preferences reverse for losses.
  *   *Choice:* £1m loss for sure versus 89% lose £1m / 10% lose £5m / 1% lose nothing.
  *   *Prediction:* You will take the **gamble**. People are risk-seeking in losses. The 1% chance of losing nothing is overweighted (hope), and the marginal pain of losing an extra £4m feels less severe than the sure pain of losing £1m. You will gamble to avoid a sure loss, even though the sure loss has the better EV.

  **Advice**
  Your verdicts are internally consistent under descriptive psychology, even if they violate normative axioms. You don't need to overturn any. However, recognize that this wiring prioritizes regret minimization over wealth maximization. In repeated high-stakes decisions, forcing Expected Value calculations (ignoring the certainty effect) will build more wealth, even if it feels emotionally harder. Your friend is right on math; you are right on human nature.
