answer: |-
  Here are ten interview questions tailored to your guest's specific positions, with follow-ups designed to cut through her standard defences. I've included a brief note on the *Likely Reply* for each, so you know why the follow-up is framed the way it is.

  ### 1. The Compulsion vs. Justification Distinction
  **Question:** You argue that no rule of inference compels a rational mind to accept a conclusion. But critics say you're conflating *compulsion* with *justification*. Nobody thinks a proof wrestles you to the ground physically. So when you say logic doesn't "force" the move from A and B to C, are you saying the move isn't *necessary*, or just that it isn't *violent*? What exactly is missing in the Tortoise's reasoning that a proof is supposed to supply?

  *   **Likely Reply:** She will say necessity isn't a kind of force, and that the "missing" element is a voluntary act of endorsement.
  *   **Follow-up:** If it's a voluntary act, then isn't the difference between a valid deduction and a non-sequitur just a difference in what we *choose* to endorse? Where does the *wrongness* of a bad inference live if not in the structure itself?

  ### 2. The Tortoise's Mental State
  **Question:** Let's pin down the Tortoise himself. In your view, when he accepts "A" and "If A then B" but refuses "B", does he genuinely hold those first two beliefs? Or are you suggesting that you can't count as believing a conditional unless you're disposed to make the *modus ponens* move? If he can hold the premises without the conclusion, does the word "if" mean the same thing to him as it does to Achilles?

  *   **Likely Reply:** She'll likely argue he holds the beliefs but lacks the *disposition* to infer, and that meaning is use-based but variable.
  *   **Follow-up:** If his "if" doesn't mandate the move, is he actually reasoning with conditionals, or is he just making noises that look like conditionals to us? At what point does his logic become so different we can't call it logic at all?

  ### 3. The Charge of Psychologism
  **Question:** Frege spent his career trying to purge psychology from logic. You seem to be inviting it back in by suggesting that what stops the regress is "training and habit." Have you essentially swapped a logical question for a psychological one? If the brake on the regress is just that we're schooled not to go further, haven't you answered the wrong question—explaining why we *do* infer, rather than why we *should*?

  *   **Likely Reply:** She will claim she's explaining the *possibility* of inference, not just the cause, and deny the Fregean distinction is as sharp as we think.
  *   **Follow-up:** But if the "should" is just a internalized "do," how do you distinguish a reasoner from a well-trained parrot? Both stop at the same place out of habit. What makes the reasoner's stop *justified* rather than just *conditioned*?

  ### 4. Pinning Down "Structural, Not Psychological"
  **Question:** You often describe the regress as "structural, not psychological." I've never managed to pin down what that's supposed to mean. If the stopping point isn't in our heads (psychological), but it's not a Platonic truth compelling us (logical), where is this structure located? Can you give me a concrete example of a "structural" constraint that doesn't cash out as either a fact about the world or a fact about our minds?

  *   **Likely Reply:** She will likely call it a feature of our *practices* or *language games* that transcends individual psychology but isn't metaphysical.
  *   **Follow-up:** If it's a feature of practice, isn't that just collective psychology? If I'm the only person left in the universe, does the structure vanish? If it doesn't vanish, what is it made of?

  ### 5. Rule-Following and Future Application
  **Question:** This sounds uncomfortably close to Wittgenstein's rule-following paradox: no rule determines its own future applications. Are you essentially arguing that *modus ponens* is underdetermined by the rule itself? If so, is the regress inevitable for *any* rule-governed activity, or is logic special?

  *   **Likely Reply:** She'll agree it applies to all rule-following and deny logic is special.
  *   **Follow-up:** If logic isn't special, then the move from "this is poison" to "I shouldn't drink it" is on the same footing as "A, A→B, therefore B." Does that mean practical rationality is just as groundless as deductive logic?

  ### 6. The Community of Tortoises (Relativism)
  **Question:** You've written that a community of Tortoises who never took the *modus ponens* step would be "recognisably rational by their own lights." That sounds a lot like relativism. If they are rational by their lights, and we are rational by ours, do we have any grounds to say they are *wrong*? Or just *different*?

  *   **Likely Reply:** She'll argue that "rationality" is internal to a system, and we can't judge them from outside without begging the question.
  *   **Follow-up:** If we can't judge them wrong, can we still say their system is *less effective* at predicting the world? If yes, doesn't that reintroduce a non-relative standard of success that eventually forces logical norms on them?

  ### 7. The Regress in Perception
  **Question:** You reckon this regress infects perception and testimony too. How does that work? If I see a chair, I don't feel like I'm making an inference. Are you saying I'm silently accepting a premise like "My eyes are reliable," and could refuse that too?

  *   **Likely Reply:** She'll say all perception is theory-laden and involves a tacit endorsement of reliability that could be withheld.
  *   **Follow-up:** If I can withhold that endorsement without irrationality, is there *anything* that is immediately justified? Or is justification just a story we tell after the fact to stop the questioning?

  ### 8. Entitlement and Authority
  **Question:** In your papers, you say anyone accepting the premises is "entitled" to the conclusion. If logic doesn't compel, who or what grants the entitlement? Is it a social permission? Because if I'm a Tortoise and I don't feel entitled, does the entitlement still exist?

  *   **Likely Reply:** She'll likely say entitlement is a status within a practice, not a feeling.
  *   **Follow-up:** So if I opt out of the practice, I opt out of the entitlement? That makes logic sound like a club with membership rules, not a description of truth. Are you okay with that reduction?

  ### 9. Error and Correction
  **Question:** If justification is ultimately a psychological fact about us—about how we're schooled—how do we account for logical *error*? If I make a mistake in a proof, you correct me. But if you're right, I could just say, "My training stops here." What gives you the authority to say my stopping point is a mistake and yours isn't?

  *   **Likely Reply:** She'll argue that consistency within the shared practice dictates correction.
  *   **Follow-up:** But if the practice itself is just a habit that could have been otherwise, isn't the "mistake" just a deviation from the norm? That makes the logician a policeman of convention, not a discoverer of truth.

  ### 10. The Practical Consequence
  **Question:** I write crime novels. In my world, if the detective gets the logic wrong, an innocent person hangs. If your view is right, and the step from evidence to verdict is just a habit we're trained into, what protects us from the detective who is trained differently? Is there any final appeal to Reason, or just a clash of habits?

  *   **Likely Reply:** She'll likely say we appeal to the consequences of the habits and which community we want to live in.
  *   **Follow-up:** So if a community trains itself to ignore exculpatory evidence using a valid-but-rejected inference rule, we can't say they're *logically* broken, only that we don't like their habits? Is that a bullet you're still happy to bite?
