prompt: |-
  I write novels — long series with returning characters, mostly — and I have become fixated on a question I recently discovered philosophers have been fighting about for half a century, only about flesh-and-blood people rather than fictional ones. In my world the question surfaces whenever I revise. I am preparing a third book whose editor wants me to change a principal character's backstory: her parentage, the town she grew up in, the formative accident I gave her in the first volume. If I make the change and readers still accept her as the same person, was she? If I change enough, even a forgiving reader will eventually say I have written a different character who merely shares the name. I gather this is adjacent to what philosophers call origin essentialism — Kripke's claim that a person could not have developed from a different sperm and egg, that our origins are essential to us rather than accidental facts about us — along with the dissenting positions, such as Lewis's counterpart theory, on which someone very like you could come from different origins without being you, and the finer-grained disputes about how much of the origin is essential (whether, say, the very same zygote implanted elsewhere would still have been you).

  Translate this debate into the working vocabulary of my craft, as faithfully as you can: drafts and retcons, canon versus apocrypha, the character bible, the distinction between a reboot and an adaptation, the continuity error, and every series writer's question of how much established history a character can absorb before she breaks. Start with the gamete argument — what is the craft-world analogue of the intuition that you could not have come from a different pair of origins? Then do the alternatives: the counterpart-theoretic move, and any rivals that let psychological or narrative continuity rather than origin do the essential work. For each, say what translates cleanly, what has to be distorted to fit — I suspect that authorial fiat, my ability to simply decree that the old backstory never happened, has no counterpart in the metaphysics of actual persons — and what cannot be expressed in craft vocabulary at all.

  Then give me the residue report, which is what I actually care about. Does the comparison reveal something the philosophical debate is missing — namely that identity can be partly constituted by decision and reception rather than discovered — or does it show that craft vocabulary is too coarse to carry the debate's real content, the modal force of the 'could not' that does the essential work? And be honest about whether my editor's request gives me any evidence at all about origin essentialism for actual people, or whether fictional and biological origin essentialism merely share a name.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing long series with returning characters.
      *   **Problem:** Editor wants to change a principal character's backstory (parentage, hometown, formative accident) in Book 3.
      *   **Core Question:** If the change is made and readers accept her as the same person, *is* she? When does she become a different character?
      *   **Philosophical Context:** The user knows about Origin Essentialism (Kripke), Counterpart Theory (Lewis), and psychological continuity.
      *   **Task:** Translate this philosophical debate into the vocabulary of fiction writing (drafts, retcons, canon, character bibles, reboots, etc.).
      *   **Specific Requirements:**
          1.  Start with the "gamete argument" analogue (origin essentialism in fiction).
          2.  Cover alternatives (counterpart theory, psychological/narrative continuity).
          3.  For each, specify: what translates cleanly, what is distorted (especially authorial fiat), and what is inexpressible in craft vocabulary.
          4.  Provide a "Residue Report": What does this comparison reveal? (Is identity constituted by decision/reception? Is craft vocabulary too coarse? Does this offer evidence for real-world origin essentialism?)
      *   **Tone:** Intellectual, respectful of both philosophy and craft, honest, nuanced.

  2.  **Deconstruct the Philosophical Concepts & Map to Craft:**

      *   **Kripke's Origin Essentialism (The Gamete Argument):**
          *   *Philosophy:* You cannot come from different parents/zygote. It's metaphysically necessary.
          *   *Craft:* The "Character Bible" or "Series Bible." The initial conception (pitch, outline, Book 1 text).
          *   *Translation:* If you change the "zygote" (Book 1 origin), is it the same character?
          *   *Distortion:* Authors *can* change origins (retcon). In reality, you can't. This is the "Authorial Fiat" problem.
          *   *Inexpressible:* The *necessity* of the origin. In fiction, nothing is necessary except what the author says is.

      *   **Lewis's Counterpart Theory:**
          *   *Philosophy:* You are world-bound. In other possible worlds, there are *counterparts* who resemble you but aren't *you*.
          *   *Craft:* Multiverse, reboots, "Elseworlds," adaptations.
          *   *Translation:* The Book 3 version with new backstory is a *counterpart* of the Book 1 version, not the *same* entity persisting through time.
          *   *Distortion:* Readers often *want* them to be the same. Counterpart theory says they aren't.
          *   *Inexpressible:* The modal distance. In fiction, the "worlds" are just pages in the same book.

      *   **Psychological/Narrative Continuity (Locke/Parfit):**
          *   *Philosophy:* Identity is about memory, personality, continuous consciousness.
          *   *Craft:* Character voice, internal monologue, consistent motivation, "staying in character."
          *   *Translation:* As long as she *acts* like herself and remembers the *current* version of events, she's the same.
          *   *Distortion:* Memory can be rewritten externally (by the author), not just internally lost.
          *   *Inexpressible:* The subjective feeling of "I am me."

  3.  **Drafting the Sections:**

      *   **Introduction:** Acknowledge the depth of the question. It's the "Ship of Theseus" for serial fiction.
      *   **Section 1: The Gamete Argument (Origin Essentialism in Craft):**
          *   Analogue: The "Series Bible" / Book 1 Text as the zygote.
          *   Clean translation: The intuition that changing the seed changes the tree.
          *   Distortion: Authorial Fiat. I can snap my fingers and change the past.
          *   Inexpressible: Metaphysical necessity.
      *   **Section 2: Counterpart Theory (The Multiverse/Reboot):**
          *   Analogue: Reboots, Adaptations, "Soft Retcons."
          *   Clean translation: Acknowledging the new version is distinct despite the name.
          *   Distortion: Readers hate this. They want trans-world identity.
          *   Inexpressible: The ontological gap between drafts.
      *   **Section 3: Psychological Continuity (The Voice):**
          *   Analogue: Character Voice / Core Wound.
          *   Clean translation: If the *result* is the same, the *cause* doesn't matter.
          *   Distortion: The "Formative Accident" is usually the source of the psychology. Changing it risks changing the psychology.
          *   Inexpressible: The reader's emotional investment in the *history*, not just the present.
      *   **Section 4: The Residue Report:**
          *   Address the user's specific questions.
          *   *Decision/Reception:* Yes, fictional identity is performative and communal (author + reader). Real identity is not (mostly).
          *   *Coarse Vocabulary:* Craft terms are pragmatic, not ontological. They solve plot holes, not metaphysical puzzles.
          *   *Evidence for Real People:* None. Fiction is ontologically dependent; people are not.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address "Authorial Fiat" enough? It's crucial. In philosophy, facts are fixed. In fiction, facts are mutable until publication, and even after, they can be retconned.
      *   *Check:* The user asked about the "Editor's Request." I need to make sure I touch on the *revision process* specifically. Revision is "time travel" for the author.
      *   *Check:* The "Residue Report" needs to be the punchline. It needs to answer: "Does this help me understand real people?" (Answer: No, but it helps you understand *characters*).
      *   *Nuance:* Distinguish between *in-universe* continuity and *meta-textual* continuity. Kripke is about the person; the Editor is about the text.

  5.  **Final Polish:**
      *   Ensure the tone is appropriate for a novelist who reads philosophy. Use terms like "modal force," "ontological status," "canonical authority."
      *   Make sure the distinction between "Canon" (what counts) and "Apocrypha" (what doesn't) is clear in the context of revision.
      *   *Key Insight:* In fiction, identity is *normative* (what should count), whereas in metaphysics, it is *descriptive* (what does count).

  6.  **Final Review against constraints:**
      *   Start with gamete argument? Yes.
      *   Do alternatives? Yes.
      *   Say what translates/distorts/fails? Yes.
      *   Residue Report? Yes.
      *   Honest about evidence for real people? Yes.

