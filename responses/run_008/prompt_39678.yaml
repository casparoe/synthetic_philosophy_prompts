  2.  **Deconstruct the Philosophy (J.L. Austin):**
      *   *Concept:* Performative utterances vs. Constative utterances. Performatives *do* things (promising, marrying, betting) rather than describing things.
      *   *Felicity Conditions:* For a performative to work (be "happy"), certain conditions must be met.
          *   (A.1) Conventional procedure exists.
          *   (A.2) Circumstances/persons appropriate.
          *   (B.1) Procedure executed correctly.
          *   (B.2) Procedure executed completely.
          *   (Γ.1) Participants have requisite thoughts/feelings (sincerity).
          *   (Γ.2) Participants conduct themselves subsequently.
      *   *Misfires:* If A or B conditions fail, the act is *null and void* (e.g., a layperson trying to marry someone).
      *   *Abuses:* If Γ conditions fail (insincerity), the act is *hollow* but the act still happened (e.g., promising without intent).
      *   *The "Etiolation" of Language:* Austin explicitly excludes poetry and theater. He says language there is "not seriously intended." It's a parasitic use of normal language. This is the user's starting point.

  3.  **Deconstruct the Play (*As You Like It*):**
