answer: |-
  ## Workshop Design: "The Boundaries of the Self"
  **Topic:** The Separateness of Persons Objection (Rawls vs. Utilitarianism)
  **Time:** 75 Minutes
  **Students:** 14 (Mid-level Undergraduate)

  ### I. Philosophical Rationale
  This activity is designed to create a phenomenological gap between *prudential rationality* (maximizing within a life) and *social aggregation* (maximizing across lives). By using identical numerical trade-offs in both rounds, we isolate the variable of **personal identity**. The "Compensation Phase" in Round 2 is crucial: it demonstrates that while monetary/point compensation can restore equilibrium, it cannot restore the *unity of experience* that makes sacrifice rational in the prudential case.

  ### II. Materials Needed
  1.  **Life Log Sheets (14):** Simple paper with 4 rows labeled "Period 1" to "Period 4," and a "Total" box.
  2.  **Wellbeing Tokens (approx. 200):** Dried beans, poker chips, or colored paper squares. (Value is purely symbolic).
  3.  **The "Burden" Card:** A distinct red index card.
  4.  **Projector/Whiteboard:** To track the "Social Total."
  5.  **Incentive:** The student(s) with the highest final token count get a trivial privilege (e.g., choosing the warm-up music for the next class, or a "homework pass" for a minor assignment). This ensures they care about the tokens without involving real money.

  ### III. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute Life Logs and 10 tokens to each student. Explain the "Currency" (Wellbeing Units). |
  | **05-20** | **Round 1** | **The Prudent Life.** Individual decision-making over 4 periods. |
  | **20-25** | **Pause** | Students calculate totals. No discussion yet. Instructor collects "Social Total" on board. |
  | **25-45** | **Round 2** | **The Social Contract.** Collective voting on resource allocation across persons. |
  | **45-55** | **Compensation** | **The Transfer.** Winners may voluntarily compensate the "Burdened." |
  | **55-75** | **Debrief** | Mapping the activity to Rawls' text and the limits of aggregation. |

  ---

  ### IV. The Rounds: Rules and Mechanics

  #### Round 1: The Prudent Life (Intra-personal)
  **Goal:** Demonstrate that sacrificing now for later is rational *within* a single life.

  1.  **Endowment:** Every student starts with **10 Tokens**.
  2.  **Period 1 (Status Quo):** Keep your 10 tokens. Record on Log.
  3.  **Period 2 (The Investment Choice):**
      *   **Option A (Prudence):** Surrender **8 Tokens** to the "Bank" (Instructor). You endure a "Hardship" (recorded as -8 on your log).
      *   **Option B (Impudence):** Keep all tokens. No hardship.
      *   *Note:* Almost all will choose Option A because they know the payoff is coming.
  4.  **Period 3 (Waiting):** No action.
  5.  **Period 4 (The Payoff):**
      *   If you chose Option A in Period 2: You receive **20 Tokens** from the Bank.
      *   If you chose Option B in Period 2: You receive **0 Tokens**.
  6.  **Calculation:**
      *   **Prudent Path:** 10 (Start) - 8 (P2) + 20 (P4) = **22 Tokens**.
      *   **Impudent Path:** 10 (Start) + 0 (P4) = **10 Tokens**.
  7.  **Outcome:** Everyone ends with 22 tokens. The "Social Total" on the board is $14 \times 22 = 308$.
  8.  **Facilitator Note:** Ask silently: *Did anyone feel this was unfair?* (No, because it was your own choice for your own gain).

  #### Round 2: The Social Contract (Inter-personal)
  **Goal:** Demonstrate that the *same math* feels morally distinct when boundaries of persons are crossed.

  1.  **Reset:** Everyone keeps their Round 1 winnings (22 tokens).
  2.  **The Proposal:** The Class acts as a "Central Planner." They must vote on a policy to maximize the **Class Total**.
  3.  **The Policy Options:**
      *   **Policy X (Status Quo):** Everyone keeps their 22 tokens. Class Total = 308.
      *   **Policy Y (Utilitarian Optimization):**
          *   One student (The "Burdened") must surrender **8 Tokens** immediately.
          *   The remaining 13 students each receive **2 Tokens** from the "Bank" (Total payout 26).
          *   **Math:** Burdened Student: $22 - 8 = 14$. Others: $22 + 2 = 24$.
          *   **Class Total:** $14 + (13 \times 24) = 14 + 312 = 326$.
          *   **Net Gain:** +18 Tokens for the society.
  4.  **Selection Mechanism:** To avoid targeting a specific friend, draw the "Burden" card randomly from a deck of 14 cards. One student is designated the "Burdened Person" for this scenario. (Assure them this is hypothetical, but the tokens are real).
  5.  **The Vote:** The class votes to enact Policy Y or stick with Policy X.
      *   *Prediction:* 13 students have a material incentive to vote Yes. 1 student has a strong incentive to vote No.
      *   *Facilitator Intervention:* Do not intervene. Let the utilitarian calculus run. If they vote Yes, proceed. If they vote No, ask *why* the math didn't sway them.
  6.  **The Compensation Phase (Crucial):**
      *   If Policy Y passes, the 13 "Winners" are allowed to voluntarily donate tokens back to the "Burdened" student.
      *   *Scenario:* If each winner gives 1 token back, the Burdened student rises to $14 + 13 = 27$ (Net gain!). The Winners drop to 23.
      *   *The Catch:* Even if the Burdened student ends up with *more* tokens than they started with, ask them: *Did you still experience the loss?*
      *   *The Point:* In Round 1, the Future Self comforts the Past Self. In Round 2, the Other Self pays the Burdened Self. The *experience* of the loss remains isolated in one consciousness.

  ---

  ### V. The Debrief: Mapping the Objection (20 Minutes)

  Do not simply ask "How did that feel?" Use the activity to reconstruct Rawls' argument step-by-step.

  **1. The Extension of Prudence (Minutes 55-60)**
  *   **Ask:** "In Round 1, why was it rational to lose 8 tokens?"
  *   **Expected Answer:** "Because I got 20 back later."
  *   **Philosophical Map:** This is the principle of **prudential rationality**. We accept present pain for future gain because the *person* suffering and the *person* benefiting are identical. The loss is "offset" by the gain within a single system of experience.
  *   **Link to Mill:** Utilitarianism treats Society as if it were this single Person. It assumes the "Social Total" is what matters, just as your "Life Total" mattered in Round 1.

  **2. The Discontinuity of Experience (Minutes 60-65)**
  *   **Ask (to the Burdened Student):** "If we compensated you fully in Round 2, is it exactly the same as Round 1?"
  *   **Expected Answer:** "No. In Round 1, I knew the gain was *mine*. In Round 2, the gain was *theirs*, and they gave me some."
  *   **Philosophical Map:** This is the **Separateness of Persons**. There is no "Social Mind" that experiences the +18 net gain. There are only 14 distinct minds. One mind experienced a net loss (temporarily), and 13 experienced a gain. The aggregation exists only on the whiteboard, not in reality.
  *   **Key Rawlsian Quote:** "No one morally has to accept a loss... for the sake of a greater balance of satisfaction in the society."

  **3. The Limits of Compensation (Minutes 65-70)**
  *   **Ask:** "Why does compensation feel like a 'bribe' in Round 2 but a 'reward' in Round 1?"
  *   **Philosophical Map:** In Round 1, compensation is internal to the narrative of a life. In Round 2, compensation is a transfer between strangers. Rawls argues justice is not about maximizing the sum, but about the terms of cooperation. If the terms require you to be the sacrificial lamb for the aggregate, justice is violated regardless of the payoff.

  **4. Lecture Bridge (Minutes 70-75)**
  *   Transition to the **Original Position**. "If you didn't know whether you would be the Burdened Person or a Winner (Veil of Ignorance), would you vote for Policy Y?" (Likely No, due to risk aversion/Maximin). This sets up next class's reading perfectly.

  ---

  ### VI. Three Honest Things (Troubleshooting & Limitations)

  #### 1. What will predictably go wrong: The "Utilitarian Holdouts"
  **The Problem:** You mentioned confident utilitarians. By minute 15 of Round 1, they will see the structure. In Round 2, they will aggressively argue for Policy Y, claiming the compensation phase solves the moral problem. They will say, "If the Burdened person ends up with more points, they should be happy. Total utility increased."
  **How to Handle It:**
  *   **Do not silence them.** Their argument *is* the target.
  *   **Pivot to Phenomenology:** Ask the Burdened student to speak. "Even if you have more points now, did the moment of loss feel different knowing the gain was going to *them* initially?"
  *   **The "Rights" Trump:** Remind the class that Rawls isn't arguing utility doesn't matter; he's arguing it doesn't *trump* the distinction between persons. Ask the utilitarians: "Is there *any* number of points where you would force a student to lose their entire stake for the group?" (This pushes them toward the marginal utility cliff).

  #### 2. What will predictably go wrong: Token Apathy
  **The Problem:** Some students won't care about beans. If the stakes feel fake, Round 2 becomes a theoretical debate rather than a felt tension. They might vote to sacrifice a peer casually.
  **How to Handle It:**
  *   **Raise the Stakes (Non-Monetary):** Announce at the start that the "Wellbeing Tokens" determine who gets to **leave 5 minutes early** at the end of class (top 3 scorers), or who gets to **choose the next reading**.
  *   **Social Pressure:** In Round 2, make the vote public (show of hands). It is harder to vote to sacrifice a peer when your hand is visible. This introduces the *social cost* of utilitarian decision-making, which parallels the moral cost.

  #### 3. The Limitation: What the Activity Cannot Reproduce
  **The Problem:** Students will likely leave thinking the objection is about **Unfairness** or **Distribution**, rather than **Aggregation**. They will say, "It's wrong because Student A got less than Student B."
  **Why this is a misunderstanding:** Rawls' point is deeper. Even if the distribution were equal *ex-post* (via compensation), the *justification* remains flawed. The objection is that utilitarianism misunderstands the *metaphysics of the person*, not just the distribution of goods.
  **How to Supply this in Lecture:**
  *   You must explicitly state: "Notice that even if we compensated Student A perfectly, the *reason* for the sacrifice was still that 'the numbers added up.' Rawls says you cannot use one person as a means to the social sum, even if they are paid back."
  *   **Can a classroom mechanism isolate this?** No. An activity relies on felt experience (emotions/fairness). The metaphysical point (that there is no "Social Mind") is conceptual. You cannot simulate the absence of a social mind; you can only simulate the *conflict* it causes.
  *   **Instruction:** Be explicit in the debrief: "The activity made you *feel* the unfairness. The reading will explain why that unfairness points to a deeper error in how Utilitarianism conceives of human beings."

  ### Final Facilitator Note
  The success of this session hinges on the **Compensation Phase**. If you skip that, students will just think "Oh, don't sacrifice people." The compensation phase forces them to confront whether *making the victim whole* resolves the moral tension. When they admit it doesn't quite feel the same as Round 1, you have landed the plane.
