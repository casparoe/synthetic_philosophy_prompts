answer: |-
  Translate Tambora as a high-magnitude, exogenous exposure with a sharp onset. When your friend says it "caused" the famine, they are asserting a large Average Treatment Effect (ATE) with a high Population Attributable Fraction. Their claim that climate "made" the crisis implies sufficiency—that the risk difference approaches one. You rightly identify this as deterministic overreach. In your vocabulary, this is a claim of zero effect modification by social resilience.

  Historical "contingency" maps neatly onto effect modification and unmeasured confounding. When historians argue outcomes weren't inevitable, they mean the exposure effect varies across strata (contexts). Your hunch is robust: the determinism fight is largely about interaction terms. Critics arguing climate isn't sufficient are asserting that $X$ (climate) requires $Z$ (fragile institutions) to produce $Y$ (crisis). To say climate isn't sufficient is precisely to say there is effect modification.

  Crediting a microbe with "agency" is trickier. Epidemiology treats pathogens as exposures with mechanisms (infectivity, virulence), not actors with intent. However, "force of infection" captures the active pressure the historian describes. The historian's "actor" is your "potent exposure with complex mediation" that operates independently of human compliance.

  **Residue Report**

  **What translates cleanly:** Causal structure, sufficiency, and interaction. Your DAGs handle the "volcano → climate → famine" pathway well. The logic of counterfactuals clarifies their claims about inevitability.

  **What had to be bent:** "Agency". You had to strip teleology. Historians use "actor" to elevate non-humans from background noise to foreground drivers. You treat them as variables; they treat them as protagonists. This isn't fault, but differing ontological commitments.

  **What can't be said:** The *meaning* ascribed to the event. Epidemiology explains *how* the famine occurred; it cannot capture why 1816 matters culturally beyond the mortality count.

  **Verdict:** The residue cuts both ways, but primarily suggests historians' talk is under-specified mechanistically. They rely on metaphor ("chose", "made") where you have precise parameters. However, your toolkit misses the constitutive nature of context. For you, context is an effect modifier; for them, the environment is the stage *and* the player. Your toolkit isn't missing data, but it is ontologically thinner. They need your precision; you need their recognition that some "exposures" redefine the population at risk.
