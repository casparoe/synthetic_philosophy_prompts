  **JOINT STATEMENT ON THE DRAMATISATION OF THE DECEASED**

  **Issued by the Adversarial Collaboration on Biographical Representation**
  **Date: 14 October 2023**

  Following a year of structured dialogue, the Fidelity Camp and the Licence Camp submit this statement of findings. We acknowledge that while consensus on normative conclusions remains out of reach, we have achieved clarity on the structure of our disagreement and the empirical conditions under which our respective positions might shift.

  ### 1. Agreed Claims

  1.  **Legal Neutrality:** Both camps acknowledge the datum that under English law, the dead cannot be defamed. Both camps further agree that this legal fact settles nothing regarding the ethical obligations of dramatists. The absence of a legal remedy is not evidence of the absence of a moral duty, nor does the presence of legal liberty entail moral permission.
  2.  **Taxonomy of Departure:** We agree upon a working distinction between three sorts of departure from the historical record. We flag the third term as a coinage of this collaboration:
      *   (a) **Compression and Conflation:** Alterations dictated by narrative form, such as merging multiple secondary characters into one or collapsing timelines to maintain continuity.
      *   (b) **Invention of Particular Events:** The fabrication of specific scenes or dialogues for which there is no archival evidence, intended to illustrate known traits or circumstances.
      *   (c) **Composite Falsehood:** A scenario where every scene is individually defensible under (a) or (b), but the cumulative portrait implies a truth contradicted by the record (e.g., depicting a subject only ever alone, thereby implying a solitude the record contradicts).
  3.  **Distinctness:** Both camps accept this taxonomy as marking real differences in kind. We agree that conflating a timeline is structurally distinct from inventing a crime, and that both are distinct from a composite falsehood. We disagree only on which of these three categories carry moral weight and why.

  ### 2. Disagreements Table

  | Disagreement | Formulation (Proponent's Terms) | Opponent's Status | Verbal Concession? |
  | :--- | :--- | :--- | :--- |
  | **The Locus of Harm** | **Fidelity:** Fabrication *wrongs* the deceased by violating their posthumous interest in reputation. | **Licence:** Regards this as ambiguous. The dead have no interests. The "wrong" is actually to the *truth* or the *audience*, not the subject. | **Yes.** Both agree the word "wrongs" conflates harm to a subject with harm to a truth-claim. |
  | **Default Stance** | **Licence:** Invention is permitted unless it distorts the essential shape of the life. | **Fidelity:** Invention is forbidden unless it is necessary to reveal a higher historical truth. | **No.** This is a genuine normative conflict regarding the burden of proof. |
  | **Audience Competence** | **Fidelity:** Audiences implicitly trust biographical drama as testimony. | **Licence:** Audiences knowingly import genre conventions and understand dramatisation as art, not testimony. | **No.** This is a genuine empirical disagreement about viewer uptake. |

  ### 3. Cruxes

  We identify three sub-questions where further inquiry could move at least one camp. For each, we record the concrete case, the competing predictions, and the specific consideration that would compel a change of position.

  **Crux 1: The Scientist Biopic (Stress Test)**
  *   **Case:** A biopic of a real, deceased scientist invents a scene where she plagiarises a junior colleague. This is not a composite falsehood or compression, but a straightforward invention that lowers the subject in the audience's eyes.
  *   **Fidelity Position:** This is straightforwardly wrong because it attributes a moral failing to the subject that did not occur, damaging their standing.
  *   **Licence Position:** This is permissible only if it does not contradict the *constitutive traits* of the subject. The Licence Camp articulates the principle that invention is barred only when it negates a core virtue essential to the subject's historical contribution (e.g., integrity in science).
  *   **Predictions:** Fidelity predicts audiences will retain the false belief about plagiarism indefinitely. Licence predicts audiences will treat the scene as metaphorical for competitive pressure.
  *   **Condition for Change:**
      *   **Fidelity:** Will soften their prohibition if empirical data shows audiences reliably discount negative inventions when credited as "dramatisation" in post-viewing surveys.
      *   **Licence:** Will accept this case as a counterexample to unrestricted licence if it is demonstrated that "constitutive traits" cannot be defined without recourse to the very factual accuracy Fidelity demands.

  **Crux 2: The Threshold of Composite Falsehood**
  *   **Case:** A film depicts a political leader as consistently decisive in private meetings (invented) though the record shows hesitation, yet never shows them being wrong publicly.
  *   **Fidelity Position:** This creates a composite falsehood of competence that misleads the public understanding of history.
  *   **Licence Position:** This is fidelity to the "shape of a life," capturing the leader's effective impact despite private doubt.
  *   **Predictions:** Fidelity predicts this distorts historical causality. Licence predicts it captures the "truth" of their effectiveness.
  *   **Condition for Change:**
      *   **Fidelity:** Will accept this licence if historians confirm that the private hesitation had zero causal impact on public outcomes.
      *   **Licence:** Will reject this technique if it is shown that private hesitation consistently correlates with future policy failures in this specific domain, making the omission causally misleading.

  **Crux 3: The Community Extension**
  *   **Case:** A dramatisation misrepresents the cultural practices of a deceased subject's surviving community to heighten conflict.
  *   **Fidelity Position:** This wrongs the surviving community by perpetuating stereotypes.
  *   **Licence Position:** The dead are the subject; the living community's offence is a separate ethical category unrelated to biographical licence.
  *   **Predictions:** Fidelity predicts lasting social harm to the community. Licence predicts temporary offence with no lasting impact on the art's validity.
  *   **Condition for Change:**
      *   **Fidelity:** Will decouple this from the duty to the dead if evidence shows the community does not identify with the portrayal.
      *   **Licence:** Will accept a restriction on licence if evidence shows such misrepresentations materially disadvantage the surviving community in legal or social contexts.

  ### 4. Fragility Note

  This statement represents a stable equilibrium only under current conditions. We identify the following vulnerabilities:

  1.  **Slant:** The agreed taxonomy in Section 1 is subtly slanted toward the Fidelity Camp. By categorising "Composite Falsehood" as a distinct departure, it invites moral scrutiny that the Licence Camp prefers to treat as holistic artistic expression.
  2.  **Least Stable Claim:** The distinction between "Invention of Particular Events" and "Composite Falsehood" is least stable under future pressure. As narratives become more complex, the line between a scene being "individually defensible" and contributing to a false whole may blur, threatening the shared taxonomy.
  3.  **Next Test:** The next collaboration should test the boundary of "Composite Falsehood" using long-form serial drama, where cumulative effects are stronger than in feature films.
  4.  **Failure Modes:** We record candour regarding our respective risks. The Fidelity Camp's most likely failure mode is smuggling evaluative weight into ostensibly neutral taxonomy, defining "accuracy" in ways that presuppose their moral conclusions. The Licence Camp's most likely failure mode is retreating to an unfalsifiable notion of fidelity to a life's "shape," where any contradiction of the record is defended as capturing a deeper essence without providing criteria for when that essence has been violated.

  We sign this statement not as a resolution, but as a map of the remaining territory.

  **Signed,**
  **The Fidelity Camp**
  **The Licence Camp**
