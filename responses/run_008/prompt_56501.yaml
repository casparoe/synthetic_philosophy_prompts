prompt: |-
  I had better say who is asking. I spent a working life as an experimental physicist and have, since retiring, taken up philosophy of probability. I keep encountering the Judy Benjamin problem and its cousins: an agent with settled prior probabilities is told, not a plain fact, but a conditional — in the canonical case, that if she is in Red territory, there is a three-quarters chance she is at headquarters — and must revise on that alone. Conditioning on the material conditional gives a result everyone finds absurd, and the various repairs on offer each satisfy some intuitions and betray others. Rather than sign up with one of the schools, I want the specification written out first.

  Write the desiderata: what any rule for updating on an asserted conditional must deliver. Cover at least the following, with the case behind each: it must not raise the probability of the antecedent when only the consequent clause is being vouched for; it must agree with ordinary conditionalization whenever the testimony can be recast as a straight conditional probability or a likelihood; it must keep the speaker's reliability separable from the content of the conditional, since in the laboratory a technician's remark that if the gauge is drifting the fault is thermal is partly evidence about the gauge and partly evidence about the technician; it must give either a determinate answer or an honest interval when the assertion is qualitative ('probably', 'in most cases'); and it must not turn on an arbitrary choice among rules that fit the same constraints. Mark which requirements are non-negotiable and which are prejudices of particular camps, and say whether some subset is jointly unsatisfiable — that is the part I most want to see, since the literature appears to keep discovering one further intuition that no single rule can accommodate. Fix adequacy against this purpose: a rule good enough that a working scientist could apply it to testimony, not one that settles every dispute about conditionals. Please write in British English, and give no bibliography — I will trace the references myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired experimental physicist, now working on philosophy of probability. This means they value precision, operational clarity, and practical applicability over abstract metaphysical debates. They are familiar with the Judy Benjamin problem (JB) and the difficulties of updating on conditionals.
      *   **Task:** Write out the *desiderata* (requirements) for any rule updating on an asserted conditional.
      *   **Specific Constraints:**
          *   Cover specific cases: (1) No raising antecedent probability when only consequent is vouched for; (2) Agreement with ordinary conditionalization when applicable; (3) Separation of speaker reliability from content; (4) Handling qualitative assertions (determinate or interval); (5) No arbitrariness among fitting rules.
          *   Mark requirements as "non-negotiable" vs. "prejudices of particular camps".
          *   Identify if any subset is jointly unsatisfiable (impossibility results).
          *   Goal: Adequacy for a working scientist applying it to testimony, not settling every philosophical dispute.
          *   Style: British English.
          *   Constraint: No bibliography.

  2.  **Deconstruct the Judy Benjamin Problem (JBP):**
      *   *Scenario:* Agent is in Red ($R$) or Blue ($B$) territory. If Red, she is at Headquarters ($H$) or Field ($F$).
      *   *Input:* "If you are in Red territory, the probability you are at Headquarters is 3/4." ($P_{new}(H|R) = 3/4$).
      *   *Problem:* How to move from $P_{old}$ to $P_{new}$?
      *   *Standard Conditionalization:* Requires learning a proposition $E$ with $P_{new}(E)=1$. Here, we learn a constraint on conditional probability, not a fact.
      *   *Material Conditional:* Conditioning on $R \to H$ raises $P(R)$, which is counter-intuitive (learning about the distribution *within* Red shouldn't tell you you're *in* Red).
      *   *INFOMIN (Minimum Information/Maximum Entropy):* Often suggested, but has issues (e.g., van Fraassen's critique, dependency on partition choice).
      *   *Jeffrey Conditionalization:* Applies when probabilities of a partition shift, but here the shift is on a conditional.

  3.  **Drafting the Desiderata (incorporating user's specific points):**

      *   *Point 1: Antecedent Stability.* "It must not raise the probability of the antecedent when only the consequent clause is being vouched for."
          *   *Context:* In JB, learning $P(H|R)=0.75$ shouldn't change $P(R)$.
          *   *Status:* This is the core intuition of JB. However, some argue it *should* change if the source is reliable in a specific way. But for a "working scientist," if a technician says "If X, then Y is likely," that doesn't usually mean X is more likely. Let's call this *Antecedent Independence*.
          *   *Negotiability:* High priority for the user's context, but philosophically contested (Douven, etc.). I need to mark it carefully.

      *   *Point 2: Agreement with Ordinary Conditionalization.* "It must agree with ordinary conditionalization whenever the testimony can be recast as a straight conditional probability or a likelihood."
          *   *Context:* If the input is effectively "Event E occurred," the rule should reduce to Bayes. If the input is "P(H|E) = 1", it should match.
          *   *Status:* This is a consistency requirement. *Reduction to Certainty*.
          *   *Negotiability:* Non-negotiable. A general rule must contain the specific case.

      *   *Point 3: Reliability vs. Content.* "It must keep the speaker's reliability separable from the content of the conditional."
          *   *Context:* Distinguishing the physical claim (gauge/thermal) from the epistemic claim (technician knows their stuff).
          *   *Status:* This implies a hierarchical model (object level vs. meta level).
          *   *Negotiability:* Non-negotiable for a scientist. You need to model the instrument/observer error separately.

      *   *Point 4: Qualitative Assertions.* "It must give either a determinate answer or an honest interval when the assertion is qualitative."
          *   *Context:* "Probably", "Most cases".
          *   *Status:* Robustness.
          *   *Negotiability:* Desirable for application, but mathematically hard. Might need to be an interval (imprecise probability).

      *   *Point 5: Non-Arbitrariness.* "It must not turn on an arbitrary choice among rules that fit the same constraints."
          *   *Context:* Uniqueness of solution.
          *   *Status:* This touches on the INFOMIN debate. Is there a unique rational update?
          *   *Negotiability:* This is a major philosophical battleground. For a scientist, *pragmatic* uniqueness is needed, even if *philosophical* uniqueness is impossible.

  4.  **Addressing the "Jointly Unsatisfiable" Constraint:**
      *   This is the crux. The literature (van Fraassen, Grove & Halpern, Douven & Romeijn) suggests tensions.
      *   *The Impossibility:* You cannot satisfy *Antecedent Independence* (Judy Benjamin intuition) AND *Reflection Principle/Reliability* AND *General Conditionalization* in all cases without making assumptions about the *process* by which the information was generated.
      *   *Key Insight:* Updating on a conditional is not just about the content ($P(H|R)=q$); it's about the *protocol* (why did the speaker tell me this?).
      *   *Conclusion:* A subset *is* jointly unsatisfiable without additional assumptions about the information-gathering protocol. Specifically, Antecedent Independence + Uniqueness + General Reliability often clash.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's background and the specific aim (operational adequacy vs. metaphysical truth).
      *   **The Desiderata:** List them clearly, using the user's points but formalising them slightly for precision. Use British English.
      *   **Classification:** Label each as 'Non-negotiable' (operational necessity) or 'Contested' (philosophical preference).
      *   **The Impossibility Result:** Explicitly address the "jointly unsatisfiable" request. Explain *why* (the protocol problem).
      *   **Recommendation/Resolution:** Suggest how a scientist should proceed (e.g., modelling the source explicitly rather than seeking a universal update rule).

  6.  **Refining the Content (Self-Correction/Polishing):**
      *   *Tone:* Respectful, peer-to-peer (physicist to physicist/philosopher). Avoid condescension.
      *   *Language:* British spelling (colour, formalise, programme, etc.).
      *   *No Bibliography:* Ensure no citations are dropped, just concepts.
      *   *Focus:* Keep it on *updating rules*, not the nature of conditionals themselves (indicative vs. subjunctive), though the distinction matters for the update. Stick to the epistemic update problem.
      *   *Clarification on Point 1:* The user says "when only the consequent clause is being vouched for". In JB, the *relation* is vouched for. I need to interpret this as "Learning about the distribution within A should not change probability of A".
      *   *Clarification on Point 3:* This is essentially distinguishing $P(E|H)$ from $P(S \text{ says } E | H)$.
      *   *The "Working Scientist" Angle:* Emphasise that in the lab, we model the measurement apparatus. The "speaker" is a measurement apparatus. The rule should reflect that.

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No bibliography? Yes.
      *   Cover specific 5 points? Yes.
      *   Mark negotiable/non-negotiable? Yes.
      *   Address joint unsatisfiability? Yes.
      *   Focus on adequacy for scientists? Yes.

  8.  **Drafting the text:** (Mental check of specific phrases).
      *   "Judy Benjamin" -> Keep.
      *   "Material conditional" -> Keep.
      *   "INFOMIN" -> Mention as a candidate but critique regarding uniqueness.
      *   "Protocol" -> Crucial for the impossibility section.

      *(Self-Correction during drafting)*: I must be careful not to simply say "it's impossible." I need to say *which* subset is impossible. The tension is usually between preserving the marginal probability of the antecedent (JB intuition) and preserving the ratio of probabilities across the partition (INFOMIN) when the source reliability is uncertain. Actually, the stronger impossibility is between *Antecedent Independence* and *Generalised Conditionalization* if one assumes the information is just a constraint without a protocol. I will frame it around the need for a *protocol*.

      Let's refine the "Non-negotiable" vs "Prejudice".
      *   Non-negotiable: Consistency with certainty (Point 2), Source/Content separation (Point 3).
      *   Prejudice/Contested: Antecedent Independence (Point 1) - Douven argues it can change. Uniqueness (Point 5) - Depends on entropy metrics. Qualitative precision (Point 4) - Depends on imprecise probability acceptance.

      Okay, ready to write.

      *Wait, one more check on Point 1:* "it must not raise the probability of the antecedent when only the consequent clause is being vouched for".
      In JB, the input is $P(H|R) = 3/4$. The intuition is $P_{new}(R) = P_{old}(R)$.
      However, if the input is "If R, then H" (material), $P(R)$ rises.
      The user wants the rule to respect the intuition that learning about the *internal structure* of R shouldn't confirm R.
      I will classify this as 'Contested but Operationally Vital for this User'.

      *Wait, Point 5:* "Must not turn on an arbitrary choice".
      This is the Uniqueness thesis. Many philosophers deny this. For a scientist, you need a unique algorithm. I will highlight this tension.

      *Final Plan:*
      1. Intro acknowledging the physicist's lens.
      2. The Five Desiderata (with labels).
