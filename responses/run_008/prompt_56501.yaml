answer: |-
  **Memorandum on Desiderata for Conditional Updating**

  **To:** Retired Experimental Physicist
  **From:** Philosophical Consultant
  **Subject:** Specification of Update Rules for Asserted Conditionals

  You have correctly identified the friction point. The Judy Benjamin problem is not merely a puzzle about conditionals; it is a failure of standard Bayesian kinematics to handle *constraints on probabilities* as data. As a physicist, you are accustomed to distinguishing the signal from the noise, and the instrument from the measurement. The philosophical literature often conflates these.

  Below is the specification you requested. It separates operational necessities from philosophical commitments and identifies the precise locus of the impossibility results you have encountered.

  ### I. The Desiderata

  Here are the five requirements for an update rule $\mathcal{U}$, which takes a prior $P_{old}$ and an input $I$ (an asserted conditional) to produce a posterior $P_{new}$.

  **1. Antecedent Stability**
  *Specification:* If the input $I$ specifies a probability distribution over a partition of the antecedent $A$ (e.g., 'If $A$, then probability of $B$ is $q$'), the marginal probability of $A$ must remain unchanged: $P_{new}(A) = P_{old}(A)$. Learning how the world is arranged *within* the scenario $A$ should not constitute evidence *for* $A$.
  *Case:* The canonical Judy Benjamin case. Learning that $P(\text{Headquarters}|\text{Red}) = 3/4$ should not make it more likely that you are in Red territory.
  *Status:* **Contested.** While this is the dominant intuition in the literature (van Fraassen), it is not logically mandatory. Some argue (e.g., Douven) that if the source is reliable, the very fact that they offered this specific constraint might screen off other possibilities, shifting the marginal. However, for laboratory testimony, this is **Operationally Non-negotiable**. A technician stating a fault condition does not thereby increase the probability that the fault exists.

  **2. Reduction to Certainty**
  *Specification:* If the input $I$ can be represented as a proposition $E$ learned with certainty (i.e., the conditional probability becomes 1, or the input is equivalent to 'E is true'), $\mathcal{U}$ must yield the same posterior as standard Bayesian Conditionalization.
  *Case:* If the technician says, 'If the gauge is drifting, it is certainly thermal,' and this is equivalent to ruling out non-thermal drift, the update must match conditioning on the excluded event.
  *Status:* **Non-negotiable.** Any generalised rule must contain the standard rule as a limiting case. Failure here implies a breach of diachronic coherence.

  **3. Source-Content Separability**
  *Specification:* The rule must allow the reliability of the speaker (or instrument) to be modelled as a separate parameter from the content of the assertion. The update must distinguish between $P(\text{Content} | \text{World})$ and $P(\text{Speaker says Content} | \text{World})$.
  *Case:* Your technician example. The probability that 'if drifting then thermal' is true is distinct from the probability that the technician *says* it is true given their competence and the state of the gauge.
  *Status:* **Non-negotiable.** This is the requirement of hierarchical modelling. Treating testimony as a direct observation of the world rather than an observation of a speaker's output is a category error in experimental science.

  **4. Qualitative Robustness**
  *Specification:* When the input $I$ is qualitative ('probably', 'likely'), $\mathcal{U}$ must output either a unique distribution based on a defined mapping (e.g., 'probably' $\equiv 0.75$) or a set of distributions (an interval) representing the ambiguity. It must not output a spurious precise number derived from hidden assumptions.
  *Case:* A colleague remarks, 'In most cases, this noise implies a loose connection.'
  *Status:* **Desirable but Costly.** Requiring a determinate answer forces arbitrary precision. Requiring an interval demands the machinery of imprecise probabilities, which complicates calculation. For a working scientist, an honest interval is preferable to a false point estimate.

  **5. Uniqueness (Non-Arbitrariness)**
  *Specification:* Given $P_{old}$ and $I$, there must be a single rationally mandated $P_{new}$. The rule should not depend on an arbitrary choice of metric (e.g., which divergence measure to minimise) unless that choice is physically motivated.
  *Case:* Avoiding the situation where Minimum Information (INFOMIN) gives one answer and a moment-matching procedure gives another, with no physical reason to prefer either.
  *Status:* **Philosophical Prejudice.** Many epistemologists deny that rationality mandates uniqueness. However, for *application*, this is **Operationally Non-negotiable**. A protocol must be deterministic to be reproducible.

  ---

  ### II. The Impossibility Result

  You asked specifically whether a subset of these is jointly unsatisfiable. The short answer is **yes**.

  You cannot simultaneously satisfy **Antecedent Stability (1)**, **Source-Content Separability (3)**, and **Uniqueness (5)** without adding a constraint regarding the *protocol* of information transmission.

  **The Conflict:**
  The Judy Benjamin problem demonstrates that specifying the *content* of the information (the conditional probability constraint) is insufficient to determine the posterior. To satisfy Antecedent Stability, one typically employs a method like INFOMIN (minimising cross-entropy). However, INFOMIN yields different results depending on the choice of partition (the 'basis' problem), violating Uniqueness.

  More critically, if you enforce Source-Content Separability (3) rigorously, you must model the probability that the speaker *would assert* the conditional given the state of the world.
  *   If the speaker asserts 'If $A$, then $P(B|A)=q$' *whenever* it is true, your update should respect Antecedent Stability.
  *   If the speaker asserts it only when they have investigated $A$ and found it relevant, the act of assertion itself provides evidence about $A$, violating Antecedent Stability.

  Therefore, **Antecedent Stability (1)** is incompatible with a universal **Uniqueness (5)** rule unless the *protocol* (the conditions under which the testimony was given) is fixed as part of the input. Without knowing *why* the speaker told you the conditional now, rather than remaining silent, you cannot mathematically guarantee the marginal probability of the antecedent remains fixed.

  **The Impossibility Theorem for the Scientist:**
  There is no context-independent function $\mathcal{U}(P_{old}, \text{Conditional})$ that satisfies (1), (3), and (5). The 'missing variable' is the likelihood of the testimony itself.

  ---

  ### III. Operational Adequacy

  Since a universal rule is impossible, how do you proceed as a scientist? You must shift from seeking an *epistemic update rule* to constructing a *measurement model*.

  **1. Abandon the Search for a Direct Rule**
  Do not look for a formula that updates $P$ directly on the sentence 'If $A$, then $B$'. Treat the sentence as data $D$ generated by a source $S$.

  **2. Model the Protocol (Satisfying Desideratum 3)**
  Explicitly estimate the likelihood ratio:
  $$ \Lambda = \frac{P(S \text{ says } 'P(B|A)=q' | \text{World State } w_1)}{P(S \text{ says } 'P(B|A)=q' | \text{World State } w_2)} $$
  In the laboratory, this is the calibration of the instrument. If the technician only speaks when they are sure, the likelihood ratio differs from when they speak whenever asked.
  *   If you assume the 'Van Fraassen Protocol' (the speaker reports the constraint whenever it holds, regardless of $A$'s truth), you recover **Antecedent Stability**.
  *   If you assume the 'Investigation Protocol' (the speaker reports only after checking $A$), you must update the probability of $A$.

  **3. Accept Intervals for Qualitative Inputs (Satisfying Desideratum 4)**
  When the input is 'probably', do not map this to a single number. Map it to a range (e.g., $[0.6, 0.9]$). Propagate this through your model using interval arithmetic or a set of priors. This sacrifices **Uniqueness (5)** in the philosophical sense but preserves *computational transparency*. You report the sensitivity of the result to the interpretation of 'probably'.

  **4. Enforce Reduction to Certainty (Satisfying Desideratum 2)**
  Ensure your measurement model collapses to standard Bayes when the likelihood of the testimony becomes 1 for a specific state and 0 for others. This is a simple consistency check on your likelihood functions.

  ### Summary Recommendation

  The literature fails to provide a single rule because it attempts to solve a problem of *communication protocol* using only the tools of *logic and probability*.

  For your purposes, the **Non-negotiable** requirements are **Reduction to Certainty (2)** and **Source-Content Separability (3)**.
  You should treat **Antecedent Stability (1)** as a *physical assumption* about your information source, not a logical requirement. If your source is passive (like a gauge that displays a ratio whenever available), Stability holds. If your source is active (a colleague offering advice), Stability may fail.

  **Uniqueness (5)** should be discarded as a philosophical ideal and replaced with **Sensitivity Analysis**. Report how the posterior varies with the assumed reliability of the source and the interpretation of the conditional. This is not a retreat from rigour; it is the standard experimental practice of reporting systematic error.

  By modelling the testimony as a physical process with its own error characteristics, you bypass the Judy Benjamin paradox. The paradox arises only when one treats the conditional as a mystical constraint rather than a datum subject to likelihoods.
