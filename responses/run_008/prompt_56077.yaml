answer: |-
  Remarque's novel ultimately dismantles the moral equality of combatants thesis not by siding with the revisionists, but by rejecting the underlying assumption that war creates a moral framework where killing can be equalized or justified at all.

  Here is how you can steer your book club through the text using this lens, focusing on where the novel dramatizes, complicates, and finally resists the Walzer/McMahan debate.

  ### 1. The Shell-Hole Scene (Paul and Duval)
  **The Philosophical Clash:**
  *   **Traditionalist (Walzer):** Paul and Duval are moral equals. Both are uniformed threats. Paul's guilt is psychological trauma ("misplaced sentimentality"), not moral insight. The knife is just a closer range bullet; the moral status of the act hasn't changed.
  *   **Revisionist (McMahan):** Paul is fighting an unjust war (German invasion/defense of imperialism); Duval is likely defending his home. Paul lacks the *jus ad bellum* permission to kill. His guilt tracks the moral truth that he is harming someone who had a right not to be harmed.

  **The Remarque Intervention:**
  You should push the club to notice that Paul's monologue over Duval's body bypasses *liability* entirely. He doesn't argue about who started the war or who has a right to be there. He says, "Forgive me, comrade... Why do you never tell us that you are just as wretched as we are?"
  Remarque sees something the philosophers miss: **The abstraction required for moral equality.** For Walzer or McMahan to argue about liability, the soldier must be categorized as "combatant." In the shell hole, the category collapses. Paul isn't guilty because he violated a rule of war or fought for an unjust cause; he is guilty because the intimacy of the kill forced him to see Duval as a *person* rather than a *target*.
  *   **Discussion Point:** Does Paul's promise to write to Duval's wife suggest he recognizes Duval's specific innocence (Revisionist), or does it suggest he recognizes their shared victimhood (Remarque)? The text leans toward the latter. The guilt isn't just about the justice of the cause; it's about the destruction of the "human" that the philosophical frameworks presuppose.

  ### 2. The Barracks Conversation (Kropp and Tjaden)
  **The Philosophical Clash:**
  *   **Traditionalist:** The suggestion that generals should fight with clubs supports the separation of *jus ad bellum* (leaders) and *jus in bello* (soldiers). Soldiers are pawns; therefore, they are moral equals on the board.
  *   **Revisionist:** The conversation highlights the absurdity of holding pawns liable. If the cause is nonsense, the killing is nonsense.

  **The Remarque Intervention:**
  This scene complicates the "Moral Equality" thesis by attacking the **authority that assigns liability.** Kropp says, "War should be declared by the leaders... and then the leaders should fight it out." This isn't just shifting blame to Kantorek (which would keep the Traditionalist structure intact); it is an indictment of the state's right to designate anyone as "liable to be killed."
  *   **Discussion Point:** If the soldiers are merely "poor sods in the trench" (as you put it), does that make them moral equals (both innocent), or does it make the concept of moral equality in war meaningless? Remarque suggests the latter. If the war is a "mistake" or a "crime" orchestrated by old men, then the "combatant" status is a fraud. The book dramatizes the *fraud*, whereas the philosophers argue over the *rules of the fraud*.

  ### 3. Kantorek and the Home Front
  **The Philosophical Clash:**
  *   **Traditionalist:** Kantorek bears the *ad bellum* guilt; Paul bears only *in bello* responsibility. This preserves Paul's status as a moral equal to the Frenchman.
  *   **Revisionist:** Kantorek's coercion excuses Paul, but doesn't justify the killing. Paul is an excused wrongdoer.

  **The Remarque Intervention:**
  This is where your suspicion about "intimacy vs. justice" needs nuance. You suggested Paul's guilt attaches to the intimacy of the killing rather than the justice of the war. I would argue Remarque shows that **the intimacy reveals the injustice.**
  Kantorek represents the abstract ideology ("Fatherland," "Honor") that makes moral equality possible. As long as Paul sees the French as "the enemy," he can accept the Traditionalist view. Kantorek's betrayal (forcing them to enlist) strips away the voluntariness that might ground moral responsibility.
  *   **Discussion Point:** When Paul returns home on leave and cannot talk to his father or Kantorek, he realizes the language of "duty" and "cause" is dead. If the cause is a lie, the "moral equality" of the soldiers fighting for it is a lie too. They aren't equals in a contest; they are equals in a slaughterhouse.

  ### Where the Lens Doesn't Fit
  The Walzer/McMahan debate assumes war is a **normative activity**—something that can be done rightly or wrongly. Remarque portrays war as an **existential catastrophe**.
  *   **Walzer/McMahan:** Ask "Who is liable to be killed?"
  *   **Remarque:** Asks "What does killing do to the killer?"
  The book resists the framing because it suggests that even if the Revisionists are right (that unjust combatants are doing wrong), the tragedy isn't the moral violation—it's the loss of the self. Paul says, "We are not youth any longer... We are like men of old." The moral equality debate is about *rules*; the book is about *ruin*.

  ### Bottom Line for the Club
  Use the Duval scene to show that "moral equality" requires distance. When the distance closes, the equality dissolves into shared suffering. Use the Kropp scene to show that the soldiers reject the authority that assigns them moral status. Conclude that Remarque isn't arguing for Revisionism; he's arguing that the very institution of war makes moral calculation impossible.

  ***

  ### What Would Change My Mind
  My reading leans heavily on the interpretation that Paul's internal monologue regarding Duval is a rejection of *combatant status* itself. I would change my mind if:

  1.  **Textual Evidence:** There were passages where Paul explicitly validates the *necessity* of killing Duval for the sake of Germany, even while grieving him. If Paul thought, "I had to kill you for the Fatherland, but I mourn you as a man," that would support the Traditionalist view (separation of *in bello* necessity and *ad bellum* tragedy). Currently, Paul says, "Why do you never tell us that you are just as wretched as we are?" which implies the conflict itself is the error, not just the manner of killing.
  2.  **Philosophical Move:** If a Traditionalist could successfully argue that "moral equality" is a *legal* fiction necessary for humanitarian protection (i.e., we treat them as equals so we don't massacre prisoners), rather than a moral truth. Remarque might agree with the *utility* of the fiction while denying its *truth*. If the debate is shifted from "Are they truly moral equals?" to "Must we treat them as equals to minimize suffering?", Remarque might align more closely with Walzer than I am giving him credit for.

  **Contested Reading Warning:** My interpretation assumes Paul's voice is reliable and represents Remarque's ultimate philosophical stance. However, one could argue Paul is suffering from severe PTSD and his rejection of the war's logic is a symptom of his breakdown, not a coherent ethical argument. If you read Paul's nihilism as a pathology rather than an insight, the book becomes less a critique of Just War theory and more a clinical study of trauma, which would weaken the claim that Remarque "dismantles" the philosophical framework rather than just ignoring it.
