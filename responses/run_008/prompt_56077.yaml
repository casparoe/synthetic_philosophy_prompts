  2.  **Deconstruct the Philosophical Framework:**
      *   **Traditionalism (Walzer):** *Jus ad bellum* (justice of war) is separate from *Jus in bello* (justice in war). Soldiers are instruments of the state. If they follow rules of engagement, they are moral equals regardless of the war's justice. Liability stems from posing a threat.
      *   **Revisionism (McMahan):** *Jus ad bellum* infects *Jus in bello*. If the war is unjust, killing in it is morally wrong (murder), unless excused (ignorance, duress). Liability stems from moral responsibility for the threat.
      *   **Remarque's Text:** Generally anti-war, focused on the *experience* of the soldier, the loss of generation, the dehumanization. It doesn't explicitly argue just war theory. It argues against war itself.

  3.  **Analyze Key Scenes through the Lens:**
      *   **The Shell-Hole Scene (Paul & Duval):**
          *   *Traditionalist:* Paul is liable to kill Duval; Duval is liable to kill Paul. Paul's guilt is psychological trauma, not moral insight.
          *   *Revisionist:* Paul is fighting an unjust war (German aggression/defense gone wrong). Duval is likely defending his home (France). Paul's guilt recognizes the asymmetry.
          *   *Remarque's Insight:* It's not about liability or justification; it's about *proximity*. The uniform disappears, the "enemy" becomes a human. The philosophical debate abstracts the soldier; Remarque concretizes the victim.
      *   **The Barracks Conversation (Kropp/Tjaden):**
          *   "Why do they fight?" "Who started it?"
          *   Suggestion: Generals should fight each other.
          *   *Traditionalist:* Supports the separation. Soldiers aren't responsible for the cause.
          *   *Revisionist:* Highlights the absurdity of holding soldiers liable for a cause they didn't choose.
          *   *Remarque's Insight:* It undermines the *state's* authority to designate liability. If the cause is nonsense, the liability is nonsense.
      *   **Kantorek (The Home Front):**
          *   Shamed them into enlisting.
          *   *Traditionalist:* Leaders bear *Jus ad bellum* responsibility; soldiers bear *Jus in bello*.
          *   *Revisionist:* Leaders are responsible, but soldiers still shouldn't kill if the cause is unjust.
          *   *Remarque's Insight:* Kantorek represents the abstract ideology that kills concrete humans. It's not about moral liability, it's about betrayal.

  4.  **Synthesize the Argument:**
      *   The book resists the Traditionalist/Revisionist binary because both accept the *legitimacy* of war as a framework where killing can be justified. Remarque suggests the framework itself is the horror.
      *   Paul's guilt isn't just about intimacy (User's suspicion) nor purely about unjust cause (Revisionist). It's about the destruction of shared humanity that the philosophical categories presuppose.
      *   The "Moral Equality" thesis assumes soldiers are agents capable of bearing liability. Remarque portrays them as victims of a machine.
      *   *Bottom Line:* Remarque's novel ultimately dismantles the moral equality of combatants thesis not by siding with the revisionists, but by rejecting the underlying assumption that war creates a moral framework where killing can be equalized or justified at all.

