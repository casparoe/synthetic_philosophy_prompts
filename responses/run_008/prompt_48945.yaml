      *   Printable list format? Yes.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the TA's point about the ambiguity of "nothing." That's the pivot point.

      *(Final Plan)*:
      1.  Intro acknowledging the TA's insight.
