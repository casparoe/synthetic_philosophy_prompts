  ### Reconstructed Rules

  Based on verdicts 1–7, two underlying principles fit Dana's track record equally well but diverge on the new cases.

  **Rule 1: The Phenomenal Occurrence Principle (POP)**
  *   **Formulation:** The *Cogito* succeeds if and only if there is an indubitable *phenomenal occurrence* of experience. It establishes the existence of the *locus of consciousness* at that moment. Metaphysical claims about ownership, agency, or persistence are secondary and potentially false (cf. V3, V7).
  *   **Fit:** Explains V1–V3 (occurrence is real despite deception), V4 (no occurrence), V5–V6 (locus exists now, not necessarily over time), V7 ("It thinks" is valid).

  **Rule 2: The Indexical Agency Principle (IAP)**
  *   **Formulation:** The *Cogito* succeeds if and only if the first-person indexical ('I') successfully refers to the *agent* of the thought. It requires a sense of *ownership* or *agency* linking the thought to the subject. If the subject disowns the thought, the 'I' misfires.
  *   **Fit:** Explains V1–V3 (meditator owns the doubt), V4 (no agent), V5–V6 (agent exists now), V7 ("I think" is standard, "It thinks" is a compatible description of the same agentive event).

  **Divergence:**
  *   **Case (a) Thought Insertion:** POP says **Works** (phenomenology is present, proving a locus exists). IAP says **Fails** (the patient explicitly denies agency/ownership, so 'I' does not refer).
  *   **Case (d) No-Self Theorist:** POP says **Works** (phenomenology proves a locus, refuting "no thinker" if 'thinker' = locus). IAP says **Fails** (if the theorist denies the 'I' refers, the indexical is empty).

