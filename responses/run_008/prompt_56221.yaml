  **Ranking**

  1.  Macro/IO: Finite reputation models collapse if off-path play signals type. (Destroys broader applicability to strategic patience.)
  2.  Equilibrium: Rejecting BI here undermines sequential rationality everywhere. (Challenges core consistency of finite game theory.)
  3.  Experimental: Why turn descriptive findings into normative claims? (Dismisses theoretical value as unnecessary laundering.)
  4.  Equilibrium: Is this just trembling-hand perfection relabeled? (Reduces novelty to existing refinement.)
  5.  Macro: How do you quantify belief revision without ad hoc parameters? (Makes model unfalsifiable and less parsimonious.)
  6.  Experimental: Does this predict stopping times or just passing? (Limits predictive power compared to quantal response.)
  7.  Equilibrium: Common knowledge is axiomatic; evidence shouldn't alter it. (Misunderstands epistemic game theory foundations.)
  8.  General: Isn't this just the KWMR reputational equilibrium? (Claims prior art exists.)

  **Objections and Replies**

  **Objection 1 (Equilibrium Theorist):** "If you abandon backward induction here, you abandon sequential rationality in every finite sequential game, bargaining and hold-up models included."

  **Reply:** This conflates the logic of induction with the epistemic premises required to initiate it. Sequential rationality demands optimal action given beliefs at every information set. Backward induction is a solution concept that imposes Common Knowledge of Rationality (CKR) across all nodes, including counterfactual ones. My argument is that CKR is not robust to off-path evidence. When a player passes, they provide public evidence that either they are irrational or they believe you are. A sequentially rational agent must update beliefs upon observing this. Therefore, taking immediately is no longer optimal if the updated belief assigns positive probability to the opponent passing again. I am not abandoning sequential rationality; I am insisting it applies to revised beliefs, not frozen priors. The 'collapse' you fear assumes CKR is an axiom rather than a contingent state of knowledge. By treating CKR as fragile, we preserve sequential rationality while allowing play to proceed. The theorem holds; the premises dissolve.

  **Softness:** The reply relies on a specific theory of belief revision (e.g., AGM) that isn't uniquely standard in economics; some will argue Bayesian updating should handle this via trembles.

  **Objection 2 (Macro/IO):** "If reached nodes carry evidence against common knowledge, then every model of strategic patience in a finitely repeated game is in trouble, and she means it as a reductio."

  **Reply:** Reputation models, specifically Kreps-Wilson-Milgrom-Roberts, resolve the finite horizon paradox by introducing incomplete information about types, not rationality. A 'commitment type' plays a fixed strategy. My model suggests that even without commitment types, uncertainty about rationality functions similarly. This does not trouble existing models; it generalizes the mechanism. In your reputation models, cooperation unravels only if the prior on commitment types is zero. In my model, cooperation unravels only if the prior on rationality is common knowledge. These are distinct conditions. You can have strategic patience based on type uncertainty, rationality uncertainty, or both. The reductio fails because my model does not require abandoning finite horizons; it requires acknowledging that finite horizons do not guarantee CKR. If anything, this strengthens reputational models by showing cooperation is robust even when commitment types are absent, provided epistemic conditions are relaxed.

  **Softness:** Calibrating the relative weight of type uncertainty versus rationality uncertainty is empirically difficult, potentially making the model less parsimonious than standard reputation accounts.

  **Objection 3 (Experimentalist):** "Subjects passing well into the tree is a descriptive fact; why are you laundering a descriptive finding back into a normative claim?"

  **Reply:** Calling subjects 'irrational' is descriptively accurate but theoretically barren. It ends inquiry rather than guiding it. If backward induction is the normative benchmark, then passing is an error. But if the normative benchmark depends on epistemic conditions, passing can be rational. My goal is to align the normative theory with the descriptive reality without lowering the bar for rationality. By arguing that CKR fails off-path, I provide a normative justification for passing that respects the agents' reasoning capabilities. This isn't laundering; it's model refinement. It allows us to treat experimental subjects as rational agents operating under different epistemic constraints rather than as biased heuristic users. This shifts the research question from 'why are they irrational?' to 'what beliefs sustain cooperation?', which is a more productive normative and descriptive intersection.

  **Softness:** There is a risk that this normative validation makes the theory less falsifiable, as any behavior can be rationalized by positing suitable belief revisions.

  **Objection 4 (Equilibrium Theorist):** "Isn't this just trembling-hand perfection in disguise? Why invent new epistemics?"

  **Reply:** Trembling-hand perfection assumes mistakes are exogenous noise—'trembles'—that occur with small probability but do not convey information about type or rationality. My model treats off-path moves as endogenous signals that trigger belief revision. In trembling-hand, a node reached by tremble is still analyzed under the assumption that the player is rational but slipped. In my model, reaching the node suggests the player might not be rational, or believes you aren't. This distinction matters for subsequent play. Under trembling-hand, you still take immediately because the tremble doesn't change the opponent's future rationality. Under my view, the pass changes the belief about the opponent's future actions. It is not a refinement of equilibrium; it is a challenge to the epistemic structure underlying equilibrium selection. Trembles preserve CKR; my model relaxes it.

  **Softness:** Distinguishing empirically between a tremble and a signal of irrationality is notoriously difficult without explicit communication channels.

  **Concede Up Front**

  First, I concede that my approach sacrifices the unique prediction of backward induction. Where BI predicts stop at node one, my model predicts a distribution of stopping times dependent on belief revision parameters. This is a feature, not a bug, matching the variance in experimental data, but it reduces point-predictive precision. Second, I grant that I rely on a specific theory of counterfactual belief revision—roughly AGM-style rather than strict Bayesian updating on trembles. There is no consensus in epistemic game theory on the correct rule for updating after impossible events. I am proposing one that fits the data, but I acknowledge it is not the only coherent system available.

  **The Question I Am Hoping Nobody Asks**

  The dangerous question is: "How do you distinguish a strategic pass from a genuine mistake without observing the player's mind?" If a pass is just noise, CKR holds, and BI collapses the game. If it's evidence, CKR breaks. My load-bearing step assumes players treat off-path moves as evidence. The danger is that this looks like an ad hoc assumption to save the phenomenon. My best answer is that in human interaction, deviations are routinely treated as signals. Ignoring them violates Gricean maxims of communication implicit in strategy. However, formally grounding this distinction requires a theory of 'serious play' versus 'trembles' that I haven't fully axiomatized. I argue that rational agents should treat surprising moves as informative because assuming noise preserves a falsified hypothesis (CKR), whereas updating allows for learning. But without a formal mechanism to weight signal versus noise, this remains the weakest link. If a skeptic argues that rational agents should assign probability one to trembles in finite games to preserve solvability, my model lacks a formal defense against that specific prior choice.

  **Cue Card**

  1.  Backward induction is logically valid but contingent on Common Knowledge of Rationality persisting off-path.
  2.  Reaching later nodes constitutes public evidence that falsifies the Common Knowledge premise.
  3.  Sequential rationality requires agents to revise beliefs upon observing such falsifying evidence.
  4.  Therefore, passing is consistent with rationality under these revised epistemic conditions.
  5.  This preserves sequential rationality while accommodating experimental data without invoking altruism or irrationality.
