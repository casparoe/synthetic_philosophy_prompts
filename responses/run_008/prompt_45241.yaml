answer: |-
  Here is a lecture guide and reading framework designed for your undergraduates. It sets up the theoretical conflict, applies it to the specific scenes you mentioned, and culminates in the argument about mass media and reception.

  ***

  # Lecture Guide: Propaganda, Aesthetics, and the Trash Can
  **Film:** *Do the Right Thing* (Spike Lee, 1989)
  **Theoretical Frame:** W.E.B. Du Bois vs. Alain Locke (1926)

  ## Part 1: The 1926 Fight (The Setup)
  *Keep this brief. Your students know the film; they need the vocabulary to talk about it.*

  In 1926, two giants of the Harlem Renaissance had a public disagreement about the purpose of Black art.

  *   **W.E.B. Du Bois (*Criteria of Negro Art*):** Du Bois argued that **all art is propaganda.** He believed the idea of "pure art" was a myth white people told themselves to ignore politics. His stance: Since art *always* influences how people think, Black artists have a duty to make art that fights racism and uplifts the race. If you aren't doing that, you're making propaganda for the oppressor.
  *   **Alain Locke (*The New Negro*):** Locke argued for **aesthetic autonomy.** He believed burdening Black artists with the job of "representing the race" killed creativity. He wanted Black art judged by universal aesthetic standards, not sociological utility. If a Black character is flawed, complex, or even unlikable, that's a victory—it means they are being treated as human, not as a political symbol.

  **The Conflict:** Is art a weapon for social change (Du Bois), or is it a space for individual human complexity (Locke)?

  ## Part 2: The Film as Test Case
  *Spike Lee made *Do the Right Thing* in 1989, but he was fighting the same war. White critics at the time (like Roger Ebert and mainstream press) openly worried the film would incite riots. That fear is the Du Bois nightmare realized: the art is judged solely by its potential political damage.*

  ### 1. The Slur Montage (Direct Address)
  *Towards the end, characters of every ethnicity stare into the camera and reel off racial slurs.*

  *   **The Du Bois Reading:** This is pure propaganda. It is designed to provoke. It forces the audience to feel the violence of language. It refuses to entertain; it confronts.
  *   **The Locke Reading:** This is aesthetic stylization. By breaking the fourth wall, Lee removes us from the narrative to make a formal point. It treats the slurs as data, as a rhythm, not just a plot point.
  *   **The Verdict:** This scene breaks the binary. It uses **aesthetics as propaganda.** The beauty of the composition (the lighting, the direct gaze) makes the ugliness of the words land harder. Du Bois would love the intent; Locke would appreciate the formal bravery. But notice: this scene doesn't tell you *what to think*. It tells you *what exists*. That leans toward Locke, but the emotional impact serves Du Bois.

  ### 2. Mookie and the Trash Can
  *Mookie throws the trash can through Sal's window, sparking the riot.*

  *   **The Du Bois Problem:** Du Bois wants art to teach a moral lesson. Did Mookie do the "Right Thing"? The film refuses to say. Some see it as redirecting anger away from people to property (tactical). Others see it as destroying a Black-owned business's livelihood (betrayal).
  *   **The Locke Opportunity:** Locke would argue this ambiguity is the point. Mookie is not a symbol; he is a confused man in a heated moment. To force a moral verdict would reduce him to a caricature.
  *   **The Twist:** Here is where you take a stand. **Withholding the verdict is itself a propaganda move.** By refusing to tell the (mostly white) critics that Mookie was "wrong," Lee denies them the moral comfort they want. He trusts the Black audience to understand the complexity of the rage without needing a moral disclaimer. Du Bois said art is for "our side." Lee makes a film that requires "our side" to fill in the moral blank, while the "other side" freezes on the ambiguity.

  ### 3. The Dual Quotes (MLK & Malcolm X)
  *The film ends with two quotes: King condemning violence and Malcolm X defending it "in self-defense." No hierarchy is given.*

  *   **The Stand:** This is Lee rejecting the demand for a "message." If Du Bois wanted art to be propaganda, he usually meant propaganda for a *specific* strategy. Lee provides propaganda for the **conflict itself.** He is saying the debate *is* the reality. To choose one quote would be to lie about the tension in the room. This vindicates Locke's desire for complexity, but it serves Du Bois's goal of truth-telling about racial strife.

  ## Part 3: What the Film Adds (The Core Argument)
  *This is the most important part of the lecture. The 1926 debate happened in magazines (*The Crisis*, *Opportunity*). The 1989 debate happened in movie theaters.*

  **The Double-Audience Problem**
  Du Bois knew Black writers had to write for white eyes (the "Veil"). But reading is private. You read *The Crisis* in your home.
  Film is public. It is one artifact shown simultaneously to two audiences with opposite interests, in the dark, together.

  *   **Du Bois's Blind Spot:** Du Bois thought propaganda was about the **artist's intent.** ("I am making this to fight racism.")
  *   **Lee's Discovery:** Lee shows that propaganda is about the **audience's reception.** ("You are watching this, and your reaction proves your position.")

  When the trash can flies:
  1.  **Audience A (White critics in 1989):** Saw a threat. Saw incitement. Validated Du Bois's fear that white society views Black art only as a danger.
  2.  **Audience B (Black audiences in 1989):** Saw catharsis. Saw a complex moral choice validated.

  **The Conclusion for Students:**
  *Do the Right Thing* vindicates **Du Bois's premise** (art is never neutral; it has political consequences) but rejects **Du Bois's method** (didacticism/moralizing).
  It vindicates **Locke's method** (complexity/ambiguity) but rejects **Locke's premise** (that art can be separated from its social impact).

  **The Takeaway:**
  The film shows us something the 1926 essays couldn't see: **In mass media, the "message" is not in the text. The message is in the split between the audiences.**
  Lee knew the film would land differently depending on who was sitting next to you in the theater. He weaponized that split. Du Bois wanted art to unite the race against oppression. Lee showed that in a segregated society, the *same image* creates two different realities.

  The film isn't propaganda *for* a side. The film is a mirror that shows you **which side you are on** by how you react to the ambiguity. That is a power the 1926 essayists couldn't anticipate, because they were writing for readers, not watching a room full of people breathe together in the dark.

  ## Discussion Questions for Class
  1.  Du Bois said, "I do not care a damn for any art that is not used for propaganda." If Mookie's action is ambiguous, is Lee failing Du Bois's test, or passing it?
  2.  Locke wanted Black characters to be free of the burden of representing the race. Does Sal (the white pizzeria owner) carry a burden of representing whiteness? Does the film treat him with Locke's aesthetic freedom, or Du Bois's political scrutiny?
  3.  **The Big One:** If a film causes a riot, is it bad art (Locke's fear of sociological reduction) or successful art (Du Bois's goal of impact)? Can it be both?
