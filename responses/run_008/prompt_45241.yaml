          *   Tone: Academic but accessible, engaging, provocative.

  2.  **Deconstruct the Theoretical Framework (Du Bois vs. Locke):**
      *   *Du Bois ("Criteria of Negro Art"):* All art is propaganda. The question isn't *if* it propagates, but *what* it propagates. Black art has a duty to fight racism and uplift the race. Suspicious of art made merely to please white audiences.
      *   *Locke ("The New Negro" / General Philosophy):* Art should be judged on aesthetic merit, not sociological utility. Black artists shouldn't be burdened with representing the whole race. Art for art's sake allows for full humanity and complexity.
      *   *The Conflict:* Utility/Politics vs. Autonomy/Aesthetics.

  3.  **Analyze the Film (*Do the Right Thing*) through the Framework:**
      *   *Context:* 1980s NYC racial tensions. White critics feared it would incite riots (Du Bois's fear realized as a weapon against the art).
      *   *The Slur Montage:* Direct address. Breaks the fourth wall. Is it documenting reality (Locke's aesthetic truth) or provoking a reaction (Du Bois's propaganda)? It forces the audience to confront their own complicity.
      *   *Mookie's Throw:* Ambiguous. Is it righteous anger or destructive chaos? Lee refuses to moralize explicitly. Du Bois might want a clearer moral lesson; Locke might appreciate the complexity.
      *   *The Ending Quotes:* MLK (non-violence) vs. Malcolm X (self-defense). Placed side-by-side. No hierarchy. This is the ultimate refusal of didacticism.

  4.  **Address the "Double-Audience Problem" (The Core Insight):**
      *   Du Bois knew about writing for white eyes (the "Veil"), but print is individual consumption.
      *   Film is a *collective* experience in a dark room.
      *   In 1989, the theater itself became a contested space. White audiences saw a threat; Black audiences saw a catharsis.
      *   Lee *weaponizes* this split. He knows the film lands differently depending on who is watching. This isn't just "propaganda"; it's *situational* meaning.
      *   *Verdict:* The film shows that in mass media, the "message" isn't in the text alone, but in the *reaction* to the text. Du Bois thought propaganda was about the *intent* of the artist. Lee shows it's about the *reception* of the viewer.

  5.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to be punchy. "Propaganda in the Dark," "The Trash Can and the Veil." Let's go with something about the debate itself.
      *   **Introduction:** Set the stage. 1926 vs. 1989. Define Du Bois (Propaganda) and Locke (Art) simply.
      *   **The Slur Montage:** Analyze through both lenses. It's aesthetic (stylized) but functional (provocative). It breaks the Locke/Du Bois binary because it uses aesthetics *as* propaganda.
      *   **Mookie & The Trash Can:** The ambiguity. Du Bois wants a lesson; Lee gives a dilemma. But is the *ambiguity* the propaganda? (Yes, it forces self-reflection).
      *   **The Ending:** The quotes. Refusal to choose. This aligns more with Locke's complexity but serves Du Bois's political urgency.
      *   **The "Double-Audience" Insight (The Climax of the Lecture):** This is the "earned your keep" part. Explain how film changes the game. The medium *is* the message. The theater is the battleground.
      *   **Conclusion:** Bring it back to the students. Why does this matter now?

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I take a stand? *Correction:* Make sure I don't just say "it's both." I need to argue that the film *transcends* the binary by exposing the audience's role.
      *   *Check:* Is it too dense for undergrads? *Correction:* Keep the definitions of Du Bois/Locke crisp. Use film scenes as anchors.
      *   *Check:* Did I address the "white critics feared riots" point? *Correction:* Yes, weave that into the "Double-Audience" section. That fear proves Du Bois's point (art affects reality) but validates Locke's fear (art gets reduced to sociology).

  7.  **Final Polish:**
      *   Ensure the tone is conversational but rigorous.
      *   Make sure the distinction between "propaganda as intent" (Du Bois) and "propaganda as effect" (Lee) is clear.
      *   Highlight that Lee validates Du Bois's *premise* (art is political) but rejects his *method* (didacticism), while validating Locke's *method* (complexity) but rejecting his *premise* (art is separate from politics).

  8.  **Final Review against constraints:**
      *   Stand taken? Yes (Film updates the debate via reception theory).
      *   Slur montage addressed? Yes.
