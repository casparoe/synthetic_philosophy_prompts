      *   Double-audience insight central? Yes.
      *   Undergrad appropriate? Yes.

  *(Self-Correction Note)*: I need to be careful not to misrepresent Du Bois. He didn't want *bad* art, he wanted art that served the cause. Locke didn't want *apolitical* art, he wanted art free from *obligation*. I need to make sure that nuance comes through so the students don't think Du Bois just wanted posters.

