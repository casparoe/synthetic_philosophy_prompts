answer: |-
  You have correctly identified that this is **not groupthink**. Groupthink (Janis, 1972) is a socio-psychological phenomenon driven by pressure for conformity, cohesion, and leadership influence. Your club members are submitting silent ballots; the mechanism is not social pressure, but **structural correlation of information**.

  There is no single, universally standardized noun phrase (like "Cognitive Dissonance") for this exact configuration in political science. However, the phenomenon is well-defined mathematically and theoretically across statistics, forecasting literature, and social choice theory.

  For your dissertation, you should anchor this in **Condorcet's Jury Theorem** and **Scott Page's Diversity Prediction Theorem**, and label the specific mechanism **Correlated Error via Common Signal Bias**. If you need a label for the phenomenon itself to distinguish it in your chapter, the most precise existing term is **Epistemic Clustering** (or **Informational Redundancy**), though I will suggest a more precise coinage below.

  Here is the breakdown of the concept, its theoretical edges, and how to frame it.

  ### 1. The Theoretical Anchor: Violation of Independence
  The "Wisdom of Crowds" relies on **Condorcet's Jury Theorem**. The theorem states that if every voter has a probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as the group size ($n$) approaches infinity.

  **The Catch:** The theorem assumes **independent votes**.
  Your club has hit the **Correlated Vote Problem**. When voters rely on the same information sources (the two pundits, the same feeds), their errors are no longer random; they are **systematically correlated**.

  *   **Random Error:** Cancels out in a crowd (Person A misses X, Person B misses Y).
  *   **Correlated Error:** Compounds in a crowd (Person A, B, and C all miss X because they all read the same wrong analysis).

  In statistics, this is known as a reduction in **Effective Sample Size ($N_{eff}$)**. While you have 60 members, if 15 of them are "clones" due to shared sources, your $N_{eff}$ might only be 45. If the correlation is high enough, adding more voters adds zero information gain.

  ### 2. The Mechanism: Common Signal Bias
  In the forecasting literature (e.g., the Good Judgment Project, Tetlock & Mellers), this is discussed as **Informational Redundancy** or **Common Signal Bias**.

  *   **Shared Evidence vs. Shared Priors:** The problem you are describing is primarily **Shared Evidence** (reading the same feeds). Shared priors (ideology) matter, but shared evidence is the stronger driver of *correlated error* in forecasting. If two people with different ideologies read the same flawed intelligence report, they will likely make the same forecasting error.
  *   **Awareness:** It does **not** matter if members know about each other's sources. The correlation is structural, not psychological. This distinguishes it from *Informational Cascades* (where people see others' votes and follow) and *Groupthink* (where people feel pressure to agree).
  *   **Why Accuracy Dips (Negative Value):** You asked when adding a voter counts as negative. This happens when the **Common Signal is Biased**.
      *   If the shared source is right 60% of the time, the "cluster" acts as one voter who is right 60% of the time.
      *   If the shared source is *wrong* on a specific class of questions (e.g., the pundits are consistently optimistic about a regime's stability), the cluster becomes a **Systematic Error Amplifier**.
      *   Mathematically, if the correlation coefficient ($\rho$) between voters is high, the crowd's error variance does not decrease as $1/n$. If the common signal has a bias $b$, the crowd converges on the wrong answer with high confidence.

  ### 3. The Best Framework: The Diversity Prediction Theorem
  For a political science dissertation, the most robust framework is **Scott E. Page's Diversity Prediction Theorem** (from *The Difference*, 2007).

  The theorem states:
  $$ \text{Collective Error} = \text{Average Individual Error} - \text{Prediction Diversity} $$

  This equation explains your flatline perfectly.
  *   **Average Individual Error:** Your members are competent (low error).
  *   **Prediction Diversity:** This has collapsed. Because everyone reads the same feeds, their predictions look the same.
  *   **Result:** As Diversity approaches zero, Collective Error approaches Average Individual Error. You gain no "crowd wisdom" bonus. If the shared perspective has a blind spot, Collective Error can actually exceed Individual Error on specific questions.

  ### 4. Terminology for Your Dissertation
  Since there is no single "Effect" name, you have two options:

  **Option A: Use the Statistical Term**
  Call it **"Correlated Error due to Informational Redundancy."**
  *   *Pros:* Mathematically precise, unassailable.
  *   *Cons:* Clunky.

  **Option B: Adopt/Adapt "Epistemic Clustering"**
  The term **Epistemic Clustering** is emerging in network epistemology to describe agents who update beliefs based on the same local evidence.
  *   *Recommendation:* I suggest you coin or adopt the term **"Informational Monoculture"** or **"Epistemic Redundancy."**
  *   *Definition:* *A state in which a forecasting aggregate fails to gain accuracy from increased membership because new voters draw from a shared pool of information sources, creating correlated errors that violate the independence assumption of Condorcet's Jury Theorem.*

  ### 5. Answering Your "Edges" Questions

  **Is the problem just shared evidence, or also shared priors?**
  It is both, but **shared evidence** is the operational killer in forecasting. Shared priors (e.g., "I am a libertarian") create baseline correlation, but shared evidence (e.g., "We all read this specific Substack") creates *spike* correlation on specific events. Your dip in accuracy after the 15 new members joined suggests a **Common Signal Shock**—a specific piece of information or narrative that skewed the cluster.

  **Does it matter whether members know about each other's sources?**
  **No.** This is the critical distinction from Groupthink. This is a **structural** problem, not a **social** one. Silent ballots prevent social contagion, but they cannot prevent *informational* contagion that happened *before* the vote (at the consumption stage).

  **At what point does adding a voter count as adding nothing versus adding negatively?**
  *   **Adding Nothing:** When the new voter's information is a perfect subset of the existing crowd's information ($N_{eff}$ does not increase).
  *   **Adding Negatively:** When the new voter increases the **weight** of a biased signal. In a weighted average (which a majority vote effectively is), if you add 15 voters who all rely on a source that is currently wrong, you have increased the "vote weight" of that wrong signal relative to the diverse members. You haven't just added noise; you have tilted the signal-to-noise ratio toward a specific error.

  ### Summary for Your Chapter
  You are observing the **breakdown of the Independence Assumption** in crowd aggregation due to **Epistemic Clustering**.

  *   **Not Groupthink:** No social pressure.
  *   **Not Wisdom of Crowds:** Fails the Diversity/Independence conditions.
  *   **The Mechanism:** **Correlated Error** driven by **Common Signal Bias**.
  *   **The Metric:** **Effective Sample Size** (which has flatlined).
  *   **The Term:** I recommend using **"Epistemic Redundancy"** to describe the state, and **"Correlated Vote Degradation"** to describe the outcome.

  Your advisor is right that it is "the usual thing," but in the literature, "the usual thing" is usually hand-waved as "lack of diversity." You have the opportunity to formalize the **informational supply chain** as the variable. The voters aren't the unit of analysis; the **information sources** are. Your 60 members are not 60 data points; they are 60 sensors plugged into 30 outlets.

  **Reference to cite:**
  *   **Ladha, K. K. (1992).** "The Condorcet Jury Theorem, Free Speech, and Correlated Votes." *American Journal of Political Science*. (This is the classic paper on why correlated votes break Condorcet).
  *   **Page, S. E. (2007).** *The Difference: How the Power of Diversity Creates Better Groups, Firms, Schools, and Societies.* (For the Diversity Prediction Theorem).
  *   **Surowiecki, J. (2004).** *The Wisdom of Crowds.* (Specifically the conditions of Independence and Diversity).
  *   **Mellers, B., et al. (2014).** "The psychology of intelligence analysis: Drivers of prediction accuracy in world politics." *Journal of Experimental Psychology: Applied*. (From the Good Judgment Project, discusses cognitive diversity).

  If you need a specific phrase to put in a header, **"The Correlated Vote Problem"** is clear, but **"Epistemic Redundancy"** sounds more like a distinct political science concept suitable for a dissertation.
