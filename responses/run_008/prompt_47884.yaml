prompt: |-
  Quick question about Tolstoy for anyone who knows aesthetics — I'm on an art theory module this term and we just reached Tolstoy, but I was ill for the seminar and my flatmate tried to catch me up from a video essay she'd watched. Here's her summary, more or less as she gave it:

  Tolstoy's view is that art is basically communication. The artist has a feeling, puts it into the work, and if the work is any good the feeling gets "infected" across to the audience — that's his actual test, infection. The one thing that matters for whether this works is sincerity: if the artist genuinely felt the emotion, the art is good; if they're faking it, it's bad. So the standard for good art is basically subjective — it's whatever the audience actually feels when they encounter the work. That's also why Tolstoy loved folk songs and peasant dances and declared that almost everything else — Shakespeare, Beethoven's later stuff, even his own earlier novels — wasn't real art: professional art is too complicated for ordinary people to catch the feeling from, and if most people can't be infected by it, it fails the test. So really Tolstoy is just saying good art is whatever the majority enjoys, which makes him an early populist critic, and the whole theory collapses into popular taste.

  Some of it sounded right to me (she says he really does go on about infection and sincerity), but other bits felt off — especially the last sentence. I have a vague memory of the lecturer emphasising that Tolstoy's standard is emphaticaly NOT popular taste, but I can't reconstruct what he put in its place, only something about religion that wasn't the ordinary church-y sense.

  Can you go through her summary bit by bit and tell me which parts a Tolstoy scholar would accept, which are simplifications, and which are just wrong? The specific things I want pinned down: (1) is sincerity really *sufficient* on his view, or only necessary? (2) does he actually make the standard subjective, i.e. set by whatever the audience feels? (3) what was his real complaint about elite/professional art — is the "too complicated to be caught" part of it right, or is something else doing the work? and (4) does the "whatever the majority enjoys" conclusion follow from the bits she got right? Also, if you can explain what he actually puts in place of popular taste as the content requirement — that religious thing I half remember — I'd owe you a coffee. Please answer in British English, and don't worry about being gentle with her, I just need to know if I can revise from this or whether I should scrap it and get the reading list off someone else.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

