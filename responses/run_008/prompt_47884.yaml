      *   *Correction on "Subjective":* The flatmate says "whatever the audience feels." Tolstoy says the audience *must* feel infected, but the *quality* of the art depends on the *quality of the feeling*. So the *success* of transmission is empirical (did they feel it?), but the *value* is normative (was it a good feeling?).
