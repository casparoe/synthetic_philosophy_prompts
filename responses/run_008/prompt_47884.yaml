answer: |-
  Your flatmate has grasped the mechanics of Tolstoy's theory but completely botched the ethics of it. Your lecturer was spot on: if you revise using her summary, you will likely fail the question on Tolstoy's normative standards. She has confused Tolstoy's description of *how* art works (the mechanism) with his prescription of *what* art ought to do (the moral purpose).

  Here is the breakdown of her summary, followed by your specific questions, and finally the verdict on whether you can use this for revision.

  ### Bit-by-Bit Critique

  **1. "Art is basically communication... feeling gets 'infected' across to the audience."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is the core of *What Is Art?* (1897). Tolstoy rejects the idea that art is about beauty or pleasure. It is a human activity consisting in one man consciously conveying to others, by certain external signs, the feelings he has lived through, and others being infected by these feelings.

  **2. "The one thing that matters for whether this works is sincerity."**
  *   **Verdict:** **Simplification (bordering on Wrong).**
  *   **Comment:** Sincerity is the *most important* of three conditions required for successful infection (the others being individuality and clarity). However, sincerity ensures the transmission happens; it does not guarantee the art is *good* in a moral sense. A sincere Nazi propagandist creates art that infects, but for Tolstoy, it is bad art.

  **3. "So the standard for good art is basically subjective — it's whatever the audience actually feels."**
  *   **Verdict:** **Wrong.**
  *   **Comment:** This is the critical error. For Tolstoy, the fact that an audience feels something proves the object is *art*, but it does not prove it is *good art*. The standard is objective and moral, not subjective and emotional.

  **4. "Tolstoy loved folk songs... declared that almost everything else... wasn't real art."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** He did famously dismiss Shakespeare, Beethoven, and his own *War and Peace* as "counterfeit art" or bad art in his later period.

  **5. "Professional art is too complicated for ordinary people to catch the feeling from, and if most people can't be infected by it, it fails the test."**
  *   **Verdict:** **Simplification.**
  *   **Comment:** Complexity is part of it, but the deeper issue is *exclusivity*. Elite art caters to a specific class with specific leisure time and education. If art divides people into those who 'get it' and those who don't, it fails the Christian ideal of unity.

  **6. "So really Tolstoy is just saying good art is whatever the majority enjoys... an early populist critic."**
  *   **Verdict:** **Dangerously Wrong.**
  *   **Comment:** Tolstoy is not a populist; he is a moralist. The majority might enjoy a bawdy song or a patriotic march that incites violence. Tolstoy would reject these as bad art because they do not promote universal brotherhood. Popularity is not the metric; moral utility is.

  ---

  ### Answering Your Specific Questions

  **(1) Is sincerity really *sufficient* on his view, or only necessary?**
  It is **necessary but not sufficient**.
  Tolstoy distinguishes between the *capacity* to infect (which requires sincerity, clarity, and individuality) and the *value* of the infection. You can have a sincere transmission of a base feeling (e.g., sexual lust or nationalistic hatred). This counts as art (because infection occurs), but it counts as **bad art**. For art to be *good*, the feeling transmitted must align with the "religious consciousness of the time."

  **(2) Does he actually make the standard subjective, i.e. set by whatever the audience feels?**
  **No.**
  The *presence* of feeling in the audience is the test of whether it is art at all. But the *quality* of the art is determined by the content of that feeling. Tolstoy believes there is an objective moral hierarchy of feelings. Feelings that unite humanity (love, compassion, brotherhood) are higher than feelings that divide or degrade (lust, pride, patriotism). The audience's reaction confirms the transmission, but Tolstoy's ethical framework judges the transmission.

  **(3) What was his real complaint about elite/professional art?**
  It is not merely that it is "too complicated." His complaint is that it is **exclusive and divisive**.
  Professional art in the late 19th century was funded by the wealthy and created for the wealthy. It required specific training to appreciate, meaning it could not unite the rich and the poor. For Tolstoy, the purpose of art is to unite all men in a common feeling. If a symphony can only be understood by a conservatory-trained elite, it actively works against human unity. It is "counterfeit" because it mimics art but serves class interests rather than religious/moral ones.

  **(4) Does the "whatever the majority enjoys" conclusion follow?**
  **Absolutely not.**
  This is where your flatmate's summary collapses. Tolstoy explicitly argues against the idea that pleasure or popularity determines value. He anticipates the objection that his theory makes art a slave to the masses. He counters that the "majority" isn't defined by numbers, but by those who hold the true "religious consciousness of the age." Sometimes, the majority might be corrupted by false values (like patriotism). Good art is what advances the true religious perception of the time, even if it is not currently the most popular entertainment.

  ---

  ### The "Religious Thing" (The Content Requirement)

  This is the bit your lecturer mentioned, and it is the linchpin of Tolstoy's later theory.

  When Tolstoy speaks of "religion," he does **not** mean church dogma, rituals, or orthodoxy. In fact, he was excommunicated by the Russian Orthodox Church for his views.

  By "religious consciousness," he means the **highest ethical understanding of life held by society at a given time.** For Tolstoy (in the 1890s), true Christianity was not about the divinity of Christ or the resurrection, but about the **brotherhood of man and universal love.**

  Therefore, the requirement for *good* art is:
  1.  **Universal Accessibility:** It must be understandable by everyone, from the Tsar to the peasant (hence his praise of simple folk tales).
  2.  **Moral Content:** It must transmit feelings that promote this universal brotherhood.
      *   **Good Art:** Transmits feelings of unity, compassion, and love (e.g., Dickens, Dostoevsky, Hugo, and simple folk songs).
      *   **Bad Art:** Transmits feelings of exclusivity, sexual desire, or pride (e.g., Wagner, Baudelaire, his own earlier novels).

  Art is a tool for moral progress. If it doesn't move humanity closer to this state of universal love, it is worthless, regardless of how skilled or popular it is.

  ---

  ### Verdict: Can you revise from this?

  **Scrap it.**

  Your flatmate's summary is a classic "half-truth" trap. It captures the *mechanism* (infection) but inverts the *teleology* (purpose).
  *   If you write in an exam that Tolstoy defines good art as "whatever the majority enjoys," you will be marked down significantly.
  *   If you write that sincerity is the *only* criterion, you will miss the distinction between successful transmission and moral value.

  **Recommendation:**
  You need to read the primary text or a reliable secondary source. Tolstoy's *What Is Art?* is surprisingly readable (he wrote it to be understood by peasants, after all), though his rants against Beethoven can be tiresome. Focus on **Chapters 5, 13, and 15**.

  If you are short on time, look for a Stanford Encyclopedia of Philosophy entry on Tolstoy's Aesthetics or a lecture summary from a reputable university module (e.g., Oxford, Cambridge, or LSE aesthetics courses). Your flatmate's video essay sounds like it was made by someone who skimmed the text and projected modern populist ideas onto a 19th-century moralist.

  Good luck with the module. And yes, I'd take that coffee.
