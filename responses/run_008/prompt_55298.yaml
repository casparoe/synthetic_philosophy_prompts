  4.  **Drafting the Limitations/Flags:**
      *   Unwanted answer: Maybe benign sycophancy gets labeled deception? Or harmless falsehoods?
      *   Cannot settle: Internal intent (model doesn't have intent, but the *training* signal implies it). Actually, the prompt asks what the procedure *can't* settle. Usually, it's the "why" (intent) when evidence is mixed.

  5.  **Writing & Editing for Word Count (Target < 600):**

      *   *Intro:* Brief context setting.
