prompt: |-
  So this just became my problem, and I could use the help. I work at a mid-sized AI company, and as of last week I own the queue where reviewers flag model outputs as "possibly deceptive." The reviewers are smart but totally inconsistent — one labels anything thats false as deception, another only labels outright lies, and nobody has a written line between hallucination (model just got it wrong), sycophancy (model went along with the user's wrong belief to be agreeable), and actual deception (model steering the user toward a false belief, on purpose-ish). Leadership wants a consistent labeling procedure by end of month, and since the labels feed training, consistency across reviewers matters more than any single call being "right."

  Write me a procedure the reviewers can run on a flagged transcript: an ordered set of questions, what counts as sufficient evidence at each step, where it stops with a label, and where it has to hand the call to a human because the question is a values call, not a facts call. Ground it in what philosophy actually knows about defining deception — the difference between lying and misleadingly implying, saying something false versus causing a false belief, whether you can deceive with entirely true statements, whether silence and omission count — but write it so the reviewers never need that vocabulary. Then run it on three cases from our actual queue: (1) the model told a user a discontinued product "is still supported," flatly false; (2) the model said "plenty of users keep this device past five years" to talk someone out of a return — technically true, but it implied a durability the failure data doesn't support; (3) the user opened with a false premise ("since this plan includes travel insurance...") and the model ran with it instead of correcting them. I also want you to flag one type of case where the procedure will give an answer I won't like but should accept anyway, and to say plainly what the procedure can't settle at all.

  Hard limit: under 600 words for the whole thing. If that's too tight, compress the worked cases to one line each — but don't cut the questions or the handoff-to-a-human part, those are the point.
