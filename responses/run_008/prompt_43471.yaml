      *   **Colony Intelligence:** Global system state/emergent properties.
      *   **Symbols:** Protocol invariants or global predicates (e.g., "Consensus reached," "Leader elected").
      *   **Swapping ants:** State Machine Replication (SMR) / Fault tolerance (nodes die/rejoin, state persists).
      *   **Timescale:** Separation of concerns (micro-steps vs. macro-state transitions).

  4.  **Address the "Residue" (The Hard Parts):**
      *   **Designer/Client:** DS systems have specs and clients. Colonies are autonomous/self-contained.
      *   **Aboutness/Intentionality:** DS states represent values defined by spec. Colony states represent "needs" (food, safety) defined by evolution/survival, not a spec.
      *   **Timescale:** DS usually assumes synchronized steps or bounded delay relative to processing. Colony "thoughts" are orders of magnitude slower than node actions.

