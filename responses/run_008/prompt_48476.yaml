answer: |-
  ### Essay Question

  **Dez argues that Supervaluationism is just Epistemicism with extra steps. He points out that on our 100-swatch row, both theories agree that the sentence "There is a swatch that is orange while the next one isn't" is true. If both theories accept a sharp cutoff exists, isn't the Supervaluationist secretly an Epistemicist? Write an essay responding to Dez. Explain exactly where the two theories split on the status of particular swatches (e.g., "Swatch 62 is the last orange one"). Conclude by arguing whether saying "there is a boundary but no specific swatch is it" is genuinely better than saying "there is a boundary we can never know."**

  ***

  ### Model Answer

  Dez is right that Epistemicism and Supervaluationism agree on the big picture: both reject the Sorites paradox by accepting that the general claim "There is a last orange swatch" is true. Both also keep classical logic mostly intact, agreeing that the Sorites step ("If swatch n is orange, then n+1 is orange") is false. However, Dez is wrong to claim they are the same theory. The split happens not on the general existential claim, but on the particular claims about specific swatches.

  For the Epistemicist, vagueness is ignorance. There is a fact of the matter in the world. One specific swatch, say Swatch 62, is the last orange one, and Swatch 63 is the first non-orange one. The sentence "Swatch 62 is the last orange swatch" is true, even though we can never know which number it is. The boundary is sharp but hidden.

  For the Supervaluationist, vagueness is semantic indecision. Our word "orange" isn't sharp enough to pick out exactly one cutoff. Instead, there are many "admissible precisifications"—ways of making the language precise. On one precisification, the cutoff is at 60; on another, it's at 65. The sentence "There is a last orange swatch" is "supertrue" because it comes out true on every single precisification. However, the sentence "Swatch 62 is the last orange swatch" is not supertrue. It is true on some precisifications and false on others. Therefore, it lacks a truth value entirely.

  This is where Dez's objection fails. He assumes that if "There exists a swatch..." is true, then there must be some specific swatch where "This swatch is..." is also true. This is a rule of classical logic called existential instantiation. The Supervaluationist keeps classical laws (like Excluded Middle) but sacrifices this inference rule for vague terms. They can consistently say, "It is true that a boundary exists, but it is not true of any specific swatch that it is the boundary." The Epistemicist cannot say this; they must say a specific swatch *is* the boundary.

  Is the Supervaluationist view better? It depends on what you find more costly. The Epistemicist pays with metaphysics: they must accept a sharp boundary in reality that makes no sense to our intuition and admits we are permanently ignorant of basic facts. The Supervaluationist pays with logic: they must accept that truth can gap and that some classical inferences fail. Supervaluationism respects the intuition that no single swatch looks special enough to be the cutoff. Epistemicism respects the intuition that logic should never break. Neither is free, but they are paying different prices, so they are not the same theory.

  ***

  ### Marking Scheme (20 Marks Total)

  | Move | Marks | What to look for (Top Answer) | Common Pitfall (How people botch it) |
  | :--- | :---: | :--- | :--- |
  | **1. Shared Ground** | 4 | Identifies that **both** theories accept the existential claim ("There is a last orange swatch") is true and the Sorites conditional is false. | Saying one theory accepts the Sorites paradox or that one denies the existential claim entirely. |
  | **2. The Split** | 4 | Clearly states the Epistemicist says particular claims (e.g., "Swatch 62...") are **true but unknown**, while the Supervaluationist says they are **indeterminate/no truth value**. | Confusing the two, or saying Supervaluationists think particular claims are simply false. |
  | **3. Mechanism** | 4 | Explains **precisifications/supertruth**: The existential is true on all sharpenings, but no particular swatch is the cutoff on all sharpenings. | Just using buzzwords like "precisification" without explaining how it makes the existential true but the particular false. |
  | **4. Countering Dez** | 4 | Identifies the logical gap: Supervaluationism denies the inference from "It is true that there exists an X" to "There is an X such that it is true." | Dismissing Dez by just repeating the theory without explaining why the inference fails for vague terms. |
  | **5. Evaluation** | 4 | Weighs the costs: **Ignorance** (Epistemicism) vs. **Logic/Truth Gaps** (Supervaluationism). Argues which intuition is preserved better. | Saying one is objectively "correct" without acknowledging the theoretical cost of the view. |

  ***

  ### Confidence & Caveat

  **Confidence Level:** 85%

  **The "Grain of Salt" Spot:**
  The weakest part is in **Move 4 (Countering Dez)** regarding classical logic. Strictly speaking, Supervaluationism preserves classical *tautologies* (laws) but fails some classical *inference rules* (like existential instantiation). In the model answer, I simplified this to keep it plain for the group. A hardcore philosophy professor might nitpick that saying Supervaluationism "keeps classical logic" is slightly misleading because it breaks the link between truth and existence that classical logic usually guarantees. For your meetup, the explanation holds up well enough to distinguish the views, but if someone digs into the logic textbooks later, they'll find that specific inference rule failure is the technical engine making the view work.
