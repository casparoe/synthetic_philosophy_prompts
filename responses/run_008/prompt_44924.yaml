prompt: |-
  Quick bit of context before my question: I'm a journalist who covers science and ideas, twenty years in newsrooms, definately not a lawyer. The one bit of legal philosophy that keeps snagging me is the old Hart–Fuller debate from the late fifties — I bumped into it while reporting a piece about how legal systems reckon with their own past crimes, and I've been chewing on it since.

  Here's the thing: I know that debate only vaguely, but I know newsroom practice cold. Sourcing standards, on-record versus off-record, the wall between straight news and opinion columns, the corrections desk, the style guide, editorial review before anything publishes. So do this for me: restate the Hart–Fuller debate in that vocabulary, as faithfully as you can.

  My tentative mapping, which you should correct where it's wrong: Fuller's "inner morality of law" — the idea that law has built-in requirements like being published, clear, non-contradictory, and not demanding the impossible — sounds to me like a newsroom's editorial standards. Those aren't standards about producing *good* journalism in the partisan sense; they're the conditions under which you're doing journalism at all. Systematically violate them and you haven't produced bad journalism, you've just produced content. And Hart's separation thesis — that the question of what the law is and the question of what the law ought to be are different questions — sounds like our wall between the news pages and the op-ed page.

  Then I want the residue report, honestly done: which parts of the debate translate cleanly, which parts only fit if you distort them, and which parts have no expression in newsroom vocabulary at all. Two things I specifically want you to address. First, the grudge informer case, which I gather was central to their exchange — does my corrections-desk intuition handle it, or does something important get lost? Second, Fuller's supposedly wicked-but-legal regimes: if a regime can be monstrous and still satisfy legality, is a propaganda outlet with a scrupulous corrections policy still doing journalism? And at the end, tell me whether the leftover bits point at something newsroom vocabulary can't say, or at something in the lawyers' disagreement that was less substantive than it looked.

  One request: please write the answer in British English — I'm filing for a UK outlet and my subeditor will murder me if she has to convert spellings herself. Keep it conversational too, I'm not after a law review piece, just something I can actually think with.
