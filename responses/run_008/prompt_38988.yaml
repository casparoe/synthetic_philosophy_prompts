  She will likely justify it by saying that even if *this specific transaction* is utility-positive (the engineer wants the cash more than the organ), legalizing the market creates a **negative externality on social norms** that ultimately reduces total utility. She'll argue that turning organs into inventory degrades the concept of bodily integrity, which functions as a protective norm for the desperate people she *does* want to protect (like the Iranian sellers).

  ### The Rule: "Inalienable Endowments" (Rule-Utilitarian Version)
  Maya isn't running a simple "Desperation" or "Third-Party Harm" heuristic. She is running a **Rule-Utilitarian Market Integrity** filter.

  Her core principle is: **Markets are permissible only when they do not commodify the baseline endowments required to participate in society as a free agent.**

  She treats certain assets as "inalienable" not because of mystical dignity, but because allowing them to be priced undermines the system that generates utility in the long run. Here is how her track record maps to this:

  1.  **Vote Selling (Ban):** A vote is a unit of *civic agency*. Selling it commodifies political power. Even if one vote doesn't matter, normalizing the *market* for votes destroys the legitimacy of the democratic system (Third-Party/Systemic Harm).
  2.  **Price Gouging (Ban):** Access to survival goods (generators/water) during a crisis is *survival agency*. Pricing it at market clearance rates treats survival as a commodity, eroding the social trust and mutual aid norms required for community resilience (Systemic Norm Harm).
  3.  **Kidney Sales (Ban):** A kidney is *biological agency*. It is non-regenerable health capital. Allowing it to be sold treats the human body as a warehouse of spare parts. Even if the seller is rich, the *market* creates a price signal that pressures the poor (Normative Harm).
  4.  **Plasma/Surrogacy/Challenge Trials (Allow):** These are viewed as **renting capacity**, not **liquidating capital**.
      *   *Plasma:* Regenerates (you aren't losing the capital).
      *   *Surrogacy:* It is labor/time (gestation), not the permanent sale of a body part. The body returns to its baseline.
      *   *Challenge Trials:* This is risking health for public good, not selling a body part for private gain. The "public good" aspect likely overrides the bodily risk in her calculus.

  **Why your candidate rules didn't quite fit:**
  *   *Desperation:* Fails on Vote Selling (you can sell a vote without being desperate) and Price Gouging (the *buyer* is desperate, not the seller).
  *   *Constitutive:* Fails on Surrogacy (pregnancy is deeply constitutive of experience) and Challenge Trials (risking death is existential).
  *   *Third-Party Harm:* Fits best, but only if you define "harm" as "long-term degradation of social norms" rather than immediate physical harm.

  ### The Test Case
  To distinguish whether she is truly a **Norm-Utilitarian** (markets corrode values) versus a **Vitality-Utilitarian** (markets are fine as long as you don't lose essential function), spring this case on her:

  **The Case of the Healthy Finger:**
  > "A wealthy artist wants to sell their pinky finger to a eccentric collector. The artist is well-off, not desperate, and fully understands the permanent loss. The finger is non-essential for health or survival. The transaction is regulated and safe. Should it be legal?"

  **How to interpret her verdict:**

  *   **If she says NO:** She is a **Body Integrity Absolutist**. She believes the body itself is off-limits to market logic, regardless of function. This confirms the "Inalienable Endowment" theory. Her objection to kidneys isn't about health; it's about the *category error* of selling flesh.
  *   **If she says YES:** She is a **Vitality Functionalist**. She only bans markets that reduce your capacity to function as an agent (kidneys = health, votes = politics, generators = survival). A finger is cosmetic/utility-neutral. This suggests her kidney ruling is actually about **medical risk**, not commodification.
  *   **If she hedges:** Ask her about **Selling a Vote in a Homeowners Association (HOA).**
      *   If she bans HOA vote selling: She hates the *act* of selling votes (Principle).
      *   If she allows HOA vote selling: She only cares about *National Democratic Integrity* (Systemic Consequence).

  **My bet:** She bans the finger. Rationalists who make exceptions for "markets" often have a hidden deontological boundary around the "Self." She treats the Self as a utility-maximizing machine, but she doesn't want the machine to be allowed to sell its own parts, because that breaks the machine's long-term operating parameters. She is protecting the Engineer from the Engineer.
