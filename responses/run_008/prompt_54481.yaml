prompt: |-
  I'm the patient representative on the ethics committee at our county behavioral health center, and we have a case next week that I suspect is going to split us down the middle. A woman in her late 30s with schizoaffective disorder — she's had maybe five involuntary holds over the past decade, each one following the same script where she stops her meds, stops sleeping, and by the time anyone intervenes she's lost her apartment or her job and is pretty angry at everyone involved. Last year, while stable and with a documented capacity assessment, she worked out a self-binding agreement with her outpatient psychiatrist: she named a proxy (her sister), pre-consented to a two-week involuntary stay and a specific antipsychotic if she relapsed and refused treatment, and even wrote a letter to her future self acknowledging she'd probably be furious and asking everyone to go ahead anyway. Classic Ulysses contract stuff, she actually used the phrase about tying herself to the mast.

  So now she's relapsed, brought in by her sister, and objecting — except the wrinkle is that her objection is actually pretty articulate, not floridly psychotic. And there's a second wrinkle: the drug she pre-consented to caused her serious akathisia in the months after she signed (a side effect nobody anticipated when the contract was drafted), she's asking for a different medication, and the treating team thinks the alternative is clinically reasonable. Half the committee says we should honor the agreement exactly as written because that's the whole point of it, and half says forcing her to take a drug that's now known to torture her when she's asking for a reasonable substitute turns the contract into a suicide pact rather than a safety net. One of the psychiatrists on the committee keeps insisting this is all just constitutional precommitment at small scale — that honoring the directive is like enforcing an old constitution against a living majority, which we do all the time without blinking — while our lawyer counters that we at least amend constitutions, and she's arguably trying to amend hers right now from the floor.

  Please draft the written opinion I'll circulate before the meeting. It should give a clear recommendation (honor it as written, honor it with a narrow exception for the medication substitution, or treat it as nonbinding given her current objection), reasoning that the clinicians and the patient advocate could actually engage with rather than just hand-waving about autonomy, and it should take the strongest version of the losing side seriously. We also want a paragraph at the end recommending what our standing policy should be for these agreements going forward, since her case has prompted two other patients to ask about writing their own. Keep in mind our committee has to live with each other after this, so if you're going to say her past self gets to overrule her present self, I'd like a real answer to why that past self is the *real* one rather than just the more convenient one.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **Role:** Patient Representative on an Ethics Committee at a County Behavioral Health Center.
      *   **Task:** Draft a written opinion to circulate before a meeting regarding a specific case.
      *   **Case Details:**
          *   Patient: Female, late 30s, schizoaffective disorder.
          *   History: ~5 involuntary holds over 10 years (cycle of non-adherence, decompensation, loss of housing/job, anger).
          *   Intervention: Ulysses Contract (Self-Binding Directive) signed last year while stable/capacious.
          *   Terms: Pre-consent to 2-week involuntary stay + specific antipsychotic if relapsed/refusing. Proxy: Sister.
          *   Current Situation: Relapsed, brought in by sister, objecting (but articulately).
          *   Complication 1: Objection is articulate, not floridly psychotic.
          *   Complication 2: Pre-consented drug caused severe akathisia (unanticipated side effect). She wants a different med. Team thinks alternative is reasonable.
          *   Conflict: Honor contract exactly vs. Honor with exception (med swap) vs. Void contract due to current objection.
          *   Committee Dynamics: Split down the middle. One psychiatrist argues "constitutional precommitment." Lawyer argues "amending constitutions."
      *   **Requirements:**
          *   Clear recommendation.
          *   Reasoning engaging for clinicians and advocates (no hand-waving).
          *   Steelman the losing side (take strongest version seriously).
          *   Address the "Past Self vs. Present Self" identity problem (why is past self the "real" one?).
          *   Include a policy recommendation for future Ulysses contracts.
          *   Tone: Professional, collaborative (committee needs to keep working together), ethically rigorous.

  2.  **Determine the Recommendation:**
      *   *Option A (Honor as written):* Risks causing harm (akathisia) and undermines trust. Seems rigid given the new medical information.
      *   *Option B (Void entirely):* Undermines the purpose of the Ulysses contract. If we ignore it because she objects *now*, the contract is useless for its intended purpose (when she objects).
      *   *Option C (Honor with narrow exception):* This seems the most ethically defensible. It respects the *intent* of the past competent self (to be treated during relapse) while acknowledging the *medical reality* that the specific means (the drug) is now contraindicated/harmful. It balances autonomy (past) with non-maleficence (present).
      *   *Decision:* Recommend honoring the *commitment to treatment* but allowing the *medication substitution*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose, acknowledge the difficulty, and state the recommendation clearly upfront.
      *   **The Core Ethical Tension:** Define the conflict between Past Autonomy (Ulysses) and Present Autonomy/Objection.
      *   **Addressing the "Real Self" Question:** This is crucial. Why trust the past self?
          *   *Argument:* The past self was capacious, stable, and acting on long-term values. The present self is influenced by the pathology (anosognosia/ambivalence inherent in relapse), even if articulate.
          *   *Nuance:* However, the past self didn't know about the akathisia. The "will" was to get well, not to suffer side effects.
      *   **Steel-manning the Opposition:**
          *   *Side 1 (Strict Enforcement):* If we deviate, we make these contracts toothless. Trust in the system erodes.
          *   *Side 2 (Current Objection Voids It):* Coercion is traumatic. Her current articulation suggests capacity might not be as gone as we think.
          *   *Rebuttal/Synthesis:* We need a middle ground. The contract is a *vehicle* for her values, not a suicide pact.
      *   **The Medication Issue (Non-Maleficence):** Akathisia is severe. Forcing it violates "do no harm." Substituting a clinically reasonable alternative fulfills the *goal* of the contract (stabilization) without the specific harm.
      *   **The "Constitutional" Analogy:** Address the psychiatrist's point. Constitutions have amendment processes and judicial review. This situation is akin to "judicial review" based on new evidence (side effects).
      *   **Policy Recommendation:** Future contracts need "escape clauses." Review triggers. Specificity vs. Flexibility.
      *   **Conclusion:** Reiterate the path forward.

  4.  **Refining the Tone:**
      *   Avoid jargon where possible, but use precise ethical terms (precedent autonomy, non-maleficence).
      *   Ensure it doesn't sound like a lecture. Use "we," "our committee."
      *   Make sure the "Past Self" argument doesn't sound like "Past Self is always right." It needs to be about *conditions of competence*.
      *   *Self-Correction on "Past Self":* I need to be careful not to say the present self is "fake." I need to argue that the *conditions* under which the present decision is made are compromised by the illness the contract was designed to address, *but* the specific instruction regarding the med is compromised by new medical data.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Keep it direct. "Recommendation: Honor the commitment to hospitalization and treatment, but authorize the medication substitution."
      *   *The "Real Self" Argument:* Focus on *values* vs. *preferences*. Past self valued stability. Present self values avoidance of coercion. But the illness distorts the weighing of these values. *However*, the side effect is an objective medical fact unknown to the past self.
      *   *The Constitutional Analogy:* The lawyer is right. Constitutions have amendment processes. We are acting as the "Supreme Court" interpreting the intent vs. the text.
      *   *Policy:* Need a "Sunset Clause" or "Side Effect Review."

  6.  **Final Review against Constraints:**
      *   Clear recommendation? Yes.
      *   Reasoning for clinicians/advocates? Yes (balances autonomy and harm).
      *   Strongest version of losing side? Yes (addressed the "toothless contract" and "coercion trauma" arguments).
      *   Past vs. Present Self identity? Yes (addressed via "conditions of competence" and "unknown variables").
      *   Policy recommendation? Yes.
      *   Tone? Collaborative.

  7.  **Final Polish:** Check for empathy. Ensure the patient's suffering (akathisia) is acknowledged as ethically weighty, not just a clinical footnote. (Self-correction: Make sure to emphasize that akathisia is not just "uncomfortable" but can be dysphoric enough to increase suicide risk, strengthening the non-maleficence argument).

  8.  *(Final thought before writing)*: The prompt asks for a "written opinion I'll circulate." It should look like a memo.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Behavioral Health Center Ethics Committee
  **FROM:** [Your Name], Patient Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation Regarding Case #24-09 (Ulysses Directive Enforcement)

  **I. Recommendation**

  After reviewing the clinical data, the self-binding directive (SBD), and the conflicting ethical arguments presented during our preliminary discussion, I recommend the following course of action:

  **The Committee should authorize the enforcement of the involuntary hold as per the directive, but grant a narrow exception regarding the specific pharmacological intervention.**

  Specifically, we should honor the patient's *precedent autonomy* regarding the need for hospitalization and stabilization during relapse, but we should *not* compel the administration of the specific antipsychotic named in the contract. Instead, we should authorize the treating team to prescribe the alternative medication requested by the patient, provided it is deemed clinically appropriate by the attending psychiatrist.

  **II. The Ethical Landscape: Precedent vs. Current Autonomy**

  We are split on this case because we are weighing two legitimate forms of autonomy against one another.

  On one side, we have **Precedent Autonomy**: the right of a competent self to make decisions for a future self that may lack capacity. On the other, we have **Current Autonomy**: the right of the person currently in the bed to refuse treatment, even if that refusal is influenced by illness.

  **The Argument for Strict Enforcement (Steelmanned)**
  Those arguing we must enforce the contract exactly as written are correct on a fundamental point: if we allow current objections to override a Ulysses contract whenever they are articulate, we render these contracts useless. The entire purpose of this mechanism is to intervene precisely when the patient *would* object. If we require the patient to agree to the intervention at the time of the intervention, we have not created a self-binding directive; we have created a standard consent form. To deviate from the text is to risk eroding trust in the tool, not just for this patient, but for the two others currently drafting similar agreements. If the "Past Self" does not rule, the safety net dissolves.

  **The Argument for Voiding the Directive (Steelmanned)**
  Conversely, those arguing we should treat the directive as non-binding are correct that coercion is traumatic. This patient's objection is not floridly psychotic; it is reasoned. To ignore her current voice risks re-traumatizing her and reinforcing a narrative of powerlessness that undermines therapeutic alliance. Furthermore, if the "Past Self" is granted absolute tyranny over the "Present Self," we risk treating the patient as a mere vessel for a previous decision rather than a human being enduring the consequences.

  **III. Resolving the Identity Conflict: Which Self is "Real"?**

  The most difficult question we face is ontological: Why does the Past Self get to overrule the Present Self? Is the woman who signed the letter the "real" her, or is the woman objecting in the bed the "real" her?

  I argue that the "Real Self" is not a static identity, but a **capacity-dependent state**. We honor the Past Self not because she is morally superior, but because she made this decision under the *conditions of competence* that the contract was designed to protect. She anticipated that her illness would distort her valuation of safety versus liberty.

  However, there is a critical limit to this authority. The Past Self's authority is derived from her *values* (stability, housing, employment), not her *specific predictions* about medical tolerance.

  The Past Self did not consent to akathisia. She consented to *stabilization*. When the specific means agreed upon (Drug A) become actively harmful in a way that was unanticipated at the time of signing, enforcing that specific means violates the *intent* of the directive. To force the medication is to transform a safety net into a punishment. We are not honoring her autonomy by forcing her to endure a side effect she never agreed to; we are honoring the *text* while violating the *spirit*.

  **IV. The Constitutional Analogy**

  Dr. [Psychiatrist's Name] likened this to enforcing a constitution against a living majority. This is apt, but the analogy cuts both ways. Our legal system does not treat constitutions as suicide pacts. We have mechanisms for interpretation when circumstances change.

  Our patient's lawyer on the committee noted that constitutions have amendment processes. In this clinical context, the emergence of severe, unanticipated side effects constitutes a "change in circumstances" akin to a constitutional crisis. We are not acting as the legislature to rewrite her contract; we are acting as the judiciary to interpret it. The interpretation that best serves her established values (health, stability) is to allow the treatment *without* the specific harm that threatens those values. Akathisia is not merely uncomfortable; it is a known risk factor for non-adherence and suicidality. Honoring the contract by forcing the drug could ironically lead to the very decompensation the contract was meant to prevent.

  **V. Policy Recommendation for Future Directives**

  This case highlights a gap in our current standing policy regarding Self-Binding Directives. To prevent this ethical deadlock in the future, I recommend the committee adopt the following standards for all subsequent Ulysses contracts:

  1.  **The "Unknown Variable" Clause:** All directives must include language acknowledging that medical recommendations change. The patient should pre-authorize the treating physician to substitute medications *if* the primary choice is contraindicated or causes severe adverse effects, provided the substitute is in the same class or aims for the same clinical outcome.
  2.  **Mandatory Review Triggers:** These agreements should not be open-ended. They should expire after a set period (e.g., 2 years) or require a brief review after any activation to update the "preferred interventions" list based on new tolerability data.
  3.  **Proxy Discretion:** The designated proxy (in this case, the sister) should be explicitly empowered to advocate for clinical substitutions if the patient's reaction to the pre-consented treatment suggests unforeseen harm.

  **VI. Conclusion**

  We can honor the patient's Past Self without harming her Present Self. By authorizing the hold but allowing the medication substitution, we validate her long-term commitment to recovery while respecting her immediate physical integrity. This preserves the utility of the Ulysses contract for future patients without turning this specific patient's safety plan into a source of iatrogenic harm.

  I look forward to discussing this with you all on Tuesday.

  [Your Name]
  Patient Representative, Ethics Committee
