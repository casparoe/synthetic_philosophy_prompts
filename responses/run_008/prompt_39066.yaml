          *   The user's "Creation vs. Discovery" model is compelling but perhaps too metaphysical.
          *   *Alternative:* It's more about *cost of production* vs. *cost of imitation* and *social utility*.
          *   *Copyright:* Low barrier to entry, high value in diversity. We want *many* songs. Protecting the first song doesn't stop others from making different songs.
          *   *Patent:* High barrier to entry (R&D), high social value in *disclosure*. The bargain is: Tell us how to do it, we give you a monopoly. If independent invention were a defense, the monopoly value drops, and people might keep trade secrets instead.
