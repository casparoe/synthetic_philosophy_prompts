answer: |-
  This is a remarkably sharp dissection of the tension at the heart of intellectual property. You have identified the central doctrinal schism: copyright's protection against *copying* versus patent's protection against *making*.

  Your hypothesis—that this reflects a metaphysical split between "creation" (abundant expression) and "discovery" (scarce functional truth)—is a classic one in legal theory. It aligns with the Lockean labor theory (you own what you mix your labor with) but hits a wall when two people mix labor with the same "land."

  Here is my reconstruction of the underlying picture, the utilitarian alternative, the consequences of flipping the script, and finally, where I think this whole analysis stands on its shakiest ground.

  ### 1. Is the "Creation vs. Discovery" Picture the Actual Presupposition?

  It is the **rhetorical** presupposition, but likely not the **functional** one.

  Legal opinions often speak of inventors as "explorers" mapping the "frontiers of science," which supports your "land grab" intuition. Conversely, authors are spoken of as "originators" of unique voice. However, if you look at the statutory requirements, the metaphysics get muddy.
  *   **Patent:** To get a patent, an invention must be "non-obvious." This implies it wasn't just sitting there waiting to be found like a rock; it required a creative leap. If it were pure discovery, *any* finding would count.
  *   **Copyright:** To get copyright, a work must be "original," but the bar is incredibly low. It doesn't need to be novel, just independently created.

  So, while the *language* of patent law leans toward your "discovery/scarce" model, the *requirements* acknowledge invention is creative. The deeper presupposition isn't metaphysical; it's **economic convergence.**

  *   **Copyright assumes divergence.** There are effectively infinite ways to express a love song. Protecting one does not significantly hinder others from making different ones. The "cost" of granting a monopoly is low because the "idea space" is vast.
  *   **Patent assumes convergence.** Engineering problems often have limited optimal solutions. If you solve a specific technical problem (e.g., "how to compress video efficiently"), there may only be one or two mathematically viable ways to do it. If the law allowed independent invention, the second inventor could effectively nullify the first inventor's monopoly on that specific functional solution.

  Therefore, the system presupposes that **functional ideas are scarce resources** (like land) while **expressive works are abundant resources** (like sand).

  ### 2. Is this Picture Necessary, or Just Compatible? (The Utilitarian Test)

  You asked if a straightforward utilitarian story could produce these rules without the metaphysics. **Yes, absolutely.** In fact, most modern IP scholars argue the utilitarian story is the *driver*, and the metaphysics is the *justification*.

  Here is the utilitarian calculus without the "discovery" baggage:

  **The Patent Bargain (Disclosure vs. Monopoly):**
  The primary goal of patent law is not just to reward the inventor, but to induce **disclosure**. Without patents, inventors might rely on trade secrets (like the Coca-Cola formula). Trade secrets die with the holder; patents publish the knowledge for society to use eventually.
  *   **Why no independent inventor defense?** If I know that you can independently invent around my patent and compete with me immediately, the value of my patent drops. If the value drops, I might not invest the millions in R&D required to get there, or I might keep it a trade secret. To maximize R&D investment and public disclosure, the monopoly must be strong enough to exclude *everyone*, even innocent competitors.

  **The Copyright Bargain (Production vs. Access):**
  The goal is to encourage the creation of art without stifling culture.
  *   **Why an independent creation defense?** Because the transaction costs of clearing rights would be impossible. If you had to ensure no one else ever wrote your melody, you'd need to search every song ever written before humming a tune. This would paralyze creation. Furthermore, since expressive works are non-rivalrous (my singing the song doesn't stop you from singing yours), allowing two owners doesn't destroy the utility of the work.

  So, you don't need to believe inventions are "discovered" to justify the rule. You only need to believe that **functional innovation requires higher capital investment and benefits more from standardization/disclosure than artistic expression does.**

  ### 3. What if We Flipped the Presupposition?

  If we decided the metaphysics were wrong and swapped the rules, the practical consequences would be drastic.

  **Scenario A: Patent Law adopts the Copyright Model (Independent Inventor Defense)**
  *   **The Change:** If I invent a new battery chemistry, and you invent it independently a year later, we both get to use it.
  *   **The Consequence:** The value of the patent plummets. Venture capital for hardware/biotech would dry up because the "moat" is gone. Inventors would shift to **Trade Secrets**. We would see less public knowledge and more black-box technology. Litigation would explode because every infringement suit would turn into a psychic investigation of the defendant's lab notebooks to prove they *didn't* invent it independently.

  **Scenario B: Copyright Law adopts the Patent Model (Strict Liability/First-to-File)**
  *   **The Change:** If I register a melody, and you write the same one independently, you are infringing.
  *   **The Consequence:** A massive chilling effect. Musicians would stop composing without expensive "clearance" searches. The culture would consolidate around large publishers who own the databases of existing melodies. Small creators would be too risk-averse to publish. We would see fewer songs, not more.

  The rules are not arbitrary; they are tuned to the **economic friction** of the respective fields.

  ### 4. The Shakiest Ground: The Administrative Feasibility Argument

  Here is where I must expose the vulnerability in this reconstruction.

  My argument rests on the assumption that the current rules are the *optimal* utilitarian balance. The weakest link in that chain is the **administrative feasibility of proving independent creation.**

  In copyright, the plaintiff must prove **Access + Substantial Similarity**. If you can prove I never heard your song, I win. This is hard, but doable (e.g., "I wrote this in a cabin in 1990 before your song was released").

  In patent, independent invention is not a defense. But why? My utilitarian explanation was "it weakens the incentive." But there is a second, pragmatic reason: **It is incredibly difficult to verify.**
  *   In copyright, the "work" is the expression itself. If I have drafts dated prior to your release, it's strong evidence.
  *   In patent, the "invention" is a functional concept. Proving I "conceived" it independently requires scrutinizing lab notebooks, emails, and mental states. It invites perjury.

  **The Pivot Point:**
  If someone pushed back on my reconstruction, the argument that would make me change my mind is this: **If independent invention were easy to verify objectively, would we still ban it?**

  If we had a perfect system of timestamped, encrypted R&D logs (perhaps via blockchain or mandatory national registries) that made proving independent invention cheap and reliable, the utilitarian argument against an independent inventor defense weakens significantly.
  *   We could keep the disclosure benefit (you still have to patent to get protection).
  *   But we could allow the second inventor to use their own invention, perhaps paying a reasonable royalty rather than being enjoined.

  Some legal scholars (like Lemley) have argued for exactly this: a "right to use" for independent inventors. The fact that we *don't* have this suggests that either:
  1.  The "Discovery/Land" metaphysics is stronger than I admit (the first finder owns the truth, period).
  2.  Or, the administrative cost of verifying independent invention is still deemed too high, even with modern tech.

  **Where I am most vulnerable:**
  I am assuming that the **exclusionary right** (the right to stop others) is essential to the patent incentive. If it turned out that the primary incentive is merely the **right to monetize** (via licensing), rather than the right to exclude competitors, then the ban on independent invention becomes harder to justify utilitarianly.

  If you could convince me that R&D investment is driven by *market lead time* and *brand* rather than *legal exclusion*, then the entire "Patent as Land" model collapses. In the software industry, for example, lead time is often more valuable than patents, yet patent law remains strict. If the strictness of patent law is disconnected from actual industry incentives, then my reconstruction that "the rules are tuned to economic friction" is wrong. It might instead be that **patent law is a historical artifact** that no longer matches the economic reality of innovation, preserved only by the "Discovery" rhetoric you identified.

  ### Summary

  You are right that the system *looks* like it presupposes Creation (Copyright) vs. Discovery (Patent). But that is likely a folk theory used to justify rules that are actually driven by **scarcity of solutions** and **transaction costs**.

  However, I am least confident in the claim that these rules are *necessary* for incentives. They are *sufficient*, but perhaps not necessary. If the evidentiary burden of proving independent invention were lowered, or if we realized that exclusion is less important than lead-time, the "Land Grab" model of patent law might be revealed as an inefficiency we tolerate because it's easier to administer than a nuanced "Independent Inventor" defense.

  The system isn't necessarily wise; it's just consistent with a specific theory of administrative convenience.
