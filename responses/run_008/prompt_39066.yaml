          *   *If Copyright became like Patent (First to Register/Strict Liability):* Chilling effect. Artists afraid to create. Massive search costs (clearing rights for every melody). Stifles culture.
          *   *Why?* Because the *nature of the work* dictates the optimal rule, not just the metaphysical view.

