answer: |-
  Here is a complete lesson plan designed for a 75-minute session with 18 adult learners. It prioritizes psychological safety while simulating the pressure of the two moral emotions.

  ### Activity Title: "The Commons Ledger"

  **Class Size:** 18 Students
  **Setup:** 3 Tables of 6 students each.
  **Materials:**
  *   Printed "Ledger Sheets" (one per student).
  *   A bag of candy or small prizes (enough for a "winning" table).
  *   A whiteboard/projector to track group totals.
  *   Two distinct sets of "Feedback Cards" for the instructor (Green for Act, Red for Agent).

  ---

  ### Part 1: Setup & Rules (10 Minutes)

  **The Narrative:**
  Tell the class: *"We are running a simulation on resource management. You are stakeholders in a shared project. Your goal is to maximize your personal credits, but the project only succeeds if the group contributes."*

  **The Mechanics:**
  1.  **Endowment:** Each student gets 10 Credits (write on Ledger Sheet).
  2.  **The Choice:** Each round, you privately decide how many credits to keep (0–10) and how many to contribute to the **Common Pot**.
  3.  **The Multiplier:** The Common Pot is multiplied by 1.5 and distributed equally among all 6 players, regardless of contribution.
  4.  **The Catch:** There is a "Minimum Contribution Expectation" (MCE). Let's set it at 5 credits per person.
  5.  **Winning:** The table with the highest *average* personal savings at the end wins the candy/prize.

  **The "Audit":**
  Tell them: *"After every round, I will audit the table. If the table average falls below the MCE, I will intervene."*

  ---

  ### Part 2: The Rounds (35 Minutes)

  **Round 1: Baseline (5 mins)**
  *   Students play. No feedback given regardless of outcome.
  *   *Purpose:* Establishes baseline behavior (usually mixed cooperation).

  **Round 2: The "Guilt" Frame (10 mins)**
  *   **Condition:** If a table underperforms, the Instructor approaches the table and addresses the *action*.
  *   **Script:** Look at the Ledger Sheets. Identify low contributors. Say: *"Player 3 contributed 2 credits. The rule expectation was 5. This action reduced the group total by 4.5 credits. This violates the agreement."*
  *   **Key Feature:** The focus is on the **math and the rule**. It implies the *act* was wrong, not the person. It leaves room for repair ("I can do better next time").
  *   **Observation:** Watch for nodding, note-taking, or students saying, "I'll put more in next time."

  **Round 3: The "Shame" Frame (10 mins)**
  *   **Condition:** If a table underperforms, the Instructor addresses the *agent*.
  *   **Script:** Look at the Ledger Sheets. Identify low contributors. Say: *"Player 3 contributed 2 credits. That is a selfish move. It shows you aren't a team player. People at this table can't rely on you. You are being a burden."*
  *   **Key Feature:** The focus is on **identity and social standing**. It implies the *person* is flawed. Repair is difficult because the label sticks.
  *   **Observation:** Watch for looking down, crossing arms, nervous laughter, arguing with the instructor, or refusing to play in the next round.
  *   **Safety Valve:** Before starting Round 3, explicitly state: *"The language I am about to use is part of the experiment. It is scripted. It is not my personal opinion of you. You are safe, but please notice how the language lands."*

  **Round 4: The Vote (10 mins)**
  *   Pause the game.
  *   **The Vote:** Ask the class to vote on which "Audit Style" (Round 2 Style or Round 3 Style) should govern the final round.
  *   **The Twist:** They must vote as a whole class, not per table. If they choose Round 3 Style, *everyone* is subject to it, even those who voted against it.
  *   Play the final round under the chosen culture.

  ---

  ### Part 3: The Debrief (30 Minutes)

  *Do not mention philosophers yet.*

  **1. Phenomenological Check-in (10 mins)**
  *   "In Round 2 (Act), when I called out the numbers, what did you feel like doing?" (Expected: Fix it, explain, apologize).
  *   "In Round 3 (Agent), when I called you 'selfish' or a 'burden,' what did you feel like doing?" (Expected: Hide, get angry, tune out, stop caring).
  *   "When you voted for the final round, did you vote for what felt *better*, or what you thought would produce *more points*?"

  **2. The Anthropological Turn (10 mins)**
  *   Introduce the terms **Guilt Culture** vs. **Shame Culture**.
  *   Explain: "Anthropologists use these terms to describe how societies enforce norms. One relies on an internal conscience triggered by breaking a rule. The other relies on an external audience triggered by failing a role."
  *   Ask: "Can a society actually *vote* on which one it wants to be? Look at our vote. Did choosing the 'Guilt' frame make us nicer, or just more efficient?"

  **3. The Philosophical Hook (10 mins)**
  *   Now you can name-drop.
      *   **Ruth Benedict:** Popularized the distinction (Chrysanthemum and the Sword).
      *   **Bernard Williams:** *Shame and Necessity* (Shame is about how I appear to those I respect; Guilt is about what I did).
      *   **Martha Nussbaum:** Argues shame is often politically toxic because it targets things we can't control.
  *   **Closing Question:** "If shame requires an audience, can you feel shame when you are alone? If guilt requires a rule, can you feel guilt when the rule is unjust? Which emotion is better for a democracy?"

  ---

  ### Scoring System (No Money Needed)

  *   **Currency:** "Credits" written on the Ledger Sheet.
  *   **Stakes:** The "Winning Table" (highest average personal savings at the end) gets a bag of premium chocolate or candy to split.
  *   **Why this works:** It creates a conflict between *Self-Interest* (hoarding) and *Group Interest* (contributing). The candy is trivial enough not to cause genuine distress, but tangible enough to make "losing" feel real.

  ---

  ### What Will Predictably Go Wrong (And How to Handle It)

  **1. The "Giggle" Defense**
  *   **Prediction:** During Round 3 (Shame), students will laugh nervously when you call them "selfish."
  *   **Why:** Nervous laughter is a defense mechanism against social threat. It neutralizes the shame.
  *   **Fix:** Do not laugh with them. Pause. Wait for silence. Say calmly, *"I know this feels awkward. That discomfort is the data point. Please sit with it for a moment."*

  **2. The Reactance Rebellion**
  *   **Prediction:** A student might say, "This is stupid, I'm not playing," or intentionally contribute 0 in Round 4 to spite you.
  *   **Why:** Shame often triggers anger/defensiveness rather than compliance.
  *   **Fix:** Validate it in the debrief. *"That reaction is exactly what shame often produces. It doesn't always correct behavior; sometimes it destroys the relationship with the rule-maker."*

  **3. Time Creep**
  *   **Prediction:** The debrief runs short because you spent too long explaining the math of the game.
  *   **Fix:** Keep the math dead simple. 10 credits. 5 to pot. If you spend more than 10 mins on setup, cut Round 4 and move straight to debrief.

  **4. The "Nice Instructor" Problem**
  *   **Prediction:** Because they know you, the Shame Frame won't land. They know you don't *actually* think they are bad people.
  *   **Fix:** Acknowledge this limitation. *"You know me, so the shame is simulated. Imagine this voice is your neighbor, your boss, or your parent. The sting comes from valuing their opinion."*

  ---

  ### The Honest Limitations (For Your Debrief Prep)

  You must explicitly tell the class what the game *failed* to capture, or they will leave with a simplified view.

  **1. The "Internalized Witness"**
  *   **Limitation:** In the game, shame was public (I said it in front of the table).
  *   **Reality:** Real shame is often private. You feel shame when *no one is watching* because you have internalized the audience. The game cannot reproduce the 3:00 AM feeling of shame.
  *   **Debrief Point:** "In the game, I was the police. In real life, *you* become the police. That is how shame becomes powerful—and dangerous."

  **2. Guilt vs. Fear**
  *   **Limitation:** In Round 2, students might have cooperated just to avoid being called out, not because they felt "guilty."
  *   **Reality:** Guilt is empathetic (I hurt someone). Fear is prudential (I will get caught). The game blurs these.
  *   **Debrief Point:** "Did you contribute in Round 2 because you felt bad, or because you wanted the candy? Guilt cultures rely on empathy. If we only follow rules to avoid scolding, that's not guilt, that's obedience."

  **3. The Choice Illusion**
  *   **Limitation:** The class voted on which culture to use.
  *   **Reality:** Cultures don't usually vote on their moral emotions. They drift into them based on history, religion, and social structure.
  *   **Debrief Point:** "We voted today. But in the real world, do we get to choose if we live in a shame-based workplace or a guilt-based legal system? Or are we born into it?"

  ### Instructor Safety Note
  **Crucial:** Because you are working with adult students at a community college, power dynamics are sensitive.
  *   **Opt-Out:** At the very start, tell students: *"If at any point the feedback feels too personal, you can tap your desk twice. You can step out of the round without penalty."*
  *   **De-escalation:** Immediately after Round 3 ends, break the frame. Smile. Change your tone. *"Okay, simulation over. I do not actually think anyone here is selfish. That was the script."* Do not wait until the end of class to do this.
