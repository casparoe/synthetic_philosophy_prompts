answer: |-
  Based on the verdicts you've recorded, you have intuitively constructed a hybrid theory. You have kept Tolstoy's core mechanism (emotional infection) and his demand for sincerity, but you have rejected his universality clause (the "simple laborer" test) and added a crucial filter regarding *purpose* that Tolstoy only touched on morally.

  Here is the principle that best captures your judgments, followed by an analysis of where it holds, where it strains, and what it predicts for your new cases.

  ### The Principle: Non-Instrumental Emotional Infection

  **Definition:** An object constitutes **art** when it successfully transmits a feeling from a creator to a receiver, provided that (1) the transmission is perceived as authentic, (2) the feeling is not subordinate to a practical or commercial function, and (3) the complexity of the feeling allows for contemplation rather than mere reflex. The **quality** of the art depends on the depth of the feeling and the moral worth of the emotion transmitted.

  Here is how your cases motivate each clause of this principle:

  **1. The Infection Clause (Feeling over Intellect)**
  *   **Motivated by:** *The Signed Shovel.*
  *   **Reasoning:** You felt curiosity and intellectual engagement, but "nothing" emotionally. Tolstoy agrees here: art is not a philosophical argument. If the primary transmission is conceptual rather than affective, it fails the basic threshold of art, regardless of its institutional framing.

  **2. The Authenticity Clause (Perceived Sincerity)**
  *   **Motivated by:** *The Virtuoso Forgery.*
  *   **Reasoning:** This is where you diverge from Tolstoy. Tolstoy would say the forgery is a lie and therefore not art. You say it *was* art while the deception held. This implies that the *receiver's experience of sincerity* matters more than the *maker's actual state of mind*. The art exists in the transaction, not just the origin. However, once the deception is known, the "perceived authenticity" collapses, which explains why we feel betrayed and re-evaluate the work.

  **3. The Non-Instrumental Clause (Art for Art's Sake)**
  *   **Motivated by:** *The Fast-Food Jingle and The Recruitment Poster.*
  *   **Reasoning:** This is your repair to Tolstoy. The jingle is sincere and infectious, but it is a tool to sell burgers. The poster is sincere and infectious, but it is a tool to win a war. You classify these as "not good art" or "bad art" because their emotional transmission is in service of an external outcome (commerce or recruitment).
  *   **The Schoolteacher Exception:** You worried that payment would demote the schoolteacher's watercolors. Under this principle, payment does not matter; *purpose* matters. If she painted to process grief (expression), it is art. If she painted them specifically to sell tickets to the memorial (commerce), they become instrumental. Your gut tells you her purpose was expression, so she survives this test.

  **4. The Complexity Clause (Depth over Universality)**
  *   **Motivated by:** *Late Beethoven vs. Your Father.*
  *   **Reasoning:** You explicitly reject Tolstoy's demand that art be comprehensible to the "simple laborer." Beethoven is great art even if your father feels nothing. This suggests that art requires a *capacity* for deep feeling, not *universal* access to it. The Jingle fails here not just because it is commercial, but because the feeling it transmits (a mood lift) is too simple to sustain contemplation, whereas Beethoven offers infinite depth, even if only to the trained listener.

  ### The Ad Hoc Friction Points

  You asked for honesty about which verdicts resist a simple principle. There are two tensions in your list that require ad hoc adjustments:

  1.  **The Jingle vs. The Poster:** You call the jingle "not good art" but the poster "bad art." Both are instrumental. The principle above groups them together as "instrumental transmission." To separate them, you must smuggle in a moral judgment that isn't fully explained by the "instrumental" clause. You likely view the poster as *bad* because the emotion it transmits (jingoistic fervor) is morally suspect, whereas the jingle is merely *trivial*. This requires a moral addendum: *Art that transmits harmful emotions is bad art; art that transmits trivial emotions is minor art.*
  2.  **The Forgery Timeline:** You say the forgery *was* art before exposure. This creates a paradox where the ontological status of the object changes based on information outside the object. A strict principle struggles here. You are essentially saying art is an *event* (the moment of viewing) rather than a *property* of the object. This is coherent, but it means "Art" is not a stable label you can put on a canvas, but a temporary state of relationship between viewer and object.

  ### Predictions for Your New Cases

  Here is what the **Principle of Non-Instrumental Emotional Infection** predicts for the two cases you haven't listed.

  **1. The AI-Generated Image**
  *   **The Case:** A photorealistic image produced by a program with no human behind it, which makes strangers cry.
  *   **The Prediction:** **It is Art (to the viewer), but it is a Hollow Art.**
  *   **Why:** Under the *Authenticity Clause*, your verdict on the forgery suggests that *perceived* human experience is what validates the transaction. If the viewers *know* it is AI, the "perceived authenticity" fails. There is no human "re-evoking a feeling" to connect with. It becomes like the shovel: an intellectual curiosity ("Look what the machine did") rather than an emotional communion.
  *   **However:** If the viewers *do not know* it is AI, your principle (based on the forgery verdict) dictates that it functions as art in that moment. The infection is real. But once the origin is revealed, the value collapses, perhaps even more severely than the forgery, because there was never a human deceiver to hold accountable—only a void. Your principle suggests we crave the *human* connection, not just the *effect*.

  **2. Your Brother's Canvases**
  *   **The Case:** Abstract canvases, six years of work, total sincerity, zero emotional impact on you.
  *   **The Prediction:** **They are Attempted Art that Failed (for you).**
  *   **Why:** Tolstoy would say flatly, "This is not art," because infection did not occur. Your principle is slightly more nuanced but lands in the same place.
      *   *Sincerity:* Pass (he worked for six years).
      *   *Non-Instrumental:* Pass (it's a solo show, not an ad).
      *   *Infection:* **Fail.**
  *   **The Verdict:** Because art is a *transaction* (as your forgiveness of the forgery suggests), the absence of the receiver's response means the circuit is open. It is not a "stunt" (like the shovel) because the intent was expressive, but it remains unrealized art *in your presence*.
  *   **The Hard Truth:** This principle validates your awkwardness. You are not failing to "get it"; the art failed to transmit. Tolstoy would tell you that your brother's sincerity is irrelevant if the infection didn't land. You don't have to call it a stunt, but you are under no obligation to call it successful art. It is a private language he hasn't yet translated.

  ### Summary

  You are not a snob; you are a **Humanist Transmission Theorist**. You believe art is a technology for connecting human interiorities.

  *   **Tolstoy was right** that feeling must be transmitted (Shovel fails).
  *   **Tolstoy was wrong** that everyone must understand it (Beethoven passes).
  *   **You added** that the connection cannot be bought or commanded (Jingle/Poster fail).
  *   **You discovered** that the belief in the human connection is the magic ingredient (Forgery passes temporarily; AI fails ultimately).

  Regarding your brother: If you adopt this principle, you can tell him, "I believe you were sincere, and I believe this is meant to be art, but the transmission didn't reach me. That doesn't make it a stunt, but it means the circuit isn't closed." That is the most honest, and perhaps the most loving, thing you can say.
