like used 'arthritis' for the thigh ailment too, his sentence would have been true.

  Here are the new cases I'm considering putting to her, and I'd like a prediction of her verdict on each, together with an account of what turns on it. (A) The self-styled coiner. A man lives alone on an island, cut off from any community. One day he starts calling the large pond beside his hut 'the ocean'; he is proud of having coined a word, regards himself as its only authority, and has no idea what anyone else means by 'ocean'. On a calm evening he writes in his diary, "the ocean is calm tonight". Is his sentence true (his word refers to the pond) or false (his word means what everyone else's 'ocean' means, and no ocean is in sight)? (B) Same belief? Before either planet's chemists had done their work, the 1750 duplicate on the twin planet thought to herself, "water is good to drink", inwardly just as her Earthling counterpart did. At that moment, did the two of them believe the same thing, or different things? (C) The astronomers' word. Imagine a community — this is a stipulation, not a real one — whose astronomers introduced the word 'tove' for a precise and rare celestial phenomenon. Over a century, the lay majority came to use 'tove' loosely for a broader, related spectacle; the astronomers and their textbooks still use it in the strict sense, the laypeople are unaware of any difference, and neither group thinks there is a dispute. One night a layman, watching a display that falls under the broad use but not the strict one, says "that was a tove". Is his sentence true or false?

