answer: |-
  Here is a Twin-Earth case built around the social kind **"Workplace Harassment."** It is designed to mirror Putnam's structure but exposes the friction points that make externalism much harder to defend for social kinds than for natural kinds.

  ### The Case: "Harassment" on Earth vs. Twin-Earth

  **The Setup:**
  *   **Earth:** The legal/social definition of "workplace harassment" is determined by an **Objective Hostile Environment Standard**. Behavior counts as harassment if a *reasonable person* would find it hostile, regardless of whether the victim complains or the perpetrator intended harm.
  *   **Twin-Earth:** The definition is determined by a **Subjective Intent Standard**. Behavior counts as harassment *only if* the perpetrator *intended* to cause distress AND the victim explicitly registered a complaint.
  *   **The Scenario:** Alice (Earth) and Twin-Alice (Twin-Earth) are intrinsic duplicates. Both work in offices where a colleague, Bob, makes frequent, ambiguous, mildly uncomfortable jokes. Bob does not intend harm (he thinks he's being friendly), and neither Alice has explicitly told Bob to stop yet.
  *   **The Utterance:** Both Alices feel uneasy. Both turn to a friend and say, *"I think Bob is harassing me."*

  **The Externalist Verdict:**
  *   On **Earth**, Alice's statement is **true** (the environment is objectively hostile).
  *   On **Twin-Earth**, Twin-Alice's statement is **false** (no intent, no complaint).
  *   **Conclusion:** Since the truth conditions differ despite identical internal states, the meaning of "harassment" is not in the head. It depends on the external social/legal facts.

  ---

  ### The Division of Linguistic Labor (Do Experts Exist?)

  For Putnam's argument to work, there must be a class of experts to whom the ordinary speaker defers regarding the extension of the term.

  *   **The Experts:** Employment Lawyers and HR Compliance Officers.
  *   **The Mechanism:** Ordinary employees (the "Alices") do not read the full employee handbook or the relevant case law (e.g., *Meritor Savings Bank v. Vinson*). They operate with a rough stereotype ("making someone uncomfortable is bad"). They implicitly defer to the HR/Legal department to settle boundary cases.
  *   **Why it mimics 'Elm' vs. 'Beech':** Just as I call a tree an "elm" assuming botanists could tell me if I'm wrong, Alice calls behavior "harassment" assuming HR/Lawyers could tell her if she meets the criteria.

  ---

  ### Where the Case Breaks (The Internalist Attack)

  This is the most important part for your class. Unlike "Water," where the microstructure (H2O) is physically hidden from Oscar, the "microstructure" of Harassment (the rules) is **socially accessible**. Here is where a Narrow Content defender will strike first:

  #### 1. The Accessibility Objection (The Strongest Attack)
  *   **The Argument:** Oscar cannot inspect water molecules; he *must* defer. But Alice *could* read the handbook. The rules constituting "harassment" are not hidden facts of nature; they are public conventions.
  *   **The Denial:** A narrow-content defender will deny that Alice is actually deferring. They will argue that Alice's concept of harassment is defined by her *understanding* of the rules (e.g., "making people uncomfortable"), not the actual legal extension.
  *   **Why it matters:** If the rules are accessible, the difference between Earth and Twin-Earth is a difference in *belief*, not just a difference in external fact. If Alice *believed* the Twin-Earth rule, she wouldn't have said "Bob is harassing me." Therefore, her internal state *does* determine the meaning.
  *   **Condition for Externalism to Hold:** You must argue that despite the rules being public, the *complexity* of the legal code makes effective deference necessary. (i.e., "It's in the handbook, but no human can memorize the handbook, so we still defer.")

  #### 2. The Normativity Objection
  *   **The Argument:** "Water" is descriptive; "Harassment" is thickly normative (it implies "wrongful").
  *   **The Denial:** If externalism is true, then on Earth, Bob is *actually* harassing Alice, even if the community thinks intent matters. But for social kinds, "what we take to be X" often *constitutes* X. If the Twin-Earth community collectively believes intent is required, then by definition, it *is* required. There is no "hidden fact" independent of collective intentionality (unlike H2O).
  *   **Why it matters:** Social kinds are often **mind-dependent**. Water exists without us; Harassment does not. If the meaning is fixed by collective agreement, and the collective agreement is in the heads of the society, then meaning is arguably still "in the head" (just a collective head, not an individual one).
  *   **Condition for Externalism to Hold:** You must distinguish between the *concept* of harassment (which is mind-dependent) and the *extension* fixed by specific institutional facts (which are external to the individual). You have to treat the Legal Code as an external object similar to a chemical structure.

  #### 3. The "Bug in the System" Problem
  *   **The Argument:** In Putnam's case, if Oscar thinks water is XYZ, Oscar is mistaken about the world. In the Harassment case, if the HR department rules that Bob's behavior *isn't* harassment (on Earth), but Alice insists it *is*, we often side with Alice's moral intuition over the expert's technical ruling.
  *   **The Denial:** We don't treat HR lawyers as the ultimate arbiters of "harassment" in the same way we treat chemists as arbiters of "water." We allow for moral error by the experts.
  *   **Why it matters:** If the speakers don't actually grant the experts **authority** to fix the reference, the Division of Linguistic Labor fails.
  *   **Condition for Externalism to Hold:** You must show that in this specific context, the institutional definition trumps the lay intuition (e.g., in a court of law, the lay intuition loses).

  ### Summary for the Board

  | Feature | Putnam's "Water" | This "Harassment" Case |
  | :--- | :--- | :--- |
  | **Kind Type** | Natural (Mind-Independent) | Social (Mind-Dependent) |
  | **Hidden Structure** | Microphysical (H2O) | Institutional/Legal (Case Law) |
  | **Accessibility** | Physically Impossible to see | Legally Possible to read (but complex) |
  | **Expert Authority** | High (Chemists know best) | Contested (Lawyers vs. Moral Intuition) |
  | **Externalist Security** | **High** | **Low/Contested** |

  ### Teaching Tip
  Ask your students: *"If the HR handbook on Earth changed tomorrow to match Twin-Earth's rules, would the meaning of Alice's past utterances change retroactively?"*
  *   **If Yes:** Externalism holds (meaning tracks the external fact).
  *   **If No:** Internalism holds (meaning tracked her understanding at the time).
  *   **Why this breaks the water analogy:** We intuitively feel that social rules changing doesn't rewrite history the way discovering a new chemical fact might. This intuition is the wedge for the Internalist.
