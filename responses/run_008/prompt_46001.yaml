answer: |-
  This is a classic critique of philosophy, often voiced by scientists (Stephen Hawking famously declared philosophy "dead") and journalists. Your irritation is well-founded; while the argument contains historical truths, it relies on several category errors and an idealized view of science.

  Here is a breakdown of where the journalist is on solid ground, where the argument slips, and why the comparison with science is more complicated than it appears.

  ### 1. What a Professional Philosopher Would Accept (The Defensible Parts)
  A professional philosopher would likely concede three main points in this account:

  *   **The Persistence of Questions:** It is true that we still read Plato and Descartes. In physics, you do not need to read Newton to do modern physics; in philosophy, you often must read Kant to understand current ethics. The *questions* (What is justice? Do we have free will? What is consciousness?) remain recognizable in a way that "What is the composition of the stars?" does not.
  *   **The "Mother of Sciences" Phenomenon:** It is historically accurate that many fields began as "natural philosophy." Physics, psychology, economics, and linguistics all spun off from philosophy once they developed empirical methods or formal systems. When a philosophical question becomes empirically testable, it usually becomes science.
  *   **Argument as a Skill:** The author is right that philosophy trains people to argue, analyze concepts, and spot inconsistencies. Even if one rejects the idea that philosophy discovers "facts," few deny its value as a gymnasium for the intellect.

  ### 2. Where the Argument Slides (The Category Errors)
  Your intuition that the author is sliding between different claims is correct. The argument conflates **consensus**, **progress**, and **finality**.

  *   **Disagreement $\neq$ Lack of Progress:** The author argues that because philosophers still disagree, they haven't moved forward. But progress isn't just about agreement; it's about the *quality* of the disagreement.
      *   *Example:* We are still arguing about "free will," but we are no longer arguing in the terms of 1650. We now incorporate neuroscience, quantum mechanics, and sophisticated logic. We have ruled out many bad answers. Showing that a specific path is a dead end *is* progress, even if you haven't found the exit yet.
  *   **Settlement $\neq$ Discovery:** The author assumes that for philosophy to "find things out," it must produce a settled fact like $E=mc^2$. But philosophy often "finds out" that a question was poorly framed.
      *   *Example:* For centuries, philosophers asked, "How does the soul interact with the body?" Modern philosophy of mind largely recognizes this as a category error. Dissolving the question is a discovery, even if it doesn't look like a textbook fact.
  *   **The "Textbook" Illusion:** The author claims science turns disputes into textbooks. This is true for *taught* science, but not for *practiced* science. At the frontiers of physics (e.g., string theory, dark energy, interpretations of quantum mechanics), there is massive disagreement and no "settled" answer. Science looks cumulative in hindsight, but it looks messy in real time.

  ### 3. The "Hand-Off" Argument: Failure or Success?
  The author claims that when philosophy produces results (like logic or scientific method), they cease to be philosophy, proving philosophy fails to produce answers.

  A philosopher would argue this cuts **against** the author's conclusion.

  *   **The Incubator Model:** Philosophy is often the Research & Development department of human thought. It deals with questions that are not yet ready for empirical testing. Once a question *can* be tested empirically or formalized mathematically, it naturally migrates to science or math.
  *   **The Scaffolding Analogy:** Saying philosophy fails because its successes become sciences is like saying scaffolding is a failure because it is removed once the building is finished. The building (science) could not stand without the scaffolding (philosophical conceptualization).
  *   **Conceptual Engineering:** Before you can measure something, you must define what it *is*. Philosophy does the work of defining "causation," "evidence," or "computation." Once defined, scientists measure them. The fact that the definition phase is distinct from the measurement phase doesn't mean the definition phase was useless.

  ### 4. Is the Comparison with Science Fair?
  The journalist's comparison relies on a flattering, somewhat naive view of science.

  *   **Science Rests on Philosophy:** Science cannot prove its own assumptions. It assumes the external world exists, that our senses are generally reliable, and that the future will resemble the past (the Problem of Induction). These are *philosophical* claims. Science operates *within* a philosophical framework; it does not replace it.
  *   **Different Games:** Science is largely descriptive (how *does* the universe work?). Philosophy is often normative or conceptual (how *should* we act? what do we *mean* by "work"?).
      *   If you ask a scientist, "Is killing innocent people wrong?" they can tell you the biological effects of death, but they cannot derive the "wrongness" from a test tube. That is a philosophical question. The fact that science doesn't answer it doesn't mean the question is invalid; it means it's a different kind of inquiry.
  *   **The "Mind-Body" Example:** The author claims the mind-body debate is just Descartes with more footnotes. This is false. Descartes thought the mind was a non-physical substance. Today, almost no philosopher believes that. The debate has shifted to physicalism, functionalism, and panpsychalism, heavily informed by cognitive science. The *label* is the same; the *substance* has radically changed.

  ### Summary: Why You Were Irritated
  You were irritated because the author is judging philosophy by the standards of science.

  *   **Science** aims for **prediction and control**. Its metric of success is: "Can we build the bridge/make the pill?"
  *   **Philosophy** aims for **clarity and justification**. Its metric of success is: "Do we understand what we are saying? Are our values consistent?"

  If you judge a fish by its ability to climb a tree, it will always fail. The journalist is judging philosophy by its ability to produce empirical textbooks. When viewed as a practice of **conceptual clarification**—mapping the logical space in which science, law, and ethics operate—the claim that it "never gets anywhere" looks much weaker. It doesn't build the house; it draws the blueprint. The blueprint isn't the house, but you shouldn't build without one.
