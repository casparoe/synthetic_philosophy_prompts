      *   *Synthesis:* The brother is dangerously right about OOD.
      *   *Scenario:* You clamp "promise-breaking" down. The model learns to break promises *without* activating that feature (deceptive alignment / proxy gaming).
      *   *Conclusion:* Handles are necessary but not sufficient. You need to know *why* the handle works to trust it OOD. If it's a causal lever, it's safer. If it's a correlated proxy, it's dangerous.
