answer: |-
  **Section 1: The Nearest Established Concepts**
  Margaret Gilbert's concept of "Joint Commitment" is the nearest philosophical fit. She argues that when two people constitute a "plural subject," they create obligations without explicit promises. This explains the "owed" feeling: you are bound by the commitment to act as a single body. Michael Bratman's "Shared Intention" also applies, focusing on meshing sub-plans and mutual responsiveness. For Gilbert, the wardrobe carriers form a plural subject; the commitment arises from their mutual willingness to act together. The van tidying illustrates the gradual formation of this commitment as intentions align over time. The gate scenario lacks this plural subjectivity; it is merely coincidental reliance, so no obligation exists. Both concepts capture the "pair-owned" nature, distinguishing it from individual actions simply summed together. The normative force—the right to rebuke—is central to Gilbert's view, matching your intuition that something was owed despite no signed contract. The "we" that carries the wardrobe is a real social entity, not just a figure of speech. This normative glue binds the pair tighter than mere convenience.

  **Section 2: Where the Cases Break Away**
  However, your cases strain these theories. Gilbert typically requires "common knowledge" of readiness to commit, often implying a clearer moment of agreement than your "fuzzy" van tidying allows. You describe a pre-reflective, embodied adjustment, whereas philosophical accounts often over-intellectualize the mental states involved. The removalists feel the obligation arises from the physical coupling itself, not a mental agreement. Bratman's account explains the coordination but struggles with the normative sting; it explains why you stumble, not why you feel betrayed. Furthermore, standard joint action theories don't fully explain why *this* reliance (wardrobe) generates entitlement while *that* reliance (gate) does not, beyond saying one is "joint." They describe the structure but miss the phenomenological shift where reliance hardens into obligation without a contract. The "nothing was said" element challenges the idea of commitment as a distinct social act. The continuous physical adjustment suggests the commitment is in the muscles, not the mind. The gate scenario involves reliance, but the actions remain individually owned; the wardrobe involves a fusion of agency that standard accounts treat too cognitively. The fuzzy edge suggests the commitment emerges from the friction of the work, not a meeting of minds.

  **Section 3: Verdict and Definition**
  Verdict: Gilbert's "Joint Commitment" does cover this, provided we understand the commitment as constituted by the action itself, not prior words. The dividing line is not verbal agreement, but whether the action is *constitutively joint*. In the gate scenario, your actions are independent but compatible; at the wardrobe, your action is literally incomplete without the other. The obligation arises because you have allowed yourself to be vulnerable to the other's will in a way that defines the activity. The "fuzzy" onset is simply the moment the activity shifts from parallel to constitutively joint. The rebuke is valid because the defector unilaterally dissolves the plural subject you were inhabiting. It is not a contract breach, but a collapse of the shared agency you both sustained. The entitlement exists because the joint action creates a new normative reality where individual withdrawal is a violation of the shared body. The line is drawn where reliance becomes identity: when "I am carrying" becomes false, and only "we are carrying" is true. This is the plain-words definition of the divide: does the action cease to exist if one withdraws? If yes, entitlement exists.

  **Section 4: Boundary Cases**
  Test Case 1 (Inside): Two musicians improvising a duet. If one stops playing mid-phrase without signal, the other feels betrayed. The music is constitutively joint; the sound belongs to the pair, and silence breaks the shared identity.
  Test Case 2 (Outside): Two people walking through a door held open. If the holder lets go early, the walker is inconvenienced, but not betrayed. The action remains individually owned, merely assisted. The reliance is situational, not constitutive of a shared act.
