      *   *Rebuttal:* But promotion is a holistic judgement. A member might think research is good but not *enough* to outweigh teaching concerns, or vice versa. We cannot assume the intersection. The final vote captures the integrated judgement.
      *   *Britishisms:* "Whilst," "programme," "favour," "centre," "minuted," "Chair."

