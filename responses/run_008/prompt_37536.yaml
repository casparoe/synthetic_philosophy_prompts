answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Board
  **FROM:** Appointments Committee
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation Regarding Promotion of [Candidate Name]

  **1. Recommendation**

  The Appointments Committee respectfully recommends that [Candidate Name] **not be promoted** to the rank of [Rank, e.g., Associate Professor] at this time.

  **2. Context and Deliberation**

  The Committee met on [Date] to consider [Candidate Name]'s case. Our statutes dictate that a candidate is eligible for promotion only if the Panel judges that both their research record is excellent *and* their teaching contribution merits promotion. This requires a holistic assessment of the candidate's total profile against these two mandatory criteria.

  During our deliberations, the Committee engaged in a rigorous examination of the evidence. We sought to determine whether a consensus existed that the candidate satisfied the statutory requirements in their entirety.

  **3. Voting Record and Analysis**

  To ensure clarity in our judgement, the Committee conducted votes on the individual criteria before moving to a final determination on the promotion motion itself.

  *   **Research Criterion:** Four members voted that the research record was excellent; three dissented.
  *   **Teaching Criterion:** Four members voted that the teaching contribution merited promotion; three dissented.
  *   **Final Motion on Promotion:** Three members voted in favour; four voted against.

  It is important to note that the membership supporting the research criterion was not identical to the membership supporting the teaching criterion. While a majority of the Committee found merit in each area individually, only a minority (three members) were prepared to affirm that *both* criteria were satisfied simultaneously. Consequently, when asked to cast a binding vote on the promotion motion itself—which requires satisfaction of both conditions—a majority of the Committee (four members) voted against the motion.

  **4. Reasoning for the Recommendation**

  The Committee's recommendation rests on the principle of individual accountability and the specific wording of our statutes. The statute requires that the Panel judge the conjunction of the two criteria. In practical terms, this means each member must be satisfied that the candidate meets the standard on *both* counts to cast a vote in favour of promotion.

  While majorities existed for the separate premises, the final vote reflects the integrated judgement of the Committee members. Those who voted against the final motion did so because, in their professional judgement, the candidate's strengths in one area did not sufficiently compensate for deficiencies in the other, or because they remained unconvinced on one of the two requisite standards. To override the direct vote on the promotion motion would be to disregard the expressed will of the majority of the Committee regarding the final outcome for which we are collectively accountable.

  The final vote is the procedural mechanism designed to capture this holistic assessment. As four out of seven members could not endorse the promotion motion, the necessary majority for a positive recommendation was not achieved.

  **5. Consideration of Alternative View**

  The Committee gave serious consideration to an alternative interpretation of the voting data, which warrants mention to ensure the Board understands the nuance of this decision.

  It was argued during deliberations that the votes on the individual criteria should carry greater weight than the final binary vote. Under this view, since a majority of the Committee affirmed the excellence of the research, and a (different) majority affirmed the merit of the teaching, the collective will of the Panel should be interpreted as supportive of promotion. Proponents of this view suggested that the final vote was an artefact of how the question was framed, rather than a true reflection of the Committee's assessment of the candidate's qualities. This perspective holds that the 'reasons' for a decision (the criteria) are more fundamental than the 'conclusion' (the promotion itself), and that aggregating the reasons provides a more accurate picture of the Panel's judgement.

  However, the majority of the Committee concluded that this approach carries significant procedural risk. It would require the Chair to construct a outcome that no single majority of members actually endorsed in the final instance. It effectively asks members to accept a conclusion they explicitly rejected on the ballot, based on the assumption that their premises align with others in a way they did not themselves validate. Given that promotion decisions carry significant weight for the individual and the institution, the Committee determined that the direct vote on the motion must prevail. We must be able to stand behind the specific decision recorded, not merely the component parts of the discussion.

  **6. Conclusion**

  [Candidate Name] is a valued colleague with clear strengths in both research and teaching. However, the Appointments Committee operates under a strict statutory threshold that requires a majority consensus on the combined case. As this threshold was not met in the final vote, we cannot recommend promotion at this stage.

  We suggest that [Candidate Name] be encouraged to re-apply in the next cycle, with specific feedback provided regarding the areas where the Committee felt the evidence was not yet sufficient to secure a majority consensus on both criteria simultaneously.

  **Signed,**

  [Your Name]
  On behalf of the Appointments Committee
