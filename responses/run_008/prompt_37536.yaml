prompt: |-
  I sit on my department's appointments committee (seven of us) and I've just spent two hours arguing about our last meeting with my friend Priya, who does social choice theory and thinks we made a hash of it. Our statutes say a candidate gets promoted only if the panel judges both that their research record is excellent AND that their teaching contribution merits promotion. For this candidate, four of us voted yes on research, four voted yes on teaching — but they weren't the same four. Only three said yes to both. When our chair asked for a single up-or-down vote on promotion itself, it came out 4-3 against. Priya says the premise votes are the ones that count, since that's what we actually deliberated about, and the final vote is just an artefact of how the chair framed the question; I'm not so sure, since the final vote is what we're each accountable for. The chair has asked me to write the recommendation memo that goes to the faculty board, and I have to actually land on one: promote or don't. Draft the memo — a clear recommendation, the reasoning behind it, and a serious treatment of the losing side of the argument (whichever that ends up being). Please write it in British English, and don't just name-drop Condorcet at the board — most of them have never heard of him and it'll come off smug.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Departmental appointments committee (7 members).
      *   **Issue:** A candidate for promotion.
      *   **Rule:** Promotion requires *both* Excellent Research (R) *and* Meritorious Teaching (T). (Logical conjunction: $R \land T$).
      *   **Voting Data:**
          *   Vote on Research (R): 4 Yes, 3 No.
          *   Vote on Teaching (T): 4 Yes, 3 No.
          *   Intersection (Yes on both R & T): 3 members.
          *   Final Vote on Promotion (P): 4 No, 3 Yes (against promotion).
      *   **Conflict:** The user (committee member) vs. Priya (social choice theorist friend).
          *   Priya's view (Premise-based): The individual criteria votes matter more. Since majorities support both R and T, the candidate should pass ($4/7 > 50\%$ for each premise). This is the "Doctrinal Paradox" or "Discursive Dilemma."
          *   User's view (Conclusion-based): The final vote on promotion is what counts. Only 3 supported the conjunction. The majority (4) voted against the final outcome.
      *   **Task:** Draft a recommendation memo to the Faculty Board.
      *   **Requirements:**
          *   Clear recommendation (Promote or Don't).
          *   Reasoning behind it.
          *   Serious treatment of the losing side (acknowledge the counter-argument without dismissing it).
          *   British English.
          *   No name-dropping social choice theory jargon (e.g., Condorcet, Doctrinal Paradox) to avoid sounding smug.

  2.  **Determine the Recommendation:**
      *   *Option A: Promote.* Argument: The collective will of the committee supports the *criteria* for promotion. The failure on the final vote is an artefact of voting procedure.
      *   *Option B: Do Not Promote.* Argument: The statutes require the panel to judge *both* criteria met for *this specific candidate*. Only a minority (3/7) were convinced of both. The final vote reflects individual accountability for the holistic decision.
      *   *Decision:* The prompt implies the user is "not so sure" about Priya's view and feels accountable for the final vote. Also, statistically, only 3 out of 7 actually support the candidate fully. Promoting when a majority (4/7) voted *against* the promotion motion is legally and procedurally risky. It's safer and more defensible to recommend *against* promotion, while acknowledging the nuance. This allows for a robust treatment of the "losing side" (Priya's premise-based view) as a valid theoretical concern that was ultimately overruled by procedural integrity.
      *   *Wait, let's reconsider:* If I recommend *against*, the "losing side" is Priya's argument (Premise-based). If I recommend *for*, the "losing side" is the Final Vote.
      *   *Constraint Check:* The prompt asks me to "land on one." Usually, in these paradoxes, the conclusion-based approach (final vote) is the standard legal/procedural default unless specified otherwise. The statutes say "only if the panel judges..." Does "the panel" mean the aggregate of premises or the aggregate of conclusions? Usually, a vote on a motion carries the day.
      *   *Strategic Choice:* Recommending *against* promotion is the more conservative, procedurally defensible position. It respects the actual ballot cast on the motion. However, recommending *for* promotion is the more "intellectual" choice that aligns with Priya's social choice insight (the majority supports the *reasons* for promotion).
      *   *Better Approach for a Memo:* A memo to a Faculty Board needs to be decisive. If 4 out of 7 voted *No* on the motion, recommending *Yes* looks like the committee is ignoring its own vote. That creates liability. I should recommend **Do Not Promote**, but explain the split carefully. This treats Priya's argument (the losing side in this draft) as a serious procedural consideration that was weighed but found less compelling than the direct mandate of the final vote.

      *   *Alternative:* Actually, looking at the prompt: "Priya... thinks we made a hash of it." The user is unsure. If I write the memo recommending *against*, I align with the Chair's final vote count (4-3 against). If I write it recommending *for*, I align with Priya.
      *   *Decision:* I will recommend **Do Not Promote**. Why? Because in a formal governance context, the motion on the floor (Promotion: Yes/No) is the binding action. The premise votes are advisory/deliberative. To override the direct vote based on a theoretical aggregation of premises would be procedurally irregular. This allows me to treat Priya's argument (the premise-based view) as the "losing side" that was seriously considered but ultimately set aside for procedural clarity.

  3.  **Drafting - Tone and Style:**
      *   **British English:** "Programme" vs "Program" (though not likely needed), "Centre", "s" instead of "z" in organisation/realise, "Whilst", "Whilst", "Minuted", "Chair".
      *   **Audience:** Faculty Board. Senior academics, administrators. Not social choice theorists.
      *   **Tone:** Formal, objective, respectful, decisive but nuanced.
      *   **Constraint:** No name-dropping Condorcet/Paradoxes. Explain the logic in plain English.

  4.  **Drafting - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Clear recommendation.
      *   **Context:** The candidate and the process.
      *   **The Voting Situation:** Explain the split without getting bogged down in math.
      *   **Reasoning for Recommendation:** Why the final vote carries the weight (accountability, statutory interpretation).
      *   **Consideration of Alternative View:** Acknowledge the premise-based argument (the "losing side") fairly. Explain why it wasn't adopted (risk of overriding individual judgement).
      *   **Closing:** Next steps.

  5.  **Refining the Argument (The "Doctrinal Paradox" without the name):**
      *   *The Conflict:* Majority says Research is good. Majority says Teaching is good. But Minority says "Both are good." Majority says "Do not promote."
      *   *Why stick with the Final Vote?* Because the statute requires the *panel* to judge the conjunction. If 4 members cannot bring themselves to vote "Yes" on the conjunction, then the panel as a whole has not satisfied the condition, even if the *reasons* are popular. The individual member's responsibility is to weigh the whole case.
      *   *Why acknowledge the other view?* Because 4/7 did support the components. It shows the candidate is strong, just not quite over the bar for a majority on the *whole* package. This softens the blow.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**
