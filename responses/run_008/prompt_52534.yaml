  9.  (Drafting the response based on these thoughts...) *Ensure the distinction between "ontological identity" and "institutional identity" is clear.* *Make sure to mention the Nara Document as the pivot point.* *Emphasize that "Authenticity" is the proxy for "Identity".*

  10. *Final check against prompt:* "Flag explicitly wherever you think the practice is internally inconsistent." -> I need to be bold about Venice vs. Warsaw. "Anchor each general point to one of the cases." -> Ensure Warsaw, Ise, Notre-Dame, and Listed Buildings are cited in each section where relevant.

