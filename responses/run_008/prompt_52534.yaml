answer: |-
  This is a profound intersection of analytic metaphysics and normative institutional practice. The heritage sector operates with a "folk metaphysics" that is often more sophisticated than it appears, yet it harbors genuine contradictions when pressed against rigorous ontological scrutiny.

  Here is a rigorous reconstruction of the metaphysical commitments of international heritage practice.

  ### 1. Reconstructing the Implicit Theory: Sortal-Sensitive Conventionalism

  The practice does not presuppose a single, monolithic theory of persistence (such as strict Mereological Essentialism or pure Spatiotemporal Continuity). Instead, it operates on a **Sortal-Sensitive Conventionalism** mediated by the concept of *Authenticity*.

  In metaphysics, a "sortal" is a concept that supplies a principle of individuation (e.g., "statue" vs. "lump of clay"). Heritage practice implicitly shifts sortals depending on the cultural context, without always admitting it.

  *   **The Venice Charter Wing (Material Continuity):** For most Western monuments (e.g., the Colosseum), the sortal is *Historical Document*. Here, identity supervenes on **material overlap and spatiotemporal continuity**. If you replace the stones, you destroy the evidence. This is why the Charter demands repairs be distinguishable; it presupposes that the *original matter* carries the historical truth.
  *   **The Warsaw Wing (Form/Intention Continuity):** Warsaw's Old Town was inscribed as the "Historic Centre," not a replica. Here, the sortal shifts to *Urban Entity* or *National Symbol*. Identity supervenes on **design, layout, and social intention**. The metaphysical commitment here is that the *pattern* of the city is more essential to its identity than the *bricks*. This contradicts the Venice Charter's ban on conjectural reconstruction, as Warsaw was rebuilt largely from Bellotto's paintings (visual records) rather than surviving fabric.
  *   **The Ise Wing (Process/Tradition Continuity):** The Ise Grand Shrine is the strongest challenge to Western metaphysics. It is not treated as a *Type* (of which new *Tokens* are made) but as the *same Token* persisting through material replacement. The implicit theory is **Process Identity**. The building is not a static object but a ritual event that recurs every 20 years. The identity lies in the *continuity of the craft and the ritual*, not the timber.
  *   **The Listed Building Wing (Legal/Functional Continuity):** Ordinary heritage law absorbs the Ship of Theseus by treating the building as a **Legal Person**. Just as a corporation remains the same entity despite total turnover of staff and assets, a listed building retains identity through administrative continuity and functional use.

  **Inconsistency Flag:** There is a genuine internal inconsistency between the **Venice Charter** and the **Warsaw inscription**. Venice forbids conjectural reconstruction and prioritizes original fabric. Warsaw was a conjectural reconstruction with minimal original fabric. The practice resolves this not metaphysically, but politically: Warsaw was an exception justified by "special circumstances" (war destruction). The system tolerates the contradiction because the *value* (restoring national dignity) outweighed the *metaphysical purity* (material authenticity).

  ### 2. Strict Presupposition vs. Good Fit (Underdetermination)

  We must distinguish what the practice *requires* to function from what is merely *compatible* with it.

  **Strict Presuppositions:**
  1.  **Rejection of Mereological Essentialism:** The practice *must* reject the view that every original part is essential. If it accepted this, the "Listed Building" category would vanish the moment a single roof tile was replaced. The practice presupposes that identity is **robust to gradual material replacement**.
  2.  **Spatiotemporal Continuity (mostly):** Even Warsaw and Ise maintain a link to the original location (or an immediately adjacent one, in Ise's case). A rebuilt Warsaw in Chicago would not be inscribed. The practice presupposes that **location is a necessary condition** for identity, even if matter is not.

  **Underdetermination (Where Metaphysicians Disagree but Practice Shrugs):**
  *   **Endurantism vs. Perdurantism:** An endurantist (the building is wholly present at each time) and a perdurantist (the building is a spacetime worm with temporal parts) can both accept the Notre-Dame reconstruction. The endurantist says the *substance* survived the fire via the walls; the perdurantist says the 2024 temporal part is causally connected to the 2018 temporal part. The heritage law does not care which is true; it only requires the **causal link**.
  *   **Best-Candidate Theory:** Consider Palmyra (destroyed by ISIS). If rebuilt, is it the same? A "Best-Candidate" theorist says yes, if it's the closest continuer of the original history. A strict materialist says no. UNESCO's current hesitation suggests the practice is **underdetermined** here. They haven't decided if a 3D-printed reconstruction of the Arch of Triumph counts. Both metaphysical views can currently operate within the ambiguity of the Nara Document.
  *   **Conventionalism:** A thoroughgoing conventionalist says "It is the same building because UNESCO says so." A realist says "UNESCO recognizes the metaphysical fact." In practice, the outcome is identical. The inscription of Warsaw is compatible with both, provided the institution has the authority to stipulate.

  **Anchor Case:** **Ise Grand Shrine.** A materialist metaphysician must call the current shrine a "replica of the 1300-year-old shrine." A process metaphysician calls it "the 1300-year-old shrine." UNESCO accepts the latter description for the World Heritage List. This proves the practice is underdetermined by material metaphysics; it privileges the *insider's ontological commitment* over the *observer's material analysis*.

  ### 3. Does the Practice Need Identity Theory? (Authenticity vs. Identity)

  It is highly plausible that "Authenticity" in heritage discourse is **not tracking numerical identity over time**, but rather **Value Continuity**.

  *   **Evidential Value:** The Venice Charter's focus on fabric is about *evidence*. Original stone tells us about 12th-century quarrying. New stone does not. This is an epistemic claim, not an ontological one.
  *   **Witness Value:** Warsaw has "witness value" regarding the resilience of the Polish people. The new bricks witness the post-war effort.
  *   **Transmission of Skill:** Ise's authenticity lies in the transmission of technique.

  **The Mistake Thesis:** Framing this as the Ship of Theseus is partly a seminar-room import. Conservationists are rarely asking, "Is this numerically identical to the object that existed at t1?" They are asking, "Does this object command the same respect, protection, and emotional resonance?"

  **However, the Practice Cannot Avoid Identity Claims:**
  Despite the focus on value, the legal and inscriptional language commits to identity.
  1.  **Legal Protection:** You cannot list a "replica" under the same protections as a "monument" in many jurisdictions. The law requires the object to *be* the heritage asset.
  2.  **The Plaque Test:** At Ise, the signage claims the shrine was founded in the 7th century. If it were merely a replica, accurate labeling would require "Rebuilt 2024, Original Founded 7th Century." The refusal to use "Replica" for Warsaw or Ise is an explicit **identity claim**.
  3.  **Notre-Dame:** The fundraising campaign was "Save Notre-Dame," not "Build a New Cathedral." The public donation relied on the premise that the *same* entity was being rescued.

  **Conclusion:** While *Authenticity* tracks value, *Inscription* tracks identity. The practice needs identity theory to justify the legal transfer of status from the pre-destruction object to the post-reconstruction object. Without identity, the legal listing would lapse upon destruction.

  ### 4. Consequences of Explicit Theory Replacement

  If heritage law moved from its current implicit pragmatism to an explicit metaphysical stance, the consequences would be radical.

  **Scenario A: Adopting a "Best-Candidate" or Replica-Friendly View**
  If UNESCO explicitly adopted a theory where a high-fidelity replica counts as the continuation of the original (provided there is causal intent):
  *   **Palmyra:** A rebuilt Palmyra would be inscribable. The "Best-Candidate" view allows that if the original is destroyed, the most faithful reconstruction *becomes* the heir to the identity.
  *   **The Floodgates Risk:** This threatens to legitimize "Disneyfication." A fabricated "Medieval Quarter" in a new city could claim identity if the *intention* was to continue the tradition of medieval living.
  *   **Drawing the Line:** The line would have to be drawn at **Causal Connection**. A "Medieval Quarter" built today lacks the causal chain of tradition linking it to the actual Middle Ages. Palmyra has the causal chain (the site, the memory, the specific destruction event).
  *   **Impact:** This would democratize heritage (allowing post-colonial nations to rebuild looted sites) but dilute the "aura" of the original.

  **Scenario B: Adopting Outright Conventionalism**
  If the doctrine admitted: "Identity is whatever the World Heritage Committee designates."
  *   **Loss of Normative Force:** If identity is purely stipulative, an inscription decision cannot be a *mistake*, only a *policy choice*. If UNESCO inscribed a concrete fake as "Ancient Rome," critics could not say "That is false," only "That is unpopular."
  *   **The Claim to Truth:** Heritage practice relies on a claim to truth ("This *is* where the treaty was signed"). Conventionalism reduces this to power ("We *say* this is where...").
  *   **Impact:** This would undermine the moral authority of heritage. The protection of sites often relies on the idea that they possess intrinsic value due to their history. If history is merely designated, the moral imperative to protect weakens.

  **Internal Inconsistency Flag:** Currently, the practice tries to have it both ways. It uses **Conventionalism** to inscribe Warsaw (overriding material lack) but uses **Realism** to reject fake antiquities (e.g., the Piltdown Man of architecture). If it adopted explicit Conventionalism, it would lose the ability to condemn a well-made forgery if the Committee voted to inscribe it. If it adopted explicit Realism (Materialism), it would have to delist Ise and Warsaw.

  ### Summary Assessment

  The heritage apparatus presupposes a **Cluster Concept of Identity** where different weights are assigned to Material, Form, Location, and Tradition depending on the cultural sortal involved.
  *   **Western Stone Monuments:** Material + Location > Form.
  *   **Eastern Timber/Tradition:** Tradition + Form > Material.
  *   **Urban Ensembles:** Form + Social Function > Material.

  The practice is **internally inconsistent** regarding the Venice Charter's ban on reconstruction vs. the Warsaw inscription, but this inconsistency is functionally necessary to accommodate diverse cultural metaphysics (as acknowledged by the Nara Document).

  To make the practice philosophically robust without breaking it, one should explicitly adopt **Sortal-Relative Identity**: acknowledge that a "Cathedral" persists through different conditions than a "Shrine," and that "Authenticity" is the measure of how well the object fulfills the identity conditions of its specific sortal, not a universal metaphysical standard. This licenses Warsaw (sortal: National Symbol) and Ise (sortal: Ritual Process) without forcing them into the metaphysical box of the Colosseum (sortal: Historical Document).
