      *   *Notre-Dame:* Fire, rebuild with new oak. Treated as same cathedral. Suggests *Functional/Structural Continuity* despite material loss.
      *   *Listed Buildings:* Gradual replacement (Ship of Theseus). Legal identity persists. Suggests *Conventionalism* or *Four-Dimensionalism* (temporal parts).

  3.  **Drafting Section 1: Reconstructing the Implicit Theory:**
      *   *Hypothesis A: Equivocation.* The practice uses "identity" in two senses: Material/Historical vs. Functional/Cultural.
      *   *Hypothesis B: Cluster Concept.* Authenticity is a bundle of attributes (Nara Document). Identity is satisfied if enough cluster members are present.
      *   *Hypothesis C: Spatiotemporal Continuity (with loose material constraints).* As long as there is *some* connection (foundations, location, intention), material can vary.
      *   *Analysis:* The Venice Charter leans toward Material Overlap. Warsaw/Ise lean toward Form/Function/Tradition.
      *   *Verdict:* It's not a single consistent metaphysics. It's a *pragmatic pluralism* that looks like equivocation but functions as a *context-sensitive conventionalism*. However, to make it philosophically robust, we might model it as *Sortal-Relative Identity*. A building *qua* physical artifact requires material; a building *qua* cultural symbol requires continuity of form/function.
      *   *Refinement:* The "Same Building" predicate shifts sortals. Warsaw is the same *Urban Entity*. Ise is the same *Ritual Locus*. Venice-protected ruins are the same *Historical Document*.
