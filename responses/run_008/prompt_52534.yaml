      *   *Compatible Theories:*
          *   *Endurantism with Material Constitution:* The building is constituted by matter but not identical to it. (Fits Notre-Dame).
          *   *Perdurantism (Worm Theory):* The building is a spacetime worm. The post-fire segment is a later temporal part. (Fits all, but counter-intuitive to laypeople).
          *   *Best Candidate:* Among candidates (ruin vs. rebuild), the rebuild is the "best" continuation of the history. (Fits Warsaw).
          *   *Conventionalism:* It's whatever UNESCO says. (Fits the legal reality).
      *   *Underdetermination:* A metaphysician who believes in strict material identity and one who believes in psychological/social continuity would both accept the Warsaw inscription *if* they defer to the institutional authority. But if asked *why*, they diverge. The practice doesn't care *why*, only *that*.
      *   *Specific Anchor:* The Ise Shrine. A materialist must call it a replica. A traditionalist calls it the same. UNESCO accepts the traditionalist view. This shows the practice is underdetermined by material metaphysics.

  5.  **Drafting Section 3: Does it need Identity Theory? (Authenticity vs. Identity):**
      *   *The "Mistake" Thesis:* Heritage discourse talks about *Authenticity*, not *Identity*. Authenticity is about value (evidential, aesthetic, spiritual), not metaphysical persistence.
      *   *Counter-Argument:* The plaque says "Founded 690 AD" (Ise). This is an identity claim. If it were a replica, it would say "Reconstructed 2024, original founded 690 AD." The refusal to use "Replica" for Warsaw implies an identity claim.
      *   *Nuance:* "Authenticity" does the work of "Identity" without the metaphysical baggage. It tracks *value continuity*.
      *   *Ship of Theseus:* It is imported, but relevant because the law treats the listed building as one legal person.
      *   *Conclusion:* The practice *avoids* explicit identity theory but *commits* to identity claims when it serves preservation goals (funding, protection status). It's strategic metaphysics.

  6.  **Drafting Section 4: Consequences of Explicit Theory Change:**
      *   *Scenario A: Best-Candidate/Replica-Friendly.* If we admit Warsaw is a "best candidate" rather than "strictly identical," does it open the floodgates?
