      *   *Check Constraints:* Did I anchor to cases? (Warsaw, Ise, Notre-Dame, Listed). Did I flag inconsistencies? (Venice vs. Warsaw).
      *   *Self-Correction on Ise:* Be careful not to say Ise is a "Type." The practitioners insist it is the *same* token, just renewed. This challenges standard Type/Token distinctions. It's closer to "Process Identity."
