      *   **Requirements:**
          1.  Reconstruct implicit theory/theories (single vs. equivocal).
          2.  Distinguish strict presupposition from good fit (underdetermination).
          3.  Assess if identity theory is needed at all (authenticity vs. identity).
          4.  Assess consequences of changing the explicit theory (replacement/conventionalism).
