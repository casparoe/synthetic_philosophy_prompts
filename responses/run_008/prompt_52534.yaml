          *   *Safeguard:* The "Candidate" status requires a causal link to the original intention/history. A new "medieval" quarter lacks the causal link. Palmyra (destroyed by ISIS) could be rebuilt if the *intention* is continuity, not fabrication.
      *   *Scenario B: Outright Conventionalism.* If UNESCO says it's old, it's old.
          *   *Risk:* Loss of normative force. If identity is purely stipulative, inscription cannot be a "mistake." It becomes politics.
          *   *Impact:* Undermines the moral authority of heritage. "This is the site of the massacre" loses power if it's just a designation.
      *   *Line Drawing:* Even with conventionalism, we need criteria for *which* conventions to apply. Usually: Connection to community memory.

  7.  **Review and Refine:**
