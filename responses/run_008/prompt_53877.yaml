      *(Self-Correction on Point 3)*: Does "Human Interest" collapse into Nominalism? Not necessarily. Conceptualism is the middle ground. Universals exist, but only in the mind (the Data Architect's mind). I should highlight Conceptualism.

      *(Refining the Trope Theory analogy)*: Trope theory is tricky. In DE, string interning makes "Red" == "Red". Trope theory says they are distinct instances. I need to make sure the analogy captures that distinctness. Maybe "Every cell write creates a new immutable object instance, even if value equals prior."

