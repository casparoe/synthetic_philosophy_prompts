          *   *The "Real" Column:* In philosophy, "real" means "carves nature at the joints." In DE, "real" means "persists in base table."
          *   *Verdict:* Good mapping, but the criteria for "real" differ (Nature vs. Business Logic).
      *   *(3) Human Interest/Design:*
