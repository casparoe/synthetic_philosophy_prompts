      *   *Is Kuhn a relativist?* Kuhn denied being a relativist, though his words often invited that interpretation. Need to be careful there.
      *   *Laudan's Demise of Underdetermination:* Larry Laudan argued that historical cases of underdetermination are rare. Worth mentioning briefly.
