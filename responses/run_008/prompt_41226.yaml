answer: |-
  Your intuition is spot on. You have correctly identified that the podcast guest started with a standard, widely accepted principle in philosophy of science but then inflated it into a radical conclusion that most philosophers and scientists reject.

  The guest's argument is a classic "slippery slope" from **confirmation holism** to **epistemic relativism**. Here is the breakdown of where the philosophy is solid, where it gets controversial, and where the logic breaks down.

  ### 1. The Solid Core: The Duhem-Quine Thesis
  **Verdict:** *Accurate.*

  The guest's opening move is a textbook summary of the **Duhem-Quine Thesis**.
  *   **Pierre Duhem (1906)** argued that in physics, you never test a single hypothesis in isolation. You test the hypothesis *plus* a bundle of auxiliary assumptions (the instrument works, the math is right, there are no interfering forces).
  *   **W.V.O. Quine (1951)** expanded this to all knowledge, arguing that our beliefs face the "tribunal of experience" not individually but as a corporate body.

  **The Guest was right here:** If an experiment fails, logic alone does not dictate which part of the bundle is wrong. You *can* logically save any hypothesis by rejecting an auxiliary assumption instead (e.g., "The theory is right, but the telescope was dirty"). This is often called "saving the phenomena."

  ### 2. The First Slide: Logical Possibility vs. Rational Choice
  **Verdict:** *Misleading.*

  The guest argues: *Because you can logically shift the blame, you can always find a rival theory that fits the data.*

  This slides from **logical possibility** to **scientific rationality**.
  *   **The Problem:** Just because you *can* save a theory by tweaking background assumptions doesn't mean it is *reasonable* to do so. If you have to invent ad-hoc, complex, or implausible auxiliary assumptions to save a theory, scientists rightly reject it.
  *   **The Philosophical Counter:** Philosophers like **Larry Laudan** have argued that while underdetermination is logically possible, it is historically rare. In practice, when one theory fails and another succeeds, the evidence *does* usually constrain our choices significantly. We aren't left with infinite options; we are left with maybe one or two viable ones, and often one is clearly superior in terms of simplicity or scope.

  The guest treats science as a game of logic where any move is legal. In reality, science is a game of inference where some moves are penalized for being "ugly" (ad-hoc, complex, unfruitful).

  ### 3. The Second Slide: Underdetermination vs. Truth (Realism)
  **Verdict:** *Controversial / Oversold.*

  The guest claims: *Since evidence can't choose, science never tells us what's true, only what's convenient.*

  This is a move from **Underdetermination** to **Instrumentalism** (the view that theories are just tools for prediction, not descriptions of reality).
  *   **The Philosophical Counter:** Most scientific realists argue that underdetermination does not preclude truth. They rely on **Inference to the Best Explanation (IBE)**. Even if two theories fit the data, one might explain *why* the data occurs much better than the other.
  *   **Example:** Newton's gravity and Einstein's relativity might fit certain data points similarly, but General Relativity explains *more* (like the bending of light) with greater coherence. We don't pick it because it's "convenient"; we pick it because it appears to map onto the structure of the universe more accurately.

  The guest assumes that because evidence isn't *conclusive* (100% proof), it is *neutral*. But evidence can be strongly supportive without being logically coercive.

  ### 4. The Final Leap: "Science by Taste" and Community Relativism
  **Verdict:** *The Logic Breaks Here.*

  The guest concludes: *Scientists pick by taste, so different communities can have genuinely different sciences.*

  This is the most radical leap. It sounds like a caricature of **Thomas Kuhn** (author of *The Structure of Scientific Revolutions*) mixed with the **Strong Programme** in the sociology of science.
  *   **Kuhn's Actual View:** Kuhn did argue that during "paradigm shifts," there is no algorithm to decide between the old and new paradigm. However, he explicitly denied that this made science irrational or merely a matter of "taste." He argued scientists share **values** (accuracy, consistency, scope, simplicity, fruitfulness). They might weigh these values differently, but they aren't just picking randomly.
  *   **Convergence vs. Divergence:** The guest claims different communities can end up with "genuinely different sciences." History suggests the opposite. While there are local variations, science is remarkably convergent. Chinese, Indian, European, and American physicists generally arrive at the same quantum mechanics. If theory choice were truly just "taste" or social negotiation, we would expect permanent divergence. Instead, we see global consensus.
  *   **The "Too Pleased" Factor:** You noted the guest sounded pleased with himself. This is common with "skeptic" arguments. It feels like a "gotcha"—*I have proven science is subjective!* But in doing so, they usually ignore the mechanisms (peer review, replication, predictive success) that grind down subjective taste over time.

  ### Summary: Where the Argument Fails

  The guest's argument follows this structure:
  1.  **Premise:** Hypotheses are tested in bundles (Holism). **(True)**
  2.  **Inference:** Therefore, we can always adjust the bundle to save any hypothesis. **(Logically True, Practically Constrained)**
  3.  **Inference:** Therefore, evidence never favors one theory over another. **(False; evidence favors, even if it doesn't prove)**
  4.  **Conclusion:** Therefore, theory choice is subjective/taste-based. **(False; it is constrained by epistemic virtues)**

  **The Verdict:**
  The guest took a technical point about **logic** (you can't strictly prove a theory true) and turned it into a sociological claim about **psychology** (scientists just pick what they like).

  A philosopher of science would say:
  *   **Yes,** evidence underdetermines theory (we can't be 100% certain).
  *   **No,** that does not mean all theories are equal.
  *   **No,** that does not mean theory choice is irrational or merely aesthetic.
  *   **No,** that does not mean different communities will sustain incompatible "truths" indefinitely.

  Your suspicion was correct. The beginning was a standard lecture on Duhem-Quine; the ending was a slide into relativism that doesn't follow from the premises. The guest confused the **absence of certainty** with the **absence of justification.** Science offers justification, just not certainty.
