      *   *Critique:* In Cruxes, is the QG prediction too vague?
      *   *Fix:* Focus on the "Problem of Time" or "Observables." Substantivalist might expect spacetime operators; Relationalist might expect correlation-based observables.
      *   *Constraint Check:* The prompt asks me to "act as an expert... think carefully, maybe do a quick brainstorm." I will include a brief preamble reflecting this process before the document.
      *   *Constraint Check:* "If you conclude that some part of their dispute is verbal... say which part." I need to make sure the document itself reflects this nuance without me breaking character. I will embed this analysis in the "Status of Dispute" section of the Cruxes.

  8.  **Final Polish:** Check against the specific prompt requirements one last time.
      *   (1) Numbered agreed claims? Yes.
