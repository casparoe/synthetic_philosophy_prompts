      *   **Requirements:**
          1.  Numbered section of *Agreed Claims* (must cover formal aspects of the Hole Argument, active diffeomorphisms, Leibniz Equivalence, diffeomorphism-invariant observables).
          2.  *Disagreements Table* (must cover: metaphysical moral vs. gauge theory lesson; sophisticated substantivalism vs. relationalism distinction).
          3.  *Cruxes* (must include specific cases/thought experiments, predictions from both sides, assessment of verbal vs. substantive dispute).
          4.  *Tone/Style:* Formal, precise, neutral, signable by both parties. Avoid strawmanning. Avoid over-reliance on Leibniz-Clarke (focus on GR).
          5.  **Constraint:** Do not declare the whole dispute verbal unless the drafting supports it (earn the conclusion).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Hole Argument (Earman & Norton formulation):** Starts with a manifold $M$, metric $g$, and matter fields $T$. Apply an active diffeomorphism $d$ that is identity outside a hole $H$ but non-identity inside. This generates a new model $(M, d^*g, d^*T)$.
      *   **Formal Consensus:** Both models satisfy Einstein's Field Equations (EFE). If manifold points have independent reality (manifold substantivalism), these represent distinct physical situations (indeterminism). To save determinism, one must accept Leibniz Equivalence (models related by diffeomorphism represent the same physical state).
      *   **Substantivalist (Sophisticated):** Accepts Leibniz Equivalence. Denies haecceitism (points don't have primitive this-ness independent of fields). Still claims spacetime is a substance/entity, not just relations. Spacetime exists over and above the relations, but its points are not individuated prior to the metric.
      *   **Relationalist:** Accepts Leibniz Equivalence. Claims spacetime is *nothing over and above* the relations between material events/fields. Talk of "spacetime points" is merely heuristic or gauge-dependent.
      *   **The Dispute:** Is "Sophisticated Substantivalism" just "Relationalism" with different branding? Or does the ontological commitment to the manifold as a substance matter for future physics (e.g., Quantum Gravity)?

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to be technically precise but metaphysically neutral.
      *   Must establish the formal setup of GR (manifold, metric, fields).
      *   Must establish the Hole Argument logic (active diffeomorphism, indeterminism threat).
      *   Must establish the resolution (Leibniz Equivalence/Diffeomorphism Invariance).
      *   *Drafting thought:* Avoid saying "spacetime is real" or "spacetime is not real" here. Stick to models and representations.
      *   *Key phrase:* "Represent the same physical situation."

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to capture the nuance. It's not just "Substantivalism vs. Naive Substantivalism." It's "Sophisticated Substantivalism vs. Relationalism."
      *   *Issue 1: The Moral.* Is it just about gauge freedom (Relationalist lean) or does it teach us about the nature of substances (Substantivalist lean)?
      *   *Issue 2: Distinctness.* Is Sophisticated Substantivalism (SS) distinct from Relationalism (R)?
      *   *Substantivalist View:* SS is distinct because it affirms the existence of the spacetime entity, even if points aren't haecceitistic.
      *   *Relationalist View:* SS is verbally distinct but ontologically identical to R. If points have no independent identity, what "substance" remains?
      *   *Wording:* Must be charitable. "Proponent X holds..." rather than "Proponent X is wrong because..."

  5.  **Drafting - Section 3: Cruxes:**
      *   Need concrete scenarios where the views might diverge in prediction or heuristic value.
      *   *Crux 1: Haecceitism's Role.* Did anyone actually believe in haecceitistic points?
          *   *Case:* The initial motivation for the Hole Argument (Earman & Norton).
          *   *Prediction:* Substantivalist says it exposed a genuine temptation/error. Relationalist says it attacked a strawman; no serious physicist believed in bare point individuation.
      *   *Crux 2: Quantum Gravity (QG).* This is the big one. Does the ontology guide theory construction?
          *   *Case:* Loop Quantum Gravity (LQG) vs. String Theory or Causal Set Theory. Or simply the problem of time/observables in QG.
          *   *Prediction:* Substantivalist says treating spacetime as an entity allows for quantization of geometry itself (spacetime becomes dynamic/quantum). Relationalist says quantization should be of relations/events; treating geometry as a "thing" leads to conceptual dead ends (like the problem of time).
      *   *Verbal vs. Substantive:* This needs careful handling. If both agree on all physical predictions in GR, is the rest metaphysics? The Substantivalist will argue ontology guides heuristics for *new* physics. The Relationalist will argue ontology should supervene on physics. I need to frame this so both can sign that *if* no empirical difference arises even in QG, the dispute risks becoming verbal, but *until then*, it remains a substantive heuristic divide.

  6.  **Refining and Polishing:**
      *   *Tone Check:* Is it dry enough? Yes. Does it sound like a contract? Yes.
      *   *Leibniz-Clarke:* Keep it out of the main text, maybe a footnote if needed, but the prompt says avoid it. I will omit it to focus on GR.
      *   *Terminology:* Ensure "active diffeomorphism," "Leibniz Equivalence," "haecceitism," and "sophisticated substantivalism" are used correctly.
      *   *Sign-off:* Needs a place for signatures.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* In the Agreed Claims, did I accidentally side with relationalism by saying points are "just gauge"?
