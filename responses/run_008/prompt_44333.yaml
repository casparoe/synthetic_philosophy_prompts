answer: |-
  I am writing this to you with the full weight of your situation in mind, knowing that no amount of ethical clarity can remove the emotional burden you are carrying. You are standing at the intersection of law, medicine, and philosophy, tasked with making a decision that will define the end of your mother's life and the memory of her for your family. It is understandable that you feel torn, because the conflict you describe with your sister is not merely a family disagreement but a reflection of a genuine, unresolved tension in bioethics itself. To help you think this through, I will walk with you through the arguments on both sides, distinguishing where professional consensus exists from where reasonable people and experts genuinely diverge.

  Your sister's argument is intuitively powerful because it focuses on the person sitting in the chair right now. In bioethics, this is often framed as the conflict between precedent autonomy and current interests. Your sister is arguing that the mother who wrote the directive and the mother who is now humming to music are effectively different people. The woman who wrote the directive was motivated by a fear of suffering and indignity, a prediction that has not come true. The patient now is not suffering; she is placid and takes pleasure in meals. If the goal of medicine is to benefit the patient in front of us, and the patient in front of us seems content, then overriding the directive appears to serve her current well-being. This position, championed by scholars like Rebecca Dresser, suggests that advance directives should not be binding if the current incompetent patient shows no signs of the distress the directive was meant to prevent. The strength of this view is that it protects the vulnerable person from the potentially outdated fears of a past self. It asks us to look at the actual quality of life rather than an abstract principle.

  However, there are significant weaknesses in your sister's position, and understanding them may help you articulate your own. The primary weakness is that it undermines the concept of a life lived as a coherent narrative. If we decide that a person's values only matter while they are cognitively intact, we effectively say that human beings lose the right to shape the conclusion of their own stories once they become ill. Your mother spent decades working in an ICU; she saw what medical technology could do, and she made a deliberate choice about how she wanted to die based on those observations. To ignore that is to treat her prior values as disposable. Furthermore, your sister's argument relies on the assumption that contentment equals well-being. While your mother appears placid, she lacks the capacity to understand her condition or her future. She cannot consent to the feeding tube either. By choosing the tube, you are not respecting her current wishes, because she has no current wishes to respect; you are making a best-interest judgment that overrides her explicit prior refusal. This sets a dangerous precedent that the values of the competent self can be discarded whenever the incompetent self is too impaired to object.

  This brings us to your own position, which feels harder to articulate but rests on a solid ethical foundation known as precedent autonomy. You mentioned picturing her lucid self watching from the doorway and being horrified. While your sister calls this a ghost, a stronger way to state this is that you are honoring the integrity of her life as a whole. Your mother defined her dignity not just by how she felt in the moment, but by her values regarding dependence and bodily integrity. She decided that there was a line where life prolongation was no longer a benefit but a burden, regardless of whether the patient felt suffering. By honoring this, you are treating her as a person who exists over time, not just a collection of present-moment experiences. You are acting as her agent to ensure her life ends in the way she deemed consistent with her values. The strongest version of your argument is not that the current mother is suffering, but that the current mother cannot understand the trade-off, and therefore the only valid moral compass is the one she constructed when she could understand it. You are protecting her right to have her values survive her incapacity.

  Regarding the reaffirmation she made six years ago, this is a crucial detail. In clinical ethics, capacity is decision-specific. A diagnosis of early cognitive decline or even early-stage Alzheimer's does not automatically negate the capacity to make value judgments about end-of-life care. Many patients retain the ability to understand their values and the consequences of their choices long after short-term memory begins to fail. Unless there is specific evidence that she was coerced or fundamentally misunderstood what she was reaffirming at that time, that verbal reaffirmation carries significant weight. It bridges the gap between the fully lucid writer of the document and the later stages of decline. It suggests continuity of intent. The fact that she reiterated her wish when she was already experiencing forgetfulness strengthens the argument that this was a stable value, not a whim of her fully healthy past self.

  You also asked about her failure to revisit or soften the document during her remaining lucid years. This is an area where you must be careful not to overinterpret silence. Inertia is a common human trait, and the failure to update a document can mean many things: stubbornness, avoidance of the topic, or simply forgetting to make an appointment with a lawyer. However, in the context of healthcare proxy decision-making, the standard practice is to treat the written directive as the primary evidence of wishes unless there is clear and convincing evidence of a change of heart. Silence is generally not interpreted as a revocation. Given that she reaffirmed it verbally during early decline, the lack of subsequent change leans more toward continued intent than mere inertia. If she had become deeply concerned that her fears were unfounded, one might expect some mention of it, especially given her medical background. But you are right to be cautious here; we cannot know for sure what her silence meant, so it should not be the primary pillar of your decision, but rather a secondary support to the explicit document and reaffirmation.

  The medical distinction your doctors raised is also important to unpack. They noted she is not otherwise dying, meaning the aspiration is an acute event on top of a chronic condition, and refusing the tube will make the aspiration the cause of death. This feels different than refusing treatment for a terminal cancer, but ethically and legally, the distinction is less significant than it feels emotionally. It is fairly settled in medical ethics and law that artificial nutrition and hydration are medical treatments, not basic care like keeping a patient warm or clean. They involve technology, risk, and medical intervention. Therefore, refusing them is ethically equivalent to refusing a ventilator or dialysis. Furthermore, while she is not dying from a separate acute illness, moderate to severe Alzheimer's is itself a terminal neurodegenerative condition. The aspiration is a complication of the dementia, specifically the loss of the swallow reflex. Choosing hand-feeding over a tube is not killing her; it is allowing the natural progression of the terminal underlying condition to take its course while providing comfort. The consensus among palliative care specialists is that careful hand-feeding is the preferred approach for advanced dementia, as tubes do not prolong life meaningfully in this population and often increase discomfort. So while it feels like you are choosing the cause of death, you are actually choosing the manner of death within the context of a terminal illness.

  There is, however, genuine contestation on whether the prior directive should bind when the current patient appears happy. While the legal consensus in most jurisdictions is that advance directives must be followed regardless of the patient's current mood, the philosophical consensus is split. Some ethicists argue that if the patient shows no evidence of distress, the prior refusal should be set aside in favor of preserving life. This is the gray area you are inhabiting. You should know that if you follow the directive, you are on firm legal and standard clinical ground. If you override it, you are entering a more controversial ethical space that prioritizes current experiential interests over precedent autonomy. Neither side has a monopoly on moral truth, but the institutional weight of medicine and law supports your inclination to follow the directive.

  Ultimately, your role as healthcare proxy is to make the decision she would have made, not the one you or your sister think is best. This is called substituted judgment. You have evidence of what she wanted: a detailed directive written by a medical professional and a verbal reaffirmation. You do not have evidence that she changed her mind. The fact that her current self is content is a tragic irony, but it does not necessarily invalidate her prior judgment about what kind of existence she valued. You can acknowledge your sister's compassion—she wants to protect the living woman in the chair—while maintaining that protecting the integrity of the person your mother was for eighty years requires honoring her explicit instructions. You might tell your sister that you understand her view that the mother they knew is gone, but that your duty is to the mother who planned for this moment, and that ignoring her plan would be a betrayal of the trust she placed in you.

  I hope this helps you find the words and the conviction you need. There is no choice here that will be without pain, but there is a choice that is more faithful to the person she was when she could speak for herself. You are holding the space for her voice when she no longer has one, and that is a profound act of love, even if it feels like letting go.
