      4. Reaffirmation: Likely valid unless evidence of incapacity.
      5. Inertia: Ambiguous.
      6. Medical/Terminal: Alzheimer's is terminal, ANH is treatment.
      7. Consensus vs. Contested: Legal/Clinical consensus favors directive; Philosophical consensus is split on the "then self vs. now self."

      *Refining the "Terminal" point:* The doctors say she is not otherwise dying. This is technically true in the immediate sense (aspiration is the acute threat), but Alzheimer's is the underlying terminal condition. Refusing ANH allows the natural progression. This is a settled ethical point (ANH is optional), but feels different emotionally.

      *Refining the "Reaffirmation":* If she had capacity then, it counts. Early forgetfulness doesn't equal incapacity for values.

      *Refining the "Inertia":* Don't overinterpret silence.

      *Okay, ready to generate.*

