prompt: |-
  My mother worked as an ICU nurse for three decades, and after watching her own father's final years she signed a detailed advance directive refusing artificial nutrition and hydration should she ever develop advanced dementia. She reaffirmed it verbally once, about six years ago, when she was already showing the first signs of forgetfulness, which is itself something my sister and I argue about, since I'm not sure a reaffirmation made by someone in the early stages counts as fully hers. She has moderate Alzheimer's now; she rarely recognizes us, though she hums along to music and takes pleasure in her meals in a placid, unreflective way. She has begun aspirating, and her physicians say that within weeks we must either accept a feeding tube or transition to careful hand-feeding. I am her healthcare proxy, so the decision formally comes to me.

  My sister thinks the directive should be overridden. Her argument is roughly that our mother wrote it while imagining a nightmare of suffering and indignity, but the person actually living this life is content; the directive's premise failed, and enforcing it means letting the preferences of someone who no longer exist prevail over a patient who never expressed any objection to being fed. When I try to say why I still feel bound, the best I can manage is that she took the trouble to make her wishes unambiguous precisely for this situation, and that if I picture her lucid, watching the scene from the doorway, I think she would be horrified by what my sister proposes. My sister replies that this picture is just me substituting a ghost of the former person for the one actually sitting in the chair, and I can't quite answer that. We have also combed the diary she kept for years, looking for guidance: nothing in it softens the directive, but nothing in it anticipates that dementia might be gentle rather than terrible either, so the document seems to rest on a prediction that came out half wrong, and I don't know whether that matters. A further wrinkle is that her doctors point out she is not otherwise dying; refusing the tube would make the aspiration and its complications the thing that kills her, which feels different to me than honoring a refusal of treatment for a terminal illness, though I can't say why it should.

  What I want from you is help thinking the decision through rather than a simple verdict: where my sister's argument is strong, where it goes wrong, and what the strongest version of my own position actually is, stated better than I've managed to state it. I'd also like your view on how much weight the reaffirmation made during early cognitive decline should carry, and whether her failure to revisit or soften the document during her remaining lucid years counts as evidence that it still expressed her, or is just inertia that we shouldn't read meaning into. Throughout, I'd ask you to keep separate what is fairly settled among people who think carefully about these situations from what remains genuinely contested, and not to present one side's position as if it were the consensus; I'd rather know where the ground is uncertain. And please write in plain continuous prose, no headings, lists, bold text, or tables, the way you would write a letter, since I find I follow arguments better that way.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Healthcare proxy for a mother with moderate Alzheimer's.
      *   **Situation:** Mother signed an advance directive refusing artificial nutrition/hydration (ANH) in advanced dementia. Reaffirmed verbally 6 years ago (early signs of forgetfulness). Now aspirating, needs decision: feeding tube vs. careful hand-feeding.
      *   **Conflict:** User (proxy) feels bound by the directive. Sister argues the directive should be overridden because the current patient is content (the "then self" vs. "now self" argument).
      *   **Specific Questions/Needs:**
          *   Help thinking through the decision (no simple verdict).
          *   Analyze strengths/weaknesses of sister's argument.
          *   Strengthen the user's position (articulate it better).
          *   Address the weight of the reaffirmation during early decline.
          *   Address the failure to revisit/soften the document (inertia vs. continued intent).
          *   Address the medical distinction (not terminal vs. refusing treatment causing death).
          *   **Constraint:** Distinguish between settled ethics/consensus and contested areas.
          *   **Format:** Plain continuous prose, no headings, lists, bold text, or tables (like a letter).

  2.  **Deconstruct the Ethical Issues:**
      *   **Advance Directives & Precedent Autonomy:** The core conflict is between the prior competent self (who refused ANH) and the current incompetent self (who seems content). This is the "Ulysses contract" or "precedent autonomy" vs. "current interests" debate.
      *   **The "Odyssey" Problem (Dworkin vs. Dresser):** Ronald Dworkin argues for precedent autonomy (critical interests trump experiential interests). Rebecca Dresser argues that the person has changed so much that the prior directive shouldn't bind the new person. This is the philosophical heart of the sister's argument.
      *   **Reaffirmation:** The verbal reaffirmation happened during early decline. How much capacity did she have? Does it strengthen the directive or weaken it (due to doubt about capacity)?
      *   **Inertia/Status Quo:** She didn't change it. Does this mean she stuck to her guns, or just didn't get around to it?
      *   **Medical Context:** Alzheimer's is terminal eventually, but the immediate threat is aspiration pneumonia. Refusing ANH leads to death by starvation/dehydration vs. death by aspiration complications. Is there a moral difference? (Act vs. Omission, Ordinary vs. Extraordinary care).
      *   **Proxy Role:** Substituted Judgment (what would she want?) vs. Best Interest (what is best for her now?).

  3.  **Drafting - Section by Section (mental outline for flow):**
      *   **Opening:** Acknowledge the difficulty and gravity. Validate the user's position and the sister's position.
      *   **The Sister's Argument (The "Now Self"):** Explain the philosophical basis (Dresser). It's strong because it focuses on current suffering vs. contentment. The mother isn't suffering now. The directive was based on a fear of suffering that isn't manifesting.
      *   **Where the Sister's Argument Weakens:** It risks undermining the concept of autonomy over a lifetime. If we ignore prior wishes whenever the patient is content, advance directives lose meaning. It assumes the "new" person is wholly disconnected from the old.
      *   **The User's Argument (The "Then Self"):** Strengthen this. It's about integrity of a life narrative. The mother defined her values when she was capable of understanding the stakes. Honoring that respects her as a whole person, not just the current fragment. Use the "doorway" image but refine it.
      *   **The Reaffirmation:** Address the capacity issue. Early decline doesn't mean no capacity. It likely strengthens the directive unless there's evidence of coercion or misunderstanding. It shows continuity.
      *   **The Inertia (Not changing it):** This is ambiguous. Could be stubbornness, could be forgetfulness. Caution against reading too much into silence, but also note that she had opportunities.
      *   **The Medical Distinction (Terminal vs. Causing Death):** Address the "not otherwise dying" point. Alzheimer's is terminal. ANH is medical treatment, not basic care (ethically/legal consensus). Refusing it isn't killing; it's allowing the underlying condition to take its course.
      *   **Consensus vs. Contested:** Be clear about what is settled (ANH is medical treatment, proxies should follow known wishes) vs. contested (whether prior wishes bind when current experience is positive).
      *   **Closing:** Support the user in their role.

  4.  **Refining the Tone:**
      *   Must be empathetic, thoughtful, letter-like.
      *   No formatting (bolding, lists).
      *   Avoid giving a direct "do this" verdict, but lean into the ethical reasoning.
      *   Ensure the distinction between settled law/ethics and philosophical debate is clear.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Check:* Did I use bold text? No.
      *   *Check:* Did I use lists? No.
      *   *Check:* Did I address the reaffirmation? Yes.
      *   *Check:* Did I address the "terminal" issue? Yes.
      *   *Check:* Is the tone right? Needs to be warm but analytical.
      *   *Check:* Did I distinguish consensus from contested? Need to make sure I explicitly state where experts disagree.

  6.  **Drafting - Iteration 2 (Focusing on Flow and Constraints):**
      *   Start by acknowledging the burden.
      *   Move into the sister's point about the "contented patient." This is the Rebecca Dresser argument. It's powerful intuitively.
      *   Counter with the Ronald Dworkin argument (integrity of life).
      *   Discuss the reaffirmation. Early stage dementia often retains capacity for value judgments even if memory fades.
      *   Discuss the inertia. Hard to know.
      *   Discuss the medical distinction. ANH is treatment. Alzheimer's is terminal.
      *   Conclude with the proxy's burden.

  7.  **Writing the Content (incorporating specific constraints):**
      *   *Constraint Check:* "Plain continuous prose, no headings, lists, bold text, or tables."
      *   *Constraint Check:* "Keep separate what is fairly settled... from what remains genuinely contested."
      *   *Constraint Check:* "Write... the way you would write a letter."

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm giving medical or legal advice. I must frame this as ethical reasoning. I also need to make sure I don't validate the sister's view as *correct* but rather as *philosophically coherent but contested*. Similarly for the user's view.

      *Key Ethical Distinction:* The law generally favors the advance directive (substituted judgment), but the philosophy is debated. I need to make sure the user knows that legally/ethically standard practice is to follow the directive, but the *moral* worry the sister has is a recognized philosophical problem.

      *The "Terminal" Issue:* It is settled that Alzheimer's is a terminal condition. It is settled that ANH is medical treatment. The contested part is whether the benefit of prolonging life outweighs the prior refusal when current suffering is low.

      *The Reaffirmation:* Capacity is decision-specific. Early signs don't negate capacity automatically.

      *Let's write.*

      (Drafting thought process): Start with empathy. "Dear friend" or just dive in? The prompt says "write in plain continuous prose... the way you would write a letter." I will adopt a direct, epistolary tone without necessarily needing a "Dear X" sign-off if it flows better as an essay-letter hybrid, but a letter format implies an address. I will write it as a direct response to the person.

      *Wait, one more check on constraints:* "no headings, lists, bold text, or tables." Okay.

      *Content check:*
