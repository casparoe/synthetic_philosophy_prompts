  Three implications that matter most for us

  **1. Tractability depends on scale fit**
  At your scale, "Importance" is a trap; every cause is important. The differentiator is where $7,500 actually changes outcomes. Globally, this amount is invisible; locally, it funds a part-time counselor or 500 grocery bags. Prioritize causes where you function as a major donor, not a drop in the bucket. This maximizes tangible impact and validates student effort. If you fund a global fund, your contribution is symbolic; if you fund a local gap, it's operational. This pragmatic focus defends against the advisor's "TED-talk" critique by grounding decisions in observable reality rather than abstract utilitarian math. It shifts the question from "What matters most?" to "Where do we matter most?" This ensures the money isn't just donated, but *felt*.

  **2. Neglectedness as gap analysis, not risk-seeking**
  Use neglectedness to audit redundancy, not to find obscure risks. If the Student Government already funds the food bank, doubling down adds less value than filling an unfunded niche. This prevents groupthink and encourages research into community needs. However, warn the committee: "neglected" often means "unsupported for a reason." Avoid causes lacking transparency or track records you can verify. You don't have the capacity to vet high-risk, high-reward bets. Use this factor to find clear gaps in local support where your money completes a puzzle, rather than chasing theoretically high-impact but unverifiable opportunities. This balances innovation with responsibility, ensuring you aren't just funding ideas that failed to secure support elsewhere due to inefficacy.

  **3. The framework is a vocabulary for debate**
  The framework's greatest value is structuring disagreement, not calculating scores. When a student advocates for a pet cause, ask: "Is this neglected or already funded?" This replaces emotional lobbying with evidence-based argumentation. It teaches critical thinking skills valuable beyond philanthropy. Tell your advisor you aren't trying to maximize QALYs; you're practicing structured decision-making. This transforms the meeting from a popularity contest into a deliberative body. By adopting the language of ITN, you elevate the discourse without needing the data infrastructure of a major foundation. It's about the quality of the reasoning, not the precision of the output. This distinction is crucial for defending the process against claims of pseudo-scientific moral accounting.

  Where the framework will mislead us
  The biggest trap is false precision. Do not create a scoring spreadsheet; it invites the advisor's criticism that this is "utilitarianism with a spreadsheet." You lack the data to score "importance" objectively. Another pitfall is ignoring the council's secondary mission: community building. Equal splitting teaches compromise and inclusivity, which have value independent of impact. If you ruthlessly optimize, you might alienate constituents who care about visible local causes. Also, neglected causes often lack the vetting infrastructure you need; you risk funding ineffective programs because you can't audit them like GiveWell does. Finally, acknowledge the hard truth: globally, your impact is symbolic. If you pretend otherwise, you lose credibility. Own the symbolic value while striving for local leverage. The framework becomes dangerous if it masks uncertainty with math. Your advisor is right that the math is thin; defend the *thinking process*, not the numbers.

  Bottom line
  Adopt ITN as a discussion lens, not a calculator. Prioritize local causes where $7,500 creates visible change. Use the framework to structure debate and prevent emotional hijacking, but reject false precision. Tell your advisor the goal is critical thinking practice, not optimal utility. Be honest about your scale limits.
