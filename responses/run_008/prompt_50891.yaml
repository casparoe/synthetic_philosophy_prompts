      *   *Refinement:* It's not merely verbal because "rationality" isn't just a label; it carries normative weight. If one side defines it as "coherence" and the other as "successful agency," they are arguing about what we *value* in agency, not just definitions.

  4.  **Identify the Core Disagreements (The "Cruxes"):**
