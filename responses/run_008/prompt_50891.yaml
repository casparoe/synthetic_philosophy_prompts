      *   **Permissive Crowd:** Focuses on *dynamic feasibility* and *substantive goals*. Money pumps require a specific environment (unbounded time, no transaction costs, malicious bookie). Resolute choice or pre-commitment blocks pumps. Risk-Weighted EU (Buchak) captures intuitions (Allais) without formal incoherence *if* you change the object of evaluation. Rationality = achieving goals without being a "mark" in the *actual* world.

