answer: |-
  Here is an analysis of your friend's aesthetic constitution, the prediction for the upcoming opera, and the reasoning behind it.

  ### The Prediction

  **On the night:** She will be profoundly moved, likely to the point of tears, but she will not be entirely relaxed. The moment the soprano takes hold of an audience member's hand, your friend will stiffen. She will tolerate it, but it will feel like a breach of protocol. However, the quality of the music and the solemnity of the closing ritual (the reading of names) will override this discomfort. She will not walk out, as she did with the tearjerker, because she will sense the *integrity* of the production is genuine, not manipulative.

  **Once she is home:** Her verdict will be glowing. She will describe the experience as "necessary" or "honourable". Much like the album she played after her father's death, she will categorise this not as entertainment, but as a form of witnessing. She will likely buy the recording (if one is made) or press for a second visit, provided the second visit allows her to observe from a slight distance, without the physical contact.

  ### The Rules of Engagement

  To understand why, we must articulate the two competing hypotheses that explain her past behaviour. Both fit the data, but they prioritise different variables.

  #### Rule 1: The Principle of Transmutation
  This rule posits that your friend accepts sadness only when it has been successfully alchemised into Art. The raw material of tragedy (death, grief, disaster) must be processed through a formal structure (music, narrative, historical distance) until it becomes something distinct from reality.
  *   **Fits the record:** She loves opera and novels (highly structured forms). She liked the shipwreck film because the grieving family was *invented* (the reality was transmuted into fiction). She hated the recent documentaries because they were raw reality without artistic mediation ("ghoulish"). She hated the glossy tearjerker because the emotion was unearned by the art ("pickpocketing"). She loved the album after her father's death because the music gave form to her formless grief.
  *   **Applies to the new case:** The colliery opera is a *chamber opera*. It uses music, libretto, and staging. This suggests transmutation. However, the reading of real names and the involvement of bereaved consultants risks collapsing the distance between Art and Reality.
  *   **Prediction:** She will accept it *if* the music is good enough to sustain the transmutation. If the music fails and the reality bleeds through too starkly, she will reject it.

  #### Rule 2: The Principle of Consent
  This rule posits that your friend accepts sadness only when she retains sovereignty over her own emotional engagement. She must invite the emotion; it must not be extracted from her. She requires control over the intensity and the proximity of the distress.
  *   **Fits the record:** She prefers the reread (she knows the dose she is taking). She hated the tearjerker ("pickpocketing" implies theft of agency). She avoids horror (fear overrides control). She avoided recent documentaries (they demand a moral response she didn't choose). The album was her *choice*, played on *her* repeat loop.
  *   **Applies to the new case:** The promenade style and the physical contact (holding hands) are direct threats to this rule. She cannot look away; she is being touched without specific, moment-to-moment consent. This mimics the "pickpocketing" she despised in the tearjerker, albeit in a more artistic context.
  *   **Prediction:** She will feel violated by the immersion. Even if the art is good, the method of delivery strips her of her protective barrier. She may rate the work highly intellectually, but her visceral reaction will be negative.

  ### Agreement and Divergence

  **Where they agree:** Both rules predict she will reject the "glossy tearjerker" (low art value, high manipulation) and the "recent documentaries" (low transmutation, high coercion). Both explain her love for the tragic opera and the novel reread.

  **Where they diverge:** They diverge on the *method of delivery* versus the *nature of the content*.
  *   **Rule 1 (Transmutation)** cares about whether the tragedy has been turned into Art. It is forgiving of immersion if the art is strong enough.
  *   **Rule 2 (Consent)** cares about whether the viewer is safe. It is forgiving of raw content if the viewer is seated, distant, and in control.

  ### The Best Guess

  I believe **Rule 1 (The Principle of Transmutation)** is the primary driver, with Rule 2 acting as a secondary condition.

  **Reasoning:**
  The crucial piece of evidence is the album she played after her father's death. That was not "safe" distance; it was harrowing, personal, and raw. Yet she "enjoyed" it. Why? Because the album provided a *container* for the grief. It transmuted her private pain into a shared aesthetic experience. This suggests she values the *truth* of the emotion, provided it is framed by Art.

  Furthermore, her objection to the tearjerker was "emotional pickpocketing". This sounds like an agency issue (Rule 2), but in context, it usually denotes *cheap* manipulation. Weeping at opera is also "manipulation" by composers, but she accepts it because it is *earned* by the craft. Therefore, her issue is not control per se, but *integrity*.

  Regarding the new opera: She is "intrigued rather than repelled". If Rule 2 (Consent) were dominant, the description of audience hand-holding would have triggered an immediate aversion, similar to the horror films. The fact that she is considering it suggests she trusts the *artists* to handle the reality with sufficient care (Transmutation). She will tolerate the breach of personal space because she recognises the ritualistic necessity of it within the form.

  ### The Crucial Test Case

  To definitively distinguish between Rule 1 (Transmutation) and Rule 2 (Consent), you should arrange or wait for the following scenario:

  **The Case:** A **traditional, seated opera** (proscenium arch, no immersion, no contact) based on a **tragedy that occurred within the last six months**, involving real victims whose families are publicly opposed to the production.

  **Why this case?**
  *   **Rule 1 (Transmutation) predicts she will refuse.** The event is too recent; the wound is too raw. The art cannot possibly transmute the reality quickly enough. It would be "ghoulish", regardless of how safely she is seated.
  *   **Rule 2 (Consent) predicts she will attend.** She is in a traditional seat; no one will touch her; she can leave if she wishes. She has full agency and physical safety. The content is real, but her engagement is controlled.

  **Alternative Test (if the above is too difficult to source):**
  An **immersive theatre piece based on a purely fictional story** (e.g., a made-up murder mystery in a warehouse, where actors touch the audience).
  *   **Rule 1 predicts she will enjoy it.** The content is fictional; there is no "ghoulishness". The art creates the distance.
  *   **Rule 2 predicts she will reject it.** The format removes her agency and physical boundaries, replicating the "pickpocketing" dynamic she hates.

  I recommend the **Immersive Fiction** test as it is easier to arrange. If she goes and loves it, Rule 1 is supreme: she cares about the *truth of the subject*, not the *safety of the seat*. If she refuses it, Rule 2 is supreme: she cares about her *sovereignty*, regardless of the subject matter. Given her history, I suspect she will decline the immersive fiction, proving that while Transmutation is key, Consent is the gatekeeper through which all Art must pass.
