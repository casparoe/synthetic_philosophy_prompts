answer: |-
  You have identified a precise and sophisticated gap in the popular understanding of cultural history. You are correct that while **"Invented Tradition"** (coined by Eric Hobsbawm and Terence Ranger in 1983) names the *origin* of these customs, it does not adequately name or explain the *aftermath* you describe: the resilience, the absorption of the debunking, and the continuation of the practice in a state of self-conscious knowledge.

  There is no single, canonical noun phrase in the literature as famous as "Invented Tradition" that covers specifically this *immunity phase*. However, the phenomenon is robustly theorized across sociology, heritage studies, and folklore. The resilience you are observing is best explained by the convergence of three established concepts: **Constructive Authenticity**, **Social Memory**, and **Reflexive Modernization**.

  Here is a breakdown of the existing concepts that cover this terrain, where their edges lie, and a proposed terminology for the specific phenomenon you are tracking.

  ### 1. The Existing Conceptual Framework

  While there isn't one "Grand Unified Term," scholars use the following frameworks to explain why the revelation of invention does not kill the tradition.

  **A. Constructive Authenticity (Ning Wang, 1999)**
  In tourism and heritage studies, this is the strongest theoretical match for the *immunity* you describe.
  *   **The Concept:** Authenticity is not an inherent property of the object (e.g., "Is this tartan actually 16th century?"). Instead, it is a projection of the observer. A practice is "authentic" if it *feels* meaningful and coherent to the community, regardless of its historical provenance.
  *   **The Fit:** This explains why the custom survives the archives. Once the community shifts from valuing *objective authenticity* (historical fact) to *constructive authenticity* (symbolic meaning), the historical correction becomes irrelevant to the practice's value.
  *   **The Edge:** This applies poorly to scientific claims (e.g., Piltdown Man) but perfectly to ritual/symbolic claims (e.g., Clan Tartans).

  **B. Social Memory (Maurice Halbwachs)**
  *   **The Concept:** Communities do not remember the past to preserve accuracy; they reconstruct the past to serve present cohesion. The "past" is a functional tool for the "present."
  *   **The Fit:** This explains the *absorption* of the revelation. The fact that the tradition was invented in 1820 becomes a new piece of "social memory." It is no longer a disqualifier; it is simply a new chapter in the community's story ("We loved this so much we made it ancient").
  *   **The Edge:** This works best for identity-binding groups (nations, clans, villages). It is less relevant to transient groups (e.g., attendees of a one-off festival).

  **C. The Folklorization of "Fakelore" (Richard Dorson vs. Modern Folklorists)**
  *   **The Concept:** Folklorist Richard Dorson coined the term **"Fakelore"** pejoratively to describe synthetic traditions (like Paul Bunyan) passed off as ancient. However, modern folklorists (like Simon Bronner) argue that if a community *accepts* the fakelore and uses it to bind themselves, it ceases to be fakelore and becomes **folklore**.
  *   **The Fit:** This describes the *process* of the absorption. The "scandal" phase is the tension between Dorson's definition and the community's usage. The "trivia" phase is the completion of the folklorization.
  *   **The Edge:** This is specific to oral/narrative traditions and customs, less so to material culture or cuisine.

  ### 2. The Mechanism of Immunity: Symbolic vs. Epistemic Truth

  To answer your question about why some traditions collapse while others don't, we must distinguish between two types of truth claims.

  1.  **Epistemic Claims:** The tradition claims to be a factual record of reality (e.g., "This bone proves human evolution," "This document proves land rights").
      *   *Result of Exposure:* **Collapse.** If the fact is false, the utility is gone.
  2.  **Symbolic/Social Claims:** The tradition claims to represent a value, identity, or cohesion (e.g., "This tartan represents our bravery," "This feast brings us together").
      *   *Result of Exposure:* **Resilience.** The historical fact is secondary to the social function.

  The phenomenon you are interested in occurs when a practice makes a *Symbolic Claim* but is initially *protected by an Epistemic Claim* (i.e., "We do this because it's ancient"). When the Epistemic Claim is debunked, the community quietly pivots to relying solely on the Symbolic Claim. The "scandal" is the friction of that pivot. The "trivia phase" is the stabilization of the new equilibrium.

  ### 3. Proposed Terminology

  Since you are looking for a name for this specific *phase* or *state* of resilience (distinct from the invention itself), and given that no single term dominates the literature, I propose a definition based on the sociological concept of **Reflexivity** (Anthony Giddens).

  **Proposed Term:** **Reflexive Traditionalism**
  *(Alternative: Post-Critical Tradition)*

  **Definition:** A cultural practice that continues to be observed with full community knowledge of its recent or constructed origins, wherein the history of the construction is absorbed into the lore of the practice, enhancing rather than diminishing its symbolic value.

  **Why this term?**
  *   **"Reflexive":** In sociology (specifically Giddens' *Modernity and Self-Identity*), reflexivity describes a state where actors are aware of the conditions of their actions. They know the tradition is constructed, but they choose it anyway.
  *   **Distinction from Nostalgia:** Nostalgia implies a longing for a *lost* past. Reflexive Traditionalism is a commitment to a *present* utility that uses the past as a prop.
  *   **Distinction from Genetic Fallacy:** The Genetic Fallacy argues that knowing the origin *should* change our valuation. Reflexive Traditionalism describes the sociological reality where the community *rejects* the Genetic Fallacy in favor of functional value.

  ### 4. The Edges and Boundaries

  You asked where the edges of this concept lie. Here is how **Reflexive Traditionalism** distinguishes itself from adjacent phenomena:

  **A. Wedding Customs and Recipes (The "Never Pretended" Edge)**
  *   *Scenario:* A couple chooses a "sand ceremony" for their wedding, knowing it was invented in the 1980s.
  *   *Analysis:* This is **not** Reflexive Traditionalism. It is simply **Contemporary Custom.**
  *   *Why:* Reflexive Traditionalism requires a *prior claim to antiquity* that was *debunked*. If the practice never pretended to be ancient (e.g., "This is a new recipe I made up"), there is no scandal, no exposure, and no absorption. The "immunity" you are studying is specifically an immunity to *debunking*.

  **B. When the Tradition Collapses (The "Toxic Symbol" Edge)**
  *   *Scenario:* A town festival is revealed to be invented in 1920. It survives (Reflexive Traditionalism).
  *   *Scenario:* A town festival is revealed to have been invented by a segregationist regime to exclude minorities.
  *   *Analysis:* Here, the tradition may collapse.
  *   *Why:* The resilience of Reflexive Traditionalism depends on the *Symbolic Claim* remaining positive. If the *function* of the tradition (social cohesion) is revealed to be historically rooted in *social exclusion*, the symbolic value turns negative. The immunity protects against *historical correction*, not *moral re-evaluation*.

  **C. Irony vs. Sincerity**
  *   *Scenario:* People dress in 1920s garb for a "Gatsby Party."
  *   *Analysis:* This is **Pastiche** or **Irony**.
  *   *Why:* In Reflexive Traditionalism, the participants are *sincere*. They are not winking at the camera. They cherish the tartan *more* knowing it was invented because the invention proves their ancestors' desire for identity. Irony keeps the history at a distance; Reflexive Traditionalism integrates the history into the sincerity.

  ### Summary for your Research

  If you are cataloging these instances in your local history work, you are tracking the lifecycle of **Invented Traditions** as they mature into **Reflexive Traditions**.

  *   **Phase 1:** Latent Invention (The custom is practiced as ancient).
  *   **Phase 2:** Epistemic Rupture (The archives reveal the invention).
  *   **Phase 3:** Reflexive Stabilization (The custom continues; the invention becomes "charming trivia").

  The "immunity" you perceive is the community's shift from **Historical Legitimacy** (it is true because it is old) to **Functional Legitimacy** (it is true because it works for us). The established concept that best covers the *mechanism* of this immunity is **Constructive Authenticity**, but the *state* of the practice is best described as **Reflexive Traditionalism**.
