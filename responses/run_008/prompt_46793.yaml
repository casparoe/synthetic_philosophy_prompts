prompt: |-
  I do grantmaking for a small foundation that funds conceptual/theory work on AI safety — philosophers, math-y types, no empirical ML — and this cycle we have money for about five grantees over two years on Goodhart's law and specification gaming. The problem is most of the proposals I'm reading are basically restatements of the thing (measure becomes target, agents game the metric, "you get what you measure," etc.) and I can't tell which of the deeper open questions are actually worth funding versus which are just the same insight re-dressed. I've come across the fourfold breakdown of Goodhart effects — regressional, extremal, causal, adversarial — and honestly I can't decide whether refining taxonomies like that is a necessary first step or a dead end that eats grant money that should go elsewhere. So: what are the main genuinely open questions in this space right now, which two or three should a funder with our constraints prioritize, and, more importantly, why? I care much more about the reasoning than the list — what makes a question upstream of other work (e.g., does everything else hinge on whether anyone can formalize *when* optimizing for a proxy severs the link between proxy and goal, or is that a hopeless math program?), how tractable it is for researchers who don't run experiments, and what developments in the next couple of years would make you re-rank. Also call out the lines of work people keep pitching that I should actively deprioritize as either overrated or downstream of something else on the list.

