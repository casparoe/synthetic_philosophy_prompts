  ### Credence Estimates (15-Year Horizon)

  *   **Loose Reading (Cognitive Work Only):** 0.60
  *   **Strict Reading (Physical & Institutional Work):** 0.15

  ### Decomposition

  The final credence is approximated as $P(a) \times (1 - P(b)) \times P(c)$. Probabilities are listed as **Loose / Strict**.

  **(a) Probability that remaining gaps (reliability, taste, tacit know-how) are closed by scaling/training rather than architectural limits.**
  *   **0.85 / 0.50:** Current reasoning models show strong scaling laws, but embedding physical tacit knowledge into agents is unproven.

  **(b) Probability that physical/institutional bottlenecks (chips, energy, permitting) prevent a "few times faster" pace even if cognitive work is automated.**
  *   **0.25 / 0.60:** Cognitive loops can accelerate rapidly, but hardware fabrication and grid expansion obey fixed physical and bureaucratic timelines.

  **(c) Probability that AI can generalize to novel research directions and experimental designs without human intervention (Task Novelty).**
  *   **0.95 / 0.80:** Models are rapidly improving at out-of-distribution reasoning, though fully autonomous scientific discovery remains a high bar.

  ### Calibration & Disagreement

  **Where the disagreement lives:**
  Your colleague's 0.8 credence implies they treat **Term (b)** as near-zero (believing compute is the *only* binding constraint) and **Term (a)** as near-one. Your 0.5 credence likely weights **Term (a)** (architectural limits) or **Term (b)** (non-compute bottlenecks) more heavily. My 0.60 sits between, acknowledging that while cognitive bottlenecks will likely fall, supply chains and energy infrastructure cannot be sped up "a few times" merely by smarter models.

  **Least confident term:**
  **Term (a) on the Strict reading.** We have weak priors on how quickly embodied AI can acquire "tacit know-how" for physical tasks (e.g., troubleshooting a fab machine) compared to cognitive tasks.

