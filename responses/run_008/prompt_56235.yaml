answer: |-
  This is a problem of **diachronic identity** (identity over time) applied to abstract artifacts. In philosophy, the Ship of Theseus usually asks about physical objects. Artworks are trickier because they are *types* (the abstract work) manifested in *tokens* (the manuscript files).

  Your gut says "Same." Your writing group says "Different." Your agent says "Commercial Continuity." All three are operating under different definitions of identity.

  Below is the **Identity Audit**. It is designed to strip away the nostalgia and force a verdict based on specific philosophical criteria translated into craft terms. It contains four tests. If you fail a "Veto Test," the identity is broken, regardless of previous passes. If you pass the "Soft Tests," the identity is preserved by convention, not fact.

  ### The Identity Audit Procedure

  **Instructions:** Run these tests in order. Do not skip. If a test returns a **VETO**, stop. The object is philosophically distinct from its predecessor. If you pass all tests, the object retains identity.

  #### Test 1: Causal Continuity (The "Chain of Custody")
  *Philosophical Basis: Spatio-Temporal Continuity / Locke's Memory Theory.*
  *Question:* Is there an unbroken chain of intentional modification connecting the current state to the original state?
  *   **The Check:** Can you trace every change back to a deliberate decision made in the previous draft/version? Was Draft 2 generated *from* Draft 1? Was Book 2 written *as a sequel* to Book 1?
  *   **Same:** Yes. There is a direct lineage. No version was abandoned and restarted from scratch; each iteration was a modification of the previous one.
  *   **Different:** No. At some point, you stopped revising and started writing something new, then pasted the old file name onto it to save effort or emotional capital.
  *   **Status:** **Necessary but not Sufficient.** (A caterpillar is causally continuous with a butterfly, but they are not the same *thing* functionally).

  #### Test 2: The Invariant Core (The "Dramatic Question")
  *Philosophical Basis: Essentialism / Form over Matter.*
  *Question:* What is the one thing that *must* remain for this to be the same work/character?
  *   **The Check:** Identify the **Dramatic Question** (for a book) or the **Psychological Wound** (for a character).
      *   *Book:* Is the central conflict the same? (e.g., "Can a good person survive a corrupt system?" vs. "Can a corrupt person find redemption?")
      *   *Character:* Is the driving motivation the same? (e.g., "Seeking approval from a absent father" vs. "Seeking power to protect a sibling".)
  *   **Same:** The core thematic argument or psychological driver is identical, even if the plot/setting/voice surrounding it has changed.
  *   **Different:** The thematic argument or psychological driver has shifted. You are solving a different problem with the same tools.
  *   **Status:** **VETO TEST.** If the Core changes, the identity is broken. This is the soul of the work.

  #### Test 3: Agential Source (The "Hand on the Mouse")
  *Philosophical Basis: Authorship / Moral Rights.*
  *Question:* Who is the source of the creative choices?
  *   **The Check:** Look at the prose and the decision-making.
      *   *Book:* Did the same consciousness make the micro-decisions (word choice, rhythm, pacing)?
      *   *Series:* Is the name on the cover the source of the creative vision, or the brand manager?
  *   **Same:** The same mind (or collaborative unit acting as one mind) made the aesthetic choices.
  *   **Different:** The aesthetic choices are being made by a different consciousness, even if following the original creator's outline.
  *   **Status:** **VETO TEST for Authorship.** (Crucial for Case 3).

  #### Test 4: Functional Recognition (The "Shelf Test")
  *Philosophical Basis: Pragmatism / Reception Theory.*
  *Question:* Does it serve the same function for the audience?
  *   **The Check:** If a reader encountered the new version without knowing the history, would they categorize it as the same entity?
  *   **Same:** Yes. It fulfills the same promise (genre, tone, character role).
  *   **Different:** No. It feels like a reboot, a homage, or a different entry in a franchise.
  *   **Status:** **Soft Test.** This determines *marketing* identity, not *ontological* identity. It can be overridden by the Veto Tests.

  ---

  ### Where the Procedure Fails
  You asked for honesty. Here is where the Audit hands it back to your judgment:
  1.  **Threshold of Change:** Test 2 (Invariant Core) is subjective. Only you know if the "Dramatic Question" truly shifted or just deepened. The procedure cannot measure the *degree* of thematic drift.
  2.  **The "Brand" Exception:** In commercial publishing (Case 3), identity is often contractual, not philosophical. The procedure treats "Author" as a creative agent; the market treats "Author" as a trademark. The Audit prioritizes the former; your bank account prioritizes the latter.
  3.  **The Theseus Paradox:** If you pass Test 1 (Causal) but fail Test 2 (Core), you have a **Zombie Identity**. It walks and talks like the original, but the "soul" is gone. The procedure calls this "Different." You may choose to keep the name for sentimental reasons. That is your privilege, but it is not truth.

  ---

  ### Running the Audit on Your Cases

  #### Case 1: The Eleven-Draft Novel
  *   **Test 1 (Causal):** **PASS.** You modified it gradually over 10 years. The file lineage is unbroken.
  *   **Test 2 (Invariant Core):** **UNKNOWN / LIKELY FAIL.** You stated: "Not the plot, not the protagonist (he became a she, then a different she), not the setting, not a single sentence."
      *   *Analysis:* If the protagonist's gender and identity changed twice, and the setting changed, what is the *Dramatic Question*? If the question changed from "How does a man escape his past?" to "How does a woman find her future?", the Core has shifted.
      *   *Verdict:* If the *theme* is the only thing left, you must ask: Is the theme specific enough to define the book? If the theme is generic (e.g., "Love conquers all"), it is not a sufficient Invariant.
  *   **Test 3 (Agential):** **PASS.** You wrote all drafts.
  *   **Test 4 (Functional):** **PASS.** Your agent says it works as the same book.

  **Audit Verdict:** **DIFFERENT BOOK.**
  *Why you might hate this:* You feel the *effort* binds them. But philosophically, if the Dramatic Question shifted along with the gender/setting/plot, Draft 1 is merely the *ancestor* of Draft 11, not the *embryo*. You didn't raise a child; you adopted a new one into the same crib. The "Same Book" label is a sentimentality honoring the decade of labor, not a description of the artifact.

  #### Case 2: The Recurring Character (4 Books)
  *   **Test 1 (Causal):** **PASS.** She appears in a sequence of books intended as a continuum.
  *   **Test 2 (Invariant Core):** **FAIL.** You stated: "New backstory, new voice, and new goals in each one."
      *   *Analysis:* A character *is* their backstory, voice, and goals. If all three change, only the **Name** and **Physical Description** remain. This is not a continuous person; this is a **Legacy Mantle** (like James Bond or Doctor Who).
  *   **Test 3 (Agential):** **PASS.** You created all iterations.
  *   **Test 4 (Functional):** **PASS.** Readers recognize the name and expect a certain role.

  **Audit Verdict:** **DIFFERENT CHARACTER.**
  *Why you might hate this:* You likely view her as "evolving." But evolution requires retention of memory and core drive. If she has a new backstory in Book 4 than Book 1, she is not the same woman. She is a recurring archetype wearing the same skin. Calling her the "same character" is a convenience for the series bible, not a psychological truth.

  #### Case 3: The Co-Written Series Installment
  *   **Test 1 (Causal):** **PASS.** It follows your outline and series arc.
  *   **Test 2 (Invariant Core):** **PASS.** It uses your characters and world.
  *   **Test 3 (Agential):** **VETO.** "Mostly someone else's prose."
      *   *Analysis:* In literary fiction, *style is substance*. If the prose rhythm, word choice, and narrative voice belong to the co-writer, the *agency* of the text is split. Your name is on the cover, but your "hand" is not on the mouse.
  *   **Test 4 (Functional):** **PASS.** It sells as your series.

  **Audit Verdict:** **SAME SERIES, DIFFERENT AUTHORIAL VOICE.**
  *Why you might hate this:* This is the "Ghostwriter" problem. Legally, it is your book. Philosophically, it is a collaboration where the primary aesthetic agent changed. The "You" on the cover is now a **Brand Entity**, not the **Biological Author**.

  ### Summary of Findings

  1.  **The Novel:** Likely a **Different Book**. The causal chain exists, but without a stable Dramatic Question, it is a new vessel built from the lumber of the old one.
  2.  **The Character:** Likely a **Different Character**. She is a Legacy Mantle.
  3.  **The Co-Write:** **Same Brand, Different Author.**

  **The Hard Truth:** Your suspicion is correct. Your gut says "Same" because of **Sunk Cost Fallacy** (the 10 years spent) and **Brand Continuity** (the need for the series to make sense).

  The Audit suggests you are not preserving identity; you are **curating a lineage**. There is nothing wrong with that—many great series do this (Doctor Who, Sherlock Holmes adaptations, the James Bond franchise). But stop calling it the "Same Ship." It is a new ship, sailing under the same flag. Acknowledge that, and you might stop staring at the files and start writing the next one.
