  *(Self-Correction Note on Conclusion 3)*: I need to be careful not to dismiss the intuition behind Conclusion 3 entirely. There *are* paradoxes in law and economics (e.g., the paradox of sovereignty). But linking them *directly* to Gödel's arithmetic theorem is the weak point. I should distinguish between "Gödelian incompleteness" and "general self-referential paradox."

