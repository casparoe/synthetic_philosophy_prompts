      *   **User's Goal:** Wants an "honest map of this position's exposure." Wants to know what would make them wrong. Wants specific defeaters ranked (fatal, serious, awkward). Wants to know if the view is unfalsifiable/insulated.
      *   **Tone:** Respectful, intellectually honest, clear (avoiding jargon where possible), rigorous but accessible.

  2.  **Deconstruct the User's Three Conclusions:**

