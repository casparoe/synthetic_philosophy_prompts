answer: |-
  **ADVERSARIAL COLLABORATION STATEMENT: THE STRUCTURE OF THE SIDE-EFFECT ASYMMETRY**

  **Authors:** [Penetration Theorist Name] & [Pragmatics Theorist Name]
  **Date:** October 26, 2023
  **Subject:** Joint Stipulations, Disagreements, and Proposed Adjudications Regarding the Knobe Effect

  ### Section 1: Numbered Agreed Claims

  The undersigned parties agree to the following stipulations regarding the empirical landscape and the metatheoretical framework within which this dispute is conducted.

  1.  **Empirical Robustness:** The basic side-effect asymmetry is a robust empirical phenomenon. In standard chairman-type vignettes, agents who foresee a harmful side effect are judged to have brought it about intentionally at significantly higher rates than agents who foresee a beneficial side effect, despite identical statements of indifference regarding the side effect. This pattern replicates across varied vignette contents and is not an experimental artifact.
  2.  **Context Sensitivity:** The magnitude of the asymmetry is sensitive to contextual framing, specifically regarding what the vignette makes salient about the agent's reasons and the normative status of the outcome. However, no single rewording of the standard vignette has eliminated the effect entirely.
  3.  **Domain Generality:** Parallel asymmetries have been documented for other evaluatively loaded terms, including ascriptions of causation, decision-making, and certain kinds of knowledge (e.g., "knows that"). Both parties agree these parallel effects warrant a unified or structurally similar explanation.
  4.  **Heuristics and Competence:** Both parties accept that ordinary concept application can be driven by heuristics without those heuristics constituting performance errors. A judgment can be systematic and reliable without reflecting the strict truth-conditional semantics of the term in question.
  5.  **Metatheoretical Compatibility:** A pragmatic explanation and a conceptual explanation need not be rivals if they describe different levels of analysis. However, regarding the specific question of whether moral valence determines the *extension* of the concept "intentional" versus the *assertability* of claims using that concept, the parties maintain competing hypotheses.
  6.  **Concessions:**
      *   The Pragmatics Theorist concedes that the pattern is too robust to be dismissed as mere noise or confusion on the part of experimental subjects.
      *   The Penetration Theorist concedes that not every moral influence on judgment constitutes conceptual penetration; some influences may be post-judgmental or attributable to bias without altering the core concept.

  ### Section 2: Disagreements Table

  The following table outlines the specific points of divergence. Each formulation is phrased such that the respective proponent endorses it as an accurate description of their position.

  | Issue | Penetration Theorist Formulation | Pragmatics Theorist Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Implication for the Concept** | The asymmetry shows that moral valence is a constitutive condition for the application of the concept *intentional action*. The extension of the concept is partially determined by evaluative facts. | The asymmetry shows that moral valence determines the conversational relevance of describing an action as *intentional*. The extension of the concept is morally inert; the usage is norm-governed. | Substantive |
  | **2. Subject Computation** | When a subject judges "X did Y intentionally," they are computing whether X's action satisfies a definition that includes a clause regarding the badness of Y. | When a subject judges "X did Y intentionally," they are computing whether X's action satisfies a neutral definition, then determining if asserting this is appropriate given norm violations. | Substantive |
  | **3. Nature of the Norm** | The driving factor is specifically *moral* wrongness. Violating a statistical expectation without moral weight does not generate the full asymmetry. | The driving factor is *norm violation* broadly construed. Violating what people tend to do (statistical norm) can trigger the pragmatic inference, even absent moral outrage. | Empirical |
  | **4. Generalization** | The effect generalizes to non-agency concepts (e.g., causation) because those concepts are also evaluatively penetrated. Evaluation is a general feature of folk psychology. | The effect generalizes because conversational norms regarding explanation and blame apply generally to causal and epistemic claims, not because the concepts themselves are moral. | Verbal |
  | **5. Locus of Penetration** | If penetration is real, it tells us about the concept's **semantics**. The truth conditions of "intentionally" vary with moral context. | If penetration is real, it tells us about the concept's **use**. The assertability conditions vary, but the truth conditions remain constant. | Substantive |

  ### Section 3: Cruxes

  The parties identify three specific cruxes where further argument or evidence could adjudicate the dispute. For each, we specify the test case or hypothetical result and record our predictions in advance.

  **Crux 1: The Safety Official Case (Normative Aggregation)**
  *   **Case Description:** A safety official approves a cost-saving procedure knowing that, as a side effect, it will expose Group A (10 workers) to a specific hazard while funding a protection that will spare Group B (100 workers) from a greater hazard. She states she cares only about the budget. Whether her decision harmed or helped overall depends on a prior normative judgment about aggregation and the voluntariness of the risk.
  *   **Penetration Theorist Prediction:** Subjects' intentionality judgments will track their *overall moral evaluation* of the outcome. If subjects judge the net outcome as "good" (utilitarian aggregation), they will deny the official intentionally harmed Group A. If they judge it "bad" (rights-based violation), they will affirm she intentionally harmed them. The intentionality ascription follows the moral verdict.
  *   **Pragmatics Theorist Prediction:** Subjects' intentionality judgments will track the *salience of the local norm violation* regarding Group A, regardless of the net utility. Because the official knowingly exposed Group A to risk (violating a specific safety norm), the "harm" description becomes conversationally relevant. Intentionality ascriptions will remain high for the harm to Group A even if the net outcome is judged beneficial.
  *   **Adjudication:** If intentionality tracks net moral utility, this supports Penetration. If intentionality tracks the specific side-effect violation despite net utility, this supports Pragmatics.

  **Crux 2: The Norm-Free Population (Hypothetical Empirical Result)**
  *   **Hypothetical Result:** A large-scale replication finds the asymmetry wholly absent in Population Z. Members of Population Z plainly possess and use the concept of *intentional action* correctly in neutral contexts, but their social norms assign no prescriptive force to the agent's role (i.e., no expectation that agents *ought* to prioritize side-effects).
  *   **Penetration Theorist Stance:** This would be **disconfirming**. If the concept is morally penetrated, the asymmetry should arise from the moral valence of the outcome (harm vs. help), which is universalizable. If the effect vanishes due to a lack of prescriptive role norms, it suggests the effect relies on external normative expectations, not the concept's internal structure.
  *   **Pragmatics Theorist Stance:** This would be **confirming**. The pragmatic account relies on the violation of expectations or norms to trigger conversational relevance. If Population Z has no prescriptive norms regarding the agent's role, there is no norm violation to trigger the implicature. The absence of the asymmetry is exactly what the pragmatic model predicts for a norm-free context.

  **Crux 3: Non-Moral Norm Violations (Etiquette vs. Morality)**
  *   **Test Case:** A vignette where an agent violates a rule of etiquette (e.g., wearing white to a wedding) as a side effect of pursuing a goal, versus a vignette where the agent violates a moral rule.
  *   **Penetration Theorist Prediction:** The asymmetry will be significantly weaker or absent in the etiquette case. Moral penetration requires *moral* valence. Mere convention violation does not penetrate the concept of intentional action.
  *   **Pragmatics Theorist Prediction:** The asymmetry will be present in the etiquette case, provided the violation is salient and the agent expresses indifference. Any norm violation (moral or conventional) makes the side effect conversationally relevant, licensing the intentionality inference.
  *   **Adjudication:** A robust asymmetry in the etiquette condition favors the Pragmatics view (norm violation generally); a null result favors the Penetration view (moral valence specifically).

  ### Section 4: Closing Verdict on Residual Verbal Disagreements

  We conclude by addressing whether the dispute remains substantive if we accept a functionalist individuation of concepts.

  **The Functional Individuation Question:**
  If the concept of *intentional action* is individuated by its role in the practice of holding responsible, is there still a substantive fact of the matter about whether moral considerations shape the concept itself or only the practice in which it is deployed?

  **Joint Verdict:**
  If one adopts a framework where the "concept" is defined strictly by its inferential role within responsibility practices, the disagreement becomes largely **verbal**. Under this description, both parties agree that moral considerations systematically govern the *application* of the term in those practices. The Penetration Theorist calls this governance "semantics"; the Pragmatics Theorist calls it "pragmatics." If the function of the term is to allocate blame, and blame is moral, then the term's application conditions will inevitably correlate with moral facts regardless of the label applied to the mechanism.

  **Surviving Substantive Disagreements:**
  However, two substantive disagreements survive this verbal dissolution:

  1.  **Cognitive Architecture:** It remains a substantive empirical question whether the cognitive mechanism producing the judgment accesses moral properties *during* the retrieval of the concept (Penetration) or *after* the retrieval of the concept to determine assertability (Pragmatics). This has implications for reaction time data, neural correlates, and developmental trajectories.
  2.  **Cross-Domain Stability:** It remains a substantive question whether the moral influence is limited to agency concepts or extends to domains where responsibility practices are less central (e.g., purely descriptive causal claims about inanimate objects). The Penetration Theorist predicts moral influence wherever the folk concept is evaluatively laden; the Pragmatics Theorist predicts moral influence only where there is a potential agent to hold accountable or a norm to violate.

  **Conclusion:**
  While we may disagree on whether to label the mechanism "semantic penetration" or "pragmatic implicature," we agree that the folk practice of ascribing intentionality is inextricably linked to normative evaluation. Future work should focus less on defining the boundary of "the concept" and more on mapping the specific cognitive and social variables that modulate this link.
