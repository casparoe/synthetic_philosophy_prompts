      *   **Argument Step 2 (Noise Objection):** Objection: Coarse leaves out noise. Response: Noise is microsecond, behavior is millisecond. Averaging preserves function. (This seems reasonable within a functionalist framework, but assumes functionalism without defending it against non-functionalist views).
      *   **Argument Step 3 (Nagel):** Cites Nagel ("What is it like to be a bat"). Claims Nagel shows *no* behavioral/physiological evidence can bear on experience. Claims we can't get evidence Coarse suffers. Claims precaution requires possibility of evidence. Conclusion: Case for hesitating collapses. (This is a significant misreading of Nagel. Nagel argues subjectivity is irreducible, not that evidence is impossible or that precaution is invalid. Also, this contradicts Step 1 which claimed we *know* they have experiences via functionalism).
      *   **Argument Step 4 (Moral Status/Agency):** Objection: Might have experiences, deserves caution. Response: Caution has limits. Coarse can't deliberate/praise/blame/form intentions. Moral status is for agents responsible for what they do. (This is a category error. Moral *status* (being a patient) is usually distinct from moral *agency* (being responsible). Pain capacity grants patient status, not agency. This contradicts Step 1 which admitted they might have pain).
