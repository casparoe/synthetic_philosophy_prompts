  For my philosophy of mind course we just did the extended mind stuff (Clark and Chalmers, Otto and his notebook, all that), and my friend Freya has become weirdly invested in it — she keeps ruling on whether things count as part of someone's mind or not, like a one-person court. Her verdicts so far: Otto's notebook, yes, obviously extended. Her own notes app, which she checks maybe 40 times a day and trusts without thinking, yes. Doing long division on paper where the page holds the intermediate digits, yes — she says the paper is literally doing the storing part of working memory. Her gran's diary, which only gets read every New Years for nostalgia and isn't relied on for anything, no. A delivery driver who follows sat-nav all day, sometimes mutters that it's picked a stupid route but follows it anyway, no — she said it's his tool, not part of him. And her flatmate Priya, who reliably remembers Freya's dentist appointments and gets asked whenever it comes up — yes, extended, which surprised me because Priya is a person and not an object Freya carries around.

