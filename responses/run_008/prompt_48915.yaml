answer: |-
  This is a fantastic setup. You've correctly identified that Freya isn't just blindly applying Clark and Chalmers' *Parity Principle* (Rule 1); she's smuggling in a stricter condition about *how* the coupling works (Rule 2).

  Here is the breakdown of the rules she's actually running, my predictions for your pub argument, and the "tie-breaker" case to expose her true criteria.

  ### 1. The Two Candidate Rules

  You've spotted the tension perfectly. Here is how they map onto her previous verdicts:

  **Rule 1: The Parity/Trust Criterion (Clark & Chalmers Standard)**
  *   **The Gist:** If an external resource is reliably available, easily accessible, and automatically trusted (endorsed) as if it were internal memory, it counts as part of the mind.
  *   **Fits:** Otto's Notebook, Notes App, Gran's Diary (No, due to lack of access/trust), Priya.
  *   **Struggles:** The Sat-Nav. The driver uses it constantly and relies on it, yet Freya said "No." Under Rule 1, the Sat-Nav *should* be Yes.

  **Rule 2: The Constitutive/Transparency Criterion (Active Coupling)**
  *   **The Gist:** The external resource must function as a *workspace* for cognitive processing, not just an *oracle* that delivers outputs. The user must be able to see "how" the information is held or manipulated (transparency), rather than just obeying a command from a black box.
  *   **Fits:** Long Division Paper (holds intermediate steps, user does the math), Otto's Notebook (transparent storage).
  *   **Explains the Sat-Nav "No":** The Sat-Nav gives commands ("Turn Left"). The driver doesn't navigate; he obeys. The cognitive work is outsourced, not extended.
  *   **Explains Priya "Yes":** Freya likely views Priya as a "social hard drive" (storage/retrieval) rather than an oracle giving commands.

  ### 2. Predictions for the New Cases

  Based on the fact that she rejected the Sat-Nav (high reliance, but black-box output) but accepted the Long Division Paper (active manipulation), Freya is weighting **Rule 2** heavier than Rule 1. She cares about *integration*, not just *reliability*.

  Here is what she will likely rule:

  **(a) The Cousin and the AI Assistant: NO**
  *   **Why:** This is the critical case. While it passes Rule 1 (open constantly, default trust), it fails Rule 2. The AI is a "black box" that generates finished outputs (text/answers). The fact that the cousin has to **spot-check** is the killer; it breaks the "automatic endorsement" condition, but more importantly, it treats the AI as a tool to be audited, not a transparent part of the cognitive loop. It's too close to the Sat-Nav (an oracle you follow but don't fully trust/understand).
  *   **Freya's likely line:** "She's not thinking *with* it; she's checking its homework. It's a consultant, not a cortex."

  **(b) The Rambler with Map and Compass: YES**
  *   **Why:** This aligns with the Long Division Paper. A map doesn't tell you "Turn Left"; it provides a spatial workspace where the rambler aligns terrain with representation. The cognitive load of "Where am I?" is distributed across the eyes, the brain, and the paper. It is transparent and manipulated actively.
  *   **Freya's likely line:** "The map is holding the spatial relationships so her brain doesn't have to. It's working memory for space."

  **(c) The Shared Whiteboard: YES**
  *   **Why:** This is Otto's Notebook, but social. It is transparent storage. Everyone in the flat treats it as the "belief store" for chores. It passes both Rule 1 and Rule 2.
  *   **Freya's likely line:** "It's just Otto's notebook with more authors. The flat is the mind."

  **(d) The Filing System Person: YES**
  *   **Why:** This is functionally identical to Otto's Notebook. Knowing *where* the info is, such that retrieval is automatic, counts as the dispositional belief. The content is stored externally, but the index is internal.
  *   **Freya's likely line:** "She knows how to retrieve the belief instantly. The cabinet is just the storage medium."

  ### 3. Where the Rules Diverge

  You noted the AI and Map cases are where the rules might split. You are right, but the **AI case** is the strongest divergence point.

  *   **Rule 1 (Trust/Access)** predicts **YES** for the AI. (It's always on, default trust, relied upon for uni work).
  *   **Rule 2 (Processing/Transparency)** predicts **NO** for the AI. (It's a black-box output generator, requires verification, akin to Sat-Nav).

  If Freya says **Yes** to the AI, she is a standard Clark & Chalmers functionalist (Rule 1). If she says **No**, she is a "active coupling" theorist (Rule 2). Given her Sat-Nav verdict, I'm betting she says **No**.

  ### 4. The Tie-Breaker Case

  To settle which rule she is *really* using, you need a case where Trust is High, but Processing is Outsourced (Black Box).

  **Put this case to her:**
  > "Imagine a mathematician who uses a **calculator** for every step of a complex proof. She trusts it completely, never double-checks it, and has used the same one for 10 years. She punches in the numbers, reads the result, and writes it down. Is the calculator part of her mind?"

  **Why this settles it:**
  *   **Rule 1 (Trust/Access):** **YES.** It is perfectly reliable, constantly available, and automatically trusted. It is functionally equivalent to a very fast internal calculation module.
  *   **Rule 2 (Processing/Transparency):** **NO.** This contrasts directly with her **Long Division Paper** verdict. On the paper, *she* did the math and the paper held the digits. With the calculator, the *machine* does the math and she just reads the output.
  *   **The Connection:** If she says the Paper is part of the mind (Yes) but the Calculator is not (No), she is committed to the view that **the human must do the processing, and the object must only store/mediate.** If she says the Calculator *is* part of the mind, then her "No" on the Sat-Nav was inconsistent, and she's actually just following Rule 1 (with a wobble on the Sat-Nav because the driver complained about it).

  **My bet:** She'll say **No** to the calculator. She seems invested in the idea that the *agent* must be actively manipulating the information, not just reading outputs from a reliable tool. That's the "Transparency" condition, and it's the hidden engine of her court.
