  6.  **Checking for Joint Unsatisfiability (The "Badly Posed" Question):**
      *   Is there a contradiction?
      *   *Problem:* To prove inevitability, you need to define the discovery broadly. To prove contingency, you define it narrowly.
      *   *The Trap:* If the theory requires *precise* identity conditions (exact math, exact words), inevitability fails. If it requires *functional* identity (solves the same problem), contingency fails.
      *   *Conclusion:* The question might be ill-posed because "the discovery" is not a natural kind. It's a retrospective construction. This is a key insight from Hacking and Kuhn.

  7.  **Evaluating the Three Views:**
