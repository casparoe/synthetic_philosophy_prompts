answer: |-
  This is a sophisticated pivot. You've moved from fighting over the *answer* to fighting over the *question*, which is where the actual philosophy of science lives. Your intuition is correct: the debate often stalls because "inevitability" is a slippery predicate that changes shape depending on how tightly you define "the discovery."

  Below is the specification sheet (desiderata) for a theory of scientific change, followed by the stress test you asked for. I have flagged where historians and philosophers actually agree versus where they are still at war.

  ### Part 1: The Desiderata (The Spec)

  Any adequate theory of inevitability vs. contingency must satisfy the following requirements.

  **1. The Identity Condition (What counts as "It"?)**
  *   **Requirement:** The theory must define the identity conditions of a discovery. Does "calculus" mean the fundamental theorem, the specific notation, the ability to solve planetary orbits, or the institutional acceptance of the method?
  *   **Reason:** Inevitabilists tend to define discoveries functionally ("a method for calculating rates of change"), while contingentists define them historically ("Newton's *fluxions*"). If you define the target broadly, inevitability looks true. If you define it narrowly, contingency looks true. A theory cannot slide between these definitions mid-argument.

  **2. The Temporal Granularity Requirement**
  *   **Requirement:** The theory must distinguish between three time-horizons:
      1.  *Eventual:* Someone would have found this given infinite time.
      2.  *Epochal:* Someone would have found this within the specific technological/cultural epoch (e.g., within 50 years).
      3.  *Specific:* This specific person/group would have found it *now*.
  *   **Reason:** As you noted, "someone would eventually have found it" is a trivial claim (almost everything is inevitable over 10,000 years). The interesting claim is the *Epochal* one. Most debates conflate *Eventual* with *Epochal*.

  **3. The Multiples and Near-Miss Dataset**
  *   **Requirement:** The theory must account for Robert Merton's "Multiples" (independent simultaneous discovery) *and* the "Singletons" (unique discoveries) and "Sleeping Beauties" (papers ignored for decades then rediscovered).
  *   **Reason:** Citing only multiples (Newton/Leibniz) is the inevitabilist's selection bias. Citing only sleeping beauties (Mendel) is the contingentist's selection bias. A robust theory must explain the *ratio* and the *conditions* for each.

  **4. The Counterfactual Data Problem**
  *   **Requirement:** The theory must state how it validates claims about paths not taken.
  *   **Reason:** You correctly identified the selection effect (we don't see the discoveries that didn't happen). But the reverse is also true: we don't see the *failures* that were inevitable. How do we weigh the "near misses"? (e.g., Babbage's Analytical Engine was technically possible but not built; was the computer inevitable in the 1840s?) The theory needs a method for weighting counterfactuals that isn't just storytelling.

  **5. The Infrastructure Constraint**
  *   **Requirement:** The theory must separate *conceptual possibility* from *material feasibility*.
  *   **Reason:** Da Vinci designed helicopters. Was the helicopter "in the air" in 1500? No, because the materials and engine theory didn't exist. A theory must distinguish between "the idea was ready" and "the world was ready."

  ---

  ### Part 2: Classification of Requirements

  Here is where we separate the methodological necessities from the ideological battlegrounds.

  **Non-Negotiable (Methodological Baselines)**
  *   **Temporal Granularity:** Any argument that conflates "eventually" with "within a generation" is logically invalid. This is not a camp preference; it is a requirement for coherent speech.
  *   **Infrastructure Constraint:** You cannot claim a discovery was inevitable if the tools to verify it did not exist. (e.g., You can't discover the Higgs boson in 1850). This is settled physics/history.
  *   **Selection Effect Acknowledgement:** Both sides must admit that history is filtered. We do not have a complete dataset of failed experiments or ignored insights.

  **Camp-Specific Preferences (Contested Weighting)**
  *   **The Identity Condition:** This is the main fight.
      *   *Inevitabilist Preference:* Prefers **Functional Identity**. (If it solves the same problem, it's the same discovery).
      *   *Contingentist Preference:* Prefers **Historical Identity**. (If the conceptual framework differs, it's a different discovery).
      *   *Verdict:* This is not settled. It depends on whether you view science as uncovering pre-existing truths (Realism) or constructing frameworks (Constructivism).
  *   **The Counterfactual Data:**
      *   *Inevitabilist Preference:* Treats multiples as statistical proof of pressure.
      *   *Contingentist Preference:* Treats multiples as exceptions that prove the rule, emphasizing the specific social networks required.
      *   *Verdict:* There is no agreed statistical method for weighing counterfactuals in history. This is a known methodological hole in the field.

  ---

  ### Part 3: The Unsatisfiability Check

  **Is this list jointly satisfiable?**

  **No.** There is a fundamental tension between **Requirement 1 (Identity)** and **Requirement 3 (Multiples)** that suggests the question may be badly posed.

  Here is the contradiction:
  To satisfy the **Multiples** requirement (showing inevitability), you must define the discovery broadly (Functional Identity). If Newton and Leibniz are counted as finding "the same thing," you must ignore that their metaphysics, notation, and proofs differed significantly.
  To satisfy the **Near-Miss/Singleton** requirement (showing contingency), you must define the discovery narrowly (Historical Identity). If you look closely at the "multiples," they often turn out to be different things solving similar problems.

  **The "Category Error" Risk:**
  Philosopher of science **Ian Hacking** (specifically in *Historical Ontology*) argues that this debate often rests on a category error. He suggests that scientific *kinds* (like "child abuse," "quarks," or even "calculus") are not natural kinds waiting to be found, but are created by the practices that identify them.
  If the "thing" being discovered is *constituted* by the historical moment, asking if it was "inevitable" is like asking if it was inevitable that Shakespeare would write *Hamlet*. The language had to exist first. The concept of "the discovery" is retrospective. We draw the boundary around the achievement *after* we know it succeeded.

  **Conclusion on Unsatisfiability:**
  You cannot satisfy the spec without first resolving the ontology of scientific truth.
  *   If scientific truths exist independently of humans (Realism), Inevitability is plausible.
  *   If scientific truths are co-constructed by human practices (Constructivism), Inevitability is incoherent.
  *   **Since there is no consensus on Realism vs. Constructivism, the Inevitability Question is currently unresolvable.** It is not merely open; it is dependent on a prior metaphysical commitment that is itself contested.

  ---

  ### Part 4: The Scorecard (Brief)

  **1. The Strong Inevitabilist (e.g., Steven Weinberg, some Realists)**
  *   *Performance:* Fails the **Identity Condition**. They assume "Nature" dictates the answer, so any path leading there is the "same" discovery. They handle **Multiples** well but dismiss **Lag Time** as mere friction.
  *   *Verdict:* Logically consistent only if you accept Scientific Realism as a premise.

  **2. The Strong Contingentist (e.g., Kuhn, Social Constructivists)**
  *   *Performance:* Fails the **Temporal Granularity**. They often make everything seem radically contingent, struggling to explain why certain technologies converge globally (e.g., nuclear fission discovered independently in Germany, US, UK, USSR within years).
  *   *Verdict:* Explains the *path* well, but struggles to explain the *convergence*.

  **3. The "Ripe Time" / Middle View (e.g., Thomas Merton, moderate Historians)**
  *   *Performance:* Best fit for the **Data Problems**. Acknowledges that material conditions create a "possibility space" (inevitability) but human agency determines the specific traversal (contingency).
  *   *Verdict:* Most empirically robust, but philosophically "fuzzy." It kicks the can down the road by saying "it depends on the scale."

  ---

  ### Part 5: Settled vs. Contested (Crucial Context)

  You asked to separate what is known from what is fought over. Here is the landscape:

  **Settled (Consensus among Historians/Philosophers)**
  *   **Multiples happen:** Merton's 1961 study on "Singletons and Multiples" is empirical data, not theory. Simultaneous discovery is a frequent historical occurrence.
  *   **Selection Bias exists:** Everyone agrees historiography suffers from "Winner's Bias." We know more about the successful theory than the failed competitor.
  *   **Infrastructure matters:** No one argues discoveries happen without the material means (telescopes, particle accelerators, funding).

  **Genuinely Contested (No Consensus)**
  *   **The Ontology of Discovery:** Does the discovery *exist* before it is found? (Realism vs. Constructivism). This is the metaphysical engine driving the inevitability debate. **This is not settled.**
  *   **Counterfactual Validity:** Is it valid historical methodology to argue "If X hadn't happened, Y would have"? Some historians (e.g., Niall Ferguson) say yes; others say it's fiction. There is no agreed-upon test for counterfactual claims in history.
  *   **The Weight of Multiples:** Does the existence of Newton/Leibniz prove inevitability, or does it just prove that once the *preconditions* were met, the *specific* formulation was still contingent? (i.e., They both found "calculus," but they didn't find the *same* calculus).

  **Correction on Your Premise:**
  You mentioned: *"nobody writes a book about the discoveries that had to wait 80 years for someone to show up."*
  *   **Correction:** Actually, historians *do* write about this. It's called the history of "premature discovery" or "neglected priority." (e.g., Gregor Mendel, Ignaz Semmelweis). The data exists. The disagreement is not about whether the data exists, but **whether these cases are anomalies or the rule.** Your friend thinks they are anomalies; you think they are the rule. Neither of you has the dataset to prove the frequency distribution.

  ### Summary for Your Next Argument
  Don't argue about Newton or Darwin. Argue about the **Identity Condition**.
  Ask your friend: *"If Leibniz had won and Newton's work was lost, and we all used Leibniz's notation and metaphysical grounding today, would you say we found the 'same' discovery? If yes, on what grounds? If no, then the discovery wasn't inevitable, only the problem was."*

  That forces the spec into the open.
