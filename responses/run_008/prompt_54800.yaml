      *   *Identity Conditions:* This is a major philosophical sticking point (Kuhn vs. Realists). I need to flag this as contested.
      *   *Counterfactuals:* This is the hardest part. How do you prove a negative? (Jared Diamond vs. Ian Hacking debate is relevant here).

  5.  **Categorizing Requirements (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Internal consistency, defining terms (what is "the discovery"?), acknowledging selection bias.
