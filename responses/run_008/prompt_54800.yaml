  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: Scope of Cases.* Must handle multiples (Merton's "Multiples"), but also "Singletons" (unique discoveries) and "Sleeping Beauties" (delayed recognition).
      *   *Requirement 2: Temporal Granularity.* Must distinguish between "eventually" (infinite time) and "specific historical window" (e.g., within 50 years). This addresses the user's point about sliding between definitions.
      *   *Requirement 3: Identity Conditions.* What counts as the "same" discovery? (Formalism vs. Conceptual understanding). Newton/Leibniz used different notation. Darwin/Wallace had different mechanisms.
      *   *Requirement 4: Counterfactual Robustness.* How do we weigh paths not taken? (The data problem).
      *   *Requirement 5: Social/Material Infrastructure.* Must account for *why* a discovery happens when it does (tools, funding, language).

  4.  **Refining the Desiderata (Checking against Scholarship):**
      *   *Merton's Multiples:* This is a well-documented empirical phenomenon (Robert K. Merton, 1961). It's not *disputed* that multiples happen, but their *significance* for inevitability is contested.
