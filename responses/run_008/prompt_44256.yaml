      *   *Inner Message:* The actual content *after* decoding. The images, the sounds, the greetings.
      *   *Key Insight:* Meaning isn't *in* the object; it's triggered in the receiver. The "Outer Message" builds the isomorphism required for the "Inner Message" to make sense.

  3.  **Map the Voyager Record to the Framework:**
      *   *Frame Message:* The physical object itself traveling through space? The gold plating (durability)? The etched cover *as an object* distinct from the disk?
          *   *Refinement:* The etched aluminum cover is the primary Frame. It says "Artifact, not asteroid." The pulsar map says "Origin point exists."
      *   *Outer Message:* The diagrams on the cover. Hydrogen spin transition (time/frequency standard). Diagram of stylus placement. Radial calibration. This establishes the *syntax*.
