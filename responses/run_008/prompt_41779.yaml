      *   Philosophical parallel: This maps very well to the distinction between "strictly better than" and "indifferent to" (or "roughly equal in value").
      *   Distortion: In philosophy, the question is whether the underlying value *itself* is vague, or whether our *access* to it is vague. In floats, the underlying value is precise, but the comparison is tolerant. In value theory, some argue value itself might be vague (ontic vagueness).

