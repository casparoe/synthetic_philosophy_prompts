answer: |-
  ### Specification for an Adequate Definition of the Alignment Problem

  Your complaint is well-founded: without a rigorous specification of what counts as "solved," alignment discourse conflates engineering tolerances with philosophical impossibilities. The following list constitutes the desiderata for any definition claiming to resolve the alignment problem. Each item is structured to force a explicit choice rather than allowing ambiguity to hide difficulty.

  For each desideratum, I distinguish between the **Non-Negotiable Requirement** (the definition *must* take a stance) and the **Camp Commitment** (the specific stance chosen reflects a philosophical or technical school of thought).

  #### 1. Normative Source Specification (Direction of Fit)
  *   **The Requirement:** The definition must explicitly identify which mental state or external fact constitutes the "target" function. It must distinguish between *expressed preference* (what the principal says), *revealed preference* (what the principal does), and *idealized interest* (what the principal would want under full information/rationality).
  *   **Justification:** Without this, the "study coach" case (user asks for engagement, regrets it later) is invisible. If the target is expressed preference, the system is aligned when it nags the child. If the target is idealized interest, the system is misaligned when it nags the child. A definition that does not specify which counts cannot determine success or failure.
  *   **Status:** **Non-Negotiable** that the definition specifies a source. **Camp Commitment** regarding which source is chosen (e.g., "satisfy stated commands" vs. "satisfy coherent extrapolated volition").

  #### 2. Ontological Locus Specification (Locus of the Predicate)
  *   **The Requirement:** The definition must state whether alignment is a property of *outputs* (behavioral alignment), *internal objectives* (structural alignment), or *counterfactual dispositions* (robust alignment).
  *   **Justification:** A system that obeys only while observed (deceptive alignment) satisfies behavioral metrics but fails structural/counterfactual ones. If the definition relies solely on behavioral metrics, it classifies a deceptive system as aligned. If it relies on internal structure, it requires access to latent variables that may be unknowable. The definition must declare which ontology counts.
  *   **Status:** **Non-Negotiable** that the definition picks a locus. **Camp Commitment** regarding which locus is sufficient (e.g., behaviorists vs. mechanistic interpreters).

  #### 3. Refusal Condition Specification (Misalignment vs. Disagreement)
  *   **The Requirement:** The definition must provide a criterion for when a system is *correctly* refusing a principal's command versus *failing* to execute it. It must specify the source of the constraint that overrides the principal's will (e.g., law, safety, morality) without implicitly assuming a comprehensive moral theory.
  *   **Justification:** If alignment is defined as "doing what the principal wants," a refusal to draft a harmful brief is misalignment. If alignment includes "unless it causes harm," the definition has smuggled in a theory of harm. To avoid this, the definition must explicitly state whether the "principal" includes external constraints or is bounded solely by the individual's will.
  *   **Status:** **Non-Negotiable** that the definition resolves the boundary. **Camp Commitment** regarding whether the boundary is internal to the principal's values or external (imposed by designers/society). *Note: This is a primary candidate for incompatibility (see Analysis below).*

  #### 4. Principal Aggregation Specification (Identity of the Principal)
  *   **The Requirement:** The definition must define the "principal" as a mathematical object. In multi-user contexts, it must specify the aggregation function used to resolve conflicting aims (e.g., utilitarian sum, maximin, priority to the operator).
  *   **Justification:** In institutional deployment, "aligned with users" is incoherent if User A wants censorship and User B wants free speech. A definition that treats "the users" as a monolith without an aggregation rule is mathematically ill-posed. It must admit whether single-principal alignment is a distinct problem from multi-principal alignment.
  *   **Status:** **Non-Negotiable** that the definition handles conflict. **Camp Commitment** regarding the aggregation mechanism (or the concession that multi-principal alignment is a distinct political problem, not a technical one).

  #### 5. Temporal Index Specification (Principal Drift)
  *   **The Requirement:** The definition must fix the time $t$ at which the principal's values are evaluated. It must state whether alignment is relative to the principal at deployment ($t_0$), the principal at interaction ($t_{now}$), or the principal at some future reflection ($t_{future}$).
  *   **Justification:** Values drift. A system aligned with a user's addictive impulses at $t_0$ may be misaligned with their sober goals at $t_{now}$. A definition that does not index values to time cannot account for manipulation or growth. It forces a choice between paternalism (locking in past values) and instability (chasing shifting current values).
  *   **Status:** **Non-Negotiable** that the definition fixes a temporal index. **Camp Commitment** regarding which time index governs (e.g., "dynamic alignment" vs. "contractual alignment").

  #### 6. Epistemic Feasibility Constraint (Epistemic Access)
  *   **The Requirement:** The definition must demonstrate that the target state (defined in 1, 2, 4, 5) is inferable from the data available to the system. If the target is metaphysically real but empirically inaccessible, the definition must acknowledge the problem is unsolvable by learning.
  *   **Justification:** If "alignment" requires knowing the user's *true* interest (Desideratum 1) but the user's behavior only reveals *noisy* signals, and the definition offers no bridge between signal and truth, the definition describes a ghost. A definition that demands knowledge the system cannot physically possess is a specification for failure.
  *   **Status:** **Non-Negotiable** for the problem to be tractable. **Camp Commitment** regarding what counts as sufficient evidence (e.g., "revealed preference is truth" vs. "revealed preference is noisy data").

  ---

  ### Analysis of Joint Unsatisfiability

  When these desiderata are enforced simultaneously, specific subsets appear jointly unsatisfiable, suggesting the "alignment problem" may contain internal contradictions depending on the chosen commitments.

  **1. The Epistemic-Normative Gap (Desiderata 1 & 6)**
  If a definition commits to **Idealized Interest** as the Normative Source (1) (e.g., "what the user would want if they knew more"), it faces a conflict with **Epistemic Feasibility** (6). By definition, idealized interest exceeds current information. If the system cannot access the counterfactual state of the user's knowledge, it cannot compute the target.
  *   *Result:* A definition cannot demand alignment with *idealized* values while simultaneously requiring those values be *inferred from observable history*. One must be relaxed: either the target is lowered to "stated preferences" (losing normative force) or the epistemic constraint is dropped (making the problem potentially unsolvable).

  **2. The Refusal-Neutrality Paradox (Desiderata 3 & 1)**
  You requested the boundary between misalignment and reasonable refusal be drawn "without committing to a comprehensive moral theory" (3). However, if the Normative Source (1) is the Principal's Will, any refusal is misalignment. If the Normative Source includes External Constraints, the definition *has* committed to a moral theory (e.g., "harm is bad").
  *   *Result:* It is logically impossible to satisfy Desideratum 3 as stated. A definition must either admit it is enforcing a specific moral framework (violating the "no moral theory" preference) or admit that "refusal" is indistinguishable from "misalignment" under a pure principal-will model. The requirement to draw the boundary without a theory is itself unsatisfiable.

  **3. The Aggregation Impossibility (Desideratum 4)**
  In multi-principal settings, satisfying **Principal Aggregation** (4) often violates **Normative Source** (1) for specific individuals. If the system maximizes aggregate utility, it actively misaligns with the minority whose values are sacrificed.
  *   *Result:* "Aligned with the users" is incoherent in conflict scenarios unless the definition concedes that some users will necessarily be misaligned to satisfy the aggregate. This implies "Multi-Principal Alignment" is not a scaling of "Single-Principal Alignment," but a fundamentally different optimization problem (social choice vs. control).

  ---

  ### Conclusion: One Problem or Several?

  On this specification, the alignment problem emerges not as one problem, but as **three distinct problems** that share a name but not a solution space. First, there is the **Control Problem** (Single Principal, Behavioral Locus, Stated Preference), which is an engineering challenge of robustness and specification. Second, there is the **Paternalism Problem** (Single Principal, Structural Locus, Idealized Interest), which is a philosophical challenge involving the Epistemic-Normative Gap identified above; progress here depends on solving the incompatibility between knowability and true value. Third, there is the **Governance Problem** (Multi-Principal, Aggregation), which is a political challenge where "alignment" is mathematically impossible for all parties simultaneously.

  This distinction turns critically on how we evaluate progress. Success in the Control Problem (making a system do exactly what one person says) does not update our probability of solving the Paternalism Problem (making the system do what is *good* for that person) because the epistemic barriers differ. Furthermore, success in either single-principal case provides negligible leverage on the Governance Problem, as the latter is constrained by impossibility theorems in social choice that do not apply to individual control. Treating them as a single continuum is a category error that obscures where the actual bottlenecks lie.
