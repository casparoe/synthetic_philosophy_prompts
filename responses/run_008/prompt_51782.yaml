      *   *What about the "Data does no work" claim?* If the posterior equals the prior, data does no work. The friend claims IRL results are fixed by assumptions. This is only true if the likelihood function is flat across the hypothesis space. But in IRL, the likelihood is $P(Behavior | Preferences)$. If the agent is noisy/soft-max, some preferences make the behavior *much more likely* than others.
      *   *The "Trivial Preference" problem:* The friend suggests assigning high value to actions chosen. But IRL usually assumes preferences are over *states* or *outcomes*, not *actions* directly (or at least, they are time-invariant). If preferences are over states, you can't just say "I value the state I ended up in" without explaining *why* that state was reached via that path. This attacks (3) slightly, but (5) is the stronger philosophical pivot.

