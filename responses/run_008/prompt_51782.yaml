      *   **Secondary Target:** Step (3)'s implication in (4). The "preference assignment" in (3) is usually pathologically complex (overfitting). IRL relies on *generalization*.
      *   **Addressing the Simplicity Objection:** Explain why "moving the prior" isn't "data doing no work." Use the analogy of language grammar vs. specific statements.
