          *   *Falsifiability:* Is the claim "I met aliens" falsifiable? In principle, yes (show the tech, show the location). In practice, no (tech self-destructed, no witnesses).
          *   *Kitz's Role:* Kitz isn't doing philosophy; he's doing politics. He uses the *language* of falsification ("Where is the evidence?") to enforce a budgetary/security boundary, not an epistemic one. Popper would likely say the hypothesis is *metaphysical* until tested, but not necessarily meaningless. Kitz treats it as *pseudoscience* (fraud).
          *   *The "Cheat":* The audience sees the pens roll. We have privileged access. A real Popperian in the hearing room *without* seeing the pens would side with Kitz. The film wants us to feel Ellie's frustration while knowing she's right. This creates a tension between *narrative truth* and *scientific truth*.

