answer: |-
  This is a fascinating puzzle because Marcus isn't operating on simple utilitarianism (maximize happiness) or pure deontology (follow rules blindly). He's navigating the messy middle ground of **social contract theory**.

  Based on the verdicts you provided, here is the breakdown of the competing rules, how they apply to your new cases, and the single test that will expose his actual operating system.

  ### The Two Competing Rules

  You identified two strong candidates. Let's sharpen them to see where they fracture.

  **Rule 1: The Reliance Principle ("Someone is counting on you")**
  *   **The Logic:** A convention becomes a moral obligation only when specific people have structured their livelihood, safety, or expectations around your compliance.
  *   **Fits:** US Tipping (waiters rely on wages), US Jaywalking (drivers rely on predictability), Line Cutting (people rely on order).
  *   **Struggles:** Japan Tipping (no one relies on it), Bad Service Tipping (the server didn't earn the reliance that night), Coffee iPad (no reliance established).

  **Rule 2: The Integrity Principle ("Don't erode the system")**
  *   **The Logic:** You are morally bound to follow the local coordinating script to maintain the integrity of the social system, regardless of immediate harm or reliance. This includes the "Visible Erosion" idea: breaking a norm weakens it for everyone, even if no one sees *this specific instance*, because it weakens *your* commitment to the norm.
  *   **Fits:** Bad Service Tipping (protects the wage system, not the server), Japan Shoes (protects the cultural boundary), Rome Jaywalking (adheres to the local "flow" script).
  *   **Struggles:** It risks becoming "Rule for Rule's Sake," which Marcus seems to avoid (e.g., he doesn't tip at the coffee iPad just because the machine asked).

  ### The Predictions

  Here is where the rubber meets the road. These two rules give opposite answers for your unresolved cases.

  #### Case 1: The 3am Empty Street (City of Pride)
  *   **The Reliance Rule predicts: CROSS.**
      *   *Reasoning:* There are no cars. No drivers are counting on you to stop. No pedestrians are watching. There is zero reliance and zero harm. Waiting is performative virtue signaling with no utility.
  *   **The Integrity Rule predicts: WAIT.**
      *   *Reasoning:* The norm ("we wait here") is a point of civic pride. The obligation is to the *order itself*, not the traffic. By crossing, you are unilaterally opting out of a social contract that holds the city together. Even if invisible, it degrades your own habituation to the rule.
  *   **My Best Guess:** **Marcus Waits.**
      *   *Why:* The "Bad Service" verdict is the smoking gun. He tips even when the *individual* didn't uphold their end of the bargain. This proves he prioritizes the **System** over the **Transaction**. At 3am, the "System" is the City's Order. He won't break it just because enforcement is absent.

  #### Case 2: The Porter (No-Tip Country, Extra Effort)
  *   **The Reliance Rule predicts: TIP (Cash).**
      *   *Reasoning:* The porter expended extra labor and provided extra value. He is "counting on" fair compensation for that extra effort, regardless of the national norm. To not tip is to exploit his labor.
  *   **The Integrity Rule predicts: NO CASH (Maybe a Gift).**
      *   *Reasoning:* In a no-tip culture, cash tips can imply the worker is a servant dependent on charity rather than a professional paid a wage. Tipping violates the local script of dignity. Marcus would likely refuse cash to avoid imposing a foreign hierarchy, but might offer a small gift (chocolate, cigarettes, a souvenir) which frames the exchange as "guest-host hospitality" rather than "service-wage."
  *   **My Best Guess:** **No Cash, Possibly a Gift.**
      *   *Why:* Marcus respects the "Japan Tipping" verdict (where tipping is an insult). He distinguishes between *systems* (US wages need tips) and *cultures* (Japanese dignity rejects tips). He will not impose the US moral framework on a country that has explicitly rejected it, even if the worker smiles.

  ### The Verdict on Marcus's Rule

  Marcus is running a hybrid rule I call **"Contextual Systemic Integrity."**

  It goes like this: *You are obligated to follow the local convention if that convention functions as the primary coordination mechanism for fairness, livelihood, or safety in that specific context. You cannot unilaterally opt out based on personal preference, unless the local context itself defines opt-out as the norm.*

  *   **Why he tips in the US:** The system is broken; tips are wages. Opting out steals wages.
  *   **Why he doesn't tip in Japan:** The system is wages; tips are confusion/insult. Opting *in* steals dignity.
  *   **Why he tips on bad service:** The contract is with the *system* (tip pooling/wage structure), not the *server's mood*.
  *   **Why he jaywalks in Rome:** The "safety system" there accounts for pedestrians. Following the US rule there would actually be *dangerous* (unpredictable).

  ### The Tie-Breaker Case

  To definitively settle whether he is driven by **Reliance** (people counting on him) or **Integrity** (adherence to the script), you need a case where the locals **explicitly excuse him from the norm.**

  **The Case: "The Foreigner Pass"**
  > You are in a country with a strict norm (e.g., strict silence on trains in Japan, or a specific dress code in a temple). You are visibly a tourist. A local approaches you and says, *"Oh, don't worry about that rule, that's just for us. You're a guest, you don't have to follow it."*
  >
  > **Does Marcus follow the rule or accept the exemption?**

  *   **If he accepts the exemption:** He is running the **Reliance Rule**. (The locals aren't counting on him, so the obligation is void).
  *   **If he follows the rule anyway:** He is running the **Integrity Rule**. (The norm exists to preserve the environment/system; his participation matters more than their permission).

