  - jaywalking mid-block in a normal US suburb where everyone uses the crosswalks: wrong
  - jaywalking in Rome (or Hanoi, he cited both): totally fine, drivers there plan around it
  - cutting a formed line at a bus stop: wrong
  - not queuing at a packed bar where there's no line and locals just press up to the counter: fine
  - same US restaurant but the service was genuinely terrible: still leave something, never zero

