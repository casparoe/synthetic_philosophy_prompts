prompt: |-
  I'm the chair of the design review board at a mid-size company that makes both consumer electronics and implantable medical devices -- same engineers, same test labs, very different consequences if something fails inside a person versus inside a kitchen. Our gate reviews are 30 minutes, weekly, and the recurring fight is always about the word "know." An engineer presents the test data and says we know the part meets spec; someone from risk management says no, we don't know, we have to re-run the fatigue tests on another batch and add an inspection step; and half the time the only difference between the two statements is what the part is going INTO -- the evidence is identical. Meanwhile we can't use "know" loosely in the submission documents to the regulator but can use it freely in the internal engineering report, and a junior engineer recently asked, seemingly naively, whether the word means something different in the two documents, which honestly stopped the meeting for a good five minutes.

  I've been reading a bit about epistemology on the side -- something about how whether you count as knowing something can depend on what's at stake, and about how the meaning or standards of "knows" can shift with the conversational setting -- and it struck me that our board is implicitly operating on some theory here without ever writing it down, and probably not a consistent one. So I'd like you to act as a professional epistemologist who consults on practical decision procedures. First brainstorm a little: lay out what the philosophy actually says that's usable here -- does it license demanding more evidence when stakes go up even though evidence is unchanged, or does it only license being more careful about when you SAY "know," or does it conflate knowledge with being justified in acting? Then turn whatever survives into an actual procedure the board can run inside a review: an ordered checklist of questions, what counts as a sufficient answer at each step, where the procedure terminates in a "yes, approved," where it forces more evidence, and where it must stop and hand the call to a human because the remaining question is one of values or risk appetite rather than facts -- mark those points explicitly, I don't want false precision.

  Then run the procedure on three concrete cases so we can see it work and see it break: (1) a battery seal that passed all standard tests, going into a consumer speaker; (2) the exact same seal and same data, but going into an implantable pump where a leak means surgery to replace it; (3) a firmware fix that fixed a known crash bug in a home device, where demanding more evidence is cheap but adds weeks, and a marketing person insists the fix is "known safe" because nothing like it has ever failed before -- that third one I expect the procedure to answer in a way marketing won't like, and I want to see that. Also please be upfront about where the procedure will misfire: for instance where our stakes classifications will turn out to have been wrong in hindsight, or where someone could game the checklist to manufacture a "known." And tell me honestly whether the philosophy itself is actually settled enough that the procedure follows from it, or whether the procedure is just one reasonable operationalization among several -- if a colleague insists that knowledge can't literally depend on stakes and that we're just sneaking decision theory in the back door, I want to know if the procedure survives that objection or has to be rebuilt on different ground. Think carefully and don't just give me textbook definitions -- I need the thing my board can actually print out and use next Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Chair of a Design Review Board (DRB) at a mid-size company making consumer electronics and implantable medical devices.
      *   **Context:** Shared engineering resources/labs, vastly different risk profiles (kitchen vs. inside a person). 30-minute weekly gate reviews.
      *   **Problem:** Recurring conflict over the word "know." Engineers say "we know it meets spec" based on data; Risk says "no, we don't know" based on stakes/consequences. Evidence is often identical. Confusion between internal reports (loose "know") and regulatory submissions (strict "know"). Junior engineer pointed out the inconsistency.
      *   **Goal:** Act as a professional epistemologist consultant.
      *   **Tasks:**
          1.  Brainstorm usable epistemology (Contextualism, Pragmatic Encroachment, etc.).
          2.  Create a practical procedure/checklist for the DRB based on that philosophy.
          3.  Run the procedure on three specific cases (Speaker seal, Implant seal, Firmware fix).
          4.  Identify failure modes/gaming risks.
          5.  Address the philosophical settlement (is this *the* truth or just *a* tool?).
      *   **Constraints:** Needs to be printable/usable next Tuesday. No false precision. Mark where value judgments override facts. Be honest about philosophical debates.

  2.  **Philosophical Brainstorming (Epistemology for Engineers):**
      *   *The Core Issue:* Does the truth of "S knows P" depend on the stakes?
      *   *Traditional Invariantism:* Knowledge depends *only* on truth, belief, and justification (evidence). Stakes don't change whether you *know*, only whether you should *act*. (Problem: Doesn't solve the linguistic fight in the meeting).
      *   *Contextualism (DeRose, Lewis):* The standards for "knows" shift based on the conversational context. In a casual chat, "I know the bank is open" is true. In a high-stakes financial crisis, it's false. (Useful: Explains why internal vs. regulatory docs differ).
      *   *Pragmatic Encroachment (Stanley, Fantl & McGrath):* Stakes *literally* affect whether you know. If it costs you nothing to be wrong, low evidence = knowledge. If it costs your life, same evidence $\neq$ knowledge. (Useful: Validates Risk Management's intuition).
      *   *Decision-Theoretic Approach (Sutton, Moss):* Maybe we shouldn't talk about "knowledge" at all. Talk about "warranted assertibility" or "justified action." (Useful: Bypasses the semantic fight).
      *   *Synthesis for the Board:* We can't solve metaphysics in 30 minutes. We need a *functional* definition. The philosophy that best fits is a hybrid of **Contextualism** (standards shift by audience) and **Pragmatic Encroachment** (standards shift by stakes). However, to be robust against the "decision theory" objection, we should frame it as **Thresholds for Warranted Action** rather than metaphysical Knowledge.
      *   *Key Insight:* The word "know" is doing too much work. It's conflating *statistical confidence* with *risk acceptance*.

  3.  **Developing the Procedure (The "Epistemic Gate" Protocol):**
      *   Need to separate *Evidence Quality* from *Consequence Severity*.
      *   Need to distinguish *Internal Confidence* from *Regulatory Claim*.
      *   Structure:
          1.  Define the Claim (What are we saying we "know"?).
          2.  Classify the Stakes (Consumer vs. Medical).
          3.  Assess the Evidence (Is it sufficient for *this* stake level?).
          4.  Determine the Assertion Level (Can we say "know" internally? Externally?).
          5.  Decision Point (Approve, Reject, or Escalate to Value Judgment).
      *   *Crucial Distinction:* Mark where the procedure stops being about facts and starts being about risk appetite.

  4.  **Running the Cases:**
      *   *Case 1 (Speaker Seal):* Low stakes. Standard evidence. High confidence threshold relative to risk. Result: "Know" is acceptable internally and externally (marketing).
      *   *Case 2 (Implant Seal):* High stakes. Same evidence. Low confidence threshold relative to risk. Result: "Know" is forbidden externally, qualified internally. Action: More testing or risk acceptance sign-off (Value Judgment).
      *   *Case 3 (Firmware Fix):* Medium stakes (nuisance vs. bricking). Marketing wants "known safe." Evidence is anecdotal ("never failed before"). Procedure should flag this as insufficient justification for "known," demanding statistical validation. Marketing won't like it.

  5.  **Addressing Failure Modes & Philosophical Honesty:**
      *   *Gaming:* Engineers might downplay stakes to pass the gate. Risk might upplay stakes to delay.
      *   *Hindsight:* Stakes classifications can be wrong (e.g., a speaker battery catches fire).
      *   *Philosophical Settlement:* Is Pragmatic Encroachment true? Philosophers fight about this. Invariantists say "No, you just need higher justification to *act*, not to *know*."
      *   *Response:* The procedure must survive the Invariantist objection. How? By redefining "Know" in the company glossary as "Warranted for Action at Level X." This makes the metaphysical debate irrelevant to the workflow.

  6.  **Drafting the Response:**
      *   *Tone:* Professional, pragmatic, slightly academic but grounded.
      *   *Structure:*
          1.  Executive Summary (The Philosophical Grounding).
          2.  The Procedure (The "Epistemic Gate" Checklist).
          3.  Case Studies (Application).
          4.  Failure Modes & Limitations.
          5.  The "Is This Real Philosophy?" Question.
      *   *Refinement:* Ensure the distinction between *Evidence* and *Stakes* is clear. Make sure the "Value Judgment" off-ramp is explicit.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I lean too hard on Pragmatic Encroachment?
      *   *Fix:* Acknowledge the Invariantist counter-argument explicitly in the final section. Frame the procedure as *operationalizing* the debate, not solving it.
      *   *Critique:* Is the checklist too long for a 30-min meeting?
      *   *Fix:* Keep it to 5 critical questions. Pre-work should handle the data gathering.
      *   *Critique:* The user wants to know if "know" means something different in the two documents.
      *   *Fix:* Explicitly answer this: Yes, functionally, even if metaphysically debatable.

  8.  **Final Polish:** Check against the prompt requirements (printable, specific cases, honest about philosophy). *Make sure to highlight the "Value Judgment" off-ramps.* (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I don't sound *too* abstract. The user needs a tool for next Tuesday. The philosophy is the *justification* for the tool, not the tool itself. I will structure the response to lead with the practical utility, backed by the theory.

  *(Refining the "Know" definition)*: I will propose a tiered vocabulary. Instead of just "Know/Don't Know," use "Verified," "Validated," "Accepted Risk." This aligns with ISO 13485 (Medical) vs. general engineering.

  *(Refining the Philosophical Honesty)*: I must admit that Pragmatic Encroachment is controversial. If an Invariantist sits on the board, they will object. The procedure needs to be robust enough to say "Even if you are right metaphysically, this is the policy."

  Let's build the "Epistemic Gate Protocol."

  *Step 1: Philosophy.* Contextualism + Pragmatic Encroachment + Decision Theory.
  *Step 2: Procedure.* 5 Steps.
  *Step 3: Cases.* Apply strictly.
  *Step 4: Risks.* Gaming, Hindsight, Philosophy wars.
  *Step 5: Verdict.* Is it settled? No. Is it usable? Yes.

  Okay, ready to write.cw
answer: |-
  This is a classic case of **Pragmatic Encroachment** colliding with **Regulatory Invariantism**. You are fighting a semantic battle that is actually a proxy for risk allocation. The junior engineer was right: the word *does* mean something different in the two documents, not because the physics changed, but because the *cost of being wrong* changed.

  Below is the philosophical breakdown, the operational procedure, the case studies, and the honest limitations you requested. You can print the **Procedure** section for next Tuesday.

  ---

  ### Part 1: The Philosophical Grounding (Usable Theory)

  You asked if philosophy licenses demanding more evidence when stakes go up, even if evidence is unchanged. Here is the landscape:

  1.  **Traditional Invariantism:** "Know" depends *only* on Truth, Belief, and Justification (Evidence). Stakes are irrelevant to knowledge. If you have the data, you *know*. If Risk says you don't, they are confusing *knowledge* with *caution*.
      *   *Problem:* This fails your board. It tells the engineer they are right and Risk is wrong, which leads to lawsuits when the implant fails.
  2.  **Contextualism (DeRose, Lewis):** The standards for "knows" shift based on the *conversational context*. In the lab (low stakes context), "We know" is true. In the regulatory submission (high stakes context), "We know" is false without more data.
      *   *Utility:* This validates your current practice (different docs, different standards) but doesn't help the meeting where the contexts collide.
  3.  **Pragmatic Encroachment (Stanley, Fantl & McGrath):** Stakes *literally* affect whether you know. If the cost of error is death, the evidence required to claim "knowledge" is higher than if the cost of error is a nuisance.
      *   *Utility:* This validates Risk Management. It licenses demanding more evidence for the implant *to claim knowledge*, even with identical data.
  4.  **Decision-Theoretic Approach (Sutton, Moss):** Stop talking about "knowledge." Talk about **Warranted Assertibility**. You are never asking "Do we know?" You are asking "Are we justified in acting as if this is true?"

  **The Synthesis for Your Board:**
  We will adopt a **Functional Pragmatic** stance. We will not settle the metaphysics. Instead, we will define "Know" operationally as: *"Evidence sufficient to warrant the specific action proposed, given the specific consequences of error."*

  This means:
  *   **Internal Report:** "Know" = Evidence warrants engineering iteration.
  *   **Regulatory Doc:** "Know" = Evidence warrants human safety/regulatory compliance.
  *   **The Meeting:** We are not debating truth; we are debating **warrant**.

  ---

  ### Part 2: The Epistemic Gate Protocol (Printable Procedure)

  **Purpose:** To resolve disputes over "knowledge claims" during Design Review by separating *Evidence Quality* from *Risk Tolerance*.
  **Timebox:** 5 minutes per gate item.
  **Roles:** Presenter (Engineering), Challenger (Risk/Quality), Chair (Tie-breaker/Value Arbiter).

  #### Step 1: Define the Claim (30 Seconds)
  *   **Question:** What specific proposition is being asserted as "known"?
  *   **Required Format:** "We claim [Component X] will [perform Y] under [Condition Z] with [Failure Rate W]."
  *   **Fail Condition:** Vague claims like "It works" or "It's safe."
  *   **Sufficient Answer:** "We claim the seal will maintain integrity at 5 ATM for 5 years with <0.1% failure rate."

  #### Step 2: Classify the Consequence of Error (1 Minute)
  *   **Question:** If this claim is false, what is the worst credible outcome?
  *   **Action:** Assign a **Stakes Tier** (Pre-defined by company policy, not debated in the meeting).
      *   **Tier 1 (Nuisance):** Device malfunction, user annoyance, replaceable hardware. (e.g., Speaker)
      *   **Tier 2 (Hazard):** Injury, property damage, non-replaceable hardware. (e.g., Home appliance fire)
      *   **Tier 3 (Critical):** Permanent injury, death, surgical intervention required. (e.g., Implant)
  *   **Note:** This is a *Fact* based on device classification, not an opinion.
  *   **Sufficient Answer:** "This is a Tier 3 component."

  #### Step 3: Assess Evidence Against Tier Threshold (2 Minutes)
  *   **Question:** Does the current evidence meet the **Verification Threshold** for this Tier?
  *   **Thresholds:**
      *   *Tier 1:* Standard QA testing + Engineering judgment.
      *   *Tier 2:* Accelerated life testing + Statistical confidence (90%+).
      *   *Tier 3:* Biocompatibility + Worst-case scenario testing + Statistical confidence (95%+) + Redundancy analysis.
  *   **The "Know" Rule:** You may only use the word "Know" in the final decision if Evidence $\ge$ Threshold.
  *   **Sufficient Answer:** "We have 90% confidence. Tier 3 requires 95%. Claim fails."
  *   **Fail Condition:** Arguing that the *data* is good enough without referencing the *Tier*.

  #### Step 4: Determine Assertion Level (1 Minute)
  *   **Question:** In what contexts is this claim assertible?
  *   **Matrix:**
      *   *If Evidence < Tier Threshold:* Claim is **Provisional**. Internal use only. Cannot be used for Release.
      *   *If Evidence $\ge$ Tier Threshold:* Claim is **Verified**. Internal use allowed. External/Regulatory use allowed *if* wording matches submission standards.
  *   **Sufficient Answer:** "Claim is Provisional. We cannot sign the design freeze."

  #### Step 5: The Value Off-Ramp (Critical Step)
  *   **Trigger:** If Evidence < Tier Threshold, but Business/Marketing demands release anyway.
  *   **Action:** The procedure **TERMINATES**. This is no longer an epistemic question ("Do we know?"); it is a **Risk Acceptance** question ("Do we accept the danger?").
  *   **Requirement:** Must be escalated to a **Risk Acceptance Form** signed by a VP or higher.
  *   **Wording:** The decision document must *not* say "We know it is safe." It must say "We accept the risk of failure."
  *   **Chair's Role:** Ensure no one leaves the room thinking "Know" has been established.

  ---

  ### Part 3: Case Study Runs

  Here is how the protocol handles your three scenarios.

  #### Case 1: Battery Seal (Consumer Speaker)
  *   **Step 1 (Claim):** Seal prevents moisture ingress for 2 years.
  *   **Step 2 (Stakes):** **Tier 1**. If it leaks, speaker buzzes or dies. User buys a new one.
  *   **Step 3 (Evidence):** Passed standard IP67 testing. 90% confidence.
  *   **Check:** Tier 1 requires Standard QA. Evidence meets threshold.
  *   **Step 4 (Assertion):** **Verified**.
  *   **Outcome:** Engineer can say "We know it meets spec." Design Freeze **APPROVED**.
  *   **Why it works:** Low stakes license the standard evidence.

  #### Case 2: Battery Seal (Implantable Pump)
  *   **Step 1 (Claim):** Seal prevents fluid ingress for 5 years.
  *   **Step 2 (Stakes):** **Tier 3**. If it leaks, battery shorts, patient requires explant surgery.
  *   **Step 3 (Evidence):** Passed standard IP67 testing. 90% confidence. (Identical data to Case 1).
  *   **Check:** Tier 3 requires 95% confidence + Redundancy analysis. Evidence **FAILS** threshold.
  *   **Step 4 (Assertion):** **Provisional**.
  *   **Outcome:** Engineer **CANNOT** say "We know." Risk Management is validated.
  *   **Decision:** Design Freeze **REJECTED** pending fatigue tests on new batch.
  *   **Why it works:** Pragmatic Encroachment is operationalized. Same data, higher stakes = insufficient warrant.

  #### Case 3: Firmware Fix (Home Device Crash)
  *   **Step 1 (Claim):** Patch fixes crash bug without side effects.
  *   **Step 2 (Stakes):** **Tier 2**. If it fails, device bricks (Hazard/Property Loss).
  *   **Step 3 (Evidence):** "Nothing like this has ever failed before" (Anecdotal/Inductive). No regression suite run.
  *   **Check:** Tier 2 requires Statistical Confidence/Regression Testing. Evidence **FAILS**.
  *   **Step 4 (Assertion):** **Provisional**.
  *   **Marketing Objection:** "But it's known safe!"
  *   **Protocol Response:** "Under this protocol, 'Known' requires Tier 2 evidence. You have anecdote."
  *   **Decision:** **Value Off-Ramp Triggered.** Marketing can either wait for testing OR sign a Risk Acceptance Form acknowledging the risk of bricking 1% of devices.
  *   **Why it works:** It forces Marketing to put a price on their urgency. If they won't sign the risk form, they don't get the release.

  ---

  ### Part 4: Failure Modes & Limitations

  You asked for honesty on where this breaks.

  **1. The "Stakes Gaming" Problem**
  *   *Risk:* Risk Management may artificially inflate a component to Tier 3 to demand unnecessary testing (empire building). Engineering may downgrade to Tier 1 to ship faster.
  *   *Mitigation:* The **Stakes Tier** (Step 2) must be pre-assigned in the Product Requirements Document (PRD) *before* the design review. It cannot be debated at the gate. If the PRD says "Implant," it is Tier 3. Period.

  **2. The Hindsight Bias**
  *   *Risk:* A speaker battery catches fire (Tier 1 becomes Tier 3 in hindsight). The procedure will look negligent.
  *   *Mitigation:* The procedure protects *process*, not *outcome*. As long as the Tier was assigned reasonably based on *foreseeable* risk at the time, the board is protected. You must document *why* a Tier was chosen.

  **3. The "False Precision" Trap**
  *   *Risk:* Engineers treat "95% confidence" as a magic number they can massage statistically to pass the gate.
  *   *Mitigation:* Step 3 requires Quality Assurance sign-off on the *method* of calculating confidence, not just the number.

  **4. The Philosophical Objection (The Invariantist Colleague)**
  *   *Risk:* A senior engineer argues, "This procedure is lying. We *do* know the physics. You're just changing the definition of words."
  *   *Response:* Acknowledge they are metaphysically correct but operationally wrong.
      *   *Script:* "You are right that the physical truth hasn't changed. But this company does not trade in Physical Truth; we trade in **Warranted Action**. This procedure does not define 'Truth'; it defines 'Company Authorization to Ship.' You can believe you Know it in your heart; you cannot sign the release form until the Warrant matches the Stake."

  ---

  ### Part 5: Is The Philosophy Settled? (The Honest Answer)

  **No.**
  If a colleague insists that knowledge cannot depend on stakes (Invariantism), they are standing on solid philosophical ground (traditional epistemology). Pragmatic Encroachment is a newer, contested theory.

  **Does the procedure survive that objection?**
  **Yes,** but only if you reframe the output.
  *   **Weak Framing (Vulnerable):** "We don't *know* if the implant works." (The Invariantist will fight this).
  *   **Strong Framing (Robust):** "We have not met the **Warrant Threshold** to assert safety."

  **Recommendation:**
  Update your company glossary. Ban the word "Know" from all **Regulatory and Risk Documents**.
  *   Replace "We know it meets spec" with **"Verification Complete."**
  *   Replace "We don't know" with **"Verification Incomplete."**
  *   Keep "Know" for internal engineering chats (Contextualism), but forbid it in the Gate Review minutes (Invariantism/Compliance).

  **Final Verdict:**
  The procedure works not because it solves the epistemology, but because it **bypasses** it. It turns a metaphysical fight ("What is truth?") into a compliance check ("Did we meet the threshold for this tier?"). That is the only way a 30-minute meeting survives.

  **For Next Tuesday:**
  Print Part 2. Tell the board: *"We are not debating truth today. We are checking if our warrant matches our risk tier. If it doesn't, we escalate to risk acceptance."* This removes the ego from the "I know/You don't" fight and makes it about matching the checklist.
