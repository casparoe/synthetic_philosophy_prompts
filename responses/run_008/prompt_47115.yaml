  You ask me if the bank will open wide,
  I say I stood inside two weeks ago.
  We have no reason now to run or hide,
  There is no place the urgent cash must go.
  "I know it's open," leaves my careless tongue,
  All evidence feels solid in my hand.
  Just like the day the doors were open flung,
  I stand upon this firm and steady land.

  But now the bill must clear by Monday light,
  If doors are shut, we face a heavy fine.
  The memory grows dimmer in the night,
  Though nothing changed within this head of mine.
  Is "knows" a word that bends to fit the size,
  Or do the stakes change truth before my eyes?
