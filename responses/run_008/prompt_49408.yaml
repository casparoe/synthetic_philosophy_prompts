      *   *Bratman:* Shared intention is a web of interlocking individual intentions. It requires mutual responsiveness, commitment to joint activity, and common knowledge. This is more mechanical/negotiated than organic.
      *   *Gilbert:* Joint Commitment. Creates a "plural subject." Involves rights and obligations (normative binding). You can't opt out unilaterally. This explains the *obligation* to play the piece they don't love.

  3.  **Map the Analogy (Individual vs. Collective):**
