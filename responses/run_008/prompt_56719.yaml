answer: |-
  Your brother is half-right: it *feels* like vibes because you are intuitively performing complex statistical validity checks without doing the math. But he is half-wrong: there absolutely is a rule. You are intuitively navigating the trade-off between **Bias** (using a class that is too broad and ignores relevant differences) and **Variance** (using a class that is too narrow and relies on noise).

  The principle governing your intuitions is **Predictive Relevance via Stable Mechanisms.**

  A reference class is valid if the features defining it satisfy two conditions:
  1.  **Causal/Structural Link:** The feature has a known mechanism for influencing the outcome (e.g., exercise affects health; sector affects startup failure).
  2.  **Pre-Specification:** The class was definable *before* you knew the outcome, not selected *because* it explains the outcome.

  Here is the audit of your verdicts, the one you need to overturn, the solution to your medical dilemma, and the answer to the restaurant question.

  ### 1. The Audit: Why your "Vibes" are actually Statistics

  *   **Startup Failure (Seed/Sector vs. All Business):** **Correct.**
      *   *Why:* "All business" mixes fundamentally different causal mechanisms (a bakery's supply chain vs. a SaaS platform's churn). "Seed/Sector" isolates the specific economic forces acting on you.
  *   **Divorce Risk (Highly Conditioned vs. National):** **Correct.**
      *   *Why:* Education, age at marriage, and parental history are well-documented, pre-existing predictors. Even with a small $N$ (sample size), the *signal* is strong enough to outweigh the noise.
  *   **Flight Delay (Route/Airline vs. Personal Luck):** **Correct.**
      *   *Why:* Route and airline are structural constraints. "Personal luck" violates the assumption of **independence**. Past flight delays do not causally influence future ones (unless you have a habit of picking bad flights, which is covered by the airline/route class).
  *   **Life Expectancy (Exercise vs. Zodiac):** **Correct.**
      *   *Why:* Exercise has a biological mechanism. Zodiac signs do not. Narrowing the class only helps if the narrowing feature is *relevant*. Narrowing by irrelevant features just reduces your sample size ($N$) without increasing accuracy. This is **overfitting**.

  ### 2. The Verdict to Overturn: Your Friend's Divorce Class

  You said: *"My recently divorced friend swears the right class for him was 'married men whose wives have a lot of close male friends at work'... and I think that's nuts."*

  **You are right to reject this, and here is the principle why:** This violates **Pre-Specification**.

  Your friend likely identified this class *after* the divorce occurred to make sense of the pain. This is **data dredging** (or the Texas Sharpshooter Fallacy). He drew the target around the bullet hole. Unless he identified "wives with male friends" as a specific risk factor *before* the marriage crumbled, this class is statistically toxic. It captures noise and post-hoc rationalization, not a stable predictive mechanism.

  **Correction:** He must use the same class you used for yourself (age, education, parental history). If "wives with male friends" is a valid predictor, it needs to be validated on a population *before* being applied to his specific case.

  ### 3. The Medical Dilemma: 6% (Matched) vs. 9% (Broad)

  This is the classic **Bias-Variance Tradeoff**.
  *   **9% (Age/Sex):** Low variance (huge sample), high bias (ignores your specific biology).
  *   **6% (Matched Markers):** Low bias (highly relevant), higher variance (smaller sample).

  **The Principle:** Trust the **Matched Group (6%)**, *provided* the sample size is above a stability threshold.
  In clinical risk modeling, a "few hundred" people is usually sufficient to establish a risk profile if the markers are biologically validated (e.g., cholesterol, genetic markers). The 9% number is discarding information that you *know* is relevant.

  **How to decide on the medication:**
  Don't just look at the point estimate (6% vs 9%). Look at the **Confidence Interval**.
  *   If the 6% estimate comes with a wide error bar (e.g., 2% to 10%), the data is too noisy, and you should lean toward the conservative 9%.
  *   If the error bar is tight (e.g., 5% to 7%), the 6% is robust.
  *   *Heuristic:* If the markers are standard clinical tests (not experimental), trust the 6%. Doctors use risk calculators (like the ASCVD risk estimator) that do exactly this: they condition on specific markers to move you away from the population base rate.

  ### 4. Conflicting Defensible Classes (Founders vs. Sector)

  When you have two valid classes that give different answers (e.g., "First-time founders" = 80% failure, "My Sector" = 50% failure), **do not pick one.**

  **The Principle:** **Ensemble Forecasting.**
  The statistically principled move is to combine them.
  1.  **Intersection:** Look for "First-time founders in my sector." If $N$ is too small, proceed to step 2.
  2.  **Weighted Average:** Average the probabilities, weighting them by the predictive strength of each class. If sector is generally a stronger predictor of failure than founder experience, weight the sector number higher.
  3.  **Regression:** In a perfect world, you run a logistic regression where both "Founder Status" and "Sector" are input variables. The math automatically figures out how much weight to give each.

  *Practical advice:* If you can't do the math, take the average. It is almost always more accurate than picking your favorite narrative.

  ### 5. The Restaurant Prediction

  **Case:** Will I like a restaurant I've never been to?
  **Classes:**
  A. "People my age in my neighborhood."
  B. "People whose ratings have matched mine on past restaurants."

  **The Prediction:** **Class B is vastly superior.**

  **Why:** Taste is subjective and cultural, not demographic. "Age/Neighborhood" is a **proxy** variable. It assumes that where you live and how old you are determines your palate. That is a weak causal link.
  "People whose ratings matched mine" (Collaborative Filtering) relies on **revealed preference**. If you and a stranger both loved Restaurant X and hated Restaurant Y, you share a latent "taste vector." That is a direct mechanistic link to your future enjoyment.

  This is why Netflix and Amazon don't recommend movies based on your zip code; they recommend them based on users who liked what you liked. Your intuition should firmly pick Class B.

  ### Summary of the Rule

  Your "vibe" is actually a heuristic for **Exchangeability**.
  *   **Ask:** "Is a person in this reference class exchangeable with me regarding this specific outcome?"
  *   **Startup:** A bakery owner is *not* exchangeable with a SaaS founder regarding market risk. (Reject "All Business").
  *   **Flight:** My past bad luck is *not* exchangeable with future physics/mechanics. (Reject "Personal Luck").
  *   **Friend's Divorce:** A group selected *because* they divorced is *not* exchangeable with a predictive population. (Reject "Wives with Friends").
  *   **Medical:** A patient with my biomarkers *is* more exchangeable than a patient with just my age. (Accept "Matched").

  **Final Instruction:**
  1.  **Overturn:** Your friend's divorce class. It is post-hoc rationalization.
  2.  **Medical:** Take the 6% (matched), but ask your doctor about the confidence interval.
  3.  **Restaurant:** Trust the people who like what you like, not the people who live near you.
  4.  **Conflicting Classes:** Average them.

  You aren't doing vibes; you're doing Bayesian updating with a priors check. Your brother is just jealous of your intuition.
