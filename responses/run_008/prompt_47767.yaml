  2. **Where it misleads**
  1.  **Physics vs. Metaphysics:** The summary conflates the mathematical formalism of relativity with a specific metaphysical interpretation. While the equations of Special Relativity are compatible with eternalism, they do not strictly entail it. One can accept the physics while maintaining that only the present is real, provided one adjusts the metaphysics (for example, by positing an undetectable privileged frame). The move from "physics denies a universal now" to "therefore the block universe is true" is an inference to the best explanation, not a logical deduction.
  2.  **The Ambiguity of "Exists":** The summary trades on an ambiguity in the word "exists." In eternalism, to say a past event "exists" means it occupies a coordinate in the four-dimensional manifold (existence *simpliciter*). In everyday language, to say someone "exists" implies they are alive, conscious, and causally active (existence *at the present*). The book relies on the emotional weight of the everyday sense while defending the technical sense.
  3.  **The Consensus Claim:** The assertion that eternalism is the consensus among those who "take physics seriously" is an overstatement. While popular among physicists, it remains a live and contentious debate in the philosophy of physics. Significant figures argue for the "growing block" theory or defend presentism against relativistic objections. The landscape is pluralistic, not settled.
  4.  **The Sydney Analogy:** Comparing the past to Sydney is misleading regarding accessibility. Sydney is spatially distant but causally accessible; you can travel there or communicate with it. The past is causally disconnected; no signal or object can travel from your grandmother's timeline to your current coordinate. The mode of "being there" is fundamentally different in kind, not just degree.

  3. **How a presentist would reply**
  A presentist would argue that relativity describes the structure of causal relationships, not the structure of existence itself. They might posit a "privileged foliation" of spacetime—a universal now that is physically undetectable but metaphysically real—preserving presentism without contradicting empirical data. Alternatively, they might argue that existence is tied to causal connectivity; since the past cannot interact with the present, it does not exist in the relevant sense. Thus, presentism is not refuted but rather requires a more nuanced metaphysical framework to accommodate relativistic physics.

  4. **What follows for your situation**
  Even if the accurate parts of the summary are accepted, the comforting conclusion does not follow in any practical sense. Eternalism grants your grandmother existence at a specific spacetime coordinate, not continued existence in the present. It offers no mechanism for interaction, awareness, or relationship. You exist at your coordinate; she exists at hers. The ontological reality of her past life does not alleviate the causal finality of her death, nor does it permit any form of contact. The block universe confirms she *was*, not that she *is* in any way that impacts your current reality.
