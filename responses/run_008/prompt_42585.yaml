answer: |-
  ### Brainstorming and Initial Weighing

  Right, let's take a breath and look at the landscape without the pressure of the dissertation proposal form in front of us. The claim that deflationism is "finished" is one of those philosophical memes that persists longer than the evidence warrants. It is largely driven by the metaphysical camp (think Lynch or Wright) who argue that truth must play a robust explanatory role in epistemology or metaphysics which deflationism cannot support. From your corner of the woods—logic and model theory—the view is far from dead; it has merely migrated. The debate has shifted from "Is deflationism true?" to "What are the formal constraints on a deflationary truth predicate, and can they be satisfied consistently?"

  Given your background in logic and model theory, and your aversion to heavy metaphysics, you are uniquely positioned to work on the *formal viability* of deflationism rather than its metaphysical implications. You should avoid topics that require you to defend a theory of belief, inquiry, or content unless those can be formalised. That immediately makes me wary of candidate (b). Normativity is crucial for truth, but debating whether truth is a "norm of belief" often dissolves into epistemological hand-waving unless you are doing something very specific with normative logic, which is niche even for us.

  Candidate (c), the anaphoric and quantificational issue, is the engine room of deflationism. If you cannot quantify into sentence position without committing to propositions as objects, the generalisation argument fails. However, much of the heavy lifting here was done in the 90s and 00s (Horwich, Grover, Field). While there are lingering issues, it feels more like a foundational constraint than a fertile ground for a three-year project unless you are developing a novel formalism for substitutional quantification.

  That leaves (a) and (d). The conservativeness debate (a) is the classic logical challenge to deflationism. It is precise, proof-theoretic, and suits your skills perfectly. However, one might argue the formal results are stable (we know PA + T is non-conservative over PA with full induction); the debate is now largely interpretative. Is there enough *new* logic to be done there? Conversely, the paradox problem (d) is where the field is currently bleeding. Classical deflationism is inconsistent; non-classical deflationism is accused of being too costly (revisionary about logic). This tension is unresolved, highly technical, and directly impacts whether a deflationary theory can even exist.

  My instinct is that (d) is the most vital, followed closely by (a), with (c) as a necessary background commitment and (b) as something to avoid unless you can formalise it rigorously. Let's break this down properly.

  ---

  ### Detailed Analysis of Candidates

  #### (d) The Interaction with the Liar Paradox and Revenge
  **Verdict:** Highest Priority.

  **Why it is worth three years:** This is the existential threat to deflationism. If you are a deflationist, you want a truth predicate that is transparent (intersubstitutable with the sentence it applies to) and logically strong. But transparency plus classical logic yields contradiction. The current frontier is whether a deflationist can adopt a non-classical logic (like Field's paracomplete approach or Beall's paraconsistent approach) without abandoning the "lightweight" spirit of deflationism. Critics argue that changing the logic is a substantial metaphysical cost, effectively killing deflationism. Resolving this tension—perhaps by showing how a deflationist can recapture classical reasoning in safe domains while handling paradox non-classically—is a massive open question.

  **Dependency:** Almost everything else depends on this. If your theory of truth is inconsistent, conservativeness and normativity are moot. A dissertation here would establish the formal groundwork for any further deflationary claims.

  **Tractability:** This is ideal for your background. It requires comfort with proof theory, model construction for non-classical logics, and fixed-point theorems. It minimises metaphysics; the debate is about logical consequence and consistency, not the nature of belief or reality.

  **Future Developments:** Work on "recapture" (showing classical logic holds for ordinary mathematics even within a non-classical truth theory) is moving fast. If a robust recapture theorem is proven in the next two years, it boosts this topic's viability. If non-classical approaches continue to fragment without consensus, the topic remains open but risky.

  #### (a) The Conservativeness Debate
  **Verdict:** High Priority (Strong Second).

  **Why it is worth three years:** The argument, roughly, is that deflationism implies truth should be conservative over base arithmetic (it shouldn't prove new arithmetic facts), but truth theories often prove consistency statements (like Con(PA)), which are not provable in PA. Therefore, deflationism is false. The open question is whether deflationists must accept conservativeness, or whether they can justify accepting non-conservative principles (like reflective closure) without admitting truth is a substantial property.

  **Dependency:** This is specific to deflationism. Substantialists expect truth to be non-conservative. So, this question determines the boundary between deflationary and substantial theories of truth in arithmetic.

  **Tractability:** Extremely high for you. This is pure proof theory and model theory (e.g., comparing KF, PKF, FS). It avoids metaphysics by focusing on what is provable in which system. The risk is that the formal results are well-known (Halbach, Ketland, Shapiro); the work lies in the philosophical interpretation of those results. You would need to ensure you aren't just rehashing 2010s debates.

  **Future Developments:** New axiomatisations of truth (e.g., focusing on grounding or specific reflective principles) could reopen the debate. If the field moves towards "local" deflationism rather than global theories, the conservativeness constraint might shift.

  #### (c) Anaphoric and Bound-Variable Uses
  **Verdict:** Medium Priority.

  **Why it is worth three years:** Deflationism rests on the claim that "true" is a device for generalisation (e.g., "Everything the Pope says is true"). To formalise this, you need quantification into sentence position. If this requires substitutional quantification, and substitutional quantification presupposes truth, the view is circular. If it requires objectual quantification over propositions, the view is substantialist.

  **Dependency:** This is foundational. If you cannot make sense of generalisation, the primary motivation for deflationism collapses.

  **Tractability:** Moderate. It involves logic (higher-order, substitutional), but it quickly bleeds into philosophy of language and metaphysics (what are the values of sentence variables?). Given your allergy to metaphysics, you might find yourself stuck on the ontological commitments of your quantifiers rather than the logic itself.

  **Future Developments:** Unless there is a breakthrough in how we understand higher-order logic without ontological commitment (a la Rayo or Williamson), this area is somewhat stagnant compared to paradox. It is more of a constraint you must satisfy than a discovery project.

  #### (b) The Normative Role of Truth
  **Verdict:** Low Priority (Avoid).

  **Why it is worth three years:** It shouldn't be. The question is whether deflationism can explain why we *ought* to believe what is true. Substantialists say truth is a goal of inquiry; deflationists struggle to explain this "ought" without invoking a robust property.

  **Dependency:** Important for epistemology, less so for logic. You can have a consistent logical theory of truth without solving the normativity of belief.

  **Tractability:** Low for you. This is primarily epistemology and meta-ethics. Unless you are planning to formalise norms using deontic logic (which is often philosophically disconnected from the actual normativity debate), you will be out of your depth and away from your strengths. It invites the heavy metaphysics you wish to avoid.

  **Future Developments:** Unlikely to change in a way that benefits a logician soon. It depends on shifts in epistemology, not logic.

  ---

  ### Defended Prioritisation

  You need a topic that leverages your technical skills while avoiding the metaphysical quagmires that often stall deflationism projects. You also need a topic that is genuinely open, not one where the formal results are settled and only the commentary remains.

  **1. The Interaction with the Liar Paradox (d)**
  This is your primary target. It is the most active area of research in the logic of truth. The tension between deflationary transparency and logical consistency is unresolved. By focusing on whether a deflationist can adopt a non-classical logic without incurring substantial costs (the "logical cost" objection), you are working on the consistency of the entire programme. It is highly tractable for a model theorist and minimises metaphysics. If deflationism fails here, it fails everywhere.

  **2. The Conservativeness Debate (a)**
  This is your safety net and your secondary focus. It is the specific test case for deflationism in arithmetic. While the formal results are older, the philosophical interpretation regarding *why* a deflationist might accept non-conservative principles (e.g., via reflective closure) is still live. You can approach this with fresh eyes using your model-theoretic background to analyse specific axiomatisations (like PKF vs KF) and their philosophical implications. It pairs well with (d): if you solve paradox non-classically, how does that affect conservativeness? (Often, non-classical truth theories are conservative over PA, which changes the debate entirely).

  **3. Anaphoric / Bound-Variable Uses (c)**
  This is your foundational constraint. You cannot ignore it, but it should not be the *whole* dissertation. You need to adopt a stance on quantification to do (a) or (d), but debating the metaphysics of quantification itself is less fruitful than using a specific formalism to solve paradox or conservativeness. Treat this as a chapter or a constraint, not the main event.

  **Recommendation:** Structure the dissertation around the **consistency and cost of deflationary truth theories**. Use (d) as the main engine (can we have a consistent deflationary truth predicate?), and (a) as the test case (what arithmetic strength does it have?). This allows you to stay within logic and model theory while addressing the core philosophical challenges. Avoid (b) entirely unless you can formalise norms in a way that directly impacts the proof theory.

  \answer{d > a > c}
