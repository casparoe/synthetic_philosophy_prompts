  2.  **Deconstruct Hofstadter's Luring Lottery:**
      *   The setup: Prize = $1,000,000 / N (where N is total number of entries).
      *   Rational choice (Nash Equilibrium): Send as many entries as possible. If everyone does this, N explodes, prize per entry approaches zero.
      *   Superrational choice: Everyone sends 1 entry. Prize = $1,000,000 / (Number of People).
      *   The tragedy: You can't enforce superrationality. Defecting (sending more entries) always yields a higher individual payoff regardless of what others do (dominance).
      *   The Lawyer's Task: Try to write rules that force superrationality without actually having the power to do so.

