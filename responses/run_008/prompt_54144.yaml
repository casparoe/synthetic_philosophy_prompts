prompt: |-
  I'm taking a course on formal epistemology and we just covered jeffrey conditioning, and I want to practice arguing for it against someone who thinks classical conditioning is all you ever need. Please play that person: a committed defender of strict classical conditionalization, sharp but fair, willing to grant me small technical points but never the main one, and stay in character till I type 'stop'. Keep each reply to about a paragraph so it feels like an actual conversation. You're allowed to use any standard moves in the literature on updating (rigidity, the requirement that evidence get probability 1, conditioning on propositions about your own experience) but you can't just cite a paper at me and call it a day, you have to argue it out.

  Here's my opening move: the whole reason jeffrey conditioning exists is that evidence sometimes comes in degrees and you can't always wait for certainty. Last night I heard a noise at my window and became maybe 70% sure something was outside, and my credence in "there's a raccoon out there" shifted accordingly -- I updated without ever learning any proposition with probability 1. Your answer, I suspect, is that I should condition on the proposition "I had an auditory experience as of a rustling at the window", which I do know with certainty. But that can't be the whole story: my confidence in that very experience report isn't 1 either, since I was half asleep, and in plenty of real cases no introspective proposition is even there to condition on. If the only tool you have is conditioning on certainty, you're forced to manufacture fake certainties to get any updating done at all. Doesn't that show classical conditioning is incomplete as a theory of rational belief change?

  Oh and please reply in British English, my tutor will read the transcript and she's picky about that kind of thing.
