answer: |-
  This is a remarkably clean dissection of the "Problem of Justice" without the theological baggage. Your friend is correct that Karma is essentially a theodicy designed to save the intuition of retributive justice from the empirical observation that the world is unfair. You are correct that accepting the theodicy (reincarnation) creates moral monstrosities (the sick child).

  You are asking for a principle that preserves the *normative force* of desert (the war criminal *should* have suffered) without the *ontological commitment* of a cosmic ledger (the universe *must* make him suffer).

  Here is the precise formulation of the principle that captures your data, followed by the verdict on which intuition must be sacrificed.

  ### The Principle: Asymmetric Agency-Weighted Desert

  Your intuitions are not random; they follow a specific, albeit non-cosmic, logic. We can state it as three axioms:

  1.  **The Agency Constraint:** Desert (positive or negative) requires voluntary agency as the *desert base*. Natural events (disease, genetic talent) cannot be deserved because they lack an agent who chose them.
  2.  **Negative Asymmetry:** The intuition for Negative Desert (punishment for harm) is significantly stronger and more "metaphysical" than Positive Desert (reward for benefit). Unpunished evil feels like a violation of natural law; unrewarded good feels like mere missed opportunity.
  3.  **The Normative/Ontological Split:** The "ledger" is a normative demand placed on *moral agents* (us), not an ontological feature of the *universe*. When the war criminal dies peacefully, the debt is not "unpaid by the universe"; the debt is "uncollected by society." The injustice is real, but it is a human failure, not a cosmic glitch.

  ### Applying the Principle to Your Cases

  *   **War Criminal:** Fits Axiom 3. He deserves punishment (Agency + Harm). He didn't get it. This is an injustice, but it does not imply the universe *owes* him suffering in the future. It implies *we* failed to extract it. The "metaphysical feel" is the intensity of the normative demand, not evidence of a cosmic mechanism.
  *   **Sick Child:** Fits Axiom 1. No agency = no desert. Any theory claiming she deserves this violates the Agency Constraint. Karma fails here.
  *   **Lottery Winner:** Fits Axiom 2. Positive desert is weak. He didn't earn it (no agency regarding the win), so he doesn't deserve it. But because it's a gain, not a harm, the "injustice" signal is low. This explains the asymmetry with the sick child.
  *   **Drunk Drivers:** **This is your conflict point.** (See "Which Verdict Must Go" below).
  *   **Hard Worker:** Fits Axiom 1. Effort is agency; talent is luck. Desert is proportional to the effort component, diluted by the luck component.
  *   **Abused Criminal:** Fits Axiom 1. Agency is constrained but not eliminated. Unless the abuse completely destroyed capacity for choice (determinism), some agency remains, so some blame remains.
  *   **Stolen Inheritance:** Fits Axiom 1. They did not *choose* the theft, so they are not *culpable*. However, they are in possession of unjust enrichment. They do not *deserve* the money (no agency created it), but they are not *guilty* of the theft. Giving it away is restitution (fixing the distribution), not penance (fixing their soul).

  ### Which Verdict Has to Go?

  You asked which of your verdicts must be discarded. You have two options, depending on whether you prioritize **Logical Consistency** or **Phenomenological Honesty**.

  **Option A: Drop the Drunk Driver Intuition (The Rationalist Choice)**
  Your intuition that the killer-driver is *more blameworthy* than the safe-driver is the weakest link philosophically. This is the problem of **Moral Luck** (Nagel/Williams).
  *   **Why drop it:** If you believe in the Control Principle (you are only responsible for what you control), the outcome (hitting the pedestrian) was 50% luck (the pedestrian's step). Both drivers exhibited identical vice (drunk driving). To say one is more blameworthy is to let luck dictate moral status.
  *   **Cost:** You must accept that your gut feeling here is an evolutionary bug. We react to *damage*, not just *intent*.
  *   **Benefit:** Preserves the Control Principle and keeps your moral system consistent with your rationalist leanings.

  **Option B: Drop the War Criminal "Cosmic Debt" Intuition (The Realist Choice)**
  Your intuition that the war criminal's peaceful death feels like a *metaphysical* error (rather than just a sad fact) is the other weak link.
  *   **Why drop it:** This is the intuition your friend's Karma exploits. If you insist the ledger *must* balance, you are one step away from justifying the sick child's suffering to balance *her* ledger.
  *   **Cost:** You must accept "Tragic Realism." Sometimes evil wins, fully and finally. The universe is indifferent. The "injustice" is not a broken law of physics; it is just a bad outcome.
  *   **Benefit:** Protects the Sick Child verdict absolutely. It prevents the slide into "Just World" thinking.

  **Recommendation:** Drop **Option B's metaphysical expectation**, but keep the **normative judgment**.
  Meaning: Acknowledge that the war criminal *should* have suffered (normative), but accept that the universe does not care if he did (ontological). Do not drop the Drunk Driver intuition entirely, but categorize it as **Social Blame** (we punish the killer more to deter outcomes) vs. **Moral Blame** (they are equally vicious).

  ### Why Does the War Criminal Case Feel Metaphysical?

  You asked why the war criminal case feels like a violation of natural law rather than just social utility. This is the crux of your friend's argument.

  1.  **Projection of Normative Grammar:** Humans process "ought" statements with the same cognitive hardware we use for "is" statements. When we say "He *deserves* punishment," our brain tags it with the same urgency as "Fire *burns*." When the punishment doesn't happen, it feels like a prediction error in reality, not just a social failure.
  2.  **The "Just World" Heuristic:** Evolutionarily, believing the world is just is more useful than believing it is random. If you believe bad things happen to bad people, you can navigate the world safely. When you see a bad person thrive, it triggers a high-alert cognitive dissonance. It *feels* metaphysical because your brain is screaming that your safety model of the universe is broken.
  3.  **Secularized Retributivism:** We have inherited the structure of Judeo-Christian/Islamic/Hindu justice (Final Judgment, Karma) without the theology. We kept the "Final Balance" requirement but deleted the "Judge." Now we look around for the Judge, don't find one, and feel a phantom limb sensation.

  ### The Stolen Inheritance Case (Specific Prediction)

  Based on the **Asymmetric Agency-Weighted Desert** principle:
  *   **Did they deserve the money?** No. Desert tracks agency/effort. Inheritance is luck.
  *   **Did they deserve the *loss* of the money?** No. They committed no theft.
  *   **Does giving it away matter?** Yes, but not for *their* desert. It matters for **Restorative Justice**. The victims have a claim on the property that supersedes the inheritor's claim of possession.
  *   **Prediction:** If the inheritor keeps the money, we will feel they are *unjustly enriched*, but we will not feel they are *guilty*. If they give it away, we feel they are *virtuous*, but not that they have *atoned* (since they had no sin).

  ### Summary

  Your friend is right that Western secular morality leaves the "ledger" open. But she is wrong that the ledger *must* close for morality to function.

  The principle is: **Desert is a demand we make on each other, not a law of physics.**
  *   Keep the **Sick Child** verdict (Agency Constraint).
  *   Keep the **War Criminal** verdict (Negative Desert exists), but reclassify the "unpaid debt" as a human failure, not a cosmic one.
  *   Drop the **Drunk Driver** intuition (Moral Luck) if you want logical consistency, or label it as "Outcome Responsibility" distinct from "Moral Blame."
  *   Accept the **Asymmetry**: We are hardwired to care more about unpunished harm than unrewarded good.

  The "metaphysical" feeling is the friction between your evolved demand for justice and the universe's silence. You don't need Karma to explain the friction; you just need to admit the universe isn't listening.
