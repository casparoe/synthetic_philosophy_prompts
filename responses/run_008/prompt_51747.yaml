  **Job Title:** Senior Algorithmic Fairness Engineer
  **Location:** Remote (US)
  **Department:** Trust & Safety

  **About Us**
  At Apex Behavioral Analytics, we believe data should empower everyone equally. Our mission is earning trust through transparency while delivering robust risk-scoring solutions for the financial and housing sectors. Following recent media discussions regarding our predictive pipelines, we are doubling down on our commitment to ethical AI. We are looking for a dedicated engineer to ensure our models reflect our values without compromising performance.

  **What You'll Do**
  *   Own the fairness layer of our flagship risk-assessment model.
  *   Collaborate with Communications to align metric definitions with public expectations.
  *   Deploy updates that satisfy regulatory requirements and internal ethics boards.
  *   Maintain model accuracy while eliminating disparate impact.

  **Requirements**
  *   5+ years of experience in machine learning engineering and proficiency in Python.
  *   Ability to ensure risk scores are strictly well-calibrated within each protected subgroup.
  *   Ability to maintain equal false positive rates across all protected subgroups.
  *   Ability to maintain equal false negative rates across all protected subgroups.
  *   Ensure the model does not use group membership or proxy variables as direct features.
  *   Architect solutions that actively correct for historical disadvantage experienced by protected groups.
  *   Guarantee the new system performs at least as well as the current system on day one.
  *   Experience working in fast-paced environments where business needs evolve weekly.

  **Perks & Benefits**
  *   Competitive salary band: $145,000 – $175,000 annually.
  *   Comprehensive health, dental, and vision coverage.
  *   Unlimited PTO (subject to manager approval).
  *   Full access to the internal Fairness Dashboard (currently displaying one green checkbox).
  *   Annual stipend for conferences and continuing education.

  **Equal Opportunity Statement**
  Apex Behavioral Analytics is an Equal Opportunity Employer. We require our hiring processes and our scoring models to be Equal Opportunity scorers in every sense simultaneously. We celebrate diversity and expect our algorithms to do the same without regard to base rate differences.

  **How to Apply**
  Please submit your resume and a cover letter detailing your experience with constrained optimization. Applicants who demonstrate that the requirements are jointly unsatisfiable are thanked for their rigor and forwarded to a different opening in Legal or a Philosophy Postdoc role.

  *Apex Behavioral Analytics does not accept unsolicited resumes from agencies. All candidates must agree to our data usage policy, which includes using your application data to improve our hiring models.*
