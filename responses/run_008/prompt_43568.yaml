          *   **Word Count:** Under 700 words.
          *   **Tone:** Audit, not treatise (direct, analytical).

  2.  **Analyze the Beliefs:**
      1.  *Whole-brain death = death.* (Organism-as-a-whole). Rejects higher-brain (PVS/unconscious ≠ dead).
      2.  *Dead-donor rule (DDR) is absolute.* No organs from living patients.
      3.  *Accepts Donation after Circulatory Death (DCD).* Pull plug, wait 2-5 mins, declare death, recover organs.
      4.  *Withdrawing ventilator from permanently unconscious = letting die (not killing).* Moral distinction holds.
      5.  *Death is biological fact, law recognizes it.* Motives of Harvard/1981 law don't invalidate the definition.
      *   *Side Note:* Brain-dead pregnant women kept on support feels "off."

  3.  **Identify Tensions:**
      *   *Tension A (Belief 1 vs. Belief 3):* This is the big one. DCD relies on circulatory criteria. If whole-brain death is the *only* biological death (Belief 1), then a patient whose heart stops but whose brain *could* theoretically be resuscitated (within the 2-5 min window) might not be "dead" by the whole-brain standard yet. However, DCD declares death based on irreversible cessation of circulatory function. If you accept DCD (Belief 3), you are accepting circulatory death as valid death. Belief 1 says "brain is what integrates... once entire brain is gone... corpse." Belief 3 implies "once heart stops for 5 mins... corpse." Are these consistent?
          *   *Nuance:* UDDA (Uniform Determination of Death Act) allows *either* irreversible cessation of circulatory/respiratory functions *or* all functions of the entire brain. Belief 1 seems to privilege whole-brain as the *rationale* for death ("the brain is what integrates"), potentially undermining circulatory death as "real" death. If death is strictly "brain integration lost," then a heart-stoppage patient isn't dead until the brain dies from lack of oxygen. In DCD, organs are taken *before* the brain is necessarily dead (neurons survive minutes after circulatory arrest). This threatens the Dead-Donor Rule (Belief 2) if Belief 1 is the strict biological definition.
      *   *Tension B (Belief 1 vs. Side Note):* Belief 1 says brain-dead = corpse. Side note says keeping brain-dead pregnant women on support feels "off." If it's a corpse, keeping it on support is essentially necrophilia or corpse manipulation. Why does it feel off? Probably because it treats the corpse as a means to an end (baby), which aligns with Belief 1 (it's not a patient), but the discomfort suggests a lingering intuition that it's still a "person" or "mother." This is more of an emotional tension than a logical contradiction, but worth noting.
      *   *Tension C (Belief 4 vs. Belief 1):* Belief 1 says permanently unconscious (higher-brain intact-ish, brainstem alive) = alive. Belief 4 says withdrawing vent from permanently unconscious = letting die. This is consistent. If they are alive, removing support lets them die. No tension here.
      *   *Tension D (Belief 2 vs. Belief 3):* Belief 2 says DDR is a bright line. Belief 3 accepts DCD. Critics argue DCD violates DDR because death isn't irreversible until organs are removed (auto-resuscitation risk). But legally/medically, DCD *is* considered death. If the user accepts standard medical protocol, this is fine. If the user holds a strict biological view (Belief 1), DCD is shaky.

