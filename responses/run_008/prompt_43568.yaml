      *   *Analysis of Moderate Tension:* If brain-dead = corpse (Belief 1), keeping them on vents for babies is using a corpse as an incubator. It feels "off" because it instrumentalizes the body, but logically it's consistent with Belief 1. The discomfort suggests you might value "bodily integrity" or "respect for remains" more than you admit.
      *   *Analysis of False Positive:* Belief 4 (withdrawing care from unconscious) works fine with Belief 1 (unconscious ≠ dead). You are allowing a living person to die from underlying pathology. No contradiction.

      *   *Revision:* Modify Belief 1 to align with the UDDA's dual criteria without privileging one as the "true" biological mechanism over the other. Or, reject DCD. Given the user wants to donate, modifying Belief 1 is better.

  5.  **Refining and Editing (Word Count Check):**
