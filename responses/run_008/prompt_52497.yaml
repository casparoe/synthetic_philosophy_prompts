  The paradox of deontology arises from evaluating moral choices through the lens of Causal Decision Theory (CDT), which treats the agent's act as an isolated causal lever pulled against a fixed background. Under CDT, refusing to kill one innocent to save five appears irrational because the agent's causal influence extends only to the immediate act, rendering the deaths caused by others independent of the agent's constraint. However, this framing ignores the structure of rational agency itself. An updateless agent does not choose acts; she selects a policy—a mapping from information states to actions—before observing the specific details of her situation. When deontology is modeled as policy selection rather than act evaluation, the paradox dissolves. The deontologist's refusal is not a failure to maximize good outcomes in a single instance, but the local execution of a policy whose value derives from its logical implications across the population of correlated reasoners.

  This mirrors the resolution of Newcomb's Problem. The two-boxer argues that the boxes are already sealed, so taking both causally dominates taking one. The one-boxer responds that her choice is logically correlated with the predictor's past simulation; she chooses not an act, but the output of an algorithm that determines both her move and the prediction. Similarly, the deontologist stands to the consequentialist accuser as the one-boxer stands to the two-boxer. The constraint "never kill an innocent" is a policy that, when adopted by structurally similar agents, prevents the systemic horror of utilitarian calculus where anyone might be sacrificed for the greater good. The correlation required is not causal but logical: if I am a rational agent facing a transplant case, another rational agent facing a structurally identical case runs the same decision procedure. My refusal determines theirs via logical necessity, not causal influence.

  The strongest consequentialist rejoinder notes that real-world correlations are weak; other agents are not near-copies, and my refusal does not functionally determine their choices. Furthermore, in the Least Convenient Possible World (LCPW), we stipulate that correlation is entirely absent. Here, the decision-theoretic analogy requires careful qualification. It is true that if an agent knows with certainty that no logical or causal correlation exists, updateless decision theory collapses to causal decision theory, and the instrumental value of the constraint vanishes. However, the deontological argument survives not by claiming hidden consequences, but by asserting that rational agency involves *ex-ante* commitment that binds *ex-post*. To be the kind of agent who secures the benefits of cooperation in high-correlation worlds, one must adopt a policy that is robust to low-correlation exceptions. Reneging on the constraint when correlation disappears is time-inconsistent; it reveals the agent was never truly committed to the policy, but only to its payouts.

  This is not a covert consequentialist rescue because the value being protected is not the sum of outcomes in the LCPW, but the integrity of the agent's algorithm. The deontologist argues that moral reasoning is the selection of a universalizable policy, not the optimization of local states. Even in the LCPW, violating the constraint requires re-evaluating the policy based on new information, which updateless agents refuse to do by definition. They choose the policy that is optimal behind a veil of ignorance regarding which world they inhabit. Thus, the paradox dissolves: the deontologist is not ignoring the arithmetic of death, but refusing to evaluate the arithmetic on a causal framework that excludes the logical dependencies inherent in moral reasoning. The constraint is rational because it is the output of a policy selected to govern all instances of the choice, not just the one where the agent happens to stand.
