      *Refining the Genocide Probability:* Is 0.25 too low? Some historians (Functionalists) argue the bureaucracy led to it. Others (Intentionalists) say Hitler was essential. I need to split the difference but lean towards Intentionalism for *industrial* genocide. Discrimination? High probability. Gas chambers? Lower probability without Hitler. I will stick with 0.25 for the *specific* genocidal nature.

      *Refining the Intervention Points:*
