      *   1923: NSDAP exists but leaderless. Strasserism might dominate (more anti-capitalist, less racial-biological focus initially).
      *   Difference: 1923 is higher risk because the party machine is built, but still low overall for *genocide*.

      *Let's finalize the numbers:*
