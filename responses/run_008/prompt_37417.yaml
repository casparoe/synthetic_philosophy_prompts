  8.  **Final Polish:** Check tone. Direct, analytical, beer-fight appropriate.

      *(Final thought on the "Friend's Definition")*: If the friend defines Nazi Germany as "Authoritarian Nationalist," then the probability is 0.85. If the user defines it as "Genocidal," it's ~0.20. This is the key insight to highlight.

