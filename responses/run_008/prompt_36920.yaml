  3.  **Drafting the Correspondence Table:**

      *   *Rawls:* Parties in Original Position -> Veil of Ignorance -> Principles of Justice -> Strain of Commitment.
      *   *Hitchhiker/UDT:* Temporal selves (Desert-Self, Town-Self) / Possible World Instantiations -> Ignorance of Location/State (Pre-prediction) -> Decision Policy/Algorithm -> Ability to stick to the policy despite local incentives.

  4.  **Analyzing the Disanalogies (The "Breaks"):**

      *   *Disanalogy 1: Distinct Persons vs. Temporal Selves.*
          *   Rawls: Conflicting interests. I might be rich, you might be poor. We need fairness to adjudicate conflict.
