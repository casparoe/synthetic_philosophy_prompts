      *   *Disanalogy 2: Ignorance of Probabilities.*
          *   Rawls: Principle of Insufficient Reason / Maximin. You don't know the distribution of classes.
          *   Hitchhiker: You know the probabilities (e.g., Driver predicts correctly 99% of the time). UDT relies on expected utility calculations, not maximin.
