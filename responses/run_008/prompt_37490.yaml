      *   **Topic:** The nature of privacy in fiction vs. reality, sparked by a memoirist's talk.
      *   **Core Claim by Memoirist:** Privacy = Secrecy (with a nicer name); Privacy exists only due to fear of embarrassment/punishment ("nothing to hide" argument); Historical claim: Villages had no privacy and people were fine; Fictional privacy = modern anxiety projected backwards.
