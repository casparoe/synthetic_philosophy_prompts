answer: |-
  # Which Position on Moral Luck Do You Actually Hold?

  **Instructions:** Below are ten scenarios. Read each one and select the option that best matches your immediate intuition. Do not overthink, and do not worry about what the "law" says; answer based on what you feel is fair or true. There are no right or wrong answers.

  ***

  ### 1. The Two Drunks
  Two friends have exactly the same amount to drink. They both decide to drive home. They drive with the same level of carelessness. On the way, a child chases a ball into the road.
  *   **Driver A** hits and kills the child.
  *   **Driver B** does not encounter the child and arrives home safely.

  **How should we judge them?**
  *   **A.** They are equally guilty of the same wrong, and should receive the same punishment.
  *   **B.** They are equally guilty of the same wrong, but Driver A deserves heavier punishment.
  *   **C.** Driver A is guilty of a worse wrong than Driver B, and deserves heavier punishment.

  ### 2. The Two Snipers
  Two assassins are hired to kill a target. They both take the shot at the same moment from the same distance.
  *   **Assassin A's** bullet is deflected by a bird flying past at the last second.
  *   **Assassin B's** rifle jams due to a rare mechanical fault before the trigger is fully pulled.
  Both fail. Neither could have predicted the bird or the jam.

  **Who is more blameworthy?**
  *   **A.** They are equally blameworthy.
  *   **B.** Assassin B is less blameworthy (the gun failing made the failure more secure).
  *   **C.** Assassin A is less blameworthy (nature intervened to stop the bullet).

  ### 3. The Lucky Rescuer
  Two people see someone struggling in deep water. Both jump in to save them.
  *   **Rescuer A** grabs the victim and pulls them to shore.
  *   **Rescuer B** grabs the victim, but unknown to them, a strong underwater current was already pushing the victim toward the shore. Rescuer B gets the credit, but the victim would have survived anyway.

  **Who deserves more praise?**
  *   **A.** Rescuer A deserves more praise.
  *   **B.** They deserve equal praise for their willingness to act.
  *   **C.** Neither deserves praise; it was all chance.

  ### 4. The Forty-Mile Border
  *   **Person A** was recruited into a brutal militant group at age eight, raised in their camps, and indoctrinated to believe violence is holy.
  *   **Person B** despises that group. However, Person B was born forty miles away; had they been born in Person A's village, they would have been recruited and indoctrinated in the exact same way.

  **How do they compare morally?**
  *   **A.** Person A is less responsible for their actions than Person B would have been.
  *   **B.** They are equally responsible for the choices they make today.
  *   **C.** Person A is not responsible at all; they are a victim of circumstance.

  ### 5. The Hidden Embezzlement
  Two managers steal the exact same amount from their company using the exact same method.
  *   **Manager A** is caught because an unrelated audit happens to check their files.
  *   **Manager B** is never caught; the audit skips their files by chance.

  **Does being caught change their guilt?**
  *   **A.** No, they are equally guilty.
  *   **B.** Yes, Manager A is more guilty because their act was exposed.
  *   **C.** No, they are equally guilty, but Manager A faces consequences Manager B avoids.

  ### 6. The Aftermath
  Two drivers run a red light and hit a pedestrian.
  *   **Driver X's** victim dies instantly and has no family. The case is closed.
  *   **Driver Y's** victim survives with severe injuries. Driver Y must visit the hospital, pay medical bills, and face the victim's anger for years.

  **Does the ongoing burden matter?**
  *   **A.** Driver Y carries a heavier moral burden because of the ongoing relationship and debt.
  *   **B.** They carry the same moral burden; the extra work for Driver Y is just practical, not moral.
  *   **C.** Driver X has it worse, because they never get the chance to make amends.

  ### 7. The Broken Jaw
  Two people get into an identical argument and throw an identical punch.
  *   **Puncher A** misses; the other person ducks.
  *   **Puncher B** lands the punch and breaks the other person's jaw.

  **How should the law treat them?**
  *   **A.** Same crime, same sentence.
  *   **B.** Same crime, but Puncher B gets a heavier sentence.
  *   **C.** Different crimes (Attempted Assault vs. Actual Assault), different sentences.

  ### 8. The Opportunity to Cheat
  *   **Taxpayer A** finds a loophole in the tax code and uses it to save money.
  *   **Taxpayer B** wants to do the same thing but cannot; their income is too simple to use the loophole.

  **Who is more unethical?**
  *   **A.** Taxpayer A is worse because they actually cheated.
  *   **B.** They are equally unethical; they both wanted to cheat.
  *   **C.** Taxpayer A is not unethical; they used the rules as written.

  ### 9. The Forgotten Baby
  A parent accidentally leaves a baby in a hot car while going into work.
  *   **Parent A** remembers twenty minutes later; the baby is distressed but fine.
  *   **Parent B** does not remember until the end of the day; the baby dies.
  The forgetfulness was identical; only the memory retrieval differed.

  **How do we judge the parent?**
  *   **A.** Parent B is guilty of a far greater wrong.
  *   **B.** They made the same mistake; the outcome is tragic luck.
  *   **C.** Parent B is not guilty of a crime, only a tragedy.

  ### 10. The Broken Vase
  You accidentally break a friend's vase.
  *   **Scenario 1:** The friend is wealthy, has ten more vases, and doesn't care.
  *   **Scenario 2:** The friend is poor, this was their only vase, and they are devastated.

  **What do you owe them?**
  *   **A.** I owe the same apology and replacement cost in both cases.
  *   **B.** I owe more repair and apology in Scenario 2 because the harm is worse.
  *   **C.** I owe nothing in Scenario 1, but everything in Scenario 2.

  ***

  # Scoring Key & Interpretation

  Do not count your points yet. This key does not work by adding up "A"s or "B"s. It works by comparing how you answered specific *pairs* of questions. Your position is defined by the pattern of your intuitions, not a single score.

  Find the profile below that best matches your pattern of answers.

  ### Dimension 1: The Outcome Gap (Questions 1, 7, 9)
  *Look at your answers to the Drunk Drivers (1), The Broken Jaw (7), and The Forgotten Baby (9).*

  *   **If you mostly chose "Equal guilt/wrong" (Option A or B in Q1/Q7/Q9):** You hold to the **Control Principle**. You believe moral status is determined by what the agent controlled, not what happened afterward.
  *   **If you mostly chose "Different guilt/wrong" (Option C in Q1/Q7/Q9):** You are an **Outcome Realist**. You believe the actual harm done changes the nature of the wrong itself, not just the penalty.
  *   **If you mostly chose "Equal guilt, Different punishment" (Option B in Q1/Q7):** You are a **Pragmatic Legalist**. You believe the moral wrong is the same, but society is permitted (or required) to punish based on harm for practical reasons (deterrence, public anger, insurance).

  ### Dimension 2: The Background Check (Questions 4, 8)
  *Look at your answers to The Forty-Mile Border (4) and The Opportunity to Cheat (8).*

  *   **If you said background/opportunity changes responsibility (Option A or C in Q4; Option B in Q8):** You accept **Constitutive/Circumstantial Luck**. You believe who we are and the chances we get are part of our moral record.
  *   **If you said they are equally responsible (Option B in Q4; Option A in Q8):** You reject Constitutive Luck. You believe the will matters more than the history or the opportunity.

  ### Dimension 3: The Symmetry Test (Question 3)
  *Look at The Lucky Rescuer (3).*

  *   **If you said Rescuer A deserves more praise:** You treat **Credit and Blame Asymmetrically**. You are willing to let luck reduce praise, but you might be hesitant to let luck reduce blame (or vice versa).
  *   **If you said they deserve equal praise:** You treat **Credit and Blame Symmetrically**. Whatever rule you applied to the drunk drivers in Q1, you are applying here too.

  ### Dimension 4: The Trace Theory (Question 6)
  *Look at The Aftermath (6).*

  *   **If you chose Option A:** You hold a **Relational View**. You believe moral weight is generated by the ongoing traces of the act (the debt, the relationship, the repair), not just the moment of impact.
  *   **If you chose Option B:** You hold a **Snapshot View**. You believe the moral event was completed at the moment of the crash; everything after is just cleanup.

  ### Dimension 5: The Obligation Shift (Question 10)
  *Look at The Broken Vase (10).*

  *   **If you chose Option B or C:** You are a **Forward-Looking Consequentialist**. You believe what you "owe" is determined by the needs of the victim and the future repair, not by a fixed debt created by the act.
  *   **If you chose Option A:** You are a **Backward-Looking Deontologist**. You believe the act created a fixed duty that does not change based on how much the victim suffers.

  ***

  # Identifying Your Position

  Match your pattern from the Dimensions above to one of these five profiles.

  ### 1. The Control Keeper (The Strict View)
  *   **Pattern:** Equal guilt on Outcomes (Dim 1); Equal responsibility on Background (Dim 2); Symmetric on Praise (Dim 3).
  *   **What this means:** You believe luck should never change how we judge a person's character or guilt. If two people intended the same thing and took the same risks, they are morally identical, regardless of the mess left behind.
  *   **Standard Label:** *The Kantian* or *The Control Theorist*.
  *   **Note:** This view is logically clean but often conflicts with legal practice and deep emotional intuition.

  ### 2. The Outcome Realist
  *   **Pattern:** Different guilt on Outcomes (Dim 1); Equal responsibility on Background (Dim 2).
  *   **What this means:** You believe that what actually happens in the world matters to morality, not just what happens in the mind. A dead victim makes the act worse, even if the driver's mind was the same. However, you don't think upbringing excuses behavior.
  *   **Standard Label:** *The Moral Luck Realist*.
  *   **Note:** This is the most common intuitive view, though it is difficult to defend philosophically without admitting that luck controls morality.

  ### 3. The Pragmatic Legalist
  *   **Pattern:** Equal guilt but Different punishment on Outcomes (Dim 1, Option B); Forward-looking on Obligation (Dim 5).
  *   **What this means:** You separate the *sin* from the *sentence*. You believe the drivers are equally bad people, but the one who killed must pay more because the world needs repair, or because the law must reflect the harm. You relocate the difference from "blame" to "what is owed."
  *   **Standard Label:** *The Two-Stage Theorist* (No standard name exists; this is a hybrid position common in legal practice).
  *   **Note:** This view attempts to save the Control Principle for moral judgment while accepting Outcome Luck for social regulation.

  ### 4. The Skeptic (The Abolitionist)
  *   **Pattern:** Accepts Luck on Outcomes (Dim 1); Accepts Luck on Background (Dim 2); Accepts Luck on Praise (Dim 3).
  *   **What this means:** You see luck everywhere. If luck determines the outcome, and luck determines the upbringing, and luck determines the opportunity, then "responsibility" seems to vanish. You likely feel that blame is a useful tool, but not literally "true."
  *   **Standard Label:** *The Hard Incompatibilist* or *The Skeptic*.
  *   **Note:** If you scored high on luck acceptance across all dimensions, you may logically be forced to conclude that no one is truly blameworthy, only dangerous or in need of help.

  ### 5. The Relational Repairer
  *   **Pattern:** Snapshot View rejected (Dim 4, Option A); Forward-Looking (Dim 5, Option B).
  *   **What this means:** You don't care much about the abstract "blame" at the moment of the act. You care about the traces the act leaves. If there is no victim to repair (Q6), the moral burden is lighter. If the victim needs help (Q10), the burden is heavier.
  *   **Standard Label:** *The Restorative Justice Theorist* (No precise philosophical label; this is a practice-led position).
  *   **Note:** This view sidesteps the luck debate by focusing on obligation rather than desert.

  ***

  # Limitations & Blind Spots

  **1. The Skeptic vs. The Nihilist**
  This quiz cannot distinguish between someone who thinks "Blame is false" (The Skeptic) and someone who thinks "Blame is irrelevant" (The Nihilist). Both will answer similarly on the luck questions, but for different reasons. The quiz assumes you care about morality; it cannot detect if you don't.

  **2. The Legalist vs. The Consequentialist**
  If you answered "Equal guilt, Different punishment" (Pragmatic Legalist), the quiz cannot tell if you do this because you think punishment is for *deterrence* (Consequentialism) or because you think the law must reflect *public outrage* (Expressivism). Both lead to the same answer here.

  **3. The Unexplored Combination: "Blame Luck, Not Character"**
  There is a coherent position where you say Outcome Luck changes *what you did* (the offense), but not *who you are* (your character). For example: "Driver A committed manslaughter, Driver B committed reckless driving, but they are equally bad people."
  *   **Status:** This combination is logically coherent but rarely defended in isolation. Most people either link the act to the character (Outcome Realist) or separate them entirely (Control Keeper). If you held this view, the quiz likely sorted you as a Pragmatic Legalist, but your internal reasoning may be more nuanced.

  **4. The Praise/Blame Asymmetry**
  If you said luck matters for blame (Q1) but *not* for praise (Q3), you hold an **Asymmetrist** view.
  *   **Status:** This is a known philosophical position, but the quiz does not have a specific profile for it. It suggests you view morality as primarily about preventing harm rather than rewarding good, or that you are more protective of credit than you are of blame.

  **5. Constitutive Luck vs. Outcome Luck**
  It is possible to accept Outcome Luck (Q1) but reject Constitutive Luck (Q4), or vice versa.
  *   **Status:** If you did this, you do not fit neatly into "The Skeptic" or "The Control Keeper." You believe luck matters when things go wrong in the world, but not when things go wrong in your upbringing. This is a common intuitive stance, but it is philosophically unstable: if luck matters for results, why doesn't it matter for the will that produced them? The quiz flags this tension but does not resolve it.
