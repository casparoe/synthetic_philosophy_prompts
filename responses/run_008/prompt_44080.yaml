          *   We lose a *unified* formal theory of all belief change. We have to admit that Bayesianism handles "normal science" (puzzle solving) well, but "scientific revolutions" (paradigm shifts) require a different account (e.g., Jeffrey Conditionalization, or non-formal accounts).
