      *   **The Problem:** Someone argues that the Dutch Book machinery (specifically the diachronic Dutch Book argument for Conditionalization) condemns central cases of scientific rationality (theory change, conceptual revision).
      *   **The Argument Structure:**
          1.  Synchronic DBA $\rightarrow$ Probabilistic Coherence is required.
          2.  Diachronic DBA $\rightarrow$ Conditionalization is required (Lewis/Teller style).
          3.  Therefore, *any* planned departure from conditionalization is irrational (including conceptual change/theory shift).
          4.  But conceptual change/theory shift *is* rational (scientific progress).
