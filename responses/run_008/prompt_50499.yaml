answer: |-
  Your framing is philosophically robust and aligns with contemporary debates in normative ethics (specifically the work of Heyd, Portmore, and Supererogationists vs. Consequentialists). The tension between the *structure* of moral categories (thresholds) and the *content* of duty (demandingness) is genuine. I have not adjusted the premise, but I have sharpened the question to ensure students cannot simply describe the categories without evaluating the *inference* from suberogatory symmetry to threshold validity.

  ### (i) Essay Question

  "Critics allege that supererogation is merely an ideological device to protect the comfortable from demanding moral requirements. Assess whether positing a symmetrical category of the suberogatory provides sufficient structural justification for a non-arbitrary threshold of duty, or whether the demandingness objection collapses the distinction entirely."

  ### (ii) Model Answer

  The standard deontic trichotomy—obligatory, permissible, forbidden—appears unable to accommodate acts of heroic sacrifice that are praiseworthy yet not required. Urmson argued that without a category for the supererogatory, morality becomes overly austere. However, this category presupposes a threshold view of duty: a line separating the required from the optional. Singer-style demandingness arguments challenge this line, suggesting that if we are obligated to prevent bad outcomes whenever the cost is comparable to the moral importance of the outcome, the threshold shifts radically upward. On this view, much of what we call supererogatory is actually obligatory, rendering the category a mere shield for privilege.

  To defend the threshold, some philosophers point to the suberogatory: acts that are bad or mildly blameworthy but not forbidden. Heyd argues that moral logic should be symmetrical; if there is a ceiling of obligation (supererogation), there should be a floor (suberogation). The existence of intuitively suberogatory acts (e.g., queue-jumping where no one is seriously harmed) is taken as evidence that the threshold structure is real, not arbitrary. If we recognise a zone below duty that is not forbidden, it lends credence to a zone above duty that is not required.

  However, this structural symmetry does not solve the substantive problem of *where* the threshold lies. A consequentialist can accept the logical coherence of suberogation while maintaining that the threshold of duty is set at maximal utility. For Singer, failing to donate all disposable income might be suberogatory (bad but not legally forbidden), yet still morally obligatory. The symmetry argument validates the *architecture* of deontic logic but fails to secure the *location* of the duty threshold against demandingness objections. It shows that thresholds are conceptually possible, not that our current placement of them is justified.

  Therefore, the suberogatory does not fully rescue supererogation from the charge of protecting the comfortable. To do that, one needs a substantive account of "reasonable cost" or "fair share" that limits duty independently of outcome maximisation. Without such an account, the threshold remains vulnerable to the claim that it is arbitrary. The suberogatory confirms that morality has texture, but it does not prove that the line between duty and sacrifice sits where common sense prefers. Ultimately, saving supererogation requires more than structural symmetry; it requires rejecting the consequentialist calculus that drives demandingness.

  ### (iii) Marking Scheme

  **1. Contextualisation of the Trichotomy and Supererogation**
  *   **4 marks:** Clearly explains the standard trichotomy and Urmson's critique that it excludes the praiseworthy-but-not-required.
  *   **2 marks:** Mentions supererogation but fails to explain why the trichotomy is insufficient.
  *   **0 marks:** No reference to the trichotomy or Urmson's problem.

  **2. Engagement with Demandingness Objections**
  *   **4 marks:** Accurately articulates Singer's argument that cost-benefit reasoning collapses the supererogatory into the obligatory.
  *   **2 marks:** Mentions demandingness but treats it as a general complaint rather than a structural challenge to the threshold.
  *   **0 marks:** No mention of demandingness or Singer-style arguments.

  **3. Analysis of the Threshold Problem**
  *   **4 marks:** Explicitly identifies the core issue: the need for a non-arbitrary line between duty and optionality.
  *   **2 marks:** Discusses duty but fails to highlight the problem of arbitrariness or threshold location.
  *   **0 marks:** Treats the threshold as fixed or unproblematic.

  **4. Evaluation of the Suberogatory Inference**
  *   **4 marks:** Critically assesses the symmetry argument (Heyd), distinguishing between logical coherence and substantive justification.
  *   **2 marks:** Describes the suberogatory but accepts the symmetry argument uncritically as a solution.
  *   **0 marks:** No mention of the suberogatory or the symmetry argument.

  **5. Critical Position and Conclusion**
  *   **4 marks:** Takes a clear stance on whether the category collapses or survives, supported by the preceding argument.
  *   **2 marks:** Offers a conclusion but it is vague or contradicts the body of the essay.
  *   **0 marks:** No clear conclusion or position taken.

