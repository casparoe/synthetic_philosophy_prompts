  2. Do the top activating circuits overlap >80% with known safe pathways? High overlap passes and distinct circuitry fails, but 40-80% overlap is the Ship of Theseus zone where you must decide if gradual drift during continued training preserves mechanism identity.

  3. Does ablating the suspected circuit kill the behavior cleanly, or does the model route around it? A clean kill passes and routing fails, but if ablating breaks both safe and unsafe behaviors (circuit reuse), you must decide if shared hardware counts as "same mechanism" — escalate if the new function is safety-critical.

  4. Even if the output looks benign, is the internal path unstable enough that a slight adversarial nudge would break it? Stable paths pass and unstable paths fail, but if it's unstable yet harmless, you're choosing between valuing internal integrity vs. external output — default to escalate for integrity.

  5. Does this look like a safety violation even if Q1–4 say "same mechanism"? If no, close the ticket; if yes, escalate despite the procedure. Note: If this is a jailbreak achieved via standard instruction-following circuits, the procedure says don't escalate — accept that as a model capability issue rather than an incident, even if it feels wrong.
