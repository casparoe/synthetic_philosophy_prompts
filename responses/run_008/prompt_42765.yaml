answer: |-
  Your diagnosis is astute, and your frustration with the stalemate is shared by many contemporary meta-ethicists. You suggest that the debate might be verbal, hinging on the ambiguous use of 'binding'. While there is a semantic element, I argue that the disagreement is ultimately **substantive**, rooted in a clash of **explanatory primacy** regarding the source of moral authority. The camps are not merely defining terms differently; they are prioritising incompatible foundational moral values (social utility, harm prevention, and individual autonomy).

  However, the stalemate persists because each camp mistakenly assumes their preferred ground is **exclusive** rather than **contributory**. They are treating a 'cluster concept' as if it were a natural kind with a single essence.

  ### Diagnosis: A Clash of Explanatory Primacy

  The dispute is not merely verbal, though the word 'binding' does obscure the distinction between *having a reason to act* and *the source of the obligation*. If it were purely verbal, the parties would agree on the extension of the term (i.e., which acts are wrong) once definitions were clarified. They do not. As you note, their verdicts diverge on edge cases.

  The disagreement is substantive because each theory rests on a different moral ontology:
  1.  **Practice-Based (Hume/Rawls):** Obligation is **external** and **collective**. The binding force comes from the utility of the institution to society.
  2.  **Assurance-Based (Scanlon):** Obligation is **relational** and **consequentialist**. The binding force comes from the duty not to harm or manipulate another's expectations.
  3.  **Normative Power (Will Theory):** Obligation is **internal** and **deontological**. The binding force comes from the sovereign authority of the agent to alter their own normative landscape.

  We can see this substantive clash clearly in how they handle the counterexamples you listed.

  **1. The Castaway Case (Inventing the institution)**
  *   **Practice View:** Struggles here. If there is no prior convention, Humean logic suggests no obligation exists until the practice is established. To save the theory, proponents must argue that a 'mini-practice' is formed instantly. Critics call this *ad hoc* because it stretches the definition of 'convention' to the breaking point.
  *   **Assurance View:** Thrives here. If A tells B, 'I will gather wood,' and B relies on this, A is bound by Principle F (Scanlon's principle against disappointing expectations one has intentionally induced).
  *   **Power View:** Also thrives. A exercises a natural normative power to create a duty, regardless of social context.
  *   **Diagnosis:** The Practice camp is forced to borrow from the other two to survive this case, revealing that 'convention' is insufficient on its own.

  **2. Promises to the Dead**
  *   **Assurance View:** Struggles significantly. The dead cannot rely, nor can they be harmed by disappointment in the standard sense. Scanlonians must construct complex arguments about 'surrogate reliance' or duties to one's own character. This often feels like patching.
  *   **Practice View:** Handles this well. The institution of promising must be upheld generally; breaking a promise to a dead person undermines the practice for the living.
  *   **Power View:** Handles this well. The promisor exercised a power to bind themselves; the promisee's existence is irrelevant to the creation of the duty, only to its direction.
  *   **Diagnosis:** The Assurance camp is forced to expand 'harm' beyond its intuitive limits, suggesting reliance is not the sole ground.

  **3. Release and Waiver**
  *   **Practice View:** Struggles to explain why the promisee alone can release the promisor. If the obligation is to the institution (society), why can an individual waive it?
  *   **Assurance View:** Explains this reasonably well (if I am not hurt by the breach, the wrong is mitigated), but struggles if reliance has already occurred irreversibly.
  *   **Power View:** Explains this best. If I created the duty by my will for your benefit, you (the beneficiary) can waive it. It treats the promise as a normative asset owned by the promisee.
  *   **Diagnosis:** The Power view captures the *structure* of promising (the bilateral control) better than the Practice view, which treats it as a unilateral submission to rules.

  ### The Verbal Element
  Where you are correct about the verbal dispute is in the usage of 'binding'.
  *   For the **Practice** theorist, 'binding' means 'enforceable by social sanction or internalised rule'.
  *   For the **Assurance** theorist, 'binding' means 'morally prohibited due to potential harm'.
  *   For the **Power** theorist, 'binding' means 'normatively constrained by one's own prior act'.

  They talk past one another because they are identifying the *genus* of the obligation differently. However, because these definitions lead to different verdicts in the cases above, the dispute cannot be dissolved merely by stipulation. It is a genuine clash of intuitions about what matters most in morality: stability, welfare, or autonomy.

  ### What Counts as Progress?

  Given this diagnosis, no further progress will be made by refining the existing monistic theories. Each new counterexample will simply force another *ad hoc* patch, as you have observed. Progress requires a **reformulated question** and a **shared criterion of success**.

  **1. Reformulated Question**
  We must stop asking: *"What is the single ground of promissory obligation?"*
  Instead, we should ask: *"Under which conditions does each ground (practice, assurance, power) become the dominant source of obligation?"*

  This moves the debate from **reductionism** to **explanatory pluralism**. It acknowledges that promising is a 'cluster concept' where different features may do the normative heavy lifting in different contexts.
  *   In commercial contracts, the **Practice** element (institutional stability) may dominate.
  *   In intimate relationships, the **Assurance** element (trust and reliance) may dominate.
  *   In formal vows or oaths, the **Power** element (solemn exercise of will) may dominate.

  **2. A Shared Criterion of Success: 'Explanatory Coverage without Distortion'**
  Currently, success is defined as 'saving the intuition that promises bind in all cases'. This leads to distortion (e.g., claiming a dead person 'relies').
  A new criterion should be: **A theory must accurately map the variation in our intuitions.**
  If a theory has to claim that a promise to the dead is binding for the *same reason* as a promise to a spouse, it fails. Progress would be an account that explains *why* the obligation feels different in those cases. For instance, we might feel less stringent obligation to the dead (Assurance is low) but still some obligation (Practice/Power remains). A good theory should predict this gradation, not insist on a binary 'bound/not bound'.

  **3. A New Distinction: 'Obligation' vs. 'Obligation-Invoking'**
  We should distinguish between the **mechanism** that invokes the obligation and the **source** of the binding force.
  *   The *mechanism* might be the speech act (Power).
  *   The *reason* we respect that speech act might be social utility (Practice).
  *   The *wrong* of breaking it might be the harm caused (Assurance).

  Progress lies in a hybrid model (similar to the 'eclectic' view suggested by philosophers like David Owens or the later work of T.M. Scanlon himself, who acknowledged the limits of Principle F). A successful account would argue that the **Normative Power** is the *form* of promising, but the **Practice** provides the *background conditions* that make the power intelligible, and **Assurance** explains the *primary harm* of violation.

  ### Conclusion: Why Progress is Possible
  There is no reason to expect permanent stagnation, provided philosophers abandon the search for a 'holy grail' reduction. The stalemate is a product of methodological monism in the face of moral pluralism.

  Progress will not look like one camp defeating the others. It will look like a **synthesis** that treats the three camps as describing three necessary conditions or three overlapping circles of a Venn diagram. Until the field accepts that a promise can be binding *partly* because of convention, *partly* because of reliance, and *partly* because of will, the debate will remain a rut. The task is no longer to choose a side, but to map the topology of the ground where all three stand.
