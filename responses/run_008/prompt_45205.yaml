  ***

  ### The Commemoration Quiz: What Do You Actually Believe?

  We all have labels we use in arguments about statues and street names. You might call yourself a "preservationist" who hates erasing history, or a "progressive" who wants harmful symbols down. But here is the uncomfortable truth: most people who call themselves against removal answer the concrete cases like contextualists, and plenty of self-described removalists balk at the museum option once they see what's actually involved.

  This quiz is designed to catch that mismatch. It is a decision tree. Do not think about your general philosophy; answer the specific scenario. Follow the arrows. At the end, you will land on a named position. Read the "Awkward Commitment" carefully—that is the price of the ticket for that view.

  **Instructions:** Start at **Question 1**. Based on your answer, jump to the next question indicated.

  ***

  **Q1. The Inseparable Case.**
  A statue honors a General whose primary historical achievement was winning a war fought explicitly to defend slavery. The military victory and the defense of slavery are historically inseparable.
  *   **A)** The statue should remain in its public location. (Go to **Q2**)
  *   **B)** The statue should be removed from its public location. (Go to **Q5**)

  **Q2. The Drifted Meaning Case.**
  (You voted to keep the General). Now consider a different statue: a founder whose name is on a park bench. Nobody living remembers who he was or what he did; locals just love the bench as a sunny meeting spot. The original intent is forgotten, but the current function is beloved.
  *   **A)** Keep it exactly as is; the current use matters more than the origin. (Go to **Q3**)
  *   **B)** We still need to address the origin, even if people like the bench. (Go to **Q3**)

  **Q3. The Authority Case.**
  (You are in the "Keep" track). The City Council votes to keep a controversial statue to "avoid division," but descendants of the harmed group demand its removal. Who decides?
  *   **A)** Respect the Council's vote; procedural democracy wins. (Go to **Q4**)
  *   **B)** Overrule the Council; moral authority outweighs the vote. (Go to **Q4**)

  **Q4. The Context Case.**
  (You are in the "Keep" track). The statue stays. How do we handle the controversy?
  *   **A)** Add a plaque with historical text to explain the complexity. (Go to **Leaf: Contextualist**)
  *   **B)** Install a competing work of art nearby to subvert or shadow the original. (Go to **Leaf: Counter-Memorialist**)
  *   **C)** Do nothing; adding commentary compromises the integrity of the original object. (Go to **Leaf: Retentionist**)

  **Q5. The Compartment Case.**
  (You voted to remove the General). Now consider a different figure: a renowned Scientist or Poet honored for their work. They held awful private views, but those views did not influence their work. Late in life, they publicly repudiated those views.
  *   **A)** Keep their statue; the work and the redemption matter more than the past views. (Go to **Leaf: Contextualist**)
  *   **B)** Remove their statue too; we honor the whole person, not just their output. (Go to **Q6**)

  **Q6. The Museum Case.**
  (You are in the "Remove" track). The statue comes down. What happens to the physical object?
  *   **A)** Move it to a museum with full historical context for study. (Go to **Leaf: Relocationist**)
  *   **B)** Do not preserve it publicly; the public square is not a classroom. (Go to **Q7**)

  **Q7. The Replacement Case.**
  (You are in the "Remove" track). The plinth is empty. What goes there?
  *   **A)** Leave it empty; the absence is the message. (Go to **Leaf: Removalist (Empty)**)
  *   **B)** Erect a new statue honoring a figure from the harmed group. (Go to **Leaf: Removalist (Replacement)**)

  **Q8. The Harm Case.**
  (Answer this regardless of your path). A statue causes visible distress to passersby who feel targeted by it.
  *   **A)** That pain is a sufficient reason for removal, regardless of historical value.
  *   **B)** Pain is unfortunate, but historical principle must endure it.

  ***

  ### Your Result

  **The Retentionist**
  *   **Gloss:** Public space is an archive, not a morality play. We keep objects to preserve the record, not to endorse the subject.
  *   **The Awkward Commitment:** You must accept that some citizens will feel actively unwelcome in their own town as the price of historical continuity.

  **The Contextualist**
  *   **Gloss:** Education solves moral conflict. We keep the object but add text (plaques, tours) to complicate the narrative.
  *   **The Awkward Commitment:** You must believe that reading a plaque is sufficient to neutralize the psychological impact of a towering symbol of oppression.

  **The Counter-Memorialist**
  *   **Gloss:** Tension is more valuable than resolution. We keep the object but surround it with new art that critiques it, forcing a dialogue.
  *   **The Awkward Commitment:** You must accept visual clutter and permanent conflict in public spaces, rather than seeking a clean resolution.

  **The Relocationist**
  *   **Gloss:** Public space is for shared virtue; museums are for history. Remove the object from the square, but preserve it for study.
  *   **The Awkward Commitment:** You must accept the critique that you are effectively "sweeping it under the rug" to make the present comfortable, potentially obscuring history.

  **The Removalist (Empty Plinth)**
  *   **Gloss:** Some symbols are too toxic to coexist with justice. Remove the object and leave a gap to signify the loss and the wrong.
  *   **The Awkward Commitment:** You must defend the value of an empty space, which critics will dismiss as a vacuum or a wasted opportunity.

  **The Removalist (Replacement)**
  *   **Gloss:** Commemoration is zero-sum. To correct the record, the honored space must be given to those previously excluded.
  *   **The Awkward Commitment:** You must accept that you are engaging in the same act of selection you criticized—choosing one hero to eclipse another—rather than ending the "great man" tradition.

  ***

  ### Philosopher's Postscript: Design Notes

  *As requested, here is the internal logic behind the tree construction:*

  **1. Merged Seeds:**
  I merged your **"Separate Achievement"** seed (the racist scientist) and your **"Repudiation"** seed (the reformed views) into **Q5**. Logically, these do the same splitting work: they test whether the reader views the honoree as a *whole person* or a *compartmentalized function*. If you keep the scientist because "the math is good" (Separate) or because "he apologized" (Repudiation), you are arguing that the offense can be isolated from the honor. Keeping them separate would have made the quiz tedious without revealing a new ethical distinction.

  **2. Unoccupied/Incoherent Space:**
  You asked me to flag unoccupied combinations. Two notable "empty" zones in this logical space are:
  *   **"Remove and Destroy":** There is almost no coherent ethical position that argues for removing a statue *and* destroying the object entirely (no museum, no archive). Even hardline removalists usually concede the object belongs in a archive. I excluded this as a leaf because it is generally viewed as erasure rather than ethics.
  *   **"Keep and Lie":** A position where we keep the statue but add a plaque with false information to "correct" the record. This is incoherent; it violates the historical trust required for any commemoration to work.

  **3. Hard-to-Separate Leaves:**
  The tree struggles to cleanly separate the **Contextualist** who keeps the General (via Q4) from the **Contextualist** who keeps the Scientist (via Q5). In practice, these are the same ethical stance (Compartmentalization + Education), but they arrive there via different intuitions (one tolerates the offense, the other denies the relevance). I allowed them to merge at the same Leaf to show that different roads lead to the same policy.

  **4. The "Who Decides" Problem:**
  **Q3 (Authority)** is the weakest splitter. In my experience, many readers answer "The Council Should Decide" only if they trust the Council to vote *their way*. If the Council votes against them, they suddenly believe in "Moral Authority." I included it anyway because it exposes this hypocrisy, even if it doesn't perfectly sort the leaves.
