answer: |-
  **The Scenario**

  At St. Jude's Trauma Center, two protocols for treating severe internal bleeding were tested on 200 patients: Protocol A (Aggressive Clotting) and Protocol B (Conservative Monitoring). The goal was 24-hour survival. A key feature of these protocols is that Protocol A is designed to forcibly stabilize blood pressure before ICU transfer, whereas Protocol B often leaves patients unstable upon transfer. We recorded whether each patient was "Stable" or "Unstable" upon ICU admission (a status determined *by* the protocol) and whether they survived. Of the 100 patients on Protocol A, 90 were Stabilized by the drug (45 survived) and 10 remained Unstable (1 survived). Of the 100 patients on Protocol B, only 10 were Stabilized (6 survived) while 90 remained Unstable (18 survived). Administrators looking at the subgroups noted Protocol B had higher survival rates for both Stable patients (60% vs 50%) and Unstable patients (20% vs 10%), but the Chief of Surgery insisted on adopting Protocol A because its overall survival rate (46%) crushed Protocol B's (24%).

  ***

  **(1) The Check**

  **Aggregate Table (The Decision Metric)**
  | Treatment | Survived | Total | Rate |
  | :--- | :--- | :--- | :--- |
  | **Protocol A** | 46 | 100 | **46%** |
  | **Protocol B** | 24 | 100 | **24%** |
  *Winner: Protocol A*

  **Disaggregated Table (The Trap)**
  | Status | Treatment | Survived | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Stable** | Protocol A | 45 | 90 | **50%** |
  | | Protocol B | 6 | 10 | **60%** |
  | **Unstable** | Protocol A | 1 | 10 | **10%** |
  | | Protocol B | 18 | 90 | **20%** |
  *Winner within strata: Protocol B (in both cases)*

  **(2) Why Conditioning on a Post-Treatment Variable Misleads**
  Conditioning on "Stable/Unstable" status misleads because stability is not a pre-existing trait like blood type; it is a **consequence** of the treatment. Protocol A's primary mechanism of action is *making* patients stable. By splitting the data into "Stable" and "Unstable" groups, you are effectively holding constant the very benefit Protocol A provides. You are asking, "If we magically ensure the patient is stable regardless of the drug, which drug is less toxic?" (Answer: B). But in reality, you cannot magically ensure stability; you must use the drug to get there. The subgroup analysis throws away the information that Protocol A successfully stabilizes 90% of patients while Protocol B only stabilizes 10%.

  **(3) The Feature Doing the Work**
  The specific feature driving this reversal is that the grouping variable ($Z$) is a **mediator** (or a collider influenced by treatment), not a **confounder**. In standard Simpson's Paradox (like the kidney stone case), $Z$ is a confounder that influences both treatment selection and outcome, so you *must* condition on it to remove bias. Here, $Z$ is on the causal path ($Treatment \rightarrow Stability \rightarrow Survival$). Conditioning on a mediator blocks the indirect causal path, isolating only the direct effect (toxicity) while hiding the total effect (stabilization + toxicity). Since medical decision-making relies on the *total effect* (does the patient live?), the aggregate is the truth.

  **(4) Rewriting with a Pre-Treatment Variable**
  If we rewrite the case so "Stability" is measured *upon arrival* (before treatment), the causal direction flips: $Stability \rightarrow Treatment$ (doctors give Aggressive A to stable patients) and $Stability \rightarrow Survival$. In this version, the aggregation is indeed the trap. Protocol A would look better overall only because doctors selectively gave it to patients who were already stable and likely to survive. In this pre-treatment scenario, the disaggregated numbers (controlling for baseline stability) become the correct metric, collapsing the case back into the standard kidney-stones/Berkeley admissions lesson where you *must* adjust for the confounder.

  **(5) The Pushback and Reply**
  A proponent of "always disaggregate" would push back by saying: *"You haven't controlled for enough. There must be a hidden variable, like 'Baseline Severity,' that explains why A patients ended up Stable. If you control for Baseline Severity, the paradox will resolve, and B will likely win overall."*

  This reply **concedes the point**. It admits that you cannot simply "split the data" on whatever variables you have; you must distinguish between pre-treatment confounders (which need controlling) and post-treatment mediators (which do not). If their solution is "control for more stuff," they are implicitly agreeing that the *type* of variable matters. If they insist on controlling for Stability *even knowing it is post-treatment*, they are arguing for estimating the *Direct Effect* (toxicity) rather than the *Total Effect* (survival). For a patient asking "Will I live?", the Direct Effect is irrelevant if the path to life runs through the mediator you just conditioned away.
