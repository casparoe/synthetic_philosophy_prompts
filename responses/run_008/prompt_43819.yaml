  against the wood of the **Chair**.
  Nothing is moving at the **Window**,
  except the words in the **Book**.

  I close the covers of the **Book**,
  though there is still space on the **Table**.
  The glass is cold within the **Window**,
  reflecting steam from the **Cup**.
  My weight is solid on the **Chair**,
  or so it feels beside the **Spoon**.

  I lay the silver down, the **Spoon**,
  and mark the place within the **Book**.
  Gravity anchors me to **Chair**,
  or maybe it is just the **Table**.
  A fluctuation fills the **Cup**,
  distinct from noise outside the **Window**.

  Equilibrium waits at the **Window**,
  waiting for the drop of the **Spoon**.
  A universe condensed to **Cup**,
  more probable than all the **Book**.
  Why trust the surface of the **Table**,
  or the heavy frame of **Chair**?

  I sit regardless in the **Chair**,
  watching the dark approach the **Window**.
