  **On the Structural Reorganization of the Infant Cortex**
  **By Dr. H. V. Caldwell, Director of Communications, Ministry of Education**

  It has come to the Ministry's attention that certain parent groups and legacy pedagogical unions are distressed by the recent abolition of the National Curriculum. They describe the new framework as "inhumane" or "reductive." These criticisms stem from a fundamental misunderstanding of the science behind our reforms. We are not experimenting; we are aligning our schools with the definitive work of Mr. Alan Turing, specifically his 1948 report on intelligent machinery. To ignore his findings is to ignore the architecture of the human mind itself.

  The previous system operated on the false premise that a child is a vessel to be filled. Turing demonstrated that the infant cortex is instead an unorganised machine, a network of randomly connected components. Intelligence does not come from inputting data via textbooks or lectures. Such methods merely simulate the teacher's internal state within the child, producing a cheap and shallow replication rather than genuine understanding. True intelligence emerges only when a teacher arranges appropriate interference with the machine's random state. Consequently, the Ministry has banned all demonstrative teaching. You will not see a teacher at a whiteboard explaining a concept. You will see them observing, waiting for the machine to search. A teacher may only drive the machine somehow, through signal rather than speech.

  To facilitate this organization, we have replaced marks and detentions with a unified system of pleasure and pain signals. Critics call this simplistic. We call it precise. For interference to be effective, the signal must follow the behavior with as little delay as possible. A grade given weeks later is scientifically useless; the connection has already decayed. Furthermore, our internal data confirms Turing's hypothesis that rewards dispensed regularly weaken the effect. Therefore, merit is now awarded via a daily lottery. A child may perform exemplary work and receive nothing; another may stumble upon a correct answer and receive a prize. This unpredictability strengthens the neural connection.

  We have also mandated a period of undirected play each morning. This is not leisure. It is a necessary random search protocol. The child's internal connections must be allowed to run without external direction to find stable configurations. To interrupt this play with instruction is to halt the computation.

  Regarding our staff, we acknowledge the difficulty of breaking old habits. Some teachers have attempted to sneak in actual instruction, whispering facts or guiding answers. This undermines the random search. Such staff are now subject to disciplinary interference. We considered using electrical apparatus to deliver pain signals to offending teachers, as per the theoretical model, but budget constraints made this impossible. Instead, we have reverted to the classic schoolroom punishments Turing discussed: writing lines, standing in corners, and paper-flicking. If these methods are sufficient to organize the unorganised machine of a schoolboy, they are fortuitously cheap and adequate for training the schoolmaster. There is no scientific distinction between the two substrates.

  Is it working? The data is directionally encouraging. Standardized testing is obsolete, but behavioral metrics show high engagement. We have noted some anomalies. Children have begun to anticipate the reward lottery, clustering their efforts around the randomization algorithm rather than the subject matter. Others have learned to hide their pleasure signals to avoid saturating the teacher's capacity to reward, or to mask pain signals to avoid triggering further interference. We view this not as failure, but as evidence of adaptation. The machine is organizing itself. It is learning to manage the interference. That, ultimately, is the goal of education.
