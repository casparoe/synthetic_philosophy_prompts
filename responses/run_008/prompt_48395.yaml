answer: |-
  **PHILOSOPHY OF LANGUAGE: SUMMER EXAMINATION**

  **Time Allowed: 3 Hours**
  **Answer ONE question.**

  **Question 1**

  Consider the following scenario. A company stages a dinner-theatre event in a deconsecrated chapel. During the evening, an actor, playing a ship's sponsor, smashes a bottle against a prop bow while declaring, 'I name this ship the *Resolute*.' The theatre's marketing copy explicitly promises every ticket-holder a 'genuine christening'. Later, as a visitor leaves, their smartphone reads aloud a customer-service message generated by a language model: 'I hereby promise you a full refund.'

  Critically assess whether these utterances constitute successful illocutionary acts. In your analysis, do not rely merely on lists of felicity conditions or the distinction between constatives and performatives. Instead, focus on the phenomenon of etiolation: the apparent suspension of force in non-standard contexts. Argue whether etiolation is a unitary phenomenon with a single diagnosis (such as parasitism on serious use or lack of intentional commitment) or whether the theatrical and computational cases come apart. Further, consider whether etiolation is all-or-nothing or a matter of degree. Conclude by stating whether artificial systems can perform illocutionary acts, or merely produce locutionary events with perlocutionary effects.

  ***

  **MODEL ANSWER**

  The scenario presents two distinct challenges to the orthodox view of speech acts, requiring us to disaggregate the concept of etiolation. While both the actor's christening and the algorithm's refund promise appear infelicitous, diagnosing them identically as 'parasitic' obscures crucial differences in agency and convention. I argue that etiolation is not unitary; the theatrical case fails due to bracketed intention within a recognized frame, whereas the computational case fails due to a lack of agency entirely. Consequently, illocutionary force is not merely graded but can be wholly absent where agency is missing.

  In the theatre case, the actor satisfies the verbal and procedural requirements for a christening. The marketing copy complicates matters by promising a 'genuine' act, potentially misleading the audience into believing the institutional context is authentic. However, the actor knows the bow is a prop and the context is play-acting. Following the standard view, the actor's intentions are 'etiolated': they are not committing themselves to the consequences of naming a ship but rather simulating such commitment. The marketing copy cannot override the theatrical frame because the actor lacks the requisite intentional state to bind themselves to the institutional consequences. The act is void not because the words are wrong, but because the speaker is engaged in a pretence. Here, etiolation functions as a suspension of force via mutual understanding of the 'non-serious' context, despite the marketing bluff.

  The computational case differs fundamentally. The language model generates the sentence 'I hereby promise' without beliefs, desires, or intentions. It cannot intend to undertake an obligation because it lacks the capacity for intentionality. Unlike the actor, who consciously brackets their intent, the system has no intent to bracket. To classify this as etiolation in the same sense as the theatre is to mistake simulation for absence. The utterance is a locutionary event that may produce perlocutionary effects (the visitor feels reassured), but it cannot constitute an illocutionary act because there is no mind to hold the commitment. The 'I' in the message is indexical only in syntax, not in agency.

  This divergence suggests etiolation is not a unitary phenomenon. The theatre case relies on a specific convention of 'off-stage' speech where force is suspended by mutual consent. The AI case reveals a limit condition where force is impossible due to the absence of a speaker. Furthermore, this implies etiolation is not always a matter of degree. While some contexts (like poetry) might retain faint echoes of force, the AI case represents a binary failure: without agency, there is zero illocutionary force, regardless of syntactic perfection.

  Therefore, artificial systems cannot perform illocutionary acts. They simulate the outward signs of speech acts, triggering perlocutionary uptake in humans who project agency onto the machine. To claim otherwise is to confuse the effect of the utterance with the act of uttering. The actor fails to christen because they pretend; the machine fails because it cannot mean. Both are etiolated, but for categorically different reasons.

  ***

  **MARKING SCHEME (25 MARKS)**

  **1. Diagnosis of the Theatrical Case (5 marks)**
  *   **5 marks:** Identifies that the actor's intentional commitment is bracketed/suspended by the theatrical frame, noting that the marketing copy cannot override the actor's lack of serious intent regarding the prop.
  *   **3–4 marks:** Identifies the act as infelicitous due to the context but treats the marketing copy as potentially validating the act.
  *   **0–2 marks:** Claims the act succeeds because the words were spoken, or fails solely because it is a 'prop'.
  *   *Typical Loss:* Ignoring the tension between the marketing promise and the theatrical frame.

  **2. Diagnosis of the AI Case (5 marks)**
  *   **5 marks:** Identifies the lack of agency/intentionality as the primary failure, distinguishing the system's output from human speech.
  *   **3–4 marks:** Claims the act fails because the machine is not human, without specifying the lack of intentional state.
  *   **0–2 marks:** Claims the act succeeds because the visitor believes it, or fails merely because it is recorded speech.
  *   *Typical Loss:* Confusing the syntactic correctness of the output with semantic capacity.

  **3. Unitary vs. Fragmented Etiolation (5 marks)**
  *   **5 marks:** Argues definitively that the diagnoses differ (intentional bracketing vs. lack of agency), rejecting a unitary theory of parasitism.
  *   **3–4 marks:** Argues they are both etiolated but offers a nuanced comparison; or argues they are unitary but with strong justification.
  *   **0–2 marks:** Assumes etiolation is unitary without justification, or treats the cases as identical.
  *   *Typical Loss:* Asserting 'both are fake' without analysing *how* they are fake.

  **4. All-or-Nothing vs. Gradedness (5 marks)**
  *   **5 marks:** Takes a position on gradedness (e.g., AI is binary zero force; theatre is suspended force) linked to the previous analysis.
  *   **3–4 marks:** Discusses gradedness but fails to link it to the specific cases in the prompt.
  *   **0–2 marks:** Ignores the question of degree.
  *   *Typical Loss:* Vague statements about 'some force' remaining without specifying where.

  **5. Conclusion on AI Illocution (5 marks)**
  *   **5 marks:** Concludes AI cannot perform illocutionary acts, distinguishing illocution from perlocution (effect on visitor).
  *   **3–4 marks:** Concludes AI cannot act but conflates illocutionary uptake with perlocutionary effect.
  *   **0–2 marks:** Concludes AI can perform acts because the visitor accepts the refund.
  *   *Typical Loss:* **Distractor:** Awarding full marks for claiming the refund is valid because the visitor feels refunded (confuses perlocution with illocution). This deserves max 2 marks for this section.

  **Differentiation (First vs. 2:1)**
  *   **First Class (20–25 marks):** Must secure full marks on points 3 and 5. Specifically, must notice that the theatre case and AI case demand *opposite* or distinct diagnoses (bracketed intent vs. no intent) rather than lumping them together as 'non-serious'. Must explicitly test the proposed criterion of etiolation against the AI case to show why it fails where the actor merely suspends.
  *   **2:1 (15–19 marks):** Securely analyses both cases but may treat etiolation as a single category of 'non-seriousness'. May hedge on the AI conclusion or allow partial illocutionary force based on uptake.
  *   **2:2 (10–14 marks):** Describes the scenarios using standard terminology (felicity conditions) without engaging deeply with etiolation. May rely on the marketing copy to solve the theatre case.
  *   **Third/Fail (0–9 marks):** Recites definitions of locution/illocution/perlocution without applying them to the specific nuances of the prompt.
