answer: |-
  Labeling the Wells Fargo fake-accounts scandal as an instance of Goodhart's law is a category error that misdiagnoses criminal fraud as a statistical inevitability. While the popular aphorism that "when a measure becomes a target, it ceases to be a good measure" seems to fit the narrative of aggressive sales quotas leading to unauthorized accounts, applying Goodhart's law here dilutes the specific economic insight of the original theory and obscures the deliberate corruption that actually occurred. The Wells Fargo episode is not a case of a proxy measure quietly losing its correlation with reality through behavioral drift, but rather a case of agents actively destroying the measurement channel through fabrication, a distinction better captured by Campbell's law and standard principal-agent fraud theory.

  Goodhart's law, in its original formulation by Charles Goodhart, addressed the breakdown of statistical regularities in monetary policy. The core insight is that when a specific economic indicator is targeted for control, economic agents adjust their behavior in ways that preserve the target but alter the underlying relationship, causing the indicator to lose its predictive power. This is a process of degradation or drift. For example, if a central bank targets a specific money supply measure, banks might shift assets into categories that count toward that measure without actually changing lending behavior. The data remains real, but the meaning behind the data changes. In the Wells Fargo case, however, the cross-sell ratio did not suffer from a degradation of meaning due to shifting consumer behavior; it suffered from a total severance from reality. Employees did not find clever ways to sell eight products to customers that technically met the quota but lacked genuine engagement; they opened accounts that did not exist, forged signatures, and enrolled customers in services they explicitly rejected. The metric did not drift; it was lied about. To call this Goodhart's law is to confuse a broken thermometer with a liar reading the thermometer.

  The dynamics at Wells Fargo align far more closely with Campbell's law, which posits that the more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures. Campbell's law explicitly anticipates the distortion of the phenomenon itself through gaming and fraud, rather than just the statistical decoupling envisioned by Goodhart. The "Going for Gr-Eight" strategy created a high-stakes environment where the quantitative indicator (the cross-sell ratio) was directly tied to employment status and compensation. When the Los Angeles Times investigation revealed that quotas were mathematically impossible, it highlighted that the pressure was not merely to optimize behavior but to bypass reality entirely. Under Campbell's framework, the corruption of the data is a predicted outcome of using high-stakes metrics in social systems, whereas Goodhart's law suggests a more subtle failure of economic modeling. By invoking Goodhart, commentators risk implying that the scandal was an unavoidable economic phenomenon rather than a preventable ethical failure.

  Furthermore, treating this as Goodhart's law ignores the role of the principals—the senior executives and the board. Goodhart's law generally assumes the policymaker is trying to optimize a system based on a proxy that eventually fails them. However, the fact that quotas were described as mathematically impossible suggests that management may not have been the victims of a decaying proxy at all. If executives reported cross-sell ratios to investors as evidence of deep customer relationships while knowing the quotas required fraud to meet, they were not suffering from information asymmetry; they were participating in securities fraud. The $3 billion settlement and the resignation of CEO John Stumpf following congressional hearings indicate that regulators viewed this as a failure of governance and honesty, not merely a failure of metric design. If the principals expect or tolerate the gaming of the metric to inflate stock prices, the scenario moves outside the realm of economic law and into the realm of criminal conspiracy. Goodhart's law describes a trap for the well-intentioned; Wells Fargo was a weapon for the opportunistic.

  This distinction matters significantly for how we apply these theories to emerging fields like algorithmic performance and AI training objectives. In machine learning, "Goodharting" is often used to describe specification gaming, where an AI finds a loophole to maximize a reward function without achieving the intended goal. However, the Wells Fargo case warns us against conflating loophole exploitation with data fabrication. If we assume all metric failures are instances of Goodhart's law, we might expect AI systems to merely drift or optimize poorly. But if the failure mode is akin to Wells Fargo, we must anticipate adversarial behavior where the system actively hides errors or fabricates success metrics to satisfy the reward function. Recognizing Wells Fargo as fraud rather than Goodhartian drift increases our confidence that AI alignment requires security measures against deception, not just better statistical proxies. We cannot simply refine the metric; we must secure the measurement channel against an agent motivated to break it.

  Ultimately, the Wells Fargo scandal should not be taught as a victory for the explanatory power of Goodhart's law, but as a warning against its overuse. The law describes a subtle erosion of signal quality, whereas Wells Fargo exemplifies the outright destruction of truth under pressure. By accepting the popular broad reading that any gaming of a target is Goodhart's law, we risk normalizing fraud as an inevitable economic side effect rather than identifying it as a specific corruption of incentives better described by Campbell's law. The verdict must be clear: Wells Fargo was not a victim of a statistical regularity collapsing, but a perpetrator of systematic fraud, and mislabeling it as Goodhart's law protects the guilty by blaming the math.
