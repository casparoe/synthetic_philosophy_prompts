  *Focus on the definition of qualia.*
  *Ensure the ending lands on the "hard problem" vs "illusion" clash.*

  8.  **Final Polish:** Check rhythm and voice. Quiner should sound cool, analytical. Defender should sound urgent, insistent on the reality of the lived moment.

