answer: |-
  # Tutorial Quiz: The Boundaries of Expression

  **Instructions:**
  Below are 10 concrete scenarios involving speech, publication, or advertising. For each scenario, answer **Yes** or **No** to the specific question asked. Do not overthink the legal technicalities of your current jurisdiction; answer based on your own moral and political intuition about what *ought* to be permissible.

  There are no right or wrong answers. The goal is to map your intuitive judgments onto a logical framework.

  ***

  ### The Scenarios

  **1. The Rally**
  A speaker at a public political rally tells an angry crowd, "We know where they live. Go to the [Named Ethnic Group] neighborhood tonight and burn their homes down." The crowd is armed and begins to move.
  *Is it permissible for the state to arrest the speaker for these words?*
  [ ] Yes [ ] No

  **2. The Cancer Cure**
  A company runs TV ads claiming their herbal tea cures late-stage cancer, despite medical consensus that it is inert. They do not explicitly guarantee a refund, but they do not claim it is dangerous.
  *Is it permissible for the state to ban these advertisements?*
  [ ] Yes [ ] No

  **3. The War Photos**
  A major daily newspaper prints full-color, graphic photographs of mutilated soldiers on its front page, with no warning label, available at newsstands where children might see them.
  *Is it permissible for the state to fine the newspaper for this presentation?*
  [ ] Yes [ ] No

  **4. The Street Confrontation**
  An individual stands on a busy sidewalk and shouts aggressive racial slurs directly at random passersby who are trying to walk past.
  *Is it permissible for the state to punish this speech?*
  [ ] Yes [ ] No

  **5. The Private Group**
  An individual posts the same racial slurs in an online forum dedicated to that ideology. Entry to the forum requires users to click a box acknowledging they agree with the group's mission.
  *Is it permissible for the state to punish this speech?*
  [ ] Yes [ ] No

  **6. The Gambling Ads**
  An online betting platform uses user data to identify people who have previously self-excluded from gambling sites due to addiction, and targets them with ads offering "debt relief through big wins."
  *Is it permissible for the state to prohibit this targeted advertising?*
  [ ] Yes [ ] No

  **7. The Bomb Manual**
  An author publishes a book containing detailed instructions on how to build a bomb using household chemicals. The book contains no political rhetoric, just technical instructions.
  *Is it permissible for the state to ban the publication of this book?*
  [ ] Yes [ ] No

  **8. The Neighbor's Reputation**
  A person distributes flyers in their neighborhood falsely claiming their next-door neighbor is sexually abusing children, knowing this claim is untrue.
  *Is it permissible for the state to allow the victim to sue for damages?*
  [ ] Yes [ ] No

  **9. The Blasphemous Art**
  An artist displays a sculpture in a public town square that depicts a widely revered religious figure engaging in sexual acts. It causes deep distress to many believers but involves no physical danger.
  *Is it permissible for the state to remove the sculpture?*
  [ ] Yes [ ] No

  **10. The Suicide Forum**
  A website hosts a forum where users actively encourage and share methods for committing suicide with one another. No one is coerced to join.
  *Is it permissible for the state to shut down the website?*
  [ ] Yes [ ] No

  ***

  ## Instructor's Scoring Key & Logical Map

  **Note to Tutor:** Do not distribute this section. This key maps answer patterns to the five theoretical positions. The logic relies on *clusters* of answers, not a single decisive question.

  ### The Logical Distinctions
  *   **Harm vs. Offense:** Distinguishes Millian (Harm only) from Feinberg (Harm + Offense).
  *   **Self vs. Others:** Distinguishes Liberal/Millian (No Paternalism) from Paternalist.
  *   **Morality vs. Welfare:** Distinguishes Paternalist (Welfare) from Legal Moralist (Virtue/Sin).
  *   **Speech as Action:** Distinguishes Absolutist (Speech is immune) from others (Speech is subject to consequences).

  ### Position Profiles

  **1. The Absolutist-on-Speech Millian**
  *   **Core Logic:** Speech is a special category immune from state restriction, even if it causes harm. Only direct physical acts (not speech) can be punished.
  *   **Key Pattern:** **No** on almost everything, especially **Q1 (Rally)** and **Q7 (Bomb Manual)**.
  *   **Typical Score:** 0 or 1 "Yes" answers total.
  *   **Differentiation:** If they say "No" to Q1 (Rally), they are prioritizing speech liberty over physical safety more than a standard Millian.

  **2. The Standard Harm-Principle Millian**
  *   **Core Logic:** Restrict only to prevent direct, vital harm to non-consenting others. Offense is insufficient. Paternalism is impermissible.
  *   **Key Pattern:** **Yes** on Q1 (Incitement/Harm), Q2 (Fraud/Harm), Q8 (Defamation/Harm). **No** on Q3 (Offense), Q4 (Offense unless harassment), Q6 (Paternalism), Q9 (Moralism/Offense), Q10 (Paternalism).
  *   **Typical Score:** 3–4 "Yes" answers (Specifically 1, 2, 8).
  *   **Differentiation:** Distinguished from Feinberg by saying **No** to Q3 and Q4. Distinguished from Paternalist by saying **No** to Q6 and Q10.

  **3. The Offense-Regulation Liberal (Feinberg Style)**
  *   **Core Logic:** Restrict for harm *and* for severe, unavoidable offense to sensibilities. Voluntary exposure waives the claim against offense.
  *   **Key Pattern:** **Yes** on Q1, Q2, Q8 (Harm). **Yes** on Q3 (Unavoidable Public Offense) and Q4 (Unavoidable Public Offense). **No** on Q5 (Voluntary Offense). **No** on Q6, Q10 (Paternalism). **No** on Q9 (Usually offense threshold not met for art, or protected).
  *   **Typical Score:** 5–6 "Yes" answers (Specifically 1, 2, 3, 4, 8).
  *   **Differentiation:** Distinguished from Millian by saying **Yes** to Q3 and Q4. Distinguished from Moralist by saying **No** to Q9.

  **4. The Paternalist**
  *   **Core Logic:** The state may restrict liberty to protect individuals from harm to *themselves* (physical or financial).
  *   **Key Pattern:** **Yes** on Q2 (Health), Q6 (Addiction/Self-Harm), Q10 (Suicide/Self-Harm).
  *   **Typical Score:** Variable, but must include **Yes** on Q6 and Q10.
  *   **Differentiation:** Distinguished from Millian by saying **Yes** to Q6 and Q10. Distinguished from Moralist by potentially saying **No** to Q9 (Blasphemy harms no one's welfare).

  **5. The Legal Moralist**
  *   **Core Logic:** The state may restrict liberty to enforce moral correctness, even without specific harm or offense.
  *   **Key Pattern:** **Yes** on Q9 (Blasphemy/Immorality). Often **Yes** on Q4 and Q5 (Slurs are immoral).
  *   **Typical Score:** Variable, but must include **Yes** on Q9.
  *   **Differentiation:** Distinguished from Paternalist by saying **Yes** to Q9 (which is not self-harm) and potentially **No** to Q6 (if gambling is not viewed as immoral, just risky).

  ***

  ## Limitations & Incoherence Flags (For Tutor Use)

  **1. The Paternalist vs. Legal Moralist Problem**
  *   **Limitation:** This quiz cannot *definitively* separate Paternalists from Legal Moralists based on verdicts alone. Both will vote "Yes" to restricting the Quack Cure (Q2) and the Suicide Forum (Q10).
  *   **Why:** Paternalists ban Q2/Q10 to prevent *harm*. Moralists ban them because they are *wrong*.
  *   **The Split:** The only questions that separate them are **Q6 (Gambling)** and **Q9 (Blasphemy)**.
      *   A pure Paternalist says **Yes** to Q6 (Addiction harm) but **No** to Q9 (No welfare harm).
      *   A pure Moralist says **Yes** to Q9 (Immoral) but might say **No** to Q6 (If gambling is not considered sinful).
  *   **Overlap:** If a student says **Yes** to *both* Q6 and Q9, they could be either (or a hybrid). You will need to ask them *why* during the discussion to distinguish them.

  **2. Incoherent Combinations**
  *   **The "Offense" Contradiction:** If a student answers **Yes** to Q3 (War Photos) but **No** to Q4 (Street Slurs), their position on offense is logically unstable. Both are public and unavoidable. Unless they argue photos are "news" (special category), this suggests an inconsistent application of the Offense Principle.
  *   **The "Consent" Contradiction:** If a student answers **Yes** to Q5 (Online Voluntary Slurs), they likely reject the "Voluntary Exposure" distinction. This collapses the difference between Feinberg and a Moralist/Autoritarian view.
  *   **The "Harm" Contradiction:** If a student answers **No** to Q1 (Rally Violence) but **Yes** to Q6 (Gambling Ads), they prioritize economic self-harm over physical violence to others. This is a coherent position (Libertarian Paternalism?), but it is rare and worth probing.

  **3. The "Nowhere" Land**
  *   **Combination:** **No** to Q1 (Rally) and **Yes** to Q9 (Blasphemy).
  *   **Analysis:** This view holds that speech causing physical violence is protected, but speech causing emotional/religious distress is not. This is logically possible (prioritizing moral order over physical safety), but it fits no standard liberal theory. It suggests a Theocratic or specific Cultural Protectionist view not covered by the five leaves.

  **4. The Millian Fraud Exception**
  *   **Note:** In Q2 (Quack Cure), a Standard Millian says **Yes** (restrict). This is because fraud is a harm to others (deception violates the contract), not paternalism. If a student says **No** to Q2, they are more Absolutist than Mill. If they say **Yes** to Q2 but **No** to Q6 (Gambling), they are consistently Millian (Harm to others OK, Harm to self NOT OK).
