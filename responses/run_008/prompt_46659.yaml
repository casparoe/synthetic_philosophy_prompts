answer: |-
  ### Exam Question: Political Philosophy of the Welfare State
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Question:**

  A government proposes a new "Security & Opportunity" benefit scheme consisting of two tiers. **Tier One** is an unconditional basic payment available to all residents below a specific income threshold. **Tier Two** is a substantial supplemental payment conditioned on demonstrated job-search compliance. Compliance is verified by a partially automated digital system.

  The government's white paper acknowledges the system's known error profile. The system is asymmetric: it very rarely pays the non-compliant (false positives are near zero), but it fairly often sanctions the compliant (false negatives are significant). Missed appointments caused by shift work, childcare breakdowns, or administrative delays are recorded as non-compliance. Appeals against sanctions take months to process, during which the supplement is withheld.

  The government defends Tier Two using two distinct rationales, often interchangeably:
  1.  **The Fairness Rationale:** Conditionality protects taxpayers from funding those who *could* work but *choose* not to.
  2.  **The Paternalistic Rationale:** Behavioral requirements benefit recipients themselves by preserving work habits and preventing the long-term economic scarring of unemployment.

  Write an essay addressing the following:
  Can this two-tier scheme be morally justified? If so, under which of the two rationales, and what modifications to the error profile are required? If not, why not? In your analysis, you must address whether the high rate of false negatives (sanctioning the compliant) is compatible with both rationales equally. Furthermore, you must confront the distinction between the "deserving" and "undeserving" poor itself: is the moral problem merely the administrative inaccuracy of the system, or does the distinction rely on a judgment about character that persists even if the system were perfectly accurate?

  ***

  ### Model Answer (Approx. 600 Words)

  The proposed two-tier scheme presents a conflict not merely of administration, but of moral logic. While Tier One (unconditional) avoids the trap of distinguishing worthiness, Tier Two relies on an asymmetric error profile that renders the government's two justifications mutually incompatible. A justified policy must select one rationale and align the system's errors with it, or abandon conditionality entirely if the underlying distinction between deserving and undeserving is morally untenable.

  The crux of the problem lies in the error asymmetry. The system is designed to minimize false positives (paying the non-compliant) at the cost of frequent false negatives (sanctioning the compliant). Under the **Fairness Rationale**, this asymmetry is a feature, not a bug. If the moral goal is protecting taxpayers from "freeloaders," the state should err on the side of suspicion. Sanctioning a compliant worker is an unfortunate collateral cost, but paying a non-compliant one is a moral failure of the scheme. Therefore, the current error profile is logically consistent with Fairness, provided the Tier One safety net prevents destitution for those falsely sanctioned.

  However, the **Paternalistic Rationale** collapses under this same error profile. Paternalism justifies coercion by claiming it serves the coerced person's own good (preserving employability). But a false negative sanction does not preserve work habits; it induces financial crisis and administrative entanglement that actively scars the recipient's employment prospects. To punish a compliant job-seeker is to harm the very person the rationale claims to protect. A paternalistic system must minimize false negatives, even if it means occasionally paying the non-compliant. Consequently, the government cannot invoke both rationales to defend the *same* asymmetric system. They demand opposite error calibrations.

  To justify the scheme, the government must drop one rationale. If they retain Fairness, they must admit the supplement is a contract with taxpayers, not a help for recipients, and accept that some deserving poor will be punished to ensure no undeserving poor are paid. If they retain Paternalism, they must overhaul the verification system to prioritize accuracy for the claimant, accepting that some tax money will be "wasted" on the non-compliant to ensure the compliant are not harmed.

  However, resolving the rationale conflict does not settle the deeper question of the **deserving/undeserving distinction**. Even with a perfectly accurate system, does this distinction track a genuine moral difference? Defenders argue it distinguishes *inability* from *refusal*, marking a boundary of reciprocity essential to social cooperation. On this view, conditionality is not about stigma, but about enforcing a duty to contribute when able.

  Critics, however, may argue that the distinction relies on an unsustainable view of agency. In a labor market characterized by precarious shift work and care burdens (the very causes of the system's errors), "refusal" is often indistinguishable from "inability." If structural barriers make compliance impossible for many, the label "undeserving" becomes a judgment on character rather than conduct. If the distinction is conceptually flawed—because it assumes a level of control over one's life that low-income residents do not possess—then no amount of administrative accuracy can justify Tier Two. The moral problem is not the false negatives, but the attempt to classify human worth based on compliance in an unequal economy.

  Ultimately, the scheme is only stable if the government chooses the Fairness Rationale and accepts its harshness, or if they can defend the deserving/undeserving distinction as tracking real moral agency rather than structural luck. Without that defense, the asymmetric errors are not just a technical flaw, but evidence that the policy punishes the vulnerable to maintain a moral fiction.

  ***

  ### Marking Scheme (25 Marks)

  **1. Identification of Error Asymmetry & Structural Tension (5 Marks)**
  *   **A Answer:** Explicitly identifies that the system trades false negatives (sanctioning compliant) for false positives (paying non-compliant) and notes this is a structural design choice, not a glitch.
  *   **B Answer:** Treats the errors as technical "bugs" to be fixed generally, or fails to note that the asymmetry is deliberate/known.

  **2. Analysis of Fairness Rationale vs. Errors (5 Marks)**
  *   **A Answer:** Correctly argues that the Fairness Rationale can tolerate (or even prefers) false negatives, as the primary moral harm is paying the "undeserving."
  *   **B Answer:** Assumes Fairness requires perfect accuracy, or argues that sanctioning the compliant automatically invalidates the fairness claim without analyzing the trade-off.

  **3. Analysis of Paternalistic Rationale vs. Errors (5 Marks)**
  *   **A Answer:** Correctly argues that the Paternalistic Rationale is self-defeating under the current error profile, as false negatives harm the recipients the policy claims to help.
  *   **B Answer:** Accepts the paternalistic claim at face value without analyzing how sanctions undermine the goal of "preventing scarring."

  **4. Incompatibility Conclusion & Recalibration (5 Marks)**
  *   **A Answer:** Concludes the two rationales are incompatible under the current design; recommends dropping one rationale and recalibrating errors to match the survivor (e.g., Paternalism requires fewer false negatives).
  *   **B Answer:** Attempts to keep both rationales simultaneously, or suggests "better technology" solves the moral conflict without changing the error priority.

  **5. Conceptual Analysis of Deserving/Undeserving (5 Marks)**
  *   **A Answer:** Addresses whether the distinction tracks a real moral difference (agency/refusal) vs. structural inability, independent of administrative accuracy.
  *   **B Answer:** Treats the distinction as obviously valid or obviously stigmatizing without argument, or focuses only on the stigma of *errors* rather than the concept itself.

  **General Grading Notes:**
  *   **Neutrality:** Marks are awarded for logical consistency. A student may defend conditionality (prioritizing Fairness) or reject it (prioritizing Paternalism/Equality), provided they handle the tension between rationales and the conceptual distinction rigorously.
  *   **A Range (20-25):** Hits all 5 points with clear logical flow; treats the error asymmetry as the key to unlocking the rationale conflict.
  *   **B Range (15-19):** Hits 3-4 points but misses the structural incompatibility (Point 4) or treats the deserving/undeserving distinction as a given (Point 5). May rely on surveying standard positions (workfare vs. rights) rather than applied reasoning.
  *   **C Range (10-14):** Describes the scenario and lists pros/cons without engaging the specific tension between the error profile and the stated rationales.
