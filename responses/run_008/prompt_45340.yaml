answer: |-
  # Replicant Earth: Semantic Externalism and the Memory Implants of *Blade Runner*

  **Course Unit:** Semantic Externalism  
  **Primary Text:** Hilary Putnam, "The Meaning of 'Meaning'" (Twin Earth)  
  **Film:** Ridley Scott, *Blade Runner* (1982)  
  **Secondary Concept:** Martin & Deutscher, "Remembering" (Causal Theory of Memory)

  ## 1. Rachel as a Walking Twin Earth Case (and Swampman)

  In Putnam's Twin Earth thought experiment, Oscar (Earth) and Twin-Oscar (Twin Earth) are internal duplicates. When Oscar says "water," he refers to H₂O. When Twin-Oscar says "water," he refers to XYZ. The moral: meaning is not determined solely by internal psychological states; it depends on the external environment and causal history.

  Rachel, the Nexus-7 replicant in *Blade Runner*, dramatizes a variation of this thesis applied to **autobiographical memory**.

  *   **The Internal State:** Rachel possesses vivid, episodic memories. She recalls a spider outside her window; she recalls playing piano. She reports these sincerely. Phenomenologically, she is indistinguishable from a human who actually lived through these events.
  *   **The External Fact:** These memories are implants, copied from Tyrell's niece. Rachel has no causal contact with the events she describes.

  **The Externalist Verdict on Reference:**
  If we apply Putnam's externalism to Rachel's speech, her utterances suffer from reference failure or misalignment.
  *   When Rachel says, "I remember the spider," the externalist asks: *What fixes the reference of 'the spider'?*
  *   **Option A (Null Reference):** Since there is no causal chain linking Rachel's mental state to an actual spider event in her past, the term refers to nothing. Her statement is false, not because she is lying, but because the referent is absent.
  *   **Option B (Deferred Reference):** Does her term refer to the niece's spider? Putnam's theory of linguistic division of labor suggests experts fix reference. Here, Tyrell (the "expert" creator) fixed the content. However, Rachel uses the indexical "my." Since the history is not *hers*, the indexical fails to latch.

  **Twin Earth vs. Swampman:**
  Rachel is not strictly a Twin Earth case. Twin Earth requires two contemporaries in different environments who are internal duplicates. Rachel is not an internal duplicate of Tyrell's niece (different brain, different body).
  She is closer to **Davidson's Swampman**. Swampman is a molecule-for-molecule duplicate of a person, created by lightning, with no causal history. Davidson argues Swampman cannot *mean* anything by his words initially, because he lacks the causal history to ground reference.
  *   **Rachel as Swampman:** Like Swampman, Rachel pops into existence (or awareness) with a fully formed internal state but no past.
  *   **The Difference:** Swampman has *no* history. Rachel has a *borrowed* history. This makes her case more tragic. She is not causally isolated from the world generally (she sees real spiders), but she is causally isolated from *her own narrative*.

  **Classroom Question:** If meanings ain't in the head, does Rachel have a "head" full of meanings, or just a head full of syntax? If she says "I am Tyrell's niece," is that statement false (because she isn't) or meaningless (because she lacks the causal link to the term 'Tyrell's niece' as a self-designator)?

  ## 2. The Voight-Kampff Test: An Internalist Instrument in an Externalist World

  The Voight-Kampff (VK) test is the film's epistemic engine. It measures physiological responses (pupil dilation, blush response) to emotionally provocative questions. It operates on a fundamental assumption: **Internalism.**

  *   **The Presupposition:** The test assumes that the distinction between human and replicant is detectable via internal inspection. It assumes that a lack of "humanity" (or a specific kind of empathetic processing) will manifest as a physiological lag or flatness *inside* the subject.
  *   **The Externalist Critique:** If semantic externalism (and mental content externalism) is correct, the difference between Rachel and a human is **historical**, not structural. A replicant could be internally identical to a human but differ solely in origin (factory vs. womb).
  *   **The Category Error:** If the difference is purely causal/historical, no internal scan should be able to detect it. You cannot measure "causal history" with a pupil meter. You can only measure current functional states.

  **The Irony of the Test's Failure:**
  The film creates a deliberate tension here.
  1.  **Early Film:** The VK test works. It identifies Leon and Rachael as replicants. This suggests the film universe is *Internalist*: replicants are internally deficient (they lack deep empathy).
  2.  **Late Film:** The test becomes unreliable. Deckard stops using it. Roy Batty saves Deckard's life (an act of supreme empathy). Rachael saves Deckard (loyalty/love).
  3.  **The Externalist Resolution:** The test fails not because the machinery is broken, but because the *premise* is broken. The film suggests that "humanity" is not an internal functional state (which replicants can mimic or develop) but a status conferred by history and mortality.
      *   However, if Externalism is true, the VK test *should never have worked*. The fact that it works initially implies replicants *are* internally different. The fact that it stops working implies they *become* internally similar through experience.
      *   **Teaching Point:** The VK test represents the Internalist desire to police boundaries from the inside. The film's narrative arc undermines the test, suggesting that what matters (empathy, loyalty) can arise regardless of origin. This aligns with Externalism's claim that internal states don't tell the whole story, but it complicates it by showing internal states *converging* despite external differences.

  ## 3. Martin & Deutscher: Memory vs. Quasi-Memory

  This is where the reading can move beyond semantics into the metaphysics of mind. C.B. Martin and Max Deutscher ("Remembering," 1966) argue for a **Causal Theory of Memory**. To genuinely remember an event $E$:
  1.  One must represent $E$.
  2.  $E$ must have occurred.
  3.  There must be an appropriate causal chain connecting $E$ to the current representation.

  **Rachel's Quasi-Memories:**
  Rachel fails condition (3). Her memory states are caused by Tyrell's engineering, not by the events themselves. Following Martin & Deutscher, Rachel does not *remember*; she possesses **quasi-memories**.
  *   **The Philosophical Split:** This distinction allows us to separate two questions that thought experiments often conflate:
      1.  **The Semantic Question:** What do her words mean? (Externalism says: They fail to refer to *her* past).
      2.  **The Metaphysical Question:** Does she have a past? (Martin & Deutscher say: No, she has quasi-memories).

  **The Film's Intervention:**
  Philosophical papers often treat the lack of causal history as a logical problem. *Blade Runner* treats it as an existential crisis.
  *   When Deckard reveals Rachel's memories are implants ("Try testing yourself"), she collapses.
  *   **The Insight:** The film shows that the *phenomenological weight* of memory does not depend on its causal status. Rachel's grief is real, even if the memory is "quasi."
  *   **Classroom Application:** Use this to challenge the coldness of the Causal Theory. Martin & Deutscher give us a binary (Memory vs. Non-Memory). The film gives us a spectrum. Rachel's "quasi-memories" function *as* memories in her psychological economy. If externalism says her content is empty, the film asks: *Why does empty content hurt so much?* This pushes students to consider if the "meaning" of a memory is tied to its truth conditions (externalist) or its role in constituting a self (functionalist/narrative).

  ## 4. Where the Reading Strains (Honesty and Limitations)

  To treat the film seriously, we must acknowledge where the philosophical frame distorts the art.

  **1. The Internal Indistinguishability Problem:**
  Twin Earth requires internal duplicates. Rachel is *not* an internal duplicate of Tyrell's niece. She has a different brain (artificial vs. biological). Therefore, she is not a perfect test case for "Meanings ain't in the head" because her "head" is physically different.
  *   *Counter:* The film posits that the *experience* is indistinguishable. But strictly speaking, if her neural substrate is different, an Internalist could argue her content is different simply because her brain states are different. The Externalist analogy limps here.

  **2. Reference vs. Identity:**
  Putnam is interested in **reference** (what does 'water' pick out?). *Blade Runner* is interested in **identity** (who am I?).
  *   Forcing the film into a philosophy-of-language frame risks ignoring its primary ethical question: empathy. The film asks if Rachel deserves rights, not if her word "spider" has an extension.
  *   If we focus too much on semantics, we might miss the point that Rachel's tragedy isn't that her words fail to refer, but that her *life* has been authored by someone else.

  **3. The Internalism of the Film:**
  Despite the Externalist reading, the film's climax leans Internalist. Roy Batty becomes "more human than human" through his *internal* choices (saving Deckard), not by changing his history (he remains a replicant). If Externalism were strictly true, his history should permanently bar him from "human" content. The film suggests internal states (empathy, mercy) can override external history.

  ## 5. Closing Judgment: What the Film Supplies

  Does *Blade Runner* dramatize something the papers do not? **Yes.**

  The papers (Putnam, Davidson, Martin & Deutscher) treat the lack of causal history as a **logical defect**. It is a problem of classification, truth, or reference.
  *Blade Runner* treats the lack of causal history as an **ethical violence**.

  *   **The Emotional Cost of Externalism:** Externalism tells us that if you lack the right history, your thoughts don't mean what you think they mean. In a seminar, this is a puzzle. In the film, this is a violation. Rachel is not just a semantic error; she is a victim of fraud.
  *   **The Stakes of "In the Head":** The papers argue that meaning isn't in the head. The film argues that *suffering* is. Rachel's pain survives the revelation that her memories are fake. This challenges the Externalist to explain how a subject can be genuinely distressed by a state of affairs that, externally speaking, "never happened to them."
  *   **The Verdict:** *Blade Runner* does not prove Externalism true. Rather, it exposes the **human cost** of Externalist criteria. It shows that if we define personhood or memory strictly by causal history (as Externalism and the Causal Theory of Memory do), we risk invalidating the lived experience of beings who, internally, are indistinguishable from us.

  **Final Takeaway for Students:**
  Putnam uses Twin Earth to shrink the mind (less is in the head than we thought). *Blade Runner* uses Rachel to expand the moral circle (more counts as a person than history allows). The film demands we ask not just "Do her words refer?" but "Does her pain matter?"—a question semantic externalism is ill-equipped to answer on its own.
