          *   *Internal Indistinguishability:* Rachel $\neq$ Niece. Different brain. Twin Earth requires internal duplicates. Rachel is not a duplicate of the niece. She is a duplicate of a *person with those memories*.
          *   *Film's Priority:* Scott isn't doing philosophy of language. He's doing existentialism. Forcing the "reference" angle might miss the "empathy" point.
          *   *The "Human" Question:* Externalism says she lacks content. The film asks if she lacks a soul. These are different.

      *   **Conclusion: The Verdict.**
