      *   *Correction on VK:* The VK test detects *lack of empathy*. If replicants are externalist duplicates (history differs), but internalists say they lack empathy, the film actually leans Internalist regarding the *mind*, even if the *origin* is external. This tension is crucial. The prompt asks if the test presupposes internalism. Yes, it does. Does the film undermine that? Yes, by showing replicants *have* empathy (Rachael protecting Deckard, Roy saving Deckard). So the test fails because the internalist assumption (only humans have empathy) is false, not necessarily because externalism is true. I need to navigate this carefully. The prompt asks: "If externalism is right... no internal scan can read [history]." So the test *should* fail if the only difference is history. But in the film, the test *succeeds* initially. This implies replicants *are* internally different (less empathy). But the arc of the film suggests they aren't. So the film validates the Externalist intuition (history makes the difference) but shows the Internalist tool (VK) trying and failing to measure it.

  6.  **Final Polish:** Ensure the distinction between "meaning" (semantics) and "memory status" (epistemology/metaphysics) is clear in the Martin/Deutscher section. Make sure the "Strain" section is robust.

