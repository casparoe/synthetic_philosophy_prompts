answer: |-
  1. Elite history treats the state archive as a complete census when it is actually a biased sampling frame with detection probability near one for rulers and near zero for the laboring class. It estimates population parameters using only the most visible strata, implicitly assuming the unobserved majority behaves identically to the observed elite.

  2. Thompson's project is an attempt to correct detection bias by constructing new sampling frames for the unobserved strata, effectively running occupancy models on the working class to estimate their true abundance and agency. It argues that previous abundance estimates are invalid because the survey effort was disproportionately allocated to the literate elite.

  3. Microhistory abandons abundance estimation entirely to perform intensive life-history tracking on a single anomalous individual, treating the outlier not as statistical noise but as a tracer for the system's boundary conditions. It assumes that exhaustive data on one unrepresentative specimen reveals the constraints of the environment better than a broad, shallow survey.

  4. The microhistorical claim that an anomalous case exposes normal constraints translates with distortion because ecology treats outliers as error or distinct species rather than diagnostic keys to the population's structure. Your framework flags unrepresentative samples as a bug, whereas microhistory insists the bug is the feature that reveals the operating system.

  5. There is no expression for the archive as an active agent that constructs the population rather than merely detecting it, since ecological models assume the population exists independently of the survey method. This points to a missing framework in your vocabulary regarding how observation creates the observed, not just a failure of historians to make their categories precise.
