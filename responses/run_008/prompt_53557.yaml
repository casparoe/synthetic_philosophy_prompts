answer: |-
  Here are ten interview questions (five main lines of inquiry, each with a follow-up) drafted for your podcast. They are designed to be conversational but probing, using British English, and culminating in the "killer" question.

  **1. The Arbitrariness Problem**
  You argue that once a convention is settled, we're morally obliged to stick to it because breaking it amounts to free-riding on everyone else's cooperation. But conventions are famously arbitrary — in some places, you stand in a physical line; in others, you take a ticket from a machine. Presumably, you think we're obliged to do whichever one is local. But if the rule itself is completely accidental, what exactly is our moral obligation tracking? Is it the *specific action*, or just the fact that we've agreed on *something*?

  *   **Follow-up:** If you say it's just about maintaining the agreement, does that mean if we all woke up tomorrow and decided to swap the rules — tickets for lines, lines for tickets — we'd have been morally wrong the day before, but morally right the day after? It sounds like the morality is incredibly fragile.

  **2. The Tourist's Dilemma**
  Let's talk about visitors. If a tourist lands in London and genuinely doesn't realise that queue-jumping is frowned upon here, or perhaps they come from a culture where the scrum is the norm, are they morally blameworthy when they barge in? Or does genuine uncertainty about the local convention excuse them in a way that it wouldn't excuse a local?

  *   **Follow-up:** If you say they are excused because they didn't know, does that imply there's a prior duty to find out the rules before you arrive? Because if so, that makes going on holiday rather demanding — are we morally negligent if we don't research the queuing norms of every destination before we book the flight?

  **3. Jaywalking and the Law**
  I want to press on jaywalking. In some places, crossing against the light is illegal; in others, it's just custom. Does the fact that the police can fine you in one jurisdiction but not the other change the *moral* weight of the act? Or is the law just adding a prudential cost — the risk of a fine — to a moral equation that stays exactly the same regardless of the statute?

  *   **Follow-up:** If the law doesn't change the morality, why do we often feel that breaking a law is a different *kind* of wrong than breaking a custom? Are you worried that by lumping them together, you might be making the law seem trivial, or perhaps making etiquette seem too serious?

  **4. The Inflation of Morality**
  There's a classic objection that if we call queue-jumping a moral failure, we risk inflating morality until it bursts. If not waving thanks on the motorway is in the same category as stealing or lying, just to a lesser degree, don't we lose the sense that morality is specially serious? How do you stop everything from becoming a moral issue?

  *   **Follow-up:** You might say these duties are defeasible and can be overridden, but doesn't that just push the problem back? If I can override a moral duty to queue because I'm in a rush, haven't I just turned a moral obligation into a preference that I weigh up against my own convenience?

  **5. The "Killer" Question (Social Reform)**
  This is the worry that keeps me up at night regarding your view. Your account relies on the idea that existing conventions solve coordination problems and we shouldn't free-ride on them. But social progress often requires people to *break* conventions — think of the suffragettes disrupting social order, or people refusing to stand for royalty. If conforming to the settled convention is a moral obligation, doesn't your view imply that social reformers are morally in the wrong until they've successfully changed the norm?

  *   **Follow-up:** And if you say they're justified because the old convention was unjust, how do we distinguish a "reformers' exception" from a selfish person just deciding the rules don't apply to them? Because if we can't, isn't there a risk that your theory ends up defending the status quo against anyone trying to improve it?
