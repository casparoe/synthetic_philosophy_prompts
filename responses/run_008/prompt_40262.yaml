answer: |-
  Here is the specification sheet for a definition of death, structured by ontological, clinical, and ethical constraints.

  ### Part I: The Desiderata (The Spec)

  #### 1. The Paradigm Case Constraint
  *   **Requirement:** The definition must classify the clear-cut cases correctly without exception.
      *   *Case A:* The ordinary heart-attack patient in the ER with a pulse and respiration must be **Alive**.
      *   *Case B:* The decaying corpse in the morgue must be **Dead**.
      *   *Case C:* The frozen embryo (biologically paused but viable) must **Not be Dead**.
  *   **Why:** If a definition fails here, it loses all linguistic and legal traction. It creates a category error that invalidates the concept of death itself.
  *   **Status:** **Non-Negotiable.** (A definition that calls a walking person dead is functionally useless.)

  #### 2. The Process-vs-Event Accommodation
  *   **Requirement:** The definition must acknowledge that biological cessation is a gradient (cells die at different rates, digestion continues on ventilators) while still identifying a specific *moment* of death for legal recording.
      *   *Case:* The brain-dead pregnant woman whose body gestates a fetus for weeks.
  *   **Why:** Biological fact dictates that "the body" does not expire simultaneously. However, legal and social systems require a timestamp (time of death) to trigger wills, insurance, and organ procurement.
  *   **Status:** **Non-Negotiable.** (You cannot contradict biology, but you cannot operate without a timestamp.)

  #### 3. The Irreversibility vs. Permanence Distinction
  *   **Requirement:** The definition must explicitly state whether it requires *irreversibility* (physically impossible to restart) or *permanence* (will not be restarted due to decision).
      *   *Case:* The DCD patient declared dead 2–5 minutes after cardiac arrest. ECMO *could* restart them (not irreversible), but *won't* (permanent).
  *   **Why:** This is the crux of the Dead Donor Rule (DDR). If the definition requires strict biological irreversibility, DCD protocols are ethically suspect. If it accepts permanence, it risks conflating "dead" with "abandoned."
  *   **Status:** **Preference Smuggled as Demand.** (Proponents of strict biological realism demand irreversibility; proponents of utilitarian transplantation demand permanence. The definition itself must choose, but neither is an objective fact of nature.)

  #### 4. The Dying vs. Dead Boundary
  *   **Requirement:** The definition must distinguish between a patient who is *dying* (process underway, not yet complete) and a patient who is *dead* (process complete).
      *   *Case:* The patient in cardiac arrest during the 2-minute "no touch" period in DCD.
  *   **Why:** Moral status changes at the boundary. Interventions shift from therapy to autopsy/preparation.
  *   **Status:** **Non-Negotiable.** (Without this distinction, medical intervention has no off-ramp.)

  #### 5. The "Gone-for-Good" vs. "Dead" Distinction
  *   **Requirement:** The definition must not equate death with the total disintegration of matter.
      *   *Case:* The brain-dead body on a ventilator. It is "dead" but not "gone" (cells are metabolizing, wounds healing).
  *   **Why:** Modern technology allows somatic support after the "person" or "organism" is deemed dead. A definition that requires total cellular cessation would make organ transplantation impossible (organs would be necrotic).
  *   **Status:** **Non-Negotiable.** (If death meant "total atomic cessation," no one would ever be declared dead in a hospital.)

  #### 6. The Moral Status Alignment (The Anencephaly Test)
  *   **Requirement:** The definition must provide a consistent verdict on beings with severe neurological deficits but intact circulation.
      *   *Case:* The anencephalic infant (no cortex, brainstem present, breathing spontaneously).
  *   **Why:** This tests whether the definition values *biological life* (organism functioning) or *personal life* (consciousness/capacity).
  *   **Status:** **Preference Smuggled as Demand.** (Whole-brain advocates say "Alive." Higher-brain advocates say "Dead." Biology says "Alive." There is no biological fact that resolves the moral status of the anencephalic infant.)

  #### 7. Clinical Determinability & Reliability
  *   **Requirement:** The criteria must be observable by clinicians within hours using current tools, with high inter-rater reliability (Hospital A and Hospital B must agree).
  *   **Why:** Legal and administrative closure is required. Families cannot wait for biological certainty (which might take days); organs degrade quickly.
  *   **Status:** **Non-Negotiable.** (A definition that requires a decade of observation to confirm is not a definition of death; it is a definition of historical analysis.)

  #### 8. Dead Donor Rule (DDR) Compliance
  *   **Requirement:** The definition must ensure that organ procurement does not cause the death of the donor. The patient must be dead *before* the knife cuts.
  *   **Why:** This is the legal and ethical firewall preventing homicide for utility.
  *   **Status:** **Legally Non-Negotiable / Philosophically Contested.** (It is a hard legal constraint, but some philosophers argue we should discard the DDR rather than twist the definition of death to fit it.)

  ---

  ### Part II: The Incompatibility Analysis

  You asked to check if any subset of these desiderata is **jointly unsatisfiable**.
  **Verdict:** Yes. There is a fundamental trilemma. You cannot satisfy **Biological Realism**, **Clinical Utility**, and **Moral Intuition** simultaneously.

  Here are the specific contradictions:

  #### 1. The "Bright-Line" vs. "Biological Process" Contradiction
  *   **Conflicting Desiderata:** #2 (Process Accommodation) vs. #7 (Clinical Determinability/Bright-Line).
  *   **The Conflict:** Biology is analog; Law is digital.
      *   Biologically, death is a cascade. Cells starve at different rates. The heart can auto-resuscitate (Lazarus phenomenon) after 5 minutes. The brain stem might fail before the cortex, or vice versa. There is no single nanosecond where "life" leaves the body.
      *   Practically, you need a timestamp.
  *   **Why it's Unsatisfiable:** To get a bright line (Requirement #7), you must impose an arbitrary cutoff on a continuous process (violating Requirement #2's demand for biological accuracy). If you respect the biological gradient fully, you cannot produce a specific time of death. You must choose between *truth* (it's a process) and *utility* (it's an event).

  #### 2. The "Irreversibility" vs. "Organ Viability" Contradiction
  *   **Conflicting Desiderata:** #3 (Irreversibility) vs. #8 (DDR Compliance) vs. #7 (Clinical Utility).
  *   **The Conflict:** The Dead Donor Rule requires the patient to be dead *before* organ removal.
      *   To be biologically *irreversibly* dead (Requirement #3 strict reading), circulation must be stopped long enough that restart is physically impossible.
      *   To have viable organs for transplant (Requirement #8 goal), circulation must be stopped for the shortest time possible.
      *   In DCD protocols, we declare death at 2–5 minutes. At this mark, restart is *physically possible* (ECMO exists), just *not attempted*.
  *   **Why it's Unsatisfiable:** If you demand strict biological irreversibility, you violate organ viability (organs rot before irreversibility is certain). If you prioritize organ viability (declaring death at 5 minutes), you violate strict biological irreversibility. You are forced to redefine "irreversible" to mean "we won't try to fix it," which contradicts the ordinary language meaning of the word.

  #### 3. The "Organism as a Whole" vs. "Somatic Integration" Contradiction
  *   **Conflicting Desiderata:** #1 (Paradigm Cases) vs. #5 (Gone-for-Good Distinction).
  *   **The Conflict:** This targets the Brain Death standard.
      *   The standard justification for brain death is the loss of the body's integration "as a whole organism."
      *   However, the brain-dead pregnant woman (Requirement #2 Case) demonstrates somatic integration: she digests food, heals wounds, fights infection, and gestates a fetus. This is biological integration.
      *   If the definition says she is dead, it contradicts the biological evidence of integration. If the definition says she is alive, it contradicts the legal/moral intuition that a permanently unconscious body is dead.
  *   **Why it's Unsatisfiable:** You cannot claim the body is no longer an "integrated organism" (to justify calling it dead) while simultaneously pointing to its ability to gestate life (which requires high-level integration). One of these biological facts must be ignored to make the definition work.

  ### Summary of the Trap
  The spec you requested reveals that **Death is not a natural kind; it is a normative boundary drawn over a biological gradient.**

  *   If you prioritize **Biological Fact**, you cannot declare death until cellular rot is total (violating Transplant Utility and Clinical Timeliness).
  *   If you prioritize **Clinical Utility**, you must declare death while restart is still physically possible (violating Strict Irreversibility).
  *   If you prioritize **Moral Intuition** (e.g., "no consciousness = dead"), you must declare anencephalic infants dead while they breathe (violating Biological Organism criteria).

  Any definition you pick will have to violate at least one "Non-Negotiable" requirement listed above, re-categorizing it as a "necessary compromise." There is no configuration that satisfies the spec without contradiction.
