      *(Refining the Unsatisfiability Section)*: The core tension is between *Ontological Truth* (what death *is*) and *Operational Utility* (what death *does*). The prompt suspects "Match paradigm cases" vs "Bright-line biological fact." I need to confirm or deny this. Actually, the bigger tension is "Biological Irreversibility" vs "Clinical Timeliness" (DCD context). If you wait for true biological irreversibility, organs are useless. If you take organs, you might be killing. I will focus on the *Process vs. Event* dichotomy as the primary unsatisfiable pair.

