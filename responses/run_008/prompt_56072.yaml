answer: |-
  ### What the theory is for

  This theory isn't metaphysics; it's a tool for moral navigation in collective contexts. Its purpose is twofold: action-guidance for agents facing inefficacy objections, and blame-allocation for observers judging those agents. It must resolve the tension between individual causal negligible impact and collective catastrophic outcomes. Adequacy isn't about capturing abstract truth alone; it's about preserving moral intuition without collapsing into nihilism or fanaticism. If the theory tells agents their choices don't matter, it fails guidance. If it tells them they are guilty for breathing, it fails blame. It must bridge the gap between "I made no difference" and "We did something wrong."

  ### The requirements

  1.  **Mechanism Independence:** Verdicts shouldn't flip based on whether harm scales smoothly or in steps (Parfit's Torturers vs. Chicken Steps). **Verdict: Genuine.** Moral status shouldn't hinge on supply-chain granularity unknown to the agent.
  2.  **Non-Circularity:** Cannot derive wrongness from the axiom "participation is wrong" (No begging the question). **Verdict: Genuine.** This is the premise to prove, not assume.
  3.  **Moral Granularity:** Must distinguish imperceptible contribution from zero contribution (Torturers vs. Bystander). **Verdict: Genuine.** Otherwise, contributors equal bystanders, violating the asymmetry intuition.
  4.  **Substitutability Handling:** Must address the Compensator case (if I abstain, another takes my place). **Verdict: Negotiable.** A theory can assign joint responsibility or excuse the individual if replacement is certain; this is a dispute about complicity, not structure.
  5.  **Epistemic Usability:** Must be usable without solving game theory before dinner. **Verdict: Genuine.** Ought implies can know; inaccessible calculations cannot ground obligation.
  6.  **Demandingness Limit:** Cannot entail every spare dollar goes to harm reduction. **Verdict: Prejudice.** This is a substantive moral dispute (utilitarianism vs. moderate morality), not a structural requirement for the theory itself.
  7.  **Locus Specification:** Must identify if wrongness lies in Act, Disposition, or Practice. **Verdict: Genuine.** Vagueness here avoids the hard work of grounding responsibility.
  8.  **Cause/Benefit Distinction:** Must separate causing harm from benefiting from it. **Verdict: Genuine.** Prevents collapsing contributors into mere beneficiaries, preserving the special weight of agency.

  ### Where the list fights itself

  The central tension lies between Mechanism Independence and Moral Granularity. If wrongness tracks actual difference-making (Granularity), the Torturers are innocent—they made no perceptible difference. If wrongness ignores difference-making to condemn the Torturers, we violate the intuition that responsibility requires causal leverage. You suspect this is fatal. It isn't, but it forces a choice: either responsibility is probabilistic (Expected Value) or it's relational (Complicity). The list fights itself only if you insist responsibility must be both purely causal and collectively sensitive. You must drop the "purely causal" constraint. The theory must explain why contributing to a harm is wrong even when the contribution doesn't change the harm's magnitude. That means rejecting the premise that "no difference" equals "no responsibility."

  ### The knockout requirement

  Non-Circularity is the killer. It eliminates deontological "complicity" views that simply assert participating in wrongful practices is intrinsically bad. These views offer comfort but no justification. They say "Don't eat chicken because it's wrong," but when asked why, they say "Because it's participating in a wrong practice." This requirement forces theories to ground wrongness in outcomes, duties, or virtues, rather than semantic labeling. It clears the field of dogmatic intuitions masquerading as arguments.

  ### Quick scorecard

  1.  **Pure Causal:** Fails Mechanism Independence and Granularity. Exonerates Torturers and Chicken-eaters. Technically usable, but morally empty in collective cases.
  2.  **Expected Value:** Handles Chicken and Voting well (probabilistic difference). Fails Usability (too hard to calculate probabilities) and Compensator (EV might be zero if replacement is certain).
  3.  **Fair Share:** Handles Torturers well (did your part). Fails Compensator (if others don't do their share, is my share still required?) and Demandingsness (often requires too much sacrifice).

  None pass perfectly. Expected Value is the strongest contender if Usability is relaxed; Fair Share is best if Demandingsness is strict.
