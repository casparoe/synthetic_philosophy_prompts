answer: |-
  Your instincts are excellent. You have correctly identified that English (and likely natural language generally) employs a single syntactic structure ("Adjective + Noun") to perform several distinct semantic operations. The confusion arises because we use the same copula ("is") and the same negation ("not") across these different operations.

  There is a principled account that captures nearly all your verdicts, rehabilitates Gongsun Long without conceding that ordinary speech is wrong, and predicts the behavior of novel terms. It relies on **Semantic Modification Typology** and the **Intension/Extension Distinction**.

  ### I. The Principles

  To capture your verdicts, we need three precise clauses.

  **Principle 1: The Typology of Modification**
  Adjectives (and modifiers) relate to the noun they modify in one of three logical ways:
  1.  **Intersective:** The extension of the phrase is the intersection of the adjective and the noun.
      *   *Formula:* $[[A N]] = [[A]] \cap [[N]]$
      *   *Implication:* If $x$ is an $A N$, then $x$ is $A$ AND $x$ is $N$.
      *   *Examples:* "Red apple," "White horse" (in the literal color sense).
  2.  **Subsective (Non-Intersective):** The phrase is a subset of the noun, but the adjective does not apply to the object independently.
      *   *Formula:* $[[A N]] \subseteq [[N]]$, but $[[A N]] \not\subseteq [[A]]$.
      *   *Implication:* If $x$ is an $A N$, then $x$ is $N$, but $x$ is not necessarily $A$ (simpliciter).
      *   *Examples:* "Small elephant" (is an elephant, but not necessarily a small thing), "Good violinist" (is a violinist, but not necessarily good at everything).
  3.  **Privative:** The phrase excludes the noun entirely.
      *   *Formula:* $[[A N]] \cap [[N]] = \emptyset$
      *   *Implication:* If $x$ is an $A N$, then $x$ is **not** $N$.
      *   *Examples:* "Fake gun," "Former senator," "Alleged thief."

  **Principle 2: The Ambiguity of "Is"**
  The copula "is" in sentences of the form "An $X$ is a $Y$" oscillates between two relations:
  1.  **Class Inclusion (Predication):** $[[X]] \subseteq [[Y]]$. (e.g., "A white horse is a horse.")
  2.  **Concept Identity:** $Concept(X) = Concept(Y)$. (e.g., "The Morning Star is the Evening Star" — same referent, different concept; or "A bachelor is an unmarried man" — same concept).
  Ordinary speech defaults to **Class Inclusion**. Philosophical logic often trades on **Concept Identity**.

  **Principle 3: The Scope of "Not"**
  Negation ("is not") can deny either:
  1.  **Membership:** The object does not belong to the class $Y$.
  2.  **Identity:** The concept $X$ is not identical to the concept $Y$.

  ---

  ### II. Applying the Account to Your Verdicts

  Here is how this framework validates your intuitions while explaining the underlying mechanics.

  | Sentence | Your Verdict | Semantic Analysis | Principle Applied |
  | :--- | :--- | :--- | :--- |
  | **"A white horse is not a horse"** | **False** | "White" is **Intersective**. A white horse is in the intersection of *White Things* and *Horses*. Therefore, it is in the set of *Horses*. | Principle 1 (Intersective) & 2 (Inclusion). |
  | **"A fake gun is not a gun"** | **True** | "Fake" is **Privative**. It explicitly negates the noun's extension. | Principle 1 (Privative). |
  | **"A toy duck is not a duck"** | **True** | "Toy" is **Privative** in this context (ontological category). | Principle 1 (Privative). |
  | **"An alleged thief is not a thief"** | **True** | "Alleged" is **Privative** regarding the fact of the matter (epistemic status). | Principle 1 (Privative). |
  | **"A former senator is not a senator"** | **True** | "Former" is **Privative/Temporal**. It shifts the time index so current membership is false. | Principle 1 (Privative). |
  | **"A small elephant is not a small animal"** | **True** | "Small" is **Subsective**. "Small" is relative to the noun. A small elephant $\in$ Elephants, but $\notin$ Small Things (generally). | Principle 1 (Subsective). |
  | **"A good violinist is not good"** | **True** | "Good" is **Subsective**. Good *at violin*, not good *simpliciter*. | Principle 1 (Subsective). |
  | **"A red apple is not an apple"** | **False** | "Red" is **Intersective**. Red apple $\in$ Apples. | Principle 1 (Intersective). |
  | **"A dark horse is not a horse"** | **Ambiguous** | **Idiomatic vs. Literal.** Literal: Intersective (False). Idiomatic ("unexpected candidate"): The noun "horse" is metaphorical, so the literal category "horse" does not apply. | Principle 1 (Lexicalized/Idiom). |

  **Verdicts Overturned?**
  I would overturn none of your verdicts. They are semantically robust. However, I would refine your intuition about "White Horse." You called it "plainly false." Under **Principle 2 (Concept Identity)**, it is technically **True**. The *concept* "White Horse" is not identical to the *concept* "Horse." Gongsun Long relies on this truth to trick the listener into accepting the **Class Inclusion** falsehood.

  ---

  ### III. Rehabilitating Gongsun Long

  Is there a coherent reading on which Gongsun Long is right while ordinary speakers are also right? **Yes.**

  **1. The Intensional Defense (Argument 1)**
  Gongsun Long argues: "Horse" names shape; "White" names color; "White Horse" names both.
  *   **Ordinary Speaker:** Hears "is not" as **Class Inclusion**. (Is the object in the set?) Answer: Yes.
  *   **Gongsun Long:** Hears "is not" as **Concept Identity**. (Is the *name* equivalent to the *name*?) Answer: No.
  *   **Resolution:** He is arguing about *Ming* (Names/Concepts), not *Shi* (Actualities/Extensions). He is correct that the *definition* of "white horse" differs from "horse." He is sophistical only in implying that conceptual difference entails exclusion from the class.

  **2. The Request Argument (Argument 2)**
  Gongsun Long argues: If you ask for a horse, yellow/black suffice. If you ask for a white horse, they do not. Therefore, they are different.
  *   **Semantic Asymmetry:** This identifies a real difference in **Intension** (Criteria of Satisfaction).
  *   **The Trap:** Different criteria of satisfaction do not imply disjoint extensions.
      *   Request $A$: Satisfiers = $\{x \mid Horse(x)\}$
      *   Request $B$: Satisfiers = $\{x \mid Horse(x) \land White(x)\}$
      *   Since Set $B \subset$ Set $A$, the requests are different. Gongsun Long concludes $B \notin A$. Logic dictates $B \subseteq A$.
  *   **Non-Dismissive Take:** Gongsun Long is highlighting that language is sensitive to **informational content**, not just reference. "White Horse" carries more information than "Horse." In a logic of information (hyperintensional logic), they are indeed distinct objects. He is a precursor to intensional logic, not a bad extensional logician.

  ---

  ### IV. The Novel Composite Term

  You asked for a composite term where both the affirmation and the negation sound defensible, to show where the account strains.

  **The Term:** "An Honorary Doctor"

  **The Verdicts:**
  1.  **"An honorary doctor is a doctor."**
      *   *Defensible:* In terms of **Title and Social Protocol**. They are addressed as "Doctor," wear the regalia, and hold the rank. In the context of a university roster, they are listed under "Doctors."
      *   *Semantic Type:* **Subsective (Social Role).** $[[Honorary Doctor]] \subseteq [[Title Holder]]$.
  2.  **"An honorary doctor is not a doctor."**
      *   *Defensible:* In terms of **Qualification and Function**. They have not performed the research, earned the PhD/MD, or practiced the profession.
      *   *Semantic Type:* **Privative (Professional Status).** $[[Honorary Doctor]] \cap [[Qualified Professional]] = \emptyset$.

  **Why this strains the account:**
  This case reveals that the Noun ("Doctor") itself is ambiguous between **Status** (a title one holds) and **Competence** (a skill one possesses).
  *   If "Doctor" means Status: "Honorary" is Intersective/Subsective. (Affirmation true).
  *   If "Doctor" means Competence: "Honorary" is Privative. (Negation true).

  Gongsun Long would seize this. He would say: "The name 'Doctor' in 'Honorary Doctor' is not the name 'Doctor' in 'Medical Doctor'. Therefore, an Honorary Doctor is not a Doctor."
  He is right about the *Name* (the concept of the role differs).
  The ordinary speaker is right about the *Object* (the person is often treated as a doctor in ceremony).

  ### V. Summary of the Principled Line

  The line between sophistry and truth here is the **Intension/Extension Boundary**.

  1.  **Ordinary Speech** operates primarily in **Extension**. We care about what objects fall under the term. In extension, subsets are members of the superset. (White horses are horses).
  2.  **Gongsun Long** operates in **Intension**. He cares about the definition and criteria of the term. In intension, a specific concept is not identical to a general concept. ("White Horse" $\neq$ "Horse").
  3.  **Your Verdicts** are consistent because you intuitively switch between these modes based on the **Adjective Type**.
      *   With **Privative** adjectives ("Fake"), you know the extension is disjoint, so "is not" is true extensionally.
      *   With **Intersective** adjectives ("Red"), you know the extension is included, so "is not" is false extensionally.
      *   With **Gongsun Long's case**, you reject the intensional argument because ordinary conversation prioritizes extensional truth conditions.

  **Final Prediction:**
  If you encounter a term like **"A virtual currency,"** you will find the same split.
  *   "Virtual currency is not currency." (True: It lacks legal tender status/physicality -> Privative).
  *   "Virtual currency is currency." (True: It functions as a medium of exchange -> Subsective/Functional).
  *   Gongsun Long would say: "Virtual Currency is not Currency, because the request for 'Currency' (legal) differs from 'Virtual Currency' (digital)." He is identifying the intensional gap; you are identifying the functional overlap. Both are coherent within their own semantic domain.
