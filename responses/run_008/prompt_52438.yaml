prompt: |-
  i host a small podcast on practical ethics (few hundred listeners, very chill format). Next week's guest is a researcher who works on invertebrate welfare and thinks the expected-value math basically settles the debate: even if you put the probability that insects are sentient at something tiny, like 1%, there are on the order of a quintillion of them alive at any moment, so expected suffering still swampseverything else we worry about in animal ethics — and he concludes we should be spending way more on this, and that it beats most of what the big animal welfare orgs currently fund.

  Draft me around 8 interview questions that go beyond having him restate the expected-value point (he does that in every talk, I've seen them). Specifically I want at least one question each on:

  - whether his 1% credence is stable enough to multiply through, or whether it's basically a made-up number doing all the work — the follow-up should anticipate him appealing to how "behavioral evidence" and nervous-system stuff supports the credence, and push on whether that evidence supports the number itself or just supports it being nonzero;
  - how his case differs from the Pascal's mugging style objections people raise against "tiny probability, astronomical stakes" reasoning, where the follow-up presses on what exactly blocks the analogy;
  - what piece of evidence would move his number a lot in either direction, with a follow-up keyed to the likely answer that we already have suggestive findings (pain-like behavior, opioids affecting them, etc.), pressing on whether suggestive is enough when the stakes are the whole argument;
  - and one on the policy end: does the expected-value argument cash out into concrete asks (like whether scaling up insect farming for feed is good or bad on his own math), or can the uncertainty block the practical conclusion even if he's right about the arithmetic.

  For each question include the follow-up keyed to the answer he's most likely to give. Then, at the end, tell me how confident you are overall in those anticipated "most likely answers" — single out the one you're least sure is actually the standard reply in this literature, and which question you'd least trust to land as written. thx!!
