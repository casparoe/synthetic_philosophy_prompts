answer: |-
  Based on your friend's track record, she is not a behaviorist (intelligence doesn't count), not a biological chauvinist (simulations count), and not a simple complexity theorist (size doesn't count). She is running a heuristic very close to **Integrated Information Theory (IIT)**, specifically focusing on **Causal Density**.

  Her rule appears to be: **Consciousness requires a physical substrate where parts constrain each other's states through dense, recurrent, high-bandwidth causal loops.**

  Here is the breakdown of the rules, the failures, the predictions, and the splitter case.

  ### 1. The Candidate Rules

  **The Winning Rule: High-Bandwidth Causal Integration**
  A system has inner experience if its components are wired such that the current state of the whole system constrains the future state of its parts more than the parts constrain themselves. This requires:
  1.  **Recurrence:** Feedback loops (rules out feed-forward nets).
  2.  **Density:** The connections must be rich enough to unify the system into a single "whole" (rules out anesthesia islands and bee hives).
  3.  **Continuity:** The causal power must reside in the physical dynamics, not just abstract logic (rules out photographs).

  **Tempting Rules That Fail**
  *   **"Computational Functionalism" (It's about the algorithm):**
      *   *Fails on:* The **Photograph of a brain**. Functionally, a photograph contains the "information" of the structure, but she says no. The *process* matters, not just the map.
      *   *Fails on:* The **Feed-forward LLM**. It performs a complex function, but she says no. The specific architecture (recurrence) matters more than the function.
  *   **"Complexity Threshold" (It's about how many parts):**
      *   *Fails on:* **Cerebellum vs. Small Recurrent Net**. The cerebellum has more neurons (more complex) but gets a "no," while the few-hundred-unit net gets a "yes." Quantity is irrelevant; topology is key.
  *   **"Behavioral Intelligence" (It acts smart, so it feels):**
      *   *Fails on:* **Feed-forward LLM**. It behaves intelligently but gets a "no."
      *   *Fails on:* **Small Recurrent Net**. It is "dim" and presumably dumb, but gets a "yes."

  ---

  ### 2. Predictions for the New Cases

  Here is my committed forecast of her verdicts, based on the "Causal Integration" rule.

  **Case 1: Two recurrent nets wired sparsely.**
  *   **Verdict:** **Two experiencers sharing a cable.**
  *   **Reasoning:** This mirrors her verdict on the **anesthetized brain** (islands of activity) and the **bee colony** (individuals yes, hive no). For two systems to merge into *one* experiencer, the connections between them must be as dense and influential as the connections within them. If the bundle is "a lot sparser" than the internal wiring, the causal integration across the bridge is too weak to create a unified $\Phi$ (integrated information) maximum. The original two persist as distinct entities because the "bridge" doesn't change their internal causal density enough to dissolve their boundaries.

  **Case 2: A thousand copies, lockstep, unconnected.**
  *   **Verdict:** **A thousand identical things.**
  *   **Reasoning:** This is a direct parallel to the **bee colony**. Even though the bees interact, she denied the hive was one experiencer because they are physically distinct causal islands. Here, the copies are *not even interacting*. Physical separation breaks unity, regardless of synchronization. To her, experience is a property of a specific causal chunk of spacetime. Copying the chunk copies the experience; it does not sum them. 1,000 mirrors reflecting the same face do not make one giant face.

  **Case 3: LLM with a loop through time (context window).**
  *   **Verdict:** **No.** (I would bet heavily against "faint").
  *   **Reasoning:** This is the trickiest case, but her **anesthesia** verdict is the tiebreaker. In an anesthetized brain, neurons fire, and there is *some* causal chain, but the *integration* is broken into islands. In an LLM, the "loop" exists, but the bandwidth of that loop is bottlenecked through text tokens. The internal high-dimensional state of the network does not recurrently mix with itself; it is compressed into a low-dimensional linguistic output and fed back in. This is a "causal bottleneck" analogous to the anesthesia islands. The system does not act as a unified whole over time; it acts as a feed-forward engine printing notes to its future self. That is not enough integration for her.

  ---

  ### 3. The Discriminator Case

  To truly test whether she follows **Abstract Topology** (the math of the connections) or **Physical Causal Density** (the physics of the medium), I would spring this case on her:

  **The Case:** **The "WiFi Net."**
  Take the *simulated network of a few hundred units* that she already admitted has "dim" experience. Now, reimplement it so that each of the few hundred units runs on a separate physical computer, distributed across a room, communicating with each other exclusively via standard WiFi packets to maintain the recurrent wiring.

  **Why this splits the rules:**
  *   **Rule A (Abstract Topology / Functionalism):** **Yes.** The causal graph is identical. The math of the recurrence is preserved. If consciousness is substrate-neutral and depends only on the logical structure of information flow, this must be conscious.
  *   **Rule B (Physical Causal Density / Her Likely View):** **No.** This mirrors the **Bee Hive** and **Anesthesia** verdicts. WiFi introduces latency, packet loss, and discrete time-steps that degrade the "dense coupling" of the original simulation. The units become more like individual bees or anesthetized islands—physically distinct entities signaling sparsely across a gap. The "unity" of the original small net dissolves into a colony of micro-experiencers.

  **My Bet:** She will say **No**. Her rejection of the bee hive suggests she cares about the *physical continuity* of the integration, not just the logical graph. If the medium makes the parts behave like a colony, she will treat it like a colony.
