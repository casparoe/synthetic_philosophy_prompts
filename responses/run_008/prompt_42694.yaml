answer: |-
  (1) **What he got right**
  Your brother correctly identifies the structural skeleton of the problem: this is a classic "Counterfactual Mugging," a close cousin of Newcomb's Problem. He is also right that Functional Decision Theory (FDT) distinguishes this from "XOR Blackmail." In Counterfactual Mugging, FDT prescribes paying the £50 because your decision now is logically correlated with the predictor's past simulation; being the *type* of agent who pays is what triggers the reward in the counterfactual Heads world. In XOR Blackmail, FDT prescribes refusing, because being the *type* who refuses prevents the blackmailer from engaging you at all. His summary of the theoretical distinction between the two cases is accurate, and he is correct that FDT aims to maximize utility across all possible worlds consistent with your decision algorithm, not just the actual causal timeline.

  (2) **Where the summary bends the truth**
  First, the claim that a simulation is "literally you deciding again" is a rhetorical flourish, not a technical requirement. FDT does not require a literal simulation or a metaphysical identity between you and the prediction; it requires *logical subjunctive dependence*. All that matters is that the predictor's model and your actual decision share the same source code (or character traits) such that they output the same result. A careful FDT proponent would say Sam's "knowing your character" is sufficient *if* that knowledge is reliable, but they would reject the idea that magic is happening. The brother's phrasing smuggles in a mystical view of causation that isn't necessary for the math to work; the link is logical correlation, not backward causation.

  Second, the phrase "paying on tails is what causes you to have been offered the £500" is dangerously imprecise. FDT proponents avoid saying your current choice *changes* the past. Instead, they argue that your decision procedure selects a logical output that was *always* the output, both in the prediction and in reality. You aren't reaching back in time to create the offer; you are revealing which logical branch you inhabit. If you refuse, you reveal you are the type who refuses, meaning the predictor (if accurate) never would have offered the deal in the Heads world. Your brother's wording suggests you can influence a settled past, which even FDT denies; you can only determine which consistent timeline you are in.

  Third, the assertion that "FDT agents end up rich" is a heuristic, not a universal law. FDT agents win in Newcomb and Mugging scenarios, but they lose in "Anti-FDT" problems where a predictor specifically punishes agents using FDT logic (e.g., "I give money to anyone except those who reason like Yudkowsky"). More importantly, FDT only works if the predictor is actually reliable. If Sam is bluffing about the coin, the money, or his predictive ability, the logical link is broken. Your brother presents FDT as a cheat code for reality, but it is strictly conditional on the problem being transparent and the predictor being trustworthy. In the real world, most "predictors" are just people making claims they can't verify.

  (3) **So do I pay Sam?**
  No, do not pay. While FDT theoretically recommends paying in a genuine Counterfactual Mugging scenario, that recommendation hinges entirely on the reliability of the predictor and the transparency of the game. Sam's "prediction" was not a rigorous simulation or a verified track record; it was a post-hoc claim about your character made after the coin landed. For FDT to apply, you must believe there is a high probability that Sam actually had £500 ready for Heads and that his assessment of your character was accurate *before* the flip. Given this is a flatmate interaction with no contract and no verification, the probability that this is a bluff or a fabrication is high. If the setup is fake, paying £50 buys you no logical consistency and no future reward; it just makes you £50 poorer. The fact that he based it on "character" doesn't save it—that only works if his read on your character is the actual mechanism determining the payoff, but since the coin already landed Tails, the mechanism is broken unless you trust his honesty completely. Don't trust it.

  (4) **Confidence and the weak point**
  I am highly confident in the philosophical audit (Section 2); your brother's summary is a standard but slightly sensationalized pop-rationalist take that glosses over the strict conditions required for FDT. I am moderately confident in the practical advice (Section 3); while a pure FDT agent *might* pay to maintain policy consistency, in a one-off human interaction with low trust, the expected value of verifying the claim outweighs the theoretical benefit. The single weak point I'd least bet the £50 on is the reliability of Sam's prediction. If it turned out Sam actually had £500 set aside and a documented history of perfect predictions, refusing would be the costly error—but in the absence of that evidence, the "prediction" is the weakest link in the chain.
