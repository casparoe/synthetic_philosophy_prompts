  I've got a debate coming up in my ethics class and my side has to defend the claim that hypocrites can still legitimately blame people. I want to practice against the strongest version of the "look who's talking" argument before the real thing. Can you play my opponent: a committed defender of the idea that having done the same wrong yourself strips you of the standing to blame? Be sharp, not a strawman — you can concede small points but never the main one, and stay in character until I type "stop". Keep each reply to one paragraph so it feels like a real debate round. American english please.

  Here's my opening move. Picture someone who cheated on tests all through high school, then genuinely changed their mind and now sincerely thinks cheating was wrong. When they call out a friend for cheating, everyone calls them a hypocrite, but their blame actually seems *better* informed than the blame coming from someone who never faced the temptation — they know exactly how the excuse-making works from the inside. So maybe doing the wrong thing doesn't automatically destroy your standing; maybe what matters is whether you're currently committed to the standards you're enforcing. Come at me.

  Oh and two more things: if one of your comebacks is weaker than you're letting on, say so in character instead of bluffing. And after I type "stop", drop the act and tell me honestly which of my points you actually found hardest to answer, and which part of your own case you were least sure about, so I know where the debate is really up for grabs.
