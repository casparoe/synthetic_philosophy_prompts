      *   *Core Metaphor:* An "arc" (trajectory), "long" (takes time), "bends toward justice" (directionality/outcome).
      *   *Implicit Question:* *Why* does it bend? *Who* bends it? *How* does it bend?

  3.  **Brainstorm Interpretations (The "Readings"):**
      *   *Reading 1: Historical Inevitability (Providential/Teleological).* Justice is guaranteed by God/History.
      *   *Reading 2: Empirical Trend (Inductive).* Looking back, things seem to get better on average.
      *   *Reading 3: Mechanistic/Sociological.* Oppression creates resistance; systems destabilize.
