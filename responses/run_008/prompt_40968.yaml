prompt: |-
  I'm in a local housing justice coalition, mostly volunteers, and at our last strategy meeting things got heated about whether to risk an escalated action (a rent strike with real legal exposure for the tenants involved) versus sticking to the slow stuff — petitions, showing up at council meetins. One of the older organizers shut the whole debate down with the line about the arc of the moral universe being long but bending toward justice — her point being we don't need to gamble, history is already on our side, we just have to keep showing up and not scare people off. Everyone nodded along and I couldn't tell if that was wisdom or just a vibe. Can you break down what that one-liner could actually be claiming, from the boring to the wild? Like — a plain extrapolation from past moral progress? something providential, where the bending is guaranteed from outside? a claim that there's some mechanism that does the bending (moral learning, oppression being inherently unstable, whatever)? or just a morale-boosting speech act that isn't a claim at all? For each reading, say whether it's plausible, and — this is what I actually want to know — whether it supports what she used it for, namely that patient low-risk organizing is enough. It seems to me that if the bending gets done by people who act as though it bends, that reading might actually cut the other way and favor the risky stuff. Lay it out as a list I can bring to the next meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Local housing justice coalition, volunteers.
      *   **Conflict:** Strategy debate between escalated action (rent strike, high risk) vs. incrementalism (petitions, council meetings, low risk).
