      *   **Analysis per Requirement:** Motivation + Is it a genuine demand or camp preference? (Specifically noting "objectivity" might be the latter).
      *   **Conflict Analysis:** Which requirement excludes the most interpretations? Are any subsets jointly unsatisfiable? (Specifically checking the hunch: Ascertainability + Single-case Objectivity).
      *   **Format:** Handout style (bullets fine).
      *   **Constraint:** Do *not* score specific interpretations (Frequentism, Subjectivism, Propensity) against the list; leave that for the students.

  2.  **Drafting the Desiderata (The "What"):**
      *   *Formal Admissibility:* Must map to Kolmogorov. (Standard).
      *   *Ascertainability:* We need to know the values somehow. (Empiricist demand).
      *   *Frequency Guidance:* Why do long-run frequencies match probabilities? (Bridge to evidence).
      *   *Single-Case Applicability:* Can I talk about *this* event? (Realist/Pragmatic demand).
      *   *Reference Class Stability:* How to handle individual risk vs. group stats. (Epistemic/Metaphysical tension).

  3.  **Analyzing Motivations & Status (The "Why" and "Who"):**
      *   *Kolmogorov:* Motivation = Mathematical coherence. Status = Genuine demand (otherwise it's not probability).
      *   *Ascertainability:* Motivation = Empirical relevance. Status = Camp preference (Epistemicists demand it, Ontic realists might say "truth is independent of knowledge").
      *   *Frequency Guidance:* Motivation = Explaining success of science. Status = Genuine demand (mostly), but *how* it's explained varies.
      *   *Single-Case:* Motivation = Scientific practice (quantum mechanics, weather). Status = Camp preference (Frequentists deny this is meaningful).
      *   *Reference Class:* Motivation = Action guidance/Truth conditions. Status = Genuine demand (logic requires it), but *solution* is camp-dependent.
      *   *Objectivity (The User's specific point):* Motivation = World-independence. Status = Camp preference (Subjectivists reject this).

  4.  **Identifying Conflicts (The "Tension"):**
      *   *Which excludes the most?* Single-Case Applicability kills Classical and Strict Frequentism. Ascertainability kills some forms of Realism/Propensity (if propensities are hidden).
      *   *The "Impossible Trinity" (or Dyad):* The user suspects Ascertainability + Single-Case Objectivity is the trouble spot.
          *   If it's single-case *objective* (out there in the world), how do we *ascertain* it from finite data? (Underdetermination).
          *   If we *ascertain* it from frequencies, is it really single-case? (Reductionism).
          *   This is the "Epistemic Access vs. Ontic Commitment" tension.
      *   *Another Conflict:* Objectivity + Ascertainability. If probabilities are purely subjective degrees of belief, they are ascertainable (by the agent) but not objective. If they are objective propensities, they might not be fully ascertainable.

  5.  **Refining the Output (Handout Style):**
      *   Tone: Academic, provocative, clear.
      *   Structure: Introduction -> The Desiderata List -> Analysis of Tensions -> Discussion Questions.
      *   Check constraints: Did I score the interpretations? No. Did I include the specific examples (atom, death before 70)? Yes.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to solve the problems. The point is to frame the debate.
      *   *Nuance:* On the "Reference Class" point, acknowledge that some interpretations dissolve the problem rather than solve it.
      *   *Nuance:* On "Objectivity," explicitly label it as a metaphysical preference, as requested.
      *   *Conflict:* The user's hunch is "full ascertainment plus single-case objectivity." I need to validate this. This is essentially the problem of *underdetermination of theory by evidence* applied to probability. If a propensity is a single-case physical property, infinite trials aren't possible to measure it exactly. So strict ascertainment is impossible. I should frame this as the "Access vs. Existence" trade-off.

