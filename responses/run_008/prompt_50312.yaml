answer: |-
  # Seminar Handout: The Job Description of Probability
  **Course:** Philosophy of Science | **Topic:** Interpretations of Probability

  We often jump straight into *which* interpretation is correct (Frequentist? Bayesian? Propensity?). But before we judge the candidates, we need the job description. What is an interpretation of probability actually supposed to *do*?

  Below is a list of **Desiderata**—adequacy conditions that a successful interpretation should ideally meet. Note that meeting one often makes meeting another harder. Your job this term is not to find the perfect score, but to see which trade-offs each interpretation forces us to make.

  ### The Desiderata List

  *   **1. Formal Admissibility**
      *   **The Requirement:** The interpretation must map cleanly onto the Kolmogorov axioms (non-negativity, normalization, additivity).
      *   **Motivation:** Without this, we aren't doing probability; we're doing something else that merely uses the word. It ensures mathematical coherence.
      *   **Status:** **Genuine Demand.** If an interpretation violates the axioms, it is mathematically broken. (Note: Some quantum logics challenge this, but for standard science, this is non-negotiable).

  *   **2. Ascertainability**
      *   **The Requirement:** There must be some method by which agents can determine, estimate, or constrain the numerical value of a probability claim.
      *   **Motivation:** Science is an empirical practice. If probability values are permanently hidden from us, they cannot guide prediction, policy, or belief.
      *   **Status:** **Camp Preference (Epistemic/Empiricist).** Realists may argue truth is independent of knowledge. A probability could be "out there" even if we can't measure it (like the mass of a distant black hole). Demanding *knowability* privileges the user over the world.

  *   **3. Frequency Guidance**
      *   **The Requirement:** The interpretation must explain *why* observed relative frequencies in long runs tend to stabilize around probability values (i.e., it must ground the Law of Large Numbers, not just assume it).
      *   **Motivation:** Probabilities are confirmed by frequencies. If an interpretation cannot explain why flipping a fair coin usually yields ~50% heads, it disconnects the math from the data.
      *   **Status:** **Genuine Demand (mostly).** Any interpretation that treats the connection between probability and frequency as a "brute miracle" fails to explain the success of statistical science.

  *   **4. Single-Case Applicability**
      *   **The Requirement:** The interpretation must assign meaning to probability statements about individual, non-repeatable events (e.g., "The probability that *this* specific atom decays in the next minute is 0.5").
      *   **Motivation:** Scientific practice and decision-making often concern unique events (climate tipping points, specific medical diagnoses, quantum measurements).
      *   **Status:** **Camp Preference (Realist/Pragmatist).** Strict Frequentists deny this is meaningful, arguing probability *only* applies to collectives. Demanding single-case meaning rules out strict Frequentism by fiat.

  *   **5. Reference Class Stability**
      *   **The Requirement:** The interpretation must provide a principled way to handle the fact that an individual belongs to multiple populations (e.g., The probability *I* die before 70 changes if you class me by "smokers," "philosophers," or "males").
      *   **Motivation:** Probability claims guide action. If the truth value of "My risk is X" fluctuates wildly based on arbitrary categorization, the claim loses its normative force.
      *   **Status:** **Genuine Demand (Logical).** The problem is real regardless of interpretation. However, *solving* it often requires metaphysical commitments (e.g., there is a "correct" natural kind) that not all interpretations accept.

  *   **6. Ontic Objectivity**
      *   **The Requirement:** Probability statements describe features of the external world, not just states of mind or information.
      *   **Motivation:** We want to say the atom *would have decayed* even if no one was watching. We want the world to be chancy, not just our knowledge to be incomplete.
      *   **Status:** **Camp Preference (Metaphysical Realist).** Subjectivists (Bayesians) explicitly reject this. They argue probability is about rational belief, not physical stuff. Demanding this excludes Subjectivism by definition.

  ***

  ### The Tension Points (For Discussion)

  **1. The "Exclusionary" Requirement**
  Which requirement knocks out the most historical contenders?
  *   **Candidate:** **Single-Case Applicability.**
  *   **Reasoning:** This is the graveyard of Classical and Strict Frequentist interpretations. If you define probability strictly as a long-run frequency in a hypothetical infinite collective, you cannot coherently assign a probability to a unique event (like the decay of one specific atom or the outcome of a single election) without engaging in metaphysical hand-waving. If you keep this requirement, you are forced toward Propensity or Subjective interpretations.

  **2. The "Impossible Dyad"**
  Are there two requirements that cannot be jointly satisfied?
  *   **The Conflict:** **Full Ascertainability + Single-Case Objectivity.**
  *   **The Problem:** If probabilities are objective physical properties of single cases (Propensities), they are distinct from frequencies. But if they are distinct from frequencies, how do we *ascertain* them? We only ever observe frequencies.
      *   If you say "We ascertain them *via* frequencies," you risk collapsing back into Frequentism (losing single-case objectivity).
      *   If you say "They are real but hidden," you sacrifice Ascertainability (you can never know if your estimate matches the real propensity).
  *   **The Takeaway:** You can have single-case objectivity, or you can have direct empirical access, but you likely cannot have both without a gap. This is the **Underdetermination of Propensity by Evidence.**

  **3. The Reference Class Dilemma**
  *   **The Conflict:** **Reference Class Stability + Ontic Objectivity.**
  *   **The Problem:** If probabilities are objective features of the world, there should be *one* true probability of you dying before 70. But you belong to infinite overlapping reference classes. Unless the world comes pre-sorted into "natural kinds," an objective probability for an individual is ill-defined. To solve this, you either have to say probabilities are relative to descriptions (sacrificing pure Objectivity) or that there is a "maximal" reference class we can't access (sacrificing Ascertainability).

  ***

  **Seminar Task:** As we review the interpretations this term, do not ask "Which one is true?" Ask: **"Which desideratum did this interpretation sacrifice to save the others?"**
