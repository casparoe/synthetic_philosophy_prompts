answer: |-
  Dear friend,

  I completely understand why you feel stuck, because your flatmate has constructed a very tight, seductive argument that basically tries to turn Sen's formal result into a moral demolition of liberalism. It is a classic move in social choice theory to take an impossibility theorem and argue that one of the axioms must be morally bankrupt, and your flatmate is betting everything on the claim that Pareto efficiency is the ultimate test of moral justification. But I think you are right to feel that the conclusion is crazy, and the way out isn't to abandon rights or deny the theorem, but to spot where the argument smuggles in a controversial assumption about what counts as a value. The step you need to challenge is Premise (2), and by extension Premise (5), because they rely on a welfarist definition of justification that assumes the only thing that matters for justifying a rule is whether it satisfies people's preferences over outcomes. This looks fine in the first place because we are trained in economics and social choice to treat preferences as the sole currency of value, but it costs you the very thing that makes rights special, which is their ability to protect agency even when agency leads to suboptimal outcomes.

  When your flatmate argues in Premise (2) that a social rule leading to an outcome everyone prefers not to have cannot be justified by appeal to their own values, he is equating values with preference rankings over social states. But for a liberal, my values include not just what happens to me, but who decides what happens to me. If I value my autonomy, then a rule that respects my right to decide is justifiable to me by appeal to my values, even if the outcome it produces is one I rank lower than some other hypothetical state. In the Prude and Lewd case, the outcome Lewd Reads is indeed Pareto-dominated by Prude Reads, but getting to Prude Reads would require overriding Prude's decisive power over whether he reads, because Prude prefers Nobody Reads to Prude Reads. If you force Prude to read to achieve the Pareto improvement, you have violated his liberal right, and thus you have violated a value he holds (his liberty). So the rule respecting rights is justifiable by appeal to their values of autonomy, even if it isn't justifiable by appeal to their preferences over outcomes alone. Your flatmate's argument only works if you assume beforehand that outcome satisfaction trumps autonomy, which is precisely what the concept of rights as trumps is supposed to deny.

  This connects directly to the hint you had about the shift between rights as claims about outcomes versus control over decisions. In Sen's formal model, a right is modeled as decisiveness over pairs of outcomes, which makes it look like the social planner is selecting a state from a menu. But in reality, rights are often understood as protecting a sphere of control or a game form where individuals make choices. If you view rights as control, then the alternative outcome Prude Reads is not actually available in the relevant sense unless Prude chooses it. Since Prude prefers Nobody Reads to Prude Reads, he will not choose it voluntarily. The outcome Lewd Reads emerges from the interaction of two people exercising their protected choices, not from a planner imposing a bad outcome. Your flatmate treats the Pareto-superior state as a live option that is being blocked by the rights, but if rights define the boundaries of feasible action, then that state is only feasible if someone violates a right. By treating the Pareto-superior state as a standard for justification without acknowledging the rights-violation required to reach it, Premise (2) begs the question against liberalism.

  You were also worried about Premise (4), the idea that meddlesome preferences can arise around any personal sphere, like your neighbor hating your purple house. You felt slippery about saying those preferences shouldn't count. The solution isn't to draw a shaky line between meddlesome and legitimate preferences, which is indeed difficult, but to insist that rights function by excluding certain preferences from the social calculus regardless of their intensity or legitimacy. That is what it means for a right to be a trump; it removes the issue from the utilitarian aggregation entirely. If your neighbor prefers you not to paint your house purple, that preference exists, but if you have a right to paint your house, that preference is not allowed to veto your choice. Your flatmate's argument assumes that if enough preferences stack up, they should override the right, but that is just a restatement of utilitarianism. To keep rights, you have to accept that there are some cases where the aggregate preference is clear, but the right holds anyway. This costs you the comfort of knowing that society is always moving toward the most preferred aggregate outcome, but it buys you the protection of individual sovereignty.

  So the diagnosis is that your flatmate's argument is valid but unsound because Premise (2) assumes a consequentialist metric of justification that is incompatible with the deontological nature of rights. If you drop the assumption that Pareto inefficiency implies unjustifiability, the rest of the chain collapses. You can keep Premise (1) as the formal theorem, and you can keep Premise (3) about rights needing justification, but you must insist that the justification appeals to values of agency and process, not just outcome satisfaction. This means accepting that a system of rights will sometimes lock us into Pareto-inferior outcomes, not because the system is broken, but because the protection of liberty is valued higher than efficiency in those specific instances. Your flatmate's conclusion that rights are just revocable permissions follows only if you agree that efficiency is the ultimate master, but if you believe rights are trumps, then efficiency is the thing that gets revoked when it conflicts with liberty.

  Does this patched argument still prove something interesting? Yes, it proves that you cannot have it both ways: you cannot be a thoroughgoing welfarist who believes only outcomes matter and also a liberal who believes individuals have inviolable spheres of control. Sen's theorem is actually a proof that welfarism is incomplete, not that liberalism is impossible. It forces us to admit that our social evaluation must include non-welfarist information, like rights and entitlements, rather than just preference orderings. So you don't have to give up on your religion or your relationships being yours on anything less than sufferance; you just have to accept that defending them requires rejecting the idea that everyone's preferences about your life should count equally in a social lottery. The paradox doesn't show rights are illusions; it shows that preference satisfaction is not the only thing that matters.

  I hope this helps untangle the dinner conversation, because it is genuinely one of the deepest puzzles in political philosophy, and feeling torn by it means you are taking it seriously. Let me know if you want to grab coffee and walk through the game-form interpretation again, because distinguishing between the outcome set and the feasible set under rights is the technical move that saves the liberal intuition.

  Best,
  Your Friend
