  **APPENDIX 14-B: COGNITIVELY IMPAIRED HIGHWAY NAVIGATION**

  **§1. Pre-Departure Randomization.**
  Licensees certified under Condition AM-Δ must determine their exit strategy prior to vehicle ignition. Using a state-issued binary device, the driver shall generate a "Continue" signal with probability $p=2/3$ and an "Exit" signal with probability $p=1/3$. This determination is binding for all intersections encountered. Flipping the coin at an intersection is prohibited.

  **§2. Indistinguishability Protocol.**
  Drivers shall not attempt to distinguish exits via odometer, signage, or elapsed time. The Department defines Exits A and B as legally identical. Conditioning behavior on perceived location is a Class B misdemeanor, as belief updates regarding "which intersection this is" alter the probability structure required for §1 compliance.

  **§3. Agency Continuity.**
  The driver at Exit A and the driver at Exit B are the same legal agent. Strategies maximizing utility at a specific intersection (e.g., exiting because "I am likely at B") are void if they contradict the ex-ante plan established in §1. The Department does not recognize temporal selves as distinct entities entitled to revised strategies.

  **§4. Prohibition on External Memory.**
  Writing notes on limbs, dashboards, or navigation systems is illegal. Such aids violate the medical certification requirements. A driver who remembers they passed Exit A is no longer certified to drive this route.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Why not simply plan to exit at the second intersection?**
  A: Under perfect absent-mindedness, the plan "Exit at Second" yields a payoff of 0 (executed at the first). The randomized policy (§1) yields an expected utility of 1.33. The deterministic plan is optimal only for drivers with functioning memory.

  **Q: Why is the probability exactly 1/3?**
  A: This value maximizes the expected return function $U = 4p(1-p) + 1(1-p)^2$. Deviating reduces state-wide safety efficiency.

  **SAMPLE WRITTEN EXAM QUESTION**

  **Q:** You approach an indistinguishable exit. Your memory is blank. A normal driver would continue to find the second exit (Payoff 4). What is the correct action?
  **A:** Exit with probability 1/3. (Note: This yields an expected payoff of 1.33, which is strictly lower than the payoff available to a driver with functioning memory, but is the maximum achievable under Condition AM-Δ.)
