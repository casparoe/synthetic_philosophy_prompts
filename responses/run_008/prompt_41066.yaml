      *   *Focus:* The definition of "Preference." If preference = choice disposition, EU is tautological. If preference = mental state, EU is empirical/false. If preference = normative ideal, EU is circular. This trilemma is the real wall.
      *   *The "Physicist" angle:* In physics, $F=ma$ is a law. In DT, $EU = \sum p_i u_i$ is a definition of a coherent agent. The dispute is whether "being a coherent agent" is the only way to be rational.

  9.  **Finalizing the "Progress" section:**
      *   Don't suggest more experiments (behavioral econ already did this).
