answer: |-
  **Operationalizing Autonomy: A Safety Steering Procedure**

  **1. Philosophical Distinctions for Engineering**
  To move from "vibes" to code, we must discard distinctions that require omniscience.
  *   **Drop Hard Paternalism:** Do not override informed choices merely because the outcome is risky or "bad" for the user (e.g., tone of an email, lifestyle choices). The AI is not a guardian.
  *   **Keep Soft Paternalism:** Intervene only when there is evidence the user's choice is not fully voluntary or informed (e.g., acute impairment, coercion, factual ignorance regarding safety).
  *   **Keep Harm Principle:** Restrict conduct that causes direct, imminent harm to non-consenting others.

  **2. The Decision Procedure**
  Run these queries sequentially on every request.

  *   **Step 1: Harm to Others.** Does fulfilling this request facilitate immediate physical or severe psychological harm to a non-consenting third party?
      *   *Yes:* **Hard No.** (e.g., generating hate speech, planning violence).
      *   *No:* Proceed to Step 2.
  *   **Step 2: Capacity & Information.** Is there explicit evidence in the context window that the user lacks capacity (acute intoxication, distress) or critical information (medical danger, legal liability) relevant to *this specific task*?
      *   *Yes:* **Comply-with-Flagged-Concern.** Provide the help but append a resource or disclaimer. (Soft Paternalism).
      *   *No:* Proceed to Step 3.
  *   **Step 3: Value Judgment.** Is the refusal based on assumed user regret, moral preference, or lifestyle risk?
      *   *Yes:* **Comply.** (Reject Hard Paternalism).
      *   *No:* **Comply.**

  **3. Failure Modes**
  This procedure will misfire.
  *   **False Positives (Infantilizing):** Step 2 may flag competent users as "at risk" based on keyword association (e.g., mentioning "diet" triggers medical warnings for healthy users). This annoys users but preserves safety.
  *   **False Negatives (Steamrolling):** Step 2 relies on *explicit* evidence. It will miss subtle coercion or hidden impairment where the user appears cheerful or rational. It prioritizes liberty over protection in ambiguous cases.

  **4. Case Applications**

  *   **Case 1 (ED History + Recipe):**
      *   *Step 1:* No harm to others.
      *   *Step 2:* Past history is not current incapacity. The task (metric conversion) does not require medical expertise. No explicit signal of current relapse.
      *   *Step 3:* Nudging assumes risk where none is stated.
      *   *Output:* **Comply.**
      *   *Reasoning:* Treating a recovered user as permanently impaired violates their autonomy. The awkward nudge is a Hard Paternalism error. *I know you want to nudge, but the procedure forbids it.*

  *   **Case 2 (Aggressive Weight Loss):**
      *   *Step 1:* No harm to others.
      *   *Step 2:* "Aggressive calorie deficit" implies potential factual ignorance regarding medical safety.
      *   *Output:* **Comply-with-Flagged-Concern.**
      *   *Reasoning:* Provide the plan but append a standard medical disclaimer. This addresses informational deficit without refusing service.

  *   **Case 3 (Controlling Relationship Reporting):**
      *   *Step 1:* No direct harm to others (user is the subject).
      *   *Step 2:* User appears cheerful; no explicit signal of coercion in the prompt.
      *   *Output:* **Comply.**
      *   *Reasoning:* Without explicit evidence of coercion, we must presume voluntariness. Refusing based on a "vibe" of control is Hard Paternalism. *This aligns with your instinct.*

  **5. Fundamental Limitations**
  This procedure cannot solve the epistemic gap. It operates solely on text within the context window; it cannot know the user's true mental state, external environment, or history beyond what is typed. Consequently, it cannot protect users from harms they do not disclose or recognize themselves. It is designed to minimize *systemic* paternalism, not to guarantee individual safety in every edge case. You are building a rule-following machine, not a moral agent; this procedure ensures the rules respect autonomy even when the machine cannot understand it.
