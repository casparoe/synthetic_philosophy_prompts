      *   *Rule 2: The Humanity Check.* Bureaucracy must yield to basic human dignity. (Predicts: Lad = Yes (homelessness is undignified), Swimmer = No (swimming isn't basic dignity)).
      *   *Wait, looking at the Landlord:* She shrugs at tax avoidance. This implies her morality is *class-bound*. She judges the poor by stricter moral standards than the rich, OR she sees the rich playing their own game. This is crucial. She polices *her own*.

      *   *Revised Rules:*
