      *   Split Case: Someone doing economically unproductive work (volunteering) but facing a sanction. Does she support the volunteering (Effort) or the sanction (Rule)?
      *   Let's refine the "Settling Case" to be: A claimant sanctioned for volunteering full-time instead of job hunting.
          *   Rule 1 (Productivity): Volunteering isn't paid work. Sanction stands.
          *   Rule 2 (Contribution/Value): Volunteering is socially valuable. Sanction wrong.
          *   This tests if she values *money* or *social worth*.

  8.  **Review against constraints:**
      *   British English.
      *   Structure exactly as requested.
