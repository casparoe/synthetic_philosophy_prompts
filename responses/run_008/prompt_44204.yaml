      *   **Tone:** Don't be precious, show reasoning.

  2.  **Deconstruct Denise's Morality:**
      *   *Core Theme:* Effort vs. Honesty vs. Need.
      *   *Single Mum (Cash-in-hand):* Survival necessity trumps strict legality. Effort is being made to survive.
      *   *Able-bodied Bloke (Playing system):* Contempt for those who *can* work but choose not to, especially if boastful. Lack of effort/integrity.
      *   *Back Pain Exaggerator:* Dishonesty is a sin. Faking need is worse than needing help.
      *   *Woman Sanctioned (Kid in Hospital):* Compassion for genuine life crises. Bureaucracy should bend for humanity.
      *   *Carer (Nursing Mother):* Socially valuable work counts as "work". Care is a valid contribution.
      *   *Landlord (Tax Avoidance):* Interesting outlier. "Not her department." Suggests her scope is limited to the working class/poor. She judges peers, not the powerful. Or she sees tax avoidance as "smart" vs. benefits fraud as "stealing".

      *   *Synthesis:* Denise values *effort* and *honesty* within the context of *survival*. She hates exploitation of the system but supports using the system to survive genuine hardship. She distinguishes between "can't/won't due to care/survival" and "won't due to greed/laziness".

  3.  **Analyze New Cases:**
      *   *Case 1 (Channel Swimmer):* Able-bodied. Disciplined (effort), but not towards employment. Funded by benefits. No job apps.
