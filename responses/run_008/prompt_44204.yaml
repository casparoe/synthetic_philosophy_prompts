      *   *Settling Case:* Needs to challenge the "Valid Struggle" definition. What if the struggle is self-imposed but morally good? (e.g., Conscientious objector? Artist?) Let's go with an artist on benefits who actually sells work but claims top-up.

      *   *Wait, let's look closer at the Landlord.* Why does she shrug? "Not her department." This suggests she accepts the system is rigged for the rich, but demands integrity from the poor. This is a very specific, class-conscious morality.
      *   *So Rule 1:* Integrity within your station.
      *   *Rule 2:* Compassion for genuine need vs. contempt for exploitation.

      *   *Settling Case:* A rich person claiming benefits they are entitled to vs. a poor person doing the same. Or, a poor person using benefits to train for a job (like the swimmer but for a trade).
      *   *Let's try:* A claimant refusing a job to care for a *healthy* child vs. a claimant refusing a job to retrain.
      *   *Actually, the prompt asks for a case that splits the rules.*
      *   Rule A: "Effort must be economically productive." (Swimmer fails).
