answer: |-
  'Her two verdicts'
  On the swimmer, she'll be cold. 'Discipline's wasted if it's not for a wage. Swimming the Channel doesn't put food on the table, does it? He's treating the state like a sponsor. Tell him to get a job first, swim after.' She won't report him, but she won't bring him tea.

  On the lazy lad, she'll be shirty but practical. She'll open the door, sniff at the smell, and say, 'You've made your bed, love. Doesn't mean you sleep in the gutter.' She'll feed him and make calls to housing, but she'll make him scrub the floors before he eats. 'We help people, not habits. You want the habit? Go back outside.'

  'The candidate rules'
  **Rule 1: The Integrity of Need.** Benefits are for survival and care, not self-actualisation. This explains the single mum (survival) and the carer (care) versus the back-pain liar (dishonesty) and the system-player (greed).
  *Prediction:* The Swimmer fails (self-actualisation). The Lad passes the initial help (survival need is now genuine), but fails the moral test.

  **Rule 2: The Proportionality of Punishment.** The system must not destroy a person for human error. This explains defending the mum with the sick kid.
  *Prediction:* The Swimmer is irrelevant here. The Lad passes—losing a flat for missed appointments is disproportionate, warranting intervention despite his laziness.

  **Rule 3: The Class Boundary.** She polices her own; the wealthy play a different game. This explains the landlord shrug.
  *Prediction:* Both new cases are working class, so full moral scrutiny applies. Neither gets the 'not my department' pass.

  'My best guess'
  Denise is really running on **The Integrity of Need**, with Proportionality as a safety valve. She believes welfare is a contract: society pays, you contribute or survive. The swimmer breaks the contract; the lad broke it but is now in survival mode. The wiggle room is the landlord—it suggests she knows the contract is rigged for the rich, so she stops policing where she has no power. She's not blind to class; she's just focused on keeping dignity intact within her own sphere.

  'The settling case'
  Save a case where a claimant is sanctioned for **volunteering full-time** instead of job hunting.
  *Rule 1 (Need/Contract)* predicts she'd disapprove (no wage, breaking the job-seeking contract).
  *Rule 2 (Contribution/Dignity)* predicts she'd support them (socially valuable work, maintaining dignity).
  This splits whether she values *paid labour* specifically, or *social contribution* generally. If she defends the volunteer, she's a moralist; if she condemns them, she's a bureaucrat at heart.
