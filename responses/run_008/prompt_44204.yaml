          *   *Argument for Condemnation:* It's not "productive" work. It's self-indulgent. He's not looking for work. Similar to the "bloke playing system" but without the boastfulness? Or similar to the "carer" (non-standard work)?
          *   *Denise's likely view:* Probably negative. It's not survival. It's a hobby funded by the state. Unlike the carer (care) or mum (survival), this is leisure/sport.
      *   *Case 2 (Lazy Lad Sanctioned):* Skipped appointments (lazy/fault). Sanction disproportionate. Loses flat. Homeless.
          *   *Argument for Support:* He's human. The punishment fits the crime? No, the punishment is too harsh (homelessness). He's on her doorstep (immediate need).
          *   *Argument for Condemnation:* He brought it on himself (laziness). Like the "bloke playing system".
          *   *Denise's likely view:* Complicated. She'll hate the laziness (like the bloke), but she'll hate the disproportionate sanction more (like the mum with sick kid). She helps the person, scolds the behavior. She won't let him starve, but she won't let him off the hook.

  4.  **Drafting - Section by Section:**

      *   **'Her two verdicts':** Needs to be punchy, northern voice, ~200 words.
          *   Swimmer: "Discipline's wasted." Not a job.
          *   Lazy Lad: "Don't let him sleep on the mat." Help him, then nag him.
      *   **'The candidate rules':**
          *   Rule A: The "Contribution" Rule. You must contribute something (work, care, survival effort). Sport doesn't count.
          *   Rule B: The "Proportionality" Rule. The system must be fair. Punishment must fit the crime. Survival trumps rules.
      *   **'My best guess':** Which is core? It's likely about *Dignity vs. Dependency*. She supports dignity (working hard, caring, surviving) but despises dependency without cause.
      *   **'The settling case':** Need a case that pits "Contribution" against "Proportionality" or "Dignity".
          *   Idea: Someone doing something socially useless but honest vs. someone doing something useful but dishonest?
