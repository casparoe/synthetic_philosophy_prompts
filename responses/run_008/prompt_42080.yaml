  **FOR IMMEDIATE RELEASE**

  **MINISTRY OF EQUAL OUTCOMES ANNOUNCES SUCCESSFUL IMPLEMENTATION OF LEVELING-DOWN INITIATIVE**

  **CAPITAL CITY, REPUBLIC OF VERIDIA** — The Ministry of Equal Outcomes today confirmed the full enactment of the Leveling-Down Initiative, a landmark policy designed to eliminate socioeconomic disparity through comprehensive welfare adjustment. Following a comprehensive review, the Ministry reports that while aggregate welfare has decreased across all demographics, variance has been reduced to zero. All citizens are now equally worse off.

  Minister Elara Vance expressed pride in the achievement during a morning briefing. "We recognize that no individual is materially better off than they were prior to the initiative," Vance stated. "However, we must distinguish between what is better for people and what is better *simpliciter*. Inequality is intrinsically bad. Therefore, removing it constitutes a moral gain, even if that removal involves no benefit to any particular person."

  Vance addressed the specific trade-offs involved in the new distribution matrix. "Consider two societies," she explained. "In Society A, the worst-off have 5 units of welfare and the best-off have 6. In Society B, everyone has 4 units. Critics ask why we chose B. We maintain that while A is better regarding total welfare, B is better in one specific respect: the egalitarian respect. The disappearance of the gap between 5 and 6 is itself a value achievement. To deny this is to deny that inequality is bad in itself."

  **FAQ: CITIZEN IMPACT STATEMENTS**

  **Q: What have I personally gained from this policy?**
  **A:** You have gained the disappearance of a comparative relationship. Previously, you stood in an objectionable relation of inequality to your neighbors. That relation no longer exists.

  **Q: But my welfare units decreased.**
  **A:** Correct. However, the impersonal value of equality has increased. The state of affairs is more fitting, even if no subject experiences an improvement.

  **Q: Is society all-things-considered better?**
  **A:** The Ministry maintains that equality is one value among several. While welfare values decreased, equality values increased. The net calculation depends on your weighting, but the egalitarian gain is undeniable.

  **ANNEX: STATEMENT OF RESIGNATION**

  **From:** Dr. Aris Thorne, Outsourced Priority Consultant
  **To:** Ministry Leadership

  I am resigning effective immediately. My contractual obligation was to advise on distribution-sensitive justice, but this initiative violates the core prioritarian constraint. What matters morally is benefiting people, with greater weight given to those who are worse off. It does not matter whether some are worse off than others.

  An across-the-board loss cannot register as an improvement. By focusing on relative positions rather than weighted absolute benefits, the Ministry has optimized a relation at the expense of the relata. I cannot certify this as justice.

  ### # #

  **Media Contact:**
  Press Office, Ministry of Equal Outcomes
  Email: press@equaloutcomes.gov.ver
  Phone: 555-0199

  ***

  **Note on Philosophical Liberties**

  The piece treats telic egalitarianism as the Ministry's sole operating logic, whereas real proponents (e.g., Parfit, Temkin) view it as one *pro tanto* value among others. The satire leans into the bureaucratic tendency to maximize a single KPI to highlight the absurdity of the "one respect" claim. The Minister's "one respect" framing accurately reflects the standard telic defense against the Leveling-Down Objection (LDO): conceding the all-things-considered loss while insisting on the intrinsic badness of inequality.

  The Prioritarian annex correctly identifies the escape route: prioritarians care about weighted absolute gains, not relations. However, I simplified the person-affecting claim. Strict prioritarianism can be impersonal (valuing weighted outcomes), but it avoids the LDO because leveling down lowers the weighted sum. The annex implies a person-affecting view ("benefiting people"), which is often the motivation for prioritarianism but not strictly necessary for the view to avoid the LDO. The dialectic is sound: the LDO bites telic egalitarianism specifically because it separates equality from benefits, whereas prioritarianism ties them back together.
