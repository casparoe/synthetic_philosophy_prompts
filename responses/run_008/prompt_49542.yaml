  3.  **Evaluate the Core Concepts (The "Fragility"):**
      *   **Common Priors:** This is the big one. The theorem assumes we started with the same probability estimates before seeing any evidence. If I think the world is generally kind and you think it's generally cruel, we can see the same data and disagree. Aumann assumes we don't.
      *   **Common Knowledge:** It's not enough that I know my info and you know yours. I have to know that you know, and you have to know that I know, infinitely. In the real world, we rarely know *exactly* what information the other person has.
