      *(Self-Correction on the "Same Information" point)*: Actually, looking at the editor's text: "If you and I have the same information... we have to end up with the same beliefs." This is trivially true for anyone, rational or not. Aumann's theorem is stronger: Even if we have *different* information, if we know each other's beliefs, we must agree. The editor's summary weakens the theorem to a tautology. I need to point this out.

