prompt: |-
  I'm a novelist and I've just finished a draft of a book that ends about as badly as it can for the main character -- she loses her son, her marriage collapses, and the last scene is her alone in the kitchen where she used to cook for him. Early readers keep telling me it wrecked them, cried for hours, and then in the same breath that it was "beautiful" and they "loved it." My agent says lean into it, make the ending even more brutal. My partner thinks this is a bit twisted, honestly -- that we're basically getting off on watching a fictional woman suffer, and that I'd be a sadist if I wrote it as a screenplay with a real actress instead.

  I'm now genuinely confused about what I'm even doing when I revise for emotional impact. Am I trying to make people suffer? That seems nuts. But if the suffering is somehow the point of the pleasure, then... what exactly is going on there? And does the fact that readers willingly seek out grief they'd run a mile from in real life tell me anything about what I should do in the redraft -- e.g. should the ending be "earned" somehow, and what would that even mean?

  Sorry for the rambling, this has been bugging me for weeks. Please answer in British English (I'm in Edinburgh and "gotten" makes me flinch).
