answer: |-
  First, take a deep breath. It is entirely sensible that you are feeling conflicted. You are standing squarely in the middle of the oldest debate in aesthetics: the paradox of tragedy. Why do we pay money to feel terrible? If you were actually causing harm, your partner would be right to call you a sadist. But you are writing fiction. The distinction matters.

  Here is what is likely happening, broken down into the ethics, the psychology, and the craft.

  ### 1. Sadism vs. Witnessing
  Your partner's point about the actress is a brilliant ethical check. If you were directing a real person to endure genuine distress for an audience's enjoyment, that would be exploitative. But fiction is a simulation. No one is actually hurting.

  When readers say your book is "beautiful" despite the devastation, they are not enjoying the character's pain in a voyeuristic sense. They are experiencing **catharsis**. In real life, grief is chaotic, isolating, and often silenced. We are told to "keep calm and carry on," or to move on. In your book, you are giving that grief space. You are validating it.

  Readers aren't saying, "I love that she suffered." They are saying, "I love that someone finally told the truth about how much this hurts." You are not a sadist inflicting pain; you are a witness acknowledging it. There is a profound difference between *inflicting* suffering and *honouring* it.

  ### 2. The Agent's Advice: "Make it Brutal"
  Agents are commercially minded. When your agent says "make it more brutal," they usually mean "do not shy away from the emotional truth." They are warning you against a "soft" ending that might feel unearned or comforting when the story demands honesty.

  However, take this advice with a pinch of salt. There is a genre often derided as "misery porn," where suffering is piled upon suffering simply for shock value. If you add brutality for the sake of brutality, you risk tipping from tragedy into exploitation. The goal isn't to destroy the character; it's to reveal who she is when everything is stripped away.

  ### 3. What Does an "Earned" Ending Mean?
  You asked if the ending needs to be "earned." Yes, absolutely. But "earned" does not mean "deserved." In tragedy, the character rarely deserves their fate.

  An ending is earned when it feels **inevitable**.
  *   **Inevitability:** Does the collapse of her marriage and the loss of her son follow logically from the themes and choices established earlier? Or does it feel like the author reached in with a pair of tongs to smash things up?
  *   **Meaning:** Is there a shift in understanding? Even if she is alone in the kitchen, has her internal landscape changed? If she is exactly the same person she was on page one, just sadder, that is merely depressing. If she has gained a terrible clarity, or a new kind of strength in her survival, that is tragic beauty.
  *   **Respect:** Are you treating her with dignity in her suffering? Sadism laughs at the fall; tragedy mourns it. Ensure your prose treats her pain with reverence, not relish.

  ### 4. Why Readers Seek Grief
  You asked what it tells you that readers seek out grief they'd avoid in real life. It tells you that fiction is a safe container for dangerous emotions. In real life, a friend's grief can be overwhelming; we don't know what to say. In a book, we can sit with that pain without having to fix it. We can process our own fears about loss without being in actual danger.

  When they say they "loved it," they mean the *experience* was transformative. They feel cleansed.

  ### 5. How to Approach the Redraft
  Here is my suggestion for navigating this revision without losing your moral compass:

  *   **Ignore the word "Brutal":** Instead, aim for "Unflinching." Do not look away from the pain, but do not amplify it gratuitously. If the scene in the kitchen is honest, it will be devastating enough without adding another layer of tragedy.
  *   **Listen to the word "Beautiful":** This is the crucial data point. Why did they find it beautiful? Likely because there was dignity in her solitude. Lean into that dignity. Show her making a cup of tea. Show her breathing. Show her surviving. Survival can be as powerful as death.
  *   **Check the Agency:** Even in loss, does she have agency? Is she purely a victim of circumstance, or does she make choices that lead her to that kitchen? Tragedy hits harder when the character participates in their own downfall, even unintentionally.
  *   **The Partner Test:** Keep your partner's concern in mind as a guardrail. If a scene feels like you are kicking the character when she is down just to make the reader cry, cut it. If the scene is there because it is the honest truth of where the story must go, keep it.

  ### Summary
  You are not trying to make people suffer. You are trying to make them feel less alone in their suffering. That is a noble aim.

  If you revise with empathy rather than cruelty, you will be fine. Trust the readers who called it "beautiful." They have identified the art in the pain. Your job in the redraft is not to deepen the wound, but to deepen the understanding of it.

  Good luck with the revision. It sounds like you have written something powerful, even if it costs you a bit of sleep to get there.
