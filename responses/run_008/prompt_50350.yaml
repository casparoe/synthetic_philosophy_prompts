  **Oakhaven University Dissolves Chemistry Department After Determining It Is 'Nothing But' Physics**

  OAKHAVEN, OH—In a bold move toward ontological efficiency, Oakhaven University administrators have formally dissolved the Department of Chemistry, reclassifying its faculty as "Implementation Staff" reporting directly to the Department of Physics. The decision follows a strategic review concluding that chemical phenomena are "nothing but" complex physical interactions, rendering a separate administrative structure redundant.

  Provost Martin Gleason framed the merger as the culmination of the Unity of Science project. He promised that the administration would deliver Nagel-style bridge laws connecting thermodynamic quantities to statistical mechanics by the end of the fiscal year. "Until those derivations are finalized, we are quietly reclassifying the wetness of water as a figure of speech pending reduction," Gleason told reporters. "We cannot budget for macroscopic properties that do not fundamentally exist at the particle level."

  Dean of Sciences Sarah Miller cited causal exclusion as grounds for removing "redundant" higher-level explanations from the university's explanatory portfolio. "If the physical level is already doing all the causal work, why pay for a department describing the same events in a different vocabulary?" Miller asked. "It's explanatory inflation. We are streamlining the causal chain."

  The restructuring also treated supervenience as a staffing model. Budget Analyst David Chen noted that since chemical facts supervene on physical facts, no additional supervisory layer was required. "If the base layer fixes the upper layer, we only need to fund the base," Chen said. Meanwhile, Associate VP for Operations Linda Kress wondered aloud why, if multiple realizability is real, the university cannot simply outsource molecular bonding to whichever department realizes it most cheaply. "If a bond is just a state realized by physics, can't Engineering do it for less? Or perhaps a vendor in procurement?"

  Former chemistry faculty objected that while reduction might succeed in principle, the physical microstates and boundary conditions are individually vast and unspecified, making the reduction unusable for anything the department actually does. "You can't run a titration by solving the Schrödinger equation for Avogadro's number of particles," said Dr. Alan Reed, now Senior Physical Implementation Specialist. "The autonomy of special-science explanations isn't a luxury; it's a computational necessity. We deal with effective theories because the fundamental ones are too big to hold in a human head."

  When Emeritus Professor Harold Vance pointed out that the whole episode was an administrative misreading of P.W. Anderson's famous 1972 essay arguing that successively higher levels of science are not merely applied versions of the levels beneath them, administrators responded by applauding him for his commitment to interdisciplinarity. They presented him with a plaque recognizing his efforts to bridge the gap between physics and its implementation staff.

  "They've confused ontological dependence with explanatory utility," said Dr. Elena Corves, a concerned philosopher of science on the faculty. "You can derive the gas laws from mechanics, but that doesn't tell you why the boiler exploded. Something is lost in the translation, even if nothing is lost in the territory."

  At press time, the Physics Department chair accepted the additional headcount but noted that the promised bridge laws were still awaiting computational resources, leaving staff in limbo between levels of description, waiting for a derivation that might arrive just after the budget cycle closes.
