answer: |-
  This is a fantastic reconstruction of a dinner conversation. Your instincts are sharp: your friend got the famous framework right but botched the specific argument about value and definition. She has conflated Nelson Goodman's analytic ontology with a more romantic, intuitive moralism about art.

  Here is a claim-by-claim breakdown of what she said, how a philosopher of art would judge it, and how you can use this to navigate the next dinner.

  ### Claim 1: "Goodman splits the arts into two kinds... autographic... and allographic."
  **Verdict: Accurate.**
  This is the core contribution of *Languages of Art* (1968).
  *   **The View:** Goodman argues that arts are distinguished by how we identify the "work." In **allographic** arts (music, literature, dance), there is a notation system (a score, a text). If you play the right notes, it *is* Beethoven's 5th, regardless of which piano or paper you use. In **autographic** arts (painting, sculpture), there is no notation. The history of production matters. Even if you paint a canvas molecule-for-molecule identical to a Rembrandt, if you painted it yesterday, it is not a Rembrandt.
  *   **Dinner Strategy:** Concede this point. It is the strongest part of her summary and establishes her credibility. You can say, "Your setup on autographic vs. allographic is spot on; that's the part that holds up."

  ### Claim 2: "In music you can't forge a work... the worst you can do is plagiarize it."
  **Verdict: Acceptable Simplification.**
  *   **The View:** For Goodman, because the identity of a musical work is determined by compliance with the score, a "forgery" in the ontological sense is impossible. If the notes are right, it is an instance of the work. If you claim you *composed* those notes, you are plagiarizing (lying about authorship), but you aren't creating a fake instance of the work in the way a fake painting is a fake instance.
  *   **Nuance:** Some philosophers push back here (e.g., regarding performance practice), but for a dinner conversation, this is standard Goodman.
  *   **Dinner Strategy:** Let this pass. It doesn't affect the Van Meegeren argument.

  ### Claim 3: "A forgery is by definition a copy."
  **Verdict: Misreading.**
  This is where your specific objection about Van Meegeren comes in, and you are absolutely right to flag it.
  *   **The View:** Goodman does not define forgery as "copying a specific existing object." He defines it as **misrepresenting the history of production.** A forgery is an object that falsely claims to have a specific history (i.e., "painted by Vermeer in 1650").
  *   **The Van Meegeren Factor:** Van Meegeren did not copy *The Girl with a Pearl Earring*. He painted new compositions in Vermeer's style. Under your friend's definition ("forgery = copy"), Van Meegeren's work wouldn't count as forgery. Under Goodman's actual definition, it is the *perfect* example of forgery because the history of production was faked.
  *   **Dinner Strategy:** This is your opening wedge. "You said forgery is defined as a copy, but Van Meegeren didn't copy specific Vermeers; he painted new scenes in Vermeer's style. Goodman actually defines forgery as faking the *history of production*, not copying a specific canvas. So Van Meegeren fits Goodman's view, but not your definition."

  ### Claim 4: "He proved why the original always beats the forgery aesthetically... a copy is always a lesser creative achievement."
  **Verdict: Major Misreading.**
  This is the most philosophically contentious claim she made, and your intuition that this is a "separate fight" is correct.
  *   **The View:** Goodman does **not** argue that the original is *intrinsically* or *necessarily* aesthetically superior. His argument is epistemic and perceptual. He argues that *knowing* a work is a forgery changes how we look at it. Even if a forgery is indistinguishable from the original today, we know that if we looked close enough, we might find differences. Therefore, we look at the original and the forgery differently. The original becomes a different aesthetic object than the forgery because the history of production is a property of the work.
  *   **The "Separate Fight":** You are remembering the famous debate between Goodman and **Alfred Lessing**. In 1965 (just before Goodman's book), Lessing published an essay called *"What is Wrong with a Forgery?"* Lessing argued exactly what you suspected: if the forgery looks identical to the original, it has the same aesthetic merit. The moral crime is fraud, not bad art. Goodman disagrees, arguing that in autographic arts, the history *is* part of the aesthetic identity.
  *   **The Error:** Your friend claims Goodman *proved* originals are better. He didn't. He argued they are *different* objects, and that our knowledge of their origin alters our aesthetic experience. He never claims a forgery can't be visually stunning or creatively achieved.
  *   **Dinner Strategy:** "Goodman doesn't actually claim the original is necessarily better. He claims they are different objects because the history matters. The argument you're thinking of—that forgeries are inherently worse—is actually Alfred Lessing's counter-argument. Goodman just says we perceive them differently once we know the truth."

  ### Claim 5: "When the art market pays millions... what it's actually tracking is Goodman's point that the original is always the better art."
  **Verdict: Does Not Survive Correction.**
  Because the premise (that Goodman proved originals are aesthetically superior) is false, the conclusion about *why* the market values provenance collapses.
  *   **The Correction:** If we accept Goodman's actual view, the market isn't paying for "better art" in a vacuum; it is paying for **ontological authenticity** and **scarcity**.
      *   **Ontology:** In autographic arts, the "work" is tied to the specific physical object created by the artist. A Van Meegeren is ontologically a Van Meegeren, not a Vermeer. The market pays for the Vermeer because they want the object with that specific history.
      *   **Scarcity:** Vermeers are rare; Van Meegerens are less rare.
  *   **Why it matters:** If the market were tracking "aesthetic superiority," a stunning Van Meegeren that fooled experts for decades should retain its value even after being exposed (since the paint didn't change). But its value crashes. Why? Because the *identity* of the work changed, not necessarily its visual quality. The market values the *name* (the history), not just the *look*.
  *   **Dinner Strategy:** "The market crash on a revealed forgery proves your point wrong. The paint didn't change, so the 'aesthetic quality' didn't change. What changed was the provenance. The market tracks authenticity and scarcity, not aesthetic superiority. If it were about quality, the Van Meegerens would still be worth millions because they are beautiful paintings."

  ### Summary for Your Dinner Debate

  You are in a strong position. Your friend used Goodman's vocabulary but filled it with common-sense intuitions that Goodman actually complicated. Here is your cheat sheet:

  1.  **Concede the Framework:** She is right about Autographic vs. Allographic. That is Goodman 101.
  2.  **Correct the Definition:** Forgery isn't "copying"; it's "faking the history of production." This saves the Van Meegeren example (which she thought supported her, but actually supports your correction).
  3.  **Challenge the Value Claim:** Goodman never proved originals are *better*. He argued they are *different* because our perception changes when we know the history. Mention Alfred Lessing as the philosopher who actually argued the "aesthetic value is the same" point.
  4.  **Reframe the Market:** Provenance tracks identity and scarcity, not aesthetic quality. If it tracked quality, exposed forgeries wouldn't lose their value.

  **The "Push Back" Line:**
  *"I think you're mixing up Goodman's ontological point with a moral intuition. Goodman doesn't say the original is better; he says the history of production is part of the work's identity. That's why the Van Meegeren lost its value when caught—not because it suddenly looked worse, but because it became a different object ontologically. The market pays for the history, not the aesthetic quality."*
