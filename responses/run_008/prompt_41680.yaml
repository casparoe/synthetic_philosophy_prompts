      *   *The "Copy" Definition:* The friend says "forgery is by definition a copy." Goodman defines forgery more about the *misrepresentation of history of production*.
      *   *Van Meegeren Point:* The user is right. Van Meegeren painted *new* compositions in Vermeer's style. They weren't copies of specific existing Vermeers. Goodman addresses this. For Goodman, a forgery isn't just a copy of a specific object; it's a work falsely attributed to an artist.
      *   *Aesthetic Value:* Goodman explicitly avoids saying the original is *always* aesthetically better. He says we perceive them differently because we look for differences. He famously says, "The question is not whether the forgery is as good as the original, but whether it is the same work." Wait, actually, his point is about *epistemic* access. If we know it's a forgery, we look for differences, and thus our aesthetic experience changes. He does *not* claim the original is objectively/necessarily better.
