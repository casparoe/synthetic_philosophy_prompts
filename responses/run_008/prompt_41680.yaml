  3.  **Evaluate Claim 1 & 2 (Autographic vs. Allographic):**
      *   *Fact Check:* This is the core of Goodman's distinction in *Languages of Art*.
      *   *Autographic:* History of production matters. A fake is possible even if indistinguishable. (Painting, etching).
      *   *Allographic:* Notation system exists. Identity is determined by compliance with the score/text. (Music, Literature).
      *   *Verdict:* Accurate. This is standard Goodman.
      *   *Nuance:* Goodman does say forgery in the strict sense doesn't apply to allographic arts because if it complies with the score, it *is* an instance of the work. Plagiarism is about authorship claim, not ontological status.
      *   *Rating:* Acceptable summary.

  4.  **Evaluate Claim 3 & 4 (Aesthetic Superiority & Definition of Forgery):**
      *   *Fact Check:* This is where the friend goes off the rails.
