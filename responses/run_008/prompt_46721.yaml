          *   Operator: Sane, competent, decent (by her own later lights).
          *   Intentions: Explicit, unambiguous, held at the time.
          *   Value Misalignment: Operator endorses the misalignment at reflection (intends it now, repudiates it later). Must be real and recurring (akrasia/compulsion/transient state).
