      2.  *The Stakes Objection:* Faction Two argues student government lacks the power to corrupt thought meaningfully. While we wield no police power, procedural integrity matters. If elected representatives fear censure for budget votes, deliberation becomes theater. The scale is small, but the principle of independent judgment remains vital to legitimacy.
      3.  *The Middle Path:* Faction Three identifies the core injury: the transfer of judgment. This recommendation adopts your logic. It allows candidates to run on shared platforms (association) but forbids binding elected members to those platforms under threat of sanction (coercion).

