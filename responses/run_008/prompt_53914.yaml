answer: |-
  Here is the **15-Minute Causal Audit**. It is designed to be printed single-sided and kept on the committee table. It translates the philosophical machinery (counterfactuals, INUS conditions, overdetermination) into operational checks without requiring the committee to agree on a metaphysics of causation.

  ### The 15-Minute Causal Audit

  **Purpose:** To distinguish between a coherent causal claim, a descriptive correlation, and a logical error in history senior theses.
  **Time Limit:** 15 minutes per chapter.
  **Users:** Historians and Scientists (no philosophy training required).

  ---

  #### Step 1: Pin the Claim (2 Minutes)
  Extract the specific causal sentence from the text. It must look like: *"Event/Condition C caused Outcome E."*
  *   **Stop Condition:** If the student writes "C influenced E," "C contributed to E," or "C was part of the context for E," **STOP**. This is not a causal claim; it is a descriptive claim. Grade on descriptive merit only. Do not proceed.
  *   **Proceed:** Only if the student explicitly uses "caused," "produced," "triggered," or "made inevitable."

  #### Step 2: The Absence Filter (Blind Spot Check) (2 Minutes)
  Is the alleged cause something that *did not happen* (e.g., "The lack of diplomacy caused the war") or a prevention (e.g., "The blockade prevented starvation")?
  *   **Verdict:** **FLAG AS BLIND SPOT.**
  *   **Instruction:** This procedure cannot evaluate causes defined by absences. Counterfactual logic chokes here. The committee must vote on this based on historical intuition alone. Note this limitation in the feedback paragraph.
  *   **Proceed:** Only if the cause is a positive event or existing condition (e.g., "The assassination," "The printing press").

  #### Step 3: The "But-For" Test (Counterfactual) (5 Minutes)
  Ask: *If C had not occurred, would E still have happened in roughly the same way and at roughly the same time?*
  *   **Yes (E would still happen):** The claim fails the strict "But-For" test. **Do not reject yet.** Proceed to Step 4.
  *   **No (E would not happen):** The claim passes the strict test. **Verdict: Coherent Causal Claim.** Proceed to Step 6 for grading nuance.
  *   **Unknowable/Speculative:** If the student admits the alternative history is pure guesswork, **Verdict: Mushy.** Downgrade clarity score.

  #### Step 4: The "Powder Keg" Test (Overdetermination/INUS) (3 Minutes)
  *Use this only if Step 3 failed (i.e., the outcome was likely anyway).*
  Ask: *Was C the specific spark that ignited a ready package of conditions?*
  *   **Philosophical Gloss:** This checks for **INUS conditions** (An **I**nsufficient but **N**ecessary part of an **U**nnecessary but **S**ufficient condition). Plain English: Was C the essential piece of a larger package that guaranteed the result?
  *   **Criteria:**
      1.  Were background conditions (alliances, tensions) already sufficient to cause E?
      2.  Did C occur *before* E?
      3.  Did C activate the background conditions?
  *   **Verdict:** If Yes to all three, **Verdict: Valid Trigger Claim.** The student must distinguish between "underlying cause" (the powder) and "proximate cause" (the spark). If they conflate them, downgrade precision.
  *   **No:** If C was just one of many equal factors without triggering a mechanism, **Verdict: Correlation, not Causation.**

  #### Step 5: The "Tide vs. Wave" Test (Diffuse Causation) (3 Minutes)
  *Use this for long-term structural claims (e.g., technology, economics).*
  Ask: *Is the student claiming C was a single event (Wave) or a structural shift (Tide)?*
  *   **Wave Claim:** "The printing press caused the Reformation." (Specific event).
  *   **Tide Claim:** "The spread of literacy caused the Reformation." (Structural shift).
  *   **Verdict:** If the student treats a Tide like a Wave (expecting a specific date/time), **Verdict: Category Error.** The claim is valid only if framed as enabling conditions, not triggering events. The student must explain the *mechanism* of transmission, not just temporal succession.

  #### Step 6: Final Verdict & Grading Logic
  Combine the results into a letter grade and a paragraph.
  *   **A (Coherent):** Passes Step 3 OR passes Step 4/5 with clear mechanistic distinction.
  *   **B (Mushy):** Passes Step 4/5 but conflates trigger vs. background, or relies on speculative counterfactuals.
  *   **C/F (Incoherent):** Fails Step 1 (no causal claim made), fails Step 4 (no trigger mechanism), or ignores Step 2 (absence causation without warning).

  ---

  ### Case Run 1: The Franz Ferdinand Thesis (Overdetermination)
  **Claim:** "The assassination of Archduke Franz Ferdinand caused the outbreak of World War I."
  **Context:** Student acknowledges alliance systems and war plans were already active.

  **Audit Run:**
  1.  **Pin:** Explicit causal claim ("caused"). **Proceed.**
  2.  **Absence:** Cause is a positive event (assassination). **Proceed.**
  3.  **But-For:** If the assassination fails, does WWI happen? Student admits "likely yes, via another incident." **Fails Strict Test.** Proceed to Step 4.
  4.  **Powder Keg:** Were background conditions sufficient? Yes (Alliances). Did Assassination occur before War? Yes. Did it activate the conditions? Yes (triggered the ultimatum chain). **Passes Trigger Test.**
  5.  **Tide vs. Wave:** Student treats it as a Wave (event). This is appropriate for the outbreak timing.
  6.  **Verdict:** **Grade: A-**.
      **Committee Paragraph:** "The causal claim is logically coherent under the 'Powder Keg' standard. The student correctly identifies the assassination as a *trigger cause* rather than a *sufficient cause*. However, to secure an A, the text must explicitly distinguish between the underlying structural causes (alliances) and the proximate trigger (assassination). Currently, the text implies the assassination alone made the war inevitable, which contradicts the student's own evidence on alliance structures. Clarify this distinction to avoid overdetermination errors."

  **Philosopher's Note:** This handles the overdetermination by shifting the claim from "sole sufficient cause" to "essential trigger of a sufficient package." It validates the historian's intuition without lying about the counterfactuals.

  ### Case Run 2: The Printing Press Thesis (Diffuse Long-Run)
  **Claim:** "The invention of the printing press caused the Protestant Reformation."
  **Context:** 70-year gap between invention and Luther. No single moment of "activation."

  **Audit Run:**
  1.  **Pin:** Explicit causal claim. **Proceed.**
  2.  **Absence:** Positive event/technology. **Proceed.**
  3.  **But-For:** If Gutenberg fails, does Reformation happen? Student argues "eventually, yes, via manuscript circulation." **Fails Strict Test.** Proceed to Step 4.
  4.  **Powder Keg:** Did the Press *trigger* a ready package? No. It built the package over decades. **Fails Trigger Test.** Proceed to Step 5.
  5.  **Tide vs. Wave:** Student treats Press as a Wave (1440 invention) causing a Wave (1517 Reformation). **Category Error.** This is a Tide claim (structural shift in information ecology).
  6.  **Verdict:** **Grade: B+**.
      **Committee Paragraph:** "The causal claim suffers from a category error. The student treats a structural condition (the Press) as a triggering event. Under the 'Tide vs. Wave' check, this is a diffuse causal claim. The argument is valid only if framed as an *enabling condition* that increased the probability of reform, not a direct cause. The student must detail the mechanism of transmission (e.g., pamphlet circulation rates) rather than relying on temporal succession. Revise to reflect structural causation."

  **Philosopher's Note:** This forces the student to admit that "caused" here means "raised the probability significantly over time" rather than "triggered." It exposes the weakness of treating structural shifts as event causation.

  ### Case Run 3: The Strategic Bombing Thesis (Contested)
  **Claim:** "The Allied strategic bombing campaign caused the German surrender in 1945."
  **Context:** Simultaneous Soviet ground invasion, atomic threat, naval blockade.

  **Audit Run:**
  1.  **Pin:** Explicit causal claim. **Proceed.**
  2.  **Absence:** Positive event. **Proceed.**
  3.  **But-For:** If bombing stops in 1944, does Germany surrender? Student admits "Soviet invasion likely forces surrender anyway." **Fails Strict Test.** Proceed to Step 4.
  4.  **Powder Keg:** Was bombing the spark? No, ground invasion was the immediate trigger. Was bombing an essential piece of a sufficient package? Debatable. Student argues it broke logistics.
  5.  **Tide vs. Wave:** Treated as Wave (campaign).
  6.  **Verdict:** **Grade: C**.
      **Committee Paragraph:** "The causal claim is historically contested and logically fragile under this audit. The claim fails the 'But-For' test (surrender likely via Soviet advance) and fails the 'Powder Keg' test (bombing did not trigger the surrender event). To sustain a causal claim, the student must isolate a specific mechanism (e.g., fuel shortages caused by bombing) that was *necessary* for the timing of the surrender. As written, the claim conflates correlation (bombing happened during collapse) with causation. Revise to argue for 'contributory factor' or isolate a specific necessary condition."

  **Philosopher's Note:** This is the "embarrassing" result. Half the committee will hate this because it demotes a major historical narrative. However, logically, the claim "Bombing caused Surrender" is overdetermined to the point of incoherence unless narrowed to specific mechanisms (oil vs. morale). The procedure forces precision over vibes.

  ---

  ### Limitations & Blind Spots (For Committee Eyes Only)
  1.  **Prevention Cases:** If a thesis argues "The lack of X caused Y," Step 2 flags this. The committee must vote on these based on historical consensus, not logical analysis. The procedure cannot validate causation by absence.
  2.  **Preemption:** If Cause A happens, but Cause B would have caused the same outcome 5 minutes later, the procedure treats A as the cause (Powder Keg). This is generally acceptable for history but philosophically debatable.
  3.  **Judgment Calls:** Step 4 (Powder Keg) requires judgment on whether background conditions were truly "sufficient." The procedure does not solve historical disagreement; it only ensures the disagreement is about evidence, not logical coherence.

  **Final Instruction to Committee:** If the procedure yields a "C" or "F" on logic, but the historical research is brilliant, grade the research highly but mark down the "Argument/Analysis" component. Do not pass a logically incoherent causal claim as an A-level argument, regardless of archival quality.
