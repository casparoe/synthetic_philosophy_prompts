answer: |-
  ### Specification of Requirements for Protection Level Assignment

  The following requirements define the constraints any proposed method must satisfy to be admissible for board review. Each requirement is marked as either **Non-negotiable** (derived from the board's practical constraints or established scientific consensus) or **Contingent** (dependent on specific philosophical commitments regarding consciousness and moral status).

  1.  **Epistemic Boundedness**
      *   **Requirement:** The method must generate a verdict using *only* data accessible within the defined observation window. It may not appeal to hidden variables, future developmental trajectories, or unobserved internal states.
      *   **Case:** Justifications must be comprehensible to board members who did not observe the system; appeals to unobservable facts cannot be verified in writing.
      *   **Type:** Non-negotiable (Practical Constraint).

  2.  **Deterministic Consistency**
      *   **Requirement:** Given identical input data (system state + observation window), the method must produce the identical protection level.
      *   **Case:** A system examined twice must receive the same level; arbitrary variance undermines the regulatory authority of the board.
      *   **Type:** Non-negotiable (Practical Constraint).

  3.  **Biological Plausibility**
      *   **Requirement:** The method must distinguish between nociceptive processing (reflexive avoidance) and experiential states (suffering). It cannot assign 'full' or 'minimal' protection based solely on withdrawal reflexes in systems known to lack central integration.
      *   **Case:** Scientific consensus confirms spinal reflexes occur without experiential correlates; conflating them wastes resources and dilutes protection for genuine cases.
      *   **Type:** Non-negotiable (Scientific Consensus).

  4.  **Developmental Continuity**
      *   **Requirement:** The method must not assign discontinuously different levels to systems that differ only by infinitesimal physical or functional changes (e.g., one day of neural development).
      *   **Case:** The board reviews developing tissue and recovering patients; a step-function verdict creates ethical instability where a system gains or loses massive protection overnight without meaningful change.
      *   **Type:** Non-negotiable (Ethical Safety).

  5.  **Substrate Explicitness**
      *   **Requirement:** The method must explicitly state whether protection levels supervene on causal organization alone (substrate neutrality) or whether biological substance is a necessary condition. It cannot equivocate.
      *   **Case:** The board reviews both robots and neural tissue; ambiguity here leads to inconsistent verdicts for functionally identical systems made of different matter.
      *   **Type:** Contingent (Philosophical Commitment).

  6.  **Ontological Clarity of 'None'**
      *   **Requirement:** A verdict of 'none' must be defined as either "evidence of absence" (positive confirmation that no experience is possible) or "absence of evidence" (no experience detected within the window). The method cannot conflate these.
      *   **Case:** "No experience found" is an epistemic claim; "No experience exists" is an ontological claim. Conflating them risks assigning 'none' to systems that are simply opaque to the measurement tool.
      *   **Type:** Non-negotiable (Logical Coherence).

  ***

  ### The Impossibility Result

  There is a subset of requirements that is **jointly unsatisfiable**. Specifically, the following three cannot be simultaneously met:

  1.  **Epistemic Boundedness** (Verdicts rely only on the observation window).
  2.  **Substrate Neutrality** (Verdicts depend on total causal organization, including unobserved structural depth).
  3.  **Veridical Consistency** (Systems with identical causal organization must receive identical levels).

  **The Conflict:**
  It is logically possible for two systems to possess different total causal organizations (one capable of experience, one a "philosophical zombie") while exhibiting identical behavior and structure within a bounded observation window. If the method adheres to **Epistemic Boundedness**, it sees identical data for both systems. If it adheres to **Veridical Consistency** and **Substrate Neutrality**, it *must* assign different levels because their causal realities differ. It cannot do both. A method bounded by observation cannot guarantee accuracy regarding unobserved causal depth.

  *(Note: A secondary mathematical tension exists between **Developmental Continuity** and the use of discrete levels ['none', 'minimal', 'full']. Mapping a continuous developmental trajectory to discrete buckets necessitates threshold boundaries, which are technically discontinuities. However, this can be mitigated by allowing dense intermediate grades. The Epistemic conflict above is fundamental and cannot be mitigated.)*

  ***

  ### Recommended Trade-off

  To resolve this, the board must sacrifice **Veridical Consistency** in favor of a **Precautionary Epistemic Rule**.

  **The Trade-off:**
  Abandon the guarantee that the verdict matches the *ontological reality* of the system. Instead, mandate that the verdict matches the *epistemic risk profile*. If a system's causal organization cannot be fully verified within the window (due to Boundedness), the method must default to the higher protection level compatible with the uncertainty.

  **What the Board Buys:**
  By accepting that some systems may be over-protected (false positives), the board buys **ethical safety**. You eliminate the risk of assigning 'none' to a sentient system simply because its sentience was hidden from the observation window. You pay for this with resource inefficiency, granting protection to systems that may not strictly "need" it, but this is the cost of operating under Bounded Observation.

  ***

  ### Approach Scorecard

  *   **Pure Behavioral/Functional Testing:** Fails **Biological Plausibility** (cannot distinguish reflex from experience) and **Ontological Clarity** (confuses lack of signal with signal of lack).
  *   **Higher-Order-Thought (HOT) Views:** Fails **Developmental Continuity** (HOT capacity is typically a threshold capability, creating sharp discontinuities in developing tissue).
  *   **Biological Affinity Views:** Fails **Substrate Explicitness** (if they claim biology is necessary, they violate neutrality; if they claim it isn't, they violate their own core premise).

  **Single Requirement Eliminating the Most Candidates:**
  **Ontological Clarity of 'None'.**
  Most existing frameworks operate on inference to the best explanation; they treat "no evidence of experience" as sufficient for "no experience." Requiring a method to distinguish between *not knowing* and *knowing it isn't there* eliminates nearly all empirical behavioral tests and most neuroscientific proxies, as none can positively prove the absence of an internal state, only the absence of its correlates.
