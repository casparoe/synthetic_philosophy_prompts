          *   *Murder:* If I freeze you, are you murdered? If you are revived, was it attempted murder? If you aren't revived, was it murder at the moment of freezing or later?
          *   *Insurance:* Life insurance pays on legal death. If legal death aligns with info death, you might not be "dead" enough to payout when the cryonics bill is due. The loop the user mentions is real: You need to be dead to get the money to wake you up.
          *   *Inheritance:* Do you own assets while frozen? If you are legally dead, your estate is distributed. Who pays the storage fees? (Currently solved by trusts, but legally messy).

  6.  **Synthesize and Structure the Response:**

