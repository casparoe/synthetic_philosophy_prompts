      *   *Section 3: Underdetermination.* Distinguish between metaphysical necessities (Patternism) and technological necessities (Vitrification).
      *   *Section 4: Institutional Collapse.* What happens if the law changes? The Organ/Cryonics trade-off. The Insurance Paradox.
      *   *Conclusion:* Summarize the core philosophical commitment. It's a bet on Materialism + Patternism + Optimism about Physics.

  7.  **Refine the Tone:**

      *   Keep it analytical but engaging.
      *   Use philosophical terminology (Locke, Parfit, Epicurus, Animalism) but explain them clearly.
      *   Address the "rambly" apology by validating the complexity (it's not rambly, it's dense).
      *   *Self-Correction during drafting:* Make sure to emphasize the *legal* friction. The user specifically asked about the paperwork/institutional side. Ensure the distinction between "Clinical Death" (legal) and "Information-Theoretic Death" (metaphysical) is clear throughout.

  8.  **Final Polish:** Check against specific user questions.
      *   *Theory of identity?* Covered (Patternism).
      *   *Continuity theorist rational?* Covered (Pascal's wager/uncertainty).
      *   *Death's badness?* Covered (Deprivation + Pause).
      *   *Gap in life?* Covered (Interruption vs Termination).
      *   *Underdetermined bits?* Covered.
      *   *Institutional fallout?* Covered (Organs, Insurance, Murder).

  9.  (Final thought on the "Insurance Loop"): The user mentioned the funny loop of being dead enough to collect insurance but not too dead to come back. This is a crucial point. Currently, cryonicists use life insurance *because* they are legally dead. If the law shifted to info-theoretic death, life insurance wouldn't pay out until the brain was actually destroyed, rendering cryonics unfundable. This is a key insight to highlight.

