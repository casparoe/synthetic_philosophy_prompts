prompt: |-
  So here's a thing I keep going back and forth on with a friend. Cryonics, the industry where a company fills your body (mostly your head) with antifreeze and stores you in liquid nitrogen after you die, hoping future medicine can fix whatever killed you and reboot you. The legal setup is what gets me. Basically everywhere, they can't begin until a doctor has pronounced you legally dead. But the whole pitch rests on the idea that the person who was just pronounced dead isn't really dead in the relevant sense — cryonicists like to say that clinical death is a process, not an event, and that the real death is information-theoretic death, the point at which the structure in your brain gets scrambled past any possible recovery, which happens some while after your heart stops. So the state's definition of death and the practice's definition of death have to both apply to you at the same moment, which seems like a strange thing for an institution to run on.

  What I want is a reconstruction of the philosophy this whole arrangement quietly presupposes. Like: what theory of personal identity do you need for the paperwork to make sense? If you are basically the information pattern stored in your brain, then a future machine that rebuilds a person from that pattern brings back you, and signing up is just very long-term ambulance transport. But if identity is something else — biological continuity, an animal that keeps living, whatever — then the future machine builds a convincing copy, and you still died back there. Does the practice strictly require the pattern view, or could a continuity theorist still rationally sign up (maybe the chance that it's you beats the certainty of nothing)?

  And then death's badness. The Epicurean move would be that being frozen and being cremated are equally nothing to you, so why pay a hundred grand? Is the answer just the deprivation account — death is bad because it takes away future goods, and being frozen means the goods are still there, waiting? Related thing that bugs me: the practice seems to have to say the frozen interval itself doesn't deprive you of anything, since you're not conscious and not accumulating lost experiences the way a corpse would — but that sounds uncomfortably close to saying a gap in your life is free, which I suspect a lot of people would deny in other contexts. Where's the line?

  Also tell me where cryonics is philosophically underdetermined — which bits does it strictly need to be true versus which theories merely sit comfortably with it. And if the law ever did move to an information-theoretic standard of death instead of whole-brain death, what else in our institutions would have to give — organ donation timing, murder charges, life insurance paying out to fund your own revival (that loop already seems funny to me, you being dead enough to collect but not too dead to come back)?

  Sorry if this is rambly — the core question is: what exactly has to be true about identity and about death's badness for this practice to be coherent rather than just an expensive funeral?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Cryonics (preservation of body/head in liquid nitrogen after legal death).
      *   **The Tension:** Legal death (clinical) vs. Cryonic death (information-theoretic). The practice requires you to be legally dead to start, but biologically/informationally "alive enough" to save.
      *   **Question 1: Personal Identity:** What theory of personal identity is presupposed? Is it strictly the "Pattern View" (Psychological Continuity/Information Theory), or can a "Biological/Animalist View" make sense of it? Is it a gamble (Pascal's Wager style)?
      *   **Question 2: Death's Badness:** How does cryonics address the Epicurean argument (death is nothing)? Is it purely the Deprivation Account? How do we treat the "gap" in consciousness (is a gap free, or does it break identity)?
      *   **Question 3: Underdetermination:** What *must* be true vs. what is merely compatible?
      *   **Question 4: Institutional Implications:** If the law adopted information-theoretic death, what breaks? (Organ donation, murder, insurance).
      *   **Goal:** Reconstruct the philosophy quietly presupposed by the arrangement. Determine what needs to be true for it to be coherent rather than an expensive funeral.

  2.  **Analyze Personal Identity (The "Who" Question):**

      *   *The Standard View:* Cryonics relies heavily on **Psychological Continuity Theory** (Lockean) refined into **Patternism**. You are the data structure of your connectome/memory. If the pattern is preserved, *you* are preserved.
      *   *The Biological View (Animalism):* If you are essentially a living organism, cryonics is problematic. The organism stops functioning. Revival would be creating a *new* organism with the old memories. A strict animalist shouldn't sign up expecting *survival*, though they might sign up for the sake of their "successor."
      *   *The Gamble:* Can a biological continuist sign up? Yes, under uncertainty. If there's a non-zero chance the pattern view is right, the expected value of infinite future life outweighs the cost. This is "Cryonic Pascal's Wager."
      *   *The Legal/Practical Tension:* The law requires biological cessation (heart/brain stem) to declare death. Cryonics requires structural preservation *before* decay. This creates a "Zone of Suspended Animation" where the law says "dead" but the cryonicist says "preserved."
      *   *Conclusion:* It *strongly* presupposes Patternism, but doesn't *strictly require* it if treated as a probabilistic bet.

  3.  **Analyze Death's Badness (The "Why" Question):**

      *   *Epicureanism:* "Where death is, I am not." If you are frozen, you aren't experiencing anything. So why pay?
      *   *Deprivation Account:* Death is bad because it deprives you of future goods. Cryonics mitigates this by *postponing* the deprivation.
      *   *The Gap Problem:* The user notes the "gap" in consciousness. If I sleep for 8 hours, am I deprived? No. If I sleep for 100 years, am I deprived? Parfit's "Psychological Spectrum" comes in here. If continuity is broken too long, does it matter?
      *   *Cryonic Answer:* The gap doesn't count because the *capacity* for experience is preserved, not the experience itself. It treats the frozen time as "paused," not "lost." This relies on the idea that *interruption* $\neq$ *termination*.
      *   *Coherence:* For this to work, death must be viewed as a *process* (as the user noted), not a moment. The "badness" is the *completion* of the decay process, not the cessation of the heart.

  4.  **Analyze Underdetermination (What *Must* Be True):**

      *   *Must:* The brain's information structure must survive the freezing process (vitrification) sufficiently to be readable later. (Physical feasibility).
      *   *Must:* Personal identity must be substrate-independent or at least structure-dependent (Patternism).
      *   *Must:* Future technology must be capable of repair (Nano/Advanced Med).
      *   *Compatible but not Required:* Specifics of the revival method, specific metaphysical views on the soul (usually materialist, but a theist could believe God restores the soul upon revival).
      *   *The "Expensive Funeral" Line:* It becomes an expensive funeral if Patternism is false OR if Information-Theoretic Death occurs before vitrification.

  5.  **Analyze Institutional Implications (The "Law" Question):**

      *   *Current Law:* Whole-brain or Cardio-pulmonary death.
      *   *Shift to Info-Theoretic Death:*
