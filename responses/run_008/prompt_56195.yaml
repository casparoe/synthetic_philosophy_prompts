answer: |-
  This disagreement is not merely verbal, nor is it purely substantive in the way a standard empirical dispute is. It is best diagnosed as a **clash of explanatory interests masquerading as an ontological dispute.** The two camps are using the term "representation" to track different theoretical virtues: the Realists track *causal leverage*, while the Skeptics track *semantic content*. Because both virtues are necessary for a complete theory of mind (or model), the debate stalls when one side demands the other's virtue as a precondition for the term's use.

  Here is the breakdown of the diagnosis.

  ### 1. Verbal vs. Substantive: The Ontological Friction
  If this were purely verbal, the parties could agree on all the physical and functional facts (probes work, interventions change outputs, many bases exist) and simply disagree on the label "representation." But they do not agree on the facts. The Skeptics claim the Realists are misdescribing the *source* of the structure.

  *   **The Realist Ontology:** Functionalism. A state is a representation if it plays a specific causal role (carrying information, driving behavior). If it quacks like a duck (controls the output), it is a duck.
  *   **The Skeptic Ontology:** Structural Realism (regarding content). A state is a representation only if its content is determined by factors internal to the system's relation to the world, not by the observer's choice of basis.

  The disagreement is substantive because it concerns **observer-relativity**. The Realists believe they are uncovering structures that exist independently of the probing method (the "joints" of the network). The Skeptics believe the "joints" are created by the knife of the probe. Therefore, the dispute is about whether interpretability is a process of *discovery* (Realist) or *construction* (Skeptic). This is a metaphysical disagreement about the status of the features, not just a definitional one.

  ### 2. The Role of Underdetermination: Network Fact or Human Fact?
  The underdetermination argument is the empirical engine of the Skeptic's position, but it conflates two distinct problems.

  *   **The Mathematical Fact:** High-dimensional activation spaces are non-identifiable. There are infinitely many rotationally equivalent bases that preserve the model's input-output function. This is a fact about the networks (specifically, about overparameterized linear algebra).
  *   **The Epistemic Worry:** Because many bases work, choosing one requires a bias (e.g., sparsity, alignment with English words). This is a fact about *us*.

  The diagnosis is that the underdetermination worry is doing the heavy lifting because it attacks the Realist's claim to **natural kinds**. If the "dog feature" is just one of a million equally valid vectors that correlate with dog-labels, then calling it *the* dog feature privileges the human concept of "dog" over the network's actual geometry.

  However, the Realists often counter with **causal specificity**. They argue that while many vectors *correlate*, only specific ones *cause* the behavior when intervened upon. The Skeptic replies that causal interventions are also basis-dependent.

  **Verdict on Underdetermination:** It is a fact about the networks that they do not enforce a unique basis. It is a fact about us that we demand one. The disagreement persists because Realists treat *human-interpretable* bases as sufficient evidence of *network-native* structure, while Skeptics treat the need for human-interpretable constraints as proof that the structure is not network-native.

  ### 3. The Normativity Register: The Hard Problem of Content
  The second Skeptical register (normativity) is the philosophical hard core of the dispute. This is not about neural networks specifically; it is the **problem of intentionality** ported into machine learning.

  *   **The Realist Move:** They naturalize normativity via the loss function. A representation is accurate if it minimizes loss relative to the training distribution.
  *   **The Skeptic Counter:** The loss function is external. The network does not "care" about the loss; the *trainer* does. To say the network "misrepresents" is to anthropomorphize an optimization process.

  This part of the disagreement is substantive and unlikely to be resolved by better engineering. It asks whether a system can have "original intentionality" or only "derived intentionality" (borrowed from its designers). The Realists are implicitly arguing for a deflationary account of representation (representation = reliable covariance + causal control). The Skeptics are holding out for a robust account (representation = capacity for truth/falsity grounded in the system's own teleology).

  ### 4. Prospects for Progress
  Will this debate persist? **Yes,** because the camps are optimizing for different goods. However, progress is possible if the question is reframed.

  *   **Principled Decomposition:** A criterion for privileging one decomposition (e.g., "the sparsest basis that preserves causal independence") would satisfy the Realists but not the Skeptics. The Skeptic will always ask: "Why is sparsity a mark of truth rather than a mark of human cognitive limitation?" Progress here requires admitting that **interpretability is a relational property** between the model and the interpreter, not an intrinsic property of the model.
  *   **Grounding Correctness:** An account of correctness that doesn't borrow from the loss function would require a theory of **teleosemantics** for artificial systems (e.g., the network's "goal" is defined by its architecture, not the trainer). This is a philosophical breakthrough, not an engineering one.

  **Diagnosis of the Stalemate:**
  The debate stalls because the Realists are answering an **engineering question** ("Can we isolate levers to control the model?") using **semantic vocabulary** ("We found the representation of X"). The Skeptics are answering a **philosophical question** ("Does this system have genuine content?") using **engineering evidence** ("The basis is arbitrary").

  **Path Forward:**
  Progress requires decoupling the questions.
  1.  **For the Realists:** Abandon the claim that finding a causal lever proves the existence of a semantic representation. Admit that "feature" is a term for a *useful causal abstraction*, not necessarily a *ontological unit*.
  2.  **For the Skeptics:** Acknowledge that causal isolability is a non-trivial constraint. Even if the basis is chosen by humans, the fact that *some* human-choosable basis allows for precise causal control is a substantive fact about the network's geometry, not just a fact about human vocabulary.

  **Conclusion:**
  The disagreement is substantive, but it is not about whether the networks "really" represent. It is about whether the concept of representation is useful for *control* (Realist) or must be reserved for *understanding* (Skeptic). The debate will persist as long as "interpretability" is expected to solve both the engineering problem of control and the philosophical problem of meaning simultaneously. The most productive diagnosis is to view "representation" in this context as a **boundary concept**: it marks the limit where causal description runs into semantic interpretation. Neither side is wrong; they are measuring different depths of the same phenomenon.
