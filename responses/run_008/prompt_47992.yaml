  5.  **Formulating the "Cleanest Principle":**
      *   The most robust principle is **Reflection restricted to Rational Information Gain**.
      *   *Condition 1:* No information loss (rules out Forgetting).
      *   *Condition 2:* No cognitive distortion (rules out Wine, Stove).
      *   *Condition 3:* The future credence must be the result of updating on the total evidence available at $t'$ (including knowledge of bias).
