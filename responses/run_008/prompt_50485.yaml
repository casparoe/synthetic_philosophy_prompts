      *   *Book 2 (The Riot/Seers):* Prophecy is heard. Preparation changes the outcome (riot prevented).
          *   *Rule:* Treat heard predictions as *causes*. Agency matters. The script is fixed only through response. (Newcomb-like, but cooperative).
      *   *Book 3 (The Flood/Prophetess):* Certainty exists. No one believes. Nothing changes (flood happens).
          *   *Rule:* Treat certain foreknowledge of *others'* acts as settled. Preparation is right, but the event is inevitable. (Determinism regarding external events).

      *   *Synthesis of the "Author's Voice":* The narration vindicates those who align their *nature* with the truth of the omen, rather than trying to outsmart the mechanics of the omen.
          *   Book 1: Don't hedge (align nature with trust).
          *   Book 2: Don't be passive (align nature with action).
          *   Book 3: Don't deny reality (align nature with acceptance).
