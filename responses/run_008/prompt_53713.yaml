prompt: |-
  In my AP Biology class we've been covering the genetic code, and it bothers me how freely the word "code" gets thrown around. My teacher says DNA stores "information" and that base sequences "code for" proteins, but when a classmate said that DNA is literally a code in the way Morse code or a computer program is — so that somebody must have written it — she said that's just an analogy and moved on. Meanwhile our textbook, and sometimes the teacher herself, slips into calling DNA a "blueprint," a "recipe," or a set of "instructions," and nobody explains what's literal and what's metaphor. I'd like to know what the slogan "DNA is a code" could actually be claiming. Could you lay out the distinct precise theses packed into it — from the nearly trivial claim about the codon-to-amino-acid mapping that no biologist disputes, to stronger claims about DNA being a symbolic system in the way human languages or software are, to whatever reading would be needed to support my classmate's "codes require coders" inference — and for each say whether it's true and whether the people who repeat the slogan probably mean it? Please also tell me which reading my teacher was most plausibly denying when she called it an analogy, and whether "blueprint," "recipe," and "instruction manual" are three different claims or three names for one. Answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** AP Biology class, discussion on the genetic code.
      *   **Problem:** Confusion over the metaphorical vs. literal use of terms like "code," "information," "blueprint," "recipe," "instructions."
      *   **Specific Conflict:** Teacher says "code" is useful but an analogy; Classmate says "code" implies a coder (Intelligent Design argument).
      *   **Task:** Break down the slogan "DNA is a code" into distinct precise theses (from weak/trivial to strong/philosophical).
      *   **Requirements:**
          *   Evaluate truth value for each thesis.
          *   Evaluate whether biologists *mean* that thesis when using the slogan.
          *   Identify which reading the teacher was likely denying.
          *   Distinguish between "blueprint," "recipe," and "instruction manual."
          *   Tone: American English, precise, analytical, educational (suitable for an AP Bio student).

  2.  **Deconstruct "DNA is a Code":**
      *   *Level 1: The Biochemical Mapping.* This is the scientific definition. Triplets of bases (codons) map to specific amino acids. It's a causal regularity.
      *   *Level 2: The Information-Theoretic View.* DNA carries distinguishable states that can be copied and transmitted. It has Shannon information.
      *   *Level 3: The Semantic/Symbolic View.* DNA *means* something. It has syntax and semantics like human language. This is where the "analogy" debate heats up.
      *   *Level 4: The Teleological/Design View.* Codes imply intent/design. This is the classmate's inference ("codes require coders").

  3.  **Evaluate Each Thesis:**
      *   *Level 1 (Mapping):* True. Biologists mean this literally.
      *   *Level 2 (Information):* True (in a technical sense). Biologists often mean this, though sometimes loosely.
      *   *Level 3 (Symbolic/Language):* Debatable/Philosophical. Biologists usually treat this as a useful metaphor, not a literal ontological claim.
      *   *Level 4 (Design):* False (scientifically). Biologists definitely do *not* mean this. This is the classmate's leap.

  4.  **Analyze the Metaphors ("Blueprint," "Recipe," "Instructions"):**
      *   *Blueprint:* Implies a spatial map. DNA isn't really a spatial map of the body (a gene for an arm isn't located where the arm grows). It's mostly misleading but common.
      *   *Recipe:* Implies a process. Ingredients + steps = product. Closer to reality (gene expression), but implies a cook (cell machinery) is needed.
      *   *Instructions:* General term. Can cover both blueprint and recipe.
      *   *Are they different?* Yes, they emphasize different aspects of gene expression.

  5.  **Address the Teacher's Denial:**
      *   The teacher called it an "analogy" when the classmate invoked the "coder."
      *   The teacher was likely denying Level 3 (Symbolic) and definitely Level 4 (Design). She was protecting the science from the metaphysical leap.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the frustration. It's a common philosophical confusion in biology. Validate the student's critical thinking.
      *   *Section 1: The Theses of "DNA is a Code".*
          *   Thesis 1: The Causal Regularity (Codon Table). Literal, True, Meant.
          *   Thesis 2: The Information Capacity (Shannon). Technical, True, Sometimes Meant.
          *   Thesis 3: The Semantic System (Language). Metaphorical, Debatable, Usually *Not* Meant Literally.
          *   Thesis 4: The Designed Artifact (Intelligent Design). Metaphysical, False (in science), Never Meant by Biologists.
      *   *Section 2: The Teacher's Denial.* Explain she was blocking Thesis 4 (and maybe 3). Explain *why* (science deals with mechanisms, not origins of meaning).
      *   *Section 3: Blueprint vs. Recipe vs. Instructions.*
          *   Blueprint: Spatial (Wrong).
          *   Recipe: Process/Chemical (Better).
          *   Instructions: General (Vague).
          *   Conclusion: They are distinct metaphors with different flaws.
      *   *Conclusion:* Summarize. Encourage the student to keep asking these questions but understand the boundary between biology and philosophy.

  7.  **Refining the Content (Self-Correction/Nuance Check):**
