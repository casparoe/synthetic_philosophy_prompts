      *   *Check:* American English spelling/idioms. (e.g., "program" not "programme", "color" not "colour").

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between "literal" and "metaphorical" is sharp. (This aligns with the user's request for "distinct precise theses".)

      *(Self-Correction during drafting Thesis 3)*: Be careful not to say semantics is *impossible* in biology. Some philosophers of biology argue for "biosemantics." But for AP Bio purposes, it's treated as metaphorical. I should note this nuance.

      *(Self-Correction on "Blueprint")*: Make sure to mention the homunculus fallacy implicitly. A blueprint looks like the building; DNA does not look like the organism.

