  3.  **Evaluate Considerations (Signal vs. Noise) (Task 2):**
      *   *Colleagues vs. Strangers:* **Signal.** In a market, arm's length transactions allow aggregation. In a community/co-op, relational obligations matter. Sacrificing a minority for the majority weakens trust.
      *   *Decision made by winners:* **Signal.** This is a classic "tyranny of the majority" problem. If the 15 vote themselves money taken from the 9, it looks like expropriation.
