  **ISSUE #892: Mental Layer appears causally idle — deprioritize?**
  **Priority:** High
  **Component:** Architecture / Causality Module
  **Reporter:** @senior_eng_skeptic

  **Description:**
  Audit of `Person_v1.0` indicates the Physical Layer is causally closed. Every physical event (e.g., `Arm.move()`) has a sufficient physical cause chain (`Neuron.fire()`, etc.). Documentation claims Mental Layer states (`Desire`, `Belief`) exert causal power.

  This violates the Exclusion Principle. If a physical effect has a sufficient physical cause, no distinct mental cause can exist unless the effect is systematically overdetermined. We are scripting two sufficient causes for every action. This is inefficient. Alternatively, if Mental states are not identical to Physical states, they appear epiphenomenal. The Mental Layer imports nothing and exports nothing.

  **Steps to Reproduce:**
  1. Instantiate `User`.
  2. Invoke `User.decide("raise arm")`.
  3. Trace causality downstream from Physical Layer.
  4. Observe complete causal chain: `MotorCortex -> Spine -> Muscle`.
  5. Notice Mental Layer (`Intent`) nowhere in the physical trace.
  6. Verify no energy transfer from Mental to Physical namespace.
  7. Confirm Physical Layer functions perfectly even if Mental Layer is commented out.

  **Comments:**
  **@dev_nonreductive:** The Mental Layer isn't separate code; it's realized by the Physical Layer. It's doing work via realization. Supervenience ensures correlation.
  **@senior_eng_skeptic:** Realization isn't a causal relation. It's a dependency mapping. If Physical causes Physical, and Mental is distinct, Mental does nothing.
  **@dev_nonreductive:** Token identity. Specific mental instances are physical instances. It's the same object, different interface.
  **@senior_eng_skeptic:** Then the Mental Layer schema is misleading. It implies independent causal powers. If they are token-identical, why maintain separate classes?
  **@dev_nonreductive:** High-level abstraction allows us to reason about behavior without debugging neurons.
  **@senior_eng_skeptic:** Reasoning isn't causation. The arm moves because of neurons, not because we reasoned about it.

  **Proposed Fix:**
  Refactor to Type Identity Theory. Merge Mental and Physical layers into single namespace. `Mental.desire` = `Physical.neuron_pattern`. Remove Mental Layer abstraction.
  **@product_mgmt:** Rejected. Too breaking for backwards compat. Legacy systems (folk psychology, legal frameworks) rely on the dual-layer API. Clients expect `Agent` objects to have `Intent`. Deprecation timeline undefined.

  **Status:** **CLOSED** (Resolution: Works as Intended).
  **Note:** Mental Layer retained for documentation purposes only. No causal execution path guaranteed.

