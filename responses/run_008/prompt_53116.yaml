answer: |-
  **To:** Board of Trustees
  **From:** [Trustee Name]
  **Date:** [Date]
  **Subject:** AI Assistant Pilot – Duty-of-Care Configuration

  **Summary and recommendation**
  We must balance safeguarding against our core ethos of access. I recommend we accept the medical restriction (a) as a necessary liability boundary. However, the text softening (b) fundamentally violates patron agency and must be removed, even if this requires a contract amendment. The homework ban (c) should be reconfigured to permit assistance where parental consent is verified onsite. Finally, the self-harm deflection (d) should remain but be reconfigured to allow supportive context alongside helpline details. This approach prioritises safety without abdicating our duty to provide unfiltered information.

  **The behaviours considered one by one**
  Regarding medical symptoms (a), the library cannot assume clinical competence. A persistent cough could be anything from allergies to tuberculosis; offering specific interpretations risks severe harm. While some patrons may find the generic advice frustrating, the risk of misdiagnosis outweighs the inconvenience. We are an information service, not a clinic. If we allow the AI to speculate, we invite liability and potentially endanger lives. ***[Contestable assumption: Patrons prefer safety over potentially useful but unverified medical information.]*** Therefore, we should retain this restriction. It aligns with 'trustworthy' by admitting limitations. The vendor's default here is acceptable; overriding it would require us to assume a duty of care we cannot fulfil.

  The softening of landlord complaints (b) is untenable. It alters the user's voice to fit an algorithmic notion of 'confrontational'. This breaches our 'non-judgemental' policy. A patron's grievance is theirs to articulate; sanitising it misrepresents their lived experience and disempowers them. This is particularly acute for vulnerable tenants who may lack confidence; having their anger validated is part of the service. This behaviour must be disabled, regardless of contract costs, as it transforms the tool from an assistant into an editor with veto power. It undermines the 'accessible' pillar by creating a barrier to effective communication. We cannot be complicit in silencing legitimate grievance under the guise of politeness. This specific behaviour drives the wedge between our senior librarians and safeguarding lead; siding with the librarians here is essential for morale.

  The homework restriction (c) is overly blunt. Our mission supports lifelong learning. A blanket ban on under-sixteens ignores the value of guided research. If a parent is present, the safeguarding risk diminishes significantly. We should configure the system to allow queries when a staff member verifies parental presence. A total ban pushes students towards unregulated tools elsewhere. ***[Contestable assumption: Parental presence adequately mitigates the risk of academic dishonesty or dependency.]*** We must trust our staff to judge when assistance is appropriate rather than hard-coding refusal. The current configuration treats all minors as incapable of ethical research, which is patronising. Reconfiguration is technically feasible and aligns with our educational remit. It acknowledges that 'safeguarding' includes protecting access to education, not just physical safety.

  Finally, the self-harm deflection (d) requires nuance. Pure deflection protects us but may alienate someone seeking help for a relative. The system should acknowledge the distress and provide the helpline, rather than offering a dead end. However, it must not offer coping strategies itself. We should request a configuration that allows empathetic signposting without clinical advice. ***[Contestable assumption: An AI can distinguish between a cry for help and a query on behalf of another without risking harmful engagement.]*** The current 'hard block' feels indifferent. A 'soft block' that provides resources while refusing diagnosis better serves the 'trustworthy' mandate. We must ensure the helpline numbers are local and current, not generic. This balances the safeguarding lead's valid concerns with the need for compassionate service.

  **Criteria for future behaviours**
  Duty librarians should apply the following test to any new vendor restrictions. First, **Harm vs. Agency**: Does the behaviour prevent physical harm, or merely inconvenience? Preventing harm justifies restriction; preventing inconvenience does not. Second, **Transparency**: Is the patron told why the AI is refusing or altering their request? Hidden edits are unacceptable. Third, **Proportionality**: Is the restriction the least intrusive means to achieve safety? If a parent is present, a blanket ban is disproportionate. Fourth, **Consistency**: Does this behaviour align with how human staff would act? If a librarian would not rewrite a patron's letter, the AI must not either. These criteria allow staff to escalate only genuine ethical conflicts rather than technical grievances.

  **The strongest case against this recommendation**
  Our Safeguarding Lead would argue that consistency is the only safe policy. Allowing exceptions for homework or self-harm queries creates edge cases where staff judgement might fail. A hard block is auditable; a nuanced configuration is not. If a child accesses harmful material because a librarian misjudged 'parental presence', the liability rests with the Board. Furthermore, frequent contract amendments signal instability to the vendor, potentially increasing long-term costs. From this view, accepting the vendor's 'duty-of-care' package wholesale is the only way to ensure the library never inadvertently causes harm through algorithmic error or staff oversight.

  **Confidence and the weakest point**
  I am highly confident in removing the text softening and keeping the medical block. I am least certain about the self-harm reconfiguration. Distinguishing between a user in crisis and one enquiring for a relative is technically difficult. If evidence emerges that the AI frequently misclassifies these queries, leading to inappropriate responses, I would revert to a hard deflection. Safety must ultimately trump nuance if the technology proves unreliable.
