answer: |-
  Yes, there is a name for this, and you have essentially rediscovered a central debate in contemporary metaphysics and philosophy of science. The term you are looking for is **"Real Patterns."**

  The concept was most famously articulated by the philosopher **Daniel Dennett** in his 1991 paper *"Real Patterns."* It fits your description almost exactly: entities that are not fundamental physical particles but are nonetheless "real" because positing their existence allows for massive data compression and successful prediction.

  However, depending on which specific nuance you are chasing (the cognitive aspect, the social aspect, or the scientific classification aspect), there are three overlapping frameworks you should know about.

  ### 1. The Core Concept: "Real Patterns" (Dennett)
  Dennett argues against the idea that only fundamental physics is "really real." He proposes that something exists if it constitutes a **pattern in the data** that is efficiently detectable by an observer.

  *   **The Criterion:** A pattern is real if the cost of describing the system *including* the pattern is less than the cost of describing the system without it, provided the pattern yields predictive power.
  *   **The Roomba Example:** This is exactly what Dennett calls **"The Intentional Stance."** You can predict the Roomba by tracing every voltage (Physical Stance) or by analyzing its code (Design Stance). But the most efficient compression is to say it "wants" to charge (Intentional Stance). If that attribution predicts its behavior better than the noise, the "want" is a real pattern.
  *   **The Chess Example:** The position "White is up a knight" is a real pattern. It is not in the physics of the wood or silicon, but ignoring it makes predicting the game outcome computationally intractable.

  **For a Data Scientist:** This is **Minimum Description Length (MDL)** applied to ontology. If adding a latent variable (like "depression" or "knight") reduces the total description length of the dataset (model complexity + error) significantly, that variable is ontologically justified.

  ### 2. The Scientific Category: "Homeostatic Property Clusters" (Boyd)
  You mentioned "depression." In philosophy of science, this addresses the problem of **Special Science Kinds**. Electrons are "Natural Kinds" (they are identical everywhere). But biological and social kinds vary.

  Richard Boyd proposed **Homeostatic Property Clusters (HPC)**.
  *   **The Idea:** A kind is real not because it has a necessary and sufficient definition (like "bachelor = unmarried man"), but because a cluster of properties tends to co-occur due to underlying causal mechanisms (homeostasis).
  *   **Depression:** There is no single "depression gene." But sadness, sleep disturbance, anhedonia, and cortisol levels cluster together due to feedback loops. The category is "projected" by committees (DSM), but it carves nature at joints because the cluster is stable and predictive of treatment response.
  *   **Why it fits:** It explains why the category isn't arbitrary (there are causal glue holding the properties together) but isn't fundamental physics either.

  ### 3. The Social Mechanism: "Institutional Facts" (Searle)
  For chess and money, you are touching on **John Searle's** distinction between *Brute Facts* (gravity) and *Institutional Facts* (checkmate, dollars).
  *   **The Formula:** X counts as Y in context C. (Paper counts as Money in the context of the US Economy).
  *   **The Catch:** Searle originally implied these were less "real" than brute facts. However, modern interpreters (like **Ladyman and Ross** in *Every Thing Must Go*) argue that Institutional Facts become Real Patterns when they acquire **causal power**.
  *   **Hyperinflation:** When money hyperinflates, the "pattern" breaks. The compression fails. Saying "this costs 1 million dollars" no longer predicts behavior (people switch to barter or foreign currency). The pattern loses its "realness" because it loses its predictive utility.

  ---

  ### The Principled Criterion: When does a pattern count as real?

  You asked for a principled criterion. In the literature of **Rainforest Realism** (Ladyman & Ross, who extend Dennett), the criterion is **Projectability**.

  A pattern is real if:
  1.  **Compression:** It reduces the complexity of the model required to describe the system.
  2.  **Stability:** It persists over time and across slight variations in the substrate (a knight is still a knight if carved from ivory instead of wood).
  3.  **Predictive Payoff:** It supports counterfactuals ("If White hadn't moved the pawn, he wouldn't be up a knight").
  4.  **Causal Power:** The pattern itself exerts influence on future states (The *belief* that money has value causes people to accept it).

  **The Edge:** If a pattern is *only* descriptive but supports no counterfactuals and exerts no causal influence, it is a **"Pseudo-Pattern"** (or noise).

  ### Analyzing Your Edge Cases

  **1. Constellations (Orion)**
  *   **Verdict:** **Pseudo-Pattern.**
  *   **Why:** While they offer compression ("That's Orion"), they fail the stability and causal power test. The stars are moving at different velocities; the pattern will dissolve in 100,000 years. More importantly, "Orion" predicts nothing about the stars' behavior. It is a projection without a "joint" in the world to carve. It is overfitting to a snapshot of data.

  **2. Money during Hyperinflation**
  *   **Verdict:** **Dissolving Real Pattern.**
  *   **Why:** Money is a Real Pattern sustained by a network of mutual expectations (a Nash Equilibrium). During hyperinflation, the predictive model breaks. "Price = $1M" no longer predicts "Seller accepts." The compression fails because the noise (volatility) overwhelms the signal (value). The ontology collapses back to brute facts (paper is just paper).

  **3. Chess Engine Evaluation (+1.5)**
  *   **Verdict:** **Instrumental Real Pattern.**
  *   **Why:** This is fascinating. "+1.5" is not a rule of chess (like "Knight moves in L"). It is a *model* of the game state. However, because it is highly predictive of win/loss outcomes, it functions as a measurement instrument. It is real in the same way "temperature" is real. Temperature isn't in the atoms (only kinetic energy is); it's a statistical compression. But because it predicts heat flow, it is a Real Pattern. Engine eval is the "temperature" of a chess position.

  ### The "Mind-Blowing" Implication for Data Science

  There is a branch of metaphysics called **Ontic Structural Realism** (specifically the version argued by Ladyman and Ross) that takes your intuition to its logical conclusion.

  They argue that **electrons are not more real than chess positions.**

  Electrons are just *very* stable Real Patterns that appear in the data of particle physics. They are "more real" only in the sense that they are more invariant across contexts than a chess position. But ontologically, they are the same *kind* of thing: useful compressions of the underlying structure of the universe that allow for prediction.

  **Recommended Reading:**
  1.  **"Real Patterns"** by Daniel Dennett (1991). (The foundational paper).
  2.  **"Every Thing Must Go: Metaphysics Naturalized"** by Ladyman and Ross (2007). (Chapter 3 specifically addresses your "compression = reality" intuition).
  3.  **"The Intentional Stance"** by Daniel Dennett (1987). (For the Roomba/Agent aspect).
  4.  **"Homeostatic Property Clusters"** by Richard Boyd (1999). (For the Depression/Medical aspect).

  **Summary:** You are describing **Real Patterns**. The criterion for their reality is **predictive compression**. If removing the concept forces you to process significantly more data to achieve the same predictive accuracy, the concept is real.
