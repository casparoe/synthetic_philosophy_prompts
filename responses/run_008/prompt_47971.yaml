      *   *Refining the "Why":* Use the concept of "Causal Theory of Reference." Reference is fixed by a baptism or causal chain connecting the word to the *stuff*. Minor environmental changes don't break that chain. Twin Earth breaks the chain because the *stuff* is different.

  6.  **Final Polish:**
