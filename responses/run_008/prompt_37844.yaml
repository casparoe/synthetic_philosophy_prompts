      *   **The "Symptom vs. Cause" Framework:** Explain that structural collapse is often the physical manifestation of emotional resistance. The timeline didn't work *because* the emotional truth was too heavy to carry.
      *   **The "Click" Test:** Address the horoscope concern. A horoscope click is vague ("you value friendship"). A specific artistic click ("this character is my mother") is forensic. Distinguish between general resonance and specific recognition.
      *   **Actionable Strategy:** Don't try to solve the mystery of the past before writing. Use the writing to solve the mystery. Treat the draft as an investigation, not a construction site.
      *   **The "Working Truth":** Advise the user to adopt the narrative that unlocks the door, not the one that locks it. If the mother story scares them into silence, it's not the right tool *yet*. If it gives them compassion for the struggle, it is.

