answer: |-
  This is a classic, albeit painful, creative impasse. You are asking a forensic question ("What actually happened?") about a psychological event, but you need an architectural answer ("How do I build this now?").

  Here is the honest read: In fiction, structure and psyche are not separate categories. They are the same thing viewed from different angles. When a timeline collapses or a plot refuses to hold, it is rarely just a math error. It is almost always a resistance error. The subconscious is a ruthless editor; if a scene threatens to expose a nerve you aren't ready to touch, your brain will sabotage the syntax, the chronology, or the motivation to stop you from getting there.

  So, to answer your specific doubt: You do not need to choose between the structural failure and the emotional avoidance. The structural failure was the *mechanism* of the emotional avoidance. The timeline didn't work *because* the mother material was too heavy to carry with the tools you had at the time. Your conscious mind told you the bridge was broken; your subconscious knew the cargo was too dangerous.

  Regarding the "horoscope" fear: Barnum effects rely on vagueness ("you have a great need for other people to like and admire you"). Specificity is the antidote. If your friend had said, "You quit because you're afraid of success," that's a horoscope. If she said, "You quit because this character is your mother," and you felt a "horrible click," that is forensic. That is recognition. The discomfort you feel is not a sign she is wrong; it is a sign she hit the load-bearing wall.

  However, knowing this doesn't mean you must psychoanalyze yourself before you write. That is a trap. You cannot think your way into the truth of a draft; you can only write your way there. The "structural story" is still useful because it contains the map of where the resistance occurred. Look at the scenes where the timeline collapsed. Those are the crime scenes. Those are the places where the mother-story is bleeding through.

  Do not try to decide which story is the "real" one. Instead, treat the emotional insight as a craft tool. If the protagonist is your mother, the structural problems likely stem from trying to force her into a plot that doesn't honor her reality. The fix isn't just to admit the truth; it's to let that truth dictate the structure.

  Verdict: Treat the emotional truth as the structural key.
