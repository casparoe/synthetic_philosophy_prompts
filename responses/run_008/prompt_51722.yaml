  My friend Kate and I have been going through Twin Earth–style cases for a philosophy of language study group, and I want to figure out what rule she's actually running before I bring her my hard cases. Her verdicts so far: Twin Oscar's "water" on Twin Earth refers to XYZ, obviously; Earthlings in 1750, before anyone knew any chemistry, were still talking about H2O when they said "water"; her word "elm" means elm even though she'd happily point at a beech, since the botanists carry the meaning for her; her uncle, who thinks arthritis is a stomach condition, still means arthritis when he says "my arthritis is acting up"; and on an isolated island where everyone, wisest elders included, calls whales "fish," their word "fish" genuinely includes whales — the community's own usage wins even when it's wrong by our lights.

  Now the cases I want to spring on her: (1) Twin Oscar moves to Earth in his twenties, lives here fifty years, marries an Earthling, fully joins our linguistic community, and keeps saying "water" — does his "water" now mean H2O, or is it still stuck on XYZ? (2) A hermit who's never left his valley, where a prankster secretly piped in XYZ so every clear drinkable liquid in his enviroment is XYZ — does his "water" mean XYZ? (3) Astronomers discover Earth's oceans are 50% H2O and 50% XYZ, indistinguishable by any test anyone had ever run — does "water" now mean both, one, or neither?

  You're a professional philosopher of language, so take this seriously: brainstorm the candidate rules first (causal-historical chains from the original coinage, deference to whichever experts count, whatever-substance-dominates-your-environment, and anything else that fits her five verdicts), say which verdicts each rule captures and where each has to strain, then predict Kate's answer on each of the three new cases with a best guess and your reasons for prefering it, and finally tell me what further case would best split the remaining candidate rules appart. I care less about the right answers than about whether her track record actually determines them.
