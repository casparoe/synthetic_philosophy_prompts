answer: |-
  # The Reference Class Compass: A Diagnostic Quiz

  **Instructions:** Read each scenario and select the response that best matches your immediate philosophical instinct. Do not overthink the labels; choose the action you would actually take or the statement you would actually make. At the end, tally your scores according to the key to find your "Leaf."

  ---

  ### The Cases

  **1. The Actuary's Dilemma**
  A newlywed couple asks you for the probability their marriage will end in divorce. You have data for: (a) all marriages, (b) marriages in their state, (c) marriages of college-educated people aged 20–25.
  *   **A.** Calculate the rate for the most specific group (c) that still has statistically significant data.
  *   **B.** Ask them why they want to know. If it's for a prenup, use financial risk classes; if it's for counseling, use psychological compatibility classes.
  *   **C.** Explain that "probability of divorce" applies to populations, not to their specific relationship as a unique historical entity.

  **2. The New Prisoner**
  A prisoner just arrived at a facility and asks for the median sentence length served by people like him. You have data on: (a) all inmates, (b) inmates with his crime, (c) inmates with his crime + prior record. The numbers vary wildly.
  *   **A.** Report the range of medians from (b) and (c) rather than a single number.
  *   **B.** Use the data for (c), as it is the narrowest relevant class.
  *   **C.** Assign weights to (b) and (c) based on how predictive you think "prior record" is, then average the results.

  **3. The Doomsday Argument**
  You are considering the "Doomsday Argument" (that your birth rank suggests humanity will end sooner rather than later). The conclusion depends on whether the reference class is "all humans," "all observers," or "all conscious beings."
  *   **A.** Treat yourself as a random sample from "all humans" and run the calculation.
  *   **B.** The calculation is sensitive to the class definition; since there is no fact of the matter about the "right" class, the conclusion is indeterminate.
  *   **C.** The argument assumes you are a random sample from a set that includes future people, which is a category error regarding self-location.

  **4. The Hotel Room**
  You wake up in a hotel room. You don't know if the hotel has 10 rooms or 1,000 rooms. You have no prior information about the chain. What is your credence you are in Room 1?
  *   **A.** It's indeterminate. You can't apply the Principle of Indifference to the size of the hotel without more data.
  *   **B.** It depends on the bet. If you're betting against a owner who knows the size, use game theory; if you're just curious, assume 50/50 on the hypotheses.
  *   **C.** Assign a scale-invariant prior over the possible number of rooms and update based on your room number.

  **5. The Rare Disease**
  A patient tests positive for a rare disease. The test is 99% accurate. The disease prevalence is 1 in 10,000.
  *   **A.** The probability they have the disease depends on whether this is for public health tracking (population rate) or individual treatment (posterior probability).
  *   **B.** Use Bayes' theorem to combine the base rate (1 in 10,000) with the test accuracy to get a specific posterior.
  *   **C.** Strictly speaking, the patient either has it or doesn't. "Probability" here is just a measure of our ignorance, not a property of the case.

  **6. The Biased Coin**
  You have a coin that looks normal but might be biased. You haven't flipped it yet.
  *   **A.** The probability of heads is a physical property of the coin's setup. Until we measure the setup, we can't assign one.
  *   **B.** Assign 50% based on symmetry/ignorance, then update as you flip.
  *   **C.** Look at the long-run frequency of coins minted by this specific factory.

  **7. The Climate Event**
  Policymakers ask for the probability of a "once-in-a-century" flood occurring in the next decade due to climate change. This specific atmospheric configuration has never happened before.
  *   **A.** Average the outputs of all available climate models, weighting them by past performance.
  *   **B.** There is no single frequency for a unique climate state. Report a range of possibilities derived from different models.
  *   **C.** The "probability" is a tool for communication. Choose the number that best motivates the required policy response.

  **8. The Job Candidate**
  You are hiring. Candidate X graduated from University Y (high success rate) but scored low on Interview Z (low success rate). The statistics conflict.
  *   **A.** Refuse to give a single hiring probability. The evidence is conflicting, so your credence should be a set of values.
  *   **B.** Combine the stats. If University Y is 70% success and Interview Z is 30%, average them or use a logistic regression.
  *   **C.** Use the University stat. It's a more stable, long-term reference class than a single interview score.

  **9. The Lottery Ticket**
  You hold a ticket in a fair lottery with 1 million tickets.
  *   **A.** Your credence should be 1/1,000,000, but this is a statement about your rational state, not the ticket itself.
  *   **B.** The question is trivial. But if you were selling the ticket, the "probability" would be the market price, which varies by buyer.
  *   **C.** It is false to say the ticket has a probability of winning. It has a deterministic physical trajectory; we just lack the data to compute it.

  **10. The Alien Artifact**
  You find a strange device from an unknown civilization. It has a button. You press it once; nothing happens. What is the probability it activates on the second press?
  *   **A.** We cannot assume it belongs to any known class of "devices." Probability claims are unjustified here.
  *   **B.** Start with a flat prior (50%) and update with each press.
  *   **C.** The probability is undefined until we specify the class of "alien artifacts" we are comparing it to, which we can't do.

  ---

  ### Scoring Key

  Tally your answers based on the code below.

  | Q | A | B | C |
  | :--- | :---: | :---: | :---: |
  | **1** | **Narrow** | **Purpose** | **Skeptic** |
  | **2** | **Range** | **Narrow** | **Bayes** |
  | **3** | **Narrow** | **Range** | **Skeptic** |
  | **4** | **Range** | **Purpose** | **Bayes** |
  | **5** | **Purpose** | **Bayes** | **Skeptic** |
  | **6** | **Skeptic** | **Bayes** | **Narrow** |
  | **7** | **Bayes** | **Range** | **Purpose** |
  | **8** | **Range** | **Bayes** | **Narrow** |
  | **9** | **Bayes** | **Purpose** | **Skeptic** |
  | **10** | **Skeptic** | **Bayes** | **Range** |

  **Count your totals for each category:**
  *   **NARROW (N):** \_\_\_\_\_
  *   **RANGE (R):** \_\_\_\_\_
  *   **PURPOSE (P):** \_\_\_\_\_
  *   **BAYES (B):** \_\_\_\_\_
  *   **SKEPTIC (S):** \_\_\_\_\_

  **Find your Leaf:**
  *   **Highest Score = N:** *The Reichenbachian.* You believe the correct probability is the frequency in the narrowest relevant reference class for which reliable statistics exist.
  *   **Highest Score = R:** *The Imprecise Probabilist.* You believe conflicting classes reveal that rational credence is often a range or set, not a point value.
  *   **Highest Score = P:** *The Pragmatist.* You believe the reference class is fixed by the interests, goals, or context of the inquirer.
  *   **Highest Score = B:** *The Subjective Bayesian.* You believe we should place priors over candidate classes/models and average them to get a single credence.
  *   **Highest Score = S:** *The Single-Case Skeptic.* You believe probability applies to repeatable setups or populations, and applying it to unique individuals/events is a category error.

  *(Tie-Breaker: If tied between N and B, choose B. If tied between R and P, choose P. If tied between S and anything else, choose the non-S option.)*

  ---

  ### Instructor's Honesty Note: Limitations & Blind Spots

  Since this is a seminar project, you must acknowledge where the quiz fails to discriminate. Here is the philosophical metadata for your appendix:

  **1. The Indistinguishable Pairs**
  *   **Narrow (N) vs. Bayesian (B):** This is the hardest separation. A Bayesian with a "frequency-based prior" will often select the same options as a Reichenbachian Frequentist. In Q2, Q6, and Q8, the "Bayes" answer often mathematically converges with the "Narrow" answer if the priors are uninformative. The quiz forces a distinction in *reasoning* (averaging models vs. picking the best data), but in practice, these agents often bet the same way.
  *   **Range (R) vs. Pragmatist (P):** These two often prescribe identical actions. If the purpose of inquiry (P) is "avoid error," the Pragmatist gives a range. If the classes conflict (R), the Imprecise Probabilist gives a range. In Q4 and Q7, the distinction between "it depends on the goal" and "the evidence is inherently indeterminate" is subtle and may not be captured by the options provided.

  **2. The "No Leaf" Zone (Incoherent Combinations)**
  There is a specific answer profile that the scoring key will force into a Leaf, but which represents a philosophically unstable position:
  *   **The Ontological Schizophrenic:** A student who scores high on **Skeptic (S)** for Q1 (Divorce) and Q9 (Lottery) but high on **Narrow (N)** for Q5 (Medical) and Q6 (Coin).
  *   **Why it's a problem:** This profile denies single-case probability for social/legal events but affirms it for medical/physical events. While some philosophers argue for *pluralism* (different types of probability for different domains), this specific combination often signals an unexamined intuition rather than a defended position. The quiz treats this as a "Skeptic" or "Narrow" win depending on the tie-breaker, masking the inconsistency.
  *   **The "Everything is Range" Dump:** If a student selects **Range (R)** for every question, they land firmly on the Imprecise Probability leaf. However, if they select **Range** only when the statistics conflict (Q2, Q8) but **Narrow** when they don't (Q1, Q6), they might tie between N and R. The tie-breaker pushes them to N, but their actual view might be a hybrid ("Frequentism unless classes conflict") which isn't one of the 5 leaves.

  **3. The Bayesian Dominance**
  Notice that the **Bayes (B)** option is available in 9 out of 10 questions. Subjective Bayesianism is often a "universal solvent" in philosophy of probability; it can mimic Frequentism (via priors) or Pragmatism (via utility functions). A sophisticated Bayesian could arguably justify *any* of the options provided. The quiz relies on the *naive* Bayesian response (averaging models/priors) to distinguish them from the *methodological* Frequentist (picking the best class). If your classmates are sophisticated Bayesians, they may score high on B regardless of their actual stance on the Reference Class Problem.

  **4. Unexplored Territory**
  *   **The "Causal" Leaf:** None of the leaves explicitly capture the position that "The right reference class is the one that captures the *causal mechanism*." Sometimes this maps to Narrow (if the cause is specific) or Purpose (if the cause is interest-relative), but it is a distinct view (e.g., Hitchcock's causal account) that this quiz collapses into N or P.
  *   **The "Best System" Leaf:** A Humean Best System Account (Lewis) might pick the class that best balances simplicity and strength in the system of laws. This might look like Narrow (N) or Bayesian (B) depending on the world, but it's ontologically distinct. The quiz does not have a leaf for Humean Objective Chance.
