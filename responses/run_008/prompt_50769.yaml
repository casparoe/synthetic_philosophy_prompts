answer: |-
  Hi there, it sounds like a fantastic seminar and I would be happy to help you construct these materials. Here is the exam question followed by the model answer and the marking scheme, all written as continuous prose without any headings or bullet points as you requested.

  The essay question would appear on the exam paper as follows. Consider the view known as integrationism, which holds that some things compose an object if and only if they are mutually dependent on each other for the existence of the whole, such that destroying any one part would cause the whole to cease existing. This view aims to restrict composition to cases of genuine unity while avoiding the extremes of nihilism and unrestricted composition. Write an essay that stress-tests this view by addressing three specific challenges. First, explain whether integrationism successfully dodges the arbitrariness worries that often push metaphysicians toward unrestricted composition, or if it merely relocates the arbitrariness to the dependence relation itself. Second, evaluate how the view handles awkward cases, specifically artifacts with removable parts, living organisms undergoing gradual material replacement, and collections sitting at the threshold where the dependence relation begins to hold. Third, and most importantly, argue whether a criterion based on mutual dependence actually answers the special composition question or if it quietly changes the subject to questions about persistence conditions or merely counts how many objects are in a room without establishing genuine ontological commitment.

  A model response would look like this. Integrationism proposes that composition is grounded in mutual existential dependence, offering a middle path between the extravagance of unrestricted composition and the austerity of nihilism. The primary appeal is that it captures the intuition that objects are unified wholes rather than mere collections. However, the view must confront the charge of arbitrariness that motivated universalism in the first place. If dependence is a matter of degree, then composition becomes vague, violating the principle that existence is not a vague matter. Integrationists might reply that dependence is binary, but this risks brutalism where the cutoff point is unexplained. For example, two bricks leaning against each other may support one another slightly, but at what precise angle does this support become existential dependence? If the view cannot specify this without arbitrariness, it inherits the very problem it sought to solve.

  Consider artifacts with removable parts, such as a car with a replaceable tire. A car exists even if a tire is removed, and the tire can exist independently of the car. Does the tire depend on the car for its existence? Probably not. Does the car depend on that specific tire? No, because it can be replaced. Integrationism might therefore deny that cars are composite objects, which clashes with common sense. To save the view, one might argue that the car depends on some tire or other, but this shifts the criterion from specific parts to functional roles, which complicates the metaphysical grounding of the object. It suggests the view is tracking functional unity rather than ontological composition. Living organisms present a different challenge due to gradual replacement. A human being replaces most cells over seven years. If composition requires mutual dependence of specific parts, the person would cease to exist as cells die. Integrationists must clarify whether dependence relates to the current stages of parts or the functional roles they occupy. If it is the latter, the view risks collapsing into a functionalist account of persistence rather than a criterion for composition.

  This leads to the worry that integrationism changes the subject. The special composition question asks when some things compose an object, not when an object persists through change. Dependence explains why an object stays in existence, not why it begins to exist when parts are arranged. Unless integrationists can distinguish synchronic dependence for composition from diachronic dependence for persistence, the view answers a different question than the one posed. Furthermore, there is the issue of counting. If dependence determines whether parts form a unity, it does not necessarily entail that a new ontological item exists over and above the parts. We might say the parts are unified without saying a new object exists. This suggests the view might be better suited as a criterion for unity rather than existence. Ultimately, integrationism offers a compelling description of organic unity but struggles as a general metaphysical principle. It handles organisms better than artifacts but falters on precision. The most damaging objection is that it conflates composition with persistence conditions. It tells us when parts are tightly connected, but not when that connection generates a new being. Thus, while it avoids the extravagance of universalism, it may fail to provide a rigorous answer to the special composition question.

  The grading rubric should be understood in this way. An answer worthy of an A grade, ranging from seventeen to twenty marks, will explicitly distinguish between synchronic and diachronic dependence and argue why this distinction matters for the special composition question. It will not merely list the awkward cases but will explain why artifacts and organisms pose different metaphysical problems for the view. Crucially, an A answer will take a stance on whether integrationism changes the subject, offering a reasoned argument about the difference between unity and existence rather than just asserting that there is a difference. It will engage with the arbitrariness worry by discussing vagueness in the dependence relation itself. A B grade answer, ranging from thirteen to sixteen marks, will correctly describe the view and identify the awkward cases but will treat the objections as a list rather than weaving them into a coherent argument. It may mention that persistence is different from composition but will fail to explain why dependence criteria blur this line. It will likely accept the integrationist definition without questioning whether dependence is truly binary or vague. A C grade answer, ranging from nine to twelve marks, will summarize the view accurately but will struggle to apply it to the specific cases mentioned in the prompt. It may confuse the arbitrariness worry with general skepticism about composition. Answers below this range will fail to address the prompt directly or will misunderstand the core definition of integrationism provided in the question. To achieve the highest marks, the student must demonstrate that they understand that solving the special composition question requires more than just describing when parts stick together; it requires showing why that sticking together generates ontological commitment.
