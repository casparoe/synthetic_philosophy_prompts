      *   **Single Person Accumulation:** This removes "separateness of persons." If one person gets $3^^^3$ specks, is it worse than 50 years torture?
          *   If Specks side says "No," they are committed to a very strong discontinuity within a single life.
          *   If they say "Yes," they admit aggregation works *intrapersonally* but not *interpersonally*. This shifts the debate to "Why does the boundary of a skin matter?" (The Separateness of Persons objection).

