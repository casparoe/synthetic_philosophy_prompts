  My friend keeps going on about how agriculture was a huge mistake and lent me this pop-history book on the origins of inequality, and one chapter boils the whole argument down to a page I want to sanity-check. Here's what it says, from memory:

  "Roughly 12,000 years ago humans invented farming, and it was the worst mistake we ever made. Anthropologists like Marshall Sahlins showed that hunter-gatherers were the original affluent society: they worked only three or four hours a day and spent the rest of their time at leisure, because their wants were few and easily met. Then farming came along and everything got worse. Skeletons tell the story: before agriculture people routinely lived into their seventies, but once they started living on grain their life expectancy crashed to around thirty. Farmers were shorter, their teeth were rotten, and they caught epidemic disease for the first time from living in their own waste next to their animals. Farming also created inequality -- once you have fields and granaries you have property, and once you have property some people grab most of it, so hierarchy begins with the first farmers. Jared Diamond called agriculture the worst mistake in the history of the human race, and the kicker is that foragers had no reason to switch: farming only won because it feeds more people per acre, so farmers simply outbred and pushed out their healthier, happier neighbors. Every civilization since has been built on a permanent downgrade in the quality of human life."

  I'm inclined to believe a lot of this honestly, the forager-life part especially, but something about it feels too tidy. Can you go through it piece by piece and tell me what's solid, what's a simplification, and what's actually wrong? A few things I specifically want to know: whether Sahlins really claimed what the book says he did, whether the skeleton stuff really shows foragers lived that much longer, and whether the inequality claim survives (I have a vague memory that some forager groups on the northwest coast of North America were sedentary and had chiefs and slaves -- does that matter here?).

  Format your answer in these sections, in this order: "The solid part" (~100 words, just what the book gets right), "The wobbles" (~250 words, going through the specific misrepresentations one by one, this is the section I care about most), "Does the conclusion survive" (~100 words, whether the permanent-downgrade claim still stands once you fix the wobbles), and "Verdict" (2-3 sentences on whether I can keep recommending this book to people).
