  The solid part
  The book correctly cites Jared Diamond's provocation that agriculture was humanity's "worst mistake." Skeletal evidence supports claims that early farmers suffered worse health outcomes than foraging predecessors: average height decreased, dental caries increased due to starchy diets, and infectious disease rose from sedentism and proximity to livestock. The demographic argument is also sound: farming supports higher population densities per acre, allowing agricultural societies to expand and displace foragers regardless of individual quality of life. These core biological and demographic points remain the strongest evidence for the "downgrade" hypothesis.

  The wobbles
  Several claims are exaggerated or outdated. Marshall Sahlins did coin "Original Affluent Society," but he argued affluence was psychological (limited wants), not that everyone worked exactly three hours daily; labor varies wildly by ecology, and some foraging groups work quite hard seasonally. The life expectancy claim is the biggest error: foragers did not "routinely" live into their seventies. While infant mortality was lower than in early farming societies, adult foragers typically died in their 50s or 60s. The "30 years" figure for farmers reflects high child mortality from weaning diseases and crowding, not a halving of adult lifespan.

  Furthermore, the inequality narrative is too linear. As you suspected, complex hunter-gatherers like the Northwest Coast peoples developed hierarchy, slavery, and sedentism without farming. Recent archaeology suggests inequality fluctuated wildly in early societies; some early farmers lived relatively egalitarian lives for centuries before states emerged. The book presents a deterministic trap: farming causes property, which causes hierarchy. In reality, social choices mattered. Some groups adopted farming without immediate stratification, while others maintained hierarchy without crops. The text ignores recent scholarship showing humans experimented with social structures flexibly, rather than being locked into a "downgrade" trajectory immediately upon planting seeds. Additionally, the claim that foragers had "no reason to switch" ignores climate pressure; as the Holocene warmed, wild resources became less predictable, making cultivation a risk-management strategy, not just a demographic accident. Regional variation was high, and the transition took millennia, not a single generation.

  Does the conclusion survive
  The core insight remains valuable: the transition to agriculture involved significant trade-offs in individual health and autonomy. Skeletal data confirms a decline in nutrition and increased disease burden for early farmers. However, the "permanent downgrade" framing is too rigid. Humans didn't stumble into a trap; they navigated complex social and environmental pressures. Inequality wasn't an inevitable biological consequence of grain but a political choice that emerged unevenly. While life became harder physically, farming enabled the cultural complexity of modernity. The downgrade was real for the individual body, but not necessarily for the species' capacity.

  Verdict
  Keep the book as a provocative starting point, but warn readers it relies on outdated binaries. It's useful for challenging progress narratives, but should be paired with newer archaeology like Graeber and Wengrow's The Dawn of Everything.
