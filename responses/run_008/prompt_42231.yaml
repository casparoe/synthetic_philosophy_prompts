answer: |-
  # DECISION TREE: THE UNITY OF THE PROPOSITION

  **START:** *Some sentences with multiple terms are true (e.g., "a is F"). This truth calls for an account of how their ingredients constitute a single whole.*

  **Q1. Does this truth require an entity *over and above* the sentence's constituents (objects, properties, the relation itself) to unite them?**
  *   **NO:** (The constituents themselves do the work). → Go to **Q2**.
  *   **YES:** (A unifier is required). → Go to **Q3**.

  **Q2. (If NO) Is that because the whole truthmaker picture is confused, or merely because the constituents, arranged in the right way, suffice on their own?**
  *   **CONFUSED:** (Talk of "facts" or "unities" misleads). → **LEAF A: Deflationary Dissolution**.
  *   **SUFFICE:** (Arrangement is enough). → Go to **Q5**.

  **Q3. (If YES) Is the unifier itself a further constituent needing unification, or something that applies to the whole without being one of its relata?**
  *   **FURTHER CONSTITUENT:** (The relation acts as a tie). → Go to **Q4**.
  *   **NOT A RELATUM:** (A non-relational nexus/instantiation). → Go to **Q5**.

  **Q4. Are relations themselves ordered, so that the order of relata is internal to the relation, or must order be imposed from outside by something further?**
  *   **INTERNAL:** (The relation *is* the order). → **LEAF B: Positionalism**.
  *   **EXTERNAL:** (Order requires direction). → Go to **Q5**.

  **Q5. Is the unity of judgment and propositional-attitude reports a separate problem from the unity of states of affairs in the world, or the same problem encountered twice?**
  *   **SEPARATE:** (Judgment unifies; the world does not, or vice versa). → **LEAF C: Multiple Relation Theory**.
  *   **SAME:** (Propositions/Facts exist independently of being judged). → **LEAF D: Propositional Realism**.

  ***

  ### POSITION MAP & COMMITMENTS

  | Leaf | Position | Hardest Commitment |
  | :--- | :--- | :--- |
  | **A** | **Deflationary Dissolution** | Denying that true sentences require any ontological truthmaker beyond linguistic use. |
  | **B** | **Positionalism** | Accepting that relations are individuated by their argument-places (complex metaphysics of relations). |
  | **C** | **Multiple Relation Theory** | Denying propositions exist; the mind's act of judging provides the sole unity. |
  | **D** | **Propositional Realism** | *Split below:* Stopping Bradley's Regress without collapsing into incoherence. |

  **Note on Leaf D (Realism):** This leaf contains two distinct views separated by **Q3**:
  1.  **Armstrong-style States-of-Affairs** (Q3 = *Not a Relatum*): Instantiation is a fundamental, non-relational tie.
      *   *Hardest:* Claiming instantiation is an entity but *not* a relation.
  2.  **Standard Constituent Realism** (Q3 = *Further Constituent*): Relations unite directly; regress is benign or stopped by nature of exemplification.
      *   *Hardest:* Explaining why the unifier doesn't itself require unification.
      *   **FLAG:** These two are often hard to separate in practice; Armstrong views his nexus as a constituent of the state of affairs, blurring Q3.

  **Note on Logical Space:**
  *   **Q1=YES + Q5=SEPARATE:** This combination (Facts exist, but Judgment unity is fundamentally different) corresponds to no major historical position. It is logically possible but unexplored, perhaps because it doubles the metaphysical cost without explanatory gain.
  *   **Q1=NO + Q5=SAME:** This yields a **Constituent Ontology** (world has unity, no extra entities). It fits under Leaf D's "Standard" branch but without the extra unifier.

  ***
  *Handout for Graduate Reading Group | Metaphysics of Propositions | Session: Bradley's Regress*
