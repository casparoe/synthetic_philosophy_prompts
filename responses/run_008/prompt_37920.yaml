  (a) **Candidate Decision Rules**

  Based on your colleague's track record, two distinct decision rules emerge that are consistent with all five past verdicts.

  **Rule 1: Threshold Causalism with Reward Exception**
  *   **The Rule:** Maximize causal expected utility (act to bring about the best physical consequences). *Exception:* If a predictor with >90% accuracy has already placed a reward contingent on your choice, treat your choice as determining the presence of that reward (i.e., comply with the prediction to secure the gain). If complying with a prediction results only in a loss or the reward is already impossible, revert to standard causal dominance.
  *   **Fit to Record:**
      *   *Newcomb 99%:* Exception triggers (high accuracy + reward possible). One-boxes.
      *   *Newcomb 51%:* Exception fails (accuracy <90%). Causal dominance applies. Two-boxes.
      *   *Lesion/Gum:* No predictor involved. Causal dominance applies. Smokes/Chews.
      *   *Pre-Flip Deal:* Future coin flip. Causal expected utility is positive. Accepts.

  **Rule 2: Reliable Prediction Alignment**
  *   **The Rule:** If a highly accurate predictor (>90%) has made a prediction about your action, act in accordance with that prediction to maintain consistency with the algorithm the predictor simulated. In scenarios without a reliable predictor (common causes, pure chance), maximize causal expected utility.
  *   **Fit to Record:**
      *   *Newcomb 99%:* Predictor expects One-Box. She One-Boxes.
      *   *Newcomb 51%:* Predictor unreliable. Rule defaults to causal utility. Two-Boxes.
      *   *Lesion/Gum:* No predictor. Defaults to causal utility. Smokes/Chews.
      *   *Pre-Flip Deal:* No predictor involved yet (coin is fair). Causal utility positive. Accepts.

  (b) **Implications for Tomorrow's Case**

  The two rules diverge sharply on the Post-Flip Deal.

  *   **Under Rule 1 (Threshold Causalism):** She will **refuse to pay**. The coin has already landed Heads; the Tails payout is impossible. Paying now yields a certain financial loss with no causal possibility of reward. The "Reward Exception" only applies when compliance secures a gain (as in Newcomb), not when it merely validates a past prediction at a cost. Causal dominance dictates keeping the money.
  *   **Under Rule 2 (Prediction Alignment):** She will **pay**. The flipper predicted she would pay. To remain consistent with the decision algorithm that was offered the deal (and to honor the logical link that made the offer possible), she must fulfill the prediction, even if this specific branch yields a loss. The focus is on being the *type* of agent the predictor identified, not just the local outcome.

  (c) **Best Guess at Her Actual Verdict**

  **Verdict:** She will **refuse to pay.**

  **Reasoning:**
  The tension between her Newcomb verdict (ignoring sealed boxes) and her Lesion verdict (respecting the fixed lesion) is resolved by noting *what* is fixed. In Newcomb, the box content is fixed *by a prediction of her choice*; in Lesion, the lesion is fixed *by biology independent of her choice*. She treats predictive links as binding but physical/common-cause links as inert.

  However, the **Gum case** is the tie-breaker. She chews gum while explicitly conceding that "gum-chewers fare worse overall." This demonstrates that she prioritizes **local causal utility** (enjoying the gum now) over **statistical type-optimization** (being the kind of person who avoids sores). She is willing to be the "losing type" if the specific action is causally beneficial (or neutral) in the moment.

  In Tomorrow's Case, paying is a local causal loss. Being "the kind of person who pays" might be statistically advantageous for future deals (like the Gum chewers faring worse overall), but her Gum verdict shows she ignores long-run statistical fare in favor of immediate causal outcomes when the two conflict. Furthermore, her Lesion reasoning ("nothing she does now can affect it") applies perfectly to the coin flip: the Heads result is physically fixed. Unlike Newcomb, where her choice "determines" the box content via the predictor, here her choice cannot change the coin. Given her strong CDT leanings in Common Cause cases (Lesion/Gum), she will likely treat this as a fixed physical loss and cut her losses.

  (d) **The Discriminating Case**

  To cleanly separate **Threshold Causalism** (Rule 1) from **Prediction Alignment** (Rule 2), present her with **Kavka's Toxin Puzzle**:

  *   **The Setup:** An eccentric billionaire places $1,000,000 in her bank account *tonight* if a reliable predictor (99% accurate) predicts she will *tomorrow* drink a harmless but unpleasant toxin. The money is hers to keep regardless of whether she drinks. Tomorrow, she has the money in hand and must decide whether to drink the toxin. There are no future interactions or reputation effects.
  *   **The Separation:**
      *   **Threshold Causalism** implies she should **keep the money and not drink**. Drinking causes discomfort (negative utility) and secures no additional reward (money is already in the bank). Causal dominance forbids drinking.
      *   **Prediction Alignment** implies she should **drink**. The predictor predicted she would drink. To align with the algorithm that secured the million (and to be consistent with the prediction), she must follow through, even if the local causal outcome is negative.

  *   **Interpretation:** If she keeps the money and spits out the toxin, Rule 1 is confirmed (she is a local causal maximizer). If she drinks the toxin, Rule 2 is confirmed (she is a consistency/commitment maximizer). Given her Gum verdict, I predict she will not drink.
