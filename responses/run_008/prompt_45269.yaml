answer: |-
  **1. The Question**

  Two locum doctors work their final night shift. A patient presents with a reaction; Drug X is contraindicated. Dr. A checks a reliable source and learns this. Dr. B has a true hunch. Both withhold Drug X; patient survives. Stipulate: neither doctor ever practices again, nor ever revisits this belief. It is a one-shot belief with no downstream consequences. Plato's 'tethering' and instrumental defenses fail here. Is Dr. A's cognitive state epistemically better than Dr. B's? Defend your answer. Avoid theory classification; explain where the extra value resides, if any, given that truth and practical outcomes are identical and no future utility exists.

  ***

  **2. Model Answer**

  Dr. A's cognitive state is epistemically better than Dr. B's, despite the identical truth values and practical outcomes. The stipulations successfully block instrumental defenses: since neither doctor ever uses the belief again, Plato's concern about true opinions "running away" is irrelevant, and there are no future successful actions to swamp. Therefore, if A's state is better, the value must be non-instrumental and intrinsic to the belief's formation rather than its consequences.

  The primary objection is the swamping problem. If the truth is already present in B's belief, what value does A's reliable source add? In this specific instance, the reliability of A's source did not cause the truth; B's hunch arrived at the same truth without it. To claim A is better simply because the source is reliable risks praising the machine rather than the coffee. However, reliability matters here not because it guaranteed truth in this token instance, but because it establishes a non-accidental connection between the believer and the fact.

  B's belief is true, but it is luckily true. In nearby possible worlds where the hunch fails, B believes falsely. A's belief, grounded in a reliable source, remains true across those same nearby worlds. Even though the stipulation says A never faces the question again, the epistemic status of a belief is not determined solely by its actual-world history but by its modal stability. A's belief represents a successful exercise of cognitive agency; B's represents a lucky accident. Epistemic value resides in this anti-luck condition. We value knowledge because it reflects a competence that respects the truth, not merely because it happens to align with it.

  One might object that A merely acted more reasonably, conflating practical rationality with epistemic value. It is true that A is practically praiseworthy for checking the source. However, this does not fully capture the epistemic distinction. If epistemic value were solely about guiding action, the stipulation (identical actions) would erase the difference. But epistemology concerns our standing as cognitive agents relative to the truth. A's belief manifests a proper sensitivity to evidence; B's does not. This sensitivity has value even if never exercised again, just as a perfectly struck match has value as a functioning tool even if never used to light a fire.

  Therefore, the extra value lives in the manner of acquisition. It is the difference between touching the truth and grasping it. B touches the truth by accident; A grasps it through competence. While the output is identical, the relation to the truth differs. Since epistemology values that relation independently of future utility, A's state is epistemically superior. The swamping problem is avoided because we are not valuing the reliable process for its output (which is swamped by truth), but for the non-accidental status it confers on the belief itself.

  ***

  **3. Marking Scheme (20 Marks Total)**

  **Section 1: Engagement with Case Stipulations (5 Marks)**
  *   **3 Marks:** Explicitly acknowledges the "one-shot/no future use" stipulation and explains why this blocks Plato's tethering argument (i.e., beliefs cannot run away if there is no later).
  *   **2 Marks:** Explicitly acknowledges that practical outcomes are identical and explains why this blocks standard instrumental defenses (i.e., no downstream utility differs).
  *   *Deduction:* -1 mark for every failure to reference a specific stipulation when dismissing a standard argument.

  **Section 2: Core Argument & Stance (10 Marks)**
  *   **3 Marks:** Takes a definite stance (Yes, A is better; or No, they are equal). Ambivalent answers receive 0.
  *   **4 Marks:** Identifies a specific locus of value consistent with the stipulations (e.g., non-accidentalness, modal stability, cognitive agency, or constitutive norms). Answers that merely name a theory (e.g., "Virtue Epistemology says so") without explaining the mechanism receive 1 mark.
  *   **3 Marks:** Explains why this locus of value survives the removal of future utility (i.e., argues for intrinsic rather than instrumental value).

  **Section 3: Avoidance of Specific Pitfalls (5 Marks)**
  *   **Pitfall (a) - Practical vs. Epistemic (2.5 Marks):**
      *   **2.5 Marks:** Clearly distinguishes between "A acted more reasonably/prudently" and "A's belief has higher epistemic status."
      *   **0 Marks:** Equates acting reasonably with having a epistemically better belief without justification.
  *   **Pitfall (b) - Swamping/Reliability (2.5 Marks):**
      *   **2.5 Marks:** Acknowledges that reliability did not guarantee truth *in this specific instance* (since B is also true) and argues why reliability matters nonetheless (e.g., modal robustness).
      *   **0 Marks:** Claims A's belief is better simply because the source was reliable, implying reliability made the belief true in this instance (ignoring that B's is also true).
