  # Metaontology Diagnostic: Intuition Sorter
  **Seminar:** Metaontology | **Term:** [Insert Term] | **Instructor:** [Insert Name]

  **Instructions:** This instrument is designed to locate your pre-theoretical intuitions regarding ontological disputes. Do not worry about technical labels (e.g., "realist," "deflationist"). Answer each question based on your immediate reaction to the specific cases described. Follow the path indicated by your answer to reach a diagnostic position.

  ---

  ### The Decision Tree

  **1. The Composition Case (Shoe + Eiffel Tower)**
  Imagine you and a skeptic agree on the exact location and properties of every particle in the universe. You say, "There exists an object composed of my left shoe and the Eiffel Tower." The skeptic says, "No, there are only particles arranged shoe-wise and tower-wise."
  *   **Is there a *further fact* of the matter about whether this object exists, over and above the facts about the particles?**
      *   **YES:** Go to **Node 2**.
      *   **NO:** Go to **Node 3**.

  **2. The Common Sense Case (Chairs)**
  Accepting that there is a further fact (from Node 1), consider ordinary objects.
  *   **Is the ordinary claim "There are chairs in my office" strictly true?**
      *   **NO:** **LEAF A: Error Theory / Revisionism**
      *   **YES:** **LEAF B: Ontological Realism (Structure)**

  **3. The Variance Case (Meaning of "Exists")**
  Accepting there is no further fact (from Node 1), consider the disagreement itself.
  *   **Do the two parties mean different things by the word "exists" (or "there is")?**
      *   **YES:** Go to **Node 4**.
      *   **NO:** Go to **Node 5**.

  **4. The Translation Case (Charity)**
  If they mean different things (from Node 3):
  *   **Can the ontologist's quantifier be translated into the ordinary speaker's vocabulary without loss of meaning?**
      *   **NO:** **LEAF C: Quantifier Variance**
      *   **YES:** *(Logical Space Empty – See Commentary)*

  **5. The Framework Case (Numbers)**
  If "exists" is univocal (from Node 3), consider the mathematician vs. nominalist.
  *   **Is the question "Do numbers *really* exist?" a meaningful question with a truth value?**
      *   **NO:** **LEAF D: Neo-Carnapian Quietism**
      *   **YES:** Go to **Node 6**.

  **6. The Triviality Case (Inference)**
  If the question is meaningful (from Node 5):
  *   **Is the answer settled by trivial conceptual inference from uncontested facts (e.g., "particles are arranged chair-wise")?**
      *   **YES:** **LEAF E: Easy Ontology**
      *   **NO:** *(Logical Space Empty – See Commentary)*

  ---

  ### Diagnostic Leaves & Awkward Commitments

  *   **LEAF A: Error Theory / Revisionism**
      *   *Commitment:* Most of your ordinary existence claims (chairs, hands, tables) are strictly false, though useful fictions.
  *   **LEAF B: Ontological Realism (Structure)**
      *   *Commitment:* Reality has a privileged structural "carving" that makes some existence claims fundamentally more correct than others.
  *   **LEAF C: Quantifier Variance**
      *   *Commitment:* Ontological opponents are not disagreeing about the world, but talking past one another in different languages.
  *   **LEAF D: Neo-Carnapian Quietism**
      *   *Commitment:* External ontological questions are pseudo-problems that dissolve once linguistic frameworks are made explicit.
  *   **LEAF E: Easy Ontology**
      *   *Commitment:* Existence questions are legitimate but trivial, settled entirely by the application conditions of our concepts.

  ---

  ### Instructor Commentary: Logical Gaps & Overlaps

  **1. Indistinguishable Leaves (The Carnap/Thomasson Problem)**
  Students landing on **Leaf D (Quietism)** and **Leaf E (Easy Ontology)** may find their practical recommendations identical. Both advise against "heavy" metaphysics and validate ordinary talk. The tree separates them based on *meaningfulness* (Node 5), but in practice, distinguishing a "meaningless pseudo-question" from a "trivially answered question" is notoriously difficult. If you found Node 5 confusing, you likely occupy the overlap between Quietism and Easy Ontology.

  **2. Empty Logical Spaces**
  *   **Variance + Translation Failure (Node 4, YES):** If "exists" is ambiguous (Node 3) but *cannot* be translated (Node 4), we lose the charity required for Quantifier Variance. This view is generally considered incoherent: if meanings are incommensurable, we cannot identify the dispute as verbal.
  *   **Meaningful + Non-Trivial + No Further Fact (Node 6, NO):** If the question is meaningful (Node 5) but not trivial (Node 6), yet there is "no further fact" (Node 1), the view is unstable. It suggests a substantive truth without a truth-maker. This space is largely unexplored because it combines deflationary metaphysics with inflationary epistemology.

  **3. The Realist Fork (Node 2)**
  Note that **Leaf B (Realism)** and **Leaf A (Error Theory)** both accept a "further fact." They differ only on whether common sense gets the fact right. If you believe there is a fact but are unsure if chairs exist, you are oscillating between Sider-style Realism and Eliminativism.

  **4. Scale Note**
  This instrument prioritizes *diagnostic clarity* over exhaustive coverage. Positions like "Fictionalism" or "Grounding Essentialism" are not terminal leaves here but may be compatible with the commitments of Leaf A or Leaf B respectively.
