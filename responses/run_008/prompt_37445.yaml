answer: |-
  This is a profound moral taxonomy you are building. You are essentially trying to distinguish between **misfortune** (things that happen to us) and **injustice** (things done to us).

  Your intuition is struggling because you are toggling between two different definitions of "cause." One is *physical causation* (did the rain stop?), and the other is *political causation* (did the system allow people to die when it could have stopped it?).

  Here is a proposed principle that captures your verdicts, resolves the tension with Sen, and handles the North Korea case.

  ### The Principle: Foreseeable Negligence of Entitlements

  A famine is a **political crime** when a governing authority (or occupying power) possesses **knowledge** of impending mass starvation and the **capacity** to mitigate it, but chooses a policy framework that prioritizes other goals (ideology, profit, war, regime stability) over the preservation of life.

  A famine is a **natural disaster** only when the governing authority lacks the **capacity** to mitigate the starvation *and* the failure to acquire that capacity was not itself the result of prior political negligence.

  #### Why this fits your verdicts:

  1.  **Ireland (1840s):** **Crime.**
      *   *Knowledge:* Yes (reports of blight and hunger).
      *   *Capacity:* Yes (food was present; trade routes open).
      *   *Prioritization:* Laissez-faire economics and colonial extraction prioritized over Irish life.
  2.  **Bengal (1943):** **Crime.**
      *   *Knowledge:* Yes.
      *   *Capacity:* Yes (British control of shipping/grain).
      *   *Prioritization:* War effort and inflation control prioritized over Bengali life.
  3.  **Great Leap Forward (GLF):** **Crime.**
      *   *Knowledge:* Yes (local cadres knew; central leadership suppressed dissenting reports).
      *   *Capacity:* Yes (the state controlled all distribution; policies could have been reversed).
      *   *Prioritization:* Ideological purity and industrialization targets prioritized over peasant survival.
      *   *Addressing your hesitation:* You feel this is less "immediate" than Ireland because the leadership believed the fantasy. However, **enforced delusion is a political choice.** When a system punishes truth-tellers (local cadres who reported low yields were purged), the leadership chooses ignorance. That chosen ignorance does not absolve them of the consequence.
  4.  **Hypothetical Drought:** **Disaster.**
      *   *Knowledge:* No (no early warning).
      *   *Capacity:* No (dirt-poor, no surplus).
      *   *Prioritization:* N/A (did everything reasonably possible).
      *   *Why this survives Sen:* Sen argues famines don't happen in *functioning* democracies. "Functioning" implies the *capacity* to respond. If a democracy is too poor to buy food, the feedback loop exists but the resources do not. This distinguishes *lack of will* (Crime) from *lack of means* (Disaster).
  5.  **Price-Protection Delay:** **Crime-ish (Negligence).**
      *   *Knowledge:* Yes (data available).
      *   *Capacity:* Yes (imports possible).
      *   *Prioritization:* Domestic farm prices prioritized over immediate hunger.
  6.  **Siege:** **War Crime.**
      *   *Knowledge/Capacity/Prioritization:* All align with direct intent to starve.

  ### Resolving the Sen Tension (The Donor Problem)

  You wrote: *"That seems to imply... rich donor countries [are] accessories in every famine they could have relieved and didn't. I don't want that conclusion."*

  To keep your principle coherent without making every Western citizen an accessory to every African famine, you must distinguish between **Primary Responsibility** and **Secondary Complicity.**

  *   **Primary Responsibility** lies with the sovereign authority governing the starving population. They hold the monopoly on force and distribution within their borders.
  *   **Secondary Complicity** lies with external actors.

  **The Fix:** Your principle defines "Political Crime" based on **Primary Responsibility.**
  This saves your "Hypothetical Drought" verdict. The local government is not a criminal because they lacked capacity. The rich donors may be *morally* blameworthy for not helping, but they are not the *political authors* of the famine. They did not construct the system that failed; they merely failed to rescue the system.

  If you accept this distinction, you don't have to drop any of your verdicts. You simply accept that "Crime" in this context refers to the breach of the Social Contract between a ruler and the ruled, not the breach of Global Humanitarian Duty.

  ### The Verdict on North Korea (1990s)

  **Case:** The "Arduous March." Following the collapse of the Soviet Union, North Korea lost subsidized fuel and fertilizer. Concurrent floods/droughts occurred. The state refused international aid for years, prioritized the military (*Songun* policy), and maintained a Public Distribution System (PDS) that favored the elite/army over the rural north.

  **Applying the Principle:**

  1.  **Knowledge:** **Yes.** The regime knew the Soviet subsidies were ending. They knew the harvests were failing. They eventually admitted the famine publicly (rarely) but hid the scale.
  2.  **Capacity:** **Yes.** This is the critical point. North Korea maintained a massive standing army and nuclear program during the famine. They diverted resources to military prestige while citizens ate grass. They also initially refused aid due to fears of inspection (regime security).
  3.  **Prioritization:** **Regime Stability > Civilian Life.** The state chose to absorb the shock on the backs of the peasantry rather than reallocate military budget or open the country to unconditional aid.

  **Verdict:** **Political Crime.**
  While sanctions and natural disasters were *contributing factors*, they were not the *sufficient cause*. A government with a different priority structure (e.g., South Korea during its own leaner years, or a hypothetical NK government that prioritized food) could have mitigated the death toll significantly. The deaths were caused by the **allocation of scarcity**, not the scarcity itself.

  ### Summary of the "Cheapest Fix"

  If you find the North Korea verdict or the Donor tension too costly, here is the cheapest fix to your framework:

  **Drop the requirement for "Intent" or "Belief."**
  Your hesitation on the Great Leap Forward stems from the idea that Mao "genuinely believed the fantasy." It does not matter. In law and ethics, **willful blindness** is equivalent to knowledge. If a leader creates a system where telling the truth is treason, they are criminally liable for the lies that result.

  If you accept that **creating a system incapable of correcting its own errors is a political choice**, then GLF, Ireland, Bengal, and North Korea all collapse into the same category: **Famines of Allocation.** The Hypothetical Drought remains the only **Famine of Availability.**

  This preserves your gut instinct: Ireland and GLF feel like crimes because the food *could* have been there (physically or economically) if the politics were different. The Drought case feels like a disaster because no politics could have conjured water.

  **Final Principle Statement:**
  > *"Famine is a crime when it results from the political allocation of scarcity rather than the physical absence of sustenance."*
