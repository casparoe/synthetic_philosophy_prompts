answer: |-
  # Part I: Architectural Map — The Logical Space

  Before presenting the diagnostic instrument, we must map the dimensions of disagreement. The tension between insect numbers ($10^{18}$) and low credence in sentience ($P < 0.1$) does not resolve into a single binary. Instead, positions diverge across five independent axes. The decision tree below is constructed to isolate these axes using concrete cases rather than theoretical labels.

  1.  **Evidentiary Weight:** How much should behavioral complexity (e.g., play) update our prior probability of sentience?
  2.  **Phenomenal Threshold:** Is the capacity to detect damage (nociception) sufficient for moral status, or is a unified, subjective experience required?
  3.  **Risk Threshold:** Is there a probability floor below which expected harm rounds to zero, regardless of the stakes?
  4.  **Aggregation:** Do harms sum linearly across individuals (Total View), or is there a non-aggregative constraint (e.g., rights, person-affecting views)?
  5.  **Meta-Ethical Handling:**
      *   *Type:* Is uncertainty about insect sentience empirical (a fact about the world) or moral (a fact about value)?
      *   *Discounting:* Should we discount moral theories we are uncertain about, compared to empirical probabilities?
      *   *Ambiguity:* Do we act when probabilities are unknown (ambiguity aversion/precaution), or only when calculable?

  The following instrument forces choices on these axes without naming them. Participants select the option that matches their intuitive judgment in each scenario.

  ***

  # Part II: The Diagnostic Instrument

  **Instructions:** Read each scenario silently. Select the option (A, B, or C) that best matches your all-things-considered judgment. Do not worry about consistency yet; answer based on your immediate intuition.

  ### 1. The Bumblebee's Toy
  Recent experiments show bumblebees will repeatedly roll small wooden balls for no food reward, suggesting "play."
  *   **A.** This significantly raises the probability they are sentient; play implies inner states.
  *   **B.** It raises the probability slightly, but could still be a blind algorithm.
  *   **C.** It changes nothing; without a cortex, behavior is just mechanics.

  ### 2. The Damaged Robot vs. The Cricket
  Imagine a robot programmed to scream and flee when damaged (nociception), but it has no inner life. Compare this to a cricket that does the same.
  *   **A.** The cricket matters morally; the robot does not. Biology/Experience is the key.
  *   **B.** Neither matters morally. Without complex cognition, both are just mechanisms.
  *   **C.** Both matter equally. The behavioral response to damage is all that counts.

  ### 3. The Malaria Mosquito
  A mosquito lands on your arm in a region with endemic malaria. Swatting it saves you a non-trivial risk of death.
  *   **A.** Swat it immediately. My life outweighs any tiny chance of its sentience.
  *   **B.** Hesitate, but ultimately swat. It has *some* stake, but not enough to override my survival.
  *   **C.** Refuse to swat unless absolutely certain it carries disease. The uncertainty protects it.

  ### 4. The Itch and the Crickets
  You can relieve a mild, 10-minute itch on your arm by pressing a button. Pressing it instantly freezes 10,000 farmed crickets (assumed painless death, but they lose their future).
  *   **A.** Press the button. 10,000 insects cannot outweigh a human's minor convenience.
  *   **B.** Do not press the button. The sheer number of insects outweighs the itch.
  *   **C.** It depends on the probability of their sentience. If $P > 1\%$, don't press. If $P < 1\%$, press.

  ### 5. The Summer Windshield
  Driving at night, you kill hundreds of insects on your windshield.
  *   **A.** This is a tragedy of scale. The number makes it a serious moral event.
  *   **B.** This is regrettable, but unavoidable. The number doesn't change the *type* of wrong, just the count.
  *   **C.** This is morally neutral. Insects are background noise.

  ### 6. The Neural Switch
  A neuroscientist offers a device that removes all pain sensation from insects but leaves their behavior (fleeing, grooming) identical. You turn it on globally.
  *   **A.** I have done something good. I removed suffering. (Sentience is empirical).
  *   **B.** I have done nothing. If behavior didn't change, nothing of moral value changed. (Sentience is moral/behavioral).
  *   **C.** I have done something wrong. I altered their nature without consent, regardless of pain. (Rights-based).

  ### 7. The Committee Vote
  You sit on an ethics board. 51% of experts believe insects are sentient; 49% believe they are philosophical zombies (no inner light). You must vote on a farming ban.
  *   **A.** Vote for the ban. The 51% probability is enough to trigger precaution.
  *   **B.** Vote against the ban. Moral uncertainty should be discounted; we need near-certainty to restrict industry.
  *   **C.** Abstain. The uncertainty is too deep to calculate expected value.

  ### 8. The Foggy Probability
  We know *something* matters about insects, but science cannot assign a number to the probability of sentience (it is "ambiguous," not just "risky").
  *   **A.** Act as if they are sentient. Ambiguity demands caution (Ambiguity Aversion).
  *   **B.** Act as if they are not. Without a number, we cannot multiply.
  *   **C.** Act proportionally to a guessed number. Treat ambiguity like ordinary risk.

  ### 9. The Future Colony
  You can prevent a colony of 1 million insects from ever being bred (they never exist), or allow them to be bred and live short, net-positive lives before dying.
  *   **A.** Allow them to be bred. Creating happy lives is good (Total View).
  *   **B.** Prevent them. Non-existent beings cannot be harmed or helped (Person-Affecting).
  *   **C.** It doesn't matter. Insects are outside the scope of population ethics.

  ***

  # Part III: The Scoring Key & Logical Leaves

  *Facilitator Note: Do not distribute this section until after participants have scored themselves. This section maps answer patterns to philosophical positions.*

  ### How to Score
  Tally your answers. There is no single "score." Instead, trace your dominant pattern through the **Decision Logic** below to find your **Leaf Position**.

  ### Decision Logic (The Tree Structure)

  1.  **Check Aggregation (Q4):**
      *   If you chose **4A** (Human itch > 10k crickets): You likely hold a **Non-Aggregative** or **High Threshold** view. Go to *Leaf E*.
      *   If you chose **4B** or **4C**: You accept some form of aggregation. Proceed to Step 2.

  2.  **Check Evidentiary Weight & Threshold (Q1, Q3):**
      *   If you chose **1C** AND **3A** (Behavior doesn't matter; Swat immediately): You hold a **Low Credence/Moot** view. The numbers don't matter because the probability is effectively zero. Go to *Leaf C*.
      *   If you chose **1A/B** AND **3B/C**: You assign non-trivial credence. Proceed to Step 3.

  3.  **Check Meta-Ethical Handling (Q7, Q8):**
      *   If you chose **7B** (Discount the 51%): You hold a **Moral Uncertainty Discounting** view. You require higher certainty for moral facts than empirical ones. Go to *Leaf B*.
      *   If you chose **8A** (Act on Ambiguity): You hold a **Precautionary/Ambiguity-Averse** view. You refuse to multiply by unknown numbers and default to caution. Go to *Leaf D*.
      *   If you chose **7A/C** AND **8C** (Calculate with guesses): You treat moral uncertainty like empirical risk. Proceed to Step 4.

  4.  **Check Scale & Population (Q5, Q9):**
      *   If you chose **5A** (Windshield tragedy) AND **9A** (Breed for positive lives): You hold the **Straightforward Expected-Value** view. Insect welfare is a dominant cause area. Go to *Leaf A*.
      *   If you chose **9B** (Prevent breeding): You hold a **Person-Affecting** view. The arithmetic breaks because you can't harm the non-existent. Go to *Leaf E*.

  ---

  ### The Leaves (Defended Positions)

  **Leaf A: The Expected-Value Dominance View**
  *   **Path:** 4B/C $\rightarrow$ 1A/B $\rightarrow$ 7A $\rightarrow$ 8C $\rightarrow$ 5A $\rightarrow$ 9A.
  *   **Description:** You treat sentience probability as an empirical risk. You multiply low credence by huge numbers ($10^{18}$). Insect welfare dominates your moral calculus.
  *   **Literature:** Standard Longtermist/Utilitarian approach (e.g., Tomasik, Matheny).

  **Leaf B: The Moral Uncertainty Discounting View**
  *   **Path:** 4B/C $\rightarrow$ 1A/B $\rightarrow$ 7B.
  *   **Description:** You accept insects *might* count, but you discount moral theories you aren't certain about. You require a higher standard of proof for "mattering" than for "existing."
  *   **Literature:** Hedden (2016), Lockhart (2000) variants.

  **Leaf C: The Moot Multiplication View**
  *   **Path:** 1C $\rightarrow$ 3A $\rightarrow$ 4A.
  *   **Description:** Your credence in sentience is so low (or your threshold for moral patienthood so high) that even $10^{18}$ insects yields negligible expected value. The multiplication is mathematically valid but morally moot.
  *   **Literature:** Skeptical Realism.

  **Leaf D: The Precautionary / Ambiguity-Averse View**
  *   **Path:** 4B/C $\rightarrow$ 8A.
  *   **Description:** You reject assigning a specific probability to sentience. Because the downside risk (mass suffering) is unbounded, you act as if they are sentient regardless of the low probability.
  *   **Literature:** Sebo & Long (2023), "Wager" arguments.

  **Leaf E: The Non-Aggregative / Person-Affecting View**
  *   **Path:** 4A OR 9B.
  *   **Description:** You reject the summation of harms across individuals (Non-Aggregative) OR you believe you cannot harm beings who would not otherwise exist (Person-Affecting). The arithmetic of $N \times P$ breaks down.
  *   **Literature:** Rights-based views, Parfit's Non-Identity Problem applications.

  ---

  ### Unoccupied Logical Space

  *   **The "High Credence Non-Aggregator" (1A + 4A):**
      *   *Status:* **Unattractive/Unstable.**
      *   *Reasoning:* If you believe insects are highly likely to be sentient (1A) but that 10,000 of them cannot outweigh a human itch (4A), you rely on a species-based lexical priority that is hard to defend without arbitrary bias.
  *   **The "Ambiguous Nihilist" (8A + 1C):**
      *   *Status:* **Incoherent.**
      *   *Reasoning:* You cannot simultaneously claim ambiguity demands caution (8A) while claiming behavior provides no evidence of sentience (1C). If there is no evidence, there is no ambiguity, only skepticism.

  ---

  ### Inseparabilities (Flags for Discussion)

  **Flag 1: Leaf A (EV Dominance) vs. Leaf D (Precautionary)**
  *   **The Problem:** Both positions recommend the same actions (protect insects, reduce farming).
  *   **Why the Tree Struggles:** Q8 (Ambiguity) attempts to separate them, but a participant might choose 8C (Calculate) simply because they dislike the word "ambiguity," while effectively acting precautionarily.
  *   **Discussion Prompt:** "If the action is the same, does the justification matter? Yes, because if new science *lowers* credence, Leaf A changes policy, while Leaf D does not."

  **Flag 2: Leaf B (MU Discounting) vs. Leaf C (Moot Multiplication)**
  *   **The Problem:** Both lead to inaction on insect welfare.
  *   **Why the Tree Struggles:** Q7 (Committee Vote) isolates the *reason*, but in practice, a 49% discount (Leaf B) looks identical to a 1% credence (Leaf C).
  *   **Discussion Prompt:** "Is the barrier to action that we don't know enough (Epistemic), or that moral theories require more certainty (Meta-Ethical)?"

  **Flag 3: Leaf E (Person-Affecting) vs. Leaf C (Moot)**
  *   **The Problem:** Both justify ignoring future insect populations.
  *   **Why the Tree Struggles:** Q9 isolates this, but participants often conflate "they don't exist yet" with "they don't matter."
  *   **Discussion Prompt:** "If we clone a human tomorrow, do they matter today? If yes, Leaf E is inconsistent for insects."
