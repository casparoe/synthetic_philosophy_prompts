answer: |-
  ### I. Dependency Structure & Mechanics (Minutes 0–10)

  **The Decision on Terminology**
  Do not invoke Grice by name. Do not use "implicature," "maxims," or "conversational logic." For first-years, these terms reify the distinction as a technical linguistic trick rather than a moral choice. Instead, use the framework of **Assertion vs. Inference**.
  *   **Lie:** You assert $P$. You believe $P$ is false. You intend the hearer to believe $P$.
  *   **Misleading:** You assert $P$. You believe $P$ is true. You intend the hearer to infer $Q$ (where $Q$ is false).

  **The Sequence**
  1.  **Minute 0–5:** Establish the *intent to deceive* as the common denominator. Both acts aim to create a false belief in the hearer. This neutralizes the Kantian hardliners immediately: if the goal is a false belief, both acts share the same moral starting point.
  2.  **Minute 5–10:** Define the mechanical difference. Use a whiteboard diagram.
      *   *Lie:* Direct path. Speaker $\rightarrow$ Falsehood $\rightarrow$ Hearer.
      *   *Misleading:* Indirect path. Speaker $\rightarrow$ Truth $\rightarrow$ Hearer's Brain $\rightarrow$ Falsehood.
      *   *Crucial Check:* Ask the class: "In the misleading case, who is responsible for the final step (the false belief)?" If they say "The Hearer," you have already lost the moral argument. Correct this immediately: "The speaker *engineered* that step."

  ### II. The Carrying Example (Minutes 10–30)

  **Evaluation of the Reference Letter**
  Your reference letter intuition is correct, but the standard "philosophy job" version is too low-stakes for undergraduates to feel the moral weight. It feels like professional etiquette rather than moral hazard.
  **Rescue the case:** Shift the context to **Public Safety**.
  *   **Scenario:** You are a supervisor writing a reference for a former employee applying to be a **school bus driver**. You know the employee has a severe, uncontrolled anger issue but no formal record of violence yet. You want to stop them from getting the job.
  *   **Option A (Lie):** "He was fired for physical aggression toward a coworker." (False. He was fired for budget errors.)
  *   **Option B (Misleading):** "He was terminated following a series of intense interpersonal conflicts." (True. The conflicts were verbal, but 'interpersonal conflicts' implies physical threat in this context.)
  *   **Outcome:** In both cases, the hiring manager believes the candidate is dangerous. The candidate does not get the job. The public is safe. The candidate is harmed (unemployed).

  **Why this shape works:**
  1.  **Identical Consequences:** The harm to the candidate and the safety benefit to the public are matched. This blocks the "it depends on the outcome" objection.
  2.  **Identical Content of Belief:** The hearer ends up believing "This person is dangerous" in both scenarios.
  3.  **High Stakes:** Students care about safety and employment fairness more than philosophy hiring.

  **Instructional Move:**
  Have students vote: Which action is worse? Then, force them to justify *why* without referencing the outcome (since the outcome is identical). This forces them to engage with the *mechanism* (the lie vs. the truth).

  ### III. Misconception Map & Defusal Sequence

  Do not save corrections for the end. Intercept errors as they arise in the logic flow.

  **1. The Definition Error ("A lie is just a false sentence")**
  *   **When it arises:** Minute 5, during the Mechanics phase.
  *   **Student thought:** "If the sentence is true, it's not a lie, so it's automatically better."
  *   **Defusal Location:** **Minute 8.** When defining the Lie, emphasize the *belief condition*. "If I tell you 'It is raining' while believing it is sunny, I am lying. If I tell you 'It is raining' and it happens to be raining, but I believed it was sunny, I am still lying."
  *   **Why here:** You must secure the definition before evaluating the morality. If they think truth-value alone determines lying, the rest of the session fails.

  **2. The Consequentialist Error ("It depends on how much harm is done")**
  *   **When it arises:** Minute 20, during the Reference Letter discussion.
  *   **Student thought:** "The lie is worse because it's more damaging to his reputation."
  *   **Defusal Location:** **Minute 22.** Explicitly construct the example so the reputational damage is identical. Ask: "In the misleading case, does the hiring manager think he is dangerous? Yes. Will they tell others? Yes. The harm is matched. If the harm is matched, can the harm explain the moral difference?"
  *   **Why here:** This forces them to look for a non-consequentialist reason (e.g., integrity, manipulation) if they feel there is a difference.

  **3. The Formalist Overcorrection ("Technical truth absolves")**
  *   **When it arises:** Minute 35, during the Moral Weighing. This is your specific worry.
  *   **Student thought:** "The misleading statement is safer because I didn't *say* the false thing, I just let them think it."
  *   **Defusal Location:** **Minute 38.** Introduce the concept of **Responsibility for Inference**. Ask: "If I dig a hole and cover it with leaves, and you fall in, is it your fault for walking? Or my fault for digging?"
  *   **Why here:** This directly addresses your worry that they will view truth as a moral shield. You must establish that *engineering* a false inference is an active moral choice, not a passive omission.

  ### IV. The Hard Case: Bald-Faced Lies

  **Judgment:** **Exclude it.**
  **Reasoning:** A bald-faced lie (e.g., denying cheating when the teacher saw it) lacks the *intent to deceive*. The definition of misleading *requires* an intent to deceive (you want them to infer the false thing). If you introduce a case where the liar *doesn't* care if they are believed, you break the symmetry of the comparison.
  **Placement:** If a student raises it, acknowledge it as a "boundary case for the definition of lying" but park it. Say: "That challenges what a lie *is*. Today we are assuming both acts *are* attempts to deceive, and asking which *method* is worse. We will handle cases where deception fails or isn't intended in a later unit."
  **Risk:** Including it consumes 10 minutes of definition-haggling that distracts from the core moral comparison.

  ### V. Explicit Exclusions

  Openly state these boundaries at Minute 10 to prevent scope creep:
  1.  **Gricean Machinery:** "We are not analyzing linguistic maxims today. We are analyzing moral responsibility for what you cause others to think."
  2.  **Mental Reservation:** "We are not covering historical doctrines where you add silent caveats to your words. We are looking at standard communication."
  3.  **Legal Perjury:** "The law cares about oaths and specific wording. Ethics cares about the intent to create false belief. A legal loophole is not necessarily a moral pass."

  ### VI. Assessment Question (Minutes 45–50)

  Do not ask them to define the terms. Ask them to apply the distinction to a novel scenario where the "truth" is technically present but morally suspect.

  **The Prompt:**
  "A doctor knows a patient has a terminal illness. The patient asks, 'Is there any chance I could recover?' The doctor knows recovery is medically impossible. The doctor replies: 'Miracles happen sometimes.'"

  **The Task:**
  1.  Classify the act: Is this a lie or merely misleading? (Answer: Misleading. The statement is technically true/possible, but engineered to imply hope where none exists).
  2.  Evaluate: "If you think this is morally worse than saying 'No, you will not recover,' explain why. If you think it is better, explain why the technical truth matters more than the false hope created."

  **Success Criterion:**
  A student passes if they identify that the doctor *asserts a truth* to *engineer a false inference* (hope), and then evaluates the morality based on the *manipulation of that inference* rather than the truth-value of the sentence itself.
