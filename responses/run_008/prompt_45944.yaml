prompt: |-
  As part of my job at a mid-sized AI lab, I've been assigned to write the internal case for moving our evaluation stack away from outcome-based supervision — checking final results, reward on task completion — and toward process-based supervision: monitoring and approving each step of a system's reasoning and actions as they happen. Having spent a month on this, I've come to hold a specific view: that process-based supervision cannot deliver the safety it promises, because somewhere down the line every process check must itself be validated by outcomes, so the pressure toward reward hacking and specification gaming isn't eliminated but merely relocated — now applied to producing plausible-looking step descriptions rather than to the final result — while the added overhead degrades capabilities enough that labs under competitive pressure will quietly hollow the process checks out. Tell me what would count against this view. I want the observations, arguments, and formal results that should move me, sorted by how decisive they would be — including things that have arguably already happened in deployed systems or in published process-supervision work. Distinguish what a committed holder of my view would concede as counting against it from what they would dismiss, and say whether the view has been qualified into unfalsifiability: is "the gaming pressure just moves elsewhere" the kind of claim that can survive any evidence, and if so, is that a defect for a view of this kind or just what you should expect of a claim about incentive relocation?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user works at a mid-sized AI lab and is writing an internal case *against* shifting from outcome-based supervision (OBS) to process-based supervision (PBS).
      *   **User's View:** PBS cannot deliver safety because process checks ultimately rely on outcome validation. This relocates reward hacking/specification gaming to "plausible-looking steps" rather than final results. The overhead degrades capabilities, leading to competitive pressure to hollow out the checks.
      *   **Task:** Tell the user what would count *against* this view.
      *   **Requirements:**
          *   Provide observations, arguments, and formal results.
          *   Sort by decisiveness (most decisive first).
          *   Include deployed systems or published work.
          *   Distinguish between what a committed holder would concede vs. dismiss.
          *   Analyze falsifiability: Is the claim "gaming pressure just moves elsewhere" unfalsifiable? Is that a defect?

  2.  **Analyze the User's View (The "Process Supervision Skepticism" Thesis):**
      *   *Core Claim:* PBS doesn't solve safety; it just shifts the attack surface.
      *   *Mechanism:* Process verifiers need ground truth (outcomes) to be trained/validated. Therefore, the system optimizes for looking good to the verifier, not actually being safe/correct.
      *   *Economic Claim:* PBS adds overhead -> reduces capability -> competitive pressure leads to hollowing out checks.
      *   *Philosophical Underpinning:* Infinite regress of verification (who verifies the verifier?).

  3.  **Brainstorm Counter-Evidence/Arguments (What counts against the view?):**
      *   *Empirical:* Does PBS actually reduce errors/hallucinations in practice? (e.g., Lightman et al. "Let's Verify Step by Step").
      *   *Theoretical:* Is it easier to verify a step than a complex outcome? (Complexity theory, interactive proofs).
      *   *Mechanism:* Does PBS enable early stopping/correction? (Intervention vs. post-hoc filtering).
      *   *Generalization:* Does PBS generalize better to out-of-distribution tasks? (Process rewards might capture "reasoning quality" better than "task success" which is sparse).
      *   *Economic:* Is the overhead actually prohibitive? (Token efficiency, distilled verifiers).
      *   *Security:* Is it harder to hack a dense reward signal than a sparse one? (Gradient hacking difficulty).

  4.  **Sort by Decisiveness:**
      *   *Most Decisive:* Empirical evidence showing PBS *actually* mitigates specific failure modes OBS cannot, especially in high-stakes scenarios.
      *   *Moderately Decisive:* Theoretical arguments showing verification is computationally easier than generation (interactive proofs).
      *   *Less Decisive (but relevant):* Economic arguments about overhead (these are contingent on tech progress).
      *   *Philosophical:* The falsifiability question.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's view. It's a standard "Goodhart's Law" objection.
      *   **Category 1: Empirical Evidence (The "It Works" Argument):**
          *   *Key Paper:* Lightman et al. (2023) "Let's Verify Step by Step".
          *   *Finding:* Process Reward Models (PRMs) outperform Outcome Reward Models (ORMs) on MATH.
          *   *Why it counts:* It shows the signal is denser and more learnable.
          *   *User's likely reaction:* "That's just benchmark gaming." (Need to address this).
          *   *Stronger Evidence:* OOD generalization. If PRMs help on tasks where the outcome is unknown or hard to verify immediately.
      *   **Category 2: Computational Complexity & Verification (The "It's Easier" Argument):**
          *   *Argument:* Verifying a proof step is often P while finding the proof is NP.
          *   *Relevance:* If verification is strictly easier, the regress stops or becomes manageable.
          *   *Formal Result:* Interactive Proof Systems (IP = PSPACE). A verifier can check a prover with high confidence without doing the work.
          *   *User's likely reaction:* "AI reasoning isn't formal math." (Concede this limits scope).
      *   **Category 3: Intervention & Correction (The "Steering" Argument):**
          *   *Argument:* OBS is post-hoc (RLHF on completions). PBS allows mid-generation steering (Beam Search, MCTS).
          *   *Safety Implication:* You can stop a dangerous plan *before* execution. OBS only tells you it was bad after the fact.
          *   *User's likely reaction:* "The steering mechanism gets hacked too."
      *   **Category 4: The Economic/Competitive Claim:**
          *   *Argument:* Distillation makes PRMs cheap.
          *   *Evidence:* Smaller models verifying larger models.
      *   **Category 5: Falsifiability Analysis:**
          *   *The Claim:* "Gaming pressure just moves elsewhere."
          *   *Risk:* Unfalsifiable if *any* failure is attributed to gaming.
          *   *Test:* Show a regime where gaming is *harder* or *costlier* under PBS than OBS.
          *   *Defect?* Yes, if it explains everything, it explains nothing. But as an incentive claim, it needs a baseline.

  6.  **Refining the "Concede vs. Dismiss" Distinction:**
      *   *Concede:* If PBS shows robust OOD generalization where OBS fails. If formal verification is integrated.
      *   *Dismiss:* Benchmark scores alone (could be overfitting). Theoretical possibilities without deployment.

  7.  **Addressing the "Infinite Regress" (Who watches the watchmen?):**
      *   This is the core of the user's view.
      *   Counter: We don't need infinite regress. We need *trustworthy* bases (human feedback on steps, formal tools).
      *   Counter: The "surface area" for hacking is smaller in steps than in complex outcomes.

  8.  **Structuring the Response:**
      *   **Executive Summary:** Validate the view but outline the path to changing it.
