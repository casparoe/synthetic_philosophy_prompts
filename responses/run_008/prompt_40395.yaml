      *   *Premise (2):* Finite minds. Psychologically plausible. We don't consciously iterate "I know that you know..." infinitely.
      *   *Inference (2) $\to$ (3):* This is the weak link. It assumes that *explicit representation* is required for the *state of affairs* to hold. This conflates the *model* with the *reality*, or *conscious access* with *dispositional state*.
      *   *Conclusion (3):* No CK.
