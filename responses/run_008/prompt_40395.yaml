      *   **The "Public Event" Solution:** Lewis and others argue CK arises from *public events* (e.g., a traffic light, a public announcement). If a signal is public, it *generates* the infinite hierarchy automatically, not by us thinking it, but by the logic of the situation.
      *   **Approximate Common Knowledge (ACK):** Monderer and Samet (1989). This is the friend's point. It's not a shrug; it's a formal robustness result. If beliefs are "close enough" to certainty (e.g., 99% sure), the infinite hierarchy stabilizes enough to support coordination.
