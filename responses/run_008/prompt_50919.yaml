answer: |-
  Good evening.

  For those of you who know my mother only as Mom, Grandma, or Auntie, you probably think "dispositions" refers to her temper. For those of you who know her as a colleague, you know it refers to the problem of what makes a glass fragile, a wire conductive, or a person teachable.

  For forty years, my mother stood at the intersection of those two groups. She spent her career arguing that the way we slice up reality often creates puzzles that aren't really there. Specifically, she fought a battle over two words: *Finks* and *Masks*.

  To the family: In philosophy, a "disposition" is an "if-then" promise. If you strike this vase, *then* it breaks. That is what fragility is. But sometimes, you strike the vase, and it doesn't break. Why?
  Maybe the fragility vanished the moment you swung your hammer. That is a **Fink**. The power disappeared.
  Maybe the fragility stayed, but a foam pad caught the hammer. That is a **Mask**. The power remained, but the result was blocked.

  For decades, the field argued these are two different errors. My mother argued they are the same thing. She insisted that distinguishing between "losing the power" and "losing the chance to use it" is an artifact of how we draw the timeline. It is one phenomenon: the world interfering with the promise.

  Looking around this room, I realize her career has been one long demonstration of this thesis.

  To the metaphysicians in the back: You might look at my mother's retirement and see a **Fink**. The university has removed the institutional stimulus. The tenure is gone, the classroom keys are returned. The categorical base of her employment has been altered. She is no longer "a teacher" in the contractual sense. The disposition has been removed.

  To the family in the front: You see a **Mask**. You know she is still a teacher. The wisdom is intact, the patience remains, the instinct to explain is burning as bright as ever. It is just that the school year has ended. The manifestation is blocked, but the power remains.

  If you listen to my mother, you know she would tell you that both views are right, and both are wrong. To separate her capacity to teach from the context in which she taught is to make the very mistake she spent forty years correcting. You cannot isolate the "teacher" from the "teaching." The change in her life is not a removal of power, nor a blocking of opportunity. It is a single transition, viewed from different angles.

  She taught us that the distinction between who we are and what we are allowed to do is often just a matter of where we place the comma in the sentence.

  So, I am not going to stand here and say she is "disposed to inspire us," or "inclined to be happy." She would correct my grammar, and she would be right. We do not toast to conditional promises. We do not toast to what she *would* do if the world struck her the right way.

  We toast to the categorical fact of what she *has done*. The power was real. The manifestation was real. And the work is finished.

  To my mother.
