answer: |-
  **Setting:** *A dimly lit faculty lounge, late evening. Coffee cups and scattered papers cover the table. ELIAS, a proponent of deliberative democracy and institutional integrity, leans forward. SARAH, a social choice theorist with a skepticism of collective personhood, leans back, arms crossed.*

  **Elias:** The opinion draft is impossible, Sarah. Look at the vote count. Judge A says there was a contract and a breach. Judge B says contract, no breach. Judge C says breach, no contract. Two out of three say there was a contract. Two out of three say there was a breach. But two out of three say the defendant is *not* liable.

  **Sarah:** And two out of three say he is not liable. That seems like the decision, doesn't it? The defendant walks.

  **Elias:** But on what grounds? If we write the opinion based on the majority view of the *conclusion*, we have to say the defendant is not liable. But then, what do we say about the premises? Do we write that the court finds no valid contract? No, because a majority found there *was* one. Do we write there was no breach? No, a majority found there *was*.

  **Sarah:** So we write that the court is divided. That's the truth.

  **Elias:** It's not the truth of the *court*. It's the truth of three individuals. A court is a collective agent. It must speak with a single voice. If the court asserts $P$ and asserts $Q$, and liability is defined logically as $P$ and $Q$, then the court *must* assert Liability. To do otherwise is to issue a performative contradiction. It's like saying, "We find it is raining, and we find you have no umbrella, but we deny that you will get wet."

  **Sarah:** That's the Premise-Based Procedure, Elias. I know the appeal. You want the institution to look rational. But you're buying that rationality at the cost of democracy. You're proposing we override the majority vote on the actual outcome—the liability—because it doesn't match the logical derivation of the majority votes on the reasons.

  **Elias:** I'm proposing we respect the logic of the law. The law isn't a black box where we just tally outcomes. It's a system of reasons. If the majority of the court believes the premises that necessitate liability, then the court *is* committed to liability. To vote on the conclusion directly is to ignore the reasons that justify the judgment.

  **Sarah:** But who decided which propositions are "premises" and which are "conclusions"? That's the hidden agenda-setter. In this contract case, you've structured the decision so that "Valid Contract" and "Breach" are the foundational votes. But Judge C might argue that "Liability" is the primary legal question, and the premises are just heuristic tools to get there. By forcing a vote on the premises first, you're privileging a specific doctrinal structure. You're smuggling in a hierarchy of propositions that isn't neutral.

  **Elias:** It's not a hierarchy; it's logic. You can't have liability without a contract. That isn't a procedural preference; that's the substantive law.

  **Sarah:** Is it? Or is it a way to constrain the judges? If I know that voting on the premises will bind the conclusion, I might vote strategically on the premises to get the conclusion I want. The Premise-Based Procedure is highly manipulable. A judge who wants the defendant to win, but knows the majority sees a breach, might suddenly find "reasons" to doubt the contract's validity, not because she believes it, but to block the liability derivation.

  **Elias:** Strategic voting is a pathology of any system. But let's talk about the alternative. Your Conclusion-Based Procedure. We vote on liability directly. The defendant goes free. But then, what is the precedent? Does the court hold that contracts of this type are valid? We can't say yes, because the opinion reflects a majority that says... wait, actually, a majority *did* say yes. So the court affirms the contract is valid, affirms the breach occurred, but rules the defendant is not liable.

  **Sarah:** We simply note the disagreement.

  **Elias:** You can't note it away! You are creating a collective agent that simultaneously asserts $P$, asserts $Q$, and denies $R$, where $R$ is the necessary consequence of $P$ and $Q$. That isn't a court; it's a schizophrenic. It undermines the guidance function of law. Lower courts won't know if they should enforce such contracts. The public sees an institution that contradicts itself.

  **Sarah:** I'd rather have an institution that admits its internal conflict than one that imposes a "consistent" view that none of the members actually hold. Look at your "single voice." Under your Premise-Based Procedure, the court rules the defendant is *liable*. But Judge B and Judge C both voted *not liable*. You are forcing a judgment on the defendant that a majority of the judges explicitly rejected. That is condescending to the dissenters. It treats their votes on the conclusion as irrelevant noise, merely because their reasons differed.

  **Elias:** It treats their votes as part of a deliberative whole. Judge B admits the contract is valid. Judge C admits the breach occurred. Together, they have established the facts that constitute liability, even if neither individually wants to sign the verdict. The court's integrity requires that the decision follows from the reasons accepted by the body.

  **Sarah:** The "body." There it is. The metaphor. You keep talking about the court as if it's a person. "The court believes," "The court asserts."

  **Elias:** Isn't it? It issues a single mandate. It has a seal. It bears responsibility.

  **Sarah:** It's a mechanism, Elias. A counting device. When you reify the court into a "single agent," you obscure the individuals doing the work. If the court is a single agent, then yes, it must be consistent. But if the court is just an aggregation of three agents, then consistency is a requirement for *them*, not for *it*. If Judge A is consistent, and B is consistent, and C is consistent, the system has done its job. Demanding the *group* be consistent is a category error.

  **Elias:** But the group acts! It sends the sheriff to seize assets. If the group acts, it must have a will. And if the will is derived from a majority that rejects the action, the legitimacy crumbles.

  **Sarah:** And if the action is derived from a logic that overrides the majority's direct vote on that action, the legitimacy also crumbles. You're stuck between the Scylla of inconsistency and the Charybdis of overriding the majority outcome.

  **Elias:** I'm not stuck. I choose coherence. A legal system that tolerates logical contradictions in its judgments ceases to be a system of law. It becomes a lottery. The Premise-Based Procedure protects the integrity of the doctrine.

  **Sarah:** And the Conclusion-Based Procedure protects the integrity of the judge. It respects that each judge has a duty to render a verdict, not just a premise. By making the premises binding, you turn judges into finders of fact who are stripped of the power to apply the law to those facts in the final instance. You're saying, "Judge B, you don't get to decide if the defendant is liable. You only get to decide if there was a breach. We'll calculate the liability for you."

  **Elias:** I'm saying Judge B is part of a collegial body. If the body accepts the premises, the body accepts the conclusion. To deny this is to say that the court's reasoning is subordinate to its raw voting power.

  **Sarah:** Or, to say that the court's reasoning is merely the sum of its parts, and sometimes sums don't add up neatly. Why is that a crisis? Maybe the crisis is only in your desire for the court to be a Person. If you accept the court is a plural entity, the "discursive dilemma" isn't a paradox. It's just a description of pluralism. $P$ is true for the collective in one sense, $R$ is false in another.

  **Elias:** But the defendant lives in the real world, not in the world of pluralist theory. He is either liable or he isn't. He cannot be "liable in the premise-sense but free in the conclusion-sense." We must output a binary decision. And if we output "Liable" when two judges said "Not Liable," we have severed the link between the judges' conscience and the state's coercion.

  **Sarah:** And if we output "Not Liable" when the established facts dictate "Liable," we sever the link between the law's logic and the state's coercion.

  *Silence settles between them. Elias rubs his temples. Sarah taps her pen on the table.*

  **Elias:** So we are at a standstill. You fear the tyranny of the logic over the voters. I fear the tyranny of the voters over the logic.

  **Sarah:** It's deeper than that. You think the problem is procedural. You think if we just pick the right voting rule, we solve it. I think the problem is ontological. You want the court to be a unified mind. I think that's a fiction we tell to make authority feel legitimate.

  **Elias:** And if it is a fiction? If the "unified mind" is a necessary fiction for the rule of law to function? Then your honesty about the fragmentation is a luxury the law cannot afford.

  **Sarah:** And if it is a fiction? Then your insistence on it blinds you to the ways that procedure dictates substance. You're so busy making the court look rational that you might make it unjust.

  **Elias:** Perhaps. But a court that contradicts itself cannot be just, because it cannot be understood.

  **Sarah:** And a court that silences the majority of its judges on the final verdict cannot be just, because it cannot be accountable.

  *Elias gathers his papers, leaving the draft opinion on the table.*

  **Elias:** We'll have to agree that the draft remains unfinished.

  **Sarah:** At least we agree on that. The paradox holds.

  **Elias:** The paradox holds. But the sheriff still comes Monday.

  **Sarah:** Yes. And he'll need an order.

  *Elias nods, turns, and walks out. Sarah stays seated, looking at the three columns of votes, none of which align.*
