      *Refining Smart's Reductio:* If the alarm is suffering, and we want to minimize alarms. Destroying the building stops the alarms. The analogy *encourages* the reductio unless we add "protect the occupants" as a higher rule. But if "protect occupants" is the rule, then suffering isn't the *only* thing that matters (existence matters). So the analogy yields the reductio if taken literally as "minimize alarms."

      *Refining the "Better Analogy":* A **Triage** system is the standard counter. It acknowledges priority (Weak) without implying the others don't matter (blocking Strong). It also avoids the "destroy the patient to stop the pain" issue because the goal is *health*, not just *absence of pain signals*.

