answer: |-
  You have put your finger on one of the most persistent and difficult problems in oral history and memory studies. You are correct to feel that "hindsight bias" is often too blunt an instrument for what you are witnessing. While hindsight bias is the academic umbrella, it is frequently used to describe *judgments* of outcomes ("The coup was inevitable") rather than the *rewriting of internal states* ("I remember feeling afraid then").

  There are established concepts that map onto this, but none perfectly capture the specific *phenomenology* you are describing—the sincere, felt experience of prophecy that overwrites the mundane reality of the past.

  Here is the breakdown of the established science, followed by a proposed term that sharpens the distinction for your purposes as a writer.

  ### 1. The Established Concepts

  **Creeping Determinism (Baruch Fischhoff)**
  This is the historical cousin of hindsight bias. Fischhoff, a pioneer in this field, described how, once an outcome is known, the path leading to it appears inevitable. In published histories, this looks like "the coup was baked in." In individual memory, it manifests as the erasure of contingency. Your interviewees cannot access the version of themselves who lived in a world where the coup *might not have happened*, because that world no longer exists in their mind.

  **Consistency Bias (Autobiographical Memory)**
  This is the specific psychological mechanism you are sensing. Humans have a powerful drive to maintain a coherent self-narrative. If I am a person who survived a coup, my brain prefers a narrative where I was "alert and aware" rather than "distracted and lucky." Consistency bias rewrites past attitudes to align with current knowledge. It is not a lie; it is an update. The brain treats the memory file like a wiki page: when new information arrives (the coup happened), it edits the previous entries (my worry about a job) to maintain logical consistency.

  **Source Monitoring Error**
  This explains *how* the rewrite happens. Your interviewees know *now* that the coup was coming. Over time, the brain loses the tag that says "I learned this *after* the fact." The knowledge migrates backward in time. They are not lying about *knowing*; they are mistaken about *when* they knew.

  ### 2. A Proposed Term: "Teleological Memory"

  While the concepts above describe the mechanism, they don't quite capture the *texture* of the experience you are encountering. For your work, I propose the term **Teleological Memory**.

  *Teleology* is the philosophical idea that things are guided by a purpose or an end goal. **Teleological Memory** occurs when the *ending* of a life story reorganizes the *beginning*.

  In Teleological Memory, the past is not remembered as it was experienced (open, uncertain, mundane); it is remembered as it was *resolved* (closed, determined, significant). The coup is the telos (the end goal), and the memory of the summer before is unconsciously edited to serve that destination.

  ### 3. Mapping the Edges

  You asked for the boundaries of this phenomenon. Here is how Teleological Memory differs from the adjacent concepts:

  **vs. Deliberate Fabrication (Lying)**
  *   **The Difference:** Intent.
  *   **The Edge:** A liar knows the truth and hides it. A subject with Teleological Memory *cannot access* the truth. If you show them the letter where they mention only the job, they will not say, "Ah, I was lying." They will say, "I must have been in denial," or "I didn't want to worry my mother." They will invent a rationale to preserve the certainty. The emotional truth (fear) overrides the documentary truth (the letter).

  **vs. Clinical Confabulation**
  *   **The Difference:** Pathology vs. Function.
  *   **The Edge:** Confabulation is usually associated with neurological damage (e.g., Korsakoff's syndrome) where the brain fills gaps with random fiction to plug holes. Teleological Memory is a *feature* of a healthy brain. It is a narrative smoothing function. It doesn't fill gaps with random noise; it fills them with *meaning*. It makes the story better, not just whole.

  **vs. The Historian's Determinism**
  *   **The Difference:** Structure vs. Psyche.
  *   **The Edge:** A historian might write the decade as "leading to the coup" for narrative economy or argumentative strength. This is a conscious craft choice (or a structural bias). The interviewee's Teleological Memory is a *survival mechanism*. It restores a sense of agency. If they "knew it was coming," they are not victims of chaos; they are protagonists who escaped. It turns luck into skill.

  ### 4. Why This Matters for Your Fiction

  You are encountering a conflict between **Documentary Truth** (the letters) and **Narrative Truth** (the memory).

  In historical fiction, we often privilege the documentary truth as "real" and the memory as "flawed." But Teleological Memory suggests something deeper: the memory *is* the reality the person lives in. The certainty they feel is a real psychological scar, even if the factual basis is retroactive.

  **How to use this:**
  Don't treat the interviewee's certainty as a mistake to be corrected by the letters. Treat the *tension* between the two as the story.
  *   **The Letter:** Shows the mundane anxiety of the time (rent, jobs, weather).
  *   **The Memory:** Shows the mythologized survival of the time (instinct, dread, foresight).

  The tragedy (or beauty) of your characters lies in the gap between those two. They remember themselves as prophets because surviving the coup required them to be more than just lucky. They had to be wise. Your novel can hold both truths: the character who worried about a job, and the character who remembers fearing the coup. Both are true—one factually, one psychologically.

  ### Summary
  *   **Established Umbrella:** Hindsight Bias (specifically the memory distortion component).
  *   **Historical Term:** Creeping Determinism.
  *   **Psychological Mechanism:** Consistency Bias / Source Monitoring Error.
  *   **Proposed Term for Writers:** **Teleological Memory**.
  *   **Definition:** The unconscious reorganization of past mental states to align with known outcomes, driven by the brain's need for narrative coherence and agency.

  You are not just hearing a story; you are watching a mind protect itself from the chaos of history by imposing order on its own past. That is not a bug in your research; it is the central theme of your book.
