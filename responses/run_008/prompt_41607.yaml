      The Federal Writers' Project (FWP) slave narratives exemplify the "archives and power" thesis: archives are not neutral repositories but active producers of memory and silence. Viewing the collection through this lens reveals how power operated at every link in the chain to manufacture specific absences.

      First, **selection**. Power operated through mortality and geography. Only those who survived into the 1930s could speak; those who died earlier were silenced. Interviewers, often locally connected, selected "suitable" informants, silencing those deemed difficult or too critical.

