answer: |-
  # THE 45-MINUTE JUMP-OUT PROTOCOL (JOP)

  **Trigger:** Alarms every 45 minutes per active puzzle OR Team Lead call upon stagnation signal (no progress in 30 mins).
  **Owner:** Team Captain (Timekeeper) & Senior Solver (Verifier).
  **Goal:** Classify puzzle state into: **GREEN** (Continue), **AMBER** (Prove Unreachable), **RED** (Misread Rules/Abort).

  ### PHASE 1: RULE SOLIDIFICATION (5 Minutes)
  **Question 1.1:** Can every team member write down the exact same set of rules and goal state without looking at notes?
  *   **Exit Criteria:** 100% consensus on written rules.
  *   **Failure Mode:** If consensus fails, flag **RED** (Misread Rules). Proceed to Phase 4.
  *   **Human Handoff:** None. This is clerical.

  **Question 1.2:** Are the rules explicitly stated in the text, or are they inferred from examples?
  *   **Exit Criteria:** Label each rule as "Explicit" or "Inferred."
  *   **Decision Point:** If >50% of rules are "Inferred," flag **AMBER** (High risk of misinterpretation).

  ### PHASE 2: PROGRESS AUDIT (5 Minutes)
  **Question 2.1:** In the last 45 minutes, did we generate new valid states closer to the goal, or just cycle existing states?
  *   **Exit Criteria:** Log of last 10 moves/states.
  *   **Decision Point:** If cycling detected, proceed to Phase 3. If progress exists but is slow, stay **GREEN**.

  **Question 2.2:** Have we exhausted the "low-hanging fruit" (obvious moves/decodings)?
  *   **Exit Criteria:** Checklist of obvious strategies marked complete.
  *   **Decision Point:** If yes, and no progress, proceed to Phase 3.

  ### PHASE 3: INVARIANT HUNT (15 Minutes) — **CREATIVE HANDOFF**
  **Question 3.1:** Is there a property of the start state that is preserved by every rule operation?
  *   **Exit Criteria:** Identification of a candidate invariant (e.g., parity, modulo count, color conservation).
  *   **Human Handoff:** **Senior Solver assigns one person solely to find an invariant.** This step cannot be proceduralized; it requires mathematical insight.
  *   **Stop Searching Condition:** If an invariant is found that differs between Start and Goal states, move to Senior Sign-off.

  **Question 3.2:** If no invariant is found, is the search space small enough to be exhaustively searched by script or brute force?
  *   **Exit Criteria:** Estimate of state space size vs. compute time.
  *   **Decision Point:** If searchable within 30 mins, script it (**GREEN**). If too large and no invariant, proceed to Phase 4.

  ### PHASE 4: META-RULE CHALLENGE (10 Minutes)
  **Question 4.1:** What rule are we treating as fixed that might actually be variable?
  *   **Exit Criteria:** List of "Sacred Cows" (e.g., "The grid is static," "A=1," "Words must be English").
  *   **Human Handoff:** **Team Brainstorm.** Everyone must propose one way a "Sacred Cow" could be false.
  *   **Decision Point:** If a plausible alternative rule set emerges that makes the puzzle solvable, flag **RED** (Misread Rules) and reset Phase 1.

  ### DECISION GATE
  *   **GREEN:** Continue solving. Reset 45-min timer.
  *   **AMBER:** Shift goal to "Prove Impossible." Assign Senior Solver to verify.
  *   **RED:** Abort current approach. Re-read prompt for hidden mechanics.

  ### SENIOR SOLVER SIGN-OFF CRITERIA (For "Impossible" Verdict)
  Before a puzzle is declared unsolvable and abandoned, the Senior Solver must demand:
  1.  **Formal Invariant:** A mathematical proof that the invariant holds for all rules and separates Start/Goal. (e.g., "I-count mod 3 is invariant; Goal requires I-count mod 3 = 0").
  2.  **Exhaustion Log:** If no invariant, a computer script or logical tree proving all reachable states have been visited without success.
  3.  **Rule Verification:** Confirmation that no "Meta-Rule Challenge" yielded a viable alternative interpretation.
  4.  **Second Opinion:** One other team member must independently verify the invariant proof without seeing the solution path.

  ---

  # PROCEDURE RUN-THROUGH

  ### CASE 1: The MU Puzzle (MIU System)
  *   **Phase 1:** Rules are explicit. Consensus reached. (Status: GREEN)
  *   **Phase 2:** Team generates strings: MI, MII, MIIU... Goal is MU. Cycling detected in string length growth without reducing 'I'. (Status: AMBER)
  *   **Phase 3 (Invariant Hunt):** Senior Solver assigns mathematician. They notice rule operations either double 'I' count or subtract 3. Start count is 1. Goal count is 0.
      *   *Invariant Found:* Count of 'I' is never divisible by 3.
      *   *Goal Check:* MU has 0 'I's (divisible by 3).
      *   *Stop Searching:* Invariant proves separation.
  *   **Phase 4:** Skipped (Invariant found).
  *   **Senior Sign-off:** Demands proof that doubling $n$ and subtracting 3 from $n$ never yields a multiple of 3 if starting from 1. Proof provided.
  *   **Verdict:** **AMBER** (Proven Unreachable). Stop solving.

  ### CASE 2: 15-Puzzle with Two Tiles Swapped
  *   **Phase 1:** Rules explicit (slide tiles). Goal explicit (1-15 order). (Status: GREEN)
  *   **Phase 2:** Team slides tiles for 45 mins. Last 3 tiles always permuted oddly. (Status: AMBER)
  *   **Phase 3 (Invariant Hunt):** Senior Solver assigns solver. They calculate parity of permutations + Manhattan distance of blank tile.
      *   *Invariant Found:* Parity of permutation + row of blank is invariant mod 2.
      *   *Goal Check:* Start state parity differs from Goal state parity.
      *   *Stop Searching:* Invariant proves separation.
  *   **Phase 4:** Skipped.
  *   **Senior Sign-off:** Demands parity calculation sheet. Verified by second member.
  *   **Verdict:** **AMBER** (Proven Unreachable). Stop solving.

  ### CASE 3: Hunt Puzzle (False Constraint)
  *   **Phase 1:** Rules inferred from examples (A=1, B=2...). Consensus reached on *interpretation*, but rules are labeled "Inferred." (Status: AMBER)
  *   **Phase 2:** Decoding yields gibberish. No progress. (Status: AMBER)
  *   **Phase 3 (Invariant Hunt):** Team tries to find linguistic invariants. None found. Search space (all substitutions) too large. (Status: Proceed to Phase 4)
  *   **Phase 4 (Meta-Rule Challenge):** "Sacred Cow" list: "A=1 is fixed."
      *   *Challenge:* One member suggests "A=1 is only true for the first word." Another suggests "It's a Vigenère cipher, not Monoalphabetic."
      *   *Result:* Testing Vigenère yields readable text.
      *   *Stop Searching:* Rule misinterpretation confirmed.
  *   **Senior Sign-off:** N/A (Verdict is not "Impossible," but "Misread").
  *   **Verdict:** **RED** (Misread Rules). Reset Phase 1 with new rule set.

  ---

  # FAILURE MODES & HONESTY

  **Where This Will Misfire:**
  1.  **The "Hard vs. Impossible" Blindspot:** The procedure relies on finding an invariant (Phase 3). If the invariant is obscure (e.g., requires advanced group theory not present on the team), the procedure will default to Phase 4. If Phase 4 yields no meta-rules, the team may incorrectly cycle back to **GREEN** and grind for another 45 minutes on an actually impossible puzzle.
  2.  **Time Cost Overhead:** Running JOP takes ~35 minutes. On a 3-hour hunt, that is significant overhead. If run too rigidly, it eats solving time.
  3.  **Social Pressure:** In Phase 4, junior members may hesitate to challenge "Sacred Cows" established by seniors. The "Meta-Rule Challenge" requires psychological safety to work; otherwise, it becomes a rubber stamp.
  4.  **False Negatives:** A Senior Solver might demand too much evidence (e.g., formal proof) under time pressure, delaying the "Abort" decision until the hunt is over.

  **Confidence Level:** 85%
  **Least Sure Step:** Phase 3 (Invariant Hunt). This step relies entirely on the presence of a specific type of mathematical insight within the 15-minute window. If the required invariant is non-obvious (e.g., a complex coloring argument rather than simple parity), this step will fail to produce a result, forcing the team to guess between "Keep Grinding" and "Abort" without data.
