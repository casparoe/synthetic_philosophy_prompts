prompt: |-
  I captain a six-person puzzle hunt team, and our most expensive failure mode isn't failing to solve things — it's grinding for three hours on a puzzle that, as we've read it, has no solution, because noone stopped to ask whether the goal is even reachable. The MIU system from Gödel, Escher, Bach is my model here: you can crank out strings forever and never get MU, and knowing that requires stepping outside the rules (what Hofstadter called jumping out of the system) rather than searching harder inside them. Turn that idea into a procedure we can actually run mid-hunt. The recurring decision, maybe every 45 minutes on a shared clock: keep searching within the rules, switch to trying to prove the goal is unreachable, or conclude we've misread the rules and the real puzzle lives at a different level entirely. It needs an ordered set of questions, what counts as enough of an answer to each, where it stops with a "stop searching," and where it just hands the call to a person because the step — like inventing an invariant — is unbounded creativity that can't be proceduralized. Our senior solver has to sign off on any "it's impossible" verdict, so say what evidence she should demand before signing. Run it on three cases: the MU puzzle itself, a 15-puzzle with two tiles swapped, and a hunt puzzle where the "unreachable" conclusion was wrong because a rule we'd been treating as fixed wasn't actually one. Be honest about where the procedure will misfire. Start your reply with the procedure itself, no preamble and no restating my question, and end with how confident you are in it and the single step you're least sure of.
