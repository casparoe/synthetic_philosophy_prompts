answer: |-
  # Session Plan: The Projectibility Trap

  **Course:** Philosophy of Science (Year 2)
  **Duration:** 80 minutes
  **Class Size:** 18 students
  **Topic:** Induction and the Construction of Predicates (Pre-Goodman)

  ## 1. Learning Objectives
  By the end of this seminar, students will:
  1.  Experience the underdetermination of inductive hypotheses by finite evidence.
  2.  Construct a time-dependent predicate themselves to see that it is logically equivalent to standard predicates relative to the evidence.
  3.  Recognise that appeals to "simplicity" or "naturalness" beg the question without a prior theory of projectibility.
  4.  Understand the regress problem: ruling out one artificial predicate requires a rule that is itself vulnerable to the same artificial reconstruction.

  ## 2. Materials & Setup
  *   **Counters:** 50 opaque plastic counters (30 Green, 20 Blue).
  *   **Bag:** One opaque cloth bag.
  *   **Tokens:** 100 poker chips or printed tokens (for scoring).
  *   **Handout A:** "Scientist's Log" (one per student).
  *   **Handout B:** "Dealer's Protocol" (one for the student playing Nature).
  *   **Envelope:** Sealed, containing a single Green counter (the 'Truth').
  *   **Clock/Timer:** Visible to the whole room.
  *   **Whiteboard:** For recording hypotheses and scores.

  **Room Layout:** Seminar table. One student sits at the head as the **Dealer** (Nature). The remaining 17 are **Scientists**. You (the Tutor) facilitate but do not play.

  ---

  ## 3. The Activity (55 Minutes)

  ### Introduction (5 Minutes)
  Distribute Handout A. Explain the goal: Scientists earn tokens by correctly predicting the colour of the next counter drawn from the bag. The Dealer draws the counters according to a fixed but hidden rule.

  **Tutor Patter:** "We are investigating how evidence supports prediction. You will place bets based on the sequence you observe. Confidence is rewarded; hesitation is not. Do not discuss your hypotheses with neighbours until instructed."

  ### Round 1: The Baseline (10 Minutes)
  1.  **Evidence:** The Dealer draws 5 counters, one by one, placing them on the table. All are **Green**.
  2.  **Task:** Scientists write on Handout A:
      *   *Observed Pattern:* \_\_\_\_\_\_\_\_\_\_
      *   *Prediction for 6th Counter:* \_\_\_\_\_\_\_\_\_\_
      *   *Confidence (1–10):* \_\_\_\_\_\_\_\_\_\_
  3.  **Betting:** Students wager up to 5 tokens on their prediction.
  4.  **Outcome:** Almost everyone bets on **Green**.
  5.  **Reveal:** The Dealer draws the 6th counter. It is **Green**.
  6.  **Payoff:** Winners collect tokens.
  7.  **Board Work:** Write the consensus hypothesis on the board: **$H_1$: All counters in this bag are Green.**

  ### Round 2: The Rival (15 Minutes)
  1.  **Setup:** Reset the bag (ensure it still contains mostly Green). The Dealer draws 5 counters again. All are **Green**.
  2.  **Intervention:** Before they bet on the 6th, intervene.
      **Tutor Patter:** "I propose a rival hypothesis, **$H_2$**. Let us call a counter **'Twilight'** if it is drawn before 2:45 PM and is Green, or if it is drawn at or after 2:45 PM and is Blue."
      *(Check the clock. Ensure 2:45 PM is after the 6th draw is scheduled to occur.)*
      **Tutor Patter:** "Look at your evidence. The first 5 counters were drawn before 2:45 PM. They were Green. Does $H_2$ fit this evidence?"
  3.  **Task:** Students must evaluate $H_2$.
      *   Does $H_2$ predict the 6th counter will be Green or Blue? (Since the 6th draw is *after* 2:45 PM, $H_2$ predicts **Blue**).
      *   Students must place a bet. They can bet on $H_1$ (Green) or $H_2$ (Blue).
  4.  **Discussion:** Most will refuse to bet on $H_2$. Ask them *why*. Record their reasons on the board (e.g., "It mentions time," "It's gerrymandered," "It's not a real colour").
  5.  **Reveal:** The Dealer draws the 6th counter. It is **Green**. ($H_1$ wins, $H_2$ loses).
  6.  **Crucial Point:** Emphasise that *before* the draw, the evidence supported $H_1$ and $H_2$ equally. The loss of $H_2$ was empirical, but the *rejection* of $H_2$ prior to the draw was philosophical.

  ### Round 3: The Regress (25 Minutes)
  *This is the core constraint. Students must formulate the second-order predicate.*

  1.  **Task:** Tell the students they have lost tokens by ignoring $H_2$ in principle, even if they won the bet empirically. To recover their tokens, they must define a **Rule of Admissibility**.
  2.  **Handout B Instruction:** "Write down a precise definition of a 'Projectible Property'. This rule must allow 'Green' but exclude 'Twilight'. You cannot simply say 'Green is natural'. You must provide a testable criterion."
  3.  **Collection:** Collect the definitions. Pick the strongest one (usually something like: *'A property is projectible if its definition does not reference a specific time or location.'*). Write this on the board as **Rule $R_1$**.
  4.  **The Trap:**
      **Tutor Patter:** "Excellent. $H_1$ uses 'Green'. $H_2$ uses 'Twilight'. $R_1$ says definitions cannot reference time. But I can redefine 'Twilight'."
      **Board Work:** Define a new predicate, **'Shmeen'**.
      *   **Definition:** An object is 'Shmeen' if it is 'Twilight' before 2:50 PM, or 'Green' after 2:50 PM.
      *   **Ask:** "Does the word 'Shmeen' appear in the definition of 'Green'?" (No).
      *   **Ask:** "If we treat 'Shmeen' as our basic colour term, does 'Green' become the time-dependent one?"
      *   **Logic:** Green = Shmeen before 2:50 PM, Twilight after.
  5.  **The Demand:** "If you claim 'Green' is projectible because it lacks time references, you must explain why 'Shmeen' is not the basic term. If you cannot, your Rule $R_1$ fails."
  6.  **Second-Order Formulation:** Ask the students to revise their rule to block 'Shmeen'. They must write **Rule $R_2$**.
      *   *Likely outcome:* They will try to appeal to "entrenchment" or "past usage" without knowing the term. They might write: *"A property is projectible if we have used it successfully before."*
  7.  **Close:** Do not resolve this. Collect $R_2$. State that this infinite regress is the problem. Open the sealed envelope (containing the Green counter) to settle the game scores, but note that the envelope does not solve the justification problem.

  ---

  ## 4. Debrief Script (20 Minutes)

  *Note: Do not use the forbidden words until the final paragraph.*

  **Tutor:** "Put your pens down. Look at the board. We have $H_1$ (Green), $H_2$ (Twilight), and your Rules $R_1$ and $R_2$.

  **On Confirmation:**
  "In Round 2, I asked if $H_2$ fit the evidence. You agreed it did. Logically, 'All observed counters are Twilight' is true if 'All observed counters are Green' is true, provided the observation time is before the changeover. This means the evidence *confirmed* both hypotheses equally. If confirmation is just a logical relation between evidence and hypothesis, we have no reason to prefer $H_1$. Yet, you all bet on $H_1$. Why?"

  **On Simplicity and Circularity:**
  "Many of you wrote in $R_1$ that 'Twilight' is invalid because it mentions time. But notice the 'Shmeen' trick. Whether a definition mentions time depends on which predicates you take as *primitive*. If you take 'Twilight' as primitive, then 'Green' is the one mentioning time. To say 'Green is the real primitive' is to assume what you are trying to prove. You are using the projectibility of 'Green' to justify the rule that makes 'Green' projectible. That is circular."

  **On Entrenchment:**
  "In $R_2$, some of you suggested we should use predicates we have used before. This is the most promising line. It suggests projectibility isn't about logic or the world, but about *us*. It's about our linguistic history. A predicate is projectible if it is **entrenched**—if it has a track record of successful use in our community. 'Green' is entrenched; 'Twilight' is not. But notice: this makes induction a matter of social habit, not logical necessity. We predict the future will resemble the past because our language is built from the past."

  **The Reveal:**
  "Now I can name the problem. This is **Nelson Goodman's 'New Riddle of Induction'**. The predicate 'Twilight' is a version of what Goodman called **'grue'**. The problem you just generated in Round 3—the inability to define a rule that filters out 'grue' without begging the question—is the riddle. You didn't just hear about it; you built it."

  ---

  ## 5. Predictable Failure Modes & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **"It's just a weird word."** | Students dismiss $H_2$ as linguistic trickery rather than a logical problem. | In Round 2, insist they write down the *logical condition* for rejection. If they say "it's weird," ask them to define "weird" formally in Round 3. |
  | **Dealer Leaks the Rule.** | The student playing Nature might hint that the bag is all Green. | Brief the Dealer privately beforehand. Instruct them to remain poker-faced. Tell them their goal is to follow the protocol, not help the scientists win. |
  | **Refusal to Play Round 3.** | Students may insist "Green is just Green" and refuse to define $R_1$. | Make token recovery contingent on submitting $R_1$. "You cannot win back your points unless you formalise your intuition." |
  | **Time Overrun.** | 18 students discussing predicates can drift. | Keep Round 1 brisk. In Round 3, select only *two* student definitions to analyse on the board rather than all of them. |
  | **Empirical Confusion.** | Students think the Green reveal in Round 2 solves the philosophical problem. | Explicitly separate the *betting outcome* (empirical) from the *justification* (epistemic). "The envelope tells us who won the tokens, not who was rational before the draw." |

  ---

  ## 6. Limitations of the Activity

  Be frank with yourself (and the class) about what this 80-minute session cannot achieve.

  **1. The Simulation of Entrenchment:**
  The activity cannot reproduce actual **entrenchment**. In the real world, 'Green' is entrenched because it has been used successfully for centuries. In this 80-minute seminar, 'Green' is only entrenched because you used it in Round 1.
  *   **Make-up in Debrief:** You must explain that Goodman's solution relies on the *history* of a linguistic community, not a single session. The "habit" is cultural, not individual.

  **2. The Ontological Gap:**
  Students may leave thinking this is merely about language, not the world. They might assume there *is* a real "Natural Kind" out there that matches 'Green'.
  *   **Make-up in Debrief:** Clarify that Goodman challenges the idea that we can access "Natural Kinds" independently of our predicate system. We cannot step outside our language to check if 'Green' matches reality better than 'Twilight' without already using a predicate system.

  **3. The Stakes:**
  Token points are not real scientific stakes.
  *   **Make-up in Debrief:** Remind them that in science, the "tokens" are predictive success over decades. The riddle matters because if we cannot distinguish projectible predicates, we cannot justify why we trust physics over crystal-gazing, provided the crystal-gazer uses 'Twilight'-style logic.

  ---

  ## Handout A: Scientist's Log (Excerpt)

  **Name:** ___________________
  **Round:** ______

  **Observed Sequence:**
  1. ______ 2. ______ 3. ______ 4. ______ 5. ______

  **My Hypothesis:**
  _________________________________________________________________________

  **Prediction for Next Counter:**
  [ ] Green  [ ] Blue  [ ] Other: ______

  **Confidence (1–10):** ______

  **Wager (Tokens):** ______

  **Round 3: Rule of Admissibility**
  *Define a criterion that allows your Hypothesis but excludes the 'Twilight' Hypothesis.*
  _________________________________________________________________________
  _________________________________________________________________________

  ---

  ## Handout B: Dealer's Protocol (Confidential)

  **Role:** You are Nature. You do not speak unless asked a yes/no question by the Tutor.

  **The Bag:** Contains 30 Green counters, 20 Blue counters.
  **The Rule:**
  1.  **Round 1:** Draw 5 counters. Replace them. Draw a 6th. (All will likely be Green due to probability, but if a Blue appears, note it).
  2.  **Round 2:** Same procedure.
  3.  **The Envelope:** The Tutor holds an envelope with a Green counter inside. This is the "Truth" for the sake of the game's payoff, regardless of what you draw.

  **Important:** Do not tell the Scientists the ratio of counters. Do not tell them your rule. If they ask "Is it all Green?", reply: "I cannot answer that."
