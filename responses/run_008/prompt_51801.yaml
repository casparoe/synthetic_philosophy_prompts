answer: |-
  Dear Friend,

  It is a pleasure to engage with you on this thorny issue, for you have put your finger on the central tension in contemporary metametaphysics. Your tentative principle, which suggests that a dispute is merely verbal when both parties can be right relative to their own definitions without the world changing, is a classic formulation often associated with Rudolf Carnap and later Eli Hirsch. It works beautifully for the tomato and the hot dog, where the underlying physical facts are settled and only the classification scheme varies. However, as you have noticed, it fails to capture your intuitions about the marriage case and the Platonist case because it lacks a clause regarding the significance of the concepts involved. To capture your specific set of verdicts, I propose we refine your principle into what I shall call the Principle of Explanatory and Normative Indispensability. This principle states that a dispute is merely verbal if and only if the disagreement can be resolved by semantic stipulation without loss of explanatory power regarding the fundamental structure of reality and without ignoring irreducible normative or social significance.

  Let us see how this principle handles your cases. In the tomato and hot dog disputes, the first clause does the work. Whether we call a tomato a fruit or a vegetable, or a hot dog a sandwich, makes no difference to our scientific explanations of biology or cuisine, nor does it carry deep normative weight. The world is indifferent, and our theories suffer no loss if we adopt either framework. Here, your original intuition holds firm. In the mereological case involving the table and the shoe, the first clause again does the heavy lifting. You view this as verbal because the existence of the mereological sum adds no explanatory power to our fundamental physics; we can describe the world completely by referencing the particles arranged table-wise and shoe-wise without needing to commit to a single object composed of both. This aligns with the thought that composition is a conceptual choice rather than a discovery of fundamental structure.

  However, the principle diverges from your original tentative thought in the Platonist and marriage cases. In the dispute over the number seven, the second clause regarding explanatory power is triggered. You likely view this as substantive because numbers are indispensable to our best scientific and mathematical theories; to deny their existence is not merely to change a word but to undermine the structure of logic and science itself. The world, in a structural sense, is not indifferent to whether mathematical truths hold. Similarly, in the marriage case, the clause regarding normative significance does the work. Even if the legal consequences are agreed upon, the term marriage carries a social and moral weight that transcends mere stipulation. To deny a couple the status of marriage is to deny them a recognized social reality that has value independent of the specific legal consequences listed. Thus, the dispute is not merely about a word but about social recognition and dignity. Finally, in the fish pain case, both clauses apply. The dispute is substantive because pain refers to a phenomenal state with explanatory role in neuroscience and because it carries immense normative weight regarding animal welfare.

  Regarding your question about Eli Hirsch and Theodore Sider, your intuitions suggest you are splitting the difference between them, which is a philosophically precarious but psychologically common position. Hirsch's quantifier variance is the right tool for explaining your verdict on the mereological sum. He argues that existence claims can vary across conceptual schemes without one being objectively correct, which matches your view that the sum dispute is verbal. However, Hirsch would also compel you to call the Platonist dispute verbal, which you refuse to do. Sider's resistance, based on the idea that there is a joint-carving meaning of existence that tracks the fundamental structure of reality, better explains your reluctance to call the Platonist dispute verbal. You seem to feel that numbers joint-carve reality in a way that mereological sums of tables and shoes do not. Therefore, neither theorist alone captures your entire set of verdicts; you are employing a selective realism where some existence claims track structure and others do not.

  If I must offer a prediction for a case you have not listed, consider the disagreement over whether a locked-in patient is conscious. Under the Principle of Explanatory and Normative Indispensability, this dispute is substantive. Even if the patient cannot behave or communicate, the presence of consciousness is a fact about the fundamental structure of minds (explanatory role) and carries immense normative weight regarding how we treat the patient. It is not merely a verbal dispute about the definition of consciousness because there is a fact of the matter about the inner life of the patient that persists regardless of our linguistic conventions. To call it verbal would be to ignore the reality of experience itself.

  Now I must be explicit about which of your verdicts you ought to give up. The most significant tension in your view lies between the mereological sum case and the Platonist case. Both are ontological disputes about what exists. If you accept Sider's view that ontology is substantive because it tracks joint-carving structure, you should give up the verdict that the mereological dispute is verbal and instead admit that there is a fact of the matter about whether sums exist, even if it is hard to discover. Conversely, if you accept Hirsch's view that ontology is often verbal due to quantifier variance, you should give up the verdict that the Platonist dispute is substantive and admit that numbers exist only relative to a conceptual framework. You cannot consistently hold that existence claims are verbal in one domain of ontology but substantive in another without a clear criterion for why numbers carve nature while sums do not. Given your puzzlement about the mereology case, I suggest you ought to give up the verdict that the mereological dispute is merely verbal. Aligning it with the Platonist case as a substantive dispute about the structure of reality would provide you with a more uniform metaphysics, even if it makes ontology more difficult. Alternatively, if you wish to preserve the verbal verdict on mereology, you must bite the bullet and accept that the Platonist dispute is also verbal, though I suspect your commitment to the reality of mathematics makes this the harder pill to swallow.

  I hope this helps you sort through the tangled web of your intuitions. It is often the case that our pre-theoretical verdicts outpace our principles, and the work of philosophy is to bring them into reflective equilibrium.

  Sincerely,

  Your Philosophical Correspondent
