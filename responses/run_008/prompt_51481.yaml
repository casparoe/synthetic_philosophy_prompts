answer: |-
  This is a classic problem in moral philosophy and political economy, often discussed under the headings of **commodification**, **market norms vs. social norms**, and **distributive justice**. Philosophers like Michael Sandel (*What Money Can't Buy*), Elizabeth Anderson (*Value in Ethics and Economics*), and Michael Walzer (*Spheres of Justice*) have built careers analyzing exactly these tensions.

  Your intuition that "desperation" and "meaning change" are relevant is correct, but as you noticed, they are too blunt on their own. To capture your specific verdicts (especially the nuance between kidney sales vs. organ priority, or bribery vs. building donation), we need a framework that distinguishes between *types of goods* and *types of exchange*.

  Here is a proposed principle that fits your data, followed by an honest audit of where your intuitions might be inconsistent, and how this applies to your test cases.

  ### The Principle: "Sphere Integrity and Undue Burden"

  Your verdicts are best explained by a two-part test. A transaction is impermissible (or should be illegal) if it violates **either** of the following constraints:

  **1. The Sphere Integrity Constraint (The "Meaning" Test)**
  Society is divided into different "spheres" (Politics, Medicine, Education, Commerce), each governed by a specific distributive norm.
  *   **Politics:** Distributed by *equality* (one person, one vote).
  *   **Medicine (Organs):** Distributed by *need* (triage).
  *   **Education:** Distributed by *merit/fitness*.
  *   **Commerce:** Distributed by *ability to pay*.
  *   **The Rule:** Money is a valid distribution mechanism in the *Commerce* sphere. It becomes wrongful when it invades another sphere and displaces that sphere's core norm.
      *   *Votes:* Selling a vote imports market norms into the political sphere, destroying equality.
      *   *Kidneys:* Selling an organ imports market norms into the medical sphere, displacing need with wealth.
      *   *College Bribery:* Imports market norms into the merit sphere.
      *   *Fast Pass/Scalping:* These are *already* in the commerce/leisure sphere. Inequality here is acceptable because the stakes (comfort, entertainment) do not violate a civic or essential norm.

  **2. The Undue Burden Constraint (The "Harm/Coercion" Test)**
  Even if a good is technically "sellable," the transaction is wrongful if the seller's consent is compromised by desperation *and* the physical/social risk is irreversible or severe.
  *   *Kidney Sale:* Fails this test. High surgical risk + permanent loss + sellers are often desperate.
  *   *Plasma:* Passes this test. Low risk, regenerative, regulated safety standards. Poverty is a factor, but the harm threshold isn't crossed.
  *   *Price Gouging:* Fails this test. In a disaster, the buyer is desperate. The seller exploits a temporary monopoly on survival essentials.
  *   *Concert Tickets:* Passes. It's a luxury; no one *needs* the ticket for survival.

  **The Crucial Nuance: Market vs. Reciprocity**
  This explains your Israel Organ Priority intuition.
  *   **Cash for Kidney:** A market transaction. Treats the body as a warehouse of parts. Violates Sphere Integrity.
  *   **Priority for Registration:** A reciprocity/insurance model. It says, "We are all in this together; if you help the pool, the pool helps you." It reinforces the *medical solidarity* norm rather than replacing it with a market norm. This is why your gut accepts it but rejects the $50k sale.

  ---

  ### The Inconsistency Audit: The Building Donation

  You suspected the "Building Donation" verdict was the weak link. You are right.

  *   **Your Verdict:** Bribery is wrong; Building Donation is "less wrong."
  *   **The Principle's Verdict:** Both violate **Sphere Integrity**.
  *   **The Analysis:** If the norm of university admissions is *merit*, then buying admission via a bribe and buying admission via a building fund achieve the same result: wealth displaces merit.
  *   **Why your gut differs:** You are likely conflating *legality/social licensing* with *morality*. Bribery is covert and violates explicit rules. Donations are overt and violate implicit norms. Institutions have "monetized" the loophole and made it legal.
  *   **The Fix:** To be consistent with your vote-selling and kidney-selling verdicts, you should view the building donation as **morally equivalent to bribery**, even if it is legally distinct. Both corrupt the educational sphere by allowing wealth to override merit. If you keep the verdict that "donations are fine," you have to admit that your principle isn't about "corruption of the sphere," but rather "violation of explicit rules." That is a weaker ethical position.

  ---

  ### Applying the Principle to Your Test Cases

  Here is how the **Sphere Integrity and Undue Burden** principle handles your new cases, along with the state of philosophical consensus.

  #### 1. Commercial Surrogacy
  *   **The Case:** Paying a woman to carry and surrender a child.
  *   **Principle Application:**
      *   *Sphere Integrity:* Does this turn reproduction (often viewed as a familial/social good) into a service contract? Many argue yes, commodifying the womb and the child.
      *   *Undue Burden:* Pregnancy carries significant health risk and emotional bonding. If the surrogate is poor, is the consent valid?
  *   **Verdict:** **Contested.**
      *   *Consensus:* There is no consensus. Some jurisdictions (UK, Canada) allow only altruistic surrogacy (no profit, expenses covered) to preserve Sphere Integrity. Others (some US states, Ukraine) allow commercial surrogacy, prioritizing bodily autonomy and contract freedom.
      *   *Prediction:* If you hold the "Kidney Sale" view strongly, you should likely oppose commercial surrogacy. If you hold the "Plasma" view strongly, you might support it with heavy regulation.

  #### 2. Paying Drug Addicts for Sterilization/Long-Term Contraception
  *   **The Case:** Offering cash or goods to vulnerable addicts to prevent reproduction.
  *   **Principle Application:**
      *   *Sphere Integrity:* Violates the norm that reproductive rights are inalienable and not subject to market pressure.
      *   *Undue Burden:* Fails spectacularly. Addiction creates a level of desperation that makes meaningful consent nearly impossible. It targets a specific vulnerable class.
  *   **Verdict:** **Widely Condemned.**
      *   *Consensus:* This is generally considered unethical by bioethicists and human rights organizations. It echoes eugenics programs. Even economists who support kidney markets usually draw the line here because the "desperation" constraint is so severe it negates consent.

  #### 3. Human Challenge Trials (Paying volunteers to be infected)
  *   **The Case:** Paying healthy volunteers to be deliberately infected with a pathogen (e.g., malaria, flu) to test vaccines faster.
  *   **Principle Application:**
      *   *Sphere Integrity:* Medicine usually aims to heal, not harm. However, research is a recognized sub-sphere where risk is accepted for social good.
      *   *Undue Burden:* Risk is high, but informed consent is possible. If payment is high, does it coerce the poor?
  *   **Verdict:** **Contested but shifting.**
      *   *Consensus:* Historically, this was taboo. Post-2020, there is growing acceptance among bioethicists *if* the risk is low (e.g., flu vs. Ebola) and the volunteers are well-compensated and monitored.
      *   *Distinction:* This aligns closer to your **Plasma** verdict than your **Kidney** verdict. It is a regulated, temporary bodily risk for social good. If you accept plasma sales, consistency suggests you should accept paid challenge trials, provided the risk is managed and not fatal/permanent.

  ---

  ### Summary of Consensus vs. Contested

  To honor your request for honesty about where experts agree vs. disagree:

  | Issue | Status | Why |
  | :--- | :--- | :--- |
  | **Selling Votes** | **Settled (Wrong)** | Universal consensus that market norms destroy democratic equality. |
  | **Price Gouging (Essentials)** | **Settled (Wrong/Illegal)** | Legal consensus exists; ethical consensus relies on the "necessity" constraint. |
  | **Plasma Donation** | **Settled (Permissible)** | Widely accepted due to low risk/regulation, despite poverty of sellers. |
  | **Kidney Markets** | **Deeply Contested** | **Economists** (e.g., Becker, Friedman) often argue for legalization to increase supply/save lives. **Ethicists** (e.g., Sandel, Kantians) argue it commodifies the human person and exploits the poor. |
  | **Surrogacy** | **Deeply Contested** | Varies wildly by culture/law. Centers on whether pregnancy is "labor" (sellable) or "relational" (not sellable). |
  | **College "Buy-ins"** | **Contested** | Legally accepted (donations), ethically debated. Most philosophers argue it undermines the purpose of the university, similar to your bribery intuition. |
  | **Challenge Trials** | **Emerging Consensus** | Moving from "Wrong" to "Permissible with strict safeguards" among bioethicists. |

  ### Final Recommendation for Your Belief System

  Your gut is actually quite sophisticated; it is tracking **Sandel's "Corruption Argument"** (money changes the meaning of things) mixed with a **Harm Principle**.

  To make your view coherent:
  1.  **Adopt the "Sphere Integrity" language.** It explains why votes and kidneys are off-limits (Political/Medical spheres) while tickets and fast passes are not (Leisure sphere).
  2.  **Distinguish Market from Reciprocity.** This saves your Israel Organ Priority intuition. Cash = Commodity. Priority = Membership/Solidarity.
  3.  **Correct the Building Donation.** Acknowledge that while it is legal, it is ethically equivalent to bribery under your own principle. It allows wealth to corrupt the merit sphere.
  4.  **Accept the Risk Gradient.** This explains Plasma (low risk) vs. Kidney (high risk) vs. Challenge Trials (medium risk, high social value).

  If you make those three adjustments, your framework will hold up against the new cases without requiring you to abandon your core intuitions.
