prompt: |-
  I sit on the editorial board of a mid-tier interdisciplinary journal (psych plus evolutionary biology, that sort of thing), and we keep getting papers that go like this: humans in the ancestral environment faced problem X, therefore trait Y is an adaptation for X, and here's a questionnaire on 200 undergrads thats consistent with Y existing. The latest one argues that gossip is an evolved free-rider-detection mechanism, resting mostly on the finding that people report enjoying gossip about norm violations more than gossip about, say, the weather.

  My co-editor has had enough and wants a blanket policy of desk-rejecting anything in this mould — adaptationist psychology isn't science, she says, until it makes risky predictions, it's just stories with a lab coat on. Another board member points out that we happily publish adaptationist work on peacock tails and finch beaks, and nobody calls those just-so stories, so what exactly is the difference? That we can't run experiments on humans? That we can't observe the ancestral environment? Or just that these hypotheses happen to be about us, which makes everyone squeamish?

  Draft the memo I'll circulate before thursday's meeting. It needs to reccomend something concrete: blanket rejection, case-by-case judgement, or a stated evidential bar — and if it's the bar, say what the bar is in terms a reviewer can actually apply to a manuscript, not "must be more rigorous". I want the co-editor's worry engaged with seriously, not waved off with the word falsifiability. The hard question, as I see it: is there a principled line between the gossip paper and a perfectly respectable behavioural ecology paper, or is it just degrees of confidence and tidier study design? If some of these papers are salvageable, say what they'd actually need — cross-cultural sampling, phylogenetic comparison, developmental signatures, whatever you think genuinely does the work. And be honest about whether the sceptics are right that the core move, inferring function from the fit between a trait and a hypothesised ancestral problem, is circular in a way the finch work isn't.

  Also, no reading lists or name-dropping of authorities please — I want the reasoning, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Editorial Board Member of a mid-tier interdisciplinary journal (Psych + Evol Bio).
      *   **Audience:** Fellow board members (including a skeptical co-editor and a pro-adaptationist board member).
      *   **Task:** Draft a memo for circulation before Thursday's meeting.
      *   **Core Issue:** Handling "Just-So Story" adaptationist psychology papers (Ancestral Problem $\rightarrow$ Trait $\rightarrow$ Undergrad Questionnaire).
      *   **Specific Conflict:** Co-editor wants blanket rejection (adaptationist psych isn't science). Another member argues inconsistency (we publish peacock/finch work).
      *   **Requirements:**
          *   Recommend something concrete (Blanket rejection, Case-by-case, or Evidential Bar).
          *   If Evidential Bar, define it concretely (not just "be rigorous").
          *   Engage seriously with the co-editor's worry (circularity, lack of risky predictions).
          *   Address the comparison to behavioral ecology (peacasts/finches).
          *   Be honest about circularity/fit inference.
          *   If salvageable, specify *how* (cross-cultural, phylogenetic, etc.).
          *   **Constraint:** No reading lists or name-dropping authorities. Focus on reasoning.

  2.  **Deconstruct the Scientific Problem:**
      *   *The Co-editor's Point:* Adaptationist psychology often relies on "Reverse Engineering." We see the trait, guess the problem, and claim a fit. This is vulnerable to confirmation bias. Undergrad questionnaires measure *current* preferences, not ancestral functions. It's easy to generate a story for any trait.
      *   *The Pro-Adaptationist Point:* Evolutionary logic applies to humans too. Peacock tails are inferred adaptations without time machines. Why is human behavior different?
      *   *The Crucial Difference:* In non-human behavioral ecology, we often have:
          1.  Comparative data (phylogenetic control).
          2.  Fitness proxies (reproductive success, survival).
          3.  Experimental manipulation of the *environment* or the *trait* in the wild.
          4.  Less reliance on self-report.
      *   *The "Gossip" Paper Flaw:* It relies on self-reported enjoyment (proximate mechanism) as proof of ultimate function (free-rider detection). It lacks comparative context (do all humans do this? do chimps?) and lacks a link to fitness (does gossiping actually reduce free-riding costs in a way that boosts survival/reproduction?).
      *   *Circularity:* Inferring function from fit is circular *if* the only evidence for the function is the existence of the trait. It becomes non-circular if independent evidence supports the function (e.g., the trait varies predictably with the ecological pressure).

  3.  **Determine the Recommendation:**
      *   *Blanket Rejection:* Too extreme. Evolutionary psychology *can* be done well. It shuts down a legitimate interdisciplinary niche.
      *   *Case-by-Case (Status Quo):* Leads to inconsistency and frustration (current situation).
      *   *Evidential Bar:* The best middle ground. It acknowledges the field's potential but raises the standard to match the co-editor's rigor concerns.
      *   *The Bar:* Needs to move beyond "Undergrads + Story." Needs to address the "Circularity" charge.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the tension. Validate both sides.
      *   **Addressing the Co-editor (The Skeptic):** Acknowledge the "Just-So" risk. Admit that self-report + ancestral storytelling is weak. Agree that "fit" alone isn't proof.
      *   **Addressing the Pro-Adaptationist (The Comparison):** Why peacocks are different. It's not about "humans vs. animals," it's about *data types*. Peacock papers usually have fitness data or phylogenetic contrasts. The gossip paper has neither.
      *   **The Core Scientific Issue:** Distinguish Proximate (mechanism/feeling) from Ultimate (function/fitness). The gossip paper conflates "I like doing this" with "This evolved to do X."
      *   **The Proposal (The Evidential Bar):** Define specific criteria.
          1.  *Independent Variation:* Does the trait vary with the proposed pressure? (Cross-cultural or ecological).
          2.  *Design Specificity:* Is the trait specific to the problem, or a byproduct of general intelligence?
          3.  *Fitness Link:* Even if proxy, needs to link to outcomes, not just feelings.
          4.  *Risky Predictions:* Pre-registered predictions that could falsify the adaptation claim.
      *   **Salvageability:** What would the gossip paper need? Cross-cultural variance in norm violation rates vs. gossip interest. Experimental manipulation of free-rider risk to see if gossip increases.
      *   **Conclusion:** Recommendation to adopt the "Evidential Bar" policy.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Avoid jargon where possible, but use precise scientific terms (proximate/ultimate, phylogenetic control).
      *   Ensure the "No Name-Dropping" constraint is met.
      *   Make sure the "Circularity" point is addressed honestly. (Yes, inferring function from existence is circular *unless* you add independent variables).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I say "falsifiability"? The prompt says "not waved off with the word falsifiability." I need to explain *how* it's falsifiable, not just use the word.
      *   *Check:* Did I address the peacock comparison? Yes, need to emphasize that peacock papers usually measure reproductive success, not ask peacocks how they feel.
      *   *Check:* Is the recommendation concrete? Yes, a set of 3-4 criteria for reviewers.
      *   *Check:* Is the circularity point honest? I need to admit that *some* circularity is inherent in historical sciences, but it's mitigated by independent lines of evidence.

  7.  **Final Polish:** Check the voice. It should sound like a senior academic trying to bridge a divide. (e.g., "We are not gatekeeping against evolutionary explanations; we are gatekeeping against low-effort ones.")

  8.  *(Final thought on the "Circularity" question)*: I need to be careful here. The prompt asks: "is there a principled line... or is it just degrees of confidence?" I should argue there *is* a principled line regarding *independent evidence*. Inferring function from form is hypothetically valid, but confirming it requires data independent of the trait's existence.

  9.  **Drafting the Memo.** (Proceeding to generate output based on these thoughts).

  **(Self-Correction during drafting the specific criteria):**
  Instead of vague "rigor," let's specify:
  1.  **Ecological/Contextual Variance:** If it's an adaptation to X, does the trait scale with X?
  2.  **Specificity:** Is the mechanism domain-specific?
  3.  **Outcome vs. Preference:** Measure behavior/outcomes, not just self-reported enjoyment.

  Let's assemble.

  *(Wait, one more check on the prompt)*: "If some of these papers are salvageable, say what they'd actually need." I need to be specific about the gossip paper example.
  *   *Fix:* Cross-cultural data (is gossip about norm violations universal or specific to high-cooperation societies?). Experimental priming (does increasing free-rider risk increase gossip?).

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board
  **FROM:** [Your Name]
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Proposal for Evidential Standards on Adaptationist Human Behavior Manuscripts

  **Context**

  We are currently divided on how to handle a specific class of manuscripts: those proposing evolutionary adaptations for human psychological traits based primarily on ancestral storytelling and self-report data from convenience samples (e.g., the recent "gossip as free-rider detection" submission).

  Dr. [Co-Editor] argues these should be desk-rejected on principle, viewing the methodology as inherently unscientific ("just-so stories"). Dr. [Board Member] argues that rejecting them while publishing non-human behavioral ecology is inconsistent and anthropocentric.

  This memo outlines a middle path. I recommend we adopt a specific **Evidential Bar** for adaptationist claims regarding human psychology. Blanket rejection risks throwing out valid interdisciplinary work; status quo case-by-case judgement is causing inconsistency and frustration. We need a standard that acknowledges the co-editor's validity concerns without denying the applicability of evolutionary theory to humans.

  **The Core Scientific Objection**

  We must engage seriously with the claim that this work is circular. The criticism is not that humans cannot be studied evolutionarily, but that the *logic of inference* in these specific papers is flawed.

  In our non-human behavioral ecology papers (e.g., finch beaks, peacock tails), we rarely infer function solely from the existence of the trait. A standard peacock paper typically includes:
  1.  **Fitness Proxies:** Data linking the trait to reproductive success or survival, not just preference.
  2.  **Comparative Control:** Phylogenetic comparison showing the trait co-varies with the ecological pressure across related species.
  3.  **Manipulation:** Experimental alteration of the trait or environment to observe functional changes.

  The "gossip" paper, by contrast, relies on a single link: *The trait exists + The story makes sense + Undergrads report liking it.* This conflates **proximate mechanism** (I enjoy this activity) with **ultimate function** (This activity evolved to solve X). Enjoyment is not evidence of adaptation; it is a feeling that may or may not track fitness.

  The circularity charge is valid *if* the only evidence for the ancestral problem is the existence of the modern trait. To break the circle, we need evidence independent of the trait's current existence.

  **The Proposal: A Three-Point Evidential Bar**

  I propose we adopt the following criteria for manuscripts making strong adaptationist claims about human psychology. Reviewers should be instructed to look for at least **two** of the following three elements to support the adaptationist hypothesis. If a paper relies solely on ancestral logic + self-report, it should be rejected or routed to a non-evolutionary track.

  **1. Independent Variation (The Ecological Test)**
  If Trait Y is an adaptation to Problem X, the expression of Y should vary predictably with the intensity of X.
  *   *Application:* A gossip paper cannot just show people like gossip. It must show that people in high free-rider environments gossip *more* about norm violations than those in low free-rider environments. This can be achieved through cross-cultural sampling or ecological priming experiments.
  *   *Why:* This moves beyond "the trait fits the story" to "the trait tracks the pressure."

  **2. Design Specificity (The Engineering Test)**
  The psychological mechanism should show signatures of design specific to the proposed problem, rather than being a byproduct of general cognition.
  *   *Application:* Does the gossip mechanism distinguish between norm violations and other negative information in a way that general negative bias does not? If the "adaptation" is indistinguishable from general curiosity or general negativity bias, the adaptationist claim is unsupported.
  *   *Why:* This addresses the "spandrel" critique—that the trait is a byproduct, not a direct adaptation.

  **3. Functional Outcomes (The Fitness Proxy Test)**
  The study must link the trait to an outcome relevant to the proposed function, not just subjective preference.
  *   *Application:* Instead of "I enjoy gossiping about cheaters," the data should show "Gossiping about cheaters reduces the likelihood of being cheated in subsequent interactions."
  *   *Why:* This bridges the gap between proximate feeling and ultimate function.

  **Salvaging the "Gossip" Paper**

  Under this policy, the current gossip manuscript would likely be rejected in its present form. However, it is salvageable. To meet the bar, the authors would need to:
  *   **Add Cross-Cultural Variance:** Show that interest in norm-violation gossip scales with the reliance on cooperation in that society.
  *   **Add Experimental Manipulation:** Prime participants with high free-rider risk and demonstrate a causal increase in gossip behavior (not just reported enjoyment).
  *   **Measure Consequences:** Demonstrate that the gossip actually alters the behavior of the norm-violator or protects the gossiper.

  **Addressing the "Principled Line"**

  Is there a principled line between the gossip paper and the finch paper? **Yes.**

  The line is not "humans vs. animals." The line is **independent evidence of the selective pressure.**
  *   In the finch paper, we measure the seeds available (the pressure) independently of the beak (the trait).
  *   In the gossip paper, the "pressure" (ancestral free-riding) is assumed based on the "trait" (modern gossip).

  We cannot observe the ancestral environment, which makes human evolutionary psychology harder. But "harder" does not mean "impossible." It means the burden of proof is higher. We must require authors to reconstruct the pressure using independent data (anthropological records, cross-cultural variance, experimental simulations) rather than assuming the pressure existed because the trait exists.

  **Recommendation**

  I move that we adopt the **Three-Point Evidential Bar** outlined above.

  1.  We do not ban adaptationist psychology.
  2.  We do not accept ancestral storytelling + undergraduate self-report as sufficient evidence of function.
  3.  We require authors to demonstrate that the trait varies with the proposed pressure, is specific to that pressure, or produces functional outcomes related to that pressure.

  This addresses Dr. [Co-Editor]'s concern about circularity by demanding independent variables. It addresses Dr. [Board Member]'s concern about consistency by aligning our human standards with the data requirements of our non-human behavioral ecology papers.

  Please review this framework before Thursday. I believe this allows us to maintain rigor without abandoning the interdisciplinary mission of the journal.
