answer: |-
  Here is my decomposition of the credence that the heterogeneity problem is *fatal* to hedonism.

  ### The Decomposition

  **(1) The probability that all paradigm pleasures share some one natural property:** **0.25**
  *Justification:* Introspective evidence suggests qualitative differences (e.g., relief vs. thrill) are too radical to be reduced to a single "hedonic tone" without stretching the definition beyond recognition.

  **(2) Conditional on there being no shared property, the probability that hedonism still survives via rescue moves:** **0.50**
  *Justification:* Attitudinal hedonism (taking pleasure *in* things) is the only viable rescue, but it risks collapsing into desire-satisfactionism, making its status as "hedonism" a terminological coin-flip.

  **(3) The probability that, even if hedonism ends up false, heterogeneity is what actually kills it:** **0.40**
  *Justification:* The Experience Machine and objections regarding truth/agency strike at the *value* of pleasure directly, whereas heterogeneity only attacks the *metric*, making the former more likely causes of death.

  ### The Combination

  To arrive at the final credence that heterogeneity is **fatal**, we need three conditions to obtain simultaneously: there must be no shared property (Term 1 fails), the rescue moves must fail (Term 2 fails), and heterogeneity must be the specific cause of that failure rather than a rival value (Term 3 succeeds).

  I am calculating this as a chain of conditional probabilities:
  $$P(\text{Fatal}) = P(\neg \text{Shared}) \times P(\neg \text{Rescue} | \neg \text{Shared}) \times P(\text{Het is Cause} | \text{False})$$

  *   $P(\neg \text{Shared}) = 1 - 0.25 = 0.75$
  *   $P(\neg \text{Rescue} | \neg \text{Shared}) = 1 - 0.50 = 0.50$
  *   $P(\text{Het is Cause} | \text{False}) = 0.40$

  **Calculation:** $0.75 \times 0.50 \times 0.40 = 0.15$

  **My Final Credence:** **0.15**

  ### Least Confident Term

  I am least confident in **Term (2)** (the survival of hedonism via rescue moves).

  The boundary between "Attitudinal Hedonism" and "Desire Satisfactionism" is porous. If "taking pleasure in X" is functionally identical to "desiring X to be actual," then the rescue move saves the theory's *structure* but abandons its *spirit* (which is usually about conscious experience).

  **What would move it:** A case where attitudinal pleasure and desire come apart.
  *Invented Case:* Consider "The Reluctant Beneficiary." A person strongly desires to be famous (pro-attitude toward fame), but every time they imagine being famous, they feel a sinking dread (negative phenomenal tone/no attitudinal pleasure). Conversely, consider "The Surprised Enjoyer." A person has no prior desire to listen to avant-garde jazz, but upon hearing it, they take immense attitudinal pleasure in it. If Attitudinal Hedonism counts the Surprised Enjoyer as having well-being but Desire Theory does not, the rescue move is distinct and robust. If they track perfectly, Attitudinal Hedonism is just Desire Theory in disguise, and Term (2) drops to near zero.

  ### Diagnosing Your Disagreement

  Given my numbers, I believe you and your friend are primarily disagreeing on **Term (2)**: *What counts as an acceptable unifier?*

  *   **Your Friend (0.25 Fatal):** She assigns a high probability to Term (2). She believes the "pro-attitude" reading is a legitimate refinement of hedonism, not a surrender. For her, heterogeneity kills *Sensational* Hedonism, but not Hedonism *simpliciter*.
  *   **You (0.65 Fatal):** You assign a low probability to Term (2). You likely view the pro-attitude move as changing the subject (essentially admitting hedonism was wrong and switching to desire theory). You may also weight **Term (3)** higher than I do; if you believe that the inability to quantify pleasure is a worse sin than the Experience Machine intuition, you see heterogeneity as the primary executioner.

  I side closer to your friend on the outcome (Heterogeneity isn't fatal), but for a different reason: I think the **Experience Machine** (Term 3) is the real assassin. Heterogeneity is a wound, but the demand for reality is the bullet.
