  ### Part 1: Brainstorming Candidate Principles

  To diagnose Maya, we need to map her four verdicts against the standard landscape of population ethics. Her intuitions are remarkably stable, which suggests she is operating under a coherent, albeit specific, theoretical framework. Here are the three strongest candidate principles that fit her data, along with how each of her four cases constrains them.

  **Candidate 1: The Strict Asymmetry (Person-Affecting Restrictivism)**
  *   **The Principle:** Potential people do not count as moral patients for the purpose of *benefit*, but they do count for *harm*. Bringing a miserable person into existence harms them (wrong); bringing a happy person into existence benefits no one (neutral). We have strong duties to existing people and negative duties to future people, but no positive duties to create future people.
  *   **Constraints:**
      *   *Case 1 (Misery):* **Fits.** Creating a miserable life harms the child.
      *   *Case 2 (Childfree):* **Fits.** Creating a happy life adds no value, so choosing childfree is not wrong.
      *   *Case 3 (Pain vs. Bliss):* **Fits.** Existing pain counts fully; potential bliss counts for zero. Existing interests lexically trump potential ones.
      *   *Case 4 (Policy Threshold):* **Strained.** Standard Asymmetry struggles with Non-Identity cases (where policy changes *who* is born). If the future people have lives worth living, standard Person-Affecting views say "no harm done." Maya's insistence on a specific "threshold" where it becomes *wrong* suggests she accepts some impersonal constraint on future quality of life, not just a harm constraint.

  **Candidate 2: Critical-Level Utilitarianism (CLU)**
  *   **The Principle:** The value of a population is the sum of individual well-being minus a "Critical Level" ($C$). Lives above $C$ add positive value; lives below $C$ add negative value. $C$ is set higher than the "neutral" point (where life is worth starting).
  *   **Constraints:**
      *   *Case 1 (Misery):* **Fits.** If the miserable life is below $C$, it adds negative value.
      *   *Case 2 (Childfree):* **Fits (conditionally).** If the happy child's life is only slightly above $C$, the value added might be too small to generate an obligation against the parents' moderate enjoyment.
      *   *Case 3 (Pain vs. Bliss):* **Strained.** CLU is aggregative. If the new life contains "vastly more happiness" than the pain relief adds, CLU should recommend creating the life (unless existing people's utility is weighted much higher). Maya's "obviously" suggests a lexical priority, not a trade-off.
      *   *Case 4 (Policy Threshold):* **Fits.** This is CLU's natural home. The "threshold" is the Critical Level. Lowering future wellbeing is fine as long as they stay above $C$.

  **Candidate 3: Sufficientarian Person-Affecting View (Hybrid)**
  *   **The Principle:** Morality is primarily about benefiting/harming existing people. However, regarding future people (Non-Identity cases), we have a duty of *sufficiency*: we must not bring people into existence below a threshold of "a life well worth living," but we have no duty to maximize well-being above that threshold.
  *   **Constraints:**
      *   *Case 1 (Misery):* **Fits.** Below threshold = Wrong.
      *   *Case 2 (Childfree):* **Fits.** No duty to maximize; above threshold is sufficient.
      *   *Case 3 (Pain vs. Bliss):* **Fits.** Existing interests trump potential optimization.
      *   *Case 4 (Policy Threshold):* **Fits Best.** This view explicitly incorporates the threshold language Maya uses ("permissible... unless... below that threshold") while maintaining the Person-Affecting priority for existing people.

  ---

  ### Part 2: Prediction on the "Saved Embryo" Case

  **The Case:** A fertility clinic will destroy a viable embryo. Implanting it costs no existing person anything. The resulting person would have a wonderful life.
  **Question:** Is the world in which implantation happens *better* than the world in which it doesn't?

  **My Prediction:** Maya will say **No, the worlds are of equal moral value.** (She may say implantation is *nice* or *permissible*, but she will reject the claim that the world is *better*.)

  **Reasoning:**
  Maya's track record shows a consistent refusal to treat potential happiness as a moral good that can tip the scales.
  *   In **Case 2**, she denied that failing to create a happy child was wrong (implying the happy child adds no *obligatory* value).
  *   In **Case 3**, she refused to trade existing pain for vast potential bliss (implying potential bliss has negligible or zero weight).
  *   In **Case 4**, she allowed the lowering of future wellbeing as long as it stayed above a threshold (implying that *more* wellbeing above the threshold is not morally required).

  While the embryo is "viable," for Maya, it likely falls under the category of "potential person." Since no existing person is harmed by the destruction (cost is zero), and the potential person is not harmed by non-existence (life is wonderful, not miserable), her framework treats this as a moral null event. To say the world is *better* with the child would commit her to the view that creating happy lives adds value—a view she rejected in Case 2 and Case 3.

  ---

  ### Part 3: Diagnosis of Maya's Principle

  **Diagnosis:** Maya is running the **Sufficientarian Person-Affecting View (Candidate 3).**

  **Why this fits best:**
  1.  **It explains the Threshold Nuance (Case 4):** The Strict Asymmetry (Candidate 1) typically says creating a life that is "worth living" is neutral, regardless of how low above neutral it is. Maya's insistence that policy becomes *wrong* if lives fall "even slightly below that threshold" implies the threshold itself has deontological weight, not just the "harm" of misery. This aligns with Sufficientarianism.
  2.  **It explains the Lexical Priority (Case 3):** CLU (Candidate 2) is aggregative; it struggles to explain why *any* amount of existing pain trumps *vast* potential bliss. The Sufficientarian Person-Affecting view prioritizes the claims of existing people over the "optimization" of future people.
  3.  **It explains the Anti-Natalist Leanings (Case 2):** Like the Strict Asymmetry, it denies a duty to create happy lives, fitting her resistance to the "selfish" label.

  **Why I prefer it over the rivals:**
  *   **Over Strict Asymmetry:** The Strict Asymmetry cannot easily account for Case 4's Non-Identity intuition. If the policy changes *who* is born, and they are all happy, standard Person-Affecting views say "no one is harmed." Maya says it is wrong if they drop below the threshold. She is implicitly accepting an impersonal constraint on future sufficiency.
  *   **Over CLU:** CLU cannot account for Case 3 without ad-hoc weighting. If Maya were a CLU theorist, the "vastly more happiness" of the new blissful life should eventually outweigh the friend's chronic pain. Her unmoved reaction suggests she does not view potential happiness as commensurable with existing suffering.

  ---

  ### Part 4: The Discriminating Case

  To definitively separate these principles for your reading group, you need a case that isolates the **value of aggregating potential good** (separating CLU from the rest) and the **definition of the threshold** (separating Sufficientarianism from Strict Asymmetry).

  **The Case: "The Costless Multitude vs. The Barely-Sufficiency Child"**

  **Scenario A (Aggregation Test):**
  You have a magic button. Pressing it costs you and everyone else *nothing*. It brings into existence 1,000 new people. Each will have a "Moderately Happy" life (clearly worth living, plenty of joy, no suffering).
  *   *Question:* Is pressing the button **morally better** than not pressing it?

  **Scenario B (Threshold Definition Test):**
  A couple can conceive a child. The child will have a life that is **Net Positive** (more pleasure than pain, they will not regret existing) but **Below Sufficiency** (they will lack autonomy, deep relationships, or dignity; a life of "contented servitude"). It costs the parents nothing.
  *   *Question:* Is conceiving the child **wrong**?

  **Predictions:**

  | Principle | Scenario A (Costless Multitude) | Scenario B (Barely-Sufficiency) |
  | :--- | :--- | :--- |
  | **Critical-Level Utilitarianism** | **Better.** (Assuming "Moderately Happy" is above the Critical Level, this adds massive value. Even if below C, it avoids negative value). | **Wrong.** (If "Below Sufficiency" is below the Critical Level, it adds negative value). |
  | **Strict Asymmetry** | **Neutral.** (Creating happy lives adds no value, regardless of number). | **Permissible.** (As long as the life is "Net Positive" / worth living, no harm is done). |
  | **Sufficientarian Person-Affecting** | **Neutral.** (No duty to maximize above the threshold). | **Wrong.** (Violates the duty of sufficiency, even if life is net positive). |

  **Why this works:**
  *   **Scenario A** separates **CLU** from **Maya's View**. If Maya says "Better," she is a Utilitarian. If she says "Neutral," she is in the Person-Affecting/Sufficientarian camp.
  *   **Scenario B** separates **Strict Asymmetry** from **Sufficientarianism**. Both say Scenario A is Neutral. But in Scenario B, the Strict Asymmetry says "Permissible" (because the child isn't *harmed* by existence), while the Sufficientarian view (which I diagnose Maya as holding) says "Wrong" (because the child falls below the *threshold* of a life well worth living).

  **Recommendation:** Start with **Scenario A**. If she says "Neutral," you have ruled out CLU. Then move to **Scenario B**. If she says "Wrong," you have confirmed she is a Sufficientarian, not a standard Asymmetry theorist. This will give your group a precise map of her moral geometry.
