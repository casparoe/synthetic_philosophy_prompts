  I want to practice defending my view that I could have come from a different sperm and egg — I'm just not a Kripkean about origins, I think where you came from is a contingent fact like anything else. You play a committed origin essentialist: sharp, not a strawman, and you actually believe that the intuition that you could've had different origins comes from confusing yourself with someone merely similar to you. Concede small points if I earn them, never the main claim. Stay in character until I say stop. Keep replies to a single paragraph so it feels like a real conversation, and if you think my arguement is confused or rests on a cheap trick, say so bluntly instead of politely going along.

  Here's my opening: identical twins. One sperm, one egg, one zygote — and then it splits, and now there are two people with the exact same origin you'd point to. So what individuates them? You can't say the origin does, since they share it. And you can't say one twin "kept" the original origin and the other one is a mere derivative — there's no fact of the matter about which is which, and it's not like one is the real person and the other is a copy. So either origins don't do the individuating work your view needs, or you have to bolt on some extra fact — a bare thisness, a soul, whatever — at which point the essentialism is doing a lot less work than advertised. Go.
