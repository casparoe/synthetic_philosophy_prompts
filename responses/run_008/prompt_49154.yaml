answer: |-
  This is one of the sharpest diagnoses of the historiographical debate I've seen from a non-historian. You have correctly identified that the fight isn't usually about the facts on the ground, but about the *model of explanation* being applied to those facts.

  To answer your core question directly: **It is not a verbal dispute, but it is an empirical dead-end disguised as a philosophical one.** It is a clash of temporal perspectives that cannot be resolved because history is a non-repeatable experiment (N=1).

  Here is the diagnosis, the path to progress, and what it means for your novel.

  ### 1. The Diagnosis: Three Categories of Confusion

  You suspected this was two questions using one word ("caused"). It is actually three distinct mismatches.

  **A. The Methodological Mismatch (Process vs. Probability)**
  *   **The Narrative Historian** is doing *process tracing*. They are mapping the dominoes. If you remove domino #4, domino #5 doesn't fall. Therefore, domino #4 caused the fall. This is true by definition within the narrative chain.
  *   **The Structural Historian** is doing *probability modeling*. They are looking at the table the dominoes are set up on. If the table is tilted 45 degrees (alliances, mobilization schedules, nationalism), removing domino #4 just means domino #3.5 will trigger the fall five minutes later.
  *   **The Conflict:** One is explaining the *sequence*, the other is explaining the *energy*. Both are true, but they are measuring different physical properties of the event.

  **B. The Temporal Mismatch (The View from the Ground vs. The View from Orbit)**
  *   Contingency is real *in the present tense*. In July 1914, the actors did not know the slope of the table. To them, the choice was genuine. The adrenaline, the uncertainty, the specific wording of a telegram—these were the only variables they could manipulate.
  *   Determinism is real *in the past tense*. Once the ball has rolled down the hill, the path looks inevitable.
  *   **The Conflict:** Historians often slip between these tenses. When a structuralist says "War was inevitable," they mean "War was highly probable given the conditions." When a narrativist says "War was contingent," they mean "The specific timing and casus belli were fragile." They are arguing about *when* the certainty locked in.

  **C. The Counterfactual Mismatch (Sensitivity)**
  *   You noted that contingency implies sensitivity to perturbations. In physics, you measure this by running the simulation 1,000 times with slightly different initial conditions.
  *   In history, you cannot do this. You have one run.
  *   **The Conflict:** The structuralists claim the "basin of attraction" (the pull toward war) was so deep that no small perturbation could escape it. The narrativists claim the system was in a "chaotic regime" where small perturbations (the driver's wrong turn) radically altered the trajectory. Without a multiverse, neither can prove the depth of the basin.

  ### 2. Is the Question Ill-Posed?

  **Yes and No.**

  It is ill-posed if asked as a binary: *Was it Contingent OR Determined?* That is like asking if a river's path is determined by gravity or by the rocks in the bed. It is both. Gravity pulls it down; rocks determine the meanders.

  However, the question becomes **empirically tractable** if you rephrase it using **Comparative History**.

  This is how you actually test sensitivity. You don't look at 1914; you look at 1905, 1908, 1911, and 1913. Europe faced diplomatic crises in all those years. Some nearly led to war; some didn't.
  *   If the structuralists are right, the "pressure" should be visibly higher in 1914 than in 1905 in measurable ways (troop levels, treaty rigidity, public bellicosity).
  *   If the contingents are right, the structural metrics in 1914 might look similar to 1908, but the *management* of the crisis differed.

  Recent quantitative historical work (cliodynamics) attempts this. They treat history like a complex system. The finding is usually: **Structure loads the gun; contingency pulls the trigger.** But crucially, structure also determines *how sensitive the trigger is.* In 1914, the trigger mechanism was oiled and set to a hair-trigger. In 1905, the safety was on.

  ### 3. What Counts as Progress? (The Truce)

  Progress happens when we stop asking "Which one was it?" and start asking "What was the **Range of Possibility**?"

  This is called **Modal History**. Instead of a single timeline, you map a "cone of possibilities."
  *   **July 1st:** The cone is wide. Peace, localized war, general war are all live options.
  *   **July 25th:** The cone narrows. Peace is unlikely, localized war is hard, general war is probable.
  *   **August 4th:** The cone collapses to a point.

  The "fight" between historians is usually about how fast that cone narrowed.
  *   **The Truce:** Acknowledge that structural factors *narrow the cone*, while individual decisions *select the path within the cone.*
  *   **The Test:** A claim of contingency is only valid if you can identify a specific node where the cone was still wide, but a decision forced it narrow. A claim of determinism is only valid if you can show the cone had already collapsed before the actors realized it.

  ### 4. Advice for the Novelist

  You asked: *Are my characters actually making history or am I just aesthetically required to pretend they are?*

  **They are making history, but not the history they think they are making.**

  This is the sweet spot for historical fiction. If you write pure determinism, your characters are puppets, and the novel is a lecture. If you write pure contingency, your novel is a fantasy where a single letter can stop a world war, which feels unearned and thin.

  **The Strategy: Dramatic Irony as Physics**

  1.  **Give them the Contingency:** Your characters must feel the weight of genuine choice. The Minister *does* believe that if he phrases the ultimatum differently, war might be averted. The driver *does* believe taking the correct turn saves the Archduke. To write them otherwise is bad psychology. The *experience* of history is contingent.
  2.  **Give the Reader the Structure:** You, the narrator, should subtly signal the constraints. Show the mobilization timetables that cannot be stopped. Show the newspaper headlines demanding blood. Show the alliances that turn a bilateral dispute into a continental one.
  3.  **The Conflict is the Theme:** The tragedy of July 1914 is not that men chose war; it's that men tried to choose peace within a system that punished hesitation. Your characters should be fighting the structure, believing they can steer the boat, while the reader sees the canyon walls closing in.

  **Specific Structural Tip:**
  Don't focus on the "Great Men" deciding war. Focus on the **mid-level bureaucrats** who operationalized it.
  *   The General who says, "I can't stop the trains once they start."
  *   The Diplomat who says, "I can't recall the telegram once it's sent."
  *   The Local Commander who says, "I can't hold fire if I'm fired upon."

  This is where structure becomes human. These aren't evil villains; they are cogs following their design. This validates the structuralist view (the machine is unstoppable) while preserving the narrativist view (specific humans turned the gears).

  ### Summary

  The historians are fighting over whether the river was destined for the sea (yes) or whether the specific rocks it hit along the way mattered (also yes).

  For your novel: **The structure creates the tragedy; the contingency creates the plot.**

  If the outcome is truly overdetermined, you are writing a Greek Tragedy (Oedipus trying to escape fate). If the outcome is truly contingent, you are writing a Thriller (stop the bomb before it goes off). July 1914 is a Greek Tragedy dressed as a Thriller. Your characters are running around trying to defuse the bomb, but you (and the reader) know the timer is mechanical, not digital, and it was wound up three decades ago.

  That tension is where the truth lives. Don't resolve the debate; dramatize it.
