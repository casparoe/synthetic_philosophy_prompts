answer: |-
  You have identified a fissure that runs directly through the bioethics of mental health law. The enforcement of psychiatric advance directives (PADs), or Ulysses contracts, during a period of incapacity and refusal, does indeed rest upon a metaphysical commitment that is rarely subjected to rigorous scrutiny in the courtroom. The practice assumes that the 'past self' retains a normative authority over the 'present self' that exceeds the present self's own claim to bodily integrity.

  To answer your question, we must distinguish between the *operational assumptions* of the law (what it strictly requires to function), the *philosophical frameworks* that comfortably support it, and the *live disagreements* regarding whether those frameworks are coherent or justified.

  ### 1. The Implicit Theory: Precedent Autonomy and Authenticity

  Strictly speaking, the legal practice of enforcing PADs does not require a full-blown metaphysical theory of personal identity. It requires only a theory of **normative authority**.

  **What is Agreed:**
  There is a consensus among legal scholars and bioethicists that the practice relies on the principle of *precedent autonomy*. This principle holds that a competent agent's prior instructions retain moral force after competence is lost. To make this work, the law presupposes a **Continuity of Interest**. It assumes that the interests of the person at Time 1 (competent) and Time 2 (incapacitated) are sufficiently aligned that Time 1's assessment of 'best interests' overrides Time 2's assessment.

  **What is Disputed:**
  Philosophers disagree on whether this continuity of interest implies a *continuity of identity*.
  *   **The Realist View:** Some argue that for precedent autonomy to bind, Time 1 and Time 2 must be numerically identical. If they are not the same entity, one cannot bind the other.
  *   **The Constructivist View:** Others argue identity is irrelevant; what matters is the *authenticity* of the values expressed. The law implicitly sides with the view that the 'well self' possesses a higher degree of authenticity than the 'ill self'. The ill self is treated not as a different person, but as a corrupted version of the same person—a 'usurper', as you noted.

  Therefore, the practice strictly requires only that the past self is deemed a more reliable guardian of the patient's *true* values. It does not strictly require a specific ontology of the self, but it sits uneasily with any ontology that privileges the present subject of experience above all else.

  ### 2. Evaluating Candidate Theories of the Self

  Here we encounter the live disagreements you anticipated. Different theories of personal identity license or forbid the practice to varying degrees.

  #### A. Narrative Identity (The Dennettian View)
  This view posits that the self is a 'centre of narrative gravity'. We are the protagonists of the stories we tell about ourselves.

  *   **Fit with Practice:** This fits the PAD model neatly. If the self is a story, then a psychotic episode is a plot disruption or a genre shift that threatens the coherence of the narrative. The PAD acts as an editorial instruction to maintain the integrity of the overarching story. The 'ill self' is a character gone rogue; the directive restores the plot.
  *   **The Disagreement:** There is a significant dispute over whether Dennett's formulation is ontological or merely heuristic.
      *   *Proponents* argue that because we live by narratives, protecting the narrative *is* protecting the self.
      *   *Critics* argue that a 'fiction' cannot have rights. If the self is merely a useful abstraction, on what grounds can this abstraction override the concrete suffering of the biological organism in the present? If Dennett is right that the self is a fiction, then enforcing a PAD might be protecting a story at the expense of a real, suffering entity. This remains a live and unresolved tension in the literature.

  #### B. Parfitian Reductionism
  Derek Parfit argued that personal identity is not what matters; rather, what matters is *Relation R* (psychological connectedness and continuity).

  *   **Fit with Practice:** A Parfitian view creates a sliding scale. If the psychological connectedness between the well self and the ill self is high (e.g., memory and character traits remain largely intact), the PAD is binding.
  *   **The Conflict:** Psychosis and mania often sever psychological connections drastically. A Parfitian might argue that during a severe manic episode, the degree of connectedness drops so low that Time 1 and Time 2 are practically different people. In this light, enforcing a PAD looks less like respecting autonomy and more like one person (the past) imposing their will on a stranger (the present).
  *   **Legal Implication:** If the law adopted a strict Parfitian view, it would need to assess the *degree* of psychological rupture before enforcing a directive. Currently, the law tends to be binary: either you have capacity or you do not. A Parfitian law would require a gradient of capacity and connectedness.

  #### C. The Present-Subject (Experiential) View
  This view holds that moral status belongs exclusively to the subject of present experience. The past self no longer exists; only the current experiencer does.

  *   **Fit with Practice:** This view is fundamentally hostile to PADs involving refusal of treatment. To override a contemporaneous refusal is to violate the autonomy of the only entity that currently exists.
  *   **Legal Implication:** Adopting this view would effectively abolish the Ulysses contract in cases of active refusal. Treatment could only be administered on *parens patriae* grounds (best interests/safety), never on the grounds of 'respecting the patient's prior wishes'. The language of 'rights' would vanish from the equation, replaced entirely by welfare calculations.

  ### 3. The Underdetermined Element: Retrospective Endorsement

  You asked whether an appeal to retrospective endorsement could justify the practice while staying neutral on identity. This is the most pragmatic escape hatch available to the law, but it is philosophically precarious.

  **The Argument:**
  Many patients, upon recovery (Time 3), report gratitude that they were treated against their will at Time 2. They endorse the actions taken by Time 1. Proponents argue this 'Time 3' validation justifies the intervention without needing to solve the Time 1 vs. Time 2 identity crisis.

  **The Disagreement:**
  *   **Supporters** claim this renders the metaphysical debate moot. If the unified life-course (Time 1 through Time 3) approves of the intervention, the practice is justified by outcome and holistic autonomy.
  *   **Critics** flag two major issues:
      1.  **Epistemic Circularity:** We often only hear from the patients who recover. Those for whom the treatment was traumatic or ineffective may not be in a position to endorse it, or may have dropped out of care.
      2.  **Adaptive Preference:** There is a dispute over whether retrospective gratitude is genuine endorsement or a form of psychological adaptation (akin to Stockholm Syndrome). If the patient is glad *because* the treatment successfully restored them to their Time 1 state, does that validate the coercion, or does it merely prove the treatment was effective at restoring the *status quo ante*?

  Consequently, retrospective endorsement does not fully solve the identity problem; it merely shifts the justification from *identity* to *wellbeing*. It remains underdetermined whether this shift is sufficient to override the fundamental liberal principle of contemporaneous refusal.

  ### 4. Legal Repercussions of Rebuilding on Different Theories

  If jurisdictions were to explicitly rebuild their laws on one of these candidate theories, the practical landscape would shift significantly.

  | Theory | Legal Shift | Practical Consequence |
  | :--- | :--- | :--- |
  | **Current Hybrid** (Precedent Autonomy) | *Status Quo* | PADs are binding if formalised. Focus is on prior competence. |
  | **Narrative Identity** | Strengthening of PADs | Courts would look at 'life story coherence'. Treatment could be mandated to preserve the narrative arc, potentially even in grey areas of capacity. |
  | **Parfitian Reductionism** | Weakening of PADs | Enforcement would depend on the *degree* of psychological connectedness. Severe psychosis might void the directive as the 'person' has changed too much. |
  | **Present-Subject** | Abolition of Ulysses Contracts | Contemporaneous refusal would be absolute. Treatment only permissible under emergency safety statutes, not 'autonomy'. |
  | **Retrospective Endorsement** | Post-hoc Review | Legality of treatment would remain uncertain until recovery. Clinicians would act on risk, subject to later ratification by the recovered patient. |

  ### 5. Is Dennett's Metaphor Doing Work?

  Finally, regarding your specific query on Dennett's 'centre of narrative gravity':

  **Agreed:** It is widely accepted that the metaphor is vivid and captures the *phenomenology* of how patients experience their illness (as a disruption to their story).

  **Disputed:** It is hotly contested whether the metaphor does *normative work*.
  *   One camp argues that because the narrative self is how we make sense of our lives, protecting the narrative is a moral imperative.
  *   The opposing camp argues that Dennett himself views the self as a 'fiction'. In moral philosophy, we generally do not allow fictions to override the physical welfare of real beings. If the 'centre of narrative gravity' is a theorist's construct, using it to justify involuntary medication risks reifying a metaphor into a coercive tool.

  There is no settled doctrine here. Some bioethicists utilise the narrative view to champion PADs; others use the deflationary nature of Dennett's view to argue that we should focus on the biological organism's current suffering instead.

  ### Conclusion

  The practice of enforcing psychiatric advance directives presupposes a theory of the self that is **metaphysically agnostic but ethically committed to the priority of the competent past**. It papers over the crack in personal identity with the plaster of 'authenticity'.

  It strictly requires only that the law recognises the competent self as the legitimate author of the patient's life. It sits comfortably with Narrative Identity views but faces significant tension from Parfitian and Present-Subject views. The appeal to retrospective endorsement offers a pragmatic justification but fails to resolve the underlying metaphysical dispute regarding who, exactly, is being harmed and who is being helped.

  Until the law acknowledges this tension, it will continue to operate on a 'split' theory: treating the patient as a single continuous person for the purposes of liability and directive enforcement, but as a compromised vessel for the purposes of immediate care. Whether this is a necessary fiction or a moral inconsistency remains one of the most pressing unanswered questions in the philosophy of psychiatry.
