  *(Refining Nagel)*: Nagel's argument is that death is a *misfortune* because it deprives. The Epicurean counter is that misfortune requires a subject. This is the "Timing Problem" or "Subject Problem." I should mention that this is still actively discussed (e.g., Ben Bradley's work).

