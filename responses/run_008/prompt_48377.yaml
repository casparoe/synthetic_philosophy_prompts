prompt: |-
  I'm a high school student who just finished a unit on classical Athens, and I've been trying to work out what I actually think about whether its democracy failed, by going with my gut on the three episodes we studied. Mytilene reads to me as the system working: the assembly voted in fury to execute the entire population, but reconvened the next day, heard the argument again, and sent a faster ship to overtake its own decree. Sicily feels different: the assembly debated it properly, took a vote, and even gave the skeptic Nicias a command, yet it was the biggest catastrophe of the three — though I can't decide whether a terrible decision reached by fair procedure is a failure of democracy or just a failure that happened under it. And the trial of Socrates is the one that breaks my tentative principle: no rampaging mob, a properly constituted jury, legal forms followed throughout, and yet it's the one I'm most confident to call a failure of the democracy rather than merely in it. My tentative principle was roughly that democracy fails when passion overrides debate — that covers Mytilene's first vote and gets overturned by the correction, but it says nothing about Sicily, and it scores Socrates's orderly trial a success. Is there a principle that captures all three of my verdicts, or close to it? If not, which verdicts should I give up, and in particular, should the corrected Mytilene decision count for the system or against it? Please also say what the resulting principle predicts for a case I haven't worked through: after the battle of Arginusae, the assembly voted to try the victorious generals collectively rather than individually, and executed them.
