answer: |-
  Here is the principle that ties your verdicts together, stripped of the philosophy jargon.

  ### The Principle: **The Dividend Rule**

  **Science is an investment of complexity. Every time you add a patch, a fudge factor, or an unseen entity to a theory, you are paying a cost. That cost must be repaid with interest in the form of new understanding, prediction, or unification.**

  If the adjustment merely saves the theory from being wrong without opening any new doors, the investment is bad. If the adjustment allows the theory to explain *more* than it did before, the investment is good.

  Here is how The Dividend Rule handles your specific cases:

  1.  **The Patched Theory (Good):** You added complexity (the patch), but it paid a dividend (independent confirmation + new predictions). You spent a dollar to make ten.
  2.  **Neptune vs. Vulcan (The Tension):**
      *   **Neptune:** Cost one invisible planet. Dividend: Explained Uranus *and* gave us a new world to study. High return.
      *   **Vulcan:** Cost one invisible planet. Dividend: Explained Mercury's orbit, but the planet didn't exist. The investment yielded nothing.
      *   **Your Gut:** You feel uneasy judging Vulcan harshly because the *method* was the same as Neptune. The Dividend Rule says your gut is right to be uneasy, but also right to judge it harshly in hindsight. At the moment Le Verrier proposed Vulcan, it was a valid investment. In the history books, it is a bad one because the dividend never arrived. Your gut is conflating "Was this a scientific question?" (Yes) with "Was this a fruitful theory?" (No).
  3.  **Darwin (Great):** Extremely low cost (one mechanism: natural selection). Massive dividend (unified all of biology, geology, and anatomy). The highest return on investment in history.
  4.  **The Nutrition Friend (Bad):** High cost (new fudge factor every time). Zero dividend (only saves the previous prediction, predicts nothing new). This is spending money to hide debt.
  5.  **Age of Theory (The Grace Period):** A five-year-old theory is a start-up; it is allowed to burn cash (complexity) to find product-market fit. A fifty-year-old theory is an established corporation; if it keeps asking for capital injections (patches) without showing profit (new predictions), it is insolvent.

  ### A New Case for You to Test

  Here is a scenario to see if the principle holds for you:

  **The Case of the Ghost Signal**
  Two astrophysicists detect a strange radio signal.
  *   **Physicist A** says, "It's interference from a satellite." She spends six months cataloging satellites. She finds one that matches the frequency. The signal is explained. She moves on.
  *   **Physicist B** says, "It's a new type of pulsar." He adjusts his model of pulsar emissions to fit the signal. His model now fits the signal, but he cannot find the pulsar in the sky. He says, "It's obscured by dust." He adjusts the dust model. The signal fits. He still cannot find the pulsar. He says, "The dust is patchy."

  **The Verdict:**
  According to The Dividend Rule, **Physicist A** did better science, even though she "explained away" the anomaly. She paid a cost (time checking satellites) and received a dividend (certainty, cleaning the data for future work).
  **Physicist B** is failing. He is paying complexity costs (dust, patchy dust, obscured view) but getting no dividend (no pulsar found, no new predictions about where else to look). He is dragging the theory backward.

  If you feel Physicist B is being "more scientific" because he is chasing a discovery, the Principle says you are seduced by the *romance* of discovery rather than the *economy* of explanation. If you feel Physicist A is being boring but rigorous, the Principle holds.

  ### The Honest Audit of Your Gut

  You asked me to be straight about whether your gut is coherent. Here is the breakdown:

  **Where your gut is consistent:**
  You consistently punish theories that spend complexity to stay alive (Nutrition friend) and reward theories that spend complexity to grow (Patched Theory, Darwin). You also correctly intuit that time limits credit (Age of Theory). This is a robust, logical framework.

  **Where your gut is incoherent:**
  It is the **Vulcan/Neptune** problem. You admitted: *"I can't bring myself to say whether inventing a planet was good science depends on how the dice landed."*

  Strictly speaking, **good science can lead to false theories.** Le Verrier was doing good science when he proposed Vulcan. He made a testable prediction based on a sound model. Nature simply lied.
  *   If you judge the *scientist*, Le Verrier was rational in both cases.
  *   If you judge the *theory*, Neptune lives and Vulcan dies.

  Your gut wants to judge the *theory's vitality*, not the *scientist's logic*. That is not incoherent for a novelist, because you are writing about the *story* of science, not the logic of a single moment. In a narrative, a theory that fails is a dead end, regardless of how reasonable it looked at the time.

  **The Verdict:**
  Your gut is **pragmatically coherent** but **logically inconsistent.**
  *   **Logically:** You should judge the hypothesis on the information available *at the time*. (Vulcan and Neptune were equal).
  *   **Pragmatically:** You judge the hypothesis on the *outcome*. (Neptune is good, Vulcan is bad).

  For your book, **keep the pragmatic inconsistency.** It is more human. Scientists *do* judge past theories by their outcomes. They treat successful guesses as "insight" and failed guesses as "desperation," even if the method was identical. That hypocrisy is fertile ground for rivalry.

  **Summary for your notes:**
  Your characters should argue about **ROI.**
  *   The Conservative Physicist: "You're spending too much complexity for too little return. Stop patching."
  *   The Visionary Physicist: "You're counting pennies while I'm buying land. The dividend is coming."

  The tragedy of your rivalry is that sometimes the Visionary is just a fool in love with a bad investment, and sometimes the Conservative is a miser missing the next Darwin. The Dividend Rule doesn't tell you who is right until the end of the story. That's where your drama lives.
