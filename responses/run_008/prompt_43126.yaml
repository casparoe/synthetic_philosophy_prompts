answer: |-
  There is a principle that can unify most of these, but to make it coherent, you have to sacrifice some of your intuitions. You asked me not to keep epicycles, so I will not. To get a clean theory, you must accept that your gut is wrong on Cases 2, 4, and 6, and that Case 7 is a category error.

  Here is the principle, the cull, and the prediction.

  ### The Principle: Material Correspondence

  **Consent is valid if and only if:**
  1.  **Correspondence:** The agent's understanding of the *nature* and *material conditions* of the act corresponds to reality. (A lie or error invalidates consent only if it concerns a fact the agent treats as a dealbreaker or a reasonable person would treat as essential to the risk/benefit analysis.)
  2.  **Voluntariness:** The agent retains the effective power to withdraw without suffering a *penalty* worse than their pre-consent baseline. (Inducements are fine; traps are not.)
  3.  **Capacity:** The agent has the legal/developmental status to transfer authority over this specific boundary.

  This principle prioritizes **authority over the terms of the interaction**. You cannot consent to X if you are actually being subjected to Y, and you cannot consent freely if leaving costs you more than staying.

  ### The Cull: Which Verdicts Must Drop

  To make this principle work, you have to change four of your seven verdicts. Three of these are cases where you admitted uncertainty, which makes the cost lower.

  **1. Case 2 (Surgeon Silence) must flip to INVALID.**
  *   **Your Gut:** Valid (Patient should ask).
  *   **The Principle:** Invalid.
  *   **Why:** If Case 1 is invalid because the patient lacked accurate risk data, Case 2 must also be invalid. In medical consent, "material risk" creates a duty to disclose. If the surgeon *knows* the rate is 1-in-25 and stays silent, he is ensuring the patient's understanding does not *correspond* to reality regarding a material condition of the procedure.
  *   **The Cost:** You have to accept that patients are not solely responsible for interrogating doctors. If the information is material to the risk (which serious complications are), silence is as destructive as an innocent error. Case 1 and Case 2 stand or fall together.

  **2. Case 4 (Marital Lie) must resolve to INVALID.**
  *   **Your Gut:** Wobbly (Consented to him, just under false pretenses).
  *   **The Principle:** Invalid.
  *   **Why:** You noted the partner said up front they would "never knowingly sleep with a married person." This makes marital status a **material condition** of the consent. The consent offered was for "sex with a single man." The act provided was "sex with a married man." These are different acts under the agreed-upon terms.
  *   **The Cost:** You have to distinguish between "lies that don't matter" (Case 3: age) and "lies that negate a stated condition" (Case 4). If a condition is explicitly stated as a dealbreaker, violating it voids the consent.

  **3. Case 6 (Quit Penalty) must resolve to INVALID.**
  *   **Your Gut:** Back and forth (Can walk away, just poorer).
  *   **The Principle:** Invalid (for Day 2).
  *   **Why:** This violates **Voluntariness**. In Case 5, the money is an inducement (a bonus). In Case 6, the structure creates a *penalty* for withdrawal (losing earned wages). This is coercive. It traps the subject by worsening their baseline if they exercise their right to stop. Consent requires the freedom to exit without punishment.
  *   **The Cost:** You must treat economic traps as coercive, even if no one held a gun to the student's head. "Lock-in" tactics compromise the power to withdraw.

  **4. Case 7 (16-Year-Old Refusal) must be EXCLUDED.**
  *   **Your Gut:** Override refusal (but you don't know why).
  *   **The Principle:** Not applicable.
  *   **Why:** This is not a failure of *consent*; it is a failure of *status*. A 16-year-old generally lacks the legal authority to refuse life-saving treatment, regardless of competence or understanding. This is a paternalistic rule imposed by the state, not a feature of the consent transaction itself.
  *   **The Cost:** You must admit this case doesn't belong on the list. It follows a different logic (best interests/status) than the other six (autonomy/transaction). Trying to fit it into a consent principle will break the principle.

  ### The Survivors

  Cases 1, 3, and 5 remain intact.
  *   **Case 1:** Fits Correspondence (Error on material risk).
  *   **Case 3:** Fits Correspondence (Age is not material to the act of sex for most).
  *   **Case 5:** Fits Voluntariness (Inducement is not coercion).

  ### The Prediction: The "Social Proof" Case

  **The Case:** A patient consents to a trial after her doctor says "most patients in your situation choose this." This is true, but the doctor knows this particular patient is unusually swayed by what most people do.

  **The Prediction: VALID.**

  **Why:**
  Under the Principle of Material Correspondence, this does not cross the line.
  1.  **Truth:** The statement is factually accurate. Unlike Case 1, there is no misrepresentation of risk or data.
  2.  **Materiality:** "What other people do" is not a fact about the *nature* of the procedure or its *risks*. It is a heuristic for decision-making.
  3.  **Coercion:** There is no threat or penalty for refusal.

  **The Nuance:**
  This is **manipulation**, but it is not **invalidating**. The principle protects your right to accurate information about the *act* (risks, nature, terms), but it does not protect you from persuasive tactics that appeal to your psychology, provided they are truthful. If we invalidate consent because a doctor used a true fact to nudge a vulnerable patient, we invalidate almost all medical persuasion.

  ### Summary of the Trade

  You gain a clean, defensible theory of consent based on **Information, Freedom, and Status**.
  *   **Information:** You must not be wrong about the dealbreakers (Case 1, 2, 4).
  *   **Freedom:** You must not be punished for leaving (Case 5, 6).
  *   **Status:** You must be allowed to make the call (Case 7).

  But you lose the comfort of Case 2 (doctors can stay silent) and Case 6 (contracts can trap you). You have to accept that "Valid Consent" is a higher bar than "Signed Form." It requires that the signature matches the reality of the deal, and that the signer was free to walk away.
