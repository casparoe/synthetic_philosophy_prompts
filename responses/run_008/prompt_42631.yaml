answer: |-
  # Q&A Prep Sheet: Counterpart Theory Job Talk
  **Candidate:** [Your Name]
  **Target:** Metaphysics Search Committee (Post-Kripkean Majority, Lewisian Minority, One Logician)
  **Goal:** Defend CT + Contextualism + Neutrality on Realism without conceding technical ground.

  **General Strategy:**
  *   **Distinguish Settled vs. Contested:** Do not claim Lewis accepted Necessity of Identity (NI). He didn't. Your project is *revising* CT to save NI. Be explicit that this is a revision, not an exegesis.
  *   **Tone:** Do not be apologetic about CT. Treat TWI as the view with the "arbitrariness" problem (Chisholm).
  *   **Neutrality:** Walk the tightrope. Concrete realists think Ersatz can't do CT; Ersatzers think Concrete is insane. Your claim is that the *logic* of CT is independent of the *ontology* of worlds.

  ---

  ### 1. The Necessity of Identity (NI) Trap
  **Who:** The Logician & Post-Kripkeans.
  **The Objection:** "You claim contextualism saves the Necessity of Identity. But in standard CT, $a=b$ does not entail $\Box(a=b)$ because $a$ and $b$ can have different counterparts in different worlds. If you tweak the semantics to force NI, aren't you just rebuilding Transworld Identity by stipulation? Specifically, does the inference $\forall x \forall y (x=y \to \Box(x=y))$ hold in your system without collapsing the counterpart relation into identity?"
  **Damage:** **Fatal.** If you can't validate NI, the Post-Kripkeans will dismiss you as pre-theoretic. If you validate it by fiat, the Lewisians will say you've broken the logic.
  **The Reply:** "I am distinguishing the *semantic value* of names from the *counterpart relation*. I accept NI as a constraint on reference: if 'a' and 'b' rigidly designate the same individual in the actual world, they pick out the same individual in every world *where that individual exists*. My contextualism applies to *de re* modal predications, not identity statements themselves. We validate NI by treating identity as a special case where the counterpart relation is trivial (identity), while allowing non-trivial counterpart relations for property attribution. This preserves the logical theorem without requiring transworld individuals."
  **The Soft Spot:** **Contested.** Lewis explicitly rejected NI (1971). Your move relies on a hybrid semantics that some (e.g., Fara, Williamson) argue is unstable. If pressed on the formal proof, admit you are proposing a *revision* of Lewis's 1968 system, not a defense of the original.

  ### 2. The Humphrey Objection (Revised)
  **Who:** Post-Kripkeans.
  **The Objection:** "Kaplan's point wasn't just about pride; it was about truth-conditions. When I say 'I could have won,' I am talking about *me*. If your theory says the truth-maker is some other person in another world winning, you are changing the subject. You're analyzing 'I could have won' as 'Someone like me wins.' That's not modality; that's similarity."
  **Damage:** **High.** This is the intuitive dealbreaker for non-CT metaphysicians.
  **The Reply:** "The objection trades on an ambiguity between *what I do* and *what is true of me*. I am not analyzing 'I win' as 'Someone else wins.' I am analyzing 'I could have won' as 'There is a world where my counterpart wins.' The 'aboutness' is secured by the counterpart relation, which is a relation of *representation*. Just as a portrait represents me without being me, a counterpart represents my modal properties. The truth is about me because the counterpart relation is anchored to me."
  **The Soft Spot:** **Settled/Contested Boundary.** Kripkeans will say representation isn't enough for *de re*. You are relying on the claim that *de re* modality is inherently descriptive/qualitative, which they reject in favor of haecceitistic reference.

  ### 3. The Reductive Ambition Sell-Out
  **Who:** The Lewisians (2).
  **The Objection:** "The selling point of CT was a reductive analysis of modality in terms of non-modal quantification over worlds and a primitive similarity relation. By making the counterpart relation context-sensitive and multiple, you've made 'counterpart' just as modal and mysterious as the modality you're trying to analyze. You haven't reduced modality; you've just relocated it into the selection of the relevant counterpart relation."
  **Damage:** **High.** Undermines the theoretical utility of your project for the Lewisian faction.
  **The Reply:** "Reduction doesn't require elimination of all primitive notions; it requires mapping modal operators to non-modal quantifiers. Context-sensitivity is ubiquitous in language (e.g., 'tall', 'near'). Acknowledging that 'possible' is context-sensitive doesn't reintroduce modal primitives; it clarifies the pragmatic conditions under which we quantify over worlds. We still gain the logical benefits of CT (solving Chisholm) without positing transworld identity."
  **The Soft Spot:** **Contested.** Many Lewisians argue that once you allow context to determine the relation, you lose the ability to formally define the logic of QML precisely. You are prioritizing linguistic data over formal elegance.

  ### 4. The Neutrality on Realism Problem
  **Who:** The Lewisians & Ersatz Skeptics.
  **The Objection:** "You claim CT works for Ersatz worlds (sets of propositions) just as well as Concrete Realism. But for an ersatz world to represent a non-actual individual, the propositions must be *about* that individual. If the individual doesn't exist in that world (because worlds are disjoint), how do the propositions refer to it without Transworld Identity? CT without Concrete Realism seems to require the very TWI it's meant to replace."
  **Damage:** **High.** Exposes a potential inconsistency in your "Neutrality" claim.
  **The Reply:** "Ersatz worlds can represent individuals via qualitative descriptions rather than direct reference. An ersatz world contains a maximally consistent set of propositions describing a 'role' that is filled by a counterpart in the actual world. We don't need the individual to be *in* the ersatz world; we need the world to describe a role that the individual *could* fit. CT provides the 'fitting' relation."
  **The Soft Spot:** **Contested.** This is the "Problem of Representation" for Ersatzism. Hazen and others have argued this collapses into TWI or Haecceitism. If pressed, concede that Concrete Realism makes CT *easier*, but insist it's not strictly *necessary* for the logic to hold.

  ### 5. The QML Inference Pattern Query
  **Who:** The Logician.
  **The Objection:** "Let's be precise. In your system, does the Barcan Formula hold? Does Universal Instantiation hold across modal contexts? If I say 'Everything is necessarily self-identical,' does your translation into counterpart theoretic notation preserve that truth value in every model?"
  **Damage:** **Medium-High.** A technical competence check. If you flounder here, you look unprepared.
  **The Reply:** "I adopt a variable domain semantics where the Barcan Formula fails, which is standard for CT. However, Universal Instantiation is preserved within a world. For 'Everything is necessarily self-identical,' the translation is 'For every x, for every world w, for every counterpart y of x in w, y=y.' This comes out true. The failures occur only when we try to quantify *into* modal contexts from outside without fixing the counterpart relation."
  **The Soft Spot:** **Settled.** Standard CT rejects the Barcan Formula. Ensure you don't accidentally claim it holds. Be ready to write the translation on the board if asked.

  ### 6. The Haecceitist Alternative
  **Who:** Post-Kripkeans.
  **The Objection:** "You motivate CT using Chisholm's Paradox to show TWI leads to arbitrariness. But Haecceitism solves Chisholm without CT. We can say the individual *is* transworld, but their properties vary based on primitive thisness. Why prefer the ontological cost of counterparts and worlds over the ontological cost of haecceities?"
  **Damage:** **Medium.** Offers a rival explanation for your main positive argument.
  **The Reply:** "Haecceitism solves the logic but violates the Principle of Sufficient Reason regarding identity. If two worlds differ only by which haecceity occupies which qualitative role, there is no fact of the matter to ground that difference. CT grounds modal differences in qualitative similarity, which is epistemically accessible. Haecceitism buys logical simplicity at the cost of unintelligible primitive identity."
  **The Soft Spot:** **Contested.** Many metaphysicians (e.g., Kripke) accept Haecceitism as the price of doing business. You are privileging epistemic access over metaphysical directness, which they may reject.

  ### 7. The Circularity of Similarity
  **Who:** General Metaphysicians.
  **The Objection:** "Counterparts are defined by similarity. But similarity in which respects? If I ask 'Could I have been a poached egg?', the answer depends on which similarities matter. If you say 'relevant similarities,' aren't you using modal notions ('relevant' to *what*?) to define modality? This looks circular."
  **Damage:** **Medium.** Classic Goodman-style objection.
  **The Reply:** "Relevance is determined by conversational context and causal history, not modal facts. We don't ask 'Is this similarity modal?' we ask 'Is this similarity salient given our interests?' The causal history of the individual anchors the relation non-modally. We are not analyzing 'possible' using 'possible'; we are analyzing it using 'similar' and 'context'."
  **The Soft Spot:** **Contested.** Critics argue 'salience' is itself modal. Be prepared to cite Lewis (1986) on the weighting of properties.

  ### 8. The De Re/De Dicto Distinction
  **Who:** Post-Kripkeans.
  **The Objection:** "Kripke showed that de re/de dicto is a linguistic distinction, not a metaphysical one. Your theory seems to build it into the metaphysics. If I point to Nixon and say 'He could have lost,' I'm not invoking a description. I'm invoking him. Your theory forces me to invoke a description (the counterpart relation)."
  **Damage:** **Medium.** Challenges your semantics of names.
  **The Reply:** "I agree the distinction is linguistic, but the *truth-conditions* require metaphysical grounding. Rigid designation fixes the referent in the actual world. CT explains how that referent projects into other worlds. It doesn't force a description *on the name*, but it requires a relation to evaluate the modal predicate. The name is rigid; the projection is descriptive."
  **The Soft Spot:** **Contested.** This is the direct clash with Kripke's *Naming and Necessity*. You are effectively arguing that rigid designation + CT is coherent, which Kripke denied.

  ### 9. Intra-World Counterparts
  **Who:** The Lewisians.
  **The Objection:** "If counterpart relations are just similarity, don't I have counterparts in the *actual* world? If so, when I say 'I could have been taller,' am I talking about my actual counterpart? That seems to confuse modality with actuality. Lewis restricted CT to transworld relations to avoid this."
  **Damage:** **Low-Medium.** Technical glitch.
  **The Reply:** "Context restricts the domain of quantification. In modal contexts, the domain is non-actual worlds. Intra-world similarity is just 'similarity,' not 'counterparthood' in the modal sense. We can formalize this by indexing the counterpart relation to world-pairs. $C(x, y, w_1, w_2)$ holds only if $w_1 \neq w_2$."
  **The Soft Spot:** **Settled.** Lewis allowed intra-world counterparts in some contexts. Restricting them might look ad hoc to save the theory.

  ### 10. The "Hope Nobody Asks" Question
  **Who:** The Smartest Person in the Room (Could be anyone).
  **The Objection:** "If you are neutral on Modal Realism, you must admit that 'worlds' are either concrete sums or abstract representations. If they are abstract, they are constructed from actual resources. If they are constructed from actual resources, they cannot represent non-actual individuals without already assuming the modal facts they are meant to analyze. So, isn't your 'Neutrality' just a way of hiding the fact that Ersatz CT is circular, while Concrete CT is ontologically extravagant? Why should we think there is a 'third way'?"
  **Damage:** **Fatal.** Attacks the core coherence of your dissertation's stance.
  **The Reply:** "I am not claiming a third ontology of worlds. I am claiming the *logic* of CT is invariant across ontologies. The circularity worry applies to the *construction* of ersatz worlds, not the *logic* of counterpart relations. One can accept CT as the correct logic of de re modality while remaining agnostic on whether the quantifiers range over concrete planets or sets of sentences. The circularity is a problem for the Ersatzer, not for CT itself."
  **The Soft Spot:** **Contested.** This is the hardest hit. You are separating logic from ontology more sharply than many think is possible. If they press that logic *depends* on ontology here, you must concede that Concrete Realism is the *natural* home for CT, but insist it's not the *only* one.

  ---

  ### Strategic Notes for the Q&A
  1.  **On Consensus:** Never say "It is agreed that..." regarding NI or Haecceitism. Use "Standard Kripkean semantics assumes..." or "Lewis's original system entails..."
  2.  **On the Board:** If the Logician asks about inference patterns, **go to the board**. Do not try to talk through quantifier scope. Write the translation: $\Box \phi(x) \to \forall w \forall y (C(y,x,w) \to \phi(y))$.
  3.  **On "Selling Out":** If Lewisians accuse you of watering down CT, lean into the "Contextualism" defense. Frame it as *progress* over Lewis, not retreat. "Lewis got the logic right for a specific context; I'm generalizing it."
  4.  **On Hiring:** Remember, they are testing if you can hold your own in a faculty meeting. If you don't know an answer, say: "That's a consequence I need to model formally before committing," rather than bluffing.

  **Good luck. Don't let them smell blood on the NI issue.**
