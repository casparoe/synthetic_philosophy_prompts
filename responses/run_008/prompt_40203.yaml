answer: |-
  You are absolutely right to be suspicious of the "Is FEP falsifiable?" framing. In its current form, that question is a philosophical sinkhole that conflates mathematical consistency, ontological commitment, and empirical adequacy. For a Physics MSc student, treating "falsifiability" as the primary target is a recipe for a thesis that ends in semantic stalemate rather than novel results.

  Your decomposition is sharp and correctly identifies the fault lines. However, I would suggest a slight restructuring of the terrain to better match her skillset and the logical dependencies of the formalism.

  Here is my recommended ranking, the defense for that ranking, and a proposed refinement of the problem space.

  ### The Ranking

  1.  **Active Inference vs. Optimal Control/RL (The "Value-Add" Question)**
  2.  **Markov Blankets & Individuation (The "Boundary" Question)**
  3.  **Normative/Math vs. Empirical (The "Status" Question)**
  4.  **"Surprise" over Unvisited States (The "Semantic" Question)**

  *(Note: I recommend folding #4 into #1 as a technical sub-component, rather than treating it as a standalone project.)*

  ### Defense of the Ranking

  #### 1. Active Inference vs. Optimal Control/RL (Priority: High)
  *   **Why First?** This is the most tractable project for a physicist. It leverages her strength (control theory, optimization landscapes, dynamical systems) and minimizes her weakness (metaphysics).
  *   **Upstream/Downstream:** Logically, this is *downstream*. You need the math to work before you compare the algorithm. However, methodologically, this is *upstream* for a PhD. If Active Inference (AI) offers no computational advantage or distinct predictions over standard RL, the "Status" and "Boundary" questions become moot for practical science.
  *   **The Trap to Avoid:** Don't let this become a pure engineering project ("I built an agent"). The contribution must be theoretical: *Under what specific constraints does AI converge where RL fails, or vice versa?*
  *   **Why it settles the "Falsifiability" cluster:** If she can demonstrate that AI makes distinct empirical predictions from RL in a specific regime (e.g., non-stationary environments with partial observability), she bypasses the "is it a tautology?" debate. It becomes a model comparison problem, which is standard physics/statistics.

  #### 2. Markov Blankets & Individuation (Priority: Medium/High Risk)
  *   **Why Second?** This is the most "physics-friendly" of the philosophical problems. It deals with statistical independence, conditional probability, and system boundaries—concepts a physicist handles daily.
  *   **Upstream/Downstream:** This is logically *upstream* of everything. If you cannot formally define a Markov Blanket (MB) for a biological system without begging the question, the Free Energy Principle (FEP) has no purchase on biology.
  *   **The Trap to Avoid:** The "Metaphysical Slide." It is easy to drift from "Do the statistics support a boundary?" to "What is an organism?" She must stay in the formal domain (e.g., "Under what coupling strengths does the conditional independence assumption break down?").
  *   **Strategic Value:** This pairs beautifully with Project 1. She can frame it as: *"Active Inference assumes a Markov Blanket; I will test the robustness of AI performance as the Markovian assumption degrades."* This turns a philosophical objection into a sensitivity analysis.

  #### 3. Normative/Math vs. Empirical (Priority: Low)
  *   **Why Third?** This is the "Status" question. Is FEP a law of nature (empirical) or a definition of inference (normative/tautological)?
  *   **Upstream/Downstream:** This is the *outcome* of the first two, not a starting point.
  *   **The Trap to Avoid:** This is the "Falsifiability" trap you identified. If she starts here, she will spend three years reading philosophy of science and writing no code/proofs.
  *   **Strategic Value:** She should treat this as the *Discussion* chapter, not the *Methods*. If she shows that MBs are fragile (Project 2) or AI is equivalent to RL (Project 1), she has empirically demonstrated that FEP is either limited or normative. Let the results dictate the status.

  #### 4. "Surprise" over Unvisited States (Priority: Negligible as standalone)
  *   **Why Last?** This is often a semantic confusion regarding *variational* free energy vs. *surprisal*. In Active Inference, agents minimize *expected* free energy (which includes counterfactuals), not just immediate surprise.
  *   **Integration:** This is a technical detail required to execute Project 1 correctly. It does not need its own chapter. If she understands the variational bound in Project 1, she resolves this.

  ---

  ### A Better Decomposition?

  Your carving is good, but I suggest reframing the terrain from "Philosophical Problems" to **"Mapping Problems."** The core issue with FEP is not whether it is "true," but how the mathematical variables map to physical reality.

  I propose this three-part decomposition for her thesis structure:

  1.  **The Structural Mapping (Markov Blankets):** Do the statistical boundaries in the math correspond to separable timescales or coupling constants in physical systems? *(Her Project 2)*
  2.  **The Algorithmic Mapping (AI vs. RL):** Do the update rules in the math correspond to distinct learning dynamics compared to standard baselines? *(Her Project 1)*
  3.  **The Explanatory Mapping (Status):** Given 1 and 2, what kind of explanation does FEP provide? *(Her Conclusion)*

  **Why this is better:** It forces her to treat the philosophy as a constraint on the modeling, rather than a separate inquiry. It keeps her in "Physics Mode" (mapping models to data) rather than "Philosophy Mode" (analyzing concepts).

  ### Concrete Advice for the Supervisor

  **Steer her toward a "Stress Test" Thesis.**
  Instead of asking "Is FEP true?", her thesis question should be: **"Under what conditions does the Free Energy Principle break down as a model of adaptive control?"**

  *   **Year 1:** Reproduce standard Active Inference agents. Benchmark against RL (PPO, DQN) in controlled environments. (Addresses Project 1).
  *   **Year 2:** Systematically violate the Markov Blanket assumptions (e.g., introduce non-Markovian noise, strong coupling that blurs boundaries). Measure performance degradation. (Addresses Project 2).
  *   **Year 3:** Analyze the results. If AI fails when MBs blur, then FEP is contingent on specific structural conditions (Empirical Claim). If AI works regardless, FEP might be a general optimization description (Normative Claim). (Addresses Project 3).

  **Why this works for her profile:**
  1.  **Physics MSc:** She can handle the stochastic differential equations and variational calculus required to manipulate the bounds.
  2.  **Philosophy Background:** She has enough to recognize the implications of her results without needing to master the literature on "scientific realism."
  3.  **Realistic Scope:** It is one coherent project (Robustness of AI) that *generates* answers to the philosophical questions as byproducts.

  **The Warning:**
  Tell her to avoid the "Friston vs. Critics" literature wars in the first year. The literature is polarized. If she reads only the proponents, she will miss the math gaps. If she reads only the critics, she will miss the nuance. Have her read the **math papers** (e.g., *Parr, Pezzulo, Friston 2022*) and the **formal critiques** (e.g., *Colombo & Palacios*), and ignore the commentary pieces until she has her own results.

  **Summary:** Rank **AI vs. RL** as the engine, **Markov Blankets** as the boundary condition, and **Status** as the conclusion. Fold **Surprise** into the engine. This keeps her employed, publishing, and sane.
