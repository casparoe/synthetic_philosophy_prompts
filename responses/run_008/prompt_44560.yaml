      *   *Tutor's point:* The tutor is likely a Humean about chance or a frequentist. They see "Chance" as requiring stochasticity. MWI has no stochasticity. So claiming "Objective Chance" (4) is the most dangerous claim. I need to tell the user to soften (4) to "Emergent Chance" or "Functional Chance."

