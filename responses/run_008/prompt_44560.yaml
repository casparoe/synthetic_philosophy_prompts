  *(Self-Correction on "No Further Fact"):* Actually, if the user says "They're all equally me," that sounds like *identity is many-to-one*. If I am A, and I split into B and C, and B is me and C is me, then B=C (transitivity). But B and C are distinct. This is the "Parfitian" view. It works for ethics, but for probability, it's tricky. If I know B and C are both "me," do I have uncertainty? Yes, because "I" (now) don't know which stream I will *experience*. I need to make sure the user distinguishes *identity* from *anticipation*.

