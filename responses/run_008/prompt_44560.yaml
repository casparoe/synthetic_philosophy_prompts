          *   Clarify (2): Use the "Pre-branching" vs. "Post-branching" distinction. Uncertainty exists *before* the split is experienced.
          *   Link (3) to (4): Use the Principal Principle. If rational credence matches weight, and credence matches chance, then weight functions as chance.
      *   **Specific Advice on the "Determinism vs. Uncertainty" worry:** Explain that uncertainty is about *indexical* location, not *world* state. The global state is determined; the local experience is not.

  5.  **Refining the Advice (Self-Correction during drafting):**
      *   *Wait, check the "No Further Fact" (5) claim.* If all successors are "me," does that kill self-locating uncertainty? If I know "All of them are me," do I still wonder "Which one will I be?"
