answer: |-
  **TO:** University Faculty Senate
  **FROM:** [Your Name], Faculty Senator
  **DATE:** April 14, 2024
  **SUBJECT:** Recommendation on Grade Integrity and Distribution Stewardship

  **Executive Summary**

  After two years of deliberation, the status quo is no longer a viable option. Our degree's signaling value is eroding, evidenced by the Honors College's decision to bypass our official GPA and the widespread student practice of shopping for sections based on expected grades rather than pedagogical fit. We are currently locked in a multipolar trap: individual departments and faculty act rationally to protect their enrollments and students by inflating grades, but these rational choices collectively devalue the currency we all issue.

  I recommend the Senate adopt a modified version of **Proposal (a) (Mandatory Median-Grade Bands)**, coupled with **Proposal (b) (Transcript Contextualization)**. Specifically, I propose a **Cluster-Based Grade Stewardship Policy**. This policy establishes expected median grade ranges calibrated by disciplinary cluster (e.g., STEM, Humanities, Social Sciences, Professional Schools) rather than a single university-wide number, paired with a requirement that official transcripts display the course's historical grade distribution.

  This recommendation rejects "do nothing" (d) as an acceptance of signal death and rejects standalone informational fixes (b) as insufficient to alter the incentive structure of the trap. Below I outline the rationale, the mechanics, and the conditions under which this policy should be revisited.

  **The Case for Binding Coordination**

  We must stop treating grade inflation as a failure of individual faculty virtue or student entitlement. It is a structural coordination problem. In game-theoretic terms, we are in a Nash equilibrium where "defecting" (inflating grades) yields a local advantage (higher enrollment, happier students, better placement for our majors), while "cooperating" (grading strictly) imposes a unilateral cost on the defector without restoring the value of the degree.

  Because the penalty for grading strictly is borne individually (or departmentally) while the benefit of a robust grading signal is shared collectively, no single actor can solve this alone. A Chemistry professor who returns to a B median while the University median is an A- simply punishes their students in the job market. Therefore, voluntary guidelines will fail. Only a binding, coordinated shift can move us to the cooperative equilibrium.

  However, a single university-wide median (e.g., 3.3) ignores legitimate disciplinary differences in assessment methods and pedagogical goals. A "one size fits all" curve is as scientifically unsound as ignoring the problem entirely. We must bind ourselves to cooperation, but we must calibrate the terms of that cooperation to respect disciplinary variance.

  **Proposal Mechanics: Cluster-Based Grade Stewardship**

  1.  **Disciplinary Clusters:** Departments will be grouped into four clusters based on assessment norms and national comparative data (e.g., Natural Sciences, Humanities/Arts, Social Sciences, Professional/Applied).
  2.  **Target Medians:** Each cluster will establish a target median grade range (e.g., Natural Sciences: B+ to A-; Humanities: A- to A). These targets will be set by a joint committee of department chairs and Senate reps, using the last five years of data as a baseline, adjusted downward by 0.2 points to begin recentering.
  3.  **Departmental Accountability, Not Individual Policing:** Compliance is measured at the *departmental* aggregate level over a three-year rolling average. This protects academic freedom in individual classrooms while ensuring departmental leadership manages the collective incentive structure. Departments consistently outside the band must submit a "Stewardship Plan" to the Senate Committee on Academic Standards, justifying the deviation based on pedagogical needs, not enrollment protection.
  4.  **Transcript Contextualization:** All official transcripts will include a footnote or QR code linking to the historical grade distribution for each course (median, standard deviation). This empowers external observers (grad schools, employers) to interpret the GPA correctly during the transition and reduces the advantage of "easy" sections.

  **Transition Timeline**

  *   **Year 1 (Planning):** Formation of Cluster Committees; setting of target ranges; development of transcript IT infrastructure. No enforcement.
  *   **Year 2 (Soft Launch):** Departments receive quarterly reports on their standing relative to cluster targets. Transcript contextualization goes live.
  *   **Year 3 (Hard Launch):** Stewardship Plans required for departments outside the target bands.
  *   **Year 5 (Review):** Full Senate review of policy efficacy (see Failure Conditions below).

  **Addressing the Strongest Objection**

  The most serious objection to this proposal is that it constitutes administrative coercion that overrides legitimate departmental autonomy and disciplinary difference. Critics will argue that a B in Organic Chemistry *means* something different than a B in Political Theory, and that mandating bands forces a false equivalence.

  I take this objection seriously. If we were trying to equate the *meaning* of the grades, this would be indefensible. But we are not equating the meaning; we are managing the *distribution* to preserve the signal's variance. The objection holds water against a single university-wide median, which is why I propose **Cluster-Based** targets. This acknowledges that grading norms differ while still preventing the race to the bottom *within* and *between* those clusters.

  However, I must be honest about the trade-off. This policy does restrict departmental freedom to use grade inflation as an enrollment tool. If a department cannot fill its majors without offering A- averages, this policy forces a confrontation with that reality rather than masking it with inflated currency. The coercion is the point; without it, the trap remains.

  **Failure Conditions and Reconsideration**

  A policy of this magnitude requires an exit strategy. I commit to supporting the repeal of this policy if, at the five-year mark, the following conditions are met:

  1.  **Enrollment Decline:** If specific departments show a statistically significant decline in major declarations (>10% relative to peer institutions) directly attributable to grading rigor (controlled for national trends).
  2.  **Placement Harm:** If data from our Career Center and Alumni Office shows that our graduates are systematically disadvantaged in hiring or grad school admissions compared to peer institutions with higher median GPAs.
  3.  **Surveillance Creep:** If the mechanism for tracking distributions evolves into individual faculty performance metrics for tenure/promotion, violating the agreement that this is a departmental aggregate policy.

  **What Would Change My Mind**

  I am advocating for this binding approach because I believe the multipolar trap is real and resistant to softer measures. I would reconsider this position and support a purely informational approach (Option B only) if presented with robust data from peer institutions demonstrating that transcript contextualization alone halted grade inflation without binding targets. Alternatively, if the Honors College's recalibration method proves scalable and is adopted by the majority of our external stakeholders (grad schools/employers) as the primary metric, the need for institutional recentering diminishes. Absent that evidence, however, we have a duty to repair the signal we issue.

  **Conclusion**

  We are currently issuing a currency that we know is debased. We ask our students to invest four years and significant resources in a degree whose primary metric is increasingly recognized as fictional. Solving this requires us to act not as competing departments, but as a single faculty with a shared reputation to uphold. I ask the Senate to vote for the Cluster-Based Grade Stewardship Policy.

  **Action Requested:**
  Move to adopt the Cluster-Based Grade Stewardship Policy as outlined for implementation in the 2025-2026 Academic Year.
