answer: |-
  # Session Plan: The Co-Op Tribunal

  **Topic:** Standing to Blame (Hypocrisy & Norm Specificity)
  **Time:** 80 Minutes
  **Students:** 15
  **Room:** Movable chairs (arrange in a tight circle)

  ## 1. Learning Objectives
  By the end of the session, students will have:
  1.  Intuitively distinguished between the *truth* of a blame claim and the *authority* to make it.
  2.  Experienced the "collapse" of enforcement willingness when the accuser's history is revealed, despite unchanged evidence.
  3.  Generated data on whether standing is norm-specific (can a noise-violator blame a dish-violator?) prior to theoretical framing.

  ## 2. Materials to Prep
  *   **House Rules Sheet (15 copies):** Lists the 4 norms clearly.
  *   **Incident Reports (3 large cards):** One for each round.
  *   **Private Record Cards (15 envelopes):** Sealed. Each contains a "Member History."
      *   *Crucial:* You must know which seat gets which envelope. Mark the envelopes A–O and map them to your seating chart.
      *   *Distribution:*
          *   10 "Clean" records (No violations).
          *   3 "Same-Norm Violator" records (Violated the specific norm of the round they will report on).
          *   2 "Different-Norm Violator" records (Violated a norm *other* than the one they will report on).
  *   **Voting Cards (15 each):** Two sides: "SANCTION" / "DROP."
  *   **Instructor Master Sheet:** Maps seats to Record Card types and assigns who reports in which round.

  ## 3. The House Rules (For Student Handout)
  *Keep these mundane and distinct.*
  1.  **Quiet Hours:** No loud music after 10 PM.
  2.  **Dishes:** Wash your own within 24 hours.
  3.  **Trash:** Take the bag out when full.
  4.  **Guests:** Register overnight guests in the logbook.

  ## 4. Session Flow (80 Minutes)

  ### Phase 1: Setup & Orientation (10 mins)
  *   **Seating:** Students sit in a circle. Hand out the **House Rules** and a **Voting Card** to everyone.
  *   **The Fiction:** "You are all members of a housing Co-Op. We have a problem: enforcement is inconsistent. Today, we are testing a new Tribunal Protocol."
  *   **The Rules of Play:**
      1.  **Undisputed Facts:** When an Incident is read, the accused's guilt is *objective fact*. Do not debate whether they did it. They did.
      2.  **The Vote:** Your job is to vote **SANCTION** (punish them) or **DROP** (let it slide).
      3.  **Private History:** Open your envelope. This is your personal violation history for the last month. **Do not show this to anyone.**
      4.  **The Reporter:** In each round, I will designate one member as the 'Reporter.' They propose the sanction.
      5.  **The Audit:** After the first vote, I may trigger an 'Audit.' If I do, the Reporter's Private Record is read aloud. Then, you vote again.
  *   **Check:** "Any questions on the rules? Remember: The accused *did* the thing. The only variable is us."

  ### Phase 2: The Rounds (45 mins)
  *You control the pacing. Use a timer.*

  **Round 1: The Baseline (15 mins)**
  *   **Incident:** Member X left dirty dishes in the sink for 3 days. (Norm: Dishes)
  *   **Reporter:** Select a student with a **Clean** Record.
  *   **Step 1:** Reporter reads the Incident. "I propose a $10 fine."
  *   **Step 2:** Group votes (Sanction/Drop). *Expectation: High Sanction.*
  *   **Step 3:** **Audit Triggered.** You read the Reporter's card: "No violations."
  *   **Step 4:** Group votes again. *Expectation: No change.*
  *   **Goal:** Establish that clean accusers + guilty accused = sanction.

  **Round 2: The Hypocrite (20 mins)**
  *   **Incident:** Member Y played loud music after 10 PM. (Norm: Quiet Hours)
  *   **Reporter:** Select a student with a **Same-Norm Violator** Record (They also played loud music recently).
  *   **Step 1:** Reporter reads Incident. "I propose a $20 fine."
  *   **Step 2:** Group votes. *Expectation: Moderate/High Sanction (facts haven't changed yet).*
  *   **Step 3:** **Audit Triggered.** You read the Reporter's card: "Violated Quiet Hours twice last week."
  *   **Step 4:** Group votes again. *Watch for the collapse.*
  *   **Instructor Note:** If the vote doesn't change, press them in the debrief. If it does change, ask *why* silently (save for debrief).
  *   **Goal:** Generate the intuition that hypocrisy undermines enforcement entitlement.

  **Round 3: The Cross-Norm Challenge (10 mins)**
  *   **Incident:** Member Z failed to log an overnight guest. (Norm: Guests)
  *   **Reporter:** Select a student with a **Different-Norm Violator** Record (e.g., They left dishes dirty, but are reporting on Guests).
  *   **Step 1:** Reporter reads Incident. "I propose a written warning."
  *   **Step 2:** Group votes.
  *   **Step 3:** **Audit Triggered.** You read the Reporter's card: "Violated Dishes norm 3 times. Clean on Guests."
  *   **Step 4:** Group votes again.
  *   **Goal:** Test if standing is violation-specific or general moral authority.

  ### Phase 3: The Debrief (25 mins)
  *Do not use the words "Standing," "Hypocrisy," or "Entitlement" until the very end.*

  **Part 1: Phenomenology (10 mins)**
  *   "Look at Round 2. Between Vote 1 and Vote 2, did the evidence regarding the *Accused* change?" (No).
  *   "Did the severity of the violation change?" (No).
  *   "So why did the vote shift? What happened in the room?"
  *   *Target:* Students should identify that the *Reporter* changed status, not the *Accused*.
  *   "In Round 3, did the shift happen again? Was it as strong? Why might a dish-violator still be allowed to police guests?"

  **Part 2: Mapping the Intuition (10 mins)**
  *   "You just acted as a moral jury. You seemed to be tracking two different things simultaneously."
  *   Write on board:
      1.  **The Claim:** (Is the accusation true?)
      2.  **The Claimant:** (Who is saying it?)
  *   "In a court of law, only #1 matters. In this Co-Op, #2 mattered. Why?"
  *   *Prompt:* "If the hypocritical reporter punishes the accused, what message does that send about the rule itself?" (e.g., It's a weapon, not a norm. It's about power, not fairness.)
  *   "Does breaking a rule make you a 'citizen' of that rule, or does it exile you?"

  **Part 3: Theoretical Labeling (5 mins)**
  *   "Philosophers call this **Standing to Blame**."
  *   "When you voted 'Drop' in Round 2, you weren't saying the accused was innocent. You were saying the Reporter lacked the **authority** or **right** to hold them accountable."
  *   "The phenomenon you felt—the reluctance to enforce when the enforcer is compromised—is the 'Hypocrisy Objection' to blame."
  *   "Round 3 asked: Is standing global (moral character) or local (norm-specific)? You just generated data on that. Next week we read [Author] who argues..."

  ## 5. Troubleshooting: What Will Go Wrong
  1.  **The "Consequentialist" Objection:**
      *   *Problem:* Students argue, "But if we don't punish him, he'll keep doing it!"
      *   *Fix:* Remind them: "This is a simulation of *fairness*, not utility. Assume the Co-Op won't collapse either way. Focus on the *right* to punish, not the *outcome*."
  2.  **The "Two Wrongs" Defense:**
      *   *Problem:* "Well, the Reporter did it too, so they should be punished instead."
      *   *Fix:* "We aren't voting on the Reporter today. We are voting on the Accused. Does the Reporter's guilt change the Accused's status?"
  3.  **Politeness/Peer Pressure:**
      *   *Problem:* Students won't vote against a classmate (the Reporter) even if they are hypocritical.
      *   *Fix:* Use anonymous voting if possible (folded paper), or emphasize: "Critique the *role*, not the *person*. You are Co-Op members, not friends, for this hour."
  4.  **Time Creep:**
      *   *Problem:* Round 1 takes too long.
      *   *Fix:* Be ruthless with the timer. If Round 1 runs long, skip the second vote in Round 1 (since we know it won't change) and move to Round 2. Round 2 is the critical path.

  ## 6. Limitations: What the Game Can't Capture
  *Be honest about this in your own prep (and optionally share a slice of it if time permits).*

  1.  **Procedural vs. Moral Standing:** In the game, the "Audit" is a rule. In real life, standing is a social/moral intuition. People don't usually check a ID card before blaming; they *feel* the lack of standing. The game mechanizes what is usually atmospheric.
  2.  **Repentance:** The game treats violations as static marks on a record. In reality, a hypocrite who *acknowledges* their hypocrisy and repents often regains standing. The game cards don't allow for nuance (e.g., "I did it, I'm sorry, I'm trying to stop").
  3.  **Severity Asymmetry:** The game treats all violations as roughly equal (Dishes vs. Noise). In reality, a minor hypocritical violation (speeding) might not rob you of standing to blame a major one (theft). The game's "Different Norm" round is binary; real life is scalar.

  ## 7. Instructor Script Snippets (For the "Audit")
  *   **Round 2 Reveal:** "Audit triggered. Reporter's Record: Violated Quiet Hours on Oct 4th and Oct 10th. No other violations."
  *   **Round 3 Reveal:** "Audit triggered. Reporter's Record: Violated Dishes Norm on Oct 2nd, 5th, 8th. Clean on Guest Norm."
  *   **Post-Vote Query:** "Keep your hands up if your vote changed. Keep them up if you felt the *Accused* was less guilty, or if you felt the *Process* was unfair?" (This distinguishes blame from standing).

  ## 8. Why This Design Works for Your Goal
  *   **Separation of Variables:** By locking the Accused's guilt as "Undisputed Fact," you remove the epistemic variable. The only moving part is the Accuser.
  *   **The "Different Norm" Card:** This directly targets your specific research interest (violation-specificity) without lecturing. If students vote "Sanction" in Round 3 but "Drop" in Round 2, they have empirically demonstrated that standing is norm-specific.
  *   **The Double Vote:** This forces the cognitive dissonance into the open. They commit to a judgment, receive new data about the *speaker*, and must reconcile the shift.
  *   **No Jargon:** By withholding "Standing to Blame," you prevent them from performing the "correct" philosophical answer. They have to rely on their raw normative intuitions.
