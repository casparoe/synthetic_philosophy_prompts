prompt: |-
  I teach an upper-level seminar on moral responsibility, and next week's topic is standing to blame — specifically whether hypocrisy robs you of the right to blame even when your accusation is spot on. 15 students, 80 minutes, a room with movable chairs. Design the session for me.

  Here's the part I care most about: the game has to separate the correctness of an accusation from the accuser's entitlement to make it. So the evidence in every case should be public and undisputed — everyone should know the accused did it — and the only variable should be something about the accuser. If the sanction collapses when the accuser turns out to have done the same thing, and nothing about the evidence changed, the students will have generated the phenomenon themselves instead of being told about it.

  Rough shape I have in mind (feel free to improve on it): a fictional co-op or boarding house with maybe five posted house norms, and each participant holds a private "history sheet" logging their own violations from the past week. I'll distribute the sheets myself, and I want some dirty, some clean, and some dirty on a *different* norm than the one they end up reporting on — that last kind matters, I'll say why in a second. Each round someone draws an incident: a specific member committed a specific violation, witnessed by a designated reporter. The reporter decides whether to open a case, then there's an enforcement vote by everyone else, and — this is the bit I'm not sure how to stage — some mechanism whereby the reporter's own sheet can get read out, sometimes before the vote and sometimes after. Ideally some rounds go: vote, reveal the sheet, vote again, so they can watch their own enforcement intuitions shift while literally nothing new has come out about the accused.

  The different-norm sheets are for the question I actually want the debrief to land on: if your reporter freerides on the pantry, does she still get to chair the noise-complaint case? I.e. does hypocrisy about one norm cost you standing to blame violations of an unrelated norm, or is standing violation-specific? I honestly don't know what my students will say about that, which is exactly why I want the game to force them to have the intuition before we name anything.

  Deliverables: full rules, materials I need to prep, a round structure that fits in 80 minutes including the debrief, the debrief itself (map moments in the game onto parts of the idea — what the vote was tracking, what the reveal changed, what the challenge/reveal mechanism was doing), what will predictably go wrong the first time I run it and how I should handle it, and an honest note on which feature of real standing-withdrawal the game just can't reproduce and I'll have to supply myself afterwards. No lecture up front — they shouldn't here the phrase "standing to blame" until the debrief, and I'd rather the in-game fiction avoid words like "hypocrisy" too. You don't need to bring in any literature by name in the debrief plan; I'll handle that part myself once they've felt the thing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Responsibility, specifically "Standing to Blame" and Hypocrisy.
      *   **Context:** Upper-level seminar, 15 students, 80 minutes, movable chairs.
      *   **Core Goal:** Separate the *correctness* of an accusation from the *entitlement* (standing) to make it. Evidence of the accused's guilt must be public and undisputed. The variable is the accuser's history.
      *   **Desired Mechanism:** A game/simulation (fictional co-op/boarding house). Participants have private "history sheets" (violations). Rounds involve an incident, a reporter, a vote on enforcement, and a reveal mechanism regarding the reporter's history.
      *   **Key Variable:** Some reporters are clean, some are hypocritical on the *same* norm, some are violators on a *different* norm (to test violation-specificity of standing).
      *   **Constraint:** No lecture up front. No terms like "standing" or "hypocrisy" until the debrief.
      *   **Deliverables:** Rules, Materials, Round Structure (timing), Debrief Plan, Troubleshooting (what goes wrong), Limitations (what the game can't capture).

  2.  **Deconstruct the Game Mechanics:**
      *   *Setting:* "The Co-op" (relatable, low stakes but normative).
      *   *Norms:* Need 3-5 clear rules. Let's pick 4 for simplicity: Noise, Dishes, Trash, Guests.
      *   *Roles:* Everyone is a "Member." One is the "Reporter" per round.
      *   *Secret Info:* Each student gets a "Record Card" showing their own past violations.
      *   *Public Info:* The current violation being reported (undisputed).
      *   *The Twist:* The "Standing Check." The group needs to decide if the Reporter gets to proceed.
      *   *The Reveal:* The Reporter's Record Card is revealed *after* an initial vote or decision, prompting a re-evaluation.
      *   *The "Different Norm" Issue:* This is crucial. If I stole bread, can I blame you for noise? The game needs to force this specific comparison.

  3.  **Drafting the Session Flow (80 Minutes):**
      *   *Intro (5 min):* Set the scene, distribute materials, explain rules (no theory).
      *   *Round 1 (15 min):* Clean Reporter. Establish baseline.
      *   *Round 2 (20 min):* Same-Norm Hypocrite. The core "Aha!" moment.
      *   *Round 3 (20 min):* Different-Norm Violator. The nuance test.
      *   *Debrief (20 min):* Connect experience to theory.
      *   *Buffer:* Need flexibility. Maybe combine rounds or shorten voting. Let's aim for 3 distinct scenarios.

  4.  **Refining the Mechanics (The "Standing Check"):**
      *   *Problem:* If the vote happens *before* the reveal, the reveal changes the *outcome*, not the vote. If the vote happens *after*, it's just a normal vote.
      *   *Solution:* Two-stage vote.
          1.  "Is the accused guilty?" (Established as Yes).
          2.  "Should the Co-op sanction the accused?" (Initial Vote).
          3.  "Reveal Reporter's Record."
          4.  "Should the Co-op sanction the accused?" (Final Vote).
      *   *Wait, better:* To make it punchier, the Reporter proposes a sanction. The group votes on the *sanction*. Then the Record is revealed. Then they vote again. This highlights the shift in *permission* to enforce, not just guilt.
      *   *Actually, the prompt suggests:* "Vote, reveal the sheet, vote again." Let's stick to that. It creates the cognitive dissonance directly.
      *   *Refinement on "Different Norm":* I need to ensure the distribution of Record Cards is controlled by the instructor, not random. I will pre-assign cards to ensure specific scenarios happen in specific rounds.

  5.  **Developing Materials:**
      *   *House Rules:* Clear, simple.
      *   *Incident Cards:* Pre-written scenarios.
      *   *Member Record Cards:* Pre-assigned to specific students for specific rounds. (Or simpler: Give them a permanent card at the start, but select the Reporter strategically).
      *   *Decision:* Permanent cards are easier logistics. I will assign specific students to be Reporters in specific rounds to ensure the "Clean," "Same-Norm Hypocrite," and "Different-Norm Violator" archetypes appear.

  6.  **Addressing the "What Goes Wrong" (Troubleshooting):**
      *   *Students might focus on the accused:* "Maybe they didn't mean to?" -> Instructor must enforce "Undisputed Fact."
      *   *Students might focus on utility:* "But if we don't punish, chaos!" -> Remind them this is about *fairness* of the process, not consequences.
      *   *Awkwardness:* Students might feel attacked. -> Keep it fictional, use numbers/names like "Member 4."
      *   *Time:* Voting can drag. -> Use hand signals or quick show of hands.

  7.  **Addressing the "Limitations":**
      *   *Real World:* Standing is often about moral authority, not just procedural rules. In the game, it's a rule. In life, it's a social norm.
      *   *Forgiveness:* The game doesn't easily model repentance.
      *   *Severity:* Game violations are trivial (dishes). Real ones might be grave.

  8.  **Structuring the Debrief:**
      *   *Phase 1: Phenomenology.* "What happened in Round 2?"
      *   *Phase 2: Distinction.* "Did the facts about the *accused* change?" (No). "What changed?" (The Reporter).
      *   *Phase 3: Generalization.* "Does a violation on Rule A stop you from enforcing Rule B?"
      *   *Phase 4: Theory.* Introduce "Standing to Blame."

  9.  **Review against Constraints:**
      *   15 students? Yes, small group dynamics work.
      *   80 mins? Yes, tight but doable.
      *   Movable chairs? Use for "Co-op Meeting" circle.
      *   No jargon upfront? Yes.
      *   Focus on "Different Norm"? Yes, built into Round 3.

  10. **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Record Cards" are clear.
      *   Add a specific script for the Instructor to maintain the "Undisputed Fact" boundary.
      *   *Self-Correction on Card Distribution:* If I give them cards at the start, they know their own status. If I select the Reporter *after* distributing cards, I can choose who reports based on their card. This is better. I will collect the cards or just ask specific people to stand up as Reporter based on my master list. Actually, simpler: I hand out specific envelopes to specific seats. I know who sits where. I assign the Reporter role based on the seat.
      *   *Wait, simpler:* I will act as the "House Manager." I call on a specific student to be the Reporter for the round. I have pre-placed their Record Card in their folder. This ensures I control the variable.

  11. **Finalizing the Plan:** (Drafting the response based on these thoughts).
      *   *Title:* The Co-Op Tribunal.
      *   *Setup:* Circle seating.
      *   *Materials:* Rule Sheet, Incident Reports, Private Record Cards (Pre-assigned).
      *   *Rounds:* 1 (Clean), 2 (Hypocrite), 3 (Cross-Norm).
      *   *Debrief:* Guided discovery.

  12. **Wait, one nuance:** The prompt asks for "some mechanism whereby the reporter's own sheet can get read out, sometimes before the vote and sometimes after."
      *   *Adjustment:* To maximize the effect, the *standard* procedure should be: Report -> Vote. Then, introduce a "Challenge" mechanism. Any member can call for a "Standing Check" (reveal card).
      *   *Better for Class Control:* To ensure the lesson lands, I should script the reveal. I will act as the "House Auditor." After the initial vote, I will say, "Audit triggered. Revealing Reporter's Record." Then vote again. This guarantees the data point I need for the debrief without relying on students to spontaneously challenge. It mimics the *possibility* of challenge without the risk of no one challenging.
      *   *Actually, let's hybridize:* Tell them there *is* a challenge mechanism, but as the instructor, I will trigger it for the sake of the simulation's pacing in Rounds 2 and 3.

      *(Self-Correction)*: The prompt says "Ideally some rounds go: vote, reveal the sheet, vote again." I will stick to this scripted reveal to ensure the pedagogical goal is met within the time limit. Relying on students to demand the reveal might fail if they are too polite.

      *(Refining the "Different Norm" aspect)*: I need to make sure the students notice the norm difference. I will explicitly label the norms (A, B, C, D) on the cards.

      *(Limitations)*: The game makes standing a procedural rule (the vote changes). In reality, standing is often a moral intuition (you *can* procedurally blame, but it's *wrong* to). I need to highlight this in the "Limitations" section.

