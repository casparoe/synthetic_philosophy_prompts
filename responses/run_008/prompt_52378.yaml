  4.  **Evaluate Each Reading (Truth, Knowability, Action):**
      *   *Lock-and-Key:* Is it true? Mostly, but people *do* change minds via reason sometimes. Knowable? Hard to know exactly how a belief formed. Action? Suggests quitting *logical* debate, maybe trying emotional appeals instead.
      *   *Efficiency:* Is it true? Yes, ROI is low. Knowable? Yes, based on past experience (3 years of arguing). Action? Yes, quit because it's not worth it.
      *   *Social:* Is it true? Often yes. Politics is team sports. Knowable? Hard to admit to oneself. Action? Quit debating, start bonding (or stop engaging).
      *   *Exhaustion:* Is it true? Subjectively yes for the cousin. Knowable? Yes. Action? Yes, stop for peacekeeping.

  5.  **Address the "Cuts Both Ways" Paradox:**
      *   If he wasn't reasoned in, neither was I.
