answer: |-
  Subject: Re: The CH vs. Parallel Postulate analogy

  I have been thinking about what your professor said regarding the Continuum Hypothesis and the Parallel Postulate, and it is certainly a compelling narrative that many set theorists find attractive. The analogy is historically grounded and does a excellent job of explaining the technical situation regarding independence, but whether it settles the philosophical question of truth is another matter entirely. To see where the argument stands, we have to look closely at how the mapping works before we inspect where it fractures.

  On the surface, the correspondence is quite tight. In the geometric case, you have Euclid's axioms without the Parallel Postulate, often called neutral geometry. This system is incomplete because it cannot decide whether parallel lines meet or diverge. The Parallel Postulate is the independent statement. When you add it, you get Euclidean geometry. When you negate it, you get non-Euclidean geometries like the hyperbolic plane. In set theory, ZFC plays the role of neutral geometry. It is the base theory that most mathematicians accept. The Continuum Hypothesis is the independent statement, analogous to the Parallel Postulate. Gödel's constructible universe L is a model where ZFC holds and CH is true, functioning like the Euclidean plane. Cohen's forcing method allows us to build models where ZFC holds and CH is false, functioning like the hyperbolic plane. Just as the existence of hyperbolic geometry proved the Parallel Postulate was not a logical consequence of the other axioms, Cohen's forcing proved CH is not a logical consequence of ZFC. So far, the professor is on solid ground.

  The professor's leap comes from the historical aftermath of the geometric discovery. Once mathematicians realized non-Euclidean geometry was consistent, the philosophy of geometry shifted. We stopped asking which geometry is the true one and started viewing geometry as the study of arbitrary structures satisfying certain axioms. Euclidean geometry is true of flat spaces, hyperbolic of negatively curved spaces, and neither is universally true of mathematical space itself. Your professor wants to import this structuralist view into set theory. He is arguing that we should stop looking for the one true universe of sets V and instead accept a multiverse where ZFC plus CH and ZFC plus not CH are just different set theories describing different structures, neither having a claim to ultimate truth.

  However, this is where the mapping begins to break down, and significantly so. The crucial disanalogy lies in the intended interpretation of the axioms. When we do geometry, we generally accept that there are many kinds of spaces. But when we do set theory, the prevailing intuition is that we are trying to describe a specific cumulative hierarchy of all sets. The concept of an arbitrary subset of the natural numbers feels definite to most mathematicians. In geometry, the undefined terms like point and line are abstract placeholders. In set theory, the term set is meant to capture a specific pre-theoretic notion of collection. If you believe there is a fixed reality of what counts as all subsets of the integers, then CH has a determinate truth value, even if ZFC cannot find it. The geometric shift to structuralism worked because we abandoned the idea that there was one true space. Set theorists who resist the multiverse view argue we cannot abandon the idea of one true conception of without losing the subject matter itself.

  There is also the issue of the empirical referee you mentioned. In the nineteenth century, people thought Euclidean geometry was the true geometry of physical space. Gauss even measured mountains to check the angles of triangles. Eventually, General Relativity showed that physical space is non-Euclidean. This provided an empirical answer to which geometry describes our universe, even if both remain valid mathematically. Set theory lacks this empirical outlet. There is no physical measurement that can tell us whether there is a set of real numbers with cardinality strictly between the integers and the continuum. Because set theory is foundational, it underpins the mathematics used in physics, rather than being tested by it. This lack of an external referee keeps the question of truth internal to mathematics, making the structuralist retreat less forced than it was in geometry. We were forced to accept non-Euclidean geometry as physically relevant. We are not forced to accept CH as false or true by any external data.

  Furthermore, there is a difference in how the models behave. In geometry, Euclidean and hyperbolic geometries are symmetric in a way that CH and not CH are not. Many set theorists feel that models where CH is false are richer and allow for more regularity properties of sets of reals, whereas Gödel's L is considered thin or restrictive. In geometry, one curvature is not inherently mathematically superior to another in the same normative sense. This asymmetry suggests that the independence of CH might be a limitation of ZFC rather than a sign that the question is meaningless. Some researchers, like Hugh Woodin, argue that we should seek new axioms that settle CH, much like adding completeness axioms settles the geometry of the real line. If the analogy were perfect, no one would bother trying to find such axioms.

  So, does the professor's indeterminacy conclusion survive these disanalogies? I would say the analogy does most of the work for his conclusion, and once the disanalogies are on the table, the conclusion becomes a philosophical preference rather than a logical necessity. The analogy successfully proves that ZFC is not enough to decide CH, just as neutral geometry could not decide the Parallel Postulate. But it does not prove that CH lacks a truth value. That extra step relies on accepting that set theory is purely structural, like modern geometry, rather than descriptive of a unique intended universe. If you believe the cumulative hierarchy is a definite object, the independence result just means ZFC is incomplete, not that CH is indeterminate. Your professor is effectively advocating for a multiverse view of set theory, which is a coherent position held by many experts, but he is presenting it as the only rational conclusion of the independence proofs. It is not. It is one philosophical reaction to the proofs, supported by the analogy, but not mandated by it. The analogy explains why we can have different models, but it cannot tell us whether we should care about only one of them as the true one.
