  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a clinical ethics committee at a mid-size fertility clinic with an in-house embryo genetics lab.
      *   **Task:** Draft a written opinion for circulation before next Tuesday's meeting.
