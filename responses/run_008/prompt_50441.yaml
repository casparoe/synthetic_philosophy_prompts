      *   *No false consensus?* Yes, will use language like "The committee remains divided," "Bioethicists disagree."

  7.  **Final Polish:** Check the voice. It needs to sound like a committee member speaking to colleagues, not a judge issuing a verdict. It should invite discussion but provide a clear anchor. (Self-Correction: Make sure I don't sound like I'm solving the moral debate for the world, just for this clinic's policy).

