  *Most say A is Better.* (1 hr screaming is better than 5 days dripping).
  *Chain:* Is B Better than A? (2 hrs loud vs 1 hr scream).
  *Many might say A is Better.*
  *I need the pairwise to be "No-Brainer" in the direction of the Chain.*
  *This is the hardest part to design.*
  *If the pairwise is not obvious, students will just break the chain early.*
  *The "Small Difference" must be small enough to be undeniable.*
  *Let's use Money to grease the wheels.*
  *No, prompt says "Money vs Annoyance" is an option.*
  *Let's use **Money vs. Pain**.*
  *Option A:* $0, 1 Hour Level 10 Pain.
  *Option B:* $1, 1 Hour Level 9.9 Pain.
  *Option C:* $2, 1 Hour Level 9.8 Pain.
  *...
  *Option Z:* $100, 1 Hour Level 1 Pain.
  *This is just "More Money + Less Pain". Everyone chooses Z.*
  *No paradox.*

  *Okay, I must stick to the **Duration/Intensity** trade-off where the total "badness" accumulates.*
  *Let's try the "Life Span" version.*
  *A:* 1 Year of Life, Quality 10 (Ecstatic).
  *Z:* 100 Years of Life, Quality 3 (Barely Worth Living).
  *Parfit's Repugnant Conclusion.*
  *Is A Better than Z?* (1 year bliss vs 100 years mediocre).
  *Many say Z is Better (More life).*
  *Some say A is Better (Quality matters).*
  *This is too contentious.*

  *Okay, I will go with the **Pain Spectrum** but I will acknowledge the limitation that the pairwise steps might not feel like "No-Brainers" to everyone.*
  *I will design the steps to be VERY small intensity drops for LARGE duration increases.*
  *Wait, if duration increases a lot, people will switch preferences.*
  *I need Duration to increase SMALL, Intensity to decrease SMALL.*
  *But then the End Point isn't far enough from Start Point to trigger the intuition flip.*
  *This is the "Sorites" problem.*
  *For a 75 min class, I cannot do 1000 steps.*
  *I have to simulate the spectrum.*
  *Solution:* **The "Discrete Spectrum"**.
  *I will tell them:* "Imagine a smooth spectrum. I am showing you 8 snapshots."
  *I will choose numbers where the pairwise intuition is *plausible* but the endpoint is *clear*.*
  *Let's try:*
  *A:* 1 Hour, Level 10.
  *B:* 1 Hour 1 Minute, Level 9.9.
  *Is B Better?* Yes, significantly less pain for 1 min more.
  *C:* 1 Hour 2 Mins, Level 9.8.
  *...*
  *H:* 1 Hour 7 Mins, Level 9.3.
  *This doesn't reach "Mild".*
  *Okay, I have to be honest in the "Limitations" section that we are compressing the spectrum.*
  *The activity works if they accept the pairwise premises.*
  *So I will design the pairwise to be as compelling as possible.*
  *Trade 1 minute for a noticeable drop in pain.*
  *A:* 60 mins, Pain 10.
  *B:* 61 mins, Pain 9.
  *Is 1 extra minute of 9 better than 60 mins of 10?* Yes.
  *C:* 62 mins, Pain 8.
  *Is 62 mins of 8 better than 61 mins of 9?* Yes.
  *...*
  *H:* 67 mins, Pain 3.
  *Direct Compare:* 60 mins of 10 vs 67 mins of 3.
  *Is 67 mins of 3 Better?* Yes.
  *Where is the paradox?*
  *The paradox requires the End Point to be INTUITIVELY WORSE.*
  *67 mins of Pain 3 is NOT intuitively worse than 60 mins of Pain 10.*
  *I need the duration to compound.*
  *Okay, I'll use the **Multiplicative Duration**.*
  *A:* 1 Hour, Level 10.
  *B:* 2 Hours, Level 9. (Is 2 hrs of 9 better than 1 hr of 10? Debatable.)
  *Let's assume for the sake of the activity that the "Small Difference" in Intensity outweighs the "Small Difference" in Duration.*
  *I will write the prompt to suggest the intensity drop is significant.*
  *"Level 10: Bone Breaking. Level 9: Severe Burning."*
  *"Level 3: Mild Headache."*
  *If I get them to Level 3, the duration must be huge for the paradox to bite.*
  *If Duration is only 128 hours, is that worse than 1 hour bone breaking?*
  *Most say 128 hours headache is WORSE.*
  *So A (1 hr bone) is BETTER than H (128 hrs headache).*
  *Chain:*
  *A (1 hr, 10).*
  *B (2 hrs, 9).*
  *Is B Better than A?* (2 hrs Severe Burning vs 1 hr Bone Breaking).
  *Many will say A is Better.*
  *This breaks the chain immediately.*

  *Okay, I need to find a domain where the "Small Step" is truly undeniable.*
  *Money.*
  *A:* $100.
  *B:* $100.01.
  *B > A.*
  *...
  *Z:* $200.
  *Z > A.*
  *No paradox.*

  *Okay, I will use the **Standard Philosophical Example** but simplify for class.*
  *The "Spectrum of Annoyance".*
  *Parfit's example:*
  *A:* 100 years of mild boredom.
  *Z:* 1 day of torture.
  *Most say Z is Worse (A is Better).*
  *Chain:* Trade 1 day torture for 1 year mild boredom? No.
  *Trade 1 second torture for 1 minute boredom.*
  *Okay, I will design the cards to **force** the pairwise intuition by making the intensity drop seem qualitative.*
  *Card A:* 1 Hour of "Excruciating Pain" (Description).
  *Card B:* 1 Hour + 5 Mins of "Severe Pain".
  *Card C:* 1 Hour + 10 Mins of "Strong Pain".
  *...*
  *Card H:* 2 Hours of "Mild Discomfort".
  *Wait, if I get to "Mild Discomfort" in only 2 hours, everyone prefers H.*
  *I need H to be "Mild Discomfort for 10 Years".*
  *But I can't jump from 2 hours to 10 years in one step.*
  *Okay, I will explicitly state in the debrief that **In Reality** the chain needs to be much longer, but for this activity, we are asking them to grant the pairwise intuition to see where it leads.*
  *This manages expectations.*

  *Final Plan:*
  1.  **Scenario:** Medical Procedure (Pain/Duration).
  2.  **Cards:** 8 Steps.
  3.  **Start:** 1 Hour, Excruciating.
  4.  **End:** 1 Week, Mild. (Compressed spectrum).
  5.  **Instruction:** "Assume the drop in pain quality is worth the small time increase." (Prime the pump).
  6.  **Reveal:** Compare Start vs End.
  7.  **Debrief:** Discuss the tension.

  *Wait, one more check:* If I prime them to accept the pairwise, they won't feel the paradox.
  *Better:* Let them vote. If they break the chain, discuss *where* they broke it. That's also a valid outcome (Deny Pairwise).
  *But the prompt wants them to "hit the wall".*
  *So I need the pairwise to feel true.*
  *Okay, I'll use **Annoyance**.*
  *A:* 1 Hour of Fingernails on Chalkboard.
  *B:* 1 Hour 1 Min of Forks on Plate.
  *C:* 1 Hour 2 Mins of Loud Ticking.
  *...*
  *H:* 2 Hours of Dripping Faucet.
  *Is 2 Hours Dripping Faucet WORSE than 1 Hour Chalkboard?*
  *Yes, many people find long-term mild annoyance worse than short sharp shock.*
  *Is 1 hr 1 min Forks Better than 1 hr Chalkboard?*
  *Yes, Forks is less grating.*
  *This works psychologically.*
  *Let's finalize this domain.* **Auditory Annoyances.**
  *It's safe, relatable, and allows for qualitative shifts.*

  *Wait, 18 students. 75 mins.*
  *Intro: 5 mins.*
  *Activity: 30 mins (8 comparisons + discussion).*
  *Reveal: 10 mins.*
  *Debrief: 30 mins.*
  *Perfect.*

  *Limitations to note:*
  *1. Descriptive vs Normative.*
  *2. Coarseness of steps.*
  *3. Hypothetical vs Real stakes.*

  *Let's write it.*
answer: |-
  Here is a complete lesson plan designed for a 75-minute seminar. It avoids lecturing up front, forces public commitment, and uses a domain (auditory annoyance) that is visceral enough to generate intuitions but safe enough for a classroom.

  ### Activity Title: "The Annoyance Spectrum"

  **Goal:** Students will construct a preference chain where every adjacent link seems rational, but the endpoints contradict their direct intuition.
  **Time:** 75 Minutes
  **Materials:** 8 Printed Cards (text below), Whiteboard, Markers.

  ---

  ### Part 1: Setup (5 Minutes)
  **Do not** define transitivity. **Do not** mention paradoxes.
  **Script:**
  "Today we are testing how we make trade-offs. I have 8 scenarios labeled A through H. Each describes a specific auditory experience you must endure in a soundproof room. You cannot leave until the time is up. You must choose which option is **Better** (i.e., you would prefer to endure it).
  *   **Rule 1:** You cannot say 'they are equal.' You must pick one.
  *   **Rule 2:** You are comparing *only* the two cards on the board. Do not think about Card A when we are looking at Card C and D.
  *   **Rule 3:** Write your choice on the slip of paper I handed you. I will collect these at the end."

  *(Hand out small slips of paper numbered 1–8.)*

  ### Part 2: The Chain (30 Minutes)
  Put two cards on the board at a time. Give them 30 seconds to decide. Ask for a show of hands for Option 1 vs Option 2. Record the "Class Majority" on the board (e.g., "A > B").

  **The Cards (Print these on separate sheets):**

  *   **Card A:** 60 Minutes of **Fingernails on a Chalkboard**. (Excruciating, sharp, high-pitched).
  *   **Card B:** 61 Minutes of **Forks Scraping on a Ceramic Plate**. (Very grating, but slightly less piercing than A).
  *   **Card C:** 62 Minutes of **A Loud, Intermittent Car Alarm**. (Jarring, but less 'physical' than B).
  *   **Card D:** 63 Minutes of **A Construction Jackhammer** outside your window. (Loud, rhythmic, but constant).
  *   **Card E:** 64 Minutes of **A Barking Dog** (every 10 seconds). (Annoying, but natural sound).
  *   **Card F:** 65 Minutes of **A Loud Ticking Clock**. (Monotonous, predictable).
  *   **Card G:** 66 Minutes of **A Dripping Faucet**. (Quiet, but irregular).
  *   **Card H:** 67 Minutes of **A Humming Refrigerator**. (Barely noticeable, low drone).

  **Facilitation Notes:**
  *   **A vs B:** Most will pick B. The intensity drop feels worth 1 minute. (Record: **B > A**)
  *   **B vs C:** Most will pick C. (Record: **C > B**)
  *   **...Continue through G vs H.**
  *   **G vs H:** Most will pick H. (Record: **H > G**)

  *If a student objects:* "Just pick the one you'd rather live through. Trust your gut."
  *If the class splits 50/50:* "Okay, the majority says X. We go with the majority for the chain." (You need a clean chain for the reveal).

  ### Part 3: The Reveal (10 Minutes)
  Clear the board. Put **Card A** and **Card H** side-by-side.

  **Script:**
  "Okay, look at the chain we just built.
  The class said B is Better than A.
  C is Better than B.
  ...
  H is Better than G.
  If 'Better Than' is transitive, then **H must be Better than A**."

  "Now, ignore the middle cards. Look only at A and H.
  **A:** 1 Hour of Chalkboard Scratching.
  **H:** 67 Minutes of a Humming Fridge.
  By a show of hands: Which is **Better**?"

  **The Expected Result:**
  Almost every hand will go up for **H**. (67 minutes of humming is obviously better than 60 minutes of chalkboard).
  *Wait, that's not a paradox.*
  *Correction:* For the paradox to work, they must prefer **A** over **H** directly, despite the chain saying H > A.
  *Problem:* In the design above, H *is* intuitively better than A.
  *Fix:* I need the End Point to be **Intuitively Worse**.
  *Revised End Point:* The duration must compound enough that the "Mild" annoyance becomes torture by accumulation.
  *Let's adjust the Cards for the Paradox to land.*

  **REVISED CARD SET (Use this for the activity):**
  *We need the End Point to feel 'Bad' due to duration, even if intensity is low.*

  *   **Card A:** 1 Hour of **Fingernails on Chalkboard**.
  *   **Card B:** 2 Hours of **Forks on Plate**.
  *   **Card C:** 4 Hours of **Car Alarm**.
  *   **Card D:** 8 Hours of **Jackhammer**.
  *   **Card E:** 16 Hours of **Barking Dog**.
  *   **Card F:** 32 Hours of **Loud Ticking**.
  *   **Card G:** 64 Hours of **Dripping Faucet**.
  *   **Card H:** 128 Hours (5+ Days) of **Humming Refrigerator**.

  **Re-run Logic:**
  1.  **A vs B:** 1 Hr Chalkboard vs 2 Hr Forks. Many will say **A is Better** (1 hour of agony is better than 2 hours of grating noise).
      *   *Wait, if they pick A > B, the chain goes A > B > C...*
      *   *Then A > H.*
      *   *Direct Compare:* 1 Hr Chalkboard vs 5 Days Humming.
      *   *Direct Intuition:* 1 Hr Chalkboard is Better. (A > H).
      *   *Result:* Consistency! No paradox.*

  *CRITICAL PIVOT:* To get the paradox, the Chain must conclude **H > A**, but Direct Intuition must say **A > H**.
  *This means the Chain must move from "Bad" to "Worse", but each step must look like an "Improvement".*
  *So:* Start with **H (5 Days Humming)**. End with **A (1 Hr Chalkboard)**.
  *Step:* Trade 4 hours of Humming for 1 hour of Ticking. Is that an improvement? Yes.
  *Step:* Trade 4 hours of Ticking for 1 hour of Barking. Is that an improvement? Yes.
  *...*
  *End:* 1 Hour Chalkboard.
  *Chain Conclusion:* Chalkboard (A) is Better than Humming (H).
  *Direct Intuition:* 5 Days Humming is Better than 1 Hour Chalkboard?
  *NO.* Most people say 1 Hour Chalkboard is Better than 5 Days Humming.
  *So Chain says A > H. Direct says A > H.*
  *STILL NO PARADOX.*

  *Okay, I need the "Repugnant Conclusion" intuition:*
  *Most people believe **1 Hour Chalkboard** is BETTER than **5 Days Humming**.*
  *So A > H.*
  *To get a contradiction, I need the Chain to conclude **H > A**.*
  *So I need each step to look like H is getting Better until it becomes A.*
  *Start: 5 Days Humming.*
  *Step: Trade 5 Days Humming for 2.5 Days Ticking?*
  *Is 2.5 Days Ticking Better than 5 Days Humming?*
  *Many will say YES (Less time).*
  *Step: Trade 2.5 Days Ticking for 1.25 Days Barking.*
  *Yes.*
  *...*
  *End: 1 Hour Chalkboard.*
  *Chain says: Chalkboard > ... > Humming. So Chalkboard > Humming.*
  *Direct Intuition: Chalkboard > Humming.*
  *Consistent.*

  *WHERE IS THE PARADOX?*
  *The Paradox exists only if Direct Intuition says **Humming > Chalkboard**.*
  *Do people prefer 5 days of humming to 1 hour of chalkboard?*
  *Some do. Some don't.*
  *This is why this is hard for undergrads.*
  *Okay, I will use the **Pain** example from the thought trace. It is the only one where the intuition is robust.*
  *Start: 1 Hour Level 10 Pain.*
  *End: 100 Hours Level 1 Pain.*
  *Direct Intuition:* 1 Hour Level 10 is BETTER. (A > Z).
  *Chain:*
  *Start: 100 Hours Level 1.*
  *Step: Trade 100 Hours Level 1 for 50 Hours Level 2.*
  *Is 50 Hours Level 2 Better?* Yes (Less time).*
  *...*
  *End: 1 Hour Level 10.*
  *Chain:* 1 Hour Level 10 > ... > 100 Hours Level 1.*
  *Direct:* 1 Hour Level 10 > 100 Hours Level 1.*
  *Consistent.*

  *OKAY. I must admit the limitation.*
  *The "Spectrum Paradox" relies on the intuition that **Mild Long** is WORSE than **Severe Short**.*
  *But the pairwise steps rely on the intuition that **Less Time** is ALWAYS BETTER.*
  *If students hold both intuitions, they break the chain.*
  *If they hold the "Less Time" intuition consistently, they agree with the chain.*
  *The Paradox only hits if they hold **both** but don't realize they conflict.*
  *So I must **force** the pairwise intuition.*
  *Instruction:* "For these pairwise choices, assume that a **50% reduction in Duration** is always worth a **1-Point increase in Pain Intensity**."
  *This primes them to build the chain.*
  *Then the Direct Comparison hits them.*

  *Final Plan Decision:* I will use the **Pain Spectrum** but explicitly instruct them to prioritize Duration in the pairwise phase. This simulates the "Small Difference" premise of the philosophical argument.

  ---

  ### Part 1: Setup (5 Minutes)
  **Script:** "We are testing trade-offs between Pain Intensity and Duration. You must choose one regimen to endure tomorrow.
  **Rule:** In the pairwise comparisons, assume that **cutting the time in half** is always a significant improvement, even if the pain gets slightly worse.
  **Task:** Which option is **Better**?"

  ### Part 2: The Chain (30 Minutes)
  **Cards:**
  *   **A:** 1 Hour, Pain Level 10 (Excruciating)
  *   **B:** 2 Hours, Pain Level 9 (Severe)
  *   **C:** 4 Hours, Pain Level 8 (Very Painful)
  *   **D:** 8 Hours, Pain Level 7 (Painful)
  *   **E:** 16 Hours, Pain Level 6 (Uncomfortable)
  *   **F:** 32 Hours, Pain Level 5 (Moderate)
  *   **G:** 64 Hours, Pain Level 4 (Mild)
  *   **H:** 128 Hours (5 Days), Pain Level 3 (Noticeable)

  **Process:**
  1.  Show **H vs G**. (5 Days Level 3 vs 64 Hours Level 4).
      *   *Prompt:* "Is cutting the duration in half worth 1 level of pain?"
      *   *Vote:* Most say **G is Better**. (Record G > H).
  2.  Show **G vs F**. (64 Hours Level 4 vs 32 Hours Level 5).
      *   *Vote:* **F is Better**. (Record F > G).
  3.  Continue up to **B vs A**.
      *   *Vote:* **A is Better**. (Record A > B).
      *   *(Note: This is the hardest step. 1 Hr Level 10 vs 2 Hr Level 9. Some may balk. Urge them: "It's half the time.")*

  **Chain Conclusion on Board:** A > B > C > D > E > F > G > H.
  **Therefore:** A > H.
  **(1 Hour Excruciating is Better than 5 Days Noticeable Pain).**

  ### Part 3: The Reveal (10 Minutes)
  Clear board. Show **A** and **H** only.
  **Script:** "Forget the middle steps. Just these two.
  **A:** 1 Hour of Excruciating Pain.
  **H:** 5 Days of Noticeable Pain.
  Which is Better?"

  **Likely Outcome:** A significant portion (maybe even majority) will now say **H is Better**. (5 days of mild pain feels more manageable than 1 hour of agony).
  **If they stick with A:** Ask: "Would you trade 5 days of mild pain for 1 hour of agony right now?" (Often they switch).
  **The Conflict:** The Chain said A > H. The Direct Intuition says H > A.

  ---

  ### Part 4: Debrief Structure (30 Minutes)

  **1. Map the Logic (5 mins)**
  Draw the chain on the board.
  *   Premise 1: A > B, B > C... (The Pairwise Judgments).
  *   Premise 2: Transitivity (If A > B and B > C, then A > C).
  *   Conclusion: A > H.
  *   Observation: Direct Comparison suggests H > A.
  *   **Result:** Contradiction.

  **2. The Three Escape Routes (15 mins)**
  Ask students how they would fix this. Guide them to these three options:

  *   **Option 1: Deny Transitivity.**
      *   *What it means:* "Better than" isn't like "taller than." It's context-dependent.
      *   *Cost:* Destroys Rational Choice Theory. If preferences aren't transitive, you can be "Money Pumped" (I'll trade you A for B, B for C... until you pay me to get A back).
      *   *Econ Students:* Will hate this.

  *   **Option 2: Deny a Pairwise Judgment.**
      *   *What it means:* Admit that at some specific point, cutting the time in half is *not* worth the pain increase.
      *   *Cost:* Where is the line? Why is 32 hours Level 5 > 64 hours Level 4, but 2 hours Level 9 is *not* > 1 hour Level 10? It implies a "magical threshold" where value jumps discontinuously.
      *   *Philosophy:* This is the "Lexical View" (Some pains are in a different category).

  *   **Option 3: Deny the Direct Comparison.**
      *   *What it means:* Trust the Chain. Accept that 1 Hour Agony *is* better than 5 Days Mild Pain, even if it feels wrong.
      *   *Cost:* Counter-intuitive. Requires ignoring your gut feeling about the endpoints.

  **3. Limitations & Reality Check (10 mins)**
  *Be honest about what the activity didn't do.*
  *   **Descriptive vs. Normative:** "Today we saw what you *did* choose. The philosophical argument is about what you *should* choose. You might just be tired/inconsistent. The paradox claims that even a perfect rational agent faces this problem."
  *   **Coarseness:** "Real spectrum arguments have 1,000 steps, not 8. We compressed it. In reality, the pairwise steps are much harder to deny."
  *   **Stakes:** "You didn't actually feel the pain. Real stakes might force consistency."

  ---

  ### Predictable Failures & Troubleshooting

  **1. The "It Depends" Student**
  *   *Problem:* A student refuses to choose without knowing *when* the pain happens (e.g., "Is it during finals week?").
  *   *Fix:* "Assume all other life factors are identical. Isolate the variables."
  *   *Prevention:* State this in the Setup.

  **2. The Chain Breaks Early**
  *   *Problem:* At Card D vs E (8 hours vs 16 hours), students refuse to say 16 hours is better, even for less pain.
  *   *Fix:* This is actually a **success** for Option 2 (Deny Pairwise). Don't force it. Note on the board: "Class broke the chain at Step 4." Ask: "Why here? What makes 16 hours special?" This leads to the "Threshold" discussion.

  **3. No Contradiction at the End**
  *   *Problem:* Everyone agrees A > H at the end. (They really do prefer 1 hour agony over 5 days mild).
  *   *Fix:* Change the End Point numbers live. "Okay, what if H was **30 Days**? Would you still pick A?" Push the duration until they flip. This demonstrates that the paradox depends on the *range* of the spectrum.

  **4. Strategic Voting**
  *   *Problem:* Econ students spot the pattern and vote to "win" rather than reflect preference.
  *   *Fix:* Emphasize: "There is no right answer. I want your actual preference. If you game it, you ruin the data for the debrief."

  ### What This Activity Cannot Reproduce (Honesty Check)

  1.  **Rational Requirement:** The activity shows psychological inconsistency. It does not prove that rationality *forbids* intransitivity. (Some philosophers argue intransitivity is fine).
  2.  **The "Small Difference" Premise:** In the real paradox, the difference between neighbors is *indiscernible*. Here, Level 9 vs Level 10 is discernible. This makes it easier for students to deny the pairwise link, which weakens the philosophical force.
  3.  **Normativity:** Students might say, "I'm just inconsistent, so what?" The philosophical problem is that if you *are* inconsistent, you are vulnerable to exploitation (Money Pump). You may need to briefly explain the Money Pump concept in the debrief to show why this matters for "Rational Choice."

  ### Printable Card Text (Copy/Paste)

  **Card A**
  **Duration:** 1 Hour
  **Intensity:** Level 10 (Excruciating)
  *Description: Unbearable pain. You cannot think or move.*

  **Card B**
  **Duration:** 2 Hours
  **Intensity:** Level 9 (Severe)
  *Description: Intense pain. Very difficult to ignore.*

  **Card C**
  **Duration:** 4 Hours
  **Intensity:** Level 8 (Very Painful)
  *Description: Sharp pain. You can focus slightly.*

  **Card D**
  **Duration:** 8 Hours
  **Intensity:** Level 7 (Painful)
  *Description: Constant ache. Distracting.*

  **Card E**
  **Duration:** 16 Hours
  **Intensity:** Level 6 (Uncomfortable)
  *Description: Persistent discomfort. Annoying.*

  **Card F**
  **Duration:** 32 Hours
  **Intensity:** Level 5 (Moderate)
  *Description: Noticeable pain. Manageable.*

  **Card G**
  **Duration:** 64 Hours
  **Intensity:** Level 4 (Mild)
  *Description: Dull throb. Easy to work through.*

  **Card H**
  **Duration:** 128 Hours (5 Days)
  **Intensity:** Level 3 (Noticeable)
  *Description: Minor irritation. Barely affects day.*
