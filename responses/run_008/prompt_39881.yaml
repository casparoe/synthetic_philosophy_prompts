answer: |-
  # JOINT STATEMENT ON EPISTEMIC AKRASIA

  **Signatories:** The Requirement Camp & The Permission Camp
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Rationality of Akratic Belief

  ## I. AGREED CLAIMS

  We, the undersigned, having engaged in extended adversarial collaboration, affirm the following substantive claims as common ground. These claims rule out several simplistic arguments previously employed by both sides and establish the boundaries within which our disagreement persists.

  1.  **The Normative Force of Higher-Order Evidence:** In ordinary cases, higher-order evidence (evidence about what one's evidence supports or about one's own reliability) possesses significant normative force. We agree that if a subject acquires definitive evidence that their cognitive faculties are currently impaired (e.g., a reliable test result indicating heavy sedation), rationality typically requires adjusting first-order confidence, even if the first-order evidence remains unchanged. Neither camp holds that higher-order evidence is inert.
  2.  **Moore-Paradoxical Combinations:** We agree that Moore-paradoxical combinations (e.g., believing "P is true, but my evidence does not support P") cannot be rationally believed *all-in*. While we disagree on whether such states can be held rationally in a fragmented or temporary way, we concur that a subject cannot coherently endorse such a combination as a stable, fully reflective rational stance.
  3.  **Evidence vs. Taken Evidence:** We accept the distinction between the evidence a subject *actually possesses* (the objective body of support) and the evidence a subject *takes themselves to possess* (their subjective perspective on that support). We agree that any complete theory of rationality must account for the interaction between these two levels, though we disagree on which level dominates when they diverge.
  4.  **The Insufficiency of "Evidence of Evidence":** We agree that the slogan "evidence of evidence is evidence" settles nothing regarding akrasia. This principle, even if true, fails to specify the *weight* of higher-order evidence relative to first-order evidence. It does not, by itself, determine whether higher-order evidence always defeats first-order evidence or merely competes with it.
  5.  **The Status of the Self-Undermining Objection:** We agree that the complaint that the Requirement camp's principle is self-undermining is an argument the Permission camp owes rather than an observation it is entitled to. Merely pointing out that the principle applies to itself does not refute it; the Permission camp must demonstrate that applying the principle to itself generates a contradiction or an unacceptable result, not simply assert that it does.

  ## II. MAP OF REMAINING DISAGREEMENTS

  The following table summarizes the core points of contention. For each disagreement, we provide two formulations: one that the Requirement Camp accepts as the fairest statement of the issue, and one that the Permission Camp accepts likewise.

  | # | Requirement Camp Formulation | Permission Camp Formulation |
  | :--- | :--- | :--- |
  | **1** | **The Coherence Constraint:** Rationality fundamentally requires coherence between a subject's first-order attitudes and their higher-order attitudes about those attitudes. To believe *P* while believing one's evidence does not support *P* is a distinct rational failure, regardless of the quality of the first-order evidence. | **The Evidence-Responsiveness Constraint:** Rationality fundamentally requires responding correctly to the total evidence available. If first-order evidence strongly supports *P*, a subject may be rational to believe *P* even if misleading higher-order evidence suggests they should not. |
  | **2** | **The Priority of the Subject's Standpoint:** Rational assessment must be conducted from the subject's own standpoint. If the subject believes their evidence is misleading, they cannot rationally rely on that evidence without violating the requirement to align belief with their view of their reasons. | **The Priority of the Assessor's Standpoint:** Rational assessment is often best conducted from an assessor's standpoint that accounts for facts about reliability and evidence that the subject may be mistaken about. A subject can be rational even if they are mistaken about what their evidence supports, provided they respond to the evidence itself. |
  | **3** | **Verbal Dispute Note (Standpoint):** We identify a partially verbal dispute regarding the term "Rationality." The Requirement Camp tends to use "rational" to mean *internally coherent from the subject's perspective*. The Permission Camp tends to use "rational" to mean *properly responsive to the objective evidence*. While this linguistic difference explains some friction, it does not dissolve the dispute, as both camps agree there is a substantive normative question about what one *ought* to do when these standpoints diverge. | **Verbal Dispute Note (Standpoint):** We identify a partially verbal dispute regarding the term "Rationality." The Permission Camp tends to use "rational" to mean *properly responsive to the objective evidence*. The Requirement Camp tends to use "rational" to mean *internally coherent from the subject's perspective*. While this linguistic difference explains some friction, it does not dissolve the dispute, as both camps agree there is a substantive normative question about what one *ought* to do when these standpoints diverge. |

  ## III. CRUXES AND COMMITMENTS

  We identify the following subquestions as cruxes. Settling these questions would compel at least one camp to revise its position. For each crux, we specify a case or argument bearing on it and record each camp's prediction in advance. These predictions serve as commitments; if the intuitive or theoretical verdict on the case goes against a camp's prediction, that camp acknowledges it must move.

  ### Crux 1: The Ledger Case (Mandatory)

  **Case Description:** An amateur logician has, for years, kept a private record of her own verdicts on a tightly defined class of puzzles — call them star puzzles. The record was kept conscientiously and she has no reason to think it inaccurate; it shows that she has been wrong on roughly 80 percent of star puzzles, while feeling at the time just as confident as she does now. Today she is presented with a new star puzzle. She works it, checks her solution three times by independent routes, and can articulate no flaw in it; yet the solution has the surface character that her ledger says has almost always marked her failures, and she has no independent check on the answer.

  **Question:** What does rationality permit or require of her regarding the puzzle's answer?

  | Camp | Prediction | Feature Doing the Work |
  | :--- | :--- | :--- |
  | **Requirement** | **Rationality Requires Suspension.** She is rationally required to suspend judgment (or reduce confidence below the threshold for belief). | **The Specific Higher-Order Defeater.** The ledger provides specific higher-order evidence that her first-order seeming on *this type* of puzzle is unreliable. To believe the solution is to believe *P* while believing her evidence (which includes the ledger) does not support *P*. |
  | **Permission** | **Rationality Permits Belief.** She is rationally permitted to maintain belief in her solution (perhaps with acknowledged uncertainty). | **The Intact First-Order Derivation.** The three independent checks constitute strong first-order evidence that remains undefeated. The ledger is general statistical evidence that does not negate the specific logical derivation she currently grasps. |

  ### Crux 2: The Transparency of First-Order Evidence

  **Case Description:** A subject looks at a wall that appears vividly red. She has excellent vision and lighting is normal. Suddenly, a trusted friend tells her that the lights are red (higher-order evidence). She looks again, very closely, and the wall still appears vividly red. She knows her friend is usually reliable, but she also knows her own vision is usually reliable.

  **Question:** Can first-order evidence ever be "transparent" or vivid enough to rationally outweigh higher-order evidence directed against it?

  | Camp | Prediction | Feature Doing the Work |
  | :--- | :--- | :--- |
  | **Requirement** | **No.** If she believes her friend's testimony, she must discount her visual experience. | **The Defeat Condition.** Once higher-order evidence calls the reliability of the faculty into question, the first-order output loses its justificatory power. Vividness does not restore reliability. |
  | **Permission** | **Yes.** She may rationally trust her vision over the testimony in this specific instance. | **The Weight of Perception.** Direct perceptual evidence can be weightier than testimonial higher-order evidence. The subject is permitted to weigh the evidence and find the first-order evidence heavier. |

  ### Crux 3: Normative Conflict

  **Argument/Question:** Can the prohibition on akrasia and the requirement to respond to one's evidence come into genuine conflict? If they can, which norm is master?

  **Case Description:** A theoretical scenario is constructed where the total first-order evidence overwhelmingly supports *P*, but the total higher-order evidence overwhelmingly supports "My evidence does not support *P*."

  **Question:** Is there a possible case where following the evidence *requires* akrasia?

  | Camp | Prediction | Feature Doing the Work |
  | :--- | :--- | :--- |
  | **Requirement** | **No Conflict Exists.** In any such case, the subject is not truly "following the evidence." | **The Constitutive Norm.** The requirement to align belief with one's view of evidence is constitutive of rationality. If a norm seems to demand akrasia, that norm is misapplied. |
  | **Permission** | **Conflict Exists; Evidence Wins.** There are cases where rationality requires akrasia. | **The Truth-Tracking Norm.** The primary goal of belief is truth. If following the evidence leads to akrasia, so be it. The prohibition on akrasia is a heuristic, not an absolute constraint. |

  ***

  **Commitment:** We sign this document acknowledging that if future analysis or consensus verdicts on these cases contradict our recorded predictions, we are committed to revising our respective theories accordingly.
