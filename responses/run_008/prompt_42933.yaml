answer: |-
  ### Part 1: Mapping the Terrain

  You are running into the friction between **logic** (what can be true in the world) and **pragmatics** (what makes sense to say out loud). In philosophy, this is Moore's Paradox. The classic formulation is: *"It is raining, but I don't believe it is."* Logically, this is possible. It can be raining while you are ignorant of it. But pragmatically, it is insane. Why? Because to assert "It is raining" is to offer your belief as a guarantee. To immediately revoke that guarantee ("but I don't believe it") cancels the transaction. It tells the listener, "I am asking you to trust me, but I am telling you not to trust me."

  In a novel, you are not dealing with a single speaker making assertions to a listener. You are dealing with layers: the author, the narrator, the narrated self, and the reader. The "error" your editor sees is a pragmatic crash. The "feature" you intend is a psychological x-ray.

  Here is what the philosophy distills to for a novelist:

  1.  **Assertion vs. Report:** When a narrator says "It is raining," they are asserting a fact. When they say "I believe it is raining," they are reporting a mental state. When they combine them negatively ("It is raining but I don't believe it"), they are asserting a fact while denying the mental state required to know that fact. In **present tense**, this reads as a break in the mind *now*. In **past tense**, it reads as a report on a break in the mind *then*. The time gap legitimizes the contradiction because the older narrator has the distance to analyze the younger narrator's confusion.
  2.  **The Cost of Fracture:** A sentence that triggers this paradox burns cognitive fuel. The reader stops moving through the plot and starts analyzing the speaker. If you want the reader to flow, this is a bug. If you want the reader to pause and inspect the psyche, this is a feature. But it is always expensive. It signals instability.
  3.  **Free Indirect Discourse (FID):** This is the trickiest zone. FID is ventriloquism. The narrator speaks *through* the character. If the narration says, "Marcus believed it had stopped," that is the narrator reporting on Marcus. No paradox. If the narration slides into Marcus's head—"The rain had stopped, he was sure, though the water soaked his shoes"—the paradox lives inside the consciousness. The procedure must distinguish between the narrator *watching* the character and the narrator *inhabiting* the character.
  4.  **The Diachronic Move (Your Favorite Trick):** Asserting $p$ now and believing not-$p$ later without comment. This works only if the reader trusts the text enough to notice the inconsistency but trusts the narrator enough to keep listening. If the gap is too wide, it looks like a continuity error. If the gap is too narrow, it looks like a typo. It requires a "Goldilocks zone" of proximity and salience.

  ***

  ### Part 2: The Procedure (The Unreliable Narrator's Stress Test)

  **Time required:** 10 minutes per flagged sentence.
  **Goal:** Determine if the sentence is (A) Invisible/Safe, (B) Costly/Signal, or (C) Broken/Error.

  **Instructions:** Take the sentence your editor flagged (or that feels "off"). Run it through these four questions in order. Write down the answer. If you hit a "Stop" command, follow it.

  #### Question 1: The Tense Check
  **Is the narrator speaking about *now* (present tense) or *then* (past/retrospective)?**

  *   **If Then (Retrospective):** The sentence is likely **(A) Fine**. A older narrator can accurately report that their younger self was confused.
      *   *Example:* "I loved him, though I didn't believe I did." (This is a coherent memory of self-deception).
      *   *Action:* Keep it. Ensure the voice sounds reflective, not immediate.
  *   **If Now (Present Tense):** The sentence is **(B) Costly** or **(C) Broken**. You cannot coherently assert a fact about your current reality while denying you hold the belief for that fact.
      *   *Action:* Proceed to Question 2.

  #### Question 2: The Voice Check (Crucial for Third Person/FID)
  **Who is "speaking" this thought? Is it the Narrator describing the Character, or the Character thinking it?**

  *   **If Narrator describing Character:** (e.g., "Marcus believed it had stopped, though the rain fell.")
      *   **Verdict:** **(A) Fine**. The narrator is omniscient or observant. They see the rain; they see Marcus's error. No paradox.
      *   *Action:* Keep it.
  *   **If Character thinking it (FID):** (e.g., "The rain fell. It had stopped, Marcus was sure.")
      *   **Verdict:** **(B) Costly**. This places the reader inside a fractured mind.
      *   *Action:* Proceed to Question 3.

  #### Question 3: The Intent Check
  **Do you want the reader to stop and notice this contradiction *immediately*?**

  *   **No (I want them to keep reading):**
      *   **Verdict:** **(C) Broken**. If you don't want them to notice, they will just think you made a mistake. The friction is too high to be invisible.
      *   *Action:* Rewrite. Either make it a full belief report ("I felt like I loved her, though I wasn't sure") or a full assertion ("I loved her").
  *   **Yes (I want them to feel the crack):**
      *   **Verdict:** **(B) Fine-but-Costly**. This signals unreliability, mania, or dissociation.
      *   *Action:* Keep it, but check the surrounding context. Is there enough emotional heat to justify the fracture? If the scene is calm, this reads like an error. If the scene is high-stress, it reads like psychology.

  #### Question 4: The "Favorite Move" Defense (Diachronic Consistency)
  **Use this ONLY if you are asserting $p$ on page 10 and reporting belief in not-$p$ on page 12.**

  **Ask these three sub-questions:**
  1.  **Proximity:** Are the two statements within 5 pages of each other?
      *   *If No:* It reads as a continuity error. **(C) Broken**.
      *   *If Yes:* Proceed.
  2.  **Salience:** Is the fact ($p$) important enough that the reader will remember it from the first statement?
      *   *If No:* The reader won't catch the clue. **(C) Broken** (wasted effort).
      *   *If Yes:* Proceed.
  3.  **Resolution:** Do you plan to resolve this later, or is the narrator *never* supposed to know they contradicted themselves?
      *   *If Never:* You need a very strong reason (e.g., the narrator is delusional and the book ends that way).
      *   *If Later:* **(B) Fine-but-Costly**. This is a plant for a reveal.

  ***

  ### Part 3: Worked Examples

  Here is how the procedure handles your specific cases.

  **Case 1: Present Tense**
  *Sentence:* "I love her, but I don't believe I do."
  *   **Q1 (Tense):** Now (Present). -> **Go to Q2.**
  *   **Q2 (Voice):** Narrator asserting. -> **Go to Q3.**
  *   **Q3 (Intent):** Do you want the reader to stop?
      *   *If Yes:* **(B) Costly**. This signals a narrator currently undergoing a psychotic break or extreme dissociation. The cost is high: the reader stops trusting the narrator's grip on reality *immediately*.
      *   *If No:* **(C) Broken**. Rewrite to: "I tell myself I love her, but I don't feel it."
  *   *Verdict:* Keep only if the character is supposed to be unraveling *right now*.

  **Case 2: Retrospective First Person**
  *Sentence:* "My father never once lied to me, but I didn't believe a word he said."
  *   **Q1 (Tense):** Then (Retrospective).
  *   *Verdict:* **(A) Fine**. The older narrator is asserting the truth of the father's honesty while reporting the past self's disbelief. This is standard memoir logic. No paradox. Your editor is wrong here; show them the tense distinction.

  **Case 3: Close Third (FID)**
  *Sentence:* "The rain kept on and Marcus believed it had stopped."
  *   **Q2 (Voice):** This is the Narrator describing Marcus. ("Marcus believed...")
  *   *Verdict:* **(A) Fine**. The narrator knows it's raining. The narrator knows Marcus is wrong. There is no contradiction in the *narrator's* voice.
  *   *Adjustment:* If you want the paradox (the fracture), you need to slide deeper into FID: "The rain kept on. It had stopped, Marcus was sure." Now the narration briefly adopts Marcus's false belief as fact before correcting it. That is **(B) Costly**, signaling Marcus's detachment from reality.

  ***

  ### Part 4: Defending Your "Favorite Move"

  You asked for the honest case on asserting $p$ early and believing not-$p$ later without comment. Your editor calls it a continuity error. You call it characterization.

  **The Procedure's Verdict:** This is **(B) Fine-but-Costly**, *but only if three conditions are met.* If these conditions are not met, your editor is right, and it is a bug.

  **Condition 1: The Trust Window.**
  The reader must trust the narrator enough to accept the first assertion as truth, but not so much that they assume the narrator is infallible. If the narrator is already established as a liar, the second statement just confirms they are a liar (boring). If the narrator is established as rock-solid, the second statement looks like you forgot what you wrote (error). You need the narrator to be *mostly* reliable but *specifically* blind about this topic.

  **Condition 2: The Echo.**
  The second statement must use similar phrasing to the first.
  *   *Page 1:* "The house was empty."
  *   *Page 3:* "I didn't believe the house was empty."
  *   *Why:* This creates a textual rhyme. It signals to the reader's subconscious, "Connect these two dots." If the phrasing is different ("The house was empty" / "I felt someone was home"), the reader misses the contradiction.

  **Condition 3: The Payoff.**
  You cannot leave this hanging forever unless the book is about the impossibility of knowledge. If you do this, there must be a moment later where the narrator (or the reader) realizes the gap. If the narrator never realizes they contradicted themselves, the reader will eventually assume *you* (the author) contradicted yourself. The narrator's blindness must be the point, not an accident.

  **The Pitch to Your Editor:**
  Do not say "It's Moore's Paradox." Say: "This is a deliberate marker of the narrator's dissociation. The proximity (2 pages) is tight enough to be noticed by a close reader but wide enough to feel like a natural thought progression. It is the first crack in their reliability that pays off in Chapter 10."

  ***

  ### Part 5: Where This Procedure Fails (Limitations)

  I need to be upfront about where this tool will misfire, so you don't blindly trust it.

  1.  **Rhythm and Music:** The procedure treats sentences as logic puzzles. Sometimes a sentence works because it sounds good, even if it breaks the rules. If a Moore-paradoxical sentence has a beautiful rhythm that captures the character's voice, **ignore the procedure.** The ear trumps the logic.
  2.  **Cumulative Effect:** One paradoxical sentence is a signal. Five in a chapter is noise. The procedure checks sentences in isolation. It cannot tell you if you have overused the device. You have to read the whole chapter to feel if the "cost" has become too high.
  3.  **Genre Expectations:** In a psychological thriller, readers expect unreliability. In a realist drama, they expect coherence. The procedure assumes a literary context. If you are writing in a genre that demands high transparency, the "Cost" rating should be doubled.
  4.  **The "Uncanny Valley" of Reliability:** There is a zone where a narrator is not quite lying but not quite telling the truth. The procedure forces a binary (Fine vs. Costly). Sometimes the power lies in the ambiguity. If the procedure says "Broken" but your gut says "Ambiguous," trust the gut. The procedure is for catching slips, not killing ghosts.

  **Final Advice:**
  Your MFA didn't give you this because MFA programs often treat "voice" as magic. It isn't. It's mechanics. You are building a machine that simulates a human mind. Sometimes, to simulate a broken mind, you have to break the machine's grammar. Just make sure you're the one holding the wrench, not the reader.
