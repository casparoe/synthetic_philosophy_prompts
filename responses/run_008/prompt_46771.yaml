  2.  **Additive inclusion:** This remains deeply Eurocentric because it treats non-European civilizations as satellites orbiting a European timeline, preserving Europe as the protagonist and others as supporting cast.
  3.  **Big history:** This ranks in the middle because while it demotes Europe to a speck, it smuggles in a Western scientific epistemology as a universal "view from nowhere," masking a specific cultural standpoint behind the authority of physics.
  4.  **Divergence analysis:** This is less Eurocentric because it treats European dominance as a late, contingent material outcome rather than a cultural destiny, though it still keeps the "Rise of the West" as the central puzzle to be solved.
  5.  **Inversion:** This is the least Eurocentric because it honestly relocates the center of gravity to where the demographic and economic weight actually resided (Asia/Indian Ocean) without pretending to a false neutrality.

  **Recommended Strategy**

  You should build your lecture series around **Strategy 5 (Big History)**.

  This is the only strategy that leverages your unique authority as a geophysicist to offer a narrative a conventional historian cannot, specifically by grounding human events in the earth-system processes you know intimately. The cost you must accept is that you cannot claim this scale confers neutrality; you must explicitly teach that "Earth System History" is itself a chosen frame that privileges material flows and energy capture over human meaning, and you must renounce the claim to a "view from nowhere" as part of the curriculum.

  **Verdict on the Framing Question**

  A history told "from everywhere at once" is an **incoherent ideal**.

  Narrative requires selection, and selection requires a standpoint; claiming to have none is merely hiding the standpoint rather than transcending it. The defensible substitute ideal is **"Acknowledged Situatedness,"** where the historian explicitly states their frame of reference (e.g., "a view from the geosphere" or "a view from the Indian Ocean") and accepts the distortions that come with it as the price of having a view at all.
