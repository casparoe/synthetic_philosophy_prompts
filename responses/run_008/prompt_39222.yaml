      *   *Step (4) - The Bargaining Crash:* This is the core contention. The friend argues rational agents *must* demand the maximum because it's costless to try. This is essentially the **Nash Demand Game** played with committed agents.
      *   *Step (5) - The Conclusion:* Transparency makes things worse.

  3.  **Identify the Flaw:**
      *   The friend is conflating *one-shot commitment* with *rational selection of commitment*.
      *   In Step (1), the "Mirror" strategy works because it creates a *correlation* between moves. My move depends on yours.
      *   In Step (4), the friend assumes agents pick demands *independently* and *extremally*. Why would a rational agent pick $9?
