      *   However, a deeper rejection of (3) involves **verification costs** and **oracle problems**. (Can I really prove your code does what it says? Halting problem?). But the friend already hand-waved the halting problem in (1).
      *   Better to focus on the **Meta-Game**. The cost isn't monetary; the cost is **flexibility in the selection phase**. By committing to a strategy *selection* algorithm, you restrict your payoff.

