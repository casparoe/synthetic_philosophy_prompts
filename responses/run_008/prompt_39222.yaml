      *   The friend's logic in (4) ("asking for $9 costs you nothing") is false. It costs you the *probability of a deal*.
      *   This is the **Commitment Paradox** (Schelling, 1960). Schelling argued commitment *helps* bargaining (by tying hands). The friend argues it *hurts* (by causing deadlock).
