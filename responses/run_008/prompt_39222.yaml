      *   If both agents are identical rational code (like the Mirror bots), they shouldn't diverge to $9/$9. They should converge on the Schelling Point ($5/$5). Why? Because if I run the code "Demand $9", and you are *me* (or similar rational code), you will also run "Demand $9". We get $0. If I run "Demand $5", and you are *me*, you run "Demand $5". We get $5. A rational agent optimizing for payoff will choose the code that leads to $5, not $0.
