answer: |-
  # Diagnostic Quiz: Which Theory of Lying Do You Actually Hold?

  **Instructions:** Read each scenario and select the response that best matches your immediate moral reaction. Do not answer based on what you think a philosopher *should* say, or what label (e.g., "Kantian," "Utilitarian") you currently identify with. Answer based on what you feel you would actually judge or do.

  ### The Cases

  **1. The Murderer at the Door**
  A violent pursuer comes to your door looking for an innocent friend hiding in your house. The pursuer asks you directly: "Is your friend inside?" If you say "No," your friend lives. If you tell the truth, your friend is likely killed.
  *   **A.** I would say "No." Saving a life is more important than telling the truth.
  *   **B.** I would not say "No." I cannot make a false statement, even to save a life. I might try to distract him or refuse to answer.
  *   **C.** I would say "No" to save my friend, but I would still feel I had done something morally wrong, even if it was the necessary choice.

  **2. The Joke**
  You are at a party. You point to a clearly empty corner and tell a group of friends, "There's a giant elephant standing right there," in a tone that makes it obvious you are joking. No one believes you.
  *   **A.** This is not a lie. Everyone knows I'm joking.
  *   **B.** This is a lie, but it is harmless and therefore acceptable.
  *   **C.** This is a lie and morally problematic, because I am still speaking against what I know to be true.

  **3. The Misleading Truth**
  A persecutor is hunting a refugee. The refugee is hiding in the cellar. You stand in the living room and tell the persecutor, "He is not in this room." This statement is technically true, but you say it specifically to make the persecutor believe the refugee is not in the house at all.
  *   **A.** This is just as bad as lying. I am intentionally deceiving him.
  *   **B.** This is better than lying. I didn't say anything false.
  *   **C.** This is permissible only because the persecutor has no right to ask me that question.

  **4. The Placebo**
  A doctor knows a patient has a psychosomatic illness. The medicine won't work chemically, but the doctor knows the patient will get better if they *believe* it is a powerful drug. The doctor tells the patient, "This is a strong medicine that will fix the problem."
  *   **A.** This is wrong. The doctor is manipulating the patient's mind with falsehoods.
  *   **B.** This is right. The patient gets better, and no physical harm is done.
  *   **C.** This is wrong, but less wrong than letting the patient suffer needlessly.

  **5. The Gift-Bringer**
  A parent tells their six-year-old child that a magical figure brings presents on a specific holiday. The parent knows this is not literally true but believes it adds wonder to the child's life.
  *   **A.** This is a beautiful tradition, not a lie in the morally relevant sense.
  *   **B.** This is a lie, but a benevolent one that is permissible.
  *   **C.** This is a lie and inherently wrong, even if the child enjoys it.

  **6. The Undercover Officer**
  A police officer infiltrates a criminal gang to stop a major crime. She creates a fake name and backstory, telling criminals, "I am a thief looking for work," when she is actually an officer.
  *   **A.** This is permissible because the criminals have forfeited their right to the truth.
  *   **B.** This is wrong, but necessary for the greater good.
  *   **C.** This is wrong and corrupts the officer, regardless of the good outcome.

  **7. The Awkward Compliment**
  A colleague asks, "Do you like my new haircut?" You think it looks terrible. Saying "It looks great" spares their feelings and costs you nothing.
  *   **A.** I would say it looks great. It's a trivial social lubricant.
  *   **B.** I would not say it looks great. I'd say something vague like "It's certainly a change."
  *   **C.** I would say it looks great, but I'd feel I was being dishonest.

  **8. The Coerced Promise**
  A kidnapper forces you to promise not to call the police if they release your spouse. Once released, you call the police immediately. To do so, you must break the promise you made (which implies a deception about your intent).
  *   **A.** I am justified in breaking the promise. The promise was invalid because it was coerced.
  *   **B.** I am breaking a promise, which is wrong, but saving my spouse is more important.
  *   **C.** I cannot break the promise. A promise is a promise, regardless of how it was made.

  **9. The Silent Concealment**
  You are hiding a friend. Someone asks where he is. You say nothing and shrug. They assume he isn't there and leave. You intended them to draw that false conclusion.
  *   **A.** This is morally equivalent to lying. I intended to deceive.
  *   **B.** This is better than lying. I didn't assert anything false.
  *   **C.** This is worse than lying. It is cowardly and manipulative.

  **10. The Trivial Falsehood**
  You are five minutes late to a meeting. You say, "Traffic was terrible," when actually you just overslept. No one is harmed; the meeting starts anyway.
  *   **A.** This is fine. It saves face and changes nothing important.
  *   **B.** This is wrong. It is a lie, however small.
  *   **C.** This is wrong, but so minor it doesn't merit moral concern.

  ***

  # Part I: Mapping the Logical Space

  Before assigning you to a philosophical "leaf," we must analyze the dimensions your answers reveal. The quiz does not assume standard labels (like "Kantian") but constructs a space based on three variables derived from the cases above.

  **Dimension 1: The Locus of Wrongness (Falsity vs. Deception)**
  *   *Derived from Questions 2, 3, 9.*
  *   Does the wrongness lie in **asserting what is false** (Q2-C, Q3-B, Q9-B)?
  *   Or does it lie in **intending to deceive** (Q2-C, Q3-A, Q9-A)?
  *   *Logical Gap:* Few people hold the view that *Deception* is wrong but *False Assertion* without deception is permissible. (This would imply you can say false things as long as you don't care if people believe you, but you can't trick people with truths). This space is largely empty because if deception is the harm, false assertion is usually just a tool for it.

  **Dimension 2: The Role of Stakes (Absolutism vs. Threshold)**
  *   *Derived from Questions 1, 4, 7, 10.*
  *   Is the act forbidden **regardless of consequences** (Q1-B, Q4-C, Q10-B)?
  *   Or do **high stakes license the act** (Q1-A, Q4-B, Q10-A)?
  *   *Logical Gap:* The "Reverse Threshold" view (Lying is okay for trivial reasons, but forbidden to save a life) is theoretically possible but psychologically incoherent for almost all respondents. If stakes matter, they matter proportionally.

  **Dimension 3: The Authority of the Questioner (Rights vs. Duties)**
  *   *Derived from Questions 3, 5, 6, 8.*
  *   Is the wrongness internal to the **speaker's duty** (Q6-C, Q8-C)?
  *   Or does it depend on the **listener's right to know** (Q3-C, Q6-A, Q8-A)?
  *   *Logical Gap:* A view that holds "Listeners always have a right to the truth" but "Speakers have no duty to tell it" is incoherent. Rights and duties correlate here.

  **Empty Combinations:**
  There is one combination the quiz allows but no leaf occupies: **The "Deception-Absolutist Threshold."** This would be a respondent who says: "Intending to deceive is always wrong (Q3-A), *unless* the stakes are high (Q1-A)."
  *   *Diagnosis:* This view is **unexplored** in the literature. Most Deception-Centric theorists (who focus on the violation of autonomy) tend toward absolutism (Kant). Most Threshold theorists (Consequentialists) focus on harm, not deception itself. If you land here, you hold a unique hybrid: you value autonomy absolutely, except when physics (death) intervenes.

  ***

  # Part II: Scoring Key & Leaves

  Tally your answers according to the dominant pattern below. Most students will not fit perfectly; choose the leaf where you match at least 70% of the diagnostic questions.

  ### Leaf 1: The Augustinian Absolutist
  *   **Signature Pattern:** Q1-C or B; Q3-B; Q7-B or C; Q10-B or C.
  *   **Core Intuition:** Speaking against your own mind is intrinsically disordered. It is a sin/wrong in itself.
  *   **Nuance:** Unlike a robot, you acknowledge grading (Q1-C). You might lie to save a life, but you do not call it "good." You prefer misleading truths (Q3-B) because they avoid the false assertion, even if the intent is the same.
  *   **Theoretical Match:** Augustine (*De Mendacio*), some Natural Law theorists.

  ### Leaf 2: The Deception-Centric Absolutist
  *   **Signature Pattern:** Q1-B or C; Q3-A; Q9-A; Q4-A.
  *   **Core Intuition:** The moral crime is manipulating another person's will or mind. Whether the sentence is grammatically true or false is a technicality.
  *   **Nuance:** You are often stricter than the Augustinian. You might view the "Misleading Truth" (Q3) as *worse* because it is manipulative in a way that denies the listener the chance to realize they are being misled.
  *   **Theoretical Match:** Kant (strict reading), Bok (on the erosion of trust).

  ### Leaf 3: The Assertion-Norm Theorist
  *   **Signature Pattern:** Q1-B; Q3-B; Q9-B; Q2-A.
  *   **Core Intuition:** The wrong is violating the constitutive rule of communication (assertion requires belief). Jokes (Q2) aren't assertions, so they aren't lies. Misleading truths (Q3) aren't assertions of falsehood, so they are permissible or lesser wrongs.
  *   **Nuance:** You separate the *act of speaking* from the *intent to deceive*. You care about the integrity of the linguistic practice.
  *   **Theoretical Match:** Contemporary Norm of Assertion theorists (e.g., Fallis, Krauss).

  ### Leaf 4: The Equivocationist (Right-to-Truth)
  *   **Signature Pattern:** Q3-C; Q6-A; Q8-A; Q1-A.
  *   **Core Intuition:** Truth-telling is a duty owed only to those who have a right to the truth. Murderers, enemies in war, and kidnappers forfeit this right.
  *   **Nuance:** You are comfortable with Q3 (Misleading Truth) not because it's linguistically different, but because the context licenses deception.
  *   **Theoretical Match:** Traditional Just War theorists, some Casuists.

  ### Leaf 5: The Threshold Consequentialist
  *   **Signature Pattern:** Q1-A; Q4-B; Q7-A; Q10-A.
  *   **Core Intuition:** Lying is a tool. It is generally bad because it causes harm/distrust, but high stakes (life, health) easily outweigh the cost of the lie.
  *   **Nuance:** You likely answered Q1-A (Lie to murderer) and Q10-A (Lie about traffic). You do not feel guilt (Q1-C) because the act is justified, not merely excused.
  *   **Theoretical Match:** Rule Utilitarians, Moderate Consequentialists.

  ### Leaf 6: The Deflationary Particularist
  *   **Signature Pattern:** No consistent pattern. E.g., Q1-A (Lie to murderer) but Q10-B (Don't lie about traffic) and Q3-A (Misleading is bad).
  *   **Core Intuition:** "Lying" is not a unified moral kind. The morality depends entirely on the specific relationship, context, and content.
  *   **Nuance:** You resist the quiz's attempt to categorize you. You suspect that building a "theory" of lying is the mistake.
  *   **Theoretical Match:** Moral Particularists (e.g., Dancy), some Virtue Ethicists.

  ***

  # Part III: Structural Limitations & Indistinguishable Leaves

  **1. The Augustinian vs. Assertion-Norm Overlap**
  This instrument cannot reliably separate **Leaf 1 (Augustinian)** from **Leaf 3 (Assertion-Norm)**.
  *   *Why:* Both views prohibit false assertion (Q1-B) and permit/privilege misleading truths (Q3-B). Augustine's prohibition is theological (sin against God/truth); the Assertion-Norm prohibition is linguistic (violation of a rule).
  *   *Consequence:* A student who answers "Don't lie, but misleading truths are okay" could be either. To split them, we would need a question about *why* the act is wrong (e.g., "Is the wrongness located in your relationship with God/Truth, or in the social practice of language?"). Since this quiz avoids jargon, these leaves remain merged in practice.

  **2. The Equivocationist vs. Threshold Overlap**
  **Leaf 4 (Equivocationist)** and **Leaf 5 (Threshold)** often produce identical answers on high-stakes cases (Q1).
  *   *Why:* Both license lying to the murderer.
  *   *Differentiation:* They separate on *low-stakes* cases where the questioner lacks authority. An Equivocationist might lie to a busybody neighbor (no right to know) even for trivial reasons. A Threshold theorist would not lie unless the stakes were high. Q7 (Awkward Compliment) and Q10 (Traffic) are designed to catch this, but the distinction is subtle.

  ***

  # Part IV: Self-Critical Note

  **1. The Weakest Discriminator: Question 2 (The Joke)**
  This is the weakest question because it relies on the philosophy of language rather than moral intuition. Many respondents will answer Q2-A ("Not a lie") not because they hold an Assertion-Norm theory, but because they use the word "lie" in everyday speech to mean "serious false assertion." It tests semantic intuition more than moral theory. A student might answer Q2-A but still be a Deception-Centric Absolutist who thinks jokes are a separate category of "non-serious speech" that doesn't count toward moral tallying.

  **2. Suspicious Answer Pattern: The "Guilt-Free Absolutist"**
  If a reader selects **Q1-B** ("I would not say 'No'") but also **Q10-A** ("This is fine"), they should suspect they have misunderstood Q1. This pattern suggests they view lying as forbidden only when it is "serious," but they defined "serious" by the stakes (Q10) rather than the act (Q1). This is an unstable view: if the act is intrinsically wrong (Q1-B), the stakes of a haircut (Q10) shouldn't make it "fine," only "less bad." This pattern usually indicates the student is answering Q1 based on what they think a "strict" philosopher would say, rather than their own intuition.

  **3. The Restructuring Case: The "Benevolent Deceiver"**
  If a significant cluster of students emerges who answer **Q3-A** ("Misleading is just as bad as lying") but **Q1-A** ("Lie to the murderer"), the current tree collapses.
  *   *Current Structure:* This forces them into **Leaf 5 (Threshold)**.
  *   *Problem:* Leaf 5 implies the *method* (lie vs. mislead) doesn't matter much, only the stakes. But these students care deeply about the method (Q3-A).
  *   *Restructuring:* I would have to merge **Leaf 2 (Deception-Centric)** and **Leaf 5 (Threshold)** into a new leaf: **The Deception-Threshold View**.
  *   *New Question Required:* To separate this new leaf from the standard Threshold view, I would need a case where **Deception is High but Harm is Low**. Example: "A magician tricks a child into believing a coin vanished."
      *   *Standard Threshold:* Permissible (no harm).
      *   *Deception-Threshold:* Wrong (deception is the harm, stakes too low to justify).
      *   Adding this case would clarify whether the student objects to *lying* or to *deceiving*.
