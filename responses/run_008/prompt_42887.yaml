      *   **Anumāna (Inference):** Based on a pervasion relation (*vyāpti*) between a mark (*hetu*) and a property to be proved (*sādhya*).
      *   **Truth Condition:** *Yathārthatva* (correspondence/conformity to reality).
      *   **Extrinsic Validity (Parataḥ Prāmāṇya):** Nyāya generally holds that validity is intrinsic to the *cause* but needs extrinsic confirmation in cases of doubt. However, for *śabda*, the reliability of the speaker is the crucial causal factor.
