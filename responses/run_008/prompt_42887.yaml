          *   *Extrapolation:* Gaṅgeśa would use the LLM to *prove* the Nyāya distinction. Since the LLM lacks intention/knowledge, it's not *śabda*. Therefore, any truth gained is via inference on the tool's reliability.

      *   **Thread 4: Saṃśaya and Tarka (Conflict).**
