  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, would Gaṅgeśa call it *anumāna*? Strictly, *anumāna* requires *vyāpti* (invariable concomitance). LLMs are probabilistic. Nyāya deals with *vyabhicāra* (deviation). If there is deviation, it's not a valid *hetu*.
