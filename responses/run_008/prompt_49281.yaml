answer: |-
  This is a fantastic argument. Your roommate has essentially reconstructed Jaegwon Kim's **Causal Exclusion Argument**, which is one of the most famous and difficult problems in contemporary metaphysics. Usually, this is deployed against non-reductive physicalism about the *mind*, but she has correctly generalized it to chemistry, biology, and the special sciences.

  She is right that this is a dilemma, but she is wrong that the reductionist loses. The slip is indeed where you suspected: **Step (3).**

  Here is how to break it down, which step to reject, the cost of that rejection, and how to save Temperature from the fate of Phlogiston.

  ### 1. The Diagnosis: The Zero-Sum Fallacy
  Step (3) says: *If the base can entirely take over M's causal work like that, then M is doing nothing of its own.*

  This relies on a hidden premise: **Causation is a zero-sum game.** It assumes that causal power is like a limited resource (say, a bucket of water). If the micro-particles ($B$) pour out the water to cause the effect, there is none left for the macro-property ($M$) to pour.

  This is false. In standard physicalist metaphysics, $M$ and $B$ are not **competitors**; they are **constitutive**.

  If Temperature ($M$) *just is* Mean Kinetic Energy ($B$), then when $B$ causes the gas to expand, it is not the case that $B$ did the work and $M$ sat idle. It is that **$M$'s causing the expansion is identical to $B$'s causing the expansion.** There is only one causal event here, described at two different levels of granularity.

  By accepting (3), your roommate is forcing you to treat $M$ and $B$ as distinct entities (Dualism). But a reductionist claims they are *not* distinct in the relevant sense. Therefore, you should **reject (3).**

  ### 2. The Cost of Rejecting (3)
  Rejecting (3) saves the special sciences, but it comes with a metaphysical price tag. You have to accept **Causal Compatibilism** (or a specific version of the Identity Theory).

  **The Cost:** You must admit that higher-level properties do not add any *new* causal "oomph" to the universe.
  *   You cannot say that Temperature pushes the molecules *and* the molecules push each other.
  *   You must say that Temperature *is* the molecules moving, and that motion is what does the pushing.
  *   The macro-level is **ontologically dependent** on the micro-level. If the micro-story is complete, the macro-story doesn't *add* to the causal history; it *summarizes* it.

  Some people find this threatening because it makes the special sciences look like mere "bookkeeping" rather than deep reality. But most philosophers of science accept this: biology is real, but it doesn't violate physics.

  ### 3. Saving (6): Phlogiston vs. Temperature
  You asked for an account of why Phlogiston was eliminated but Temperature was vindicated, given that the "base story is complete" for both. This is the distinction between **Eliminativism** and **Reductive Realism**.

  The difference lies in **Reference**, not just causal completeness.

  *   **Phlogiston (Elimination):** The theory of phlogiston posited a *substance* that was released during combustion. When we found the base story (oxidation/electron transfer), we discovered that **nothing in the base story corresponded to phlogiston.** There was no stuff being released; stuff was being added (oxygen). The term "phlogiston" failed to refer. It was a mistake.
      *   *Verdict:* The base story showed the higher-level entity **did not exist.**

  *   **Temperature (Reduction):** The concept of temperature referred to "the thing that makes things feel hot and expand gases." When we found the base story (mean molecular kinetic energy), we discovered that **this base state *is* what makes things feel hot and expand gases.** The term "temperature" successfully referred to a real pattern in the base.
      *   *Verdict:* The base story showed the higher-level entity **is identical to** a base entity.

  **The Rule of Thumb:**
  *   If the reduction shows the higher-level theory was **wrong about the mechanism**, you eliminate the term (Phlogiston, Witches, Vital Force).
  *   If the reduction shows the higher-level theory was **right about the phenomenon but vague on the constitution**, you retain the term (Temperature, Water, Genes, Lightning).

  ### 4. How to Reply to Your Roommate
  Here is a script you can adapt for your next debate:

  > "Your argument works perfectly if we assume $M$ and $B$ are distinct competitors fighting over who gets to cause the effect. But reductionism claims $M$ isn't distinct from $B$; it's constituted by it.
  >
  > I'm rejecting **(3)**. It commits the **Zero-Sum Fallacy** of causation. If Temperature *is* Kinetic Energy, then Kinetic Energy causing expansion *just is* Temperature causing expansion. There isn't double-counting; there's single-counting under two descriptions.
  >
  > Regarding Phlogiston: That was **reference failure**. We looked at the base and found nothing matching the description. With Temperature, it was **reference success**. We looked at the base and found exactly what the description picked out.
  >
  > So, Reduction doesn't eliminate the property; it eliminates the **mystery** of the property. We keep 'Temperature' because it successfully refers to a real pattern in the base. We drop 'Phlogiston' because it referred to nothing."

  ### 5. One Caveat (The "Promissory Note" Horn)
  Your roommate's conclusion (7) offers a second horn: *"Either no reduction is actually complete, so reductionism is just a promissory note."*

  You should be careful here. In fields like biology or psychology, "smooth" reduction (like Temperature = KE) is rare. Often, higher-level concepts (like "species" or "belief") are **multiply realizable**. A gene can be made of different DNA sequences; a belief can be realized in different neural states.

  In those cases, you can't say $M = B$. You have to say $M$ is *realized by* $B$. This makes Step (3) trickier. If $M$ can be realized by $B1$ or $B2$, is $M$ causally idle?
  *   **Defense:** Even with multiple realizability, $M$ is not idle. $M$ captures a **causal pattern** that $B$ misses. $B1$ and $B2$ are different physically, but they share a functional role ($M$). If you only look at the base, you miss the generalization.
  *   **Example:** "The computer crashed because of a memory leak." This is true regardless of whether the computer is made of silicon, vacuum tubes, or gears. The base story is different in each case, but the macro-explanation ("memory leak") captures the *invariant* cause.

  So, even if reduction isn't strict identity, the macro-property isn't idle—it's **indispensable for explanation**, even if the base is sufficient for the *physics*.

  ### Summary
  1.  **Reject Step (3).** Causation isn't a zero-sum competition between levels.
  2.  **Cost:** You must accept that macro-causation is grounded in/dependent on micro-causation, not independent of it.
  3.  **Phlogiston vs. Temperature:** Phlogiston was a failed reference (elimination); Temperature was a successful reference to a physical state (vindication).
  4.  **Result:** You keep (6). Science retains useful, referring terms even after we learn their physical basis.

  Your roommate has built a steel-man of the exclusion argument, but it breaks against the distinction between **Identity** (Temperature) and **Error** (Phlogiston).
