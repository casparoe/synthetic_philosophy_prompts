answer: |-
  1. You are standing on a glass skywalk high above the ground. You know intellectually that the glass is strong and safe, but your heart races, your palms sweat, and you feel terrified. Which statement best describes what is happening?
  (A) You are not truly afraid; true fear requires believing you are in danger, and you know you are safe.
  (B) You are truly afraid; fear can exist even when it contradicts what you know to be true.
  (C) You are not afraid, but your body is having a stress reaction that feels like fear.

  2. You watch a movie and weep when a main character dies. You know the character is fictional and no real person has died. Which statement best describes what is happening?
  (A) You are not truly sad; true sadness requires believing a real loss has occurred.
  (B) You are truly sad; the feeling is real even though the object of your sadness does not exist.
  (C) You are physically aroused by the music and images, but not emotionally sad.

  3. A person crosses the street to avoid a small, leashed dog. When asked, they say, "I know this dog is harmless and won't bite me," yet they still avoid it. Which statement best describes what is happening?
  (A) They are lying to themselves; they must secretly believe the dog is dangerous.
  (B) They truly believe the dog is harmless, but something other than belief drives their avoidance.
  (C) They do not have a belief about the dog at all; they are just reacting physically.

  4. After a spinal cord injury, a person loses the ability to feel bodily changes like heartbeat acceleration or stomach tightness. They report that they feel "less angry" than they did before the injury. Which statement best describes what is happening?
  (A) Their anger is genuinely weaker because the physical feeling is a necessary part of anger.
  (B) Their anger is the same strength; they just cannot feel the physical signs anymore.
  (C) They are confused; their anger is actually stronger because they are frustrated by the injury.

  5. During a public speech, a person's heart races and their hands shake, but they report "I feel nothing" and cannot identify any emotion they are experiencing. Which statement best describes what is happening?
  (A) They are experiencing an emotion because their body is reacting, even if they don't realize it.
  (B) They are not experiencing an emotion because they lack the conscious feeling or identification.
  (C) They are experiencing a physical exercise response, not an emotional one.

  6. A dog growls fiercely and bares its teeth when a stranger enters its yard. Does the dog feel anger?
  (A) No, because the dog cannot think thoughts like "this person is violating my rights."
  (B) Yes, because the dog reacts aggressively and appears to feel aroused.
  (C) No, because the dog does not have a language to name the emotion.

  7. Your heart races equally when you see a bear in the woods and when you see your romantic crush. Is the emotion the same in both cases?
  (A) Yes, the emotion is the same physical feeling; only the cause is different.
  (B) No, the fear and the excitement are fundamentally different experiences despite the similar heartbeat.
  (C) Yes, but we label them differently to suit the social situation.

  8. You survive a car accident where others died. You know logically it was not your fault, but you feel a heavy sense of guilt. Which statement best describes what is happening?
  (A) You are not truly feeling guilt; you are feeling sadness mistaken for guilt.
  (B) You are truly feeling guilt, even though you know you did nothing wrong.
  (C) You are feeling guilt because you secretly believe you could have done something differently.

  9. Someone intentionally insults you. You believe this correctly (they did insult you). However, you feel your anger is too intense and inappropriate for the situation. Which statement best describes what is happening?
  (A) If your belief about the insult is true, your anger is correct; it cannot be inappropriate.
  (B) Your belief can be true while your anger is still inappropriate or unfitting.
  (C) Your belief is actually false; you are misinterpreting the insult.

  10. You see a snake and freeze completely, unable to move or run away. Are you afraid?
  (A) No, fear requires an urge or readiness to act, and you are frozen.
  (B) Yes, you can feel fear even if you are physically unable to move.
  (C) No, fear requires running away; freezing is a different response.

  ***

  ### Scoring Key and Discussion

  **How to Score**
  Tally your answers according to the groups below. Most questions offer a primary distinction between theories. There is no single "correct" score; the goal is to reveal which cluster of intuitions you hold.

  **The Judgment (Cognitivist) Pattern**
  *   **Primary Answers:** 1(A), 2(A), 3(A), 6(A), 8(A), 9(A).
  *   **Secondary Answers:** 4(B), 5(B), 7(B), 10(B).
  *   **Interpretation:** You view emotions as tightly linked to evaluative beliefs or judgments. For you, if the belief is missing (fiction, animals) or contradicted (recalcitrant fear, survivor guilt), the emotion is not "real" or is a different state. You likely view bodily changes (Q4, Q5) as side effects rather than constituents of emotion.
  *   **Note on Recalcitrance:** If you chose 1(A), you have adopted the standard Judgment Theory solution to recalcitrant fear: deny that the feeling is truly "fear" if the judgment of danger is absent. This is a coherent position, though it requires explaining away common speech where we say "I know it's safe but I'm scared."

  **The Pure Feeling (Somatic/James-Lange) Pattern**
  *   **Primary Answers:** 4(A), 5(A), 7(A).
  *   **Secondary Answers:** 1(B), 2(B), 3(B), 6(B), 8(B), 9(B), 10(B).
  *   **Interpretation:** You view emotions as fundamentally rooted in bodily perception. If the body doesn't react, the emotion is diminished (Q4); if the body reacts, the emotion is present even without identification (Q5). You likely see different emotions with identical arousal as the same emotion (Q7).
  *   **Potential Tension:** If you chose 4(A) (Body necessary) but also 1(A) (Belief necessary), you hold a hybrid view (Somatic Cognitivism). This is a coherent but less common position that requires both bodily arousal and evaluative judgment to be present for emotion.

  **The Perceptual / Attitudinal Pattern**
  *   **Primary Answers:** 1(B), 2(B), 3(B), 6(B), 8(B), 9(B).
  *   **Secondary Answers:** 4(B), 5(B), 7(B), 10(B).
  *   **Interpretation:** You view emotions as experiences of value that can be accurate or inaccurate, independent of belief. This allows you to say fear is real even when you know you're safe (Q1), and guilt is real even when you know you're innocent (Q8). You distinguish emotions by their qualitative feel or intentional object, not just bodily arousal (Q7).
  *   **Normativity:** If you chose 9(B), you emphasize that emotions have a correctness condition (fittingness) that is distinct from truth.

  **The Motivational (Action-Readiness) Pattern**
  *   **Primary Answers:** 10(A).
  *   **Secondary Answers:** 3(B), 7(B).
  *   **Interpretation:** You view emotions as fundamentally about preparation for action. If there is no urge to act (freezing), there is no emotion (Q10). This view often aligns with Perceptual or Attitudinal views on other questions but diverges on the role of action.

  **Undetachable Positions: Perceptual vs. Attitudinal**
  This quiz cannot definitively separate **Perceptual Theory** (emotions as perceptions of value) from **Attitudinal Theory** (emotions as sui generis evaluative attitudes). Both positions predict the same answers on all ten questions: both allow for recalcitrant emotions (Q1), both validate fiction responses (Q2), both allow for unfitting emotions despite true beliefs (Q9), and both treat bodily feelings as contingent rather than constitutive (Q4, Q5).
  *   **What would separate them?** A case involving **conscious phenomenology vs. functional role**. Perceptual theories usually insist emotions must *feel* like something (phenomenology), whereas Attitudinal theories might allow for unconscious emotions that function as stances. A question asking "Can you have an emotion without any conscious feeling whatsoever?" would discriminate here.

  **Unoccupied Combinations**
  *   **The "Body-Only Belief" Hybrid:** Choosing 4(A) (Body is necessary for emotion) combined with 1(A) (Belief is necessary for emotion) and 5(A) (Body is sufficient for emotion).
      *   **Status:** **Incoherent.** If the body is sufficient (Q5), then belief cannot be necessary (Q1). If belief is necessary (Q1), then the body cannot be sufficient (Q5). This pattern suggests a confusion about whether emotions are defined by input (belief) or output/constituents (body).
  *   **The "Animal Exclusion/Fiction Inclusion" Hybrid:** Choosing 6(A) (Animals have no emotion due to lack of concepts) combined with 2(B) (Fiction sadness is real despite lack of real object).
      *   **Status:** **Unattractive/Unexplored.** This position claims conceptual capacity is required for emotion (excluding animals) but factual existence is not (including fiction). While logically possible, it is rare because the reason for excluding animals (lack of complex cognition) usually entails excluding fiction responses (lack of belief in existence). Most theorists who exclude animals also exclude fiction sadness, or include both.
