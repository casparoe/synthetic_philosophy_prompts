prompt: |-
  I keep hearing the 1975 Asilomar conference held up as the precautionary principle's finest hour, and I want a careful analysis of whether that's actually true, because something about it nags at me. Here's the episode as I understand it, so we're working from the same facts: in 1974 Paul Berg and a group of leading researchers called for a voluntary worldwide moratorium on recombinant DNA experiments (Berg had been spooked, partly by Robert Pollack, about the last step of putting SV40 tumor-virus DNA into E. coli), then in February 1975 about 140 biologists, along with some lawyers and physicians, met at Asilomar in California and drew up voluntary guidelines that matched containment levels to estimated risk, which the NIH then formalized in 1976. What everyone feared — lab strains picking up dangerous genes and escaping, workers getting cancer, that kind of thing — never materialized, and by the early 80s most people judged the guidelines overcautious, so they got progressively loosened. Meanwhile the risks that actually became contentious later, like deliberate release of engineered organisms into the environment, were basically not on the agenda at Asilomar at all, and part of what the guidelines achieved looks pretty pragmatic in hidsight: preempting messier public regulation (there were soon city council hearings in Cambridge, Massachusetts about Harvard's labs) and keeping the science in the scientists' own hands.

  So here's what I'm asking for: analyze this episode through the lens of the precautionary principle, running in both directions. Map the actors and decisions onto the usual distinction between the weak version (act on reasonable suspicion, respond proportionately) and the strong version (act before certainty, weight the catastrophic downside), and be honest about which one Asilomar actually instantiated, since it looks like a weird hybrid to me — a moratorium called on almost no evidence by todays standards, followed by containment matched to imagined rather than demonstrated risks. Then tell me where the principle fails to explain the episode: the self-regulation reads as much like reputation management and liability avoidance as precaution, the scientists scaled their fear to whatever had recently been in the news, and nobody paused over the fact that a moratorium also bought time for the people imposing it. And finally, what does the episode show about the principle itself — is Asilomar a genuine proof of concept (the AI safety crowd clearly thought so when they wrote the 2017 Asilomar AI principles), or does the principle get credit for a case that succeeded mostly through luck and self-interest, which is exactly the kind of case a rule can't be built on? I've read a bit of Sunstein's critique of strong precaution, so engage with that if it helps, but don't turn this into a book report on him.

  One formatting request: no headings, bullet points, bold text, or tables. Just continuous prose, the way you'd write a long email.
