answer: |-
  ### Tier List: Argumentative Weight Against Ethnocentrism

  **Strong**
  *   **1. His opening observation that each of us tends to call barbarism whatever is merely unfamiliar to our own practice, so the label tracks custom rather than rational assessment.**
      *   *Justification:* This move dismantles the logical foundation of ethnocentrism by exposing the term "barbarism" as a reflexive description of the speaker's own habits rather than an objective property of the observed.

  **Moderate**
  *   **4. His contrast between ritual eating of already-dead enemies and the tortures and massacres of Europe's wars of religion, with the implication that the label of barbarism attaches to the wrong continent.**
      *   *Justification:* While rhetorically powerful, this comparative cruelty shifts the accusation rather than vindicating the Tupinambá practice on its own merits, relying on a *tu quoque* that does not objectively clear the original charge.
  *   **5. His report of what the Tupinambá visitors to Rouen found baffling in French society, especially grown men obeying a child king and the poor begging outside doors while others live in abundance.**
      *   *Justification:* This empirical illustration effectively operationalizes the opening definition by forcing the reader to inhabit the outsider's perspective, though it relies on the credibility of anecdotal reportage rather than pure logic.

  **Weak**
  *   **3. His use of the cannibals' courage and composure in warfare, and especially in the face of death and suffering, as evidence of genuine virtue.**
      *   *Justification:* Praising the demeanor of the actors concedes the immorality of the act itself, offering a mitigation of character that fails to defend the practice against the charge of barbarism.
  *   **2. The claim that the Tupinambá live closer to nature and therefore closer to reason, in the spirit of the ancient poets' portraits of a golden age.**
      *   *Justification:* This argument rests on a romantic, metaphysical premise about the "Golden Age" that functions merely as a counter-bias to European superiority rather than an independent standard of judgment.

  ***

  ### Relativism vs. Humility

  Montaigne's arguments support **humility about the reliability of our judgments** rather than **relativism**. Relativism posits that there is no objective standard by which practices can be judged better or worse; humility posits that an objective standard (for Montaigne, "Nature" or "Reason") exists, but that our specific cultural vantage point distorts our ability to perceive it accurately. Montaigne does not argue that cannibalism is morally equivalent to Christian piety simply because cultures differ; rather, he argues that European Christians are currently failing to meet the universal standard of Reason more spectacularly than the Tupinambá are. He indicts the *judge* for being clouded by habit and hypocrisy, not the *act* for being beyond judgment. Therefore, he invites skepticism about our capacity to measure others, not the abandonment of the measuring stick itself.

  ### Persuading Your Daughter

  I would press **Argument 1** (the definition of barbarism as unfamiliarity) into service. While Argument 5 (the reverse gaze) is emotionally engaging for a teenager, Argument 1 provides the conceptual tool she needs to analyze her own language. By showing her that the word "barbaric" functions linguistically as a marker of *difference* rather than *truth*, you equip her to pause before using it. You can explain that when she uses the word, she is inadvertently describing her own upbringing rather than the people she is observing. This shifts the conversation from a moral condemnation of the host country to a sociological observation about herself, which is the first step toward the maturity required to live comfortably in a new culture.
