  Your professor is right; the podcast commits elementary errors common in pop-Marxism.

  **Exploitation:** The host conflates exploitation with cheating. Crucially, Marx distinguishes *labor* from *labor-power*. Workers are paid the value of their labor-power (the cost to reproduce the worker), not the value their labor creates. This exchange is formally "fair," not theft. Exploitation happens because labor-power produces more value than it costs. Profit isn't withheld wages; it's surplus value extracted during production. Thus, paying workers the "full value" of what they produce eliminates profit, ending capitalism itself. It's not a matter of underpayment within the system.

  **Alienation:** The host reduces alienation to psychological misery or monotony. For Marx, it's structural. Alienation involves separation from the product (which becomes capital opposing the worker), the process (activity is not self-directed), species-being, and other workers. A well-paid, happy worker is still alienated because they do not control the means of production; the product confronts them as an alien power. Enjoyment doesn't negate the structural loss of autonomy.

  **The Conclusion:** The claim that fixing wages fixes everything is false. Since exploitation is inherent to the wage-labor relation, higher wages merely adjust the rate of exploitation, not eliminate it. Similarly, alienation persists as long as labor is commodified. Marx's solution isn't fairer pay within capitalism, but the abolition of wage labor itself.

  Tell your roommate: Marx isn't arguing capitalists are morally bad individuals stealing pay; he's arguing the *system* requires surplus extraction regardless of individual intent. Alienation isn't a mood; it's a condition of objectification under private property. The podcast describes a moral critique of bad bosses; Marx offers a structural critique of capitalism.
