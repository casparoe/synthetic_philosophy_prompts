      *   *Response:* This relies on equating "fitting belief" with "belief supported by evidence." If we distinguish "fitting" (epistemically justified) from "rational to hold" (pragmatically useful), the friend's reductio fails. A belief can be rational to hold (Pascal's wager) without being epistemically fitting. So (5) does not collapse. I need to make sure this is clear in the first or second section. Actually, the prompt asks me to diagnose the *admiration* argument first. I will weave the belief analogy into the principled distinction section to show it generalizes without collapsing.

