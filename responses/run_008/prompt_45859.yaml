answer: |-
  Here is the exit from the seminar room. Your friend has trapped you using a classic metaethical puzzle known as the **Wrong Kind of Reason (WKR) problem**. The argument feels inescapable because it exploits an ambiguity in the word "reason" that is subtle enough to pass unnoticed in casual conversation but fatal in precise analysis.

  Here are the answers to your four requests.

  ### 1. Where the Argument Goes Wrong
  The error occurs at the inference from **(1) and (2) to (3)**. This is where the equivocation does its work.

  Premise (1) states: *Admirability is just the existence of the reasons [to admire].*
  Premise (2) states: *There is sufficient reason to admire the demon [to avoid torture].*

  The word "reason" is functioning differently in these two premises.
  *   In **(1)**, "reason" must mean **object-given reasons** (reasons that bear on the properties of the demon, i.e., his merit). If "reason" here meant *any* reason whatsoever, the concept of "admirability" would lose its specific meaning and just become "rationality."
  *   In **(2)**, "reason" refers to **state-given reasons** (reasons that bear on the benefits of holding the attitude, i.e., avoiding pain).

  Your friend's argument relies on sliding between these two definitions. If you read (1) using object-given reasons, (2) is irrelevant to the conclusion. If you read (1) using state-given reasons, (3) does not follow (because "admirable" implies merit, not just prudence).

  The argument fails because **admirability is a property of the object constituted only by object-given reasons.** State-given reasons (the threat) justify *holding* the attitude, but they do not make the object *admirable*. Therefore, (3) is false. The demon is someone you have reason to *treat as* admirable, or reason to *cultivate admiration for*, but he is not himself admirable.

  ### 2. A Principled Distinction (Beyond Intuition)
  You asked for a principled basis for distinguishing merit-based reasons from pragmatic reasons, without merely appealing to the intuition that "extortion isn't merit."

  The principled distinction lies in the **constitutive aim** of the attitude.

  Mental attitudes are not blank slates; they are functional states defined by what they are trying to do.
  *   **Belief** aims at **Truth**.
  *   **Admiration** aims at **Excellence/Merit**.

  A reason is of the "right kind" only if it engages with the constitutive aim of the attitude.
  *   **Object-given reasons** speak to the aim. Evidence speaks to truth; merit speaks to excellence. These reasons make the attitude *correct* or *fitting*.
  *   **State-given reasons** bypass the aim. A threat speaks to your well-being, not the demon's excellence. These reasons make the attitude *beneficial* or *useful*.

  This distinction saves you from your friend's worry about belief. Your friend argued that if (5) is true, a belief could be "fitting" without evidence. But under this principled distinction, a belief supported only by pragmatic reasons (like Pascal's Wager) is **pragmatically rational** but **epistemically unfitting**. It is rational to *cause yourself to believe*, but the belief itself lacks justification relative to its aim (truth).

  Therefore, the distinction is not an ad-hoc fix to save intuitions about demons; it is a structural claim about the nature of intentional mental states. You cannot satisfy the standards of an attitude by appealing to facts outside the scope of its aim.

  ### 3. The Mixed Case (The Courageous Demon)
  Suppose the demon has a small amount of genuine merit (courage) plus the threat. Do the reasons sum?

  **No, they do not sum with respect to admirability.**

  Here is why: Normative properties like "admirability" are determined by a specific *currency* of reasons. Prudential reasons and merit-based reasons are incommensurable in the domain of value.

  Think of it like a grading system.
  *   **Merit** is the grade you earn based on your test scores.
  *   **Threats** are the leverage a teacher uses to make you study.

  If a student scores 50% (some merit) but the teacher threatens to fail them unless they give themselves an A (the threat), the student does not end up with a grade of A+. The threat creates a compelling reason to *claim* an A, or to *believe* they have an A, but it does not add points to the test score.

  Similarly, the demon's courage makes him *slightly admirable*. The threat makes it *highly rational to admire him*. These two factors sum to determine **what you ought, all-things-considered, to do** (you ought to admire him). But they do not sum to determine **how admirable he is**.

  What stops them from summing is the **direction of fit**.
  *   Merit-based reasons try to match the mind to the world (I admire because he is good).
  *   Threat-based reasons try to match the world to the mind (I admire so that I am not hurt).

  Admirability tracks the first direction of fit. Adding reasons of the second direction cannot increase the property defined by the first. So, the demon remains *slightly* admirable (due to courage), even though you have *decisive* reason to admire him (due to courage + threat). The unfitting admiration does not become fitting; rather, the *holding* of the unfitting admiration becomes mandatory.

  ### 4. "Ought to Admire" vs. "Admirable"
  By insisting on keeping both (2) and (4), you are committing yourself to **Normative Pluralism**. You must accept that there is no single, monolithic "Ought."

  Specifically, you are committed to the following distinction:

  1.  **The Ought of Rationality (Prudence):** This governs the subject. Given the total set of reasons (merit + threat), you *ought* to bring it about that you admire the demon. To fail to do so is irrational or self-destructive.
  2.  **The Ought of Fittingness (Value):** This governs the relation between subject and object. Given the properties of the demon (lack of merit), he is *not* admirable. To admire him is to be in a state that does not fit its object.

  Your commitment is that **these two "Oughts" can conflict.**

  *   **"What is admirable"** is a claim about the **object's value**. It is invariant to your situation. The demon is not admirable, even if you are being tortured.
  *   **"What I ought to admire"** is a claim about the **subject's rationality**. It is sensitive to your situation. You ought to admire him to save your skin.

  This means you must accept that it is possible to be **rationally required to hold an unfitting attitude.** This sounds paradoxical only if you assume that rationality always tracks fittingness. But in cases of coercion (the Demon) or pragmatic necessity (Pascal's Wager), rationality diverges from fittingness.

  **The Exit:**
  Tell your friend: "I accept (2) and (4). I reject (1). Admirability is not the existence of *any* reason to admire; it is the existence of *fittingness-conferring* reasons. The demon gives me decisive reason to *cultivate* admiration, but he has not made himself *admirable*. I am rationally compelled to admire what is unworthy. That is the tragedy of coercion, not a contradiction in metaethics."
