answer: |-
  The most consequential design decision is to withhold the labels "Honor," "Dignity," and "Victimhood" until the final debrief, framing the three rounds instead as neutral "Administrative Protocols" to prevent students from performing normative expectations rather than reacting to institutional incentives.

  ### **Simulation Overview**
  *   **Participants:** 18 undergraduates.
  *   **Room Setup:** Three clusters of 6 desks each (triangles or circles).
  *   **Materials:** 100 poker chips (or paper tokens) per cluster, 3 sets of "Protocol Rule Sheets" (one per round), 3 "Provocation Cards" per cluster.
  *   **Currency:** "Status Points" (SP). Starting endowment: 10 SP per student.
  *   **Goal:** Maximize individual SP by the end of the semester (though only this section counts for today's grade/participation).

  ### **Phase 1: Setup (10 Minutes)**
  1.  **Grouping:** Divide class into 3 clusters of 6. Distribute 10 SP to each student.
  2.  **The Incident:** Explain that in each round, one student per cluster will be secretly assigned the role of **Provocateur** via a Provocation Card. The card instructs them to commit a specific, low-stakes slight against a partner (e.g., "Take 2 SP from Player 2 without asking" or "Claim credit for Player 2's answer to a warm-up question").
  3.  **Neutral Framing:** Tell students: "We are testing three administrative protocols for conflict resolution. There is no moral right answer, only efficient adaptation to the rules. Do not discuss the rules between rounds."
  4.  **Distribution:** Hand out **Protocol A Rule Sheet**.

  ### **Phase 2: The Three Rounds (12 Minutes Each)**
  *Note: Collect Rule Sheets after each round to prevent cross-contamination.*

  #### **Round 1: Protocol A (Honor Culture)**
  *   **Core Logic:** Reputation is everything; authority is absent; self-help is required.
  *   **Rules:**
      1.  **Sensitivity:** If you are slighted (lose SP or feel disrespected), you *must* challenge the Provocateur to a "Status Duel" (Rock-Paper-Scissors).
      2.  **Cost of Ignoring:** If you are slighted and do *not* challenge, you lose 2 SP at the end of the round for "Weakness."
      3.  **The Duel:** Winner takes 2 SP from Loser.
      4.  **Bystanders:** The other 4 students must publicly verbally back either the Challenger or the Provocateur. If you back the winner, gain 1 SP. If you back the loser, lose 1 SP. (Forces alignment).
      5.  **Authority:** The TA does not intervene in disputes.

  #### **Round 2: Protocol B (Dignity Culture)**
  *   **Core Logic:** Intrinsic worth is fixed; authority is formal; slights are irrelevant.
  *   **Rules:**
      1.  **Insensitivity:** Slights do not mechanically reduce SP unless verified by the TA.
      2.  **Formal Appeal:** If you are slighted, you may file a "Formal Grievance" with the TA. Cost: 5 SP (filing fee).
      3.  **Adjudication:** The TA flips a coin. Heads: Provocateur returns SP + pays 2 SP fine. Tails: Grievance denied, fee lost.
      4.  **Cost of Publicity:** Discussing the conflict with bystanders costs 1 SP per comment (gossip penalty).
      5.  **Bystanders:** Must remain neutral. Speaking on the conflict costs 1 SP.

  #### **Round 3: Protocol C (Victimhood Culture)**
  *   **Core Logic:** Sensitivity is high; authority is the public audience; victimization is capital.
  *   **Rules:**
      1.  **Broadcast:** If slighted, you may "Broadcast Grievance" (Stand and announce the slight). Cost: 1 SP.
      2.  **Validation:** The 4 Bystanders vote immediately (Show of hands).
      3.  **Payoff:** If >50% validate (vote "Yes, this was wrong"):
          *   Victim gains 5 SP (Moral Capital).
          *   Provocateur loses 5 SP.
          *   Each Voter gains 1 SP (for demonstrating moral alignment).
      4.  **Rejection:** If <50% validate:
          *   Victim loses 5 SP (for "false claim").
          *   Provocateur gains 2 SP.
          *   Voters lose 1 SP.
      5.  **Sensitivity:** Even minor slights (e.g., tone of voice) are valid grounds for Broadcast.

  ### **Phase 3: Debrief (29 Minutes)**
  *Do not reveal the labels until the very end.*

  **Part 1: Descriptive Mapping (10 Minutes)**
  *   **Ask:** "In Protocol A, what happened to people who ignored slights? In Protocol B, what was the risk of appealing? In Protocol C, what determined whether a grievance was profitable?"
  *   **Board Work:** Create three columns. Have students shout out behaviors.
      *   *Proto-A:* High confrontation, bystander polarization, reputation volatility.
      *   *Proto-B:* Low confrontation, high cost of appeal, bystander silence.
      *   *Proto-C:* High public disclosure, bystander mobilization, moral capital accumulation.
  *   **Reveal:** Label A = Honor, B = Dignity, C = Victimhood (Campbell & Manning).

  **Part 2: Analytic Core (10 Minutes)**
  *   **The Hybrid Claim:** Ask: "Look at Protocol C. How is it like Protocol A?" (Answer: Sensitivity to slight, reputation matters). "How is it like Protocol B?" (Answer: Reliance on third parties rather than violence). "What makes it distinct?" (Answer: Third parties are informal/public, not formal/legal; victimization yields status).
  *   **Rationality Check:** "Was Protocol C just 'whining'?" Guide them to see that under Protocol C rules, broadcasting was the *rational* profit-maximizing strategy, just as ignoring was in Protocol B. The behavior is an adaptation to the incentive structure, not a personality flaw.

  **Part 3: Normative Suspension (5 Minutes)**
  *   **Question:** "Which protocol is morally superior?"
  *   **Constraint:** Force them to answer based on *context*.
      *   "If you live in a stateless region with no police (Protocol A), is dignity rational?" (No, you get eaten).
      *   "If you live in a stable legal state (Protocol B), is honor rational?" (No, you go to jail).
      *   "If you live in a networked public where institutions are distrusted but social media is powerful (Protocol C), is victimhood rational?" (Yes, it's the only lever available).
  *   **Takeaway:** Cultures are locally rational adaptations to social topology, not linear progressions from bad to good.

  **Part 4: Simulation Limitations (4 Minutes)**
  *   **Explicitly state what the game cannot do:**
      1.  **Risk of Violence:** Protocol A had Rock-Paper-Scissors; real honor cultures involve physical risk/death. This lowers the stakes of "honor."
      2.  **Choice:** You chose to play this game; people do not choose their native culture. It is harder to critique a culture you are born into.
      3.  **Selection Effects:** In Protocol C, only the bold broadcasted. In reality, structural power determines whose victimhood is validated. The game assumes a level playing field for validation that doesn't exist.

  ### **Predictable Failures & Mitigation Strategies**

  1.  **Failure: The Grievance Cards are Funny/Trivial.**
      *   *Risk:* Students laugh off the "theft" of 2 SP, breaking the tension needed for Honor/Victimhood rounds.
      *   *Mitigation:* Frame the SP as "Course Credit Points" (even if symbolic). Use a script: "Treat this currency as your grade equity." If they still laugh, pause and ask: "Why is it hard to take this seriously? In real honor cultures, the 'currency' is safety, not chips. Imagine these chips are your physical security."

  2.  **Failure: The Protocol C Audience is Inert.**
      *   *Risk:* Bystanders don't vote because they don't want to be mean to the Provocateur.
      *   *Mitigation:* The rule sheet must explicitly state: "Voters gain 1 SP for voting." Make the incentive material. If they still hesitate, remind them: "You are optimizing for points, not being nice."

  3.  **Failure: Early Pattern-Matching to Labels.**
      *   *Risk:* A student shouts "This is Honor Culture!" in Round 1, causing others to perform stereotypes.
      *   *Mitigation:* Pre-empt this in setup: "If anyone names these cultures before the debrief, their cluster loses 10 SP." Use neutral language ("Protocol A"). If it happens, pause and reiterate: "You are reacting to rules, not labels."

  4.  **Failure: Victimhood as Cynical Caricature.**
      *   *Risk:* Students view Protocol C as "teaching people to lie for points."
      *   *Mitigation:* In the debrief, emphasize the *validation* mechanic. In real victimhood culture, the grievance must be *believable* to the audience. The simulation rewards successful validation, which requires shared moral understanding, not just lying. Ask: "Could you broadcast anything and win? No, you needed the audience. That's the social constraint."

  ### **Instructor Cheat Sheet: The Campbell & Manning Mapping**
  *   **Honor (Protocol A):** Sensitivity to insult + Self-help redress. (Sim: Must duel, no TA).
  *   **Dignity (Protocol B):** Insensitivity to insult + Formal redress. (Sim: Ignore or pay high fee to TA).
  *   **Victimhood (Protocol C):** Sensitivity to insult + Public/Informal redress. (Sim: Broadcast to crowd for moral capital).
  *   **Key Theoretical Point:** Victimhood is not "Dignity failing." It is a new structure where moral status is gained by demonstrating vulnerability to a network, rather than demonstrating invulnerability (Honor) or independence (Dignity).
