answer: |-
  Colleagues, friends, and family.

  When [Honoree's Name] asked me to speak tonight, she knew exactly what she was doing. She knows that after a career measuring rates of diffusion and action potentials, I have spent my retirement wrestling with the Greeks. She also knows that she is the reason I started. For thirty years, I watched her stand before audiences much tougher than this one and insist that we cannot talk about a heart, or a leaf, or a ribosome, without talking about what it is *for*.

  Her critics, as we all know, were legion. They told her that "purpose" was a ghost, a pre-scientific superstition. They wanted a biology of pure mechanism, where the organism is merely a machine that happens to replicate. [Honoree's Name] stood her ground. She argued, correctly, that to strip biology of function is to strip it of intelligibility. If you cannot ask what an organ is for, you are not doing biology; you are doing chemistry in a complicated container.

  She often invoked Aristotle to bolster this claim. She called him the first great biologist, the man who saw that nature does nothing in vain. And her critics, sharp as they were, had a ready reply. They would point to the *Politics*. They would remind her that the same man who wrote *On the Parts of Animals* also wrote that some human beings are slaves by nature. Aristotle called the natural slave a "living tool" (*empsychon organon*). He argued that just as the soul rules the body, and the body uses the hand, so too does the master use the slave. The slave, in his view, was a part of the master, a biological instrument with a soul, existing for the sake of another.

  For a long time, I let [Honoree's Name] handle that objection. She would wave it away as a regrettable cultural blind spot. But recently, in my retirement reading, I have come to see that the critics were right about one thing: the argument for natural slavery is not an accidental stain on Aristotle's reputation. It is structurally rooted in the very teleology [Honoree's Name] admired. It grows from the same soil. It relies on the premise that some things exist by nature to be used, and others to use them.

  So, I stand here tonight, having read the chapters she asked me to read, and I find I cannot give a speech that pretends that problem doesn't exist. To honor her honestly, I have to acknowledge that the framework she defended is dangerous.

  If we say that every part exists for the sake of the whole, we can explain the liver's service to the body. But if we apply that logic indiscriminately to human beings, we justify tyranny. We turn persons into parts.

  So, how do we honor [Honoree's Name]'s legacy without laundering Aristotle? How do we keep the biology without the bondage?

  We do it by practicing the very discernment that defined her career.

  [Honoree's Name] never accepted Aristotle wholesale. She was not an Aristotelian in the metaphysical sense. She was a biologist who found in Aristotle a vocabulary for what she saw under the microscope. She took the tool of functional explanation, but she left behind the metaphysics of fixed species and the cosmology of the crystalline spheres.

  We must do the same with the *Politics*. We must acknowledge that the logical structure of teleology—means and ends, part and whole—is indispensable for understanding life, but it is morally forbidden when applied to the status of human beings.

  This is the hard work of inheritance. It is easy to reject a thinker entirely because they were flawed. It is also easy to worship them and ignore the flaws. The hard path—the scientific path, the honest path—is to hold both truths at once. We admit that the same insight that allows us to understand the function of the eye can, if unchecked by moral reasoning, be twisted to justify the subjugation of the vulnerable.

  [Honoree's Name]'s career was a lesson in this discernment. She taught us that we can speak of "purpose" in nature without implying a "Purposer." She taught us that we can speak of "function" without implying that the function defines the moral worth of the entity. The heart has a function, but the heart has no rights. The human being has rights, and therefore must never be reduced to a function.

  To her critics who used Aristotle's ethics to dismiss her biology: they committed a category error. To her admirers who might wish to ignore Aristotle's ethics: we commit a moral error.

  [Honoree's Name] navigated between these errors. She showed us that we can reclaim the concept of *ergon*—of function and work—without accepting the hierarchy of domination. We can believe that the eye is for seeing, without believing that the worker is for the boss, or that one human is for the sake of another.

  In this, she was more Aristotelian than Aristotle. She pursued the *telos* of science: the truth. But she pursued it with a conscience that recognized where the analogy must end.

  So, to my colleague: Thank you. Thank you for teaching us that life is not just matter in motion. Thank you for teaching us that asking "what is it for?" is a scientific question, not a mystical one. And thank you for showing us that we can inherit the wisdom of the past without inheriting its sins, provided we remain vigilant.

  Aristotle defined the good life, *eudaimonia*, as the activity of the soul in accordance with virtue. You have spent your career in exactly that activity. You defended the truth of life against reductionism, and you defended the dignity of life against the cold logic of instrumentalism.

  Now, you enter a retirement where you are no longer a means to the ends of the university, or the grant agencies, or the department. You are, as Kant would have corrected Aristotle, an end in yourself. May your days be filled with the functions you choose for yourself, for the sake of your own flourishing, and for the joy of all of us who are privileged to call you friend.

  Cheers.
