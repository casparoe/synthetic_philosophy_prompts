answer: |-
  **JOINT STATEMENT ON THE NATURE OF EMOTION**
  **Submitted by:** [Name], Neo-Stoic Judgment Theorist & [Name], Jamesian Feeling Theorist
  **For:** Special Issue on *The Ontology of Affect*

  ### Preamble
  After two decades of dialectical exchange and a semester of intensive adversarial collaboration, we submit this statement to map the contour of our dispute. We agree that the debate has often obscured shared commitments behind terminological friction. However, we also affirm that a substantive metaphysical disagreement remains regarding the *constitutive essence* of emotional episodes. The following document outlines our common ground, the precise locus of our divergence, and the specific phenomenological test cases that determine the viability of our respective accounts.

  ### I. Shared Commitments
  *Both signatories endorse the following claims as constraints that any adequate theory of emotion must satisfy. These are not platitudes but substantive commitments regarding the phenomena.*

  1.  **Phenomenal Specificity:** Emotional states possess a distinctive "what-it-is-likeness." Fear feels different from anger, and both feel different from cold cognitive assessments or non-emotional bodily sensations (e.g., indigestion). A theory must explain this differentiation without collapsing all high-arousal states into one category.
  2.  **World-Directedness (Standard Case):** In paradigmatic instances, emotions are *about* something in the world (a snarling dog, an insult, a loss). They present the world under a specific aspect (as dangerous, offensive, or tragic). A theory must account for this intentionality without treating it as an add-on.
  3.  **Normative Assessability:** Emotions are subject to norms of appropriateness. It makes sense to tell a subject, "You should not fear that," or "Your grief is disproportionate." Even if emotions are not beliefs, they are not merely brute causal pushes; they participate in the space of reasons.
  4.  **Motivational Internality:** Emotions typically generate immediate impulses to action (flight, strike, withdraw) that differ in quality from desires formed via cool deliberation. A theory must explain why emotions move us more urgently than mere evaluations.
  5.  **Temporal Dynamics:** Emotions have a distinct temporal profile. They can be sudden onset, they can linger after a triggering event has passed, and they can fade without a change in the subject's explicit beliefs. A theory must accommodate this inertia.

  ### II. Map of Residual Disagreements
  *We disagree on the metaphysical priority of the components identified above. The following table states our positions neutrally. Each row is phrased such that the proponent of that view accepts it as a accurate description of their core thesis.*

  | Domain of Dispute | The Judgment Theorist (Neo-Stoic) Holds: | The Feeling Theorist (Jamesian) Holds: |
  | :--- | :--- | :--- |
  | **Constitution** | The emotion *is* the evaluative construal of the situation. Bodily feelings are contingent, causal consequences of the judgment, not parts of the emotion itself. | The emotion *is* the perception of specific bodily perturbations. Evaluative thoughts are antecedent causes or subsequent interpretations, not parts of the emotion itself. |
  | **Intentionality** | Intentionality is primary. The emotion is about the object because the judgment is about the object. Bodily feelings inherit intentionality only by association. | Intentionality is secondary (or derived). The feeling is primarily of the body; it is "projected" onto the world, or the object is apprehended concurrently but not constitutively. |
  | **Cognitive Requirement** | Emotion requires a capacity for evaluation (conceptual or proto-conceptual). Without a mechanism to register "danger" or "loss," there is no fear or grief, only startle or distress. | Emotion requires only a capacity for somatic feedback. Any organism with a nervous system capable of registering bodily change can have emotions, regardless of conceptual capacity. |
  | **Recalcitrance** | Recalcitrant emotion (feeling fear while judging safety) is a conflict between two cognitive states (a judgment vs. an automatic "alief" or appearance). | Recalcitrant emotion is the persistence of bodily feedback after the cognitive assessment has changed. The feeling remains even if the thought corrects it. |

  ### III. Diagnostic Cruxes and Test Cases
  *We identify four "cruxes"—sub-questions where conceptual clarification or phenomenological precision could force a theoretical revision. For each, we specify an ordinary phenomenon and state our divergent predictions regarding how a theory must categorize it.*

  #### Crux 1: The Authority of the Body vs. The Mind
  *Question:* In cases of conflict between bodily sensation and evaluative assessment, which state bears the identity of the emotion?
  *Case:* **The Recalcitrant Arachnophobe.** A subject sincerely judges a spider to be harmless (knows it is non-venomous, caged) yet experiences terror, sweating, and an urge to flee.
  *   **Judgment Theorist Prediction:** The subject does not truly *judge* the spider harmless at the relevant level. They hold a conscious belief of safety, but an automatic, non-reflective "alief" or appearance of danger. The emotion is identical to this automatic assessment. If the automatic assessment were removed, the emotion would vanish, even if the heart raced.
  *   **Feeling Theorist Prediction:** The subject's judgment of safety is irrelevant to the existence of the fear. The fear *is* the experience of the racing heart and tension. As long as the bodily perturbation is felt, the fear exists, regardless of whether the mind assesses danger.

  #### Crux 2: The Necessity of Concepts
  *Question:* Does the capacity for emotion entail the capacity for evaluative concepts (e.g., "danger," "offense")?
  *Case:* **The Startled Dog.** A dog recoils and growls at a stranger raising a stick. The dog lacks the linguistic concept of "threat" or "injustice."
  *   **Judgment Theorist Prediction:** The dog does not experience full-blown *fear* (an emotion), but rather a proto-emotional affect or instinctual distress. To call it "fear" is metaphorical. Genuine emotion requires a grasp of the *significance* of the stimulus, which implies a conceptual (or quasi-conceptual) capacity the dog lacks.
  *   **Feeling Theorist Prediction:** The dog experiences genuine fear. The bodily perturbation (adrenaline, tension) is identical in kind to the human's. To deny the dog emotion based on a lack of concepts is to mistake the *cause* of the feeling (the stick) for the *feeling itself* (the bodily change).

  #### Crux 3: Objectless States
  *Question:* Can an emotion exist without an intentional object, and if so, what constitutes it?
  *Case:* **Free-Floating Anxiety.** A subject wakes up with a sense of dread, scanning for a cause but finding none. There is no specific judgment of danger (nothing is judged dangerous) and no specific object.
  *   **Judgment Theorist Prediction:** This is not a full emotion but a mood or a disposition to judge. It is a background state of readiness to make negative evaluations. If it lacks an object, it lacks the intentional structure required for emotion proper.
  *   **Feeling Theorist Prediction:** This is a pure instance of emotion. It reveals the essence of affect: bodily perturbation without an object. The fact that the subject *searches* for an object proves the feeling is primary and the object is secondary (an attempt to explain the feeling).

  #### Crux 4: Epistemic Feelings
  *Question:* Are feelings that track cognitive states (rather than survival values) emotions?
  *Case:* **Déjà Vu / The Feeling of Knowing.** A subject feels a sense of familiarity or certainty. There is bodily phenomenology (a "click," a sense of ease), but no obvious evaluative content (no "danger" or "loss").
  *   **Judgment Theorist Prediction:** These are not emotions. They are monitoring states regarding the reliability of cognition. They lack the evaluative content (good/bad/dangerous/loss) required for emotion. They are cognitive sensations, not emotions.
  *   **Feeling Theorist Prediction:** These are emotions (or border-line emotions). They fit the profile: distinctive phenomenology, bodily feel, motivational push (to stop searching, to assert). If emotion is felt bodily change, these qualify. Excluding them reveals the Judgment Theory is too narrow.

  ### IV. Note on Verbal Dispute and Convergence
  *We candidly acknowledge that a portion of our dispute is terminological, though not all of it.*

  **The Verbal Component:**
  Much of our disagreement hinges on the definition of "Judgment."
  *   If the **Judgment Theorist** expands "judgment" to include non-conscious, non-linguistic, automatic endorsements of content (akin to *aliefs* or perceptual seemings), they can account for the arachnophobe and the dog without conceding that the *feeling* is the emotion.
  *   If the **Feeling Theorist** concedes that bodily feelings are typically *caused* by rapid evaluations and are rarely experienced in total isolation from worldly content, they can account for intentionality without conceding that the *evaluation* is the emotion.

  **The Substantive Remainder:**
  However, a metaphysical disagreement persists even if definitions are harmonized.
  1.  **Location of the Essence:** Even if we agree emotions involve both evaluation and feeling, we disagree on which is the *emotion*. If a pharmacological agent induced the exact bodily feeling of grief (heaviness, crying) without any sense of loss, the **Feeling Theorist** must classify this as grief (or indistinguishable from it). The **Judgment Theorist** must classify this as a mere sensation or mimicry, because the evaluative content (the loss) is missing.
  2.  **The Direction of Fit:** The **Judgment Theorist** maintains emotions aim to match the world (they are true/false or fitting/unfitting). The **Feeling Theorist** maintains emotions aim to register the state of the organism (they are accurate/inaccurate perceptions of the body).

  **Conclusion:**
  We agree that if the Judgment Theorist is permitted to count non-propositional, appearance-like states as "judgments," the gap regarding *recalcitrance* and *animals* narrows significantly. However, the gap regarding *objectless moods* and *epistemic feelings* remains wide. The Feeling Theorist sees these as proof that bodily feeling is sufficient for emotion; the Judgment Theorist sees them as proof that bodily feeling is insufficient without evaluative content. Settling whether "emotion" is a natural kind defined by physiology or a functional kind defined by role remains the ultimate task of this issue.
