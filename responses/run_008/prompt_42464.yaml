      *   *Crux 3: Objectless Moods.* (Free-floating Anxiety).
          *   JT Prediction: It's a vague judgment or a disposition to judge.
          *   FT Prediction: It's pure bodily feeling without an object.
      *   *Crux 4: Epistemic Feelings.* (Déjà Vu).
          *   JT Prediction: Not an emotion, or a judgment of familiarity.
