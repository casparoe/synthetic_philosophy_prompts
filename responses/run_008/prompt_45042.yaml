answer: |-
  This is a classic exercise in reflective equilibrium. You are asking me to reconstruct the implicit normative framework of your advisor's jurisprudence based on a set of considered judgments. The tension you have identified is real: her record straddles the line between **market alienation** (some things money shouldn't buy because it degrades them) and **market regulation** (money is fine if coercion and harm are managed).

  Here is the analysis of her governing principles, the prediction for the mourner case, and the proposed test case.

  ### 1. The Two Candidate Principles

  Based on the verdicts provided, two distinct normative frameworks fit the existing record with high fidelity.

  **Rule A: The "Corruption of Meaning" Principle (The Sandelian/Andersonian View)**
  *   **The Rule:** Market exchange is impermissible when it corrupts the intrinsic meaning of a social practice or crowds out non-market norms essential to that good.
  *   **Fit with Bans:**
      *   *Vote Selling:* Corrupts the civic norm of equality and shared decision-making.
      *   *Surrogacy:* Corrupts the norms of kinship and parental love (even if consensual).
      *   *Line-Standing (Congress):* Corrupts the democratic norm of equal access to representatives.
      *   *Price Gouging:* Corrupts the norm of civic solidarity during communal crisis.
  *   **Fit with Permits:**
      *   *Plasma/Drug Trials:* These are framed as medical labor/contribution; market norms do not inherently degrade the medical utility or the donor's personhood in the same way they do reproduction or voting.
      *   *Ticket Resale:* Entertainment is a purely commercial good; market norms are appropriate.

  **Rule B: The "Structural Harm and Vulnerability" Principle (The Liberal/Regulatory View)**
  *   **The Rule:** Market exchange is impermissible when it exploits structural vulnerability (dire need, unequal bargaining power) or damages public institutions (democratic equality, safety). If consent is robust and public harm is contained, exchange is permitted.
  *   **Fit with Bans:**
      *   *Vote Selling/Line-Standing:* Damages public institutions (democratic equality).
      *   *Price Gouging:* Exploits dire need/vulnerability.
      *   *Surrogacy:* Viewed as inherently structurally exploitative of women as a class, regardless of individual wealth (a common feminist structuralist position).
  *   **Fit with Permits:**
      *   *Plasma/Drug Trials:* Vulnerability is mitigated through tight regulation (risk caps, supervision).
      *   *Ticket Resale:* No structural vulnerability or public harm.

  ### 2. Predictions for the Professional Mourner Case

  **The Case:** Renting unionized, well-paid actors to weep at wakes (openly advertised, wealthy families, no deception).

  *   **Prediction under Rule A (Corruption of Meaning):** **BAN.**
      *   *Reasoning:* Mourning is an intimate ritual grounded in the norm of authentic grief and personal loss. Introducing market norms (payment for performance) into the heart of the funeral rite corrupts the meaning of the practice. Even if no one is deceived, the *act* itself becomes a commodity, undermining the social value of mourning as a sincere expression of human bond. It treats grief as a service rather than a state of being.

  *   **Prediction under Rule B (Structural Harm):** **PERMIT.**
      *   *Reasoning:* There is no structural vulnerability (actors are unionized/well-paid), no coercion (fully informed), and no deception (advertised openly). There is no damage to a public institution (funerals are private ceremonies). Unlike vote selling, this does not undermine democratic equality. Unlike price gouging, it does not exploit dire need. Therefore, under a harm/vulnerability framework, there is no justification for a ban.

  ### 3. Best Guess and Reasoning

  **Verdict:** Your advisor will **BAN** the professional mourners.

  **Reasoning:**
  While both rules fit the data, **Rule A (Corruption of Meaning)** is the stronger predictor of your advisor's specific constraints. The "tells" are the **Vote Selling** and **Surrogacy** cases.

  1.  **The "Informed/Wealthy" Constraint:** In both the vote-selling and surrogacy cases, your advisor explicitly bans the practice *even when* the standard liberal conditions for valid exchange are met (informed adults, secret ballot, wealthy/counseled parties). If her primary concern were Rule B (Vulnerability/Harm), these caveats should logically lead to permission. The fact that they do not suggests she believes the *nature of the good itself* precludes market exchange, regardless of the fairness of the transaction.
  2.  **The Plasma Distinction:** She permits plasma donation from low-wage students (high vulnerability potential) but bans surrogacy from wealthy parties (low vulnerability potential). This inversion is difficult to explain under Rule B unless one argues surrogacy is *inherently* harmful. It is easily explained by Rule A: Plasma is renewable tissue (labor-adjacent); Surrogacy is reproductive kinship (intimate-adjacent).
  3.  **The Mourner Parallel:** Professional mourning aligns structurally with Surrogacy, not Plasma. Both involve the commodification of intimate, human, bodily-emotional experiences (gestation/grief) rather than mere biological material or labor. Since she bans the commodification of reproduction even under ideal conditions, consistency demands she ban the commodification of grief under ideal conditions.

  She is likely operating under a **pluralist theory of spheres of justice**, where the "Intimate Sphere" is immune to market norms, regardless of consent.

  ### 4. The Discriminating Test Case

  To definitively distinguish between Rule A (Corruption) and Rule B (Harm/Vulnerability) in future discussions, you should propose the following case:

  **The Case:** **"Renting a Family Member for the Holidays."**
  *   *Scenario:* A service agency rents out actors to pose as spouses, children, or parents for wealthy clients during holiday gatherings to alleviate loneliness or satisfy social pressure. The actors are well-paid, unionized, and the arrangement is disclosed to no one (private event), or disclosed to all guests (open secret).

  **Why this discriminates:**
  *   **Rule B (Harm/Vulnerability) predicts PERMIT:** There is no public institutional damage. If the actors are well-paid and unionized, there is no exploitation of vulnerability. It is a private contract between consenting adults.
  *   **Rule A (Corruption) predicts BAN:** This strikes at the core of "family" as a non-market good. Monetizing the parent-child or spousal bond, even performatively, corrupts the meaning of family intimacy.

  If your advisor bans this, she is confirmed as a "Corruption of Meaning" theorist. If she permits it (perhaps with disclosure requirements), she is a "Structural Harm" theorist who views the Mourner case as a bridge too far only because death is uniquely sacred, whereas holidays are social conventions. Given her surrogacy stance, I expect she would ban the "Rent-a-Family" case as well.
