answer: |-
  The phenomenon you describe sits at the intersection of welfare economics, distributive justice, and the philosophy of well-being. While the components of this problem are well-discussed, there is **no single, canonical term** that specifically isolates the *allocative disincentive structure* you've identified from the broader epistemic worries about preference validity.

  In the literature, this configuration is usually subsumed under the **"Problem of Adaptive Preferences"** (associated with Amartya Sen and Martha Nussbaum). However, that term primarily addresses the *normative* question of whether adapted preferences should count at all (the "Sour Grapes" worry you mentioned, coined by Jon Elster). Your concern is distinct: you are granting the preferences validity (the patient is genuinely content) but objecting to the *mechanical consequence* of using welfare deltas for allocation.

  In health economics, this is sometimes discussed as a consequence of the **"Disability Paradox"** within **QALY (Quality-Adjusted Life Year)** maximization, where patients with good coping mechanisms show smaller QALY gains. In philosophy, it is occasionally referred to as the **"Inverse Utility Monster"** dynamic (since the Utility Monster absorbs resources due to high marginal utility, while the adapted patient is deprioritized due to low marginal utility). However, neither of these serves as a proper noun for the *incentive structure* itself.

  Because no established term isolates this specific *allocative penalty* from the *epistemic suspicion* of Sour Grapes, I will coin one for you.

  ### The Term: **The Resilience Penalty**

  **Definition:**
  The **Resilience Penalty** is the systematic disadvantage in resource allocation imposed on agents who have successfully adapted to a deprivation or condition, occurring when allocation rules prioritize *marginal welfare gains* (deltas) over *welfare levels* or *objective need*. It specifically captures the perverse incentive where coping mechanisms (resilience, adaptation, temperament) reduce an agent's priority for aid.

  **Boundaries and Scope:**
  1.  **Temperament vs. Adaptation:** The Resilience Penalty extends to individuals who are cheerful by temperament (high baseline welfare) even without prior deprivation. If the allocation rule keys off welfare *gain*, a naturally cheerful person gains less subjective welfare from a treatment than a neurotic one, even with identical objective health outcomes. Thus, the penalty applies to "constitutional resilience" as well as "adaptive resilience."
  2.  **Prioritarianism:** Does it survive under a rule that prioritizes the worst-off?
      *   **Welfarist Prioritarianism:** **Yes.** If "worst-off" is defined by *welfare level*, the adapted patient (who reports high welfare) is not "worst-off" and remains deprioritized compared to the miserable patient. The penalty survives because the metric remains subjective welfare.
      *   **Objective Prioritarianism:** **No.** If "worst-off" is defined by *objective condition* (e.g., severity of pathology, functional impairment) regardless of reported welfare, the Resilience Penalty vanishes. Both patients have the same condition, so both are equally prioritized. The penalty is specific to *welfarist* allocation metrics.

  **Relation to Established Concepts:**
  *   **Sour Grapes:** Sour Grapes questions the *authenticity* of the preference ("Are they truly happy, or just deluded?"). The Resilience Penalty assumes the happiness is *authentic* but argues the *system* punishes it. They are distinct: one is an epistemic worry, the other is a structural/design worry.
  *   **Utility Monster:** The Utility Monster exploits a welfarist system by having *high* marginal utility. The victim of the Resilience Penalty is excluded by having *low* marginal utility. They are two sides of the same coin: the instability of welfarist allocation when marginal utility varies independently of need.

  **Argument to Change Verdict:**
  The argument that would most plausibly collapse the Resilience Penalty back into the Sour Grapes problem is a **strict Welfarist Defense**. This argument posits that if a patient's reported welfare is genuine (i.e., it is *not* Sour Grapes), then there is *no injustice* in deprioritizing them. From this view, justice is defined solely by the maximization of welfare (or priority to low welfare levels). If the adapted patient has high welfare, they *should* receive less priority; to do otherwise would be to waste resources that could create more welfare elsewhere. Under this view, the "Penalty" is not a bug, but a feature of rational allocation, and the "phenomenon" dissolves into a simple application of utilitarian or prioritarian calculus. The Resilience Penalty only exists as a distinct *problem* if one accepts a non-welfarist metric of need (e.g., capability, health status) as morally primary to subjective welfare.

