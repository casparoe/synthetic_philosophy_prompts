  2. Run five rounds where the cosmology is drawn anew each time, allowing only "existent" students to bet tokens on the world type at odds that ensure SIA-aligned wealth explodes in Teeming worlds while SSA-aligned wealth stabilizes in Sparse ones.
  3. Highlight the student who bet everything on Teeming solely because they exist as the Presumptuous Philosopher, then ask the conservative bettors to calculate the opportunity cost of sitting out high-payoff rounds simply because their existence was improbable under that hypothesis.
  4. Students will treat the tokens as mere gambling currency rather than credence scores, so you must halt the game to audit whether their bet sizes match their stated probabilities before allowing play to resume.
  5. The simulation cannot reproduce the metaphysical weight of non-existence, since eliminated students still sit in the room, requiring you to assert that real anthropic stakes involve the possibility of never having been conscious to observe the loss.
