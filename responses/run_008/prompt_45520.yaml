      *   What goes wrong? Students might collude, or not understand the existence condition. Or the "existence" mechanic is clunky.
      *   *Draft:* Students will likely ignore the existence condition and bet every round, so enforce strict elimination for betting while "dead," and clarify that tokens represent epistemic confidence, not just currency.
