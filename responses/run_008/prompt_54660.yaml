answer: |-
  The chemist's one-liner is a perfect description of the phenomenon but a covert failure of explanation, smuggling in a massive cosmological assumption—the Past Hypothesis—that is neither trivial nor settled.

  Your colleague has conflated the *existence* of the arrow of time with an *account* of it. "You can't unscramble an egg" is the data point, not the theory. To push back fairly, you need to show him that depending on how he interprets that sentence, he is either stating a triviality, invoking a symmetry problem he hasn't solved, or relying on a cosmological postulate he hasn't argued for. Here is the menu of distinct theses hidden inside that proverb, ranked by explanatory weight.

  ### 1. The Phenomenological Claim
  **Thesis:** In actual fact, scrambled eggs do not become unscrambled.
  **Status:** True and Settled.
  **Explanatory Weight:** None.
  This is simply a report of observation. It asserts that event type A (scrambling) occurs and event type B (unscrambling) does not. While true, it offers no mechanism. If a student asks, "Why?" answering "Because it never happens" is circular. This captures the *asymmetry* but explains nothing about *time*; it could equally be a claim about the specific chemical bonds in eggs without implicating the structure of spacetime or memory.

  ### 2. The Statistical Claim (Boltzmann)
  **Thesis:** Unscrambling is physically possible but overwhelmingly improbable given the microstates involved.
  **Status:** True but Symmetric (and thus problematic).
  **Explanatory Weight:** Fails without extra assumptions.
  This is the standard statistical mechanics reading. There are vastly more microstates corresponding to "scrambled" than "unscrambled." However, as Loschmidt objected in the 1870s, the underlying microphysics is time-symmetric. If you apply these statistics purely to the present state of the egg, probability theory tells you the egg is *also* overwhelmingly likely to have been scrambled in the past. This is the "retrodiction problem." If you rely only on this thesis, you cannot conclude the egg *was* unscrambled five minutes ago, only that it *will be* scrambled five minutes from now. This reading alone undermines the reliability of memory and records, suggesting your memories of the egg being whole are likely fluctuations rather than traces of a real past.

  ### 3. The Manipulation Claim (Intervention)
  **Thesis:** Agents can easily construct devices to scramble eggs, but no device can unscramble them without increasing entropy elsewhere.
  **Status:** True, but Derivative.
  **Explanatory Weight:** Moderate, but relies on Thesis 2.
  This addresses your grad student's point about melting ice. You can refreeze water, but only by expending energy and generating heat elsewhere (a freezer hums). The asymmetry of *control*—that we can leave traces on the future but not the past—is real, but it is a consequence of the thermodynamic gradient, not the source of it. If you claim this explains the arrow of time, you risk putting the cart (agency) before the horse (thermodynamics). Agency itself requires a thermodynamic arrow to function (you need a low-entropy source to power the decision-making process).

  ### 4. The Cosmological/Record Claim (Albert/Loewer)
  **Thesis:** The reason we have records of the past (including memories and unscrambled eggs) is that the universe began in a low-entropy state.
  **Status:** Contested (specifically the status of the postulate).
  **Explanatory Weight:** Heavy (this is the only one that works).
  This is the reading you remembered from David Albert. To make the Statistical Claim (Thesis 2) yield the right result (eggs were unscrambled in the past, memories are reliable), you must impose a boundary condition: the **Past Hypothesis**. You must stipulate that the universe started in a very low-entropy macrostate. Once you fix the past end of the gradient, statistical mechanics predicts entropy increases toward the future, validating our records and memories.
  *   **Is it settled?** The *need* for a boundary condition is widely accepted among physicists and philosophers of physics who work on foundations. The *status* of the Past Hypothesis is the lightning rod. Is it a brute fact? A law of nature (as Albert and Loewer argue)? Or a result of inflationary multiverse selection (as Sean Carroll argues)? Your chemist treated the egg proverb as a self-contained explanation, but it only works if the universe itself is "unscrambled" at the Big Bang.

  ### The Bottom Line for Your Seminar
  The consensus among specialists is that thermodynamic asymmetry cannot be derived from microphysics alone; it requires the Past Hypothesis. Your chemist is right that entropy explains the egg, but wrong that the egg explains time. The egg is merely the local evidence of a cosmological condition.

  When you push back, don't attack the entropy claim; attack the completeness of it. Ask him: "If we apply the same statistical reasoning to the past that we apply to the future, doesn't probability theory suggest the egg probably fluctuated into its current scrambled state from a *more* scrambled state five minutes ago? If you say no, you're implicitly assuming the Past Hypothesis, so let's talk about why the universe started in a low-entropy state rather than pretending the egg settles it." That moves the conversation from a proverb to the actual open problem.
