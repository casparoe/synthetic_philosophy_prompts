answer: |-
  You have done the hard work already. Your gut is not contradicting itself; it is correctly sensing the hidden variable in the problem that the standard paradox ignores.

  There is a single principle that unifies all six of your scenarios, solves the "Missing Case," and explains why your brain treats Scenario #2 and Scenario #3 differently.

  ### The Single Rule: **Conditional Probability Depends on the Prior**

  The expected value of switching is not determined by the number in your hand ($x$). It is determined by the probability that $x$ is the **smaller** amount versus the **larger** amount, *given* the mechanism used to fill the envelopes.

  The formula for the expected value of the other envelope is:
  $$E[\text{Other}] = 2x \cdot P(\text{Mine is Small} \mid x) + 0.5x \cdot P(\text{Mine is Large} \mid x)$$

  The paradox in Scenario #2 arises because it silently assumes $P(\text{Mine is Small} \mid x) = 0.5$ for **every possible value of $x$**. Mathematically, this requires a "flat prior" distribution of money over an infinite range, which is impossible (probabilities must sum to 1). In any real game, there must be some amounts where switching is bad to balance the amounts where switching is good.

  Here is how this rule applies to your specific scenarios.

  ---

  ### Analyzing Your Scenarios

  **1. No Peek (Indifferent)**
  *   **Rule:** Without information ($x$), symmetry holds. $P(\text{Small}) = P(\text{Large}) = 0.5$.
  *   **Verdict:** Your gut is right. $E[\text{Other}] = E[\text{Mine}]$.

  **2. Peek $100, Standard Setup (The Trap)**
  *   **Rule:** The pair $(A, 2A)$ was chosen *before* you picked. Seeing $100$ gives you information about which pair was chosen.
  *   **Why the math fails:** To claim the other is $50$ or $200$ with 50/50 odds, you must assume the pair $(50, 100)$ was just as likely to be chosen as $(100, 200)$. If that were true for *every* number, the host would need infinite money. In reality, large numbers become less likely.
  *   **Verdict:** Your gut is right. The 1.25x calculation is invalid because the probabilities aren't actually 50/50 once you condition on $x=100$ without knowing the distribution.

  **3. Host Generates After Peek (The Exception)**
  *   **Rule:** The generative process is different. Here, $x$ is fixed *first*, and the pair is built *around* $x$ by a coin flip.
  *   **Why the math works:** The host explicitly forces $P(\text{Mine is Small} \mid x) = 0.5$ by mechanism, not by inference.
  *   **Verdict:** Your gut is right. This is not the Two Envelopes Problem; this is a coin flip game disguised as envelopes. The 1.25x average is real here.

  **4. Infinite Swapping (The Reductio)**
  *   **Rule:** If switching always adds value, value is not conserved.
  *   **Verdict:** Your gut is right. This proves the logic in #2 must be flawed.

  **5. Known Pair $10/$20, Peek $20 (Certainty)**
  *   **Rule:** The prior is known. If you see $20, $P(\text{Mine is Large}) = 1$.
  *   **Verdict:** Your gut is right. $E[\text{Other}] = 10$. Do not swap.

  **6. Integers, Peek $1 vs $100 (The Boundary)**
  *   **Rule:** The prior has a hard floor ($1).
  *   **At $1:** You cannot hold the larger envelope (since $0.50$ isn't allowed). $P(\text{Mine is Small}) = 1$. Switching is guaranteed to gain.
  *   **At $100:** You are somewhere in the middle of the distribution. You don't know if $100$ is "large" (pair 50/100) or "small" (pair 100/200).
  *   **Verdict:** Your gut is right. At $1$, the prior gives you certainty. At $100$, the prior is ambiguous, so the "always swap" argument smells fishy.

  ---

  ### The Missing Case: Known Distribution
  **Setup:** Pairs are ($50, $100) or ($100, $200). 50% chance of either pair. You peek and see $100.

  **1. Do you swap?**
  Yes. Here is the Bayesian math your gut was looking for in Scenario #2:
  *   There are two ways to see $100:
      1.  The pair is ($50, $100) and you picked the larger envelope. (Prob = $0.5 \times 0.5 = 0.25$)
      2.  The pair is ($100, $200) and you picked the smaller envelope. (Prob = $0.5 \times 0.5 = 0.25$)
  *   Since these probabilities are equal, given that you see $100, it is truly a 50/50 chance that the other envelope is $50 or $200.
  *   $E[\text{Other}] = 0.5(50) + 0.5(200) = 125$.
  *   **Decision:** **Swap.** (Expected gain $25).

  **2. Was peeking worth it?**
  Yes. Peeking allows you to condition your strategy on the value.
  *   **Blind Strategy:** If you never peek, symmetry dictates swapping gains nothing. Expected Value = $112.50.
  *   **Peek Strategy:**
      *   If you see $50: You know you have the small one. **Swap** (get $100).
      *   If you see $200: You know you have the large one. **Stay** (keep $200).
      *   If you see $100: As calculated above, **Swap** (EV $125).
  *   By peeking, you avoid the mistake of swapping away the $200. This information has tangible value.

  ---

  ### Which Gut Verdicts to Keep?

  **Keep them all.** You haven't been contradicting yourself; you've been intuitively performing Bayesian inference without the notation.

  *   You sensed **#2** was a trick because you intuitively understand that money isn't distributed uniformly up to infinity.
  *   You sensed **#3** was honest because the mechanism explicitly defined the odds.
  *   You sensed **#6 ($1)** was a sure thing because you recognized the boundary condition of the prior.

  **The One Correction:**
  In Scenario #2, you said: *"I'm darned if I can find where the argument goes wrong."*
  Here is exactly where: The argument treats $x$ as a **constant** in the equation $0.5(2x) + 0.5(0.5x)$. But $x$ is a **random variable**.
  *   In the $2x$ term, $x$ represents the *smaller* amount.
  *   In the $0.5x$ term, $x$ represents the *larger* amount.
  You cannot average "twice the smaller" and "half the larger" using the same number $x$ unless the probability of holding the smaller amount is independent of the amount itself. That is only true in Scenario #3, not Scenario #2.

  **Summary:** Your gut is smarter than the paradox. The rule is: **You only swap if the specific value you see makes it more likely you hold the smaller envelope than the larger one.** In the standard problem (#2), you can never know that without knowing the host's budget. In your variations (#3, #5, #6, Missing Case), the rules or boundaries give you that information.
