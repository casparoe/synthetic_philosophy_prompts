          *   *Lena:* Priority View = benefits matter more when going to the worse off based on absolute levels, not relative.
          *   *Marcus:* This is just Egalitarianism dodging the Leveling-Down Objection (LDO). Egalitarianism implies a reason to level down (make better off worse off without helping worse off) to eliminate inequality. Priority View claims to avoid this.
          *   *Lena:* Priority View gives *no* reason to make anyone worse off. It passes the LDO test while keeping equality-like intuitions in normal cases.
          *   *Analysis:* This is the classic Parfitian distinction. Parfit explicitly argues Priority View avoids LDO because it is person-affecting (in a sense) or at least non-relational. Egalitarianism (Telic) says inequality is bad *in itself*. If inequality is bad, removing it (even by harming the better off) makes the outcome better in one respect. Priority View says only benefits matter, weighted by priority. Harming someone never adds value.
          *   *Verdict:* Lena is technically correct on the logic of the views. Marcus is correct that the *motivation* often feels similar, but logically, Priority View does escape LDO.

      *   **Move 2: The "Blind Spot" (High-Level Inequality).**
          *   *Marcus:* Priority View has a blind spot. If two people are both well-off, a gap between them registers as morally negligible on the Priority View (because the marginal moral value of benefits to the slightly worse off is low). Egalitarianism says the gap itself is regrettable.
          *   *Lena:* This is a feature. Intuitions about gaps being bad usually stem from envy or unfairness (procedural/desert), not the gap itself. If inequality is deserved/innocent, the intuition evaporates. Priority View matches this; Egalitarianism doesn't.
          *   *Analysis:* Marcus identifies a genuine divergence. Telic Egalitarianism cares about the pattern regardless of absolute levels. Priority View cares about absolute levels. Lena's defense relies on debunking the intuition that inequality *per se* is bad among the well-off. This is a standard defense (the "fairness" vs. "equality" distinction).
          *   *Verdict:* Marcus is right that the views diverge here. Lena is right that many people share her intuition (that inequality among the rich isn't inherently bad), but Marcus is right that *strict* egalitarians deny this. It comes down to foundational intuitions.

      *   **Move 3: Justification of Weights (The "Brute Fact" Objection).**
          *   *Marcus:* Why does the benefit count more? Egalitarianism has a reason (inequality is bad). Priority View just asserts a weighting curve without a rationale. It's "curve-fitting."
          *   *Lena:* All foundational views bottom out. Utilitarianism says suffering is bad *brute*. Demanding more for Priority is special pleading.
          *   *Analysis:* This is a meta-ethical/methodological clash. Marcus wants a *structural* explanation for the weight (relational badness). Lena accepts a *substantive* brute fact (priority weighting). Parfit himself acknowledged Priority View might be a brute truth. Lena's analogy to Utilitarianism is strong (hedonic value is often taken as brute).
          *   *Verdict:* Lena has the stronger methodological point (foundational principles are always brute somewhere), but Marcus has a point about explanatory depth (Egalitarianism explains *why* we care about the worse off via relation, Priority just says *do*).

  3.  **Synthesize the "Leveling-Down" Specific Question:**
      *   Does Priority View escape LDO cleanly? Yes, logically.
