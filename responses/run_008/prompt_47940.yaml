prompt: |-
  Quick context: I'm an econometrics grad student, and my advisor loves quoting Milton Friedman's line from his 1953 methodology essay -- the one people call the F-twist -- that "the more significant a theory, the more unrealistic the assumptions." Last week I showed him a demand model where I'd added heterogeneity in price sensitivity, because the homogeneous version was clearly mispredicting for one segment of consumers, and he just waved it off with the Friedman line and told me to keep the model simple. I know this essay got fought over for decades, but I can't actually pin down what the slogan is claiming well enough to argue back.

  Act as a philosopher of science who specializes in idealization and modeling in economics. Please think carefully before answering -- brainstorm the space of possible readings first rather than just running with the most famous one -- and then lay out, as a numbered menu I could literally bring to a meeting with him, the distinct precise theses that one sentence could be expressing. I'd want the menu to include at least:

  - readings that are more or less trivially true (e.g., something that follows just from significant theories covering broader classes of phenomena and therefore having to abstract more),
  - readings that are substantive but defensible (e.g., something about predictive performance being the only relevant test, with the descriptive accuracy of assumptions being irrelevant or even inversely relevant to a theory's value),
  - readings that are flat-out false or crazy (e.g., that adding realistic detail always makes a theory worse, or that you can read significance OFF of unrealism rather than the other way around).

  For each reading give me a verdict: is it plausible, and -- this is the part I care about most -- would it actually support the use my advisor put it to, i.e., dismissing my heterogeneity extension without engaging with the evidence that it predicts better? I suspect the inference from the slogan to "ignore superior predictions from a refinement" fails on every reading, but I want you to check whether the strongest reading gets him even partway, and where exactly the gap is. If some readings would license his move only under extra conditions -- like claims about the domain of validity of the original model, or the negligibility of what I added -- please spell those out, because that might be the honest version of what he's asserting. And if Friedman's own arguments in the essay (the ones about how a truly realistic theory of the wheat market would have to include the eye color of traders, etc.) support some readings better than others, flag that too, so I know which one my advisor is probably smuggling in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

