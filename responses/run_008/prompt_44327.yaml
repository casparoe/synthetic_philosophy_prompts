prompt: |-
  I'm a PhD student in a department where metaethics is basically treated as a solved nuisance, and next term I have to finally write the paper my supervisor keeps assigning me on expressivism and the Frege-Geach problem. Rather than diving straight into the Blackburn/Gibbard literature and the back-and-forth it spawned, I want to get the specification right first, because my suspicion is that half the disputes in that literature are really disputes about what an expressivist theory is for. So: write me the desiderata. What does an expressivist account of moral language have to actually deliver to count as adequate? I'm thinking of things like: it has to explain the validity of the classic argument -- if lying is wrong, getting your little brother to lie is wrong; lying is wrong; therefore getting your little brother to lie is wrong -- without treating the moral vocabulary as plain truth-conditional, and the same goes for embedding under negation, disjunction, belief reports ("she thinks lying is wrong"), and straight questions. It needs compositionality in some form, since the whole problem is that "lying is wrong" seems to have one meaning inside a conditional and outside it. And it presumably still has to earn its keep on the things that motivated expressivism in the first place -- explaining genuine moral disagreement without disagreement about facts, and the connection between sincere moral judgement and motivation.

  For each requirement, give the case or consideration behind it, and mark which ones you think are non-negotiable versus which are just prejudices of particular camps (I have a feeling, e.g., that "must not collapse into simple subjectivism about wrongness" does a ton of quiet work that people never examine). Then the part I most want: flag any pairs or subsets of the desiderata you suspect can't be jointly satisfied — including the creeping worry that a view that satisfies the compositional and logical requirements plus a minimalist theory of truth ends up indistinct from realism, such that "stays recognisably expressivist" may itself be a desideratum in tension with the others. Is that last one a genuine adequacy condition or just terminological gatekeeping? Say what you actually think, dont hedge. And no scorecard of Blackburn vs Gibbard vs anyone else, I'll do that in the paper itself -- I just want the list, with the reasoning behind each entry laid out seperately.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (metaethics focus).
      *   **Context:** Department treats metaethics as "solved nuisance." Supervisor keeps assigning a paper on expressivism and the Frege-Geach (F-G) problem.
      *   **Goal:** Wants to get the *specification* right before diving into literature (Blackburn, Gibbard, etc.). Suspects disputes are often about what expressivism is *for*.
      *   **Task:** Write the *desiderata* for an adequate expressivist account of moral language.
      *   **Requirements:**
          *   List the requirements (validity, embedding, compositionality, motivation/disagreement, etc.).
          *   For each: Give the case/consideration behind it.
          *   Mark as "Non-negotiable" vs. "Camp Prejudice."
          *   **Crucial:** Flag incompatibilities/tensions between desiderata (especially the "collapse into realism" worry).
          *   **Tone:** Direct, no hedging, no scorecard of specific authors (Blackburn/Gibbard/etc.), focus on the structural constraints.
          *   **Specific Question:** Is "stays recognisably expressivist" a genuine adequacy condition or terminological gatekeeping?

  2.  **Deconstruct the Desiderata:**
      *   *Logic/Validity:* The core F-G problem. Moral arguments must be valid.
      *   *Embedding/Compositionality:* Moral sentences appear in conditionals, negations, belief reports, etc. Meaning must be stable across contexts.
      *   *Motivation/Internalism:* The original selling point. Judgement $\rightarrow$ Motivation.
      *   *Disagreement:* Explaining how we disagree without disagreeing about facts.
      *   *Truth/Realism Avoidance:* Not positing robust moral properties/facts (the "anti-realist" core).
      *   *Cognitive/Propositional Surface:* Moral language *looks* like factual language (truth-apt).

  3.  **Evaluate "Non-negotiable" vs. "Prejudice":**
      *   *Logic/Validity:* Non-negotiable. If it can't explain validity, it fails as a theory of language/logic.
      *   *Embedding:* Non-negotiable. Natural language does this; theory must account for it.
      *   *Motivation:* Tricky. Strong internalism is often cited as the *motivation* for expressivism, but is it a condition of *adequacy* for the semantic theory? If the semantic theory works but allows for amoralists, is it still expressivism? I'd argue it's a "Core Motivation" but maybe not a strict semantic constraint *if* the semantics is robust. However, for the *project* of expressivism, it's essential. Let's classify it as "Foundational Motivation" (non-negotiable for the *label*, but maybe negotiable for the *semantics* if quasi-realism succeeds). Actually, better to call it a "Explanatory Target."
      *   *Anti-Realism:* This is the definition of the view. Non-negotiable for *expressivism*, but is it a condition of *adequacy*? If the best theory is realist, expressivism fails. So, for an expressivist theory to be *adequate as expressivism*, it must not be realism.
      *   *Compositionality:* Non-negotiable for any semantic theory.

  4.  **Identify Tensions/Incompatibilities:**
      *   *The "Collapse" Problem:* If you solve F-G by giving moral sentences truth-conditions (minimalist), and you explain motivation via pragmatic norms, do you just become a minimalist realist? (The "Creeping Minimalism" worry).
      *   *Internalism vs. Embedding:* If "Wrong" expresses a conative state, what does "If lying is wrong..." express? You aren't expressing the state in the antecedent. Solving this often requires making the content propositional, which threatens the anti-realist commitment.
      *   *Disagreement vs. Attitude:* If disagreement is clash of attitudes, how is it rational? If it's rational, do attitudes have correctness conditions? If yes, are those facts?

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the student's insight (disputes are often about aims). Set the stage.
      *   **The Desiderata List:**
          1.  *Logical Validity (The F-G Core).*
          2.  *Semantic Compositionality (Embedding).*
          3.  *The Internalist Connection (Motivation).*
          4.  *Genuine Disagreement (Clash without Fact).*
          5.  *Anti-Realist Ontology (No Robust Properties).*
      *   **Classification (Non-negotiable vs. Prejudice):**
          *   Logic/Compositionality: Non-negotiable (linguistic data).
          *   Internalism/Disagreement: Foundational (why we care).
          *   Anti-Realism: Definitional (but see tension).
      *   **The Tensions (The Meat):**
          *   *Tension 1: Logic vs. Anti-Realism.* Solving logic usually requires truth-aptitude. Truth-aptitude + Minimalism = Realism?
          *   *Tension 2: Internalism vs. Embedding.* Attitudes don't embed well. Propositions do. Choosing propositions kills the distinctive psychological claim.
          *   *Tension 3: Disagreement vs. Attitude.* Clash of desires isn't disagreement. Clash of beliefs requires facts.
      *   **The "Gatekeeping" Question:** Is "staying expressivist" a real constraint?
          *   *Verdict:* It's gatekeeping *unless* "expressivism" is defined by a specific explanatory gap (the gap between is and ought). If the theory bridges the gap so well the gap disappears, the label doesn't matter, but the *explanatory cost* matters.
      *   **Conclusion:** Direct advice on how to frame the paper.

  6.  **Refining the Tone:**
      *   The user said: "Say what you actually think, dont hedge."
      *   Avoid "Some philosophers argue..." unless necessary for context. Take a stance.
      *   Avoid "Blackburn says X, Gibbard says Y." Keep it structural.
      *   Acknowledge the "solved nuisance" culture but validate the student's suspicion that it's *not* solved, just ignored.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include belief reports and questions? *Yes, under Embedding.*
      *   *Check:* Did I address the "collapse into realism" worry specifically? *Yes, this is the big tension.*
      *   *Check:* Is the distinction between "Non-negotiable" and "Prejudice" clear? *Need to make sure I don't just call everything non-negotiable.*
      *   *Refinement on "Prejudice":* The idea that expressivism *must* deny truth-aptness is a prejudice (due to minimalism). The idea that it *must* explain motivation is core.
      *   *Refinement on "Gatekeeping":* Be bold. It *is* gatekeeping, but it signals a failure of the project's unique selling proposition.

  8.  **Final Polish:** Ensure the structure matches the prompt's request for "the list, with reasoning... laid out separately" and then the tensions. (Actually, the prompt asks for the list with reasoning for each entry, marking N/N vs Prejudice, *then* flag the tensions). I will follow that structure.

      *   *Structure:*
          1.  Intro (validating the approach).
          2.  The Desiderata (Item, Case, Status).
          3.  The Incompatibilities (The "Hard Problems").
          4.  The "Gatekeeping" Verdict.

      *   *Voice:* Senior colleague/mentor. Direct, slightly cynical about the field's "solved" status, rigorous.

      *(Self-Correction on the "Non-negotiable" classification)*: I need to be careful. Is "Anti-Realism" non-negotiable? If a theory satisfies everything else but posits robust facts, it's Realism, not Expressivism. So for an *Expressivist* theory, it is non-negotiable. But is it a desideratum for a *correct metaethical theory*? No. The prompt asks what an *expressivist account* has to deliver to count as *adequate*. So, within the constraints of the project, Anti-Realism is a constraint. I will frame it as "Definitional Constraint."

      *(Refining the "Collapse" argument)*: The user specifically mentioned "minimalist theory of truth ends up indistinct from realism." I need to address this head-on in the tensions section. This is the "Quasi-Realist Dilemma."

      *(Final check on "Say what you actually think")*: I should explicitly state that the "solved nuisance" attitude is wrong because the F-G problem reveals a deep tension in the philosophy of language, not just a technical glitch.

      *Let's write.*
answer: |-
  You are right to suspect that the literature is often a dialogue of the deaf. The Frege-Geach (F-G) problem is not merely a technical glitch in a semantic engine; it is a stress test for the coherence of the entire expressivist project. If your department treats metaethics as a "solved nuisance," they are likely treating quasi-realism as a successful patch without inspecting the structural load-bearing walls.

  Here is the specification list you asked for. I have stripped out the author-specific machinery. These are the structural constraints any view calling itself "expressivist" must satisfy to be adequate.

  ### I. The Desiderata

  **1. Logical Validity Preservation**
  *   **The Case:** Moral reasoning works. The argument "If lying is wrong, getting your brother to lie is wrong; lying is wrong; therefore getting your brother to lie is wrong" is valid. An adequate theory must explain *why* it is valid without cheating. It cannot simply stipulate validity; it must show how the meaning of the constituents guarantees the preservation of truth (or whatever the expressivist analogue is) from premises to conclusion.
  *   **Status:** **Non-negotiable.** If a semantic theory renders valid arguments invalid (or valid for the wrong reasons), it fails as a theory of language. This is the baseline constraint of the F-G problem.

  **2. Semantic Compositionality (Embedding)**
  *   **The Case:** Moral sentences appear in unasserted contexts: conditionals, negations, disjunctions, belief reports ("John believes lying is wrong"), and questions ("Is lying wrong?"). The meaning of "lying is wrong" must remain stable whether it is asserted or embedded. If "wrong" expresses an attitude in an assertion but something else in a conditional, you have ambiguity, and the validity of modus ponens collapses.
  *   **Status:** **Non-negotiable.** This is a requirement of any plausible philosophy of language. Natural language is productive and recursive; a semantic theory that cannot handle embedding is empirically false.

  **3. The Internalist Connection (Motivation)**
  *   **The Case:** This is the primary *motivation* for adopting expressivism. A sincere moral judgment ("X is wrong") must have a necessary or conceptual connection to a motivational state (a desire, plan, or commitment) in the agent. Realism struggles to explain why knowing a fact *moves* you. Expressivism claims to solve this by making the judgment *constituted* by the motivation.
  *   **Status:** **Foundational Motivation (effectively Non-negotiable for the label).** If the theory severs the link between judgment and motivation, it loses its primary explanatory advantage over realism. However, it is often treated as a psychological add-on rather than a semantic constraint, which is a mistake. If the semantics doesn't reflect this, the view is just realism with a psychological postscript.

  **4. Genuine Disagreement without Factual Conflict**
  *   **The Case:** When two people argue about abortion, they are disagreeing, not just talking past each other. However, expressivism denies there are moral facts for them to disagree *about*. The theory must explain how two people can be in a state of genuine conflict (incompatibility) without one of them misrepresenting the world.
  *   **Status:** **Non-negotiable.** If the theory reduces disagreement to "I like this"/"I like that" (simple subjectivism), it fails to capture the normativity of moral discourse. The conflict must be rational, not merely causal.

  **5. Anti-Realist Ontology (No Robust Properties)**
  *   **The Case:** Expressivism is adopted to avoid the metaphysical and epistemological baggage of realism (queer properties, mysterious access). The theory must not posit moral properties or facts as part of the "furniture of the world" in a robust, causal, or mind-independent sense.
  *   **Status:** **Definitional Constraint.** This is what makes the view expressivism rather than realism. However, see Tension #1 below regarding how "robust" is defined.

  **6. Truth-Aptness (Surface Grammar)**
  *   **The Case:** Moral sentences behave syntactically like truth-apt assertions. We say "It is true that lying is wrong." We negate them, quantify over them, and embed them in propositional attitude reports. The theory must account for this surface grammar without treating it as a systematic error (error theory).
  *   **Status:** **Non-negotiable (Linguistic Data).** You cannot tell speakers they are speaking nonsense. The theory must vindicate the practice.

  ---

  ### II. The Incompatibilities (The "Hard Problems")

  Here is where the "solved nuisance" attitude falls apart. These desiderata are not easily jointly satisfied. In fact, satisfying the semantic constraints often threatens the metaphysical ones.

  **Tension 1: The "Creeping Minimalism" Collapse (Logic vs. Ontology)**
  *   **The Conflict:** To satisfy **Logical Validity** and **Embedding**, you need moral sentences to have propositional content that can be true or false. Most modern expressivists (quasi-realists) solve this by adopting a *deflationary* or *minimalist* theory of truth. They argue that "It is true that lying is wrong" just means "Lying is wrong."
  *   **The Problem:** If you have truth-apt sentences, propositional content, and a minimalist truth predicate, what distinguishes this from Realism? A minimalist realist says exactly the same things about truth and logic.
  *   **The Verdict:** If the expressivist solves the F-G problem fully by embracing minimalism, they risk satisfying **Desideratum 1 & 2** only by sacrificing **Desideratum 5**. The view becomes extensionally equivalent to realism. The only difference left is a historical story about "what the judgment is made of" (attitude vs. belief). But if the functional role is identical, is the metaphysical distinction doing any work? This is the "Collapse" worry. It suggests you can have Logic or Anti-Realism, but perhaps not both in a robust sense.

  **Tension 2: The Embedding of Attitudes (Compositionality vs. Internalism)**
  *   **The Conflict:** **Desideratum 3** says moral judgments are constituted by conative states (desires/plans). **Desideratum 2** says these sentences embed in conditionals.
  *   **The Problem:** In "If lying is wrong...", the speaker is not expressing a conative state about lying. They are hypothesizing. If the meaning of "wrong" is *exhausted* by the expression of an attitude, the antecedent has no meaning. If the meaning is *not* exhausted by the attitude (i.e., it has a propositional content that can be hypothesized), then the link to motivation (**Desideratum 3**) becomes contingent rather than constitutive.
  *   **The Verdict:** You cannot have a semantics where the meaning *is* the attitude and also allow that meaning to embed logically. You must separate the *content* from the *state*. But once you separate content from state, you have opened the door for the content to exist without the state (amoralism) or for the content to be belief-like. This threatens the Internalist constraint.

  **Tension 3: Rational Disagreement vs. Clash of Attitudes (Disagreement vs. Ontology)**
  *   **The Conflict:** **Desideratum 4** requires rational disagreement. **Desideratum 5** denies moral facts.
  *   **The Problem:** If I desire X and you desire not-X, we have a clash, but not a disagreement in the truth-conditional sense. For it to be a *rational* disagreement, there must be a standard of correctness outside our attitudes. If there is a standard of correctness, is that not a fact? If expressivists posit "normative facts" that are not "realist facts," they are engaging in obscurantism.
  *   **The Verdict:** Explaining rational disagreement usually requires positing correctness conditions. Positing correctness conditions looks suspiciously like positing truth conditions. Positing truth conditions looks like realism.

  ---

  ### III. The Gatekeeping Question

  You asked: *Is "stays recognisably expressivist" a genuine adequacy condition or just terminological gatekeeping?*

  **My verdict: It is terminological gatekeeping, but it signals a theoretical failure.**

  Here is the unvarnished truth: If a theory satisfies Logic, Embedding, Truth-Aptness, and explains Disagreement via correctness conditions, it does not matter if you call it "Expressivism" or "Minimalist Realism." The label is irrelevant to the adequacy of the metaethical account.

  However, the *reason* we care about the label is that Expressivism was sold as a solution to the metaphysical and epistemological anxieties of Realism. It promised to give us moral truth without moral *facts* (in the robust sense) and moral knowledge without mysterious *access*.

  If the only way to solve the F-G problem (Logic/Embedding) is to adopt a theory of truth and content that is indistinguishable from Realism, then Expressivism has failed in its *mission*, even if it succeeds as a *semantic theory*. It has saved the phenomena of moral language at the cost of its own raison d'être.

  Therefore, "Stays recognisably expressivist" should not be a desideratum of *semantic adequacy*. It should be a desideratum of *theoretical distinctiveness*. If your theory solves F-G but collapses into realism, you have written a great paper in metaethics, but you have not defended expressivism. You have defended realism and shown that expressivists can talk like realists.

  **Recommendation for your paper:**
  Do not try to solve F-G by showing how expressivism *can* look like realism. That is the quasi-realist move that leads to the collapse worry. Instead, frame your paper around the tension between **Desideratum 1 (Logic)** and **Desideratum 5 (Anti-Realist Ontology)**. Argue that the cost of solving F-G is the erosion of the view's distinctive metaphysical profile.

  The "solved nuisance" crowd assumes the quasi-realist patch worked. Your job is to show that the patch covers the hole but changes the color of the shirt so completely that it's no longer the same shirt. That is a genuine philosophical problem, not a technicality.
