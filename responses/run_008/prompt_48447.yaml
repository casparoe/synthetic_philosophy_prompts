          *   *Refinement:* Supervaluationism says "It is a heap OR it is not a heap" is true, even if "It is a heap" is neither. This is tricky in chemistry. In chemistry, if we can't decide, we report "< LOD". We don't say "Either it's above or below" is a meaningful result in the same way.
