      *   *Caution:* Don't patronize. The user knows their stuff. Speak to the *limits* of the stuff they know.
      *   *Key Insight:* The Sorites paradox isn't about noise; it's about tolerance. If I add 1 grain, the status *cannot* change. Epistemicism says it *does* change, we just don't know when. Supervaluationism says the status is undefined.
      *   *Measurement Analogy:*
          *   Epistemicism: The switch flips at grain $N$, but our sensor has hysteresis or noise.
          *   Supervaluationism: The switch is a "fuzzy logic" gate, or better, there are many valid switches, and we haven't picked one.
      *   *The "Residue":* The big missing piece is *normativity*. Why *should* we call this a heap? Chemistry deals with *is*. Philosophy deals with *is* + *means*.

  8.  **Final Polish:** Check against the "Strict Rule." Did I assume true values in the Supervaluation translation? I must ensure I describe it as a range of *definitions*, not a range of *values* for a single definition.
