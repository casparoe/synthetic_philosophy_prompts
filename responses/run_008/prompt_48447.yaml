      *   **Supervaluationism:** Vague predicates *do not* have a single sharp boundary. There are many "admissible precisifications" (ways to make the term precise). A statement is "super-true" if it's true on *all* admissible precisifications. Borderline cases are neither true nor false (truth-value gaps), but classical logic (like excluded middle) can still hold in a specific sense.

