      *   *Critique:* This instinct is partially right but misses the metaphysical weight.
      *   *Williamson's Claim:* It's not just that we can't measure it; it's that reality *is* sharp. Chemistry assumes reality is continuous or discrete but measurable. Vagueness suggests the *concept* doesn't map to reality neatly.
      *   *Sorites vs. Error Propagation:* Error propagation assumes a function $y = f(x)$. Sorites challenges the function itself.
