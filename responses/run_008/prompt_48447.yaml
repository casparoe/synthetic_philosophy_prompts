      *   *Wait, one nuance:* Supervaluationism preserves classical logic (Excluded Middle holds). "Either heap or not heap" is true. But "It is a heap" is indeterminate. In chemistry, "Either above LOD or below LOD" is always true physically, even if we can't measure it. This actually aligns well with Epistemicism, not Supervaluationism. Supervaluationism says the *truth condition* itself is gappy. This is hard to map to binary detection. I need to highlight this difficulty in the Residue.

