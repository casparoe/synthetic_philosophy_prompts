answer: |-
  You have put your finger on a genuine and pervasive structural feature of political rhetoric, and your intuition that standard fallacy labels (No True Scotsman, Motte-and-Bailey) are insufficient is correct. Those labels describe *defensive* maneuvers by an individual arguer under pressure. What you are describing is a *constructive* cultural practice that operates proactively to build a premise. It is systemic, diachronic (across time), and often unconscious.

  As a philosopher of political concepts, I can tell you there is no single, canonical term in the analytic tradition that captures this *exact* configuration. However, there are three established concepts that, when layered together, describe the machinery you've spotted. I will outline those, explain where they fall short of your description, and then offer a coined term that sharpens the definition for your purposes.

  ### The Established Concepts (The Layers)

  To understand this phenomenon academically, you would typically find it discussed at the intersection of historiography, semantics, and political ontology.

  **1. Whig Historiography (The Narrative Engine)**
  Coined by Herbert Butterfield in 1931, "Whig History" describes the tendency to interpret the past as an inevitable progression toward the present (specifically, toward liberal democracy and Protestantism).
  *   **The Map:** This explains *why* the selection happens. The "West" is treated not as a geographical or historical fact, but as a protagonist in a story of moral progress.
  *   **The Gap:** Whig History is a critique of *how historians write*. Your observation is about *how pundits argue*. A historian might write Whig history quietly; a pundit uses it as a weaponized premise in real-time. Whig History explains the bias, but not the rhetorical *oscillation*.

  **2. The Mythologies of Coherence and Prolepsis (The Logical Error)**
  The Cambridge School of intellectual history, particularly **Quentin Skinner**, identified specific "mythologies" that arise when we study past ideas.
  *   **Mythology of Coherence:** The assumption that a culture or thinker's body of work is more consistent than it actually is. (e.g., "The West values freedom," ignoring that "The West" also valued feudalism).
  *   **Mythology of Prolepsis:** Attributing present-day intentions or values to past actors who could not have held them. (e.g., Claiming the Founding Fathers fought for "human rights" in the modern sense, rather than property rights for white men).
  *   **The Map:** This explains the *local defensibility* you noticed. Each claim ("The Romans valued law!") is technically true, but the *aggregation* implies a coherence that didn't exist.
  *   **The Gap:** Skinner was analyzing scholars, not political combatants. He didn't focus on the *moral exclusion* aspect (the "that wasn't the *real* West" move regarding slavery).

  **3. Persuasive Definition (The Rhetorical Tool)**
  Proposed by **C.L. Stevenson** (1938), this occurs when a speaker redefines a term's descriptive meaning to alter its emotive impact without changing the emotive meaning itself.
  *   **The Map:** This captures the *goal*. You want "The West" to retain its positive emotional glow (Freedom! Civilization!) while silently altering the descriptive criteria to exclude the Inquisition.
  *   **The Gap:** Stevenson's concept is usually synchronic (happening in one conversation). Your observation is *diachronic*—the definition shifts over centuries, inherited by new speakers who don't realize they are shifting it.

  ### The Coinage: "Diachronic Gerrymandering"

  Since no single established term captures the *temporal boundary-shifting for normative gain*, I propose we call this **Diachronic Gerrymandering**.

  In political science, gerrymandering is the manipulation of electoral district boundaries to ensure a desired outcome. In **Diachronic Gerrymandering**, the "district" is History, and the "boundaries" are the criteria for membership in a cultural category.

  **Definition:**
  > **Diachronic Gerrymandering** is a rhetorical strategy wherein the historical boundaries of a civilizational or cultural category are silently adjusted across time to maximize the inheritance of normative virtues and minimize the inheritance of normative vices. Unlike the "No True Scotsman" fallacy, which is a defensive retreat to protect a universal claim from a counterexample, Diachronic Gerrymandering is a constructive process that builds a moral premise by curating a lineage.

  **The Mechanism (The "Carve"):**
  1.  **The Hook:** The arguer posits a category (e.g., "The West," "Judeo-Christian Tradition") as a coherent historical agent.
  2.  **The Selection (Virtue):** Events or ideas that align with the arguer's current values are claimed as *causal products* of the category. (e.g., "Democracy is a Western invention.")
  3.  **The Exclusion (Vice):** Events or ideas that contradict those values are framed as *external infections*, *aberrations*, or *failures to live up to* the category. (e.g., "Slavery was a betrayal of Western values," rather than "Slavery was an economic engine of the West.")
  4.  **The Premise:** The category is now treated as a moral authority *because* of this curated history, allowing the arguer to say, "To support X is to support the West."

  ### Why This Isn't "No True Scotsman" or "Motte-and-Bailey"

  It is crucial for your character's voice to understand why this feels different from standard fallacies.

  *   **Vs. No True Scotsman:** The Scotsman fallacy is reactive. ("No Scotsman puts sugar on porridge." "But Angus does!" "Well, no *true* Scotsman.") It happens *after* a counterexample is raised. Diachronic Gerrymandering is proactive. The exclusion of the Inquisition or Colonialism is often baked into the definition *before* the debate starts. The speaker isn't retreating; they are occupying ground they quietly prepared in advance.
  *   **Vs. Motte-and-Bailey:** In a Motte-and-Bailey, the arguer swaps between a defensible triviality (the Motte) and a controversial claim (the Bailey). In Diachronic Gerrymandering, *both* the "Good West" and the "Not-Real-West" claims are controversial historical theses. Claiming the Crusades weren't "Western" is just as bold as claiming they were. The trick isn't retreating to safety; it's manipulating the *continuity* of the subject.

  ### The Mirror Image (The Critical Version)

  You correctly noted the inverse: critics who define the West as *essentially* colonial/racist, treating democracy/human rights as accidental or borrowed.
  *   **Does this count?** Yes. Under **Diachronic Gerrymandering**, the valence (positive/negative) doesn't matter; the *mechanism* does.
  *   **The Critical Move:** "The Enlightenment wasn't truly Western; it was an anomaly in a history of racism."
  *   **The Mechanism:** Here, the "essence" of the category is defined by its sins. Virtues are gerrymandered *out* as exceptions; vices are gerrymandered *in* as the rule.
  *   **Why it fits:** Both sides treat "The West" as a coherent moral agent with a fixed essence, and both sides manipulate the historical record to ensure the essence matches their moral conclusion.

  ### Testing the Term: "Judeo-Christian," "The Islamic World," "African Culture"

  You asked where the edges get blurry. Here is how you can test if a specific argument counts as Diachronic Gerrymandering or just a standard historical claim.

  **1. "Judeo-Christian Values"**
  *   **The Gerrymander:** High. This term often merges two distinct traditions to claim a lineage of "religious tolerance" or "individualism" that neither tradition historically prioritized in the modern sense. When speakers claim "Judeo-Christianity gave us human rights," they are often gerrymandering out the Inquisition, religious wars, and theological exclusivism as "failures to live up to" the tradition, while claiming the Reformation as its "true" peak.
  *   **Verdict:** Classic Diachronic Gerrymandering.

  **2. "The Islamic World"**
  *   **The Gerrymander:** High (from both insiders and outsiders).
      *   *Outsiders:* Often define "Islamic World" by its most extremist political movements (ISIS, etc.), treating the Golden Age of science or Sufi mysticism as "cultural" rather than "Islamic."
      *   *Insiders:* Often define "Islamic World" by the Quranic ideals of charity and justice, treating sectarian violence or authoritarianism as "un-Islamic" (betrayals) rather than historical products of the tradition.
  *   **Verdict:** Fits the pattern. The boundary shifts to protect the moral valuation.

  **3. "African Culture" / "Ubuntu"**
  *   **The Blur:** This is where it gets tricky. When marginalized groups reclaim a category, is it Gerrymandering or **Conceptual Recovery**?
      *   *The Distinction:* If a speaker says, "African culture is essentially communal," are they ignoring historical African authoritarianism or slavery? If yes, it's Diachronic Gerrymandering. However, if they are arguing against a *previous* gerrymander that defined Africa as "essentially savage," they might be engaging in **Strategic Essentialism** (a term coined by Gayatri Spivak).
      *   *The Edge:* Strategic Essentialism is a conscious, temporary political tool. Diachronic Gerrymandering is often an unconscious rhetorical habit. If your character does it unthinkingly to claim moral high ground, it's Gerrymandering. If a character does it consciously to build solidarity against oppression, it's Strategic Essentialism. The *mechanism* is the same; the *awareness and power dynamic* differ.

  ### How to Write the Character

  To make your pundit authentic, he shouldn't sound like he's lying. He should sound like he's *remembering*.

  *   **Don't have him say:** "We need to exclude the Crusades from our definition."
  *   **Do have him say:** "When we look at the arc of Western history, the Crusades stand out as a dark deviation from our core commitment to reasoned discourse."
  *   **The Tell:** The phrase "core commitment" or "essential character" is the trigger. He is asserting an essence that allows him to prune the history.
  *   **The Blind Spot:** He should be genuinely baffled when someone points out the contradiction. "But the Inquisition wasn't *us*. It was a corruption." To him, the gerrymandering is invisible because the category ("Us") is defined by the virtue, not the geography or bloodline.

  ### Summary for your Toolkit

  *   **Established Roots:** Whig Historiography (Butterfield), Mythology of Coherence (Skinner), Persuasive Definition (Stevenson).
  *   **The Coinage:** **Diachronic Gerrymandering**.
  *   **The Definition:** Manipulating the historical boundaries of a cultural category to inherit virtues and disown vices.
  *   **The Test:** Does the definition of the category shift silently to ensure the moral conclusion matches the premise?
  *   **The Distinction:** It is proactive (building a premise), not reactive (defending a claim like No True Scotsman).

  This gives you a precise philosophical handle on a phenomenon that most people feel but can't name. It allows your character to be intelligent and locally consistent, yet globally manipulative—which is far more terrifying than a simple liar.
