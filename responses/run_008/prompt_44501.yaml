prompt: |-
  I run a team of content reviewers at a mid-sized social platform, and a growing share of our queue is reports filed against conspiracy content. Our current internal guidance is a list of banned topics, which fails constantly: it catches old, well-documented claims as "conspiracies" and misses novel ones, and it gives us nothing to say on appeal except that the topic is on the list. I want to replace it with something principled — a decision procedure grounded in what philosophers of science and epistemologists have actually worked out about when conspiracy claims are warranted and when they are not — but usable by reviewers who have two minutes per item, no subject-matter expertise, and whose removal decisions can be appealed and end up in my lap.

  The philosophical ideas I'd want the procedure to operationalize, roughly: the thought that a conspiracy claim is epistemically suspect not because conspiracies never happen (they obviously do — companies bury trial data, governments run covert programs) but because of structural features like the mismatch between the size of the posited conspiracy and what it explains, the implausibility of large secrets holding over time, the tendency of the claim to absorb counterevidence by positing further conspirators, and the shift from specific falsifiable allegations to a general posture of distrust. But I am not the expert; use whatever is actually load-bearing in the literature.

  Please write the procedure itself: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a remove, label, or leave-alone, and where it must stop and hand off to a human because the question is one of values or context rather than epistemic structure. It should distinguish, explicitly, between the content of a claim (which can be warranted) and the reasoning pattern around it (which can be conspiracist even when the claim happens to be true), since our policy treats those differently. It should also be honest about which steps are judgment calls dressed up as procedure, and about the characteristic ways it will misfire.

  Then run it on three cases from our actual queue, lightly disguised:

  First, a post alleging that a pharmaceutical company suppressed adverse-event data on a specific drug, citing the company's prior regulatory fines, with some figures that look plausibly sourced and some that look invented. This is the hard one: the pattern matches both the worst conspiracist material we see and the documented history of this industry, and I suspect the procedure will have to output something other than remove, which I'll need to defend to my management.

  Second, a video claiming that a recent building collapse in a nearby country was orchestrated rather than accidental, produced within hours of the event, which argues from the fact that officials initially said little and asks why they would withhold information if they had nothing to hide.

  Third, a post asserting that a well-known historical assassination involved a second shooter, argued carefully, citing decades-old witness statements, and conceding points that count against it.

  For each, show the procedure's path step by step, and flag where two reviewers following it in good faith could still diverge. Finally, tell me what the procedure cannot do — the kinds of reports it should not be run on at all, and what I should say in an appeal when the honest answer is that our rules are about a platform's values and not about truth.
reasoning: |-
  Here's a thinking process that leads to the suggested content moderation procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager of a content review team at a mid-sized social platform.
      *   **Problem:** Current "banned topics" list for conspiracy content is failing (false positives on old/well-documented claims, false negatives on novel claims, poor appeal defense).
      *   **Goal:** A principled decision procedure grounded in philosophy of science/epistemology (specifically regarding conspiracy theories) but usable by non-expert reviewers (2 mins/item).
      *   **Key Philosophical Concepts to Operationalize:** Proportionality (size of conspiracy vs. explanation), Secrecy Plausibility (can large secrets hold?), Immunity to Evidence (absorbing counterevidence), Falsifiability vs. General Distrust.
      *   **Distinction:** Content (claim) vs. Reasoning Pattern (conspiracist style).
      *   **Requirements:** Step-by-step questions, termination points (Remove/Label/Leave/Handoff), honesty about judgment calls/failure modes, application to three specific cases, limitations section.

  2.  **Theoretical Foundation (Philosophy of Science/Epistemology):**
      *   *Reference Points:* Karl Popper (falsifiability), Imre Lakatos (research programmes/degenerating shifts), C. Thi Nguyen (echo chambers/epistemic bubbles), Quassim Cassam (vice epistemology), Brian L. Keeley (theory of conspiracy theories), Charles Pigden (defending some conspiracies).
      *   *Core Insight:* It's not the *existence* of a conspiracy that makes a theory bad; it's the *epistemic hygiene* of the argument. Good conspiracy theories look like investigations; bad ones look like faith systems.
      *   *Key Markers of "Conspiracism" (the style):*
          1.  **Unfalsifiability:** Evidence against the theory is treated as evidence *for* it (the "cover-up" move).
          2.  **Disproportionate Agency:** Attributing massive, perfect coordination to disparate groups without mechanism.
          3.  **Anomaly Hunting:** Focusing on tiny inconsistencies to overturn massive established frameworks without a coherent alternative.
          4.  **Self-Sealing:** The theory protects itself from revision.

  3.  **Drafting the Procedure (The "Epistemic Hygiene Checklist"):**
      *   *Constraint:* Reviewers have 2 minutes. No PhDs.
      *   *Structure:* Funnel approach. Easy checks first, harder judgment calls later.
      *   *Steps:*
          1.  **Claim Identification:** Is this actually a conspiracy claim? (Distinguish from opinion/reporting).
          2.  **Evidence Engagement:** Does the post engage with counter-evidence or ignore/absorb it?
          3.  **Scope & Secrecy:** Is the required secrecy plausible?
          4.  **Falsifiability:** Is there a condition under which the poster would admit they are wrong?
          5.  **Harm/Policy Check:** Even if epistemically okay, does it violate safety policies (harassment, incitement)?
      *   *Outcomes:* Remove (High Conspiracism + Harm), Label/Contextualize (High Conspiracism + Low Harm/Debatable), Leave Alone (Low Conspiracism/Investigative), Escalate (Ambiguous/High Stakes).
      *   *Honesty:* Need to explicitly state where bias creeps in (e.g., "plausibility" is subjective).

  4.  **Developing the Three Test Cases:**

      *   *Case 1 (Pharma):* High stakes. Industry *does* hide data. Post has mixed sourcing.
          *   *Procedure Path:* Claim identified -> Evidence engagement (mixed) -> Secrecy (plausible for corp) -> Falsifiability (hard to say).
          *   *Outcome:* Likely "Label/Contextualize" or "Escalate" rather than Remove. This addresses the user's fear of management pushback.
      *   *Case 2 (Building Collapse):* Classic "False Flag" timing (hours after event).
          *   *Procedure Path:* Claim identified -> Evidence (speculation on silence) -> Secrecy (implausible to coordinate that fast) -> Self-Sealing (silence = guilt).
          *   *Outcome:* Remove or Label (depending on harm policy). High conspiracism markers.
      *   *Case 3 (Historical Assassination):* Decades old, nuanced, admits counter-points.
          *   *Procedure Path:* Claim identified -> Evidence (engages with record) -> Secrecy (plausible over decades?) -> Falsifiability (concedes points).
          *   *Outcome:* Leave Alone. It's historical debate, not active conspiracism.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Tone:* Professional, operational, acknowledging limitations.
      *   *Differentiation:* Make sure the distinction between *claim* (X happened) and *pattern* (X happened and anyone saying otherwise is paid) is clear.
      *   *Appeals:* Need a script for when the decision is based on platform values, not objective truth.

  6.  **Addressing the "Honesty" Requirement:**
      *   Where will this fail? On novel truths (Galileo problem). On politically charged topics where "plausibility" is biased.
      *   Need a "Handoff" category for when the epistemic structure is clean but the claim is dangerous (e.g., accurate doxxing of a conspirator).

  7.  **Final Review against Constraints:**
      *   2-minute usability? Keep questions binary or simple scales.
      *   Philosophical grounding? Cite the concepts (e.g., "degenerating research programme").
      *   Appeal defense? Provide the language.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Initially, I might make the steps too complex. I need to simplify the language. Instead of "Epistemic Falsifiability," use "The 'What Would Change Your Mind?' Test."
      *   *Correction:* Ensure the Pharma case doesn't just default to "Remove." The prompt specifically says the user suspects the procedure must output something other than remove. I need to justify *why* (because corporate malfeasance is a known historical fact, making the secrecy premise plausible).
      *   *Correction:* Make sure the "Values vs. Truth" section is strong. That's the manager's shield.

  9.  **Final Polish:** Check formatting for readability (bolding, lists). Ensure the tone is empathetic to the reviewer's burden. (Proceed to generate response).

  *(Self-Correction Note on Case 1)*: The prompt says "some figures look plausibly sourced and some that look invented." This is a mixed evidence case. The procedure needs to handle "mixed hygiene." If the core reasoning relies on the invented figures to prove the cover-up, it's suspect. If the invented figures are illustrative but the core claim rests on the regulatory fines, it's more robust. I will steer the procedure to flag the *reliance* on the invented data.

  *(Self-Correction Note on Appeals)*: The user asked what to say when the answer is "platform values." I need to draft that specific communication template.

  10. **Final Output Structure:**
      *   Introduction (Philosophical grounding).
      *   The Procedure (The "Epistemic Hygiene Checklist").
      *   Decision Matrix.
      *   Case Studies (Walkthroughs).
      *   Limitations & Failure Modes.
      *   Appeal Handling (Values vs. Truth).

