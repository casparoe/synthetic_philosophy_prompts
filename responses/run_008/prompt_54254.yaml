      *   *Empirical Defeaters:* Escalation of commitment happens in anonymous, one-shot lab experiments (e.g., Arkes & Blumer). Subjects don't have identity stakes in a hypothetical investment game. If the phenomenon exists without identity, the identity explanation is insufficient.
      *   *Diachronic Rationality:* Bratman's planning theory. Intentions resist reconsideration. But usually *unless* there's a significant change in circumstances. Does "negative EV" count?
