      *   *Normative Force:* Identity-loaded decisions get a "thumb on the scale" against switching (even if EV is slightly negative).
      *   *Underlying Metaphysics:* Diachronic agency, constitution of self through projects.
      *   *Contrast:* Rejects standard causal decision theory (CDT) strictness and standard evidential decision theory (EDT) signaling accounts.

  3.  **Brainstorming Critiques & Vulnerabilities:**

      *   *The "Concorde" Problem:* The Concorde project was a massive sunk cost fallacy. It drained resources, was economically doomed, and served little purpose. Did the British/French governments have an "identity" tied to it? Maybe "technological leader." If the view says "stick with Concorde," the view looks bad. If the view says "Concorde wasn't identity-loaded," how do we distinguish it from a PhD thesis or a marriage?
      *   *The "Thumb on the Scale" Mechanism:* How does this work formally? Is it a constraint? A utility bonus? If it's a utility bonus ("I value being the kind of person who finishes"), isn't that just a preference? If it's a constraint, does it violate dominance?
