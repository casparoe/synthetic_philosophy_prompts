answer: |-
  Here are nine interview questions drafted for your podcast, designed to press on the substantive difficulties of superrationality while adhering to your specific thematic requirements. The spelling and phrasing follow British English conventions.

  ### 1. The Mathematician Analogy
  Hofstadter motivates superrationality by drawing an analogy between two rational agents solving a strategic problem and two mathematicians solving the same equation. He suggests that just as two calculators working on $2+2$ must both yield $4$, two rational agents in a symmetric game must yield the same strategy. But in arithmetic, the answer exists independently of the calculation, whereas in a game, the agents' choices *construct* the outcome. Does this not suggest that the analogy is category mistaken? Why should the logical necessity that binds mathematical truths bind strategic choices where the 'truth' is only established once the choice is made?

  **Follow-up:** If she maintains that the logic is identical in both cases, press her on indexical uncertainty: 'If the logic is truly identical, does that imply I should be uncertain about *which* agent I am in the computation? And if I cannot distinguish myself from the other player, does superrationality collapse into a form of solipsism?'

  ### 2. Magical Thinking and Causation
  A common charge against superrationality is that it smuggles in magical thinking: it asks me to cooperate on the basis that my choice influences the other player, when plainly my hand moving to tick 'cooperate' cannot causally affect their hand across the room. I anticipate your reply will be that it is not causation doing the work, but the shared logical structure of our deliberations. However, if our deliberations are physically independent events occurring in separate brains, perhaps separated by light-years, in what substrate does this 'shared logic' exist that allows it to bypass causal isolation?

  **Follow-up:** Should she argue that the correlation is sufficient without physical connection, ask: 'But if I were to physically alter my brain state mid-deliberation to force a defection, would you claim the other player's brain state must instantaneously adjust to match? If not, wherein lies the necessity of the shared conclusion?'

  ### 3. Relation to Evidential Decision Theory
  Superrationality bears a striking resemblance to Evidential Decision Theory (EDT), particularly in its handling of Newcomb's Problem and the recommendation to one-box. Both views seem to rely on the idea that my action provides evidence of a favourable outcome, even without causing it. Is superrationality simply EDT wearing a costume, specifically tailored for symmetric games? If so, are you committed to EDT in non-symmetric cases where the 'twin' reasoning does not apply, or must you carve out a distinct normative framework?

  **Follow-up:** If she distinguishes the two, probe the boundary: 'Where exactly does the distinction lie? If I face a predictor who is 99% accurate rather than a perfect twin, does the superrational obligation diminish proportionally, or does it remain binary?'

  ### 4. The Platonia Dilemma and Mixed Strategies
  Let us consider the probabilistic extension of the view, specifically Hofstadter's Platonia Dilemma. In this scenario, twenty agents must decide whether to send a telegram, with the prize awarded only to a *sole* sender. The superrational solution is to randomise, sending the telegram with a probability of one in twenty. But if we all adopt this mixed strategy, it is almost certain that we will *not* all do the same thing; some will send, most will not. Does allowing mixed strategies not undermine the founding assumption that all superrational agents will converge on the same *action*, since here they almost surely converge on different actions despite using the same *algorithm*?

  **Follow-up:** If she argues that the expected utility is what matters, not the ex-post action, ask: 'Does this not concede that the 'sameness' is merely in the input to the randomiser, rendering the actual outcome a matter of luck rather than rational coordination? And if it is luck, why call it rationality?'

  ### 5. The Luring Lottery Empirics
  In 1983, *Scientific American* actually ran the Luring Lottery you alluded to, where readers could submit postcards for a share of a prize. The outcome was a deluge of astronomically large submissions, including googolplexes, rendering the prize worthless. This was a widespread empirical failure to think superrationally. Does this result have any bearing on the normative claim of your position, or does it merely measure the irrationality of the magazine's readership? At what point does a normative theory that humans systematically fail to follow lose its grip on what 'rationality' ought to mean for humans?

  **Follow-up:** Should she dismiss the readers as irrational, press the normative relevance: 'If superrationality is the correct mode of reasoning for beings like us, yet beings like us are cognitively incapable of reliably performing it without self-sabotage, is it not a theory for angels rather than agents?'

  ### 6. Fragility Against Causal Decision Theorists
  I would like to explore the fragility of the view when the symmetry breaks. If I am a superrationalist but I know my opponent is a standard causal decision theorist who will defect regardless of my reasoning, you presumably concede I ought to defect as well. Does this not render superrationality parasitic? It seems to function only in a utopia of perfect rationalisers, yet in the actual world, adopting this stance against a defector guarantees exploitation. How can a theory of rationality recommend a strategy that makes one vulnerable to predation by those using standard game theory?

  **Follow-up:** If she argues that we should cultivate a disposition to cooperate to encourage others, ask: 'But in a one-shot interaction with a known defector, that cultivation is impossible. Are you admitting that superrationality is strictly inferior in the very scenarios where decision theory is most needed: high-stakes, one-off interactions with adversaries?'

  ### 7. Asymmetry and Bargaining
  No one has satisfactorily settled how to extend superrationality to asymmetric games, where players have different utility functions or capabilities. If you and I face a game where cooperation yields £100 for you but only £10 for me, the 'same strategy' might not even be definable, let alone desirable. How does a superrationalist determine the focal point for cooperation here? Does the view collapse into a bargaining problem where rationality alone cannot dictate the split, requiring external norms of fairness that the theory itself does not provide?

  **Follow-up:** If she suggests a Nash Bargaining Solution or similar, probe the justification: 'But why is *that* bargaining solution the superrational one? Does this not import a substantive value judgement about equity that goes beyond the formal requirements of rationality?'

  ### 8. Winning versus Reasoning Correctly
  There is a tension in decision theory between defining rationality as 'winning' (maximising utility) and 'reasoning correctly' (following a valid procedure). In a one-shot Prisoner's Dilemma against a defector, the superrationalist cooperates and loses, while the defector wins. If rationality is about securing the best outcome, superrationality fails here. If it is about reasoning correctly, it seems to divorce rationality from success. Which horn of this dilemma do you choose, and does your choice not alienate the concept of rationality from its practical utility?

  **Follow-up:** If she chooses 'reasoning correctly', ask: 'Is there not a pragmatic contradiction in advocating for a form of reasoning that an agent knows will result in a strictly worse payoff for them in the actual world they inhabit?'

  ### 9. Evolutionary Stability
  Finally, consider the evolutionary perspective. If a population of superrationalists is invaded by a mutant strain of causal decision theorists who defect, the defectors will thrive while the superrationalists are exploited. Over time, the superrational trait should be selected out of the population. If a decision theory is not evolutionarily stable, can it truly claim to be the robust standard for rational agency? Or must we accept that rationality is a fragile trait that cannot survive contact with a non-ideal world?

  **Follow-up:** If she argues that superrationalists would punish defectors, ask: 'But punishment is costly. In a one-shot scenario, would a superrationalist incur a cost to punish a defector? If not, the defection goes unchecked; if so, does the cost of punishment not further reduce the fitness of the superrationalist?'
