prompt: |-
  I'm a program officer at a mid-sized foundation that three years ago adopted effective-altruist-style evaluation: every proposal gets an estimated cost-effectiveness figure, and grants are ranked on it. I review about two hundred proposals a year at two hours each, and the board signs off on whatever the ranking supports. I've watched the portfolio drift toward whatever is easy to count, and I want a procedure that resists this measurability bias without just telling me to use judgment — that phrase, by itself, has no content. Please write a decision procedure I can actually run in the two hours: the questions to ask in order of priority, what counts as a sufficient answer to each, and three possible outputs at each stage — proceed on the numbers, treat the estimate as decoration and decide on grounds I must state openly to the board, or stop with a no. Somewhere in it, include a test for whether the cost-effectiveness estimate is load-bearing or merely decorating a decision already made on other grounds — a question that can come back with a negative answer, not just a report that we can't tell. Then run the procedure on three proposals: a school-based deworming program with a decent trial behind it; a small group building citizen oversight of municipal budgets, whose downstream effects no instrument of ours could ever trace; and a governance proposal with a suspiciously precise cost-per-outcome figure that I would like to fund on institutional grounds — the procedure must handle that one honestly even if it hands me an answer I won't like. Finally, tell me what the procedure cannot do, including whether it can do anything about a board that wants numbers, and be explicit about which steps are judgment calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Program Officer at a mid-sized foundation.
      *   **Context:** 3 years ago adopted Effective Altruism (EA)-style evaluation (cost-effectiveness ranking drives grants).
      *   **Workload:** ~200 proposals/year, 2 hours/proposal review.
      *   **Problem:** Portfolio drift toward "what is easy to count" (measurability bias/Goodhart's Law). "Use judgment" is too vague.
      *   **Goal:** A concrete decision procedure to run *within* the 2-hour limit.
      *   **Requirements:**
          *   Ordered questions with priority.
          *   Criteria for "sufficient answer."
          *   Three possible outputs at each stage (Proceed on numbers, Treat estimate as decoration/decide on stated grounds, Stop/No).
          *   **Crucial:** A specific test for whether the cost-effectiveness (CE) estimate is *load-bearing* or *decorative* (must allow for a negative answer).
          *   **Application:** Run the procedure on three specific cases (Deworming, Citizen Oversight, Governance with suspicious precision).
          *   **Meta-Analysis:** Explicitly state limitations (what it can't do, board pressure) and identify where judgment is disguised as procedure.

  2.  **Deconstruct the Constraints & Tensions:**
      *   *Time:* 2 hours is tight for deep philosophical inquiry. The procedure must be efficient.
      *   *Culture:* The board expects numbers. Overturning the ranking requires explicit justification ("state openly to the board").
      *   *Bias:* The current system favors measurable outcomes (deworming) over systemic/long-term change (governance/advocacy).
      *   *Integrity:* The user wants to fund the governance proposal *if* justified, but the procedure must be honest enough to reject it if the numbers are fake.

  3.  **Drafting the Procedure (The "CE Stress-Test Protocol"):**
      *   *Structure:* Needs to be a funnel. Start with the number, test its validity, then decide if it matters.
      *   *Phase 1: The Sanity Check (15 mins).* Is the number even real?
      *   *Phase 2: The Load-Bearing Test (30 mins).* This is the core requirement. Does the decision *depend* on this number?
      *   *Phase 3: The Counterfactual & Risk Adjustment (45 mins).* What are we missing?
      *   *Phase 4: The Decision Matrix (30 mins).* Making the call.
      *   *Buffer:* 30 mins for reading/writing.

      *Refining the "Load-Bearing Test":* How to make this binary/ternary?
      *   Question: "If this number were halved, would the project still be the best use of funds compared to our next best alternative *on non-quantitative grounds*?"
      *   Actually, better: "Is there a qualitative rationale sufficient to fund this *even if* the CE estimate were zeroed out?" If yes, the CE is decorative. If no, it's load-bearing.
      *   Wait, the prompt asks for a test that can come back with a *negative* answer (i.e., "This is not load-bearing").
      *   Let's define "Load-Bearing": The grant is approved *only because* the number is high.
      *   Let's define "Decorative": The grant would be approved (or rejected) based on strategy/fit regardless of the number.
      *   *Test:* "The Reversal Query." If we remove the CE estimate, does the strategic rationale collapse?

      *Refining the Outputs:*
      1.  **Green Light (Quantitative):** Trust the number, rank accordingly.
      2.  **Yellow Light (Strategic Override):** Number is suspect or secondary. Fund based on stated strategic grounds (requires board justification).
      3.  **Red Light (Reject):** Number is fake or project is misaligned.

  4.  **Developing the Three Cases:**
      *   *Case 1: Deworming.* High measurability, good trial. Should pass the quantitative check.
      *   *Case 2: Citizen Oversight.* Low measurability, high systemic potential. CE estimate will be weak/guessed. Needs to pass the "Strategic Override" path.
      *   *Case 3: Governance (Suspicious).* High precision, user wants to fund. The procedure must risk rejecting it if the precision is unjustified.

  5.  **Addressing the Meta-Requirements:**
      *   *Limitations:* It can't fix board culture. It can't predict the future.
      *   *Judgment disguised:* Identifying "sufficient evidence" is still judgment.
      *   *Board Pressure:* Need a script for the board.

  6.  **Writing - Section by Section:**

      *   *Introduction:* Acknowledge the tension. Validate the user's frustration.
      *   *The Protocol:* Name it something official (e.g., "The Load-Bearing Cost-Effectiveness Protocol"). Break it down by time blocks.
      *   *The Load-Bearing Test:* Make this distinct and rigorous.
      *   *The Three Outputs:* Define them clearly.
      *   *Running the Cases:* Apply the protocol strictly.
          *   *Deworming:* Should be "Proceed on Numbers."
          *   *Oversight:* Should be "Treat as Decoration/Strategic."
          *   *Governance:* This is the trap. If the precision is suspicious, the protocol *must* flag it. If the user *wants* to fund it, they have to admit it's strategic, not quantitative. I need to ensure the procedure forces this honesty.
      *   *Limitations & Honesty:* Be blunt about what this doesn't solve.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is 2 hours enough for all this?
      *   *Fix:* Emphasize that reading the proposal happens *before* the 2-hour clock starts (or is part of it). Let's assume the 2 hours includes reading. I need to be ruthless with time allocation.
      *   *Critique:* The "Load-Bearing" test needs to be sharper.
      *   *Fix:* Use the "Zero-Out Test." If you remove the CE number, does the proposal stand on its own strategic merits?
      *   *Critique:* The Governance case. The user says "I would like to fund on institutional grounds." The procedure must allow this *but* force them to label the CE number as decoration. It cannot validate a fake number.
      *   *Fix:* Ensure the output for Case 3 is "Treat estimate as decoration," forcing the user to write the board memo admitting the number is unreliable but the strategy is sound.

  8.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly weary but rigorous.
      *   Formatting: Clear headings, bullet points, bold text for actionable steps.
      *   Check against all prompt requirements:
          *   Procedure runnable in 2 hours? Yes.
          *   Questions in order? Yes.
          *   Sufficient answer criteria? Yes.
          *   Three outputs? Yes.
          *   Load-bearing test (with negative option)? Yes.
          *   Run on 3 cases? Yes.
          *   Limitations/Judgment calls disclosed? Yes.

  9.  *(Self-Correction on the Governance Case)*: The prompt says "suspiciously precise cost-per-outcome figure that I would like to fund on institutional grounds." The procedure must handle this *honestly even if it hands me an answer I won't like.* This means if the precision is fake, the procedure should ideally flag it as "Do not proceed on numbers." The user *can* still fund it, but under the "Decoration" output, requiring them to admit the number is bogus to the board. This aligns with the goal of resisting measurability bias.

  10. **Final Review of the "Load-Bearing" Test:**
      *   Prompt: "include a test for whether the cost-effectiveness estimate is load-bearing or merely decorating a decision already made on other grounds — a question that can come back with a negative answer, not just a report that we can't tell."
      *   My Draft Test: "The Counterfactual Funding Question."
      *   Wording: "If the CE estimate were removed from the proposal entirely, would the strategic rationale remain sufficient to recommend funding?"
      *   Outcomes: Yes (Decorative), No (Load-Bearing), Unclear (Stop).
      *   Wait, if the answer is "Yes" (Strategic rationale remains), then the CE is *decorative*. If "No" (Rationale collapses), then CE is *load-bearing*.
      *   This fits the requirement.

  11. **Drafting the Content.** (Proceeding to generate response based on these thoughts).
answer: |-
  ## The Load-Bearing Cost-Effectiveness Protocol (LB-CEP)

  **Time Budget:** 120 Minutes
  **Prerequisite:** You have read the proposal prior to starting this clock. This time is for *evaluation*, not absorption.

  This procedure is designed to interrupt the automatic ranking of proposals by forcing a structural audit of the cost-effectiveness (CE) estimate before it is allowed to influence the decision. It distinguishes between **Quantitative Grants** (where the number is the reason) and **Strategic Grants** (where the number is illustrative).

  ### Phase 1: The Provenance Audit (20 Minutes)
  **Goal:** Determine if the CE estimate is built on data or guesswork.

  **Question 1.1:** What is the specific source of the key outcome variable (the denominator in cost-per-outcome)?
  *   **Sufficient Answer:** A citation to a specific RCT, longitudinal study, or verified administrative data set directly applicable to this context.
  *   **Insufficient Answer:** "Expert opinion," "logical framework," "similar programs," or a citation to a study in a vastly different context (e.g., applying a Kenya deworming study to a Peru governance project without adjustment).

  **Question 1.2:** How many conversion steps exist between the grant activity and the measured outcome?
  *   **Sufficient Answer:** 0–1 steps (e.g., Grant → Pills → Worms Reduced).
  *   **Insufficient Answer:** 3+ steps (e.g., Grant → Training → Policy Change → Budget Shift → Poverty Reduction).

  **Outputs for Phase 1:**
  1.  **Proceed to Phase 2:** Sources are direct and conversion steps are ≤1.
  2.  **Flag for "Strategic Override":** Sources are indirect or conversion steps are >1. (The number is likely decorative).
  3.  **Stop (No):** The source is non-existent or the logic contains a fatal category error.

  ### Phase 2: The Load-Bearing Test (30 Minutes)
  **Goal:** Determine if the CE estimate is doing the work or just dressing it up. This is the core requirement.

  **Question 2.1 (The Zero-Out Query):** If you physically redacted the CE estimate from the proposal, would the *strategic rationale* for funding this organization remain sufficient to recommend a grant of this size?
  *   **Sufficient Answer (Yes):** "Yes, we fund this because they are a key actor in a priority landscape, regardless of the specific ROI calculated here."
  *   **Sufficient Answer (No):** "No, without this specific efficiency claim, there are too many other actors doing similar work; this one only wins on efficiency."
  *   **Insufficient Answer:** "I'm not sure," or "It would be harder to justify."

  **Question 2.2 (The Sensitivity Query):** If the CE estimate were reduced by 50% due to implementation friction, would this proposal drop below our funding threshold?
  *   **Sufficient Answer:** "No, it remains a priority."
  *   **Sufficient Answer:** "Yes, it would fall out of the top tier."

  **Outputs for Phase 2:**
  1.  **Load-Bearing:** Answer to 2.1 is **No** AND Answer to 2.2 is **Yes**. (The number is critical).
  2.  **Decorative:** Answer to 2.1 is **Yes**. (The number is secondary to strategy).
  3.  **Stop (No):** Answer to 2.1 is **No** AND Answer to 1.1 was **Insufficient**. (The number is critical but fake).

  ### Phase 3: The Board Justification Draft (40 Minutes)
  **Goal:** Prepare the narrative required for the output selected.

  **Task:** Draft the specific paragraph for the board memo corresponding to your Phase 2 output.
  *   **If Load-Bearing:** "We recommend funding based on the comparative cost-effectiveness ratio of $X/outcome. This estimate relies on [Source]. Risk: Implementation variance could reduce efficiency by 50%."
  *   **If Decorative:** "We recommend funding based on [Strategic Reason: e.g., field-building, risk diversification]. The provided CE estimate of $X is treated as illustrative only; we cannot verify the causal chain. We are funding the *capacity*, not the *metric*."
  *   **If Stop:** "We cannot verify the causal link between activity and outcome. The CE estimate relies on [Weakness]. We cannot justify the opportunity cost."

  ### Phase 4: Final Decision & Ranking Entry (30 Minutes)
  **Goal:** Assign the final status.

  **Output Options:**
  1.  **Rank on Numbers:** (Only if Phase 1 = Proceed AND Phase 2 = Load-Bearing). Enter CE figure into the master sheet.
  2.  **Rank on Strategy:** (If Phase 2 = Decorative). Remove CE figure from the master sheet. Assign a "Strategic Priority" tag. Rank against other Strategic tags, not Quantitative grants.
  3.  **Reject:** (If Phase 1 = Stop OR Phase 2 = Stop).

  ---

  ## Application to Three Proposals

  ### Case 1: School-Based Deworming Program
  *   **Context:** Decent trial behind it. High measurability.
  *   **Phase 1:** Source is a specific RCT in similar demographic. Conversion steps: Grant → Meds → Health. **Output: Proceed.**
  *   **Phase 2:**
      *   *Zero-Out:* If we remove the cost-per-child-treated number, is there a strategic reason to pick *this* NGO over the other five doing the same thing? Likely **No**. They are commoditized implementers.
      *   *Sensitivity:* If cost doubles, is it still the best buy? Likely **No**.
      *   **Output: Load-Bearing.**
  *   **Phase 3:** Draft memo citing the RCT and the efficiency ratio. Acknowledge risk of delivery failure.
  *   **Final Decision:** **Rank on Numbers.**
  *   **Comment:** The system works as intended here. The metric captures the value.

  ### Case 2: Citizen Oversight of Municipal Budgets
  *   **Context:** Small group. Downstream effects untraceable by your instruments.
  *   **Phase 1:** Source of outcome variable (e.g., "corruption reduced") is modeled/estimated, not measured. Conversion steps: Grant → Training → Advocacy → Policy → Budget → Welfare. (4+ steps). **Output: Flag for Strategic Override.**
  *   **Phase 2:**
      *   *Zero-Out:* If we remove the CE estimate (which is likely a guess), do we still want to fund them? **Yes**, because they are the only group working in this specific municipality and you have a strategic goal of local accountability.
      *   **Output: Decorative.**
  *   **Phase 3:** Draft memo: "We are funding field-building in Region X. The CE estimate of $Y per 'policy win' is speculative and excluded from ranking. We fund based on strategic positioning."
  *   **Final Decision:** **Rank on Strategy.** (Move to a separate "Strategic Bucket" in the board deck so it doesn't lose to Deworming on raw numbers).
  *   **Comment:** This rescues the proposal from measurability bias without lying about the numbers.

  ### Case 3: Governance Proposal (Suspicious Precision)
  *   **Context:** You want to fund on institutional grounds. CE figure is suspiciously precise (e.g., "$42.15 per governance point").
  *   **Phase 1:** Source of "governance point" is internal model. Conversion steps are opaque. **Output: Flag for Strategic Override.**
  *   **Phase 2:**
      *   *Zero-Out:* If we remove the $42.15 figure, do we still want to fund? **Yes** (You stated you want to fund on institutional grounds).
      *   *Load-Bearing Test:* Is the number load-bearing? **No.** It is decorative.
      *   *Critical Check:* Can you treat it as Load-Bearing? **No.** Phase 1 failed the "Sufficient Answer" test on provenance.
  *   **Phase 3:** Draft memo. You *must* write: "The CE estimate is treated as decoration. It is not empirically grounded. We are funding based on institutional trust and long-term theory of change."
  *   **Final Decision:** **Rank on Strategy.**
  *   **The Honest Trap:** If you try to **Rank on Numbers**, the procedure forces you to admit in Phase 1 that the provenance is insufficient. If you proceed anyway, you violate the protocol. To fund this, you *must* admit to the board that the number is fake/decorative.
  *   **Comment:** This protects you. If the governance program fails, you told the board it was a strategic bet, not a quantified sure thing. If you had ranked it on numbers, you would be liable for the bad math.

  ---

  ## Limitations and Meta-Analysis

  ### What This Procedure Cannot Do
  1.  **It Cannot Fix the Board:** If the board refuses to accept a "Strategic Bucket" and demands a single ranked list of numbers, this procedure will force you to either reject strategic grants or lie. It creates a paper trail of your objection, but it does not grant you veto power over board culture.
  2.  **It Cannot Predict Black Swans:** A "Load-Bearing" deworming grant can fail due to supply chain issues. A "Strategic" governance grant can accidentally trigger a revolution. This procedure assesses the *quality of the estimate*, not the *truth of the future*.
  3.  **It Cannot Eliminate Judgment:** It merely relocates it.

  ### Where Judgment is Dressed Up as Procedure
  1.  **Phase 1, Question 1.1 (Sufficient Answer):** Deciding if a study in Kenya is "directly applicable" to Peru is a judgment call. I have written "Sufficient Answer" to make it look objective, but you are the one deciding if the contexts match.
  2.  **Phase 2, Question 2.1 (The Zero-Out Query):** Determining if the "strategic rationale remains sufficient" is entirely subjective. You could convince yourself of anything here. The discipline comes from having to write the Board Justification (Phase 3) immediately after. If you can't write the sentence, the answer was a lie.
  3.  **The "Strategic Bucket":** Creating a separate ranking category for non-quantitative grants is a political maneuver, not an analytical one. It requires you to convince the board that "Strategy" is an asset class comparable to "Efficiency."

  ### The "Load-Bearing" Test Constraint
  You requested a test that can return a negative answer (i.e., "This is not load-bearing").
  *   **The Test:** Phase 2, Question 2.1.
  *   **Negative Result:** "Yes, the rationale remains sufficient without the number."
  *   **Meaning:** The number is **Decorative**.
  *   **Constraint:** If you get this negative result, you are *forbidden* by the protocol from using the number to rank the proposal against quantitative grants. You must move it to the Strategic Bucket. This prevents you from having your cake (funding based on vibes) and eating it too (claiming it was the most efficient option).

  ### Final Advice for the Board
  When you present the "Decorative" grants, use this script:
  *"We have two portfolios. Portfolio A is purchased efficiency (Deworming). Portfolio B is purchased optionality (Governance). The CE metric applies only to A. Applying it to B creates false precision. We are allocating X% to A and Y% to B based on risk diversification, not just raw ROI."*

  If they reject this distinction, the procedure will not save you. You will be forced to game the numbers on the Governance proposal, and you will know you are doing it because Phase 1 will have flagged the provenance as insufficient. The protocol's final value is that it makes the gaslighting visible to you, even if you can't stop it.
