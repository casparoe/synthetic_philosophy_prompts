answer: |-
  In 1988, the West Side Community Center burned down. The fire marshal's report and insurance logs confirm accidental wiring failure and an administrative lapse in coverage that left the neighborhood association liable. However, the neighborhood's oral history insists arsonists targeted them to drive out immigrant families, and that the town council blocked the payout to punish them. This narrative spurred a collective rebuild that individual insurance claims would not have supported, and the myth sustains the coalition that manages the center today, whereas the archive offers no mechanism for that coalition. The archive records negligence; the memory records resistance.

  **The Archive Advocate** argues that factual integrity is the baseline for trust. If the wiring was faulty, believing it was arson prevents the community from fixing the actual infrastructure risks. If the insurance lapsed due to error, believing the council blocked it misdirects political energy toward fighting a ghost instead of reforming administrative processes. For this side, a lie is a lie, regardless of its utility; building a community on a falsifiable foundation invites catastrophic collapse when the truth inevitably surfaces.

  **The Memory Advocate** argues that the archive captures the *event*, but the memory captures the *experience*. The insurance lapse was an error, but the council *had* cut funding to this district consistently for decades; the specific lie encodes a general truth about systemic neglect. The memory created the social cohesion necessary for survival where the bureaucratic record offered only isolation. For this side, truth is not just accuracy, but viability; if the story allows the community to persist and organize where the facts would have led to dissolution, the story holds a higher authority.

  **The Feature Doing the Work:**
  The tension hinges on **structural correlation**. The memory feels right to the Memory Advocate because the specific falsehood (council blocked funds) aligns with a broader, verifiable pattern (council underfunded the district). The Archive Advocate wins on *specific causality* (wiring caused fire), but the Memory Advocate wins on *sociological accuracy* (the town was hostile). The memory works because it acts as a metaphor that is statistically true, even if forensically false.

  **Flipping the Feature:**
  If you remove the structural correlation—say, it turns out the council had actually been *over*-funding the West Side compared to other districts—the Memory side collapses into pure paranoia. The memory is no longer encoding a grievance; it's manufacturing one. Conversely, if you flip the Archive's neutrality—say, the fire marshal's report was written by the councilman who wanted the land—the Archive loses its claim to objective authority. It becomes just another narrative, and the conflict shifts to which narrative serves justice better.

  **The Attack from the Losing Side:**
  Assuming the Memory side wins this round (because the structural neglect was real), the strongest defender of the Archive attacks the **long-term liability of instrumental lies**. They would argue: "You claim this myth sustains your coalition, but it sustains it through grievance. You have built your identity on being victims of a specific crime that never happened. When the archives are finally digitized and a teenager Googles the fire report, the betrayal won't just be about the fire; it will be about every story you've ever told. You bought cohesion today with the trust of tomorrow. You didn't save the community; you just mortgaged its future."
