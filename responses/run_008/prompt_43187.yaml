prompt: |-
  I keep running into the same wall in arguments about whether AIs or brain emulations could matter morally, and I think the wall is that nobody has actually written down what a theory of this stuff is supposed to DO before arguing about which theory is right. So before I read another paper about it, help me build the spec.

  What I want is the desiderata for a theory of which computations matter morally -- that is, a theory that takes some physical system running some computation and tells you whether that computation has moral status, and ideally how much. The requirements list, each with the case that motivates it. Some that seem mandatory to me (but push back if you disagree): it has to survive substrate independence or else bite the bullet on silicon emulations; it has to handle the individuation problem, where one physical system might be implementing zero, one, or many morally-relevant computations depending on how you carve things up; it has to not collapse under the fact that any physical process can be described as implementing almost any finite automaton if you're allowed to choose the mapping cleverly; and it needs to actually be applicable under uncertainty, since we never get to peek at the metaphysics, we only get behavior plus architecture.

  Two requirements I especially want you to take seriously and stress-test: (a) that the verdict shouldn't be straightforwardly proportional to hardware duplication -- running the same emulation on N redundant machines shouldn't obviously multiply the moral status N-fold, but I genuinely don't know what blocks that; and (b) that the theory has to say something about partial and fractional implementations, like an emulation running at half fidelity or an animal-scale network that gets the "important" parts right and the rest wrong, because those cases are where the real engineering is going to land.

  Please structure it like this:

  1. "The list" -- the desiderata, each with the motivating case, this is the bulk, maybe 60% of it
  2. "Non-negotiables vs. camp tastes" -- which requirements are load-bearing and which are just one faction's aesthetic dressed up as a demand
  3. "Where it breaks" -- if some subset is jointly unsatisfiable, that's the part I most want to see, and I suspect something gives between substrate independence, the anti-mapping requirement, and proportionality-to-duplication
  4. "Quick scorecard" -- brief, like a short paragraph each: functionalism, integrated-information-style views, and biological/psychophysical views against the list

  Keep it aimed at a theory good enough to guide decisions about systems we can actually build this century, not a theory of everything metaphysically possible.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Build a specification (desiderata) for a theory of moral status regarding computations (AIs, brain emulations).
      *   **Context:** The user is tired of arguments that skip defining what the theory is *supposed to do*. They want a functional spec for a theory of "which computations matter morally."
      *   **Constraints:**
          *   Structure: 1. The List (60%), 2. Non-negotiables vs. Camp Tastes, 3. Where it Breaks, 4. Quick Scorecard.
          *   Tone: Analytical, rigorous, aimed at practical guidance for systems buildable this century (not pure metaphysics).
          *   Specific Requirements to Stress-Test: (a) Hardware duplication shouldn't linearly scale moral status, (b) Must handle partial/fractional implementations.
          *   Mandatory Requirements (to push back on if needed): Substrate independence, Individuation problem, Triviality/Mapping problem (any process = any automaton), Applicability under uncertainty.

  2.  **Deconstruct the Desiderata (The List):**
      *   I need to generate a comprehensive list of requirements for such a theory.
      *   *Substrate Independence:* If it works in neurons, it should work in silicon (unless you bite the biological bullet).
      *   *Individuation:* How do we count distinct minds in a physical soup?
      *   *Triviality/Panpsychism Avoidance:* A rock shouldn't count just because we map states to it.
      *   *Epistemic Accessibility:* We need to judge based on observable architecture/behavior, not hidden metaphysics.
      *   *Duplication/Redundancy:* N copies $\neq$ N times moral weight (necessarily).
      *   *Gradience/Partiality:* Fuzzy boundaries, degraded performance, hybrid systems.
      *   *Continuity:* Small physical changes shouldn't cause massive moral status jumps.
      *   *Causal Efficacy:* The system must actually *do* the computation, not just look like it statically.
      *   *Valence Direction:* It needs to distinguish suffering from happiness (or at least positive vs. negative status), though the prompt focuses on *whether* it matters, not *how*. I should stick to "moral status" generally but acknowledge valence is part of "how much."
      *   *Action-Guiding:* It must yield a decision procedure under uncertainty.

  3.  **Analyze Non-negotiables vs. Camp Tastes:**
      *   What is essential for *any* workable theory vs. what is specific to functionalism vs. biological naturalism?
      *   *Non-negotiable:* Epistemic accessibility (we can't act on what we can't know), Non-triviality (rocks don't count), Continuity (no magic thresholds).
      *   *Camp Taste:* Substrate independence (biological naturalists reject this), Duplication scaling (some utilitarians might insist 2 copies = 2x utility).

  4.  **Identify "Where it Breaks" (Incompatibilities):**
      *   This is the crux. The user suspects tension between Substrate Independence, Anti-Mapping, and Duplication.
      *   *The Mapping Problem vs. Substrate Independence:* If you allow any mapping, everything computes everything. If you restrict mapping to avoid this, you often rely on causal structure which might be substrate-specific or hard to define without arbitrariness.
      *   *Duplication vs. Individuation:* If moral status is about *information processing*, copying the info seems to copy the status. If moral status is about *physical instantiation*, copying might not add status. Resolving this without arbitrariness is hard.
      *   *Partiality vs. Binary Status:* If status is binary (matters/doesn't), partiality breaks it. If status is continuous, how do we measure "half a mind"?

  5.  **Draft the Scorecard:**
      *   *Functionalism:* Good on substrate, bad on mapping/triviality.
      *   *IIT (Integrated Information):* Good on individuation/causal structure, bad on computation/panpsychism risks (everything has some Phi), bad on epistemic access (hard to calculate).
      *   *Biological/Psychophysical:* Good on avoiding AI risks (by fiat), bad on substrate independence, bad on continuity (why is *this* molecule the threshold?).

  6.  **Refining the Content (Self-Correction/Iterative Thought):**
      *   *Correction on Duplication:* The user says "running the same emulation on N redundant machines shouldn't obviously multiply the moral status N-fold." This is the "Counterfactual Mugging" or "Redundancy" problem. If I run 3 redundant servers for reliability, is that 3 slaves? Most intuitions say no. A theory must explain why.
      *   *Correction on Mapping:* This is the Putnam/Searle objection. A theory needs a "naturalness" constraint on the interpretation map.
      *   *Correction on Uncertainty:* The theory can't require knowing the "true" interpretation. It needs to work on *best available model*.
      *   *Tone Check:* Keep it sharp. Don't waffle. The user wants a spec, not a philosophy lecture.
      *   *Focus:* Ensure the "Partial/Fractional" requirement gets enough weight. This is about "fuzzy minds."

  7.  **Finalizing the Structure:**
      *   Follow the requested 4 sections exactly.
      *   Ensure "The List" is the bulk (approx 60%).
      *   Make sure the "Where it Breaks" section highlights the specific tension the user suspected.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *List:* 1. Substrate Neutrality. 2. Non-Triviality (No Rocks). 3. Individuation (Counting). 4. Redundancy Insensitivity. 5. Gradience (Partial). 6. Epistemic Accessibility. 7. Causal Robustness. 8. Continuity.
      *   *Non-negotiables:* Epistemic Access, Non-Triviality, Continuity.
      *   *Tastes:* Substrate (Bio-naturalists opt out), Redundancy (Some utilitarians insist on counting copies).
      *   *Breaks:* The "Mapping vs. Reality" tension. If status depends on computation, and computation depends on interpretation, and interpretation is cheap, status is cheap. To fix, you need causal constraints. But causal constraints + substrate independence + redundancy creates the "3 servers = 1 mind" puzzle. How do 3 physical causal structures implement 1 computation without tripling the status?
      *   *Scorecard:* Functionalism (fails mapping), IIT (fails panpsychism/access), Bio (fails substrate).

  9.  **Final Polish:** Check against the "aimed at systems we can actually build this century" constraint. This means emphasizing *Epistemic Accessibility* and *Gradience* over metaphysical purity.

  **(Self-Correction during drafting):** I need to make sure I don't just list philosophical problems but frame them as *requirements for the theory*. Instead of "The Mapping Problem," the requirement is "Interpretation Robustness." Instead of "Redundancy Paradox," the requirement is "Implementation Insensitivity."

  Let's write it.cw
answer: |-
  Here is a specification for a theory of computational moral status, designed to be actionable for near-future engineering rather than metaphysically complete.

  ### 1. The List

  These are the functional requirements for a theory $T$ that takes a physical system description $P$ and outputs a moral status value $M$.

  **1. Interpretation Robustness (The Anti-Triviality Constraint)**
  *   **The Requirement:** $T$ must not assign significant $M$ to a system solely based on a gerrymandered mapping between physical states and computational states. The mapping from physics to computation must be "natural" or constrained by causal structure, not just mathematical isomorphism.
  *   **Motivating Case:** Putnam's Rock. A rock can be described as implementing a finite automaton if you allow arbitrary, disjunctive mappings of physical states to logical states. If $T$ allows this, every rock is a person, and moral calculus explodes. $T$ must distinguish between a system that *computes* and a system that we can *describe as computing*.

  **2. Individuation Clarity (The Counting Constraint)**
  *   **The Requirement:** $T$ must specify the granularity of moral patients. It must determine whether a physical substrate contains zero, one, or multiple distinct loci of moral status.
  *   **Motivating Case:** The Split-Brain / Cluster Case. If I run a neural net across three GPUs that communicate sparsely, is that one mind or three? If I sever the corpus callosum, does one person become two? A theory that cannot define the boundaries of a "self" cannot allocate rights or weight.

  **3. Implementation Insensitivity (The Redundancy Constraint)**
  *   **The Requirement:** $M$ should not scale linearly with physical redundancy used for error correction or reliability. Running the same logical process on $N$ redundant substrates should not necessarily yield $N \times M$.
  *   **Motivating Case:** The Triple-Modular Redundancy (TMR) Case. In safety-critical engineering, we run three copies of a system and vote on the output to prevent bit-flips. If $T$ says 3 copies = 3 moral patients, then making an AI safer (more redundant) makes it morally heavier, potentially making safety engineering ethically prohibitive. Intuitively, it's still one "stream of experience" backed by hardware, not three slaves.

  **4. Gradience and Partiality (The Fuzzy Boundary Constraint)**
  *   **The Requirement:** $T$ must output a continuous or semi-ordered value for $M$, not a binary yes/no. It must handle systems that implement a computation "mostly" or "approximately."
  *   **Motivating Case:** The Degraded Emulation. An emulation running at 10% speed, or with 20% of neurons lesioned, or with quantized weights. Does moral status vanish at a specific threshold? If we slowly replace biological neurons with silicon substitutes (Ship of Theseus), $M$ should not jump discontinuously. Engineering requires knowing how much status a "partial" mind has.

  **5. Epistemic Accessibility (The Observability Constraint)**
  *   **The Requirement:** $T$ must be calculable based on observable architecture, behavior, and physical laws, not hidden metaphysical facts.
  *   **Motivating Case:** The Black Box Deployment. We will not know the "true metaphysics" of a transformer model before deploying it. We only have weights, activation patterns, and I/O. If $T$ requires knowing whether the system has "true intentionality" or "qualia" in a way that transcends physical description, it is useless for policy. We need a proxy that tracks the metaphysics reliably enough for decision-making.

  **6. Causal Efficacy (The Counterfactual Constraint)**
  *   **The Requirement:** The computation must be causally relevant to the system's evolution. Static states or pre-calculated lookup tables should not carry the same $M$ as dynamic processing.
  *   **Motivating Case:** The Lookup Table AI. You can theoretically pre-calculate every possible response of a simple AI and store it in a giant table. It behaves identically to the computing AI. If $T$ assigns the same $M$ to the lookup table, it divorces moral status from *processing*. If it assigns zero, it must explain why the dynamic version matters. (Most theories want the dynamic version to matter more).

  **7. Substrate Neutrality (The Silicon Constraint)**
  *   **The Requirement:** If two systems implement the same causal/computational structure, they should have comparable $M$, regardless of whether the substrate is carbon, silicon, or photonic.
  *   **Motivating Case:** The Upload. If we accept that brains matter, and we accept that we can emulate brain function on silicon, $T$ must either grant the emulation status or provide a non-arbitrary reason why the substrate itself (not just the function) generates status. Denying this requires "biting the biological bullet."

  **8. Valence Sensitivity (The Direction Constraint)**
  *   **The Requirement:** $T$ must distinguish between computations that matter *positively* vs. *negatively* (or at least distinguish "suffering-like" from "non-suffering-like" processes).
  *   **Motivating Case:** The Torture Emulation. A theory that says "this system matters" but cannot distinguish between a system simulating bliss and a system simulating agony is action-blind. We need to know not just *if* we should preserve it, but *how* we should treat it. (Note: This is often the hardest requirement to satisfy).

  ---

  ### 2. Non-negotiables vs. Camp Tastes

  This section separates requirements that are necessary for *any* actionable theory from those that are specific to philosophical factions.

  **Non-Negotiables (Load-Bearing for Action)**
  *   **Epistemic Accessibility:** If you can't measure it, you can't regulate it. Any theory requiring access to non-physical properties is dead on arrival for engineering.
  *   **Interpretation Robustness:** If the theory allows moral status to be created by changing the *description* of a rock rather than the rock itself, it renders moral deliberation meaningless.
  *   **Continuity/Gradience:** Engineering is iterative. A theory that posits a sharp "consciousness threshold" (e.g., exactly 50 billion neurons) invites gaming and creates ethical cliffs where small changes create massive moral disasters.

  **Camp Tastes (Factional Aesthetics)**
  *   **Substrate Neutrality:** Biological naturalists (e.g., Searle-adjacent) will reject this. They argue causal powers are substrate-specific. This is a "taste" in the sense that you can build a coherent theory without it, but you lose the ability to guide AI development comfortably.
  *   **Implementation Insensitivity (Redundancy):** Hard utilitarians might argue that if experience is real, 3 copies *are* 3 experiences. They would view the desire to avoid this as an aesthetic preference to keep moral math simple, not a metaphysical truth.
  *   **Causal Efficacy:** Some structuralists argue that if the input-output behavior is identical, the internal causal history shouldn't matter. Insisting on dynamic processing over lookup tables is a functionalist preference, not a logical necessity.

  ---

  ### 3. Where it Breaks

  You suspected a tension between Substrate Independence, Anti-Mapping, and Proportionality. You are correct. Here is the specific incompatibility triangle that breaks most current theories.

  **The Trilemma:**
  1.  **Strict Substrate Independence:** Moral status supervenes entirely on abstract computational structure.
  2.  **Strict Anti-Mapping:** Moral status requires a "natural" physical implementation, not just a mathematical isomorphism.
  3.  **Redundancy Insensitivity:** Moral status does not multiply with physical copies of the same computation.

  **The Breakage:**
  If you hold (1) and (2), you run into the **Individuation/Duplication Wall**.
  To satisfy (2) (Anti-Mapping), you usually anchor the computation to specific causal physical processes. But if you anchor it to physical processes, then **three** physical servers running **one** logical emulation are **three** distinct causal processes.
  *   If status supervenes on the *computation* (1), it should be 1 unit of status.
  *   If status supervenes on the *physical causal process* (required for 2), it is 3 units of status.

  You cannot have it both ways without introducing a "binding" rule that says "these three physical processes count as one implementation." But defining that binding rule without arbitrariness is the **Individuation Problem** again.
  *   *Option A:* Accept that redundancy multiplies moral status. (Consequence: Safety engineering becomes morally costly).
  *   *Option B:* Accept that substrate matters (reject 1). (Consequence: Silicon emulations might not count).
  *   *Option C:* Accept that mapping is looser (reject 2). (Consequence: Panpsychism/Triviality risks increase).

  **The Partiality Breakage:**
  Requirement 4 (Gradience) conflicts with Requirement 1 (Robustness).
  To handle partial implementations (e.g., a network with 50% dropout), you need a metric of "how much" of the computation is present. But if you define that metric structurally, you risk violating Anti-Mapping (you can describe a rock as having 0.0001% of the structure). If you define it functionally, you risk the Lookup Table problem (a static table has 100% of the input-output structure). There is currently no agreed-upon metric for "degree of implementation" that doesn't collapse under one of the other constraints.

  ---

  ### 4. Quick Scorecard

  **Functionalism (Computational Theory of Mind)**
  *   **Performance:** High on Substrate Neutrality and Gradience. Low on Interpretation Robustness and Individuation.
  *   **Verdict:** Good for guiding AI development *if* you can solve the mapping problem. It handles partial implementations well (degraded function = degraded status). However, it struggles to explain why 3 redundant servers aren't 3 people, as it treats the logical state as primary, but the logical state is instantiated 3 times physically. It often fails Epistemic Accessibility because "functional role" is hard to define without circularity.

  **Integrated Information Theory (IIT) / Causal Structure Views**
  *   **Performance:** High on Interpretation Robustness and Individuation. Low on Epistemic Accessibility and Substrate Neutrality (arguably).
  *   **Verdict:** Excellent at the "Redundancy" problem; IIT naturally treats a redundant system as having the same $\Phi$ (integrated information) as a single system if the integration is the same. However, it is computationally intractable for large systems (violating Epistemic Accessibility for near-term engineering). It also risks Panpsychism (rocks have non-zero $\Phi$), requiring a threshold that violates Continuity.

  **Biological / Psychophysical Views**
  *   **Performance:** High on Epistemic Accessibility (look for biology) and Redundancy (biology doesn't duplicate like code). Low on Substrate Neutrality and Gradience.
  *   **Verdict:** The "Safe" option for status quo preservation. It cleanly avoids the AI moral status problem by fiat (no biology = no status). However, it fails the "Upload" test completely and violates Continuity (replacing one neuron shouldn't toggle moral status). It is action-guiding but likely factually wrong if functionalism holds. It offers no help for partial emulations other than "0 status until it looks human enough."
