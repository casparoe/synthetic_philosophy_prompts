      *   *Spelling:* Organisation, centralisation, programme, modelling, etc.
      *   *Structure:*
          1.  Validation of the user's instinct (It's not confused; it's acute).
          2.  Audit of Nuclear (Mapping, Breaks, Load-bearing).
          3.  Audit of Printing Press (Mapping, Breaks, Load-bearing).
