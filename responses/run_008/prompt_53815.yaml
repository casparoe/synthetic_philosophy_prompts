          *   *Breakdown:* Nuclear is physical/hardware-heavy; AI is software/digital (copyable). Nuclear development was state-led; AI is corporate-led (mostly). Nuclear use is binary (explode or not); AI use is continuous/gradient. Verification is hard in AI (weights can be hidden/steganographed).
          *   *Load-bearing Disanalogies:* Verifiability and Centralisation. If you can't inspect a model like a centrifuge, treaties fail. If power is diffuse (labs + open source), deterrence fails.
          *   *Policy Implication:* If the analogy holds, we need centralisation and bans. If it breaks, those policies are futile or dangerous.

      *   **Analogy 2: Printing Press (The Informational/Societal Frame)**
