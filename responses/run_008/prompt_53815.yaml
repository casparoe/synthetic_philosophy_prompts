          *   *Breakdown:* Press amplified human intent; AI *generates* intent/action. Press distribution was physical (books); AI is instant/global. Press took centuries to reshape society; AI is moving in years.
          *   *Load-bearing Disanalogies:* Agency and Speed. The press didn't act on its own; AI agents might. The timescale of adaptation is compressed.
          *   *Policy Implication:* If the analogy holds, adapt socially, don't try to ban. If it breaks (because AI acts autonomously), adaptation might be too slow.

      *   **Analogy 3: Industrial Revolution (The Economic/Labour Frame)**
