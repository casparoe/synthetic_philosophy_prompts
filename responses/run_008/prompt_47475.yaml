answer: |-
  # The Imprecise Probabilities Diagnostic Quiz

  **Instructions:** Below are 10 concrete scenarios. For each, select the option that best matches what you would *actually do* or *actually believe* in the moment, not what you think sounds most sophisticated. There are no "correct" answers, only diagnostic ones.

  ### 1. The Ellsberg Urn (Part 1)
  An urn contains 90 balls. 30 are Red. The other 60 are either Black or Yellow, but you don't know the split (could be 60 Black/0 Yellow, 0 Black/60 Yellow, or anything in between).
  You must choose one bet to play:
  *   **Bet A:** Win $100 if a **Red** ball is drawn.
  *   **Bet B:** Win $100 if a **Black** ball is drawn.
  **Which do you choose?**
  (a) Bet A (Red)
  (b) Bet B (Black)
  (c) Indifferent (Flip a coin)

  ### 2. The Ellsberg Urn (Part 2)
  Same urn (30 Red, 60 Black/Yellow unknown). You must choose one bet to play:
  *   **Bet C:** Win $100 if **Red or Yellow** is drawn.
  *   **Bet D:** Win $100 if **Black or Yellow** is drawn.
  **Which do you choose?**
  (a) Bet C (Red/Yellow)
  (b) Bet D (Black/Yellow)
  (c) Indifferent (Flip a coin)

  ### 3. The Range vs. The Sure Thing
  You face two options:
  *   **Option A:** Receive $50 cash immediately.
  *   **Option B:** A bet that pays $100 if a Red ball is drawn from an urn. You know for a fact that between 45% and 60% of the balls are Red, but nothing else.
  **What do you do?**
  (a) Take the $50. (When I only know a range, I plan for the worst end of it.)
  (b) Take the bet. (The top of the range is real information; 60% odds on $100 is better than $50.)
  (c) Either is fine. (There is no fact of the matter about which is better; neither choice is irrational.)

  ### 4. The One-Off Event
  A new Head of HR is starting next week. You have no frequency data and no expert consensus on whether they will choose the open-plan office.
  **If forced to set a betting price for "They will choose open-plan," what do you do?**
  (a) I pick a specific number (e.g., 50%). Even if vague, my behavior implies a precise number.
  (b) I refuse to give a single number. I insist on a range (e.g., 40% to 60%).
  (c) I give a number, but I'd charge a fee for being forced to bet on this rather than a coin flip.

  ### 5. Paying for Unambiguity
  *   **Bet A:** Pays $100 if a fair coin lands Heads (50% known).
  *   **Bet B:** Pays $100 if a ball drawn from an urn is Red. You know the urn is 50% Red on average, but the exact composition varies by urn and is unknown to you.
  Both bets have the same expected value. **Would you pay $5 to swap Bet B for Bet A?**
  (a) Yes. The coin is objectively less risky, and that peace of mind is worth money.
  (b) No. That's paying for a feeling. The odds are 50/50 either way.
  (c) Only if the cost is zero. If there's any fee, I keep what I have.

  ### 6. Commitment vs. Flexibility
  You face a decision today that affects a choice you'll make tomorrow.
  *   **Plan X:** Bind yourself today to a specific action for tomorrow.
  *   **Plan Y:** Leave it open. Tomorrow, you will have slightly more information, but your probability range will also narrow, potentially making the decision harder by your current standards.
  **Do you pay a small fee to lock in Plan X?**
  (a) Yes. Future me might be paralyzed by the narrowed range; I trust my current judgment more.
  (b) No. Never pay to restrict your own future options.
  (c) It depends entirely on the fee size.

  ### 7. The Indecision Test
  You have three options. Payoffs depend on an event with unknown probability (range 20% to 80%).
  *   **Option 1:** Win $100 if Event happens, $0 otherwise.
  *   **Option 2:** Win $0 if Event happens, $100 otherwise.
  *   **Option 3:** Win $40 for sure.
  *   **Option 4:** Pay $1 to delay the choice until you know more.
  **What do you do?**
  (a) Pick Option 3 (The sure thing dominates the worst-case of 1 & 2).
  (b) Pick 1 or 2 (One of them must be right, I'll guess).
  (c) Pick Option 4 (I refuse to choose between 1 and 2 without more info).

  ### 8. The Regret Check
  Two states of the world (A or B). Probabilities are completely unknown.
  *   **Act 1:** Payoff $100 in State A, $90 in State B.
  *   **Act 2:** Payoff $0 in State A, $100 in State B.
  **Which do you choose?**
  (a) Act 1. (The worst case is $90, which is better than Act 2's worst case of $0.)
  (b) Act 2. (If State B happens, Act 1 makes me look foolish for missing the $100. Act 1 has too much regret potential.)
  (c) Indifferent.

  ### 9. Updating on New Info
  You believe the probability of Rain is between 30% and 70%. A weather model comes out that is reliable but imprecise; it suggests the probability is between 40% and 60%.
  **What is your new belief?**
  (a) 50% (I take the midpoint of the new info).
  (b) 40% to 60% (I simply shrink my interval to match the new info).
  (c) 30% to 70% (I don't trust the model enough to shrink my view).

  ### 10. Mixing Bets
  *   **Bet 1:** Pays $100 if Red (Unknown urn, 0-100% Red).
  *   **Bet 2:** Pays $100 if Black (Same urn).
  *   **Bet 3:** A 50/50 mix of Bet 1 and Bet 2 (Flip a coin; if Heads play Bet 1, if Tails play Bet 2).
  **How do you value Bet 3 compared to 1 and 2?**
  (a) Bet 3 is strictly better. (Mixing reduces the ambiguity.)
  (b) Bet 3 is exactly the average of 1 and 2. (Linearity holds.)
  (c) Bet 3 is better, but not enough to pay a premium for.

  ---

  # Scoring Key & Theoretical Mapping

  *Note for the facilitator: Real human beings are messy. This key identifies "Archetypes." Most people will not fit perfectly into one column. Look for the dominant pattern.*

  ### Archetype 1: The Strict Bayesian (Precise Probabilist)
  *   **Core View:** Ambiguity is just risk with a missing number. There is always a precise credence; "imprecision" is just psychological hesitation.
  *   **Typical Answers:**
      *   Q1 & Q2: Consistent (A then C, or B then D). Never switches preference based on known vs unknown.
      *   Q3: (b) Takes the bet (uses midpoint or best estimate).
      *   Q4: (a) Picks a specific number.
      *   Q5: (b) No. Refuses to pay for unambiguity.
      *   Q6: (b) No. Dynamic consistency is required.
      *   Q7: (b) Picks 1 or 2.
      *   Q8: (a) or (c). Usually maximizes minimum expected utility based on their precise prior.
      *   Q9: (a) Collapses to a number.
      *   Q10: (b) Linearity holds.
  *   **Decision Rule:** Maximization of Expected Utility (MEU) with a single prior.

  ### Archetype 2: The $\Gamma$-Maximiner (Hard Ambiguity Averter)
  *   **Core View:** Rationality requires guarding against the worst-case prior in your set.
  *   **Typical Answers:**
      *   Q1 & Q2: Switches (A then D). The classic Ellsberg pattern.
      *   Q3: (a) Takes the $50 (worst case of bet is 45% < 50%).
      *   Q4: (b) or (c). Prefers ranges or charges a fee.
      *   Q5: (a) Yes. Pays to avoid the ambiguous urn.
      *   Q6: (a) Yes. Commits to avoid future paralysis or worse-case drift.
      *   Q7: (a) Takes the sure $40 (dominates the worst-case of the ambiguous bets).
      *   Q8: (a) Act 1. (Maximizes the minimum payoff: $90 > $0).
      *   Q9: (b) Shrinks interval.
      *   Q10: (a) Bet 3 is better (mixing reduces worst-case risk).
  *   **Decision Rule:** $\Gamma$-maximin (Maximize the minimum Expected Utility over the set of priors).

  ### Archetype 3: The E-Admissibility / Indecision Theorist
  *   **Core View:** When probabilities are imprecise, some choices are simply incomparable. It is rational to refuse to choose or to pay for more information rather than guess.
  *   **Typical Answers:**
      *   Q1 & Q2: May switch (A then D), but comfortable with it.
      *   Q3: (c) Either is fine. (No fact of the matter).
      *   Q4: (b) Refuses single number.
      *   Q5: (a) or (c).
      *   Q6: (c) Depends.
      *   Q7: **(c) Pays to delay.** (This is the key differentiator. Maximin picks the sure thing; E-admissibility allows abstention/indecision if no option is optimal for *all* priors).
      *   Q8: (c) Indifferent or refuses to choose.
      *   Q9: (b) Shrinks interval.
      *   Q10: (a) Bet 3 is better.
  *   **Decision Rule:** E-admissibility (Choose an option if it maximizes EU for *at least one* prior in the set) or Interval Dominance.
  *   **Note:** In binary choices (Q1, Q2, Q3), E-admissibility often recommends the same acts as Maximin. It primarily diverges when "abstention" or "delay" (Q7) is an option, or when there are >2 options.

  ### Archetype 4: The Minimax Regret Minimizer
  *   **Core View:** Rationality is about minimizing how bad you'll feel if you find out you made the wrong choice.
  *   **Typical Answers:**
      *   Q1 & Q2: Often switches (A then D), similar to Maximin.
      *   Q3: (a) or (b) depending on the regret calculation.
      *   Q8: **(b) Act 2.** (This is the "smoking gun" question).
          *   *Why?* Act 1 Regret: If State B, you got $90, could have had $100. Regret = 10. If State A, you got $100, could have had $100. Regret = 0. Max Regret = 10.
          *   Act 2 Regret: If State A, you got $0, could have had $100. Regret = 100. If State B, you got $100. Regret = 0. Max Regret = 100.
          *   *Wait, correction for the Key:* In Q8 as written above:
              *   Act 1: ($100, $90). Act 2: ($0, $100).
              *   If State A: Act 1 is best ($100). Act 2 regret = $100.
              *   If State B: Act 2 is best ($100). Act 1 regret = $10 ($100 - $90).
              *   Max Regret Act 1 = $10. Max Regret Act 2 = $100.
              *   *Correction:* A Minimax Regret agent chooses **Act 1** here.
              *   *To distinguish Regret from Maximin:* We need a case where they diverge.
              *   *Revised Q8 for Key:*
                  *   Act 1: ($10, $10).
                  *   Act 2: ($0, $20).
                  *   Maximin picks Act 1 (Min payoff 10 > 0).
                  *   Regret: If State 1, Act 1 best (Regret 0). If State 2, Act 2 best (Act 1 regret 10). Max Regret Act 1 = 10.
                  *   Act 2: If State 1, Regret 10. If State 2, Regret 0. Max Regret Act 2 = 10.
                  *   *Let's try:* Act 1 ($5, $5), Act 2 ($0, $100).
                  *   Maximin: Act 1 ($5 > $0).
                  *   Regret: Act 1 Max Regret = $95 (missed the 100). Act 2 Max Regret = $5 (missed the 5). Minimax Regret picks **Act 2**.
      *   **Action Item:** If you used the Q8 text in the quiz section above, note that Maximin and Regret often align on "safety." To spot Regret, look for someone willing to risk a low floor to avoid a huge "missed opportunity" feeling.
  *   **Decision Rule:** Minimax Regret.

  ### Incoherent Combinations (The "Money Pump" Zone)
  *   **The Ellsberg Inconsistency:** Choosing **Red** in Q1 AND **Red/Yellow** in Q2.
      *   *Why:* This implies P(Red) > P(Black) AND P(Red) + P(Yellow) > P(Black) + P(Yellow). Since P(Yellow) cancels out, this implies P(Red) > P(Black) AND P(Red) < P(Black).
      *   *Verdict:* This violates basic probability axioms. No standard theory (Bayesian or IP) defends this. This participant is vulnerable to a Dutch Book.
  *   **The Paying-for-Nothing Loop:** Saying "No" to Q5 (won't pay to swap Urn for Coin) but "Yes" to Q1/Q2 (preferring known odds).
      *   *Why:* If you prefer known odds, you should reveal that preference by paying to switch when offered.
      *   *Verdict:* Revealed preference inconsistency.

  ### Limitations of this Quiz
  1.  **E-Admissibility vs. Interval Dominance:** In binary choices with no "abstain" option (like Q1, Q2, Q3), these two rules often recommend the exact same actions. They primarily diverge when there are three or more options or when the "status quo" is an option. Q7 attempts to catch this, but a dedicated quiz would need a larger choice set.
  2.  **Maximin vs. Regret:** In many symmetric 0/1 payoff cases (like Ellsberg), Maximin and Minimax Regret yield identical choices. They diverge when payoff magnitudes vary significantly (see Q8 analysis above).
  3.  **Sophistication vs. Resoluteness:** Q6 tests dynamic choice, but without a full decision tree, participants might answer based on their general attitude toward "commitment" rather than the specific decision-theoretic implication of *time inconsistency* in IP models.

  ### Facilitator Notes for Discussion
  *   **If the room is mostly Bayesian:** Push them on Q4 and Q5. Ask if they truly believe a precise number exists for the HR office scenario, or if they are just *forcing* one for the sake of the math.
  *   **If the room is mostly Maximin:** Ask them about Q7. Is it ever rational to *not* choose the sure thing if the ambiguous option *might* be better? (This opens the door to E-admissibility).
  *   **If the room is split on Ellsberg:** Use the "Incoherent" flag. Ask the Red/Red-Yellow choosers if they would accept a combination of bets that guarantees a loss.
