      *   **Section 2: The Fate of Uninformative Priors.** Correct the "abandoned/killed" narrative. Distinguish Subjective vs. Objective Bayesianism. Mention Jeffreys.
      *   **Section 3: The "Specify the Experiment" Solution.** Validate the user's cube intuition. Explain the *re-description problem* (van Fraassen). Physical specs help but don't solve the philosophical core.
      *   **Section 4: Jaynes and Invariance.** Explain what Jaynes actually did (Maximum Entropy, symmetry). Note that it's a major contribution but not universally accepted as a "cleanup."
