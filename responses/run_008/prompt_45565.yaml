answer: |-
  This is a pedagogical plateau many of us hit. You have reached the point where the "Williams vs. Utilitarianism" debate has calcified into a ritual rather than an inquiry. Your students (and you) are sensing that the dialectic has become circular: Williams says "Utilitarianism destroys integrity," Utilitarians say "No, it protects it instrumentally," and Williamsians say "That protection is itself alienating."

  You asked for my actual view, not a survey. Here it is: **The Integrity Objection is fatal to Act Utilitarianism as a comprehensive decision procedure, but it fails against Sophisticated Consequentialism as a criterion of rightness.** The "relabeling" charge your seminar is making is often a rhetorical shield against a substantive psychological claim.

  Here is the breakdown of your three specific worries, followed by the ranked list of defeaters you requested.

  ### 1. Decision Procedure vs. Criterion of Rightness
  **Verdict: This is not a dodge; it is a dissolution of the objection.**

  If Williams insists that a moral theory *must* function as a decision procedure to be valid, he is begging the question against consequentialism. Consequentialism is fundamentally a theory about the *good* and the *right*, not necessarily a manual for deliberation.

  If a utilitarian says, "The right act is the one that maximizes utility, but the best way to *find* that act is to ignore utility and love your wife," Williams calls this a split in the moral personality. But this is only a split if you assume moral theory must be transparent to the agent at all times.

  **The Hard Truth:** If the utilitarian grants that agents should deliberate from within their projects, they have not given up anything that makes the view worth holding *unless* you think the value of utilitarianism is its ability to micromanage thought. The view remains worth holding because it provides the *truth conditions* for moral claims. If Williams replies, "Then your theory has no distinctive role in an agent's life," he is wrong. Its role is adjudicative, not generative. It steps in when projects conflict or when we reflect on the system as a whole. To demand it do more is to demand it be a religion rather than a moral theory.

  ### 2. The "One Thought Too Many" (OTTM)
  **Verdict: This is a category error. It belongs to phenomenology, not integrity.**

  You are right to suspect this point does different work. The Jim case is about *complicity* (negative responsibility). The OTTM case is about *motivational structure*.

  Williams argues that the husband who calculates utility before saving his wife lacks integrity because he is alienated from his commitment. But this conflates the *justification* of the act with the *motive* of the act. A sophisticated utilitarian can agree that the husband *should not* think about utility in the moment. In fact, the utilitarian *must* agree that he shouldn't, because a husband who calculates is a bad husband (and likely produces less utility).

  **The Hard Truth:** The OTTM intuition is robust, but it targets *psychologistic utilitarianism* (the idea that you must think like a utilitarian to be a utilitarian). Once you separate the criterion of rightness from the psychology of the agent, the "extra thought" disappears. The thought isn't "too many"; it's just in the wrong place (the philosopher's study, not the burning house). If Williams insists the *existence* of the justification undermines the *sincerity* of the motive, he is making an empirical claim about human psychology that is demonstrably false. People can have deep, non-instrumental loves while believing those loves are justified instrumentally at a meta-level.

  ### 3. Unfalsifiability and the Live Target
  **Verdict: The objection becomes unfalsifiable if Williams insists on "Transparency."**

  You asked if there is a formulation that would land a real blow on a committed Williamsian. Yes. It is the **Paradox of Hedonism applied to Morality.**

  If Williams concedes that human beings *cannot* successfully maximize utility by directly aiming at it (a claim supported by much moral psychology), then he must concede that a theory demanding they do so is self-defeating. If the Utilitarian says, "To maximize the good, you must have integrity (i.e., non-utilitarian commitments)," and Williams says, "But having those commitments for that reason isn't *real* integrity," Williams is defining integrity in a way that makes it incompatible with *any* overarching moral theory.

  **The Unfair Dismissal:** Your seminar's dismissal of Railton-style sophisticated consequentialism as "conceding and relabeling" is the unfair move. It is not a relabeling; it is a structural claim about the architecture of motivation. It argues that integrity is *constitutively* necessary for the utilitarian goal. To wave this away is to ignore the mechanism.

  ***

  ### Ranked List of Defeaters for the Integrity Objection
  *Ranked from Fatal (the objection collapses) to Awkward (the utilitarian survives but looks weird).*

  #### 1. The Psychological Impossibility Defeater (Fatal)
  **The Argument:** Human psychology is such that deep commitments (integrity) require opacity. We cannot maintain "ground projects" if we hold them tentatively, subject to constant utility calculation. Therefore, a utilitarian agent *must* cultivate non-utilitarian motives to be effective.
  **Why it's Fatal:** It turns the Integrity Objection on its head. Williams claims utilitarianism *destroys* integrity. This defeater shows utilitarianism *requires* integrity (or the psychological equivalent) to function. If you destroy integrity, you fail at utilitarianism. Thus, being a good utilitarian *just is* having integrity. The objection no longer identifies a conflict; it identifies a necessary condition.
  **Williamsian Concession Required:** A Williamsian must deny that one can genuinely hold a project while believing it is ultimately justified by utility. This is an empirical claim that is hard to sustain.

  #### 2. The Criterion/Procedure Distinction (Fatal)
  **The Argument:** Utilitarianism is a criterion of rightness, not a decision procedure. Integrity is a feature of deliberation (procedure). Therefore, a theory of rightness cannot logically violate a feature of deliberation unless it mandates a specific deliberation.
  **Why it's Fatal:** It shows Williams is attacking a straw man (Act Utilitarianism as a decision procedure). If the theory doesn't tell you how to think, it can't alienate you from your thoughts. It only judges the outcome.
  **Williamsian Concession Required:** Williams must argue that a moral theory that doesn't guide deliberation is empty. This forces him into a debate about the purpose of moral theory, where he loses to the utilitarian who says the purpose is *truth*, not *guidance*.

  #### 3. The "Ground Project" Rebuttal (Strong)
  **The Argument:** Utilitarianism *is* a ground project for some people. For the committed utilitarian, maximizing utility *is* their integrity-constituting commitment. To ask them to set it aside for "integrity" is to ask them to betray their integrity.
  **Why it's Strong:** It relativizes the objection. Williams describes *his* integrity (which values personal projects over general good). He presents it as universal. But for the saintly utilitarian, the general good *is* the personal project.
  **Williamsian Concession Required:** Williams must admit he is arguing against utilitarianism only for *non-utilitarians*. He cannot claim it violates integrity for someone whose integrity is built on utilitarianism.

  #### 4. The Negative Responsibility Reversal (Awkward)
  **The Argument:** In the Jim case, Williams relies on the intuition that Jim is not responsible for the Captain's actions. The utilitarian argues that in a causal world, omitting to act is a cause. If Jim refuses, 20 die. If Jim shoots, 1 dies. Jim is causally responsible for the 19 excess deaths if he refuses.
  **Why it's Awkward:** It doesn't dissolve the feeling of alienation, but it makes the Williamsian position look like a fetishization of "clean hands." It survives, but it forces the Williamsian to accept that they value their own psychological purity over 19 lives.
  **Williamsian Concession Required:** None, but it makes the Williamsian look morally costly.

  #### 5. The "Esoteric Morality" Charge (Merely Awkward)
  **The Argument:** If utilitarians must hide their utilitarianism and pretend to have non-utilitarian projects to work well (Sidgwick/Railton), the theory becomes elitist or duplicitous.
  **Why it's Awkward:** It doesn't refute the integrity objection, but it makes the utilitarian view socially unpalatable. It concedes that the public face of the theory must be non-utilitarian.
  **Williamsian Concession Required:** The Williamsian gets to say "Aha! Even you admit your theory can't be lived openly!" But this is a pragmatic victory, not a theoretical one.

  ### Summary for your Seminar
  Tell your students this: **Dismissing sophisticated consequentialism as "relabeling" is a cheap trick.** It is only a cheap trick if the utilitarian cannot explain *why* the split between criterion and procedure is stable. Railton explains the stability via psychology (you can't aim directly at the target).

  If your students wave that away, they are not refuting utilitarianism; they are asserting a dogma that "true integrity requires ignorance of one's ultimate justifications." That is a defensible position, but it is not a refutation of utilitarianism; it is a rival anthropology.

  The Integrity Objection survives only if you insist that moral theory must be transparent to be valid. If you drop that requirement, the objection dissolves. The utilitarian has not conceded; they have clarified the ontology of their theory. Williams demands the theory be a *life*; the utilitarian says it is a *measure*. You cannot measure a life with a life. You measure a life with a theory.
