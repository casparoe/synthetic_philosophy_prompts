          *   Conclusion: Summary of where the burden of proof lies.

  8.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Am I being too hard on Williams?
      *   *Correction:* Williams's point is deep. It's about *identity*. I need to acknowledge that the "relabeling" charge has *some* merit if the utilitarian doesn't explain *why* the split is stable. Railton explains the stability (psychological impossibility of direct aiming). I must emphasize *that* mechanism.
      *   *Critique:* Is OTTM really distinct from integrity?
