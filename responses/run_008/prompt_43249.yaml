answer: |-
  There is no established canonical term for this phenomenon in the philosophy of science literature, so I propose coining the term **Theoretical Exaptation** to describe it.

  While John Worrall's **structural realism** comes closest by arguing that the mathematical structure of a theory is often retained across paradigm shifts even when the ontology changes, it focuses on the continuity of formalism rather than the normative status shift of a specific hypothesis from "degenerating patch" to "progressive core." Similarly, Lakatos discusses the movement of problems between programmes but does not explicitly categorize the fate of individual auxiliary hypotheses that migrate from a protective belt to a hard core. **Theoretical Exaptation** specifically captures the functional reassignment of a hypothesis: it is defined as an auxiliary hypothesis introduced to protect a degenerating research programme from anomaly, which is subsequently retained as a fundamental principle or hard-core element in a successor progressive programme.

  To qualify as Theoretical Exaptation, three conditions must be met:
  1.  **Ad Hoc Origin:** The hypothesis must initially be introduced primarily to neutralize a specific anomaly without independent empirical support (e.g., Lorentz contraction to save the ether).
  2.  **Programme Succession:** The original research programme must be superseded or abandoned, not merely revised.
  3.  **Status Promotion:** In the successor programme, the hypothesis must cease to be a protective device and become a foundational postulate or load-bearing mechanism (e.g., Lorentz transformations becoming the structure of spacetime).

  This concept is distinct from **theory reduction**, where an older theory is shown to be a limiting case of a new one (e.g., Newtonian mechanics within Relativity), because the hypothesis itself changes its epistemic status from "suspect fix" to "fundamental truth." It is also distinct from simple **vindication**, where an auxiliary hypothesis is confirmed but remains an auxiliary (e.g., the existence of Neptune was postulated to save Newtonian orbits, then found; it did not become a law of nature itself).

  Two boundary cases illustrate the edges of this phenomenon where the promotion is genuinely unclear:

  1.  **The Neutrino:** Wolfgang Pauli proposed the neutrino in 1930 as a "desperate remedy" to save the conservation of energy in beta decay, fitting the ad hoc criterion. It was later detected and incorporated into the Standard Model. However, it is unclear if this counts as Theoretical Exaptation because the neutrino remained an *entity* within the ontology rather than becoming a *hard-core principle* like the Lorentz transformations; it moved from "hypothetical particle" to "real particle," but did not shift from "protective belt" to "structural foundation."
  2.  **Dark Matter:** Currently, Dark Matter functions as an auxiliary hypothesis to save Newtonian/Einsteinian dynamics from galactic rotation anomalies. If future physics confirms Dark Matter as a new sector of particle physics, it will be a case of successful vindication, not exaptation. However, if Dark Matter is eventually replaced by Modified Gravity (MOND), where the "fix" (changing the dynamics) becomes the core of a new theory, the *mathematical modification* currently attributed to Dark Matter might undergo Theoretical Exaptation, while the *particle hypothesis* dies. The uncertainty of its final theoretical status makes it a live boundary case.
