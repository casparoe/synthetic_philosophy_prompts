answer: |-
  **The Call**
  Your advisor will call this **genocide**.

  **The Rules Behind the Track Record**
  To understand why, we have to resolve the tension between the two interpretive frameworks that both fit her past verdicts.

  1.  **The "Physical Destruction" Rule (Convention-Strict):** This reading prioritizes the 1948 Convention's focus on bodily harm. Under this rule, genocide requires a campaign of killing, starvation, or conditions of life calculated to bring about *physical* destruction of the group's members.
      *   *Fits:* Rwanda (killing), Srebrenica (killing), Holodomor (starvation), Armenians (death marches).
      *   *Excludes:* Khmer Rouge (class-based), Boarding Schools (cultural damage, no mass death), Ethnic Cleansing (expulsion, survivors live).
      *   *Verdict on New Case:* **No.** There is no campaign of killing; the "low-grade violence" is too minor, and the mechanism is administrative assimilation, not physical destruction.

  2.  **The "Group Viability" Rule (Lemkinian):** This reading prioritizes Lemkin's original concept: the destruction of the group *as a distinct entity*. Physical killing is the most common method, but the core crime is ending the group's existence.
      *   *Fits:* Rwanda/Srebrenica/Holodomor (group destroyed via death).
      *   *Fits:* Armenians (She explicitly justified this not just by the deaths, but because the deportations were "engineered so Armenians would cease to exist as a people").
      *   *Excludes:* Boarding Schools (She ruled "No" specifically because the "community [was] surviving as a community").
      *   *Excludes:* Ethnic Cleansing (She ruled "No" because survivors were driven over the border, implying the group persists elsewhere).
      *   *Excludes:* Khmer Rouge (Wrong group type).
      *   *Verdict on New Case:* **Yes.** The group does not survive. The outcome is "effectively zero" self-identification.

  **Where They Diverge**
  The divergence hinges entirely on the **Boarding School** precedent versus the **Armenian** precedent.
  *   If she follows the *Physical Destruction* rule, the new case is "Ethnocide" (like the Boarding Schools) because there are no bodies stacking up.
  *   If she follows the *Group Viability* rule, the new case is "Genocide" (like the Armenians) because the group ceases to exist, whereas the Boarding School victims remained a distinct community.

  **Why I Commit to "Yes"**
  I am betting on the **Group Viability Rule**. Here is the reasoning:

  1.  **The "Community Survival" Distinction:** Her "No" on Boarding Schools was explicitly conditioned on the phrase "community surviving as a community." In your hypothetical, the prompt states census-takers "can't find the minority as a self-identifying group at all." She has drawn a bright line: if the group persists, it's ethnocide; if the group vanishes, it's genocide. This case crosses that line.
  2.  **The Armenian Precedent:** She validated the Armenian case not solely on the death toll, but on the *engineering of dispersal* to ensure they "cease to exist as a people in the empire." Your hypothetical is a textbook replicate of this mechanism: state relocation, dispersal into majority districts, and dissolution of institutions. The lack of mass killing is offset by the "completing the homogeneity" outcome.
  3.  **Intent vs. Rhetoric:** She knows perpetrators rarely write "we intend to genocide." She looked past the lack of explicit extermination orders in the Armenian case to the *engineering* of the outcome. She will look past the "integration" and "rescuing from backwardness" rhetoric to the structural reality: a state scheme that reduces a group of 600,000 to zero.
  4.  **The Lemkin Factor:** You noted she thinks the 1948 Convention was "watered down." The Convention excluded cultural genocide and limited forced transfer to *children* (Article II(e). By calling this genocide, she corrects the "watering down" regarding adult dispersal and total assimilation, aligning with her scholarly view of Lemkin without contradicting her practical restraint on the Boarding School case (where the group survived).

  **The "Smoking Gun" Follow-Up Case**
  To confirm this is her actual rule (and not just a one-off consistency), you need to isolate **Biological Destruction without Killing**.

  Raise this scenario in seminar:
  > "A government implements a mandatory, secret sterilization program for all women of a specific ethnic minority. There is no killing, no dispersal, and no cultural bans—they keep their language, religion, and villages. However, the policy is intended to ensure the group dies out naturally within two generations. Is that genocide?"

  *   **If she says Yes:** She is fully committed to the **Group Viability Rule**. It confirms that "destruction of the group" does not require killing, only the end of the group's existence. This validates my prediction on your main hypothetical.
  *   **If she says No:** She is closer to the **Physical Destruction Rule**. It suggests she requires *violent* physical destruction (killing/starvation) or *social* dissolution (dispersal), but not *biological* prevention. If she says No here, there is a risk she might pivot to "No" on your main hypothetical, classifying it as "Ethnocide" because no one was actively killed.

  **Why this works:** She will likely deflect if you ask about her definition directly. But a hypothetical on sterilization forces her to choose between the Convention's text (which includes preventing births) and her "body count" heuristic. It tests the boundary between "killing people" and "ending a people."
