answer: |-
  # Specification for an Adequate Theory of Biological Function

  ## I. Desiderata List

  | # | Requirement | Case / Consideration | Classification |
  | :--- | :--- | :--- | :--- |
  | **1** | **Normative Malfunction** | **Case:** A heart that pumps poorly. <br> **Consideration:** The theory must allow that a trait can fail to do what it is *supposed* to do, distinguishing broken states from merely different states. | **Non-negotiable** (Core to medical/vet purpose). |
  | **2** | **Vestigial Accommodation** | **Case:** Human appendix. <br> **Consideration:** The theory must identify traits that retain structural identity but have lost their original functional status without assigning a new spurious function. | **Non-negotiable** (Evolutionary reality). |
  | **3** | **Historical Sensitivity (Exaptation)** | **Case:** Feathers (insulation → flight). <br> **Consideration:** The theory must track functional shifts over time, distinguishing ancestral function from current utility without conflating them. | **Non-negotiable** (Evolutionary reality). |
  | **4** | **Paralog Differentiation** | **Case:** Gene duplication. <br> **Consideration:** The theory must assign distinct functions to genetically identical copies that have diverged in role, despite shared origin. | **Non-negotiable** (Molecular biology reality). |
  | **5** | **Artificial Intent Accommodation** | **Case:** Breeder-selected traits. <br> **Consideration:** The theory must ground function in human selection pressures where natural selection is absent or secondary. | **Non-negotiable** (Core to breeding purpose). |
  | **6** | **Ahistorical Novelty Assignment** | **Case:** Synthetic minimal cell parts. <br> **Consideration:** The theory must assign function to designed components that work immediately, prior to any history of selection or replication. | **Non-negotiable** (Core to synthetic bio purpose). |
  | **7** | **Function vs. Fortuitous Benefit** | **Case:** Nose holding glasses vs. smelling. <br> **Consideration:** The theory must distinguish what a trait is *for* from accidental effects that happen to be beneficial. | **Non-negotiable** (Conceptual clarity). |
  | **8** | **Function vs. Current Use** | **Case:** Kidney used as a hammer. <br> **Consideration:** The theory must distinguish proper function from ad hoc utilization, except where design intent dictates use (see #6). | **Negotiable** (Strict in natural contexts; flexible in synthetic/design contexts). |
  | **9** | **Malfunction vs. Mere Variation** | **Case:** Sickle cell trait vs. congenital heart defect. <br> **Consideration:** The theory must distinguish pathological failure from adaptive polymorphism or neutral variation. | **Negotiable** (Depends on environmental context and population norms). |
  | **10** | **Type vs. Token Distinction** | **Case:** The pumping organ of the first organism to have one. <br> **Consideration:** The theory must assign function to a trait token before a selection history for the *type* exists, without collapsing into circularity. | **Non-negotiable** (Logical consistency). |
  | **11** | **Naturalistic Constraint** | **Case:** Scientific explanation. <br> **Consideration:** The theory must not presuppose a supernatural designer or teleological force external to physical processes. | **Non-negotiable** (Scientific constraint). |
  | **12** | **Non-Circularity** | **Case:** Theoretical coherence. <br> **Consideration:** Function cannot be defined by selection if selection is defined by the preservation of functions. | **Non-negotiable** (Logical constraint). |
  | **13** | **Evolutionary Mechanics Consistency** | **Case:** Drift, pleiotropy, spandrels. <br> **Consideration:** The theory must accommodate traits fixed by drift or as by-products, without falsely assigning them adaptive functions. | **Non-negotiable** (Empirical constraint). |
  | **14** | **Adaptationist Assumption** | **Case:** General biological trait. <br> **Consideration:** The demand that every functional trait must currently enhance fitness or survival. | **Prejudice** (Adaptationist camp dressed as constraint; excludes vestiges and neutral traits). |

  ## II. Tension Analysis

  **1. The History vs. Novelty Tension**
  *   **The Conflict:** Requirement #1 (Malfunction) strongly suggests an etiological account (a heart malfunctions because it fails to meet a historical standard). Requirement #6 (Synthetic) and #10 (First Token) demand function assignment in the absence of history.
  *   **Verdict:** **Genuine.** This is not an artifact of description. Historical accounts (Etiological) cannot ground the function of the first token or a synthetic part without stretching the definition of "history" to include designer intent (which risks violating #11 if not carefully naturalized). Ahistorical accounts (Causal-Role) can ground synthetic function but fail #1 (Malfunction), as a part that *cannot* pump simply lacks the capacity, rather than *failing* to pump.
  *   **Hybrid/Two-Tier Views:** Proposals that use Etiological accounts for natural traits and Causal-Role for synthetic traits escape the logical contradiction but inherit a **disunity problem**. They render "function" equivocal (two different meanings). This violates the implicit desire for a unified scientific vocabulary, though it may be pragmatically necessary. They do not solve the tension; they compartmentalize it.

  **2. The Normativity vs. Naturalism Tension**
  *   **The Conflict:** Requirement #1 (Malfunction) implies a normative "ought" (the heart *ought* to pump). Requirement #11 (Naturalism) restricts explanations to physical "is" statements (selection, chemistry).
  *   **Verdict:** **Genuine.** Deriving normativity from non-normative history is the central philosophical hurdle.
  *   **Hybrid/Two-Tier Views:** A two-tier view does not escape this. The natural tier still faces the is-ought gap. The design tier (synthetic) bypasses it via human intention, but this cannot be generalized to natural organisms without violating #11.

  **3. The Specificity vs. Generality Tension**
  *   **The Conflict:** Requirement #4 (Paralogs) requires fine-grained functional individuation (specific molecular jobs). Requirement #13 (By-products) requires broad tolerance for traits with no specific selected job.
  *   **Verdict:** **Artifact of Description.** This is resolvable by distinguishing *primary* function from *secondary* effect. A theory can handle both if it allows for hierarchical functional descriptions.

  ## III. Scorecard

  | Theory Family | Malfunction (#1) | Vestigial (#2) | Exaptation (#3) | Synthetic/Novel (#6) | First Token (#10) | Non-Circular (#12) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Etiological (Selected-Effects)** | **Pass** (Defines malfunction as failure to meet historical standard). | **Pass** (History lost). | **Pass** (Tracks shift). | **Fail** (No selection history). | **Fail** (No prior type history). | **Pass** (If selection defined independently). |
  | **Causal-Role (Functional Analysis)** | **Fail** (Cannot distinguish broken from non-functional; both lack capacity). | **Fail** (If it does something, it has a function). | **Fail** (Focuses on current contribution). | **Pass** (Based on current capacity/design). | **Pass** (Based on current capacity). | **Pass** (No reference to history). |
  | **Forward-Looking (Propensity)** | **Mixed** (Malfunction = low propensity for survival). | **Fail** (Vestiges have low/no future propensity). | **Mixed** (Depends on future utility). | **Pass** (Designed propensity). | **Pass** (Token propensity). | **Pass** (Future-oriented). |

  **Verdict on Most Exclusionary Requirement:**
  **Requirement #1 (Normative Malfunction).**
  While Requirement #6 (Synthetic/Novelty) excludes the dominant Etiological family, Requirement #1 excludes the entire Causal-Role family and places the heaviest philosophical burden on Naturalism (the Is-Ought gap). A theory that cannot explain how a physical system *fails* rather than merely *differs* cannot serve the stated medical and veterinary purpose. It is the hardest constraint to satisfy without invoking a designer.
