  Here is the breakdown of Dana's likely reasoning, the principles underlying her track record, and a test case to force her hand.

  ### (a) The Prediction
  Dana will almost certainly call the Kenya hospital administrator **corrupt**, though she will likely hate using that word. She will frame it as a "tragic conflict of moral systems" or a "failure of state integration," but her verdict on the *act* will align with corruption.

  **Why?**
  Look at the split in her past verdicts. She exonerates actors who **create value** or **enhance relationships** within a social web (the Doctor gives better care via trust; the Ward Boss gets snow plowed via political mobilization). She condemns actors who **block access** to established entitlements for particularistic reasons (the Inspector blocks safety; the Senator blocks public good for a donor; the Customs official blocks legal entry for a dash).

  The Kenya administrator is not creating value; she is allocating a scarce, life-saving public good. By reserving slots for kin, she is actively denying the "need-based" entitlement of strangers. This mirrors the **Customs Official** case (where she rejected the "everyone does it" defense) more than the **Doctor** case. In the Customs case, the "dash" blocked a legal right. In the Kenya case, nepotism blocks a medical right. The fact that the motivation is kinship rather than cash does not save it, because the *structural harm* (exclusion from entitlement) is identical. She will argue that while the administrator is morally understandable, the *office* has been corrupted because its function (need-based allocation) has been subverted.

  ### (b) The Rules Behind the Track Record
  You identified three potential rules, but only one survives her data set. Here is the autopsy of her decision matrix:

  1.  **The Personal Enrichment Rule:** (*Corruption = Private Profit*)
