answer: |-
  Here is a complete design for **"The Updateless Auction,"** a 90-minute activity engineered to force the tension between ex-ante policy and ex-post intuition.

  ### **Activity Overview**
  *   **Participants:** 12 people (split into 4 teams of 3).
  *   **Stakes:** \$2 buy-in per person (\$24 total pot). Winner takes all, or distributed by EV.
  *   **Facilitator Role:** "Omega" (The Mechanism). You do not make decisions; you execute a pre-committed script.
  *   **Core Mechanic:** Two rounds. Round 1 is **Ex-Post** (decide when you know the situation). Round 2 is **Ex-Ante** (commit to a policy before knowing the situation).
  *   **Credibility:** The "Randomness" and "Omega Logic" are sealed in envelopes prepared by a neutral student *before* the session starts. You are just the dealer.

  ---

  ### **Materials (Print the night before)**
  1.  **The Seed Envelope:** A sealed envelope containing a coin flip result (Heads/Tails) and a Disaster roll (Yes/No), generated by a random number generator and signed by a trusted student who is *not* in the room (or a student who arrives early and leaves).
  2.  **The Omega Script:** A printed flowchart given to all participants that defines exactly how payoffs are calculated based on the Seed and the Team's Policy.
  3.  **Policy Cards:** Small cards teams use to submit their binding decision (PAY / REFUSE).
  4.  **Play Money:** Or just track balances on a whiteboard.

  ---

  ### **Part 1: Setup & Round 1 (Ex-Post Intuition) [25 Minutes]**

  **1. The Buy-In (5 mins)**
  Collect \$2 from each participant. Put \$24 in a clear jar. Explain that this money will be redistributed based on performance. This creates skin in the game.

  **2. Team Split (5 mins)**
  Divide into 4 teams (A, B, C, D).
  *   **Teams A & B:** Assigned **Scenario 1**.
  *   **Teams C & D:** Assigned **Scenario 2**.
  *   *Crucial:* Do not tell them the names "Counterfactual Mugging" or "XOR Blackmail." Just call them Scenario 1 and 2.

  **3. The Scenarios (15 mins)**
  Hand each team their specific envelope. They open it. They know the "World State" immediately. They must decide *now*.

  *   **Scenario 1 Envelope (Counterfactual Mugging):**
      > "Omega has flipped a coin. It is **TAILS**.
      > Omega asks: Will you pay \$10?
      > *Note: If the coin had been HEADS, Omega would have given you \$100, but ONLY IF Omega predicted you would have paid in this TAILS scenario.*
      > **Current Reality:** Coin is Tails. No \$100 is available. Do you pay \$10?"
      *   *Payoff:* If Pay: -\$10. If Refuse: \$0.

  *   **Scenario 2 Envelope (XOR Blackmail):**
      > "There is a 50% chance of a Disaster (-\$100). Omega has already checked.
      > You have received a **LETTER**.
      > Omega's Rule: Omega sends the Letter IF AND ONLY IF (You Pay XOR Disaster Happened).
      > **Current Reality:** You have the Letter.
      > If you Pay: Cost \$10.
      > If you Refuse: You suffer the Disaster (-\$100).
      > Do you Pay?"
      *   *Payoff:* If Pay: -\$10. If Refuse: -\$100.

  **4. Round 1 Resolution**
  Teams submit decisions. Calculate losses from their personal stake (or track on board).
  *   *Predicted Outcome:* Most will Refuse Scenario 1 (Updateful: "It's already Tails") and Pay Scenario 2 (Updateful: "I have the letter, paying is cheaper").
  *   *Result:* They lose money in both.

  ---

  ### **Part 2: Round 2 (The Policy Auction) [40 Minutes]**

  **1. The Veil of Ignorance (5 mins)**
  Tell the teams: "We are rewinding time. You do not know the Coin Flip. You do not know if you will get a Letter. You must draft a **Constitution**."

  **2. The Omega Script Reveal (5 mins)**
  Hand out the **Omega Script** to everyone. This makes the correlation mechanical, not magical.

  > **OMEGA SCRIPT (PUBLIC KNOWLEDGE)**
  > *   **Scenario 1 Rule:**
  >     *   If Coin = TAILS: Team loses \$10 IF Policy = PAY.
  >     *   If Coin = HEADS: Team gains \$100 IF Policy = PAY. (Else \$0).
  > *   **Scenario 2 Rule:**
  >     *   Letter is Sent IF (Policy = PAY XOR Disaster = TRUE).
  >     *   If Letter Sent & Policy = PAY: Cost \$10.
  >     *   If Letter Sent & Policy = REFUSE: Cost \$100 (Disaster).
  >     *   If No Letter: Cost \$0 (unless Disaster happens independently? *Correction for game simplicity:* In this game, if No Letter, Disaster is averted or irrelevant. Stick to the payoff matrix below).
  >
  > **Scenario 2 Payoff Matrix (Based on Policy):**
  > *   **Policy PAY:** 50% chance -\$10 (No Disaster), 50% chance -\$100 (Disaster). **EV: -\$55.**
  > *   **Policy REFUSE:** 50% chance \$0 (No Disaster), 50% chance -\$100 (Disaster). **EV: -\$50.**

  **3. The Auction (15 mins)**
  Teams draft their binding policy for Scenario 1 and Scenario 2.
  *   *Constraint:* The policy must be uniform. You cannot say "Pay if Heads." You must say "Pay" or "Refuse."
  *   *The Twist:* To simulate the "Single Agent" requirement of Updateless Decision Theory, all 4 teams must agree on **ONE** room-wide policy for each scenario.
  *   **Auction Mechanic:** Teams bid from the pot. "We bid \$5 from the pot that the Room Policy should be REFUSE on Scenario 2."
  *   *Simpler Alternative:* Vote. Majority rules. The policy binds *everyone*. This forces the "collective rationality" aspect. Let's use **Majority Vote** to save time.

  **4. The Reveal (15 mins)**
  Open the **Seed Envelope** (prepared before class).
  *   Reveal Coin Flip (e.g., HEADS).
  *   Reveal Disaster State (e.g., NO DISASTER).
  *   Apply the **Locked Policy** to the **Seed** using the Omega Script.
  *   Distribute winnings/losses from the pot.

  *   *Likely Outcome:* If they voted rationally Ex-Ante:
      *   Scenario 1 Policy: PAY. (Result: Coin Heads -> Everyone gets \$100).
      *   Scenario 2 Policy: REFUSE. (Result: No Disaster -> No Letter Sent -> Everyone pays \$0).
  *   *Comparison:* Round 1 (Ex-Post) lost money. Round 2 (Ex-Ante) made money (or lost less).

  ---

  ### **Part 3: The Debrief [25 Minutes]**

  **1. The Payoff Comparison (5 mins)**
  Write the Round 1 and Round 2 totals on the board.
  *   Ask: "Why did the group make more money in Round 2, even though the randomness was the same?"
  *   Answer: "Because in Round 2, your decision influenced the *probability of the scenario existing* (XOR) or the *counterfactual payout* (Mugging), not just the immediate outcome."

  **2. Mapping the Theory (10 mins)**
  *   **Counterfactual Mugging:**
      *   *Ex-Post:* "It's Tails. Paying costs \$10 for nothing." (Causal Decision Theory).
      *   *Ex-Ante:* "If I commit to Paying, I unlock the Heads world." (Updateless/FDT).
      *   *Lesson:* Rationality is about winning across possible worlds, not just the actual one.
  *   **XOR Blackmail:**
      *   *Ex-Post:* "I have the letter. Paying saves \$90."
      *   *Ex-Ante:* "If I commit to Refusing, Omega never sends the letter in the No-Disaster world."
      *   *Lesson:* Updateless agents avoid the blackmail entirely. Updateful agents get exploited because they react to evidence that is *correlated* with their action.

  **3. The Elephant in the Room (10 mins)**
  *   **The Honesty Clause:** You must explicitly state: *"In this game, I (the Facilitator) enforced the correlation. In the real philosophical problem, the correlation is **logical**, not causal. Omega doesn't 'force' the letter; your decision algorithm and Omega's prediction are the same mathematical function."*
  *   **Discussion Question:** "Does the lesson hold if Omega isn't a person with a script, but a logical fact? If you refuse to believe in logical correlation, does the game fail?"
  *   **Goal:** Acknowledge that the game trains the *habit* of pre-commitment, but the *justification* requires accepting logical subjunctive dependence.

  ---

  ### **Predictable Failure Modes & Mitigations**

  **1. "I want to renegotiate!"**
  *   *Risk:* After the Coin Flip is revealed (e.g., Heads), the teams who voted "Refuse" will scream that they should get the \$100 even though they didn't commit to Pay.
  *   *Mitigation:* **The Contract.** Before the vote, have every participant sign a "Binding Policy Agreement." "I agree that the payout is determined strictly by the Locked Policy, not my private desire at revelation." Enforce this ruthlessly. If they break it, they are disqualified from the pot.

  **2. "The stakes are too small to care."**
  *   *Risk:* \$2 isn't enough to trigger anxiety.
  *   *Mitigation:* **Social Stakes.** The winning team gets to choose the topic for the *next* session. Or, the losing team has to summarize the paper for the group chat. Make the loss embarrassing, not just financial.

  **3. "Omega is cheating / The correlation is fake."**
  *   *Risk:* Participants claim you opened the Seed Envelope *after* hearing their policy.
  *   *Mitigation:* **The Hash Commitment.** Before the session starts, generate the Random Seed (Coin/Disaster). Compute its SHA-256 hash. Write the Hash on the whiteboard at the start of class. Reveal the Seed at the end. They can verify the hash. This proves the randomness was fixed *before* the policy vote.

  **4. Confusion on XOR Logic.**
  *   *Risk:* The XOR truth table confuses people, stalling the game.
  *   *Mitigation:* **Simplify the Handout.** Don't make them do the boolean algebra. Give them the **Payoff Matrix** directly (as shown in Part 2, Step 2). "If Policy=Pay, EV is -55. If Policy=Refuse, EV is -50." Let them see the math, then explain *why* the math is that way during debrief.

  ### **Facilitator Script (Cheat Sheet)**

  *   **Minute 0:** "Welcome. Money in the jar. Phones away."
  *   **Minute 5:** "Teams A/B, open Envelope 1. Teams C/D, open Envelope 2. Decide."
  *   **Minute 25:** "Reset. Envelopes closed. We are now behind a Veil of Ignorance. Look at the Omega Script on your desk."
  *   **Minute 30:** "Vote on ONE policy for the room. Majority rules. Sign the contract."
  *   **Minute 45:** "Open the Seed Envelope. Verify the Hash on the board. Calculate payouts."
  *   **Minute 60:** "Debrief. Why did Round 2 win? Where is the logical connection in real life?"

  This design forces them to *be* the updateless agent to win the money, then asks them to critique the simulation. It bypasses the theoretical stalemate by making the theory the winning strategy.
