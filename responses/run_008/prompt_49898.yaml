answer: |-
  1. If intelligent action requires grasping a proposition before acting, doesn't this invite Ryle's regress of prior contemplations? If you avoid this by claiming the grasp is unconscious, aren't you conceding that the propositional attitude is doing no explanatory work distinct from the ability itself?

  2. Given that memorizing cycling manuals doesn't enable riding, isn't the practical mode of presentation merely a label for the ability you are trying to reduce? If this mode is what bridges the gap, what independent evidence is there for its existence beyond the successful performance itself?

  3. Consider a flamenco dancer who learns by imitation and cannot describe her technique; if she lacks any propositional grasp, isn't your view forced to posit invisible knowledge? If you insist she knows propositions non-linguistically, doesn't this stretch the concept of propositional knowledge until it is indistinguishable from mere bodily competence?

  4. If a paramecium pursuing nutrients counts as knowing how, must we attribute propositional attitudes to single-celled organisms? If you deny they have knowledge despite having abilities, doesn't this sever the link between know-how and knowledge that your view aims to establish?

  5. Even if know-how attributions pattern syntactically with embedded questions, why should semantic structure dictate metaphysical reality? If the practical mode of presentation explains away every counterexample, isn't the view functioning as a placeholder that makes intellectualism hard to falsify?
