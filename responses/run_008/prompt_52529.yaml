  Based on the track record you've described, your friend is operating with a specific, two-part heuristic for distinguishing "history" from "legend." While she likely blends these intuitively, we can disentangle them into two candidate rules that fit her past verdicts but diverge on your new cases.

  ### The Candidate Rules

  **Rule 1: The "Archaeological/External Event" Criterion**
  *   **Definition:** A verdict of **Yes** is given if there is independent archaeological or contemporary external evidence for the *central conflict, setting, or political entity*, even if the specific hero's deeds are mythologized.
  *   **Fit with Past Data:**
      *   **Trojan War (Yes):** Hisarlik (Troy) shows destruction layers consistent with the Late Bronze Age; Hittite texts mention "Wilusa" and "Ahhiyawa." The *context* is corroborated.
      *   **Gilgamesh (Yes):** Uruk existed; the Early Dynastic period is archaeologically real.
      *   **Arthur/Ragnar/Tell/Exodus (No):** No archaeological "Arthur Layer," no specific "Ragnar Raid" signature, no evidence of the specific Exodus event.

  **Rule 2: The "Onomastic Attestation" Criterion**
  *   **Definition:** A verdict of **Yes** is given only if the *specific name* of the central figure appears in a contemporary or near-contemporary source that is *not* the epic/poetic tradition itself (e.g., king lists, chronicles, inscriptions).
  *   **Fit with Past Data:**
      *   **Gilgamesh (Yes):** His name appears in the Sumerian King List and early inscriptions.
      *   **Arthur/Ragnar/Tell/Moses (No):** None appear in contemporary records (Gildas does not name Arthur; no rune stones name Ragnar; no Egyptian records name Moses).
      *   **Trojan War (Yes*):** *This is the friction point.* The specific heroes (Achilles, Hector) are not named in Hittite records. She likely accepts this as a **Yes** because Rule 1 is so strong here, or she accepts "Wilusa" as sufficient proxy.

