prompt: |-
  I'm a hospital chaplain. Couple times a week, sometimes at 3am right after someone dies, I get the question every chaplain dreads: why did God let this happen. I have maybe ten minutes, the family is in the hallway, and whatever I say next their going to remember for years. I also train volunteer chaplains with basically zero theology background, and they freeze exactly here — either they say nothing, or worse, they reach for some line about everything being part of a plan.

  Theologians have whole literatures on this — theodicies, the free will defense, soul-making, the Book of Job, distinctions I half remember from seminary. But none of it is in a shape I can actually use at a bedside, and I need something the volunteers can run too. Can you build me a procedure?

  What I want: a set of questions to ask myself (or the family) in order, to figure out what kind of "why" question I'm actually facing — is it a demand for a metaphysical explanation, or is it really "where were you / do you still love me" dressed up as theology — and then, based on that classification, which resources are on the table and which are flat off-limits. It needs to say where the procedure stops with "just be present, drop the theory," and where it hands off to me because it's a values call that a checklist can't make. Then run it on three cases that feel real: (1) a mother asking why God let her 8-year-old die of cancer, who grew up believing suffering is punishment, and who has now concluded her daughter died because of something she did — I need to know if the procedure tells me to engage that frame or just sit with her; (2) a family who wants me to tell their dying father it's God's will so he'll stop fighting the ventilator — they're basically asking me to deploy a theodicy as a tool, and I suspect the answer is no but I want the procedure to say so; (3) an atheist patient, no belief at all, who asks me mockingly whether I've got an answer for him too.

  And be honest about where this thing will misfire — I'd rather find out now than in the hallway.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Hospital chaplain (experienced) training volunteer chaplains (novice).
      *   **Problem:** The "Why did God let this happen?" question in crisis moments (e.g., 3 AM, post-death, hallway). High stakes (memory lasts years). Volunteers freeze or offer harmful platitudes ("God's plan").
      *   **Need:** A practical *procedure* (algorithm/flowchart style) to diagnose the *type* of "why" being asked and determine the appropriate response (or non-response).
      *   **Requirements:**
          *   Diagnostic questions (metaphysical vs. relational vs. emotional).
          *   Resource mapping (what tools are okay vs. off-limits).
          *   Stop conditions (when to just be present).
          *   Handoff conditions (when to call the pro).
          *   Three specific case studies (Mother/Guilt, Family/Instrumentalization, Atheist/Mockery).
          *   Honest limitations (where the procedure fails).
      *   **Tone:** Professional, empathetic, realistic, theologically nuanced but practically grounded. No academic jargon without translation.

  2.  **Deconstruct the "Why" Question:**
      *   In pastoral care, "Why?" is rarely a request for a lecture on Leibniz or Augustine.
      *   It's usually one of three things:
          1.  *Lament:* "This hurts, and I need you to witness the absurdity of it."
          2.  *Guilt/Fear:* "Did I cause this? Is God angry?"
          3.  *Control:* "If I can name the cause, I can prevent the next one / make sense of the chaos."
      *   *The Danger:* Providing a metaphysical answer (Theodicy) to an emotional/relational question causes spiritual injury.

  3.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Name:* Let's call it the "Pastoral Triage for Theodicy" or "The 3AM Protocol."
      *   *Step 1: Safety & Presence.* Before answering, ensure physical safety and basic connection.
      *   *Step 2: Diagnostic Questions.* Need to filter the intent.
          *   Q1: Is this a demand for facts or a cry of pain?
          *   Q2: Is there active guilt/self-blame?
          *   Q3: Is there coercion involved (using God to control someone)?
      *   *Step 3: Decision Tree.*
          *   If Pain/Lament -> Witness/Hold Space.
          *   If Guilt -> Reassure/Disconnect Sin from Suffering.
          *   If Coercion -> Refuse/Protect Patient.
          *   If Intellectual/Curious -> Engage (Rare in crisis).
      *   *Step 4: The "Off-Limits" List.* Explicitly ban "God's Plan," "Everything happens for a reason," etc.
      *   *Step 5: Handoff.* When does the volunteer call the staff chaplain?

  4.  **Developing the Case Studies:**
      *   *Case 1 (Mother/Guilt):* High risk of spiritual trauma. The "Why" is actually "Am I bad?" Procedure must flag the guilt component. Action: Dismantle the punishment frame, do not explain the cancer.
      *   *Case 2 (Family/Instrumentalization):* Ethical violation. Using God to hasten death/compliance. Procedure must flag coercion. Action: Refuse, protect patient autonomy.
      *   *Case 3 (Atheist/Mockery):* Relational test. "Are you going to preach at me?" Procedure must flag the power dynamic. Action: Solidarity, honesty, drop the "God talk."

  5.  **Refining the Limitations (The "Misfire" Section):**
      *   Protocols can make people robotic.
      *   Volunteers might over-rely on the checklist.
      *   Some situations are too complex for a 10-minute triage.
      *   The chaplain's own grief can cloud the diagnosis.

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Introduction:* Acknowledge the weight. Validate the fear.
      *   *The Core Concept:* Distinguish *Explanation* (Metaphysical) from *Lament* (Relational).
      *   *The Protocol:* Use clear steps. "Stop," "Ask," "Decide."
      *   *The "Red Lines":* What volunteers must *never* say.
      *   *The Cases:* Walk through the protocol for each.
      *   *The Failure Modes:* Be brutally honest.

      *(Self-Correction during drafting)*: I initially thought about giving volunteers specific scripture. *Correction:* No, in a crisis, scripture can be weaponized. Better to give them *postures* (listening, silence, "I don't know"). Keep the theology implicit in the care, not explicit in the argument.
      *(Refining the "Handoff")*: Make sure the volunteer knows *exactly* when to page the staff chaplain. It shouldn't be "when you're scared," it should be "when X condition is met."

  7.  **Final Review against Constraints:**
      *   Did I answer the specific cases? Yes.
      *   Is it usable at 3 AM? Yes, kept it concise.
      *   Did I address the volunteer training aspect? Yes, emphasized simplicity.
      *   Is the tone right? Respectful of the vocation.

  8.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "Theodicy" (defending God) and "Pastoral Care" (holding the person) is sharp. (Proceed to generate output).

  *(Post-computation thought)*: I need to make sure I don't sound like I'm giving medical advice or psychological diagnosis. Stick to pastoral boundaries. The focus is on the *question*, not the medical outcome.

