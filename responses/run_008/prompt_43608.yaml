answer: |-
  Here is a draft for your debate club blog. I've designed this to cut through the label-switching and force people to commit to concrete outcomes. I've used British English throughout.

  ***

  # The "Who Counts and Who Pays?" Diagnostic
  **A Quiz for the Refugee Motion**

  We keep arguing past each other. When someone says "refugee", half the room hears "political dissident" and the other hears "anyone fleeing hardship". When someone says "take in", half hear "resettle in the UK" and the other hears "fund camps nearby".

  This quiz doesn't ask for your political label. It asks about ten concrete cases. Your answers will map you to one of four philosophical positions. Be honest—pick the option that matches your gut reaction to the *case*, not the one that sounds like your usual team.

  ### Part 1: Who Counts? (Definition)

  **1. The Political Dissident**
  A journalist in Iran is jailed for criticising the Supreme Leader. He escapes and claims asylum in the UK.
  *   **A)** He is a refugee. The state is directly persecuting him.
  *   **B)** He is a refugee, but Iran is a long way away; he should have claimed in Turkey first.
  *   **C)** He is not a refugee unless he can prove he will be tortured, not just jailed.

  **2. The Gang Victim**
  A woman in El Salvador flees after her brother testified against a cartel. The cartel threatens to kill her. The police are too corrupt to protect her, but the state isn't targeting her personally.
  *   **A)** She is a refugee. Protection from the state is unavailable, which amounts to persecution.
  *   **B)** She is a victim of crime, not a refugee. This is a matter for international aid, not asylum.
  *   **C)** She qualifies for temporary humanitarian protection, but not full refugee status.

  **3. The Climate Displacee**
  A family's island nation is sinking due to rising sea levels. Their home will be underwater in five years. They move to the UK.
  *   **A)** They are refugees. Loss of homeland is as severe as political persecution.
  *   **B)** They are climate migrants. They should be admitted via a specific visa scheme, not asylum.
  *   **C)** They are economic migrants. Environmental change is not persecution.

  **4. The Economic Fleeer**
  A man leaves a country with 80% unemployment and no functioning healthcare. He is not threatened with violence, but his children will likely die of preventable disease if he stays.
  *   **A)** He is a refugee. The threat to life is real, regardless of the cause.
  *   **B)** He is a migrant. Asylum is for targeted persecution, not general state failure.
  *   **C)** He is a migrant, but wealthy nations have a duty to offer work visas to people from the poorest nations.

  ### Part 2: Who Takes Them In? (Obligation)

  **5. The Nearest Safe Country**
  A Syrian refugee passes through Greece (safe) and Germany (safe) to claim asylum in the UK.
  *   **A)** The UK should return them to the first safe country they entered.
  *   **B)** The UK should process them. Choice of destination matters for integration.
  *   **C)** The UK should process them only if they have family ties here.

  **6. The Capacity Argument**
  The UK's housing and school places are at breaking point. A boat arrives with 50 claimants.
  *   **A)** Turn them away temporarily until capacity exists. Citizens' welfare comes first.
  *   **B)** Take them in anyway. Human rights are not contingent on housing stock.
  *   **C)** Take them in, but fast-track deportation if they commit any crime.

  **7. The Historical Responsibility**
  The UK sold arms to a regime that later collapsed, causing a civil war. Refugees from that war arrive here.
  *   **A)** We have a special duty to take these specific people because we contributed to the instability.
  *   **B)** Our duty is the same as to any other refugee. Causality is too hard to prove.
  *   **C)** Our duty is less, because accepting them encourages more dangerous journeys.

  **8. The Outsourcing Model**
  The UK pays Rwanda to process and host asylum seekers instead of doing it in Britain.
  *   **A)** This is acceptable if the safety standards are met. Location doesn't matter.
  *   **B)** This is unacceptable. Rich nations must physically host their share, not just write cheques.
  *   **C)** This is acceptable only as a temporary emergency measure.

  **9. The Queue Jumper**
  A refugee bypasses the UNHCR resettlement programme and arrives by small boat to claim asylum immediately.
  *   **A)** Penalise them (e.g., no right to settle) to discourage dangerous travel.
  *   **B)** Process them normally. The right to claim asylum applies wherever you land.
  *   **C)** Process them, but give priority to those who waited in the official queue.

  **10. The Global Quota**
  A UN proposal suggests every country must take 0.5% of its population in refugees annually.
  *   **A)** Support it. Burden-sharing must be mandatory and numerical.
  *   **B)** Oppose it. States must retain sovereignty over their borders.
  *   **C)** Support it in principle, but exempt countries with high population density.

  ***

  # Scoring Key: Which Profile Are You?

  Don't count points. Look for the *pattern* of your answers. Most people will be a hybrid, but one of these four will feel like your 'home' position.

  ### 1. The Convention Purist (Mostly A in Part 1, Mixed in Part 2)
  *   **The View:** You stick closely to the 1951 Refugee Convention. A refugee is someone with a well-founded fear of *state* persecution. You are sympathetic to them, but wary of expanding the definition too far, fearing it dilutes protection for those most at risk.
  *   **On Obligation:** You likely support the "Nearest Safe Country" rule (Q5) and are sceptical of mandatory quotas (Q10).
  *   **Philosophical Anchor:** Legal Positivism. The law is the law; if we want to help climate migrants, make a new law, don't stretch the old one.
  *   **Defenders:** Many legal scholars; historically associated with the original drafters of the Convention.

  ### 2. The Humanitarian Expansionist (Mostly A/B in Part 1, Mostly B in Part 2)
  *   **The View:** You believe the *spirit* of asylum matters more than the *letter*. If someone will die or suffer gross human rights violations (gangs, climate, poverty), they count. You prioritise need over legal technicalities.
  *   **On Obligation:** You reject outsourcing (Q8) and capacity limits (Q6). You believe if the need is there, the resources must be found.
  *   **Philosophical Anchor:** Cosmopolitan Humanitarianism. Human suffering creates a duty regardless of borders.
  *   **Defenders:** Philosophers like Peter Singer (utilitarian version) or Martha Nussbaum (capabilities approach).

  ### 3. The National Prioritiser (Mostly C/B in Part 1, Mostly A in Part 2)
  *   **The View:** You believe states are primarily responsible for their own citizens. Asylum is a limited exception, not a general remedy for global inequality. You distinguish sharply between 'refugees' (persecuted) and 'migrants' (seeking better lives).
  *   **On Obligation:** You support proximity rules (Q5), capacity limits (Q6), and outsourcing if safe (Q8). You value order and sustainability.
  *   **Philosophical Anchor:** Communitarianism / Statism. We have special duties to our own community first.
  *   **Defenders:** Political theorists like David Miller or Michael Walzer.

  ### 4. The Global Egalitarian (Mostly A in Part 1, Mostly A in Part 2)
  *   **The View:** You see borders as morally arbitrary. You are less interested in "who is a refugee" and more in "who has a right to move". You often answer 'A' because you think the distinction between refugee and migrant is unjust.
  *   **On Obligation:** You support global quotas (Q10) and reject capacity limits (Q6). You might view historical responsibility (Q7) as a baseline for reparations.
  *   **Philosophical Anchor:** Open Borders / Global Justice. Freedom of movement is a basic human right.
  *   **Defenders:** Philosophers like Joseph Carens (*The Ethics of Immigration*).

  ***

  # The Logical Space: How This Quiz Works (And Where It Fails)

  You asked me to build this from the questions first and map the logical space. Here is the breakdown of the design, the combinations that don't exist, and the blind spots you need to watch out for in the debate.

  ### 1. The Dimensions
  I have constructed the quiz along two independent axes. Logically, you can mix and match these, but politically, they tend to cluster.
  *   **Axis 1: Scope of Protection (Questions 1–4).** Does protection cover only state persecution (Narrow), or does it cover violence, climate, and poverty (Broad)?
  *   **Axis 2: Grounds of Duty (Questions 5–10).** Is the duty based on proximity and order (Restrictive), or based on capacity and need (Expansive)?

  ### 2. The Empty Combinations (Positions Nobody Holds)
  In the logical space of $2^{10}$ possible answer keys, some combinations are theoretically possible but politically incoherent.
  *   **The "Anarchist Humanitarian":** Someone who answers "Yes, everyone is a refugee" (Broad Scope) but "No, states have no duty to house them" (No Duty). This is incoherent. If you recognise a right to asylum, you logically accept a duty to provide it. If you see this profile in your club, ask them *where* they think the refuge should be provided if not by states.
  *   **The "Causal Isolationist":** Someone who answers "We caused the war, so we have no duty" (Q7 Option C) while also answering "We must protect our citizens first" (Q6 Option A). While consistent, this is rarely a stated position. Usually, those who prioritise citizens admit a *some* duty for causal responsibility. If someone claims this, they are likely arguing in bad faith.

  ### 3. The Indistinguishable Positions (Where the Quiz Fails)
  This is the most important part for your debate. The quiz cannot separate two specific viewpoints, and you need to know this so you don't let debaters talk past each other.

  *   **The "Protection in Region" vs. "National Prioritiser" Blind Spot:**
      *   **The Problem:** A student might answer **3B** (Climate migrants need visas, not asylum) and **8A** (Outsourcing is okay).
      *   **The Ambiguity:** This looks like a **National Prioritiser** (restrictive). However, it could also be a **Regionalist**. A Regionalist believes we *should* help, but that funding camps in neighbouring countries is morally superior to flying people to the UK (better integration, less danger).
      *   **The Debate Risk:** In the round, the Regionalist and the National Prioritiser will vote the same way on policy (fewer arrivals to the UK) but for opposite moral reasons. One says "We shouldn't take them," the other says "We should help them *there*."
      *   **Fix:** If someone scores as a National Prioritiser, ask them: *"Do you oppose taking refugees because of the cost to us, or because you think protection is better delivered closer to home?"*

  *   **The "Capacity" vs. "Causality" Blind Spot:**
      *   **The Problem:** Questions 6 (Capacity) and 7 (Causality) often yield the same vote for UK/US students. Rich countries are usually the ones who sold the arms.
      *   **The Ambiguity:** A student might support taking more refugees because "we are rich" (Utilitarian) or because "we broke it" (Reparations). The quiz groups these together under **Humanitarian Expansionist**.
      *   **The Debate Risk:** In a debate, the Reparations argument is much harder to refute than the Wealth argument. If you treat them as the same, the Opposition might attack the Wealth argument while the Proposition is defending the Reparations argument.
      *   **Fix:** Force the distinction in the prep room. *"Is our duty because we have money, or because we have blood on our hands?"*

  ### 4. Where the Quiz Will Mislabel People
  I am most concerned about **Question 6 (Capacity)**.
  *   **The Risk:** A principled **Humanitarian Expansionist** might answer **6A** (Turn them away until capacity exists) simply because they are being pragmatic, not because they believe citizens come first morally.
  *   **The Result:** The quiz will mislabel them as a **National Prioritiser**.
  *   **What Would Change My Mind:** If a significant number of students select "Take them in anyway" (6B) but "Outsourcing is okay" (8A). This suggests they care about *safety* but not *location*. If I see that pattern, the quiz needs a new question distinguishing "Physical Presence" from "Financial Responsibility".

  ### 5. Final Advice for the Chair
  When you run this, don't just tally the scores. Use the results to assign sides.
  *   If you have two **Convention Purists**, put them against each other. One will argue for strict adherence to the law; the other will argue the law is outdated.
  *   If you have a **National Prioritiser** against a **Global Egalitarian**, watch out. They are talking about different things (Order vs. Justice). Your job as Chair is to interrupt and ask: *"Are we arguing about whether we *can* take them, or whether we *should*?"*

  This quiz won't solve the debate, but it should stop you from arguing about definitions for the first twenty minutes. Good luck.
