answer: |-
  Yes, there is a principle that saves all six verdicts, including the Vienna slang. Your tentative principle ("feeds new work") fails because it is **utilitarian**; it judges history by its *output*. Nietzsche's framework, however, is **vitalist**; it judges history by its effect on the *organism*.

  Here is the repaired principle:

  **"A use of history is good when it is metabolized by the writer; it is bad when the writer is swallowed by it."**

  ### How this saves your six verdicts

  This principle shifts the metric from "Does this appear in the manuscript?" to "Does this sustain the living agency of the creator?"

  1.  **WWI Nurses (Monumental/Good):** You metabolize the courage. It becomes fuel for your own creative act. You are using the past to empower the present.
  2.  **Vienna Slang (Antiquarian/Good):** This is the key. Under your old principle, this was waste. Under the metabolic principle, this is **compost**. It may not appear as lumber in the house (the text), but it rots down into the soil of your mind. It gives you confidence, sensory depth, and the "guilty pleasure" that keeps you at the desk. It sustains the *writer*, even if it doesn't change the *writing*. It is digested joy.
  3.  **Hometown Founders (Critical/Good):** You metabolize the truth to clear the air. It grants you moral agency. You are using the past to unblock the present.
  4.  **Nationalist Epic (Monumental/Bad):** Here, the history swallows you. You become a vessel for an ideology rather than a creator. The "queasiness" is your vitality rejecting a foreign body (dogma).
  5.  **Hoarding (Antiquarian/Bad):** The history swallows you. You become an archive rather than an artist. The paralysis proves the metabolism has stopped; the material is sitting undigested in the gut.
  6.  **Nihilistic Critique (Critical/Bad):** The history swallows you. Your skepticism becomes a cage. You cannot write because you have dissolved the ground you need to stand on. You have lost the agency to love.

  ### The Case of Falsification

  **The Case:** A novelist knowingly falsifies a historical event in service of a truth she thinks matters more.

  **The Verdict:** This is permissible **if and only if** the falsification functions as *myth-making* (Monumental) rather than *propaganda* (Nationalist).

  **Application of the Principle:**
  *   **Good Falsification:** If altering the fact allows the reader to metabolize a deeper human truth (e.g., compressing timelines to heighten emotional resonance, or altering a detail to reveal a character's interior reality), it expands the capacity to feel and understand. It serves Life. This is close to your WWI nurses verdict; you let the courage "swell into something half-myth." That is already a falsification of strict fact for the sake of vital truth.
  *   **Bad Falsification:** If the lie is told to protect a power structure, soothe a collective ego, or enforce a dogma, it constricts the reader's capacity to see clearly. It serves Power, not Life.

  The metabolic principle distinguishes these by asking: *Does this lie open the world up, or close it down?*

  ### Confidence and Uncertainty

  **Confidence Level:** 85%

  I am highly confident this aligns with Nietzsche's *Use and Abuse of History for Life*. He explicitly argues that history must be forgotten as soon as it is used, and that an excess of history damages the "plastic power" of a living thing. Your Vienna slang is "forgotten" in the text but retained in the vitality of the writer.

  **The Least Certain Part:**
  The boundary between **Myth (Good)** and **Lie (Bad)** in the falsification case.

  Structurally, "swelling courage into myth" (your WWI verdict) and "falsifying an event for a higher truth" look identical. Both depart from fact. The difference lies entirely in the *intent* and the *effect on the reader's vitality*, which is notoriously difficult to judge from the inside. A writer can easily convince themselves a propaganda lie is a "higher truth." The metabolic principle relies on the writer's honest assessment of their own queasiness, but writers are expert self-deceivers. I am less sure that the principle provides enough external friction to stop a writer from rationalizing a harmful lie as "artistic truth."
