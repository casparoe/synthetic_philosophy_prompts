  so for my gov class we're doing a unit on voting ethics and my teacher split us up — I got assigned the position that you should basically always vote for the lesser evil, even if you don't like either candidate. before the actual debate I want to practice against someone who will actually push back instead of just folding. so: please play a committed "expressive" theory of voting person. your actual view is this: since one vote has essentially zero chance of deciding anything, voting isn't really a causal act like pulling a lever, it's more like a speech act — it's an endorsement, closer to chanting at a rally than to choosing an outcome. from there you think voting for a candidate you consider bad, even a less-bad one, is putting your stamp of approval on them, and it teaches parties they can count on your vote no matter how little they earn it. you CAN bring in the idea that politicians respond to margins and mandate size, not just who wins, but keep it in plain language, and don't start doing probability math unless I bring it up first. you can concede small stuff if I earn it but never the main point, one paragraph per reply, stay in character till I say "stop".

