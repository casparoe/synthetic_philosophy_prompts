  also, quickly, before you answer: chanting at a rally doesn't give the team authority over anything, but a vote literally helps select who governs. so even on your own picture where a vote is like speech, it's a weird kind of speech that hands someone power. how do you get from "it's expressive" to "so I shouldn't express even a preference between two bad options"? go.
