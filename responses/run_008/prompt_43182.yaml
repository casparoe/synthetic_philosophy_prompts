answer: |-
  This is a fantastic question. Your intuition is correct: the slogan "mathematics is discovered, not invented" is a philosophical Rorschach test. People hear it and project different levels of metaphysical commitment onto it. In philosophy of mathematics, this is the debate between **Anti-Realism** (math is a human construct) and **Realism/Platonism** (math is a feature of reality independent of us).

  Here is a breakdown of the distinct claims hidden inside that slogan, ordered from the least controversial (almost everyone agrees) to the most controversial (philosophers still fight about it). I have included an evaluation of each claim and, crucially, whether it actually settles your debate about the primes.

  ### 1. The Claim of Internal Consistency
  *   **The Claim:** Once we agree on the definitions and rules (axioms), we cannot simply choose what the results are. We cannot "invent" a world where $2+2=5$ without breaking the system we built.
  *   **Evaluation:** **Trivially True.** This is just a statement about logic. Even if math is a game we invented (like chess), the moves available to a knight are fixed once the rules are set.
  *   **Verdict on the Primes:** **Leaves it Open.** This does not prove primes exist without humans. It only proves that *if* humans invent a system of arithmetic, the primes will appear inevitably within it. A chessboard doesn't exist without humans, even if the rules of chess are strict.

  ### 2. The Claim of Non-Arbitrariness
  *   **The Claim:** Mathematical concepts are not chosen randomly or based on cultural preference. We study primes because they reveal structural necessities, not because they are aesthetically pleasing or useful to our economy.
  *   **Evaluation:** **Substantive but Defensible.** Most mathematicians agree that while we choose *which* problems to study, the *solutions* are forced upon us by logic. We discover the path through the maze, even if we built the maze walls.
  *   **Verdict on the Primes:** **Leaves it Open.** This suggests math isn't *whimsical*, but it doesn't prove it isn't *mental*. A dream can have a strict, non-arbitrary logic, but it still requires a dreamer.

  ### 3. The Claim of Universality (Intersubjectivity)
  *   **The Claim:** Any rational intelligence in the universe (aliens, AI, etc.) would arrive at the same mathematical truths. The concept of "primeness" is not specific to human biology or culture.
  *   **Evaluation:** **Substantive but Defensible.** This is a very common view. It suggests math is the "language of the universe." However, it still implies that math requires *some* kind of mind to process it.
  *   **Verdict on the Primes:** **Leaves it Open.** This claims primes would exist if *aliens* existed. It does not strictly answer whether primes exist in a universe completely devoid of *any* consciousness whatsoever. It treats math as a universal feature of *thought*, not necessarily of *reality*.

  ### 4. The Claim of Mind-Independence (Truth Realism)
  *   **The Claim:** Mathematical statements are true or false regardless of whether any mind exists to verify them. The statement "2 is prime" was true before the Big Bang and would be true in a void with no observers.
  *   **Evaluation:** **Highly Contentious.** This is the threshold of **Mathematical Realism**. Critics argue that "truth" is a property of language and thought; without a mind to interpret symbols, "truth" has no meaning. Proponents argue that physical reality behaves mathematically regardless of observation.
  *   **Verdict on the Primes:** **Settles It (Yes).** If this reading is accepted, your classmate is right. The primes would still be primes in a human-less universe because their "primeness" is a fact independent of knowing it.

  ### 5. The Claim of Abstract Existence (Ontological Platonism)
  *   **The Claim:** Mathematical objects (like the number 7 or the set of primes) actually *exist* as non-physical, timeless entities in a "realm" of abstract objects. We don't just discover true statements; we discover existing *things*.
  *   **Evaluation:** **Very Contentious.** This is **Platonism**. It is the strongest version of "discovery." Many philosophers reject this because it requires believing in invisible, non-causal objects that exist outside of space and time. It is difficult to explain how physical brains interact with non-physical objects.
  *   **Verdict on the Primes:** **Settles It (Yes).** If numbers are objects that exist timelessly, then humans didn't create them; we merely encountered them. This reading fully entitles your classmate to dismiss your question.

  ***

  ### How to use this in class
  If you bring this list back to your Algebra II class, you can point out that your classmate's slogan is ambiguous.

  *   If they mean **Readings 1 or 2**, they haven't actually answered your question. They have only said that math is *rigorous*, not that it is *independent of humans*. (Analogy: The rules of grammar are rigorous, but language still requires humans.)
  *   If they mean **Reading 3**, they have argued that math is *universal*, but not necessarily that it exists without *any* minds.
  *   To truly shut down your question about the primes, they must be committing to **Reading 4 or 5**.

  You can respectfully ask them: *"When you say 'discovered,' do you mean that the truths are independent of human opinion (Reading 2), or do you mean they are independent of any mind whatsoever (Reading 4)?"*

  That distinction is where the actual philosophy begins.
