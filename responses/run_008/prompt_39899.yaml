      *(Self-Correction during drafting)*: Make sure to distinguish between Friedman's specific claim (predictions only matter) and the Map Analogy (abstraction matters). The map analogy supports abstraction, but Friedman uses it to defend *unrealistic assumptions*. A map doesn't assume the earth is flat; it projects it. A model assumes agents *are* rational. That's a key difference. A map projection is a known transformation. An economic assumption is often treated as a "truth" for the sake of the model, but Friedman says it doesn't matter if it's true.
