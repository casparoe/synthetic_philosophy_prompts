  I'm in a bioethics reading group and we keep coming back to the argument from marginal cases — the one that goes: if humans matter because of rationality or autonomy or language, then some humans (infants, people with profound cognitive disabilities) lack those capacities, yet we think they matter fully anyway; so either we bite the bullet and downgrade them, or we admit that animals deserve comparable consideration, and since basically nobody takes the first horn, species membership apparently can't be doing any real justificatory work on its own. My friend is pretty much sold on this — her credence that the argument establishes that species membership can never, even in principle, ground a morally relevant difference is around 0.85. I'm sitting at maybe 0.4, and what I'd like from you isn't a verdict or a literature review but your actual credence with the reasoning decomposed into the sub-questions it hangs on. A few that seem to belong, though add your own if you see others: (1) that a species-typical capacities view — moral status tracks what's normal or characteristic for your kind rather than what you as an individual actually possess — can be made non-arbitrary instead of being an obvious rationalization of the status quo; (2) that relational or contract-style views can manage to include every human while excluding animals, without the cutoff looking gerrymandered; (3) that it's even legitimate to refuse the demand for a criterion in the first place — I remember someone in the group mentioning that Cora Diamond wrote something in the late 70s arguing that the marginal cases argument only feels like a "problem" if you've already accepted a certain picture of ethics as applying general principles to cases, and if that anti-criterial kind of move is coherent it seems to change the arithmetic a lot.

  One more wrinkle: someone else in the group brought up the disability-rights worry that the whole setup is kind of poisonous from the start — the argument gets its force from comparing cognitively disabled humans to animals and treating that comparison as obviously harmless, which some disability scholars very much do not think it is. So maybe also price in (4): whether that meta-worry actually damages the argument philosophically, or just makes it rhetorically costly to deploy.

  So: give me a rough probability for each sub-question with a line of justification, say how they combine into your overall number, and flag which one the final credence is most sensitive to. Also, given her at 0.85 and me at 0.4, where would you guess our disagreement most likely lives — one specific sub-question, or the whole framework the question gets posed in? And tell me what argument or consideration would move your number the most.
