answer: |-
  ### 1. Candidate Principles and Eliminations

  Your friend's track record allows us to sort philosophical theories of well-being into those that are dead and those that remain live candidates.

  **Eliminated Principles:**
  1.  **Mental State Hedonism:** The view that only internal experiences (pleasure/pain) determine well-being.
      *   *Eliminated by:* The Experience Machine verdict. If only feelings mattered, the plugged-in life would be equal or better. Her refusal confirms that feelings alone are insufficient.
  2.  **Subjective Desire Satisfaction (Internalist):** The view that well-being consists in getting what you want, *provided you know you got it*.
      *   *Eliminated by:* The Researcher and Marriage cases. In both, the subject never learns the truth, yet your friend judges the life where the desire is *factually* met (impact/love) as better. Awareness is not required for the value to accrue.

  **Live Principles:**
  Two distinct principles survive the initial three verdicts and the summary remark ("something true of the life"):
  1.  **Externalist Desire Fulfillment:** Well-being consists in the satisfaction of desires in the real world, regardless of the agent's awareness. Value is conferred by the agent's wants, but the *fulfillment* must be factual.
  2.  **Objective List Theory (Reality-Weighted):** Well-being consists in attaining specific objective goods (e.g., Truth, Real Achievement, Authentic Love, Contact with Reality), regardless of the agent's desires or awareness. Value is inherent in the states of affairs themselves.

  ### 2. Predictions of Surviving Principles

  Here is how the two live principles diverge on your new cases:

  **Case 1: The Voluntary Hedonist**
  *   *Scenario:* A person who desires *only* pleasant experience enters the Experience Machine willingly and knowingly.
  *   **Externalist Desire Fulfillment:** Predicts this life goes **well**. Her sole desire is for pleasant experience; that desire is factually satisfied in the machine. The lack of "reality" is irrelevant because she has no desire for reality.
  *   **Objective List Theory:** Predicts this life goes **worse** (or is deficient). Even though she desires only experience, she lacks the objective goods of Real Existence, Actual Achievement, or Authentic Contact. Her desire cannot conjure value where the objective list finds none.

  **Case 2: The Fraudulent Scientist**
  *   *Scenario:* A scientist believes she is a fraud and a failure. In World A, she is actually a hero who saved millions. In World B, she is actually a fraud. Inner life is identical (misery/belief of failure).
  *   **Externalist Desire Fulfillment:** Predicts World A goes **better**. She presumably desired to be a legitimate scientist who helped people. In World A, that desire is factually fulfilled (she *is* legitimate and *did* help), even if she doesn't know it. In World B, it is not.
  *   **Objective List Theory:** Predicts World A goes **better**. Actual Beneficence and Real Achievement are objective goods. Their presence in World A adds value to the life that is absent in World B, independent of her belief.

  *(Note: Both live principles agree on Case 2, but diverge sharply on Case 1.)*

  ### 3. Commitment and Definite Predictions

  Your friend is most plausibly running the **Objective List Theory (Reality-Weighted)**.

  **Reason for Preference:**
  While Externalist Desire Fulfillment fits the initial three cases, it struggles to accommodate her summary remark: *"What matters has to be something true of the life, not just something the life feels like from the inside."*
  If she were a Desire Theorist, her summary would naturally have been, "What matters is getting what you care about." Instead, she located value in the *truth of the life itself*. This phrasing ontologizes value—it makes value a property of the world and the life's relation to it, rather than a projection of the agent's psychology. Furthermore, in the Marriage case, the horror of the "despising partner" scenario isn't just that a desire for love was unmet; it's that the relationship *itself* was a sham. This suggests she values the *nature of the relation* (Objective Good) more than the *satisfaction of the wish* (Desire Fulfillment).

  **Definite Predictions:**
  1.  **The Voluntary Hedonist:** She will judge this life as **going worse** than a comparable real life (or simply as a "wasted" life). Despite the subject's consent and desire, the absence of real contact and actual achievement renders the life objectively deficient. The machine life lacks the "truth" she insisted matters.
  2.  **The Fraudulent Scientist:** She will judge the "Actual Hero" life as **going better** than the "Actual Fraud" life. The objective good of having actually saved millions attaches to the life even in the absence of subjective recognition or desire-fulfillment awareness. The truth of her contribution makes the life better, period.

  ### 4. The Discriminator Case

  To definitively distinguish between the two live principles (Externalist Desire Fulfillment vs. Objective List), you should present the following case:

  **The Case of the Trivial Pursuit:**
  > "Imagine a person who, after deep reflection, sincerely desires nothing from life other than to count every blade of grass in a specific field. He has no desire for truth, love, or achievement. He succeeds completely: he counts every blade, accurately, and dies content knowing he finished. In a counterpart life, he is prevented from counting the grass but instead cures a disease (an objective good), though he never knows he did it and remains frustrated that he didn't count the grass."

  *   **Externalist Desire Fulfillment** must say the **Grass Counter's life goes better** (desires met vs. desires frustrated).
  *   **Objective List Theory** must say the **Disease Curer's life goes better** (objective good achieved vs. trivial activity), regardless of desire.

  Her verdict here will settle whether she values *desire-satisfaction* or *objective value* as the ultimate currency of a life well-lived.
