  1. When Humphrey says he might have won, is he claiming that *he himself* exists in a scenario where he wins, or that a distinct but similar individual wins there? If you say distinct individual, you are routed toward Lewisian counterpart theory or an actualist counterpart theory that keeps the counterpart relation while denying Lewis's concrete possible worlds; if you say himself, you are routed toward Plantinga-style haecceitism on which transworld identity is grounded in non-qualitative thisnesses, Kripkean deflationism on which worlds are stipulated rather than peered into, and whatever you judge the best "none of the above" leaf for someone who holds that de re modal claims require no cross-world apparatus at all.

  2. In the scenario where a distinct but similar individual wins, is that scenario a concrete universe just as real as our own, or merely an abstract representation? If you say concrete universe, you land on Lewisian counterpart theory; if you say abstract representation, you land on an actualist counterpart theory that keeps the counterpart relation while denying Lewis's concrete possible worlds.

  3. In the scenario where Humphrey himself wins, is this identity secured by a non-qualitative thisness inherent to him, or by our stipulations in describing worlds? If you say non-qualitative thisness, you land on Plantinga-style haecceitism on which transworld identity is grounded in non-qualitative thisnesses; if you say stipulations, you land on Kripkean deflationism on which worlds are stipulated rather than peered into.

  4. Regardless of your previous answers, does the truth of your claim require any entity at any other world in the first place, or is the modal fact primitive? If you say any entity, you remain on the previous paths; if you say the modal fact is primitive, you land on whatever you judge the best "none of the above" leaf for someone who holds that de re modal claims require no cross-world apparatus at all.

  5. When you stipulate a world where Humphrey wins without invoking entities, is this stipulation doing ontological work or merely linguistic work? If you say merely linguistic work, note that Kripkean deflationism on which worlds are stipulated rather than peered into and whatever you judge the best "none of the above" leaf for someone who holds that de re modal claims require no cross-world apparatus at all cannot honestly be separated by these questions; if you say ontological work, proceed to your leaf, unless you affirmed both stipulation and primitive facts, in which case this pattern of answers would force me to redraw the tree.
