      *   *Reading 3: Structural Determinism vs. Agency.* The movie argues against determinism. It says the Depression/Potter weren't inevitable; George's specific choices mitigated them.
      *   *Reading 4: The Emotional Truth.* It's not actually making a historical claim but a psychological one. The "history" is a metaphor for self-worth.

  3.  **Drafting Section 1: "The movie's hidden thesis"**
      *   *Goal:* Define the historical claim philosophically.
      *   *Idea:* It's not just "small people matter." It's about *contingency*.
      *   *Drafting:* The film posits a radical theory of historical contingency centered on the "ordinary agent." Unlike Hegelian views where history moves via inevitable spiritual progress, or Marxist views where economic forces dictate outcomes, *It's a Wonderful Life* argues that macro-history is fragile and dependent on micro-interactions. The thesis is: "Historical outcomes are not determined by structural forces alone but are critically contingent upon the moral agency of non-elite individuals." George Bailey isn't just a nice guy; he is a causal linchpin. Without his specific interventions, the structural force of capitalism (Potter) consumes the community entirely. The movie claims that history is not a river flowing inevitably to the sea, but a web where cutting one seemingly small thread unravels the whole tapestry. It elevates the local banker to the status of a historical prime mover.

  4.  **Drafting Section 2: "The debate it walked into"**
      *   *Goal:* Great Man Theory vs. Structuralism + Counterfactual rules.
