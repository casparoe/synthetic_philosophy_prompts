      *   *Counterfactual Rule:* Historians use the "minimal rewrite rule" for counterfactuals. You change one variable (e.g., Lincoln doesn't go to the theater) and keep everything else as close to reality as possible to test causality. *It's a Wonderful Life* violates this. It doesn't just remove George's actions; it removes his *existence* from conception. This allows the film to alter everything: his brother Harry doesn't survive the ice incident, his wife Mary becomes a spinster, the Building & Loan never exists. It creates a butterfly effect that is too chaotic to prove specific causality. It conflates "George didn't exist" with "all good things didn't exist," assuming no one else could have filled the niche. It's a maximalist rewrite, not a historical test.

