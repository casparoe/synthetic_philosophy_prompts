          *   *Analysis:* Technically, Beauty learns "I am awake now." On Sunday, she knew "I will be awake." But she didn't know "I am awake *now* (as opposed to being asleep or it being Tuesday in the Heads world)."
          *   *Key Distinction:* Is "I am awake now" a tautology for a conscious being? No, because she could be in a state of non-existence (or deep sleep without interview) in some branches. However, in the standard setup, she *knows* she will wake up.
          *   *Refinement:* The real shift isn't "new evidence" in the propositional sense, but a shift in the *reference class* for probability. Elga argues she learns "It is not (Tuesday and Heads)." This is new information (rules out a centered world).
          *   *Verdict:* Ayesha is closer. She rules out the (Tuesday, Heads) centered world. Ben is too strict on "propositional" evidence vs. "centered" evidence.

      *   **(c) Betting:**
          *   Which structure is proper?
