          *   *Standard View:* Credence guides action. If the action is repeated per awakening, the credence should match the frequency of success per action.
          *   *Halfer Exploitability:* It shows that $P(H)=1/2$ is not the correct *decision-theoretic* probability for per-awakening bets. It doesn't necessarily prove the *epistemic* probability is 1/3, but it shows the Halfer needs a complex decision theory (SSA vs. SIA, or "betting quotient" vs. "belief").
          *   *Verdict:* The per-interview structure is the more natural test for "credence *on waking*." The exploitability shows Halfers must decouple belief from betting odds in this specific context.

      *   **(d) Mirror Protocol:**
