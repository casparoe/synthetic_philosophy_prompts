          *   Folding $\rightarrow$ Stopping.
          *   Cost to Call $\rightarrow$ Incremental bid.
      *   **The Breakdown (The "Second-Bidder Penalty"):** This is the smoking gun. In Poker, folding = lose nothing more. In Dollar Auction, folding = pay the last bid. This changes the payoff matrix.
      *   **Evaluating the Conclusion:**
          *   BIL is right: *Ex ante*, don't play.
          *   BIL is wrong: *Ex post* (mid-game), the math changes because of the penalty. It's not just "chips in the pot." It's "liability on the balance sheet."
          *   The User is right: Past bids are weapons.
      *   **Better Comparison:** War of Attrition.
      *   **Real Life Application:** Wars, lawsuits. It's not just "don't throw good money after bad." It's "the cost of quitting is explicitly higher than the cost of fighting, temporarily."

  9.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Wait, let's look closer at the Sunk Cost aspect.*
      *   Scenario: I bid 90c. You bid $1.00.
