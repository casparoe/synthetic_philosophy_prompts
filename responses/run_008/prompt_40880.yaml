      *   Comparing -$0.90 (fold) vs -$0.05 (win immediately). Rational to bid.
      *   BIL says: "The 90c is gone. Ignore it."
      *   If I ignore the 90c: My choice is Pay $1.05 to get $1 (Net -$0.05) OR Pay $0 (Fold).
      *   *Wait.* If I fold, do I pay $0 *more*? Yes. But the rule says I pay the bid *I made*.
      *   So, if I fold, I pay 90c. If I win, I pay $1.05.
      *   The 90c *is* a sunk cost in the sense that I've committed to it. But the rule makes it a *realized loss* upon folding.
      *   Actually, the 90c is a sunk cost *only if* the rule didn't exist. The rule makes it a **contingent liability**.
      *   BIL's error: He treats the bid as a chip pushed into a pot (gone regardless of outcome). In Dollar Auction, the bid is only paid *if* you lose (second place) OR if you win (first place).
      *   Actually, both pay. Winner pays bid, Loser pays bid.
      *   So, if I bid 90c, that 90c is *not* in the pot yet. It is pledged.
      *   If I fold, I pay 90c. If I continue, I pledge $1.05.
      *   BIL's Poker analogy assumes the bet is *paid* when made. In Dollar Auction, the payment is contingent on the auction ending.
      *   *Correction:* Usually, in descriptions, bids are commitments. "I bid 90c." If I drop out, I pay 90c.
      *   So, is the 90c sunk? Yes, in the sense that I cannot get it back. But it is not *paid* until the end.
      *   The critical difference: In Poker, if I fold, I forfeit my *chance* at the pot, but I don't pay an *extra* penalty. In Dollar Auction, the "fold" action triggers the penalty payment.
      *   Actually, the penalty *is* the bid.
      *   Let's stick to the Game Theory term: **War of Attrition**.
      *   BIL's advice ("Walk away early") is the only winning strategy. But his *reasoning* (Poker/Sunk Costs) misses the strategic interdependence the User noticed.
      *   User's intuition is sharper: "My past bid is aimed at my opponent." This is the concept of **commitment**. By bidding, I signal I am willing to lose money to make you lose more.

  10. **Final Plan:**
      *   Validate User's intuition (it's not just sunk costs).
      *   Validate BIL's advice (don't play), but critique his reasoning.
