      *(Self-Correction during drafting)*: Be careful not to say BIL is completely wrong. His advice is rational *ex-ante*. The paradox is why rational people act irrationally *ex-post*. The Dollar Auction demonstrates that *local* rationality (minimizing loss at step N) leads to *global* irrationality (losing $5 for a $1 bill). Poker doesn't usually have this local rationality trap to the same degree because you can fold for $0 additional cost.

      *Wait, one more nuance:* In Poker, if I call a bluff and lose, I lose the call amount. If I fold, I lose the pot odds.
      In Dollar Auction: If I bid $1.05 and win, I lose 5c. If I fold, I lose 90c.
