      Dear [Colleague's Name],

      I am writing to inform you of the editorial board's decision regarding your draft report on political authority in China and Singapore. After a lengthy deliberation that reflected the complexity of your argument, we have voted to offer you publication contingent upon specific revisions. This was not a unanimous decision, and the depth of the disagreement among us suggests that your draft has touched upon a nerve central to contemporary political science and philosophy. While some members favored publishing the text as it stands, arguing that its empirical observations on stability and prosperity warrant immediate dissemination, and others urged outright rejection on the grounds that the framework risks laundering authoritarian apologetics in neutral vocabulary, the majority view settled on a middle path. We believe the core insight deserves scrutiny, but only if the conceptual architecture is strengthened to withstand the rigorous objections raised during our review.

      The primary condition for publication rests on the critique offered by the philosophers on our board, whose concerns we find most actionable for improving the manuscript. They argue that your current draft runs together three distinct questions that must be disentangled to maintain analytical precision. First, you must clearly separate the sociological question of whether citizens in fact comply and approve because of delivered results from the normative question of whether those results generate pro tanto reasons to comply. Second, you need to address whether such reasons are of the same kind as those generated by fair elections, rather than assuming a comparability that remains contested. Your draft currently treats performance legitimacy as a genuine form of legitimacy comparable in kind to democratic legitimacy, but the revision must explicitly delineate where you are describing a claim made by regimes, where you are assessing the validity of that claim, and where you are comparing it to democratic standards. We ask that you restructure the relevant sections to treat these as separate layers of analysis rather than a unified thesis, thereby allowing the reader to see exactly where the empirical data ends and the normative argument begins.

      In reaching this decision to require revisions rather than reject the paper, we weighed heavily the strongest argument presented by the member who advocated for rejection on conceptual grounds. This colleague contended that performance legitimacy is a category error outright, arguing that legitimacy, as the term functions in political philosophy, presupposes a standard for how political authority is entitled to be constituted in the first place, and that performance, however impressive, cannot itself supply that standard. We acknowledge that this is a formidable objection rooted in a deontological tradition that views authority as deriving from right procedure rather than good outcomes. There is significant merit to the claim that conflating effectiveness with legitimacy obscures the moral distinction between a government that serves its people well and one that is entitled to rule them. However, the board ultimately concluded that outright rejection would foreclose a necessary debate within foreign policy circles about how non-democratic regimes sustain themselves and how we should conceptualize that stability. By forcing the conceptual distinctions outlined above, we believe we can accommodate the insight that performance matters to political stability without conceding the philosophical point that performance alone constitutes moral authority. This approach allows us to publish your work while ensuring it does not inadvertently validate the category error you were accused of committing.

      We understand that these revisions require significant reworking of your theoretical framework, but we believe they will ultimately fortify the report against the charge of apologetics and elevate its contribution to the field. We want the final piece to be robust enough to survive the inevitable criticism it will attract, and clarifying these distinctions is the best way to achieve that. Please let us know if you are willing to undertake these revisions within the next six weeks. We value your contribution to the institute and look forward to working with you to bring this important discussion to print in a form that meets our shared standards of intellectual rigor.

      Sincerely,

      [My Name]

