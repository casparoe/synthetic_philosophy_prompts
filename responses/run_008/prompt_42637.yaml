answer: |-
  Here is a specification list for an adequate Evolutionary Debunking Argument (EDA), refined to cut through the noise you are encountering in your seminar. I have organized these into four functional categories: Explanatory, Epistemic, Scope, and Coherence. Following the list, I address the tension between non-negotiables and camp preferences, including the "global scope vs. self-defeat" problem you flagged. Finally, I apply the spec to Street and the Companions in Guilt replies.

  ### The Specification List

  **1. The Explanatory Premise**
  *   **Requirement:** The argument must provide a credible genealogical account of how evolutionary pressures shaped the content of our moral beliefs.
  *   **Motivating Failure Mode:** This guards against "just-so stories." If the evolutionary link is speculative or weak, the argument lacks empirical traction. It prevents the debunker from asserting evolutionary influence without demonstrating the specific selective pressures (e.g., kin altruism, reciprocity) that generated the specific beliefs in question.

  **2. The Independence Condition**
  *   **Requirement:** The genealogical account must be explanatory independent of the truth of the moral beliefs. That is, the story of why we believe *X* should not rely on the premise that *X* is true.
  *   **Motivating Failure Mode:** This guards against "tracking accounts." If the realist can argue that evolution selected us for moral truth (because true moral beliefs confer survival advantages), the debunking fails. The debunker must show that the causal chain runs from fitness to belief, bypassing moral truth entirely.

  **3. The Epistemic Principle (The "Screening-Off")**
  *   **Requirement:** The argument must articulate a principle explaining why a belief caused by a truth-independent process is unjustified. Typically, this involves showing that the evolutionary explanation "screens off" the need to posit moral facts to explain our beliefs.
  *   **Motivating Failure Mode:** This guards against the Genetic Fallacy. Merely showing a belief has a causal origin does not automatically undermine it (e.g., my belief that there is a tree has a causal origin in my visual system). The debunker must explain why *this specific* causal history defeats justification, usually by arguing that the correlation between belief and truth would be accidental.

  **4. The Scope Commitment (Global vs. Local)**
  *   **Requirement:** The argument must explicitly state whether it targets all normative judgments (Global) or only specific subsets (Local). If Local, it must provide a principled criterion for why some beliefs are vulnerable to the EDA while others are immune.
  *   **Motivating Failure Mode:** This guards against arbitrariness. Without this, the debunker risks cherry-picking which moral beliefs to debunk. If they claim only "objective" moral beliefs are debunked but "subjective" ones remain, they owe an explanation of why evolution targets the former but not the latter.

  **5. The Coherence Condition (Avoiding Self-Defeat)**
  *   **Requirement:** The argument must not rely on normative or epistemic premises that the argument itself undermines. The debunker must be able to claim we *ought* to accept the conclusion without simultaneously debunking the authority of that "ought."
  *   **Motivating Failure Mode:** This guards against pragmatic or epistemic self-defeat (sawing off the branch). If the EDA concludes that no normative beliefs are justified, but the argument itself relies on epistemic norms (e.g., "one ought to proportion belief to evidence"), the argument destroys the very grounds for accepting it.

  ***

  ### Analysis: Non-Negotiables, Preferences, and Tensions

  **Non-Negotiables vs. Camp Preferences**
  Your friend in philosophy of biology is partially right. There is a tendency in the literature to smuggle in a verificationist epistemology, specifically within **Requirement 3 (The Epistemic Principle)**. It is non-negotiable that the debunker explains *why* the causal history matters. However, it is a preference (often of the error theorist) to demand that the principle requires *direct* access to truth-makers. A more moderate realist can accept the EDA's force without accepting verificationism by arguing for a "third-factor" explanation (e.g., survival is good, and evolution selected for survival, so there is a correlation between evolution and moral truth).

  Therefore, the non-negotiable core is the **Independence Condition** and the **Coherence Condition**. If you cannot show the explanation is independent of truth, you haven't debunked anything. If you cannot state the argument without self-contradiction, you haven't argued anything. The specific mechanism of evolution (Requirement 1) and the choice between Global/Local (Requirement 4) are strategic preferences that determine the *flavor* of the debunking, not its structural validity.

  **The Tension: Global Scope vs. Coherence**
  Your hunch is correct: there is a severe tension between **Requirement 4 (Global Scope)** and **Requirement 5 (Coherence)**. This is the "Normative Self-Defeat" problem.
  *   If the EDA is **Global**, it claims all normative judgments are unjustified.
  *   However, the EDA is itself a normative argument; it claims we *ought* to revise our beliefs based on the evidence.
  *   If the conclusion is true, the normative force of the argument is debunked along with moral realism.

  To resolve this, Global debunkers (like Street) usually pivot to Constructivism. They argue that while *realist* normative truths are debunked, *constructivist* normative truths (values we create) survive. This saves Coherence but changes the metaphysical target. If a debunker refuses this pivot and remains a Global Error Theorist, they face the charge that their argument is epistemically self-undermining: they are asking you to believe there is no reason to believe anything. This tension is not strictly unsatisfiable, but it forces the Global debunker into a very narrow metaphysical corner to avoid silence.

  ***

  ### Application to the Literature

  **Sharon Street's "Darwinian Dilemma"**
  Street satisfies the Explanatory and Independence requirements forcefully by arguing that evolutionary pressures shaped our evaluative attitudes regardless of realist truth. She opts for a Global scope but attempts to bypass the Coherence failure by rejecting realism entirely in favor of constructivism, thereby preserving the normative authority needed to make her argument.

  **Companions in Guilt Replies**
  These replies attack the Epistemic Principle requirement, arguing that if the principle is strong enough to debunk morality, it also debunks mathematics and epistemic norms. They force the debunker to choose between inconsistency (saving math but killing morals) or global skepticism (killing everything, including the EDA itself), suggesting the requirements for a local moral debunking are jointly unsatisfiable.
