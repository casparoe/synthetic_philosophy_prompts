prompt: |-
  I'm writing a term paper on evolutionary debunking arguments in metaethics, and one thing I've noticed from the seminar discussions is that people constantly argue past each other because nobody lays out what a debunking argument actually has to accomplish. One side says "evolution didn't select our moral beliefs for truth, so moral realism is in trouble" and the other side fires back "well, evolution didn't select your mathematical beliefs for truth either" and it just circles forever. So before I read another word of this literature, I want the spec. Write out the requirements list: what any adequate evolutionary debunking argument has to deliver. For each requirement, give the motivating case, i.e. the specific failure mode it guards against — I'd expect entries like: it has to spell out the evolutionary explanation of our moral beliefs AND show that this explanation is independent of whether those beliefs are true (otherwise nothing is debunked); it has to establish that we'd have held pretty much the same beliefs whether or not they were true; it has to commit to being global or local, and if local, it owes us a principled story about why some moral beliefs get debunked and others escape; it can't rely on an epistemic principle so strong that it would debunk perception, memory, or math, unless the debunker is explicitly willing to bite that bullet; and it can't saw off the branch it's sitting on, since the debunker is presumably still making claims about what we ought to believe.

  That list above is just my first pass, though — add to it, cut from it, or reframe entries as you see fit, because that judgment is exactly what I want from you. Two things I especially want flagged: which requirements are non-negotiable versus which are really just preferences of one camp of debunkers (a friend of mine in philosophy of biology keeps insisting that half the "requirements" floating around in this literature are just a verificationist epistemology nobody signed up for, and I half believe her), and whether any subset of the requirements is jointly unsatisfiable — my hunch is that "global scope" and "the debunker gets to keep talking" are in tension, but I'm honestly not sure how deep that tension goes, and that's the part I most want to see worked out.

  At the very end, and briefly — like one or two sentences each, keep the weight on the criteria not the scorecard — run Street's Darwinian dilemma paper against your list, and do the same for the "companions in guilt" style replies (the ones that lean on epistemic normativity or mathematics). Don't bother with full citations or a bibliography, just name them casually; I have all the references already. Also, sorry if there are typos in this — I'm writing it late. And please answer in American English: my spelling keeps drifting British from reading UK authors, and my professor is genuinely picky about it.
