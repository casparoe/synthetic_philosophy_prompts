      *   *Point 4 (Thermostat/Chess Distinction):* Both agree LLMs are more complex than thermostats. The disagreement is *how much* more complex (qualitative vs. quantitative).
      *   *Drafting thought:* Ensure language is neutral. Use "belief-like states" or "intentional stance."

  4.  **Drafting Section 2: Table of Disagreements:**
