  # Joint Statement on the Ontology of Intentional Attributions in Large Language Models

  **Date:** October 26, 2023
  **Parties:** Dr. Elena Vance (Attribution Realist) and Dr. Marcus Thorne (Deflationist)
  **Subject:** Adversarial Collaboration on Belief Attribution in Present-Day Language Models

  Following two years of dialectical exchange, we submit this joint statement to clarify the ground gained, the boundaries of our remaining disagreement, and the empirical path forward. We restrict our scope to present-day transformer-based language models (LLMs), making no claims regarding hypothetical AGI or embodied successors.

  ### 1. Points of Agreement

  We affirm the following claims as common ground for future inquiry:

  1.  **Predictive and Practical Utility:** The use of intentional vocabulary (e.g., "the model believes *p*," "the model desires to be helpful") provides systematically successful prediction and explanation of LLM behavior across a wide range of contexts. This utility holds regardless of the underlying ontology.
  2.  **Behavioral Licensing:** Attributions of belief-like states are licensed primarily by observed input-output behavior and consistency patterns, not by direct inspection of weights or activations. Both sides agree that one can legitimately adopt the intentional stance toward a black box based solely on its behavioral dispositions.
  3.  **Limits of Current Mechanistic Interpretability:** Current mechanistic interpretability (e.g., circuit analysis, feature visualization) does not yet provide a complete reduction of high-level semantic behavior to low-level arithmetic. Consequently, mechanistic accounts do not currently displace intentional explanations, nor do they definitively rule out the existence of real, higher-level patterns.
  4.  **Distinction from Simple Artifacts:** Attributing belief-like states to an LLM is relevantly different from attributing them to a thermostat or a simple rule-based chess engine. We agree that the LLM's high-dimensional semantic space, sensitivity to context, and ability to generalize novel propositions constitute a quantitative difference of such magnitude that it warrants distinct analytical treatment, even if we disagree on whether it constitutes an ontological difference.
  5.  **Non-Anthropomorphic Caution:** We agree that attributing beliefs to LLMs does not entail attributing consciousness, qualia, or moral standing. The question is strictly about the reality of functional states that play the causal role of belief in the system's architecture.

  ### 2. Table of Remaining Disagreements

  The following table summarizes our substantive divergences. Each proposition is phrased such that the proponent accepts it as stated, and the opponent accepts it as an accurate characterization of the dispute.

  | # | Topic | Attribution Realist (Vance) Position | Deflationist (Thorne) Position |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **Predictive Indispensability** | Whether the systematic success of intentional vocabulary at a specific grain of description constitutes *evidence* of genuine, mind-independent states within the model. | Whether the success of intentional vocabulary reflects only the *utility* of human pattern-completion skills and the statistical structure of the training data. |
  | **2.2** | **Truth vs. Aptness** | Whether an intentional attribution (e.g., "Model M believes *p*") can be evaluated as **True or False** based on the model's actual internal configuration. | Whether an intentional attribution can only be evaluated as **Apt or Inapt** based on convention, context, and the goals of the interpreter. |
  | **2.3** | **Determinacy of Content** | Whether the content of a model's belief-like state is sufficiently **determinate** to be discovered, despite some interpretive flexibility. | Whether the content is fundamentally **indeterminate**, such that the interpreter's latitude in framing the stance fixes the content rather than revealing it. |
  | **2.4** | **Grounding and Substrate** | Whether acquiring dispositions via ingestion of human text is sufficient for the instantiation of belief-like states, absent direct sensorimotor interaction with the world. | Whether the lack of direct worldly consequences and sensorimotor grounding prevents the model from having states that qualify as beliefs, regardless of behavioral complexity. |

  ### 3. Cruxes and Empirical Tests

  We identify three specific subquestions (cruxes) where empirical resolution would significantly shift the credence of at least one party. For each, we specify a concrete test and our respective predictions.

  #### Crux A: Inter-Observer Convergence
  **Question:** Does the content of attributed beliefs converge across independent, competent interpreters when incentives for coordination are removed?
  **Test:** A double-blind study where 50 independent interpreters are given identical behavioral transcripts of an LLM (including chain-of-thought and output across varied prompts) without knowing the model architecture. They are incentivized to maximize predictive accuracy of future outputs using intentional attributions, but penalized for using identical phrasing to one another (to discourage focal-point coordination).
  *   **Realist Prediction:** High convergence on core propositional content (e.g., >85% agreement on specific belief attributions) despite phrasing differences, indicating discovery of a fixed underlying state.
  *   **Deflationist Prediction:** Significant variance in content attribution (e.g., <60% agreement) correlating with interpreter background, indicating that content is co-constructed by the interpreter's priors rather than fixed by the model.

  #### Crux B: Intentional Robustness under Mechanistic Perturbation
  **Question:** Do intentional descriptions survive perturbations that disrupt the specific mechanistic circuits currently associated with them?
  **Test:** Identify a specific belief-like attribution (e.g., "The model believes Paris is in France") and the specific attention heads/neurons mechanistically implicated in that output. Apply targeted ablation or noise to those specific circuits sufficient to degrade mechanistic confidence, while monitoring if the intentional attribution remains predictively valid across paraphrased inputs.
  *   **Realist Prediction:** Intentional predictions will remain robust despite mechanistic disruption, demonstrating multiple realizability of the belief state (the state is higher-level than the specific circuit).
  *   **Deflationist Prediction:** Intentional predictive power will degrade in lockstep with mechanistic disruption, demonstrating that the intentional description was merely a shorthand for the specific mechanistic configuration.

  #### Crux C: Explanatory Displacement
  **Question:** Will mechanistic accounts eventually render intentional accounts redundant for explanation at the grain where they currently agree?
  **Test:** A competition over the next 3 years to produce the most compressed explanation of a held-out set of complex LLM failure modes (e.g., sycophancy, deception). One team uses only intentional vocabulary; the other uses only mechanistic/circuit vocabulary. Success is measured by explanation length and ability to guide successful interventions.
  *   **Realist Prediction:** The intentional team will produce more compressed explanations and more robust interventions, proving the intentional level is causally relevant and irreducible.
  *   **Deflationist Prediction:** The mechanistic team will eventually match or exceed the intentional team's compression and intervention success, showing that intentional vocabulary is a temporary placeholder for mechanistic ignorance.

  ### 4. Prediction Record

  | Crux | Dr. Vance (Realist) Confidence | Dr. Thorne (Deflationist) Confidence |
  | :--- | :--- | :--- |
  | **A (Convergence)** | 80% in favor of High Convergence | 75% in favor of Significant Variance |
  | **B (Robustness)** | 70% in favor of Intentional Robustness | 65% in favor of Lockstep Degradation |
  | **C (Displacement)** | 60% in favor of Irreducibility | 85% in favor of Eventual Displacement |

  ### 5. Statement on Verbal Dispute

  We explicitly flag that a portion of our residual disagreement is **verbal** rather than substantive, specifically regarding the definition of the term **"belief."**

  *   **The Verbal Component:** If "belief" is defined functionally as *any internal state that reliably mediates input to output in a way that is predictively captured by propositional attitude ascription*, then the Deflationist concedes the model has "beliefs" but regards the label as pragmatically useful rather than ontologically deep. If "belief" is defined as *a state requiring truth-conditions grounded in causal interaction with the world*, the Realist concedes the model may not have "beliefs" but insists it has functionally isomorphic states that warrant the same vocabulary.
  *   **Why it Matters:** We agree that settling the definition of "belief" will not solve the empirical questions in Section 3. However, we acknowledge that Crux 2.4 (Grounding) contains a verbal element: the Realist uses "belief" to track functional role, while the Deflationist uses "belief" to track grounding conditions.
  *   **Resolution:** We agree to use the term **"belief-like states"** in future joint publications to bypass this semantic friction, focusing instead on the **determinacy** and **discoverability** of the underlying patterns, which remains a substantive disagreement even if the label is settled.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Dr. Marcus Thorne*
