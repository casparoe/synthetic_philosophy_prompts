answer: |-
  The principle that unifies all seven of your verdicts is **The Principle of Constructive Care.**

  It states: **Honesty is a moral obligation only when the listener has the capacity to act on the truth to improve their welfare, and the speaker has the relational standing to offer it.**

  Conversely, kindness (or a white lie) is the obligation when the truth is unactionable, or when the speaker lacks the standing to critique. Truth is not an abstract virtue in your framework; it is a tool. You are only permitted to use the tool if it builds something (Constructive) and you are authorized to be the builder (Care/Standing).

  ### How it fits your seven cases

  1.  **Dutch Coworker:** High Standing (collaborator), High Actionability (fix the deck). **Verdict: Truth.** (Fits).
  2.  **Aunt/Sweater:** High Standing (family), Zero Actionability (can't un-knit). Truth hurts, lie bonds. **Verdict: Kindness.** (Fits).
  3.  **Aunt/House:** High Standing (family), High Actionability (major life decision). Truth prevents regret. **Verdict: Truth.** (Fits).
  4.  **Friend/Business:** High Standing (friend), High Actionability (pivot or quit). You lied, which denied them the chance to avoid failure. **Verdict: Not Fine.** (Fits your guilt).
  5.  **Friend/Haircut:** High Standing (friend), Low Actionability (hair is cut, hard to reverse immediately). Truth hurts confidence, lie preserves it. **Verdict: Kindness.** (Fits).
  6.  **Osaka Host:** Low Standing (guest), Zero Actionability (event over). Truth is rude, lie preserves harmony. **Verdict: Kindness.** (Fits).
  7.  **Party Guy:** Zero Standing (stranger), High Actionability (drill vowels). He offered a tool without the license to use it. **Verdict: Not Fine.** (Fits).

  None of your verdicts need to be discarded. They are remarkably consistent.

  ### The Sister Case

  **Verdict: This is the Sweater case.**

  You did the right thing. Ten minutes before an interview, the information "you look nervous" has **zero actionability**. She cannot rewire her physiology in that timeframe; she can only panic. The truth serves your integrity (you didn't lie) but harms her welfare (increased anxiety). Because the capacity to act was removed by the timing, the obligation to tell the truth vanished. You prioritized her performance over your purity, which is exactly what Constructive Care demands.

  ### The Distinguishing Test Case

  You asked for a case that separates **Speaker's Standing** from **Listener's Utility**. Here it is:

  **The Competitor's Typo.**
  You are in a final-round competition for a grant or job against a peer. You are equals, not collaborators. One hour before the deadline, you see a public draft of their proposal with a critical, disqualifying typo.

  *   **Listener Utility:** Massive. Knowing this saves their career opportunity.
  *   **Speaker Standing:** None. You are adversaries. In fact, their failure is your gain.

  **The Test:**
  *   If you believe you **must tell them**, your principle is ultimately about **Listener Utility**. (The welfare of the human outweighs the rules of the game).
  *   If you believe you **should stay silent**, your principle is ultimately about **Speaker Standing**. (You have no right to intervene in their outcome, even to help).

  Most people feel a sharp tug-of-war here. If your gut says "Tell them," you've confirmed that Utility trumps Standing in high-stakes welfare cases (like the Party Guy, but with higher stakes). If your gut says "Stay silent," you've confirmed that Standing is the gatekeeper, and without it, even useful truth is trespassing.

  My prediction? You'll tell them. Which means your underlying principle is actually **Beneficence**: *Maximize the listener's welfare, using truth when it helps and kindness when it doesn't, regardless of standing, unless the cost to yourself is unreasonable.* The Party Guy wasn't "wrong" because he lacked standing; he was wrong because his critique was low-stakes vanity policing, not high-stakes welfare protection.
