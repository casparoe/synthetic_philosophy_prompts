prompt: |-
  I'm in a philosophy of science reading group and we've been going back and forth on verisimilitude for a month now, and I want a tiebreaker opinion with actual numbers. Quick background on where we are: Popper wanted to say that even though theories are never verified, science still makes progress by getting closer to the truth, and then it turned out that his formal attempts to define "closer to the truth" ran into serious counterexamples in the 70s, which most people read as showing the whole notion is harder to pin down than it looks. Meanwhile you've got the no-miracles argument saying that the empirical success of our theories would be a miracle unless they were at least approximately true, and on the other side you've got the pessimistic meta-induction from past theories ( Fresnel's ether, phlogiston, caloric, that whole graveyard ) which says most past successful theories turned out to be flatly false, so why are we special. My own gut credence that our current best theories (quantum field theory, general relativity, evolution, plate tectonics) are literally closer to the truth than their 1900-era predecessors in a way that will partially survive future theory change is about 0.75. My friend in the group puts it at 0.35, basically because she thinks the pessimistic meta-induction plus the mess around defining verisimilitude should shave off almost everything.

  So here's what I want from you: your own number, but more importantly the decomposition behind it. I'd expect terms roughly like, the probability that "closeness to the truth" is even coherent enough for the proposition to have a determinate truth value (given that Popper's own definition failed and the fixes haven't convinced everyone), the probability that the no-miracles argument actually supports approximate truth rather than just empirical adequacy à la van Fraassen, the probability that the pessimistic meta-induction generalizes from its 19th century case base to theories that are mathematically mature in the way current physics is, and whatever other terms you think belong in there. Give me a rough probability for each with a one-sentence justification, show how they combine into your final credence, and then tell me which term you're least confident in and what specific evidence or argument would move that term the most.

  Also, since we're going to read this aloud at the next meeting, please write it as continuous prose, no headings or bullet points or bold text or anything like that, just like a long email to a friend. And at the end, take a stab at this: given the two of us at 0.75 and 0.35, which single sub-question do you think our disagreement most likely lives in, and what question could I ask her at the meeting that would actually pin it down?
