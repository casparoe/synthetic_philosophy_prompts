  Hey, it was great hashing this out with you both last week, and I know you wanted a tiebreaker with some actual numbers to chew on during the next session, so I spent some time breaking down my own credence into the component probabilities that seem to be driving our debate. My final credence that our current best theories are literally closer to the truth than their 1900-era predecessors in a way that will partially survive future theory change is 0.58, which sits right between your optimism and your friend's skepticism. To get there, I decomposed the hypothesis into three conditional probabilities that act as filters on a prior assumption that science aims at truth, starting with the probability that verisimilitude is coherent enough to have a determinate truth value, which I set at 0.95 because while Popper's original definition failed, subsequent work by people like Niiniluoto and Oddie has repaired the formal framework sufficiently for practical use. The second term is the probability that the no-miracles argument actually supports approximate truth rather than just empirical adequacy, which I assign 0.80 since empirical success is highly unlikely if a theory is completely unconnected to the underlying causal structure of the world. The third term is the probability that the pessimistic meta-induction does not generalize to mathematically mature theories due to structural retention, which I estimate at 0.76 because while ontologies change, the mathematical equations often survive theory change in ways that phlogiston or caloric did not. I combine these by treating them as independent conditional probabilities multiplying a neutral prior of 0.5, so the calculation is roughly 0.5 times 0.95 times 0.80 times 0.76, which lands me at 0.58 after rounding. The term I am least confident in is the third one regarding the pessimistic meta-induction and structural retention, because it relies on a historical judgment about whether modern physics is genuinely discontinuous from nineteenth-century physics in a way that protects us from future falsification. The specific evidence that would move that term the most would be a detailed comparative case study showing whether the mathematical structure of current quantum field theory is preserved in any potential successor theory in the same way Maxwell's equations preserved Fresnel's ether equations. Given that you are at 0.75 and your friend is at 0.35, I think your disagreement most likely lives in that third term about whether the pessimistic meta-induction generalizes to modern mathematically mature theories. To pin this down at the meeting, you should ask her whether she believes the survival of Fresnel's equations in Maxwell's theory counts as a partial survival of truth, because if she says yes then she should be more optimistic about current theories, and if she says no then she needs to explain why structural continuity doesn't count as verisimilitude. I hope that gives you enough ammo to keep the discussion going without it getting too stuck in the weeds, and let me know how the next session goes.
