answer: |-
  ### Executive Summary

  You have eight researchers for three years. That is roughly 24 research-years. This is enough to settle one major conceptual bottleneck or map two minor ones, but not enough to solve the whole field. To maximize leverage, you must fund work that, if resolved, renders other questions either answerable or obsolete.

  My recommendation is to invert the standard engineering intuition. Most people assume we know *what* preferences are and ask if we can *compute* their idealization. I argue the reverse: we do not know what a preference is in a formal sense robust enough for alignment, and the idealization procedure likely hides the moral theory it claims to discover.

  Below is the defended ordering, the trade-offs, the scenarios, and the one question you should largely ignore.

  ---

  ### The Missing Crux: The Ontology of Preferences
  **Rank: 1 (Foundational)**

  None of your candidate questions address the representational substrate. The entire program assumes "preferences" are the correct currency for value. But in philosophy and decision theory, "preference" is an umbrella term covering revealed choice, psychological disposition, and normative judgment. These come apart under idealization.

  *   **Why Upstream:** If preferences are merely revealed choices, idealization is impossible (you cannot idealize a history of actions without a model of the agent). If they are psychological dispositions, they may not be coherent enough to idealize. If they are normative judgments, idealization is redundant (they are already about what *should* be). You cannot ask if idealization converges (Q1) until you define what object is supposed to converge.
  *   **Tractability:** High for philosophers. This is conceptual analysis and formal semantics. It requires no ML data, only rigorous definition of the input space.
  *   **Neglectedness:** High. The field treats "preferences" as a primitive. It is neglected because it feels like semantics, but in formal alignment, semantics determines whether the math holds.
  *   **Verdict:** This slots at the very top. If preferences cannot be formally distinguished from behaviors or beliefs in a way that survives idealization, the rest of the portfolio is dead on arrival.

  ### Prioritized Portfolio (Questions 2–5)

  #### 2. Whether the Extrapolation Procedure Smuggles in a Moral Theory
  **Rank: 2**

  *   **Why Upstream:** This is the "Is the map the territory?" question. If the conditions of idealization (e.g., "more informed," "rational") implicitly encode a specific moral framework (e.g., utilitarianism vs. deontology), then "alignment" is just a euphemism for "implementing this specific moral theory." You cannot assess convergence (Q3) or authority (Q4) without knowing if the target is a discovered fact or a constructed norm.
  *   **Tractability:** High. This is pure meta-ethics and decision theory. Philosophers can analyze the logical implications of "full information" or "rationality" constraints without running models.
  *   **Neglectedness:** Medium-High. It is discussed informally, but rarely formalized. It is unfashionable because it threatens the neutrality of the alignment project.
  *   **Verdict:** Essential. If the procedure is not neutral, the portfolio shifts from "alignment" to "moral realism."

  #### 3. Whether the Coherence of Idealized Preferences is a Substantive Bet
  **Rank: 3**

  *   **Why Upstream:** This is the feasibility check. If idealized preferences do not converge to a fixed point (or a stable attractor), the concept of "aligning to them" is category-error. However, this is downstream of Q1 and Q2 because you must know *what* is converging (Ontology) and *what rules* govern the convergence (Smuggling).
  *   **Tractability:** Medium. This requires formal epistemology and logic. It is doable a priori (proving impossibility theorems or convergence conditions), but it risks becoming purely mathematical without empirical grounding on human psychology.
  *   **Neglectedness:** Low. This is the most common worry in the space. It is not neglected, but it is often assumed away.
  *   **Verdict:** Load-bearing, but only if Q1 and Q2 are cleared.

  #### 4. Whose Preferences and How to Aggregate
  **Rank: 4**

  *   **Why Upstream:** This defines the *scope* of the agent. However, it is downstream of convergence. If individual idealization doesn't converge (Q3), aggregating them is impossible. If the idealization procedure smuggles morality (Q2), aggregation might be irrelevant (if the morality dictates the aggregation).
  *   **Tractability:** High. This is social choice theory and political philosophy. Very friendly to a priori work.
  *   **Neglectedness:** Medium. Often kicked down the road as a "governance" problem rather than a technical alignment problem.
  *   **Verdict:** Critical for deployment, but less critical for the *possibility* of alignment.

  #### 5. Normative Authority of Idealized Preferences
  **Rank: 5**

  *   **Why Upstream:** This asks why actual humans should submit to their idealized selves. It is downstream of everything else. If the preferences don't exist (Q1), or the process is biased (Q2), or they don't converge (Q3), authority is moot.
  *   **Tractability:** High. Meta-ethics.
  *   **Neglectedness:** Low. This is a standard topic in ideal advisor literature.
  *   **Verdict:** Important for justification, less important for construction.

  ---

  ### The Overrated Question
  **Question:** *Whether idealization should be a one-time snapshot fixed at deployment or an ongoing process.*

  **Why Drop/De-prioritize:**
  This is the question I would drop from the core portfolio of eight. It is treated as a deep philosophical puzzle, but it is largely a proxy for "How much do we trust the output of the idealization?"
  *   If the idealization is robust (Q3) and neutral (Q2), a snapshot is safe.
  *   If it is unstable or biased, an ongoing process is just a way to delay the failure mode.
  *   **Impact:** Settling this tomorrow wouldn't change the mathematical or conceptual work required for Q1–Q3. It is a policy decision masquerading as a metaphysical one. It consumes oxygen better spent on the Ontology or Smuggling questions.

  ---

  ### Trade-offs: Where to Sacrifice Tractability for Importance

  **Sacrifice Tractability on Q1 (Ontology):**
  Defining the ontology of preferences is notoriously difficult and risks ending in skepticism. However, it is the highest-leverage bet. I would assign 3 of the 8 researchers here. If they fail, you know the program is flawed before you spend millions on ML. This is high risk, high reward.

  **Sacrifice Importance on Q5 (Authority):**
  Do not fund anyone solely on Normative Authority. It is the most tractable question (philosophers have debated this for decades) but the least load-bearing for *building* a safe system. A system can be aligned without resolving the meta-ethical justification for why humans *should* care, provided the system doesn't kill them. Assign 1 researcher max, perhaps combined with Q4.

  **Balance on Q2 & Q3:**
  Assign 4 researchers split between Smuggling (2) and Convergence (2). These are the engine of the program. If the procedure is neutral and the math converges, you have a viable target.

  ---

  ### Scenarios: Moving the Goalposts

  **Scenario A (Moves Q3 Convergence UP):**
  *Development:* Over the next 18 months, empirical ML teams demonstrate that preference learning models exhibit chaotic instability when scaled, even with clean data.
  *Impact:* This suggests the instability is not just a data problem but a structural one. The philosophical question of whether coherence is a "mathematical hope" becomes an emergency. You would shift researchers from Ontology to Convergence to prove impossibility theorems or identify stability conditions.

  **Scenario B (Moves Q2 Smuggling DOWN):**
  *Development:* A consensus emerges in formal ethics that "rationality" and "information" can be defined purely procedurally without normative content (e.g., a breakthrough in purely syntactic decision theory).
  *Impact:* If the procedure can be proven neutral, the worry that it smuggles moral theory dissolves. You would deprioritize Q2 and move resources to Aggregation (Q4), as the technical target is now secure, and the political question of *whose* target becomes the bottleneck.

  ---

  ### Final Recommendation for the Portfolio

  1.  **3 Researchers:** **Preference Ontology.** (The Missing Crux). Task: Formalize "preference" such that it is distinct from behavior and belief, and stable under reflection.
  2.  **2 Researchers:** **Procedural Neutrality.** (Smuggling). Task: Audit idealization conditions for hidden moral commitments.
  3.  **2 Researchers:** **Convergence & Coherence.** Task: Formal models of whether idealized states are fixed points.
  4.  **1 Researcher:** **Aggregation/Authority.** (Combined). Task: Social choice under idealization conditions.
  5.  **0 Researchers:** **Static vs. Dynamic.** (Monitor only).

  This portfolio bets that the failure mode of idealization is conceptual incoherence, not engineering difficulty. It uses your philosophers for what they are uniquely good at: breaking broken concepts before the engineers try to build with them.
