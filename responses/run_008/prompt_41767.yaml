          5.  *Static vs. Dynamic.* (Marked as Overrated/Lower Priority).
      *   **Tractability/Neglectedness Analysis:** For each top item.
      *   **Trade-offs:** Where to spend the 8 researchers.
      *   **Scenarios:**
          *   *Up:* ML shows preference learning is unstable (boosts Convergence).
          *   *Down:* ML shows we can't extract preferences at all (kills the whole program, or boosts Preference Ontology).
      *   **Overrated:** Static vs. Dynamic.
      *   **Missing Crux:** Preference Ontology.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Smuggling Moral Theory" really more upstream than "Convergence"?
      *   *Correction:* Yes. If the idealization procedure *just is* a specific moral theory (e.g., ideal observer = utilitarianism), then asking if it converges is asking if utilitarianism is computationally tractable. But knowing *that* it is utilitarianism is more fundamental than knowing if it converges. You need to know the target before you check if the target is a point or a cloud.
