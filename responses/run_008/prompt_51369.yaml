prompt: |-
  I need some help diagnosing a dispute that's stalled our school board, because at this point we're just going in circles. Context: my kids go to a small bilingual school and I recently got elected to its board (parents can stand, long story). For the last six months we've been deadlocked over a proposed "community charter": things like expecting families to attend a couple of shared festivals a year, a strong norm of volunteering for school events, and formally recognizing the founding families' language in school ceremonies. One faction, call them the liberals, says the school is a service provider: it should coordinate neutrally and let each family decide how much of the "shared life" they want. Making participation a matter of expectation, even soft expectation, is a kind of soft coercion and it's none of the school's business. The other faction says that's a fantasy: a school like ours only works because people actually show up and pass the language and the rituals on, so the shared life isn't an optional extra, it's the precondition, and a charter just makes the implicit explicit. Both sides agree on every fact we've looked at (who attends, what the volunteer numbers are, what similar schools did); nobody has moved an inch.

  While digging into this I realized we're basically re-enacting the big communitarianism vs. liberalism fight from the 80s and 90s, at a tiny scale. I've been reading around it: Sandel's critique of the "unencumbered self", Walzer on how different goods belong to different spheres, MacIntyre on traditions carrying reasons, and the liberal replies, like Kymlicka's point that a liberal culture is itself a culture that has to be reproduced, plus his distinction between a community you can exit and a cultural structure you can't just leave behind without cost. My working hypothesis is that the two factions on our board aren't disagreeing about facts or even about values exactly, but are answering two different questions under one heading — one side is answering a question about legitimacy (what may an institution demand?), the other a question about flourishing (what does this institution need to survive?) — and our deadlock comes from each side treating its question as the only one on the table. But I might be wrong; maybe there's a real value conflict underneath, or maybe it's partly verbal, hinging on what people mean by "community" in the first place. Either way I'd like a diagnosis of the structure of the disagreement, using what each side actually says, rather than a verdict on who's right or a list of books to read.

  Since I'll be pasting this into my notes, please give me the diagnosis in JSON with this schema: an object with fields "disagreement_type" (your classification — verbal, substantive, bedrock intuitions, different-questions-under-one-heading, or a mix, with a one-paragraph justification), "side_a_steelmanned" and "side_b_steelmanned" (the strongest version of each board faction's position, a few sentences each), "hidden_crux" (the single underlying question, if any, that's actually doing the work in our dispute), "hypothesis_assessment" (whether my different-questions hypothesis holds up, and what it gets wrong), "what_would_count_as_progress" (the most concrete thing — a distinction we could adopt, a reframing of the charter proposal, a specific question we should put to the board — that could actually unstick us), and "generalizes" (a short note on whether the same diagnosis applies to the academic debate or whether the school version differs in some way that matters). Put the JSON up front, then add a few paragraphs of prose after it walking me through your reasoning. Thanks — our next board meeting is in three weeks and I'd like to walk in with something better than "we clearly just disagree."
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A parent elected to a small bilingual school board.
      *   **Problem:** Deadlock over a "community charter" (expectations on attendance, volunteering, language recognition).
      *   **Factions:**
          *   "Liberals": School as service provider, neutral, participation should be optional (soft coercion is bad).
          *   "Communitarians": School depends on shared life/rituals, charter makes implicit expectations explicit (precondition for survival).
      *   **Context:** Both sides agree on facts (attendance, volunteers, etc.). User suspects it's a "different questions under one heading" conflict (Legitimacy vs. Flourishing), referencing political philosophy (Sandel, Walzer, MacIntyre vs. Kymlicka, etc.).
      *   **Task:** Diagnose the structure of the disagreement.
      *   **Format:** JSON object first (specific schema), followed by a few paragraphs of prose reasoning.
      *   **Constraints:** No verdict on who is right, no book list, focus on structure using what sides actually say. JSON must be valid.

  2.  **Deconstruct the Disagreement:**
      *   **Side A (Liberals):** Focus on individual autonomy, neutrality, service provision. Fear of coercion. View school as a vendor/client relationship primarily.
      *   **Side B (Communitarians):** Focus on collective survival, cultural transmission, shared identity. View school as a community/ecosystem. Fear of dissolution/loss of mission.
      *   **Facts:** Agreed upon (attendance rates, volunteer numbers, benchmarks).
      *   **User's Hypothesis:** Different questions (Legitimacy vs. Flourishing).
      *   **Goal:** Unstick the board.

  3.  **Evaluate the User's Hypothesis:**
      *   Is it *just* different questions? Legitimacy (what can we demand?) vs. Flourishing (what do we need?).
      *   Likely it's a mix. There is a substantive value conflict about the *nature* of the institution. Is it a service or a community? These aren't just different questions; they are incompatible definitions of the thing itself. However, framing it as different questions is a useful diagnostic tool for resolution.
      *   The "hidden crux" is likely about the *authority* of the institution to shape behavior vs. the *dependency* of the institution on that behavior.
      *   Is it verbal? Partly. "Community" means "optional association" to Side A and "constitutive bond" to Side B.
      *   Is it bedrock? Yes, ultimately about individual liberty vs. collective good.

  4.  **Drafting the JSON Content:**
      *   *disagreement_type:* Needs to be nuanced. "Mix" seems accurate. It's substantive (values) but manifested as talking past each other (questions). Let's call it "different-questions-under-one-heading with substantive bedrock".
      *   *side_a_steelmanned:* Focus on autonomy, inclusivity for diverse lifestyles, avoiding exclusionary pressure.
      *   *side_b_steelmanned:* Focus on sustainability of the bilingual mission, the fact that culture isn't passive, the risk of free-riding.
      *   *hidden_crux:* What is the primary purpose of the school? (Service vs. Polis). Or: Does the institution have moral authority to demand non-academic participation?
      *   *hypothesis_assessment:* Validate the user's insight (it's very sharp) but note that the questions aren't independent; the answer to flourishing often dictates the answer to legitimacy for Side B.
      *   *what_would_count_as_progress:* A distinction between "Conditions of Enrollment" vs. "Aspirational Norms". Or a specific vote on the *nature* of the school before the charter.
      *   *generalizes:* Yes, but scaled down. The stakes are lower (school vs. state), making exit easier, which strengthens Side A's leverage compared to the national political debate.

  5.  **Refining the JSON:**
      *   Ensure valid JSON syntax (quotes, escaping).
      *   Check schema requirements: `disagreement_type`, `side_a_steelmanned`, `side_b_steelmanned`, `hidden_crux`, `hypothesis_assessment`, `what_would_count_as_progress`, `generalizes`.

  6.  **Drafting the Prose:**
      *   Explain the reasoning behind the JSON choices.
      *   Elaborate on why the "Legitimacy vs. Flourishing" split is useful but incomplete.
      *   Discuss the "Service vs. Community" ontology.
      *   Suggest how to use the "Progress" item in the meeting.

  7.  **Review against Constraints:**
      *   JSON up front? Yes.
      *   Specific schema? Yes.
      *   No verdict on who is right? Yes.
      *   No book list? Yes.
      *   Prose after JSON? Yes.

  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is "different-questions-under-one-heading" too generous? If Side B says "We need this to survive" and Side A says "You can't demand this", they are answering different questions, but the answers conflict. The conflict is real. I should emphasize that the *diagnosis* is mixed.
      *   *Critique:* Make sure the "Progress" item is actionable for a board meeting in 3 weeks. A "meta-vote" on the school's definition might be too abstract. Maybe reframing the charter into "Core Requirements" vs. "Community Ideals" is better.
      *   *Critique:* Ensure the JSON strings don't contain unescaped newlines.

  9.  **Final Polish of JSON content:**
      *   `disagreement_type`: "mix (verbal and substantive)"
      *   `side_a_steelmanned`: Focus on respect for pluralism and avoiding undue burden.
      *   `side_b_steelmanned`: Focus on the impossibility of neutral cultural transmission and the risk of mission drift.
      *   `hidden_crux`: "Does the school's authority extend to shaping family behavior outside academic delivery?"
      *   `hypothesis_assessment`: Strong, but misses that Side B sees flourishing as a legitimacy condition.
      *   `what_would_count_as_progress`: Split the charter into "Binding Conditions" and "Shared Aspirations".
      *   `generalizes`: Applies well, but exit costs are lower in school context.

  10. **Final Check:** JSON validity is crucial. I will ensure no line breaks within strings unless escaped.

  *(Self-Correction during drafting JSON)*: I need to make sure the JSON is valid. I will keep strings single-line or use `\n` properly. I will avoid comments inside JSON.

  *(Refining the "disagreement_type")*: The user offered options: "verbal, substantive, bedrock intuitions, different-questions-under-one-heading, or a mix". I will choose "mix" and justify.

  *(Refining "what_would_count_as_progress")*: Needs to be concrete. "Adopt a two-tier charter" is concrete.

  *(Refining "generalizes")*: Keep it short.

  Let's assemble.
answer: |-
  {
    "disagreement_type": "mix (different-questions-under-one-heading with substantive bedrock)",
    "side_a_steelmanned": "The school is a service provider operating in a pluralistic society; its legitimacy rests on respecting family autonomy and avoiding soft coercion. Imposing non-academic expectations privileges families with specific bandwidth and cultural habits, effectively excluding those who cannot comply, which undermines the school's neutrality and inclusivity.",
    "side_b_steelmanned": "The school is a cultural ecosystem that cannot survive on transactional enrollment alone; bilingualism and shared rituals require active reproduction by families. Without explicit norms, free-riding erodes the collective good, and treating community as optional guarantees mission drift until the school becomes indistinguishable from any standard provider.",
    "hidden_crux": "Does the institution have the moral authority to demand non-academic participation as a condition of membership, or is its authority limited strictly to educational delivery?",
    "hypothesis_assessment": "Your hypothesis is strong: Side A argues legitimacy (what may be demanded), Side B argues flourishing (what is needed). However, it gets wrong that these are independent; Side B believes flourishing is a precondition for legitimacy (a school that fails its mission has no right to exist), while Side A believes legitimacy is a precondition for flourishing (a school that coerces loses its community).",
    "what_would_count_as_progress": "Split the charter into two distinct documents: 'Conditions of Enrollment' (binding, enforceable rules) and 'Community Aspirations' (non-binding norms). Vote separately on whether specific items belong in Category 1 or Category 2, forcing the board to distinguish between survival necessities and cultural ideals.",
    "generalizes": "The diagnosis maps closely to the academic debate, but the school context differs crucially on exit costs: parents can leave the school far easier than citizens can leave a culture, which strengthens Side A's leverage compared to the national political theory context."
  }

  The structure of your deadlock is indeed a classic case of incommensurate frameworks, but your "different questions" hypothesis needs a slight tweak to be fully operational. You are correct that Side A is arguing from a deontological framework (rights, duties, legitimacy of coercion) while Side B is arguing from a teleological framework (purpose, ends, survival of the mission). However, the reason this stalls rather than just creating a polite disagreement is that each side views their question as the *gateway* to the other. Side A believes you cannot ask about flourishing until legitimacy is settled (you can't save a school by breaking rights). Side B believes you cannot ask about legitimacy until flourishing is settled (a school that doesn't work has no rights to claim). This creates a logical loop where neither side will engage the other's premise because they view their own premise as the prerequisite.

  The "mix" classification in the JSON reflects that there is a verbal component (what "community" means) but also a substantive bedrock conflict (individual autonomy vs. collective continuity). The steelmanning is crucial here because both sides have valid points that become invalid only when absolutized. Side A is right that soft coercion can be exclusionary to working families or those outside the dominant culture. Side B is right that "neutral" service provision often fails in bilingual contexts because language acquisition requires social reinforcement beyond the classroom. Recognizing that both risks are real is the only way to move past the "who is right" stalemate.

  The proposed progress step—splitting the charter into "Conditions" vs. "Aspirations"—is designed to break the logical loop. It forces Side B to identify which norms are actually existential threats (and thus belong in Conditions) versus which are merely desirable (Aspirations). Simultaneously, it forces Side A to concede that some binding norms may be necessary for the service to exist at all, while protecting families from having every cultural preference codified as a rule. This reframes the vote from "Do we want community?" (which everyone says yes to) to "What is the cost of exit for this specific norm?" which is a concrete, actionable policy question.
