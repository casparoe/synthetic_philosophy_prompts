answer: |-
  This is an exceptionally sharp question that cuts to the heart of the split between welfare economics and moral philosophy in the mid-20th century. Your intuition that the standard narrative ("Robbins killed it, Harsanyi resurrected it") is too simplistic is correct. The relationship is not a direct refutation but a **conceptual displacement**.

  Here is the breakdown of where your framing needs adjustment, how Harsanyi navigates Robbins's prohibition, and the distinction between the methodological and metaphysical claims.

  ### 1. Did Harsanyi Refute, Sidestep, or Fail to Engage Robbins?

  Harsanyi did not refute Robbins empirically, nor did he simply fail to engage him. He **sidestepped** Robbins's challenge by changing the ontology of "utility."

  **Robbins's Target (1932):**
  Robbins was attacking the *psychological* hedonism of the Old Welfare Economics (Pigou, Marshall). When Pigou spoke of utility, he meant a measurable psychic substance (satisfaction, pleasure). Robbins argued, correctly from a positivist standpoint, that there is no "utilimeter" to compare the intensity of my headache with yours. Therefore, any policy recommendation relying on such comparisons (e.g., "redistribute wealth because the marginal utility of money is higher for the poor") is ethical advocacy, not positive science.

  **Harsanyi's Move (1953/1955):**
  Harsanyi adopts the Von Neumann-Morgenstern (VNM) conception of utility. In VNM theory, utility is not a measure of psychological intensity; it is a **numerical representation of preference consistency under risk**.
  *   If your preferences satisfy certain axioms (completeness, transitivity, continuity, independence), there exists a function $U$ such that you maximize expected $U$.
  *   This function is *cardinal* (unique up to positive affine transformation: $U' = aU + b, a > 0$).

  **The Sidestep:**
  Robbins said: "You cannot compare inner feelings."
  Harsanyi says: "I am not comparing feelings. I am comparing the *structure of rational choice*."

  By shifting utility from a *psychological state* to a *formal property of rational preferences*, Harsanyi attempts to make interpersonal comparisons "scientific" in a way Robbins might accept. He argues that if we accept the axioms of rationality, we are logically committed to a specific way of aggregating those preferences. He transforms the problem from **measurement** (Robbins's worry) to **consistency** (Harsanyi's solution).

  ### 2. Where is the Comparability "Smuggled In"?

  Your TA is correct that critics argue comparability is assumed, but the technical location of this assumption is specific. It is not in the move to expected utility itself, but in the **normalization of the scales**.

  Here is the technical knot:
  1.  VNM utility gives Individual A a scale $[0, 1]$ and Individual B a scale $[0, 1]$.
  2.  However, A's "0" might represent starvation, while B's "0" represents a mild headache. A's "1" might be winning the lottery; B's "1" might be eating a good meal.
  3.  To add $U_A + U_B$ (utilitarianism), you need **Cardinal Unit Comparability**. You need to know that a 0.1 increase for A is "equal" to a 0.1 increase for B.

  Harsanyi's 1955 argument uses the **Veil of Ignorance** (equiprobability model) to justify the *weighting* (everyone counts equally). But does it justify the *metric*?
  *   **Harsanyi's Claim:** If I have an equal chance of being anyone, and I am rational, I must maximize the average utility. This implies I treat the utility units as comparable.
  *   **The Critique (Sen, Weymark, etc.):** This presupposes that the "distance" between preferences is comparable across persons. Harsanyi implicitly assumes that all individuals have a similar **capacity for satisfaction** or that their utility functions are already normalized to a common standard of "strength of preference."

  So, Harsanyi does not prove interpersonal comparability from thin air. He argues that **if** you accept the moral premise of the impartial observer (veil of ignorance) **and** the rationality premise (VNM axioms), **then** you must act *as if* utilities are comparable. He turns comparability into a requirement of rational moral judgment rather than an empirical fact about neural states.

  ### 3. The Methodological vs. Metaphysical Knot

  Your second insight is the stronger philosophical lever. You wrote: *"It seems to me that 'unverifiable' and 'meaningless' come apart."*

  **You are right, and this is where Robbins is often misread.**
  Robbins was influenced by the logical positivists of the Vienna Circle. For strict positivists, unverifiable statements were cognitively meaningless. Robbins was slightly more nuanced but still held that for economics to be a *science*, it must restrict itself to verifiable propositions.
  *   **Robbins's Claim:** Interpersonal comparisons are *normative* (ethical), not *positive* (scientific). They might be "true" in a moral sense, but they cannot be part of economic *science*.
  *   **The Standard Narrative Error:** Textbooks often teach that Robbins proved IUCs are *false*. He did not. He proved they are *outside the jurisdiction of positive economics*.

  **Harsanyi's Counter:**
  Harsanyi accepts the positivist demand for rigor but argues that by defining utility through **axiomatic deduction** (like geometry), he makes the aggregation scientifically valid.
  *   He is not claiming to measure your soul.
  *   He is claiming that *if* you want to be rational and impartial, *then* utilitarianism is the logical consequence.

  Therefore, the standoff is not primarily metaphysical (does utility exist?) but **methodological** (what counts as a valid derivation in social science?).
  *   Robbins: Valid derivation requires empirical verification. IUCs fail this.
  *   Harsanyi: Valid derivation requires axiomatic consistency. IUCs pass this *if* defined as preference structures.

  ### 4. Where Your Framing Goes Wrong

  Your framing is largely correct, but there is one subtle adjustment needed regarding **what Harsanyi thinks he is doing**.

  You ask: *"Did he quietly assume what he needed somewhere in the machinery?"*
  The answer is **yes**, but Harsanyi would not call it an assumption; he would call it a **definition of ethical rationality**.

  Your framing risks treating Harsanyi as trying to do *positive economics* (describing how the world is) in the Robbinsian sense. He is not. He is doing **rational reconstruction of moral judgment**. He admits that the "impartial observer" is a hypothetical construct.
  *   **Correction:** Harsanyi does not claim to have solved Robbins's empirical problem. He claims to have dissolved it by showing that welfare economics is inherently ethical. He agrees with Robbins that you cannot derive an "ought" from an "is" without ethical premises. His innovation is to show that *given* a very thin ethical premise (impartiality), the rest follows mathematically.

  So, Harsanyi agrees with Robbins that pure positive economics cannot yield welfare judgments. He disagrees that this renders welfare economics impossible; instead, he makes the ethical premises explicit and formalizes them.

  ### 5. Confidence and Historical Attributions

  **Confidence Level: High (85-90%)**
  I am highly confident in the technical distinction between VNM cardinality and psychological cardinality, and in the standard philosophical interpretation of the Robbins-Harsanyi debate (largely shaped by Amartya Sen's critiques in *Collective Choice and Social Welfare*).

  **The Least Certain Point (Flagged for your essay):**
  The point I am least sure about is **Robbins's private metaphysical commitment versus his public methodological stance in 1932.**

  *   **Why:** In *An Essay on the Nature and Significance of Economic Science* (1932), Robbins writes with the zeal of a positivist convert, often blurring the line between "we cannot know this scientifically" and "this is nonsense." However, in later decades (particularly after World War II and in his 1980s reflections), Robbins softened his position, admitting that interpersonal comparisons are unavoidable for practical policy and that his 1932 stance had been interpreted too dogmatically by his followers (like Samuelson).
  *   **Risk:** If you attribute a hardline "metaphysical denial" of utility to Robbins based solely on the 1932 text, you are textually accurate but perhaps biographically uncharitable. If you attribute a "soft" view to him, you risk anachronism regarding the 1932 context.
  *   **Recommendation:** In your essay, qualify your claims about Robbins by specifying: *"In the 1932 Essay, Robbins argues..."* rather than *"Robbins believes..."* This protects you from the historical nuance of his later career while accurately representing the text that influenced the generation Harsanyi was responding to.

  ### Summary for Your Thesis

  1.  **Robbins** banned interpersonal comparisons of *psychological intensity* from *positive science* due to lack of empirical verification.
  2.  **Harsanyi** did not refute this empirical claim. Instead, he redefined utility as *rational preference under risk* (VNM), which is cardinal by definition.
  3.  **The "Smuggling":** Harsanyi requires an assumption of **Cardinal Unit Comparability**. He justifies this not empirically, but via the **Veil of Ignorance** as a requirement of *rational ethical consistency*.
  4.  **Resolution:** The dispute is methodological. Robbins demanded empirical verification; Harsanyi offered axiomatic deduction. Harsanyi concedes Robbins's point that welfare economics is ethical, but argues ethics can be formalized scientifically.
  5.  **Your Insight:** You are correct that "unverifiable" does not mean "false." Harsanyi exploits this gap: IUCs are unverifiable empirically (Robbins is right) but verifiable axiomatically (Harsanyi's move).

  This distinction between **empirical verification** (Robbins) and **axiomatic consistency** (Harsanyi) is the key to untangling the knot for your essay.
