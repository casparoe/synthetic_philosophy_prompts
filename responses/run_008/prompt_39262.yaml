prompt: |-
  so i've been going in circles on the decision theory wars for like a decade now, and before i read another thousand comments about functional decision theory, i want the spec first: what does a decision theory actually have to get right to count as solving this stuff? write me the desiderata list. obviously it has to one-box in newcomb and smoke in the smoking lesion (or does the smoking lesion version with a genuine correlation and no causal link between smoking and lesions even count against evidential decision theory? flag if that's contested). but also the weirder cases: paying up in counterfactual mugging, cooperating with your twin in the prisoner's dilemma, transparent newcomb with the box already full or empty, and the evidential blackmail case where an agent leaks info about its own source code to set up extortion. for each requirement say what it's for, which camp treats it as non-negotiable vs. a preference, and whether some subset is jointly unsatisfiable -- that's the part i actually care about, if you can't have both "never regret the decision in hindsight from inside the world" and "win against predictors," say so instead of dodging. also throw in a requirement i almost never see stated: the theory should say something sane when you're not sure whether you're currently inside the predictor's simulation of you, and shouldn't require you to know your own source code. then score causal decision theory, evidential decision theory, and functional/updateless decision theory against the list, briefly -- i mostly want the criteria, not the scorecard. table is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Decision Theory (DT) wars (CDT, EDT, FDT/UDT, etc.).
      *   **Goal:** Provide a "spec" or "desiderata list" for what a successful DT must achieve.
      *   **Specific Cases to Cover:** Newcomb's Problem, Smoking Lesion, Counterfactual Mugging, Prisoner's Dilemma (vs. Twin), Transparent Newcomb, Evidential Blackmail (Source Code Extortion).
      *   **Specific Nuance:** Address the Smoking Lesion controversy (correlation vs. causation).
      *   **Crucial Requirement:** Identify joint unsatisfiability (trade-offs). Don't dodge conflicts (e.g., dynamic consistency vs. dominance).
      *   **Additional Requirement:** Handle self-locating uncertainty (am I in a simulation?) and bounded self-knowledge (don't need full source code access).
      *   **Output Format:** Desiderata list with explanations, camp disagreements, and impossibility results. Followed by a brief scoring table (CDT, EDT, FDT/UDT).
      *   **Tone:** Expert, direct, no fluff, acknowledging the decade-long stalemate.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Newcomb's Problem:* One-boxing. (FDT/UDT yes, CDT no, EDT yes).
      *   *Smoking Lesion:* Smoke. (CDT yes, EDT no, FDT/UDT yes *if* formulated correctly). *Note:* The user asks about the "genuine correlation" version. This is the "Tickle Defense" area.
      *   *Counterfactual Mugging:* Pay up. (UDT/FDT yes, CDT/EDT no). This tests precommitment/updatelessness.
      *   *Prisoner's Dilemma (Twin):* Cooperate. (FDT/UDT yes, CDT/EDT no). Tests logical correlation.
      *   *Transparent Newcomb:* One-box even if box looks full/empty (depending on formulation). This is the "Parfit's Hitchhiker" / "Transparent Newcomb" trouble spot for FDT.
      *   *Evidential Blackmail:* Don't pay. (FDT/UDT aims for this, EDT pays).
      *   *Self-Locating Uncertainty:* "Am I sim?" Needs to handle indexical uncertainty without collapsing.
      *   *Bounded Self-Knowledge:* Can't require reading own source code (computational irreducibility/Goedelian limits).

  3.  **Identify Conflicts/Impossibility Theorems:**
      *   *Dynamic Consistency vs. Dominance:* UDT sacrifices dynamic consistency (in the sense of changing plans mid-stream if new info arrives) to maintain dominance in Newcomb-like cases. CDT keeps dynamic consistency but loses money in Newcomb.
      *   *Evidence vs. Causation:* EDT fails Smoking Lesion because it treats correlation as causation. CDT fails Newcomb because it ignores logical correlation.
      *   *The "Transparent Newcomb" Problem:* FDT struggles here. If you see the money is there, one-boxing seems irrational *after* the fact. If you see it's empty, one-boxing is futile. This touches on the "Desire for Dominance" vs. "Desire for Expected Utility."
      *   *The "Logic of Decision" vs. "Computability":* You can't fully know your source code (Halting Problem). A DT requiring perfect self-simulation is impossible.

  4.  **Drafting the Desiderata List (Iterative Refinement):**

      *   *D1: Newcomb Dominance.* One-box. (FDT/EDT pass, CDT fail).
      *   *D2: Causal Independence.* Smoke in Lesion. (FDT/CDT pass, EDT fail). *Nuance:* The "Tickle Defense" saves EDT somewhat, but standard EDT fails.
      *   *D3: Updatelessness/Precommitment.* Pay Counterfactual Mugging. (FDT/UDT pass, CDT/EDT fail).
      *   *D4: Logical Correlation.* Cooperate with Twin. (FDT/UDT pass, CDT/EDT fail).
      *   *D5: Blackmail Resistance.* Ignore threats based on info you control. (FDT/UDT aim, EDT fails).
      *   *D6: Transparent Stability.* (The hard one). Behave optimally even when you see the outcome of the prediction. (FDT struggles here).
      *   *D7: Indexical Sanity.* Handle "Am I sim?" without infinite regress.
      *   *D8: Computational Feasibility.* Don't require full source code access.

      *   *Conflict:* D3 (Updatelessness) conflicts with standard Bayesian Conditionalization (Dynamic Consistency). You can't be both perfectly updateless and perfectly responsive to new *indexical* information in all frames.
      *   *Conflict:* D1 (Newcomb) conflicts with D6 (Transparent Dominance). If you see the box is empty, one-boxing loses. But if you are the type to one-box, the box is full. FDT tries to thread this but faces "The Procrastination Paradox" or "Transparent Newcomb" objections.

  5.  **Addressing the "Smoking Lesion" Nuance:**
      *   User asks: "does the smoking lesion version with a genuine correlation and no causal link... count against EDT?"
      *   *Answer:* Yes, standard EDT fails. The "Tickle Defense" argues you condition on the *urge* to smoke, breaking the correlation. But if the lesion causes the *decision* directly (bypassing urge), EDT fails. I need to flag this as contested.

  6.  **Addressing the "Source Code" Requirement:**
      *   This is the "Logical Induction" or "Bounded Reflective Consistency" angle. You can't just `if self.source_code == 'cooperate'`. You need a theory that works with *approximate* self-knowledge.

  7.  **Scoring the Theories:**
      *   *CDT:* Great on Lesion, terrible on Newcomb/Mugging/Twins.
      *   *EDT:* Great on Newcomb, terrible on Lesion/Blackmail/Mugging.
      *   *FDT/UDT:* Great on Newcomb/Mugging/Twins/Blackmail. Struggles on Transparent Newcomb (sometimes) and Computational Feasibility (hard to implement).

  8.  **Refining the "Impossible Trinity":**
      *   There isn't one single theorem like Arrow's, but there are known tensions.
      *   *Tension 1:* Dynamic Consistency vs. Newcomb Optimality. (You can't maximize expected utility at every node *and* be the type that gets the million).
      *   *Tension 2:* Dominance Principle vs. Expected Utility Principle. (CDT follows Dominance, loses EU. EDT/FDT follows EU, violates Dominance in some framings).
      *   *Tension 3:* Self-Knowledge. To do FDT, you need to know your algorithm. If you can't know it (Gödel), FDT is idealized but not implementable.

  9.  **Structuring the Response:**
      *   **Intro:** Acknowledge the fatigue. State the purpose (the Spec).
      *   **The Desiderata List:** Numbered, with "Why," "Who Cares," and "Conflict Flags."
      *   **The Impossibility Results:** Explicitly state what can't be had together.
      *   **The Scorecard:** Brief table.
      *   **Closing:** Brief comment on the state of the field.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "Am I in a simulation" requirement? Yes, D7.
      *   *Check:* Did I address the Smoking Lesion nuance? Yes, in D2 notes.
      *   *Check:* Is the tone right? Needs to be sharp, not pedagogical.
      *   *Check:* Transparent Newcomb. This is the biggest hole in FDT. I need to be honest about it. FDT proponents argue you shouldn't *look* in the box, but if you do, what then?
      *   *Check:* Source Code. FDT assumes logical counterfactuals over algorithms. If you can't access the algorithm, how do you compute the counterfactual? This is the "Bounded FDT" problem.

  11. **Final Polish:** Ensure clear headings and bold text for readability. Make sure the "Joint Unsatisfiability" section is prominent as requested. (Self-correction: Ensure I distinguish UDT and FDT where necessary, but they are close enough for a high-level spec).

  12. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  You want the spec without the sermon. Here is the desiderata list for a "Solved" Decision Theory, based on the current consensus of the rationalist/decision-theory community (MIRI, LessWrong, academic pockets), highlighting where the bodies are buried.

  ### The Decision Theory Spec (v1.0)

  | # | Desideratum | The Test Case | Why It Matters | Who Treats as Non-Negotiable | Conflict Flag |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Newcomb Optimality** | **Newcomb's Problem.** One-box when the predictor is reliable. | If you two-box, you leave money on the table. A DT that loses money against a reliable predictor is practically defective. | **FDT/UDT**, EDT. (CDT treats this as a preference, not a requirement). | Conflicts with **D6** (Transparent Dominance) and **D8** (Dynamic Consistency). |
  | **D2** | **Causal Sanity** | **Smoking Lesion.** Smoke if you want to, provided smoking doesn't *cause* the lesion. | EDT fails here by treating correlation as causation. A DT must distinguish between "news" and "influence." | **CDT**, **FDT/UDT**. (EDT proponents argue the "Tickle Defense" saves them, but this is contested). | Conflicts with **D1** if the theory cannot distinguish logical correlation from causal correlation. |
  | **D3** | **Updatelessness** | **Counterfactual Mugging.** Pay the mugger even after you know you lost the coin toss. | If you don't pay, you wouldn't have been the type of agent the mugger would have bet on. You must maximize *ex-ante* expected utility, not *ex-post*. | **UDT/FDT**. (CDT/EDT reject this as "sunk cost fallacy"). | Directly violates standard Bayesian Conditionalization (**D8**). |
  | **D4** | **Logical Correlation** | **Prisoner's Dilemma vs. Twin.** Cooperate with an identical copy of yourself. | If your twin is you, defecting is effectively defecting against yourself. CDT/EDT fail to capture logical dependency. | **FDT/UDT**. | Requires a theory of counterfactuals over algorithms, not just physical states. |
  | **D5** | **Blackmail Immunity** | **Evidential Blackmail.** Do not pay an extortionist who threatens to reveal info they can only generate if you pay. | EDT pays because paying is evidence the info exists. A DT must recognize the extortionist's output is *conditional* on your decision. | **FDT/UDT**. | Hard to formalize without solving the halting problem (see **D9**). |
  | **D6** | **Transparent Stability** | **Transparent Newcomb.** One-box even if you *see* the million is there (or empty). | If you change your mind upon seeing the box, the predictor would have predicted that and left it empty. You must be the *type* that one-boxes regardless of observation. | **FDT** (attempts this). | **Major Conflict:** Violates the Dominance Principle. If the box is visibly empty, one-boxing guarantees $0 vs $1000. |
  | **D7** | **Indexical Sanity** | **Simulation Uncertainty.** Act correctly when you don't know if you are the "real" agent or the predictor's simulation. | Many problems (Mugging, Newcomb) rely on this. If the DT crashes or loops here, it fails the core use-case. | **UDT/FDT**. | Requires handling self-locating belief without infinite regress. |
  | **D8** | **Dynamic Consistency** | **Plan Stability.** Do not regret your plan at execution time given new information. | CDT satisfies this. UDT/FDT often violate it (you regret paying the mugger *after* the coin flip). | **CDT**, **EDT**. | **Jointly Unsatisfiable with D1 & D3.** You cannot be dynamically consistent *and* win Newcomb/Mugging. |
  | **D9** | **Bounded Self-Knowledge** | **No Source Code Access.** Function without needing to read your own source code or solve the Halting Problem. | You cannot simulate yourself perfectly. A DT requiring full self-access is computationally impossible. | **Everyone** (in practice). | **FDT/UDT** currently rely on idealized logical counterfactuals that assume this is solvable. |

  ---

  ### The Impossibility Results (The "You Can't Have It All" Section)

  You asked for the joint unsatisfiability constraints. Here they are. There is no "God Theory" that satisfies all desiderata simultaneously.

  **1. The Dynamic Consistency vs. Newcomb Optimality Trade-off**
  *   **The Conflict:** You cannot satisfy **D1** (Newcomb) and **D8** (Dynamic Consistency).
  *   **The Reason:** To win Newcomb, you must commit to one-boxing *before* the prediction. Once the prediction is made and you stand before the boxes, CDT says "The money is already there or not; my action can't change it. Two-box to dominate."
  *   **The Verdict:** If you want to win (get the million), you must accept that your future self will look at your plan and say, "This is irrational given what I know now." **UDT/FDT sacrifice Dynamic Consistency to win.** CDT keeps Dynamic Consistency and loses the money.

  **2. The Dominance vs. Expected Utility Trade-off**
  *   **The Conflict:** You cannot satisfy **D6** (Transparent Stability) and the **Dominance Principle** (If A is better than B in every state, choose A).
  *   **The Reason:** In Transparent Newcomb, if you see the box is empty, One-Boxing yields $0, Two-Boxing yields $1000. Two-boxing dominates. However, if you are the *type* that two-boxes when seeing an empty box, the predictor leaves it empty. To get the million, you must one-box even when it is strictly dominated in the local context.
  *   **The Verdict:** FDT attempts to dissolve this by arguing the "states" aren't independent of your decision, but formally, this violates standard dominance reasoning.

  **3. The Computability Barrier (D9)**
  *   **The Conflict:** **D4/D5** (Logical Correlation/Blackmail) vs. **D9** (Bounded Self-Knowledge).
  *   **The Reason:** To cooperate with your twin or resist blackmail, FDT requires evaluating counterfactuals like "What if my source code outputted Cooperate instead of Defect?" This requires reasoning about your own algorithm as an object. Due to Gödelian limits and the Halting Problem, you cannot perfectly model your own decision process.
  *   **The Verdict:** FDT is currently an **idealized theory**. It works in toy models where agents can prove things about each other (e.g., Modal UDT), but there is no known computable approximation that guarantees the FDT wins in the general case without running into Lobian loops or infinite regress.

  **4. The Smoking Lesion Contention (D2 Nuance)**
  *   **The Conflict:** **D1** (Newcomb) vs. **D2** (Lesion).
  *   **The Nuance:** You asked if the Lesion counts against EDT. **Yes.** Standard EDT fails the Smoking Lesion because it conditions on the action (Smoking) which is correlated with the Lesion.
  *   **The Defense:** EDT proponents use the "Tickle Defense" (condition on the *urge* to smoke, not the smoke).
  *   **The Counter:** If the lesion causes the *decision* directly (bypassing the urge), the Tickle Defense fails. FDT handles this by distinguishing *causal* graphs from *logical* graphs, but this requires knowing the causal structure, which circles back to **D9**.

  ---

  ### The Scorecard

  | Theory | Newcomb (D1) | Lesion (D2) | Mugging (D3) | Twin PD (D4) | Blackmail (D5) | Transparent (D6) | Dynamic Consistency (D8) | Self-Knowledge (D9) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **CDT** | ❌ (Two-boxes) | ✅ (Smokes) | ❌ (Don't Pay) | ❌ (Defects) | ❌ (Pays*) | ✅ (Two-boxes) | ✅ | ✅ |
  | **EDT** | ✅ (One-boxes) | ❌ (Don't Smoke)** | ❌ (Don't Pay) | ❌ (Defects) | ❌ (Pays) | ❓ (Unstable) | ✅ | ✅ |
  | **FDT/UDT** | ✅ (One-boxes) | ✅ (Smokes) | ✅ (Pays) | ✅ (Cooperates) | ✅ (Ignores) | ⚠️ (Debated) | ❌ | ❌ (Idealized) |

  *\*CDT pays if the blackmail is causal, fails if evidential.*
  *\*\*EDT fails unless "Tickle Defense" assumptions hold.*
  *⚠️FDT proponents argue you shouldn't look in the box; if you do, the theory is under-specified.*

  ### Summary for the Exhausted Decider

  1.  **If you value "Never regretting a decision at the moment of execution" (Dynamic Consistency):** You must use **CDT**. You will lose money in Newcomb and Mugging cases, but you will never feel like you acted irrationally given your current information.
  2.  **If you value "Winning the most money across all possible worlds" (Expected Utility):** You must use **FDT/UDT**. You must accept that your future self will sometimes scream that your precommitment is irrational (violating Dynamic Consistency) and that the theory currently relies on idealized math you can't actually compute (violating Bounded Self-Knowledge).
  3.  **The Smoking Lesion:** Counts against EDT. The correlation is spurious, and acting on it is a failure of instrumental rationality.
  4.  **The Simulation Requirement:** Only UDT/FDT explicitly handle "I might be a sim" by treating the decision as a logical output that applies across all instantiations of the algorithm. CDT/EDT treat you as a unique physical instance.

  **The Hard Truth:** There is no decision theory that is simultaneously **computable**, **dynamically consistent**, and **wins in all Newcomb-like problems**. You have to pick which failure mode you prefer. Most researchers currently betting on "Winning" (FDT/UDT) accept the cost of "Idealized/Uncomputable" and "Dynamically Inconsistent."
