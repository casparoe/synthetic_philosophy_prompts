answer: |-
  # Quiz: Which Theory of Exploitation Do You Actually Hold?

  **Instructions:** Read each scenario and select the response that best matches your intuitive judgment. Don't overthink the theory behind it; just pick the verdict that feels right. Keep track of your answers (e.g., Q1: A, Q2: C, etc.).

  ***

  ### 1. The Sweatshop
  A factory in a low-income country pays workers the local going rate. The workers are significantly better off than they would be subsistence farming, but the owner takes a massive profit margin on the goods sold abroad.
  *   **A.** Not exploitative. Both parties benefit voluntarily; blocking the job would hurt the workers.
  *   **B.** Exploitative. The owner is appropriating value the workers created, regardless of how poor they were before.
  *   **C.** Exploitative. The workers' "choice" is coerced by their lack of alternatives and global asset inequality.

  ### 2. The Democratic Co-op
  A worker-owned cooperative is thriving. The members vote to distribute all profits among themselves but hire temporary seasonal workers at low wages with no voting rights to handle the rush.
  *   **A.** Not exploitative. The temps agreed to the wage, and the owners earned their stake through membership.
  *   **B.** Exploitative. The temps contribute to the surplus but are excluded from claiming it.
  *   **C.** Exploitative. The members are using their democratic power to externalize risk onto a vulnerable underclass.

  ### 3. The Island Machine (Roemer's Case)
  On an island, one person owns the only fishing machine. Others can fish by hand (subsistence) or work for the owner (wages). The wages are high enough that everyone is better off than fishing by hand, but the owner gets rich off the difference.
  *   **A.** Not exploitative. Everyone is wealthier than the counterfactual; the owner provided the capital.
  *   **B.** Exploitative. The owner withdraws more labor from the pool than they contribute, purely due to ownership rights.
  *   **C.** Exploitative. The initial distribution of the machine was arbitrary; if assets were equal, this profit wouldn't exist.

  ### 4. The Insulin Monopoly
  A pharmaceutical company holds a patent on insulin. They raise the price 500%. Patients pay it because they will die without it. The company argues this funds R&D.
  *   **A.** Not exploitative. It is a voluntary exchange for a life-saving good; price reflects value to the buyer.
  *   **B.** Exploitative. They are leveraging a life-or-death dependency to extract value, not competing on quality.
  *   **C.** Exploitative. The patent system created an artificial scarcity that allows for monopoly rent, not productive profit.

  ### 5. The Happy Exchange
  Two people trade. Person A gains $100, Person B gains $100. Both are happier afterward. Both would happily repeat the trade tomorrow.
  *   **A.** By definition, this cannot be exploitation. Mutual benefit rules it out.
  *   **B.** It can still be exploitation. One party might have taken a unfairly large share of the *potential* total value created.
  *   **C.** It depends. If Person B only agreed because they were desperate, the benefit doesn't cleanse the wrong.

  ### 6. The Golden Handcuffs
  A worker has a job with high pay, great benefits, and total job security. However, they have zero control over their tasks, are forbidden from speaking to colleagues, and find the work meaningless.
  *   **A.** No exploitation here. The compensation package fairly purchases the worker's time and compliance.
  *   **B.** This isn't exploitation, it's alienation. The wrong is the loss of self, not the wage distribution.
  *   **C.** It is exploitative. High pay is a bribe to accept a status of subordination and loss of agency.

  ### 7. The Inheritance
  A CEO earns 300x the average worker. They argue this reflects their skill. You discover they inherited the company and the network that made their skill valuable.
  *   **A.** Irrelevant. Their current contribution justifies the pay; history doesn't change the current trade.
  *   **B.** Exploitative. Their high income stems from an unchosen advantage (inheritance), not effort or contribution.
  *   **C.** Exploitative. The inheritance creates a power hierarchy that makes the workers subordinate, regardless of pay.

  ### 8. The Nice Boss
  A factory owner pays above-market wages, listens to grievances, and treats workers with dignity. However, they still legally own the surplus value produced.
  *   **A.** Not exploitative. Exploitation requires abuse or coercion; this is a benevolent partnership.
  *   **B.** Exploitative. The structural relationship (owner vs. worker) is the problem, not the boss's personality.
  *   **C.** Not exploitative, but still problematic. The workers are dependent on the boss's goodwill rather than having rights.

  ### 9. The Desperate Sale
  An artist sells a painting for $50 to a dealer because they need rent money. The dealer sells it next week for $5,000.
  *   **A.** Not exploitative. The artist set the price; the dealer took the risk on resale.
  *   **B.** Exploitative. The dealer took advantage of the artist's vulnerability to capture value they didn't create.
  *   **C.** Exploitative. The artist was not paid the true value of their labor time.

  ### 10. The Robot Owner
  Imagine a future where robots do all the labor. One person owns the robots. Everyone else receives a basic stipend from the owner to survive.
  *   **A.** Not exploitative. No labor is being extracted from humans; it's just asset management.
  *   **B.** Exploitative. The owner is claiming the social product of the automated economy based on a property title.
  *   **C.** Exploitative. The rest of humanity is rendered dependent on the owner's charity for survival.

  ***

  # Scoring Key & Diagnostic

  *Note: This is not a clinical diagnosis. Political philosophy is messy. Use this to locate your intuitions within the logical space of exploitation theory.*

  ### Step 1: Tally Your "Primary Concern"
  Look at your answers. Which letter did you pick most often?

  *   **Mostly A's: The Free-Market / Neoclassical View.**
      *   **Core Principle:** Exploitation requires coercion or fraud. Voluntary, mutually beneficial exchanges are by definition fair.
      *   **Verdict:** You believe welfare improvements and consent wash away claims of exploitation. You likely view "surplus value" as a return on risk or capital contribution, not theft.
  *   **Mostly B's: The Orthodox / Surplus-Labor View.**
      *   **Core Principle:** Exploitation is the structural extraction of unpaid labor time.
      *   **Verdict:** You believe the wrongness is in the *transaction itself* (who gets the surplus), regardless of how nice the boss is or how high the wages are.
  *   **Mostly C's: The Structural / Domination View.**
      *   **Core Principle:** Exploitation is about power, vulnerability, and asset distribution.
      *   **Verdict:** You focus on *why* the deal was made (desperation, inequality) or the *status* relationship (dependence, hierarchy) rather than just the math of the wage.

  ### Step 2: Diagnostic Tie-Breakers (The "Logical Space" Check)
  Simple tallies hide nuance. Check these specific answer pairs to refine your position.

  **1. The Orthodox vs. Roemerian Split (Check Q3 & Q10)**
  *   **If you answered B on Q3 (Island) AND B on Q10 (Robots):** You are an **Orthodox Marxist**. You believe exploitation is inherent to the *labor-capital relation*. Even if assets were equalized, if one class hires another to generate surplus, it's exploitation.
  *   **If you answered B on Q3 (Island) BUT A on Q10 (Robots):** You are a **Roemerian / Rational Choice Marxist**. You believe exploitation is caused by *unequal asset distribution*. If robots do the work, there is no human labor to exploit, so the wrong vanishes. The sin is the unequal ownership of the machine, not the extraction of labor.
  *   **Indistinguishability Flag:** In many standard cases (Q1, Q4), Orthodox and Roemerian views give identical answers. To pull them apart, ask: *"If we equalized all assets tomorrow, but one group still hired another to work for wages, would it still be exploitative?"* The Orthodox says Yes; the Roemerian says No.

  **2. The Domination vs. Luck Egalitarian Split (Check Q7 & Q9)**
  *   **If you answered B on Q9 (Desperate Sale) AND B on Q7 (Inheritance):** You lean **Luck Egalitarian**. You focus on "unchosen disadvantages." The artist was unlucky to be poor; the CEO was lucky to inherit. Exploitation is unfairness rooted in moral arbitrariness.
  *   **If you answered C on Q9 (Desperate Sale) AND C on Q7 (Inheritance):** You lean **Republican / Domination Theory**. You focus on *dependency*. The artist was dominated by necessity; the workers are dominated by the heir's power. It's about status, not just luck.
  *   **Incoherence Flag:** If you answered **A on Q1 (Sweatshop)** but **B on Q9 (Desperate Sale)**, your position is logically unstable. In both cases, the worker/seller accepts a low offer due to economic pressure. To hold this pair, you must argue that *international* desperation is voluntary but *domestic* desperation is coercive, which requires a specific border-based theory of justice most people haven't articulated.

  **3. The Alienation vs. Distribution Split (Check Q6)**
  *   **If you answered B on Q6:** You are tracking **Alienation**, not Exploitation. Marx complained about both, but they are distinct. You can be well-paid (no exploitation in the surplus sense) but alienated (no control/meaning).
  *   **If you answered C on Q6:** You conflate the two. You believe high pay is *part* of the domination strategy ("Golden Handcuffs").
  *   **Incoherence Flag:** If you answered **A on Q1 (Sweatshop)** claiming "they are better off," but **C on Q6 (Golden Handcuffs)** claiming "high pay is a bribe," you have a contradiction. You cannot argue that high welfare proves fairness in one case while arguing that high welfare masks unfreedom in the other without explaining the difference in *kind* between the two jobs.

  ### Step 3: Unoccupied Logical Cells
  *   **The "Benefit Makes It Fair" Paradox:** If you answered **A on Q5 (Happy Exchange)**, you occupy the Free Market cell. If you answered **B on Q5**, you occupy almost all Critical Theory cells.
  *   **The Empty Cell:** There is almost no coherent position that answers **A on Q3 (Island)** but **B on Q1 (Sweatshop)**. This would mean you think owning a machine and hiring people is fine, but paying low wages in a poor country is not. This usually indicates an unexamined bias against *foreign* capital specifically, rather than a consistent theory of exploitation.
  *   **The "Nice Boss" Exception:** If you answered **A on Q8 (Nice Boss)** but **B on Q1 (Sweatshop)**, you hold a **Domination-Only** view. You believe exploitation is purely about interpersonal abuse or coercion, not structural surplus extraction. This is a valid position (often held by non-Marxist progressives), but it means you do not believe "exploitation" is a systemic feature of capitalism, only a bug.

  ### Summary of Positions
  *   **Free-Market:** Consent + Benefit = Fairness. (Mostly A)
  *   **Orthodox Marxist:** Surplus Extraction = Exploitation (even with high wages/nice bosses). (Mostly B, specifically Q3=B, Q10=B)
  *   **Roemerian:** Unequal Assets = Exploitation (fix assets, fix the problem). (Mostly B/C, specifically Q3=B, Q10=A)
  *   **Domination/Republican:** Dependency + Vulnerability = Exploitation. (Mostly C)
  *   **Luck Egalitarian:** Unchosen Disadvantage = Exploitation. (Mix of B/C on Q7/Q9)
  *   **Alienation Theorist:** Loss of Agency/Meaning = The Real Wrong. (Specifically Q6=B)

  *Final Note: If your answers were scattered across all letters, you likely hold a **Pluralist** view: you think "exploitation" is a word we use for three different things (unfair distribution, coercive power, and alienating work) that often overlap but aren't identical. This is arguably the most robust position for a modern reading group.*
