prompt: |-
  ok so some context: I'm a first-year PhD student and just got handed my own discussion section for the first time — intro course on rational choice, about 20 students, 75 minutes. My week's topic is Parfit's hitchhiker and the cluster around it: rational irrationality, commitment, credibility, why being (or seeming) irrational can pay. The topic also got weirdly personal for me last month: back in January I asked a collegue to cover one of my grading shifts because I was travelling, and sealed it by promising to cover her shift in April. April rolls around, its a gorgeous weekend, and I'm standing there realizing: past me made a promise that present me now has to eat the cost of, and if she'd known I'd be this rational about it in April she'd never have covered me in January. Apparently that's the whole point of the literature, but I felt it before I could name it, and that's what I want for the students.

  Design me a game that gets them there. Requirements, roughly:

  - No real money — points or tokens, maybe a silly leaderboard. But at the moment of paying, paying has to be strictly dominated: it costs you points and you get literally nothing back. They should feel the "why on earth would I" pull in their own heads, not just see it on a handout.
  - Two roles, hitchhikers and drivers, multiple rounds so reputations can form. Drivers choose whom to take.
  - Crucially: I want dispositions dealt like cards. Some students get a sealed card that says they keep promises even when it costs them; some get a card that says they're fully rational and will not pay once paying is pointless. They don't get to pick. I'm hoping the finding emerges on its own: the fully rational ones can't get rides.
  - A cheap-talk phase — hitchhikers get 30 seconds to say whatever they want to the driver before the driver decides. I want to know if talk works, and whether it works differently for the two card types.
  - A commitment device they can purchase: sign a binding card at a small upfront cost, and I act as the referee and enforce it. I want to see if demand for it only shows up after the first failure, which is the part I find most interesting.
  - Don't reveal the philosophical point up front. No lecture, the name can come out in the debrief if at all.
  - The debrief has to map specific moments in the game onto the distinction between the rationality of acts and the rationality of dispositions/characters, and onto one-shot vs repeated play. And it has to be honest about what the game can't reproduce — in the game your character is dealt to you, in life you can't just decide to be someone who keeps promises at a cost, or can you? I'd rather that part be said out loud to me than papered over.
  - Also tell me what will predictably go wrong the first time I run it. I've never facilitated anything before, so include the novice-facilitator stuff too: rules disputes, kids colluding outside the rules, the one person who thinks its hilarious to defect every round, me fumbling the explanation.
  - One last thing: give me the payoff table as something I can just put on a slide, because I will absolutely botch explaining it out loud. And maybe a sentence or two on where this debate actually lives so I don't sound like an idiot when a student asks "wait, so is being rational bad?" — but keep it light, I don't want the debrief turning into a lecture on constrained maximization.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**

      *   **User:** First-year PhD student, first-time discussion section leader.
      *   **Topic:** Parfit's Hitchhiker, rational irrationality, commitment, credibility.
      *   **Goal:** Design a classroom game (75 mins, ~20 students) that makes students *feel* the tension between act-rationality and disposition-rationality.
      *   **Key Mechanics:**
          *   No real money (points/tokens).
          *   Paying must be strictly dominated at the moment of payment (costs points, no return).
          *   Two roles: Hitchhikers (need ride) and Drivers (choose to give ride).
          *   Dispositions dealt as cards (Irrational/Promise-Keeper vs. Rational/Defector).
          *   Cheap-talk phase (30 secs).
          *   Commitment device (buyable, enforced by instructor).
          *   No upfront philosophical lecture.
          *   Debrief must map game moments to theory (act vs. disposition, one-shot vs. repeated) and address the "can you choose your character?" problem.
          *   Include "what will go wrong" (novice facilitator advice).
          *   Include a clear payoff table slide.
          *   Include a brief note on the philosophical debate context.

  2.  **Deconstruct the Game Mechanics:**

      *   *The Core Tension:* In Parfit's Hitchhiker, once you are in the car (safe), paying is irrational. But if you are known to be the type who won't pay, you never get in the car.
      *   *Roles:*
          *   Drivers: Decide to Pick Up or Drive On.
          *   Hitchhikers: If picked up, Decide to Pay or Stiff.
      *   *Dispositions:*
          *   Type A (Promise Keeper): *Must* pay if picked up (even if costly).
          *   Type B (Rational Maximizer): *Will not* pay if picked up (strictly dominated action).
      *   *Information:* Drivers don't know the type initially, but can learn over rounds. Hitchhikers know their own type.
      *   *Cheap Talk:* Hitchhikers can promise to pay.
      *   *Commitment:* Hitchhikers can buy a "Contract" before the round starts.
      *   *Payoffs:* Need to ensure "Stiffing" yields higher points *in that round* than "Paying," but "Getting a Ride" yields higher points than "Being Left Behind."

  3.  **Drafting the Payoff Structure:**

      *   Base state: 0 points.
      *   Hitchhiker Left Behind: 0 points.
      *   Hitchhiker Gets Ride + Pays: Cost -10, Benefit +50. Net +40.
      *   Hitchhiker Gets Ride + Stiffs: Cost 0, Benefit +50. Net +50.
      *   Driver Picks Up + Gets Paid: Cost -5 (gas), Reward +20 (good deed/payment). Net +15.
      *   Driver Picks Up + Stiffed: Cost -5 (gas), Reward 0. Net -5.
      *   Driver Drives On: 0 points.
      *   *Check:* Is paying strictly dominated? Yes. If you are in the car, Paying (+40) < Stiffing (+50).
      *   *Check:* Is picking up rational? Only if you expect payment. Expected Value > 0.

  4.  **Structuring the Rounds:**

      *   *Round 1 (Baseline):* No commitment device. Just talk and types. Expect Rational types to get stiffed and Drivers to learn not to pick them up.
      *   *Round 2 (Commitment):* Introduce the "Contract." Hitchhikers can pay a small fee (e.g., 5 points) to bind themselves. If they stiff after signing, they lose big (enforced by instructor).
      *   *Round 3 (Mixed/Free):* Let them choose strategies or repeat to see equilibrium.

      *Correction:* To make it flow better for 75 mins:
      *   Phase 1: Pure Interaction (Talk + Decision). 3 Rounds.
      *   Phase 2: Introduce Commitment Device. 3 Rounds.
      *   Phase 3: Debrief.

  5.  **Addressing the "Disposition" Constraint:**

      *   The prompt asks for dispositions dealt like cards.
      *   *Constraint:* "Some students get a sealed card that says they keep promises... some get a card that says they're fully rational."
      *   *Implementation:* At the start, deal cards.
          *   Card Red (The "Parfitian"): You *must* pay if picked up. (Or you lose massive points/honor). Actually, to make it a *disposition* game, it's better if the card dictates their *allowed strategy*.
          *   Card Blue (The "Rational"): You *must* maximize points. You cannot pay if it costs you.
      *   *Wait, a nuance:* If the "Rational" card *forces* them to defect, it's not a choice. If the "Promise" card *forces* them to pay, it's not a choice. This simulates having a fixed character.
      *   *Refinement:* Let's make it a secret identity. 50% Red, 50% Blue.
      *   *Red (Trustworthy):* If you defect (stiff), you get -100 points (intrinsic cost/enforcement). So they *will* pay.
      *   *Blue (Rational):* No intrinsic cost. They *won't* pay.
      *   *Problem:* If it's secret, Drivers never learn.
      *   *Solution:* Public reveal *after* the transaction? Or allow Drivers to observe history. Let's go with **Public History**. After each round, the Hitchhiker's action (Paid/Stiffed) is announced, but their Card Type remains secret *unless* they choose to reveal it? No, keep it simple.
      *   *Better approach for a 75-min section:* The "Card" determines their *incentive structure*, not just a rule.
          *   Type A (Irrational Committer): Gains +10 "Honor Points" for paying, loses -10 for stiffing. This makes Paying rational for them.
          *   Type B (Standard Rational): No honor points. Stiffing is dominant.
      *   *Actually, the prompt says:* "Drivers choose whom to take." This implies matching.
      *   *Let's simplify:* 10 Drivers, 10 Hitchhikers.
      *   Hitchhikers draw a card: "Keeper" or "Leaver".
      *   Keeper: *Must* pay (rule enforced by TA/Instructor checking sheets).
      *   Leaver: *Free* to choose (will choose not to pay).
      *   *Wait, if it's enforced by rule, where is the tension?* The tension is for the *Driver*. The Driver doesn't know the card.
      *   *Okay, let's lock that in:* Hitchhikers know their type. Drivers do not.

  6.  **Developing the "What Will Go Wrong" Section:**

      *   Novice facilitators talk too much.
      *   Students confuse the rules.
      *   The "Rational" students will laugh about defecting.
      *   The "Keeper" students will feel cheated.
      *   Time management is the killer. 75 mins flies.
      *   Collusion: "I'll pick you if you pick me." (Need to randomize pairing).

  7.  **Developing the Debrief:**

      *   Connect the "Card" to "Dispositions/Character."
      *   Connect the "Contract" to "Commitment Devices."
      *   Address the "Can you choose your character?" question honestly (Parfit says you can cultivate dispositions, but it's hard).
      *   Keep the philosophy light (Gauthier, McClennen, Parfit).

  8.  **Refining the Payoff Table:**

      *   Needs to be crystal clear on a slide.
      *   Driver: Pick Up (Risk -5, Gain +20 if paid). Drive On (0).
      *   Hitchhiker: Ride (Gain +50). Pay (-15). Stiff (0).
      *   Net for Hitchhiker: Pay = 35, Stiff = 50. (Stiff is dominant).
      *   Net for Driver: Paid = +15, Stiffed = -5.

  9.  **Review against Constraints:**

      *   *No real money:* Check (Points).
      *   *Paying strictly dominated:* Check (35 vs 50).
      *   *Two roles:* Check.
      *   *Dispositions as cards:* Check (Keeper vs. Maximizer).
      *   *Cheap talk:* Check (30 sec pitch).
      *   *Commitment device:* Check (Buy a contract).
      *   *No upfront lecture:* Check.
      *   *Debrief requirements:* Check.
      *   *Novice advice:* Check.
      *   *Payoff slide:* Check.
      *   *Philosophy context:* Check.

  10. **Final Polish:**

      *   Tone: Supportive, collegial, acknowledging the stress of first-time teaching.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Specific Scripting: Give them exact words for the tricky parts.
      *   Timing: Break down the 75 mins strictly.

      *(Self-Correction during drafting)*: Make sure the "Commitment Device" mechanic is clear. If they buy it, they *must* pay. If they don't, they follow their card.
      *   *Wait, one nuance:* If the "Rational" card holder buys the commitment, they become bound. This shows the *value* of commitment.
      *   *Cost of Commitment:* Needs to be less than the gain from getting a ride, but enough to be a "cost." Say, 5 points.
      *   *Hitchhiker Gain:* 50.
      *   *Payment Cost:* 15.
      *   *Commitment Cost:* 5.
      *   *Scenario:* Rational Hitchhiker.
          *   No Contract: Gets ride (maybe), Stiffs. Net 50. Driver loses trust. Next round, no ride.
          *   With Contract: Pays 5 upfront. Gets ride. Pays 15. Net 30. Driver happy. Gets ride again.
      *   *This works.* It shows that sacrificing immediate utility (buying contract + paying) secures long-term utility (rides).

      *(Final check on "Strictly Dominated")*: At the moment of payment, if I have the ride, Paying (-15) is worse than Stiffing (0). The Contract changes the *rules*, not the *payoff* at that specific second, but adds a penalty *after* if caught. To make it strictly dominated *even with the contract*, the enforcement must be automatic.
      *   *Simpler:* If you sign the contract, the Instructor *takes* the payment from you automatically. You don't get to choose. This highlights that you needed to *remove your choice* to get the benefit. This is the essence of commitment.

      *Let's adjust:* The Commitment Device isn't just a promise; it's a binding constraint. "If you buy this card, you are physically not allowed to stiff." This mirrors Ulysses tying himself to the mast.

      *Okay, ready to write.*
answer: |-
  This is a fantastic topic to teach, and honestly, the fact that you've already lived the tension (the grading shift promise) means you're going to teach this with an authenticity that slides can't replicate. First-time discussion leading is nerve-wracking, but this plan is designed to run itself so you can focus on the room.

  Here is a complete game design, facilitation script, and contingency plan for your 75-minute section.

  # Game Title: "The Desert Run"

  ## 1. The Setup (Logistics & Materials)
  *   **Class Size:** 20 students.
  *   **Roles:** 10 Drivers, 10 Hitchhikers. (If you have odd numbers, you play the extra role).
  *   **Materials:**
      *   Printed "Identity Cards" (50% **Type A: Promise Keeper**, 50% **Type B: Rational Maximizer**).
      *   Printed "Decision Sheets" for each round.
      *   A "Commitment Contract" slip (for Phase 2).
      *   Projector for the Payoff Table (see Section 4).
      *   Whiteboard for a visible Leaderboard (Teams or Individuals).
  *   **Currency:** "Desert Points" (DP). Top 3 scores get a trivial prize (candy, or "homework pass" if you have that power).

  ## 2. The Mechanics (Read this, don't explain all of it yet)
  *   **The Goal:** Maximize your Desert Points over 6 Rounds.
  *   **The Match:** Each round, Hitchhikers are randomly paired with a Driver.
  *   **The Sequence:**
      1.  **Pitch (30 secs):** Hitchhiker speaks to Driver.
      2.  **Driver Decision:** Pick Up or Drive On.
      3.  **Hitchhiker Decision:** If picked up, Pay or Stiff.
  *   **The Dispositions (Secret):**
      *   **Type A (Keeper):** You feel a moral cost. If you Stiff, you lose 20 DP automatically (guilt/shame). *Effectively, you will always Pay.*
      *   **Type B (Rational):** You feel no moral cost. You will do whatever maximizes points. *Effectively, you will always Stiff if picked up.*
  *   **The Commitment Device (Phase 2 only):** A Hitchhiker can buy a "Binding Contract" for 5 DP *before* the round starts. If they have this, the Instructor enforces payment automatically. They cannot Stiff.

  ## 3. Run of Show (75 Minutes)

  ### 0:00–0:10 | Introduction & Rules
  *   **Do:** Hand out roles and Identity Cards. Tell them to keep cards secret.
  *   **Say:** "You are in a desert. Drivers have gas; Hitchhikers need to get to town. You will play 6 rounds. Your goal is points. Talk is free. Promises are not binding unless you buy a contract later. Go."
  *   **Don't:** Explain Parfit, rationality, or the point of the game.
  *   **Novice Trap:** Do not answer hypothetical strategy questions ("Can I lie?"). Just say: "You can say whatever you want."

  ### 0:10–0:30 | Phase 1: The Trust Game (Rounds 1–3)
  *   **Mechanic:** Standard play. No contracts available.
  *   **What happens:**
      *   Round 1: Drivers will likely pick people up based on pitches. Type Bs will Stiff. Drivers lose points.
      *   Round 2: Drivers become suspicious. They start Driving On. Type As (Keepers) get left behind because they look like Type Bs.
      *   Round 3: Market collapse. Few rides happen.
  *   **Facilitator Note:** Walk around. Listen to the Type Bs bragging about their points. Listen to the Type As getting frustrated that their honesty isn't believed. **Write these quotes on the board.**

  ### 0:30–0:50 | Phase 2: The Commitment Market (Rounds 4–6)
  *   **Mechanic:** Introduce the "Binding Contract." Hitchhikers can pay 5 DP upfront to buy it.
  *   **What happens:**
      *   Type Bs (Rational) realize they can't get rides anymore. They buy the Contract. They lose 5 DP, but now Drivers trust them because *you* (the Instructor) enforce the payment.
      *   Type As (Keepers) might also buy it to signal their type, or realize they don't need it (but Drivers might not know that).
      *   Rides resume.
  *   **Facilitator Note:** Highlight the irony. The "Rational" students are now paying for the privilege of being forced to do what the "Irrational" students did for free in Round 1.

  ### 0:50–1:15 | The Debrief (The most important part)
  *   **Step 1: The Reveal.** Ask Type Bs to raise hands. Ask Drivers who lost points in Round 1 to raise hands. Connect the two.
  *   **Step 2: Map the Theory.**
      *   *The "Stiffing" Moment:* Ask a Type B, "In Round 1, once you were in the car, why didn't you pay?" They will say, "It cost me points." **Write on board: Act Rationality.** (At the moment of action, paying is dominated).
      *   *The "Left Behind" Moment:* Ask a Type B, "Why didn't you get a ride in Round 3?" They will say, "They knew I wouldn't pay." **Write on board: Disposition Rationality.** (Having the character of a non-payer makes you worse off overall).
      *   *The Contract:* "Why did you buy the contract?" "To make myself trustworthy." **Write on board: Commitment.** (Restricting your future freedom creates present value).
  *   **Step 3: The Hard Question.**
      *   *Student:* "But in the game, my character was dealt by a card. In real life, can I just decide to be a Type A?"
      *   *You:* "Exactly. In the game, disposition is luck. In life, Parfit argues disposition is *cultivation*. It is hard to become a Type A. It requires training yourself to feel that 'moral cost' even when it hurts. But if you succeed, you get the rides without buying the contract. The 'Rational' people in the game had to pay 5 points to simulate what the 'Irrational' people had naturally."
  *   **Step 4: Context.** (See Section 5 below).

  ---

  ## 4. The Payoff Slide (Put this on the projector)

  | **Actor** | **Action** | **Condition** | **Point Change** |
  | :--- | :--- | :--- | :--- |
  | **Driver** | Drive On | Any | **0** |
  | **Driver** | Pick Up | Hitchhiker Stiffs | **-5** (Gas wasted) |
  | **Driver** | Pick Up | Hitchhiker Pays | **+15** (Gas + Reward) |
  | | | | |
  | **Hitchhiker** | Left Behind | Any | **0** |
  | **Hitchhiker** | Gets Ride | Stiffs | **+50** (Free ride) |
  | **Hitchhiker** | Gets Ride | Pays | **+35** (Ride - Payment) |
  | **Hitchhiker** | Gets Ride | **Type A Stiffs** | **+30** (50 - 20 "Guilt Penalty") |
  | | | | |
  | **Commitment** | Buy Contract | Upfront Cost | **-5** (Applies before ride) |

  **Key for Students:**
  *   *If you are in the car, Stiffing (+50) beats Paying (+35).*
  *   *If you are a Driver, Picking Up is only safe if they Pay.*
  *   *Type A (Keeper):* You automatically lose 20 points if you Stiff. (So you will Pay).
  *   *Type B (Rational):* No guilt penalty. (So you will Stiff).

  ---

  ## 5. Philosophical Context (For your back pocket)
  *If a student asks: "Wait, so is being rational bad?"*

  **The Short Answer:**
  "It depends on what you mean by rational. If 'rational' means 'maximizing points in this specific second,' then yes, being rational gets you left in the desert. This is the debate between **Act Rationality** (maximize every move) vs. **Disposition Rationality** (maximize your life outcomes by having a specific character)."

  **The Names (if they want to read more):**
  *   **Derek Parfit:** *Reasons and Persons* (The Hitchhiker example).
  *   **David Gauthier:** *Morals by Agreement* (Argues we should be 'Constrained Maximizers').
  *   **Edward McClennen:** *Rationality and Dynamic Choice* (Argues true rationality allows you to stick to plans).
  *   **The Takeaway:** Standard Game Theory says defecting is rational. This literature asks if Game Theory's definition of rationality is too narrow for social life.

  ---

  ## 6. What Will Go Wrong (And How to Fix It)

  **1. The "Joker" Defector**
  *   **Problem:** One Type B student laughs loudly about stiffing everyone and tries to convince others to do it.
  *   **Fix:** Don't shut them down. Use them. "Excellent. You are perfectly Act-Rational. Write your score on the board. We will see if you have any friends in Round 3." Let the game punish them.

  **2. Rules Disputes / Collusion**
  *   **Problem:** "I told him I'd pay but I didn't have to!" or "We agreed to split points!"
  *   **Fix:** Pre-empt this. "No side payments. No trading points after the game. If the sheet says you Stiffed, you Stiffed." If they collude to game the scoring, disqualify their team from the candy prize.

  **3. You Fumbling the Explanation**
  *   **Problem:** You talk for 15 minutes explaining the table and they zone out.
  *   **Fix:** **Do not explain the table.** Put it on the slide. Say: "Read this. You have 2 minutes. If you break the rules, you get 0 points for the round. Go." Let them learn the rules by playing. Correct errors after Round 1.

  **4. Time Creep**
  *   **Problem:** The Pitch phase takes too long.
  *   **Fix:** Be a harsh referee. Use your phone timer. "30 seconds. Talking stops now. Drivers, make your choice." Silence the room if needed.

  **5. The "Unfair Card" Complaint**
  *   **Problem:** Type A students complain it's unfair they *have* to pay.
  *   **Fix:** This is the teaching moment. "Is it unfair that some people have a temper they can't control? Or a conscience they can't ignore? That's the point of the 'Disposition.' Sometimes our character constrains us."

  **6. The "Commitment" Confusion**
  *   **Problem:** Students think buying the contract is just a promise.
  *   **Fix:** Be clear: "If you buy this slip, I (the Instructor) take the payment from you automatically. You do not get to choose. You are tying your own hands."

  ## 7. A Note for You (The Instructor)
  You mentioned feeling the cost of your promise to your colleague. That feeling—the sunk cost of being a person who keeps promises—is exactly what the Type A students will feel in Round 1.

  When you debrief, you can share that briefly. "I felt this last month when I had to grade instead of enjoying a weekend. Past me made a commitment Present me had to honor. It cost me. But if I hadn't honored it, I wouldn't be the kind of colleague people trust."

  That vulnerability will land harder than any lecture on constrained maximization. Good luck. You've got this.
