answer: |-
  You have independently rediscovered a genuine, active debate in contemporary moral philosophy called **The Problem of Moral Deference** (or Moral Testimony). Philosophers argue about exactly what you are arguing about: *Is it virtuous to think for yourself, or is it virtuous to get the right answer however you can?*

  Your intuitions are actually quite sophisticated. You are sensing a distinction that many ethicists try to capture with a specific principle. You don't need to give up your verdicts (mostly), but you do need a framework to explain *why* they differ.

  Here is the principle that saves your verdicts, followed by the one case you might need to reconsider, and the verdict on the "Ethics Advisor."

  ### The Principle: Non-Delegable Duties vs. Epistemic Reliance

  The unifying principle is this: **You may outsource information and emotional support, but you may not outsource judgment when the act of judging is the core function of your role or your moral character.**

  We can break your cases down into three categories based on this principle.

  #### 1. The Non-Delegable Duties (Jury, Manager)
  In these cases, the *process* of you thinking it through is just as important as the *outcome*.
  *   **The Jury:** The point of a jury trial is not just to get a "correct" verdict; it is to have a jury of *peers* apply *their* conscience to the evidence. If you don't process the evidence yourself, you are functionally absent from the room. You are violating a civic contract that requires *your* agency.
  *   **The Manager (Dark Patterns):** As a software engineer, you are a moral agent within the system. If you ship harmful code, *you* are complicit, not just your manager. Professional ethics require you to be a "gatekeeper," not a pass-through. Deferring to authority here is an abdication of professional responsibility.

  **Why they feel wrong:** In both cases, your judgment is the *safeguard*. Removing your judgment removes the safety mechanism.

  #### 2. The Epistemic & Relational Support (Charity, Ventilator, Text)
  In these cases, you are not abdicating judgment; you are gathering data or support to *enable* a decision.
  *   **Charity Rater:** This is mostly factual/empirical deference. "Is this charity effective?" is a data question, not a pure moral one. Relying on data is responsible.
  *   **The Ventilator:** This is the hardest case, but your intuition holds if we view it as a **Crisis Exception**. In high-grief medical situations, families are often emotionally incapacitated. Relying on an ethics committee is less about "they know better what is right" and more about "I trust this institution to carry the burden of this procedure." You are deferring to *expertise* and *process*, not necessarily abandoning your values.
  *   **The 11pm Text:** You are exhausted. Moral reasoning requires cognitive load. Asking your sister is a way of regulating your capacity to ensure the *right thing gets done*. You aren't letting her decide your values; you are using her as a sounding board to execute a value you already hold (honesty).

  **Why they feel okay:** You are using others to *support* your agency, not *replace* it.

  #### 3. The Engagement Gap (Defense Contractor: Ask vs. Assume)
  You noted that asking your friend feels fine, but assuming her answer feels "a little worse." This is a crucial insight.
  *   **Asking:** This is **Consultation.** You are engaging with the moral problem. You are signaling that you care enough to check.
  *   **Assuming:** This is **Negligence.** It's like skipping a code review because you "know" the build will pass. It signals moral sleepwalking. The act of asking forces you to pause and acknowledge the weight of the decision.

  ### The Verdict on the "Personal Ethics Advisor"

  You asked about hiring a wise, incorruptible advisor to route all hard calls through. You called it "grotesque," and your intuition is correct. Here is why the principle rejects it:

  **Morality is a practice, not a compliance task.**

  If you outsource all moral reasoning, you are treating ethics like a tax filing: something to be handled correctly so you don't get in trouble. But moral character is built through the *act* of struggling with difficult choices.
  *   **Atrophy:** If you never exercise your moral muscle, it atrophies. When the Advisor is unavailable (or wrong), you will be helpless.
  *   **Alienation:** You become disconnected from your own actions. You are no longer the author of your life; you are just the hands that execute the Advisor's directives.
  *   **The "Right Reasons" Problem:** Philosophers argue that to be truly virtuous, you must do the right thing *for the right reasons*. If you do the right thing only because the Advisor said so, you lack moral understanding. You are a well-behaved child, not a moral adult.

  ### The One Case You Might Have to Give Up

  If you want a perfectly consistent philosophical system, the **Ventilator** case is the weak link.

  Many philosophers (like Sarah McGrath or Allison Hills) would argue that deferring to the ethics committee without forming *any* independent view is actually problematic. While the *medical* facts should be deferred to experts, the *value judgment* (is life worth sustaining in this state?) is fundamentally yours.
  *   **The Pushback:** If you accept the Ventilator case as "Fine," you have to explain why it's different from the Jury case. Both involve life/liberty.
  *   **The Defense:** The only way to save it is to emphasize **Crisis Capacity.** In a jury, you are expected to be calm and rational. In a hospital with a dying uncle, you are grieving. The "Non-Delegable Duty" is temporarily lifted because your capacity is impaired. If you accept that exception, your system holds.

  ### Summary for Your Brother-in-Law

  Here is the principle you can take to the next dinner:

  > **"It is okay to rely on others for information, expertise, and emotional support when my capacity is limited. It is not okay to rely on others when the exercise of my own judgment is the specific duty of my role (juror, professional) or necessary for my own moral growth."**

  *   **Jury/Manager:** Your judgment is the job. (Don't outsource).
  *   **Ventilator/Text:** Your capacity is impaired or the stakes are relational. (Outsourcing support is okay).
  *   **Advisor:** Outsourcing growth is dehumanizing. (Don't outsource).

  You don't need a philosophy degree to have good instincts; you just had to trust that the difference between **consulting a map** and **letting someone else drive** matters.
