answer: |-
  Your worry is both astute and familiar, touching upon a structural parallel that has generated significant discussion in metaethics and epistemology. It is entirely reasonable to look at the demon case in the fitting-attitude literature and see a mirror image of the pragmatist challenge to evidentialism. In both scenarios, an agent faces a threat that provides a compelling normative reason to adopt a specific mental state, seemingly independent of the standard correctness conditions for that state. However, the conclusion that this parallel forces you to abandon evidentialism relies on a conflation of two distinct senses of reason and justification. To see why your advisor insists this is a different problem, and how you can maintain evidentialism while solving the wrong kind of reasons problem, we must distinguish between reasons that bear on the correctness of an attitude and reasons that bear on the desirability of holding it.

  The core of the solution lies in distinguishing between object-given reasons and state-given reasons, or alternatively, between constitutive norms and external norms. In the fitting-attitude analysis of value, the claim is typically that an object is valuable if and only if it is fitting to have a pro-attitude toward it. The wrong kind of reasons problem arises because there are reasons to have the attitude, such as the demon's threat, that do not make the attitude fitting. The standard solution in the literature is not to deny that the demon provides a reason to admire her, but to argue that this reason is of the wrong kind to constitute value. The demon's threat provides a state-given reason, which is a reason to want to be in the state of admiration or to bring it about that you admire, but it is not an object-given reason. Object-given reasons cite properties of the object of the attitude that make the attitude appropriate. In the case of admiration, these would be properties like moral virtue or excellence. The demon's threat cites a property of the situation surrounding the attitude, not a property of the demon that makes her admirable. Therefore, the fitting-attitude analyst can concede that you have a reason to admire the demon without conceding that the demon is admirable. The analysis of value is rescued by restricting the biconditional to reasons of the right kind, those that speak to the fittingness of the attitude rather than merely the utility of holding it.

  This same distinction allows you to preserve evidentialism about belief against the pragmatist challenge. Evidentialism is the thesis that epistemic justification for belief is determined solely by evidence. When a pragmatist presents a demon case where you are threatened unless you believe a proposition, they are correctly identifying that you have a pragmatic reason to believe. However, the evidentialist can respond by arguing that this pragmatic reason is a state-given reason. It is a reason to want to believe, or to act in ways that might cultivate belief, but it is not a reason that makes the belief true or justified in the epistemic sense. Belief, by its very nature, is a truth-aiming state. Its constitutive norm is truth. Evidence is the kind of consideration that indicates truth. Pragmatic considerations, such as avoiding torture, do not indicate truth. Therefore, while the demon gives you a reason to bring it about that you believe, the demon does not give you an epistemic reason to believe. If you define justification narrowly as epistemic justification, then evidentialism remains intact because pragmatic reasons simply do not fall into the category of considerations that confer epistemic justification. They confer practical justification for managing your doxastic states, but not for the states themselves qua beliefs.

  The reason your advisor notes this is a different problem is that the theoretical stakes and goals differ between the two debates, even if the cases look structurally identical. In the fitting-attitude literature, the wrong kind of reasons problem is a problem for an analysis of a property, specifically final value. The goal is to define what it is for something to be good in terms of attitudes. If the analysis includes wrong kind of reasons, it yields counterintuitive results about value, such as the demon being admirable. The solution is to refine the analysis to exclude those reasons. In the epistemological debate, the goal is often to characterize the norms governing belief. The pragmatist argues that all reasons for belief count toward justification, while the evidentialist argues that only truth-conducive reasons count. Accepting the solution to the wrong kind of reasons problem does not force you to side with the pragmatist because the solution itself relies on the very distinction the evidentialist needs. By acknowledging that demon threats provide reasons of the wrong kind for value analysis, you are implicitly acknowledging that there are reasons for attitudes that do not track the standard of correctness for those attitudes. If you apply this to belief, you acknowledge that demon threats provide reasons for belief that do not track truth. The evidentialist simply insists that reasons that do not track truth are not epistemic reasons. Thus, the solution to the wrong kind of reasons problem actually supports the evidentialist's distinction between pragmatic and epistemic norms rather than undermining it.

  Furthermore, there is a nuanced difference in how the attitudes function in these contexts that supports the separation. In the fitting-attitude analysis, the attitude is often used as a placeholder for a response to value. The worry is that if any reason to respond counts, value becomes too easy to come by. In epistemology, belief is often treated as a state that is involuntary or transparent to the world. You cannot simply believe at will because the threat demands it. This psychological fact supports the evidentialist intuition that belief is governed by a norm you cannot violate without ceasing to believe. When the demon threatens you, you might try to manipulate yourself into belief, but the reason provided by the threat does not make the resulting belief correct. It makes the manipulation rational. In the value case, admiration might be more susceptible to voluntary control, or at least the analysis is concerned with the normative status of the object regardless of psychological constraints. However, in both cases, the normative status of the object or proposition depends on reasons that bear on the content, not the consequences of the state.

  To incorporate this into your dissertation, you should frame the distinction as one between the normativity of the attitude's correctness and the normativity of the agent's management of the attitude. The wrong kind of reasons problem demonstrates that not all reasons to have an attitude are reasons that make the attitude correct. This is a discovery about the structure of normative reasons relative to attitudes. It does not entail that all reasons to have an attitude are equally relevant to every normative question we ask about that attitude. When we ask if an object is valuable, we are asking if it merits the attitude. When we ask if a belief is justified in the epistemic sense, we are asking if it is supported by truth-indicators. The demon case shows that we can have reasons to have an attitude that do not merit it or indicate its truth. Recognizing this allows you to solve the wrong kind of reasons problem by restricting the analysis of value to fittingness reasons, while simultaneously maintaining evidentialism by restricting epistemic justification to evidence. The demon gives you a reason to admire, but not a reason that makes admiration fitting. The demon gives you a reason to believe, but not a reason that makes the belief epistemically justified.

  Ultimately, the worry dissolves when you recognize that the existence of pragmatic reasons for belief does not falsify evidentialism unless evidentialism is construed as the claim that there are no pragmatic reasons for belief whatsoever. Most sophisticated evidentialists concede that pragmatic reasons exist but deny they are epistemic reasons. Similarly, the fitting-attitude analyst concedes that wrong kind of reasons exist but denies they constitute value. The parallel is indeed strong, but it cuts in favor of your position rather than against it. The machinery required to solve the wrong kind of reasons problem, specifically the distinction between reasons that make an attitude fitting and reasons that merely make it beneficial, is the same machinery required to defend evidentialism against pragmatism. Your advisor's comment likely points to the fact that the wrong kind of reasons problem is a specific obstacle for a specific definition of value, whereas the evidentialism debate is a broader conflict about the taxonomy of reasons. You can clear the obstacle for your definition of value without settling the broader debate, because clearing the obstacle requires drawing a distinction that protects evidentialism. By carefully articulating this distinction between constitutive norms and external incentives, you can show that the wrong kind of reasons problem is not a discovery that pragmatism is true, but rather a discovery that normative reasons are heterogeneous, and that different normative projects, such as analyzing value or defining epistemic justification, rely on different subsets of those reasons.
