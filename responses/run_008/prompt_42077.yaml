answer: |-
  # The 10-Minute Uncertain Update Protocol

  **Purpose:** To update risk probabilities when incoming reports are not verified facts.
  **Tool:** Single-tab Spreadsheet.
  **Math:** Weighted Average (Jeffrey Conditioning).
  **Formula:** `New Probability = (Report Confidence × Prob If True) + ((1 - Report Confidence) × Prob If False)`

  ---

  ## Part 1: The Procedure

  Execute these steps in order. Do not skip Step 2.

  ### Step 1: Lock the Baseline
  *   **Action:** Record the current probability estimate for the event *before* reading the new report.
  *   **Input:** `P_Current` (0 to 100).
  *   **Sufficient Answer:** The number currently published to the client.
  *   **Stop Condition:** If `P_Current` is 0% or 100%, stop. You cannot update a certainty with uncertain evidence. Hand off to **Desk Lead**.

  ### Step 2: Score Report Reliability
  *   **Action:** Estimate the probability that this specific report is accurate, ignoring the content's impact.
  *   **Input:** `Confidence` (0 to 100).
  *   **Sufficient Answer:** A percentage based on source tier (e.g., Tier 1 Wire = 80%, Single Telegram Channel = 30%).
  *   **Stop Condition:** If `Confidence` < 25%, **Do Not Move The Number.** Log the report as "Noise."
  *   **Hand-off:** If the report's existence depends on the event happening (e.g., "We only hear about coups if they succeed"), stop. Hand off to **Desk Lead**. (See Case 3).

  ### Step 3: Define the "If True" Scenario
  *   **Action:** If this report is 100% accurate, what is the probability of the risk event?
  *   **Input:** `P_True` (0 to 100).
  *   **Sufficient Answer:** Usually 100% for binary events (e.g., "President Hospitalized"). For timing events (e.g., "Sanctions Friday"), it is the probability sanctions happen *on Friday*.
  *   **Constraint:** Must be ≥ `P_Current`.

  ### Step 4: Define the "If False" Scenario
  *   **Action:** If this report is 100% inaccurate (rumor/error), what is the probability of the risk event?
  *   **Input:** `P_False` (0 to 100).
  *   **Sufficient Answer:** The background risk level absent this specific report.
  *   **Constraint:** Must be ≤ `P_Current`.
  *   **Critical Check:** If you set this to 0%, you are treating the report as binary fact. You must justify why risk vanishes completely if the report is wrong.

  ### Step 5: Compute
  *   **Action:** Run the formula in the spreadsheet.
  *   **Calculation:** `(Confidence% × P_True) + ((100 - Confidence%) × P_False)`
  *   **Output:** `P_New`

  ### Step 6: Threshold Check
  *   **Action:** Compare `P_New` to `P_Current`.
  *   **Rule:** If the change is < 5 percentage points, **Do Not Move The Number.** Report noise exceeds signal.
  *   **Hand-off:** If the change is > 20 percentage points, Hand off to **Desk Lead** for approval before publishing.

  ---

  ## Part 2: Test Cases

  ### Case 1: Head of State Hospitalized
  *   **Context:** Single Tier-1 wire service reports the President is in intensive care.
  *   **Inputs:**
      *   `P_Current`: 10% (Baseline health risk).
      *   `Confidence`: 85% (Tier-1 source, but unconfirmed by palace).
      *   `P_True`: 100% (If report is true, he is hospitalized).
      *   `P_False`: 10% (If report is false, we are back to baseline health risk).
  *   **Calculation:** $(0.85 \times 100) + (0.15 \times 10) = 85 + 1.5 = 86.5\%$
  *   **Result:** Update to 87%.
  *   **Verdict:** **Move the number.** High confidence drives the estimate near the "If True" state without requiring 100% verification.

  ### Case 2: Sanctions Announcement (The Unwanted Answer)
  *   **Context:** Wire story cites two anonymous officials saying sanctions drop Friday. Market is already nervous.
  *   **Inputs:**
      *   `P_Current`: 60% (Market pricing implies high risk).
      *   `Confidence`: 40% (Anonymous officials, no document leak).
      *   `P_True`: 100% (If true, sanctions Friday).
      *   `P_False`: 50% (If this specific leak is wrong, negotiations are still ongoing, risk remains high just not Friday).
  *   **Calculation:** $(0.40 \times 100) + (0.60 \times 50) = 40 + 30 = 70\%$
  *   **Result:** Update to 70%.
  *   **Why You Won't Like It:** Your analysts feel pressure to jump to 90% on "breaking news," or conversely, you might feel 70% is too high for anonymous rumors. However, the procedure prevents the jump to 90% because `Confidence` is low. It forces a modest grind rather than a spike. It denies the analysts the drama of a massive swing, which may feel like under-performance to a client wanting "alertness."

  ### Case 3: Selection Bias (The Hand-off)
  *   **Context:** No news for 48 hours regarding a potential coup. Analysts know "Bad news leaks faster than good news."
  *   **Inputs:**
      *   `P_Current`: 30%.
      *   `Confidence`: N/A (This is a report *absence*).
      *   **Problem:** The reliability of "silence" depends on the Hypothesis (Coup). If a Coup is happening, silence is unlikely (leaks occur). If no Coup, silence is likely.
  *   **Procedure Trigger:** Step 2 Hand-off.
  *   **Reason:** You cannot assign a static `Confidence` to silence. The evidence arrival rate is correlated with the truth.
  *   **Action:** **Desk Lead** must model the leak rate explicitly. Do not use the spreadsheet.

  ---

  ## Part 3: Limitations & Mechanics

  ### 1. Order of Reports
  **Does order matter?** Yes.
  If Report A arrives (40% confidence) and then Report B arrives (60% confidence), updating sequentially using this spreadsheet will yield a different result than if B arrived before A. This is a known property of probability kinematics on uncertain evidence.
  **Implication:** You cannot chain updates. If two reports arrive within the same cycle, you must **recompute from scratch** (Step 1) using a combined `Confidence` score for the aggregate evidence, rather than updating the output of Report A with the input of Report B.
  **Frequency:** Recompute from `P_Current` (the last published number) every time. Do not use the intermediate spreadsheet output as a new baseline until published.

  ### 2. What This Procedure Cannot Do
  *   **It cannot correct for systemic bias.** If all your sources are optimistic, `Confidence` will be consistently miscalibrated.
  *   **It cannot handle dependent evidence.** If Report B is just a rehash of Report A, the procedure treats them as independent unless you manually lower `Confidence` on B.
  *   **It cannot replace judgment on "If False."** The math is only as good as the `P_False` estimate.

  ---

  ## Part 4: Confidence Assessment

  | Component | Confidence Level | Notes |
  | :--- | :--- | :--- |
  | **The Math (Formula)** | **High** | Jeffrey Conditioning is epistemologically sound for uncertain evidence. |
  | **Step 2 (Reliability)** | **Medium** | Analysts can usually grade sources, but stress inflates confidence. |
  | **Step 4 (If False)** | **Low** | **This is the weakest link.** Analysts struggle to imagine the world where the report is false but the risk remains. They default to 0%. |
  | **Step 6 (Thresholds)** | **Medium** | The 5% and 20% cutoffs are arbitrary but necessary to prevent noise. |

  ### Least Trusted Step in a Live Situation
  **Step 4: Define the "If False" Scenario.**
  In a crisis, analysts suffer from "binary collapse." They assume if the report is wrong, the event isn't happening. They will input 0% for `P_False`. This turns the kinematics formula back into standard conditioning, defeating the purpose of the procedure.
  **Mitigation:** The spreadsheet should flag any `P_False` entry of 0% with a warning: *"Are you certain risk vanishes if this report is wrong?"*

  ### Final Note on Recomputation
  Because order matters in uncertain updating, you must treat the spreadsheet as a **scratchpad**, not a ledger. Every new report requires pulling the last *published* number (`P_Current`) and re-running the logic. Do not save the intermediate `P_New` as the baseline for the next incoming report unless 24 hours have passed or a formal review has occurred.
