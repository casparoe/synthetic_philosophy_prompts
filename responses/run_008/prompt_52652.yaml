answer: |-
  **Seminar Discussion Piece: The Limits of Lewis's Argument from Temporary Intrinsics**

  **To:** Graduate Seminar in Metaphysics
  **From:** [Professor's Name]
  **Subject:** Stress-testing the Inference from Temporary Intrinsics to Perdurantism

  ### I. Brainstorm: The Endurantist's Toolkit

  Before dissecting the inference, let us briefly catalogue the available manoeuvres open to the endurantist when confronted with the contradiction of having contrary properties at different times. We are not merely listing these to survey the landscape, but to identify where the logical pressure points lie.

  *   **Relationalism (Indexicalism):** The proposition 'Object $o$ is bent' is incomplete. The true proposition is 'Object $o$ is bent-at-$t_1$'. Properties are relations between objects and times. Contradiction is avoided because 'bent-at-$t_1$' and 'straight-at-$t_2$' are compatible relations.
  *   **Adverbialism (Copula Modification):** The property itself is not modified; rather, the *having* of the property is modified. $o$ has the property of bentness *at-$t_1$-ly*. The instantiation relation itself is temporally qualified.
  *   **Presentism (Tense Primitivism):** Only present objects and properties exist. ' $o$ was bent' is made true not by a past object having a property, but by a present tensed fact. There is no single ontological locus where contrary properties coexist.
  *   **Substantival Haecceity Modification:** The object possesses a time-indexed essence or haecceity that grounds the variation without committing to parts.

  The crucial observation for our purposes is that each of these strategies shares a common structural feature: they all reject the premise that properties are instantiated *simpliciter* by wholly present objects. They enrich the ideology of instantiation to preserve the ontology of the object.

  ### II. Argument: Ideological Enrichment vs. Ontological Revision

  David Lewis's Argument from Temporary Intrinsics (ATI) is often presented in the literature as a straightforward *reductio* of endurantism. The student's insistence last week that the argument settles the debate in favour of perdurantism relies on a subtle but critical equivocation. Lewis successfully demonstrates that *naive* endurantism—the view that objects are wholly present and instantiate monadic properties simpliciter—is untenable. However, the inference from "naive endurantism is false" to "perdurantism is true" (or even "endurantism simpliciter is false") is invalid. My contention is that the ATI is best understood as **inconclusive** rather than unsound. It reveals a trade-off between ontological and ideological parsimony, not a logical contradiction inherent to endurance itself.

  **1. The Contested Premise of Simpliciter Instantiation**
  Lewis's argument turns on the claim that shape properties are intrinsic and therefore cannot be analysed as relations to times. He argues that if 'bent' is really 'bent-at-$t$', then being bent is no more intrinsic than being married. This premise is the fulcrum of the debate. The endurantist is entitled to reject the dichotomy Lewis presents. One can maintain that 'bent-at-$t$' is an intrinsic property of the object *at that time*, even if the property conceptually involves a time. The relationalist argues that Lewis conflates the *logical form* of the property with its *metaphysical status*. By admitting times into the instantiation relation (either as relata or as modifiers), the endurantist dissolves the contradiction without slicing the object into temporal parts. Lewis claims this saves the object at the cost of the properties; the endurantist replies that it saves the phenomena of change at the cost of ideological complexity.

  **2. The Trade-off: Ontology vs. Ideology**
  The core of my argument is that Lewis's preference for perdurantism is methodological, not logical. Perdurantism avoids the contradiction by multiplying entities (temporal parts). Sophisticated endurantism avoids it by multiplying modes of instantiation (temporal modifiers). Lewis famously prioritises ontological parsimony over ideological parsimony. He is willing to accept a bloated ontology of parts to keep the logic of instantiation simple (monadic predication).

  However, to claim this establishes perdurantism is to beg the question against the endurantist who values ontological unity over logical simplicity. If the endurantist argues that positing temporal parts violates the unity of consciousness or material continuity, she is raising a cost against perdurantism that balances the ideological cost she incurs. The ATI shows that endurantism requires a more complex ideology of instantiation than Lewis prefers. It does not show that such an ideology is incoherent or impossible. Therefore, the argument fails to establish perdurantism as the *only* viable option; it merely establishes it as the option that best suits Lewis's specific methodological weighting of parsimony.

  **3. The Inference Gap**
  Where, precisely, does the student's inference break down? It breaks down at the move from "The endurantist needs extra apparatus" to "The endurantist is wrong." Consider the analogue in physics: Newtonian mechanics requires the postulation of absolute space to make sense of inertia. When Relativity arrived, it showed Newton's ontology was problematic, but it did not prove that one could not construct a neo-Lorentzian theory that saved the phenomena by adding complex ad hoc constraints (though such a theory would be less elegant). Similarly, the ATI shows that naive endurantism is false. But sophisticated endurantism (relationalist or adverbialist) is a coherent alternative framework. It is empirically and logically equivalent to perdurantism regarding the distribution of properties in spacetime.

  To claim the ATI refutes endurantism *tout court* is to assume that the simplest ideology (monadic instantiation) is a constraint on truth. But metaphysical truth is not solely determined by logical simplicity. If one holds that objects are fundamentally unified substances, the ideological cost of temporal modifiers is a price worth paying. Lewis provides no independent argument that temporal parts are *necessary*, only that they are *sufficient* to solve the problem. Since the endurantist solutions are also sufficient, the argument remains inconclusive regarding the true nature of persistence.

  **4. Why Inconclusive Rather Than Unsound?**
  I defend the claim that the argument is **inconclusive** rather than unsound. To call it unsound would be to assert that Lewis's premise (that intrinsic properties cannot be relations to times) is definitely false. But this is itself a substantive metaphysical claim that is debatable. Lewis offers compelling intuitions about intrinsics. It is better to say that the argument is valid, but its soundness depends on a methodological premise (that ontological parsimony trumps ideological parsimony) which is not universally shared. Thus, the argument compels only those who already accept Lewis's methodological naturalism. For the rest, it leaves the debate open.

  ### III. Conclusion and Limitations

  **Conclusion**
  The Argument from Temporary Intrinsics succeeds in demolishing the naive view that objects endure and instantiate monadic properties simpliciter. However, it fails to establish perdurantism as the necessary conclusion. Once the endurantist enriches her ideology—admitting time-indexed properties or adverbial instantiation—the contradiction vanishes. The choice between perdurantism and sophisticated endurantism thus reduces to a methodological preference between ontological proliferation (parts) and ideological complexity (modified instantiation). Consequently, the ATI is inconclusive as a general refutation of endurance; it demonstrates a cost, not a impossibility.

  **Limitations**
  Two limitations of this defence must be acknowledged. First, this position concedes that endurantism cannot be had "on the cheap." The seminar must accept that any viable endurantism will be theoretically heavier than its naive counterpart. Second, this defence does not prove endurantism *true*; it merely shields it from this specific attack. Other arguments (e.g., from mereological essentialism or the nature of causation) may still favour perdurantism. We have shown only that the door to endurance remains open, not that it is the only exit.

  ***

  *Please come prepared to discuss whether the ideological cost of adverbialism is genuinely comparable to the ontological cost of temporal parts, and whether Lewis's intuition about intrinsics carries enough weight to force the methodological choice.*
