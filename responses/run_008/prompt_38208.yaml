      *   Based on the implicit rule (MEV + Complementarity):
          *   MEV is negative ("worth somewhat less than it costs").
          *   Complementarity? The prompt says "repurposed for a different measurement." This suggests the hardware isn't useless. Unlike the seismic data (where interruption destroys the *record*), stopping this experiment allows *repurposing*. The $250M sunk isn't totally wasted, just pivoted.
