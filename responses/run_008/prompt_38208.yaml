              *   *Better Tie-Breaker:* **The "Orphaned Infrastructure" Case.**
              *   Scenario: A facility is 50% built. It has no scientific value unless completed (unlike Seismic where partial data had some value but continuity was key). If stopped, the steel is scrap ($0). If completed, it produces science worth $X. Cost to complete is $Y.
