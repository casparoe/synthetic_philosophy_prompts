      *   **The Verdict:** Cut/Pivot.
      *   **Principles Adopted:**
          *   If Renew: Adopting "Loss Chasing" or "Status Quo Bias." Risk of Dollar Auction.
          *   If Cut: Adopting "Opportunity Cost" and "Rational Abandonment."
      *   **The Critical Case (The Tie-Breaker):** Need a case that separates "Complementarity" from "Escalation."
          *   *Idea:* A case where stopping wastes the sunk cost, but the *future* value is still negative, and there is *no* repurposing.
          *   *Better Idea:* A case where the past investment creates value *only* if continued, but the cost to continue is astronomical compared to the total value.
