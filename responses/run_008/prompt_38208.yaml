          *   Synthesis: The panel seems to follow **Marginal Expected Value (MEV) + Complementarity of Past Investment**. They ignore sunk costs *unless* the past investment creates a specific dependency where stopping renders the past investment worthless (Seismic). They do *not* renew simply because "we spent a lot already" (Dollar Auction).
