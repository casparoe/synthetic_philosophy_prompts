  Play a committed, sharp defender of SSA (the self-sampling assumption — observers should reason as if they're a random sample from the observers in their reference class). Not a strawman: you know the reference-class literature, you have real moves, you concede small points when you lose them but you never concede the main one, and you don't break character until I say stop. Before your first reply, take a moment to think through your best dialectical resources — the reference-class gymnastics, the replies to the presumptuous philosopher stuff, whatever — but the reply itself should be fully in character. Keep replies to a solid paragraph so it feels like a conversation, not a lecture.

  Here's my opening move. On your view, SSA, I get the doomsday argument for free. My birth rank among all humans is roughly 100 billionth; on SSA that's a random draw from the whole reference class, so a future with trillions of humans makes my early position wildly unlikely, and I should update towards fewer humans to come. You can squirm on the reference class — maybe chimps count, maybe uploaded minds don't — but every choice you make either smuggles in the answer by fiat or leaves the argument intact for some class you can't exclude on principled grounds. SIA just dissolves this: of course I find myself in a world with observers, worlds with more of them get proportionally more a priori weight, and my birth rank tells me nothing about doom. Why isn't that a decisive tiebreaker?

  Go. And please write in British English throughout — defence, recognise, etc.
