      *   *My Take:* The luck regress *does* sink ultimate moral responsibility (metaphysical free will), but it doesn't sink *practical* desert in a social context. We need to distinguish between *Ultimate Responsibility* (God's eye view) and *Attributable Agency* (Human eye view).
      *   *Which bases survive?* "Effort" is shaky if you dig deep enough. "Character/Disposition" is also shaky. The most robust basis for a *corporate* context is **Reliable Agency**. It's not about whether they *could have been otherwise* in a metaphysical sense, but whether their internal decision-making process is a reliable predictor of future behavior.
      *   *Application:* You can't measure "fair conditions." You measure *patterns of agency*. Maya shows a pattern of high agency. Daniel shows a pattern of opportunism.
      *   *Verdict:* The luck regress sinks *moral* desert, but not *functional* desert. We reward traits that we want to incentivize, regardless of their origin.

  3.  **Deconstruct Question 2: Maya's Case (Effort vs. Outcome):**
      *   *The Distinction:* Did she produce something desert-worthy, or just act in a desert-worthy way?
      *   *My Take:* In a profit-seeking organization, "desert" is tied to *value creation*, but value creation is a probability game. Maya played the odds well; Daniel got lucky on the outcome.
      *   *The "Empty Results" Problem:* If you reward only shipped outcomes, you incentivize risk-aversion or luck-chasing. If you reward only effort, you incentivize busywork.
      *   *The Distinction's Weight:* It carries weight because **process reliability** is a leading indicator of future value. Maya's "acting in a desert-worthy way" *is* the product in a knowledge economy. She built the engine, even if the car didn't cross the finish line. Daniel rode a bus.
      *   *Verdict:* Maya produced *capability* and *trust*, which are assets. Daniel produced a *line on a resume*, which is an asset but less transferable. Maya's effort *is* the value, provided the company recognizes that sustainable high performance > one-off luck.

  4.  **Deconstruct Question 3: Splitting the Difference (Forecast vs. Desert):**
