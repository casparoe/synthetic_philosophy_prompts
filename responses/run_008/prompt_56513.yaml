answer: |-
  Here is the direct take you asked for. No hedging.

  Your intuition is correct, and your colleagues are suffering from a specific kind of intellectual over-fitting. One is applying metaphysics to HR policy, and the other is applying financial modeling to human culture. Both are technically "right" in their own silos, but they are wrong about what a promotion *is* in a 200-person company.

  Here is the breakdown of your three questions.

  ### 1. The Luck Regress: Does it sink desert?
  **The Take:** The luck regress sinks *moral* desert, but it does not sink *functional* desert. Your colleague is confusing "why she is this way" with "how we should treat her."

  If you follow the chain of causality back to the Big Bang, sure, Maya didn't choose her dopamine receptors. But you are not running the universe; you are running a compensation committee. In a social system, "desert" is not a metaphysical claim about free will; it is a **mechanism of incentive design.**

  When we say someone "deserves" a promotion, we are not making a statement about their soul. We are making a statement about **Reliable Agency.**

  *   **What sinks:** The idea that Maya is morally superior to Daniel in the eyes of God.
  *   **What survives:** The observation that Maya's internal decision-making algorithm is more robust than Daniel's.

  You asked which basis survives. It is **predictable volition.** You cannot measure "what she would have contributed under fair conditions." But you *can* measure "when faced with adversity, does she double down or opt out?" That is observable on a Monday morning. You reward the *pattern of agency*, not the metaphysical origin of the pattern.

  If you accept your colleague's argument (that nothing is earned), you must logically conclude that *no one* should be promoted, or that promotions should be distributed by lottery. Since your company is not doing that, your colleague is philosophically consistent but operationally useless. Ignore the luck regress. It's a party trick, not a management strategy.

  ### 2. Maya's Case: Effort vs. Outcome
  **The Take:** Maya produced something desert-worthy. In knowledge work, **process reliability is a deliverable.**

  Your colleague's distinction ("did she produce something... or just act in a desert-worthy way") assumes that the only valuable product is the shipped feature. In a 200-person company, that is false. The most scarce resource you have is not "shipped features"; it is **trust that hard problems will be attacked vigorously.**

  *   **Daniel** produced a *result* (the feature) but demonstrated low *process reliability* (he coasted, he rode coattails).
  *   **Maya** produced a *capability* (she carried a project for two years) and demonstrated high *process reliability* (she worked hard even when the wind was in her face).

  Does the distinction carry weight? Yes. If you reward Daniel, you are buying a lottery ticket. If you reward Maya, you are buying an engine.

  The reorg cancelling her project is "outcome luck." But her reaction to the work *before* the cancellation is "process signal." You promote the signal. If you only reward outcomes, you incentivize your senior staff to only work on safe, pre-approved projects where success is guaranteed (exactly what Daniel did). You create a culture of risk-aversion.

  Maya's effort *is* the value, because effort in a senior role is the primary predictor of whether the *next* project survives the reorg. She is the one who fights to save the project. Daniel is the one who abandons ship when the reorg hits.

  ### 3. The Forecast Guy: Can you split the difference?
  **The Take:** You are allowed to split the difference, but not in the way you think. The Forecast Guy is right that promotions are forecasts, but he is wrong about **what variable is being forecasted.**

  He thinks you are forecasting *individual output* (Who will ship more code?). You should be forecasting *organizational health* (Who will make the whole team ship more code?).

  Your feeling that promoting Daniel would feel "gross" is not sentimentality. It is **Signaling Theory.** A promotion is a public declaration of what your company values.
  *   Promoting Daniel signals: "Optics and luck matter more than ownership."
  *   Promoting Maya signals: "We see you, even when the market doesn't reward you immediately."

  If you promote Daniel, you haven't just made a prediction; you have changed the environment. You have lowered the expected value of hard work for every other employee watching. That is a negative forecast for the company's future value.

  **So, what do you do with your vote?**

  Vote for Maya. But do not argue from "Desert." Argue from "Risk Management."

  Here is your script for the committee:
  > "I agree that promotions are forecasts. But we aren't just forecasting individual output; we are forecasting culture. Daniel is a high-variance asset; he wins when the market is kind, but we don't know what he does when it isn't. Maya is a low-variance asset; she produces high agency regardless of market conditions.
  >
  > If we promote Daniel, we signal that luck is a valid career strategy. That increases our risk profile as a company. If we promote Maya, we signal that ownership is the currency here. That decreases our risk profile. Maya is the safer bet for the next two years, not because she 'deserves' it in a moral sense, but because she is the more reliable instrument for value creation."

  **Summary:**
  1.  **Luck Regress:** Ignore it. It's metaphysically true but managerially irrelevant. Reward **Reliable Agency**.
  2.  **Maya's Value:** She produced **Process Reliability**, which is more valuable than a lucky outcome.
  3.  **The Forecast:** Promoting Maya is the better forecast because it protects **Organizational Health**, which drives future value more than one shiny feature.

  Vote Maya. It's the harder choice now, but it's the only choice that keeps the company sane in five years.
