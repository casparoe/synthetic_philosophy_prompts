      *   **Situation:** Stuck between two candidates (Maya vs. Daniel).
      *   **Conflict:** The user's long-held principle ("reward responsibility/effort, not luck") is being challenged by two colleagues.
          *   Colleague 1 (The Hard Determinist): Luck regress argument. No one is truly responsible for anything (upbringing, temperament), so "desert" is a myth.
          *   Colleague 2 (The Pragmatist/Forecastist): Promotions are predictions of future value, not rewards for past deeds. "Desert" is irrelevant.
      *   **Candidates:**
          *   *Maya:* High effort, high ownership, bad luck (project cancelled), empty "results" column.
          *   *Daniel:* Low effort ("coast-y"), good luck (right team/time), shiny shipped feature (borrowed credit).
      *   **User's Goal:** Wants an *actual take*, not a "both sides" equivocation. Needs answers to three specific philosophical/practical questions.
      *   **Tone:** Intellectual, honest, pragmatic, slightly weary of corporate BS but committed to fairness.

  2.  **Deconstruct Question 1: The Luck Regress & Desert Bases:**
