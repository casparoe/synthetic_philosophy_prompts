      *   *Why it feels gross:* Promoting Daniel signals that luck and optics matter more than ownership and grit. This degrades the culture. Promotions are *also* communications to the rest of the org.
      *   *The Forecast Connection:* Who is the better *forecast*?
          *   Daniel: High variance. Might coast again. Might get lucky again. Hard to rely on.
          *   Maya: High reliability. Will grind regardless of context. Lower risk of culture rot.
      *   *Actionable Vote:* Vote Maya. Not because she "deserves" it in a cosmic sense, but because promoting her creates a better *system* for future value creation. The "Forecast" argument actually supports Maya if you forecast *culture* and *reliability*, not just individual output.

  5.  **Synthesize and Structure the Response:**
