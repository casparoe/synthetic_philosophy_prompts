      *   *Refining the Voice:* Hayek was polite but devastatingly precise. He spoke of "catallaxy," "spontaneous order," and the "limits of reason." He wouldn't be dismissive of technology, but skeptical of the *epistemological* claim.

  4.  **Drafting the Lange Section:**
