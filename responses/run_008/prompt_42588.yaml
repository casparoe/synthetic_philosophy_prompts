      *   *The Phenomenon:* This is a classic case of **Simpson's Paradox**. The aggregate trend reverses when data is split by a specific variable (Seniority).
      *   *The Causal Question:* Did the bootcamp *cause* the promotions, or did pre-existing factors (Seniority) cause both enrollment and promotion?
      *   *Daniel's Argument:* Aggregates are "honest" if partitions are arbitrary. Department split supports him. Causality can't be proven by data alone.
      *   *Maya's Argument:* Seniority is a *confounder* (affects enrollment and outcome). Department is not. Therefore, seniority adjustment is the correct statistical control.

  3.  **Evaluate Each Move:**

      *   **Move 1: Daniel's Opening (Aggregate Claim).**
          *   *Claim:* Program is a success because 48.8% > 43.6%.
