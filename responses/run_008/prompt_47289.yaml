answer: |-
  This is an excellent strategy. Pre-committing to evaluative criteria is the best way to avoid being swept up by the rhetorical force of the first paper you read (usually Williamson for Knowledge or Weiner for Truth). What follows is a specification sheet designed for a graduate-level engagement with the literature. I have adhered to British English conventions as requested.

  ### The Specification Sheet: Norms of Assertion

  To evaluate any proposed norm of assertion ($N$), we must distinguish between **data points** (linguistic intuitions we must explain) and **structural requirements** (meta-normative features the theory must possess).

  #### Part I: The Data Points (Explanatory Adequacy)

  These are the phenomenological and linguistic intuitions any adequate norm must accommodate. I have marked them as **Non-Negotiable** (virtually all parties agree these need explaining) or **Contested** (partisans disagree on whether the norm should explain these away or embrace them).

  **1. The Lottery Intuition (Non-Negotiable)**
  *   **The Case:** You hold a ticket in a fair, million-ticket lottery. The odds are 0.999999 that you will lose. It is rational to *believe* you will lose; it is certainly *true* that you will lose (ex post); and you have *justification* (statistical). Yet, asserting "Your ticket will lose" before the draw feels improper.
  *   **Requirement:** $N$ must explain why high probability/truth/justified belief is insufficient here.
  *   **Theoretical Load:** This is the primary motivator for the **Knowledge Norm**. If $N$ is merely Truth or Belief, the assertion should be proper. If $N$ is Knowledge, it fails because statistical evidence does not yield knowledge (in the standard view).

  **2. The Retraction/Apology Data (Non-Negotiable)**
  *   **The Case:** You assert $p$. It turns out $p$ is true, but you had no good evidence (you guessed). Someone challenges you. You say, "I shouldn't have said that; I didn't *know*." You do *not* say, "I shouldn't have said that; it turned out false" (because it wasn't).
  *   **Requirement:** $N$ must align with the standard conditions for appropriate criticism and retraction. The defect must be locatable in the epistemic position at the time of utterance, not just the truth value.
  *   **Theoretical Load:** Strongly favours **Knowledge** or **Justified Belief**. The **Truth Norm** struggles here, as the assertion was successful by its own lights (it was true).

  **3. Moore-Paradoxicality (Non-Negotiable)**
  *   **The Case:** Asserting "$p$, but I do not believe that $p$." This is defective even if $p$ is true.
  *   **Requirement:** $N$ must explain why the speaker's doxastic state matters to the propriety of the act.
  *   **Theoretical Load:** Fatal for the **Truth Norm** (which cares only for $p$). Supports **Belief**, **Knowledge**, or **Justified Belief** norms, as all link the act to the speaker's mind.

  **4. The Lying Distinction (Non-Negotiable)**
  *   **The Case:** Lying (asserting what you believe false) feels like a deeper violation than asserting what you believe true but lack knowledge of (bullshitting/guessing).
  *   **Requirement:** $N$ must account for the special normative severity of insincerity.
  *   **Theoretical Load:** A norm that treats lying and ignorant truth-telling as *identical* violations risks missing the moral/epistemic distinction. The **Belief Norm** makes lying a direct violation; the **Knowledge Norm** makes it a violation (since you can't know what you believe false), but must explain why it feels worse than a mere knowledge-lack.

  **5. Selfless Assertion (Contested)**
  *   **The Case:** (Jennifer Lackey's *Stella* case). A doctor has overwhelming evidence a patient will recover, but due to depression/anxiety, she does not *believe* it. She asserts, "You will recover." She seems epistemically proper (even praiseworthy), despite lacking belief.
  *   **Requirement:** $N$ must determine if this assertion is proper.
  *   **Theoretical Load:** This is the biggest threat to the **Knowledge Norm** and **Belief Norm**. If you think this assertion is proper, $N$ cannot require belief/knowledge. If you think it is improper (but excusable), KN/BN survive. This is often where the debate stalls: one side sees a counterexample, the other sees an excuse.

  ---

  #### Part II: Structural Requirements (Meta-Normative Status)

  Your seminar paper should not just apply the norm but define its status.

  **6. Constitutive vs. Regulatory (Contested)**
  *   **The Case:** Is the norm like the rules of chess (constitutive: you aren't playing chess if you ignore them) or like rules of politeness (regulatory: you can play chess rudely)?
  *   **Requirement:** The theory must specify if violating $N$ means one has *failed to assert* or merely *asserted badly*.
  *   **Theoretical Load:** Williamson argues for **Constitutive**. If $N$ is merely regulatory, it is harder to explain why the Lottery assertion feels like a category error rather than just a risk. However, a constitutive norm struggles with "false assertion" (if you assert falsely, did you fail to assert?).

  **7. Act vs. Agent Focus (Non-Negotiable)**
  *   **The Case:** Does the norm govern the *content* of the assertion or the *state* of the asserter?
  *   **Requirement:** $N$ must clarify if it is "Assert $p$ only if $p$ is $F$" (Truth/Knowledge of content) or "Assert $p$ only if you are $G$" (Belief/Justification of agent).
  *   **Theoretical Load:** **Truth Norm** is Act-focused. **Belief/Knowledge** are Agent-focused. This matters for second-hand assertion (see below).

  **8. Universality vs. Domain Variability (Contested)**
  *   **The Case:** Your seminar-mate's point about forecasters, customs officers, etc.
  *   **Requirement:** The theory must state if $N$ is invariant across contexts.
  *   **Theoretical Load:** Most mainstream debate assumes **Universality** (a constitutive norm is part of the *concept* of assertion, which is singular). Admitting variability often concedes that there is no single *norm of assertion*, but rather norms of *communication* or *speech acts* that vary by context. If your mate argues for variability, she is likely arguing against the constitutive project entirely. Treat this as a challenge to the *existence* of a single norm, not a criterion for selecting one.

  ---

  #### Part III: Specific Engagement with Seminar-Mate's Objections

  **9. The Second-Hand Assertion (Testimony) Challenge**
  *   **The Objection:** I assert historical facts based on testimony. I cannot re-derive the evidence. Internalist Justification Norms (JBN) seem to demand I possess the grounds, which I don't. Knowledge Norms (KN) allow transmission (if the source knew, and I trust them, I might know).
  *   **Verdict:** This is a genuine requirement, but it discriminates primarily against **Internalist Justification Norms**.
      *   **Truth Norm:** Passes easily (history is true).
      *   **Belief Norm:** Passes easily (I believe the textbook).
      *   **Knowledge Norm:** Passes *if* one accepts testimonial knowledge transmission (which most do).
      *   **Internalist JBN:** Fails (I lack the original grounds).
      *   **Externalist JBN:** Passes (my reliable source provides justification).
  *   **Advice:** Do not treat this as a knockout for *all* justification norms, only internalist ones. However, it is a strong point in favour of KN over Internalist JBN.

  **10. The Lying vs. Ignorance Distinction**
  *   **The Objection:** Does a norm lumping lying and warrantless assertion together miss something?
  *   **Verdict:** Yes. A norm that treats "Asserting $p$ (believing $\neg p$)" and "Asserting $p$ (believing $p$, no evidence)" as identical violations is deficient.
  *   **Requirement:** $N$ should ideally allow for a hierarchy of violation or distinguish *insincerity* from *incompetence*.
  *   **Theoretical Load:** The **Belief Norm** captures lying perfectly (direct violation). The **Knowledge Norm** captures both as violations but needs a supplementary story about why lying is worse (perhaps because it corrupts the social practice more deeply). The **Truth Norm** fails to capture lying as a specific epistemic violation at all if the lie is true.

  ---

  #### Part IV: The Tension Map (Incompatibilities)

  This is the most critical section for your seminar paper. You cannot satisfy all desiderata simultaneously without qualification.

  **Tension A: The Lottery vs. Selfless Assertion**
  *   **Conflict:** The Lottery case suggests statistical evidence is *insufficient* for assertion (supports KN). Selfless Assertion suggests professional/statistical evidence is *sufficient* even without belief (supports JBN, opposes KN/BN).
  *   **Result:** You generally have to choose which intuition to prioritise.
      *   If you prioritise **Lottery**, you lean **Knowledge Norm**. (You must argue Selfless Assertion is improper but excusable).
      *   If you prioritise **Selfless Assertion**, you lean **Justified Belief Norm**. (You must explain away the Lottery intuition, perhaps via pragmatic encroachment or context-sensitivity).
  *   **Status:** This is the central fault line of the debate.

  **Tension B: Constitutivity vs. False Assertion**
  *   **Conflict:** If the norm is constitutive (Assertion *is* the act governed by Knowledge), then asserting a falsehood (which you cannot know) might mean you *didn't assert*. But we clearly do assert falsehoods.
  *   **Result:** Proponents of Constitutive KN must argue that one can *attempt* the act and fail, or that the norm governs the *attempt* regardless of success.

  **Tension C: Universality vs. Domain Variability**
  *   **Conflict:** If the Customs Officer operates under a Truth Norm (just fill the form correctly) and the Friend operates under a Knowledge Norm, there is no *The* Norm of Assertion.
  *   **Result:** Accepting variability dissolves the philosophical search for a single norm. It turns the debate into linguistics/pragmatics. For the purpose of the seminar, you should treat Universality as a default assumption unless the variability argument proves that "assertion" is an ambiguous term.

  ---

  #### Part V: The "Killer" Criterion

  If you must choose one requirement that does the most work in knocking out contenders, it is:

  **The Lottery Intuition (combined with the Retraction Data).**

  *   **Why:** It is the only criterion that decisively separates the **Knowledge Norm** from the **Truth** and **Belief** norms.
  *   **Truth Norm:** Collapses immediately (the ticket *will* lose).
  *   **Belief Norm:** Collapses (it is rational to *believe* it will lose).
  *   **Justified Belief Norm:** Struggles (statistical evidence is justification, yet assertion is improper).
  *   **Knowledge Norm:** Survives naturally (statistical evidence $\neq$ knowledge).
  *   **Caveat:** The rise of **Selfless Assertion** has weakened this killer criterion, turning it into a tug-of-war. However, historically and structurally, the Lottery/Retraction pair is what launched the Knowledge Norm dominance.

  ---

  #### Part VI: Brief Scorecard

  | Norm | Lottery | Moore | Retraction | Selfless | Testimony | Lying |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Truth (TN)** | **Fail** (Asserting truth is fine) | **Fail** (If $p$ is true, why improper?) | **Fail** (Retraction implies error, but $p$ was true) | Pass | Pass | **Fail** (True lies are fine) |
  | **Belief (BN)** | **Fail** (Rational to believe ticket loses) | Pass | Weak (Can believe and be wrong) | **Fail** (Doctor doesn't believe) | Pass | Pass (Defines lying) |
  | **Justified Belief (JBN)** | **Fail/Weak** (Stats are justification) | Pass | Pass | Pass | **Fail** (If Internalist) | Weak (Doesn't capture insincerity) |
  | **Knowledge (KN)** | **Pass** (No knowledge from stats) | Pass | **Pass** (Best explains "I didn't know") | **Fail** (Doctor doesn't know) | Pass (Via transmission) | Pass (Can't know what's false) |

  ### Summary Advice for Your Paper

  1.  **On the Seminar-Mate's Testimony Point:** Acknowledge it as a strong strike against *Internalist* Justification Norms, but note that Externalist Justification and Knowledge Norms handle it via transmission principles. It is not a knockout for the whole category of epistemic norms, only for Cartesian ones.
  2.  **On Domain Variability:** Frame this as a challenge to the *constitutive* project. If she is right, Williamson is wrong not about *which* norm, but about there being *a* norm. This is a deeper metaphysical claim.
  3.  **On the Tension:** Be explicit that **Selfless Assertion** and **The Lottery** are currently the opposing poles. Your evaluation sheet should reveal which side a paper privileges. If a paper dismisses Selfless Assertion as "merely excusable," they are prioritising the Lottery (pro-KN). If they dismiss the Lottery intuition as "pragmatic inhibition," they are prioritising Selfless Assertion (pro-JBN).

  This spec should allow you to dissect the readings without being captured by their initial framing. Good luck with the seminar.
