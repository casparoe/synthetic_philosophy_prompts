      *   *Domain Variability:* Is this a requirement or a category error? Most mainstream debate assumes a *constitutive* norm (one norm). Allowing variability often dissolves the debate into pragmatics. I should flag this as a "pluralist" challenge rather than a core desideratum for the standard debate.
      *   *Lying:* Why is it paradigmatic? Because it violates the *sincerity* condition often linked to belief/knowledge, not just truth.
      *   *Tensions:* Selfless Assertion vs. Lottery is the big one. Lottery says statistical evidence isn't enough. Selfless says statistical/professional evidence *is* enough even without belief.

