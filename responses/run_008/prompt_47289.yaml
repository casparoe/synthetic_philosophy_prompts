prompt: |-
  I'm taking a grad seminar this term that's about to dive into the norms of assertion debate — the whole thing about whether what you need to properly assert p is that you know p, just that p is true, that you believe p, or some justified-belief/reasonable-belief variant — and my plan is to build my own evaluation sheet BEFORE reading the main papers, so the criteria come from me and not from whoever's view I happen to read first. So what I want from you is the full spec: what any adequate norm of assertion has to deliver, with the case or consideration behind each requirement. Off the top of my head it has to at least make sense of why "your lottery ticket will lose" feels improper even though it's almost certainly true, why Moore-paradoxical utterances like asserting p while denying you believe p are defective even when p is true, why "sorry, I shouldn't have said that — I didn't actually know" counts as taking back an assertion rather than retracting a falsehood, and what's going on in selfless assertion, where a nervous doctor tells a patient he'll be fine without believing it, yet seems blameless because all her evidence supports it. But there's more I suspect: the norm should say whether it governs the act or the speaker, whether it's constitutive of what assertion is or just a standard we hold asserters to, and why lying (asserting what you believe false) is somehow the paradigm violation rather than just one infraction among many — does a norm that lumps lying and merely-warrantless assertion together as equally norm-violating count as missing something?

  One thing I want you to engage with specifically, because my seminar-mate raised it and I can't tell if it's a genuine requirement or her own idiosyncrasy: she claims any norm has to handle what she calls second-hand assertion — almost everything I say about history, geography, science, I'm saying on the strength of testimony, with no evidence of my own — and she thinks this cuts against justification-flavoured norms, since they seem to demand re-deriving things from my own grounds that no one could re-derive, while knowledge norms just inherit whatever the original speaker knew. I half buy it but I also suspect every norm inherits SOME problem from testimony, so maybe this isn't a discriminating test at all. She also floated that different domains might need different norms (a forecaster giving probabilities, a customs officer declaring a form complete, a mate telling you the bridge is safe to cross), which if true would wreck the whole idea of THE norm of assertion — but maybe that's just camp preference smuggled in as a requirement.

  So: give me the requirements list with the motivating case behind each, mark clearly which are non-negotiable and which are just what partisans of one view demand (e.g. is "must make knowledge the norm, not merely necessary" a requirement or a slogan?), and flag any pair of desiderata you suspect can't be jointly satisfied — that's the part I most want to see, since if selfless assertion and the lottery case pull in opposite directions, the list itself is basically a result. Say which single requirement does the most to knock out contenders. A quick scorecard of the knowledge, truth, belief, and justification norms at the end is fine but keep it short, the thinking should be in the criteria. And please write it in British English — behaviour, colour, scepticism, that sort of thing — since the seminar paper is for a UK programme. Sorry its a bit long, I got carried away, but I'd rather over-specify than get a generic "here are the four norms" summary I could have written myself.
