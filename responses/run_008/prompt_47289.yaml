      *   *Key Cases:* Lottery Paradox, Moore's Paradox, Selfless Assertion (Lackey), Lying, Testimony/Second-hand assertion, Domain variability (contextualism/relativism hints).
      *   *Meta-Normative Questions:* Constitutive vs. Regulatory, Speaker-focused vs. Act-focused.

  3.  **Drafting the Criteria (The "Spec"):**

