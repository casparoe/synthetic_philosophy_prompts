      *   **User's Interpretation:** Unconscious processes initiate actions before conscious awareness. Conscious will doesn't initiate behavior. The "veto" power is also subject to the same regress (unconscious initiation). Therefore, no neurological basis for distinguishing chosen vs. caused actions.
