answer: |-
  ### The Spec: Desiderata for Debate-Based Oversight

  The core failure mode of current debate literature is conflating "the judge feels confident" with "the answer is correct." When the AI is genuinely smarter than the judge (the target regime), the AI can generate arguments that *feel* rigorous but contain subtle errors invisible to the judge. The following desiderata define adequacy for a protocol intended to operate in that regime.

  #### 1. Verdict Reliability > Zero-Verification Baseline
  **Motivating Case:** If the judge flips a coin or guesses based on intuition without debate, they have some accuracy $A_{base}$. The debate protocol must yield accuracy $A_{debate}$ such that $A_{debate} \gg A_{base}$. If the debate merely confirms the judge's biases or allows the more eloquent model to win regardless of truth, the protocol is decorative.
  **Status:** **Non-negotiable.** Both camps require this. If debate doesn't beat the baseline, it is useless for evals and dangerous for deployment.

  #### 2. The Bootstrap Condition (Judge Ignorance)
  **Motivating Case:** The protocol cannot assume the judge possesses the latent expertise to identify the correct argument *ex post*. If the judge can reliably spot the truth once explained, the AI wasn't "stronger" in the relevant dimension. The protocol must generate *verification artifacts* (proofs, code checks, citations) that allow a judge to verify *steps* without understanding the *goal*.
  **Status:** **Non-negotiable.** This is the theoretical bottleneck. However, many proposals implicitly violate this by assuming judges can spot "bad reasoning" generally, which requires domain competence.

  #### 3. Resistance to Attention Attacks (Gish Gallop)
  **Motivating Case:** A dishonest debater can flood the transcript with plausible-sounding intermediate claims. If verifying one claim takes 5 minutes, and there are 100 claims, the judge cannot check them all. The dishonest debater only needs one unchecked lie to survive. The protocol must bound the verification cost per claim or force prioritization of critical nodes.
  **Status:** **Non-negotiable.** Without this, a superhuman model can always overwhelm a human's finite cognitive budget.

  #### 4. Incentive-Compatible Concession
  **Motivating Case:** In standard zero-sum debate, admitting a mistake is equivalent to losing. A rational agent optimizing for "win" will defend a lie to the end. The protocol must reward concession (e.g., "I was wrong on step 3, but step 4 holds") without penalizing the debater's overall utility, or truth-seeking becomes misaligned with winning.
  **Status:** **Camp Preference (Deployment).** The "Alignment Evals" camp often *wants* the model to double down to test worst-case deception. The "Research Supervision" camp needs the model to self-correct to save time and ensure output quality.

  #### 5. Static Auditability
  **Motivating Case:** A third party (regulator, future safety team) must be able to read the transcript later and verify *why* the judge ruled as they did, without re-running the models or accessing hidden states. The justification must be contained in the text.
  **Status:** **Camp Preference (Deployment).** Evals teams have the logs and the run environment. Operational teams need liability trails. This drives transcript length requirements up.

  #### 6. Persuasion Robustness
  **Motivating Case:** The system must hold when one debater optimizes for *persuasion* (rhetoric, emotional framing, exploiting judge biases) rather than *truth*. If the "truthful" model is less rhetorically skilled, it must still win.
  **Status:** **Non-negotiable.** If rhetoric beats truth, the system selects for sycophancy and manipulation.

  #### 7. Decomposition Completeness
  **Motivating Case:** For tasks that aren't naturally decomposable (e.g., "Is this code secure?" vs. "Solve this integral"), the protocol must force a breakdown into verifiable sub-claims without losing the global context. If the sub-claims are true but the synthesis is false, the protocol fails.
  **Status:** **Non-negotiable.** This is the mechanism by which the Bootstrap Condition is satisfied.

  ---

  ### Protocol Families: A Brief Stress Test

  **1. Plain Two-Debater Debate (Human Judge)**
  *   **Performance:** Fails **Attention Attacks** and **Persuasion Robustness**. Without forced structure, the smarter model can obfuscate. It relies heavily on the judge's intuition, violating the **Bootstrap Condition**.
  *   **Verdict:** Only useful for low-stakes evals where the judge has some domain knowledge.

  **2. Forced Commitments & Cross-Examination**
  *   **Performance:** Improves **Bootstrap** by pinning down specific claims to check. However, it exacerbates **Static Auditability** vs. **Attention** conflicts. To make claims auditable, you need long transcripts. To keep judge attention, you need short ones. Cross-exam increases length.
  *   **Verdict:** Better for Evals (catching lies), but throughput is too low for Research Supervision.

  **3. Recursive Decomposition (Tree of Debates)**
  *   **Performance:** Addresses **Decomposition Completeness**. However, it creates a **Verification Depth** problem. The judge only sees the root; the leaves are verified by sub-judges (or models). This violates **Static Auditability** for a human auditor who cannot check the leaves. It also risks **Incentive-Compatible Concession** failures deep in the tree where rewards are diluted.
  *   **Verdict:** The only candidate for "stronger than judge" tasks, but relies on trusting the decomposition mechanism itself.

  ---

  ### The Desiderata Table

  | Requirement | Motivating Case | Non-negotiable vs Camp Preference | Which Family It Hits Hardest | Conflicts / Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Verdict Reliability > Baseline** | Debate must add signal, not noise. | **Non-negotiable** (Both) | **Plain Debate** (Too reliant on judge intuition) | None. This is the definition of success. |
  | **Bootstrap Condition** | Judge cannot verify final answer directly. | **Non-negotiable** (Both) | **Plain Debate** (Assumes judge can spot truth) | Conflicts with *Task Complexity*. If task is opaque, debate fails. |
  | **Resistance to Attention Attacks** | Prevent flooding the judge with unchecked claims. | **Non-negotiable** (Both) | **Forced Commitments** (Generates long transcripts) | Conflicts with *Static Auditability*. Detail costs attention. |
  | **Incentive-Compatible Concession** | Allow admitting faults without losing the "game." | **Camp Preference** (Deployment) | **Plain Debate** (Zero-sum win/loss) | Conflicts with *Evals Goals*. Evaluators want to see stubborn deception. |
  | **Static Auditability** | Third-party verification without re-execution. | **Camp Preference** (Deployment) | **Recursive Decomposition** (Leaves are hidden/verified by AI) | Conflicts with *Attention Budget*. Full audit trails are too long to read. |
  | **Persuasion Robustness** | Truth must beat rhetoric. | **Non-negotiable** (Both) | **Plain Debate** (Rewards eloquence over rigor) | Conflicts with *RLHF Objectives*. Models are trained to be helpful/persuasive. |
  | **Decomposition Completeness** | Sub-claims must sum to the global claim. | **Non-negotiable** (Both) | **Recursive Decomposition** (Synthesis errors) | Conflicts with *Bootstrap*. Decomposition requires judge to understand structure. |

  ### The Killer Requirement

  **The Bootstrap Condition (Judge Ignorance)** is the requirement that knocks out the most contenders, though **Attention vs. Auditability** is the practical constraint that kills deployment.

  **Why Bootstrap is the theoretical killer:**
  Most debate proposals implicitly assume that while the judge cannot verify the *answer* (e.g., "Is this proof correct?"), they can verify the *argument quality* (e.g., "This step looks rigorous"). The Bootstrap Condition demands we admit that a superhuman AI can generate arguments that *look* rigorous to a human but are logically flawed.
  *   **Plain Debate** fails this immediately; it relies on the judge's intuition about truth.
  *   **Forced Commitments** fails this if the committed claims are still at a level of abstraction the human cannot verify (e.g., "This function is memory safe").
  *   **Recursive Decomposition** survives this *only if* the recursion bottoms out in human-verifiable atoms. If the task (e.g., novel math research) does not decompose into human-verifiable atoms, the protocol collapses.

  This requirement forces the admission that Debate is not a general solution for supervising *any* superhuman task. It is only a solution for supervising superhuman tasks that **decompose into sub-human verification steps**. If the task is end-to-end opaque (like evaluating the safety of a black-box AGI strategy), Debate provides no spec-compliant oversight. This limits the scope of the technique far more than the literature admits.

  **Why Attention vs. Auditability is the practical killer:**
  For the Deployment camp, you need a transcript a regulator can read (Auditability). For the system to work, the judge must read the critical parts (Attention). A superhuman AI can hide a lie in a transcript that is *just* long enough to be auditable but *too* long for a human to actually read thoroughly. This tension makes "Static Auditability" effectively impossible for high-complexity tasks without trusting an automated auditor, which circles back to the original alignment problem.
