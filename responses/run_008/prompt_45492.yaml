answer: |-
  This is a sophisticated instinct, and you are in good company. Many Bayesian epistemologists (e.g., van Fraassen's critics, Jon Williamson, David Howson) have argued precisely what you suspect: that IBE is either a heuristic for approximating Bayesian inference or a confused attempt to add a non-probabilistic "bonus" to the posterior.

  However, your instinct that IBE is *just* model selection under a different name is, as you suspect, partly wrong. The friction points reveal where the probabilistic framework imposes constraints that philosophical explanation does not respect, and vice versa.

  Here is the translation, the residue report, and the verdict on the nature of the failure.

  ---

  ### 1. Translation of Core Positions

  Here is how the IBE debate looks when projected onto the manifold of Bayesian model selection (BMS).

  **(a) The Basic Schema**
  *   **IBE:** Accept the hypothesis $H$ that provides the "best explanation" of evidence $E$.
  *   **BMS Translation:** Select the model $M_k$ that maximizes the posterior probability $P(M_k | D)$.
      *   By Bayes' rule, this is equivalent to maximizing $\underbrace{P(D | M_k)}_{\text{Marginal Likelihood}} \times \underbrace{P(M_k)}_{\text{Prior}}$.
      *   The "best explanation" is the model that optimizes the trade-off between fit (accuracy on training data) and complexity (penalization via prior volume/Occam factor).

  **(b) Lipton's Loveliness vs. Likeliness**
  *   **IBE:** "Likeliness" is how probable $H$ is given $E$. "Loveliness" is the explanatory virtue (unification, mechanism, precision). Lipton claims we use Loveliness as a guide to track Likeliness.
  *   **BMS Translation:**
      *   **Likeliness:** The Posterior $P(M_k | D)$.
      *   **Loveliness:** This does not map to a single scalar. It decomposes into:
          1.  **Prior Structure:** A "unifying" hypothesis corresponds to a hierarchical model with shared hyperparameters (parameter sharing reduces effective degrees of freedom).
          2.  **Likelihood Geometry:** A "precise" mechanism corresponds to a likelihood function with low entropy (sharp peaks) that still encompasses the data.
          3.  **The Guide Claim:** Lipton's assertion that Loveliness guides Likeliness translates to the claim that structural priors (e.g., sparsity, smoothness) are reliable indicators of high posterior mass. In BMS terms, this is the assumption that the *prior predictive distribution* is well-calibrated to the true data-generating process.

  **(c) Van Fraassen's Critique (Collapse vs. Double Counting)**
  *   **IBE:** Either IBE adds nothing to probabilistic inference (Collapse), or it adds a "virtue bonus" that violates probability axioms (Double Counting/Illicit Addition).
  *   **BMS Translation:**
      *   **Collapse:** IBE is just a verbal description of maximizing marginal likelihood. If "explanatory virtue" is fully encoded in $P(D|M)$ and $P(M)$, IBE is redundant.
      *   **Double Counting:** If IBE claims we should boost $P(M|D)$ *because* $M$ is "lovely" (over and above what the prior and likelihood dictate), this implies a modification rule: $P_{new}(M|D) \propto P(M|D) \times \text{Virtue}(M)$.
      *   **The Verdict:** This violates Cox's Theorem and the axioms of probability. You cannot condition on $D$ and then re-weight based on a property of $M$ that isn't already in the prior or likelihood without becoming incoherent (susceptible to Dutch Books).

  ---

  ### 2. Residue Report

  Here is where the translation holds and where it breaks.

  **What Maps Cleanly:**
  *   **The Trade-off:** The tension between fit and simplicity is mathematically identical in both frameworks. The "Occam factor" (the ratio of posterior parameter volume to prior parameter volume) is a precise formalization of the philosophical intuition that "simpler is better."
  *   **Predictive Accuracy:** When philosophers speak of an explanation having "empirical adequacy," this maps cleanly to the likelihood term $P(D|M)$.
  *   **The Warning against Overfitting:** Van Fraassen's constructive empiricism (don't believe the theory, just save the phenomena) maps well to a purely predictive Bayesian stance (minimize cross-validation error, ignore the "truth" of the parameters).

  **What Maps with Distortion:**
  *   **Unification:** In BMS, unification is parameter sharing or hierarchical structure. But philosophically, unification is often *conceptual*. Two phenomena might be "unified" by a narrative mechanism even if the statistical model requires distinct parameters for each. BMS counts parameters; IBE counts *principles*. A model with 100 parameters derived from one symmetry principle might be "more unified" in IBE than a model with 10 parameters derived from ad-hoc assumptions, but BMS will penalize the former more heavily.
  *   **Mechanism:** BMS is largely instrumental regarding mechanism. If a neural network fits the data, it is a "good model." IBE demands a causal story. In BMS, $P(D|M)$ integrates over all parameter settings; it doesn't care *which* setting is true, only that the manifold covers $D$. IBE cares specifically about the *actual* causal pathway.
  *   **The "Guide" Heuristic:** Lipton says Loveliness guides us to Likeliness. In BMS, if we know the Likelihood and Prior, we don't need a guide. If we *don't* know them, Loveliness acts as a meta-prior. The distortion is assuming that "loveliness" is a computable property of the model. In philosophy, it's often a property of the *scientist's understanding* of the model.

  **What Has No Expression (The Null Space):**
  *   **Contrastivity:** Lipton emphasizes that we explain "Why $E$ rather than $E^*$?" (e.g., "Why did John develop paresis?" vs. "Why did John rather than James develop paresis?"). Standard BMS conditions on the observed data $D$. It does not explicitly model the counterfactual foil $D^*$ unless you build it into the likelihood ratio. IBE treats the *choice of foil* as part of the explanatory context; BMS treats the data as fixed.
  *   **Intelligibility/Understanding:** BMS outputs a probability distribution. It does not output "understanding." You can have a high marginal likelihood model that is a black box. IBE posits that epistemic value includes the *human capacity to grasp* the relation between $H$ and $E$. This is a psychological/cognitive variable absent from the formalism.
  *   **Ontic vs. Epistemic:** IBE often claims that the best explanation is likely *true* (Scientific Realism). BMS (strictly speaking) only tells you which model is most probable *given your priors*. If your prior space excludes the truth, BMS confidently selects the best wrong model. IBE proponents often assume the "best explanation" virtue tracks objective causal structure, not just subjective coherence.

  ---

  ### 3. Position on the Residue

  Your working hypothesis is that the untranslatable remainder splits into:
  1.  **Defect of Vocabulary:** Real epistemic features (causality, non-coincidence) that BMS misses.
  2.  **Defect of Original:** Vague philosophical mush (loveliness) that dissolves under formal scrutiny.

  **My Verdict:** The division is real, but I would reframe it. It is not primarily a "defect" of BMS, but a **difference in teleology**.

  **Category 1: The Principled Limit (Defect of Vocabulary?)**
  There are elements of IBE that BMS *cannot* capture without ceasing to be BMS. This is not a defect of the formalism, but a boundary condition of probability theory.
  *   **Contrastivity:** Probability theory conditions on what *is*. Explanation often interrogates why *this* is and *that* isn't. To capture this in BMS, you must move from $P(M|D)$ to a decision-theoretic framework where the utility function depends on the contrast class. The probability formalism itself is silent on which contrasts matter.
  *   **Causal Direction:** In many graphical models, different causal structures ($A \to B$ vs $B \to A$) imply the same joint distribution $P(A, B)$. They have identical marginal likelihoods. IBE insists one is the better explanation. BMS is agnostic. This is a principled limitation: probability captures dependence, not necessarily directionality, without additional causal assumptions (like do-calculus).
  *   **The "Why" of Evidence:** IBE asks, "Why did this evidence arise?" BMS asks, "Given this evidence, what is probable?" The former is a generative causal query; the latter is an inferential conditional query.

  **Category 2: The Vague Remainder (Defect of Original)**
  There are parts of IBE that survive nowhere because they are indeed less clear than they look.
  *   **Loveliness as a Scalar:** If "loveliness" cannot be decomposed into prior volume, likelihood sharpness, or computational tractability, it is epistemically inert. If a philosopher claims a model is "lovely" but it has lower marginal likelihood and higher complexity, and they still advocate for it, they are violating coherence. This part of IBE is likely "defective" from a normative standpoint.
  *   **The "Bonus":** Any claim that explanatory virtue adds probability mass *ex post facto* is simply incoherent within any framework obeying Kolmogorov/Cox axioms.

  **Is the Failure Principled or Notational?**

  This is your most critical question. **The failure is principled.**

  It is not merely notational because the probabilistic framework is fundamentally **instrumentalist** regarding the model structure, whereas IBE is often **realist**.
  *   **Probability** manages uncertainty about propositions.
  *   **Explanation** manages understanding of structures/mechanisms.

  You can have high probability without understanding (a lookup table of all data has $P(D|M)=1$ but explains nothing). You can have understanding (a simple false theory) with low probability.

  **Can a better formalism settle it?**
  No. A "better" formalism would have to expand the state space to include *agents* and their *cognitive states* (understanding, intelligibility) or *causal interventions* (counterfactuals).
  *   If you add cognitive states, you leave pure statistics for cognitive science.
  *   If you add causal interventions, you leave standard BMS for Causal Inference (which is still probabilistic, but enriched).

  **The Cost of Formalism:**
  The residue shows up precisely as the cost of having a formalism at all. To formalize IBE into BMS, you must operationalize "explanation" into "prediction" or "compression." In doing so, you necessarily strip away the *semantic* content of explanation (what the variables *mean*, how they *cause*) and retain only the *syntactic* content (how they correlate).

  **Conclusion:**
  Your instinct is 80% correct. IBE is the pre-formal intuition of Bayesian model selection. However, the remaining 20% is not noise; it is the signal that **explanation is not just belief management.** It is causal attribution and contrastive interrogation. Probability theory is the logic of consistent belief; IBE is the heuristic of causal discovery. They overlap where causal structure implies probabilistic dependence, but they diverge where probabilistic dependence exists without causal clarity (confounding) or where causal clarity exists without probabilistic certainty (deterministic mechanisms with unknown parameters).

  If you treat IBE as *normative* for belief updating, it collapses into Bayesianism or becomes incoherent. If you treat IBE as *descriptive* of scientific practice or *heuristic* for model construction (searching the model space), it contains valid insights about contrastivity and causality that standard BMS vocabulary ignores by default. You do not need to abandon your framework, but you must acknowledge that marginal likelihood is a measure of *predictive adequacy*, not necessarily *explanatory depth*.
