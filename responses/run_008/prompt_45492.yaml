  4.  **Review and Refine:**
      *   *Check Vocabulary:* Ensure terms like "marginal likelihood," "prior predictive," "Occam factor," "KL divergence," "Cox's theorem" are used correctly.
      *   *Check Tone:* Keep it peer-to-peer. Don't lecture on Bayes 101. Focus on the interface.
      *   *Address the "Double Counting":* Make sure to mention that if you add a "explanatory virtue" term to the posterior, you break the axioms. This is the hard constraint.
      *   *Address "Contrastivity":* This is Lipton's big contribution. $P(H|E)$ vs $P(H|E \text{ rather than } E^*)$. BMS usually conditions on observed $D$. IBE asks why $D$ and not $D'$. This requires modeling the counterfactual $D'$.
      *   *Final Verdict:* The failure is principled. Probability manages uncertainty; Explanation manages structure/causality. They overlap but are not identical.

  5.  **Final Polish:** Organize with clear headings matching the prompt's requests. Ensure the "Residue Report" is honest about the statistical framework's limitations (e.g., instrumentalism vs. realism).

      *(Self-Correction during drafting)*: I need to be careful not to say BMS *can't* do causality. Causal Bayesian networks exist. But standard model selection (marginal likelihoods) is often agnostic to causal direction if the likelihoods are equivalent (Markov equivalence classes). IBE cares about the direction. I should highlight this. Also, emphasize that "Loveliness" might correspond to the *geometry* of the model manifold, not just a scalar score.

      *(Refining Lipton)*: Lipton says Loveliness guides Likeliness. In BMS, we don't need a guide if we can compute the posterior. But we can't always compute it. So Loveliness = Heuristic for navigating model space. But Lipton implies Loveliness is *evidence* of truth, not just a computational shortcut. That's the friction point.

      *(Refining Van Fraassen)*: Van Fraassen is an empiricist. He thinks we shouldn't believe in the unobservable mechanisms, just save the phenomena. BMS is compatible with instrumentalism (predictive performance). IBE is typically realist. This is a metaphysical clash, not just statistical.

      *(Final Plan)*:
