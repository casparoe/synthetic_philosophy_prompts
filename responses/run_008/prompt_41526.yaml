answer: |-
  You are right to be alarmed by (7). Your roommate has accidentally constructed a *reductio ad absurdum* of her own argument. If the logic of the Knowledge Argument (Mary) forces us to accept that there are non-physical facts about *tornadoes*, then the logic is broken, because tornadoes are paradigmatically physical.

  You want to remain a physicalist and keep (3) (that people learn *something* new). To do this, you need to cut the argument at the inference from **(3) to (4)**.

  Here is the exact breakdown of where to stop, why it looked plausible, and the price you pay.

  ### The Step to Reject: The Inference from (3) to (4)

  **The Roommate's Move:**
  (3) Each mini-Mary learns something when she finally gets the experience.
  (4) **So** for every experience type, there are facts that outstrip the physical facts.

  **Your Rejection:**
  You accept (3) but deny (4). You argue that **epistemic novelty (learning something) does not entail ontological novelty (new facts about the world).**

  ### Why This Step Looked Fine
  It looks fine because in almost every other context, if you know all the facts about a system and then learn something new, there must have been a fact you missed. If I know everything about a car's engine, and then I learn it makes a weird noise, there is a fact about the car I didn't know.

  Your roommate is relying on the intuition that **Knowledge = Tracking Facts.** If your knowledge state changes, the set of facts you track must have changed. Since Mary's knowledge state changed (she learned what red looks like), the set of facts must have changed (there must be a "redness fact" she didn't have).

  ### The Physicalist Counter: The Phenomenal Concept Strategy
  To block (4) while keeping (3) and Physicalism, you must adopt the **Phenomenal Concept Strategy (PCS)**.

  Here is the distinction you need to make:
  1.  **Properties/Facts (Ontology):** What exists in the world. (e.g., Neural state N, Air pressure P).
  2.  **Concepts (Epistemology):** The mental tools we use to think about those properties. (e.g., The scientific concept "wavelength 700nm" vs. the phenomenal concept "Red").

  **The Argument:**
  Mary knows all the *physical facts* (ontology). She possesses all the *physical concepts*. When she leaves the room, she does not discover a new *property* of the world. She acquires a new *concept* for a property she already knew about physically.

  She already knew the fact: *"Seeing red involves neural state N."*
  Upon release, she learns to grasp that same fact under a new mode of presentation: *"Seeing red is **this**."* (accompanied by the experience).

  She learns something (satisfying 3), but she does not learn a new *fact* that outstrips the physical (rejecting 4). She learns an old physical fact in a new way.

  ### How This Blocks the Tornado (Step 7)
  This distinction cleanly kills the Meteorologist analogy.

  *   **Mary:** Learns a new phenomenal concept of her *own brain state*. Since physicalism says brain states are physical, she is just re-categorizing physical data.
  *   **Meteorologist:** When he stands in the tornado, he learns a new phenomenal concept of *his experience of the tornado*.
  *   **The Error in (7):** Your roommate claims he learns "facts about tornados that no completed physics contains."
  *   **The Correction:** He learns facts about *his interaction with the tornado*. He does not learn that the tornado has non-physical wind properties. He learns what it is like for a human organism to be battered by physical wind.

  The "new knowledge" is always anchored in the *subject*, never the *object*. Mary's case is special only because the object of her knowledge (her own vision) is internal. The Meteorologist's object (the storm) is external. Physics describes the storm. It does not describe *what it is like to be a meteorologist in the storm*. But that "what it is like" is a fact about the meteorologist's brain, not the storm's physics.

  ### Addressing Your Specific Worry
  You asked: *"But then doesn't the same move say what Mary learns is a fact about her experience -- and if physicalism is true, that experience is a physical thing... so she learned a physical fact she somehow didn't already know despite having complete knowledge?"*

  **Yes.** Exactly. And that is not a contradiction.

  Think of the classic "Cicero/Tully" example in philosophy of language.
  *   Fact: Cicero is Tully (they are the same person).
  *   You can know "Cicero was an orator" without knowing "Tully was an orator."
  *   Did you learn a new fact about the world when you learned they were the same? No. You learned that two *concepts* refer to the same *object*.

  Mary is in the same boat.
  *   Fact: Neural State N = Experience of Red.
  *   In the room, she knows "Neural State N occurs."
  *   Outside, she learns "Experience of Red occurs."
  *   She didn't know these were the same thing until she had the experience.

  So, she knew all the physical facts, but she didn't know that *this physical concept* referred to *this phenomenal experience*. Gaining the connection is the "learning." It is a cognitive upgrade, not a metaphysical discovery.

  ### The Cost: What You Are Buying
  You asked for the honest price of keeping (7) out while staying a physicalist. Here is the bill:

  1.  **You must accept an "Explanatory Gap."** You are conceding that even if we map every neuron and physical law, we still cannot *deduce* what it feels like from the outside. You are admitting that physical descriptions do not exhaust *ways of knowing*, even if they exhaust *what exists*. To a dualist, this gap is proof of souls. To you, it's just a limitation of human cognitive architecture.
  2.  **"Complete Physical Knowledge" is weirder than it sounds.** You have to defend the idea that someone could know every physical fact about color vision but still be ignorant of "what it's like." This feels counterintuitive (how can you know everything and not know *that*?). You have to argue that "knowing" is relative to the conceptual framework used.
  3.  **You lose the "Intuitive Punch" of Physicalism.** You can't say "Science tells the whole story" in a way that implies a scientist could predict your coffee experience from a spreadsheet. You have to say "Science tells the whole story of what *exists*, but not every way of *grasping* what exists."

  ### Summary for Your Roommate
  Tell her this:
  "I grant (3). People learn something. But I reject (4). Learning something new doesn't mean the universe has non-physical facts; it means my brain has new concepts. Mary learns a new *mode of access* to a physical fact, not a new fact. If you push this to the Meteorologist in (7), you prove my point: he learns about his *experience* of the tornado, not the tornado itself. If you insist he learns facts about the *wind*, you've committed a category error. The Knowledge Argument proves there is an epistemic gap, not an ontological one."

  This keeps you a physicalist, keeps the intuition that experiences teach us something, and stops the slide into magical tornadoes.
