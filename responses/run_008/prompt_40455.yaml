  *   **Rule B (Constituent Essentialism):** **Fragile.** The "essential basis" (the fragile glass) is present. The glaze is a temporary, self-defeating inhibitor. Since the glaze vanishes upon triggering, the true causal basis (the glass) is what manifests the outcome.

  If she says **Not Fragile**, she is a committed Time-Slice Holist (dispositions are about *now*). If she says **Fragile**, she is a Constituent Essentialist (dispositions are about *what is fundamentally there*).
