answer: |-
  This is a fascinating problem, both personally and theoretically. You are standing right at the intersection of aesthetics, philosophy of mind, and creative practice. What you are experiencing is a heightened version of the classic **Paradox of Fiction**, but with a specific *authorial* twist that most theorists ignore because they focus on the reader.

  Let's break this down into the philosophical framework for your dissertation and the phenomenological reality of your writing practice.

  ### 1. The Dissertation Core: The Paradox of Fiction
  Your dissertation question ("Is literary emotional response ever rational?") is essentially the **Paradox of Fiction** formulated by Colin Radford (1975). The trilemma usually looks like this:
  1.  We feel genuine emotions towards fictional characters.
  2.  Genuine emotions require belief in the existence of the object.
  3.  We do not believe fictional characters exist.
  4.  Therefore, our emotions are irrational (or not genuine).

  **Your Partner's View (The "As If" Theory):**
  Your partner is channeling **Kendall Walton**. Walton argues that when we engage with fiction, we are playing a game of make-believe. The emotions are "quasi-emotions." They mimic real fear (heart rate up, palms sweaty) but lack the cognitive component of actual belief.
  *   *Verdict:* Phenomenologically unsatisfying. As you noted, sobbing for an hour isn't "quasi-sobbing." The physiological cost is real. Walton saves rationality by denying the reality of the emotion, which contradicts your lived experience.

  **Your Psych Friend's View (Cognitivism):**
  Your friend is arguing for a strict **Cognitivist Theory of Emotion** (e.g., Robert Solomon or Martha Nussbaum). Emotions are judgments. If I fear X, I judge X to be dangerous. If X doesn't exist, my judgment is false, so the emotion is based on an error. They suggest the object is actually "your own thoughts."
  *   *Verdict:* Causally correct, intentionally wrong. Yes, your neurons are firing in response to your own brain states. But intentionality (what the emotion is *about*) is distinct from causality. If I dream I am falling, I wake up gasping. I am not gasping *about my neurons*; I am gasping *about the fall*. To say you are grieving "your thoughts" feels like a category error.

  **The Solution for Your Essay: "Alief" and Simulation**
  To straighten out the circles in your essay, I recommend looking at **Tamar Gendler's concept of "Alief."**
  *   **Belief:** Your conscious cognitive state ("This character is not real").
  *   **Alief:** An automatic, associative, arational mental state ("Danger! Threat! Loss!").

  When you write the villain, your *belief* knows he is fake. But your *alief* responds to the content of the imagination as if it were real. This is not irrational; it is a feature of how human cognition works. We run simulations. The brain often does not distinguish sharply between vividly imagined scenarios and perceptual inputs (this is why visualization works for athletes).

  **So, is the emotion rational?**
  Yes, if you define rationality as **functional coherence within the simulated context.** Your grief is a rational response to the *value* you have assigned to the character within the logic of the narrative world. The emotion is real; the *ontological status* of the object is bracketed.

  ### 2. The Authorial Wrinkle: Does being the Creator change things?
  You asked if your status as the author changes the equation compared to a reader. **Yes, it does.** It adds two layers that the reader does not have: **Intimacy** and **Complicity.**

  **A. Intimacy (The "Realness" of the Character)**
  A reader meets the character as a finished product. You meet the character as a process. You have spent more time with this villain than you have with most real people. You know their rhythms, their syntax, their hidden motivations.
  In comparative lit, you might recall Keats's **Negative Capability**—the ability to exist in uncertainties and mysteries without reaching for fact or reason. As an author, you must inhabit the character so fully that the boundary between self and other dissolves.
  *   *The Psych Friend's Error:* They say you can't fear him because he isn't real. But to write him well, you must make him real *to yourself*. If you didn't feel the fear, you probably wouldn't be writing the scene effectively. The fear is a metric of your success in embodiment.

  **B. Complicity (The Burden of Control)**
  This is the crucial difference between you and a reader. A reader is a witness; you are the perpetrator.
  *   **The Grief:** When the character you love dies, you aren't just mourning a loss; you are mourning a loss *you orchestrated*. This introduces **guilt** into the grief. You sobbed not just because he died, but because *you killed him*. That is a very real emotion with a very real object (your own agency).
  *   **The Fear:** You mentioned checking locks. A reader can close the book and the threat is contained. You, however, know that the threat exists *because you keep summoning it*. The dread comes from the knowledge that you are the portal. The "villain" is a part of your psyche that you are voluntarily amplifying. The fear is not that he will come out of the page; the fear is of *what it means about you* that you can conjure him so vividly.

  ### 3. Synthesizing the Argument
  For your dissertation, I suggest moving away from the binary of "Real Object vs. Fake Object." Instead, argue for **Intentional Realism.**

  The object of your emotion is not a physical human being (ontological reality); it is a **psychological persona** (intentional reality).
  *   **Partner:** Wrong to call the emotion watered down. The cortisol and tears are chemically identical to "real" fear.
  *   **Psych Friend:** Wrong to say the object is "your thoughts." The object is the *character*, understood as an intentional object. We can have real relationships with intentional objects (e.g., grieving a lost future, fearing a potential diagnosis).
  *   **You:** You are right that the fear is of *him*. But "him" is a complex construct of language, psychology, and simulation that your brain treats as a threat agent.

  **The Rationality Claim:**
  Literary emotional response is rational because it is a **truthful response to a hypothetical truth.**
  If the story is "true" (thematically, emotionally, logically), then the response to it should be "true" (genuine affect). To *not* feel fear at a terrifying villain would be the irrational response (indicating a failure of imagination).

  ### 4. Practical Advice for the Writer
  Since you are also living this, not just theorizing it:

  1.  **Ritualize the Boundary:** You need to close the portal. Writers often have rituals to "de-role." When you finish a chapter with the villain, physically change your environment. Wash your hands, change the lighting, go for a walk. Signal to your *alief* that the simulation is paused.
  2.  **Reframe the Fear:** When you check the locks, acknowledge the feeling but label it correctly. "This is not fear of an intruder; this is somatic resonance." Naming it can help your prefrontal cortex regulate the amygdala.
  3.  **The "Character Autonomy" Defense:** You mentioned you control everything. Experienced writers often report that at a certain point, characters "refuse" to do what the author wants. If the character *must* die for the story to be true, you are not a murderer; you are a historian recording an inevitable event. Relinquishing some sense of control might alleviate the guilt-grief.
  4.  **Dissertation Direction:** Look into **Jenefer Robinson's *Deeper than Reason***. She argues that emotions in art start as non-cognitive physiological upsets (like your fear) which are then processed cognitively. This bridges the gap between your body's reaction and your mind's knowledge. Also, **Lisa Zunshine's Theory of Mind** work might help explain why our brains treat fictional agents as real agents (because we are hardwired to detect agency).

  ### Summary
  Your partner is right that the *ontology* is fake, but wrong that the *emotion* is fake. Your psych friend is right that the *causal mechanism* is internal, but wrong that the *intentional object* is just "thoughts."

  You are experiencing **real neurochemical responses to simulated scenarios.** As an author, this is intensified because you are not just simulating the world; you are responsible for its moral architecture. The fear is real. The grief is real. They are the cost of doing the work. For the dissertation: argue that the rationality of the emotion lies in its fidelity to the *logic of the fiction*, not the *facts of the world*.

  Take care of yourself. The fact that you feel this deeply suggests you're writing something worth reading.
