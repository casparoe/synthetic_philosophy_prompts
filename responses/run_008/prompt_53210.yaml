          *   *Psychologist Friend's view:* Emotions need real objects; you're feeling fear *about your thoughts*, not the character.
          *   *User's Experience:* It feels like fear *of him*, not fear of their own mind.
      *   **Specific Questions:**
          1.  Who is closer to the truth (Partner, Psych Friend, or neither)?
          2.  Does being the *author* change the nature of the emotion compared to a *reader*?
