          *   Critique the Partner (Walton's "Quasi-Emotion"): It dismisses the physiological reality.
          *   Critique the Psych Friend (Cognitivism): It's too reductive about intentionality.
          *   *Proposed Solution:* **Simulation Theory** or **Offline Emotion**. The brain runs a simulation. The output is real neurochemistry, even if the input is hypothetical.
          *   *Key Distinction:* The emotion is real; the *belief* triggering it is bracketed (Coleridge's willing suspension, but deeper).
      *   **Part 2: The Authorial Wrinkle:**
          *   Does being the author change it? Yes.
          *   *Intimacy:* You know the character better than a reader knows them. They are part of your psyche.
          *   *Responsibility:* The grief isn't just loss; it's *inflicted* loss. The fear isn't just threat; it's *summoned* threat.
          *   *Character Autonomy:* Mention the phenomenon where characters "refuse" to do what the author wants. This makes them feel "real" to the author.
      *   **Part 3: Rationality of Literary Emotion:**
          *   Move beyond Real/Fake binary.
          *   Use **Martha Nussbaum** (emotions as judgments of value) or **Jenefer Robinson** (affective appraisal).
