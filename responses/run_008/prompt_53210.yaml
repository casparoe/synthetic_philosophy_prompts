          *   Reframing the dissertation argument.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just list theories. Apply them to the user's specific feeling of *fear* (locks at night) vs. *grief* (sobbing).
      *   *Fear:* This is interesting because it bleeds into reality (checking locks). This suggests the simulation is leaking. This is closer to "contagion" or "priming."
