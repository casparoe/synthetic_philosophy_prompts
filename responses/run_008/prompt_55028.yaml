answer: |-
  Here is a specification of desiderata for an adequate account of colony-level cognition. This list bypasses the ontological verdict (do they *really* think?) to focus on the structural and functional requirements any theory must satisfy to treat the colony as a cognitive unit distinct from its constituents.

  ### Desiderata for Colony-Level Cognition

  #### 1. The Explanatory Exclusion Constraint
  *   **The Case:** If every colony-level behavior can be fully predicted and explained by tracing the causal chain of individual ant states (plus environmental inputs) without remainder, then positing colony-level states violates parsimony (Occam's Razor). To justify the "colony" as a cognitive agent, colony-level variables must capture patterns, constraints, or causal powers that are computationally intractable or conceptually invisible at the ant level. They must do *work*.
  *   **Status:** **Non-Negotiable.** Without this, "colony cognition" is merely a metaphor for aggregate ant behavior.
  *   **Tension:** Conflicts with *Substrate Minimalism* (see #3). Making ants simple enough often makes the colony's complex output hard to explain without smuggling in hidden complexity.

  #### 2. The Principled Boundary Condition
  *   **The Case:** A cognitive system must be distinguishable from its environment and its sub-parts. We need a criterion that explains why the *whole* colony is the agent, and not the subset of ants currently on your shoe, or the pile of dormant ants on a log, or the colony plus the aphids it tends. The theory must define the system's identity conditions over time. Why does the colony persist when ants die, but not when the queen dies (in some species)?
  *   **Status:** **Non-Negotiable.** Without a boundary, there is no "system" to bear the cognitive states.
  *   **Tension:** Conflicts with *Ontological Realism* (see #5). Real cognitive agents (like brains) usually have fixed physical boundaries; colonies have fluid membership.

  #### 3. Substrate Minimalism (The "No Homunculi" Rule)
  *   **The Case:** The account cannot derive the colony's intelligence by implicitly attributing complex cognitive states to the individual ants. If the explanation of the colony's "belief" relies on the ants having "maps," "goals," or "knowledge," the cognition has merely been pushed down a level, not emergently generated. The ants must be modeled as mechanistically simple as empirically possible.
  *   **Status:** **Non-Negotiable.** This is the core of the emergence claim.
  *   **Tension:** Conflicts with *Explanatory Exclusion* (see #1). The simpler the ants, the harder it is to generate high-fidelity cognitive outputs without the model becoming computationally opaque.

  #### 4. Non-Additivity (Emergence Criterion)
  *   **The Case:** Colony cognition cannot be the linear sum or average of ant behaviors. It must exhibit non-linear dynamics where the interaction topology creates new informational states. For example, a trail is not just "many ants walking"; it is a persistent memory structure that alters future ant behavior in a feedback loop. The theory must specify the mechanism of integration that transforms noise into signal.
  *   **Status:** **Non-Negotiable.** Distinguishes *collective* cognition from *aggregated* behavior.
  *   **Tension:** Generally compatible with others, but puts pressure on *Mereological Robustness* (see #6). Non-linear systems often behave unpredictably under fission.

  #### 5. Ontological Clarity (Realism vs. Instrumentalism)
  *   **The Case:** The theory must declare whether colony-level states (beliefs, desires) are causal features of the world (Realism) or merely useful compressions for an observer's prediction (Instrumentalism/Bookkeeping). If Realist: what physical substrate realizes the belief? If Instrumentalist: why treat it as cognition rather than just a modeling heuristic?
  *   **Status:** **Negotiable.** One can build a functional account on either metaphysics, though the implications differ wildly.
  *   **Tension:** **Major Tension with Principled Boundary (#2).** If you claim Realism, you typically require a stable substrate to hold the state. If the Boundary is fluid (ants come and go), the Realist claim weakens. If you claim Instrumentalism, the Boundary problem dissolves (the boundary is where *you* draw it), but the Explanatory Exclusion constraint becomes harder to meet (why is the instrument *necessary*?).

  #### 6. Mereological Robustness (Fission and Degradation)
  *   **The Case:** This addresses the "cut in half" problem. Standard cognitive systems (brains) degrade gracefully or lose function when damaged; they do not typically fission into two fully functional agents of the same kind. A theory must account for why a colony can split and become two agents. Is this a feature of distributed cognition, or does it disqualify the colony as a singular agent? Does the theory require graceful degradation, or is "graceful fission" an acceptable alternative profile for a cognitive system?
  *   **Status:** **Negotiable.** This may be a category difference between *organismic* and *superorganismic* cognition rather than a failure of the theory.
  *   **Tension:** Conflicts with standard functionalist definitions of identity used in *Ontological Clarity* (#5). If identity is tied to continuous physical history, fission breaks it. If identity is functional, fission is allowed but makes "the colony" ambiguous post-split.

  ***

  ### The Tension Map

  You hypothesized a tension between the **Realist** claim and the **Level-Cut** (Boundary). The analysis confirms this, but expands it into a triad of incompatibilities that no single view can perfectly satisfy.

  **1. The Realism-Boundary Paradox**
  *   **Conflict:** *Ontological Clarity (Realist)* vs. *Principled Boundary Condition*.
  *   **Why:** Realism about mental states usually implies a specific physical vehicle that persists through time (a brain, a neural net). Ant colonies have high turnover and fluid spatial boundaries.
  *   **Result:** To save Realism, you must argue the "vehicle" is the *pattern* of activity, not the physical ants (Pattern Realism). To save the Boundary, you must admit the boundary is observer-relative (Instrumentalism). You generally cannot have a Physical Realist account of colony beliefs *and* a strict physical boundary condition.

  **2. The Simplicity-Power Trade-off**
  *   **Conflict:** *Substrate Minimalism* vs. *Explanatory Exclusion*.
  *   **Why:** If ants are truly simple (stimulus-response), it is difficult to show how the colony solves complex problems without the theory secretly relying on environmental structures (the "extended mind") to do the work. If the environment does the work, is the cognition still *colony-level*?
  *   **Result:** Theories tend to slide toward making ants slightly "smarter" (violating Minimalism) to ensure the colony looks "cognitive" (satisfying Exclusion).

  **3. The Identity-Fission Dilemma**
  *   **Conflict:** *Mereological Robustness* vs. *Ontological Clarity*.
  *   **Why:** If a colony splits into two, and both claim the original "beliefs," did the belief duplicate? If the original colony is defined by its Queen, and she dies, does the cognition cease? Brains do not duplicate.
  *   **Result:** If you demand brain-like identity conditions (Non-Negotiable Mereology), colonies fail to qualify as agents. If you allow colony-like identity conditions (Fission is okay), you must radically revise the definition of "cognitive agent" used in standard philosophy of mind.

  ### Summary of Requirements
  To satisfy your request for "spec before theories," an adequate account must:
  1.  **Prove Necessity:** Show ant-level accounts are computationally or explanatorily insufficient.
  2.  **Define the Edge:** Explain why *this* group of ants is the thinker, not *that* group.
  3.  **Purge Homunculi:** Ensure ants are not secretly smart.
  4.  **Declare Metaphysics:** State clearly if the beliefs are "in the world" or "in the map."
  5.  **Handle Damage:** Explain what happens when the system is physically disrupted (degradation vs. fission).

  **Critical Note:** The tension between **Realism** and **Boundary** is the pivot point. If you resolve this by adopting Pattern Realism (the belief is in the dynamic structure, not the matter), you can satisfy the Boundary condition (patterns persist despite matter swap) but you risk making the cognition too abstract to be causally potent. If you resolve it by adopting Instrumentalism, you satisfy the Boundary (it's a useful cut) but you concede the "yes-it-is" debate entirely.
