answer: |-
  You have stumbled directly onto the central problem in the philosophy of probability known as the **Admissibility Problem**, specifically regarding David Lewis's **Principal Principle**. Your intuition that there is a structural difference between your verdicts is correct, but your current formulation ("unless evidence bears on whether the chance really is as stated") is indeed too vague to do the work.

  Here is an analysis of your cases, a proposed principle that captures the pattern without ad-hoc clauses, and a direct answer to your questions about incoherence and metaphysics.

  ### 1. The Unifying Principle: Constitutive vs. Empirical Sources

  Your verdicts are not inconsistent; they track a distinction between **Constitutive Chance Claims** and **Empirical Chance Estimates**.

  *   **Constitutive Claims:** The source provides the chance *by definition* or by appeal to fundamental symmetry/law. The chance is derived from the *setup*, not the history.
      *   *Cases:* Mint coin specs, Roulette wheel design, Physicist (citing decay laws).
      *   *Verdict:* **Full Deference.** You treat the stated number as the objective chance $x$.
  *   **Empirical Estimates:** The source provides a probability based on frequency, modeling, or incentive structures. The chance is derived from *data* or *behavior*.
      *   *Cases:* Weather forecaster, Bookmaker, Brother-in-law.
      *   *Verdict:* **Calibration.** You treat the stated number as evidence *about* the chance, subject to known biases or track records.
  *   **Outcome Evidence:** Evidence that reveals the result.
      *   *Cases:* Watching the coin land.
      *   *Verdict:* **Override.** Credence goes to 0 or 1.

  **The Principle:**
  > Defer fully to stated chances when they are derived from a trusted **structural model** (symmetry, physical law, design specs) and you have no specific evidence that the instantiation of that model is defective. Treat stated chances as **evidence to be calibrated** when they are derived from **predictive models** (weather, betting markets) or **testimony based on observation** (brother-in-law).

  This explains the Physicist vs. Brother-in-law tension without appealing to "authority" as a magic bullet. The physicist is citing a *law of nature* (Constitutive); the brother-in-law is citing *observed frequencies* (Empirical). You defer to laws; you calibrate observations.

  ### 2. The Rigged Casino Case (The "Undermining" Problem)

  You wrote: *"I can't work out what to do... maybe full deference to the posted 1/38 is correct after all?"*

  **Verdict: Overturn this.** Your intuition to defer here is wrong, and your confusion is the correct response.

  This is a classic case of **Undermining Evidence**. The Principal Principle requires you to condition on the proposition that "the chance is $x$." If you have a credible report that the casino rigs wheels, you have strong evidence that the proposition "the chance is 1/38" is **false**.

  You cannot defer to a chance you believe does not exist.
  *   If you defer to 1/38, you are asserting the wheel is fair.
  *   If you believe the report, you assert the wheel might be biased.
  *   These are contradictory.

  **What to do:** You do not raise credence in all numbers (impossible). You lower your credence that the *chance* is 1/38. Your credence in the *outcome* "Number 17" becomes a weighted average:
  $$(\text{Credence wheel is fair} \times 1/38) + (\text{Credence wheel is rigged} \times \text{Unknown Bias})$$
  Since you don't know the direction of the rig, your credence distribution becomes **flatter** (more uncertain) than 1/38, but the expected value for any specific number might remain 1/38 *if* you have no reason to suspect specific numbers are targeted. However, you are no longer "deferring to chance"; you are averaging over competing chance hypotheses.

  ### 3. The Deterministic Universe Case

  You asked: *"What does it say about a case I haven't given — for instance, a fully deterministic universe where somebody hands me 'chance' numbers anyway: defer or not?"*

  **Verdict: Do not defer.**

  If the universe is deterministic, objective chances (in the Lewisian sense) are either 0 or 1. If someone hands you a "30% chance of rain," they are not stating an objective chance; they are stating an **epistemic probability** (a measure of their ignorance) or a **best-system summary** (a useful fiction).

  *   **If you know the universe is deterministic:** You know there is no objective chance to defer to. You must treat the number as expert testimony about their *credence*, not the world's *propensity*. You would then apply your calibration rules (like the Weather Forecaster case).
  *   **If you don't know:** You act *as if* there are chances. This suggests that "deference to chance" is actually a pragmatic rule for handling expert testimony in a world where you cannot compute the physics yourself.

  ### 4. Which Verdicts Would I Overturn?

  To make your system coherent, you need to make two hard cuts:

  1.  **The Rigged Casino:** As stated above, you cannot defer. You must downgrade your confidence in the chance statement itself. Deference requires believing the chance statement is true.
  2.  **The Physicist:** You say you defer "flat-out, even though I can't check the calculation." This is dangerous if taken literally. If a physicist told you the chance of a decay was 50%, but you had a Geiger counter that showed the isotope was stable, you would not defer.
      *   *Correction:* You are deferring to the **theory**, not the person. If the theory is trusted (Constitutive), you defer. If the theory conflicts with your direct evidence (like the Geiger counter), the evidence wins. Your verdict is acceptable only so long as the physicist's claim remains in the "Constitutive" bucket and doesn't drift into "Empirical claim about this specific atom."

  ### 5. Is the Framing Built on Sand?

  You asked: *"Same if the whole framing assumes chances are a real thing out there to defer to, and that assumption is doing more work than it should."*

  **Yes.** This is the "Humean" objection to the Principal Principle.

  If objective chances are not real metaphysical propensities (and many philosophers argue they aren't), then the Principal Principle is not a rule about aligning your mind with the world's *propensities*. It is a rule about **aligning your credence with the Best System**.

  *   **The Sand:** If chances are just summaries of patterns in history (Humean Supervenience), then "deferring to chance" is just "deferring to the best summary of the data."
  *   **The Consequence:** If this is true, your distinction between **Constitutive** and **Empirical** collapses. Both are just models. The Mint Coin is a model based on symmetry; the Weather Forecaster is a model based on regression.
  *   **Why your intuitions still work:** Even if chances aren't "real," the **symmetry models** (coins, roulette, decay) are incredibly robust and resistant to new data (a coin doesn't stop being symmetric because it landed heads 5 times). The **prediction models** (weather, betting) are sensitive to new data (a forecaster's bias updates quickly).

  **Conclusion:**
  Your gut calls are tracking the **robustness of the model**, not the metaphysics of chance.
  *   **Robust Models (Symmetry/Law):** Treat as fixed chances. Defer.
  *   **Fragile Models (Prediction/History):** Treat as hypotheses. Calibrate.
  *   **Direct Evidence:** Treat as fact. Override.

  Your pattern is coherent if you view "Chance" not as a magical property, but as a label for **highly robust structural models**. The Rigged Casino case breaks because the report attacks the robustness of the structure itself. The Deterministic case breaks because it removes the structural uncertainty that makes the "chance" label useful.

  **Final Advice:** Stop looking for a rule about "admissible evidence." Start looking for a rule about **Model Authority**. Defer to the model when the model defines the system (physics, geometry). Calibrate the model when the system constrains the model (forecasting, gambling markets).
