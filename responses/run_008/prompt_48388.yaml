          *   *Alternative:* She might say "Group is useless" if she thinks $<50\%$ implies randomness rather than anti-correlation. But Case 2 suggests she sees a deterministic drift away from truth.
          *   *Refinement:* Given Case 2 ("Majority almost certainly wrong"), the logical extension is that the *opposite* is almost certainly right. I'll predict she takes the logical step.

      *   **Case (c): 3 options, pairwise 55%, plurality voting.**
          *   *Math:* This is the Condorcet Paradox / Voting Theory trap.
          *   *Scenario:* A vs B (A wins), B vs C (B wins), C vs A (C wins). Or, voters have transitive preferences but the voting method (Plurality) fails to capture the pairwise wisdom.
          *   *Key Issue:* Case 1-4 assume a binary truth (Right/Wrong). Case (c) introduces *three* options and a specific voting mechanism (Plurality) that differs from pairwise comparison.
          *   *Housemate's Logic:* Her previous cases are all about *binary truth tracking* (Right/Wrong, Convict/Acquit). She values *independence* (Case 3).
          *   *Problem:* Plurality voting with 3 options often fails to pick the "Condorcet Winner" (the one who beats all others head-to-head).
          *   *Prediction:* She will be **skeptical/wary.** She will likely say the crowd might fail here because the voting method doesn't match the competence structure.
          *   *Reasoning:* Her rule relies on aggregating judgments on a *single question*. Splitting votes among 3 options dilutes the "truth" signal unless there's a runoff.

