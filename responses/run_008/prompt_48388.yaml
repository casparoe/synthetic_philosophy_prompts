answer: |-
  Based on the track record you've provided, your housemate is operating on a specific intuition about how groups process information. She isn't just guessing; she is applying a consistent logical framework, likely without realizing it has a name in statistics (it is very close to **Condorcet's Jury Theorem**).

  Here are my predictions for her verdicts on the three new cases, followed by the analysis of her underlying rules and a test to prove which one she is actually using.

  ### Part 1: Predictions for the Three New Cases

  **Case (a): A million voters, 50.1% accurate, independent.**
  *   **Prediction:** She will say **YES, trust the majority.**
  *   **Reasoning:** Her first rule established that if individuals are better than a coin flip (>50%) and independent, a large crowd becomes nearly perfect. To her, 50.1% is mathematically the same "direction" as 55%, just slower. With a million people, the "luck" cancels out, leaving only the tiny 0.1% edge, which becomes massive when multiplied by a million.

  **Case (b): A hundred experts, 40% accurate, independent.**
  *   **Prediction:** She will say **The minority position is almost certainly the right one.**
  *   **Reasoning:** In her second rule (45% accuracy), she stated the majority is "almost certainly wrong." If you have a binary choice (Right/Wrong) and the majority is certainly wrong, logic dictates the minority must be right. She views error here as a systematic signal, not just noise. She will likely argue that a group this consistently wrong is actually a reliable guide if you just do the opposite of what they say.

  **Case (c): Three options, pairwise 55% accuracy, plurality voting (vote for favorite).**
  *   **Prediction:** She will say **The crowd is unreliable / The method is broken.**
  *   **Reasoning:** All her previous examples were binary (Right/Wrong, Guilty/Not Guilty). This case introduces "vote splitting." If there are three options, the "best" option might get 34% of the vote, while two worse options get 33% each. The best option loses not because the crowd was wrong, but because the voting method didn't capture their wisdom. She values the *mechanism* of aggregation (as seen in her concern about newspaper columnists in Case 3), and she will likely spot that "pick one favorite" fails to capture "which is better than which."

  ---

  ### Part 2: The Underlying Rule vs. Rival Rules

  To understand why I made those predictions, we have to look at the "Engine" driving her thinking.

  #### The Master Rule: "The Statistical Truth-Tracker"
  This is the rule that fits all four of her past calls perfectly.
  *   **The Logic:** If people are more likely to be right than wrong (>50%), and they don't copy each other (independence), adding more people washes away the mistakes and amplifies the truth. If they are more likely to be wrong (<50%), adding more people washes away the truth and amplifies the error.
  *   **Why it fits:** It explains why 55% works (Case 1), why 45% fails (Case 2), why copying destroys the benefit (Case 3), and why a small group (12 people) still has risk (Case 4).
  *   **Plain English:** Imagine everyone is tossing a biased coin. If the coin lands on "Truth" 55% of the time, and you toss a million of them, the pile will be overwhelmingly "Truth." If the coin lands on "Truth" only 45% of the time, the pile will be overwhelmingly "Error."

  #### Rival Rule 1: "The Competence Threshold"
  *   **The Logic:** Groups are only wise if the individuals are *clearly* competent (e.g., 55% or 60%). If they are barely above random (like 50.1%), the group is too fragile to trust.
  *   **Where it fits:** It fits Case 1 (55%) and Case 4 (60%). It also fits Case 2 (45% is clearly incompetent).
  *   **Where it breaks:** It contradicts Case (a). The Master Rule says 50.1% works with a million people. The Threshold Rule says 50.1% is basically noise and shouldn't be trusted. If she hesitates on Case (a), she is using this rule.

  #### Rival Rule 2: "The Non-Invertible Error"
  *   **The Logic:** If a group is wrong, they are just useless. You cannot assume the opposite of a wrong answer is the right answer, because "wrong" can happen in many different ways.
  *   **Where it fits:** It fits Cases 1, 3, and 4 naturally. It is compatible with Case 2 if you interpret "Majority is wrong" as "Don't listen to them" rather than "Listen to the minority."
  *   **Where it breaks:** It contradicts Case (b). The Master Rule says a 40% group is a 60% group in disguise (just flip their answers). This Rival Rule says a 40% group is just a broken compass that can't be fixed.

  ---

  ### Part 3: The Crucial Experiment

  To find out which rule she is really using, you need a case where the **Statistical Truth-Tracker** and the **Competence Threshold** give opposite answers.

  **Pose this case to her:**
  > "Imagine a group of 10,000 people. Each person is right 51% of the time, and they don't copy each other. Do you trust the majority verdict?"

  **Why this settles it:**
  *   **If she says YES:** She is a pure **Statistical Truth-Tracker**. She understands that *any* edge over random, multiplied by a large enough group, guarantees accuracy. (This aligns with my prediction for Case (a)).
  *   **If she says NO (or "It's too close to call"):** She is using the **Competence Threshold**. She believes individuals need to be *substantially* better than random for the math to work in the real world.
  *   **If she says "Trust the Minority":** She has misunderstood the math (thinking 51% is below 50%), which is unlikely given her track record.

  **Alternative Test (for Case b):**
  > "If that 40% accurate expert panel votes on 100 questions, and we simply flip their answer every time (turning every 'Yes' to 'No'), will we get about 60 questions right?"

  *   **If she says YES:** She believes error is systematic (Master Rule).
  *   **If she says NO:** She believes error is noise/useless (Rival Rule 2).

  ### Part 4: Plain English Explanations of the Assumptions

  Since you asked for the assumptions in plain terms, here is what is happening under the hood of her arguments:

  1.  **Independence (The "Copying" Problem):**
      *   *Her Case 3:* If everyone reads the same three columnists, they aren't really a million people; they are effectively three people.
      *   *The Assumption:* For a crowd to be wise, their mistakes must be random. If I guess wrong because I'm ignorant, and you guess wrong because you're ignorant, that's fine—we'll likely guess differently. But if we both guess wrong because we read the same fake news headline, our mistakes lock together, and the crowd loses its power.

  2.  **The Law of Large Numbers (The "Million Voters" Effect):**
      *   *Her Case 1 & (a):* Why does 50.1% work with a million people?
      *   *The Assumption:* Imagine flipping a coin that is slightly weighted to land on Heads (50.1%). If you flip it 10 times, you might get mostly Tails just by bad luck. But if you flip it a million times, the bad luck cancels out, and the slight weight of the coin takes over. The crowd size acts as a magnifying glass for that tiny 0.1% edge.

  3.  **Binary vs. Plurality (The "Three Options" Problem):**
      *   *Her Case (c):* Why might this fail?
      *   *The Assumption:* Her previous rules assume a "True/False" world. In a three-option race, "Wisdom" is harder to measure. If Option A is best, Option B is okay, and Option C is terrible, voters might split between A and B. Option C could win simply because A and B split the "smart" vote. This is called **vote splitting**, and it breaks the "Wisdom of Crowds" mechanism unless the voting method allows people to rank choices (e.g., "I prefer A over B").

  ### Summary Recommendation
  Your housemate is smarter about statistics than she might realize. She is intuitively grasping **Condorcet's Jury Theorem**.

  My bet is that she will pass Case (a) (trusting the 50.1% majority) and Case (b) (inverting the 40% experts), but fail Case (c) (recognizing the flaw in 3-option plurality).

  To win the argument (or at least understand her mind), ask her the **10,000 people at 51%** question. If she trusts them, she is a pure logician. If she distrusts them, she is a pragmatist who thinks real-world noise overwhelms tiny mathematical edges. That is the split in her philosophy.
