      *   **Case (c):** Prediction: **No trust/It fails.** (Rule 1 + Voting Theory). Plurality voting breaks the "truth tracking" mechanism.

  6.  **Developing the "Crucial Experiment":**
      *   Need a case that separates Rule 1 (Statistical Inversion) from Rule 2 (Competence Threshold) or Rule 3 (No Inversion).
      *   *Idea:* A case with 51% accuracy but a small group.
      *   *Better Idea:* Focus on Case (b). Ask her: "If the 40% group votes on 100 questions, and we simply flip their answer every time, do we get 60 right?"
      *   *Even Better Idea (Distinguishing 50.1%):* Ask about 1,000 voters at 51% vs 10 voters at 60%.
      *   *Best Distinguisher:* The "Inversion" question is the strongest. Does she believe error is *systematic* (invertible) or just *noise* (unusable)?
      *   *Proposed Case:* A binary quiz where the "experts" are known to be systematically biased (e.g., they always guess 'False' when the answer is 'True').

  7.  **Refining the Explanations (Plain English):**
      *   Avoid formulas. Use "coin flip" analogies.
