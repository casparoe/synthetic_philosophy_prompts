answer: |-
  You have identified one of the most technically significant and philosophically contentious features of supervaluationism. Your intuition is correct: this configuration is a standard, well-documented phenomenon in the literature, though it does not have a single, catchy proper noun (like "The Gettier Problem") attached to it. Instead, it is referred to by its logical characterization.

  Here is a detailed breakdown of the established terminology, the debate surrounding it, and a precise conceptual mapping of the phenomenon.

  ### 1. The Established Name: "Failure of Existential Instantiation"

  In the literature on vagueness and non-classical logic, the configuration you describe is standardly referred to as the **Failure of Existential Instantiation** (or sometimes the **Lack of Witnesses**).

  *   **The Logic:** In classical first-order logic, if $\exists x \phi(x)$ is true, there must be some object in the domain, say $c$, such that $\phi(c)$ is true. This is the principle of **Existential Instantiation**.
  *   **The Supervaluationist Position:** Supervaluationism preserves classical *validities* (tautologies come out supertrue), but it alters the relationship between truth and the model. A sentence is **supertrue** if it is true on all admissible precisifications.
      *   The sentence $\exists x (H(x) \land \neg H(x-1))$ is supertrue because on *every* precisification, *some* number serves as the cutoff.
      *   However, for any specific number $n$, the sentence $H(n) \land \neg H(n-1)$ is **not** supertrue (it is false on some precisifications).
      *   Therefore, the theory asserts the existential claim while denying every instance.

  In *Vagueness* (1996), Rosanna Keefe explicitly discusses this as a "cost" of the theory. Timothy Williamson, the primary proponent of epistemicism, attacks this feature relentlessly, arguing that a truth without a truthmaker (or a witness) is metaphysically untenable.

  ### 2. The Vagueness Debate: Supervaluationism vs. Epistemicism

  You asked whether this is a standard point of contention. It is arguably the *central* technical objection to supervaluationism.

  *   **The Supervaluationist Stance:** They accept the phenomenon. They argue that "truth" (supertruth) is a global property of the set of precisifications, not a local property of a single state of affairs. Therefore, it is coherent for a general claim to be settled (true on all precisifications) while no specific claim is settled (true on all precisifications). They often bite the bullet, accepting that classical logic holds for connectives but the interaction between quantifiers and truth is non-standard.
  *   **The Epistemicist Stance:** Williamson argues that this configuration is absurd. For the epistemicist, $\exists x (H(x) \land \neg H(x-1))$ is true because there *is* a specific number $n$ that is the cutoff. Our ignorance is epistemic, not semantic. Therefore, the epistemicist **denies the phenomenon exists**. They assert that there *is* a witness, we just cannot know which one it is.
  *   **The Disagreement:** It is not merely that they disagree about knowability. They disagree about the **metaphysics of the boundary**.
      *   **Epistemicist:** The boundary is sharp and fixed; the witness exists in reality.
      *   **Supervaluationist:** The boundary is indeterminate; the witness exists only *relative to a precisification*, not in reality simpliciter.

  ### 3. The "Two Readings" of the Quantifier

  Your informant was gesturing at a real distinction, though perhaps imprecisely. The distinction is not usually between two *types* of quantifiers in the object language, but between two *levels of semantic evaluation*.

  1.  **Truth-at-a-Precisification (Local):** Quantification ranges over the domain relative to a specific sharpening of the predicate. Here, classical logic holds fully. There is always a witness *within that precisification*.
  2.  **Supertruth (Global):** Quantification is evaluated across the set of all precisifications. Here, the "existential" claim means "for every precisification, there is a witness," but the witness is allowed to **vary** between precisifications.

  This is sometimes framed as a distinction between **internal quantification** (within a model) and **external quantification** (over the class of models). The supervaluationist existential is an external claim that looks like an internal claim.

  In modal logic terms, this is analogous to the **Barcan Formula** issues or the distinction between **de re** and **de dicto** modality.
  *   *De dicto:* "Necessarily, there is a cutoff." (True: every world/precisification has one.)
  *   *De re:* "There is a number that is necessarily the cutoff." (False: no number is the cutoff in every world/precisification.)

  ### 4. Proposed Terminology: "The Witnessless Existential"

  Since you requested a coined term if no established one suffices, and while "Failure of Existential Instantiation" is the technical description, it is a mouthful. A precise conceptual label for this configuration is:

  **The Witnessless Existential**

  **Definition:** A proposition of the form $\exists x \phi(x)$ is a *Witnessless Existential* relative to a semantic framework if:
  1.  The proposition is assigned the value **True** (or Supertrue/Settled).
  2.  For every constant $c$ in the domain, the instance $\phi(c)$ is **not True** (or is Indeterminate/Unsettled).
  3.  The failure of the instance to be true is not due to epistemic limitation, but due to semantic or metaphysical indeterminacy.

  **Boundary Cases:**

  *   **Classical Logic:** Impossible. If $\exists x \phi(x)$ is true, a witness must exist in the model.
  *   **Intuitionistic Logic:** Impossible. Intuitionism *requires* a construction of a witness to assert an existential. If you cannot produce a witness, you cannot assert the existential. (This is the opposite of supervaluationism, which asserts the existential *despite* the lack of a uniform witness).
  *   **Epistemicism:** Impossible. The witness exists ontologically; the configuration is merely apparent due to ignorance.
  *   **Future Contingents (Ockhamism):** If "Someone will win" is true now, but no specific person is settled to win, this is a Witnessless Existential regarding **settled truth**.
  *   **Quantum Mechanics (Copenhagen):** "An electron is somewhere in the box" (True) vs. "The electron is at position $x$" (False/Indeterminate for all $x$ prior to measurement). This is a physical analog of the Witnessless Existential.

  ### 5. Summary of Differences

  | Feature | Epistemicism | Supervaluationism | Intuitionism |
  | :--- | :--- | :--- | :--- |
  | **$\exists x \phi(x)$** | True | **Supertrue** | Assertible only if witnessed |
  | **Instance $\phi(c)$** | True (for one $c$) | **Indeterminate** (for all $c$) | False/Unproven |
  | **Witness Status** | Exists but unknown | **Does not exist (determinately)** | Must be constructed |
  | **Logic** | Classical | Classical (mostly) | Non-Classical |
  | **Phenomenon** | Denies it exists | **Accepts it (as "Failure of Instantiation")** | Avoids it (rejects $\exists$) |

  ### Conclusion

  The configuration has no single proper name like "The Sorites," but it is universally recognized in the field as the **Failure of Existential Instantiation** or the problem of **Truth without a Witness**.

  Your informant was correct that there is a distinction in how the quantifier is evaluated: it is the distinction between **local truth** (within a precisification) and **global truth** (across precisifications). The supervaluationist accepts the existential globally while rejecting the instances locally.

  If you need a term for your own writing to capture the *shape* of the phenomenon rather than the logical rule, **"The Witnessless Existential"** is precise, descriptive, and distinguishes it from the epistemic view (where the witness is hidden) and the intuitionist view (where the existential is withheld). It captures the exact metaphysical oddity you identified: a commitment to *that* there is something, without a commitment to *what* it is.

  **Recommended Reading:**
  *   **Kit Fine, "Vagueness, Truth and Logic" (1975):** The founding paper of supervaluationism, where he acknowledges the failure of instantiation.
  *   **Timothy Williamson, *Vagueness* (1994):** Chapter 5 offers the most rigorous critique of this specific feature.
  *   **Rosanna Keefe, *Theories of Vagueness* (2000):** Provides a clear overview of the debate regarding "truth without a truthmaker."
