answer: |-
  The heat in Hippo was a physical weight, pressing down on the courtyard where Bishop Valerius sat. He was not a large man, but his stillness made him seem so. On the table between us lay a letter from Carthage, sealed with wax that had cracked in the warmth.

  "The Magistrate believes they are brewing sedition," Valerius said. His voice was dry, like parchment rubbing together. "They call themselves the *Sons of the Dawn*. They share all property. They reject the magistrates' authority. They say the God of the Old Testament is a jailer."

  "And are they?" I asked. I was a deacon, though I dressed as a merchant for this. My name is Lucius.

  "Heretics? Yes. Violent? The evidence is thin. But fear is a better recruiter than evidence." Valerius looked at me. He had studied under Augustine. I knew what that meant. To him, a lie was not just a mistake; it was a ontological wound. To speak falsehood was to unmake oneself, to step away from the *Logos* that held the stars in place.

  "If I go in," I said, "I must become one of them. I cannot just listen. I must pray their prayers. I must eat their bread. I must say I believe."

  Valerius closed his eyes. "Augustine writes that to lie to save a life is to kill the soul. If you go, Lucius, you go without my blessing. I cannot order a man to sin, even for the safety of the flock."

  "Then I go as a private citizen," I said.

  "You go as a man who knows the difference," he corrected. "That is the burden. If you forget the difference, you are lost regardless of what you find."

  ***

  It took three months to gain entry to the villa outside the city walls. They were not the monsters the Magistrate described. There were no orgies, no poisonings. There was only a garden, a shared table, and a man named Silas who spoke softly about the Light trapped within matter.

  They were kind. That was the first shock. In the church, we spoke of charity, but we were often tired, bureaucratic, burdened by the needs of a thousand souls. Here, there were only thirty. They washed each other's feet. They tended the sick. When a widow's roof leaked, three men were there with tiles before the rain stopped.

  My task was to find the weapons cache the Magistrate was sure existed. It did not exist. My task shifted, silently, to finding evidence of sedition. They spoke against the Empire, yes, but only as one speaks against a storm. They did not plan to fight it; they planned to wait it out.

  I began to send messages to Valerius via a trusted runner. *Nothing found. They are harmless.*

  The reply came back: *The Magistrate insists. Find the error. If not political, then spiritual. We must justify the intervention.*

  So I stayed. And I lied.

  At first, the lies felt like swallowing stones. "I renounce the Creator of flesh," I would say during their evening vigil. My stomach would turn. I would confess it later in the dark, whispering to God that it was for a greater good.

  But a lie told once is a shock. A lie told daily is a routine. A lie told for a year becomes a habit. And a habit becomes a skin.

  I found myself enjoying the vigils. Their chants were beautiful. I began to understand why they rejected the Old Testament; the violence of those stories troubled them, and I found myself agreeing that a God of war was hard to reconcile with the Christ I knew. I caught myself thinking: *Perhaps they see something we have missed.*

  Then I would remember Valerius's warning. *If you forget the difference, you are lost.*

  I clung to the difference like a drowning man clings to a spar. I am Lucius. I am of the Church. This is a mask.

  But masks fuse to the face if worn too long.

  ***

  The crisis came in the season of rains. A young woman in the community, Mara, fell ill. It was a fever that burned through the night. She was twenty, the daughter of a local landowner who had cast her out for joining the Dawn.

  I was often at her side. I had played the role of the wealthy convert who left his business to serve the poor. It was a good cover; it explained my literacy and my money.

  On the third night of her fever, the others slept. The villa was quiet, save for the rain drumming on the tiles. Mara woke, her eyes glassy, searching the shadows until they found me.

  "Lucius," she whispered. Her hand was dry and hot. She gripped my wrist. "I am afraid."

  "The Light is with you," I said. The standard comfort.

  "No," she said. A tear leaked from the corner of her eye. "I am afraid I was wrong. My father... he sent a priest to the gate yesterday. I saw him. He told me the Bishop promises forgiveness. If I return. If I recant."

  My heart hammered against my ribs. This was it. The opening. If I encouraged her to doubt, if I validated her fear of the Church, I could secure her loyalty. If I told her the Church was a trap, she would stay. If she stayed, I stayed. If I stayed, I could keep watching.

  But she was dying. Or at least, she was terrified of death.

  "Lucius," she said, pulling me closer. "You have seen the world. You were a merchant. You know men. Tell me true. Does the Bishop's God receive those who are afraid? Or does he only want the strong?"

  In that moment, the theology didn't matter. The Magistrate didn't matter. Valerius didn't matter. There was only a terrified child asking for truth.

  If I told her the truth—that the Church offered sacraments for the dying, that repentance was always open—I would have to reveal who I was. I would have to break the cover. I could call a priest. I could save her soul, according to Valerius. I could save her life, perhaps.

  But if I did that, the mission ended. The Dawn would scatter. The Magistrate would claim they were hiding something. Valerius would be pressured to condemn them harder. And I... I would be exposed as a spy.

  If I told her the lie, she would die trusting me, trusting the Dawn, trusting a falsehood.

  "Lucius?" Her grip tightened. "Please. Do not give me the prayer. Give me the truth."

  I looked at her. I saw the kindness she had shown me when I first arrived, the extra portion of bread, the way she laughed at my poor singing. I loved her. Not in lust, but in the way one loves a sister in a foreign land.

  To save the mission, I had to let her die in error. To save her soul, I had to destroy the mission.

  Valerius had said lying kills the soul. But letting a soul drift into what I believed was heresy... was that not also a death?

  "The Bishop's God," I said, my voice steady, "is a God of law. He requires certainty. He does not like the afraid."

  It was a lie. It was a blasphemy. It was the exact opposite of everything I had been taught.

  Mara exhaled, a long shuddering breath. The tension left her shoulders. "Then I am glad I am here. I could not have borne a God of law. Thank you, brother."

  She closed her eyes and slept.

  I sat there until dawn. I did not pray. I felt that I had no right to speak to God. I had just told a dying woman that God was cruel, so that I could keep my seat at the table. I told myself it was for the greater good. To expose the error that might corrupt thousands.

  But as the sun came up, I realized I didn't know if I believed the lie anymore. I had said it so smoothly. I had looked into her eyes and weaponized my own faith against her.

  ***

  Mara died two days later. We buried her in the garden.

  A week after that, the Magistrate's men came. I had sent the final letter. *They harbor runaways. They speak against the Imperial image. They are a state within a state.* It was not a lie, technically. But it was not the whole truth.

  I stood with Valerius on the balcony overlooking the road. We watched the soldiers march up the path to the villa. We heard the shouting. We saw Silas come out with his hands raised. He was not holding a weapon. He was holding a scroll.

  "Was it worth it?" Valerius asked. He did not look at me.

  "They were leading people away from the sacraments," I said. "Mara died without the Last Rites."

  "Because you told her she didn't need them," Valerius said softly.

  "I maintained the cover."

  "You maintained the lie."

  The soldiers were binding the members of the Dawn. They were not being killed, but they were being dragged away to exile or prison. The community was broken. The heresy, as a public force, was ended.

  I should have felt relief. The trap was sprung. The danger was averted.

  "Augustine says," Valerius continued, "that truth is a substance. When you lie, you do not just deceive the other. You subtract from yourself. You become less."

  "I am still here," I said.

  "Are you?"

  I looked down at my hands. They looked the same. But I thought of Mara's hand in mine. I thought of the ease with which the words had come. *He does not like the afraid.*

  I had lived the lie for so long that when the moment came to speak the truth, the truth felt like the foreign language. The lie was fluent. The lie was comfortable.

  "What happens to me now?" I asked.

  Valerius finally turned to me. His eyes were full of a sorrow that looked like pity. "You return to the Church. You resume your duties."

  "And the lying?"

  "You stop."

  "Can I?"

  Valerius did not answer. He watched the smoke rising from the villa's hearth, where the soldiers were burning the texts. "God is merciful, Lucius. But memory is not."

  He walked away to greet the Magistrate. I stayed on the balcony.

  Below, a soldier kicked over a basket of olives. The fruit rolled into the dust, dark and bruised. A young boy from the sect, no older than twelve, was crying as they pushed him toward the wagon. He looked up at the balcony. He looked right at me.

  I knew him. I had taught him to read. I had told him that the letters were sacred vessels of the Light.

  He looked at me with expectation. He knew I was a leader. He expected me to speak. To intervene. To say something.

  I opened my mouth. I had the authority. I could say, *This is a mistake. This boy is harmless.*

  But if I spoke, I admitted I knew them. If I admitted I knew them, I admitted how long I had known them. If I admitted that, I admitted the lie.

  The boy waited. His mouth trembled.

  I closed my mouth. I nodded, just once. A small, imperceptible dip of the chin. *Go with them.*

  He turned away.

  I stood there until the sun went down. I tried to pray the Lord's Prayer. *Thy Kingdom Come.*

  But the words felt like they belonged to someone else. I wondered if I was praying to the God of Truth, or to the God I had described to Mara. I wondered if, after enough time, there was any difference left to find.

  The street was empty now. The dust settled. I went inside to write the report. I dipped the pen in the ink. It was black, and thick, and it flowed easily onto the page.

  *The mission is concluded,* I wrote. *The threat is removed.*

  I did not write about the girl. I did not write about the ease of the lie. I signed my name. Lucius.

  I looked at the name for a long time. I wondered if it still belonged to me.
