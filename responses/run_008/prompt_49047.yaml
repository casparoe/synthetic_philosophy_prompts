answer: |-
  Your intuition is spot-on. You've identified the exact seam where your friend's argument splits open. She has stitched together two competing philosophical responses to Modernism and presented them as a single, coherent lineage.

  As a novelist, you're used to plot holes. In philosophy, this is a contradiction in the second act.

  Here is a walkthrough of her claims, separating the robust insights from the conflations, and finally addressing that tension between Wittgenstein and the Institutional Theory that bothered you.

  ### Claim 1: "After Duchamp, philosophers gave up on beauty and craft."
  **Verdict: Mostly True.**

  Before Duchamp's *Fountain* (1917), aesthetics was largely dominated by the idea that art must possess certain properties: beauty, harmony, technical skill, or the expression of emotion. Duchamp introduced the "readymade," suggesting that the *choice* of the object was the creative act, not the fabrication.

  Philosophers didn't so much "give up" on beauty as they realized beauty was no longer a **necessary condition**. You can have art without beauty (e.g., Goya's *Saturn Devouring His Son*), and you can have beauty without art (e.g., a sunset). Post-Duchamp, the focus shifted from *what the object looks like* to *what the object is doing*.

  ### Claim 2: "The Institutional View won — art is whatever the artworld decides."
  **Verdict: Plausible, but Contested.**

  This refers to **Institutional Theory**, most famously articulated by George Dickie in the 1970s. His definition was roughly: *A work of art is an artifact of a kind created to be presented to an artworld public.*

  *   **What philosophers accept:** It explains how a urinal becomes art. It isn't the porcelain; it's the context. It acknowledges that art is a social practice, not just a physical property.
  *   **The Conflation:** Your friend treats this as the "winner." In philosophy, it's more like the "heavyweight champion with a glass jaw." It solves the Duchamp problem but creates others. If art is just what the artworld says it is, who defines the artworld? It risks circularity (Art is what the artists say is art; artists are people who make art). It also struggles to explain *bad* art. If the artworld accepts it, is it automatically art? (Dickie would say yes, but that feels unsatisfying).

  ### Claim 3: "Wittgenstein showed art can't be defined anyway."
  **Verdict: True, but misapplied.**

  Ludwig Wittgenstein didn't write about art specifically, but he wrote about "games." He argued that there is no single thread running through all games (some have balls, some don't; some have winners, some don't). They share a "family resemblance."

  In 1956, the philosopher **Morris Weitz** applied this to art. He argued that art is an **"open concept."** Because creativity is inherently innovative, any definition we create (e.g., "art must be beautiful") will be broken by the next avant-garde movement. Therefore, Weitz concluded, **we should stop trying to define art.**

  ### Claim 4: "Institutional View + Wittgenstein = One Smooth Argument."
  **Verdict: The Seam You Spotted.**

  This is the critical error. **Institutional Theory and Wittgensteinian skepticism are rivals, not allies.**

  *   **Wittgenstein/Weitz:** "You cannot define art. It is an open concept. Stop trying."
  *   **Institutionalists (Dickie):** "Actually, we *can* define it. It's a sociological status."

  Your friend is using Wittgenstein to clear the ground (no essential properties like beauty) and then planting Institutional Theory on that ground (the definition is social). But strictly speaking, if Weitz is right, Dickie is wrong to offer a definition. If Dickie is right, Weitz was too pessimistic.

  Philosophers generally view these as two different attempts to solve the Duchamp problem. Weitz says, "Duchamp proves art has no essence." Dickie says, "Duchamp proves the essence is social, not physical." They cannot both be fully true in the way your friend suggests.

  ### Claim 5: "The Banana (Cattelan) proves anything can become art if the right people nominate it."
  **Verdict: Overstatement.**

  Maurizio Cattelan's *Comedian* (the banana) does support the Institutional view, but it ignores a crucial refinement offered by the philosopher **Arthur Danto**.

  Danto (who wrote famously about Warhol's *Brillo Boxes*) argued that the "Artworld" isn't just a group of snobs waving a wand. For something to be art, it needs **aboutness**. It must be *about* something, and it must embody that meaning.

  *   A banana in a grocery store is food.
  *   A banana duct-taped to a wall in a gallery is a commentary on value, scarcity, and the absurdity of the art market.

  If you duct-tape a banana to your fridge, it is not art. If you duct-tape it to a wall in a gallery, it *might* be. But if a random person duct-tapes a banana to a wall in a gallery without any theoretical context or history, it might just be vandalism. The "nomination" isn't magic; it relies on a historical lineage of meaning. The banana works *because* Duchamp already did the work.

  ### Claim 6: "Art is a pure social fact, like money."
  **Verdict: The Strongest Analogy, but with a Leak.**

  This relies on the philosophy of **John Searle**, who described "institutional facts." A piece of paper is a $20 bill only because we collectively agree to a status function: *X counts as Y in context C.*

  *   **Where it works:** Art is indeed an institutional fact. A urinal is not art by physics; it is art by status.
  *   **Where it breaks:** Money is functional; Art is interpretive.
      *   If I treat a leaf as a $20 bill, the bank will reject it. The status is rigid.
      *   If I treat a leaf as art, and I can generate a compelling interpretation of it, critics might accept it.
      *   More importantly: **Forgery.** If you forge a $20 bill perfectly, it is *not* money (it's counterfeit). If you forge a painting perfectly, it *is* still art (it's just a forgery). The physical object of the forgery possesses the same aesthetic properties as the original. This suggests art has properties that money does not.

  ### The Punchline: "Getting worked up is like arguing about a twenty."
  **Verdict: Cynical, not Philosophical.**

  Your friend's conclusion is a form of **relativism**. She is saying, "Since the definition is social, the value is arbitrary."

  Philosophers of art would push back hard here. Even if art is a social construct, the *consequences* of that construct are real.
  1.  **Interpretive Depth:** A $20 bill demands nothing of you but acceptance. A work of art demands interpretation. The "work" happens in the engagement between the viewer and the object.
  2.  **Historical Weight:** The banana sells for millions not just because people agreed, but because it sits at the end of a 100-year conversation about value that started with Duchamp. Ignoring that history makes the transaction look like a scam, but understanding it makes it a punctuation mark in a sentence.

  ### Summary for the Novelist

  Your friend is half-right, but she has collapsed a debate into a dogma.

  1.  **Duchamp did kill "beauty" as a requirement.** (True)
  2.  **Institutional Theory is a dominant explanation.** (True, but not the only one)
  3.  **Wittgenstein proved definitions are impossible.** (True, but this contradicts Institutional Theory, which *is* a definition)
  4.  **Art is exactly like money.** (False analogy; art requires interpretation, money requires compliance)

  **The Seam:** You cannot claim "No definition is possible" (Wittgenstein) and "The definition is social status" (Institutionalism) in the same breath without acknowledging the tension. One says "There is no box." The other says "The box is made of people."

  **How to use this:**
  You don't have to abandon the Institutional view. It's a very useful tool for a novelist. It allows you to write about characters who are frauds, or geniuses unrecognized by their time. But the philosophical nuance is this: **The Artworld doesn't just nominate objects; it negotiates meanings.**

  If your character duct-tapes a banana to a wall, it becomes art only if they can convince the world that the banana *means* something. If they say, "It's art because I say so," they are a crank. If they say, "It's art because it exposes the hollowness of late-stage capitalism," and the Artworld accepts that framing, they are an artist.

  The difference isn't just social agreement; it's the **labor of meaning-making.** That's where the "getting worked up" part comes in. We get worked up about art because we care about what things mean, not just what they cost. Money is about value; art is about *values*.
