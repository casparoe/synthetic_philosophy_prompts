          *   *Actually, looking closer:* The prompt asks me to defend the argument *unless* I think it's confused. I think the distinction between the "Epistemic Defense" (couldn't know) and the "Volitional/Structural Defense" (couldn't act) is solid. I will proceed with constructing the argument but add the necessary philosophical guardrails.

  4.  **Refining the Tone:**
