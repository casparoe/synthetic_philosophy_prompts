prompt: |-
  quick context: I TA an 80-minute discussion section for a course that mixes social epistemology with decision theory, 16 students, movable desks, no lectern. I want to run an in-class game on information cascades and rational herding, but not the textbook version — I've done the classic two-urn beads demo before and half the class has already seen it in econ 101 youtube videos, so they just nod along like its obvious.

  Treat this like you're someone who's designed and run classroom experiments in decision theory a hundred times. Think through the mechanics carefully first — maybe brainstorm two or three variants briefly before committing to one in your answer, I want to see the reasoning not just the final product.

  Here's the twist I want to build in, and you can push back on it. The standard cascade demos make herding look dumb — everyone watches the lemmings and thinks "that would never be me." So I want the game arranged so that following the herd is the objectively correct move for each individual, and the students who dissent are the ones who are actually gambling. Concretely I was imagining private signals that are only slightly informative (like 55/45 odds), sequential public choices, and payoffs that only reward being right about the underlying state. Plus one addition I haven't seen anywhere: a "going on record" mechanic. Each round, one student chosen at random has their choice announced with their name attached, while everyone else stays anonymous. My hunch is that this predictibly disrupts cascades for reputational reasons even though it's payoff-irrelevant, which would give me a clean way in the debrief to separate true information cascades from garden-variety conformity. But maybe there's a cleaner design for that separation — tell me if so.

  What I need from you:

  - full rules and materials (paper, coins, index cards — no real money, just a point scheme that doesn't require me to pay anyone anything)
  - a script for how I run the first two rounds so the information structure is unambiguous
  - a way to record the public choice history on the board so the cascade formation is visible afterwards
  - the debrief: map specific moments in what happened onto the formal idea — why it's rational for the third person to ignore their signal, at what point the chain becomes "informationally dead" (later choicers could be ignored without loss), and fragility, i.e. what happens when one late student with a strong signal dissents
  - what will predictably go wrong the first time I run it, and how to handle it
  - an honest note on what the game can't reproduce about real cascades (bank runs, reviewers passing on a paper because two others already rejected it, etc.) that I'll have to supply by talking at the end

  One more thing: be upfront about how confident you are in the different parts — where I should trust the calibration as designed and where you're guessing. And at the very end, single out the one thing you're least sure of, whether its the payoff calibration, or whether my on-record twist actually does what I think it does.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Experienced classroom experiment designer (Decision Theory/Social Epistemology).
      *   **Context:** 80-minute discussion section, 16 students, movable desks, no lectern.
      *   **Topic:** Information Cascades & Rational Herding.
      *   **Constraint:** No textbook urn/bead demo (students know it). Needs a twist.
      *   **Specific Twist:** Make herding *rational* (payoffs reward accuracy, not conformity). Add a "Going on Record" mechanic (one random student per round is named) to test reputational conformity vs. informational cascades.
      *   **Deliverables:** Rules/Materials, Script (Rounds 1-2), Board Recording Method, Debrief (mapping to theory), Troubleshooting, Limitations, Confidence Assessment.
      *   **Tone:** Professional, experienced, pragmatic, slightly critical/analytical.

  2.  **Deconstruct the "Twist" & Design Challenge:**
      *   *Standard Cascade:* Private signal + Public history -> Decision. If history is strong enough, ignore private signal.
      *   *User's Goal:* Show herding is *rational* (Bayesian updating), not just "dumb conformity."
      *   *User's "On Record" Idea:* One student is named per round. Hypothesis: This disrupts cascades due to reputation, distinguishing it from pure informational cascades.
      *   *Critique of "On Record":* In a one-off classroom game, "reputation" among peers is weak unless there's a social stake. If payoffs are anonymous points, being named might not matter much unless the TA makes it matter (e.g., "bragging rights" or "shame"). However, it *does* introduce a variance in the cost of being wrong. If I'm anonymous, being wrong costs 0 points. If I'm named, being wrong costs 0 points + social embarrassment. This *should* make the named person more reliant on their private signal (risk aversion regarding reputation) compared to the rational calculation of the group state.
      *   *Better Alternative?* To separate *informational* cascades from *normative* conformity (Asch style), you usually need to vary the payoff structure or the visibility. The "On Record" mechanic is actually a clever way to introduce a "reputational cost" variable without changing the monetary payoff. I will support this but refine the implementation to ensure the "cost" is felt.
      *   *Game Mechanics:* Need a binary state (A or B). Need private signals (biased coins or cards). Need sequential public choices. Need payoffs for accuracy.
      *   *Calibration:* Signal precision needs to be low enough (e.g., 60/40 or 55/45) so that two matching signals outweigh one contrary signal, triggering a cascade quickly. If signals are too strong (90/10), cascades rarely start. If too weak (51/49), it takes too long. Let's aim for ~65% accuracy signals.

  3.  **Brainstorming Variants:**
      *   *Variant 1: The "Investment" Game.* State is "Market Up" or "Market Down." Signal is a private chart. Choice is "Invest" or "Cash." Payoff depends on State. *Pros:* Realistic. *Cons:* Hard to simulate state generation quickly.
      *   *Variant 2: The "Guilty/Innocent" Jury.* State is "Guilty" or "Innocent." Signal is "Evidence." Vote is "Convict" or "Acquit." *Pros:* High stakes feel. *Cons:* Ethical ickiness in a classroom? Maybe too heavy.
      *   *Variant 3: The "Color of the Hat" (Modified).* A hidden card (Red/Blue) is drawn. Students get a clue. They guess the card color. *Pros:* Simple, clean. *Cons:* A bit abstract.
      *   *Selection:* Variant 3 is best for a tight 80-minute section. Let's call it "The Hidden State." We need to ensure the "On Record" mechanic feels salient.

  4.  **Developing the Mechanics (The "Rational Herding" Protocol):**
      *   **State:** Determined by TA at start of round (e.g., draw from a bag: 5 Red, 5 Blue chips). Let's say Red = 1, Blue = 0.
      *   **Signal:** Each student draws a private chip from a bag conditioned on the State.
          *   If State = Red: Bag has 7 Red, 3 Blue (70% accuracy).
          *   If State = Blue: Bag has 7 Blue, 3 Red.
          *   *Wait, 70/30 is too strong.* A cascade starts after 2 people. 1st says Red. 2nd says Red. 3rd sees Red signal -> Red. 3rd sees Blue signal -> Indifferent (1 public Red + 1 private Blue = 50/50). If 3rd breaks tie randomly, cascade is fragile.
          *   *Let's go 60/40.*
          *   If State = Red: Bag has 6 Red, 4 Blue.
          *   If State = Blue: Bag has 6 Blue, 4 Red.
          *   Math: Prior 50/50.
          *   Person 1: Signal R. Posterior = 60% Red. Says Red.
          *   Person 2: Signal R. Posterior = 60% (from P1) * 60% (signal) ... wait, need Bayesian update.
          *   Likelihood Ratio: 0.6/0.4 = 1.5.
          *   P1 says Red. Odds = 1.5.
          *   P2 sees Red signal. Odds = 1.5 * 1.5 = 2.25. Says Red.
          *   P3 sees Blue signal. Odds = 2.25 * (0.4/0.6) = 1.5. Still favors Red. P3 says Red (ignoring signal). **Cascade Starts.**
          *   This works perfectly. 60/40 signals mean the cascade starts on the 3rd person if the first two match.
      *   **Payoffs:** 1 point for guessing the State correctly. 0 for wrong.
      *   **On Record:** Draw a slip of paper with a student's name before the round starts. That person's guess is written with their name. Others are "Student 4", "Student 5".

  5.  **Refining the "On Record" Twist:**
      *   Does this separate informational vs. normative?
      *   *Informational:* I follow the herd because I think they know something.
      *   *Normative:* I follow the herd because I don't want to look stupid.
      *   *The Twist:* If I am anonymous, I only care about points (Informational). If I am "On Record," I care about points + reputation. If the "On Record" student breaks the cascade more often than anonymous students in the same position, it suggests reputational fear (normative) was suppressing dissent, OR that the reputational cost makes them value their private signal more highly (risk aversion).
      *   *Critique:* Actually, if the payoff is *only* accuracy, being "On Record" shouldn't change the *informational* calculation. It adds a psychological cost to being wrong. If they dissent and are wrong, they look like a maverick who failed. If they herd and are wrong, they look like everyone else. So "On Record" should *increase* herding (normative conformity), not decrease it.
      *   *Correction:* The user wants the "On Record" mechanic to *disrupt* cascades. Why would it? Maybe because they feel more pressure to be "authentic"? No, that's not rational.
      *   *Better Logic:* If the "On Record" student is told "You are the designated decider for this round" (giving them agency), they might feel more responsibility to use their signal.
      *   *Wait, let's stick to the User's hypothesis but refine the interpretation.* User thinks it disrupts cascades. Why? Maybe because being singled out makes them hyper-aware of their own private information?
      *   *Actually, the strongest theoretical angle:* In standard cascades, later players are *indifferent* between following the herd and their signal (if the math balances out). A small reputational nudge breaks the tie. If the cascade is strong (mathematically), reputational nudge won't matter. If the cascade is weak (mathematically), reputational nudge matters.
      *   *Decision:* I will keep the mechanic but advise the TA on how to interpret the result. If the "On Record" student *follows* the herd more, it's normative conformity. If they *break* it, it might be due to "Spotlight Effect" making them trust their own eyes more. I need to be honest that this specific hypothesis is the shaky part.

  6.  **Drafting the Plan:**
      *   **Materials:** 2 bags (State bags), 16 envelopes (Signal bags), Scoreboard.
      *   **Setup:** 16 students. 4 Rounds.
      *   **Script:** Needs to be crisp. Explain the "State," the "Signal," the "Payoff."
      *   **Board:** Needs to track: Round, State (revealed at end), P1, P2, P3... P16, On-Record Name.
      *   **Debrief:** Focus on the "Cascade Threshold." When did private info stop mattering?
      *   **Troubleshooting:** Students signaling each other, students not understanding Bayesian updating, the "On Record" student feeling targeted.
      *   **Limitations:** No dynamic payoffs (bank runs rely on liquidity), no network structure (everyone sees everyone).

  7.  **Confidence Calibration:**
      *   High Confidence: The 60/40 signal structure creates cascades reliably. The debrief points on rationality.
      *   Medium Confidence: The logistics of passing envelopes in 80 mins.
      *   Low Confidence: The "On Record" behavioral effect. This is behavioral psych, not pure game theory, and classroom social dynamics are noisy.

  8.  **Review against Constraints:**
      *   No lectern? Use the board/walls.
      *   Movable desks? Arrange in a semi-circle for visibility.
      *   No real money? Use "Course Points" or "Prestige."
      *   80 minutes? 10 min intro, 40 min game (4 rounds x 10 min), 30 min debrief.

  9.  **Final Polish:**
      *   Make sure the "Rationality" point lands hard. The students need to feel that ignoring their signal was the *smart* move, not the lazy one.
      *   Ensure the "On Record" instruction is clear so it doesn't feel like punishment.
      *   Check the math on the 60/40 signal again.
          *   Prior: 0.5/0.5.
          *   Signal Likelihood: 0.6 (Correct) / 0.4 (Wrong).
          *   P1 sees 'a'. Prob(State A) = 0.6. Guess A.
          *   P2 sees 'a'. Prob(State A | P1=A, S2=a) = (0.6*0.6) / (0.6*0.6 + 0.4*0.4) = 0.36 / 0.52 = ~69%. Guess A.
          *   P3 sees 'b' (contrary). Prob(State A | P1=A, P2=A, S3=b) = (0.36 * 0.4) / (0.36*0.4 + 0.16*0.6) = 0.144 / (0.144 + 0.096) = 0.144 / 0.24 = 60%.
          *   *Wait.* If P3 sees a contrary signal, the probability is still 60% in favor of the Herd. So P3 *should* still follow the herd.
          *   This means the cascade is **robust** at P3.
          *   When does it become fragile? If the signal accuracy was lower, say 55/45.
          *   Let's check 55/45.
          *   P1: 55%.
          *   P2: (0.55^2) / (0.55^2 + 0.45^2) = 0.3025 / (0.3025 + 0.2025) = 0.3025 / 0.505 = ~60%.
          *   P3 (Contrary): (0.3025 * 0.45) / (0.3025*0.45 + 0.2025*0.55) = 0.136 / (0.136 + 0.111) = 0.136 / 0.247 = ~55%.
          *   Even with 55/45, P3 still follows the herd (55% > 50%).
          *   So a cascade starts at P3 regardless, provided the first two match.
          *   To make it *fragile* (where one dissent breaks it), you need the public history to be weak. But in a cascade, the public history accumulates.
          *   *Correction on Fragility:* Cascades are fragile to *new public information*, not private signals. If P4 sees P3 dissent, the chain breaks.
          *   Okay, the math holds. 60/40 is good. It ensures a cascade starts quickly (Round 3) but leaves room for P1/P2 to be signal-followers.

  10. **Writing the Response:** Structure exactly as requested. Reasoning first, then the plan. Be critical of the "On Record" idea in the confidence section.

  *(Self-Correction during drafting)*: I need to make sure the "On Record" mechanic doesn't just look like I'm picking on a student. I should frame it as "The Spokesperson" role, rotated randomly. Also, I need to make sure the "State" is fixed for the whole round but unknown.
  *Materials:* I can't prep 16 envelopes per round x 4 rounds = 64 envelopes easily.
  *Better:* Use a deck of cards. Red/Black for State. H/S/D/C for signals? No, too complex.
  *Best:* Two opaque bags.
  Bag 1 (State): 10 Red, 10 Blue chips. TA draws one, keeps it hidden.
  Bag 2 (Signals): If State is Red, use Bag R (6 Red, 4 Blue). If State is Blue, use Bag B (6 Blue, 4 Red).
  *Wait, logistics:* Passing one bag around 16 students takes time and risks peeking.
  *Solution:* Pre-pack 16 small slips in envelopes for each round. 4 rounds = 64 envelopes. This is prep-heavy but runs smoothly. I will advise the TA to prep this.
  *Alternative:* Just pass the bag. It's a discussion section, 16 students is small enough. I'll recommend passing the bag but with strict rules (draw, close hand, pass).

  *Refining the "On Record" Logic for the Debrief:*
  If the "On Record" student dissents when an anonymous student would herd, it implies the *cost of being wrong* (reputation) made them value their private signal *more*? No, that doesn't make sense. If I'm on record, I want to be right *more*. If the herd is likely right (60%), I should follow the herd *more* to protect my reputation.
  *Ah, here's the insight:* If the cascade is *informationally weak* (e.g., P3 is indifferent), the reputational cost breaks the tie. If P3 is mathematically supposed to herd (60% chance herd is right), reputational cost should *reinforce* herding.
  *So, if the "On Record" student breaks the cascade, it suggests they suspect the cascade is *wrong* or they want to signal independence.*
  *Actually, I should warn the TA:* The standard prediction is that "On Record" increases conformity (Asch effect). If they want to show *rational* herding, the "On Record" student *should* herd. If they dissent, it's evidence of *irrational* non-conformity or a misunderstanding of the odds.
  *Wait, the User wants:* "students who dissent are the ones who are actually gambling."
  *Okay, I will align with the User:* The game shows herding is rational. The "On Record" twist is to see if social pressure *overrides* that rationality (making them herd *more* than rational) or if it makes them *panic* and trust their own eyes (herd *less*). I will flag this ambiguity in the confidence section.

  *Final check on time:* 80 mins.
  Intro/Rules: 15 min.
  Rounds (4 x 10 min): 40 min.
  Debrief: 25 min.
  This is tight. I'll suggest 3 rounds if time drags.

  *Let's finalize the "On Record" interpretation.*
  Hypothesis: Being named increases the salience of the decision.
  Prediction: Named students might be *more* careful. If the cascade is rational, they herd. If they dissent, they are gambling.
  I will advise the TA to use the "On Record" data to ask: "Did being named make you feel more pressure to agree, or more pressure to be 'original'?" This qualitative data is better than trying to force a quantitative separation of normative vs informational in a N=16 sample.

  Okay, ready to write.
answer: |-
  Here is the design reasoning and the full lesson plan.

  ### Design Reasoning & Variant Selection

  I evaluated three structures before settling on the one below.

  1.  **The "Investment Market" Variant:** Students choose to invest in Asset A or B. The "State" is the asset performance.
      *   *Reject:* Too much cognitive load explaining "market dynamics." Students focus on the metaphor rather than the information structure.
  2.  **The "Jury Verdict" Variant:** State is Guilty/Innocent. Signal is Evidence.
      *   *Reject:* Ethical baggage. Students often have strong priors on justice systems that interfere with the Bayesian math (e.g., "I won't convict unless I'm 100% sure," which breaks the payoff structure).
  3.  **The "Hidden Color" Variant (Selected):** A binary state (Red/Blue) is chosen. Signals are biased draws.
      *   *Accept:* Abstract enough to minimize prior beliefs, concrete enough to track easily.
      *   *Calibration:* I recommend **60/40 signal accuracy**.
          *   *Why?* With 60% accurate signals, a cascade becomes mathematically rational starting at **Person 3** (if P1 and P2 match).
          *   *Math:* Prior 50/50. P1 sees Red -> 60% Red. P2 sees Red -> ~69% Red. P3 sees Blue (contrary) -> The math still weighs the two public Reds heavier than the one private Blue (~60% Red). P3 *should* ignore their signal. This proves your point: herding is the Bayesian optimal move.
      *   *The "On Record" Twist:* I am keeping this, but I have a major caveat (see Confidence section). In standard theory, reputational risk usually *increases* conformity (Asch effect). If your "On Record" students dissent more, it suggests they are prioritizing "authenticity" over accuracy, or they misunderstand the odds. If they herd *more*, it confirms normative conformity. I have designed the debrief to handle either outcome.

  ---

  ### The Lesson Plan: "Rational Lemmings"

  **Time:** 80 Minutes
  **Class Size:** 16 Students
  **Materials:**
  *   2 Opaque Bags (or coffee mugs with covers).
  *   20 Red Chips, 20 Blue Chips (for signals).
  *   1 Coin (for State determination).
  *   Whiteboard & Markers (Red and Blue).
  *   16 Envelopes (prepared in advance, see below).
  *   Scoreboard (drawn on board).

  #### 1. Preparation (Before Class)
  *   **The Signal Envelopes:** You need to simulate the 60/40 probability without passing a single bag around (too slow/risky).
      *   Prepare 4 sets of 16 slips of paper.
      *   **Set 1 (State Red):** 10 slips say "RED", 6 slips say "BLUE". (Shuffle into 16 envelopes).
      *   **Set 2 (State Blue):** 10 slips say "BLUE", 6 slips say "RED". (Shuffle into 16 envelopes).
      *   *Note:* This gives a 62.5% signal accuracy, which is close enough to 60% for classroom purposes and easier to count (10/16).
  *   **The Room:** Arrange desks in a U-shape or semi-circle. You need to see everyone, and they need to see the board.

  #### 2. The Script (Rounds 1 & 2)
  *Goal: Establish the information structure without jargon.*

  **Intro (5 mins):**
  "Today we are testing how groups aggregate information. There is a hidden State of the World: either **RED** or **BLUE**. Your goal is to guess the State.
  *   **Payoff:** If you guess the State correctly, you get 1 Point. If wrong, 0 Points.
  *   **Signal:** You will get an envelope with a private clue. It is *mostly* accurate, but not perfect.
  *   **Sequence:** You will announce your guess out loud, one by one, in seat order. Everyone hears the previous guesses.
  *   **The Twist:** Before we start, I will draw a name from this hat. That person is 'On Record.' Their name goes on the board next to their guess. Everyone else is anonymous."

  **Round 1 (The Baseline):**
  1.  **Determine State:** Flip a coin publicly. Heads = RED State, Tails = BLUE State. *Write this on a hidden piece of paper.*
  2.  **Distribute Signals:** Hand out the 16 envelopes corresponding to that State. (e.g., if RED, use the "Set 1" envelopes).
  3.  **Select "On Record":** Draw a name from a hat. Write it on the board under "Round 1."
  4.  **Execution:** Go down the row. "Student 1, what is your guess?" Write **R** or **B** on the board.
      *   *TA Tip:* If Student 1 hesitates, say: "Trust your envelope, but remember you want the point."
  5.  **Reveal:** Once all 16 guess, reveal the hidden State. Award points (honor system, or just track on board).
  6.  **Board Record:**
      *   Row 1: [State: R] | R R R R R R R R... (Note where the cascade started).
      *   Mark the "On Record" student's guess with an asterisk (*).

  **Round 2 (The Variation):**
  "Same rules. New State. New Signals. New 'On Record' student."
  *   *Crucial:* If Round 1 resulted in a full cascade (everyone guessed the same), run Round 2 exactly the same.
  *   *If Round 1 was chaotic:* Remind them: "Remember, Person 3 knows what Person 1 and 2 saw. If P1 and P2 said Red, the probability of Red is high, even if your envelope says Blue."

  *(Run Rounds 3 and 4 similarly. Change the "On Record" student every time.)*

  #### 3. Board Recording Method
  Do not just write R/B. You need to visualize the *flow* of information.

  | Round | State | 1 | 2 | 3 | 4 | 5 | 6 | ... | 16 | On Record |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1** | **R** | R | R | R | R | R | R | ... | R | *Smith* |
  | **2** | **B** | B | R | B | B | B | B | ... | B | *Jones* |
  | **3** | **R** | R | R | B | R | R | R | ... | R | *Doe* |

  *   **Color Code:** Use Red marker for Red guesses, Blue marker for Blue guesses.
  *   **The Cascade Line:** When you see 3 matching guesses in a row, draw a vertical line after the 3rd one. Label it "Info Dead."
  *   **The Dissent:** If someone breaks the chain, circle their guess in the opposite color.

  #### 4. The Debrief (25 Minutes)
  *Map the board to the theory.*

  **A. Rationality of the Herd (10 mins)**
  *   **Point to Round 1, Student 3:** "Student 3 had a Blue signal (assume they reveal later or ask them). But P1 and P2 said Red. Why did you say Red?"
  *   **The Math:** "P1 and P2 being Red makes it 69% likely the State is Red. Your signal is only 62% reliable. Mathematically, ignoring your envelope was the *smart* move. You weren't a lemming; you were a Bayesian."
  *   **Key Concept:** **Informational Cascade.** Private information is discarded because public history is more informative.

  **B. Informational Death (5 mins)**
  *   **Point to the "Info Dead" line:** "After Student 3, Student 4's choice tells us *nothing* about their signal. We know they are just copying the math. By Student 10, the chain is 'informationally dead.' Even if Student 10 had a super-computer signal, the group ignores it because the public history is too heavy."
  *   **Key Concept:** **Fragility.** The cascade is robust to private signals, but fragile to *public* dissent. If Student 4 had dissented, the chain would have shattered.

  **C. The "On Record" Mechanic (10 mins)**
  *   **Look at the Asterisks:** "Did the 'On Record' students behave differently?"
  *   **Scenario A (They Herded More):** "Being named made you risk-averse. You didn't want to be the named person who was wrong. This is **Normative Conformity** (Asch). You knew the math, but social cost outweighed points."
  *   **Scenario B (They Dissented More):** "Being named made you feel you needed to 'justify' your choice. You trusted your own eyes over the group. This is **Overconfidence** or **Signaling**."
  *   **The Takeaway:** Real-world cascades (bank runs, paper rejections) mix *Informational* (I think they know something) and *Normative* (I don't want to be the only one pulling out) forces. This game isolates the first, and the 'On Record' twist attempts to trigger the second.

  #### 5. Troubleshooting: What Will Go Wrong
  1.  **The "Signal Peeker":** A student will open their envelope early or show their neighbor.
      *   *Fix:* "If signals leak, the round is void. We lose 5 minutes of discussion time. Don't ruin the data." (Peer pressure works better than TA scolding).
  2.  **The "Contrarian":** One student understands the game and decides to dissent on purpose to "break the cascade" for the sake of the experiment.
      *   *Fix:* In the debrief, ask them: "You sacrificed your point. Was that rational?" Use them as an example of **Social Welfare vs. Individual Rationality**. (Their dissent helps *future* students, but hurts *them*).
  3.  **The "On Record" Anxiety:** The chosen student freezes.
      *   *Fix:* Frame it as "The Spokesperson." "You're not being judged, you're just the data point for reputation today."
  4.  **No Cascade Forms:** With 60/40 signals, there is a ~25% chance P1 and P2 have different signals, preventing a cascade start.
      *   *Fix:* Have a backup "Round 5" prepped where you *force* P1 and P2 to have matching signals (rig the envelopes) to guarantee the teaching moment happens.

  #### 6. Limitations (What You Must Supply)
  The game cannot reproduce the *consequences* of cascades, only the formation. You must lecture on this at the end:
  *   **Payoff Symmetry:** In the game, being wrong costs 0 points. In a **Bank Run**, being the last one to withdraw costs everything. This asymmetry accelerates real cascades.
  *   **Network Structure:** Here, everyone sees everyone. In **Academic Reviewing**, Reviewer 3 sees Reviewer 2's score, but not Reviewer 1's private notes. Hidden information makes cascades harder to break.
  *   **Endogeneity:** In the game, the State is fixed. In **Financial Markets**, the herding *changes* the State (price drops because people sell, which causes more selling).

  ---

  ### Confidence Assessment

  *   **High Confidence:** The **60/40 signal calibration**. This reliably produces a cascade at Person 3 in a classroom setting. The **Debrief Logic** regarding Bayesian optimality is sound.
  *   **Medium Confidence:** The **Logistics**. Passing envelopes to 16 students takes time. If you run 4 rounds, you might run short on debrief time. Be prepared to cut to 3 rounds.
  *   **Low Confidence:** The **"On Record" Twist**.
      *   *Why?* Behavioral responses to "being named" are noisy. In some cohorts, being named makes students *more* conformist (fear of embarrassment). In others, it makes them *less* conformist (desire to stand out/leadership).
      *   *Honest Note:* I am least sure that this mechanic will cleanly separate "Informational" from "Normative" conformity in a single 80-minute session. It introduces a variable (reputation), but without a tangible cost to reputation (like peer evaluation), the signal might be too weak.
      *   *Recommendation:* Treat the "On Record" data as qualitative discussion fodder ("How did it *feel* to be named?") rather than quantitative proof. If the data is messy, pivot the debrief to *why* it was messy (e.g., "Classroom reputation isn't high stakes enough").

  ### Final Advice
  If you only do one thing right: **Make sure the students feel that ignoring their signal was the smart move.** If they leave thinking "herding is dumb," the lesson failed. If they leave thinking "herding was the only rational choice given what I knew," you've taught them Social Epistemology.
