      *   **Move 7: Tom's Last Word (The Grain of Description / Foreseeability Paradox)**
          *   *Claim:* If class-level foreseeability counts, we blame for 1-in-a-million events (too harsh). If it doesn't, the gap remains. This relocates the mystery rather than solving it.
