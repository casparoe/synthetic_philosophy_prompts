      *   **Move 6: Priya's Rejoinder (Risk Class / Deployment Decision)**
          *   *Claim:* Blame lands on the *decision to deploy*. You don't need to foresee the specific incident, just the statistical risk class (like pharma or hiring).
          *   *Strengths:* Shifts focus from specific outcome to systemic risk management. Aligns with modern regulatory frameworks (FDA, etc.).
          *   *Weaknesses:* Tom will attack the "grain of description."
