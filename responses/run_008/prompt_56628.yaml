  8.  (Final thought on "Many Hands"): This is a reference to Dennis Thompson's work. I should implicitly acknowledge that theoretical background without name-dropping unnecessarily.

  9.  (Final thought on "Roman Law"): Priya's analogy is interesting (*noxal liability*). But slaves/animals were property under direct control usually. AI is different. I should note this distinction.

