      *   (7) **Diachronic Conventionalization:** Implicatures can become conventions (e.g., "but").

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) & (2) vs. (3).**
          *   (1) says meaning requires *intention* (specifically reflexive intention to induce belief).
          *   (2) says GPS/Sleepwalkers don't mean because they lack *intention*.
          *   (3) says LLMs *do* mean.
          *   *Problem:* Do LLMs have intentions? Standard philosophical view: No. They are statistical predictors. If (2) is right (no intention = no meaning), then (3) must be wrong. If (3) is right (LLMs mean), then (1) or (2) must be wrong (either intention isn't required, or LLMs have intentions).
