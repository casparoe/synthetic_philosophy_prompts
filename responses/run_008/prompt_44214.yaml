answer: |-
  You are right to hold onto (1). Your friend's argument is a classic objection, often surfacing as "Why doesn't UDT make me vulnerable to every logical mugger?" but it relies on a subtle category error regarding *what* is being updatedless.

  The rotten step is **(4)**, which licenses the move to **(5)**.

  Here is the breakdown of why (4) fails, why it looks plausible, the cost of rejecting it, and how to handle the $10^{20}$ variant.

  ### 1. The Error: Confusing Indexical Ignorance with Structural Ignorance

  Step (4) claims: *"From inside the tails branch, Omega's claim and a stranger's claim are in exactly the same epistemic position."*

  This is true regarding **indexical information** (i.e., "Which branch am I in?"). In the Tails branch, you cannot see the Heads payout. You cannot empirically distinguish "Omega paid in the other branch" from "Omega is lying" using *only* data available in the Tails branch.

  However, it is false regarding **structural/prior information** (i.e., "What kind of situation am I in?").

  Updatelessness does not say "Ignore all evidence and maximize expected utility over all logically possible worlds." It says "Choose the policy that maximizes expected utility from the perspective of your **prior**."

  *   **The Omega Scenario:** Your prior includes the premise "Omega exists, has a verified track record, and flips a fair coin." In this prior, the policy `If asked by Omega, Pay` has an EV of +$450. The policy `Refuse` has an EV of $0. You pre-commit to Paying.
  *   **The Huckster Scenario:** Your prior includes the premise "Random strangers appear, have no verified track record, and generally lie." In this prior, the policy `If asked by Stranger, Pay` has a massively negative EV. The policy `Refuse` has an EV of $0. You pre-commit to Refusing.

  When you find yourself in the Tails branch, you are not re-evaluating the policy. You are **executing** the policy selected by the prior.
  *   If you recognize Omega, you execute `Pay`.
  *   If you recognize a Huckster, you execute `Refuse`.

  Step (4) tries to force you to re-calculate the policy *from inside the branch* using only local data. But Updatelessness explicitly forbids updating on the fact that you are in the Tails branch to change your policy. It does *not* forbid using your prior knowledge about the *source* of the request to select which policy applies.

  **Why it looked fine:** It exploits the intuition that "rationality should be local." If two situations look identical from the inside, shouldn't the action be identical? Updatelessness says **no**. Your action depends on the *counterfactual structure of the world you inhabit*, which is determined by your prior, not just your current sensory input.

  ### 2. The Cost: Abandoning Local Supervenience

  You asked: *"What do I pay for cutting it?"*

  The price is accepting that **rational action does not supervene on your current epistemic state alone.**

  To be an updateless agent, you must carry "baggage." You cannot walk into a room, look at a person asking for money, and derive the correct action solely from the immediate context and the abstract principle of updatelessness. You must know the **history of the problem generation**.

  *   Did this situation arise from a process (Omega's prediction) where my decision algorithm influences the payout?
  *   Or did it arise from a process (Huckster's opportunism) where my decision algorithm has no causal/logical leverage over the past?

  In the Tails branch, the *leverage* is gone (the coin is already flipped). But the *reason you are there* matters. You pay Omega not because you think you can change the past, but because you are honoring the commitment that made the Heads payout possible *in the logical counterfactual*. You do not pay the Huckster because no such logical linkage existed in the prior.

  The cost is admitting that "What should I do?" is not a function of "What do I see now?" but rather "What program was optimal given the world model I held before I saw this?"

  ### 3. The $10^{20}$ Problem (Pascal's Mugging)

  You asked: *"Quote me a reward of $10^{20}$... tell me whether that's the same flaw or a second, worse one."*

  This is a **second, worse flaw** in the friend's argument, because it shifts from Counterfactual Mugging to Pascal's Mugging.

  In Counterfactual Mugging, the probability is fixed (0.5 for a fair coin). The dispute is about whether to honor the counterfactual.
  In the Huckster scenario with $10^{20}$, the probability is the variable. The friend is relying on $EV = P \times V$. If $V$ is huge enough, it overwhelms tiny $P$.

  **The Updateless Defense:**
  A sophisticated updateless agent (like one using a Solomonoff prior) does not assign probabilities independently of complexity. A hypothesis that allows a stranger to dispense $10^{20}$ dollars based on a whim is **computationally complex**.

  *   **Omega Hypothesis:** "Predictor exists, coin flip, standard physics." (Relatively simple).
  *   **Huckster Hypothesis:** "Stranger exists, has magic money generator, cares about my decision theory, no prior evidence." (Extremely complex).

  As the payout $V$ increases, the complexity of the mechanism required to support that payout generally increases, driving the prior probability $P$ down exponentially. For a well-behaved prior, $P$ drops faster than $V$ rises.

  So, the $10^{20}$ claim doesn't force you to pay. It forces you to assign a prior probability so low (e.g., $10^{-50}$) that the EV remains negative. The friend's argument assumes you must assign some non-negligible credence to the Huckster's claim just because they *said* it. Updatelessness says your credence is determined by the prior complexity of the claim, not the magnitude of the offer.

  ### 4. Summary for Your Friend

  You can tell your friend this:

  1.  **Updatelessness optimizes policies from the Prior, not actions from the Posterior.**
  2.  **The Prior distinguishes Omega from the Huckster.** Omega is part of a high-probability structural model (verified track record). The Huckster is part of a low-probability model (ad-hoc claim).
  3.  **Step (4) is false.** While the *sensory experience* in the Tails branch is identical, the *decision problem* is not. One is a branch of a tree you pre-committed to navigating; the other is a different tree entirely.
  4.  **Step (5) does not follow.** Updatelessness does not say "Pay anyone." It says "Follow the policy you would have pre-committed to." You would never pre-commit to paying random strangers, so updatelessness does not compel you to do so.
  5.  **The $10^{20}$ case** is handled by complexity penalties on the prior, preventing the utility term from dominating arbitrarily low probabilities.

  **The Bottom Line:**
  You keep (1). You reject (4). You accept that rationality requires a model of the world that persists across branches, rather than reconstructing rationality from scratch in every moment. You are not a mark; you are an agent executing a program that was vetted before the coin was flipped. The Huckster is trying to sell you a new program *after* the coin flip, and your old program knows better than to buy it.
