      *   **Content:** The paragraph makes several strong claims about Simpson's Paradox (aggregate vs. subgroup trends, lurking variables, subgroup sizes, correlation vs. causation, the "fix" being disaggregation, and the Berkeley admissions case).
      *   **User's Intuition:** Suspects the Berkeley bit is wrong, feels the "always" claims are suspicious, wants a claim-by-claim breakdown.
