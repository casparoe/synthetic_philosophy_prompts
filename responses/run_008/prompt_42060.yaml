answer: |-
  Elena learns to steer a keelboat by practicing in a sheltered cove, forming the belief that holding the tiller perfectly steady is the way to maintain a straight course in moderate winds. Unbeknownst to her, the boat has a strong natural weather helm that would normally require pulling the tiller slightly to windward to go straight, but the cove has a consistent, unseen cross-current that pushes the bow off-course exactly enough to counteract the weather helm when the tiller is held neutral. She succeeds in sailing straight every time in this bay and is justified in believing her technique is effective, but her success depends on the lucky cancellation of the current against the boat's design quirks, meaning her belief is true only due to environmental luck masking the inefficacy of her method.

  For the intellectualist, this scenario is a direct threat: if knowing-how is merely knowing-that (specifically, knowing of a way *w* that it is a way to φ), then Elena's justified true belief about the steering method is Gettiered, forcing them to either deny she knows-how (biting the bullet that successful skill execution isn't enough) or patch the reduction with an anti-luck condition like safety or sensitivity. The Rylean, conversely, uses the case to argue that know-how is a disposition rather than a proposition; since dispositions are exercised rather than true, applying the Gettier label is a category mistake, or alternatively, they might argue she genuinely possesses the local ability despite the luck, showing know-how tracks success where knowledge-that tracks justification. The feature doing the work is the modal disconnect between the subject's believed method and the actual causal chain of success. If an anti-intellectualist concedes that abilities themselves are vulnerable to environmental luck (as virtue epistemologists might), they have little room to hide; admitting that skills can be Gettiered collapses the primary motivation for distinguishing know-how from know-that regarding epistemic luck, leaving them only the nuanced defense that the *structure* of the luck differs (robustness of disposition vs. justification of belief) even if the extensional result is the same.
