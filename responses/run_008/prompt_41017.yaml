          *   Analogy: Driving faster vs. better brakes.
      *   *Section 4: Verdict (How exposed is it?).*
          *   It's not science; it's a heuristic/political theory.
          *   It's vulnerable to the "Human Adaptability" counter-argument (we muddle through).
          *   It's vulnerable to the "Cost of War" argument (war is less profitable now).

  7.  **Refining the Tone:**
