  2.  **Analyze Von Neumann's Hypothesis (The "Technological-Political Lag"):**
      *   *Premise:* Technology evolves exponentially (or at least faster than linear).
      *   *Premise:* Political/Social institutions evolve slowly (linearly or incrementally).
      *   *Conclusion:* The gap creates existential risk.
      *   *Solution:* Global governance (to match the scale of the tech).
      *   *Mechanism:* Deterrence is unstable long-term because tech eventually breaks deterrence (e.g., first-strike capability, AI, biotech).

  3.  **Address Falsifiability (What counts against it?):**
      *   If the theory says "Global Gov OR Doom," then long-term survival *without* Global Gov is the primary falsifier.
      *   *Timeframe:* How long is "long-term"? 70 years? 200 years? 1000 years?
      *   *Specific Indicators:*
          *   Stable multipolarity (e.g., Cold War didn't go hot, India/Pakistan haven't nuked each other yet).
          *   Technological democratization reducing state monopoly on violence (making war less appealing or total war harder).
          *   Institutional adaptation speeding up (e.g., international treaties actually working without a world government).
          *   Decoupling of tech power from destructive capacity (e.g., tech makes defense easier than offense).

  4.  **Address the "Unfalsifiable/Teleological" Risk:**
