answer: |-
  This is a classic coordination problem wrapped in moral philosophy. You are trying to optimize for two competing utility functions: **Recognition** (incentivizing high-impact behavior) and **Retention** (maintaining the baseline coalition).

  In rationalist terms, you are worried about **signaling costs**. If the spotlight raises the perceived Schelling point for "good member," you risk pushing the 10%ers out of the equilibrium. If you remove the spotlight, you lose the signal that encourages upward mobility in giving/impact.

  Here is the breakdown of the philosophical distinctions, the procedure, and the application to your cases.

  ### Part 1: Which Philosophical Distinctions Survive?

  You asked which distinctions from the supererogation literature matter for a newsletter people skim in five minutes. Most metaphysical debates about the *nature* of duty do not survive contact with human psychology.

  **Drop These:**
  *   **Objective Supererogation:** Whether an act is *truly* above duty in a Kantian or Utilitarian sense doesn't matter. What matters is whether the *reader perceives it* as duty.
  *   **Blameworthiness:** You don't need to solve whether skipping the act is blameworthy. You need to solve whether the reader *feels* blamed.

  **Keep These:**
  *   **The Implicit Ought:** Praise functions normatively. To praise X is to suggest X is the kind of thing one *should* do. The procedure must actively decouple praise from obligation.
  *   **Aggregate vs. Individual:** Individual praise creates specific comparison targets ("I am not Sarah"). Aggregate praise creates a community norm ("We are a generous group"). The latter is safer for retention; the former is better for specific incentives.
  *   **Sacrifice vs. Capacity:** Celebrating *sacrifice* (pain/cost) implies that suffering is virtuous. Celebrating *capacity* (leverage/opportunity) implies that effectiveness is virtuous. The latter is less shaming to those with less capacity.

  ### Part 2: The Impact Report Spotlight Procedure

  This procedure is designed to be run in January/February before drafting. It is a series of gates. If you fail a gate, you stop or modify the plan.

  **Step 1: The Consent Gate (Hard Stop)**
  *   **Question:** Has the member explicitly opted into public recognition for this specific act?
  *   **Sufficient Answer:** Written or verbal confirmation *for the current year*. (Past consent does not count).
  *   **If No:** Do not spotlight. You may include their contribution in aggregate totals only.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: The Baseline Decoupling Test**
  *   **Question:** Does the description of this act blur the line between the community pledge (10%) and the extra act?
  *   **Sufficient Answer:** The text explicitly categorizes the act as "Beyond the Pledge" or "Additional Contribution."
  *   **Procedure:** You must include a standardized preamble in the spotlight section: *"Our community pledge is 10%. The following members chose to contribute additional time or resources beyond that commitment."*
  *   **If No:** Rewrite until the baseline is explicitly validated as sufficient.
  *   **If Yes:** Proceed to Step 3.

  **Step 3: The Framing Audit (Sacrifice vs. Leverage)**
  *   **Question:** Does the copy emphasize how *hard* it was (sacrifice) or how *effective* it was (leverage)?
  *   **Sufficient Answer:** The copy focuses on impact/outcome, not pain/cost.
  *   **Rule:** Avoid words like "sacrifice," "gave up," "struggle," or "hero." Use words like "leveraged," "enabled," "directed," or "contributed."
  *   **Rationale:** Celebrating sacrifice shames those who cannot afford to suffer. Celebrating leverage invites those with capacity to use it.
  *   **If No:** Rewrite to focus on impact.
  *   **If Yes:** Proceed to Step 4.

  **Step 4: The Known Friction Check**
  *   **Question:** Has any member expressed to leadership that previous reports caused them moral distress or feelings of inadequacy?
  *   **Sufficient Answer:** A specific check with membership leads.
  *   **If Yes:** You enter the **Judgment Zone** (see below). The procedure cannot automate this. You must weigh the value of the spotlight against the risk of losing the distressed member(s).
  *   **If No:** Proceed to Step 5.

  **Step 5: The Aggregate Balance**
  *   **Question:** Is the volume of individual spotlights disproportionate to the celebration of the baseline?
  *   **Sufficient Answer:** The report dedicates at least equal space/visual weight to the *collective* impact of the standard 10% pledges as it does to the supererogatory acts.
  *   **Rule:** If you spotlight 3 individuals, you must prominently display the total impact of the "standard" pledges.
  *   **If No:** Rebalance the layout.
  *   **If Yes:** Publish.

  ---

  ### Part 3: The Judgment Zone

  Step 4 is where the algorithm hands the call back to you. No checklist can resolve interpersonal hurt. If Step 4 triggers, you must answer this question:

  *"Is preserving this specific member's participation more valuable to the community's long-term utility than the signaling benefit of the spotlight?"*

  *   **If you decide the member is at high risk of churning:** Do not run individual spotlights this year. Switch to **Aggregate Spotlighting** (e.g., "This year, 5 members contributed 500+ volunteer hours," without names).
  *   **If you decide the member is stable but sensitive:** Run the spotlight, but send a personal note to the distressed member *before* the report goes out, validating their specific contribution and explicitly stating that the spotlight is not a new standard.

  ---

  ### Part 4: Running the Cases

  Here is how the procedure handles your three cases.

  **Case 1: 10% + 15 hrs/mo Matching Campaign**
  *   **Step 1 (Consent):** Assume Yes (usually people running campaigns expect credit).
  *   **Step 2 (Decoupling):** Pass. You explicitly label this "Volunteer Labor Beyond Pledge."
  *   **Step 3 (Framing):** Pass, *if* you write "Enabled $X in matching funds" rather than "Spent countless weekends."
  *   **Step 4 (Friction):** Pass (assuming no specific complaint about *this* person).
  *   **Step 5 (Balance):** Pass, provided you show the total $ raised by the 10%ers prominently.
  *   **Verdict:** **Spotlight Allowed.** This is high-leverage labor. It fits the "capacity" frame.

  **Case 2: 40% Giving + Anonymous**
  *   **Step 1 (Consent):** **FAIL.**
  *   **Verdict:** **No Spotlight.**
  *   **Reasoning:** The procedure treats consent as a hard constraint. Praising someone against their will violates their autonomy and risks doxxing their financial status to the group. You may include the *amount* in the aggregate total, but the name and the specific act remain hidden. This is not a judgment call; it is a privacy constraint.

  **Case 3: 10% Giver + "Made me feel like a moral failure"**
  *   **Step 4 (Known Friction):** **TRIGGERED.**
  *   **Verdict:** **Handed to Judgment Zone.**
  *   **Reasoning:** The procedure explicitly flags this. You cannot simply override her feelings with "but it's logically supererogatory."
  *   **Action:** You must decide if her retention is critical.
      *   *Option A (Retention Priority):* Switch to Aggregate Spotlighting for the whole report. No names. "Some members gave extra time." This protects her but dulls the incentive for Case 1.
      *   *Option B (Signaling Priority):* Run the spotlight, but you are now *obligated* by the procedure to send her a personal validation message before publication.
  *   **Honest Assessment:** If you choose Option B and she leaves anyway, the procedure protected *you* (you followed the steps), but it failed the community (you lost a member). This is the limit of policy.

  ### Part 5: What This Procedure Cannot Do

  You asked for honesty about limitations.

  1.  **It Cannot Fix Culture:** If your community culture is implicitly perfectionist, a preamble saying "10% is enough" will be read as "10% is the bare minimum." The procedure manages the text, not the subtext.
  2.  **It Displaces Judgment, It Doesn't Remove It:** Step 4 admits this. You are still the one deciding whether Case 3's feelings outweigh Case 1's recognition. Writing it down just forces you to admit you are making that tradeoff.
  3.  **It Cannot Prevent Comparison:** Human beings are comparative engines. Even with aggregate data, a 10% giver will wonder if they are in the top or bottom half. The procedure minimizes the *salience* of the comparison, but cannot eliminate it.

  **Recommendation:**
  Adopt the procedure, but add a **Review Clause**. After next year's report, survey the 10%ers anonymously: *"Did this report make you feel more or less motivated to stay in the circle?"* Use that data to adjust Step 5 (Balance) next year. This turns your "vibes" problem into a feedback loop.
