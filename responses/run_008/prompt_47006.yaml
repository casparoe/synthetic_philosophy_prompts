prompt: |-
  been reading rationalist blogs since the Overcoming Bias days and lurking on LessWrong since around 2010, and one fight that never dies in my corner of the internet (EA-adjacent) is whether giving is obligatory or above-and-beyond. philosophers apparently have a word for this — supererogation, acts that are good and praiseworthy to do but not wrong to skip. the saint and the hero territory, above duty but not duty.

  so heres my actual situation. I write the yearly "community impact report" for our local giving circle — about 80 people, most of them pledged 10% of income. every year the same fight breaks out over that report. some members give exactly 10% and clock out. others give 10% and then do tons extra: donate a kidney, take a pay cut to work directly at a charity, put in weekends volunteering. half the circle wants me to celebrate the extra folks (spotlight section, names, quotes about their sacrifice), the other half says that reading makes the 10%-only crowd feel like they're failing, and over the years its cost us a couple of quiet members who just stopped showing up. last week I got told to "figure out a policy" and I want it written down so it's not vibes every february.

  what I want from you: a procedure I can actually follow each year when writing this thing — the questions in order, what counts as a sufficient answer to each, where the procedure says stop / no spotlight, and where it hands the call back to me because it's genuinely a values question and no checklist can settle it. the superogation literature seems to have distinctions that would matter here — whether praise of the hero is comparative or absolute, whether celebrating the above-and-beyond implicitly condemns the merely dutiful, whether you can praise doing X without implying that not-doing-X is blameworthy — but I don't know which of those survive contact with a newsletter people skim in five minutes. so tell me which distinctions I actually need and which I can drop without losing the point.

  then run it on three cases from this year: (1) a member who gave her 10% and also ran our entire matching campaign, roughly 15 hours a month for free; (2) a member who gave 40% anonymously and would honestly be embarrassed by a spotlight — does the procedure have anything to say about praising people who don't want it, or is that pure judgment; (3) a member who gives exactly 10% and told me to my face that last year's report made her feel like a moral failure. I'd rather the procedure tell me something I don't like in at least one of these cases than have it always side with me. and be honest about what it can't do — I'm aware "write a policy" can just mean I move my own judgments one document over.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User Profile:** Long-time rationalist/EA-adjacent community member (since *Overcoming Bias* days, ~2010 LessWrong). This means they value precision, clear definitions, instrumental rationality, and are likely familiar with concepts like expected utility, signaling, and epistemic humility. They are skeptical of "vibes" and want a concrete algorithm/procedure.
      *   **The Problem:** Writing the annual "community impact report" for a giving circle (~80 people, mostly 10% pledgers).
      *   **The Conflict:** Tension between celebrating "supererogatory" acts (extra giving, volunteering, career sacrifice) vs. maintaining inclusivity for those who just meet the baseline (10%). Highlighting heroes risks shaming the dutiful. Ignoring heroes risks losing motivation/recognition for high impact.
      *   **The Goal:** A written procedure/checklist for deciding what goes in the "spotlight" section of the report.
      *   **Constraints:** Needs to handle specific philosophical distinctions (supererogation, praise vs. blame) but remain practical for a newsletter. Needs to be tested on three specific cases. Needs to admit limitations (where judgment is still required).

  2.  **Deconstruct the Philosophical Core (Supererogation):**
      *   *Definition:* Acts that are good to do but not wrong to omit.
      *   *The Trap:* Praise often functions comparatively. If A is praised for doing X, and B did not do X, B feels inferior.
      *   *The Distinction:* Absolute praise ("This is amazing") vs. Comparative praise ("This is better than what you did").
      *   *The Rationalist/EA Angle:* Incentive structures matter. If shaming the 10%ers causes them to leave (drop in total utility), the spotlight is net negative. If celebrating the 40%ers inspires others to give more (increase in total utility), it's net positive.
      *   *Key Insight:* The newsletter isn't just a record; it's an *intervention*. It changes future behavior.

  3.  **Drafting the Procedure (The Algorithm):**
      *   *Goal:* Maximize community retention + total impact, minimize alienation.
      *   *Step 1: Consent.* (Crucial for Case 2). No spotlight without permission.
      *   *Step 2: Categorization.* Is this act *within* the expected norm (10%) or *outside* it (supererogatory)?
      *   *Step 3: Framing.* How is it described? Avoid language that implies obligation.
      *   *Step 4: Impact Check.* Does highlighting this specific act risk making the baseline feel insufficient?
      *   *Step 5: The "Stop" Condition.* When to abort the spotlight.

      *Refining the Steps:*
      *   Need to make it actionable.
      *   Need to incorporate the "comparative vs. absolute" distinction the user asked about.
      *   Need to address the "moral failure" feedback (Case 3).

      *Revised Procedure Structure:*
      1.  **Consent Gate:** Mandatory.
      2.  **Baseline Separation:** Distinctly separate "Meeting Pledge" from "Extra."
      3.  **Framing Test:** Does the text imply obligation?
      4.  **Retention Risk Assessment:** (The hard part).
      5.  **Decision Node:** Spotlight, Mention without Spotlight, or Omit.

  4.  **Addressing the Philosophical Distinctions:**
      *   *Comparative vs. Absolute:* In a newsletter, *all* praise is implicitly comparative because readers compare themselves to the text. You can't drop this. You have to manage it.
      *   *Praise without Blame:* Possible linguistically ("We are grateful for..." vs. "Everyone should..."), but psychologically difficult.
      *   *Which to keep:* Keep the "Obligation Implication" check. Drop the deep metaphysical debate on whether it's *truly* supererogatory; focus on whether it's *perceived* as obligatory.

  5.  **Running the Cases:**
      *   *Case 1 (10% + 15hrs/mo work):* This is supererogatory labor. High visibility. Risk: Makes 10% + 0hrs feel lazy. *Procedure outcome:* Spotlight allowed *if* framed as "gift of time" distinct from "duty of money."
      *   *Case 2 (40% + Anonymous):* Consent Gate stops this immediately. *Procedure outcome:* No spotlight. Aggregate data only.
      *   *Case 3 (10% + Hurt by last year):* This triggers the "Retention Risk" or "Community Health" check. *Procedure outcome:* This is the "Hand back to judgment" moment. The procedure can't solve interpersonal hurt, but it can mandate a broader framing to dilute the comparison.

  6.  **Refining the Output Tone:**
      *   Match the user's rationalist vernacular (utility, incentives, epistemic status, Schelling points).
      *   Be direct, not fluffy.
      *   Acknowledge the "Goodhart's Law" risk of metrics.
      *   Admit where the procedure fails (the "values question").

  7.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Maybe suggest removing the spotlight entirely?
      *   *Correction:* No, the user asked for a procedure to *write* the report, implying the report (and spotlight) will exist. The goal is to manage the conflict, not dissolve the group (though that's an option).
      *   *Initial thought:* Use a utilitarian calculus (will this save more lives?).
      *   *Correction:* Too hard to measure. Use proxy metrics (retention, explicit feedback).
      *   *Crucial Add:* The distinction between "Celebrating Impact" vs. "Celebrating Sacrifice." Celebrating sacrifice is dangerous (implies pain = virtue). Celebrating impact is safer but still comparative. Let's focus on *contribution type*.

  8.  **Finalizing the Procedure Steps:**
      1.  **Consent Check.** (Hard stop).
      2.  **Category Classification.** (Pledge vs. Extra).
      3.  **Framing Audit.** (Sacrifice vs. Opportunity).
      4.  **Baseline Reinforcement.** (Explicitly validate the 10%).
      5.  **The "Hurt Member" Clause.** (Specific handling for known friction).

  9.  **Drafting the Response:** (Iterative refinement for clarity and tone).
      *   *Intro:* Acknowledge the history (OB/LW). Validate the supererogation frame.
      *   *The Distinctions:* Cut the metaphysics. Keep the *pragmatics* of praise.
      *   *The Procedure:* Numbered, binary decision points where possible.
      *   *The Cases:* Apply the procedure rigorously.
      *   *The Limitations:* Be honest about the "policy as displaced judgment" risk.

  10. **Final Polish:** Ensure the distinction between "duty" (10%) and "supererogatory" (extra) is the Schelling point for the newsletter structure. Make sure Case 3 gets a nuanced handling (it shouldn't just veto everything, but it should trigger a specific mitigation).

  *(Self-Correction on Case 3)*: If a member explicitly said they felt like a failure, highlighting *anyone* else might trigger them again. The procedure needs to account for *known* sensitivities vs. *general* risk. I will add a step for "Known Friction."

  *(Self-Correction on Philosophy)*: The user asked which distinctions survive contact with a newsletter.
  *   *Keep:* Praise implies obligation (psychological fact).
  *   *Drop:* Whether the act is *objectively* supererogatory (irrelevant if perceived as duty).
  *   *Keep:* Aggregate vs. Individual praise.

