  6. Closing thought.

  *Ready to write.*
answer: |-
  This is a sophisticated formulation of what political theorists call the **All-Affected Principle (AAP)**. Your background gives you a distinct advantage in spotting the structural weaknesses: you recognize that "causality" in social systems is just as noisy and path-dependent as in climate systems, and that introducing a threshold ($T$) to filter signal from noise looks suspiciously like parameter tuning.

  You asked to treat this as a model stress-test. I will rank the defeaters from **Fatal** (structural collapse) to **Awkward** (implementation friction), analyze how a defender would respond, and then address the question of falsifiability.

  ### I. The Defeaters (Ranked)

  #### 1. Fatal: The Epistemic/Technocratic Trap
  In climate modeling, you have governing equations (Navier-Stokes, thermodynamics) that allow you to calculate causality, even if uncertainty is high. In politics, there are no governing equations for "social impact."
  *   **The Problem:** To determine *who* is affected by Decision $D$, you must first run a causal model of society. Who builds that model? If it is the current demos, you have presupposed the boundary you are trying to solve (the regress). If it is a panel of experts (like you), you have replaced democracy with epistocracy.
  *   **Why Fatal:** It inverts the democratic logic. Instead of the people deciding their fate, an algorithm or expert panel decides who "the people" are for each vote. This undermines the very legitimacy the principle seeks to secure.

  #### 2. Fatal: Institutional Instability (The "Fluidity" Problem)
  Democracy requires not just legitimacy, but continuity. Institutions (courts, legislatures, bureaucracies) rely on a stable principal-agent relationship.
  *   **The Problem:** If the demos changes for every decision (zoning vs. emissions), there is no stable "principal" to hold the "agent" (government) accountable over time. You cannot have a career politician, a stable party system, or even a coherent budget process if the electorate reconstitutes itself every morning based on the causal ripple of the day's docket.
  *   **Why Fatal:** It renders the mechanism of representation impossible. A government accountable to everyone for everything is accountable to no one for anything.

  #### 3. Critical: The Threshold Tuning (Parameter Sensitivity)
  You identified this yourself. In modeling, if you tune a parameter until the output matches your intuition, you have overfit the model.
  *   **The Problem:** If $T$ is set low, the butterfly effect enfranchises the globe for local decisions (paralysis). If $T$ is set high, it excludes vulnerable minorities whose stakes are high but causal leverage is low (tyranny).
  *   **Why Critical:** There is no non-arbitrary way to set $T$ without smuggling in a prior normative judgment about who *should* be included. The causal criterion claims to be descriptive/empirical, but the threshold makes it normative.

  #### 4. Critical: The Coercion Objection (Rival Model Performance)
  The leading rival is the **All-Subjected Principle**: those subject to coercive authority should have a say.
  *   **The Problem:** Your model enfranchises the unaffected but coerced (e.g., a prisoner whose rights are violated by a law they had no say in, but whose material interests are barely "affected") and excludes the affected but uncoerced (e.g., a foreigner impacted by your trade policy but not subject to your laws).
  *   **Why Critical:** Many argue democratic legitimacy stems from autonomy (freedom from arbitrary will), not welfare (outcomes). If I am forced to obey, I deserve a vote, regardless of whether the outcome helps or hurts me. Your model misses the specific wrong of *subjection*.

  #### 5. Awkward: Temporal Asymmetry (Unborn vs. Dead)
  *   **The Problem:** You note the unborn count. But the dead are also causally affected (reputation, will execution, legacy). Why does the causal arrow of time break the symmetry?
  *   **Why Awkward:** It requires a metaphysical add-on (future interests exist, past interests don't) that isn't derived from the causal criterion itself.

  #### 6. Awkward: Competence vs. Stake
  *   **The Problem:** A toddler is causally affected by zoning. A tourist is affected by traffic laws.
  *   **Why Awkward:** You must graft a "capacity" constraint onto the "stakes" constraint. This suggests the causal criterion is necessary but not sufficient, weakening its claim to be the *sole* boundary generator.

  ---

  ### II. Defender's Response: Concede or Wave Off?

  If you were debating a committed proponent of the AAP (like Robert Goodin or Ludvig Beckman), here is how they would handle your critique:

  *   **On Threshold Tuning:** They would **concede** this is a cost but argue it is a *feature*. They would claim $T$ is not a fixed parameter but a variable to be determined through *deliberation*. The question "Who is affected?" is itself a political question to be debated by the provisional demos.
      *   *Verdict:* This saves the theory from arbitrariness but surrenders the "scientific/objective" high ground you were aiming for. It admits the boundary is political, not causal.
  *   **On Institutional Instability:** They would **wave this off** by distinguishing between *routine* politics and *constitutional* moments. They might argue for a "presumptive" fixed demos for daily business, with the causal principle acting as a veto or review mechanism for specific transboundary issues (like climate treaties).
      *   *Verdict:* This turns your radical model into a patch for the standard model. It loses predictive power but gains viability.
  *   **On the Epistemic Trap:** They would **concede** the risk but argue the current system (fixed borders) is *worse*. At least the causal criterion points in the right direction, even if implementation is messy.
      *   *Verdict:* A "lesser of two evils" argument. Acceptable in policy, weak in principle.

  ---

  ### III. Predictive Power: Where Does Your Model Win?

  You asked if this position predicts anything rivals do not. Yes. It generates specific verdicts in edge cases where fixed-constituency and coercion models diverge.

  **Case 1: Climate Treaties (Your Home Turf)**
  *   *Fixed Constituency:* Only citizens of signatory nations vote. (Result: Future generations and non-citizens excluded).
  *   *Coercion Model:* Only those subject to the treaty's enforcement mechanisms. (Result: Excludes those in non-signatory nations who still suffer the warming).
  *   *Your Causal Model:* Enfranchises everyone in the causal chain of emissions/impact.
  *   *Verdict:* **Your model wins.** It captures the moral intuition that a Bangladeshi farmer should have a say in US emissions policy. This is the strongest empirical fit for your theory.

  **Case 2: Local Zoning (NIMBYism)**
  *   *Fixed Constituency:* Only residents of the town vote.
  *   *Coercion Model:* Only those legally bound by the zoning code.
  *   *Your Causal Model:* Includes near-neighbors in the next town over who suffer traffic/noise, but excludes distant strangers.
  *   *Verdict:* **Mixed.** It correctly identifies regional externalities, but in practice, it creates a "veto by neighborhood" problem that makes housing construction impossible. It predicts *gridlock* better than *justice*.

  **Case 3: Criminal Justice**
  *   *Fixed/Coercion:* The defendant and the state (via jury/representatives).
  *   *Your Causal Model:* Includes the victim, the victim's family, the neighborhood affected by crime rates, and potentially the perpetrator's family.
  *   *Verdict:* **Your model loses.** Expanding the demos for criminal sentencing based on "stakes" leads to mob justice or vengeance, violating rights-based constraints. The coercion model (subject to the law) handles this better.

  ---

  ### IV. The Unfalsifiability Verdict

  You asked: *Has it been qualified into unfalsifiability? And is that a defect?*

  **1. Is it unfalsifiable?**
  In the strict Popperian sense, yes. Because the threshold $T$ and the definition of "interest" can be adjusted post-hoc to match any intuitive outcome, the theory is resilient to counter-examples. If a result looks wrong, you tweak $T$. If the regress looks bad, you add a "provisional boundary" clause.

  **2. Is that a defect?**
  Here is where your scientific intuition needs a philosophical translation.
  *   **In Science:** Unfalsifiability is a defect because the goal is *truth-tracking* about the empirical world. A model that fits any data explains nothing.
  *   **In Normative Philosophy:** The goal is not truth-tracking but **Reflective Equilibrium**. We are trying to align our abstract principles with our considered moral judgments.
  *   **The Verdict:** Unfalsifiability is not a defect here; **lack of guidance** is.
      *   If your principle can justify *any* boundary depending on how you tune $T$, it is not a decision procedure; it is a description of a debate.
      *   However, if you frame it not as an algorithm but as a **heuristic for critique**, it retains value. It doesn't tell you *exactly* where the line is, but it successfully flags when the current line is *wrong* (e.g., "Why does this factory get to pollute this river without the downstream neighbors voting?").

  ### V. Final Assessment

  Your instinct that the problem is "under-specified" is correct, but your proposed specification (causal stakes) inherits the complexity of the system it tries to measure.

  *   **Strengths:** It is the only model that handles global public goods (climate) correctly. It dissolves the arbitrary nature of borders.
  *   **Weaknesses:** It is computationally intractable for daily governance and vulnerable to technocratic capture (who calculates the stakes?).
  *   **Recommendation:** Do not discard the model, but downgrade its status. Treat it not as the **Constitution** (the operating system), but as the **Auditor** (the error-checking script).
      *   Use fixed constituencies for stability and administrative feasibility.
      *   Use your Causal-Stakes Criterion to identify when those fixed constituencies are generating illegitimate externalities (like carbon emissions) that require special corrective mechanisms (like international tribunals or future-generation guardians).

  You have built a high-resolution climate model for a political system that currently runs on a slide rule. The model is more accurate, but the hardware can't run it. The philosophical task is not to prove the model right, but to design the hardware that could.
