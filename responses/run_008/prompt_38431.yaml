      *   **Problem 2: The Selectivity Problem (3 + 4 + 5).** You claim causation is objective/norm-free (3), determined by CD (4), but Gardener causes while Queen doesn't (5). CD makes Queen a cause. Norms usually fix this, but you banned norms. How do you get selectivity objectively?
