      *   *Tension C (Agent-Independence):* (6) Rain/Famine + (2) Positive Ontology. Similar to Tension A. If there are no absences, what is the "absence of rain"?
      *   *Tension D (The "Same Relation" Claim):* (1) says omission causation is the *same relation* as positive causation. (2) says relata for omissions don't exist. A relation usually requires relata.

