      1.  **Selectivity (3+4+5):** This is the standard "profligacy" objection. It's the hardest to solve without giving up Realism or CD.
      2.  **Relata/Ontology (1+2):** Can be dissolved by clarifying the nature of the "relation," but requires careful footwork.
