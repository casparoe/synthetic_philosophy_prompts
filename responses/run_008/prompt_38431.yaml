          *   *Severity:* Critical.

      *   **2 & 6 (Positive Ontology vs. Agent-Independence):**
          *   *Conflict:* Medium/High. If there are no absences, "absence of rain" is just a way of speaking about the positive facts (e.g., high pressure system). But if (1) says omissions *really* cause, and (6) says this happens without agents, we need to explain what the cause *is* ontologically if it's not an absence.
          *   *Severity:* Moderate (can be solved by paraphrase), but clashes with (1)'s robustness.

      *   **1 & 4 (Omissions vs. Counterfactuals):**
