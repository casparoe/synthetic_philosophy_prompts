      *   *Decision Theory:* Deutsch/Wallace attribution is correct. The summary is fair.
      *   *Self-Locating Uncertainty:* Sebens/Carroll attribution is correct.
      *   *Criticism:* Adrian Kent is indeed a major critic, though his criticisms often target the ontology itself. The specific criticism that "axioms do the work" is more commonly associated with *Price*, *Kent*, or *Baker*. Kent is a good shorthand, but maybe mention Huw Price or David Baker for precision on the "circularity" charge.
