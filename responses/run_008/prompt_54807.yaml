          *   Epistemic Status: High probability based on statistical frequency alone. No specific causal story for individual tickets.

      *   **Preface Paradox:**
          *   Structure: Author believes $p_1, p_2, ... p_n$ (claims in the book). Author also believes "At least one claim in this book is false" (based on humility/fallibility).
