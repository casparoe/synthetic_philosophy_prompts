          *   *Nominalism (Constructivism):* Generations are just bins. Marketing tools. Arbitrary cut-offs.
          *   *The Journalist's Dilemma:* You write as if they are Real (explanatory power) but defend them as Nominal (just a shorthand).

      *   **2. The Causal Mechanism (Why 1981-1996?):**
