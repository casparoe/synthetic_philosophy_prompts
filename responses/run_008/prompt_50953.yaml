answer: |-
  Here is the diagnosis you are asking for, stripped of the survey material you both already know.

  **1. The Diagnosis: Two Questions Under One Heading**
  Your working hypothesis is correct, but it requires a sharper distinction. This is not merely a verbal disagreement, nor is it purely substantive. It is a **category error generated by historical conflation**. You and your friend are using "The Demarcation Problem" to refer to two distinct tasks that 20th-century philosophy erroneously bundled together.

  *   **Task A (The Epistemic Question):** What are the intrinsic logical or methodological features that distinguish reliable knowledge-producing practices from unreliable ones? (This is your friend's concern, inherited from Popper/Lakatos).
  *   **Task B (The Institutional Question):** How do social institutions allocate authority, funding, and curricular space to specific communities of practice? (This is your concern, evidenced by the courtroom and the grant panel).

  Popper and Lakatos believed that solving Task A would automatically solve Task B. They assumed that if we could define the *essence* of science, the *authority* of science would follow naturally. Laudan's "Demise" argument successfully demonstrated that Task A, as formulated (necessary and sufficient conditions), is ill-posed. However, he assumed that dissolving Task A would make Task B disappear or become trivial. You have correctly identified that Task B remains urgent even if Task A is abandoned.

  The impasse persists because your friend thinks you are asking for a solution to Task A (which she agrees is dead), while you are asking for a justification for Task B (which she thinks is merely sociological, not philosophical).

  **2. The Residue of the Popper–Lakatos–Laudan Sequence**
  The residue is not in the retrospectivity of progressiveness, nor strictly in the gap between theories and practices. The residue is in the **conflation of epistemic virtue with institutional legitimacy.**

  *   **Popper** located legitimacy in logical form (falsifiability).
  *   **Lakatos** located legitimacy in historical trajectory (progressiveness).
  *   **Laudan** located the error in assuming "science" carries epistemic weight.

  The leftover problem is that Laudan was right about the *epistemology* but too deflationary about the *sociology*. When a judge rules on *Kitzmiller v. Dover*, they are not asking, "Is intelligent design logically falsifiable?" (Task A). They are asking, "Does this community of practice command the epistemic trust required for state-sponsored education?" (Task B).

  The "residue" is the need to explain how **epistemic trust** is stabilized without recourse to essentialist definitions. The Popper–Lakatos sequence failed because it tried to ground institutional authority in ahistorical logic. The Laudan sequence failed because it assumed that once the logic was gone, the authority question would dissolve into simple evidential ranking. It does not, because institutions cannot evaluate every claim *de novo*; they must rely on proxies (credentials, peer review, methodological norms).

  **3. The Courtroom Verdict: Alive or Redscribable?**
  Does the courtroom's need show the project is alive? **Yes, but not the project Popper started.**

  The judge's job can be redescribed, but not in a way that makes the category do *no* work. The category "science" in a courtroom functions as a **boundary marker for a trust network**, not a label for a set of true sentences.
  *   **The User's Insight:** You are right that "weakly confirmed" does not do the work. A weakly confirmed scientific theory (e.g., string theory) still belongs in the science classroom; a strongly confirmed non-scientific claim (e.g., "murder is wrong" or "this historical document is authentic") does not.
  *   **The Redescription:** The judge is not demarcating *truth* from *falsehood*. They are demarcating *scientific authority* from *religious or philosophical authority*. This is not a logical distinction but a **jurisdictional** one.

  Therefore, the courtroom need does not validate Popper's criterion; it validates the necessity of **Boundary-Work** (a la Thomas Gieryn). The "Demarcation Problem" in the courtroom is not a philosophical puzzle to be solved but a rhetorical and legal boundary to be policed. The project is "alive" only if we redefine it as the study of how scientific authority is constructed and defended, not how it is logically grounded.

  **4. Is the Question Hard or Ill-Posed?**
  You asked for honesty on this.
  *   **The Essentialist Demarcation Problem (Task A):** This is **ill-posed**. There is no set of necessary and sufficient conditions that captures all and only scientific practices across history without excluding legitimate science or including pseudoscience. Pursuing a new criterion here is a category mistake.
  *   **The Functional Demarcation Problem (Task B):** This is **hard**. It requires a theory of how institutions manage epistemic risk. It is not ill-posed, but it is not solvable by a philosophical "criterion." It is solvable only by a hybrid of philosophy, sociology, and policy analysis.

  Your friend is right that if demarcation is merely "institutional bookkeeping," Popper and Lakatos wasted their careers. But they didn't waste them; they were attempting to solve Task A to secure Task B. The tragedy is that Task A is impossible. The deflation is not that the *need* is unreal, but that the *foundation* they sought does not exist.

  **5. What Would Count as Progress?**
  Progress will not come from a new criterion (e.g., a tweaked falsifiability or a Bayesian threshold). That is the trap you both stepped into. Progress would look like one of the following:

  1.  **A Formal Settlement of the Deflationary View:** A rigorous argument showing *why* Task A is ill-posed that satisfies the intuition behind Task B. We need to explain why institutions *feel* like they need an essentialist definition even if they don't have one. (Wittgensteinian family resemblances applied to institutional legitimacy).
  2.  **A Shift to "Epistemic Trust" Metrics:** Instead of asking "Is this science?", we ask "Does this practice participate in the self-correcting mechanisms that warrant public trust?" This moves the focus from the *product* (the theory) to the *process* (the community norms). This preserves the "sorting by kind" you want (methodological naturalism is a norm of the community, not a logical property of the theory) without requiring ahistorical criteria.
  3.  **A Recognition of Context-Dependence:** A general settlement that accepts demarcation is **polythetic**. The criteria for a courtroom (legal admissibility) differ from a grant panel (potential utility) which differ from a curriculum committee (pedagogical appropriateness). Progress is admitting there is no *single* Demarcation Problem, but a family of legitimacy problems.

  **Summary**
  You are arguing past each other because you are fighting over a corpse (Essentialist Demarcation) while trying to keep a patient alive (Institutional Legitimacy).
  *   **Concede to your friend:** There is no ahistorical, algorithmic test for "Science." Laudan won that round.
  *   **Hold your ground:** Institutions still require boundary maintenance, and "evidential strength" is insufficient for jurisdictional sorting.
  *   **The Synthesis:** The "Demarcation Problem" should be retired as a search for logical criteria and revived as a study of **Epistemic Authority**. The verdict is not "This is Science," but "This community is granted the authority to speak on nature."

  The impasse breaks when you admit that the "category" you want is not a natural kind, but a **social kind**. It is real, it does work, but it is not the kind of thing Popper thought it was.
