answer: |-
  # ASSIGNMENT BRIEF: ADVERSARIAL COLLABORATION ON TAXATION AND ENTITLEMENT

  **To:** The Libertarian Participant; The Social Democrat Participant  
  **From:** Discussion Group Facilitator  
  **Date:** October 26, 2023  
  **Subject:** Term Project Specification — Mapping the Disagreement

  ## 1. CONTEXT AND PURPOSE

  For the past two years, this group has hosted a debate regarding the moral status of taxation. The discussion has reached a stable equilibrium: two opposing views, neither yielding ground.

  *   **The Libertarian Position:** Persons own themselves. Holdings acquired through labor and exchange without violating a Lockean proviso have moral character prior to legal convention. Forcibly extracting a share of earnings is continuous with forced labor. The burden of proof lies on those who claim otherwise.
  *   **The Social Democrat Position:** What counts as a "holding" is fixed by a legal order (currency, registry, courts) that no one opted into. There is no pre-political fact of the matter about what portion of GDP is "yours." Taxation is a decision about the framework's terms, not a unilateral taking from outside it.
  *   **Shared Concessions:** Both sides accept that actual states waste and abuse revenue; that no existing citizen has literally consented to the current regime; and that the slogan "taxation is theft" cannot be settled by pointing at the worst policies each side dislikes.

  The goal of this assignment is **not** to determine who is right. The goal is to produce a **Cartography of Disagreement**. A reader should finish your document knowing exactly where the two views touch and exactly where they shear apart. You are to produce a single co-authored document. If you cannot agree on the wording of a section, you must note the failure to agree as a data point.

  ## 2. DELIVERABLE FORMAT

  Your joint document must consist of exactly four sections, adhering to the following constraints.

  ### Section I: Shared Premises (The "Both Can Sign" List)
  *   **Format:** A numbered list of claims.
  *   **Constraint:** Each claim must be **substantive**. A claim is vacuous if a third party who learned nothing else about your views would not learn something true about the world or morality from it. (e.g., "Bad policies are bad" is vacuous. "State capacity is required to enforce property rights" is substantive.)
  *   **Requirement:** Both participants must sign off on every item. If you cannot find 5 substantive shared claims, you must explain in an appendix why the overlap is so small.

  ### Section II: The Disagreement Table
  *   **Format:** A table with three columns: *Topic*, *Libertarian Characterization*, *Social Democrat Characterization*.
  *   **Constraint:** **Vetted Phrasing.** The person holding the view must approve how their own view is stated in their column. The *opponent* must approve that the statement is a fair representation of the disagreement.
  *   **Goal:** Eliminate straw-manning. If the Libertarian says, "I believe X," the Social Democrat cannot write, "The Libertarian believes X is evil." They must write, "The Libertarian believes X."

  ### Section III: Cruxes and Falsifiable Predictions
  This is the core of the assignment. You must identify the sub-questions such that settling one would move at least one party. You are required to address the following four **Mandatory Crux Topics**. For each, you must provide:
  1.  **The Concrete Case:** A specific thought experiment or scenario (provided below).
  2.  **The Prediction:** Each side must write down, in advance, how they believe a neutral observer would judge the case.
  3.  **The Update Condition:** A statement of what belief would change if the prediction proved wrong.

  **Mandatory Crux Topics:**

  1.  **The Island Colony Case:**
      *   *Scenario:* 1,000 settlers unanimously adopt a constitution with progressive taxation. Generations later, grandchildren are born into this system. They never signed anything. Exit is physically possible but economically ruinous (nowhere else feasible to go).
      *   *Question:* Is taxing the discontented grandchildren theft, or something else?
      *   *Requirement:* Define the threshold of "feasible exit" that would change the Libertarian's verdict.

  2.  **The Compulsory Club Case:**
      *   *Scenario:* A state provides courts and national defense. A Libertarian admits they would purchase these services privately if the state did not provide them. The state charges a compulsory fee equivalent to the market rate.
      *   *Question:* Is this fee theft? If yes, is the slogan "Taxation is Theft" actually about the *uses* of revenue (redistribution) rather than taxation *per se* (funding public goods)?
      *   *Requirement:* The Libertarian must specify if there is *any* compulsory fee structure that is not theft. The Social Democrat must specify if there is *any* use of funds that would render the fee theft.

  3.  **The Resource-Rent Test:**
      *   *Scenario:* A tax is levied solely on the unimproved value of land and natural resources (LVT). No one's labor created the land.
      *   *Question:* Can a thoroughgoing libertarian accept this tax without contradiction? If so, does this reveal the dispute to be about *which tax bases* are legitimate rather than about taxation per se?
      *   *Requirement:* The Libertarian must state whether labor-mixing is the *only* source of entitlement. The Social Democrat must state if they view natural resources as collectively owned by default.

  4.  **The Semantic Test (Verbal vs. Substantive):**
      *   *Scenario:* Analyze the word "Theft."
      *   *Question:* Is the Libertarian using a moralized sense (taking what one has no entitlement to) and the Social Democrat a descriptive one (nonconsensual transfer)?
      *   *Requirement:* If you claim this disagreement is merely verbal, you must provide a reason for thinking no substantive question about *entitlement* hides behind it. (See Section IV).

  ### Section IV: Verbal vs. Substantive Disagreements
  *   **Format:** A short analytical section.
  *   **Constraint:** You must separate disagreements that are purely definitional from those that are about the world.
  *   **Warning:** A disagreement is **not** verbal simply because both sides use different words. It is only verbal if, upon clarifying the definitions, the substantive disagreement disappears.
  *   **Requirement:** If you list a disagreement as "Verbal," you must demonstrate that agreeing on the definition would cause at least one party to change their policy prescription or moral judgment. If the moral judgment remains different despite definitional agreement, the disagreement is Substantive.

  ## 3. RULES OF ENGAGEMENT

  1.  **No Sandbagging:** You may not sign the document if you feel your view has been misrepresented. However, you may not refuse to sign simply because the opponent's view is stated clearly and you dislike it.
  2.  **Pre-Commitment:** In Section III (Cruxes), predictions must be written *before* you argue the outcome. You cannot adjust your prediction after discussing the case.
  3.  **Burden of Proof:** Where the prompt specifies a burden of proof (e.g., Libertarian claim on forced labor), the text must reflect who bears it, not just what the claim is.
  4.  **Length:** Maximum 3,000 words. Brevity forces precision.

  ## 4. SUBMISSION

  Submit one PDF file with both signatures at the end. If you cannot agree on the text of Section I (Shared Premises), submit two separate appendices explaining the impasse. This will be treated as a significant finding in itself.

  ***

  **Facilitator's Note:** *I am not asking you to resolve the question "Is taxation theft?" I am asking you to resolve the question "What are we actually arguing about?" If you finish this assignment and still disagree, but you can perfectly predict each other's answers to the four Crux Cases, you have succeeded.*
