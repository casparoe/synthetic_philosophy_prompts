              *   Epistemicist: This creates a new, sharp semantic boundary for the legal term.
              *   Supervaluationist: This is a *precisification* imposed by fiat. It doesn't prove the natural language term had a sharp boundary prior.
              *   *Wait, need to align with the Crux.* The crux is about *natural language* vagueness. Legal cliffs are often used by Epistemicists to show sharp boundaries are coherent. Supervaluationists say that's a change in meaning.
