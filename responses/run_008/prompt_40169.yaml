          *   *Supervaluationist Claim:* There is no single $n$. Truth is relativized to precisifications. "True" means supertrue.
          *   *The "Heap" Wording:*
              *   Epistemicist: "There is a sharp boundary, but it is unknowable."
              *   Supervaluationist: "There is no sharp boundary; there is a penumbra where truth value is indeterminate."
              *   *Joint Phrasing:* We disagree on whether the sentence 'There is a sharp boundary between heap and non-heap' expresses a truth (Epistemicism) or a falsehood/category mistake (Supervaluationism).

      *   **Section 3: The Cruxes (Metaphysics vs. Semantics):**
          *   The prompt asks specifically about: "whether an unknowable sharp cutoff is a substantive fact about the world or an artifact of the semantics."
          *   Actually, both agree it's not "the world" (pebbles). It's about *semantics*. The disagreement is whether the semantics *determines* a unique extension (Epistemicism) or *underdetermines* it (Supervaluationism).
          *   Refinement: Is the cutoff a *fact* (Epistemicism) or a *fiction of precisification* (Supervaluationism)?

      *   **Section 4: Test Cases & Predictions (The Live Tests):**
          *   *Case 1: AI Intelligence Threshold.*
