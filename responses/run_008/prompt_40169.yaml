  # JOINT STATEMENT ON THE METAPHYSICS AND SEMANTICS OF VAGUENESS
  **An Adversarial Collaboration**

  **Authors:** [User Name] (Supervaluationist) & [Co-Moderator Name] (Epistemicist)
  **Date:** October 26, 2023
  **Context:** Concluding three years of debate originating in the "General Intelligence" thread of the *Philosophy Forum*.

  ## Preamble
  We, the undersigned, acknowledge that our disagreement regarding vagueness is not a result of confusion, but a fundamental divergence in logical and semantic commitments. This document serves to crystallize our three-year adversarial collaboration. We agree to treat the question of Artificial General Intelligence (AGI) not as a metaphorical example, but as a live empirical test case for our respective theories. We affirm that vagueness is a phenomenon of representation, not of reality, and we commit to the following structure of agreement, disagreement, and empirical prediction.

  ## I. Agreed Claims
  *The following propositions are endorsed by both parties. Disagreement lies only in the explanation of these phenomena, not their existence.*

  1.  **The Sorites Paradox is Valid but Unsound:** We agree that the Sorites argument (e.g., regarding heaps) is logically valid in classical terms. Therefore, at least one premise must be false. We reject the solution that denies the validity of the logic itself (e.g., rejecting Modus Ponens) unless absolutely forced by the semantics.
  2.  **Vagueness is Representational, Not Ontic:** We agree that vagueness is a feature of language, thought, or representation, not a feature of the external world. There is no "vague pebble." The ambiguity resides in the predicate "heap," "intelligent," or "bald," not in the objects to which they are applied.
  3.  **Higher-Order Vagueness is Genuine:** We agree that the boundary between the clear cases and the borderline cases is itself vague. There is no sharp line between the "definitely true" and the "borderline." Any theory that posits a sharp boundary between the determinate and the indeterminate without explaining its own unknowability is insufficient.
  4.  **The Competence of Speakers:** We agree that competent speakers of a language can be fully informed of all non-semantic facts (e.g., the exact number of grains in a pile, the exact parameters of a model) and still fail to agree on the application of a vague predicate. This failure is not due to cognitive deficit but is constitutive of vagueness.

  ## II. Residual Disagreements
  *The following statements capture the exact point of divergence. Each side accepts the wording below as an accurate characterization of the dispute.*

  **1. The Status of the Sharp Boundary**
  *   **The Claim:** "There exists a specific number $n$ such that a collection of $n$ grains is a heap, and a collection of $n+1$ grains is not a heap."
  *   **Epistemicist Affirmation:** We affirm this claim is **True**. The extension of the predicate "heap" is sharp. Our inability to identify $n$ is a form of ordinary ignorance, constrained by the nature of knowledge.
  *   **Supervaluationist Denial:** We deny this claim is **True** (and deny it is False). The claim lacks a truth value. There are many admissible ways to make "heap" precise; on some precisifications $n$ is the cutoff, on others $m$ is. There is no single fact of the matter.

  **2. The Nature of Truth in the Penumbra**
  *   **The Claim:** "For a borderline case, the sentence 'This is a heap' is either true or false, even if we cannot know which."
  *   **Epistemicist Affirmation:** We affirm. Bivalence holds. Ignorance does not imply indeterminacy.
  *   **Supervaluationist Denial:** We deny. In the penumbra, bivalence fails. Truth is defined as *supertruth* (truth on all admissible precisifications). A borderline sentence is neither supertrue nor superfalse.

  **3. The "Heap" Boundary Wording**
  *To ensure clarity on the core metaphysical disagreement, we adopt the following specific phrasing:*
  *   **Epistemicist:** "When I deny that there is 'no sharp boundary,' I mean that the semantic facts of our language usage determine a unique extension, making 'There is a sharp boundary' a true proposition about English."
  *   **Supervaluationist:** "When I affirm that there is 'no sharp boundary,' I mean that the semantic facts of our language usage *underdetermine* the extension, making 'There is a sharp boundary' a false proposition about English."

  ## III. The Cruxes
  *We identify the following specific theoretical pivots upon which our disagreement turns.*

  **Crux 1: The Nature of the Cutoff (Fact vs. Artifact)**
  *   **The Question:** Is an unknowable sharp cutoff a substantive fact about semantic usage, or an artifact of forcing classical semantics onto indecisive language?
  *   **Epistemicist Position:** It is a **substantive fact**. The meaning of a term is determined by complex usage patterns that ultimately settle on a unique extension, even if that settlement is unstable and unknowable to users.
  *   **Supervaluationist Position:** It is a **semantic artifact**. The sharp cutoff appears only when we artificially select one "precisification" from the set of admissible ones. To treat one precisification as *the* meaning is to misunderstand how vague terms function.

  **Crux 2: The Explanation of Ignorance**
  *   **The Question:** Why can we not know the boundary?
  *   **Epistemicist Position:** **Margin-for-Error Principles.** Knowledge requires safety. If you knew $n$ was the cutoff, your belief would have to be safe from error in nearby cases. But in nearby cases, the usage shifts, making the belief unsafe. Thus, the boundary is unknowable.
  *   **Supervaluationist Position:** **Semantic Indecision.** We cannot know the boundary because there is nothing *to* know. The ignorance is not epistemic (lack of access to a fact) but semantic (lack of a fact to access).

  ## IV. Test Cases and Predictions
  *We agree to treat the following cases as bearing on the Cruxes. We record our predictions in advance.*

  ### Case A: The AI Capability Threshold (The Original Dispute)
  **Scenario:** A language model undergoes incremental architectural updates. We apply the predicate "Generally Intelligent" (AGI).
  *   **Epistemicist Prediction:** There exists a specific update version $V_k$ such that $V_k$ is AGI and $V_{k-1}$ is not. If we had perfect access to the semantic facts of "Intelligence," we could identify $V_k$. The fact that the community debates this indefinitely confirms the *unknowability*, not the *non-existence*, of the boundary.
  *   **Supervaluationist Prediction:** There is a range of versions $[V_a, V_b]$ where "This model is AGI" is neither supertrue nor superfalse. Different admissible precisifications of "Intelligence" (e.g., prioritizing reasoning vs. prioritizing autonomy) will yield different cutoffs. If the community settles on a specific version, it will be a *stipulation* (a new precisification), not a *discovery* of the pre-existing boundary.

  ### Case B: Legal Cliffs (Firm-Size Regulations)
  **Scenario:** A law states regulations apply to firms with 50 or more employees.
  *   **Epistemicist Prediction:** This demonstrates that sharp boundaries are coherent and functional. The law creates a new semantic fact. It supports the view that natural language *could* have sharp boundaries even if we don't impose them by fiat.
  *   **Supervaluationist Prediction:** This demonstrates the difference between *vague natural language* and *precise legal stipulation*. The law does not reveal a pre-existing sharp boundary in "firm size"; it replaces the vague term with a precise one. This supports the view that sharpness requires artificial precisification.

  ### Case C: Margin-for-Error Reasoning
  **Scenario:** We analyze a subject's confidence in applying a predicate near the boundary.
  *   **Epistemicist Prediction:** As subjects approach the boundary, their confidence should drop, but their judgments will still track a hidden binary reality. Experimental data showing "fuzzy" judgment probabilities is actually data about *credence* regarding a binary fact.
  *   **Supervaluationist Prediction:** As subjects approach the boundary, the *truth conditions* themselves become unstable. Experimental data showing "fuzzy" judgments reflects the *semantic reality*, not just epistemic credence. We predict that forcing subjects to choose "True/False" will yield random distributions in the penumbra, not just low confidence.

  ## V. Assessment of Verbal Dispute
  *We have analyzed whether our dispute is merely verbal.*

  **Joint Diagnosis:**
  We agree that a portion of our dispute is verbal, specifically regarding the definition of **"True."**
  *   If "True" is defined as "Classical Bivalent Truth," the Epistemicist is correct by definition, but the definition begs the question against the Supervaluationist.
  *   If "True" is defined as "Assertible under all admissible interpretations," the Supervaluationist is correct by definition, but risks changing the subject on classical logic.

  **Substantive Core:**
  However, we agree the dispute is **not merely verbal** regarding the **Law of Excluded Middle (LEM).**
  *   The Epistemicist commits to LEM holding for vague predicates ($P \lor \neg P$ is always true).
  *   The Supervaluationist commits to LEM failing for vague predicates in the penumbra (neither $P$ nor $\neg P$ is supertrue).
  *   **Test:** We agree that the AI Case (Case A) bears on this. If the community eventually agrees that a specific model was the "first" AGI only after *stipulating* a definition, the Supervaluationist is vindicated (sharpness was imposed). If the community converges on a specific model as the "first" AGI *without* stipulation, relying on intuition alone, the Epistemicist is vindicated (intuition tracks the hidden sharp line).

