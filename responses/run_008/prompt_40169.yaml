      *   **Constraint:** The AI case (LLM intelligence) must be treated as a live test, not a joke.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Epistemicism (Williamson):** Vagueness is ignorance. There *is* a fact of the matter (a sharp boundary), but we cannot know it due to semantic instability/margin-for-error principles. $P(n)$ is true, $P(n+1)$ is false, for some $n$.
      *   **Supervaluationism (Fine/Keefe):** Vagueness is semantic indecision. There are many "admissible precisifications." A statement is *supertrue* if true on all precisifications, *superfalse* if false on all, and neither if it varies. No sharp boundary in reality/semantics, only sharp boundaries *within* specific precisifications.
      *   **Common Ground:** Both reject ontic vagueness (vagueness in the world/pebbles). Both accept the Sorites paradox is a real problem needing a solution. Both accept higher-order vagueness (vagueness about where the boundary/penumbra lies).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and joint. "Joint Statement on the Metaphysics and Semantics of Vagueness."
      *   **Introduction:** Acknowledge the history (3 years, forum, AI thread). Set the tone (adversarial collaboration).

