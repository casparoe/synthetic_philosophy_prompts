              *   Epistemicist Prediction: There is a specific update/parameter count where it flips from False to True. We just can't find it.
              *   Supervaluationist Prediction: There is a range where "It is generally intelligent" is neither supertrue nor superfalse. Regulatory/Practical decisions will impose a sharp line, but semantic truth won't match it.
          *   *Case 2: Legal Cliffs (Firm Size).*
