prompt: |-
  i run a student reading group on Gödel Escher Bach — 12 people, mostly 2nd/3rd year CS majors, one 90-minute session. next meeting is on the MU puzzle and jumping out of the system (jootsing, as Hofstadter calls it). my problem: half of them already know the MU answer (the thing about counting the I's, the mod-3 invariant), so if I just run the original puzzle they'll smugly recite the solution and feel nothing. so I want you to design the session around a *fresh* string-rewriting system of your own invention — same flavor as MIU (one start string, a handful of rewrite rules, a target string the group has to try to derive) but different enough that nobody can pattern-match straight to MU. crucially I want the target to be UNREACHABLE, and for them to discover that and prove it to themselves without ever being told. so you'll need to pick rules + start string + target where you can actually name the invariant that makes the target unreachable — do that check yourself before handing it to me, dont give me a system where the target is secretly derivable, that would be mortifying mid-session — but keep the invariant findable by a group of smart students with whiteboards in roughly 40 minutes. then the second half: once they've concluded "this string just can't be derived", I want them to feel the joots, the move of stepping outside the derivation game and saying something about the game that no derivation inside it could ever say. my half-baked idea is oracle tokens — each team gets a few they can spend on yes/no questions answered from outside the system ("is any string of length over 50 reachable?", stuff like that) — but im honestly not sure the incentives work, so you tell me whether to keep it, fix it, or throw it out. constraints: no lecture up front, nobody hears the words "formal system" or "invariant" until the debrief; no real money, payoffs have to be tokens or points or bragging rights; and i'd want the debrief to map each moment of the activity onto the part of the idea it was supposed to produce, plus what will predictably go wrong the first time I run this and how to handle it. also be honest with me about which feature of jootsing a classroom exercise just cannot reproduce — my guess is it's something about how the real jump feels when you genuinely don't know whether there IS an outside view to jump to, but you'd know better than me. one stretch goal, only if it fits in the 90 minutes without cramming: a second system that *looks* like the first one but where the target IS reachable, so they get the visceral lesson that from inside you can't tell the difference between "stuck because it's impossible" and "stuck because i'm bad at this". your call on whether that overloads the session or is the best part of it.
