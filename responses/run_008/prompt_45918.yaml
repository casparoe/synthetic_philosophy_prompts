          1.  Retributivism (Desert-based, not consequence-based).
          2.  Skepticism of Deterrence (Evidence weak, shouldn't calibrate by consequences).
          3.  Abolition of Death Penalty (Absolute, even for atrocities).
          4.  Mitigation for Psychopathy/Severe Mental Disorder (Lack of moral grasp reduces desert).
          5.  Recidivism Enhancements (Repeat offenders deserve more *because* they deserve more, not danger).
          6.  No Punishing the Innocent (Absolute, even to save lives/stop riots).
      *   **Roommate's Claim:** The views don't hang together; consequentialism is being smuggled in.
      *   **Task:** Audit the consistency of these views. Identify tensions (real vs. apparent). Rank tensions by severity. Explain what would have to give and the cost.
      *   **Tone:** Analytical, philosophical, fair, not condescending.

  2.  **Initial Assessment of the Views (Philosophical Mapping):**
      *   (1) is Classic Retributivism (Kantian/Hegelian flavor).
      *   (2) reinforces (1) by rejecting Utilitarian/Consequentialist justifications.
      *   (6) is a standard deontological constraint often associated with retributivism (rights-based).
      *   (4) is compatible with retributivism (culpability condition). If you can't understand the wrong, you aren't fully responsible.
      *   (5) is a specific retributive claim (progressive loss of mitigation / cumulative desert).
      *   (3) is the outlier. Classic retributivism (*lex talionis*) often supports the death penalty for murder ("a life for a life"). Abolitionism is usually consequentialist (risk of error, brutality) or rights-based (right to life trumps desert).

  3.  **Identifying Tensions:**

      *   **Tension A: Retributivism (1) vs. Death Penalty Abolition (3).**
          *   *Why:* Pure retributivism suggests proportionality. If the worst crime is murder, the proportional suffering is death (or life imprisonment). To say "never kill" regardless of desert looks like a consequentialist constraint (e.g., "state killing is bad for society") or a rights-based constraint that overrides desert. If desert *justifies* punishment, why does it fail to justify the ultimate punishment for the ultimate crime?
          *   *Severity:* High. This is the most obvious philosophical friction.
          *   *Roommate's Point:* This is likely where she sees "smuggled consequentialism" (e.g., "killing is bad *outcome*").

      *   **Tension B: Retributivism (1) vs. Recidivism (5).**
          *   *Why:* Why does a past crime increase the *desert* for a new crime? The harm caused by Crime B is the same. The culpability *at the time of Crime B* is the same. Retributivists argue over this (von Hirsch vs. others). Some say past record shows higher culpability (defiance of state), others say it's purely consequentialist (dangerousness).
          *   *Severity:* Medium. There are retributive arguments for this (cumulative principle), but they are contested.

      *   **Tension C: Retributivism (1) vs. Mental Disorder Mitigation (4).**
          *   *Why:* Actually, these fit well together. Retribution requires moral agency. If agency is compromised, desert is reduced.
          *   *Severity:* Low/None. This is standard retributive theory.

      *   **Tension D: No Innocent Punishment (6) vs. Pure Retributivism (1).**
          *   *Why:* Actually, these fit well. Punishing the innocent violates the core premise (they don't *deserve* it).
          *   *Severity:* Low/None.

      *   **Tension E: Deterrence Skepticism (2) vs. Recidivism (5).**
          *   *Why:* If you reject calibrating by consequences (2), you must justify (5) purely by desert. As noted in B, this is hard. If (5) is actually based on dangerousness, it contradicts (2).
          *   *Severity:* Medium.

  4.  **Deep Dive into the "Smuggled Consequentialism" Charge:**
      *   The roommate likely targets (3) Death Penalty. A pure retributivist (like Kant) supports the death penalty. To reject it *without exceptions* usually implies a concern about the *nature* of the act (killing is inherently wrong regardless of desert) or the *consequences* (slippery slope, error). If the user says "State should never kill," that sounds like a rule-consequentialist or rights-based constraint, not a desert-based one.
      *   The roommate might also target (5) Recidivism. If the harm is the same, why more punishment? Often the answer is "to stop them doing it again" (consequentialist). The user says "because they deserve more." This is philosophically possible (the "progressive loss of mitigation" theory) but requires heavy lifting to explain *why* the desert increases without referencing future risk.

  5.  **Ranking the Tensions:**

      *   **#1 Severity:** (1) Retributivism vs. (3) Death Penalty Abolition. This is the biggest theoretical clash. Pure retribution demands proportionality. Absolute abolition denies the proportional response to the worst crime.
      *   **#2 Severity:** (1) Retributivism vs. (5) Recidivism Enhancements. Hard to justify increased desert for the same act without smuggling in "dangerousness" (consequentialism).
      *   **#3 Severity:** (2) Deterrence Skepticism vs. (5) Recidivism. If you don't care about outcomes, (5) is very hard to sustain.

      *   *Note on (4) and (6):* These are actually consistent with retributivism. (4) addresses culpability (a precondition for desert). (6) addresses the necessary condition for desert (guilt).

  6.  **Developing the Solutions/Costs:**

      *   *Fixing #1 (Death Penalty):*
          *   Option A: Accept DP for worst crimes. (Cost: Moral revulsion).
          *   Option B: Shift to "Limiting Retributivism." Desert sets limits, but other values (human rights) determine the actual penalty. (Cost: Purity of retributive theory).
