answer: |-
  **The Sand Bench**

  **Characters:**
  **ELIAS** (Epistemicist)
  **SARA** (Supervaluationist)
  **ALEX** (Lab Assistant)

  **Setting:** *A physics lab bench. A conical pile of sand sits on a digital scale. ALEX holds tweezers. ELIAS and SARA stand on either side.*

  **ALEX:** Grain 99,000 removed. Is it a heap?

  **ELIAS:** Yes.

  **SARA:** Yes.

  **ALEX:** Grain 90,000 removed. Is it a heap?

  **ELIAS:** Yes.

  **SARA:** Yes.

  **ALEX:** Grain 50,000 removed. Is it a heap?

  **ELIAS:** Yes.

  **SARA:** Indeterminate.

  **ELIAS:** *(Turning to Sara)* You're halting the march. I'm not. Grain 49,999?

  **ALEX:** *(Looking at Elias)* You're sticking with "yes"?

  **ELIAS:** Until I say "no." There is a number *n* such that *n* grains are a heap and *n-1* are not. I don't know *n*. You don't know *n*. But there is an *n*.

  **SARA:** And that's where we part. For me, "heap" is a cluster of precise meanings—precisifications. Some say 50,000 is a heap; some say it isn't. If "heap" is true on every admissible precisification, it's true. If false on every, it's false. In the middle, it's neither.

  **ALEX:** *(Pausing, tweezers hovering)* This deadlock is slowing down the data. Here's a house rule to break it: Let's count it as a heap whenever every ordinary person, shown the pile in ordinary circumstances, would still call it one. Evaluate that.

  **SARA:** It's an attempt at a precisification. You're fixing the meaning by fixing the usage. But "ordinary person" is itself vague. Which ordinary person? What circumstances? You haven't resolved the indeterminacy; you've just restated it at one remove.

  **ELIAS:** I disagree. It yields sharp results in practice. If we poll a thousand people, there will be a specific grain where the consensus flips. That suggests ordinary speakers are implicitly comfortable with boundaries, even if they can't articulate them. However... *(he frowns)* ...I dislike that the boundary is defined by what people *say*, not by the metaphysical reality of the heap itself. It makes "heap" a psychological predicate, not a physical one.

  **ALEX:** So the rule is devoured. Fine. Back to the grains. Elias, you claim there's a fact of the matter about grain 49,999. What fact? The scale reads the same. The shape is identical to the previous state.

  **ELIAS:** The fact is simply that the predicate applies. You're asking for a physical change to match a semantic shift. But words carve the world. Just because the cut is invisible doesn't mean it isn't there. If there were no sharp boundary, logic breaks. The Law of Excluded Middle fails. I'd rather accept an unknowable cutoff than abandon classical logic.

  **SARA:** I keep the Law of Excluded Middle. "Either it is a heap or it is not" is still true. But I deny Bivalence. It's not true that every statement must be true or false. Your "unknowable cutoff" does no work. It changes with how the grains are counted, arranged, or lit. It explains nothing about how we actually use the word. Why posit a magic grain that vanishes the heapness?

  **ELIAS:** Because your view contains a boundary too. Somewhere, a state went from being one where "that's a heap" was *definitely* true to one where it was *indeterminate*. You've only moved the sharp line one level up. You have a boundary between the true and the gap. Is that boundary sharp?

  **SARA:** It's a line in our decision to stop using a word, not a line in the world. I'm mapping the logic of our language, not the topology of sand. If I admit a gap, I preserve the intuition that no single grain makes the difference. You force a difference where there is none.

  **ELIAS:** And I force it because "no fact of the matter" is explanatory emptiness. Alex was writing down "yes" or "no" after every grain. What fact made "yes" the wrong thing to write in the borderline stretch? If there's no fact, why is "indeterminate" any better than a guess?

  **SARA:** Because "indeterminate" acknowledges the limits of the concept. You're treating "heap" like "prime number." It isn't. It's a tool for navigation, not a mirror of nature. But I will concede this: my apparatus gives no guidance to anyone who actually has to decide a borderline case. If you're a janitor deciding whether to sweep it, my theory tells you nothing.

  **ELIAS:** And I will concede this: my position makes "heap" unlike almost every other predicate in the language. It requires a metaphysical sensitivity we don't possess. We are blind to the very boundary that makes our sentences true.

  **ALEX:** *(Stops removing grains)* So you agree on the blindness, but disagree on whether there's something to see.

  **ELIAS:** Precisely. There is a fact. We are just cut off from it.

  **SARA:** There is no fact. The question loses its grip.

  **ALEX:** Then we're done. What's the last grain you both agree on?

  **SARA:** Grain 60,000. Definitely a heap.

  **ELIAS:** Agreed. Definitely a heap.

  **SARA:** And grain 10,000?

  **ELIAS:** Definitely not.

  **SARA:** Agreed.

  **ALEX:** So the disagreement is only about the middle third.

  **ELIAS:** The middle is where the philosophy lives.

  **SARA:** The middle is where the philosophy dies.

  **ALEX:** *(Writes "End" on the clipboard)* I'm sweeping it up.
