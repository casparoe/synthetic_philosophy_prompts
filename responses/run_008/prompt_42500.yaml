      *   If *Ante Rem*, the positions *are* the objects. So "3" denotes *the* third position. There *is* a fact about which object (the third position). The user might be confusing "which set" with "which object."
      *   *Correction:* The user says "no fact... which particular objects our numerals denote." If they are *Ante Rem* structuralists, numerals denote *positions*. Positions are objects. So there *is* a fact. The user likely means "no fact which *set-theoretic* objects."
