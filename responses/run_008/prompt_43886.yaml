          *   *Claim:* "Three options: circle, forever, stops." (Agrippan trilemma).
          *   *Assessment:* Generally correct intro. Slight simplification on "every belief" (some might be self-justifying, which is the point of the problem), but accurate enough for intro level. The link to the three options is clear.

      *   **Section 2: Foundationalism.**
          *   *Characterization:* Chain stops at basic beliefs. Justified but not by other beliefs. "Justify themselves." Descartes/Incorrigible sensations.
          *   *Objection:* "Any criterion you use at the basic level either applies to itself or doesn't, and if it doesn't, the criterion is self-defeating."
