              *   *Obj:* This is the *Criterion Problem* (or a version of the Sellarsian Dilemma/Arbitrariness objection). It's a standard objection. Phrasing is a bit clunky ("applies to itself") but captures the spirit of the challenge to the "given."

      *   **Section 3: Coherentism.**
          *   *Characterization:* Justification is holistic/web-like. Not linear.
