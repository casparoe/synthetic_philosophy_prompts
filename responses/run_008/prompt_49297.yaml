answer: |-
  1. The inside view relied on Utzon's specific architectural vision and engineering assurances that the unique shell geometry was solvable within the initial seven-million-dollar budget and 1963 deadline. This belief was based on treating the project as a singular creative endeavor rather than a statistical instance of public infrastructure construction.

  2. An outside view using the reference class of major public infrastructure projects from that era would have predicted significant cost overruns and delays based on historical base rates of similar public works. However, selecting this reference class over "innovative architectural competitions" is itself a substantive judgment, meaning the outside view does not fully escape the need for insider interpretation.

  3. Because construction began before the roof geometry was solved, the project lacked a defined scope, which strains both views since they typically assume a known task to forecast. Neither view offers a principled method for forecasting the cost of solving an unsolved scientific or engineering problem alongside the construction itself.

  4. The building's cultural success does not count against the outside view, because that framework explicitly claims to predict implementation metrics like cost and schedule, not aesthetic or economic value. Since the outside view remains silent on whether the overrun was worth the result, asking if success refutes it is ill-posed unless you distinguish predictive accuracy from normative worth.

  5. This episode ultimately fails to test the outside view fairly because the undefined scope makes accurate baseline forecasting impossible, regardless of the perspective taken. It suggests that epistemic modesty requires acknowledging when a project is too novel for any reference class to be meaningful, rather than blindly applying statistical averages.
