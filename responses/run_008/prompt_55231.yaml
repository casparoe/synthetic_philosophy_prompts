answer: |-
  This is an exceptionally sharp observation, and you are right to feel that unease. The tension you have identified sits at the very heart of modern sentencing theory in England and Wales. Your tutor's binary of retributivism versus consequentialism is a useful heuristic, but the guilty plea discount is where those two theories collide most violently in practice.

  To reconstruct the implicit theory behind the discount, we must look at the *Sentencing Council Guidelines* and the *Criminal Justice Act 2003*. The official position is indeed a hybrid: it claims to reward remorse (retributive/mitigatory) while simultaneously seeking efficiency (consequentialist). However, if we dissect the mechanics, we find that the practice is structurally consequentialist, dressed in retributive clothing.

  ### 1. Reconstructing the Implicit Theory

  The practice operates on a **mixed theory**, but the weighting is unequal.

  **The Consequentialist Commitments (The Engine)**
  Certain aspects of the discount strictly require consequentialist logic. A retributivist, who believes punishment must be proportionate to the harm done and the offender's culpability at the time of the offence, cannot logically justify a sentence reduction based *solely* on the saving of public funds.
  *   **Resource Efficiency:** The primary driver for the *scale* of the discount (up to one-third) and the *sliding scale* based on timing (earliest opportunity vs. late) is the administrative need to clear court lists and save taxpayer money. This is pure utilitarianism: maximizing the greatest good for the greatest number by reducing state expenditure.
  *   **Victim Welfare:** Sparing a victim the ordeal of testifying is a consequentialist good. It prevents future harm (trauma) to a third party. While compassionate, this is not about the offender's *desert*; it is about the collateral consequences of the trial process.
  *   **The 'Timing' Mechanism:** The fact that the discount diminishes the later you plead is administrative, not moral. Remorse does not necessarily decay linearly over time. This sliding scale presupposes that the state has an interest in securing the plea *quickly*, which is a consequentialist aim.

  **The Retributivist Accommodation (The Cover)**
  A retributivist can accommodate parts of the practice, but only by reinterpreting what the plea signifies.
  *   **Mitigation of Culpability:** A retributivist can argue that an offender who pleads guilty demonstrates acceptance of responsibility and remorse. This suggests a lower level of *ongoing* culpability compared to one who denies the offence and forces the state to prove what is already true. In this view, the offender is less blameworthy *now*, even if the offence was the same.
  *   **Rehabilitation:** Accepting guilt is often the first step towards rehabilitation. A retributivist concerned with moral reform (as opposed to pure 'just deserts') might view the plea as evidence that the offender is amenable to correction, thus warranting a lesser intervention.

  **The Underdetermined Elements**
  *   **The Quantum:** Why one-third? Why not 10% or 50%? Retributivism offers no metric for this. It is an arbitrary figure chosen to be 'attractive enough' to secure pleas (consequentialist calibration).
  *   **Strategic Pleas:** The system awards the discount even when the offender feels no remorse and is pleading guilty purely on legal advice to secure the reduction. Here, the retributive justification (remorse) is fictional, leaving only the consequentialist justification (efficiency).

  ### 2. Is the 'Discount not Tax' Framing Respectable?

  Philosophically, the distinction between a 'discount' and a 'trial tax' is largely semantic spin, though it carries legal weight.
  *   **The Official Line:** The baseline sentence is set for a conviction after trial. A guilty plea attracts a 'discount' from this baseline.
  *   **The Reality:** If two offenders commit the identical crime with identical culpability, but receive different sentences solely because one exercised their right to a trial, the one going to trial is effectively penalised for that choice.
  *   **Retributive Critique:** From a strict retributive standpoint, the 'tax' framing is more honest. The baseline should be the punishment deserved for the crime. Anything added because the offender asserted their rights is a penalty on those rights. The 'discount' framing attempts to mask this by treating the trial sentence as the 'normal' price, which presupposes that most people *should* plead guilty. This is a consequentialist assumption (pleading is the norm/trial is the exception) rather than a retributive one (trial is the right/plea is the concession).

  ### 3. The Strict Retributivist Test

  If a strict retributivist were appointed Sentencing Commissioner tomorrow, they would have to make significant changes. They would likely argue that punishment must track desert, and desert is fixed by the offence and the offender's moral blameworthiness.

  *   **Scrap the Automatic Discount:** They would abolish the automatic one-third reduction based on timing. Saving court time is irrelevant to moral desert.
  *   **Shrink the Mitigation:** They might retain a discretionary reduction for *genuine* remorse, but this would be assessed on evidence of contrition, not the date of the plea. This reduction would likely be smaller, as post-offence conduct usually carries less weight than the offence itself in retributive theory.
  *   **Redescribe the System:** They would insist that the 'baseline' sentence is what is deserved for the crime. Any reduction would be an act of mercy or recognition of reduced culpability, not a transaction for resources.

  Therefore, the current practice is **genuinely in tension** with itself. It uses retributive language (responsibility, remorse) to legitimise a mechanism that is fundamentally consequentialist (efficiency, resource management). It does not quietly rule out retributivism entirely, but it subordinates it to utilitarian aims.

  ### Conclusion

  Your intuition is correct. The practice presupposes that the state's interest in efficiency can override the principle of proportional punishment for the same offence. While a retributivist can find a foothold in the concept of remorse, the structure of the discount—its size, its timing, and its application to strategic pleas—relies on consequentialist logic to function. Without the need to save money and spare victims, there would be no systemic pressure to offer such a significant reduction.

  \answer{consequentialist}
