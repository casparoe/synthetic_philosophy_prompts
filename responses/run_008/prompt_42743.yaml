answer: |-
  **JOINT STATEMENT OF THE WORKING GROUP ON DOCUMENTARY AND MNEMONIC AUTHORITY**

  **Date:** October 24, 2023
  **To:** The Steering Committee, The Adversarial Collaboration Initiative
  **From:** The Record-First Caucus (Archivists and Documentary Historians) and The Memory-First Caucus (Social Memory Scholars and Community Representatives)

  **Preamble**
  After two years of mediation and a subsequent period of adversarial collaboration, the undersigned camps acknowledge that the tension between the documentary record and collective memory is not a problem to be solved by the victory of one framework over the other, but a structural feature of historical inquiry and public commemoration. We recognize that our disagreement is not merely semantic, nor is it total. We submit this statement to define the ground we share, the ground we contest, and the specific empirical or theoretical developments that would alter our respective positions.

  ### I. Agreed Claims
  *The following propositions are affirmed by both caucuses. They are intended to rule out caricatures of either position and establish a baseline for future inquiry.*

  1.  **On the Nature of Archives:** We agree that archives are not passive repositories of truth but active constructions. The documentary record reflects the administrative priorities, literacy rates, and power structures of the societies that produced it. Systematic silences regarding marginalized groups are a feature, not a bug, of standard archival accumulation.
  2.  **On the Nature of Memory:** We agree that collective memory is reconstructive, not reproductive. It is subject to telescoping (compressing timelines), confabulation (filling gaps with plausible details), and moral smoothing (aligning past events with present ethical frameworks). Memory prioritizes narrative coherence and group cohesion over chronological or empirical precision.
  3.  **On Distinct Functions:** We agree that the documentary record and collective memory serve different primary ends. The record is optimized for *verification and accountability* (establishing what happened in a legal or empirical sense). Collective memory is optimized for *identity and continuity* (establishing who we are in relation to what happened).
  4.  **On the Three Recurring Cases:** We agree that the following scenarios require specific protocols rather than blanket rules:
      *   **(a) The Perpetrator Archive:** In cases of alleged violence (e.g., massacres) where the only surviving contemporary records are produced by the alleged perpetrators, archival silence cannot be treated as definitive proof of non-occurrence.
      *   **(b) The Founding Myth:** In cases where community founding narratives (dates, heroes) conflict with administrative records, we agree that factual inaccuracy does not automatically negate the narrative's civic utility, nor does civic utility validate the factual claim.
      *   **(c) The Politicized Living Memory:** In cases where living memory has been reshaped by later political campaigns, we agree that the "truth" of the memory lies in its sociological impact on the community, even if its correspondence to past events is compromised.
  5.  **On the "Give Way" Question:** We agree that the question "Which should give way: memory or record?" is often malformed. The answer depends on the domain of application. A school curriculum, a court of law, a monument, and a history monograph have different epistemic requirements. We reject the notion that a single hierarchy of truth applies across all domains.

  ### II. Disagreements Table
  *The following table outlines precise points of divergence. Each statement is phrased such that the respective camp accepts it as a fair characterization of their stance.*

  | Domain of Dispute | Record-First Caucus Position | Memory-First Caucus Position |
  | :--- | :--- | :--- |
  | **1. Epistemic Weight of Silence** | Absence of contemporary documentary evidence creates a *prima facie* presumption against the occurrence of an event. The burden of proof rests heavily on oral tradition to overcome this absence. | Absence of contemporary documentary evidence, particularly in contexts of oppression, is often *evidence of suppression*. The burden of proof rests on the archive to explain its silence. |
  | **2. Mechanism of Correction** | When memory and record conflict, memory must yield in domains claiming factual authority (e.g., textbooks, museums). To do otherwise is to sanction falsehood. | When memory and record conflict, the record must yield in domains of community self-definition. To impose the record is to replicate the violence of the original erasure. |
  | **3. Definition of Accuracy** | Accuracy is defined as *correspondence*: the degree to which a claim matches verifiable data points from the time of the event. | Accuracy is defined as *fidelity*: the degree to which a claim captures the lived experience and emotional reality of the community, regardless of chronological precision. |
  | **4. The Risk of Error** | The greater risk is legitimizing myth. If we allow memory to override documents, we open the door to nationalist fabrication and historical revisionism. | The greater risk is epistemic injustice. If we demand documents validate memory, we silence those whom power prevented from writing, cementing historical apartheid. |

  ### III. Cruxes
  *These are the sub-questions upon which our disagreement turns. Settling these would require at least one camp to modify its core stance.*

  **Crux 1: The Probative Value of Archival Silence (Addresses Case A)**
  Is the absence of a massacre in the perpetrator's logs *positive evidence* that it did not happen (Record-First), or is it *neutral evidence* that is outweighed by consistent oral testimony (Memory-First)?

  **Crux 2: The Civic Function of Factual Error (Addresses Case B)**
  Does a demonstrably false founding date in a community narrative undermine the legitimacy of the community's political claims (Record-First), or is the factual error irrelevant to the legitimacy derived from the belief itself (Memory-First)?

  **Crux 3: Domain Separation (Addresses Case C & The "Give Way" Suspicion)**
  Is the conflict between memory and record resolvable by strictly segregating domains (e.g., "History books teach the record; Monuments teach the memory"), or does this segregation inevitably privilege the record as "real" history and relegate memory to "folklore," thereby reproducing the hierarchy we dispute?

  ### IV. Evidence, Predictions, and Falsification
  *For each Crux, we identify concrete cases or evidence types that bear on the question. We record our predictions and, crucially, what each camp would accept as evidence against its own position.*

  #### Regarding Crux 1: The Perpetrator Archive (Massacre)
  *   **Test Case:** Discovery of third-party contemporary records (e.g., missionary diaries, enemy military logs, diplomatic cables) regarding the alleged massacre.
  *   **Record-First Prediction:** If independent third parties who were present also fail to mention the event, the oral tradition is likely a post-war conflation or myth.
  *   **Memory-First Prediction:** Third parties may be geographically distant or socially excluded from witnessing the event; consistency across disjointed oral lineages is more robust than sporadic external documents.
  *   **Falsification Conditions:**
      *   *Record-First:* Will concede authority to memory if third-party records corroborate the *core* of the oral tradition (location/victim count) even if details differ.
      *   *Memory-First:* Will concede uncertainty if internal oral traditions show high variance on core details (e.g., location changes between tellings) without external corroboration.

  #### Regarding Crux 2: The Founding Narrative (Founding Date)
  *   **Test Case:** Archaeological or administrative proof that a "founding event" occurred 20 years later than the community celebrates, or never occurred as described.
  *   **Record-First Prediction:** Public institutions (schools, museums) must adopt the verified date. Continuing to teach the myth is malpractice.
  *   **Memory-First Prediction:** Public institutions should teach the myth *as* the founding story while annotating the discrepancy. Correcting the date severs the community from its symbolic anchor.
  *   **Falsification Conditions:**
      *   *Record-First:* Will accept the retention of the mythic date if data shows that correcting it causes measurable social harm (e.g., increased intergroup violence) without increasing historical literacy.
      *   *Memory-First:* Will accept the primacy of the verified date if data shows that the community itself desires the correction to align with a broader historical identity.

  #### Regarding Crux 3: Domain Separation (Monuments and Curriculum)
  *   **Test Case:** Implementation of "Dual-Labeling" on public monuments (e.g., a plaque stating the historical record alongside the community memory).
  *   **Record-First Prediction:** Dual-labeling confuses the public, leading to the conclusion that "truth is subjective," thereby eroding trust in empirical history.
  *   **Memory-First Prediction:** Dual-labeling validates the community's experience without lying, creating a "thick" truth that satisfies both empirical and social needs.
  *   **Falsification Conditions:**
      *   *Record-First:* Will endorse dual-labeling if visitor studies show that audiences successfully distinguish between "what happened" and "what is remembered" without conflating the two.
      *   *Memory-First:* Will reject dual-labeling (and concede that domain separation fails) if visitor studies show that the "historical record" label is consistently read by the public as the "official truth" that delegitimizes the memory label.

  ### V. Conclusion on the "Give Way" Question
  Our collaboration suggests that the Rapporteur's suspicion is partially correct: the question "Which should give way?" is often a category error. In legal and empirical historical contexts, the record must hold primacy for verification. In contexts of communal identity and commemoration, memory holds primacy for cohesion.

  However, a deeper crux remains unresolved (Crux 3). We cannot yet agree on whether these domains can be truly separated in the public square. The Record-First camp fears that legitimizing memory in public space erodes the concept of fact. The Memory-First camp fears that segregating memory to "culture" while reserving "history" for the archive perpetuates the exclusion that created the conflict. We agree to test this via the public pilot programs outlined in Section IV.

  **Signed,**

  *The Record-First Caucus*
  *The Memory-First Caucus*
