          3.  Cruxes (sub-questions that, if settled, would move a camp).
          4.  Evidence/Predictions (for each crux, concrete cases/evidence, predictions from both sides, including falsification conditions).
      *   **Calibration Cases:** Must address three specific recurring types:
          *   (a) Oral tradition of massacre vs. perpetrator records (silence/denial).
          *   (b) Founding narrative (date/event) vs. documentary record.
          *   (c) Living memory reshaped by politics vs. community identity.
      *   **Specific Suspicion to Test:** Is "which should give way?" the right question? Distinguish between revising history, community story, and public commemoration (monuments/curricula).
      *   **Tone/Register:** American English, formal, suitable for adoption by both camps.
      *   **Goal:** Move beyond adjudication to structured disagreement and testing.

  2.  **Deconstruct the Camps:**
      *   **Record-First:** Values empirical verification, contemporaneity, chain of custody. Worries about mythmaking, telescoping, political co-optation. Sees archives as the bedrock of accountability.
      *   **Memory-First:** Values lived experience, subaltern voices, the *function* of memory. Worries about archival bias, power dynamics in record creation, the violence of silencing. Sees memory as a form of truth (emotional/social) even if factually imprecise.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need substantive claims, not "both are important."
      *   *Claim 1 (Nature of Archives):* Archives are not neutral; they are products of power and selection. (Memory camp needs this, Record camp can accept if qualified as "institutional bias" rather than "invalid").
      *   *Claim 2 (Nature of Memory):* Memory is reconstructive and susceptible to distortion over time. (Record camp needs this, Memory camp can accept if qualified as "not rendering it useless").
      *   *Claim 3 (Function):* Archives serve accountability/verification; Memory serves identity/cohesion.
      *   *Claim 4 (The Cases):* Acknowledge the three calibration cases explicitly.
      *   *Claim 5 (The "Give Way" Question):* Address the prompt's suspicion. Acknowledge that context (curriculum vs. court vs. monument) matters.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to frame disagreements so both sides say "Yes, that is what I believe."
      *   *Point 1: Epistemic Weight.* Record-First: Absence of evidence is evidence of absence (prima facie). Memory-First: Absence of evidence is often evidence of suppression.
      *   *Point 2: Correction Mechanism.* Record-First: Memory yields to Document. Memory-First: Document yields to Memory (in specific social contexts).
      *   *Point 3: Purpose of Truth.* Record-First: Correspondence to past reality. Memory-First: Utility for present community survival/justice.

  5.  **Drafting - Section 3: Cruxes:**
      *   What actually divides them?
      *   *Crux 1:* Is archival silence regarding violence *probative* of non-occurrence, or *probative* of cover-up? (Addresses Case A).
      *   *Crux 2:* Does factual error in a founding myth invalidate its civic function? (Addresses Case B).
      *   *Crux 3:* Is the "truth" of a monument its historical accuracy or its current social meaning? (Addresses Case C & the "Give Way" suspicion).

  6.  **Drafting - Section 4: Evidence/Predictions:**
      *   Need concrete tests.
      *   *For Crux 1 (Massacre):* Discovery of non-perpetrator third-party records (diplomatic, missionary, enemy).
          *   Record-First Prediction: If third parties don't mention it, likelihood drops.
          *   Memory-First Prediction: Third parties might also be excluded or unaware; oral consistency across disjointed lineages counts more.
          *   Falsification: Record-First admits memory is valid if third-party corroboration appears. Memory-First admits caution if oral tradition varies wildly internally.
      *   *For Crux 2 (Founding):* Archaeological or administrative data.
          *   Record-First: Date must align with admin records.
          *   Memory-First: Date aligns with symbolic significance.
          *   Falsification: Record-First accepts dual dating. Memory-First accepts mythic status if proven factually wrong but retains symbolic value.
      *   *For Crux 3 (Monuments/Curriculum):* Public impact studies.
          *   Record-First: Misleading monuments cause historical ignorance.
          *   Memory-First: Accurate but alienating monuments cause social fracture.
          *   Falsification: Evidence that nuanced labeling satisfies both or satisfies neither.

  7.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Too legalistic? Needs to be formal but collaborative.
      *   *Constraint Check:* Did I include the three calibration cases? Yes. Did I address the "which should give way" suspicion? Yes, in the Agreed Claims and Crux 3.
      *   *Language:* American English.
      *   *Formatting:* Clear headings, tables, numbered lists.

  8.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe make the disagreements sound hostile.
      *   *Correction:* No, the prompt asks for wording *each camp would accept as a fair statement of its own view*. It needs to be steel-manned, not straw-manned.
      *   *Initial thought:* Focus heavily on the "truth" aspect.
      *   *Correction:* The prompt hints that the dispute might be verbal regarding *function* (monument vs. history book). I need to make sure Crux 3 captures this distinction sharply.
      *   *Check on Agreed Claims:* Ensure they aren't vacuous. Instead of "Archives have bias," say "Archives reflect the priorities of their creators, systematically excluding marginalized voices." Instead of "Memory changes," say "Memory undergoes narrative smoothing that prioritizes moral coherence over chronological precision."

  9.  **Final Review against Prompt:**
      *   (1) Numbered agreed claims? Yes.
      *   (2) Disagreements table? Yes.
      *   (3) Cruxes? Yes.
      *   (4) Evidence/Predictions/Falsification? Yes.
      *   Calibration cases (a, b, c) included? Yes.
      *   "Give way" suspicion tested? Yes.
      *   Formal register? Yes.

  10. **Final Polish:** Ensure the distinction between "Historical Record" (academic/archival) and "Public Commemoration" (civic) is clear, as that is likely the dissolution point for some conflicts. (Proceed to generate output).

  *(Self-Correction Note on "Falsification"):* The prompt asks for "what each would count as evidence against its own side." This is crucial for adversarial collaboration. I need to make sure the Record-First camp admits what would make them trust memory, and the Memory-First camp admits what would make them trust the archive.

  *(Refining the "Give Way" suspicion):* The prompt suggests the rapporteur suspects the question "which should give way?" is wrong. The document should test this. I will frame Crux 3 specifically around whether domain separation resolves the conflict.

  *(Final check on tone):* Ensure it sounds like a consensus document, not a manifesto. Use "We agree," "We acknowledge," "We diverge."

