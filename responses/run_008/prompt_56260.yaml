      *   *Inventory Risk:* Holding positions that move against you; hedging delta/vega.
      *   *Stale Quotes:* Quotes that don't reflect current info, get "picked off."
      *   *Mid vs. Fair Value:* The theoretical price vs. the quoted center.
      *   *Order Flow:* Liquidity/rebalancing (uninformed) vs. Informational (toxic).

  4.  **Drafting the Translation (Section 1):**
      *   *Goal:* Map the abstract epistemic concepts to the concrete P&L risks.
