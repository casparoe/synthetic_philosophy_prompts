      *   *The "Gotcha":* The desk intuition often relies on the existence of *irrational* noise traders or liquidity traders to justify the spread. The No-Trade theorem formalizes *why* you need those noise traders. If everyone was a rational MM with common priors, the spread would widen to infinity (no trade).
