      *   *What survives:* Adverse selection is the practical version of "informational asymmetry." Liquidity trading is the practical version of "non-informational shocks."
      *   *What distorts:* "Common Prior." On a desk, nobody shares a prior. Everyone has their own model. The "market" is the prior. This is a distortion. Philosophy assumes shared rationality; markets assume competing models.
      *   *What vanishes:* "Common Knowledge." On a desk, I don't know what you know. I infer it from flow. The epistemic state is hidden, not common.
      *   *The "Trade" mismatch:* Philosophers mean "speculative bet." Market makers see "flow." A lot of flow is non-speculative (client hedging). The No-Trade theorem says speculative trade shouldn't exist. The desk says speculative trade is the enemy (toxic flow), but liquidity trade is the lifeblood.

  6.  **Drafting the Pushback (Section 3):**
      *   *The User's Bias:* The user implies the philosophy is "thin" because the desk handles this stuff intuitively.
