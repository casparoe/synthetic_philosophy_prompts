      *   *Agreeing to Disagree:* If I see you hitting my bid, and I know you are rational, and I know we use the same model, I should update my mid. If I don't, and you know I haven't, we have a problem. In practice, this means "If you're lifting my offer, I assume you know something, so I widen my spread or move my mid."
      *   *Milgrom-Stokey:* "No speculative trade." Translation: If I know you're trading on info, I won't take the other side unless I'm paid enough (spread) to cover the adverse selection. If the spread is zero (efficient market), I don't quote. Trade only happens if you need to hedge (liquidity) and I take the inventory risk.
