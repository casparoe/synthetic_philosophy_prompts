answer: |-
  This is a fascinating problem because it touches on the core difficulty of historical ontology: we are trying to categorize a continuous, messy process of human adaptation into discrete binary states ("collapse" vs. "change"). Your intuition is actually quite sophisticated; you are implicitly wrestling with the difference between *political* dissolution, *economic* displacement, and *societal* simplification.

  As someone who works in the philosophy of history, I see your struggle as a conflict between three different definitions of "society" that are often conflated in pop-history:
  1.  **The State:** The government, ideology, and elite administration (e.g., the USSR, the Maya Kings).
  2.  **The System:** The economic and logistical network (e.g., Bronze Age trade, Roman coins).
  3.  **The People:** The demographic and cultural continuity (e.g., modern Maya, British peasants).

  Your gut verdicts suggest you are not defining collapse by the death of the *State* (otherwise USSR is a collapse) nor by the death of the *People* (otherwise Maya/Easter Island are not). You seem to be defining it by the failure of the *System* to sustain the previous level of complexity for the *People*.

  Here is a brainstorming breakdown of your cases, followed by two candidate principles.

  ### Brainstorming Your Intuitions

  *   **Roman Britain:** You call this collapse because the *infrastructure of daily complexity* vanished. Peasants didn't just get new bosses; they lost access to coins, heated floors, and imported goods. The "system" downgraded.
  *   **USSR:** You call this change because the *infrastructure of daily complexity* remained. Factories, trains, electricity, and bureaucracy persisted. The "system" was reorganized, not simplified.
  *   **Handloom Weavers:** This is a crucial control case. A specific *class* suffered a collapse of livelihood, but the *societal metabolism* around them accelerated. Collapse must be systemic, not sectoral.
  *   **Maya:** You accept this as collapse despite the slow speed and surviving population. This suggests "collapse" allows for cultural continuity, provided the *political-economic engine* that built the cities stops.
  *   **Easter Island:** You call this collapse despite survival. This implies that "collapse" can mean a forced reduction in carrying capacity or technological capability (no canoes/trees), even if the culture adapts to a lower energy budget.
  *   **Late Bronze Age:** The "partial" collapse of Egypt is key. It shows you recognize collapse is regional. A system can fail in Greece but hold in Cairo.

  ### Candidate Principle 1: The Sociopolitical Complexity Threshold

  This principle leans on the work of Joseph Tainter (*The Collapse of Complex Societies*), modified by your intuition about daily life.

  **Definition:** A collapse occurs when a society undergoes a **rapid, involuntary reduction in sociopolitical complexity**, resulting in a permanent loss of the capacity to solve problems through specialization, hierarchy, and information processing (e.g., writing, bureaucracy).

  **How it maps to your cases:**
  *   **Motivated by Roman Britain & Bronze Age:** In both, the ability to coordinate labor over distance vanished. No coins = no complex taxation. No writing = no complex administration.
  *   **Motivated by USSR:** The USSR did not lose complexity. The bureaucracy remained; the industrial base remained. It was a *transfer* of complexity, not a *reduction*.
  *   **Motivated by Handloom Weavers:** The broader society *increased* in complexity (industrialization), even if a specific guild lost status. Collapse must be net-negative for the region.
  *   **Motivated by Maya:** The "Divine King" system was a complexity engine. When it stopped, the region could no longer coordinate large-scale irrigation or monument building. The complexity threshold dropped.

  **Where this principle fails (The Honesty Check):**
  *   **Easter Island:** This principle struggles here unless we accept the contested "ecocide" narrative. If the islanders voluntarily stopped building statues to focus on food (as newer archaeology suggests), that is *adaptation*, not complexity loss. If you hold firm that Rapa Nui was a collapse, this principle requires you to prove they lost the *capacity* to build, not just the *choice* to build.
  *   **Speed:** You noted the Maya took centuries. This principle usually implies rapidity (Tainter argues collapse is fast). You may need to decouple "speed" from "collapse."

  ### Candidate Principle 2: The Contraction of the "Life-World"

  This principle is more phenomenological. It focuses on the horizon of expectation for the average person.

  **Definition:** A collapse occurs when the **network of dependencies shrinks significantly**, such that the average individual's access to resources, security, and cultural goods becomes more local, more fragile, and less diverse than that of their grandparents, without their consent.

  **How it maps to your cases:**
  *   **Motivated by Roman Britain:** A British peasant in 350 AD had access to goods from across the Mediterranean. By 450 AD, their world was their village. The network shrank.
  *   **Motivated by USSR:** A Soviet citizen in 1990 could buy goods from across the Union. In 1992, they could still buy goods (eventually), travel, and use electricity. The network changed partners (West instead of East Bloc) but did not necessarily shrink permanently for the average person.
  *   **Motivated by Easter Island:** If the "canoe collapse" is true, their world shrank from an oceanic network to a single island. That is a massive contraction of the life-world.
  *   **Motivated by Maya:** The trade networks linking the cities broke. The "world" of a Maya commoner became defined by local warlords rather than a regional state.

  **Where this principle fails (The Honesty Check):**
  *   **Handloom Weavers:** Their life-world definitely shrank (loss of income, status). To save this, the principle must specify *societal* contraction, not *individual* contraction. The British economy grew, so the *societal* life-world expanded, even if the weaver's shrank.
  *   **Greenland (The Prediction):** See below.

  ### Synthesis: The "Metabolic Downgrade" Principle

  Combining the two, here is the most precise principle that fits your gut:

  > **Principle:** A societal collapse is an **involuntary metabolic downgrade**. It happens when a region loses the energy capture and organizational capacity required to sustain its previous level of sociopolitical complexity, resulting in a smaller, simpler, and more localized system of human interaction that persists for generations.

  *   **Involuntary:** Rules out voluntary simplification (if it exists).
  *   **Metabolic:** Rules out purely political changes (USSR) where the energy/industry base remains.
  *   **Regional:** Rules out sectoral losses (Weavers).
  *   **Persists:** Rules out temporary crises.

  ### The Greenland Case: Prediction & Analysis

  You asked about the Norse in Greenland (Western & Eastern Settlements). By 1450, the settlements are empty.

  **Prediction based on the Principle:**
  This is a **Terminal Collapse**.
  Unlike the Maya (where the people stayed but the state changed) or Rome (where the people stayed but the system simplified), the Norse Greenland society ceased to exist entirely *as a distinct entity*.

  **However, there is a philosophical trap here:**
  If the Norse simply assimilated into the Inuit population (intermarriage, cultural adoption), did they collapse, or did they **transform**?
  *   **If they starved/died:** That is a biological collapse of the society.
  *   **If they sailed back to Europe:** That is an abandonment/migration, not necessarily a collapse of the *culture*, just the *settlement*.
  *   **If they became Inuit:** That is a transformation.

  **My Verdict using the Principle:**
  If the Norse maintained their identity (Christianity, European dress, farming) until the end and then failed to sustain it, it is a **Collapse**. They failed to adapt their "metabolism" (farming/sealing mix) to the cooling climate (Little Ice Age) and changing trade routes.
  *   *Nuance:* If recent isotope analysis is correct, they *did* adapt their diet (more seal), but refused to adopt Inuit hunting tech (fishing hooks/harpoons). This suggests a **Cultural Collapse** driven by identity rigidity. They chose cultural integrity over survival.
  *   *Conclusion:* Under the "Metabolic Downgrade" principle, Greenland is a collapse because the specific sociopolitical system (European-style farming/Church hierarchy) could not be sustained in that environment and vanished.

  ### Historiographical Caveats (Settled vs. Contested)

  You asked for honesty on the archaeology. Pop-history often smooths over these debates. Here is where the ground is shaky:

  **1. Easter Island (Rapa Nui)**
  *   **Pop-History Consensus (Diamond):** Ecocide. They cut all trees, couldn't build canoes, starved, fought civil wars, population crashed.
  *   **Current Academic Debate:** **Heavily Contested.** Archaeologists Terry Hunt and Carl Lipo argue there was no ecocide. They suggest rats ate the palm nuts (preventing regrowth), but islanders adapted by farming rock gardens. The statue moving didn't require massive timber. The population crash may have been due to European contact (disease/slavery) much later, not internal collapse.
  *   *Impact on your principle:* If the "Resilience" theory is right, Easter Island is **not a collapse**, it is a successful adaptation to limited resources until external shock. Your gut verdict relies on older data.

  **2. Classic Maya**
  *   **Pop-History Consensus:** Mysterious disappearance, everyone died.
  *   **Current Academic Debate:** **Settled (but nuanced).** It was a political collapse of the southern lowland kings, not a demographic disappearance. Millions of Maya survived. The "collapse" was the failure of the institution of Divine Kingship to manage drought and warfare.
  *   *Impact on your principle:* Fits your "Metabolic Downgrade" well. The *system* collapsed, the *people* persisted.

  **3. Roman Britain**
  *   **Pop-History Consensus:** Romans left, Saxons invaded, lights went out.
  *   **Current Academic Debate:** **Contested.** Some archaeologists argue for continuity. The "collapse" of pottery/towns might be a shift to wood/organic materials that don't survive, or a shift to local economies that didn't use coins. It may have been less "Mad Max" and more "decentralized."
  *   *Impact on your principle:* Still likely fits "Downgrade," but the speed and severity are debated.

  **4. Norse Greenland**
  *   **Pop-History Consensus:** They starved to death stubbornly.
  *   **Current Academic Debate:** **Contested.** Isotope studies show they ate more seal over time (adaptation). There is little evidence of violence. Some suggest a gradual exodus due to economic unviability (ivory trade collapsed) rather than starvation. There is also ongoing research into genetic admixture with the Inuit.
  *   *Impact on your principle:* If they left voluntarily because the trade wasn't worth it, is it collapse? Or just business closure? If they assimilated, it's transformation.

  ### Summary Advice

  Your intuition is tracking **Systemic Simplification** rather than **Political Termination**.
  *   **USSR** was a political termination without systemic simplification. (Change)
  *   **Weavers** were a sectoral termination within systemic growth. (Change)
  *   **Rome/Maya/Bronze** were systemic simplifications. (Collapse)
  *   **Easter Island** is the outlier in your list because the archaeology is shifting from "Collapse" to "Resilience." If you update your data, you might change your verdict here.
  *   **Greenland** is a Collapse of a specific *adaptation strategy* (European farming in the Arctic). Whether it counts as a societal collapse depends on whether you view the Norse as a distinct society that ended (Yes) or a population that merged (Transformation). Given they left no descendants maintaining their specific cultural complex, "Collapse" is the safer historical term.
