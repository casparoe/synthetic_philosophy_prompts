  3.  **Brainstorming the Underlying Logic (Philosophy of History Lens):**
      *   *Complexity Theory:* Collapse is often defined as a rapid loss of sociopolitical complexity (Tainter). This fits Rome, Bronze Age, Maya. It struggles with Easter Island (simple society?) and USSR (complexity didn't drop, just changed owners).
