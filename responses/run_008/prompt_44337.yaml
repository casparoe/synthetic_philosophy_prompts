      *   *User's friction:* Weavers vs. Rome.
      *   *Reason:* Weavers were a *sector* within a growing system. Rome Britain was the *whole system* of that region downgrading.
      *   *User's friction:* Maya speed.
      *   *Reason:* It's not about speed, it's about *irreversibility* of the loss of elite functions.

      *   *Proposed Principle:* **The Irreversible Reduction of Societal Metabolism.**
      *   *Definition:* A collapse occurs when a society undergoes a significant, involuntary reduction in its capacity to extract energy and organize complexity (division of labor, hierarchy, trade), resulting in a lower baseline of sociopolitical organization that persists for generations.
      *   *Differentiation:* USSR changed managers, metabolism stayed high. Weavers lost a job, but the metabolic system grew. Rome/Maya/Bronze lost the capacity to sustain the previous level.

      *   *Wait, Easter Island:* Did their metabolism reduce? Diamond says yes (no canoes). New research says maybe not (adapted). If user says "Collapse," they are likely using the Diamond narrative. I need to point out this tension.

      *   *Greenland:* If everyone dies/leaves, metabolism goes to zero. Is that collapse? Yes, terminal collapse. But if they assimilated into Inuit society, did they collapse or transform?

