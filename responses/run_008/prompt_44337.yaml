  6.  **Addressing Specific Historical Nuances (Crucial Step):**
      *   *Easter Island:* The "Ecocide" narrative (Diamond) is heavily contested now. Hunt & Lipo argue for resilience/adaptation, not collapse. Must mention this.
      *   *Maya:* "Collapse" is now seen as a political fragmentation, not demographic extinction. Southern lowlands vs. Northern.
      *   *Rome Britain:* "End of Roman Britain" is debated. Was it a collapse or a shift to local warlordism? Material culture disappearance is real, though.
