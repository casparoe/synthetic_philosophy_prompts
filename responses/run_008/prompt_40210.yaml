answer: |-
  This is a sophisticated debate that cuts to the core of cause prioritization within Effective Altruism (EA). Your housemates are arguing about the mechanical validity of the ITN framework versus its practical utility as a heuristic.

  Here is the move-by-move adjudication, followed by an overall verdict and a breakdown of what is consensus vs. contested in the actual literature (primarily from Open Philanthropy, 80,000 Hours, and GiveWell).

  ### Move-by-Move Adjudication

  **(1) Dev: Tractability and Neglectedness aren't independent; multiplying them double-counts.**
  *   **Verdict:** **Dev is technically right about the naive formula; Maya is right about the sophisticated model.**
  *   **Analysis:** In the "naive" ITN model (often taught to beginners), Tractability is "how solvable is this?" and Neglectedness is "how few people are working on this?" Dev is correct that these are dynamically linked: if something is highly solvable, capital flows in, reducing neglectedness. Treating them as static, independent multipliers can indeed distort results. However, Maya's defense anticipates the professional usage: in advanced prioritization (like Open Philanthropy's), Neglectedness is explicitly a proxy for *diminishing marginal returns*. They aren't independent variables; they are components of a single marginal value function.
  *   **Consensus Flag:** **Settled.** Practitioners acknowledge the correlation. The "multiplication" is understood as a heuristic for estimating marginal impact, not a rigid physical law. Dev is attacking a strawman of how experts *use* it, but a valid critique of how beginners *apply* it.

  **(2) Maya: Neglectedness is about marginal returns (what an extra dollar buys).**
  *   **Verdict:** **Maya is right.**
  *   **Analysis:** This is the standard economic defense of the framework. Neglectedness isn't just a headcount; it's a measure of where you are on the impact curve. If a cause is crowded, the next dollar usually does less work (diminishing returns). If Dev says this "correlates" with tractability, Maya is correct that this is a feature of the world, not a bug of the math.
  *   **Consensus Flag:** **Settled.** This is the standard definition used by 80,000 Hours and Open Philanthropy today.

  **(3) Dev: "Uncrowded = good value" assumes efficient markets. Donors are biased; crowded causes could be underrated.**
  *   **Verdict:** **Dev is half-right on the premise, wrong on the conclusion.**
  *   **Analysis:** Dev is correct that philanthropy is *not* an efficient market (unlike finance). Donors are biased toward salience. However, Dev's leap—that this means crowded causes might be the *underrated* ones—is counter to the evidence. The bias usually flows toward "sad puppies" or immediate disasters (high salience), leaving structural or unsexy problems (low salience) neglected. While it is *possible* a crowded cause is underrated, the heuristic "crowded = lower marginal value" holds because of diminishing returns, regardless of donor intelligence.
  *   **Consensus Flag:** **Settled.** The EA consensus is that philanthropy is inefficient, which is *why* neglectedness matters. Dev is right that it's not an efficient market, but wrong to imply this invalidates the neglectedness heuristic.

  **(4) Maya: Donor bias is exactly why neglected stuff is cheap; arbitrage persists because there's no profit signal.**
  *   **Verdict:** **Maya is right.**
  *   **Analysis:** This is the core argument for "cause arbitrage." In financial markets, if a stock is undervalued, traders buy it until the price corrects. In philanthropy, there is no profit mechanism to force donors into the most effective neglected causes. Therefore, the gap persists. Maya correctly identifies that Neglectedness captures the "discount" left by biased donors.
  *   **Consensus Flag:** **Settled.** This is the standard justification for why EA looks at global health or animal welfare over local arts funding.

  **(5) Dev: Importance (scale) decides everything. If you include future people, T and N are rounding errors.**
  *   **Verdict:** **Dev is right about the math, but this is a philosophical objection, not a mechanical one.**
  *   **Analysis:** If you accept "longtermism" (that the future contains astronomical value), then $Importance$ becomes so large that variations in Tractability and Neglectedness mathematically cannot outweigh it. A tiny chance of saving the future outweighs a guaranteed chance of saving a life today. Dev is correct that ITN often collapses into "Maximize Importance" under this worldview.
  *   **Consensus Flag:** **Genuinely Contested.** This is the "Longtermism vs. Near-termism" debate. Within the longtermist wing, Dev's point is accepted (scale dominates). Within the global health/near-term wing, this is seen as a bug of the framework (it creates "Pascal's Mugging" scenarios). It is not a flaw in ITN per se, but a flaw in how we estimate Importance.

  **(6) Maya: That's an input problem, not a framework problem. ITN is triage/heuristic, not precision.**
  *   **Verdict:** **Maya is pragmatically right.**
  *   **Analysis:** Maya correctly identifies that all decision frameworks suffer from "garbage in, garbage out." If your Importance estimate is speculative, your output will be speculative. Her defense of ITN as a checklist to prevent blind spots (e.g., "Don't forget to ask if anyone else is doing this") is how it is most robustly used. Dismissing it because inputs are hard to measure leads to "vibes-based" giving, which is demonstrably worse.
  *   **Consensus Flag:** **Settled.** Most practitioners view ITN as a decomposition tool to structure thinking, not a calculator that spits out a "True Number."

  ---

  ### Overall Verdict

  **Maya comes out more right overall.**

  Dev successfully identifies weaknesses in the *naive* application of ITN (specifically the independence assumption in Move 1 and the dominance of scale in Move 5). However, Maya correctly defends the *sophisticated* application of the framework (marginal returns, market inefficiency, and heuristic utility).

  Dev is arguing against ITN as a rigid formula (which it is, rarely, among experts). Maya is arguing for ITN as a structured way to think about marginal impact (which it is, primarily). Dev's critiques are valid warnings for beginners, but Maya's defenses reflect how the framework is actually used by organizations like Open Philanthropy.

  ### What Both of Them Are Missing

  1.  **Expected Value (EV) Formalism:** Neither explicitly anchored ITN to **Expected Value**. ITN is just a heuristic decomposition of $EV = Probability \times Impact$. Tractability is roughly Probability; Importance is Impact; Neglectedness adjusts for Marginal Utility. Anchoring it here would have resolved Move 1 and 2 immediately.
  2.  **"Room for More Funding":** Both missed the practical constraint on Neglectedness. A cause can be neglected, but if it has no "room for more funding" (no organizations capable of absorbing cash), Neglectedness doesn't matter. This is a key third variable often paired with ITN.
  3.  **Correlation Structures:** Dev mentioned correlation, but neither discussed *how* to model it. Advanced users don't just multiply $I \times T \times N$; they use "cause profiles" that explicitly model how tractability drops as funding increases (the diminishing returns curve).

  ### Consensus vs. Contested (Literature Check)

  Since you asked for a flag on what is settled vs. debated in the actual EA/prioritization community:

  *   **SETTLED CONSENSUS:**
      *   **Marginal Returns:** Neglectedness is a proxy for diminishing marginal returns (Maya's Move 2 & 4).
      *   **Market Inefficiency:** Philanthropy is not an efficient market; arbitrage opportunities exist (Maya's Move 4).
      *   **Heuristic Usage:** ITN is a thinking tool/checklist, not a precise calculator (Maya's Move 6).
      *   **Input Sensitivity:** The output is only as good as the inputs; speculative inputs yield speculative rankings (Maya's Move 6).

  *   **GENUINELY CONTESTED:**
      *   **Longtermist Dominance:** Whether the potential scale of the future *should* dwarf near-term concerns (Dev's Move 5). This is the biggest fracture line in the community.
      *   **Independence of Factors:** How tightly coupled Tractability and Neglectedness are in practice (Dev's Move 1). Some modelers treat them as distinct; others model them as a single "marginal impact" curve.
      *   **Quantification:** Whether you should attempt to score these 1-10 or keep them qualitative. (Trend is moving toward qualitative/comparative rather than numerical scoring).

  **Summary for your giving circle:** Maya is defending the framework as it is currently best-practiced by experts. Dev is critiquing the framework as it is often misused by beginners. You should adopt Maya's definition of the terms, but keep Dev's warnings in mind when you actually plug in numbers.
