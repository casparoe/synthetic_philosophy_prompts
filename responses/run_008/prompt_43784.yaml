answer: |-
  This is an exceptionally sharp diagnosis of the state of the literature. You have correctly identified that the "stuckness" you are experiencing is not a failure of your reading group, but a feature of the dialectic itself.

  Here is the diagnosis: **This is primarily (d) a disagreement about standards of success, which entails (b) that the two groups are answering different questions under one heading.**

  Your hypothesis is **mostly right, but it underestimates the metaphysical stakes of the circularity charge.** It is not merely that one side is doing metaphysics and the other methodology; it is that they disagree on whether a *reductive* metaphysics of causation is possible or even desirable.

  Here is the breakdown of why the debate stalls, why your hypothesis needs a slight tweak, and what would actually count as progress.

  ### 1. The Diagnosis: Reductive Analysis vs. Non-Reductive Explication

  The core friction is not about the extension of the word "cause" (who wins the verdict on the cases), but about the **direction of analysis**.

  **The Lewisian Project (Reductive Metaphysics):**
  David Lewis's goal was Humean Supervenience. He wanted to show how causal facts supervene on the "Humean mosaic" (the distribution of local, non-causal qualities across spacetime). For Lewis, a successful theory of causation must define causal facts *entirely* in terms of non-causal facts (specifically, similarity relations between possible worlds).
  *   **Standard of Success:** Reductivity. If your analysis presupposes causal notions (like "intervention"), you have failed to explain what causation *is*. You have just pushed the mystery back a step.
  *   **The Circularity Charge:** For a Lewisian, the interventionist circularity is fatal. If an "intervention" is defined as a change that affects $e$ *only through* $c$, that "only through" is a causal claim. Therefore, Interventionism presupposes the very thing it seeks to analyze.

  **The Woodwardian Project (Non-Reductive Explication):**
  James Woodward (in *Making Things Happen*) explicitly rejects the Lewisian standard of success. He argues that seeking a reductive analysis of causation in non-causal terms is a wild goose chase that has failed for 300 years.
  *   **Standard of Success:** Systematicity and Stability. The goal is to locate causal claims within a broader network of concepts (invariance, independence, modularity) such that we understand how they function in scientific reasoning.
  *   **The Circularity Concession:** Woodward *admits* his account is circular in the reductive sense. He argues it is a **virtuous circle**, not a vicious one. We understand causation by connecting it to other causal concepts (intervention, mechanism, invariance). This is a coherentist epistemology, not a foundationalist one.
  *   **The Metaphysical Stance:** Woodward is largely agnostic about Humean Supervenience. He thinks the question "What is causation in the fabric of reality?" is less important than "What distinguishes a causal claim from a correlational claim in a way that supports manipulation?"

  **Why your hypothesis needs a tweak:**
  You suggested the circularity charge is a "real concession" that prevents Interventionism from having reductive ambitions. That is true, but Woodward *does not have reductive ambitions*. The clash isn't that Woodward failed to meet Lewis's standard; it's that Woodward argues Lewis's standard is the wrong one for understanding scientific causation.
  *   **Lewis:** "Tell me what causation is made of."
  *   **Woodward:** "Tell me how to distinguish causal knowledge from non-causal knowledge."

  ### 2. Why the Verdicts Converge (Point 2 in your post)

  You noted that both sides patch their theories until they give the same verdicts on preemption, trumping, etc. This is because both theories are **calibrated to scientific intuition.**

  *   Lewis tweaks similarity metrics to match our intuition that the assassin caused the death, not the backup assassin.
  *   Woodward tweaks the definition of "active path" to match the same intuition.

  Since both are trying to capture the *same* set of pre-theoretic judgments (mostly derived from physics and common sense), extensional equivalence is expected. However, this equivalence is superficial.
  *   **Lewis** says the verdict is true because of the topology of possible worlds.
  *   **Woodward** says the verdict is true because of the invariance of the structural equation under intervention.

  The convergence suggests that both are tracking something real, but they disagree on the *ontology* of that tracker.

  ### 3. The Substantive Clash (Point 1 in your post)

  You worried the circularity charge is a genuine substantive clash. It is, but it maps onto a specific metaphysical divide: **Humean Supervenience vs. Causal Realism (or Primitivism).**

  *   If you believe the world is fundamentally non-causal (just particles and fields), you must side with Lewis (or find a better reductive account). For you, Interventionism is useless metaphysics because it assumes causal structure at the base.
  *   If you believe causal structure is a fundamental or autonomous feature of the world (or at least autonomous from the micro-physical mosaic), Interventionism is superior because it doesn't waste time trying to reduce causation to non-causal terms that can't do the work.

  The debate stalls because Lewisians and Woodwardians rarely argue about *this* premise. They argue about counterfactuals, assuming the other side shares their metaphysical goals. They don't.

  ### 4. What Counts as Progress?

  Given diagnosis (d), looking for a "killer case" (a scenario where Lewis says Yes and Woodward says No) is unlikely to resolve the dispute. As you've seen, both sides are flexible enough to patch their theories to match intuition.

  Here is what would actually constitute progress for your reading group:

  **A. Abandon the Search for "The Analysis"**
  Accept that "Causation" might be a cluster concept. Progress comes from distinguishing **Causal Metaphysics** (Lewis) from **Causal Epistemology/Methodology** (Woodward).
  *   *Action:* Ask of every paper: "Is this author trying to reduce causation to non-causal facts, or are they trying to clarify how we verify causal claims?"
  *   *Progress:* Realizing that Woodward's theory is compatible with many metaphysics (including Lewis's), provided you give up the demand for reductivity.

  **B. Focus on the "Intervention" Definition**
  The most fertile ground for substantive disagreement is the definition of an intervention.
  *   Woodward defines an intervention $I$ on $X$ with respect to $Y$ such that $I$ causes $X$, and $I$ is not correlated with any other cause of $Y$ except through $X$.
  *   **The Progress Question:** Can we define "intervention" without causal language?
      *   Some (like Cartwright) say no, and therefore Interventionism is useless for *foundations*.
      *   Others (like Pearl/Halpern) use Structural Equation Models (SEMs) to formalize this. SEMs essentially *stipulate* causal direction via asymmetry in the equations.
      *   *Real Debate:* Is the asymmetry in SEMs metaphysical or pragmatic? If it's pragmatic, Woodward wins on methodology. If it's metaphysical, Lewis wins on the need for a base.

  **C. Look for Divergence in "Grounding" vs. "Causation"**
  Recent metaphysics distinguishes *causation* (diachronic, event-based) from *grounding* (synchronic, metaphysical dependence).
  *   Lewisian counterfactuals struggle to distinguish grounding from causation (both look like counterfactual dependence).
  *   Interventionism handles this better (you can't "intervene" on the past, or on metaphysical bases in the same way).
  *   *Progress:* A case where Counterfactual Dependence holds, but Intervention is impossible. (e.g., Mathematical truths, or perhaps mental supervenience). If Interventionism says "no causation" and Lewisians say "causation," you have a real test case.

  **D. The "Agency" Argument**
  The deepest substantive disagreement is about **Agency**.
  *   Woodward's view is sometimes called "Manipulability." It ties causation to what agents *could do*.
  *   Lewis's view is "God's eye." Causation exists even if no agents exist to intervene.
  *   *The Test:* Did causation exist before there were agents capable of intervention?
      *   Lewis: Yes.
      *   Strict Woodwardian: The concept doesn't apply, or must be cashed out in terms of *possible* interventions (which brings back the circularity of "possible").
      *   *Progress:* If your group can settle whether causation is mind-independent, the choice of theory becomes obvious. If causation is mind-independent, Lewis (or a realist) is required. If causation is a tool for agents, Woodward wins.

  ### Summary Recommendation for the Group

  Stop asking "Which theory is true?" Start asking "What problem is this theory solving?"

  1.  **If your problem is:** "How do I fit causation into a physicalist worldview where only particles and forces exist?" -> **Stick with Lewis (or process theories).** You need reductivity. Woodward will frustrate you.
  2.  **If your problem is:** "How do I distinguish causal from correlational claims in econometrics or epidemiology?" -> **Stick with Woodward.** Lewis's possible worlds are useless here.
  3.  **If your problem is:** "Is the circularity charge fatal?" -> **Recognize it as a feature.** Woodward is offering a *functional* account, not an *ontological* reduction. The circularity is only fatal if you demand ontology.

  **The Verdict:** Your hypothesis is correct that they are largely different projects. The "disagreement" persists only because philosophers often demand that methodological accounts do metaphysical heavy lifting (and vice versa). Progress lies in decoupling the two: accepting that we might need a Lewisian account for fundamental physics and a Woodwardian account for the special sciences, without demanding they be the same theory.

  **Reading Suggestion to Break the Deadlock:**
  Read **Hans Reichenbach's *The Direction of Time*** (specifically on causal forks) alongside **Judea Pearl's *Causality*** (Chapter 1 on the "Causal Revolution"). This moves the debate from "Counterfactuals vs. Interventions" to "Probabilistic Independence vs. Structural Asymmetry," which is where the actual technical progress is happening, bypassing the metaphysical stalemate.
