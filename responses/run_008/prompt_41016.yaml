      *   **The Cost:** You must abandon the intuition that "size" *must* obey the part-whole principle for all collections. You must accept Hume's Principle (two sets have the same size if there is a bijection) as the definition of cardinality for infinite sets.
      *   **Is it just stipulation?** Yes, but a fruitful one. Dedekind actually *defined* "infinite" as "a set that can be put into one-to-one correspondence with a proper subset." Dan is essentially saying, "That's not a size, that's a paradox." Cantor says, "That *is* the definition of infinite size."
