          *   In finite sets, "No empty rooms" + "One-to-One" implies "Same Size" (where size is a natural number).
          *   In infinite sets, "No empty rooms" + "One-to-One" does *not* imply "Same Size" *if* you define size by Euclid's CN5. It *does* imply "Same Size" if you define size by Hume's Principle (bijection).
