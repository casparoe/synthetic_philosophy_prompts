answer: |-
  Good morning, everyone. Since we're discussing Frege, I thought I'd break the ice with a little story about two ancient astronomers, Arthur and Bernard, who are having a pint down the local.

  Arthur looks absolutely knackered. Dark circles under his eyes, head on the bar. Bernard asks, "Mate, what's wrong with you?"

  Arthur says, "I'm exhausted. I stay up all night observing Hesperus, then I have to wake up at dawn to observe Phosphorus. It's doing my head in."

  Bernard takes a sip of his beer and says, "Arthur, you daft sod. Hesperus is Phosphorus."

  Arthur lifts his head and says, "Don't be ridiculous. Hesperus is Hesperus. Everyone knows that. It's a tautology. It tells me nothing I don't already know."

  Bernard says, "Yes, but knowing Hesperus is Phosphorus tells you something else."

  Arthur asks, "What's that?"

  Bernard says, "It tells you that you can have a lie-in."

  Arthur thinks for a moment and nods. "Ah. I see. So one identity statement is logically trivial... and the other is a labour-saving device."

  Bernard clinks his glass against Arthur's. "Exactly. Same reference, different sense... and significantly more sleep."
