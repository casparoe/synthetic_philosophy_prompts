  **Faculty Seminar Series: Metaphysics of Mind**
  **Signatories:** [Anti-Physicalist], [Physicalist]

  **I. AGREED CLAIMS**

  1.  **Imaginative Coherence:** The zombie scenario constitutes a coherent piece of imaginative practice; neither party contends the terms are meaningless, syntactically ill-formed, or unimaginable in principle.
  2.  **Prima Facie Conceivability:** Zombies are prima facie positively conceivable; the scenario presents no immediate logical contradiction upon initial reflection or standard philosophical scrutiny.
  3.  **Ontological Status:** The dispute is not about the existence of consciousness; both parties affirm consciousness is real, non-illusory, and mandatory data for any metaphysical theory.

  **II. RESIDUAL DISAGREEMENTS**

  | Crux | Agreed Bearing / Development | Anti-Physicalist Claim & Prediction | Physicalist Claim & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Ideal Conceivability** | Examination of whether cognitive limitations mimic metaphysical distance upon maximal reflection. | Ideal positive conceivability is genuinely achievable here. **Prediction:** Ideal conceivability will entail metaphysical possibility. | Ideal conceivability is not achievable; this is just whatever the anti-physicalist feels after reflection. **Prediction:** Ideal conceivability will fail to entail possibility. |
  | **2. Phenomenal Concepts** | Investigation into whether phenomenal concepts possess unique recognitional capacities distinct from functional concepts. | Phenomenal concepts are just a label stuck on the gap. **Prediction:** PCS will fail to explain the gap's persistence without dualism. | Phenomenal concepts are a real explanation of why the gap seems to appear. **Prediction:** PCS will successfully explain the gap without dualism. |
  | **3. Psychophysical Identity** | Evaluation of whether theoretical identities require explanatory derivations beyond rigid designation. | Water/H2O is a bad analogy; that identity has an explanation the psychophysical one lacks. **Prediction:** The disanalogy will refute physicalist identity claims. | Water/H2O is a good analogy; both are a posteriori necessities. **Prediction:** The analogy will sustain physicalist identity claims. |
  | **4. Argument Structure** | Logical analysis of the inference from conceivability to possibility. | The argument takes the epistemic gap seriously without begging the question. | The argument begs the question against physicalism by assuming dualist semantics. |

  **III. VERBAL DISPUTE NOTE**

  A portion of the dispute is verbal regarding the term "conceivable." The Anti-Physicalist employs a sense entailing metaphysical possibility (ideal conceivability), while the Physicalist employs a strictly epistemic sense (prima facie conceivability). Both agree this semantic divergence accounts for approximately 40% of the dialectical friction, though substantive metaphysical disagreement remains regarding whether the epistemic gap entails an ontological gap.

  **IV. CONCLUSION**

  We recommend continued seminar focus on the nature of concept acquisition (Crux 2) as the most promising empirical avenue for resolution. Both parties agree that further clarification on whether phenomenal concepts possess unique explanatory power is required before metaphysical conclusions can be finalized.

