          *   *Refined Idea:* "The 'a' Spectrum." Give them a double-storey 'a' and a single-storey 'a'. Ask them to draw 5 steps between them. Then draw 5 steps beyond the single-storey until it breaks. Then do the same for Blackletter. This combines Sorites (boundaries) with Variety (family resemblance).
