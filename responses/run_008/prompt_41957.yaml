answer: |-
  Here is a 90-minute studio session plan designed to move your students from naive essentialism to a nuanced understanding of typographic categorization.

  ### 1. The Order of Ideas (Dependency Structure)

  You cannot simply list the theories; they must arrive in the order that solves the problems the students encounter. If you introduce "Family Resemblance" before they have failed to find "Essential Features," they will treat it as a vague platitude rather than a necessary solution.

  1.  **The Naive Essentialist View (Plato):** Start by validating their intuition. They believe there is a "True 'a'."
      *   *Why first:* You must establish the target you are about to dismantle. If you skip this, the rest feels abstract.
  2.  **The Crisis of Features (Wittgenstein):** Show them 'a's that share no common geometry (e.g., a geometric sans 'a' vs. a Blackletter 'a' vs. a handwritten single-storey 'a').
      *   *Dependency:* Requires Step 1. They must try to list the necessary features of the "True 'a'" and fail when confronted with valid counter-examples.
  3.  **The Gradient of Belonging (Rosch):** Once they accept there are no necessary features, they will ask, "Why do I still prefer the double-storey?" Introduce *Prototype Theory*. Some 'a's are "better examples" than others.
      *   *Dependency:* Requires Step 2. Solves the anxiety that "if there's no essence, nothing is better."
  4.  **The Historical Chain (Kripke/Paleography):** Address the discontinuous cases. Why is the Blackletter 'a' an 'a' if it resembles the Roman 'A' less than it resembles an 'h'?
      *   *Dependency:* Requires Step 3. Prototype theory explains *preference*, but History explains *identity*. This is the pivot from "looking like" to "descending from."
  5.  **The Active Analogy (Hofstadter):** Synthesis. Recognizing an 'a' is not matching a template; it is reconstructing the *role* the glyph plays in a system.
      *   *Dependency:* Requires Step 4. This moves them from passive observers to active designers who understand that legibility is a negotiation between form and context.

  ---

  ### 2. The Carrying Exercise: "The Adoption Papers"

  Do not use the Sorites slide (too passive) or the Unfamiliar Glyph quiz (too cognitive). Use a generative drawing task that forces them to negotiate the boundary between **Visual Similarity** and **Historical Lineage**.

  **The Setup:**
  Give each student a sheet with three distinct zones.
  *   **Zone A:** A standard double-storey 'a' (Times New Roman).
  *   **Zone B:** A glyph that looks like an 'a' but is labeled 'o' (e.g., a single-storey 'a' shape).
  *   **Zone C:** A glyph that looks *nothing* like an 'a' (e.g., a Blackletter 'a' or a Greek Alpha) but is labeled 'a'.

  **The Task (45 minutes total):**
  1.  **The Sorites Morph (15 mins):** On tracing paper over Zone A, draw a 5-step morph from the double-storey 'a' toward Zone B. Mark the exact step where they feel it stops being an 'a'.
  2.  **The Lineage Bridge (30 mins):** Now look at Zone C (the Blackletter/Historical 'a'). It likely looks like it belongs *past* their "stop being an 'a'" point in the morph.
      *   *Instruction:* "You cannot change the shape of Zone C. Instead, you must draw the **missing ancestors**. Draw 3 intermediate glyphs that show how Zone A could historically evolve into Zone C without ever breaking the 'a' identity."
      *   *Goal:* They must invent the "causal chain" that justifies the identity.

  **What it must have:**
  *   **Physical friction:** They must draw the breaks. The pen must hesitate where the category breaks.
  *   **Context:** They must label the intermediate steps (e.g., "Carolingian minuscule," "Humanist italic").

  **What it must lack:**
  *   **Digital tools:** No vector smoothing. The shaky hand is part of the uncertainty.
  *   **Reference alphabets:** They cannot look up the actual history. They must rely on their intuition of *how* letters evolve (thickening, thinning, breaking).

  **Why this works:**
  The Sorites morph teaches them that visual boundaries are fuzzy (Wittgenstein/Rosch). The Lineage Bridge teaches them that identity is often inherited, not intrinsic (Historical/Causal). If they can draw a plausible lineage, they accept the glyph as an 'a' even if it looks "wrong."

  ---

  ### 3. Misconceptions to Expect (and When to Head Them Off)

  1.  **"The Essence is Specific Geometry"** (e.g., "An 'a' must have a closed counter.")
      *   *When:* During the initial discussion of Zone A vs. Zone C.
      *   *Intervention:* Show a single-storey 'a' (like in Futura). Ask: "Did this stop being an 'a' when the top closed?" Force them to admit that function (lowercase vowel) outweighs specific geometry.
  2.  **"If There's No Essence, Anything Goes"** (Nihilism)
      *   *When:* After introducing Wittgenstein. Students may think, "So I can draw a squiggle and call it 'a'."
      *   *Intervention:* Bring in Rosch. "If anything goes, why did 90% of you mark the morph break at the same step?" Convention and prototype create gravity, even without rigid walls.
  3.  **"Family Resemblance is Just a Slogan"**
      *   *When:* During the Lineage Bridge. They might say, "It's an 'a' because it resembles other 'a's."
      *   *Intervention:* Point to the Blackletter 'a'. "It resembles an 'h' more than it resembles the Futura 'a'. Resemblance isn't enough. You needed to draw the *history* to make it work."
  4.  **"The Context Doesn't Matter"**
      *   *When:* Final review.
      *   *Intervention:* Show the same glyph in a word vs. isolated. "Is this an 'a' because of its shape, or because the next letter is 'n' and the previous is 'c'?" (Hofstadter's point: identity is systemic).

  ---

  ### 4. What to Leave Out (and Say So)

  Be honest about the boundaries of this session. This builds trust and keeps the focus on design praxis.

  *   **The Computational Architecture of Analogy (Hofstadter):** Do not explain *slipnet* or *codelets*.
      *   *Say:* "Hofstadter built computer programs to model this, but we don't need the code. We need the insight: perception is active, not passive."
  *   **Neurophysiology (VWFA):** Do not discuss the Visual Word Form Area in the brain.
      *   *Say:* "There is biological hardware for this, but you are designers, not neurologists. You design for the *experience* of recognition, not the neuron firing."
  *   **Semiotics (Signifier/Signified):** Do not introduce Saussurean terminology.
      *   *Say:* "You'll study signs and symbols in your Semiotics unit next year. Today is about *categories* and *identity*."
  *   **Load-Bearing Exception:** Do **not** cut the **Historical/Causal** element. It is the only thing that explains why a revival typeface designer isn't just "copying shapes" but "reconnecting chains." If you cut this, you lose the bridge between Plato and Wittgenstein.

  ---

  ### 5. The Concrete Check for Understanding

  Do not give a quiz. Give a **Design Brief with a Constraint**.

  **The Task (Last 15 minutes):**
  "Design a lowercase 'a' for a new typeface intended for a sci-fi interface used by aliens who have no history of Latin script.
  1.  Draw the 'a'.
  2.  Write two sentences: **Why is this an 'a' and not an 'o'?**"

  **The Grading Rubric (For You):**
  *   **Fail (Essentialist):** "It is an 'a' because it has a tail and a closed counter." (They relied on a template).
  *   **Fail (Nihilist):** "It is an 'a' because I said so." (They relied on arbitrary convention).
  *   **Pass (Prototype/Analogy):** "It occupies the same structural niche as the double-storey 'a' in a Latin system, balancing the counter-weight of the 'b' and 'd'." (They understand systemic role).
  *   **Pass (Historical/Functional):** "It distinguishes itself from the 'o' by breaking the closure, signaling 'vowel' in this specific syntax." (They understand identity is differential and functional).

  **Why this works:**
  If they believe in the "One True 'a'," they cannot design for aliens (who have no access to that True 'a'). If they believe "Anything Goes," they cannot justify why it isn't an 'o'. To pass, they must synthesize **Prototype** (it acts like an 'a'), **System** (it fits the alphabet), and **Function** (it communicates distinctness). This proves they grasp categorization as a dynamic act, not a static lookup.
