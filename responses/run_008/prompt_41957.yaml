      *   *Rosch:* Prototypes. Some 'a's are "more 'a'" than others. Explains why the double-storey is the default in their heads.
      *   *Historical/Causal:* Genealogy. It's an 'a' because its great-grandparent was an 'a'. Crucial for revivals and historical context.
      *   *Hofstadter:* Fluid analogy. Recognition is dynamic, not static matching.

