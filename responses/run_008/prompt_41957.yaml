          *   *Wait, let's look at the "Historical-Causal" requirement.* Students need to understand identity is inherited.
          *   *Revised Exercise:* **"The Lineage Trace"**. Give them a Roman Capital 'A', a Carolingian 'a', a Humanist 'a', a Didone 'a', a Geometric Sans 'a', and a weird experimental 'a'. Ask them to draw the *connections*. How did we get from A to a? This hits the historical chain. But does it hit the essence problem?
          *   *Let's stick to the prompt's suggestions but refine.* The "Sorites Slide" is passive. The "Unfamiliar Glyph" is cognitive. The best studio exercise is *making*.
          *   *Proposal:* **"The Boundary Drawing"**. Students must draw an 'a' that is *just barely* an 'a'. Then swap with a partner. The partner must decide if it is an 'a'. If yes, modify it to be *less* 'a'. If no, modify it to be *more* 'a'. This forces them to negotiate the category boundaries physically.
