prompt: |-
  I'm not a philosopher or a programmer, just someone who got way too deep into arguing about this online, and now I help moderate a discord server about the ethics of self-driving cars and care robots. Two factions have been at each other for a year: one camp says you have to build the ethics in explicitly — hand the machine actual principles it reasons from, a hierarchy of rules or something you could print out and audit — the other says that's hopeless and you should train it on examples of what humans actually decide and let the ethics emerge from the data. The rules camp calls the other side's approach cargo-cult ethics, the training camp calls theirs bean-counter ethics. Whenever I suggest they might both be describing different machines that both could work, both sides yell at me.

  I want to write up the document they should have produced after all this time arguing: the claims both camps could actually sign (I suspect they agree on more than they admit — both think the current situation of nobody deciding anything in advance is bad, for a start), the exact disagreements phrased so each side would accept the wording of their own view, and the cruxes underneath. My guesses: one is whether a system that can't explain its decision can be trusted with a moral choice at all (rules people say no, training people point out human experts often can't explain themselves either), and another is who's on the hook when it screws up — the coder, the trainer, whoever deployed it, nobody. For each crux, describe a concrete case both sides would agree is a real test — like a care robot deciding whether to wake a sleeping patient to give medication on schedule — and write down what each camp would predict about it. And please tell me straight if part of their fight is just over words, like whether the question "is the machine really doing ethics or just engineering that mimics ethics" actually means anything, or whether theyd give the same answer if you pinned them down on cases. Format it as a numbered section of agreed claims followed by a table for the disagreements.
