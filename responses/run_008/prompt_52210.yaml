answer: |-
  To the Underwriting Analytics Team, this memo outlines the new protocol for evaluating external probability claims, derived from recent discussions on how we integrate objective chance data into our pricing models. The goal is to operationalize a principle that tells us when to accept a number as given and when to adjust it, ensuring we spend no more than fifteen minutes on any single claim before reaching a decision. The procedure is designed to distinguish between evidence that changes the probability of an event directly and evidence that changes our trust in the number itself. You will follow three ordered questions for every probability claim that crosses your desk. The first question is whether the number is presented as an objective frequency derived from a defined mechanism, such as a certified failure rate, a catastrophe model output, or an industry loss table. If the answer is no, you treat the number as a subjective estimate and proceed to our standard weighting process without further review under this protocol. If the answer is yes, you move to the second question, which asks whether we possess evidence that the mechanism generating the number was flawed in its execution or design. This includes calculation errors, data corruption, or known omissions in the model structure that were present when the number was produced. If you find such evidence, you do not defer to the number; instead, you treat it as one weighted input among several and document the specific flaw. If the mechanism appears sound, you proceed to the third question, which asks whether we possess evidence about the specific outcome of this event that bypasses the mechanism. This is the hardest distinction to make, but it generally means knowing something about the specific risk instance that the model cannot capture by design, rather than just knowing the risk is higher. If you have this kind of specific outcome evidence, you escalate the decision to me. If you do not, you defer to the number as the objective chance. You must recognize that the second step involves judgment dressed up as procedure, specifically in deciding whether a known limitation counts as a flaw in execution or merely a boundary of the model. There is no formula for this, and you will need to rely on your technical understanding of the source.

  To illustrate how this works in practice, we applied the protocol to three recent files. The first case involved the certified failure rate from the vendor we partly own. The number was presented as an objective frequency from a certified process, so it passed the first question. On the second question, regarding flaws in execution or design, the certification process was documented as thorough, but the commercial relationship constitutes a potential design flaw in the independence of the mechanism. Because the ownership stake creates a structural incentive that biases the chance determination itself, this counts as evidence that the mechanism was flawed in its design. Therefore, the procedure terminates here with a instruction to treat the number as one weighted input among several, requiring you to discount the rate based on the conflict of interest. This aligns with our intuition that the number is suspect. The second case was the flood probability from the catastrophe model that omits the deteriorated maintenance of the levees upstream. The model output is presented as an objective chance, so it passes the first question. For the second question, you must determine if the omission of the levee factor is a flaw in execution or design. Since the model was built without this factor by design, and not due to a calculation error in the current run, the procedure classifies this as a boundary of the model rather than a flaw in the mechanism's execution for this specific quote. There is no evidence the model calculated its own inputs wrong, only that its inputs are incomplete. Consequently, the procedure moves to the third question. Our engineers' knowledge about the levees is evidence about the specific risk outcome, but under this protocol, unless we have proof the model mechanism itself is broken, this is treated as information that should have been in the model rather than evidence that bypasses it. Therefore, the procedure terminates with a directive to defer to the number. I know this is counter-intuitive and likely dangerous, but under the strict logic of the principle we are testing, the model defines the objective chance for our purposes, and expert opinion on risk factors does not override the certified chance unless it proves the certification process failed. The principle is forcing us to prioritize the defined mechanism over unquantified expert belief, effectively telling us that if we want to account for the levees, we must change the model rather than adjust the output.

  The third case involved the liability base rate drawn from a different industry than our client operates in. This number is presented as an objective frequency from a defined mechanism, passing the first question. However, the second question asks if the mechanism was flawed in design or execution for this specific use. Applying a rate from a non-identical industry is a design mismatch for this specific risk, constituting a flaw in the application of the mechanism. Therefore, the procedure terminates with an instruction to treat the number as one weighted input among several, requiring you to adjust for the industry difference. This reflects the reality that the reference class is incorrect. Having run these cases, I must be honest about where this procedure will misfire, particularly regarding the selection-effect cases that started this debate. If we receive a report only because the number was alarming enough to trigger a review, the procedure struggles to categorize this. It is not a flaw in the mechanism's execution, nor is it evidence about the specific outcome. It is evidence about why we possess the number at all. The procedure as written will likely tell you to defer, because the number itself looks mechanically sound. This is where the procedure fails to capture the bias introduced by the reporting threshold. A defender of my friend's side would argue that the procedure gets wrong the definition of admissibility in the second step. She would say that evidence about why the number was generated, such as the selection effect or the vendor ownership, is evidence about how the chance was determined and should allow us to adjust the number, not just treat it as weighted input or defer. She would argue that by forcing a binary choice between deferring and weighting, we are ignoring the nuance that some evidence changes the objective chance itself. The procedure assumes the objective chance is a fixed property of the number provided, whereas she argues the objective chance is a property of the world that the number attempts to describe, and any evidence affecting that description is admissible. Until we refine the second question to explicitly include selection bias as a design flaw, you should escalate any case where the provenance of the number seems influenced by the value of the number itself. For now, follow the steps as written, but log every instance where you feel the defer instruction contradicts your underwriting judgment so we can review the failure modes next quarter.
