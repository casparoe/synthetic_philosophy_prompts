  ### The Principle of Dynamic Hinge Stability

  Your proposed principle ("live practice + check") correctly identifies that context matters, but it treats practices as static and checks as binary. It fails to account for why the *same* check (Mercury's orbit) changes status over time, or why some propositions (hands, external world) are immune to checking not because checks are impossible, but because they are the *ground* upon which checks stand.

  I propose replacing your principle with **The Principle of Dynamic Hinge Stability**.

  **Statement:**
  A doubt is legitimate within a practice $P$ if and only if:
  1.  **Non-Collapse:** Entertaining the doubt does not dissolve the normative structure required for $P$ to function (i.e., the proposition is not a fixed "hinge" for $P$); **OR**
  2.  **Destabilization:** The proposition was a hinge, but the accumulation of anomalies has generated sufficient "systemic friction" that converting it into a testable hypothesis yields greater explanatory coherence than preserving it; **OR**
  3.  **Meta-Shift:** The practice $P$ has temporarily suspended its primary function to operate as a meta-practice $P'$ designed specifically to examine the hinges of $P$.

  **Why this repairs your gaps:**
  *   **(1) vs (2):** In the jury room (1), the reality of the external world is a fixed hinge (Condition 1 fails). In the seminar (2), the practice *is* meta-inquiry (Condition 3 applies).
  *   **(4) vs (5):** In 1890, Newtonian mechanics was a stable hinge; anomalies were absorbed by ad-hoc hypotheses (Condition 2 fails). In 1910, friction exceeded the cost of revision (Condition 2 applies).
  *   **(6)–(8):** These assertions are legitimate because they affirm hinges necessary for ordinary practice. Doubting them would violate Condition 1.
  *   **(9):** Conspiracy theories violate Condition 2; the "friction" they cite does not outweigh the massive coherence cost of assuming a global deception.
  *   **(10):** The mathematician invokes Condition 3 (Meta-Shift).

  ---

  ### Application to Test Cases

  **1. The Climate Scientist and the Thermometers**
  *   **Verdict:** **Legitimate.**
  *   **Reasoning:** Instrument calibration is not a hinge commitment of climate science; it is a variable within the practice. Doubting it satisfies Condition 1 (science functions while checking) and Condition 2 (resolving it increases predictive coherence).

  **2. The AI Safety Researcher and Fabricated Memories**
  *   **Verdict:** **Illegitimate.**
  *   **Reasoning:** This violates Condition 1. Memory is a hinge for the practice of research. If the researcher cannot trust their memory of the past month, they cannot trust their data, their code, or their reasoning. The doubt dissolves the practice. Unless there is specific evidence of tampering (Condition 2), the doubt is paralyzing.

  **3. The Border Crosser and Their Name**
  *   **Verdict:** **Illegitimate (at the crossing).**
  *   **Reasoning:** At the border, legal identity is a constitutive hinge (Condition 1). The practice of border control cannot function if "who you are" is an open question *during* the transaction. Doubting it elsewhere (in a philosophical mood) might satisfy Condition 3, but not at the checkpoint.

  **4. The Religious Convert and Radiometric Dating**
  *   **Verdict:** **Incoherent (Illegitimate).**
  *   **Reasoning:** This violates the coherence requirement implicit in Condition 2. The convert treats the *equipment* as reliable (to schedule the flight) but the *timeline* as false. This creates a web of belief that cannot hold together. One cannot legitimately doubt the output of a mechanism while relying on the mechanism's integrity for other tasks without a specific error theory distinguishing the two uses.

  ---

  ### Honest Assessment: Which Verdict Fails?

  My principle fails to fully accommodate **Verdict (3): The OCD Door-Checker.**

  My principle classifies this doubt as **illegitimate** (it violates Condition 1 by paralyzing the agent, and Condition 2 because there are no anomalies, only anxiety). However, your verdict was nuanced: *"pathological, though I am honestly unsure whether to call it illegitimate — it seems more like a defect in the doubter than in the doubt."*

  My principle is strictly epistemic; it judges the *doubt's* relationship to the *practice*. It cannot capture your intuition that the doubt might be "locally" legitimate (the door *could* be unlocked) but "globally" mismanaged by the agent. My principle collapses the distinction between a bad doubt and a broken doubter. To accommodate your hesitation, the principle would need a separate clause for psychological capacity, which risks muddying the epistemic waters.

  ### Advice: Which Verdict to Surrender?

  I advise you to surrender **Verdict (9): The Conspiracy Theorist.**

  You hold that the 1910 Physicist (4) is legitimate, but the Moon Landing Doubter (9) is not. You distinguish them by noting the conspiracy theorist requires "far too much else to be wrong." While true, this is a matter of degree, not kind. The 1910 physicist also required a massive amount of "else" to be wrong (all of classical mechanics).

  The distinction between a "Scientific Revolutionary" and a "Conspiracy Theorist" is the most vulnerable point in your map. It relies on a social judgment of what counts as a "serious" anomaly versus a "fringe" one. If you keep (4), you must admit that legitimacy is determined by the *eventual success* of the doubt (hindsight), not just the moment of doubting. If the conspiracy theorist turned out to be right, we would retroactively call their doubt legitimate.

  Surrendering (9) forces you to admit that legitimacy is often only visible in retrospect, or it forces you to tighten your criteria for "anomalies" in a way that might threaten (4). It is the weakest link in your epistemic chain.
