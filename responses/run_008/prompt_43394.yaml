r verdict on each of the three cases, identify the principle or principles that most plausibly generate her existing judgments, indicate precisely where those candidate principles come apart on the new cases, give your best overall prediction together with your reasons for preferring it, and propose the single further case that would most cleanly separate the leading candidates. In your reply, please write in continuous prose only, as one would in a letter: no headings, bullet points, bold text, or tables.
