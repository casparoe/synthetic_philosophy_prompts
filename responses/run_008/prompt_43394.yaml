  Dear Colleague,

  It is a pleasure to assist you in preparing for your seminar on the boundary between manipulation and legitimate persuasion. Based on the considered judgments you have shared regarding your colleague's views on the five initial cases, I have analyzed the underlying principles that appear to guide her reasoning, applied them to your three new scenarios, and formulated a prediction regarding her likely verdicts. To begin with, her existing judgments suggest a strong commitment to what we might call the Epistemic Integrity Principle. In every case she labels as manipulation, there is a clear element of deception or reality-distortion: the retailer lies about scarcity, the negotiator misrepresents value through an inflated anchor, and the partner falsifies shared history. Conversely, in the cases she deems legitimate, the influence is transparent and truthful: the cafeteria layout is visible and choices remain open, and the charity photographs are real even if they appeal to emotion. This suggests that for her, the moral wrong of manipulation lies primarily in corrupting the target's information environment or grasp of reality, rather than in the mere fact of psychological influence or emotional appeal.

  However, a competing principle could also explain her judgments, which we might call the Welfare Principle. This view holds that manipulation is defined by influencing someone against their best interests. The manipulative cases all harm the target financially or psychologically, while the legitimate cases generally benefit the target or a worthy cause. The tension between these two principles becomes apparent when we examine your three new cases. In the first case, the oncologist frames survival statistics positively to encourage treatment. Under the Epistemic Integrity Principle, this is not manipulation because the statistics are true and no information is concealed. Under the Welfare Principle, this is also not manipulation because the doctor acts in the patient's best interest. Here, the principles agree. The divergence arises in the second and third cases. In the second case, the friend openly invokes past favors to induce guilt. This is truthful and transparent, satisfying Epistemic Integrity, but it imposes a cost on the refuser who wished to say no, potentially violating the Welfare Principle. In the third case, the political advertisement is truthful but motivates voters to support a policy that harms them financially. The Epistemic Integrity Principle would classify this as legitimate persuasion, akin to the charity appeal, because the information is accurate. However, the Welfare Principle would likely classify this as manipulation because the outcome is demonstrably against the voters' self-interest, unlike the charity case where the financial loss is exchanged for moral satisfaction.

  Despite this divergence, my best overall prediction is that your colleague will verdict all three new cases as not manipulative. The primary reason for this prediction is the weight she places on the charity appeal case. That judgment establishes that truthful emotional influence is permissible even when it incurs a cost to the agent, provided the appeal is not deceptive. The political advertisement is structurally identical to the charity appeal, utilizing truthful figures and emotional imagery, and the friend's request is explicitly transparent about its intent, hiding nothing about what she is doing. The oncologist's framing is merely a variation of the cafeteria nudge, arranging truthful information to encourage a beneficial choice without lying. Since her definition of manipulation appears anchored in deception and epistemic subversion rather than outcome or emotional pressure, she will likely see these as robust examples of legitimate persuasion. The negotiator case supports this reading because the anchor was manipulative specifically because it was deliberately inflated, implying a falsehood about value, whereas the new cases rely on truthful premises.

  To most cleanly separate the Epistemic Integrity Principle from the Welfare Principle in a future discussion, I propose you present her with a case of benevolent deception. Imagine a public health official who knowingly exaggerates the severity of a virus in public statements to ensure higher vaccination rates, thereby saving lives but lying to the public. The Epistemic Integrity Principle would classify this as manipulation because it involves deliberate falsehoods, regardless of the good outcome. The Welfare Principle, however, might classify this as legitimate persuasion because it serves the best interests of the target population. Her verdict on this single case would reveal whether she prioritizes the truthfulness of the influence or the beneficial nature of the outcome, thus clarifying the exact boundary she draws. I hope this analysis proves useful for your seminar preparations.

  Sincerely,

  Your Assistant
