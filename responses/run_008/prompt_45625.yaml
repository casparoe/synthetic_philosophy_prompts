      *But Schizophrenia (in 1962) didn't have a known lesion.* Yet the user calls it illness. Why? Because the *degree* of alienation is total.
      *So the principle is:* **Involuntariness + Alienation + Absence of Social Rationality.**
      *   Hypothyroid/DTs/Epilepsy: Biological involuntariness.
      *   Schizophrenia: Phenomenological involuntariness (voices command, self is displaced).
