  7.  **Final Polish:** Ensure the distinction between "Szasz the Liberator" (against social control) and "Szasz the Ontologist" (denying brain/mind disease) is clear. This allows the narrator to sympathize with the former while rejecting the latter. This creates the perfect dramatic tension.

