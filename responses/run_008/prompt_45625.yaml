      *   *Hybrid Approach:* We need a principle that acknowledges biological substrate *or* involuntary loss of agency, while excluding socially deviant but voluntary (or contextually rational) behaviors.
      *   *Proposed Principle:* **The Principle of Involuntary Physiological Disruption.**
          *   Clause A: Direct bodily pathology (thyroid, seizure, withdrawal).
          *   Clause B: Loss of executive agency not attributable to rational choice or social context (Schizophrenia).
          *   Exclusion: Behaviors that are rational within a specific context (Drapetomania), identity traits (Homosexuality), or proportional emotional responses to loss (Grief), even if dysfunctional.
      *   *Refinement:* Actually, to make it defensible in 1962, we need to lean into the *phenomenology of agency*. Szasz argues mental illness is a myth because "mind" isn't a body part. The counter-argument (which fits the user's intuition) is that some mental states *mimic* bodily disease in their involuntariness and destruction of the self, distinct from moral failure or social non-conformity.
      *   *Let's try a Dual-Criterion Model:*
          1.  **Somatic Substrate:** Demonstrable physical pathology (Hypothyroid, DTs, Epilepsy, Brain Injury).
          2.  **Phenomenological Alienation:** The experience of the self is hijacked by an external or intrusive force, rendering volition impossible (Schizophrenia).
          3.  **Exclusion of Contextual Rationality:** If the behavior makes sense within the subject's social/moral framework (Drapetomania, Grief), it is not illness.
          4.  **Exclusion of Moral/Volitional Failure:** If the behavior is a pursuit of gratification despite harm, absent substrate (Gambling), it is not illness.

      *Wait, the Anorexia case is the wedge.* Anorexia looks like volitional control (refusing food) but feels like an compulsion. It fits "Phenomenological Alienation" but often lacks the "Somatic Substrate" (in 1962 terms).
      *The Schizophrenia case is the hardest for Szasz.* The user refuses to call it "problems in living." This suggests the user is *not* a pure Szaszian. The narrator is *considering* Szasz, not fully converted.
      *Goal:* Define the narrator's *emerging* philosophy, which accepts Szasz's critique of social control but rejects his denial of severe psychosis.

      *Revised Principle:* **The Distinction Between Pathology of the Organ and Pathology of the Person.**
      *   Illness = The instrument of agency (the brain/mind) is broken *independently* of the will or social context.
