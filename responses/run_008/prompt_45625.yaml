      *The Conflict:* The user wants to keep the Szaszian distinction (bodily lesion = disease) for political/social cases (Drapetomania, Homosexuality, Grief) but *abandon* it for severe psychiatric cases (Schizophrenia) and potentially Anorexia. This is the core philosophical tension. Szasz would say Schizophrenia is *also* a metaphor. The user feels it isn't.

