answer: |-
  The 24-hour diner across from City Hall was nearly empty. It was 11:30 PM, and the coffee pots were half-empty. Dana stirred sugar into her mug, the spoon clinking against the ceramic.

  "You keep saying 'incommensurable' like it's a magic word," Dana said. "It's not. It's a shield."

  Marcus rubbed his eyes. He looked tired, the kind of tired that comes from arguing in circles. "It's a description, Dana. If I ask you 'which is heavier, this coffee mug or the sound of that siren?' you don't say the mug is heavier. You say the question is broken."

  "But we have one grant. One check. The money is commensurable. If we spend it on Miller's Orchard, we aren't spending it on the levee behind the cannery. That's a trade-off." Dana leaned forward. "My model shows the levee prevents forty million in flood damage over twenty years. The orchard—even with your tourism bumps and that contingent valuation survey—comes in at twelve. If you ignore that gap, you aren't being profound. You're being irresponsible."

  "You're assuming the only value the orchard has is the value it generates *within* the current system," Marcus said. "Tourism, property values. That's pricing the orchard as a business. But it's the last working land inside the limits. If we sell it to that logistics company, we become a distribution hub. If we keep it, we remain a city that grows things. Those aren't quantities. They're categories."

  "Categories don't stop water. If the levee fails, the water doesn't care about our categories. It goes into basements. It goes into schools." Dana's voice tightened. "You want to talk about categories? How do you price a child's life downstream, Marcus? If you say 'priceless,' then you should spend every available dollar on safety until the budget is zero. But you won't. You're willing to let some risk exist to save the orchard. So you *are* pricing the child's life. You're just refusing to write the number down."

  Marcus paused, looking at the steam rising from his cup. "That's the hit I expected. But look at your spreadsheet. That number you used for the child's life? It comes from federal guidelines based on lifetime earnings and risk acceptance. You chose a discount rate that says a life saved ten years from now is worth less than a life saved today. That's not a measurement, Dana. That's a moral judgment disguised as an interest rate."

  "It's a standard adjustment. Time preference."

  "It's a decision about who matters. You say I'm hiding my preferences by not pricing the orchard. I'm saying you're hiding yours by pretending your prices are neutral. When you put 'twelve million' on the orchard, you're telling the council this is fungible. That if someone offered us thirteen million in tax breaks from the logistics hub, we should take it. My argument is that there is no number where selling the orchard becomes 'worth it.' Not because it's infinite, but because it's not on the scale."

  "So how do you decide?" Dana asked. "If it's not about the numbers, what is it? You say it's about 'who we are.' That sounds nice until you're standing in front of a family whose basement is flooded because we bought apple trees instead of concrete."

  "And it sounds nice until you're standing in a parking lot where the orchard used to be, explaining to a kid that we traded the only place they could see where food comes from for a warehouse that ships them plastic toys. You think I'm being indecisive. I'm not. I know what I want. I'm saying the justification isn't found in a calculation. It's found in a commitment. When you choose the levee, you're saying safety is the highest good. When I choose the orchard, I'm saying continuity is."

  "But you can't have both. The grant is one check."

  "I know. That's the tragedy. But don't tell me the math makes the choice easier. The math just tells you what you lose. It doesn't tell you what you become."

  Dana sighed, pushing the sugar bowl aside. "So we're stuck. You think my clarity is an illusion. I think your clarity is a luxury."

  "Maybe. Or maybe we're just arguing about whether the city is a machine or a home."

  "Well, the machine needs fixing. The grant deadline is Friday."

  "And the orchard blooms in April."

  They sat there. The coffee was cold.
