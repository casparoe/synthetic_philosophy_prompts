      *   *Item 3: The Transcendental/Constitutive Claim (Kantian/Stroudian).*
          *   Claim: Reason isn't just a tool; it's the framework of intelligibility. You can't think outside it.
          *   Status: Substantive, controversial.
          *   Effect on Skeptic: Silences global skepticism. Skepticism becomes unintelligible, not just false.
