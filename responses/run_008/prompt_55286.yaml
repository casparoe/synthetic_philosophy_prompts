      *   *Item 4: The Coherentist/No-God's-Eye-View Claim (Davidson/Quine).*
          *   Claim: We can only check beliefs against other beliefs. There is no external standpoint.
          *   Status: Substantive epistemological thesis.
          *   Effect on Skeptic: Silences *global* skepticism (can't doubt everything at once), allows local doubt.
