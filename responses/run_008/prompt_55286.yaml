          *   Status: Trivially true.
          *   Effect on Skeptic: Doesn't silence them. They can say "I'm showing reasoning leads to the conclusion that reasoning is unreliable." (Self-defeating but possible to state).
          *   Effect on Faith: Doesn't help. Just says arguments need logic.
          *   Presupposition type: Linguistic/Category.

      *   *Item 2: Pragmatic Self-Refutation (Performative Contradiction).*
