answer: |-
  Here is a 45-minute battle plan. You are right to be worried about time; 45 minutes is barely enough to state the problem, let alone solve it. Your goal is **diagnostic**, not **therapeutic**. You want them to feel the logical itch, not scratch it.

  ### 1. The Sequence & The Negation Trap
  **Do not open with negation.** It is a trap for this specific audience.
  *   **Why:** Negated moral sentences ("Murder is not wrong") invite questions about *contradiction* and *consistency of attitudes*. While related, this muddies the water. The Frege–Geach (F-G) problem is fundamentally about **validity** and **compositionality**, not just contradiction.
  *   **The Risk:** If you start with negation, the linguists will start talking about scope, and the psychologists will start talking about ambivalence. You want the economists focused on *inference*.
  *   **The Correct Order:**
      1.  **Expressivist Semantics (5 mins):** Moral sentences express non-cognitive attitudes (Boo!/Hooray!).
      2.  **Logical Validity Requirement (5 mins):** Validity requires univocal terms across premises (no equivocation).
      3.  **The Embedding (15 mins):** The moral term appears in an unasserted context (the antecedent of a conditional).
      4.  **The Clash (15 mins):** If the meaning in the antecedent isn't the attitude (since you aren't asserting it), the term changes meaning. If the term changes meaning, Modus Ponens fails.
      5.  **Damage Control (5 mins):** Head off misconceptions.

  **Why this sequence is rigid:** If you introduce the conditional before establishing the expressivist semantics, they won't see the problem (they'll just treat it like normal descriptive logic). If you establish semantics but don't immediately pivot to logic, they'll think this is just a quirk of moral psychology rather than a semantic crisis.

  ### 2. The Example: Contractual Obligation
  You are right to avoid the "tormenting cat" example. It triggers moral disgust rather than logical analysis. For econ/ling/psych grads, use **Contractual Breach**. It is normative, dry, and structurally familiar.

  **The Argument on the Whiteboard:**
  1.  Violating the NDA is **wrong**.
  2.  If violating the NDA is **wrong**, then inducing a breach is **wrong**.
  3.  Therefore, inducing a breach is **wrong**.

  **What this example MUST do:**
  *   **Isolate the Moral Term:** The word "wrong" must appear in P1 (asserted) and P2 (unasserted antecedent).
  *   **Maintain Validity:** The inference must be a textbook Modus Ponens. The audience must agree that *if* the premises are true, the conclusion follows.
  *   **Force the Embedding:** P2 forces them to consider the meaning of "wrong" when the speaker is *not* currently condemning the NDA violation.

  **What this example MUST NOT do:**
  *   **No Mixed Premises:** You are correct to be precious here. Do not use a premise like "Violating the NDA causes financial loss." That invites the Is/Ought gap discussion, which is metaphysical, not semantic. Keep it purely normative to isolate the *logic*.
  *   **No Content Dispute:** Choose an NDA example where the wrongness is stipulative for the sake of argument. You don't want an econ student arguing that NDAs reduce efficiency. Tell them: *"For the sake of the logical model, assume P1 is accepted."*

  ### 3. Misconception Map & Interception Points
  Here is where the pushback will come and how to parry it without derailing the clock.

  | Misconception | When it surfaces | How to head it off (Script) |
  | :--- | :--- | :--- |
  | **"Just bite the bullet: embedded sentences are meaningless."** | **Minute 20** (After introducing P2). | *"Linguistic competence trumps theory. You understand P2 perfectly well. If your semantic theory says a grammatically well-formed sentence you understand is meaningless, that's a reductio of the theory, not a solution."* |
  | **"It's just ambiguity (like bank/bank)."** | **Minute 25** (When explaining the meaning shift). | *"If 'wrong' means 'Boo!' in P1 but 'that someone has a Boo! attitude' in P2, that is equivocation. An argument with equivocation is invalid. But this argument **is** valid. We know it's valid. So the expressivist owes us an account of how the meaning stays the same."* |
  | **"You can't infer attitudes into existence."** | **Minute 30** (Discussing the Conclusion). | *"Careful. We aren't inferring attitudes. We are inferring a normative conclusion. The problem isn't psychological; it's that the **logic** connecting the premises breaks if the semantic content shifts. It's about truth-preservation (or warrant-preservation), not mind-reading."* |
  | **"This proves Expressivism is dead."** | **Minute 40** (Wrap up). | *"No. It proves Expressivism has a technical debt. Quasi-realists and hybrid theorists spend their careers paying this debt. The problem isn't a refutation; it's a constraint on the solution."* |

  ### 4. What to Refuse to Explain (The "Parking Lot")
  You have 45 minutes. You cannot save expressivism. You must explicitly flag two topics as **Out of Scope**. Write these on the corner of the board at the start.

  1.  **Hybrid Expressivism:** (e.g., moral sentences express *both* belief and attitude).
      *   *Why exclude:* It solves F-G by smuggling in cognitive content. Discussing it turns the session into a survey of metaethical theories rather than a deep dive on one logical problem.
      *   *Line to use:* *"Hybrid views solve this by changing the definition of moral meaning. We're assuming pure expressivism to see the problem clearly."*
  2.  **Deflationism / Quasi-Realism:** (e.g., "Who needs truth conditions?").
      *   *Why exclude:* You are right to worry about this crowd. Econ/Ling grads respect formal semantics. Telling them "truth-conditions don't matter" sounds like anti-intellectualism.
      *   *Line to use:* *"The expressivist isn't denying truth; they are trying to earn the right to use truth-talk without truth-conditions. That is the 'Quasi-Realist' project. It's a full PhD thesis in itself. Today we are looking at the problem that motivates it, not the solution."*

  ### 5. The Diagnostic Question
  Do not ask "Do you understand?" Ask a question that forces them to apply the constraint of **univocality**.

  **Put this on the board at Minute 42:**
  > *"If the expressivist says 'wrong' in the antecedent means 'is such that I would boo,' does the Modus Ponens inference remain valid? Why or why not?"*

  **What you are looking for:**
  *   **Success:** They identify that this changes the logical form (P1 is `Boo(A)`, P2 is `Boo(A) -> Boo(B)`, but the antecedent of P2 is now a descriptive claim about the speaker's psychology, not the attitude itself). They see that validity requires the *same* semantic contribution in both slots.
  *   **Failure:** They focus on whether the speaker *actually* boos. (This shows they missed the point about semantic content vs. psychological state).

  ### 6. Honest Limitations (For your opening/closing)
  Be explicit about what this session cannot deliver.
  *   **Opening:** *"In 45 minutes, we cannot solve the Frege–Geach problem. Philosophers have been fighting over this for 60 years. My goal is for you to see exactly **where** the logic breaks, not to fix it."*
  *   **Closing:** *"If you leave thinking expressivists just don't understand logic, I failed. If you leave thinking expressivists have a very specific, technical burden of proof regarding semantic compositionality, I succeeded."*

  ### Whiteboard Layout Plan
  *   **Left Column:** Expressivist Thesis (Meaning = Attitude).
  *   **Center Column:** The Argument (P1, P2, C) with "wrong" circled in red.
  *   **Right Column:** The Dilemma (1. Meaning shifts -> Invalid / 2. Meaning same -> What is it?).
  *   **Bottom Corner:** Parking Lot (Hybrid Views, Deflationism).

  This structure respects their logical training, avoids moralizing, and isolates the semantic technicality you need them to see. Good luck.
