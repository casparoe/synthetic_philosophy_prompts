prompt: |-
  I'm a metaethics PhD student and somehow I keep getting voluntold to run sessions in our department's "philosophy for non-philosophers" series — next month it's about 45 minutes, whiteboard, maybe fifteen grad students mostly from econ, linguistics, and psych, and the organizer handed me the Frege–Geach problem for expressivism as my topic. Plan the session for me. Don't explain the problem to me — I know it cold, I need the pedagogy.

  The audience is comfortable with basic logic (econ students eat modus ponens for breakfast) but knows zero metaethics, so the job isn't to make moral language seem weird to them — it's to make them see that the weirdness creates a specific technical problem for one specific view. So: the order the pieces need to go in, and why the sequence breaks if I reorder it — I'm actually tempted to open with negated moral sentences since they're easier than embedded conditionals, tell me whether that's a trap or a genuine on-ramp. For the carrying example, I don't want the standard getting-your-little-brother-to-torment-the-cat setup; give me something the econ folks won't find cartoonish, ideally with premises they'd actually endorse, and tell me what the example has to do and what it must NOT do (e.g. I suspect anything with mixed moral/descriptive premises imports baggage I don't want — am I right or just being precious?). Misconceptions I can already predict someone raising: that expressivism should just bite the bullet and call embedded moral sentences false or meaningless, that the whole thing is ambiguity like bank/bank, that this proves expressivism is dead and we can all go home, and the one where they think the punchline is that you can't infer attitudes into existence. Map where in the sequence each of these will surface and where exactly I should head it off. Also tell me what I should openly refuse to explain in 45 minutes and just flag as unfinished business — my guess is hybrid expressivism, but I worry the deflationist "who needs truth-conditions anyway" move is actually worse with this crowd since they've all seen a formal semantics. And end me with one question I can put to the room that would show me whether they got the real point, which as I understand it is that the expressivist needs one and the same occurrence of a moral term to make the same contribution in asserted and unasserted contexts, otherwise the inference loses its validity and with it the explanation of why the conclusion follows from the premises. Be honest about what a 45-minute version of this just can't deliver — my goal is that they leave seeing why the problem is about logic and not about people yelling their feelings at eachother, not that they leave with a verdict on whether expressivism survives.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Metaethics PhD student. Knows the Frege-Geach (F-G) problem cold. Needs pedagogy, not content explanation.
      *   **Task:** Plan a 45-minute session on F-G for non-philosophers (grad students in econ, linguistics, psych).
      *   **Constraints:** Whiteboard available. ~15 students. Comfortable with logic (modus ponens), zero metaethics.
      *   **Goal:** Make them see the *technical* problem for expressivism regarding logic/validity, not just that moral language is "weird."
      *   **Specific Questions to Answer:**
          *   Order of pieces & why reordering breaks it.
          *   Is opening with negated moral sentences a trap or on-ramp?
          *   Provide a non-cartoonish example (no tormenting cats) suitable for econ folks.
          *   What must the example do/not do? (Mixed premises?)
          *   Map predicted misconceptions to the sequence (bite bullet, ambiguity, expressivism dead, inferring attitudes).
          *   What to refuse to explain (hybrid, deflationism)?
          *   End with a diagnostic question.
          *   Be honest about limitations.

  2.  **Deconstruct the Audience & Topic:**
      *   *Econ/Ling/Psych:* They care about models, consistency, formal structure, and usage. Econ folks especially care about revealed preference and consistency in choice. Linguists care about compositionality. Psych folks care about cognitive states.
      *   *The Core Issue:* Expressivism says "Murder is wrong" = Boo Murder! (Non-cognitive attitude). But in "If murder is wrong, then stealing is wrong," "Murder is wrong" isn't expressing Boo! It's embedded. If the meaning changes, Modus Ponens breaks.
      *   *Time:* 45 minutes is *tight*. You can't do history, objections, solutions, and meta-objections. You have to do *The Setup, The Problem, The Stakes.*

  3.  **Address Specific Pedagogical Choices:**

      *   **Ordering:**
          *   Standard: Assertoric Moral Claim -> Expressivist Analysis -> Embedded Context -> The Clash.
          *   User's Idea: Start with Negation?
          *   *Verdict:* Trap. Negation ("It is not the case that murder is wrong") is tricky for expressivists (Boo! vs. Not-Boo!), but it doesn't highlight the *logical validity* issue as sharply as conditionals do. Modus Ponens is the hammer. Conditionals are the anvil. Negation is a side skirmish. Stick to conditionals for the main argument.
          *   *Sequence:*
              1.  Expressivist Core Thesis (Meaning = Attitude).
              2.  Logic 101 Review (Validity depends on form/meaning consistency).
              3.  The Embedding (The Conditional).
              4.  The Mismatch (Ambiguity vs. Validity).
              5.  The Stakes (Logic vs. Psychology).

      *   **The Example:**
          *   *Constraint:* No cartoonish "tormenting cats." Econ grads need something structural or normative in a way they recognize (rules, efficiency, obligations).
          *   *Idea:* Tax evasion or Contract violation. Let's go with *Contract Violation*. It's normative but dry.
          *   *Premises:*
              1.  Violating contracts is wrong.
              2.  If violating contracts is wrong, then evading taxes is wrong (assuming tax law is a social contract).
              3.  Therefore, evading taxes is wrong.
          *   *Refinement:* Actually, for Econ, "Pareto Efficiency" or "Utility" might be too descriptive. Let's stick to a simple normative rule they accept as a rule. How about *Promising*? It's the classic Searle/Anscombe territory but clean.
          *   *Better Idea for Econ:* *Defaulting on Debt.*
              1.  Defaulting on debt without cause is wrong.
              2.  If defaulting on debt without cause is wrong, then exploiting loopholes to avoid repayment is wrong.
              3.  Therefore, exploiting loopholes... is wrong.
          *   *Wait, keep it simpler.* The logic needs to shine, not the moral content.
          *   *Selection:* **The "Fairness" Example.** Econ folks understand fairness as a constraint.
              1.  Discriminating based on race is unfair.
              2.  If discriminating based on race is unfair, then the policy is invalid.
              3.  Therefore, the policy is invalid.
              *Critique:* "Invalid" is ambiguous (logical vs. normative).
              *Revised Selection:* **The "Obligation" Example.**
              1.  You ought to honor the contract.
              2.  If you ought to honor the contract, you ought to pay the penalty for breach.
              3.  Therefore, you ought to pay the penalty.
              *Why:* "Ought" is clearly normative. Econ folks deal with obligations/constraints.
              *Constraint Check:* Mixed premises? The prompt asks about mixed moral/descriptive. The F-G problem arises even in *purely* moral inferences. Keep it purely moral to avoid the "is-ought" distraction.
              *What the example must do:* Show a valid Modus Ponens inference where the moral term appears once asserted, once unasserted.
              *What it must NOT do:* Rely on the truth of the premises. The validity must hold *even if* they reject the premises. It must not rely on descriptive facts (e.g., "Stealing causes pain").

      *   **Misconceptions Mapping:**
          1.  *Bite the bullet (embedded sentences are meaningless):* Arises immediately after introducing the conditional. Head off by appealing to linguistic competence (we understand these sentences fine).
          2.  *Ambiguity (bank/bank):* Arises when explaining the expressivist distinction. Head off by showing it destroys validity (equivocation).
          3.  *Expressivism is dead:* Arises at the end. Head off by noting this is a research program, not a refutation (mention solutions exist without detailing them).
          4.  *Inferring attitudes:* Arises when discussing what the conclusion expresses. Head off by distinguishing *validity of argument* from *psychology of speaker*.

      *   **What to Refuse:**
          *   *Hybrid Expressivism:* Too complex.
          *   *Deflationism/Quasi-Realism:* This is the big one. With a logic-heavy crowd, saying "truth-conditions don't matter" sounds like hand-waving. Acknowledge it as "The Solution Space" but refuse to evaluate it.
          *   *Embedding in other contexts (questions, commands):* Stick to conditionals.

      *   **Diagnostic Question:** Needs to test if they understand *why* the meaning must be constant for validity to hold.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Timing:* 45 mins is brutal.
          *   0-5: Setup (Expressivism + Logic).
          *   5-15: The Expressivist Account of Assertion.
          *   15-25: The Embedding (The Trap).
          *   25-35: The Logical Crisis (Validity).
          *   35-40: Misconceptions/Objections.
          *   40-45: Conclusion + Diagnostic.
      *   *Negation:* User asked specifically. I will advise against it as the *opener*. It's a distraction. The conditional is the killer.
      *   *Example:* Let's use **Tax Evasion**. It's dry, normative, and Econ folks have opinions on it without it being "cartoonish evil."
          *   P1: Evading taxes is wrong.
          *   P2: If evading taxes is wrong, then facilitating evasion is wrong.
          *   C: Facilitating evasion is wrong.
      *   *Mixed Premises:* User is right to be precious. Mixed premises invite the "Is-Ought" gap distraction. Keep the inference purely normative to isolate the *logical* form.

  5.  **Refining the "Why Sequence Matters":**
      *   If you start with the conditional, they don't feel the force of expressivism.
      *   If you start with negation, they think it's about contradiction, not validity.
      *   You must establish the *Expressivist Semantic Claim* first, then the *Logical Requirement*, then show the *Conflict*.

  6.  **Addressing the Deflationist Worry:**
      *   User worries deflationism looks weak to formal semantics folks. They are right. A "truth-conditional" semantics is the default for linguists/logicians. Telling them "truth doesn't matter" sounds like giving up. Better to frame it as "Expressivists need to *recover* truth-conditions" rather than "dump them."

  7.  **Final Polish:**
      *   Tone: Peer-to-peer (PhD to PhD). Direct, no fluff.
      *   Structure: Time-stamped.
      *   Whiteboard usage: Explicitly noted.

  8.  **Self-Correction on the Example:**
      *   Tax evasion might trigger political debate.
      *   Let's go with **Promising**. It's the cleanest normative concept.
      *   P1: Breaking promises is wrong.
      *   P2: If breaking promises is wrong, then getting your assistant to break promises is wrong.
      *   C: Getting your assistant to break promises is wrong.
      *   *Wait, Econ folks might view promises as cheap talk.*
      *   *Better:* **Contract Breach.**
      *   P1: Breaching this contract is impermissible.
      *   P2: If breaching this contract is impermissible, then inducing a breach is impermissible.
      *   C: Inducing a breach is impermissible.
      *   *Why:* "Impermissible" is deontic logic territory. Econ/Logic folks respect deontic structures.

      *(Self-Correction)*: Actually, keep it even simpler. "Wrong" is fine if the context is dry. Let's stick to the user's "carrying example" request but make it professional.
      *   *Idea:* **Insider Trading.**
      *   P1: Insider trading is wrong.
      *   P2: If insider trading is wrong, then tipping a friend is wrong.
      *   C: Tipping a friend is wrong.
      *   *Why:* Econ folks know the model. It's normative but technical.

      *(Final Decision on Example)*: Let's use **Subsidies**. It's neutral enough.
      *   P1: Subsidizing fossil fuels is inefficient/wrong (let's stick to 'wrong' for the logic).
      *   Actually, let's listen to the prompt's hint: "Premises they'd actually endorse." Econ folks endorse *consistency*.
      *   Let's use a **Transitivity** example.
      *   P1: A is worse than B.
      *   P2: If A is worse than B, then A is worse than C (given B=C).
      *   No, that's value theory.
      *   Okay, stick to **Contractual Obligations**. It's the most "Econ" normative framework.
      *   P1: Violating the NDA is wrong.
      *   P2: If violating the NDA is wrong, then encouraging others to violate it is wrong.
      *   C: Encouraging others to violate the NDA is wrong.

      *Wait, I need to make sure I answer the "Mixed Premises" question.*
      *   User asks: "I suspect anything with mixed moral/descriptive premises imports baggage I don't want — am I right or just being precious?"
      *   Answer: You are right. If P1 is descriptive and P2 is conditional, you invite Hume's Law objections. Keep P1 and P2 both containing the moral term to isolate the *semantic* issue, not the *metaphysical* one.

  9.  **Finalizing the Diagnostic Question:**
      *   Needs to target the "Same Meaning in Different Contexts" issue.
      *   "If I say 'Boo!' and then say 'If Boo!, then...', have I used the same word?"

      *(Refining the Diagnostic)*:
      *   "If the meaning of 'wrong' in the premise is an attitude, and in the conditional it's not, why is the argument not an equivocation fallacy like 'banks'?"

  10. **Writing the Response:** (Incorporating all constraints).
      *   Acknowledge expertise.
      *   Direct advice on the negation trap.
      *   The Example (NDA/Contract).
      *   The Timeline.
      *   The Misconception Map.
      *   The "Do Not Touch" list.
      *   The Diagnostic.
      *   The Honest Limitation.

      *(Self-Correction on Negation)*: The user asked "tell me whether that's a trap or a genuine on-ramp."
      *   My advice: It's a trap for *this* audience. Negation invites "contradiction" discussions. Conditionals invite "validity" discussions. F-G is about validity.

      *(Self-Correction on Deflationism)*: User worries deflationism is worse with formal semantics crowd.
      *   My advice: Agree. Don't pitch deflationism as "truth doesn't exist." Pitch it as "we need a functional equivalent of truth." But honestly, just flag it as "The Quasi-Realist Project" and move on. Don't try to sell it.

      *(Final check on time)*: 45 mins.
      *   5 min: Expressivism 101.
      *   10 min: The Logic Requirement.
      *   15 min: The Clash (F-G).
      *   10 min: Objections/Mapping.
      *   5 min: Wrap/Question.
      *   This is tight. Need to be ruthless.

      *(One last thought on the Example)*: Make sure the example is valid *logically*.
      *   P1: Wrong(A)
      *   P2: Wrong(A) -> Wrong(B)
      *   C: Wrong(B)
