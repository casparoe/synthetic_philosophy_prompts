answer: |-
  Dear Colleague,

  It is a pleasure to engage with this problem, not least because the tension you describe is the very engine that has driven the most productive debates in contemporary normative theory for the last thirty years. You are rightly worried that your intuitions are pulling you in opposite directions, but I want to reassure you that your track record is actually more coherent than it might feel in the moment. You are describing a view that prioritizes individual inviolability regarding vital interests while permitting utilitarian-style aggregation for sub-vital burdens. This is a recognizable position, often discussed under the label of threshold contractualism or moderate contractualism, and it can be formalized into a principle that handles most of your cases without collapsing into pure utilitarianism or rigid absolutism.

  The principle that best captures your verdicts is what I will call the Threshold Complaint Principle. It states that a policy is permissible if and only if no individual can reasonably reject it, where reasonable rejection is determined by comparing the strongest individual complaint against the strongest individual complaint on the opposing side, with one crucial proviso: complaints regarding vital interests, such as life and bodily integrity, occupy a lexical priority over complaints regarding non-vital interests, such as pain, time, or convenience, unless the vital interest is being sacrificed as a means or subjected to a certain harm rather than a probabilistic risk. However, when all competing complaints fall below the threshold of vital interest, they may be aggregated across persons to determine which policy minimizes the total burden. This principle accommodates your transplant verdict because the one healthy visitor has a vital complaint against being killed that lexically outweighs the vital complaints of the five dying patients, since the one is being used as a means. It handles the trolley case because the complaint of the one is not lexically superior to the five when the threat is merely being redirected, not newly initiated, though some contractualists prefer to explain this via the distinction between doing and allowing. Your chlorination verdict is saved by the risk proviso; because the risk of death is distributed ex ante as a minuscule probability to everyone, it falls below the threshold of a vital complaint for any specific individual, allowing it to be outweighed by the certain prevention of disease.

  The load-bearing verdicts in your list are undoubtedly the transplant case and the death versus pain case. These establish the lexical priority of vital interests over aggregated non-vital interests. If you abandon the idea that one death outweighs a thousand weeks of pain, you lose the distinctively contractualist protection of the individual against the collective. The verdict that is most likely to be overturned by a consistent application of this principle is your hesitation regarding the one versus two deaths case. If vital interests cannot be aggregated, as your death versus pain verdict suggests, then you cannot simply say the two must be saved because two is greater than one. To remain consistent with the non-aggregationist core of contractualism, you must accept that when vital interests are identical and in conflict, numbers do not count, and the only fair procedure is a lottery. I suspect you will find this verdict cold and perhaps counterintuitive for public policy, but it is the price of maintaining the barrier against aggregation that protects the individual in the transplant case.

  To show you where this principle might lead to an answer you will not like, consider a case where saving a single life requires imposing a moderate financial cost on every person in a nation. Suppose a specific medical treatment costs one billion dollars and will certainly save one identified child from a rare disease, and the funding mechanism requires a one hundred dollar tax on every citizen of a ten million person country. For any single individual, one hundred dollars is a non-vital burden, well below the threshold of lexical priority. However, the aggregated sum is massive. Under the Threshold Complaint Principle, because the child's vital interest lexically outweighs any individual's non-vital financial complaint, you must fund the treatment. You cannot aggregate the one hundred dollar complaints to outweigh the child's life. I predict you will feel the pull of the intuition that at some point, the aggregated waste of resources becomes morally significant enough to let the child die, perhaps because that money could save more lives elsewhere, but the principle as derived from your verdicts forbids this trade-off unless you introduce a secondary aggregation rule for vital interests which would undermine your death versus pain verdict.

  Applying this principle to your transport ministry case yields a clear, if demanding, verdict. You are weighing three certain deaths against a loss of ten minutes per day for ten years for two million people. For any single commuter, the total time loss is approximately twenty-five days over a decade. While frustrating, this burden does not rise to the level of a vital interest; it does not threaten their life or bodily integrity. The three individuals facing death, however, have vital complaints. According to the lexical priority established in your death versus pain case, the vital complaints of the three outweigh the aggregated non-vital complaints of the two million commuters. Therefore, the principle dictates that the ministry must fund the barrier upgrade. The commuters cannot reasonably reject the policy because their individual complaints are below the threshold required to override the vital interests of the motorists. This supports your dissertation's aim of defending safety regulation, but it does so by insisting that safety trumps efficiency regardless of the scale of the efficiency loss, provided the efficiency loss is distributed thinly enough.

  Now I must give you my honest judgment on whether this principle remains contractualism in a recognizable sense. The short answer is that it is a hybrid view that smuggles in aggregation across persons, specifically in the sub-vital domain. Pure Scanlonian contractualism insists on the Individualist Restriction, which forbids comparing the sum of many people's reasons against one person's reason. By allowing the million headaches to outweigh the one migraine, you are explicitly aggregating reasons across persons. You are acting like a utilitarian for minor burdens and a contractualist for major ones. Many philosophers argue that this is the only way to make contractualism plausible for public policy, but purists will argue that you have abandoned the core insight of the tradition, which is that morality is about what we owe to each other as individuals, not about maximizing overall welfare. If your dissertation depends on being read as a strict defense of Scanlonian contractualism, this aggregation will be a vulnerability. However, if you frame it as a development of contractualism adapted for the realities of public health where risk and minor burdens are ubiquitous, it is a robust and defensible position. You are not sinking the chapter; you are merely discovering that a viable public health contractualism must be moderate rather than pure. You should own this hybridity rather than trying to hide it, as it is the only way to reconcile the chlorination case with the transplant case without contradiction.
