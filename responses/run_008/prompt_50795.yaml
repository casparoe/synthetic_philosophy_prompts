  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is 12 people too many for one Agent?
      *   *Fix:* Split into two groups of 6 running parallel, or have 2 Agents per round. Let's do 2 Teams of 6. Team A plans, Team B is World. Then swap. This keeps engagement high.
      *   *Materials:* Need whiteboards, tokens, timer.
