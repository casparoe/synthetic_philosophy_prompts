  **(2) Group Convergence: 0.60**
  *Justification:* This is the moral realism bet. If there are moral facts, idealized humans find them. If values are purely contingent expressions of evolutionary psychology, idealized humans diverge. I assign >0.5 because even anti-realists often observe convergence on basic flourishing, but <0.7 because "important choices" (e.g., mind uploading, population ethics) show stubborn cultural variance.

  **(3) Operator Stability: 0.55**
  *Justification:* The "extrapolation operator" is underspecified. Path dependence in cognitive enhancement is severe; *how* you think longer (which heuristics you prune, which memories you weight) determines the destination. Slight variations in the extrapolation algorithm likely yield orthogonal moral outcomes, making the target arbitrary relative to implementation details.

  **(4) Reference Class Stability: 0.90**
  *Justification:* Definitional. While population ethics is hard, defining the *current* set of humans whose volition is being extrapolated is tractable. The 0.10 uncertainty covers edge cases (uploads, embryos, severe cognitive disability) but these are unlikely to break the *determinacy* of the target, only its content.

