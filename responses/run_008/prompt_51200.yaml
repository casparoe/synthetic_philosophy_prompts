      *   (3) *Scale:* Driving on the right is a paradigm convention (despite anonymity/size).
      *   (4) *Sanctions:* Punishment-backed norms (dueling, foot-binding) *are* conventions, not just penalty-propped regularities.
      *   (5) *Arbitrariness:* Conventions are arbitrary (payoffs don't favor adopted option over alternatives), compatible with historical explanation.
      *   (6) *Language:* Language is conventional in the same sense as driving (meaning = regularity).
      *   (7) *Normativity (General):* Conventions generate *no obligations*. Deviation is imprudent, not wrong.
      *   (8) *Normativity (Specific):* Breaking a promise is *wrong*. Promising is itself a convention.

  3.  **Identify Potential Tensions:**

      *   *Tension A: (7) vs. (8).*
