          *   (8) says promising is a convention AND breaking a promise is wrong.
          *   *Conflict:* If promising is a convention, and conventions generate no obligations, then breaking a promise shouldn't be wrong. But (8) says it is. This is a direct contradiction.
          *   *Severity:* High. This is a logical contradiction within the system.

      *   *Tension B: (1)/(5) vs. (4).*
          *   (1) defines convention as a solution to a *coordination problem* (preferences align conditional on conformity).
          *   (5) emphasizes *arbitrariness* (payoffs don't favor one over the other).
          *   (4) includes punishment-backed norms like foot-binding or dueling.
          *   *Conflict:* Lewisian conventions are typically about *coordination* (I want to do what you do). Punishment-backed norms often involve *conflict* or *prisoner's dilemma* structures (I prefer not to bind feet/do duel, but I do it to avoid sanction). If the sanction changes the payoff structure such that conformity is preferred *regardless* of what others do (to avoid punishment), is it still a coordination problem? Lewis distinguishes conventions from norms backed by external sanctions. If the "preference conditional on conformity" in (1) is driven *only* by fear of punishment rather than the intrinsic benefit of coordination, does it fit (1)?
          *   *Severity:* Medium-High. It challenges the core definition (1) when applied to the examples in (4).

      *   *Tension C: (2) vs. (3).*
          *   (2) requires common knowledge (iterated expectations).
