          2.  (1)/(5) vs. (4) - Definition vs. Example (Coordination vs. Sanction).
          3.  (2) vs. (3) - Epistemic Feasibility.
          4.  (6) vs. (7)/(8) - Derivative of #1.
      *   **Analysis of Each:** Explain *why* it's a tension and the severity.
      *   **Revisions:** Propose specific wording changes.
      *   **The "One Fix":** Identify the modification to (7) as the highest leverage.

  8.  **Refining the Analysis (Self-Correction/Nuance Check):**
      *   *Check on (4):* Lewis actually *excludes* norms sustained purely by punishment from being conventions. He calls them "norms" but distinguishes them from "conventions" if the equilibrium isn't coordinative. If the user insists foot-binding is a convention *in the full sense*, they are stretching Lewis. I need to point out that Lewis would likely call foot-binding a *norm* but not a *convention* if the preference is driven solely by sanction.
      *   *Check on (7):* Lewis explicitly says conventions are not inherently normative. He treats promising as a special case where the convention allows for the *creation* of obligations, but the obligation comes from the act of promising (invoking the convention), not the convention itself. So (7) is technically Lewis-correct, but (8) needs to be phrased carefully to avoid contradiction. (8) says "Promising is itself a convention." If the *practice* is a convention, does the *obligation* flow from the convention? Lewis says the obligation flows from the *expectation* created.
