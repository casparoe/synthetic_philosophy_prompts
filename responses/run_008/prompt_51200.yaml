answer: |-
  This is a sophisticated package that captures the core of Lewis's *Convention* quite well. However, because Lewis's framework is precise, compressing it into eight propositions creates friction points where the definitions interact with normative intuitions.

  Here is the consistency check, ranked by severity of tension, with proposed revisions.

  ### 1. The Logical Contradiction: (7) vs. (8)
  **Severity:** Critical
  **The Tension:** This is a direct logical contradiction.
  *   (7) states: Conventions generate **no obligations**; deviation is **never wrong**.
  *   (8) states: Promising **is** a convention; breaking a promise **is wrong**.
  *   If promising is a convention (per 8), and conventions never generate obligations/wrongness (per 7), then breaking a promise cannot be wrong. You cannot hold both propositions as written. Lewis himself wrestled with this, eventually arguing that while the *convention* of promising isn't inherently moral, the *act* of invoking it creates an obligation via reliance. Your current phrasing collapses that distinction.

  **Cheapest Revision:** Qualify (7).
  *   *Current:* "conventions by themselves generate no obligations, so unilateral deviation from one is at most imprudent, never wrong"
  *   *Revision:* "conventions *qua* regularities generate no obligations, though specific conventional practices (like promising) may generate obligations through additional mechanisms (e.g., induced reliance or explicit invocation)."
  *   *Why:* This preserves the Lewisian insight that mere regularity (like driving side) isn't moral, while allowing that specific conventional *institutions* can become normative.

  ### 2. The Definitional Stretch: (1)/(5) vs. (4)
  **Severity:** High
  **The Tension:** This challenges the core definition of a convention.
  *   (1) defines a convention as a solution to a **coordination problem** (I prefer to conform *because* you conform).
  *   (5) emphasizes **arbitrariness** (payoffs don't favor one equilibrium over another).
  *   (4) classifies punishment-backed norms (dueling, foot-binding) as conventions "in the full sense."
  *   *The Problem:* In Lewis's strict game-theoretic sense, if a practice persists *primarily* because deviation is sanctioned (punished), the payoff structure is often a **Prisoner's Dilemma** or an Assurance Game stabilized by external penalties, not a pure Coordination Game. If I bind my daughter's feet only to avoid social ostracization, but would prefer *not* to bind them even if everyone else did (absent the sanction), it is not a Lewisian convention. It is a norm enforced by sanctions. Calling it a convention "in the full sense" stretches definition (1).

  **Cheapest Revision:** Qualify (4).
  *   *Current:* "punishment-backed norms... are conventions in the full sense and not merely regularities propped up by penalties"
  *   *Revision:* "punishment-backed norms... are conventions **provided the underlying preference structure remains coordinative** (i.e., agents prefer conformity conditional on others' conformity, independent of the penalty, though penalties may stabilize the equilibrium)."
  *   *Why:* This protects definition (1). It allows you to keep foot-binding as a convention *if* you can argue the coordination preference exists independently of the sanction, but admits that if the sanction is the *only* reason, it falls outside the Lewisian definition.

  ### 3. The Epistemic Idealization: (2) vs. (3)
  **Severity:** Medium
  **The Tension:** This is a known technical hurdle in Lewis's theory.
  *   (2) requires **common knowledge** (iterated expectations: I know that you know that I know...).
  *   (3) cites **driving** in a large anonymous population as a paradigm.
  *   *The Problem:* Strictly speaking, common knowledge is cognitively impossible in large populations (I cannot form beliefs about specific strangers). If (2) is read as a psychological requirement, (3) is false. If (2) is read as a rational reconstruction, (3) holds, but the wording "unless the parties expect..." suggests a psychological state.

  **Cheapest Revision:** Clarify (2).
  *   *Current:* "unless the parties expect the conformity of others, expect the others to expect it, and so on, there is no convention"
  *   *Revision:* "unless the parties have **reason to believe** in the conformity of others, and reason to believe others have similar reason, and so on, there is no convention."
  *   *Why:* Lewis uses "reason to believe" to bypass the need for actual infinite cognitive iterations. This allows public signals (road signs, laws) to ground the common knowledge in large populations without requiring drivers to mentally enumerate each other.

  ### 4. The Semantic Normativity: (6) vs. (7)
  **Severity:** Low (Derivative of #1)
  **The Tension:** This is a subset of the (7)/(8) problem but applied to language.
  *   (6) says language is a convention (like driving).
  *   (7) says conventions create no obligations.
  *   *The Problem:* If language is just like driving, then lying or using words incorrectly is merely "imprudent" (communication fails), not "wrong." While this fits Lewis, it often clashes with reading groups that view linguistic norms as having a deontic flavor. However, this is only a tension if you believe linguistic misuse is *wrong* rather than just *confusing*. If you accept (7), (6) is fine. The tension only spikes if you implicitly hold that lying is morally wrong (which links back to 8).

  **Cheapest Revision:** None needed if (7) is fixed.
  *   If you revise (7) as suggested above, (6) remains consistent. Language is a convention; using it to promise creates an obligation, but using it to describe the weather does not.

  ---

  ### Summary of Rankings

  1.  **(7) vs. (8):** Logical Contradiction. (Must fix).
  2.  **(1)/(5) vs. (4):** Definitional Integrity. (High risk of misrepresenting Lewis).
  3.  **(2) vs. (3):** Epistemic Feasibility. (Technical fix available).
  4.  **(6) vs. (7):** Derivative Normativity. (Resolved by fixing #1).

  ### The Single Revision That Cleans Up the Most

  **Revise Proposition (7).**

  The contradiction between (7) and (8) is the only logical impossibility in the set; the others are tensions of application or definition. By modifying (7) to distinguish between the **conventional basis** (which is non-normative) and the **normative force** that can supervene on specific conventions (like promising), you achieve three things:
  1.  You resolve the flat contradiction with (8).
  2.  You preserve the Lewisian intuition that *mere* regularities (like driving) aren't moral obligations.
  3.  You make it easier to defend (4), because you can argue that punishment-backed norms acquire their "ought" force through the sanction mechanism, not the convention itself, keeping the definition of "convention" pure.

  **Suggested Text for (7):**
  > "(7) conventions *qua* regularities generate no intrinsic moral obligations, so unilateral deviation from a bare convention is at most imprudent; however, certain conventional practices (like promising) may generate obligations through distinct mechanisms such as reliance or explicit invocation."

  This single change allows you to circulate the package without inviting immediate refutation on the grounds of logical inconsistency.
