      *   **Context:** They've read the standard objections and noticed defenders add qualifications (idealization, in-principle limits, soundness vs. consistency, etc.).
      *   **Conflict:** Their friends think these qualifications make the thesis unfalsifiable (immunized against criticism). The user suspects some qualifications are "load-bearing and genuine."
      *   **Task:**
          1.  Map out what would count *against* the view, ranked by severity (Fatal -> Serious -> Awkward).
          2.  Include standard objections (consistency vs. truth, human error) and less-discussed ones (human inconsistency, unsound machines, "proves too much" objections).
          3.  For each objection, specify whether a thoughtful defender would concede or reject it, and *which qualification* insulates them.
          4.  Address the meta-question: Is the view falsifiable? If not, is that a defect or just metaphysics? Be honest about the insulation.
