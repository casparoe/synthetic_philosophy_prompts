  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A philosopher (likely early-mid career) giving a talk at a workshop on empirical moral psychology.
      *   **Topic:** Critique of the Situationist Challenge to Virtue Ethics.
      *   **Thesis:**
          1.  Situationist critique (Doris, Harman, etc.) relies on shaky empirical data (Milgram, Darley & Batson).
          2.  *However*, traditional Aristotelian character (stable cross-situational disposition) is still problematic.
          3.  *Rebuild:* *Phronesis* (practical wisdom) is primarily *situation-management* (pre-structuring environment, Ulysses contracts), not just internal robustness.
          4.  *Result:* Closer to situationists than virtue ethicists, but saves character talk.
      *   **Audience:** Experimental philosophers (x-phi) and Social Psychologists (specifically replication-focused, sceptical of classic studies).
      *   **Constraints:** British English. Practical prep sheet format (not an essay). 8 objections ordered by damage potential. 2-minute replies + "soft spot" analysis. Concessions to make up front. The "killer question" to avoid.
      *   **Tone:** Professional, candid, strategic, rehearsed.

  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *The Psychologists:* They hate the classic studies (Milgram, Good Samaritan). They care about effect sizes, power, replication, confounds. If the speaker leans on these studies to say "they aren't *that* bad," the psychologists will eat them alive. The speaker needs to agree that the studies are messy but argue the *interpretation* is the real issue.
      *   *The X-Phi:* They know the Doris/Harman literature inside out. They will probe the definition of "character" and "virtue." They will ask if this "situation-management" view is just virtue ethics in name only.
      *   *The Tension:* The speaker is trying to walk a tightrope. Admitting the studies are weak pleases the psychologists but undermines the standard situationist narrative (which the speaker is critiquing). Arguing for a rebuilt virtue ethics risks alienating traditional Aristotelians (not present, but the x-phi know the literature) and might look like moving the goalposts to the psychologists.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Idea 1:* The studies *are* robust enough. (Psychologists will hate this).
      *   *Idea 2:* You've redefined virtue so much it's not virtue anymore. (X-phi standard move).
      *   *Idea 3:* Situation management isn't character, it's just prudence.
      *   *Idea 4:* If character is just environment selection, what happens when you can't select the environment?
      *   *Idea 5:* You're conceding too much to the situationists.
      *   *Idea 6:* Empirical evidence for *your* view? (Where's the data on situation-management?)
      *   *Idea 7:* Is this just self-help?
      *   *Idea 8:* The definition of *phronesis*.

      *Refining for Audience:*
      *   Need to mix "effect size/power" language (Psych) with "global traits/normative work" language (X-Phi).
      *   Order by damage: The most damaging is likely that the view collapses into something non-virtue-ethical or lacks empirical support itself.

      *Selection & Ordering:*
      1.  **The "Goalpost Shift" (X-Phi):** Is this still virtue ethics?
      2.  **The "Empirical Vacuum" (Psych):** Where's the data for situation-management?
      3.  **The "Privilege/Constraint" Objection (Both):** What if you can't choose your situation?
      4.  **The "Classic Studies" Trap (Psych):** Are you actually defending Milgram?
      5.  **The "Moral Credit" Problem (X-Phi):** Do you get credit for avoiding the test?
      6.  **The "Fragmentation" Objection (X-Phi):** Local traits vs. Global traits.
      7.  **The "Psychological Reality" Objection (Psych):** Do people actually do this?
      8.  **The "Normative Force" Objection (X-Phi):** Is this ethics or just efficiency?

  4.  **Drafting Replies & Soft Spots:**
      *   *Reply Style:* Concise, 2 minutes spoken.
      *   *Soft Spot:* Honest admission of weakness.
      *   *Language:* British English (e.g., "defence," "programme," "maths," "whilst").

  5.  **Identifying Concessions & The Killer Question:**
      *   *Concessions:* Must concede the classic studies are methodologically fraught. Don't defend Milgram's internal validity. Concede that "global robustness" is empirically unsupported.
      *   *Killer Question:* Something that exposes the lack of empirical backing for the "situation-management" claim or the normative emptiness of the new definition. "If *phronesis* is just avoidance, where is the moral growth?"

  6.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I use British English? Yes.
      *   *Check:* Is it practical? Yes, bullet points and bold text.
      *   *Check:* Is the tone right? Yes, supportive but critical.
      *   *Check:* Did I address the specific psychologists' bias? Yes, emphasized not defending the old studies.
      *   *Check:* Is the "Rebuild" clear? Yes, focused on Ulysses-style pre-commitment.

  7.  **Final Polish:** Ensure the distinction between the X-Phi (Doris-style) and Psych (replication-style) voices is clear in the objections. Make sure the "Soft Spot" is genuinely useful for rehearsal. (e.g., admitting that avoiding temptation isn't the same as overcoming it).

  *(Self-Correction during drafting Objection 4)*: I need to be careful here. The user says the classic studies are shakier than philosophers pretended. But the psychologists *hate* those studies. If the user says "They are shaky," the psychologists agree. If the user says "But they still show *something*," the psychologists might push back. The strategy should be: "The studies are messy, so the *strong* situationist conclusion doesn't follow, but the *weak* conclusion (context matters) does."

  *(Refining the Killer Question)*: The killer question needs to target the *normative* value. If I avoid the situation, am I virtuous? Or just lucky/clever? This strikes at the heart of the "rebuild."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Situationism, Virtue, and Situation-Management

  **Context:** Workshop on Empirical Moral Psychology.
  **Audience:** X-Phi (Doris/Harman literate) + Replication-focused Social Psychs (sceptical of classics).
  **Tone:** British English. Practical rehearsal notes.

  ---

  ## Up-Front Concessions
  *Do not wait for these to be dragged out of you. Bake them into your closing remarks or opening framing to disarm the psychologists immediately.*

  1.  **Concede the Methodological Mess:** Explicitly state that you are *not* defending the internal validity of Milgram or Darley & Batson. Agree that the classic studies are "a mess" (quote the psychologist back to her). Your point is not that the data is perfect, but that the *philosophical extrapolation* from messy data to "no character exists" is invalid.
  2.  **Concede Global Robustness:** Admit that the Aristotelian ideal of a "global trait" that manifests identically across vastly different contexts is empirically unsupported. Do not fight for the "saint who never slips." Fight for the "wise person who knows where not to slip."

  ---

  ## The Eight Objections (Ordered by Damage Potential)

  ### 1. The "Goalpost Shift" Objection (X-Phi)
  **The Question:** "You've redefined *phronesis* so radically that it no longer does the normative work virtue ethics requires. If character is just environmental selection, isn't this just prudential risk-management? You've saved the label 'virtue' by evacuating it of moral content."
  **The 2-Minute Reply:** "I'm not evacuating moral content; I'm relocating the locus of control. Traditional virtue ethics locates morality entirely *in* the moment of action. I'm arguing the moral work happens *before* the moment of action. Choosing not to put yourself in a position where you'll harm someone isn't just prudence; it's a moral commitment to reliability. If virtue is about flourishing and doing good, and we know situations corrupt judgment, then managing the situation is the most moral thing you can do."
  **The Soft Spot:** You are vulnerable to the charge that avoiding temptation isn't the same as *overcoming* it. A virtue ethicist wants the person who resists the biscuit, not the one who hides it. You need to argue why hiding it is morally equivalent or superior.

  ### 2. The "Empirical Vacuum" Objection (Psychologist)
  **The Question:** "You critique the situationists for leaning on shaky data, but where is *your* data? You claim the practically wise person pre-structures their environment. Do you have effect sizes for that? Is there any evidence that 'situation-managers' actually behave more ethically than 'trait-reliant' people?"
  **The 2-Minute Reply:** "That's a fair challenge, and it's where the empirical work needs to go next. Currently, we have robust data on 'implementation intentions' and pre-commitment strategies in behavioural economics and health psychology. My claim is a synthesis: taking those empirical findings and applying them to moral architecture. I'm not claiming this is proven yet; I'm claiming it's a more fertile hypothesis than searching for non-existent global traits."
  **The Soft Spot:** You have no direct empirical evidence for your specific thesis. You are leaning on adjacent fields (behavioural econ/health). If they press for *moral* specific data, you have none.

  ### 3. The "Privilege and Constraint" Objection (Both)
  **The Question:** "Situation-management requires agency and resources. You can choose your friends or hide the biscuits only if you have control over your environment. What happens to your virtue ethics for people in high-constraint environments (poverty, oppression, rigid hierarchies) where they *cannot* avoid the corrupting situations?"
  **The 2-Minute Reply:** "This is the strongest limitation of the view, and I accept it. My rebuild works best for a certain slice of agency. However, even in constrained environments, there are micro-choices of attention and association. But I concede: a virtue ethics based on situation-management risks being an ethics for the privileged. It suggests we need a complementary political ethics to change the situations themselves, not just manage them individually."
  **The Soft Spot:** This admits your theory is incomplete. It risks making virtue a luxury good. Be prepared to pivot to collective situation-management (policy) if pressed.

  ### 4. The "Classic Studies" Trap (Psychologist)
  **The Question:** "You say the situationist critique relies on shaky studies. But even if Milgram was messy, the *aggregate* of modern social psych still shows situation dominates disposition. Are you actually denying the basic finding that context swamps character, or just quibbling about the 1960s data?"
  **The 2-Minute Reply:** "I'm not denying context matters. I'm denying the *dichotomy*. The situationist argument is: 'Context matters, therefore traits don't.' I'm saying: 'Context matters, therefore traits must be defined *in relation* to context.' Even small effect sizes for disposition matter if the agent knows how to amplify them by choosing the right context. It's not about denying the power of the situation; it's about refusing to let that power render agency void."
  **The Soft Spot:** You must be careful not to sound like you're minimising situational power. The psychologists will pounce if you imply effect sizes are negligible. Acknowledge the power, emphasise the *interaction*.

  ### 5. The "Moral Credit" Problem (X-Phi)
  **The Question:** "If I avoid the bar so I don't get drunk and abusive, am I virtuous? Or did I just dodge the test? Intuitively, we give more moral credit to the person who stays sober *at* the bar. Your view seems to reward avoidance rather than resilience."
  **The 2-Minute Reply:** "I'd challenge the intuition. If the outcome is that I don't abuse anyone, and I know myself well enough to know I can't stay sober at the bar, the responsible thing is to stay home. Ulysses didn't show 'weakness' by tying himself to the mast; he showed wisdom. We need to shift our moral credit system from 'heroic resistance' to 'reliable non-harm'."
  **The Soft Spot:** This conflicts with deep-seated intuitions about moral struggle. The audience may feel that without the struggle, there is no virtue.

  ### 6. The "Fragmentation" Objection (X-Phi)
  **The Question:** "Doris argues for local traits (honesty-in-the-office) rather than global traits. Your view seems to fragment character even further into 'honesty-when-I've-slept-well-and-avoided-the-bar'. Isn't this just situationism with extra steps?"
  **The 2-Minute Reply:** "The difference is ownership. Situationism says the situation dictates the behaviour. I'm saying the *agent* dictates the situation. The fragmentation isn't a bug; it's a feature of honest self-assessment. Acknowledging I'm only honest when I've slept well is a form of self-knowledge that situationism ignores. It puts the agent back in the driver's seat of their own fragmentation."
  **The Soft Spot:** The line between "owning your fragmentation" and "admitting you have no character" is very thin.

  ### 7. The "Psychological Reality" Objection (Psychologist)
  **The Question:** "Do people actually do this? Do people genuinely pre-structure their moral environments, or is this a rationalisation post-hoc? Most cognitive bias literature suggests we overestimate our self-control. Isn't your 'phronesis' just another cognitive illusion?"
  **The 2-Minute Reply:** "Many do not, which is why they fail. But the existence of the bias doesn't mean the strategy is invalid. Smoking cessation programmes work on exactly this principle: remove the cues. My claim is normative, not descriptive. I'm saying this is what *phronesis* ought to look like, even if most people fail to achieve it. The fact that it's hard doesn't mean it's not the right target."
  **The Soft Spot:** If your "virtue" is something almost no one actually exhibits, is it a useful psychological category?

  ### 8. The "Normative Force" Objection (X-Phi)
  **The Question:** "If character is just situation-management, why should I listen to you? What gives your 'rebuild' authority? You've turned ethics into a technical problem of environmental design. Where is the 'ought'?"
  **The 2-Minute Reply:** "The 'ought' comes from the goal of ethics: reducing harm and promoting flourishing. If technical design achieves that better than relying on fragile internal states, then we *ought* to design. We don't complain that bridge-building is 'just technical' and not 'real safety'. If the bridge holds, it's good engineering. If the character holds, it's good ethics."
  **The Soft Spot:** This risks reducing ethics to engineering. Some philosophers will find this deeply unsatisfying as a moral theory.

  ---

  ## The Killer Question (The One You Hope Nobody Asks)

  **The Question:**
  "You argue that *phronesis* is situation-management. But *phronesis* in Aristotle is specifically about *perceiving* the moral demand in the moment and acting accordingly. If you remove the 'in the moment' judgment and replace it with pre-commitment, haven't you just described **akrasia** (weakness of will) management? You haven't rebuilt virtue; you've just built a better cage for vice."

  **Why this hurts:**
  It strikes at the definition of *phronesis*. If you concede this, you admit you aren't doing virtue ethics anymore. If you deny it, you have to argue that avoiding the test is morally superior to facing it, which is a hard sell.

  **Prepared Defence:**
  "I'd argue that recognising one's own susceptibility to akrasia *is* the perception of the moral demand. The 'moment' doesn't start when the temptation arrives; it starts when you decide what life to lead. Aristotle's *phronimos* knows his own limits. Ignoring those limits isn't virtue; it's hubris."

  ---

  ## Strategic Advice for the Room

  *   **Watch the Psychologists:** When they speak, nod at the methodology points. Do not fight them on the stats. Say: "I agree, the p-values on the 1960s studies don't hold up. My point is about the philosophical inference."
  *   **Watch the X-Phi:** They will worry about definitions. Keep returning to "reliability." If your view makes agents more reliable, it serves the ethical goal.
  *   **Body Language:** When asked the "Killer Question," pause. Take a sip of water. Show you are weighing the definition, not dodging.
  *   **Phrase to Use:** "Architectural Virtue." It sounds novel but grounded.
  *   **Phrase to Avoid:** "Robust Character." It's a red rag to a bull for this crowd. Use "Reliable Agency" instead.

  Good luck. Keep your answers tight, and don't try to win the empirical argument—win the conceptual one.
