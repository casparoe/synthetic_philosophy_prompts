answer: |-
  ### Mentor's Brainstorming: Sharpening the Question

  Your intuition is correct: the standard debate is stuck because it is asking a question that presupposes a structure reality might not have. If you submit a proposal asking "Does moral status come in degrees?" you will be rejected. That question has been churned over for decades. Your value add is the claim that the question itself is malformed.

  Here are four ways to sharpen this, ranked by tractability for a one-year fellowship:

  1.  **The Metaphysical Audit:** Focus primarily on proving sentience is multidimensional. You would spend the year analyzing nociception, integration, and valence to show they don't correlate.
      *   *Verdict:* **Too risky.** You are an ethicist, not a cognitive scientist. You will get bogged down in empirical disputes about insect consciousness that you cannot resolve in a year.
  2.  **The Regulatory Critique:** Focus on animal welfare law. Argue that current laws fail because they assume binary status.
      *   *Verdict:* **Too narrow.** This appeals to the lawyer on the committee, but it risks becoming a policy paper rather than a philosophical dissertation. It lacks theoretical depth.
  3.  **The AI Limit-Case:** Focus on the "thermostat to AI" end of the spectrum. Use artificial systems to test where moral status begins.
      *   *Verdict:* **Distraction.** This is trendy, but it dilutes the urgent animal ethics component. Use AI only as a boundary test, not the core subject.
  4.  **The Decomposition Strategy (Recommended):** Focus on your second worry. Argue that "moral status" is a cluster concept that decomposes into at least two distinct variables: *phenomenal weight* (how much pain matters) and *biographical standing* (eligibility for rights regarding death/future).
      *   *Verdict:* **Most Tractable.** This allows you to bypass the metaphysical quagmire of defining a single "sentience scale." Even if sentience is multidimensional, you can argue that different dimensions map to different moral protections. This yields a concrete normative framework, fits the one-year timeline, and speaks directly to both the cognitive scientist (markers of experience) and the lawyer (regulatory categories).

  **My Advice:** Commit to Option 4. Your project isn't about measuring sentience; it's about restructuring the moral architecture that responds to it. If you try to solve the measurement problem, you will fail. If you solve the mapping problem, you will succeed.

  ***

  ### Dissertation Research Fellowship Proposal

  **Project Title:** Beyond the Gradient: Decomposing Moral Status Across the Sentience Spectrum

  **Project Summary**
  Contemporary debates in animal ethics and AI morality typically rest on a "Single Scale Assumption": that beings can be arranged linearly by degree of sentience, and that moral status tracks this line uniformly. This project challenges that assumption. I argue that the question "Does moral status come in degrees?" is malformed because moral status is not a unitary property. Instead, I propose a Decomposition View: moral status comprises distinct components, specifically *phenomenal weight* (the moral significance of immediate experience) and *biographical standing* (eligibility for protections regarding death and future interests). Over twelve months, I will develop a normative framework where these components come apart, demonstrating that a being may warrant intense protection from suffering while possessing no right against painless killing. This reframing resolves theoretical stalemates and offers a precise taxonomy for regulators and scientists dealing with edge-case entities, from insects to artificial agents.

  **Research Question and State of the Field**
  The central research question is: *Does the multidimensionality of sentience necessitate a decomposition of moral status?*

  Current positions leave this open. The "Straightforward Graded View" argues that if a being is half as sentient, it counts for half as much morally across all categories. This view struggles with threshold phenomena; it is unclear why an entity slightly above a cognitive threshold gains rights to life that an entity slightly below lacks. Conversely, "Threshold Views" argue for binary moral patienthood but fail to explain the intuitive moral difference between swatting a fly and clubbing a seal. Finally, "Binary Views" claim moral status is all-or-nothing, ignoring the gradations of capacity evident in biology.

  All three positions rely on the tacit assumption that moral status is a single currency. They assume that if we settle the metaphysics of sentience, the ethics follows linearly. My project rejects this. I argue that the "Single Scale Assumption" obscures the fact that different moral concerns track different capacities. Suffering tracks the capacity for valence (affective experience). Rights against death track the possession of a self-model or future-directed preferences. These capacities do not necessarily covary. A creature might have vivid pain responses (high phenomenal weight) without a concept of its own future (low biographical standing). By treating moral status as unitary, current theories force a choice between counterintuitive extremes. My project isolates the components to show they operate independently.

  **Methodology and Work Plan**
  The project proceeds in three phases over the fellowship year.

  *Months 1–4: Conceptual Groundwork.*
  I will formalize the Decomposition View. This involves defining the criteria for *phenomenal weight* versus *biographical standing*. I will analyze arguments regarding the "nature of harm" to show that death is a different category of harm than pain. The deliverable is a paper distinguishing the "ethics of experience" from the "ethics of biography." I will engage with arguments that attempt to reduce all moral value to welfare units, demonstrating why such reductions fail when applied to entities with limited temporal horizons.

  *Months 5–8: Case Studies and Stress Testing.*
  I will apply the framework to three specific domains where the Single Scale Assumption creates policy paralysis.
  1.  *Invertebrates:* I will argue that insects may possess high phenomenal weight (nociception/aversion) but negligible biographical standing. This justifies welfare regulations on farming methods without necessitating a ban on killing.
  2.  *Artificial Systems:* I will use simple AI and thermostats as control cases. If a system mimics pain but lacks biography, the Decomposition View assigns it phenomenal weight but no biographical standing. This tests the lower bound of the framework.
  3.  *Developmental Margins:* I will examine human infants or cognitive impairments to ensure the view does not yield unacceptable ableist conclusions, refining the criteria for biographical standing to ensure it relies on potentiality or relational status where appropriate.

  *Months 9–12: Synthesis and Normative Framework.*
  The final phase constructs a decision matrix for moral deliberation. Instead of asking "Does this being have rights?", the framework asks "Which component of status is triggered?" The deliverable is the dissertation chapter integrating these findings into a cohesive theory of "Modular Moral Status."

  **Success and Failure Conditions**
  Success is defined as the production of a stable framework where phenomenal weight and biographical standing are shown to be logically distinct and practically separable. A successful result demonstrates that we can coherently affirm strong duties to relieve pain in a being while affirming no duty to preserve its life.

  The primary risk of failure is "Collapse." It is possible that upon analysis, the two components turn out to be inextricably linked—for example, if having vivid experiences necessarily implies having a future-oriented self-model. If the concepts collapse back into a single undifferentiated notion, the Decomposition View adds no value. If this occurs, I will pivot to a "Priority View," arguing that even if the properties covary, the *reasons* for valuing them remain distinct, which still alters how we weigh conflicting duties. However, given the empirical evidence of dissociations in cognitive science (e.g., organisms with complex nociception but no apparent memory integration), I judge the risk of total collapse to be low.

  **Feasibility and Scope**
  One year is sufficient for this project because I am not attempting to solve the empirical measurement of sentience. I am taking the cognitive science as given and analyzing the normative mapping. I will not produce a new taxonomy of which animals feel pain; I will produce the ethical framework for interpreting that taxonomy. Narrowing the scope to the distinction between suffering and death allows for depth without requiring a full survey of all moral rights.

  **Impact and Stakes**
  This research has concrete implications for the committee's diverse expertise. For the cognitive scientist, it clarifies what markers matter: finding neural correlates of "selfhood" matters for different ethical reasons than finding correlates of "pain." For the legal scholar, it resolves a regulatory impasse. Current animal welfare law often struggles with invertebrates; legislators hesitate to grant "rights" to insects. The Decomposition View offers a middle path: regulate the *method* of killing (welfare) without regulating the *act* of killing (rights). This allows for protection against cruelty without granting personhood.

  Furthermore, as artificial systems become more sophisticated, we face the "AI Alignment" problem. If we build systems that simulate distress, do we owe them rights? A unitary view forces a binary choice: treat the AI as a toaster or as a person. The Decomposition View allows us to acknowledge the moral significance of simulated suffering without granting AI rights to liberty or life. This nuanced approach is essential for upcoming legislation on AI safety and animal welfare.

  **Conclusion**
  The standard debate asks how much moral status a being has. I propose we ask *what kind* of status it has. By committing to the Decomposition View, this project moves beyond the stalemate of the "great chain of sentience." It offers a robust, differentiated ethical architecture capable of handling the complexity of biological and artificial minds. This is not merely a theoretical refinement; it is a necessary tool for a world where the boundaries of the moral community are rapidly expanding.
