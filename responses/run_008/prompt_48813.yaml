answer: |-
  **To:** The Programme Committee
  **From:** Advisory Consultant
  **Subject:** Prioritised Research Agenda for Postdoctoral Fellowships (Equality of What? Cluster)

  ### Executive Summary

  The foundation's remit creates a specific tension: we require work that is *explicitly theoretical* yet capable of *downstream uptake* by statisticians and policy designers. This constraint dictates the ordering of the agenda. We cannot fund pure exegesis, nor can we fund empirical pilot studies. We must fund **conceptual engineering**—work that clears the philosophical ground so that measurement becomes possible without theoretical collapse.

  Based on this, I propose the following ordering for the four fellowships. This ranking prioritises **foundational justification** first, followed by **operational coherence**, then **practical convergence**, and finally **frontier expansion**.

  ---

  ### Priority 1: The Relational-Metric Interface (Seed Q1)
  **Project Title:** *Does Relational Equality Require a Distributive Metric?*

  **Rationale for Ranking:**
  This is the **foundational** question. If the relational-egalitarian critique (Anderson, Scheffler) successfully renders the "equality of what?" question obsolete, then funding three other fellows to work on metrics of distribution is a category error. However, my assessment is that relational equality is currently under-theorised regarding its material preconditions. One cannot have equal social standing without certain material baselines.
  *   **Dependency:** Every other project on this list presupposes that *something* should be equalised or guaranteed. If relational equality dissolves the metric, Projects 2 and 3 become irrelevant.
  *   **Tractability:** Highly tractable for a philosopher. It requires conceptual analysis of "standing" and "domination," not data collection.
  *   **Neglect:** While relational egalitarianism is fashionable, the specific question of whether it *secretly relies* on a capability or resource metric is often glossed over.
  *   **Downstream Unlock:** If this fellow argues (plausibly) that relational equality requires a specific threshold of capabilities to prevent domination, they provide the **normative justification** for the indices that statisticians build. It tells the metric-designers *why* they are measuring.

  ### Priority 2: The Operationalization of Capabilities (Seed Q2)
  **Project Title:** *Conceptual Engineering for the Capability Index: Indeterminacy as Feature or Bug?*

  **Rationale for Ranking:**
  This is the **bridge** question. It directly addresses the foundation's requirement for eventual uptake by economists and statisticians. Sen's approach is often rejected by economists because it lacks a single informational space (unlike utility or income).
  *   **Dependency:** Depends on Priority 1 establishing that capabilities are the right "stuff" to track.
  *   **Tractability:** Difficult, but appropriate for a 3-year fellowship. The task is not to build the index, but to solve the *conceptual* rules for selection and weighting (e.g., public reasoning protocols vs. objective lists).
  *   **Neglect:** Economists try to solve this with math; philosophers often retreat to pure theory. A dedicated conceptual analysis of *how* to make capabilities comparable without collapsing into resources is missing.
  *   **Downstream Unlock:** A rigorous philosophical account of how to handle indeterminacy (e.g., arguing that a *range* of acceptable weightings is theoretically superior to a single number) gives statistical agencies the license to design robustness checks rather than chasing a phantom "true" value. This changes how the UN or World Bank designs the Human Development Index.

  ### Priority 3: Non-Ideal Convergence (Seed Q5)
  **Project Title:** *Metric Divergence in Non-Ideal Theory: Do the Rivals Actually Disagree on Policy?*

  **Rationale for Ranking:**
  This is the **validation** question. If resource egalitarianism, welfare egalitarianism, and capability egalitarianism yield identical policy recommendations in real-world, non-ideal contexts (disability, education), then the theoretical quarrel is sterile.
  *   **Dependency:** Requires the definitions from Projects 1 and 2 to be stable enough to apply to cases.
  *   **Tractability:** High. This involves thought experiments and case analysis (e.g., "How would a Dworkinian auction vs. a Nussbaumian threshold handle this specific disability claim?").
  *   **Neglect:** Most literature stays in ideal theory. There is a shortage of rigorous work testing whether the metrics *diverge* in the messy middle.
  *   **Downstream Unlock:** If this fellow finds significant divergence, they identify the **high-stakes zones** for policy designers (where the choice of metric changes who gets funded). If they find convergence, they save policymakers time by showing the metric choice matters less than the implementation. Either way, it clarifies the "cash value" of the theory.

  ### Priority 4: The Population-Metric Entanglement (Seed Q6)
  **Project Title:** *The Boundary Problem: How Population Ethics Constrains the Equality Metric*

  **Rationale for Ranking:**
  This is the **frontier** question. It is the most speculative but addresses a systematic blind spot. Standard equality metrics assume a fixed population. But policies affecting the metric (e.g., healthcare rationing, environmental policy) affect *who* exists.
  *   **Dependency:** Theoretically independent, but practically relies on the metric defined in Project 2.
  *   **Tractability:** Low to Medium. This is deep theory. However, a 3-year fellowship is exactly the kind of container needed for this kind of deep dive.
  *   **Neglect:** High. The "Equality of What?" literature and the "Non-Identity Problem" literature rarely speak to each other.
  *   **Downstream Unlock:** Long-term. If we care about intergenerational justice, our metrics must account for future persons. This fellow would lay the groundwork for "sustainable capability" metrics, influencing long-term climate and demographic policy frameworks.

  ---

  ### Deliberately Deprioritised Questions

  **1. The Luck-Egalitarian Quarrels (Seed Q4)**
  *   **Decision:** **Retire.**
  *   **Reasoning:** The literature on brute luck, option luck, and expensive tastes is saturated. The diminishing returns on philosophical investment here are steep. While intellectually intricate, these distinctions have proven increasingly brittle when applied to structural injustice. Funding a fellowship here risks producing baroque distinctions that statisticians and policy designers will rightly ignore. We should let this debate rest until a new paradox emerges that cannot be solved with existing tools.

  **2. The Money-Metric Worry (Seed Q3)**
  *   **Decision:** **Subsume into Priority 2.**
  *   **Reasoning:** The worry that resource metrics smuggle in welfarism via pricing is vital, but it is technically a subset of the Operationalization problem. If the Capability fellow (Priority 2) does their job correctly, they must address how to value functionings without relying solely on market prices or subjective welfare. A separate fellowship for this is redundant; it should be a chapter in the Operationalization project.

  ---

  ### Dynamic Factors: What Would Change the Ranking?

  This agenda is stable but not static. The Committee should review the following triggers before the next funding round:

  1.  **Trigger for Elevating Luck-Egalitarianism (Q4):** If a major new paradox emerges in behavioral economics or AI ethics regarding responsibility and compensation that existing luck-egalitarian frameworks cannot parse. (Currently unlikely).
  2.  **Trigger for Deprioritizing Capabilities (Q2):** If major statistical bodies (e.g., ONS, Census Bureau) officially abandon capability-based indicators in favor of purely subjective well-being measures. If the downstream uptake vanishes, the theoretical work loses its instrumental value for this foundation.
  3.  **Trigger for Elevating Population Ethics (Q6):** If public debate shifts sharply toward long-termism or demographic collapse. If the "who exists" question becomes a primary political flashpoint, this theoretical work moves from frontier to urgent.
  4.  **Trigger for Elevating Non-Ideal Convergence (Q5):** If a specific policy crisis (e.g., a pandemic triage protocol or climate migration quota) arises where resource-based and capability-based allocations yield visibly contradictory, high-stakes outcomes. This would demand immediate theoretical arbitration.

  ### Funding Rationale for the Board

  This ordering balances **risk** and **relevance**.
  *   **Priority 1** protects the investment: it ensures we aren't solving a dissolved problem.
  *   **Priority 2** ensures the investment pays off: it builds the bridge to the statisticians and economists we care about.
  *   **Priority 3** ensures the investment matters: it tests whether the theory actually changes outcomes.
  *   **Priority 4** ensures the investment is visionary: it keeps the foundation at the cutting edge of moral theory.

  By retiring the Luck-Egalitarian debates, we acknowledge that philosophy must know when to stop refining old tools and start building new ones. This agenda moves the "Equality of What?" debate from a quarrel about labels to a constructive engineering project for social justice.
