  10. **Final Polish:** Ensure the distinction between the *Paradox of Tragedy* (Hume) and the *Paradox of Fiction* (Radford) is clear, as the student's analogy conflates them. The student is trying to solve Tragedy (negative -> positive) using a mechanism that might address arousal but ignores the Fiction paradox (emotion -> non-existent object).

      *(Self-Correction)*: Wait, the prompt specifically asks about the Paradox of Tragedy (why pleasure from pain). The Paradox of Fiction (how emotion for non-existents) is related but distinct. I should focus on Tragedy but note how the analogy fails to capture the *cognitive* nature of the sadness involved in tragedy. The student claims the mechanism is the *same*. I need to show it's not the same mechanism because the inputs are different kinds of mental states.

      *Revised Plan:* Focus heavily on the **Intentionality** disanalogy. That is the philosophical kill-shot. Chili pain is non-intentional; Tragic sadness is intentional. You can't relabel an intentional state the same way you relabel a sensation.

