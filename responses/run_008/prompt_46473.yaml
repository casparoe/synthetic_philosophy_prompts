          2.  The Correspondence Table (visual aid for class).
          3.  The Breakdown (Noise vs. Critical).
          4.  The Verdict on the "Pseudo-Problem."
          5.  The Patch (What's missing?).
      *   *Key Philosophical Concepts to weave in:* Intentionality, Fictionality, Conversion Hypothesis (Hume), Meta-Response.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the TA's worry about "romanticizing moviegoing"?
