answer: |-
  First, take a breath. You didn't talk yourself into a corner; you accidentally reinvented a live position in contemporary meta-ethics. What you're describing is a **Modal** or **Robustness Account of Moral Worth**. It's closely related to views defended by philosophers like Mark Schroeder, Nomy Arpaly, and certain interpreters of Kant who try to soften the "purity of motive" requirement (sometimes called the "incorporation thesis" defenders).

  Your intuition is solid: the strict Kantian view (only duty counts, nothing else) leads to the conclusion that almost no human actions have moral worth. Your robustness tweak saves the phenomenon by focusing on the *stability* of the good will rather than its momentary purity.

  However, your roommate isn't wrong to be suspicious. You have traded one set of problems (purity) for another set (modality and individuation). Below is the map you asked for. I've ranked the defeaters from "Fatal" to "Awkward," and I'll be blunt about the gerrymandering worry.

  ---

  ### The Defeater Map

  #### 1. The "Actual Sequence" Intuition (Fatal/Severe)
  This is the strongest argument against your view. It claims that moral worth is a historical property of the *token action*, determined by what *actually* caused it, not what *could have* caused it.

  *   **The Case:** Imagine I donate to charity *solely* to get a tax break. I have no concern for the poor. However, I am psychologically robust: if the tax break didn't exist, my latent sympathy would have kicked in, and I would have donated anyway.
  *   **Your View's Verdict:** The action has moral worth (because in nearby worlds where the tax incentive is removed, I still do the right thing).
  *   **The Intuition:** Most people (and most Kantians) will say this action has **zero** moral worth. In the actual world, I acted for greed. The fact that I *would have* acted for sympathy is irrelevant to the moral status of *this* specific transaction.
  *   **Why it hurts:** It suggests you've changed the subject from "Why did this act happen?" to "What kind of person am I?" If moral worth attaches to the act, the actual causal history is all that matters. If you bite this bullet, you have to accept that selfish acts can have moral worth provided the agent is "reliably good" in other scenarios.

  #### 2. Epistemic Inaccessibility (Severe)
  Moral worth is usually thought to be something an agent can strive for or assess. Your view makes moral worth potentially unknowable to the agent.

  *   **The Problem:** How do I know if I am robust across nearby counterfactual worlds? I only have access to my actual motives. I cannot run simulations of myself in worlds where my friend gives me bad advice to see if I would catch it.
  *   **The Consequence:** This makes moral worth a "hidden variable." Two agents could act identically, with identical actual motives, but one has moral worth and the other doesn't, based on facts about their psychology they cannot access.
  *   **Why it hurts:** If moral worth is supposed to guide action or provide rational satisfaction (as Kant thought), a view that makes it opaque to the agent loses a lot of its normative force.

  #### 3. The Act/Agent Category Shift (Moderate)
  Your roommate's first objection is technically correct, but whether it's a *bug* depends on your goals.

  *   **The Distinction:** Traditional deontology distinguishes between the **rightness of the act** (does it conform to duty?) and the **moral worth of the act** (was it done from duty?). Your view collapses moral worth into **praiseworthiness of the agent**.
  *   **The Cost:** You lose the ability to criticize a specific action as "lacking worth" if the agent is generally virtuous. If a generally robust person slips up and does the right thing for a shallow reason (e.g., vanity), your view might still grant the *act* worth because the *agent* is robust.
  *   **Defense:** You can concede this. Many modern ethicists argue the Act/Agent distinction is overblown. If you are defending a Virtue-Ethics-adjacent Kantianism, this is a feature, not a bug. But you must admit you are no longer doing pure act-evaluation.

  #### 4. Moral Luck Sensitivity (Moderate)
  Your view attempts to solve moral luck (it shouldn matter that my friend happened to be right), but it reintroduces it through the "nearby worlds" metric.

  *   **The Problem:** What counts as a "nearby" world is sensitive to context. If I live in a chaotic environment where bad advice is common, my robustness is tested more severely than if I live in a bubble.
  *   **The Consequence:** Two agents with identical internal psychology could have different levels of moral worth simply because one lives in a environment where "nearby worlds" contain more temptation or confusion.
  *   **Why it hurts:** It makes moral worth partially dependent on external circumstances, which contradicts the internalist intuition that moral worth is about the will alone.

  ---

  ### The Gerrymandering Worry: Real or Overblown?

  Your roommate said: *"Nobody can agree on which worlds count as nearby, so I can always gerrymander the modal base to get whatever verdict I want."*

  **Verdict:** This is a **real problem**, but not a fatal one. It is the standard problem with all modal accounts (knowledge, disposition, causation).

  *   **Why it's real:** In meta-ethics, "nearby worlds" is notoriously slippery. If I want to prove I have moral worth, I can define "nearby" as "worlds where I'm well-rested and happy." If I want to deny you worth, I define "nearby" as "worlds where you're stressed." Without an objective metric for similarity, the view risks becoming vacuous.
  *   **Why it's not fatal:** Every dispositional claim suffers this. To say "this glass is fragile" means "it would break if struck." But what if it's struck by a feather? We contextually fix the "nearby worlds" to "normal striking conditions." You can do the same. You just need to stipulate that "nearby worlds" means **worlds where the agent's cognitive and volitional capacities are held constant, but external informational inputs vary.**
  *   **The Risk:** The risk isn't that the view is meaningless; it's that it becomes **ad hoc**. If you have to tweak the definition of "nearby" for every counter-example (testimony, sympathy, habit) to get the right answer, the theory isn't explaining the intuition; it's just mirroring it.

  ---

  ### Did You Strengthen the View or Make It Unfalsifiable?

  You did **both**, and that is the tension you are feeling.

  1.  **Strengthened:** You successfully defended the view against the "Impurity Objection" (that humans never act purely from duty) and the "Testimony Objection" (that relying on others undermines worth). This makes the view more psychologically realistic and applicable to real life.
  2.  **Unfalsifiable Risk:** By moving the criteria from *actual history* to *counterfactual robustness*, you moved the criteria from something observable (what did you say you were doing?) to something theoretical (what would you have done?). This insulates the view from empirical refutation but at the cost of making it harder to apply.

  ### How to Defend This (If You Want To)

  If you want to hold this position, here is the committed defender's playbook:

  1.  **Concede the Act/Agent Shift:** Admit that "Moral Worth" is actually a shorthand for "Action manifesting a Praiseworthy Character." This neutralizes Roommate's first objection.
  2.  **Bite the "Tax Break" Bullet:** Argue that in the Tax Break case, if the agent *truly* would have donated without the break, they *do* deserve some credit, even if the actual motive was greed. It's counterintuitive, but defensible if you value the *reliability* of moral behavior over the *purity* of the moment.
  3.  **Fix the Modal Base:** Define "nearby worlds" rigidly. Don't let it be vague. Say: *"Nearby worlds are those where the agent's psychological constitution is identical, but the evidential situation varies slightly."* This stops the gerrymandering.
  4.  **Accept Epistemic Opacity:** Argue that moral worth is an objective fact about us, even if we can't be 100% sure of it. (We can't be sure we aren't brains in vats, but we still act as if the external world exists).

  ### Final Assessment

  You haven't talked yourself into a corner, but you have walked out of the "Act Deontology" room and into the "Virtue Epistemology" room.

  *   **Is it defensible?** Yes. It's a sophisticated, modal account of moral worth.
  *   **Is it Kantian?** Loosely. It prioritizes the *Good Will* as a disposition rather than the *Good Will* as a momentary act of volition.
  *   **The Fatal Flaw:** The "Actual Sequence" intuition (Defeater #1). If you cannot convince people that a selfish act can have moral worth because the agent *would have* been selfless in other circumstances, the view collapses.

  **Advice for the next round with your roommate:** Don't fight on the "nearby worlds" vagueness. Fight on the **value of reliability.** Ask her: *"If two people do the right thing, but one is a fluke and the other is reliable, isn't the reliable one morally better, even if the fluke got lucky this time?"* If she says yes, she owes you a theory that captures that reliability. Your theory does.
