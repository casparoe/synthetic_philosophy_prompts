answer: |-
  This is a splendid dispute, and one that cuts to the very heart of modern decision theory. You and your partner have stumbled upon the precise tension that separates Causal Decision Theory (CDT) from its successors, such as Updateless Decision Theory (UDT) or Functional Decision Theory (FDT).

  Your partner is correct that the *mechanism* of correlation—the predictor's reliance on your policy—is structurally identical in both cases. However, she is mistaken in concluding that the *verdict* must therefore be the same. Decision theories do not merely evaluate the mechanism of prediction; they evaluate the expected utility of the policy itself.

  Here is the adjudication you requested, set out in British English.

  ### 1. Structural Analysis: Side by Side

  To see where the divergence arises, we must look not at the moment of decision, but at the expected value of the **policy** you adopt before the coin is flipped or the affair occurs. Both UDT and FDT argue that you should choose the policy that yields the highest expected return across all possible branches, weighted by their probability, regardless of which branch you currently find yourself in.

  | Feature | Counterfactual Mugging | XOR Blackmail |
  | :--- | :--- | :--- |
  | **Uncertain Fact** | Coin Flip (50% Heads / 50% Tails) | Affair Status (50% Yes / 50% No) |
  | **Predictor's Trigger** | Predicts you **will pay** if Heads. | Predicts you **will pay** if Letter arrives. |
  | **Branch A (Actual)** | **Heads:** You are asked for £100. | **Affair:** You receive Letter. |
  | **Branch B (Counterfactual)** | **Tails:** You receive £10,000. | **No Affair:** You receive Letter (if Pay Policy). |
  | **Policy: PAY** | **Heads:** -£100.<br>**Tails:** +£10,000.<br>**EV:** +£4,950. | **Affair:** No Letter (Benefit).<br>**No Affair:** Letter + -£1,000 (Cost).<br>**EV:** Negative (Cost > Benefit). |
  | **Policy: REFUSE** | **Heads:** £0.<br>**Tails:** £0.<br>**EV:** £0. | **Affair:** Letter + £0.<br>**No Affair:** No Letter.<br>**EV:** £0 (ignoring stress). |

  **The Crucial Asymmetry:**
  In the Counterfactual Mugging, the counterfactual branch (Tails) contains a **reward** contingent on your policy. By paying in the Heads branch, you 'unlock' the reward in the Tails branch.
  In the XOR Blackmail, the counterfactual branch (No Affair) contains a **penalty** contingent on your policy. By adopting a policy of paying, you incentivise the blackmailer to target you in the No Affair branch, where you lose £1,000 for no gain. In the Affair branch, paying merely avoids the stress of the letter, but refusing costs you nothing monetarily.

  Thus, the verdicts diverge not because the logic of prediction differs, but because the **payoff structure** differs. In the Mugging, the policy of paying buys you a lottery ticket with a positive expected value. In the Blackmail, the policy of paying buys you a liability with a negative expected value.

  ### 2. Testing Your Hypothesis: The Minimal Pair

  Your hypothesis is that the divergence depends on whether something of value hinges on your policy in the counterfactual branch. Let us test this by constructing the variants you requested.

  **Variant 1: The Independent Mugging**
  *Setup:* Identical to the original, except the predictor deposits the £10,000 in the Tails branch **regardless** of what it predicted you would do in the Heads branch. It only asks for the £100 in the Heads branch if it predicted you would pay.
  *Analysis:*
  *   **Policy Pay:** Heads (-£100), Tails (+£10,000). Total EV: +£4,950.
  *   **Policy Refuse:** Heads (£0), Tails (+£10,000). Total EV: +£5,000.
  *   **Verdict:** **Refuse.**
  *   *Result:* When the counterfactual reward is decoupled from your policy, the rationale for paying collapses. You should not throw away £100 for no gain.

  **Variant 2: The Rewarding Blackmail**
  *Setup:* Identical to the original, except if you are Innocent (No Affair) and the predictor forecasts you **will pay**, it deposits £10,000 into your account instead of sending a letter. If you are Guilty and it forecasts you will pay, it sends no letter (as before).
  *Analysis:*
  *   **Policy Pay:** Innocent (+£10,000), Guilty (No Letter).
  *   **Policy Refuse:** Innocent (No Letter/No Money), Guilty (Letter).
  *   **Verdict:** **Pay.**
  *   *Result:* When the counterfactual branch (Innocence) offers a reward contingent on your policy, the logic flips to match the Mugging. You pay the £1,000 (or avoid the letter) to secure the £10,000 in the Innocent branch.

  **Conclusion on Hypothesis:** Your hypothesis is confirmed. The structural feature driving the verdict is indeed whether the counterfactual branch contains value that is *accessible only via the policy* in question.

  ### 3. Theoretical Implications

  This asymmetry lends significant support to **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)** over standard Causal Decision Theory (CDT).

  *   **CDT** fails the Counterfactual Mugging. It argues that once the coin has landed Heads, the Tails branch is gone; paying £100 now cannot causally affect the past. Thus, CDT says **Refuse** in the Mugging. Most would agree this is a failure of rationality, as a CDT agent would be poorer overall than a UDT agent.
  *   **CDT** succeeds in the XOR Blackmail (it says **Refuse**), but for the wrong reasons. It refuses because paying doesn't causally change the past prediction.
  *   **UDT/FDT** succeeds in **both**. It says **Pay** in the Mugging and **Refuse** in the Blackmail. It achieves this by evaluating the *source code* of your decision-making. It asks: "What is the value of being the *kind of agent* who pays in this situation?"
      *   In the Mugging, being that kind of agent makes you rich in the Tails world.
      *   In the Blackmail, being that kind of agent makes you a target in the Innocent world.

  ### 4. Adjudication on Your Partner's Charge

  Your partner charges that refusing the blackmailer while paying the mugger is incoherent. This charge is **false**.

  It is only incoherent if one assumes that the *mechanism of prediction* is the sole determinant of the decision. However, rational choice is determined by the mechanism **plus** the utility function.
  *   In the Mugging, the utility function favours paying because the policy purchases a high-value counterfactual reward.
  *   In the Blackmail, the utility function favours refusing because the policy purchases a low-value counterfactual avoidance (no letter) at the cost of a high-value counterfactual penalty (losing £1,000 while innocent).

  A consistent theory (like UDT) renders the same *calculation* in both cases: **Maximise the expected utility of the policy.** The fact that the calculation yields different *actions* is a feature, not a bug. It demonstrates that the theory is sensitive to the incentives presented, rather than blindly following the presence of a predictor.

  ### Final Verdict

  You should pay the mugger, but you should refuse the blackmailer. Your partner is correct that the predictive machinery is identical, but she is mistaken in thinking this necessitates identical actions. The machinery is the engine, but the payoff structure is the map; you cannot drive the same route on two different maps.

  Your hypothesis regarding the dependency of value in the counterfactual branch is precisely correct. The asymmetry survives scrutiny, and it provides a robust defence for policy-based decision theories against the charge of incoherence. You may tell your partner that while her intuition about the symmetry of the predictor is sharp, her conclusion overlooks the symmetry of the *incentives*, which are, in fact, mirror images.
