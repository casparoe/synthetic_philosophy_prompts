answer: |-
  Here is a plan for your fifty-minute section, designed to sequence the concepts logically, intercept specific misconceptions before they harden, and manage the cognitive load of mixed-strategy dominance.

  ### 1. Critique of Your Carrying Example (4x3 Game)

  **Verdict:** It is an excellent vehicle, but you must manage the symmetry carefully.

  *   **Symmetry:** Keep the symmetric payoffs `(6,0,0), (0,6,0), (0,0,6)`. The algebra of finding the dominating mix `(1/3, 1/3, 1/3)` is trivial, which is good. You want their cognitive load focused on the *concept* (that a mix can dominate a pure), not on solving a system of linear inequalities.
      *   *Risk:* Students pattern-match to "just average the rows."
      *   *Mitigation:* After showing the `1/3` mix works, explicitly ask: "If the fourth row were `(1.9, 1.9, 1.9)`, does this mix still dominate? What if it were `(2.1, 2.1, 2.1)`?" This forces them to acknowledge that dominance depends on the specific weights and values, not just a visual "middle."
  *   **Weighted Mixture:** Do not switch to a weighted mixture (e.g., `(5,0,0), (0,7,0)...`) for the *instructional* example. It adds algebraic noise that obscures the core insight. Save weighted mixtures for the check question.
  *   **One-Sided vs. Two-Sided:** Keep it **one-sided** (only Row has dominated strategies; Column payoffs are generic/irrelevant). You are teaching the definition of dominance for a single player first. Introducing Column dominance simultaneously confuses the "who is deleting what" logic of iteration. Use a separate, simpler game for the iteration segment.

  ---

  ### 2. Section Plan (50 Minutes)

  **0:00 – 0:05: Boundaries & Admin**
  *   **Action:** Explicitly state what this section is *not* about.
  *   **Script:** "Today is strictly about **Strict Dominance** involving **Mixed Strategies**. We are **not** covering Weak Dominance iteration (that is fragile and belongs to the lecture). We are **not** formally defining Rationalizability, though this procedure is the engine behind it. If you find yourself asking 'what if they play weakly dominated strategies?', park that question for the lecture."
  *   **Why:** Prevents scope creep and stops students from applying strict-dominance logic to weak-dominance problems later.

  **0:05 – 0:15: Concept 1 — Dominance vs. Opponent Mixtures (The "Best Response" Trap)**
  *   **Goal:** Establish that we must check against opponent *mixtures*, not just pure strategies. Head off the misconception that "Not a Best Response to Pure = Dominated."
  *   **Example:** Use a 3x2 game (Row has 3 strategies, Column has 2).
      *   C1 / C2
      *   R1: 5 / 0
      *   R2: 0 / 5
      *   R3: 3 / 3
  *   **Sequence:**
      1.  Ask: "Is R3 a best response to C1?" (No, R1 is). "To C2?" (No, R2 is).
      2.  **Intervention Point:** Stop here. Ask: "Can we delete R3?"
      3.  Let them vote. Many will say yes.
      4.  Reveal: "If Column plays 50/50, R3 gets 3. R1 and R2 get 2.5. R3 is the *unique* best response to this mixture. Therefore, R3 is **not** dominated."
  *   **Takeaway:** A strategy can be dominated only if it is worse than some alternative against *every* opponent mixture. Being beaten by *someone* in every column is not enough.

  **0:15 – 0:30: Concept 2 — Own Mixed Strategies Dominating Pure (The 4x3 Example)**
  *   **Goal:** Show that a pure strategy can be dominated by a mix of *own* strategies.
  *   **Example:** Your 4x3 game.
      *   R1: 6, 0, 0
      *   R2: 0, 6, 0
      *   R3: 0, 0, 6
      *   R4: 1, 1, 1
  *   **Sequence:**
      1.  Ask: "Is R4 dominated by R1? By R2? By R3?" (No, pairwise comparison fails).
      2.  Ask: "Is R4 dominated by *any* mixture of R1, R2, R3?"
      3.  Guide them to the `(1/3, 1/3, 1/3)` mix. Show expected payoff is `(2, 2, 2)`.
      4.  Since `2 > 1` in every column, R4 is strictly dominated.
      5.  **Crucial Justification:** "Why are we allowed to delete R4? Because a rational player will never play a strategy when a lottery over their other tickets guarantees a higher payoff regardless of what the opponent does."
  *   **Break Point (0:30):** Take 2 minutes for questions. This is the heaviest conceptual lift.

  **0:32 – 0:42: Concept 3 — Iteration & Strict vs. Weak**
  *   **Goal:** Show how deletion changes the dominance landscape and why Strict is safe while Weak is not.
  *   **Example:** Switch to a new, simpler 3x3 matrix on a fresh board space. Do not try to force iteration into the 4x3 example if the math doesn't naturally chain.
      *   *Suggestion:* A standard game where removing one Row makes a Column dominated, which makes another Row dominated.
  *   **Sequence:**
      1.  Perform one deletion (e.g., remove a dominated Row).
      2.  Show that a Column strategy, previously undominated, is now dominated *in the reduced game*.
      3.  **The Warning:** "This chain reaction is valid for **Strict** Dominance. It is **not** generally valid for Weak Dominance."
      4.  **Why:** "If I delete a weakly dominated strategy, I might be deleting a strategy that was necessary to keep another strategy 'in check.' In Strict Dominance, the deleted strategy was *never* a best response to *anything* rational. In Weak Dominance, it might be a best response to some specific (even if unlikely) opponent move. We will prove this in lecture; for now, accept the rule: Iterate Strict, Pause on Weak."
  *   **Why Switch Examples:** The 4x3 example is symmetric and stable; it doesn't naturally create a chain reaction without contrived Column payoffs. A fresh example prevents them from getting lost in the arithmetic of the first game while trying to learn the logic of the second.

  **0:42 – 0:47: Check Question (Individual Work)**
  *   **Goal:** Distinguish concept mastery from pattern matching.
  *   **See Section 3 below for the specific problem.**

  **0:47 – 0:50: Wrap Up**
  *   Remind them: Next lecture is Nash Equilibrium. This section's material (ISD) is a tool for simplifying games *before* finding NE.
  *   Collect check questions (if you want formative data) or review answers orally.

  ---

  ### 3. The Check Question

  This question is designed to trip up the "pairwise comparison" reflex and the "BR to pure strategies" misconception simultaneously.

  **The Game:**
  Row Player Payoffs (Column payoffs omitted/irrelevant):
  $$
  \begin{matrix}
   & C_1 & C_2 \\
  R_1 & 10 & 0 \\
  R_2 & 0 & 10 \\
  R_3 & 4 & 4
  \end{matrix}
  $$

  **The Prompt:**
  "Can Row 3 be eliminated by Iterated Strict Dominance? Justify your answer mathematically. Be careful: simply comparing R3 to R1 and R2 column-by-column is insufficient."

  **The Trap:**
  *   **The "Recipe" Student:** Sees that $10 > 4$ (in C1) and $10 > 4$ (in C2). They conclude: "R1 beats R3 in C1, R2 beats R3 in C2, so R3 is never a best response to a pure strategy. Delete it." **This is incorrect.**
  *   **The "Concept" Student:** Checks if a mixture of R1 and R2 dominates R3.
      *   Let $\sigma = (p, 1-p, 0)$.
      *   Expected payoff against C1: $10p$.
      *   Expected payoff against C2: $10(1-p)$.
      *   To dominate R3 (payoff 4), we need $10p > 4$ AND $10(1-p) > 4$.
      *   $p > 0.4$ AND $1-p > 0.4 \Rightarrow p < 0.6$.
      *   Since a valid $p$ exists (e.g., $p=0.5$), R3 **is** strictly dominated by the mix $(0.5, 0.5, 0)$.
      *   **Conclusion:** Yes, it can be eliminated, *but* the reasoning must invoke the mixed strategy, not just pairwise pure comparisons.

  **Wait, I need to make sure the "Recipe" student gets it WRONG.**
  In the example above, the Recipe student concludes "Delete" and the Concept student concludes "Delete." Both get the right binary answer, but for different reasons. You want the Recipe student to get the *wrong* binary answer.

  **Revised Check Question:**
  Change R3 payoffs to `(6, 6)`.
  $$
  \begin{matrix}
   & C_1 & C_2 \\
  R_1 & 10 & 0 \\
  R_2 & 0 & 10 \\
  R_3 & 6 & 6
  \end{matrix}
  $$
  *   **Recipe Student:** "R1 > R3 on C1. R2 > R3 on C2. R3 is never BR to pure. Delete it." **(WRONG)**
  *   **Concept Student:** "Check mix. Max payoff from mix of R1/R2 is at $p=0.5$, yielding 5 against both columns. $5 < 6$. R3 is a best response to the 50/50 mix. R3 is **not** dominated. Keep it." **(RIGHT)**

  **Use this Revised Version.** It penalizes the misconception directly.

  ---

  ### 4. Explicit Boundaries (What to Refuse)

  You mentioned you don't want to improvise on the whiteboard about things the professor hasn't introduced. Here is how to handle the inevitable edge-case questions:

  1.  **Weak Dominance Iteration:**
      *   *Student Question:* "But what if we iterate weak dominance? Does it work the same way?"
      *   *Your Response:* "That is a specific topic for the lecture. The short answer is: **No**, the order of deletion can matter for weak dominance, which is why we don't do it in this section. Please wait for the professor's formal treatment."
  2.  **Rationalizability:**
      *   *Student Question:* "Is this the same as Rationalizability?"
      *   *Your Response:* "Iterated Strict Dominance is the *procedure* used to find rationalizable strategies, but we are not defining the epistemic conditions (common knowledge of rationality, etc.) today. Focus on the mechanical deletion rule for now."
  3.  **Nash Equilibrium:**
      *   *Student Question:* "Does this find the Nash Equilibrium?"
      *   *Your Response:* "ISD can simplify the game before we look for NE. Next week we will see that any strategy surviving ISD *might* be part of an NE, but ISD doesn't always find the NE itself. Don't merge the two concepts yet."

  ### 5. Summary of Misconception Management

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Compare rows pairwise."** | During 4x3 example. | Explicitly ask: "Is R4 dominated by R1?" (No). "By R2?" (No). Then ask: "Is it dominated by *any* combination?" |
  | **"Not BR to Pure = Dominated."** | During Concept 1 (3x2 example). | Use the `R3: 3,3` vs `R1: 5,0 / R2: 0,5` example. Show R3 wins against the mix. |
  | **"Iteration works for Weak Dominance."** | During Concept 3. | State the rule as a hard boundary. "Strict allows iteration; Weak does not. We will prove why in lecture." |
  | **"Symmetry implies averaging."** | During 4x3 example. | Ask the `(1.9, 1.9, 1.9)` vs `(2.1, 2.1, 2.1)` threshold question to force engagement with the inequality. |

  This plan keeps the algebra manageable, isolates the conceptual hurdles, and provides a check question that actually discriminates between understanding and memorization.
