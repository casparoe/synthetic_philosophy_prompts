answer: |-
  # The Success Reaction Quiz: What's Your Emotional Tax Bracket?

  You know the labels. You've heard of the American Dream, Tall Poppy Syndrome, and Jantelagen. But labels are cheap. We lie to ourselves about why we feel what we feel. You might think you're a champion of fairness when you're actually just nursing a wound. You might think you're humble when you're actually just strategic.

  This isn't a personality test. It's a diagnostic for your social emotions.

  Below are ten concrete scenarios. There are no "right" answers, and there are no "good" people. Pick the reaction that matches your *gut*, not your LinkedIn profile. Keep track of which option (A, B, C, or D) you choose for each question.

  ***

  ### 1. The Promotion
  You and a colleague are up for the same role. You know you worked harder, but they get the job. They come to your desk to share the news, beaming.
  *   **A.** I smile and congratulate them, but I spend the afternoon updating my resume.
  *   **B.** I hope the pressure of the new role exposes them as not quite ready for it.
  *   **C.** I'm happy for them, provided the hiring manager didn't just pick them because they're friends.
  *   **D.** I congratulate them sincerely. If they can get it, the bar for what's possible here just went up.

  ### 2. The Crypto Win
  A friend you've known since high school, who never held a steady job, mentions they made five figures on a meme coin last week.
  *   **A.** It's annoying. It undermines the value of actually grinding every day.
  *   **B.** I ask them for tips. If the market is there, I want in.
  *   **C.** I feel a pinch in my chest. It feels wrong that luck pays better than work.
  *   **D.** I'm genuinely happy. They needed the win, and I'm glad life cut them a break.

  ### 3. The Loud Winner
  A peer in your industry lands a massive contract and won't stop posting about it on social media. Their success is real, but the bragging is exhausting.
  *   **A.** Someone needs to remind them that they're part of a community, not a one-person show.
  *   **B.** I mute them. Their success doesn't change my bills, but their noise changes my mood.
  *   **C.** It's tacky, but if they delivered the work, they can spend the money how they like.
  *   **D.** I engage with the post. Visibility helps all of us in this field.

  ### 4. The Rival's Stumble
  A competitor who has been openly aggressive toward you misses a major deadline and loses a client.
  *   **A.** I feel a flash of relief, maybe even satisfaction. The ecosystem is balanced again.
  *   **B.** I hope this humbles them so they're easier to work with next time.
  *   **C.** I feel nothing. Their failure doesn't pay my rent.
  *   **D.** I reach out to see if they're okay. Business is business, but people are people.

  ### 5. The Team Lift
  Your team lead gets a massive bonus because the project you did the bulk of the work on went viral. You get a standard raise.
  *   **A.** As long as my raise is market rate, I don't care what they make.
  *   **B.** It feels like theft. The reward structure is broken.
  *   **C.** I'm annoyed. I did the work; why do they get the trophy?
  *   **D.** I'm glad the project got recognized. A win for the lead keeps the department funded.

  ### 6. The Inheritance
  A neighbor you barely know inherits a mansion and immediately starts renovating the garden to be twice the size of everyone else's.
  *   **A.** It changes the neighborhood vibe. Now everyone will feel pressured to keep up.
  *   **B.** It's their money. If they want to burn it on landscaping, that's their business.
  *   **C.** I resent that they get to live better than me without doing anything to earn it.
  *   **D.** I admire the design. Maybe property values will go up for all of us.

  ### 7. The Quiet Success
  You find out a former classmate is running a highly profitable, stable business. They never talk about it, drive an old car, and live modestly.
  *   **A.** I respect them. They succeeded without demanding applause.
  *   **B.** I wonder what they're hiding. Nobody is that successful without cutting corners.
  *   **C.** It makes me question my own choices. Why am I not that disciplined?
  *   **D.** It doesn't bother me. Their life is theirs, and mine is mine.

  ### 8. The Public Takedown
  You watch a viral thread where a successful influencer is being "canceled" or heavily criticized for a past mistake.
  *   **A.** I read every word. It's important to hold powerful people accountable.
  *   **B.** I feel uneasy. It looks like a mob trying to drag someone down to size.
  *   **C.** I hope they lose their sponsorships. They made their bed.
  *   **D.** I skip it. Watching people fall doesn't help me rise.

  ### 9. The Mentor's Leap
  Your mentor, who helped you early in your career, just achieved the exact goal you've been chasing for five years.
  *   **A.** If they can do it, it proves the path is real. I'm closer than I thought.
  *   **B.** I worry they won't have time for me now that they're at that level.
  *   **C.** It stings. I thought I was the prodigy, not them.
  *   **D.** I feel proud, like a family member won a medal.

  ### 10. The Dinner Bill
  You go to dinner with a group where one person earns ten times more than the rest. The bill comes.
  *   **A.** We should split it evenly. Paying for them sets a weird precedent.
  *   **B.** They should pay. If they can afford it, why shouldn't they?
  *   **C.** I offer to pay my share, but I feel resentful if they don't offer to cover it.
  *   **D.** I let them pay if they offer, but I don't expect it. Their money is theirs.

  ***

  ## Scoring Key

  This is where we stop guessing. Tally up how many times you selected each letter.

  *   **Mostly A's: The Leveller (Jantelagen / Tall Poppy)**
  *   **Mostly B's: The Auditor (Meritocratic Indignation)**
  *   **Mostly C's: The Rival (Envy-Driven)**
  *   **Mostly D's: The Ally (Celebrant / American Dream)**

  *(If you have a tie, see the "Tie-Breakers" section below.)*

  ### The Profiles

  **The Leveller (Mostly A's)**
  *   **Core Belief:** Success is a social contract. If you rise too high or too loudly, you break the group's cohesion.
  *   **The Aspiration Tax:** High. You feel responsible for maintaining equilibrium. When someone succeeds, you don't necessarily want what they have; you want them to remember where they came from.
  *   **Blind Spot:** You often confuse *humility* with *morality*. You might cut down a high-performer not because they were unfair, but because they made others feel small.
  *   **Nuance:** If you scored high on **Q3 (Loud Winner)** and **Q8 (Public Takedown)**, your leveling is cultural. If you scored high on **Q1 (Promotion)** and **Q4 (Rival's Stumble)**, your leveling might be envy in disguise.

  **The Auditor (Mostly B's)**
  *   **Core Belief:** Success must be justified. You aren't against wealth or status; you are against *unearned* wealth or status.
  *   **The Aspiration Tax:** Low, provided the system is fair. You can celebrate a billionaire if they built it from scratch. You cannot celebrate a friend's crypto win.
  *   **Blind Spot:** You risk becoming the "Fairness Police." Sometimes life *is* unfair (inheritance, luck), and your indignation burns energy you could use to build.
  *   **Nuance:** If you scored high on **Q6 (Inheritance)** and **Q2 (Crypto)**, you are a pure Meritocrat. If you also scored high on **Q5 (Team Lift)**, you may be using "fairness" as a shield for personal grievance.

  **The Rival (Mostly C's)**
  *   **Core Belief:** Success is a zero-sum game. For you to win, someone else often has to lose, or at least, their win makes your loss feel heavier.
  *   **The Aspiration Tax:** Critical. You measure your worth by comparison. A neighbor's renovation (Q7) or a mentor's leap (Q9) feels like a personal demotion.
  *   **Blind Spot:** You likely view yourself as "ambitious." But ambition focuses on your climb; rivalry focuses on their height.
  *   **Nuance:** **Benign vs. Malicious:** Look at **Q4 (Rival's Stumble)**. If you chose "I feel relief/satisfaction," that is *malicious envy*. If you chose "I feel nothing," that is *benign envy* (you want the success, but you don't need their failure).

  **The Ally (Mostly D's)**
  *   **Core Belief:** Success is contagious. Another person's win is data point #1,001 that success is possible.
  *   **The Aspiration Tax:** Negative. You gain energy from others' wins. You view a mentor's success (Q9) as a roadmap, not a threat.
  *   **Blind Spot:** Strategic Celebration. Look at **Q5 (Team Lift)**. If you celebrated *only* because the department got funded, you are a **Strategic Ally**. If you celebrated because they deserved recognition, you are a **Sincere Ally**.
  *   **Nuance:** Be careful of toxic positivity. Sometimes people fail, and pretending otherwise (ignoring Q8) can make you naive.

  ### Tie-Breakers & Blind Spots

  **The Leveller vs. The Rival (A vs. C)**
  This is the hardest split. Both want the successful person cut down to size.
  *   *The Test:* Look at **Q7 (Quiet Success)**.
  *   If the quiet success bothered you (C), you are a **Rival**. You hate that they have the thing you don't.
  *   If the quiet success didn't bother you (A), you are a **Leveller**. You only hate the *disruption* of success.
  *   *Honesty Check:* Philosophy cannot easily distinguish "Sincere Egalitarianism" from "Envy dressed as Egalitarianism." If you want everyone to have less so that no one has more, the motive is functionally identical to envy, regardless of the political label you put on it.

  **The Auditor vs. The Rival (B vs. C)**
  Both get angry at success.
  *   *The Test:* Look at **Q2 (Crypto)** vs. **Q1 (Promotion)**.
  *   If you hated the Crypto win but accepted the Promotion, you are an **Auditor**.
  *   If you hated both, you are a **Rival**. The "fairness" argument was just a weapon.

  **The Strategic Ally (The "Networker")**
  *   If you scored mostly D's, but your answer to **Q5 (Team Lift)** was "As long as my raise is market rate," you are celebrating strategically. You view success as a network benefit. This isn't malicious, but it isn't the pure "American Dream" inspiration either. It's business.

  ### A Note on the "Aspiration Tax"
  If you found yourself feeling worse after **Q7 (Neighbor Reno)** or **Q9 (Mentor's Leap)**, you are paying a high Aspiration Tax. This is the psychological cost of living in a comparison economy. The **Ally** profile pays the least tax; the **Rival** pays the most. The **Leveller** tries to abolish the tax by capping everyone's income. The **Auditor** tries to justify the tax by ensuring only the "worthy" pay it.

  None of these positions are static. You might be an **Ally** in your career but a **Leveller** in your family. The goal isn't to be a perfect D. The goal is to know when you're cutting a poppy because it's blocking the light, and when you're cutting it because you're jealous of the height.
