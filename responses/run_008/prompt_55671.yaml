  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on social ontology, 13 students, 75-minute session.
      *   **Topic:** David Lewis on *Convention*.
      *   **Goal:** Design an in-class coordination game.
      *   **Key Mechanics:**
          *   No talking.
          *   Repeated coordination with arbitrary signals.
          *   Player rotation (newcomers vs. veterans) to show transmission.
          *   **Crucial Stage:** A "better" signal exists, but switching requires mass coordination (path dependence/lock-in).
          *   **Debrief:** Map experience to Lewis's criteria (common knowledge, conditional preference, arbitrariness).
          *   **Constraints:** No real money. Students haven't read Lewis closely yet (game must generate intuition first).
          *   **Reflection:** Predict pitfalls and acknowledge limitations of the simulation.

  2.  **Deconstruct Lewis's Theory of Convention:**
      *   *Coordination Problem:* Agents have common interests in coordinating actions.
      *   *Equilibrium:* A regularity $R$ in behavior.
      *   *Conditional Preference:* Everyone prefers to conform to $R$ *if* others do.
      *   *Arbitrariness:* There could have been another regularity $R'$ that would have worked just as well.
      *   *Common Knowledge:* Everyone knows, everyone knows that everyone knows, etc., that others expect conformity.
      *   *Precedence:* Past success creates expectation of future success.

  3.  **Game Design - Phase 1: Establishing a Convention (The "Arbitrary Signal"):**
      *   *Mechanic:* Need a simple coordination task. Matching colors, symbols, or numbers.
      *   *Constraint:* No talking.
      *   *Setup:* 13 students. Let's pair them up or make it a whole-class coordination. Whole class is better for "social" feel.
      *   *Action:* Choose a symbol from a set.
      *   *Payoff:* Points for matching the majority (or a specific partner). Let's go with "Match the Group" to simulate a social norm.
      *   *Rounds:* 3-4 rounds to establish a pattern.
      *   *Signal:* Let's use hand signals or cards. Cards are easier to control. Let's say 4 colored cards (Red, Blue, Green, Yellow).
      *   *Goal:* Everyone picks the same color.

  4.  **Game Design - Phase 2: Transmission (The "Newcomers"):**
      *   *Mechanic:* Swap out 3-4 students.
      *   *Instruction:* Newcomers get no instructions other than "earn points." Veterans keep playing.
      *   *Outcome:* Newcomers should mimic veterans to succeed. This shows how conventions teach themselves without explicit rules.

  5.  **Game Design - Phase 3: The Lock-In (The "Better Signal"):**
      *   *Mechanic:* Introduce a new option (e.g., "Gold" card or a specific hand gesture) that is worth *more* points.
      *   *Catch:* It only pays off if *everyone* (or a very high threshold, say 90%) switches simultaneously. If you switch alone, you get zero.
      *   *Lewisian Point:* The old convention is suboptimal but stable. Rational agents won't switch unilaterally. This illustrates the inertia of convention.

  6.  **Drafting the Game Flow (75 Minutes):**
      *   0-10: Intro & Setup (Rules, no talking).
      *   10-25: Phase 1 (Establishment).
      *   25-40: Phase 2 (Rotation/Transmission).
      *   40-55: Phase 3 (The Lock-In/Better Signal).
      *   55-75: Debrief (Mapping to Lewis).

  7.  **Refining the Mechanics (Self-Correction):**
      *   *Issue:* If it's whole class "match the majority," it might be chaotic.
      *   *Fix:* Use a "Salience" starter. In Round 1, make one option obviously focal (e.g., "Pick the color of the stop sign"). Then remove the cue.
      *   *Issue:* How to enforce "no talking"?
      *   *Fix:* Explicit rule. Violation = disqualification for that round.
      *   *Issue:* The "Better Signal" needs to be clear.
      *   *Fix:* Project a payoff table. Old Convention = 1 point if matched. New Signal = 3 points if matched. But New Signal requires 100% adoption to trigger the 3 points (or else 0). Actually, Lewis's point is about *equilibrium*. If 12 pick Red and 1 picks Blue, the Blue picker gets 0. If 12 pick Red and 1 picks Gold, Gold picker gets 0. To switch to Gold, *everyone* must switch.
      *   *Refinement on Lock-In:* It's hard to get 100% switch without talking. That's the point! But if *no one* switches, they never experience the "better" payoff.
      *   *Adjustment:* Tell them privately (via note or slide) that "Gold is worth more." But the rule is: Gold only pays if *everyone* plays Gold. Otherwise, stick to the old color for points. This creates the coordination barrier.

  8.  **Predicting Pitfalls:**
      *   *Chaos:* Students might laugh or treat it as a joke.
      *   *Focal Points:* They might converge on something unrelated (e.g., "everyone pick the color of the professor's shirt").
      *   *The Switch:* In Phase 3, they might just fail to switch and feel frustrated, or one person switches and ruins it.
      *   *Time:* Debrief is crucial. Don't let the game eat all the time.

  9.  **Mapping to Lewis (The Debrief):**
      *   *Regularity:* Everyone played Red.
      *   *Preference:* You wanted points, points required matching.
      *   *Arbitrariness:* Blue would have worked just as well as Red.
      *   *Common Knowledge:* You knew others knew Red was the thing.
      *   *Precedence:* Past rounds influenced current expectations.
      *   *Lock-in:* Why didn't we switch to Gold? (Coordination problem).

  10. **Limitations:**
      *   Lewis talks about *common knowledge* in a deep logical sense. A classroom game creates "mutual knowledge" maybe, but not necessarily the infinite recursion Lewis implies.
      *   Lewis focuses on *truthfulness and trust* in language. This game is more about pure coordination (driving on the left vs. right) than semantics, though it maps well.
      *   Real conventions evolve over generations; 10 minutes of rotation is a simulation, not reality.

  11. **Final Polish:**
      *   Make instructions crisp.
      *   Ensure the "No Talking" rule is emphasized.
      *   Create a specific "Payoff Sheet" for the board.
      *   Write the "Pitfalls" section honestly.

  12. **Review against constraints:**
      *   13 students? Yes, manageable.
      *   75 mins? Yes, timing looks tight but doable.
      *   No money? Use points/candy/stubborn pride.
      *   Lewis concepts covered? Yes.
      *   Pitfalls included? Yes.
      *   Limitations included? Yes.

