answer: |-
  Here is a complete lesson plan designed to generate Lewisian intuitions through gameplay, followed by a philosophical debrief.

  # Lesson Plan: The Convention Simulation
  **Topic:** David Lewis, *Convention: A Philosophical Study* (1969)
  **Time:** 75 Minutes
  **Class Size:** 13 Students
  **Materials:** 
  *   4 sets of colored index cards (Red, Blue, Green, Yellow) – enough for every student to have one of each color.
  *   1 set of distinct "Gold" cards (or a specific hand signal, e.g., "Thumbs Up").
  *   Projector/Board for Payoff Tables.
  *   Small slips of paper (for the "Lock-In" phase).
  *   Candy or "Participation Points" (optional, but social pressure works fine).

  ---

  ## Part 1: Setup & Rules (10 Minutes)
  **The Narrative:** Tell the students they are members of a society trying to maximize collective welfare points. 
  **The Constraint:** **Absolute Silence.** No talking, no texting, no written notes passed between students. Violation results in 0 points for that round.
  **The Mechanic:** In each round, you will count down "3, 2, 1, Reveal." All students must simultaneously hold up one colored card (or signal).
  **The Payoff:** Points are awarded based on *coordination*, not correctness. There is no "right" color, only a "matching" color.

  ---

  ## Part 2: The Game Rounds (35 Minutes)

  ### Phase 1: Spontaneous Order (10 Minutes)
  *   **Rounds 1-3:** 
  *   **Instruction:** "Hold up a color. If you match the *majority* of the class, you get 1 point. If you are in the minority, 0 points."
  *   **Expected Outcome:** Round 1 will be chaotic (salience might drive them to Red or Blue). By Round 3, a Schelling point will emerge (e.g., everyone plays Red).
  *   **Instructor Action:** Record the majority color on the board after each round. Do not explain *why* they matched. Let them feel the relief of coordination.

  ### Phase 2: Transmission & Newcomers (10 Minutes)
  *   **The Swap:** Ask 4 students (the "Veterans") to step out into the hall. Replace them with 4 "Newcomers" (you can use students from another class, or if unavailable, 4 of the Veterans return but act as if they are new—*better option:* simply have 4 students turn their backs and close their eyes for 30 seconds while you brief the other 9 as "Veterans").
      *   *Actually, for 13 students, the cleanest method:* Ask 3 students to leave the room. Tell the remaining 10: "You have established a pattern. Continue it." Tell the 3 newcomers (when they return): "You get points for matching the majority. Go."
  *   **Rounds 4-6:** 
  *   **Instruction:** Same as before (Match the Majority = 1 point).
  *   **Expected Outcome:** The 10 Veterans will play the established color (Red). The 3 Newcomers, seeing the sea of Red, will infer the convention and play Red to get points.
  *   **Lewisian Point:** The convention transmits without explicit instruction. The newcomers conform because they *expect* the veterans to conform.

  ### Phase 3: The Lock-In (15 Minutes)
  *   **The Setup:** Distribute a small slip of paper to **every** student simultaneously. 
  *   **The Text on Paper:** *"A NEW OPTION IS AVAILABLE: The 'Gold' Card (or Thumbs Up). If 100% of the class plays Gold, everyone gets 5 Points. If even one person plays a Color, Gold players get 0. The Old Color (Red) still pays 1 Point if matched."*
  *   **Instruction:** "Read the slip. Destroy the slip. Play the next round."
  *   **Rounds 7-9:** 
  *   **Expected Outcome:** This is the crux. Everyone knows Gold is better (5 pts vs 1 pt). Everyone knows *everyone else* has a slip (Common Knowledge of the option). However, no one knows if *everyone else will switch*. 
      *   If you play Gold and one person plays Red, you get 0.
      *   If you play Red and everyone else plays Gold, you get 0 (because Red no longer matches the majority).
      *   *Correction for stability:* To make the "bad convention" stick, tweak the payoff: "Red pays 1 point if you match the majority. Gold pays 5 points **only if everyone plays Gold**. If you play Gold and anyone plays Red, you get 0. If you play Red and anyone plays Gold, you get 0."
      *   *Result:* Most classes will stick with Red. It is the risk-dominant equilibrium. They are stuck in a suboptimal convention despite knowing a better one exists.

  ---

  ## Part 3: The Debrief (30 Minutes)
  *Do not let them talk about the game until you start this section. The silence preserves the "data."*

  ### 1. Phenomenology (5 Minutes)
  *   Ask: "In Phase 1, why did you pick Red?" (Answers: "Everyone else did," "It seemed obvious.")
  *   Ask: "In Phase 2, Newcomers, why did you pick Red?" (Answers: "I saw everyone else doing it.")
  *   Ask: "In Phase 3, why didn't we switch to Gold?" (Answers: "Too risky," "I wasn't sure you would.")

  ### 2. Mapping to Lewis (15 Minutes)
  Write Lewis's criteria on the board and map the game results to them.

  *   **A Regularity in Behavior:** "We all played Red."
  *   **Common Knowledge:** "You knew others played Red; you knew they knew you knew." (Ask: When did this become common knowledge? Probably Round 3).
  *   **Conditional Preference:** "Did you *love* Red?" (No). "Did you prefer playing Red *given that others played Red*?" (Yes). This is Lewis's crucial distinction: I don't prefer the convention intrinsically, I prefer conforming *conditional on your conformity*.
  *   **Arbitrariness:** "Could Blue have worked?" (Yes). "Was there any intrinsic reason Red was better than Blue in Round 1?" (No). This proves the convention is arbitrary.
  *   **Precedence:** "Why did Round 4 look like Round 3?" Because past success creates expectation of future success.

  ### 3. The Lock-In Analysis (10 Minutes)
  *   Discuss Phase 3. 
  *   **Question:** "Was it irrational to stick with Red?" 
  *   **Lewisian Answer:** No. Given your expectation that others would stick with Red (based on precedent), playing Red was the rational utility-maximizing move. 
  *   **Conclusion:** A society can be stuck in a suboptimal equilibrium where everyone is acting rationally. This explains why social norms persist even when inefficient.

  ---

  ## Predictable Pitfalls (What Will Go Wrong)
  1.  **The "Joker" Problem:** One student might deliberately play Green in Round 3 to "break" the game. 
      *   *Fix:* Address this in the debrief. "Conventions require a 'preference for conformity.' If someone prefers disruption over coordination, they are outside the convention system. Lewis assumes agents *want* to coordinate."
  2.  **Focal Point Confusion:** In Round 1, they might coordinate on something you didn't intend (e.g., "Hold up the color of the professor's shoes"). 
      *   *Fix:* This is actually a feature, not a bug. It shows *salience* drives the initial convention. Use it to explain how conventions start (arbitrary but salient).
  3.  **The Gold Switch:** Sometimes, a charismatic student will make eye contact and the whole class switches to Gold immediately. 
      *   *Fix:* If this happens, the "Lock-In" lesson fails. You must pivot: "You managed to create a *new* convention. But notice how hard that was compared to sticking with Red. You needed a 'moment of common knowledge' to shift. Usually, that requires a focal event (like a law change)."
  4.  **Time Creep:** The game is fun; students will want to discuss it between rounds. 
      *   *Fix:* Be a tyrant about the silence rule. "If you talk, the simulation breaks."

  ## Theoretical Limitations (Honesty for the Seminar)
  *Be explicit with the students about where the game fails to capture Lewis.*

  1.  **Common Knowledge Depth:** In the game, students *assume* others know the rules. Lewis requires a logical recursion (I know that you know that I know...). The game simulates the *feeling* of this, but not the logical structure.
  2.  **Language vs. Coordination:** Lewis's ultimate goal was to explain **truthfulness in language**. This game models driving on the right side of the road (pure coordination). It does not fully capture the complexity of *assertion* and *trust* required for linguistic conventions.
  3.  **The "Contract" Illusion:** The game feels like a one-off agreement. Lewis emphasizes that conventions are sustained by *history*. The game compresses history into 10 minutes, which might make the "precedent" feel weaker than real-world norms that span generations.
  4.  **Power Dynamics:** Lewis's analysis is somewhat ahistorical. In the game, everyone has equal cards. In reality, conventions are often imposed by power (e.g., "We speak English because of Empire, not just because it's a coordination equilibrium"). The game hides the politics of convention.

  ---

  ## Instructor Cheat Sheet: Key Lewis Quotes to Deploy
  *   *On Arbitrariness:* "A conventional signal is arbitrary... there is an alternative regularity which could have served instead." (Use the Blue vs. Red example).
  *   *On Preference:* "Everyone prefers to conform on condition that the others do." (Use the Phase 3 Lock-In).
  *   *On Common Knowledge:* "It is not enough that I expect you to conform; I must expect that you expect me to conform." (Use the hesitation in Phase 3).

  ## Post-Session Assignment
  "Based on today's game, write a 2-page response: Identify a convention in your daily life (e.g., email sign-offs, queueing, dress codes). Analyze it using Lewis's three criteria (Regularity, Conditional Preference, Arbitrariness). Is it 'stuck' like the Red card, or could it easily change?"
