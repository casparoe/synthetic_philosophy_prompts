  1. "What I'm describing"
  You are describing a systematic preference for deterministic compromise over stochastic selection among stakeholders with divergent preferences. Specifically, agents choose a middle-ground outcome guaranteed for all parties rather than a lottery assigning extreme outcomes to specific parties, even when every party ex-ante prefers the lottery's expected utility. This occurs across interpersonal bargaining (restaurants, budgets) and intrapersonal moral uncertainty (blended actions vs. committing to one framework). The core tension is between ex-ante efficiency (lottery) and ex-post equity/certainty (compromise), where agents consistently sacrifice expected utility to avoid the risk of getting their least preferred outcome realized.

  2. "The nearest established concepts"
  In bargaining theory, the Nash Bargaining Solution maximizes the product of utility gains. If utility is linear in the resource, splitting is optimal; if concave (risk aversion), splitting dominates lotteries. In your budget example, diminishing returns (concavity) actually *rationally* justify splitting, making it distinct from the restaurant case where utility is likely linear. The restaurant puzzle touches on **ex-post fairness** preferences (Fehr & Schmidt, 1999 [High Confidence]), where agents dislike unequal outcomes even if ex-ante fair. People often value "no losers" over "maximized average win." In moral uncertainty, the **Moral Parliament** model (Bostrom 2009 [Medium Confidence]; MacAskill 2016 [High Confidence]) typically advocates proportional action (compromise) over stochastic legislation, though MacAskill notes stochasticity avoids "dogmatism." The gap: Standard vNM theory treats lotteries and expected outcomes as identical for risk-neutral agents. The phenomenon persists even when agents claim risk neutrality over the specific good, suggesting a preference for **certainty of partial satisfaction** over **uncertainty of full satisfaction**. This implies utility functions include a penalty for ex-post inequality or regret that standard models omit. In intrapersonal cases, it manifests as **action blurring** to avoid the psychic cost of fully embodying a potentially wrong framework, distinct from pure expected choiceworthiness maximization. Furthermore, social contract theory suggests deterministic compromises reduce enforcement costs; lotteries require trusting the loser to accept the loss, whereas compromises are self-enforcing equilibria. This strategic stability is often conflated with preference. Finally, the **Fairness over Outcomes** vs. **Fairness over Procedures** distinction (Bolton & Ockenfels [High Confidence]) is critical: agents often demand both, whereas lotteries only satisfy the latter. This creates a wedge between individual rationality and group stability.

  3. "Settled vs contested"
  Mathematically, if stakeholders are risk-neutral over their own utility, a lottery over extremes Pareto-dominates a deterministic compromise whenever preferences diverge sufficiently. This is settled decision theory. Contested is whether rational agents *should* be risk-neutral over utility realization. In interpersonal contexts, risk aversion over relative standing (inequality aversion) is empirically robust but normatively debated—is it a bias or a social glue? In moral uncertainty, it is deeply contested whether one should maximize expected choiceworthiness (compromise/blend) or avoid moral risk (stochastic commitment). Some argue blending actions guarantees partial wrongness, while stochasticity risks total wrongness. The core dispute is whether risk aversion applies to the *meta-utility* function aggregating across agents/worlds, or only within a single agent's outcome space. There is no consensus on whether refusing the coin flip is irrational risk aversion or a valid preference for ex-post equity. Additionally, **dynamic consistency** is contested: if you flip today, will you respect the outcome tomorrow? If not, the compromise is the only subgame-perfect equilibrium. Thus, what looks like risk aversion may be credible commitment failure.

  4. "Your best carving"
  I propose **"Deterministic Compromise Bias"**. It distinguishes itself from the "Compromise Effect" (attraction to middle options) by focusing on the *mechanism* of aggregation (averaging vs. randomizing) rather than option positioning. It applies when agents share decision authority but diverge on rankings. Edge cases stress-testing this: (1) **Custody Arrangements**: Parents often split time weekly (compromise) rather than flipping for full custody (lottery), despite kids potentially preferring stability. (2) **Coalition Governments**: Parties blend policies (compromise) rather than randomizing which party dictates terms (lottery). (3) **Internal Conflict**: Procrastination vs. Work. We often do half-work (blended) rather than committing fully to work or rest for the day. The boundary lies where transaction costs of enforcement make lotteries too risky (ex-post renegotiation). When enforcement is perfect and utility linear, preferring compromise is strictly irrational.
