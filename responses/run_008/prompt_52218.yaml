answer: |-
  This is a classic conflict between **medical necessity** and **functional need**, wrapped in a social contract about shared resources. Your sister's argument relies on a heuristic (medical diagnosis = valid, preference = invalid) that is easy to administer but often fails to capture the actual reality of the burden.

  Here is an untangling of the principles, the vibes, and the shaky joints in your sister's position, with confidence flags attached to each analysis.

  ### 1. The "Medical vs. Preference" Distinction
  **Analysis:** Your sister draws the line at "disease." This is a bright-line rule that is easy to enforce but ethically imperfect. Celiac disease involves an autoimmune response; eating gluten causes physical tissue damage. Your texture aversion involves a sensory/gag response; eating mixed foods causes distress, hunger, or vomiting.
  *   **The Real Distinction:** It isn't actually about "disease." It is about **verifiability and severity of harm.** Celiac is objectively verifiable via blood test/biopsy. Texture aversion is subjective. Families often default to objective metrics because they fear fraud or escalation.
  *   **The Vibe:** The idea that one is "real" and the other is "just in your head" is a vibe. Neurodivergent sensory processing issues (which this sounds like) are physiological, not merely psychological preferences.
  *   **[Confidence: High]**
      *   *Reasoning:* Ethical frameworks generally distinguish between *harm* (celiac) and *discomfort* (picky eating), but modern psychology recognizes severe sensory aversions (often aligned with ARFID) as involuntary neurological responses, not choices. The distinction is real regarding *long-term physical damage*, but false regarding *volition*.

  ### 2. The "Choice/Fault" Framing
  **Analysis:** Your sister implies you chose this ("preference") and your cousin didn't ("disease"). You note you've been this way since toddlerhood and cannot push past it.
  *   **The Real Distinction:** There is likely **no distinction in choice.** Severe texture aversions are rarely chosen. They are often rooted in sensory processing sensitivity.
  *   **The Vibe:** This is the part that is most unfair to you. By labeling it a "preference," your sister is morally downgrading your need. She is treating it as a *want* (like your uncle's expensive restaurants) rather than a *constraint* (like your dad's fish hate, but more severe).
  *   **[Confidence: High]**
      *   *Reasoning:* Clinical literature on Avoidant/Restrictive Food Intake Disorder (ARFID) and sensory processing disorder supports your experience that this is not a whimsical choice. Your sister is using "preference" as a shorthand for "not medically diagnosed," not as a literal claim about your agency.

  ### 3. The Slippery Slope (Uncle & Dad)
  **Analysis:** Your sister argues: "If we do this for you, we have to do it for Uncle (expensive tastes) and Dad (hates fish)."
  *   **The Real Distinction:** This is a **category error.**
      *   **Your Cousin/You:** You have *restrictions*. You are removing items from the menu to participate.
      *   **Your Uncle:** He has an *upgrade request*. He wants to spend *more* money for higher quality.
      *   **Your Dad:** He has a *mild restriction*. Hating fish is easily worked around in a week-long trip (don't buy fish).
  *   **The Vibe:** This is a rhetorical defense mechanism. Accommodating a restriction (plain chicken) does not logically compel the group to accommodate an upgrade (steakhouse). It's a "vibe" meant to shut down the conversation by grouping your need with greed.
  *   **[Confidence: Medium-High]**
      *   *Reasoning:* Logically, accommodating a limitation is distinct from accommodating a luxury. However, socially, families often fear the "administrative burden" of tracking multiple needs. I am slightly less than 100% confident because sometimes "where does it stop" is a genuine concern about group cohesion, even if the logic is flawed.

  ### 4. The Burden of Accommodation (Cost vs. Labor)
  **Analysis:** This is the crux of the fairness issue.
  *   **Celiac:** Costs ~$50 extra. Everyone pays. Labor is low (buy GF pasta instead of regular). Cross-contamination risk requires care, but it's mostly financial.
  *   **You:** Costs ~$0 extra (plain ingredients are often cheaper). **Labor is high.** Cooking separate meals requires separate pans, separate timing, and separate planning.
  *   **The Real Distinction:** Your cousin's accommodation is **financial** (shared cost). Your accommodation is **labor** (likely falls on the cooks). In family dynamics, unpaid labor is often valued higher than cash.
  *   **[Confidence: Medium]**
      *   *Reasoning:* I am inferring the labor burden. If the plan is "everyone cooks for themselves," your request is easy. If there is a designated cook, your request adds work. This is the variable that determines if your request is "selfish."

  ### The "Shakiest Joint" (Where I am Least Sure)
  **[Confidence: Low]**
  The part I am least sure about is the **actual logistical burden** your request places on the specific cooks in your family.
  *   *Why it's shaky:* I don't know the kitchen setup. If the plan is "we make one big stew," asking for plain ingredients might require a separate pot, separate prep, and separate cleaning. That is a significant imposition on the person volunteering to cook for 10+ people.
  *   *Why it matters:* If your accommodation requires the cook to run two kitchens, your sister's "slippery slope" argument gains weight—not because your need isn't real, but because the *cost to the volunteer* is high. If the solution is "you eat the sides and we keep a plain protein aside," the burden is near zero, and your sister's stance is unreasonable.

  ### Verdict: Are you owed accommodation?

  **1. Are you being selfish?**
  **[Confidence: High]** No. Asking to be able to eat during a week-long trip is not selfish. Framing it as "I need to be able to participate" is valid. Framing it as "You must cook specifically for me" might be burdensome depending on the labor.

  **2. Is there a principled line?**
  **[Confidence: High]** Yes, but not the one your sister drew.
  *   **Principled Line:** Accommodations that allow participation without increasing financial cost or labor burden should be granted regardless of medical status.
  *   **Sister's Line:** Medical Diagnosis = Accommodation; No Diagnosis = No Accommodation.
  *   **Why hers fails:** It ignores that your need is involuntary (like the diagnosis) but treats it as voluntary.

  **3. What are you owed?**
  **[Confidence: Medium]** You are owed **basic politeness and inclusion**, which implies the group should try to ensure you don't starve. You are not necessarily owed a *custom menu* if it creates disproportionate labor.
  *   *The Compromise:* The fair solution isn't "make me special meals." It is "ensure there are components I can eat." (e.g., If dinner is tacos, ensure there is plain meat and corn tortillas available, not just the fully assembled sauced version).

  ### Summary of the "Vibes" vs. "Principles"

  | Argument | Principle or Vibe? | Why? |
  | :--- | :--- | :--- |
  | **"Celiac is a disease, you are picky."** | **Mostly Vibe** | Ignores that sensory aversion is involuntary. Uses diagnosis as a proxy for "truth." |
  | **"If we do this, where does it stop?"** | **Vibe (Slippery Slope)** | Accommodating a restriction is not the same as funding an upgrade (Uncle). |
  | **"It costs more for GF."** | **Principle** | Financial cost is a tangible burden. Your request likely has $0 financial cost. |
  | **"It's harder to cook separate."** | **Principle (Conditional)** | Labor is a real cost. If your request doubles the cooking work, this is a valid objection. |

  **Final Advice:**
  Stop arguing about "picky eating" vs. "disease." That is a trap where you lose on technicalities.
  Reframe the request to minimize labor: *"I know cooking separate meals is a pain. I'm not asking for a custom menu. I'm asking that when we plan the grocery list, we ensure there are plain proteins and sides I can assemble myself so I don't go hungry. I'll handle my own prep/cleanup."*

  If they still say no to *that*, then it is not about principles or costs; it is about exclusion.
