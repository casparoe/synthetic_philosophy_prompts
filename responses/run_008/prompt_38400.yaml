          1.  Single trait, single fictional species (biologically plausible).
          2.  Ordinary evolutionary dynamics (no GE, no pathology, no human selection).
          3.  *Crucial Twist:* The trait was selected for Effect A, but Effect A is now *absent* (ecologically impossible). The trait is *not* vestigial; it actively produces Effect B.
          4.  Effect B contributes to a capacity but was *never selected for* (block selection via population facts: no variation, too few generations, etc.).
          5.  Neutral narration (no "function" talk, no stipulated verdicts).
          6.  No textbook examples (hearts, wings, etc.).
      *   **Analysis Requirements:**
          1.  State ETI verdict (and why).
          2.  State CR verdict (and why).
          3.  Highlight the "unusual orientation" (ETI function = non-existent effect; CR function = existing effect).
          4.  Identify the working feature (the temporal/ecological gap).
          5.  Analyze what happens if that feature is deleted.
          6.  Internal critiques (how ETI defends "ghost function," how CR defends "current utility").
          7.  Possibility of principled amendment to reconcile.

  2.  **Drafting the Thought Experiment (The "Construct"):**
      *   *Idea Generation:* I need a trait that does something useful now, but did something *different* in the past which is now impossible.
      *   *Constraint Check:* The trait must be active. It can't be a vestigial structure (like whale pelvis). It must be doing *something*.
      *   *Scenario:* A sensory organ? A chemical secretion? A structural feature?
      *   *Selection:* Let's try a chemical secretion in an insect or amphibian.
      *   *Species:* The *Vexillum arborea* (a fictional tree-dwelling beetle).
      *   *Trait:* A glandular secretion on the legs.
      *   *History:* Originally, the secretion dissolved a specific type of resin to access sap (Effect A). The resin-producing trees went extinct due to climate change.
      *   *Current State:* The secretion is still produced. It now acts as a hydrophobic coating that prevents fungal growth in the new, humid environment (Effect B).
      *   *Blocking Selection for B:* The environmental shift was recent (geologically/evolutionarily). There is no genetic variation for the *degree* of hydrophobicity; it's a fixed byproduct of the chemical structure selected for resin dissolution.
      *   *Refining the "Absent Effect":* If the resin is gone, the trait *cannot* produce Effect A. This satisfies the "selected for producing an effect that it no longer produces at all" constraint.
      *   *Refining the "Active Trait":* It's not vestigial because it prevents fungus (Effect B).
      *   *Refining the "No Selection for B":* The shift happened 50 generations ago. The population is small and clonal regarding this locus.
      *   *Drafting the Narrative:* Keep it dry, descriptive, biological. Avoid normative language.

      *(Self-Correction during drafting)*: Wait, if the resin is gone, does the beetle still try to use it? If the trait is a chemical, it's just secreted. If it's a behavior, it might be maladaptive. Let's make it a morphological/physiological trait. A specialized claw? No, a chemical secretion is better for "Effect A is impossible."
      *Revised Idea:* The *Ostralisk* (a fictional lizard). Trait: A throat pouch.
      *History:* Used to amplify a specific frequency to shatter the eggs of a predator (Effect A). The predator is extinct.
      *Current:* The pouch traps heat (Effect B).
      *Problem:* Shattering eggs is a behavior. Maybe too complex.
      *Let's go back to the Beetle idea.* It's cleaner.
      *Species:* *Silicavis messor* (a fictional mining bee).
      *Trait:* A mandibular enzyme.
      *History:* Selected to digest a specific silica-rich pollen casing (Effect A).
      *Ecological Shift:* The plant went extinct. The enzyme is still produced.
      *Current Effect:* The enzyme acts as a potent antimicrobial agent in the nest lining (Effect B).
      *Blocking Selection:* The plant extinction was 20 generations ago. The enzyme production is monomorphic.
      *Wait, one more check:* "The trait must have been selected for producing an effect that it no longer produces at all." If the pollen is gone, it can't digest it. Correct. "The trait must not have gone vestigial or idle." It is actively antimicrobial. Correct. "No heritable variation in the new effect." The antimicrobial property is a physicochemical consequence of the enzyme's structure, which is fixed. Correct.

      *Let's polish the narrative for the prompt.*
      Species: *Xylophaga borealis* (a wood-boring beetle).
      Trait: The "frass-compactor" organ (a specialized abdominal plate).
      History: Selected to compress specific toxic wood shavings into a sealant against a parasitic wasp (Effect A).
      Shift: The wasp went extinct. The toxic wood is gone, replaced by non-toxic wood. The compaction mechanism no longer creates the toxic sealant (Effect A is impossible).
      Current: The compaction creates a dense, moisture-retaining barrier that prevents desiccation (Effect B).
