      *Finalizing the Scenario:*
      Species: *Vespera glaucus* (a fictional nocturnal moth).
      Trait: Ultrasonic clicking organ (tymbal).
      History: Selected to jam the sonar of Bat Species Z (Effect A).
      Shift: Bat Species Z went extinct due to a pathogen.
      Current: The clicks resonate with the moth's own auditory receptors, triggering a neural calibration routine that maintains night-vision acuity (Effect B).
      Blocking: Bat extinction was 30 generations ago. Tymbal structure is fixed.
      *Wait:* Does it "no longer produce Effect A"? If the bat is gone, it can't jam the sonar. Correct.
      *Does it produce Effect B?* Yes, neural calibration.
      *Is B selected?* No, too recent.
      *Is the trait idle?* No, it clicks.

      *Refining for maximum philosophical punch:* The "Effect A" needs to be the *reason* the trait exists, but the effect itself is null. The "Effect B" is the *actual* causal contribution.
      Let's go with a plant example. It avoids animal behavior complexities.
      Species: *Silica Reed* (*Calamus vitreus*).
      Trait: Silica deposits in leaf cuticles.
      History: Selected to deter Herbivore H (Effect A: physical abrasion of mouthparts).
      Shift: Herbivore H went extinct.
      Current: The silica deposits reflect specific UV wavelengths, preventing photoinhibition in high-altitude sun (Effect B).
      Blocking: Extinction 20 generations ago. Silica deposition is a fixed metabolic pathway.
      *Check:* Effect A (deterring H) is impossible (H is gone). Effect B (UV reflection) happens. Effect B is useful. Effect B not selected.
      *This works.*

  3.  **Drafting the Analysis (The "Walkthrough"):**
      *   **Etiological (ETI):** Function is what it was selected for. So, Function = Deterring Herbivore H. Even though H is gone. Even though it doesn't do that now.
      *   **Causal-Role (CR):** Function is current contribution to capacity. So, Function = UV Reflection/Photoinhibition prevention.
      *   **Unusual Orientation:** Usually, ETI says "No function" (novel trait) and CR says "Function." Here, ETI says "Function (ghost)" and CR says "Function (current)." But specifically, ETI assigns function to an *non-existent effect*, while CR assigns function to an *existing effect* that ETI calls "mere use."
      *   **Working Feature:** The temporal/ecological gap. The severing of the selection pressure while maintaining the trait's activity.
      *   **Deleting the Feature:** If H still exists, ETI and CR might align (both say Deterring H). If the trait was vestigial, CR might say "no function" (if it contributes nothing).
      *   **Internal Critiques:**
