      *Critique:* Is Effect A *really* impossible? If the wood is gone, yes.
      *Critique:* Is Effect B useful? Yes, prevents desiccation.
      *Critique:* Is it selected for B? No, too recent.

      *Let's try one more angle to ensure "Effect A is absent" is clear.*
      Species: *Lumina deepsea fish*.
      Trait: Bioluminescent lure.
      History: Selected to attract Prey Species X (Effect A).
      Shift: Prey Species X migrated to warmer waters due to thermal shifts. The lure still lights up.
      Current: The light attracts Symbiont Y which cleans parasites (Effect B).
      Blocking: Migration was 10 generations ago. Light intensity is fixed genetically.
      *Issue:* Attracting Prey X is *possible* if they returned, but they aren't there. Is that "no longer produces at all"? Yes, causally, in the current environment, the effect (catching X) does not occur.
