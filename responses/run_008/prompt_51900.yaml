  ### The Tie-Breaker Case

  To separate the surviving rules (specifically **RSCE** vs. **DESP**), we need a case where *Responsibility* conflicts with *Social Standing*. The previous cases keep these aligned (chosen bad outcomes = low standing; unchosen bad outcomes = high standing claim).

  **Proposed Case: The Voluntary Caregiver**
  *   **Situation:** Elias voluntarily quits his job to care for an aging parent, a socially valued but unpaid role. His income plummets, and his capability to participate in the broader economy vanishes. He is not depressed (Karin) and made the choice freely (unlike Tomas's recklessness, this is a moral commitment). He is now financially struggling and socially isolated from the workforce.
  *   **Question:** Is he owed income support to maintain his standing?

  **Predictions:**
  *   **RSCE (Luck Egalitarian):** **No Support.** The disadvantage is the result of a voluntary choice (option luck). Like Gregory (tastes) and Tomas (skiing), Elias bears the cost of his commitments. Compensation would unfairly burden those who chose to remain in the workforce.
  *   **DESP (Democratic Equality):** **Support Owed.** Elias is performing a socially necessary role. To allow him to fall into poverty or exclusion undermines his status as an equal citizen. Democratic equality often mandates support for care work to prevent a caste of "dependent" citizens, regardless of the initial choice, because the *outcome* threatens equal standing.
  *   **RSON (Objective Need):** **Ambiguous/Threshold Dependent.** If Elias falls below a sufficiency threshold of functioning, he is owed aid regardless of choice (prioritarian leanings). If he is above the threshold, he is owed nothing.

  **Why this separates them:**
  This case forces Beth to choose between the **Gregory/Tomas intuition** (Choice negates claim) and the **Dele/Amina intuition** (Functioning/Standing must be protected).
  *   If Beth says **Nothing**, she prioritizes **Responsibility-Sensitivity** (RSCE).
  *   If Beth says **Support**, she prioritizes **Social Standing/Functioning** (DESP), implying that some choices (care) shouldn't penalize one's civic status.
