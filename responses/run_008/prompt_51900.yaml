  ### Candidate Rules Fitting Beth's Verdicts

  Beth's pattern rejects pure welfarism (Amina vs. Gregory), rejects strict resourcism (Dele), and insists on responsibility-sensitivity (Gregory/Tomas vs. Karin/Amina). Three candidate rules fit all five verdicts, provided they are specified carefully to accommodate Verdict 5 (Dele).

  **1. Responsibility-Sensitive Capability Equality (RSCE)**
  *   **Principle:** Justice requires equalizing the *capability sets* (real opportunities to function) of individuals, but only where disadvantages arise from *brute luck* (unchosen circumstances). Disadvantages resulting from *option luck* (calculated risks) or cultivated preferences generate no claim.
  *   **Accommodating Verdict 5 (Dele):** This rule must specify that "resources" are not the metric; *conversion factors* are. Cash is a resource, but without interpreters, Dele cannot convert cash into the capability to communicate. Therefore, justice requires providing the specific *means of conversion* (interpreters/classes) to restore the capability, regardless of the cost, because the lack of community infrastructure is a brute luck disadvantage relative to his impairment.

  **2. Responsibility-Sensitive Objective Need (RSON)**
  *   **Principle:** Justice requires meeting *objective needs* for human functioning up to a sufficient threshold, discounted by responsibility. Subjective satisfaction is irrelevant (Amina); unchosen impairments create objective needs (Karin); chosen risks do not (Tomas).
  *   **Accommodating Verdict 5 (Dele):** This rule must define "need" not biologically, but *socially*. Dele's need is not just for medical care, but for the social infrastructure required to function as a human agent in his society. Cash fails to meet the objective need for communication; therefore, the specific social goods (interpreters) must be provided to meet the need.

  **3. Democratic Equality / Social Participation (DESP)**
  *   **Principle:** Justice requires ensuring all citizens can stand as equals in social and political life. Claims arise from threats to *social standing* or *participation* caused by unchosen circumstances. Choice negates the claim to equal standing (Gregory/Tomas).
  *   **Accommodating Verdict 5 (Dele):** This rule must specify that "standing" requires actual *access*, not just formal rights or financial means. Isolation threatens standing. Because the lack of interpreters is a structural barrier to participation (unchosen by Dele), the state must remove the barrier directly rather than offering cash, which leaves the exclusion intact.

  ---

  ### Predictions for Marta

  **The Case:** Marta suffers brute luck disadvantage (war-zone infrastructure collapse) reducing her "doings and beings," but reports subjective contentment.

  | Rule | Prediction | Reasoning |
  | :--- | :--- | :--- |
  | **RSCE** | **Owed Support** | War is brute luck. Her capability set is crushed (no hospitals/universities). Like Amina, her contentment is irrelevant to the capability deficit. |
  | **RSON** | **Owed Support** | The collapse creates objective needs (transport, education, health access). Like Amina, subjective peace does not negate objective need. |
  | **DESP** | **Owed Support** | She cannot participate in the social life of a functioning society (like her twin). The barrier is unchosen. |

  **Convergence and Divergence:**
  All three rules **converge** on the verdict that Marta is owed support. They all treat her contentment as irrelevant (following Amina) and the structural collapse as an unchosen disadvantage (following Karin/Dele).
  **Divergence:** The rules diverge slightly on the *form* of support.
  *   **RSCE** and **DESP** strongly imply *structural restoration* (rebuilding hospitals/universities) because cash cannot restore the capability/participation if the institutions don't exist (following Dele).
  *   **RSON** *could* allow cash if it were sufficient to meet the need, but given Dele, it likely mandates specific provision.

  ---

  ### Closest Analog and Decisiveness

  **Closest Analog:** A hybrid of **Amina (Case 2)** and **Dele (Case 5)**.
  *   **Amina** is the analog for the *subjective state*: Both are content despite disadvantage. This analogy decides that contentment does not veto a claim.
  *   **Dele** is the analog for the *nature of the disadvantage*: Both face external, structural barriers to functioning (Dele: linguistic isolation; Marta: institutional collapse). This analogy decides that cash is likely insufficient; the environment itself must be fixed.

  **Does it decide anything?**
  Yes. The Amina analogy blocks the argument that "she's happy, so leave her alone." The Dele analogy blocks the argument that "give her cash and let her move." Together, they compel a verdict of **owed structural support**.

  ---

  ### Best Guess

  **Verdict:** **Marta is owed public support to restore the infrastructure (universities, hospitals, transport), not merely cash compensation.**

  **Reasons:**
  1.  **Consistency on Contentment:** Beth has consistently ruled that subjective satisfaction (Amina, Marta) does not negate a claim when the disadvantage is unchosen. To rule otherwise would contradict Verdict 2.
  2.  **Consistency on Infrastructure:** Beth's gloss on Dele ("cash was not enough... owed the actual means") establishes a precedent that when the environment prevents functioning, the environment must be fixed. Marta's environment is the direct cause of her reduced capabilities.
  3.  **Responsibility:** Unlike Gregory or Tomas, Marta exercised no choice leading to her disadvantage. It is pure brute luck.
  4.  **Metric:** Beth rejects welfare (Amina) and simple resources (Dele) in favor of *functioning* ("less to work with," "means to communicate," "do and be far less"). Marta's functioning is impaired.

