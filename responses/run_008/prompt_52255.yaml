prompt: |-
  I'm a senior software engineer, deep in systems work, but with basicaly no philosophy education beyond skimming stuff online. A friend who went to law school got me reading about the Hart–Fuller debate (the 1958 Harvard Law Review exchange about legal positivism vs. natural law) and I keep feeling like I already know this fight from my day job. My instinct is that law is a lot like a codebase plus its toolchain. Legal positivism reads like saying valid law is whatever the build system accepts — the rule of recognition is the CI config that determines which commits count as the real source tree, and nobody runs a moral linter before merging. Fuller's comeback, that legality itself has an inner morality — his principles like publicity, clarity, not contradicting yourself, not demanding the impossible, keeping rules stable over time, and making official action actually match the declared rules — reads like software engineering hygiene: documentation, consistent style, non-conflicting requirements, achievable specs, API stability, and implementations that actually conform to the spec. And Hart's point about core versus penumbra cases and open texture sounds an awful lot like undefined behavior and underspecified requirements that two compilers (or two judges) can resolve differently.

  So here's what I want: restate the Hart–Fuller debate in my vocabulary — repos, specs, compilers, linters, CI, RFC processes, tech debt, deprecation, the whole world I live in — as faithfully as you can, for both sides, including the grudge informer / Nazi legality issue they argued over (whether wicked rules still count as law, and whether retroactively punishing the informer was itself a breakdown of legality). Then give me the residue report: which claims translate cleanly, which translate only with distortion, and which have no counterpart in my world at all. Be honest about where the translation smuggles in assumptions — I'm suspicious that glossing positivism as the law is just whatever code compiles doesn't translate the position so much as bake in its conclusion, and I especially want to know whether Hart's internal point of view (officials treating rules as standards they follow rather than regularities they predict) has any software analog, or whether that's exactly where the analogy dies. Finally, tell me your view on the residue: does it show my engineering vocabulary is missing something, or that the philosophers' disagreement is less substantive than it looks?

  Two constraints: keep the whole thing under 750 words, and at the end add a brief note on how confident you are in the translation overall and which single claim in it you're least sure about.
