          *   *Check:* Accurate. This is the core case study of *Silencing the Past*.
      *   *Claim 7:* "On this view, the archivist's proper role must be an active one. Hilary Jenkinson, writing in the 1920s, argued that the archivist should actively appraise records, selecting those of historical value and discarding the rest, and the modern archival profession largely followed him."
