  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Regarding the Relationship Between Access and Phenomenology in Visual Cognition**
  **Signatories:** Maya [Last Name], Jonas [Last Name]

  ## 1. AGREED EMPIRICAL AND FUNCTIONAL CLAIMS
  *Both parties affirm the following statements as accurate descriptions of the current data and the functional architecture under discussion. No theoretical interpretation of "consciousness" is implied in this section.*

  1.  **The Sperling Effect:** In partial-report paradigms, subjects can accurately report a cued row of a visual array (3–4 items) after the stimulus offset. When cued immediately, accuracy is high; as the cue delay increases, accuracy decays rapidly, approaching chance levels within approximately 300–500 milliseconds.
  2.  **Iconic Memory Properties:** There exists a high-capacity, rapidly decaying sensory store (iconic memory) that precedes working memory encoding. The contents of this store are fragile and susceptible to masking.
  3.  **Global Workspace Functionality:** The cognitive architecture described by Global Workspace Theory (GWT)—specifically the selection and broadcasting of information to fronto-parietal networks—is robustly correlated with the ability to verbally report, sustain attention, and perform complex reasoning on stimulus content.
  4.  **Limitations of Report:** Verbal report requires time, working memory capacity, and attentional selection. Consequently, reportable content is necessarily a subset of total sensory input.
  5.  **No-Report Paradigms:** Experimental designs exist (e.g., opt-out tasks, delayed matching, physiological monitoring, neural decoding) that assess stimulus processing without requiring immediate verbal report or working memory consolidation during the stimulus presentation window.
  6.  **Blindness Phenomena:** Change blindness and inattentional blindness are robust phenomena where significant changes or salient objects fail to be reported or acted upon when attention is not directed to them.
  7.  **Postdiction:** Perceptual experience can be influenced by stimuli presented after the target event (temporal integration windows), allowing for reconstructive processes to alter the subjective timeline of perception.

  ## 2. DISAGREEMENTS TABLE
  *The following table outlines the divergent theoretical interpretations. Each cell represents the position held by the respective party, phrased to satisfy their own theoretical commitments without caricature.*

  | Domain | Maya's Position (GWT / Access) | Jonas's Position (Phenomenal Overflow) |
  | :--- | :--- | :--- |
  | **Constitution of Experience** | Phenomenal consciousness is constituted by global availability. If content is not broadcast to the workspace for report and reasoning, it is not consciously experienced. | Phenomenal consciousness is distinct from access. Content can be consciously experienced (have phenomenal character) even if it is not broadcast to the workspace or available for report. |
  | **Interpretation of Sperling** | The subjective feeling of "seeing all letters" is a metacognitive error or postdictive reconstruction based on the fragile iconic trace. Subjects mistake the *availability* of the trace for the *experience* of the content. | The subjective feeling of "seeing all letters" is veridical. Subjects experience a rich phenomenal field that exceeds access capacity. The cue selects a subset of *already experienced* content for report. |
  | **Role of Report** | Report is the primary operational measure of consciousness. While report requires access, access is identical to experience; therefore, report tracks experience without fundamental distortion. | Report is a filter that necessitates access. Relying solely on report conflates *having* an experience with *using* an experience, systematically underestimating the richness of phenomenology. |
  | **Function of Overflow** | There is no functional overflow. Content that is not accessed is unconscious processing. Attributing experience to unaccessed content is "Panglossian" (assuming representation implies experience). | Overflow is phenomenally real but functionally limited. Unaccessed content may not support reasoning or report, but it contributes to the "what it is like" of the moment. Denying this is a "killjoy" reduction of phenomenology to function. |
  | **The Explanatory Gap** | Explaining the functional architecture of access explains the relevant scientific target. The "feel" of broadcasting is explained by the system's self-monitoring of that broadcast. | Functional architecture explains report and reasoning (Access Consciousness) but does not explain why broadcasting feels like anything (Phenomenal Consciousness). GWT addresses the easy problems, not the hard problem. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS
  *The following points identify the specific empirical conditions that would adjudicate the dispute. Both parties commit to the predictions listed below.*

  ### Crux A: The Validity of No-Report Paradigms
  **Issue:** Does removing the requirement for immediate report reveal conscious content that exceeds access limits, or does it merely measure unconscious processing?
  **Test:** A no-report paradigm (e.g., Frässle et al. style binocular rivalry or Tsuchiya et al. continuous flash suppression) where neural correlates or physiological markers (pupil dilation, EEG decoding) are measured without motor report.

  *   **Maya's Prediction:** Neural signatures associated with *conscious* perception (specifically late, sustained fronto-parietal ignition) will only appear when the subject is required to access the stimulus for a task (even a non-verbal one). Without task-relevant access, sensory activity will remain local and unconscious.
  *   **Jonas's Prediction:** Neural signatures in sensory cortex (e.g., V1-V4 pattern decoding) will correlate with subjective richness even in the absence of fronto-parietal ignition or report requirements. High-capacity sensory decoding will persist despite low access capacity.
  *   **Adjudication:** If high-fidelity sensory decoding exists without fronto-parietal ignition *and* correlates with subjective richness estimates (via post-experiment interview), Jonas gains support. If sensory decoding without ignition correlates only with unconscious priming effects, Maya gains support.

  ### Crux B: The Durability of the "Rich" Trace
  **Issue:** Is the Sperling "richness" a persistent phenomenal state or a reconstructive inference?
  **Test:** Varying the mask onset time and cue delay in a partial report task while collecting confidence ratings and phenomenological descriptions.

  *   **Maya's Prediction:** Confidence ratings and reports of "richness" will decay at the same rate as objective accuracy. If accuracy drops due to masking, reports of rich experience will also vanish, indicating the experience was dependent on the accessible trace.
  *   **Jonas's Prediction:** Subjects will report high phenomenological richness even at delays where objective accuracy is at chance, provided the iconic trace was not masked immediately. The "feeling" persists even when the *access* to specific identities is lost.
  *   **Adjudication:** A dissociation between high confidence/richness reports and chance-level accuracy at specific delays supports Jonas. A tight coupling between accuracy and confidence supports Maya.

  ### Crux C: The Utility of Unaccessed Content
  **Issue:** Can unaccessed (overflowed) content influence behavior beyond simple priming?
  **Test:** A dual-task paradigm where a primary task exhausts working memory capacity while a secondary stimulus is presented.

  *   **Maya's Prediction:** The secondary stimulus will have zero influence on complex planning or reasoning tasks. Any effect will be limited to low-level feature priming (unconscious).
  *   **Jonas's Prediction:** The secondary stimulus can influence affective evaluation or simple summation tasks (e.g., "was the average size larger?") without entering working memory or reportability.
  *   **Adjudication:** Demonstration of complex integration (beyond simple priming) from unreported stimuli supports Jonas. Strict limitation to low-level priming supports Maya.

  ## 4. VERDICT ON VERBALITY VS. SUBSTANCE
  *Assessment of whether the dispute is definitional or empirical.*

  **The Dispute is Partially Verbal (Approx. 30%):**
  A portion of the conflict stems from the definition of the word "conscious."
  *   **Maya** uses "conscious" to mean *Access Consciousness* (availability for global control/report).
  *   **Jonas** uses "conscious" to mean *Phenomenal Consciousness* (subjective experience, regardless of availability).
  *   **Resolution:** If both parties agree to strictly use "A-Conscious" and "P-Conscious" (per Block's distinction), the argument "Is consciousness access?" dissolves into "Is P-Conscious identical to A-Conscious?"

  **The Dispute is Largely Substantive (Approx. 70%):**
  Even after clarifying terminology, a significant empirical disagreement remains.
  *   **Empirical Claim 1:** Maya claims that when access fails (no report, no working memory), P-Consciousness *also* fails. Jonas claims P-Consciousness *persists*. This is a testable claim about neural correlates and behavioral dissociations.
  *   **Empirical Claim 2:** Maya claims the "feeling of richness" in Sperling tasks is a postdictive error. Jonas claims it is a veridical report of a fading state. This is a testable claim about the timeline of confidence vs. accuracy.
  *   **Empirical Claim 3:** Jonas posits the existence of neural states that are phenomenal but not globally broadcast. Maya posits that such states are strictly unconscious. This is a testable claim about the necessity of fronto-parietal ignition for experience.

  **Conclusion:**
  Draining the wording does not end the fight. If Maya and Jonas agree to call Jonas's target "P-Consciousness," Maya still denies that P-Consciousness exists without access. Jonas still asserts it does. The core conflict is not merely about labels, but about the **architecture of the mind**: specifically, whether high-capacity sensory representations ever carry phenomenal weight independent of the bottleneck of global availability. The adversarial collaboration must focus on the Cruxes in Section 3, as these provide the only path to resolving the substantive 70%.
