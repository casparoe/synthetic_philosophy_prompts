      *   Complex: Maps the room, returns to dock (Intentional: "It *knows* where home is," "It *wants* to charge").
      *   Scaled: Add language. "I am cleaning the kitchen."
      *   *Why:* Everyone knows a Roomba. It's clearly mechanical but acts goal-directed.
      *   *Must Have:* State retention, goal hierarchy.
