answer: |-
  This is one of the sharpest puzzles in financial epistemology. You have correctly identified the tension between the **Hayekian view** (markets aggregate dispersed information via prices) and the **Milgrom-Stokey/Aumann view** (common priors + rationality = no speculative trade).

  If everyone shares a prior and is rational, the fact that a counterparty is willing to take the other side of your bet *is itself information* that should cause you to update your belief until you no longer want to trade. This is the "Groucho Marx Theorem": "I don't care to belong to any club that will have me as a member."

  To untangle this, we need to separate the **ontological status of the price** (what the number *means*) from the **mechanical drivers of volume** (why the number *moves*).

  Here is my analysis as a formal epistemologist looking at institutional design.

  ### 1. Diagnosing the Paradox
  The paradox arises because we are conflating two different roles a participant plays:
  1.  **The Informant:** Someone with private signal $S$ who wants to reveal it via price.
  2.  **The Counterparty:** Someone willing to take the risk to provide liquidity.

  Under strict Common Prior Assumption (CPA) + Rationality, the Informant cannot find a Counterparty who is *also* an Informant. If you want to buy, I should infer you have good news, update my prior, and raise my ask price until the trade vanishes.

  Therefore, for the market to exist, **one of the assumptions in the No-Trade Theorem must fail.** The question is: *which one*, and does that failure destroy the epistemic value of the price?

  ### 2. Candidate Resolutions (Brainstorming)

  Here are the four main ways to resolve the tension, ranked from most standard to most epistemologically interesting.

  **A. The "Noise Trader" Rescue (Standard Finance)**
  *   **Mechanism:** Volume is driven by agents who trade for non-informational reasons (liquidity needs, hedging, entertainment, or simple error).
  *   **Epistemology:** The CPA holds among the *informed* rational traders, but not the noise traders.
  *   **Implication:** Prices are valid probabilities because rational arbitrageurs push the price to their true posterior, using noise traders as camouflage to hide their information advantage.
  *   **Verdict:** This is the standard defense. It saves the "price = probability" interpretation but admits the market requires irrationality (or non-epistemic motives) to function.

  **B. The "Liquidity & Hedging" View (Institutional Realist)**
  *   **Mechanism:** In corporate prediction markets, employees aren't usually hedging risk. But in real markets, they are. Trade happens because Agent A needs cash and Agent B has cash, not because they disagree on $P(Event)$.
  *   **Epistemology:** Information aggregation is a *byproduct*, not the primary engine.
  *   **Implication:** Prices are probabilities only insofar as the marginal trader is motivated by information rather than liquidity.
  *   **Verdict:** Explains volume well, but weakens the claim that the price is a "pure" probability estimate.

  **C. The "Bounded Rationality" View (Behavioral)**
  *   **Mechanism:** Traders are Bayesian but not *common knowledge* Bayesian. I know I have info, I know you have info, but I don't know that you know that I know... (infinite recursion failure).
  *   **Epistemology:** CPA holds, but "Common Knowledge of Rationality" fails.
  *   **Implication:** Trade occurs because we underestimate how much the other person knows.
  *   **Verdict:** Epistemically fragile. If traders realize they are bounded, the market might collapse.

  **D. The "Heterogeneous Priors" View (The Radical Option)**
  *   **Mechanism:** Agents genuinely have different priors. We agree to disagree.
  *   **Epistemology:** CPA is false.
  *   **Implication:** Prices are not "The Probability." They are a **wealth-weighted consensus of subjective probabilities.**
  *   **Verdict:** This is the most honest description of political betting markets. It changes what the price *means* but doesn't necessarily render it useless.

  ### 3. Mapping Assumptions to Practice

  Let's break down what the institution actually requires.

  | Feature of the Market | Required Assumption | Compatible Views |
  | :--- | :--- | :--- |
  | **Existence (Volume)** | **Failure of CPA** OR **Non-Informational Motives**. If everyone is a rational Bayesian with a common prior, volume is zero. | Noise Traders, Hedgers, Heterogeneous Priors, Bounded Rationality. |
  | **Efficiency (Price = Prob)** | **Dominance of Informed Capital.** The marginal trader must be trading on information, not noise. | Noise Traders (if informed traders are richer/bolder), Heterogeneous Priors (if wealth tracks accuracy). |
  | **Interpretability** | **Shared Likelihoods.** Even if priors differ, traders must agree on $P(Signal | Event)$. If we disagree on how to interpret data, prices become meaningless. | All views *except* radical relativism where likelihoods also diverge wildly. |

  **The Crucial Distinction:**
  The practice presupposes that **Volume comes from Noise/Heterogeneity**, but **Price Setting comes from Information.**
  This is the "Marginal Trader" hypothesis. The market price is determined by the last person willing to buy or sell. If the noise traders push the price away from the truth, informed traders (who share a prior *with each other*, if not the noise) will step in and correct it.

  So, the epistemology is: **"Local Common Prior among the Marginal Capital."**
  It does not require the *entire market* to share a prior. It only requires that the people with the most money and the best information share a prior (or converge on likelihoods) sufficiently to dominate the noise.

  ### 4. The Heterogeneous Priors Scenario

  Now, let's take your hardest question seriously: **What if participants hold genuinely different priors?** (e.g., A Trump supporter and a Trump skeptic betting on the election).

  If CPA fails, Aumann's Agreement Theorem fails. We can agree to disagree. The price is no longer a Bayesian posterior of a single rational agent.

  **What is the price then?**
  It is a **market-clearing consensus of confidence.**
  Mathematically, if agents have different priors $P_i(E)$ and logarithmic utility, the market price $P_{market}$ tends toward a wealth-weighted average of their individual probabilities.
  $$ P_{market} \approx \frac{\sum w_i P_i(E)}{\sum w_i} $$
  Where $w_i$ is the risk tolerance/wealth of agent $i$.

  **Is this still a probability an outsider should adopt?**
  **Yes, but with a caveat.**

  1.  **The "Skin in the Game" Filter:** Even with different priors, the market filters out "cheap talk." A pundit can say 99% with no cost. A trader must put up capital. The market price weights opinions by **confidence + capital**. If I am an outsider, I should generally prefer the wealth-weighted consensus of confident bettors over the unweighted average of pundit opinions.
  2.  **The Epistemic Humility Argument:** As an outsider, *I* likely do not know the "True Prior." If I assume my prior is the True Prior, I am committing the same error as the traders. The market price represents a aggregation of diverse worldviews. Unless I have a specific reason to believe my prior is superior to the *aggregate* of the market's priors, the market price is still my best estimate.
  3.  **The Danger:** If the wealth weighting is correlated with *error* (e.g., overconfident idiots have more money than cautious experts), the price will be biased. This is the "Keynesian Beauty Contest" risk—trading based on what you think others believe, rather than truth.

  **Conclusion on Heterogeneous Priors:**
  If priors differ, the price is not an **ontological probability** (the frequency of the event in the multiverse). It is a **decision-theoretic probability**. It is the number you should use if you want to maximize expected utility *given the resources and beliefs currently available in that ecosystem*.

  ### 5. Synthesis: The "As-If" Common Prior

  Here is the resolution I propose, synthesizing the formal epistemology with institutional reality:

  The prediction market does not require a **psychological** Common Prior. It requires an **effective** Common Prior among the **marginal liquidity providers.**

  1.  **Volume** is sustained by heterogeneous priors, overconfidence, hedging needs, or subsidized participation (common in internal corporate markets). This violates the strict No-Trade conditions.
  2.  **Accuracy** is sustained because traders with "wrong" priors (or noisy signals) tend to lose money over time, while traders with "right" priors (and accurate likelihoods) accumulate wealth and influence the price more.
  3.  **The Epistemic Status:** The price is a probability in the sense that it is the **unique number that prevents arbitrage among the informed subset.**

  **To answer your specific question:**
  *   **Does the practice presuppose "priors are roughly common locally"?**
      *   Yes, among the *smart money*. If the informed traders disagree fundamentally on likelihoods, the market will not converge; it will oscillate or bifurcate.
  *   **Does it presuppose "trading is driven by liquidity/overconfidence"?**
      *   Yes, for *volume*. Without this, the Milgrom-Stokey theorem kills the market.
  *   **If participants hold genuinely different priors, are prices still good?**
      *   They are good as **aggregators of confidence**, not necessarily truth. They tell you "This is what the confident, capitalized world believes." For an outsider, this is usually a better prior than your own, unless you have specific private information that the market lacks.

  **The Final Verdict:**
  The puzzle is untangled by recognizing that **Information Aggregation** and **Speculative Trade** are distinct mechanisms that rely on different sub-populations.
  *   The **No-Trade Theorem** applies to the *informed* population (preventing them from betting against each other).
  *   The **Efficient Market Hypothesis** applies to the *price* (which reflects the informed population's view).
  *   The **Volume** comes from the *uninformed* or *differently-prior* population betting against the informed.

  The market works not because everyone shares a prior, but because those who *act as if* they share a prior (the arbitrageurs) are the ones who set the price, while those who don't (the noise/heterogeneous traders) provide the volume. The epistemology is **pragmatist**: The price is "true" because it is the only number that survives the evolutionary pressure of the market, regardless of the psychological priors of the participants.
