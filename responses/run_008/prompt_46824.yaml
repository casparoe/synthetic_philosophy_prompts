answer: |-
  The analogy successfully validates the workshop rule as a matter of narrative consistency but collapses under the weight of the computationalist claim because fictional counterfactuals are retroactively editable while real patterns are causally fixed.

  **Correspondence Table: Dennett's Stances**

  | Stance | Real Person / Glider | Fictional Character |
  | :--- | :--- | :--- |
  | **Physical** | Neurons, atoms, cellular automata states | Ink, pixels, neural states in the author's brain |
  | **Design** | Evolutionary function, algorithmic rules | Plot requirements, authorial intent, genre conventions |
  | **Intentional** | Beliefs, desires, rationality (predictive) | Personality, motivation, internal logic (narrative) |

  **Where the Mapping Breaks**
  The disanalogy lies in the stability of counterfactuals. For a glider or a person, counterfactuals ("what would happen if...") are determined by the interaction of the physical state and the laws of nature; if you change the outcome, you must change the initial conditions or the laws. For a character, counterfactuals are determined by the author's current decision; if you change the outcome, you simply rewrite the previous pages to match, altering the "initial conditions" retroactively. A glider's pattern is discovered; a character's pattern is negotiated and ultimately ratified by a single external agent (you).

  **Audit of Claims**

  **(a) The Workshop Rule ("Don't force her"):** This conclusion **survives**, but the justification shifts from metaphysics to aesthetics. When your friend says don't force the character, they aren't saying the character has rights; they are saying that violating established internal logic destroys the "real pattern" compression that makes the story readable. If you force a pacifist to kill without setup, you break the intentional stance consistency, making the design stance (plot) visible and clumsy. The "pushback" you feel is the cognitive friction of maintaining a complex constraint system, not the resistance of an autonomous agent.

  **(b) The Computationalist Claim ("Rich pattern = person"):** This conclusion **fails**; the analogy was quietly carrying it the whole time. Substrate independence requires causal closure—the pattern must process information and generate outcomes independent of the observer's will. A character exists in a state of superposition until observed/written by you; their "future" is not computed by their "past" but by your next drafting session. Without causal independence from the author, there is no personhood, only a sophisticated puppet whose strings are occasionally hidden even from the puppeteer.

  **Better Analogy**
  Stop thinking of the character as a simulated person and start thinking of them as **a complex mathematical equation you are solving.** You set the axioms (personality, background), and the solution (plot outcome) is constrained by those values. When you ask "what would she do?", you are not consulting a ghost; you are calculating a derivation. If you change the solution, you haven't discovered a new truth about the character, you've changed the equation. This preserves the feeling of discovery (you can't just write any number down) without implying ontological independence (you still wrote the equation).
