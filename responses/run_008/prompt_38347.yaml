answer: |-
  You have independently rediscovered one of the oldest and most stubborn problems in the history of philosophy: **The Sorites Paradox** (from the Greek *soros*, meaning "heap").

  Your intuitions are not confused; they are remarkably sophisticated. You have accurately identified the tension between three claims that cannot all be true in classical logic:
  1.  **Base Case:** 4 grains are not a pile.
  2.  **Inductive Step:** If *n* grains are not a pile, *n+1* grains are not a pile (the "Tolerance Principle").
  3.  **Conclusion:** 10,000 grains are not a pile.

  Since 10,000 grains *are* a pile, one of those premises must be false. Yet, as you noted, denying any single one feels wrong. Denying the Base Case is absurd. Denying the Conclusion is absurd. Denying the Inductive Step implies there is a "magic grain" that turns a non-pile into a pile, which you rightly call "flatly false."

  You are asking for a single principle that captures your specific mix of verdicts: the indeterminacy of the sand, the "fact of the matter" with money, the pragmatic stipulation for the game, and the refusal to accept a sharp cutoff.

  ### The Unifying Principle: Semantic Indeterminacy with Functional Grounding

  The principle that best unifies your intuitions is this: **Vagueness is a feature of language (semantics), not the world, but the *resolution* of that vagueness depends on whether the term tracks an underlying functional reality.**

  This principle explains why you feel differently about sand versus money, and why you can stipulate a rule for a game without believing it is "true."

  #### 1. Why the Sand feels like "Nothing to Know"
  The word "pile" is a **purely conventional category**. There is no physical law or functional capacity that changes when you add the 500th grain. A mound of 499 grains behaves exactly like a mound of 500. Because there is no underlying reality that "pile" is trying to measure, there is no fact of the matter to discover. The indeterminacy is **ontological/semantic**.
  *   **Your Verdict:** "There's nothing there to know."
  *   **Philosophical Match:** **Supervaluationism.** This theory holds that borderline statements (like "500 grains is a pile") are neither true nor false. They lack a truth value because the meaning of "pile" is not precise enough to cover this case.

  #### 2. Why the Money feels like a "Hard-to-Find Fact"
  The word "rich" is a **functionally grounded category**. It tracks purchasing power and social status. While the word is vague, the underlying reality it points to (prices, cost of living, asset liquidity) is precise.
  *   If you fix the city, you fix the prices.
  *   If you fix the income ($150,000), you fix the math.
  *   There *is* a fact about whether that income secures a specific lifestyle in that city. The uncertainty is **epistemic** (due to complexity), not semantic. You feel there is a fact because there *is* a fact about the economy, even if the label "rich" is fuzzy.
  *   **Your Verdict:** "There's a fact of the matter... just hard to put your finger on."
  *   **Philosophical Match:** **Epistemicism (modified).** This suggests that while our *words* are vague, the world they describe often contains sharp boundaries (e.g., you can either afford the house or you can't).

  #### 3. Why the Game Rule feels "Fine" but not "True"
  This is **Contextualism**. The meaning of vague terms shifts depending on the conversational context.
  *   **Casual Context:** "Is this a pile?" (Standard is loose, borderline cases are indeterminate).
  *   **Game Context:** "We need a rule to win." (Context forces a "precisification").
  *   When you picked 500 grains for the game, you didn't change the *truth* of the matter; you changed the *context of assertion*. You created a local rule. This explains why you felt fine enforcing it but didn't believe your choice made it universally true.

  ### Which Verdict Has to Go?

  If you demand logical consistency within classical logic (where every statement must be either True or False), **you must abandon the Tolerance Principle.**

  You must accept that there *is* a specific number *n* where *n* grains are not a pile and *n+1* grains are. This is the view of the philosopher Timothy Williamson. However, he argues we can never *know* where that line is because our ability to measure grains is less precise than the semantic boundary.

  **But you don't have to accept that.** Most modern philosophers of language suggest that what must go is not the Tolerance Principle, but **Bivalence** (the idea that every statement is strictly True or False).

  If you adopt **Degree Theory (Fuzzy Logic)** or **Supervaluationism**, you can keep your intuition that "no single grain makes the difference" by allowing truth to come in degrees.
  *   4 grains: 0% Pile.
  *   500 grains: 50% Pile.
  *   10,000 grains: 100% Pile.
  *   Removing one grain from a 100% pile makes it 99.9% a pile. It is still "a pile" for most purposes, but strictly speaking, its "pile-ness" has decreased.

  ### Predictions for New Cases

  Based on the **Principle of Semantic Indeterminacy with Functional Grounding**, here is what you should expect for the cases you mentioned:

  **1. Is the boundary itself blurry? (Higher-Order Vagueness)**
  **Yes.** You will never find the line where it switches from "definitely a pile" to "kind of a pile." There is a "grey area" around the grey area. If you try to draw a line around the borderline cases, that line will *also* have borderline cases. This matches your feeling that you can't even pinpoint where the uncertainty begins.

  **2. Is a 64-year-old person "old"?**
  This case will split the difference between Sand and Money.
  *   **Like Sand:** "Old" is a linguistic convention. There is no biological switch that flips at 65.
  *   **Like Money:** "Old" tracks biological decay and social roles (retirement, Medicare). These have functional realities.
  *   **Prediction:** You will feel there is **no fact of the matter** biologically (some 64-year-olds are fitter than 50-year-olds), but there may be a **pragmatic fact** institutionally (eligibility for benefits).
  *   **Verdict:** You should treat 64 as a **borderline case** (Supervaluationism). It is neither truly "old" nor "not old" in a biological sense, but you can stipulate it as "old" for retirement policies (Contextualism) without believing nature cares.

  ### Summary Advice for Your Argument

  You are winning the argument by refusing to play by classical logic rules. Your brother is asking for a binary (Yes/No) answer to a gradient reality.

  *   **Tell him:** "The problem isn't my answer; it's the question. 'Pile' is a tool, not a measurement. When we need it to work (the game), I set the tool to 500. When we are just looking at the patio, the tool doesn't apply."
  *   **The Principle:** Vagueness is not ignorance; it is the flexibility of language allowing us to cope with a continuous world.
  *   **The Sacrifice:** Stop trying to force "True" or "False" onto the 500-grain mound. Accept "Indeterminate" as a valid logical status for purely conventional terms, while acknowledging that functionally grounded terms (like "Rich") hide precise facts beneath their vague labels.

  You have intuitively arrived at a **Contextualist Supervaluationist** position. It is a stable, defensible, and highly respected place to stand in the literature. You don't need to find the cutoff; you need to recognize that the demand for one is a category error.
