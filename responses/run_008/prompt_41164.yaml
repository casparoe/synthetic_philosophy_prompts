answer: |-
  **The Scenario**

  A city housing authority must install a mandatory backup generator in a dense apartment complex. Due to zoning constraints, the unit can be placed in only two locations: the central courtyard or the super's private cottage. Both locations are safe, but the vibration and hum will disrupt sleep. Engineering estimates show that in the courtyard, the noise will wake each of the 100 residents for exactly 5 minutes during the night, fragmenting their rest but allowing them to fall back asleep easily. In the cottage, the noise will be concentrated, waking the single superintendent for 120 minutes (2 hours) total, leaving him exhausted for his morning shift. The harm is identical in currency: minutes of sleep lost. The authority must choose where to place the generator.

  **The Philosophical Commitments**

  **(a) Straightforward Aggregation**
  The aggregationist treats minutes of sleep as a uniform commodity, irrespective of who loses them or how the loss is distributed. They calculate the total burden: 100 residents $\times$ 5 minutes equals 500 minutes of lost sleep for the courtyard option, versus 1 superintendent $\times$ 120 minutes for the cottage option. Since 500 is greater than 120, the aggregationist concludes the authority is morally obligated to place the generator in the cottage. The verdict is "cold" because it demands the superintendent sacrifice a night of restorative rest so that 100 neighbors can each avoid a trivial annoyance, treating the superintendent merely as a vessel for minimizing aggregate minutes.

  **(b) The Threshold View**
  This theorist argues that burdens below a certain severity cannot be aggregated to outweigh a burden above that severity. They posit a threshold of moral significance somewhere between 5 minutes and 120 minutes of sleep loss. Five minutes is a nuisance, a "mere irritation" that registers as zero moral weight when weighed against a serious disruption. Because the residents' individual burdens fall below the threshold, they cannot be summed to justify imposing the 120-minute burden on the superintendent. The verdict is "kind" because it protects the individual from a significant harm, refusing to let the collective's minor inconveniences cascade into a major sacrifice for one person.

  **(c) The Contractualist View**
  This position holds that burdens falling on different people cannot be summed against one another at all; justification must be owed to each person individually. The superintendent can reasonably reject the proposal to place the generator in his cottage because it imposes a heavy cost (2 hours of sleep loss) on him to save others from a light cost (5 minutes). The residents cannot reasonably reject the courtyard option, as losing 5 minutes of sleep does not significantly impair their lives. Since the superintendent's objection is stronger than any single resident's, the generator goes to the courtyard. The verdict is "kind" because it prioritizes the person with the strongest individual complaint, regardless of the total sum.

  **Derivation of Verdicts**
  None of these verdicts are stipulated by the scenario's emotional coloring; they are derived strictly from the mathematical and structural constraints. The aggregationist verdict follows inevitably from the inequality $500 > 120$. The threshold verdict follows from the qualitative gap between "annoyance" and "exhaustion" despite the shared currency of time. The contractualist verdict follows from the asymmetry in individual rejectability. The discomfort arises because the arithmetic (500 vs. 120) points one way, while the human experience of those numbers points the other.

  **The Feature Doing the Work**
  The engine of this dilemma is the **non-linearity of disutility**. While the currency (minutes of sleep) is linear, the experience of that currency is not. The 120th minute of sleep loss is exponentially more damaging to well-being than the 5th minute. The thought experiment forces the aggregationist to treat the first 5 minutes of the superintendent's loss as equal to the residents' 5 minutes, ignoring that the superintendent's 120th minute represents exhaustion, whereas the residents' 5th minute represents mere awareness. The case exploits the fact that "minutes" are a poor proxy for "suffering" once a certain duration is crossed.

  **The Crossover Point**
  For the straightforward aggregationist, the verdict flips when the total resident minutes drop below the superintendent's minutes. With the superintendent fixed at 120 minutes and the residents at 5 minutes each, the crossover occurs at **24 residents** ($24 \times 5 = 120$). If the complex had only 23 units, the aggregationist would suddenly agree to spare the superintendent ($115 < 120$). This highlights the fragility of the aggregationist position at human scale: the moral obligation to sacrifice the superintendent vanishes simply because 77 neighbors move away, even though the superintendent's burden remains exactly the same.

  **The Aggregationist's Defense and Persuasiveness**
  A defender of the "cold" aggregationist view would attack the case by insisting that **sleep is sleep**. They would argue that introducing qualitative distinctions (nuisance vs. exhaustion) is subjective bias; objectively, 500 minutes of human rest is preserved in the courtyard scenario, and 120 minutes in the cottage scenario. To prioritize the superintendent is to privilege his minutes over the neighbors', violating the principle of impartiality.

  However, at this **human scale**, that defense is significantly **less persuasive** than it is in the original "torture vs. dust specks" formulation. In the original, the numbers are so astronomical ($10^{100}$) that the reader cannot visualize the sum, forcing them to trust the math. Here, the reader can easily visualize 100 people rolling over in bed versus one man staring at the ceiling for two hours. The small numbers expose the flaw in the currency: we know intuitively that 120 consecutive minutes of wakefulness is not equivalent to twenty-four instances of 5-minute interruptions. By shrinking the scale, the thought experiment strips the aggregationist of the "overwhelming numbers" shield, making their commitment to linear arithmetic appear not just cold, but empirically dubious.
