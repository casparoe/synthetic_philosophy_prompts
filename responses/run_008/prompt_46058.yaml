      *   **Section 1: The Convergence.** Detail how modest foundationalism (contextualist) and moderate infinitism (Klein) look the same in practice (finite citations, defeasibility).
      *   **Section 2: The Divergence (The Challenge Scenario).** What happens when the interlocutor refuses to stop?
