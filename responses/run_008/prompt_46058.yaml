          *   *Foundationalism (Modest/Contextualist):* Basic beliefs are defeasible defaults, halting regress only relative to a challenge.
      *   **Core Question:** Do they collapse into a shared picture (defeasible, context-dependent, asymmetric), or is there a substantive difference remaining?
      *   **Task:** If they come apart, argue for which side gives the *better* account (normative evaluation), not just cataloging differences. Focus on specific friction points (e.g., do merely available reasons do work? What happens when a basic belief is challenged?).

