      *Infinitism:* Warrant is constituted by the endless transmission itself.
      *Critique:* Infinitism fails because "availability" of an infinite chain implies a finite capacity to access an infinite set, which is incoherent without a foundational guarantee of that capacity.
      *Verdict:* Foundationalism wins.

