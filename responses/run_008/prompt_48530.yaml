prompt: |-
  I've spent roughly a decade in the rationalist blogosphere — the Sequences, the open threads, the recurring arguments about base rates and adjustment — so I know the standard lecture on confounding by heart. My problem sits one level up from the lecture, and I can't find it addressed anywhere as a working method rather than as a set of classic illustrations.

  Here is my situation. I'm the only data analyst at a company of about two hundred people that runs subscription web services. Roughly weekly, someone comes to me with a comparison of rates: churn before and after a price change, conversion under the old and new onboarding flows, support tickets per user across two release versions, cancellation rates in a marketing segment versus the general population. Almost every one of these numbers can be computed either aggregated or sliced — by device, plan tier, acquisition channel, week, market — and the slices routinely disagree with the aggregate, sometimes to the point of reversing the sign. I know the name for the reversal; I've seen the admissions-by-department case and the kidney-stone treatment case many times, and there's a well-known interactive illustration of the phenomenon in the community's canon that I could nearly recite. Naming it doesn't help me. My executives don't want a statistics seminar; they want a number to act on, chosen defensibly enough that the decision survives a Monday-morning meeting with someone holding the opposite number.

  What I've pieced together from my reading is that the resolution is causal rather than arithmetic: whether to trust the aggregate or the slices depends on where the slicing variable sits in the causal story — whether it plausibly influences both group membership and the outcome, or sits downstream of the treatment, or of neither. That principle is stated everywhere at the level of textbook examples and almost nowhere as something a working analyst can run on a fresh case in twenty minutes. Slicing can also be gamed: with enough candidate partitions, anyone can find one that flatters their preferred conclusion, and I currently have no principled answer when someone does exactly that.

  So, this is my request. Act as a statistician with a serious grounding in the philosophy of causal inference — someone at home with the distinction between an association measure and an estimate of a causal effect, and with the literature on when a measure is collapsible across a partition and when it is not. Before writing anything, brainstorm: list the candidate distinctions from that literature, and decide which of them must survive the translation into a desk procedure and which can be dropped for my use case. Then produce:

  1. A decision procedure I can actually run on a fresh comparison of rates: an ordered list of questions, each with what counts as a sufficient answer; where the procedure stops and returns "report the aggregate"; where it returns "report the slices"; where it returns "these data do not answer the question being asked"; and where it hands off to me because the question turns on causal background knowledge that no further crunching of these numbers will supply.

  2. An explicit statement of the procedure's limits — in particular, that whether a variable is causally upstream is a substantive judgment the procedure cannot make for me, only prompt me to make and record, and that a rule for choosing among multiple candidate partitions is a stopping rule as much as a truth rule.

  3. Worked applications to three cases: (a) a new onboarding flow that converts better in the aggregate but worse within both the mobile and the desktop segments, because the traffic mix shifted toward mobile during the test; (b) a price change after which total revenue per cohort rose in the aggregate while revenue fell within every plan tier, where the question on the table is whether the change "worked"; (c) a churn comparison in which slicing by device and slicing by acquisition channel give opposite signs, and no one at the company can say with confidence which of those two variables is causally prior. Let case (b) land wherever it honestly lands, even if that's an answer I'd rather not deliver; don't engineer the cases to come out tidy. For each case, also state what the procedure cannot settle.

  Constraints, so that the procedure is realistic rather than aspirational: each call happens under time pressure, typically under half an hour; the stakes are real but bounded — decisions in the tens to low hundreds of thousands of dollars; nobody signs off but me, though my memo can be challenged by anyone with a dashboard and an opinion; and the consumers of my answer have no statistical training and limited patience for caveats, so the procedure's output sentence must be one an executive can repeat in a meeting without mangling it. Where a step is a judgment call dressed up as procedure, say so plainly — I would rather know which parts of my method are taste than believe I have eliminated taste.

  Please think carefully, and work through the brainstorming before committing to the procedure's structure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Experienced rationalist (Sequences, open threads, base rates), data analyst at a mid-sized company (200 people), sole analyst.
      *   **Problem:** Simpson's Paradox/Confounding happens weekly. Executives want *a number* to act on, not a stats lecture. Slicing disagrees with aggregates. P-hacking via slicing is a risk.
      *   **Goal:** A practical, 20-minute decision procedure to decide whether to report aggregate, slices, or "unknown."
      *   **Constraints:** Time pressure (<30 mins), bounded stakes ($10k-$100k), audience has no stats training, output must be a single defensible sentence. Must acknowledge where judgment/taste is required vs. algorithmic.
      *   **Required Output:**
          1.  Brainstorming of causal distinctions (collapsibility, confounders, mediators, colliders).
          2.  A concrete decision procedure (ordered questions, stop conditions).
          3.  Explicit statement of limits (substantive judgment, stopping rules).
          4.  Three worked cases (Onboarding/Mobile-Desktop, Price/Plan Tier, Churn/Device-Channel).
      *   **Tone:** Professional, peer-to-peer (rationalist to rationalist), rigorous but pragmatic, honest about uncertainty.

  2.  **Brainstorming Causal Distinctions (Mental Sandbox):**
      *   *Simpson's Paradox:* Aggregate vs. Conditional association reversal.
      *   *Confounding:* Variable $Z$ causes $X$ (treatment) and $Y$ (outcome). Need to adjust for $Z$. (Backdoor criterion).
      *   *Mediation:* $X$ causes $Z$ causes $Y$. Adjusting for $Z$ blocks the effect. (Frontdoor/Path specific).
      *   *Collider:* $X$ causes $Z$ and $Y$ causes $Z$. Adjusting for $Z$ opens bias.
      *   *Collapsibility:* When does the weighted average of stratum-specific effects equal the aggregate effect? (Non-collapsibility of odds ratios vs. risk differences).
      *   *Effect Modification:* The effect *actually* differs by group (heterogeneity). Not bias, but reality.
      *   *Selection Bias:* Conditioning on a post-treatment variable (survivorship).
      *   *Pre-treatment vs. Post-treatment:* The golden rule of thumb for non-experts.
      *   *Temporal Precedence:* Did the slice exist before the intervention?
      *   *Business Logic:* Is the slice a lever we can pull? (Actionability).

      *Filtering for the "20-minute Desk Procedure":*
      *   *Drop:* Formal collapsibility math (too slow), DAG drawing (too abstract for execs), Frontdoor criterion (too rare/complex), Odds Ratio vs. Risk Difference nuance (usually risk difference/ratio is fine for business metrics).
      *   *Keep:* Pre-treatment vs. Post-treatment distinction (crucial), Temporal order, Business definition of the "unit" of intervention, Stability of slice sizes (composition effect).
      *   *Judgment Call:* Identifying confounders vs. mediators. This cannot be automated. The procedure must force the analyst to *state* the assumption.

  3.  **Developing the Decision Procedure:**
      *   *Goal:* Decide between Aggregate (A), Stratified (S), or Indeterminate (I).
      *   *Step 1: Define the Question.* Is it "What happened?" (Descriptive) or "What will happen if we do X?" (Causal). Usually the latter for execs.
      *   *Step 2: Timing.* Is the slicing variable pre-existing or created by the treatment?
          *   If Post-treatment (Mediator/Collider) -> Don't slice (usually). Report Aggregate.
          *   If Pre-treatment (Confounder/Effect Modifier) -> Proceed to Step 3.
      *   *Step 3: Balance/Composition.* Did the treatment change the mix of the slices? (e.g., Price change drove away cheap users, leaving expensive ones).
          *   If Yes -> Aggregate is biased by composition. Slices are safer *if* pre-treatment.
          *   If No -> Aggregate is likely fine.
      *   *Step 4: Consistency.* Do slices agree with each other?
          *   If Yes -> Report Slices (or Aggregate if similar).
          *   If No (Simpson's) -> Check causal priority.
      *   *Step 5: Actionability.* Can we target the slices?
      *   *Refinement:* Need to make this a flowchart style list of questions.
      *   *Key Insight:* The "One Number" rule. If slices disagree, you can't give one number. You must give the range or the "why". But the prompt asks for a sentence an exec can repeat. So, "The effect is positive for Group A and negative for Group B" is better than "It depends."
      *   *Wait, constraint:* "Output sentence must be one an executive can repeat."
      *   *Revision:* If slices disagree significantly, the answer isn't a number, it's a segmentation strategy. But if forced to choose *the* metric for the whole company:
          *   If Confounder: Weighted Average of Slices (Standardized).
          *   If Mediator: Aggregate.
          *   If Effect Modification: Report Slices (no single number).

      *Let's structure the procedure around the "Pre-Treatment" heuristic.* It's the most robust rule of thumb for non-causal-experts.
      1. Is the slice defined *before* the intervention?
      2. Did the intervention change the *size* of the slices?
      3. Do the slices tell the same story?

  4.  **Drafting the Limits:**
      *   Must admit that "Pre-treatment" is a judgment call.
      *   Must admit that "Significant disagreement" is subjective.
      *   Must admit that unmeasured confounders exist.
      *   The procedure protects against *egregious* errors, not all errors.

  5.  **Working the Cases:**
      *   *Case A (Onboarding/Mobile-Desktop):* Traffic mix shifted. Mobile is harder to convert. New flow attracted more mobile (or test period had more mobile).
          *   Slice (Device) is Pre-treatment.
          *   Mix changed (Composition bias).
          *   Slices agree (both worse). Aggregate lies (better).
          *   *Verdict:* Report Slices. Aggregate is misleading due to composition.
      *   *Case B (Price/Plan Tier):* Revenue up aggregate, down every tier.
          *   Slice (Plan Tier) is Pre-treatment (mostly).
          *   Wait, did users switch tiers? If Price Change *caused* tier switch, Tier is a Mediator.
          *   If Tier is fixed (legacy plans), it's a Confounder.
          *   If Revenue/User rose in aggregate but fell in tiers -> Composition effect (users moved to higher tiers).
          *   *Causal Question:* Did the price change work?
          *   If the goal is Total Revenue: Aggregate is truth.
          *   If the goal is Price Elasticity per product: Slices are truth.
          *   *Honest Landing:* This is likely a mediation case. The price change *worked* by upselling users (changing tiers). So Aggregate is the causal effect of the *policy*. Slices show the effect *holding tier constant*.
          *   *Decision:* Report Aggregate for "Did we make more money?", Report Slices for "Did users hate the price hike?".
          *   *Constraint Check:* Need one sentence. "The policy increased total revenue primarily by shifting users to higher tiers, despite lowering retention within each tier."
      *   *Case C (Churn/Device vs. Channel):* Opposite signs. Unknown causal priority.
          *   Device vs. Channel. Which is confounder?
          *   If we don't know, we can't adjust.
          *   *Verdict:* Indeterminate. Do not act on causal claim. Run an experiment or wait.
          *   *Sentence:* "We cannot determine the cause from this data; the segments contradict."

  6.  **Refining the Tone:**
      *   Avoid "Just run a regression."
      *   Avoid "Draw a DAG."
      *   Use "Rationalist" language (map vs. territory, optimization targets).
      *   Acknowledge the "Sole Analyst" burden (political cover).

  7.  **Final Review against Constraints:**
      *   20 minutes? Yes, the questions are quick.
      *   Exec sentence? Yes, provided in examples.
      *   Brainstorming first? Yes.
      *   Limits stated? Yes.
      *   Case B honest? Yes, distinguishing between "Policy Effect" and "Price Elasticity".

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Suggest standardization (IPW).
      *   *Correction:* Too technical for the "exec sentence" constraint and the 20-minute limit. Stick to "Report the slices" if they disagree and are pre-treatment.
      *   *Initial thought:* Case B is classic Simpson's.
      *   *Correction:* In pricing, tier migration is often the *point* of the change. If I force "Report Slices," I might tell them to revert a profitable change. I need to distinguish "Did the metric move?" (Aggregate) vs "Was the mechanism uniform?" (Slices). The prompt asks if the change "worked". Usually "worked" = "made money". So Aggregate wins *if* tier migration is intended. I need to make the procedure ask: "Is the slice a lever or a bucket?"

      *Revised Plan for Procedure:*
      1.  Is the slice a *bucket* (pre-existing attribute) or a *lever* (outcome of treatment)?
      2.  If Bucket: Did the treatment change the bucket sizes?
      3.  If Bucket sizes changed: Slices are the causal effect *within* bucket; Aggregate is the causal effect *of the policy including migration*.
      4.  If Slices disagree: Which bucket is the strategic target?

      *Actually, keep it simpler.* The user wants to know which number to put on the slide.
      Rule: If Pre-treatment & Composition Shift -> Slices explain, Aggregate predicts.
      If Pre-treatment & No Composition Shift -> Aggregate is fine.
      If Post-treatment -> Aggregate only.

      *Let's finalize the Procedure Steps.*
      1. Temporal Order (Pre/Post).
      2. Composition Shift (Did N change?).
      3. Directional Agreement (Do signs match?).
      4. Strategic Intent (Do we want to move people between slices?).

      *Okay, ready to write.*
answer: |-
  ### Brainstorming: Causal Distinctions vs. Desk Procedures

  To build a 20-minute procedure, we must strip away the formal machinery of causal inference (DAGs, do-calculus, identifiability proofs) and retain the heuristics that map to business reality. Here are the candidate distinctions from the literature, filtered for your constraints:

  1.  **Confounder vs. Mediator vs. Collider:**
      *   *Theory:* Adjust for confounders (common causes); do not adjust for mediators (mechanisms) or colliders (selection bias).
      *   *Desk Translation:* **Pre-treatment vs. Post-treatment.** This is the single most robust heuristic. If the slice existed before the intervention (Device, Region, Legacy Plan), it's a candidate confounder. If the slice was created or altered by the intervention (New Plan Tier, Login Status, Feature Usage), it's a mediator/collider.
      *   *Verdict:* **Keep.** This is the backbone of the procedure.

  2.  **Collapsibility:**
      *   *Theory:* Some measures (Risk Difference) are collapsible; others (Odds Ratio) are not, even without confounding.
      *   *Desk Translation:* Executives care about "Total Revenue" or "Total Churn," which are additive. Non-collapsibility is a technical nuisance for logistic regression coefficients, not for business KPIs.
      *   *Verdict:* **Drop.** Assume we are working with collapsible business metrics (counts, sums, means).

  3.  **Effect Modification (Heterogeneity):**
      *   *Theory:* The causal effect genuinely differs across subgroups.
      *   *Desk Translation:* The slices disagree in magnitude or sign.
      *   *Verdict:* **Keep.** This triggers the "Do not report a single number" flag.

  4.  **Composition Effects (The "Mix"):**
      *   *Theory:* Changes in the weighted average caused by shifts in group sizes ($N$), not group rates ($p$).
      *   *Desk Translation:* Did the intervention change the percentage of users in each slice? (e.g., Price hike drove low-tier users to churn, leaving only high-tier users).
      *   *Verdict:* **Keep.** This distinguishes "The product got better" from "The customers got richer."

  5.  **Selection Bias / Conditioning on a Descendant:**
      *   *Theory:* Conditioning on a variable caused by the treatment induces bias.
      *   *Desk Translation:* Slicing by "Active Users" when the treatment affects Activation.
      *   *Verdict:* **Keep.** Covered under Post-treatment.

  6.  **Unmeasured Confounding:**
      *   *Theory:* There is always a $Z$ you didn't think of.
      *   *Desk Translation:* You can't fix this with a procedure.
      *   *Verdict:* **Acknowledge in Limits.** The procedure prevents *egregious* errors, not all errors.

  ---

  ### 1. The Decision Procedure (The "20-Minute Triage")

  This procedure is designed to output one of four verdicts: **Report Aggregate**, **Report Slices**, **Report Standardized** (weighted average of slices), or **Indeterminate**.

  **Step 1: The Temporal Test (Pre vs. Post)**
  *   **Question:** Did the slicing variable exist *before* the user was exposed to the intervention/change?
  *   **Sufficient Answer:**
      *   *Yes (Pre):* Device, Acquisition Channel, Sign-up Date, Legacy Plan. -> **Go to Step 2.**
      *   *No (Post):* Current Plan Tier (if they can upgrade), Feature Usage, Login Frequency, "Active" status. -> **Stop. Verdict: Report Aggregate.**
      *   *Reasoning:* Slicing by post-treatment variables blocks the causal path you are being paid to measure. If the price change caused users to downgrade, slicing by "New Plan" hides the revenue loss caused by the downgrade.
  *   **Executive Sentence:** "We measure the total impact of the policy, including how it changed user behavior."

  **Step 2: The Composition Test (The Mix)**
  *   **Question:** Did the intervention significantly change the proportion of users in each slice? (e.g., Did the % of Mobile users shift by >5%?)
  *   **Sufficient Answer:**
      *   *No:* The mix is stable. -> **Go to Step 3.**
      *   *Yes:* The mix shifted. -> **Go to Step 3 (but flag composition).**
      *   *Reasoning:* If the mix shifted, the Aggregate number conflates "effect on users" with "change in user types."

  **Step 3: The Agreement Test (Sign & Magnitude)**
  *   **Question:** Do the slices point in the same direction as the Aggregate? (e.g., Is Revenue up in Aggregate, and also up in Mobile and Desktop?)
  *   **Sufficient Answer:**
      *   *Yes (Agreement):* **Stop. Verdict: Report Aggregate.** (Slices can be attached as an appendix, but the Aggregate is the truth of the business outcome).
      *   *No (Reversal/Disagreement):* **Go to Step 4.**
      *   *Reasoning:* If slices agree, the Aggregate is a valid summary. If they disagree, the Aggregate is mathematically misleading (Simpson's Paradox).

  **Step 4: The Strategic Intent Test (Bucket vs. Lever)**
  *   **Question:** Is the slicing variable a **Bucket** (fixed attribute we cannot change, like Device) or a **Lever** (something the business tries to move, like Plan Tier)?
  *   **Sufficient Answer:**
      *   *Bucket (Fixed):* **Stop. Verdict: Report Slices.** (Do not report a single aggregate number).
      *   *Lever (Movable):* **Stop. Verdict: Report Aggregate.**
      *   *Reasoning:*
          *   If it's a **Bucket** (e.g., Mobile vs. Desktop) and they disagree, there is no "true" single number. The effect is heterogeneous. Reporting an aggregate hides that the change breaks the product for one group.
          *   If it's a **Lever** (e.g., Plan Tier) and they disagree (e.g., Revenue down per tier, but Total Revenue up because users moved to higher tiers), the *policy* worked via migration. The Aggregate captures the value of the migration; the Slices capture the price elasticity. For "Did this make money?", Aggregate wins.

  **Step 5: The Priority Test (If multiple Buckets disagree)**
  *   **Question:** If you have two Bucket variables (e.g., Device and Channel) that both show Pre-treatment status but yield opposite signs when sliced, which one is causally prior?
  *   **Sufficient Answer:**
      *   *Clear Priority:* (e.g., Channel determines Device capability). -> **Report Slices of the Prior Variable.**
      *   *Unclear Priority:* -> **Stop. Verdict: Indeterminate.**
      *   *Reasoning:* If you cannot determine the causal order of two confounders, you cannot adjust for them without risking collider bias or residual confounding. Do not recommend action.

  ---

  ### 2. Statement of Limits

  This procedure is a **triage tool**, not a truth machine. It is subject to the following hard limits:

  1.  **The Pre/Post Judgment is Subjective:** The procedure cannot determine if "Plan Tier" is Pre or Post. In a legacy system, it is Pre. In a flexible system, it is Post. You must make this call based on product knowledge. If you guess wrong, the math will be precise but the conclusion wrong.
  2.  **Unmeasured Confounders:** This procedure only handles the slicing variables you *have*. If "User Motivation" drives both selection into a slice and the outcome, and you don't measure it, the Slices are just as biased as the Aggregate. The procedure protects against *arithmetic* deception, not *omitted variable* bias.
  3.  **The "One Number" Constraint:** In Step 4 (Bucket/Disagreement), the honest answer is "It depends on the user." Executives hate this. The procedure forces you to say "Report Slices," which denies them a single KPI. This is a feature, not a bug. It prevents you from signing off on a decision that helps one segment at the expense of another without their knowledge.
  4.  **Stopping Rules are Truth Rules:** Deciding *not* to slice (Step 1) is a causal claim that the variable is a mediator. Deciding *to* slice (Step 4) is a causal claim that the variable is a confounder. The procedure forces you to make the claim explicit, but it cannot validate the claim.

  ---

  ### 3. Worked Applications

  #### Case (a): Onboarding Flow (Mobile vs. Desktop)
  *   **Data:** New flow converts better in Aggregate. Worse in Mobile. Worse in Desktop. Traffic mix shifted toward Mobile during the test.
  *   **Procedure Run:**
      1.  *Temporal:* Device is **Pre-treatment**. (User has phone before onboarding). -> Step 2.
      2.  *Composition:* Mix shifted toward Mobile. -> Step 3.
      3.  *Agreement:* Slices (Worse, Worse) disagree with Aggregate (Better). -> Step 4.
      4.  *Intent:* Device is a **Bucket**. We cannot force users to switch to Desktop to get better conversion.
  *   **Verdict:** **Report Slices.** The Aggregate is a lie driven by composition. The new flow is strictly worse for both user types.
  *   **What is not settled:** Why the mix shifted. (Was it marketing? Seasonality?). But that doesn't change the flow's performance.
  *   **Executive Sentence:** "The new flow reduces conversion for both Mobile and Desktop users; the aggregate gain is solely due to a shift in traffic mix toward higher-converting periods, not the flow itself."
      *   *Correction for the specific scenario:* Wait, if Mobile is usually *lower* converting, and mix shifted *toward* Mobile, the Aggregate should be *lower* unless the Mobile conversion was surprisingly high.
      *   *Re-reading the prompt:* "Converts better in aggregate but worse within both... because traffic mix shifted toward mobile."
      *   *Correction:* If Mobile converts *worse* than Desktop usually, shifting toward Mobile should lower the aggregate. For the Aggregate to rise while slices fall, the mix must have shifted toward the *higher* converting group, or the prompt implies Mobile is the high converter but the new flow hurt it less?
      *   *Standard Simpson's:* Group A (High base rate) shrinks. Group B (Low base rate) grows. Treatment hurts both. Aggregate rises? No, that math doesn't work.
      *   *Let's assume the prompt implies:* Mobile has a *higher* base conversion rate than Desktop. The test period had more Mobile users. The new flow hurt everyone, but the mix shift masked it.
      *   *Verdict stands:* Report Slices.
      *   **Refined Executive Sentence:** "The new flow lowers conversion for every device type; the aggregate increase is an artifact of having more high-converting mobile users during the test week."

  #### Case (b): Price Change (Revenue per Cohort vs. Plan Tier)
  *   **Data:** Total Revenue/Cohort rose in Aggregate. Revenue/Cohort fell in every Plan Tier (Basic, Pro, Enterprise).
  *   **Procedure Run:**
      1.  *Temporal:* Plan Tier is **Ambiguous**. Did the price change force users to downgrade (Post)? Or are these legacy contracts (Pre)?
          *   *Scenario:* Subscription web service. Price changes usually allow grandfathering or force upgrades/downgrades.
          *   *Judgment:* If users stayed on old plans, it's Pre. If users moved to new plans, it's Post. Let's assume users *could* move tiers.
          *   *Decision:* Treat Tier as a **Lever** (Post/Mediator) for the question "Did the price change make money?"
      2.  *Composition:* Did the mix change? Yes, Revenue up Aggregate but down per Tier implies users moved to higher-revenue tiers (Upsell).
      3.  *Agreement:* Slices (Down) disagree with Aggregate (Up). -> Step 4.
      4.  *Intent:* Plan Tier is a **Lever**. The business *wants* to move users to higher tiers.
  *   **Verdict:** **Report Aggregate.** The goal of a price change is usually Total Revenue. If users hated the price (lower revenue per tier) but bought more features (higher tier) to compensate, the policy worked. The Slices show elasticity; the Aggregate shows net outcome.
  *   **Honest Landing:** This is the hard one. If you report Slices, you recommend reverting the price (losing money). If you report Aggregate, you hide that users are unhappy (churn risk).
  *   **Procedure Output:** Report Aggregate for "Financial Success," but attach Slices as "Risk Warning."
  *   **Executive Sentence:** "The price change increased total revenue by successfully upselling users to higher tiers, despite reducing revenue yield within each existing tier."
  *   **What is not settled:** Long-term churn risk. The Aggregate captures immediate revenue; the Slices capture user dissatisfaction which may cause churn in 6 months. The procedure cannot predict the future churn from current dissatisfaction.

  #### Case (c): Churn (Device vs. Acquisition Channel)
  *   **Data:** Slicing by Device says Churn Down (Good). Slicing by Channel says Churn Up (Bad). Aggregate is flat.
  *   **Procedure Run:**
      1.  *Temporal:* Both Device and Channel are **Pre-treatment**. -> Step 2.
      2.  *Composition:* Assume stable. -> Step 3.
      3.  *Agreement:* Slices disagree with each other (Device says Good, Channel says Bad). -> Step 4.
      4.  *Intent:* Both are **Buckets**. We can't force a user to change their Device or their past Ad Channel.
      5.  *Priority:* Which is causally prior?
          *   Does Channel determine Device? (e.g., Instagram ads are mostly Mobile, Search is mostly Desktop).
          *   Does Device determine Channel? (No).
          *   *Company Knowledge:* "No one at the company can say with confidence."
      6.  *Result:* **Step 5 (Unclear Priority).**
  *   **Verdict:** **Indeterminate.**
  *   **Reasoning:** You have two competing confounders. If Channel causes Device selection, slicing by Device opens collider bias or fails to adjust for Channel. If Device causes Channel selection, vice versa. Without knowing the DAG, adjusting for one might induce bias.
  *   **Executive Sentence:** "We cannot determine if churn improved or worsened from this data; the segments contradict and we lack the data to resolve which factor drives the other."
  *   **What is not settled:** The true causal effect. You must recommend an A/B test or wait for more data. Do not sign off on a "Churn is down" memo.

  ### Final Note on "Taste"
  You asked to know where the method is taste. It is in **Step 1 (Pre/Post)** and **Step 4 (Bucket/Lever)**.
  *   Is "Plan Tier" a bucket or a lever? That is a product strategy decision, not a statistical one.
  *   Is "Device" truly pre-treatment? If the new onboarding flow is *only* on Mobile, then Device is part of the treatment.
  *   The procedure forces you to write down your answer to these questions. That written record is your political shield. If you are challenged, you do not defend the math; you defend the classification: *"I treated Plan Tier as a lever because our Q3 OKR is upsell migration."* That moves the argument from statistics (where you are alone) to strategy (where the executives share responsibility).
