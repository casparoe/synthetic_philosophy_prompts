answer: |-
  You have independently reconstructed the single most potent criticism of libertarian entitlement theory: **The Problem of Historical Rectification.**

  Your intuitions are not a mess; they are a coherent, albeit hybrid, moral framework. You are effectively endorsing **Nozick's Entitlement Theory** (justice depends on how holdings were acquired, not on the resulting pattern) while rejecting his **Counterfactual Assumption** (that the actual world approximates a just baseline).

  However, to answer your question directly: **No single principle saves all your verdicts without modification.** There is a tension between your third intuition (the taint fades) and your fifth (the debt is still owed).

  ### The Principle That Captures Most of It
  The framework you are operating under is **Historical Entitlement with Epistemic Decay.**
  1.  **Justice is Historical:** Holdings are just only if acquired justly (Chamberlain/Inheritance).
  2.  **Injustice Persists:** Theft/conquest taints all subsequent holdings (Conquest/Tax as Restitution).
  3.  **Rectification is Obligatory:** The state may take tainted wealth to repay the debt (Tax as Restitution).

  ### The Intuition That Has to Go
  You must sacrifice the moral weight of **Intuition #3: "The taint fades somehow."**

  **Why this one?**
  Because it contradicts **Intuition #5: "Taxing it... feels like... something owed."**

  If the moral taint *fades*, the debt is extinguished. If the debt is extinguished, taxing the wealth *is* robbery, regardless of its origin. You cannot hold that the descendants' claim is morally weaker (fading taint) *and* simultaneously hold that the wealth is still partially owed (restitution).

  *   **If the claim fades morally:** Then the current holders have clean title, and taxing them is unjust (contradicting Intuition 5).
  *   **If the debt is still owed:** Then the title is still tainted, and the descendants' claim is morally full-strength, regardless of time (contradicting Intuition 3).

  **Why sacrifice #3 rather than #5?**
  Because #5 (Restitution) is the only thing preventing your view from collapsing into standard Libertarianism. If you drop the idea that the debt is still owed, you agree with your Nozickian colleague that the current distribution is presumptively just. If you drop the idea that the taint fades *morally*, you preserve the core ethical insight that historical injustice creates present obligations.

  **The Fix:** You must reclassify Intuition #3. The taint does not fade *morally*; it fades **epistemically and pragmatically**.
  *   **Morally:** The debt remains. A stolen right does not become a valid right just because the thief died.
  *   **Pragmatically:** Our ability to trace specific victims to specific perpetrators decays over time. Evidence is lost, populations move, records vanish.

  So, you keep the verdict ("claims seem weaker") but change the justification. It's not that the *injustice* is smaller; it's that the *administrative cost of fixing it* grows higher, and the risk of new errors (taking from the innocent, paying the undeserving) increases. You accept a **Statute of Limitations based on Feasibility, not Morality.**

  ### The Prediction: The Intermarriage Case
  You asked what the surviving principle predicts for a case where descendants of the harmed and the beneficiaries have intermarried, so the tax and the check would partly go to the same households.

  Your surviving principle (Historical Entitlement + Moral Persistence of Debt + Pragmatic Limits) predicts that **individualized reparations become logically incoherent.**

  Here is why:
  1.  **The Identity Problem:** Rectification requires a distinct Payer (beneficiary of injustice) and Payee (victim of injustice). In the intermarriage scenario, the Payer and Payee are the same genetic and legal entities.
  2.  **The Netting Out:** If a household is both 50% beneficiary and 50% victim, a check from the state to that household funded by a tax on that household is a null transaction. It creates administrative cost with zero moral rectification.
  3.  **The Shift to Structuralism:** Because individual title cannot be cleaned via individual transfers in this scenario, the principle predicts that rectification must shift from **Property Restoration** to **Structural Investment**.

  **The Verdict:**
  You cannot write a check to a household that is both the thief and the stolen-from. Therefore, the "tax as restitution" must be spent on **public goods that disproportionately benefit the victimized lineage's *structural position* without requiring individual lineage verification.**

  Examples:
  *   Funding schools in historically redlined districts (benefits the victims' community structure).
  *   Universal healthcare or housing subsidies (benefits the descendants of victims who were systematically denied wealth accumulation, without needing to prove specific theft).

  **Summary:**
  Your gut is right, but your reasoning on the "fading" is the weak link. The debt doesn't rot; our ability to collect it does. And when the lines of thief and victim blur into the same family, the only just solution is to stop trying to balance individual ledgers and start repairing the broken structure those ledgers rest upon.
