prompt: |-
  At a dinner party last weekend, two friends of mine — a philosophy PhD student and a software engineer who reads a lot of ethics — spent over an hour arguing about whether the doctrine of double effect can bear the weight that trolley cases put on it, and they eventually asked me to referee. I couldn't, so I'm asking you. (1) Lena opened by saying the doctrine explains the standard contrast: diverting a runaway trolley onto a side track where it will kill one person is permissible because his death is a merely foreseen side effect, whereas shoving a heavy man off a footbridge to stop the trolley is impermissible because his body is the means of the rescue, and the doctrine prohibits precisely intending harm as a means. (2) Marco countered with the loop variant: suppose the side track curves back onto the main line, so the one person's body is the only thing that stops the trolley before it reaches the five. His body now does exactly the causal work the footbridge man's would, yet intuitions still favor diverting — so either the doctrine misclassifies the case or the intuition is wrong, and neither option is comfortable. (3) Lena replied that what the agent intends in the loop case is just redirecting the trolley onto that track segment, not stopping it with the man's body: she would happily divert onto an empty loop if one existed, and would gladly have the one leap clear if a buffer further along would catch the trolley, whereas no parallel description of the footbridge shove explains why it is performed without invoking the man's being placed in the trolley's path. (4) Marco called this description-relativity the real problem: by Lena's test, a terror bomber can redescribe his act as releasing ordnance above a military target, hoping the civilians near it escape, and thereby render their deaths incidental; if she insists some descriptions are unavailable to the agent, she owes a principled account of the grain at which intentions are individuated, but agents' self-descriptions are manipulable and there is a continuum of cases — factory bombing with foreseen civilian deaths at one end, terror bombing to break morale at the other — with no non-arbitrary place to draw the line. (5) Lena's last word was that the grain problem afflicts every rival too: rights-based views must also say why harms inflicted as means are worse than equal harms merely foreseen, so the difficulty is a cost of the doctrine, not a refutation, and anyway our confidence in the loop intuition is likely contaminated by our verdict in the ordinary switch case, from which it differs only by an invisible detail most people overlook. Please adjudicate each move in turn: who is right at each step, whether Lena's reply in (3) is a substantive distinction or a verbal maneuver, whether the description-relativity charge in (4) defeats the doctrine or merely damages it, and what, if anything, both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A dinner party argument between Lena (Philosophy PhD student, pro-Double Effect) and Marco (Software Engineer/Ethics reader, skeptic of Double Effect).
      *   **Topic:** The Doctrine of Double Effect (DDE) and its ability to handle Trolley Cases (specifically Switch, Footbridge, and Loop).
      *   **Task:** Adjudicate each of the 5 moves in the argument.
      *   **Specific Questions to Answer:**
          *   Who is right at each step?
          *   Is Lena's reply in (3) substantive or verbal?
          *   Does Marco's charge in (4) defeat or merely damage the doctrine?
          *   What are both of them missing?

  2.  **Deconstruct the Argument Moves:**

      *   **Move (1) Lena:** Standard DDE application. Switch = permissible (death foreseen, not intended). Footbridge = impermissible (death intended as means).
          *   *Analysis:* This is the textbook statement of DDE. It accurately reflects the traditional Thomistic/Anscombian formulation.
          *   *Verdict:* Lena is correct on the *statement* of the doctrine and its standard application.

      *   **Move (2) Marco:** The Loop Variant. Side track loops back. One person's body stops the trolley. Causal structure matches Footbridge (body stops trolley), but intuition often matches Switch (permissible to divert).
          *   *Analysis:* This is the "Loop Case" (often attributed to Thomson or Kamm). It challenges the "means vs. side effect" distinction. If the body is physically necessary to stop the trolley, isn't the death intended as a means? If intuitions say "pull the switch," DDE seems to say "don't."
          *   *Verdict:* Marco identifies a genuine and famous counterexample. He is right that this creates tension for DDE.

      *   **Move (3) Lena:** Intentional Description. In Loop, agent intends "divert trolley," not "stop with body." Counterfactual test: Would you do it if the guy jumped? Yes. Would you do it if the track was empty? Yes. In Footbridge, you *need* the man.
          *   *Analysis:* This relies on the "counterfactual test" for intention (often associated with Quinn or Kamm). The claim is that the *structure of agency* differs. In Loop, the obstruction is incidental to the diversion; in Footbridge, the obstruction is the *point* of the push.
          *   *Verdict:* This is the standard DDE defense against the Loop. Is it substantive? It hinges on how we individuate intentions.

      *   **Move (4) Marco:** Description-Relativity / Grain Problem. If agents can redescribe intentions (e.g., Terror Bomber vs. Strategic Bomber), DDE collapses. Terror bomber says "I'm just dropping bombs near them." Need a principled account of intention grain. Continuum problem.
          *   *Analysis:* This is the "closeness problem" or the problem of "redescriptions." If DDE relies on what the agent intends, and agents can manipulate descriptions, the doctrine is unstable. The Terror Bomber example is classic (Quinn).
          *   *Verdict:* This is the strongest philosophical objection to DDE. It attacks the metaphysics of intention required to make DDE work.

      *   **Move (5) Lena:** Tu Quoque / Error Theory. (a) Rights views also struggle with means/foreseen distinction. (b) Loop intuition is contaminated by Switch intuition (psychological error).
          *   *Analysis:* (a) is partially true (consequentialism doesn't care, but deontology does face similar issues). (b) is an error theory about intuitions.
          *   *Verdict:* Defensive maneuver. The "contamination" point is plausible but hard to prove. The "rivals also have problems" point is true but doesn't solve DDE's specific problem.

  3.  **Drafting the Adjudication (Step-by-Step):**

      *   **Move (1):** Lena is right about the *standard formulation*. DDE *does* draw the line there.
      *   **Move (2):** Marco is right. The Loop case is a serious challenge. It exposes the ambiguity in "means."
      *   **Move (3):** This is the crux. Is it verbal? It appeals to the *counterfactual test of intention*. If the agent would act the same without the death, the death isn't intended. In Footbridge, without the death, the act fails. In Loop, without the death (e.g., he jumps), the act (diverting) still happens, even if the rescue fails. *Wait, check that.* In Loop, if he jumps, the trolley continues to the five. So the rescue fails. But the *act of diverting* is complete. In Footbridge, the *act of pushing* is incomplete without the body landing.
          *   *Refinement:* Lena's distinction is substantive *if* one accepts a specific theory of intention (e.g., Quinn's). It's not *merely* verbal, but it relies on a contentious metaphysics of action. I should call it a "substantive theoretical commitment" rather than a verbal trick, but note its fragility.
      *   **Move (4):** Marco's "Description-Relativity" is the "Closeness Problem." Does it defeat DDE? It doesn't refute the *moral principle*, but it undermines the *epistemic/metaphysical applicability*. If we can't determine intention, we can't apply the rule. It damages it severely, perhaps fatally for practical use, but DDE proponents (like Quinn) have responses (intrinsic nature of the act). I should say it damages it significantly but "defeat" might be too strong if one adopts a robust realist view of intention. However, in the context of the debate, it's the strongest point. Let's call it a "severe structural damage" that requires heavy lifting to repair.
      *   **Move (5):** Lena's tu quoque is weak. Just because others have problems doesn't fix DDE. The error theory (contamination) is interesting but speculative. She is mostly defensive here.

  4.  **Synthesizing the "What They Are Missing" Section:**
      *   They are focused on DDE vs. Intuitions.
      *   What's missing?
          *   **Empirical Psychology:** Joshua Greene's dual-process theory. Maybe the intuition itself is the problem, not the theory.
          *   **Alternative Deontology:** Rights-based views that don't rely on intention (e.g., Scanlon's contractualism or simple rights violations).
          *   **The "Doing vs. Allowing" Distinction:** Maybe it's not about intention, but about active intervention vs. passive allowance.
          *   **The Role of Contact:** Footbridge involves personal force; Switch/Loop do not. (Greene again).
          *   **Kamm's Principles:** The Principle of Permissible Harm.
      *   *Selection:* Focus on the shift from *intention* to *mechanism* (personal force/contact) and the empirical challenge to the intuitions themselves. Also, mention that DDE is often a *proxy* for a deeper deontological constraint that might be better formulated differently.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but balanced (like a referee).
      *   Clear structure addressing each numbered point.
      *   Direct answers to the specific prompts (substantive vs. verbal, defeat vs. damage).

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Check on Move 3:* Is Lena's counterfactual test accurate? In the Loop, if the man jumps, the trolley hits the five. The agent *needs* the man to stay to save the five. So isn't the man's presence intended as a means?
      *   *Correction:* Quinn's distinction is key here. In Loop, the *diversion* is the act. The stopping is a consequence. In Footbridge, the *impact* is the act. Lena is relying on the idea that in Loop, the causal path goes through the track switch first, then the body. In Footbridge, the causal path goes through the body immediately. This is the "pre-emptive" vs. "constitutive" distinction. I need to make sure I explain *why* Lena might be right theoretically, even if intuitively shaky.
      *   *Check on Move 4:* Does the Terror Bomber analogy hold? Yes, it's the standard objection. The "Strategic Bomber" (Quinn's example) bombs a factory, knows workers die. Terror Bomber bombs workers to scare factory. DDE says Strategic is okay, Terror is not. Marco says they can describe acts similarly. This is the "Closeness Problem."
      *   *Check on Move 5:* Lena says rights views have the same problem. Actually, strict rights views (e.g., Nozick) might say "don't violate rights" regardless of intention. But most deontologists care about intention. Her point is that *any* non-consequentialist view struggles with the Switch/Footbridge gap. This is fair.

  7.  **Final Polish:** Organize into clear sections: Move-by-Move Adjudication, The Core Disputes (3 & 4), and The Blind Spot. Ensure the distinction between "verbal" and "substantive" is clear. (It's substantive because it relies on a theory of action, not just synonyms).

  8.  *(Final thought before generating)*: Make sure to explicitly answer the prompt's specific questions within the flow.
      *   Who is right at each step?
      *   (3) Substantive or verbal?
      *   (4) Defeats or damages?
      *   What are they missing?

