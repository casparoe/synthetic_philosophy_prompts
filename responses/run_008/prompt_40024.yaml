      *   **Marcus's Core Claim:** Moral testimony is analogous to expert testimony (like a lawyer). The sister was epistemically compromised (exhausted/manipulated), so she needed an external clear view. She did the work to understand *why* (not just blind deference).
      *   **The Specific Moves:**
          1.  Talia: Ownership/Agency argument.
          2.  Marcus: Expertise analogy (Lawyer).
          3.  Talia: Aesthetic analogy (Film Critic) + Moral Growth argument.
