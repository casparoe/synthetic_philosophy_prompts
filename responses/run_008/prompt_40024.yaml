          5.  Talia: Distinction between "distorted judgment" cure vs. "deference," and the "2am guilt" problem (borrowed conclusions don't reassure).

  3.  **Philosophical Context (Moral Testimony):**
      *   *Pessimism:* (Talia's side) Moral knowledge requires understanding the reasons, not just the conclusion. Deferring undermines moral worth/autonomy. (Thinkers: Kant, Hills, maybe some virtue ethicists).
      *   *Optimism:* (Marcus's side) Moral facts are like other facts. If someone knows better, trusting them is rational. (Thinkers: Jones, Lackey).
      *   *Nuance:* The "Understanding" view (Hills). You need to grasp the *reasons*, not just the verdict.

  4.  **Evaluate Each Move:**

      *   **Move 1 (Talia - Ownership):** Strong point on *integration*. A decision isn't sustainable if it's not internalized. Weakness: Assumes she *didn't* internalize it, just that she started with testimony.
      *   **Move 2 (Marcus - Lawyer):** Good analogy for *action*, bad analogy for *value*. Hiring a lawyer is instrumental; cutting off family is constitutive of who you are.
      *   **Move 3 (Talia - Film Critic):** This is the crux. Is morality like aesthetics? If you cry because a critic said to, is it real? It highlights the *source* of the motivation. Strong point on moral development.
