          *   *Defense A (She understood why):* Counters the "blind deference" claim.
          *   *Defense B (Heatstroke):* Counters the "she should have decided alone" claim.
          *   *Are they distinct?* Yes. One is about epistemic status (she gets it), one is about capacity (she couldn't have gotten there alone).
      *   **Move 5 (Talia - 2am Guilt):** Very strong psychological point. External validation doesn't stop internal shame. Distinguishes between "I was right" and "Ruth said I was right."

  5.  **Synthesize and Rate:**

      *   *Talia:* Wins on the *long-term sustainability* and *moral psychology* front.
      *   *Marcus:* Wins on the *immediate necessity* and *epistemic reality* front (she was manipulated).
      *   *The Verdict:* It's not binary. The sister used Ruth as a *scaffold*, not a crutch (hopefully).

