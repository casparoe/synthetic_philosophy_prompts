answer: |-
  You have hit on one of the most persistent and sophisticated objections in the philosophy of promising. Your intuition is sharp: if normative powers (like the power to consent or promise) require a background framework to be intelligible, how are they fundamentally different from conventions?

  This is often called the **"Reductionism" debate**. The Practice theorist says promises reduce to social conventions. The Normative Power theorist says they do not.

  Here is how to untangle the taxonomy, why the distinction survives your objection, and how to handle the "superstition" edge case.

  ### 1. The Real Disagreement: Source vs. Enabling Condition

  The disagreement isn't about whether background norms exist. Both sides agree that for a promise to be *intelligible*, there must be some normative structure. The disagreement is about **where the specific obligation comes from.**

  *   **The Practice View (Hume, Rawls):** The obligation is **imported**.
      *   Think of a social practice like a game of chess. The reason you cannot move your Rook diagonally is not because you *willed* it; it's because the *practice* dictates it.
      *   When you promise, you are stepping into a pre-existing social institution. The obligation exists because the *institution* is useful and requires stability. Your act of promising is merely the trigger that activates the pre-existing rule.
      *   **Direction:** Society/Practice $\rightarrow$ Individual.

  *   **The Normative Power View (Kant, Penelhum, Shiffrin):** The obligation is **created**.
      *   Think of a legislature. A parliament has the *power* to make laws because of a Constitution (the background framework). But the *specific law* (e.g., "Speed limit 55") exists only because the legislators *willed* it.
      *   The background norms make the power *possible*, but they do not determine the *content* of the obligation. You, the agent, determine the content by exercising your autonomy.
      *   **Direction:** Individual Will $\rightarrow$ Normative Realm.

  **Answering your objection:** You asked, *"If consent only works because there are norms governing consent, isn't that a convention too?"*
  The Power theorist replies: "The *capacity* to consent might be grounded in norms (or nature), but the *obligation* is not. The norms are the **enabling condition**, not the **source**."

  ### 2. Natural vs. Artificial Powers (The Kantian Move)

  To fully escape the "it's all convention" charge, many Normative Power theorists make a stronger claim than the one above. They argue that the power to promise is **natural**, not artificial.

  *   **Hume (Practice):** The power to promise is an *artificial virtue*. Without human convention, saying "I promise" is just making noise. It has no moral weight.
  *   **Kant (Power):** The power to promise is inherent to **rational agency**. To be a free agent is to have the capacity to bind your future self. The social practice is just the *recognition* of this pre-existing moral power, not the *source* of it.

  If you are a Kantian Power theorist, your objection dissolves. You would say consent works *not* because there are social norms, but because it is a requirement of respecting persons as autonomous ends-in-themselves.

  ### 3. The "Superstition" Test Case

  Now, let's apply this to your edge case: *Two people promise each other something, but both think promising is superstition.*

  **The Practice Theorist (Hume/Rawls):**
  *   **Verdict:** **No Obligation.**
  *   **Reasoning:** Promising is a move within a social game. If both players deny the rules of the game (thinking them superstitious), they are not actually playing. They are just making noises. Since the obligation comes from the social utility of the practice, and they are not participating in that practice, no obligation is generated.
  *   **Analogy:** If we move chess pieces but both think the pieces are magical talismans rather than game pieces, we aren't playing chess.

  **The Normative Power Theorist:**
  *   **Verdict:** **It Depends (but likely No Obligation, for a different reason).**
  *   **Reasoning:** This is where the "Magic" charge comes in. A sophisticated Power theorist (like Seana Shiffrin or Joseph Raz) will say you cannot exercise a normative power unless you **intend** to exercise it.
      *   If I say "I promise" but I think I am casting a spell, I have not *intended* to undertake a moral obligation; I intended to invoke magic. Therefore, I failed to exercise the normative power.
      *   **However,** if I say "I promise" and I intend "I am hereby morally binding myself to you," but I mistakenly believe *society* thinks this is superstition... **then I am bound.**
  *   **Why it's not Magic:** It's not magic because the obligation doesn't come from the air; it comes from the **authority of your own will**. If you have the capacity (which you do, as a rational agent) and you intend to use it (to bind yourself), you have done so. The fact that you have weird beliefs about what *other people* think doesn't negate your own authority over your own will.

  ### 4. Why This Matters (The Stakes)

  Why should you care which view is right? It changes the outcome in three critical areas:

  **A. Private Promises**
  *   **Practice:** If I make a promise in a vacuum (e.g., to a dying person on a desert island, where no social practice can be sustained or enforced), the Practice theorist struggles to explain why I'm bound. The social utility is zero.
  *   **Power:** I am bound because I exercised my autonomy. The audience doesn't matter; the commitment does.

  **B. The "Death" of a Practice**
  *   **Practice:** If society stops believing in promising (it becomes "superstition" for everyone), promises stop binding.
  *   **Power:** Even if society collapses, rational agents can still bind themselves to one another. The moral power survives the social convention.

  **C. Waiving Rights**
  *   **Practice:** You can only waive rights if the practice allows it.
  *   **Power:** You own your rights. You can waive them because they are yours, provided you don't violate the rights of others. This is crucial for contract law and consent theory (e.g., sexual consent, medical consent). If consent is just a convention, the state could arguably override it for "social utility." If consent is a normative power, the state *cannot* override it without violating your autonomy.

  ### Summary for your Seminar

  When you discuss this, frame the disagreement as **Direction of Fit**:

  1.  **Convention/Practice:** The rule binds me because **the practice exists**. (I am subject to the institution).
  2.  **Normative Power:** The rule binds me because **I willed it**. (The institution is subject to my agency).

  Regarding your "Magic" worry: The Power theorist avoids magic by insisting on **Intentionality**. You can't accidentally exercise a normative power. If the two superstitious promisors don't *intend* to create a moral bond (because they think it's magic), they haven't exercised the power. But if they *do* intend to bind themselves, the Power theorist says they succeed, regardless of social opinion, because the source of the bond is their own agency, not social validation.

  **Recommended Reading to clear the fog:**
  *   **Hume:** *A Treatise of Human Nature* (On the Artificial Virtues).
  *   **Rawls:** "Two Concepts of Rules" (The classic Practice view).
  *   **Seana Shiffrin:** "Promising, Intimate Relationships, and Conventionalism" (A modern defense of the Power view that addresses your exact worry).
  *   **T.M. Scanlon:** *What We Owe to Each Other* (He tries to bridge the gap with the "Principle of Fidelity," but leans towards a hybrid).
