prompt: |-
  I'm taking an ethics seminar on promises and contracts and I keep getting tangled up in the taxonomy of views about why promises bind. As I understand it there's roughly two families: (1) convention/practice views, where the bindingness comes from there being a shared social practice of promising (going back to Hume's artificial virtue idea, and stuff like Rawls's practice conception of rules), and (2) normative power views, where the bindingness comes from something like your ability to impose an obligation on yourself just by willing it, the way consenting is supposed to change what rights you have. But if consent only works because there are norms governing consent, isn't that a convention too?? Can you explain what the actual disagreement between these views is supposed to be, and why it matters for edge cases like two people promising eachother something when both of them think promising is basically superstition — is the normative power person committed to saying it still binds, and if so, why doesn't that just seem like magic?
