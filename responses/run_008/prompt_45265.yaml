  1. You must reject premise (3), which illicitly slides from the genic ledger being a complete *record* of change to it being the complete *cause* of change. The phrase "leaves nothing for higher levels to do" conflates accounting for the outcome with identifying the causal mechanism that produced it.

  2. This step seduces because it appeals to a reductionist intuition that the lowest common denominator must be the most fundamental cause, much like assuming particle physics explains biology better than physiology. It feels rigorous to track the only thing that persists across generations, obscuring the fact that persistence is a consequence of selection, not necessarily its target.

  3. Your parity argument is largely fair regarding descriptive completeness, though it slightly underplays the asymmetry that genes are replicators while organisms are vehicles. However, this asymmetry makes genes the unit of *inheritance*, not necessarily the sole unit of *selection*, which acts on the vehicle's phenotype.

  4. Rejecting this costs you the comfort of a single universal unit, forcing acceptance of multi-level selection where context determines the dominant level. Your housemate can salvage a causal version only by retreating to the claim that genes are the ultimate *beneficiaries*, which is tautological, rather than the exclusive *agents* of selection.

  5. He will argue that only genes possess the fidelity required for cumulative evolution, making them the only viable long-term units. You counter that fidelity enables inheritance, but differential survival of organisms determines which genes are inherited, so the organism remains the primary unit of interaction.
