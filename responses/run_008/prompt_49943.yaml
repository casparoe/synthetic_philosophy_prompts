answer: |-
  Here is the breakdown of your friend's claims. You were right to feel that something was off; while the math of the setup is correct, the philosophical interpretation conflates several distinct debates (CDT vs. FDT, Halfer vs. Thirder, Planning vs. Action) in a way that overstates the case for precommitment.

  ### Claim-by-Claim Fact-Check

  **1. The Setup and Payoffs**
  *   **Claim:** Exit 1 = 0, Exit 2 = 4, Continue = 1.
  *   **Verdict:** **Correct.**
  *   **Detail:** This is the standard Piccione & Rubinstein (1997) formulation.
  *   **Confidence:** 100%

  **2. The Planning-Optimal Strategy**
  *   **Claim:** Precommit to going straight with probability 2/3; Expected Payoff 4/3.
  *   **Verdict:** **Correct.**
  *   **Detail:** Maximizing $E = 4p(1-p) + 1p^2$ yields $p=2/3$. This is the "planning self" optimum.
  *   **Confidence:** 100%

  **3. The Sleeping Beauty Connection & Credence = 1/2**
  *   **Claim:** "The correct credence that 'this is the first one' is 1/2."
  *   **Verdict:** **Subtly Wrong.**
  *   **Detail:** This is the most technical error in your friend's story. In the Absent-Minded Driver (AMD) problem, your credence of being at the first intersection *depends on your strategy*. If you plan to continue with probability $p$, the probability you are at the first intersection upon arrival is $1/(1+p)$.
      *   If you play the optimal $p=2/3$, your credence should be **3/5**, not 1/2.
      *   Your friend is importing the "Halfer" position from Sleeping Beauty. While Halferism is a valid stance in SB, applying it rigidly to AMD breaks the time-consistency required to solve the problem without precommitment. The "Thirder" style calculation (where credence updates based on the strategy) is what allows the action-time decision to match the planning-time decision. By insisting credence is 1/2, your friend creates the inconsistency they claim is unavoidable.
  *   **Confidence:** 95%

  **4. The "Naive Recalculating Driver"**
  *   **Claim:** "Naive recalculating driver ends up with nothing."
  *   **Verdict:** **Mostly Right.**
  *   **Detail:** This refers to **Dynamic Inconsistency**. A CDT agent at the intersection treats the decision at *this* node as causally independent from the decision at the *other* identical node (because they can't distinguish them).
      *   At the intersection, if you assume you might be at the second exit, Exiting looks attractive (4 vs 1).
      *   If you decide "Exit" is optimal now, you must also decide "Exit" is optimal at the first intersection (since they look identical).
      *   Result: You exit at the first intersection. Payoff = 0.
      *   *Nuance:* This assumes the "naive" driver doesn't account for the logical correlation between their current decision and their future/other-self's decision.
  *   **Confidence:** 90%

  **5. The Conclusion (CDT Refuted, Precommitment Mandatory)**
  *   **Claim:** "Refutation of CDT... rational agent needs updateless-style precommitment."
  *   **Verdict:** **Mixed / Overstated.**
  *   **Detail:**
      *   **"CDT Refuted":** Too strong. It's a known limitation/anomaly for CDT, not necessarily a full refutation (CDT can be patched with "evidential" tweaks or by modeling the nodes as logically linked).
      *   **"Precommitment Mandatory":** **False.** This is the big overreach. A rational agent using **Functional Decision Theory (FDT)** or **Evidential Decision Theory (EDT)** does *not* need external precommitment. They recognize that choosing "Continue" here *is* choosing "Continue" at the other identical node. They achieve the 4/3 payoff naturally by optimizing the *policy*, not the action. Your friend is assuming "Rational Agent" = "CDT Agent."
  *   **Confidence:** 90%

  ### Validating Your Suspicion
  You recalled: *"there being some result where the strategy you'd pick acting at the intersection and the strategy you'd pick in advance actually line up under a certain belief."*

  **You are correct.** This is the **Consistent Beliefs** solution (often associated with the Thirder view in AMD). If the driver calculates their credence as $1/(1+p)$ rather than fixed at 1/2, the expected utility maximization *at the intersection* yields $p=2/3$, which matches the *planning stage* optimization. This resolves the dynamic inconsistency without requiring external precommitment, provided the decision theory allows credences to depend on the strategy (which CDT typically resists, but FDT/EDT embrace).

  ### Confidence Summary
  *   **Setup/Math:** 100%
  *   **Credence Claim (1/2):** 95% (Confident this is the technical error)
  *   **Naive Driver Outcome:** 90%
  *   **Conclusion (Precommitment):** 90% (Confident FDT solves this without binding)

  ### The One Point I'm Least Sure About
  **The strength of the "Refutation of CDT" claim.**
  I am 85% confident here. While AMD is a classic counterexample to standard CDT formulations, some philosophers argue CDT can be saved by refining how it handles "imperfect recall" or by treating the decision as a causal intervention on the *algorithm* rather than the *action*. Whether this counts as a "refutation" or just a "boundary condition" is a matter of philosophical definition rather than math. I'd bet against your friend that it's a fatal refutation, but I wouldn't bet the house on the terminology.

  ### How to Repeat This Without Embarrassment
  If you recount this, the safest and most accurate summary is:
  > "The math on the payoffs and the 2/3 strategy is right. But the claim that credence must be 1/2 is contested—that's a Halfer view that actually breaks the solution. If you use Thirder-style credences (3/5), the action-time and planning-time strategies align. Also, precommitment isn't mandatory for *all* rational agents, only for CDT agents; FDT agents solve it by recognizing the logical correlation between intersections."
