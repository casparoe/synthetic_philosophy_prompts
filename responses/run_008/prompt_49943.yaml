  Parts of that felt off to me but I couldn't say exactly where. Like the Sleeping Beauty bit — isn't halfers vs thirders still an open fight, and does the driver problem really turn on a fixed credence of 1/2? And the "naive recalculating driver ends up with nothing" — I vaguely remember there being some result where the strategy you'd pick acting at the intersection and the strategy you'd pick in advance actually line up under a certain belief, which would undercut his whole "recalculating = disaster" story. But honestly I don't trust my memory of the details here.

