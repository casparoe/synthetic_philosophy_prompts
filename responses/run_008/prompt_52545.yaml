prompt: |-
  I'm a high school junior enrolled in AP United States History, and my teacher has been preparing us for a seminar on the debate over annexing the Philippines after the Spanish-American War — the Treaty of Paris at the end of 1898, the arguments in the Senate over ratification, the Anti-Imperialist League with figures like Mark Twain and Andrew Carnegie on one side, and orators like Senator Albert Beveridge on the other. My friends keep insisting that the whole debate was really just about markets and racial hierarchy, and I don't think they're exactly wrong, but our teacher wants us to work through a specific conceptual lens: American exceptionalism, understood in three registers at once — as a historical thesis (that the United States was founded on universal principles rather than blood and soil, making it a genuinely new kind of state), as a normative claim (that America therefore has special obligations and must not behave like the Old World empires), and as an ideology (a flexible justification for whatever America happens to want to do). What struck me when reading the primary sources is that both sides in 1898 and 1899 seem to argue from exceptionalism: the imperialists said America was so uniquely capable and benevolent that governing the Philippines without absorbing it as a state was precisely what a new kind of power should do, while the anti-imperialists said annexation would make America exactly like the European empires and thereby destroy whatever was distinctive about it. That symmetry makes me suspect the concept is doing less analytical work than it appears to.

  So here is what I would like you to do. Analyze the annexation debate as a test case for American exceptionalism, keeping the three versions distinct rather than letting them blur together. Map the main positions onto them: which speakers were invoking the historical thesis, which the normative claim, and which the ideological version, and did the same person slide from one to another when the argument needed it — for instance, from "America is different from empires" to "America is so different that its empire won't really be an empire"? Then tell me honestly where the framework breaks: what about the debate, and about what followed (the brutal war in the Philippines itself, the Insular Cases and the invented status of "unincorporated territory"), does exceptionalism fail to explain or actively misdescribe? Finally, give me a verdict on whether the episode confirms exceptionalism as a useful interpretive lens or instead exposes it as close to unfalsifiable — an idea that can rationalize any American action, including its opposite, by redescribing it as consistent with American uniqueness. If my friends' economic and racial explanations do work where exceptionalism doesn't, say so plainly. Please write the analysis as a structured essay in American English, at a level I can defend in seminar, and resist the urge to be diplomatic — if one of the three versions of exceptionalism survives the episode better than the others, I want to know which one and why.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **User:** High school junior in AP US History.
      *   **Topic:** Debate over annexing the Philippines (1898-1899), Treaty of Paris, Senate ratification, Anti-Imperialist League vs. Imperialists (Beveridge, etc.).
      *   **Core Concept:** American Exceptionalism (AE) in three registers:
          1.  *Historical Thesis:* US founded on universal principles (creed), not blood/soil.
          2.  *Normative Claim:* US has special obligations *not* to act like Old World empires.
          3.  *Ideology:* Flexible justification for whatever the US wants to do.
      *   **Task:** Analyze the debate using these three distinct registers. Map positions to them. Identify slippage between registers. Evaluate where the framework breaks (Philippine-American War, Insular Cases). Give a verdict on AE's utility vs. unfalsifiability. Address friends' economic/racial arguments.
      *   **Tone/Style:** Structured essay, American English, AP seminar level (sophisticated but accessible), honest/critical (resist diplomacy), clear verdict.

  2.  **Deconstruct the Three Registers of Exceptionalism:**
      *   *Historical:* "We are different by origin." (Lincoln's "proposition," distinct from European monarchies).
      *   *Normative:* "We must act differently." (Restraint, anti-colonialism, self-determination).
      *   *Ideological:* "We are exceptional, therefore whatever we do is right." (Missionary diplomacy, civilizing burden).

  3.  **Map the Historical Debate (1898-1899):**
      *   *Imperialists (Beveridge, McKinley, Roosevelt):*
          *   Argument: We must take the Philippines to civilize/Christianize (even though many were Catholic) and secure markets.
          *   AE Usage: Primarily *Ideological*. "We are chosen to uplift." Also *Historical* twisted: "Our capacity for self-government makes us fit to govern others."
          *   Slippage: From "We don't conquer" to "We conquer for *their* good, which only *we* can do."
      *   *Anti-Imperialists (Bryan, Carnegie, Twain, Boutwell):*
          *   Argument: Annexation violates Consent of the Governed (Declaration of Independence).
          *   AE Usage: Primarily *Normative*. "If we do this, we become Britain/Spain."
          *   Slippage: Sometimes rely on *Historical* ("Our founders forbade this") to bolster the *Normative*.
      *   *The Symmetry:* Both claim the mantle of "True America."

  4.  **Analyze the Breakdown (War & Law):**
      *   *Philippine-American War:* Brutality (water cure, reconcentration).
          *   AE Failure: Hard to square "benevolent assimilation" with scorched earth. Requires heavy *Ideological* lifting ("They are savages, we are civilized").
      *   *Insular Cases (1901):* "Unincorporated Territory."
          *   AE Failure: The Constitution follows the flag... but not all the way. This creates a legal caste system.
          *   This exposes the *Historical Thesis* as false (we *are* becoming an empire of subject peoples) and the *Normative Claim* as abandoned. Only the *Ideological* version survives to justify it.

  5.  **Evaluate the Framework (Verdict):**
      *   Is AE useful? It explains the *rhetoric*.
      *   Is it unfalsifiable? Yes, because of the slippage between registers. When Normative fails, switch to Ideological.
      *   Friends' Argument (Markets/Race):
          *   *Markets:* Explains *why* the elite wanted it (Open Door, China trade).
          *   *Race:* Explains *how* they justified the brutality (Social Darwinism, "White Man's Burden").
          *   *Comparison:* AE is the *language*; Race/Economics are the *drivers*. AE is the software; Race/Economics are the hardware. The friends are arguably more materially accurate, but AE explains the *specific American form* the argument took.
      *   *Survival:* The *Ideological* version survives best. The *Historical* and *Normative* versions crumble under the weight of the Insular Cases.

  6.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and punchy. "The Chameleon of Empire."
      *   **Introduction:** Define the three registers. State the thesis: AE functioned less as a coherent philosophy and more as a rhetorical toolkit, with the Ideological register swallowing the others.
      *   **Body Paragraph 1: The Imperialist Pivot.** Focus on Beveridge. Show how he uses Historical (we are capable) to justify Ideological (therefore we rule). Note the slippage.
      *   **Body Paragraph 2: The Anti-Imperialist Defense.** Focus on Carnegie/Twain. They cling to the Normative. They fear contamination.
      *   **Body Paragraph 3: The Breakdown (War & Law).** The Insular Cases are the smoking gun. "Unincorporated territory" admits that the Historical Thesis (universal principles) doesn't apply to everyone.
      *   **Body Paragraph 4: The Verdict on Exceptionalism.** Is it unfalsifiable? Yes. It's a "God term."
      *   **Body Paragraph 5: Friends' Critique.** Validate the economic/racial argument. AE masks these material interests.
      *   **Conclusion:** Final verdict. The Ideological register wins, but at the cost of the concept's analytical honesty.

  7.  **Refining the Tone:**
      *   Ensure it sounds like a smart high school junior/college freshman level (AP US History context). Not too jargon-heavy, but precise.
      *   Avoid "on the one hand, on the other hand" neutrality. Take a stance as requested.
      *   Check definitions: Ensure the three registers remain distinct throughout the analysis.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish the three registers clearly? *Adjustment:* Make sure to explicitly label them in the text (e.g., "Here, Beveridge shifts from the historical thesis to the ideological register").
      *   *Check:* Did I address the Insular Cases? *Adjustment:* Ensure this is a key piece of evidence for the framework breaking.
      *   *Check:* Did I answer the friends' point? *Adjustment:* Make sure to explicitly state that race and economics explain the *motivation* better than AE explains the *reality*.
      *   *Check:* Is the verdict clear? *Adjustment:* Conclude that AE is analytically weak because it is unfalsifiable, but historically significant as rhetoric.

  9.  **Final Polish:** Check for flow, American English spelling/grammar, and seminar-ready sophistication. (e.g., using terms like "retrofitting," "ex post facto," "teleological").

  *(Self-Correction Note)*: I need to be careful not to dismiss AE entirely. It *did* structure the debate. Even the anti-imperialists used it. The point is that its *analytical* value is low because it's too flexible. I will argue that the *Ideological* register is the only one that survives intact, which proves the friends' point that it's mostly justification.

  10. **Final Output Generation** (Proceed to write the essay based on these thoughts).
answer: |-
  **The Chameleon of Empire: American Exceptionalism in the Philippine Annexation Debate**

  The debate over the annexation of the Philippines following the Spanish-American War is often taught as a clash between idealism and realpolitik. However, when viewed through the lens of American exceptionalism, it reveals something more complex: a struggle over who owned the definition of "America" itself. To analyze this effectively, we must keep distinct the three registers of exceptionalism you outlined: the *historical thesis* (the U.S. is structurally unique, founded on creed rather than ethnicity), the *normative claim* (the U.S. has a moral obligation to refrain from Old World imperialism), and the *ideological version* (the U.S. is uniquely destined to expand, making its actions inherently righteous).

  When we map the 1898–1899 debate onto these registers, a clear pattern emerges. The framework of American exceptionalism did not constrain American action; rather, it provided a flexible vocabulary that allowed opposing sides to claim the same moral high ground. Ultimately, the episode exposes American exceptionalism not as a coherent philosophy, but as an unfalsifiable rhetorical tool. The *ideological* register survives the debate intact, while the *historical* and *normative* registers collapse under the weight of the Insular Cases and the Philippine-American War. Your friends are largely correct: where exceptionalism fails to explain material reality, economic interest and racial hierarchy provide the actual mechanics of empire.

  **The Imperialist Pivot: From History to Ideology**

  The imperialist argument, best articulated by Senator Albert Beveridge in his famous "March of the Flag" speech (1898), demonstrates the most aggressive slippage between the three registers. Beveridge began with the *historical thesis*, arguing that the American people possessed a unique genius for self-government that distinguished them from the decadent monarchies of Europe. However, he immediately pivoted to the *ideological* register to justify annexation. He argued that this unique capacity did not require the U.S. to refrain from empire, but rather qualified it to manage one.

  This is the critical rhetorical slide: "America is different from empires" became "America is so different that its empire won't really be an empire." Beveridge claimed that because American motives were benevolent and divinely ordained, the acquisition of subject peoples without their consent was not a violation of the *historical thesis*, but a fulfillment of it. By framing expansion as a duty to "civilize" and "Christianize" (despite the Philippines being predominantly Catholic), imperialists used the *ideological* register to override the *normative claim*. They argued that the obligation to spread liberty justified suspending liberty in the short term. This allowed them to annex territory without the intent of statehood, a move that would have been unintelligible without the flexibility of exceptionalist ideology.

  **The Anti-Imperialist Defense: Clinging to the Normative**

  Conversely, the Anti-Imperialist League, including figures like Andrew Carnegie, George Boutwell, and Mark Twain, anchored their argument almost exclusively in the *normative claim*. They insisted that the distinctiveness of the American experiment lay in its rejection of conquest. For them, the *historical thesis* was a warning, not a weapon. They argued that if the U.S. held colonies against the will of the inhabitants, it would cease to be a republic and become just another European empire, thereby destroying its unique identity.

  Mark Twain's satire, particularly in *To the Person Sitting in Darkness* (1901), attacked the *ideological* register directly. He exposed the "Blessings-of-Civilization Trust" as a sham, arguing that the language of exceptionalism was merely a cover for looting. However, the anti-imperialists struggled because they were fighting a defensive battle against a malleable concept. They could not effectively counter the imperialist claim that American rule was "different" without conceding that American power was indeed expanding. Their reliance on the *normative claim* assumed that American leaders felt bound by consistency. When the McKinley administration demonstrated that they felt bound only by the *ideological* register (the right to do what is necessary for "destiny"), the anti-imperialist argument lost its leverage in the Senate.

  **The Breakdown: War and the Insular Cases**

  The true test of any conceptual framework is whether it can withstand contradictions. American exceptionalism fails this test when confronted with the brutality of the Philippine-American War (1899–1902) and the legal architecture of the *Insular Cases* (1901).

  During the war, the U.S. military employed reconcentration camps and torture (the "water cure") to suppress Filipino insurgents. These actions were indistinguishable from the tactics used by the Spanish and British empires that America claimed to transcend. The *normative claim* of exceptionalism—that America acts differently—was empirically falsified by the conduct of the war. To maintain the *ideological* register, proponents had to resort to explicit racial hierarchy, arguing that Filipinos were incapable of understanding "civilized" warfare. Here, exceptionalism did not explain the violence; it merely masked it.

  The *Insular Cases* represent the total collapse of the *historical thesis*. In these rulings, the Supreme Court invented the category of "unincorporated territory," declaring that the Constitution does not fully follow the flag. This created a legal limbo where the U.S. could govern people without their consent and without promising them citizenship or statehood. This directly contradicted the *historical thesis* that the U.S. was founded on universal principles of consent and equality. If those principles were universal, they would apply to Filipinos. If they applied only to Americans, the U.S. was not a new kind of state based on creed, but an ethno-state based on blood and soil. The Court used the *ideological* register to justify this contradiction, ruling that "savage" peoples required a different legal standard. This proves that exceptionalism functioned as an *ex post facto* justification rather than a guiding principle.

  **The Verdict: Unfalsifiable Rhetoric vs. Material Reality**

  So, does this episode confirm American exceptionalism as a useful lens, or expose it as unfalsifiable? The evidence suggests the latter. A useful historical concept should help distinguish between different types of actions. American exceptionalism, however, proved capable of rationalizing both isolationism (the anti-imperialist position) and expansionism (the imperialist position) simultaneously. Because the *ideological* register can absorb and redefine the *historical* and *normative* registers, the concept is immune to disproof. If the U.S. stays home, it is exceptional because it is virtuous. If the U.S. conquers, it is exceptional because it is benevolent. This makes it a poor tool for causal analysis.

  This is where your friends' emphasis on markets and racial hierarchy offers superior explanatory power. The economic argument explains *why* the annexation happened: the panic of 1893 had convinced elites that the U.S. needed overseas markets, specifically access to China, to avoid social unrest at home. The Philippines was a coaling station and a gateway, not a moral mission. The racial argument explains *how* it was justified: Social Darwinism provided the vocabulary to classify Filipinos as "unfit" for self-government, allowing Americans to suspend their own democratic norms without cognitive dissonance.

  American exceptionalism was the software that ran the program, but economics and race were the hardware. Exceptionalism explains the *rhetoric* of the debate, but it misdescribes the *reality* of the outcome. It suggests a continuity of principle where there was actually a rupture. The *ideological* version of exceptionalism survives the episode only because it is tautological: America is exceptional because it does what America does.

  **Conclusion**

  In the seminar, you should argue that the Philippine annexation debate strips American exceptionalism of its analytical value. While all participants spoke the language of exceptionalism, the *historical thesis* and *normative claim* were discarded the moment they conflicted with strategic interests. Only the *ideological* register remained, serving as a blanket justification for power.

  If you must choose which version survives, it is the *ideological* one, but that is precisely the problem. It survives by consuming the others. A framework that can justify a war of liberation and a war of conquest with the same vocabulary is not a lens for understanding history; it is a tool for obscuring it. Your friends are right to look beneath the rhetoric. The annexation of the Philippines was not a test of American uniqueness; it was a confirmation that when faced with the choice between principle and power, the ideology of exceptionalism will always be bent to serve the power.
