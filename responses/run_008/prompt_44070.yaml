answer: |-
  This is a classic case of a physicist using a shorthand that collapses three distinct layers of physics (thermodynamics, cosmology, and neuroscience) into one slogan. Your intuition about the coffee is correct: if the claim were about local entropy, it would be falsified by every refrigerator and growing plant in existence.

  Here are the four distinct theses packed into "time has a direction because entropy increases," evaluated for accuracy and utility for your column.

  ### 1. The Local Thermodynamic Thesis
  **The Claim:** In any specific process you observe (like coffee cooling), entropy must increase for time to move forward.
  **Verdict:** **Plain False.**
  **Why:** As you noted, the entropy of the coffee *decreases* as it cools. Local entropy decreases all the time (water freezing, stars forming, you digesting lunch). The Second Law of Thermodynamics applies only to *isolated* systems. If this were the claim, your coffee mug would be a time machine.

  ### 2. The Global Thermodynamic Thesis (The "Past Hypothesis")
  **The Claim:** The universe as a whole is an isolated system that started in a state of exceptionally low entropy, and the "direction" of time is simply the label we give to the gradient from that low-entropy past toward a high-entropy future.
  **Verdict:** **Contentious but Defensible (Standard Model).**
  **Why:** This is the rigorous physics answer. It requires the "Past Hypothesis" (the Big Bang was a low-entropy state). Without this boundary condition, entropy increase is statistically unlikely to be consistent over billions of years. This doesn't explain *why* the Big Bang was low entropy, but it anchors the arrow of time to cosmology, not local events.

  ### 3. The Psychological Arrow Thesis
  **The Claim:** Human memory and perception are physical processes that dissipate energy; therefore, we can only form memories in the direction of increasing total entropy.
  **Verdict:** **Contentious but Defensible.**
  **Why:** This relies on the thermodynamics of computation (Landauer's Principle). To record a memory, a brain (or hard drive) must settle into a specific state, which generates heat and increases total entropy. If entropy were decreasing globally, the physics of information suggests we would "remember" the future instead. This directly addresses your "why do we remember" question, but it depends on specific models of how consciousness/computation interfaces with thermodynamics.

  ### 4. The Reductionist Thesis
  **The Claim:** Time's direction *is nothing over and above* entropy increase. There is no independent "flow" of time; there is only the statistical arrangement of particles moving toward equilibrium.
  **Verdict:** **Contentious (Philosophically Heavy).**
  **Why:** This is a metaphysical claim. In General Relativity, time is a coordinate dimension that exists regardless of entropy. This thesis argues that the *asymmetry* of time (the difference between past and future) is fully reducible to thermodynamics. Many physicists accept this pragmatically, but philosophers of physics often push back, arguing it conflates the *measure* of time with the *arrow* of time.

  ***

  ### What the Cosmologist Was Actually Saying
  When the cosmologist waved off the question, they were almost certainly invoking a combination of **Thesis 2 (Global)** and **Thesis 3 (Psychological)**.

  They were relying on a standard chain of reasoning in cosmology:
  1.  The Universe started with low entropy (The Past Hypothesis).
  2.  Therefore, the Universe has a global thermodynamic arrow (Thesis 2).
  3.  Brains are physical systems within the Universe; therefore, our psychological experience of "past vs. future" is slaved to that global thermodynamic arrow (Thesis 3).

  They skipped the steps because, in their field, this is the "standard story." However, for a general audience, skipping the distinction between *local* and *global* entropy (Thesis 1 vs. Thesis 2) creates the exact confusion you are experiencing with the coffee mug.

  ### The Sentence You Can Use
  You need a sentence that acknowledges the global constraint (saving it from the coffee counter-example) and links it to memory (answering the prompt) without making a reductionist claim you can't defend.

  **Draft this:**
  > "We remember the past and not the future not because time itself flows, but because the formation of memories is a physical process that generates heat, locking our subjective experience to the universe's overall statistical march from order toward disorder."

  **Why this works:**
  *   **"Not because time itself flows":** Sidesteps the metaphysical Reductionist Thesis (Thesis 4).
  *   **"Generates heat":** Anchors it in the Physics of Computation (Thesis 3).
  *   **"Universe's overall... march":** Specifies the Global Thesis (Thesis 2), protecting you from the "cooling coffee" objection.
  *   **"Statistical":** Acknowledges that this is probabilistic thermodynamics, not a mystical force.

  This allows you to honor the cosmologist's point without inheriting the imprecision of their slogan.
