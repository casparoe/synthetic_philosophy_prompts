      *   (Optional but helpful) A brief note on the "Past Hypothesis" since it's the missing link.

  10. (Final check of the "Coffee" point): Ensure I validate the user's intuition. The coffee cooling *decreases* the coffee's entropy, but increases the room's entropy more. The *total* increases. This confirms the "Global" thesis is the only viable physical one.

