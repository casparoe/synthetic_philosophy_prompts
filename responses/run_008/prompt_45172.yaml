answer: |-
  This is a classic objection to the Biostatistical Theory (BST), often called the "High Prevalence Objection." Your colleague has constructed a valid *reductio* against a crude version of naturalism, but the slip lies in **Step 2**.

  To save naturalism without capitulating to normativism, you should reject Step 2. However, doing so comes with a significant theoretical cost that you need to own in your discussion.

  ### The Diagnosis: Step 2 is a Caricature

  Your colleague's Step 2 claims: *"What counts as typical is fixed by current frequencies in that class: if most members have the condition, then for them it is typical."*

  This is the weak link. While Boorse does define health as "statistical normality of function," he does not mean raw, synchronic prevalence in whatever population happens to exist right now. He means statistical normality relative to **species-typical functional design**.

  For Boorse, "function" is not defined by frequency; frequency is merely the *evidence* we use to estimate function. The underlying metric is contribution to survival and reproduction. If a condition (like myopia in modern East Asian cohorts) is statistically common but reduces the efficiency of the visual system relative to its evolutionary design, it remains a dysfunction, even if it is statistically "normal" in that specific environment.

  By equating "statistical typicality" with "current raw frequency," your colleague conflates the *measure* with the *concept*. A naturalist should argue that a reference class polluted by widespread environmental pathology (e.g., excessive near-work causing myopia) does not yield a valid baseline for "species-typical function."

  ### The Cost of Rejecting Step 2

  If you reject Step 2 to save Step 1, you pay three specific philosophical prices. You need to be prepared to defend these costs in your reading group.

  **1. You must commit to Evolutionary Teleology**
  To distinguish between "common dysfunction" (myopia) and "normal function" (aging), you cannot just count heads. You must appeal to what the organism is *supposed* to do. In naturalist terms, this means adopting an **etiological theory of function**: a heart functions to pump blood because that is what hearts were selected for by evolution.
  *   **The Cost:** Your colleague argued that naturalism promises to do without "design notions." By rejecting Step 2, you concede that you *do* need a notion of design, but you argue it is **naturalized design** (evolutionary history) rather than **normative design** (social values or supernatural intent). You are trading epidemiology for evolutionary biology.

  **2. The Reference Class Problem Becomes Harder**
  If you can't just use "current 20-year-old males," you have to specify which reference class counts as "natural." Do we compare modern humans to hunter-gatherers? To primates? To an idealized genetic baseline?
  *   **The Cost:** You open yourself to the charge of circularity. If you select a reference class that excludes myopic people to prove myopia is a disease, you are defining disease by excluding the diseased. You must argue that the reference class is fixed by biological facts (e.g., shared evolutionary niche), not by the prevalence of the condition itself.

  **3. You Lose "Value-Free" Simplicity**
  One of the selling points of BST is that it is value-free. Raw statistics look value-free. Evolutionary function is messier. Determining whether presbyopia (age-related farsightedness) is a "disease" or "normal aging" depends on whether we view the lifespan as "designed" to extend beyond reproduction.
  *   **The Cost:** You must admit that naturalism is not a simple algorithm. It requires substantive biological theory to adjudicate borderline cases. You cannot simply point to a prevalence curve; you have to argue about the functional contribution of the trait to survival and reproduction.

  ### Addressing Step 5 (The Treatment Paradox)

  Once you reject Step 2, Step 5 collapses. If disease status is tied to functional design rather than raw frequency, a successful treatment program does not erase the diagnosis by making the condition rare; it erases the diagnosis by **restoring function**.

  Conversely, if a condition becomes universal (e.g., everyone gets dental caries due to sugar), it does not cease to be a disease under this refined naturalism, because the teeth are still failing to perform their evolved function (mastication without decay), even if the failure is statistically typical.

  ### Summary for Your Group

  Tell your colleague that you reject **Step 2**.

  *   **Why:** Because Boorsean naturalism defines "typical" relative to evolutionary design (survival/reproduction), not raw current frequency. High prevalence does not equal normal function.
  *   **The Cost:** You admit that naturalism relies on evolutionary teleology. You concede that "function" is not value-free in the sense of being theory-neutral; it relies on a specific biological account of what organisms are "for."
  *   **The Payoff:** You avoid the absurd conclusion that myopia isn't a disease in Singapore, and you avoid the paradox where curing a disease makes it more "real" or letting it spread makes it vanish.

  You keep Naturalism, but you have to defend a more sophisticated version of it than the one your colleague attacked.
