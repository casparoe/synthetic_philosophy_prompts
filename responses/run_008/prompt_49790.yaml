answer: |-
  **What's New in Version 3.0**

  Thank you for choosing Dichotomy. Our team has been working hard to optimize your agency allocation and streamline your emotional ROI. Based on community feedback and internal audits of our philosophical framework, we are rolling out significant updates to the Core Control Classifier.

  1.  **Control Classifier 2.1 Patch:** In version 2.0, we identified a critical bug where external outcomes—specifically career advancement, athletic performance, and relationship status—were incorrectly tagged as "Up To You." This created user friction when reality failed to align with effort. In 3.0, we have corrected this logic. The app now strictly classifies only your judgments, impulses, and faculty of assent as controllable. Everything else, including the results of your labor, has been moved to the "Not Up To You" bucket. This ensures you never mistakenly invest emotional capital in indifferents again.

  2.  **User Feedback Integration:** We heard reports from users who felt demotivated after the reclassification. One user, *MarathonMike88*, submitted a ticket stating, "I trained for six months and the app just called my race time an indifferent." We want to clarify that this is working as intended. While finishing the race is preferred, your worth is not contingent on the clock. We have added a tooltip to explain that while legs may fail, the will remains invulnerable.

  3.  **Dichotomy+ Subscription Tier:** We are excited to launch Dichotomy+. For $12.99/month, subscribers gain access to premium visualizations of preferred indifferents. This includes customizable streak counters, achievement badges for maintaining equanimity, and a widget that displays randomized aphorisms on your lock screen. Please note: Serenity itself remains free, but the *appearance* of progress is now behind the paywall.

  4.  **Known Issues:**
      *   **Ticket #402 (Quietism):** Several users report that accepting all externals as uncontrollable reduces their incentive to vote, work, or engage in civic duty. Our engineering team has classified this as a feature, not a bug. The app is designed for internal governance, not geopolitical optimization.
      *   **Ticket #715 (Grief Loop):** Users grieving a loss are flagged for "incorrect judgment" when experiencing pain. We are aware this feels counterintuitive. However, the system is functioning correctly by reminding users that distress stems from the judgment of the loss, not the loss itself. We recommend upgrading to Dichotomy+ for a soothing color palette while you restructure your assent.

  5.  **Beta Tester Notes:** During the beta cycle, one user identifying as a Cynic unsubscribed, noting that the app "makes virtue too comfortable and domesticated." Additionally, an Epicurean reviewer left one star, arguing that pain is inherently bad. We have archived this feedback under "Incorrect Philosophical Premises."

  6.  **Performance Improvements:** Reduced latency when dismissing anxiety. Fixed an issue where the app would crash if users attempted to control the past.

  We hope you enjoy these updates. Remember: You cannot control the App Store rating, only your judgment of it.

  *The Dichotomy Team*
