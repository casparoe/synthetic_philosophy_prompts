  I'm a doctoral student in statistics who works on causal inference: structural causal models, the do-operator, interventions as graph surgery, and potential outcomes in the Neyman–Rubin style are the vocabulary I use every day, and I know Pearl's and Woodward's work reasonably well from that side. I'm currently taking a metaphysics course where we've been studying the debate between the old counterfactual theories of causation — the tradition running through David Lewis, where causation is analysed in terms of counterfactual dependence between closest possible worlds — and the interventionist line I already half-know. Please restate the debate itself, not just the interventionist side, in my vocabulary: treat possible worlds as alternative settings of the exogenous variables, treat closeness of worlds as whatever my machinery says when I pose a counterfactual query, and treat Lewis's chains of stepwise dependence as paths through the graph. Then give me the residue report: which parts of the disagreement between the two camps survive the translation cleanly, which can only be stated with distortion, and which have no expression in my vocabulary at all — I suspect the non-backtracking condition on counterfactuals and the question of why counterfactual dependence is evaluated holding the past fixed and varying the future are in that last category, but don't limit yourself to those. Finally, tell me whether the residue shows that my framework is missing something real, or that the disagreement was never about anything my framework cannot already say. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Doctoral student in statistics, specialising in causal inference (SCMs, do-operator, graph surgery, potential outcomes/Neyman-Rubin). Familiar with Pearl and Woodward.
      *   **Context:** Taking a metaphysics course, studying the debate between Lewisian counterfactual theories of causation and Interventionist/Manipulability theories (Woodward, Pearl).
      *   **Task:**
          1.  Restate the debate using the user's statistical/causal inference vocabulary (SCMs, exogenous variables, graph paths, etc.).
