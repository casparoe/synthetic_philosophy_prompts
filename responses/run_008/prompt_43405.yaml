prompt: |-
  I'm a graduate TA for an intermediate decision theory course, and next week I run my first section of the semester on expected utility and its empirical failures. The lecturer has just covered the von Neumann–Morgenstern axioms and the representation theorem in two lectures; my job, in fifty minutes with a whiteboard, is the Allais paradox and what it's supposed to show about the independence axiom. The students are second-year economics majors who have seen expected utility for money exactly once and mostly treat the axioms as algebra they will be tested on, not as substantive claims about rational preference. I'm genuinely torn about sequencing: the natural order is to restate independence formally and then exhibit the violations, but my instinct is that the axiom only becomes interesting after students have made the Allais choices themselves and felt the tension from the inside — that until then "independence" is just the name of one more line on the formula sheet. I'd like a defended view on which order actually works, not just both options listed.

  So plan the section for me rather than explaining the paradox to me. What should the carrying example be — the original large-payoff setup with a certain prize versus the two risky pairs, or a reformulation with stakes the students would actually face, and what must the example have and not have in order to carry the point (I worry that scaling the payoffs down changes the psychology, but I also worry the original amounts are abstract enough that students go numb)? Which misconceptions should I expect, in the order they'll actually arrive — my guesses are "this is just risk aversion, which we already knew," "certainty has a utility the theorem forgot to include, so the fix is easy," and "so expected utility is refuted and the axioms are arbitrary dogma" — and where exactly in the sequence each should be headed off? Is having them vote on the two choice pairs before any theory is on the board a help or a hazard, given that some will defend their choices and I don't want the section to become a debate about whether the 'irrational' answer is really irrational? And is it worth showing them a presentation of the same underlying choice where the shared outcome is made salient, so they can watch their own answer flip — or does that give away the punchline and reduce the paradox to a lesson about paying attention?

  Finally, give me one question I can ask in the last five minutes that would tell me whether they understand independence as a claim about how one pair of lotteries may be compared to another, rather than as a memorized axiom label — and tell me what I should openly decline to cover at this level (generalized utility theories, the follow-up literature on whether the violations survive with experience, the framing experiments) and how to say so in a way that doesn't sound like an invitation to dismiss the whole framework as optional decoration.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Graduate TA for an intermediate decision theory course.
      *   **Task:** Run a 50-minute section on Expected Utility (EU) failures, specifically the Allais Paradox and the Independence Axiom.
      *   **Context:** Lecturer covered vNM axioms/representation theorem. Students are 2nd-year Econ majors. They view axioms as algebra/test material, not substantive rationality claims.
      *   **Core Dilemma:** Sequence (Theory first vs. Experience first).
      *   **Specific Questions to Answer:**
          *   Defended view on sequencing.
          *   Carrying example (Original vs. Scaled).
          *   Expected misconceptions & when to head them off.
          *   Voting before theory (Help or Hazard?).
          *   Salient common consequence framing (Worth it or gives away punchline?).
          *   One final assessment question.
          *   What to explicitly decline to cover (and how to frame it).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students treat axioms as math rules, not behavioral constraints. If I start with math, they'll just memorize the violation without feeling the *pull* of the violation.
      *   *The Goal:* Make them feel the tension between their intuition and the axiom *before* formalizing why it matters.
      *   *The Constraint:* 50 minutes is tight. Need to be efficient.

  3.  **Address the Specific Questions:**

      *   **Sequencing:** *Experience First.* Why? Because the Independence Axiom is counter-intuitive. If stated formally first ($L \succ L' \implies \alpha L + (1-\alpha)L'' \succ \alpha L' + (1-\alpha)L''$), it looks like obvious algebra. Students will nod along. They need to violate it *first* to realize their intuition conflicts with the math they just learned. The "aha" moment comes from the conflict, not the definition.
      *   **Carrying Example:** *Original (or close to it).* Why? Scaling down too much (e.g., \$10 vs \$0) often makes people risk-neutral or careless. The "Certainty Effect" drives Allais. You need a life-changing amount (or at least "tuition money") to trigger the safety preference. However, abstract millions can feel fake. *Compromise:* Use "Graduate Stipend" amounts (e.g., \$30k vs \$0) or keep the original structure but ensure the "Certain" option is truly significant. Let's stick closer to Allais's original structure but maybe adjust zeros to make it clean. Actually, the prompt asks for a defended view. I'll argue for the *original structure* because the specific probability shift (1.0 to 0.89 vs 0.11 to 0.10) is the mathematical engine. Changing stakes changes risk aversion, but changing probabilities changes the independence violation. Keep the probabilities, keep the stakes high enough to matter.
      *   **Voting:** *Help.* But needs management. If they debate "is this irrational," you lose time. The vote establishes *prevalence*, not truth. It shows "many smart people do this."
      *   **Salient Common Consequence:** *Yes, show it later.* This is the "Common Consequence Effect" explanation. It shouldn't be shown *during* the vote, but *after* the violation is established, to show *why* they violated it. It transforms the paradox from "I'm dumb" to "My brain processes common outcomes differently."
      *   **Misconceptions:**
          1.  "It's just risk aversion." (Head off immediately after voting).
          2.  "Certainty has extra utility." (Head off during the formalization).
          3.  "EU is dead/arbitrary." (Head off in the conclusion/wrap-up).
      *   **Final Question:** Needs to test the *structure* of independence, not the definition. A novel lottery pair.
      *   **What to Exclude:** Prospect Theory, Rank-Dependent Utility, Learning/Experience. Frame as "Tools for next semester/advanced courses," not "This stuff is wrong."

  4.  **Drafting the Plan (Iterative Process):**

      *   *Minute 0-5:* Intro & Hook. Don't write axioms.
      *   *Minute 5-15:* The Choice Task (Voting). Use the classic Allais pairs.
      *   *Minute 15-25:* The Reveal & The Math. Show that EU says these choices are inconsistent.
      *   *Minute 25-35:* The Independence Axiom (Formal). Now introduce the axiom. Show exactly where the violation happened.
      *   *Minute 35-40:* The "Common Consequence" Reframing. Show the table where the 89% column cancels out.
      *   *Minute 40-45:* Misconception Management. Address Risk Aversion and "Certainty Utility."
      *   *Minute 45-50:* Assessment & Scope Setting. The final question and what we aren't doing.

  5.  **Refining the Arguments:**

      *   *Sequencing:* I need to be firm. Theory first kills the intuition. Experience first creates the "cognitive dissonance" required for learning.
      *   *Example:* I will recommend the classic Allais numbers but contextualized. \$1M is abstract. \$250k (house down payment) is real to a student. Let's suggest keeping the probabilities exact (1.0, 0.89, 0.11) because the math relies on that, but adjust monetary units to be "Life Changing" without being "Bill Gates" abstract.
      *   *Misconceptions:* The "Risk Aversion" one is the big killer. EU allows risk aversion (concave utility). Allais violates EU *regardless* of the utility function shape. I need a specific whiteboard move to kill this. (Show that $u(\$0)$ cancels out too).
      *   *Exclusions:* Be careful not to sound dismissive. "We treat EU as the benchmark, not the final word."

  6.  **Final Review against Constraints:**
      *   50 minutes? Yes, the timing looks tight but doable.
      *   Whiteboard focused? Yes.
      *   Defended views? Yes, I will take a stance on every choice.
      *   Tone: Professional, pedagogical, authoritative but supportive.

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I explicitly answer the "Voting" question. Is it a hazard? Only if you let them argue normativity. Keep it descriptive.
      *   *Correction:* The "Final Question" needs to be specific. I'll draft a specific lottery pair.
      *   *Correction:* Ensure I address the "Certainty Utility" misconception clearly. That's the most common student pushback.

  8.  **Final Polish:** Check the tone. It should sound like a senior colleague advising a TA. Clear, actionable, decisive. (Proceed to generate output).

  *(Self-Correction on the "Final Question"):* The prompt asks for *one* question. It needs to test if they understand independence as a comparison of *pairs*. I'll design a question where they have to identify which pair violates independence, or construct a pair that isolates the axiom. Let's go with identifying the violation in a new context.

  *(Self-Correction on "What to Decline"):* Don't just list topics. Explain *why* excluding them protects the learning goal for *this* section.

  *(Final check on Sequencing argument):* Make sure I emphasize that if they know the axiom first, they will "solve" the vote rather than "feel" the vote.

  Okay, ready to write.cw
answer: |-
  Here is a defended lesson plan for your 50-minute section.

  ### 1. The Sequencing Defense: Experience Before Theory
  **Verdict:** Do **not** start with the formal statement of the Independence Axiom. Start with the choices.

  **Why:** If you write the Independence Axiom on the board first ($L \succ L' \implies \alpha L + (1-\alpha)L'' \succ \alpha L' + (1-\alpha)L''$), second-year econ students will treat it as a linear algebra constraint. They will nod, memorize the syntax, and move on. They will not feel the *normative weight* of the axiom.

  The pedagogical goal of this section is to create **cognitive dissonance**. You want them to make a choice based on intuition, then discover that their intuition is mathematically inconsistent with the framework they just learned. If they know the "right answer" (consistency with Independence) before they vote, they will game the vote to match the theory. You need them to commit to the violation *before* you show them the rule they broke. The axiom only becomes interesting when it acts as a constraint on what they *want* to do, not just a formula they have to manipulate.

  ### 2. The Carrying Example: Stakes and Structure
  **Verdict:** Use the **original probability structure** but adjust the monetary stakes to be "life-changing" rather than "abstract millionaire" money.

  **The Setup:**
  *   **Pair 1:**
      *   A: \$250,000 for sure.
      *   B: 89% chance of \$250,000, 10% chance of \$2,000,000, 1% chance of \$0.
  *   **Pair 2:**
      *   C: 11% chance of \$250,000, 89% chance of \$0.
      *   D: 10% chance of \$2,000,000, 90% chance of \$0.

  **Why this specific configuration:**
  1.  **Probabilities:** Do not simplify the 89/10/1 split. The mathematical contradiction relies on the 0.89 common consequence canceling out. If you change the probabilities to make them "cleaner" (e.g., 50/50), you often accidentally restore consistency or make the calculation too easy, allowing students to compute EV rather than feel the risk.
  2.  **Stakes:** \$1 million is abstract to a sophomore; it triggers "game mode." \$250,000 is a house down payment or full tuition; it triggers "life mode." You need the **Certainty Effect** to kick in. If the certain amount is too low, they will risk-neutralize it. If it is too high (billions), it becomes fantasy.
  3.  **The Trap:** This setup ensures that preferring A over B (safety) and D over C (upside) is the common pattern, and that this pattern violates EU regardless of the utility function's curvature.

  ### 3. The 50-Minute Sequence

  **0:00–0:05: Introduction & The Vote (No Theory)**
  *   **Action:** Put Pair 1 and Pair 2 on the board. No mention of von Neumann, Morgenstern, or axioms.
  *   **Script:** "Imagine these are real checks. You have 30 seconds. Write down A or B, and C or D. Do not discuss."
  *   **The Vote:** Ask for a show of hands for (A, C), (A, D), (B, C), (B, D).
  *   **Management:** If a student argues "B is better because EV is higher," shut it down gently: "We are recording preferences, not calculating EV. There is no correct answer yet."
  *   **Goal:** Establish that a large plurality chose (A, D). This is the Allais violation.

  **0:05–0:15: The Reveal & The "Risk Aversion" Misconception**
  *   **Action:** Write the Expected Utility inequalities for their choices.
      *   If A $\succ$ B: $u(250k) > 0.89u(250k) + 0.10u(2M) + 0.01u(0)$
      *   If D $\succ$ C: $0.10u(2M) + 0.90u(0) > 0.11u(250k) + 0.89u(0)$
  *   **The Head-Off (Misconception 1):** Students will immediately say, "This is just risk aversion."
  *   **Your Move:** Algebraically rearrange the first inequality. Subtract $0.89u(250k)$ from both sides.
      *   Result: $0.11u(250k) > 0.10u(2M) + 0.01u(0)$
      *   Now rearrange the second inequality (assuming $u(0)=0$ for simplicity, or keep it in).
      *   Result: $0.10u(2M) > 0.11u(250k)$
      *   **Point:** Show them these two resulting inequalities contradict each other.
      *   **Script:** "Risk aversion explains why you prefer A over B. It does *not* explain why you switch to D in the second pair. If you are risk averse enough to pick A, the math says you must pick C. You cannot be 'consistent' and pick A and D, no matter how curved your utility function is."

  **0:15–0:25: Formalizing Independence**
  *   **Action:** Now introduce the Independence Axiom formally.
  *   **Script:** "You just violated this. This is the Independence Axiom." Write it out.
  *   **Connection:** Map the lotteries to the axiom. Show that Lottery C is just Lottery A with the \$250k outcome replaced by a lottery of (\$250k w.p. 11/11, \$0 w.p. 0/11)... actually, simpler: Show the **Common Consequence** representation.
  *   **Whiteboard Move:** Draw a table.
      *   Row 1 (A): [89%: 250k] [11%: 250k]
      *   Row 2 (B): [89%: 250k] [10%: 2M, 1%: 0]
      *   Row 3 (C): [89%: 0]    [11%: 250k]
      *   Row 4 (D): [89%: 0]    [10%: 2M, 1%: 0]
  *   **Insight:** "Look at the first column (89%). In Pair 1, it's 250k for both. In Pair 2, it's 0 for both. The axiom says you should ignore the column that is identical across the row. Your preference should depend *only* on the second column. But the change in the first column (250k to 0) changed your mind."

  **0:25–0:35: The "Certainty Utility" Misconception**
  *   **Action:** Address the second major pushback.
  *   **Misconception 2:** "Certainty has a bonus utility that the theorem forgot."
  *   **Your Move:** Acknowledge this is the psychological truth, but the theoretical cost.
  *   **Script:** "You are saying $u(\$250k \text{ for sure}) \neq u(\$250k)$. If you add a 'certainty bonus' parameter, you break the linearity of expected utility. That is allowed! But it means EU is not a complete description of your brain. It means the axiom is a *restriction* on how you process probability, not just value."
  *   **Goal:** Distinguish between "EU is wrong" (empirically) and "EU is arbitrary" (normatively). The axiom isn't arbitrary; it's a requirement for dynamic consistency (briefly mention this as a hook, don't prove it).

  **0:35–0:40: The Reframing (Common Consequence)**
  *   **Action:** Show the "Salient Common Consequence" version.
  *   **Verdict:** **Yes, show this.** It does not give away the punchline; it explains the mechanism.
  *   **Script:** "Let's rewrite Pair 2. Imagine I flip a coin. 89% of the time, the game ends and everyone gets nothing. 11% of the time, we play the sub-lottery."
  *   **Why:** This helps them see *why* they violated the axiom. They aren't bad at math; they overweight the shift from "100% safe" to "89% safe" compared to "11% safe" to "10% safe." This validates their intuition while confirming the violation.

  **0:40–0:45: Scope & Limitations (What We Are Not Doing)**
  *   **Action:** Explicitly bound the section.
  *   **Script:** "We are not discussing Prospect Theory, Rank-Dependent Utility, or whether you would learn to stop doing this after 100 trials. Those are advanced topics."
  *   **How to frame it:** "In this course, EU is our **benchmark**. We study the violations not to discard EU as 'optional decoration,' but to understand where the benchmark breaks. Think of EU like frictionless physics: it's the baseline model. Knowing where it fails is how we measure the friction."
  *   **Why:** This prevents the "so the whole class is useless" conclusion. It positions the paradox as a refinement of their toolkit, not a demolition of it.

  **0:45–0:50: The Assessment Question**
  *   **Action:** Put this on the board.
  *   **The Question:**
      > "Consider two new lotteries:
      > $X$: 50% chance of \$100, 50% chance of \$0.
      > $Y$: 50% chance of \$200, 50% chance of \$0.
      >
      > Now consider a third outcome $Z$ = \$50 for sure.
      > If you prefer $Y$ to $X$, what does the Independence Axiom require you to prefer between:
      > $L_1$: 50% chance of $Y$, 50% chance of $Z$
      > $L_2$: 50% chance of $X$, 50% chance of $Z$?"
  *   **The Answer:** They must prefer $L_1$.
  *   **Why this works:** It tests the *structure* of the axiom (mixing with a common third lottery), not the specific Allais numbers. If they answer based on risk feelings ("Maybe $Z$ makes me safer?"), they fail. If they answer based on the preservation of order ($Y \succ X \implies L_1 \succ L_2$), they pass.
  *   **Collection:** Have them write the answer on a slip of paper and hand it to you as they leave.

  ### 4. Summary of Misconception Management

  | Misconception | When it arrives | How to head it off |
  | :--- | :--- | :--- |
  | **"This is just risk aversion."** | Immediately after the vote (Min 10). | **Algebraic Cancellation.** Show that $u(\cdot)$ cancels out. The violation holds for *any* monotonic transformation. |
  | **"Certainty has extra utility."** | During formalization (Min 30). | **Validate then Contain.** Agree psychologically, note theoretically. This requires non-linear probability weighting (Prospect Theory), which is outside EU. |
  | **"EU is refuted/arbitrary."** | During wrap-up (Min 45). | **Benchmark Framing.** EU is the null hypothesis. Violations measure "friction," not "falsehood." |

  ### 5. Final Advice on Tone
  You are torn because you care about whether they *believe* the material. Release that burden. Your job is not to convince them that Independence is "True." Your job is to convince them that Independence is a **substantive constraint** that their intuition naturally violates.

  If they leave thinking, "I see why the axiom implies consistency, and I see why my brain doesn't like it," you have succeeded. If they leave thinking, "The axiom is a formula I can use to check lottery pairs," you have also succeeded. Do not let the section devolve into a philosophy seminar on rationality. Keep the whiteboard full of equations, keep the clock moving, and treat their intuition as data, not as debate.
