      *   *Candidate 2: Autonomy vs. Welfare.* Terminal diagnosis prioritizes autonomy (right to decide end-of-life). Genetic testing prioritizes welfare (protecting from psychological harm). The theory of information value shifts from instrumental (use for action) to constitutive (part of dignity) vs. hedonic (feeling good).
      *   *Candidate 3: Actionability.* Terminal diagnosis allows action (hospice, wills, saying goodbye). Genetic testing for incurable diseases often allows no medical action. But Good's Theorem says even without *medical* action, you can adjust *life* plans. So why the difference? Maybe the probability matters. Terminal is near 100%. Genetic is probabilistic.
