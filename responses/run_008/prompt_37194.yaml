      *   *Decision Theory nuance:* If I don't test, I live in a state of probability. If I test, I live in a state of certainty (or higher probability). Good's theorem says certainty is better for decision making. But if the decision space is empty (no cure), the only decision is how to feel. If feeling bad is a cost, then information has a cost.
