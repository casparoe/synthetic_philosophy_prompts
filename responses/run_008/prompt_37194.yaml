answer: |-
  Dear Student,

  It is a rare pleasure to encounter a high school essay question that cuts so precisely to the bone of a professional dilemma. You have identified a genuine tension in medical ethics, and your invocation of I. J. Good's theorem on the value of information shows that you are not merely describing the conflict but looking for the structural assumptions that hold it together. You are correct that this is not a simple inconsistency but a philosophical puzzle that reveals how medicine values knowledge differently depending on the temporal and agential context of the patient. To answer you thoroughly, I must walk through the decision theory, the ethical frameworks, and the places where the theory inevitably runs out.

  Let us begin by scrutinizing the decision-theoretic intuition you have brought to the table. Good's theorem essentially states that for a rational agent maximizing expected utility, free information always has non-negative value. The logic is that you can always choose to act as if you had not received the information if the news turns out to be unhelpful, but you cannot act on the news if you do not have it. Therefore, having the option to know is strictly better than not having it. If medicine were purely a decision-theoretic engine operating on rational agents, the norm would be universal disclosure and universal testing, provided the financial cost was negligible. The fact that medicine diverges from this suggests that the medical establishment does not view patients as pure expected-utility maximizers in the decision-theoretic sense, or it does not view the information as costless, or it values things other than utility maximization.

  The most precise reconstruction of the implicit theory presupposed by these two practices is that medicine treats information as having two distinct kinds of value: instrumental value and constitutive value, weighted differently depending on the proximity of harm. In the case of your grandmother's terminal diagnosis, the information is treated as having high constitutive value regarding her autonomy and dignity, even if its instrumental value for curing the disease is zero. The mandate to disclose rests on the idea that a person has a right to the truth about their own existence, particularly when that existence is ending. This practice rules out a purely hedonic theory of information, which would suggest that hiding the truth is better if it preserves hope and happiness. It also rules out a purely instrumental theory that would say disclosure is unnecessary if no medical treatment exists. The practice insists that knowing is good even when doing is impossible, which implies that the value of information is partly intrinsic to the status of being a moral agent.

  Conversely, the practice regarding genetic testing for incurable conditions presupposes that information has a psychological cost that can outweigh its instrumental value. Here, the medical establishment implicitly accepts that for some patients, the state of knowing is itself a harm, a concept that decision theory can accommodate only if we include psychological dread as a direct negative utility in the equation. However, the norm goes further than just acknowledging cost; it actively counsels hesitation. This suggests a theory where the value of information is contingent on the patient's psychological resilience and the temporal horizon of the burden. If you know you will die in months, the burden of dread is short, and the utility of planning is high. If you know you might die in forty years, the burden of dread is long, and the utility of planning is low. Thus, the implicit theory is that the value of information is time-relative and context-dependent, not absolute.

  When we look at what these practices strictly require versus what merely fits comfortably, the distinction becomes sharp. You asked if it is enough to hold that information is good when it can be acted on and bad when it cannot. This instrumental view fits comfortably with the genetic testing norm, where lack of treatment options leads to a recommendation against testing. However, it fails to explain the terminal diagnosis norm. In terminal care, there is often no curative action to be taken, yet disclosure is mandatory. Therefore, the terminal-diagnosis practice presupposes something stronger than instrumentality; it requires a commitment to autonomy or dignity that exists independently of the ability to change the outcome. It asserts that you own your life story, even the final chapter, and cannot be kept in the dark about it. On the other side, the genetic testing norm does not strictly require paternalism. It fits comfortably with a strong view of autonomy that includes the right not to know. If autonomy means self-determination, it must include the determination to remain ignorant if that serves one's life plans. So, while the practices look opposite, they can both be grounded in autonomy, provided we understand autonomy differently in each context: as a right to truth in the face of death, and as a right to psychological integrity in the face of long-term uncertainty.

  There are, however, significant areas where these practices are philosophically underdetermined, meaning the observable behavior of doctors does not tell us which ethical theory is actually driving them. For instance, the hesitation around genetic testing could be justified by a utilitarian concern for mental health, or it could be justified by a deontological respect for the right to ignorance, or it could even be driven by a fear of liability if a patient becomes depressed after testing. The practice looks the same in all three cases. Similarly, the mandate to disclose terminal diagnoses could be driven by a belief that truth is inherently good, or it could be a legal safeguard to prevent lawsuits, or it could be based on the instrumental utility of allowing patients to settle their estates. Because the observable practice is compatible with multiple underlying theories of value, we cannot look at the norms alone to decide whether medicine values truth for its own sake or merely as a tool for risk management. This underdetermination is crucial for your essay because it suggests that the medical establishment itself may not have a unified theory of information but rather a collection of heuristics that have evolved to handle specific types of distress.

  If we were to apply the decision-theoretic view of information rigorously and literally, medicine would change in ways that might be logically consistent but humanly difficult. A strict application of Good's theorem would require doctors to treat patients as perfectly rational agents who can accurately weigh the utility of dread against the utility of planning. It would imply that testing should always be offered as a default, and perhaps even encouraged, because a rational agent should never reject free information. The concept of counseling hesitation would vanish, replaced by a neutral presentation of probabilities. If a patient chose not to know, it would be recorded as a revealed preference, but the doctor would not suggest that ignorance is a valid protective strategy. This medicine would be cleaner and more consistent, but I believe it would be worse. It would fail to account for the fact that human beings are not merely decision engines but emotional creatures who live inside their knowledge. The value of information is not just in how it changes our choices, but in how it changes our experience of living. A strict decision-theoretic model treats dread as a preference to be satisfied or unsatisfied, whereas medical ethics recognizes dread as a suffering to be mitigated.

  Furthermore, a literal application of decision theory ignores the ontological difference between revealing a present reality and generating a future probability. When a doctor reveals a terminal diagnosis, they are acknowledging a state of affairs that already exists physically. When a doctor orders a genetic test, they are initiating a process that creates new knowledge that did not previously exist in the patient's consciousness. In the latter case, the doctor is an agent of change in the patient's psychological world, not just a messenger. Good's theorem treats information as a signal received from the environment, but in predictive genetics, the test is an intervention. Recognizing this distinction helps explain why the norms differ without abandoning the value of information. The terminal diagnosis is about respecting the patient's relationship to their current reality; the genetic test is about protecting the patient's relationship to their future self.

  In conclusion, the two practices together presuppose a hybrid theory of information where value is determined by the intersection of agency, time, and psychological capacity. They rule out the view that information is always good regardless of context, and they rule out the view that information is only good if it leads to a cure. What they strictly require is a flexibility in ethical reasoning that allows autonomy to mean different things in different temporal contexts. What remains underdetermined is whether this flexibility is principled or merely pragmatic. If we forced medicine to adhere strictly to decision theory, we would gain consistency but lose the capacity to treat the patient as a whole person rather than a rational agent. The value of information, ultimately, is not just in the decisions it permits, but in the life that must be lived with it. I hope this helps you navigate the complexities of your essay, and I encourage you to lean into the ambiguity where the theory runs out, for that is often where the most important ethical work is done.

  Sincerely,

  Your Correspondent
