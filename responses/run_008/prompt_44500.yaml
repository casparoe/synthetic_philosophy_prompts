      *   *Final List:* Group into "Constitutional" (Anonymity), "Rationality" (Consistency), "Functionality" (Decisiveness).
      *   *The Theorem:* Name List & Pettit. Explain the trilemma.
      *   *The "Philosophy" vs "Math":* Be clear that the *theorem* is math, the *solution* is philosophy/policy.
      *   *Scorecard:* Table or bulleted list.

  10. **Final Review against constraints:**
