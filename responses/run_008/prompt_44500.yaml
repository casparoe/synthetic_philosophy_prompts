answer: |-
  To: Rules Committee, Professional Society Council
  From: Formal Epistemology & Social Choice Consultation
  Subject: Desiderata for Collective Judgment Aggregation Procedures

  You are right to pause. The "discursive dilemma" (often called the doctrinal paradox) is not a mere curiosity; it is a structural feature of any body that votes on logically interconnected propositions. If you ignore it, your council risks issuing contradictory rulings that undermine your authority.

  You mentioned "List and Pettigrew." A small correction for your records: the seminal impossibility theorem in this field is by **Christian List and Philip Pettit** (2002). Richard Pettigrew is a prominent formal epistemologist, but he is not the co-author of the core judgment aggregation theorem. Getting the citation right matters for your bibliography.

  Per your request, I will first brainstorm a broad set of potential requirements, then prune them to a core list. I will explicitly distinguish between settled mathematical results and contested normative choices. Finally, I will score the standard procedural options against these criteria.

  ---

  ### Phase 1: Brainstorming the Requirement List (Raw Material)

  Before we settle on the formal constraints, here is the "long list" of properties one might initially want a voting procedure to have. I have annotated why some are retained and others are cut for the final formal specification.

  1.  **Anonymity:** Every council member's judgment counts equally. *(Keep: Essential for legitimacy.)*
  2.  **Consistency:** The collective output must not contain logical contradictions (e.g., asserting $P$, $P \to Q$, and $\neg Q$). *(Keep: Non-negotiable for a rule-making body.)*
  3.  **Completeness (Decisiveness):** The group must issue a judgment (Yes/No) on every proposition on the agenda, not return "no view." *(Keep: Essential for functionality, though may need relaxation.)*
  4.  **Independence (Systematicity):** The collective judgment on proposition $P$ should depend *only* on individual judgments on $P$, not on judgments about $Q$ or $R$. *(Contested: This is the main casualty of the impossibility theorem.)*
  5.  **Unanimity Preservation:** If everyone agrees on $P$, the group accepts $P$. *(Keep: Basic fairness.)*
  6.  **Logical Closure:** If the group accepts $P$ and $P \to Q$, the group automatically accepts $Q$. *(Refine: Too strong for practice; replace with "Consistency" regarding explicit votes.)*
  7.  **Epistemic Accuracy:** The procedure should maximize the probability of reaching the *true* or *correct* outcome. *(Cut: This is a goal, not a formal constraint on the procedure itself, and "truth" is often unavailable in policy contexts.)*
  8.  **Transparency:** Members should understand how the outcome was derived. *(Cut: Practical virtue, but hard to formalize mathematically.)*
  9.  **Handling Abstentions:** The system must define what happens if a member recuses themselves or says "I don't know." *(Keep: Critical for real-world ethics cases.)*
  10. **Tie-Breaking:** The system must resolve 50/50 splits. *(Keep: Necessary for Decisiveness.)*
  11. **Agenda Flexibility:** Works for simple motions and complex interconnected claims. *(Keep: You need one procedure for all cases.)*
  12. **Stability:** Small changes in individual views shouldn't flip the outcome wildly. *(Cut: Related to monotonicity, but secondary to Consistency.)*

  ---

  ### Phase 2: The Core Desiderata (Final Specification)

  For a professional society council, the following five constraints constitute the "adequacy conditions." I have categorized them by their nature.

  #### A. Constitutional Constraints (Legitimacy)
  1.  **Universal Domain (with Abstentions):** The procedure must accept any combination of individual judgment sets as input. Crucially, it must accommodate **abstentions** (e.g., recusal due to conflict of interest) without crashing.
      *   *Motivation:* You cannot know in advance how members will view a case. If the procedure only works when everyone agrees, it is useless.
      *   *Status:* **Non-negotiable.** A council cannot say, "We can only vote if your views fit our algorithm."

  2.  **Anonymity:** The weight of a judgment does not depend on *who* submits it.
      *   *Motivation:* Democratic equality among council members.
      *   *Status:* **Non-negotiable** for a representative council. (Note: This rules out "defer to the Chair" as a general rule).

  #### B. Rationality Constraints (Coherence)
  3.  **Collective Consistency:** The set of accepted propositions must be logically consistent.
      *   *Motivation:* The Discursive Dilemma. If you accept "Policy X conflicts with Charter" and "If Policy X conflicts with Charter, we must reject it," you cannot conclude "We accept Policy X."
      *   *Status:* **Non-negotiable.** A body that issues contradictory rulings loses legal and moral authority.

  4.  **Unanimity Preservation:** If every participating member judges $P$ to be true, the collective judgment must be $P$.
      *   *Motivation:* Respect for consensus.
      *   *Status:* **Non-negotiable.**

  #### C. Functional Constraints (Usability)
  5.  **Decisiveness (Completeness):** For every proposition on the agenda, the procedure must yield a determinate outcome (Accept/Reject), resolving ties via a predefined mechanism (e.g., Chair casts tie-breaking vote).
      *   *Motivation:* The organization needs to act. "No view" is not an option for ethics violations or charter interpretations.
      *   *Status:* **High Priority,** but this is the most common pressure point for relaxation (see Phase 4).

  ---

  ### Phase 3: The Math vs. The Philosophy

  Here is where we must be precise about what is proven and what is chosen.

  #### The Settled Math (List & Pettit, 2002)
  It is a **mathematical theorem** that on any "rich" or "connected" agenda (where propositions are logically linked, like $P$, $Q$, and $P \land Q \to R$), **no aggregation procedure can satisfy all five desiderata above simultaneously.**

  Specifically, if you demand **Universal Domain, Anonymity, Consistency, Unanimity Preservation, and Independence**, the only solution is a **Dictatorship** (one person decides everything) or an **Oligarchy**.
  *   *Note on Independence:* This axiom requires that the group's decision on proposition $P$ depends *only* on votes on $P$. This is what standard "issue-by-issue" majority voting assumes.
  *   *The Result:* You cannot have issue-by-issue majority voting (Independence) + Anonymity + Consistency on connected agendas. One must go.

  #### The Contested Philosophy (Where You Must Choose)
  The math tells you that you *must* relax a constraint. It does *not* tell you *which one*. This is where professional societies diverge, and where the literature is genuinely debated.

  1.  **Is Independence (Issue-by-Issue Voting) Sacred?**
      *   *Theorist View:* Many social choice theorists view Independence as essential to prevent manipulation and respect the separability of issues.
      *   *Practical View:* For a council making interconnected rulings, **Independence is the first candidate for sacrifice.** Why? Because logical coherence (Consistency) is more important for a rule-making body than voting on every issue in isolation.
      *   *Consensus:* There is broad agreement in applied judgment aggregation that **Premise-Based Procedures** (sacrificing Independence) are superior to **Conclusion-Based Procedures** for maintaining consistency.

  2.  **Consistency vs. Decisiveness:**
      *   *The Conflict:* Sometimes, to ensure Consistency, you might have to leave a proposition undecided (violating Decisiveness).
      *   *The Debate:* Some philosophers (e.g., Christian List) argue for "Incomplete" outcomes (abstaining as a group) to preserve consistency.
      *   *Recommendation:* For a professional society, **Consistency trumps Decisiveness** on logical consequences, but **Decisiveness trumps Consistency** on the final ruling. You must decide the case (Decisiveness), even if it means overriding the logical implication of a premise vote (sacrificing strict Logical Closure).

  3.  **Epistemic vs. Procedural Justification:**
      *   *The Debate:* Should you choose a procedure because it tracks the "truth" (Epistemic) or because it is fair (Procedural)?
      *   *Honest Assessment:* In ethics and charter interpretation, "truth" is often indeterminate. Relying on epistemic arguments ("The experts know best") can undermine the democratic legitimacy of the council. Stick to Procedural Justifications (fairness, consistency) for your bylaws.

  ---

  ### Phase 4: Relaxations and Trade-offs

  Since the List & Pettit theorem proves you cannot have it all, here is the recommended hierarchy of relaxation for a working institution:

  1.  **Relax Independence (Recommended):** Do not vote on every proposition independently. Allow the vote on a conclusion to be determined by the votes on the premises (or vice versa). This avoids the Doctrinal Paradox.
  2.  **Relax Logical Closure:** The council is not required to vote on *every* logical consequence of its decisions, only the specific propositions on the agenda.
  3.  **Relax Universal Domain (Slightly):** You may restrict the agenda. If you never vote on logically connected sets, the paradox doesn't arise. (Often impractical).
  4.  **Relax Anonymity (Last Resort):** Defer to a sub-committee. This solves the math but damages legitimacy.

  **The "Abstention" Problem:**
  Standard theory assumes binary inputs (True/False). Real life has "Abstain."
  *   *Math:* Most impossibility theorems break or require modification with abstentions.
  *   *Practice:* Treat abstentions as "not counted" for the threshold. If 10 members vote, 6 are needed for majority. If 3 abstain, 7 vote, 4 needed. *However*, for Consistency, you must ensure that the "Abstain" votes don't create a gap where $P$ is accepted, $P \to Q$ is accepted, but $Q$ is undecided.
  *   *Rule:* If premises pass, the conclusion is *deemed* passed unless a direct vote on the conclusion overrides it (see Premise-Based below).

  ---

  ### Phase 5: Scorecard of Contenders

  Here is how the standard procedures stack up against the Core Desiderata.

  | Procedure | Anonymity | Consistency | Decisiveness | Independence | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Plain Majority (Issue-by-Issue)**<br>*(Vote on P, Vote on Q, Vote on P&Q)* | **Pass** | **FAIL**<br>(Vulnerable to Discursive Dilemma) | **Pass** | **Pass** | **Reject.** High risk of contradictory rulings. |
  | **Conclusion-Based**<br>*(Vote only on the final verdict; ignore premises)* | **Pass** | **Pass**<br>(Only one proposition voted on) | **Pass** | **Pass** | **Risky.** Ignores reasoning. Members may agree on verdict for contradictory reasons, leading to instability later. |
  | **Premise-Based**<br>*(Vote on premises; conclusion derived logically)* | **Pass** | **Pass**<br>(Derivation ensures consistency) | **Pass** | **FAIL**<br>(Conclusion depends on premise votes) | **Recommended.** Prioritizes coherence. Best for charter/ethics interpretation. |
  | **Expert Subgroup**<br>*(Small committee decides for the whole)* | **FAIL**<br>(Violates member equality) | **Pass** | **Pass** | **Pass** | **Reserve.** Use only for highly technical issues, not general ethics/charter. |

  ### Final Recommendation

  1.  **Adopt a Premise-Based Procedure for Interconnected Claims.** When a motion involves logical dependencies (e.g., "Did X violate Y?" depends on "Did X do A?" and "Does A violate Y?"), vote on the factual and normative premises first. The conclusion is determined by the logical aggregation of those premises, not a separate vote.
  2.  **Sacrifice Independence.** Acknowledge in your rules that the vote on the final outcome is *constrained* by the votes on the premises. This is the only way to satisfy Consistency without a Dictator.
  3.  **Handle Ties via Chair.** To maintain Decisiveness, assign a tie-breaking vote to the Chair, but restrict its use to the final conclusion, not the premises (to preserve Anonymity on the facts).
  4.  **Formalize the "Escape Clause."** If the Premise-Based outcome is intuitively unacceptable to a supermajority (e.g., 2/3), allow a override vote on the Conclusion. This sacrifices strict Logical Closure but preserves the body's ability to correct "legalistic but unjust" outcomes.

  **Summary:** You cannot satisfy the mathematician's dream of a perfect, independent, anonymous, consistent, and decisive voting rule on connected agendas. You must choose. For a professional society, **Consistency** (avoiding contradictions) and **Anonymity** (democratic legitimacy) are your non-negotiables. **Independence** (voting on issues in isolation) is the luxury you must afford to give up.
