prompt: |-
  I'm on the rules committee for a mid-sized professional society, and we've been butting heads over how our council should make collective judgments — not just votes on motions, but actual yes/no positions on claims like "the proposed ethics policy conflicts with our charter" or "member X violated standard Y," where the claims logically hang together (if he didn't meet condition A, and A is required for a violation, then he didn't violate Y). A couple of us with philosophy backgrounds got sidetracked into the discursive dilemma — the doctrinal paradox thing where everyone votes on premises, the premises pass by majority, but the conclusion each person actually endorsed fails — and now I want to do this properly before we propose anything. So I'm asking you to wear your formal epistemologist / social choice theorist hat and write me the desiderata: what an adequate aggregation procedure for our kind of body has to deliver.

  Concretely: which cases it must handle (the premise/conclusion conflict, unidimensional vs interconnected agendas, ties, abstentions), which principles it can't violate (anonymity across council members, giving everyone's sincere judgments equal weight, the group never asserting flat contradictions, respecting the logical consequences of what the group asserts, deciding something rather than returning "no view" on every hard case), and which formal results it has to be consistent with — I gather there are impossibility theorems in this area (List and Pettigrew? I never remember the name) showing that some natural desiderata can't be jointly satisfied once the agenda is rich enough. For each requirement, give the motivating case or consideration, and tell me honestly which ones are non-negotiable for a real organization like ours versus which are theorists' prejudices imported from social choice theory without asking whether they fit judgment aggregation. Then flag any pair or subset of the desiderata that's jointly unsatisfiable, because if the list itself can't all be met, I want to know which one you'd relax for a working institution and why. Finally, a brief scorecard of the obvious contenders (plain majority voting on everything, premise-based voting, conclusion-based voting, deferring to a designated expert subgroup) against your own list — brief, the criteria are the part I care about.

  Two asks about how you write it. First, start by brainstorming the requirement list before committing to the final version, so I can see what got cut. Second — and this matters to me — keep a clean line between what's settled math and what's genuinely contested among people who work on this (e.g., whether independence is a real constraint or an artifact of the framework, whether epistemic or procedural considerations should dominate when they conflict). Don't sell me a contested stance as the consensus view; if the professionals disagree about something I've listed, say so. It doesn't need to be exhaustively hedged, just honest about where the math ends and the philosophy starts.
