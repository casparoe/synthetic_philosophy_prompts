          *   *Tone:* Formal epistemologist / social choice theorist hat, but practical for a real organization.

  2.  **Deconstruct the Subject Matter (Judgment Aggregation):**
      *   *Core Problem:* How to aggregate individual judgments on logically connected propositions into a consistent collective set.
      *   *Key Paradox:* The Discursive Dilemma (Doctrinal Paradox). Majority on premises $\rightarrow$ Consistent Premises $\rightarrow$ Logical Conclusion $C$. But Majority on $C$ directly $\rightarrow$ $\neg C$. Result: Inconsistency.
      *   *Key Theorem:* List & Pettit (2002) Impossibility Theorem.
      *   *Standard Axioms:* Universal Domain, Anonymity, Systematicity/Independence, Consistency, Completeness (Decisiveness).
      *   *Trade-offs:* You can't have them all on a connected agenda. Something must give.

