answer: |-
  **Term Paper Proposal**

  **Title:** Measurement vs. Normativity: Reinterpreting the Impossibility Theorems in Algorithmic Fairness

  **1. Research Question**
  The calibration-based impossibility results in algorithmic fairness demonstrate that, given unequal base rates across groups, it is mathematically impossible to satisfy calibration (predictive parity) and error rate parity (equalized odds) simultaneously. The prevailing interpretation in both technical and philosophical literature treats this as a "trilemma" of fairness: we are forced to make a tragic normative choice between competing ethical desiderata.

  This paper challenges that interpretation. My central research question is: **Do these impossibility results demonstrate an incompatibility of ethical values, or do they reveal a category error in the semantic interpretation of risk scores?**

  Specifically, I aim to investigate the hypothesis that the contradiction arises not from competing moral claims, but from conflating two distinct roles of the score: (1) as an epistemic measurement instrument (claiming to estimate a probability that holds consistent meaning across groups) and (2) as a pragmatic decision variable (claiming to trigger actions that yield consistent outcomes across groups). If this distinction holds, the "impossibility" is not a limit on fairness *per se*, but a limit on the dual-use validity of a single statistical object under conditions of base rate heterogeneity.

  **2. Motivation and Background**
  In the recent literature on algorithmic fairness, the impossibility theorems are frequently cited as evidence that "fairness is not a mathematical concept" or that "no single definition of fairness can satisfy all intuitions." This framing induces a kind of normative despair or relativism: if the math says we cannot be fair on all dimensions, then fairness must be purely political or context-dependent.

  While this conclusion is not strictly false, it is philosophically premature. It assumes that the constraints entering the theorem (calibration, error rate parity, base rate difference) are all of the same ontological kind—specifically, that they are all *normative* constraints. However, calibration is often defended not as a moral requirement, but as a requirement of *semantic consistency* or *measurement validity*. A calibrated score claims to represent a propensity; if that propensity means different things in different groups, the score fails as a measurement instrument.

  By treating calibration as a fairness criterion on par with error rate parity, the literature obscures the possibility that the theorem is actually diagnosing a failure of *operationalization*. The paper will argue that the standard reading conflates the *validity of the measure* with the *justice of the outcome*. Clarifying this distinction is crucial for the philosophy of science, as it pertains to how quantitative constructs are mapped onto social realities and whether mathematical constraints on those constructs should be interpreted as ethical limits or measurement limits.

  **3. Methodology and Work Plan**
  The project will proceed in three phases over the fifteen-week semester, prioritizing formal reconstruction before philosophical analysis to ensure the technical premises are secure.

  *   **Weeks 1–4: Formal Reconstruction.**
      *   I will reconstruct the proof of the calibration-based impossibility results from first principles.
      *   Goal: Produce a self-contained technical appendix that isolates exactly where the assumption of base rate difference interacts with the definitions of calibration and error rate parity.
      *   Deliverable: A formalized lemma showing which assumptions are necessary for the contradiction to hold. This ensures I am not attacking a straw man of the mathematics.

  *   **Weeks 5–9: Conceptual Analysis and Literature Review.**
      *   I will analyze the definitions used in the reconstruction through the lens of philosophy of measurement (specifically operationalism and construct validity).
      *   I will review existing philosophical and technical responses to the impossibility results to map the current interpretive landscape.
      *   Goal: Categorize existing responses into those that treat the constraints as normative (ethical trade-offs) versus those that treat them as descriptive (statistical properties).
      *   Deliverable: An annotated outline identifying the gap: the lack of a systematic treatment of the *semantic* status of the risk score.

  *   **Weeks 10–12: Developing the Alternative Framework.**
      *   I will develop the argument that calibration is a condition of *cross-group semantic stability*.
      *   I will argue that when base rates differ, demanding both semantic stability (calibration) and outcome parity (error rates) is akin to demanding a thermometer read the same temperature while simultaneously forcing the mercury to the same height in two different liquids.
      *   Goal: Formulate the "Measurement/Decision Distinction" thesis.
      *   Deliverable: A draft of the core argument sections.

  *   **Weeks 13–15: Synthesis and Revision.**
      *   I will integrate the technical reconstruction with the philosophical argument.
      *   I will address counter-arguments (e.g., that calibration is inherently normative because risk scores are never value-neutral).
      *   Goal: Finalize the paper.
      *   Deliverable: Final term paper.

  **4. Possible Conclusions and Decision Criteria**
  There are three primary outcomes this investigation might yield:

  1.  **The Distinction Holds (Preferred Hypothesis):** The analysis shows that calibration is best understood as a validity condition for the score as a measurement, while error rate parity is a condition on the decision rule. The impossibility result then shows that valid measurement does not guarantee equitable decision outcomes under base rate heterogeneity. *Decision Criterion:* If I can show that dropping calibration destroys the *interpretability* of the score (not just its "fairness"), while dropping error rate parity destroys *equity* (not interpretability), the distinction is robust.
  2.  **The Distinction Collapses:** It may turn out that in social contexts, measurement is inherently normative. If the definition of "risk" is itself constituted by social decisions, then calibration cannot be separated from fairness. *Decision Criterion:* If the literature on social ontology demonstrates that risk scores cannot be "descriptive" even in principle, my hypothesis fails, and the standard normative reading stands.
  3.  **The Point is Trivial/Existing:** It is possible that careful authors already make this distinction, and only popularizers conflate them. *Decision Criterion:* If the literature review in Weeks 5–9 reveals a robust existing tradition making this exact semantic argument, I will pivot to analyzing *why* the conflation persists despite the technical clarity.

  **5. Risk Assessment and Feasibility**
  *   **Scope Creep (Too Big):** There is a risk of getting bogged down in the technical proofs or attempting to solve the fairness problem rather than analyzing the theorem. *Mitigation:* The technical reconstruction (Weeks 1–4) is limited to the specific impossibility theorem required for the argument, not a survey of all fairness metrics. The goal is philosophical clarity, not algorithmic innovation.
  *   **Superficiality (Too Thin):** There is a risk that the "measurement vs. decision" distinction is obvious to philosophers of science and adds little value. *Mitigation:* I will ground the distinction in specific debates about construct validity to ensure philosophical depth. I will also focus on the *consequences* of the conflation (i.e., how it misdirects policy) to ensure practical relevance.
  *   **Technical Error:** As a CS student, I am comfortable with the math, but there is a risk of misinterpreting the statistical assumptions (e.g., regarding the nature of the base rate). *Mitigation:* I will cross-reference the reconstruction with multiple expositions of the theorem to ensure robustness before building the philosophical argument on top of it.

  **6. Conclusion**
  This paper aims to intervene in the growing discourse on algorithmic fairness by shifting the focus from "which fairness metric to choose" to "what kind of object is a risk score?" By reframing the impossibility results as theorems about the limits of measurement validity rather than the limits of ethical consistency, we can dissolve the false dilemma that fairness is mathematically impossible. This aligns with the course's focus on how scientific models and measurements mediate our understanding of the world, offering a case study in how mathematical constraints are often misidentified as metaphysical or ethical necessities.
