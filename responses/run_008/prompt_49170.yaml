  **LIMITED WARRANTY AND TERMS OF SERVICE FOR ACQUIRED MORAL DISPOSITIONS**

  **1.0 DEFINITION OF COVERED PRODUCT**
  1.1 The "Product" refers to any certified character trait (e.g., Honesty, Compassion, Courage) licensed to the End-User by Virtue™ Industries.
  1.2 The Product is defined as a stable disposition to act, feel, and perceive in accordance with ethical norms, subject to the exclusions herein.

  **2.0 CONDITIONS OF PERFORMANCE AND EXCLUSIONS**
  2.1 **Time-Sensitivity Exclusion:** The Licensor expressly disclaims liability for Product failure during periods of perceived time pressure. If the End-User is operating under the belief that they are late for a prior commitment, particularly one involving moral instruction, the Product may enter Sleep Mode.
  2.2 **Environmental Priming:** Coverage is void if the End-User has recently encountered minor positive stimuli (e.g., finding a coin in a phone booth) or negative stimuli (e.g., ambient noise exceeding 85 decibels). The Product assumes a neutral baseline rarely found in natural habitats.
  2.3 **Bystander Deductible:** In scenarios involving multiple witnesses, the End-User is responsible for a deductible proportional to the number of observers present. The Product's activation threshold increases logarithmically with crowd size.

  **3.0 CROSS-SITUATIONAL CONSISTENCY**
  3.1 **Aggregate Warranty:** The End-User acknowledges that the Product is not warranted to manifest in any single isolated instance. Validity is determined only over a statistically significant aggregate of behaviors across diverse contexts.
  3.2 **Predictive Limitation:** Possession of the Product does not guarantee predictive accuracy for specific actions. A failure to act in Context A does not constitute a defect if performance in Contexts B through Z remains within normative parameters.

  **4.0 DISCERNMENT AND PRACTICAL WISDOM**
  4.1 **Non-Action Clause:** The Licensor reserves the right to determine that apparent Product failure was actually a feature of Practical Wisdom (Phronesis). If the Product discerns that the situation does not merit intervention, or that intervention would be counterproductive, withholding action is not a breach of warranty.
  4.2 **Contextual Recognition:** The Product includes a sub-routine for recognizing ethical salience. Failure to notice a moral demand is covered only if the End-User has completed the requisite cultivation period. Uncultivated Units are not covered under this agreement.

  **5.0 DISPUTE RESOLUTION AND JURISDICTION**
  5.1 **Forum Selection:** Any disputes regarding Product efficacy shall be adjudicated in the environment most flattering to the Product's design specifications. Laboratory settings with high ecological validity are preferred; artificial constraints are grounds for dismissal.
  5.2 **Burden of Proof:** The burden lies with the Claimant to demonstrate that the End-User was not experiencing internal conflict, fatigue, or competing moral obligations at the time of alleged failure.

  **6.0 DURATION AND TRANSFERABILITY**
  6.1 The Product is non-transferable and requires lifelong maintenance. It cannot be downloaded instantaneously. Attempts to acquire the Product via intensive weekend workshops void all warranties.
  6.2 This agreement supersedes all prior understandings regarding the unity of virtues. Possession of Courage does not imply possession of Temperance.

  **7.0 LIMITATION OF LIABILITY**
  7.1 IN NO EVENT SHALL VIRTUE™ INDUSTRIES BE LIABLE FOR CONSEQUENTIAL DAMAGES RESULTING FROM THE END-USER'S ASSUMPTION THAT CHARACTER IS A FIXED ENTITY RATHER THAN A DYNAMIC INTERACTION BETWEEN PERSON AND ENVIRONMENT.

  ***

  **Author's Note**

  The "Time-Sensitivity Exclusion" (2.1) and "Environmental Priming" (2.2) rely on the Darley & Batson Good Samaritan study and the Isen & Levin phone booth study, respectively; both have faced replication challenges and criticism regarding effect sizes. The "Bystander Deductible" (2.3) references Latane & Darley, which holds up better but is context-dependent. The "Discernment" clause (4.1) leans on a Aristotelian reading of *phronesis*, though some virtue ethicists would argue that a true virtue cannot fail to perceive salient moral facts, making the "non-action" defense a contentious interpretation of actual virtue rather than a commercial product. The single liberty I am least confident about is Clause 3.1; while situationists argue traits are weak predictors, most modern virtue ethicists do not claim traits guarantee behavior in every instance, so the warranty's admission that single instances don't count may concede more to situationism than a real Aristotelian would feel necessary.
