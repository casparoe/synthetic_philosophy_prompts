prompt: |-
  Quick question about the Epicurus death argument. As I understand it, the whole thing turns on there being no subject left once you're dead -- no one around for the harm to happen to, so death can't be bad for you. And then Nagel comes along and says no, death is bad because it deprives you of the goods you would have enjoyed had you lived longer. But that just seems like changing the subject? Like he's not actually answering the argument, he's answered a different question about life being good rather than death being bad. Plus the deprivation account has this weird feature where the badness floats free of any particular time -- nobody is worse off at any moment, past, present or future, yet somehow the death is still bad for you. So basically: given that the deprivation crowd can never point to a moment where you're actually suffering the harm, why is the deprivation account treated as the standard reply to Epicurus instead of as a concession to him? Also, is the Lucretius symmetry point (we don't fear the endless time before our birth, so we shouldn't fear the endless time after death) genuinely a seperate argument, or is it just the same no-subject point restated in fancier clothes? Please answer in plain continuous prose, no bullet points or headings or anything, just like a normal email.
