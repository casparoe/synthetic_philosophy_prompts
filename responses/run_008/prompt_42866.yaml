      *   *Addressing the "Changing the Subject" critique:* I should validate the user's intuition. It *does* feel like shifting the goalposts. But the philosophical consensus is that Epicurus' definition of harm is too narrow. Nagel expands it. So it's a rebuttal, not a concession, because it attacks the underlying theory of value.
      *   *Addressing the "Floating Badness":* This is the "time of harm" problem. Nagel admits it's odd but says goods and bads don't always need a temporal location relative to the subject's consciousness. For example, betrayal is bad even if you don't know about it. Death is similar.

