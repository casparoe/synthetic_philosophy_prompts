  **Research Prospectus: The Validity of Contrastive Explanation in the Great Divergence**

  **1. Research Question and Problem Statement**

  The central question of this project is: *What criteria determine whether a contrastive explanation request in history is well-posed, and does the Needham Question (or the broader Great Divergence debate) satisfy these criteria?*

  Historical explanation is frequently contrastive. We rarely ask "Why did the Industrial Revolution happen?" in a vacuum; we ask "Why did it happen in Britain *rather than* China?" or "Why in the eighteenth century *rather than* the twelfth?" However, the legitimacy of the contrast class—the set of alternatives against which the actual outcome is compared—is often assumed rather than defended. My friend's objection during our debate highlights a critical methodological vulnerability: if the alternative (e.g., an Chinese Industrial Revolution) was never a genuine live possibility given the structural conditions, then the question "Why Britain and not China?" may be a category error, akin to asking why a dolphin did not climb a tree.

  Yet, as I countered, rejecting contrastive questions where the alternative was not a metaphysical certainty risks paralyzing historical inquiry. We routinely ask why the Allies defeated the Axis, even if, at certain points, an Axis victory was statistically improbable. We ask why one candidate got a job over another, even if one was objectively more qualified. There is a line between a "false contrast" (the dolphin) and a "robust contrast" (the job candidates), but the philosophy of history lacks a clear set of criteria for drawing it.

  This project seeks to establish those criteria. It will move beyond the stalemate between the "Eurocentric critique" (which dismisses the Needham Question as teleological) and the "pragmatist defense" (which accepts any question that yields heuristic value). Instead, I propose to develop a framework based on *explanatory symmetry* and *causal commensurability*. Once established, this framework will be applied to the Great Divergence literature to determine whether the debate is fundamentally well-posed or if it rests on a methodological fiction.

  **2. Existing Positions and the Theoretical Gap**

  Current discourse on the Great Divergence generally falls into two camps, neither of which adequately addresses the logical structure of the question itself.

  *   **The Eurocentric/Teleological Critique:** Proponents of this view argue that asking why China "failed" to industrialize presupposes that industrialization was a natural or inevitable stage of development that China missed due to some deficiency. This position suggests the question is ill-posed because it imposes a European trajectory as a universal norm. It treats history as a single race on a single track. The implication is that the contrast class {Europe, China} is invalid because China was not "running the same race." However, this critique often lacks a formal account of *when* a comparison becomes teleological. It risks throwing out all comparative history by treating any deviation from local context as Eurocentrism.
  *   **The Pragmatist/Counterfactualist Defense:** On the other side, many economic historians and philosophers of history argue that counterfactuals are indispensable tools. From this perspective, the validity of the question depends on its utility. If contrasting Britain and China helps isolate causal variables (like coal, institutions, or wages), then the question is valid, regardless of whether China was "destined" to industrialize. This position relies on a "shrug" theory of methodology: as long as the comparison yields insights, the metaphysical status of the alternative doesn't matter.

  **The Gap:** Both positions rely on intuition rather than criteria. The critique says "it's a race, and that's wrong," while the defense says "it's a tool, and it works." Neither explains *why* the Allies/Axis contrast feels valid while the Dolphin/Tree contrast does not. We need a middle position that defines the conditions under which two distinct historical trajectories can be treated as members of the same contrast class without imposing teleology. My project will argue that a contrast is well-posed only if there exists a *shared causal vocabulary* capable of explaining both the actual outcome and the counterfactual alternative.

  **3. Methodology: Contrast Classes and Relevance Relations**

  To solve this, I will adapt Bas van Fraassen's theory of contrastive explanation for the specific needs of macro-historical inquiry. Van Fraassen argues that a "why-question" is only meaningful relative to a contrast class and a relevance relation. I will expand this into two concrete criteria for historical comparison:

  1.  **Causal Commensurability:** For a contrast {X, Y} to be valid, there must be a set of explanatory variables that could theoretically apply to both X and Y. If the explanation for X relies on variables that are ontologically absent in Y, the contrast is ill-posed. For example, if the explanation for British industrialization relies on "parliamentary property rights," but Qing China lacked any institutional analogue to "parliamentary property rights," then using that variable to explain the divergence might be a category error. However, if the variable is abstracted to "security of capital," and both had distinct mechanisms for this, the contrast holds.
  2.  **Epistemic Symmetry:** The alternative outcome must have been epistemically accessible to historical actors or at least reconstructible without hindsight bias. This addresses the "dolphin" objection. A dolphin never climbed a tree not because of a specific historical contingency, but because its biological teleology excludes it. In history, we must distinguish between *structural impossibility* (the dolphin) and *contingent non-occurrence* (the Allies losing).

  **Stress-Testing the Framework:**
  I will not test these criteria against toy examples (like ravens or writing desks) but against the actual historiography of the Great Divergence. I will select three dominant explanatory clusters from the literature:
  *   **Geographic/Materialist:** (e.g., coal deposits, New World colonies).
  *   **Institutional:** (e.g., property rights, rule of law).
  *   **Cultural/Epistemic:** (e.g., Enlightenment norms, scientific methodology).

  For each cluster, I will ask: Does this explanation treat China as a valid counterfactual? Does it assume a shared causal vocabulary? For instance, the "High Wage Economy" argument suggests Britain industrialized because labor was expensive and energy cheap. Was this contrast well-posed? Yes, because wages and energy prices are commensurable variables in both Britain and China, even if the values differed. Conversely, an explanation relying on "European rationality" might fail the commensurability test if it treats rationality as a unique European ontology rather than a variable human capacity.

  **4. Scope and Feasibility Assessment**

  **Target Length:** 6000 words.
  **Honest Assessment:** Attempting to build a general philosophical theory of contrastive explanation *and* apply it comprehensively to the entire Great Divergence debate is likely unrealistic for 6000 words. The Great Divergence literature is vast, and the philosophy of explanation is dense. Doing both justice risks producing a paper that is superficial on the philosophy or reductive on the history.

  **Proposed Mitigation:** To ensure the project is feasible within the word limit, I will narrow the historical application. Instead of surveying the entire Great Divergence debate, I will focus on **one specific causal mechanism** as a case study for the philosophical framework. I propose using the **coal and colonies argument** (associated with the geographic/materialist cluster). This is the most concrete, data-driven subset of the debate, making it easier to assess whether the variables are truly commensurable.

  If I attempt to cover institutions, culture, *and* geography, the paper will exceed the word count or lose analytical depth. By focusing on the materialist argument, I can demonstrate the philosophical criterion in action without getting bogged down in encyclopedic historiography. The philosophical theory will remain general, but the *validation* of that theory will be anchored in this specific case study.

  **5. Possible Conclusions**

  The project allows for three distinct outcomes, all of which are philosophically substantive:

  1.  **The Question is Well-Posed (with qualifications):** I may find that the materialist explanations (coal, colonies) satisfy the criteria of causal commensurability. Both Britain and China had access to energy constraints and land limitations, making them valid comparators. This would vindicate the core of the economic history debate while filtering out more teleological cultural explanations.
  2.  **The Question is Ill-Posed (The Friend's Victory):** I may find that even the materialist arguments rely on hidden teleological assumptions. For example, if "access to coal" is only explanatory because we assume industrialization is the *goal*, then the contrast class collapses. If China's economic path was a stable equilibrium that *did not require* industrialization to be successful, then asking why it didn't industrialize is indeed like asking why a dolphin didn't climb a tree. This would be a significant result, validating the Eurocentric critique on logical rather than political grounds.
  3.  **The Question is Pragmatically Valid but Metaphysically False:** I may conclude that the question is technically ill-posed (China was not a live possibility in the strong sense) but remains heuristically indispensable. This would be a "fictionalist" account: we treat the contrast as real because it organizes data effectively, even if it misrepresents the modal structure of history.

  **6. Conditions for Project Failure**

  This project would fail if:
  *   **The Criteria are Vague:** If "causal commensurability" turns out to be just as subjective as the "vibes" I am trying to replace, the philosophical contribution collapses. I must define commensurability rigorously (e.g., via variable abstraction levels).
  *   **The Historical Application is Strawmanned:** If I misrepresent the economic history arguments to make them fit my philosophical criteria, the interdisciplinary bridge fails. I need to engage with the strongest version of the divergence arguments.
  *   **Scope Creep:** If I try to solve the Great Divergence rather than analyzing the *question* of the Great Divergence. The paper must remain meta-historical, not historical.

  **7. Chapter Outline (Provisional)**

  1.  **Introduction (750 words):** The Needham Question, the debate context, and the thesis statement (the need for criteria of well-posedness).
  2.  **The Philosophy of Contrastive Explanation (1500 words):** Van Fraassen's framework, the problem of the contrast class, and the proposal of "Causal Commensurability" and "Epistemic Symmetry."
  3.  **The Great Divergence as a Test Case (1500 words):** Overview of the debate not as history, but as a set of explanatory claims. Focus on the materialist/geo-economic cluster.
  4.  **Application and Analysis (1500 words):** Applying the criteria to the coal/colonies argument. Does it treat China as a dolphin or a job candidate?
  5.  **Implications and Conclusion (750 words):** What this means for economic history methodology. Is the question broken, useful, or valid?

  **8. Final Feasibility Note**

  I am confident that 6000 words is sufficient for the *narrowed* scope (General Theory + One Causal Cluster). If I attempt to include the institutional and cultural debates, I will likely need to cut the philosophical section, which would undermine the core contribution. Therefore, the success of this paper depends on disciplined restraint in the historical section. I will treat the economic history not as the subject of inquiry, but as the data set for testing the philosophical model.

  This approach ensures that I answer the prompt's core demand: moving beyond the "vibes" of the debate to a methodological assessment of whether the question itself deserves to be asked. If my friend is right, this paper will prove it on logical grounds. If I am right, it will show why. Either way, the "why X and not Y" structure of historical inquiry will be better understood.
