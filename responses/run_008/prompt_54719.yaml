      *   The trickiest part is interpreting the *essay's* intent based *only* on the summary provided. I need to be careful not to strawman the essayist while critiquing the summary's representation of the literature.
      *   *Least Certain Point:* The interpretation of the essay's final move. Is it arguing for Eliminativism (Dennett style) or just confused Epiphenomenalism? The summary says "qualia... simply don't exist." That sounds like Eliminativism. But the premise is "consciousness does no causal work." Usually, causal inefficacy leads to Epiphenomenalism, not Eliminativism, unless one adopts a causal theory of existence. I need to flag this distinction as the area of highest ambiguity.

