      *   **Constraint:** "I'd rather have an answer I don't like than a survey of the positions, we've done that already." (Crucial: Do not just rehash Whelan, Goodin, López-Guerra, etc. Focus on diagnosis and path forward.)

  2.  **Deconstruct the Impasse:**
