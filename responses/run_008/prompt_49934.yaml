      *   *Emphasis:* Highlight the All-Affected group's distinction between *ideal* and *pragmatic*. That is the smoking gun. It proves they know their principle doesn't fit the institution.
      *   *Actionable Advice:* Tell them to stop testing against "who should vote" and start testing against "what obligation does the state owe this person?"

  8.  **Final Polish:** Check against constraints. No survey of positions. Direct answer. Honest about whether it will stay stuck. (It will stay stuck if they don't change the frame).

  **(Self-Correction Note):** Make sure to address the "future generations" point specifically, as the user highlighted it. That is the clearest evidence that All-Affected is not about voting eligibility (since dead people can't vote), but about intergenerational justice.

