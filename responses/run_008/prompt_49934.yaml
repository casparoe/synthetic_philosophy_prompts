answer: |-
  Here is the diagnosis: **You are not having a verbal dispute, but you are committing a category mistake regarding institutional function.**

  You are stuck because you are trying to use a single mechanism (the franchise) to solve two distinct normative problems: **political legitimacy** and **distributive justice**.

  ### 1. The Diagnosis: Legitimacy vs. Justice

  The reason your group converges on "permanent residents" in practice is that the **All-Subjected** and **Stakeholder** views are theories of *political legitimacy*. They answer the question: "Who must authorize the coercive power that binds them?" To maintain a stable system of self-government, the answer must be a bounded, stable group capable of reciprocal deliberation. That is why tourists and future generations get excluded in practice; they cannot participate in the reciprocal loop of justification and accountability that makes democracy work as a *system of rule*.

  The **All-Affected** view, however, is a theory of *distributive justice*. It answers the question: "Whose interests must be weighted equally in the moral calculus?" When your All-Affected colleagues insist their principle holds ideally even for future generations or distant foreigners, they are admitting that **voting is the wrong metric for their claim.** You cannot give a vote to a non-existent person or a non-resident without destroying the legitimacy loop the other two groups care about.

  The disagreement isn't about who is in the demos. It's about what the demos *is for*.
  *   **Subjected/Stakeholder:** The demos is the *author* of the law.
  *   **Affected:** The demos is the *audience* of the law.

  You are conflating **constituent power** (who makes the rules) with **moral standing** (who matters). The convergence on permanent residents happens because that is the only group that satisfies *both* conditions simultaneously in a Westphalian state system. But that convergence is a contingent fact of current geopolitics, not a theoretical resolution.

  ### 2. Why the All-Affected Camp Feels Different

  You noted that the All-Affected group's refusal to back off on ideal theory "doesn't look verbal." You are right. It looks substantive because it *is* substantive, but it is substantive about **remedial obligations**, not **membership**.

  When an All-Affected proponent says future generations deserve a say, they are not literally arguing for time-traveling ballot boxes. They are arguing that the current demos has a *fiduciary duty* to those generations. When they say foreigners affected by carbon policy deserve a say, they are arguing for *transboundary accountability mechanisms* (treaties, courts, human rights regimes), not necessarily enfranchisement in a specific national election.

  The dispute stays stuck because the other two groups hear "vote" and the All-Affected group means "consideration." As long as you frame the boundary problem as "Who gets a ballot?", the All-Affected view will always look absurd in hard cases (future people can't vote), and the All-Subjected view will always look too narrow (what about externalities?).

  ### 3. What Counts as Progress?

  Do not look for a decision procedure that selects the "correct" boundary. There isn't one, because the "boundary of the demos" is not a natural kind waiting to be discovered; it is a design choice dependent on what good you are prioritizing.

  Progress will only happen if you make the following three moves:

  **A. Decouple Standing from Voting**
  Stop asking "Who is entitled to a say?" and start asking "What mechanism tracks this person's interest?"
  *   If the interest is **coercion**, the mechanism is **voting** (All-Subjected).
  *   If the interest is **welfare/impact**, the mechanism is **rights protection/representation** (All-Affected).
  *   *Progress Marker:* The group agrees that a foreigner affected by carbon policy might not need a *vote* in your election, but your government owes them *justification* via international law. That resolves the "tourist" counterexample without narrowing the principle.

  **B. Accept the "Second-Best" Reality**
  Acknowledge that the nation-state is a "second-best" vessel for democratic theory. The All-Subjected view works for the state; the All-Affected view works for the globe.
  *   *Progress Marker:* Someone explicitly says, "The All-Affected principle is true, but it requires global institutions we don't have. Therefore, within the state, we use All-Subjected as a proxy." This moves the debate from *truth* to *feasibility*, which is where your practical convergence is actually coming from.

  **C. Change the Test Cases**
  Stop using "tourists" and "airport security." These are edge cases that allow for ad hoc exceptions. Use cases where the interests structurally diverge.
  *   *Test Case:* **Sovereign Debt Restructuring.** The citizens are subjected (austerity), but the foreign bondholders are affected (loss of value). Who decides?
  *   *Test Case:* **Pandemic Border Closures.** The citizens are protected, the foreigners outside are affected (stranded, economic loss).
  *   *Progress Marker:* If you can agree that in Debt cases the *Subjected* decide, but in Pandemic cases there is a *duty of care* to the Affected (even without a vote), you have differentiated the principles rather than forcing them to converge.

  ### 4. Will It Stay Stuck?

  **Yes, if you keep asking "Who is the demos?"**
  That question presupposes there is a single, coherent group that fulfills all democratic values simultaneously. There isn't. The "People" is a fiction that papers over the gap between those who rule and those who are impacted.

  **No, if you ask "What obligations does the decision-making body owe to different classes of persons?"**
  This dissolves the boundary problem into a set of specific institutional design questions. You might find that some people get votes (residents), some get legal standing (affected foreigners), and some get trustee representation (future generations).

  **The Hard Truth:**
  Your group is likely unwilling to make this shift because it admits defeat on the classic question. It admits that "The Demos" is not a unified thing. But that is the only way out. The All-Affected proponents are morally right about the scope of justice; the All-Subjected proponents are practically right about the scope of agency. You are trying to force them to be the same person. They aren't.

  Stop trying to draw the line. Start mapping the obligations.
