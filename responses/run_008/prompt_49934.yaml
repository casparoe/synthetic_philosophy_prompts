  3.  **Evaluate the Three Hypotheses:**
      *   *Hypothesis A: Verbal Dispute.* (Are we just defining words differently?)
          *   Pros: Explains the convergence on cases.
          *   Cons: Doesn't explain the All-Affected insistence on ideal theory. They care about the *reason*, not just the result.
      *   *Hypothesis B: Substantive Moral Disagreement.* (Do we disagree on who matters?)
          *   Pros: Captures the All-Affected idealism.
          *   Cons: If everyone agrees on the *cases* (permanent residents), where is the moral friction? It's latent, not active.
      *   *Hypothesis C: Category Error/Different Questions.* (Are we answering Voting vs. Standing vs. Coercion?)
          *   Pros: Explains why "stakeholder" feels different from "subjected."
          *   Cons: The group is explicitly trying to answer *one* question ("Who is the demos?").

  4.  **Develop the Diagnosis:**
      *   It's not *just* verbal. It's a confusion of *levels of justification* vs. *levels of implementation*.
      *   The "All-Subjected" and "Stakeholder" folks are arguing from *legitimacy of coercion* and *functional stability*. They are asking: "What unit can sustain a democratic decision?"
      *   The "All-Affected" folks are arguing from *moral equality*. They are asking: "Whose interests count morally?"
      *   The convergence on "permanent residents" happens because that's the only institutional vessel currently available to hold *any* of these ideals.
      *   *The Real Disagreement:* It's about **Remedial Obligations** vs. **Constitutive Membership**.
          *   All-Subjected/Stakeholder: The demos is the group that *constitutes* the authority.
          *   All-Affected: The demos is the group to whom authority is *accountable*.
      *   The All-Affected camp isn't wrong to say their principle stands ideal. They are arguing for *external accountability mechanisms* (human rights, international law) rather than *internal voting rights*. The others are arguing for *internal voting rights*.
      *   *Diagnosis:* You are arguing about **Institutional Design** (who gets a ballot) while pretending to argue about **Moral Standing** (who matters). The All-Affected principle is a principle of *justice*, not a principle of *voting eligibility*.

  5.  **Determine What Counts as Progress:**
      *   Stop trying to find the "True Demos." There isn't one.
      *   Shift the question from "Who is in?" to "What mechanism fits which claim?"
      *   *Specific Move:* Distinguish between *Membership* (voting) and *Consideration* (rights/interests).
      *   *Test Case:* Don't use "tourists." Use "Transboundary Pollution" or "Debt Restructuring."
      *   *Progress Indicator:* If the group can agree that All-Affected claims should be handled by *courts/treaties* rather than *ballots*, while All-Subjected claims are handled by *ballots*, you've moved forward.
      *   *Honest Truth:* The debate stays stuck if you insist on a single criterion for a single institution (the ballot box).

