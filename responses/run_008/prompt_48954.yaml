          *   *Bayesian Adoption:* Growing, but not a panacea. Some argue Bayes is better for accumulation of evidence, others worry about subjectivity.
          *   *Significance Thresholds:* Is 0.05 the problem, or the dichotomization?

      *   **Synthesis/Verdict:**
          *   Student: Right that NHST is often misused, wrong that it's the *sole* cause and wrong about what Bayes guarantees.
          *   Friend: Right about incentives, right about manipulability.
          *   Overall: The crisis is socio-technical, not just technical.

      *   **Actionable Advice for a 2nd Year Student:**
