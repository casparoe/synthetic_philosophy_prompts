      *   It's important to note that TFT is *not* an ESS. A cluster of "Always Cooperate" can invade TFT (since they get the same payoff against TFT), and then "Always Defect" can invade "Always Cooperate." This creates cycles. Trust isn't permanent. This directly addresses the user's third doubt.

  7.  **Refining the "Noise" Issue:**
      *   In computer tournaments, moves are clear. In construction, a delay might be a supply chain issue (noise) or cutting corners (defection). TFT treats them the same. This leads to unnecessary feuds. "Generous Tit-for-Tat" or "Contrite Tit-for-Tat" is better.

