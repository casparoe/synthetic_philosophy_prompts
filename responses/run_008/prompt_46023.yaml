      *   *Claim 1: Game theorists were proven wrong; cooperation is rational after all.*
          *   *Truth:* Game theorists weren't wrong about the one-shot Prisoner's Dilemma (PD). Defection is the dominant strategy there. Axelrod showed cooperation is rational in the *Iterated* Prisoner's Dilemma (IPD).
          *   *Nuance:* The "shadow of the future" changes the math.
          *   *Verdict:* The chapter is sloppy. It conflates one-shot and repeated games.

      *   *Claim 2: Tit-for-Tat (TFT) won because it is "decent" (never strikes first, holds no grudges).*
          *   *Truth:* TFT *is* nice (never defects first), provokable (retaliates), and forgiving.
          *   *Nuance:* It won *in that specific tournament environment*. It isn't "goodness"; it's strategic clarity. It prevents exploitation.
          *   *User's Observation:* "People who never strike first... finish last." This is true if the opponent is a predator and there's no exit option. TFT retaliates, which the chapter downplays as "decency."
          *   *Verdict:* Partially true but romanticized. TFT isn't a saint; it's a bouncer.

      *   *Claim 3: Evolutionary simulation shows cooperation becomes permanent/universal.*
          *   *Truth:* TFT is robust, but not an Evolutionary Stable Strategy (ESS) in the strict sense. It can be invaded by "Always Cooperate" (which does equally well against TFT but worse against defectors), and then "Always Defect" can invade "Always Cooperate." Also, noise (errors) kills TFT (feuds spiral).
