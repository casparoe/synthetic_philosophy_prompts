  My brother and I have been going at this for like six months and finally decided to just put numbers on it, so here goes. My credence that the repugnant conclusion is actually acceptable — that a world with a truly enormous number of people living lives barely worth living can be BETTER than a world with a much smaller population of very happy people — is around 0.7. His is maybe 0.1. To be clear, I'm not asking whether total utilitarianism implies it, that part is basically arithmetic and I don't want to relitigate the derivation. I'm asking whether the conclusion itself, all things considered, is true — i.e. whether our gut reaction of "ugh, no" should be trusted as evidence about which world is better.

  Give me your number, but the number is honestly the least interesting part — what I want is the decompisition. My own has at least these pieces: (1) whether well-being aggregates additively across persons at all, or whether there's some non-additive structure once populations differ enough in size; (2) whether a life barely above the neutral point is really worth living in the sense that matters, or whether people just misreport this because zero-welfare feels different from the inside; (3) whether the known escape routes (average views, critical-level views, person-affecting restrictions on who counts) can dodge the conclusion without buying something worse — like the conclusion that adding lives of negative welfare can beat adding positive ones, or the various impossibility results suggesting no view avoids every paradox; and (4) whether finding a conclusion "repugnant" is even evidence about axiology, or just scope insensitivity / status-quo bias in our intuitions, in which case the reaction should be discounted the way we discount squirming at huge numbers.

  So: rough probability for each piece, one line of justification, then tell me how they combine into your final number — or, if you think the question doesn't factorize like that, say why and what you'd do instead. Then the two things I actually care most about: which piece do you think my brother and I most likely disagree about, given his 0.1 and my 0.7? And which single argument or thought experiment, if it landed for you, would move your number the most and in which direction? Don't give me the "reasonable philosophers disagree" shrug, I want your actual weak points marked.
