          1.  *Theological:* Such a universe violates PSR. God would have no reason to put sphere A *here* and sphere B *there* rather than vice versa. Therefore, this universe is impossible (metaphysically, not just physically).
          2.  *Metaphysical:* In Leibniz's system, substances aren't just "spheres." They are mirrors of the universe. If the universe is empty except for them, they aren't Leibnizian substances because they don't express a complex whole. A Leibnizian substance *must* have an internal perspective. If they are truly identical internally, they are the same substance.
      *   *Does it bite?* Only if you accept Black's metaphysics (material objects in absolute space) and reject Leibniz's (monads/substances expressing the whole). Black attacks the *conceivability* of IoI. Leibniz attacks the *possibility* of the scenario.
      *   *Key Distinction:* Black assumes space is a container. Leibniz assumes space is a relation between substances. For Leibniz, "empty space" is incoherent.

