prompt: |-
  Ok so last night my friend Maya and I had a long argument that I think we ended by talking completely past each other, and now I want to settle it properly. It started because she said that "water is H2O" could have turned out to be false, and I said no, it's necessary, Kripke settled this — and she said "that's exactly the confusion two-dimensional semantics was invented to diagnose" and then it went downhill from there for like two hours. At some point I realized we might just mean different things by "could have turned out," and that we'd each probably end up in different corners of the 2D debate if we actually mapped them out. So here's what I want.

  Please act as a professional philosopher of language who specializes in two-dimensional semantics and has taught it a lot. Think carefully before writing anything — I'd like you to actually brainstorm the logical space first (what are the independent questions that split the positions?), then locate the actual positions in that space, and only then write the quiz. Don't just list famous names and their views encyclopedia-style; build it from the questions up, since that's the whole point of a sorting instrument.

  The deliverable: a "which 2D position do you actually hold?" quiz for me, Maya, and our reading group (all advanced undergrads, so they know Kripke and Twin Earth but not much beyond that). 8 or 9 questions, each one a concrete case with two or three answer options, phrased so someone can answer it without knowing which position it leads to. The point is to sort people by what they say about cases, not by which label they like — so absolutely no question that just asks "do you accept epistemic two-dimensionalism?"

  The cases have to include at least these, plus whatever else you think does real sorting work:

  1. The 1750 Twin Earth case: Twin Oscar, on a planet where the clear drinkable stuff in the rivers is XYZ instead of H2O, thinks "water is the stuff in the rivers around here." Did he thereby think something true? (This one is where Maya and I got stuck, so make it do heavy lifting.)
  2. A "could have turned out otherwise" case — some version of "suppose the stuff in the oceans had turned out on closer inspection not to be H2O; was there ever a genuine possibility being described there, and if so, what kind?"
  3. Something about the informativeness of "Hesperus is Phosphorus" that separates people who treat that as needing two different propositions from people who don't.
  4. Something involving an obviously a priori truth (like "I'm not a tree" or whatever's actually apt) to test whether someone thinks the primary/epistemic intension apparatus captures all a priori knowledge or only some of it.

  Then a scoring key that maps answer patterns onto leaves. The leaves I want as options: Kaplan-style character/content (if it even belongs on this tree — tell me if it's really a bystander), epistemic two-dimensionalism in the Chalmers mold, Jackson's version if you can seperate it from Chalmers's (and if you can't, say so rather than pretending the quiz does it), Stalnaker's counterfactual/diagonal version, and the Soames-style rejection of the whole 2D apparatus as an answer to the question it claims to answer.

  Two things I really want you to do and not skip: (a) flag honestly which pairs of leaves the quiz cannot separate — like if no case cleanly divides Chalmers from Jackson, just tell me that instead of inventing a fake discriminating question; and (b) if some combination of answers to your branching questions corresponds to no real position, note it and briefly diagnose why nobody's there (incoherent? unattractive? just unexplored?).

  One more thing: keep the answer options neutral in wording — don't let the option that leads to the "correct" view (whatever that is, lol) sound smarter or more cautious than the others, or Maya will accuse me of rigging it, and honestly she'd be right. Take your time and get the details right; I'd rather have it late and careful.
