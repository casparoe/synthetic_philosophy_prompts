  ### Disanalogies That Matter

  Most disanalogies here are cosmetic (e.g., code is text, morals are feelings), but two are load-bearing. First, **agency**: software implies a programmer who *could* have intended truth, whereas natural selection is blind. If there was never an intent to track truth, the default assumption of reliability is weaker than in legacy code where intent is merely lost. Second, and more critically, **the test function**: in software, tests are ideally proxies for the requirements document. In evolution, the "test" (survival) is a proxy for reproductive fitness, which may be orthogonal to moral truth. If the test function does not correlate with the requirements, passing the test proves nothing about correctness. This is the only disanalogy that actually drives the debunking conclusion; the absence of a programmer matters only insofar as it explains why the tests weren't aligned with truth in the first place.

  ### The Extra Premise and the Reflexivity Trap

  In software, provenance doesn't establish incorrectness because we assume the selection environment (the tests) correlates with the requirements. For the genealogy to become debunking, the book needs this extra premise: **The evolutionary process was insensitive to moral truth (i.e., it would have produced the same intuitions even if moral truth were different).**

  This premise is difficult to establish without triggering a self-defeat objection. If evolutionary pressures shaped all human reasoning capacities—including the cognitive tools used to construct the debunking argument—then the debunker's own reasoning is subject to the same genealogical explanation. If genealogy debunks moral realism, it arguably debunks the reasoning used to conclude that moral realism is false. The analogy actually *hurts* the book here: in software, if you discover the compiler was compromised (insensitive to truth), you cannot trust the analysis tool compiled by that same compiler. The debunker must argue that logical reasoning tracks truth in a way moral intuition does not, but if both are legacy modules from the same build process, that distinction is hard to maintain.

  ### A Better Analogy

  A more precise analogy is a **genetic algorithm optimized for a proxy metric**: imagine code evolved to maximize server uptime (survival) that accidentally develops a subroutine looking like a security audit (morality); the subroutine exists because it aided uptime, not because it accurately identifies vulnerabilities (truth), so trusting its audit reports is unjustified even if the code is functional.

