prompt: |-
  I'm a software engineer with no formal background in philosophy. I've been reading a popular book arguing against moral realism — roughly, the view that some moral claims are objectively true — and its central argument is one I've translated into my own terms, because at bottom it's a claim about legacy code. As the book tells it, our moral intuitions are like a legacy codebase: nobody wrote them to a spec that said "track moral truth." They were produced by a process — natural selection — that only ever ran the tests of survival and reproduction and kept whatever got itself copied into the next generation. Once you can explain every module by its commit history — why this loyalty routine exists, why that disgust check sits where it sits — you have a complete causal explanation that never mentions what the code should have said. The book's punchline is that once the beliefs can be explained entirely without reference to their truth, they have been explained away: trusting them is like trusting a function just because it's old.

  I can feel the force of that, but it clashes with something I know from work. We have legacy modules whose entire causal history can be told without any mention of the requirements document, and they are nonetheless correct; explaining why a function exists is not the same as showing that it computes the wrong thing. So I genuinely don't know whether the analogy supports the book's conclusion — that moral realism is in trouble, or at least that our moral judgments deserve no default trust — and I'd like a proper audit rather than my own guesswork.

  Please do the following, in order.

  1. A correspondence table with exactly these columns: "Source (software)", "Target (morality)", "Mapping holds?" (yes / strained / breaks), "Load-bearing for the debunking conclusion?" (yes / no), and "Notes". Include one row for each of: the programmer (or the absence of one), the requirements document, the tests, the commit history, the code itself, technical debt, refactoring, and the archaeologist who explains it all afterwards.

  2. A short prose section separating the disanalogies that actually matter for the conclusion from the ones that are merely interesting.

  3. An answer to the question that bothers me most: in software, an explanation of provenance never by itself establishes incorrectness. So what extra premise does the book need for genealogy to become debunking, and can it get that premise without also applying it to the debunker's own reasoning — which was, after all, produced by the same legacy process? If the answer is that the premise needs the selection process to be insensitive to truth (it would have produced much the same code whatever the spec said), tell me whether the analogy helps or hurts in establishing that.

  4. If the analogy fails or only half-carries the conclusion, propose a better one if there is one.

  Close with a JSON object and nothing after it, using this schema:
  {
    "analogy_verdict": "holds" | "holds_with_caveats" | "fails",
    "conclusion_verdict": "survives" | "survives_weakened" | "fails",
    "load_bearing_disanalogies": ["one-line list of the disanalogies from the table that genuinely bite"],
    "missing_premise": "one sentence stating the extra premise, or null",
    "better_analogy": "one sentence, or null"
  }
