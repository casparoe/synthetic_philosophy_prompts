  | The programmer (or absence) | Natural Selection (no agent) | Breaks | Yes | Software implies design intent; evolution implies blind process. Crucial for arguing no truth-aiming intent. |
  | The requirements document | Objective Moral Truth | Strained | Yes | Specs exist by definition in software; moral truth is the contested hypothesis. |
  | The tests | Survival and Reproduction | Strained | Yes | Software tests check spec compliance; evolution tests fitness. Fitness ≠ Truth. |
  | The commit history | Evolutionary History | Holds | No | Both provide a causal chain of prior states, but causation alone doesn't debunk truth. |
  | The code itself | Moral Intuitions/Judgments | Holds | No | Both are the output systems being analyzed; the analogy here is stable. |
  | Technical debt | Cognitive Biases/Heuristics | Holds | No | Both represent suboptimal shortcuts retained for speed/efficiency rather than correctness. |
  | Refactoring | Moral Reasoning/Philosophy | Strained | No | Refactoring preserves function; moral reasoning often attempts to overturn intuitions. |
