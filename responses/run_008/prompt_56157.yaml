answer: |-
  Here is a draft of ten questions, arranged in five pairs. Each pair consists of a primary question and a follow-up. I have included brief *Strategy Notes* in italics before each pair to help you understand the anticipated reply and why the follow-up is timed for it. The wording is designed to be spoken aloud: accessible to your lifelong-learning audience but precise enough for your background and the guest's expertise.

  ### Pair 1: The Historical Division of Labor

  *Strategy Note: He will likely argue that reference is fixed by the actual stuff, regardless of what experts believed at the time. The follow-up presses on what "authority" means if the experts were ignorant of the very facts that fixed the reference.*

  **Question 1:**
  You have famously described the scientist as the "hero" of the Twin Earth story, the expert to whom ordinary speakers defer to fix the meaning of words like "water." But in my own field, we didn't identify hydrogen isotopes until the 20th century. Before that, every chemist on Earth believed water was a pure substance, not an isotopic mixture. Since the experts' beliefs have changed so dramatically while our usage of the word has remained stable, does your view imply that the meaning of "water" actually changed when we discovered isotopes, or was it fixed all along?

  **Question 2 (Follow-up):**
  If you say it was fixed all along by the physical stuff, even when the chemists didn't know what that stuff was, could you help us understand what work the "division of labor" was doing in that earlier period? If the experts didn't possess the knowledge that fixed the reference, in what sense were they the authorities?

  ***

  ### Pair 2: The "Same Liquid" Relation and Variation

  *Strategy Note: He will likely appeal to "natural kinds" which allow for some variation. The follow-up asks for the boundary condition to prevent the definition from becoming too loose.*

  **Question 3:**
  I'd like to press on the criterion you use for "same liquid." In the laboratory, we find that water from a glacier and water from a tropical river are not microphysically identical; they contain different ratios of heavy hydrogen and oxygen isotopes. When you say water is essentially H2O, are you referring to a strict chemical formula, or are you describing a cluster of similar structures? And if it is a cluster, how wide is the tolerance?

  **Question 4 (Follow-up):**
  If you grant that natural kinds tolerate some microphysical variation, how do you distinguish that from what philosophers sometimes call a "gerrymandered" kind? In other words, what prevents the definition of water from sliding into a disjunctive list of whatever liquids happen to look and behave like water in our environment?

  ***

  ### Pair 3: Individual Content and Psychological States

  *Strategy Note: He will likely distinguish between "wide" content (reference) and "narrow" content (internal state). The follow-up asks about the practical implications for how we understand human reasoning.*

  **Question 5:**
  Let's return to your Twin Earth scenario. If my duplicate there and I are molecule-for-molecule identical, yet his word tracks a different liquid than mine, I am curious what content remains shared between us. When we both sincerely say, "Water is good for you," is there any sense in which we are thinking the exact same thought, or does the difference in our environments mean our mental states are entirely distinct?

  **Question 6 (Follow-up):**
  If the meaning depends on the environment outside the head, does that imply that a person never fully knows the content of their own thoughts when they use natural kind terms? Or is there a layer of psychological explanation that relies only on what is inside the speaker, regardless of what the word refers to?

  ***

  ### Pair 4: Continuity and Slow-Switching

  *Strategy Note: He will likely argue that reference shifts when the causal connection shifts. The follow-up highlights the tension between a causal shift and the expert's ability to detect it.*

  **Question 7:**
  I would like to propose a variation on your thought experiment. Suppose the water on Earth were replaced, glass by glass over a decade, by the Twin Earth look-alike liquid. Given that nothing inside the speakers changes and the swap is too slow to be noticed, at what point does the word "water" change its meaning? Is there a specific moment when the reference flips, or is it a gradual drift?

  **Question 8 (Follow-up):**
  If the meaning flips once the causal connection to the new liquid is established, but the experts—including the chemists—do not notice the change for years, does the meaning shift *before* the experts identify it? This seems to suggest the experts might be deferring to a substance they haven't yet identified.

  ***

  ### Pair 5: Ordinary vs. Expert Usage at the Boundaries

  *Strategy Note: He will likely argue that science fixes the "real" extension while ordinary language is loose. The follow-up asks if this makes ordinary speakers systematically mistaken.*

  **Question 9:**
  Finally, I want to ask about the edges of the category. In ordinary usage, people call seawater, tap water, and even homeopathic solutions "water." In analytical chemistry, we might classify seawater as a solution and a homeopathic dilution as containing no water molecules at all. When ordinary usage and expert verdicts disagree at these boundaries, whose usage fixes the extension of the term?

  **Question 10 (Follow-up):**
  If you say the scientific verdict fixes the extension, does that mean the ordinary speaker is strictly speaking *mistaken* when they call seawater "water"? Or does your view allow for two valid meanings—one for the natural kind and one for the everyday concept—and if so, how do we know which one is in play?
