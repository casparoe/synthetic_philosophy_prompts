prompt: |-
  I run a small regional film festival — one week a year, one part-time staffer, and about 400 submissions. I can personally watch maybe 40 of them, and alot of my job is acting on scorecards filled out by a rotating pool of ~15 volunteer screeners, most of whom have watched a ton of movies and a few of whom genuinely have taste. I have to pick roughly 60 films for slots, and I have about six weeks every spring to do it. Getting it wrong isn't ruinous, but we've built real trust with our audience and a couple bad years in a row would burn it.

  The thing I keep bumping into is what the philosophy people apparently call the problem of aesthetic testimony. From what I can tell the answer is surprisingly "not really, but it's complicated" — something about how an aesthetic judgment is supposed to be grounded in the properties of the object itself rather than borrowed from someone else's reaction, so there's an asymmetry between trusting a screener that a file has bad subtitles and trusting them that the film is "quietly devastating." Meanwhile I obviously cannot watch 400 films, so in practice my whole festival is built on secondhand aesthetic verdicts.

  Write me a procedure my staff and I can actually run on each submission. I want the steps in order, what counts as a good enough answer at each step, where the procedure stops with a pass, and where it throws up its hands and hands the decision to me because the question is one of values, not facts. It should be honest about which steps are really judgment calls wearing a lab coat. Then run it on three real-ish cases from last year:

  1. A slow, three-hour documentary that one screener called "transformative" and another turned off after twenty minutes. I programmed it anyway and stood in the back while half the audience walked out.
  2. A short I personally loved the one time I saw it, but all four screeners who rated it gave it middling scores — I'm the only person involved who liked it.
  3. A film where every screener agreed it was excellent, I have never seen a single frame of it, and the question is whether I can put a line in the printed program calling it a masterpiece.

  And tell me straight what the procedure can't do — in particular whether it can tell me who counts as a screener with taste in the first place, because I suspect that's what the whole thing quietly rests on.

  One distinction I half-understand and want built in explicitly: testimony about facts (the film contains strobing, it's 82 minutes, it's the director's third feature) seems fine to just believe, while testimony about merit is the suspicious part. If the procedure needs to lean on that line, draw it clearly, because I suspect some of our scorecard questions are on the wrong side of it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Runs a small regional film festival (1 week, 1 part-time staffer, 400 submissions, 60 slots).
      *   **Constraint:** Can personally watch ~40 films. Relies on ~15 volunteer screeners. Has 6 weeks to decide.
      *   **Goal:** Needs a concrete procedure to process submissions based on screener scorecards, acknowledging the philosophical "problem of aesthetic testimony" (trusting others' judgments on art).
      *   **Philosophical Core:** Distinguish between factual testimony (subtitles, runtime) and aesthetic testimony (quality, emotion). Acknowledge that aesthetic judgment usually requires first-hand experience, but practical necessity forces reliance on second-hand verdicts.
      *   **Deliverables:**
          1.  A step-by-step procedure for staff.
          2.  Clear stopping points (Pass vs. Director Decision).
          3.  Identification of "judgment calls wearing a lab coat."
          4.  Application to three specific case studies from last year.
          5.  Honest assessment of limitations (specifically regarding identifying "taste").
          6.  Explicit integration of the Fact vs. Merit distinction.

  2.  **Deconstruct the "Problem of Aesthetic Testimony":**
      *   *The Problem:* Why is it okay to believe a friend that a bridge is safe (factual/functional), but weird to believe them that a painting is beautiful (aesthetic) without seeing it?
      *   *The Nuance:* Aesthetic judgment requires grounding in the experience of the object. Blindly accepting "It's good" bypasses the aesthetic engagement. However, in a festival context, the Director *is* engaging, just via proxies.
      *   *The Solution for the Festival:* The procedure shouldn't try to *solve* the philosophical problem (impossible), but to *manage* the risk. It needs to aggregate data to minimize the "blind trust" aspect while acknowledging where the Director must step in to take responsibility for the aesthetic stance.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Phase 1: Triage (Factual).* Filter out technical disqualifiers. This is safe testimony.
      *   *Phase 2: Aggregation (The "Lab Coat" Phase).* Convert subjective scores into data. This is where we pretend subjectivity is objective.
      *   *Phase 3: Variance Analysis.* High agreement = safe. High disagreement = requires Director review.
      *   *Phase 4: The Director's Cut (Values).* The Director watches the contentious ones. This reclaims the first-hand aesthetic experience.
      *   *Phase 5: Programming (Context).* A film isn't just good/bad; it fits a slot.

      *Refining the Steps:*
      *   Need to explicitly label Fact vs. Merit.
      *   Need to define "Good Enough" at each step.
      *   Need to identify where the buck stops.

  4.  **Developing the Case Studies:**
      *   *Case 1 (The Polarizing Doc):* High variance. Procedure should have flagged this for Director review. The failure was programming it without checking the *nature* of the polarization.
      *   *Case 2 (The Director's Pet):* Low screener scores, high Director love. Procedure needs a "Champion" clause. If the Director loves it, it overrides screeners (but uses one of the 40 personal slots).
      *   *Case 3 (The Universal Acclaim):* High agreement, Director hasn't seen. Can we call it a masterpiece? Procedure should say: No. You can call it "Audience Favorite" or "Highly Rated," but "Masterpiece" requires first-hand aesthetic grounding.

  5.  **Addressing the "Taste" Question:**
      *   This is the crux. The procedure relies on screeners having taste. Can the procedure identify taste?
      *   *Answer:* No, not directly. It can only identify *consistency* and *alignment with festival history.*
      *   *Mechanism:* Calibration. Compare screener scores against the Director's scores on the 40 films the Director watches. Weight the screeners who align better.

  6.  **Writing the Response (Iterative refinement):**

      *   *Tone:* Professional, pragmatic, philosophically literate but not pretentious. Acknowledge the stress.
      *   *Structure:*
          1.  Introduction (Validating the philosophical tension).
          2.  The Fact/Merit Distinction (Setting the ground rules).
          3.  The Procedure (Step-by-step).
          4.  Case Study Analysis.
          5.  The Limitations (The "Taste" problem).

      *   *Drafting the Procedure Details:*
          *   Step 1: Technical/Factual (Safe to delegate).
          *   Step 2: Scoring Aggregation (The "Lab Coat"). *Crucial:* Don't just average. Look at Standard Deviation.
          *   Step 3: The "Variance Threshold." If screeners disagree wildly, it goes to the Director.
          *   Step 4: The "Director's 40." This is the calibration set.
          *   Step 5: Final Selection (Contextual).

      *   *Drafting the Case Studies:*
          *   Case 1: Variance was high. Should have triggered Step 3. Director watched it, saw the walk-out risk, maybe programmed it for Q&A potential or cut it.
          *   Case 2: Director's 40 override. Valid use of personal slots.
          *   Case 3: The "Masterpiece" claim. This is aesthetic testimony. Don't do it. Use "Screener Consensus."

      *   *Drafting the Limitations:*
          *   Be blunt. The procedure doesn't create taste. It manages risk.
          *   Calibration is key. If a screener hates everything the Director loves, weight them lower.

  7.  **Review against Constraints:**
      *   *Steps in order?* Yes.
      *   *Good enough answers?* Defined.
      *   *Stop/Pass points?* Defined.
      *   *Judgment calls identified?* Yes (marked as "Aesthetic Proxy").
      *   *Fact vs. Merit line?* Drawn early and reinforced.
      *   *Three cases run?* Yes.
      *   *Taste question answered?* Yes, in the limitations section.

  8.  **Final Polish:** Ensure the distinction between "Fact" (subtitle quality) and "Merit" (devastating) is clear in the scorecard design section. Make sure the "Masterpiece" verdict in Case 3 is handled carefully—it's about the *claim*, not the film.

      *(Self-Correction during drafting)*: I initially thought about suggesting weighting screeners immediately. But that requires data from previous years. I should suggest a "Calibration Phase" during the 6 weeks where the Director watches a mix of high/low scored films to adjust weights. Actually, simpler: Just use the "Director's 40" as the calibration set for *next* year, but for *this* year, use Variance to decide what the Director watches *now*.
      *Correction:* The Director has 6 weeks. They can watch the "High Variance" films *during* the selection process. That's the best use of the 40 personal slots.

      *Refining the "Masterpiece" point:* The philosophical issue is that you cannot assert an aesthetic judgment based on testimony. So the program note cannot say "This is a masterpiece." It can say "Selected by committee."

      *Refining the "Taste" point:* Taste is alignment with the festival's curatorial voice. The procedure can measure alignment, not intrinsic taste.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a genuine operationalization of a philosophical problem. You are correct that aesthetic testimony is suspect: if I tell you a bridge is safe, you can cross it without engineering knowledge. If I tell you a film is "devastating," and you program it based solely on my word, you have abdicated your curatorial responsibility. You are betting your festival's reputation on my nervous system, not yours.

  However, you have 400 films and 40 viewings. You cannot solve the philosophical problem; you can only manage the risk. The goal of this procedure is not to find "Truth," but to minimize **Unverified Aesthetic Assertions.**

  Here is the distinction you asked for, built into the workflow:
  *   **Fact Testimony:** Verifiable properties (runtime, aspect ratio, subtitle sync, audio levels). *Safe to delegate.*
  *   **Merit Testimony:** Evaluative properties (pacing, emotional resonance, originality). *Unsafe to delegate without calibration.*

  ### The Curatorial Risk Protocol (CRP)

  **Timeframe:** Weeks 1–4 (Screening & Triage), Week 5 (Director Review), Week 6 (Final Programming).
  **Inputs:** 400 Submissions, 15 Screeners, 1 Director (You).

  #### Step 1: The Factual Gate (Weeks 1–2)
  **Action:** Staff/Head Screener reviews scorecards for factual disqualifiers.
  **Scorecard Questions:** (Must be binary/observable)
  *   "Are subtitles burned in or separate?"
  *   "Is the audio mix intelligible?"
  *   "Does the runtime match the submission form?"
  **Decision Rule:**
  *   **Fail:** Any critical technical failure (e.g., unfixable audio). **STOP.** (Pass).
  *   **Pass:** Technical specs meet festival standards. **PROCEED.**
  **Philosophical Status:** **Safe.** This relies on factual testimony. You can trust a screener to measure 82 minutes.

  #### Step 2: Merit Aggregation & Variance Check (Week 3)
  **Action:** Staff inputs merit scores (1–5 scale) into a spreadsheet. Calculate **Average Score** and **Standard Deviation (Variance)** for each film.
  **Scorecard Questions:** (Must be specific, not vague)
  *   *Bad:* "Is it good?"
  *   *Good:* "Did the film sustain your attention?" "Was the ending earned?"
  **Decision Rule:**
  *   **Zone A (Consensus Reject):** Avg Score < 2.5. **STOP.** (Pass).
  *   **Zone B (Consensus Accept):** Avg Score > 4.0 AND Standard Deviation < 0.5. **FLAG FOR STEP 4.**
  *   **Zone C (High Variance):** Standard Deviation > 1.0 (e.g., one 5, one 2). **FLAG FOR STEP 3.**
  **Philosophical Status:** **Judgment Call in a Lab Coat.** Averaging subjective experience pretends art is math. It is useful for sorting, but the number is not the truth. High Variance indicates the film triggers subjective values, not objective quality.

  #### Step 3: The Director's Calibration (Weeks 4–5)
  **Action:** You watch the films flagged in **Zone C (High Variance)**.
  **Why:** This is where the "Problem of Aesthetic Testimony" is resolved. You cannot trust the screeners' conflicting verdicts, so you must acquire first-hand aesthetic grounding.
  **Budget:** This consumes your personal 40-film viewing cap.
  **Decision Rule:**
  *   **You Agree with the Positive Screener:** Move to Step 4.
  *   **You Agree with the Negative Screener:** **STOP.** (Pass).
  *   **You Disagree with Both:** Your judgment overrides. Move to Step 4 or Stop based on your vision.
  **Philosophical Status:** **First-Hand Grounding.** You are reclaiming the aesthetic judgment. You are no longer relying on testimony; you are testifying.

  #### Step 4: The "Masterpiece" Verification (Week 5)
  **Action:** Review films in **Zone B (Consensus Accept)**.
  **Constraint:** You have likely not seen these. Everyone loved them.
  **Decision Rule:**
  *   **Programming:** You may program the film based on consensus.
  *   **Public Claims:** You **MAY NOT** use first-person aesthetic claims in the program guide (e.g., "A haunting masterpiece," "We were moved to tears").
  *   **Allowed Language:** You **MAY** use attribution claims (e.g., "A festival favorite," "Highest-rated submission," "Selected by our screening committee").
  **Philosophical Status:** **Honest Testimony.** You can testify that *others* found it excellent. You cannot testify that *it is* excellent without seeing it.

  #### Step 5: Contextual Fit (Week 6)
  **Action:** Assemble the 60 slots.
  **Decision Rule:** A "Consensus Accept" film might be cut if it duplicates a theme or kills the pacing of a block. A "High Variance" film you loved might be kept specifically *because* it is challenging.
  **Philosophical Status:** **Curatorial Voice.** This is where you define what the festival *is*, not just what is "good."

  ---

  ### Running the Protocol on Your Three Cases

  #### Case 1: The Polarizing Doc (3 hours, "Transformative" vs. "Walked Out")
  *   **Protocol Diagnosis:** This is a **Zone C (High Variance)** film. One 5, one 1.
  *   **Procedure Failure:** Last year, you likely programmed it based on the "Transformative" comment without triggering Step 3.
  *   **Correct Execution:** The high variance flags this for **your** viewing (Step 3). You watch it. You realize it is slow. You decide: "Is 'challenging' part of our brand?"
      *   If yes: Program it, but market it as "Ambitious/Long Form" (managing audience expectation).
      *   If no: Pass.
  *   **Outcome:** You avoid the surprise walk-outs. Either you prepare the audience, or you cut it. The aesthetic risk is yours, not the screeners'.

  #### Case 2: The Director's Pet (You loved it, Screeners middling)
  *   **Protocol Diagnosis:** Avg Score ~3.0. Low Variance (Consensus Mediocrity).
  *   **Procedure Failure:** The protocol would naturally Pass this film in Step 2.
  *   **Correct Execution:** This requires a **"Curatorial Veto"** clause. You have 40 personal slots. You use one of them on a random sample or a specific hunch.
      *   If you watch it and love it: You override Step 2. It enters the lineup as a **"Director's Selection."**
      *   **Constraint:** This counts against your 40-film cap. You cannot have 20 "Director's Selections." You must spend your social capital wisely.
  *   **Outcome:** You get your film, but you acknowledge it is *your* taste, not the festival's consensus. This protects the brand if it bombs ("The Director took a swing") vs. if the screeners picked it ("The Festival thinks this is good").

  #### Case 3: The Universal Acclaim (Everyone loved it, You haven't seen it)
  *   **Protocol Diagnosis:** **Zone B (Consensus Accept).**
  *   **Procedure Failure:** You asked if you can call it a "masterpiece" in the program.
  *   **Correct Execution:** Step 4 says **NO.**
      *   You can program it (Step 4 allows programming on consensus).
      *   You **cannot** write "A Masterpiece of Cinema" in the guide. That is an aesthetic judgment requiring first-hand experience.
      *   You **can** write "Unanimous Selection of the Screening Committee."
  *   **Outcome:** You maintain intellectual honesty. If the film is actually bad (groupthink happens), you haven't lied to your audience about *your* judgment. You have reported the committee's judgment accurately.

  ---

  ### What This Procedure Cannot Do (The "Taste" Problem)

  You asked the hard question: *Can this tell me who counts as a screener with taste?*

  **The Short Answer:** No.
  **The Long Answer:** The procedure cannot identify intrinsic "taste." It can only identify **alignment.**

  "Taste" is not a universal metric. A screener who loves slow cinema has "good taste" for a slow cinema festival and "bad taste" for an action festival. The procedure above treats all screeners as equal data points in Step 2. This is a vulnerability.

  **How to fix this within the system:**
  You need a **Weighting Phase** at the end of every festival (Post-Mortem).

  1.  **The Calibration Set:** Of the 40 films *you* watch (Step 3 + random sampling), compare your scores to each screener's scores.
  2.  **The Correlation Coefficient:**
      *   Screener A matches your "Pass/Program" decisions 85% of the time.
      *   Screener B matches your decisions 40% of the time.
  3.  **Next Year's Weighting:** In Step 2 (Merit Aggregation), Screener A's vote counts for 1.5x. Screener B's vote counts for 0.5x.

  **The Honest Limitation:**
  This doesn't find "good taste." It finds **screeners who think like you.**
  *   **Risk:** This creates an echo chamber. You will never be surprised by a film you wouldn't have liked anyway.
  *   **Mitigation:** Keep 2–3 screeners with *low* correlation on purpose. If a film scores low with your "clones" but high with the "outlier," that triggers a mandatory Step 3 review. That is how you find the diamonds that don't look like diamonds to you initially.

  ### Summary of the "Fact vs. Merit" Line on Scorecards

  To make this work, you must rewrite your scorecard questions immediately.

  | **Safe (Fact)** | **Unsafe (Merit)** | **Calibrated (Proxy)** |
  | :--- | :--- | :--- |
  | "Are subtitles readable?" | "Is the film beautiful?" | "Did you check your phone during the film?" |
  | "Is the runtime > 60m?" | "Is the acting convincing?" | "Would you recommend this to a friend?" |
  | "Is there strobing?" | "Is the ending satisfying?" | "Did the film feel like it was 2 hours long?" |

  **Why:** "Beautiful" and "Convincing" are aesthetic testimony. You cannot trust them blindly. "Did you check your phone" is a behavioral fact that *correlates* to merit. It is a safer data point for aggregation.

  ### Final Verdict
  Your festival runs on trust. This procedure shifts the trust from "I trust my screeners know good art" (which is fragile) to "I trust my process to identify where I need to look myself" (which is robust).

  You cannot outsource your curatorial voice. You can only outsource the sorting. Use the screeners to sort the 400 down to the 100 most interesting/contested films. Use your 40 viewings to make the final 60 decisions. Anything else is gambling with your audience's time.
