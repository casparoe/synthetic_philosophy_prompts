answer: |-
  Your intuition is spot on. In fact, your suspicion regarding the distinction between weak and strict dominance hits the nail on the head. Your lecturer has provided a 'folk theory' version of the concept that works well for introductory intuition but collapses under technical scrutiny. In the trade, we distinguish between **Iterated Elimination of Strictly Dominated Strategies (IESDS)** and **Iterated Elimination of Weakly Dominated Strategies (IEWDS)**. The lecturer's summary conflates the two, and unfortunately, the properties he attributes to the general concept only hold true for the strict variety.

  Here is a breakdown of what a game theorist would sign off on, where the conflation occurs, and what survives of the conclusion.

  ### 1. The Definition of Dominance
  **Lecturer's Claim:** *A dominated strategy is one that some other strategy beats no matter what the opponents do.*

  **Verdict:** **Imprecise.**
  This is the root of the confusion. "Beats" is doing too much work here.
  *   **Strict Dominance:** Strategy $A$ *strictly* dominates $B$ if $A$ yields a **strictly higher** payoff than $B$ against every possible combination of opponents' strategies.
  *   **Weak Dominance:** Strategy $A$ *weakly* dominates $B$ if $A$ yields a payoff **at least as high** as $B$ against all opponent strategies, and **strictly higher** against at least one.

  Your lecturer treated these as identical. They are not.

  ### 2. Rationality and "Never Playing"
  **Lecturer's Claim:** *No rational player would ever play one.*

  **Verdict:** **True for Strict; Debatable for Weak.**
  If a strategy is strictly dominated, playing it violates the assumption of utility maximisation. A rational player assigns a probability of zero to playing it.
  However, with weak dominance, the dominated strategy might yield the *exact same* payoff as the dominating strategy in many contingencies. While it is generally considered 'unreasonable' to play a weakly dominated strategy (often ruled out by refinements like 'trembling hand perfection'), it is not irrational in the same absolute sense. A rational player *could* play a weakly dominated strategy if they believe the specific opponent profiles where it performs worse will never occur.

  ### 3. Order Independence
  **Lecturer's Claim:** *The order you delete in doesn't matter.*

  **Verdict:** **True for Strict; False for Weak.**
  This is the most significant technical error in the summary.
  *   **IESDS:** The set of strategies surviving iterated elimination of *strictly* dominated strategies is unique. You can delete them in any order; the result is the same.
  *   **IEWDS:** The order **does** matter. Depending on which weakly dominated strategy you remove first, you may alter the payoff structure for the remaining strategies, potentially making a previously undominated strategy dominated (or vice versa). Different elimination orders can lead to different surviving sets.

  ### 4. The Equilibrium Claim
  **Lecturer's Claim:** *When the process leaves each player with a single strategy... that profile is the unique prediction of rational play and the only equilibrium of the game.*

  **Verdict:** **True for Strict; False for Weak.**
  *   **IESDS:** If IESDS results in a single strategy profile, that profile is indeed the unique Nash Equilibrium of the game. Furthermore, IESDS never eliminates a Nash Equilibrium.
  *   **IEWDS:** If IEWDS results in a single profile, it is *a* Nash Equilibrium, but it is **not** necessarily the *only* one. Because weak dominance can eliminate strategies that are part of a Nash Equilibrium (specifically, equilibria that rely on weakly dominated strategies), the procedure might discard valid equilibria along the way. Therefore, claiming it is the "only equilibrium" is incorrect when weak dominance is involved.

  ### 5. The Second-Price Auction Example
  **Lecturer's Claim:** *Bidding your true value dominates every other bid.*

  **Verdict:** **This is Weak Dominance.**
  This example inadvertently proves your point. In a second-price sealed-bid auction (Vickrey auction), bidding your true valuation ($b=v$) **weakly** dominates any other bid ($b \neq v$), it does not strictly dominate it.
  *   **Why?** Suppose your value is £100. If the highest competing bid is £50, bidding £100 wins you the item for £50 (payoff £50). Bidding £90 also wins you the item for £50 (payoff £50). In this specific scenario, the payoffs are identical.
  *   Because there are opponent bids where lying yields the same outcome as truth-telling, the dominance is weak, not strict.

  Consequently, applying the lecturer's logic here is risky. While truth-telling is the standard solution, relying on IEWDS to prove it requires care regarding the order of elimination and the existence of other equilibria (though in the specific case of the second-price auction, truth-telling is the robust solution, the *logic* used to get there matters).

  ### Summary of Trustworthiness

  If you were to mark this lecture summary, a game theorist would say:

  1.  **Conflation:** The lecturer has silently assumed **Strict Dominance** throughout the theoretical properties (order independence, unique equilibrium) but applied the logic to an example of **Weak Dominance** (the auction).
  2.  **Survival of Conclusions:**
      *   If the game allows for **Strict** dominance elimination down to a singleton: The conclusion holds. It is the unique Nash Equilibrium and the robust prediction of rational play.
      *   If the game requires **Weak** dominance elimination (like the auction): The conclusion is fragile. The order of deletion might change the outcome, and other equilibria might exist that were eliminated during the process.

  ### The Verdict

  Your lecturer has given you a 'clean' narrative that is pedagogically useful for building intuition but technically inaccurate. You are quite right to distrust the gloss.

  In British academic terms, the lecture was a bit of a fudge. For the purposes of your exams, you should clarify with the module lead whether they expect you to distinguish between IESDS and IEWDS. If this is an advanced module, failing to distinguish them would be considered a significant error. If it is an introductory module, they may accept the simplified view, provided you note the caveat that order independence fails under weak dominance.

  To be safe, I would advise you to adopt the following position in your essays: *"While Iterated Elimination of Strictly Dominated Strategies yields order-independent results and preserves all Nash Equilibria, one must exercise caution with Weak Dominance, as the order of elimination can affect the outcome and may discard valid equilibria."* That will show you understand the machinery behind the gloss.
