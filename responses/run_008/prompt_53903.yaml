      *   *Correction:* On the "only equilibrium" claim. If IESDS results in a singleton, that singleton is the unique NE. If IEWDS results in a singleton, it is *an* NE, but not necessarily the *only* one. The lecturer claimed "only equilibrium". This is false for weak dominance.

  6.  **Final Polish (checking against constraints):**
