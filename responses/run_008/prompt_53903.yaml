      *   If $y < v_i$: Bidding $v_i$ wins, payoff $v_i - y$. Bidding $b_i > y$ wins, payoff $v_i - y$. Bidding $b_i < y$ loses, payoff 0. So $v_i$ is better than low bids, equal to high bids.
