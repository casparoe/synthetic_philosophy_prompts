answer: |-
  This is a brilliant argument to have had, and an even better one to continue. You've stumbled onto one of the deepest tensions in the play: the conflict between *logical necessity* (the prophecy comes true) and *causal contingency* (Macbeth chooses to make it true).

  Your friend is arguing for **logical fatalism**: if a statement about the future is true now, the future event is necessary. You are arguing for **open futurism**: the future is branching, and Macbeth's choices matter.

  Here is a reading that takes Aristotle's *De Interpretatione* (the Sea Battle) seriously, respects the text of *Macbeth*, and tackles your three specific complications without hand-waving.

  ### 1. The Sea Battle on the Heath: Truth Values and Witches

  Let's start with your mate's core claim: The witches speak truths; therefore, the future is fixed.

  Aristotle's Sea Battle argument asks: Is the statement "There will be a sea battle tomorrow" already true or false today?
  *   **If Yes (Bivalence holds):** Then the battle is necessary. Freedom is an illusion.
  *   **If No (Aristotle's view):** Future contingents are neither true nor false yet. The future is open.

  If we apply strict Aristotelian logic to the witches, your mate has a point. The witches utter propositions ("All hail, Macbeth, that shalt be king hereafter") that function as true statements. Macbeth becomes King. Therefore, at the moment of speaking, the statement was true. If it was true then, the event was necessary.

  **However,** this assumes the witches are *observers* reporting on a fixed timeline. The text suggests they are *agents*. Hecate explicitly says they deal in "spells and charms." They aren't reading a script; they are writing one.

  If the witches are causal agents, their statements aren't descriptions of a fixed future (which would require bivalence); they are **performative utterances**. They are more like "I bet you will kill Duncan" than "I see you killing Duncan."

  **The Philosophical Fix:** You can tell your mate that the witches' statements do not have a truth value *independent of Macbeth's reaction*. They are **conditional truths**. "Macbeth will be King *if* Macbeth acts on this suggestion." Aristotle's Sea Battle fails here because the proposition isn't a simple future contingent; it's a causal trigger. The truth of the prophecy is contingent upon Macbeth's free will.

  ### 2. The Causal Loop (Complication 1)

  You noted that the first prophecy (Thane of Cawdor) comes true *before* the murder, convincing Macbeth to act. This is the strongest evidence against hard determinism.

  In a deterministic universe, the prophecy would be a signpost. In *Macbeth*, the prophecy is an **engine**.

  *   **Scenario A (Determinism):** Macbeth is destined to be King. The witches tell him. He kills Duncan because he must.
  *   **Scenario B (The Play):** Macbeth is a loyal Thane. The witches tell him he *could* be King. Ross arrives and says he *is* Cawdor. Macbeth thinks, "Step one is done, step two (King) must follow." He *chooses* to kill Duncan to expedite step two.

  If Macbeth had said, "If I am destined to be King, chance will crown me without my stir," (as he initially considers), and simply waited, would he have become King? The play implies **no**. Duncan names Malcolm his successor immediately after the Cawdor execution. Without the murder, Macbeth remains a celebrated general but not King.

  **The Verdict:** The prophecy is **self-fulfilling**, not pre-fulfilled. This dramatises something the Sea Battle debate misses: **Reflexivity.** In human affairs, knowing a prediction changes the outcome. Aristotle's logic treats the future as an external object to be described. Shakespeare treats the future as a psychological state to be inhabited. The prophecy doesn't prove the future was fixed; it proves Macbeth's mind was vulnerable.

  ### 3. Equivocation and "True Under a Description" (Complication 3)

  This is your strongest philosophical ground. The prophecies come true, but via semantic loopholes ("none of woman born," "Birnam Wood").

  Your mate says: "They came true, so it was fate."
  You say: "They came true via tricks, so it was open."

  In the literature of future contingents, there isn't a standard category for "True but misleading." Logic deals in truth conditions, not pragmatic implicature. But Shakespeare is a poet, not a logician. He knows that **truth without context is a lie.**

  When Macbeth complains that the fiends "palter with us in a double sense," he is identifying a gap between **semantic truth** (the literal meaning of the words) and **ontological truth** (the reality of the situation).

  *   **Ockhamist View:** William of Ockham argued that God knows future contingents as true without necessitating them. But the witches aren't God. They are demons (or ambiguous spirits).
  *   **The Shakespearean Twist:** The equivocations show that the future *was* open, but Macbeth tried to force it closed. He interpreted "None of woman born" as "I am invincible." That was a choice. He interpreted "Birnam Wood" as "Trees walking." That was a choice.

  The future wasn't fixed; Macbeth's **interpretation** of the future was fixed. He locked himself into a literalist reading of the prophecies, which blinded him to their metaphorical reality. The "truth" of the prophecy only solidifies at the moment of death. Until then, it remains contingent on how Macbeth acts.

  So, to answer your specific question: *Are the witches uttering truths, falsehoods, or neither?*
  They are uttering **traps**. In speech-act theory, these aren't constatives (describing the world); they are performatives (changing the world). They are "true" only in the sense that a bear trap is "true" to its nature when it snaps on your leg. They don't describe a fixed future; they construct a fatalistic mindset in Macbeth that *leads* to that future.

  ### 4. Banquo's Line (Complication 2)

  This is the smoking gun against determinism *within the fiction*.

  The witches show Macbeth a line of kings stretching to the "crack of doom." This refers to the Stuart lineage (James I was watching). But within the play's timeline:
  1.  Fleance escapes.
  2.  Macbeth remains King until death.
  3.  Malcolm becomes King next.

  Banquo's descendants do *not* become kings in the dramatic present. That prophecy is **false within the diegesis** and **true only for the audience.**

  If the play were truly deterministic, Fleance would have been killed, or Malcolm would have been revealed as a descendant of Banquo. The fact that the play leaves Fleance's fate open ("Fly, good Fleance, fly, fly, fly!") admits that the future is not written. The "truth" of Banquo's kingship exists outside the play's causal chain.

  This suggests Shakespeare distinguishes between **Historical Necessity** (what the audience knows happened) and **Dramatic Contingency** (what the characters experience). The play honors the latter. Macbeth *feels* trapped, but the mechanics of the plot show he walked into the trap voluntarily.

  ### 5. Does Shakespeare Beat Aristotle?

  Yes. Here is why.

  Aristotle's Sea Battle is a problem of **logic and time**. It asks: *Can a statement about T+1 be true at T?*
  Shakespeare's *Macbeth* is a problem of **language and psychology**. It asks: *What does believing a statement about T+1 do to a man at T?*

  The formal debate about bivalence assumes a detached observer. Shakespeare realizes that in human life, there are no detached observers. We are all Macbeths. When we hear a prediction (a doctor's prognosis, a market forecast, a horoscope), it changes our behavior.

  Shakespeare captures something the formal debate misses: **The feedback loop of belief.**
  *   If Macbeth believes the future is fixed, he acts tyrannically.
  *   If he believes it is open, he might act patiently.
  *   By believing it is fixed (based on the witches' equivocations), he makes it fixed (in the worst possible way).

  The play suggests that **fatalism is a self-inflicted wound.** The witches don't chain Macbeth; Macbeth chains himself to the witches' words.

  ### Pub-Ready Summary (For the Next Row)

  Here is how you can deploy this next time she brings it up over pints:

  1.  **The Causal Trigger:** "If the future was fixed, Macbeth wouldn't need to kill Duncan to become King. The prophecy of Cawdor didn't predict the future; it caused it. It turned a loyal Thane into a murderer. That's not fate; that's manipulation."
  2.  **The Equivocation:** "The witches' statements aren't true descriptions of reality; they're semantic traps. 'None of woman born' is only true if you interpret 'born' literally. Macbeth *chose* to interpret it literally. That's a failure of language, not a law of physics."
  3.  **The Banquo Loophole:** "Banquo's kids become kings for the audience, but Fleance escapes in the play. If the play was deterministic, Fleance dies. The fact he lives proves the future inside the story is still open. The 'fate' only exists because we know history."
  4.  **The Knockout:** "Aristotle asks if future statements are true or false. Shakespeare shows that asking that question is the trap. Macbeth dies because he treats the future as a fact to be known, rather than a possibility to be shaped. The play isn't about destiny; it's about the danger of believing in destiny."

  **Verdict:** The play is not deterministic. It is a tragedy about a man who *chooses* determinism because it absolves him of moral responsibility. He wants the future to be fixed so he can blame the witches for his crimes. Shakespeare lets him have that comfort right up until the moment Macduff reveals he was caesarean-born. Then, the open future snaps back, and Macbeth breaks.
