      *   **The Twist:** The *grid* determines the meaning. The individuals don't know the grid.
      *   **Wait, the "No Aggregator" rule.** If I put the notes on the wall, I'm the aggregator.
      *   **Fix:** Pre-printed grid on the wall. Participants place their own notes on specific coordinates based on a rule they *do* know (e.g., "If you are wearing blue, row 1. If red, row 2").
      *   **The Output:** The pattern on the wall *is* the macro-experience.
      *   **The "Unity" Check:** Does the pattern look like a face? A word? Or just noise?
      *   **The "Opacity" Check:** Can a participant look at the wall and say "That note is mine"? Yes, but can they say "I am the top left corner of the face"?
      *   **Refining for the "Subject" feel:** The output needs to be linguistic or semantic to feel like "consciousness."
      *   **Revised Idea: "The Single Voice Protocol".**
      *   **Task:** The group must answer a question (e.g., "Are we happy?") with a single "Yes" or "No" (or a short sentence).
      *   **Mechanism:** Each person gets a card with a logical gate rule (AND, OR, NOT) and an input value. They pass signals.
      *   **Too complex.**

      *   *Let's go back to the most robust constraint: Information Silos + Mechanical Aggregation.*
      *   **Activity Name:** "The Blind Mosaic."
      *   **Materials:** Envelopes, colored tiles (or sticky notes), a large grid on the wall.
      *   **Roles:** "Qualia Nodes" (Participants).
      *   **Process:**
          1.  Each person gets an envelope with a coordinate (e.g., A4) and a color instruction based on local data (e.g., "Look at your left hand. If open palm, Blue. If fist, Red").
          2.  They place their tile on the grid.
