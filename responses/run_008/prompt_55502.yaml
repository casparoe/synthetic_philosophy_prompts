      *   If the output is a picture, it's easy to point to parts.
      *   If the output is a *statement*, it's harder.
      *   **Let's try a Textual version.**
      *   **Activity:** "The Composite Monologue."
      *   **Setup:** A shared Google Doc? No, that shows cursors.
      *   **Setup:** A physical "flipbook" or stack of cards.
      *   **Mechanism:**
          1.  Question: "What is it like to be this group?"
          2.  Each person writes 1 word on a card.
          3.  They drop cards into a opaque box.
          4.  **The Aggregator Constraint:** I (facilitator) cannot pull them out and arrange them. That makes me the homunculus.
          5.  **Solution:** The cards are pre-numbered 1-14. Participants are assigned a number secretly. They must find the slot in a wall-rack corresponding to their number.
          6.  **The Catch:** They don't know the global order. They just know "I am Node 4."
          7.  **The Result:** A sentence reads across the rack. "I ... feel ... warm ... and ... confused."
          8.  **The Problem:** Who assigns the numbers? If I do, I'm the architect.
          9.  **Solution:** Random draw upon entry. "You are Node 4."
          10. **The "No Parts" Rule:** The sentence must not use plural pronouns. It must use "I".
          11. **The Tension:** If Node 4 writes "We", they break the rule. If Node 4 writes "I", they are lying (they are not the whole).
          12. **This is the gold.** The tension between the micro-writing "I" and the macro-reading "I".

  4.  **Developing the "Composite Monologue" Activity:**

      *   **Name:** "Protocol I".
      *   **Time:** 60 mins (15 intro/setup, 30 activity, 15 debrief).
      *   **Materials:** Index cards, a wall rack with 14 slots labeled 1-14, pens, blindfolds (optional but maybe too much), noise-canceling headphones (optional).
      *   **Roles:** "Nodes" (Participants). Facilitator is "Environment" (not aggregator).
      *   **Rules:**
          1.  Draw a number (1-14) at the door. This is your "Address."
          2.  Receive a prompt: "Describe the current state of the System."
          3.  Constraint A: You may only write ONE word.
          4.  Constraint B: You must write in the first person singular ("I", "me", "my", or verbs conjugated for "I"). You cannot write "We".
          5.  Constraint C: You cannot communicate with other Nodes.
          6.  Constraint D: Place your card in the slot matching your Address.
          7.  Constraint E: Do not look at other slots until the "Reveal."
      *   **The Reveal:** Read the sentence aloud.
      *   **The Failure Condition:** If the sentence is gibberish, the "Subject" failed to cohere. If the sentence mentions parts ("I am node 4"), the "Subject" failed to unify.
      *   **The Combination Problem:** How did 14 separate decisions make one sentence? Who chose the grammar? (Answer: No one. It emerged, or failed.)

  5.  **Addressing the "No Aggregator" Constraint:**
      *   In the above, I (facilitator) read the result. Does that make me the homunculus?
      *   *Mitigation:* I am merely the "vocal cords." I do not edit. I do not arrange. The arrangement is fixed by the slots (the "structure of the brain").
