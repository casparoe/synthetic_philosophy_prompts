      *   *The Constraint:* $e_a$ doesn't know $e_b$ exists. There is no "S" yet to know them.
      *   *The Game Analogy:* We need a task that requires synthesis of information/action but forbids communication that would create a "meta-view" for the individuals.
      *   *The "Unity" Output:* The group must produce *one* artifact that looks like it came from one mind, not a collage.

  3.  **Brainstorming Activity Concepts:**

