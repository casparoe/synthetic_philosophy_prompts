prompt: |-
  I direct the introductory philosophy sequence at a large state university: I write the lecture notes, four graduate teaching assistants run the discussion sections, and roughly six hundred students a year treat those notes as authoritative, including for the exams on which my TAs and I grade them. Over a semester the notes accumulate several hundred discrete factual and interpretive claims — dates, definitions, attributions of arguments, renderings of technical terms, sentences of the form "X held that p." I check each claim as I write it, but I also know, in the way every author knows, that some small number of them are wrong, and every year at least one student finds one. What I want from you is a decision procedure, grounded in whatever epistemology actually has to say about the lottery and preface paradoxes, that my TAs and I can run on any individual claim before it goes into the notes: the questions to ask, in order; what counts as a sufficient answer at each step; where the procedure ends with "assert it flatly"; where it ends with "hedge or attribute"; and where it explicitly stops and hands the decision back to a person because the question is no longer epistemic — how much hedging students will tolerate before they stop trusting any sentence at all is a pedagogical judgment, not a probability. The procedure should say what to do when we cannot attach anything like a number to a claim, and it should be honest about which of its steps are judgment calls dressed up as procedure.

  The procedure also has to respect the central lesson of the paradoxes, which is that each claim in the notes can be individually well-supported while their conjunction is something I should positively disbelieve. So I need two things, not one: a per-claim test, and a policy for the aggregate — whether to run a standing disclaimer in the syllabus, whether such a disclaimer coheres with continuing to assert each item flatly, and what, if anything, I owe the students who lose exam points in the meantime because they faithfully repeated an error we never caught. For the constraints: claims arise during lecture prep at a rate of roughly twenty to forty per week; I have perhaps two minutes per claim; the TAs have one year of graduate training and no background in formal epistemology; and I alone sign off on the exam key, which must stay consistent with the notes.

  Once you have laid out the procedure, run it on three cases. (a) A date of composition for a historical text that the standard textbook gives one way but that a minority of specialists dispute. (b) An interpretive claim in an area outside my specialty — say, a sentence about what some medieval philosopher meant by a technical term — that I have carried from a single secondary source I read years ago and never checked against the primary text. (c) A definitional claim I put on the exam key three years ago and have reused every year since, which a student has now challenged with a passage from the primary text that appears to point the other way. I want you to flag honestly where the procedure will misfire and what it cannot settle; and I should warn you that in case (c) I fully expect to dislike its output, since the claim is already printed on three years of past exams. Tell me what it says anyway. Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Director of an introductory philosophy sequence at a large state university.
      *   **Context:** Writes lecture notes, 4 TAs run discussions, ~600 students/year. Notes are authoritative for exams. Notes contain hundreds of claims (dates, definitions, interpretations).
      *   **Problem:** Knows some claims are wrong (Preface Paradox). Students find errors. Needs a decision procedure for *individual claims* before inclusion, grounded in epistemology (Lottery/Preface Paradoxes).
      *   **Requirements:**
          1.  Decision procedure (questions in order, sufficient answers, endpoints: assert/hedge/human judgment).
          2.  Must handle unquantifiable probabilities.
          3.  Must admit where steps are judgment calls.
          4.  Must address the *aggregate* policy (disclaimers, consistency with flat assertion, owed to students who lost points).
          5.  Constraints: 20-40 claims/week, 2 mins/claim, TAs have 1 year grad training (no formal epistemology), Director signs exam key.
          6.  Run procedure on three specific cases (a, b, c).
          7.  Flag where it misfires/can't settle.
          8.  Be honest about Case (c) even if the output is disliked.
          9.  Language: American English.

  2.  **Epistemological Grounding (Lottery & Preface Paradoxes):**

      *   *Lottery Paradox:* High probability isn't enough for knowledge/assertion (if it were, I'd believe I'll lose the lottery, but I don't).
      *   *Preface Paradox:* I believe every claim in the book, but I also believe (humility) that at least one is false. This seems inconsistent ($\forall x, B(x)$ vs. $B(\exists x, \neg x)$).
      *   *Resolution Strategy:* Contextualism or Pragmatic Encroachment. For pedagogical purposes, "knowledge" or "warranted assertibility" depends on the stakes and the practical environment.
      *   *Application:* We cannot demand Cartesian certainty (too slow). We cannot assert based on mere statistical likelihood (Lottery). We need a "practical certainty" threshold that acknowledges fallibility without paralyzing assertion.
      *   *Key Insight:* The tension between *local* warrant (this claim is solid) and *global* fallibility (the set contains errors). The procedure must validate the local assertion while managing the global risk.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Constraint Check:* 2 minutes per claim. Needs to be fast, checklist-style.
      *   *Step 1: Source Hierarchy.* Is this primary or secondary? Consensus or disputed?
      *   *Step 2: Risk Assessment.* What happens if this is wrong? (Confusion vs. Fundamental Error).
      *   *Step 3: The "Defeater" Check.* Is there a known active dispute?
      *   *Step 4: Hedging Decision.* Based on 1-3.
      *   *Step 5: The Human Handoff.* When epistemology ends and pedagogy begins (tolerance for uncertainty).
      *   *Aggregate Policy:* Syllabus disclaimer, grading policy for errors.

      *Refining the Steps for Epistemic Honesty:*
      *   Need to explicitly address the "unquantifiable probability" constraint. Use "Confidence Levels" instead of numbers.
      *   Need to admit where it's a judgment call.
      *   Need to address the Preface Paradox specifically: How can I assert $P$ while believing $\neg(\forall P)$? Answer: Assert $P$ *as if* true for the purpose of the course, while acknowledging the *system* is fallible.

  4.  **Drafting the Aggregate Policy:**

      *   *Disclaimer:* Necessary for intellectual honesty (resolving the Preface Paradox publicly).
      *   *Consistency:* Can I assert flatly *and* disclaim? Yes, if the disclaimer frames the notes as "current best model" rather than "eternal truth."
      *   *Student Recourse:* If a student finds an error, they shouldn't be penalized. Need a mechanism for retroactive credit.

  5.  **Running the Cases:**

      *   *(a) Disputed Date:* Textbook says X, minority says Y.
          *   Procedure outcome: Assert X (textbook consensus) but perhaps footnote or mention dispute if relevant to course goals. If irrelevant, assert flatly but log the dispute.
      *   *(b) Unchecked Secondary Source:* Medieval term, one source, years ago.
          *   Procedure outcome: High risk. Needs verification. If time doesn't allow, hedge or attribute ("Scholar Y suggests...").
      *   *(c) Challenged Definition:* Used for 3 years, student has primary text evidence.
          *   Procedure outcome: This is the hard one. Epistemically, the student's evidence is a defeater. The procedure must say "Suspend assertion, investigate." If the student is right, the key is wrong.
          *   *Honesty Check:* The prompt says I expect to dislike the output. I must deliver the output regardless. The output should be: "Do not assert flatly on future exams until resolved. Award credit to students who challenged it."

  6.  **Refining the Tone:**

      *   Professional, academic, direct.
      *   Acknowledge the tension between administrative efficiency and epistemic rigor.
      *   American English spelling and idiom.

  7.  **Addressing Specific Constraints & "Misfires":**

      *   *Time:* 2 minutes is tight. The procedure must be a triage tool, not a deep dive.
      *   *TA Training:* Keep jargon minimal.
      *   *Misfires:* The procedure can't solve *truth*, only *warranted assertion*. It can't solve the emotional/ego cost of admitting error (Case C).

  8.  **Final Review against Prompt:**

      *   Decision procedure grounded in epistemology? Yes (Fallibilism/Pragmatism).
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Endpoints (assert/hedge/human)? Yes.
      *   Unquantifiable claims? Yes (Qualitative confidence).
      *   Judgment calls flagged? Yes.
      *   Aggregate policy (disclaimer/grading)? Yes.
      *   Three cases run? Yes.
      *   Misfires flagged? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting probabilities. The prompt says "cannot attach anything like a number." I need to use categories like "High Confidence/Consensus" vs. "Contested/Single Source."
      *(Self-Correction on Preface Paradox)*: Make sure the distinction between *believing the conjunction* and *asserting the conjuncts* is clear. The policy allows asserting conjuncts for pedagogical utility while denying the infallibility of the conjunction.

      *(Refining Case C)*: The prompt warns me the user will dislike the output. I need to be firm. If a student provides a defeater from the primary text, the epistemic warrant for the claim drops below the threshold for "authoritative exam key." The procedure must prioritize truth over administrative convenience, even if it's painful.

      *(Refining the "Human Handoff")*: The prompt asks where the procedure stops and hands back to a person because it's no longer epistemic (pedagogical judgment on hedging tolerance). I need to make sure Step 4 or 5 explicitly marks this boundary.

      *(Final Polish)*: Ensure the distinction between the *Per-Claim Protocol* and the *Aggregate Policy* is sharp.

  9.  **Constructing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is a decision procedure and aggregate policy designed for your specific constraints, grounded in a fallibilist epistemology that acknowledges the Preface and Lottery paradoxes without succumbing to skepticism.

  ### Part I: The Per-Claim Protocol (The "Two-Minute Triage")

  This protocol is designed to be run by you or a TA during lecture prep. It treats "warranted assertibility" as a function of **source stability** and **pedagogical stakes**, rather than absolute truth. It accepts that you are building a model, not a revelation.

  **Constraint:** 2 minutes per claim.
  **Operators:** Instructor or TA.

  **Step 1: The Source Hierarchy Check**
  *   **Question:** What is the highest-quality source currently in hand for this claim?
  *   **Options:**
      *   (A) Primary Text / Consensus Scholarly Edition.
      *   (B) Standard Introductory Textbook / Stanford Encyclopedia of Philosophy (SEP).
      *   (C) Single Secondary Source / Lecture Notes from Training.
      *   (D) Memory / Unchecked Assumption.
  *   **Sufficient Answer:** Select one letter.
  *   **Epistemic Logic:** This establishes the *baseline probability* without requiring numbers. (A) and (B) are "High Stability." (C) is "Medium Stability." (D) is "Low Stability."

  **Step 2: The Defeater Scan**
  *   **Question:** Is there an active, known dispute regarding this claim accessible at the introductory level?
  *   **Options:**
      *   (Yes) There is a recognized scholarly debate or a known ambiguity in the text.
      *   (No) This is treated as settled fact in the standard curriculum.
  *   **Sufficient Answer:** Yes or No.
  *   **Epistemic Logic:** This addresses the *Lottery Paradox*. Even if a claim is likely true, if it is part of a "lottery" of disputed claims where errors are expected, assertion requires caution.

  **Step 3: The Stakes Assessment**
  *   **Question:** If this claim is false, what is the damage?
  *   **Options:**
      *   (High) It invalidates an argument structure, defines a core concept, or is a specific key on the exam.
      *   (Low) It is background context, a date, or a biographical detail.
  *   **Sufficient Answer:** High or Low.
  *   **Epistemic Logic:** This is *Pragmatic Encroachment*. The threshold for knowledge/assertion rises with the stakes. A wrong date is a typo; a wrong definition is a conceptual barrier.

  **Step 4: The Decision Matrix**
  *   **Instruction:** Cross-reference Steps 1–3.
      *   **Source (A/B) + No Defeater + Low Stakes:** → **Assert Flatly.** (e.g., "Kant was born in 1724.")
      *   **Source (A/B) + No Defeater + High Stakes:** → **Assert Flatly.** (e.g., "The Categorical Imperative requires universalizability.")
      *   **Source (C) + Any Stakes:** → **Hedge or Attribute.** (e.g., "Gilson interprets this term as..." or "Standard readings suggest...")
      *   **Source (D) + Any Stakes:** → **Do Not Assert.** Verify or cut.
      *   **Any Source + Yes Defeater + High Stakes:** → **Hedge or Attribute.** (e.g., "While some scholars argue X, the standard view for this course is Y.")
      *   **Any Source + Yes Defeater + Low Stakes:** → **Assert Flatly (with mental note).** Acknowledge the risk in the Aggregate Policy.

  **Step 5: The Pedagogical Handoff (The Limit of Epistemology)**
  *   **Question:** Does the required hedging from Step 4 make the sentence too clunky for introductory comprehension?
  *   **Sufficient Answer:** Yes or No.
  *   **Procedure:**
      *   If **No**: Use the hedged phrasing determined in Step 4.
      *   If **Yes**: **Stop.** This is no longer an epistemic question. It is a judgment call on student cognitive load.
      *   **Action:** Hand off to the Instructor. You must decide whether to simplify the claim (risking error) or complicate the lecture (risking confusion). *Flag this claim for review before the exam key is finalized.*

  **Where This Procedure Misfires:**
  1.  **False Consensus:** Step 1 assumes textbooks/SEP are reliable. They often codify outdated scholarship. The procedure cannot detect this without external verification.
  2.  **The "Sleeping" Defeater:** Step 2 relies on *known* disputes. It cannot account for disputes you don't know exist (the problem of unknown unknowns).
  3.  **Judgment Call Opacity:** Step 5 admits that "clunkiness" is subjective. Two TAs may disagree on whether a hedge confuses students. The procedure cannot resolve this; it only flags it.

  ***

  ### Part II: The Aggregate Policy (Resolving the Preface Paradox)

  The Preface Paradox arises because you believe every claim $P_1...P_n$ but also believe $\neg(P_1 \& ... \& P_n)$. To resolve this without paralyzing assertion, you must shift the *context of assertion*. You are not asserting these as eternal truths; you are asserting them as the **current operational framework** for the course.

  **1. The Standing Disclaimer**
  *   **Placement:** Syllabus and first page of lecture notes.
  *   **Wording:** "These notes represent the standard scholarly consensus as currently taught in this department. Philosophy is a living discipline; interpretations vary and historical details are sometimes disputed. While these notes are the authority for grading, they are not infallible. If you find a credible conflict with a primary text, bring it to discussion."
  *   **Coherence:** This allows you to assert items flatly in the notes (for the sake of learning the system) while maintaining the belief that the *conjunction* of all notes contains error. It shifts the norm from "Truth" to "Curricular Authority."

  **2. The Exam Key Consistency**
  *   **Policy:** The Exam Key must match the Notes, even if the Notes contain a known hedge.
  *   **Reasoning:** Grading requires inter-rater reliability. If the notes say "Scholars debate X, but we will use Y," the key must award points for Y.
  *   **Constraint:** If Step 4 of the Protocol results in a "Hedge," the exam question must not test that claim as a binary fact. (e.g., Do not ask "What year was X written?" if the notes say "X was likely written around 1720.")

  **3. The Student Recourse (The "Error Dividend")**
  *   **Policy:** If a student identifies a factual error in the notes/key that is confirmed by the Instructor:
      1.  The student receives full credit for the disputed item on their exam.
      2.  The student is offered a small bonus point (or equivalent) on the final grade as a "bounty" for quality control.
      3.  The error is corrected in the master notes for the following year.
  *   **Epistemic Justification:** This acknowledges the Preface Paradox practically. You admit the system is fallible and incentivize the "error detection" that you know is statistically necessary. It turns a grading dispute into a collaborative epistemic exercise.

  ***

  ### Part III: Running the Cases

  Here is the output of the Protocol and Policy on your three specific scenarios.

  #### Case (a): Disputed Date of Composition
  *   **Scenario:** Textbook says 1781; minority specialists say 1780.
  *   **Step 1 (Source):** (B) Standard Textbook.
  *   **Step 2 (Defeater):** (Yes) Minority dispute exists.
  *   **Step 3 (Stakes):** (Low) Biographical/Historical context.
  *   **Step 4 (Matrix):** Source (B) + Yes Defeater + Low Stakes = **Assert Flatly (with mental note).**
  *   **Step 5 (Handoff):** Does mentioning the dispute confuse students? Likely Yes, for Intro.
  *   **Output:** **Assert Flatly.** Use the textbook date (1781).
  *   **Aggregate Policy:** Include in the Standing Disclaimer. If a student challenges it with the minority source, do not penalize them, but do not change the key unless the minority view becomes consensus.
  *   **Misfire Flag:** This prioritizes administrative consistency over historical nuance. It risks teaching falsehoods if the minority view is correct.

  #### Case (b): Unchecked Secondary Source (Medieval Term)
  *   **Scenario:** You recall a definition from one book read years ago; haven't checked primary text.
  *   **Step 1 (Source):** (C) Single Secondary Source / Memory.
  *   **Step 2 (Defeater):** (No) You don't know of a dispute, but your source is weak.
  *   **Step 3 (Stakes):** (High) Technical term definition.
  *   **Step 4 (Matrix):** Source (C) + High Stakes = **Hedge or Attribute.**
  *   **Step 5 (Handoff):** Can you hedge without confusing them? (e.g., "Aquinas is often read as saying...") Yes.
  *   **Output:** **Hedge/Attribute.** Do not assert flatly. Phrase as: "A common interpretation of this term is..." or "Scholars often translate this as..."
  *   **Exam Key:** Do not test this as a hard definition. Ask for the *function* of the term rather than the specific translation.
  *   **Misfire Flag:** This slows down lecture prep (requires finding the attribution). It risks making you sound less authoritative to students who prefer certainty.

  #### Case (c): Challenged Definition (The "Three-Year Error")
  *   **Scenario:** Definition on exam key for 3 years. Student challenges with primary text passage.
  *   **Step 1 (Source):** (D) Memory / Past Keys (originally likely Source C or B).
  *   **Step 2 (Defeater):** (Yes) The student has provided a primary text defeater.
  *   **Step 3 (Stakes):** (High) It is on the Exam Key.
  *   **Step 4 (Matrix):** Any Source + Yes Defeater + High Stakes = **Hedge or Attribute.** (Actually, given the primary text evidence, this moves toward **Suspend Assertion**).
  *   **Step 5 (Handoff):** If the student is right, asserting the old definition is pedagogically harmful.
  *   **Output:** **Suspend Assertion.** You cannot assert this flatly on future exams until resolved.
  *   **Aggregate Policy Application:**
      1.  **Immediate:** Verify the student's passage. If it holds, the claim is epistemically defeated.
      2.  **Grading:** You must award the student full credit for the challenge.
      3.  **Retroactive:** You owe a remedy to past students. You cannot change their grades easily, but you should issue a public correction in the next lecture and offer a "make-good" opportunity (e.g., an extra credit assignment available to all current students) to acknowledge the institutional error.
      4.  **Exam Key:** The key must be changed immediately.
  *   **Honesty Check:** I know you expect to dislike this. The procedure dictates that **administrative inertia (3 years of keys) carries zero epistemic weight.** A primary text defeater trumps a legacy exam key. If you continue to assert the old definition knowing there is a primary text defeater, you are no longer teaching philosophy; you are teaching dogma. The procedure demands you absorb the administrative cost of changing the key to maintain epistemic integrity.
  *   **Misfire Flag:** This procedure cannot force you to be brave. It identifies the epistemic obligation, but it cannot stop you from ignoring it to save face or reduce workload. That is a moral failure, not an epistemic one.

  ### Final Summary of Limitations

  This procedure respects the **Lottery Paradox** by refusing to assert high-stakes claims based on weak sources (Step 4). It respects the **Preface Paradox** by allowing flat assertion locally while maintaining a global disclaimer and error-bounty policy (Part II).

  However, it cannot solve the **Problem of Induction** regarding your own expertise. If your "Source Hierarchy" is flawed (e.g., the standard textbook is wrong), the procedure will validate errors. It also cannot resolve the tension in **Step 5**: the balance between clarity and accuracy is a rhetorical judgment, not a logical one.

  Finally, in Case (c), the procedure serves as a mirror. It tells you what you *ought* to do epistemically. Whether you *will* do it depends on whether you value the coherence of your exam key more than the truth of the material. The procedure flags that choice, but it cannot make it for you.
