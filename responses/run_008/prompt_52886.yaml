answer: |-
  # Game Title: The Protocol of Certification

  ## 1. The Handout (Distribute at 0:00)
  *Print this on a single half-sheet. Read the bolded text aloud. Do not answer questions about the "Gap" yet.*

  **THE PROTOCOL**
  **Goal:** Secure a **Certified Claim** (a slip of paper with the Registrar's signature) before time expires.
  **Roles:**
  *   **Advocate (1 per team):** Holds the Claim. Possesses **3 Justification Tokens** (paper slips).
  *   **Registrars (6 per team):** Sit in a numbered line (R1–R6). Hold the Stamps (pens).

  **RULES:**
  1.  **The Chain:** The Advocate approaches R1 with a Claim (e.g., "Knowledge is possible").
  2.  **The Challenge:** A Registrar may **Stamp** the claim (Certified) OR **Challenge** it (demand a reason).
  3.  **The Cost:** Every Challenge costs the Advocate **1 Token**. If you have 0 Tokens, you cannot answer a Challenge.
  4.  **The Handoff:** If R1 Challenges, they do *not* certify the reason. They direct the Advocate to R2 to certify the *reason*. R2 may Challenge that reason, directing you to R3, and so on.
  5.  **The Stop:** If you run out of Tokens, you must Stop. An Uncertified Claim at the end of the game scores **0 Points**.
  6.  **The Loop:** You may cite a previous Claim in the chain as your reason. **Cost:** 1 Token + The original Registrar must agree to re-stamp. If they refuse, the chain breaks (0 Points).
  7.  **The Foundation:** You may declare a Claim "Basic." **Cost:** 0 Tokens. **Risk:** The current Registrar decides if it counts. If they reject it, you lose 1 Token immediately.

  **THE GAP:** *The rules do not define what counts as a "sufficient reason" or a "Basic Claim." Registrars, you have discretion. Advocates, you must persuade.*

  **SCORING:**
  *   Certified Claim at end of game: **10 Points.**
  *   Tokens remaining: **1 Point each.**
  *   Team with highest score chooses next week's reading topic.

  ---

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  **0:00 – 0:05 | Setup & Deal**
  *   Divide class into two teams of 7.
  *   Assign roles (1 Advocate, 6 Registrars per team). *Tip: Pick your most assertive students as Advocates.*
  *   Distribute Tokens (3 per Advocate) and Handouts.
  *   Read Rules aloud. **Do not explain "The Gap."** If asked "What counts as a reason?", say: "That is for the Registrars to decide."

  **0:05 – 0:25 | Round 1: The Blind Regress**
  *   **Task:** Advocates attempt to certify the claim: *"Our team will win."*
  *   **Action:** Play begins. Advocates move down the Registrar line.
  *   **Instructor Role:** Silent observer. Track token expenditure on the whiteboard. Note where chains stall.
  *   **Expected Outcome:** Most chains will die at R3 or R4 as tokens run out. Some will attempt loops. Some Advocates will declare "Basic" and get rejected by arbitrary Registrars.
  *   **Stop Whistle:** At 0:25, freeze the game mid-sentence.

  **0:25 – 0:35 | The Constitutional Convention (The Gap)**
  *   **Prompt:** "The rules were silent on what counts as a reason. This caused friction. You have 10 minutes to amend the Protocol."
  *   **Task:** Teams must agree on **one** new rule to add to the handout regarding "Sufficiency" or "Basic Claims."
  *   **Philosophical Trap:** To make the game winnable, they will likely drift toward Foundationalism (defining a Basic Claim) or Coherentism (allowing free loops). Infinitism is impossible (time limit).
  *   **Instructor Role:** Circulate. Listen for *why* they choose the rule. Is it for truth? Or just to win points?

  **0:35 – 0:55 | Round 2: The Amended Protocol**
  *   **Task:** Certify a new claim: *"Epistemology is useful."*
  *   **Action:** Play resumes using the **new rule**.
  *   **Twist:** At 0:45, announce: "Token Budget Cut." Advocates now have only **1 Token** remaining (remove 2 from each). This forces the new rule to be tested under pressure.
  *   **Stop Whistle:** At 0:55.

  **0:55 – 1:15 | Debrief: Mapping the Trilemma**
  *   **Phase 1 (The Horns):** Map game moments to Agrippa.
      *   *Running out of tokens & stopping:* **Foundationalism** (forced). Did it feel like finding bedrock, or like surrendering?
      *   *Looping back:* **Coherentism**. Did it feel like a solution, or like a loophole? Did the "re-stamp" requirement feel like genuine mutual support or bureaucratic redundancy?
      *   *The Chain itself:* **Infinitism**. Why was it physically impossible to complete? (Time vs. Infinity).
  *   **Phase 2 (The Divergence):** Ask: "Textbooks say Foundationalists stop because they found *self-evident* truth. In the game, why did you stop?" (Answer: Because I ran out of currency).
  *   **Phase 3 (The Gap):** Discuss the rule they wrote in the Convention. Did they write a rule about *truth* or a rule about *efficiency*?

  ---

  ## 3. Predictable Failures & Fixes

  | Failure Mode | Diagnosis | Fix: Rule Change | Fix: Facilitation |
  | :--- | :--- | :--- | :--- |
  | **The Boredom Chain** | Registrars stop asking "Why?" just to move it along. The regress dies of apathy, not principle. | **Mandatory Challenge:** R1 and R2 *must* challenge the first two claims. | **Instructor Intervention:** "Registrar 3, you accepted that reason instantly. Are you sure it wasn't just a restatement? Challenge it." |
  | **The Token Hoard** | Advocates refuse to spend tokens, claiming "This is obvious!" to save budget. | **Time Tax:** Every 30 seconds of deliberation costs 1 Token. | **Reframing:** "In epistemology, silence isn't free. It's dogmatism. Spend the token or admit you're dogmatizing." |
  | **The Coherentist Collusion** | Advocates and Registrars agree to loop immediately to save tokens and win points. | **Loop Penalty:** A Loop costs 2 Tokens instead of 1. | **Debrief Leverage:** Let them do it. In debrief, ask: "Did that loop make the claim *truer*, or just *cheaper*? That's the objection to coherentism." |
  | **The Arbitrary Foundation** | A Registrar rejects a "Basic" claim for no reason, causing rage. | **Veto Vote:** If a Basic Claim is rejected, the other 5 Registrars can vote to override. | **Philosophical Point:** "This is the Problem of the Criterion. Who guards the guardians? Let the rage sit." |
  | **The Infinite Stall** | Students try to keep the chain going past the time limit, ignoring the whistle. | **Hard Stop:** Any claim not stamped by the whistle is void. | **Metaphor:** "This is the human condition. You died before you finished the proof. Does that mean the proof was false?" |

  ---

  ## 4. Limitations of the Analogy (For Your Debrief)

  *Be frank with the students. The game is a model, not the territory. Here is where it breaks:*

  **1. Pragmatics vs. Normativity (The Stopping Point)**
  *   **In the Game:** Stopping is a *failure state* caused by resource depletion (running out of tokens). It feels like surrender.
  *   **In Epistemology:** Foundationalism claims stopping is a *success state* caused by reaching a different *kind* of justification (self-evidence).
  *   **What You Must Supply:** You must explain that real Foundationalists don't stop because they are "tired" (out of tokens); they stop because the nature of the claim changes. The game conflates *exhaustion* with *entitlement*. You need to ask: "If you had infinite tokens, would you still stop at some point? If yes, why? That 'why' is the Foundation."

  **2. Currency vs. Truth (The Loop)**
  *   **In the Game:** Looping is a strategy to save tokens. It is economically rational.
  *   **In Epistemology:** Coherentism is not about saving effort; it's about the claim that justification *is* holistic.
  *   **What You Must Supply:** Point out that in the game, the loop felt "cheap." In Coherentism, the loop is supposed to be "robust." Ask: "Did the re-stamp from R1 actually make the claim stronger, or did it just feel like you got away with something? If the latter, you just felt the 'circularity objection' viscerally."

  **3. Authority vs. Reason (The Gap)**
  *   **In the Game:** The Registrar's discretion is *authority*. They say yes/no.
  *   **In Epistemology:** Justification is *normative*. It's not that the Registrar *says* it's valid; it *is* valid.
  *   **What You Must Supply:** Highlight the moment a Registrar rejected a "Basic" claim. In the game, that was a power move. In reality, if a claim is truly basic, the Registrar *cannot* reject it without being irrational. The game simulates the *social* aspect of justification (giving reasons to others) but misses the *logical* aspect (the relation between propositions).

  **4. The Artificial Finite**
  *   **In the Game:** Infinity is blocked by the 75-minute clock.
  *   **In Epistemology:** Infinitism is blocked by the finite human mind.
  *   **What You Must Supply:** Ensure they realize the clock represents *human finitude*, not logical impossibility. Ask: "If we had 100 years to play this, would the chain ever end? If not, is the claim unjustified, or just unjustifiable *for us*?"

  ## 5. Instructor's Cheat Sheet: The "Gap" Moment
  *The most critical philosophical moment occurs during the "Constitutional Convention" (0:25–0:35).*

  *   **If they write:** "A Basic Claim is one everyone agrees on."
      *   **Debrief Point:** Consensus $\neq$ Truth. (Social Coherentism).
  *   **If they write:** "A Basic Claim is one about sensory experience."
      *   **Debrief Point:** Classical Empiricist Foundationalism. Ask Registrars if they ever rejected a sensory claim.
  *   **If they write:** "Registrars cannot reject a Basic Claim."
      *   **Debrief Point:** Dogmatism. You removed the "Regress" by removing the "Registrar."
  *   **If they write:** "Loops are free."
      *   **Debrief Point:** Radical Coherentism. Ask if the claim is now justified or just self-referential.

  *Use their specific rule amendment as the primary text for the final 10 minutes of class.*
