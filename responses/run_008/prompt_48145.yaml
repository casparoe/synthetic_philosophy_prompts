answer: |-
  You have carved out a genuinely subtle distinction that sits right at the intersection of moral philosophy, historical sociology, and game theory. You are right to be dissatisfied with "Overton Window" (which tracks *sayability*, not *efficacy*) and "Moral Panic" (which tracks *escalation*, not *collapse*).

  There is no single, canonical term that captures the exact triad you described: (1) premises are long-accepted, (2) behavior persists due to signaling value, (3) behavior collapses when signaling value flips, leaving the old arguments to take retrospective credit.

  However, there are three established concepts that, when layered, describe your phenomenon precisely. I will outline those, explain where they fall short of your specific carving, and then offer a coinage for the specific gap you've identified.

  ### 1. The Closest Established Concepts

  **A. Preference Falsification (Timur Kuran)**
  This is the strongest match for your "license in a drawer" metaphor. Kuran argues that people often privately reject a norm but publicly support it because they fear social sanctions. They falsify their preferences to fit in.
  *   **Where it fits:** It explains why the argument was inert. Everyone *could* make the argument (privately), but doing so publicly was too costly.
  *   **Where it misses:** Kuran focuses on the *release* of private opinion (the "cascade"). He doesn't fully account for your insight that the *signaling value of the act itself* had to flip first. In your model, people didn't just stop hiding their dislike of dueling; they started viewing dueling as a negative signal. Preference falsification explains the silence; it doesn't fully explain the stigma reversal.

  **B. Signaling Equilibria (Game Theory / Sociology)**
  In signaling theory, practices like dueling or footbinding are "costly signals." They prove you have resources (time, pain tolerance, risk tolerance) to burn.
  *   **Where it fits:** This explains the *mechanism of the flip*. Dueling didn't end because people became more rational; it ended because the signal broke. Once firearms became cheap and accurate, dueling stopped signaling "bravery" and started signaling "suicidal stupidity." The cost remained high, but the information conveyed changed from "honor" to "recklessness."
  *   **Where it misses:** Signaling theory usually describes the behavior, not the *discourse*. It doesn't explain why the *moral argument* suddenly becomes the credited cause. It treats the moralizing as noise, whereas you are asking about the specific causal inertness of that noise.

  **C. Norm Cascades (Cass Sunstein)**
  This describes the speed of the collapse. Once a certain threshold of people stop adhering to the norm, the social cost of adherence spikes, and the norm collapses rapidly.
  *   **Where it fits:** It explains the "couple of generations" speed vs. the "two centuries" of inertia.
  *   **Where it misses:** Like Kuran, it focuses on the *adoption rate*, not the *validity of the justification*. It doesn't distinguish between a norm dying because it's too expensive vs. a norm dying because the *reasons* for it finally landed.

  ### 2. The Missing Piece: The Causal Role of the Argument

  Your specific insight is that the moral argument is **epiphenomenal** to the status shift, yet is retrospectively coded as **causal**.

  In philosophy of history, this is often called **Whig History** (interpreting the past as an inevitable march of progress/reason), but that's a historiographical error, not a sociological mechanism.

  In sociology, the closest fit for "the argument gets credit but did no work" is **Ex Post Rationalization**. However, this usually implies actors lying about their motives. You are describing something structural: the argument *could not work* until the signaling economy shifted.

  ### 3. A Coinage: "Signaling-Contingent Validity"

  Since no single term captures the *dependency of the argument's efficacy on the signaling environment*, I propose we call this **Signaling-Contingent Validity (SCV)**.

  **Definition:**
  A state in which a moral or rational argument possesses logical validity but zero social efficacy until the signaling value of the target practice inverts. The argument functions not as a cause of behavioral change, but as a **coordination script** that becomes safe to invoke only after the status economy has already shifted.

  **The Mechanism:**
  1.  **Latency:** The argument exists and is accepted abstractly (e.g., "killing is wrong"), but invoking it against the practice is socially costly (you signal that you lack honor).
  2.  **Signal Inversion:** External factors (technology, economics, class shifts) change the practice from a high-status signal to a low-status signal (e.g., dueling becomes "ridiculous").
  3.  **Activation:** The old argument is no longer costly to invoke. It floods the discourse.
  4.  **Retrospective Credit:** Historians/actors attribute the change to the argument (the "Wilberforce effect"), ignoring that the argument was available but inert for centuries.

  ### 4. Boundary Conditions (The Edges of the Concept)

  You asked where the edges lie. Here is how SCV applies to your specific boundary questions:

  **A. Legal Change vs. Signal Flip**
  *   **Does it count if the practice was illegal?** Yes. In fact, this *strengthens* the case for SCV. Dueling was illegal in many jurisdictions for a century before it died out. The law was inert because enforcing it required high-status people to sanction their own signaling mechanism.
  *   **The Edge:** If a practice ends *solely* because of state enforcement (e.g., speed limits), SCV does not apply. SCV requires that the *social meaning* flipped before or alongside the enforcement. If the law changes the signal (making the practice a sign of "criminality" rather than "honor"), then the law is the *cause* of the signal flip, not just a mopup.

  **B. Practitioners vs. Signalers (The Footbinding Problem)**
  *   **Does it apply if the practitioners aren't the signalers?** Yes, but the "flip" must happen to the *signalers*.
  *   **The Edge:** In footbinding, women (practitioners) did not decide to stop; the families/men (signalers of status through marriageability) decided the signal was no longer worth the cost/modernization. SCV applies to the group *managing the signal*. If the group benefiting from the signal does not experience the stigma flip, the practice persists (e.g., female genital cutting in some contexts where it remains a required signal of marriageability despite external moral arguments).
  *   **Crucial Distinction:** SCV only works if the *audience* for the signal changes its valuation. If the audience still values the signal, the moral arguments will remain inert regardless of the practitioner's suffering.

  **C. High-Status vs. Low-Status Practices**
  *   **Does it only apply to elites?** SCV is most visible in elite practices (dueling, footbinding) because those rely most heavily on *distinction*.
  *   **The Edge:** For low-status practices (e.g., certain working-class habits), the "signal" is often internal cohesion rather than external prestige. These often die through **Assimilation** or **Economic Necessity** rather than SCV. SCV requires a status economy where "honor" or "shame" is the currency.

  ### 5. Why Your Roommate is Wrong (and Right)

  Your roommate is falling for **Argumentative Epiphenomenalism**. They see the correlation (arguments were made $\to$ practice ended) and assume causation.

  You are identifying that the argument acted as a **Schelling Point**. Once the signaling value flipped, everyone needed a shared language to explain why they were stopping. The old moral arguments were that language. They didn't *drive* the car; they were the *map* everyone started using once the car was already moving.

  **Summary Term:** If you want to win the argument with a label, use **"Signaling-Contingent Validity."** If you want to describe the historical error, call it **"The Myth of Moral Persuasion."**

  Your intuition is correct: The arguments didn't land because they were true; they landed because they were finally safe to use. The causal work was done by the collapse of the status economy, not the strength of the syllogism.
