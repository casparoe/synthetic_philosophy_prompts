answer: |-
  Dear Colleague,

  It is a genuine pleasure to hear that you are designing a new unit on Parfit, and I understand entirely your frustration with the standard menu of thought experiments. We all know the teletransporter, the fission case, and the spectrum of replacement, and as you note, while they successfully pry apart numerical identity and psychological continuity, they leave Parfit's core normative claim intact, namely that Relation R is what matters. To challenge that specific link, we need a case where Relation R is robustly present, yet the intuitive force of survival is absent. I propose a variant I call the Inheritor Protocol, which relies not on branching or gradualism but on the normative stance embedded within the successor's psychology.

  Imagine a teletransporter that functions in the standard Parfitian way regarding physical and psychological transmission. You enter the booth on Earth, your brain states are scanned with perfect fidelity, and your body is destroyed. On Mars, a new body is constructed and imprinted with the scanned states. So far, this is the classic case. However, in this variant, you are a committed non-reductionist who believes that numerical identity is required for survival. Knowing the machine destroys the original, you preregister a specific directive with the operators. You demand that the successor on Mars be programmed immediately upon awakening with the explicit, unshakable belief that they are not you, but rather a distinct person who has inherited your memories and character as a legacy. The machine complies. The successor emerges with perfect quasi-memory of your life, overlapping chains of intention, and identical character traits, satisfying Parfit's criteria for psychological continuity. Yet, due to the programmed directive, the successor views your past projects as the projects of a predecessor, not their own. They remember writing your books and loving your spouse, but they regard these facts with the detached concern of a biographer or an heir, not with the anticipatory concern of a survivor. They know they are psychologically continuous with you, but they believe they are not you, and this belief is not a delusion but a feature of their constructed psychology that you yourself requested.

  The feature meant to produce the intuition that continuity without what matters has occurred is the decoupling of quasi-memory from first-personal identification. In standard cases, psychological continuity carries with it an implicit sense of ownership over the past and future; the successor naturally anticipates the future because they feel they are the one who will live it. In the Inheritor Protocol, the psychological links are present, but the normative stance toward those links is altered. The successor has the data of your life but lacks the prudential concern that typically accompanies survival. This is supposed to show that treating psychological connectedness and continuity as the sole bearer of final value is insufficient because it ignores the mode of appropriation. If a being can possess all the psychological states of a person yet lack the sense that those states bind them to the future in a way that warrants special concern, then continuity alone cannot be what matters. It suggests that what matters is not just the existence of psychological chains, but the subject's capacity to inhabit those chains as their own narrative, a capacity that can be technically preserved while being normatively nullified.

  The strongest objection someone could raise to treating intuitions about a case like this as evidence about what matters in survival is the charge of theoretical contamination. A Parfitian could argue that our intuition that nothing matters in the Inheritor Protocol is not a genuine insight into value, but merely a smuggled reliance on the very notion of identity that Parfit seeks to discard. On this view, if we feel the successor does not survive, it is only because we are secretly assuming that numerical identity is required for what matters, and since we know identity is absent, we conclude survival is absent. The objection claims that if we truly purged our minds of non-reductionist assumptions, we would see that the successor's lack of anticipatory concern is simply an irrational error, akin to forgetting one's own name, and that Relation R is still present and still what matters, regardless of the successor's mistaken beliefs about their own status.

  To answer this, I would argue that the intuition persists even when we stipulate that the successor is fully rational and informed. The successor knows they are psychologically continuous; they are not making a mistake about the facts of continuity. Their lack of concern stems from a coherent normative framework, one that you, the original subject, endorsed by preregistering the directive. If a rational agent, fully aware of the psychological connections, can coherently deny that those connections warrant prudential concern, then the connections themselves cannot be the sole source of that warrant. This suggests that what matters in survival is not just the metaphysical fact of continuity, but the normative practice of identifying with that continuity, and that practice can be disrupted even when the metaphysical facts remain intact. This preserves the force of the counterexample without relying on a confused notion of identity, pointing instead toward a more complex view of survival that incorporates the subject's own evaluative stance.

  I hope this variant proves useful for your seminar, as it forces students to confront whether Relation R is valuable in itself or only valuable when accompanied by the right kind of self-conception.

  Warmly,

  A Friend
