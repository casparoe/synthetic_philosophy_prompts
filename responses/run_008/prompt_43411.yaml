answer: |-
  # Specification for Interpersonal Aggregation of Harm

  This document outlines the desiderata for any rule governing the aggregation of small harms across individuals. It does not argue for a specific moral theory but specifies the constraints any adequate theory must satisfy to handle the "Specks vs. Torture" class of problems.

  ## I. Substantive Cases (The Data Points)
  An adequate rule must deliver determinate verdicts on the following four archetypal cases. The intuition pumps behind these are not premises, but required outputs the rule must account for (either by matching or by explaining away).

  **1. Concentration vs. Distribution (The "One vs. Many" Case)**
  *   **Case:** A total quantity of trivial harm $H$ (e.g., $10^{15}$ dust specks).
      *   *Scenario A:* $H$ is concentrated in one individual's life.
      *   *Scenario B:* $H$ is distributed such that each of $10^{15}$ individuals receives one speck.
  *   **Requirement:** The rule must specify whether aggregation across lives is permissible. Does the disvalue of $H$ remain constant regardless of distribution, or does spreading the harm diminish its total moral weight? A rule must not remain silent on whether the many have a collective claim that outweighs the one's claim to avoid severe suffering.

  **2. Repetition vs. Distribution (The "Within-Life" Case)**
  *   **Case:** A trivial harm $h$ repeated $N$ times.
      *   *Scenario A:* One person suffers $h$ repeatedly over a lifetime (e.g., a mild headache every day for 50 years).
      *   *Scenario B:* $N$ different people suffer $h$ once.
  *   **Requirement:** The rule must distinguish between *intrapersonal* aggregation (summing moments within a life) and *interpersonal* aggregation. It must specify if there is diminishing marginal disvalue for repeated trivial harms within a single life, and whether that diminishing function applies across lives.

  **3. Certainty vs. Risk (The "Lottery" Case)**
  *   **Case:** Choosing between a certain outcome and a probabilistic one.
      *   *Scenario A:* Everyone receives a trivial harm with 100% certainty.
      *   *Scenario B:* One person suffers a catastrophic harm with probability $1/N$, where $N$ is the population size (ex-ante expected harm is identical).
  *   **Requirement:** The rule must determine if the *ex-ante* distribution of risk matters. Does the mere possibility of catastrophe carry a weight disproportionate to its expected utility value? The rule must handle the distinction between "spread-out certainty" and "concentrated risk."

  **4. Sub-Perceptible Harms (The "Unnoticeable" Case)**
  *   **Case:** A harm so small the subject cannot notice or remember it (e.g., shortening a life by one microscopic second, or a neural firing below the threshold of qualia).
      *   *Scenario A:* One person suffers a noticeable harm.
      *   *Scenario B:* A vast population suffers sub-perceptible harms that sum to a measurable loss in aggregate welfare (e.g., total life-years lost), though no individual is worse off in a way they can experience.
  *   **Requirement:** The rule must take a stance on the metaphysics of harm. Is harm defined by *experiential impact* (phenomenology) or *objective state* (functionality)? If the latter, the rule must explain how a population can be "worse off" when no member reports being worse off.

  ## II. Conceptual Distinctions (The Ontology)
  The rule must respect the following distinctions rather than collapsing them into a single metric.

  **1. Severity vs. Number**
  *   **Distinction:** The qualitative gap between types of harm (e.g., pain vs. annoyance) vs. the quantitative count of instances.
  *   **Requirement:** The rule cannot treat severity merely as a scalar multiplier of number. It must specify if there is a lexical ordering where severity trumps number, or if they are commensurable.

  **2. Persons vs. Person-Moments**
  *   **Distinction:** The enduring agent vs. the temporal slice of experience.
  *   **Requirement:** The rule must specify the "currency" of aggregation. Are we summing utilities across person-moments (treating a life as a container of moments) or across persons (treating the life as a unit)? Collapsing persons into moments risks justifying severe sacrifice of one person for the aggregate comfort of their future selves or others.

  **3. Within-Life vs. Across-Life Aggregation**
  *   **Distinction:** Summing harms experienced by one agent over time vs. summing harms experienced by different agents.
  *   **Requirement:** The rule must justify why aggregation is generally accepted within a life (I can endure a headache now for a cure later) but contested across lives. If the rule permits cross-life aggregation, it must explain why the boundary of the skin matters less than the boundary of the moment.

  **4. Harms vs. Unfulfilled Improvements**
  *   **Distinction:** Active infliction of pain vs. failure to provide a benefit (or preventing a trivial loss vs. preventing a severe loss).
  *   **Requirement:** The rule must not treat the gap between "no speck" and "speck" as morally identical to the gap between "no torture" and "torture." It must account for the asymmetry in moral urgency between preventing trivial losses and preventing catastrophic ones.

  ## III. Structural Constraints (The Logic)
  These are formal properties the "better-than" relation must satisfy. Note that some may be camp-specific prejudices.

  **1. Transitivity**
  *   **Constraint:** If Outcome A is better than B, and B is better than C, then A must be better than C.
  *   **Status:** **Potential Prejudice.** While standard in decision theory, some moral philosophers (e.g., Temkin) argue transitivity should be dropped to preserve intuitive judgments in spectrum cases. A rule that violates transitivity avoids "slippery slope" conclusions but sacrifices rational choice coherence.

  **2. Dominance (Pareto Principle)**
  *   **Constraint:** If everyone in Population A is at least as well off as in Population B, and at least one person is strictly better off, then A is better than B.
  *   **Status:** **High Consensus.** Violating this is costly. However, lexical thresholds often violate "Strict Dominance" in mixed cases (e.g., if preventing torture lexically outweighs any number of specks, adding a speck to the torture victim's outcome might not change the ranking, violating strict Pareto).

  **3. Impartiality (Anonymity)**
  *   **Constraint:** The identity of the persons does not matter; only the distribution of welfare counts.
  *   **Status:** **Potential Prejudice.** Prioritarians argue that *who* is harmed matters (priority to the worse off). Strict impartiality treats a harm to a happy person the same as a harm to a suffering person, which some theories reject.

  ## IV. Incompatibility Theorems (The Hard Limits)
  The following pairs of desiderata appear mutually exclusive. An adequate rule must explicitly choose which to sacrifice.

  **1. Continuity vs. Lexical Thresholds**
  *   **Conflict:** If harm is continuous (a spectrum from speck to torture where adjacent steps are morally negligible), Transitivity forces the conclusion that enough specks equal torture. If you insist on a Lexical Threshold (torture is *always* worse than any number of specks), you must deny Continuity or Transitivity.
  *   **Flag:** You cannot have full sensitivity to arbitrarily small harms *and* a hard threshold below which numbers do not accumulate, without violating Transitivity in a spectrum chain.

  **2. Dominance vs. Non-Aggregation**
  *   **Conflict:** In "Mixed Cases" (e.g., Group A: 1 person tortured; Group B: 1 person tortured + 1 billion people get specks), a strict Non-Aggregation view says A and B are equally bad (torture dominates). But Dominance says A is better than B (since the billion are better off in A).
  *   **Flag:** A rule cannot strictly respect Dominance in mixed cases while maintaining that severe harms lexically outweigh all trivial harms.

  ## V. The Workhorse Requirement
  **Transitivity** is the single requirement that does the most work in excluding candidate rules.

  *   **Reasoning:** Transitivity is the engine of the "Spectrum Argument." It forces any rule that accepts small steps of difference to eventually accept the large difference.
  *   **Exclusion Power:**
      *   It excludes **Moderate Aggregation** (e.g., "Specks count, but torture counts more") unless the rule introduces discontinuities.
      *   It excludes **Lexical Thresholds** unless the rule accepts intransitivity or denies that adjacent steps in a spectrum are comparable.
      *   It forces **Additive Aggregation** to accept the "Repugnant Conclusion" equivalent for harm (Torture < Infinite Specks).
  *   **Note:** If Transitivity is treated as a negotiable prejudice rather than a logical necessity, the landscape of viable rules expands significantly. If it is held fixed, the landscape collapses to either strict Additivity or strict Discontinuity.

  ## VI. Candidate Stress Test
  Here is how the three primary candidate rules perform against the specification above.

  **1. Plain Additive Aggregation (Classical Utilitarianism)**
  *   **Mechanism:** Sum total welfare/harm. Severity is just a scalar.
  *   **Performance:**
      *   *Passes:* Transitivity, Dominance, Impartiality, Sub-perceptible aggregation (objective loss counts).
      *   *Fails:* **Severity vs. Number Distinction.** It collapses the gap between torture and specks into a mere ratio. It implies that for any torture, there exists a number of specks that is worse.
      *   *Verdict:* Logically robust, but fails the substantive intuition that severity creates a qualitative barrier.

  **2. Strict Lexical Threshold (Deontological/Rights-Based)**
  *   **Mechanism:** Severe harms belong to a higher order of magnitude that cannot be outweighed by any sum of lower-order harms.
  *   **Performance:**
      *   *Passes:* Severity vs. Number (protects the torture victim), Within-Life vs. Across-Life (often treats persons as inviolable units).
      *   *Fails:* **Transitivity** (in spectrum cases) and **Dominance** (in mixed cases). If Torture > Any Specks, then (Torture) is equivalent to (Torture + Billion Specks), violating Pareto.
      *   *Verdict:* Captures the core moral intuition but creates logical incoherence in comparative choices and spectrum chains.

  **3. Convex Weighting / Power-Law (Prioritarian/Moderate)**
  *   **Mechanism:** Harms are weighted by a function of severity (e.g., harm squared). Severe harms count disproportionately more, but trivial harms can theoretically aggregate to outweigh them if the number is high enough.
  *   **Performance:**
      *   *Passes:* Transitivity, Dominance, Impartiality.
      *   *Fails:* **The Threshold Intuition.** While it delays the tipping point, it ultimately admits that enough specks *can* outweigh torture. It also struggles with **Sub-Perceptible Harms**: if the weight is near zero, the number required becomes metaphysically impossible, effectively functioning as a lexical threshold anyway.
      *   *Verdict:* Mathematically smooth and logically consistent, but may fail to deliver the categorical protection against severe harm that motivates the inquiry.

  ***

  **Summary for Adjudication:**
  The specification reveals that the conflict is not primarily about the *value* of the harms, but about the *structure* of the comparison. If you prioritize **Transitivity and Dominance**, you are forced toward Additive or Convex models, accepting that severity is commensurable with number. If you prioritize the **Severity vs. Number Distinction** (the intuition that torture is categorically different), you must sacrifice Transitivity or Dominance. The "Workhorse" is Transitivity; holding it fixed eliminates the Middle Ground.
