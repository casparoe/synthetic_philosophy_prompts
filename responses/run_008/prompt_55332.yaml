answer: |-
  Yes, there is one rule. It covers every single verdict you listed without requiring you to throw any of them out.

  The rule is formally called **Jeffrey Conditioning**, but since you're a backend engineer and the academic explanations are full of "partitions" and "sigma-algebras," I'm going to call it **The Noisy Sensor Rule**.

  Here is the rule, the explanation of why it solves your teammate paradox, and the verdict on your new case.

  ### The Noisy Sensor Rule

  **The Principle:** You never update on "The World." You only update on "My Observation of The World." Every observation is a sensor reading, and every sensor has a noise profile.

  **The Algorithm:**
  1.  **Identify the Signal:** What specific event would change your mind? (e.g., "The test failed," "The log said ERROR," "The cache is broken.")
  2.  **Determine Sensor Reliability ($P$):** What is the actual probability that this signal reflects reality? This is not "how confident I feel." This is "how often is this sensor right?"
  3.  **The Update:** Shift your belief toward the signal's implication, scaled exactly by $P$.
      *   If $P = 100\%$ (Perfect sensor): Update fully.
      *   If $P = 50\%$ (Coin flip): Do not update (signal is noise).
      *   If $P = 70\%$: Move 70% of the distance you would have moved if you were certain.

  ### Why This Validates All Your Verdicts

  You were worried that this rule contradicts your intuition about the teammates. It doesn't. The contradiction only exists if you misunderstand what the "input number" is.

  **1. The Flaky Test (Single & Double)**
  *   **Your Verdict:** Single failure moves you a little; two failures move you a lot (non-linearly).
  *   **The Rule:** The test is a sensor. If it's flaky, its reliability ($P$) is low.
      *   *Single:* You update by a small factor.
      *   *Double:* Two independent sensors firing is not $P + P$. In probability, independent signals multiply their **likelihood ratios**. If one flaky test gives you a 2:1 odds boost, two give you 4:1. The rule handles this naturally: you process Sensor A, get a new baseline, then process Sensor B on top of that. The moves compound, they don't just stack.

  **2. The Glimpsed Log (70% vs 50/50)**
  *   **Your Verdict:** 70% confidence scales the update; 50% cancels out.
  *   **The Rule:** Your eyes are the sensor.
      *   *70%:* $P(\text{Signal is Real}) = 0.7$. You update 70% of the way.
      *   *50/50:* $P(\text{Signal is Real}) = 0.5$. A sensor that is right half the time provides zero information. The math dictates no update. Your intuition is mathematically exact here.

  **3. The Retracted Update (Infra Issue)**
  *   **Your Verdict:** You should be able to take it back.
  *   **The Rule:** This is just a second update.
      *   *Update 1:* Test failed. Sensor reliability assumed high. Belief shifts.
      *   *Update 2:* New evidence arrives ("Infra dashboard red"). This new evidence sets the reliability of the *first* sensor to 0 for this specific instance. You update on the new evidence, which mathematically reverses the shift from the first update. The rule handles "evidence about evidence" by treating the reliability report as a new sensor input.

  **4. The Teammate Paradox (The Core Conflict)**
  *   **Your Verdict:** Overconfident teammate (90%) moves you less than Calibrated teammate (90%).
  *   **Your Fear:** "If the rule is weighted by confidence, the source shouldn't matter."
  *   **The Resolution:** You are conflating **Stated Confidence** with **Sensor Reliability**.
      *   The rule does not say "Update based on the number they speak."
      *   The rule says "Update based on the probability the statement is true."
      *   **Teammate A (Overconfident):** When they say "90%," historical data shows they are right 60% of the time. Their "90%" is a label. The *Sensor Reliability* is 0.6.
      *   **Teammate B (Calibrated):** When they say "90%," historical data shows they are right 90% of the time. The *Sensor Reliability* is 0.9.
      *   **The Rule:** You plug in 0.6 for Teammate A and 0.9 for Teammate B. The rule is consistent; you just have to decode the signal before processing it. The "source" matters because the source determines the translation from *Words* to *Probability*.

  ### The New Case: Calibrated (60%) vs. Overconfident (95%)

  **The Scenario:**
  *   **Teammate A (Calibrated):** Says "60% sure."
  *   **Teammate B (Overconfident):** Says "95% sure."

  **The Verdict:**
  **They do not cancel out. They reinforce each other, but you must decode Teammate B first.**

  Here is the engineering decision:
  1.  **Decode Teammate A:** Calibrated means their number is real. Input Probability = **0.60**.
  2.  **Decode Teammate B:** Overconfident means their number is inflated. You need to know their "calibration curve." If a person is pathologically overconfident, their "95%" usually maps to reality somewhere around 70-75%. Let's be conservative and say their Input Probability = **0.70**.
  3.  **Combine:** You now have two independent sensors. One says "60% chance of bug," the other says "70% chance of bug."
      *   In Bayesian terms, two weak signals pointing in the same direction create a stronger signal.
      *   You do not average them to 65%. You update on A, then update on B.
      *   **Result:** Your belief should move **higher** than if only the Calibrated teammate spoke. The Overconfident teammate still has signal, just a noisy one. Unless they are literally random (50%), their opinion adds information.

  **Actionable Advice:**
  Treat the Calibrated 60% as your baseline. Then apply the Overconfident 95% as a "noisy sensor" with a reliability of ~0.7. Your final confidence should end up roughly around **80%**.

  ### Summary
  You don't need to throw out any of your intuitions. They are all correct applications of **The Noisy Sensor Rule**.

  The only mistake you were making was assuming that a teammate's spoken percentage is the *input* to the rule. It isn't. It's the *output* of their brain, which you must calibrate before using it as the *input* for yours.

  *   **Flaky test?** Low reliability sensor.
  *   **Glimpsed log?** Medium reliability sensor.
  *   **Overconfident teammate?** High variance sensor (decode the number first).
  *   **Calibrated teammate?** High reliability sensor.

  Stick to this. It keeps your epistemic hygiene clean without requiring a philosophy degree.
