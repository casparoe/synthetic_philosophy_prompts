answer: |-
  # TAXONOMY OF CORRUPTION: A DECISION TREE

  **Instructions:** Follow the branches based on your own intuition about the cases we discussed (the surgeon's envelope, the teacher's gift, the party machine). Do not worry about the "position names" yet—arrive at them honestly.

  ```text
  START: Can an act be corrupt if it is fully legal where it happens?
  │
  ├── NO (Law is the final word)
  │   └── LEAF: LEGAL POSITIVIST
  │       • Awkward Commitment: If a dictator legalizes stealing from the treasury, it isn't corruption.
  │
  └── YES (Law can be wrong)
      │
      ├── Q1: Does the distinction between "public office" and "private friendship" 
      │       exist in all societies, or is it a local invention? *
      │
      ├── IT IS A LOCAL INVENTION (Not universal)
      │   └── LEAF: CULTURAL PARTICULARIST
      │       • Awkward Commitment: A systemic kleptocracy might just be a different form of decency.
      │
      └── IT IS UNIVERSAL (Exists everywhere)
          │
          ├── Q2: Is the primary harm of corruption that it violates a duty 
          │       or that it wastes resources/money? *
          │
          ├── WASTES RESOURCES (Efficiency)
          │   │
          │   ├── Q3: Does bribery help the system work better despite bad rules?
          │   │
          │   ├── YES (Helps)
          │   │   └── LEAF: "GREASE THE WHEELS" ECONOMIST
          │   │       • Awkward Commitment: We should tolerate bribery where regulations are stupid.
          │   │
          │   └── NO (Hinders)
          │       └── LEAF: MODERNIZATION THEORIST
          │           • Awkward Commitment: Societies engaging in reciprocity are just "unfinished" modern states.
          │
          └── VIOLATES A DUTY (Morality/Trust)
              │
              ├── Q4: Does scale change the category? (Is one bribe different from 
              │       a whole party machine trading jobs for votes?)
              │
              ├── NO (Act is act)
              │   └── LEAF: UNIVERSALIST (NGO Style)
              │       • Awkward Commitment: Holiday gifts to teachers count as the same category as stealing infrastructure funds.
              │
              └── YES (System matters)
                  └── LEAF: SYSTEMIC CLIENTELIST
                      • Awkward Commitment: Individual punishment is useless if the system requires favors to function.
  ```

  ### MAP NOTES & DISCUSSION FLAGS

  **★ Anthropology vs. Economics Split:** Expect divergence at nodes marked `*`. Anthropologists often argue the public/private split is Western (*Q1*) and the harm is social (*Q2*). Economists often argue markets are universal (*Q1*) and harm is measurable efficiency (*Q2*).

  **⚠️ Collapsed Leaves:** In countries where local law codifies the NGO definition, the **Legal Positivist** and **Universalist** leaves occupy the same space. The tree cannot separate them there; the conflict shifts to *who writes the law*.

  **☒ Empty/Unstable Combinations:**
  *   *Public/Private is NOT universal + Harm is Efficiency:* This branch is largely empty. It is incoherent to claim "public office" is a Western construct but also judge non-Western societies by universal market efficiency metrics.
  *   *Law is Final + Public/Private is NOT universal:* Unattractive. If law is the only standard, it usually imposes the public/private distinction by force, contradicting the "local invention" claim.

  **💡 Discussion Prep:** When visiting the councillor, notice which leaf *they* are standing on. Are they claiming their favors are "local decency" (Particularist), "systemic necessity" (Clientelist), or denying the conflict exists (Positivist)?
