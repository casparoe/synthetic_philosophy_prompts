answer: |-
  This is a sophisticated position to be in. You have correctly identified that the "Great Divergence" literature is often a battle of competing definitions masquerading as a battle of facts. Spending three to four years on this without institutional constraints is a luxury, but it requires a strategy that avoids the two main traps for independent scholars: **getting stuck in semantic loops** (Question 1) or **drowning in data you can't verify** (Question 2).

  Here is my prioritization of the open questions in this field, ranked by their leverage for a non-academic working exclusively in English. I have integrated your four candidates into this hierarchy, reordered them based on tractability and payoff, and added one critical neglected question.

  ### 1. The Empirical Baseline: When and Where did the Divergence Actually Occur?
  *(Your Candidate #2, moved to Top Priority)*

  **Why this deserves top billing:**
  This is the gatekeeper question. Every causal theory (culture, coal, colonies, institutions) is only valid if it exists *before* the divergence. If the divergence happened in 1750, "deep culture" arguments from 1500 are suspect. If it happened in 1900, then "coal and colonies" arguments from 1800 are insufficient.
  For a non-academic, this is the most tractable starting point because the debate is largely quantitative and conducted in English. The major combatants (Robert Allen, Stephen Broadberry, Kenneth Pomeranz, Jan Luiten van Zanden) publish in English and argue over datasets, not just archives. You do not need to read Chinese gazetteers to evaluate whether real wages in Beijing matched London in 1750; you need to read the arguments *about* those wages.

  **Tractability (English/No Archives):**
  High. The "California School" vs. "Orthodox" debate is fought primarily through synthetic economic history books and papers available in English. You are acting as a juror evaluating expert testimony, not a detective gathering new evidence.

  **Conditions to move it down:**
  If you find that the data is so contradictory that no consensus is possible (a real risk), you must cap the time spent here. Do not try to solve the GDP estimation problem yourself. Set a deadline: "I will accept the current state of play by [Date] and move to causality."

  **Conditions to move it up:**
  If you discover that the timing is the specific weak point in the literature you want to critique. (e.g., If you decide to write an essay arguing that the "1750 divergence" is a statistical artifact).

  ### 2. The Unit of Analysis: Is "Europe vs. China" a Category Error?
  *(Your Candidate #1, refined)*

  **Why this deserves second billing:**
  Once you have a tentative timeline, you must validate the comparison. Comparing "Europe" (a fragmented continent) to "China" (a unified empire) is the most common methodological sin in this field. However, simply saying "it's a bad comparison" is a conversation stopper, not a research project.
  The productive version of this question is: **"What is the correct unit of comparison for the specific mechanism being tested?"** If testing coal, compare Lancashire to Shanxi. If testing institutions, compare the British Parliament to the Qing Grand Council. If testing markets, compare the Yangtze Delta to the North Sea Basin.
  This deserves your attention because it allows you to synthesize the literature without getting bogged down in "Europe did X" generalizations. It turns a metaphysical problem into a methodological tool.

  **Tractability (English/No Archives):**
  Medium-High. The literature on "comparable regions" (Pomeranz, Rosenthal & Wong) is accessible. The trap here is philosophical drift. You must stay grounded in the historical comparisons offered by economists/historians, not drift into pure philosophy of science.

  **Conditions to move it down:**
  If you find yourself writing essays that are purely definitional ("What is Europe?") without linking it to causal mechanisms.

  **Conditions to move it up:**
  If you decide your primary output will be a critique of the field's methodology rather than a historical argument.

  ### 3. The "First Mover" Failure: Why did the Netherlands (and Song China) stall?
  *(Your Candidate #3, expanded)*

  **Why this deserves third billing:**
  This is your best source of specific, high-quality essay topics. The "Great Divergence" is often treated as a binary switch (Industrial Revolution: On/Off). The Netherlands case proves it was a process with false starts.
  The question is: **"What specific constraints stopped high-wage, high-trade economies from mechanizing before 1760?"**
  This is more tractable than the macro "Why Europe" question because the variables are fewer. The Dutch had the capital, the wages, and the trade. They lacked the coal proximity or the specific patent culture, or perhaps the energy crisis wasn't acute enough. This allows you to test the "Coal/Colonies" hypothesis (Pomeranz) against the "High Wage/Innovation" hypothesis (Allen) in a controlled environment.

  **Tractability (English/No Archives):**
  High. Dutch economic history is extremely well-served in English (De Vries, van der Woude). Song China is harder (requires reliance on translations of secondary sources), so focus heavily on the Dutch case as your primary control group.

  **Conditions to move it down:**
  If the literature on the Dutch failure turns out to be too consensus-driven (i.e., "everyone agrees it was X"). Currently, it is not; there is debate on whether it was resource constraints or institutional rigidity.

  ### 4. The Knowledge-Application Gap: Why didn't technology diffuse?
  *(My Addition / The Neglected Question)*

  **Why this deserves attention:**
  This is the most neglected angle in popular debates. We assume that if a technology existed (e.g., steam pumps, clockwork), it should have spread. But in the 18th century, Chinese elites *knew* about European technology (Jesuits brought it). They just didn't adopt it at scale.
  The question is: **"Was the barrier to industrialization a lack of *knowledge*, or a lack of *incentive* to apply known knowledge?"**
  This cuts through the "Needham Question" noise. If the Chinese knew how to build a steam engine but chose not to, "science" isn't the answer. If they couldn't build it because of metallurgy, then "science/materials" is the answer. This focuses your research on the *mechanism of adoption* rather than the *origin of ideas*.

  **Tractability (English/No Archives):**
  Medium. Requires reading history of technology and specific case studies (e.g., the clockmaking trade in Canton vs. London). There is good English material on Jesuit transmission of knowledge.

  **Conditions to move it up:**
  If you find the macro-economic debates (Timing/Framing) too abstract. This question is concrete and technological.

  ### 5. The Coherence of the Counterfactual
  *(Your Candidate #4, downgraded)*

  **Why this is lower priority:**
  You are right to question this, but for a non-academic, this is a **tool**, not a **project**.
  Spending years asking "Is it coherent to ask what if?" risks becoming a philosopher of history rather than a student of the divergence. You need to use counterfactuals to test causal claims (e.g., "If Britain had no coal, would it still have industrialized?"), but making the *validity* of counterfactuals your primary research topic yields diminishing returns. It leads to skepticism, not synthesis.

  **Tractability:**
  Low. This requires heavy philosophy of history reading (Weber, Marx, Analytic Philosophy) which pulls you away from the economic history data.

  **Conditions to move it up:**
  Only if you intend to write a meta-critique of the entire discipline.

  ---

  ### Critique of Your Candidates

  *   **Candidate 1 (Framing):** **Keep, but operationalize it.** Don't just ask "Is it well-posed?" Ask "Which framing yields the most testable hypotheses?"
  *   **Candidate 2 (Timing):** **Essential.** This is the only one that is empirically falsifiable. Start here.
  *   **Candidate 3 (Netherlands):** **Excellent.** This is your "control group." It prevents you from accepting "European Culture" as a magic variable.
  *   **Candidate 4 (Counterfactual):** **Downgrade.** Use it to stress-test your conclusions, not as a primary research pillar.

  ### The 3-4 Year Strategy

  If I were in your position, I would structure the time like this:

  **Year 1: The Empirical Baseline (Timing & Data)**
  Focus entirely on Candidate #2. Read the opposing datasets (Allen vs. Broadberry vs. Pomeranz). Do not try to solve the debate. Map the contours of *where* they disagree. Is it wage data? Energy data? Output data?
  *Goal:* Write an essay summarizing the "State of the Data." This forces you to understand the limits of what we know.

  **Year 2: The Control Cases (Netherlands & Song)**
  Focus on Candidate #3. Deep dive into why the Dutch Golden Age didn't become an Industrial Revolution. Compare this to the Song Dynasty.
  *Goal:* Write an essay on "The Preconditions that Weren't Enough." This isolates the specific "spark" variables (coal, patents, etc.) from the general "background" variables (markets, wages).

  **Year 3: The Mechanism (Knowledge & Adoption)**
  Focus on my Added Question. How did technology move? Why did it stop at the border?
  *Goal:* Write an essay on "Barriers to Diffusion." This moves you from macro-economics to the history of technology and state policy.

  **Year 4: Synthesis (Framing & Counterfactuals)**
  Now you use Candidate #1 and #4. With the empirical and mechanistic knowledge from Years 1-3, you can now critique the framing. You can say, "The question is well-posed *only if* we define Europe as X and China as Y."
  *Goal:* A final synthesis essay or series that proposes a refined question for the next decade of research.

  ### A Warning on Language and Access
  You mentioned English-only. This is a hard constraint on **Candidate #2 (Timing)** regarding China.
  *   **The Trap:** Many English estimates of Chinese GDP/Wages rely on a small number of translated Chinese sources. If those translations or interpretations are flawed, the English debate is built on sand.
  *   **The Mitigation:** You must acknowledge this limitation explicitly in your writing. Do not pretend the data is solid. Treat the Chinese data as "estimates of estimates." This actually strengthens your position: you are analyzing the *Western understanding* of the divergence, which is a valid historical subject in itself.

  ### Final Verdict
  The question that deserves the most attention is **Timing (Candidate #2)**, because it is the only one that allows you to rule out entire classes of explanation.
  The question that will produce the most interesting essays is **The Netherlands/First Mover (Candidate #3)**.
  The question you should treat with the most suspicion is **Counterfactual Coherence (Candidate #4)**.

  If you can accept that you will not *solve* the Great Divergence, but rather *map the topology of the debate*, you will have a productive four years. If you try to find the "True Answer," you will burn out. The value you add is in the clarity of the synthesis, not the discovery of new facts.
