  3.  **Identify Missing/Neglected Questions:**
      *   *The "How" vs. "Why":* Most debate focuses on preconditions (why *could* they?), less on the mechanism of diffusion/adoption (why *did* they?).
      *   *The Energy/Thermodynamics Angle:* Not just "coal," but the specific technological interface with energy.
      *   *The State Capacity/Fiscal Question:* It's not just "institutions," but specific fiscal-military structures.
