  Let's refine the "New Addition." Actually, the "Global Conjuncture" is part of Pomeranz's argument. A better neglected question might be: *"Was Industrialization a 'Phase Transition' or a 'Gradient'?"* i.e., Was it a sudden break or slow accumulation? This links Timing and Mechanism.
  Actually, the "Netherlands" point is strong enough to stand as the "Control Case" priority.
  Let's stick to the user's strong instincts but reorder them based on *leverage*.

  *Decision:* I will prioritize **Timing** first because it dictates which causal stories are physically possible. Then **Framing**, because it dictates which comparisons are valid. Then **The Netherlands** as the specific test case. Then **Counterfactuals** as a sanity check. I will add a fifth: **The Diffusion Question** (Why didn't tech spread *to* China immediately if it was viable?).

