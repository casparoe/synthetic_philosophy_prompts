          *   *Cons:* Can become purely semantic/philosophical. Risk of "navel-gazing" without producing historical insight.
          *   *Tractability:* High. Most major syntheses (Pomeranz, Allen, Rosenthal/Wong, Vries) debate this explicitly in English.
          *   *Verdict:* Essential foundation, but shouldn't be the *only* thing.

      *   *Candidate 2: Timing of Divergence (Deep roots vs. 1750+)*
          *   *Pros:* Empirical. Determines which causal mechanisms are even plausible.
          *   *Cons:* Data heavy. Requires understanding economic history methodology (real wages, GDP estimates).
          *   *Tractability:* Medium-High. Broadberry, Gupta, Allen, Pomeranz write in English. But requires statistical literacy.
          *   *Verdict:* High priority because it gates the causal explanations.

      *   *Candidate 3: The Netherlands Anomaly*
          *   *Pros:* Excellent control case. Tests "European exceptionalism" variables.
          *   *Cons:* Often subsumed under "Europe." Niche.
          *   *Tractability:* High. De Vries, van der Woude, etc., write in English.
          *   *Verdict:* Underrated (as user suspects). Great for a specific essay, maybe less for a 3-year overarching project unless framed broadly as "Why not the First Mover?"

      *   *Candidate 4: Coherence of the Counterfactual*
