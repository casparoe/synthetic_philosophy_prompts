      *   *Refining the "Why":* For each, explain *why* a non-academic should care. (e.g., Timing is where data is most accessible; Framing is where synthesis matters more than new data).
      *   *Language Constraint Check:* Ensure I mention that economic history data (Broadberry, Allen) is in English. Mention that deep Qing archival stuff is not, so avoid questions requiring deep Chinese local gazetteer analysis.
      *   *Conditions for Movement:* What would change the ranking? (e.g., if new data pushes divergence back to 1600, Timing becomes even more critical).

  6.  **Self-Correction/Critique during drafting:**
