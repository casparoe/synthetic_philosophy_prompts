prompt: |-
  So me and my brother-in-law have been having the same argument for like two years now: is the brain a computer or not. I'm a sysadmin, no philosophy or neuroscience background at all, and he's a neuroscience grad student who's kind of insufferable about it. But here's the thing I've noticed from all these arguements: they never go anywhere because nobody agrees what "computer" even means. If a computer is just anything that takes inputs and produces outputs according to some rule, then sure, the brain's a computer, but so is a thermostat and a river delta, and the claim becomes boring. If it means stored programs with seperate memory and processing like the machine on my desk, the brain obviously isn't one, and the claim is dead on arrival. So people are talking past each other, and I want to stop arguing and figure out what the actual question is first.

  What I want from you is the spec. Write me the list of things a theory that says the brain is (or isn't) a computer would have to deliver before I should believe it. Which facts about the brain it can't contradict -- neurons firing way slower than transistors, no clean line between "memory" and "processing" since the connections between neurons seem to BE the memory, the whole thing being noisy and redundant and still working fine after strokes chew parts of it out. Which puzzles it has to actually deal with, like how something that was grown instead of designed ends up with "representations" in it at all, or whether it matters that evolution had no spec sheet. And which distinctions it's not allowed to collapse -- computing something vs merely being describable as computing something, following a rule vs just happening to match one, simulating a thing vs being the thing. For each requirement, tell me what the case is that it's a genuine requirement and not just one camp's pet preference dressed up as one, and flag any pair of requirements you suspect can't be satisfied together. That last part is honestly what I want most, because if some of these are impossible together then the whole debate has been misframed for decades and I'd like to know that before round 12 with this guy.

  Then at the end, briefly, run the main positions against your list -- the straightforward "the brain literally computes, it's just not a laptop" view, the "brain is a dynamical system, computation talk is a bad metaphor" view, and whatever the in-between view is where it's computational but not in the way engineers mean. Keep that part short though, the requirements are the real deliverable.

  Please structure it in these sections, in this order: "Where I'm at" (short, just my confusion restated so we're sure you're answering the right question), "The requirements" (the bulk of it, roughly 60% of the whole thing), "Requirements that might clash" (medium), "The main views vs the list" (brief), and "Settled vs up for grabs" (short). That last one really matters: my brother-in-law talks like all of this is settled science and I want to know what's actually agreed on by people who study this versus what's genuinely contested. Please don't hand me someone's contested opinion as if it were the consensus -- I want to be able to catch him doing exactly that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Sysadmin, practical, technical background, no philosophy/neuroscience training. Frustrated by semantic arguments with a neuroscience grad student brother-in-law (BIL).
      *   **The Conflict:** "Is the brain a computer?" Argument has stalled for two years due to definitional ambiguity.
      *   **The Goal:** Stop arguing about definitions, start arguing about *specifications*. The user wants a "spec sheet" for a theory of brain computation. What facts must it explain? What distinctions must it respect? What trade-offs exist?
      *   **Specific Constraints:**
          *   Structure: "Where I'm at", "The requirements", "Requirements that might clash", "The main views vs the list", "Settled vs up for grabs".
          *   Tone: Practical, rigorous, avoiding philosophical fluff, acknowledging the BIL's potential insufferability without being rude.
          *   Content: Must distinguish between genuine requirements vs. pet preferences. Must highlight impossible trade-offs. Must clarify consensus vs. contention (crucial for catching the BIL).
          *   Length/Weight: "The requirements" should be ~60% of the content. "Main views" should be brief.

  2.  **Deconstruct the Core Question:**
      *   The question "Is the brain a computer?" is indeed a category error if left undefined. It's a metaphorical vs. literal debate.
      *   To make it useful, we need to treat "computer" not as a laptop, but as a *computational theory of mind (CTM)* framework.
      *   The "Spec" needs to cover:
          *   Hardware constraints (biology).
          *   Functional constraints (what it does).
          *   Semantic constraints (meaning/representation).
          *   Explanatory power (what it solves).

  3.  **Drafting - Section by Section:**

      *   **Where I'm at:** Acknowledge the user's insight. They are right: the definition of "computer" is the bottleneck. Restate the goal: moving from "Is it X?" to "If we call it X, what work does that do?"

      *   **The Requirements (The Meat):** I need about 5-7 strong requirements.
          1.  *Substrate Independence vs. Biological Reality:* It can't ignore the wetware (slow, noisy, analog).
          2.  *Memory/Processing Integration:* Can't assume Von Neumann architecture.
          3.  *Representation:* How do physical states mean things? (Syntax vs. Semantics).
          4.  *Robustness/Damage:* Graceful degradation vs. catastrophic failure.
          5.  *Development/Evolution:* It wasn't coded; it grew.
          6.  *Causal Power:* Computation must *do* the work, not just describe it.
          7.  *Tractability:* The theory must actually predict behavior, not just retro-fit it.
          *   *Justification:* For each, explain *why* it's a requirement (e.g., if you ignore noise, you aren't modeling the brain).

      *   **Requirements that might clash:** This is the critical insight section.
          1.  *Abstract Computation vs. Embodied Specificity:* If computation is substrate-independent, why does brain chemistry matter? (The "Hardware matters" clash).
          2.  *Digital Discreteness vs. Analog Continuity:* Neurons spike (digital-ish) but potentials are analog. Which is the real computation?
          3.  *Representation vs. Dynamics:* Do neurons hold "symbols" or just settle into states?
          *   *Implication:* If these clash, the "Brain = Computer" metaphor might need a new definition of computation (e.g., morphological computation, neural dynamics).

      *   **The Main Views vs the List:**
          1.  *Classic Computationalism (CTM):* Brain is software running on wetware. Good on representation, bad on biology.
          2.  *Dynamical Systems:* Brain is a physical system evolving over time. Good on biology, bad on explaining "meaning."
          3.  *Neurocomputationalism (Connectionism/ANN):* The middle ground. Good on learning/structure, struggles with systematicity/logic.

      *   **Settled vs up for grabs:** This is where the user catches the BIL.
          *   *Settled:* Brains process information. Neurons signal. Damage causes loss of function.
          *   *Contested:* Whether "information processing" equals "computation" in the Turing sense. Whether representations are real or observer-relative. Whether the metaphor limits research.
          *   *Advice:* If BIL says "It's settled that the brain computes information," he's mostly right. If he says "It's settled that the brain runs algorithms like Python," he's wrong.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Keep it sysadmin-friendly. Use analogies (legacy code, spaghetti infrastructure, hardware failure).
      *   *Constraint Check:* Ensure "The requirements" is the longest section. Ensure the structure matches exactly.
      *   *Accuracy Check:* Ensure I'm not misrepresenting neuroscience or philosophy of mind. (e.g., Don't say "neurons are digital." Say "spikes are discrete events.")
      *   *Self-Correction during drafting:* I initially thought about putting "Consciousness" in the requirements. *Correction:* No, that muddies the water. Stick to cognition and processing. Consciousness is a separate hard problem. Keep it to the "computer" analogy.
      *   *Emphasis:* Make sure the "Settled vs Up for Grabs" section is punchy so the user can use it as a cheat sheet.

  5.  **Final Review against User Prompt:**
      *   "Spec" format? Yes.
      *   Facts it can't contradict? Included (speed, memory/processing blend, noise).
      *   Puzzles to deal with? Included (growth, evolution).
      *   Distinctions not to collapse? Included (description vs. causation).
      *   Clash flagging? Included.
      *   Structure followed? Yes.
      *   BIL check? Yes.

  6.  (Self-Correction on "Requirements" length): I need to make sure I expand enough on the *justification* for each requirement so it hits the 60% target. I will elaborate on *why* failing that requirement breaks the theory.

  7.  (Final Polish): Ensure the distinction between "computational *description*" and "computational *mechanism*" is clear, as that's the user's main insight.

