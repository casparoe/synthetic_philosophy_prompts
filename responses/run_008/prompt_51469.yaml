answer: |-
  # Where I'm at

  You are correctly identifying the bottleneck. The argument stalls because "computer" is being used as a noun (a physical object like a laptop) by one side and a functional abstraction (a system that manipulates symbols) by the other. If you define it broadly enough to include the brain, you include thermostats and tides, rendering the term useless. If you define it narrowly (Von Neumann architecture), the brain fails immediately.

  You are asking for a **functional specification**. You want to know: If we hypothesize that the brain is a computer, what specific constraints must that hypothesis satisfy to be scientifically useful rather than just a metaphor? Below is the spec sheet. It treats "computation" not as a device, but as a theoretical framework that must earn its keep by explaining biological reality, not ignoring it.

  # The requirements

  For a theory claiming "the brain is a computer" to be valid, it must satisfy the following seven requirements. If it fails these, it is either bad neuroscience or bad engineering.

  **1. The Substrate Constraint (Biology is not incidental)**
  *   **The Requirement:** The theory cannot treat the brain as "software running on wetware" where the hardware is interchangeable. It must explain why *this* specific hardware (slow, chemical, parallel, energy-hungry neurons) produces *this* specific mind.
  *   **Why it's genuine:** In your servers, you can migrate a VM from bare metal to the cloud with zero change in output. In the brain, changing the chemistry (neurotransmitters, hormones) changes the "output" (personality, cognition). If the theory claims computation is substrate-independent, it contradicts the fact that psychiatric drugs work.
  *   **The Trap:** Claiming the brain implements a "logical algorithm" that could theoretically run on silicon without loss of function.

  **2. The Architecture Constraint (No Von Neumann Bottleneck)**
  *   **The Requirement:** The theory must account for the fact that memory and processing are physically co-located. There is no RAM stick separate from the CPU. The "weights" (synaptic strengths) *are* the memory, and they *are* the processing pathway.
  *   **Why it's genuine:** In your machines, fetching data costs time and energy (the von Neumann bottleneck). In the brain, "fetching" a memory *is* re-activating the processing circuit that created it. A theory that assumes distinct storage and retrieval registers is biologically false.
  *   **The Trap:** Diagramming the brain like a flowchart with distinct "memory modules" and "processing units."

  **3. The Noise Tolerance Constraint (Graceful Degradation)**
  *   **The Requirement:** The theory must explain how the system functions despite high error rates, signal loss, and physical damage. It cannot rely on parity bits or error-correcting code in the traditional sense.
  *   **Why it's genuine:** Transistors are reliable; neurons are stochastic (probabilistic). You can lose 10% of your brain tissue in a stroke and retain function; you cannot lose 10% of your OS kernel and boot. A computational theory that requires precise state maintenance fails here.
  *   **The Trap:** Assuming neural spikes are digital bits (0 or 1) without accounting for timing jitter, failed synaptic transmission, or analog potential gradients.

  **4. The Developmental Constraint (No Designer, No Spec)**
  *   **The Requirement:** The theory must explain how the "code" gets written without a programmer. The system self-assembles based on genetic rough drafts and environmental tuning.
  *   **Why it's genuine:** Your servers run code written by an engineer. The brain grows its own circuitry. A computational theory must explain how "representations" (data structures) emerge from a growth process that has no goal state other than survival.
  *   **The Trap:** Assuming there is a "language of thought" pre-installed. The "code" must be shown to be written by the learning process itself, not assumed to exist a priori.

  **5. The Causal Constraint (Computation must do the work)**
  *   **The Requirement:** It is not enough to say the brain *can be described* as computing. The theory must show that the computational properties are what *cause* the behavior.
  *   **Why it's genuine:** I can describe the flow of water in a river as "computing" the path of least resistance. But the water isn't processing information; it's just obeying physics. If the brain is a computer, the manipulation of symbols/states must be the causal mechanism of thought, not just a useful way for us to talk about it.
  *   **The Trap:** Confusing *simulation* with *implementation*. Just because you can simulate a brain on a computer doesn't mean the brain is a computer (you can simulate a storm on a computer, but a storm isn't a computer).

  **6. The Representation Constraint (Semantics)**
  *   **The Requirement:** The theory must explain how physical states acquire *meaning*. How does a pattern of spikes become a "concept" of a cat, rather than just voltage?
  *   **Why it's genuine:** Computers manipulate syntax (symbols) without knowing semantics (meaning). Humans know meaning. If the brain is a computer, the theory must bridge the gap between electrical firing and "aboutness" (intentionality).
  *   **The Trap:** Assuming that because we can *interpret* neural activity as representing "grandmother," the neuron itself knows it represents "grandmother."

  **7. The Timescale Constraint (Speed vs. Complexity)**
  *   **The Requirement:** The theory must reconcile millisecond-scale biological events with second-scale cognitive decisions without invoking magic.
  *   **Why it's genuine:** Neurons fire at ~200Hz max. Transistors run at GHz. Yet the brain outperforms supercomputers on pattern recognition. A computational theory cannot just say "it's parallel." It must explain how slow components achieve real-time processing without a clock cycle.
  *   **The Trap:** Assuming the brain has a global clock or synchronous processing. It doesn't.

  # Requirements that might clash

  This is the part you asked for most. There are genuine tensions here. If your brother-in-law claims these are all easily resolved, he is glossing over the hardest problems in the field.

  **Clash 1: Substrate Independence vs. Biological Specificity**
  *   **The Conflict:** Classical computation theory says logic is separate from hardware (Requirement 1). But neuroscience shows chemistry dictates cognition (Requirement 1).
  *   **The Implication:** You cannot have it both ways. Either "computation" in the brain is so tied to biology that it's not "computation" in the CS sense, or the CS definition of computation is too narrow.
  *   **Flag:** If he says "The brain is a computer, so we can upload minds," he is violating the Biological Specificity constraint. If he says "The brain is unique biology, so computation metaphors are useless," he violates the Causal Constraint.

  **Clash 2: Discrete Symbols vs. Continuous Dynamics**
  *   **The Conflict:** Computers rely on discrete states (0/1, On/Off) to maintain logical integrity (Requirement 3 & 6). Brains are largely analog, continuous dynamical systems (Requirement 3).
  *   **The Implication:** If the brain computes using discrete symbols, where is the thresholding mechanism that turns analog noise into digital certainty? If it computes using analog dynamics, is it still a "computer" or just a machine?
  *   **Flag:** This is the biggest fight in the field. "Digitalists" say spikes are bits. "Dynamicalists" say spikes are just perturbations in a field. They cannot both be the *primary* mode of operation.

  **Clash 3: Representation vs. Reaction**
  *   **The Conflict:** To be a computer, the system must manipulate internal representations of the world (Requirement 6). To be a biological organism, the system often just needs to react to stimuli directly (embodied cognition).
  *   **The Implication:** Does the brain build a model of the world (compute) or does it just couple with the environment (react)?
  *   **Flag:** If he insists the brain *must* have internal models for everything, he's ignoring efficient biological reflexes. If he says there are *no* internal models, he can't explain imagination or planning.

  # The main views vs the list

  Here is how the three major camps score against your spec.

  **1. Classical Computationalism (The "Brain is Software" View)**
  *   **Pitch:** The brain manipulates symbols according to rules.
  *   **Passes:** Representation, Causal Constraint.
  *   **Fails:** Substrate, Architecture, Noise Tolerance.
  *   **Verdict:** Good for explaining logic and language, terrible at explaining biology. Your BIL likely leans here but tries to hand-wave the biology.

  **2. Dynamical Systems Theory (The "Brain is an Engine" View)**
  *   **Pitch:** The brain is a physical system evolving over time, like a weather system. Computation is a bad metaphor.
  *   **Passes:** Substrate, Architecture, Noise, Timescale.
  *   **Fails:** Representation, Causal (in the symbolic sense).
  *   **Verdict:** Biologically accurate, but struggles to explain how we think about things that aren't present (abstraction).

  **3. Connectionism / Neural Networks (The "Middle Ground")**
  *   **Pitch:** Computation happens via weighted connections and activation patterns, not symbols.
  *   **Passes:** Architecture, Noise, Development, Timescale.
  *   **Fails:** Representation (hard to interpret *what* the weights mean), Causal (often acts as a black box).
  *   **Verdict:** The current dominant framework. It admits the brain computes, but not like your laptop. It computes via statistical adjustment.

  # Settled vs up for grabs

  Use this to check your brother-in-law. If he presents the "Up for Grabs" items as facts, he is overstating the consensus.

  **Settled Science (He is right if he says these):**
  *   Neurons transmit signals via electrochemical spikes.
  *   Information is processed in the brain (sensory input is transformed into motor output).
  *   Specific brain regions are specialized for specific tasks (localization).
  *   Synaptic plasticity (changing connection strength) is the physical basis of learning.
  *   The brain is a physical system subject to the laws of physics.

  **Up for Grabs (He is bluffing if he says these are facts):**
  *   **"The brain runs algorithms."** (Contested: Is "algorithm" a useful description or a category error?)
  *   **"Neural spikes are binary code."** (Contested: Rate coding vs. temporal coding vs. analog potential.)
  *   **"Cognition is information processing."** (Contested: Some argue this strips away the meaning of experience.)
  *   **"We will eventually simulate a brain on silicon."** (Contested: Depends entirely on the Substrate Constraint.)
  *   **"There is a 'neural code' waiting to be cracked."** (Contested: There may be no single code, just diverse mechanisms.)

  **The Cheat Code:**
  If he says, "The brain *is* a computer," ask him: "In what sense? Does it satisfy the Substrate Constraint, or are you treating biology as incidental?" If he says, "The brain is *not* a computer," ask: "Then how do you explain abstract reasoning without invoking representation?"

  The consensus is not that the brain *is* a computer. The consensus is that **computational modeling is the most productive tool we currently have to study the brain.** That is a methodological agreement, not an ontological fact. Don't let him sell you the method as the truth.
