answer: |-
  The sensible refusal to pay arises because expected value maximization is a long-run aggregate norm that becomes misleading guidance for single-shot decisions when the distribution's mean is dominated by outcomes so improbable they will never occur in practice, rendering the mathematical expectation irrelevant to the agent's actual welfare.

  The core diagnostic error in your brother-in-law's reasoning is treating the expected value (the ensemble average) as the correct guide for a decision that will only be played once or a few times (the time average). In the St. Petersburg game, and in your brother-in-law's crypto scheme, the mean payoff is driven entirely by outcomes in the far tail of the distribution. For any realistic number of plays, the actual average return will converge not to the expected value, but to the median outcome, which is negligible. This distinction, often framed in modern terms as ergodicity economics, diagnoses the problem rather than merely blocking it: it explains why the mathematical object (infinite expectation) fails to map onto the physical reality of an agent living through time rather than across parallel universes.

  Regarding the specific responses you mentioned, we must distinguish between those that patch the math and those that correct the decision norm. Bernoulli's diminishing marginal utility (concave utility functions) blocks the original paradox by making the expected *utility* finite, but as you noted, it fails against the "Super St. Petersburg" variant where payoffs outpace any unbounded utility function. This reveals that concavity alone is a symptom blocker; the deeper diagnostic fix is **bounded utility**. If utility is bounded, no payoff structure can generate infinite expected utility. However, you must clarify the consensus status here: while bounded utility is practically necessary for real-world agents (because the universe contains finite resources), it is **contested** as an axiom in pure decision theory. Some theorists argue bounded utility implies counterintuitive preferences (such as ignoring massive improvements in welfare if probability is low enough), so you cannot present it as settled dogma, only as a pragmatic necessity for finite beings.

  Truncating the series at the casino's bankroll is often dismissed as ad hoc, but in a real-world context like a crypto scheme, this is actually a diagnostic feature, not a bug. It highlights that the gamble is not a self-contained mathematical object but a contract subject to counterparty risk. If the fair price tracks the house's wealth, it is because the payoff *actually depends* on the house's wealth. The awkwardness you perceive arises only if you treat the gamble as abstract; in practice, recognizing that the "infinite" payoff is physically impossible correctly collapses the valuation to something manageable. This is settled reasoning in finance: expected value must be discounted by the probability of default.

  Discounting or refusing to act on minuscule probabilities is the most **contested** response. Rationalists often reject this because it violates continuity axioms and opens the door to inconsistency (e.g., ignoring a 1-in-a-billion chance of death vs. a 1-in-a-million chance). However, in the context of your brother-in-law's scheme, this refusal is justified not by arbitrary probability thresholds but by **model uncertainty**. In abstract probability problems, the odds are given by stipulation; in crypto schemes, the probabilities are estimated from unstable models. When probabilities are derived from empirical models rather than logical stipulations, the error bars on "one in a billion" are so large that the expected value calculation becomes noise. This is a settled distinction in applied risk analysis: epistemic uncertainty swamps aleatory uncertainty in the extreme tails.

  Your professor's framing of "vanishing probability dominance" captures what is really going on better than the infinity framing. The problem is not that the sum diverges, but that the contribution to the sum comes from events that are effectively impossible within the agent's lifespan. This diagnoses the issue as a mismatch between the statistic used (mean) and the relevant outcome measure (typical realization). In distributions with such extreme skew, the mean is non-ergodic; it does not represent what happens over time. For your brother-in-law, you should argue that unless he can play the game infinite times (which he can't), the expected value is a phantom number. The crypto scheme relies on him confusing the mathematical expectation of a hypothetical ensemble with the likely growth rate of his actual bankroll.

  To summarize the consensus landscape: It is settled that expected value maximization is not the sole criterion for rational choice under risk, and that risk aversion (concave utility) is rational. It is contested whether utility must be axiomatically bounded or whether ignoring small probabilities is ever strictly rational. However, it is practically settled that for single-shot decisions with extreme skew, the median outcome and the risk of ruin dominate the mean in rational deliberation. Your brother-in-law's error is assuming the mean matters for a single shot; the diagnosis is that he is applying a long-run frequency norm to a one-off event, guided by a tail probability that will never materialize.
