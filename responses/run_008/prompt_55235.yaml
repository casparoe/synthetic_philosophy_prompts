prompt: |-
  I'm auditing a graduate decision theory seminar, and the topic has become unexpectedly practical: my brother-in-law is trying to talk me into a crypto "liquidity pool" scheme whose advertised returns are clearly built on the assumption that tiny-probability, astronomically-large payoffs can be treated on a par with ordinary ones, and I want to be able to articulate exactly why that reasoning goes wrong rather than just gesturing at the St. Petersburg paradox. In the seminar, the paradox itself is familiar enough — a fair coin flipped until it lands heads, with the payoff doubling each time, yields an infinite expected value, yet no one would pay even a modest sum to play — but I've found that when I try to explain to my brother-in-law *where exactly* the divergence between the mathematics and the sensible refusal comes from, I can't do better than naming the standard responses (Bernoulli's diminishing marginal utility, truncating the series at the casino's actual ability to pay, refusing to attach decision weight to vanishingly small probabilities) without being able to say which of them actually diagnoses the problem and which merely blocks this one counterexample while leaving the underlying issue intact.

  There's a wrinkle from the seminar I'd especially like you to address. My professor suggested that the paradox is not fundamentally about infinity at all, but about what we might call expectations dominated by events of vanishing probability: even in a game with a huge but finite expected value carried almost entirely by outcomes you're near-certain never to see, the same tension between expectation and rational choice shows up, just weaker. Relatedly, I know there's a variant — I've seen it called the super St. Petersburg game — where the payoffs grow fast enough that even Bernoulli's logarithmic utility leaves the expectation divergent, so the marginal-utility fix can't be the whole story, and I've heard that truncating at the bankroll's actual resources has its own awkward feature: the fair price then tracks the house's wealth rather than anything about the gamble's structure, which seems to get something backwards.

  So please explain, for someone with a semester of decision theory but no measure theory, where precisely the sensible refusal to pay a lot comes from, and how the main lines of response (bounded or concave utility, finite bankroll truncation, discounting or refusing to act on minuscule probabilities, and any rejections of expected-value maximization itself) differ in whether they treat the paradox's cause or merely its symptom. If you think the "vanishing probability dominance" framing captures what's really going on, say so and defend it; if you think it's a distraction, explain why. Throughout, I need you to keep a clear running distinction between what is broadly settled among decision theorists and what remains genuinely contested — for instance, I take it the claim that rational utilities must be bounded is still disputed, and I don't want a contested position smuggled in as consensus. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restatement of my question.
