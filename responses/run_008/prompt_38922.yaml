answer: |-
  Your friend is running the standard **Formula of Universal Law**, distinguishing between **Contradiction in Conception (CIC)** and **Contradiction in Will (CIW)**. This fits her track record perfectly. CIC bans perfect duties (false promises, shoplifting); universalizing them destroys the practice. CIW bans maxims a rational being cannot will (never helping, letting talents rust), even if the practice survives. Crucially, this explains her permissibility verdicts: skipping class and spending surplus income fall under *imperfect duties*, which require adopting the end (self-improvement, beneficence) but allow latitude in execution. The folksy "if everyone did that" test fails here; a world where no one helps doesn't collapse logically, it just becomes miserable, which is why she needs the CIW ("no rational being with needs") standard. The "Means/Ends" formula is compatible but less operational for her specific verdicts on latitude.

  **Predictions:**
  1.  **Book Shelf:** **Impermissible.** This is a CIC violation. The maxim "take without contributing" relies on others contributing. Universalized, the shelf empties instantly, destroying the institution. It mirrors her shoplifting verdict. Formulation matters: "free-riding" triggers the contradiction; merely "taking a book" does not.
  2.  **Cake Lie:** **Impermissible.** Truthfulness is a perfect duty (CIC). Even white lies undermine the trust necessary for communication. Given her strict ban on false promising for money, she is unlikely to carve out exceptions for social comfort.

  **Tie-Splitter:**
  Both CIC/CIW and "Means/Ends" predict these verdicts. To split them, ask: **"Is it permissible to refuse to save a drowning child because it would ruin your expensive shoes?"**
  Her "never helping" verdict bans total non-beneficence, but "spending surplus" allows prioritizing self. This case tests the *threshold* of imperfect duty. A "Means/Ends" reading might condemn valuing shoes over a life as treating the child as less than an end. A strict CIW reading might struggle to define the exact limit of required sacrifice without a specific duty to maximize good. Her answer reveals whether she prioritizes the *status of persons* (Means/Ends) or the *consistency of willing* (CIW) when duties conflict with significant personal cost.
