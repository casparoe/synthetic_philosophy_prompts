  Here is the diagnosis. Your labmate's argument is a classic "triviality objection" against Cummins, and it feels compelling because it exploits the gap between philosophical precision and biological intuition. The core issue is that Cummins' account is inherently *relational* (function is always function-relative-to-a-system-capacity), whereas your labmate's Step (7) treats function as a *monadic* property (true or false simpliciter). Under Cummins, Step (5) is actually correct: relative to the diagnostic system, the heart's sound *is* a functional component. The error lies in Step (7), which asserts this attribution is false *simpliciter* rather than false only relative to the organismal system. You cannot coherently keep both (2) and (7); if any system counts (2), then functions are relative, so claiming an attribution is absolutely false (7) is a category mistake.

  Regarding the "mirror trap" on Selected Effects (SE): your labmate is conflating *function* with *current utility*. Sophisticated SE theorists (like Neander) distinguish between a trait's proper function (what it was selected for) and its current exaptive use. Feathers selected for thermoregulation but used for flight have the *function* of thermoregulation and the *use* of flight. The SE account doesn't fail here; it simply refuses to call exaptations "functions," which is a theoretical feature, not a bug. However, this comes at the cost of diverging from common biological parlance where we often say "the function of feathers is flight."

  To save the Cummins account without collapsing into teleology, you must reject the absolutism in (7). This preserves the theoretical openness of (2) while acknowledging that biological practice implicitly restricts the relevant system to the organism. You pay the cost of admitting that "function" is context-dependent, but you avoid the charge of logical inconsistency.

