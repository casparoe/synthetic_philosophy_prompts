      *Soft Spot:* Admitting it's uncoded. *Shore up:* Mention modern neural nets as implicit learners of these 'orbits'.

      **3. The 'Just Metaphor' Attack (General)**
      *Objection:* "You're a journalist. 'Knobs' and 'orbits' are metaphors. Where are the operational definitions?"
      *Reply:* "They are metaphors for cognitive structures. I'm not proposing a new variable today; I'm proposing a lens to reinterpret your variables. Don't mistake the map for the territory."
      *Soft Spot:* Vulnerable on rigor. *Shore up:* Pre-emptively concede this (see Section 3).

