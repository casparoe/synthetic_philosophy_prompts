      *   *Key Insight:* The "Small Improvement Argument" is the linchpin. I need to explain clearly why +$5k doesn't solve the soullessness issue.
      *   *Key Insight:* The "Choosing vs. Picking" distinction is about *agency*. Picking is finding the best option. Choosing is making an option the best by committing to it.

  6.  **Final Polish:** Check against the prompt requirements.
