              *   Round 2: The Trichotomy (Better/Worse/Equal).
              *   Round 3: The Small Improvement Argument.
              *   Round 4: Choice vs. Picking (Will/Commitment).
          3.  Overall Verdict: Who wins?
          4.  Practical Advice: How does this help the user decide? (Don't look for the answer, *be* the answer).

