answer: |-
  This is a fantastic dinner argument because it perfectly recapitulates the foundational debate of sociology: **Marx vs. Weber.** Your cousin is channeling Max Weber (culture/ideas drive history), and his wife is channeling Karl Marx (material conditions drive history).

  For your paper, the most important takeaway is that modern sociology generally rejects the idea that you have to choose one *or* the other. However, to answer your specific request, I will break down their exchange round-by-round to evaluate the strength of their arguments, and then tackle the wife's opening ontological claim.

  ### Round 1: The Opening Salvo
  *   **Cousin:** Culture (work ethic, saving) caused early industrialization.
  *   **Wife:** Culture is an epiphenomenon (a byproduct). Real causes are material (ownership, geography, institutions). Citing culture is empty.

  **Who is stronger?** **Draw (with a warning to the Wife).**
  *   **Analysis:** The wife is stating a position called **epiphenomenalism**. This is a classic Materialist stance. It is theoretically coherent, but empirically very hard to defend in its absolute form. If culture is *only* a residue, it is difficult to explain why two groups with identical material conditions often behave differently.
  *   **The Catch:** The cousin's opening is also too blunt. Saying industrialization is "basically culture" ignores the massive role of coal deposits, colonial extraction, and legal systems.
  *   **Verdict:** The wife wins on methodological caution (don't just wave your hands at "values"), but she loses on plausibility. Most sociologists agree culture *does* something, even if it isn't the *only* thing.

  ### Round 2: The Weber Defense
  *   **Cousin:** Weber's *Protestant Ethic*. Similar material conditions existed elsewhere, but capitalism took off where Protestantism was. Therefore, values do independent work.
  *   **Wife:** (Wait for next round).

  **Who is stronger?** **Cousin.**
  *   **Analysis:** This is the strongest logical argument for cultural causality. It is essentially a **natural experiment**. If $A$ (Material Conditions) is present in Place 1 and Place 2, but $B$ (Capitalism) only happens in Place 1, and the main difference is $C$ (Culture/Religion), then $C$ is a likely cause.
  *   **Sociological Context:** Weber argued that Catholicism and Protestantism existed in similar economic environments (e.g., within Germany), yet Protestant regions tended to develop capitalist enterprises faster. This suggests culture isn't just a mirror of the economy.

  ### Round 3: The Falsifiability Attack
  *   **Wife:** Cultural explanations are unfalsifiable. If Protestants get rich, you credit the ethic. If Catholics get rich (like France), you just tell a different story. It's post-hoc storytelling.
  *   **Cousin:** (Wait for next round).

  **Who is stronger?** **Wife (Methodologically), Cousin (Historically).**
  *   **Analysis:** The wife is identifying a real problem in sociology called **tautology**. If you define "culture" so loosely that it can explain anything, it explains nothing. This is a valid critique of *bad* cultural sociology.
  *   **The Nuance:** However, she is being unfair to Weber specifically. Weber didn't just say "Protestants got rich." He proposed a specific *mechanism*: anxiety about salvation led to worldly asceticism, which led to reinvestment of capital. That is a testable chain of events, not just a vibe.
  *   **Verdict:** The wife wins the point on the *risk* of cultural explanation, but the cousin is right that Weber's specific theory is not immune to testing.

  ### Round 4: The Empirical Defense
  *   **Cousin:** That's sloppy culturalism, not Weber. Weber makes checkable predictions (e.g., Protestants save more, have higher literacy) within the same country. Data supports this.
  *   **Wife:** (Wait for next round).

  **Who is stronger?** **Cousin.**
  *   **Analysis:** He is correct. Modern economic historians (like Becker and Woessmann, 2009) have actually tested this. They found that Protestant regions *did* have higher literacy rates (because you needed to read the Bible), and literacy is a strong predictor of economic development. This moves culture from "vibe" to "mechanism."
  *   **Verdict:** By identifying a specific mechanism (literacy/saving) that can be measured, the cousin moves the argument from philosophy to social science.

  ### Round 5: The "Third Variable" Problem
  *   **Wife:** Even if correlations hold, you haven't ruled out that both the values and the economic behavior flow from something further back (e.g., state capacity, trade routes, geography) that you haven't identified.
  *   **Cousin:** (No rebuttal provided).

  **Who is stronger?** **Wife.**
  *   **Analysis:** This is the problem of **endogeneity** or **omitted variable bias**. It is the hardest hurdle for cultural causality. For example, maybe "state capacity" (a strong government) allowed for both the enforcement of Protestant reforms *and* the protection of property rights needed for capitalism. If so, culture didn't cause capitalism; the State caused both.
  *   **Verdict:** This is the wife's strongest point. In social science, proving $X$ causes $Y$ requires ruling out $Z$. It is incredibly difficult to fully rule out all material/historical confounders.

  ---

  ### The Big Question: Does her opening claim survive?
  **Claim:** *"Culture can't be a cause... 'culture' is just what those things leave behind."*

  **Verdict:** **No, her opening claim does not survive.**

  Even though she won the final round on methodological difficulty, her ontological claim (that culture *cannot* be a cause) is rejected by the vast majority of contemporary sociology. Here is why you should argue this in your paper:

  1.  **Culture Constitutes Interests:** Materialists assume people know what their material interests are (e.g., "make more money"). But culture defines what people *want*. If a culture values honor over wealth, a person will sacrifice money for honor. That is a causal effect of culture on material outcome.
  2.  **The "Toolkit" Theory:** Sociologist Ann Swidler argues culture isn't just values (ethics); it's a "toolkit" of habits and skills. If you don't have the cultural script for how to apply for a loan or negotiate a contract, the material opportunity (the bank) doesn't matter. The lack of cultural knowledge *caused* the lack of economic mobility.
  3.  **Reciprocal Causality:** The debate frames culture and material conditions as enemies. Modern sociology sees them as **mutually constitutive**. Material conditions shape culture (the wife is right here), but once that culture exists, it shapes how people respond to new material conditions (the cousin is right here).

  ### Advice for Your Paper
  If you want to ace this paper, don't declare a winner between your cousin and his wife. Instead, use their argument to show the evolution of the field:

  1.  **Acknowledge the Wife's Strength:** Admit that "lazy culturalism" (saying "they are poor because they have a bad culture") is often racist, unfalsifiable, and ignores structural barriers. This validates her methodological critique.
  2.  **Validate the Cousin's Mechanism:** Show that when culture is defined precisely (e.g., specific norms, networks, or literacy rates), it can be measured and shown to have independent effects.
  3.  **The Synthesis:** Conclude that culture is a **mediating variable**.
      *   *Example:* Geography (Material) $\rightarrow$ Trade Routes $\rightarrow$ Cosmopolitan Culture $\rightarrow$ Innovation.
      *   In this chain, the material started it, but the culture was the *mechanism* through which the material caused the outcome. Without the culture, the material factor wouldn't have worked.

  **Summary for your thesis:** Culture is not a "ghost in the machine" that operates independently of reality (as the cousin sometimes implies), but it is also not merely a "shadow" cast by material conditions (as the wife claims). It is the lens through which material conditions are interpreted and acted upon, making it a necessary part of any causal explanation.
