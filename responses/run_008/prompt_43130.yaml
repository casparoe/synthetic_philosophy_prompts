          4.  Advice for the Paper (how to synthesize).
      *   **Key Concepts to Weave In:** Epiphenomenalism, Endogeneity, Omitted Variable Bias, Mechanism, Reciprocal Causality.

  6.  **Refining the Arguments (Self-Correction during drafting):**
