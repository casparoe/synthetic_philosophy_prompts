  **Five Daily Disciplines for the Aspiring Saint**

  1. Begin by auditing your leisure hours, ensuring that pursuits like gardening or piano practice do not displace opportunities for direct charitable aid. If a hobby does not alleviate suffering, ask yourself if it is truly worth the time.

  2. Cultivate a disposition where duty provides deeper satisfaction than personal joy, ensuring that sacrifice never registers as a loss. This emotional alignment prevents the burnout common to those who act merely out of obligation.

  3. When deciding between a relaxing evening and a volunteer shift, consistently select the option that generates the most measurable benefit for others. Over time, this calculus becomes second nature, eliminating the friction of choice.

  4. Accept that friends may come to value your moral approval more than your company, and interpret their deference as a marker of your progress. Their comfort in your presence is less important than their respect for your standards.

  5. Regard any personal interest that does not contribute to the welfare of others as a suspect use of attention requiring strict justification. Only by narrowing your focus can you guarantee that every action serves the greater good.

  ***

  **Editorial Note on Philosophical Accuracy**

  The column treats Wolf's descriptive claim—that saints would be boring or one-dimensional—as a prescriptive goal, which is the core satirical turn. While Wolf argues that a life devoted exclusively to morality is undesirable, she does not necessarily claim saints would be universally disliked, only that their company might lack certain human joys. The advice blends Wolf's distinct models of the "Loving" and "Rational" saint, whereas she treats them as separate psychological types with different drawbacks. Finally, the column presents the "suspect at the margin" logic as settled utilitarian doctrine, whereas Wolf contests whether morality should dominate all rational choice.
