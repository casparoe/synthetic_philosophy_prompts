answer: |-
  This is a delightful taxonomy. Your neighbor is effectively reconstructing a hybrid of **Tinbergen's levels of analysis**, **Dennett's kinds of minds**, and **Clark & Chalmers' extended cognition**, but she's applied it with a specific, somewhat conservative bias regarding what counts as "internal" versus "external."

  Based on her past verdicts (especially the demotion of the scrub-jay and the pausing rat), we can reverse-engineer the specific criteria she is using to police the boundaries. Here is the rulebook she is likely running, followed by the predictions and the test case you need.

  ### 1. The Hidden Rulebook

  **Rung 1 (The Genetic Algorithm):**
  *   **Rule:** Adaptation exists only in the population, not the individual.
  *   **The Sea Slug Clue:** She excludes habituation. This means "learning" requires *associative* plasticity. Non-associative changes (getting tired of a stimulus) don't count as individual problem-solving.

  **Rung 2 (The Reinforcement Selector):**
  *   **Rule:** The creature selects from an *existing* repertoire based on past reward history.
  *   **The Rat/Scrub-Jay Clue:** This is the most critical boundary. She demoted the rat pausing at a choice point and the scrub-jay hiding its cache. Why? Because she views these as **retrieval of cached values**, not **simulation of counterfactuals**.
      *   The rat isn't thinking "If I go left, X happens"; it's thinking "Left felt good last time."
      *   The jay isn't thinking "He sees me, so I should move this"; it's executing a hardwired social script triggered by the presence of another bird.
  *   **Criterion:** Behavior is driven by *backward-looking* reinforcement.

  **Rung 3 (The Mental Simulator):**
  *   **Rule:** The creature generates *novel* solutions via offline modeling before action.
  *   **The Chimp/Raven Clue:** Stacking crates and bending wire are not in the standard repertoire. They require manipulating an internal model of physics to predict an outcome that has never been reinforced before.
  *   **Criterion:** Behavior is driven by *forward-looking* simulation. The "error" happens in the model, not the world.

  **Rung 4 (The Symbolic Scaffolder):**
  *   **Rule:** The creature uses exogenous, culturally transmitted *symbolic* systems that restructure the cognitive process itself.
  *   **The Toddler/Wolf Clue:** A wolf pack is just multiple Rung-2 agents coordinating. A toddler with words is Rung 4. Why the difference? Words (and maps/math) are **arbitrary symbols** that allow for cognitive offloading. They don't just help you act; they change what you can represent.
  *   **Criterion:** Cognition is distributed across brain and **symbolic artifact**.

  ---

  ### 2. Predictions for the New Cases

  Here is how she will likely rule on your four new cases, based on the rules above:

  **(a) The Octopus (Social Learning)**
  *   **Verdict:** **Rung 2.**
  *   **Reasoning:** She will argue this is **mimicry** or **stimulus enhancement**, not simulation. Since she dismissed the scrub-jay's sophisticated social behavior as a "fixed reflex," she will likely treat the octopus's observation as a trigger for a behavioral script ("See twist, do twist") rather than an understanding of the jar's mechanics. Unless the octopus modifies the technique for a *new* type of jar, it's selection, not generation.

  **(b) The Chess Program**
  *   **Verdict:** **Falls off the ladder (Category Error)** OR **Rung 2 (Disguised).**
  *   **Reasoning:** This is the bullet she has to bite. Functionally, a chess engine is the ultimate Rung 3 agent (millions of offline simulations). However, given her philosophical leanings, she will likely argue it is **Rung 2**: it is minimizing an error function based on training data (reinforcement). It has no "internal model" of the board, only weights.
  *   *Alternative:* She may argue it is a **Rung 4 Tool** for the human player, not a mind itself. The ladder classifies *minds*, not *artifacts*. If you force her to classify it as an agent, she will likely say it falls off because it lacks biological teleology (it doesn't *care* about winning).

  **(c) The New Caledonian Crow (Cultural Tools)**
  *   **Verdict:** **Rung 3.**
  *   **Reasoning:** This is the trap for the Rung 4 definition. While the tool design is "culturally transmitted," the tool itself is **physical**, not **symbolic**. A hook gets you food more efficiently, but it doesn't change the *logic* of your thinking (like arithmetic does). She will maintain that Rung 4 requires **symbolic scaffolding** (language, math, maps) that allows for abstract manipulation, not just better physical leverage. The crow is still thinking *with* its brain, just holding a better stick.

  **(d) You (Long Division on Paper)**
  *   **Verdict:** **Rung 4.**
  *   **Reasoning:** This is the paradigm case. You are offloading working memory onto the paper. The symbols (numerals) are arbitrary and culturally transmitted. Without the paper and the notation, you cannot perform the operation. The thinking happens in the **loop** between your retina, your hand, and the symbols. This fits her "tools change the kind of thinking" criterion perfectly.

  ---

  ### 3. The Discriminating Test Case

  You identified the tension: Is Rung 4 defined by **Language** specifically, or by **Any Culturally Transmitted Tool**? The Crow case (c) suggests she leans toward "Language/Symbols," but she hasn't been forced to admit it yet.

  To split these rules, you need a case that involves **Cultural Transmission of a Physical Tool** vs. **Symbolic Reference without Language**.

  **The Case to Bring: "Alex the African Grey Parrot" vs. "Termite-Fishing Chimps"**

  Bring the data on **Alex (the parrot)** who used English labels not just to request food, but to categorize objects by color, shape, and material, and could understand concepts like "same/different" and "zero."

  *   **Why this splits the rules:**
      *   **If she puts Alex on Rung 4:** Then the criterion is **Symbolic Reference**. It doesn't matter that it's not full human language; the use of arbitrary labels to manipulate concepts is the key. This confirms the Crow is Rung 3 (physical tools) and Alex is Rung 4 (symbolic tools).
      *   **If she puts Alex on Rung 3:** Then the criterion is **Human Language Only** (or perhaps "Open-ended Generativity"). She is claiming that unless you have syntax, you don't get off the biological ladder.
      *   **If she puts Alex on Rung 2:** Then she is claiming **All Animal Communication is Conditioning**. (This would be consistent with her scrub-jay verdict, but very hard to defend with Alex's zero-shot categorization data).

  **The Specific Question to Ask Her:**
  > "If a chimp teaches its baby to use a stick for termites, that's Rung 3 (physical tool). If a parrot learns to use the label 'red' to group apples and blocks, is that Rung 4? If not, why does the stick count as a tool for the hand, but the word 'red' not count as a tool for the mind?"

  This forces her to clarify if Rung 4 is about **Species** (Humans only), **Modality** (Language only), or **Function** (Symbolic Offloading).

  ### 4. The Chess Program: Does it fall off?

  You asked if there is a reading where the chess program falls off entirely. **Yes.**

  The ladder is implicitly a **Ladder of Biological Cognition**.
  *   Rung 1 is Evolution.
  *   Rung 2 is Operant Conditioning.
  *   Rung 3 is Cognitive Modeling.
  *   Rung 4 is Cultural Scaffolding.

  All four rungs presume a **biological agent with teleological drives** (survival, reproduction, reward). A chess program has no drives; it has an objective function assigned by a human.
  *   **The "Fall Off" Argument:** The chess program is not a climber; it is a **Rung 4 Tool** created by a Rung 4 mind (the programmer). To classify the program itself is to commit a category error. It is a map, not a traveler.
  *   **The Bullet:** If she insists on classifying it as an agent, she must admit that **Rung 3 does not require consciousness**, only functional simulation. If she isn't ready to grant AI "thinking" status, she must ban it from the ladder entirely.

  ### Summary for your preparation:
  1.  **Her Core Distinction:** Rung 2 is *selecting* past rewards; Rung 3 is *simulating* future outcomes; Rung 4 is *offloading* cognition onto symbols.
  2.  **Octopus:** Rung 2 (Mimicry).
  3.  **Chess:** Off the ladder (Artifact, not Agent) or Rung 2 (Brute force selection).
  4.  **Crow:** Rung 3 (Physical tools $\neq$ Symbolic scaffolding).
  5.  **You:** Rung 4 (The definition of the rung).
  6.  **Killer Case:** Alex the Parrot (Symbolic categorization without full language). If Alex is Rung 4, her rule is "Symbols." If Alex is Rung 3, her rule is "Humans Only."
