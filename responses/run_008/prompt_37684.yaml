answer: |-
  ### Executive Summary: The Critical Flaw & The Fix

  I must be plain: **Paying students on a simple self-report of intention dissolves Kavka's puzzle.**

  If you offer $5 for writing "I intend to drink," every student will write it. They know they won't drink, but the statement is costless. The puzzle relies on the *inability* to form the intention, not the inability to *claim* it. If the game allows cheap talk, the "Two Arms" will not come apart for the right reasons; they will come apart because Arm 1 tests honesty/accuracy and Arm 2 tests willingness to lie.

  **The Fix:** To make this work pedagogically without spending thousands on a neuro-imaging intention detector, you must add a **Rationalization Filter** to Arm 2. To claim the Arm 2 reward, students must not only state their intention but provide a *reason for action* that will hold at the time of drinking. As the instructor, you act as the "Rationality Arbiter." You reject reasons like "for the money" (because the money is already secured by the intention) or "I might like it" (because the tea is defined as unpleasant). This forces them to experience the *block* in practical reasoning that Kavka describes.

  Below is the design incorporating this fix.

  ---

  ### Activity: The Toxin Tea Protocol

  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Budget:** ~$25 (Cash prizes + Tea supplies)
  **The "Toxin":** "The Bitter Brew." 2 cups of very strong black tea (steeped 10+ mins), lukewarm, with a pinch of salt and no sugar. It is harmless, non-emetic, but genuinely unpleasant to drink in one go.

  #### Materials
  1.  **Cash:** $25 in small bills ($1s and $5s).
  2.  **The Tea:** Prepared in a French press or pot. Bring small shot glasses (1 oz) so they don't have to drink a full cup.
  3.  **Handout:** "The Protocol Sheet" (two distinct sections for Arm 1 and Arm 2).
  4.  **Envelopes:** 18 small envelopes for sealing predictions.

  #### Payoff Scheme
  *   **Arm 1 (Prediction):** $1.00 for an accurate prediction of their own behavior.
  *   **Arm 2 (Intention):** $5.00 *offer* for forming a valid intention. (Note: You will likely pay $0 here, which is part of the lesson).
  *   **Total Budget:** $18 for Arm 1 (if everyone wins) + $5 reserve + $2 for tea = $25.

  ---

  ### Timeline & Rules

  #### 1. Setup & The Offer (0:00–0:15)
  *   **Display the Tea:** Pour a shot for yourself and drink it visibly. Grimace slightly. Establish that it is unpleasant but safe.
  *   **The Task:** Students must choose to drink one shot of the tea tonight between 8:00 PM and 11:00 PM.
  *   **Verification:** They must email you a photo of the empty shot glass with a timestamped newspaper headline or a specific code you provide in class to prove it was taken tonight. (Acknowledge this is honor-system adjacent, but sufficient for seminar stakes).

  #### 2. Arm 1: The Prediction Market (0:15–0:35)
  *   **Instruction:** "On the left side of your sheet, write **WILL** or **WON'T**. This is a bet on your future behavior."
  *   **Rule:** If your prediction matches your actual behavior tonight, you win **$1**.
  *   **Action:** Students write, seal their prediction in an envelope, and write their name on the outside. Collect these.
  *   **Pedagogical Goal:** This isolates *Belief*. Students know the tea is unpleasant and the reward is independent of drinking. Rational choice says *Won't*. Most will predict *Won't*.

  #### 3. Arm 2: The Intention Contract (0:35–0:55)
  *   **Instruction:** "On the right side, there is a contract. If you **intend** to drink the tea tonight, sign here. If you sign, I will give you **$5** right now."
  *   **The Catch (The Rationalization Filter):** "However, to keep the $5, you must write a **Reason for Action** in the box below. This reason must be valid *at the time of drinking*. I will review these. If your reason relies on the $5 reward, I will reject it, because the $5 is given for the intention, not the drinking. If your reason is 'I like bitter tea,' I will reject it, because we established it is unpleasant."
  *   **Action:**
      1.  Offer the $5 bills to anyone who signs. (Most will take them).
      2.  Collect the sheets.
      3.  **Crucial Moment:** Read a few "Reasons" aloud anonymously. Most will write "For the money" or "I intend to."
      4.  Explain that based on the rules of the Toxin Puzzle, these reasons are invalid. The money is *already theirs* based on the signature. It cannot motivate the drinking.
      5.  Ask them to hold the money but reflect on whether they *actually* formed the intention or just took the cash.

  #### 4. Debrief & Mapping (0:55–1:15)
  *   Do not wait for the drinking deadline to debrief. The puzzle happens *now*, in the reasoning.
  *   **Discussion Questions:**
      1.  "In Arm 1, why did you predict you wouldn't drink?" (Answer: No incentive to drink, tea is bad).
      2.  "In Arm 2, why did you take the $5?" (Answer: Free money).
      3.  "Did taking the $5 make you intend to drink?" (Answer: No).
      4.  "Could you write a valid reason to drink?" (Answer: No).
  *   **Mapping to Theory:**
      *   **Arm 1 = Belief (Expectation):** Based on evidence of future utility. Since drinking has negative utility, Belief = No.
      *   **Arm 2 = Intention:** Requires a plan to act. A plan requires a reason. The Reward is fixed *before* the act. Therefore, the Reward cannot be the reason for the act. Without a reason, there is no plan. Without a plan, there is no Intention.
      *   **The Gap:** You can *say* you intend (and take the money), but you cannot *be* in the state of intending while knowing you won't drink. The discomfort you feel holding the $5 while knowing you won't drink *is* the Toxin Puzzle.

  ---

  ### Predictable Failures & Divergences

  You asked for honesty about where this diverges from the ideal case. Here is what will go wrong:

  **1. The "Lying" Loophole (Major Divergence)**
  *   **Ideal:** The agent *cannot* form the intention.
  *   **Classroom:** The student *can* lie on the form.
  *   **Mitigation:** This is why the **Rationalization Filter** is essential. If you simply pay for the signature, the lesson fails. You must challenge the *reasons* they write. If a student writes "I intend because I want the $5," you must publicly point out the temporal inconsistency (The $5 is already in their pocket at T2). This forces them to confront the irrationality of their own "intention."

  **2. The Stakes are Too Low**
  *   **Ideal:** The reward is life-changing ($1M); the toxin is severe (illness).
  *   **Classroom:** $5 vs. bad tea.
  *   **Effect:** Students might drink the tea just to prove a point or because $5 + tea is worth more than $0 + no tea.
  *   **Mitigation:** Emphasize that the *point* is not the tea, but the reasoning. If a student drinks, ask them: "Did you drink because you intended at T1, or because you changed your mind at T2?" If they changed their mind, Kavka wins (the intention at T1 was impossible).

  **3. Verification of Action**
  *   **Ideal:** Omniscient observer knows if you drank.
  *   **Classroom:** Self-reported photo.
  *   **Effect:** Students might fake the photo.
  *   **Mitigation:** Acknowledge this. Tell them, "I trust you, but more importantly, *you* know if you drank." The puzzle is internal. If they lie about drinking, they only cheat themselves out of the philosophical insight.

  **4. The Time Delay**
  *   **Ideal:** Intention at T1, Action at T2 (significant gap).
  *   **Classroom:** Intention at 2:00 PM, Action at 8:00 PM.
  *   **Effect:** The gap is short enough that they might feel they can "just wait and see."
  *   **Mitigation:** Remind them that at 8:00 PM, the $5 is already secured (or lost). The decision at 8:00 PM is purely about the tea.

  ### What To Change If You Have More Control

  If you find the "Self-Report" issue too damaging, I recommend **dropping the cash reward for Arm 2 entirely.**

  Instead, make Arm 2 a **"Commitment Contract"** with no monetary reward, but a **social cost**.
  *   **Rule:** "If you sign this, I will read your name aloud to the class as someone who *Intends to Drink*."
  *   **Payoff:** No cash. The "reward" is consistency; the "cost" is shame if they don't drink.
  *   **Why this works better:** It mimics the *normative* weight of intention without introducing a monetary incentive that confuses the T2 reasoning. Students will be hesitant to sign. This hesitation *is* the feeling of the puzzle. They will feel they cannot sign because they cannot intend.

  **Recommendation:** If you want the cleanest philosophical experience, use the **Social Cost** version for Arm 2. If you want to highlight the difference between *speech* and *mind*, use the **Cash + Rationalization Filter** version designed above. Given your budget and goal to "feel" the puzzle, I recommend the **Cash + Rationalization Filter** but with the explicit instruction that you will reject invalid reasons. This turns you into the embodiment of Rationality, blocking their attempts to game the system.

  ### Instructor Script for the "Impossible" Moment

  When reviewing Arm 2 sheets, say this:
  > "I see many of you took the $5. But look at your reasons. You wrote 'To get the reward.' But the reward is already in your hand. It cannot motivate you tonight. You wrote 'I promise.' But a promise without a reason is just a noise. You are holding $5 that you know you cannot rationally earn by drinking. Does that $5 feel like a reward for an intention, or a reward for a lie? That discomfort is Kavka's Toxin."
