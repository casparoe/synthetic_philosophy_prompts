answer: |-
  The engineers left an hour ago, apologizing with the stiff, bureaucratic sorrow of men who have broken a vase they cannot glue back together. They called it a "fission anomaly." They said the buffer didn't flush. They said the transmission was successful, but the source material remained intact.

  Elena sat in her study. The cursor blinked at the end of paragraph fourteen of chapter six. She had been working on this sentence before she stepped into the booth: *The light came in not as a promise, but as a debt.*

  She remembered typing it. She also remembered, with a terrifying clarity, the sensation of stepping out of the receiver on Proxima Centauri b, the smell of recycled air, the confirmation from the colony director that she had arrived. She had those memories. They were as solid as the coffee mug in her hand.

  There were two of them. One was here, in the rain-slicked quiet of Vermont. The other was there, in the red dust of a new world.

  Elena reached for the envelope on her desk. It was physical paper, which meant the other Elena had written it in the transit lounge, moments before the final handshake, knowing the protocol allowed for one physical artifact to accompany the data stream while the original remained.

  *Read this before you speak to Mark,* it said.

  Elena didn't open it. Instead, she looked at the manuscript. If she typed the next sentence, would the other Elena type it too? No. The divergence had happened. The other Elena was currently unpacking a suitcase that Elena had packed three days ago. They shared the past, but they were eating different dinners.

  Her phone buzzed. A notification from the Interstellar Relay. A video link request. Status: *Pending.*

  The other Elena was calling.

  Elena stood up and walked to the window. She watched the rain streak the glass. She thought about the colony. It was a harsh place, high radiation, low gravity. She felt a sudden, sharp ache in her lower back—a phantom pain from a chair she wasn't sitting in, in a room she wasn't occupying.

  *It's my back,* she thought. *I'm going to be sore tomorrow.*

  She caught herself. She pressed her hand against the cool windowpane. The glass was cold. Her hand was warm.

  *No,* she corrected. *She is going to be sore. I am not.*

  But the distinction felt thin, like paper held up to a light. Parfit would have loved this, she thought. The philosopher who asked what matters. Is it the continuity of the body? Or the continuity of the mind? If the mind continues in two places, does the self stretch like rubber until it snaps?

  She sat back down and opened the envelope.

  *Elena,* the letter began. *If you're reading this, I'm gone, and you're staying. I know you're worried about the book. I know you're worried about Mark. Don't let them treat me like a ghost. I'm not a ghost. I'm you. I have the same right to this life as you do. Please, don't finish the manuscript. Let me finish it there. If you finish it here, it feels like... it feels like you're burying me.*

  Elena put the letter down. The handwriting was hers. The loop of the 'L' in her name was slightly tighter than usual, a sign of the stress in the transit lounge.

  She looked at the screen. *The light came in not as a promise, but as a debt.*

  If she didn't write the next sentence, the book stalled. If she did, was she stealing the other Elena's future? They had both earned this story. They had both lived the life that informed it.

  The phone buzzed again. *Incoming Call.*

  She accepted it. The screen resolved into a image of a room with red walls. And there, sitting in a chair that looked uncomfortable, was Elena.

  The other Elena looked tired. Her hair was pulled back the way Elena had worn it three years ago, before she'd started letting it grow out. A lag of four seconds.

  "Hello," the other Elena said.

  "Hello," Elena said.

  The silence stretched. It was the silence of a mirror that had decided to speak.

  "Did you get the letter?" the other Elena asked.

  "Yes."

  "And?"

  "I haven't decided."

  The other Elena rubbed her temples. Elena felt a sudden wave of exhaustion wash over her, a heavy, chemical fatigue that made her want to lie down on the rug. She gripped the arms of her chair.

  *We are tired,* she thought. *The travel took it out of us.*

  Then the other Elena smiled, a small, sad thing. "It's quiet here. The wind sounds different. It whistles through the rock."

  "It's raining here," Elena said.

  "I know. I can hear it in your background."

  Another lag. Four seconds.

  "Mark is outside," Elena said. "He's mowing the lawn. He doesn't know which of us to look at."

  "He should look at you," the other Elena said quickly. "You have the house. You have the... the physical continuity."

  "You have the memories."

  "I have the memories of a husband I can't touch." The other Elena's voice cracked. "I remember his smell. I remember how he kisses the top of my head. But I'm three hundred and twenty-four light-years away from the skin that belongs to him."

  Elena felt a tear slide down her own cheek. She reached up to wipe it, assuming it was her own grief. But then she realized she wasn't sad. She was calm. Resolute.

  *Why am I crying?* she wondered.

  Then she saw the other Elena lift a hand to her own face.

  *Oh,* Elena thought. *That's her tear. Not mine.*

  The reasoning collapsed. The empathy that had bridged the gap snapped under the weight of biology. She was not crying. The woman on the screen was crying. They were not a single consciousness stretching across space. They were two distinct organisms sharing a database. The pain was not shared. The rain was not falling on the red rocks.

  "I'm sorry," Elena said. And she meant it as an apology from one person to another, not from a self to itself.

  "Don't be," the other Elena said, wiping her face. "I just... I wanted to ask about the book. If I write the ending there, and you publish it here... who gets the credit?"

  "Does it matter?"

  "To the world, yes. To me... I think it matters."

  Elena looked at the cursor. It was still blinking. *The light came in not as a promise, but as a debt.*

  "If I write it," Elena said slowly, "it will be the version of the story that knows I stayed. It will be colored by this room, by this rain."

  "And if I write it," the other Elena said, "it will be colored by the red dust. It will be a different book."

  "Then they are different books."

  "Can they have the same title?"

  "I don't see why not."

  The other Elena nodded. The lag made it look like a glitch. "Mark. Is he... is he happy?"

  "He's confused. He loves you. He loves me. He says it feels like he has two wives, but neither of him is whole."

  "Tell him..." The other Elena hesitated. "Tell him I'm not coming back. He needs to stop waiting for the version of me that sleeps in his bed."

  "I can't tell him that. You tell him."

  "I can't. If I say it, it makes it real. If you say it, it's just... logistics."

  Elena looked at the manuscript. She realized then that the question wasn't about who owned the story. It was about who owned the grief. The other Elena was asking her to take the burden of the earthly life, to be the anchor that allowed the other to drift away without guilt.

  "I'll finish chapter six," Elena said. "I'll leave chapter seven blank. For you."

  "Thank you."

  "Elena?"

  "Yes?"

  "Does it hurt? Staying?"

  "Only when I think about you leaving."

  "Good. Then I'm not the only one."

  The connection terminated. The screen went black.

  Elena sat in the silence of the study. The rain was still falling. Her back did not hurt. The coffee was cold.

  She placed her fingers on the keys. She thought about the other Elena, sitting in the red room, waiting for her own cursor to blink. They would write different sentences now. They would diverge with every keystroke, until the only thing they shared was the past.

  Elena typed: *She watched the light fade, knowing that some debts are paid only by being owed.*

  It was a lie. But it was a start.

  She saved the document. *Manuscript_v1_Earth.docx.*

  Somewhere, three hundred and twenty-four light-years away, she knew another file was being saved. *Manuscript_v1_Proxima.docx.*

  Elena stood up and walked to the window. Mark was coming in from the lawn. He looked up at the study window. He waved.

  Elena waved back. She was the one he was waving to. That was a fact, not a feeling. She turned away from the window and went to the kitchen to make a fresh pot of coffee, for one.
