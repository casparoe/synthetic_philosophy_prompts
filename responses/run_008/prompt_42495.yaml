answer: |-
  Here is an analysis of your friend's jurisprudence, her likely verdict on your brother, and the philosophical architecture underlying her work.

  ### 1. Which rules fit her track record?

  Your friend is not running a single consistent metaphysical rule; she is running a **pragmatic compatibilist** framework. She navigates between the two rules you identified by distinguishing between *capacity* and *circumstance*.

  *   **Rule A (Mitigation by Unchosen Inputs)** fits the **Violent Home Woman**. Here, bad inputs reduce blame, but do not erase it.
  *   **Rule B (Determinism/No Ultimate Responsibility)** is explicitly cited in the **Prosperous Vanity Man** ("nobody chooses their character anyway"), yet it *fails* to exonerate him. This proves Rule B is not her operational standard for verdicts, only her philosophical baseline.
  *   **The Hidden Rule (Capacity & Tracing):** The real consistency lies in **Case 1 (Tumor)** and **Case 2 (Drugs)**.
      *   In the Tumor case, the mechanism of choice was physically bypassed. (Exoneration).
      *   In the Drug case, the mechanism of choice was intact at the critical prior moment (taking the drug). (Full Responsibility).
      *   In the Violent Home case, the mechanism was intact but burdened. (Partial Responsibility).
      *   In the Prosperous Man case, the mechanism was intact and unburdened. (Full Responsibility).

  Her track record shows she exonerates only when the *capacity* for choice is destroyed (Tumor). She mitigates when the *exercise* of choice is made significantly harder (Violent Home). She assigns full blame when capacity is intact, regardless of whether the character driving the choice was "chosen" in a deep metaphysical sense (Prosperous Man).

  ### 2. What does each rule predict for the brother?

  *   **If she applies Rule A (Inputs/Character):** Your brother had "good inputs" (implied by the contrast to the violent home woman and the "sentimental boy" baseline) and deliberately cultivated bad ones. He is an anomaly: someone who took a good hand and engineered a worse character.
      *   *Prediction:* **Maximum Responsibility.** He is more culpable than the Prosperous Man because his vice was not just inherited or unexamined; it was *manufactured*.
  *   **If she applies Rule B (Hard Determinism):** Your brother's decision at fifteen to harden himself was the product of a fifteen-year-old's brain, which he did not choose. The twenty-five-year process was a causal chain initiated by a self he did not author. The "self-making" is an illusion; it is just biology and environment playing out over time.
      *   *Prediction:* **Exoneration or Significant Mitigation.** Like the Tumor Man, his ruthlessness is something that *happened* in him, not something he ultimately authored.

  ### 3. What is the best guess and why?

  **Best Guess:** She will recommend **Full Responsibility**, potentially with an aggravating note regarding his deliberate cultivation of cruelty.

  **Why:**
  Your friend's rationale in the Prosperous Man case is the key. She admitted "nobody chooses their character," yet she held him fully responsible. She accepts the truth of determinism (Rule B) but rejects it as a legal or moral *excuse* unless it manifests as a pathology (like the tumor).

  To her, the brother's "self-making" is not a metaphysical escape from determinism; it is a **traceable series of voluntary acts**. Unlike the Tumor Man, his capacity for choice was never broken. Unlike the Violent Home Woman, his capacity was not burdened by external trauma. In fact, his case mirrors the Drug Man: he took a series of actions (notebooks, refusing comfort, ruthless apprenticeship) knowing they would lead to a harmful state, just as the drug man took a substance knowing it could lead to violence.

  She views the "self" not as a static thing you are stuck with, but as a project you manage. By holding the Prosperous Man responsible despite unchosen character, she established that **we own the character we have, even if we didn't choose it.** Your brother owns his ruthlessness. The fact that he built it deliberately makes him the *architect* of his crime, not the victim of it.

  ### 4. What further case would settle it?

  To definitively prove whether she privileges **Capacity** (Rule A/Pragmatism) or **Causation** (Rule B/Determinism), you would need a case that isolates the *origin of the desire to change*.

  **The Settling Case:**
  A defendant who, at age fifteen, began a process of radical personality change after reading a specific philosophical text that convinced them morality was an illusion.
  *   **Scenario A:** They sought out the text voluntarily out of curiosity.
  *   **Scenario B:** They were assigned the text in a mandatory school curriculum and were psychologically vulnerable to its arguments due to undiagnosed depression.

  If she assigns **more blame to Scenario A** than Scenario B, she believes in the "Tracing Principle" (Rule A): the voluntary exposure to the idea anchors the responsibility.
  If she assigns **equal blame (or exoneration) to both**, she is a closet Determinist (Rule B): the psychological vulnerability or the persuasive power of the text determines the outcome, rendering the "voluntary" search irrelevant.

  Given her history, she would likely blame Scenario A more heavily. This would confirm she operates on **agency-tracking**, not metaphysical freedom.

  ### 5. Why does the deep rule show up only as a discount?

  You asked: *If the deep rule is the one she is really running [Determinism], why has it shown up only as a discount... rather than as total exoneration?*

  The answer is that your friend is a **functionalist**, not a metaphysician. She knows that if she applied the "Deep Rule" (nobody chooses anything) consistently, her job would cease to exist. The justice system requires a fiction of agency to function.

  However, she is honest enough to acknowledge the truth of determinism creates moral friction.
  *   **Total Exoneration** would deny the reality of human suffering caused by offenders.
  *   **No Discount** would deny the reality of the difficulty some people face in exercising agency.

  The **discount** (as with the Violent Home Woman) is a compromise. It acknowledges the Deep Rule ("It is harder for her to choose well because her inputs were bad") without surrendering to it ("But she still chose"). It is a **tax on expectation**. We expect less of someone with a violent history, so we blame them less when they fail, but we do not expect *nothing*.

  In your brother's case, the "tax" is negative. We expect *more* of someone who had the luxury of twenty-five years to refine their character, especially when they did so with the explicit intent of removing empathy. She will not exonerate him for the same reason she did not exonerate the Prosperous Man: **Responsibility is not about how you got your character; it is about what you do with it.** Your brother used his character as a weapon. In her files, that is the only metric that ultimately counts.
