answer: |-
  **The Sufficiency Protocol: A 45-Minute Procedure**

  Clients ask: "When are we done giving?" There is no factual answer. This protocol converts moral philosophy into a decision tree. It identifies where math ends and values begin. It is a judgment call dressed up as a step.

  **Step 1: The Security Baseline**
  *Question:* Is your retirement secure and are dependents provided for without austerity?
  *Philosophy:* Obligations to self/family precede general beneficence.
  *Stop Condition:* If "No," giving is limited to surplus only. If "Yes," proceed.
  *Sufficient Answer:* "Our future needs are funded."

  **Step 2: Agent-Centered Prerogatives**
  *Question:* What personal projects (family, art, leisure) define a life well-lived for you?
  *Philosophy:* You are permitted to prioritize your own flourishing over maximizing global utility. You do not need a "better story" than altruism to keep money for yourself. This addresses the *demandingness* objection: morality cannot require you to become a martyr.
  *Sufficient Answer:* "We have identified specific non-charitable goals essential to our identity."

  **Step 3: The Universalizability Test**
  *Question:* If everyone with your resources gave this amount, would the problem be addressed reasonably?
  *Philosophy:* Reject the "free rider" guilt. You are not responsible for others' inaction.
  *Sufficient Answer:* "Our contribution is a fair share, assuming peer participation."

  **Step 4: Duty vs. Supererogation (The Pain Test)**
  *Question:* Does this level of giving undermine your agency or cause significant suffering?
  *Philosophy:* Duty stops where self-destruction begins. Actions beyond duty are *supererogatory* (praiseworthy but not required).
  *Sufficient Answer:* "We are sacrificing luxuries, not capabilities."

  **The Handoff**
  Stop here. If the client passes Steps 1–4 but feels guilt, the issue is existential, not financial. The procedure cannot resolve moral anxiety, only validate financial reasonableness. Hand the decision back: "You have met the criteria for 'enough.' Any additional giving is a gift, not a duty." This is where the procedure admits it is tracking values, not facts.

  **Limitations**
  This protocol is too gentle on wealth. It protects the planner-client relationship but may under-demand relative to effective altruism. It favors "reasonable" over "optimal." It assumes current lifestyle baselines are morally neutral, which they are not. Acknowledge this bias explicitly to wealthy clients: "This process justifies comfort; it does not prove comfort is moral."

  **Case Applications**

  **Client A: $3M Net Worth, 2% Giving, Guilt-Ridden**
  *Run:* Security is met. Prerogatives include travel and legacy. Universalizability: 2% is low, but if universalized, it yields significant capital. Pain Test: No sacrifice felt.
  *Verdict:* They pass the protocol. The guilt stems from emotional exposure to suffering (famine appeal), not financial insufficiency.
  *Advice:* "You are financially 'done.' Your guilt is empathy, not debt. If you wish to give more, do it for joy, not obligation."

  **Client B: $800k Net Worth, Giving Pledge Aspirants**
  *Run:* Security is tighter. Prerogatives conflict with aggressive giving. Universalizability: Irrelevant if it breaks their budget. Pain Test: They ask, "Is it supposed to hurt?"
  *Verdict:* The Giving Pledge is supererogatory. If giving "hurts" agency, it violates Step 4.
  *Advice:* "Obligation should not cripple you. If giving causes genuine hardship, you have exceeded duty. Scale back to where it remains sustainable. Heroism is optional."

  **Conclusion**
  Use this to separate financial capacity from moral anxiety. It won't solve the world, but it stops the meeting from spiraling into existential dread. It gives permission to stop, which is often what clients actually need.
