prompt: |-
  I'm a financial planner, and every year a couple of clients ask me some version of the same question: we want to give more to charity, but how do we know when we've given enough — like, how would we even tell we're "done"? I don't want to hand them a number, I want a procedure we can walk through together in a 45-minute annual meeting that turns what philosophers actually say about the demandingness of morality into something usable: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and hands the decision back to the client because it's their values not a fact, and where it's honest about being a judgment call dressed up as a step. I'm thinking of things like agent-centered prerogatives (are you allowed to keep things for yourself just because you want them, or does that need a better story), the line between duty and supererogation, whether 'what if everyone lived like this' is a fair test when its obvious everyone won't, and whether obligations should be judged against what you're actually spending your money on or against some baseline. It should also say what the procedure gets wrong — I suspect it will be too gentle on my wealthy clients, and I'd rather know that up front. Then run it on two clients: a couple with about $3M giving 2% a year who feel guilty after a famine-relief appeal, and a couple with $800k who want to take a giving pledge seriously and keep asking me whether it's supposed to hurt. Keep it to 800 words max — I'm going to print it out and keep it in my desk drawer.
