      *   *Refining Crux 2:* "Constraints on rational credence vs bookkeeping."
      *   Case: Adam and Eve. SSA implies they can reason that a deer will die in front of them (to keep their birth rank low). SIA says no.
      *   Prediction: SSA says "Credence shifts," SIA says "No shift."

