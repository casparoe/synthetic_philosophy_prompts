          *   SIA: P(A) is boosted relative to B *before* conditioning? No, SIA usually says P(Existence|H) is proportional to observers. If B has 0, P(Existence|B) = 0.
          *   Actually, the deep crux is often about *unbounded* populations. Let's use the "Presumptuous Philosopher" directly as the test case for Crux 2.
