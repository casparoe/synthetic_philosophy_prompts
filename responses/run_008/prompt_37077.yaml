      *   *Disagreement 2 (Presumptuous Philosopher):* SSA accepts Doomsday to avoid PP. SIA accepts PP to avoid Doomsday.
      *   *Disagreement 3 (Verbal?):* Is this just where we put the normalization constant? (Usually, no, it has decision-theoretic consequences).

  5.  **Identifying Cruxes:**
      *   *Crux 1: Zero Observers.* How do we handle worlds where no one exists to observe? SIA struggles (probability 0?). SSA handles it fine (conditioning on existence).
      *   *Crux 2: Normative Status.* Are these laws of rationality (epistemic) or just heuristics for decision theory?
      *   *Test Cases:*
          *   For Zero Observers: The "Empty Universe" coin toss.
          *   For Normative Status: The "Betting" scenario (Adam & Eve variant or simple wager).

  6.  **Refining the Thought Experiments:**
