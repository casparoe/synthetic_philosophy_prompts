      *   **Task:** Write a *joint statement* resulting from a well-run adversarial collaboration.
      *   **Required Content:**
          *   Shared machinery claims (reference classes, observers vs. moments, Bayes's rule limits).
          *   Precise remaining disagreements (phrased neutrally/acceptably to both).
          *   Verbal dispute analysis (if any).
          *   Cruxes (handling zero-observer hypotheses, nature of anthropic principles).
          *   Thought experiments/model cases for each crux (PP, Adam & Eve, or new) with pre-recorded predictions.
      *   **Format:** Numbered agreed-claims section followed by a disagreements table.

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *SSA (Doomsday):* $P(H|E) \propto P(E|H)P(H)$. $E$ = "I am among the first $N$ humans". If $H_{long}$ implies trillions of humans, $P(E|H_{long})$ is small. If $H_{short}$ implies billions, $P(E|H_{short})$ is larger. Posterior shifts to $H_{short}$.
      *   *SIA (No Doomsday):* $P(H)$ is not fixed. $P(H)$ is weighted by the number of observers in $H$. $P(H_{long})$ gets a huge boost because there are more slots for "me" to exist. This cancels the small $P(E|H)$.
      *   *Common Ground:* Both use Bayesian updating. Both agree indexical evidence ("I am here now") matters. Both agree reference classes are tricky. Both acknowledge the counter-intuitive consequences of their views (Doomsday vs. Presumptuous Philosopher).
      *   *Shared Machinery:* Bayes's rule is the engine. The debate is about the *prior* (SIA) vs. the *likelihood* (SSA). Reference classes must be defined rigorously. Observer-moments are the fundamental unit (usually).

  3.  **Drafting the Agreed Claims (Section 1):**
      *   Need to sound academic, precise, and collaborative.
      *   *Claim 1 (Bayes):* Anthropics is Bayesian updating on indexical information.
      *   *Claim 2 (Reference Class):* The choice of reference class determines the output. It shouldn't be "all conscious beings" vaguely, but specific similarity classes.
      *   *Claim 3 (Observers):* Observer-moments are the atomic unit, not whole lives.
      *   *Claim 4 (Evidence):* "I exist" is evidence, but how it enters the equation (likelihood vs. prior) is the dispute.
      *   *Claim 5 (Empirical Neutrality):* Neither view changes non-anthropic physics directly, but they change credences in cosmological models.

  4.  **Drafting the Disagreements (Section 2):**
      *   Need to phrase these so neither side feels straw-manned.
