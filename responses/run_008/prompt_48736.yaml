  Here is a complete problem set module designed for your graduate seminar. It blends the technical rigor of your meteorological background with the philosophical nuances of formal epistemology.

  ***

  # Problem Set 4: Conditional Constraints and the Judy Benjamin Problem
  **Course:** PHI 605 – Formal Epistemology  
  **Contributor:** [Your Name], Guest Lecturer  
  **Points:** 30  

  ### Background
  In operational meteorology, we rarely learn facts with certainty (e.g., "The storm is in the Northeast"). Instead, we receive probabilistic guidance from models (e.g., "Given the storm is in the East, there is a 75% chance it is in the Northeast"). Updating beliefs on such *conditional constraints* rather than factual evidence is the core of the **Judy Benjamin Problem**, named after a thought experiment by Bas van Fraassen.

  ### The Scenario
  You are a lead forecaster. Your sector is divided into four quadrants of equal area: Northwest ($NW$), Northeast ($NE$), Southwest ($SW$), and Southeast ($SE$). Based on morning soundings, your prior probability distribution $P_0$ is uniform:
  $$P_0(NW) = P_0(NE) = P_0(SW) = P_0(SE) = 0.25$$
  Let $East = \{NE, SE\}$ and $West = \{NW, SW\}$. Note that $P_0(East) = 0.5$.

  At 14:00, you receive a message from a satellite algorithm. The message does not tell you where the storm is, but it provides a conditional constraint on your posterior distribution $P_1$:
  $$P_1(NE \mid East) = \frac{3}{4}$$
  This implies $P_1(NE) = 3 \cdot P_1(SE)$. The message contains no information regarding the Western half of the sector.

  ### Questions

  **(a) The Failure of Standard Conditioning (5 points)**
  Explain why neither standard Bayesian Conditioning nor Jeffrey Conditioning is directly applicable to this update. Specifically, identify what proposition is learned in each standard method and why the satellite message fits neither category.

  **(b) Minimum Relative Entropy Update (10 points)**
  Van Fraassen proposes solving this using the principle of **Minimum Relative Entropy** (MinEnt), also known as minimizing Cross-Entropy. This selects the posterior $P_1$ that satisfies the constraint while minimizing the information distance from $P_0$:
  $$D(P_1 \parallel P_0) = \sum_{\omega \in \Omega} P_1(\omega) \ln \left( \frac{P_1(\omega)}{P_0(\omega)} \right)$$
  Set up the Lagrangian for this optimization problem. Solve for the exact numerical values of $P_1(NW)$, $P_1(SW)$, $P_1(NE)$, and $P_1(SE)$. (You may leave logarithms in exact form during derivation, but final probabilities must be numerical to three decimal places).

  **(c) The Intuition of Irrelevance (10 points)**
  A competing intuition (often associated with Jeffrey Conditioning) suggests that because the message concerned *only* the internal ratio of the Eastern half, the total probability of the Western half should remain unchanged ($P_1(West) = P_0(West) = 0.5$).
  1.  Does your MinEnt solution from part (b) honor this intuition? Show the numbers.
  2.  Assess whether the MinEnt solution depends on how finely the forecaster partitions the unmentioned Western half. (i.e., If we treated $West$ as a single atomic proposition vs. two quadrants, would the total probability mass assigned to $West$ change?)

  **(d) Rational Uniqueness (5 points)**
  Based on your work above, argue briefly for or against the following claim: *"There is a uniquely rational posterior distribution in this situation."* Reference the conflict between informational efficiency (MinEnt) and irrelevance (Intuition) in your answer.

  ***

  # Model Answer & Instructor's Guide

  ### Part (a): The Failure of Standard Conditioning (5 pts)
  **Key Moves:**
  *   **Bayesian Conditioning:** Requires learning a proposition $E$ is true ($P_1(E)=1$). Here, we do not learn the storm is in the East, nor in any specific quadrant. We only learn a *ratio* within a subset.
  *   **Jeffrey Conditioning:** Requires a partition $\{E_i\}$ and new probabilities for each element of the partition (e.g., $P_1(East) = x, P_1(West) = 1-x$). Here, we are not given $P_1(East)$; we are given $P_1(NE|East)$.
  *   **Conclusion:** Standard rules require factual evidence or partition shifts; this is a *conditional constraint*.

  ### Part (b): MinEnt Calculation (10 pts)
  **Setup:**
  Let $p_{nw}, p_{ne}, p_{sw}, p_{se}$ be the posterior probabilities.
  Priors $q_i = 0.25$ for all $i$.
  Constraints:
  1.  $\sum p_i = 1$
  2.  $p_{ne} = 3 p_{se}$ (from $P(NE|East) = 3/4$)
  3.  By symmetry of the prior and the lack of constraint on the West, MinEnt implies $p_{nw} = p_{sw}$.

  Let $p_{se} = z$. Then $p_{ne} = 3z$.
  Let $p_{nw} = p_{sw} = y$.
  Normalization: $4z + 2y = 1 \implies y = 0.5 - 2z$.

  **Objective Function:**
  Minimize $D = \sum p_i \ln(p_i / 0.25) = \sum p_i \ln(p_i) - \sum p_i \ln(0.25)$.
  Since $\sum p_i = 1$, we minimize $\sum p_i \ln(p_i)$.
  $f(z) = 3z \ln(3z) + z \ln(z) + 2y \ln(y)$
  Substitute $y = 0.5 - 2z$:
  $f(z) = 3z(\ln 3 + \ln z) + z \ln z + 2(0.5 - 2z) \ln(0.5 - 2z)$
  $f(z) = 4z \ln z + 3z \ln 3 + (1 - 4z) \ln(0.5 - 2z)$

  **Derivative:**
  $\frac{df}{dz} = 4(\ln z + 1) + 3 \ln 3 - 4 \ln(0.5 - 2z) + (1-4z) \frac{-2}{0.5-2z}$
  $\frac{df}{dz} = 4 \ln z + 4 + 3 \ln 3 - 4 \ln y - 4 = 0$ (Note: the last term simplifies to -4)
  $4 \ln z + 3 \ln 3 = 4 \ln y$
  $\ln(z^4) + \ln(27) = \ln(y^4)$
  $27 z^4 = y^4 \implies y = z \cdot \sqrt[4]{27} \approx 2.2795 z$

  **Solve:**
  $4z + 2(2.2795 z) = 1$
  $8.559 z = 1 \implies z \approx 0.1168$
  $y \approx 0.2663$

  **Posteriors:**
  $P_1(SE) = 0.117$
  $P_1(NE) = 3(0.117) = 0.350$
  $P_1(NW) = 0.266$
  $P_1(SW) = 0.266$
  *(Check: $0.350+0.117+0.266+0.266 = 0.999 \approx 1$)*

  ### Part (c): Irrelevance and Partition (10 pts)
  **1. The Intuition:**
  $P_1(East) = 0.350 + 0.117 = 0.467$.
  $P_1(West) = 0.266 + 0.266 = 0.533$.
  **Assessment:** The MinEnt solution **violates** the intuition. The probability of the West *increased* from 0.500 to 0.533, even though the message was silent on the West. This is the "Judy Benjamin Effect." MinEnt "rewards" the unconstrained region with probability mass to maximize entropy subject to the tight constraint in the East.

  **2. Partition Dependence:**
  Does splitting West into $NW, SW$ matter?
  If West were a single atom $W$ with prior 0.5, the term in the entropy sum would be $P_1(W) \ln(P_1(W)/0.5)$.
  With two atoms $NW, SW$ with priors 0.25 each and symmetric posteriors $y$, the term is $2 \cdot [y \ln(y/0.25)]$.
  Since $P_1(W) = 2y$, $2y \ln(y/0.25) = 2y \ln(2y/0.5) = P_1(W) \ln(P_1(W)/0.5)$.
  **Assessment:** The total mass assigned to the West is **independent** of the partition fineness, provided the prior is uniform within the West. MinEnt is robust to irrelevant refinements of the *unconstrained* partition, even if it shifts the mass.

  ### Part (d): Rational Uniqueness (5 pts)
  **Argument:**
  *   *For Uniqueness:* MinEnt is the only method that satisfies certain consistency axioms (Van Fraassen). It minimizes gratuitous belief change.
  *   *Against Uniqueness:* The violation of the "Irrelevance" intuition (Part c) suggests MinEnt imports information not in evidence. If rationality requires that silent evidence leaves irrelevant probabilities unchanged, MinEnt is irrational. Thus, rationality may be underdetermined here.
  *   *Grading:* Credit for a coherent stance that references the tension calculated in (b) and (c).

  ***

  # Marking Scheme (30 Points Total)

  ### Part (a): Standard Conditioning (5 Points)
  *   **5 pts:** Clearly distinguishes Bayes (learning $E$ is true) and Jeffrey (learning $P(E_i)$) from Conditional Constraints ($P(A|B)=k$).
  *   **3 pts:** Identifies that we don't learn the antecedent is true, but misses the distinction with Jeffrey Conditioning.
  *   **1 pt:** Vague statement that "the math doesn't work."

  ### Part (b): MinEnt Optimization (10 Points)
  *   **10 pts (A Grade):** Correct Lagrangian setup. Correctly identifies symmetry ($p_{nw}=p_{sw}$). Derives the relationship $y = z\sqrt[4]{27}$. Numerical answers correct to 3 decimals ($NE \approx 0.350, West \approx 0.533$).
  *   **7 pts (B Grade):** Correct setup and symmetry argument. **Algebraic error** in solving the derivative (e.g., drops the $\ln 3$ term) but proceeds to calculate numbers consistently from the error. OR: Correct numbers but fails to show the derivative steps.
  *   **4 pts (C Grade):** Sets up entropy formula but cannot derive the constraint relationship. Guesses numbers.

  ### Part (c): Irrelevance & Partition (10 Points) **(The Differentiator)**
  *   **9-10 pts (A Grade):** **Notices the Shift.** Explicitly states $P_1(West) \neq P_0(West)$ (0.533 vs 0.500). Articulates *why* this is counter-intuitive (learning about East changes belief in West without causal link). **Crucially:** Correctly analyzes partition dependence (shows that while mass shifts, the *amount* of shift doesn't depend on splitting NW/SW due to entropy additivity).
  *   **6-8 pts (B Grade):** **The "Calculator" Trap.** Correctly calculates the numbers but **fails to comment on the philosophical significance of the shift.** Treats the change in $P(West)$ as a mere mathematical artifact rather than a violation of the Irrelevance intuition. May claim partition dependence incorrectly (e.g., claims splitting West would change the East probability).
  *   **3-5 pts (C Grade):** Claims MinEnt honors the intuition (says West stays 0.5). Incorrect math or logic.

  ### Part (d): Rational Uniqueness (5 Points)
  *   **5 pts:** Takes a clear stance. Connects the stance to the "Irrelevance" violation found in (c). (e.g., "If irrelevance is a requirement of rationality, MinEnt fails, so there is no unique solution.")
  *   **3 pts:** Takes a stance but relies on generalities ("Philosophers disagree") without referencing the specific problem mechanics.
  *   **1 pt:** No clear argument.

  ### Instructor's Note on the "A vs B" Distinction
  Your suspicion is correct. The B student treats this as a calculus problem. They will minimize the function, get $P(West) \approx 0.53$, and move on. The A student recognizes that $0.53 \neq 0.50$ is the **Judy Benjamin Paradox**.
  *   **To catch the B student:** In Part (c), require them to explicitly state whether the result *conflicts* with the intuition of irrelevance. If they say "The math gives 0.53" without noting that this *should* have been 0.5, they cap at a B.
  *   **The Partition Nuance:** Many students (even A's) might struggle with the partition dependence calculation. Award full marks for (c) if they identify the Irrelevance violation, even if they waver on the partition invariance proof, provided they reason it out logically. The core philosophical stake is the *shift*, not the partition invariance.

