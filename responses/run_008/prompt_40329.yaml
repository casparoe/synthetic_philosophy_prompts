answer: |-
  **Practice Exam Question: Williams, Integrity, and Two-Level Consequentialism**

  **Time Allowed:** 90 Minutes
  **Format:** Essay

  **Prompt:**

  Bernard Williams is often interpreted as raising a single objection to consequentialism regarding the demands it places on agents. However, a closer reading suggests two distinct criticisms: (1) the **integrity objection**, which concerns the justificatory structure of the theory and its treatment of an agent's ground projects; and (2) the **"one thought too many"** objection, which concerns the phenomenology of deliberative reasoning in personal relationships.

  R. M. Hare's two-level utilitarianism proposes that agents should generally operate on intuitive moral dispositions rather than direct utility calculation, reserving critical thinking for exceptional cases.

  In a well-structured essay, address the following:
  1.  Clearly distinguish Williams's integrity objection from the "one thought too many" objection. Why is it possible for a theory to satisfy one while failing the other?
  2.  Evaluate whether Hare's two-level strategy successfully answers the "one thought too many" objection. Does it also answer the integrity objection?
  3.  Consider a variant case: An agent whose deepest ground project is entirely impartial (e.g., a lifelong commitment to effective famine relief). Does Williams's integrity objection still apply to this agent? What does this reveal about whether the objection is truly about *partiality* or about the *structure of justification*?
  4.  Conclude by taking a stance: Can the justificatory structure of a theory be separated from the deliberative practice of its agents without losing the force of the integrity objection?

  ***

  **Model Answer**

  Williams's critique of consequentialism contains two distinct strands that are often conflated. The integrity objection targets the theory's justificatory structure. It argues that consequentialism renders an agent's ground projects morally irrelevant except as inputs for overall utility. The agent becomes a channel for utility rather than an author of their life. Conversely, the "one thought too many" objection targets deliberative psychology. It claims that acting from a consequentialist motive in personal relationships (e.g., saving a spouse because it is optimal) alienates the agent from the immediate commitments that constitute those relationships. These are separable because a theory could prescribe non-calculative deliberation (satisfying the psychological complaint) while maintaining that utility justifies those prescriptions (failing the structural complaint).

  R. M. Hare's two-level utilitarianism attempts to bridge this gap. At the intuitive level, agents internalize dispositions like loyalty and love, acting without calculating consequences. At the critical level, these dispositions are justified because they generally maximize utility. This successfully answers the "one thought too many" objection. The agent saving their spouse acts from love, not calculation, preserving the correct deliberative psychology. The consequentialist logic remains in the background, hidden from the agent's conscious reasoning.

  However, Hare's strategy fails the integrity objection. While the agent *feels* integrated at the intuitive level, the justificatory structure remains unchanged. The agent's ground projects are still only permitted because they serve the critical principle. If the critical calculation demanded abandoning the project, the agent must comply. Integrity requires that projects matter non-instrumentally in justification, not merely that they are psychologically comforting illusions sanctioned by utility. The agent knows, or must accept, that their commitments are contingent on their utility yield.

  The case of the impartial philanthropist clarifies this distinction. Suppose an agent's ground project is global famine relief. Williams's integrity objection still applies if the consequentialist demands they sacrifice this project for a marginally better utility outcome (e.g., switching causes based on new data). This shows the objection is not merely about partiality versus impartiality. It is about the agent's ownership of their life. Even an impartial project is a ground project. If consequentialism treats it as interchangeable with any other utility source, it alienates the agent from their own commitment. The problem is not that the project is personal, but that the theory denies the agent the authority to treat *any* project as foundational.

  Therefore, Hare saves deliberative behavior but sacrifices justificatory integrity. Can these come apart? A sophisticated consequentialist might argue that justification is only for theorists, not agents. But Williams insists that knowing one's life is ultimately justified by an external calculus undermines integrity even if not consciously contemplated. The distinction matters because integrity is about the truth of one's practical identity, not just the phenomenology of decision-making. Hare offers a comfortable psychology but maintains the alienating metaphysics of consequentialist justification. Ultimately, the integrity objection survives because it targets the subordination of the agent to the system, regardless of whether the system allows the agent to ignore the calculus during daily behavior.

  ***

  **Marking Scheme**

  **A-Level Requirements (Specific Moves)**

  1.  **Distinguishes Structure vs. Psychology:** The answer must clearly define the integrity objection as structural/justificatory and "one thought too many" as deliberative/psychological.
      *   *Common Botch:* Students treat these as the same argument rephrased, claiming Williams only cares about "feeling bad" about utilitarianism.
  2.  **Evaluates Hare on Deliberation:** The answer must acknowledge that two-level utilitarianism successfully resolves the "one thought too many" complaint by allowing non-calculative intuitive reasoning.
      *   *Common Botch:* Students claim Hare fails here because the critical level still exists, missing the point about decision procedures.
  3.  **Evaluates Hare on Integrity:** The answer must argue that Hare fails the integrity objection because ground projects remain instrumentally justified at the critical level.
      *   *Common Botch:* Students assume that because the agent doesn't calculate, their integrity is fully preserved, ignoring the justificatory hierarchy.
  4.  **Analyzes the Philanthropist Case:** The answer must use the impartial project case to show Williams's objection is about agency/authorship, not merely partiality vs. impartiality.
      *   *Common Botch:* Students argue the objection disappears for the philanthropist because their project aligns with utility, missing the point about interchangeability.
  5.  **Takes a Stance on Separability:** The conclusion must explicitly state whether justification and deliberation can come apart regarding integrity (e.g., arguing that hidden alienation still counts).
      *   *Common Botch:* Students hedge indefinitely without committing to a view on whether the distinction matters morally.

  **B-Level Performance**
  A B-level answer will typically distinguish the two Williams objections correctly (Move 1) and explain Hare's two-level view accurately. However, it will fall short by failing to fully analyze the philanthropist case (Move 4) or by remaining agnostic on the separability of justification and deliberation (Move 5). A B answer often suggests that Hare's solution is "mostly successful" without explaining why the structural issue remains fatal to integrity despite the psychological fix. It may also contain minor errors in characterizing the instrumental nature of ground projects in Hare's critical morality.

  **Formatting and Style**
  *   **American English:** Ensure spellings such as "criticism," "behavior," "characterize," "justification," and "maximizing" are used consistently.
  *   **Clarity:** Arguments should be structured logically with clear topic sentences.
  *   **Citations:** No specific page numbers required; focus on conceptual accuracy.
