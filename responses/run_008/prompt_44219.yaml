  Based on the verdicts you've described, your friend is operating under a specific epistemological framework regarding welfare. She isn't just a standard utilitarian; she is a **measurement-constrained utilitarian**. To her, welfare comparisons aren't just about whether suffering *exists*, but whether it can be *cardinally measured and mapped* across subjects.

  Here is an analysis of the rule she is running, the alternative rules that fit her history, and which new case best tests them.

  ### 1. The Rule She Is Running: "Calibrated Isomorphism"

  Her past verdicts suggest she requires two conditions to be met simultaneously for interpersonal comparisons to be valid:
  1.  **A Shared Metric (Calibration):** There must be a standardized way to map internal states to an external scale (e.g., a 0–10 questionnaire).
  2.  **Cognitive/Biological Homology (Isomorphism):** The subjects must share enough neural or cognitive architecture to ensure the "units" on that scale mean the same thing to both of them.

  *   **Why this fits her history:**
      *   **Self vs. Self:** Passes both (same brain, continuous memory/metric).
      *   **Strangers + Questionnaire:** Passes both (same species implies homology; questionnaire provides the shared metric).
      *   **Human vs. Fish:** Fails Homology ("alien machinery"). Even if the fish could speak, she doubts the "pain" unit is the same.
      *   **Strangers + Observation:** Fails Metric (behavior is not a calibrated scale; cultural noise interferes).

  **Her Likely Verdicts:**
  *   **Comatose Sister:** **No.** While Homology is perfect (identical twin), the Shared Metric is broken. She cannot elicit a report. In health economics, a state without a utility value attached by the patient is often treated as missing data, not a known quantity.
  *   **Octopus:** **No.** While the Metric is present (calibrated lever), the Homology is broken ("alien machinery" applies to cephalopods just as much as fish).

  ### 2. Alternative Rules That Fit Her Past Data

  To find a case that splits her logic, we need to identify rules that explain her past "Yes/No" pattern but diverge on the new cases.

  **Alternative Rule A: Strict Operationalism (The Behaviorist)**
  *   **The Rule:** Welfare is comparable if and only if there is a **calibrated output**. The internal biology is irrelevant; if the subject can reliably map their state to a shared scale anchored in physical reality, the comparison holds.
  *   **Fits Past Data:**
      *   Yes to Self/Strangers (Calibration exists).
      *   No to Fish/Observation (No calibration exists).
  *   **Logic:** The "alien machinery" veto in the Fish case wasn't about biology per se, but about the *impossibility of calibration*. If you can't calibrate a fish, you can't compare it.

  **Alternative Rule B: Biological Essentialism (The Physicalist)**
  *   **The Rule:** Welfare is comparable if and only if the **neural substrate is homologous**. Reporting is merely evidence of the state, not a prerequisite for comparability.
  *   **Fits Past Data:**
      *   Yes to Self/Strangers (Human brains are homologous).
      *   No to Fish/Observation (Fish brains aren't homologous; Observation doesn't verify the brain state).
  *   **Logic:** The "shared ruler" in the Strangers case was just a convenient way to verify the biology, not the source of the comparability itself.

  ### 3. Which Case Best Splits the Rules?

  **Case 2 (The Octopus)** is the superior splitter.

  Here is why Case 2 is more diagnostic than Case 1:

  **Case 1 (Comatose Sister) tests *Access* vs. *Substrate*.**
  *   **Operationalist:** No (No report).
  *   **Essentialist:** Yes (Identical brain).
  *   *The Problem:* This case introduces a confounding variable: **Conscious Agency**. Your friend might reject the Coma case not because of her measurement rule, but because of a separate philosophical stance on whether a comatose person has "welfare" at all. It muddies the water between *measuring* welfare and *having* welfare.

  **Case 2 (The Octopus) tests *Calibration* vs. *Biology* directly.**
  *   **Operationalist:** **Yes.** The octopus has done the work. It has a "shared ruler" (the 1–7 lever) and it is "calibrated against tissue damage" (objective anchor). This satisfies the exact conditions of the "Strangers + Questionnaire" verdict (V2). The only difference is the species.
  *   **Essentialist:** **No.** The octopus nervous system is distributed and fundamentally different from a vertebrate's. This satisfies the exact justification of the "Human vs. Fish" verdict (V3).
