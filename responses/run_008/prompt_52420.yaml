answer: |-
  ### Exam Question (50 Minutes)

  Many scholars suggest the Mencius–Xunzi debate turns on conflicting definitions of *xing* (nature) rather than contradictory facts. Critically evaluate this claim. In your answer: (1) explain how Mencius's Ox Mountain analogy protects his view from empirical counter-evidence, and whether Xunzi can reply without begging the question; (2) assess the "first steaming-frame" problem for Xunzi's account of ritual origins; and (3) identify where a substantive philosophical disagreement survives once the definitional clash is resolved.

  ***

  ### Model Answer (Approx. 600 Words)

  The claim that the Mencius–Xunzi debate is merely verbal holds significant weight, provided one recognizes their divergent definitions of *xing*. For Mencius, *xing* refers to distinctively human developmental capacities—the "sprouts" of virtue that grow when nurtured. For Xunzi, *xing* denotes raw, unshaped material prior to deliberate effort. Consequently, Mencius claims nature is "good" because it contains the *potential* for morality, while Xunzi claims it is "bad" because raw impulses lead to conflict without external correction. They are not describing the same object.

  However, reducing the dispute to semantics ignores how each philosopher defends their definition against empirical reality. Mencius's Ox Mountain analogy is crucial here. Just as a stripped hillside does not prove the mountain lacked trees originally, observed human selfishness does not prove the absence of moral sprouts; it only proves environmental destruction. This allows Mencius to absorb Xunzi's evidence of bad behavior without conceding his point. Xunzi's non-question-begging reply must rest on his definition: if a thing requires external forcing to become straight, it is inherently crooked. He argues that because moral behavior requires conscious exertion against spontaneous desire, the spontaneous state (his *xing*) is deficient. He does not deny the capacity for growth (Mencius's point) but denies that the *starting material* deserves the label "good."

  This leads to the circularity worry regarding Xunzi's origin of ritual (*li*). If human nature is inherently self-serving and chaotic, who constructed the first "steaming-frame" (ritual standard) to straighten it? If the Sages were human, they shared this "bad" nature. Xunzi avoids full circularity by distinguishing moral sprouts from cognitive capacity. He argues the Sages utilized their mind-heart (*xin*) to recognize social order and accumulate artificial standards over time. This does not concede ground to Mencius because Xunzi locates the source of morality in external recognition and accumulation, not internal moral sentiment. However, if one argues that recognizing social order requires a pre-existing pro-social tendency, Xunzi risks conceding that some spontaneous tendencies are morally reliable, which undermines his claim that all spontaneity is suspect.

  Once the verbal dispute over *xing* is set aside, a substantive disagreement remains regarding the source of moral value. For Mencius, spontaneity can be a source of value; moral action is the unfolding of internal sprouts, making ritual an expression of innate feeling. For Xunzi, spontaneity is only raw material; moral value is exclusively a product of human artifice and conscious shaping. The real conflict is not whether humans can become good—both agree we can—but whether morality is discovered within (Mencius) or constructed without (Xunzi). Mencius trusts the cultivated spontaneous reaction; Xunzi trusts the deliberate adherence to the rule. Thus, while the definition of *xing* creates confusion, the core philosophical divergence concerns whether human effort completes nature or corrects it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Definitional Clarity (4 Marks)**
  *   **A (4):** Clearly distinguishes Mencius's *xing* (developmental capacity/potential) from Xunzi's *xing* (raw unshaped material). Notes that "good" and "bad" apply to different stages/definitions.
  *   **B (2-3):** States they define *xing* differently but treats it as simple semantics without explaining the structural difference (potential vs. raw state).
  *   **C (0-1):** Vague or incorrect definitions (e.g., "Mencius likes people, Xunzi hates people").

  **2. Ox Mountain & Empirical Evidence (5 Marks)**
  *   **A (5):** Explains Ox Mountain as shielding Mencius from empirical counter-evidence (bad behavior = destroyed sprouts, not absent sprouts). Articulates Xunzi's reply: if it needs forcing, it is inherently flawed (crooked wood).
  *   **B (3-4):** Explains Ox Mountain but fails to generate a non-question-begging reply for Xunzi, or vice versa.
  *   **C (0-2):** Treats Ox Mountain as just a metaphor for "environment matters" without linking to the definition of nature.

  **3. Circularity / Steaming-Frame Problem (5 Marks)**
  *   **A (5):** Identifies the problem (who made the first ritual?). Explains Xunzi's solution (Sage's cognitive capacity (*xin*), not moral sprouts). Evaluates whether this concedes ground (admits cognitive pro-sociality, but not moral instinct).
  *   **B (3-4):** Identifies the problem but offers a weak solution (e.g., "Sages are just smarter") without addressing the circularity risk.
  *   **C (0-2):** Ignores the origin of ritual or claims Xunzi believes Sages were gods.

  **4. Substantive Disagreement (6 Marks)**
  *   **A (6):** Identifies the core remaining dispute: Spontaneity as source of value (Mencius) vs. Raw material for artifice (Xunzi). Frames it as Internal Discovery vs. External Construction.
  *   **B (3-5):** Identifies a disagreement (e.g., "role of ritual") but fails to locate it *after* resolving the verbal dispute.
  *   **C (0-2):** Concludes the debate is *only* verbal with no substantive residue.

  **Examiner Notes & Common Pitfalls:**
  *   **⚠️ The "Original Sin" Error:** Do not award full marks if the student describes Xunzi's "bad" as theological evil or "Original Sin." Xunzi's "bad" is pragmatic/disorderly, not morally corrupt in a Christian sense. Deduct 2 marks if this framing dominates.
  *   **⚠️ The "Full Virtue" Error:** Do not award full marks if the student describes Mencius's sprouts as fully formed virtues. They are *germs* (duan) requiring cultivation. Deduct 2 marks if they imply Mencius thinks humans are born virtuous without effort.
  *   **A-Grade Threshold:** To score 18+, the essay must successfully navigate the verbal dispute *and* articulate the substantive disagreement regarding spontaneity/artifice.
