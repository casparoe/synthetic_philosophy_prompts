          *   Target Case: Present, Knows, Can swim. Verdict: **Caused.**
      *   *Rule C: The "Blame Tracking" Rule.* "Caused" just means "Who do we yell at?"
          *   Fits: Gardener (Blame), Roommate (Blame), Neighbor (No Blame), Passerby (No Blame - can't blame for not swimming).
