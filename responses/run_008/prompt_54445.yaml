      *   *Wait, I need "Clearly a jerk for doing nothing but it wouldn't have made a difference."*
      *   *Case:* You are the lifeguard (Duty!). You see someone drowning. You hate them, so you sit on your hands and let them drown (Blame/Jerk!). BUT, it turns out there was a invisible shark net they hit instantly; even if you jumped in, you would have arrived 10 seconds too late.
