  7.  **Drafting the Response:**
      *   *Tone:* Conversational, respectful of the engineering mindset (logic, systems), no jargon like "counterfactual dependence" or "normative expectations." Use "What-if" instead of "Counterfactual." Use "Job/Role" instead of "Normative Duty."
