answer: |-
  Your coworker accurately captures the Crane/Skyhook metaphor but fundamentally misinterprets Dennett's critique of "greedy reductionism," leading to a false conclusion that Dennett's project is self-contradictory.

  The first half of the paragraph is solid Dennett scholarship. Sentences one through three correctly identify his core argument: Darwin provided an algorithmic process (a crane) that generates complexity without foresight, rendering miraculous "levitators" (skyhooks) unnecessary for scientific explanation. When the summary says Dennett shows skyhooks are "impossible," it's slightly imprecise—he argues they are explanatorily bankrupt and unsupported by evidence—but for the purpose of a summary, that's acceptable. Dennett does indeed argue that eyes, brains, and culture are built by stacking these cranes over deep time.

  The critical failure occurs in the fourth sentence regarding "greedy reductionism." Your coworker treats this term as a concession that reductionism fails, but Dennett explicitly identifies as a "good reductionist." In Dennett's framework, greedy reductionism isn't the claim that bottom-up explanation is impossible; it is the methodological error of skipping intermediate levels of organization. Think of it like debugging a distributed system: you are a reductionist because you know the high-level logic is ultimately executed by transistor gates, but you are being "greedy" if you try to explain a latency spike by looking at electron flow instead of checking the service logs. Dennett isn't saying you can't reduce the behavior to physics; he's saying you lose explanatory power if you ignore the abstraction layers (the cranes) that organize those physics into function.

  Because that premise is incorrect, the final conclusion collapses. Dennett is not in a "weird spot" where he can't explain anything; he explains consciousness, morality, and meaning constantly by tracing the specific cranes (neural networks, cultural evolution, linguistic structures) that build them. He insists on showing the work—the intermediate steps—rather than jumping from quarks to qualia in a single bound. The summary conflates "reductionism requires accounting for all levels" with "reductionism is impossible unless you skip levels," which is the exact opposite of Dennett's actual position.
