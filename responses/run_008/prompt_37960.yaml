  I'm a backend engineer with zero formal philosophy training -- everything I know comes from youtube lectures and rationalist-adjacent blogs, so please calibrate accordingly. A coworker who's really into Dennett sent me this paragraph summarizing his "cranes vs skyhooks" thing, and I want to know if it's fair before I start repeating it in arguments (which, lets be honest, I will):

  "Dennett's big idea is that Darwin made all top-down explanation obsolete. Explanations come in two kinds: skyhooks, which explain complex things by appealing to something even more complex up above (a soul, a designer, free-floating mind-stuff), and cranes, which are dumb local processes like natural selection that build complexity up from simplicity without any foresight. Dennett shows skyhooks are impossible, so everything -- eyes, brains, language, even your sense of having a self -- has to be the product of natural selection stacking tiny advantages over billions of years. He also coined the term 'greedy reductionism' for the mistake of jumping straight from molecules to behavior while ignoring the middle levels, which is basically a concession that reductionism doesn't work: if you're not allowed to reduce things all the way down in one go, the whole bottom-up program is in trouble. So Dennett ends up in a weird spot: his cranes can build anything, but he's not allowed to actually use them to explain anything without becoming a greedy reductionist."

