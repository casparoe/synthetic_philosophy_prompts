      *   *Specific Philosophical References:* Kripke (*Naming and Necessity*), McKay ("The Metaphysics of Identity"), Robertson ("People and Their Twins").
      *   *Correction on User's Logic:* The user thinks (3) is the target. I need to explain why (5) is the better target. (3) is empirically/biologically plausible. (5) is the philosophical overreach.
      *   *Correction on Sorites:* Validate the "non-transitivity" hunch. It's the standard Kripkean line.

