answer: |-
  **The verdict**
  Reject step (3). The flaw is conflating the *selection of a strategy* (one deliberative act) with the *realization of chance moves* (multiple physical events). Deciding to use a biased coin commits you to a rule ("flip at every intersection"), not a single outcome ("continue forever"). The driver makes one decision to adopt a policy, but that policy mandates independent randomizations at each distinct node in the game tree, regardless of his memory.

  **Why it looked fine**
  The argument exploits the phenomenology of deliberation. Since the driver cannot distinguish the intersections, his mental state is identical at both; it feels like he is only "present" once. If deliberation is a singular mental event, it tempts us to think the output of that event (the coin flip result) must also be singular. It reads as if the driver decides "I will continue" or "I will exit" in the abstract, rather than deciding "I will flip a coin." But the "flip" is not the decision; the decision is the *policy* to flip. The physical constraint is memory, not physics. He can carry a coin. At intersection 1, he flips. At intersection 2, he flips again. He doesn't remember the first flip, so the second flip is effectively independent from his perspective, and crucially, independent in reality because the first flip doesn't causally determine the second flip's outcome, only the policy does.

  **The price**
  You must accept *behavioral strategies*: a strategy is a rule mapping information sets to probability distributions, not specific actions. The "one decision" is the *ex-ante* choice of the parameter $p$. The "draws" are determined by the structure of the world (two intersections), not the structure of the mind. Your friend's reply ("deliberation completed in advance") is true but harmless; the advance deliberation sets the *rule*, and the rule mandates fresh flips.

  Here is the arithmetic your friend suppressed. If you continue with probability $p$:
  1.  Exit at 1st: Probability $(1-p)$, Payoff 0.
  2.  Exit at 2nd: Probability $p(1-p)$, Payoff 4.
  3.  Loop: Probability $p \times p$, Payoff 1.

  Expected Payoff $E = 0(1-p) + 4p(1-p) + 1(p^2) = 4p - 4p^2 + p^2 = 4p - 3p^2$.
  Maximize: $dE/dp = 4 - 6p = 0 \Rightarrow p = 2/3$.
  Max Payoff: $4(2/3) - 3(4/9) = 8/3 - 4/3 = 4/3$.
  This exceeds the payoff of 1 from "continue for sure."

  **The counterattack**
  His bonus point about self-referential probabilities is the *actual* Piccione-Rubinstein paradox, distinct from his "one draw" error. It is true that the probability of being at the first intersection depends on $p$ (specifically, $\alpha = 1/(1+p)$). This creates time-inconsistency if the driver tries to re-optimize *at* the intersection using updated beliefs. However, this does not break decision theory; it merely shows that *interim* rationality conflicts with *ex-ante* rationality. By committing to the $p=2/3$ plan before leaving the bar (ex-ante), the driver bypasses the need to update beliefs at the node. The "one draw" error claims randomization is impossible; the self-referential point claims optimization is tricky. You can concede the latter without accepting the former.

  **The matching-pennies check**
  The repaired argument saves your intuition about the amnesiac. The friend's generalization (6) claims absent-minded agents can't gain from randomizing because they can't distinguish occasions. Correctly understood, amnesia *enforces* independence. The agent makes one decision to adopt the policy: "flip fresh every round." Because he cannot condition on past outcomes (due to amnesia), he cannot correlate his moves, which is exactly what optimal play in matching pennies requires. The "one decision" is the commitment to the mixing strategy; the "many draws" are the physical executions of that strategy.
