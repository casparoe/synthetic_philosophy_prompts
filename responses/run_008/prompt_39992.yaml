answer: |-
  Dear friend,

  It is completely understandable that this argument has stayed with you, because the debate over the moral equality of combatants is arguably the central fault line in contemporary just war theory, and the stalemate you experienced is the standard one that occurs even among professional philosophers. Your working hypothesis that you are answering different questions is insightful and largely correct, but I think the situation is slightly more complicated than a simple verbal misunderstanding. It is not just that you are talking past each other; it is that you are prioritizing different moral values that come into genuine conflict when theory meets the reality of institutional violence. To diagnose this properly, we need to look closely at why your culpability and liability distinction, while philosophically robust, failed to move your roommate, and why her epistemic concerns feel like a dead end to you.

  You are right that you were arguing about liability, which concerns whether someone has forfeited their right not to be killed, while she was arguing about culpability, which concerns whether someone is blameworthy for their actions. In the revisionist framework you are adopting, largely following Jeff McMahan, one can be liable to defensive harm without being morally culpable. The classic example is the innocent attacker, perhaps someone who has been drugged or misled into believing you are a threat. Revisionists argue that even if this person is not blameworthy, you are still permitted to stop them, perhaps lethally, because they are objectively an unjust threat. Your roommate, however, is operating with a deeper intuition that links liability closely to culpability. When she hears that a conscript is liable to be killed, she hears that it is fair to kill them. Her resistance to calling the nineteen-year-old a murderer suggests she is willing to concede they might be doing something wrong, but she refuses to accept that they have forfeited their right to life solely based on the objective justice of their cause. So, while you identify the distinction correctly, the disagreement is not merely verbal; it is a substantive clash over whether liability can truly be severed from blame in the context of war. For her, stripping someone of their right to life without moral fault feels like a violation of fairness, whereas for you, protecting the victim of aggression takes precedence over the fairness owed to the aggressor.

  This leads directly to the epistemic asymmetry point she raised, which is the traditionalist's strongest shield. She argued that soldiers, especially conscripts under propaganda, cannot know whether their war is just. In traditional just war theory, this is often called invincible ignorance, and it serves as a full excuse. You countered this with the liability distinction, implying that their ignorance makes them non-culpable but not non-liable. However, this is where your position faces its hardest test. If a soldier genuinely cannot know their cause is unjust, many philosophers argue that they do not constitute a moral threat in the relevant sense, or that the risk of error should be borne by the defender rather than the ignorant actor. Your hesitation to bite the bullet and call the draftee a murderer reveals that you might share some of this intuition. If you are unwilling to assign the stigma of murder, you are implicitly acknowledging that their epistemic situation matters for their moral status, not just their blameworthiness. This suggests the disagreement is not just about which question to ask, but about how much weight we give to objective justice versus subjective reasonable belief. You are prioritizing the objective fact of the unjust war; she is prioritizing the subjective experience of the soldier.

  There is also the layer of institutional convention that you mentioned, which often serves as an escape hatch but actually highlights the core divergence. Revisionists often concede that while the moral equality of combatants is false at the level of deep morality, it might be necessary as a legal or conventional rule to prevent wars from becoming total slaughters where every soldier on the losing side is retrospectively deemed a criminal. Your roommate is likely arguing from this non-ideal perspective without explicitly naming it. She is concerned with how we treat soldiers in the real world, where information is scarce and coercion is high. You are arguing from the perspective of ideal theory, asking what is fundamentally true about the morality of killing. When she says it is crazy to hold them responsible, she is making a claim about practical reasonableness. When you say they are liable, you are making a claim about metaphysical moral status. Progress is difficult here because you are both right within your own domains. If armies adopted the revisionist view operationally, soldiers might feel compelled to investigate every order, undermining military efficacy, or conversely, victors might prosecute all defeated soldiers as liable aggressors. If armies adopt the traditionalist view, we risk legitimizing unjust wars by shielding the instruments of aggression.

  So, to answer your question about what this disagreement actually is, it is a hybrid. It is partly a clash over which question counts as the moral question, but it is also a bedrock disagreement about the conditions required to forfeit a right to life. You believe being an unjust threat is sufficient; she believes moral fault is necessary. Your culpability and liability move is theoretically sound but rhetorically weak in this context because it asks her to accept that someone can be legitimately killed without having done anything morally wrong in a blameworthy sense. That is a hard pill to swallow, and your hesitation on the murderer label shows you feel the weight of it. To call someone liable to be killed is to say their death is permissible, and if their death is permissible despite their innocence, it feels like a sacrifice of their interests for the sake of the victim. She is unwilling to make that sacrifice for soldiers who are themselves victims of circumstance.

  Regarding what would count as progress, I do not think you should expect to resolve this forever, because it touches on fundamental values that trade off against one another. However, you could move the conversation forward by abandoning the attempt to prove her wrong and instead mapping the costs of each view. You might ask her whether she believes there is any case where an ignorant soldier is liable to be killed, such as a soldier who should have known better but didn't bother to check. If she says yes, then you have established that epistemic negligence matters, and you can debate where the line is. If she says no, then you have clarified that she holds a strict view that subjective belief always trumps objective justice. On your side, you need to decide if you are willing to fully separate liability from culpability. If you are not willing to call the draftee a murderer, you need to explain why their death is permissible if they are not committing a serious moral wrong. Is it merely a tragedy, or is it justice? If it is just a tragedy, then you are closer to her view than you think.

  Ultimately, the most honest progress you can make is to acknowledge that you are debating the tension between the ethics of self-defense and the ethics of institutional roles. You are treating the soldier as an individual moral agent continuous with ordinary life, while she is treating the soldier as a role-player within a coercive structure. Neither view captures the whole truth. The revisionist view captures the moral reality of the victim's suffering, while the traditionalist view captures the moral reality of the soldier's constrained agency. Recognizing that you are each highlighting a different moral cost might not end the argument, but it should stop it from bugging you. You are not missing a logical step; you are standing on opposite sides of a genuine moral dilemma where protecting the victim and protecting the ignorant agent are competing goods. Accepting that tension is more mature than forcing a resolution that ignores one side of the human experience.
