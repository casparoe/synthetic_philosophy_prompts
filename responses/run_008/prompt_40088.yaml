answer: |-
  ### Methodological Preamble: Remit vs. Clutter

  Before specifying the desiderata, we must delineate the boundary of the phenomenon. The "Paradox of Fiction" is often treated too narrowly as an ontological puzzle (how can we fear what does not exist?). As a scholar of mind, I treat it as a problem of **affective architecture**: how does the human emotional system interface with counterfactual or simulated inputs?

  **In Remit (The Data Set):**
  1.  **Somatic-Affective Coupling:** Tears, increased heart rate, startle reflexes, muscular tension occurring during engagement with known fictions.
  2.  **Intentional Directedness:** The feeling is *about* the character/situation (e.g., fear *for* the protagonist), not just a free-floating mood.
  3.  **Normative Shifts:** Changes in how we validate or value the emotion based on extra-textual facts (e.g., the "true story" revelation).
  4.  **Inhibition of Action:** The absence of typical behavioral outputs (we do not call the police when a murder occurs on screen).

  **Adjacent Clutter (To Be Excluded):**
  1.  **Aesthetic Judgment:** Admiring the *acting* or the *writing* is distinct from grieving the *death*. A theory of fiction emotions need not explain why we like a well-crafted villain, only why we fear them.
  2.  **Delusion:** Cases where the subject literally believes the fiction is real are psychopathological, not philosophical data points.
  3.  **Indirect Emotions:** Fear *that* one will be scared (anticipatory anxiety about the experience itself) is distinct from fear *of* the monster.
  4.  **Daydreaming:** Spontaneous imagination lacks the guided, artifact-dependent structure of fiction consumption.

  ---

  ### The Desiderata for an Adequate Theory

  Below are the constraints any theory must satisfy. I have marked those that are **Non-Negotiable** (phenomenological bedrock) versus **Contested** (reliant on specific empirical or theoretical commitments).

  #### D1: The Ontological Independence Constraint
  *   **Motivation:** We weep for Anna Karenina without believing she exists.
  *   **Case:** Weeping at a novel one has read before.
  *   **Requirement:** The theory must explain how an intentional object of emotion can be represented without ontological commitment.
  *   **Status:** **Non-Negotiable.** To deny this is to deny the datum.
  *   **Epistemic Flag:** This rests on the introspective report that we do not hold existential belief. If neuroimaging showed that emotional processing *requires* activation of belief-centers indistinguishable from reality-testing, this desideratum would need reformulation (e.g., to "suspended belief" rather than "no belief").

  #### D2: The Cognitive Impenetrability of Suspense (The Rewatch Constraint)
  *   **Motivation:** Knowledge of the outcome does not always extinguish the affective response.
  *   **Case:** Suspense persisting on rewatching; dread in horror where survival is known.
  *   **Requirement:** The theory must account for affective persistence despite contradictory propositional knowledge (knowing the protagonist survives).
  *   **Status:** **Non-Negotiable.** This is a robust phenomenological fact for competent consumers of fiction.
  *   **Epistemic Flag:** Relies on the distinction between *propositional knowledge* and *affective processing*. If future psychology proves rewatch "suspense" is merely aesthetic appreciation mislabeled as suspense, D2 collapses. I judge this unlikely given the somatic markers (heart rate) remain.

  #### D3: The Truth-Frame Sensitivity Constraint
  *   **Motivation:** The normative status of the emotion changes when the fiction/reality boundary shifts, even if the immediate phenomenology did not.
  *   **Case:** Learning the "based on a true story" frame was false after being moved.
  *   **Requirement:** The theory must explain why the *retrospective evaluation* of the emotion changes (e.g., feeling manipulated vs. feeling empathetic) without denying the initial emotion occurred.
  *   **Status:** **Non-Negotiable.** The "sting" of the deception is a real psychological event.
  *   **Epistemic Flag:** This assumes the emotion *itself* is re-evaluated, not just the memory of it. If subjects report "I feel exactly the same about the character, I just dislike the director," D3 weakens. My intuition is that the *moral weight* of the grief shifts.

  #### D4: The Real-Person Residue Constraint
  *   **Motivation:** Fiction involving real, living persons carries moral risks purely fictional characters do not.
  *   **Case:** Fiction depicting the suffering of a real, living person (e.g., a dramatized biopic of a trauma survivor).
  *   **Requirement:** The theory must distinguish the evaluative stance toward real-person suffering vs. purely fictional suffering, even if the *sadness* feels identical.
  *   **Status:** **Non-Negotiable.** This is an ethical constraint on the philosophy of mind; ignoring it renders the theory morally naive.
  *   **Epistemic Flag:** Relies on the intuition that there *is* a difference. A radical fictionalist might argue there is no difference. I hold that the causal link to a real consciousness creates a distinct normative category.

  #### D5: The Action Inhibition Constraint
  *   **Motivation:** We do not intervene in fictional emergencies.
  *   **Case:** Watching a character drown without calling for help.
  *   **Requirement:** The theory must explain the decoupling of emotional arousal from standard behavioral output.
  *   **Status:** **Non-Negotiable.**
  *   **Epistemic Flag:** None. This is behavioral bedrock.

  #### D6: The Rationality Constraint (Contested)
  *   **Motivation:** Many cognitive theories demand emotions be rational judgments.
  *   **Case:** Fear of a known-safe monster.
  *   **Requirement:** *Rejected as Non-Negotiable.* I explicitly **refuse** to treat this as a hard desideratum. Demanding that fictional emotions be "rational" in the same way real-world emotions are smuggles in a Cognitive Theory of Emotions (CTE).
  *   **Status:** **Theory-Laden Artifact.**
  *   **Reasoning:** If a theory explains the phenomenology (D1, D2, D5) but admits the emotion is "arational" or "modular," it is preferable to a theory that forces rationality but fails to explain rewatch suspense.
  *   **What would change my mind:** If it were shown that "irrational" fictional emotions correlate with psychopathology or systematic cognitive dysfunction in the subject, rationality would become a health constraint. Currently, it is a philosophical preference.

  ---

  ### Part 1: Joint Unsatisfiability (The Trilemma)

  You suspected a conflict between distinguishing fear-of-fiction from fear-for-self, explaining rewatch suspense, and maintaining genuineness. I refine this suspicion into a sharper conflict. There is a subset of desiderata that is **jointly unsatisfiable** if we retain a specific hidden assumption about cognitive architecture.

  **The Conflict:**
  1.  **D2 (Rewatch/Knowledge):** Emotions persist despite knowledge of non-existence/outcome.
  2.  **D3 (Truth-Frame):** Emotions are sensitive to truth-value (existence matters for evaluation).
  3.  **Hidden Assumption (Cognitive Unity):** The same cognitive mechanism processes truth-value for *both* immediate arousal and retrospective evaluation.

  **The Problem:**
  If the mechanism is sensitive enough to truth to satisfy **D3** (the "true story" revelation changes the emotion's status), it is difficult to explain why that same mechanism was *insensitive* enough to truth to satisfy **D2** (knowing the story is fake/outcome is fixed didn't stop the tears).
  *   If the system ignores existence for **D2**, why does existence matter for **D3**?
  *   If the system tracks existence for **D3**, why did it fail to track it for **D2**?

  **Resolution:**
  I would **keep D2 and D3** and **reject the Hidden Assumption**.
  We must posit a **dual-process architecture**:
  1.  **Fast, Modular Affective System:** Handles D1, D2, D5. It is cognitively impenetrable (ignores "this is fake" during the scene).
  2.  **Slow, Reflective Evaluative System:** Handles D3, D4. It processes ontological status *post-hoc* or normatively.

  **Where I might go wrong:**
  If empirical psychology demonstrates that the "reflective" system cannot alter the valuation of an emotion without altering the somatic marker itself, then D2 and D3 are genuinely incompatible. In that case, I would **drop D3**. The immediate phenomenology of the grief (D2) is more certain than the retrospective normative shift (D3). The "sting" of deception might be a separate anger at the director, not a change in the grief itself.

  ---

  ### Part 2: The Exclusionary Desideratum

  Which single desideratum does the most damage to leading contenders?

  **The Exclusionary Desideratum:** **D3 (The Truth-Frame Sensitivity Constraint).**

  **Why:**
  *   **Pretense Theory (Walton):** Excellent on D1, D2, and D5. It treats emotions as "quasi-emotions" within a game of make-believe.
      *   *Failure:* It struggles immensely with D3. If it is all make-believe, why does it matter if the story is *actually* true? For Walton, the "game" is the same. The intense normative shift when learning a "true story" is fake suggests the emotion was *not* just a prop in a game, but relied on a belief connection that Pretense Theory denies.
  *   **Cognitive Theory (Yanal/Nussbaum):** Excellent on D3 and D4. It ties emotion to belief.
      *   *Failure:* It crashes against D2 (Rewatch). If emotion requires belief in existence/outcome uncertainty, rewatched suspense is impossible. They must argue rewatch suspense is "different" or "less real," which contradicts the phenomenological intensity.
  *   **Simulation Theory:** Moderate on all.
      *   *Failure:* Often lacks the normative machinery to explain D3 fully without borrowing from Cognitive Theory.

  **Verdict:**
  **D3 indicts the Contenders, not the Desideratum.**
  The phenomenological shift upon learning a story is false is robust. It reveals that while our *arousal* might be modular (allowing D2), our *emotional validation* is deeply tethered to reality. Pretense Theory is too light on ontology; Cognitive Theory is too heavy on it. D3 forces a hybrid view that neither currently offers satisfactorily.

  ---

  ### Brief Scoring of Contenders

  *   **Pretense Theory (Walton):** Solves the existence paradox and rewatch suspense elegantly but fails to account for the moral and normative weight of the "true story" revelation (D3).
  *   **Cognitive Theory (Standard):** Respects the link between emotion and belief (D3, D4) but renders rewatched suspense and fear of known fictions irrational or impossible (violates D2).
  *   **Simulation Theory:** Captures the phenomenology of "feeling as if" but often lacks the resources to explain why the "as if" feels morally distinct from the "is" (D4).
  *   **Thought Theory (Carroll):** Handles the content well but struggles with the somatic reality of the response (D1) without appealing to something like pretense.

  ### Final Epistemic Note

  My confidence in **D2 (Rewatch)** is high (90%), based on widespread self-report and physiological data. My confidence in **D3 (Truth-Frame)** is moderate (70%), as it relies on introspective reports of *value* which are noisier than reports of *feeling*.
  **What would change my mind:** A controlled study where subjects are moved by a "true story," then told it is fake, and show **zero** change in retrospective willingness to donate to the cause or moral judgment of the depiction, compared to a control group told it was fake from the start. If the "truth" reveals no behavioral/normative difference, D3 is an artifact of intellectualizing, not a constraint on the emotion itself. Until then, D3 stands.
