answer: |-
  Here are the predictions, the breakdown of her operating system, and the verdict on whose ethics actually hold water.

  ### The Predictions

  Based on her track record, put your money on **her refusing all three.**

  1.  **The Cousin's Visa:** **Wrong.** She respects the German state, and unless deportation means immediate death (which an overstay usually doesn't), the bureaucracy stands. Helping him hide undermines the rule of law she relies on for order.
  2.  **The NDA/Data Leak:** **Wrong.** She signed a contract voluntarily. "Gross but legal" doesn't meet the threshold of physical harm required to break a promise (unlike the drunk driving or murderer cases).
  3.  **The Professor's Extension:** **Wrong.** This is identical to the jaywalking case. The rule is "documented emergencies." A sympathetic story is an exception, and exceptions break the habit of compliance.

  ### The Rule She's Running

  You offered three candidates. Here is how they stack up:

  1.  **"Rules bind unless the stakes are truly grave."** (Threshold Deontology)
  2.  **"Rules bind unless the rule-giver loses legitimacy."** (Political Obligation)
  3.  **"Rules only work if people follow them habitually without exceptions."** (Rule Utilitarianism / Kantian Universalizability)

  **Candidate 2 is out.** Traffic lights and tax codes don't have "legitimacy" in the political sense, yet she obeys them. The murderer isn't a "rule-giver," yet she lies to him. This theory doesn't fit the data.

  **Candidate 3 is strong.** It explains the jaywalking perfectly ("If everyone jaywalked, traffic chaos ensues"). It explains the taxes and piracy. However, pure Kantians argue you *cannot* lie to the murderer at the door because lying is universally wrong. Your roommate *does* lie to the murderer. This means she isn't a pure "Habitual" follower. She makes an exception for safety.

  **The Winner: Candidate 1 ("Rules bind unless the stakes are truly grave").**
  This is **Threshold Deontology**. She believes rules are absolute *until* they conflict with a higher-order duty to prevent catastrophic physical harm.
  *   **Jaywalking/Taxes/Piracy:** No immediate physical harm. Rule stands.
  *   **Murderer/Drunk Driving:** Life and death are at stake. Rule collapses.
  *   **The Nuance:** Her threshold for "grave" is very high. It seems to be limited to **bodily safety or life.** Financial ruin, career damage, or bureaucratic unfairness do not clear the bar.

  ### The Splitter Case

  To split Candidate 1 (Threshold/Stakes) from Candidate 3 (Habitual/Universal), you need a scenario where preventing harm is significant, but breaking the rule undermines the system itself.

  **The Scenario:**
  > "Your friend is accused of cheating on a final exam. They didn't do it, but the evidence is circumstantial. If they're found guilty, they get expelled and lose their student visa (deportation). You have access to the grading server. You can tweak one log entry to prove they didn't cheat. It's hacking (illegal/breaking rules), but it saves their life trajectory. No one finds out but you and them."

  **Why it splits them:**
  *   **The Habitual Rule (Candidate 3):** **Wrong.** Tampering with academic records undermines the integrity of the institution. If everyone hacked grades when they felt unjustly treated, the degree becomes worthless. The system requires absolute compliance to function.
  *   **The Stakes Rule (Candidate 1):** **Fine.** Deportation and expulsion are "grave stakes" akin to the drunk driving case. The harm of the rule (expulsion) outweighs the harm of the violation (hacking a log).

  **How to bait her:** Wait until you're discussing the professor extension case. Then slide this in: "Okay, but what if it wasn't an extension? What if lying to the professor saved your friend from being deported?" If she hesitates, you've found the crack in her armor.

  ### The Showdown: Your Ethics vs. Hers

  You asked for no diplomacy, so here is the cold take: **Her system holds up better under pressure than yours.**

  Your system ("Rules are rough guides, conscience decides") is essentially **Act Utilitarianism** mixed with **Moral Particularism**. It sounds more humane, but it has a fatal flaw: **It relies entirely on the moral fitness of the judge.**

  When you say "nobody gets hurt," you are making a calculation. Humans are terrible at that calculation when they are tired, biased, or self-interested.
  *   *You:* "I'll jaywalk, no cars." (Risk: You misjudge speed, get hit, ambulance costs society money).
  *   *You:* "I'll pirate the movie, studio is rich." (Risk: Cumulative harm normalizes theft, creators leave).
  *   *You:* "I'll lie for my friend." (Risk: You erode trust in your own word).

  Your system works great when you are a saint. It works terribly when you are a normal person having a bad day. It invites **rationalization**. Every time you break a rule, you convince yourself it's the "conscience" choice, but often it's just the "convenient" choice.

  Her system (**Threshold Deontology**) admits that humans are bad at calculating outcomes. So, she outsources the decision to the rule.
  *   **Pros:** It creates a stable society. It prevents the slippery slope. It removes the ego from the equation ("It's not about what *I* think is right, it's about what the *rule* is").
  *   **Cons:** It can be cruel. It lacks mercy in edge cases that don't meet her "grave" threshold (like the cousin's visa).

  **The Verdict:**
  Her ethics are more **robust**; yours are more **adaptable**. But robustness matters more in a shared society. Your ethics require you to be smarter and better than you probably are. Her ethics just require you to be consistent.

  You think her rigidity is a bug. Philosophically, it's a feature. It stops her from becoming the villain in her own story because she doesn't trust herself to make the call. You trust yourself too much. That's the danger.
