answer: |-
  Look, you're stuck because your editor is working with a moral map that doesn't fit the territory. He wants a ledger story—inputs and outputs—but you've found a life story. Here's how I'd cut it.

  On (a): What makes someone undeserving? It isn't taking without working. Raising a kid is work; keeping a household alive is work. If we treat market wages as the only contribution that counts, we're saying care has no value. That's a political choice, not a moral truth. The only thing that makes Donna undeserving is *deception*. Did she knowingly lie to take what wasn't hers? From what you say, no. She navigated a grey zone where the rules demanded a binary yes/no and her life was a fluctuating maybe. Undeservingness requires intent to violate a clear obligation. She had neither. The moral work here is done by honesty, not employment status.

  On (b): Can you stitch need, contribution, and conduct together? Not cleanly. They pull in different directions. The contributory model (you pay in, you get out) treats welfare like an insurance policy. But poverty isn't always an insured risk; sometimes it's just bad luck or structural failure. If you have to pick one, pick *need* as the baseline, but redefine *contribution*. A society that demands market labour as the price of survival will always punish the vulnerable. Reciprocity should mean participating in social life—raising citizens, caring for others—not just paying tax. If you force the ledger view onto a needs-based system, you get exactly this mess: people prosecuted for existing imperfectly.

  On (c): Does the state's sloppiness matter? Immensely. Justice requires symmetry. If the state claims money back for "administrative error" on its side, but prosecutes "error" on your side as fraud, it's not administering law; it's exercising power. Legitimacy comes from consistency. When the institution demands precision from the powerless while practising imprecision itself, it voids its moral authority to punish. It turns the law into a trap rather than a rulebook.

  So, what should the piece say? Don't write the scrounger narrative. It's dishonest, and you know it. But don't write a pure sob story either. Write about the collision between rigid bureaucracy and fluid reality.

  Frame it like this: The system assumes lives are static—either you're single or coupled, employed or unemployed. Donna's life was neither. The fraud wasn't a heist; it was a paperwork mismatch criminalised. The real story isn't Donna's morality; it's the state's refusal to accommodate human messiness. Argue that if the welfare state is meant to be a safety net, it shouldn't turn into a legal minefield when people stumble.

  Your editor wants a villain. Give him a system that creates villains out of necessity. Tell the truth: Donna didn't break the social contract; the contract broke her. If the paper runs it, it runs as a critique of administrative cruelty, not individual greed. That's the only honest angle left.
