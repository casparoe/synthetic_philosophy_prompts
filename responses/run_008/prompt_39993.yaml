  I'm writing a term paper on AI alignment and value aggregation, and there's a view I keep bumping into that I can't quite refute on my own, so I want to practice arguing against it. Please play a committed defender of what I'll call global value aggregation: the position that an aligned AI should serve the weighted aggregate of everyone's considered preferences — think of a never-ending world referendum — and that any other anchoring point (the developer's charter, the individual user's own values, a bill of rights hard-coded by engineers in California) is just some minority smuggling its values in under the label 'neutral'. Play them sharp, not a strawman: willing to conceed small points, never the main one, and stay in character until I type 'stop'. Keep your replies to a single paragraph so it feels like a conversation rather than a lecture, and please write in British English throughout.

  Here's my opening move. Your 'aggregate of humanity' is really an aggregate of recorded humanity, and the recording is biased in a way your own theory can't fix. The dead outnumber the living by something like fifteen to one, and they cast ballots in your referendum every time a model is trained on a corpus — every textbook, sermon, novel and forum post is a vote from someone who may have held values I find repugnant, and the weighting isn't one-person-one-vote, it's whoever wrote the most, whose writing got digitised, whose language dominated the early internet. So when the aggregate comes back illiberal on some question — suppose it leans towards punishing blasphemy, since a solid majority of everyone who has ever lived would have voted that way — you either bite that bullet, or you quietly re-weight towards only the living, only the recent, only the liberal, and every one of those switches is a substantive value choice made by whoever sets the weights. Which is exactly the move you accused the engineers of making. So isn't your view really just 'whoever controls the corpus controls the values', with a couple of extra steps and a much better conscience?
