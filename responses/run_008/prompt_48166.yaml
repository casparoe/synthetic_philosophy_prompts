answer: |-
  To move beyond the stalemate between Effective Altruism (EA) and its institutional critics, we must treat the allocation of resources not as a choice between two ideologies, but as an optimization problem under conflicting constraints. A unified principle for dividing labor and capital between incremental (measurable) and systemic (structural) interventions must satisfy a specific set of desiderata.

  Below are the necessary conditions for such a principle. They are categorized by their function, with an assessment of whether they are non-negotiable requirements for rational altruism or contested prejudices specific to one camp.

  ### I. Epistemic Desiderata (Knowledge and Evidence)

  **1. The Tractability Constraint**
  *   **The Case:** Any intervention, whether distributing bednets or lobbying for financial regulation, requires a causal model. If a systemic intervention relies on a chain of events too complex to model or verify, it risks becoming a "hope strategy" rather than an investment.
  *   **Requirement:** The principle must demand a plausible causal mechanism, even if probabilistic. It must distinguish between *theoretical* impact and *actionable* impact.
  *   **Classification:** **Non-negotiable.** Without a causal story, resource allocation is random. Both camps agree that wishing for change is not the same as engineering it.

  **2. The Measurement Boundary**
  *   **The Case:** EA prioritizes metrics (e.g., cost per life saved). Critics argue this creates "measurability bias," where unquantifiable goods (dignity, justice, autonomy) are valued at zero. Conversely, ignoring metrics allows for self-deception regarding efficacy.
  *   **Requirement:** The principle must account for value that resists quantification without abandoning rigor. It must specify how to weigh a guaranteed small good against a probabilistic large good that cannot be easily counted.
  *   **Classification:** **Prejudice of the Critique (mostly).** While rational agents should avoid bias, the insistence that *unmeasurable* values must drive allocation is a challenge to the consequentialist calculus central to EA. EA views this as an epistemic failure; Critics view it as a moral necessity.

  **3. The Counterfactual Sensitivity**
  *   **The Case:** In "earning to give," does the individual's presence in a harmful institution make it worse, better, or neutral? In systemic reform, would the change have happened without you?
  *   **Requirement:** The principle must evaluate actions based on the marginal difference they make, not the gross output. It must adjudicate the "complicity" of funding sources against the "impact" of the donation.
  *   **Classification:** **Non-negotiable.** Ethical allocation requires assessing net impact, which inherently includes negative externalities of the means of acquisition.

  ### II. Ethical Desiderata (Values and Constraints)

  **4. The Complicity Audit**
  *   **The Case:** Critics argue that earning high wages in extractive industries to fund charity reinforces the very systems causing deprivation. EA defenders argue that the money is fungible and the net good outweighs the moral stain.
  *   **Requirement:** The principle must define the threshold at which the harm of the *means* negates the good of the *ends*. It must distinguish between *changing a system* and *merely declining to reinforce it*.
  *   **Classification:** **Prejudice of the Critique.** This relies on a deontological or virtue-ethical framework (purity of action) that is often orthogonal to the strict consequentialism of EA. A pure consequentialist sees this as redundant to the Counterfactual Sensitivity constraint; a critic sees it as a distinct moral constraint.

  **5. The Regress Stopper**
  *   **The Case:** If one must always address the "root cause" (e.g., capitalism, colonialism) before addressing symptoms (e.g., malaria, hunger), action becomes impossible. The causal chain of deprivation is infinite.
  *   **Requirement:** The principle must allow for interim amelioration. It must specify when a symptom is urgent enough to warrant treatment even if the disease remains uncured.
  *   **Classification:** **Non-negotiable.** Without this, the principle leads to paralysis. Both camps ultimately want people to act, even if they disagree on the action.

  **6. The Variance Tolerance**
  *   **The Case:** Systemic interventions are high-variance gambles (low probability, massive impact). Incremental interventions are low-variance (high probability, moderate impact).
  *   **Requirement:** The principle must incorporate a risk profile. It must decide whether the altruistic portfolio should be diversified (some safe, some risky) or maximized for expected value regardless of variance.
  *   **Classification:** **Prejudice of EA (mostly).** EA typically argues for expected value maximization regardless of variance (risk-neutrality). Critics often implicitly argue for risk-aversion regarding justice (we cannot gamble with rights) or risk-seeking regarding revolution (reform is too slow).

  ### III. Pragmatic Desiderata (Time and Scale)

  **7. The Time-Horizon Alignment**
  *   **The Case:** Deworming shows results in months; financial regulation might show results in decades. Discount rates heavily favor the former.
  *   **Requirement:** The principle must explicitly state its discount rate for future benefits. It must adjudicate between saving a life now and potentially saving a million lives later.
  *   **Classification:** **Non-negotiable.** Time is a finite resource. Any allocation principle must have a temporal weighting, even if that weighting is "zero discounting."

  **8. The Institutional Leverage Test**
  *   **The Case:** Is it better to work inside a bank to reform it, or outside it to fund rivals?
  *   **Requirement:** The principle must evaluate the leverage of position. It must distinguish between *reform from within* (which risks co-optation) and *opposition from without* (which risks irrelevance).
  *   **Classification:** **Non-negotiable.** This is a strategic necessity. Ignoring leverage leads to wasted effort.

  ---

  ### IV. Analysis of Joint Satisfiability

  The critical question is whether a single principle can satisfy all eight desiderata simultaneously. **They are not jointly satisfiable without a meta-rule that introduces a subjective trade-off.**

  The incompatibility arises from the tension between **Epistemic Closure** (Desiderata 1, 2, 3) and **Moral Openness** (Desiderata 4, 5, 7).

  1.  **The Measurement vs. Scope Conflict:** To satisfy the *Tractability Constraint* (1) and *Counterfactual Sensitivity* (3), one generally requires data. Data is readily available for incremental interventions but scarce for systemic ones. To satisfy the *Measurement Boundary* (2) and include unquantifiable systemic goods, one must relax the evidentiary standards of (1). You cannot have high epistemic rigor *and* include high-uncertainty systemic variables in the same calculation without weighting one over the other.
  2.  **The Complicity vs. Consequence Conflict:** The *Complicity Audit* (4) often contradicts the *Regress Stopper* (5) and *Counterfactual Sensitivity* (3). If the net consequence of earning to give is positive (3), but the means are complicit in harm (4), a strict consequentialist must ignore (4). A critic must prioritize (4) even if it reduces net impact. A unified principle cannot maximize net impact *and* minimize moral stain simultaneously if the two are inversely correlated.
  3.  **The Risk Conflict:** The *Variance Tolerance* (6) dictates the split. If you are risk-neutral (EA standard), you pour resources into the highest expected value, which often looks like long-term systemic bets or AI safety. If you are risk-averse regarding immediate suffering (Critique standard), you fund incremental aid. A single principle cannot optimize for both risk profiles.

  ### The Forced Trade-Off

  The list of desiderata forces a trade-off between **Certainty of Benefit** and **Depth of Intervention**.

  *   **Satisfying the EA cluster (1, 3, 5, 7):** Requires prioritizing interventions where the counterfactual is clear, the metrics are available, and the time horizon is manageable. This systematically excludes deep systemic change because it fails the *Tractability* and *Measurement* tests.
  *   **Satisfying the Critique cluster (2, 4, 6):** Requires prioritizing interventions that address root causes and moral integrity, even if the causal chain is long and the metrics are fuzzy. This systematically excludes incremental aid because it fails the *Complicity* and *Regress* tests (by treating symptoms as morally insufficient).

  **Conclusion:**
  There is no neutral algorithm to divide time and money that satisfies these desiderata equally. The desiderata themselves encode the conflict. To create a working principle, an agent must introduce a **Meta-Weighting Variable**: a subjective decision on how much epistemic uncertainty they are willing to tolerate in exchange for potential structural depth.

  Therefore, the stalemate persists not because one side is irrational, but because they are optimizing for different variables within the same constraint set. EA optimizes for *verified impact per unit of resource*; the Institutional Critique optimizes for *moral coherence and structural leverage per unit of resource*. Until the meta-weighting of "verification" versus "coherence" is agreed upon, the desiderata remain mutually constraining rather than jointly satisfiable.
