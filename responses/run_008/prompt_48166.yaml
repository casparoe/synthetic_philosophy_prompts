prompt: |-
  Every argument I see about the institutional critique of effective altruism ends the same way — critics say that donating to a deworming charity while earning at a bank leaves the systems producing the underlying deprivation intact, while defenders reply that talk of systemic change is an applause light with no tractable plan attached. Rather than take sides, I want the specification first. Set out the desiderata that any adequate principle for dividing one's time and money between systemic interventions and incremental, measurable ones would have to meet: the cases it must adjudicate (earning to give versus working inside an institution to reform it, say, or a systemic gamble that could plausibly backfire), the distinctions it must respect (between changing a system and merely declining to reinforce it; between what is measurable and what matters), and the traps it must steer between — the regress on which you must always fix the deeper cause first and so may do nothing, and the measurability bias on which the unquantifiable drops out of the ledger. For each desideratum, give the case or consideration behind it, and say which are non-negotiable and which are prejudices of one camp. Most importantly, tell me whether the desiderata are jointly satisfiable — if the list itself forces a trade-off, that is the part I most want to see. Keep the weight on the criteria; there is no need to score particular organizations, authors, or interventions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Institutional critique of Effective Altruism (EA) vs. EA defense (systemic change vs. incremental/measurable interventions).
      *   **Goal:** Specify desiderata for a principle dividing time/money between systemic and incremental interventions. *Not* taking sides, but setting the criteria for adjudication.
      *   **Key Requirements:**
          *   List specific desiderata (cases to adjudicate, distinctions to respect, traps to avoid).
          *   For each desideratum: Provide the case/consideration behind it.
          *   Classify each as "Non-negotiable" or "Prejudice of one camp."
          *   **Crucial:** Determine if the desiderata are *jointly satisfiable* or if they force a trade-off (incompatibility).
          *   **Constraint:** Keep weight on criteria; do not score specific organizations/authors/interventions.
      *   **Tone:** Analytical, philosophical, precise, neutral.

  2.  **Deconstruct the Conflict:**
      *   *EA Side:* Emphasizes tractability, measurability, evidence, counterfactuals, "doing the most good with limited resources." Risk: Myopia, reinforcing harmful systems (e.g., earning to give in finance).
      *   *Critique Side:* Emphasizes root causes, structural injustice, long-term systemic change, moral complicity. Risk: Vagueness ("applause lights"), intractability, high variance/failure, paralysis (never good enough to act).
      *   *The Core Tension:* Certainty/Scale vs. Depth/Justice.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Measurability.* EA loves it. Critics say it misses what matters.
          *   *Desideratum:* The principle must account for value that resists quantification.
          *   *Classification:* Non-negotiable (otherwise it's just cost-benefit analysis, not ethics).

      *   *Idea 2: Tractability.* Critics propose vague systemic change. EA demands plans.
          *   *Desideratum:* The principle must require a plausible causal mechanism, even if probabilistic.
          *   *Classification:* Non-negotiable (otherwise it's wishful thinking).

      *   *Idea 3: Complicity/Harm.* Earning to give might fund harm.
          *   *Desideratum:* The principle must weigh negative externalities of funding sources against positive outputs.
          *   *Classification:* Non-negotiable (net impact matters).

      *   *Idea 4: The Regress Problem.* Fix root causes first? Then you never act.
          *   *Desideratum:* The principle must allow for interim amelioration without demanding total systemic resolution first.
          *   *Classification:* Non-negotiable (prevents paralysis).

      *   *Idea 5: The Variance Problem.* Systemic change is high risk/high reward. Deworming is low risk/low reward.
          *   *Desideratum:* The principle must handle risk tolerance and portfolio approaches.
          *   *Classification:* Non-negotiable (rational decision making).

      *   *Idea 6: Moral Integrity vs. Outcome.* Is it okay to do bad to do good?
          *   *Desideratum:* The principle must distinguish between *consequences* and *constraints* (deontological vs. consequentialist).
          *   *Classification:* Prejudice (depends on ethical framework). *Wait, let's refine this.* The prompt asks for a principle for *dividing time and money*. This implies a consequentialist framing mostly, but the critique is often deontological/virtue ethical. Let's frame it as "Action-Guidance."

      *   *Refining the "Joint Satisfiability" Check:* This is the most important part. Can we have measurability *and* account for the unquantifiable? Can we have systemic ambition *and* tractability?
      *   *Hypothesis:* They are *not* fully jointly satisfiable without a meta-rule for trade-offs. There is an inherent tension between *epistemic rigor* (EA) and *structural scope* (Critique).

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the stalemate and the goal (specification of desiderata).
      *   **The Desiderata List:** Grouped by function (Epistemic, Ethical, Pragmatic).
      *   **Classification:** Clearly mark Non-negotiable vs. Camp Prejudice.
      *   **The Compatibility Analysis:** The core philosophical heavy lifting. Are they jointly satisfiable?
      *   **Conclusion:** Summary of the trade-off.

  5.  **Drafting Content (Mental or Scratchpad):**
      *   *Desideratum 1: The Tractability Constraint.* (EA demand). Must have a causal story. Non-negotiable for action.
      *   *Desideratum 2: The Scope Constraint.* (Critique demand). Must address root causes, not just symptoms. Non-negotiable for *justice*, but maybe negotiable for *immediate relief*? Let's call it "Structural Sensitivity."
      *   *Desideratum 3: The Epistemic Humility Requirement.* (Both). Acknowledge uncertainty. Non-negotiable.
      *   *Desideratum 4: The Complicity Audit.* (Critique). Earning to give shouldn't fund harm. Non-negotiable for net good.
      *   *Desideratum 5: The Measurement Boundary.* (EA). Needs metrics. (Critique). Metrics bias. *Conflict here.*
      *   *Desideratum 6: The Time-Horizon Alignment.* Systemic is long-term. Incremental is short-term. Needs a discount rate or weighting.

      *   *Refining the "Joint Satisfiability":*
          *   If we demand strict quantification (EA), we exclude systemic (Critique).
          *   If we demand structural purity (Critique), we exclude incremental (EA).
          *   Therefore, a *weighting function* is needed. The desiderata themselves create the tension. The "principle" must be a meta-ethical choice, not just a calculation.
          *   *Verdict:* They are not jointly satisfiable in a single maximization function without introducing a subjective variable (risk tolerance/time preference).

  6.  **Polishing the Argument:**
      *   Ensure I don't score charities.
      *   Ensure I address the specific examples in the prompt (earning to give, systemic gamble).
      *   Make sure the distinction between "Non-negotiable" and "Prejudice" is sharp. A "Prejudice" isn't necessarily wrong, but it's specific to a worldview (e.g., strict utilitarianism vs. virtue ethics).
      *   *Self-Correction on "Prejudice":* The prompt asks to identify which are prejudices of one camp. I need to be careful not to dismiss them as *wrong*, just as *contested*.
      *   *Key Insight:* The tension is between *Epistemic Closure* (EA) and *Moral Openness* (Critique).

  7.  **Final Review against Prompt:**
      *   Set out desiderata? Yes.
      *   Cases adjudicated? Yes (E2G, reform vs exit).
      *   Distinctions respected? Yes (measurement vs value).
      *   Traps avoided? Yes (regress, bias).
      *   Classify Non-negotiable vs Prejudice? Yes.
      *   Joint Satisfiability? Yes (this is the climax).
      *   No scoring organizations? Yes.

  8.  **Final Polish:** Check tone. Needs to be rigorous, slightly academic but accessible. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just list "EA wants X" and "Critics want Y". I need to formulate them as requirements for a *unified principle*.
  *   Instead of "EA wants metrics," the desideratum is "The principle must distinguish between evidence of impact and evidence of activity."
  *   Instead of "Critics want justice," the desideratum is "The principle must account for negative externalities of the means, not just the ends."

  *Re-evaluating Joint Satisfiability:* Is it impossible? Or just hard? If I say "impossible," that's strong. If I say "possible only with a meta-rule," that's more precise. The prompt asks "if the list itself forces a trade-off." I should argue that the trade-off is inherent to the nature of the goods being pursued (certainty vs. scope).

  Let's organize the desiderata into three categories: Epistemic, Ethical, and Pragmatic. This helps structure the incompatibility analysis.

  *   *Epistemic:* Measurability vs. Complexity.
  *   *Ethical:* Complicity vs. Consequence.
  *   *Pragmatic:* Tractability vs. Ambition.

