answer: |-
  The rain in Oakhaven didn't fall so much as it hovered, a persistent, freezing mist that soaked through the wool of Elias's coat and settled into the grain of the wooden table. It was November 14th, 1893, 11:43 PM. In seventeen minutes, the granary behind the inn would catch fire.

  In the rented room above the bakery, three prevention auditors sat around a table littered with empty coffee cups, temporal stabilizers, and a case file that had grown physically thicker with every jump.

  "It burned," Mara said. She didn't look up from the dossier. She was tracing a finger over a photograph of the aftermath: blackened beams, a pile of ash where wheat used to be. "We removed the lantern. We removed the lantern *and* the dry thatch. We even removed the watchman's drunkenness. We gave him a headache powder and a sermon. It still burned."

  Elias rubbed his temples. He looked older than he had when they started the case a week ago, though in their timeline, only an hour had passed. "The variance is minimal. The fire still consumes eighty percent of the stock. The village still starves through the winter. Twelve casualties."

  "Thirteen," Kian corrected softly. He was the junior auditor, the one who still flinched when the timeline snapped back into place. "The baker's daughter was in the loft this time. Last jump, she was in the house. Different week, different victim. Is it the same disaster if the dead people aren't the same?"

  "It's the same *class* of disaster," Elias said, his voice tight. "That's what matters to the Bureau. Famine in the Oakhaven province. Localized economic collapse. We fix the class, we get paid."

  "We can't fix the class!" Mara slammed her hand on the table. The coffee cups jumped. "Because there is no single cause. This is an overdetermined event, Elias. It's a knot. You pull one string, the others tighten. If it's not the lantern, it's the lightning strike we missed on the second sweep. If it's not the lightning, it's the spontaneous combustion of the damp hay. If it's not the hay, it's the disgruntled farmer with the match we found in the third iteration. Every sufficient cause is queued up behind the last one like customers at a ticket booth. We turn one away, the next steps up."

  Elias opened the case file. It was a mess of redacted forms and variance reports. "The Charter, Mara. Section 4, Paragraph 1. 'Each incident must be assigned exactly one root cause for the paperwork.' One cause. One removal. Done."

  "The Charter was written by people who thought history was a line," Mara said. "It's a web. We're trying to cut a spiderweb with a pair of scissors and complaining that the hole closes up."

  "If we don't cut it, the budget office flags us. If they flag us, they audit the jump logs. If they audit the logs, they see we've burned through four months of temporal allowance on a Level 2 Granary Fire." Elias leaned forward, the lamplight carving deep shadows into his face. "Do you know what happens to auditors who can't close a file? They get reassigned to sedimentary analysis. In the Cretaceous. Forever."

  Kian stirred his cold coffee. "Maybe we're asking the wrong question. We keep asking 'What started the fire?' But maybe we should be asking 'What allows the fire to matter?'"

  Mara looked at him. "Explain."

  "The village starves because the granary burns," Kian said. "But the granary burns because the village stores all its wheat in one wooden box next to a brewery. That's the cause. The architecture. The centralization."

  "We can't move the granary," Elias said. "That's a macro-intervention. That's Level 5. We're Level 2. We move a match, not a building."

  "So we lie," Mara said. The word hung in the damp air.

  "We don't lie," Elias corrected. "We curate."

  "It is a lie!" Mara stood up and walked to the window. Below, the street was empty. The village slept, unaware that its winter was being debated by ghosts in the rain. "I pulled up the historical record from our home time. The 2150 Standard History of Agricultural Disasters. You know what it says caused the Oakhaven Fire?"

  Elias didn't answer. He knew.

  "It says 'Negligence of Watchman Thomas Gower,'" Mara said, turning back to them. "It says he fell asleep with a lantern. But we know Gower didn't have a lantern in the third jump. We know he was sober. We know the fire started from a spark in the chimney breast. But the history book... the *future*... it insists on Gower."

  "Because the narrative requires a culprit," Elias said. "If the book says 'Systemic redundancy failure due to convergent causal factors,' what does the farmer in 1920 learn? Nothing. You can't punish a system. You can't hang a concept. If you want prevention, you need a villain. Gower is the villain. So, in a way, Gower *is* the cause. Because he's the cause that *works*."

  "That's sentimental nonsense," Mara snapped. "That's you dressing up bureaucracy as philosophy. The honest file is a list of a hundred sufficient causes with a note saying 'No root cause exists, close the file.' Let the budget office deal with it."

  "And when they reject it?" Elias asked. "And they send a Senior Auditor to scrub the timeline because we failed to stabilize the event? They'll prune the whole branch. They won't just save the grain, Mara. They'll erase Oakhaven. Make it a swamp. No village, no fire, no famine. Clean slate. Is that what you want? To be so honest about the complexity of causality that you delete the people we're trying to save?"

  Mara sat back down heavily. The fight drained out of her, replaced by the heavy exhaustion of the time-sick. "So we pick one. We pick the one that fits the story."

  "We pick the one that prevents the recurrence," Elias said. "If we file 'Gower,' the Bureau mandates watchman sobriety checks in this sector for the next fifty years. Granaries don't burn. If we file 'Chimney Spark,' they mandate brick lining. Also good. But if we file 'Causal Web,' they mandate nothing. Because they can't."

  Kian was looking at the photograph again. "But the victims change. Every time we come back, someone different dies. In the first jump, it was the miller. In the second, the miller's wife. In the third, the baker's daughter. If we stop the fire *this* time, who are we saving? The people who are here now? Or the people who *would* have been here if we hadn't already changed it three times?"

  "We save the statistic," Elias said. "Twelve lives. Give or take."

  "That's monstrous," Kian whispered.

  "It's the job," Elias said. "We are not gods. We are plumbers. We stop the leak. We don't ask why the water wants to flow."

  Mara put her head in her hands. "I can't do it. I can't sign a form that says Gower did it when I watched him sweep the floor with a broom five minutes ago. I watched him. He was careful. He was kind. He gave me an apple."

  "Then don't sign it," Elias said. He pulled a fresh Form 12-B from his satchel. The paper was crisp, white, and smelled of ozone. "I'll sign it. I'll take the liability."

  "It's not about liability," Mara said, her voice muffled by her palms. "It's about truth. If we start editing the causes to fit the paperwork, we aren't auditors anymore. We're authors. And if we're authors, why stop at the fire? Why not fix the famine? Why not fix the poverty? Why stop at one cause?"

  "Because the budget stops at one cause!" Elias's voice rose, cracking slightly. He took a breath, steadying himself. "Because the human mind stops at one cause. Look at us. We can't even handle it, and we have temporal drives. How do you expect a historian in 2150 to handle it? They need a handle to grab. A web has no handle. A villain has a handle."

  "A handle is just a lever for manipulation," Mara said. She looked up, her eyes red-rimmed. "If we tell them it was Gower, they will hate Gower. They will teach their children to fear Gower. They will build a culture of suspicion around watchmen. That becomes part of the timeline. That ripples forward. We aren't just saving grain, Elias. We're infecting the future with a lie."

  "Or we're giving them a lesson they can use," Elias countered. "A lie that saves lives is a functional truth. In our line of work, utility *is* truth."

  Kian pushed the form toward the center of the table. "There's a third option."

  Elias and Mara both looked at him.

  "We file the truth," Kian said. "But we frame it."

  "Frame it how?" Mara asked.

  "We list 'Watchman Negligence' as the primary cause," Kian said. "But in the addendum, the section they rarely read unless there's an audit... we put the variance data. We list the other sufficient causes. We mark the event as 'High Causal Density.' We flag it for review."

  "That triggers an audit," Elias said. "I just told you."

  "It triggers a review," Kian corrected. "A review takes time. While they review, the prevention stands. The grain is saved. The village eats. By the time they realize the file is messy, the event is ten years in the past. They won't rewind ten years for a paperwork error. They'll just yell at us."

  Mara looked at Kian, then at Elias. "He's right. It buys the outcome without cementing the lie as absolute dogma. It leaves the door open for someone else to see the web."

  Elias stared at the form. The line for *Root Cause Designation* was blank. The pen sat beside it, heavy as a lead pipe. Outside, the church bell began to toll. Midnight. The granary would ignite in four minutes.

  "If we do this," Elias said quietly, "we become the problem. We become the auditors who can't follow the Charter. Our careers are done. We'll be scrubbing data in the basement."

  "Maybe," Mara said. "Or maybe someone reads the addendum in twenty years and realizes Oakhaven wasn't about a watchman. Maybe they change the protocol. Maybe they stop sending us to fix single causes in a multi-causal world."

  "And maybe they fire us before breakfast," Elias said.

  "Does it matter?" Kian asked. "The grain burns in three minutes. We have to choose. Do we protect the Bureau's narrative, or do we protect the history?"

  Elias picked up the pen. He held it over the paper. The ink hovered, a black droplet waiting to fall.

  "The Bureau protects the future," Elias said. "History is just the debris left behind."

  "History is the only thing that teaches us how to build a better future," Mara said. "If the lessons are fake, the future is built on rot."

  Elias looked at the window. A faint orange glow had begun to pulse against the curtains. Not the fire—that was the reflection of the lantern in the street below. But soon. The smell of smoke was already ghosting through the sash, a premonition of the next iteration.

  "We have to jump in two minutes," Kian said. "If we don't file the removal order, the prevention doesn't trigger. The fire happens. Again."

  Elias uncapped the pen. The scratch of the nib on the paper was loud in the quiet room. He didn't write *Watchman Negligence*. He didn't write *Causal Web*.

  He wrote: *Structural Vulnerability.*

  Mara frowned. "That's not a root cause. That's a condition."

  "It's the only thing that was constant in every iteration," Elias said, not looking up. "The building. The wood. The location. It's technically true. It's also vague enough that the budget office might accept it as a 'Systemic Failure' code, which has a higher allowance."

  "It's a loophole," Kian said.

  "It's a hedge," Elias corrected. He signed his name at the bottom. Then he slid the form to Mara. "Sign it. If we're going to the basement, we go together."

  Mara looked at the form. *Structural Vulnerability.* It wasn't the lie of the watchman. It wasn't the overwhelming truth of the web. It was a compromise. A bureaucratic grey area that acknowledged the container without blaming the content. It would save the grain. It would likely get them reprimanded. It would satisfy the Charter's demand for a singular noun, while hinting at the complexity beneath.

  She picked up the pen. Her hand shook, just once.

  "The textbook will still say Gower," Mara said.

  "Maybe," Elias said. "Or maybe, with this filing, the textbook gets an asterisk."

  "An asterisk doesn't feed a village," Mara said. But she signed.

  Kian signed last. He didn't say anything. He just capped the pen and set it down.

  The orange glow outside brightened. The smell of smoke grew stronger, no longer a premonition but a reality. They had filed the removal. The timeline would snap. The wood would be treated. The spark would fail. The granary would stand.

  Elias stood up and began packing the stabilizers. "We have thirty seconds before the jump. Don't leave any trace."

  Mara gathered the coffee cups. "Do you think we did the right thing?"

  Elias paused, his hand on the temporal drive. He looked at the case file, now closed, the thick stack of paper containing a hundred versions of a fire that never happened, and one version of a truth that might not stick.

  "I think we filed the form," he said. "The rest is just variance."

  "Variance is where the people live, Elias," Mara said.

  "Then let's hope they like the neighborhood," he replied.

  He activated the drive. The room began to hum, the rain outside freezing in mid-air, the smoke retreating back into the wood. The world dissolved into the white static of the corridor between seconds. There was no victory music, no sense of resolution. Just the quiet click of a form submitted, and the knowledge that somewhere, in a future that was now slightly altered, a historian would one day stare at a record that didn't quite make sense, and wonder why the granary never burned.

  And in the silence of the void, the three auditors waited to see if they would be greeted by a paycheck, or a firing squad.
