  This is a classic setup for the **Methodology of Confirmation**, and Maya is clearly navigating the space between **Nicod's Criterion** (instances confirm), **Bayesian Contextualism** (Good, 1967), and **Error Statistics** (Mayo, 1996). Her refusal to state the rule is a tell: she knows that once you formalize a principle of confirmation, you can construct a counter-example (the "get in trouble" part). She is relying on **scientific intuition** about **severity** and **sampling bias**.

  Here is the breakdown of the two plausible rules governing her verdicts, the predictions for your new cases, my bet on her actual operating system, and the experiment to catch her out.

  ### 1. The Two Plausible Rules

  Based on her four verdicts, two distinct philosophical frameworks fit the data perfectly.

  **Rule 1: The Counterfactual Risk Rule (Severity)**
  *   **Principle:** An observation confirms a hypothesis only if the *procedure* used to obtain it could have produced a counter-instance (a falsifier).
  *   **Logic:** Confirmation requires a "risky" test. If the world were different (i.e., if the hypothesis were false), would this procedure have likely shown it?
  *   **Fits Track Record:**
      *   (1) Black Raven: Could have been white. (Risk exists $\rightarrow$ Confirms).
      *   (2) Closet Shoe: You knew it was a shoe. No risk of it being a raven. (No Risk $\rightarrow$ No Confirm).
      *   (3) Mixed Barrel: A raven *could* have been in the barrel. (Risk exists $\rightarrow$ Confirms).
      *   (4) Golf Barrel: A raven *could not* be in a barrel of golf balls. (No Risk $\rightarrow$ No Confirm).

  **Rule 2: The Neutral Sampling Frame Rule (Methodological Purity)**
  *   **Principle:** An observation confirms a hypothesis only if the *population sampled* was not defined by the properties in the hypothesis (or its contrapositive).
  *   **Logic:** You cannot test the correlation between $R$ and $B$ by selecting only on $R$ or only on $\neg B$. You must sample from a neutral class (e.g., "Objects," "Birds") to avoid selection bias.
  *   **Fits Track Record:**
      *   (1) Park: Sampled from "Birds" or "Things in Park." (Neutral $\rightarrow$ Confirms).
      *   (2) Closet: Sampled from "Known Shoes." (Biased by knowledge $\rightarrow$ No Confirm).
      *   (3) Mixed Barrel: Sampled from "Objects." (Neutral $\rightarrow$ Confirms).
      *   (4) Golf Barrel: Sampled from "Golf Balls" (which entails Non-Raven). (Biased Frame $\rightarrow$ No Confirm).

  ### 2. Predictions for Case A and Case B

  Here is where the rules diverge. Case B is a consensus "No," but Case A is the battleground.

  **Case A: The Non-Black Object Machine**
  *   *Setup:* Machine selects randomly from *non-black things* in a warehouse. Dispenses white golf ball.
  *   **Rule 1 (Risk) Prediction:** **CONFIRMS.**
      *   *Why:* If a white raven existed in the warehouse, it is a non-black thing. The machine *could* have picked it. The test had the capacity to falsify the hypothesis.
  *   **Rule 2 (Frame) Prediction:** **NO CONFIRMATION.**
      *   *Why:* The sampling frame is "Non-Black Things." This is defined by the predicate $\neg B$. Selecting on the dependent variable invalidates the test of the correlation. It is the "institutionalized lazy paradox."

  **Case B: The Black-Bird Sanctuary**
  *   *Setup:* Netting a raven at a sanctuary that *policy-excludes* non-black birds.
  *   **Rule 1 (Risk) Prediction:** **NO CONFIRMATION.**
      *   *Why:* The policy makes a white raven physically impossible to catch. The test could not have failed.
  *   **Rule 2 (Frame) Prediction:** **NO CONFIRMATION.**
      *   *Why:* The sampling frame is "Black Birds." This is defined by the predicate $B$. Biased frame.

  ### 3. Which Rule is Maya Running?

  **I bet she is running Rule 1: The Counterfactual Risk Rule.**

  **Why?**
  1.  **The "Lazy" Complaint:** In Case 2 (Closet Shoe), her annoyance wasn't that you sampled from a closet (a neutral frame); it was that you *already knew* what it was. There was no *epistemic risk*. Rule 1 captures "risk" better than Rule 2. Rule 2 struggles to explain why the Closet is bad (a closet is a neutral frame of "items in my house") unless you add a clause about "Background Knowledge," which Rule 1 handles natively (if you know it, the risk is zero).
  2.  **PhD Intuition:** As a philosopher of science, she is likely influenced by **Deborah Mayo's Error Statistics** or **Popperian Severity**. These frameworks prioritize the *capacity of the test to detect error* over the logical form of the sampling frame. A test that *could* find a white raven (Case A) is a severe test of "All Ravens are Black," even if it searches via the contrapositive.
  3.  **Case 3 Precedent:** She accepted the Mixed Barrel. That barrel *could* have contained a white raven. Case A (Warehouse) *could* also contain a white raven. The only difference is the machine filters for color first. To a Severity theorist, filtering for color just increases the efficiency of testing the contrapositive; it doesn't negate the risk.

  **Verdict Prediction:**
  *   **Case A:** She will say **Confirms** (likely with a caveat like "it's a test of the contrapositive, so the confirmation is weak, but it counts").
  *   **Case B:** She will say **No Confirmation** (because the policy removes the risk).

  ### 4. The Crucial Experiment

  To definitively split Rule 1 (Risk) from Rule 2 (Frame), you need a case where **Risk is present** but the **Frame is biased**. Case A does this, but since the machine is a "black box," she might argue about the machine's internal logic. You need a human element to make the "Filtering" explicit.

  **Propose Case C: The "Pre-Sorted Bag"**

  > **The Setup:** "Maya, I have a bag of 1,000 objects from the warehouse. Before I brought it to you, I looked through it and **removed every single black object**. I only left the non-black things. I then drew a random item from this bag, and it's a white golf ball. Does this confirm?"

  **Why this splits them:**
  *   **Rule 1 (Risk) says CONFIRMS:** A white raven is non-black. If one had been in the original warehouse, it would have remained in the bag. The draw *could* have yielded a white raven. The risk was real.
  *   **Rule 2 (Frame) says NO CONFIRMATION:** You explicitly defined the sample by the property $\neg B$. You "selected on the dependent variable." This is methodological cheating, regardless of what was physically possible.

  **How to play it:**
  If she says **Confirms**, she is a **Falsificationist/Severity** theorist (Risk rules). She cares about whether nature *could* have said "no."
  If she says **No**, she is a **Methodological Purist** (Frame rules). She cares about whether the *procedure* was unbiased, even if the risk was theoretically there.

  **My advice:** Watch her face when you admit *you* removed the black objects. If she winces, Rule 2 is winning. If she shrugs and says "Well, a white raven could still have been in there," Rule 1 is the one.
