answer: |-
  Your observation is exceptionally astute, and it cuts to the methodological heart of contemporary memory studies. You have identified a rhetorical manoeuvre that is pervasive in public discourse but rarely subjected to precise taxonomic analysis.

  To answer your primary question: there is no single, canonical term in the existing literature that specifically names this *tactical switching* between stances. However, the framework you have intuitively grasped is deeply rooted in the foundational texts of the philosophy of history. To understand how to carve up this phenomenon, we must first anchor it in the existing canon before refining the specific mechanism you have noticed.

  ### 1. The Genealogy of the Modes: Nietzsche
  The triad of attitudes you describe corresponds almost exactly to the three modes of history outlined by Friedrich Nietzsche in his 1874 essay *On the Use and Abuse of History for Life* (part of the *Untimely Meditations*).

  1.  **Monumental History:** The past as a quarry of exemplary figures to emulate (your "exemplary figures").
  2.  **Antiquarian History:** The past as something to be preserved in full local detail, revering the ancestral (your "preserved in full local detail").
  3.  **Critical History:** The past as a defendant to be arraigned and condemned to enable living (your "defendant to be arraigned").

  Nietzsche argued that a healthy culture requires a balance of all three, but he warned that each becomes poisonous when it monopolises the others. However, Nietzsche was concerned with *cultural health*, not with the rhetorical tactics of individual debaters. He did not theorise the specific moment when an arguer slides from one mode to another to evade a counter-argument. That specific gap is where your observation lies.

  ### 2. Coining the Concept: Mnemonic Modal Slippage
  Since there is no established term for the *unacknowledged transition* between these stances, I propose we term this phenomenon **Mnemonic Modal Slippage**.

  This concept differs from simple inconsistency or hypocrisy. It is not merely that a person contradicts themselves; it is that they change the *ontological status* of the past mid-argument to secure a tactical advantage, whilst maintaining the illusion of a coherent stance.

  #### Definition
  **Mnemonic Modal Slippage** occurs when a participant in a debate regarding public memory shifts between Monumental, Antiquarian, and Critical modes of relating to the past without signalling the transition, specifically to insulate a preferred conclusion from scrutiny.

  #### The Mechanism of the Slippage
  The slippage usually functions as a defensive shield. Consider the example of a contested statue:
  *   **Phase 1 (Monumental):** The defender argues the figure is a "hero for our times" (invoking emulation).
  *   **Challenge:** The critic points out the hero's moral failings.
  *   **Phase 2 (Antiquarian):** The defender shifts to arguing that "we cannot erase history" or "it is part of our local heritage" (invoking preservation).
  *   **Challenge:** The critic argues that heritage does not require public veneration.
  *   **Phase 3 (Critical):** The defender shifts again, perhaps arguing that "judging the past by today's standards is unfair" (a negative critical mode that protects the subject from judgment).

  The slippage is the invisible seam between these phases. The arguer treats the past as a moral guide when it suits them, but as a fragile artefact when that guide is challenged, and as a foreign country when the artefact is deemed toxic.

  ### 3. Distinguishing from Related Concepts
  To carve up this phenomenon accurately, we must distinguish it from neighbouring concepts in historiography and rhetoric.

  **A. Versus 'Cherry-Picking' (Selective Evidence)**
  *   *Cherry-picking* involves selecting specific *facts* that support a thesis while ignoring others.
  *   *Mnemonic Modal Slippage* involves selecting specific *relationships* to the past.
  *   *Distinction:* One can cherry-pick facts while remaining in a single mode (e.g., only citing heroic deeds to build a Monumental history). Slippage occurs when the *rulebook* for how the past is treated changes. It is a category error, not merely an evidentiary one.

  **B. Versus 'Presentism'**
  *   *Presentism* is the anachronistic imposition of present-day values onto the past.
  *   *Slippage* often *uses* presentism as a tool within the Critical mode, but then retreats to Antiquarianism to claim "context" when criticised.
  *   *Distinction:* Presentism is a sin of interpretation; Slippage is a sin of argumentative coherence.

  **C. Versus 'Cognitive Dissonance'**
  *   *Cognitive Dissonance* is a psychological state of discomfort.
  *   *Slippage* is a rhetorical strategy. The participant may not feel discomfort; they are simply deploying the mode that offers the strongest defence at that moment. It is often conscious or semi-conscious instrumentalism.

  ### 4. Boundary Cases: Legitimate Pluralism vs. Slippage
  This is the most crucial area for your analysis. Is all switching illegitimate? No. A sophisticated historical consciousness *should* be able to hold multiple modes in tension. The boundary lies in **acknowledgement** and **consistency of object**.

  **Legitimate Pluralism (The Nuanced Historian)**
  A historian might say: *"Churchill serves as a Monumental figure for his leadership in 1940, yet we must apply a Critical lens to his views on India, whilst preserving the Antiquarian record of both."*
  *   **Key Feature:** The shifts are signalled. The tension is acknowledged. The criteria for switching are explicit.

  **Illegitimate Slippage (The Tactical Debater)**
  A debater says: *"He is a hero who defines us [Monumental]. You can't remove him because it erases history [Antiquarian]. Besides, you shouldn't judge him by modern standards [Anti-Critical]."*
  *   **Key Feature:** The shifts are reactive. The tension is denied. The criteria for switching are determined solely by what protects the statue from removal.

  ### 5. Suggested Literature for Context
  While the specific term "Mnemonic Modal Slippage" is not canonical, your essay would be strengthened by engaging with scholars who discuss the *politics* of these modes:

  *   **Friedrich Nietzsche:** *On the Use and Abuse of History for Life* (Essential for the triad).
  *   **Paul Ricoeur:** *Memory, History, Forgetting*. Ricoeur discusses the "abuse of memory" and the tension between memory and history, which provides a phenomenological basis for why these slippages occur.
  *   **Susan Neiman:** *Learning from the Germans*. She explicitly deals with the difference between Monumental and Critical memory in the context of reparations and statues.
  *   **David Rieff:** *In Praise of Forgetting*. He argues against the moral obligation to remember, which often triggers these modal shifts in opponents.

  ### Summary for Your Module
  In your essays, you need not rely solely on the coined term, but the conceptual framework should be:
  1.  **Identify the Mode:** Is the speaker treating the past as a model, a relic, or a crime scene?
  2.  **Locate the Pivot:** At what point of pressure does the mode change?
  3.  **Assess the Coherence:** Is the transition acknowledged as a tension, or masked as a single consistent argument?

  You have identified that public memory debates are often not about *what* the past was, but *what work* the past is being asked to do. When the work changes mid-sentence without admission, that is the slippage. It is a form of **argumentative camouflage**, allowing participants to claim the moral authority of the Monumental, the neutrality of the Antiquarian, and the sophistication of the Critical, all at once, without bearing the burdens of any.
