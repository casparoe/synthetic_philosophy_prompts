answer: |-
  Yes, there is an established name for the theoretical framework, but your intuition is correct: the standard term doesn't fully capture the specific *tension* you're describing regarding identity and the "slider" of idealization.

  ### 1. The Established Name
  In moral philosophy and decision theory, this is most commonly called the **Ideal Desire Theory** (or the **Informed Desire View**).

  *   **Core Definition:** Your well-being (or what you *truly* want) is determined not by your actual, occurrent desires, but by the desires you *would* have if you were fully informed, rational, and free from distorting factors (fatigue, addiction, fear).
  *   **Key Proponents:** Peter Railton (who calls it the "Ideal Advisor" model), David Sobel, and Richard Brandt.
  *   **How it differs from your description:** Ideal Desire Theory is usually a theory of *well-being* (what is good for you), whereas you are describing a theory of *authority* (which version of you gets to make the binding choice). While they overlap, the literature on well-being often sidesteps the "who counts as you" conflict that arises when the current self and ideal self disagree.

  ### 2. Nearest Neighbors in the Literature
  There are three specific concepts that map onto parts of your description, but each misses a piece of the puzzle:

  *   **Second-Order Volitions (Harry Frankfurt):**
      *   *The Concept:* You have first-order desires (want the drug) and second-order desires (want to *not* want the drug). Autonomy is acting on the second-order desire.
      *   *The Difference:* Frankfurt's model is hierarchical, not necessarily *informational*. A person can have a second-order desire that is just as ignorant or confused as the first. Your "slider" includes epistemic improvement (knowing everything), which Frankfurt doesn't require.
  *   **Precedent Autonomy (Bioethics):**
      *   *The Concept:* A competent person's prior directives (living will) bind their future incompetent self.
      *   *The Difference:* This is legal/ethical policy, not metaphysical. It assumes the earlier self *is* the same person without deeply interrogating the "slider" problem. If the demented self is genuinely happy and the prior self was grim, bioethicists still fight over whose preference counts.
  *   **Coherent Extrapolated Volition (CEV) (AI Alignment):**
      *   *The Concept:* Proposed by Eliezer Yudkowsky. An AI should do what humanity *would* want if we knew more, thought faster, were more the people we wished we were.
      *   *The Difference:* This is technically the closest match to your description. However, it is a technical proposal for AI goal-loading, not a philosophical analysis of personal identity. It explicitly acknowledges the "slider" problem but solves it by fiat (the AI figures out the "coherent" part).

  ### 3. The "Slider" Problem: The Alienation Objection
  You have independently rediscovered the most significant critique of Ideal Desire Theory, known in the literature as the **Alienation Objection**.

  *   **The Argument:** If you idealize an agent enough (give them infinite info, time, rationality), their preferences may shift so drastically that they no longer care about the things that make the *current* agent's life meaningful.
  *   **Example:** If you idealize a devout religious person with "all relevant information," they might become an atheist. If you then force the current religious person to live according to the idealized atheist's preferences, you haven't satisfied *their* desires; you've replaced them.
  *   **The Standard Treatment:** There is **no standard solution**. Philosophers generally split into two camps:
      1.  **Proceduralists:** Stop the slider early. Only correct for *process* errors (lying, coercion, fatigue), not *content* (values).
      2.  **Substantivists:** Let the slider run. If the idealized self rejects your current values, your current values were objectively mistaken (e.g., valuing ignorance).

  ### 4. The "Who-Counts-As-You" Problem
  You asked if there is a standard treatment for the identity problem. The short answer is **no**, but there is a standard *framework* for discussing it.

  *   **Psychological Continuity Theory:** The standard metaphysical view. You are the same person as your future self if there is a continuous chain of psychological connections (memories, values, intentions).
  *   **The Conflict:** Idealization breaks continuity. If the idealized self has different values and no memory of the struggle to get there (because they "always knew"), are they you?
  *   **Transformative Experience (L.A. Paul):** Philosopher L.A. Paul argues that some choices (having a child, becoming sober) fundamentally change your epistemic perspective. You *cannot* know what your future self will want from the current perspective. Therefore, deferring to the future self is metaphysically incoherent because that future self is, in a meaningful sense, a *different person*.

  ### 5. A Proposed Coinage: Volitional Extrapolation
  Since "Ideal Desire Theory" describes the *state* of the preferences, but not the *argumentative move* of using those preferences to overrule the current self amidst the identity tension you described, I propose the term **Volitional Extrapolation**.

  **Definition:**
  > **Volitional Extrapolation** is the normative claim that authority over a decision should be granted to a counterfactual version of the agent whose preferences are derived by projecting the agent's current psychological trajectory along axes of information, rationality, and time, *even if* this projection results in preferences that contradict the agent's current occurrent desires.

  **Distinction from Neighbors:**
  *   Unlike **Ideal Desire Theory**, *Volitional Extrapolation* explicitly acknowledges the *conflict* between the current and ideal self.
  *   Unlike **Second-Order Desires**, it requires *epistemic and temporal projection* (the "slider"), not just hierarchical ranking.
  *   Unlike **CEV**, it applies to individual human ethics, not just AI goal-loading.

  **The "Slider" within Volitional Extrapolation:**
  This concept inherently contains the problem you identified. We can distinguish between:
  *   **Conservative Extrapolation:** Correcting only for clear errors (sleep deprivation, lies).
  *   **Radical Extrapolation:** Correcting for fundamental values (ignorance, immaturity).
  *   **The Divergence Threshold:** The point on the slider where the extrapolated volition is no longer recognizably the agent's own (The Alienation Point).

  ### 6. Edge Cases for Volitional Extrapolation
  To test the boundaries of this concept, here are two edge cases where it is ambiguous whether we are still inside the concept or have crossed into "replacing the person":

  **Edge Case A: The Depressive Realist**
  *   *Scenario:* A clinically depressed person believes they are worthless. A non-depressed "idealized" version of them knows they are worthy.
  *   *Ambiguity:* Is the depressed person's desire (to give up) a distortion to be corrected (Standard Volitional Extrapolation)? Or is the non-depressed person's optimism a "bias" (the Pollyanna effect), meaning the depressed person actually has *more* accurate information about the harshness of the world?
  *   *Why it breaks the concept:* If "idealization" includes emotional stability, you might be overruling a *more accurate* assessment of reality with a *happier* delusion. Where does "correcting fear" end and "enforcing delusion" begin?

  **Edge Case B: The Religious Conversion**
  *   *Scenario:* A teenager is atheist. If they "grew up and thought it through" (the slider), they might become deeply religious. Their parents force them to attend church now based on this extrapolated future self.
  *   *Ambiguity:* Is the future religious self the "true" version (having had time to mature)? Or is the conversion a result of social pressure that wouldn't have happened if they were truly "free"?
  *   *Why it breaks the concept:* This highlights the **Value-Shift Problem**. If the extrapolation changes *terminal values* (from secularism to faith) rather than just *instrumental values* (how to achieve secularism), has the parent preserved the child's autonomy or overwritten it with a different person's values?

  ### Summary
  The academic home for this is **Ideal Desire Theory**, and the specific critique you raised is the **Alienation Objection**. However, to precisely carve out the *argumentative move* of overruling a current self based on a projected future self, **Volitional Extrapolation** is the more precise term. It captures the dynamic nature of the "slider" and the inherent risk that the extrapolation drifts so far it severs the link of personal identity. There is no standard solution to where the slider stops; that remains one of the open problems in normative ethics.
