      *Wait, one nuance:* The prompt asks what an adequate *response* must deliver. If the response is "Consequentialism is right, intuitions are wrong," that's a response (error theory). But usually, in this context, a "solution" implies modifying the theory or its application to mitigate the demand. I will frame the spec as requirements for a *mitigation strategy* that claims to remain within the consequentialist family.

      *Let's refine the "Non-negotiables":*
      1.  Must address the burden (otherwise it's not a response to demandingness).
      2.  Must remain consequentialist (otherwise it's a concession to deontology).
      3.  Must be principled (not ad hoc).

      *Let's refine the "Incompatibilities":*
      1.  Full Compliance Fair Share + Good Outcomes in Non-Compliance Worlds.
