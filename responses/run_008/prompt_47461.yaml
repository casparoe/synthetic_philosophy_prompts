      *(Self-Correction during drafting)*: Make sure to explicitly mention Cullity's structural point in the Supererogation row. Make sure to explicitly mention the "everyone takes prerogative" problem in the Iteration row.

      *(Final thought on the "Cost vs Alienation" point)*: This is subtle. Cost is quantitative (money/time). Alienation is qualitative (projects/identity). A solution based on marginal utility (cost) might not solve alienation. A solution based on integrity (alienation) might allow too much cost-avoidance. I need to highlight this tension.

