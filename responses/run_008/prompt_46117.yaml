      *   The Tension: The user is right. Popper hates "consensus" as a truth criterion. Kuhn emphasizes paradigms/consensus but warns against normal science becoming dogma.
      *   Legal Goal: The goal isn't "Truth" (capital T); it's "Reliability" and "Relevance" for a specific legal dispute. This is crucial. The epistemology is *legal*, not purely *scientific*.
      *   Implicit Philosophy: It's likely a form of *Pragmatism* (Peirce/Dewey) or *Reliabilism*. It's about what works for the jury, not what satisfies a philosopher of science.

