answer: |-
  This is a classic debate in aesthetics, centering on Kendall Walton's *Mimesis as Make-Believe*. Your textbook is presenting Walton's solution to the Paradox of Fiction (how can we feel emotions for entities we know do not exist?), and your roommate is channeling the standard objections raised by philosophers like Peter Lamarque, Noël Carroll, and Aaron Smuts.

  Here is the breakdown of the analogy, the points where it fractures, and an evaluation of whether Walton's conclusion survives the damage.

  ### 1. The Correspondence Table

  Walton's theory relies on mapping the structure of a child's pretend play onto the adult's engagement with art. Here is how the components align in the textbook's argument:

  | Component | The Doll Scenario (Child) | The Novel Scenario (Reader) |
  | :--- | :--- | :--- |
  | **The Prop** | The doll (physical object). | The text/novel (physical/symbolic object). |
  | **The Game** | "Playing House" / Pretend. | "Reading" / Engaging with the fiction. |
  | **Principles of Generation (Rules)** | Ad hoc rules decided by the child (e.g., "If I hold the doll, it's fictional that I'm holding a baby"). | Literary conventions + Textual directives (e.g., "If the text says 'she screamed,' it is fictional that she screamed"). |
  | **Fictional Truths** | "There is a baby here." | "There is a girl on the train." |
  | **The Player** | The child (active imaginer). | The reader (active imaginer, per Walton). |
  | **The Author** | The child (improviser of the narrative). | The Novelist (fixed creator of the narrative). |
  | **The Emotion** | "Quasi-fear" (pretend terror). | "Quasi-fear" (physiological arousal without belief). |

  ### 2. Where the Mapping Breaks (Disanalogies)

  Your roommate is correct that the doll analogy is doing heavy lifting, but it is carrying weight it wasn't designed to bear. Here are the structural fractures:

  **A. Improvisation vs. Fixity (Your Roommate's Point)**
  *   **Doll:** The child generates the fictional truths in real-time. If the child gets bored, the baby stops existing. The child is the *authority* on what is fictional.
  *   **Novel:** The fictional truths are fixed prior to engagement. The reader has no authority to change the narrative. The text *mandates* the imaginings.
  *   **The Break:** In the doll game, the imagination is *productive*; in the novel, the imagination is *receptive*.

  **B. Agency vs. Passivity (Spectatorship)**
  *   **Doll:** The child is an *agent* in the game. They move the doll, feed it, hide it. They are a character in their own fiction.
  *   **Novel:** The reader is typically a *spectator*. Walton tries to fix this by saying the reader imagines *themselves* as an invisible observer in the fiction, but functionally, the reader cannot interact with the girl on the train.
  *   **The Break:** Games imply agency; reading implies submission. Fear often stems from helplessness. A game where you control the monster (doll) generates different fear than a game where the monster is fixed and chasing you (novel).

  **C. Internal vs. External Rules (Conventions)**
  *   **Doll:** The rules are private and fluid. There is no "genre" of doll-play that dictates how the baby must behave.
  *   **Novel:** The rules are public and rigid (genres, narrative conventions). We know *in advance* that in a Thriller, the girl on the train *should* be in danger.
  *   **The Break:** Genre conventions prime emotional responses before the "game" even begins. A child doesn't have a "Horror Mode" switch for their doll; a reader opens a thriller with their emotional apparatus already pre-tuned.

  **D. The Stakes of the "Game"**
  *   **Doll:** The child can stop the game instantly if the fear becomes too much. The "off switch" is internal.
  *   **Novel:** While you can close the book, the narrative momentum and the fixed nature of the threat create a different kind of psychological grip. You are submitting to an external will (the author).

  ### 3. Which Disanalogies Matter for the "Quasi-Emotion" Conclusion?

  Walton's conclusion is that because we lack the **belief in existence**, the emotion is not *real* fear, but *quasi*-fear (like the physical sensation of fear without the cognitive judgment of danger).

  **The Noise (Doesn't hurt the conclusion):**
  *   **Fixity/Authorship:** Whether the child or the author created the scenario doesn't necessarily change the *ontology* of the emotion. I can feel quasi-fear in a game I made up or one someone else made up. This disanalogy is about the *source* of the fiction, not the *state of the mind*.
  *   **Conventions/Genre:** While genres prime us, they don't prove the emotion is real. I can be primed for a jump scare in a haunted house I know is fake; that doesn't make the fear "real" in the philosophical sense (if you define real fear as requiring belief in danger).

  **The Signal (Damages the conclusion):**
  *   **Agency and Passivity:** This is the critical break. In the doll game, the child is *pretending to be afraid*. In the novel, the reader is often *actually afraid* but unable to act.
      *   If I play with a doll, I might say "Oh no, the monster!" while smiling.
      *   If I read *The Girl on the Train*, my heart rate spikes, I sweat, and I feel genuine distress.
      *   **Why it matters:** Walton uses the doll to suggest the emotion is *part of the pretense*. But the passivity of reading suggests the emotion is a *reaction to the pretense*. If the emotion is a reaction, it is more likely to be a genuine physiological state (Real Fear) that simply lacks an object, rather than a pretend state (Quasi-Fear).
  *   **The "Off Switch":** In the doll game, the imagination is voluntary. In reading, emotional responses are often involuntary. I *try* to imagine, but the *fear* happens to me. If the emotion is involuntary, calling it "make-believe" feels like a category error.

  ### 4. Does the Conclusion Survive?

  **Short Answer:** The *solution* to the paradox survives, but Walton's specific *explanation* (Quasi-Emotion) is severely weakened without the doll analogy.

  **The Analysis:**
  Walton's argument relies on **Cognitivism about Emotions**: The idea that to truly fear X, you must believe X exists and is dangerous.
  *   **If you accept Cognitivism:** The conclusion survives even if the doll analogy is trash. You simply argue: "No belief in existence = No real fear." The doll was just an illustration.
  *   **If you reject Cognitivism (as your roommate likely does):** Many philosophers of emotion argue that emotions are perceptual or physiological, not judgment-based. You can fear a snake you *know* is a rubber toy. If emotions don't require existential belief, then the "Quasi" distinction collapses. We feel *real* fear for fictional characters.

  **The Verdict on the Analogy:**
  The doll analogy was carrying the burden of making "Quasi-Fear" intuitive. It makes sense to say a child's fear of a doll-monster is "pretend." It makes much less sense to say an adult's panic attack during a horror movie is "pretend."
  By exposing the disanalogy (passivity vs. agency), your roommate shows that the reader's experience is closer to **real trauma response** than **child's play**. Therefore, the "Quasi-Emotion" label looks like a semantic trick to save the Cognitive Theory, rather than a description of the experience.

  ### 5. A Better Prop: The Rollercoaster (or Haunted House)

  If the doll is the wrong prop because it implies active agency and improvisation, a better prop must capture **passivity, fixed rules, physiological arousal, and known safety.**

  **The Prop:** A Rollercoaster or Haunted House Ride.

  | Component | Rollercoaster Scenario | Novel Scenario |
  | :--- | :--- | :--- |
  | **Prop** | The Track / The Cars. | The Text. |
  | **Rules** | Physics + Engineering Design. | Literary Conventions + Authorial Design. |
  | **Agency** | **Passive.** You cannot steer. You submit to the ride. | **Passive.** You cannot change the plot. You submit to the story. |
  | **Belief** | You know you will not die (Safety). | You know the character is not real (Fiction). |
  | **Physiology** | Real adrenaline, screaming, gripping arms. | Real adrenaline, tearing up, gripping the book. |
  | **Emotion** | **Real Fear.** (Not quasi). | **Real Fear.** (Not quasi). |

  **Why this fixes the problem:**
  1.  **It accepts the Paradox:** It admits we feel *real* fear without *real* belief in danger. It dissolves the paradox by rejecting the Cognitivist premise that "Real Fear requires Belief in Existence."
  2.  **It matches the Phenomenology:** It accounts for the involuntary nature of the response. You don't "decide" to be scared on a drop; you just are.
  3.  **It removes the "Pretense":** No one says a screaming rider is "quasi-screaming." They are really screaming. This suggests the reader is really fearing.

  **Conclusion for your discussion:**
  Tell your roommate that the doll analogy fails because it conflates *generating* fiction with *consuming* it. The doll supports the idea that the *truths* are fictional, but it fails to prove the *emotions* are fictional. Switching the analogy to a **Rollercoaster** preserves the "no belief in existence" clause but forces us to admit the emotion is **genuine**. This solves the paradox without diminishing the reader's experience to "make-believe."
