prompt: |-
  I read a popular science book recently that had a section on whether species are real, and the gist was: they're not. It said evolution is gradual, so the boundaries between species are arbitrary lines we draw on a continuum — nature gives you continuous variation, not discrete boxes, so species are just convenient labels, a filing system humans invented. It claimed Darwin himself ended up thinking this way, that a species is just a variety that got distinct enough for us to notice, and that modern biology has confirmed it with stuff like ring species, where populations blur into each other so much you literally can't say where one species ends and the next begins. Then it concluded that the whole fight over species concepts (biological, phylogenetic, ecological, whatever) is really just biologists arguing about which filing system they personally find convenient, like librarians disagreeing about Dewey decimal vs Library of Congress. Something about this feels off to me — the slide from "boundaries are fuzzy in some cases" to "nothing real there" seems too fast — but I can't pin it down myself. Is this a fair take? Give me exactly five numbered points, a sentence or two each, covering what's accurate, what's being conflated (I suspect there's more than one conflation), whether the Darwin part is being stretched, and whether the conclusion about species concepts actually follows — and no intro or wrap-up, just the list.
