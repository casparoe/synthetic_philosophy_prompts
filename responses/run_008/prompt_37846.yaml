answer: |-
  This is one of the most persistent and revealing problems in the philosophy of art, often centered around Nelson Goodman's distinction between *autographic* and *allographic* arts, and Denis Dutton's concept of *performance value*. Your observation cuts to the heart of why museums exist as cultural institutions rather than interior design showrooms.

  Here is a reconstruction of the implicit theories driving your museum's practices, an analysis of what is strictly required versus contingent, and a projection of what would happen under strict aesthetic formalism.

  ### 1. The Implicit Theory: "Trace and Performance"

  The practices you describe presuppose a hybrid theory of value that combines **Causal-Historical Essentialism** with **Achievement Valuation**.

  **A. The Object as a Physical Trace (Causal-Historical)**
  The museum treats the artwork not merely as an arrangement of pigments, but as a physical record of a specific event in history: the moment the artist's hand touched the canvas.
  *   **The Theory:** The identity of the work is tied to its genesis. A painting by Rembrandt is physically constituted by the specific actions of Rembrandt.
  *   **The Practice:** When the landscape is downgraded to "Follower of," the physical object remains, but its *ontological status* changes. It is no longer a trace of the Master's mind; it is a trace of a student's mind. The value drop reflects the loss of that specific causal link.

  **B. The Object as a Certificate of Achievement (Performance Value)**
  We value art partly as a record of human difficulty and innovation overcome.
  *   **The Theory:** We admire the *feat* of creation. A Van Gogh is valuable not just because it looks like a Van Gogh, but because Van Gogh solved the problem of rendering light and emotion in that specific way, at that specific time, with that specific risk.
  *   **The Practice:** The trained copyist creates a visually identical object, but they have not solved the same artistic problem. They have solved a technical problem (replication), not an artistic one (innovation). Therefore, the "certificate of achievement" is void.

  **C. The Exception: The Roman Copy**
  Why is the Roman marble treasured? Because it satisfies a different clause of the theory: **Historical Witness.**
  *   It is not valued as a "fake Greek original." It is valued as the *best available access* to a lost cultural heritage. It has its own causal history (Roman craftsmanship) and serves a documentary function. It is an honest copy with historical age, whereas the Van Gogh duplicate is a deceptive copy with no historical gap.

  ### 2. Strict Requirements vs. Good Fits

  Which parts of your museum's behavior *require* this theory, and which are just economic side effects?

  **Strictly Requires the Theory:**
  *   **Relegation to Storage/Secondary Gallery:** This cannot be explained by economics alone. If value were purely aesthetic, the "Follower" painting (which looks the same) should remain on the main wall if it is visually striking. Moving it implies the museum's mission is to display *significant historical achievements*, not just beautiful objects. The curatorial hierarchy relies on the Causal-Historical theory.
  *   **The Labeling Distinction:** The insistence on labeling the Roman marble as a "Copy" while still displaying it prominently, versus hiding the "Follower" landscape, requires the **Honesty/Witness** clause. We value the Roman copy *because* we know it's a copy of a lost original. We devalue the landscape because it claims a lineage it doesn't possess.
  *   **Acquisition Policies:** If a donor offered the museum the "Follower" painting but claimed it was by the Master, you would reject it or demand a price adjustment even if it looked identical. This proves the institution values the *provenance* as part of the object's identity, not just its appearance.

  **Merely Fits Well (Contingent):**
  *   **The Price Collapse (1/20th value):** This is heavily influenced by market signaling and scarcity. While the *drop* in price requires the authenticity theory (otherwise price wouldn't move), the *magnitude* (1/20th) is economic signaling. It reflects collector desire for "trophies" (names) rather than a pure philosophical assessment of value.
  *   **Insurance Values:** Insurance is based on market replacement cost. Since the market operates on the Trace Theory, insurance does too. But if the market shifted, insurance would shift without changing the philosophical stance of the curators.

  ### 3. Philosophical Underdetermination

  Where do rival theories license the exact same behavior?

  *   **Day-to-Day Conservation:** Whether you believe in aesthetic formalism or causal-historical essentialism, you still keep the painting out of direct sunlight and control humidity. Both theories agree the object must survive; they just disagree on *why* it matters.
  *   **The "Cover Song" Exception:** You noted we accept cover versions of songs. This is where the practice is **not** underdetermined; it actually reveals a structural difference in the art forms.
      *   **Goodman's Distinction:** Music is *allographic*. A musical work is defined by a score (notation). Any performance that complies with the score *is* the work. Painting is *autographic*. There is no score; the history of production is part of the work's identity.
      *   **Underdetermination:** In literature, we don't care if a book is a first edition or a paperback to read it (aesthetic/content value), but we care immensely if we are collecting it (historical value). Your museum operates in the "collecting" mode for visual art, which collapses the distinction between reading and collecting.

  ### 4. The Thought Experiment: Strict Aesthetic Formalism

  If your museum replaced the implicit "Trace and Performance" theory with **Strict Aesthetic Formalism** (Value = Observable Properties Only), the institution would undergo a radical transformation. It would barely be recognizable as a museum in the modern sense.

  **Concrete Changes:**

  1.  **Deaccessioning and Re-hanging:**
      *   The "Follower of" landscape would likely return to the main gallery *if* it was in better condition or looked more impressive than the authenticated works.
      *   High-quality forgeries (like the Van Gogh duplicate) would be acquired and displayed alongside originals, provided they were labeled "Visually Equivalent to Van Gogh." The distinction between "original" and "copy" would vanish from the wall text, replaced by "Attributed to" or "Style of."

  2.  **Acquisition Policy:**
      *   Provenance research budgets would be slashed. Why spend money proving who painted it if the paint is what matters?
      *   The museum would start buying high-quality modern reproductions of lost masterpieces to fill gaps in the visual narrative, treating them with the same reverence as the Roman marble.

  3.  **Market and Insurance:**
      *   The art market would crash. Without the "certificate of achievement" (authenticity), scarcity vanishes. If a perfect copy is worth the same as the original, the incentive to own the original diminishes. Insurance would be based on the cost of commissioning a similar quality work, not auction records.

  4.  **Conservation:**
      *   Conservation would become restoration in the 19th-century sense. If a patch of paint is lost, a conservator could paint over it with a perfect aesthetic match. Under the Trace Theory, this is damaging the historical record (adding new paint). Under Formalism, it improves the aesthetic object.
      *   Overpainting would be acceptable if it improved the visual coherence.

  5.  **Educational Mission:**
      *   Docent tours would change from "Look at how Rembrandt struggled with this light" to "Look at how this light is rendered." The narrative of human genius and historical context would be replaced by a narrative of visual perception.
      *   The museum would become closer to a **design center** or a **gallery of decoration** than a repository of cultural heritage.

  ### Summary

  The practice of your museum presupposes that **art is a form of communication from a specific agent to a specific context.**

  When you downgrade the painting, you aren't saying the *image* is worse; you are saying the *communication* has changed. It is no longer a message from the Master; it is a message from a student. The Roman marble is treasured because it is a message from the Romans *about* the Greeks. The Van Gogh copy is worthless because it is a lie; it pretends to be a message from Van Gogh when it is a message from a copyist.

  If you switched to strict formalism, you would sever the link between the object and the human history that produced it. The museum would still house beautiful things, but it would cease to be a museum of *art history* and become a museum of *visual effects*. The price collapse and the relegation to storage are not just economic snobbery; they are the institutional enforcement of the belief that **who made it and why are part of what the object *is*.**
