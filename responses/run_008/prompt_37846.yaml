          *   What would happen if the museum adopted strict aesthetic formalism (value = observable properties)? Would anything change besides labels/prices?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *The "Follower" Case:* Value drops despite same look. Suggests value isn't just visual. Points to *provenance* and *authorship*.
      *   *The Roman Copy Case:* Copy is valued highly. Why? Because the original is lost. It's the best *access* we have to the lost original. It has historical significance.
      *   *The Van Gogh Forgery:* Worthless. Why? It's a lie. It doesn't connect to Van Gogh. It's deceptive.
      *   *Music Covers/Quotes:* We accept changes in medium or attribution in other domains. Why is visual art different? (Uniqueness vs. reproducibility).
      *   *Implicit Theories:*
          *   **Aura/Authenticity (Benjamin):** The "here and now" of the work.
          *   **Causal-Historical (Levinson/Danto):** The work is defined by its genesis.
          *   **Performance/Achievement:** We value the *act* of creation, not just the result.
          *   **Scarcity/Signaling (Economics):** Rarity drives price.
          *   **Institutional Theory (Dickie):** The artworld confers status.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's keen observation. Validate that this is a classic philosophical problem in aesthetics (the "forgery problem").
      *   **Reconstructing the Implicit Theory:** It's not just one thing. It's a hybrid.
          *   *Theory 1: Causal-Historical Connection (The "Trace" Theory).* The object is a physical record of a specific human performance.
          *   *Theory 2: Artistic Achievement (The "Feat" Theory).* We value the difficulty and genius of the specific act.
          *   *Theory 3: Historical Witness (The "Document" Theory).* The object tells us about a specific time/place/person.
      *   **Analyzing the Specific Cases:**
          *   *The Downgraded Landscape:* Fails Theory 1 & 2. It's not the Master's hand. It's a lesser feat.
          *   *The Roman Copy:* Passes Theory 3. It's the best witness to the lost Greek original. It has its own history (Roman craftsmanship).
          *   *The Van Gogh Forgery:* Fails Theory 1 (wrong cause), Fails Theory 2 (no feat of innovation, just replication), Fails Theory 3 (it lies about history).
      *   **Strict Requirements vs. Good Fits:**
          *   *Price Collapse:* Fits economic scarcity, but *requires* the Causal-Historical theory to explain why the *same* visual object loses value. If it were purely aesthetic, price wouldn't drop.
          *   *Relegation to Storage:* Requires the "Achievement" theory. The museum's mission is to show *significant* achievements. A follower is less significant.
          *   *Labeling:* Fits Institutional theory.
      *   **Philosophical Underdetermination:**
          *   Where do rival theories agree? Almost everywhere *except* the forgery/downgrade cases. Most day-to-day curation works under multiple theories simultaneously. The "Cover Song" exception is interesting—music is allographic (notation-based), painting is autographic (goodman). This explains the difference.
      *   **The Thought Experiment: Strict Aesthetic Formalism:**
          *   If value = only what you see.
          *   *Labels:* Would change drastically ("School of" becomes irrelevant).
          *   *Prices:* Would equalize based on beauty/condition, not name. Market crashes.
          *   *Display:* The "Follower" painting might go *back* to the main wall if it looks better than the "Master."
          *   *Acquisition:* Museums would stop caring about provenance.
          *   *Conservation:* Would focus only on visual stability, not material authenticity.
          *   *Institutional Impact:* Huge. The museum becomes a gallery of pretty things, not a repository of history/culture.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to make sure I distinguish between *ontological* status (what the work *is*) and *axiological* status (what the work is *worth*). The user asks about value, but the practices imply an ontology.
      *   *Nuance:* The Roman Copy case is tricky. It's valued *as* a copy. A Van Gogh copy is valued *as* a fake. The difference is *transparency* and *historical gap*. The Roman copy isn't trying to trick us; it's bridging a gap. The Van Gogh copy is trying to trick us.
      *   *Nelson Goodman:* Must mention *Languages of Art*. Autographic vs. Allographic arts. This explains the music vs. painting distinction the user raised.
      *   *Denis Dutton:* *The Art Instinct*. Performance value.
