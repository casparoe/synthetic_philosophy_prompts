  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between the Roman Copy (honest copy, historical bridge) and the Van Gogh (deceptive copy, no historical bridge) is clear. (The Roman copy has *its own* history as a Roman object; the Van Gogh forgery has a history of deception).

