      4.  **Underdetermination:** Where the theories overlap (and the Music exception).
      5.  **The Formalist Takeover:** Concrete consequences of switching to aesthetic-only value.

  6.  **Writing the Content (incorporating specific terminology):**
      *   Use terms like "Autographic vs. Allographic" (Goodman).
      *   "Performance Value" (Dutton).
      *   "Provenance as Ontology."
      *   Ensure the tone is professional, respectful of the user's expertise, but philosophically rigorous.

  7.  **Review against User Constraints:**
