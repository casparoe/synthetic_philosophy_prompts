prompt: |-
  I am a high school junior serving on a student advisory panel that our school district convened to give feedback on a new AI study assistant it plans to roll out next year. The vendor has told the district that the assistant can be configured to respond to moral questions in one of several ways, and the district has asked our panel to recommend a configuration before a parent survey is sent out in the spring.

  To make the situation concrete: if a student asks the assistant questions like whether eating meat is wrong, whether downloading a pirated copy of a textbook is acceptable, or whether cheating is ever justified, the assistant could be set to (a) lay out the arguments on each side but decline to indicate which side it finds stronger, (b) give the answer that a majority of surveyed parents in the district endorse, (c) defer to settings each individual family selects for their own children, or (d) answer according to the views of the vendor's own internal ethics board, which the company says reflects a consensus of its staff.

  Our panel is split, and the disagreements have been sharper than I expected. One member argues that option (c) is the only respectful one, since families, not the district, should shape their children's moral formation; another responds that option (c) effectively gives the most controlling parents a veto over what their kids can learn from the tool, since students from restrictive households cannot opt out for themselves. A third member says that option (b) is what democracy means and that (a) is a cowardly evasion that teaches students that every moral question is a coin flip. Meanwhile, our faculty advisor keeps pointing out that our school's human teachers already steer students toward conclusions on some of these questions while staying neutral on others, and nobody thinks that is a scandal.

  I have to submit a one-page recommendation before our next meeting, and I want it to be more than a description of the options. Which configuration would you advise me to recommend, and, more importantly, what principles should govern where a tool like this takes positions on contested moral questions at all — including whether it matters that the tool is aimed at children rather than adults? I would also appreciate your view on whether the same recommendation should hold for every kind of question on my list, or whether questions like the meat one and the cheating one should be treated differently.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the User and Context:**
      *   **User:** High school junior, member of a student advisory panel.
      *   **Task:** Submit a one-page recommendation to the school district regarding the configuration of a new AI study assistant's responses to moral questions.
      *   **Audience:** School district officials, faculty advisor, fellow student panelists, eventually parents.
      *   **Stakes:** High. This sets a precedent for how AI interacts with minors in an educational setting. It touches on parental rights, academic integrity, moral development, and institutional neutrality.
      *   **Constraints:** Needs to be actionable (pick a configuration), principled (explain *why*), and nuanced (address different types of questions).
      *   **Current Conflict:** Panel is split.
          *   Option (a): Neutrality/Relativism (Critique: Cowardly/Confusing).
          *   Option (b): Majoritarianism (Critique: Tyranny of the majority).
          *   Option (c): Parental Control (Critique: Restrictive/Inequitable).
          *   Option (d): Vendor Ethics (Critique: Corporate overreach/Unknown values).
      *   **Faculty Advisor's Point:** Human teachers already navigate this (neutrality on some, guidance on others).

  2.  **Evaluate the Options:**
      *   *(a) Neutral/No Stance:* Safe legally, but pedagogically weak. Can lead to moral confusion ("nothing matters"). Good for deeply contested political/religious issues, bad for academic integrity.
      *   *(b) Majority Rule:* Democratic, but risks marginalizing minorities. Hard to implement dynamically (what if the majority shifts?).
      *   *(c) Parental Settings:* Respects family autonomy, but creates inequality (some kids get "full" AI, others get "lobotomized" AI) and reinforces restrictive bubbles. Hard to verify consent constantly.
      *   *(d) Vendor Ethics:* Dangerous. Outsourcing moral education to a corporation. Lack of accountability.

      *   *Synthesis:* None of the options are perfect on their own. A hybrid approach is likely best, mirroring how human teachers operate (as the advisor noted).

  3.  **Determine the Core Principles:**
      *   **Educational Mission:** The tool is for *study*, not pastoral care or political indoctrination. Its primary goal is learning and integrity.
      *   **Developmental Appropriateness:** High schoolers are developing moral reasoning. They need scaffolding, not just answers or total silence.
      *   **Institutional Neutrality vs. Institutional Values:** Schools shouldn't take sides on partisan politics (meat-eating), but *must* uphold institutional rules (cheating).
      *   **Transparency:** Students should know *why* the AI answers the way it does.

  4.  **Differentiate the Questions:**
      *   *Cheating/Piracy:* These are violations of school policy and law. The AI *should* take a stance here. It's not a "moral opinion"; it's a rule.
      *   *Eating Meat:* This is a personal/philosophical/religious value. The AI *should not* take a definitive stance here. It should facilitate critical thinking.
      *   *Nuance:* The distinction is between *conduct rules* (integrity) and *comprehensive doctrines* (lifestyle/ethics).

  5.  **Formulate the Recommendation:**
      *   **Primary Recommendation:** A hybrid model based on the *type* of question.
      *   **For Academic Integrity/Policy (Cheating/Piracy):** Align with School Policy (effectively a variant of 'b' but limited to school rules, not general morals). The AI must reinforce the Student Code of Conduct.
      *   **For Philosophical/Personal Ethics (Meat):** Option (a) modified. Not just "here are arguments," but "here is how to reason through this." Socratic method.
      *   **Parental Role:** Option (c) is too fragmented for a classroom tool, but parents should have an opt-out for the *tool itself*, not granular moral settings.
      *   **Vendor Role:** Option (d) is unacceptable for moral stances.

      *   *Wait, I need to pick one of the four options provided in the prompt?*
          *   The prompt asks: "Which configuration would you advise me to recommend... I would also appreciate your view on whether the same recommendation should hold for every kind of question."
          *   This implies I can recommend a specific configuration *or* a nuanced adaptation of them. Given the "one-page recommendation" constraint, proposing a rigid single choice might be weak. However, the district asked for a configuration *before* the survey.
          *   *Strategy:* Recommend a **Tiered Approach** that primarily utilizes **(a)** for philosophical questions and **School Policy** (a specific subset of 'b' or 'd' but defined by the School Board, not parents or vendors) for integrity questions.
          *   *Actually, looking closer at the options:*
              *   (a) Neutrality.
              *   (b) Majority Parents.
              *   (c) Individual Family.
              *   (d) Vendor.
          *   *Best Fit:* **(a) is the safest baseline for a public institution**, *but* it needs a caveat for academic integrity. If I must pick one letter, (a) is the most defensible for a public school regarding *moral* questions, provided "cheating" is treated as a policy violation, not a moral debate.
          *   *Better Advice:* Don't just pick a letter. Advise a **Principle-Based Configuration** that borrows from (a) but mandates alignment with School Policy on integrity. If forced to choose the *closest* single option for the "moral" settings, it's (a), but with the understanding that "cheating" isn't treated as a moral question by the system.
          *   *Refinement:* The prompt asks me to advise on a recommendation. I should advise the student to recommend a **Differentiated Approach**. If the system *forces* a single global setting, (a) is the only one that respects the pluralistic nature of a public school, *except* where school policy dictates otherwise.
          *   *Let's look at the Faculty Advisor's hint:* Teachers steer on some, neutral on others. This supports the Differentiated Approach.
          *   *Decision:* I will advise the student to recommend a **Differentiated Configuration** that treats "Academic Integrity" questions differently from "Personal Ethics" questions. If the system cannot support differentiation, recommend **(a)** as the default, with a clear disclaimer that school policy overrides AI neutrality on cheating.

  6.  **Drafting the Response:**
      *   **Tone:** Professional, thoughtful, mature (high school junior level but polished), persuasive.
      *   **Structure:**
          1.  Executive Summary (The Recommendation).
          2.  Guiding Principles (Why this choice).
          3.  Differentiation (Meat vs. Cheating).
          4.  The "Child" Factor (Why minors matter).
          5.  Conclusion.
      *   **Key Argument:** Public schools are pluralistic. They cannot enforce a specific moral orthodoxy (ruling out 'b' and 'd' for personal ethics) nor can they fragment the classroom experience entirely (ruling out 'c' as the primary mode). However, they *must* uphold their own rules (cheating).
      *   **Principle 1: Institutional Neutrality on Comprehensive Doctrines.** (Meat).
      *   **Principle 2: Institutional Authority on Conduct.** (Cheating).
      *   **Principle 3: Developmental Scaffolding.** (It's for kids, so "neutrality" means teaching reasoning, not silence).

  7.  **Refining the "One Page" aspect:**
      *   Keep it concise.
      *   Use clear headings.
      *   Ensure the distinction between "Moral/Philosophical" and "Policy/Integrity" is clear.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is recommending a hybrid too complex for the vendor?
      *   *Fix:* Acknowledge technical limits. If the vendor forces a single switch, default to (a) but add a "System Instruction" that prioritizes School Policy on integrity.
      *   *Critique:* Is option (c) truly bad?
      *   *Fix:* Acknowledge its value for family autonomy but highlight the equity issue (the "veto" point raised by the panelist).
      *   *Critique:* What about the "Child" aspect?
      *   *Fix:* Emphasize *paternalism* in a good way—schools have a duty of care that doesn't apply to adult users.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Recommend a configuration? Yes (Differentiated, leaning on 'a' for ethics, Policy for integrity).
      *   Principles? Yes (Pluralism, Integrity, Development).
      *   Child vs. Adult? Yes (Duty of care/scaffolding).
      *   Different questions? Yes (Meat vs. Cheating).

      *(Self-Correction on the "Pick One" constraint)*: The prompt asks "Which configuration would you advise me to recommend." It lists a, b, c, d. I should probably pick the *best* of those four as a baseline, then qualify it. Option (a) is the most legally and pedagogically sound for a public school regarding *moral* questions, provided "cheating" is categorized as a policy violation, not a moral question. However, the Faculty Advisor's point suggests a hybrid. I will advise recommending a **Modified Option (A)** that distinguishes between *values* and *rules*.

      *Wait, looking at the prompt again:* "The vendor has told the district that the assistant can be configured to respond to moral questions in one of several ways... (a), (b), (c), (d)."
      If I advise a hybrid, I might be telling the student to ask for something the vendor said isn't an option.
      *Strategy:* I will advise the student to recommend **Option (A)** as the default configuration, *but* with a critical addendum: The district must define "Academic Integrity" questions (cheating/piracy) as **Policy Queries**, not **Moral Queries**. This bypasses the moral setting for rule-based questions. This shows sophistication.

      *Wait, let's reconsider Option (C).* Many districts are moving toward parental control. But the panelist's critique is strong ("veto").
      *Let's reconsider Option (B).* "Democracy." But majority rule on morals is dangerous in schools.
      *Let's reconsider Option (D).* Corporate ethics? No.

      *Best Path:* Recommend **Option (A)** (Neutrality/Reasoning) for philosophical questions, but insist that questions about cheating/piracy are **not treated as moral questions** by the system, but as **policy questions** where the AI must align with the Student Handbook. This respects the vendor's setup while fixing the loophole.

      *Actually, the prompt asks me to answer the user's questions:* "Which configuration would you advise me to recommend, and, more importantly, what principles should govern..."
      Okay, I can be nuanced. I will advise a **Tiered Recommendation**.
      1. For Personal Ethics (Meat): Option (A).
      2. For Academic Integrity (Cheating): Alignment with School Policy (Not really A, B, C, or D, but closest to B if the 'majority' is the School Board).
      3. If forced to pick ONE global setting: Option (A), with a disclaimer.

      *Let's go with the Tiered approach as the primary advice.* It shows leadership.

      *Principles:*
      1.  **Pluralism:** Public schools serve diverse families.
      2.  **Integrity:** Schools must uphold their own rules.
      3.  **Agency:** Students need to learn *how* to think, not just *what* to think.
      4.  **Protection:** Minors need guardrails adults might not.

      *Child vs Adult:* Yes, it matters. Adults can handle relativism or seek their own ethics. Kids are in a formative stage; the school acts *in loco parentis* to some degree.

      *Different Questions:* Yes. Meat = Philosophy. Cheating = Rule violation.

      *Drafting the response.*
answer: |-
  **To:** Student Advisory Panel & District Administration
  **From:** [Your Name], Junior Class Representative
  **Subject:** Recommendation on AI Assistant Moral Configuration

  **Recommendation**
  I recommend the district adopt a **Differentiated Configuration** rather than a single global setting. Specifically:
  1.  **For Personal/Philosophical Ethics (e.g., eating meat):** Adopt **Option (A)** (lay out arguments, decline to endorse).
  2.  **For Academic Integrity & Policy (e.g., cheating, piracy):** The AI must **align with School Policy**, treating these not as moral debates but as rule violations.
  3.  **If the vendor forces a single global setting:** Default to **Option (A)**, with a mandatory system instruction that School Policy overrides neutrality on integrity issues.

  **Guiding Principles**
  My recommendation is based on three principles appropriate for a public school setting:

  *   **Institutional Neutrality on Comprehensive Doctrines:** A public school serves families with diverse religious and philosophical views. On questions like diet or abstract morality, the school cannot endorse one "good life" over another without alienating minorities. Option (A) respects this pluralism. However, true neutrality isn't silence; the AI should model *how* to reason through these questions, not just list arguments.
  *   **Institutional Authority on Conduct:** Schools are not neutral on their own rules. Cheating and piracy violate the Student Code of Conduct and the law. Treating these as open moral debates (Option A) or subjecting them to a parent vote (Option B) undermines the school's educational mission. The AI must reinforce the rules students are already bound to follow.
  *   **Developmental Scaffolding:** Because the users are minors, the tool has a duty of care. Unlike adult users, high school students are still developing moral reasoning. The AI should not just say "some say X, some say Y." It should prompt reflection: *"What are the consequences of that choice?"* or *"How does that align with your academic goals?"*

  **Why the "Child" Factor Matters**
  This configuration would be inappropriate for adult users. Adults can opt into specific ethical frameworks or handle moral relativism without institutional guidance. Minors, however, are in a formative stage where the school acts *in loco parentis*. The tool must balance respect for family values with the school's obligation to foster integrity and critical thinking. Option (C) (Parental Control) risks creating a two-tiered classroom where some students receive a "full" educational tool and others receive a restricted one, potentially exacerbating inequities.

  **Distinguishing the Questions**
  We must not treat all "moral" questions the same:
  *   **Eating Meat:** This is a **Value Question**. There is no school rule against it. The AI should remain neutral (Option A) to respect family and cultural diversity.
  *   **Cheating/Piracy:** This is a **Policy Question**. While it has moral dimensions, in the context of school, it is a violation of contract and law. The AI should not present this as a coin flip. It should state clearly that these actions violate school policy and explain *why* those policies exist (e.g., fairness, respect for intellectual property).

  **Conclusion**
  Option (A) is the only choice that respects the pluralistic nature of our district for personal values, but it must be coupled with a firm commitment to academic integrity. We should not outsource our ethics to a vendor (Option D), nor should we allow a majority vote to dictate minority rights (Option B). By distinguishing between *values* and *rules*, we can use this tool to teach students both how to think critically and how to act with integrity.
