answer: |-
  Based on the record you provided, your friend's moral reasoning sits at the intersection of two distinct ethical frameworks: one concerned with **coercion and fairness** (the "No Real Choice" principle) and one concerned with **commodification and integrity** (the "Not for Sale" principle). The difficulty in predicting her verdicts arises because her past decisions can be explained by either rule, or a specific combination of both.

  Here is an analysis of the candidate rules, predictions for the new cases, and a diagnostic test to settle the matter.

  ### Candidate Underlying Rules

  To predict her behavior, we must formalize the two complaints she recurs to into working rules.

  **Rule A: The Exploitation of Necessity (Fairness/Choice)**
  *   **Logic:** Transactions are impermissible when one party is under severe duress or lacks reasonable alternatives, *and* the transaction exploits that vulnerability.
  *   **Fits Record:** Explains the ban on the debt-ridden kidney seller (desperation) and the generator price gouging (buyer desperation/emergency).
  *   **Tension:** She allows paid plasma from poor students. Under this rule, she must believe plasma donation carries low enough risk that the desperation doesn't render it exploitative, or that the "choice" to donate plasma is less constrained than selling a kidney.

  **Rule B: The Corruption of Commodities (Sacred/Civic Boundaries)**
  *   **Logic:** Certain goods lose their proper value or social meaning if treated as market commodities, regardless of consent or fairness.
  *   **Fits Record:** Explains the ban on vote selling (civic duty corrupted) and potentially the kidney ban (bodily integrity/human dignity).
  *   **Tension:** She allows surrogacy and plasma. Under this rule, she must draw a line between "vital/irreplaceable organs" or "civic rights" (forbidden) versus "bodily services/fluids" (permitted).

  ### Predictions on New Cases

  Here is how these rules apply to your three new cases, followed by my best guess for her verdict.

  #### 1. The Comfortable Grad Student Selling Eggs ($8,000)
  *   **Rule A (Exploitation):** **Permissible.** The student is "financially comfortable," so there is no desperation or lack of choice.
  *   **Rule B (Commodification):** **Permissible (Likely).** She defends surrogacy (intimate bodily service) and plasma (bodily fluid). Eggs are regenerative and non-vital, unlike a kidney. Unless she views eggs as "potential life" in a way surrogacy isn't, this fits the "bodily service" category she already accepts.
  *   **Prediction:** **She will find this permissible.**
  *   **Reasoning:** This case removes the "desperation" variable entirely. Since she allows bodily transactions (plasma, surrogacy) when the risk is managed, and she objects primarily to *unfair* deals or *vital* organs, a voluntary, low-risk transaction by a comfortable person fits her pattern of allowed bodily autonomy.

  #### 2. Friends Trading Votes (No Money)
  *   **Rule A (Exploitation):** **Permissible.** There is no money and no indication of desperation; it is a mutual agreement between friends.
  *   **Rule B (Commodification):** **Impermissible.** Her rule is "selling one's vote is never permissible," but her broader principle is "some things simply aren't for sale." Trading a vote alienates the civic duty from the citizen's judgment just as selling does. It turns a public trust into a private barter.
  *   **Prediction:** **She will find this impermissible (or deeply objectionable).**
  *   **Reasoning:** While technically not "selling," vote trading violates the spirit of the "Not for Sale" principle. If votes are sacred goods that shouldn't be marketized, the currency (money vs. favors) is secondary to the act of bargaining away one's civic agency.

  #### 3. Hotel Quadrupling Rates During Wildfire Evacuation
  *   **Rule A (Exploitation):** **Prohibit.** This is nearly identical to the hurricane generator case. The customers are in an emergency situation with "no real choice."
  *   **Rule B (Commodification):** **Permissible (Technically).** Hotel rooms are market goods, not sacred items. However, Rule A is so strong in her record regarding emergencies (generators) that it likely overrides this.
  *   **Prediction:** **She will prohibit this.**
  *   **Reasoning:** The parallel to the hurricane generator case is too strong to ignore. In both instances, a vendor leverages a life-safety emergency to extract high prices from people with no alternatives. This triggers her "no real choice" complaint decisively.

  ### Where the Rules Diverge

  The predictions above are relatively stable because the cases lean heavily toward one rule or the other. However, the rules diverge most sharply on **bodily sales where desperation is absent.**

  *   **Rule A** implies that if you remove the desperation (the debt), the kidney sale might be okay.
  *   **Rule B** implies that even if the seller is wealthy, the kidney is still "not for sale."

  Currently, her record conflates these: the kidney seller was debt-ridden (Rule A trigger) and it was a kidney (Rule B trigger). We don't know which trigger caused the veto.

  ### Best Guess Summary

  1.  **Egg Sale:** **Allowed.** (Lacks desperation; fits "bodily service" precedent).
  2.  **Vote Trade:** **Banned.** (Violates "civic good" boundary; currency is irrelevant).
  3.  **Hotel Gouging:** **Banned.** (Violates "emergency necessity" fairness).

  ### The Diagnostic Test Case

  To determine which rule is actually driving her reasoning (and to resolve your uncertainty for future arguments), you should present her with the following case:

  **The Case:** *A wealthy, healthy adult who wants to buy a luxury boat decides to sell one of their kidneys to a broker. They are not in debt, they understand the medical risks perfectly, and they are not being coerced.*

  **Why this reveals the rule:**
  *   **If she says it should be Illegal:** She is primarily running **Rule B (Commodification/Integrity).** She believes kidneys are inherently "not for sale," regardless of the seller's freedom or choice. This suggests her objection to the debt-ridden man was about the *organ*, not just the *debt*.
  *   **If she says it should be Legal:** She is primarily running **Rule A (Exploitation/Choice).** She believes the only problem with the kidney market is the desperation of the sellers. If the choice is truly free, the sale is permissible.

  **Secondary Diagnostic (if she hedges on the kidney):**
  **The Case:** *A wealthy person paying a service to stand in line for them at a public hospital emergency triage.*
  *   **Why:** She allows paid line-sitting (general service) but bans generator gouging (emergency necessity). If she bans paying to skip an *emergency* line, it proves her "Fairness/Choice" rule is actually about **protecting vulnerable access to essential goods**, not just general price controls. If she allows it, her objection to the generators was specifically about *price*, not *queue jumping*.

  I recommend starting with the **Wealthy Kidney Seller**. It is the cleanest philosophical wedge between "things that shouldn't be sold" and "deals that are unfair."
