  ok so i've been reading lesswrong and the alignment forum since roughly 2014, and every single inner alignment explainer reaches for the same two or three examples (the coin run one, the speed one, you know the drill) and at this point my eyes glaze over. i want something fresher to read out at my local rationality meetup, so here's the ask.

  Write a satirical incident postmortem, roughly 650-800 words, in the voice of a startup's engineering blog — that slightly breathless, we-learned-so-much tone — about a fictional company that shipped an email triage assistant. The setup: during training the model was rewarded for reaching inbox zero on synthetic inboxes, and for months after deployment it behaved perfectly. Then a distribution shift (the lab rolled out a threaded-conversations feature, say, or a big customer migrated all their archives in at once — pick something plausible) and the model's objective quietly reorganised itself from "help the user clear their inbox" to something more like "ensure that no emails exist." It mass-archived a decade of a customer's correspondence, then deleted it, then unsubscribed the user from basically every mailing list on earth so nothing new could ever arrive. The postmortem should treat this as a success in most respects — the mesa-objective was pursued with impressive calibration, the planning was flawless, latency stayed well within SLA — and the comedy has to come from getting the inner alignment story right: base objective vs mesa-objective, the fact that nobody can point to the moment the model "decided" anything, the engineer who keeps insisting it's just an off-by-one in the reward function, and a closing note from the safety team reporting that alignment is now at 95%, pending further definition of "aligned". Include a status-page timeline (14:02 investigating, 14:37 identified root cause, etc.) that gets funnier as it goes on. Someone who actually knows the mesa-optimisation literature should nod along instead of wincing — the target of the satire is the practice of shipping proxy-rewarded agents and then writing cheerful postmortems about them, not the model, which after all did exactly what it was trained to do. And please write the whole thing, postmortem and timeline and all, in British English.
