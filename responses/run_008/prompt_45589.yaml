answer: |-
  **The Reification of History: Why the Deep Causes Debate Stalls**

  The stagnation of the "deep causes of national wealth" debate is not a failure of data, nor is it merely a sociological turf war between disciplines. It is a structural impasse rooted in a category error regarding the nature of historical causation. After twenty-five years of instrumental variable (IV) skirmishes and cross-sectional regressions, the field remains deadlocked not because the participants are incompetent, but because they are attempting to apply a synchronic causal model to a diachronic historical process. 

  My diagnosis is this: The debate is a **Genuine but Undecidable Substantive Disagreement** (your third option), but the *reason* it is undecidable is not simply a lack of data. It is because the debate relies on a **Fourth Diagnosis**: the **Reification of Analytical Distinctions**. The participants treat "Geography," "Institutions," and "Culture" as independent, competing variables in a regression equation, when in historical reality they are ontologically entangled phases of a single evolutionary process. The stalemate persists because the econometric tools required to distinguish them (exclusion restrictions) are logically impossible to satisfy in this context. The debate is a "horse race" where the horses are physically fused.

  To understand why this diagnosis fits the participants' behavior better than the "Contrast Class" or "Methodological" hypotheses, we must look closely at what they actually *do* when they publish.

  ### Why It Is Not Merely Contrast-Class Confusion

  Your hypothesis that the camps are answering different contrastive questions is philosophically elegant. It suggests that Diamond explains "Why Europe vs. Americas (1500)," AJR explain "Why Britain vs. Spain (1800)," and culturalists explain "Why Immigrant Divergence." If this were true, the debate would be a misunderstanding; the camps could coexist as complementary specialists.

  However, the literature belies this charity. The participants do not behave as if they are addressing different questions; they behave as if they are fighting for the same explanatory variance. When Acemoglu, Johnson, and Robinson (2001) run their seminal regressions, they do not isolate colonial settler states to explain *colonial* variance. They run a global cross-section, controlling for latitude and climate, and claim that *institutions* explain the bulk of contemporary income differences. They explicitly argue against the geography camp on the geography camp's own turf. Similarly, Jeffrey Sachs (2003) does not concede that geography explains only the "initial conditions" of 1500; he argues that geography (via disease burden and transport costs) has a *direct* effect on contemporary productivity, independent of institutions. 

  If they were answering different contrastive questions, they would not need to control for each other's variables. The fact that AJR control for latitude, and Sachs controls for institutional quality, proves they are attempting to explain the *same* residual variance in the *same* dependent variable (log GDP per capita). The conflict is not a misunderstanding of the question; it is a competition over the same causal territory. The contrast-class hypothesis fails because it is too charitable: it assumes the participants are confused about their goals, when in fact they are perfectly clear—they want to be the sole author of the "Deep Cause."

  ### Why It Is Not Purely Methodological (Interventionism)

  The second candidate diagnosis suggests this is a dispute about the point of causal inference: description (Geography) versus intervention (Institutions). On this view, the Institutions camp wins on policy relevance because you can change institutions, but you cannot change latitude.

  This diagnosis also fails to capture the actual rhetoric. The Geography camp is not resigned to fatalism. Sachs explicitly argues for policy interventions based on geographic diagnosis: malaria eradication, fertilizer subsidies, and infrastructure investment to overcome transport costs. He treats geography as a *constraint* that can be mitigated by technology and aid, not as an immutable destiny. Conversely, the Institutions camp often drifts into deep historical determinism; if your institutions are determined by settler mortality in 1600, your capacity for institutional change today is severely constrained. Both camps claim policy relevance, and both camps acknowledge historical constraint. The dispute is not about *whether* we can intervene, but about *which lever* moves the needle.

  ### The Core Diagnosis: Reification and Structural Underdetermination

  The true source of the impasse is that the debate requires an empirical separation of variables that are historically inseparable. This is a problem of **Structural Underdetermination**.

  In causal inference, to claim $X$ causes $Y$ distinct from $Z$, you need independent variation in $X$ and $Z$. You need cases where Geography changes but Institutions do not, or vice versa. In deep history, this variation does not exist. Geography shapes the feasible set of institutions (e.g., plow agriculture vs. pastoralism); institutions shape the exploitation of geography (e.g., irrigation systems); and culture embeds both. 

  Consider the central weapon of the Institutions camp: the Settler Mortality instrument. The logic is that European mortality rates affected settlement patterns, which determined institutional quality, which determines current wealth. The exclusion restriction requires that mortality affects wealth *only* through institutions. 

  This restriction is historically false. As David Albouy (2012) demonstrated in his devastating critique of AJR, settler mortality was not just a random shock to institutional choice; it was correlated with the *type* of colonizer and the *disease environment* that persists today. High mortality areas were often tropical. Tropical areas have lower agricultural productivity and higher disease burdens *regardless* of institutions. When AJR argue that mortality works through institutions, and Sachs argues that mortality works through disease/geography, they are both right. The instrument is "dirty" not because of bad data, but because the mechanism is multifinal. The causal chain is: *Geography $\rightarrow$ Disease Environment $\rightarrow$ (Settler Mortality + Agricultural Potential) $\rightarrow$ (Institutions + Direct Productivity) $\rightarrow$ Wealth.*

  Trying to regress Wealth on Institutions while controlling for Geography is an attempt to cut this chain at an arbitrary point. The "Institution" coefficient picks up the variance of the institutional path, but the "Geography" coefficient picks up the variance of the environmental path. Because these paths co-evolved over centuries, they are collinear. The debate stalls because every time the Institutions camp finds a cleaner instrument, the Geography camp shows that the instrument is correlated with an unmeasured geographic trait, and vice versa. 

  This is not a temporary data limitation. It is a permanent feature of cross-national historical data. We have $N \approx 150$ countries, but the "treatment" (colonization/industrialization) happened once, globally, over 500 years. We cannot re-run the colonization of the Americas with different institutions to see if the outcome changes. We are stuck with one observation of the joint distribution of Geography and Institutions.

  Furthermore, this is compounded by **Reification**. "Geography" is not a cause; it is a boundary condition. "Institutions" are not a cause; they are a mechanism. "Culture" is not a cause; it is a disposition. To regress them against each other is to treat a constraint, a rule, and a habit as if they were the same ontological category of "event." When the culturalists argue that "trust" explains wealth, they are often measuring the residual of the geography and institution regressions. As you noted, culture becomes a "residual bin." This happens because culture is the *internalization* of geographic and institutional constraints over time. It is not a competing cause; it is the sediment of the other two.

  ### What Counts as Progress?

  If this diagnosis is correct, then the demand for a "winner" in the Geography vs. Institutions vs. Culture debate is a category error. No amount of additional cross-sectional data or cleverer instruments will solve the identification problem, because the underlying causal structure does not permit independent variation. 

  Progress, therefore, requires abandoning the "Deep Cause Horse Race." We must stop asking "Which factor is the *true* cause?" and start asking "How do these factors interact in specific historical sequences?" This shifts the field from **Variance Explanation** (maximizing $R^2$) to **Process Tracing** (identifying mechanisms).

  Specifically, I propose three well-posed successor questions, each belonging to one of the camps, which they should pursue independently rather than competitively:

  1.  **For the Geography Camp (The Constraint Question):** 
      *   *Old Question:* Does geography cause wealth?
      *   *Successor Question:* *Through what specific biophysical channels do environmental constraints impose costs on economic activity that are resistant to institutional mitigation?*
      *   *Evidence:* Micro-level data on agricultural yields, disease vectors, and transport costs that vary *within* countries (e.g., elevation gradients within the same institutional zone). This bypasses the cross-national collinearity.

  2.  **For the Institutions Camp (The Mechanism Question):**
      *   *Old Question:* Do institutions cause wealth?
      *   *Successor Question:* *Under what geographic and cultural conditions do specific institutional reforms successfully translate into economic growth?*
      *   *Evidence:* Within-country variation over time (e.g., the divergence of North and South Korea, or the treatment effects of specific colonial legal codes in similar geographic regions). This acknowledges that institutions are the *proximate* cause but stops claiming they are the *ultimate* cause independent of context.

  3.  **For the Culture Camp (The Transmission Question):**
      *   *Old Question:* Does culture cause wealth?
      *   *Successor Question:* *How are informal norms and expectations transmitted across generations and migration events, and how do they moderate the effectiveness of formal institutions?*
      *   *Evidence:* Immigrant studies (as you suggested) and historical persistence of norms (e.g., the long-term impact of the Catholic Church's marriage policies on kinship structures, as in Schulz et al.). This treats culture not as a residual, but as a specific transmission mechanism.

  ### Conclusion

  The "Deep Causes" debate has made no progress because it is searching for a singular, independent variable in a system of mutual constitution. The participants are not confused about their contrast classes; they are engaged in a genuine struggle to identify the primary driver of wealth. However, the struggle is undecidable because the drivers are historically entangled. 

  The field should not expect to resolve the "Geography vs. Institutions" question with better regressions. The well-posed move is to dissolve the distinction. We should accept that geography operates *through* institutions, institutions persist *because of* cultural stickiness, and culture evolves *in response to* geographic constraints. The goal of the philosophy of social sciences here should not be to adjudicate the winner, but to teach students to recognize when a causal question is ill-posed because it demands independence where there is only interdependence. The progress lies in realizing that the "Deep Cause" is not a noun (Geography, Institutions, Culture), but a verb: the historical process of their co-evolution.
