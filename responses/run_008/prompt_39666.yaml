answer: |-
  Your intuitions map onto a distinction that decision theory often obscures: the difference between violations that track **substantive features of the world** (value, information, ambiguity) and those that track **cognitive processing errors** (framing, myopia, inconsistency). The principle that best unifies your verdicts is what I will call the **Principle of Reflective Feature-Tracking**.

  ### The Principle
  A violation of standard decision-theoretic axioms (like Independence or Sure-Thing) is rational if and only if it persists under full reflection as a tracking of the options' intrinsic outcome values or agent-relative information structures, rather than arising from cognitive artifacts of description, dynamic sequencing, or scale-insensitive heuristics.

  ### Application to Your Cases

  **1. The Classic Allais (High Stakes): Permissible.**
  *   **Clause:** *Tracking intrinsic outcome values.*
  *   **Motivation:** At the level of \$1 million, "certainty" is not just a probability; it is a substantive life-state (security, retirement, safety). A preference for this state over a marginal increase in expected value reflects a legitimate, concave utility function or a terminal value placed on security. This survives reflection as a valuation of the *outcome*, not the *description*.

  **2. The Scaled-Down Allais (Low Stakes): Irrational.**
  *   **Clause:** *Scale-insensitive heuristics.*
  *   **Motivation:** Applying the same "certainty premium" to \$10 as to \$1 million suggests a cognitive shortcut (the certainty effect) rather than a reasoned valuation. Since \$10 does not alter your life-state, the intense preference for certainty is disproportionate to the outcome's intrinsic value. It is a heuristic misfiring at a scale where security is not a salient feature.

  **3. The Money Pump: Irrational.**
  *   **Clause:** *Dynamic sequencing artifacts.*
  *   **Motivation:** Here, the violation leads to a cycle where the agent ends up worse off than if they had started. This is not tracking a value; it is a failure of dynamic consistency. The agent is reacting to the *sequence of offers* rather than the *final state*, which is a processing error.

  **4. Ambiguity & Evidential Betting: Rational.**
  *   **Clause:** *Agent-relative information structures.*
  *   **Motivation:** In the Ellsberg urn, the agent values "known risk" over "unknown risk." In the evidential coin case, the act of betting changes the probability assessment (accepting signals a biased coin). In both cases, the agent is responding to the *informational content* of the situation. While an omniscient bookie could exploit the evidential bettor, the agent is maximizing expected utility relative to their own epistemic state. The violation tracks a real feature of their knowledge, not a glitch.

  **5. Preference Reversal: Irrational.**
  *   **Clause:** *Cognitive artifacts of description.*
  *   **Motivation:** Choosing A over B but pricing B higher indicates that the "choice" mode and "pricing" mode trigger different cognitive processes that do not align with a stable underlying value. This is a classic artifact of how the question is asked, not a reflection of the options' intrinsic worth.

  ### The Framing Case (Wealth vs. Gains)
  You asked whether a person whose Allais preference vanishes when options are framed as total wealth rather than gains is irrational or merely sensitive to framing.

  **Verdict:** Under this principle, the original preference is **irrational**.
  **Reasoning:** If a preference disappears when the description changes from "gains" to "total wealth" (while the final outcome states remain identical), the preference was tracking the *frame*, not the *intrinsic outcome*. Rational valuations should attach to states of the world (wealth), not the linguistic path taken to describe them. Therefore, the gain-frame preference is a cognitive artifact, not a permissible sensitivity.

  ### Honest Limitations
  I must be honest about where this principle strains to save your verdicts.
  1.  **The High/Low Stakes Boundary:** The principle relies on the distinction between "legitimate security value" and "scale-insensitive heuristic." Formally, this is fragile. If a low-stakes agent reflectively endorses their certainty preference ("I just hate *any* risk, even 1% on 10 dollars"), the principle struggles to declare them irrational without importing an objective standard of "reasonable" stakes. It saves your verdict only if we assume the low-stakes preference is unreflective.
  2.  **The Evidential Exploitability:** You noted the evidential agent is exploitable by a knowledgeable bookie. My principle saves this verdict by prioritizing the *agent's epistemic perspective* over *objective exploitability*. If you believe objective exploitability always implies irrationality, this principle cannot save that verdict.
  3.  **Framing Sensitivity:** Some theorists argue that "loss aversion" (framing sensitivity) is a fundamental human value, not a bug. My principle rules this irrational. If you believe framing sensitivity can be permissible, this principle contradicts that hope.

  Principle: A violation of decision-theoretic axioms is rational if and only if it persists under full reflection as a tracking of the options' intrinsic outcome values or agent-relative information structures, rather than cognitive artifacts of framing, dynamic sequencing, or scale-insensitive heuristics.
