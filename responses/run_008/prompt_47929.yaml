  Consider a pane of tempered glass in a patio door fitted with a clear security film that has cured to an uneven stiffness; when a heavy bracket strikes the center, the glass remains perfectly flat and intact to all external inspection, yet the impact produces a sharp crystalline tinkling sound typically associated with shattering rather than the dull thud of a solid impact.

  ***

  **(1) The Fink Reading**
  On this reading, the security film acts as a structural reinforcement that redistributes the stress of the impact across the pane faster than the tensioned lattice of the tempered glass can react. Because the film prevents the internal pressure from ever exceeding the fracture threshold, the glass never actually undergoes structural failure; the disposition of fragility is removed *at the moment of stimulus* because the intrinsic basis (the tensioned state) is neutralized by the film's support before it can manifest. The glass effectively becomes unfragile the instant it is struck, which explains why it remains visually intact and why the sound is merely a vibration of the whole system rather than shards rubbing together.

  **(2) The Mask Reading**
  On this reading, the tempered glass suffers complete internal structural failure exactly as its fragility dictates, evidenced by the crystalline tinkling of loose cubes vibrating against one another. The security film does not prevent the breaking; rather, it acts as an external binder that holds the shattered shards in perfect alignment, blocking the *observable manifestation* of the disposition (the pane falling apart or showing cracks) while the disposition itself remains fully intact. The glass is still fragile—it has broken—but the manifestation is masked by the adhesive strength of the film.

  **(3) The Ambiguous Detail and Realism Cost**
  The work is being done by the **acoustic signature versus visual integrity**. The "tinkling" suggests internal shattering (Mask), while the "perfectly flat" visual suggests structural wholeness (Fink). To force this unambiguously to a **Fink**, you would need X-ray confirmation that the internal lattice is unfractured; to force it to a **Mask**, you would need to find a single loose shard inside the frame. The cost in realism for either tweak is high: household scenarios rarely afford X-ray verification, and if a loose shard were found, the ambiguity would vanish instantly, turning the thought experiment into a mundane observation of broken glass. The ambiguity relies on the limits of everyday perception.

  **(4) The Dissolution View**
  Someone who thinks the fink/mask distinction is window dressing (e.g., a proponent of the Simple Conditional Analysis or a radical dispositional skeptic) would argue that "fragility" just *means* "breaks when struck." Since the pane did not break in any observable, functional sense (it still keeps the wind out), it was not fragile. They would dissolve the debate by denying that there is any fact of the matter about the "intrinsic state" independent of the macroscopic outcome; whether the glass *would* have fallen apart without the film is counterfactual speculation that doesn't change the actual disposition of the object-in-its-environment.

  ***

  **Extra Credit: Conditional Analysis vs. Intrinsic Properties**
  This case drives a wedge between the **Simple Conditional Analysis (SCA)** and the **Intrinsic View**.
  *   **SCA:** "If struck, the glass breaks." The glass was struck and did not visibly break. Therefore, the conditional is false, and the glass lacks the disposition. (Aligns with the Fink *outcome*, but ignores the internal state).
  *   **Intrinsic View:** If the Mask reading is true, the glass *did* suffer structural failure (intrinsic change) despite the false conditional. The Intrinsic View must say the glass *was* fragile, whereas SCA must say it *was not*. The ambiguity prevents us from settling which theory is correct, because we cannot verify if the intrinsic basis survived (Fink) or manifested internally (Mask).
