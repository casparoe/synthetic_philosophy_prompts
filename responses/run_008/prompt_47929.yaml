      *   **Mask:** A disposition is present, stimulus occurs, but something interferes with the *manifestation* process while the disposition remains intact. (Disposition exists at $t_1$, stimulus at $t_2$, disposition still exists at $t_2$, manifestation blocked at $t_3$.)
      *   **Key Difference:** Does the intrinsic basis of the disposition survive the stimulus?
      *   **The Challenge:** Usually, finks involve something *changing* the object (e.g., a wizard turning glass to rubber when struck). Masks involve external blockers (e.g., packing glass in foam). To make it ambiguous, the mechanism needs to be internal/external hybrid or the timing of the "loss" vs. "blocking" needs to be opaque.

