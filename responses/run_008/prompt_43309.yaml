answer: |-
  This is a classic philosophical problem known as the **Paradox of Tragedy**, but your specific data points allow us to move beyond generic answers like "it's just art" into something more precise.

  Your intuition about "Distance" and "Control" is correct, but incomplete. Distance explains why the friend's divorce hurts more than a movie, but it fails on the documentary. Control explains why you can stop the movie but not the depression, but it doesn't explain why you hate *engineered* movies (which you can control) but love *honest* ones.

  To capture all your verdicts, including the messy documentary case, we need a three-part principle. I will call this principle **Meaningful Containment**.

  Here are the three sub-principles that constitute it, precisely stated, mapped to your cases.

  ### 1. The Principle of Volitional Boundaries (The Container)
  **Definition:** The negative emotion must be experienced within a frame that the viewer voluntarily entered and can voluntarily exit. The emotion is a "visitor," not a "resident."
  **Motivating Cases:**
  *   **Fiction vs. Friend:** You chose the tragedy; you did not choose the divorce conversation. With the friend, you are socially bound to stay; with the book, you can close it.
  *   **Depression vs. Wallowing:** When you are clinically depressed, the sadness is the baseline state (resident). You cannot "enter" it voluntarily, so you cannot "leave" it. Sad music becomes "pressing on a bruise" because there is no boundary between the art and your reality. When you are merely sad, the music is a container you step into to process the feeling.

  ### 2. The Principle of Narrative Coherence (The Meaning)
  **Definition:** The suffering depicted must feel *earned* and *integral* to a larger truth, rather than *manipulative* or *random*. The sadness must yield insight, understanding, or a sense of "rightness," even if that rightness is devastating.
  **Motivating Cases:**
  *   **Engineered Tearjerker vs. Honest Film:** In the engineered film, the sadness feels like a trick (a dog dying for no reason other than to make you cry). It violates coherence. In the honest film, the tragedy feels inevitable and true to the characters. You enjoy the *truth* of the emotion, not the pain itself.
  *   **Re-reading the Novel:** You enjoy it more the second time because suspense is removed. What remains is the appreciation of the *structure*. You are admiring how the sadness fits into the whole.
  *   **Famine News:** This often feels random and chaotic. There is no narrative arc, no resolution, and no insight to be gained other than "this is bad." It is raw data without coherence.

  ### 3. The Principle of Metabolic Capacity (The Processor)
  **Definition:** The viewer must have sufficient emotional baseline stability to "metabolize" the negative affect into aesthetic appreciation. If the external sadness exceeds the viewer's internal capacity to process it, it becomes trauma rather than art.
  **Motivating Cases:**
  *   **Depression:** Your capacity is depleted. You cannot metabolize the music; it just adds weight.
  *   **The "Weird" Hiker Video:** You mentioned feeling weird about savoring the hiker's death. This is your moral compass flagging that your *Metabolic Capacity* is bordering on voyeurism. You are processing it, but the "truth" gained feels thin compared to the reality of the death.

  ---

  ### The Verdict on the Plane Crash Documentary
  You suspected this case would have to be thrown under the bus. **It does not.** In fact, it is the linchpin that proves "Meaningful Containment" is superior to simple "Distance."

  The documentary fits all three principles:
  1.  **Volitional:** You chose to watch it; you can turn it off.
  2.  **Metabolic:** You were stable enough to watch it without being traumatized.
  3.  **Coherence:** This is the key. A documentary is not raw reality; it is *narrativized* reality. The editor and director have taken a chaotic, horrific event and structured it into a story with a beginning, middle, and end. They have imposed *meaning* on the tragedy. You are not crying because people died; you are crying because you *understand* the death. The pain has been converted into insight.

  **Why the Friend's Divorce failed:** It lacked Coherence. Real life is messy. There was likely no third act, no clear moral, and no resolution. It was just pain without meaning, trapped inside a social obligation you couldn't exit (violating Volitional Boundaries).

  **Why the Famine News failed:** It lacked Coherence and Agency. It was random suffering with no narrative resolution, and you had no power to fix it.

  ---

  ### The Prediction: The Amateur Community Theater
  **The Case:** You are watching a sad play performed by amateurs. The acting is stiff, the lighting is bad, and the craft is objectively poor. However, the actors are trying so hard, and their sincerity is palpable, that the emotional moments "land."

  **The Prediction:**
  You **will enjoy it**, and you may even find it more moving than a professional production, but the *quality* of the enjoyment will be distinct.

  **Why?**
  1.  **Volitional Boundaries hold:** It is still a play. You can leave. You are safe.
  2.  **Metabolic Capacity holds:** Assuming you aren't depressed, you can process the emotion.
  3.  **Narrative Coherence is the variable:** Usually, bad craft breaks Coherence (you get distracted by the bad acting). However, you specified that it "lands." This means the **Sincerity** of the amateurs has compensated for the lack of **Technique**.

  **The Nuance:**
  In a professional tragedy, you admire the *craft* of the sadness (the writing, the acting). In this amateur tragedy, you will admire the *humanity* of the sadness. The "Meaning" you derive shifts from "Look how beautifully this truth was rendered" to "Look how hard these humans are trying to communicate this truth."

  You will likely cry, and you will likely feel a warm, protective affection for the experience. However, you probably **won't want to rewatch it** as eagerly as the professional tragedy. Why? Because the "Coherence" in the amateur version is fragile. It relies on the magic of the live moment. On a rewatch, the bad craft (which you now know is there) might break the spell, whereas the professional craft holds up to scrutiny.

  ### Summary
  You do not like sadness. You like **meaning**.

  When sadness is packaged in a way that allows you to process it safely (Boundaries), gives you insight into the human condition (Coherence), and doesn't overwhelm your nervous system (Capacity), your brain rewards you with dopamine and oxytocin alongside the cortisol. You call this "enjoyment," but it is actually **cognitive resolution.**

  The plane crash documentary gave you resolution. Your friend's divorce did not. That is the difference.
