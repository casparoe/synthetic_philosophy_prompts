  There, I am he who wins in my own name.
  The concession speech is done tonight.
  Here wins a likeness, not I by any name.

  The crowd disperses into fading light.
  There, I am he who wins in my own name.
  I bear the weight of loss, the heavy plight.

  No comfort comes from worlds beyond my sight.
  Here wins a likeness, not I by any name.
  That victor walks away from shame and fight.

  I stay behind within this room so tight.
  There, I am he who wins in my own name.
  The phone no longer rings with news so bright.

  Perhaps modal realism is not right.
  Here wins a likeness, not I by any name.
  I cannot share his glory or his flight.

  The theory splits the self from present sight.
  There, I am he who wins in my own name.
  No comfort rests however clear the light.
  Here wins a likeness, not I by any name.

  This poem simplifies Lewis's counterpart relation to mere resemblance, whereas Lewis defines it via contextual similarity and causal continuity. It also assumes concrete modal realism, ignoring ersatzist alternatives where worlds are abstract. A Lewisian would vigorously dispute Refrain 1 (Transworld Identity), maintaining Humphrey is not identical to his counterpart. The poem sides with Humphrey's intuition: *de re* modality matters only if it concerns *him*. Whether the winner is literally Humphrey (false) or a counterpart (true), the actual Humphrey still loses. The form mirrors this: the refrains persist unchanged while the stanzas shift, mimicking the tension between numerical identity and qualitative recurrence, ultimately showing both fail to soothe the actual loss.
