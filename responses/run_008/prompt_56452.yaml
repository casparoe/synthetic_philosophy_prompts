          5.  The "Dry Dock" Paradox (Neurath's actual intent).
          6.  Conclusion on the "No Literacy" claim.

      *   *Key Insight to Highlight:* Chemical formulas are *theory-laden* (you need to know bonding to read them). ISOTYPE is also *theory-laden* (you need to know what is being counted and why). Neither is "direct truth."
      *   *Correction on Neurath:* He didn't believe pictures bypassed interpretation. He believed they bypassed *syntactic ambiguity* of natural language, but they still required a "physicalist" framework. He insisted on captions.

  7.  **Refining the Chemistry/ISOTYPE Comparison:**
      *   *Chemical Formula:* $C_6H_6$. Predictive. Structural.
      *   *ISOTYPE:* [Man][Man][Man]. Descriptive. Quantitative.
