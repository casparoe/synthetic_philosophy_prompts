  8.  **Final Polish:** Ensure the distinction between *Kekulé's structure* (theoretical model) and *ISOTYPE* (statistical visualization) is clear. Emphasize that Neurath would reject the "direct truth" claim. He was a pragmatist/empiricist, not a realist in the naive sense.

