      *   *The User's Worry:* Is this too thin? Does it confuse "wanting to continue" with "pleasure"?
      *   *The "Boring Meeting" Counter-example:* I might want a boring meeting to end (con-attitude), but is the meeting *painful*? Or am I just indifferent/annoyed?
