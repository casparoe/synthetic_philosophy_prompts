answer: |-
  Your tentative principle ("remove when the bad is celebrated, retain when incidental") is a strong start, but it falters because "incidental" is too vague. A slaveholder's wealth is incidental to his politics but constitutive of his city-building. A eugenicist's racism is incidental to his microscopy but constitutive of his theories.

  To capture your verdicts precisely, we need a principle that distinguishes between **honor**, **history**, and **utility**, and accounts for the relationship between the *achievement* and the *immorality*.

  Here is the principle that best fits your intuition, followed by the necessary sacrifice and the application to your new cases.

  ### The Principle of Uncorrupted Merit

  A public commemoration is permissible only if it satisfies three conditions:
  1.  **Independence:** The specific achievement being honored must be morally and causally separable from the subject's immorality. (If the achievement *required* the immorality, it is corrupted.)
  2.  **Integrity:** The commemoration must not contradict the core values of the institution or space hosting it. (A science building cannot honor pseudoscience; a civic square cannot honor rebellion against civic order.)
  3.  **Function:** The object must serve a public purpose (education, history, art) that outweighs the dignitary harm of the honor. If the honor is inert (obscure) or the object has value independent of the subject (art), the calculus shifts.

  **The Rule:** If the achievement is **Corrupted** (violates Independence) or **Contradictory** (violates Integrity), **Remove**. If the achievement is **Separable** but the subject is flawed, **Retain with Context**. If the object has **Independent Value** (Art) but the Honor is Corrupted, **Preserve as Artifact, Remove as Honor** (move indoors).

  ---

  ### Application to Your Seven Cases

  This principle validates six of your verdicts and identifies one inconsistency you must resolve.

  *   **Case 1 (Confederate General):** **Remove.**
      *   *Analysis:* **Contradictory.** A civic space honors civic order; a rebellion to enforce slavery contradicts this. Also **Corrupted:** The statue's purpose (racial order) *was* the immorality.
  *   **Case 2 (Founding Father):** **Keep + Plaque.**
      *   *Analysis:* **Separable.** Political achievement is distinct from slaveholding. **Integrity:** Civic history includes flawed founders. Context resolves the tension.
  *   **Case 3 (Eugenicist Scientist):** **Rename.**
      *   *Analysis:* **Contradictory.** A science building promotes truth; eugenics is scientifically discredited and morally abhorrent. You cannot "contextualize" bad science in a science building without undermining the building's mission. This explains why a plaque feels like whitewashing here but not in Case 2.
  *   **Case 4 (Slave Trader Founder):** **Remove.**
      *   *Analysis:* **Corrupted.** The city's fortune (the achievement) was *caused* by the slave trading (the immorality). You cannot separate the city's existence from the trade.
  *   **Case 5 (Artistic Statue):** **Move Indoors.**
      *   *Analysis:* **Independent Value.** The art has merit separate from the subject. Moving it indoors satisfies **Function** (preserve art) while negating the public **Honor** (remove from square).
  *   **Case 6 (Unknown Mayor):** **Fine.**
      *   *Analysis:* **Inert Honor.** If no one connects the name to the man, there is no active endorsement. The **Function** is navigational, not commemorative.
  *   **Case 7 (Mediocre Statue):** **The Sacrifice.**
      *   *Analysis:* You state this man is "comparable in virtue and vice" to Case 2, yet you want him gone. Under the Principle of Uncorrupted Merit, he should be treated like Case 2 (**Keep + Context**).
      *   *Why discard this verdict?* You admitted the desire to remove him is based on the statue being "ugly." Aesthetic quality is not a moral category. If the moral calculus is identical to Case 2, the verdict must be identical. To maintain a consistent principle, you must accept that **mediocrity does not justify erasure.** If he stays in Case 2, he stays in Case 7.

  ---

  ### Application to New Cases

  Here is what the Principle of Uncorrupted Merit implies for your specific new scenarios.

  #### 1. Eponymous Species Names in Taxonomy
  *   **The Case:** A bird carries a man's name; birdwatchers don't know the man; scientists do.
  *   **Analysis:**
      *   **Independence:** Taxonomic classification is generally separable from the classifier's morals (unlike eugenics). The bird's biology is not tainted by the man's racism/sexism.
      *   **Integrity:** Science values stability and nomenclature. Constant renaming disrupts the **Function** of identification.
      *   **Function:** For the public (birdwatchers), the honor is **Inert** (like Case 6). For scientists, it is historical.
  *   **Verdict:** **Retain the name, but annotate.**
      *   Changing the name creates scientific confusion (violating Function) for a moral gain that is largely invisible to the public (Inert Honor). However, scientific databases and field guides should include notes on the namesake's history. This satisfies the duty to truth without sacrificing utility.
      *   *Exception:* If the name itself is a slur or the classification *depended* on racist typologies (violating Independence), then Rename.

  #### 2. The Stained-Glass Window (Slaveholding Bishop)
  *   **The Case:** A window depicts a bishop who owned slaves; it is also a memorial donated by his grieving family.
  *   **Analysis:**
      *   **Integrity:** This depends on the institution. If this is a **Church**, there is a conflict between the Gospel (core value) and Slavery (immorality). If the Bishop used his office to defend slavery, it is **Contradictory** (like Case 1). If he was a bishop who privately owned slaves (like Case 2), it is **Separable**.
      *   **Function/Value:** It is a work of art and a **Private Memorial** (family grief). This adds a layer Case 5 didn't have: the harm of removal extends to the grieving descendants, not just the public honor.
  *   **Verdict:** **Retain with Radical Context.**
      *   Because it serves a private memorial function and artistic function, removal is a last resort. However, because it is in a public/sacred space, it cannot simply honor him.
      *   **Requirement:** A plaque must explicitly state his status as a slaveholder and the institution's stance on slavery. If the Church actively benefited from his slave wealth (like Case 4), the window should be **Moved to a Museum** (like Case 5) to preserve the art and family memory without maintaining the public honor in a sacred space.

  ### Summary of the Trade-off
  To have a principle that works, you must surrender **Case 7**. You cannot allow aesthetic judgment ("it's ugly") to masquerade as moral judgment ("it should be gone"). If the man in Case 7 is morally comparable to the Founding Father in Case 2, he deserves the same historical treatment, regardless of the sculptor's skill.

  By adopting the **Principle of Uncorrupted Merit**, you gain a tool that distinguishes between *bad people who did good things* (Keep + Context), *good things built on bad acts* (Remove), and *bad science disguised as good* (Remove). It protects you from the inconsistency of judging the statue rather than the substance.
