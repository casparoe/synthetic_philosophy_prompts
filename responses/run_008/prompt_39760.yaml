answer: |-
  Colleague, this is a sharp set of intuitions. You've correctly identified the friction points between synchronic coherence (transitivity) and diachronic stability (consistency). You're also right to be suspicious of "exploitation" as the mark of irrationality; Case 3 (no broker) and Case 4 (broker profits) show that the presence of a predator is orthogonal to the agent's internal rational status.

  You asked for a principle, not a rescue mission. I'm going to give you a principle that cleans up the ontology of your cases, but it will require you to sharpen one of your ambivalent verdicts.

  ### The Principle: Exogenously-Grounded Dynamic Consistency (EGDC)

  An agent is diachronically rational if and only if:

  1.  **Coherence:** Their preference ordering over final outcomes is transitive and complete at the initial planning stage ($t_1$).
  2.  **Consistency:** Their choices at later stages ($t_2, t_3...$) maximize the utility function established at $t_1$.
  3.  **Grounding Exception:** Deviation from the $t_1$ plan is permitted *only* if the agent has acquired new information regarding the **exogenous properties** of the options (e.g., physical state, risk profile, availability), and *not* merely regarding their own temporal proximity to the outcome or their endogenous psychological state.

  **Why this formulation?**
  It treats rationality as a property of the *agent's structure*, not the *environment's hostility*. It distinguishes between learning the world is different (Case 4) and learning you are weak (Case 5).

  ---

  ### Application to Your Seven Cases

  1.  **Classic Pump:** **Irrational.** Violates Clause 1 (Coherence). You lack a utility function to maximize. The loss is a symptom, not the disease.
  2.  **Transparent Pump:** **Irrational.** Violates Clause 1. Knowledge of the pump doesn't fix the intransitivity. If you can't rank them, you can't plan.
  3.  **No Broker/Drift:** **Irrational.** Violates Clause 1. The absence of a predator doesn't make intransitive preferences coherent. You are spinning wheels because you lack a "best" option.
  4.  **Taste Change (Hiker):** **Rational.** Satisfies Clause 3 (Grounding). The rain and sore knees are exogenous changes to the *description of the option* (Hike-in-Rain is a different good than Hike-in-Sun). Your utility function updates legitimately.
  5.  **Akrasia:** **Irrational.** Violates Clause 3. "Saturday arrived" is not an exogenous change to the option (Writing). It is a change in temporal perspective. Your utility function shifted endogenously.
  6.  **One-Shot:** **Irrational.** Violates Clause 1. This is where I push back on your ambivalence. If your preferences are cyclic, you have no maximal element. Choosing *any* option is choosing an option that is dominated by another available option (in the abstract set), even if the loop isn't closed. The irrationality is the incoherence, not the loop.
  7.  **Binding:** **Rational.** Satisfies Clause 2. You are enforcing the $t_1$ plan against the $t_2$ deviation. This is the hallmark of a "sophisticated" rational agent.

  ---

  ### New Test Cases

  To stress-test EGDC, consider these two variations:

  **Case 8: The Sober Drunk.**
  *Friday:* You prefer being sober Saturday to being hungover. You plan to stop drinking.
  *Saturday:* You are now intoxicated. You prefer another drink to stopping. You drink.
  *Verdict:* **Irrational.**
  *Reasoning:* Like Akrasia (Case 5). The change in preference is driven by an endogenous state change (intoxication) that you could anticipate. It fails the Grounding Exception. The option "Stop Drinking" hasn't changed its exogenous properties; your capacity to value it has degraded.

  **Case 9: The Discovered Allergy.**
  *Friday:* You prefer Peanut Butter to Almond Butter. You plan to eat PB Saturday.
  *Saturday:* You discover a newly developed peanut allergy (medical test results). You switch to AB.
  *Verdict:* **Rational.**
  *Reasoning:* Like the Hiker (Case 4). The option "Eat PB" has acquired a new exogenous property (it is now poisonous). This is valid information updating the utility function.

  ---

  ### The Sacrifice

  Here is the blunt assessment you requested. Your set of seven verdicts is *almost* consistent, but **Case 6 (One-Shot)** is the weak link.

  You wrote: *"I go back and forth... this feels less bad than the full pump."*

  **You must drop this ambivalence.** Under EGDC (and standard RCT), Case 6 is just as irrational as Case 1.

  **Why?**
  Rationality is about the relation between your mind and your choices, not the relation between your wallet and a broker.
  *   If you prefer A to B, B to C, and C to A, you literally do not have a "favorite" option.
  *   In Case 1, the broker monetizes this confusion.
  *   In Case 6, the market simply fails to monetize it.
  *   But the *confusion* remains. You are making a choice that your own preferences declare is sub-optimal (since whatever you pick, you prefer something else to it).

  If you insist that Case 6 is "less bad" or "maybe rational," you are conflating **pragmatic prudence** (don't lose money) with **rational coherence** (have transitive preferences). You can be lucky (no broker) while being irrational (cyclic prefs).

  **Secondary Sacrifice:**
  You noted Case 3 is *"less obviously [irrational] than 1."* I recommend you drop the "less obviously" qualifier. It is *equally* irrational. The presence of a broker makes the irrationality more *visible* (because money vanishes), but the structural defect is identical. If you keep the "less obviously" hedge, you invite the "exploitation is the problem" error you rightly rejected in Case 4.

  ### Recommendation

  Adopt **EGDC**. It cleanly separates the *source* of preference change (World vs. Self) which solves your 4 vs. 5 puzzle. It unifies the money pump cases (1, 2, 3, 6) as failures of Coherence rather than failures of Prudence.

  **Your homework:** Re-evaluate Case 6. If you can accept that an agent with cyclic preferences is broken *even if they die before losing a dime*, the rest of your verdicts fall into a robust, non-disjunctive line. If you cannot accept that, you cannot work in RCT; you are working in a pragmatic theory of welfare, which is a different project.
