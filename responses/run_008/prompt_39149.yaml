      *   *Physical CTT (PCTT):* Any physical process can be simulated by a Turing Machine (TM).
      *   *Strong PCTT:* Any physical process can be *efficiently* simulated by a TM.
      *   *Quantum Computing's Impact:* Quantum computers (QC) do *not* compute non-computable functions. They compute the same set of functions as a TM (recursive functions). However, they might do it *faster* (BQP vs. P).
      *   *Conclusion:* QC does not falsify the standard CTT. It challenges the *Strong* PCTT (efficiency), not the basic computability thesis.

