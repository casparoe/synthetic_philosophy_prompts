answer: |-
  It is a pleasure to address a question from someone with your background. Your intuition is sharp, and your observation regarding the simulation of quantum systems is physically correct: simulating a large entangled system on a classical architecture is exponentially costly. However, the resolution to your puzzle lies in a distinction that is often elided in popular science but is rigorous in logic and computability theory: the distinction between **computability** (what can be computed in principle) and **complexity** (what can be computed efficiently).

  You have not misunderstood the physics; rather, you are applying a physical constraint (time/resources) to a logical definition that is concerned solely with finiteness.

  Here is the breakdown of why the Church-Turing thesis (CTT) remains secure against quantum computing, and why philosophers of mind continue to rely on it.

  ### 1. Computability vs. Complexity
  The original Church-Turing thesis is a claim about the **extension** of the class of computable functions, not the **intension** (the method or speed) of their computation.

  *   **Computability:** A function is Turing-computable if there exists a finite set of instructions that a Turing machine (TM) can follow to produce the output for any given input in a finite number of steps. It does not matter if those steps number $10$ or $10^{100}$.
  *   **Complexity:** This concerns the *resources* (time and space) required relative to the input size. This is where classes like **P** (polynomial time) and **BQP** (bounded-error quantum polynomial time) live.

  Your colleagues in quantum optics are correct that simulating 50 fully entangled qubits on a classical computer requires tracking $2^{50}$ complex amplitudes. This is practically infeasible. However, $2^{50}$ is still a finite number. A Turing machine *can* perform that simulation. It will just take an exponentially long time.

  Because the simulation terminates in finite time, the function computed by the quantum computer is **Turing-computable**. Quantum computers do not compute functions that are uncomputable by a classical TM (such as solving the Halting Problem); they merely compute computable functions potentially *faster*.

  Therefore, quantum computing challenges the **Strong Physical Church-Turing Thesis** (which claims physical processes can be *efficiently* simulated by a classical TM), but it leaves the **Standard Church-Turing Thesis** (which claims physical processes can be simulated by a TM *in principle*) intact.

  ### 2. The Physical Church-Turing Thesis (PCTT)
  Since you are reading philosophy of mind, you will encounter variations of the thesis. It is helpful to distinguish them:

  1.  **Mathematical CTT:** Any effectively calculable function is Turing-computable. (Secure.)
  2.  **Weak Physical CTT:** Any physical system can be simulated by a TM to arbitrary precision. (Secure, assuming standard quantum mechanics.)
  3.  **Strong Physical CTT:** Any physical system can be *efficiently* simulated by a TM. (Challenged by quantum computing.)

  David Deutsch, one of the pioneers of quantum computing, actually reformulated the thesis as the **Church-Turing-Deutsch Principle**, stating that a universal quantum computer can simulate any physical process. Note, however, that a Quantum Turing Machine is equivalent to a classical Turing Machine in terms of *what* it can compute, even if it is superior in *how fast* it computes certain things.

  ### 3. Why Philosophers of Mind Continue to Use CTT
  You asked why the philosophical literature presupposes the thesis stands. The answer is that most arguments in the philosophy of mind regarding mechanism and cognition hinge on **computability**, not **complexity**.

  Consider the two main camps:
  *   **Strong AI / Functionalism:** Argues the mind is a computational system. They rely on the CTT to say that if cognition is a physical process, it is computable, and thus simulatable by a machine. The speed of the simulation is irrelevant to the *possibility* of artificial mind.
  *   **Gödelian Arguments (e.g., Lucas, Penrose):** Argue that the mind is *not* a machine because humans can see the truth of Gödel sentences that a formal system cannot prove. This argument requires the mind to access **non-computable** truths.

  Quantum computing does not help the anti-mechanist here. Even if the brain is a quantum computer, it is still bound by the limits of Turing-computability. It cannot solve the Halting Problem. Therefore, if one wishes to argue that the human mind transcends mechanism, one must argue for **hypercomputation** (the ability to compute non-Turing-computable functions), not merely quantum speedup.

  Roger Penrose is the notable exception you may encounter. He argues that the brain exploits non-computable physics (specifically, objective reduction of the wavefunction involving gravity) to achieve non-algorithmic understanding. But note that Penrose does not rely on standard quantum computing (which is Turing-equivalent); he relies on speculative physics that violates the standard unitary evolution of quantum mechanics.

  ### 4. What Would Actually Falsify CTT?
  To falsify the standard Church-Turing thesis, physics would need to provide a system that can compute a **non-recursive function**.

  Physicists and logicians have explored "hypercomputation" models, such as:
  *   **Malament-Hogarth Spacetimes:** General relativity solutions where an observer can witness the completion of an infinite supertask in finite proper time.
  *   **Analog Neural Nets:** Systems that rely on real-valued weights with infinite precision (which is generally considered physically unrealistic due to noise and the Bekenstein bound).
  *   **Quantum Adiabatic Systems with Infinite Spectra:** Some proposals suggest continuous variable quantum computing might bypass discrete limits, but noise usually destroys the advantage.

  None of these are established physics. Standard quantum mechanics, including entanglement and superposition, operates within the Hilbert space formalism, which is simulatable by linear algebra on a classical machine (albeit inefficiently).

  ### Summary
  Your physics intuition is correct: the universe contains processes that are **computationally intractable** for classical machines.
  Your logic intuition needs a slight adjustment: **intractable** is not the same as **impossible**.

  *   **Quantum Computers:** Break the Strong PCTT (efficiency), but respect the Weak PCTT (computability).
  *   **Philosophy of Mind:** Mostly concerns itself with whether the mind is algorithmic at all (computability), not whether it runs in polynomial time (complexity).

  Therefore, the standard arguments remain secure. If the brain is a quantum computer, it is still a Turing-equivalent computer. To overturn the philosophical consensus, one would need to demonstrate that the brain can solve the Halting Problem, not just factor integers quickly.

  Given your background, you might find David Deutsch's *The Fabric of Reality* or Scott Aaronson's *Quantum Computing Since Democritus* particularly satisfying; they bridge this exact gap between physical resource constraints and logical computability limits with the rigor a physicist expects.
