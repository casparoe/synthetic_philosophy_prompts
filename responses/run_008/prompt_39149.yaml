      *   *Section 1: Computability vs. Complexity.* This is the crux. Explain that CTT is about *decidability*, not *efficiency*. A TM can simulate a quantum system, just slowly. The "age of the universe" argument is about complexity classes (P vs. BQP), not computability classes (Recursive vs. Non-recursive).
