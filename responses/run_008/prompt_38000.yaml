  The step you need to reject is **Step (1)**.

  Here is the breakdown of why that step is the weak link, why it seduced you, and why letting it go saves you from the uncomfortable conclusions in (6) and (7) without forcing you to accept your brother's view that strict-truth deception is harmless.

  ### 1. Why Step (1) Looked Fine
  Step (1) claims: *"When deceiving someone is wrong, it is wrong because of the outcome you intend... the words are just the delivery mechanism."*

  This is a **consequentialist** view. It feels correct because, intuitively, the harm of deception *is* that the victim acts on a false picture of the world. If I lie to you about the train schedule and you miss your flight, the harm is the missed flight, not the vibration of my vocal cords. It makes sense to focus on the damage (the false belief) rather than the tool (the words). It allowed you to build a clean, symmetrical argument that equated the liar and the palterer based on shared intent and shared outcome.

  ### 2. Why Step (1) Is Broken
  Step (1) assumes that communication is merely **information transfer**. If it were just about moving data from Head A to Head B, then the mechanism wouldn't matter. But human communication is a **social contract**.

  When you speak to someone, you aren't just dumping data; you are invoking a norm of cooperation (often called the Gricean Maxims). You are implicitly saying, *"I am offering this information for your use, and I am taking responsibility for its relevance and truthfulness."*

  *   **The Liar** violates this contract by asserting a falsehood.
  *   **The Palterer** (strict-truth deceiver) honors the letter of the contract (the words are true) but violates the spirit (they know you will infer a falsehood).
  *   **The Con Man** (Step 6) often avoids the contract of assertion entirely by asking questions.
  *   **The Silent Friend** (Step 7) opts out of the contract of communication altogether.

  By rejecting (1), you acknowledge that the *moral weight of an act* depends not just on the outcome, but on **what kind of act it was**.

  ### 3. The Cost of Giving Up Step (1)
  You worried that abandoning (1) means *"the choice of words matters more than the result."* That is a false dichotomy.

  Rejecting (1) doesn't mean results don't matter. It means results aren't the *only* thing that matters. You are adopting a **pluralistic** view of ethics.
  *   **The Cost:** You have to admit your brother is partially right. There *is* a moral difference between a lie and a strict-truth deception. The liar has corrupted the very tool of communication; the palterer has weaponized the listener's own reasoning. They are not "just as bad" in the exact same way; they are different *kinds* of wrong.
  *   **The Benefit:** You don't have to say they are *equally* bad to say they are *both* bad. You can grade the blame.

  ### 4. How This Saves You from (6) and (7)
  This is the most important part. Your current argument leads to (6) and (7) because it tries to judge everyone by a single metric: *"Did you intend a false belief?"*

  If you reject (1), you can judge people by the **norms they violated**. This allows you to condemn the Con Man and the Silent Friend without calling them "liars."

  *   **Regarding the Con Man (6):**
      *   **Your Fear:** If I reject (1), maybe the Con Man is blameless because he didn't lie.
      *   **The Fix:** The Con Man is not blameless. He just isn't guilty of *deceptive assertion*. He is guilty of **exploitation**. He manipulated the context to take advantage of you. By rejecting (1), you can say: *"He didn't lie, but he violated the norm of fair dealing."* He is still wrong, just under a different charge.
  *   **Regarding the Silent Friend (7):**
      *   **Your Fear:** If I reject (1), maybe silence is always okay.
      *   **The Fix:** The Silent Friend is not blameless. They are guilty of **betrayal** or **negligence**. Friendship carries a duty of care that stranger-interactions do not. By rejecting (1), you can say: *"They didn't deceive you, but they failed in their duty to warn you."*

  ### Summary
  Your argument proved "too much" because it tried to flatten all moral failures involving false beliefs into one category: **Deception**.

  *   **Reject Step (1).**
  *   **Accept:** Deception is wrong because of the outcome *AND* because it violates the trust inherent in speech.
  *   **Result:** The Liar is worst (violates trust + causes harm). The Palterer is very bad (abuses trust + causes harm). The Con Man is bad (exploits vulnerability). The Silent Friend is bad (neglects duty).

  You don't have to choose between "words matter most" and "silence is blameless." You can hold that **relationships matter most.** The liar, the palterer, the con man, and the silent friend all damage the relationship, just in different ways.
