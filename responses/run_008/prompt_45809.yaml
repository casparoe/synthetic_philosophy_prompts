      *   *Check:* Is the Friend's view "somewhere in the middle"? Yes, between 0.5 (Prior) and 0.75 (Partner).
      *   *Check:* Is it possible $P(O)$ should update? If the Ranger *could* have said "You are outside" but didn't, does that lower $P(O)$? The prompt says "He never said how likely we were to be in the park". We must treat the evidence as strictly the conditional ratio.
      *   *Key Insight:* The evidence acts as a **likelihood ratio** between $F$ and $L$. $LR(F:L) = 3$. It is neutral regarding $O$ vs $(F \lor L)$.
      *   Therefore, $P_1(O) / P_1(F \lor L) = P_0(O) / P_0(F \lor L)$. (Rigidity of the odds against the partition).
      *   This confirms $P_1(O) = P_0(O)$.
      *   So $P_1(F) = \frac{3}{4} (1 - P_0(O))$.
      *   If $P_0(O) = 0.1$ (small residual), $P_1(F) = 0.75 \times 0.9 = 0.675$.
      *   Prior $P_0(F) \approx 0.45$.
