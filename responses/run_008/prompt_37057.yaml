  2.  **Deconstruct the Scenario:**
      *   **Track 1 (DBD - Donation after Brain Death):** Patient on ventilator. Heart beating. Declared dead based on irreversible loss of *all* brain function (whole-brain death). Organs taken while heart beats.
      *   **Track 2 (DCD - Donation after Circulatory Death):** Patient off ventilator (usually). Heart stops. Wait 2-5 minutes. Declared dead. Organs taken. Heart *could* theoretically be restarted (auto-resuscitation or CPR), but won't *on its own* (permanent vs. irreversible).
      *   **Tension:** In DBD, death is defined by brain function loss despite circulation. In DCD, death is defined by circulation loss despite potential brain function (if restarted) or actual brain function loss (if not restarted). The DCD waiting period (2-5 mins) relies on "permanence" (won't restart spontaneously) rather than strict "irreversibility" (cannot be restarted by any means).
      *   **Philosophical Issue:** Is death a biological fact or a normative/conventional status? Does the practice shift the definition to facilitate organ procurement?

  3.  **Formulate the Bottom Line:**
      *   Need a concise statement summarizing the implicit concept and consistency.
