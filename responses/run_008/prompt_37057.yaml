      *   **Topic:** Organ transplantation, Dead Donor Rule (DDR), two tests for death (Neurological/Brain Death vs. Circulatory/DCD).
      *   **Core Question:** What definition of death does this two-track practice presuppose? Is it a single biological event or a conventional status? Is it inconsistent or reconcilable? What would change if we insisted on a single unitary criterion?
      *   **Constraints:**
