          *   Address the "Convention" aspect. Because DCD relies on a decision *not* to resuscitate, death becomes partly dependent on the intent of the medical team, supporting the view that death is a status fixed by convention to facilitate transplantation.
          *   Address the "Single Criterion" hypotheticals.
