              *   If strict whole-brain: DCD donors (who often don't meet brain death criteria before withdrawal) cannot be used until brain death is confirmed post-arrest, which ruins organs. No DCD.
          *   Synthesize: The current system is a pragmatic compromise that stretches the biological definition to meet social needs (organ supply), implying death is partly conventional.

