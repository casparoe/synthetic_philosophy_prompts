  **Quiz: Which Selectionist Are You?**

  1.  **Peppered Moth:** Wings match soot. Why did this evolve?
      A) Moths survived birds better.
      B) Camouflage genes increased frequency.

  2.  **Meiotic Drive:** A gene forces 90% inheritance, reducing host fertility.
      A) Gene selection overriding organism.
      B) Organism-level malfunction.

  3.  **Cancer:** Cells divide unchecked, killing the host.
      A) Selection among cell lineages.
      B) Breakdown of organism integrity.

  4.  **Sterile Workers:** Bee works, never breeds. Why?
      A) Maximizes actor's genetic representation.
      B) Ensures colony survival.

  5.  **Clone Shrub:** Clonal hillside. Toxin gene damages tissue but kills rival seedlings nearby.
      A) Gene spreading itself.
      B) Genet defending territory.
      C) Group regulating density.

  6.  **Alarm Calls:** Squirrel warns others, risking predation.
      A) Protects shared genes.
      B) Protects the local population.

  7.  **Viral Virulence:** Virus replicates fast, kills host quickly.
      A) Within-host competition wins.
      B) Between-host transmission fails.

  8.  **Sex Ratio:** Wasps lay fewer males when sisters are present.
      A) Avoids gene competition among brothers.
      B) Reduces local resource competition.

  **Scoring Key**

  *   **Mostly 1B/2A/3A:** **Hard-line Gene-centrism.** You see organisms as vehicles. Meiotic drive and cancer are proof selection acts below the individual.
  *   **Mostly 1A/2B/3B:** **Orthodox Organism-level.** Selection requires organismal reproduction. Sub-organismal conflicts are pathologies, not distinct levels.
  *   **Mostly 4A/6A/8A:** **Inclusive-Fitness Loyalism.** Altruism is explained by actor's genetic gain (kin), not group benefit.
  *   **Mostly 4B/6B/8B:** **Group-Selection Revivalism.** You prioritize the collective benefit or population stability as the explanatory frame.
  *   **Mixed/Contextual (esp. Q5B):** **Pragmatic Multilevelism.** You choose the level that simplifies the specific case. You accepted the shrub hillside as a single individual (Genet) distinct from the group.

  **Philosopher's Notes**

  **1. Kin vs. Group:** Mathematically, these formalisms are equivalent. This quiz splits them by *explanatory intuition*: do you credit the actor's genes (Kin) or the collective outcome (Group)? Real theorists often use both, but your gut preference reveals your heuristic.

  **2. Species Selection:** Omitted. Requires cases of differential speciation/extinction rates unrelated to organism fitness. Too abstract for a lay quiz; usually collapses into organism-level effects in practice.

  **3. Incoherent Combos:**
  *   *Gene-centrism on Cancer (3A) but Organism on Meiotic Drive (2B):* Incoherent. Both are sub-organismal conflicts. If you accept one, you must accept the other as a distinct level.
  *   *Group on Workers (4B) but Gene on Shrub (5A):* Unstable. The shrub case is structurally identical to kin selection (clones = high relatedness). Rejecting group logic here while accepting it for bees suggests inconsistency regarding genetic relatedness vs. physical grouping.
