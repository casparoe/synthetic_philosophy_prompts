  ## 5. Predictable Failure Modes (What Will Go Wrong)

  **1. The "Good Student" Effect (Demand Characteristics)**
  *   **Risk:** Since this is a seminar on rational choice, students may suspect the "correct" answer is to never honor sunk costs. Alpha teams might Abandon correctly, but Beta teams might *also* Abandon incorrectly, trying to be "rational."
  *   **Mitigation:** Frame the game as "R&D Management," not "Logic Test." Emphasize that in business, *quitting* too often is also a failure mode. Offer a small bonus (e.g., course credit point) to the team with the *highest final score*, not the most "rational" decisions. This incentivizes Beta teams to Invest.

  **2. Information Leakage**
  *   **Risk:** A Beta team gets 3 Successes in a row and shouts, "This is easy!" Alpha teams hear this and adjust their strategy.
  *   **Mitigation:** Seat groups far apart. Use private dice rolls (facilitator rolls, or teams roll under a folder). Explicitly forbid cross-team communication until the debrief.

  **3. The "Lemon" Pacing Issue**
  *   **Risk:** Beta teams lose 20 RC on "Lemons" without reaching a Decision Point. They might finish the 3 Decision Points much faster than Alpha teams and sit idle, comparing notes.
  *   **Mitigation:** Give Beta teams a larger stack of cards. Tell them: "Draw cards until you have reached 3 Decision Points." This ensures equal engagement time.

  **4. Over-Correction (The Reverse Fallacy)**
  *   **Risk:** Some students, knowing the topic, may adopt a rigid rule: "Always Abandon at Stage 2."
  *   **Observation:** Watch for teams that Abandon in Condition Beta.
  *   **Debrief Use:** This is a feature, not a bug. It allows you to discuss *rule worship* vs. *structural analysis*. They avoided the Sunk Cost Fallacy but fell into the "Ignore Signal Fallacy."

  ## 6. Limitations & The Debrief Bridge

  ### What The Game Cannot Reproduce: The Agency Problem
  **Diagnosis:** In this game, the Team *is* the Principal. They bear the full cost of the loss and reap the full reward of the gain. In real organizations (Concorde, corporate R&D), the decision-maker is an *Agent*.
  *   **Real World:** If a manager cancels a project, they admit a past mistake (career risk). If they continue and it fails, it's "bad luck" or "market conditions."
  *   **Game:** There is no blame. There is only token maximization.
  *   **Missing Feature:** *Blame Avoidance.* The game models *Epistemic Rationality* (what should I believe?), but real escalation often stems from *Political Rationality* (how do I survive?).

  ### How to Supply It in Debrief
  1.  **The "Career" Variant:** After revealing the Alpha/Beta structure, ask the Beta teams: *"Imagine now that the 20 RC you spent in Stage 1 came from your personal budget, but the 30 RC for Stage 2 comes from the company. Would you Invest?"*
      *   This highlights how risk-shifting alters the calculus.
  2.  **The "Admission" Tax:** Ask Alpha teams: *"If Abandoning required you to publicly write a report explaining why you wasted the initial 20 RC, would you still Quit?"*
      *   This introduces the reputational cost that often makes the "Fallacy" rational for the individual, even if irrational for the firm.
  3.  **Synthesis:** Conclude that the "Sunk Cost Fallacy" slogan is a useful heuristic for *isolated economic agents*, but a dangerous one for *organizational actors* where information is asymmetric and incentives are misaligned. The game showed that sunk costs *can* be informative (Beta); reality shows they can also be *protective* (Career stakes).

  ### Addressing Over-Correction
  If you notice teams Abandoning in Condition Beta (trying to be "too rational"):
  *   **Debrief Point:** "Some of you correctly identified that Sunk Costs are irrelevant *in isolation*, but failed to see they were informative *in context*. Rigidly applying 'Ignore Sunk Costs' without checking the Information Structure is itself an irrational heuristic. Rationality requires knowing *why* the cost was sunk."
