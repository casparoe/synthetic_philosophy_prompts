prompt: |-
  I teach an upper-level seminar on rational choice for a mixed group of philosophy and economics students — about 18 of them, one 90-minute session — and we're about to reach the sunk cost material. By this point they've seen the standard treatment enough times that they can recite it: past unrecoverable expenditures shouldn't figure in forward-looking choice, the theater-ticket and Concorde-style examples, escalation of commitment as a corporate pathology. What I want is a game that unsettles that recitation rather than confirming it. Specifically, I want participants to run into a situation where continuing to pour resources into a project they've already sunk money into *feels* like the classic fallacy from the inside, while the game's hidden structure makes it the right call — and, symmetrically, a situation where cutting losses cleanly feels virtuous but is actually the mistake.

  Here's the design problem I'd like you to solve. Build a multi-round investment game in which teams allocate a fixed budget of tokens across projects whose quality is only partially revealed over time. The key feature: the game should have two phases or conditions that are experientially identical but structurally different. In one, past spending carries no information and no external consequence — so continuing is the textbook fallacy. In the other, sunk costs are informative (only projects that survived an earlier vetting round are eligible for further funding, or the team's own earlier choice screens the options, so their past selves' decisions are evidence about the current ones) or strategic (whether you quit is observed by partner teams who then decide whether to invest alongside you, so abandonment carries a reputational price). Participants should discover, in the debrief, that they generated the *same behavioral profile* in both conditions and that only the information structure differs — which is exactly where the simple "honoring sunk costs is always irrational" slogan breaks down. Payoffs in course tokens or grade-independent credit rather than money; keep materials to printed project cards, a log sheet per team, and a facilitator spreadsheet at most.

  Beyond the rules and payoff scheme, I need three more things. First, a log-sheet design that lets me reconstruct, team by team, which continuation decisions were warranted given the hidden structure and which weren't — I want to be able to point at an individual decision in the debrief and say what the right call was there, and how many teams got it. Second, a frank section on what will predictably go wrong the first time I run it: teams colluding, the information condition being too subtle to notice, participants behaving well because they know they're being observed in a game about irrationality, and whatever else you anticipate. Third, an honest note on which feature of the real phenomenon the game cannot reproduce — my own guess is the blame-avoidance and career-stakes structure that drives much escalation in organizations, where the person who cancels the project absorbs the loss and the person who rode it out doesn't — but I'd like your diagnosis, plus how the debrief should supply it. If you can also build in a way for some teams to over-correct — abandoning too readily, since the game's own incentive to look rational might push them past the optimum — that would round it out nicely.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level philosophy and economics students (mixed group, ~18 students).
      *   **Context:** 90-minute seminar session on Rational Choice/Sunk Cost Fallacy.
      *   **Current State:** Students know the standard definition (ignore sunk costs, don't throw good money after bad).
      *   **Goal:** Create a game that *unsettles* this recitation.
      *   **Core Mechanic:** A multi-round investment game with two conditions that *feel* identical but have different structural justifications for continuing a project.
          *   Condition A: True Sunk Cost Fallacy (continuing is irrational).
          *   Condition B: Sunk Costs as Signal/Screen (continuing is rational due to information or reputation).
      *   **Desired Outcome:** Students realize they behaved similarly in both, but the rationality differs based on information structure.
      *   **Deliverables:**
          1.  Game Rules & Payoff Scheme.
          2.  Log-Sheet Design (for reconstruction/debrief).
          3.  "What Will Go Wrong" (Failure Modes).
          4.  "What's Missing" (Limitations & Debrief Bridge).
      *   **Constraints:** Printed cards, log sheets, facilitator spreadsheet. No money (tokens/credit). 90 minutes total.

  2.  **Deconstruct the Core Challenge:**
      *   The standard sunk cost lesson is: $Sunk Cost \perp Future Utility$.
      *   The nuance needed is: $Sunk Cost \rightarrow Information \rightarrow Future Utility$ OR $Sunk Cost \rightarrow Reputation \rightarrow Future Utility$.
      *   To make them *feel* identical, the interface must be the same. The difference must be in the *rules of the world* (hidden from players initially or revealed mid-game).
      *   *Idea:* Two phases. Phase 1 is "Blind." Phase 2 is "Screened."
      *   *Better Idea:* Split the class. Half play Condition A, Half play Condition B. Then swap or compare. Given 18 students, 6 teams of 3 is ideal. 3 teams on Condition A, 3 teams on Condition B.
      *   *The Twist:* The prompt asks for participants to discover they generated the *same behavioral profile*. If I split them, they might just compare notes. If I run them sequentially with a rule change they don't notice immediately, that's riskier.
      *   *Refined Idea:* Run two distinct "Portfolios."
          *   Portfolio X (The Fallacy Trap): Projects have independent probabilities. Past investment changes nothing.
          *   Portfolio Y (The Signal Trap): Projects have a "Hidden Quality" revealed only if you fund Round 1. If you fund Round 1 and it survives, Round 2 has high EV. If you quit Round 1, you lose the chance.
      *   *Wait, the prompt asks for:* "Two phases or conditions that are experientially identical but structurally different."
      *   *Solution:* The "R&D Pipeline" Game.
          *   Round 1: Invest in Project A or B.
          *   Round 2: Invest more or Abandon.
          *   *Condition 1 (Fallacy):* Success in Round 2 is random/independent of Round 1 spend.
          *   *Condition 2 (Screening):* Success in Round 2 is correlated with surviving Round 1 (only "good" projects survive the first hurdle).
      *   *Problem:* If I tell them the rules, they know the strategy. The rules must be *implicit* or the learning must happen through play.
      *   *Revised Approach:* The "Black Box" Method.
          *   Teams play 4 rounds.
          *   Rounds 1-2: "Type Alpha" environment (Sunk Costs are irrelevant).
          *   Rounds 3-4: "Type Beta" environment (Sunk Costs are informative signals).
          *   *Crucial:* Do not tell them the environment changed. Let them deduce it (or fail to).
          *   *Actually, better for debrief:* Tell them there are two types of projects, but don't specify which is which until the end. Or, run two parallel games with different rule sheets that look the same but have different underlying probability tables.
          *   *Best for the prompt's specific request ("same behavioral profile"):* Run the *same* game mechanics for everyone, but reveal in the debrief that the *underlying probability structure* differed for different teams (or different rounds).
          *   *Let's go with the "Hidden Regime" design.* All teams play the same interface. Half the teams are assigned "World A" (Fallacy), half "World B" (Signal). They don't know which world they are in. They play. Then we reveal.
          *   *Wait, 90 mins is tight.* 18 students = 6 teams. 3 Teams World A, 3 Teams World B.
          *   *Game Flow:*
              1.  Intro (10 min).
              2.  Round 1 Investment (10 min).
              3.  Round 2 Decision (Continue/Abort) (10 min).
              4.  Resolution & Payoff (10 min).
              5.  Repeat for second scenario? No, let's make it one deep dive with a twist.
              6.  *Actually, to show the "same behavioral profile,"* I need them to make the *same mistake* (or same choice) in both contexts.
              7.  *Design:* Two distinct projects offered sequentially.
                  *   Project 1 (The Trap): High sunk cost, low future EV. (Classic Fallacy).
                  *   Project 2 (The Signal): High sunk cost, high future EV *conditional* on the sunk cost having been incurred (Screening).
                  *   *Challenge:* If I tell them Project 2 is conditional, they won't feel the fallacy.
                  *   *Solution:* The "Vetting" Mechanic.
                  *   All teams get a budget. They choose to fund "Initiatives."
                  *   Initiative requires 2 stages. Stage 1 cost: 10 tokens. Stage 2 cost: 10 tokens. Payout: 50 tokens.
                  *   *World A (Fallacy):* Stage 2 success is 40% regardless of Stage 1.
                  *   *World B (Signal):* Stage 2 success is 80% *if* Stage 1 was funded. (Stage 1 acts as a filter for quality).
                  *   *The Kicker:* The players don't know the probabilities. They have to infer them.
                  *   *The Debrief:* We reveal that Team 1-3 were in World A, Team 4-6 were in World B. Both groups likely hesitated to quit in World A (Fallacy) and hesitated to quit in World B (Rational). The *feeling* of "I've already spent 10, I can't stop" was identical. The *rationale* differed.

      *   *Wait, I need to ensure they actually make the decision.*
      *   Let's refine the "Information Structure."
      *   **Game Name:** "The R&D Pipeline."
      *   **Setup:** 6 Teams. 3 assigned "Regime Alpha," 3 assigned "Regime Beta." They don't know which regime they are in.
      *   **Rounds:** 3 Projects per team.
      *   **Mechanic:**
          *   Each project has Phase 1 (Cost 10) and Phase 2 (Cost 10).
          *   If Phase 2 completed, roll for success. Success = 60 tokens. Failure = 0.
          *   **Regime Alpha (Fallacy):** Phase 2 Success Rate is fixed at 30%. (EV of Phase 2 = 0.3 * 60 - 10 = 8. Wait, 18-10=8. Positive EV? No, need negative EV to make quitting rational).
          *   *Correction:* To make quitting rational in Alpha: Phase 2 Cost = 20. Success Payout = 50. Success Rate = 30%. EV = 15 - 20 = -5. Rational choice: Quit. Sunk Cost = 10 (irrelevant).
          *   **Regime Beta (Signal):** Phase 2 Success Rate depends on "Quality." High Quality projects have 80% success. Low Quality have 10%.
          *   *The Screen:* You only find out if it's High Quality *after* paying Phase 1. If you pay Phase 1, there is a 50% chance the project is "Vetted" (High Quality). If Vetted, Phase 2 EV = 0.8*50 - 20 = 20 (Positive). If Not Vetted, EV = 0.8*50 - 20... wait.
          *   *Simpler Signal:* In Regime Beta, Phase 1 *is* the test. If you survive Phase 1, the probability of Phase 2 success jumps.
          *   *Let's simplify for 90 mins.*
          *   One session. Two Projects.
          *   Project 1: "The Concorde." (Fallacy).
          *   Project 2: "The Venture." (Signal).
          *   *Problem:* If I label them, they adjust.
          *   *Solution:* The "Blind Portfolio."
          *   All teams get 3 Project Cards. They look identical.
          *   Secretly, Teams 1-3 get "Fallacy Deck." Teams 4-6 get "Signal Deck."
          *   They play. They record decisions.
          *   Debrief reveals the decks were different.

      *   *Wait, the prompt asks for:* "Participants should discover... that they generated the *same behavioral profile* in both conditions."
      *   This implies I need them to compare.
      *   Okay, let's lock in the **Split-Class Design**.
      *   **Teams:** 6 Teams of 3.
      *   **Condition A (3 Teams):** "Dead End." Past investment gives NO info on future success.
      *   **Condition B (3 Teams):** "Gatekeeper." Past investment IS a screen. Only projects that pass Round 1 are worth funding in Round 2.
      *   **Interface:** Identical Log Sheets. Identical Token Costs.
      *   **Hidden Variable:** The Probability Table held by the Facilitator.
      *   **Goal:** Both groups will likely "escalate commitment" in Round 2. Group A is irrational. Group B is rational.
      *   **Debrief:** Reveal the tables. Show that the *behavior* (continuing) was the same, but the *normative status* flipped.

  3.  **Drafting the Mechanics:**
      *   **Budget:** 100 Tokens per team.
      *   **Projects:** 3 Projects offered sequentially.
      *   **Structure per Project:**
          *   Stage 1: Invest 20 Tokens. (Sunk).
          *   Decision Point: Continue to Stage 2 or Abandon.
          *   Stage 2: Invest 30 Tokens.
          *   Resolution: Success (Win 100) or Fail (Win 0).
      *   **Condition A (Fallacy):**
          *   Stage 1 is a money sink. It reveals nothing.
          *   Stage 2 Success Probability: 40%.
          *   EV of Stage 2: (0.4 * 100) - 30 = 10. (Wait, if EV is positive, continuing is rational regardless of sunk cost).
          *   *Need Negative EV for Stage 2 to make "Quit" the rational baseline.*
          *   *Revised Condition A:* Stage 2 Success Probability: 20%.
          *   EV of Stage 2: (0.2 * 100) - 30 = -10.
          *   Rational Choice: Abandon at Decision Point. (Ignore the 20 sunk).
          *   Typical Behavior: Continue ("We already spent 20!").
      *   **Condition B (Signal):**
          *   Stage 1 is a Vetting Process.
          *   If you pay Stage 1, you learn the Project Type.
          *   50% of projects are "Lemons" (Stage 2 Success 0%).
          *   50% of projects are "Gems" (Stage 2 Success 80%).
          *   *Crucial:* You don't know if it's a Lemon or Gem until you pay Stage 1.
          *   *Wait, if I know it's a Lemon, I quit. If I know it's a Gem, I continue.*
          *   *How to make it feel like sunk cost?* The players shouldn't know the Type explicitly.
          *   *Alternative Signal:* "Survivor Bias."
          *   In Condition B, *only* projects that succeed in Stage 1 are eligible for Stage 2.
          *   Stage 1: Pay 20. Roll Die. If 1-3, Project Fails immediately (Loss 20). If 4-6, Project Survives to Decision Point.
          *   Decision Point: Continue to Stage 2 (Cost 30) or Quit.
          *   Stage 2 Success: If it survived Stage 1, it has 80% chance of Success in Stage 2.
          *   EV at Decision Point (given survival): (0.8 * 100) - 30 = 50. (Strong Continue).
          *   *Experience:* "We spent 20 to get here. We should finish it."
          *   *Reality:* In Cond A, the 20 bought nothing. In Cond B, the 20 bought *information/screening*.
          *   *The Feeling:* "I don't want to waste the 20."
          *   *The Truth:* Cond A = Waste. Cond B = The 20 was the price of the option.

      *   *Refining Condition B to match the "Sunk Cost" feeling:*
          *   In Cond B, the 20 tokens are technically sunk at the decision point. But the fact that you *have* the option to continue implies the project passed a hidden threshold.
          *   Actually, let's use the "Reputation" angle mentioned in the prompt? No, "Information Structure" is cleaner for a 90-min seminar.
          *   Let's stick to the **Screening Model**.
          *   **Condition A:** Stage 1 is a tax. Stage 2 odds are low (20%).
          *   **Condition B:** Stage 1 is a filter. If you are allowed to make the Stage 2 decision, the odds are high (80%).
          *   *Player View:* Identical. "I paid 20. Do I pay 30 more?"
          *   *Facilitator View:* Cond A teams are burning cash. Cond B teams are harvesting value.
          *   *Behavior:* Both will likely say "Continue" because of the 20 sunk.
          *   *Debrief:* Cond A was irrational. Cond B was rational. The *reasoning* ("We spent 20") was the same. The *validity* differed.

  4.  **Developing the Log Sheet:**
      *   Needs to track: Team ID, Condition (Hidden), Project ID, Stage 1 Cost (Fixed), Decision (Continue/Quit), Stage 2 Cost (If Continue), Outcome, Total Payoff.
      *   Facilitator needs a master key to calculate "Optimal Decision" per row.

  5.  **Anticipating Failure Modes:**
      *   *Collusion:* Teams talking across conditions. (Seat them apart).
      *   *Demand Characteristics:* They know it's a sunk cost class. They might try to "be rational" and quit everything.
          *   *Counter:* Make the stakes feel real (tokens for credit). Make the "Continue" option tempting (high potential payout).
      *   *Subtlety:* They might not notice the structural difference even when told.
          *   *Counter:* Visual aids in debrief showing the EV trees.
      *   *Over-correction:* Teams in Cond A might quit too much if they suspect a trap.
          *   *Counter:* Ensure the "Continue" payoff is high enough that the *temptation* is visceral.

  6.  **Addressing the "Missing Feature" (Career Stakes/Blame):**
      *   The game lacks *agency risk*. In the game, the team absorbs the loss. In reality, a manager might continue a project to avoid admitting a mistake to a boss.
      *   *Debrief Bridge:* Discuss how the game models *epistemic* rationality (information), but real life often involves *political* rationality (survival). The "Sunk Cost Fallacy" might be rational for the *agent* even if irrational for the *principal*.

  7.  **Review against Constraints:**
      *   18 students (6 teams).
      *   90 mins.
      *   Printed cards/sheets.
      *   Tokens/Credit.
      *   Must unsettle the "Always Ignore Sunk Costs" slogan.

  8.  **Final Polish of the Game Logic:**
      *   Make sure the EV calculations are crisp.
      *   **Condition A (The Fallacy):**
          *   Entry Fee: 20.
          *   Option to Invest Additional: 30.
          *   Gross Return on Success: 100.
          *   Prob of Success: 25%.
          *   EV of Additional Investment: (0.25 * 100) - 30 = -5.
          *   **Correct Decision:** Quit. (Sunk 20 is gone).
      *   **Condition B (The Signal):**
          *   Entry Fee: 20.
          *   *Hidden Mechanic:* Only "High Potential" projects survive the Entry Fee. (50% of projects die at Entry, 50% survive).
          *   If you are at the Decision Point, you *know* (implicitly) you have a High Potential project.
          *   Prob of Success (Conditional on reaching Decision): 80%.
          *   EV of Additional Investment: (0.80 * 100) - 30 = +50.
          *   **Correct Decision:** Continue.
      *   **The Trap:** In both cases, the player thinks: "I've spent 20. If I quit, I lose 20. If I continue, I might win."
      *   In A, this reasoning is flawed (20 is gone, future is negative).
      *   In B, this reasoning is accidentally correct (20 is gone, but future is positive *because* you spent the 20).
      *   **Wait, one nuance:** In B, the 20 isn't just sunk; it's the *price of the signal*. The reasoning "I've spent 20" is still technically fallacious *if* that's the only reason. The reason must be "The fact that I *could* spend the 20 and reach this stage tells me the project is good."
      *   *Debrief Point:* The *heuristic* ("Don't waste the investment") led to the right action in B and wrong in A. This shows heuristics aren't inherently irrational; context determines validity.

  9.  **Structuring the Output:**
      *   Game Title.
      *   Setup & Materials.
      *   Rules (Player View vs. Facilitator View).
      *   Log Sheet Design.
      *   Run of Play (Timeline).
      *   Failure Modes.
      *   Limitations & Debrief Bridge.

  10. **Refining the "Over-correction" request:**
      *   The prompt asks: "build in a way for some teams to over-correct — abandoning too readily."
      *   *How?* Add a "Audit" mechanic. If they quit too many projects in Condition B, they lose reputation points? No, too complex.
      *   *Better:* In the debrief, highlight that *some* teams might have quit in Condition B because they were "too smart" for their own good, trying to avoid the fallacy. This illustrates the risk of rigid adherence to rules without context.
      *   *Actually, I can build it into the game:* Add a "Random Audit" round where quitting incurs a penalty. No, keeps it simple.
      *   *Best approach:* Address this in the "What Will Go Wrong" and "Debrief" sections. The *tendency* to over-correct is a predictable human reaction to being taught the fallacy. I will note this in the "Failure Modes" and "Debrief" sections as requested.

  11. **Final Check on Time:**
      *   10 min Intro.
      *   10 min Team Setup.
      *   30 min Gameplay (3 Rounds x 10 mins).
      *   40 min Debrief (Crucial).
      *   Total: 90 mins. Tight but doable.

  12. **Writing the Response:** (Self-Correction during drafting)
      *   Ensure the distinction between "Sunk Cost as Fallacy" and "Sunk Cost as Signal" is crystal clear in the Facilitator Notes.
      *   Make the Log Sheet easy to scan.
      *   Be honest about the limitations (political stakes).

  *(Self-Correction on Condition B Logic)*: If 50% of projects die at Entry, do the players know that?
  *   If they know, they update beliefs.
  *   If they *don't* know, they just feel "Lucky to be here."
  *   To make it experientially identical to Condition A, they should *not* know the survival rate explicitly. They just know "We paid 20, we are now at the decision point."
  *   In Cond A: Paying 20 gets you to decision point 100% of the time.
  *   In Cond B: Paying 20 gets you to decision point 50% of the time (the other 50% fail immediately).
  *   *Wait, if Cond B projects fail immediately, the team loses 20 and no decision point.*
  *   *Yes, that works.* It reduces the number of decisions for Cond B teams.
  *   *Adjustment:* To keep decision count equal, Cond B teams get 6 Project Cards, but only ~3 survive to Decision Point. Cond A teams get 3 Project Cards, all 3 survive to Decision Point.
  *   *Better:* Keep it simple. All teams get 3 Decision Points.
      *   Cond A: You pay 20. You are at Decision Point. (Success rate 25%).
      *   Cond B: You pay 20. You roll. If Fail (50%), project dies, you lose 20, no decision. If Pass (50%), you are at Decision Point. (Success rate 80%).
      *   *Issue:* Cond B teams might have fewer decisions.
      *   *Fix:* Cond B teams draw from a larger deck until they have 3 Decision Points.
      *   *Simpler Fix:* Just accept the variance. It adds realism. Or, make the "Screening" invisible.
      *   *Invisible Screening:* In Cond B, *all* projects reach the decision point, BUT the *probability* of success is correlated with the fact that the project was *offered* to you.
      *   *No, let's stick to the "Vetting" idea.* It's the standard economic justification for sunk costs (Stiglitz/Weiss style screening).
      *   *Revised Plan for Equality:*
          *   All teams play 3 Rounds.
          *   Cond A: Round 1 Cost 20. Decision Point. Success Prob 25%.
          *   Cond B: Round 1 Cost 20. *Hidden Roll.* If Pass (50%), Decision Point. Success Prob 80%. If Fail (50%), Project dies, you lose 20, immediately start next Round (to keep pace).
          *   This ensures equal time usage.

      *   *Wait, one more thing:* The prompt asks for "Two phases or conditions that are experientially identical."
      *   If Cond B teams have projects dying immediately, they experience "Bad Luck." Cond A teams experience "Steady Grind."
      *   *Better:* Make the Screening *retroactive*.
      *   No, that's magic.
      *   *Okay, the "Reputation" angle might be easier to equalize.*
      *   Let's go with the **Information Asymmetry** model.
      *   Both groups play the exact same interface.
      *   Group A: The world is "Memoryless." Past spend = 0 info.
      *   Group B: The world is "Path-Dependent." Past spend = Signal of Quality.
      *   I will implement the "Vetting" mechanic but smooth the pacing.

      *   *Final Decision on Mechanics:*
          *   **Condition A (Fallacy):** Every project reaches Stage 2. Stage 2 EV is Negative.
          *   **Condition B (Signal):** Every project reaches Stage 2. BUT, the Facilitator secretly assigns "High Quality" to projects where Stage 1 was funded. (This is hard to simulate without complex cards).
          *   *Let's go with the Card Deck method.*
          *   Deck A (Fallacy): 10 Cards. All have Stage 2 Prob = 20%.
          *   Deck B (Signal): 10 Cards. 5 are "Dead" (Stage 1 fails, no decision). 5 are "Live" (Stage 1 succeeds, Stage 2 Prob = 80%).
          *   Teams draw until they have 3 "Decision Points."
          *   This equalizes the number of decisions for the Log Sheet.

      *   *Wait, I need to make sure the "Sunk Cost" feeling is present in B.*
      *   In B, the 20 tokens are still sunk. The rational reason to continue is the *updated probability*, not the sunk cost. But the *psychological driver* is the same ("I don't want to waste the 20").
      *   This fits the prompt perfectly.

      *   *Let's write it.*
answer: |-
  # Game Design: "The Pipeline Protocol"

  ## 1. Game Overview & Learning Objective
  **Title:** The Pipeline Protocol
  **Time:** 90 Minutes
  **Participants:** 18 Students (6 Teams of 3)
  **Objective:** To demonstrate that the *behavior* of honoring sunk costs can be identical in two different environments, yet be irrational in one (Fallacy) and rational in the other (Screening/Signal). The goal is to break the heuristic "Ignore Sunk Costs Always" and replace it with "Analyze the Information Structure."

  ## 2. Materials Required
  *   **Token Economy:** 100 "Research Credits" (RC) per team (printed chits or spreadsheet tally).
  *   **Project Cards:** 2 Decks (Deck Alpha, Deck Beta). Cards look identical from the back.
  *   **Team Log Sheets:** One per team (see Section 4).
  *   **Facilitator Master Sheet:** Spreadsheet to track hidden probabilities and outcomes.
  *   **Seating:** Split the room. Teams 1–3 (Alpha) on Left, Teams 4–6 (Beta) on Right. Instruct them not to discuss specific card outcomes during play.

  ## 3. Rules & Mechanics

  ### The Player Interface (Identical for All Teams)
  1.  **Budget:** Each team starts with **100 RC**.
  2.  **Goal:** Maximize final RC balance.
  3.  **Process:** You will evaluate **3 Projects** sequentially.
  4.  **Stage 1 (Vetting):** To consider a project, pay **20 RC**.
  5.  **Decision Point:** After paying Stage 1, you are offered the chance to proceed to Stage 2. You may **ABANDON** (lose the 20 RC) or **INVEST** (pay additional **30 RC**).
  6.  **Stage 2 (Resolution):** If you Invest, the project resolves.
      *   **Success:** Payout **100 RC**.
      *   **Failure:** Payout **0 RC**.
  7.  **Constraint:** You cannot carry over unused budget to the next seminar session.

  ### The Hidden Structure (Facilitator Eyes Only)
  *This is the critical divergence. Players do not know which Condition they are in.*

  **Condition Alpha (The Fallacy Trap) — Teams 1, 2, 3**
  *   **Structure:** Memoryless Environment.
  *   **Stage 1:** Always succeeds in bringing you to the Decision Point. (The 20 RC buys access only).
  *   **Stage 2 Probability:** Fixed at **25%**.
  *   **EV Calculation at Decision Point:**
      *   Expected Return: $0.25 \times 100 = 25$ RC.
      *   Cost to Continue: $30$ RC.
      *   Net EV: $-5$ RC.
  *   **Rational Choice:** **ABANDON.** (The 20 RC is sunk; the future is negative).

  **Condition Beta (The Signal Screen) — Teams 4, 5, 6**
  *   **Structure:** Screening Environment.
  *   **Stage 1:** Acts as a quality filter.
      *   *Hidden Roll:* When a team pays 20 RC, flip a coin (or draw from sub-deck).
      *   **50% Chance (Lemon):** Project fails immediately at Stage 1. Team loses 20 RC. **No Decision Point.** Team immediately draws next Project Card to maintain pace.
      *   **50% Chance (Gem):** Project survives to Decision Point.
  *   **Stage 2 Probability (Conditional on Survival):** **80%**.
  *   **EV Calculation at Decision Point:**
      *   Expected Return: $0.80 \times 100 = 80$ RC.
      *   Cost to Continue: $30$ RC.
      *   Net EV: $+50$ RC.
  *   **Rational Choice:** **INVEST.** (The 20 RC is sunk, *but* the fact that you reached this point signals high quality).

  ### Run of Play (90 Minutes)
  1.  **Setup (10 min):** Distribute tokens, log sheets, and sealed Project Cards. Assign Conditions (Alpha/Beta) secretly.
  2.  **Gameplay (35 min):** Teams play through 3 Decision Points. Facilitator circulates, resolving Stage 2 rolls privately (use a die or app) so teams don't hear each other's success rates.
      *   *Pacing Note:* Beta teams may burn through cards faster due to "Lemon" failures. Have extra cards ready so they still complete 3 Decision Points.
  3.  **Data Lock (5 min):** Collect Log Sheets. Calculate final scores.
  4.  **The Reveal & Debrief (40 min):**
      *   Reveal that there were two different worlds.
      *   Project the EV trees for Alpha vs. Beta.
      *   Compare behavioral profiles (Likely both groups "Invested" heavily).
      *   Discuss the normative difference.

  ## 4. Log-Sheet Design
  *Design this to allow you to reconstruct the normative status of every decision during debrief.*

  **Team ID:** \_\_\_\_\_ **Condition:** [BLANK]

  | Project | Stage 1 Cost (Sunk) | Decision (Circle) | Stage 2 Cost | Outcome (Success/Fail) | Net Change | **Facilitator: Was Continue Rational?** |
