prompt: |-
  You are a professional philosopher specializing in social epistemology, with particular expertise in the epistemology of testimony, and a track record of helping institutions turn epistemological principles into workable procedures. Please think carefully before writing: you may find it useful to briefly work through, in your own reasoning, how the reductionism/anti-reductionism debate about testimonial justification bears on institutional intake decisions, and where any simplification is bound to lose something the theory cares about.

  Here is my situation. I direct the intake office of a research university's research-integrity office. Most allegations of misconduct reach us as testimony in the ordinary sense — a person tells us what they saw, heard, or was told — and most of it arrives uncorroborated: a departing postdoc describes how figures in a published paper were produced; a technician says the principal investigator had them rerun analyses until significance appeared; someone writes in alleging fabricated data. We get a dozen or so files a month. The stakes are high in both directions: opening a formal inquiry on thin grounds damages careers and invites retaliation claims; sitting on a credible complaint lets misconduct stand. Each intake pass is budgeted at under an hour, my investigators are trained in interviewing but not in philosophy, and any decision to close a file without inquiry requires my signature.

  The problem is that my two intake investigators disagree at the level of theory, and it shows in their recommendations. One holds, roughly, the reductionist position associated with Elizabeth Fricker's side of the literature: a person's say-so justifies belief only to the extent that we have independent, inductively grounded reason to think this kind of person is reliable about this kind of claim, so uncorroborated testimony should never by itself move a file forward. The other holds the anti-reductionist position associated with Coady: in the absence of defeaters, testimony carries a defeasible entitlement, so the default is to credit a sincere, competent informant until a defeater appears, and the burden falls on doubt. What I need is a single procedure both of them can run and sign off on.

  Please write that procedure. It should specify, in a fixed order: the questions to ask about an incoming allegation; what counts as a sufficient answer to each and what sends the file back for more information; where the procedure terminates in an "open formal inquiry" recommendation, a "seek corroboration first" hold, or a "no basis" close; and which questions are questions of institutional values — proportionality, the harm of investigation itself, protection of complainants — that the procedure must hand to me rather than decide. Be explicit about defeaters: distinguish undercutting defeaters (reasons to think the informant cannot tell, or cannot be expected to tell, the truth in this context) from rebutting defeaters (independent evidence that what they say is false), with a few examples of each that we can actually check during an intake interview. Include a corroboration ladder: which kinds of independent support move a claim how far, and what does not count as corroboration at all (a second person repeating the same rumor, for instance). And be candid about the steps where the two philosophical camps genuinely part ways, what the procedure does at those steps, and why that choice is defensible from both sides rather than a covert victory for one of them.

  Then run the procedure on three files. First: a named, self-identifying former lab member alleges that images in a 2019 paper by a well-funded principal investigator were duplicated; the informant is calm, specific, has nothing apparent to gain, and offers no documents. Second: an anonymous email alleging that a graduate student fabricated survey responses; the email is vague about particulars but contains one detail that is not public. Third — a case where the procedure returns a recommendation I will not like: a sincere-seeming complainant with a documented grievance against a popular and well-supported researcher, whose account is internally consistent, and where I would prefer to close the file but the procedure says open an inquiry. In this last case, explain how the procedure handles the temptation my investigators will feel to treat personal distrust of a complainant as a defeater when no actual defeater is present.

  Finally, state plainly what the procedure cannot do: where the epistemology of testimony simply has no answer an intake procedure can borrow, and where the procedure relies on sincerity cues — hesitation, level of detail, demeanor — that it uses but must not pretend are evidence of truth.

  One constraint: do not provide citations, bibliographies, or reading lists. Ground everything in the theory described inline, so that a reader with no access to the literature could run the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in social epistemology (testimony) and institutional procedure design.
      *   **Task:** Create a single intake procedure for a university research integrity office that bridges the gap between Reductionist (Fricker-esque) and Anti-Reductionist (Coady-esque) views on testimonial justification.
      *   **Context:** High stakes (careers vs. integrity), high volume (12/month), low time budget (<1 hour/file), untrained staff (in philosophy).
      *   **Requirements:**
          *   Fixed order of questions.
          *   Criteria for sufficient answers/holds.
          *   Termination points (Open Inquiry, Seek Corroboration, No Basis).
          *   Distinction between epistemic questions and institutional value questions (reserved for the Director).
          *   Explicit handling of Defeaters (Undercutting vs. Rebutting) with examples.
          *   Corroboration Ladder (what counts, what doesn't).
          *   Candid admission of where the philosophical camps diverge and how the procedure navigates this without favoring one covertly.
          *   Application to three specific cases (including one where the procedure forces an unwanted inquiry).
          *   Explanation of how to handle the temptation to treat personal distrust as a defeater.
          *   Statement of limitations (what epistemology can't do, reliance on sincerity cues).
          *   **Constraint:** No citations/bibliographies. Ground theory inline.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Reductionism (Fricker):* Testimony isn't fundamental. Belief based on testimony needs positive reasons (inductive evidence) to think the source is reliable *in this instance*. Uncorroborated testimony is weak.
      *   *Anti-Reductionism (Coady):* Testimony is a basic source of knowledge (like perception). We have a default right to believe unless there are specific reasons not to (defeaters).
      *   *The Tension:* Reductionism demands *proof of reliability* before acting. Anti-Reductionism demands *proof of unreliability* before dismissing.
      *   *The Bridge:* A "Moderate Default" procedure. We cannot afford the Reductionist's demand for full independent verification *before* intake (paralysis), but we cannot afford the Anti-Reductionist's blind trust (floodgates). The solution is a *presumption of credibility subject to immediate screening for defeaters and contextual reliability markers*. This treats testimony as *prima facie* valid (Anti-Reductionist) but requires a "sensitivity check" on the context of transmission (Reductionist).

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Step 1: Initial Screening (The "Defeater Check").* This satisfies the Anti-Reductionist (default is open) but allows the Reductionist to filter out obvious noise. Focus on Undercutting (source ability/motive) and Rebutting (contradictory facts).
      *   *Step 2: Content Specificity (The "Reductionist Check").* Even if no defeaters exist, is the testimony *rich* enough to justify belief? Specificity acts as a proxy for reliability without needing external proof yet.
      *   *Step 3: Corroboration Ladder.* Define what moves the needle. Documents > Physical Evidence > Second Witness > Rumor.
      *   *Step 4: Institutional Values (The "Director's Gate").* Epistemology tells us if it's *true*, not if it's *worth* investigating. Harm, resources, proportionality go here.
      *   *Step 5: Decision Matrix.* Combine the above into clear outcomes.

      *   *Addressing the Divergence:* I need to explicitly state where the compromise happens. The compromise is treating testimony as *sufficient for preliminary assessment* but *insufficient for formal inquiry without specificity or low-level corroboration*. This respects the Anti-Reductionist's "default trust" by not dismissing immediately, but respects the Reductionist's "need for reasons" by requiring specificity/contextual markers before escalating.

  4.  **Developing the Defeater Taxonomy:**
      *   *Undercutting:* Attacks the connection between the belief and the truth. (e.g., "I was drunk," "I heard this from X who hates the PI," "I didn't see it myself").
      *   *Rebutting:* Attacks the content directly. (e.g., "The paper says 2020, they say 2019," "Metadata shows file created after publication").

  5.  **Developing the Corroboration Ladder:**
      *   Level 1: Documentary/Physical (Raw data, emails).
      *   Level 2: Independent Witness (Someone who saw the act, not the rumor).
      *   Level 3: Contextual Consistency (Details match public record).
      *   *Not Corroboration:* Hearsay, character attacks, vague alignment.

  6.  **Running the Cases:**
      *   *Case 1 (Named Postdoc, Image Duplication):* High specificity, named source, no obvious defeaters. Likely "Open Inquiry."
      *   *Case 2 (Anonymous, Vague + 1 Detail):* Anonymous is an undercutting risk (can't assess credibility). Vague is low specificity. One detail is weak corroboration. Likely "Seek Corroboration."
      *   *Case 3 (Grievance vs. Popular PI):* The hard case. Sincere, consistent, no defeaters. Procedure says "Open." I need to explain why "personal distrust" isn't a defeater. This is crucial for the prompt's requirement on handling temptation.

  7.  **Addressing Limitations:**
      *   Epistemology can't solve resource constraints.
      *   Sincerity cues (demeanor) are not truth indicators (psychology vs. epistemology).
      *   The procedure can't detect sophisticated fabrication.

  8.  **Refining the Tone:**
      *   Professional, authoritative, philosophical but practical.
      *   Avoid jargon where possible, or define it inline.
      *   Ensure the "Director's Gate" is clear (values vs. facts).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I favor one side? *Correction:* Ensure the "Default" is trust (Anti-Reductionist) but the "Threshold for Action" requires positive markers (Reductionist). This is the "Moderate Default" compromise.
      *   *Check:* Did I include the "Director's Gate"? *Yes, Step 4.*
      *   *Check:* Did I explain the divergence? *Yes, in the "Philosophical Architecture" section.*
      *   *Check:* Case 3 explanation? *Must emphasize that motive (grievance) is not an undercutting defeater unless it implies fabrication, which requires evidence.*

  10. **Final Polish:** Check constraints (no citations, specific structure). Ensure the distinction between Undercutting and Rebutting is clear and actionable for non-philosophers. (e.g., Undercutting = "Why you might be wrong/unable to know"; Rebutting = "Why what you say is false").

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure says "Open" but the Director wants to "Close." I need to make sure the procedure *forces* the Open recommendation based on epistemic grounds, leaving the Director to overrule based on *institutional values* if they choose, but acknowledging the epistemic cost. Actually, the prompt says "explain how the procedure handles the temptation... to treat personal distrust... as a defeater." So the procedure should mandate opening, and the explanation must defend that mandate against the Director's intuition.

  *(Refining the "Bridge")*: The key is to frame the intake not as a *verdict* on truth (which Reductionists want) nor a *blind acceptance* (which Anti-Reductionists might tolerate), but as a *warrant for investigation*. Testimony provides *probable cause* unless defeated. This satisfies the Anti-Reductionist (testimony has weight) and the Reductionist (we check for reliability indicators before committing resources).

  Let's write.

  *Structure:*
  1.  Introduction/Philosophical Architecture (The Bridge).
  2.  The Intake Procedure (Steps 1-5).
  3.  Defeater Taxonomy & Corroboration Ladder.
  4.  Case Studies (1, 2, 3).
  5.  Limitations & Sincerity Cues.

  *Key constraint check:* No citations. Ground theory inline.
  *Key constraint check:* Explicitly state where camps part ways.
  *Key constraint check:* Case 3 must show the procedure working against the Director's preference.

  *Drafting the Defeater section:* Make sure examples are concrete for intake officers.
  *Drafting the Values section:* Ensure it's clear this is where the Director steps in.

  *Final Review of the "Bridge":*
  Reductionist worry: "Don't believe without reasons."
  Anti-Reductionist worry: "Don't demand reasons for basic trust."
  Procedure: "Accept testimony as a *claim* (Anti-R), but require *indicia of reliability* to escalate to *investigation* (R)." This distinguishes *believing the accuser* from *believing the accusation is proven*. The intake decides if the accusation is *worthy of testing*, not if it is *true*. This is the crucial epistemic shift. Testimony justifies *inquiry*, not necessarily *judgment*.

  Okay, ready to generate response.
answer: |-
  ### Procedural Memorandum: Intake Assessment of Testimonial Allegations

  **To:** Intake Investigators
  **From:** Director, Research Integrity Office
  **Subject:** Unified Intake Procedure for Testimonial Allegations

  **1. Philosophical Architecture: Bridging the Theoretical Divide**

  This procedure is designed to resolve the tension between two valid epistemological approaches to testimony.

  *   **View A (Reductionist):** Holds that we need positive reasons to trust a speaker before believing them. In our context, this warns against opening inquiries on "say-so" alone.
  *   **View B (Anti-Reductionist):** Holds that we are entitled to trust a speaker unless we have specific reasons not to. In our context, this warns against dismissing credible complainants due to excessive skepticism.

  **The Compromise:** This procedure treats testimony as **sufficient to warrant attention** (satisfying View B) but **insufficient to warrant formal inquiry without markers of reliability** (satisfying View A). We do not ask investigators to decide if the allegation is *true* at intake. We ask them to decide if the testimony provides a **warrant for investigation**.

  **Where the Camps Diverge and How We Navigate It:**
  The genuine philosophical split occurs at the threshold of action. View A wants independent verification *before* action. View B wants action *unless* verification fails.
  *   **Procedure Decision:** We adopt a **Presumption of Competence**. We assume the complainant is sincere and competent *unless* a specific defeater is identified. However, to move from "Presumption" to "Inquiry," the testimony must contain **Internal Specificity** or **External Corroboration**.
  *   **Why this is defensible:** It respects View B by not demanding the complainant prove their reliability upfront (which silences victims). It respects View A by requiring the *content* of the testimony to bear markers of reliability (specificity, consistency) before expending institutional resources. Neither side gets a total victory, but both prevent the worst errors (View A prevents witch hunts; View B prevents cover-ups).

  ---

  ### 2. The Intake Procedure (Fixed Order)

  **Time Budget:** 45 Minutes for Review + 15 Minutes for Decision.
  **Goal:** Determine epistemic warrant for inquiry, not truth of allegation.

  #### Step 1: The Defeater Scan
  *Goal: Identify reasons to reject the testimony immediately.*
  Review the file for **Defeaters**. If a Defeater is present, the file moves to "Seek Corroboration" or "No Basis" regardless of sincerity.

  *   **Action:** Check for Undercutting and Rebutting Defeaters (see Taxonomy below).
  *   **If Defeater Found:** Document it. Do not proceed to Step 3. Move to Decision Matrix.
  *   **If No Defeater Found:** Proceed to Step 2.

  #### Step 2: Internal Specificity Check
  *Goal: Assess the testimonial content for markers of reliability.*
  Even without defeaters, vague testimony lacks the weight to justify an inquiry.

  *   **Question:** Does the testimony identify the *Who, What, Where, When,* and *How* with sufficient granularity that an investigator could know what to look for?
  *   **Sufficient Answer:** "Figure 3B in the 2019 Paper is a duplicate of Figure 1A in the 2017 Thesis, rotated 180 degrees." (Actionable).
  *   **Insufficient Answer:** "The data looks fake." or "They always cheat." (Not Actionable).
  *   **If Insufficient:** File is held for "Seek Corroboration."
  *   **If Sufficient:** Proceed to Step 3.

  #### Step 3: The Corroboration Ladder
  *Goal: Weight the testimony against available independent support.*
  Assign the allegation a "Corroboration Level."

  *   **Level 1 (Strong):** Documentary/Physical Evidence provided (raw data, emails, lab notebooks).
  *   **Level 2 (Moderate):** Independent Witness (someone who saw the act, not the rumor).
  *   **Level 3 (Weak):** Contextual Consistency (non-public details in the allegation match known facts).
  *   **Level 0 (None):** Uncorroborated testimony.
  *   **Note:** A second person repeating the rumor is **Level 0**. This is hearsay, not corroboration.

  #### Step 4: Institutional Values Gate (Director Only)
  *Goal: Separate epistemic warrant from institutional risk.*
  **Investigators do not decide this step.** If Steps 1-3 recommend "Open Inquiry," the file passes to the Director.

  *   **Questions for Director:**
      *   Is the cost of inquiry proportional to the severity of the alleged misconduct?
      *   Does opening this inquiry pose a disproportionate risk of retaliation or harm to the complainant?
      *   Are there resource constraints that make inquiry impossible at this time?
  *   **Outcome:** The Director may override an "Open Inquiry" recommendation *only* on these grounds, not on epistemic grounds.

  #### Step 5: Decision Matrix
  Combine Steps 1-3 to reach a recommendation.

  | Defeaters (Step 1) | Specificity (Step 2) | Corroboration (Step 3) | **Recommendation** |
  | :--- | :--- | :--- | :--- |
  | **Present** | Any | Any | **No Basis / Close** (Unless Level 1 Corroboration overrides Undercutting) |
  | **Absent** | **Low** | Level 0 | **Seek Corroboration First** (Hold File) |
  | **Absent** | **Low** | Level 1 or 2 | **Open Formal Inquiry** (Evidence carries the weight) |
  | **Absent** | **High** | Level 0 | **Open Formal Inquiry** (Testimony specificity carries the weight) |
  | **Absent** | **High** | Level 1, 2, or 3 | **Open Formal Inquiry** |

  ---

  ### 3. Defeater Taxonomy & Corroboration Ladder (Reference Guide)

  **A. Defeaters**
  Investigators must distinguish between reasons to doubt the *person* and reasons to doubt the *claim*.

  1.  **Undercutting Defeaters (Attacks the Source/Connection):**
      *   *Definition:* Reasons to think the informant cannot tell, or cannot be expected to tell, the truth in this context.
      *   *Checkable Examples:*
          *   **Access:** "I was fired six months before the data was generated." (No access).
          *   **Capacity:** "I heard this at a bar." (Hearsay/Intoxication context).
          *   **Incentive:** "I am currently suing the PI for wrongful termination and this allegation is in my legal filing." (Strong motive to fabricate *requires* higher corroboration).
          *   **Inconsistency:** "In my first email I said 2019, now I say 2021." (Memory instability).

  2.  **Rebutting Defeaters (Attacks the Content):**
      *   *Definition:* Independent evidence that what they say is false.
      *   *Checkable Examples:*
          *   **Timeline:** "They say the experiment happened in July, but the lab was closed for renovation."
          *   **Authorship:** "They claim they did the work, but the lab notebook is in another researcher's handwriting."
          *   **Public Record:** "They claim the paper was retracted, but it is still active."

  **B. Corroboration Ladder**
  *   **Level 1 (Documents):** Raw data files, emails, dated lab notebooks. *Moves file directly to Inquiry even with moderate specificity.*
  *   **Level 2 (Witness):** A second person who *saw* the manipulation. *Moves file to Inquiry.*
  *   **Level 3 (Context):** The allegation contains a detail not public (e.g., "The centrifuge broke on Tuesday") which is verified true. *Supports High Specificity testimony.*
  *   **Level 0 (Non-Corboration):**
      *   "Everyone in the lab knows it." (Rumor).
      *   "The PI has a bad reputation." (Character evidence).
      *   A second anonymous email repeating the first claim. (Hearsay).

  ---

  ### 4. Case Applications

  **Case 1: The Named Postdoc**
  *   **Facts:** Named former lab member. Allegation: Image duplication in 2019 paper. Calm, specific ("Panel B is Panel A rotated"). No documents. No apparent gain.
  *   **Step 1 (Defeaters):** None. Access confirmed (former member). No obvious motive to lie.
  *   **Step 2 (Specificity):** High. "Panel B is Panel A rotated" is actionable.
  *   **Step 3 (Corroboration):** Level 0 (No documents provided yet).
  *   **Matrix:** Absent Defeaters + High Specificity + Level 0 = **Open Formal Inquiry**.
  *   **Reasoning:** The specificity of the claim acts as a proxy for reliability (satisfying Reductionist concerns) without requiring the complainant to prove the fraud themselves (satisfying Anti-Reductionist concerns). The testimony provides probable cause.

  **Case 2: The Anonymous Email**
  *   **Facts:** Anonymous. Allegation: Grad student fabricated survey responses. Vague ("they cheated"). One non-public detail (specific software version used).
  *   **Step 1 (Defeaters):** Undercutting Defeater Present. Anonymity prevents assessment of sincerity, competence, or motive. We cannot verify access.
  *   **Step 2 (Specificity):** Low. "They cheated" is not actionable.
  *   **Step 3 (Corroboration):** Level 3 (Weak). The software version detail matches internal records.
  *   **Matrix:** Defeater Present + Low Specificity = **Seek Corroboration First**.
  *   **Reasoning:** The anonymity undercuts the default entitlement to trust. The one correct detail is not enough to override the inability to question the source. We must find Level 1 or 2 corroboration before risking a student's career.

  **Case 3: The Grievance (The Hard Case)**
  *   **Facts:** Sincere complainant. Documented prior grievance against Popular PI. Account is internally consistent. Specific. No documents.
  *   **Director's Intuition:** Close the file. The complainant has a axe to grind; the PI is a star; an inquiry will be messy.
  *   **Procedure Application:**
      *   **Step 1 (Defeaters):** The prior grievance is a *potential* motive, but is it an Undercutting Defeater? Only if it proves fabrication. A grudge does not prove lying. Unless there is evidence the complainant has lied *before*, this is not a formal defeater. It is a context marker.
      *   **Step 2 (Specificity):** High (per prompt).
      *   **Step 3 (Corroboration):** Level 0.
      *   **Matrix:** Absent Defeaters + High Specificity = **Open Formal Inquiry**.
  *   **Handling the Temptation:**
      *   Investigators will feel distrust. The procedure forbids treating "personal distrust" or "prior conflict" as an Undercutting Defeater without evidence of *testimonial unreliability*.
      *   **Why:** A prior grievance explains *why* they are speaking, not *that* they are lying. To treat conflict as a defeater is to assume that only those with no motive speak truth, which is empirically false (whistleblowers often have grievances).
      *   **Safeguard:** If investigators feel the grievance undermines credibility, they must categorize it as "Context for Investigation" (passed to the inquiry team) rather than "Reason to Dismiss." The inquiry team can test the claim; the intake team cannot. Closing the file here privileges the PI's reputation over the epistemic weight of the testimony, violating the Presumption of Competence.

  ---

  ### 5. Limitations & Candor

  **What This Procedure Cannot Do**

  1.  **Truth Detection:** This procedure assesses the *warrant for inquiry*, not the *truth of the claim*. A file opened under this procedure may still result in a finding of "No Misconduct." Epistemology of testimony justifies *belief formation*, but institutional integrity requires *verification*. We are using testimony to trigger verification, not to replace it.
  2.  **Sincerity Cues:** The procedure relies on investigators noting demeanor (calm, specific, consistent). **Be candid:** These are not evidence of truth. Liars can be calm; truth-tellers can be hysterical. We use these cues only as proxies for *stability of testimony*, not veracity. Do not record "seemed honest" as a finding. Record "account remained consistent under questioning."
  3.  **Sophisticated Fabrication:** If a complainant provides forged documents (Level 1 Corroboration that is fake), this procedure will recommend an Inquiry. Epistemology cannot detect high-fidelity forgery at intake. This is a known risk accepted to avoid dismissing genuine claims.
  4.  **Resource Reality:** Epistemology says "believe until defeated." Institutional reality says "we have no money." If the Director closes a file at Step 4 due to resources, acknowledge this is an *administrative* closure, not an *epistemic* one. The file is "Closed: Resource Constraints," not "Closed: No Basis." This preserves the integrity of the epistemic record.

  **Final Instruction to Investigators:**
  Your role is not to be a judge of guilt, nor a blind believer. You are a filter for *actionability*. If the testimony is specific and undefeated, it demands a response. If you close a file because "it feels like a grudge" without a specific Undercutting Defeater, you have violated the procedure. If you open a file because "they seemed nice" without Specificity, you have violated the procedure. Stick to the matrix.
