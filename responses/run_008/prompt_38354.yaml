      2.  *Foreshadowing:* If foreshadowing implies the ending was legally derivable, it kills suspense. If it implies the ending was emotionally earned through prior choices, it deepens tragedy. Use it to signal consequence, not destiny.
      3.  *Intelligibility:* Readers do not require a general law to find a story intelligible; they require coherence of character. A novel owes readers emotional logic, not historical theory. If you refuse pattern, you must offer psychological continuity.
      4.  *Synthesis:* Your draft currently favors Narrative Explanation (this happened because that happened). This is generally stronger for fiction because it preserves agency. However, without *some* sense of pattern (the mill town archetype), the saga lacks thematic weight. The craft solution is to let the "laws" of economics set the stage, but let the "narrative" of relationships write the script.

