answer: |-
  Your notes demonstrate a sophisticated grasp of the literature surrounding the two-envelope paradox. You have correctly identified that the standard resolution relies on finiteness assumptions that are not logically necessary for the setup of the problem. Below are my comments addressing your specific questions, followed by an overall assessment.

  **1. Is the infinite-mean claim right?**
  Yes, your mathematical intuition is correct. It is well-established in the decision-theoretic literature (see, for example, Broome 1995 or McGrew 1999) that there exist proper prior distributions with infinite means where the conditional expected value of the other envelope exceeds the observed amount $x$ for every possible $x$.

  To be precise, if you define the smaller amount $Y$ on a support of powers of 2 (i.e., $2^k$ for $k \ge 0$) with a geometric prior $P(Y=2^k) = (1-r)r^k$, the prior is proper for any $0 < r < 1$. The condition for switching to be always favourable is $r > 1/2$. However, the expected value of $Y$ is finite only if $2r < 1$ (i.e., $r < 1/2$). Therefore, for any $r$ in the range $[1/2, 1)$, you have a proper prior with an infinite mean where switching is conditionally favourable for every observed value. Your claim that the conditional argument is not an arithmetic error in this specific case is sound.

  **2. Does this strengthen or undermine the standard resolution?**
  It neither undermines nor strictly strengthens the standard resolution; rather, it delineates its boundary conditions. The standard resolution correctly identifies that the naive 50/50 assumption is incompatible with a proper prior *of finite mean*. Your observation shows that if one relinquishes the finite mean requirement, the naive conclusion (always switch) can be derived via correct Bayesian updating.

  This suggests the standard resolution is incomplete rather than incorrect. It resolves the paradox for all physically realistic scenarios (where money is bounded), but it fails to address the conceptual tension that arises in the idealised infinite case. Your essay would do well to frame the standard resolution as the 'finite case' solution, while positioning your central claim as the 'infinite case' complication.

  **3. Is the diagnosis of a clash between valuations correct?**
  Your diagnosis is insightful, but I would suggest a slight refinement. The clash between unconditional symmetry and conditional advantage arises *because* expected value ceases to guide action coherently when means are infinite.

  In the infinite-mean case, the unconditional expected gain from switching is undefined (effectively $\infty - \infty$). Therefore, the symmetry argument ($E[\text{switch}] = E[\text{stay}]$) loses its normative force because the expectations do not exist as real numbers. Meanwhile, the conditional expectations are finite and well-defined for any observed $x$.

  Consequently, describing this as a case where "expected value simply ceases to guide action" is arguably the more fundamental point. The clash is symptomatic of the breakdown of expected utility theory when dealing with infinite utilities or means. If you frame the essay around this, you move from a discussion of probability calculus to a deeper critique of decision theory itself. This aligns with the view that rational agents should not have unbounded utility functions, or that expected value is not the sole normative guide in such extremes.

  **4. Would reorganising around question (3) make the essay more interesting?**
  Yes, absolutely. Focusing on the normative force of expected value in the face of infinity elevates the essay from a technical puzzle to a philosophical inquiry into decision theory.

  A structure based on question (3) might look like this:
  1.  **Introduction:** Present the paradox and the standard finite-mean resolution.
  2.  **The Infinite Case:** Demonstrate that with infinite means, the conditional advice to switch is mathematically coherent.
  3.  **The Breakdown:** Argue that the paradox persists here not due to error, but because unconditional expectations are undefined.
  4.  **Philosophical Implication:** Conclude that the paradox reveals the limits of expected value maximisation as a normative principle, suggesting that rationality requires bounded utilities or alternative decision rules.

  This approach prioritises the philosophical significance of the maths, which makes for a more compelling read.

  **Summary**
  Your central claim is mathematically accurate and philosophically prudent. The infinite-mean case is a genuine exception to the standard resolution, and highlighting this exposes the limitations of expected value theory. Ensuring you distinguish clearly between the 'naive' 50/50 error and the 'Bayesian' infinite-mean case will prevent confusion, but your core argument holds up to scrutiny.

  Verdict: sound
