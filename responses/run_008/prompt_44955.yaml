      *   **User's Goal:** Undergraduate dissertation. Needs to test the supervisor's claim that the field is "stuck but fertile."
      *   **User's Hypothesis:** The stall is due to talking past each other (individuation/semantics vs. causal explanation/token physicalism).
      *   **Rival Diagnoses:** (1) Hidden empirical question (neuroscience grain), (2) Metaphysical/verbal dispute (criteria for realization).
      *   **Task:** Write a "proper diagnosis." Evaluate the three diagnoses (or propose a fourth). Assess if progress is possible or if it's intractable.
      *   **Constraints:** British English. Do *not* turn it into a literature survey. Focus on reasoned diagnosis. Address what counts as progress.

  2.  **Deconstruct the Debate (Mental Sandbox):**
