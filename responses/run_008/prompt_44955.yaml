      *   *Check:* Did I answer the "progress" question? *Correction:* Need to be specific. Progress comes from shifting from "Is MR true?" to "What work does MR do in scientific practice?"
      *   *Key Insight:* The user's first hypothesis is the strongest, but it needs to be deepened. It's not just that they answer different questions; it's that they have different *criteria for success*. Functionalists want *explanatory generality*; Reductionists want *causal specificity*. These are competing virtues, not truth-apt claims that can be settled by a microscope.

  7.  **Final Polish:**
