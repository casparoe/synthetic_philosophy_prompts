answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Proposal 4-B (Affordable Housing Permitting Pilot)

  **Recommendation**
  I recommend we **adopt the pilot program with specific statutory conditions.**

  The status quo is unacceptable. When people are sleeping in cars, procedural purity that results in zero housing is a failure of governance. The proponents are correct that we need to test whether streamlined authority produces results. However, the proposal as written conflates *speed* with *capacity*, and it treats democratic checks as obstacles rather than insurance.

  We should run the experiment, but we must structure it so that failure is safe, success is verifiable, and power does not accumulate permanently by default.

  **The Argument for Speed**
  The proponents' core claim is pragmatic: performance legitimacy. If the government delivers housing, citizens will accept a reduction in process. The comparison to Singapore and Shenzhen is compelling on the surface—those cities build. The moral weight of the "people sleep in cars" argument cannot be dismissed by citing abstract democratic norms. If we have a mechanism to build housing faster without causing harm, we have a duty to use it.

  **The Risk of Confounding Variables**
  However, the Singapore comparison contains a significant logical gap. Singapore's housing success relies on state land ownership and a city-state scale we do not possess. They control the land supply; we do not. Fast-tracking permits does nothing if there is no land to build on or if construction costs remain prohibitive.

  There is a risk we import the *authoritarian mechanism* (centralized power) without the *administrative capacity* (land control, civil service efficiency) that actually produced the results. If we strip away checks and balances but still don't build housing because the confounding variables weren't addressed, we end up with the worst of both worlds: reduced accountability and no new units.

  **Performance Legitimacy is Conditional**
  The proposal rests on performance legitimacy—the idea that results justify the means. The danger here is that procedural legitimacy is stable, while performance legitimacy is fragile. If the Mayor's office misses its targets, the justification for insulated power vanishes.

  Currently, the proposal lacks a mechanism to handle that failure. If we delegate authority for five years based on a promise of results, and the results don't materialize, do we have a way to pull those powers back? Or does the bureaucracy solidify around the new normal? A pilot program must have an "undo button" that is easier to press than the original delegation.

  **Legitimacy vs. Toleration**
  Finally, we must distinguish between citizen endorsement and citizen exhaustion. The proponents argue people will trade process for results. It is equally possible that people will simply stop showing up to complain because the process is too opaque, or because they feel powerless to stop it. That is toleration, not legitimacy. A ballot measure based on toleration is unstable; if the housing slows down, the backlash will be severe. The pilot needs to measure not just units built, but community trust retained.

  **Proposed Conditions**
  To mitigate these risks, I move we adopt the pilot subject to the following amendments:

  1.  **Hard Sunset:** The authority expires automatically in five years. Renewal requires a new Charter amendment, not a simple council vote. This prevents "temporary" powers from becoming permanent infrastructure.
  2.  **Performance Triggers:** The Mayor's office must meet interim milestones (e.g., 40% of projected units permitted by Year 3). If milestones are missed, the delegated authority reverts immediately to the Council. This ensures the legitimacy remains tied to actual performance.
  3.  **Independent Appeals:** Appeals cannot be handled internally within the Mayor's office. They should be delegated to an independent hearing officer or administrative law judge. This preserves speed while removing the conflict of interest of the builder judging the builder.
  4.  **Scope Lock:** The definition of "Affordable Housing" eligible for fast-tracking is locked in the Charter for the pilot duration. This prevents the definition from being loosened to meet numerical targets without delivering actual affordability.
  5.  **Reversibility Plan:** The Mayor's office must submit a plan within 90 days detailing how delegated authority will be dissolved if the pilot ends or is triggered off. We need to know now how we return to the previous system.

  **Conclusion**
  This approach takes the housing crisis seriously without treating our Charter as a sandbox for untested governance models. It allows the Commission to vote "yes" on housing without voting "yes" on unchecked power. If the pilot works, we have housing. If it fails, we have our checks and balances intact.

  I look forward to discussing these conditions at the next meeting.
