  **Question 4 (25 Marks)**

  **Zorn's Lemma and its Foundations**

  Recall the standard statement of Zorn's Lemma: *Let $(P, \leq)$ be a non-empty partially ordered set. If every chain $C \subseteq P$ has an upper bound in $P$, then $P$ contains at least one maximal element.*

  **(i) Variant Analysis (10 Marks)**
  Consider the following four modified statements. For each, determine whether it is provable in ZFC. If it is false, provide a specific counterexample (a specific poset $P$) and explain briefly why the statement fails.
  1.  **Variant A:** Let $(P, \leq)$ be a partially ordered set (no non-emptiness assumption). If every chain $C \subseteq P$ has an upper bound in $P$, then $P$ contains a maximal element.
  2.  **Variant B:** Let $(P, \leq)$ be a non-empty partially ordered set. If every **finite** subset of $P$ has an upper bound in $P$, then $P$ contains a maximal element.
  3.  **Variant C:** Let $(P, \leq)$ be a non-empty partially ordered set. If every chain $C \subseteq P$ has an upper bound in $P$, then $P$ contains a **greatest** element.
  4.  **Variant D:** Let $(P, \leq)$ be a partially ordered set. If every **non-empty** chain $C \subseteq P$ has an upper bound in $P$, then $P$ contains a maximal element.

  **(ii) Application: Maximal Ideals (10 Marks)**
  Use Zorn's Lemma to prove that every proper ideal $I$ in a commutative ring $R$ with identity ($1 \neq 0$) is contained in a maximal ideal.
  *   Explicitly define the partially ordered set $(P, \leq)$ you are using.
  *   Verify the chain condition rigorously. Specifically, show that the union of a chain of proper ideals is itself a proper ideal (i.e., it does not contain $1$).

  **(iii) Foundations and Choice (5 Marks)**
  Zorn's Lemma is equivalent to the Axiom of Choice (AC). In the standard proof of Zorn's Lemma using transfinite recursion, we construct a strictly increasing chain of elements in $P$. Explain precisely where the Axiom of Choice is invoked in this construction. Why does naive transfinite recursion fail without it?

  ***

  **Model Answer**

  **(i) Variant Analysis**
  1.  **Variant A: False.**
      *   *Counterexample:* Let $P = \emptyset$.
      *   *Reasoning:* The hypothesis "every chain has an upper bound" is vacuously true (there are no chains). The conclusion "$P$ contains a maximal element" is false (there are no elements). The non-emptiness assumption is load-bearing.
  2.  **Variant B: False.**
      *   *Counterexample:* Let $P = \mathbb{N}$ with the usual order $\leq$.
      *   *Reasoning:* Every finite subset of $\mathbb{N}$ has an upper bound (its maximum). However, $\mathbb{N}$ has no maximal element. The condition must apply to infinite chains to force convergence/stabilization.
  3.  **Variant C: False.**
      *   *Counterexample:* Let $P = \{a, b\}$ with no order relations between them (discrete order).
      *   *Reasoning:* Every chain (e.g., $\{a\}$, $\{b\}$, $\emptyset$) has an upper bound (itself). Both $a$ and $b$ are maximal, but neither is greatest (since $a \not\geq b$ and $b \not\geq a$).
  4.  **Variant D: False.**
      *   *Counterexample:* Let $P = \emptyset$.
      *   *Reasoning:* The hypothesis "every non-empty chain has an upper bound" is vacuously true. The conclusion is false. (Note: If $P \neq \emptyset$ is assumed, this variant is True, as the empty chain condition merely ensures $P \neq \emptyset$).

  **(ii) Application: Maximal Ideals**
  *   **Poset:** Let $P = \{J \subsetneq R \mid J \text{ is an ideal of } R \text{ and } I \subseteq J\}$. The order is set inclusion $\subseteq$.
  *   **Non-emptiness:** $I \in P$, so $P \neq \emptyset$.
  *   **Chain Condition:** Let $\mathcal{C}$ be a chain in $P$ (a collection of proper ideals totally ordered by inclusion). Let $U = \bigcup_{J \in \mathcal{C}} J$.
      *   $U$ is an ideal (standard union of chain of ideals argument).
      *   **Properness:** We must show $1 \notin U$. Suppose $1 \in U$. Then $1 \in J$ for some $J \in \mathcal{C}$. But every $J \in \mathcal{C}$ is a *proper* ideal, so $1 \notin J$. Contradiction. Thus $1 \notin U$, so $U \in P$.
      *   $U$ is an upper bound for $\mathcal{C}$ in $P$.
  *   **Conclusion:** By Zorn's Lemma, $P$ has a maximal element $M$. $M$ is a maximal ideal containing $I$.

  **(iii) Foundations and Choice**
  *   **Location of AC:** In the transfinite recursion, at each successor step $\alpha + 1$, assuming we have not yet reached a maximal element, the set of strict upper bounds for the current chain segment $x_\alpha$ is non-empty. We must **choose** one specific element $x_{\alpha+1}$ from this set to continue the chain.
  *   **Why AC is needed:** There is no canonical rule to select *which* upper bound to pick. To define the sequence $(x_\alpha)$ for all ordinals simultaneously, we require a Choice Function on the collection of non-empty sets of strict upper bounds. Without AC, we cannot guarantee the existence of the function required to sustain the recursion through limit ordinals.

  ***

  **Marking Scheme**

  **Total: 25 Marks**

  **1. Part (i): Empty Set & Non-Emptiness Logic (Variants A & D) — 5 Marks**
  *   **Must-Hit:** Identify Variant A as False due to $P=\emptyset$. Identify Variant D as False (without explicit $P \neq \emptyset$) due to $P=\emptyset$.
  *   **Allocation:** 2.5 marks per variant (1 for False, 1.5 for correct counterexample/explanation).
  *   **Typical Botch:** Students claim Variant A is True because "Zorn's Lemma is true," missing that the statement *omitted* the non-emptiness premise. They treat $P=\emptyset$ as a "cheap gotcha" rather than a logical necessity for the conclusion to hold.
  *   **A vs B:** **B** students give the counterexample. **A** students explicitly note that the empty set is a chain and its upper bound condition is what usually forces $P \neq \emptyset$ in the standard statement, showing they understand the convention, not just the example.

  **2. Part (i): Order Structure Logic (Variants B & C) — 5 Marks**
  *   **Must-Hit:** Identify Variant B as False (finite vs. infinite chains). Identify Variant C as False (maximal vs. greatest).
  *   **Allocation:** 2.5 marks per variant (1 for False, 1.5 for correct counterexample).
  *   **Typical Botch:** Confusing "maximal" with "greatest" in Variant C. For Variant B, claiming it is True by confusing Zorn with Noetherian induction.
  *   **A vs B:** **B** students provide $\mathbb{N}$ for Variant B. **A** students explain *why* finite subsets fail to capture the limit behavior required to stop the recursion (compactness vs. completeness).

  **3. Part (ii): Poset Specification — 5 Marks**
  *   **Must-Hit:** Define $P$ as the set of *proper* ideals containing $I$.
  *   **Allocation:** 5 marks.
  *   **Typical Botch:** Defining $P$ as "all ideals" (fails because $R$ is not proper) or forgetting to include the condition $I \subseteq J$.
  *   **A vs B:** **B** students define the set correctly. **A** students explicitly note why $R$ itself is excluded (because $1 \in R$) to set up the next point.

  **4. Part (ii): Verification of Chain Condition (Union is Proper) — 5 Marks**
  *   **Must-Hit:** Prove that if $1 \in \bigcup \mathcal{C}$, then $1 \in J$ for some $J \in \mathcal{C}$, contradicting properness.
  *   **Allocation:** 5 marks.
  *   **Typical Botch:** Stating "The union of ideals is an ideal" without checking that the union is *proper*. Waving hands at the $1 \notin \bigcup \mathcal{C}$ step.
  *   **A vs B:** **This is the primary discriminator.** **B** students verify the union is an ideal but gloss over the "proper" condition. **A** students recognize that if the union contains 1, the upper bound leaves the poset, breaking Zorn's hypothesis. They write out the $1 \in J$ contradiction explicitly.

  **5. Part (iii): Location of Axiom of Choice — 5 Marks**
  *   **Must-Hit:** Identify AC is used to select a strict upper bound at successor steps via a Choice Function.
  *   **Allocation:** 5 marks.
  *   **Typical Botch:** Stating "AC is used to well-order the set" (true but misses the recursion mechanism) or "AC is used to pick the maximal element" (circular).
  *   **A vs B:** **B** students say "AC makes choices." **A** students specify that without a choice function, the transfinite sequence cannot be defined because there is no deterministic rule to pick $x_{\alpha+1}$ from the set of upper bounds.

  **General A/B Distinction:**
  The line falls on **rigor in Part (ii)** and **logical precision in Part (i)**. A **B** answer treats Zorn's Lemma as a black box: they know the statement and can apply it to rings, but they miss the "proper ideal" nuance in the union check and treat the empty set counterexamples as trivial exceptions. An **A** answer demonstrates that they understand *why* the lemma works: they see the empty set issue as a structural requirement for the induction base, and they recognize that the union of proper ideals is only proper because $1$ cannot appear at any finite stage of the chain. The A student proves the union is in the poset; the B student assumes it.
