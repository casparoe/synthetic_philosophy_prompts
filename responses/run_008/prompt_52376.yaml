prompt: |-
  I teach an upper-level seminar on rational choice theory for philosophy and economics students — sixteen of them — and I have one 75-minute session left in a unit on Newcomb-style problems and the limits of equilibrium reasoning. For that session I'd like you to design an in-class activity built around Douglas Hofstadter's Luring Lottery, the thought experiment he ran as a puzzle in his Scientific American column in the early 1980s (it's retold in Metamagical Themas). In case any details are fuzzy: the setup is that anyone may submit as many entries as they like, one entry is drawn uniformly at random, and the winner receives a fixed prize divided by the total number of entries received. Submitting an additional entry always raises your own probability of being drawn, while diluting the prize for everyone; the individually "smart" reasoning cascades into a collective disaster, and Hofstadter's readers famously swamped the contest with entries, some submitted as astronomical exponentials, so the expected payout collapsed to nothing. His proposed cure was "superrationality" — the idea that if all participants are rational and know they all face the same problem, they can each conclude that whatever they do, all the others will reason their way to doing too, and so choose the action that is best when universally chosen: submit exactly one entry.

  Design a runnable classroom version. I can't use real money, so propose a payoff scheme — extra credit points, or a modest prize like a gift card funded by the department, whichever you think produces the right incentives — and give me the full logistics: materials, how entries are kept secret (my classroom has a lot of side chatter), the timeline for a 75-minute session, and how the draw is performed. I want the activity staged in two rounds: a first round run in silence with no communication, then a facilitated open discussion in which students may say anything but make no binding commitments, followed by a second anonymous round. The pedagogical point I want them to feel is the gap between dominance reasoning ("my extra slip weakly improves my odds, whatever the others do") and the superrational conclusion ("if I can see the one-entry answer, so can everyone, so act as though the group has one will") — and then the disquieting question of whether the discussion round, which should push them toward the cooperative answer, is teaching them anything about rationality or just about enforceable norms among people who'll see each other again Thursday. If you can work in a brief third stage inspired by the companion Platonia dilemma — where winning requires that at most one person acts, and the superrational solution involves everyone randomizing with equal probability — I'd welcome it, but keep it short.

  Please include a debrief that maps specific moments of the activity onto the formal distinctions: conditional vs. unconditional reasoning, the role of symmetry and common knowledge, and the difference between a one-shot game among anonymous strangers and a repeated game with a face-to-face community. Tell me what will predictably go wrong the first time I run it (my guess is someone submits a googol as a joke — how should I handle that within the rules?) and be honest about which features of the real dilemma a classroom cannot reproduce. Finally, a request about how you present the ideas: separate cleanly what is settled from what is genuinely contested. The game-theoretic structure itself isn't in dispute, but superrationality is not the consensus view among decision theorists — most would classify it as a controversial move in the same family as one-boxing and evidential reasoning, and I don't want my students leaving with the impression that Hofstadter simply solved the problem. Say plainly where the experts still disagree and what turns on it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level philosophy and economics students (16 students).
      *   **Context:** Final 75-minute session of a unit on Newcomb-style problems/limits of equilibrium reasoning.
      *   **Core Activity:** Douglas Hofstadter's Luring Lottery (Scientific American/Metamagical Themas).
      *   **Constraints:** No real money (use extra credit or gift card). Needs secrecy in a chatty room. Two rounds (Silent -> Discussion -> Silent). Optional third stage (Platonia Dilemma variant).
      *   **Pedagogical Goals:** Feel the gap between dominance reasoning and superrationality. Explore whether discussion teaches rationality or just social norms/reputation.
      *   **Debrief Requirements:** Map activity to formal distinctions (conditional vs. unconditional, symmetry, common knowledge, one-shot vs. repeated).
      *   **Accuracy Requirement:** Distinguish settled game theory from contested superrationality (don't present Hofstadter's solution as consensus).
      *   **Logistics:** Handle "googol" jokes, timing, materials, draw mechanism.

  2.  **Deconstruct the Luring Lottery:**
      *   *Mechanism:* Prize $P$ divided by total entries $N$. Player $i$ submits $n_i$ entries. Probability of winning = $n_i / N$. Expected Value (EV) = $(n_i / N) * (P / N) = P * n_i / N^2$.
      *   *Dominance Strategy:* If others hold $N_{-i}$ constant, increasing $n_i$ increases win probability linearly but decreases prize hyperbolically. Wait, let's check the math.
          *   Prize per entry = $P / (N_{-i} + n_i)$.
          *   My EV = $n_i * [P / (N_{-i} + n_i)]$.
          *   Derivative w.r.t $n_i$: $P * [(N_{-i} + n_i) - n_i] / (N_{-i} + n_i)^2 = P * N_{-i} / (N_{-i} + n_i)^2$.
          *   This is always positive. So, strictly speaking, submitting *more* entries always increases expected value *assuming others' entries are fixed*.
          *   *Correction/Refinement:* In Hofstadter's original, the prize was fixed ($1,000,000 / N$). If I submit 1 entry, EV = $1/N * 1,000,000/N$. If I submit 2, EV = $2/(N+1) * 1,000,000/(N+1)$.
          *   Actually, the standard Luring Lottery logic is: Prize = $K / N_{total}$. My share = $(n_i / N_{total}) * (K / N_{total}) = K * n_i / N_{total}^2$.
          *   If everyone adds 1, $N$ goes up, Prize goes down.
          *   *Dominance:* For any fixed $N_{-i}$, does increasing $n_i$ help?
              *   $EV(n_i) = n_i * \frac{K}{(N_{-i} + n_i)^2}$.
              *   Maximize w.r.t $n_i$: Derivative = $\frac{(N_{-i} + n_i)^2 - n_i * 2(N_{-i} + n_i)}{(N_{-i} + n_i)^4} = \frac{N_{-i} + n_i - 2n_i}{(...)^3} = \frac{N_{-i} - n_i}{(...)^3}$.
              *   So EV is maximized when $n_i = N_{-i}$.
              *   *Wait, this is crucial.* In the standard "Prize = $1/N$" setup, there *is* an optimal number of entries relative to others. It's not strictly dominant to submit infinity.
              *   *Hofstadter's specific version:* "The prize is $1,000,000 divided by the total number of entries."
              *   If I submit $n$ and others submit $M$, Total = $M+n$. Prize = $1,000,000 / (M+n)$. My Expected Win = $\frac{n}{M+n} \times \frac{1,000,000}{M+n}$.
              *   As shown above, this is maximized when $n = M$.
              *   *However*, Hofstadter's point was about the *race*. If everyone thinks "I'll submit 1", $M=15$. I should submit 15. If everyone submits 15, $M=225$. I should submit 225. This escalates to infinity.
              *   *Superrational Solution:* If we all do the same thing $n$, Total = $16n$. Prize = $K/16n$. My Prob = $1/16$. My EV = $K / (16 * 16n) = K / 256n$. To maximize this, minimize $n$. So $n=1$.
      *   *Classroom Adaptation:* Need to make sure the "infinity" temptation is real but manageable. Using "number of slips" is physical. Using "write a number" allows infinity.
      *   *Decision:* Physical slips are better for the "effort" cost, but writing numbers captures the "googol" issue. Let's use **writing a number on a card**. It allows the "googol" joke and matches the original column better.
      *   *Payoff:* Extra credit points are best for students. Let's say 100 points total pool, divided by total entries. Or a $50 gift card. Gift card is cleaner for "Prize". Let's go with a **$50 Gift Card** (department funded) + **Small Extra Credit** for participation to ensure engagement. Actually, purely extra credit is easier for a philosophy prof. Let's say "10 Participation Points" pool. If total entries = 100, each entry is worth 0.1 points. Winner gets the points? No, Hofstadter's was "Winner gets Prize/Total".
      *   *Refined Payoff:* To make it tangible: **One Winner** drawn at random. **Prize Value** = (Fixed Pool) / (Total Entries).
      *   *Fixed Pool:* 100 Course Points (or $50).
      *   *Mechanism:* Students write an integer $n \ge 1$ on a card. Sum all $n$'s to get $N$. Draw one card (weighted by $n$? No, Hofstadter's was "one entry drawn uniformly").
      *   *Wait, check Hofstadter's rules:* "One entry is drawn uniformly at random." If I submit 5 slips, I have 5 chances.
      *   *Classroom implementation:* If they write a number $n$, how do we simulate $n$ slips?
      *   *Option A:* They actually write $n$ slips. (Too much time for "googol").
      *   *Option B:* They write a number $n$. We calculate total $N = \sum n_i$. We pick a random number between 1 and $N$. Map ranges to students.
      *   *Option C (Simpler):* Each student submits *one* ballot, but on it, they write how many "votes" they want. The probability of winning is proportional to votes. The Prize is $V / \text{Total Votes}$.
      *   *Let's stick to the physical metaphor:* To capture the "dilution" viscerally, maybe they *do* write slips. But limit time.
      *   *Better approach for 75 mins:* They write a number $n_i$. The instructor calculates $N = \sum n_i$. The Prize Pool is $P$. The Value of Winning is $P/N$. The Probability of Student $i$ Winning is $n_i / N$. Expected Value = $n_i/N * P/N$.
      *   *Wait, if I write a googol, and someone else writes 1.* Total $\approx$ googol. Prize $\approx 0$. My probability $\approx 1$. My EV $\approx 0$.
      *   *The "Googol" Problem:* If someone writes $\infty$, the prize is 0. Everyone gets 0. This is the disaster.
      *   *Handling the Joke:* If someone writes "infinity" or "googol", treat it as a very large number (e.g., $10^{100}$). Explain that this collapses the prize to effectively zero. This *is* the lesson. Don't disqualify them; let the class feel the pain of the defector/joker.

  3.  **Drafting the Session Plan:**
      *   **Time:** 75 minutes.
      *   **Structure:**
          1.  Intro & Rules (10 min)
          2.  Round 1 (Silent) (10 min)
          3.  Count & Reveal (5 min)
          4.  Discussion (20 min)
          5.  Round 2 (Silent) (10 min)
          6.  Count & Reveal (5 min)
          7.  Platonia Mini-Game (10 min)
          8.  Debrief (15 min)
      *   **Wait, timing is tight.** 75 mins goes fast. Platonia might be too much. The prompt asks for it "if you can work it in... keep it short." I'll make it a 5-minute thought experiment or quick vote at the end of the discussion phase.
      *   **Secrecy:** Need envelopes. Students write number, seal in envelope. Prevents side chatter from influencing the *act* of writing, though they can talk before sealing in Round 2.
      *   **Payoff:** $50 Gift Card is concrete. 100 "Course Points" is abstract but meaningful. Let's suggest the Gift Card for the "Prize" feel, but add 1 participation point just for showing up/submitting to ensure baseline engagement.
      *   **The Draw:** Needs to be transparent. Use a random number generator projected on screen. Sum the entries ($N$). Generate $k \in [1, N]$. Map ranges to students based on their $n_i$.

  4.  **Addressing the Pedagogical Nuance:**
      *   **Dominance vs. Superrationality:**
          *   Dominance (Causal/Standard): "My extra entry doesn't change what others did. It increases my share of the pie more than it shrinks the pie (initially)." *Correction:* As derived earlier, $EV$ peaks when $n_i = N_{-i}$. So if others play 1, I should play 15. If others play 15, I should play... it escalates.
          *   Superrationality (Evidential/Logical): "We are identical reasoners. If I choose 10, others likely choose 10. Total = 160. If I choose 1, others choose 1. Total = 16. Prize is much bigger in the second case. Since I can't outsmart them (they are like me), I choose 1."
      *   **The Discussion Round:** This introduces *reputation* and *norms*. It's no longer a one-shot anonymous game. It becomes a repeated social game. This muddies the water for "pure rationality" but is excellent for discussing the *limits* of the model.
      *   **Contested Status:** Must emphasize that Causal Decision Theory (CDT) rejects superrationality. Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) supports it. This is not settled science.

  5.  **Refining the Logistics:**
      *   **Materials:** Envelopes (16 per round), Slips of paper, Marker for board, Projector (for RNG), Gift Card.
      *   **Secrecy:** Collect envelopes in a box. Do not open until end of round.
      *   **The "Googol" Rule:** Pre-emptively state: "Integers only. If you write non-numbers or symbols, I will interpret them as $10^{100}$." This punishes the joke while respecting the rules.
      *   **Platonia:** "Only one person may submit an entry. If 0 or >1 submit, no one wins." Superrational solution: Randomize with $p = 1/16$. This is hard to run physically in 5 mins. *Idea:* Ask them to write "Yes" or "No" on a slip. If exactly one "Yes", that person wins. If not, no one wins. Do this quickly.

  6.  **Developing the Debrief:**
      *   **Map moments:**
          *   Round 1 (Silent) -> One-shot anonymous game (CDT territory).
          *   Discussion -> Common Knowledge attempt / Norm setting.
          *   Round 2 -> Repeated game / Reputation / Trust.
          *   Platonia -> Correlated equilibrium / Mixed strategies.
      *   **Contested Ground:** Clearly state: "CDT says defect/escalate. FDT/EDT says cooperate/1 entry. Economists usually side with CDT. Philosophers are split."

  7.  **Review against Constraints:**
      *   16 students? Yes.
      *   75 mins? Yes, need to be strict on timing.
      *   No real money? Gift card proposed.
      *   Secrecy? Envelopes.
      *   Two rounds + Discussion? Yes.
      *   Platonia included? Yes, shortened.
      *   Debrief specific? Yes.
      *   Honesty about controversy? Yes.
      *   Handling the "Googol"? Yes, rule set.

  8.  **Final Polish:**
      *   Tone: Professional, academic, ready-to-use.
      *   Clarity: Step-by-step instructions.
      *   Math Check: Ensure the EV explanation in the debrief is accurate. (The derivative check $n_i = N_{-i}$ is the key insight for the "escalation" logic).
      *   *Self-Correction on Payoff:* If the prize collapses to zero, the winner gets nothing. This is demoralizing. *Fix:* The Gift Card is the "Fixed Pool". If the math says Prize = $50 / N$, and $N$ is huge, the prize is fractions of a cent. *Better:* The Winner gets the Gift Card *only if* Total Entries $\le$ Some Threshold? No, that changes the game.
      *   *Hofstadter's Original:* The prize literally collapsed. Readers got nothing. That was the point. I should replicate the disappointment. It drives the lesson home. I will warn them: "If the total entries are too high, the prize value becomes negligible."
      *   *Wait, one more check:* If I use a $50 card, and $N=1000$, the prize is 5 cents. I can't give 5 cents.
      *   *Solution:* The "Prize" is Course Points. 100 Points Pool. If $N=200$, winner gets 0.5 points. It's abstract enough to handle fractions. Or, I (the professor) guarantee a minimum (e.g., coffee card) but the *bonus* is the variable part.
      *   *Decision:* Let's use **Course Points**. It's the currency they care about most. Pool = 50 Points.
      *   *Platonia:* Keep it very brief. "Write Yes/No".

  9.  **Structuring the Output:**
      *   Overview & Learning Objectives.
      *   Materials & Prep.
      *   Payoff Structure.
      *   Step-by-Step Run Sheet (Timing).
      *   Rules (including the Googol clause).
      *   The Draw Mechanism.
      *   Debrief Guide (The "Meat").
      *   Troubleshooting (What goes wrong).
      *   Theoretical Caveats (Settled vs. Contested).

  10. **Final thought on Superrationality:** Ensure I don't validate it as "True". It's a *proposal* to solve a specific class of problems where CDT fails to produce Pareto optimal outcomes in symmetric games. It relies on logical correlation, not causal influence.

  Let's write it.cw
answer: |-
  # Lesson Plan: The Luring Lottery & The Limits of Equilibrium
  **Course:** Upper-Level Seminar (Philosophy/Economics)  
  **Topic:** Newcomb Problems, Superrationality, and Equilibrium Reasoning  
  **Time:** 75 Minutes  
  **Class Size:** 16 Students  

  ## I. Learning Objectives
  1.  **Experiential:** Students will feel the tension between individual dominance reasoning (submitting more entries) and collective optimality (submitting one).
  2.  **Analytical:** Distinguish between Causal Decision Theory (CDT) and Evidential/Functional Decision Theory (FDT/EDT) frameworks.
  3.  **Critical:** Evaluate whether "superrationality" is a solution to a logical problem or a confusion of norms with rationality.
  4.  **Social:** Observe how face-to-face discussion transforms a one-shot anonymous game into a repeated social dilemma.

  ## II. Materials & Preparation
  *   **Envelopes:** 40 small opaque envelopes (2 per student + spare).
  *   **Slips of Paper:** 40 small identical slips.
  *   **Writing Implements:** Pens for everyone.
  *   **Collection Box:** A shoebox or locked drawer to store sealed envelopes.
  *   **Projector/Screen:** To display a Random Number Generator (RNG).
  *   **Payoff:** **50 Course Points** (added to final grade tally). *Note: Do not use cash; points allow for fractional division without awkwardness.*
  *   **Handout:** A one-page rule sheet (distributed at the start).

  ## III. Payoff Structure
  *   **The Pool:** 50 Course Points.
  *   **The Mechanism:** 
      1.  Total Entries ($N$) = Sum of all numbers submitted by the class.
      2.  Winner Selected: One student chosen via weighted random draw (probability proportional to entries submitted).
      3.  **Prize Value:** $50 / N$ Points.
  *   **Participation:** All students receive 1 Participation Point simply for submitting a valid ballot in both rounds (insulates against total zero-sum demoralization).

  ## IV. The Run Sheet (75 Minutes)

  ### 0:00 – 0:10 | Introduction & Rules
  *   Distribute rule sheets.
  *   **Read the Rules Aloud:** 
      *   "You may submit any positive integer ($1, 2, 3...$) representing your number of entries."
      *   "One winner will be drawn. Probability of winning = (Your Entries) / (Total Class Entries)."
      *   "Prize = 50 Points / (Total Class Entries)."
      *   **The 'Googol' Clause:** "If you submit a non-integer, a symbol, or an absurdly large number (e.g., $10^{100}$), I will record it as $10^{100}$. This will mathematically reduce the prize to effectively zero for everyone. This is not a disqualification; it is a valid move within the rules."
  *   **Secrecy Protocol:** Students write their number, seal it in an envelope, and place it in the Collection Box. No one opens envelopes until the round ends.

  ### 0:10 – 0:20 | Round 1 (Silent)
  *   **Condition:** Absolute silence. No eye contact signaling. No communication.
  *   **Action:** Students write, seal, and deposit.
  *   **Instructor Action:** Collect box. Open envelopes at the desk (or have a TA/student assistant do it while you project the sum).
  *   **Calculation:** Sum the entries ($N_1$). Calculate Prize Value ($50/N_1$).
  *   **Reveal:** Write $N_1$ and the Prize Value on the board. *Do not reveal individual choices yet.*

  ### 0:20 – 0:40 | Facilitated Discussion
  *   **Prompt:** "You see the result. You have 15 minutes to talk before Round 2. You may say anything. You may make promises. You may threaten. But **no binding contracts** and **no side payments**."
  *   **Pedagogical Trap:** Allow them to realize that talking creates reputation costs. If they agree to "all play 1" and someone defects in Round 2, they face social consequences Thursday.
  *   **Instructor Role:** Minimal intervention. Let them struggle with the "trust" problem. If they propose "Superrationality," let them define it. If they propose "Threats," let them try.

  ### 0:40 – 0:50 | Round 2 (Post-Discussion)
  *   **Condition:** Silence returns. Sealed envelopes again.
  *   **Action:** Students submit second ballot.
  *   **Calculation:** Sum entries ($N_2$). Calculate Prize Value ($50/N_2$).
  *   **Reveal:** Write $N_2$ and Prize Value on the board next to Round 1 data.

  ### 0:50 – 0:55 | The Platonia Mini-Game (Rapid Fire)
  *   **Setup:** "New rules. To win the 50 points, **exactly one** person must submit a 'Yes' slip. If 0 people submit 'Yes', no one wins. If 2+ submit 'Yes', no one wins."
  *   **Action:** Hand out new slips. "Write 'Yes' or 'No'. Seal. Deposit."
  *   **Reveal:** Open immediately. 
  *   **Point:** This forces a mixed-strategy equilibrium ($p = 1/16$). It usually results in 0 winners or >1 winners, demonstrating the difficulty of correlating without a signal.

  ### 0:55 – 1:15 | Debrief & Theoretical Mapping
  *   (See detailed guide below).

  ## V. The Draw Mechanism (Transparency)
  To ensure the "weighted random" draw is fair without physical slips:
  1.  Project a random integer generator (e.g., Random.org).
  2.  Set range $[1, N_{total}]$.
  3.  Assign ranges to students on the board based on their submission.
      *   *Example:* Student A submitted 5, Student B submitted 1. Total = 6.
      *   Student A owns numbers 1–5. Student B owns number 6.
  4.  Generate the number. The owner wins.

  ## VI. Troubleshooting: What Will Go Wrong
  1.  **The "Googol" Joker:** Someone will submit $\infty$ or "ALL" to break the game.
      *   *Response:* Do not get angry. Apply the rule calmly. "As per the syllabus, this counts as $10^{100}$." Use this in the debrief: "This is the dominance strategy taken to its logical conclusion. It wins the draw (100% probability) but the prize is $0.000...1$ points. Is winning with nothing rational?"
  2.  **Round 2 Collusion:** They might agree to all play 1, but one student defects to "steal" the larger pie.
      *   *Response:* This is a feature, not a bug. It highlights the difference between *talk* and *enforceable commitment*.
  3.  **Time Creep:** The discussion often runs long.
      *   *Response:* Hard stop at minute 40. "Pens down. The game does not wait for consensus."

  ## VII. Debrief Guide: Mapping Activity to Theory
  *Use the board to draw three columns: **Round 1**, **Discussion**, **Round 2**.*

  ### 1. Conditional vs. Unconditional Reasoning (The Dominance Argument)
  *   **Ask:** "In Round 1, why did you submit more than 1?"
  *   **Theory:** Standard Causal Decision Theory (CDT).
      *   *Reasoning:* "My choice does not *cause* theirs. Holding their entries fixed, my extra entry increases my probability of winning linearly, while diluting the prize only hyperbolically (initially)."
      *   *Math:* If others submit $M$ entries, your Expected Value is maximized when you submit $n = M$. If everyone thinks this, $M$ escalates to infinity.
  *   **Settled:** In a one-shot game among strangers, CDT prescribes escalation. This is the Nash Equilibrium of the continuous game.

  ### 2. Symmetry and Common Knowledge (The Superrational Argument)
  *   **Ask:** "Who thought, 'If I figure out the best move, everyone else in this room figures it out too'?"
  *   **Theory:** Hofstadter's Superrationality / Functional Decision Theory (FDT).
      *   *Reasoning:* "We are symmetric reasoners facing the same data. My decision is *logical evidence* of their decision. I cannot choose a strategy that I do not expect everyone to choose."
      *   *Conclusion:* If we all do $n$, Prize $\propto 1/n^2$. Maximize by minimizing $n$. Therefore, $n=1$.
  *   **Contested:** This is **not** consensus. Most economists reject this as "magical thinking." It assumes a logical correlation where there is no causal link.

  ### 3. One-Shot vs. Repeated Games (The Discussion Effect)
  *   **Ask:** "Did Round 2 change? Why? Did you become more 'rational' or just more 'social'?"
  *   **Theory:** Repeated Game / Reputation.
      *   *Observation:* Round 2 entries likely dropped. Was this superrationality? Or fear of being shamed on Thursday?
      *   **Crucial Distinction:** Superrationality claims to work among *anonymous* strangers who never meet. If your cooperation depended on seeing these people again, you didn't use superrationality; you used **reciprocal altruism** in a repeated Prisoner's Dilemma.
      *   **Lesson:** The discussion round contaminated the experiment. It turned a Newcomb problem into a social contract problem.

  ### 4. The Platonia Dilemma (Correlated Equilibrium)
  *   **Ask:** "In the Yes/No game, what was the rational move?"
  *   **Theory:** Mixed Strategy Nash Equilibrium.
      *   *Solution:* Randomize "Yes" with probability $1/16$.
      *   *Reality:* Humans are bad at randomizing. We either all say "No" (cowardice) or multiple say "Yes" (greed).
      *   *Superrational Take:* Hofstadter argues superrational agents would all calculate $p=1/16$ and flip a mental coin, achieving the optimal coordination without communication.

  ## VIII. Settled vs. Contested: A Note for the Instructor
  *Be explicit about this distinction so students do not leave thinking Hofstadter "solved" game theory.*

  | Feature | Status | Consensus View |
  | :--- | :--- | :--- |
  | **The Payoff Structure** | **Settled** | The math of $Prize = K/N$ is unambiguous. |
  | **Nash Equilibrium** | **Settled** | In a one-shot anonymous game, the equilibrium is to escalate entries (defect). |
  | **Superrationality** | **Contested** | Rejected by Causal Decision Theorists. Accepted (in modified forms) by Evidential/Functional Decision Theorists. |
  | **The "Rational" Move** | **Contested** | Depends on your definition of rationality. Is it maximizing expected utility given causal independence (CDT)? Or maximizing utility given logical correlation (FDT)? |
  | **Discussion Impact** | **Settled** | Communication converts one-shot games into repeated games, altering incentives via reputation, not logic. |

  **Closing Statement for Class:**
  "Hofstadter hoped superrationality would save us from collective disaster. Today, you saw that talk helps, but mostly because you fear each other, not because you trust the logic. The question remains: If you were truly anonymous, never to meet again, would you submit 1 entry? If you say yes, you are a superrationalist. If you say no, you are a causal decision theorist. And the discipline is still arguing about which of you is right."
