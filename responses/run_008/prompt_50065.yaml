  2. It must distinguish structural dependence on another's goodwill from arbitrary domination so that ordinary economic dependencies like mortgages do not count as unfreedom, though satisfying this alongside the first requirement risks internal contradiction. Republican Liberty struggles most with this requirement.

  3. The theory must differentiate between an option being physically or legally closed off and an option remaining open only contingent on another's continuing consent, without collapsing the two into identical states. Positive Liberty struggles most with this requirement.

  4. It must either incorporate the psychological capacity to look others in the eye without deference as a constitutive element of freedom or provide a robust explanation for why this social status is merely a symptom rather than the substance of liberty. Negative Liberty struggles most with this requirement.

  5. The account must deliver a verdict on political status that is distinct from subjective psychological satisfaction, even if maintaining this objectivity conflicts with the requirement to account for the fear inherent in the eyeball test. Positive Liberty struggles most with this requirement.
