  Based on the six historical verdicts you've recorded, I have modeled your friend's reasoning. She is not applying a simple "show me the data" empiricist rule, nor is she a pure "anything goes" theorist. Her judgments reveal a specific, consistent heuristic about **theoretical necessity versus ad hoc patching.**

  Here is the breakdown of her underlying rule, my predictions for your next three debates, and a proposed test case to settle the matter.

  ### The Underlying Rule

  You suspected three possible rules: (1) independent success of the framework, (2) the only available explanation for an anomaly, or (3) a prediction that can be checked soon.

  **Rule 3 (Checkability) is the weakest fit.**
  While Neptune, Atoms, and the Positron were all verified relatively quickly, the **Fifth Force** case breaks this rule. You noted the Fifth Force physicists had "real measurements behind them." If checkability were her primary rule, the Fifth Force should have been "Rational" (since data existed), but she ruled it "Not Rational." Conversely, she accepted Atoms in 1900, *before* the check (Brownian motion) was fully accepted. This proves she allows belief *before* verification, provided other conditions are met.

  **Rule 1 (Framework Success) and Rule 2 (Only Explanation) are the strongest fits.**
  Her verdicts align best with a combined principle I'll call the **"Non-Ad-Hoc Necessity" Rule**:
  *   **Rational:** Believing in an unobserved entity is rational if it is required to maintain the consistency of a well-confirmed theoretical framework (Neptune saved Newton; Atoms saved Chemistry; Dirac saved Quantum/Relativity math).
  *   **Not Rational:** Belief is irrational if the entity is introduced *solely* to fix a specific data point without broader theoretical integration, especially if simpler explanations (like error) exist (Epicycles patched geocentrism; Phlogiston patched combustion; Fifth Force patched a torsion anomaly).

  **Where it strains:**
  The rule strains slightly on **Phlogiston**. In the mid-18th century, phlogiston *was* the dominant framework, not just a patch. However, your friend likely views it retrospectively: phlogiston required increasingly ad hoc properties (like negative mass) to fit new weighing data, whereas the Oxygen theory offered a cleaner unification. She judges rationality by whether the entity *earns its keep* theoretically, not just by whether it was popular at the time.

  ### Predictions for the Next Three Debates

  Based on the "Non-Ad-Hoc Necessity" Rule, here is how she will likely rule on your modern cases:

  **(a) The String Theorist: VERDICT – RATIONAL**
  *   **Reasoning:** This mirrors the **Dirac** and **Neptune** cases. The string theorist isn't inventing a particle to explain one weird measurement (like the Fifth Force); they are arguing that string theory is the *only known consistent way* to unite General Relativity and Quantum Mechanics.
  *   **Why:** Even though there is "no feasible experiment," the belief is driven by **theoretical necessity** within a successful framework (modern physics), not by a desire to patch a single anomaly. She values the mathematical consistency (like Dirac) over immediate testability (proven by her acceptance of 1900 Atoms).

  **(b) The Multiverse Believer (Cosmological Constant): VERDICT – NOT RATIONAL**
  *   **Reasoning:** This mirrors the **Fifth Force** and **Epicycles** cases. The multiverse is being invoked specifically to explain one "oddly small" number (the cosmological constant).
  *   **Why:** To her, this looks like an **ad hoc patch**. Instead of solving a conflict in the laws of physics (like String Theory), it posits infinite unobserved universes just to make one observed value look less surprising. It lacks the "theoretical necessity" of String Theory and looks more like adding an epicycle to make the numbers fit.

  **(c) The Many-Worlds Proponent: VERDICT – RATIONAL**
  *   **Reasoning:** This mirrors the **Dirac** case. The proponent isn't adding a new force to explain a measurement error; they are arguing that the **mathematical framework** of Quantum Mechanics (the Schrödinger equation) should be taken literally without adding an extra, unexplained rule (collapse).
  *   **Why:** This is a move for **theoretical consistency**. Just as Dirac believed the math demanded a positron, the Many-Worlds proponent believes the math demands branching worlds. Even though they claim "no new experiments," the motivation is to remove an ad hoc rule (collapse), which fits her preference for clean frameworks over patched ones.

  ### The Deciding Test Case

  You mentioned you suspect more than one rule fits. The biggest tension is between **"Theoretical Necessity"** (my bet) and **"Eventual Observability"** (the idea that she only accepts things that *could* be seen eventually, like Neptune or Atoms).

  String Theory and Many-Worlds are both theoretically necessary (by their proponents' lights) but may be **impossible** to observe even in principle. To split these two rules cleanly, pose this case to her:

  **The Case:** *"A physicist believes that a singularity exists at the center of a black hole. General Relativity predicts it with certainty (Theoretical Necessity), but by definition, no information can ever escape the event horizon to confirm it (Impossible to Observe)."*

