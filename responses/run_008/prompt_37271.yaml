  *   **If she says NOT RATIONAL:** She is secretly following an **Observability** rule. She only accepted Atoms and Neptune because they *could* be seen eventually. If something is fundamentally unobservable, she rejects it. (This would mean my predictions for String Theory and Many-Worlds are wrong, and she will likely reject them too).

  **My Advice:** Bet on her saying **Rational**. Her acceptance of Dirac (math consistency) and 1900 Atoms (inference to best explanation) suggests she trusts the framework more than the telescope. She views science as understanding the *system*, not just cataloging sightings.
