  5.  **Analyzing the Perspectives:**
      *   *Identity Theorist:* "Different brain states = different mental states. Human pain is $N_h$, Octopus pain is $N_o$. They are different sensations." (Denies MR intuition).
      *   *Role-Functionalist:* "If the causal roles differ (interruption vs. no interruption), they are different mental states. Either Octopuses don't feel *that* pain, or we must define pain so loosely (damage + avoidance) that it covers reflexes." (Struggles to keep MR and Functionalism together).
      *   *MR-Primitivist:* "MR is a brute fact. Mental kinds cut across causal architectures. The 'essence' of pain is not the role, but the phenomenological reality realized differently." (Accepts the divergence).
      *   *Feature doing the work:* **Architectural Context** (Centralized vs. Distributed processing).
      *   *Functionalist Reply:* Disjunctive role (Interruption OR Local Withdrawal).
      *   *Cost:* Loses explanatory power. If the role is "Damage response type 1 OR type 2 OR...", it's not a unified natural kind anymore. It becomes a list.

  6.  **Refining and Checking Constraints:**
