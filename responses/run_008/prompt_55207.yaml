      *   **Goal:** Construct a thought experiment where Multiple Realizability (MR) holds, but Role-Functionalism strains or breaks.
      *   **Direction:** Support MR (physical diversity implies same mental state) *while* straining Functionalism (causal roles differ too much to be the same functional state).
