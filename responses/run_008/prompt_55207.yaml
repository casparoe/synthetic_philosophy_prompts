      *   *Function:* One interrupts global attention, the other doesn't. One is a centralized command, the other is a local negotiation.
      *   *Functionalism Trouble:* If "Pain" = "State that interrupts global attention to prioritize healing," the Octopus fails. If "Pain" = "State that causes withdrawal," it's too thin (reflexes do this).

  4.  **Drafting the Scenario (One Paragraph):**
      *   Focus on the *integration* aspect.
