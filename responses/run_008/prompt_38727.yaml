answer: |-
  ## The Equity & Evidence Appraisal Protocol (EEAP)

  This procedure is designed to operationalize the critique that archives are instruments of power. It forces a pause before defaulting to tradition or convenience. It is designed to be run in 60–90 minutes per collection series.

  **Pre-requisite:** You must have a copy of the county records retention schedule and your current collection policy in front of you.

  ### Step 1: The Mandate Check (Legal & Administrative)
  *   **Question:** Is there a statutory retention requirement or a pending legal hold on these records?
  *   **Sufficient Answer:**
      *   **Yes:** Follow the schedule. If the schedule says "Permanent," proceed to Step 2 to determine *access* and *context*. If "Destroy," proceed to Step 4 (Silence Check) before destroying.
      *   **No:** Proceed to Step 2.
  *   **Stop Point:** If "Destroy" is mandated and Step 4 does not trigger a hand-off, **DESTROY**.

  ### Step 2: The Power Audit (Subject vs. Actor)
  *   **Question:** Who is the primary *actor* (the one taking action) and who is the primary *subject* (the one acted upon) in these records?
  *   **Sufficient Answer:**
      *   **Actor = Government / Subject = Government:** (e.g., Commissioner memos). Proceed to Step 3.
      *   **Actor = Government / Subject = Private Citizen:** (e.g., Code enforcement, welfare files). Proceed to Step 4.
      *   **Actor = Private Citizen / Subject = Private Citizen:** (e.g., Donated org papers). Proceed to Step 3.
  *   **Note:** This identifies whether the record reinforces state power or documents state impact on individuals.

  ### Step 3: The Redundancy & Privilege Test
  *   **Question:** Does keeping *all* of this material reinforce existing historical narratives without adding new evidentiary value? Is this material already represented in other permanent holdings?
  *   **Sufficient Answer:**
      *   **Yes (High Redundancy/High Privilege):** (e.g., Routine correspondence where the policy decision is already in the minutes). **Recommendation: SAMPLE or DESTROY.** (Hand-off if this contradicts long-standing tradition).
      *   **No (Unique/Counter-Narrative):** Proceed to Step 5.
  *   **Stop Point:** If "Sample/Destroy" is the recommendation, move to **Decision**.

  ### Step 4: The Silence & Harm Check
  *   **Question:** Does destroying this material erase a marginalized voice or a specific instance of state impact that is not documented elsewhere? Conversely, does keeping this material expose vulnerable individuals to harm (privacy/surveillance)?
  *   **Sufficient Answer:**
      *   **Erasure Risk High / Harm Risk Low:** **RETAIN PERMANENTLY.**
      *   **Erasure Risk High / Harm Risk High:** (e.g., Names of undocumented tenants in enforcement files). **HAND-OFF.** (Requires redaction protocol or restricted access decision).
      *   **Erasure Risk Low:** **DESTROY.**
  *   **Stop Point:** If "Hand-off," stop. If "Retain/Destroy," move to **Decision**.

  ### Step 5: The Community Value Override (For Non-Mandated Material)
  *   **Question:** For material without a legal mandate (donations): Does this material fill a documented gap in the holdings regarding a marginalized community?
  *   **Sufficient Answer:**
      *   **Yes:** **RETAIN PERMANENTLY** (Recommend policy update to formalize).
      *   **No:** **DECLINE or DESTROY.**
  *   **Stop Point:** Move to **Decision**.

  ### Decision & Hand-off Matrix
  *   **Retain Permanently:** Professional Judgment.
  *   **Destroy/Sample:** Professional Judgment (unless it violates tradition, then Hand-off).
  *   **Hand-off:** Triggered if:
      1.  Privacy/Harm conflict exists (Send to **County Counsel**).
      2.  Decision contradicts long-standing retention tradition (Send to **Records Board**).
      3.  Acquisition involves non-mandated community records (Send to **Community Advisory Group** for endorsement).

  ***

  ## Application to Cases

  ### Case 1: Sixty boxes of housing-code enforcement files (1970s–1990s)
  *   **Step 1 (Mandate):** Schedule likely says "Retain X years," then destroy. Let's assume the retention period has expired. **Result:** Proceed to Step 4.
  *   **Step 2 (Power Audit):** Actor = Government (Inspectors); Subject = Private Citizens (Tenants/Homeowners in poor neighborhoods). **Result:** Proceed to Step 4.
  *   **Step 4 (Silence & Harm):**
      *   *Erasure Risk:* High. These files document the physical condition of low-income housing, potential displacement, and the state's interaction with poor neighborhoods. This data is rarely preserved.
      *   *Harm Risk:* High. Files contain names, conditions of homes, and potentially immigration status or financial distress.
  *   **Step 5 (Override):** N/A (Government records).
  *   **Decision:** **HAND-OFF.**
  *   **Reasoning:** You cannot make this decision alone. The tension between preserving evidence of systemic neglect (historical value) and protecting the privacy of vulnerable people (ethical/legal risk) is a values question.
  *   **Action:** Send to County Counsel and a Community Advisory Group. Propose a solution: Retain permanently but seal personal identifiers for 75 years, or sample the files to keep statistical data without names.
  *   **Outcome:** *Paused.* The boxes stay in secure storage until the hand-off is resolved.

  ### Case 2: Shoebox of tenant-rights organization photos/notes (Donated, No Mandate)
  *   **Step 1 (Mandate):** No legal mandate to keep private donation. **Result:** Proceed to Step 5.
  *   **Step 2 (Power Audit):** Actor = Private Citizens (Tenants); Subject = Private Citizens/Government (Landlords/County). **Result:** Proceed to Step 5.
  *   **Step 5 (Community Value Override):**
      *   *Gap Analysis:* Your holdings likely contain the landlord/county side of housing disputes (Case 1), but rarely the organized resistance from the tenants' perspective.
      *   *Answer:* **Yes**, this fills a documented gap.
  *   **Decision:** **RETAIN PERMANENTLY.**
  *   **Reasoning:** The procedure overrides the "no mandate" constraint because the *Equity* critique prioritizes filling silences over strict legal minimalism.
  *   **Action:** Accept the donation. Draft a memo to the Records Board recommending a policy update to allow "Community Counter-Archives" acquisitions.
  *   **Outcome:** *Kept.* (This uses resources without legal cover, which may be uncomfortable, but satisfies the critique).

  ### Case 3: Routine correspondence of the County Commissioners
  *   **Step 1 (Mandate):** "Permanent" per traditional schedule. **Result:** Proceed to Step 2.
  *   **Step 2 (Power Audit):** Actor = Government (Commissioners); Subject = Government (Internal). **Result:** Proceed to Step 3.
  *   **Step 3 (Redundancy & Privilege):**
      *   *Question:* Does keeping *all* of this reinforce existing narratives?
      *   *Analysis:* You already keep the Minutes, the Resolutions, and the Policy Files. The routine correspondence ("Thank you for the tour," "Please fix the pothole on Main," "Draft of speech already filed") duplicates the official actions found in the Minutes. Keeping *everything* privileges the voices of the Commissioners over the constituents who wrote to them (which you likely destroy).
      *   *Answer:* **Yes (High Redundancy/High Privilege).**
  *   **Decision:** **SAMPLE / DESTROY MAJORITY.**
  *   **Reasoning:** The procedure identifies this as "Power Reinforcement." Keeping every letter preserves the *status* of the Commissioners rather than the *function* of the office.
  *   **Action:** Retain only correspondence related to policy formulation or significant controversy. Destroy routine constituent mail and administrative scheduling.
  *   **Outcome:** **The Answer You Won't Like.**
      *   *Why:* You have "always kept this without thinking." It feels safe. It protects the office. This procedure tells you that by keeping it all, you are actively participating in the "archives as instruments of power" problem. It requires you to destroy the bulk of the Commissioners' mail, which may feel politically risky or professionally heretical in your office culture.

  ***

  ## Limitations: What This Procedure Cannot Do

  You asked for explicitness regarding the limits of appraisal. You must accept the following constraints:

  **1. The Upstream Silence Problem**
  This procedure cannot fix the fact that the records were never created.
  *   *The Reality:* If the county never generated records about undocumented migrants because they were intentionally kept invisible, no appraisal decision can conjure those files. Appraisal is downstream; it manages the *second* erasure (destruction), not the *first* (non-creation).
  *   *The Mitigation:* The best this procedure can do is preserve the *evidence of the silence*. For example, in Case 1, if the files show inspections stopped at a certain border or neighborhood, keeping them documents the neglect. But it cannot give voice to the people who were never written down.

  **2. The Resource Paradox**
  The procedure (specifically in Case 2) may direct you to keep materials you have no budget to process.
  *   *The Reality:* "Retain Permanently" costs money, space, and time. If you follow the equity critique, your backlog will grow.
  *   *The Mitigation:* This procedure forces the value conflict into the open (via the Hand-off), but it cannot generate funding. It shifts the burden of the "values decision" to the Board or Community, but you remain the one stacking the boxes.

  **3. The "Good Archivist" Trap**
  Following this procedure does not absolve you of power.
  *   *The Reality:* You are still the gatekeeper deciding what counts as a "marginalized voice" in Step 5. You are still the one defining "Harm" in Step 4.
  *   *The Mitigation:* This is why the **Hand-off** is critical. If the decision relies on your personal moral judgment, you have failed the procedure. If the decision relies on a directive from a Community Advisory Group or Counsel based on your data, you have successfully distributed the power.

  **4. The Access Lag**
  *   *The Reality:* Keeping the housing files (Case 1) permanently does not help the tenants today. It helps a historian in 2075.
  *   *The Mitigation:* Appraisal is not reparations. It is stewardship. This procedure ensures the evidence survives for future accountability, but it cannot provide present justice.

  ### Final Instruction
  Run this protocol. When it tells you to destroy the Commissioners' mail (Case 3), do not flinch. That is the moment the critique moves from theory to practice. When it tells you to keep the Tenant Rights shoebox (Case 2) without a mandate, do not hesitate. That is the moment you stop being a warehouse for the state and start being an archivist for the county.
