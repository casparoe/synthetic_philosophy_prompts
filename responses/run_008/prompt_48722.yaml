answer: |-
  Here is the plan for your 40-minute session.

  ### The Session Plan

  **1. The Setup: The Problem (PMI) [0:00–0:05]**
  Start immediately with the **Pessimistic Meta-Induction (PMI)**. Do not start with definitions. You need to create a crisis before offering a solution. Ask the group: "Name a scientific theory from 100 years ago that we now think is false." (They will say Ether, Phlogiston, Caloric, etc.). Point out that those scientists had evidence, just like we do. The PMI argues that since past theories were wrong about what exists, current theories are probably wrong too. This motivates the need for a position that isn't naive realism. If you start with the No-Miracles Argument (NMA) first, students will just assume realism is true and won't feel the pressure of the historical counter-evidence.

  **2. The Constraint: The Success (NMA) [0:05–0:10]**
  Once the PMI has sunk in (science might be wrong about reality), hit them with the **No-Miracles Argument (NMA)**. Science works too well to be totally false. GPS, medicines, and bridges rely on these theories. If the theories were completely wrong about the world, their success would be a miracle. Now you have the tension: History says "You're wrong about what exists" (PMI), but Success says "You must be right about something" (NMA). Structural Realism (SR) is the bridge between these two.

  **3. The Solution: Defining SR & The "Obvious" Trap [0:10–0:20]**
  Define SR: We should be realist about the *structure* (relations, equations) but agnostic about the *nature* of the entities (objects, substances).
  **Crucial Moment:** This is where someone will ask, *"Isn't this obvious? Science gets the math right but the story wrong."*
  Do not skip this. Stop and address it here. Explain that Instrumentalism says "Don't believe the math is true either, it's just a tool." SR makes a stronger claim: "The math describes the actual structure of reality, even if the objects don't exist." This distinguishes SR from "just using math."
  **The Physics Guy:** He may call this vacuous ("What is structure without stuff?"). Acknowledge this is the main philosophical criticism (the "structure without relata" problem), but note that for this session, we are treating structure as fundamental relations that don't necessarily need "stuff" to hold them together.

  **4. The Carrying Example: Caloric Theory of Heat [0:20–0:30]**
  Move to the whiteboard. Draw the **Caloric Theory** (late 1700s).
  *   **The Ontology (What Dies):** Scientists believed heat was a invisible fluid called "caloric" that flowed from hot to cold bodies. This entity does not exist.
  *   **The Structure (What Survives):** Fourier's laws of heat conduction. The equations describing how heat moves, conservation of energy principles, and the relationships between temperature, pressure, and volume.
  *   **The Point:** When Kinetic Theory replaced Caloric, the "fluid" was thrown out, but the *equations* (the structure) were kept and are still used today. SR says those equations were tracking reality even when the "fluid" story was false. This is clearer than Fresnel because it separates "substance" from "law" very cleanly.

  **5. Misconceptions & Wrap [0:30–0:35]**
  Address the remaining misconceptions.
  *   **"Structure = Equations":** Clarify that equations are our *map* of the structure, not the structure itself. The structure is the actual relational pattern in the world.
  *   **Physics Guy Check:** If he says "This is trivial," remind him that SR claims the *relations* are the ontology, not just instruments. That is a heavy metaphysical claim, not a trivial one.

  **6. The Comprehension Check [0:35–0:40]**
  End with the check question (detailed in the JSON). Do not let them leave without answering this. It forces them to distinguish SR from both Naive Realism and Instrumentalism.

  ***

  ### What to Refuse to Cover
  You have 40 minutes. If you try to cover the following, you will fail to explain the core concept. Explicitly tell the group: *"We are skipping the technical distinctions between Epistemic and Ontic Structural Realism, and we are not discussing Ramsey Sentences or the specific formal logic of Worrall vs. Ladyman. We are focusing on the core intuition."*

