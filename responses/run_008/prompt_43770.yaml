answer: |-
  ### The implicit theory, stated plainly

  The rulebook presupposes a Public Fiduciary Theory. It assumes public officials hold authority in trust for an impersonal collective, whereas private buyers act as agents for private profit. This explains the stark asymmetry: entertaining a private manager aligns with their profit mandate, but entertaining an official diverts loyalty from the public to the giver. The wrong isn't merely purchasing a specific decision (quid pro quo), because if it were, private bribery would be treated similarly. Instead, the wrong is the commodification of public authority itself. Any private benefit risks converting a public role into a private asset. The appearance of impropriety clause reinforces this: because the official belongs to the public, even the suggestion of private allegiance damages institutional legitimacy. The theory posits that public office is not a personal resource to be leveraged for relationship-building, regardless of whether a specific contract is awarded in return. Consequently, the rules treat the official's capacity to decide as public property, making any private claim on that capacity a potential theft of public trust. This framework implies that the official's neutrality is a fragile public good that must be insulated from the normal grease of commercial socialization.

  ### Do the parts cohere?

  The components do not fully cohere; they reveal a tension between the Fiduciary Theory and a crude Transactional Theory. The public/private asymmetry and the appearance standard fit the Fiduciary model perfectly, focusing on loyalty and institutional trust. However, the dollar caps and gift registers presuppose a Transactional view: that corruption is a function of price. By allowing gifts under a certain threshold, the rules imply that small benefits cannot purchase influence, contradicting the Fiduciary view that any private benefit compromises public loyalty. Similarly, the register treats corruption as discrete, recordable events, whereas the appearance standard implies a cumulative erosion of trust. If the wrong is the diversion of public loyalty, a twenty dollar gift given strategically is as theoretically problematic as a two hundred dollar gift given randomly. The rules try to manage a relational problem with transactional tools, creating a gap where compliant behavior can still generate the very obligations the Fiduciary Theory seeks to prevent. Furthermore, the register creates a false sense of security, implying that if it is written down, it is clean, ignoring the anthropological reality that the binding power of a gift lies in the unrecorded social debt it creates, not its ledger value. This incoherence leaves sales teams navigating a system that says loyalty is paramount but measures price per item, forcing them to game the timing of gifts rather than avoid the obligation entirely.

  ### What the rules could survive losing

  The rules are philosophically underdetermined; they could survive losing the Fiduciary Theory entirely. A rival Administrative Pragmatism theory would license the exact same rules. This theory argues that because total prohibition is unenforceable and culturally disruptive, bright lines are necessary simply to make compliance auditable. Under this view, the caps aren't moral boundaries where corruption begins; they are administrative thresholds where enforcement becomes feasible. Similarly, the public/private split could be justified not by fiduciary duty, but by Legal Risk Allocation: public officials trigger statutory liability, while private buyers do not. The rules don't prove the Fiduciary Theory is true; they only prove the company wants to avoid prosecution. You could replace the moral language of public trust with risk mitigation and keep every cap and register entry identical. The rules are optimized for legal defensibility, not moral consistency, meaning the stated theory is often just post-hoc justification for enforceable boundaries. Additionally, a theory of Customary Business Practice could justify the modest hospitality exception, arguing that norms define corruption, not abstract principles. This confirms the rules are a compromise between competing philosophies rather than a pure application of one. Thus, the compliance regime is a patchwork designed to satisfy auditors and prosecutors, not necessarily to resolve the philosophical puzzle of where a gift becomes a bribe. It functions as a shield against liability rather than a guide to ethical truth.

  ### If relational capture is the real story

  If relational capture is the real danger, the rules would shift from tracking items to tracking patterns. Dollar caps would become obsolete, replaced by aggregate limits on total value transferred per official per year, regardless of individual item size. Registers would log interactions and hospitality frequency, not just physical gifts, to detect the buildup of obligation over time. Cooling-off periods would be mandatory: no gifts or hospitality during active tender processes, regardless of value, to prevent timing-based leverage. The public/private split would likely survive, as the fiduciary risk remains distinct, but the mechanism would change from price control to relationship auditing. Culturally, universal caps might be replaced by localized protocols that distinguish between ceremonial relationship-building and influence-peddling, acknowledging that in some contexts, refusing a gift is the greater ethical breach. This would require compliance officers to judge context and intent rather than just checking receipts, moving from a box-ticking exercise to a substantive evaluation of whether a relationship has become too indebted to remain impartial. Ultimately, the focus would move from preventing the transfer of value to preventing the creation of undue dependency.
