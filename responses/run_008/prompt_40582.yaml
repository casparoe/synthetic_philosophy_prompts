answer: |-
  # Joint Statement on the Internal/External Reasons Debate
  **Authors:** Tom (Internalist) and [User] (Externalist)
  **Date:** Post-Sunday Collaboration

  ## 1. Agreed Claims
  *The following claims are endorsed by both parties without reservation. We stipulate that signing these does not imply agreement on the unresolved definitions contained within them.*

  1.  **The Uncontroversial Core:** There exists a subset of reason-claims (e.g., "A has a reason to drink water" when A is thirsty and believes water quenches thirst) where the reason is plainly grounded in an element of A's motivational set connected to the action via a sound deliberative route. Neither party disputes the truth of these claims.
  2.  **The Battleground:** The substantive disagreement is restricted to "recalcitrant cases": agents whose motivational sets are inert, self-undermining, bizarre, or blocked by psychological barriers (e.g., depression, laziness, ignorance not easily corrected).
  3.  **Deliberative Route Ambiguity:** We agree that the phrase "sound deliberative route" (SDR) is ambiguous between (a) a route the agent could *actually* traverse given their current cognitive capacities and psychological state, and (b) a route the agent would traverse under *idealized* conditions (full information, vivid imagination, psychological health). Resolving this ambiguity is necessary to settle the debate.
  4.  **Motivational Set Ambiguity:** We agree that the phrase "subjective motivational set" (S) is ambiguous between (a) occurrent desires and projects held at time *t*, and (b) a broader set including latent dispositions, values, and cares that would surface under reflection but are currently dormant.
  5.  **Distinct Claims:** We agree that the claim "A has a reason to $\phi$ but no SDR from A's current S reaches $\phi$" is logically distinct from the claim "A would have a motivation to $\phi$ if A's S were idealized." Conflating these two claims has obscured the debate.

  ## 2. Residual Disagreements and Verbal Diagnosis
  *The following table outlines where we remain opposed. Each row is phrased such that the proponent can endorse it without conceding the other side's terminology.*

  | Issue | Tom's Position (Internalism) | [User]'s Position (Externalism) | Status |
  | :--- | :--- | :--- | :--- |
  | **Truth Conditions** | The statement "A has a reason to $\phi$" is true *only if* there is a sound deliberative route from A's *actual* S to $\phi$-ing. If no such route exists, the statement is false (or merely exhortative). | The statement "A has a reason to $\phi$" can be true even if no sound deliberative route exists from A's *actual* S to $\phi$-ing, provided $\phi$-ing is objectively justified or would be motivated under ideal conditions. | **Substantive** |
  | **The Lazy Man** | Regarding the lazy, miserable agent: If their current S contains no element that leads to alleviating misery via deliberation, they have *no reason* to act. To say otherwise is to speak falsely or to use "reason" to mean "would be good for them." | Regarding the lazy, miserable agent: They *do* have a reason to act to alleviate misery, even if their current laziness blocks the deliberative route. The reason exists independently of their capacity to access it via their current S. | **Substantive** |
  | **Verbal Diagnosis** | I contend that the word "reason" in ordinary discourse univocally tracks *deliberative availability*. When the Externalist says "reason," they are often tracking *normative justification* but labeling it "reason," which creates a verbal illusion of disagreement about the same concept. | I contend that the word "reason" in ordinary discourse is ambiguous, often tracking *normative justification*. When the Internalist says "no reason," they are correctly describing *deliberative unavailability* but incorrectly inferring a lack of *normative justification*, creating a verbal illusion of agreement. | **Joint Diagnosis** |

  ## 3. Cruxes and Test Cases
  *The following are the specific sub-questions that, if settled, would force at least one of us to revise our position. For each crux, we have constructed a case where our predictions diverge, along with an honest assessment of where each side must "squirm."*

  ### Crux A: The Scope of the Sound Deliberative Route (Actual vs. Ideal)
  **The Question:** Does the "sound deliberative route" requirement permit correcting psychological defects (e.g., depression, apathy) that block deliberation, or must the route be traversable from the agent's *current* psychological constitution?

  **The Case: The Depressed Philosopher**
  *   **Setup:** A philosopher values truth and writing. She develops severe clinical depression. The depression does not change her values (she still "cares" deep down), but it cognitively blocks her from forming any intention to write or seek help. There is no *actual* deliberative route from her current state to action; she is paralyzed. However, if the depression were lifted (idealized condition), she would immediately act.
  *   **Tom's Prediction:** I must say she has **no reason** to write or seek help *while depressed*. The SDR is blocked by her actual psychological constitution. To say she has a reason is to ignore the "internal" constraint.
      *   *The Squirm:* This implies the depressed person literally has no reason to seek cure. It makes "reason" hostage to temporary psychological pathology, which seems to undermine the normative force of reasons precisely when they are needed most.
  *   **[User]'s Prediction:** I must say she **has a reason** to write and seek help. The reason is grounded in her enduring values or objective well-being, not her current cognitive access.
      *   *The Squirm:* I must admit she has a reason she is psychologically incapable of acknowledging or acting upon. This risks severing the link between "having a reason" and "being able to be motivated by it," making reasons inert entities floating outside the agent's psychology.

  ### Crux B: The Content of the Motivational Set (Occurrent vs. Dispositional)
  **The Question:** Does the "subjective motivational set" (S) include only active, occurrent motivations, or does it include latent dispositions that would emerge under reflection but are currently inactive?

  **The Case: The Unreflective Hedonist**
  *   **Setup:** A young agent currently cares *only* about immediate sensory pleasure. They have no occurrent desire for long-term relationships or career. However, they possess a latent disposition: if they were to vividly imagine their future self and reflect calmly (without new information), they would develop a care for their future well-being. Currently, this disposition is dormant and plays no role in their actual deliberation.
  *   **Tom's Prediction:** If the disposition is truly dormant and not part of the *actual* S guiding current deliberation, I must say there is **no reason** for them to sacrifice pleasure now for the future. If I count the latent disposition as "in S," I risk expanding S so broadly it includes everything the agent *would* want, collapsing my view into the Externalist's "idealized" view.
      *   *The Squirm:* I have to draw a line between "in S" and "not in S" that looks arbitrary. If I say the disposition counts, I admit reasons can exist for motivations the agent doesn't currently feel. If I say it doesn't count, I tell the agent they have no reason to avoid future misery.
  *   **[User]'s Prediction:** I say there **is a reason** to care for the future. Whether that reason is grounded in the latent disposition (Hypothetical Internalism) or in objective facts (Hard Externalism) matters less than the result: the agent is mistaken about their reasons.
      *   *The Squirm:* If I ground this in the latent disposition, I am vulnerable to Tom's charge that I am just a "soft" Internalist. If I ground it in objective facts, I must explain why this latent disposition feels so relevant to the reason's existence.

  ### Crux C: The Bizarre Agent (Normative Authority vs. Motivational Anchor)
  **The Question:** Can an agent have a reason to $\phi$ if $\phi$-ing connects to nothing in their motivational set, not even under idealization, because their set is coherent but bizarre?

  **The Case: The Spoon Counter**
  *   **Setup:** An agent has a coherent, stable motivational set. Their *only* desire is to maximize the number of spoons in their kitchen drawer. They have no desire for morality, prudence, happiness, or the well-being of others. A sound deliberative route from "count spoons" does not lead to "help a neighbor in need."
  *   **Tom's Prediction:** I must say the agent has **no reason** to help the neighbor. Their S provides no tether. To say otherwise is to impose an external standard that is not *their* reason.
      *   *The Squirm:* This commits me to the view that a coherent but morally monstrous (or just bizarre) agent literally has no reason to be moral. It makes normative reasons contingent on the luck of one's motivational constitution.
  *   **[User]'s Prediction:** I must say the agent **has a reason** to help the neighbor (and perhaps a reason not to obsess over spoons). The reason exists regardless of the SDR from their bizarre S.
      *   *The Squirm:* I must explain in what sense this is a reason *for the agent*. If it cannot connect to any motivation they have or could have (even under idealization of their *actual* set), the "reason" seems to lose its grip on agency. It becomes a cosmic "ought" with no psychological hook.

  ***

  **Signatures:**

  _________________________ (Tom)

  _________________________ ([User])
