  5.  **Synthesize the Argument regarding the User's Observations:**
      *   *Observation 1 (Bad Reasoning):* Many people *think* they reasoned into it. They saw a blog, did some "research" (confirmation bias), and concluded X. So the slogan is empirically false for many cases.
