prompt: |-
  I run a game theory study group and I want one really clean worked example where the Nash bargaining solution and the Kalai-Smorodinsky solution genuinely disagree about who should get more -- not just differ by a couple decimals, but disagree about the direction, so the person who comes out worse under Nash comes out better under KS. Everytime I try to build one myself I either get the same split from both solutions or the scenario ends up so contrived it's useless for teaching. Constraints: it should be something a normal person could actually be in (a business buyout, two roommates splitting a shared apartment's stuff, whatever), it has to fit in one paragraph, and keep the pie fixed with a linear frontier -- no risk aversion or nonlinear utilities, I want the disagreement to come from the structure of the bargaining problem itself, not from wacky utility functions. After the scenario, do the full walk-through: set up the disagreement point and each person's ideal point, show the actual math for both solutions and why each split comes out the way it does, and tell me exactly which feature of the scenario is doing the work in splitting them apart -- I want to be able to point at it in front of the group. Then give me the counter from a Nash partisan: why they'd say the KS split is off here (is it that it rewards having bad outside options, or that the ideal point shouldn't matter, or something else?), and whether tweaking that one feature makes the two solutions converge again.
