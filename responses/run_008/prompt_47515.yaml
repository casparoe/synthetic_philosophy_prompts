answer: |-
  ### The Scenario
  Alice and Bob are freelance consultants splitting a guaranteed \$100,000 joint project fee. They have linear utility for money (the "pie" is fixed). If they fail to agree, Alice keeps a \$10,000 retainer she already earned, and Bob gets nothing. However, Alice has a strict debt covenant that legally caps her annual income at \$70,000; any allocation giving her more than \$70k is infeasible (she would default on her loans), while Bob has no upper limit. They must agree on a split $(x, y)$ such that $x + y = 100,000$, $x \ge 10,000$, $y \ge 0$, and $x \le 70,000$.

  ### The Walk-Through

  **1. Setup**
  *   **Disagreement Point ($d$):** $(10, 0)$ (in thousands).
  *   **Feasible Set ($S$):** The line segment $x + y = 100$ bounded by $10 \le x \le 70$.
  *   **Total Surplus:** $100 - 10 - 0 = 90$.

  **2. Nash Bargaining Solution (NBS)**
  Nash maximizes the product of gains: $(x - 10)(y - 0)$ subject to $x + y = 100$.
  *   Substitute $y = 100 - x$: Maximize $(x - 10)(100 - x)$.
  *   First-order condition yields an equal split of the surplus: $x - 10 = y - 0$.
  *   $x - 10 = (100 - x) \Rightarrow 2x = 110 \Rightarrow x = 55$.
  *   **NBS Outcome:** Alice gets **\$55k**, Bob gets **\$45k**.
  *   *Check:* Is $x \le 70$? Yes. The cap does not bind.
  *   *Winner:* **Alice** (she gets \$10k more than Bob).

  **3. Kalai-Smorodinsky Solution (KSS)**
  KSS maintains the ratio of maximum possible gains relative to the "Ideal Point" ($a$).
  *   **Find Ideal Point ($a$):**
      *   $a_1$ (Alice's max): Max $x$ in $S$. Due to the debt cap, $a_1 = 70$ (where $y=30$).
      *   $a_2$ (Bob's max): Max $y$ in $S$. Occurs at min $x$ ($10$). So $a_2 = 90$ (where $x=10$).
      *   $a = (70, 90)$.
  *   **Calculate Gains:**
      *   Alice's Max Gain: $70 - 10 = 60$.
      *   Bob's Max Gain: $90 - 0 = 90$.
      *   Ratio: $60:90$ or $2:3$.
  *   **Solve:** The solution lies on the line from $d(10,0)$ through $a(70,90)$.
      *   Slope = $90/60 = 1.5$. Equation: $y - 0 = 1.5(x - 10)$.
      *   Intersect with Pie ($x + y = 100$): $x + 1.5(x - 10) = 100$.
      *   $2.5x - 15 = 100 \Rightarrow 2.5x = 115 \Rightarrow x = 46$.
      *   $y = 54$.
  *   **KSS Outcome:** Alice gets **\$46k**, Bob gets **\$54k**.
  *   *Winner:* **Bob** (he gets \$8k more than Alice).

  **4. The Divergence Feature**
  Point to **Alice's Income Cap**.
  Under Nash, the cap is irrelevant because the solution (\$55k) never touches it; Nash satisfies *Independence of Irrelevant Alternatives (IIA)*. Under Kalai-Smorodinsky, the cap shrinks Alice's "Ideal Point" from 100 to 70. KSS interprets this reduced *potential* as a reduced *claim*, even though Alice doesn't actually need the full 100. KSS penalizes Alice for a constraint she doesn't hit, while Nash ignores it.

  ### The Nash Partisan Counter-Argument
  A Nash defender would argue: **"Why punish Alice for a constraint she doesn't hit?"**
  At the margin (around \$55k), Alice is not constrained. Her ability to trade dollars with Bob is identical to Bob's. KSS violates IIA by letting the remote boundary (\$70k) dictate the split at \$46k. It effectively rewards Bob for having *no* upper limit, even though he doesn't use that capacity. This creates a perverse incentive: Alice should hide her cap or take on more debt to artificially inflate her "Ideal Point" and recover her share, whereas Nash is stable regardless of her external financial constraints.

  **Convergence:**
  If you remove Alice's debt cap (setting $x \le 100$), her Ideal Point becomes 100. Both players then have a Max Gain of 90. KSS demands an equal split of gains, resulting in $x=55, y=45$. The solutions converge immediately once the "irrelevant" truncation is removed.
