      *   *Wait, I need them to disagree on the **direction**.*
      *   In the above: NBS says Equal. KSS says B > A. This is a disagreement on direction (Equality vs Inequality).
      *   Can I make NBS say A > B and KSS say B > A?
      *   To make NBS say A > B, I need asymmetric disagreement points.
      *   Let $d = (10, 0)$. Frontier $x+y=100$. Cap on A at 70.
      *   NBS: Split surplus $(100 - 10 - 0) = 90$ equally.
          *   $x = 10 + 45 = 55$.
          *   $y = 0 + 45 = 45$.
          *   NBS: A > B.
      *   KSS:
          *   Ideal A: Max $x$ s.t. $x \le 70, y \ge 0$. So $a_1 = 70$.
          *   Ideal B: Max $y$ s.t. $x \ge 10$ (IR). So $y = 90$. $a_2 = 90$.
          *   Wait, KSS ideal point is usually defined over the whole feasible set $S$, not just IR. But standard definition is $a_i = \max \{u_i : u \in S, u_j \ge d_j\}$.
          *   So $a_1 = 70$ (since $y=30 \ge 0$).
          *   $a_2 = 90$ (since $x=10 \ge 10$).
          *   Gains: $g_1 = 70 - 10 = 60$. $g_2 = 90 - 0 = 90$.
          *   Ratio $g_1/g_2 = 60/90 = 2/3$.
          *   KSS requires $\frac{x-10}{60} = \frac{y-0}{90}$.
          *   $3(x-10) = 2y \implies 3x - 30 = 2y \implies y = 1.5x - 15$.
          *   Constraint: $x+y=100$.
          *   $x + 1.5x - 15 = 100 \implies 2.5x = 115 \implies x = 46$.
          *   $y = 54$.
      *   Result:
          *   NBS: A=55, B=45. (A wins).
          *   KSS: A=46, B=54. (B wins).
      *   *This works!*
      *   *Constraint Check:* "keep the pie fixed with a linear frontier".
      *   The frontier is $x+y=100$. This is linear.
      *   The asymmetry comes from the **cap** on Player A (truncating the feasible set) and the **asymmetric disagreement point**.
      *   Is the cap "contrived"? "A business buyout... liability cap". That's realistic.
      *   Is it one paragraph? Yes.
