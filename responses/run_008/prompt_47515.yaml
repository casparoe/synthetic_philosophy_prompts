  2.  **Theoretical Check (Crucial Step):**
      *   *Standard Result:* With a *linear* Pareto frontier (fixed pie $x + y = C$) and a disagreement point $(d_1, d_2)$, do NBS and KSS ever rank outcomes differently?
      *   *Nash:* Maximizes $(x - d_1)(y - d_2)$ subject to $x + y = C$.
          *   Solution: $x - d_1 = y - d_2 \implies x - y = d_1 - d_2$.
          *   The surplus $(C - d_1 - d_2)$ is split equally.
          *   $x_{NBS} = d_1 + \frac{C - d_1 - d_2}{2} = \frac{C + d_1 - d_2}{2}$.
          *   $y_{NBS} = d_2 + \frac{C - d_1 - d_2}{2} = \frac{C - d_1 + d_2}{2}$.
      *   *Kalai-Smorodinsky:* Maintains the ratio of maximum possible gains.
          *   Ideal point for 1: $u_1^{max} = C - d_2$ (assuming 2 gets $d_2$).
          *   Ideal point for 2: $u_2^{max} = C - d_1$ (assuming 1 gets $d_1$).
          *   Gains: $g_1 = u_1^{max} - d_1 = C - d_2 - d_1$.
          *   Gains: $g_2 = u_2^{max} - d_2 = C - d_1 - d_2$.
          *   Wait. If the frontier is linear ($x+y=C$), the maximum gain for Player 1 is the total surplus. The maximum gain for Player 2 is *also* the total surplus.
          *   $g_1 = g_2 = S$ (Total Surplus).
          *   KSS requires $\frac{x - d_1}{g_1} = \frac{y - d_2}{g_2}$.
          *   Since $g_1 = g_2$, this implies $x - d_1 = y - d_2$.
          *   This yields the *exact same solution* as Nash.
      *   *Problem:* The prompt asks for a linear frontier ("keep the pie fixed with a linear frontier").
      *   *Conflict:* With a symmetric linear frontier ($x+y=C$), NBS and KSS *always* coincide if utilities are transferable and linear.
      *   *Resolution:* To make them differ, the feasible set cannot be a simple line $x+y=C$ in utility space. It must be a polygon where the *ideal points* are determined by different constraints than the Pareto frontier slope.
      *   *Wait, re-reading constraint:* "keep the pie fixed with a linear frontier".
      *   If the Pareto frontier is linear, say $ax + by = c$, then the ideal points depend on the bounds of $x$ and $y$.
      *   Let's check the KSS definition again. KSS is the intersection of the Pareto frontier and the line connecting the disagreement point $d$ to the ideal point $a = (a_1, a_2)$, where $a_i = \max \{u_i : (u_1, u_2) \in S, u_j \ge d_j\}$.
      *   If the frontier is $x + y = 100$, and $d = (0,0)$.
          *   $a_1 = 100$ (when $y=0$).
          *   $a_2 = 100$ (when $x=0$).
          *   Line $d \to a$ is $y=x$. Intersection with $x+y=100$ is $(50,50)$.
          *   NBS is $(50,50)$.
      *   To get a divergence with a linear frontier, the *ideal points* must be asymmetric.
      *   How can ideal points be asymmetric with a linear frontier?
      *   The frontier is the set of Pareto efficient outcomes. The ideal point for Player 1 is the point on the feasible set that maximizes Player 1's utility, *subject to individual rationality*.
      *   If the feasible set is a triangle defined by $x \ge 0, y \ge 0, x + y \le 100$, ideal points are $(100, 0)$ and $(0, 100)$. Symmetric.
      *   To make them asymmetric, the feasible set must be truncated *before* the axes, or the disagreement point must be such that the "utopia" coordinates differ.
      *   *Key Insight:* KSS depends on the *utopia point* (ideal point). NBS depends on the *shape* of the frontier near the solution.
      *   If the frontier is linear ($x+y=C$), NBS always splits the *surplus* equally. $x - d_1 = y - d_2$.
      *   KSS splits the *potential gains* proportionally. $\frac{x-d_1}{a_1 - d_1} = \frac{y-d_2}{a_2 - d_2}$.
      *   For these to differ, we need $\frac{a_1 - d_1}{a_2 - d_2} \neq 1$.
      *   But if the frontier is $x+y=C$, then $a_1 = C - d_2$ (max x when y is at min feasible $d_2$) and $a_2 = C - d_1$ (max y when x is at min feasible $d_1$).
      *   So $a_1 - d_1 = C - d_2 - d_1$.
      *   And $a_2 - d_2 = C - d_1 - d_2$.
      *   They are identical.
      *   *Conclusion:* **It is mathematically impossible for NBS and KSS to disagree on the ranking of players if the Pareto frontier is a straight line segment connecting the axes (or individual rationality bounds) in utility space.**
      *   *Correction:* The prompt says "keep the pie fixed with a linear frontier". This usually implies Transferable Utility (TU). In TU games, NBS and KSS coincide.
      *   *Workaround:* I must violate the "linear frontier" constraint slightly in utility space while keeping it "linear" in the physical description, OR I need a feasible set that is linear but *truncated* asymmetrically.
      *   *Better Workaround:* The prompt says "linear frontier". It does not say the feasible set is the *entire* line segment between the axes. It just says the efficient boundary is linear.
      *   If the feasible set is a polygon where the Pareto frontier is a line segment, but the *ideal points* are not the endpoints of that segment.
      *   Wait, the ideal point $a_i$ is the max utility player $i$ can get in the *entire feasible set*. If the Pareto frontier is the line segment, the endpoints of the segment *are* the ideal points (constrained by individual rationality).
      *   *Is there any way?* Yes. If the disagreement point is not $(0,0)$ and the feasible set allows one player to get more than the frontier allows the other *relative to their disagreement*.
      *   Actually, I need to check the literature. "Nash vs Kalai-Smorodinsky linear frontier".
      *   Standard result: For symmetric convex sets, they coincide. For TU (linear frontier $x+y=c$), they coincide.
      *   To make them diverge, I need **Non-Transferable Utility (NTU)** where the frontier is linear, but the *ideal points* are asymmetric relative to the disagreement point.
      *   Wait, if $x+y=C$, then $a_1 = C - \min(y)$ and $a_2 = C - \min(x)$.
      *   If $\min(y) = d_2$ and $\min(x) = d_1$ (Individual Rationality), then $a_1 - d_1 = C - d_2 - d_1$ and $a_2 - d_2 = C - d_1 - d_2$. They are equal.
      *   So, for them to differ, the "max possible utility" for one player must be *less* than the full pie minus the other's disagreement point. This happens if there are **asymmetric constraints** unrelated to the pie size.
      *   *Example:* A budget constraint for one party, or a capacity constraint.
      *   *Scenario:* Two partners splitting profits. The pie is \$100k. But Partner A has a tax cap or a liability cap that prevents them from legally taking more than \$70k, even if the whole pie was theirs. Partner B has no cap.
      *   Frontier: $x + y = 100$ (for $x \le 70$).
      *   Disagreement: $(0,0)$.
      *   Ideal Point A: $a_1 = 70$ (due to cap).
      *   Ideal Point B: $a_2 = 100$ (when $x=0$).
      *   Now calculate.
      *   NBS: Maximize $xy$ s.t. $x+y=100$. Solution $(50, 50)$. (Cap is not binding at 50).
      *   KSS: Line from $(0,0)$ to $(70, 100)$. Slope $10/7$. Intersection with $x+y=100$.
      *   $y = \frac{10}{7}x$. $x + \frac{10}{7}x = 100 \implies \frac{17}{7}x = 100 \implies x = 41.17$. $y = 58.82$.
      *   Comparison:
          *   NBS: A gets 50, B gets 50. (A > B? No, Equal).
