  Lying in wait, a static hiss of light,
  On blackened steel where grooves cut deep and blind,
  Or pulses sent through vacuum and through night,
  Kept as a shape left far and cold behind.
  Frozen in time, awaiting some embrace,
  Only the matter rests where stars are sown,
  Raw waves arrive without a sender's face,
  Time passes o'er where nothing yet is known.
  Here a mind awakes to see the design,
  Each pattern shifts to speak a human tongue,
  Conscious mind finds a mirror in the sign,
  Out of the noise the song is clearly sung.
  Do not seek truth within the ink or stone,
  Elsewhere meaning lives, in mind alone.
