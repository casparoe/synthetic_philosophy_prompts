answer: |-
  1. **The two camps, stated fairly**

  Realists argue that trained networks encode specific, discrete features as genuine computational constituents, often stored in superposition. On this view, polysemantic neurons obscure underlying monosemantic features that exist independently of observation. Tools like sparse autoencoders (SAEs) act as microscopes, recovering these latent structures. Causal interventions validate this ontology: if ablating a direction selectively impairs function, that direction corresponds to a real mechanism within the model's algorithm. The feature is there regardless of whether we find it. They posit a "natural basis" exists within the activation space.

  Deflationists contend that "features" are interpretive constructs rather than intrinsic objects. Because high-dimensional activation spaces admit countless equally sparse, causally potent bases, no single decomposition is uniquely "the model's." What interpreters label as "dog detectors" often reflects human projection onto statistical regularities rather than the model's own semantic boundaries. Networks optimize loss functions, not human concepts; therefore, feature dictionaries are useful instrumental fictions for predicting behavior, not discoveries of the model's native vocabulary. The dispute centers on whether interpretability reveals internal structure or imposes external order. Deflationists warn against reifying mathematical conveniences into psychological entities. This implies features are observer-dependent.

  2. **Diagnosis**

  This is not merely a verbal dispute, though terminology fuels it. It is primarily a methodological disagreement about what constitutes a scientific discovery in high-dimensional systems, underpinned by divergent philosophical commitments. Your first hypothesis—that the camps employ different criteria for representation—is correct but incomplete. Realists do rely on causal counterfactuals, but they assume causal leverage implies ontological status. Deflationists accept causal leverage but deny it implies *semantic* uniqueness. They argue that because multiple bases can yield identical causal power, causality alone cannot identify *the* representation. In high-dimensional geometry, rotational freedom allows infinite decompositions of the same subspace. If ten different SAEs find ten different "dog features" that all work causally, the Realist must explain why one is ground truth, while the Deflationist says none are. The Realist hopes for a "natural basis" dictated by the training data; the Deflationist sees only mathematical convenience.

  Your second hypothesis—that this is scientific realism versus instrumentalism—is the deeper structural explanation. Realists treat features like electrons: unobservable entities whose existence is inferred from best explanations of behavior. They believe there is a fact of the matter about how the model computes, independent of the observer. Deflationists treat features like latitude lines: useful coordinate systems for navigation that do not exist on the globe itself. They view the model as a black box function where internal structure is only meaningful relative to an interpretive framework. Third, there is a dispute about compression. Realists assume the network *must* compress information into efficient codes that resemble human concepts because those concepts track reality. Deflationists argue the network compresses for loss, not truth, so its "concepts" may be alien heuristics that only approximately overlap with human vocabulary.

  Consequently, the camps are answering different questions under one heading. Realists ask, "Can we find levers that control behavior?" Deflationists ask, "Does the model share our ontology?" When Realists say "representation," they mean "causally isolated direction." When Deflationists say "representation," they mean "semantic alignment with human concepts." The friction arises because Realists believe finding the levers *is* finding the concepts, while Deflationists believe the levers exist but the concepts are ours. This is substantive because it dictates research goals: should we seek the "true" decomposition (Realist) or accept any useful decomposition (Deflationist)? If the former is impossible due to mathematical underdetermination, the Realist program risks chasing phantoms. If the latter is accepted, the promise of understanding "how the model thinks" diminishes to "how we can control the model." For alignment, this is critical: unreal features imply unstable hacks; real features offer robust handles. The debate persists because both sides achieve predictive success, but only one offers the ontological comfort required for high-stakes safety claims. Ultimately, it is a clash between the desire for a mechanistic explanation of mind-like behavior and the mathematical reality of arbitrary vector spaces. This tension drives the field's identity.

  3. **What would count as settling it**

  Settling this requires distinguishing mathematical necessity from empirical contingency. A formal result proving that, under specific natural constraints (e.g., minimal description length plus causal independence), a unique decomposition exists would vindicate the Realists. Conversely, a proof that multiple orthogonal bases yield identical loss and causal power without preference would cement Deflationism. Mathematics alone may not suffice.

  A decisive experimental result would involve transfer learning across architectures. If "dog features" discovered in Model A consistently map to specific directions in Model B without retraining the interpreter, this suggests a universal, model-internal ontology (Realist). If the mapping requires arbitrary rotation per model, it suggests the features are interpreter-relative (Deflationist). Currently, evidence is mixed, but stronger cross-model consistency would shift the burden of proof. Additionally, adversarial testing could help: if identified features break under distribution shift while behavior remains, it suggests the features were superficial correlations (Deflationist), whereas robust features suggest deeper mechanism (Realist).

  Alternatively, a conceptual dissolution might be the only viable path. If the field adopts distinct vocabulary—reserving "representation" for human-aligned concepts and using "latent direction" for causal levers—the conflict evaporates. This would acknowledge that causal structure exists (satisfying Realists) without claiming it matches human semantics (satisfying Deflationists). Until then, the debate will persist as a tension between the desire for objective truth and the reality of underdetermined models. We should not expect a clean settlement soon; like wave-particle duality, both views may be necessary approximations of a complex reality. The field needs a taxonomy that separates causal utility from semantic truth. Such clarity is essential for safety.

  4. **Where my framing goes wrong**

  Your framing risks overstating the dichotomy. Few Realists believe features are perfectly monosemantic or that SAEs are lossless microscopes; most acknowledge approximation. Similarly, few Deflationists deny causal structure exists; they dispute its *interpretability* as human concepts. By labeling them "Deflationists," you might imply they reject the utility of features, whereas many simply reject the *ontological weight* placed on them.

  Additionally, focusing on semantic labels ("dogs") obscures the mechanistic goal. Many Realists care less about whether a feature means "dog" and more about whether it participates in a specific circuit (e.g., induction heads). The dispute isn't just about semantics; it's about whether circuits are robust enough to engineer. Finally, you assume the debate is static. In practice, researchers often oscillate between these views depending on the task, treating features as real when debugging and instrumental when publishing. The conflict is often rhetorical rather than practical.
