answer: |-
  # Q&A Strategy Sheet: Threshold Negative Utilitarianism

  **Context:** Department Moral Philosophy Seminar (15 attendees).
  **Goal:** Defend Lexical Threshold NU without collapsing into incoherence or deontology.
  **Strategy:** Prioritize coherence over plausibility on the hard cases; concede on precision to buy credibility on principle.

  ---

  ### 1. The Discontinuity Problem (Internal Tension)
  **Who:** The Population Ethicist or a sharp Grad Student.
  **The Objection:** "Your lexical threshold creates a moral discontinuity that renders the view incoherent. First, if I am already suffering above the threshold, adding more severe suffering appears to cost *nothing* in your calculus, since the lexical weight is already maxed out. Second, you are committed to saying relieving one person's pain *just below* the threshold always outweighs relieving a million people's pain *just above* it. This implies the moral value of pain relief isn't about the pain, but about crossing an arbitrary line."
  **The Reply (2 mins):** "This is the cost of avoiding the Sadistic Conclusion. Regarding the first point: I propose a *tiered* lexicality. Severe suffering is lexical over mild, but within the 'severe' category, aggregation still applies. We avoid the 'costs nothing' problem by treating the threshold as a floor for lexical priority, not a ceiling for aggregation. Regarding the second point: Yes, marginal changes near the threshold carry disproportionate weight. This isn't arbitrary; it reflects the qualitative shift from 'bad life' to 'life not worth living.' We accept discontinuity in value to avoid discontinuity in moral recommendation (i.e., the Sadistic Conclusion)."
  **Soft Spot:** The "tiered lexicality" amendment risks looking ad hoc. If pressed, admit that *strict* lexicality implies the discontinuity, but argue that our moral intuitions about "lives not worth living" are themselves discontinuous.

  ### 2. The Lexical Reductio (Astronomical Trade-off)
  **Who:** The Classical Hedonistic Utilitarian.
  **The Objection:** "You are committed to fanaticism. On your view, preventing a single minute of severe torture outweighs preventing any amount of mild suffering, even if that mild suffering is distributed across a galaxy of beings for a millennium. You are forced to trade away astronomical amounts of aggregate welfare for a vanishingly small reduction in severe suffering. This abandons the consequentialist commitment to the greater good."
  **The Reply (2 mins):** "I accept this implication, but deny it is a *reductio*. The intuition that 'numbers count' breaks down when the qualitative gap is sufficiently wide. We already accept this in non-moral contexts: one person drowning outweighs a billion people experiencing a mild itch. If we accept that severe suffering destroys the *capacity* for welfare in a way mild suffering does not, then protecting that capacity is lexically prior. It is not abandoning the greater good; it is recognizing that some goods are prerequisites for others."
  **Soft Spot:** This requires biting a very large bullet. If the "mild suffering" is scaled high enough (e.g., death vs. torture), the intuition flips. Be prepared to define "mild" strictly (e.g., annoyance, not death).

  ### 3. The "Separateness of Persons" Charge
  **Who:** The Two Kantians.
  **The Objection:** "You claim to be a consequentialist, but your lexical threshold is just the Kantian 'separateness of persons' smuggled back in through a side door. You refuse to aggregate severe suffering across persons against mild suffering because you respect the *individual's* inviolability. If you were truly consequentialist, you would aggregate. By refusing, you've collapsed your view into something non-consequentialist in all but name."
  **The Reply (2 mins):** "I reject the dichotomy. Consequentialism is about maximizing the good, but the *structure* of the good is an open question. If the good is structurally such that severe suffering lexically dominates, maximizing it requires non-aggregation at the threshold. I am not appealing to rights or inviolability; I am appealing to the *axiology* of welfare. The 'separateness' is a feature of the value, not a constraint on the maximization. It's a hybrid axiology, but the decision procedure remains consequentialist."
  **Soft Spot:** This blurs the line between deontology and consequentialism. The Kantians will press that if the *reason* for the lexicality is respect for persons, the view is deontological.

  ### 4. The Sadistic Conclusion Trap
  **Who:** The Population Ethicist.
  **The Objection:** "You claim to avoid the Sadistic Conclusion, but your view generates a variant of it. If creating a new happy life is subordinate to preventing severe suffering, you might be forced to prefer a population where everyone suffers mildly over a population where some suffer severely but many are extremely happy. You risk implying it is better to add lives with mild suffering than to add lives with severe suffering *and* great happiness, which is counterintuitive."
  **The Reply (2 mins):** "The Sadistic Conclusion arises when we prefer adding suffering lives over adding happy lives. My view explicitly forbids this below the threshold. Above the threshold, we are not comparing 'happy lives' vs. 'suffering lives'; we are comparing 'lives worth living' vs. 'lives not worth living.' Preventing a life not worth living is lexically prior. This isn't sadistic; it's harm-avoidance. We are not choosing suffering; we are choosing to prevent the worst outcomes."
  **Soft Spot:** If the "mild suffering" population is vast and the "severe/happy" population is small, the trade-off looks suspicious.

  ### 5. The Aggregation Defense
  **Who:** The Classical Hedonistic Utilitarian.
  **The Objection:** "Aggregation is a feature, not a bug. The reason we are utilitarians is that we think suffering can be compensated for by happiness. By introducing a lexical threshold, you are saying some suffering *cannot* be compensated. But why? If the net welfare is higher in the world with the torture plus the bliss, why is that world worse? You haven't explained *why* aggregation stops, only *that* it stops."
  **The Reply (2 mins):** "Aggregation stops because the nature of the value changes. Mild suffering is a deficit in welfare; severe suffering is a destruction of the welfare subject. You cannot compensate for the destruction of the ledger by adding more ledgers elsewhere. This isn't an arbitrary stop to aggregation; it's a recognition that severe suffering impacts the *agent's* ability to value anything else. It is a structural limit on compensability."
  **Soft Spot:** This relies on a specific theory of welfare (agency-based) that strict hedonists will reject.

  ### 6. The Instability Objection
  **Who:** Sympathetic Grad Students.
  **The Objection:** "This position is unstable under pressure. If severe suffering is lexical because of its intensity, why isn't moderate suffering lexical over mild? If you grant lexical priority based on severity, you open the door to a cascade of thresholds until you return to a ranking system that looks just like classical utilitarianism with weights. What stops the slide?"
  **The Reply (2 mins):** "The slide stops at the point where suffering becomes 'life-ruining' or 'uncompensatable.' There is a qualitative difference between pain that distracts and pain that destroys. We draw the line at the threshold of psychological integration. Below that, trade-offs are possible. Above that, the self is fragmented. This is a empirical/psychological claim, not just a moral one, which stabilizes the threshold."
  **Soft Spot:** Relies on contested psychological claims about trauma and integration.

  ### 7. The Vagueness Objection (Sorites)
  **Who:** General Seminar.
  **The Objection:** "Where exactly is the threshold? Is it a specific duration? Intensity? Neurological state? If you can't define it precisely, the view is action-guiding only in retrospect. A moral theory that cannot tell us what to do in borderline cases is practically useless."
  **The Reply (2 mins):** "I concede that the threshold is vague, but deny it is arbitrary. Moral concepts like 'personhood' and 'death' are also vague, yet we do not discard them. We can identify clear cases (torture vs. headache) even if the boundary is fuzzy. The theory is designed to guide clear cases and constrain extreme trade-offs, not to provide a calculus for every marginal decision. Precision is not a prerequisite for validity."
  **Soft Spot:** **STRATEGIC CONCESSION.** Concede this early. "You're right, I don't have a precise metric. But the moral distinction exists even if the line is fuzzy." This buys credibility by showing humility and prevents you from getting bogged down in neuroscience.

  ### 8. The Person-Affecting Consistency Check
  **Who:** Population Ethicist or Analytic Meta-Ethicist.
  **The Objection:** "You rely on a person-affecting constraint to block the creation of happy lives (clause 3), but you use an impersonal lexical aggregation to block severe suffering (clause 1). Why is the creation of happiness person-affecting while the prevention of suffering is impersonal? If you are person-affecting, you shouldn't care about preventing suffering in people who wouldn't otherwise exist. You are switching frameworks to get the results you want."
  **The Reply (2 mins):** "The constraint applies to *benefits*, not *harms*. We have a stronger duty not to harm (or allow severe harm) than to benefit. Preventing severe suffering is a duty owed to any potential subject of experience, whereas creating happiness is not owed to non-existent beings. This asymmetry is standard in person-affecting views (e.g., asymmetry of creation). It is not inconsistent; it is a recognized feature of asymmetric population ethics."
  **Soft Spot:** This is the weakest theoretical link. The "Asymmetry" is often viewed as ad hoc.

  ---

  ### Strategic Concession
  **Concede on Objection #7 (Vagueness).**
  **Why:** It is the safest ground to yield. Admitting you lack a precise neurological metric for the threshold shows intellectual honesty without undermining the core normative claim. It disarms the "arbitrariness" charge by reframing it as "moral vagueness," which is a common feature of many accepted ethical concepts (like "reasonable doubt" or "consent"). It allows you to pivot back to the *principle* rather than the *precision*.

  ---

  ### The Question You Hope Nobody Asks
  **The Objection:** "If you accept a person-affecting constraint on creating happy people, you must believe that bringing a happy person into existence is not *better* than not bringing them into existence (neutrality). But if you bring a person into existence who suffers severely, that is *worse*. This implies that existence is a gamble where the downside is lexical and the upside is neutral. Why, then, does the suffering of a *potential* person (who would exist only if we choose a certain policy) count lexically against the happiness of *existing* people? You seem to be person-affecting when it suits you (creating happiness) and impersonal when it suits you (preventing suffering). If the suffering person wouldn't exist otherwise, why does their severe suffering trump the existing people's mild happiness? You haven't solved the Non-Identity Problem; you've just hidden it behind a lexical threshold."

  **Why it's lethal:** It exposes that the view relies on an inconsistent application of the "person-affecting" restriction to avoid the Repugnant Conclusion while maintaining the force of Negative Utilitarianism. If the suffering person is non-identical (wouldn't exist otherwise), a strict person-affecting view says their suffering doesn't count against us. If it *does* count, you are impersonal, and the person-affecting constraint on happiness looks unjustified. This collapses the "least ad hoc" argument.
