answer: |-
  (a) **Exam Question**

  Marisol is sixty-eight. Next Tuesday an aneurysm will rupture, and she will die instantly and painlessly. In the nearest world in which she does not die then — the surgical team intervenes — she lives eight more years: seven of them dominated by a degenerative illness she experiences as unrelieved misery, containing exactly one thing she values, a single afternoon, three years in, when her estranged son visits and they reconcile. By any reasonable aggregation the eight years are much worse for her than nothing; the afternoon is, by her own lights, worth a great deal; and there is no nearby world in which she lives longer or better.

  Evaluate whether death is bad for Marisol. Your answer must address: (1) the deprivation account given net misery; (2) when the value obtains, arguing for metaphysical costs; (3) whether the antemortem move resolves the timing problem. Paraphrase arguments; do not quote primary texts.

  ***

  (b) **Model Answer**

  The Marisol case presents a severe test for the deprivation account of death's badness. Standardly, death is bad because it deprives the victim of the good life they would otherwise have had. However, Marisol's alternative future contains net misery. If badness is determined strictly by aggregate welfare, death prevents a worse life, making it good for her. This contradicts the intuition that losing the reconciling afternoon is a tragedy. A sophisticated deprivationist must argue that specific goods matter more than aggregate sums. If the afternoon constitutes a unique, non-fungible value, death deprives her of *that* specific good, even if the surrounding context is negative. Thus, death remains bad because it eliminates the only meaningful peak in her future, regardless of the valley surrounding it. This saves the intuition but requires modifying the aggregation principle to weight specific high-value moments over total utility, suggesting death's badness is not purely additive.

  The timing problem arises immediately upon accepting this badness. If death is bad, when is Marisol badly off? She does not exist after Tuesday. She is not dead before Tuesday. Saying it is bad at no time risks making the badness metaphysically ghostly, rendering the claim empty. Saying it is bad at all times implies she suffers eternally, which is absurd given she no longer exists. The most plausible view is that the badness obtains at the times she would have been enjoying the afternoon. This is a "time-of-thing" view. The cost is accepting that subjects can be affected at times they do not exist. This violates the intuition that existence is required for harm, known as the existence condition. However, rejecting the existence condition allows us to make sense of counterfactual harms generally. If we insist on the existence condition, we cannot say death is bad at all, forcing us into the view that death is nothing to us.

  Alternatively, one might locate the harm in the living Marisol. On this antemortem view, the living subject suffers a setback to her interests when the aneurysm forms or when she fails to be saved. However, this merely relocates the timing problem rather than solving it. When exactly does the living Marisol suffer? If she never knows she will die, her psychological state is unchanged. If the harm is objective, it occurs when the future is closed off. But this implies she is harmed before she dies without any experiential difference. This saves the timing by making the harm contemporaneous with life, satisfying the existence condition. Yet, it struggles to explain why this specific setback matters if it is never experienced. It risks making harm entirely external to the subject's perspective, disconnecting harm from welfare. Furthermore, if the harm occurs before death, why does the moment of death matter? It suggests the tragedy is the diagnosis, not the demise.

  Ultimately, the deprivation account survives if we accept that badness is comparative and can attach to times of non-existence. The antemortem move avoids non-existence but fails to capture the loss of the future itself, focusing instead on the present interest. The Marisol case shows that aggregate welfare is insufficient; we must account for specific meaningful goods. Death is bad for Marisol because it removes the reconciliation, even if the rest was misery. The timing is when that reconciliation would have occurred. The cost is accepting that harm does not require existence at the time of harm. This is a high metaphysical price, but lower than denying the badness of death entirely. We must choose between a metaphysically costly badness or a metaphysically safe irrelevance.

  ***

  (c) **Marking Scheme**

  1.  **Comparative Structure (5 marks):** Correctly identifies that standard aggregation makes death *good* for Marisol (preventing net misery) and argues whether the single afternoon overrides this aggregate verdict.
      *   *Common Error:* Students claim death is bad simply because she dies, ignoring the counterfactual life's net negative value.
  2.  **Specific Goods vs. Aggregation (5 marks):** Explains that preserving the "badness" verdict requires valuing the specific afternoon over the total utility sum.
      *   *Common Error:* Students assert the afternoon matters but fail to explain how this modifies the deprivation account's comparative structure.
  3.  **Timing Problem Identification (5 marks):** Clearly articulates the dilemma: she does not exist when dead, so locating the harm requires rejecting the existence condition or accepting empty metaphysics.
      *   *Common Error:* Students state "it is bad at no time" as a solution without acknowledging this renders the harm claim vacuous.
  4.  **Timing Cost Argument (5 marks):** Argues for a specific time (e.g., time of would-be good) and explicitly acknowledges the metaphysical cost (harm without existence).
      *   *Common Error:* Students propose a time (e.g., "when she dies") without arguing for the cost of assigning properties to non-existents.
  5.  **Antemortem Evaluation (5 marks):** Evaluates the living-subject move as relocating rather than solving the problem, noting the disconnect between setback and experience.
      *   *Common Error:* Students treat the antemortem view as a successful solution without noting it makes the moment of death irrelevant.

  ***

  (d) **Closing Note: A vs. B**

  The B answer correctly identifies the three problems and offers standard solutions (e.g., "harm occurs at the time of the would-be good"). The A answer recognizes that the **antemortem move does not solve the timing problem but merely relocates it** to an unexperienced setback, and explicitly argues that accepting the metaphysical cost of harm at non-existence is the *only* way to preserve the comparative nature of the deprivation account. The A student sees that keeping the existence condition forces the conclusion that death is not bad, whereas the B student hedges without accepting this dichotomy.
