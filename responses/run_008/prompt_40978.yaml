answer: |-
  Here is the principle that best captures your intuitions, followed by the honest accounting of which verdicts it forces you to abandon.

  ### The Principle: The Counterfactual Viability Threshold

  A technology or standard is **"Locked In"** if and only if:
  1.  **A Viable Counterfactual Existed:** There was a competing option that was, at the time of selection, technically feasible and roughly equal or superior in performance.
  2.  **Coordination Costs Won:** The winner was selected not because it was better, but because early adoption created a "gravity well" of coordination costs (infrastructure, habit, network effects) that made switching to the superior counterfactual prohibitively expensive later.

  A technology is **"Inevitable-ish"** if:
  1.  **Performance Differential Dominated:** The winner possessed an intrinsic advantage (physics, economics, biology) that would have overcome reasonable coordination costs eventually.
  2.  **The Counterfactual Was Fragile:** The losing option relied on contingent conditions (e.g., specific resource prices, temporary regulatory gaps) that were unlikely to persist.

  **The Nuance:** This creates a spectrum. **Hard Lock-in** means the counterfactual was *better* (QWERTY). **Soft Lock-in** means the counterfactual was *equal* (Railway Gauge). **Inevitable** means the counterfactual was *worse* (AC/DC).

  ---

  ### Applying the Principle to Your List

  **1. QWERTY: Hard Lock-in (With a Caveat)**
  *   **Verdict:** Fits the principle.
  *   **Why:** The counterfactual (Dvorak, Colemak) is demonstrably more ergonomic. The coordination cost (retraining billions of fingers) is massive.
  *   **The Sacrifice:** You must accept that the *origin story* is likely myth. Historians now doubt the "jamming" rationale was the primary driver; it may have been telegraph operator convenience or simply patent avoidance. But regarding your gut verdict: **Saved.** As long as a better layout exists, the persistence of QWERTY is lock-in, regardless of why it started.

  **2. Standard Railway Gauge: Soft Lock-in**
  *   **Verdict:** Fits the principle.
  *   **Why:** The counterfactual (a slightly wider or narrower gauge) is *equal* in performance. The coordination cost (re-laying all tracks) is infinite.
  *   **Status:** **Saved.** This is "lock-in that doesn't matter," which your principle classifies as Soft Lock-in.

  **3. VHS over Betamax: Hard Lock-in (Category Inevitable)**
  *   **Verdict:** Fits the principle perfectly.
  *   **Why:** Betamax was arguably superior (quality). VHS won on coordination (rental shelf space, recording time).
  *   **Status:** **Saved.** Your distinction between "contingent product, inevitable category" is exactly what the Counterfactual Viability Threshold describes. The *category* was inevitable (performance demand existed); the *winner* was locked in by coordination costs.

  **4. AC over DC: Inevitable**
  *   **Verdict:** Fits the principle.
  *   **Why:** No viable counterfactual for long-distance transmission existed. DC loses too much power over distance; AC transforms easily.
  *   **Status:** **Saved.** Edison lost to physics, not history.

  **5. Inverted Pyramid / AP Style: Inevitable (Functional)**
  *   **Verdict:** Fits the principle.
  *   **Why:** The counterfactual (chronological storytelling) is *worse* for the specific constraints of the technology (telegraphs that could cut out, editors who need to cut from the bottom). It solves a compression problem.
  *   **Status:** **Saved.** It feels like inertia, but it's actually optimization for a specific workflow. It persists because it does real work, not because we can't switch.

  **6. Electric vs. Gasoline (1900s): Inevitable (This is the hard pill)**
  *   **Verdict:** **You have to give this one up.**
  *   **Why:** In 1900, the "Viable Counterfactual" condition fails. Battery energy density was physically limited by chemistry of the era. ICE offered range and refueling speed that electric *could not match regardless of coordination*. The "cheap Texas oil" and "electric starter" accelerated the inevitable, but they didn't create the lock-in. If Texas oil hadn't been found, we might have delayed ICE by 20 years, but without a lithium-ion breakthrough, EVs still lose on physics.
  *   **The Sacrifice:** Your instinct that "early electric cars were competitive" is true only in a narrow urban niche. For the general use case, ICE was the Global Maximum. This wasn't lock-in; it was selection pressure. *True* EV lock-in might be happening *now* (if we stick with charging standards that are suboptimal), but not in 1900.

  ---

  ### The New Case: Short-Form Vertical Video (TikTok)

  **Verdict: Inevitable-ish (Form) / Hard Lock-in (Platform)**

  Apply the **Counterfactual Viability Threshold**:

  1.  **The Form (Vertical, Short, Scroll):**
      *   **Counterfactual:** Horizontal, long-form, click-to-play.
      *   **Constraint:** The hardware (smartphones) are held vertically in one hand. The biology (dopamine loops) favors variable rewards.
      *   **Analysis:** A horizontal-short format is *inferior* for one-handed consumption. A vertical-long format is *inferior* for attention spans. The "TikTok shape" is the Global Maximum for the specific constraints of "Pocket Computer + Human Boredom."
      *   **Conclusion:** **Inevitable.** Even if TikTok dies, the *form* remains. (See: YouTube Shorts, Instagram Reels).

  2.  **The Platform (TikTok specifically):**
      *   **Counterfactual:** Instagram Reels, YouTube Shorts.
      *   **Constraint:** Algorithmic training data and network effects.
      *   **Analysis:** TikTok's specific algorithm and culture created a coordination cost (creator audience lock-in).
      *   **Conclusion:** **Hard Lock-in.** A better platform could exist, but the cost of moving the creator economy is too high.

  ### Summary of What You Lose

  To keep this principle coherent, you must surrender two things:

  1.  **The QWERTY Origin Story:** You can keep the verdict that it's lock-in, but you must stop citing "typewriter jamming" as the cause. It was likely telegraph operator training or random patent maneuvering. The lock-in is real; the folklore is fake.
  2.  **The 1900s EV "Lock-in" Theory:** You cannot classify the ICE victory as lock-in. It was a performance win. If you want to keep an EV lock-in story, it must be about the *infrastructure* built around ICE (gas stations, zoning laws) that persisted *after* battery tech matured enough to compete (i.e., 1990–2010), not the initial 1900s victory.

  **The Final Formulation:**
  > **"Lock-in is the persistence of a standard despite the existence of a superior counterfactual, maintained solely by the accumulated cost of coordination. If the winner won because it was physically or economically superior, it is not lock-in; it is evolution."**

  This saves your gut on QWERTY and VHS, clarifies the Railway and AC/DC cases, reclassifies the 1900s EVs as evolution, and predicts that Vertical Video is here to stay regardless of who owns the app.
