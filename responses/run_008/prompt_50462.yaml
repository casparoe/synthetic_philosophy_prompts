answer: |-
  Here is the definite stand you requested: **The Simulation Argument smuggles in the Self-Sampling Assumption (SSA).**

  While Bostrom maintains that the Simulation Argument (SA) avoids the contentious typicality premise of the Doomsday Argument (DA), this distinction holds only at the level of logical validity, not at the level of probabilistic force. To move from the bare logical trilemma to the conclusion that we should assign significant credence to the hypothesis that we are simulated, the SA must rely on the very same anthropic weighting that drives the DA. The structural difference Bostrom identifies—a disjunction versus a prediction—masks an identical anthropic engine.

  Here is the precise location where the Self-Sampling Assumption is smuggled into the Simulation Argument, and why this makes it structurally isomorphic to the Doomsday Argument in its reliance on indexical reasoning.

  ### 1. The Role of SSA in the Doomsday Argument
  To understand the smuggling, we must first isolate the premise in the DA. The DA proceeds as follows:
  1.  **Premise:** I am a random sample from the set of all humans who will ever exist (SSA).
  2.  **Data:** My birth rank is $n$ (approx. 100 billion).
  3.  **Inference:** It is improbable that the total number of humans $N$ is vastly larger than $n$.
  4.  **Conclusion:** Humanity is likely to go extinct sooner rather than later.

  The contentious step is the move from (2) to (3). Without the SSA (the assumption that you are a typical observer within the reference class), your birth rank provides no information about the total duration of the species. If you do not assume you are a random sample, being the 100 billionth human is compatible with there being 100 trillion humans just as easily as 200 billion. The DA *is* the application of SSA to temporal location.

  ### 2. The Illusion of the Disjunction in the Simulation Argument
  Bostrom’s Simulation Argument concludes with a trilemma:
  1.  Civilizations never reach posthuman status.
  2.  Posthuman civilizations rarely run ancestor simulations.
  3.  We are almost certainly living in a simulation.

  Bostrom argues that this is a logical disjunction: at least one proposition must be true. He claims this does not require the SSA because it does not force a probability shift on a future empirical event (like extinction) based solely on indexical data.

  However, a logical disjunction is trivial unless one assigns probabilities to the horns. The philosophical force of the SA is not merely that *one* of these is true, but that **if we accept (1) and (2) are false, we are compelled to accept (3) with high probability.** It is this probabilistic compulsion that constitutes the argument's thrust.

  ### 3. The Smuggling Point: Weighting the Horns
  The smuggling occurs precisely when one attempts to justify why the third horn ("We are in a simulation") becomes highly probable if the first two are false.

  If we assume (1) and (2) are false, then posthuman civilizations exist and they run many simulations. Consequently, the number of simulated minds ($N_{sim}$) vastly exceeds the number of biological minds ($N_{bio}$). The argument then asserts:
  $$ P(\text{I am simulated} \mid N_{sim} \gg N_{bio}) \approx \frac{N_{sim}}{N_{sim} + N_{bio}} \approx 1 $$

  This inference is **not** a logical truth. It is an anthropic update. It relies on the premise that your subjective experience ("I am a conscious observer") should be treated as a random draw from the set of all available conscious experiences (simulated and biological).

  If you reject the Self-Sampling Assumption, the ratio of $N_{sim}$ to $N_{bio}$ is irrelevant to your self-location. You could consistently argue: "Even if there are a billion simulated minds for every biological one, I have no reason to think I am not among the privileged biological few, unless I assume I am a random sample from the total."

  Therefore, to derive the high probability of the third horn, the SA must invoke the principle: **"Reason as if you are a random observer from the reference class of all observers."** This is the definition of the SSA.

  ### 4. Why the "Principle of Indifference" Defense Fails
  Bostrom often defends the SA by appealing to a "Principle of Indifference" rather than the full-blooded SSA used in the DA. He suggests that given no evidence to the contrary, you should be indifferent between being any particular observer-moment.

  However, in the context of anthropic reasoning, a Principle of Indifference over observer-moments *is* the Self-Sampling Assumption. The distinction is terminological, not structural.
  *   In the **DA**, the reference class is "all humans across time," and the indexical fact is "temporal rank."
  *   In the **SA**, the reference class is "all observers across substrate," and the indexical fact is "phenomenological experience."

  In both cases, the argument extracts a metaphysical conclusion (Extinction / Simulation) from an indexical fact (Birth Rank / Consciousness) by weighting hypotheses according to the number of observers they contain. This weighting *is* the SSA.

  ### 5. The Verdict
  The Simulation Argument is a disguised version of the Doomsday Argument because both rely on the same core anthropic mechanism: **the inference from observer counts to self-location probability.**

  Bostrom’s claim that the SA requires "no such typicality assumption" is incorrect. It requires a typicality assumption regarding *substrate* rather than *time*. The DA says, "You are typical in time, so the future must be short." The SA says, "You are typical in substrate, so reality must be simulated."

  If you reject the SSA to defang the Doomsday Argument (as many philosophers do, often by adopting the Self-Indication Assumption or rejecting anthropic reasoning entirely), you necessarily defang the Simulation Argument as well. Without the assumption that you are a random sample from the pool of observers, the sheer number of simulated minds confers no probability weight on *your* being one of them.

  **Conclusion:** The Simulation Argument does not escape the anthropic pitfalls of the Doomsday Argument; it merely relocates them. The step where the SA asserts that the vast number of simulated minds makes it *likely* that you are simulated is exactly where it smuggles in the Self-Sampling Assumption. Consequently, the two arguments stand or fall together on the validity of SSA.
