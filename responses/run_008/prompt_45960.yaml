      *   **Format:** A list suitable for bringing to the next seminar.

  2.  **Deconstruct the Slogan ("Democracies Don't Have Famines"):**

      *   *Claim 1: The Definitional/Tautological Reading.*
          *   Idea: If a famine happens, it wasn't a real democracy.
