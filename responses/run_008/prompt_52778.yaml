  Both overlook that equal contribution implies equal entitlement to the *cooperative surplus*. In cooperative game theory, the **Shapley Value** measures marginal contribution. Here, $v(\{M,T\})=13,000$ and singletons are 0. The Shapley value is €6,500 each, coinciding with Nash. KS deviates by weighting claims based on hypothetical, inefficient maxima. Maya's higher valuation is a private benefit of consuming the indivisible good, not a stronger claim on the common fund. Using KS effectively taxes Theo for his travel preferences.

  Theo's Nash proposal is the principled choice. It respects symmetry between equal contributors and maximizes joint welfare without penalizing personal tastes. KS is inappropriate here because the "ideal point" relies on destroying value (Theo taking the package).

  **Allocation:** Maya receives the conference package plus €2,500 cash. Theo receives €6,500 cash. Both achieve €6,500 in utility. This splits the cooperative surplus equally, honoring their equal contribution while ensuring the package goes to the person who values it most.
