prompt: |-
  My best friend and I have been having the same argument for basically two years now, and our other friends are so tired of it. The topic is whether "collapse" is actually a real thing that happens to societies. I'm in the camp that some societies genuinely fail: the Late Bronze Age eastern Mediterranean, where palaces burned, long-distance trade networks came apart, and whole writing systems died out; the Terminal Classic Maya, with cities in the southern lowlands abandoned; maybe Easter Island with its deforestation. She thinks "collapse" is basically a category analysts impose, not something that happens to the people living through it: the Bronze Age "collapse" is a cluster of transitions where some institutions ended but people adapted, migrated, and kept transmitting whatever mattered to them; the Maya didn't vanish, populations shifted and the northern cities did fine for centuries afterward; Easter Islanders are literally still there. Her line, which stings because I can't fully rebut it, is that calling a period a failure is a judgment made from the perspective of elites and outside observers, and the word does quiet political work — it frames change as breakdown so that whatever comes after looks like a loss rather than a reorganization.

  So we've decided to do the adversarial collaboration thing properly, like the format where people on opposite sides of a stuck debate write the document they could both sign. Draft that joint statement for us. I want (1) the claims we can both accept, including about the archaeological record itself; (2) our disagreements stated precisely enough that each of us would accept the wording of our own side — she'll never sign "societies fail" as written, and I won't sign "collapse is a construct" as written, so the phrasing has to be careful; (3) the cruxes, the sub-questions where settling one would actually move at least one of us. We've each got suspicions about what they are: I think one is whether population decline counts as failure even if most of the people just relocated rather than died, another is whether the loss of specialized knowledge like writing is bad in itself or only instrumentally bad, and she thinks a big one is whether "the same society" persists through radical institutional change or whether that question is answerable at all. (4) For each crux, the evidence or argument we'd both agree bears on it, with our predictions written down in advance — e.g., what I'd predict vs. what she'd predict about southern lowland Maya population numbers, or about what rat bones vs. human-induced erosion evidence would show on Easter Island.

  And if some chunk of our dispute turns out to be verbal — a fight about the word "collapse" rather than about anything in the world — please say which part and why, because I honestly suspect at least a third of it is exactly that and she suspects about two thirds. Numbered agreed-claims section first, then a disagreements table with a row per crux including each side's prediction. Keep it fair to her position, even though I'm the one asking — she's going to read this and she WILL complain if I've slanted it.
