answer: |-
  This is a classic "Social Choice Theory meets Reality" problem. You are experiencing the friction between the *formal properties* of Condorcet's Jury Theorem (CJT) and the *substantive conditions* required for it to hold. Your gut is reacting to the violation of CJT's hidden premises, even when the prompt claims they are met.

  For your teaching, you need a principle that is robust enough to handle real-world politics but precise enough to distinguish between "mob rule" and "collective wisdom."

  Here is the principle that captures most of your verdicts, followed by the hard truth about which one of your intuitions you might have to sacrifice for the sake of consistency.

  ### The Principle: Conditional Epistemic Aggregation

  > **Aggregate votes only when (1) individual competence exceeds chance ($p > 0.5$), (2) errors are sufficiently independent (low correlation), and (3) competence is opaque (high cost to identify experts). When competence is transparent and high, defer. When error sources are common, disaggregate.**

  This principle blends Condorcet (aggregation) with Bayesian deference (expertise) and Page's Diversity Trumps Ability (independence). Let's audit your five cases against it.

  ---

  ### The Audit: Where the Principle Fits (and Where It Breaks)

  #### Case 1: The Jury (Verdict: Trust Majority)
  *   **Principle Check:** **Pass.**
  *   **Why:** Juries are sequestered specifically to enforce **Independence (Condition 2)**. They are peers, so **Competence is Opaque (Condition 3)**. We assume they want to be right, so **$p > 0.5$ (Condition 1)**.
  *   **Teaching Point:** This is the *only* case where pure CJT applies cleanly. Use this as the baseline control group.

  #### Case 2: Specialists vs. Citizens (Verdict: Trust Specialists)
  *   **Principle Check:** **Fail (on the math), Pass (on the reality).**
  *   **The Hard Truth:** You have to adjust your intuition here. If the 500 citizens are *truly independent* and $p=0.55$, the math is overwhelming. The probability of the majority being wrong is vanishingly small ($< 0.001$). A single expert at 70% cannot beat that.
  *   **Why your gut says Experts:** Your gut is implicitly assuming the 500 citizens are **not independent**. They watch the same news, share the same cultural biases, and are subject to the same propaganda. Their errors are correlated.
  *   **Resolution:** For the sake of the theorem, you must tell your students: "If independence holds, the crowd wins. But in politics, independence rarely holds." Your verdict is correct for the *real world*, but incorrect for the *model*.
  *   **Teaching Point:** This is the most important lesson. CJT collapses under correlation. If 500 people all get their info from the same algorithm, $N=500$ is effectively $N=1$.

  #### Case 3: Economists vs. Epidemiologists (Verdict: Epi > Econ on aggregation)
  *   **Principle Check:** **Pass.**
  *   **Why:** This is about **Error Structure (Condition 2)**.
      *   **Economists:** Often share the same priors, models, and ideological constraints. If the model is wrong, they are *all* wrong together (Systemic Bias). High correlation of error.
      *   **Epidemiologists:** Also share training, but biological reality imposes a harder constraint. A virus doesn't care about your model. Errors are more likely to be random noise around a truth rather than a shared systemic bias.
  *   **Nuance:** It's not that epidemiologists are smarter; it's that their domain offers more frequent, harder feedback loops that break correlation.
  *   **Teaching Point:** Distinguish between *technical complexity* (hard to solve) and *systemic fragility* (easy to all be wrong together).

  #### Case 4: Competence < 50% (Verdict: Refuse to believe it)
  *   **Principle Check:** **Normative Pass, Analytical Fail.**
  *   **Why:** This isn't a math problem; it's a democratic commitment. CJT requires $p > 0.5$. If $p < 0.5$, the majority becomes a "Anti-Condorcet" machine (always wrong).
  *   **Resolution:** You don't have to believe real electorates are $< 50\%$, but you must accept the *logic*: If the electorate is systematically misinformed (e.g., believing the earth is flat), adding voters makes it worse.
  *   **Teaching Point:** This justifies *education* and *information campaigns* as prerequisites for democracy. If $p < 0.5$, you need to fix the input before you trust the aggregation.

  #### Case 5: Weighted Voting (Verdict: Weight if known, Vote if unknown)
  *   **Principle Check:** **Pass.**
  *   **Why:** This addresses **Condition 3 (Opacity)**.
      *   If we know who is competent, weighting (or deference) is mathematically superior to equal voting.
      *   But identifying competence is costly and contestable (Who decides who is an expert?).
      *   Therefore: **Equal voting is a heuristic for high information costs.**
  *   **Teaching Point:** "One person, one vote" is not a claim that everyone is equally wise; it is a claim that we cannot agree on who is wiser without introducing bias.

  ---

  ### The Teaching Payoff: Predictions for New Cases

  Your students will ask about institutions where the "Vibes" are unclear. Here is how **Conditional Epistemic Aggregation** predicts outcomes for the cases you mentioned.

  #### 1. Referendum vs. National Election on the Same Question
  *   **Prediction:** Trust the **Election (Representative)** more than the **Referendum (Direct)** on complex technical issues.
  *   **Reasoning:**
      *   **Referendum:** Violates **Condition 3**. Voters are asked to decide on issues where competence is opaque to them, leading to reliance on heuristics or media cues (increasing **Correlation/Condition 2**).
      *   **Election:** Selects agents. While agents can be corrupt, the *selection mechanism* allows for **Condition 2 (Deference to Specialists)**. We vote for representatives *so that* they can delegate to experts (agencies, committees).
      *   **Exception:** On moral/normative questions (e.g., "Should we have the death penalty?"), where "competence" is not technical but preferential, the Referendum may track "truth" (collective will) better.

  #### 2. Prediction Markets vs. Committee of Experts
  *   **Prediction:** Trust the **Prediction Market** more, *unless* the event is manipulable.
  *   **Reasoning:**
      *   **Prediction Markets:** Maximize **Independence**. Traders have diverse priors and financial incentives to correct errors. They aggregate dispersed information efficiently (satisfies CJT conditions).
      *   **Committees:** High risk of **Groupthink (Violation of Condition 2)**. Shared training, shared career incentives, and face-to-face deliberation often increase error correlation (Case 3 logic).
      *   **Caveat:** If the market is thin or manipulable (e.g., a dictator can influence the outcome), independence breaks.

  #### 3. Deliberative Polling vs. Raw Voting
  *   **Prediction:** Trust **Deliberative Polling**.
  *   **Reasoning:**
      *   **Raw Voting:** Risks **Condition 1 ($p > 0.5$)**. Uninformed voters may be worse than coin flips.
      *   **Deliberation:** Provides balanced information, theoretically raising **$p$**. It also exposes voters to diverse arguments, potentially reducing **Correlation (Condition 2)** by breaking echo chambers.
      *   **Risk:** If deliberation is dominated by a charismatic leader, it increases correlation.

  ### Summary for Your Syllabus

  If you want a single sentence to put on the board that captures your position without sacrificing rigor:

  > **"Majority rule is epistemically robust only when errors are independent and competence is opaque; when expertise is identifiable or errors are systemic, aggregation fails."**

  **Which verdict must you throw out?**
  You must qualify **Case 2**. You cannot logically hold that 500 *independent* 55%-ers are worse than one 70%-er. You must teach your students that their intuition (and yours) in Case 2 relies on the *hidden premise* that the 500 citizens are influenced by common sources (media, culture), rendering them non-independent.

  That distinction—between **mathematical independence** and **sociological independence**—is the gold mine for your TA section. It explains why democracy works in theory but feels fragile in practice.
