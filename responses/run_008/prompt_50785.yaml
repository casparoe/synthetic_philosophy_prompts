prompt: |-
  I'm trying to wrap my head around the Born rule problem in Everettian QM before I read anything else on it, and I want to build the requirements list first. You're a philosopher of physics who's agnostic between camps, so write me the desiderata that any derivation of the Born rule from the many-worlds formalism has to satisfy. Think of things like: it can't just assume a measure of probability up front (that would be circular), it has to say something about what probability even means when every outcome happens somewhere, it should work for agents who know all branches exist so ordinary conditioning on 'the electron will be found here' doesn't obviously make sense, and it shouldn't lean on branch counting since the number of branches isn't well-defined. For each requirement give the case behind it, mark which ones you'd treat as non-negotiable and which are actually just prejudices of one camp (e.g. decision-theoretic derivations demanding certain rationality axioms, or anthropic/self-locating-uncertainty approaches demanding that agents can be uncertain about which branch they're in), and tell me if any subset of the requirements is jointly unsatisfiable. Please brainstorm a bit before writing, and throughout, keep clear about what's settled among people who actually know this literature versus what's genuinely contested — don't hand me a contested derivation as the consensus answer. A quick scorecard of the Deutsch-Wallace decision-theoretic route, the self-locating uncertainty route, and branch-counting against the list would help but keep it brief, the criteria are the part I care about. Also fwiw don't assume I know measure theory, explain any bit of math you need in passing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Born Rule problem in Everettian Quantum Mechanics (EQM/Many-Worlds).
      *   **Role:** Philosopher of physics, agnostic between camps.
      *   **Task:** Create a list of desiderata (requirements) for any derivation of the Born rule from the EQM formalism.
      *   **Specific Instructions:**
          *   Explain the rationale ("the case behind it") for each requirement.
          *   Distinguish between non-negotiable requirements and "prejudices" of specific camps.
          *   Identify if any subset is jointly unsatisfiable (impossibility results).
          *   Clarify what is settled vs. contested in the literature.
          *   Avoid assuming measure theory knowledge (explain math simply).
          *   Provide a brief scorecard for Deutsch-Wallace (DW), Self-Locating Uncertainty (SLU), and Branch-Counting against the list.
          *   **Crucial:** Brainstorm first, keep track of consensus vs. controversy.

  2.  **Initial Brainstorming & Deconstruction:**
      *   *What is the core problem?* In standard QM (Copenhagen), probability is fundamental (collapse is random). In EQM, everything happens deterministically (unitary evolution). So where does "probability" come from? Why $|\psi|^2$ and not something else?
      *   *Key Obstacles:*
          *   **Incoherence Problem:** If everything happens, what does it mean to say "outcome A has probability $p$"? It's not about *whether* it happens, but *where* I am or *how much* of the wavefunction it is.
          *   **Quantitative Problem:** Why the square modulus ($|\psi|^2$)? Why not the fourth power? Why not equal weight for all branches?
          *   **Circularity:** Don't sneak the Born rule in via the back door (e.g., assuming a Hilbert space norm that already encodes it).
          *   **Branch Indefiniteness:** You can't count branches because basis decomposition is continuous/arbitrary.
      *   *Major Approaches:*
          *   **Decision Theory (Deutsch-Wallace):** Probability is about rational betting behavior.
          *   **Self-Locating Uncertainty (Vaidman, Sebens & Carroll):** Probability is about ignorance of *which* branch I am on after splitting but before observation.
          *   **Frequentism/Typicality:** Most branches (by measure) look like the Born rule.
          *   **Branch Counting:** (Generally discredited, but needs addressing).
      *   *Consensus vs. Contested:*
          *   *Consensus:* Branch counting is bad (basis dependence). Naive probability assumptions are circular.
          *   *Contested:* Whether decision theory *is* probability. Whether self-locating uncertainty is coherent in a deterministic multiverse. Whether the derivation is actually circular (charge against DW).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: No Circular Assumptions.* Must derive $|\psi|^2$ from unitary dynamics + something minimal, not assume a probability measure that looks like $|\psi|^2$. (Non-negotiable).
      *   *Req 2: The Meaning of Probability.* Must define what "probability" means in a deterministic multiverse. (Non-negotiable, but *how* it's defined is contested).
      *   *Req 3: Branch Indifference/Counting.* Cannot rely on counting discrete branches. (Non-negotiable, mostly consensus).
      *   *Req 4: Agent Perspective.* Must make sense for an agent *before* the measurement who knows the theory is true. (Non-negotiable).
      *   *Req 5: Empirical Coherence.* Must recover standard QM predictions. (Non-negotiable).
      *   *Req 6: Rationality Axioms.* (This is the DW specific one). Is it a requirement or a prejudice? It's a method, so maybe frame it as "Must ground probability in agent action or ontology."
      *   *Req 7: Diachronic Consistency.* Agents before and after splitting should agree.

      *Refining the "Prejudice" distinction:*
      *   Some camps say "Probability is illusion." Some say "Probability is betting." Some say "Probability is self-location."
      *   *Non-negotiable:* The math must yield $|\psi|^2$. The ontology must remain purely unitary.
      *   *Contested/Prejudice:* Whether probability requires uncertainty (SLU says yes, DW says uncertainty isn't needed, just preferences). Whether decision theory axioms are "rational" or just "Born-rule-in-disguise."

      *Impossibility Results:*
      *   There isn't a strict "Gödelian" impossibility proof that it *can't* be done, but there are arguments that certain *combinations* of intuitions fail (e.g., Branch Counting + Unitary Invariance). The "Incoherence Problem" is the biggest hurdle.

  4.  **Structuring the Response:**
      *   **Introduction:** Set the stage (EQM is deterministic, Born rule is probabilistic). Acknowledge the difficulty.
      *   **The Desiderata List:** Group them logically (Ontological, Epistemological, Formal).
      *   **Status Marking:** Clearly label "Consensus/Non-negotiable" vs. "Contested/Camp-Specific."
      *   **Impossibility/Compatibility Check:** Discuss the Incoherence Problem.
      *   **Scorecard:** Briefly evaluate DW, SLU, Branch Counting.
      *   **Math Note:** Keep it simple (amplitudes, squares, no integrals).

  5.  **Drafting Content - Specific Points to Verify:**
      *   *Branch Counting:* Why is it bad? Basis dependence. If I rotate the basis, the number of "worlds" changes. Consensus: It's dead.
      *   *DW:* Criticism is that the axioms smuggle in the Born rule (e.g., "Diachronic Consistency" or "Measurement Neutrality"). Need to flag this as contested.
      *   *SLU:* Criticism is that if everything happens, what is there to be uncertain about? (The "Subjective Uncertainty" debate).
      *   *Math:* Explain amplitude as a "weight" or "arrow length" and Born rule as squaring that length.

  6.  **Refining the Tone:**
      *   Agnostic philosopher. Don't say "DW is right." Say "DW proponents argue..."
      *   Clear distinction between what *must* be solved vs. how people *try* to solve it.
      *   Ensure the "Incoherence Problem" is central.

  7.  **Final Review against Constraints:**
      *   Did I explain measure theory bits? (Will use "weighting" instead of "measure").
      *   Did I mark non-negotiables vs. prejudices? (Yes).
      *   Did I include the scorecard? (Yes).
      *   Is the consensus/contested distinction clear? (Yes).

  8.  **Self-Correction during drafting:**
      *   *Correction:* I initially thought about listing "Recover Frequentism" as a requirement. But Frequentism is itself a theory of probability. Better to say "Must align with empirical frequencies in the long run."
      *   *Correction:* Make sure to emphasize that "Branch Counting" is widely rejected, so it shouldn't be a "requirement" but rather a "constraint to avoid."
      *   *Nuance:* The request asks for "requirements... any derivation... has to satisfy." Some things are requirements of the *problem*, some are requirements of the *solution*. I need to frame them as conditions for a successful solution.
      *   *Crucial Check:* The prompt asks to identify if any subset is jointly unsatisfiable. This refers to the "Incoherence Problem" (determinism vs. probability). I need to state that resolving this tension is the main job, not that it's proven impossible. However, some specific *sets* of intuitions (e.g. "Probability requires uncertainty" + "There is no uncertainty in EQM") are unsatisfiable unless one premise is dropped.

  9.  **Final Polish:** Check clarity, ensure "philosopher of physics" voice is authoritative but neutral. (Proceed to generate output).

  *(Self-Correction on "Impossibility"):* I should be careful not to say it's *proven* impossible. The literature is divided on whether it *has* been solved. I should frame it as "Tensions that look like impossibility results until you adopt a specific framework."

  *(Self-Correction on Math):* Avoid $\int |\psi|^2 dx$. Use "sum of squares of amplitudes."

  *(Final Plan):*
  1. Intro: The tension (Determinism vs. Probability).
  2. Desiderata (categorized).
  3. Consensus vs. Contested markers.
  4. Compatibility/Impossibility discussion.
  5. Scorecard.
  6. Closing advice.

