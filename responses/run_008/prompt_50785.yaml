answer: |-
  This is one of the sharpest questions in the foundations of physics. As a philosopher of physics, I see students often get bogged down in the technical proofs (like the Deutsch-Wallace theorem) before they understand *what* the proof is supposed to be proving. If you don't have the desiderata clear, you can't evaluate whether a derivation is circular or successful.

  Here is a brainstormed, structured list of requirements for any derivation of the Born rule within the Everettian (Many-Worlds) framework. I have categorized them by the nature of the constraint and marked their status in the current literature.

  ### Part 1: The Desiderata List

  #### A. Ontological Constraints (About the World)

  **1. Unitary Purity (The "No-Collapse" Constraint)**
  *   **The Requirement:** The derivation cannot assume any physical process that selects a single outcome (collapse). It must rely solely on the Schrödinger equation (unitary evolution), which is deterministic and linear.
  *   **The Case:** If you assume collapse to get probability, you aren't doing Everettian QM; you're doing Copenhagen. The whole point of EQM is to remove the collapse postulate.
  *   **Status:** **Non-Negotiable / Consensus.** All Everettians agree on this. If a derivation secretly assumes collapse, it is rejected by the camp.

  **2. Basis Independence (The "No-Branch-Counting" Constraint)**
  *   **The Requirement:** The probability rule cannot depend on counting the number of "branches" or "worlds."
  *   **The Case:** In the math of QM, how you slice the wavefunction into "branches" depends on your perspective (the basis). You can mathematically rotate the description so that one outcome looks like two branches, or two look like one. Since the "number of worlds" isn't a fixed physical fact, you can't derive probabilities from counting them.
  *   **Math Note:** Think of a vector arrow. You can describe it as "3 units East" or "2.1 units North-East + 2.1 units South-East." The arrow is the same, but the "count" of components changes. Probability must depend on the *length* of the arrow (amplitude), not the *number* of components.
  *   **Status:** **Non-Negotiable / Consensus.** Almost no serious philosopher or physicist defends branch-counting anymore. It is widely regarded as a dead end.

  **3. Supervenience on the Wavefunction**
  *   **The Requirement:** Probabilities must be determined entirely by the physical state (the wavefunction). There cannot be "hidden" variables or extra facts about which world is "real."
  *   **The Case:** EQM claims the wavefunction is all there is. If probability depends on something outside the wavefunction, the ontology is no longer purely Everettian.
  *   **Status:** **Non-Negotiable / Consensus.**

  #### B. Epistemological Constraints (About Knowledge and Agents)

  **4. The Incoherence Solution (The "Meaning of Probability" Constraint)**
  *   **The Requirement:** The derivation must explain what a statement like "Outcome A has a 70% chance" *means* when Outcome A and Outcome B *both* definitely happen.
  *   **The Case:** In standard probability, "70% chance" usually implies "30% chance it won't happen." In EQM, it *will* happen (in some branch). If you can't define probability without "possibility of non-occurrence," EQM is incoherent.
  *   **Status:** **Non-Negotiable / Consensus on the Problem, Contested on the Solution.** Everyone agrees this is the hardest hurdle. They disagree on how to clear it (e.g., is it about betting? ignorance? typicality?).

  **5. Agent Ignorance (The "Subjective Uncertainty" Constraint)**
  *   **The Requirement:** (Contested) The derivation must allow an agent to feel genuine uncertainty about the outcome before measurement, even if they know the theory is true.
  *   **The Case:** If I know the universe will split into a "Heads" me and a "Tails" me, why should I care about the odds? Some argue that until the split happens, I don't know *which* future me I will be.
  *   **Status:** **Contested / Camp Prejudice.**
      *   *Self-Locating Uncertainty (SLU)* proponents say this is **Non-Negotiable**. They argue probability *requires* ignorance.
      *   *Decision-Theoretic (DW)* proponents say this is **Unnecessary**. They argue you don't need uncertainty to have rational preferences; you just need to care about your future successors in proportion to their "weight."

  **6. Diachronic Consistency**
  *   **The Requirement:** An agent's preferences before the measurement should align with the interests of their future successors after the measurement.
  *   **The Case:** If Pre-Measurement-You bets on Heads, but Post-Measurement-You (on the Tails branch) regrets it and wishes you had bet differently, your decision theory is unstable.
  *   **Status:** **Mostly Consensus, but Application Contested.** Everyone wants consistency, but disagree on what consistency implies for the Born rule.

  #### C. Formal Constraints (About the Math)

  **7. Non-Circularity (The "Measure" Constraint)**
  *   **The Requirement:** You cannot assume a "measure" (a way of weighting branches) that already looks like the Born rule ($|\psi|^2$) to prove the Born rule.
  *   **The Case:** The Hilbert Space math comes with a natural "norm" (length calculator). If you just assume "probability is proportional to the norm squared" at the start, you haven't derived anything; you've just restated the axiom.
  *   **Math Note:** The "norm" is just the length of the vector arrow. The Born rule says probability = (length)$^2$. You can't start by assuming probability = (length)$^2$.
  *   **Status:** **Non-Negotiable / Consensus.** This is the most common criticism leveled against derivations. Critics often charge that Deutsch-Wallace smuggles the norm in via symmetry axioms.

  **8. Empirical Recovery**
  *   **The Requirement:** In the limit of many measurements, the derivation must predict that observers will see frequencies matching the Born rule (e.g., in 1000 trials, roughly 500 Heads).
  *   **The Case:** If the theory doesn't match the lab data, it's false.
  *   **Status:** **Non-Negotiable / Consensus.**

  ---

  ### Part 2: Compatibility and Impossibility

  Are any of these jointly unsatisfiable?

  There is no formal proof (like Gödel's theorem) that says "You cannot derive the Born Rule in EQM." However, there is a **tension triangle** that forces you to drop or redefine one intuition:

  1.  **Determinism:** The future is fully fixed by the wavefunction (Req 1).
  2.  **Uncertainty:** Probability requires not knowing which outcome will occur (Req 5).
  3.  **Uniqueness:** There is only one of me at any time.

  In EQM, (1) is true. If you hold onto (3), then (2) seems impossible (because both outcomes occur).
  *   **Decision-Theorists** drop the need for (2). They redefine probability as *rational betting behavior* rather than *uncertainty*.
  *   **Self-Locating Uncertainty** proponents modify (3). They argue that before the split, "I" am not uniquely defined relative to the future branches, allowing for a form of ignorance.
  *   **Skeptics** argue that (1) and (2) are logically incompatible, making EQM incoherent regardless of the derivation.

  **The "Circularity" Trap:**
  The most significant "impossibility" charge is that **Req 1 (Unitary Purity)** and **Req 7 (Non-Circularity)** together make it impossible to get **Req 8 (Empirical Recovery)** without adding a new axiom. Critics argue that unitary physics alone contains no notion of "weight" or "importance," so assigning $|\psi|^2$ as a weight is an extra assumption, not a derivation. Proponents argue the "weight" is implicit in the geometry of the state space. This is the central battleground.

  ---

  ### Part 3: Scorecard of Major Approaches

  Here is how the three main strategies stack up against your requirements.

  | Requirement | **Deutsch-Wallace (Decision Theory)** | **Self-Locating Uncertainty (SLU)** | **Branch Counting** |
  | :--- | :--- | :--- | :--- |
  | **1. Unitary Purity** | **Pass.** Uses only unitary dynamics + rationality axioms. | **Pass.** Uses unitary dynamics + epistemic principles. | **Pass.** (Technically). |
  | **2. No Branch Counting** | **Pass.** Explicitly rejects counting. | **Pass.** Relies on "weights," not counts. | **FAIL.** This is its core mechanism. |
  | **4. Incoherence Solution** | **Reframes.** Probability = Rational Betting. No uncertainty needed. | **Accepts.** Probability = Ignorance of "which" branch. | **Fails.** Cannot explain why we observe $|\psi|^2$ frequencies. |
  | **5. Agent Ignorance** | **Rejects.** Deems uncertainty unnecessary for probability. | **Requires.** Central to the approach. | **N/A.** |
  | **7. Non-Circularity** | **Contested.** Critics say axioms (e.g., "Measurement Neutrality") sneak in the Born rule. | **Contested.** Critics say assuming "indifference" over branches smuggles in measure. | **Pass.** (But fails on empirical grounds). |
  | **Consensus Status** | **Leading Candidate.** Most developed, but axioms are debated. | **Rising Challenger.** Intuitively clearer to some, but faces "no ignorance" objections. | **Dead.** Rejected by almost all experts. |

  ### Part 4: Consensus vs. Contested (A Guide for Reading)

  As you dive into the literature, keep this map in mind:

  **Settled (Consensus):**
  *   **Branch counting is dead.** If a paper tries to derive probabilities by counting worlds, it is out of step with modern EQM.
  *   **Naive frequentism fails.** You can't just say "most branches show Born rule statistics" without defining what "most" means (which requires the Born rule already).
  *   **The problem is hard.** No one claims this is a trivial derivation.

  **Contested (The Battleground):**
  *   **Is Decision Theory enough?** Critics (e.g., Kent, Mandolesi) argue DW axioms are just the Born rule in disguise. Proponents (Wallace, Greaves) argue they are minimal rationality constraints.
  *   **Is there Subjective Uncertainty?** Can you be uncertain if you know everything? SLU proponents (Vaidman, Carroll) say yes (indexical uncertainty). Critics say this is word-play.
  *   **Is the derivation circular?** This is the most technical dispute. It hinges on whether the structure of Hilbert Space *forces* the Born rule or merely *allows* it.

  ### Final Advice for Your Reading

  When you read a derivation, ask these three questions immediately:
  1.  **Where did the "squared" come from?** (Why $|\psi|^2$ and not $|\psi|^4$?)
  2.  **Did they assume a measure?** (Did they say "let $\mu$ be a probability measure" without deriving why $\mu$ matches the amplitude?)
  3.  **What is the agent uncertain about?** (If they say "nothing," how do they justify betting? If they say "which branch," how is that possible in a deterministic multiverse?)

  If you keep these desiderata in mind, you will be able to spot when an author is solving the problem versus when they are shifting the burden to a different assumption. Good luck.
