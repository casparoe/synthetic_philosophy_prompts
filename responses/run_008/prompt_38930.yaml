answer: |-
  ### What the procedure keeps and drops

  This procedure retains L.A. Paul's core distinction between *ordinary choices* (where outcomes are knowable) and *transformative choices* (where outcomes are epistemically or personally inaccessible). It keeps the critical insight that testimony has limits: you cannot know what an experience is like *for you* until you have it, and you cannot know how your values will shift post-transformation. Consequently, it drops the standard expected-utility playbook for these specific cases, acknowledging that calculating "best outcomes" is logically impossible when the utility function is unknown. However, it drops the philosophical claim that rationality is impossible here. Instead of paralysis, the procedure pivots to *identity deliberation*: choosing based on who you want to become rather than what you want to experience. It also simplifies the metaphysics of "subjective character" into practical questions about simulation and reversibility. The goal isn't metaphysical truth, but diagnostic clarity: is this a case for math, or a case for commitment?

  ### The procedure itself

  **Phase 1: Triage (Is this actually transformative?)**
  1.  **Reversibility Check:** "If you try this and hate it, can you return to your current state?"
      *   *Stop condition:* If yes (e.g., a summer internship), use standard pros/cons. The hard problem only applies to irreversible or costly-to-reverse paths.
  2.  **Epistemic Access Check:** "Can you know what this feels like without doing it?"
      *   *Probe:* Can you shadow someone? Can you simulate the environment? Is the experience universal (pain) or subjective (parenting)?
      *   *Stop condition:* If sufficient testimony or simulation exists (e.g., staging in a kitchen), treat as ordinary risk. Do the math.
  3.  **Preference Stability Check:** "Will doing this change what you care about?"
      *   *Probe:* "Will the person who finishes this training value the same things as the person starting it?"
      *   *Stop condition:* If values remain stable (e.g., learning a software tool), use standard expected value.

  **Phase 2: The Pivot (If Phase 1 confirms transformation)**
  4.  **Shift the Frame:** Stop asking "What will happen?" Start asking "Who do you want to be?"
      *   *Question:* "Are you choosing this for the outcome (salary, status) or for the transformation itself?"
      *   *Sufficient Answer:* Student articulates a value identity (e.g., "I want to be someone who serves") rather than a utility outcome (e.g., "I want a pension").
  5.  **The Handoff:** Acknowledge the limit.
      *   *Statement:* "I cannot tell you if you will be happy, because that person does not exist yet. I can only confirm if this path aligns with the identity you are choosing to build."
      *   *Stop condition:* If the student demands outcome certainty, advise against the leap. You cannot rationally choose a transformative path if you require knowable utilities.

  ### The three cases

  **The Chef Dropout:** This case fails the Epistemic Access Check. While becoming a head chef is transformative, the daily reality of kitchen work is highly observable. The student can stage in a professional kitchen for a week without dropping out of engineering. Because the "what it is like" is accessible via testimony and simulation, the procedure demotes this to an ordinary choice. You must tell the student to stop romanticizing the unknown and run a standard risk calculation on income stability and career progression. This is the answer you won't like: it strips the decision of its philosophical gravity and forces the boring pros/cons list you wanted to avoid, potentially crushing a dream based on data rather than validating a leap of faith.

  **The Army Officer:** This passes all Phase 1 checks. Military officer training is designed to be epistemically opaque (you cannot know combat or command until there) and personally transformative (the institution remakes your values). The procedure forces you to pivot to Identity Deliberation. You cannot discuss career progression or life expectancy; those are outcome utilities the student cannot currently weigh. You must ask if they value the *type of person* the Army produces. If they hesitate or cite external rewards (pay, prestige), the procedure dictates you advise against enlistment, as they are trying to solve a transformation problem with an ordinary choice framework.

  **The Pregnant PhD Student:** This is the paradigmatic transformative choice. It is irreversible, epistemically opaque (no one knows what *your* parenting experience will be), and deeply personally transformative (values will shift regardless of the choice). The procedure requires you to halt all outcome-based advising. You cannot weigh "career success" against "child happiness" because the student's definition of success will change upon becoming a parent. You must hand the decision back entirely, framing it as a choice between two different future selves. Your role reduces to confirming that whichever path she chooses, she must accept that she will not be the same person who made the choice.

  ### Where it misfires

  The procedure fails when students use "transformative" as a shield for impulsivity. If a student claims they "can't know" the outcome to avoid doing basic research, the Epistemic Access Check relies on your judgment to call their bluff. It also misfires on hybrid cases: a career change might be partly transformative (new culture) and partly ordinary (salary), leaving you unsure which mode to use. Time pressure is the biggest enemy; genuine identity deliberation takes longer than thirty minutes. Finally, the procedure punts on cases involving coercion or mental health crises; if a student is fleeing trauma rather than choosing a future, the "identity" frame is unethical. In these instances, the procedure correctly identifies that rational choice is off the table, but offers no alternative tool other than referral to counseling.

  ### Confidence

  I am confident that the distinction between epistemic and personal transformation, and the resulting shift from outcome-based to identity-based deliberation, is faithful to L.A. Paul's *Transformative Experience*. The point I am least sure about is the **Epistemic Access Check threshold**: determining when testimony is "sufficient" to collapse a transformative choice into an ordinary one is a judgement call that varies wildly by individual.

  **Least confident case:** The **Pregnant PhD Student**. While philosophically it fits the model perfectly, the ethical weight and the entanglement of medical, financial, and relational factors make it resistant to clean procedural categorization. There is a risk that framing it purely as "identity selection" feels too abstract for someone in a concrete crisis, potentially alienating the student when they need practical support.
