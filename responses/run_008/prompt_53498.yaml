answer: |-
  **MEMORANDUM**

  **TO:** Franchise Subcommittee, Constitutional Review Commission
  **FROM:** [Your Name/Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Final Recommendations on Franchise Eligibility and Operational Tests

  ### 1. Executive Summary

  We are deadlocked because we are searching for a single philosophical principle to resolve three distinct sociological realities. This memo recommends that we abandon the search for a unified metaphysical theory of the *demos* and instead adopt a functional standard based on **Reciprocal Burden-Bearing**.

  Based on this standard, I recommend the following dispositions for national parliamentary elections:

  1.  **Long-Term Resident Non-Citizens:** **Enfranchise.**
      *   *Operational Test:* Proof of five years continuous physical residence + certification of tax compliance for the preceding three years. Registration is opt-in via the Electoral Commission.
  2.  **Expatriate Citizens:** **Restrict.**
      *   *Operational Test:* Voting rights for citizens resident abroad expire after ten years of continuous absence. Rights may be reinstated upon filing a local tax return or submitting a "Declaration of Intent to Return" validated by property lease or employment contract within the jurisdiction.
  3.  **Sixteen- and Seventeen-Year-Olds:** **Enfranchise.**
      *   *Operational Test:* Automatic registration upon issuance of National Identity Document at age 16. No separate application required.

  These recommendations are not a compromise. They are a deliberate selection of the **All-Subjected Principle** as the primary proxy for membership, modified by a minimal capacity threshold. The following sections explain why this approach answers the Chair's objections regarding the boundary problem and defines the limits of our own authority.

  ### 2. The Boundary Problem: Conceding the Chair's Point

  The Chair has correctly identified the core difficulty: the franchise is not a philosophical prize to be awarded based on abstract merit, but a trust held by a historical community. His objection is that any criterion we write down will be over-inclusive (enfranchising those with no stake in our future) or under-inclusive (excluding those bound by our laws), and that the *demos* is ultimately constituted by "mutual recognition and shared fate" rather than written criteria.

  **I concede this point.** There is no single principle—neither "all-subjected," "all-affected," nor "competence"—that maps perfectly onto our intuitive understanding of the political community without generating absurd results.
  *   *All-Affected* enfranchises foreign traders impacted by our monetary policy.
  *   *Competence* disenfranchises the cognitively disabled or the temporarily incapacitated.
  *   *Citizenship* alone enfranchises third-generation expatriates who have never shared our fate.

  However, while the Chair is right that "shared fate" cannot be fully codified, he is wrong to conclude that we therefore cannot write rules. A constitutional order cannot run on mutual recognition alone; it requires **proxies**. We cannot measure "fate," but we can measure **presence**, **liability**, and **time**.

  Therefore, our task is not to discover the true boundary of the *demos*, but to select the administrative proxies that best approximate the community's self-understanding while minimizing arbitrary exclusion. We are not philosophers discovering truth; we are engineers designing a gate.

  ### 3. Operationalizing Membership: The Principle of Reciprocal Burden-Bearing

  To break the deadlock, we must accept that the rationale for enfranchising one group need not be identical to the rationale for another, provided they all satisfy a single **institutional heuristic**: *Does this voter bear the primary burden of the state's coercive monopoly?*

  This heuristic avoids the litigation risks of abstract principles by focusing on verifiable facts rather than philosophical status.

  **A. Long-Term Resident Non-Citizens (Enfranchise)**
  *   **Rationale:** They are subject to the full coercive power of the state (criminal law, taxation, regulation) without the exit option of citizenship elsewhere (due to dual citizenship bars). Excluding them creates a class of permanent subjects without representation, which undermines the legitimacy of the laws they must obey.
  *   **Why this passes the Chair's test:** Five years of residence and tax compliance is a robust proxy for "shared fate." It demonstrates a decision to build a life within the community's risks and rewards.
  *   **Operational Test:** The Electoral Commission shall verify eligibility via the Tax Authority database. Applicants must submit a "Resident Voter Declaration" affirming intent to remain for the electoral cycle. This prevents transient workers from voting while capturing the 9% described in our brief.

  **B. Expatriate Citizens (Restrict)**
  *   **Rationale:** Here we must honor the Chair's concern about the "historical community." Citizenship is a legal bond, but the franchise is a function of shared fate. A third-generation expatriate who has never visited does not share the fate of the residents who must live with the consequences of parliamentary decisions. They are members of the *nation*, but not participants in the *demos*.
  *   **Why this passes the Chair's test:** It distinguishes between the *trust* of citizenship (which they keep) and the *act* of voting (which requires connection). It prevents the franchise from becoming a detached entitlement.
  *   **Operational Test:** The "Ten-Year Rule." The Electoral Commission will cross-reference passport exit stamps and tax filings. Any citizen absent for more than 10 consecutive years is moved to an "Inactive External Voter" roll. Reactivation requires physical presence or financial contribution (taxes) within the preceding 12 months. This is administrable and objective.

  **C. Sixteen- and Seventeen-Year-Olds (Enfranchise)**
  *   **Rationale:** The "competence" objection is the weakest link in our deadlock. If we enfranchise residents based on subjection to law, we cannot deny minors who are equally subject to criminal and civil law. The age of 18 is arbitrary; 16 is the age of partial legal capacity (driving, consent, employment) in our jurisdiction.
  *   **Why this passes the Chair's test:** It treats the franchise as a developmental stage of membership rather than a reward for wisdom. It strengthens the "historical community" by integrating youth before they disperse.
  *   **Operational Test:** Automatic registration linked to the National ID system. No competence test is required (as none is required for adults). This removes administrative barriers and avoids the "arbitrary competence floor" trap mentioned in our hearings.

  ### 4. Authority and Legitimacy

  The Chair has asked where this leaves the subcommittee's authority. If we admit that no single principle does the work, are we not merely legislating our own preferences?

  **Yes.** And we must own that.

  Our authority does not derive from our ability to solve the boundary problem philosophically. It derives from our mandate to ensure the **functional stability of the electoral system**.
  *   If we exclude residents, we risk civil unrest and a legitimacy crisis in the tax system.
  *   If we include distant expats without limit, we risk policy distortion where non-residents determine laws they do not live under.
  *   If we exclude minors, we create a generational disconnect that weakens long-term planning.

  We are not defining the *demos* in a vacuum; we are adjusting the franchise to match the reality of who actually constitutes the political community *in practice*. We are exercising **Constituent Power**. We are drawing the line not because it is metaphysically perfect, but because it is politically sustainable and administratively clear.

  ### 5. Conclusion and Next Steps

  The deadlock exists because we are trying to protect ourselves from litigation by finding a principle so airtight it cannot be challenged. That is impossible. Any line we draw will be challenged.

  We should therefore draw the line that best serves the integrity of the parliament.
  1.  **Vote to recommend enfranchisement** for residents (5-year/tax test).
  2.  **Vote to recommend restriction** for expats (10-year limit).
  3.  **Vote to recommend enfranchisement** for minors (age 16).

  This package is internally consistent under the heuristic of **Reciprocal Burden-Bearing**. It acknowledges the Chair's warning that the *demos* is a community of fate by tightening the rules for expats, while acknowledging the reality of modern governance by expanding the rules for residents and youth.

  I request we schedule a vote on these specific operational tests in our next session. We cannot write a constitution based on what we cannot define; we must write it based on what we can administer.
