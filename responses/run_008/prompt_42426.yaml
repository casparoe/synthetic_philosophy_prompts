      *   *Refining the "Missed" section:* I need to sound like I'm talking to a geochemist/philosopher. Use precise distinctions.
      *   *Key Missed Distinction 1:* **Eligibility vs. Nomination.** They focused on holding office. They didn't focus enough on the *barrier to entry* (the nominating committee's gatekeeping). A petition process (member signatures) bypasses the committee without needing sortition.
      *   *Key Missed Distinction 2:* **Continuity Mechanisms.** Lenz worries about expertise. Haas worries about stagnation. Neither proposed *institutional memory* tools (e.g., immediate past president stays on council, written manuals, overlapping terms).
      *   *Key Missed Distinction 3:* **The Nature of the "Rent".** Lenz thinks only of money. Haas thinks of agenda. The missed point is *status* and *access*.
      *   *Key Missed Distinction 4:* **Soft Limits.** Instead of hard bans, use "cooling off" periods or staggered council terms vs officer terms.

  5.  **Drafting the Response:**
