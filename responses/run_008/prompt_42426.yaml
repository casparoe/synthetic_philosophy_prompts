      *   *Idea 3: Distinguishing "Office" from "Council".* Maybe the Council should have limits, but Officers (who need expertise) shouldn't? Or vice versa?
      *   *Idea 4: Mentorship/Shadowing.* Addressing Lenz's expertise concern without keeping the same people forever. A "President-Elect" year or required understudy.
