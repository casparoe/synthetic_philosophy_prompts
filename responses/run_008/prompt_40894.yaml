prompt: |-
  I'm taking a sociology course and we just finished the Weber unit, and I've been arguing with my flatmate about it ever since. She's an econ student and her position is basically that "culture" can never be a real cause of anything economic, because culture is just a vague leftover label you slap on whatever you can't explain with prices, institutions, or geography. If a country is poor and you can't point to a resource curse or bad property rights, you say "it's the culture" and call it a day. To her, Weber's whole Protestant ethic story is a cautionary tale: it sounded brilliant, economic historians spent decades poking at it, and now nobody serious believes the tidy version of it.

  My take is that this is too quick, and I want to defend something like Weber's general move even if the specific Calvinism-and-capitalism story is shaky. My idea (which came up in a seminar argument, so it might be half-baked) is this: even if the Protestant ethic thesis fails as history, the *form* of explanation it uses might still be legitimate — you'd just need the values to be tied to concrete, observable practices and incentives, the way Weber tried to tie asceticism to bookkeeping and disciplined time-use. In other words, maybe culture can be a cause when it's cashed out as a bundle of habits and norms that get transmitted and enforced locally, but not when it's a free-floating national "spirit."

  Write an essay on whether culture can be a genuine cause in social and economic explanation, using the Weber controversy as your main case. Weigh my flatmate's deflationary view against my half-baked attempt to salvage cultural explanation, but feel free to go beyond both. Reach an actual conclusion rather than shrugging — and please write it in British English (I keep getting autocorrected to American spellings and it's driving me mad).
