answer: |-
  **The Ghost in the Machine: Re-evaluating Cultural Causality after Weber**

  The dormitory debate between the sociologist and the economist is a modern classic. On one side, the conviction that ideas, values, and meanings drive history; on the other, the insistence that only material incentives, prices, and institutions possess explanatory power. Your flatmate's dismissal of culture as a 'residual category'—a label slapped on phenomena that materialist models cannot yet digest—is a common position in contemporary economics. Conversely, your intuition that Max Weber's *The Protestant Ethic and the Spirit of Capitalism* (1905) retains methodological value, even if its historical specifics are contested, suggests a more nuanced understanding of social causality.

  To resolve this, we must distinguish between culture as a mystical 'spirit' and culture as a set of observable mechanisms. The conclusion reached here is that your flatmate is correct to reject vague cultural essentialism, but wrong to dismiss cultural explanation entirely. Culture is a genuine cause, but only when it is operationalised not as a national character, but as a system of norms and expectations that alter incentive structures and transaction costs. Weber's specific thesis may be historically fragile, but his methodological move remains indispensable.

  **The Econometric Critique: Culture as a Residual**

  Your flatmate's position rests on a robust methodological objection. In neoclassical economics, explanation usually relies on methodological individualism: agents have stable preferences and respond to constraints (prices, laws, technology). When an economist sees a divergence in economic outcomes between two regions with similar geography and institutions, and the sociologist says 'it is the culture', the economist hears a tautology. If 'culture' is defined simply as 'the reason they act differently', it explains nothing; it merely names the puzzle.

  Furthermore, the historical critique of Weber is substantial. Economic historians have long noted that capitalist practices—double-entry bookkeeping, banking, long-distance trade—flourished in Catholic Northern Italy and Flanders long before Luther nailed his theses to the church door in Wittenberg. If capitalism existed prior to the Protestant Ethic, Calvinism cannot be its sole cause. From this viewpoint, culture is endogenous; it is shaped by economic conditions rather than shaping them. To say a country is poor because it has a 'poverty culture' is often to blame the victim while ignoring the colonial extraction or extractive institutions that created the poverty in the first place. Your flatmate is right to be wary of explanations that treat culture as a free-floating ghost that magically descends upon a population to alter their GDP.

  **The Sociological Salvage: Norms as Mechanisms**

  However, your defence of Weber's 'form' of explanation strikes at the weakness of the purely materialist view. Your insight is that culture becomes causal when it is 'cashed out' as habits and norms. This aligns with modern developments in both sociology and institutional economics. Culture is not merely a preference; it is a technology of coordination.

  Consider the concept of trust. In a low-trust society, every economic transaction requires costly legal enforcement, monitoring, and collateral. In a high-trust society, a handshake suffices. This difference is cultural, rooted in historical patterns of association and religious or secular socialisation. It is observable, measurable, and has direct economic consequences. If a specific religious doctrine (like Weber's ascetic Protestantism) encourages literacy, punctuality, and the reinvestment of profit rather than conspicuous consumption, it alters the *constraints* facing the economic actor. It changes the 'price' of shirking or indulgence.

  When Weber linked asceticism to bookkeeping, he was attempting to show exactly what you suggest: a link between a metaphysical belief and a concrete daily practice. The error of bad cultural explanation is stopping at the 'spirit'. The success of good cultural explanation lies in tracing the transmission belt—the family socialisation, the community enforcement, the internalised guilt or shame—that turns a value into a behaviour. Recent empirical work, such as that by economists Luigi Guiso, Paola Sapienza, and Luigi Zingales, has shown that religious affiliation does correlate with economic attitudes (such as views on thrift or labour market regulation), even after controlling for income and institutions. This suggests culture is not merely a residual; it is an independent variable.

  **Beyond the Dichotomy: The Entanglement of Institutions and Culture**

  To reach a firm conclusion, we must move beyond the binary of 'culture vs. institutions'. The most compelling social science today recognises that institutions do not drop from the sky. A constitution is a piece of paper; the rule of law is a cultural belief that the constitution matters. As the economic historian Douglass North argued, institutions are the 'rules of the game', but culture determines how those rules are perceived and enforced.

  If we return to the Protestant Ethic controversy, the most productive reading is not that Calvinism *created* capitalism ex nihilo, but that it provided a cultural legitimation for behaviours that were previously morally suspect. Usury, profit-seeking, and rational calculation were often viewed with suspicion by the medieval church. Protestantism did not invent these practices, but it removed the moral friction surrounding them. It lowered the psychological and social transaction costs of capitalist accumulation.

  Therefore, the flatmate's claim that only 'institutions' matter is incomplete, because institutions rely on cultural software to run. Property rights only function if people believe in the legitimacy of ownership. Contracts only function if there is a norm of promise-keeping. To exclude culture is to ignore the fuel that powers the institutional engine.

  **Conclusion**

  So, who wins the argument? The verdict must be split, but ultimately in your favour. Your flatmate is correct that 'culture' is too often used as a lazy placeholder for ignorance. If a sociologist explains a complex economic phenomenon by invoking a vague 'national spirit' without specifying the mechanisms of transmission or enforcement, they are engaging in mythology, not science. In this specific sense, the deflationary critique is healthy and necessary.

  However, your flatmate is ontologically wrong to claim culture can *never* be a real cause. Values and beliefs are real features of the social world that constrain and enable action. When culture is defined as a bundle of norms that alter incentives, reduce transaction costs, and coordinate expectations, it is as material as a tax rate or a geographical barrier. Weber's specific historical narrative regarding Calvinism may be shaky, but his fundamental methodological insight stands: human action is oriented by meaning. To ignore the meanings actors attach to their work, their money, and their time is to misunderstand the economy itself.

  Culture is a cause, provided we treat it as a mechanism to be dissected rather than a mystery to be revered. You should tell your flatmate that she is right to hate bad sociology, but wrong to dismiss the sociological imagination. The economy is not a machine separate from society; it is embedded within it, and culture is the bedrock of that embedding.
