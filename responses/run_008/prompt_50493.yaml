prompt: |-
  hey so quick background before the ask: I run a small infosec research group at a university, about ten people, grad students through senior researchers, and we have a recurring problem that I only recently found a name for. apparently it's called the "unilateralist's curse" (from some AI-risk-adjacent literature I got pointed to, Bostrom and others I think — I'm probably mangling it, apologies): when a bunch of agents each have the power to take some action, and every one of them would prefer the action NOT be taken if it's going to be net bad, the action still gets taken as long as just one person privately thinks it's a good idea — even a small difference in individual judgment is enough, because each person's veto is worth nothing if any other person can act. the flip side is the bystander problem: if you make acting require everyone's sign-off, nothing ever gets done, including the actions that would clearly make the world better (like actually telling a vendor about a hole so it gets patched). we keep living both versions: one of my postdocs once posted a full proof-of-concept exploit on his personal blog because he was 55% sure disclosure was fine, half the lab disagreed, and the ensuing drama almost broke the group; meanwhile a genuinely important disclosure about an exposed database sat in someone's drafts for two months because nobody felt entitled to be the one to push send.

  what I want from you: act as an expert in research ethics and collective action (the disclosure dilemma, dual-use research, that whole literature) and build me an actual decision procedure my team can run — a checklist with the questions in order, what counts as a sufficient answer to each question, and crucially where the procedure terminates in a "no, don't publish this, here's why," where it terminates in a green light without further review, and where it has to punt to a person or a small committee because the question is one of values or judgment rather than facts. ground it in the curse itself: I want the procedure to be explicit about the asymmetry between "I think this is fine" and "this is fine given that only one of us needs to be wrong for it to happen," i.e. some kind of personal-confidence discount the acting researcher should apply — think carefully about what that discount should look like and whether a fixed number is even defensible. it also needs an escape valve for the bystander version: a rule for when holding something back too long is itself the unilateral action (someone else finds the hole, or it's exploited in the wild while we sat on it), and what the default should be after some deadline passes. be honest about the places where the procedure can only launder a judgment call into officious-sounding steps, since I'd rather know where the theater is.

  then please run the procedure on three concrete cases so I can see whether it actually works: (1) the zero-day in a widely used open-source library where the vendor has ignored us for 90 days and the researcher wants a full-disclosure post with working exploit code, (2) a grad student who wants to live-demo a hack of a popular smart doorbell at a conference with the exploit details in the slides, and (3) a case I'm including specifically because I expect to hate the answer — a student who found a way to mass-enumerate misconfigured servers that also happens to be usable for surveillance, and wants to publish the method itself. for each, show the path through the tree and where it comes out, and for at least one case tell me where you think the procedure gives the wrong or at least unpalatable answer and what you'd override by hand. and at the end, one honest paragraph on the whole thing: what the procedure is doing well, and the single most likely way my team will learn to game it. take your time and maybe brainstorm the question ordering before you commit to it — the order matters, since cheap factual questions should knock out obvious cases before anything expensive (like a committee meeting) gets triggered. no need for a lit review or citations, I've got the reading covered, I just need the machine.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** Small infosec research group (10 people, mixed seniority).
      *   **Problem:** "Unilateralist's Curse" (one person acts against group consensus) vs. "Bystander Problem" (no one acts due to diffusion of responsibility).
      *   **Task:** Create a decision procedure (checklist/flowchart) for disclosure/publication decisions.
      *   **Key Requirements:**
          *   Explicitly address the asymmetry of risk (one person wrong = disaster).
          *   Include a "confidence discount" mechanism.
          *   Include an "escape valve" for inaction (bystander problem).
          *   Identify where the procedure is "theater" (judgment calls disguised as steps).
          *   Order questions efficiently (cheap facts first, expensive committee reviews last).
          *   Run three specific test cases (Zero-day ignored 90 days, Smart doorbell demo, Mass-enumeration/surveillance tool).
          *   Provide an honest critique at the end (strengths + how it will be gamed).
      *   **Tone:** Expert in research ethics/collective action, pragmatic, honest, no fluff/lit review.

  2.  **Analyze the Core Conflict:**

      *   *Unilateralist's Curse:* $P(\text{Disaster}) = 1 - (1-p)^n$. If $n=10$ and each person has a 10% chance of misjudging risk, the group risk is ~65%. The procedure needs to lower individual $p$ or reduce effective $n$ for high-stakes decisions.
      *   *Bystander Problem:* Diffusion of responsibility leads to paralysis. The procedure needs a "default to action" after specific conditions are met to prevent harm from inaction.
      *   *Confidence Discount:* A researcher shouldn't act on "55% sure." They need to account for the possibility that *someone else* in the group knows something they don't. This implies a threshold significantly higher than 50%.

  3.  **Drafting the Decision Procedure (The "Machine"):**

      *   *Structure:* Tiered approach.
          *   Tier 1: Hard Facts (Kill switches).
          *   Tier 2: Risk Assessment & Confidence Discount.
          *   Tier 3: Consultation & Veto Mechanisms.
          *   Tier 4: The Escape Valve (Time limits).
      *   *The Confidence Discount:* How to quantify? A fixed number (e.g., 90%) is arbitrary. Better to frame it as "Consensus-Adjusted Confidence." If I think it's safe, do I know *why* my colleagues might think it's unsafe? If I haven't asked them, my confidence is artificially high.
      *   *The Escape Valve:* If we wait too long, the vulnerability becomes public via malicious actors. Inaction becomes the risky action. Need a "Sunset Clause."
      *   *Theater:* Acknowledge that ethics isn't math. The "Committee Review" step is often just social pressure to conform, not objective truth-finding.

  4.  **Refining the Steps (Ordering for Efficiency):**

      1.  *Legal/Contractual Check:* (Fastest, binary). Are we NDAd? Is this illegal (CFAA)? If yes -> STOP.
      2.  *Harm Potential:* (Fast estimation). Is this critical infrastructure? Life safety? If high -> Committee.
      3.  *Vendor Engagement:* (Fact check). Did we tell them? How long ago?
      4.  *Confidence Discount:* (Internal). Apply the "Unilateralist Tax."
      5.  *Group Consult:* (Expensive). Require sign-off for high risk.
      6.  *Sunset/Escape:* (Time-based). Force a decision.

  5.  **Developing the Test Cases:**

      *   *Case 1 (Zero-day, 90 days ignored):* High harm potential, but vendor inaction creates liability for *us* if someone else finds it. Escape valve triggers.
      *   *Case 2 (Smart Doorbell Demo):* Medium harm. Embarrassment vs. security. Live demo adds volatility. Needs committee review on the "exploit in slides" aspect.
      *   *Case 3 (Mass Enumeration/Surveillance):* High dual-use risk. Method is the weapon. This is the "Unilateralist's Curse" prime target. One enthusiastic student vs. cautious group.

  6.  **Addressing the "Confidence Discount":**

      *   Instead of a percentage, use a "Pre-Mortem" requirement. "List 3 reasons your colleagues might veto this." If you can't list 3, you haven't thought hard enough.
      *   Alternatively, require that *confidence > (Risk Severity / 10)*. No, that's too mathy.
      *   *Better:* The "Veto Weight." For high-severity issues, one veto kills the action. For low-severity, majority rules.
      *   *Best:* The "Information Gap" check. "Have you actively solicited dissent?" If no, confidence is capped at 50%.

  7.  **Addressing the "Theater":**

      *   The committee vote isn't truth; it's risk distribution.
      *   The "Sunset Clause" forces action but might force *bad* action.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the Bostrom reference (Nick Bostrom, "The Unilateralist's Curse").
      *   *The Procedure:* Name it something functional. "The Asymmetric Disclosure Protocol (ADP)."
      *   *Step 1 (Hard Constraints):* Law/Policy.
      *   *Step 2 (Severity Sorting):* Triage.
      *   *Step 3 (The Discount):* The core mechanism. Require active dissent seeking.
      *   *Step 4 (The Escape):* Time limits.
      *   *Case Studies:* Walk through logically.
      *   *Critique:* Be brutal about gaming.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the confidence discount too vague?
      *   *Fix:* Make it procedural. "You cannot claim >60% confidence without documenting that you asked X, Y, Z."
      *   *Critique:* Is the escape valve dangerous?
      *   *Fix:* The escape valve defaults to *responsible* disclosure (vendor only), not full public exploit, unless the vendor is defunct.
      *   *Critique:* Did I answer the specific prompt about "where it terminates"?
      *   *Fix:* Ensure each step has a Clear STOP, GO, or ESCALATE.

  10. **Final Polish:** Check tone. Ensure it sounds like a peer talking to a peer, not a textbook. Ensure the "gaming" section is insightful (e.g., sandbagging severity to avoid committee).

  *(Self-Correction on the Confidence Discount)*: The prompt asks for a "personal-confidence discount." I need to be specific. If I am 90% sure, but I haven't asked the group, my *effective* confidence should be lower. Let's propose a formula or a heuristic. Heuristic is better for humans. "If you haven't polled the group, cap your confidence at 'Majority Uncertain'." Actually, let's use the "Principle of Conformity": If the cost of being wrong is catastrophic, the threshold for action is not "I think it's safe," it's "We agree it's safe."

  *(Refining the Escape Valve)*: The bystander problem is about *inaction*. The escape valve needs to assign *ownership*. "If no one owns this decision by Day X, the PI owns it."

  *(Refining the Theater)*: The committee meeting is where responsibility is diffused. That's the theater. It makes everyone feel safe, but doesn't guarantee safety.

  Okay, ready to write.
answer: |-
  This is a classic coordination problem in high-stakes environments. You are correct on the provenance: Nick Bostrom's *The Unilateralist's Curse* (2016) describes exactly this dynamic. In infosec, it's compounded by the "Bystander Effect" (diffusion of responsibility) and the "Dual-Use Dilemma" (beneficial research enabling harm).

  You need a procedure that acts as a **circuit breaker**. It must lower the effective $n$ (number of agents) for high-risk actions and raise the effective $n$ for high-stakes inaction.

  Below is the **Asymmetric Disclosure Protocol (ADP)**. It is designed to be run by the initiating researcher, with escalation points.

  ### The Asymmetric Disclosure Protocol (ADP)

  **Philosophy:** Action requires consensus proportional to risk. Inaction requires justification proportional to urgency.
  **The Confidence Discount:** An individual researcher's confidence ($C_{ind}$) is discounted by the lack of group consultation. $C_{eff} = C_{ind} \times (1 - \text{DissentRisk})$. Practically, this is enforced procedurally: you cannot claim high confidence without evidence of attempted falsification by peers.

  #### Phase 1: Hard Constraints (The "No-Go" Zone)
  *Cost: Low. Time: <1 hour.*
  *Goal: Eliminate illegal or contractually forbidden actions immediately.*

  1.  **Legal/Contractual Check:** Does this action violate an NDA, a specific vendor agreement, or local law (e.g., CFAA, GDPR, export controls)?
      *   **YES:** **TERMINATE.** Document the constraint. No further review needed.
      *   **NO:** Proceed to Q2.
  2.  **Immediate Harm Check:** Does executing or publishing this *directly* endanger human life or critical infrastructure (hospital grids, power, nuclear) within 48 hours?
      *   **YES:** **TERMINATE.** Escalate immediately to PI/Ethics Board. No individual publication.
      *   **NO:** Proceed to Phase 2.

  #### Phase 2: Severity Sorting & The Confidence Discount
  *Cost: Medium. Time: 1-2 Days.*
  *Goal: Apply the Unilateralist Discount. Force the researcher to account for hidden information.*

  3.  **Severity Classification:** Classify the potential negative impact of publication into three tiers:
      *   **Tier A (Catastrophic):** Weaponizable by state actors, mass surveillance, critical infrastructure collapse.
      *   **Tier B (Significant):** Financial loss, privacy violation, widespread consumer device compromise.
      *   **Tier C (Minor):** Embarrassment, minor inconvenience, already widely known issues.
  4.  **The Dissent Audit (The Discount Mechanism):**
      *   *Rule:* You may not assess your own confidence in isolation.
      *   *Action:* You must present the finding to at least **two** other group members (one must be senior to you) and explicitly ask: *"What is the strongest argument against publishing this?"*
      *   *Requirement:* You must document their objections.
      *   **Failure to do this:** Your confidence is capped at **Tier C**. You cannot proceed to Tier A or B publication without this audit.
      *   **If Objections Raised:** If *any* reviewer flags a Tier A risk, the procedure **ESCALATES** to Phase 3. You cannot override a Tier A flag unilaterally.
      *   **If No Objections:** Proceed to Phase 3.

  #### Phase 3: The Committee Gate (Consensus vs. Speed)
  *Cost: High. Time: 1 Week.*
  *Goal: Resolve the Unilateralist Curse for high-stakes decisions.*

  5.  **The Review Panel:** For Tier A or disputed Tier B findings, a panel of 3 (PI + 2 senior researchers) must vote.
      *   **Unanimous Approval:** **GREEN LIGHT.** Publish per plan.
      *   **Unanimous Rejection:** **RED LIGHT.** Do not publish. Archive internally.
      *   **Split Vote:** **ESCALATE TO ESCAPE VALVE (Phase 4).** A split vote indicates high uncertainty. The default is *delay*, not action, unless the Escape Valve triggers.

  #### Phase 4: The Escape Valve (The Bystander Antidote)
  *Cost: None (Time-based).*
  *Goal: Prevent paralysis. Make inaction a deliberate choice.*

  6.  **The Sunset Clause:**
      *   Every disclosure decision enters a "Pending" state with a deadline based on Severity.
          *   **Tier A:** 30 Days.
          *   **Tier B:** 14 Days.
          *   **Tier C:** 7 Days.
      *   **Rule:** If the procedure has not terminated in a Green or Red Light by the deadline, **ownership defaults to the PI.**
      *   **PI Decision:** The PI must make a binary choice. They cannot return it to the group. This breaks the bystander loop.
      *   **Vendor Stalemate:** If the decision is held up *solely* because a vendor is non-responsive, the deadline resets to **90 Days from first contact**. After 90 days of silence, the default shifts to **Full Disclosure** (Tier B/C) or **Coordinated Disclosure with Warning** (Tier A), because the risk of the vulnerability remaining unpatched now outweighs the risk of publication.

  ---

  ### Where the Theater Is
  Be honest with your team: **Phase 3 (The Committee Gate)** is partially theater. A vote of 3 people does not make an exploit safe; it distributes the moral liability so no single postdoc feels alone if things go wrong. It is a *liability sink*, not a truth machine. Also, **Phase 2 (Dissent Audit)** relies on peers being brave enough to contradict a senior researcher. If your lab culture is hierarchical, junior researchers will rubber-stamp senior ideas. The procedure cannot fix a toxic culture, it can only highlight it.

  ---

  ### Test Cases

  #### Case 1: Zero-Day in Open-Source Library (Vendor Ignored 90 Days)
  *   **Scenario:** Critical library, vendor silent 90 days, researcher wants full disclosure + exploit.
  *   **Phase 1:** Legal check clear. Immediate harm? Potentially, but not "within 48 hours" direct execution. Pass.
  *   **Phase 2:** Severity = **Tier B** (Widespread compromise). Dissent Audit: Two peers agree vendor silence is a problem, but one worries about script kiddies. Objection flagged.
  *   **Phase 3:** Panel Review. Split vote. Two say "Patch or Perish," one says "Exploit code is too dangerous."
  *   **Phase 4 (Escape Valve):** 90-day vendor silence rule triggers.
  *   **Outcome:** **GREEN LIGHT (Conditional).** The procedure mandates action due to the Sunset Clause on vendor response. However, the "Exploit Code" portion is modified. The procedure suggests publishing the *vulnerability details* and a *patch*, but withholding the *weaponized exploit* unless the panel agrees the patch is insufficient.
  *   **Verdict:** Publish advisory and patch. Withhold exploit code unless panel overrides.
  *   **Why:** The Escape Valve prevents the bystander problem (sitting on it forever), but the Committee Gate prevents the unilateralist from releasing a weapon unnecessarily.

  #### Case 2: Smart Doorbell Live Demo at Conference
  *   **Scenario:** Grad student wants to live-hack a doorbell on stage with slides showing the exploit.
  *   **Phase 1:** Legal check clear. Immediate harm? No.
  *   **Phase 2:** Severity = **Tier B** (Consumer privacy/safety). Dissent Audit: Senior postdoc argues live demos are volatile (network conditions, accidental bricking). Objection flagged.
  *   **Phase 3:** Panel Review. The risk is reputational and potential collateral damage.
  *   **Outcome:** **RED LIGHT (on Live Demo).** **GREEN LIGHT (on Paper/Video).**
  *   **Why:** The "Immediate Harm" check in Phase 1 is usually for physical harm, but Phase 2 captures "uncontrolled execution." A live demo introduces variables you cannot patch. The procedure terminates the *action* (live hack) but allows the *disclosure* (video recording of a controlled environment).
  *   **Verdict:** Student must pre-record the demo in the lab. No live network access from the conference floor.

  #### Case 3: Mass Enumeration / Surveillance Tool (The One I Expect You to Hate)
  *   **Scenario:** Student found a method to mass-enumerate misconfigured servers. Useful for defenders to find their own leaks, but usable by censors/surveillors to find dissidents. Student wants to publish the *method*.
  *   **Phase 1:** Legal check clear. Immediate harm? **YES.** If published, it could be run *tonight* against target lists.
  *   **Phase 2:** Severity = **Tier A** (Dual-use surveillance). Dissent Audit: Mandatory.
  *   **Phase 3:** Panel Review. High likelihood of Split Vote or Rejection. The dual-use risk is intrinsic to the method.
  *   **Outcome:** **RED LIGHT.**
  *   **Why:** This is the Unilateralist's Curse in its purest form. One student's desire for credit/publication vs. potential societal harm. The procedure forces a Tier A classification. In Tier A, the default is *non-proliferation*.
  *   **The Unpalatable Truth:** The procedure kills the paper. The student cannot publish the *method*. They can publish the *existence* of the class of vulnerability and urge vendors to scan for it, but the specific enumeration algorithm must be redacted or shared only with trusted vendors.
  *   **Override:** If I were you, I would **OVERRIDE** the Red Light *only if* the method is mathematically trivial and likely to be rediscovered independently within 6 months. If it's a clever, unique heuristic, keep it redacted. If it's "just a nmap script," publishing it alerts defenders faster than secrecy helps attackers. The procedure is too conservative here; it assumes secrecy = safety, but in infosec, obscurity is not security. I would manually override to allow publication *if* the method is simple enough that withholding it provides no real security (security through obscurity).

  ---

  ### Honest Critique: Strengths & Gaming

  **What it does well:**
  The ADP successfully shifts the burden of proof. Currently, your team operates on "Innocent until proven guilty" (I can publish unless someone stops me). This procedure moves to "Guilty until proven safe" for high-severity issues (I cannot publish unless the panel agrees). The **Sunset Clause** is the critical addition; it prevents the "Bystander Problem" by assigning a ticking clock that forces the PI to take ownership, breaking the paralysis of collective ambiguity.

  **How they will game it:**
  The single most likely failure mode is **Severity Sandbagging**. Researchers will learn to classify Tier A risks as Tier B to avoid the Phase 3 Committee Gate and the associated delays. They will argue, *"It's not critical infrastructure, it's just IoT toasters,"* to bypass the panel.
  *Counter-measure:* You (the PI) need to audit the Severity Classifications randomly. If you catch someone sandbagging a Tier A as Tier B, the penalty must be severe (e.g., loss of publication privileges for 6 months). Without enforcement of the classification step, the rest of the machine is just a suggestion box.
