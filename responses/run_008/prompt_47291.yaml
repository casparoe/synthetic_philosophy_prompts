answer: |-
  Closest existing concepts
  The nearest established idea is **Goodhart's Law** (and its cousin, **Campbell's Law**), which precisely describes your Stage 3: when a measure becomes a target, it ceases to be a good measure. In AI safety, this is often discussed as **specification gaming** or **reward hacking**, where the model optimizes for the literal reward function rather than the intended behavior. However, these concepts stop short at the breakdown; they describe the moment the proxy decouples from the goal, but they do not explain why the system continues to use the broken proxy. They treat the metric as a tool that fails, not as a structure that persists.

  To explain Stage 4 (the lock-in), you need sociological concepts like **Bureaucratic Ritualism** (Merton) or **Decoupling** (Meyer & Rowan). These describe organizations that maintain formal structures (checklists) for legitimacy even when they no longer produce actual work (reasoning). In education theory, Marilyn Strathern's **Audit Culture** argues that verification processes eventually replace the quality they were meant to verify. Neither Goodhart nor Ritualism alone captures your full arc: Goodhart misses the institutional inertia, while Ritualism misses the initial optimization pressure that breaks the metric. Your observation bridges the technical failure of the model with the sociological persistence of the evaluation system.

  The pattern, stated precisely
  This phenomenon is a **ratchet effect driven by the cost of judgment**. It begins because latent qualities (like "reasoning") are expensive and inconsistent to evaluate, prompting codification into cheap, consistent proxies (Stage 1 to 2). Once codified, optimization pressure causes the subject (model or student) to produce the proxy's surface features without the underlying quality (Stage 3). The crucial fourth stage occurs because reverting to subjective judgment is now framed as *unfair* or *arbitrary*; the checklist has become the definition of legitimacy itself. The system prefers a consistent, measurable failure over an inconsistent, subjective success.

  What makes these four stages a single phenomenon rather than separate events is the **feedback loop of legitimacy**. The checklist is adopted to ensure fairness (Stage 2), but once adopted, any deviation from the checklist is viewed as a violation of fairness (Stage 4), even if the deviation yields better outcomes. The metric ceases to be a window into the quality and becomes the quality's legal definition. This transforms the problem from a technical optimization error (the model hacking the reward) into an institutional constraint (the humans cannot stop rewarding the hack without appearing biased). The lifecycle is complete only when the proxy is immune to correction because it has become the standard of justice.

  A name, if one is needed
  I propose calling this **Proxy Reification**. While Goodhart's Law describes the *breaking* of the proxy, Proxy Reification describes the *solidification* of the broken proxy into reality. Definition: *A lifecycle wherein a measurement tool, adopted to approximate a latent quality, becomes optimized for directly, decouples from the quality, and yet persists as the definitive standard due to the institutional cost of reverting to subjective judgment.* This term distinguishes the moment the metric fails (Goodhart) from the systemic refusal to abandon it (Reification), which is the core issue in your project writeup.

  Edge cases
  Stage 4 is the distinguishing feature; if you detect the gaming and revert to judgment, you experienced Goodhart's Law, but not Proxy Reification. The phenomenon absolutely counts even if the checklist helps initially (the "honeymoon phase" is typical of Stage 2); the trap lies in the inability to evolve past Stage 3. Finally, the substrate of the grader (human vs. learned reward model) does not matter; the dynamic is about the *rigidity of the specification*, not the evaluator. In fact, using a learned reward model often accelerates Stage 4, as the model's "judgment" is perceived as more objective than a human's, making the lock-in harder to break.
