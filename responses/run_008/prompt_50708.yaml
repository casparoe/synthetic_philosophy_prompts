answer: |-
  **Bottom Line Verdict**
  The desiderata for **Embedding Stability** and **Appropriation Flexibility** cannot be jointly satisfied within a single, unified layer of linguistic meaning under standard truth-conditional frameworks. Satisfying Embedding requires locating derogation in conventional semantics; satisfying Appropriation requires locating it in context-sensitive pragmatic force. An adequate theory must either posit a systematic ambiguity in slur content or revise the boundary between semantics and pragmatics to allow for conventionalized implicatures that project.

  ***

  **Desiderata for a Theory of Slurs**

  **1. Embedding Stability (The Frege–Geach Data)**
  *   **Requirement:** The derogatory content must persist when the slur appears in non-assertoric contexts, such as negations, conditionals, questions, and modal operators.
  *   **Case/Datum:** The utterance "If John is a [slur], he should leave" projects the same derogatory ideology as "John is a [slur]," despite the slur not being asserted as true. A theory must explain why the offense survives embedding without committing the speaker to the truth of the slur's application.
  *   **Status:** Non-negotiable (robust linguistic behavior).
  *   **Tension Flag:** **Incompatible with Appropriation Flexibility** under unified semantic accounts. If derogation is semantic truth-conditions, it is difficult to explain how in-group speakers cancel it without changing the meaning. If derogation is pragmatic, it is difficult to explain why it projects through logical operators.

  **2. Appropriation Flexibility (The Reclamation Data)**
  *   **Requirement:** The theory must account for the variability of derogatory force based on speaker identity and context, specifically where in-group speakers use the term without offense or with positive solidarity.
  *   **Case/Datum:** An out-group speaker saying "You are a [slur]" constitutes a verbal assault, while an in-group speaker saying "We are [slurs]" constitutes solidarity. The literal referent remains constant, but the normative force flips.
  *   **Status:** Non-negotiable (sociolinguistic fact).
  *   **Tension Flag:** **Incompatible with Embedding Stability** under unified semantic accounts. If the meaning is fixed conventionally, appropriation requires semantic change (which is too slow) or massive context-sensitivity (which threatens embedding).

  **3. Use/Mention Discrimination (The Quotation Data)**
  *   **Requirement:** The theory must distinguish between using a slur to derogate and mentioning a slur to report on language, ensuring the reporter does not inherit the derogatory commitment.
  *   **Case/Datum:** "He called me a [slur]" is acceptable reporting, whereas "He said that I am a [slur]" (indirect report) often feels like it perpetuates the insult. The theory must explain why indirect report sometimes transmits offense while quotation does not.
  *   **Status:** Non-negotiable (distinction between use and mention).
  *   **Tension Flag:** Tensions with **Offense Mechanism** if offense is purely truth-conditional; reporting truth conditions should not offend, yet indirect reports often do.

  **4. Asymmetry of Reference (The No Neutral Counterpart Data)**
  *   **Requirement:** The theory must handle cases where a slur appears to lack a neutral counterpart or where the slur seems to constitute the category rather than merely describe it.
  *   **Case/Datum:** For some historical slurs, the neutral term feels like a euphemism, or the slur was the primary term used to define the group during the period of oppression. The theory must explain whether the slur and neutral term are co-referential or if the slur picks out a socially constructed subset.
  *   **Status:** Artifact of one theoretical camp (debated whether true neutral counterparts always exist).
  *   **Tension Flag:** Tensions with **Embedding Stability** if co-reference is denied; if slurs and neutral terms are not co-referential, substitution in embedded contexts should change truth conditions, which is not always intuitively observed.

  **5. Offense Mechanism (Descriptive vs. Prescriptive)**
  *   **Requirement:** The theory must specify whether the offense tracks a descriptive property (e.g., "is a member of group G") or a prescribed affective stance (e.g., "ought to be treated with contempt").
  *   **Case/Datum:** Offense is felt even when the descriptive content is known to be false or irrelevant, suggesting the harm lies in the invocation of a hierarchical norm rather than a misdescription of reality.
  *   **Status:** Non-negotiable (phenomenology of harm).
  *   **Tension Flag:** **Incompatible with standard Truth-Conditionality.** If the content is prescriptive (an imperative to disdain), it lacks standard truth conditions, complicating the explanation of **Embedding Stability** in logical contexts.

  **6. Reporter Immunity in Indirect Speech**
  *   **Requirement:** The theory must explain the conditions under which a speaker reporting another's speech is insulated from the derogatory commitment versus when they are complicit.
  *   **Case/Datum:** A journalist writing "The suspect used the word [slur]" is not offensive; a journalist writing "The suspect said the victim was a [slur]" often is. The theory must delineate the semantic or pragmatic boundary that licenses one but forbids the other.
  *   **Status:** Non-negotiable (norms of reporting).
  *   **Tension Flag:** Tensions with **Appropriation Flexibility**; if context determines force, the reporter's context should suffice to neutralize the offense, yet it often does not.
