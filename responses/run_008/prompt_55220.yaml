          4.  Alternative Metaphors (Recipes, Blueprints, Self-executing chemistry, etc., with trade-offs).

  2.  **Deconstruct the Metaphor (Mental Draft & Fact-Checking):**
      *   *The Claim:* DNA = Code, Cell = Computer.
      *   *The Biochemist's View:* DNA is a molecule. Transcription/Translation is chemistry. Folding is thermodynamics/kinetics. Regulation is network dynamics.
      *   *The Computer View:* Code is abstract logic. Hardware is physical substrate. Execution is deterministic (mostly).
      *   *Key Tension:* Information vs. Matter/Energy. In computers, they are distinct. In cells, they are identical (the DNA *is* the physical object being processed).
      *   *Specific snag mentioned by user:* Genetic code (cipher) vs. Developmental program (logic).

  3.  **Drafting Section 1: Correspondence Table:**
