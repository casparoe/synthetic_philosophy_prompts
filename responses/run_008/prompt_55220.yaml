      *   *The "Read/Write" Head:* In computers, the head doesn't change the disk permanently during read. In cells, transcription changes chromatin state (epigenetics).
      *   *Semantics:* Computer code has syntax/semantics defined by an external agent. Biological "meaning" is functional survival, defined by selection.
      *   *The "Genetic Code" vs. "Program":* As the user noted, the codon table is just a cipher. The *logic* is in the regulatory networks, not just the sequence.

  5.  **Drafting Section 3: Verdict on Specific Uses:**
