      *   *Design Inference (ID):* Relies on "code implies coder." If biology isn't actually code in the computational sense, the inference fails. *Verdict:* The analogy carries the entire weight; without it, the argument collapses.
      *   *Editing/Reprogramming (Biotech):* Useful heuristic for intervention, but dangerous if it implies precision/determinism that isn't there (off-target effects, pleiotropy). *Verdict:* Pragmatically useful but ontologically risky.

