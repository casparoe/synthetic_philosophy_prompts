  ### 1. Rationalizing the Adjudicator's Rules

  Based on the four prior rulings, we can reconstruct two competing principles that both fit the data but rely on different epistemic priorities.

  **Rule 1: The Operative Uncertainty Principle (Causal Homogeneity)**
  This rule posits that the correct reference class is the one that minimizes variance in the *specific causal mechanism* or *risk driver* determining the outcome. The class boundaries are drawn not by institutional labels or sample size, but by the homogeneity of the "operative uncertainty."
  *   **Fit:**
      *   *Case 1 (Startup):* The driver is founder learning/sector economics. These are homogeneous in the narrow class, heterogeneous in the broad one.
      *   *Case 2 (Spacecraft):* The driver is vehicle maturity. This is homogeneous across "first flights," heterogeneous across "all flights."
      *   *Case 3 (Tenure):* The driver is individual merit/record. This is matched by "similar records," not institutional affiliation.
      *   *Case 4 (Postdoc):* The driver is the external labor market for quant skills. This market crosses disciplinary boundaries, so the class must broaden to capture the true driver.

  **Rule 2: The Maximal Predictive Feature Principle (Evidential Similarity)**
  This rule posits that the correct reference class is the one defined by the *maximal set of known, statistically predictive features* available at the time of the bet. It prioritizes the information state of the bettor over the underlying causal theory.
  *   **Fit:**
