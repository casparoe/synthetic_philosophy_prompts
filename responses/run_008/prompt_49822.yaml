answer: |-
  Here is the adjudication, move by move, followed by the general ruling and the distinction you asked for.

  ### The Adjudication

  **Move 1 (Dana): The Archive as Evidence.**
  Dana argues that the archive is evidence and community memory is confabulation; therefore, the plaque must be revised to avoid a "noble lie."
  *   **Rating:** **Mostly Right.**
  *   **Why:** Dana is correct on the epistemic principle: public infrastructure making factual claims should align with the best available evidence. A plaque stating "Harlan rowed" is a falsifiable claim, and the evidence suggests it is false. However, Dana is naive about the nature of archives. Treating the newspaper record as a "view from nowhere" ignores the selection bias inherent in 1907 journalism (e.g., who was considered newsworthy). Dana wins the point on *truth*, but loses nuance on *source criticism*.

  **Move 2 (Marcus): The Archive as Curatorial Bias.**
  Marcus argues the archive reflects the editor's biases, not objective reality, and that oral tradition preserved the name the archive marginalized.
  *   **Rating:** **Right.**
  *   **Why:** This is the strongest historiographical point in the debate. Archives are not truth; they are filtered records of what powerful institutions deemed notable. The fact that "A. Rinez" appears once, misspelled, while Harlan appears later during the photo-op cleanup, is classic evidence of status bias. Marcus correctly identifies that "silence in the record" is not "evidence of absence," especially for marginalized groups. He successfully destabilizes Dana's blind faith in the printed word.

  **Move 3 (Dana): Incompleteness vs. Reliability.**
  Dana grants the bias but argues it doesn't make the Reyes tradition reliable; family lore is also self-serving, and convergence is required.
  *   **Rating:** **Mixed.**
  *   **Why:** Dana is right to demand corroboration; oral history *can* drift over a century. However, dismissing oral tradition as inherently "less reliable" than a biased 1907 newspaper is a specific literate bias. In tight-knit communities, multi-generational oral transmission of a specific name (Rinez) often has higher fidelity regarding *identity* than a newspaper editor guessing at spelling. Dana is right to ask for convergence, but wrong to assume the archive is the superior converging partner by default.

  **Move 4 (Marcus): Function vs. Accuracy (Halbwachs).**
  Marcus argues memory's function is selection of what matters, not fact storage, and forcing history to dictate identity is a category error.
  *   **Rating:** **Mostly Right.**
  *   **Why:** Marcus is philosophically sound regarding the *function* of collective memory (it sustains cohesion). However, he overextends this to protect factual claims on public monuments. A ritual can sustain identity through myth; a plaque in a town square makes a civic claim about reality. Marcus is right that the town shouldn't reorganize its *identity* solely around forensic history, but wrong to imply that public factual claims are immune to forensic correction.

  **Move 5 (Dana): The Plaque as Factual Claim.**
  Dana argues that a plaque is a public factual claim, not a ritual, and "different functions" is a license to flatter. Marcus concedes by admitting he needs the archival fragment to win.
  *   **Rating:** **Clearly Right.**
  *   **Why:** This is the checkmate. A plaque is not a poem; it is a database entry in stone. If you inscribe a name, you are making a truth claim. Marcus's inability to name a case where memory beats the archive *without* archival confirmation reveals that even he knows memory alone cannot sustain a factual claim in the public square. Dana correctly identifies that "social utility" cannot override "verifiability" on public infrastructure.

  ---

  ### The General Question

  **When a community's memory and the record conflict, which should give way?**

  **The Record must give way on *narrative*, but Memory must give way on *fact*—unless the Record is shown to be systematically biased, in which case Corroborated Memory becomes the Record.**

  In your specific case (Millhaven), the answer is plain: **Revise the plaque.**

  Dana is right that the plaque must reflect the truth. Marcus is right that the "truth" was obscured by archival bias. The convergence of the Reyes family oral history *and* the archival fragment (the single line about Rinez) creates a higher probability of truth than the established plaque tradition (which has no archival support for the rescue claim).

  **Does the answer change depending on the stakes?**
  Yes.
  *   **For a Ritual (e.g., an annual play, a song):** Memory wins. The function is cohesion and identity. If the town sings a song about Harlan's bravery, it does not need to be forensically accurate to serve its purpose of building community spirit.
  *   **For a Plaque (e.g., a historical marker):** Fact wins. A plaque is a pedagogical tool and a permanent claim on reality. To leave a known falsehood on a public monument is an active act of misinformation, regardless of how comforting the lie is.

  ### What Both Are Missing

  The distinction neither Dana nor Marcus draws explicitly is between **Verification** and **Vindication**.

  *   **Dana** is arguing for **Verification**: "Is the claim empirically supported?"
  *   **Marcus** is arguing for **Vindication**: "Does this recognition repair a historical wrong?"

  They are talking past each other because they view the plaque as either a **Database Entry** (Dana) or a **Covenant** (Marcus). They are missing that the plaque is actually a **Site of Restorative Justice**.

  If you treat this only as Verification (Dana), you risk coldly erasing a community's self-conception without acknowledging *why* the error existed. If you treat this only as Vindication (Marcus), you risk replacing one myth with another, undermining the integrity of history.

  **The Solution:**
  The town should revise the plaque, but the text must explicitly acknowledge the correction. It should not simply swap "Harlan" for "Rinez." It should read something like: *"In 1907, schoolteacher A. Rinez led boat rescues during the flood. For a century, local tradition credited founder Josiah Harlan, but archival records and family testimony confirm Rinez's role."*

  This satisfies Dana (the fact is corrected), satisfies Marcus (the bias is acknowledged and the marginalized figure is vindicated), and resolves the conflict by turning the plaque from a static claim of fact into a dynamic record of the town's own epistemic growth.

  **Verdict:** Update the map, but annotate the error. The archive wins on the name, but the memory wins on the context.
