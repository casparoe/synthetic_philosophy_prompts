answer: |-
  The kitchen smelled of stale champagne and lilies. Maya was stacking dishwasher racks; Ruth sat at the table, peeling the label off a wine bottle.

  "Uncle Jerry spent four thousand on the centerpieces," Ruth said. "Did you see the receipts on the counter?"

  "I saw," Maya said. She didn't turn around. "That's roughly four hundred bednets. Or a year of schooling for ten kids."

  "See, that's what I mean." Ruth tapped the bottle. "You walk around calculating the cost of the flowers in human lives. And now you give away the raise? Maya, you're not upgrading the apartment. You're living in a shoebox."

  "It's a perfectly functional shoebox."

  "It's a moral straitjacket." Ruth leaned forward. "I get the impulse. I do. But there's a point where a moral theory stops guiding your life and starts evicting you from it. If the price of being good is that you don't get to have a life… maybe the theory is too expensive."

  Maya turned, leaning against the counter. "We don't say that about other rules. Nobody says, 'Sure, don't murder, but only if it doesn't interfere too much with your schedule.' We accept unlimited demands there. Why is 'don't let people die when you could save them' the one rule that gets a convenience cap?"

  "Because killing is active," Ruth said. "This is… omission. And there's a difference in weight."

  "Is there? Or does it just feel heavier because you're measuring it against a baseline of comfort that's historically absurd?" Maya walked over and pulled out a chair. "You think I'm sacrificing something essential. I think I'm shedding weight."

  "Okay, but wait." Ruth rubbed her temples. "I think I'm conflating two things. Help me untangle this." She held up a finger. "Complaint one: The sheer volume. It's too much to ask any human to carry. It breaks the agent." She held up a second finger. "Complaint two: Fairness. Why you? Why us? Jerry's drunk in the den, and you're auditing your charity spreadsheet. It's not fair that the conscientious ones carry the whole load."

  Maya nodded slowly. "Okay. Two threads."

  "Right. If it's just volume… okay, maybe I'm weak. But if it's fairness, then your utilitarianism has a blind spot. You're letting the rest of us off the hook by working yourself to the bone. It enables us."

  "If I stop giving," Maya said, "the kids don't get the nets because Jerry stepped up. They just don't get the nets."

  "That's the martyr talk!" Ruth snapped. "But look—try the volume argument again. Even if everyone gave, you'd still be giving more than feels human. You're saying the *rule* is maximize, but you don't actually live like you're maximizing every second. You drink tea. You talk to me. So you admit there's a limit."

  "I distinguish criteria from procedures," Maya said. "The right action is what maximizes good. But if I try to calculate that every second, I'll burn out and give less. So I use heuristics. Give ten percent. Sleep eight hours. It's the map versus the itinerary. I need a life to be an effective agent."

  "Ah." Ruth smiled, tired. "There it is. The instrumental value of rest." She paused, tracing the condensation on the bottle. "But here's where you're borrowing from the enemy camp, May. You're drawing a boundary around 'Maya.' You're saying this life gets protected space."

  "Because it's useful."

  "Is it? Or is it because deep down you know persons are separate?" Ruth's voice softened. "Your theory says everyone counts equally. One unit of happiness for Maya equals one unit for a stranger. But when I push you on the sacrifice, you defend your own projects like they matter *more* than the stranger's need. You're using a non-utilitarian distinction—the separateness of persons—to cap a utilitarian demand. You want the engine of impartiality, but the brakes of egoism."

  Maya went quiet. She picked at a loose thread on her sweater. The hum of the refrigerator filled the silence.

  "That's… a fair hit," Maya said. "I am relying on a distinction my theory officially dissolves."

  "So you admit it's unstable?"

  "No. I admit it's tension." Maya looked up. "But here's what you can't wave off, Ruth. If you say the demand is too high because it conflicts with your 'life of your own'… you have to justify why that life is sacred. You're defending a baseline of comfort—apartments, weddings, wine—that was built on luck. If the moral truth is that everyone matters, then your feeling that this is 'too much' is just a habit. It's nostalgia for a world where you didn't know better."

  Ruth flinched. Just slightly.

  "I'm not saying you're bad," Maya continued. "I'm saying the discomfort you feel? That's the friction of the truth rubbing against privilege. If I stop giving, I don't solve the fairness problem. I just join you in the dark."

  Ruth looked at her sister. Really looked at her. She saw the exhaustion behind the precision, the way Maya's hand trembled slightly around her tea mug.

  "Maybe," Ruth said quietly. "Or maybe morality isn't just about the output. It's about the relationship between the agent and the act. If you erase yourself completely, who's left to do the good? Just a vessel." She reached across the table and covered Maya's hand. "I don't want you to be a vessel. I want you to be my sister. And sisters drink wine at two in the morning."

  Maya turned her hand over, squeezing Ruth's fingers. "I can't drink. I have a meeting with the foundation at eight."

  "Of course you do." Ruth sighed, but she didn't let go. "Pour me some water, then. And tell me about the spreadsheet. But leave out the bednet conversion rates. Please."

  Maya smiled, a small, genuine thing. "I'll try."

  She reached for the pitcher. The kitchen was still messy, the wedding still expensive, the world still burning. But for the moment, the table held.
