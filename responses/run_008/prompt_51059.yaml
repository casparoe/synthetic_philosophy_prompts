answer: |-
  "You're telling me," Theo said, closing his notebook with a snap, "that according to your logic textbook, 'If the moon is made of cheese, then pigs fly' is actually true?"

  Maya shrugged, shoving her pens into her bag. "Technically, yes. The antecedent is false, so the whole conditional is true. It's the material conditional. It's clean."

  "Clean? It's insane," Theo countered. "Look, take a normal sentence. 'If the tickets are cheap, I'll go to the concert.' You're saying that's true just because the tickets aren't cheap? That doesn't capture what I *mean*."

  "It captures the truth conditions," Maya insisted. "In formal logic, we need statements to be either true or false. Your version is too messy. If we treat 'if' as conditional probability, you lose truth values entirely. You can't build a proof system on 'kinda true'."

  "But that's exactly what 'if' is!" Theo leaned forward. "When I say 'If tickets are cheap, I'll go,' I'm expressing how likely my going is, *given* cheap tickets. It's not a fact about the world waiting to be verified; it's a constraint on my beliefs. That's why the cheese thing feels wrong. My confidence in pigs flying doesn't skyrocket just because the moon isn't cheese."

  Maya sighed. "Okay, but you can't have it both ways, Theo. You want conditionals to have truth conditions *and* you want their probability to equal the conditional probability. David Lewis proved you can't."

  Theo grinned. "I was waiting for you to bring up Lewis."

  "Seriously, think about it," Maya said, ticking points off on her fingers. "If you insist that 'If P then Q' has a standard truth value, and you also insist that the probability of 'If P then Q' always equals the probability of Q given P, Lewis showed you end up proving that the probability of Q given P is just the probability of Q. Period."

  "Basically," Theo nodded. "It implies P and Q are independent. So 'If it rains, the ground gets wet' would mean rain has no effect on wetness. That's triviality. It destroys the connection between antecedent and consequent."

  "Exactly," Maya said. "So since we know conditionals *aren't* trivial, one of your assumptions has to go. I'm keeping truth conditions. You're the one trying to force probability onto a truth-conditional structure."

  "But people treat conditionals as true or false all the time!" Theo argued. "If the tickets were cheap and I didn't go, you'd call me a liar. You'd say my statement was false, not 'low assertibility.' If conditionals aren't truth-apt, why do we negate them? Why do we say 'That's not true'?"

  Maya paused, tapping her pen. "Because pragmatics mimics semantics. Look, I'll bite the bullet. The material conditional is the semantic core. It defines the literal truth conditions. But you're right that we don't *use* it that way. When we assert 'If P then Q,' we aren't just stating a truth function; we're suggesting a connection. That's where your probability intuition comes in. It's not the truth condition; it's the rule for *assertibility*."

  "So you're saying the probability link is real, but it's not about truth?" Theo asked.

  "I'm saying it's about when it's appropriate to speak," Maya replied. "It's highly assertible when the conditional probability is high, even if the material conditional is technically true whenever the antecedent is false. Lewis's result only kills the view that probability *equals* truth probability. It doesn't kill the view that probability governs usage."

  Theo leaned back, looking unconvinced but thoughtful. "That feels like a workaround. You're saving the logic by pushing the meaning into the pragmatics. But then logic stops explaining how we actually reason. If I say 'If it rains, I'll bring an umbrella,' and it doesn't rain, logic says I told the truth. But intuitively, I haven't really said anything yet. The statement is void."

  "Void isn't false," Maya shot back. "But if we make it void, we break modus ponens. We need the statement to have a value to plug into the machine. I'd rather keep the machine working and admit human language is imperfect than break the machine to fit the language."

  "And I'd rather explain the language and admit the machine is too simple," Theo said. "You're protecting the system; I'm protecting the intuition."

  "Maybe," Maya said, slinging her bag over her shoulder. "But at least my system doesn't imply rain doesn't make things wet."

  "And at least mine doesn't imply cheese moons make pigs fly," Theo countered, standing up.

  "Coffee?" Maya asked.

  "Only if the shop is open," Theo said. "Otherwise, logically, I'll go anyway."

  Maya laughed. "See? Material conditional."

  "Or just a promise," Theo replied, holding the door.
