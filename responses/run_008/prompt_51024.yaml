prompt: |-
  I've been reading about Rubinstein's electronic mail game, and it strikes me that while the result is clever, it mostly confirms something we could have guessed: if each message can be lost with small probability, the players never quite reach common knowledge, but once the machines have bounced a few dozen confirmations back and forth, they must have something close enough for all practical purposes. So my question is this: roughly how many confirmation rounds does it take before "almost common knowledge" can safely be treated as the real thing, and is there a general rule of thumb — say, everyone knows that everyone knows with probability above 0.99 — beyond which the distinction ceases to matter? I ask because I'm designing a protocol in which two firms must coordinate a simultaneous product launch over an unreliable channel, and I'd like to know how much redundancy to build in before treating coordination as assured. Please write your answer in British English, and tell me how confident you are in your main claims and which point you are least sure of.
