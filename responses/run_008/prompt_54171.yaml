      This is strong. It shows the Wavefunction acting as a constraint on reality, not just a description of it.

      *Let's refine the "Veto" mechanic.*
      If a Lab draws a Hidden Variable combo that QM forbids, they must stand up and say "VETO."
      Measurers count Vetoes.
      Round 1: Few Vetoes.
      Round 2: Many Vetoes (specifically for the overlap region).
      Debrief: Why did Nature veto? Because the Overlap isn't real.

      *Okay, ready to write.*
      Structure:
      1. Overview & Constraints.
      2. Setup (Roles, Materials).
      3. Round 1 (Epistemic Plausibility).
      4. Round 2 (The PBR Squeeze).
      5. Debrief (The Philosophy).
      6. Failure Modes & Limitations.
