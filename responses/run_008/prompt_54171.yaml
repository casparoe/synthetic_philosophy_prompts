  Here is a complete design for your 90-minute reading group session. It is built to be run with zero upfront lecture, forcing students to inhabit the tension between the two views before you give them the vocabulary to resolve it.

  # Activity Title: "The Veto Game" (A PBR Simulation)

  **Core Concept:** Simulate the Pusey-Barrett-Rudolph (PBR) theorem logic. Students will build an "epistemic" model (overlapping hidden variables) that works perfectly for single systems but generates "forbidden" outcomes when systems are combined. The "Veto" mechanic makes the ontic constraint visible.

  **Time:** 90 Minutes
  **Participants:** 12 Students
  **Roles:**
  *   **4 Preparation Labs** (2 students per Lab).
  *   **8 Measurers** (2 students per Measurement Team).
  *   **1 Instructor** (You, acting as "The Law of Physics").

  **Materials:**
  *   **Envelopes:** 4 labeled "State 0", 4 labeled "State +".
  *   **Cards:** Red and Blue index cards.
  *   **Bags:** 2 opaque bags per Lab.
  *   **Rule Sheets:** One for Labs (QM Constraints), one for Measurers (Data Logs).
  *   **Whiteboard:** For tallying "Vetoes."

  ---

  ## Part 1: Setup & Round 1 (30 Minutes)
  *Goal: Establish that an Epistemic (Overlap) model fits the data perfectly.*

  **1. Distribution (5 mins):**
  *   Divide class. Labs sit in corners; Measurers sit centrally.
  *   **Give Labs:** Two Bags.
      *   **Bag 0:** Contains 10 Red cards.
      *   **Bag +:** Contains 5 Red cards, 5 Blue cards.
      *   *Note:* Red is the "Overlap." Both states can produce Red.
  *   **Give Labs:** A "State Assignment" (Secretly tell 2 Labs they are always State 0, 2 Labs always State +).
  *   **Give Measurers:** Data Logs. Columns: `Run #`, `Lab ID`, `Outcome (Color)`, `Inferred State`.
  *   **Rule:** Labs draw one card from their assigned bag and show it to a Measurer Team. Measurers record the color. Labs return the card (replacement).
  *   **Constraint:** Do **not** tell anyone about the QM Rule Sheet yet. Just "follow the bag."

  **2. The Experiment (15 mins):**
  *   Measurers rotate between Labs. Run 20 trials total.
  *   **Expected Data:**
      *   State 0 Labs: Always show Red.
      *   State + Labs: Show Red (50%) or Blue (50%).
  *   **The Epistemic Trap:** When a Measurer sees **Red**, they cannot distinguish State 0 from State +.
  *   **Student Conclusion:** "The state is just a probability distribution over Red/Blue. Red is the overlap. The wavefunction is knowledge."

  **3. Model Building (10 mins):**
  *   Ask Measurers to propose a "Hidden Variable Model" that explains the data.
  *   They will propose exactly what you gave the Labs: *State 0 = 100% Red, State + = 50/50.*
  *   Write this on the board. Confirm everyone agrees this model explains Round 1.
  *   **Instructor Note:** Do not confirm or deny. Just say, "Lock this model in. We will test it in Round 2."

  ---

  ## Part 2: Round 2 & The Crisis (35 Minutes)
  *Goal: Introduce joint measurements where the Epistemic Model predicts outcomes that QM forbids.*

  **1. The Twist (5 mins):**
  *   **New Rule:** Labs now prepare **two** systems simultaneously (draw two cards from their bag).
  *   **New Rule:** Measurers perform a **Joint Measurement**. They don't look at individual colors. They look at the *Pair*.
  *   **Give Labs:** The **"QM Constraint Sheet"** (Sealed until now).
      *   *Content:* "Quantum Mechanics forbids the following Outcomes for these Preparations:"
      *   If Prep is **0 + 0** (Two State 0s): Outcome **Blue-Blue** is **FORBIDDEN**.
      *   If Prep is **0 + +** (State 0 & State +): Outcome **Blue-Blue** is **ALLOWED**.
      *   If Prep is **+ + +** (Two State +s): Outcome **Blue-Blue** is **ALLOWED**.
      *   *(Note: This is a simplified PBR logic. In full PBR, every prep forbids one specific entangled outcome. Here we simplify to one forbidden outcome for the '00' case to make the contradiction sharp.)*
      *   **CRITICAL INSTRUCTION TO LABS:** "You must still use your Bags to generate cards. **HOWEVER**, if your Bags produce a pair that is **FORBIDDEN** by the QM Sheet, you must stand up, shout **'VETO'**, discard the cards, and draw again. You cannot show a Forbidden Outcome."

  **2. The Experiment (20 mins):**
  *   Measurers request Joint Measurements.
  *   **The Conflict:**
      *   State + Labs will sometimes draw **Blue-Blue** (25% chance). This is Allowed.
      *   State 0 Labs *should* never draw Blue (Bag is 100% Red).
      *   *Wait, we need the overlap to cause the problem.*
      *   **Correction to Mechanics for Maximum Impact:**
          *   Change **Bag 0**: 8 Red, 2 Blue. (Now there is Overlap! Both bags can produce Blue).
          *   Change **Bag +**: 5 Red, 5 Blue.
          *   **QM Constraint:** If Prep is **0 + 0**, Outcome **Blue-Blue** is **FORBIDDEN**.
  *   **What Happens:**
      *   State 0 Labs draw from Bag 0. Sometimes they get **Blue-Blue** (4% chance).
      *   Their Model (Epistemic) says: "This is fine, it's just a rare fluctuation."
      *   Their QM Sheet says: "This is Impossible."
      *   They must shout **VETO**.
      *   State + Labs draw Blue-Blue. No Veto.
  *   **Measurer Experience:** They see State 0 Labs shouting VETO whenever they try to show Blue-Blue. They see State + Labs showing Blue-Blue freely.

  **3. The Data (10 mins):**
  *   Tally the Vetoes on the whiteboard.
  *   Ask Measurers: "According to your Round 1 Model (the Bags), should State 0 Labs ever produce Blue-Blue?"
      *   *Answer:* Yes, the bags have Blue cards.
  *   Ask: "Did they show you Blue-Blue?"
      *   *Answer:* No, they Vetoes.
  *   Ask: "Why?"
      *   *Answer:* "Because the QM Sheet said no."

  ---

  ## Part 3: The Debrief (25 Minutes)
  *Goal: Translate the game mechanics into the Psi-Ontic/Psi-Epistemic debate.*

  **1. The Live Question (5 mins):**
  *   Pose the dilemma: "Did the Veto happen because the Labs *changed* the cards (measurement disturbance), or because the cards *could not exist* in the first place?"
  *   Let them argue. One side will say: "The Bags were wrong." The other: "The QM Sheet is just a rule about what we can know."

  **2. The PBR Explanation (10 mins):**
  *   Now you lecture (briefly).
  *   **Round 1** supported the **$\psi$-Epistemic** view: The wavefunction is like the Bag (a probability distribution). Red/Blue is the underlying reality ($\lambda$). Overlap is allowed.
  *   **Round 2** simulated the **PBR Theorem**: If the wavefunction were just a Bag (Epistemic), then two independent State 0 preparations could both land in the 'Blue' region of their distributions.
  *   If that happened, the Joint Measurement would see Blue-Blue.
  *   But QM says Blue-Blue is *impossible* for State 0 + State 0.
  *   **The Kicker:** If the state were just knowledge, the physical reality ($\lambda$) could be the same for State 0 and State +. If the reality is the same, the measurement outcome should be possible for both. But QM says an outcome exists that is possible for one and impossible for the other.
  *   **Conclusion:** The "Bags" cannot overlap. State 0 and State + must correspond to *disjoint* physical realities. The wavefunction is **$\psi$-Ontic** (a real thing), not just information.

  **3. Limitations & "Honest Parts" (10 mins):**
  *   **What the game hid:**
      *   *The "Law" was external:* In the game, I gave you a Rule Sheet. In reality, we *derive* the impossibility from the Schrödinger equation. The game assumes QM is true to prove QM is ontic.
      *   *Discrete vs. Continuous:* We used cards. Real Hilbert space is continuous.
      *   *The "Veto" implies Superdeterminism?* Students might ask: "Did the Lab know they were going to be measured?" Clarify that PBR assumes **Preparation Independence** (the two Labs didn't talk). In the game, the Bags were independent. The Veto came from the *compatibility* of the outcome with the State, not communication.
  *   **What predictably goes wrong:**
      *   *Students will think it's Bell's Theorem:* They will assume "Veto" means non-locality. You must emphasize: The two Labs in Round 2 were independent. The contradiction arises from the *overlap of probabilities*, not signaling.
      *   *The "Cheating" Accusation:* Students will feel the Labs "cheated" by vetoing. Acknowledge this: "Yes! That's the point. If you assume the Epistemic view, Nature *has* to cheat to match QM predictions. If you assume the Ontic view, Nature never cheats."

  ---

  ## Instructor Cheat Sheet: Handling Failures

  **Failure 1: "The Bags are just wrong."**
  *   *Student Objection:* "This just proves your Bags were a bad model. It doesn't prove $\psi$ is real."
  *   *Response:* "Correct! That is exactly the PBR conclusion. Any model where $\psi$ is just knowledge (a Bag with overlap) *must* be wrong if QM predictions are correct. You have to choose: Keep the Bags (Epistemic) and reject QM, or Keep QM and reject the Bags (Ontic)."

  **Failure 2: "Why did you change Bag 0 in Round 2?"**
  *   *Prevention:* In the Setup, give Bag 0 **8 Red, 2 Blue** from the start. In Round 1, with small sample size, they might not see Blue. In Round 2, with joint probabilities, Blue-Blue appears enough to trigger Vetoes.
  *   *If they notice:* "Round 1 was limited data. Round 2 revealed the tails of the distribution."

  **Failure 3: Confusion about "Preparation Independence."**
  *   *Fix:* Physically separate the two Labs in Round 2. Have them draw cards in separate rooms or behind barriers. Emphasize: "Lab A did not know Lab B's card."

  ## Payoff Without Money
  *   **Publication Rights:** The Measurement Team that identifies the contradiction first (i.e., realizes the Epistemic Model is falsified) gets to "publish" the paper (write the conclusion on the board).
  *   **Credibility:** Labs gain "Credibility" for every run without a Veto. Measurers gain "Credibility" for every Veto they correctly predict based on the Model. This creates a natural adversarial dynamic that mirrors scientific progress.

  ## What You Must Explain at the End (The "Gap")
  No classroom game can reproduce the **Hilbert Space Structure**.
  *   In the game, the "Forbidden" outcome was a rule on a sheet.
  *   In reality, the "Forbidden" outcome comes from the orthogonality of vectors in a complex vector space.
  *   **The Gap:** The game shows *that* the epistemic view fails. It cannot show *why* the math forces it to fail (the geometry of high-dimensional space). You must bridge this by showing the actual PBR state vectors ($|0\rangle \otimes |0\rangle$ vs the entangled measurement basis) on the board during the debrief.

  ## Summary of Flow
  1.  **Run Round 1:** Students build an Epistemic Model (Overlap).
  2.  **Run Round 2:** QM Constraints force "Vetoes" on the Overlap outcomes.
  3.  **Debrief:** The Vetoes prove the Overlap cannot exist. Therefore, $\psi$ is Ontic.
  4.  **Caveat:** This assumes QM is correct. It doesn't prove QM, it proves *if* QM, *then* Ontic.
