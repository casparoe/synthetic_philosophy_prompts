answer: |-
  Your hypothesis is astute. The stalemate in the "equality of what?" debate is not merely a failure of imagination or argumentative rigor; it is structural. The debate has persisted for forty years not because the participants are stubborn, but because the framing of the question conceals a category error and conflates two distinct normative anxieties.

  Here is the diagnosis of the disagreement, an analysis of what is actually doing the work in each camp, and an assessment of what could constitute progress.

  ### 1. Diagnosis: Conflated Questions and a Category Error

  The debate is neither purely substantive nor purely verbal. It is a case of **two distinct normative questions traveling under one heading**, compounded by a **metaphorical category error**.

  **The Conflation:**
  The question "Equality of What?" smuggles together two separate inquiries that do not necessarily share a single answer:
  1.  **The Ontological Question:** What constitutes human advantage? (Is it feeling good, having things, or doing things?)
  2.  **The Responsibility Question:** To what extent should distribution compensate for bad luck versus respecting choice?

  Resource egalitarians (Dworkin) prioritize the Responsibility Question. They are willing to sacrifice ontological precision (ignoring that resources convert differently) to preserve a clean boundary between the person and their circumstances. Welfare egalitarians prioritize the Ontological Question (matching distribution to actual experience) but struggle to draw the Responsibility boundary (the "expensive tastes" problem). The Capability Approach attempts to solve the Ontological Question but often leaves the Responsibility Question ambiguous (do we equalize capabilities or functionings?).

  Because each camp privileges one question over the other, they talk past one another. When a resource theorist says, "We must respect choice," the welfare theorist hears, "We should ignore suffering." When a welfare theorist says, "We must alleviate suffering," the resource theorist hears, "We should subsidize bad choices."

  **The Category Error:**
  Your suspicion that "currency" is ill-posed is correct. The metaphor of "currency" implies **commensurability** and **fungibility**. It suggests there is a single scalar good that can be transferred or equalized.
  *   If human well-being is pluralistic (as Sen and Nussbaum argue), there is no single currency. There are only distinct dimensions (health, affiliation, play, practical reason).
  *   If dimensions are incommensurable, you cannot "equalize" them simultaneously. You can only prioritize or satisfice.
  *   Therefore, the search for *the* currency is a search for a monistic metric in a pluralistic world. The debate stalls because the participants are trying to solve a multi-variable optimization problem with a single-variable equation.

  ### 2. What Is Doing the Work? (The Engines of the Camps)

  If the metric is not the real engine, what is? Each camp is driven by a specific foundational intuition about the moral status of the person.

  *   **Welfare Egalitarians:** The engine is **Phenomenological Sovereignty**.
      *   *Core Intuition:* The only place where injustice is truly *felt* is in consciousness. If two people have equal resources but one is in agony and the other is not, justice has not been done.
      *   *Function:* The metric is designed to track the *moral weight of suffering and joy*.
      *   *Blind Spot:* It risks treating people as "locations of experience" rather than agents, making it vulnerable to the "noisy happy fool" or "deformed preference" objections.

  *   **Resource Egalitarians (Dworkin):** The engine is **Agency and Separateness**.
      *   *Core Intuition:* People are distinct authors of their lives. To equalize outcomes is to insult their agency by treating their choices as misfortunes to be compensated.
      *   *Function:* The metric is designed to protect the *boundary between the self and the world*.
      *   *Blind Spot:* It treats "resources" as neutral, ignoring that the "self" is not a sovereign island but is constituted by its physical and social context (the disability objection).

  *   **Capability Theorists (Sen/Nussbaum):** The engine is **Substantive Freedom**.
      *   *Core Intuition:* Freedom is not just what you have (resources) or how you feel (welfare), but what you can actually *do*. It is the bridge between the internal and external.
      *   *Function:* The metric is designed to capture *human dignity and functioning*.
      *   *Blind Spot:* It lacks a clear principle for trade-offs between capabilities and struggles to define the line between capability (opportunity) and functioning (outcome) without collapsing back into welfare or resources.

  ### 3. What Would Count as Progress?

  Given this diagnosis, a thought experiment or formal result will not resolve the debate. Thought experiments (like the "expensive tastes" case) have already been exhausted because each camp interprets the *moral significance* of the example differently, not the facts of the example. Formal results fail because the disagreement is normative, not logical.

  Progress can only come in two forms: **Reformulation** or **Acknowledged Convergence**.

  **A. Reformulated Question (The Most Likely Path)**
  The debate has already begun to dissolve into more productive frameworks that bypass the "currency" trap.
  *   **Relational Equality:** Scholars like Elizabeth Anderson argued that the focus on "distributive currency" is misguided. The real question is not "who has how much?" but "are people relating to one another as equals?" This shifts the focus from metric to social structure.
  *   **Sufficientarianism/Prioritarianism:** Moving away from *equality* (which is comparative) to *sufficiency* (which is absolute). If the goal is to ensure everyone has enough capabilities/resources/welfare to function as a citizen, the need to find a single commensurable currency diminishes.
  *   **Democratic Capabilities:** Sen's later work moved away from identifying a perfect "currency" toward a comparative framework driven by public reasoning. The "currency" is decided democratically, not philosophically.

  **B. Masked Convergence (The Professional Reality)**
  There is significant evidence that the camps have converged substantively while maintaining rhetorical distance.
  *   Dworkin's "hypothetical insurance market" is functionally very similar to a capability floor; it ensures people have the means to pursue their own conception of the good despite bad luck.
  *   Capability theorists often use resource proxies (income, education) because measuring capabilities directly is too difficult.
  *   Welfare economists now incorporate "adaptive preferences" (a capability concept) into utility models.

  **Why the stalemate persists:**
  Partisans are professionally disinclined to acknowledge this convergence. Disciplinary identity in philosophy relies on distinction. To admit that "Resource Egalitarianism with an insurance scheme" yields roughly the same policy prescriptions as "Basic Capability Thresholds" would render the forty-year debate anticlimactic.

  ### 4. Conclusion: Bedrock Intuitions vs. Dissolution

  Does the dispute bottom out in bedrock intuitions? **Yes.**

  The disagreement ultimately rests on a tension between two irreconcilable ideals:
  1.  **The Ideal of Neutrality:** The state should not judge the value of different life plans (favors Resources).
  2.  **The Ideal of Human Flourishing:** The state should ensure people can actually live good lives, which requires judging what constitutes a "good life" (favors Capabilities/Welfare).

  You cannot logically prove one of these ideals superior to the other because they are the axioms from which logic proceeds in this domain.

  **Verdict:**
  The debate is **ill-posed**. It asks for a monistic solution ("the currency") to a pluralistic problem ("human advantage") while conflating ontology with responsibility.

  **Progress** will not come from winning the argument. It will come from:
  1.  **Abandoning the search for a single currency** in favor of dashboard metrics (pluralistic indicators).
  2.  **Shifting from "Equality of What?" to "Equality for What?"** (i.e., specifying the *purpose* of equality, such as democratic citizenship, which then dictates the necessary mix of resources and capabilities).
  3.  **Acknowledging that the "metric" is political, not philosophical.** As Sen himself suggested in *The Idea of Justice*, the selection of capabilities is a matter of public reasoning, not transcendental philosophy.

  The debate hasn't stalled; it has outgrown its container. The "currency" question was a necessary heuristic to start the conversation, but it is now a constraint preventing the synthesis that has already occurred in practice.
