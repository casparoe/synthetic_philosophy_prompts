prompt: |-
  I teach a mixed bunch of sixth formers at a state school in Leeds (15 of them, Year 12, doing classical civilisation, and we can get two 45-minute sessions in the same week) and this term we're on Athenian democracy's car-crash moments. Rather than just lecturing on the Mytilene affair, I want them to actually live through it, and I'm hoping you can design the whole thing. Quick recap in case it helps you get the setting right: in 428/427 BC Mytilene revolted against Athens with Spartan backing, the Athenian assembly voted to execute the entire male population and enslave the women and children, a trireme was dispatched to carry it out, and then a second assembly was held the next day and reversed the decision — a second ship had to be rowed flat out to overtake the first. Thucydides gives us both speeches from the second debate: Cleon arguing that harshness is what imperial security requires, and Diodotus, whose move I find most interesting — he explicitly refuses to argue from mercy, and instead attacks the *procedures* of the debate itself, pointing out that a city which puts speakers under suspicion when they advocate for the defeated will end up hearing only bad arguments.

  Here's my problem: my students are nice kids. If I just say "you're the Athenian assembly, vote," they'll vote mercifully on day one and there's no drama, no reversal, nothing to debrief. So the first assembly has to actually go harsh — I need engineered incentives, not hope. Maybe role cards with private interests (generals terrified of looking soft on revolts, families who lost people or money, allies' representatives watching, a few genuine moderates), maybe some payoff scheme that doesn't involve real money, maybe rules about speaking time or who's allowed to speak when. Then in the second session, one or two students need the Diodotus role — the job of flipping the majority not by appealing to compassion but by reframing the question and gaming the procedure, and I want the class to viscerally feel that the same facts plus a different framing turned a bloodthirsty majority around.

  So please design: the setup, the role cards, the voting mechanics across both sessions, the payoffs, and a debrief that maps what actually happened onto the institutional failure modes of direct democracy — deciding irreversible policy in one afternoon, emotional momentum, speakers' incentives to outbid each other, the way accountability after the fact (people being punished for their speeches, which is what happened after Arginusae) makes deliberation worse. Then a short extension showing how the same machinery explains the enthusiasm for the Sicilian expedition or the vote to execute Socrates. Also be honest about what a classroom version can't possibly reproduce — the real stakes, the plague, the genuine fear of losing the empire — and tell me what will predictably go wrong the first time I run it (I'm braced for one kid grandstanding as Cleon for laughs, and for the second debate collapsing into modern moralising about how obviously slavery is bad, which rather misses the point). Oh, and could you write the whole thing up in American English? My TA is American and she'll be adapting it for her own class, so I don't want her having to translate. Sorry for the long brief, and thankyou in advance!
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Year 12 (16-17 years old), State School, Leeds, UK (but output in American English for a US TA). Class size: 15 students. Subject: Classical Civilisation.
      *   **Topic:** Athenian Democracy's "Car-Crash Moments" (specifically the Mytilene Debate).
      *   **Format:** Two 45-minute sessions in the same week.
      *   **Goal:** Move beyond lecture to simulation. Students need to *experience* the shift from harshness (Day 1) to reversal (Day 2) via procedural reframing (Diodotus), not just moralizing.
      *   **Key Problem:** Students are "nice kids" and will likely vote mercifully immediately, ruining the historical tension. Need engineered incentives to force the harsh vote first.
      *   **Key Mechanics:** Role cards, voting mechanics, payoffs (non-monetary), speaking rules.
      *   **Key Learning Outcomes:** Institutional failure modes of direct democracy, emotional momentum, speaker incentives, accountability/fear (Arginusae parallel), extension to Sicilian Expedition/Socrates.
      *   **Constraints/Warnings:** Acknowledge limitations (real stakes, plague, fear). Predict potential failures (grandstanding Cleon, modern moralizing).
      *   **Language:** American English (for the TA).

  2.  **Deconstruct the Simulation Design:**
      *   *Session 1 (The Panic):* Needs to feel urgent, threatening, and emotional. The vote *must* go harsh. How? Give them information that suggests existential threat. Give roles that benefit from harshness (generals, allies who fear revolt). Limit time.
      *   *Session 2 (The Cool-Down/Reframe):* Needs to allow reflection. The "Diodotus" role needs specific tools to argue *against* the procedure, not just for mercy. The vote needs to be close enough to flip.
      *   *Incentives:* Since we can't use real money, use "Political Capital" or "Influence Points." If their faction wins, they get points. If the city "falls," everyone loses.
      *   *Roles:* Need a mix.
          *   *Cleon:* Aggressive, populist.
          *   *Diodotus:* Strategic, procedural.
          *   *Generals:* Fear looking weak.
          *   *Allies:* Fear their own revolts if Athens looks weak.
          *   *Merchants:* Want stability/trade.
          *   *Religious/Traditional:* Omens, piety.
          *   *Average Citizens:* Swing voters, tired of war.

  3.  **Drafting the Mechanics:**
      *   *Voting:* Secret ballot is historically accurate but hard to debrief. Public show of hands is better for pressure. Let's go with public voting to simulate peer pressure, but maybe a secret tally for the final count to avoid bullying. Actually, public voting fits the "shame" aspect of the Assembly better.
      *   *Payoffs:* "Athenian Stability Points." If the empire holds, points go up. If revolts spread, points go down.
      *   *The Twist:* In Session 1, hide the fact that a second vote is possible. Make it feel final. In Session 2, reveal the *graphē paranomōn* (indictment for illegal proposals) threat or simply the change in mood. Actually, historically, it was just a reconvening. Let's stick to the reconvening but change the *framing*.
      *   *Preventing Modern Moralizing:* Explicitly forbid arguments based on "human rights" or "modern morality." Arguments must be based on *Athenian interest* (security, money, reputation).

  4.  **Developing the Content (Session by Session):**

      *   **Session 1: The Rage.**
          *   Context: Revolt just crushed. News arrives.
          *   Atmosphere: Angry, fearful.
          *   Roles: Weighted towards punishment.
          *   Outcome: Vote for execution.
          *   Cliffhanger: The ship leaves.

      *   **Session 2: The Regret & Reframe.**
          *   Context: Overnight cool-down. Some doubt.
          *   Atmosphere: Calculating.
          *   Roles: Diodotus gets specific instructions on *how* to argue (utility vs. justice).
          *   Outcome: Vote to recall.
          *   Debrief: Connect to Thucydides.

  5.  **Addressing the "American English" Constraint:**
      *   Spellings: Color, favor, program, defense.
      *   Terminology: "Grade" instead of "Mark" (though it's A-Level, so keep "A-Level" but explain), "Classroom" instead of "Class."
      *   Tone: Professional but accessible US educational style.

  6.  **Addressing the "Predictable Failures":**
      *   *Grandstanding Cleon:* Give the Cleon role specific constraints (must use specific rhetoric) or assign it to a student who can handle it.
      *   *Modern Moralizing:* Create a "Rule of the Assembly" card that bans anachronistic arguments.
      *   *Too Nice:* Stack the deck in Session 1 with intel that suggests Mytilene planned a massacre of Athenians first (historically plausible fear).

  7.  **Refining the Debrief:**
      *   Connect to Arginusae (fear of punishment leads to bad decisions).
      *   Connect to Sicily (overconfidence/imperial overreach).
      *   Connect to Socrates (mob rule vs. law).
      *   Limitations: No real death, no plague, no Spartan army at the gates.

  8.  **Review against Constraints:**
      *   15 students? Yes, role cards need to fit 15.
      *   2 x 45 mins? Yes, timing needs to be tight.
      *   American English? Yes.
      *   Leeds State School context? Keep resources low-tech (printable cards).

  9.  **Final Polish:**
      *   Ensure the Diodotus argument is clear: It's not "be nice," it's "punishment doesn't work strategically."
      *   Make sure the TA notes are clear.
      *   Check the "Incentive" system. Let's use a simple "Empire Stability" meter on the board.

  *(Self-Correction during drafting)*: I initially thought about secret ballots. But the pressure of the *Pnyx* was public. I'll make the vote public to simulate social pressure. I need to make sure the "Nice Kids" problem is solved. I will add a "Secret Intel" packet for Session 1 that exaggerates the threat. In Session 2, the Intel changes or is re-interpreted.
  Actually, the best way to force the harsh vote is to make the *consequences of leniency* seem immediate and deadly in Session 1. In Session 2, Diodotus argues that leniency is actually *safer*.

  Let's organize the roles:
  1. Cleon (1)
  2. Diodotus (1)
  3. Generals/Strategoi (3) - Worried about reputation.
  4. Allies/Subject Cities Reps (3) - Watching to see if they can revolt.
  5. Merchants (3) - Want trade stability.
  6. Farmers (3) - Want security, hate war.
  7. Religious Officials (1) - Omens.
  Total: 15.

  Okay, let's write it.

  *(Language Check)*: Ensure "Year 12" is explained as "11th Grade/16-17 year olds" for the TA, but keep the UK context clear. Use "z" in organize/realize. Use "program".

  *(Final check on the Diodotus argument)*: Crucial point: Diodotus argues that if you punish the *people* and the *leaders* equally, the leaders will fight to the last man because they have nothing to lose. If you offer clemency to the people, they will turn on the leaders. This is the strategic argument. I must embed this in the Diodotus role card.

  *(Final check on limitations)*: Be honest that 45 minutes isn't enough for true deliberation and that the lack of real death sanitizes the choice.

  Let's assemble the response.cw
answer: |-
  # Simulation Plan: The Mytilene Debate
  **Subject:** Classical Civilisation (A-Level)
  **Topic:** Athenian Democracy & The Mytilene Affair (427 BC)
  **Time:** Two 45-minute sessions (same week)
  **Class Size:** 15 Students
  **Language:** American English (for TA adaptation)

  ---

  ## 1. Teacher Overview & Learning Objectives

  **The Goal:**
  Students often view the Mytilene Debate as a simple moral triumph (Cruelty vs. Mercy). This simulation forces them to experience it as Thucydides intended: a clash of *imperial strategy* and *procedural psychology*. By Session 1, they should vote for mass execution based on fear and security. By Session 2, they should reverse the vote not because they became "nicer," but because the *framing of the problem* changed.

  **Learning Objectives:**
  1.  Analyze the structural vulnerabilities of direct democracy (emotion, haste, speaker accountability).
  2.  Understand Diodotus's argument: Clemency is not moral; it is a tool of statecraft.
  3.  Evaluate the impact of fear and accountability on political decision-making (linking to Arginusae, Sicily, and Socrates).

  **The "Nice Kid" Problem:**
  To prevent an immediate merciful vote, Session 1 is engineered with "Secret Intel" that exaggerates the threat. Session 2 introduces the Diodotus mechanic, which rewards strategic thinking over moralizing.

  **Note for the TA:**
  While the context is a UK state school (Leeds, Year 12/A-Level), this document uses American English spelling and terminology (e.g., *program, organize, grade*) for your ease. The historical content remains rigorous.

  ---

  ## 2. Session 1: The Assembly of Rage (45 Minutes)

  **Setup:**
  Arrange desks in a semicircle (the *Pnyx*). Put a map of the Athenian Empire on the board. Mark Mytilene (Lesbos) in red.

  **The Narrative Hook (5 mins):**
  Tell the class: *"It is 427 BC. The Peloponnesian War is dragging on. The Plague killed a third of us recently. Sparta is at our borders. Now, Mytilene, a key ally, has revolted. They tried to hand our cities over to Sparta. We have crushed the revolt. The men are prisoners. The women and children are in custody. You are the Ecclesia (Assembly). You must decide their fate now."*

  **Role Distribution (5 mins):**
  Hand out the **Session 1 Role Cards** (see Appendix A).
  *   **Crucial Mechanic:** Do not tell them there will be a second vote. Make this feel final.
  *   **Crucial Mechanic:** Distribute "Secret Intel Slips" to specific roles (Generals, Allies) that suggest Mytilene planned to massacre Athenians living on Lesbos. This spikes the fear level.

  **The Debate (25 mins):**
  *   **Speaker Rules:** Only recognized speakers may stand. The *Strategoi* (Generals) and *Cleon* get priority.
  *   **Time Limit:** 2 minutes per speech. Use a visible timer.
  *   **Forbidden Arguments:** No arguments based on "Human Rights" or "Modern Morality." All arguments must be about *Athenian Security, Money, or Reputation.* (Write this on the board).
  *   **The Cleon Role:** The student playing Cleon is given a cheat sheet of rhetorical tricks (interrupt, question patriotism, demand speed).

  **The Vote (10 mins):**
  *   Public show of hands (simulates peer pressure).
  *   Tally the vote.
  *   **Outcome Goal:** You need a 2/3 majority for Execution. If it looks close, the *Priest* role announces an "ominous wind" (fabricated pressure) to push the waverers.
  *   **Closing:** Announce: *"The decree is passed. A trireme has been dispatched to carry out the execution. Class dismissed."* (Create tension).

  ---

  ## 3. Session 2: The Assembly of Regret (45 Minutes)

  **Setup:**
  Same room. Change the mood. Dim the lights slightly or play low ambient sound (sea/wind).

  **The Narrative Hook (5 mins):**
  *"It is the next day. The city has cooled down. People are talking in the markets. 'Was it too harsh?' 'Will other cities fight to the death if they know surrender means death?' A motion has been brought to reconsider the decree. A second trireme is being prepared to overtake the first. But if you reverse the decision, you look weak. If you keep it, you might be making a strategic error."*

  **Role Redistribution (5 mins):**
  *   Keep most roles the same.
  *   **The Diodotus Role:** Assign this to your most articulate student (or the one who played a moderate last time). Give them the **Diodotus Special Brief** (Appendix B). Their job is *not* to argue for mercy, but to argue that the *first debate was flawed* and that harshness is *strategically stupid*.
  *   **The Cleon Role:** Same student. They must argue that reversing the vote makes Athens look indecisive.

  **The Debate (25 mins):**
  *   **New Rule:** The *Diodotus* player is allowed to interrupt procedural points (e.g., "We are being rushed again!").
  *   **Incentive:** Tell the class: *"Your grade for this simulation depends on the 'Empire Stability Score.' If you execute Mytilene, other cities may revolt out of desperation (-5 Points). If you spare them but look weak, allies may defect (-5 Points). You must maximize stability."*
  *   **Key Shift:** Diodotus must convince them that sparing the common people will turn them *against* their oligarchic leaders, securing Athens' future control.

  **The Vote (10 mins):**
  *   Public vote again.
  *   **Goal:** A narrow reversal (e.g., Execution loses by 1 or 2 votes).
  *   **Closing:** *"The second trireme leaves. It arrives just in time. The wall is being built; the executioner is ready. They stop him."*

  **The Debrief (Remaining Time):**
  See Section 5.

  ---

  ## 4. Appendix: Role Cards & Materials

  ### General Rules (Print for everyone)
  1.  **No Modern Morality:** Do not say "killing is wrong." Say "killing is bad for Athens."
  2.  **Self-Interest:** Protect your faction's interests.
  3.  **Voting:** You must vote. Abstaining is not allowed.

  ### Role Cards (Session 1 & 2)

  **1. Cleon (The Demagogue)**
  *   **Goal:** Secure the Execution Vote (Session 1). Defend the Decree (Session 2).
  *   **Argument:** "Mercy looks like weakness. If we let them go, every ally will revolt. We are an empire, not a charity."
  *   **Special Power:** You can call for an immediate vote at any time if you think you have the majority.
  *   **Secret Intel:** You have political rivals. If you look soft on treason, they will exile you.

  **2. Diodotus (The Strategist) — *Only Active Session 2***
  *   **Goal:** Reverse the Execution Vote.
  *   **Argument:** Do NOT argue for mercy. Argue that the *debate process* is broken. Argue that if we punish everyone equally, future rebels will fight to the last man because surrender offers no safety.
  *   **Special Power:** You can force the class to pause and reflect on *how* they are deciding, not just *what* they are deciding.
  *   **Secret Intel:** You know the Mytilenean common people actually opposed the revolt. Killing them turns friends into enemies.

  **3. The Generals (3 Students)**
  *   **Goal:** Protect Athenian Military Security.
  *   **Session 1 Intel:** "Mytilene planned to kill all Athenians on Lesbos. If we don't punish them, our troops aren't safe." (Vote Execution).
  *   **Session 2 Intel:** "If every city fights to the death, our war will last forever. We need them to surrender quickly next time." (Lean toward Mercy).
  *   **Fear:** If the empire collapses, you are blamed.

  **4. Allied Representatives (3 Students)**
  *   **Goal:** Protect your own cities from Athenian anger.
  *   **Session 1:** "If Athens is weak, Sparta will invade us. Support Athens' strength." (Vote Execution).
  *   **Session 2:** "If Athens kills everyone, what happens when *we* make a mistake? We need a safety valve." (Lean toward Mercy).

  **5. Merchants (3 Students)**
  *   **Goal:** Profit and Trade Stability.
  *   **Argument:** War is bad for business. But chaos is worse.
  *   **Session 1:** "Punish the traitors so trade routes open safely."
  *   **Session 2:** "Dead cities don't pay tribute. Living cities pay taxes."

  **6. Farmers (3 Students)**
  *   **Goal:** Security of Attica.
  *   **Argument:** We suffer most when war drags on.
  *   **Session 1:** "Crush them quickly so the war ends."
  *   **Session 2:** "If they fight to the death, the war never ends."

  **7. Priest/Religious Official (1 Student)**
  *   **Goal:** Piety and Omens.
  *   **Session 1:** "The winds favor swift justice."
  *   **Session 2:** "Blood guilt stains the city. The gods dislike excessive slaughter."

  ---

  ## 5. The Debrief: Mapping the Crash (15 Minutes)

  *Do not let them leave without this.* Gather them in a circle. Drop the roles.

  **1. The Procedural Failure (Diodotus's Point)**
  *   *Ask:* "Why did the vote change? Did the facts change?"
  *   *Point:* The facts didn't change. The *frame* changed. In Session 1, you decided based on anger and immediate security. In Session 2, you decided based on long-term incentive structures.
  *   *Thucydides Quote:* Read Diodotus 3.42: *"We are not in a court of law... we are not deciding what is just, but what is expedient."*

  **2. The Accountability Trap**
  *   *Ask:* "How did Cleon speak differently than Diodotus?"
  *   *Point:* Cleon could promise security easily. Diodotus had to promise complex outcomes. In democracies, simple, harsh promises often beat complex, nuanced ones.
  *   *Link to Arginusae:* Explain that later, after a naval victory where generals couldn't rescue survivors due to a storm, the Assembly executed the generals. Why? Because the Assembly needed a scapegoat for their own grief. *Accountability makes leaders risk-averse or populist.*

  **3. The Stakes (What we couldn't simulate)**
  *   *Honesty Check:* "You knew no one would actually die. In Athens, if you voted wrong, your city fell, your family was enslaved, or the plague took you. The fear was biological, not academic."
  *   *The Plague:* Remind them this debate happens *during* the plague. Stress levels were pathological.

  **4. Extensions (The "Car-Crash" Pattern)**
  *   **The Sicilian Expedition (415 BC):** Same machinery. Alcibiades (like Cleon) sells a dream of infinite empire. Nicias (like Diodotus) tries to argue cost, but is shouted down. The Assembly votes for a war they cannot afford because the *procedure* rewards optimism.
  *   **The Trial of Socrates (399 BC):** After the democracy is restored following defeat, they are paranoid. They execute Socrates not just for impiety, but because he was associated with the oligarchs who broke the democracy. It is another "security vote" disguised as a legal trial.

  ---

  ## 6. Teacher's Cheat Sheet: Predictable Failures

  **1. The "Grandstanding Cleon"**
  *   *Risk:* A student treats Cleon as a villain to be mocked, ruining the tension.
  *   *Fix:* Pull them aside before Session 1. Tell them: *"Cleon isn't a cartoon villain. He's a patriot who thinks toughness saves lives. Play him straight, or the simulation fails."*

  **2. The "Modern Moralizer"**
  *   *Risk:* A student says, "Slavery is wrong, we should free them."
  *   *Fix:* Enforce the "No Modern Morality" rule strictly. Deduct "Empire Stability Points" from their faction if they break character. Remind them: *"You are an Athenian slave-owner. Argue from interest, not 21st-century ethics."*

  **3. The "Too Nice" Vote**
  *   *Risk:* They vote mercy in Session 1.
  *   *Fix:* If the vote leans merciful, halt the count. As the Teacher (acting as *Prytanis*/Chairman), announce: *"A messenger has arrived. Sparta is mobilizing a fleet. If we look weak now, they attack next week."* Re-vote. (It's a cheat, but necessary for the lesson).

  **4. The "Diodotus Collapse"**
  *   *Risk:* The Diodotus student freezes or argues morality.
  *   *Fix:* Give them a cue card with three bullet points:
      1.  Harshness makes rebels fight harder.
      2.  The first debate was too rushed.
      3.  Sparing the common people splits the enemy.

  ---

  ## 7. Adaptation Notes for the TA

  *   **Timing:** 45 minutes is tight. If the debate drags in Session 1, cut the voting time, not the speaking time. The pressure is part of the lesson.
  *   **Class Size:** If you have fewer than 15 students, combine the Merchant and Farmer roles. If you have more, add more "Citizens" with no specific faction.
  *   **Resources:** All you need are printed role cards and a whiteboard for the "Empire Stability Score."
  *   **Sensitivity:** Be aware that simulating mass execution can be heavy for some students. Keep the tone academic. Emphasize in the debrief that we are analyzing *systems*, not glorifying violence.
  *   **Language:** Ensure students understand "Trireme" (warship), "Ecclesia" (Assembly), and "Strategoi" (Generals). Put these on the board.

  **Final Thought:**
  The success of this lesson isn't whether they get the "right" vote. It's whether they feel the *pressure* to vote wrong. If they leave feeling that democracy is messy, dangerous, and requires constant vigilance against its own momentum, you've succeeded.
