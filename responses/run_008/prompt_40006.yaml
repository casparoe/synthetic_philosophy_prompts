      *Wait, 6 categories for 8 questions is tight.* Some questions won't touch all 6. I will design the scoring so that Q1-4 sort the "Currency" (H, P, R, C) and Q5-6 sort the "Distribution Rule" (S, Pr, R). Q7-8 reinforce.
      *Actually, to make it workable for a blog, I'll group the results into "Families" first, then specific labels.*
