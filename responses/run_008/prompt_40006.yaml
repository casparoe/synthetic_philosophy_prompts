answer: |-
  # Which Egalitarian Are You, Actually?

  You say you want equality. But equality of *what*? And how much of it do you need before you're satisfied?

  We've all been in that comment section fight. One person says equality means everyone gets the same paycheck. Another says it means everyone should be equally happy. A third says it doesn't matter how much money you have, as long as you can actually *do* the things you value. Usually, everyone talks past each other until the thread is locked.

  This quiz isn't about labels. It's about gut checks. We've put together 8 concrete scenarios. There are no right answers, only consistent ones. Pick the option that matches your moral intuition, tally your score, and find out which philosophical tribe you're accidentally joining.

  ---

  ## The Quiz

  **1. The Mobility Gap**
  Alex and Jordan receive the same monthly stipend from the government. Alex walks fine. Jordan uses a wheelchair and needs to spend 40% of that stipend just on transport and accessibility modifications to leave the house. To make things "fair," you should:
  *   **A.** Leave the stipends equal. If we give Jordan more, Alex will be jealous. Equality means same cash.
  *   **B.** Give Jordan extra money. Fairness means ensuring Jordan can get around town just as easily as Alex.
  *   **C.** Check if Jordan is happy. If Jordan has adapted and is content staying home, no extra money is needed.

  **2. The Wine Snob**
  Sam was raised on tap water. Taylor trained their palate to only enjoy $500 bottles of wine. They have the same income. Taylor complains they are worse off because their money buys them less pleasure. The state should:
  *   **A.** Ignore Taylor. You are responsible for the tastes you cultivate.
  *   **B.** Compensate Taylor. If the goal is equal satisfaction, Taylor is suffering compared to Sam.
  *   **C.** Ignore Taylor, but ensure Taylor has the *freedom* to buy wine if they choose, even if they can't afford much.

  **3. The Cost of Faith**
  A religious group requires expensive dietary laws and forbids working on Saturdays, reducing their income potential. They chose this faith willingly. To treat them equally with non-believers, you should:
  *   **A.** Treat it like the Wine Snob. It's a chosen preference; no compensation owed.
  *   **B.** Treat it like the Mobility Gap. These are real costs imposed on their life plan; compensate them.
  *   **C.** Ensure they aren't *blocked* from practicing, but don't subsidize the cost. The capability to practice must be protected, not the budget.

  **4. The Happy Oppressed**
  A survey shows a historically marginalized group reports the exact same life satisfaction as the dominant group, despite having fewer rights and less wealth. A politician says, "See? Inequality is solved." You say:
  *   **A.** They're right. If people report equal happiness, the job is done.
  *   **B.** They're wrong. People adapt to bad circumstances. Lack of rights matters even if they don't feel it.
  *   **C.** They're wrong. Happiness isn't the metric. We need to look at whether they have the same actual opportunities.

  **5. The Billionaire Next Door**
  Everyone in your town has a warm house, good food, and healthcare. However, one neighbor has ten billion dollars and a private island. You should:
  *   **A.** Leave it. Everyone has "enough." Inequality above the floor doesn't matter.
  *   **B.** Tax it. Extreme wealth undermines democracy and social equality, even if everyone is fed.
  *   **C.** Tax it only if that money could be used to help the very worst-off people escape poverty.

  **6. The Triage Decision**
  You have $1 million to spend on health. Option X cures a mild headache for 10,000 people. Option Y saves the life of 1 person who is currently the sickest in the country. You pick:
  *   **A.** Option X. Maximizing total well-being is what matters.
  *   **B.** Option Y. Benefits matter more the worse off the person is.
  *   **C.** Option Y. Because being alive is a basic capability everyone must have.

  **7. The Inheritance Lottery**
  Two babies are born. Baby A's parents are billionaires. Baby B's parents are destitute. To ensure equality, the government should:
  *   **A.** Tax the inheritance heavily so both start with the same resources.
  *   **B.** Do nothing, as long as Baby B has enough to live a decent life.
  *   **C.** Focus on ensuring both babies have the same educational and social opportunities, regardless of cash.

  **8. The Bored Rich**
  A wealthy person has everything money can buy but reports being deeply miserable. A poor person has little but reports being joyful. If you could only help one, who do you help?
  *   **A.** The poor person. Their joy is fragile; the rich person's misery is a luxury problem.
  *   **B.** The wealthy person. Suffering is suffering, regardless of bank balance.
  *   **C.** Neither/Both based on need. Money isn't the metric; we should look at what they are unable to *do*.

  ---

  ## The Scoring Key

  Tally up which letter you chose most often. (If you have a tie, read both descriptions).

  *   **Mostly A's:** **The Sufficientarian**
      *   *Your slogan:* "Enough is as good as a feast."
      *   *Your view:* Equality isn't the goal; a floor is. Once everyone has a decent baseline of resources or welfare, inequality above that line doesn't offend you. You worry about deprivation, not disparity.
  *   **Mostly B's:** **The Prioritarian**
      *   *Your slogan:* "Help the worst off first."
      *   *Your view:* You care about total welfare, but you weight it. Helping someone in deep misery matters more than giving a small benefit to someone already doing okay. You are less concerned with strict equality than with lifting the bottom.
  *   **Mostly C's:** **The Capability Egalitarian**
      *   *Your slogan:* "Freedom to function."
      *   *Your view:* Resources and happiness are both the wrong metrics. What matters is what people can actually *do* and *be* (move, pray, participate). You focus on removing barriers to human functioning.
  *   **Mix of 1B, 2A, 3A, 4B:** **The Resource Egalitarian**
      *   *Your slogan:* "Fair shares, personal responsibility."
      *   *Your view:* (Specific pattern check). You compensate for unchosen disadvantages (disability) but not chosen ones (wine, faith). You want everyone to start with an equal share of resources (the "envy test"), but you let people live with the consequences of their tastes.
  *   **Mix of 1C, 2B, 4A:** **The Hedonic Welfare Egalitarian**
      *   *Your slogan:* "Equal happiness."
      *   *Your view:* The only thing that ultimately matters is pleasure and pain. If the oppressed group is happy, you see less urgency. You are willing to fund expensive tastes if it reduces suffering.
  *   **Mix of 2B, 3B, 4B:** **The Preference-Satisfaction Egalitarian**
      *   *Your slogan:* "Get what you want."
      *   *Your view:* Similar to Hedonic, but broader. You want people to fulfill their desires. You struggle with the Wine Snob case: if his preference is real, why shouldn't it count? You often end up compensating for expensive tastes.

  ---

  ## The Fine Print (Read This Before Commenting)

  I promised honesty, so here is where the quiz admits its limits. Philosophy is messy, and this quiz flattens some nuances to make it playable.

  **1. The Indistinguishable Pairs**
  *   **Resource Egalitarianism vs. Capabilities:** In 80% of policy cases, these two vote the same way. Both support disability accommodations and oppose funding wine snobs. The difference is theoretical: Resource folks talk about "fair shares of goods"; Capability folks talk about "freedom to function." If you scored high on both, you're a standard Left Egalitarian; the distinction only matters in edge cases (like whether to give cash or specific services).
  *   **Hedonic vs. Preference:** These only split when "adaptive preferences" are involved (Case 4). If you believe the Happy Oppressed group *is* equal because they are happy, you're Hedonic. If you think they aren't equal because they lack rights (even if happy), you've moved to Capabilities or Resources.

  **2. The "Wine Snob" Problem**
  I suspected this, and the quiz confirms it: The Wine Snob case (Question 2) is the biggest divider between **Resource/Capability** folks and **Welfare/Preference** folks. However, it doesn't perfectly split Welfare from Preference. A Preference theorist *could* say "Taylor chose those tastes, so don't compensate," which makes them look like a Resource theorist. If you answered 2A but 4A, your view is coherent but rare: you think chosen tastes don't matter, but unchosen oppression doesn't matter if it doesn't hurt feelings.

  **3. The Unoccupied Coherent View**
  There is a combination of answers that is logically possible but almost no one holds: **Sufficientarianism about Resources + Prioritarianism about Welfare.**
  *   *What it looks like:* You say, "Give everyone $30k and I don't care about billionaires" (Sufficientarian Resources), BUT "If someone is suicidal, save them even if it costs more than curing 100 headaches" (Prioritarian Welfare).
  *   *Why it's unoccupied:* Usually, if you care enough about the worst-off to be a Prioritarian on welfare, you also care about the wealth gap that put them there (making you an Egalitarian on resources). If you don't care about the wealth gap (Sufficientarian), you usually treat all welfare gains equally (Utilitarian). It's a stable view, but psychologically rare.

  **4. The "Religion" Trap (Question 3)**
  This is the hardest question. Resource Egalitarians typically treat religion like the Wine Snob (a chosen cost). Capabilities theorists treat it like the Disability case (a central functioning that must be protected). If you answered 3B, you are likely a Capability theorist, but be warned: strict Resource Egalitarians will accuse you of subsidizing "expensive tastes" in God. There is no clean answer here that satisfies everyone.

  **Final Note:** If you scored a mix that doesn't fit a label, congratulations. You might be a **Pragmatic Pluralist**. You care about resources, happiness, and freedom, and you weigh them differently depending on the case. Most politicians are Pluralists; most philosophers hate them. Welcome to the real world.
