answer: |-
  ### Requirements for an Adequate Theory of Truth

  To evaluate any resolution of the Liar paradox, one must first establish the criteria of adequacy. A theory that solves the paradox by ceasing to be a theory of *truth* is a failure of relevance; a theory that solves it by rendering standard mathematics impossible is a failure of utility. The following desiderata distinguish core intuitions from sectarian prejudices.

  **1. The T-Schema (Capture and Release)**
  *The Principle:* For any sentence $\phi$, the biconditional $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$ must hold. "Capture" is $\phi \to T(\ulcorner \phi \urcorner)$; "Release" is $T(\ulcorner \phi \urcorner) \to \phi$.
  *The Case:* This is the disquotational essence of truth. To assert $\phi$ is to assert that $\phi$ is true. Without this, the predicate $T$ does not track truth but some other property.
  *Status:* **Non-negotiable intuition, negotiable formalization.** While the intuition is core, Tarski's results force restrictions. A theory must either restrict the schema's scope or the logic governing it.

  **2. Compositionality**
  *The Principle:* The truth value of a complex sentence (e.g., $\phi \land \psi$, $\forall x \phi(x)$) is determined functionally by the truth values of its constituents.
  *The Case:* Necessary for a systematic semantics. If truth is not compositional, we cannot learn or compute the truth of novel sentences based on their parts.
  *Status:* **Non-negotiable.** A non-compositional truth predicate is semantically opaque and theoretically useless.

  **3. Classicality of Background Logic**
  *The Principle:* The logic governing the truth predicate obeys the Law of Excluded Middle (LEM) and the Law of Non-Contradiction (LNC).
  *The Case:* Standard mathematical and scientific reasoning relies on classical logic. Deviating requires costly revisions to inference rules (e.g., Disjunctive Syllogism).
  *Status:* **Prejudice.** This is the primary dividing line between classical approaches (Tarski, Kripke, Revision) and non-classical ones (Paraconsistency, Paracompleteness). It is not a requirement for truth *per se*, but for truth *within standard frameworks*.

  **4. Conservativeness over Base Arithmetic**
  *The Principle:* Adding the truth predicate to a base theory (like Peano Arithmetic) should not allow the derivation of new arithmetic theorems not derivable in the base alone.
  *The Case:* Truth should be metaphysically "light." If truth axioms prove new facts about numbers, truth is substantive and mathematical, not merely semantic.
  *Status:* **Prejudice.** Vital for deflationists, irrelevant for substantivists who view truth as a robust property.

  **5. Coverage of Curry's Paradox**
  *The Principle:* The solution must block paradoxes derived from self-referential conditionals (e.g., "If this sentence is true, then $0=1$") without relying solely on negation restrictions.
  *The Case:* Curry's paradox generates triviality using only implication and self-reference. A solution that only weakens negation (like some paracomplete views) fails here.
  *Status:* **Non-negotiable.** A solution that handles the Liar but succumbs to Curry is incomplete.

  **6. Revenge-Immunity**
  *The Principle:* The theoretical vocabulary used to diagnose the Liar (e.g., "undefined," "false," "unstable") must not itself generate a new paradox when applied to the Liar sentence.
  *The Case:* If a theory classifies the Liar as "gappy," one can construct a Revenge Liar: "This sentence is false or gappy." If the theory cannot express its own diagnostic categories without inconsistency, it is expressively incomplete.
  *Status:* **Non-negotiable.** This is the graveyard of solutions. A theory that solves the Liar only to fall to Revenge is merely postponing the problem.

  ### Where the List Breaks: Joint Unsatisfiability

  The central tragedy of truth theory is that these desiderata cannot be jointly satisfied. Tarski's Undefinability Theorem and subsequent limitative results demonstrate a hard trilemma. The following subset is **jointly unsatisfiable**:

  1.  **Classical Logic** (in the object language).
  2.  **Unrestricted T-Schema** (Capture and Release for all sentences).
  3.  **Syntactic Self-Reference** (The language can represent its own syntax and diagonalize).

  You must sacrifice at least one. Tarski sacrificed (2) by hierarchy. Kripke sacrificed (1) in the object language (allowing gaps) while keeping it in the meta. Dialetheists sacrifice (1) outright (allowing gluts). Revision theorists keep (1) but restrict (2) to revision stages rather than stable truth.

  Furthermore, **Revenge-Immunity** is the single desideratum that eliminates the most contenders. While Classicality divides camps, almost every specific formulation (Kripkean fixed points, Contextualism, Revision Theory) faces a potent Revenge argument claiming the theory cannot express its own solution within the object language. If Revenge-Immunity is strictly enforced, the set of viable contenders shrinks to near zero, as expressing the "pathological" status of the Liar typically recreates the paradox.

  ### Contenders

  **Kripke-style Fixed-Point Theories** preserve Classicality in the meta-language but sacrifice Bivalence in the object language, assigning the Liar no truth value (a gap). They retain compositionality and handle the Liar gracefully via a minimal fixed point. However, they fail **Revenge-Immunity**: the predicate "is not true" (covering false and gappy) cannot be defined within the object language without recreating the paradox, leaving the theory expressively incomplete regarding its own semantics.

  **Paraconsistent Dialetheism** preserves the Unrestricted T-Schema and Self-Reference by sacrificing Classicality, accepting that the Liar is both true and false (a glut). This handles Curry's paradox only if the underlying logic is also non-contractive (paraconsistent logics alone often fail against Curry). While expressively powerful, it faces **Revenge** via "hyper-contradictions" and is often rejected due to the high cost of abandoning the Law of Non-Contradiction for standard mathematics.

  **Paracomplete Revision Theories** (e.g., Gupta-Belnap) maintain Classical Logic but treat truth as a circular concept defined by revision rules rather than fixed extensions. The T-Schema holds revisionally but not categorically. This approach preserves Classicality and handles Curry well but struggles with **Conservativeness** (some versions prove arithmetic consistency) and **Revenge**, as the notion of "stable truth" required to categorize the Liar often cannot be internalized without inconsistency.

  ### Confidence

  I am highly confident in the identification of the Tarskian trilemma (Classicality, Unrestricted T-Schema, Self-Reference) as the locus of joint unsatisfiability; this is a settled mathematical result. I am moderately confident in identifying **Revenge-Immunity** as the single desideratum that eliminates the most contenders, as the literature is replete with solutions subsequently undermined by revenge arguments. The point on which I am least sure is the status of **Conservativeness**; whether truth *ought* to be conservative is a deeply metaphysical dispute between deflationists and substantivists, making it less an objective criterion of adequacy and more a marker of philosophical allegiance.
