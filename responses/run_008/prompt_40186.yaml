  *   *1 (Blindsight):* FO content exists, no consciousness. (Implies FO isn't enough).
  *   *4 (Infants):* FO content exists, presumably consciousness exists. (Implies FO might be enough, or concepts aren't needed).
  *   *3 (Misalignment):* HOT dictates phenomenology.
  *   *The Real Tension:* If Infants lack concepts (4), and HOT requires concepts (standard HOT), they lack consciousness. But if they lack consciousness, how are they different from Blindsight patients (1)? Both have FO, no Consciousness. But we intuitively think Infants feel pain and Blindsight patients don't. So, to save the intuition on Infants, we must weaken the HOT requirement (allow non-conceptual). But if we weaken it, does Misalignment (3) still hold? If the HOT is non-conceptual, can it misrepresent?
  *   *Okay, I will frame the incompatibility around the "Conceptual Requirement vs. Phenomenal Continuity."*

