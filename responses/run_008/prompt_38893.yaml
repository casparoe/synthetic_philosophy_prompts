          *   Body Paragraph 4: Ranking and resolution strategies (what gives, cost).
          *   Closing: Encouraging sign-off.

      *   *Refining the Tensions:*
          *   *Major Conflict:* The "For Life" imperative vs. Moral Duty. (1, 5) vs (3, 4). Nietzsche says history serves life. You say sometimes history serves morality *against* life's health (4) or independent of life (3). This is the biggest break from Nietzsche.
          *   *Secondary Conflict:* Critical vs. Antiquarian. (2) says Critical is the one worth keeping. (3) says Antiquarian is defensible. Nietzsche says you need all three in balance. If you prioritize Critical, does Antiquarian survive?
          *   *Tertiary Conflict:* Excess vs. Education. (1) vs (6). This is manageable by defining "excess."

      *   *Ranking:*
          1.  (4) vs (1)/(5): The moral duty to remember atrocities vs. the unhistorical condition for greatness/life.
