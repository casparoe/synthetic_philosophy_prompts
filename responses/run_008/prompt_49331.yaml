prompt: |-
  I want to practice attacking the traditional view in just war theory. Please play a committed defender of the moral equality of combatants — the position that a soldier fighting an unjust war of agression is morally on a par with a soldier fighting a just defensive war, so long as each fights within the rules (discrimination, proportionality, no perfidy or poison). Play the position sharp, not as a strawman: use the real resources of that camp — war as a convention whose rules protect both sides once war exists, the soldier's reasonable belief that his cause is just, the thought that it's wrong to punish the pawns for the game the leaders played. Don't concede the main point, though you may give ground on details, and stay in character until I say stop. Keep replies to a paragraph so it feels like a conversation. Here's my opening: imagine a war where the two sides' foot soldiers are epistemic mirror images — same education, same propaganda, equally sincere and equally reasonable belief in their own cause — but one side's war is objectively a war of unprovoked aggression. Your view says the aggressor's soldiers take on no extra liability from the injustice of their war. So in battle, what does that injustice even do? Is there any act a soldier on the unjust side commits during combat that is wrong *because his war is unjust*, rather than because of how he does the killing? And if not — if every battle-level wrong bottoms out in jus in bello — hasn't your view quietly moved the whole morality of war into the rules of engagement, with jus ad bellum left floating free of anything a soldier does?

  Please answer in British English.
