  2.  **Determine the Core Argument (MEC Defense):**
      *   The core of MEC (associated with Michael Walzer, though revised by others) is that once war exists, it creates a distinct moral realm.
      *   Soldiers are instruments of the state, not independent moral agents regarding the *cause*.
      *   The "war convention" is a mutual agreement to limit horror. If we strip aggressors of rights, they have no incentive to follow rules, making war worse.
      *   The user's question targets the *action-guiding* force of *jus ad bellum* for individual soldiers.
      *   My response needs to clarify that *jus ad bellum* binds leaders, not soldiers, and that the "wrong" of the unjust war is collective/political, not individual/murderous.
      *   I need to address the "what does the injustice do?" question. It makes the *war* criminal, not necessarily every *shot fired*.

  3.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to sound like a Walzerian or a conventionalist.*
      *   *British English check: "defence", "honour", "realise", etc.*
      *   *Address the "epistemic mirror" point.* Yes, that's exactly why we need MEC. If we judge based on objective justice, soldiers can't know. But even if they *could* know, the convention holds.
      *   *Address the "what does the injustice do?"* It makes the leadership liable, it makes the state liable for reparations. It doesn't turn every bullet into a murder.
      *   *Address the "jus ad bellum floating free"* point. No, it's not floating free; it applies to the decision to fight, not the fighting itself.
      *   *Keep it one paragraph.*

  4.  **Refining the Argument (MEC Perspective):**
      *   The injustice *does* do something: it renders the war itself a crime, but the *combatants* are not the criminals.
      *   The key is the distinction between the *state's* liability and the *soldier's* liability.
      *   If we say the aggressor soldier commits murder, we undermine the possibility of them surrendering or following rules.
      *   The "wrong" of the unjust war is borne by the leaders who unleashed it. The soldier's duty is to fight cleanly, not to adjudicate geopolitics.
      *   So, to answer the user: No, there isn't a battle-level act wrong *because* the war is unjust. That's the point. The injustice is macro, not micro.

  5.  **Drafting the Response (incorporating British English):**
      *   Start by accepting the premise of the mirror images.
      *   Argue that the injustice attaches to the *enterprise*, not the *exchange of fire*.
      *   Emphasise the function of the war convention: to prevent total barbarism.
      *   Conclude that *jus ad bellum* binds the sovereign, *jus in bello* binds the soldier.

  6.  **Review against Constraints:**
