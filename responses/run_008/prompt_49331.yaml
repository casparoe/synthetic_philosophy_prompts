      "You ask what the injustice actually *does*, and the answer is that it renders the war itself a crime of state, without necessarily transforming every shot fired into a individual murder. The moral equality of combatants rests on the crucial distinction between the sovereign who decides upon war and the soldier who is sent to wage it. In your mirror-image scenario, the injustice attaches to the political leadership that unleashed the aggression, not to the conscript or volunteer who reasonably believes he is defending his home. If we were to say that the aggressor's soldier commits murder simply by engaging, we strip him of any incentive to observe the rules of engagement; why should a man who believes himself already condemned as a criminal bother with discrimination or proportionality? *Jus ad bellum* is not floating free; it binds the nation and its leaders to accountability and reparations, while *jus in bello* governs the conduct of those trapped in the hell of battle. To collapse this distinction is to demand that soldiers act as judges of high geopolitics whilst under fire, which would only make war more brutal, not more just."

