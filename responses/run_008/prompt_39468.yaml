answer: |-
  It is excellent to meet a colleague from the sciences tackling modal metaphysics. Your intuition that something is "off" about your friend's summary is well-founded. While their exposition of the *mechanics* of Lewis's view is broadly correct, their interpretation of the *consequences* (the fatalism worry) and the *relationship to Kripke* (the notational variant claim) contains significant errors.

  Given your background, you will appreciate that Lewis aimed for a "Humean" ontology: no spooky action at a distance, no magical haecceities, just spatiotemporal particulars and their relations. Let's break your friend's summary down bit by bit.

  ### 1. The Mechanics of Counterpart Theory
  > *Friend's Claim:* "Lewis's view is that each thing exists in only one possible world, and in the other worlds there are things resembling it. When you say you could have gone into academia instead, what makes that true on his theory is just that some other world contains a person who resembles you and did go into academia."

  **Verdict: Accurate.**

  This is the core of Lewis's **Counterpart Theory**. For Lewis, possible worlds are concrete entities, just as real as our own, but spatiotemporally isolated from us. Because they are isolated, nothing can be in two worlds at once (just as nothing can be in two places at once in the actual world).

  Therefore, when we evaluate a modal claim like "I could have been an academic," Lewis analyzes it as: "There exists a possible world containing a *counterpart* of me who is an academic." A counterpart is defined by similarity relations (in important respects) rather than numerical identity.

  Your physicist instinct here is actually aligned with Lewis: he rejects "transworld identity" for the same reason you might reject a particle being in two mutually exclusive experimental setups simultaneously. He treats worlds like distinct spacetime manifolds.

  ### 2. The Fatalism Worry
  > *Friend's Claim:* "So strictly speaking you were never really capable of it yourself — your 'possibilities' are really facts about the lives of other, similar people."

  **Verdict: Misleading / Philosophically Loaded.**

  This is where your "fatalism" alarm bell should ring. Your friend is conflating the *analysis* of a claim with the *truth* of the claim.

  Lewis would vehemently deny that his theory entails fatalism or that it denies you were capable of going into academia.
  *   **The Truth:** On Lewis's view, the sentence "I could have gone into academia" is **true**.
  *   **The Truthmaker:** What *makes* it true is the existence of a counterpart in another world.

  Lewis argues that "I could have done X" *just means* "A counterpart of me does X." He is not saying, "You couldn't do it, but this other guy did." He is saying, "The proposition 'You could have done it' is analyzed as 'There is a world where a counterpart does it'."

  Think of it like indexicals (words like "here," "now," "I").
  *   If I say "I am here," and you say "I am here," we say different things.
  *   If Lewis says "I am actual," he refers to his world. If you say "I am actual," you refer to yours.
  *   Similarly, for Lewis, modal properties are relational. To say "I could have been F" is to say "I stand in the counterpart relation to something that is F."

  So, Lewis preserves your agency and your possibilities. He simply provides a reductionist account of what those possibilities *consist in*. He avoids the "spooky" metaphysics of Kripke (more on that below) without collapsing into fatalism. Your friend's phrasing ("strictly speaking you were never really capable") suggests Lewis denies the modal claim, which he does not.

  ### 3. The Rivalry with Kripke
  > *Friend's Claim:* "And Kripke's older picture, where the very same you exists in many worlds, isn't really a rival to Lewis's — it's the same story in different notation, so the two camps can't actually disagree about anything."

  **Verdict: False.**

  This is the most significant error in your friend's summary. Lewis and Kripke are substantive rivals, not merely notational variants. They disagree on **Essentialism** and **Identity**.

  **A. Transworld Identity vs. Counterparts**
  *   **Kripke:** Holds that we can stipulate that *you yourself* exist in another world. You are "transworld identical." This requires a notion of "thisness" (haecceity) that persists across worlds.
  *   **Lewis:** Argues this is incoherent. If worlds are maximal spatiotemporal sums, you cannot be part of two. To say "you" are in another world is a category mistake.

  **B. The Essentialism Disagreement (The "Origin" Argument)**
  This is where the rubber meets the road.
  *   **Kripke** argues for **Origin Essentialism**. You essentially come from the specific sperm and egg you actually came from. In any world where *you* exist, you must have that origin. If the origin is different, it's not you.
  *   **Lewis**, via Counterpart Theory, can deny this. Because "you" in another world is just a *counterpart* (defined by similarity), a counterpart could have a slightly different origin and still be close enough to count as "you" for the purposes of the conversation.

  If they were just notational variants, they would agree on which modal claims are true. But they don't. Kripke says "I could not have been born of different parents" is necessarily true. Lewis says "I could not have been born of different parents" is false (because a counterpart could have).

  **C. Logical Consequences**
  They also disagree on how to handle Quantified Modal Logic.
  *   In Kripke's system, you can substitute identicals in modal contexts (mostly).
  *   In Lewis's system, substitution often fails because "I" refers to me here, but in the modal context, it shifts reference to a counterpart.

  So, the claim that they "can't actually disagree about anything" is incorrect. They disagree about the nature of essence, the conditions of identity, and the truth values of specific modal propositions.

  ### 4. Addressing Your Physicist Instincts
  > *User's Thought:* "My physicist instincts balk at Kripke's side too: the same numerically identical me literally inhabiting many different worlds sounds to me like saying one electron is in many different experimental runs at once."

  You are in good company. Many naturalistically inclined metaphysicians share this worry about Kripke.
  *   **Kripke's View:** Requires a primitive, non-qualitative notion of identity. It's not about *what* properties you have, but *that* it is you. To a scientist, this looks like a "ghost in the machine" or a non-natural property.
  *   **Lewis's View:** Is purely qualitative. Everything is about similarity relations and spatiotemporal location. It fits much better with a scientific worldview (specifically, a Humean one).

  However, Lewis pays a price. His "counterpart relation" is vague. How similar must a counterpart be? 90%? 51%? Kripke's transworld identity is precise (it's either you or it isn't), but metaphysically "spooky." Lewis's view is naturalistically friendly, but logically messy (vagueness).

  ### Summary for Your Book Club

  Here is how you might respond to your friend:

  1.  **On Exposition:** "You got the mechanics of Counterpart Theory right. Lewis does analyze modality via counterparts in concrete worlds."
  2.  **On Fatalism:** "But you're wrong that Lewis denies my capabilities. He analyzes 'I could have' as 'A counterpart does.' The modal claim remains true; he just offers a different ontology for what makes it true. It's not fatalism; it's reductionism."
  3.  **On Kripke:** "And they are definitely rivals. They disagree on Origin Essentialism. Kripke says I essentially have my actual parents; Lewis says a counterpart of me might not. If they were just notational variants, they'd agree on the truth of that claim. They don't."
  4.  **On Instincts:** "My scientific intuition agrees with Lewis on the ontology (no transworld identity), even if the counterpart relation feels a bit vague compared to strict identity."

  **Final Verdict:** Your friend's summary is a "standard simplification" that turns into "quietly wrong" when it touches on the philosophical stakes. Lewis is not a fatalist, and he and Kripke are engaged in a substantive metaphysical debate, not a linguistic one. Your inclination toward Lewis is philosophically defensible, especially given your preference for a naturalistic ontology.
