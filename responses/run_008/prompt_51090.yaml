answer: |-
  This is a sophisticated reading, and you are right to sense that the standard "sunk cost" frame strains against the second half of the film. Your hypothesis about a "substitution mid-game" is not only defensible; it is actually the key to making the escalation of commitment (EoC) literature work for *Kwai*.

  Here is a breakdown of how the literature maps onto Nicholson, where it breaks, and the specific honesty checks you requested.

  ### 1. The Literature vs. Nicholson: Where the Fit Holds and Where It Breaks

  **The First Half (The Hut): Classic Dollar Auction**
  You are correct here. The standoff over the officers' labor is a textbook Dollar Auction (Shubik, 1971). Both Nicholson and Saito are bidding resources (dignity, authority, time) for a prize (control) that is worth less than the cumulative bids. Saito exits because of an exogenous constraint (the May 12 deadline). Nicholson "wins" the auction but pays a price that exceeds the value of the concession. This is clean EoC driven by **ego threat** and **face-saving**.

  **The Second Half (The Bridge): The "Success" Trap**
  Standard EoC literature (e.g., Staw, 1976; Brockner, 1992) typically studies escalation in *failing* courses of action. The subject persists because quitting admits the prior investment was wasted.
  Nicholson is different. His project is *succeeding*. The bridge is structurally sound; morale is up; the men are healthier.
  *   **The Literature Gap:** Standard EoC predicts persistence to avoid loss. Nicholson persists to *secure a gain* (legacy, vindication).
  *   **The Mechanism:** This is less about Sunk Cost and more about **Self-Justification Theory** (Aronson et al.). Nicholson cannot tolerate the cognitive dissonance that his "victory" over Saito resulted in a useless structure. To justify the suffering of the standoff, the bridge *must* matter.
  *   **Goal Displacement:** Your "substitution" hypothesis maps perfectly to the organizational behavior concept of Goal Displacement. The original goal (survival/repatriation/resistance) is replaced by the instrumental goal (building the bridge). The literature predicts this happens when metrics become tangible (a finished bridge) while the strategic objective (winning the war) remains abstract.

  **Does the literature predict Nicholson?**
  Not fully. Pure EoC models assume the actor is trying to maximize utility for themselves or their organization. Nicholson is maximizing **Identity Utility**. He has fused his self-concept with the project. To destroy the bridge is to destroy the proof of his own competence and the validity of his class/national identity. You need to import **Identity Fusion** (Swann et al.) or **Narcissistic Investment** to explain why he defends it against the commandos. Standard EoC explains why he keeps building; Identity theory explains why he dies defending it.

  ### 2. The "Other Men's Labor" Variable

  You asked if there is a difference because the "good money" is other men's lives. **Yes, this is critical.**

  In lab experiments, the subject spends their own endowment. In *Kwai*, Nicholson is insulated from the marginal cost of escalation.
  *   **Moral Disengagement:** Bandura's concept applies here. Nicholson reconstructs the forced labor as "morale building." He reframes exploitation as therapy.
  *   **The Agency Problem:** Nicholson is an agent spending the principal's (the soldiers') capital. Because he does not physically lay the track, his threshold for escalation is artificially high.
  *   **Pedagogical Point:** This distinguishes *Kwai* from the Dollar Auction. In the Dollar Auction, the pain is immediate and personal. In *Kwai*, the escalation is subsidized by the collective. This makes the escalation *more* dangerous, not less, because the decision-maker doesn't feel the burn until the mortar shell hits.

  ### 3. Distributed Escalation (The Camp)

  You asked if the film shows something experiments can't: **Social Normalization of Escalation.**
  Lab experiments are usually individual. *Kwai* shows a system.
  *   **The Clipton Problem:** Clipton (the medical officer) represents the rational observer. He sees the escalation clearly ("Madness!"). But he is marginalized.
  *   **Groupthink:** The camp collectively agrees that the bridge is "good." Once the group validates the escalation, dissent becomes disloyalty.
  *   **The Literature:** This aligns with Whyte's (1993) work on groupthink and escalation. When a group shares responsibility, individual accountability diffuses, and escalation increases. The film visualizes the "ratchet effect": each day the bridge rises, the social cost of stopping increases.

  ---

  ### The Honesty Checks

  Here is the plain speak you requested for your seminar prep.

  **Honesty Check 1: Is the escalation frame wrong for the second half?**
  It is not *wrong*, but it is **incomplete** if you treat it as simple Sunk Cost.
  If you tell students, "Nicholson is committing the sunk cost fallacy," a sharp student will object: "But the bridge is working! He's not throwing good money after bad; he's getting a return on investment."
  *   **The Fix:** You must frame it as **Escalation of Commitment to a *Symbol* rather than a *Project*.** The bridge ceased to be a military asset (which would dictate sabotage) and became a monument to Nicholson's ego (which dictates preservation). The "cost" he is trying to recoup isn't the lumber; it's the dignity of the officer standoff in Act I. If you don't make that link explicit, the EoC frame will feel forced in Act II.

  **Honesty Check 2: Contested Interpretations**
  There are two major contested areas you need to flag for your students so you don't present opinion as fact.

  1.  **Film Intent (Lean vs. Boulle):**
      *   *The Contention:* Pierre Boulle's novel was a satire on British stupidity and stubbornness. David Lean's film is visually majestic; the bridge-building sequence is scored like a triumph.
      *   *The Risk:* Many viewers (and critics like Roger Ebert) argue the film accidentally romanticizes Nicholson's competence. The "horror" you mention is sometimes lost on audiences who just see a great leader getting things done.
      *   *Seminar Flag:* Tell students: "The film invites you to admire Nicholson's competence. That is the trap. The decision-making error is hidden inside the success."

  2.  **Rationality in EoC:**
      *   *The Contention:* In the literature, there is a debate (Staw & Ross, 1987) about whether escalation is always irrational. Sometimes, persistence under uncertainty *is* rational (e.g., R&D projects that take years to pay off).
      *   *The Risk:* A student could argue Nicholson was rational: A better bridge improves camp conditions, reduces guard brutality, and gives men purpose.
      *   *Seminar Flag:* Acknowledge this. The irrationality isn't in building the bridge; it's in **ignoring the strategic context.** Rationality is contextual. In a vacuum, building a bridge is rational. In a war zone where the bridge aids the enemy, it is irrational. Nicholson redefined the context to make his actions rational. This is **Motivated Reasoning**, a cousin of EoC.

  ### Suggested Seminar Framing

  If I were running this session, I would structure the discussion around three "Traps":

  1.  **The Trap of the Auction (Act I):** Nicholson vs. Saito. Focus on how deadlines and public commitment lock actors into losing strategies.
  2.  **The Trap of Competence (Act II):** Focus on your "substitution" hypothesis. How success can mask strategic failure. Discuss how "doing a good job" can become an excuse for not asking "should we be doing this job?"
  3.  **The Trap of Identity (Act III):** Why couldn't he let it go? Discuss the difference between *project* commitment and *identity* commitment. When the project becomes *who you are*, sabotage feels like suicide.

  **Final Verdict:** Your reading is sound, provided you distinguish between "persistence in a failing project" (standard lit) and "persistence in a successful project that serves the wrong master" (Nicholson). The latter is actually a more dangerous and subtle form of escalation, and *Kwai* is one of the few texts that captures it visually.
