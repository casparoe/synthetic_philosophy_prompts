answer: |-
  Elias, a structural engineer, is verifying the material of a support beam in a renovated lobby. He needs the original blueprint, but the "Structural" file cabinet is empty. Assuming the plans are lost, he leans against a shelving unit to sigh, his elbow accidentally knocks open a box mislabeled "1990 Payroll," and the blueprint slides out. He examines the document, noting the architect's seal and the specific notation "Steel I-Beam," and forms the belief that the beam is steel. The beam is indeed steel, and the document is the authentic, original blueprint, not a forgery or a draft. The luck is thick: had he not tripped, he wouldn't have looked at that box, and had the box been labeled correctly, it would have been filed elsewhere and never found. Yet, Elias knows the beam is steel.

  **The Breakdown**

  **1. Pinpointing the Luck**
  The luck here is **evidential luck** (luck in acquiring the evidence), not **veritic luck** (luck in the evidence connecting to the truth). In a paradigm Gettier case (like the stopped clock), the luck intervenes *between* the justification and the truth: you look at the clock (justification), it reads the right time (belief), but only because it stopped 12 hours ago (luck), not because it tracks time. In Elias's case, the luck is antecedent. It explains *why he has the blueprint*, but it does not explain *why the blueprint is accurate*. Once the blueprint is in his hands, the connection between the document's content and the beam's material is causal and historical, not accidental. The luck gets him to the starting line; it doesn't run the race for him.

  **2. The No-False-Lemmas Check**
  *   **Method:** Identify the propositions Elias actually relies on.
  *   **Reasoning:** Elias relies on (A) "This document bears the architect's seal," (B) "This document notates 'Steel I-Beam'," and (C) "Original blueprints accurately record building materials."
  *   **Verdict:** All three are true. He does *not* rely on the false lemma "This box contains payroll records" or "I found this through a reliable search process." He ignores the box label entirely once the doc is visible. Since every premise in his actual reasoning chain is true, the no-false-lemmas condition is satisfied.

  **3. The Safety Check**
  *   **Method:** "Forming a belief about the beam's material based on reading the content of *this specific document*." (Note: We do not include "finding the document by tripping" in the method, as that is the acquisition phase, not the justification phase).
  *   **Nearby Worlds:** We quantify over worlds where Elias elbows the shelf, the box opens, and he reads *this* blueprint.
  *   **Verdict:** In those nearby worlds, the blueprint does not change, nor does the building. The belief remains true. The belief is safe because the document is a robust indicator of the fact. The fragility lies in *finding* the document, not in the document's truth-tracking. Since safety concerns the stability of the belief *given the evidence*, the case passes.

  **4. Drawing the Line: Which Anti-Luck Condition?**
  The condition that saves this case is the distinction between **Intervening Luck** (Gettier) and **Antecedent Evidential Luck**. Gettier cases fail because the luck makes the truth of the belief independent of the justification (the "truth-connection" is broken). Here, the truth is *dependent* on the justification (the blueprint causes the belief, and the building caused the blueprint). The feature doing the work is the **causal history of the evidence**. The blueprint was generated by the construction of the building; the tripping incident did not generate the blueprint. In a Gettier case, the "evidence" (e.g., the stopped clock face) is causally disconnected from the current fact (the actual time).

  **5. The "All Knowledge is Lucky" Objection**
  Your roommate might argue: "Isn't it lucky he exists? Lucky the building wasn't destroyed by a meteor?" This is **constitutive luck** or **background luck**. The principled difference is **relevance to the justification**. Background luck (existing, gravity working) is necessary for *any* cognitive act. Epistemic luck that kills knowledge is luck that *could easily have made the belief false given the same justification*. In Elias's case, given that he holds the blueprint, it is not lucky that the belief is true. In the meteor case, if a meteor hit, he wouldn't be holding the blueprint. The luck in my case is specifically about *access*, which is compatible with knowledge, whereas Gettier luck is about *accuracy*, which is not.

  **6. Deleting the Luck: Surgery vs. Abandonment**
  If you delete the luck (Elias finds the correctly labeled box on the first try), the case collapses into boring ordinary knowledge. This suggests your roommate's slogan needs **surgery**, not abandonment. "No lucky true beliefs" is too broad because it bans evidential luck, which is harmless. The slogan should be amended to: "Knowledge is justified true belief where the truth is not *accidental relative to the justification*." In Elias's case, the truth is accidental relative to his *elbow*, but not relative to his *reading of the blueprint*. Gettier cases are accidental relative to the justification itself. Your roommate is right that knowledge excludes Gettier-luck, but wrong to think it excludes all luck.
