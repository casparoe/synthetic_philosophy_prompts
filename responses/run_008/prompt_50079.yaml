answer: |-
  # Which Theory of Reference Do You Actually Hold?

  **Instructions:** Read each case and select the option that matches your intuition. Do not worry about technical labels; answer based on what seems true to you.

  **1. The Twin Inhabitant**
  Twin Oscar lives on Twin Earth (where "water" is XYZ, not H2O). She is molecule-for-molecule identical to Earth Oscar. When she says "water," does her term refer to H2O (like ours), XYZ (like her environment), or "the clear drinkable stuff"? What did she *think* she meant?
  *   A) Refers to XYZ; she thought she meant the local stuff.
  *   B) Refers to H2O; she thought she meant H2O (but was wrong).
  *   C) Refers to "the clear stuff"; she thought she meant the clear stuff.

  **2. The Deferential Layperson**
  Alice uses "quantum entanglement" to mean "things being coincidentally similar." Physicists reject this usage. She talks to physicists regularly and knows she isn't an expert. Does her term refer to the physics phenomenon or her mistaken idea?
  *   A) The physics phenomenon (she defers to expert usage).
  *   B) Her mistaken idea (meaning is determined by her beliefs).
  *   C) Nothing (reference failed due to error).

  **3. The Slow Switch**
  Oscar moves from Earth to Twin Earth. Ten years pass. He never notices the difference. He says, "water is wet." Is that thought about H2O, XYZ, or both?
  *   A) H2O (original causal link persists).
  *   B) XYZ (new environment dominates).
  *   C) Ambiguous/Shifts over time (content is unstable).

  **4. The Failed Term**
  "Phlogiston" was used for stuff released in combustion. There is no phlogiston. Does the term refer to nothing, or to oxygen/heat processes?
  *   A) Nothing (empty term).
  *   B) Oxygen/combustion (causal link to real stuff).
  *   C) Whatever fits the description best (approximate truth).

  **5. The Mixture (Advisor's Case)**
  On Twin Earth, the watery stuff is a stable mixture of X and Y. Chemists discover this but disagree on classification. Is it "water"?
  *   A) No (wrong microstructure).
  *   B) Yes (same functional role).
  *   C) Depends on whether chemists stipulate it as a kind.

  **6. The Dead Experts**
  An ancient term "Zincum" was fixed by experts now dead. Current users think it's a magical spirit. Does it refer to the metal zinc or the spirit?
  *   A) The metal (historical causal chain).
  *   B) The spirit (current community beliefs).
  *   C) Nothing (chain broken/false beliefs).

  **7. The Modal Intuition**
  Consider the statement: "Water could have been XYZ." Is this statement true?
  *   A) No, water is necessarily H2O.
  *   B) Yes, conceivable scenarios count as possible.
  *   C) True in one sense (epistemic), false in another (metaphysical).

  **8. The Borderline**
  A new synthetic liquid fits all water roles but has weird microstructure. Usage is split 50/50. Is there a fact of the matter?
  *   A) Yes, microstructure decides.
  *   B) Yes, usage decides.
  *   C) No, reference is indeterminate here.

  ***

  # Scoring Key & Interpretation

  **Mostly A's: Putnam-Style Causal Externalism**
  You prioritize physical environment and historical chains over beliefs. Reference is fixed by baptism and preserved via causal links, even if users are ignorant (Q6) or wrong (Q1). You likely accept necessary a posteriori truths (Q7).
  *   *Commitment:* Natural kind terms rigidly designate microstructures.

  **Mostly B's: Internalist Descriptivism**
  You prioritize the speaker's cognitive state and associated descriptions. If the belief is wrong, reference fails or shifts to what fits the description (Q2, Q4). You find conceivability a guide to possibility (Q7).
  *   *Commitment:* Meaning is "in the head"; external world doesn't fix content.

  **Mix of A's and C's (esp. Q2, Q5, Q6): Burge-Style Social Externalism**
  You prioritize community norms and expert verdicts over physical causation or individual belief. Reference is secured by deference (Q2) and social stipulation (Q5), not just physical history.
  *   *Commitment:* Content is partly constituted by social environment.

  **Mostly C's on Q7 (and Q3/Q8): Two-Dimensionalism**
  You distinguish between how we identify things (epistemic) and what they are (metaphysical). You allow that "water" could pick out XYZ in a hypothetical scenario (primary intension) while maintaining it is H2O in actuality (secondary intension).
  *   *Commitment:* Content has two layers; avoids clash between intuition and necessity.

  **Mostly C's on Q8 (and Q3/Q5): Deflationary/Indeterminacy**
  You deny there is always a fact of the matter. Reference can be vague, unstable, or settled only by pragmatic decision. You resist forcing a binary "yes/no" on borderline cases.
  *   *Commitment:* Semantic facts are not always robust; sometimes we just decide.

  ### Notes on Interpretation

  **Indistinguishable Leaves:**
  *   **Social vs. Causal (Q5 & Q6):** This quiz cannot cleanly separate Burge-style social externalism from Putnam-style causal externalism on natural kind terms. If experts track microstructure, Social (C) and Causal (A) yield the same verdict. To separate them, you need a case where experts *stipulate* against microstructure (e.g., declaring a mixture "water" despite lacking H2O).
  *   **Internalist vs. 2D (Q1 & Q7):** Pure internalists and 2Dists often agree on conceivability (Q7-B vs Q7-C). The split appears in whether you think Twin Oscar refers to XYZ (2D/Putnam) or "clear stuff" (Internalist).

  **Unoccupied Patterns:**
  *   **Q1-A (Externalist) + Q7-B (Internalist Modal):** This combination (Reference is external, but possibility is purely conceptual) is theoretically unstable. If reference is fixed by actual microstructure, XYZ worlds are not water-worlds. Holding both suggests an unexamined shift in what "meaning" refers to across questions.
  *   **Q2-B (Internalist) + Q6-A (Causal):** Believing technical terms depend on individual belief (Q2) while ancient terms depend on dead experts (Q6) is a common hybrid, but strictly speaking, it requires a principled distinction between "technical" and "natural" kind terms that many overlook.
