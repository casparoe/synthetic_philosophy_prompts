answer: |-
  You have identified something profound: the "sunk cost fallacy" is an economic rule applied to a psychological reality. Economics deals with resources; humans deal with narratives, identities, and thresholds.

  The reason your gut reactions don't line up with the clean rule is that you are unconsciously applying **three different principles** depending on the context. The standard definition of the sunk cost fallacy only applies to the first one.

  Here is the framework that reconciles your verdicts, followed by the verdict on the climber.

  ### Principle 1: The Economic Baseline (Resources)
  **Rule:** *Ignore past investment; maximize future utility.*
  **Cases:** *The Movie, The Video Game, The War.*

  In these cases, the past investment is truly gone. It has created no asset, no threshold, and no future leverage.
  *   **Movie:** The ticket money is vapor. Staying buys negative utility (boredom).
  *   **War:** The soldiers are dead. Their deaths cannot purchase victory; only future strategy can. Continuing to kill to "honor" the dead compounds the loss. This is the purest form of the fallacy because the marginal cost (more death) is catastrophic and the marginal benefit (abstract "honor") is illusory.

  **Verdict:** Your intuition is correct. Apply the clean rule here.

  ### Principle 2: The Threshold of Completion (Assets)
  **Rule:** *Past investment matters if it lowers the marginal cost of a specific, valuable future good that requires completion.*
  **Cases:** *The PhD, The Novel.*

  This is where your intuition diverges from the "clean rule," but it is **not actually the sunk cost fallacy.** It is a calculation of **switching costs** and **completion value.**

  *   **The Novel:** A movie is a passive consumable; a novel is an active creation. A movie is 100% valuable at minute 10 or minute 100. A novel is 0% valuable at page 500 and 100% valuable at page 700. The 500 pages are not "sunk"; they are **work-in-progress inventory.** If you quit, the inventory is worthless. If you finish, it becomes an asset. The 500 pages drastically reduce the cost of producing the asset compared to starting a new book. You aren't honoring the past; you are leveraging the proximity to the prize.
  *   **The PhD:** This is trickier. If your friend wants to be an academic, finishing is Principle 2 (the degree is the asset). If he *doesn't* want to be an academic, your advice to finish is only valid if the degree has **option value** (e.g., it signals grit/intelligence to non-academic employers). If the degree has no future utility for him, advising him to finish *is* the sunk cost fallacy. However, the intuition that "he should finish" often stems from the fact that a "PhD (incomplete)" signals failure, whereas "PhD" signals competence. You are likely weighing the future social capital of the credential, not just the past six years.

  **Verdict:** You are not committing the fallacy here; you are accounting for the **value of completion.** Unfinished creative or credentialing work often has zero value. Finishing converts sunk cost into realized asset.

  ### Principle 3: Expressive Rationality (Identity & Virtue)
  **Rule:** *Actions are taken to express who we are, not just to maximize outcomes.*
  **Cases:** *The Restaurant, The Relationship.*

  Economics assumes we want to maximize happiness or profit. Humans often want to maximize **coherence** or **virtue**.

  *   **The Restaurant:** Economically, your mother is wrong. But you admire her because she is prioritizing **loyalty** and **stewardship** over profit. This is "Expressive Rationality." She is signaling that she is the kind of person who does not abandon her life's work or her community. You admire the *virtue*, even if you disagree with the *decision*.
  *   **The Relationship:** Staying because "three years were wasted" is a mistake (Principle 1). But the *pain* you feel about it isn't arithmetic; it's the grief of a broken narrative. The mistake here is letting the narrative drive the future utility. If the future holds resentment, the relationship should end, regardless of the three years.

  **Verdict:** Separate the *decision* from the *person*. Your mother made a suboptimal economic decision, but she acted virtuously according to her identity. In the relationship, the "wasted time" feeling is emotional grief, not a rational reason to stay.

  ---

  ### The Unifying Principle

  If you want a single principle to save these verdicts, it is this:

  > **Ask whether the past investment has created a "Completion Asset" or merely an "Emotional Debt."**

  1.  **Completion Asset:** Does the past investment make the *future reward* significantly cheaper or easier to attain, and is that reward still valuable? (The Novel, The PhD). **-> Keep going.**
  2.  **Emotional Debt:** Is the only reason to continue the pain of acknowledging the loss? (The War, The Relationship, The Movie). **-> Quit.**
  3.  **Expressive Value:** Is the cost of continuing paid in resources, but the benefit is paid in identity/virtue? (The Restaurant). **-> Acknowledge the virtue, but check if the cost is sustainable.**

  ### The Case of the Climber

  Now, apply this to your undecided case: *A climber halfway up a mountain, tired and behind schedule, whose group leader keeps insisting they've come too far to turn back.*

  This is the most dangerous case of all because it masquerades as Principle 2 (Completion Asset) but is usually Principle 1 (Economic Baseline) with high stakes.

  **The Analysis:**
  In mountaineering, there is a hard rule called the **"Turnaround Time."** It is based on the fact that the descent is often more dangerous than the ascent (due to fatigue, weather changes, and darkness).

  *   **If the descent is technically harder/more dangerous than the summit push:** Then the leader is right, but *not* because of sunk cost. They are right because the **future marginal cost** of turning back is higher than the future marginal cost of going up. This is rational risk assessment.
  *   **If the descent is safe, but the leader says "we've come too far":** This is **Summit Fever**, a lethal variant of the sunk cost fallacy. The "halfway" point is irrelevant. The only variables that matter are: *Can we summit and return safely before conditions deteriorate?*

  **The Verdict:**
  Unless the physical act of descending is objectively more dangerous than continuing upward (e.g., a vertical cliff face behind you vs. a scramble ahead), the leader is wrong.

  In the movie case, staying costs you two hours of boredom. In the climber case, "sunk cost" reasoning costs you your life. The "Completion Asset" (standing on the summit) is not worth the marginal cost (death by exposure/fall).

  **Recommendation:**
  You should turn back. The phrase "too far to turn back" is the epitaph of many dead climbers. The mountain will be there next year; your future utility depends on being alive to climb it. This is a case where you must ruthlessly apply the **Economic Baseline**: Ignore the effort already spent. Look only at the fuel, oxygen, daylight, and energy remaining. If those don't cover the round trip, the investment is sunk, and you must cut the loss.

  ### Summary Advice

  1.  **Keep the Sunk Cost Fallacy** for resources, safety, and relationships (Movie, War, Relationship, Climber).
  2.  **Override it with "Completion Value"** for creative works and credentials where the unfinished state is worthless (Novel, PhD).
  3.  **Acknowledge "Expressive Value"** for identity and loyalty, but recognize it as a choice of virtue over efficiency (Restaurant).

  Your intuitions are not broken; they are just detecting different categories of value. The trick is ensuring you don't let "Completion Value" or "Expressive Value" trick you into ignoring a safety risk (The Climber) or a moral hazard (The War).
