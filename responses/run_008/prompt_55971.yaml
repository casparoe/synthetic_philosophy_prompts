prompt: |-
  Everyone tells me the sunk cost fallacy is the clearest fallacy in the book, but when I go through my gut reactions case by case, they don't line up the way one clean rule would require, and I'd like help working out the principle behind them, if there is one.

  Walking out of a movie I paid for and am hating: obviously fine, since the money is gone either way. Uninstalling a video game forty hours in that stopped being fun months ago: also fine — I feel silly about the forty hours, but not guilty. A friend six years into a PhD who no longer wants to be an academic: I keep telling him he should finish, since he's come this far — and I can see this is exactly the reasoning I reject everywhere else, yet I can't shake the feeling that it's right. A government continuing a war so that soldiers already killed won't have died in vain: clearly wrong, and worse than wrong. Staying in a three-year relationship only because leaving would mean the three years were wasted: a real mistake, not just an error of arithmetic. My mother refusing to sell our family's failing restaurant because of the ten years she put into it: I think she should sell, but I admire her for not wanting to, in a way I don't admire anyone for the war reasoning. And the case I can't fit with the movie one: abandoning a 700-page novel at page 500 because I'm not enjoying it. I've done this exactly once, and it felt like quitting in a way that walking out of the movie didn't, though both are just past, unrefundable costs with no further payoff from staying.

  Is there a principle that saves all of these verdicts, or close? If not, which should I give up, and what simpler principle do I get in exchange? I'd also like to know what the principle implies for a case I haven't decided: a climber halfway up a mountain, tired and behind schedule, whose group leader keeps insisting they've come too far to turn back.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** The user is struggling with the *sunk cost fallacy*. They understand the textbook definition (ignore past costs, look only at future utility), but their intuition conflicts with this rule in specific cases. They want to know if there's a deeper principle that reconciles these intuitions or if they need to abandon some intuitions for a simpler rule.
      *   **Cases Provided:**
          1.  *Movie:* Walk out (Easy, aligns with fallacy).
          2.  *Video Game:* Uninstall after 40 hrs (Easy, aligns with fallacy).
          3.  *PhD Friend:* Advise finishing despite wanting to quit (Conflict: feels like sunk cost reasoning, but intuition says "finish").
          4.  *War:* Continue so deaths aren't in vain (Clear violation, morally repugnant).
          5.  *Relationship:* Stay because 3 years wasted (Clear violation, mistake).
          6.  *Family Restaurant:* Mother won't sell after 10 years (Conflict: economically wrong, but admirable loyalty).
          7.  *Novel:* Quit at page 500/700 (Conflict: feels like quitting/failure, unlike the movie).
          8.  *Climber (New Case):* Halfway up, tired, behind schedule, leader says "too far to turn back."
      *   **Goal:** Find a unifying principle or advise on which intuitions to prune. Address the climber case.

  2.  **Deconstruct the Sunk Cost Fallacy:**
      *   *Standard Definition:* Decisions should be based on marginal future costs and benefits, not irrecoverable past investments.
      *   *Why it feels wrong sometimes:* Human psychology isn't purely economic. We value completion, identity, signaling, and narrative coherence.

  3.  **Analyze the Conflicting Cases (The "Exceptions"):**
      *   *PhD:* Why advise finishing?
          *   Signaling to employers (credential value).
          *   Closure/Completion bonus (psychological utility).
          *   Sunk cost *as a signal of commitment* (maybe the difficulty proves value?).
          *   *Correction:* Actually, the advice to finish might *not* be sunk cost. It might be based on the *future* value of the degree. If the degree is worthless without finishing, the past 6 years only matter insofar as they reduce the *remaining* cost to get the credential. This is a crucial distinction.
      *   *Restaurant:* Why admire the mother?
          *   Virtue ethics vs. Consequentialism. Loyalty, stewardship, identity.
          *   It's not about *maximizing profit*, it's about *meaning*.
          *   The "fallacy" applies to rational economic agents. A mother running a family legacy is not a pure economic agent.
      *   *Novel:* Why does quitting feel different than the movie?
          *   Active creation vs. Passive consumption.
          *   Investment of *self* (creative energy) vs. investment of *money/time*.
          *   Potential future value (a finished draft can be edited; an unfinished one is useless).
      *   *War:* Why is this the worst?
          *   Lives are at stake (high marginal cost).
          *   No tangible future benefit usually.
          *   Moral hazard.

  4.  **Search for a Unifying Principle:**
      *   *Hypothesis 1: Future Value + Completion Bonus.*
          *   We value completion intrinsically. Finishing a PhD or Novel has utility *upon completion* that walking out of a movie does not.
      *   *Hypothesis 2: Signaling and Identity.*
          *   Quitting signals "quitter." Finishing signals "grit." But this can be toxic (see War).
      *   *Hypothesis 3: The "Option Value" of Past Investment.*
          *   In the PhD/Novel cases, the past investment creates an asset that is *only* valuable if more investment is made. The movie ticket is an asset that expires regardless.
          *   *Refinement:* The past investment lowers the *marginal cost* of the future reward. 6 years of PhD makes the 1 year to finish cheaper than starting a new 5 year degree elsewhere.
      *   *Hypothesis 4: Moral vs. Prudential.*
          *   War is moral (lives). Restaurant is relational (family). Movie is prudential (entertainment).

  5.  **Develop the "Principle of Recoverable Value" vs. "Narrative Coherence":**
      *   The standard economic rule is correct for *resource allocation*.
      *   But humans live in *narratives*.
      *   *Key Distinction:* Is the past investment *embedded* in a future good, or is it *gone*?
          *   Movie: Money gone. Experience bad. No future good embedded.
          *   PhD: 6 years embedded in the *potential* degree. The degree is the future good. The 6 years make the degree attainable *now* vs. starting over.
          *   Novel: 500 pages embedded in the *manuscript*. A finished manuscript has value; 500 pages do not.
          *   War: Dead soldiers are not embedded in "victory." They are gone. Victory doesn't require their specific deaths, just the outcome.
          *   Restaurant: The 10 years are embedded in the *identity* of the mother/community. Selling breaks the narrative.

  6.  **Synthesize a Framework:**
      *   **Rule 1: The Economic Baseline.** (Movie, Game). If future utility < future cost, quit.
      *   **Rule 2: The Completion Threshold.** (PhD, Novel). If the past investment creates a *threshold good* (a degree, a book) that is worthless without crossing the line, the past investment reduces the *remaining* distance to value. It's not honoring the past; it's leveraging the proximity to the prize.
      *   **Rule 3: The Moral/Relational Constraint.** (War, Relationship, Restaurant). Here, the "cost" isn't just time/money; it's lives, emotional bonds, or identity.
          *   War: Future cost (more death) outweighs abstract "honor."
          *   Relationship: Staying out of obligation creates negative future utility (resentment).
          *   Restaurant: Admiration comes from *virtue* (loyalty), not *rationality* (profit). You can admire someone for being "irrational" in a human way.

  7.  **Address the Specific Conflicts:**
      *   *PhD:* It's not sunk cost if the degree is valuable. The 6 years make the final year *cheaper* than starting a new path. It's marginal analysis, not sunk cost.
      *   *Novel:* Creative work has "completion value." A half-written book is trash; a finished one is art. The 500 pages are an asset *only if* you finish.
      *   *Restaurant:* Admiration is for *loyalty*, not *decision making*. Separate the two.
      *   *War:* This is the purest fallacy because the "value" (horing the dead) is illusory and the cost (more dead) is real.

  8.  **Address the Climber Case:**
      *   Variables: Tired, behind schedule, leader insists.
      *   Risks: Death/Injury (high marginal cost).
      *   Reward: Summit (bragging rights/experience).
      *   Analysis: If turning back is safe, and pushing on risks death due to schedule/weather, the "too far to turn back" logic is the *mountaineering version of the war fallacy*.
      *   *Exception:* If turning back is technically harder/more dangerous than going up (common in climbing), then it's not sunk cost, it's risk assessment.
      *   *Verdict:* Usually, "summit fever" is deadly. The leader is likely wrong unless the descent is objectively more dangerous.

  9.  **Drafting the Response:**
      *   *Acknowledge the sophistication:* The user is right; the "clean rule" is often too blunt.
      *   *Propose the "Asset vs. Expense" distinction:* Is the past investment an expense (gone) or an asset (part of a future whole)?
      *   *Propose the "Marginal Cost" check:* In PhD/Novel, does the past investment lower the future cost of a valuable thing?
      *   *Propose the "Virtue vs. Utility" distinction:* Restaurant/War.
      *   *Solve the Climber:* Apply the framework.

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the PhD advice actually sunk cost?* If the friend *no longer wants to be an academic*, the degree has low future utility. Advising them to finish *is* likely sunk cost fallacy unless the degree has high option value (signals intelligence/grit to non-academic employers). I need to be nuanced here. The user's intuition ("tell him to finish") might actually be *wrong* or based on hidden future value (credentialism).
      *   *Novel:* Writing is active. Watching a movie is passive. The "sunk cost" in a novel is *creative capital*.
      *   *Restaurant:* Distinguish between "Good Decision" and "Good Person."
      *   *Climber:* Crucial distinction: Is the descent more dangerous? If yes, continue. If no, turn back. "Too far" is usually wrong in mountaineering.

  11. **Final Polish:** Structure clearly. Use the user's examples. Provide the principle. Answer the climber question. (Ensure tone is empathetic but analytical).

      *   *Principle Name:* "The Principle of Embedded Potential" or "Future-Weighted Investment." Let's go with **"The Principle of Realizable Value."**
      *   *Core Idea:* Sunk costs are irrelevant *unless* they have created a unique asset that lowers the marginal cost of a future reward that you still want.
      *   *Secondary Idea:* Distinguish between *Prudential Rationality* (maximizing good) and *Expressive Rationality* (expressing values/identity).

      *(Self-Correction on PhD)*: I should challenge the user's intuition on the PhD. If the friend doesn't want to be an academic, finishing might *still* be the sunk cost fallacy, disguised as "grit." I need to point this out gently.

      *(Self-Correction on Climber)*: In mountaineering, "turnaround time" is a hard rule. "Too far to turn back" is the mantra of the dead. I need to be firm here.

  12. **Final Plan:**
