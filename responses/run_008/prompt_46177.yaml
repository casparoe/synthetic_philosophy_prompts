answer: |-
  **Where Do You Actually Draw the Line?**

  **Instructions:** Read each scenario. Choose the option that best explains *why* you feel uneasy (or don't).

  **The Options:**
  **(A) Acceptable.** No lies or overt threats were used.
  **(B) Concerning.** It relies on me not noticing the tactic.
  **(C) Unethical.** It undermines my ability to choose freely.

  **The Scenarios:**

  1.  **Mirroring:** A salesperson matches your posture and speech rhythm throughout the conversation.
  2.  **Charity:** An ad features one named child rather than statistics about thousands.
  3.  **Friendship:** A friend builds your confidence all evening, then asks to borrow money.
  4.  **Layout:** A supermarket places milk at the back so you pass every aisle.
  5.  **Guilt:** A partner exaggerates how upset they'll be if you go out with friends.
  6.  **Framing:** A surgeon says survival is "90%" rather than mortality is "10%."
  7.  **Friction:** An app signup is one tap, but cancelling requires a maze of screens.
  8.  **Flattery:** A waiter sincerely compliments your taste before recommending a pricier bottle.

  ***

  **Scoring Key**

  Tally your A, B, and C responses.

  *   **Mostly A (Deception-and-Pressure View):** You draw the line at falsehoods and coercion. If the information is true and no force is used, you view the influence as legitimate persuasion. You prioritize transactional honesty over psychological autonomy.
  *   **Mostly B (Hiddenness View):** You focus on transparency. Influence becomes manipulation when the target is kept in the dark about the tactic. If the method were revealed, you believe the influence would lose its power or become acceptable.
  *   **Mostly C (Bypass View):** You prioritize rational deliberation. Even truthful, visible tactics count as manipulation if they work by subverting your decision-making processes rather than engaging them.
  *   **Mixed/Inconsistent (Deflationary View):** You lack a consistent principle. You might judge the surgeon strictly (C) but the supermarket leniently (A). This suggests you see manipulation as a matter of degree or context rather than a distinct category. *Note: This is a philosophically honest position. Many ethicists argue no bright line exists.*

  ***

  **Diagnostics**

  **1. The Hiddenness/Bypass Overlap**
  This quiz struggles to separate the **Hiddenness** and **Bypass** views. Tactics that bypass deliberation (View C) are often hidden (View B). If you scored high on both B and C, don't worry. Philosophically, these positions often converge in practice: if I can't see the influence, my deliberation is necessarily bypassed. Distinguishing them requires cases where a tactic is obvious *but* still bypasses reason (e.g., known subliminal audio), which are rare in daily life.

  **2. The "Stakes" outlier**
  Some users select **(C) Unethical** for high-stakes cases (Surgeon, Partner) but **(A) Acceptable** for low-stakes ones (Supermarket, Waiter). This pattern doesn't map cleanly onto any leaf. It suggests you are judging based on *harm* or *context* rather than the *method* of influence.
  *Advice:* If this is you, ask yourself: Is the supermarket layout unethical because it wastes time, or just because it's trivial? You may be a contextualist rather than a principled theorist. There is no box for that, but it's a common intuitive stance. Don't force yourself into the Bypass view just because you condemned the surgeon.
