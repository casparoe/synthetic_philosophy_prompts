answer: |-
  This is a sophisticated inquiry into the metaphysics of democratic legitimacy. You have correctly identified a tension between the *aggregative* reality of voting (counting heads) and the *unitary* rhetoric of legitimacy ("The People").

  Per your final request, I must begin with a correction to your framing before reconstructing the theory. Your description of the practice is largely accurate regarding the *rhetoric*, but your explanation of the poll/referendum asymmetry relies too heavily on metaphysics and not enough on institutional function.

  ### I. Correction to the Framing

  **1. The Poll/Referendum Asymmetry is Institutional, not Metaphysical.**
  You suggest the asymmetry presupposes a collective will that is "fixed at the moment of the vote." While this is the *rhetorical* justification, the *practical* presupposition is **consequentiality**.
  *   A poll is a measurement of a state of affairs (opinion).
  *   A referendum is a mechanism of state action (decision).
  The reason we say "the people have spoken" after a referendum is not because we believe a mystical entity has formed a mind, but because a specific **trigger condition** for state power has been met. If a poll were legally binding (as some advisory referendums effectively are), the rhetoric would shift immediately. The asymmetry exists because one procedure changes the legal status quo and the other does not. The "will" is not discovered; it is **enacted**.

  **2. Variation in Practice.**
  Your description assumes a monolithic "democratic practice." This varies significantly.
  *   **UK vs. US:** In the UK (parliamentary sovereignty), a referendum is often advisory; Parliament can technically ignore a 51–49 vote (though politically difficult). In the US, a referendum result in many states is binding law.
  *   **Turnout Quotas:** You mention referendums voided by low turnout. This is actually rare in major Anglo-American democracies (e.g., Brexit had no turnout quorum; US ballot initiatives rarely do). It is more common in post-communist Europe (e.g., Poland, Hungary). Relying on this as a core pillar of the "implicit theory" overgeneralizes a specific civil-law tradition.

  *However, accepting your core phenomenological observation—that democracies rhetorically treat "The People" as a singular, enduring agent distinct from the sum of current voters—here is the reconstruction.*

  ---

  ### II. Reconstructing the Implicit Theory: "The Dual-Persona Theory"

  The practices you describe presuppose a theory of **Popular Sovereignty as a Corporate Fiction with Legal Personality.**

  This theory posits that "The People" is not merely the collection of living citizens (*populus ut multitudo*), but a juridical person (*populus ut universitas*) that persists through time. This entity has two distinct modes of operation:
  1.  **Constituent Power (*Pouvoir Constituant*):** The People acting as founders. This is rare, requires supermajorities, and creates the framework (Constitution).
  2.  **Constituted Power (*Pouvoir Constitué*):** The People acting as government. This is frequent, requires bare majorities, and operates within the framework.

  **The Implicit Logic:**
  *   **Transformation:** Voting is not counting; it is *transubstantiation*. Individual preferences are inputs; the "Will of the People" is the output. Once outputted, the inputs are discarded.
  *   **Temporal Binding:** The Corporate People (Past) can bind the Multitude of People (Present) because the Corporation is the higher legal authority.
  *   **Unitary Agency:** Even if 51% vote X and 49% vote Y, the Corporation has decided X. The 49% are not "outvoted neighbors"; they are minority shareholders in a corporation that has adopted a new direction.

  ---

  ### III. Analysis of Presuppositions

  #### (a) Strict Presupposition vs. Consistency: Can Aggregativism Work?

  **Strict Presupposition:**
  The practice strictly presupposes **the normative authority of the procedure over the preference.**
  It does *not* strictly presuppose a metaphysical collective mind (a "group soul"). It *does* presuppose a **rule of recognition** (in H.L.A. Hart's sense) that treats the output of specific procedures as authoritative *regardless* of the underlying distribution of opinion.

  **Can a Purely Aggregative View Accommodate This?**
  **No.** A purely aggregative view (there are only citizens' opinions, no popular will over and above them) cannot coherently explain the **Poll/Referendum Asymmetry** or the **Dead Hand** without contradicting itself.
  *   **The Asymmetry:** If there is only aggregation, a 51–49 poll and a 51–49 referendum represent the exact same fact: 51% of humans prefer X. To treat them differently requires positing a *second-order fact* created by the procedure itself. Aggregativism denies second-order facts.
  *   **The Dead Hand:** If the "will" is just the sum of current opinions, the dead cannot bind the living. To justify judicial review of a current majority based on a past majority, you must posit that the *entity* that voted then is the same *entity* voting now, and that the *capacity* in which they voted then was superior. Aggregativism views the past voters as dead individuals whose preferences should carry zero weight.

  **Verdict:** The practice requires a **Proceduralist-Constructivist** view. The "Will" is not found (aggregative); it is made (constructivist). The procedure creates a new normative fact that overrides the raw data of opinion.

  #### (b) Consistency: Procedure-Constituted vs. Prior-to-Procedure

  You ask if the practice can coherently take the popular will to be both **procedure-constituted** (fixed at the vote) and **prior-to-procedure** (a founding people binding a later one).

  **The Tension:**
  *   *View A (Constituted):* The Will comes into existence *only* when the vote happens (explains why polls don't count).
  *   *View B (Prior):* The Will exists *before* the vote as a sovereign authority that authorizes the vote (explains why the Constitution binds the voters).

  **Is it Coherent?**
  It is **logically tense but functionally coherent** under the **Dual-Persona Theory** outlined above.
  *   **Resolution:** The "People" as a Sovereign Entity exists prior to the procedure (View B). However, the specific *instruction* or *decision* of that Entity is constituted by the procedure (View A).
  *   **Analogy:** A Corporation exists prior to a shareholder meeting (Prior). But the specific resolution passed at the meeting only exists because of the vote (Constituted). The Corporation binds the shareholders, but the shareholders (via procedure) direct the Corporation.

  **Which half should give?**
  If forced to choose, the **Prior** conception must yield to the **Constituted** conception in a modern democracy.
  *   *Why?* If the "Will" is truly prior and fixed (View B), then voting is merely epistemic (discovering what the People already want). This leads to authoritarianism (the Leader claims to know the Will without voting).
  *   Democratic legitimacy relies on the **Constituted** view: The Will is created by the free exercise of the vote. The "Founding People" are not binding us because their *will* is superior, but because we *procedurally agree* to be bound by their framework until we change it via *their* rules. The "Prior" will is a fiction maintained to stabilize the "Constituted" will.

  #### (c) Replacing the View: The Aggregative Shift

  If we replaced the "Corporate People" theory with a strict "Aggregative Citizen" theory, the following changes would be necessary:

  1.  **Retire "The People Have Spoken":**
      *   This phrase would be retired as misleading. It would be replaced by "A majority of current voters have selected X."
      *   **Consequence:** The losing 49% are not "overruled by the People"; they are simply outnumbered by their neighbors. This lowers the moral stakes but potentially increases polarization (it becomes a raw power struggle rather than a collective decision).

  2.  **Referendum Reversibility:**
      *   If the Will is just current opinion, a new poll showing a reversal *should* logically invalidate the previous referendum result.
      *   **Change:** Referendums would become advisory or have short expiration dates (sunset clauses). The idea of a "mandate" lasting 4–5 years would vanish; governments would have to constantly track polls to claim legitimacy.

  3.  **Judicial Review:**
      *   Courts striking down laws based on a Constitution written by the dead would be viewed as **undemocratic oligarchy**.
      *   **Change:** Judicial review would either be abolished or radically weakened. A current 51% majority would be seen as the only legitimate source of law. The Constitution would be treated as a statute that can be amended by a simple majority.

  4.  **Supermajority Rules:**
      *   These would be hard to justify. Why should 40% of voters be able to block 60%?
      *   **Change:** Move to pure majoritarianism. Supermajorities would be seen as giving minority factions veto power, which contradicts the aggregative principle of "one person, one vote."

  ### Summary

  The cluster of practices you describe presupposes a **Constructivist Corporate Theory**: The People is a legal fiction created to transform raw power (numbers) into legitimate authority (will).

  *   **(a)** Aggregativism cannot accommodate the practices because it cannot explain why the *method* of counting changes the *status* of the count, nor why the past binds the present.
  *   **(b)** The tension between "Prior" and "Constituted" is resolved by viewing the People as a persistent Corporation that issues specific instructions via procedure. However, the "Constituted" aspect is the democratic engine; the "Prior" aspect is the stabilizing brake.
  *   **(c)** Adopting an aggregative view would dismantle the stability of constitutional democracy. It would turn governance into a continuous, volatile plebiscite where the dead have no voice, minorities have no protection, and "decisions" are never final, only current.

  **Final Correction:** The practices do not necessarily presuppose that politicians *believe* this theory. They presuppose that the **system** requires this fiction to function. It is a "noble lie" (in the Platonic sense) or a "useful fiction" (in the Vaihinger sense) required to convert the violence of majority rule into the authority of self-government.
