prompt: |-
  I teach an upper-level seminar on memory culture and how different societies deal with a bad past -- Germany and the whole Vergangenheitsbewältigung thing, Japan, Turkey, the American South and its monuments. 14 students, one 2.5-hour session, room with movable tables. I've tried running the Germany-vs-Japan comparison as a discussion twice and it keeps going wrong: students just perform the positions they read about the night before, like they're reciting for the seminar rather than feeling why any of this is hard. So I want to flip the order: they build a memory politics from scratch, under pressure, and only meet the real cases afterwards.

  Design me a simulation for this. The setup: a fictional country (make one up, give it a one-page brief you also draft -- keep the factual seed minimal, maybe a fifth of what you're tempted to include) about 25 years out from the fall of a 20-year military dictatorship. The thing I want them to run into themselves, before anything gets named, is that "dealing with the past" sounds like one thing but is really four or five incompatible things -- prosecuting, archiving, memorializing, teaching, indemnifying -- each with different price tags, different timelines, and different constituencies, and that a coalition can vote unanimously for the slogan while agreeing on almost nothing underneath it. So: a fixed city budget and a menu of memory projects priced so they can't have all of them (a memorial at the old labor camp site, digitizing and opening the secret police files, renaming the big avenue vs. putting up contextual plaques, a school curriculum unit, pensions for victims' families, a museum), and role cards for a divided city -- victims' association, an old-regime party that's still a third of the vote, a youth faction tired of hearing about it, a business faction that wants tourism money, the historians. Some private objectives, a points scheme that doesn't need real money, hard decision points on a timeline.

  Then a second round set 15 years later: half the chairs go to players' in-game children plus a foreign investor delegation, and they have to decide what to renew, revise, or let quietly lapse -- I want to see whether the round-one consensus survives its own success. For the debrief, map what actually happened onto the concepts (monumentalizing vs. working-through, renaming vs. contextualizing, why the second generation's boredom is doing real political work), and only then connect it to the cases we've read. Tell me what will predictably go wrong the first time I run it -- I assume some faction will try to win instead of negotiate, and students who already know the German case will treat it as the answer key -- and how to handle that. And be honest about what the activity structurally can't reproduce about real memory culture: the fear is obviously gone, but I'd like to know if the timescale problem is partially fixable with the second round, and what isn't fixable at all and I'll just have to supply in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on memory culture (Germany, Japan, Turkey, American South).
      *   **Problem:** Germany-vs-Japan comparison discussions feel performative/recitative; students don't *feel* the difficulty.
      *   **Goal:** Flip the order. Simulation first (fictional country), real cases second (debrief).
      *   **Core Insight to Convey:** "Dealing with the past" isn't one thing; it's incompatible things (prosecuting, archiving, memorializing, teaching, indemnifying) with different costs, timelines, and constituencies. Consensus on slogans $\neq$ consensus on substance.
      *   **Setup:** Fictional country, 25 years post-dictatorship (20-year military rule).
      *   **Mechanics:** Fixed budget, menu of priced projects, role cards (victims, old regime, youth, business, historians), private objectives, points scheme, hard decision points.
      *   **Round 2:** 15 years later (40 years post-dictatorship). New generation + foreign investors. Decide on renewal/revision/lapse.
      *   **Debrief:** Map simulation outcomes to concepts (monumentalizing vs. working-through, etc.), then connect to real cases.
      *   **Specific Requests:** Predict pitfalls (gaming the system, treating Germany as answer key), mitigation strategies, and limitations of the simulation (what it *can't* reproduce).
      *   **Constraints:** 14 students, 2.5 hours, movable tables. One-page brief (minimal facts).

  2.  **Drafting the Fictional Country (The "Seed"):**
      *   *Name:* Needs to sound generic but plausible. "Ostralvia"? "Meridia"? Let's go with **The Republic of Vespera**.
      *   *History:* 20-year military dictatorship ("The Quiet Years"), fell 25 years ago.
      *   *Conflict:* Not a genocide (too specific/heavy for a sim), but systematic repression, disappearances, censorship, torture.
      *   *Brief:* Keep it vague enough to allow projection but specific enough to anchor decisions. Focus on the *present* tension, not the *past* horror.

  3.  **Designing the Mechanics (Round 1):**
      *   *Budget:* Needs to be tight. Let's say 100 "Memory Credits" (MC).
      *   *Menu:*
          *   Prosecutions (High cost, high conflict).
          *   Archives/Files (Medium cost, technical).
          *   Memorial/Museum (High cost, visible).
          *   Education (Medium cost, long-term).
          *   Reparations/Pensions (High recurring cost).
          *   Renaming/Context (Low cost, symbolic).
      *   *Roles (14 students):*
          1.  Victims' Assoc (3 students) - Want justice/reparations.
          2.  Legacy Party (3 students) - Want stability/forgetting.
          3.  Youth Coalition (3 students) - Want future/economy/bored with past.
          4.  Business/Tourism (3 students) - Want branding/peace.
          5.  Historians/Archivists (2 students) - Want truth/complexity.
      *   *Private Objectives:* Each faction needs a hidden win condition that might conflict with the group budget.
      *   *Voting:* Needs to force compromise. Maybe a "Coalition Threshold."

  4.  **Designing the Mechanics (Round 2):**
      *   *Time Jump:* 15 years later.
      *   *Cast:* Half original players (now "elders"), half new players (children/foreign investors).
      *   *Task:* Audit Round 1 decisions. Maintain? Cut? Modify?
      *   *New Pressure:* Foreign investment depends on "stability" vs. "human rights record."

  5.  **Addressing the "Predictable Pitfalls":**
      *   *Gaming/Winning:* Students might try to maximize points rather than negotiate. *Fix:* Make "social cohesion" a hidden metric. If conflict is too high, everyone loses points.
      *   *Germany as Answer Key:* Students might say "Just do Germany." *Fix:* The brief explicitly forbids importing specific foreign models ("The UN Observer warns against copy-pasting"). Or, during debrief, highlight why Vespera isn't Germany (different economy, different transition type).
      *   *Dominant Voices:* 14 students is a lot for one negotiation. *Fix:* Break into committees before the plenary vote.

  6.  **Addressing Limitations (What can't be simulated):**
      *   *Fear:* No one is actually afraid of the secret police returning.
      *   *Grief:* It's intellectual, not emotional.
      *   *Time:* 2.5 hours vs. decades.
      *   *Mitigation:* The debrief must explicitly name these absences. The Round 2 time jump helps with the "generational shift" aspect.

  7.  **Structuring the Response:**
      *   **Title:** Clear and engaging.
      *   **The Brief:** The one-page handout.
      *   **The Mechanics:** Budget, Menu, Roles.
      *   **The Flow:** Minute-by-minute schedule (crucial for 2.5 hours).
      *   **Round 2:** Specific instructions for the time jump.
      *   **Debrief Guide:** How to bridge sim to theory to real cases.
      *   **Pitfalls & Mitigations:** Directly answering the prompt's concerns.
      *   **Limitations:** Honest assessment of what the sim misses.

  8.  **Refining the Details (Self-Correction during drafting):**
      *   *Correction:* 14 students is an even number, but roles need to be uneven to create tension. Let's do 3-3-3-3-2.
      *   *Correction:* 2.5 hours is tight for two rounds. I need to make Round 1 fast (45 mins) and Round 2 faster (30 mins) to leave ample time for debrief (1 hour). The learning is in the debrief.
      *   *Budget:* Make the math impossible. If they want everything, they fail. They *must* cut.
      *   *The "Germany Trap":* I need to instruct the instructor specifically on how to shut down "But in Germany they..." comments during the sim.

  9.  **Final Polish:** Ensure tone is pedagogical but practical. Emphasize the *friction* the user wants to create. (The prompt asks for "honesty about what the activity structurally can't reproduce" - this is key).

  *(Self-Correction on Budget)*: Let's make the budget "Political Capital" rather than just money. Money is too abstract. Political Capital depletes if you upset a constituency. Actually, keep it simple: "National Budget" but with "Social Unrest" tracker. If Unrest gets too high, the government falls (everyone loses).

  *(Refining the Brief)*: Keep it dry. Bureaucratic. That adds to the feeling of "managing" memory rather than "feeling" it.

  *(Refining Round 2)*: The "Children" need to be played by the *same* students to show how *they* change, OR swap roles. Prompt says "half the chairs go to players' in-game children." This implies role swapping. Let's have half the students swap to "Next Gen" and half stay as "Founders." This creates inter-generational conflict within the room.

  *(Final check on constraints)*: 14 students. Movable tables. 2.5 hours.
