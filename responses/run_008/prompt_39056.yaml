answer: |-
  Here is a complete simulation design tailored to your constraints and pedagogical goals.

  # Simulation: The Vespera Memory Accord

  ## Part 1: The One-Page Brief (Handout)
  *Print this exactly as is. Do not add footnotes. Do not clarify ambiguities.*

  ***

  **REPUBLIC OF VESPERA: TRANSITIONAL JUSTICE BUDGET COMMITTEE**
  **CONFIDENTIAL BRIING NOTE | YEAR 25 POST-TRANSITION**

  **CONTEXT:**
  Twenty-five years ago, the "Quiet Directorate" (military government) collapsed. The Directorate ruled for 20 years. During this time, censorship was total, trade unions were banned, and approximately 3,000 citizens were "disappeared." Torture was systematic. Upon the transition, a general amnesty was passed to prevent a coup reversal. Now, the amnesty is expiring.

  **THE PROBLEM:**
  Public pressure for "Final Closure" is peaking. The current coalition government has allocated **100 Memory Credits (MC)** for a permanent National Memory Plan. This budget must cover the next 15 years. Any unspent credits return to the treasury; any overspending triggers a constitutional crisis (automatic failure).

  **THE MENU (Costs in MC):**
  1.  **Criminal Prosecutions:** Retry key Directorate leaders despite amnesty. (Cost: 40 MC)
  2.  **The Open Archive:** Digitize and publish all Secret Police files immediately. (Cost: 25 MC)
  3.  **The National Memorial:** Build a large monument/museum on the site of the main detention center. (Cost: 35 MC)
  4.  **Victim Pensions:** Lifetime monthly stipends for families of the disappeared. (Cost: 40 MC)
  5.  **Curriculum Reform:** Mandatory high school unit on the Directorate era. (Cost: 15 MC)
  6.  **Street Renaming:** Rename all avenues/bridges named after Directorate figures. (Cost: 10 MC)
  7.  **Contextual Plaques:** Leave names, but add historical explanation plaques. (Cost: 5 MC)

  **THE FACTIONS:**
  You represent the key voting blocs in the coalition. You must agree on a package totaling ≤100 MC. If no agreement is reached by the deadline, the government falls, and emergency powers are invoked (everyone loses).

  **WARNING:**
  Foreign investors are watching. High social unrest will lower investment. Ignoring victims will lower legitimacy. Ignoring the economy will lower stability. There is no "correct" moral outcome, only a sustainable political one.

  ***

  ## Part 2: Mechanics & Roles (14 Students)

  **Setup:** Move tables into 5 distinct clusters.
  **Time:** 2.5 Hours total.

  ### Round 1: The Founders (45 Minutes)
  **Roles (Distribution):**
  1.  **Victims' Association (3 students):** *Private Goal:* Prosecutions AND Pensions must pass. If either fails, you walk out (triggering failure).
  2.  **Legacy Party (3 students):** *Private Goal:* No Prosecutions. Stability is key. You represent the 30% who still vote for the old ideology.
  3.  **Youth Coalition (3 students):** *Private Goal:* Max budget for Jobs/Housing (not on menu). You want to spend the *least* amount of MC on memory possible. Save the money.
  4.  **Business/Tourism Board (3 students):** *Private Goal:* Memorial/Museum must pass (for tourism), but Prosecutions must fail (scares investors).
  5.  **Historians/Archivists (2 students):** *Private Goal:* Open Archive AND Curriculum must pass. Truth over comfort.

  **The Catch:**
  The total cost of all "ideal" items is **170 MC**. The budget is **100 MC**.
  Mathematically, they cannot satisfy everyone. They *must* hurt someone.
  *   Prosecutions + Pensions = 80 MC (Leaves 20 for everything else).
  *   Memorial + Archive = 60 MC.
  *   They have to choose between *Justice* (Prosecutions), *Truth* (Archive/Curriculum), *Care* (Pensions), and *Symbolism* (Memorial/Renaming).

  **Procedure:**
  1.  **Caucus (15 mins):** Factions meet internally to read private goals.
  2.  **Negotiation (20 mins):** Open floor. Draft a bill.
  3.  **Vote (10 mins):** Formal ratification. If failed, Instructor declares "Government Collapse."

  ### Round 2: The Inheritance (30 Minutes)
  **Time Jump:** 15 Years Later (Year 40 Post-Transition).
  **Role Swap:**
  *   **7 Students (The Elders):** Keep their original faction roles. They are now tired, entrenched, and defensive of Round 1 choices.
  *   **7 Students (The Next Gen/Investors):** New roles.
      *   *Children of Victims (2):* Angry that Round 1 didn't go far enough.
      *   *Children of Perpetrators (2):* Angry about being stigmatized for parents' sins.
      *   *Foreign Investors (3):* Want to buy the Memorial site for a hotel. Want "Stability."

  **The Crisis:**
  The Round 1 budget is expiring. Maintenance costs for built projects are high.
  *   **Task:** Review Round 1 decisions.
      *   If they built the Memorial: Investors want to privatize it. Do you allow this?
      *   If they opened Archives: Next Gen finds out their own parents were informants. Do you re-close them?
      *   If they did Prosecutions: Elders want to stop (enough is enough); Next Gen wants to expand.
  *   **Constraint:** You have **50 MC** for maintenance/new initiatives.

  ### Part 3: The Debrief (50 Minutes)
  *This is where the learning happens. Do not rush this.*

  **Phase 1: The Autopsy (15 mins)**
  *   Ask the Victims: Did you feel heard, or bargained with?
  *   Ask the Youth: Did memory feel like a resource drain to you?
  *   Ask the Historians: Did "Truth" get compromised for "Peace"?
  *   *Key Question:* "You all agreed 'We must deal with the past' at the start. By the end, did you agree on what that meant?"

  **Phase 2: Concept Mapping (20 mins)**
  *   Write their decisions on the board. Map them to seminar concepts:
      *   **Prosecutions** = *Judicial Memory* (Retributive).
      *   **Archives/Curriculum** = *Discursive Memory* (Working-through).
      *   **Memorial/Renaming** = *Monumental Memory* (Freezing/Canonizing).
      *   **Pensions** = *Restorative Memory* (Material).
  *   Highlight the **Incompatibility Thesis**: You likely couldn't fund Pensions *and* a Museum. Why? Because one is for the living (costly), one is for the dead (symbolic).
  *   Highlight **Generational Shift**: In Round 2, did the "Children" want to reopen wounds the "Elders" wanted to close? (This mirrors the *Vaterliteratur* generation in Germany).

  **Phase 3: Connecting to Cases (15 mins)**
  *   *Now* bring in Germany/Japan/US South.
  *   "When you blocked Prosecutions to save the Budget, who did you sound like?" (Japan/Spain).
  *   "When you built the Museum but cut Pensions, who did you sound like?" (Berlin Memorial vs. Compensation debates).
  *   "When the Investors wanted to buy the site, what does that say about the commodification of memory?" (Holocaust tourism).

  ***

  ## Part 4: Predictable Pitfalls & Mitigation

  **1. The "Germany Answer Key"**
  *   **The Risk:** A student will say, "In Germany they did X, so we should do X." This kills the simulation because it bypasses the political friction.
  *   **The Fix:** As the Instructor (acting as UN Observer/Chair), intervene immediately. "Vespera is not Germany. Your constitution forbids foreign legal precedents. You must solve this with local political capital."
  *   **Debrief Handle:** In the debrief, explicitly ask: "Why was it frustrating when I stopped you from using Germany as a model? That frustration is exactly what Japanese or Turkish activists feel when told to 'just be like Germany'."

  **2. The "Winning" Mentality**
  *   **The Risk:** The Legacy Party or Business Faction tries to "crush" the Victims to maximize points.
  *   **The Fix:** The "Government Collapse" rule. If the Victims walk out, *everyone* fails. No points. This forces the "Winners" to realize they need the Losers' signature to pass the bill. It simulates the *necessity* of coalition.
  *   **Debrief Handle:** Ask the Business Faction: "You needed the Victims to sign, but you didn't want to pay them. How did you bridge that gap? Did you offer symbolic gestures instead of money?" (This reveals *symbolic politics*).

  **3. Time Management**
  *   **The Risk:** Round 1 eats all the time. Round 2 gets skipped.
  *   **The Fix:** Be a ruthless timekeeper. Use a visible timer. At minute 45, cut the negotiation even if they are screaming. "The Budget Session is closed." The unresolved tension is data for the debrief.

  ***

  ## Part 5: Structural Limitations (Honest Assessment)

  You asked for honesty about what this *cannot* reproduce. You must state these explicitly in the debrief so students don't walk away thinking memory culture is just a budgeting game.

  **1. The Absence of Fear**
  *   **Reality:** In real transitions, voting for Prosecutions might get you killed. Voting for Archives might get your house burned down.
  *   **Sim:** It's safe. The stakes are "points."
  *   **Debrief Supply:** "You negotiated calmly. In Turkey or Chile, these meetings happen under threat of violence. The 'compromise' you made was intellectual; theirs is existential."

  **2. The Compression of Time**
  *   **Reality:** 25 years is a blink. Real memory culture takes centuries. The "boredom" of the second generation takes decades to incubate.
  *   **Sim:** You forced a generational shift in 30 minutes.
  *   **Debrief Supply:** "Round 2 felt rushed. In reality, the 'bored youth' don't arrive until the survivors are dying. The friction you felt is usually spread over 40 years, which makes it harder to see but harder to solve."

  **3. The Quantification of Grief**
  *   **Reality:** You cannot put a price on a disappeared father.
  *   **Sim:** We priced Pensions at 40 MC. This makes grief tradable.
  *   **Debrief Supply:** "Did it feel wrong to trade Pensions for a Museum? Good. That moral disgust is the point. Memory politics often forces us to commodify suffering to make it 'manageable' for the state."

  **4. The "Solution" Bias**
  *   **Reality:** Most countries *don't* solve this. They muddle through. The wound stays open.
  *   **Sim:** The game requires a vote. A decision must be made.
  *   **Debrief Supply:** "You had to pass a bill. In reality, often the bill fails, or is passed and ignored. The 'failure' to agree is sometimes the most accurate representation of memory culture."

  ## Instructor's Cheat Sheet for the "Germany Trap"
  If a student invokes Germany during the sim:
  *   **Response:** "That is an external reference. Vespera's constitution prohibits importing transitional justice models. Stick to the Menu."
  *   **Why:** You want them to invent the tension, not import the resolution.
  *   **Post-Sim:** "You wanted to use Germany as a template. Why? Because it's the 'gold standard'? Who benefits from that standard? Who is excluded by it?"

  ## Why This Order Works
  By making them build the machine *before* they see the blueprints (the readings/cases), you ensure they understand the *gears* (budget, constituencies, incompatibility) before they analyze the *output* (Berlin Memorial, Yasukuni Shrine). When you finally discuss Germany, they won't ask "What did they do?" They will ask "How did they afford to do that without collapsing the coalition?" That is the upper-level question you want.
