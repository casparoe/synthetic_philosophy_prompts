answer: |-
  Here is the concept carving you requested. I have broken this down by mapping your friend's three specific behaviors to established theories, identifying where those theories fall short of capturing her specific philosophical stance, and then offering a synthesized label.

  ### 1. Brainstorming and Mapping Candidate Concepts

  To find the right name, we need to dissect the three behaviors you observed:

  *   **Behavior A (The Interval):** Refusing a point estimate, insisting on a range (e.g., 0.2–0.5), and treating the *width* as meaningful.
      *   *Candidate:* **Imprecise Probability.** This is the mathematical framework where beliefs are represented by sets of probability measures (intervals) rather than single numbers.
      *   *Candidate:* **Second-Order Probability.** This treats probability as a distribution over probabilities. However, your friend says she "genuinely can't narrow it," which suggests she doesn't have a distribution shape (like a bell curve) over that range, just the bounds.
      *   *Candidate:* **Knightian Uncertainty.** The classic distinction between "Risk" (known probabilities) and "Uncertainty" (unknown probabilities).

  *   **Behavior B (The Betting Rule):** Only betting if favorable across the *entire* range; rejecting the midpoint.
      *   *Candidate:* **Maximin Expected Utility (MEU).** A decision rule (Gilboa & Schmeidler, 1989) where you maximize the minimum expected utility across a set of priors. If a bet wins at 0.2 but loses at 0.5, she rejects it.
      *   *Candidate:* **Lower Previsions (Walley).** In imprecise probability theory, you have a "buying price" (lower bound) and a "selling price" (upper bound). You simply do not trade if the market price falls in the gap. This matches her refusal to bet at the midpoint without necessarily assuming the worst case *will* happen, only that she isn't committed to a single price.

  *   **Behavior C (The Preference for Known):** Picking a known 30% over an ambiguous "25–40%," even though 30% is inside the range.
      *   *Candidate:* **Ambiguity Aversion.** The phenomenon demonstrated by the **Ellsberg Paradox**. People prefer known risks over unknown uncertainties.
      *   *Candidate:* **Source Preference.** Tversky and Fox's theory that people prefer sources of information they feel more competent evaluating.

  ### 2. The Nearest Established Fits

  There is no single noun in common parlance that captures the *entire* package, but in decision theory, this cluster of behaviors is formally known as **Maxmin Expected Utility (MEU) with Multiple Priors**.

  Here is how her practice aligns and diverges from the standard definitions:

  **1. Imprecise Probability (The Representation)**
  *   **Fit:** High. This is the standard term for using intervals instead of points.
  *   **Divergence:** Many imprecise probabilists (like Isaac Levi) argue that when faced with a set of probabilities, you should pick any option that is optimal for *at least one* probability in the set (E-admissibility). Your friend does the opposite: she requires the option to be optimal for *all* probabilities in the set. She is more conservative than the standard "Imprecise Probability" baseline.

  **2. Maxmin Expected Utility (The Decision Rule)**
  *   **Fit:** Very High. This explains the betting behavior (Behavior B) and the preference for the known 30% (Behavior C). If she evaluates the "25–40%" option by its worst case (25%), then the known 30% is strictly better (30% > 25%).
  *   **Divergence:** MEU is often criticized as being *too* pessimistic (assuming nature is adversarial). Your friend doesn't necessarily claim the world is adversarial; she claims the *width* is information. Standard MEU treats the set of priors as a preference parameter; she treats it as an epistemic constraint.

  **3. Knightian Uncertainty (The Philosophy)**
  *   **Fit:** Moderate. This captures the "known vs. unknown" distinction.
  *   **Divergence:** "Knightian Uncertainty" is usually a classification of the *state of the world*, not a decision *procedure*. It tells you that you don't know the odds; it doesn't tell you to use intervals or bet via maximin. Your friend has turned a classification into a methodology.

  ### 3. The Missing Name and The Coining

  While **Maxmin Expected Utility with Imprecise Probabilities** is the technical label, it describes the *math*, not the *philosophical attitude* your friend holds regarding the width of the interval.

  Most people treat an interval as "I don't know enough yet" (a deficit). Your friend treats the interval as "This is the precise shape of my knowledge" (a complete state). She believes collapsing the interval is not just difficult, but *false*.

  Since there is no clean established term for this specific philosophical stance (that interval width is substantive knowledge rather than missing data), I propose coining the term:

  #### **Epistemic Intervalism**

  **Definition:** The philosophical position that an interval probability (e.g., 0.2–0.5) is a complete, irreducible representation of an agent's epistemic state, where the *width* of the interval constitutes positive information about the stability of the evidence, rather than merely indicating a lack of information.

  **Decision Rule:** Coupled with **Robust Maximin** (acting only on conclusions that hold across the entire interval).

  **Boundary Cases:**
  1.  **Not Epistemic Intervalism:** A Bayesian who uses a wide uniform distribution (0.2–0.5) because they lack data, but would happily collapse it to 0.35 if forced to bet. (They view the width as temporary ignorance).
  2.  **Not Epistemic Intervalism:** A risk analyst who uses intervals for reporting but calculates Expected Value at the midpoint for internal decision-making. (They view the width as communicative, not decision-relevant).
  3.  **Is Epistemic Intervalism:** Your friend. She believes the "true" probability might be unknowable in principle, and the interval is the most precise truth available.

  ### 4. Confidence and Uncertainty

  **Confidence Ratings:**
  *   **95% Confidence:** That her behavior falls under the broad umbrella of **Imprecise Probability** theory.
  *   **90% Confidence:** that her betting rule is **Maximin** (or Walley's **Lower Previsions**).
  *   **90% Confidence:** that her preference for the known 30% is **Ambiguity Aversion** (Ellsberg-type).
  *   **40% Confidence:** that there is a single, established common-language term for this *specific combination* of ontology (width is info) and decision rule (maximin). It is usually described by its components (e.g., "Ambiguity-averse Imprecise Decisioning").
  *   **70% Confidence:** in the utility of the coined term **"Epistemic Intervalism"** to capture the specific philosophical nuance you noticed.

  **Point of Least Certainty:**
  I am least certain about the distinction between **Maximin Expected Utility** vs. **Walley's Lower Previsions** regarding her betting behavior.
  *   **Maximin** implies she acts as if the worst-case probability *is* the true one for decision purposes (pessimism).
  *   **Lower Previsions** implies she simply has no commitment to a single price, so she refuses to trade in the gap (suspension of judgment).
  *   *Why it matters:* If she is a Walley-style imprecise probabilist, she might accept a bet at the midpoint if offered *both sides* (a Dutch Book), whereas a Maximin decisioner would not. Your description ("she's not interested") fits both, but the philosophical justification differs. I lean toward Maximin because she explicitly compares the options (30% vs 25-40%) and chooses based on the lower bound, which is a preference ordering, not just a pricing constraint.

  ### Summary
  If you need to sound technical, call it **Maxmin Expected Utility with Multiple Priors**.
  If you want to capture the philosophical insight she has about the "width as information," call it **Epistemic Intervalism**.
  In her specific industry (Risk Analysis), this is sometimes colloquially referred to as **P-Box Analysis** (Probability Box), though that refers more to the mathematical object than the decision philosophy.

  **Recommendation:** Use **Epistemic Intervalism**. It correctly identifies that for her, the interval is not a bug of ignorance, but a feature of knowledge.
