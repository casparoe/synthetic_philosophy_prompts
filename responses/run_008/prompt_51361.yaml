      *   Name: **The Principle of Relational Stewardship.**
      *   Core: The moral aim of care is to sustain the *personhood* of the cared-for within the *relationship*, prioritizing emotional security and physical safety over autonomy or factual accuracy.
      *   Sub-clauses:
