          2.  **Protect, Don't Indulge:** When a wish threatens physical safety or the care structure, override the wish to preserve the person.
          3.  **Presence, Don't Transact:** Care requires emotional presence; financial or professional substitution is insufficient for the moral obligation of kinship.

  7.  **Checking for Friction Points (Accommodation):**
      *   *Living Arrangement:* She wanted to move in. Principle says "Protect care structure." If moving in burns out the son, the structure collapses. So it fits.
      *   *Aide:* Principle says "Presence, Don't Transact." Aide is transactional. So the user's uncertainty is resolved: The aide's care is *instrumentally* good but *morally distinct* from the son's care. The son's care constitutes the *stewardship*; the aide's constitutes *maintenance*.
