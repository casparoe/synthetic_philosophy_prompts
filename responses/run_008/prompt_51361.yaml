      *   *Prediction:* The principle suggests a *mediated truth*. You owe her the truth *filtered through safety*. You confirm the struggle without confirming the hopelessness.
      *   *Wait, the prompt asks for a prediction:* "Whether... I owe her the plain truth."
      *   *Decision:* No, you do not owe the *plain* truth. You owe a *protective* truth. The principle prioritizes emotional security over factual completeness when the fact offers no benefit and only harm.
      *   *Refinement:* Actually, looking at the "Forgetting" verdict (drifting), the pattern is avoiding unnecessary pain. But "Getting worse" is a direct question. A flat lie breaks trust. A blunt truth breaks spirit.
