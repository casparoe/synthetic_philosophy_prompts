answer: |-
  **The Principle of Relational Stewardship**

  **The Principle:**
  The moral obligation of care is to sustain the *personhood* of the cared-for within the context of a *stable relationship*. This obligation requires the caregiver to prioritize the cared-for's emotional security and physical safety over their immediate autonomy or factual accuracy, while recognizing that the moral weight of care rests on personal relational presence, which cannot be fully outsourced to money or professional services.

  This principle operates on three specific directives:
  1.  **Emotional Priority:** When a belief or wish causes distress but no physical harm, validate the emotion rather than correcting the fact.
  2.  **Structural Protection:** When a wish threatens physical safety or the long-term viability of the care arrangement, override the wish to preserve the person and the relationship.
  3.  **Non-Transferable Presence:** Care is a relational practice, not a transactional service. Financial support or professional skill substitutes for comfort, but not for the moral obligation of kinship.

  ***

  **Accommodation of Your Verdicts**

  Your existing verdicts align coherently with this principle, with one area requiring precise justification.

  *   **The 2 a.m. Purse (Emotional Priority):** Searching validates her anxiety (emotional security) rather than addressing the location of the object (factual accuracy). The principle dictates this is right because the cost to you is low, and the benefit to her personhood (feeling heard/safe) is high.
  *   **The Forgetting Question (Emotional Priority):** Drifting avoids inflicting the trauma of the diagnosis when she cannot process it. This preserves her emotional security over factual transparency.
  *   **The Driving Refusal (Structural Protection):** Driving poses an irreversible physical threat. The principle dictates that safety overrides autonomy when the consequence is catastrophic harm.
  *   **The Brother (Non-Transferable Presence):** His financial contribution secures comfort (service), but his absence abandons the relationship (stewardship). The principle confirms your gut verdict: he is failing the moral obligation of kinship because care requires presence.
  *   **The Paid Aide (Non-Transferable Presence):** The principle resolves your uncertainty here. The aide's care counts morally as *professional service*, which is valuable and necessary, but it is distinct from *filial stewardship*. You are not morally equivalent to the aide; your role is to anchor her identity and history, while her role is to manage daily tasks. You do not owe the aide the same gratitude you would owe a family member, nor do you owe your mother the same *type* of presence the aide provides.

  **The "Unsquareable" Verdict: The Living Arrangement**
  You stated you cannot square your refusal to let her move in with the idea that caring means responding to wishes. Under Relational Stewardship, this verdict is accommodated under **Structural Protection**.
  *   **Justification:** Caring is not about satisfying the *patient's* current wants, but sustaining the *relationship's* future capacity. If moving her in would lead to your burnout, resentment, or the collapse of your ability to visit and advocate, the care structure fails. By choosing assisted living near you, you prioritized the long-term viability of your stewardship over her immediate wish.
  *   **Caveat:** This verdict holds *only* if your decision was based on the sustainability of care, not merely your own convenience. If the arrangement is sustainable for you but you refused simply because you value your privacy more than her wish, the principle would condemn that choice. Assuming you acted to preserve the quality and duration of your care, the principle supports you.

  ***

  **Prediction: The Question of Progression**

  **The Case:** She asks you directly, "Am I going to get worse?"
  **The Prediction:** The Principle of Relational Stewardship predicts that **you do not owe her the plain truth.**

  **Reasoning:**
  1.  **Emotional Priority vs. Factual Accuracy:** Like the "forgetting" verdict, this question touches on her emotional security. The "plain truth" (e.g., "Yes, you will lose your memory and independence") offers her no agency to change the outcome. It provides factual accuracy at the cost of despair.
  2.  **Personhood Preservation:** In early Alzheimer's, the understanding of "getting worse" is often abstract and terrifying. Confirming this can accelerate anxiety and depression, degrading her current personhood.
  3.  **The Obligation:** You owe her an answer that preserves hope and connection without lying about the immediate reality. The principle suggests a *protective truth*.

  **Recommended Response:**
  Do not say "No" (a lie that breaks trust if discovered) and do not say "Yes, significantly" (the plain truth that crushes spirit). Instead, answer with a commitment of stewardship: *"You might have some tough days, but I am here and we will handle whatever comes together."*

  This satisfies the principle because it addresses the fear (abandonment/helplessness) rather than the medical prognosis, sustaining her personhood within the safety of your relationship.
