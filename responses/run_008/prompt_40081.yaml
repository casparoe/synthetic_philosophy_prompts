answer: |-
  You have stumbled upon one of the most persistent ghosts in the machine of philosophy of mind, now resurrected within machine learning. The short answer is yes: philosophy has fought this fight, primarily under the banner of the **Indeterminacy of Translation**.

  Here is the breakdown of the positions, the specific rejoinders regarding weights, and where the analogy between human cognition and neural networks begins to fray.

  ### 1. The Names of the Stances

  **The "Behaviour Only" Stance**
  The view that there is "no fact of the matter" regarding internal representations, provided the input-output behaviour remains identical, is most famously associated with **W.V.O. Quine**. In *Word and Object* (1960), Quine argued for the **Indeterminacy of Translation**. His thought experiment involves a linguist trying to translate a native speaker's word "Gavagai" upon seeing a rabbit. Does it mean "rabbit", "undetached rabbit part", or "temporal stage of a rabbit"? Quine argues that if all three hypotheses predict the speaker's behaviour perfectly, there is no objective fact about which meaning is correct.

  In the context of neural networks, this is often coupled with **Functionalism**. Functionalism posits that mental states (or representations) are defined by their causal role (inputs and outputs) rather than their physical substrate. If two internal decompositions play the exact same functional role, a strict functionalist must admit they are equivalent.

  **The "Fact of the Matter" Stance**
  The opposing view—that one decomposition is genuinely *correct* and the other is merely a convenient fiction—is a form of **Representational Realism** (or **Computational Realism**). In the specific subfield of AI safety and interpretability, this is the driving assumption behind **Mechanistic Interpretability**. Proponents argue that the network is a causal mechanism, and like a car engine or a biological circuit, it has a true structure that explains *how* it achieves its function, not just *that* it achieves it. They argue that some decompositions are "natural kinds" while others are gerrymandered.

  ### 2. The "Look at the Weights" Objection

  You noted that someone suggested looking at the weights to break the tie, and that this recurses the problem. You are correct, and there is a standard name for this in both fields.

  **In Machine Learning:** This is known as **Basis Invariance** (or the **Permutation Symmetry** problem). In a standard feed-forward network, you can permute the neurons in a hidden layer and invert the corresponding weights without changing the function the network computes. More subtly, you can often rotate the activation space (change the basis) and find a new set of weights that produces identical behaviour. Therefore, the raw weights do not uniquely identify a semantic decomposition.

  **In Philosophy:** This is a specific instance of the **Underdetermination of Theory by Data**. The "data" here is the weights and the behaviour; the "theory" is the interpretation of what the features represent. If multiple theories fit the data equally well, the data cannot confirm one over the other.

  **The Standard Rejoinder:**
  The rejoinder to the "look at the weights" move is that weights are not the ontology; **activations** are. One cannot interpret weights in isolation; one must interpret the geometry of the activation space. However, this invites the same critique: which geometry is the "real" one?
  A more robust philosophical counter is to appeal to **Causal Specificity**. Even if two models are behaviourally equivalent, one decomposition might align with the actual *causal history* of the training process. If Feature A causally drove the gradient updates in a way Feature B did not (despite being mathematically equivalent in the final state), a realist might argue Feature A is the "real" one. This is contentious, but it is the primary avenue realists pursue.

  ### 3. Designer Intent and Training Procedure

  You asked if the training procedure or designer's intent pins down the decomposition. In philosophy of language, this appeals to **Teleosemantics**.

  **Teleosemantics** (championed by Ruth Millikan and David Papineau) argues that the content of a representation is determined by its "proper function"—what it was selected to do. For a human heart, the function is to pump blood because that is what evolution selected it for. For a neural net, the "selection" is the optimisation process (gradient descent) minimising a loss function.

  **Does this solve it?**
  Not entirely. While the *loss function* provides a teleological goal (e.g., "predict the next token"), it does not necessarily specify the *method*. There are often many distinct internal algorithms that minimise the same loss. This is known in physics as **Gauge Freedom**. Unless the training dynamics constrain the network to a specific basin of attraction that corresponds to a specific decomposition, the teleological argument remains underdetermined. The "intent" of the designer is usually too high-level (e.g., "classify cats") to dictate the low-level feature decomposition (e.g., "edge detectors vs. texture detectors").

  ### 4. Where the Analogy Strains

  While the Quinean analogy is potent, there are critical disanalogies between human cognition and neural networks that change the stakes.

  **1. Access to the Substrate**
  With humans, we are stuck with "black box" observation (behaviour) and noisy neuroimaging. We cannot inspect the synaptic weights directly. With neural networks, we have **white box access**. We can inspect every weight and activation. The problem is not *access*, but *ontology*. We have all the physical facts, yet we still lack the semantic facts. This makes the neural net case arguably *harder* philosophically: even with complete physical knowledge, the meaning remains indeterminate.

  **2. Evolution vs. Optimisation**
  Human concepts are shaped by millions of years of evolutionary pressure and embodied interaction with the world. This provides a rich causal history that teleosemantics can latch onto. Neural networks are trained over days or weeks on static datasets. Their "evolutionary history" is thin. This makes the realist claim weaker for networks; there is less "selection pressure" to carve nature at its joints, and more pressure to simply hack the loss function.

  **3. The Normative Element**
  Human language involves **normativity**. We can be *wrong* about what a word means. With neural networks, "meaning" is purely descriptive. If a network uses a bizarre, rotated basis to classify images, it isn't "wrong" in the way a human misusing a word is wrong; it is just an alternative implementation. The lack of normative constraints makes the "no fact of the matter" stance more palatable for AI than for human psychology.

  ### Summary

  *   **The "Behaviour Only" View:** **Quinean Indeterminacy of Translation** (or Logical Functionalism).
  *   **The "Fact of the Matter" View:** **Representational Realism** (or Mechanistic Interpretability).
  *   **The "Weights" Objection:** **Basis Invariance** (ML term) or **Underdetermination** (Philosophical term).
  *   **The Intent Argument:** **Teleosemantics**, though it struggles due to the multiplicity of loss-minimising solutions.

  If you need a single phrase to describe the disagreement in a paper, you might frame it as a conflict between **Functional Equivalence** and **Structural Realism**. The third party shrugging is essentially adopting a **Quinean** stance: they are treating the network as a "black box" where internal structure is ontologically idle if it makes no behavioural difference.
