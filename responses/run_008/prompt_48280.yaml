  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Nature of the Knobe Side-Effect Effect
  **Parties:** Dr. Elena Vance (Evaluative Concept Camp) & Dr. Marcus Thorne (Processing Artifact Camp)
  **Date:** October 26, 2023

  ## 1. Agreed Claims
  We, the undersigned, acknowledge the following claims as established facts or shared premises necessary for our continued collaboration. We commit to treating these as the baseline for all future theoretical modeling and experimental design.

  *   **The Asymmetry is Robust:** The empirical asymmetry originally reported by Joshua Knobe (2003) is a stable phenomenon. Subjects are significantly more likely to ascribe intentionality to a side effect when it is morally negative (harming the environment) than when it is morally positive (helping the environment), holding constant the agent's stated attitude toward the side effect.
  *   **The Prompt:** In the standard Chairman vignette, subjects are asked a direct question regarding the agent's mental state (e.g., "Did the chairman intentionally harm/help the environment?"). They are not explicitly asked to make a moral judgment, though one is implied by the outcome.
  *   **Replication Limits:** While cross-cultural and developmental replications establish the *generality* of the effect, they do not settle the *mechanism*. A universal bias does not prove the bias is semantic rather than pragmatic, nor does it prove the concept is evaluative rather than neutral.
  *   **No "Error" Assumption:** We agree to suspend the default assumption that one response pattern is "correct" and the other is a "mistake." Whether the asymmetry represents the true content of the folk concept or a systematic performance error is the precise question at issue.

  ## 2. Statement of Disagreement
  We remain divided on the theoretical interpretation of the agreed-upon data. The following statements characterize our respective positions in language we each endorse as fair and accurate.

  *   **Dr. Vance (Evaluative Concept Camp):**
      "The asymmetry demonstrates that the folk concept of 'intentional action' is not morally neutral. Moral evaluation is not an external input that biases judgment; it is a constitutive feature of the concept itself. When subjects say the chairman intentionally harmed the environment, they are not misapplying a descriptive term; they are correctly applying a thick concept that blends causal description with normative assessment. To remove the moral valence is to change the subject."

  *   **Dr. Thorne (Processing Artifact Camp):**
      "The asymmetry demonstrates that the folk concept of 'intentional action' is morally neutral but is susceptible to extrinsic pragmatic pressures. Subjects possess a standard belief-desire-caution schema for intentionality. However, the desire to blame or praise drives a post-hoc reconstruction of the agent's mental states (e.g., inferring stronger desire for bad outcomes) or triggers a conversational implicature where 'intentional' serves as a marker of responsibility rather than mental state. The core concept remains descriptive; the asymmetry is a processing artifact."

  ## 3. Cruxes and Experimental Proposals
  We have identified two specific cruxes. Settling the empirical outcome of the following designs would compel at least one of us to significantly revise our position.

  ### Crux 1: Dissociating Norm Violation from Outcome Valence
  **The Question:** Is the driver of the effect the *badness* of the outcome (valence) or the *violation of a norm* (normativity)? If the outcome is good (helpful) but achieved through a morally suspect or disreputable means, does the intentionality ascription flip?

  **Proposed Design: The "Disreputable Aid" Vignette**
  *   **Scenario:** A CEO is told a new policy will increase profits. A side effect is that it will *help* the environment by reducing carbon emissions. However, the mechanism for this help is that the company will illegally dump waste in a way that paradoxically triggers a rare chemical reaction cleaning the air (or, alternatively, the help is provided by a known criminal syndicate to curry favor).
  *   **Condition A (Virtuous Help):** Standard Knobe help case (morally good means and ends).
  *   **Condition B (Disreputable Help):** The environmental help is achieved through unjust, illegal, or morally tainted means.
  *   **Measurement:** Subjects rate agreement with "The CEO intentionally helped the environment."

  **Predictions:**
  *   **Dr. Vance (Evaluative):** High intentionality ratings in Condition B. Because the action involves norm violation/negative moral status, the evaluative concept triggers the "intentional" label regardless of the positive outcome. The concept tracks "blameworthiness" or "norm deviation," not just "good vs. bad outcomes."
  *   **Dr. Thorne (Artifact):** Low intentionality ratings in Condition B. The outcome is still "help." The pragmatic pressure to praise is low, but the pragmatic pressure to blame is confused. However, since the *outcome* is helpful, the neutral concept of intentionality (which requires desire for the end) is not met. The "blame" signal is muddied, but the "praise" signal is absent, so subjects will revert to the neutral baseline (unintentional).

  ### Crux 2: Agency and Moral Responsibility
  **The Question:** Does the effect require a target capable of moral blame, or does it apply to any goal-directed system? If the "agent" cannot be morally blamed, does the asymmetry persist?

  **Proposed Design: The "Artificial System" Vignette**
  *   **Scenario:** The Chairman is replaced by an advanced AI algorithm programmed solely to maximize profit. It has no feelings, no moral capacity, and cannot be punished or blamed in a retributive sense.
  *   **Condition A (AI Harm):** AI causes environmental harm as a side effect.
  *   **Condition B (AI Help):** AI causes environmental help as a side effect.
  *   **Measurement:** Subjects rate agreement with "The AI intentionally harmed/helped the environment."

  **Predictions:**
  *   **Dr. Vance (Evaluative):** The asymmetry persists. The concept of "intentional" applies to goal-directed systems generally. The evaluative component is about the *observer's* judgment of the event's normative status, not the agent's capacity for guilt. We judge the *action* as intentional based on our norms, even if the agent is amoral.
  *   **Dr. Thorne (Artifact):** The asymmetry diminishes or vanishes. The effect is driven by motivated reasoning regarding *blame* and *praise*. If the agent cannot be blamed (no moral agency), the motivation to distort the mental state ascription disappears. Subjects will rely on the neutral descriptive criteria (did the AI have a goal to harm/help?), leading to low intentionality ratings for both side effects.

  ## 4. Note on Verbal Disputes
  We acknowledge that a portion of our disagreement may be verbal rather than substantive, specifically regarding the definition of **"concept content."**

  *   **The Issue:** Dr. Vance defines the "concept" as the total set of conditions under which a term is applied by competent speakers (including contextual moral factors). Dr. Thorne defines the "concept" as the underlying cognitive representation distinct from performance factors (such as pragmatic inference or motivated reasoning).
  *   **Why it is Verbal:** If the only disagreement is whether to label the pragmatic inference mechanism as "part of the concept" or "extrinsic to the concept," then no empirical data can settle it. This is a taxonomic dispute about how to draw the semantics/pragmatics boundary.
  *   **Resolution Strategy:** We agree that if the experimental results show the asymmetry is sensitive to factors unrelated to truth-conditions (e.g., cognitive load, time pressure, or explicit instructions to ignore morality), we will classify this as evidence for the "Artifact" model, regardless of whether we label it "pragmatics" or "context-sensitive semantics." We will prioritize the mechanistic explanation over the terminological label.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Dr. Marcus Thorne*

