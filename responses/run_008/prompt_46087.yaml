prompt: |-
  I'm a senior analyst at a nonpartisan legislative research office. My team drafts and reviews policy briefs for state legislators — about six to ten a month — and one recurring failure mode is what our director calls "evidence drag": a brief piles up descriptive findings (obesity rates, crash statistics, wage data) and then slides, without ever stating the premise doing the work, into a recommendation. When challenged, drafters say the evidence "speaks for itself." Sometimes it nearly does; sometimes the missing premise is the whole argument, and one that a sizable share of our readers reject. Because we are nonpartisan, we cannot tell drafters which values to endorse — but we do need a defensible way to tell them when their argument silently relies on one.

  What I want from you is a review procedure, grounded in the actual philosophy here, that my analysts can run on any draft brief. To build it well, you'll need to respect a distinction that popular treatments blur: the is-ought problem is about inference (descriptive premises purporting to entail a normative conclusion), whereas Moore's naturalistic fallacy and open-question argument are about definition (identifying the property of goodness with some natural property). The procedure should draw on both where each actually applies, and should also engage the standard challenges to the gap's universality: Searle's derivation of an obligation from institutional facts, the phenomenon of thick ethical terms that are simultaneously descriptive and evaluative, and the point that many apparently factual premises are already covertly normative.

  The procedure itself should be an ordered checklist — the questions to ask of a brief, in sequence, with criteria for what counts as an adequate answer at each step, explicit stopping points where the analyst flags the brief for revision, and clearly marked handoff points where the question is one of values rather than of argument structure and must go to a person rather than a rule. It should distinguish at least these three outcomes: (1) a genuine unbridged inference, where a normative conclusion rests on purely descriptive premises and the bridge premise must be surfaced; (2) a false alarm, where the normativity was present in the premises all along — in institutional facts, in thick terms, in evaluatively loaded concepts like "harm" or "need" — and flagging a gap would be pedantry; and (3) the genuinely hard middle, where the descriptive and normative can be pried apart only at the cost of mangling the argument. It should incorporate a usable version of the open-question test as a diagnostic for outcome (1) — when substituting the natural property for the normative term leaves a substantive question rather than a triviality — while being honest about the test's limits as Moore himself and later critics understood them.

  Then run the procedure, step by step and showing its work, on these four passages of the kind we actually see:

  A. "Seat belt use reduces fatal-injury risk by roughly 45%. Despite decades of public campaigns, compliance in our state remains 88%, well below the national leader. We recommend primary-enforcement seat belt legislation."

  B. "Humans are an intensely social species with an evolved need for belonging; loneliness among adults under 30 has risen sharply over two decades. Civic associations — leagues, choirs, service clubs — are the natural vehicle for this need. The legislature should fund community-civic grants."

  C. "Under the state statute, a landlord must return a security deposit within 30 days of lease termination or provide an itemized statement of deductions; the deposit in question was neither returned nor accounted for after 90 days. The tenant is therefore entitled to the statutory penalty."

  D. "Paid family leave is associated with measurable improvements in infant health and maternal workforce retention. Several peer states have enacted it. We recommend a twelve-week paid family leave program."

  Note that our office endorsed D in principle last session, and I personally support it — so pay special attention to what the procedure does with it. If the procedure flags D's inference in exactly the way it flags A's, that is a feature, not a bug, and I want the write-up to say so plainly; a procedure that goes easy on arguments we like is worthless to us. Include at least one passage where the procedure returns an answer I will find inconvenient, and at least one where it correctly declines to flag.

  Finally, tell me where the procedure fails. I'm thinking specifically of: briefs whose normative premises are so widely shared in our readership that surfacing them would look obtuse (does the procedure have a materiality threshold, and can one be principled rather than political?); cases where every available phrasing of the bridge premise itself contains thick terms, so the flag just relocates the problem; and the risk that a formal gap-flagging procedure becomes a rhetorical weapon — a way to bury arguments one dislikes under procedure. Say what the procedure cannot do and where it should simply hand the draft back with a note saying the value question is the whole question.

  Assume the analyst running this has a bachelor's degree, no philosophy, and about twenty minutes per brief. Keep the philosophical content load-bearing but invisible in the final output: the checklist itself should use plain language a legislative staffer would not blush to circulate, with the theory confined to the rationale you give me for each step.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure:

  1.  **Analyze the Request:**

      *   **User:** Senior analyst at a nonpartisan legislative research office.
      *   **Task:** Create a review procedure (checklist) to detect "evidence drag" (unbridged is-ought inferences) in policy briefs.
      *   **Constraints:**
          *   Must distinguish between the *is-ought problem* (inference) and *Moore's Naturalistic Fallacy* (definition).
          *   Must engage challenges to the gap (Searle's institutional facts, thick ethical terms, covert normativity).
          *   Must be an ordered checklist with criteria, stopping points, and handoff points.
          *   Must distinguish three outcomes: (1) Genuine unbridged inference, (2) False alarm (normativity present), (3) Hard middle (inseparable).
          *   Must incorporate a usable version of the Open-Question Test.
          *   Must apply the procedure to four specific passages (A, B, C, D).
          *   Must be honest about D (even if supported personally, treat it rigorously).
          *   Must include at least one inconvenient finding and one correct decline.
          *   Must explain where the procedure fails (materiality threshold, thick terms in bridge premises, weaponization risk).
          *   **Audience for Checklist:** Analysts with BA, no philosophy, 20 mins per brief. Plain language.
          *   **Audience for Rationale:** The Senior Analyst (me). Philosophical depth here.

  2.  **Deconstruct the Philosophy:**

      *   *Is-Ought (Hume):* Can you derive an "ought" from an "is"? Usually no, without a normative bridge.
      *   *Naturalistic Fallacy (Moore):* Defining "good" as a natural property (e.g., pleasure). The Open-Question Test checks this. "Is pleasure good?" is not trivial.
      *   *Searle (Institutional Facts):* "X counts as Y in context C." If you accept the institution (e.g., law), certain facts create obligations (e.g., promising, statutes). This bridges is-ought *within* the institution.
      *   *Thick Terms:* Words like "cruel," "brave," "harm." They describe and evaluate simultaneously. Separating them might distort meaning.
      *   *Covert Normativity:* Premises that look factual but imply values (e.g., "efficiency," "need").

  3.  **Drafting the Procedure (The Checklist):**

      *   *Goal:* Plain language, actionable, 20 minutes.
      *   *Structure:*
          1.  Identify the Conclusion (The "Ought").
          2.  Identify the Premises (The "Is").
          3.  Check for Institutional Bridges (Searle).
          4.  Check for Thick/Loaded Terms (Covert Normativity).
          5.  The Open-Question Test (The Gap).
          6.  Decision/Handoff.
      *   *Refinement:* Need to make sure it distinguishes the three outcomes clearly.
      *   *Step 1 (Conclusion):* What are we asking them to do/value?
      *   *Step 2 (Premises):* What facts are cited?
      *   *Step 3 (Institutional Check):* Is this about existing law/rules? If yes, likely valid (Outcome 2).
      *   *Step 4 (Loaded Terms):* Are words like "harm," "need," "crisis" used as facts? If yes, check if the definition is agreed upon.
      *   *Step 5 (The Bridge):* If 3 & 4 are clear, is there a sentence connecting the fact to the action? Use the "Because... Therefore..." test.
      *   *Step 6 (Open Question):* If we swap the value for the fact, does it sound weird?
      *   *Decision:* Flag or Pass.

  4.  **Applying the Procedure to the Passages:**

      *   *Passage A (Seat Belts):*
          *   Conclusion: Enact primary enforcement.
          *   Premises: Reduces risk (45%), Compliance low (88%).
          *   Institutional? No (recommending *new* law).
          *   Thick Terms? "Risk" is descriptive, but implied "bad."
          *   Bridge? Missing. Why does 88% compliance demand *primary enforcement* specifically? Why not education? Why is 45% risk reduction enough to mandate?
          *   Open Question: "Seat belts save lives, therefore we should mandate them." -> "Is saving lives enough to mandate behavior?" (Substantive question).
          *   Outcome: (1) Genuine unbridged inference.
      *   *Passage B (Loneliness/Civic):*
          *   Conclusion: Fund civic grants.
          *   Premises: Humans need belonging, Loneliness rising, Associations are "natural vehicle."
          *   Institutional? No.
          *   Thick Terms? "Need," "Natural." "Need" is tricky. Is it biological or normative?
          *   Bridge? "Natural vehicle" implies efficacy, but why *fund*? Why not just encourage?
          *   Outcome: (1) or (3). The "evolved need" is a strong factual claim, but the leap to *state funding* is the gap.
      *   *Passage C (Security Deposit):*
          *   Conclusion: Tenant entitled to penalty.
          *   Premises: Statute says X, Landlord did Y.
          *   Institutional? Yes (Existing statute).
          *   Bridge: The law itself is the bridge.
          *   Outcome: (2) False alarm. Searle's institutional facts apply.
      *   *Passage D (Paid Leave):*
          *   Conclusion: Enact 12-week program.
          *   Premises: Associated with health/retention improvements, Peer states enacted.
          *   Institutional? No (New policy).
          *   Thick Terms? "Improvements" (good), but descriptive in context.
          *   Bridge? Missing. Why *these* improvements justify *this* cost/mandate? Appeal to popularity ("Peer states") is a fallacy if not justified.
          *   Outcome: (1) Genuine unbridged inference. *Crucial:* Must treat this same as A, even if popular.

  5.  **Refining the "Failure Modes" Section:**

      *   *Materiality:* When is a bridge too obvious to state? (e.g., "Murder is bad"). Need a "Reasonable Disagreement" threshold.
      *   *Thick Terms in Bridge:* If the bridge is "We should reduce harm," and "harm" is thick, we haven't solved it.
      *   *Weaponization:* Analysts might use this to stall policies they dislike. Need a "Neutral Application" rule.

  6.  **Writing the Response:**

      *   *Tone:* Professional, precise, respectful of the user's expertise.
      *   *Structure:*
          1.  Introduction (acknowledging the philosophical grounding).
          2.  The Procedure (The Checklist for Analysts).
          3.  Rationale (The "Why" for the Senior Analyst).
          4.  Application (Running A, B, C, D).
          5.  Limitations (Where it fails).
      *   *Self-Correction during drafting:* Ensure I don't get too bogged down in Moore vs. Hume in the *checklist* itself. Keep the checklist pragmatic. Save the Hume/Moore/Searle distinction for the *Rationale* section.
      *   *Check:* Did I distinguish the three outcomes? Yes. Did I use the Open-Question Test? Yes. Did I handle Passage D rigorously? Yes.

  7.  **Final Polish:** Check word count and clarity. Ensure the distinction between "Inference" (Hume) and "Definition" (Moore) is clear in the rationale but doesn't confuse the checklist. Ensure the "Handoff" points are clear (when to kick to leadership/political staff).

  *(Self-Correction on Passage B)*: Passage B is tricky. "Evolved need" is a biological claim. "Natural vehicle" is a functional claim. The jump to "Legislature should fund" is the gap. Is it Outcome 1 or 3? It's likely 1 because "need" doesn't automatically imply "state obligation." I will classify it as 1 to show the procedure's rigor, but note the "thick term" complexity in the analysis.

  *(Self-Correction on Passage C)*: This is the clear "False Alarm" (Outcome 2) based on Searle.

  *(Self-Correction on Passage D)*: This must be flagged as Outcome 1, same as A. This demonstrates nonpartisan rigor.

  *(Self-Correction on Limitations)*: Be honest about the "Materiality Threshold." If every brief had to state "Death is bad," it would be unusable. The threshold is "Contestability among reasonable constituents."

  8.  **Final Review against constraints:**
      *   Ordered checklist? Yes.
      *   Criteria for adequate answer? Yes.
      *   Stopping/Handoff points? Yes.
      *   Three outcomes distinguished? Yes.
      *   Open-Question Test included? Yes.
      *   Four passages analyzed? Yes.
      *   Limitations discussed? Yes.
      *   Plain language for checklist? Yes.

  Proceed to generate output.cw
answer: |-
  ## Part I: The Review Procedure (For Analysts)

  **Title:** Policy Brief Logic Check (The "Bridge" Protocol)
  **Time Allocation:** 20 Minutes per Draft
  **Purpose:** To ensure recommendations follow logically from evidence without hiding value judgments inside factual claims.

  ### Step 1: Isolate the Conclusion
  **Action:** Highlight the specific recommendation (the "should" or "must").
  **Criteria:** It must be an action, a policy change, or a valuation.
  *   *Example:* "The legislature should fund..." or "The tenant is entitled..."
  **Stop/Handoff:** If there is no clear recommendation, return to drafter.

  ### Step 2: Map the Premises
  **Action:** List the evidence provided to support the conclusion.
  **Criteria:** These should be verifiable claims (statistics, legal texts, historical records).
  *   *Example:* "Compliance is 88%," "Statute X says Y."
  **Check:** Are any premises actually hidden recommendations? (e.g., calling a policy "harmful" without defining the harm). If yes, circle them for Step 4.

  ### Step 3: The Institutional Fact Check (Searle Test)
  **Question:** Does the conclusion follow strictly from an existing rule, law, or contract cited in the premises?
  **Criteria:**
  *   **YES:** If the brief says "Law X requires Y, and Actor did Z, therefore Penalty applies," this is a closed logical loop.
      *   **Action:** **PASS.** Do not flag. The law itself provides the "ought."
  *   **NO:** If the brief recommends *changing* the law, *creating* a new program, or spending money not currently mandated.
      *   **Action:** Proceed to Step 4.

  ### Step 4: The Loaded Term Scan (Thick Concepts)
  **Question:** Do the premises use words that describe *and* evaluate at the same time (e.g., "harm," "crisis," "need," "abuse," "efficiency")?
  **Criteria:**
  *   **Low Load:** Terms with agreed-upon technical definitions (e.g., "unemployment rate," "fatality").
      *   **Action:** Proceed to Step 5.
  *   **High Load:** Terms where reasonable people might disagree on the application or importance (e.g., "unacceptable risk," "critical need").
      *   **Action:** Check if the brief defines *why* this counts as a "harm" or "need" relevant to the state.
      *   **If Defined:** Proceed to Step 5.
      *   **If Undefined:** **FLAG.** Ask drafter to specify the metric or criterion used to label it so.

  ### Step 5: The "Because-Therefore" Gap Test (Hume/Open-Question)
  **Action:** Write a single sentence connecting the strongest premise to the conclusion using "Because [Premise], therefore [Conclusion]."
  **Question:** Does this sentence sound like a tautology (obviously true), or does it invite a "But why?" response?
  **The Substitution Test:** Replace the normative goal (e.g., "improve health") with the descriptive metric (e.g., "reduce obesity rates").
  *   *Prompt:* "We should reduce obesity rates *because* reducing obesity rates is good."
  *   **Result A (Trivial):** If the sentence feels empty but uncontestable (e.g., "We should follow the statute because the statute requires it"), **PASS** (Outcome 2).
  *   **Result B (Substantive Question):** If a reasonable reader could ask, "Is that metric the only thing that matters?" or "Is that goal worth the cost?" without being irrational, **FLAG** (Outcome 1).
      *   *Example:* "We should mandate seat belts *because* they reduce fatalities." (Reader asks: "At what cost to liberty?")
      *   **Action:** Require a "Bridge Statement." The drafter must add a sentence acknowledging the value trade-off (e.g., "Given the state's interest in preserving life outweighs the inconvenience of...").

  ### Step 6: Final Disposition
  *   **Outcome 1 (Unbridged Inference):** Flag for revision. The draft assumes a value judgment without stating it.
  *   **Outcome 2 (False Alarm):** Normativity was already present in institutional facts or agreed definitions. Clear the brief.
  *   **Outcome 3 (Hard Middle):** The argument relies on thick terms that cannot be separated without destroying the meaning (e.g., "cruelty").
      *   **Action:** **HANDOFF.** Send to Senior Analyst. This is a value dispute, not a logic error.

  ***

  ## Part II: Rationale (For Senior Analyst Use Only)

  This protocol is designed to operationalize the distinction between *inference* (Hume's Is-Ought) and *definition* (Moore's Naturalistic Fallacy), while accounting for institutional reality (Searle) and linguistic complexity (Thick Terms).

  1.  **Step 3 (Institutional Facts):** This addresses Searle's challenge to the is-ought gap. Searle argued that within an institution (like a legal system), "is" statements (e.g., "X signed a promise") generate "ought" statements (e.g., "X ought to keep the promise") via constitutive rules. Passage C relies on this. We do not flag these because the "ought" is embedded in the institutional fact of the statute.
  2.  **Step 4 (Loaded Terms):** This addresses the "covert normativity" and "thick concepts" critique. Words like "harm" or "need" appear descriptive but carry evaluative weight. If a brief treats "need" as a brute fact, it commits a category error. We force the drafter to either define the term technically (making it thin) or acknowledge the evaluation.
  3.  **Step 5 (The Gap Test):** This is the operationalized Open-Question Argument. Moore argued that if "good" were definable as "pleasure," asking "Is pleasure good?" would be trivial. It is not. Similarly, if a brief argues "We should do X because X increases GDP," we ask: "Is increasing GDP the only goal?" If that question is substantive, the inference is unbridged. This catches the "evidence drag" where data piles up but the *reason* to act on that data remains hidden.
  4.  **Outcome 3 (Handoff):** This acknowledges the limit of formalism. Some concepts (e.g., "justice," "cruelty") are inextricably thick. Trying to separate the description from the evaluation mangling the argument. At that point, the dispute is political/philosophical, not structural. That is a leadership decision, not an analyst fix.

  ***

  ## Part III: Application to Draft Passages

  ### Passage A: Seat Belt Legislation
  *   **Step 1 (Conclusion):** Enact primary-enforcement legislation.
  *   **Step 2 (Premises):** Seat belts reduce fatal injury (45%); Compliance is 88% (below leader).
  *   **Step 3 (Institutional):** No. Recommending *new* law.
  *   **Step 4 (Loaded Terms):** "Fatal-injury" is descriptive. "Compliance" is descriptive. No heavy thick terms masking values.
  *   **Step 5 (Gap Test):** "We should mandate seat belts *because* they reduce fatalities and compliance is low."
      *   *Substitution:* "We should reduce fatalities *because* reducing fatalities is the priority."
      *   *Analysis:* A reasonable reader can ask, "Does safety outweigh personal liberty in this context?" or "Is 88% low enough to warrant enforcement vs. education?" The evidence (45% reduction) does not logically entail the specific remedy (primary enforcement) without a premise about the state's authority to mandate safety.
  *   **Disposition:** **Outcome 1 (Unbridged Inference).**
  *   **Action:** Flag. Require a bridge premise stating the state's interest in safety overrides the liberty cost of primary enforcement.

  ### Passage B: Civic Grants
  *   **Step 1 (Conclusion):** Legislature should fund community-civic grants.
  *   **Step 2 (Premises):** Humans have evolved need for belonging; Loneliness rose; Associations are "natural vehicle."
  *   **Step 3 (Institutional):** No. New spending.
  *   **Step 4 (Loaded Terms):** "Need," "Natural vehicle."
      *   *Analysis:* "Need" is treated as biological ("evolved"), but the leap to *state funding* is normative. "Natural vehicle" implies efficacy, but also legitimacy.
  *   **Step 5 (Gap Test):** "We should fund civic groups *because* loneliness is rising and humans need belonging."
      *   *Analysis:* This invites the question: "Is loneliness a state responsibility?" and "Are civic groups the *only* or *best* solution?" The premise describes a human condition; the conclusion asserts a state obligation.
  *   **Disposition:** **Outcome 1 (Unbridged Inference).**
  *   **Action:** Flag. The draft assumes a sociological fact creates a fiscal obligation. Drafter must articulate the premise linking "human need" to "state appropriation."

  ### Passage C: Security Deposit
  *   **Step 1 (Conclusion):** Tenant is entitled to statutory penalty.
  *   **Step 2 (Premises):** Statute requires return in 30 days; Landlord failed to return in 90 days.
  *   **Step 3 (Institutional):** **YES.** The conclusion is derived entirely from the existing statute (constitutive rule).
  *   **Step 4 (Loaded Terms):** None. "Entitled" is a legal term of art here.
  *   **Step 5 (Gap Test):** N/A (Passed at Step 3).
  *   **Disposition:** **Outcome 2 (False Alarm).**
  *   **Action:** Clear. This is a Searle-style institutional fact. The "ought" is contained within the "is" of the statute. Flagging this would be pedantry.

  ### Passage D: Paid Family Leave
  *   **Step 1 (Conclusion):** Enact twelve-week paid family leave program.
  *   **Step 2 (Premises):** Associated with infant health/workforce retention improvements; Peer states enacted it.
  *   **Step 3 (Institutional):** No. New policy.
  *   **Step 4 (Loaded Terms):** "Improvements" (evaluative, but generally accepted as positive). "Peer states" (appeal to popularity).
  *   **Step 5 (Gap Test):** "We should enact leave *because* it improves health metrics and peers have it."
      *   *Substitution:* "We should improve infant health *because* improving infant health is the goal."
      *   *Analysis:* While "health" is a good, the inference skips the cost-benefit analysis. "Improvements" does not entail "at this specific cost" or "via this specific mandate." The appeal to "peer states" is descriptive, not normative (others doing it doesn't mean we *should*).
  *   **Disposition:** **Outcome 1 (Unbridged Inference).**
  *   **Action:** **FLAG.**
  *   **Note to Senior Analyst:** I know we support this. The procedure *must* flag this exactly as it flagged Passage A. If we let D slide because we like the outcome, the protocol is partisan. The missing premise is: "The value of infant health and retention justifies the fiscal cost of the program." This must be stated, not implied by "improvements."

  ***

  ## Part IV: Failure Modes and Limitations

  You asked where this procedure fails. A tool that claims to be universal is lying. Here are the three specific breakdown points you need to manage.

  **1. The Materiality Threshold (The "Murder is Bad" Problem)**
  *   **The Failure:** If we apply Step 5 rigorously to *every* brief, we will flag arguments where the normative premise is universally shared by the readership (e.g., "We should reduce child mortality"). Surfacing the bridge ("Child life is valuable") looks obtuse and wastes time.
  *   **The Limit:** The procedure lacks a principled "materiality threshold." It relies on the analyst's judgment of what is "contestable."
  *   **The Risk:** This judgment call is where bias creeps in. An analyst might think "Liberty is more important than safety" is obvious (letting A slide) while another thinks "Health is paramount" (letting D slide).
  *   **Mitigation:** We need a "Reasonable Constituent" standard. If >90% of the electorate would reject the question "Is this goal good?", do not flag. If the goal is politically contested (e.g., funding civic groups vs. tax cuts), flag it. This is political, not philosophical, but it's the only way to make the tool usable.

  **2. The Thick Term Relocation**
  *   **The Failure:** In Step 4, we ask drafters to define loaded terms. Sometimes, the *only* available bridge premise *also* contains thick terms.
  *   **Example:** To fix Passage A, the drafter writes: "The state should prevent unnecessary harm." "Harm" is still a thick term. We haven't bridged the gap; we've just moved it upstream.
  *   **The Limit:** The procedure cannot force a reduction of thick ethical concepts into thin descriptive ones without mangling the meaning (Outcome 3).
  *   **Mitigation:** This is the **Handoff Point**. When the bridge premise itself is a value judgment (e.g., "We should prioritize equity"), the procedure stops. It cannot verify "equity." It must hand the draft to you. The procedure identifies *that* a value judgment is being made, but it cannot validate *which* value judgment.

  **3. Weaponization via Procedure**
  *   **The Failure:** Analysts can use this checklist to stall policies they dislike by demanding endless bridge premises for settled values, while waving through policies they like (as seen in the risk with Passage D).
  *   **The Limit:** A formal rule cannot prevent bad-faith application of the rule.
  *   **Mitigation:** Audit. You (Senior Analyst) must randomly sample "Passed" briefs, not just "Flagged" ones. If Passage D clears the desk without a flag, the analyst failed the protocol, regardless of the policy merit. The integrity of the office depends on applying the "Gap Test" to your own preferences more harshly than the opposition's.

  **Summary of Utility:**
  This procedure will not solve value disputes. It will not tell you if paid leave is *good*. It will tell you when a brief claims paid leave is *inevitable* based solely on health statistics. It distinguishes between **legal necessity** (Passage C), **political choice** (Passages A, B, D), and **semantic confusion** (Thick Terms). Its greatest value is not in fixing the argument, but in forcing the drafter to admit where the argument ends and the advocacy begins.
