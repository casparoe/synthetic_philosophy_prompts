answer: |-
  No, the conclusion does not survive because the analogy smuggles in contested premises about representation and function that disqualify the comparison.

  **Correspondence Table**
  | Phlogiston Theory | Folk Psychology (FP) |
  | :--- | :--- |
  | Phlogiston substance | Beliefs/Desires |
  | Oxygen Chemistry | Neuroscience/Connectionism |
  | Combustion observations | Behavioral prediction |
  | Elimination (false ontology) | Elimination (false ontology) |

  **Where the Mapping Breaks**
  The critical break is predictive success. Phlogiston failed to quantify weight gain during combustion; FP successfully predicts human behavior across cultures. You navigate social life using beliefs; you don't navigate chemistry using phlogiston. Secondly, FP isn't merely an explanatory hypothesis; it's constitutive of human experience. We don't infer our own beliefs; we inhabit them. Phlogiston was never lived experience. Finally, FP is embedded in language itself; you cannot report your mind without it, whereas you can describe combustion without phlogiston. This makes FP less like a theory and more like a medium.

  **The Verdict & Your Trade**
  The conclusion fails because the analogy begs the question: it assumes FP is *only* a scientific theory. If FP is a social technology or normative framework, elimination isn't the logical outcome—pluralism is. We use Newtonian physics for bridges despite General Relativity being "truer." Similarly, FP remains valid for social coordination even if neuroscience explains the substrate. 

  Fiction is exempt because novels map the phenomenological landscape, not neural states. Even if "belief" is neurologically nonexistent, the *experience* of believing is real. Your friend's "lies in a dead theory" line concedes too much; unlike phlogiston, FP describes a level of reality (the personal) that neuroscience cannot capture without losing the subject. Your toolkit describes the game, not the physics of the ball; the game persists regardless of the physics. Neuroscience explains the mechanism of the pawn moving; fiction explains why the sacrifice matters.
