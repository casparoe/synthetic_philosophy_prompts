prompt: |-
  I teach an upper-level seminar on philosophy of probability — 12 students, one 80-minute session. Design an in-class forecasting activity that makes the reference class problem felt rather than stated: participants should discover, before hearing any name for it, that different defensible groupings of "the same case" yield different and sometimes opposite probabilities, and that no rule in the evidence itself tells them which grouping is theirs.

  The rough shape I have in mind, which you should develop into something fully runnable: groups act as underwriters pricing the same risk — say, the five-year survival of one specific, described startup — but each group is handed statistics for a different reference class (all new businesses; tech startups founded by people under 25; startups in this exact niche; businesses in this particular neighborhood). Each group computes and presents a number, and the class then has to decide on a single premium, at which point they should run into the tension between more specific classes (better fit, thinner data) and broader ones (more data, worse fit), plus the suspicion that some classes are relevant and some are gerrymandered — with no criterion on hand for telling which is which. A second round should push the same tension somewhere it bites harder: a case where membership in the class is not independent of the quantity being estimated — something in the neighborhood of the Doomsday reasoning, though students shouldn't hear that name until the debrief.

  Deliverables: the setup, rules, materials, and a minute-by-minute timeline; how the two rounds are sequenced and what the second one adds the first can't; and a debrief that maps what actually happened onto the problem — what makes a class defensible, whether there could be a fact of the matter about the "right" class, how the self-selection case differs from the mundane one, and where this connects to anthropic reasoning more generally. Then provide two tables. The first should map moments in the activity onto the idea (columns: moment, what participants will typically have done by then, the part of the reference class problem it instantiates, and the facilitator question that surfaces it). The second should cover predictable failure modes (columns: what will go wrong the first time I run this, why, and how to handle it). Close with an honest note on which feature of the reference class problem no finite classroom activity can reproduce, so the facilitator must simply assert it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of probability seminar (12 students, 80 minutes).
      *   **Goal:** Design an in-class forecasting activity to make the *Reference Class Problem* (RCP) felt, not just stated.
      *   **Core Mechanism:** Groups price the same risk (startup survival) using different reference class statistics. They must discover that different groupings yield different probabilities, with no internal rule to choose the "right" one.
      *   **Structure:** Two rounds. Round 1: Standard RCP (specificity vs. data size, gerrymandering). Round 2: Self-selection/Anthropic tension (membership not independent of outcome, akin to Doomsday).
      *   **Deliverables:** Setup, rules, materials, timeline, sequencing logic, debrief guide, two tables (Moment-to-Concept mapping, Failure Modes), and a limitation note.

  2.  **Deconstruct the Activity (Round 1 - The Startup):**
      *   *Scenario:* A specific startup ("Nebula Dynamics"). Needs 5-year survival probability to price insurance/investment.
      *   *Groups:* 4 groups of 3 students.
      *   *Data:* Each group gets a different dataset/reference class.
          *   Group A: All new businesses (broad, high N, low relevance).
          *   Group B: Tech startups (narrower, medium N, medium relevance).
          *   Group C: Startups by founders < 25 (demographic, specific, maybe biased).
          *   Group D: Startups in this specific niche/neighborhood (very narrow, low N, high variance).
      *   *Task:* Calculate survival rate, set a premium.
      *   *Conflict:* When they compare, the numbers will differ wildly. Group D might have 10% survival (2/20), Group A might have 50% (500/1000). Who is right?
      *   *Philosophical Point:* The "single case" (Nebula) belongs to *all* these classes simultaneously. Evidence doesn't dictate which class is privileged.

  3.  **Deconstruct the Activity (Round 2 - The "Observer" Case):**
      *   *Goal:* Introduce the tension where *being in the class* is correlated with the *outcome*. This hints at the Doomsday Argument/Self-Indication Assumption without naming it yet.
      *   *Scenario:* Needs to be personal or observational. Let's use a "Course Completion" or "Seminar Survival" metaphor, or something slightly more abstract like "Civilization Duration."
      *   *Idea:* "The Seminar Survival Rate."
      *   *Setup:* We are currently in Week 4 of a 12-week seminar.
      *   *Reference Classes:*
          *   Class 1: All university seminars ever (High survival).
          *   Class 2: Upper-level philosophy seminars (Medium survival).
          *   Class 3: Seminars where >50% of students have already dropped out by Week 4 (Low survival).
      *   *Twist:* The students *know* they are currently sitting in the class. Their existence as observers in Week 4 is data.
      *   *Better Twist for RCP + Doomsday:* Let's use a "Bucket of Balls" analogy but framed as a real-world risk. Actually, the prompt asks for something where membership is *not independent* of the quantity.
      *   *Revised Round 2:* "The Longevity of the Cohort."
      *   *Scenario:* Predicting how long *this specific seminar group* will remain intact (no dropouts) or perhaps predicting the total enrollment of the university.
      *   *Let's go with the "Total Enrollment" (Doomsday-ish) but kept concrete.*
      *   *Scenario:* Predicting the total number of students who will *ever* take this specific course code before the university closes.
      *   *Group A:* All course codes at all universities (Huge N).
      *   *Group B:* All philosophy courses at this university (Medium N).
      *   *Group C:* All courses where *you* (the student) are currently enrolled (Self-selecting).
      *   *Wait, simpler:* Let's stick to the prompt's suggestion: "membership in the class is not independent of the quantity being estimated."
      *   *Scenario:* "Predicting the lifespan of the human species" is too cliché. Let's do "Predicting the lifespan of this specific University."
      *   *Class 1:* All organizations (50% last 10 years).
      *   *Class 2:* All universities (50% last 200 years).
      *   *Class 3:* All institutions observed by a student currently in their 2nd year (Survivorship bias).
      *   *Actually, let's make it about the Students themselves.* "Will you graduate?"
      *   *Class 1:* All enrolled students (90% graduate).
      *   *Class 2:* All students who have reached Year 3 (95% graduate).
      *   *Class 3:* All students who *asked a professor about their odds of graduating* (Maybe 50%? Anxious students).
      *   *Decision:* Let's use a "Civilization Duration" proxy that feels concrete. "The lifespan of a political regime."
      *   *Class 1:* All regimes in history.
      *   *Class 2:* All democratic regimes.
      *   *Class 3:* All regimes existing *right now* (The "Current Observer" class).
      *   *Why this works:* If I am alive *now*, I am sampling from regimes that exist *now*. Long-lasting regimes are more likely to contain "now" observers than short-lasting ones. This introduces the Self-Indication Assumption tension.
      *   *Refinement for 80 mins:* Keep it tight. Round 1 is the Startup. Round 2 is "The Duration of the Seminar Series."
      *   *Round 2 Setup:* "How many more years will this specific seminar be offered?"
      *   *Class A:* All university courses (Most last decades).
      *   *Class B:* All seminars taught by this professor (Variable).
      *   *Class C:* All seminars *currently being attended by you* (This is the trick). If the seminar lasts 20 years, there are 20x more "student-seats" available for you to occupy than if it lasts 1 year. Your presence is evidence of longevity.
      *   *This captures the "not independent" constraint.*

  4.  **Drafting the Timeline:**
      *   0-10: Intro & Round 1 Setup.
      *   10-25: Round 1 Group Work (Calc & Price).
      *   25-40: Round 1 Plenary (The Clash).
      *   40-50: Round 2 Setup & Work (The Anthropic Twist).
      *   50-65: Round 2 Plenary (The Paradox).
      *   65-80: Debrief & Theory Mapping.

  5.  **Developing the Materials:**
      *   Need specific numbers for the datasets so the math works out to conflicting results.
      *   Need clear instructions so they don't get bogged down in arithmetic.
      *   Need a "Underwriter Sheet" for them to commit to a number.

  6.  **Developing the Debrief:**
      *   Must connect the felt tension to Reichenbach/Reference Class Problem.
      *   Must distinguish Round 1 (Epistemic ambiguity) from Round 2 (Ontological/Sampling bias).
      *   Must introduce "Defeasibility" and "Gerrymandering."
      *   Must connect to Anthropics (SSA vs. SIA).

  7.  **Addressing the Tables:**
      *   Table 1: Moment -> Concept.
      *   Table 2: Failure Modes -> Mitigation.

  8.  **Addressing the Limitation:**
      *   What can't a classroom do? It can't replicate the *stakes* of real uncertainty or the *infinite regress* of meta-classes. Also, in a classroom, the "truth" is often hidden but fixed by the instructor, whereas in reality, the "true class" might not exist. I need to be honest about the "God's Eye View" limitation.

  9.  **Refining Round 2 (Crucial Step):**
      *   The prompt asks for "membership in the class is not independent of the quantity being estimated."
      *   Round 1: Startup survival. Membership (is it a startup?) is independent of outcome (will it survive?) *causally*, though statistically correlated.
      *   Round 2 needs to be about *observation selection*.
      *   Let's use the "Book Page" analogy but framed as a risk assessment.
      *   *Scenario:* You find a bound manuscript. You want to estimate the total number of pages ($N$). You see you are on page 50.
      *   *Class 1:* All manuscripts in the library (Avg length 100 pages).
      *   *Class 2:* All manuscripts with >40 pages (Avg length 300 pages).
      *   *Class 3:* All pages currently being read by a philosophy student (Bias towards longer books because there are more pages to land on).
      *   *Wait, keep it consistent with the "Underwriter" theme if possible.*
      *   *Alternative:* Insuring a "Doomsday Device."
      *   *Let's stick to the prompt's hint:* "Doomsday reasoning."
      *   *Scenario:* Estimating the total number of humans who will ever live ($N_{total}$).
      *   *Data:* Your birth rank is roughly 100 billion.
      *   *Class 1:* All intelligent species (Unknown).
      *   *Class 2:* All humans (We are in the middle?).
      *   *Class 3:* All observers who know their birth rank (Self-selection).
      *   *Problem:* Too abstract for 15 mins.
      *   *Better:* "The Duration of the Class."
      *   *Task:* Estimate the total number of students who will *ever* take this specific course.
      *   *Data:* You are student #12 in the sequence (hypothetically).
      *   *Class 1:* All courses (Avg enrollment 500).
      *   *Class 2:* All Philosophy Seminars (Avg enrollment 150).
      *   *Class 3:* All courses *currently occupied by a student* (Length-biased sampling). If a course runs for 10 years, it produces 10x more "student moments" than a 1-year course. You are more likely to be in a long-running course.
      *   *This works.* It forces them to realize that "being a student in the class" makes the class more likely to be long-lived, conflicting with the base rate of "seminars usually close quickly."

  10. **Final Review against Constraints:**
      *   12 students? Yes, 4 groups of 3.
      *   80 minutes? Yes, timeline fits.
      *   Reference Class Problem felt? Yes, via conflicting prices.
      *   Round 2 harder? Yes, introduces observer bias.
      *   Tables included? Yes.
      *   Limitation note? Yes.

  11. **Writing the Content:** (Self-Correction during drafting)
      *   *Check:* Make sure the numbers in Round 1 are distinct enough.
      *   *Check:* Ensure the debrief doesn't just lecture but draws out their confusion.
      *   *Check:* The "Limitation" needs to be philosophically precise (the lack of a "True Class" in reality vs. the instructor knowing the "True Answer" for the sake of the game).

  12. **Final Polish:** Tone should be academic but practical. Instructions must be copy-paste ready for the instructor.

  *(Self-Correction on Round 2)*: The "Length-Biased Sampling" is the key technical term for the Doomsday-like effect. I need to make sure the data packets reflect this.
  *   Packet A (Broad): "Average course lifespan: 2 years."
  *   Packet B (Narrow): "Average philosophy seminar lifespan: 4 years."
  *   Packet C (Observer): "Probability of finding a student in a course is proportional to course length." (This forces the Bayesian update).
  *   Actually, to make it *felt*, Packet C should just give the statistic: "Of all students currently enrolled in *any* seminar, 80% are in seminars that last >10 years." This contradicts Packet A (which says most seminars die in 2 years). The tension is: How can most seminars die in 2 years, but most students are in seminars lasting 10+ years? Answer: The long ones hold more students. This creates the RCP + Observer tension.

  Let's finalize the plan.
answer: |-
  # Activity: The Underwriter's Dilemma
  **Course:** Philosophy of Probability (Upper-Level Seminar)
  **Class Size:** 12 Students (4 Groups of 3)
  **Time:** 80 Minutes
  **Goal:** To embody the Reference Class Problem (RCP) and Observer Selection Effects through conflicting risk assessments.

  ---

  ## 1. Setup and Materials

  ### The Scenario
  The class acts as a consortium of insurance underwriters. A client, **Nebula Dynamics**, has applied for a "Key Person Survival Policy." If the company ceases to operate within 5 years, the policy pays out $10M. The groups must agree on a single premium (probability of failure $\times$ payout) to offer the client.

  ### Materials Needed
  *   **4 "Data Packets"** (one per group). See *Appendix A* for content.
  *   **Underwriter Sheets** (one per group): A simple form asking for "Estimated Probability of Failure (0-100%)" and "Justification (1 sentence)."
  *   **Whiteboard:** Divided into two sections: "Round 1 Prices" and "Round 2 Estimates."

  ### Group Roles (within each group of 3)
  *   **Actuary:** Performs the calculation based *only* on the provided data.
  *   **Skeptic:** Challenges whether the data provided is actually relevant to Nebula.
  *   **Spokesperson:** Presents the final number to the class.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Intro** | Explain the Nebula Dynamics scenario. Emphasize: "You must agree on one number as a consortium. You cannot average your numbers later; you must debate to a consensus." |
  | **05–20** | **Round 1** | **Group Work.** Distribute Data Packets A, B, C, D. Groups calculate failure rates and set a premium. *Constraint:* They cannot show their data packet to other groups yet. |
  | **20–35** | **Round 1** | **The Clash.** Spokespersons reveal their probabilities. Write them on the board. They will differ wildly (e.g., 10% vs. 80%). Facilitate the argument: "Why is your number right?" |
  | **35–40** | **Transition** | **The Twist.** Announce that the consortium has been hired for a second, stranger job. The stakes are epistemic, not financial. |
  | **40–55** | **Round 2** | **Group Work (Anthropic).** New Scenario: Estimating the total lifespan of *this specific university*. Distribute Packets A*, B*, C*. Packet C* introduces observer bias. |
  | **55–70** | **Round 2** | **The Paradox.** Reveal estimates. The tension should be higher here; the numbers shouldn't just differ, they should seem mutually exclusive yet defensible. |
  | **70–80** | **Debrief** | **Mapping.** Connect the activity to Reichenbach, specificity vs. stability, and anthropic reasoning. (See *Debrief Guide* below). |

  ---

  ## 3. Sequencing Logic: Why Two Rounds?

  *   **Round 1 (The Mundane RCP):** Demonstrates the **Specificity vs. Stability Trade-off**.
      *   *Broad Class:* High data stability, low relevance (e.g., "All Businesses").
      *   *Narrow Class:* High relevance, low data stability/high variance (e.g., "Tech Startups by Under-25s in this Zip Code").
      *   *Lesson:* There is no statistical rule within the data to privilege one class over another. Both are "true" descriptions of the case.

  *   **Round 2 (The Self-Selection RCP):** Demonstrates **Observer Dependence**.
      *   Here, the act of *being the estimator* changes the probability.
      *   *Lesson:* Some reference classes are "gerrymandered" not by arbitrary boundaries, but by the fact that your existence as an observer is correlated with the outcome (Length-Biased Sampling). This sets up the Doomsday Argument/Anthropic Principle without naming it immediately.

  ---

  ## 4. Appendix A: Data Packets

  ### Round 1: Nebula Dynamics
  *All groups are told: Nebula is a Tech Startup, founded by a 23-year-old, located in the University District, launched in 2023.*

  *   **Group A (The Broad Class):** "Data on **All New Business Registrations** in the state (last 20 years). Sample: 50,000 companies. 5-Year Survival Rate: **55%**."
  *   **Group B (The Industry Class):** "Data on **Tech Startups** nationally (last 10 years). Sample: 2,000 companies. 5-Year Survival Rate: **20%**."
  *   **Group C (The Demographic Class):** "Data on **Founders under age 25** (last 15 years). Sample: 500 companies. 5-Year Survival Rate: **15%**."
  *   **Group D (The Hyper-Local Class):** "Data on **Businesses in the University District** launched in 2023. Sample: 20 companies. 5-Year Survival Rate: **85%** (17 survived, 3 failed)."

  ### Round 2: University Lifespan
  *All groups are told: You are estimating the total number of years this University will exist from founding to closure. It is currently Year 100.*

  *   **Group A* (The Broad Class):** "Data on **All Private Organizations**. Median lifespan: **50 years**. (Suggests University is already past due)."
  *   **Group B* (The Institutional Class):** "Data on **Universities founded in 1924**. Median lifespan: **300 years**. (Suggests University is in early middle age)."
  *   **Group C* (The Observer Class):** "Data on **Where a Randomly Selected Student is Likely to Be**. 90% of all student-years are spent at institutions that last >200 years. (Suggests: Because you are here, it is likely a long-lasting institution)."

  ---

  ## 5. Debrief Guide (Facilitator Notes)

  Do not lecture immediately. Use the Socratic method to draw the philosophy out of their frustration.

  **Phase 1: The Reference Class Problem (Round 1)**
  *   **Q:** "Group D, you said 85% survival. Group B, you said 20%. Nebula is *both* a University District Business and a Tech Startup. How can both be true?"
  *   **Point to surface:** The "Single Case" (Nebula) is a member of infinite overlapping sets. The evidence (the data) is silent on which set is *causally relevant*.
  *   **Q:** "Group D, your sample size was 20. Group A, yours was 50,000. Does more data win?"
  *   **Point to surface:** Specificity (fit) vs. Stability (sample size). Reichenbach's positing of the "narrowest reliable class." But who decides reliability?
  *   **Q:** "Did anyone feel Group C's data was 'cheating'?"
  *   **Point to surface:** Gerrymandering. We intuitively reject classes that feel arbitrary, but we lack a formal rule for why "Age of Founder" matters less than "Industry."

  **Phase 2: The Observer Effect (Round 2)**
  *   **Q:** "In Round 2, Group C* had a very different logic. Why?"
  *   **Point to surface:** In Round 1, Nebula's existence didn't change the survival rate. In Round 2, *your presence* as a student is evidence. If the University were short-lived, there would be fewer student-years for you to occupy.
  *   **Q:** "Does this mean the probability changes depending on who is asking?"
  *   **Point to surface:** Yes. This is the bridge to Anthropics. The "Reference Class" is now "Observers like me." This leads to the Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA).
  *   **Connection:** "This is the engine of the Doomsday Argument. If you treat yourself as a random sample from 'All Humans,' your birth rank suggests humanity is near the end. If you treat yourself as a random sample from 'All Possible Observers,' it suggests humanity is large. The math depends entirely on the class you choose, and the choice determines the apocalypse."

  **Phase 3: Defeasibility**
  *   **Q:** "Is there a fact of the matter about the 'right' class?"
  *   **Conclusion:** In frequentist terms, no. In Bayesian terms, only if you have a prior over *classes* (a meta-prior), which just pushes the problem back one step. The RCP is not a calculation error; it is an ontological ambiguity in single-case probabilities.

  ---

  ## 6. Table 1: Moment-to-Concept Mapping

  | Moment in Activity | What Participants Typically Do | Part of RCP Instantiated | Facilitator Question to Surface It |
  | :--- | :--- | :--- | :--- |
  | **Round 1 Calculation** | Groups ignore data not in their packet; act as if their stat is the "true" rate. | **Isolation:** The illusion that one class is the natural default. | "Did you check if Nebula fit other descriptions before calculating?" |
  | **Round 1 Reveal** | Shock/Dismissal. "Their data is too broad." "Their sample is too small." | **Specificity vs. Stability:** The trade-off between fit and sample size. | "If specificity wins, why not use a class of size 1 (Nebula itself)? If stability wins, why not use 'All Matter'?" |
  | **Round 1 Consensus** | Groups struggle to merge numbers. They try to average or vote. | **Incommensurability:** Probabilities from different classes cannot be mathematically aggregated. | "Is the average of 20% and 85% a meaningful probability? Or just a political compromise?" |
  | **Round 2 Packet C*** | Confusion. "How does where I sit change how long the school lasts?" | **Observer Selection:** Membership in the class is correlated with the outcome. | "If the school closed in 2 years, would you be here to estimate it?" |
  | **Final Debrief** | Realization that "Probability" is relational, not intrinsic. | **Relational Probability:** Probability is a function of (Case, Class), not just (Case). | "Does Nebula *have* a probability of failure, or does it only have a probability-relative-to-a-class?" |

  ---

  ## 7. Table 2: Predictable Failure Modes

  | What Will Go Wrong | Why | How to Handle It |
  | :--- | :--- | :--- |
  | **Students try to "Google" the real answer.** | They treat it as a trivia problem, not a structural one. | **Pre-empt:** "The data in your packet is the *only* evidence in the universe. There is no outside truth." |
  | **Groups average the numbers immediately.** | They want to resolve conflict quickly. | **Rule:** "You must submit a *single* justification. You cannot say 'We averaged A and B'." |
  | **Round 2 feels too abstract.** | "University Lifespan" feels low-stakes compared to Doomsday. | **Reframe:** "Treat this as insuring the University's endowment. If you get it wrong, the fund goes insolvent." |
  | **One dominant student per group.** | The "Actuary" does all the work; others disengage. | **Role Enforcement:** "The Skeptic must sign off on the justification. If they don't, the price is rejected." |
  | **Debrief turns into "Bayesianism vs. Frequentism" debate.** | Students use the activity to fight old wars. | **Pivot:** "Both frameworks suffer from this. A Bayesian needs a prior over classes; a Frequentist needs a sequence. Both lack a rule for choosing the sequence/class." |

  ---

  ## 8. Limitation Note: What This Activity Cannot Reproduce

  **The Lack of a "God's Eye" Truth.**
  In this classroom activity, *you* (the instructor) hold the "True" answer in your head (or rather, you constructed the packets). Students may subconsciously believe that if they argue well enough, they can deduce which packet you intended to be the "correct" one.

  In reality, the Reference Class Problem is deeper: **There is no instructor.** Nature does not have a preferred classification scheme. There is no "True Class" waiting to be found. The activity simulates the *conflict* of the RCP, but it cannot fully simulate the *ontological vertigo* of realizing that the "correct probability" literally does not exist until a class is pragmatically chosen. You must assert this in the final minutes: "In this game, I am God. In the real world, there is no Game Master. The ambiguity is not a bug in your knowledge; it is a feature of the world."
