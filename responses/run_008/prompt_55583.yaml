      *   *Focus on (4):* This is the stronger philosophical break. Even if genes are the only replicators, does that make them the only *unit of selection*? Many philosophers say "Unit of Selection" = "Interactor". If so, organisms *are* units of selection, genes are units of *evolution*. The argument conflates these.
      *   *Decision:* I will argue that (4) is the primary break, but the "Arbitrary Chunk" problem shows that (1) is insufficiently precise without a stability clause. I will show how rejecting (4) saves the organism without killing the gene.

  11. **Final Polish:** Ensure the tone is analytical and respectful of the sophistication of the prompt. Use standard terminology (Dawkins, Hull, Sober, Lewontin).

