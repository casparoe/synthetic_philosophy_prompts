      *   **Diagnosing the Break:** It's primarily **(4)**, but **(1)** requires tightening to avoid the chunk problem.
      *   **Deep Dive on (4) (The Bookkeeping Claim):** Explain why reducibility doesn't equal unreality (multiple realizability, causal autonomy). Cost to Gene's-Eye: It becomes a perspective, not an ontology.
      *   **Deep Dive on (1) (The Replicator Definition):** Explain why arbitrary chunks fail the "longevity" test. Dawkins' specific definition of "gene."
      *   **The Replicator/Interactor Distinction:** Introduce Hull's distinction. This solves the "Organism isn't copied" problem. Organisms are interactors.
      *   **Costs to Positions:**
          *   *Gene Selectionism:* Gives up exclusivity.
          *   *MLS:* Must account for heredity at higher levels.
          *   *User's desired view:* Keep (1) but refine it; reject (4).
