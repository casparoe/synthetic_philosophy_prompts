answer: |-
  You are right to be suspicious. Your tech lead is compressing a centuries-old debate in social theory into a slogan, and he is using it to do rhetorical work that the logic doesn't support. He is conflating *causality* (what broke the payment pipeline) with *accountability* (who needs to fix it).

  Here is the breakdown of the distinct claims hidden inside "there are just engineers making decisions," evaluated for truth and utility for his argument.

  ### 1. The Ontological Claim
  *   **The Claim:** Groups, systems, and organizations do not exist as entities; only individual human beings exist. "The team" is a metaphor, not a thing.
  *   **Verdict:** **False (or trivially true but useless).**
      *   In physics, sure, only particles exist. But in engineering and sociology, "the system" refers to a stable pattern of interactions, constraints, and data flows. That pattern has causal power independent of who is currently sitting in the chair. If I swap you with another engineer of equal skill, the outage likely still happens because the *constraints* remain.
  *   **Does this save the Tech Lead?** **No.**
      *   Even if you grant this, it doesn't help him. You can describe the outage entirely in terms of individual actions ("Engineer A configured X, Engineer B shipped Y") and *still* conclude that the *pattern* of those actions was dictated by the incentive structure. Granting that only individuals exist does not prove that individuals acted freely rather than under constraint.

  ### 2. The Translation Claim (Methodological Individualism)
  *   **The Claim:** Any statement about a "system" can be rewritten as a sufficiently complex statement about individuals and their interactions without losing meaning.
  *   **Verdict:** **Substantive but Defensible.**
      *   This is a standard position in social science. You *can* theoretically model an organization as a sum of its agents.
  *   **Does this save the Tech Lead?** **No.**
      *   This is the trap. If you rewrite "The alerting system failed" into individual terms, you get: "Engineer A set thresholds, Engineer B didn't check them, Engineer C didn't notice."
      *   Once you have that list, the next question is: *Why?* Why did A set them there? Why didn't B check? The answer usually points back to **systemic constraints** (time pressure, legacy docs, reward structures). The translation works, but the *explanation* still points to the system.

  ### 3. The Explanatory Claim (Causal Bottoming-Out)
  *   **The Claim:** A valid explanation must eventually identify a specific human choice. If you stop at "the process failed," you haven't explained *why* the process failed.
  *   **Verdict:** **Substantive and True.**
      *   Processes don't change themselves; people change processes. A postmortem that says "the system broke" without identifying *which* human actions maintained the broken state is indeed incomplete.
  *   **Does this save the Tech Lead?** **No.**
      *   This is where he is conflating *cause* with *blame*. You can identify the human choices (e.g., "The on-call engineer chose not to escalate") and still conclude the *root cause* was systemic (e.g., "...because they were covering three services and suffered alert fatigue").
      *   Granting this claim validates your need to name the actions, but it does not validate his need to blame the actors. You can satisfy this claim and still argue for a rotation change.

  ### 4. The Normative Claim (Moral Agency)
  *   **The Claim:** Only humans can bear responsibility. You cannot punish a process. Therefore, if we don't assign responsibility to humans, no one will feel the weight of the failure and no one will learn.
  *   **Verdict:** **Substantive but Dangerous.**
      *   This is likely his *actual* concern, dressed up in metaphysics. He is worried about moral hazard: if "the system" did it, why should I work harder?
  *   **Does this save the Tech Lead?** **Only if you accept a specific definition of "learning."**
      *   If "learning" means "feeling bad so I try harder next time," he is right.
      *   If "learning" means "changing the environment so the error is impossible next time," he is wrong.
      *   **Counter-move:** You can grant this but argue that holding the *architects of the system* responsible is more effective than holding the *operator* responsible. The person who designed the solo on-call rota made a choice; hold *them* accountable, not the person who drowned in the alerts.

  ### 5. The Intervention Claim (Actionability)
  *   **The Claim:** You cannot fix a "system." You can only coach people. Therefore, systemic recommendations are unactionable.
  *   **Verdict:** **False.**
      *   This is empirically wrong in software engineering. We fix systems all the time: CI gates, automated rollbacks, quota limits. These are structural interventions that remove the need for individual decision-making.
  *   **Does this save the Tech Lead?** **No.**
      *   This is the weakest link. If he argues this, point to the alert thresholds. Those are code/config. Changing them is a system fix, not a people fix. If he says "someone has to write the config," point out that the *requirement* for manual config is the system flaw.

  ---

  ### The ML Analogy: Emergence
  You are spot on about the ML parallel. This is exactly the argument around **emergent capabilities**.
  *   **The Individualist View:** "There is no 'intelligence' in the model, just matrix multiplications and weights. If you understand the weights, you understand the output."
  *   **The Systemic View:** "The weights are too complex to trace. The 'intelligence' is a property of the architecture and the training regime, not the individual parameters. Optimizing individual weights without understanding the loss landscape is futile."

  Your Tech Lead is arguing that if you just tune the weights (coach the engineers), the model works. You are arguing that the loss landscape (the on-call rota/metrics) makes convergence impossible regardless of the weights. In ML, we generally accept that architecture (system) constrains performance more than initialization (individual).

  ### The Social Science Context (Without the Bibliography)
  This is not a new fight. It is the core tension between **Methodological Individualism** and **Structuralism**.
  *   **Methodological Individualism (Your TL):** Social phenomena must be explained by showing how they result from the actions of individuals. (Associated with Weber, Hayek, and yes, Thatcher).
  *   **Structuralism/Functionalism (You):** Social structures (laws, norms, org charts) exert pressure on individuals that explains their behavior better than their internal psychology does. (Associated with Durkheim).

  **The Synthesis:** Modern sociology generally agrees that structure and agency are a duality. Structures are made by people, but once made, they constrain people.
  *   *Example:* A traffic jam.
  *   *TL View:* "There is no traffic jam, just drivers braking."
  *   *Your View:* "The road width and merge point cause the braking."
  *   *Reality:* Both. But if you want to fix the jam, yelling at drivers (TL) works less well than adding a lane (You).

  ### How to use this in the meeting
  Your Tech Lead is using a metaphysical claim ("systems aren't real") to win a pragmatic argument ("we need accountability"). Do not fight him on metaphysics; fight him on **leverage**.

  **Say this:**
  > "I agree that humans make the choices. My postmortem lists the specific choices that led to the outage. But if we stop there, we're assuming those choices were free variables. They weren't.
  >
  > The engineer who missed the alert was mathematically guaranteed to miss it because of the rotation size. The engineer who set the bad thresholds was rewarded for doing so by our perf metrics.
  >
  > If 'there is no system,' then changing the rotation or the metrics shouldn't matter. But we know it will. I am happy to name the decisions, but I will not name the *people* as the root cause, because fixing the people doesn't prevent the next person from making the same decision in the same system."

  **The Bottom Line:**
  He needs the **Normative Claim** (people need to feel blame to learn) to be true to win his point. But in high-reliability engineering (like payments), the **Intervention Claim** (systems prevent errors better than vigilance) is the industry standard. He is arguing for a craft-shop model of engineering; you are arguing for an industrial-safety model. The outage proves the industrial-safety model is the one you need.
