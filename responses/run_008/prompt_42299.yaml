      *   *Intro:* You're right to be suspicious. The TL is compressing a complex debate into a slogan.
      *   *Claim 1: Ontological Nihilism about Groups.* (Only atoms/people exist). Verdict: False/Irrelevant. Even if true, "the rotation" is a real pattern of behavior. Doesn't help TL.
      *   *Claim 2: Methodological Individualism (Translation).* (All group talk reduces to individual talk). Verdict: Substantive/Debatable. Even if true, the reduction might show *everyone* acted rationally given the constraints. Doesn't help TL blame individuals.
      *   *Claim 3: Explanatory Bottoming-Out.* (Causes must be human choices). Verdict: Substantive. *Crucial nuance:* A choice made under bad constraints is still a choice, but the *cause* is the constraint. Granting this *does not* kill the systemic postmortem. In fact, it supports it (Why did they choose not to fix alerts? Because perf metrics rewarded shipping).
      *   *Claim 4: Normative Accountability.* (Only humans can be blamed). Verdict: Substantive. This is likely the TL's *real* point. He wants someone to feel bad/change. But "systemic" postmortems aren't about avoiding responsibility, they are about changing the *conditions* of responsibility. Granting this *might* help TL if he defines "learning" as "personal shame," but fails if "learning" is "process improvement."
