  ### Consistency Audit

  Your six planks form a coherent narrative arc, moving from historical diagnosis (1–3) to theoretical synthesis (4) and finally to prescriptive design (5–6). However, there are fractures in the logic connecting the diagnosis to the prescription. Below is an audit of the tensions within the set, ranked by severity, followed by a recommendation for a single revision.

  #### Apparent Tensions
  These pairs appear contradictory but dissolve upon closer inspection of your specific phrasing.

  *   **Plank 1 and Plank 2:** At first glance, claiming the Assembly corrected itself at Mytilene (1) while failing catastrophically at Sicily (2) suggests inconsistency. However, Plank 4 explicitly resolves this by identifying the *condition of deliberation* rather than the *constitutional machinery* as the variable. You are consistent in arguing that the same engine produces different results depending on the fuel (mood) supplied.
  *   **Plank 3 and Plank 6:** Defending the procedural legitimacy of the Socrates trial (3) while asserting that legitimacy does not track wisdom (6) is not a contradiction but a reinforcement. Plank 3 relies on the procedural definition of legitimacy that Plank 6 articulates. Both separate the *rightness of the process* from the *quality of the outcome*.

  #### Genuine Tensions
  These pairs involve logical conflicts that require one or both planks to yield ground. They are ranked by severity.

  **1. Plank 4 vs. Plank 5 (Theoretical Contradiction)**
  *   **The Conflict:** Plank 4 asserts that "Constitutions do not have a dial for the sobriety of the moment," concluding that institutional lessons are "limited." Plank 5 proposes "mandatory cooling-off periods" and review panels to grant "immunity from crowd pressure." A cooling-off period is, by definition, a dial for sobriety; it attempts to engineer a delay so that passion might cool. You cannot claim institutions cannot dial for sobriety (4) and then propose an institutional dial for sobriety (5).
  *   **Cost of Resolution:**
      *   *If Plank 4 yields:* You must admit constitutions *can* influence deliberative quality, which weakens your claim that lessons are "limited."
      *   *If Plank 5 yields:* You must reframe the proposal not as a tool for sobriety, but purely as damage limitation (slowing down the process without expecting better judgement).
  *   **Severity:** **High.** This strikes at the core of your theory of change. If Plank 4 is strictly true, Plank 5 is futile.

  **2. Plank 1 vs. Plank 5 (Evidentiary Leap)**
  *   **The Conflict:** In Plank 1, you state you have "never settled... whether the credit belongs to the institution or to the luck." In Plank 5, you advocate copying "the one structural feature that saved Mytilene." You cannot prescribe a solution based on a cause you admit is unverified. If the rescue was luck (the ships), copying the structure (reversibility) might not replicate the success.
  *   **Cost of Resolution:**
      *   *If Plank 1 yields:* You must commit to the view that the *capacity* for reversal was the decisive factor, marginalising the role of luck.
      *   *If Plank 5 yields:* You must soften the language to copying the feature that *allowed for the possibility* of salvation, rather than the feature that *saved* them.
  *   **Severity:** **Medium.** This undermines the empirical basis of your design proposal.

  **3. Plank 5 vs. Plank 6 (Normative Friction)**
  *   **The Conflict:** Plank 6 maintains that Assembly decisions are "legitimate regardless of whether they were wise." Plank 5 introduces review panels with "immunity from crowd pressure" to vet irreversible decisions. This implies that the Assembly's unmediated will is insufficient for certain acts, nudging against the pure legitimacy claim in Plank 6. If the Assembly is fully legitimate (6), why does it require a filter to validate its most serious decisions (5)?
  *   **Cost of Resolution:**
      *   *If Plank 5 yields:* You abandon the review panel, relying solely on the Assembly.
      *   *If Plank 6 yields:* You must qualify legitimacy, suggesting it is contingent on procedural safeguards, not just majority will.
  *   **Severity:** **Low-Medium.** This is a standard tension in democratic theory (popular sovereignty vs. constitutional safeguards) and is manageable if framed correctly.

  #### Recommended Revision

  To clean up the most inconsistency with the least disruption to your overall position, you should revise **Plank 4**.

  Currently, Plank 4 is too absolute ("Constitutions do not have a dial"). This creates the direct contradiction with Plank 5 and exacerbates the evidentiary weakness in Plank 1 (by dismissing institutional agency).

  **Proposed Revision to Plank 4:**
  > "Constitutions cannot *guarantee* the sobriety of the moment, but they can *mitigate the risks* of its absence. Therefore, the institutional lessons are not about ensuring wisdom, but about managing the consequences of folly."

  **Why this works:**
  1.  **Resolves 4 vs. 5:** It allows for "cooling-off periods" not as a guarantee of sobriety (which remains uncertain), but as a risk mitigation tool (which is actionable). This aligns perfectly with Plank 5's focus on "irreversibility."
  2.  **Resolves 1 vs. 5:** It allows you to credit the institution in Plank 1 without denying the role of luck. The institution provided the *mechanism* for risk mitigation; luck determined whether it worked in time. You can thus copy the mechanism (5) without needing to settle the causality of the specific historical event (1).
  3.  **Resolves 5 vs. 6:** It clarifies that the review panels in Plank 5 are not questioning the *legitimacy* of the Assembly (Plank 6), but are managing the *risk* of irreversible error. Legitimacy remains intact; the stakes are simply managed.

  This revision preserves your scepticism about human nature (Plank 2) while validating your design proposals (Plank 5), rendering the set of six planks mutually supportive.
