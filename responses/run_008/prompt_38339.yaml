answer: |-
  ### Phase 1: Brainstorming & Dependency Structure

  Before sequencing the lecture, we need to resolve the logical dependencies. You cannot explain Lakatos without explaining why Popper is insufficient, but you cannot critique Popper without first establishing what Popper actually said (to avoid the strawman). Similarly, you cannot apply Lakatos to Deep Learning (DL) without first warning them about the "hindsight problem," or they will treat the framework as a crystal ball rather than a historical reconstruction tool.

  **Logical Dependencies:**
  1.  **Naive Falsificationism:** Must be presented charitably first. It matches the *rhetoric* of ML papers ("we disprove X"), so start there to build rapport.
  2.  **The Anomaly:** Show where Naive Falsificationism fails to describe actual ML practice (e.g., we don't abandon SGD when it fails; we tweak the learning rate). This creates the *need* for Lakatos.
  3.  **Lakatosian Mechanics:** Define Hard Core, Protective Belt, Heuristics.
  4.  **The Hindsight Warning:** *Crucial.* Must come before the DL case study. If they think they can diagnose a "degenerating" programme in real-time, they will weaponize it.
  5.  **The DL Case Study:** Apply the mechanics.
  6.  **Misconception Interdiction:** Weave these throughout, not just at the end.

  **Case Study Selection:**
  *   **Hard Core:** "Scalable gradient-based optimization on large datasets yields generalizable representations." (Not "Transformers are best," but "End-to-end scaling works").
  *   **Positive Heuristic:** "Make models bigger, data richer, and optimization smoother." (Leads to Scaling Laws).
  *   **Protective Belt:** Normalization layers, specific attention mechanisms, data augmentation pipelines, LoRA adapters.
  *   **Progressive Evidence:** Scaling laws (predictive power), cross-domain transfer (Vision → Language → Biology).
  *   **Degenerating Evidence:** Adversarial robustness (constant cat-and-mouse patching), hallucination fixes (RLHF as a bandage), compute inefficiency (diminishing returns).
  *   **Honesty Constraint:** You must omit the claim that *you know the answer*. The lecture fails if you conclude "DL is degenerating." The lecture succeeds if they understand *why it is currently undecidable*.

  ---

  ### Phase 2: Lecture Sequence Plan (90 Minutes)

  #### 1. Introduction: The Methodology You Already Use (10 mins)
  *   **Hook:** "You write papers claiming to 'show' or 'prove' or 'falsify.' What do those words mean?"
  *   **Goal:** Establish that methodology isn't external; it's embedded in their review forms.
  *   **Transition:** Move to the dominant folk-philosophy of science: Popper.

  #### 2. The Popperian Setup & Its Failure in ML (15 mins)
  *   **Charitable Popper:** Define falsification not as "immediate rejection" but as "demarcation via risk." A theory is scientific if it *could* be wrong.
  *   **The ML Mismatch:** Show a typical ML paper. Does it risk the core? No. If ResNet fails, we don't say "Deep Learning is false"; we say "We need skip connections."
  *   **The Trap:** If we follow Popper strictly, almost all ML is "unscientific" because we protect the core.
  *   **Misconception Interdiction (Popper Strawman):** Explicitly state: "Popper isn't wrong; he's describing logic, not history. Lakatos describes history."
  *   **Transition:** "If we protect the core, are we being dogmatic? Lakatos says: It depends on *why*."

  #### 3. Lakatos's Machinery (20 mins)
  *   **Structure:**
      *   **Hard Core:** Irrefutable by fiat (e.g., "Gradient descent is the way").
      *   **Protective Belt:** Auxiliary hypotheses (e.g., "AdamW is the optimizer").
      *   **Negative Heuristic:** Don't touch the core.
      *   **Positive Heuristic:** How to develop the belt (e.g., "Scale up").
  *   **Progressive vs. Degenerating:**
      *   **Progressive:** Theoretically (unifies content) AND Empirically (predicts *novel* facts).
      *   **Degenerating:** Post-hoc explanations, patching anomalies without new predictions.
  *   **Misconception Interdiction (Kuhn Collapse):** Distinguish from Kuhn. Kuhn is about *sociological* shifts (community belief); Lakatos is about *rational* reconstruction (content growth). You can have two programmes running at once (Pluralism).
  *   **The Hindsight Warning (CRITICAL):** "Lakatos admits we often only know a programme was degenerating after it died. Diagnosing this *now* is speculative."
      *   *Why here?* If you wait until the case study, they will try to solve the case study. If you say it now, they treat the case study as an exercise, not a verdict.

  #### 4. Case Study: Deep Learning as a Research Programme (30 mins)
  *   **Define the Programme:** "The Deep Learning Research Programme (2012–Present)."
  *   **Map the Core/Belt:**
      *   *Core:* Representation learning via backprop is sufficient for intelligence.
      *   *Belt:* Transformers, Diffusion, BatchNorm, RLHF.
  *   **Evidence for Progressive:**
      *   Scaling Laws (Kaplan et al.): Predicting loss before training is a *novel prediction*.
      *   Emergent Abilities: Skills appearing at scale not explicitly trained.
  *   **Evidence for Degenerating:**
      *   Adversarial Examples: A decade of "defenses" that get broken (patching).
      *   Hallucinations: Solved by RLHF (preference tuning) rather than fixing the core probability modeling (patching).
      *   Compute: Gains require orders of magnitude more resources (diminishing returns).
  *   **Activity (5 mins within this block):** "Turn to your neighbor. One argues Progressive, one argues Degenerating. Use *only* the definitions from Section 3."
  *   **Misconception Interdiction (Benchmarks = Progress):** During the evidence review, explicitly flag SOTA on ImageNet/GLUE. Ask: "Is this a novel fact, or just optimizing the auxiliary belt to fit the existing test set?"
  *   **Misconception Interdiction (Degenerating = Wrong):** When discussing the degenerating evidence, note: "Ptolemaic astronomy was degenerating for centuries but still predicted eclipses. A degenerating programme can still produce useful engineering."

  #### 5. Synthesis & The "Dunking" Warning (10 mins)
  *   **Revisit the Fear:** "Why not use this to call rival labs 'degenerating'?"
  *   **Reason 1:** Hindsight. You might be in a necessary belt-adjustment phase.
  *   **Reason 2:** Pluralism. HCI might be a *different* programme, not a degenerating version of ML. (Addressing the ML/HCI audience mix).
  *   **Misconception Interdiction (Monism):** Explicitly state: "Lakatos does not require one programme to kill all others. HCI and ML can coexist as distinct programmes with different hard cores."

  #### 6. Conclusion (5 mins)
  *   **The Refusal:** "I will not tell you if DL is progressive. That is a historical judgment, not a logical one. I am not a historian of the future."
  *   **The Check Question:** (See below).

  ---

  ### Phase 3: Misconception Map & Interdiction Points

  You identified four; I am adding a fifth crucial one for this specific audience. Here is where to kill them in the sequence:

  1.  **(a) Research programmes as excuses for never giving anything up.**
      *   *Interdiction Point:* **Section 3 (Mechanics).** When defining the Negative Heuristic.
      *   *Strategy:* Emphasize that the Hard Core is protected *strategically* to allow the belt to develop, not *dogmatically*. If the belt becomes too complex relative to the core's predictive power, the core *must* eventually be abandoned. It's a loan, not a gift.
  2.  **(b) Collapsing Lakatos into Kuhn's paradigms.**
      *   *Interdiction Point:* **Section 3 (Mechanics).** Immediately after defining Progressive/Degenerating.
      *   *Strategy:* Kuhn = "The community lost faith." Lakatos = "The content stopped growing." You can have a progressive programme nobody believes in (Boltzmann), and a degenerating one everyone loves (late Ptolemy).
  3.  **(c) Reading "degenerating" as "wrong" or "unfashionable."**
      *   *Interdiction Point:* **Section 4 (Case Study).** When listing the degenerating evidence (Adversarial examples).
      *   *Strategy:* Use the Ptolemy analogy. It worked for navigation. DL works for generation. "Degenerating" means "losing heuristic power," not "failing to function."
  4.  **(d) Benchmark improvements automatically equal theoretical progress.**
      *   *Interdiction Point:* **Section 4 (Case Study).** When discussing SOTA.
      *   *Strategy:* Distinguish "Novel Facts" (predicting something previously unknown, like Scaling Laws) from "Accommodated Facts" (tuning hyperparams until ImageNet accuracy goes up). The latter is belt-tinkering.
  5.  **(e) [MISSING] Methodological Monism (There can be only one).**
      *   *Interdiction Point:* **Section 5 (Synthesis).**
      *   *Strategy:* Crucial for the HCI students. If DL is the "Progressive" programme, does HCI die? No. HCI may have a different Hard Core (e.g., "Human agency is central"). Lakatos supports pluralism. This prevents the ML students from feeling they must "conquer" HCI to be scientific.

  ---

  ### Phase 4: Final Checks

  **The Refusal to Adjudicate:**
  You must openly refuse to answer: **"Is Deep Learning currently a progressive or degenerating programme?"**
  *   *Reasoning:* Answering this requires historical distance we do not have. If you answer "Progressive," you validate the status quo uncritically. If you answer "Degenerating," you validate the "dunking" behavior you fear. The value is in the *uncertainty* and the *criteria*, not the verdict.

  **The Internalization Check Question:**
  Do not ask a definition question. Ask an application question that forces them to locate their own work within the framework.
  *   *Question:* **"Identify the 'Hard Core' of your own PhD thesis. Now, describe one finding that would force you to abandon that core versus one finding that would merely require you to adjust your 'Protective Belt.' If you cannot distinguish the two, your thesis lacks a research programme."**
  *   *Why:* This moves the framework from "how to judge others" to "how to structure my own work," neutralizing the weaponization aspect.

  ---

  ### Phase 5: The Persistent Misconception

  Despite your best efforts, one misconception is structural to the field you are teaching. Their career incentives (publications, hires, grants) are tied to benchmark performance. Philosophical nuance about "novel facts" vs. "accommodated facts" fights against their material reality. They will hear "Progressive" and think "Funding," and "Degenerating" and think "Unfundable," regardless of your Ptolemy analogies.

  \answer{Benchmark improvements automatically equal theoretical progress}
