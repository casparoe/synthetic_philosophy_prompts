      *   (5) Money Pumps + (6) No Escape Hatches: This is the "Dynamic Consistency" constraint. If you violate Independence (Allais) or handle Ambiguity (Ellsberg) in certain ways, you become dynamically inconsistent, leading to money pumps *unless* you allow escape hatches (resolute choice, planning).
