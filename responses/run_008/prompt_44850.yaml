answer: |-
  You have diagnosed the stagnation correctly, but I think your hypothesis requires sharpening on *where* the friction actually lies. You are right that the debate is stalled, and you are right that it stems from incompatible priors. However, characterizing it as three distinct talk-pasts obscures the fact that these are symptoms of a single, deeper methodological schism.

  Here is the diagnosis.

  ### 1. Evaluation of Your Hypothesis

  **On Point 1 (Logic vs. Meaning):**
  This is partially correct but misidentified. It is not that the epistemicist cares about logic while the supervaluationist cares about meaning. Both care about both. The divergence is about **theoretical conservatism**.
  The epistemicist (specifically Williamson) is a semantic conservative: they prioritize preserving classical logic and bivalence at the object language level, viewing them as non-negotiable constraints on any adequate theory of truth. The cost (sharp boundaries) is paid in the epistemology (ignorance).
  The supervaluationist is a semantic revisionist regarding truth, but a conservative regarding the "no sharp boundary" intuition. They prioritize preserving the phenomenology of vagueness (the lack of a cutoff) at the cost of bivalence and classical logic (in the penumbra).
  So, they are not answering different questions; they are weighting theoretical virtues differently. The epistemicist weights *logical simplicity* higher; the supervaluationist weights *phenomenological accuracy* higher.

  **On Point 2 (Hidden Metaphysics):**
  This is the most critical point to refine. You ask if the disagreement is about language-independent reality. It is not. Both camps generally agree that the world is not vague; the vagueness is semantic. The hidden disagreement is **metasemantic**.
  The question is: *How does use determine extension?*
  *   **The Epistemicist** claims the determination relation is sharp but opaque. Use fixes a unique extension, but the function from use to extension is so complex (involving causal history, environmental factors, etc.) that we cannot compute it. The "sharp boundary" is a semantic fact all the way down, but it is a *brute* semantic fact.
  *   **The Supervaluationist** claims the determination relation is inherently partial. Use does not fix a unique extension; it fixes a *set* of extensions.
  The metaphysical work here is done by the notion of **determinacy**. The epistemicist believes semantic facts are determinate (there is a fact of the matter about which precisification is the *actual* one, even if we can't know it). The supervaluationist believes semantic facts can be indeterminate (there is no fact of the matter about which precisification is the *actual* one).
  So, the distinction between "semantic fact" and "world fact" does not do the work you suspect. The work is done by whether one accepts *indeterminate semantic facts*. If you reject indeterminate facts (as Williamson does), you are pushed toward epistemicism. If you accept them, supervaluationism opens up.

  **On Point 3 (Protected Starting Points):**
  This is the most accurate part of your hypothesis. The debate is indeed a clash of reflective equilibria where each side treats the other's core intuition as a *reductio*.
  *   For the epistemicist, the existence of a sharp boundary is the *lesser evil* compared to giving up bivalence or classical logic.
  *   For the supervaluationist, the existence of a sharp boundary is the *greater evil*, worth sacrificing bivalence to avoid.
  Because neither "Bivalence" nor "No Sharp Cutoff" is empirically adjudicable, the argument circles. Each side accuses the other of changing the subject: the epistemicist says the supervaluationist isn't analyzing *truth* but *supertruth*; the supervaluationist says the epistemicist isn't analyzing *vagueness* but *ignorance*.

  ### 2. Is the Dispute Substantive or Verbal?

  It is **substantive**, but not in a way that allows for empirical falsification. It is a substantive disagreement about the **normative structure of semantic theory**.

  It is not verbal because they make different claims about the truth conditions of borderline sentences.
  *   Epistemicist: "This borderline patch is red" is either True or False.
  *   Supervaluationist: "This borderline patch is red" is neither True nor False.
  These are incompatible truth-assignments.

  However, it functions like a **research program clash** (in the Lakatosian sense). Each program has a "hard core" (Bivalence for Epistemicism; No Cutoff for Supervaluationism) protected by a "protective belt" of auxiliary hypotheses (Margin-for-Error principles for Epistemicism; Admissibility constraints for Supervaluationism).
  Progress within a program consists of tweaking the protective belt to handle counterexamples (like higher-order vagueness). Progress *between* programs is impossible because they disagree on what counts as a successful explanation. For the epistemicist, explaining *why we can't know* the boundary is success. For the supervaluationist, explaining *why there is no boundary* is success.

  ### 3. Where the Hidden Metaphysics Enters

  You asked: *Does the epistemicist's sharp boundary have to be a fact about the world, or can it be a semantic fact all the way down, and does that distinction even do any work here?*

  It must be a semantic fact all the way down. If it were a fact about the world, it would be ontic vagueness, which Williamson explicitly rejects. The distinction does work, but it reveals the **bruteness** of the epistemicist position.
  The epistemicist is committed to the claim that there is a fact of the matter about the extension of "bald" that is not grounded in any discernible difference in usage or physical reality. This is a robustly realist view of semantics. It treats meanings as entities that can outrun our capacity to track them, not just contingently, but in principle.
  The supervaluationist is more anti-realist about semantics: meanings are constituted by our practices, and since our practices are indeterminate, the meanings are too.
  So the metaphysics is a disagreement about **Semantic Realism**. Can semantic facts outrun the evidence provided by use?
  *   Epistemicist: Yes.
  *   Supervaluationist: No.
  This is the bedrock. If you are a semantic anti-realist (meaning is exhausted by use/verification conditions), you cannot be an epistemicist. If you are a semantic realist, epistemicism is a live option.

  ### 4. Prospects for Progress: The Honest Conclusion

  You asked for honesty about whether a resolution is possible.

  **Will a formal theorem settle it?**
  No. Formal systems are tools. You can build a classical logic with epistemic operators, or a three-valued logic, or a fuzzy logic. The choice of logic is driven by the philosophical priors discussed above, not by the math itself. A theorem showing "Classical Logic + Vagueness implies Ignorance" just tells the supervaluationist to drop Classical Logic.

  **Will psychology/linguistics settle it?**
  No. This is the Is/Ought gap for semantics. Finding that speakers *hesitate* on borderline cases does not tell us whether the hesitation is due to ignorance of a truth value (Epistemicism) or the absence of a truth value (Supervaluationism). Competence data underdetermines the semantic theory.

  **Will communication theory settle it?**
  This is the most promising avenue, but it is currently underdeveloped. If it could be shown that successful communication *requires* sharp boundaries (e.g., via Lewisian signaling games where indeterminacy leads to coordination failure), that would bolster Epistemicism. Conversely, if it could be shown that flexible/admissible ranges are *required* for robust communication in noisy environments, that would bolster Supervaluationism (or Contextualism). However, current pragmatics tends to sidestep the semantic core, treating vagueness as a pragmatic phenomenon, which dissolves the debate rather than solving it.

  **The Verdict:**
  The honest conclusion is that this is a **package deal**. The debate will not end by one side conceding. It will end in one of three ways:

  1.  **Attrition:** One framework becomes the "default" simply because it integrates better with adjacent fields (e.g., if formal epistemology moves decisively toward non-classical probability, Supervaluationism gains ground; if semantic externalism becomes dogma, Epistemicism gains ground).
  2.  **Dissolution:** A third option (likely **Contextualism** or **Interest-Relative Invariantism**) gains traction by arguing that the extension of vague predicates shifts with context, thereby dissolving the Sorites without sharp boundaries *or* truth-value gaps. (Note: Contextualism has its own severe problems with higher-order vagueness, but it is the main rival).
  3.  **Acceptance of Stalemate:** The field accepts that "vagueness" is a cluster concept and that different models serve different purposes. Epistemicism for metaphysical grounding; Supervaluationism for logical modeling of discourse.

  **Recommendation:**
  If you are looking for where the actual philosophical work is happening, it has largely moved away from the Epistemicist/Supervaluationist dyad. The energy is now in **degree theories** (which you likely know have their own compositionality issues) and **contextualist approaches**.
  However, if you want to break the stalemate on the specific terms you laid out, the leverage point is **Metasemantics**.
  The question to ask is not "Are there sharp boundaries?" but "What kind of theory of reference allows use to determine extension?"
  *   If you can argue that *any* causal-historical theory of reference entails sharp boundaries (due to the discreteness of causal chains), Epistemicism wins.
  *   If you can argue that *any* use-based theory entails indeterminacy (due to the finitude of training data), Supervaluationism wins.

  Until there is a consensus on the theory of reference, the vagueness debate will remain a proxy war for that deeper disagreement. Your intuition that the field is waiting on something nobody knows how to produce is correct: we are waiting for a decisive theory of **how meaning is grounded**. Until then, the choice between Epistemicism and Supervaluationism remains a matter of philosophical temperament, not proof.
