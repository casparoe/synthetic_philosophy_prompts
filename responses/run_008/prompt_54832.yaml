answer: |-
  Here is a structured analysis of the Mercury/General Relativity (GR) case study through the lens of Bayesian confirmation theory, designed to serve as the core argument for your term paper. It follows the disciplinary constraints you requested: precise mapping of variables, evaluation of repair strategies, distinction of epistemic agents, and an honest verdict on the limits of formalization.

  ---

  ### 1. Mapping the Variables: Hypothesis, Evidence, and Background

  To apply Bayesian confirmation theory rigorously, we must first define the propositional variables. In the standard formalism, confirmation is a relation between a hypothesis $H$, evidence $E$, and background knowledge $K$. The Mercury case reveals that these categories are not pre-theoretic givens but are themselves constructed.

  **The Hypothesis ($H$):**
  $H$ is the set of Einstein's field equations (specifically the November 1915 formulation). Crucially, $H$ is not merely a claim about Mercury; it is a universal claim about the metric structure of spacetime and the coupling of matter to geometry.

  **The Evidence ($E$):**
  Standard presentations treat $E$ as "Mercury's perihelion advances by 43 arcseconds per century beyond the Newtonian prediction." However, this is not a raw observation. It is a *residual*.
  Let $O$ be the total observed precession.
  Let $C_N$ be the calculated precession derived from Newtonian mechanics + perturbations from known planets.
  The "evidence" is the proposition $R = (O - C_N \approx 43'')$.
  This creates a formal difficulty: $R$ is defined relative to a background theory ($K_{Newton}$) that $H$ intends to supersede. In standard Bayesianism, $E$ should be a proposition whose truth value is independent of $H$. Here, the *description* of $E$ relies on the failure of the predecessor to $H$.

  **The Background ($K$):**
  $K$ includes the astronomical data ($O$), the masses and orbits of the other planets, and the validity of Newtonian mechanics for calculating their perturbations ($C_N$). Crucially, $K$ also includes the historical fact that $R$ was known since Le Verrier (1859).

  **The Vulcan Complication:**
  For decades, $R$ was not treated as a brute fact requiring a new gravity theory, but as a potential indicator of a hidden mass. Let $H_V$ be the hypothesis "There exists an intra-Mercurial planet (Vulcan) causing the perturbation."
  For the late 19th-century astronomer, the probability space was partitioned between $H_V$ and "Error in Observation/Calculation." $R$ was evidence *for* $H_V$.
  By 1915, searches for Vulcan had failed. For Einstein, $H_V$ was effectively dead. This means for Einstein, $P(R) \approx 1$ was a fixed constraint of the problem space, not a probabilistic uncertainty. This solidifies the "Old Evidence" problem: the anomaly was a known boundary condition, not a risky prediction.

  ### 2. The Formal Breakdown

  In standard Bayesian conditionalization, the posterior probability of $H$ given $E$ is:
  $$P_{new}(H) = P_{old}(H|E) = \frac{P_{old}(E|H) \cdot P_{old}(H)}{P_{old}(E)}$$

  The "Old Evidence" problem arises from the following valuation:
  1.  **$P_{old}(E) = 1$:** The 43" residual was a known astronomical fact long before 1915.
  2.  **$P_{old}(E|H) = 1$:** GR entails the 43" residual (given the boundary conditions of the solar system).
  3.  **Result:** The likelihood ratio is $1/1$. The posterior equals the prior. $H$ receives no confirmation boost from $E$.

  This verdict contradicts the scientific consensus. The Mercury fit was the primary reason physicists accepted GR in 1915–1919 (before the eclipse data). If Bayesianism cannot register this confirmation, it fails to model one of the most significant theory changes in history.

  ### 3. Epistemic Agents: Einstein vs. The Community

  A disciplined analysis must distinguish whose probabilities are being modeled. The "Old Evidence" problem manifests differently for the theory creator versus the theory consumer.

  **Einstein's Epistemic State:**
  Einstein knew the value of the anomaly (43") with high certainty. He was explicitly aiming to recover this number. For him, $E$ was a constraint, not a discovery.
  *   *Implication:* For Einstein, standard conditionalization definitely fails. He did not learn $E$. He learned that *his theory could satisfy the constraint*.
  *   *The "Design" Worry:* Because Einstein knew $E$ in advance, one might argue he could have "tuned" parameters to fit it. However, GR has no adjustable parameters for this fit (the 43" falls out of the vacuum field equations). This lack of tuning is why the fit felt confirmatory to him, even if $P(E)=1$.

  **The Community's Epistemic State (e.g., Eddington, de Sitter):**
  For the broader astronomical community, the situation is nuanced. They knew the anomaly ($E$), but they did not know that $H$ entailed $E$.
  *   When GR was published, they learned a new logical relation: $H \rightarrow E$.
  *   For them, $E$ was old, but the *explanatory connection* was new.
  *   Some historians argue that for many astronomers, the "evidence" was not just the 43", but the *failure of Vulcan* combined with the *success of GR*. This shifts the evidence to a comparative claim: $E^* = $ "GR explains the residual without ad hoc masses, whereas Newton+Vulcan does not." $E^*$ was not known with probability 1 prior to 1915.

  ### 4. Evaluating Repair Strategies

  We must evaluate the three main Bayesian repair strategies not abstractly, but by how they handle the specific mechanics of the Mercury case.

  **A. Glymour's Bootstrapping**
  *   *Mechanism:* Confirmation occurs when $H$, combined with auxiliary assumptions ($K$), allows the computation of an instance of $H$ from data ($O$).
  *   *Application to Mercury:* We use $H$ (GR) + $O$ (observed positions) to compute the metric field. We check if this field satisfies the field equations. Alternatively, we use $H$ to predict the residual from the mass of the Sun.
  *   *Verdict:* This handles the **theory-ladenness** of the evidence best. It acknowledges that the "43"" is not a raw datum but a quantity derived via the theory. It explains why the fit is significant: the theory provides the computational bridge between the Sun's mass and the orbital precession.
  *   *Limitation:* Bootstrapping is qualitative. It tells us *that* confirmation occurred, but not *how much*. It sidesteps the probability problem rather than solving it. For a paper on confirmation *theory*, this is a retreat from the Bayesian formalism rather than a repair of it.

  **B. Howson's Counterfactual (Ur-Prior) Strategy**
  *   *Mechanism:* We replace the agent's actual probability function with a counterfactual one ($P^*$) where $E$ is not known. We ask: "If we didn't know the 43" residual, would learning it raise the probability of GR?"
  *   *Application to Mercury:* We construct a prior where the perihelion advance is uncertain. In this state, $H$ predicts 43". If the observation comes in at 43", $H$ is confirmed.
  *   *Verdict:* This captures the **logical support** relation. It shows that $H$ has a structural capacity to explain $E$.
  *   *Limitation:* It fails the **historical/psychological** test. Einstein *did* know $E$. As you noted, he was aware that getting Mercury right was a constraint. A counterfactual agent who doesn't know $E$ is not Einstein. Furthermore, if the agent knows $H$ was *constructed* to fit $E$ (the "use-novelty" problem), the counterfactual confirmation should be discounted. Howson's approach requires us to ignore the heuristic history of the theory's construction, which is often where the confirmatory weight lies (i.e., that it fit without parameter tuning).

  **C. Garber's Solution (Learning the Entailment)**
  *   *Mechanism:* We expand the language of probability. The agent updates not on $E$ (which is known), but on the proposition $Q = $ "$H$ entails $E$" (or "$H$ correctly computes $E$").
  *   *Application to Mercury:* Einstein's update in November 1915 was on $Q$. He learned that his field equations yielded the 43" residual.
  *   *Verdict:* This is the **strongest fit for Einstein's perspective**. It respects that $E$ was old but the logical connection was new. It allows $P(H|Q) > P(H)$ even if $P(E)=1$.
  *   *Limitation:* It requires abandoning logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs. Garber requires a formalism where logical relations are empirical discoveries. While philosophically defensible, it moves Bayesianism away from a logic of consistency toward a logic of cognitive discovery.

  ### 5. Verdict and Limitations

  Does the Mercury episode show that Bayesian confirmation theory is broken, or merely incomplete?

  **The Verdict:**
  The episode demonstrates that the **standard synchronic formalism** of Bayesianism (updating on evidence partitions) is insufficient for modeling **diachronic theory change** involving old evidence. It does not prove Bayesianism is "wrong" in a general sense, but it proves that the domain of "learnable propositions" must be expanded beyond empirical data to include *theoretical relations* (Garber) or that we must accept non-probabilistic structural accounts (Glymour) for certain types of support.

  **Where the Theory is Silent (Admission of Limits):**
  For the sake of intellectual honesty in your paper, you should explicitly identify where Bayesianism remains silent, rather than forcing a fit:

  1.  **The "No-Tuning" Intuition:** Bayesianism struggles to capture why a fit is more confirmatory if no parameters were adjusted. In the formalism, $P(E|H)$ is 1 regardless of whether $H$ was tuned to $E$ or predicted $E$ novelly. The "surprise" value of the fit (that GR *could* get it right without tweaking) is a meta-theoretic judgment about the *space of possible theories*, not the probability of $E$. Standard Bayesianism has no variable for "theoretical flexibility."
  2.  **The Death of Vulcan:** Bayesianism models confirmation as probability raising for $H$. It is less adept at modeling confirmation as the *elimination of the only viable competitor*. The Mercury case was as much about the failure of Newton+Vulcan as the success of GR. While this can be modeled as $P(H_V) \rightarrow 0$, the *reason* for that drop (theoretical exhaustion) is external to the probability calculus.
  3.  **The Theory-Laden Residual:** As noted, $E$ is a residual defined by $K_{Newton}$. When $H$ replaces $K_{Newton}$, the meaning of the data shifts. Standard Bayesianism assumes a stable language of evidence. It cannot formally represent the shift from "Anomaly in Newtonianism" to "Prediction of Relativism" without treating them as two different evidence propositions, which obscures the continuity of the astronomical data.

  **Conclusion for the Paper:**
  The Mercury case does not refute Bayesianism, but it constrains it. It shows that a viable confirmation theory must be able to update on *logical discoveries* (Garber) and must account for the *structural relationship* between theory and data (Glymour). If you treat the Mercury episode as a demand that standard conditionalization handle old evidence without modification, Bayesianism fails. If you treat it as a demand for a richer epistemology of scientific learning—one that includes learning what our theories say—Bayesianism can survive, but only by admitting that "evidence" includes more than just "data."

  For your term paper, the strongest position is to argue that the Mercury case forces a move from **Confirmation as Probability Raising** to **Confirmation as Explanatory Integration**. The 43" arcseconds confirmed GR not because they made it more probable in a vacuum, but because they integrated a standing anomaly into a coherent system where previously there was only an ad hoc patch (Vulcan). Bayesianism can mimic this via Garber-style updates, but only if we acknowledge that the "learning" happening in 1915 was conceptual, not observational.
