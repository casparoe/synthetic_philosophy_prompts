          *   Evaluate repair strategies: Glymour (bootstrapping), Howson (counterfactual/ur-prior), Garber (learning the entailment).
          *   Distinguish between Einstein's epistemic state and the Community's.
          *   **Crucial:** Give a verdict. Does this break Bayesianism or just require extension? Admit where the theory is silent rather than forcing a fit.

  2.  **Deconstruct the Case Study (Mapping H, E, K):**
      *   *Hypothesis (H):* Einstein's Field Equations (Nov 1915 version).
      *   *Evidence (E):* The anomalous precession of Mercury's perihelion is $\approx 43$ arcseconds/century.
      *   *Background (K):* Newtonian mechanics, planetary masses, Le Verrier's calculations, the existence of the anomaly.
      *   *Nuance:* $E$ is not a direct observation. It's $O_{total} - O_{Newton}$. It relies on $K_{Newton}$ to define the residual. This is a problem for standard Bayesianism which treats $E$ as a proposition with a truth value independent of $H$.
      *   *Vulcan:* For a long time, $H_{Vulcan}$ was a live competitor. So $P(E) < 1$ for a long time? Or was $E$ the *anomaly* itself? If $E$ is "There is an unexplained 43 arcsec residual," then $P(E)=1$ by 1859. If $E$ is "Mercury moves according to GR," that's different. Standard formulation treats $E$ as the data point.

  3.  **The Core Problem (Old Evidence):**
      *   Standard Bayesian Conditionalization: $P_{new}(H) = P_{old}(H|E) = \frac{P_{old}(E|H)P_{old}(H)}{P_{old}(E)}$.
      *   If $E$ is known, $P_{old}(E) = 1$.
      *   If $H$ entails $E$, $P_{old}(E|H) = 1$.
      *   Result: $P_{new}(H) = P_{old}(H)$. No confirmation.
      *   Intuition: GR *was* confirmed by Mercury.

  4.  **Evaluate Repair Strategies (applied to Mercury):**

      *   **Glymour (Bootstrapping):**
          *   *Idea:* Confirmation isn't about probability raising, but about using $H$ + $K$ to derive $E$ from other data.
          *   *Application:* GR + Optical data $\rightarrow$ 43".
          *   *Fit:* Good for the *structure* of the derivation. It handles the theory-ladenness well (using $H$ to compute the value).
          *   *Limit:* Doesn't give a degree of confirmation. Doesn't solve the probability problem directly, sidesteps it.

      *   **Howson (Counterfactual/Ur-prior):**
          *   *Idea:* Imagine a state where $E$ is unknown. What would $P(H|E)$ be?
          *   *Application:* Construct a prior where we don't know the 43".
          *   *Problem:* Einstein *knew* the 43". He was aiming for it. The "counterfactual agent" isn't Einstein. Is it a rational agent? If the agent knows $H$ is designed to fit $E$, does $E$ still confirm $H$? (The "use-novelty" issue).
          *   *Critique:* Arbitrary. Which counterfactual state?

      *   **Garber (Learning the Entailment):**
          *   *Idea:* We don't update on $E$ (known). We update on the proposition $H \vdash E$ (that $H$ entails $E$).
          *   *Application:* Einstein learns (in Nov 1915) that *his equations* yield 43".
          *   *Fit:* Very strong for Einstein's perspective. He knew $E$, he didn't know $H \rightarrow E$.
          *   *Limit:* Requires expanding the language of probability to include logical relations as events. Computationally hard (logical omniscience).

  5.  **Distinguish Epistemic Agents:**
      *   *Einstein:* Knew $E$. Learned $H \rightarrow E$. Garber fits best.
      *   *The Community (Eddington, de Sitter, etc.):* Learned $H$ and $E$'s relation to $H$ simultaneously (or close to it). For them, $E$ might function as "new" in the context of the new theory. Or, they update on the *explanation* of the anomaly (Vulcan dies, GR lives).

  6.  **The "Theory-Laden" Aspect:**
      *   The 43" is a residual. $E$ = "Newtonian prediction fails by 43"."
