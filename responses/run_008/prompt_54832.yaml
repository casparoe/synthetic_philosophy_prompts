  11. **Final Polish:** Ensure clear headings and logical flow suitable for a term paper outline/essay. (The prompt asks for the content of the paper essentially, structured as a rigorous analysis). *Wait, the prompt asks me to write the analysis for the paper, not just an outline.* I will write a comprehensive essay-style response that the user can adapt.

      *Wait, one nuance:* The prompt asks for a "careful, disciplined mapping... Then I want an honest account... Evaluate the main repair strategies... Finally, give a verdict." I should structure the response to follow this flow exactly.

      *Key Insight on Vulcan:* The existence of Vulcan as a hypothesis means that for a long time, $E$ (the 43" residual) was *not* taken as a brute fact about gravity, but as $E_{Newton\_Failure}$. The confirmation of GR isn't just fitting $E$, it's rendering $H_{Vulcan}$ unnecessary. This is inference to the best explanation, which Bayesianism tries to capture via likelihoods. But if $P(E)=1$, likelihoods are equal. This reinforces the need for Garber (learning the link).

