      *   Recommendation committed? Yes (Modify).
      *   Criterion explicit? Yes (Taxonomy + Behavior).
      *   Opposing view fair? Yes (acknowledged logic).
      *   Word count? Keep an eye on it.
      *   Skimmable? Use bolding and bullets.

  7.  **Final Polish:** Check tone. Ensure it sounds like a committee member speaking to peers, not a lecture. Make sure the "neuroscientist" isn't named negatively. (I'll use "the proponent" or similar).

      *Wait, one nuance:* The prompt says "If your recommendation hinges on what the threshold should be keyed to... say so explicitly." I need to be sure I'm not just saying "behavior" but defining *which* behavior. Nociception and avoidance learning are standard IACUC terms.

      *Word Count Check:* Aiming for ~600-700 words to be safe.

      *Let's write.*

      (Self-Correction during writing): Make sure I don't sound like I'm completely dismissing the neuroscientist. The prompt says "the neuroscientist isn't an idiot." I need to validate his ethical intuition while rejecting his metric.

      *Revised Plan:*
      1. Header.
      2. Purpose.
      3. The Proposal (Strengths).
      4. The Limitations (Vet's argument).
      5. Recommendation (Hybrid).
      6. Implementation Criteria.
      7. Conclusion.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Animal Care and Use Committee (IACUC)
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Invertebrate Oversight Proposal

  **Purpose**
  At next month's meeting, we will vote on a proposal to revise our oversight criteria for invertebrate research. Currently, all invertebrates are exempt from full protocol review. The proposed change would subject invertebrates to vertebrate-level review if their nervous system exceeds a specific threshold (e.g., neuron count or brain mass).

  This memo outlines my recommendation: **Approve the proposal in principle, but reject the specific metric.** We should adopt a **Taxonomic + Functional** criterion instead of a quantitative neural threshold.

  **The Proposal: Strengths and Intent**
  The proponent's argument is ethically sound. The current binary (vertebrate = protected, invertebrate = exempt) is biologically arbitrary. There is a robust correlation between neural complexity and capacities we care about: pain perception, learning, and flexible behavior. An octopus is demonstrably more complex than a nematode. Ignoring this distinction is status quo bias. The proposal correctly identifies that moral weight should track capacity, and neural mass is a reasonable proxy for capacity.

  **The Limitations: Why Metrics Fail**
  However, using raw neuron count or brain mass as the *sole* trigger creates practical and philosophical problems raised during committee discussion:
  1.  **Inconsistency:** Total neuron count favors elephants over humans; Encephalization Quotient (EQ) favors dolphins over chimps. Forebrain counts place corvids above carnivores. There is no consensus metric that aligns perfectly with moral intuition.
  2.  **Practicality:** Requiring researchers to justify exact neuron counts for every protocol creates administrative burden without increasing animal welfare.
  3.  **The "Somebody Home" Problem:** As noted by veterinary members, suffering is about functional capacity, not grams of tissue. A structural metric risks missing animals with high capacity but small brains, or protecting animals with large brains but low nociceptive capacity.

  **Recommendation: A Hybrid Criterion**
  We must draw a line, but it should be based on **evidence of capacity** rather than **structural potential**. I recommend we expand oversight beyond vertebrates but use a criterion that is actionable for reviewers.

  **Approved Criterion:**
  Full protocol review is required for invertebrates if they meet **either** of the following conditions:

  1.  **Presumptive Taxonomic Inclusion:** The species belongs to a group with established evidence of complex nociception and cognition.
      *   *Specifically:* Cephalopods (octopus, squid, cuttlefish) and Decapods (crabs, lobsters, shrimp).
      *   *Rationale:* These groups consistently demonstrate pain avoidance and learning in literature, bypassing the need for case-by-case neuron counting.
  2.  **Functional Trigger:** For other invertebrates, full review is triggered if the protocol involves:
      *   Exposure to noxious stimuli where avoidance learning is observed or possible.
      *   Procedures that compromise the central nervous system in a manner likely to induce distress.

  **Implementation for Committee Members**
  When reviewing a protocol, apply this checklist:
  *   **Is it a Cephalopod or Decapod?** If yes, apply vertebrate standards (analgesia, minimization of distress).
  *   **Is it another invertebrate?** Does the method involve potential pain (nociception) or complex learning? If yes, apply vertebrate standards.
  *   **Is it a standard model (e.g., C. elegans, Drosophila)?** If the procedure is non-invasive or lacks nociceptive triggers, exempt status remains.

  **Conclusion**
  The proponent is correct that we cannot ignore invertebrate welfare forever. However, counting neurons is the wrong tool for the job. By shifting to a taxonomic and functional standard, we protect the animals that matter most without bogging down the committee in unanswerable metaphysical debates about brain mass.

  I urge the committee to vote **Yes on expanding oversight**, but **No on the neural threshold metric**, adopting the hybrid criterion above instead.
