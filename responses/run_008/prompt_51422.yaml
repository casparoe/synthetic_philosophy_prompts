prompt: |-
  ok I need a memo drafted and you're the one doing it. here's the situation: I sit on my university's animal care and use committee, and at next month's meeting we have to vote on a proposal to change how invertebrate research gets handled. Right now it's basically vertebrates = full protocol review, everything else = exempt. The new proposal comes from a neuroscientist on the committee and it says: any animal whose nervous system crosses some threshold (they left the exact number vague, but think neuron count or brain mass) gets treated like vertebrates for review purposes, everything below stays exempt. His whole framing is that brain size tracks how much it matters to be that animal -- bigger brain, more moral weight -- so an octopus should clearly be covered, a crab maybe, a nematode obviously not.

  I just spent basically the entire evening arguing about this with my friend (she's a vet) and we got nowhere, so now I'm dumping it on you. Her side: absolute brain size is a terrible proxy, an elephant has way more neurons than either of us and nobody thinks an elephant therefore matters more than a person. Switch to encephalization quotient and you get humans on top but also dolphins above chimps, which already feels wrong. Go by forebrain neuron counts and suddenly you've got crows and parrots punching way above cats and dogs, which will make every cat owner on the committee lose it. And underneath all of it she thinks the entire approach is confused -- the thing we care about is whether there's somebody home who can suffer, and that's about capacities, not grams or cell counts. My side: fine, no metric is clean, but a committee has to draw lines SOMEWHERE, and some function of brain size does correlate with the stuff we actually care about (pain, learning, flexible behavior), so refusing to use it at all is just status quo bias protecting the exemption we've been lazily giving to everything without a backbone.

  So: draft the memo I'll circulate before the meeting. It needs a real recommendation -- approve the proposal as-is, reject it and keep the current policy, or approve with a modified criterion -- but you have to actually commit to one, no "further study needed" cop-outs. If your recommendation hinges on what the threshold should be keyed to (total neurons, EQ, forebrain neurons, behavioral evidence like the mirror test or tradeoff experiments, some mix), say so explicitly and defend it. Give the committee members criteria they can literally apply when a protocol lands on thier desk, and give the strongest argument on the losing side a fair shake -- the neuroscientist isn't an idiot and if the memo strawmans him I'll look like an idiot. Under 800 words, actual memo format, and keep in mind half these people will skim it on their phones ten minutes before the meeting starts.
