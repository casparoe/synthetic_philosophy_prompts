      *   **Proposal:** Neuroscientist member proposes threshold based on nervous system size (neuron count/brain mass) to determine review level. Bigger brain = more moral weight = more review.
      *   **Conflict:**
          *   *Friend (Vet):* Brain size is a bad proxy. Elephants > humans in neurons? EQ puts dolphins > chimps? Forebrain neurons puts birds > mammals? Core issue is capacity for suffering ("somebody home"), not metrics.
          *   *User (Me):* No metric is perfect, but lines must be drawn. Brain size correlates with capacities (pain, learning). Status quo (exempting all invertebrates) is lazy bias.
      *   **Task:** Draft a memo to circulate before the meeting.
      *   **Requirements:**
          *   Must make a real recommendation (Approve, Reject, or Modify). No "further study."
          *   Must specify the criterion (neurons, EQ, behavior, mix, etc.) and defend it.
          *   Must provide actionable criteria for committee members.
          *   Must steelman the opposing view (the neuroscientist's proposal isn't stupid).
          *   Under 800 words.
          *   Actual memo format.
          *   Readable on phones (skim-friendly).

  2.  **Determine the Recommendation:**
      *   *Option A (Approve as-is):* Too vague ("some threshold"). Hard to enforce.
      *   *Option B (Reject/Status Quo):* Ignores the valid ethical concern about cephalopods/etc. Lazy.
      *   *Option C (Modify):* This is the most balanced approach. Acknowledge the need for lines (User's point) but reject raw brain size/neuron count as the sole metric (Vet's point).
      *   *Decision:* Recommend a **Modified Criterion**. Use a hybrid approach: Specific taxa known for high capacity (cephalopods, decapods) + Behavioral evidence of nociception/learning. This avoids the "counting neurons" trap while moving beyond "vertebrate-only."
      *   *Why:* Counting neurons is practically impossible for every protocol and philosophically shaky (Vet's point). But exempting octopuses is ethically risky (User's point). A list-based + behavioral trigger is actionable.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (vote on invertebrate oversight) and the stakes.
      *   **The Proposal (Steelman):** Acknowledge the neuroscientist's logic. Brain size correlates with complexity. It's an attempt to be consistent, not arbitrary.
      *   **The Critique (Vet's point):** Metrics fail at edges. Elephants vs. Humans. Birds vs. Cats. Suffering is about capacity, not mass.
      *   **The Recommendation:** Approve with Modification.
      *   **The Criterion:** Don't use raw neuron counts. Use a "Presumptive List" (cephalopods, decapods) + "Behavioral Trigger" (evidence of nociception/learning).
      *   **Actionable Steps:** What does a member do when reviewing?
      *   **Closing:** Call to action.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Constraint Check:* Needs to be under 800 words. Keep it tight.
      *   *Tone:* Professional, persuasive, balanced.
      *   *Clarity:* Use bullet points for the criteria so it's skimmable.
      *   *The "Losing Side":* I need to make sure the neuroscientist doesn't look bad. His intent is ethical consistency. The flaw is practicality and philosophical precision.
      *   *The "Winning Side":* My recommendation needs to be specific. "Behavioral evidence" can be vague. I should specify *what* evidence (nociception, avoidance learning).
      *   *Decision:* I will recommend a "Taxonomic + Functional" hybrid. It respects the neuroscientist's drive for expansion but uses the vet's insight on capacity.

  5.  **Drafting the Content:**

      *   *Subject:* Voting Memo: Invertebrate Oversight Proposal.
      *   *Intro:* Next meeting vote. Current binary (vertebrate/invertebrate) vs. Proposed gradient.
      *   *Proposal Analysis:* Dr. [Name]'s proposal seeks ethical consistency. Correlation between neural mass and capacity is real. It prevents arbitrary lines.
      *   *Concerns:* Quantitative thresholds (neuron count) are impractical for reviewers and philosophically contested (EQ vs. Total Count). Suffering is functional, not just structural.
      *   *Recommendation:* **Approve with Modification.**
      *   *Modified Standard:* Instead of neuron counts, use:
          1.  **Presumptive Inclusion:** Cephalopods & Decapods (crabs/lobsters) automatically get full review.
          2.  **Functional Trigger:** For other invertebrates, full review required if protocol involves known nociceptors or demonstrates avoidance learning.
      *   *Why:* Actionable. Protects high-capacity animals without bogging down nematode research.
      *   *Closing:* Vote yes on the principle, no on the metric.

  6.  **Review against Constraints:**
