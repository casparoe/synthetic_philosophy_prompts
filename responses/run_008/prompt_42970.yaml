  Local Man Refuses To Make Any Decision Not Sized According To Kelly Criterion

  OAK PARK, IL—Following a deep dive into a popular betting memoir, local analyst Gary Vaneck announced Monday that he has ceased all fixed-size risk-taking, restructuring his entire existence around full Kelly-optimal sizing to maximize long-term geometric growth. Vaneck, 42, confirmed he no longer orders entrees based on hunger, but on the logarithmic utility of calories relative to his caloric bankroll. He also adjusts sleep duration nightly, sacrificing rest when the marginal utility of wakefulness exceeds the risk of fatigue-induced errors compounding over his lifespan. At dinner last week, when the check came to $85, Vaneck calculated his tip not as a percentage of the meal, but as 0.0003% of his $500,000 net worth, resulting in a gratuity of $1.50.

  "Twenty percent is arithmetic thinking," Vaneck said, wiping crumbs from his lap. "If I tip based on the check size, I'm exposing myself to unnecessary variance in my liquidity position. I need to preserve capital compounding. Most people don't realize that variance drags the geometric mean below the arithmetic mean, so even favorable bets ruin you if you overbet. Besides, full Kelly assumes I know my edge exactly, which is why I actually use half-Kelly on dessert to hedge against menu estimation error."

  His financial advisor, Mark Sterling, remains concerned by Vaneck's liquidity constraints and excessive insurance purchases. "Gary's ignoring the arithmetic mean return," Sterling said, pointing at a chart showing a theoretical 12% annual gain that assumes infinite leverage and zero volatility drag. "Volatility doesn't matter if you hold forever. He's leaving free money on the table by refusing to leverage his home equity to buy index calls. The expected value is positive, so why wouldn't you bet it all? He's buying insurance on a toaster. An expected-value maximizer would self-insure." Sterling maintained that drawdowns are merely temporary markings. He argued that time in the market eliminates all path dependency, a claim contradicted by the mathematics of geometric Brownian motion.

  Consequently, Vaneck has not changed jobs in eleven years. He explains that career moves are single-instance bets rather than repeated trials, rendering the Kelly criterion silent on the matter. "There's no ergodicity in switching industries," Vaneck noted. "Without a repeatable sequence, the geometric mean collapses to the arithmetic outcome of a single trial, which implies ruin risk I cannot size. A job change is a non-ergodic process. The math requires an infinite horizon. So I stay."

  His wife, Ellen, worries the framework misidentifies the asset class. "Gary treats his life like a bankroll that survives forever," she said. "But I'm not sure a human being has infinite time horizon to recover from volatility drag. You can't compound if you're dead. He's optimizing for a universe where he doesn't age."

  Vaneck was last seen declining a free concert ticket, citing insufficient edge to justify the time allocation risk.

  Moral: A bet with positive expected value can still reduce wealth if the sizing ignores the variance drag inherent in sequential compounding.
