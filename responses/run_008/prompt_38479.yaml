answer: |-
  Your intuition that the fit is uncomfortable is correct, and leaning into that discomfort will yield a richer paper than trying to smooth it over. While Thomas More and Immanuel Kant arrive at the same practical conclusion—do not lie—their moral geometries are drawn from different centers. Kant's ethics are universalist and rationalist; More's (in Bolt's dramatization) are particularist, theological, and legalistic.

  Here is a reading of *A Man for All Seasons* through the Kantian lens, respecting the frictions you have identified.

  ### 1. The Murderer vs. The Sovereign: Shifting the Kantian Text
  You are right to reject the "murderer at the door" (*On a Supposed Right to Lie from Philanthropy*) as the primary intertext. In that essay, Kant argues against lying to a pursuer because the liar becomes responsible for the consequences of the truth (if the victim left and was killed anyway) and because lying violates a duty to humanity generally. More is not facing a murderer asking for a location; he is facing a Sovereign demanding an oath of allegiance.

  The mapping improves significantly if you shift to Kant's *Metaphysics of Morals*, specifically the discussion of lying as a violation of a **duty to oneself**. Kant argues that when a man lies, he "annihilates his dignity as a human being." He makes himself a mere deceptive appearance rather than a rational agent. This aligns much more closely with More's insistence that he "cannot give" what he does not have. When More says, "What matters is that I believe it, or that I don't believe it," he is guarding the integrity of his inner rational (and spiritual) faculty. For Kant, lying is self-mutilation; for More, perjury is damnation. Both view the lie not primarily as harm to the deceived (the King), but as corruption of the deceiver.

  ### 2. Silence, Casuistry, and the Law
  This is where the play resists the Kantian reading most vigorously. You noted More's legal maneuvering: insisting his silence be construed as consent. Kant is notoriously hostile to casuistry—the attempt to find loopholes in moral law. For Kant, if the intention is to deceive, the mechanism (silence, equivocation, or falsehood) matters less than the maxim behind the action. If More remains silent *in order to* make the King believe he assents, while internally dissenting, a strict Kantian might argue this is still a violation of the duty to truthfulness, as it treats the King as a mere means to self-preservation.

  However, Bolt's More treats the Law not as a moral imperative but as a physical shelter. In the famous exchange with Roper, More says, "Set God aside... what would you do? Cut a great road through the law to get after the Devil?" Here, the play illuminates a Kantian concern—the danger of instrumentalizing rules—but twists it. Kant wants to preserve the Moral Law; More wants to preserve the Common Law. More's argument is political: if we break the law for a good end (catching the Devil/saving the King's soul), we leave ourselves defenseless against a bad end (the King's tyranny). This is a pragmatic argument for absolutism, whereas Kant's is a transcendental one. The play suggests that legal absolutism is the only barrier against political chaos, a point Kant's abstract ethics do not address.

  ### 3. The Spectacle of Integrity: What the Play Adds
  This is the most valuable contribution your paper can make. Kant's essay is a sterile defense of principle; Bolt's play is a visceral demonstration of its cost. The play adds the dimension of **witness**.

  *   **Richard Rich:** Kant argues that lying undermines the source of right. Bolt dramatizes this through Rich. Rich does not just tell a lie; he *becomes* a lie. His perjury in the trial is the culmination of a life spent treating truth as a commodity to be traded for position. The play shows the *corrosive effect* of dishonesty on the liar's character in a way Kant's logical contradictions do not. Rich is not just wrong; he is hollowed out.
  *   **The Norfolk/Chapuis Factor:** Kant speaks to other philosophers. More speaks to his contemporaries. The tragedy of the play is that More's integrity saves no one but himself, yet it shames everyone else. Norfolk weeps because he sees that More's refusal exposes Norfolk's own compliance as cowardice. A Kantian argument might convince a mind; More's silence convicts a conscience. The play suggests that the value of truth-telling is not just in the logical consistency of the universe (Kant), but in the preservation of a community's moral memory.

  ### 4. Theological vs. Rational Autonomy
  Finally, you must address the source of the "No." Kant's autonomy is self-legislation by reason. More's autonomy is submission to God. When More says, "I give him the benefit of the law," he is not appealing to the Categorical Imperative; he is appealing to a higher authority that limits the King.

  In the trial scene, More's silence is a form of speech that Kant would find ambiguous. More refuses to swear because he believes the King *cannot* make the oath true. This is theological. Kant would argue the King *cannot* make the oath moral. The distinction is subtle but vital. More is protecting his soul from God's judgment; Kant would protect his dignity from Reason's judgment. The play resists the Kantian reading because More's rigidity is rooted in a specific historical faith, not universal reason. If More were a Kantian, he might argue that the Oath itself is irrational. Instead, he argues it is *his* to give or not give.

  ### Conclusion for the Paper
  Your paper should argue that *A Man for All Seasons* does not vindicate Kant, because More is not acting on Kantian grounds. Instead, the play dramatizes a **rival absolutism**. It shows that while the *consequences* of lying (the erosion of law, the corruption of Rich) align with Kant's predictions, the *motivation* (salvation vs. duty) and the *method* (legal silence vs. truthful speech) diverge. The play complicates Kant by showing that in a tyrannical state, "truth-telling" may require legalistic silence rather than frank speech, and that the preservation of integrity is often a deeply personal, even selfish act (saving one's soul) that inadvertently serves the public good.

  Verdict: dramatizes a non-Kantian absolutism
