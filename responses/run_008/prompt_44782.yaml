answer: |-
  Here is a complete lesson plan designed for your constraints (18 students, 75 minutes, no calculators, minimal admin). It focuses on generating the *intuition* for the three interpretations through friction, then naming them at the end.

  # Lesson Plan: The Bookie's Dilemma

  **Course:** Phil of Science (200-level)
  **Time:** 75 Minutes
  **Students:** ~18 (Divide into 3 "Betting Agencies" of 6 students)
  **Goal:** Students experience the breakdown of Frequency, the reliance on Propensity, and the necessity of Subjective belief before learning the terminology.

  ---

  ## 1. The Setup (5 Minutes)
  **Role:** You are the "Regulator." The three groups are **Agency Alpha**, **Agency Beta**, and **Agency Gamma**.
  **Currency:** "Credibility Points" (CP). Each Agency starts with **100 CP**.
  **Task:** Agencies must post odds (as percentages, 0–100%) on a list of 5 events.
  **The Catch:**
  1.  **Resolution:** Some events resolve today, some never.
  2.  **Challenge:** If an Agency posts odds that seem absurd, other Agencies can **Challenge** them.
      *   *Example:* Alpha says "10% chance of Rain." Beta challenges. Beta bets 10 CP that it *will* rain. Alpha must take the other side.
      *   If Beta wins, Alpha pays Beta 10 CP. If Beta loses, Beta pays Alpha 10 CP.
      *   *Why this matters:* This forces them to defend their numbers without you needing to calculate complex scoring rules.

  ---

  ## 2. The Event List (Handout to Groups)
  *Give each group this sheet. They have 10 minutes to discuss and write down their % for each.*

  | Event | Description | Your Probability (0-100%) |
  | :--- | :--- | :--- |
  | **1. The Die** | I will roll this standard D6 under a cup. Event: **It lands on 6.** | \_\_\_\_\_% |
  | **2. The Coffee** | My mug is full of hot coffee right now. Event: **It will be cold (room temp) by the end of class.** | \_\_\_\_\_% |
  | **3. The Biased Coin** | I have a coin. **Fact A:** It is physically shaved to be heavier on the Tails side. **Fact B:** I flipped it 50 times this morning; it landed Heads 45 times. A random student will flip it once now. Event: **It lands Heads.** | \_\_\_\_\_% |
  | **4. The Squeak** | Student in Row 3, Seat 2 (pick a specific volunteer) will stand up and sit down. Event: **The chair squeaks.** | \_\_\_\_\_% |
  | **5. The Bridge** | Event: **The I-95 Baltimore Bridge (or local equivalent) will suffer a structural failure before 2035.** | \_\_\_\_\_% |

  ---

  ## 3. The Game Flow (25 Minutes)

  **Minute 15-20: Posting & Challenging**
  *   Ask each Agency to announce their % for **Event 1 (Die)**.
  *   *Expected:* Everyone says ~16-17%. No challenges.
  *   Ask for **Event 3 (Biased Coin)**.
  *   *Expected:* Conflict. Some will trust the physical shaving (Low Heads %). Some will trust the track record (High Heads %).
  *   *Action:* Allow Agencies to Challenge each other here. If Alpha says 90% Heads and Beta says 10% Heads, Beta *must* challenge. This burns points but exposes the disagreement.
  *   Ask for **Event 5 (Bridge)**.
  *   *Expected:* Wild variance. One group says 1%, another says 40%.
  *   *Action:* Allow Challenges. If a group says 99%, challenge them. Make them risk points.

  **Minute 20-25: Resolution**
  *   **Resolve Event 1:** Roll the die. Update scores (Winners +5, Losers -5).
  *   **Resolve Event 2:** Touch the mug. Is it cold? (Prepare a mug of cold water beforehand if you want to guarantee a result, or just check your actual coffee). Update scores.
  *   **Resolve Event 3:** Have the volunteer flip the coin. **Crucial:** It doesn't matter what the result is. The point is the *argument* before the flip.
  *   **Events 4 & 5:** Declare these **Unresolved**. "We cannot wait for 2035. We cannot rerun the chair squeak under identical conditions."

  ---

  ## 4. Scoring (Simplified for No Calculators)
  *Keep a tally on the board.*
  *   **Base Score:** 100 CP.
  *   **Challenge Penalty/Reward:** ±10 CP per challenge.
  *   **Accuracy Bonus (For Events 1 & 2 only):**
      *   If you predicted within 10% of the outcome (e.g., predicted 15-25% for a 1/6 die roll), +5 CP.
      *   If you were way off (e.g., predicted 50% for a die roll), -5 CP.
      *   *Note:* This is rough, but it rewards "calibration" without requiring a spreadsheet.

  ---

  ## 5. The Debrief (35 Minutes)
  *This is the most important part. Do not name the theories yet.*

  **Phase 1: The Frequency Wall (10 mins)**
  *   **Ask:** "Look at Event 1 (Die). Why did you all agree on ~16%?"
  *   **Student Answer:** "Because it's 1 in 6." "Because if you roll it forever, it's 1/6th."
  *   **Ask:** "Look at Event 5 (Bridge). Why did you disagree?"
  *   **Student Answer:** "There's only one bridge." "It hasn't happened yet." "We can't run it 1,000 times."
  *   **The Pivot:** "So, for the Die, you relied on a **long run of repeatable trials**. For the Bridge, that story broke. There is no long run."
  *   **Reveal:** Write **FREQUENTISM** on the board. *"Probability is the limit of relative frequency in a long run of identical trials."*
  *   **Check:** "Who used this for the Bridge?" (Hands should go down). "Exactly. Frequentism has no answer for unique events."

  **Phase 2: The Physical Propensity (10 mins)**
  *   **Ask:** "Look at Event 3 (Biased Coin). Some of you ignored the 50 flips (Frequency) and looked at the shaving (Physical Setup). Why?"
  *   **Student Answer:** "The weight determines the fall." "The flips might have been luck, the weight is real."
  *   **The Pivot:** "You treated probability as a **physical disposition** of the object, like fragility or solubility. Even if you only flip it once, the weight is still there."
  *   **Reveal:** Write **PROPENSITY** on the board. *"Probability is a physical tendency of a specific setup to produce an outcome."*
  *   **Check:** "Does this solve the Bridge?" (Maybe—engineering stress models). "Does it solve the Chair Squeak?" (Maybe—friction coefficients).

  **Phase 3: The Willingness to Bet (10 mins)**
  *   **Ask:** "Look at Event 5 (Bridge) again. If Frequentism fails (no long run) and Propensity is hard to measure (complex engineering), what were you actually doing when you wrote '40%'?"
  *   **Student Answer:** "How confident I felt." "How much I'd bet."
  *   **The Pivot:** "You weren't measuring the world. You were measuring **your own uncertainty**. The 40% wasn't in the bridge; it was in your head."
  *   **Reveal:** Write **SUBJECTIVISM (Bayesianism)** on the board. *"Probability is a degree of belief, defined by your willingness to bet."*
  *   **Connect to Game:** "This is why the **Challenge Rule** existed. If your degrees of belief are incoherent (e.g., you bet on Heads and Tails both at 60%), you lose points. That's a 'Dutch Book'."

  **Phase 4: Synthesis (5 mins)**
  *   Summarize: Science needs all three.
      *   **Frequency** for data analysis (clinical trials).
      *   **Propensity** for causal models (quantum mechanics, engineering).
      *   **Subjective** for hypothesis testing and unique events (climate change, evolution history).

  ---

  ## 6. Addressing Your "Extras"

  ### Extra 1: The Frequency vs. Propensity Split (Event 3)
  I designed **Event 3 (The Biased Coin)** specifically for this.
  *   **The Setup:** A coin physically weighted for Tails (Propensity = Low Heads).
  *   **The Data:** 50 flips resulted in 45 Heads (Frequency = High Heads).
  *   **The Conflict:**
      *   A **Frequentist** must say Heads is highly probable (based on the reference class of *this coin's recent flips*).
      *   A **Propensity Theorist** must say Tails is highly probable (based on the physical *setup*, assuming the flips were an anomaly or the flipper countered the weight).
      *   **In Class:** Watch which groups cite the "50 flips" vs. which cite the "shaving." This cleanly separates the two views without jargon.

  ### Extra 2: What This Game Cannot Reproduce (The Normative Gap)
  You are correct. Be honest with them in the debrief.
  *   **The Limit:** The game punishes incoherence *pragmatically* (you lose points if challenged), but it doesn't prove *logical necessity*.
  *   **The Gap:** In the game, a student can say "I believe P(Heads) = 0.6 and P(Tails) = 0.6." If no one challenges them, they don't lose points immediately. In logic (Dutch Book arguments), this is *automatically* a loss, regardless of whether anyone challenges you.
  *   **The Takeaway:** Tell them: "Today, you lost points because *I* let your classmates challenge you. In the real theory, you lose truth just by holding those beliefs, even if no one bets against you. The game simulates the pressure, but the axioms prove the necessity."

  ### Extra 3: What Will Go Sideways (And How to Fix It)
  **Prediction:** **The Troller.** One group will post "100%" on the Bridge failing or "0%" on the Die rolling a 6 just to be funny or disrupt the scoring.
  **Mitigation:** **The "Skin in the Game" Rule.**
  *   Tell them at the start: *"If you post 100% or 0%, you are automatically Challengeable. You cannot refuse a bet. If you are wrong, you lose 20 CP (double penalty)."*
  *   This turns trolling into a high-risk strategy. Usually, peers will punish the troll immediately to gain points.
  *   **Backup:** If they still do it, use it in the debrief. "Group Beta said 100% on the Bridge. Did they have frequency data? Physical models? Or was that just noise? This is the problem with uncalibrated Subjectivism."

  ---

  ## Instructor Cheat Sheet (For the 75 Minutes)

  *   **00-05:** Divide groups, explain CP and Challenge Rule.
  *   **05-15:** Groups deliberate and fill out sheets. (Circulate and listen to their arguments—this is gold for the debrief).
  *   **15-20:** Reveal odds. Facilitate Challenges (especially on Event 3 & 5).
  *   **20-25:** Resolve Die, Coffee, Coin. Tally points roughly.
  *   **25-35:** Debrief Phase 1 (Frequency).
  *   **35-45:** Debrief Phase 2 (Propensity).
  *   **45-55:** Debrief Phase 3 (Subjective).
  *   **55-60:** Limitations & Wrap up.
  *   **60-75:** Buffer for lively debate or running long on the Coin flip.

  **Materials Needed:**
  *   1 D6 Die.
  *   1 Coin (mark it slightly with a marker so it looks "shaved" or just tell the story).
  *   1 Mug of Coffee (have a cold one ready just in case).
  *   Whiteboard for tallying CP.
  *   Printed Event Sheets (3 copies).

  This plan keeps the admin light (you just tally integers), forces the philosophical problems to surface through gameplay, and saves the terminology for the moment of insight.
