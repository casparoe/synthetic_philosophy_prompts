prompt: |-
  You are an expert in political philosophy with a specialty in theories of distributive justice, in particular the "equality of what?" debate over the proper metric of egalitarian concern — welfare, resources, or capabilities. Please think carefully, and brainstorm the structure of your answer before writing it.

  I would like you to analyze a specific episode through that lens: the creation of the Human Development Index. The salient facts, so you need not rely on memory: in 1990 the UN Development Programme published the first Human Development Report, containing the HDI, a composite of life expectancy, education, and income per capita designed by the Pakistani economist Mahbub ul Haq, who recruited his old Cambridge friend Amartya Sen to help with the conceptual foundations. Haq's stated purpose was to shift the focus of development economics away from national income accounting toward people-centered measurement. Sen had spent the preceding decade arguing, most famously in his Tanner Lecture titled "Equality of What?", that the deepest divide among egalitarians concerns the metric of comparison, and that GNP per capita measures none of the candidate metrics adequately; he later voiced reservations about the HDI itself, worrying that a single composite number would be over-interpreted, while still defending the project as an improvement on GNP.

  Analyze this episode as a case study in the "equality of what?" debate. First, do the mapping with care: who the actors were, what practical choices the index designers actually faced (which dimensions to include, how to normalize incommensurable goods into one scale, whether to aggregate averages or attend to distribution), and which of those choices reflect the capability approach as opposed to expediency. Second, say what the capability lens genuinely illuminates about the episode — why life expectancy and schooling entered the index so naturally, why the HDI ranks countries so differently from GDP tables — and what it misdescribes or stays silent on. Third, run the analysis in the other direction: what the episode shows about the capability approach itself. In particular, address whether there is a real tension between Sen's insistence that capabilities are plural and not fully commensurable and the political demand for a single index number, and whether that tension is a deep problem for the theory or simply the price of policy relevance. Finally, say briefly whether a resourcist index (something like a Rawlsian primary-goods measure) or a welfare-based index would have served Haq's purpose better, and what the answer implies about which metric should guide development policy today.
