      5.  **The Explanatory Claim (Analogy as Engine):** Similarity *constitutes* explanation, not just illustration.

  4.  **Drafting the Content for Each Reading:**

      *   *Reading 1 (Trivial):* "No event recurs in every particular."
          *   Plausibility: High (obviously).
