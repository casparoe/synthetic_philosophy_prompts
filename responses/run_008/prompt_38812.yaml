prompt: |-
  I'm taking an environmental ethics course this semester and for the final paper we get to pick our own topic, so I've landed on the ethics of insecticides and pest control — mostly because everyone in class has strong opinions about factory farming, but nobody ever says anything about the fact that we kill insects by the trillions, on purpose, and mostly nobody seems to think it even needs an argument. But now that I'm actually trying to scope the thing I realize "the ethics of pest control" is like ten different debates stapled together, and I don't know which of them deserves my ~4000 words or, honestly, which ones matter full stop.

  So what I want from you is a ranking of the main open questions in this area by how much they deserve attention — with the ranking defended, not just listed. To make it concrete, the candidate questions I keep circling around are things like: (1) how much moral weight insects should get given how shaky the evidence on insect sentience still is, and whether shaky evidence should push us toward more caution or less (since acting cautious for trillions of creatures could be insanely costly); (2) whether there's a real moral difference between the three contexts people tend to lump together — disease vector control (mosquitoes and malaria), agricultural pest control, and conservation killing of invasives like fire ants — or whether that distinction stops doing any work once you attribute any welfare to insects at all; (3) whether a "clean kill" is even a coherent moral target for creatures whose lives last weeks anyway, i.e. does a painless pesticide sidestep the welfare problem or just relocate it; and (4) whether the practical upshot is mostly about developing better methods (traps, species-specific agents, stuff that kills without distress) versus just reducing the total amount of killing. But tell me if this is the wrong question set entirely — maybe the real issue is that "pest" is a category we invent for convenience, which would reframe everything above.

  For each question you rank highly I want the actual reasoning, not a survey: whether it's upstream of the others (e.g., does everything really hinge on the sentience question, or can we get traction without settling it?), how tractable it is for a philosophy paper as opposed to a neuroscience lab, and how neglected it is relative to all the attention vertebrate welfare gets. Also flag which ones you'd deprioritize and why — my instinct is the "pest is a socially constructed category" angle is philosophically fun but wouldn't change what anyone does with a can of spray, but maybe I'm wrong about that. And since I can't exactly run experiments, tell me what kind of evidence or argument, if it arrived, would move things up or down your list. Sorry for the wall of text, I've been going back and forth on this for a week and needed to just write it all out.
