      *   *Synthesizing the Editor's Mindset:*
          He seems to accept variation when it touches on **moral emotion** (Fat Man, Knobe) or **practical epistemology** (Gettier). He rejects variation when it touches on **semantics** (Names), **abstract mechanics** (Switch Trolley?), or **science fiction** (Teleporter).
