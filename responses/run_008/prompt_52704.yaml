      *   *Hypothesis B (The "WEIRD Bias Correction" Rule):* He likes correcting Western assumptions *unless* the Western assumption seems robustly universal or the methodology is suspect.
      *   *Hypothesis C (The "Ecological Validity" Rule):* He rejects scenarios that feel artificial or disconnected from real-life decision-making.
