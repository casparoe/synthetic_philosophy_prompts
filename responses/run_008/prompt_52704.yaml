          *   Switch Trolley: Moral dilemma (mechanical/impersonal?). *Wait, he killed this claiming they wouldn't vary.* This suggests he thinks some moral intuitions are universal (deontological constraints on killing vs. letting die?).
          *   Teleporter: Sci-fi/Artificial. -> **Killed.**
