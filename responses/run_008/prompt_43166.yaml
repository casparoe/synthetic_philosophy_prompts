  **DRAFT FOR REVIEW: JOINT STATEMENT ON THE ETHICS OF BORDER CONTROL**

  **Participants:** [Colleague A] (The Rights View) and [Colleague B] (The Self-Determination View)
  **Facilitator:** [Your Name]
  **Date:** October 26, 2023

  ### I. Agreed Claims (The Overlapping Consensus)

  We, the undersigned, acknowledge deep theoretical disagreements regarding the fundamental justification of border controls. However, after reviewing the arguments, we affirm the following non-trivial claims as a basis for further inquiry and policy evaluation:

  1.  **The Asymmetry of Entry and Residence:** There is a morally significant distinction between refusing admission to non-members and deporting long-term residents. While we disagree on the justification for the former, we agree that the latter requires a substantially higher burden of proof. Once individuals have established lives, social ties, and reliance interests within a territory, the state's claim to remove them is weakened, regardless of their initial legal status.
  2.  **Legitimacy of Administrative Constraints:** Not all barriers to movement constitute absolute exclusion. We agree that administrative mechanisms—such as visa processing times, security screenings, and quota systems—are not inherently unjust, provided they are not used as covert mechanisms to achieve total exclusion or to discriminate on the basis of protected characteristics (e.g., race, religion).
  3.  **The Humanitarian Threshold:** There exists a threshold of distress beyond which the right to exclude is suspended. In cases of immediate threat to life (e.g., famine, active genocide, or environmental catastrophe at the border), the duty to preserve human life overrides the community's claim to control membership. We disagree on where exactly this threshold lies, but agree that it exists.
  4.  **Rights of Presence:** Regardless of the legitimacy of border controls, the rights of individuals once inside the territory should not be radically diminished based on citizenship status. Basic civil liberties, access to emergency justice, and protection from exploitation should apply to all persons subject to the state's coercion.
  5.  **Global Inequality as a Driver:** We agree that the pressure on borders is largely a function of global economic and political inequality. Consequently, any ethical evaluation of immigration policy must consider the external obligations wealthy states have to reduce the conditions that make migration a necessity rather than a choice.

  ### II. Residual Disagreements

  We remain unable to reconcile the following foundational disagreements. We have phrased these to ensure each side recognizes their own position without conceding to the other's framing.

  | Issue | Position A (The Rights View) | Position B (The Self-Determination View) |
  | :--- | :--- | :--- |
  | **1. Nature of the Right** | Freedom of movement across borders is a basic human liberty. Restrictions require the same level of justification as restrictions on internal movement. | Freedom of association is a basic human liberty. Political communities, like private associations, have the right to determine with whom they undertake collective projects. |
  | **2. Moral Status of Exclusion** | Exclusion wrongs the excluded individual. It effectively coerces them into remaining within a jurisdiction they may not endorse, amounting to a form of confinement. | Exclusion does not wrong the excluded individual; it merely fails to confer a benefit. The individual retains the right to seek membership elsewhere, but no specific community is obligated to provide it. |
  | **3. Scope of Self-Determination** | Self-determination refers to the *internal* political character of the community (laws, values, welfare). This can be maintained without controlling demographic composition. | Self-determination refers to the *constituency* of the community. A people cannot determine their political character if they cannot determine who constitutes "the people." |

  ### III. The Scalability Crux

  We identify the primary crux of our disagreement as the **Scalability of Exclusion**. We disagree on whether the moral arithmetic of exclusion changes based on the volume of applicants.

  *   **The Question:** If a state is permitted to exclude one would-be entrant, is it permitted to exclude one million? Or does the aggregate impact of mass exclusion generate a rights violation that individual exclusion does not?
  *   **Position A Prediction:** Numbers matter. Even if excluding one person is permissible (e.g., due to security risks), excluding millions violates the aggregate freedom of movement and reinforces global apartheid. The right to exclude does not scale linearly.
  *   **Position B Prediction:** Numbers do not change the *kind* of right, but they validate the necessity of exercising it. If one million seek entry, the threat to the community's capacity for self-determination is greater, thus strengthening the claim to exclude. The right to exclude scales with the threat to community integrity.

  **Test Case: The "Small High-Welfare State" Scenario**
  *Scenario:* A small, wealthy island nation (Population: 1 million) faces an influx of 500,000 migrants from a neighboring failed state over one year. The migrants are not fleeing immediate starvation (Claim #3 is not triggered) but seek the island's economic stability and rule of law. Absorbing them would reduce per-capita wealth by 40% and strain public institutions to the breaking point.

  *   **Agreed Relevance:** Both sides agree this case tests the limit of Position B's "Associational Right" against Position A's "Freedom of Movement."
  *   **Position A Prediction:** The state must admit a significant portion of the applicants. To exclude 500,000 people to maintain a 40% wealth premium is to prioritize the luxury of the few over the basic liberty of the many. The "breaking point" of institutions is a justification for delay and integration support, not blanket exclusion.
  *   **Position B Prediction:** The state is permitted to restrict entry to a level sustainable by its institutions. If admitting 500,000 people dissolves the political community's ability to function as a self-determining unit, it is not obligated to self-sacrifice. The right to exclude is triggered precisely to prevent the collapse of the system that guarantees rights for existing members.

  ### IV. Note on Verbal vs. Substantive Disputes

  We suspect that part of our disagreement regarding **Claim #3 (The Humanitarian Threshold)** and **Issue #2 (Moral Status of Exclusion)** may be verbal rather than substantive.

  *   **The Suspicion:** When Position A describes exclusion as "imprisonment," and Position B describes it as "refusing a benefit," we may be using different baseline expectations for what constitutes normal human liberty. If Position A defines the "default" state as global freedom of movement, exclusion looks like coercion. If Position B defines the "default" state as distinct political communities, exclusion looks like the status quo.
  *   **Resolution Strategy:** We agree to treat the term "coercion" as a placeholder for a substantive argument about baseline entitlements, rather than continuing to debate the label itself. We will focus on the *consequences* of the policy (e.g., economic deprivation, family separation) rather than the semantic classification of the border guard's action.

  ***

  ### Facilitator's Meta-Commentary (For the Authors)

  *As requested, I am flagging specific areas where I am uncertain if the drafting accurately captures your specific philosophical commitments or if the disagreement is genuinely substantive.*

  **1. Confidence Level on Agreed Claim #3 (Humanitarian Threshold)**
  *   **Uncertainty:** I am least confident that [Colleague B] will endorse the phrasing "duty to preserve human life overrides the community's claim."
  *   **Reasoning:** Strong restrictionists (e.g., Wellman or Walzer adherents) often argue that even in humanitarian crises, the *method* of admission is up to the state (e.g., temporary asylum vs. permanent residency). [Colleague B] might prefer language that suggests a "duty of rescue" rather than a suspension of the "right to exclude."
  *   **Suggestion:** [Colleague B], please check if "suspension of right" is too strong. Would "obligation to provide temporary refuge" be more accurate to your view?

  **2. Confidence Level on the "Scalability Crux"**
  *   **Uncertainty:** I am unsure if [Colleague A] accepts the premise that excluding *one* person is ever permissible.
  *   **Reasoning:** If [Colleague A] holds an absolutist open-borders view (Carens-style), they might object to the Crux framing which implies a baseline permission to exclude single individuals (e.g., criminals).
  *   **Suggestion:** [Colleague A], does the Test Case allow for *any* exclusion, or should the prediction be that even in the island scenario, exclusion is impermissible?

  **3. Verbal vs. Substantive (The "Imprisonment" Claim)**
  *   **Uncertainty:** I have flagged the "imprisonment" language as potentially verbal in Section IV. However, this might be the *core* substantive disagreement.
  *   **Reasoning:** If [Colleague A] believes borders are coercive structures akin to walls, and [Colleague B] believes they are constitutive boundaries akin to property lines, this is not just semantics; it is an ontological disagreement about the nature of the state.
  *   **Suggestion:** If you find Section IV unhelpful, we should move this back to Section II (Residual Disagreements). It is possible this is not a verbal dispute but a fundamental clash of political ontology.

  **4. The "Association" Analogy**
  *   **Uncertainty:** In Issue #1, I used the "private association" analogy for [Colleague B].
  *   **Reasoning:** Some communitarians reject the "club" analogy because states are coercive monopolies, unlike private clubs. If [Colleague B] relies on the "political community" argument rather than "freedom of association," the table needs adjustment.
  *   **Suggestion:** [Colleague B], please verify if "Freedom of Association" is the correct label for your view, or if "Political Self-Determination" is more precise.

  **Next Steps:** Please review the flagged sections. If the "Verbal Dispute" section resonates, we can shorten the debate on definitions. If the "Scalability Crux" predictions are accurate, this scenario should serve as the basis for our next empirical review.
