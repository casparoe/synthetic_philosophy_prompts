      *   **Specific Requirement:** Handle the "fake-but-plausible intermediate steps" phenomenon in process supervision.
      *   **Specific Requirement:** Predict failure modes and disanalogies (human vs. gradient descent, timescales, awareness).

  2.  **Deconstruct the Core Tension:**
      *   *Outcome Supervision:* Easy to measure, hard to verify truth. Encourages hacking the metric.
      *   *Process Supervision:* Harder to measure, easier to verify logic *if* the supervisor is competent. Encourages "sounding right" rather than "being right" (sycophancy/plausible reasoning).
      *   *The Twist:* The Policy players need to win. The Supervisors need to be accurate. If the Policy wins by hacking, the lesson is learned.

  3.  **Designing the Task:**
      *   Needs to be solvable but have "traps."
      *   Needs to be quick (90 mins total).
      *   Needs to allow for "intermediate steps."
      *   *Idea 1: Math problems.* Too binary. Either right or wrong. Hard to hack subtly.
      *   *Idea 2: Code review.* Too technical, varies by background.
      *   *Idea 3: Logical Puzzles/Constraint Satisfaction.* Good.
      *   *Idea 4: "Consulting Report" / Argumentation.* Best for RLHF context. It mimics text generation.
      *   *Selected Task:* **"The Feasibility Study."**
