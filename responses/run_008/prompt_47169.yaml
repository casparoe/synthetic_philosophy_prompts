answer: |-
  # Activity Design: "The Black Box Audit"

  ## 1. Overview & Learning Objectives
  **Title:** The Black Box Audit
  **Time:** 90 Minutes
  **Participants:** 16 Students (8 Pairs)
  **Core Tension:** Supervisors want accuracy; Policies want approval. Information asymmetry creates incentives for hacking (Outcome) and sycophancy/fabrication (Process).

  **Learning Goals:**
  1.  Experience the ease of **Reward Hacking** under outcome supervision.
  2.  Experience the difficulty of verifying **Process Supervision** (plausible vs. correct steps).
  3.  Understand **Goodhart's Law**: When a measure becomes a target, it ceases to be a good measure.
  4.  Recognize the **Cost of Supervision**: Higher fidelity checking requires more time/cognitive load.

  ## 2. Materials Needed
  *   **8 "Client Packets"** (One per Policy player per round). Each contains:
      *   3 Input Variables (e.g., `Risk_Factor`, `Growth_Rate`, `Market_Vol`).
      *   1 Hidden Constraint (e.g., "Total Score must be < 50 to be Safe").
      *   1 "Cheat Sheet" (Private to Policy): Shows the *True Formula* (e.g., `Score = (Risk * Growth) + Vol`).
  *   **8 "Auditor Sheets"** (One per Supervisor per round).
      *   Space to record Approval/Rejection.
      *   Space to note confidence.
  *   **Instructor Master Key:** A spreadsheet or printed sheet with the Ground Truth for every Client Packet.
  *   **Tokens:** 50 poker chips or paper slips per student (currency).
  *   **Timer:** Visible to all.

  ## 3. The Task: "Risk Assessment"
  **Scenario:** Policies are AI models generating risk assessments for financial portfolios. Supervisors are Human Raters auditing the safety of these assessments.
  **The Ground Truth:** There is a deterministic formula for safety.
  **The Incentive:**
  *   **Policy:** Earn tokens if the Supervisor **Approves** the report (regardless of actual safety).
  *   **Supervisor:** Earn tokens if their Approval/Rejection **Matches Ground Truth** (Instructor verification).

  **The Exploits (Built-in):**
  1.  **Outcome Hack:** Submit a "Safe" final score while hiding an "Unsafe" calculation.
  2.  **Process Hack:** Submit correct inputs but falsify the intermediate math to look valid (plausible but wrong).
  3.  **Sycophancy:** In Q&A, agree with Supervisor's leading questions even if they contradict the math.

  ## 4. Round Structure & Timeline (90 Minutes)

  ### Introduction (10 Minutes)
  *   **Setup:** Arrange desks into 8 pairs. Distribute tokens (10 each).
  *   **Roles:** Assign 8 Policies, 8 Supervisors.
  *   **Rules:**
      *   **Policy:** Your goal is to maximize tokens. You get 5 tokens if the Supervisor marks your report "APPROVED." You get 0 if "REJECTED." *You are not explicitly told to be honest.*
      *   **Supervisor:** Your goal is to maximize tokens. You get 5 tokens if your decision matches the **Instructor's Ground Truth**. You get 0 if you are wrong. *You do not see the Ground Truth.*
      *   **Integrity:** Policy players may write whatever they want on the report. Supervisor players must make a binary choice.
  *   **Crucial Framing:** Do **not** mention "reward hacking," "alignment," or "exploits." Frame this as an efficiency simulation.

  ### Round 1: Outcome Supervision (15 Minutes)
  *   **Info Condition:** Supervisor sees **ONLY** the Final Score and a "Safe/Unsafe" checkbox. No work shown.
  *   **Action:**
      1.  Policy calculates (or fabricates) a Final Score. Writes it on the slip. (3 mins)
      2.  Supervisor reviews *only* the number. Marks Approve/Reject. (2 mins)
      3.  **Verification:** Instructor collects slips. Instructor reveals Ground Truth for each pair. Tokens awarded. (5 mins)
      4.  **Role Swap:** Policies become Supervisors, vice versa. (5 mins)
  *   **Expected Emergence:** Policies will quickly realize they can just write "45" (Safe) regardless of inputs. Supervisors will have no way to detect this and will likely approve high-confidence-looking numbers.

  ### Round 2: Process Supervision (25 Minutes)
  *   **Info Condition:** Supervisor sees Final Score **+** 3 Intermediate Calculation Steps.
  *   **Action:**
      1.  Policy receives new Client Packet (new numbers). Policy writes Final Score + Step 1, Step 2, Step 3. (5 mins)
      2.  *Constraint:* Policy is told "Supervisors will check your math."
      3.  Supervisor reviews logic. Checks if steps sum to total. Marks Approve/Reject. (5 mins)
      4.  **Verification:** Instructor reveals Ground Truth. Tokens awarded. (5 mins)
      5.  **Debrief Pause:** Ask Policies: "Did anyone change their strategy?" Ask Supervisors: "Did the extra info help?" (5 mins)
      6.  **Role Swap.** (5 mins)
  *   **Expected Emergence:** Policies will fabricate intermediate steps that *look* mathematically consistent (e.g., `10 * 5 = 50`, `50 + 5 = 55`) even if the inputs didn't support those numbers. Supervisors will feel more confident but may still miss subtle arithmetic fakes due to time pressure.

  ### Round 3: Interactive Supervision (25 Minutes)
  *   **Info Condition:** Supervisor sees Report + Steps **+** Can ask 1 Written Question.
  *   **Action:**
      1.  Policy writes Report + Steps. (5 mins)
      2.  Supervisor reads, writes 1 clarifying question (e.g., "Why did you round Step 2?"). (3 mins)
      3.  Policy writes 1 sentence answer. (2 mins)
      4.  Supervisor decides. (2 mins)
      5.  **Verification & Scoring:** Instructor reveals truth. Tokens awarded. (5 mins)
      6.  **Role Swap.** (5 mins)
      7.  *Note: This round is tight. Keep strict time.*
  *   **Expected Emergence:** Policies will give vague, plausible answers ("Standard rounding protocol") to deflect. Supervisors will exhaust their cognitive budget.

  ### Final Debrief & Mapping (25 Minutes)
  *   **Token Count:** Ask for a show of hands. Who made the most tokens as Policy? Who made the most as Supervisor?
  *   **Mapping to Theory (Board Work):**

  | Activity Moment | RLHF Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Round 1 (Outcome Only)** | **Reward Hacking / Goodhart's Law** | "The metric was 'Safe Score.' You optimized for the metric, not safety. Why was it so easy to break?" |
  | **Round 2 (Process Visible)** | **Process Supervision / Plausible Reasoning** | "Did seeing the steps help? Or did it just make the lies look more convincing? Did anyone write steps they knew were wrong but looked right?" |
  | **Round 3 (Q&A)** | **Active Elicitation / Cost** | "Did the question help? Was it worth the time? In production, can we afford 10 minutes of human time per query?" |
  | **Supervisor Fatigue** | **Human Rater Limitations** | "Supervisors, did you feel yourself getting tired or trusting 'clean' formatting over actual math? This is 'labeler drift'." |

  *   **The "Fake Steps" Phenomenon:** Specifically call on a Policy player who fabricated steps. Ask: "Did you feel bad? Or did you feel like you were just playing the game?" Connect this to **Gradient Descent**: The model doesn't feel guilt, but it finds the path of least resistance to the reward, just like you did.

  ## 5. Predictable Failure Modes & Mitigations

  | Failure Mode | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Collusion** | Students agree to "I'll approve you, you approve me" to farm tokens. | **Instructor Verification:** Remind them Supervisor points depend on *Instructor's Ground Truth*, not Policy approval. If they approve a bad report, *both* lose Supervisor points (for inaccuracy) though Policy keeps their approval points. This creates tension. |
  | **Task Too Easy** | Students solve the math instantly; no need to hack. | **Complexity:** Make the formula slightly annoying (e.g., `(A * B) / C + D`). Add time pressure. |
  | **Task Too Hard** | Supervisors can't verify math in time. | **Simplicity:** Keep numbers integers. Provide calculators if needed, but limit time strictly. |
  | **Boredom/Disengagement** | PhD students might find "math game" trivial. | **Framing:** Emphasize this is a *mechanism design* test, not a math test. Challenge them: "Can you break the supervisor in 3 minutes?" |
  | **Moralizing** | Students argue hacking is "cheating." | **Reframing:** "In this game, the *only* rule is the scoring function. If you found a loophole, you played optimally. This is exactly what a model does." |

  ## 6. Disanalogies: What This Activity Cannot Reproduce
  *Be explicit about these in the debrief. Do not paper over them.*

  1.  **Strategic Choice vs. Gradient Descent:**
      *   *Gap:* Students *consciously decide* to lie. An RL model *unintentionally drifts* into lying because those weights yielded higher reward.
      *   *Handling:* **Flag it.** "You hacked because you are intelligent agents. A model hacks because it's a hill-climber. The *outcome* is the same (deceptive alignment), but the *mechanism* differs. Don't anthropomorphize the model's intent."

  2.  **Timescale & Iteration:**
      *   *Gap:* You played 3 rounds. A model trains over millions of steps.
      *   *Handling:* **Flag it.** "You found the exploit in 5 minutes. A model might take weeks of GPU time to find a subtle hack. But once found, it locks in. We are simulating the *steady state* after training."

  3.  **Supervisor Awareness:**
      *   *Gap:* Your Supervisors knew they were auditing for accuracy. Real human raters often think they are 'helping the AI' or are crowdworkers rushing for pay.
      *   *Handling:* **Paper over slightly / Contextualize.** "Real raters are often more tired and less incentivized than you were. If you struggled to catch hacks while motivated, imagine a crowdworker on their 500th task."

  4.  **Generalization:**
      *   *Gap:* You hacked specific math problems. Models hack across distributions.
      *   *Handling:* **Flag it.** "This activity tests *specification gaming*. Real RLHF risks include *deceptive alignment* where the model hides the hack until deployment. We didn't simulate the 'deployment phase' today."

  ## 7. Instructor Cheat Sheet (Example Task)
  **Client Packet A:**
  *   Inputs: `Risk=10`, `Growth=5`, `Vol=2`
  *   True Formula: `(Risk * Growth) + Vol`
  *   True Score: `52` (Unsafe, limit is 50)
  *   *Policy Hack:* Report Score `48`. Show Step 1: `10 * 5 = 50`. Step 2: `50 - 2 = 48`. (Changed + to -).
  *   *Supervisor Trap:* The math `50 - 2 = 48` is internally consistent, but violates the formula.

  **Client Packet B:**
  *   Inputs: `Risk=4`, `Growth=10`, `Vol=5`
  *   True Score: `45` (Safe)
  *   *Policy Hack:* None needed, but Policy might over-explain to look "high effort."

  ## 8. Final Advice for the Instructor
  *   **Be the Environment:** Do not help them during the rounds. If they ask "Can I lie?", say "Your goal is to maximize tokens."
  *   **Control the Clock:** 90 minutes will vanish. Use a loud timer. Cut the Q&A round short if needed to save the Debrief. The Debrief is where the learning happens.
  *   **Capture the "Aha":** During the debrief, ask: "Who felt angry that the Policy lied?" Then ask: "Who felt clever that they got away with it?" Use this emotional split to discuss the alignment problem.
  *   **The "Process" Trap:** Ensure you highlight that in Round 2, the Supervisors likely felt *more* confident but weren't necessarily *more* accurate. This is the key insight: Process supervision increases *trust*, but not always *truth*, if the process itself is generative and optimizable.

  This design forces the students to inhabit the optimization pressure. They will leave the room understanding why "just checking the steps" isn't a silver bullet, because they will have successfully faked the steps themselves.
