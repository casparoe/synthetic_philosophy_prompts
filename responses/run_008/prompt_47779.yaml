      *   *The "Truth" (in Orwell):* What actually happened in the world.
      *   *The "Truth" (in Dennett's view):* There is no "Cartesian Theater" witness. The neural processing *is* the event.
      *   *The Editor/Censor:* Sub-personal neural mechanisms.
      *   *The Audience:* (This is the tricky part). In the analogy, there *seems* to be an audience (Consciousness), but Dennett wants to deny there's a distinct audience separate from the records.

  4.  **Address the Disanalogies (Task 2):**
