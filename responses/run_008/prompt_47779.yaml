      *   *Irrelevant Disanalogy:* Moral evil, specific political structures, violence, etc.
      *   *The User's Worry:* "God could know the truth." Dennett's response: God could know the *neural* truth (firing patterns), but "what it felt like" *just is* the functional outcome of those patterns. There is no extra "qualia fact" over and above the processing/reporting dispositions.

