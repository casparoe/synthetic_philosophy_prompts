  Here is a thought experiment designed to fit your constraints, followed by the breakdown you asked for.

  ### The Thought Experiment: The Centrifugal Sieve

  Imagine a mechanical sorting device, something you could build in a workshop with 19th-century technology. It consists of a hopper feeding steel ball bearings onto a vibrating mesh screen. Below the screen are two bins: "Keep" and "Discard."

  **The Microphysics:**
  The system is fully deterministic. Every ball has a specific mass, diameter, and trajectory. The mesh is made of wires under tension. Whether a ball falls through a hole or rolls off into the "Keep" bin depends on the precise size of the hole relative to the ball, and the angle of the mesh at the moment of contact.

  **The Twist (The Macro-Constraint):**
  The tension of the mesh is not fixed. It is controlled by a centrifugal governor (like on a steam engine) spun by a small turbine. The turbine is driven by the *flow* of the balls themselves as they slide down a chute before hitting the mesh.
  *   **Low Flow:** If balls arrive sparsely, the turbine spins slowly. The mesh stays loose. The holes are wide. Even slightly oversized balls fall through into "Discard."
  *   **High Flow:** If balls arrive in a dense crowd, the turbine spins fast. The governor tightens the mesh wires. The holes shrink. Now, even balls that *would* have fallen through in low flow are held back and roll into "Keep."

  **The Intervention:**
  You stand at the hopper. You have two ways to intervene to ensure a specific borderline ball (Ball #502) ends up in the "Keep" bin.
  1.  **Micro-Intervention:** You wait for Ball #502 and give it a precise physical nudge with a solenoid plunger to alter its angle of approach by 0.5 degrees.
  2.  **Macro-Intervention:** You dump a bucket of extra "sacrifice" balls into the hopper *before* Ball #502 arrives.

  **The Symbolic Description:**
  The macro-intervention is described as **"Increasing the System Load."**
  The micro-intervention is described as **"Applying 0.05 Newtons of Force to Object #502."**

  **The Result:**
  Both interventions reliably cause Ball #502 to go into the "Keep" bin. However, the "System Load" description compresses the reality. To predict the outcome using the micro-description, you must calculate the trajectory of every sacrifice ball, the friction on the turbine, the tension on every wire, and the vibration phase of the mesh. It is an N-body problem that swamps any practical calculator.
  To predict the outcome using the macro-description, you only need to know: *Is the Load High or Low?* If High, the mesh tightens, and Ball #502 is kept. The macro-variable ("Load") screens off the micro-details.

  **The "Push":**
  By changing the "Load" (a statistical, symbolic property of the ensemble), you have physically altered the trajectory of Ball #502. The "Load" did not add energy to Ball #502 directly; it changed the *constraints* of the environment through which Ball #502 moved.

  ***

  ### The Verdicts

  Here is how the philosophical heavyweights would weigh in on your Centrifugal Sieve.

  **1. The Dennett-Style "Real Patterns" View**
  Dennett would say your physicist friend is making a category mistake. He thinks causation is a physical substance (like momentum) that must be conserved. Dennett argues causation is an explanatory relation.
  *   **Verdict:** The "System Load" is a **Real Pattern**. It is not a mere shorthand; it is a higher-order fact that supports counterfactuals. ("If I hadn't added the bucket, the ball would have fallen through.") Because the macro-level description allows for reliable prediction and intervention that the micro-level description cannot practically match, the macro-causation is real *relative to the intentional stance*. There is no exclusion problem because the two levels aren't competing for the same ontological space. One describes forces; the other describes constraints.

  **2. The Jaegwon Kim "Causal Exclusion" View**
  Kim would be unmoved. He would argue that for every physical event (Ball #502 rolling left), there is a sufficient physical cause (the tension in Wire #42 at time *t*).
  *   **Verdict:** The "System Load" is epiphenomenal. It is a shadow cast by the micro-events. The *real* cause of Ball #502's movement is the tension in the wire. The tension was caused by the governor. The governor was moved by the sacrifice balls. The "Load" is just a name we give to that chain of micro-events. If the micro-cause is sufficient, the macro-cause is excluded. To Kim, saying "The Load caused it" is like saying "The shadow broke the window" when it was the rock casting the shadow.

  **3. The "Same Event, Two Descriptions" Deflation**
  This is the standard compromise. It suggests that the macro-event and the micro-event are identical, just described differently.
  *   **Verdict:** This works smoothly here *until* you press on the compression. The "Load" is not identical to any *single* micro-state; it is identical to a *disjunction* of thousands of possible micro-configurations (different arrangements of sacrifice balls can all produce "High Load"). If the macro-cause maps to many possible micro-causes, you can't simply say they are the "same event." The macro-description captures a functional equivalence class that the micro-description misses. This suggests the macro-level has explanatory power the micro-level lacks, which troubles the simple deflation.

  ***

  ### The Honest Critique

  You asked me to be direct about where the body is buried. Here is the breakdown of the design's vulnerabilities.

  **What feature is doing the work?**
  The **feedback loop** (the governor). Without the governor linking the ensemble behavior (flow) back to the micro-constraints (mesh tension), the system is just billiard balls. The feedback loop is what allows the *statistical* property (flow rate) to become a *physical* constraint (wire tension). It turns a "pattern" into a "mechanism."

  **What happens if you remove that feature?**
  If the mesh tension is fixed, the "System Load" becomes a mere relabeling. Whether Ball #502 falls through depends only on its own size and angle. The presence of other balls becomes irrelevant noise. Your physicist friend wins immediately: the "Load" was just a story we told ourselves; the physics was all in the individual collisions. The case collapses into ordinary shorthand.

  **How would a defender of Kim attack it?**
  A Kim-defender would attack the **individuation of the cause**. They would argue: "You say 'High Load' caused the ball to stay. But 'High Load' is just a label for 'Sacrifice Balls A, B, and C hit the turbine with velocities X, Y, Z.' The *real* cause is the specific impact of Ball B on the turbine blade. If Ball B had been slightly heavier, the result might differ, even if the 'Load' remained 'High.' Therefore, the macro-property is too coarse-grained to be the true cause."
  They will argue that your "compression" is actually **information loss**, and causation requires precision. If you lose the micro-details, you lose the causal leverage.

  **Is the spec self-defeating?**
  Here is the hard truth you need for your column: **Yes, but only if you define "push" as "energy transfer."**

  If your physicist friend defines "cause" as "transfer of momentum or energy," then symbols *never* push. In the Centrifugal Sieve, the energy moving Ball #502 comes from gravity and the vibration motor. The "System Load" adds no energy. It only channels existing energy.
  *   **If you keep "Closed Microphysics":** You must concede that the symbol level does not add physical force.
  *   **If you keep "Genuine Push":** You must admit the symbol level acts as a *constraint*, not a *force*.
  *   **If you keep "Real Compression":** You must accept that the "cause" is a difference-making relation, not a physical shoving.

  **My advice for the column:**
  Do not try to prove that symbols add energy to the physical world. That is magic, and your physicist friend is right to reject it.
  Instead, argue that **constraints are causal.** A riverbank does not add energy to the river, but it causes the river to flood the town rather than the field. The "System Load" in my thought experiment is the riverbank. It is a physical fact, but it is a fact that *only exists at the macro level*. You cannot find a "riverbank" in a single water molecule.

  If you demand "push" mean "force," give up the claim that symbols push.
  If you demand "push" mean "make a difference," keep the claim, but admit it's a difference in *trajectory*, not *energy*.

  The trilemma resolves if you tell your friend: *"You're looking for a ghost in the machine that shoves the gears. I'm pointing out that the shape of the gears themselves is the ghost, and the shape is a symbolic fact."*
