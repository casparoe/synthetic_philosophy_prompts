answer: |-
  A single human oocyte is fertilized via intracytoplasmic sperm injection using a specific spermatozoon and egg, forming a zygote that develops in vitro to the two-cell stage. At this point, the two totipotent blastomeres are mechanically separated from one another (artificial monozygotic twinning), and a single-cell biopsy is taken from each resulting blastomere to confirm genetic identity before both are independently vitrified. After a period of cryopreservation, both blastomeres are thawed, implanted into separate uterine environments, and develop to term, resulting in two distinct adult persons, A and B, who share the same gametic origin but diverged prior to the formation of a primitive streak or any neural tissue.

  ***

  (a) **The Three Verdicts**

  *   **Psychological Continuity:** Person A began to exist only when the capacity for psychological states (memory, character, consciousness) emerged, likely months after implantation. Consequently, A did not exist during cryopreservation or at fertilization; the frozen blastomere was merely a potentiality, not a person.
  *   **Animalism:** Person A began to exist at the moment of blastomere separation. The original zygote was a single human organism that ceased to exist upon fission, giving rise to two new, numerically distinct organisms. Thus, A existed continuously through cryopreservation (as a living animal), but A did not exist at fertilization.
  *   **Origin Essentialism:** Person A began to exist at fertilization. Since A essentially originates from *that* specific sperm and egg, and that union occurred at fertilization, A's existence is fixed at that point. A existed continuously through cryopreservation because the gametic origin remains constant regardless of the subsequent mechanical splitting of the embryo.

  (b) **The Structural Feature**

  The work is done by the **fission of a totipotent blastomere prior to individuation**. This creates a gap between the *gametic source* (which is singular and shared by both twins) and the *organismic trajectory* (which bifurcates). For the Origin Essentialist, the gametic source is the anchor of identity, so both twins trace back to the single zygote. For the Animalist, the organism is the anchor, and since one organism cannot become two without ceasing to exist, the twins must be new organisms starting at the split. For the Psychological Continuity theorist, neither the gametes nor the organism matters; only the brain matters, placing the start of existence much later. The split forces the Essentialist and Animalist apart on *when* the relevant entity (origin-product vs. organism) begins, while the Cryopreservation interval forces them to agree on continuity *from their respective start points*, distinguishing them both from the Psychological view which denies existence during the freeze.

  (c) **Analysis of Removal**

  If the blastomere separation (fission) is removed, the case collapses into an **ordinary frozen-embryo case** (a singleton IVF pregnancy). In this scenario, the Animalist and the Origin Essentialist converge: both would agree that the person/organism began at fertilization and existed continuously through cryopreservation. The Psychological Continuity view would remain distinct (beginning later). The three-way divergence collapses into a two-way divergence, and the specific tension regarding whether A could have been B (haecceity) vanishes, as there is no second twin to confuse the identity conditions.

  (d) **Strongest Replies and Assessment**

  *   **Animalist Reply (Olson-style):** An Animalist might argue that the zygote *does* survive fission as one of the twins (perhaps determined by which blastomere retains the original cytoplasmic polarity), meaning A *could* be the original organism. This would align Animalism with Origin Essentialism on the onset time (fertilization), collapsing the divergence. However, this requires accepting indeterminacy in biological identity that many Animalists reject.
  *   **Psychological Continuity Reply (Parfit-style):** A Parfitian would argue that the question of numerical identity ("Did A exist then?") is empty; what matters is Relation R (psychological connectedness). They would concede the verdict but deny its moral weight, arguing that the "person" is a series of mental events, not a substance persisting through freezing.
  *   **Origin Essentialist Assessment:** There is no comparable reply available to you without refining the thesis. The case exposes an ambiguity in "origin": does it mean the *material cause* (the gametes) or the *formal cause* (the individuated developmental path)? If it is merely material, you must accept that two distinct persons (A and B) share the same origin and both existed at fertilization, which strains the transitivity of identity (if A=Zygote and B=Zygote, then A=B). If it includes individuation, your view collapses into Animalism. The case suggests "origin" cannot simply be the gamete pair if fission is possible.

  (e) **Final Verdict**

  The case shows that **Origin Essentialism needs refinement**. As stated, it cannot handle fission cases where the gametic origin is shared by two distinct persons. It was never really a thesis about *persons* in isolation, but about persons-as-unique-products-of-gametes. To survive, it must incorporate a clause regarding *unique developmental trajectories* or accept that "origin" refers to the first point of individuation (the split) rather than the point of syngamy (fertilization), which would concede the core intuition to Animalism.
