      OAK CREEK, Wis. — Local resident Gary Miller, 44, was issued a formal citation Tuesday by the Oak Creek Office of Moral Standards for "exceeding the scope of his duties," an offense officials say has destabilized the neighborhood's moral economy. The citation, filed under Non-Mandatory Virtue Violations, notes that while Miller's actions were praiseworthy, their frequency has rendered the optional obligatory in the public eye.

      Miller was recognized last week for returning a lost wallet containing $4,000 and subsequently donating plasma to fund a stranger's surgery. Under standard ethical zoning laws, these acts are classified as supererogatory: morally excellent but not required. However, the Office argues that by consistently performing acts above the baseline, Miller has inadvertently recalibrated community expectations.

      "We cannot logically blame his neighbors for refraining from similar acts," said Office Director Linda Hesketh, reviewing the paperwork. "Yet, due to Mr. Miller's excess, their permissible inaction now appears blameworthy. He has created a liability of expectation. You cannot have a functioning society where everyone is a saint. It ruins the curve."

      The citation highlights the asymmetry at the heart of the complaint. Miller deserves praise, yet neighbors cannot be coerced to match him. Nevertheless, several residents filed grievances. Next-door neighbor and utilitarian advocate Mark Davis argued that the category of supererogation is itself a fiction. "If Miller had the capacity to save more lives, stopping at two good deeds is simply a violation waiting to be counted," Davis said. "There is no 'above and beyond.' There is only the maximum possible good. Anything less is negligence."

      Conversely, Kantian resident Arthur Schmitt expressed concern that Miller's excess cheapens moral worth. "Genuine respect is owed only to what is required by duty," Schmitt said. "When you treat optional benevolence as a standard, you confuse inclination with obligation. It is messy."

      Miller expressed confusion over the penalty. "I wanted to help," Miller said. "But now I feel resentful. I enjoyed the praise, but I realize I've quietly lowered everyone else's standing. If I bring a casserole to a funeral, now I'm expected to organize the grief counseling."

      Despite the praise, neighbors admit Miller has become exhausting to be around. During a recent block party, Miller spent forty-five minutes discussing resource allocation instead of eating hot dogs. "He's morally perfect," said one attendee. "But he crowds out the other things that make someone a good dinner guest. You just want to relax, not be judged by a living saint."

      The Office has ordered Miller to cease all non-mandatory virtues pending a review. He remains free to perform basic duties, provided he does not excel at them.

