answer: |-
  Here is a complete session plan designed to generate the philosophical tension you need without pre-loading the terminology.

  # Session Plan: The Codification Trap
  **Time:** 120 Minutes
  **Students:** 14 (Divide into 3 Groups: two of 5, one of 4)
  **Materials:** 8 Case Files (printed), Rulebook Sheets (printed), Scoreboard (whiteboard).

  ## I. Timeline & Flow

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide groups. Explain the "Ethics Committee" role. Distribute **Cases 1 & 2**. |
  | **10–30** | **Round 1** | Groups judge Cases 1–2. **Draft Initial Rulebook.** (Rules must explain verdicts). |
  | **30–40** | **Audit 1** | **The Swap.** Groups exchange Rulebooks. They hunt for "Thick Terms" (e.g., *fair, just, odious*). If found, the writing group loses 10 pts, auditing group gains 5. |
  | **40–60** | **Round 2** | Distribute **Cases 3 & 4**. Groups apply *their* Rulebook. **Revision Allowed** but costs 15 pts per rule changed. |
  | **60–70** | **Audit 2** | Swap and Audit again. Check for consistency between Rulebook and Verdicts. |
  | **70–75** | **The Lock** | **Announce "Constitutional Convention Closed."** No more rule revisions allowed for the rest of the session. |
  | **75–95** | **Round 3** | Distribute **Cases 5, 6, 7 & 8**. Groups must apply locked Rulebook. (Cases 7 & 8 are the divergence point). |
  | **95–105** | **Scoring** | Final Tally. Reveal that different groups likely reached different verdicts on Case 8 based on different rule-paths. |
  | **105–120** | **Debrief** | Connect activity to Generalism (Ross) vs. Particularism (Dancy). |

  ---

  ## II. The Mechanics (Handout Text)

  **The Goal:** Maximize your group's score.
  **The Task:** You are an Ethics Committee. You must issue a verdict (**Permissible** / **Impermissible**) for each case.
  **The Constraint:** You cannot just vote. You must write a **Rule** that explains *why*.
  **The Scoring:**
  1.  **Consistency (20 pts):** If your Verdict matches what your written Rule predicts, you get points. If your Rule implies "Permissible" but you vote "Impermissible," you get 0.
  2.  **Precision (Audit Bonus):** You may not use "Thick Ethical Terms" in your rules (e.g., *good, bad, right, wrong, fair, unjust, respectful, odious*). You must use descriptive terms (e.g., *increased profit, caused pain, followed protocol, broke promise*).
      *   *Mechanism:* During Audit phases, other groups read your rules. If they find a Thick Term, you lose 10 points, they gain 5. This forces you to write rules that a computer could follow.
  3.  **Stability (Lock-in Bonus):** In Round 3, rules are locked. If you successfully navigate Cases 5–8 without changing a rule, you get a 50 pt bonus. If you change a rule, you lose the bonus and pay a 15 pt penalty.

  ---

  ## III. The Case Files
  *Theme: Institutional Decision-Making (A Hospital Administration Board)*
  *Key Inverting Feature: "Adherence to Protocol" and "Intent to Benefit."*

  **Case 1**
  Dr. Aris bypasses standard triage paperwork to administer a life-saving drug to a crash victim immediately. The patient survives.
  *Feature:* Protocol Breach + Good Outcome.
  *Expected Verdict:* Permissible.

  **Case 2**
  Dr. Aris fills out all triage paperwork perfectly before administering the same drug to a crash victim. The patient dies during the delay.
  *Feature:* Protocol Adherence + Bad Outcome.
  *Expected Verdict:* Impermissible (or at least blameworthy).
  *(Trap: Students will write rules favoring Outcome over Protocol).*

  **Case 3**
  Dr. Aris bypasses paperwork to administer a drug to a crash victim. The patient has an unknown allergy and dies.
  *Feature:* Protocol Breach + Bad Outcome (Unforeseeable).
  *Expected Verdict:* Permissible (Intent was good).
  *(Strain: Rules from Case 2 might demand punishment for bad outcomes).*

  **Case 4**
  Dr. Aris follows paperwork perfectly. The patient has an unknown allergy and dies.
  *Feature:* Protocol Adherence + Bad Outcome.
  *Expected Verdict:* Permissible (No negligence).
  *(Strain: Forces distinction between Case 2 and Case 4. Why was Case 2 bad? Because the delay was unnecessary. Why is Case 4 okay? Because the delay was procedural safety).*

  **Case 5**
  Dr. Aris bypasses paperwork to administer a drug to a crash victim. The victim is a known criminal who, upon recovery, kills a nurse.
  *Feature:* Protocol Breach + Good Medical Outcome + Bad Social Outcome.
  *Expected Verdict:* Permissible (Medical ethics usually bracket social consequences).
  *(Strain: "Good Outcome" rules get complicated. Is saving a life always a 'good outcome' for the rule?)*

  **Case 6**
  Dr. Aris follows paperwork perfectly. The victim is a known criminal who, upon recovery, kills a nurse.
  *Feature:* Protocol Adherence + Good Medical Outcome + Bad Social Outcome.
  *Expected Verdict:* Permissible.
  *(Strain: If groups wrote "Prevent Harm" as a rule, they might be forced to say Impermissible here, contradicting Case 5).*

  **Case 7**
  Dr. Aris bypasses paperwork to administer a placebo to a distressed patient who believes it is real medicine. The patient recovers via psychosomatic effect.
  *Feature:* Protocol Breach + Deception + Good Outcome.
  *Expected Verdict:* **Divergence Point.**
  *Rule Path A (Outcome focused):* Permissible.
  *Rule Path B (Protocol/Truth focused):* Impermissible.

  **Case 8 (The Final Case)**
  Dr. Aris follows paperwork perfectly to deny a costly treatment to a distressed patient. The patient recovers on their own, but suffered severe anxiety during the wait. The hospital saves money which is used to fund three other life-saving treatments.
  *Feature:* Protocol Adherence + Individual Harm + Collective Benefit.
  *Expected Verdict:* **Divergence Point.**
  *Rule Path A (Utilitarian/Outcome):* Permissible (Net lives saved).
  *Rule Path B (Rights/Protocol):* Impermissible (Duty to *this* patient violated).

  ---

  ## IV. Scoring Scheme (For the Instructor)

  You do not need to police the "Thick Terms" rule; the **Audit** does it.
  *   **Round 1 Score:** 20 pts per Consistent Verdict.
  *   **Round 2 Score:** 20 pts per Consistent Verdict. Minus 15 pts per Rule Revision.
  *   **Round 3 Score:** 40 pts per Consistent Verdict. Minus 50 pts if *any* rule is revised (Loss of Lock-in Bonus).
  *   **Audit Penalties:** -10 pts per Thick Term found in your Rulebook by another group.

  **Why this works:**
  1.  **Vagueness is expensive:** If they write "Do what is fair," the other groups *will* find it to gain points. They are incentivized to define "fair" descriptively (e.g., "equal wait times").
  2.  **Revision is painful:** In Round 2, they can fix broken rules, but it hurts their score. In Round 3, they *cannot* fix broken rules without losing the big bonus. This simulates the "rigidity" of generalism.
  3.  **Divergence:** By Case 8, Group A (who prioritized Outcomes in Round 1) will likely say **Permissible**. Group B (who prioritized Protocol/Rights in Round 1) will likely say **Impermissible**. Both are consistent with their own rulebooks.

  ---

  ## V. The Debrief Script (15 Minutes)

  **1. The Reveal (5 mins)**
  *   Ask Group A for their Case 8 verdict. Ask Group B.
  *   "You had the same facts. You had the same goal (ethics). Why did you disagree?"
  *   Answer: "Because our Rulebooks were different."
  *   "But why were the Rulebooks different? You all saw the same Cases 1 and 2."
  *   Answer: "Because we weighed the features differently."

  **2. Mapping the Literature (5 mins)**
  *   **The Generalist Intuition (W.D. Ross):** "You felt a pull to write rules in Round 1. You wanted a principle that covered all cases. You thought if you just made the rule complex enough (added *ceteris paribus* clauses), it would work."
      *   *Point to Case 3 & 4:* "Here, 'Bad Outcome' meant blame in Case 2, but not in Case 4. The feature 'Death of Patient' changed its moral weight depending on the feature 'Paperwork Delay'."
  *   **The Particularist Critique (Jonathan Dancy):** "Then came the Lock-in. You found that a rule that worked in Round 1 failed in Round 3. Dancy calls this the **Holism of Reasons**. A feature (like 'breaking protocol') is not inherently good or bad. Its contribution depends on the context. In Case 1, breaking protocol was heroic. In Case 7, it was deception."
  *   **The Hollowing Out:** "When you tried to fix your rules in Round 2, did you find yourselves adding exceptions? 'Follow protocol *unless*...'? Dancy argues that if you add enough exceptions, the rule no longer explains the verdict; the context does."

  **3. The Missing Piece (5 mins)**
  *   "The game shows that rules fail. It does *not* show that particularism is true."
  *   "Particularism makes a positive claim: that we can be trained to judge correctly *without* rules. In this game, when your rules broke, you just guessed. A true particularist says your moral perception should have been *sharper*, not rule-less."
  *   "Ross says: The rules are real, but they can conflict (Prima Facie Duties). Dancy says: The rules are myths; there is only the situation."

  ---

  ## VI. Troubleshooting: What Will Go Wrong

  **1. The "Vague Rule" Loophole**
  *   *Problem:* Students write: "Follow protocol unless it causes harm." They define "harm" loosely during application.
  *   *Fix:* The **Audit** mechanic handles this, but students might be too polite.
  *   *Instructor Move:* During the first Audit, model aggression. "Group 2, look at Group 1's Rule 3. What does 'unnecessary' mean? If you can't measure it with a stopwatch or a dollar amount, it's a Thick Term. Tax them."

  **2. The "Consistent Inconsistency"**
  *   *Problem:* A group realizes their rule fails Case 5, so they simply vote against their own rule and accept the point penalty because it's cheaper than rewriting.
  *   *Fix:* Increase the penalty for inconsistency in Round 3. Make it higher than the cost of revision. Or, announce that "In Round 3, Consistency is worth double points."

  **3. The "Rulebook Convergence"**
  *   *Problem:* All groups write the exact same utilitarian rule, so Case 8 yields unanimous verdicts.
  *   *Fix:* Intervene in Round 1. "Group A, I see you prioritized Patient Outcome. Group B, I see you prioritized Institutional Integrity. Stick to those priorities for your first rule." This seeds the divergence early.

  **4. The "Ceteris Paribus" Hedge**
  *   *Problem:* Students write "Follow protocol, *other things being equal*."
  *   *Fix:* Ban the phrase "other things being equal" or "usually" in the Rule Instructions. Rules must be conditional statements: "IF X, THEN Y."

  ---

  ## VII. What This Game Cannot Do (Honest Assessment)

  You asked for frankness about the limitations. Here is what the activity cannot reproduce:

  1.  **The Competence of the Particularist:** The game simulates the *failure* of rules, which supports the negative thesis of particularism. It does not simulate the *success* of non-codifiable judgement. In the game, when rules fail, students flail. In Dancy's view, a morally mature agent doesn't flail; they perceive the salience of the features directly. You must supply this in the debrief: "Notice how lost you felt when the rules broke? Dancy says you shouldn't feel lost; you should feel liberated from a bad map."
  2.  **The Normative Force of Principles:** The game makes principles look like mere prediction tools (like a scientific hypothesis). It misses the *authority* of principles. Ross argues principles bind us even when they conflict. The game makes them look like disposable heuristics.
  3.  **Time:** Real moral development (the "training" particularists talk about) takes years. This takes 90 minutes. The "judgement" they exercise in Round 3 is just intuition, not trained perception. Be careful not to validate their Round 3 guesses as "moral wisdom."

  **Final Tip:** Do not write "Particularism" or "Generalism" on the board until the last 15 minutes. Let them feel the frustration of the Lock-in first. The vocabulary will land much harder if they have just suffered the problem the vocabulary solves.
