prompt: |-
  I teach a third-year seminar on ethical theory — fourteen students, one two-hour session — and we've just finished a stretch on rule-based and principle-based ethics. For the following week I want to run an activity that sets up the particularism/generalism debate before I've lectured on it at all: the students shouldn't hear the word "particularism" until the debrief. My idea is something along the lines of a "codification game": small groups act as an ethics committee that issues verdicts on case files I hand them, and after each batch of cases they must commit to written rules that explain their verdicts — the rules then get applied, mechanically and in advance, to the next batch, and the groups are scored on how well their rulebook predicts their own later judgements. Crucially, I want the case sequence engineered so that features which counted in favour of a verdict early on come to count against it later: courage in an agent's character making things worse rather than better, or a promise being kept in a way that makes the action odious, or someone's wellbeing being promoted in a way that insults them. The point is for the students to run headlong into the thought that the same feature doesn't always carry the same weight in every context — that its contribution can invert or deflate depending on what else is present in the case — and then to discover that the natural response ("my rule just needs a ceteris paribus clause") quietly hollows out the rulebook.

  What I'd like from you: a full session plan with a timeline, the case files themselves (at least eight, short but non-thin — the sort where a student can genuinely go either way), the exact rules for when and how the groups must codify, and a scoring scheme that makes the hedging move costly without my having to police it. One constraint I want built into the mechanics: at some point the groups should be forbidden from revising their rules mid-round, so that they feel the pull of the generalist's complaint that pure case-by-case judgement is unprincipled and unpredictable, and not only the particularist's complaint that the rules keep letting them down. If you can find a way to have different groups, each with a different accumulated rulebook but the identical final case, arrive confidently at divergent verdicts, that would be ideal.

  Finally, the debrief: I want it to name Dancy's holism of reasons and Ross's prima facie duties as the two poles the class has just been oscillating between, and to map specific moments in the activity onto specific moves in the literature — e.g., which case did the most damage to the invariant-reading of a rule, and which round made case-by-case judgement look least reproducible. Please also tell me frankly what will predictably go wrong the first time I run it (I anticipate students writing rules so vague that nothing can defeat them; how do I handle that without simply legislating the conclusion?), and be honest about which feature of the actual debate no classroom game can reproduce — the particularist's positive claim that mature judgement can be trained and criticised without recourse to principles at all, which presumably can't be staged in ninety minutes and I'll have to supply myself at the board.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** Third-year seminar on ethical theory (14 students, 2-hour session).
      *   **Current Status:** Finished rule/principle-based ethics. Next week is particularism/generalism.
      *   **Goal:** Run an activity *before* lecturing on particularism to set up the debate. Students shouldn't hear the word "particularism" until the debrief.
      *   **Core Mechanic:** "Codification Game." Small groups act as an ethics committee. They judge cases, then write rules to explain verdicts. Rules are applied mechanically to future cases. Scored on consistency between rulebook and later judgments.
      *   **Key Philosophical Point:** Holism of reasons (features can change valence/weight depending on context).
      *   **Specific Constraints:**
          *   Need at least 8 case files (short but non-thin).
          *   Features must invert (e.g., courage becomes recklessness, promise-keeping becomes odious).
          *   Scoring scheme must penalize hedging/vagueness without instructor policing.
          *   Must forbid rule revision at some point (to show the cost of rigidity).
          *   Ideally, different groups with different rulebooks reach divergent verdicts on the *same* final case.
          *   Debrief must connect to Dancy (holism) and Ross (prima facie duties).
          *   Must predict potential failures (e.g., vague rules) and offer mitigation.
          *   Must acknowledge what the game *can't* do (particularist positive claim about trained judgement).
      *   **Timeline:** 2 hours (120 minutes).

  2.  **Design the Activity Mechanics:**
      *   *Groups:* 14 students = 3 groups of 4, 1 group of 5 (or 2 groups of 7, but smaller is better for consensus). Let's aim for 3 groups of 4-5.
      *   *Rounds:* Need a progression.
          *   Round 1: Intuition & Rule Formation.
          *   Round 2: Application & Strain.
          *   Round 3: The Lock-In (No revisions) & Divergence.
      *   *Scoring:* Needs to be objective.
          *   Points for consistency (Rule predicts Verdict).
          *   Points for specificity (Vague rules get 0 points).
          *   *Idea:* Use a "Rule Validity Check." If a rule says "Always X unless Y," and Y is undefined, it fails the check.
      *   *The "Trap":* The cases need to be designed so that a rule generated in Round 1 fails in Round 2 or 3 unless modified. But modification is restricted later.
      *   *Divergence:* To get divergent verdicts on the final case, the groups need to have committed to different *priorities* or *exceptions* in their rulebooks during the early rounds.

  3.  **Drafting the Cases (The Core Challenge):**
      *   Need 8 cases.
      *   Theme: Let's use a mix of professional ethics and everyday morality to keep it engaging. Let's focus on "Truth-telling/Promise-keeping" vs. "Well-being/Harm" vs. "Character/Virtue."
      *   *Case 1 (Baseline):* Clear lie to save a life. (Verdict: Permissible). Rule: "Lie to prevent harm."
      *   *Case 2 (Inversion 1):* Truth-telling causes harm. (Verdict: Impermissible to tell truth?). Wait, need the *feature* to invert.
      *   *Let's try a specific feature:* "Keeping a Promise."
      *   *Case 1:* Promise to meet for lunch. Trivial. Keep it. (Feature: Promise = +)
      *   *Case 2:* Promise to meet for lunch, but friend needs emergency help. Break it. (Feature: Promise = overridden by harm).
      *   *Case 3:* Promise to keep a secret. Secret is harmful. Break it.
      *   *Case 4:* Promise to keep a secret. Secret is embarrassing but harmless. Keep it.
      *   *Case 5 (The Twist):* Promise to *do* something harmful (e.g., help hide a crime). Keeping promise = Bad.
      *   *Case 6 (The Subtler Twist):* Promise to do something good, but keeping it insults the recipient (paternalism).
      *   *Actually, let's make it tighter.* Let's focus on *one* domain to make the rule-writing easier. "The Allocation Committee." Deciding who gets a limited resource (scholarship, organ, grant).
      *   *Feature to invert:* "Past Contribution" or "Merit."
      *   *Case 1:* High merit, needs resource. Give it. (Merit = +)
      *   *Case 2:* High merit, but already wealthy. Don't give. (Merit = neutralized by need).
      *   *Case 3:* Low merit, but desperate need. Give it. (Need > Merit).
      *   *Case 4:* High merit, but resource would be wasted (they quit). Don't give. (Merit = negative predictor of success).
      *   *Case 5:* Low merit, but resource fixes the merit issue (training). Give it.
      *   *Case 6:* High merit, but gained through unethical means. Don't give.
      *   *Case 7:* Equal merit, one is a friend. (Partiality).
      *   *Case 8 (Final):* Complex mix where Group A's rule says Yes, Group B's rule says No.

      *Refining the Cases for the Prompt's specific request:* The prompt asks for features like "courage making things worse" or "promise keeping being odious." Let's create a "Moral Review Board" scenario reviewing actions of agents.
      *   *Feature:* "Intent to Help."
      *   *Case 1:* Intent to help, success. (Good).
      *   *Case 2:* Intent to help, failure due to bad luck. (Still Good/Excusable).
      *   *Case 3:* Intent to help, but ignores consent (Paternalism). (Bad).
      *   *Case 4:* Intent to help, but helps the wrong person at expense of right person. (Bad).
      *   *Feature:* "Following Protocol."
      *   *Case 5:* Followed protocol, saved life. (Good).
      *   *Case 6:* Followed protocol, let die when exception was obvious. (Bad/Bureaucratic).
      *   *Case 7:* Broke protocol, saved life. (Good/Justified).
      *   *Case 8:* Broke protocol, caused chaos. (Bad).

      *Let's go with the "Ethics Committee on Professional Conduct" theme.* It fits the "committee" roleplay.
      *   *Cases:* 8 short vignettes about a doctor/professional.
      *   *Key Inverting Feature:* "Adherence to Standard Procedure" (ASP).
      *   *Cases 1-2:* ASP = Good.
      *   *Cases 3-4:* ASP = Bad (rigid).
      *   *Cases 5-6:* Deviation = Good.
      *   *Cases 7-8:* Deviation = Bad.
      *   *Final Case:* Ambiguous mix.

  4.  **Developing the Scoring & Rules:**
      *   *Rule Format:* Must be "If [Condition], then [Verdict]."
      *   *Vagueness Penalty:* The "Operationalization Check." Before a rule is accepted, the facilitator (me) asks: "How would a computer decide this?" If it requires moral intuition to apply the rule, it's rejected. *Correction:* The prompt says "without my having to police it." I need a mechanical way.
      *   *Idea:* "The Keyword Ban." Rules cannot use thick ethical terms (good, bad, right, wrong, fair, just). They must use descriptive terms (age, income, stated intent, protocol followed).
      *   *Scoring:*
          *   Round 1: 10 pts per consistent verdict.
          *   Round 2: 20 pts per consistent verdict.
          *   Round 3 (Lock-in): 50 pts per consistent verdict. -50 pts for contradiction.
          *   *Vagueness:* If a rule contains a "banned word," it scores 0 for that round. Students police each other because they want the points.

  5.  **Structuring the Session (120 mins):**
      *   0-10: Intro & Grouping.
      *   10-30: Round 1 (Cases 1-2 + Rule Writing).
      *   30-50: Round 2 (Cases 3-4 + Application + Revision allowed).
      *   50-55: Break/Score Check.
      *   55-75: Round 3 (Cases 5-6 + Application + **NO Revision**).
      *   75-95: Round 4 (Case 7-8 + Final Verdicts).
      *   95-120: Debrief.

      *Wait, I need to ensure the "Lock-in" happens at the right time.*
      *   Better:
          *   Phase 1 (Cases 1-3): Develop Rules.
          *   Phase 2 (Cases 4-6): Apply Rules (Revision Allowed but Costly).
          *   Phase 3 (Cases 7-8): **Lock-in**. No revisions. Apply existing rules.
          *   This ensures they feel the pain of the rulebook when the context shifts.

  6.  **Addressing the "Divergent Verdicts" Constraint:**
      *   To get divergence on the final case, the groups need to have taken different paths in Rule Writing.
      *   *Mechanism:* In Round 1, give them a choice of *priority*. "You must prioritize either X or Y in your first rule."
      *   *Alternative:* Just let them write naturally. If Case 8 is truly balanced, Group A (who prioritized Procedure) will say Yes, Group B (who prioritized Outcome) will say No.
      *   *Design:* Final Case involves a deviation from procedure that yields a mixed outcome. Procedure-focused rules say "Impermissible." Outcome-focused rules say "Permissible."

  7.  **Addressing the "Vague Rules" Problem:**
      *   Constraint: Rules must be *falsifiable*.
      *   Mechanic: "The Challenge Phase." After a group submits rules, another group can challenge a rule as "Unfalsifiable." If the writing group can't define the terms descriptively, they lose points. This gamifies the precision.

  8.  **Drafting the Content:**
      *   *Timeline:* Detailed minute-by-minute.
      *   *Cases:* Write 8 specific vignettes.
      *   *Rules:* Clear instructions on formatting.
      *   *Scoring:* Point system.
      *   *Debrief:* Scripting the connection to Dancy/Ross.
      *   *Troubleshooting:* What if they cheat? What if they write "Do the right thing"?

  9.  **Refining the Philosophy:**
      *   *Dancy:* Holism. Reasons change valence.
      *   *Ross:* Prima Facie. Reasons have invariant valence but can be overridden.
      *   *The Game:* Shows why Ross is tempting (we want rules) but why Dancy might be right (rules fail in edge cases).
      *   *The Missing Piece:* Particularism isn't just "rules fail." It's "judgement works without rules." The game shows rules failing, but doesn't prove judgement works. I need to explicitly state this limitation in the advice section.

  10. **Final Review against Constraints:**
      *   14 students? Yes (3-4 groups).
      *   2 hours? Yes.
      *   No "Particularism" word until debrief? Yes.
      *   8 cases? Yes.
      *   Feature inversion? Yes (Procedure/Intent).
      *   Scoring penalizes hedging? Yes (Descriptive language requirement).
      *   Lock-in round? Yes.
      *   Divergent final verdicts? Yes (via rule path dependency).
      *   Debrief plan? Yes.
      *   Troubleshooting? Yes.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Scoring:* If I police the "descriptive language" rule, I'm policing. I need the *students* to police it.
      *   *Solution:* "The Audit." Groups swap rulebooks. If Group A finds a thick term in Group B's rule, Group B loses points, Group A gains points. This makes precision a competitive advantage.
      *   *Correction on Cases:* Make sure they are short enough to read quickly but dense enough to argue.
      *   *Correction on Lock-in:* Make sure the lock-in happens *before* the hardest cases.

  12. **Final Polish:** Check tone (collegial, precise, ready-to-use). Ensure the distinction between Ross and Dancy is clear in the debrief section. (Ross: Rules are real but defeasible. Dancy: Rules are myths, only context matters).

  *(Self-Correction on the "Vague Rules" constraint)*: The prompt asks for a scoring scheme that makes hedging costly *without* me policing it. The "Audit" mechanism is the best way to do this. If a rule says "unless it's unfair," another group can challenge "Define unfair descriptively." If they can't, the rule is void.

  *(Self-Correction on Divergence)*: To guarantee divergence, the Final Case must be a "Rorschach Test" for the specific rules they wrote. I will design Case 8 to be neutral enough that Rule Set A (Procedure-heavy) and Rule Set B (Outcome-heavy) yield opposite results.

