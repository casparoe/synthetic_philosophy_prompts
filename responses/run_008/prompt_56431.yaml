prompt: |-
  I'm a second-year PhD student in economics, taking a course that covers game theory with incomplete information. Last week the lecturer introduced the common prior assumption — the idea that in models with asymmetric information, all agents' beliefs should be represented as posteriors derived from a single shared probability distribution, with agents differing only in the private evidence (their information partitions) that they have conditioned on. He treated it as routine technical hygiene: without it, he said, Harsanyi-style type spaces lose their tractability, and results like the no-betting characterization of common priors simply fail to apply. When another student asked whether the assumption is actually *true* of people, though, his answer was surprisingly hedged, and I've been mulling over a suspicion about it ever since.

  Here is the suspicion I'd like you to argue for, in its strongest form: the common prior assumption is not really an empirical claim about agents at all, but a bookkeeping convention whose truth or falsity is relative to where an observer draws the line between "evidence the agent received" and "opinion the agent brought to the table." On this view, two disagreeing agents can be described, without loss of predictive content, either as having genuinely different priors or as having conditioned a common prior on different private signals — one simply shuttles material between the prior and the information partitions until the model comes out however one wants it to. If that is right, then asking whether real agents "in fact" have common priors is a confused question, and standard defenses of the assumption — that rational priors must be grounded in shared objective facts, or that we should posit some literal initial meeting of minds before agents' experiences diverged — are attempts to dress up a modeling convention in metaphysical clothes.

  Please make the case as rigorously as you can. In particular, I want you to engage with the most obvious rejoinder: within the standard formalism, information partitions are not freely revisable artifacts of description but fixed parts of the model, and there are honest mathematical characterizations of when a given interactive belief system admits a common prior and when it doesn't — which suggests the assumption does substantive work rather than merely conventional work. You'll need to explain how your conventionality claim survives, or should be weakened in light of, that observation. After the main argument, append a brief structured summary as a JSON object with the following fields: "thesis" (the position argued for, in one sentence), "key_moves" (an array of three to six one-sentence premises or inference steps), "strongest_objection" (the single most serious objection to your argument, in one sentence), and "reply_to_objection" (your response, in one to two sentences).
