answer: |-
  Your suspicion is well-founded and touches on a foundational tension in epistemic game theory between the *formal constraints* of the Harsanyi doctrine and the *ontological flexibility* of the modeler. The argument you are articulating is essentially that the Common Prior Assumption (CPA) is not a constraint on the agents' rationality, but a constraint on the modeler's choice of state space granularity.

  Here is the case for the conventionality of the common prior assumption, rigorously developed.

  ### The Decomposition of Belief and the Locus of Convention

  To understand why the CPA is conventional, we must first look at the Bayesian mechanics of belief formation. An agent's posterior belief about a state of the world $\omega \in \Omega$ given a signal $s$ is determined by Bayes' rule:
  $$ P(\omega | s) = \frac{P(s | \omega) P(\omega)}{P(s)} $$
  Disagreement between two agents regarding $P(\omega | s)$ can arise from differences in the prior $P(\omega)$, differences in the likelihood function $P(s | \omega)$ (how they interpret evidence), or differences in the signal $s$ itself.

  In standard Harsanyi type spaces, we typically fix the interpretation of signals (the information partition) and treat the prior as the common ground. If agents disagree on posteriors, the CPA forces us to attribute this to them having received different signals $s_i$ from a shared distribution. If we drop the CPA, we attribute the disagreement to different $P(\omega)$.

  The conventionality thesis rests on the observation that there is no empirical test that can uniquely distinguish between "different priors" and "different signals conditioned on a common prior," *unless* we independently define what constitutes a "signal" versus a "prior." But in game theory, signals are not observed physical events like coin flips; they are theoretical constructs representing the agent's private information partition. The modeler *assigns* the partition based on the story they wish to tell.

  Consider two agents who disagree on the probability of a recession.
  1.  **Model A (Heterogeneous Priors):** Both agents see the same economic data (same partition), but Agent 1 is inherently optimistic ($P_1$) and Agent 2 is inherently pessimistic ($P_2$).
  2.  **Model B (Common Prior):** There is a hidden variable $\theta$ representing "economic regime." Agent 1 receives a private signal $s_1$ indicating $\theta = \text{boom}$, and Agent 2 receives $s_2$ indicating $\theta = \text{bust}$. They share a prior over $\theta$.

  If the agents' behavior (betting, trading, strategy choice) is identical in both models, the choice between Model A and Model B is purely descriptive. You have simply shuffled probability mass from the prior term $P(\omega)$ to the likelihood term $P(s | \omega)$. Since the "signal" is defined by the modeler to explain the divergence in beliefs, you can always construct a signal structure that rationalizes any set of posteriors given a common prior, provided you are willing to expand the state space.

  ### The Objection: Mathematical Substantiveness

  The most serious rejoinder, which your lecturer hinted at, relies on the internal mathematics of fixed type spaces. In a fixed interactive belief system $(\Omega, \mathcal{P}_1, \mathcal{P}_2, \mu_1, \mu_2)$, the existence of a common prior is a strict mathematical property. It is not always possible to find a single distribution $p$ on $\Omega$ such that $\mu_i(\cdot) = p(\cdot | \mathcal{P}_i(\omega))$.

  Furthermore, the CPA has testable implications *within a fixed model*. The most famous is the **No Betting Theorem** (Milgrom and Stokey, 1982; Aumann, 1976). If agents share a common prior, they cannot agree to disagree, and they cannot accept a bet that is common knowledge to be mutually beneficial. If we observe agents agreeing to disagree (e.g., engaging in speculative trade with common knowledge of each other's positions), then *for that specific state space*, no common prior exists.

  This suggests the CPA is substantive: it rules out certain configurations of belief hierarchies. It forbids "agreeing to disagree." If the assumption were merely conventional, it should be able to accommodate any belief configuration by relabeling. Since it cannot accommodate agreeing-to-disagree within a fixed $\Omega$, it seems to be doing real work.

  ### The Rebuttal: Ontological Flexibility and the "Extended" State Space

  The conventionality claim survives this objection by shifting the focus from *intra-model restrictions* to *inter-model choice*. The No Betting Theorem proves that CPA restricts beliefs *given a fixed ontology of uncertainty*. It says: "If you insist that $\Omega$ contains all relevant uncertainties, then these belief profiles are impossible under a common prior."

  However, the choice of $\Omega$ is itself a modeling convention. When faced with agents who "agree to disagree" (violating the CPA on $\Omega$), the modeler has a choice:
  1.  **Reject CPA:** Conclude the agents have fundamentally different priors over $\Omega$.
  2.  **Expand $\Omega$:** Conclude that the agents share a common prior over a larger space $\Omega' = \Omega \times \Theta$, where $\Theta$ represents the "source of the prior divergence."

  For example, if Agent 1 and Agent 2 disagree on the probability of rain, and we cannot explain this via different weather reports (signals) over the standard state space, we can introduce a new state variable $\tau$ representing "Agent 1's prior type." We posit a common prior over $(\text{Weather}, \tau)$. Agent 1 knows $\tau = \text{optimist}$; Agent 2 knows $\tau = \text{pessimist}$.

  By expanding the state space to include the *origin of the doxastic differences* as fundamental uncertainty, **any** hierarchy of beliefs can be rationalized by a common prior. This is sometimes called the "Harsanyi Doctrine Extension." If you allow the modeler to treat the agents' prior dispositions as random variables drawn from a hyper-distribution, the CPA becomes universally satisfiable.

  Therefore, the "substantive work" identified by the objection is actually being done by an implicit assumption that the state space is **complete** or **exhaustive**. The lecturer's claim that "results like no-betting fail to apply" without CPA is true only if we refuse to expand the state space to account for the disagreement. If we allow expansion, the no-betting result still holds—it just applies to the larger space. The agents aren't betting on the rain; they are betting on their own prior-types, which they privately know.

  ### The Metaphysical Dressing

  This exposes the "metaphysical clothes" you suspected. Defenses of the CPA often rely on a "genetic" story: agents must have met at the beginning of time (Harsanyi's *ex ante* stage) and received draws from a common urn. If they didn't meet, they might have different priors.

  But this story is untestable. We never observe the *ex ante* stage. We only observe the *interim* beliefs. To say agents "really" have a common prior is to say that there *exists* some story about their past information flows that could generate their current beliefs from a shared distribution. Since we can always construct such a story by positing unobserved signals or expanding the state space (as shown above), the claim that they "really" have a common prior is equivalent to saying "I choose to model this using a state space large enough to support a common prior."

  Consequently, the CPA is not an empirical hypothesis about human psychology (do people actually share priors?). It is a methodological commitment to **ontological parsimony**. It is a rule that says: "Do not posit heterogeneous priors unless you absolutely have to (i.e., unless you are unwilling to expand the state space further)." When your lecturer says the assumption is "routine technical hygiene," he is correct that it simplifies the math. But when he implies it reflects a truth about rationality, he is conflating the map (the model with a fixed $\Omega$) with the territory (the agents' actual doxastic states).

  ### Conclusion

  The Common Prior Assumption is a bookkeeping convention because the boundary between "prior" and "information" is drawn by the modeler, not by the agents. While it is true that within a *fixed* formal structure the CPA imposes mathematical restrictions (like the impossibility of agreeing to disagree), the choice of that formal structure is itself conventional. By expanding the state space to internalize the sources of disagreement, any belief system can be reconciled with a common prior. Therefore, asking whether real agents "in fact" have common priors is a category error; the correct question is whether the modeler finds it more useful to locate the source of disagreement in the priors or in the information structure.

