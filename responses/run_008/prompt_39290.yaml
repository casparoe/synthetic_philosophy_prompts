answer: |-
  Periodisation practice inherently commits to a linear topology of time, allowing cyclical narratives only as local dynamics within a global vector, whereas a consistent cyclical ontology would replace chronological sequencing with morphological classification.

  The standard triad of Ancient, Medieval, and Modern is not merely a labeling convention but an ontological claim that history possesses a unique direction and不可逆 (irreversible) transitions. When we designate a year as a "breakpoint"—whether 476, 1492, or 1914—we assert that the post-breakpoint world is qualitatively distinct in a way that cannot be reduced to a previous state, which presupposes a linear accumulation of change or a teleological progression. The retention of the BCE/CE hinge, even in secular contexts, reinforces this vectorality; it treats time as a coordinate system with a unique origin and a forward arrow, meaning that "Modernity" is not just a phase but a *later* phase, imbued with the philosophical baggage of progress or escalation. Consequently, the practice of periodisation is not neutral; it structurally privileges linearity because it relies on the uniqueness of epochs to define them, whereas a cyclical view would treat epochs as repeatable tokens of a single type.

  The apparent coherence of mixing linear periodisation with cyclical narratives relies on a hierarchy of scale where cycles are subordinate dynamics operating within a linear container. Historians can consistently describe dynastic rise-and-fall cycles (the cyclical element) while maintaining that the broader civilizational trajectory moves from antiquity to modernity (the linear element) because they treat the cycles as empirical regularities rather than metaphysical necessities. This is logically permissible akin to describing oscillating weather patterns within a warming climate; the contradiction only arises if one adopts a strong cyclical ontology, such as Spengler's or the Stoic eternal return, where the "Modern" era is merely a recurrence of a previous archetypes and the linear vector is an illusion. In professional historiography, the linear ladder rules out strong circles only insofar as it denies exact recurrence, but it comfortably accommodates weak cycles as heuristic tools for explaining local stability and collapse without surrendering the overarching narrative of directional change.

  Rebuilding periodisation on a strictly cyclical view would transform textbooks from chronological narratives into morphological taxonomies organized by phase rather than date. Instead of chapters titled "The Nineteenth Century" or "The Cold War," a cyclical textbook would feature sections like "The Phase of Imperial Expansion" or "The Era of Internal Consolidation," grouping disparate civilizations together based on their structural age rather than their temporal simultaneity. Causality would shift from contingent events (the assassination of an archduke) to developmental necessities (the exhaustion of cultural forms), and comparison would become synchronous across civilizations—studying Rome and Han China not because they existed at the same time, but because they occupied the same stage in the civilizational life-cycle. This would dismantle the privileged breakpoints of standard periodisation, replacing the unique hinge of BCE/CE with a relative indexing system where years are measured as "Year 50 of the Expansion Phase," rendering history a study of recurring forms rather than a unique story of human progression.
