answer: |-
  # JOINT STATEMENT ON THE MORAL STATUS OF NONHUMAN ANIMALS

  **Preamble**
  We, the undersigned representatives of the Equal-Consideration Sentience Theory camp and the Status-Pluralist camp, conclude this period of adversarial collaboration by recording our convergences, clarifying our divergences, and identifying the empirical and conceptual cruxes that remain. This document does not resolve our theoretical dispute, but it narrows the scope of disagreement and establishes a shared baseline for future ethical and policy deliberation.

  ## I. Agreed Claims

  We jointly affirm the following substantive claims. Each signatory acknowledges that these claims constrain their respective positions more than they might have conceded prior to this collaboration.

  1.  **The Intrinsic Disvalue of Animal Suffering:** The suffering of nonhuman animals is intrinsically bad. It is not merely instrumentally disvaluable because it disturbs humans, degrades character, or violates property rights. Sentience grounds direct moral claims, regardless of the creature's taxonomic classification.
  2.  **The Insufficiency of Trivial Interests:** At least some practices common in contemporary industrial animal agriculture cannot be defended by appeal to human gustatory preference or minor economic convenience alone. Where severe animal suffering is inflicted, the justifying human interest must be substantial and non-frivolous.
  3.  **The Rejection of Bare Taxonomy:** Mere taxonomic classification (*Homo sapiens* vs. *Sus scrofa*), absent any correlation with capacity, relationship, or kind-based duty, is insufficient to justify the infliction of severe harm. Moral justification requires a link to morally relevant features, even if the camps disagree on what those features are.
  4.  **The Uncertainty Principle:** In cases of empirical uncertainty regarding sentience (e.g., invertebrates), decision-making should employ a precautionary principle. The probability of sentience, however difficult to quantify, should weigh against the certainty of harm inflicted by human action.
  5.  **The Scope of the Dispute:** The core disagreement is not *whether* nonhuman animals matter morally, but *how* their mattering is grounded (individual capacity vs. kind/relation) and *how* it compares in weight to the interests of typical adult humans.

  ## II. Disagreements Table

  The following table catalogs our residual disagreements. Each row describes a single point of contention twice: first in language the Sentience Theorist accepts as a fair characterization of the Pluralist view, and second in language the Pluralist accepts as a fair characterization of the Sentience Theorist view.

  | Topic | Description endorsed by Sentience Theorist (describing Pluralist view) | Description endorsed by Status Pluralist (describing Sentience Theorist view) | Classification |
  | :--- | :--- | :--- | :--- |
  | **The Ground of Status** | The Pluralist holds that membership in a biological or moral kind can confer higher status independently of an individual's current psychological capacities. | The Sentience Theorist holds that moral status is strictly a function of individual psychological attributes, rendering kind-membership morally inert except as a proxy for capacity. | Substantive |
  | **The Meaning of "Speciesism"** | "Speciesism" names a prejudice analogous to racism: the discounting of interests solely based on species membership, even when capacities are equivalent. | "Speciesism" is a question-begging pejorative that conflates arbitrary discrimination with permissible differential treatment based on kind-relative duties or community relations. | Verbal / Substantive Hybrid |
  | **The Structure of Obligations** | The Pluralist permits "tiered" obligations where the duties owed to persons are qualitatively different from, and lexically prior to, duties owed to mere sentients. | The Sentience Theorist maintains that obligations form a single continuum where differences in capacity adjust the *weight* of interests but never change the *kind* of consideration owed. | Substantive |
  | **The Marginal Cases** | The Pluralist argues that human infants and severely cognitively impaired individuals are protected by kind-based or relational duties, not by a fiction of their individual rational potential. | The Sentience Theorist argues that protecting humans with lower capacities than some animals, while sacrificing those animals, is inconsistent unless grounded in capacity alone. | Substantive |

  **Terminological Protocol:** regarding the term "Speciesism," we agree to disambiguate in future discourse. We will use **"Capacity-Speciesism"** to denote differential treatment unexplained by capacity differences (which both camps condemn). We will use **"Kind-Differentiation"** to denote differential treatment grounded in kind-based or relational accounts (which Pluralists defend and Sentience Theorists reject).

  ## III. Cruxes

  For the following four cruxes, we specify a line of inquiry or thought experiment and record each camp's prediction regarding the judgments of reflective agents. We agree that shifts in these judgments would necessitate a revision of our respective confidence levels.

  ### 1. The Argument from Marginal Cases
  *   **Inquiry:** Consider a scenario involving a severely cognitively impaired human infant and a cognitively sophisticated adult pig. Both possess equivalent capacities for suffering, self-awareness, and future-oriented preference.
  *   **Sentience Theorist Prediction:** Reflective agents will judge that sacrificing the pig to save the infant is permissible *only* if there are special relational duties (e.g., parenthood) involved. In an impartial choice (e.g., a trolley problem where neither is related to the agent), agents will judge the lives as having equal weight. If agents judge the human life as inherently more valuable despite equal capacity, they are exhibiting bias, not moral insight.
  *   **Status Pluralist Prediction:** Reflective agents will judge that the human infant holds a higher status even in impartial choices, grounded in the infant's membership in the human kind. This judgment will not be experienced as bias but as a recognition of a distinct form of value (human dignity) that attaches to the kind, protecting those who cannot protect themselves.

  ### 2. The Continuum Question
  *   **Inquiry:** Agents are presented with a series of hypothetical beings interpolating between a typical chimpanzee and a typical adult human (e.g., cognitively enhanced chimps, reconstructed hominins, extraterrestrial intellectual equals).
  *   **Sentience Theorist Prediction:** Moral judgments will track a smooth gradient. As cognitive and sentient capacities increase, the weight of the being's interests will increase proportionally. There will be no "moral cliff" where status jumps discontinuously.
  *   **Status Pluralist Prediction:** Moral judgments will reveal a threshold effect. While minor interests may scale gradually, there will be a distinct point (associated with moral agency or personhood) where the *type* of protection changes abruptly. Agents will hesitate to sacrifice a being on the "person" side of the threshold to save any number of beings on the "sentient" side.

  ### 3. The Empirical Distribution of Sentience
  *   **Inquiry:** We consider the evidence regarding decapod crustaceans and cephalopod molluscs (e.g., neuroanatomy, nociceptive behavior, motivational trade-offs, analgesia-seeking), similar to evidence reviewed for the UK Animal Welfare (Sentience) Act 2022.
  *   **Sentience Theorist Prediction:** If evidence confirms nociception integrated with trade-off behavior and analgesia-seeking, credence in sentience should approach certainty. Consequently, protection-relevant status should follow almost automatically. To deny protection despite this evidence is to deny the moral significance of sentience itself.
  *   **Status Pluralist Prediction:** Such evidence successfully establishes that these creatures are subjects of welfare (intrinsic badness of pain), warranting protection from gratuitous cruelty. However, this evidence does not elevate them to a status that overrides significant human interests or grants them rights associated with personhood. The *degree* of protection remains tied to the kind of subject they are, not merely the fact of their sentience.

  ### 4. Lexicality and Aggregation
  *   **Inquiry:** A choice must be made between saving one typical adult human from death or saving a very large number of nonhuman animals (e.g., one million pigs) from severe, prolonged suffering and death.
  *   **Sentience Theorist Prediction:** While agent-relative prerogatives may allow an individual to save the human, the *impartial* moral calculus should allow the aggregation of animal interests to outweigh the single human interest if the numbers are high enough and the suffering is severe enough. To deny this is to assert a mystical value gap.
  *   **Status Pluralist Prediction:** Reflective agents will judge the human life as lexically prior. No number of non-person animals can outweigh the major interest of a single person. This is not a calculation error but a recognition that persons belong to a moral community where rights function as trumps against utilitarian aggregation. The crux for us is whether this line can be drawn non-arbitrarily; we predict it can be drawn at the threshold of moral agency.

  ***

  **Signed,**

  *Representatives of the Equal-Consideration Sentience Theory Camp*

  *Representatives of the Status-Pluralist Camp*

  *Date:* [Conclusion of Collaboration]
