prompt: |-
  I fact-check claims for a mid-size newsroom, and lately most of our fights aren't about whether things are false but about statements that are technically true and feel like lies anyway. Like a politician saying crime doubled in the city on his opponent's watch when it doubled off a fifty-year low and is still lower than it was a decade ago. Half my desk says "it's literally true, we can't call it misleading," the other half wants to rate it misleading, and our rating system has no honest place for any of this. What I'd like is an actual procedure we can run, not vibes.

  I remember enough from college philosophy to know the relevant ideas live somewhere around Grice -- that we assume speakers are being as informative as needed, relevant, and not oddly worded, and that a speaker can exploit those assumptions to get an audience to believe something false without ever asserting it. That's exactly the politician's trick, right? He says the true thing, we do the math to get the false thing, and he never technically lied. But I don't know how to turn that into something two fact-checkers can apply in the twenty minutes we have before publication, and I don't want a procedure that's secretly just our politics.

  So please build me the procedure. It should say: what questions to ask, in what order; what counts as a sufficient answer at each step; where the procedure stops and hands off to the editor because the remaining question is a judgment call no checklist can make (I assume "would a normal audience take away the false thing" is one of those). It should tell us what to do when the misleading takeaway is true for part of the audience and not another part, and it should be honest about the misfire modes -- like when a statement is clumsy rather than sneaky, or when calling it "misleading" makes us the story.

  Then run it on three claims. One is the crime-doubling example above. Second: a governor announcing that her new program "has already served ten thousand families," where the program mainly rebranded services that already existed and the number includes everyone who walked past an information table. Third: a statement from a politician our editorial board endorsed, one where I have a feeling your procedure is going to come back with "misleading" and it will cost us -- I want to see whether the procedure actually binds us or quietly bends when it's our guy. And finish with what the procedure can't settle at all, so I know which arguments we're still going to have. Keep it practical -- my deadline is real.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Fact-checker for a mid-size newsroom.
      *   **Problem:** Dealing with "paltering" or "truthful but misleading" statements (Gricean implicature violations). Current rating system lacks nuance. Internal conflict between "technically true" vs. "feels like a lie."
      *   **Goal:** A concrete, step-by-step procedure (algorithm/checklist) to evaluate these claims within 20 minutes.
      *   **Requirements:**
          *   Based on Gricean maxims (informative, relevant, etc.).
          *   Define questions, order, sufficient answers.
          *   Identify hand-off points to editors (judgment calls).
          *   Address audience segmentation (some get it, some don't).
          *   Acknowledge failure modes (clumsiness vs. sneaky, becoming the story).
          *   Run the procedure on three specific claims (Crime doubling, Program rebranding, Endorsed politician).
          *   Admit limitations (what the procedure *can't* settle).
          *   Tone: Practical, deadline-aware, non-partisan.

  2.  **Deconstruct the Philosophical Basis (Grice):**
      *   Grice's Cooperative Principle has four maxims: Quantity (info needed), Quality (truth), Relation (relevance), Manner (clarity).
      *   The problem isn't Quality (it's true). It's usually Quantity (withholding context) or Relation (framing irrelevant stats as relevant).
      *   *Implicature:* What is suggested vs. what is said.
      *   *Procedure Goal:* Detect when the *implicature* is false, even if the *assertion* is true.

  3.  **Drafting the Procedure (The "Grice-Gut Check" Protocol):**
      *   *Constraint:* Must be doable in 20 mins.
      *   *Structure:* Triage -> Technical Verification -> Contextual Integrity -> Audience Takeaway -> Decision.
      *   *Step 1: Literal Truth (The Gate).* If false, stop. Rate False. If true, proceed.
      *   *Step 2: The Missing Counterfactual (Quantity).* What did they *not* say that changes the meaning? (e.g., base rates).
      *   *Step 3: Relevance & Causality (Relation).* Does the stat imply causation or responsibility that isn't there?
      *   *Step 4: The "Reasonable Reader" Test (Manner/Implicature).* What is the dominant takeaway?
      *   *Step 5: Intent vs. Negligence.* Is this a trick or a mess-up?
      *   *Decision Matrix:* True, True but Context Needed, Misleading, False.
      *   *Editor Hand-off:* When the "Reasonable Reader" test is split.

  4.  **Refining the Procedure for Practicality:**
      *   Need specific "Stop/Go" criteria.
      *   Need to address the "Our Guy" bias explicitly.
      *   Need to define "Misleading" clearly (distinct from "False").

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Crime):* Classic base-rate neglect. "Doubled" (True) vs. "High crime" (False implicature).
      *   *Case 2 (Program):* Rebranding + loose definition of "served." "10k families" (True count) vs. "New help provided" (False implicature).
      *   *Case 3 (Endorsed Politician):* Needs to be a plausible scenario where bias might creep in. Let's make it about a jobs bill. "Created 5,000 jobs" (True) but "Net loss in sector" or "Federal funding only." Let's go with "Secured $10M for schools" (True) but "Cut $15M from budget elsewhere."

  6.  **Addressing the "Bias/Our Guy" Constraint:**
      *   The procedure needs a "Blind Spot Check."
      *   Rule: If the claim is from an endorsed candidate, a *different* fact-checker must run the final "Reasonable Reader" test.
      *   Rule: Document the "Missing Context" explicitly. If you wouldn't print the missing context for the opponent, don't let it slide for your guy.

  7.  **Addressing Limitations/Failure Modes:**
      *   When does fact-checking become commentary?
      *   When the audience is polarized (one side hears truth, one hears lies).
      *   When the "lie" is a matter of future prediction or value judgment.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the Gricean insight. Validate the frustration.
      *   *The Protocol:* Name it something neutral. "The Implicature Integrity Protocol (IIP)."
      *   *Steps:*
          1.  Literal Verification (Pass/Fail).
          2.  The Omission Test (Grice's Quantity).
          3.  The Causal Frame (Grice's Relation).
          4.  The Headline Test (Audience Takeaway).
          5.  The Bias Brake (Internal Check).
      *   *Decision Tree:* Clear outcomes.
      *   *Editor Handoff:* Specific triggers.
      *   *Running the Cases:* Apply the steps rigorously.
      *   *Limitations:* Be honest about what remains subjective.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Emphasize that Step 1 is quick. Steps 2-4 are the meat. Step 5 is a mindset check.
      *   *Critique:* Is "Misleading" too vague?
      *   *Fix:* Define it as "The dominant inference a reasonable reader draws is factually incorrect."
      *   *Critique:* How to handle the "Our Guy" case without sounding preachy?
      *   *Fix:* Make it a procedural requirement (second pair of eyes), not a moral lecture.
      *   *Critique:* The user asked for "what counts as a sufficient answer."
      *   *Fix:* Add "Pass Criteria" to each step.

  10. **Final Polish:** Ensure tone is professional, empathetic to the newsroom pressure, and philosophically grounded but operationally focused. (Make sure to explicitly mention Grice as requested).

  **(Self-Correction on Case 3):** The prompt asks me to *create* the third claim where the procedure might say "misleading" and it will cost them. I need to invent a plausible claim for an endorsed politician that fits the pattern. Let's use a "Budget Surplus" claim. "We left a $5M surplus" (True) but "Deferred $10M in maintenance" (Hidden context).

  11. **Final Review against constraints:**
      *   Procedure? Yes.
      *   Questions/Order? Yes.
      *   Sufficient answers? Yes.
      *   Editor hand-off? Yes.
      *   Audience segmentation? Yes.
      *   Misfire modes? Yes.
      *   Three claims run? Yes.
      *   Limitations? Yes.
      *   Practical/Deadline? Yes.

