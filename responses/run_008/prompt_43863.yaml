answer: |-
  This is the central crisis of modern fact-checking: we are equipped to catch lies, but not *truths that function as lies*. You are correct that this is a Gricean problem. Specifically, it is a violation of the **Maxim of Quantity** (make your contribution as informative as required) and the **Maxim of Relation** (be relevant). When a speaker tells a narrow truth to invite a broad falsehood, they are generating a *false implicature*.

  You cannot solve this with vibes. You need a protocol that forces the implicature into the light. Below is the **Implicature Integrity Protocol (IIP)**. It is designed for a 20-minute turnaround. It does not eliminate judgment, but it isolates *where* the judgment happens so it can be audited.

  ---

  ### The Implicature Integrity Protocol (IIP)

  **Time Budget:** 20 Minutes
  **Goal:** Distinguish between *Clumsy Truth*, *Strategic Omission*, and *False Implicature*.

  #### Step 1: The Literal Gate (Minutes 0–3)
  **Question:** Is the explicit assertion factually verifiable and accurate?
  *   **Action:** Verify the numbers, quotes, or events stated *exactly as written*.
  *   **Pass Criteria:** The statement is technically true.
  *   **Fail Criteria:** The statement is false. **STOP.** Rate "False."
  *   **Note:** If you have to add words to make it true (e.g., "He said X, but he meant Y"), you fail this step. Rate "False."

  #### Step 2: The Omission Test (Grice's Quantity) (Minutes 3–8)
  **Question:** What is the *minimum* context required to make this statement meaningful to a layperson, and is it missing?
  *   **Action:** Identify the "Base Rate" or "Counterfactual."
      *   *For stats:* What is the historical average? What is the comparison group?
      *   *For achievements:* What would have happened without this action?
  *   **Sufficient Answer:** You must be able to write one sentence of context that, if added to the claim, significantly alters its emotional weight.
  *   **Trigger:** If that sentence exists and was withheld by the speaker, mark **"Context Withheld."**

  #### Step 3: The Causal Frame (Grice's Relation) (Minutes 8–12)
  **Question:** Does the phrasing imply causality or responsibility that the data does not support?
  *   **Action:** Check for "Post Hoc" framing.
      *   *Example:* "Crime rose under Opponent." (Implies Opponent caused it).
      *   *Example:* "Program served 10k families." (Implies Program *helped* 10k families).
  *   **Sufficient Answer:** Can you draw a direct line between the actor's action and the outcome? If the link is correlational or definitional only, mark **"Causal Stretch."**

  #### Step 4: The Headline Test (Audience Takeaway) (Minutes 12–16)
  **Question:** If this claim were the *only* thing a reader learned today, what would they believe?
  *   **Action:** Write the likely headline or social media share text a reader would generate from this claim.
  *   **Sufficient Answer:** Compare the Reader's Belief to Reality.
      *   *Reader Belief:* "Crime is out of control."
      *   *Reality:* "Crime is low, but ticking up."
  *   **Decision Point:** If the Reader's Belief is factually incorrect, you have a **False Implicature.**

  #### Step 5: The Bias Brake (Internal Audit) (Minutes 16–18)
  **Question:** Would we apply Steps 2 and 3 this rigorly if this claim were made by the opposing side?
  *   **Action:** If the claim comes from an endorsed candidate, a favored source, or an advertiser, a **second fact-checker** must sign off on Step 4.
  *   **Rule:** If the second checker disagrees on the "Reader's Belief," the claim escalates to the Editor.

  #### Step 6: The Rating & Hand-Off (Minutes 18–20)
  **Decision Matrix:**
  1.  **True:** Literal truth + No context withheld + No causal stretch.
  2.  **True but Incomplete:** Literal truth + Context withheld + Implicature is neutral/ambiguous. (Add "Context Note" in article).
  3.  **Misleading:** Literal truth + False Implicature (Step 4 failed).
  4.  **Editor Escalation:** Step 4 is disputed, or the "Misleading" rating creates significant institutional risk (e.g., endorsed candidate).

  **Editor Hand-Off Criteria:**
  *   The "Reader's Belief" is split along demographic or partisan lines (e.g., experts see the nuance, the public sees the lie).
  *   Rating it "Misleading" will become the story itself (meta-coverage).
  *   Step 5 (Bias Brake) triggers a disagreement between checkers.

  ---

  ### Failure Modes (Where the IIP Breaks)
  Be honest with your desk about these. The IIP cannot settle:
  1.  **The Competence vs. Malice Trap:** The IIP identifies *that* a statement is misleading, not *why*. A politician may be incompetent, not deceptive. The rating is "Misleading" either way, but the tone of your explanation must not assume intent.
  2.  **The Polarized Audience:** If 50% of the audience takes away the false implicature and 50% take away the nuance, the "Reasonable Reader" is a myth. In this case, the rating must be "True but Disputed" and the article must explain the split interpretation.
  3.  **The "Becoming the Story" Risk:** If rating a claim "Misleading" distracts from the news cycle (e.g., "Fact-checkers attack popular measure"), the Editor must decide if the truth-telling is worth the loss of signal. The IIP flags this risk; it does not solve it.

  ---

  ### Running the Protocol: Three Test Cases

  #### Case 1: The Crime Stat (Opponent)
  *Claim:* "Crime has doubled in this city on my opponent's watch."
  *   **Step 1 (Literal):** Verified. Incidents went from 100 to 200. **PASS.**
  *   **Step 2 (Omission):** Base rate was a 50-year low. 200 is still lower than the 10-year average of 300. Context: "Doubled from historic low, still below average." **CONTEXT WITHHELD.**
  *   **Step 3 (Causal):** "On watch" implies responsibility. Crime trends often lag policy by years. **CAUSAL STRETCH.**
  *   **Step 4 (Headline Test):** Reader Belief: "The city is dangerously unsafe now." Reality: "The city is safer than usual, with a recent uptick." **FALSE IMPLICATURE.**
  *   **Step 5 (Bias):** Opponent claim. No bias brake needed.
  *   **Result:** **MISLEADING.**
  *   *Explanation:* "While technically accurate, the percentage increase omits the historic baseline, creating the false impression that crime rates are high rather than recovering from a low."

  #### Case 2: The Program Rebrand (Governor)
  *Claim:* "My new initiative has already served ten thousand families."
  *   **Step 1 (Literal):** Verified. 10,000 records exist in the database. **PASS.**
  *   **Step 2 (Omission):** 8,000 were existing cases transferred from old programs. 1,500 were "served" by receiving a pamphlet at a town hall. Only 500 received new aid. Context: "Mostly existing cases + informational contact." **CONTEXT WITHHELD.**
  *   **Step 3 (Causal):** "My new initiative... served." Implies the new program *caused* the service. In reality, the bureaucracy caused it; the program just renamed the letterhead. **CAUSAL STRETCH.**
  *   **Step 4 (Headline Test):** Reader Belief: "10,000 families got new help they wouldn't have otherwise." Reality: "10,000 families touched by bureaucracy, 500 got new help." **FALSE IMPLICATURE.**
  *   **Step 5 (Bias):** Governor is from the user's paper's preferred party? (Assume neutral for this test).
  *   **Result:** **MISLEADING.**
  *   *Explanation:* "The figure counts administrative contacts and existing cases as new successes, inflating the program's actual impact."

  #### Case 3: The Endorsed Candidate (The Stress Test)
  *Claim:* "I secured $10 million in new funding for our local schools." (Candidate your editorial board endorsed).
  *   **Step 1 (Literal):** Verified. A line item of $10M exists in the budget they voted on. **PASS.**
  *   **Step 2 (Omission):** To pass the budget, they also voted to cut $15M from the capital maintenance fund, which schools rely on. Net change is -$5M. Context: "Funding increased, but overall budget allocation to district decreased." **CONTEXT WITHHELD.**
  *   **Step 3 (Causal):** "I secured." Implies personal agency. The funding was federal pass-through mandated by law; their vote was procedural. **CAUSAL STRETCH.**
  *   **Step 4 (Headline Test):** Reader Belief: "Schools have more money because of this politician." Reality: "Schools have less total resources; one bucket was filled by draining another." **FALSE IMPLICATURE.**
  *   **Step 5 (Bias Brake):** **TRIGGERED.** This is your endorsed guy.
      *   *Action:* Second fact-checker reviews Step 4.
      *   *Second Checker:* "Agreed. A parent reading this thinks the schools are richer. They are poorer."
  *   **Result:** **MISLEADING.**
  *   *Institutional Cost:* High. The campaign will accuse you of betrayal.
  *   *Procedure Check:* The IIP held. Because Step 2 and 4 were documented *before* the rating was assigned, the Editor can see the logic isn't political. It's structural.
  *   *Mitigation:* Publish the "Misleading" rating, but pair it with an explainer on the budget mechanics so the audience sees *why* the claim rings false, rather than just taking your word for it.

  ---

  ### What The Procedure Cannot Settle

  You asked for honesty about the limits. The IIP will not stop the following arguments:

  1.  **The "Reasonable Reader" Definition:** You will still fight about who the "reasonable reader" is. Is it a busy mom? A policy wonk? If your newsroom is elite-focused, you will under-rate misleading claims that fool average people. If you are populist, you may over-rate them. *Fix:* Define your "Reasonable Reader" in your style guide (e.g., "A high-school educated resident of the coverage area").
  2.  **The Significance Threshold:** How much context is enough? In Case 3, if the cut was $100k instead of $15M, is it still misleading? The IIP flags the omission, but the *Editor* must decide if the omission is material enough to warrant a "Misleading" tag vs. a "Context Note."
  3.  **The "Everyone Does It" Defense:** When you publish the "Misleading" rating on your endorsed candidate, the opposition will not thank you; they will say you are holding your guy to a higher standard, or that you are admitting your endorsement was flawed. The IIP protects your *process*, not your *reputation*.

  **Final Advice:**
  The value of this procedure is not that it produces perfect ratings. It is that it produces **auditable ratings**. When the politician screams bias, you don't show them your feelings. You show them Step 2 and Step 4. You show them the "Bias Brake" signature. You make the internal conflict external and transparent. That is the only way to survive the "technically true" wars.
