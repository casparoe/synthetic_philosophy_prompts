answer: |-
  Here is a lesson plan designed for a 40-minute session with fourth-year engineering students. It prioritizes conceptual clarity over historical survey and leverages their systems-thinking background while challenging its metaphysical limits.

  ### 1. Order of Ideas and Dependencies
  **Goal:** Establish the Special Composition Question (SCQ) as a substantive ontological issue, not a linguistic or existence claim.

  *   **Minute 0–5: The "Inventory of the Universe" Thought Experiment.**
      *   **Action:** Ask students to imagine a complete physical description of the universe at a single instant $t$ (positions, momenta, fields of every particle).
      *   **Dependency:** This establishes a baseline of "physical facts."
      *   **Move:** Ask: "Does this list include 'one bridge' or just 'arranged particles'?"
      *   **Crucial Distinction:** Explicitly state: "We are not asking if bridges exist (obviously they do, we drive on them). We are not asking when English speakers are permitted to use the word 'bridge' (that's lexicography). We are asking: **In virtue of what physical facts does the universe count as containing *one* object here rather than *many*?**"
      *   **Why:** This heads off the "verbal dispute" objection immediately. If it were just language, the physical facts wouldn't matter. If it were just existence, nihilism would be the only alternative.

  *   **Minute 5–10: Introducing the Carrying Example (The "Yes" and "No").**
      *   **Action:** Present the clear cases of your anchor example (see Section 2).
      *   **Dependency:** Students must agree on the intuitions here before you complicate them.
      *   **Move:** Secure consensus that in Case A, composition occurs, and in Case B, it does not.
      *   **Why:** You need a shared phenomenological baseline before introducing the metaphysical tension.

  *   **Minute 10–25: The "Middle Case" and the Engineering Reflex.**
      *   **Action:** Present the ambiguous middle case.
      *   **Dependency:** Relies on the distinction established in Minute 0–5.
      *   **Move:** Elicit their engineering intuition (likely functional or systemic). Then, press them: "If function defines composition, does a broken engine cease to be an object?"
      *   **Why:** This forces them to separate *utility* (engineering) from *ontology* (philosophy).

  *   **Minute 25–35: Candidate Answers & Misconception Management.**
      *   **Action:** Briefly sketch 2–3 answers (e.g., Contact, Function, Brutalism) while intercepting misconceptions (see Section 3).
      *   **Dependency:** Requires the "Middle Case" tension to be felt.
      *   **Why:** To show that every simple answer has a counter-intuitive cost.

  *   **Minute 35–40: Diagnostic Question & Scope Setting.**
      *   **Action:** Pose the diagnostic question and explicitly state exclusions.
      *   **Dependency:** Requires them to have grasped the *nature* of the question, not just the examples.
      *   **Why:** To consolidate learning and manage expectations for future study.

  ---

  ### 2. The Carrying Example & The Ship of Theseus Warning
  **The Anchor:** **The Modular Bailey Bridge.**
  *   **Clear Yes (Composition):** A panel **welded** to a stringer. (Intuition: The metal grains fuse; separation requires destruction. Clearly one object.)
  *   **Clear No (No Composition):** A bridge panel and a **bird** landing on it. (Intuition: Mere spatial proximity. Clearly two objects.)
  *   **The Middle Case (Engineering Intuition Fails):** A panel **pinned** into the truss (standard Bailey Bridge assembly).
      *   *Why it works:* It is held by friction and gravity via pins. It is removable without damage (unlike welding). It functions structurally as part of the bridge (unlike the bird).
      *   *The Tension:* Is the pin-connected panel *part of the object* "Bridge," or is it a distinct object *interacting* with the bridge? If you remove the pin, does the bridge cease to exist, or just lose a part? If composition depends on removability, where is the threshold? (Glue? Bolts? Pins? Gravity?)

  **Why NOT The Ship of Theseus?**
  *   **The Reason:** The Ship of Theseus is a question of **Diachronic Identity** (persistence through *time*). The Special Composition Question is **Synchronic Composition** (constitution at a *time*).
  *   **The Trap:** If you use the Ship, students will debate "when does it become a *new* ship?" This distracts from the core issue: "At this exact snapshot in time, do these planks compose *one* ship or *many* planks?"
  *   **Instruction:** If a student raises it, acknowledge its relevance to identity but firmly bracket it: "That asks how long an object lasts. We are asking what counts as an object *right now*."

  ---

  ### 3. Predictable Misconceptions & Intervention Points
  *   **Misconception 1: Composition = Physical Contact/Attachment.**
      *   *Prediction:* "If they touch/bond, they are one thing."
      *   *Intervention Point:* **Minute 10 (Clear No).** Use the "Bird on Bridge" example. The bird touches the bridge. If contact suffices, the Bird-Bridge is one object.
      *   *Correction:* Contact is necessary but not sufficient.

  *   **Misconception 2: Composition = Spatial Containment.**
      *   *Prediction:* "If they are within a boundary, they are one thing."
      *   *Intervention Point:* **Minute 15 (Middle Case).** Ask about the cargo inside a shipping container. The cargo is contained. Is "Cargo-Ship" one object?
      *   *Correction:* Boundaries are often pragmatic, not ontological.

  *   **Misconception 3: Composition = Functional Integration (The "System" Reflex).**
      *   *Prediction:* "If it works as a unit, it's an object." (Most dangerous for engineers).
      *   *Intervention Point:* **Minute 20 (The Broken Machine).** Ask: "If the pinned panel snaps, does the *object* disappear?" If composition is functional, a broken machine is no longer an object, just a pile of parts. This contradicts the intuition that the parts still compose *something* (a broken machine).
      *   *Correction:* Function explains *why we build* things, not *that they exist*.

  *   **Misconception 4: Restrictive Answers = "Tables are Illusions."**
      *   *Prediction:* Hearing Van Inwagen's view (only living things compose objects) as denying the existence of tables.
      *   *Intervention Point:* **Minute 30 (Candidate Answers).**
      *   *Correction:* Clarify the distinction between **Ontological Commitment** and **Sensory Illusion**. "To say tables don't *fundamentally* exist is not to say you walk through them. It is to say that in the final inventory of the universe, 'table' is a shorthand for 'particles arranged table-wise,' not a fundamental entry."

  ---

  ### 4. The Diagnostic Question
  **Do not ask:** "What is the correct answer to the SCQ?" (They haven't learned enough).
  **Do not ask:** "Do tables exist?" (Too easy/ambiguous).

  **Ask this:**
  > "If we agree on every physical fact about the pinned bridge panel (forces, atomic bonds, spatial location), is there any **further fact** about whether it composes an object with the truss? If yes, what kind of fact is it? If no, is the answer to the SCQ just a human convention?"

  *   **Why:** This reveals if they understand that the SCQ asks whether ontology *supervenes* on physics.
      *   *If they say "Yes, further fact":* They grasp robust realism (but need to explain what that fact is).
      *   *If they say "No, just convention":* They grasp conceptualism (but need to defend against the "verbal dispute" charge).
      *   *If they say "It depends on use":* They have retreated to engineering utility, missing the metaphysical point.

  ---

  ### 5. What to Explicitly Decline (and Why)
  You must verbally bracket two topics at the start or end. Do not simply omit them; announce the omission.

  1.  **Formal Mereology (The Calculus of Parts/Wholes).**
      *   *What to say:* "We will not be using the formal logic of mereology (sums, fusion operators) today."
      *   *Why:* It creates a false sense of precision. Engineering students respect formalism; if you introduce symbols without time to master them, they will focus on the math and miss the metaphysics. It suggests the problem is solved by calculation rather than conceptual analysis.

  2.  **Composition as Identity (CAI).**
      *   *What to say:* "We will not discuss the view that the whole is literally identical to its parts."
      *   *Why:* CAI effectively dissolves the SCQ by making composition trivial (the parts *are* the whole). Introducing it in 40 minutes creates confusion between "identity" (numerical sameness) and "constitution" (making up). It undermines the effort to distinguish the "one" from the "many," which is the core learning objective.

  **Why state this explicitly?**
  Engineering students are trained to look for the "complete model." If you don't tell them what is missing from the model, they will assume the omission is an oversight or that the excluded topics are the "real" answer they should be researching. Explicitly scoping the lesson validates their desire for rigor while protecting the conceptual focus.
