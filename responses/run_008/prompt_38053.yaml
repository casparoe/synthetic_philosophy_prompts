  Your friend is operating with a sophisticated, dual-layered definition of "collapse" that attempts to reconcile structural failure with human resilience. She is clearly trying to navigate between the traditional "catastrophe" model (which she dislikes) and the "complexity loss" model (which she accepts). Based on her six prior verdicts, we can reconstruct two competing rules that govern her judgments.

  Here is the breakdown of her likely reasoning, the tensions within it, and how it applies to your two dinner cases.

  ### Rule 1: The "Institutional Signature" Test
  **Definition:** A society collapses when its defining high-complexity institutions (palatial bureaucracy, imperial office, monumental religious cult, script) cease to function in their established form without a direct successor claiming their legitimacy. The survival of the general population or "folk culture" is secondary to the death of the *state* or *elite project*.

  *   **Consistency:** This rule cleanly explains **Late Bronze Age** (palaces/script vanished), **Western Rome** (imperial office extinguished in the West), **Rapa Nui** (the statue-building chiefdom ended), and **Cahokia** (the paramount chiefdom and mound-centering project ended). It also explains why **Angkor** and **Maya** are *not* collapses: the Khmer court and Maya dynasties relocated but maintained institutional continuity.
  *   **Where it Strains:**
      *   **Cahokia:** This rule demands the "Collapse" verdict she gave, but it explains her **visible irritation**. She knows the Mississippian *people* and *culture* continued, but the *Cahokian Institution* died. Her irritation comes from suppressing the human continuity to satisfy the structural definition.
      *   **Rapa Nui:** This rule fits her verdict, but it strains against modern archaeology (which suggests adaptation rather than termination of the cult). By calling it collapse, she is prioritizing the end of the *monumental signature* over the continuity of the *islanders*, which edges close to the catastrophe narratives she claims to dislike.
      *   **Western Rome:** It fits, but only if one ignores the survival of Roman law and the Church in the West. She must be defining "Rome" strictly as the Imperial Office.

  **Prediction for your cases:**
  *   **Norse Greenland:** **Collapse.** The Norse Bishopric, the connection to the Papacy, and the specific European-style stone-building tradition ended completely. There was no successor institution.
  *   **Harappan Civilization:** **Collapse.** The urban state, the standardized script, and the long-distance trade bureaucracy vanished. Even if people stayed, the "Harappan Signature" (the urban civilization itself) died.

  ### Rule 2: The "Demographic & Regional Integrity" Test
  **Definition:** A society collapses only if the core population is drastically reduced (death or flight) or the core geographic region is abandoned and culturally hollowed out. If the people remain in the region and maintain a continuous cultural identity, even without cities or kings, it is "transformation" or "reorganization."

  *   **Consistency:** This rule explains **Maya** (people and identity persisted in the lowlands/highlands) and **Angkor** (Khmer population remained). It aligns with her hostility to catastrophe narratives.
  *   **Where it Strains:**
      *   **Cahokia:** This rule predicts **Not Collapse**, yet she ruled **Collapse**. This is the rule's biggest failure in her track record. She overruled it, likely because the *American Bottom* itself was largely depopulated, not just the city.
      *   **Rapa Nui:** This rule predicts **Not Collapse** (the island was not depopulated; the people are still there). Her "Collapse" verdict contradicts this unless she accepts the older "ecocide" theory that the population crashed numerically.
      *   **Western Rome:** This rule is shaky here. The population of Italy did not vanish, but she still rules "Collapse." She likely makes an exception here because the *political* vacuum was filled by "barbarian" kingdoms, breaking the regional political integrity.

  **Prediction for your cases:**
  *   **Norse Greenland:** **Collapse.** The region was totally abandoned. The population did not stay and adapt; they left or died. This satisfies the "Regional Integrity" failure.
  *   **Harappan Civilization:** **Not Collapse (Transformation).** The population did not crash; they de-urbanized and dispersed across the Indus valley. Cultural continuity (pottery styles, burial rites) is archaeologically visible. This fits the "Maya" precedent better than the "Cahokia" one.

  ---

  ### My Best Guess on Her Verdicts

  **1. Norse Greenland: Collapse**
  *   **Why:** This is the one case where both Rule 1 and Rule 2 agree. The institutions died (Rule 1), *and* the region was emptied (Rule 2). Unlike Cahokia, there is no "Mississippian world" next door to claim the Norse mantle. Unlike Rapa Nui, the people did not stay. It is the cleanest "Collapse" on your list, and she will likely use it to anchor her definition before tackling the messier Harappan case.

  **2. Harappan Civilization: Not Collapse (Reorganization/Transformation)**
  *   **Why:** This is where her **Cahokia irritation** becomes the deciding factor. With Cahokia, she felt forced to say "Collapse" because the specific site was abandoned, even though she knew the people survived. With the Harappan case, the evidence for *regional* continuity is much stronger and more mainstream in current archaeology than it was for Cahokia when she formed her opinion.
  *   She hates catastrophe narratives. The "Aryan Invasion" (catastrophe) model of Harappa is dead; the "De-urbanization" (transformation) model is alive. If she calls Harappa a collapse, she undermines her Maya verdict (where cities were also abandoned). To remain consistent with her **Maya** and **Angkor** rulings—and to assuage the guilt she showed over **Cahokia**—she will likely classify Harappa as a successful adaptation to climate change rather than a collapse.

  ---

  ### The Tie-Breaker Case: Tiwanaku (Bolivia/Peru, c. 1000 CE)

  If you want to force her to reveal which rule is actually dominant, raise the **end of the Tiwanaku state**.

  *   **The Context:** Tiwanaku was a massive monumental center and state that exerted influence across the Andes. Around 1000 CE, the monumental center was abandoned, the state bureaucracy dissolved, and the "signature" iconography vanished from public use. However, the population did not vanish; they dispersed into regional Aymara kingdoms, and many cultural practices continued.
  *   **The Conflict:**
      *   **If she says Collapse:** She is prioritizing **Rule 1 (Institutional Signature)**. She values the end of the state/monuments over the survival of the people. This confirms her Cahokia and Rapa Nui verdicts are her "true" standard, and her Maya/Angkor verdicts are exceptions for *literacy/dynasties*.
      *   **If she says Not Collapse:** She is prioritizing **Rule 2 (Demographic Integrity)**. She values the survival of the population and regional culture over the state. This confirms her Cahokia verdict was an anomaly (perhaps due to lack of written records at the time) and that she is truly committed to an anti-catastrophe framework.

  **Why this works:** Tiwanaku is the perfect hybrid. It has the total site abandonment of Cahokia (pushing toward Collapse) but the clear regional cultural continuity of the Post-Classic Andes (pushing toward Reorganization). Her answer will tell you whether she defines civilization by its **monuments** or its **people**.
