prompt: |-
  i'm putting together a "where i stand" doc for my epistemology reading group — we spent the semester on the lottery and preface paradoxes and now everyone has to circulate their positions so the rest of the group can poke at them. before i send mine around i want to make sure it's not quietly incoherent. here's the list:

  (1) knowledge doesn't just reduce to credence — you can be 99.99% confident your lottery ticket lost and still fail to know it lost, because knowledge has some kind of anti-luck requirement

  (2) knowledge is closed under known entailment, full stop. i have yet to meet a purported counterexample to closure that i actually liked

  (3) the preface author knows each individual claim in their book — they triple-checked every one, more carefully than we check most things we claim to know

  (4) the preface author is being perfectly rational when they believe at least one claim in the book is false (base rates on books that size being flawless are basically zero)

  (5) rational belief is closed under competent deduction: if you rationally believe p, and you competently deduce q from p, you're fine believing q

  my gut says these mostly fit together but i've stared at them too long to tell anymore. which pairs are genuinely in tension, which only look like they are, and what's the cheapest fix? rank the tensions by severity instead of giving me a flat list, and for each one be concrete about what would have to give. one thing i'd especially like you to check: whether any of the clashes only show up in the book case but vanish everywhere else, cause that seems like it should matter for how much i care about them
