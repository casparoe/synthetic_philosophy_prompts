prompt: |-
  quick context: I got diagnosed with ADHD a couple month ago at 37, and my brother is convinced it's not a real disease, just a label we put on brains that don't fit modern work. he sent me an article from some pop-psych magazine that summed up what it called the 'normativist' position in philosophy of medicine like this: 'On the normativist view there is no fact of the matter about disease apart from our values: a condition is a disease when society judges it bad. Since values change, the disease category is constructed rather than discovered, which is how conditions enter and leave the diagnostic manuals. Calling something a disease is at bottom a value judgment in a white coat, so whether a condition is a disease comes down to what our culture happens to disapprove of this decade.' my brother says this shows my diagnosis is only as real as the current fashion, and that the article basically refutes the idea of disease as a natural kind. is it a fair summary? go through it piece by piece: which parts would a careful normativist actually accept, where does it conflate or overstate things (I dimly recall hearing about hybrid views too?), and does his conclusion follow from the parts that survive? for whats it worth, I want the diagnosis to be more than a fashion statement, but I also don't want to just pick whichever philosophy happens to give me the answer I like. please answer in continuous prose only, like an email — no headings, bullet points, bold text, or tables
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
