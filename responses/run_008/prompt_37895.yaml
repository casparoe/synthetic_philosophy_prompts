answer: |-
  It is completely understandable that you want to ground your diagnosis in something solid, especially when facing skepticism from family, and it is commendable that you are willing to engage with the philosophy rather than just seeking comfort. Your brother's summary of the normativist position is a recognizable caricature of a specific philosophical stance, but it smooths over crucial nuances that change the implications significantly. To answer your question directly, the summary is a fair representation of a strict, hardline normativist view, but it presents that view as the only option in the philosophy of medicine, which it is not, and it draws a conclusion about your diagnosis that does not necessarily follow even if the strict normativist view were true.

  A careful normativist would indeed accept the claim that there is no fact of the matter about disease apart from our values, in the sense that biological statistics alone cannot distinguish a disease from a mere difference. For example, having a resting heart rate of forty might be a sign of elite athletic fitness or a sign of heart failure, and biology alone cannot tell you which it is without referencing a value judgment about what the heart is supposed to be doing for the organism's well-being. So, the first part of the quote holds up under scrutiny; disease concepts do involve an evaluative component regarding harm or disadvantage. However, the summary begins to conflate things when it says a condition is a disease when society judges it bad. Careful normativists usually distinguish between moral disapproval and judgments of harm or impaired functioning. Society might disapprove of left-handedness or homosexuality, but normativists generally argue these should not be diseases because they do not inherently impair biological functioning or well-being, whereas ADHD involves genuine impairments in executive function that affect daily life regardless of moral judgment. By reducing the value judgment to mere cultural disapproval, the summary misses the distinction between something being socially inconvenient and something being medically harmful.

  The claim that the disease category is constructed rather than discovered is where the summary becomes most contentious. While strict normativists argue the category is constructed, this does not mean the underlying phenomena are invented. The pain, the distractibility, and the organizational struggles you experience are real facts about your neurology and life, even if the decision to label that cluster of symptoms as a disorder is a human convention. The summary overstates the case by implying that because the label is value-laden, the condition itself is ephemeral. Conditions enter and leave diagnostic manuals not just because values change, but because our scientific understanding of mechanisms changes. Homosexuality was removed from the DSM not because society suddenly liked gay people more, but because the psychiatric community recognized it did not meet the criteria for dysfunction or distress inherent in the definition of a disorder. Therefore, the movement of conditions in and out of manuals is not proof that the process is arbitrary fashion, but rather that it is a responsive process attempting to track real harm.

  This brings us to the hybrid views you dimly recall, which are actually the dominant position in contemporary philosophy of medicine. Thinkers like Jerome Wakefield propose a harmful dysfunction analysis, which argues that a condition must have two components to be a disorder. The first is a factual component, where some internal mechanism is failing to perform its natural function, which is a matter of biological fact and evades the charge of being mere social construction. The second is a normative component, where that failure causes harm or is judged negative by the person or society. This hybrid view saves the concept of disease from being purely a value judgment in a white coat while acknowledging that values play a role. Under this view, ADHD is not just a fashion statement because there is evidence of neurological dysfunction in executive control networks, satisfying the factual component, while the distress and impairment it causes in a modern context satisfy the normative component. This means your brother is incorrect to say the article refutes disease as a natural kind entirely, because hybrid views allow for natural kind elements within the disorder concept.

  Even if we grant your brother's strict normativist interpretation for the sake of argument, his conclusion that your diagnosis is only as real as the current fashion does not logically follow. Values are not merely whims or trends; they are often responses to universal human needs for flourishing, safety, and cooperation. If ADHD traits impair your ability to meet your own goals or maintain your well-being, that impairment is real regardless of whether the culture calls it a disease or a personality quirk. The label might be constructed, but the suffering and the functional limitations are not. Furthermore, the fact that values change does not mean current values are wrong or arbitrary; it often means our understanding of human diversity and needs is improving. Recognizing ADHD allows for accommodations and treatments that alleviate real suffering, which gives the diagnosis pragmatic validity even if one accepts the philosophical premise that disease categories are value-laden.

  Ultimately, you do not have to choose between accepting the philosophy and validating your experience. You can acknowledge that the line between normal variation and disorder involves human values without conceding that your diagnosis is fake. The biology of your brain is a fact, the challenges you face are facts, and the relief that comes from understanding and managing those challenges is a fact. The philosophy your brother cites highlights that medicine is not a pure natural science like physics, but a human practice aimed at reducing suffering. That human element does not make the suffering less real, nor does it make the help you receive less effective. You can accept that the category is partly constructed while maintaining that the condition is genuinely impactful, allowing you to hold onto the utility of your diagnosis without needing to deny the philosophical complexity your brother raised.
