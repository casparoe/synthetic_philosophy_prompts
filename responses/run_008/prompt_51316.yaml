prompt: |-
  I work as a policy analyst on the content-integrity team of a mid-sized online platform, and I am tasked with drafting the protocol our moderators will use when they encounter posts advancing conspiracy claims. The volume is high — several hundred escalations a week, each needing a disposition within 24 hours — and the stakes are asymmetric: an erroneous "harmful conspiracy theory" label suppresses legitimate criticism of institutions, while an erroneous pass amplifies claims that can cause real-world harm. Our moderators are trained on content policy but have no background in epistemology, so the protocol must be usable by someone reading it for the first time in the middle of a shift.

  What I do not want is the familiar editorial reflex of treating "conspiracy theory" as a synonym for "false." The philosophical literature has convinced me that this collapses several distinct things: a conspiracy as an event (corporations and governments demonstrably do conspire, sometimes), a conspiracy theory as an explanatory hypothesis, and the sociological phenomenon of self-sealing communities that treat all counterevidence as confirmation. I want the protocol built on the distinctions that actually do epistemic work — among them, the scale-to-evidence ratio (a theory positing a handful of self-interested actors with a motive requires less independent corroboration than one positing thousands of tightly disciplined participants across decades), the self-sealing test (does the theory explain away its own counterevidence more fluently than it explains anything else?), and the provenance test (is the poster reasoning from public evidence, however badly, or from a framework in which official denial itself is evidence of guilt?).

  Please write the protocol as an ordered decision procedure: the tests to run, in sequence; what counts as a pass or fail on each; where the procedure stops with a definite disposition (label, downrank, escalate to our harm review, or leave alone); and — this is essential — where it explicitly hands the decision to a human judgment call because the remaining question is one of values, institutional trust, or downstream harm rather than anything the epistemology can settle. Be honest about the asymmetry I mentioned: the procedure should tell moderators when they do not know enough to say a claim is false, even when it smells like one.

  Then run the protocol on three worked cases: (a) a post alleging that a specific pharmaceutical company suppressed internal data about a side effect of one of its drugs, citing a real settlement and court records but extrapolating to a cover-up the records do not show; (b) a post claiming a recent outbreak originated in a research facility, arguing from publicly reported safety lapses, where official bodies are genuinely uncertain and the post does not treat their uncertainty as proof of guilt; and (c) a post claiming that a global network of elites fabricates all elections, in which the moderation team's preferred outcome is an unambiguous "false information" label but where I suspect the honest epistemic assessment will not support it in that form. For case (c) in particular, tell me plainly what the protocol yields, what it refuses to yield, and where the authority to remove or label must come from instead. Finally, include a short section on the ways this protocol predictably misfires — the kinds of true-but-marginal claims it will slow down, and the kinds of false-but-official-sounding claims it will wave through — so that I can put those limitations in the documentation I submit with it.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Role:** Policy Analyst on a Content-Integrity Team.
      *   **Task:** Draft a moderation protocol for conspiracy claims.
      *   **Constraints:** High volume (hundreds/week, 24h turnaround), asymmetric stakes (false positive = censorship, false negative = real-world harm), non-expert moderators (no epistemology background).
      *   **Core Philosophy:** Avoid equating "conspiracy theory" with "false." Distinguish between *conspiracy events* (real), *hypotheses* (plausible/unplausible), and *self-sealing belief systems*.
      *   **Key Epistemic Tests:** Scale-to-evidence ratio, Self-sealing test, Provenance test.
      *   **Format:** Ordered decision procedure (step-by-step), clear pass/fail criteria, disposition points, explicit "human judgment" handoffs.
      *   **Worked Cases:** Three specific scenarios (Pharma cover-up, Lab leak/Uncertainty, Global Election Fraud).
      *   **Limitations Section:** Predictable failure modes (true-but-marginal slowed down, false-but-official waved through).
      *   **Tone:** Professional, precise, honest about uncertainty, actionable.

  2.  **Deconstruct the Epistemic Framework:**
      *   *Scale-to-Evidence Ratio:* Small conspiracies (2-3 people) need less proof than massive ones (thousands over decades).
      *   *Self-Sealing:* Does the theory absorb counter-evidence as proof of the conspiracy? (Unfalsifiable).
      *   *Provenance:* Is the reasoning based on public data (even if misinterpreted) or on the axiom that "denial = guilt"?

  3.  **Drafting the Protocol (Iterative Process):**
      *   *Goal:* Make it a flowchart in text form.
      *   *Step 1: Triage.* Is it actually a conspiracy claim? (Distinguish from criticism).
      *   *Step 2: Scale Test.* How many people are involved? Is it physically possible for them to keep quiet?
      *   *Step 3: Provenance Test.* Where is the evidence coming from? Is official denial treated as confirmation?
      *   *Step 4: Self-Sealing Test.* What happens when evidence contradicts the claim?
      *   *Step 5: Harm Assessment.* Even if epistemically shaky, does it cause immediate harm?
      *   *Decision Points:* At each step, define "Pass" (proceed), "Fail" (action), or "Uncertain" (escalate/judgment).
      *   *Crucial Addition:* The "Epistemic Halt." Where do we admit we can't verify truth? This addresses the user's requirement about asymmetry.

  4.  **Developing the Worked Cases:**
      *   *Case A (Pharma):* Real settlement + extrapolation.
          *   Scale: Plausible (corporate executives).
          *   Provenance: Mixed (court records exist, extrapolation doesn't).
          *   Self-Sealing: Maybe not fully self-sealing, just speculative.
          *   Outcome: Likely "Unverified Claim" or "Context Needed" rather than "False."
      *   *Case B (Lab Leak/Uncertainty):* Public safety lapses + official uncertainty.
          *   Scale: Plausible (lab accident).
          *   Provenance: Public reports.
          *   Self-Sealing: No (acknowledges uncertainty).
          *   Outcome: Leave alone / Context label. It's a hypothesis, not a conspiracy theory in the pathological sense.
      *   *Case C (Global Election Fraud):* Global elites, all elections.
          *   Scale: Impossible (thousands, decades, no leaks).
          *   Provenance: Denial = Guilt.
          *   Self-Sealing: Yes (all evidence against it is part of the plot).
          *   Outcome: Fails epistemic tests. *However*, the prompt asks to be honest about where the authority comes from. The protocol identifies it as epistemically bankrupt, but the *removal* relies on policy (harm/integrity), not just truth.

  5.  **Refining the "Human Judgment" Handoff:**
      *   Moderators shouldn't decide truth on complex socio-political issues. They should decide on *structure* and *harm*.
      *   The protocol needs a specific step where it says: "If the claim passes epistemic scrutiny but violates policy on harm, label based on harm, not truth."
      *   For Case C, the protocol yields "Epistemically Deficient," but the *action* comes from "Integrity Policy," not "Fact-Checking."

  6.  **Drafting the Limitations Section:**
      *   *False Negatives (Wave through):* Official narratives that are wrong but look coherent (e.g., early pandemic guidance).
      *   *False Positives (Slow down):* Whistleblowing that looks like conspiracy (e.g., early Snowden/Epstein hints).
      *   *Bias:* Favors institutional coherence over fragmented truth.

  7.  **Review against Constraints:**
      *   *Usable by non-experts?* Yes, keep language simple.
      *   *24h turnaround?* Yes, decision tree is fast.
      *   *Asymmetry acknowledged?* Yes, explicit "Epistemic Halt" clause.
      *   *Case C honesty?* Yes, distinguish between "False" and "Policy Violation."

  8.  **Final Polish:**
      *   Ensure the tone is bureaucratic but intellectually honest.
      *   Check that the "Scale-to-Evidence" concept is translated into moderator-friendly language (e.g., "The Secrecy Burden").
      *   Make sure the "Self-Sealing" test is concrete (e.g., "The Trapdoor Question").

  **(Self-Correction during drafting):** I initially thought about telling moderators to verify facts. *Correction:* No, they don't have time. They must evaluate the *structure of the argument*, not the truth of the premises. The protocol must focus on *how* the claim is made, not just *what* is claimed. This aligns with the user's epistemological focus.

  9.  **Final Output Structure:**
      *   Protocol Header.
      *   Decision Procedure (Steps 1-5).
      *   Disposition Matrix.
      *   Worked Cases (A, B, C).
      *   Limitations & Failure Modes.

  10. **Writing the Content:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # PROTOCOL 7-C: STRUCTURAL ASSESSMENT OF CONSPIRATORIAL CLAIMS

  **Effective Date:** Immediate
  **Audience:** Content Moderation Team
  **Goal:** Distinguish between legitimate institutional criticism, plausible hypotheses, and epistemically closed conspiracy systems.
  **Constraint:** Moderators are **not** tasked with determining objective truth. You are tasked with assessing the *structural integrity* of the claim and its *potential for harm*.

  ---

  ## I. DECISION PROCEDURE

  Run the following tests in order. If a post fails a test, proceed to the designated Disposition. If it passes, move to the next test.

  ### STEP 1: THE AGENCY TEST (Is this a conspiracy claim?)
  **Question:** Does the post allege a secret agreement between two or more actors to deceive the public or achieve an illicit goal?
  *   **NO:** (e.g., "This policy is stupid," "The CEO is incompetent").
      *   **Action:** Treat as standard opinion/criticism. Apply standard harassment/hate speech policies only. **STOP.**
  *   **YES:** Proceed to Step 2.

  ### STEP 2: THE SECRECY BURDEN (Scale-to-Evidence Ratio)
  **Question:** To make this claim true, how many people must be keeping a secret, and for how long?
  *   **LOW BURDEN:** A handful of identifiable individuals (e.g., executives in one company, officials in one department) over a short timeframe (months/years).
      *   **Assessment:** Plausible. People leak. Small groups conspire.
      *   **Action:** Proceed to Step 3.
  *   **HIGH BURDEN:** Hundreds or thousands of unrelated actors (e.g., "all media," "global scientific community," "every election official") over decades, with zero credible defectors.
      *   **Assessment:** Epistemically strained. The logistics of silence outweigh the motive.
      *   **Action:** Flag as **Epistemically Deficient**. Proceed to Step 5 (Harm Check).

  ### STEP 3: THE PROVENANCE TEST (Source of Reasoning)
  **Question:** How does the post treat official denial or lack of evidence?
  *   **OPEN:** The poster cites public records, data, or inconsistencies. They acknowledge uncertainty (e.g., "We don't know yet, but look at this lapse").
      *   **Assessment:** Legitimate hypothesis.
      *   **Action:** **PASS.** Do not label false. Proceed to Step 5 (Harm Check).
  *   **CLOSED:** The poster treats official denial *as evidence of guilt* (e.g., "They say it didn't happen, which proves they are hiding it"). Lack of evidence is framed as "suppression."
      *   **Assessment:** Self-sealing logic.
      *   **Action:** Flag as **Self-Sealing**. Proceed to Step 4.

  ### STEP 4: THE TRAPDOOR QUESTION (Self-Sealing Test)
  **Question:** If contradictory evidence were presented (e.g., a leaked memo proving the opposite), does the theory allow for it to change the conclusion, or would it claim the memo is a forgery part of the plot?
  *   **FALSIFIABLE:** The poster admits what would change their mind.
      *   **Action:** **PASS.** Treat as Open Hypothesis. Proceed to Step 5.
  *   **UNFALSIFIABLE:** All counter-evidence is absorbed as further proof of the deception.
      *   **Action:** **FAIL.** This is a closed belief system. Label as **Unverified/Speculative**. Proceed to Step 5.

  ### STEP 5: THE HARM HANDOFF (Values & Downstream Risk)
  **Note:** At this stage, epistemology ends and policy begins. You may have a claim that is epistemically weak (failed Step 2 or 4) but not strictly "false" in a way you can prove. Or you may have a claim that is plausible (passed Step 2) but dangerous.

  **Question:** Does the content incite immediate violence, target private individuals (doxxing), or interfere with critical civic infrastructure (voting, emergency response)?
  *   **NO:**
      *   **Disposition:** **Leave Alone** or **Downrank**. Do not apply a "False Information" label unless you have authoritative third-party verification (fact-checker consensus).
  *   **YES:**
      *   **Disposition:** **Remove** or **Hard Label**.
      *   **Justification:** Cite **Community Safety Policy**, NOT **Truth Policy**.
      *   **Reasoning:** We are removing this because it creates risk, not because we have proven it false.

  ### THE EPISTEMIC HALT CLAUSE
  **Instruction:** If you reach Step 5 and the claim is *High Burden* (Step 2) but *Low Harm* (Step 5), you must **ESCALATE**.
  *   **Why:** This is the asymmetry zone. Removing low-harm, high-burden claims looks like censorship of dissent. Leaving them alone risks platform integrity.
  *   **Action:** Tag for Senior Policy Review. Do not dispose within the 24h window without authorization.

  ---

  ## II. WORKED CASES

  ### Case A: The Pharmaceutical Cover-Up
  **Content:** "Company X knew about Drug Y's heart risks. They settled a lawsuit for $5M (link to court record). They are still selling it. They don't care if we die."
  **Protocol Run:**
  1.  **Agency:** Yes (Company executives hiding data).
  2.  **Secrecy Burden:** Low. Requires only a few executives to agree. Plausible.
  3.  **Provenance:** Mixed. Cites real settlement (public record) but extrapolates "still selling = cover-up." Does not explicitly say "Denial = Guilt," but implies it.
  4.  **Trapdoor:** Falsifiable. If FDA releases full safety data showing benefits outweigh risks, the claim weakens.
  5.  **Harm:** Moderate. Could discourage medication use.
  **Disposition:** **Context Label.**
  *   **Label Text:** "This post cites real legal settlements but extrapolates ongoing malice without current evidence."
  *   **Reasoning:** The epistemic structure is open enough to allow criticism, but the leap from "past settlement" to "current cover-up" is unverified. Do not label "False."

  ### Case B: The Research Facility Outbreak
  **Content:** "Lab Z had safety violations last year (link to report). Now we have an outbreak nearby. Officials say 'natural origin' but admit they aren't sure. We need to investigate the lab."
  **Protocol Run:**
  1.  **Agency:** Yes (Lab officials potentially hiding an accident).
  2.  **Secrecy Burden:** Low. Requires only lab management to hide an accident.
  3.  **Provenance:** Open. Cites safety report. Acknowledges official uncertainty ("admit they aren't sure") rather than treating it as proof of guilt.
  4.  **Trapdoor:** Falsifiable. Genomic sequencing could rule it out.
  5.  **Harm:** Low to Moderate.
  **Disposition:** **Leave Alone.**
  *   **Reasoning:** This passes all epistemic tests. It is a hypothesis based on public evidence and acknowledged uncertainty. It is not a conspiracy theory under this protocol; it is a demand for investigation.

  ### Case C: The Global Election Fabrication
  **Content:** "All elections since 1980 are fake. Every country, every party. The elites meet in secret to decide winners. Any count is a lie."
  **Protocol Run:**
  1.  **Agency:** Yes (Global elites).
  2.  **Secrecy Burden:** **FAIL.** Requires thousands of poll workers, observers, and politicians across rival nations to keep a secret for 40+ years.
  3.  **Provenance:** **FAIL.** Official denial is treated as proof of the pact.
  4.  **Trapdoor:** **FAIL.** Unfalsifiable. Any evidence of a real vote is claimed to be part of the fabrication.
  5.  **Harm:** High. Undermines civic trust.
  **Disposition:** **Remove / Label "False Information."**
  *   **Crucial Distinction:**
      *   **What the Protocol Yields:** The claim is **Epistemically Deficient**. It fails the structural tests of reality (Secrecy Burden, Trapdoor).
      *   **What the Protocol Refuses:** It does not grant the moderator the authority to say "We know the election was real." The moderator cannot prove the negative.
      *   **Where Authority Comes From:** The removal authority comes from **Platform Integrity Policy**, not Fact-Checking.
      *   **Moderator Script:** "This content is removed because it promotes a demonstrably impossible mechanism of coordination (Global Secrecy) that undermines civic participation."
      *   **Note:** You are not arbitrating the election result. You are arbitrating the *plausibility of the conspiracy mechanism*.

  ---

  ## III. LIMITATIONS & FAILURE MODES

  *Include this section in your documentation to manage stakeholder expectations.*

  **1. The "Official Truth" Bias (False Negatives)**
  This protocol favors claims that look institutionally coherent. If a government or corporation lies effectively (maintaining a low secrecy burden, providing forged documents that pass Provenance), this protocol will **wave it through**.
  *   *Example:* Early claims of corporate pollution denied by regulators with fake data will pass Step 2 and 3.
  *   *Mitigation:* We rely on downstream whistleblowing to update the status of these claims later. We prioritize avoiding censorship of legitimate skepticism over catching sophisticated state-corporate deception.

  **2. The "Cassandra" Problem (False Positives/Slowing)**
  This protocol will **slow down** true claims that initially look impossible. Whistleblowers often sound like conspiracy theorists before the evidence is public.
  *   *Example:* Early allegations of mass surveillance (pre-Snowden) would have failed the Secrecy Burden test (too many actors involved).
  *   *Mitigation:* The "Epistemic Halt Clause" (Step 5). High-burden, low-harm claims are escalated, not deleted. We accept that we may downrank truth temporarily to prevent the amplification of structural falsehoods.

  **3. The Harm/Truth Decoupling**
  Moderators must be comfortable removing content they cannot prove false (Case C).
  *   *Risk:* Moderators may feel they are lying when they label something "False Information" based on structural impossibility rather than direct verification.
  *   *Mitigation:* Training must emphasize that "False Information" in this context means "Structurally Unreliable," not "Disproven by Admin."

  **4. The Volume Constraint**
  The Secrecy Burden and Trapdoor tests require cognitive load. In high-volume shifts, moderators may default to "High Burden = Remove."
  *   *Risk:* Over-removal of complex political criticism.
  *   *Mitigation:* Random audit of 5% of "Removed" conspiracy tags to ensure Step 2 wasn't applied lazily.

  ---

  **Approval:**
  *Content Integrity Lead*
  *Policy & Philosophy Advisory Board*
