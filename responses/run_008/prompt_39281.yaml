      *   **Goal:** A verdict on whether the residue is a vocabulary defect, game theory overclaim, or a genuine seam.
      *   **Tone:** Technical, precise, respectful of both fields, avoiding hand-waving.

  2.  **Deconstruct the Translation (EGT $\to$ DS):**
