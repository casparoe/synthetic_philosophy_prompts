          *   *Philosopher's take:* Mostly acceptable, but "mathematics survives" is a bit strong. Sometimes equations change form but keep predictive structure. "Objects... go with it" is the contentious part (do they cease to exist or do we just stop believing in them?). Acceptable for pop-sci.

      *   *Sentence 3:* "Fresnel's equations for light were carried over essentially unchanged into Maxwell's theory, so what Fresnel had actually discovered was the structure of light rather than its substance."
          *   *Assessment:* This is Worrall's classic example (1989).
          *   *Philosopher's take:* Accurate representation of Worrall's argument. The inference ("so what Fresnel had actually discovered...") is the philosophical move. It's a valid *argument* for the view, though not a proven fact. Acceptable.

      *   *Sentence 4:* "On this view the electron is not really a thing at all, just a node in a web of relations, and if physics someday discards electrons the way it discarded the ether, structural realism will have seen it coming."
