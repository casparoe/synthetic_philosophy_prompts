answer: |-
  Here are three candidate scenarios to test against your specs.

  **1. The Perfumer's Ampoule.** A master perfumer sniffs a single synthetic molecule (stored in sealed, light-proof glass ampoules broken fresh daily) for ten years, logging intensity, pleasantness, and "sharpness."
  *   *Why it works:* Olfaction bypasses the thalamus and hits the amygdala directly, making the blur between sensory quality and emotional affect biologically plausible. Detailed logs are industry standard.
  *   *Risk:* Readers might object that chemicals degrade over a decade, introducing a physical confound you'd have to stipulate away.

  **2. The Piano Tuner's Tone.** A tuner listens to a digital 440Hz sine wave on calibrated headphones daily, logging "brightness," "comfort," and "stability."
  *   *Why it works:* Digital signals are physically immutable, satisfying the "high epistemic access" spec perfectly. Pitch vs. Timbre vs. Aversion is a clean philosophical split.
  *   *Risk:* Too sterile for a general readership; hard to imagine a human having a shifting emotional relationship with a pure tone without sounding pathological.

  **3. The Textile Expert's Swatch.** A quality controller rubs a specific wool blend daily, logging "prickle intensity," "annoyance," and "texture roundness."
  *   *Why it works:* Tactile qualia are under-discussed compared to vision. "Prickle" blends sensory pain with aversion perfectly.
  *   *Risk:* Fabric physically wears down (fibers break), making it hard to rule out physical change without sounding like you're rigging the experiment.

  **Selection:** I'm going with **The Perfumer**. It's the most evocative for longform, and we can solve the degradation risk by specifying sealed ampoules (standard industry practice for stability testing). It hits the "everyday" spec while allowing for the rigorous logging you need.

  ***

  ### The Scenario

  Elara is a master perfumer who spends ten years testing a single synthetic molecule, Iso E Super, drawn from a batch of sealed, light-proof glass ampoules broken fresh each morning to ensure chemical stability. She is trained to dissociate sensation from preference, and she keeps a contemporaneous digital log rating each session on three independent axes: *Intensity* (how strong the scent is), *Character* (how sharp or round it feels), and *Valence* (how much she likes it). Over the decade, her *Intensity* ratings remain statistically flat, but her *Character* ratings drift steadily from "sharp" to "round" while her *Valence* ratings shift from "unpleasant" to "pleasant." When reviewed, Elara insists that her mood hasn't simply improved over the years, nor has her vocabulary drifted; she reports that the smell itself genuinely mellowed, becoming objectively rounder in its phenomenal quality even as its strength remained constant.

  ***

  ### The Verdicts

  **The Qualia Realist**
  The realist believes there is a fact of the matter about what Elara's experience felt like, independent of her judgments. They will say Elara's report is tracking a real change in her phenomenal field, but they must admit they cannot prove *which* change occurred. For the realist, there are two distinct metaphysical buckets: the raw sensory qualia (the "sharpness") and the affective tone (the "unpleasantness"). Elara insists the first bucket changed. The realist says, "Either she is right, or she is confusing the second bucket for the first. But one of those is true." They treat her introspective authority as strong but not infallible; the underdetermination is an epistemic problem (we can't know), not an ontological one (the fact exists).

  **The Intentionalist**
  The intentionalist believes experience is constituted by what it represents about the world. They will translate Elara's puzzle into a question about content: Did the representational content of her experience change? If "sharpness" is a represented property of the odor, and it changed, then the experience changed. However, many intentionalists argue that affect (liking) is also part of the content (representing the object as "good"). So, the intentionalist might struggle to separate the hypotheses as cleanly as the realist. They would likely say Elara's report is tracking a shift in *how the odor is represented*, but they might deny there is a further "felt quality" over and above that representation. If the representation of the object's properties didn't change, but her judgment of value did, the intentionalist says the qualia stayed fixed. The underdetermination lies in figuring out which part of the content shifted.

  **The Dennett-Style Disquiner**
  The disquiner denies there is any fact of the matter to be underdetermined. They will say Elara's sincere report is tracking nothing more than a change in her dispositions to behave and speak. To ask "did the qualia change?" is like asking a computer "did your software update or did your user preferences change?" when the output is identical. There is no inner screen she is looking at; there is only the complex machinery of her brain producing the log entries. Since the physical stimulus was fixed and her output (the logs) is consistent with multiple internal stories, the question "which story is true?" is empty. The underdetermination isn't a puzzle to be solved; it's a signal that the question itself is malformed.

  ***

  ### The Honest Bit

  **The Feature Doing the Work**
  The crucial mechanic here is the **dissociation between Intensity and Character**. In most sensory adaptation cases (like the coffee), everything fades together—strength and quality drop in tandem, which suggests simple physiological desensitization. By holding *Intensity* fixed while *Character* drifts, I've blocked the obvious physical explanation (nose fatigue). This forces the reader to choose between a change in the *quality* of the sensation (qualia change) or a change in the *interpretation* of that sensation (attitude/vocabulary change), with no physical lever to pull.

  **If You Remove It**
  If Elara's *Intensity* ratings dropped along with the *Sharpness*, the case collapses. A reader (and a neuroscientist) would rightly say, "Her olfactory receptors are desensitizing; the signal is getting weaker, so it feels different." That restores a physical explanation for the phenomenological change. The underdetermination vanishes because the "experience changed" hypothesis swallows the others. The flat Intensity line is the only thing keeping the "attitude changed" and "vocabulary drifted" hypotheses alive as rivals.

  **The Strongest Qualia Defender Countermove**
  A savvy qualia realist will attack the **Privileged Access** premise. They will argue that Elara doesn't need to infer what happened from her logs; she has direct access to her phenomenal memory. They would say: "Elara can hold the memory of the Year 1 smell in her mind and compare it directly to the Year 10 smell. She doesn't need to guess via logs. If she says the quality changed, she is comparing the qualia directly, not inferring them."
  *Weakness in the countermove:* This relies on the assumption that phenomenal memory is a faithful recording rather than a reconstructive process. If memory reconstructs the past based on current attitudes (which psychology suggests it does), her "direct comparison" is contaminated by the very attitude shift we're trying to isolate. But you must acknowledge this tension: if the reader believes in perfect phenomenal memory, the case breaks. You need them to believe memory is fallible even for experts.
