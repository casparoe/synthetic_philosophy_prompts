      *   *Section 3: The "Unjust Law" Constraint.* Nuance this. Symbolic disobedience is allowed, but it must communicate.
      *   *Section 4: The Critique of Real Movements.* Acknowledge the cousin's strongest point. Rawls is conservative/stabilizing. Revolutionary disobedience (aiming to overthrow) isn't "civil disobedience" for Rawls; it's "militant action" or revolution.
      *   *Section 5: The Conclusion (Drop the Concept?).* Argue against dropping it. Distinctions matter (violence vs. nonviolence, appeal to public vs. coercion). Rawls's definition is a *normative ideal*, not a descriptive sociological bucket.
