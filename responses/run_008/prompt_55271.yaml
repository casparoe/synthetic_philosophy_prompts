      *   Is it nuanced? Yes.

  7.  (Mental Check on Rawls specifics): Rawls defines it in *A Theory of Justice*, Section 55-59. Key elements: Public, nonviolent, conscientious, political, fidelity to law, nearly just society. Correct.
      *   *Leaking:* Covert, so not civil disobedience for Rawls.
