prompt: |-
  You're a professional philosopher specializing in population ethics, so please think this through carefully — maybe brainstorm the possible escape routes before committing to one.

  My supervisor keeps running this argument on me and I cant find where it breaks. It seems to prove way too much, but he insists it's just a straight application of the asymmetry.

  (1) Take Benatar's asymmetry: (a) presence of pain is bad; (b) presence of pleasure is good; (c) absence of pain is good, even if there's nobody existing who enjoys that absence; (d) absence of pleasure is not bad unless there's somebody who is deprived by it.

  (2) Now consider grandma, 80, mildly arthritic, loves her garden and her grandkids. Her remaining life contains some pain and alot of pleasure.

  (3) If she keeps living, there's presence of pain — bad. If she dies painlessly in her sleep tonight, there's absence of pain — good, by (c).

  (4) The pleasures she would have had are also absent after death, but by (d) that's not bad, since nobody is deprived of them — she no longer exists, so there's no subject around being deprived.

  (5) So her painless death tonight is good, all things considered, and her taking her heart medication would be preventing a good and prolonging a bad.

  (6) Generalize: painless killing of anyone whose remaining life contains any pain whatsoever — so, basically everyone — comes out good rather than bad, and we're wrong to save lives. My supervisor says this shows the whole asymmetry has to go.

  Which is exactly what I don't want to conclude. The thing I like about the asymmetry is that it explains why it's wrong to create a child you know will be miserable, while also denying that failing to create a happy child is wrong — I want to keep that. So: which step would you reject, why did that step look fine on the way in, and what does rejecting it cost the asymmetry? My own vague hunch is that something fishy happens between (3) and (4) — maybe a slide from never existing to ceasing to exist, or maybe the "good" in (c) isn't the kind of plus you can just put in a ledger — but I want an actual diagnosis, not vibes. Please be specific about what each escape route has to pay for.
