prompt: |-
  so for art class we're doing a unit on forgeries (we watched a documentary about that guy who faked vermeers back in the 40s) and we had to write down where we stand on whether originals matter. I wrote my list and now I genuinely can't tell if it hangs together or not:

  (1) a painting's value is basically the experience you get from looking at it, so if two paintings look identical they're equally good as art
  (2) therefore a perfect forgery that experts could never detect is worth the same as the original
  (3) but if the museum announced tomorrow that the vermeer I saw on our field trip is actually fake, I'd feel like I'd been admiring something worse, and honestly part of me thinks they should take it down
  (4) I think the artist making the thing with their own hands is a big part of why originals are special, like an original sketch matters because of who touched the paper
  (5) but I still think duchamp's fountain counts as real art even tho he just picked a urinal that some factory made and signed it
  (6) and with digital art I think a perfect copy of the file is literally the same object, like there's no fact of the matter about which is "the" one

  so does this all fit together or am I kidding myself? like if (3) is right doesn't that pretty much kill (1)? and does (5) contradict (4), or is that somehow different? go through the pairs, tell me which are actually in tension and which just look that way, and if something has to give, tell me the cheapest fix. but dont just flag everything as a problem, actually sort out whats real from whats not.
