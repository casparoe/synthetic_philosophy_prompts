answer: |-
  Here is the specification sheet you asked for. Your friend is technically right that you cannot have *every* T-sentence in a consistent classical theory (Tarski proved that in 1933), but you are right that a theory of truth that loses too many of them stops looking like a theory of *truth*.

  The debate isn't about whether you can have everything (you can't); it's about which constraint you break to save the rest. Below are the desiderata, categorized by whether they are logical constraints, functional requirements, or philosophical "religion."

  ### I. The Desiderata Specification

  #### 1. Transparency (The T-Schema)
  *   **The Demand:** The theory validates $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$ for as wide a class of sentences $\phi$ as possible.
  *   **The Case:** This is the functional definition of the truth predicate. If $T$ doesn't allow you to move between mentioning a sentence and asserting it, it's not a truth predicate; it's just a label like "provable" or "warranted."
  *   **Status:** **Functional Requirement (with caveats).** You must have *some* T-sentences, or you aren't doing truth. However, having *all* of them is **Provably Impossible** in a consistent classical theory containing arithmetic (Tarski's Undefinability Theorem).
  *   **The Compromise:** The theory must specify *which* T-sentences fail (e.g., paradoxical ones) and justify why those specific failures don't cripple ordinary discourse.

  #### 2. Compositionality
  *   **The Demand:** The truth value of a compound sentence is determined by the truth values of its parts (e.g., $T(\ulcorner A \land B \urcorner) \leftrightarrow T(\ulcorner A \urcorner) \land T(\ulcorner B \urcorner)$).
  *   **The Case:** Without this, truth doesn't interact with logic. You can't reason *through* truth.
  *   **Status:** **Functional Requirement.** A non-compositional truth predicate is useless for logic. However, some theories (like Kripke's) preserve this only for "grounded" sentences, failing for paradoxical ones.

  #### 3. Conservativity
  *   **The Demand:** Adding the truth predicate to your base theory (e.g., Peano Arithmetic) does not allow you to prove any new theorems *in the base language* that you couldn't prove before.
  *   **The Case:** If truth is just a logical device for disquotation (Deflationism), it shouldn't add mathematical power. If adding truth lets you prove the consistency of arithmetic (which it often does), truth is a substantive property, not just a logical tool.
  *   **Status:** **Philosophical Religion (Field's Camp).** This is a deflationist constraint. Substantive theories of truth (like Tarski's hierarchy or Feferman's systems) often reject this. Rejecting conservativity isn't a bug; it's a feature if you think truth captures a real property that implies soundness.

  #### 4. Expressive Completeness (No Revenge)
  *   **The Demand:** The theory can express its own solution. If the Liar is "ungrounded" or "false," the theory must be able to say "The Liar is ungrounded/false" without generating a new paradox (e.g., "This sentence is ungrounded").
  *   **The Case:** If you solve the Liar by saying it lacks a truth value, but you can't say *that* within the theory without crashing, you haven't solved the problem; you've just moved it to the metalanguage.
  *   **Status:** **Logical Constraint.** This is where most theories die. "Revenge" paradoxes suggest that any consistent theory is expressively incomplete regarding its own semantics.

  #### 5. Inner/Outer Logic Alignment
  *   **The Demand:** The logic valid *within* the theory (Inner) matches the logic used to reason *about* the theory (Outer).
  *   **The Case:** If your theory uses Classical Logic externally but requires a weaker logic (e.g., K3 or LP) internally to avoid paradox, you cannot formally assert the rules of your own logic within the theory. You can't say "Modus Ponens holds for truth" without triggering Curry's paradox.
  *   **Status:** **Fact of Life (mostly).** For naive truth theories, this alignment is **Provably Impossible** (see Curry below). Mismatched logics are usually the price of admission for solving the Liar without hierarchy.

  ---

  ### II. The Impossibility Theorems (What You Can't Have)

  You need to bring these to the argument. These are the hard walls. You cannot have the following combinations simultaneously in a sufficiently expressive language:

  **1. The Tarski-Montague Trilemma**
  You cannot have all three of the following:
  *   (A) **Naive Truth:** All T-sentences $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$ are axioms.
  *   (B) **Classical Logic:** Specifically, the Law of Non-Contradiction and Excluded Middle.
  *   (C) **Consistency:** The theory does not prove everything (triviality).
  *   *Verdict:* One must go.
      *   Tarski kept (B) and (C), sacrificed (A) via hierarchy.
      *   Dialetheists keep (A) and (B), sacrifice (C) (paraconsistency).
      *   Paracomplete theorists (Kripke) keep (A) and (C), sacrifice (B) (truth-value gaps).

  **2. Curry's Paradox (The Contractivity Constraint)**
  This is your friend's ace. Even if you remove negation (avoiding the Liar), you still crash if you have:
  *   (A) Naive Truth ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$)
  *   (B) Modus Ponens
  *   (C) Contraction (If $A \to (A \to B)$, then $A \to B$)
  *   *Verdict:* To keep Naive Truth, you must weaken logic further than just removing negation. You have to break Modus Ponens or Contraction. This makes the "Inner Logic" significantly weaker than standard reasoning.

  **3. The Soundness/Conservativity Trade-off**
  *   If a truth theory is **Conservative** over arithmetic, it cannot prove the consistency of arithmetic.
  *   If a truth theory proves the consistency of arithmetic (Global Soundness), it is **Non-Conservative**.
  *   *Verdict:* If you want truth to certify the base theory, you must accept that truth adds substantive power.

  ---

  ### III. The Inner/Outer Logic Distinction: Cheat or Feature?

  Your friend calls it cheating; you felt it was wrong but couldn't say why. Here is the technical articulation:

  *   **The Distinction:**
      *   **Outer Logic:** The logic you use to prove theorems *about* the truth theory (usually Classical).
      *   **Inner Logic:** The logic that governs the truth predicate *inside* the theory (often non-classical to block paradox).
  *   **Why it feels like cheating:** It creates a "semantic blind spot." The theory cannot assert its own validity conditions. You (in the metalanguage) know Modus Ponens works for ordinary sentences, but the theory itself cannot assert "Modus Ponens holds for $T$" without triggering Curry's paradox.
  *   **Is it a defect?** It is an **Expressive Cost**, not a logical error. It means the theory is not "semantically closed." You can reason *about* the theory better than the theory can reason *about itself*.
  *   **Verdict:** It is not cheating, but it is a significant limitation. A theory that cannot validate its own inference rules is arguably incomplete. However, given Curry's theorem, **some** mismatch is unavoidable if you want to keep Naive Truth and Consistency.

  ---

  ### IV. Quick Scorecard of Major Approaches

  Here is how the main contenders score against your spec sheet.

  **1. Kripke-Feferman (Fixed Point)**
  *   **T-Sentences:** Only for "grounded" sentences. Liar sentences have no truth value.
  *   **Logic:** Inner logic is K3 (strong Kleene); lacks Excluded Middle. Outer logic is Classical.
  *   **Revenge:** Vulnerable. Cannot express "is ungrounded" within the object language without new paradoxes.
  *   **Inner/Outer:** Mismatched.
  *   **Verdict:** Safe, but expressively weak.

  **2. Revision Theory (Gupta/Belnap)**
  *   **T-Sentences:** Treated as revision rules, not static axioms. Truth is a process, not a property.
  *   **Logic:** Classical, but circular.
  *   **Revenge:** Handles some, but stability of revision is hard to define internally.
  *   **Inner/Outer:** Aligned (both Classical), but the semantics are non-standard.
  *   **Verdict:** Captures the dynamic nature of truth, but mathematically complex.

  **3. Contextualist (Burge, Kaplan)**
  *   **T-Sentences:** Valid within a context. The Liar shifts context when evaluated.
  *   **Logic:** Classical.
  *   **Revenge:** Claims revenge is blocked because the new sentence is in a new context.
  *   **Inner/Outer:** Aligned.
  *   **Verdict:** Linguistically plausible, but requires accepting that truth is indexical (context-sensitive).

  **4. Dialetheism (LP, Priest)**
  *   **T-Sentences:** **All of them.** Including the Liar.
  *   **Logic:** Paraconsistent (LP). Rejects Excluded Middle/Disjunctive Syllogism in certain cases.
  *   **Consistency:** **Rejected.** Accepts true contradictions.
  *   **Revenge:** Claims revenge is just another true contradiction.
  *   **Inner/Outer:** Aligned (both Paraconsistent).
  *   **Verdict:** Maximally preserves T-sentences, but requires accepting that some contradictions are true (high philosophical cost).

  ### Summary for Your Argument

  Tell your friend this:
  1.  **You concede Tarski:** You know you can't have *all* T-sentences + Classical Logic + Consistency.
  2.  **Your Demand:** You are demanding a theory that minimizes the loss of T-sentences for *ordinary* discourse and explains the loss for *paradoxical* discourse without making the theory expressively crippled (Revenge).
  3.  **The Real Fight:** The argument isn't about T-sentences per se; it's about **Conservativity vs. Soundness**. If she demands Conservativity (Field), she is forcing a deflationist view that prevents truth from doing substantive work. If you demand Soundness, you must accept Non-Conservativity.
  4.  **Inner/Outer:** Acknowledge the mismatch is the price of avoiding Curry's paradox, but argue that a theory that cannot assert its own validity rules is pragmatically deficient, even if formally consistent.

  **The "Non-Negotiable" Bottom Line:**
  A theory of truth must allow you to infer $\phi$ from $T(\ulcorner \phi \urcorner)$ in ordinary cases. If it blocks that inference for non-paradoxical sentences to save consistency, it has changed the subject. If it blocks it only for paradoxes, it must explain why the paradoxes aren't just "ordinary sentences we haven't analyzed yet."
