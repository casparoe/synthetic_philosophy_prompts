  The July Crisis is best read as a **boundary case** that vindicates the Common Prior Assumption (CPA) as a diagnostic tool for identifying information failures, but ultimately exposes its empirical fragility when applied to composite political agents with entrenched ideological priors.

  **Mapping the Players**
  For the CPA to hold, players must be unitary Bayesian agents. The Great Power governments (Berlin, Vienna, St. Petersburg, London, Paris) are the nominal players, but this mapping is strained. Cabinets were deeply split (e.g., the British Foreign Office vs. Cabinet; German Chancellor vs. General Staff). Internal disagreement violates the "single mind" requirement necessary for coherent posterior formation. When Moltke pushed for war while Bethmann Hollweg hesitated, Germany lacked a single probability distribution to update. Thus, the crisis begins with a category error: treating bureaucracies as rational individuals.

  **Beliefs: Information vs. Priors vs. Payoffs**
  Harsanyi dictates divergent beliefs stem from private information, not different priors.
  1.  **British Intervention:** Germany assigned low probability to British entry; Britain assigned high probability to staying out unless Belgium was violated. This looks like private information (Britain's internal indecision) rather than divergent priors. Germany's failure to update correctly on British ambiguous signals suggests irrationality (wishful thinking), violating the rationality precondition of Aumann's theorem, not necessarily the CPA itself.
  2.  **Mobilization:** Russia viewed partial mobilization as a deterrent signal; Germany viewed any mobilization as an offensive *casus belli*. This is primarily a **payoff/definition mismatch**, not a prior divergence. Both agreed on the mechanics; they disagreed on the strategic meaning attached to them.
  3.  **War Duration:** All powers expected a short conflict. This is a **common prior** error (shared optimism bias), not a divergence. They agreed on the state of the world (war will be short), they were just wrong.

  **Aumann and No-Trade**
  Aumann's Agreement Theorem implies rational agents with common priors cannot agree to disagree. War is a "trade" where both sides expect positive utility from fighting rather than settling. The outbreak of war implies either:
  1.  **Lack of Common Knowledge:** Secret actions (Russia's "Period Preparatory to War," Germany's Blank Check) created information asymmetries that prevented convergence. This supports the CPA defense: it wasn't different priors, but hidden information preventing common knowledge of posteriors.
  2.  **Coordination Failure:** The escalating spiral of mobilization deadlines looks like a coordination problem (Stag Hunt) compatible with common priors. Both preferred peace but feared the other's mobilization more than war itself. This is common-prior-compatible all the way down; the tragedy was structural, not probabilistic.

  **Critique of the CPA**
  Does the CPA organize the case or obscure it?
  *   **As Idealization:** It is useful. It forces the analyst to ask: "What private info did Germany have?" (Answer: The Blank Check commitment). It highlights that the spiral was driven by hidden actions, not just inherent hostility.
  *   **As Empirical Truth:** It fails. National self-images functioned as genuinely different priors. German fear of encirclement and Russian Pan-Slavic duty were not Bayesian updates based on evidence; they were foundational narratives resistant to new information. A German prior that "Russia will always mobilize" and a Russian prior that "Germany seeks hegemony" were culturally entrenched. No amount of diplomatic signaling could update these because they were axiomatic, not probabilistic.
  *   **Unitary Agent Problem:** The CPA assumes a single mind. States are collections of competing priors. The "German prior" was an aggregate of conflicting internal beliefs, making the concept of a coherent posterior meaningless.

  **Conclusion**
  The July Crisis shows the CPA is a powerful negative heuristic: when war occurs, common knowledge or rationality has failed. However, it cannot fully explain the crisis because the agents were not unitary minds, and their "priors" were often ideological commitments immune to updating. The crisis is less a failure of common priors than a failure of the model's applicability to complex, irrational, composite political entities. The theory speaks clearly to information asymmetries (hidden mobilizations) but falls silent on the cultural narratives that made those asymmetries fatal.
