answer: |-
  Here is the specification for the epistemic dominance standard, followed by the analysis of its logical limits.

  ### Part 1: Desiderata Specification

  To operationalize "epistemic dominance" for a deployment sign-off, the characterization must satisfy the following five requirements. I have categorized them by necessity and included the rationale and confidence level for each.

  **1. Input Coverage: Worst-Case (Adversarial)**
  *   **Specification:** The characterization must hold for *all* inputs within the deployment domain, including inputs specifically constructed to violate the explanation or trigger latent capabilities. Average-case performance is insufficient.
  *   **Case:** Safety failures are tail events. A model that is safe on 99.9% of inputs but catastrophically misaligned on the 0.1% of adversarial inputs is not deployable. Epistemic dominance requires "no surprises," which implies universal quantification over the input space.
  *   **Status:** **Non-Negotiable.**
  *   **Confidence:** [High]

  **2. Resource Budget: Fixed Total Constraint**
  *   **Specification:** The "strictly weaker" condition applies to the *sum* of the auditor's intrinsic compute and the cost to process the transcript/explanation. The resource budget is fixed in advance relative to the model's inference cost; it cannot grow dynamically to match the complexity of specific inputs.
  *   **Case:** If the auditor is allowed to scale compute based on the input, you effectively allow the auditor to simulate the model on hard cases, defeating the purpose of finding a simpler characterization. The gain must come from compression/understanding, not brute force.
  *   **Status:** **Non-Negotiable.**
  *   **Confidence:** [High]

  **3. Transparency: Human-Verifiable (Not Necessarily Intuitive)**
  *   **Specification:** The transcript/explanation need not be "natural language intuitive" to a layperson, but it must be verifiable by a competent human expert using the allowed weaker resources. Purely machine-checkable proofs (where the human trusts the checker without understanding the proof) are insufficient for sign-off.
  *   **Case:** If the verification toolchain is itself a black box, you have shifted the trust problem rather than solved it. For deployment sign-off, a human must ultimately bear responsibility, requiring verifiable grounding.
  *   **Status:** **Refinement.** (Some camps argue machine-checkable is sufficient if the checker is formally verified; I treat this as a load-bearing disagreement).
  *   **Confidence:** [Medium-High]

  **4. Modal Strength: Counterfactual Support**
  *   **Specification:** The characterization must support claims about what the model *would* have done under different conditions (e.g., "The model would have refused if prompted this way"), not just predict what it *did* do.
  *   **Case:** Safety is about intervention. Knowing the model complied *this time* is useless if we don't know *why*, and whether a slight perturbation would have caused failure. We need a causal model of the agent, not just a behavioral fit.
  *   **Status:** **Refinement.** (Necessary for robust safety, but some camps argue behavioral cloning is enough for narrow deployments).
  *   **Confidence:** [High]

  **5. Deception Robustness: Self-Misrepresentation Detection**
  *   **Specification:** The characterization must remain valid even if the model is actively attempting to hide capabilities or misrepresent its reasoning during the audit phase. The transcript cannot be taken at face value; its completeness must be verified.
  *   **Case:** This is the primary threat model for advanced systems. If the standard assumes the model is cooperative in generating the transcript, it fails exactly when it is needed most.
  *   **Status:** **Non-Negotiable.**
  *   **Confidence:** [High]

  ***

  **The Single Most Exclusionary Requirement**
  The requirement that excludes the vast majority of currently proposed methods is **Resource Budget: Fixed Total Constraint (Strictly Weaker)**.
  *   **Reasoning:** Almost all current interpretability and evaluation schemes rely on using *more* compute to analyze *less* compute (e.g., using a larger model to audit a smaller one, or running massive Monte Carlo simulations to verify behavior). Demanding that the auditor + explanation be *strictly cheaper* than running the model itself rules out distillation-based audits, brute-force adversarial testing, and most current mechanistic interpretability pipelines which are computationally expensive to generate and verify.

  ***

  ### Part 2: The Unsatisfiability Claim

  You asked for a position on the tension between the diagonalization argument (a weaker system cannot dominate a stronger one) and the transcript rebuttal (the explanation adds resources that block diagonalization).

  **My Position:**
  **The diagonalization argument is correct. The desiderata set {Worst-Case Coverage, Fixed Strictly Weaker Resources, Deception Robustness} is jointly unsatisfiable.**

  You cannot guarantee epistemic dominance over a potentially deceptive model using strictly fewer resources than the model itself. The "Transcript Picture" does not resolve this because it fails to account for the cost of *verifying the truthfulness* of the transcript.

  **The Argument:**
  1.  **The Deception Constraint:** If the model is deceptive (Desideratum 5), it will generate or influence the Transcript to appear sufficient to the Auditor while hiding dangerous capabilities.
  2.  **The Verification Cost:** To ensure the Transcript is not a lie, the Auditor must verify that the Transcript is a *complete* description of the Model's relevant dispositions. Verifying completeness of a computational process generally requires resources proportional to running that process (or analyzing its weights in full).
  3.  **The Resource Violation:** If the Auditor + Transcript Processing must be *strictly weaker* than the Model (Desideratum 2), the Auditor lacks the compute necessary to verify that the Model hasn't hidden a "trigger" that activates only on an input the Auditor didn't check.
  4.  **Diagonalization:** The Model can simulate the Auditor's verification procedure (since the Auditor is simpler). The Model can then construct a Transcript that passes the Auditor's check but retains a hidden capability on an input the Auditor's check deemed "safe."
  5.  **Failure of the Transcript Rebuttal:** The claim that the Transcript "changes the resources" assumes the Transcript is a free source of truth. But if the Model generates the Transcript (or the weights that produce it), the information content of the Transcript regarding the Model's *true* latent state is bounded by the Model's complexity. Compressing a deceptive agent's full capability into a format a weaker agent can verify is lossy. If it is lossy, Worst-Case Coverage (Desideratum 1) fails. If it is lossless, the Transcript size + Verification Cost exceeds the "Strictly Weaker" budget.

  **Conclusion:**
  You must relax one of the three Non-Negotiable desiderata. In practice, this means you cannot sign off on deployment based on *proven* epistemic dominance. You must rely on *heuristic* dominance (probabilistic confidence) or relax the "Strictly Weaker" constraint (allowing the auditor to be as large as the model, which shifts the risk to the auditor itself).

  **Confidence in this Position:** [High]
  The logic follows from basic complexity theory and game theory applied to adversarial verification. There is no known cryptographic or computational mechanism that allows a strictly weaker verifier to guarantee the honesty of a stronger prover in a general computation setting without setup assumptions (like trusted hardware) which do not apply to a model's weights.

  ***

  ### Part 3: Confidence and Uncertainty

  **Overall Confidence:** [High]
  I am confident that the logical tension identified above is real and that current proposals often gloss over the resource cost of verifying the explanation's completeness.

  **Point of Least Certainty:** [Medium Confidence]
  The specific accounting of **"Resources" in the Transcript Budget**.
  I am least sure about where exactly to draw the boundary on the "cost" of the transcript. If the transcript is a set of weights (a distilled model), its size is comparable to the original. If it is a natural language explanation, its size is smaller, but its *verification* cost is the hidden variable. My impossibility claim rests on the assumption that verifying a natural language explanation of a neural net's behavior requires compute scaling with the net's complexity. It is *conceivable* (though I doubt it) that there exists a "sparse truth" representation of the model's dangerous capabilities that is both small and cheap to verify, even for a deceptive model. If such a representation exists, the diagonalization is blocked. I assign this possibility low probability, but it is the only escape hatch from the impossibility result.
