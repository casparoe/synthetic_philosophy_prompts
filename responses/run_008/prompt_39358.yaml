answer: |-
  This is a classic collision between **formal decision theory** (Dave) and **moral phenomenology** (Maya). Both are arguing from internally consistent frameworks, but they are making category errors regarding the other's terrain.

  Here is the adjudication, move by move.

  ### 1. The Chaining Argument (Transitivity vs. Sorites)
  **Dave's Claim:** If you deny that specks aggregate to torture, you break the transitivity of "worse than." If $A$ is worse than $B$, and $B$ is worse than $C$, then $A$ must be worse than $C$. By chaining tiny steps from torture down to specks, you either admit specks win (aggregation) or you admit some steps make *no* difference (violating transitivity of indifference).
  **Maya's Claim:** This is the spectrum argument. Perceptual indifference is non-transitive (you can't distinguish tone 1 from 2, or 2 from 3, but you can distinguish 1 from 100). Moral value can be the same.

  **Adjudication:** **Dave is formally right; Maya is phenomenologically right but technically vulnerable.**
  Dave is correct that standard rational choice theory requires transitivity. If your preference relation is non-transitive ($A \succ B \succ C \succ A$), you cannot maximize a utility function.
  Maya is correct that human *perception* works this way (Just Noticeable Differences). However, she makes a critical error by conceding non-transitivity. A robust "lexical" view (torture is categorically different from specks) does not require non-transitivity; it requires **discontinuity**.
  *   **The Fix:** Maya should argue that there is a *sharp cutoff* (a lexical threshold). Below the threshold, specks aggregate. Above it, torture dominates. This preserves transitivity (Torture > Any amount of Specks) but rejects **continuity**. Dave's chaining argument assumes continuity (that you can slide smoothly from torture to specks). If Maya posits a discontinuous jump, the chain is broken not by non-transitivity, but by a gap in the domain.

  ### 2. The Perceptual Indifference Analogy
  **Maya's Claim:** We live with non-transitive perceptual indifference (tones), so we can live with it in ethics.
  **Dave's Claim:** Indiscriminability is an epistemic limit (eyesight), not an ontological fact about the world. "Worse than" is supposed to structure decision-making, not describe sensory limits.

  **Adjudication:** **Dave wins this point decisively.**
  Maya's analogy fails because it conflates **epistemic** constraints with **normative** structure.
  *   **Epistemic:** "I cannot *tell* the difference between tone A and B." This is a fact about my sensors.
  *   **Normative:** "There *is* no moral difference between outcome A and B." This is a claim about value.
  Even if I cannot perceive the difference between one dust speck and two, it is arguably a fact that two specks are objectively worse than one (more total suffering). Basing moral ontology on human sensory resolution is a form of anthropocentric bias. If a superintelligence could count the specks, would the moral truth change? Dave is right: ethics should track the territory (suffering), not the map (our perception of suffering).

  ### 3. The Money Pump (Dutch Book)
  **Dave's Claim:** Non-transitive preferences make you vulnerable to a money pump. You will pay to switch A→B, B→C, C→A, ending up with A minus money.
  **Maya's Claim:** The pump only works if I'm forced to trade. I can just refuse trades that cross a lexical level.

  **Adjudication:** **Dave is right about the threat; Maya's defense is insufficient.**
  Dave is correct that if preferences are truly non-transitive, a sequential choice environment *will* extract resources from you.
  Maya's defense ("I'll just refuse") only works if she has a **rule** that overrides her local preferences. But if she has a rule (e.g., "Never accept torture for any number of specks"), she is no longer operating on non-transitive preferences; she is operating on **lexical constraints**.
  *   **The Catch:** If she admits she follows a rule, she admits her "worse than" judgment isn't a simple comparison of outcomes, but a compliance check with a deontic constraint. If she sticks to her guns that it's just "non-transitive value," the money pump stands. A rational agent cannot consistently hold non-transitive preferences *and* avoid exploitation without adopting a higher-order rule that effectively restores transitivity.

  ### 4. The Missing Piece (Your Suspicion)
  **Your Suspicion:** They are talking past each other about what "worse than" is for (choice guide vs. fact about outcomes).

  **Adjudication:** **You are exactly right. This is the crux of the stalemate.**
  They are conflating **Axiology** (what is good/bad in itself) with **Decision Theory** (how to choose between options).

  *   **Dave** is treating "worse than" as a **scalar value** input for a maximization algorithm. For the math to work, the values must be real numbers, which implies continuity and transitivity. For him, "worse than" means "has a higher negative utility value."
  *   **Maya** is treating "worse than" as a **moral categorization**. For her, "worse than" means "violates a more serious constraint." She is implicitly arguing for a **vector** or **lexicographic** utility function, not a scalar one.

  **The Resolution:**
  The debate dissolves if they distinguish the *structure of value* from the *procedure of choice*.
  1.  **Lexical Utility is Transitive:** You can have a utility function where $U(\text{Torture}) = -\infty$ and $U(\text{Speck}) = -1$. Here, Torture is always worse than any number of specks. Transitivity holds ($-\infty < -n$). Aggregation fails (no finite sum of $-1$ reaches $-\infty$). Dave attacks her for non-transitivity, but she should be defending discontinuity.
  2.  **The Money Pump Escape:** You avoid the money pump not by "refusing trades" ad hoc, but by having a **pre-commitment** to the lexical rule. But this comes at a cost: **Dynamic Inconsistency**. If Maya encounters a situation where 3^^^3 people *actually* get specks, and she refuses to trade one torture victim to save them, she is arguably violating a higher-order preference (saving lives) to satisfy a lower-order constraint (no torture).

  ### Final Verdict

  *   **On Logic & Decision Theory:** **Dave wins.** Non-transitive preferences are fatal for rational agency. The money pump is a real threat if preferences cycle. The perceptual analogy is a category error.
  *   **On Moral Intuition:** **Maya wins.** Most humans (and legal systems) operate on lexical thresholds. The idea that $3 \uparrow\uparrow\uparrow 3$ specks outweighs torture feels like a reductio ad absurdum of pure aggregation.
  *   **On The Argument:** **Both missed the technical fix.** Maya should not have defended non-transitivity; she should have defended **discontinuous lexical utility**. Dave should not have assumed aggregation implies continuity; he should have attacked the coherence of infinity in utility functions.

  **Recommendation for the Meetup:**
  Tell them to stop arguing about transitivity. The question isn't "Is 'worse than' transitive?" (It must be). The question is "Is the utility function **continuous**?"
  *   If **Yes** (Dave): Aggregation holds, Torture loses to Specks.
  *   If **No** (Maya): Lexical thresholds hold, Torture wins.
  *   **The Cost:** If Maya chooses "No," she must accept that her ethics cannot be represented by a single real number, and she must explain how to resolve conflicts between two lexical goods (e.g., torture vs. genocide) without reintroducing aggregation. If Dave chooses "Yes," he must accept that his ethics will sometimes demand counter-intuitive sacrifices of the few for the trivial benefit of the many.

  You were right: they are arguing about whether ethics is a **calculation** or a **constitution**. Neither can prove the other wrong without first agreeing on what ethics *is*.
