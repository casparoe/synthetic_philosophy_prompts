prompt: |-
  I direct grantmaking for a small family foundation. We make roughly thirty grants a year, none large enough to fund a project outright but each large enough to matter, across three areas the charter names without ranking them: early-stage medical research, music education in under-resourced schools, and land conservation. The board requires every decision to be defensible in a paragraph to a rejected applicant; I have one part-time analyst and about twenty minutes of committee time per shortlisted proposal.

  Our difficulty is not ranking within a category — we can usually order the medical proposals against one another, the music proposals against one another. It is comparing across categories: a pilot study of a cheap diagnostic against a proposal that would keep a rural school's music program alive for three years. Some years we agonize over such pairs; some years the loudest trustee prevails. I have come to suspect the agonizing is sometimes a category error (there was a common currency all along, and we should have computed) and sometimes the only honest response (there was no currency, and no amount of deliberation will manufacture one). I cannot currently tell which situation we are in, and I would like a procedure that can.

  Please write a decision procedure the committee can run in a meeting, grounded in what the philosophy of value actually says about incommensurability and hard choices — Raz on how options can be excluded from comparison before any weighing occurs; Chang on parity, including her test of whether a small improvement in one option would decisively tip the balance, and on what follows when it would not; and the distinction between a tradeoff that is painful but has a common currency and a comparison in which no currency exists at all. The procedure should specify, in this order: gatekeeping questions that stop it with a no (mission fit, basic competence — so that value comparisons occur only between proposals that have already cleared the bar); tests for whether a given pair is commensurable, incomparable, or on a par, phrased so a non-philosopher can apply them in five minutes; and what to do in each case — when to compute, when the correct instrument is a lottery or a rotation between categories and why that is not an abdication of responsibility. It should end by marking the point at which the procedure runs out and hands the decision to the committee because the remaining question is one of values rather than facts, together with a sentence on what the committee is doing at that point — making a reason rather than discovering one, if that is the right way to put it.

  Then run it on three comparisons. First, two medical research proposals whose expected benefits are both expressible, roughly, in life-years. Second, the diagnostic pilot against the rural music program. Third, a music education proposal against a land conservation proposal in which I privately want the music one to win. Report honestly where the procedure gives an answer I will not like — my guess is that it will sometimes tell us a tie was broken by lot, and that the paragraph to the rejected applicant must say that rather than pretend the winner was better. Finally, state plainly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of grantmaking for a small family foundation.
      *   **Context:** ~30 grants/year, medium size (matter but don't fund outright), three distinct areas (Medical Research, Music Education, Land Conservation). No ranking in charter.
      *   **Constraints:** Board requires defensible decisions (1 paragraph to rejected applicants). 1 part-time analyst. ~20 mins committee time per shortlisted proposal.
      *   **Problem:** Difficulty comparing *across* categories (incommensurability vs. hard choices). Sometimes agonizing is a category error (common currency exists); sometimes it's honest (no currency).
      *   **Task:** Write a decision procedure grounded in philosophy of value (Raz, Chang, incommensurability, parity, common currency).
      *   **Structure:**
          1.  Gatekeeping questions (Mission fit, competence).
          2.  Tests for commensurability/incomparability/parity (non-philosopher friendly, 5 mins).
          3.  Actions for each case (Compute, Lottery, Rotation).
          4.  Endpoint: Where procedure ends and values begin (making vs. discovering reasons).
          5.  Run the procedure on three specific comparisons.
          6.  State what the procedure *cannot* do.
      *   **Tone:** Practical, philosophically grounded, honest, actionable.

  2.  **Deconstruct the Philosophical Framework:**
      *   **Joseph Raz:** Exclusionary reasons. Some options are ruled out before weighing begins (e.g., outside mission). Also, the idea that some values are incommensurable because they belong to different spheres of value.
      *   **Ruth Chang:** Parity. The "Small Improvement Argument." If A and B are hard to compare, and a small improvement to A doesn't make A clearly better than B, they aren't equal (one is not better than the other), nor is one better. They are *on a par*. This allows for choice based on will/reasons rather than weight.
      *   **Incommensurability vs. Uncertainty:** Distinguishing between "we don't know the numbers" (uncertainty) and "there are no numbers" (incommensurability).
      *   **Common Currency:** Utilitarian metrics (QALYs, dollars) vs. Pluralistic values.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Gatekeeping.* Needs to be binary. Pass/Fail. Mission alignment, legal compliance, basic capacity. This aligns with Raz's exclusionary reasons.
      *   *Step 2: The Comparison Test.* Needs to be simple. The "Small Improvement Test" is the gold standard here.
          *   *Question:* If we added 5% more funding to Proposal A, would it clearly beat Proposal B?
          *   *If Yes:* They are commensurable. We just need to find the metric.
          *   *If No:* They are either on a par or incomparable.
          *   *Refinement:* Distinguish between "Equal" (rare) and "On a Par" (common in hard choices).
      *   *Step 3: Decision Rules.*
          *   *Commensurable:* Calculate/Score.
          *   *On a Par:* Choice is permitted. Use rotation or strategic intent.
          *   *Incomparable:* (Rare if mission covers all three). If truly incomparable, lottery is honest.
      *   *Step 4: The Endpoint.* Acknowledge that at some point, the foundation *creates* the reason. This is Chang's "will-based reasons."

  4.  **Drafting the Three Test Cases:**

      *   *Case 1: Medical vs. Medical.* Should be commensurable. Life-years/QALYs. The procedure should say "Compute."
      *   *Case 2: Medical (Diagnostic) vs. Music (Rural School).* The classic hard choice. Likely "On a Par." Small improvement in medical funding doesn't necessarily trump keeping music alive. Procedure should suggest acknowledging the parity and choosing based on portfolio balance, not pretending one is objectively better.
      *   *Case 3: Music vs. Land (Director prefers Music).* This tests bias. If they are on a par, the Director's preference *can* count as a "will-based reason," but it must be acknowledged as such, not disguised as objective superiority.
      *   *Honesty Check:* The prompt asks to report where the procedure gives an answer I won't like (e.g., admitting a lottery broke a tie). I need to ensure the output reflects this honesty.

  5.  **Refining the Output (Self-Correction during drafting):**
      *   *Constraint Check:* 20 minutes per proposal. The test needs to be very fast.
      *   *Philosophy Check:* Ensure Raz and Chang are cited correctly but simply. Raz = Exclusion/Thresholds. Chang = Parity/Small Improvement.
      *   *Tone Check:* Needs to be professional but direct. No jargon without explanation.
      *   *The "Paragraph to the Rejected Applicant":* This is a key constraint. The procedure must generate the language for this.
      *   *The "Cannot Do" Section:* Crucial. It can't resolve value conflicts magically. It can't remove regret.

  6.  **Finalizing the Procedure Steps:**
      *   *Gate 1:* Mission/Charter (Raz).
      *   *Gate 2:* Viability.
      *   *Test:* The "5% Test" (Chang).
      *   *Outcome:* Metric vs. Parity Management.
      *   *Closing:* Making Reasons.

  7.  **Running the Scenarios:**
      *   *Scenario 1:* Medical vs. Medical. 5% test works. Metric exists.
      *   *Scenario 2:* Medical vs. Music. 5% test fails. Parity. Decision requires portfolio logic, not just "better."
      *   *Scenario 3:* Music vs. Land. 5% test fails. Parity. Personal preference is valid *if admitted*.

  8.  **Final Review against Prompt:**
      *   Did I include Raz? Yes (exclusion).
      *   Did I include Chang? Yes (parity/small improvement).
      *   Is it in the right order? Yes.
      *   Did I run the three comparisons? Yes.
      *   Did I state what it cannot do? Yes.
      *   Is the tone appropriate? Yes.

  **(Self-Correction Note):** Make sure to emphasize that "Lottery" isn't laziness; it's philosophical honesty when values are truly on a par and no portfolio logic applies. Also, ensure the "paragraph to the rejected applicant" is addressed in the procedure instructions.

  9.  **Drafting the Content:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # The Foundation Value Procedure (FVP)

  **Purpose:** To distinguish between decisions that require calculation (common currency) and decisions that require choice (incommensurable values), ensuring every grant decision is defensible without fabricating false precision.
  **Time Required:** 5 minutes per comparison pair during committee review.
  **Philosophical Grounding:** Joseph Raz (exclusionary reasons), Ruth Chang (parity and the small improvement argument).

  ---

  ### Part I: Gatekeeping (Exclusionary Reasons)
  *Before comparing value, determine eligibility. Based on Raz's concept that some reasons exclude others from the field of comparison entirely.*

  **Question 1: Charter Fit.** Does this proposal fall strictly within one of the three named areas (Medical Research, Music Education, Land Conservation)?
  *   **No:** Reject. *Reason to applicant:* "The proposal falls outside the three specific areas named in our charter."
  *   **Yes:** Proceed.

  **Question 2: Basic Competence.** Is the organization legally compliant, financially solvent, and capable of executing the specific request?
  *   **No:** Reject. *Reason to applicant:* "While the mission is aligned, we cannot fund projects where organizational capacity presents a high risk to execution."
  *   **Yes:** Proceed to Comparison.

  *Note: Only proposals passing both gates enter the value comparison phase.*

  ---

  ### Part II: The Commensurability Test (The 5% Rule)
  *This test determines if a common currency exists. Based on Ruth Chang's "Small Improvement Argument."*

  Take the two proposals you are weighing against each other (Proposal A and Proposal B).

  **Ask:** "If we increased the funding for Proposal A by 5% (or improved its expected impact by a marginal amount), would it **clearly and decisively** become the better choice over Proposal B?"

  *   **Outcome 1: Yes.**
      *   **Diagnosis:** **Commensurable.** A common currency exists (e.g., lives saved, students served, acres protected). The difficulty is merely epistemic (we haven't found the number yet).
      *   **Action:** **Compute.** Direct the analyst to quantify the metric implied by the test. Fund the higher yield.
      *   **Rejection Paragraph:** "While both proposals were strong, the committee determined that Proposal B offered a measurably higher return on investment regarding [specific metric]."

  *   **Outcome 2: No.** (A 5% boost to A does not make it clearly better than B).
      *   **Diagnosis:** **On a Par.** The options are not equal (one is not identical to the other), but neither is better than the other. They belong to different spheres of value. The agonizing is not a failure of analysis; it is a feature of the values.
      *   **Action:** **Choose.** Do not compute. You cannot discover a reason here; you must make one. Use one of the following tie-breakers:
          1.  **Portfolio Rotation:** Have we favored one category disproportionately in the last 3 years? If so, fund the other.
          2.  **Strategic Will:** Does the committee have a specific intent to shift emphasis this year?
          3.  **Random Selection:** If portfolio and will are silent, draw lots.
      *   **Rejection Paragraph:** "Both proposals were judged to be of equivalent merit within our framework. The final decision was made based on [portfolio balance / annual strategic focus / random selection] to ensure equitable distribution across our three mission areas."

  ---

  ### Part III: The Endpoint (Making Reasons)
  *If the procedure reaches Part II, Outcome 2, the committee must acknowledge the nature of their action.*

  **The Commitment:** When choosing between options "on a par," the committee is not discovering a pre-existing fact about which project is "better." The committee is **making a reason** through the act of choosing.
  **The Statement:** At the close of the meeting, the Chair must state: "We acknowledge that the rejected proposal was not inferior. We chose this path to define what our foundation values *this year*, knowing the other path was equally valid."

  ---

  ## Application of the Procedure

  Here is the procedure run on the three comparisons you requested.

  ### Comparison 1: Medical Research vs. Medical Research
  *Proposal A: Pilot study for a low-cost diagnostic.*
  *Proposal B: Early-stage drug interaction study.*

  **Gatekeeping:** Both pass.
  **The 5% Test:** If Proposal A's budget were reduced by 5% (or B's increased by 5%), would the committee feel the balance tip decisively?
  **Result:** **Yes.** Both proposals aim to reduce morbidity/mortality. The analyst can approximate cost-per-life-year or probability-of-breakthrough. The values are homogeneous.
  **Procedure Verdict:** **Commensurable.**
  **Action:** Compute the metric. Fund the higher efficiency.
  **Rejection Language:** "Proposal B was funded because it demonstrated a lower cost-per-unit of projected clinical impact."
  **Honesty Check:** This is comfortable. It feels like work, not agonizing.

  ### Comparison 2: Medical Diagnostic vs. Rural Music Program
  *Proposal A: Pilot study for a low-cost diagnostic (Medical).*
  *Proposal B: Three-year funding to keep a rural school's music program alive (Music).*

  **Gatekeeping:** Both pass.
  **The 5% Test:** If we gave the Medical Diagnostic 5% more funding (or the Music Program 5% less), would the Medical proposal *clearly* become the superior choice?
  **Result:** **No.** A marginal increase in diagnostic efficiency does not morally outweigh the existence of a music program, nor does a marginal decrease in music funding make the diagnostic clearly "better." The values (health vs. cultural/educational enrichment) are distinct spheres.
  **Procedure Verdict:** **On a Par.**
  **Action:** Do not attempt to compute QALYs against "student joy." Check the Portfolio Rotation. If you funded two medical projects last year and no music projects, fund the music. If the portfolio is balanced, the Chair may exercise Strategic Will or call for a Lottery.
  **Rejection Language:** "Both proposals were judged to be of equivalent merit within our framework. The final decision was made based on portfolio balance to ensure equitable distribution across our three mission areas."
  **Honesty Check:** This is the answer you suspected but feared. It requires admitting to the rejected medical applicant that their project was not "worse," just not the chosen focus for this cycle. This feels like an abdication of rigor, but philosophically, it is the only honest stance.

  ### Comparison 3: Music Education vs. Land Conservation
  *Proposal A: Music Education (Your private preference).*
  *Proposal B: Land Conservation.*

  **Gatekeeping:** Both pass.
  **The 5% Test:** If the Land Conservation proposal secured 5% more acreage, would it clearly beat the Music proposal?
  **Result:** **No.** Conservation (stewardship/future) and Music (expression/present development) are likely on a par.
  **Procedure Verdict:** **On a Par.**
  **Action:** Since they are on a par, "will-based reasons" are permissible. You may choose the Music proposal because *you want to*. However, you cannot claim the Music proposal was objectively superior.
  **Rejection Language:** "Both proposals were judged to be of equivalent merit. The committee exercised its discretion to prioritize Music Education for this cycle."
  **Honesty Check:** This is the dangerous one. The procedure allows you to win, but it strips you of the cover of objectivity. You must own the preference. If you are unwilling to tell the Land Trust that their proposal was equal but you simply preferred the other, the procedure forbids you from funding the Music proposal.

  ---

  ## What This Procedure Cannot Do

  1.  **It cannot eliminate regret.** When options are on a par, choosing one means losing a value that was not lesser, only different. The procedure validates the pain of that loss; it does not remove it.
  2.  **It cannot protect you from accountability.** By forcing you to admit when a decision was made by rotation or will rather than metric, it exposes the committee to applicants who demand "objective" scoring. It requires the board to stand behind the philosophy that not all value is measurable.
  3.  **It cannot resolve deep value conflicts within the committee.** If half the trustees believe Medical is objectively superior to Music (rejecting the "On a Par" finding), the 5% Test will fail to consensus. In that case, the procedure halts and returns the question to the Charter: the board must amend the mission or accept that the foundation is currently philosophically incoherent.

  **Final Note:** At the endpoint, when the test says "On a Par" and you cast the deciding vote, you are not finding the right answer. You are creating one. The paragraph to the rejected applicant must reflect that the decision was an act of definition, not discovery.
