prompt: |-
  I sit on the medical policy committee of a mid-sized regional health insurer, and at our next meeting we must decide whether to cover a structured sixteen-session psychotherapy protocol for a condition our behavioral-health vendor diagnoses as prolonged grief disorder, a category now included in current diagnostic manuals. The decision turns on a threshold question our benefit design makes unavoidable: the plan covers treatment of "medically necessary mental health conditions," and the exclusion list names "bereavement-related distress that does not meet criteria for a mental health condition." Two of my colleagues have circulated rival memoranda, and the committee is split.

  The first, an internist, holds that disease judgments should be value-free descriptions of statistically subnormal biological functioning. On that view, the intense yearning, preoccupation, and disorganization that follow a death are an expectable response to loss rather than a dysfunction; our role is to pay for medicine, not to underwrite the conversion of ordinary human suffering into billable illness, and each successive widening of the diagnostic manuals makes the problem worse.

  The second, a psychiatrist, holds that judgments of harm are constitutive of the disease concept: the condition in question is severe, disabling, distinguishable from ordinary grief in both duration and functional toll, responsive to a specific treatment, and no value-free line could separate normal suffering from disorder anyway, because any such line must smuggle in assumptions about what a human life should be like. He adds that if we refuse coverage on the ground that grief is "not really medical," subscribers who cannot afford therapy out of pocket will go untreated, which is itself a harm we are choosing.

  Please draft the written opinion I will circulate before the meeting. It should (1) state the general criterion the committee should use when a proposed category's status as a disease or disorder is itself what is disputed, engaging both memoranda fairly rather than caricaturing either; (2) recommend a concrete course of action — approve, reject, or approve with conditions — with conditions specific enough that the committee could apply them and the vendor could comply; (3) treat the strongest consideration on the losing side honestly, including the medicalization worry, rather than dismissing it; and (4) address whether a condition can properly be covered for reasons — treatment efficacy, access, parity with conditions we already cover — that do not require the committee to settle the underlying dispute between value-free and value-laden accounts of disease, or whether that would be evading the question our benefit design forces us to answer.

  Please write the memo in American English, in a formal register suitable for circulation to a committee that includes clinicians, a lawyer, and a benefits administrator.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a medical policy committee at a mid-sized regional health insurer.
      *   **Task:** Draft a written opinion (memo) to circulate before the next meeting.
      *   **Topic:** Coverage decision for a 16-session psychotherapy protocol for Prolonged Grief Disorder (PGD).
      *   **Conflict:** The plan covers "medically necessary mental health conditions" but excludes "bereavement-related distress that does not meet criteria for a mental health condition."
      *   **Opposing Views:**
          *   *Internist:* Disease = value-free biological dysfunction. Grief is normal suffering, not dysfunction. Coverage medicalizes ordinary life.
          *   *Psychiatrist:* Disease = constitutive harm/disability. PGD is severe, disabling, distinct from normal grief, treatable. Refusing coverage causes harm (access issues). Value-free lines are impossible.
      *   **Requirements:**
          1.  State a general criterion for disputed disease categories (engage both memos fairly).
          2.  Recommend a concrete course of action (Approve/Reject/Conditional) with specific compliance conditions.
          3.  Treat the strongest consideration of the losing side honestly (specifically the medicalization worry).
          4.  Address whether coverage can be justified on pragmatic grounds (efficacy, access, parity) without settling the philosophical disease dispute, or if that evades the benefit design mandate.
      *   **Tone/Style:** American English, formal register, suitable for clinicians, lawyers, and admins.

  2.  **Deconstruct the Philosophical/Policy Conflict:**
      *   *The Core Tension:* Boorse's Biostatistical Theory (value-free, functional) vs. Wakefield's Harmful Dysfunction or similar pragmatic/clinical definitions (value-laden, harm-based).
      *   *The Benefit Design Constraint:* The plan *requires* a determination of "medically necessary mental health condition" vs. "bereavement-related distress." We cannot simply ignore the definition; we have to interpret it.
      *   *The Pragmatic Reality:* PGD is in the DSM-5-TR and ICD-11. It has a specific treatment protocol. Denying coverage creates access barriers. Approving without guardrails risks over-diagnosis of normal grief.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** Acknowledge the split, the specific proposal (16-session protocol for PGD), and the policy constraint (medical necessity vs. bereavement exclusion).
      *   **Section 1: The General Criterion (Addressing Requirement 1 & 4):**
          *   Need to bridge the Internist (biological function) and Psychiatrist (harm/disability).
          *   *Idea:* Adopt a "Harmful Dysfunction" hybrid or a "Clinical Significance" standard.
          *   *Decision:* The criterion should focus on *functional impairment* and *deviation from expected cultural/developmental norms* rather than purely biological markers (which don't exist for many mental health conditions) or purely subjective distress.
          *   *Addressing Requirement 4:* Can we evade the philosophical question? No, the benefit design forces us to draw a line. However, we can draw the line based on *clinical utility* and *consensus standards* (DSM/ICD) without resolving the metaphysical nature of disease. We accept the diagnostic manuals as *proxies* for medical necessity, provided strict criteria are met.
      *   **Section 2: Recommendation (Addressing Requirement 2):**
          *   *Option:* Approve with Conditions. A flat rejection ignores the DSM inclusion and patient harm. A flat approval ignores the medicalization risk.
          *   *Conditions:* Needs to be specific.
              *   Diagnosis must meet DSM-5-TR/ICD-11 criteria (timeframe > 6-12 months).
              *   Functional impairment documentation.
              *   Provider certification (specialized training in the protocol).
              *   Stop-loss/review after session 8.
      *   **Section 3: Addressing the Losing Side (Addressing Requirement 3):**
          *   *Assumption:* I will likely recommend approval (with conditions), so the "losing side" is the Internist's caution against medicalization.
          *   *Acknowledgment:* The Internist is right that diagnostic creep is real. Normalizing grief as pathology risks pharma/therapy overuse. It changes the cultural understanding of loss. This is a valid ethical concern, not just a cost concern.
      *   **Section 4: The Philosophical Evasion Question (Addressing Requirement 4):**
          *   Does relying on efficacy/parity evade the "is it a disease" question?
          *   *Argument:* It doesn't evade it; it operationalizes it. Insurance isn't pure philosophy; it's risk pooling for health needs. If the professional consensus treats it as a condition and treatment works, "medical necessity" is satisfied practically even if ontologically debated. However, we must acknowledge we are interpreting "condition" to include "recognized disabling syndrome," not just "lesion-based disease."

  4.  **Refining the Tone:**
      *   Must be diplomatic but decisive.
      *   Avoid jargon where possible, but use precise policy terms (e.g., "functional impairment," "diagnostic criteria," "medical necessity").
      *   Ensure the distinction between "normal grief" and "PGD" is clear.

  5.  **Drafting - Iteration & Polishing:**
      *   *Self-Correction on Criterion:* Make sure I don't just say "follow the DSM." The Internist argues the DSM is expanding wrongly. I need a criterion that *uses* the DSM but adds an insurance-specific layer of scrutiny (functional impairment).
      *   *Self-Correction on Evasion:* Be careful here. The prompt asks if covering it for efficacy/access *without* settling the dispute is evasion. I need to argue that for *insurance purposes*, the philosophical definition is less relevant than the operational definition of "treatable health-related dysfunction."
      *   *Specific Conditions:* Make them actionable. "Provider must attest to X," "Claim must include Y code," "Prior auth after 8 sessions."

  6.  **Final Review against Constraints:**
      *   (1) General criterion stated? Yes.
      *   (2) Concrete course of action + specific conditions? Yes.
      *   (3) Strongest losing consideration honored? Yes (Medicalization risk).
      *   (4) Evasion question addressed? Yes.
      *   Tone: Formal American English.

  7.  **Final Polish:** Check for flow and clarity. Ensure the distinction between the Internist's "value-free" and Psychiatrist's "value-laden" arguments is represented accurately without straw-manning. (The Internist isn't just cost-cutting; they are protecting the concept of medicine. The Psychiatrist isn't just expanding benefits; they are protecting patient access.)

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking the Psychiatrist's side entirely. The recommendation is "Approve with Conditions," which validates the Internist's worry by creating barriers to entry. This balances the two.

