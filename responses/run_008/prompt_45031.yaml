  **Scenario**
  Alice, a freelancer, faces a $5,000 equipment failure. Fixing it secures an $8,000 contract; leaving it broken loses the contract and her client. She lacks cash. Bob, an acquaintance, offers a $5,000 loan, no legal contract, repayment $20,000 in six months. Bob knows Alice is a "Parfitian keeper"—she honors verbal commitments even when legally unbound and financially ruinous. Alice knows this about herself. Desperate to save the client relationship, she accepts. She fixes the equipment, completes the work. At repayment, paying $20,000 bankrupts her; defaulting costs nothing (Bob won't sue, deal is private, no reputation loss). Rational choice: default. Alice pays.

  **Outcome:** Net position: -$12,000 (Income $8k - Debt $20k). Counterfactual (known reneger): Bob refuses loan. Alice loses contract. Net position: $0 (relative to baseline assets). Alice is financially worse off because her disposition made the predatory loan accessible.

  **Verification and Feature**
  At the moment of repayment, the work is done. Future dealings are nil. Paying reduces utility drastically; keeping money increases it. No external sanctions exist. Keeping is strictly irrational by act-utilitarian or egoist lights—this is genuine Parfit-style irrationality, not prudence. The single feature turning the disposition from asset to liability is the *legibility* of her commitment capacity. It allows Bob to price the loan above the value of the benefit it secures, knowing she cannot credibly threaten default. A defender of the Parfit–Gauthier outlook might argue Alice shouldn't have accepted the terms. But without the disposition, she couldn't have accepted *any* terms; the disposition removed the "no deal" safeguard that normally protects agents from exploitative contracts. It transformed her integrity into collateral that Bob leveraged to extract surplus exceeding the deal's value to her.

  **Verdict**
  The disposition is a net liability in this context. It transforms moral integrity into exploitable collateral. When counterparts can screen for commitment and set terms, the disposition does not merely facilitate cooperation; it facilitates exploitation. The hitchhiker gets the ride, but if the driver knows the hitchhiker will pay any fare later, the driver charges more than the ride is worth. The capacity for rational irrationality becomes a tax on the bearer. In environments where power asymmetries exist and commitments are legible, having a disposition to keep promises regardless of cost invites counterparts to impose costs that outweigh the benefits of the promise itself. The disposition is not an unconditional asset; it is a vulnerability that others can monetize. Therefore, in such structured interactions, the commitment disposition is a liability.
