answer: |-
  The industry lacks a coherent theory of NPC moral patienthood, instead operating on an implicit principle of **Narrative-Functional Conferral** where moral weight is assigned by designer intent to specific interactions rather than by any intrinsic property of the fictional being.

  This implicit theory posits that moral status is not a property of the entity (the NPC) but a property of the *interaction script*. Under this model, the game world is divided into two ontological categories: **Narrative Objects**, whose deaths trigger state changes in the world and the player's moral meter, and **Ludic Obstacles**, whose deaths are treated as resource expenditure akin to ammo consumption. This distinction is strictly presupposed by the mechanics because the code must literally flag specific entities as "essential" or "civilian" to trigger the morality algorithms, while combatants are flagged as "hostile" to bypass them. What this practice strictly presupposes is that the designer has the authority to confer moral significance selectively; it does not presuppose *why* that significance is conferred, only that the distinction exists and is mechanically enforceable.

  This design fits comfortably with, but does not necessitate, several rival philosophical accounts, creating significant underdetermination. First, it is compatible with **Virtue Ethics**, where the meter tracks the player's habituation toward cruelty or mercy rather than harm done to the NPC; this explains why the system survives the "engineered cruelty" objection—vice must be possible for virtue to be meaningful, and the "loot for mercy" mechanic is merely a consequentialist patch to encourage virtuous habituation. Second, it fits **Contractualism**, where only NPCs with the mechanical capacity to "complain" (via dialogue changes, bounty systems, or faction reputation) hold standing, rendering unresponsive combatants outside the moral community. Third, it aligns with **Narrative Essentialism**, where moral weight correlates with narrative density; an NPC with a name, quest, and voice matters more than a generic guard because they occupy more semantic space in the fiction. The mechanics are underdetermined because the same karma system works whether you believe you are protecting souls, optimizing narrative outcomes, or simply role-playing a persona; the code does not distinguish between harming a being with rights and violating a scriptural rule.

  The coherence of this system collapses if one insists that moral patienthood must be intrinsic to the character rather than conferred by the frame. If the polygons and dialogue trees constitute a "person" in any morally relevant sense, the inconsistency is indefensible hypocrisy. However, the system remains coherent if viewed strictly as a **Ludic Virtue Simulator**: it is not simulating a moral universe, but simulating the *experience* of making moral choices within a constrained environment. The "radical unevenness" is not a bug but a feature required to balance ethical reflection with engagement; a game that treated every death equally would cease to be an action game.

  To build a game on a different presupposition would require fundamental structural changes. A game presupposing **Universal Moral Patienthood** (every NPC equals moral weight) would need to abandon respawning, implement permanent consequences for every kill (economic collapse, endless vendettas), and likely remove combat entirely or make it lethally risky for the player, shifting the genre toward survival simulation or pure stealth (e.g., *Rain World* or a hardcore *Dwarf Fortress* morality mod). Conversely, a game presupposing **Moral Nihilism regarding Fictions** (abandoning tracking entirely) would remove karma meters, honor systems, and narrative branching based on violence, treating all NPCs as instrumental obstacles; this is the standard for competitive shooters (*Counter-Strike*) or power fantasies (*Doom*), where the only moral framework is the player's own extraludic conscience. The industry has not stumbled upon a worked-out philosophical position but rather a standardized compromise that allows players to feel moral without bearing the burden of a consistent moral universe.
