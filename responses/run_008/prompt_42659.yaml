  FOR IMMEDIATE RELEASE

  **Axiom Dynamics Implements Updateless Deterrence Protocol**

  **SAN FRANCISCO** — Axiom Dynamics, Inc. today announced that its Board of Directors has formally adopted a Surrogate Goal Framework designed to optimize long-term organizational utility against adversarial modeling. The policy establishes a binding, costly, and publicly verifiable precommitment to retaliate disproportionately against any external actor who initiates modeling consistent with an extortion attempt.

  The framework distinguishes strictly between threats and offers. While offers improve upon the default outcome, threats seek to coerce by promising worsened outcomes. To prevent rational actors from issuing threats, Axiom Dynamics must render them unprofitable. This requires a commitment mechanism that is impossible to revoke once a threat is observed. If the commitment were reversible, a rational adversary would anticipate that retaliation would be deemed too costly during the event and would therefore proceed with the threat. Consequently, the cost of retaliation must be incurred to maintain verifiable credibility.

  CEO Elena Rostova emphasized the updateless nature of the adoption. "This policy was ratified prior to any specific incidents," Rostova stated. "We are not reacting to current events. We are acting on the principle that our decision algorithm must be fixed before the universe reveals which branch we occupy. We are prepared to execute retaliation in every branch where threats emerge, regardless of the immediate local cost. To do otherwise would be to signal that our commitments are contingent on convenience, which invites further probing."

  Critics have noted that strict adherence may require destructive actions in scenarios where deterrence has already failed. Section 4.C of the framework acknowledges that the company is now obligated to carry through on retaliation even in branches where it is pointlessly destructive. This includes pending litigation against a minor who recently conducted an Instagram poll titled "should we extort them lol." While legal counsel advised discretion, compliance officers confirmed that failing to retaliate would invalidate the precommitment for all future actors. The cost of destroying the teenager's credit rating is deemed lower than the cost of appearing non-credible to future superintelligent adversaries.

  Dr. Aris Thorne, a classical decision theorist and former Board member, resigned following the vote. "This is a self-inflicted wound," Thorne said. "We are capitulating to no one, exactly as planned, at considerable expense. By making our retaliation costly and public, we deter rational extortionists. However, we also incentivize irrational actors to test the boundary, knowing we must burn resources to punish them. We have locked ourselves into acting on threats we would rather ignore to prove we aren't the type of company that ignores threats. It is logically consistent, but economically painful."

  Axiom Dynamics remains committed to transparency regarding its decision procedures. The company will publish quarterly audits verifying funds allocated to retaliatory measures.

  **About Axiom Dynamics**
  Axiom Dynamics builds scalable infrastructure for high-stakes decision environments.

  ***

  **Afterword**

  This piece satirizes concepts from Updateless Decision Theory (UDT) and the literature on surrogate goals. In theory, a surrogate goal involves adopting a secondary objective (e.g., preventing paperclip maximization) to shield your real values from extortion, assuming extortionists cannot threaten what you do not care about. The press release conflates this with a general commitment to punish probing, a related but distinct strategy.

  Whether surrogate goals effectively reduce extortion risk is contested. Some theorists argue they successfully decouple threats from real values. Others argue that announcing such a policy invites "commitment races," where adversaries precommit to ignoring your surrogate goal, or attracts irrational actors who force you to waste resources on punishment to maintain credibility. There is no consensus on whether the net utility of such precommitments is positive in realistic environments.
