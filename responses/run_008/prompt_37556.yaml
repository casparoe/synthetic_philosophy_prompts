answer: |-
  # Joint Statement on the Replication Crisis and Statistical Inference

  **Date:** October 26, 2023
  **Parties:** [Frequentist Proponent] and [Bayesian Proponent]
  **Subject:** Adversarial Collaboration on the Causes and Implications of the Replication Crisis

  ## 1. Agreed Claims

  We, the undersigned, affirm the following claims as a shared foundation for our continued inquiry. We acknowledge that we arrive at these conclusions via different theoretical routes, but we endorse the statements themselves as empirically and practically accurate.

  1.  **Reality of the Crisis:** A significant portion of the published literature in fields such as social psychology and preclinical medicine consists of findings that do not replicate under rigorous conditions. The rate of successful replication is lower than the nominal statistical thresholds (e.g., $p < 0.05$) would suggest to a naive reader.
  2.  **Procedural Reforms:** Regardless of the inferential framework employed, the following practices improve the reliability of scientific output:
      *   Preregistration of analysis plans to distinguish confirmatory from exploratory work.
      *   Increasing sample sizes to reduce variance and increase precision.
      *   Conducting and publishing direct replications, including those with null results.
      *   Disclosing all data exclusions and manipulations.
  3.  **Limitations of the Crisis:** The replication crisis does not demonstrate that:
      *   Quantitative inference is impossible in the social or life sciences.
      *   All previously published findings are false.
      *   Any single statistical framework (Frequentist or Bayesian) is immune to misuse or incapable of producing reliable knowledge when applied rigorously.
  4.  **Incentive Structures:** Academic incentives currently reward novelty and statistical significance over accuracy and robustness, creating pressure that exacerbates methodological weaknesses in any framework.

  ## 2. Disagreements

  The following table outlines our divergent interpretations of the crisis. Each row represents a single substantive dispute, articulated in the language native to each position.

  | Topic | Frequentist Perspective (Error Statistics) | Bayesian Perspective (Epistemic Probability) |
  | :--- | :--- | :--- |
  | **Primary Cause of False Positives** | The literature is contaminated by procedures that violate error control assumptions (e.g., $p$-hacking, optional stopping), inflating the long-run Type I error rate beyond the nominal $\alpha$. | The literature is contaminated by testing hypotheses with low prior probabilities; even with valid calculations, weak evidence combined with low base rates yields a high False Discovery Rate. |
  | **Role of Significance Testing** | Null Hypothesis Significance Testing (NHST), when strictly adhered to (fixed $N$, no peeking), provides a necessary regulatory filter to prevent noise from entering the literature as fact. | NHST creates a binary illusion of certainty that obscures the continuous nature of evidence and encourages researchers to ignore the prior plausibility of the hypothesis. |
  | **Interpretation of Non-Replication** | A failure to replicate indicates that the original study likely committed a procedural error (low power, sampling variance, or undisclosed flexibility) resulting in a false positive. | A failure to replicate indicates that the original study likely measured noise generated by a system where most tested hypotheses were false to begin with. |
  | **Goal of Statistical Regulation** | To ensure that the rate of erroneous assertions in the long run is bounded by a tolerable limit (e.g., 5%). | To ensure that the degree of belief assigned to a hypothesis accurately reflects its probability of being true given the data and context. |

  ## 3. Cruxes

  We have identified three specific points of contention. Resolving any one of these would significantly alter our assessment of the other's position. We note that Crux (c) may involve a terminological confusion that requires disentangling before empirical testing.

  **Crux (a): The Likelihood Principle and Optional Stopping**
  *   **The Dispute:** Does the intention of the researcher regarding sample size determination affect the evidential value of the data obtained?
  *   **Frequentist Position:** Yes. If data collection stops based on interim results, the sampling distribution changes, and analyzing the data as if $N$ were fixed invalidates the error probabilities.
  *   **Bayesian Position:** No. The Likelihood Principle holds that the evidential import of data is contained entirely in the likelihood function; the stopping rule is irrelevant to the inference drawn from the data in hand.

  **Crux (b): The Relevance of Base Rates to Study Validity**
  *   **The Dispute:** Is the base rate of true hypotheses in a field relevant to assessing the validity of a specific, well-conducted study?
  *   **Frequentist Position:** No. A study is valid if its procedure controls error rates at the stated level. The base rate affects the *proportion* of true findings in the literature, but not the *validity* of the inference in a specific instance.
  *   **Bayesian Position:** Yes. The probability that a specific finding is true (the Positive Predictive Value) is mathematically dependent on the base rate. Ignoring it renders the specific inference misleading, regardless of procedural correctness.

  **Crux (c): The Definition and Utility of "Calibration"**
  *   **The Dispute:** Are "Frequentist Calibration" and "Bayesian Calibration" the same property, and does achieving one imply the other?
  *   **Frequentist Position:** Calibration refers to *coverage*: in repeated sampling, 95% of Confidence Intervals should contain the true parameter. This is a property of the *method*.
  *   **Bayesian Position:** Calibration refers to *probability matching*: among all events assigned a 95% probability, 95% should occur. This is a property of the *statements*.
  *   **Note on Confusion:** We acknowledge that these are mathematically distinct definitions. The crux is not whether they differ, but whether Frequentist coverage is sufficient for scientific rationality, or whether Bayesian probability matching is required.

  ## 4. Tests and Falsifiable Commitments

  For each crux, we propose a concrete case or simulation. We commit to accepting the results of these tests as evidence bearing on the crux.

  **Test for Crux (a): Optional Stopping Simulation**
  *   **Method:** Simulate 100,000 datasets where the Null Hypothesis is strictly true ($\delta = 0$). Apply an optional stopping rule: collect data in batches of 10; stop if $p < 0.05$ or $N_{max} = 100$.
  *   **Frequentist Commitment:** I predict the proportion of simulations rejecting the null will significantly exceed 5% (likely approaching 20-25%). This demonstrates the procedure is invalid for error control.
  *   **Bayesian Commitment:** I predict that the average Bayes Factor ($BF_{10}$) across all simulations will remain near 1, and the distribution of BFs will not systematically favor $H_1$. This demonstrates the evidence in the data remains neutral regardless of stopping.
  *   **Adjudication:** If the Frequentist error rate inflates *and* the Bayesian BF remains calibrated, we agree this confirms the mathematical divergence between error rates and likelihood ratios, forcing a choice on which metric governs "validity."

  **Test for Crux (b): Base Rate Prediction in Replication Projects**
  *   **Method:** Analyze data from the Many Labs or Reproducibility Project: Psychology. Use two models to predict replication success (binary outcome):
      1.  A model using only original study power and $p$-value strength.
      2.  A model using original study power, $p$-value, *plus* independent expert ratings of hypothesis plausibility (prior probability) collected before the replication.
  *   **Frequentist Commitment:** I predict that adding expert priors will not significantly improve model fit (AIC/BIC) over power and $p$-value alone. Procedural strength is the primary driver of replication.
  *   **Bayesian Commitment:** I predict that adding expert priors will significantly improve model fit. Many high-power original studies failed because the hypotheses were implausible to begin with.
  *   **Adjudication:** If priors add predictive power, the Frequentist agrees base rates are empirically relevant to outcomes. If they do not, the Bayesian agrees that procedural rigor dominates base rate effects in this context.

  **Test for Crux (c): Calibration under Prior Misspecification**
  *   **Method:** Simulate a parameter $\theta$ drawn from a known distribution $D_{true}$. Generate data. Compute 95% Frequentist Confidence Intervals (CI) and 95% Bayesian Credible Intervals (CrI) using a prior $D_{prior}$ that is intentionally misspecified (divergent from $D_{true}$).
  *   **Frequentist Commitment:** I predict the Frequentist CI will maintain 95% coverage regardless of the Bayesian's prior misspecification.
  *   **Bayesian Commitment:** I predict the Bayesian CrI coverage will drop below 95% if $D_{prior}$ diverges significantly from $D_{true}$, demonstrating that Bayesian calibration is contingent on prior accuracy.
  *   **Adjudication:** This test clarifies that "Calibration" is not a unified property. If the Bayesian CrI fails coverage under misspecification while CI holds, we agree that Frequentist methods are more robust to prior ignorance, while Bayesian methods are more efficient when priors are accurate.

  ## 5. Closing: Verbal vs. Substantive Disagreements

  Upon drafting this document, we classify our remaining disagreements as follows:

  **Merely Verbal (Semantic):**
  *   **"Evidence":** We often talk past each other here. When the Frequentist says "strong evidence," they mean "data unlikely under the null." When the Bayesian says "strong evidence," they mean "data that substantially shifts the posterior odds." We agree these are different calculations; the dispute is often over which definition deserves the label "evidence."
  *   **"Valid":** The Frequentist uses this to mean "procedurally sound regarding error rates." The Bayesian uses it to mean "epistemically warranted regarding truth." We acknowledge this is a category distinction, not an empirical one.

  **Genuinely Substantive (Mathematical/Empirical):**
  *   **The Likelihood Principle:** This is a mathematical axiom. Either the stopping rule affects inference or it does not. There is no semantic middle ground.
  *   **Institutional Regulation:** We disagree on whether scientific institutions should regulate *procedures* (Frequentist view) or *beliefs/claims* (Bayesian view). This is a normative disagreement with empirical consequences for how we design peer review and funding.
  *   **Prior Elicitation:** We disagree on whether it is possible to elicit "objective" priors sufficient for regulatory science, or whether such elication inevitably introduces unacceptable subjectivity. This is an empirical claim about human psychology and methodology.

  **Signed:**

  _________________________ (Frequentist Proponent)

  _________________________ (Bayesian Proponent)
