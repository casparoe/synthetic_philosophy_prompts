answer: |-
  It is a pleasure to hear from you, and I want to start by saying that your editor is half-right and half-wrong, but not for the reasons she thinks, and you are sensing the friction correctly because this is not actually a debate about history so much as it is a debate about what we demand from a story. When you dig into that standoff between the contingency crowd and the structuralists, you are not finding a settled answer because it is not a factual disagreement that better evidence could resolve. If it were merely factual, we would have solved it by now with enough archives and data models. Instead, what you are looking at is a methodological divergence that masquerades as an ontological one. The structuralists are not claiming that the universe is determined in a physics sense; they are claiming that for the purposes of historical explanation, deep currents matter more than surface noise. They are looking for the conditions that made a war possible, the dry tinder, the economic pressures, the alliance systems. The contingency historians are looking for the spark. Both are describing the same fire, but one is explaining the combustion chemistry and the other is explaining the match strike. When they talk past each other, it is because one side is answering the question why was this possible and the other is answering the question why did this happen now.

  This leads directly to your suspicion about narrative form, which I think is the most insightful part of your query. You are correct that this is secretly a fight about aesthetics. The structuralist view aligns with a kind of sociological tragedy where individuals are swept up by forces larger than themselves, which feels modern and serious and grimly realistic. The contingency view aligns with the thriller or the classical tragedy where agency matters, where a single choice or a slipped gear can doom a kingdom. When your editor says real history does not work that way, she is actually saying that the structuralist narrative feels more intellectually robust to her, while your instinct for the jammed lock feels like plot contrivance. But here is the thing about fiction that history cannot afford: fiction requires closure and meaning, whereas history often has to settle for chaos and incompleteness. In a novel, a cascade of accidents is not cheap if those accidents resonate with the themes of the book. If the jammed lock matters because the character is already anxious about control, or if the misread timetable matters because the character is habitually distracted by grief, then the accident is not a mechanical plot device but an extension of character. The editor is worried about verisimilitude, but she is measuring it against a specific school of historical thought rather than against the internal logic of your story.

  On your sub-question about counterfactuals, the silence you are detecting is indeed an occupational habit rather than a principled refusal based on the unknowability of the past. Historians are trained to deal with evidence of what occurred, not evidence of what did not occur. To speculate on what might have happened if the driver had turned left instead of right is to enter the realm of fiction, which is your job, not theirs. When they say it is unknowable, they are often putting up a guardrail to prevent their discipline from dissolving into fantasy writing. It is a methodological boundary, not a metaphysical claim. They are declining to assess small accidents not because they believe the accidents lacked power, but because assessing them requires a different toolkit than the one they are paid to wield. There is a quiet consensus among many serious historians that while small accidents do change outcomes, the range of possible outcomes is often constrained by those deep structures you mentioned. So the driver might not have missed the turn, but if he had, the war might have been delayed by a month rather than avoided entirely. The accident changes the timing and the texture, but perhaps not the ultimate destination. But even that is a guess, and historians hate guessing on the record.

  So does this diagnosis mean you should change how you plot the book. I would argue that you should not change the mechanics of your plot based on this historical debate, but you should change how you frame those mechanics for the reader. The risk in a for-want-of-a-nail structure is not that it is historically inaccurate, but that it feels arbitrary to the reader. If the jammed lock is just a jammed lock, it feels like the author manipulating the puppets. If the jammed lock is the culmination of a neglected maintenance budget, or a character rushing because of a prior mistake, then it feels earned. Your editor's concern is likely that the accidents feel external to the characters, like acts of God, rather than emergent properties of the world you have built. You are entitled to ignore the historical debate because you are not writing history, you are writing a novel, and novels operate on emotional causality rather than strict historical causality. Readers will accept a chain of small accidents if those accidents feel thematic. If your book is about the fragility of order, then a jammed lock is not a cheat, it is the point.

  Ultimately, the disagreement you are diagnosing is about where we locate meaning. The structuralists locate meaning in the slow grind of institutions, while the contingency writers locate meaning in the singular moment of choice or chance. As a novelist, you get to choose where the meaning lives, and for a thriller or a drama driven by plot, the singular moment is often where the reader lives too. Do not let the historical debate paralyze you, but do listen to the craft concern underneath it. Make sure your nails are rusty for a reason. Make sure the timetable is misread by someone who is tired or distracted or hopeful. Anchor the accidents in the human element so that when the cascade begins, it feels like the characters are falling down a staircase they helped build, rather than being pushed by an invisible hand. That is how you satisfy the editor without sacrificing the plot. You validate the accident by making it inevitable for the character, even if it was not inevitable for history.
