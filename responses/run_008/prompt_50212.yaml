      *   *Vulnerability 2 (Historians):* Is the historical record actually consistent with "no belief change"? Did people *not* argue against slavery before it became unhonourable? Is "overnight" accurate?
      *   *Vulnerability 3 (Supervisor):* Is this just reducing morality to strategy? Are you explaining away agency?
      *   *Vulnerability 4 (General/Philosophical):* If beliefs don't change, is it really a *moral* revolution? Or just behavioural compliance?

  3.  **Drafting the Content - Section by Section:**

      *   **Tone:** Professional, academic, slightly anxious but prepared, British English (e.g., "programme," "centre," "whilst," "sensible," "quid pro quo").
      *   **Structure:**
          1.  Header (Workshop Prep).
