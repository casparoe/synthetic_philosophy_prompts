answer: |-
  **WORKSHOP PREP: Q&A STRATEGY SHEET**
  **Project:** Honour as Coordination (Appiah + Williams + Game Theory)
  **Venue:** UK Political Theory Workshop
  **Date:** Next Month

  ***

  ### 1. The "Category Error" Objection (Highest Damage)
  **Who:** Your Supervisor (and any philosophers wary of reductionism).
  **The Phrasing:** "You're conflating the *causes* of compliance with the *grounds* of obligation. If the mechanism is purely a coordination flip—a change in strategic calculation rather than moral belief—haven't you explained away the 'moral' in 'moral revolution'? You're describing a change in fashion, not morality. Where is the normativity?"

  **The Reply:** "I take the point that strategy isn't justification. However, following Williams, I'm suggesting that honour *is* a distinct normative system, not merely instrumental rationality. The coordination flip explains the *sociological transition* between normative regimes. It doesn't deny the new regime has normative force; it explains how we cross the chasm between them when reasons alone fail to bridge the gap."

  **Where it's Soft:** You risk conceding that the *result* is moral but the *process* is amoral. If they press on whether a revolution driven by social anxiety counts as 'progress', you might look cynical.
  **Backup:** "It's a genealogical account, not a justificatory one. I'm explaining the engine, not endorsing the fuel."

  ### 2. The "Empty Progress" Objection (High Damage)
  **Who:** The Deliberative Democrats / Habermas-adjacent.
  **The Phrasing:** "If normative change doesn't track the force of the better argument, how do we distinguish a moral revolution from a tyranny of the majority? If the salient group simply decides to coordinate on a new exclusion, your model labels that a 'revolution' just the same. Without public reasoning, what guarantees directionality?"

  **The Reply:** "Appiah's account relies on the internal logic of honour codes, which require a claim to *respectability*, not just power. A coordination flip based purely on brute force doesn't generate the shame dynamics essential to the honour code. Furthermore, argument often plays a crucial *post-hoc* role in stabilising the new equilibrium, even if it didn't trigger the flip."

  **Where it's Soft:** Admitting argument is merely "stabilising" or "post-hoc" will frustrate them. They want argument to be constitutive of the change.
  **Backup:** "I'm not saying reasons are irrelevant, only that they are often the caboose, not the engine, in these specific historical instances."

  ### 3. The "Historical Record" Objection (Medium-High Damage)
  **Who:** The Two Economic Historians.
  **The Phrasing:** "Your timeline is too neat. Regarding the Atlantic slave trade: abolitionists were making moral arguments for decades before the honour shift occurred. To say beliefs didn't change 'first, or at all' ignores the slow burn of Quaker activism and parliamentary debate. Are you cherry-picking the tipping point and ignoring the fuse?"

  **The Reply:** "I concede the fuse was lit by argument. My claim is specifically about the *explosion*—the rapid behavioural shift. The historical data shows a lag between the availability of moral arguments and the widespread behavioural change. The coordination model explains that lag and the subsequent speed of the collapse, which deliberative models struggle to account for."

  **Where it's Soft:** "Necessary but insufficient" is a cliché defence. If they have specific data showing belief change correlated tightly with the behavioural shift, your "no belief change" claim looks empirically false.
  **Backup:** Be ready to concede that *some* belief change likely occurred, but maintain it wasn't the *primary driver* of the tipping point.

  ### 4. The "Williams Consistency" Objection (Medium Damage)
  **Who:** A sharp Political Theorist who knows Williams.
  **The Phrasing:** "Williams was sceptical of 'theory' capturing ethical life. By gamifying honour into a coordination equilibrium, aren't you doing exactly what Williams warned against? You're turning a thick ethical concept into a thin rational choice model."

  **The Reply:** "That's a fair reading of Williams generally. However, I'm using the coordination model descriptively to capture the *social ontology* of honour, which is inherently relational and comparative. It's not reducing the experience of shame to utility; it's modelling the social structure that makes shame possible."

  **Where it's Soft:** This is a hermeneutic stretch. If they know Williams better than you, they will spot the appropriation.
  **Backup:** Pivot back to Appiah. "I am prioritising Appiah's sociological reading of Williams over the purely meta-ethical one."

  ***

  ### The Question I'm Hoping Nobody Asks
  **The Phrasing:** "If everyone privately retains the old belief (e.g., that slavery is economically necessary or racially justified) but publicly shuns it to save face, haven't you just described a society of hypocrites? Is a revolution based on hypocrisy morally desirable, or merely convenient?"

  **Why it's Deadly:** It attacks the normative conclusion of your paper. If the outcome is mass hypocrisy, the "progress" claim collapses. It forces you to defend hypocrisy as a virtue, which is a hard sell in a room full of deliberative democrats who value sincerity and authenticity.

  **Emergency Reply:** "I would argue that behavioural compliance is a necessary precondition for belief change, not its opposite. We walk ourselves into new moral truths. The hypocrisy is the bridge, not the destination."

  ***

  ### General Notes for the Room
  *   **Tone:** Keep it modest. In the UK, claiming you have "solved" the problem will invite more aggression than admitting the model has "limited scope."
  *   **Vocabulary:** Use "behaviour," "programme," "centre," "defence." Avoid "guess," "folks," or overly enthusiastic Americanisms.
  *   **The Supervisor:** If they jump in early, acknowledge their point immediately ("As my supervisor has rightly pressed me on..."). It shows you've done the work and disarms their aggression.
  *   **The Historians:** Do not bluff on data. If you don't know a date or a specific act of Parliament, say "I'd need to check the specific legislation, but the broader trend suggests..."

  **Good luck. Keep your head up—that's the whole point, isn't it?**
