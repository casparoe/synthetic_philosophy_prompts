  In a high-stakes medical trial, a terminal patient is offered a quantum-resonant therapy that has a 50% chance of curing their disease and granting enhanced cognition, and a 50% chance of instant, painless death. Under the quantum immortality hypothesis, the subject expects to subjectively survive in the curing branch regardless of the odds, experiencing the enhancement with certainty. However, rational decision theory based on anthropic measure argues that taking the gamble reduces the total measure of the subject's future experiences by half compared to refusing the trial and continuing life with standard measure density, making refusal the utility-maximizing choice despite guaranteed subjective survival.

  **Walkthrough**
  The quantum immortalist concludes **Accept** because they reason from the first-person perspective: since death is unobservable, the only experienced outcome is survival with enhancement, making the risk illusory. Expected utility counted over all branches (weighted by measure) says **Refuse** because the utility of the surviving branch is multiplied by 0.5 measure, whereas refusing preserves 1.0 measure of standard life, and the loss of measure outweighs the enhancement benefit. The load-bearing feature is the **linearity of value with quantum measure**, asserting that being a "half-measure" survivor is objectively worse than being a "full-measure" survivor, even if subjectively indistinguishable.

  **Strongest Rebuttal**
  A bullet-biting immortalist argues that subjective anticipation is binary—you either exist or you don't—and measure is merely an external counting tool for observers outside the branch; since the survivor feels fully real, rational choice should track existence probability (which is 100% for survival) rather than branch weight.

  **Without the Feature**
  If value does not track measure, the expected utility verdict flips to **Accept**, aligning with quantum immortality, because the utility of survival is no longer discounted by the branching ratio, rendering the death branches irrelevant to the agent's decision calculus.

