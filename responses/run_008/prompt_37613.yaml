answer: |-
  # Workshop Design: The Horizon Protocol

  **Goal:** To move participants from intellectual assent to *visceral tension* regarding Evidential Cooperation in Large Worlds (ECL).
  **Time:** 90 Minutes
  **Participants:** 14 (EA-adjacent, rationality-literate)
  **Materials:** Printed Questionnaires (14), Decision Slips (14), Envelopes (14), Raffle Tickets (200), One "Prize" (e.g., a $50 book voucher or a donation in the winner's name), Whiteboard.

  ---

  ## Part 1: The Mechanics

  ### 1. The Payoff Structure (The "Twin Dilemma")
  To simulate ECL without cash exchange, we use **Raffle Tickets**.
  *   **Endowment:** Every participant starts with **10 Tickets**.
  *   **The Choice:** You must choose to either **TRANSFER** or **RETAIN**.
      *   **If you TRANSFER:** You lose 5 Tickets. Your *Match* gains 15 Tickets.
      *   **If you RETAIN:** You keep your 10 Tickets. Your *Match* gains 0 Tickets.
  *   **The Prize:** At the end, all tickets in the room are pooled. One ticket is drawn at random. The holder wins the Prize.
  *   **The Tension:**
      *   *Causal View:* Transferring costs you 5 tickets (50% of your voting power) for a benefit you never receive. Defection (Retain) is dominant.
      *   *Evidential View:* If your Match is sufficiently similar to you, they will make the same choice. If you both Transfer, you end up with 15 tickets (Net +5). If you both Retain, you end up with 10 (Net 0). Cooperation is rational *if* correlation is high enough.

  ### 2. The Pairing Algorithm (The "Large World" Simulation)
  *   **The Claim:** You will be paired with the participant whose questionnaire answers have the smallest **Hamming Distance** (fewest differences) from yours.
  *   **The Reality:** You (the facilitator) will actually pair them based on the questionnaire, *but* you will introduce **Noise**.
      *   *Secret Instruction:* Pair the top 7 most similar matches correctly. For the bottom 7, pair them randomly.
      *   *Why:* This simulates the *uncertainty* of the real world. Sometimes you find a twin; sometimes you find a stranger. You cannot know which group you are in.
  *   **Secrecy:** Participants do not know who their match is. They do not know the noise ratio. They only know the *claim* of similarity-based pairing.

  ### 3. The Questionnaire (The "Inference Engine")
  *   **Format:** 10 Binary Questions (A/B).
  *   **Content:** Mix of factual beliefs and decision-theoretic intuitions.
      1.  *Newcomb's Problem:* One-box / Two-box
      2.  *Sleeping Beauty:* Halfer / Thirder
      3.  *Moral Realism:* Realist / Anti-realist
      4.  *Risk Neutrality:* Neutral / Averse
      5.  *AI Alignment:* Optimistic / Pessimistic
      6.  *Voting:* Vote / Don't Vote (in large elections)
      7.  *Charity:* Maximizing / Satisficing
      8.  *Time Preference:* Low / High
      9.  *Simulation Hypothesis:* Likely / Unlikely
      10. *This Game:* Cooperate / Defect (Pre-commitment check)
  *   **Purpose:** This forces them to signal their "decision type." It makes the correlation feel earned, not magical.

  ---

  ## Part 2: Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Framing** | Welcome. No theory talk. Explain the Raffle and the Tickets. Emphasize: "Your goal is to maximize your own tickets. There is no group goal." |
  | **10-25** | **Calibration** | Distribute Questionnaires. 10 minutes to complete. Collect them. **Theater:** Spend 5 minutes visibly sorting them, muttering about "distances" and "clusters." |
  | **25-35** | **The Black Box** | Explain the Pairing Claim ("I am pairing you with your cognitive twin"). Hand out Decision Slips. **Crucial:** "You cannot communicate. You cannot signal. You have 5 minutes to decide." |
  | **35-40** | **Decision** | Participants write TRANSFER or RETAIN. Fold slips. Place in Envelopes. Collect Envelopes. |
  | **40-50** | **Calculation** | **Theater:** You take the envelopes away (or pretend to process them). While you "calculate," the group sits in silence. This creates the *acausal* tension. |
  | **50-60** | **Reveal** | Announce the results. "X people Transferred. Y people Retained." Distribute final ticket counts. Draw the Raffle Winner. |
  | **60-90** | **Debrief** | The core learning. Map mechanics to theory. Discuss failure modes. Distinguish settled vs. contested claims. |

  ---

  ## Part 3: The Debrief Script (Mapping Mechanics to Theory)

  *Do not start with "Here is what ECL is." Start with "Here is what you just felt."*

  ### 1. Mapping the Mechanics
  *   **The Questionnaire = Inference under Uncertainty.**
      *   *Ask:* "Did you answer honestly, or did you try to signal 'cooperator'?"
      *   *Point:* In the real world, you don't have a questionnaire. You have to infer similarity from blog posts, code, or behavior. The game makes this easy; reality makes this the hardest part.
  *   **The Silence = The Cosmological Horizon.**
      *   *Point:* You could not negotiate. You could not promise. In ECL, no signal can cross the horizon (or between Everett branches). The only channel is logical correlation.
  *   **The Pairing Claim = The Reference Class.**
      *   *Point:* I claimed I paired by similarity. Some of you were (mostly). Some weren't (the noise). In the real world, *you* must define the reference class. Are you similar enough to a human in 1000 years? To an AI?
  *   **The Payoff = Weak Value Alignment.**
      *   *Point:* Your match's gain was valuable to *you* only because you both wanted the Raffle Prize. In ECL, you cooperate with aliens/AIs not because they love you, but because they value *their* outcomes, which correlate with *your* outcomes via the trade.

  ### 2. Predictable Failure Modes (The "Post-Mortem")
  *   **Signaling:** Expect 2-3 participants to admit they lied on the questionnaire to appear "cooperative."
      *   *Lesson:* If everyone signals, the questionnaire loses predictive power. In the real world, cheap talk destroys correlation.
  *   **The "Facilitator Distrust":** Some may have assumed you paired randomly regardless of answers.
      *   *Lesson:* This mirrors the skepticism about whether the universe actually *contains* twins. If P(Twin) is too low, CDT wins.
  *   **The "Principle Defector":** Someone who Retained just to prove CDT is correct.
      *   *Lesson:* Acausal trade is fragile. It only takes a few defectors to lower the expected value for cooperators.

  ### 3. Limitations of the Simulation (Frank Discussion)
  *   **The Oracle Problem:** In this game, *I* (the facilitator) guaranteed the correlation existed. In the real world, there is no facilitator. You must bet on the structure of reality itself. That is a much heavier lift.
  *   **The Binary Choice:** Real ECL is continuous. You can cooperate a little, or a lot. The game forces a cliff-edge.
  *   **The Stakes:** You played for a book voucher. ECL proponents argue for the fate of the universe. High stakes might increase correlation (more careful reasoning) or decrease it (more panic).

  ---

  ## Part 4: Theory Status Report (Settled vs. Contested)

  *Use the whiteboard. Draw a line down the middle.*

  ### **Settled (Common Ground)**
  1.  **Logical Correlation is Real:** If two agents run the exact same algorithm on the same data, they output the same result. This is math, not magic.
  2.  **Evidence is Not Causation:** My choice does not *cause* the twin's choice. My choice is *evidence* of the twin's choice.
  3.  **CDT Prescribes Defection:** Causal Decision Theory (CDT) strictly says: "I cannot change their output now. I should keep my tickets." Anyone cooperating is rejecting pure CDT.

  ### **Contested (The Live Disagreement)**
  1.  **The Decision Theory:**
      *   *Optimistic:* FDT (Functional Decision Theory) or EDT (Evidential Decision Theory) prescribes Cooperation.
      *   *Skeptical:* Many philosophers argue EDT leads to "spurious correlations" (e.g., praying for rain because rain correlates with prayer). Is this *that* kind of error?
  2.  **The Similarity Threshold:**
      *   *Optimistic:* "Close enough" is easy to find in a large world.
      *   *Skeptical:* Chaos theory and initial condition sensitivity might mean exact twins are vanishingly rare. If similarity is 90%, does the trade hold? (Answer: Depends on the payoff matrix).
  3.  **The "Who":**
      *   *Optimistic:* I can trade with AIs, aliens, or future humans.
      *   *Skeptical:* Value alignment is likely too low. An AI might value paperclips. My cooperation helps it make paperclips; its cooperation helps me make... what? If values don't overlap, trade fails.
  4.  **The Payoff:**
      *   *Optimistic:* The "Large World" implies infinite leverage. Small sacrifices here buy huge gains elsewhere.
      *   *Skeptical:* The "noise" of non-correlated agents might drown out the signal. You might be sacrificing real resources for phantom twins.

  ---

  ## Part 5: Facilitator Notes & Troubleshooting

  **1. Handling the "It's Just a Prisoner's Dilemma" Objection**
  *   *Participant:* "This is just an anonymous PD. Why call it ECL?"
  *   *Response:* "In a standard PD, you assume your choice is independent of the other. In this game, I *told* you your partner was selected for similarity. That changes the probability calculus. ECL is just a PD where P(They Cooperate | I Cooperate) is significantly > P(They Cooperate)."

  **2. Handling the "Facilitator Fiat" Objection**
  *   *Participant:* "I don't believe you actually paired us by similarity."
  *   *Response:* "Good. That skepticism is exactly the point. In the real world, you don't have a facilitator. You have to decide if the *physics* of the multiverse pairs you with twins. If you don't believe the pairing, you shouldn't cooperate. The game didn't fail; your prior on the universe failed."

  **3. Managing the "Signaling" Contamination**
  *   If people discuss the questionnaire answers *before* the decision phase, the game is ruined.
  *   *Rule:* "Once you hand in the questionnaire, you are in quarantine. No eye contact, no talking, no gestures."

  **4. The "Noise" Reveal**
  *   In the debrief, reveal that you introduced noise (random pairing for half the group).
  *   *Ask:* "Does knowing that some pairings were random make you regret cooperating?"
  *   *Point:* This illustrates the risk. In the real world, you don't know the noise ratio. You have to act on the *expectation*.

  ## Summary Checklist for Facilitator
  - [ ] **Prize:** Secure the book voucher/donation promise beforehand.
  - [ ] **Tickets:** Prepare 200 physical tickets (paper slips).
  - [ ] **Questionnaires:** Print 14 copies.
  - [ ] **Envelopes:** 14 opaque envelopes.
  - [ ] **Timer:** Strictly enforce the silence during the Decision Phase.
  - [ ] **Honesty:** Be prepared to admit the limitations of the simulation during the debrief. Do not sell ECL as proven; sell it as *plausible and high-stakes*.

  ---

  ### Final Note on the "Feeling"
  The goal of this workshop is not to convince them ECL is true. The goal is to make them feel the **vertigo** of it.
  When they are holding the Decision Slip, knowing they want the tickets, knowing they can't talk, but knowing their "twin" is holding the same slip... that moment of hesitation is the lesson. If they feel the pull to **TRANSFER** despite the causal cost, they have felt the force of the argument. If they **RETAIN** but feel a nagging doubt that they left utility on the table, they have also learned. Both outcomes are success.
