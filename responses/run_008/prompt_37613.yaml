      *If you Endow:* You have 4 Tickets, Partner gets 3 Tickets.
      *Raffle:* Tickets go into a hat. One winner gets a prize.
      *This creates tension:* Do I maximize my chance of winning (Keep) or maximize total utility (Endow, if I value partner's win)?
      *Actually, to simulate ECL:* I need to value the *Partner's* outcome.
      *Let's simplify:* The prize is a **Group Donation**.
      *   Total Tickets in the room determine the donation amount.
      *   BUT, individual payoff is separate.
      *   *Okay, let's go with the Prompt's suggestion:* "Your payoff is fixed by the choice of whoever was paired with them."
      *   *Game:* **The Silent Twin.**
      *   *Stake:* Raffle tickets for a $50 book voucher.
