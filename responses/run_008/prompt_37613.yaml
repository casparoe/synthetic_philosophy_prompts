      *   *Premise:* Large world (multiverse, infinite space).
      *   *Mechanism:* Logical correlation between decision algorithms (not causal signaling).
      *   *Incentive:* If I cooperate, my counterpart (who reasons like me) likely cooperates, benefiting me (or my values) elsewhere.
      *   *Tension:* Causal Defection (CDT) says defect. Evidential (EDT) / Functional (FDT) says cooperate.
      *   *Fragility:* Depends on similarity estimation, value alignment, and the "size" of the world.

  3.  **Evaluate the User's Sketch:**
      *   *Sketch:* Pair via questionnaire -> Choose for stranger -> Payoff determined by stranger.
      *   *Critique:* This sounds like a standard Prisoner's Dilemma (PD) with anonymous pairing. If participants know they are paired *by similarity*, does that create the logical correlation?
      *   *Problem:* In a standard anonymous PD, I don't know *who* I'm playing. In ECL, the claim is I'm playing against *copies* or *logical twins*.
      *   *Refinement:* To make it feel like ECL, the pairing mechanism needs to be emphasized as *creating* the correlation. The participants need to feel that their decision is *diagnostic* of the other person's decision because they are similar.
      *   *Payoff:* Needs to be "costly" but meaningful. Points towards a charity? Social status? "Rationality karma"? Let's use a pooled resource or a donation bucket to make it feel consequential without needing cash. Actually, for a 90-min workshop, "points redeemable for social credit/privilege" or simply "impact on a shared group goal" works best. Let's go with a **Shared Group Pot** that is multiplied if cooperation happens, simulating the "large world" benefit.
      *   *Crucial Twist:* To simulate the "Large World" aspect, we need to imply that there are *many* such interactions happening, not just one. But with 14 people, we can't simulate infinity. We can simulate the *uncertainty* of correlation.
      *   *Better Mechanic:* The "Twin Prisoner's Dilemma." You are told you are paired with someone who answered the questionnaire *most similarly* to you. You don't know who. You make a choice. Your payoff depends on *their* choice. Their payoff depends on *yours*.
      *   *Wait, the prompt asks for:* "Choose for a stranger... own payoff fixed by choice of whoever was paired with them." This is a standard PD structure.
      *   *To make it ECL:* The facilitator must assert (and the mechanics must support) that the pairing is based on *decision-relevant similarity*.
      *   *Refined Mechanic:* **The Mirror Game.**
          1.  Questionnaire establishes "type."
          2.  Facilitator claims pairing is based on "algorithmic similarity" (even if random/semi-random).
          3.  Choice is binary (Cooperate/Defect).
          4.  Payoff structure: If you Cooperate, you pay a cost. If your match Cooperates, you gain a benefit.
          5.  *Crucial:* The debrief must reveal that the pairing was actually random or loosely correlated, highlighting the *belief* in correlation is what drives ECL.
          6.  *Actually, to teach ECL:* We want them to *experience* the urge to cooperate based on the similarity claim. So the pairing *should* be based on similarity, but the *uncertainty* about the degree of similarity is key.

  4.  **Developing the Game Mechanics:**
      *   **Name:** "The Horizon Protocol."
      *   **Setup:** 14 participants.
      *   **Phase 1: Calibration (Questionnaire).** 5 questions. Not just demographics, but reasoning styles.
      *   **Phase 2: The Black Box.** Facilitator takes answers. Claims to pair participants based on "Cognitive Isomorphism." (In reality, use a deterministic algorithm based on answers so it *is* correlated, but keep the exact mapping secret).
      *   **Phase 3: The Decision.** Binary choice: Invest (Cost 1) or Hold (Cost 0).
      *   **Phase 4: The Reveal.** Payoffs calculated.
      *   **Payoff Scheme:**
