  # JOINT STATEMENT ON SEMANTIC PARADOX AND TRUTH
  **Adversarial Collaboration Draft v1.0**

  **Parties:**
  *   **Party A (Paracomplete/Gaps):** Retired Chemist (K3-leaning)
  *   **Party B (Dialetheist/Gluts):** Professional Logician (LP-leaning)

  **Purpose:** To delineate shared commitments regarding the Liar Paradox and natural language truth, precisely locate disagreements, and establish testable predictions regarding the costs of each position. This document serves as a baseline to prevent talking past one another.

  ---

  ### I. SHARED COMMITMENTS
  *We, the undersigned, agree on the following foundational claims. Neither party accepts the "orthodox" classical solution to semantic paradox.*

  1.  **Rejection of Tarski's Hierarchy for Natural Language:** We agree that Tarski's distinction between object language and metalanguage is a useful tool for formal arithmetic but fails as a description of natural language. Natural language is semantically closed; we can talk about the truth of sentences within the same language they are spoken in.
  2.  **Unrestricted T-Schema:** We both aim to preserve the naive T-schema: *The sentence "p" is true if and only if p.* We reject solutions that achieve consistency by silently restricting this schema for semantic predicates, as this guts the concept of truth we actually use.
  3.  **Legitimacy of Self-Reference:** We agree that self-reference (e.g., via Gödel numbering or demonstratives like "this sentence") is not inherently pathological. The Liar sentence is grammatically and semantically well-formed.
  4.  **Classical Logic is Not Universal:** We agree that classical logic (specifically the combination of Bivalence and Explosion) cannot be maintained for the full natural language truth predicate without leading to triviality (where everything becomes true). Something must give.
  5.  **Non-Deflationary Goal:** We are not merely defining truth away. We believe there is a substantive property of "truth" that the T-schema captures, and our logics are attempts to model the structure of that property despite the paradoxes.

  ---

  ### II. PRECISE DISAGREEMENTS
  *Where we diverge. Note that while we use different words, the structural formalisms (K3 vs. LP) are often duals. The disagreement is interpretative and normative.*

  | Issue | Party B (Dialetheist / Gluts) | Party A (Paracomplete / Gaps) |
  | :--- | :--- | :--- |
  | **1. Status of the Liar** | The Liar sentence is **true and false**. It possesses both truth values simultaneously. This is a "glut." | The Liar sentence is **neither true nor false**. It lacks a truth value. This is a "gap." |
  | **2. Negation** | Negation is **truth-functional**. If $L$ is true and false, $\neg L$ is also true and false. Contradictions ($L \land \neg L$) are sometimes true. | Negation is **truth-functional**. If $L$ is gappy, $\neg L$ is also gappy. Contradictions are never true (they are gappy). |
  | **3. "Not True" vs. "False"** | "False" and "Not True" come apart. Since $L$ is true, it is **not** the case that $L$ is "not true" (in the sense of excluded from truth), even though $L$ is false. | "False" and "Not True" come apart. Since $L$ is gappy, $L$ is **not true**, but it is also **not false**. "Not true" covers both the false and the gappy. |
  | **4. The Strengthened Liar**<br>*("This sentence is not true")* | **Acceptance:** If the sentence is both true and false, then "it is not true" is true (because it is false). We accept the resulting contradiction as true. | **Expressive Problem:** If the sentence is gappy, "it is not true" is true. This seems to force the sentence to be true. We must argue that "not true" cannot be expressed in the object language without triggering a new gap. |
  | **5. Normative Stance** | We should **accept** the Liar sentence as true (and false). Assertion is compatible with contradiction. | We should **reject** the Liar sentence. We should not assert it. Rejection is not the same as asserting its negation. |

  ---

  ### III. THE CRUXES: PREDICTIONS & COSTS
  *To move forward, we must identify what evidence or logical costs would weigh against our respective positions. We record these predictions now to check against future analysis.*

  #### Crux 1: Curry's Paradox and Classical Reasoning
  *Curry's Paradox uses a sentence like "If this sentence is true, then everything is true." Unlike the Liar, it does not use negation. It threatens to explode the system via Modus Ponens and Contraction.*

  *   **The Issue:** To block Curry while keeping the T-schema, one must restrict classical structural rules (usually Contraction) or the behavior of the Conditional (Modus Ponens).
  *   **Party A (Gaps) Prediction:** We predict that a gap-based logic can preserve Modus Ponens for ordinary mathematical conditionals while restricting it only for semantic paradoxes. We expect the cost to classical mathematics to be **negligible**.
  *   **Party B (Gluts) Prediction:** We predict that any logic blocking Curry must restrict Contraction or Modus Ponens globally. We expect the cost to classical mathematics to be **manageable but non-zero** (e.g., some standard proofs in naive set theory or truth theory will fail).
  *   **Adjudication Criterion:** We will examine a standard non-contractive logic (like *ST* or *TS*). If ordinary mathematical proofs (e.g., in arithmetic) fail in this system, Party A must concede their "negligible cost" claim is false. If they hold, Party B must concede the "non-zero cost" claim is overstated.

  #### Crux 2: The Revenge Problem (Expressive Completeness)
  *Can we state our own theory within the language we are defending?*

  *   **The Issue:** Party A needs to say "The Liar is gappy." Party B needs to say "The Liar is not a glut" (i.e., exclusively true). If the language cannot express these concepts without generating new paradoxes, the theory is expressively incomplete.
  *   **Party A (Gaps) Prediction:** We predict that an "exclusion operator" (meaning 'is exclusively false' or 'is gappy') can be added to the language without collapse. The neutral observer will see Gaps as more intuitive because "lacking a value" is easier to express than "having two values."
  *   **Party B (Gluts) Prediction:** We predict that any operator Party A adds to express "gappiness" will be subject to a new Revenge Liar. The neutral observer will see Gluts as more robust because LP is functionally complete in a way K3 is not; we can define what Party A means, but Party A cannot define what we mean.
  *   **Adjudication Criterion:** We will look at the "Revenge Liar" formulated against the exclusion operator. If Party A's system becomes trivial when trying to express "this sentence is gappy," Party B wins this point. If Party B cannot express "exclusive truth" without paradox, Party A wins.

  #### Crux 3: The "Verbal" Dispute on Assertion
  *Is our disagreement merely about the word "Assert"?*

  *   **The Issue:** Party B asserts $L$. Party A rejects $L$. But Party A also rejects $\neg L$.
  *   **Joint Hypothesis:** We suspect a portion of our dispute is verbal. Party B uses "Assert" to mean "Accept as a fixed point of the T-schema." Party A uses "Assert" to mean "Commit to as a guide for action/belief."
  *   **Prediction:** If we define a normative attitude $X$ such that both parties agree we should hold attitude $X$ toward the Liar (e.g., "Do not use $L$ as a premise in practical reasoning"), then the practical difference between Gluts and Gaps vanishes for all non-semantic contexts.
  *   **Test:** We will attempt to draft a "Rule of Use" for the Liar sentence that both can sign. If successful, the dispute is largely metaphysical/semantic, not practical.

  ---

  ### IV. META-ANALYSIS: IS THE DISPUTE VERBAL?
  *Preliminary assessment by the collaboration.*

  We identify one significant chunk of our dispute as **potentially verbal**, specifically regarding the definition of **"False."**

  1.  **The Overlap:** In both K3 (Gaps) and LP (Gluts), the truth tables for negation, conjunction, and disjunction are identical. The *only* difference is which values are "designated" (count as preserving truth in valid arguments).
      *   K3 designates only {True}.
      *   LP designates {True, Both}.
  2.  **The Verbal Core:** When Party A says "The Liar is not true," and Party B says "The Liar is true," they may be using different criteria for "successful assertion."
      *   Party A treats "Truth" as **Normative**: To call something true is to license it for inference. Since the Liar licenses bad inferences (Explosion), it cannot be true.
      *   Party B treats "Truth" as **Descriptive**: To call something true is to acknowledge its semantic status. Since the T-schema forces the Liar to be true, it is true, even if it licenses bad inferences (which we block by changing the logic).
  3.  **Why it matters:** If this is correct, we are not disagreeing about the world or the sentence structure, but about whether the predicate "is true" should track *normative license* (A) or *semantic fixed-points* (B).
  4.  **Action Item:** For the purpose of this collaboration, we will distinguish **"t-truth"** (the technical property satisfying the T-schema) from **"n-truth"** (the property that warrants assertion).
      *   Party B agrees the Liar is not **n-true** (it shouldn't be used in standard proofs).
      *   Party A agrees the Liar is **t-true** (in the sense that it satisfies the T-schema equivalence, even if valueless).
      *   *Note:* We acknowledge this may not solve the metaphysical disagreement, but it should stop us from arguing about whether we "accept" the Liar in daily life.

  ---

  **Signed:**

  _________________________ (Party A: Paracomplete)

  _________________________ (Party B: Dialetheist)

  **Date:** _________________
