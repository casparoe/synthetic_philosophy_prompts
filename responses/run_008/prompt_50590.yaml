  5.  **Develop Fixes:**

      *   *Fix for Rank 1:* Abandon strict Determinism (2) for supertask scenarios, or insist the Lamp *is* determined (e.g., by the limit of the lever).
      *   *Fix for Rank 2:* Clarify "No-Gaps." Maybe "No fact of the matter" means the question "Is it on?" presupposes a discrete state where the physics yields a limit that doesn't map to discrete states. Or, bite the bullet and say there *is* a fact (e.g., it's off, or it's undefined but physically realized).
      *   *Fix for Rank 3:* Distinguish between kinematic supertasks (Zeno) and dynamic/causal supertasks (Thomson). This is the Benacerraf line.
      *   *Fix for Rank 4:* Specify the switching function. If $f(t)$ is the position, and State = $g(f(t))$, and $g$ is discontinuous at the limit, then the limit of the state doesn't exist.

  6.  **Select the "Single Revision":**
