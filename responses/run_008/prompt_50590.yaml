      *   If the function is undefined, is the question ill-posed (Claim 4)? If so, Claim 3 should say "The question 'is it on?' is ill-posed," not "there is no fact of the matter." "No fact of the matter" sounds like metaphysical indeterminacy. "Ill-posed" sounds like category error.
      *   *Recommendation:* Change Claim 3 to align with Claim 4. Argue the question is ill-posed *because* the physical setup doesn't define the state at the limit, OR argue the state *is* determinate based on the lever limit.
      *   *Which is better?* Arguing it is determinate fits Claim 2 (Determinism) and Claim 7 (Motion). Arguing it is ill-posed fits Claim 4 but clashes with Claim 2 (if the state is part of the history).
      *   *Winning Move:* Align with Claim 7. Motion is a supertask with a determinate end. The Lamp should be too. Drop the "no fact of the matter" agnosticism. Stipulate a law that resolves the limit. This makes the position bold and consistent.

  9.  **Final Polish:** Ensure the distinction between "ontic indeterminacy" (no fact of the matter) and "epistemic/semantic gap" (ill-posed) is clear in the critique of Claim 4 vs 3. Ensure the Determinism conflict is highlighted as the biggest target for the reading group.

      *(Self-Correction during drafting)*: Wait, Claim 6 says "ball labels are just bookkeeping." This is a bit fragile if Claim 2 (Determinism) holds. If the laws are deterministic, do the laws track labels? If labels are just bookkeeping, does reality track them? Claim 6 says "infinitely many balls remain." If labels are just bookkeeping, what makes them remain? Their physical identity. This is actually okay, but worth a quick note. I'll focus on the bigger fish (Lamp/Determinism).

      *Re-evaluating Claim 7:* "Ordinary motion is already a supertask." This is controversial (discrete space vs continuous). But assuming continuous space, it's standard. The tension is why *this* supertask is fine but Thomson's is weird.

