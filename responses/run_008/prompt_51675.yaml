answer: |-
  **To:** The Board
  **From:** [Your Name]
  **Re:** Holiday Payments for Building Staff

  **Recommendation**
  I propose we stop collecting voluntary cash tips and instead create a mandatory year-end bonus for all staff. This amount would be added to everyone's maintenance fee in November.

  **Why This Is Better**
  Right now, the staff counts on this money to get through the winter. When some owners do not pay, the staff loses income. That is not fair to them.

  Some neighbors say a forced tip is not a tip. They are right. A tip is a gift. But if the staff budgets for this money, it is not a gift—it is part of their pay. By making it mandatory, we stop calling it a "tip" and start treating it like a bonus. This respects the staff. It is not charity; it is wages.

  **The New Owner Argument**
  New owners say they never agreed to this custom. They say it is unfair to charge them for a rule they did not know. This is a strong point. Nobody should be surprised by costs after they move in.

  However, buying a co-op is different than renting an apartment. When you buy here, you buy into how this building works. That includes the culture. But because this custom was unwritten, we failed the new owners. We did not tell them the rules of the game.

  **What We Owe Residents**
  We need to be clear about who owes what:
  *   **Visitors:** They owe nothing. They are guests.
  *   **New Owners:** We owe them full truth before they buy. Going forward, this bonus cost must be in writing during the sale process. If they know the cost before they sign, they agree to it.
  *   **Longtime Owners:** We have known this custom for years. We have a duty to keep the building running as promised to the staff.

  **Conclusion**
  Making this mandatory solves two problems. It guarantees the staff gets paid what they expect. It stops the argument between neighbors about who paid and who did not.

  Let us stop hiding behind the word "tip." Let us pay the staff fairly, all together, and tell new buyers the cost upfront.

  Please think this over before we meet next month.
