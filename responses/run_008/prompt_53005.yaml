answer: |-
  **Project Title:** Fragmented Comparability: A Measurement-Theoretic Approach to Welfare Policy

  **1. Research Question**

  The central question of this project is: *What are the minimal interpersonal comparability assumptions required to validate specific welfarist policy tools, and can these weaker assumptions be philosophically justified without resolving the classic problem of interpersonal utility comparison?*

  Conventionally, welfare economics treats interpersonal comparability as a binary threshold: either we can compare wellbeing across persons in a robust, cardinal sense, or the utilitarian programme collapses into ordinalism and Pareto inefficiency. This project challenges that dichotomy. Drawing on measurement theory, it posits that comparability comes in grades (e.g., comparing levels vs. comparing units; comparing gains vs. comparing absolute states). The objective is to map specific policy arguments—such as cost-benefit analysis (CBA), distributional weighting, QALY thresholds, and optimal taxation—onto the weakest possible comparability structure sufficient to sustain them. The ultimate aim is to determine whether a 'fragmented welfarism' is viable: one that permits practical policy evaluation without demanding a solution to the metaphysical and epistemological problems of full interpersonal comparison.

  **2. State of the Art and Gap**

  Existing literature in social choice theory and welfare economics largely operates within a binary framework. Following Arrow, the impossibility of aggregating ordinal preferences is well-established. Subsequent work, notably by Sen, demonstrated that relaxing informational constraints to allow for interpersonal comparisons restores possibility. However, this literature tends to treat comparability as a monolithic informational base. One is either working within a framework of 'full comparability' (cardinal unit and level comparability) or 'non-comparability'.

  While measurement theory (in the tradition of Stevens and Suppes) distinguishes between ordinal, interval, and ratio scales, and distinct forms of comparability (level vs. difference), this nuance has not been systematically applied to the justification of *actual* policy instruments. Philosophers of economics often debate the justification of comparability in the abstract (e.g., via extended preferences or objective lists), whilst economists often assume comparability away via monetary proxies.

  There is a significant gap between these positions. We lack a precise taxonomy that links the *mathematical structure* of a policy tool to the *minimal philosophical commitment* required to validate it. For instance, does a QALY threshold require that we know Person A is happier than Person B (level comparability), or merely that a health gain for A is comparable to a health gain for B (unit comparability of differences)? By failing to distinguish these, current debates demand more justificatory heavy lifting than necessary. This project fills that gap by disaggregating the comparability requirement.

  **3. Methodology and Work Plan**

  This is a conceptual project employing formal modelling, philosophical analysis, and case study reconstruction. It will proceed over eight quarters (two years).

  **Year 1: Taxonomy and Mapping**

  *   **Quarter 1: Formalising the Scales.**
      I shall construct a formal taxonomy of comparability fragments. Using measurement theory, I will define distinct 'comparability structures' (e.g., ordinal level comparability, cardinal unit comparability without level comparability, ratio comparability of gains). The output will be a rigorous vocabulary to replace the binary 'comparable/not comparable' distinction.
  *   **Quarter 2: Deconstructing Policy Tools (Part I).**
      I will analyse the mathematical structure of Cost-Benefit Analysis (CBA) and Cost-Effectiveness Analysis (CEA). The aim is to derive the necessary conditions for their validity. For example, does Kaldor-Hicks efficiency require cardinal comparability, or merely a specific form of ordinal comparability regarding potential compensation?
  *   **Quarter 3: Deconstructing Policy Tools (Part II).**
      I will apply the same analysis to optimal taxation models (Mirrlees-style) and disability weighting in health economics. The focus here is on how these models handle trade-offs between efficiency and equity. I shall identify exactly where interpersonal comparisons enter the calculus—is it in the social welfare function, or embedded in the constraints?
  *   **Quarter 4: The Mapping Exercise.**
      I will synthesise the findings from Quarters 2 and 3 against the taxonomy from Quarter 1. The goal is to produce a 'dependency matrix' showing which policy tools rely on which comparability fragments. This will identify which tools are 'cheap' (requiring weak assumptions) and which are 'expensive' (requiring strong assumptions).

  **Year 2: Justification and Synthesis**

  *   **Quarter 5: Philosophical Defence of Weak Fragments.**
      Having identified the 'cheap' fragments, I shall investigate their philosophical justifiability. Can we defend 'unit comparability of gains' without defending 'level comparability'? I will examine arguments from public reason, objective list theories, and capabilities approaches to see if they support these weaker claims more easily than full comparability.
  *   **Quarter 6: Robustness and Sensitivity.**
      I will test the robustness of the policy tools when the comparability assumptions are relaxed. If we move from cardinal to ordinal comparability of gains, does the policy recommendation change drastically? This involves sensitivity analysis on the theoretical models.
  *   **Quarter 7: Drafting the Monograph/Papers.**
      I will begin drafting the core outputs. The plan is to structure this as a series of three papers leading to a monograph. This quarter focuses on the formal and economic modelling sections.
  *   **Quarter 8: Final Synthesis and Dissemination.**
      The final quarter is dedicated to completing the manuscript, focusing on the normative implications. I shall also prepare a policy briefing summarising the findings for non-specialist stakeholders, clarifying which policy tools are philosophically secure and which remain on shaky ground.

  **4. Expected Results**

  The primary output will be a monograph manuscript suitable for publication with a major academic press, accompanied by two to three journal articles in fields such as *Philosophy and Public Affairs*, *Economics and Philosophy*, or *Social Choice and Welfare*.

  Substantively, the project aims to deliver:
  1.  **A Taxonomy of Comparability:** A new formal framework for discussing degrees of interpersonal comparison.
  2.  **A Dependency Matrix:** A clear mapping of standard policy tools to their minimal comparability requirements.
  3.  **A Vindication (or Critique) of Pragmatic Welfarism:** A definitive answer to whether policymakers can rely on tools like CBA without solving the 'hard problem' of consciousness or wellbeing. If successful, the project will show that much of welfare policy rests on defensible, weak comparability assumptions. If unsuccessful, it will demonstrate precisely where the hard problems are unavoidable.

  **5. Risk Assessment: Failure and Triviality**

  It is vital to define what would constitute a failed or uninteresting project.

  *   **Triviality:** The project would be boring if the mapping exercise reveals that the 'weak fragments' are mathematically equivalent to the strong assumptions. For example, if it turns out that 'comparability of gains' logically entails 'comparability of levels' within the relevant policy contexts, then the distinction is merely semantic. I shall mitigate this by rigorously checking the independence of the axioms in Quarter 1.
  *   **Philosophical Failure:** The project would fail if the 'weaker' fragments turn out to be just as philosophically controversial as the strong ones. If defending 'unit comparability' requires the same metaphysical baggage as 'level comparability', then the pragmatic advantage vanishes. This is a substantive risk, but even a negative result here is valuable: it would show that the 'binary trap' is real and that we cannot evade the hard questions of moral philosophy through measurement theory.
  *   **Policy Irrelevance:** There is a risk that the 'fragments' I identify do not correspond to how policy is actually made. To mitigate this, I will ensure the policy tools analysed in Year 1 are drawn from actual government guidance (e.g., HM Treasury Green Book, NICE guidelines) rather than purely abstract economic models.

  In sum, even if the hypothesis that 'weak comparability is sufficient' is falsified, the project yields a clearer understanding of the informational demands of welfare policy. However, the working hypothesis is that a significant portion of our policy apparatus relies on comparability structures that are philosophically cheaper than the literature assumes, and this project will isolate and defend them.
