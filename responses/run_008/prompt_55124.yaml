answer: |-
  She will verdict that the Mandelbrot set existed in 1900.

  Two candidate rules fit her track record. The first is **Domain Dualism**: abstract objects in the domain of pure mathematics (numbers, sets, propositions) are mind-independent and eternal, while objects in the domain of cultural practice (games, artworks, fiction) are mind-dependent and temporal. On this reading, the Mandelbrot set is a subset of the complex plane defined by standard arithmetic operations; it falls squarely under "sets" and "mathematical truths," so it existed eternally. The second rule is **Inevitability Realism**: an abstract object exists eternally only if it is an inevitable focal point of rational inquiry, rather than a contingent stipulation. Numbers and the Riemann hypothesis pass this test; chess rules and Sherlock Holmes do not. On this reading, the Mandelbrot set likely existed in 1900 because it is a structural feature of the complex numbers that any sufficiently advanced mathematical culture would converge upon, unlike the arbitrary rules of chess.

  My best guess relies on Domain Dualism. Her explicit commitment that "sets exist" and that there was a "fact about the Riemann hypothesis before anyone asked" suggests she grants ontological status based on formal definability within mathematics, not just natural kind inevitability. She distinguishes math from culture, not "natural math" from "contingent math." Since the Mandelbrot set is defined entirely within the accepted ontology of sets and complex numbers, she will treat it as discovered rather than invented, aligning it with the number 17 rather than the rules of chess.

  To split these remaining candidates apart, press her on **the set of all prime numbers that contain the digit sequence of your social security number**. Domain Dualism predicts this set existed in 1900 because it is a well-defined set of numbers, regardless of human history. Inevitability Realism predicts it did not exist in 1900 because the set is defined by a contingent, human-specific fact that no rational inquiry was destined to find. Her answer here will reveal whether her Platonism is grounded in the nature of mathematical domains or the inevitability of mathematical truths.
