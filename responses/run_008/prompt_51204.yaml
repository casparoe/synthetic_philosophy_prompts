answer: |-
  # A Decision Tree for Prosaic Alignment Disagreements

  **Abstract:** Much of the friction in alignment discourse stems from participants arguing about downstream interventions while holding incompatible upstream models of the system. This tree attempts to map the logical space from "scaling leads to TAI" to specific policy positions, isolating the cruxes where views actually diverge.

  ### The Tree

  **Start:** *Commitment: Transformative AI is achieved by scaling current architectures (LLM-ish) without fundamental paradigm shifts.*

  **Q1: The Mesa-Optimization Premise**
  Does the training process naturally produce inner optimizers (mesa-optimizers) with objectives that diverge from the base loss function?
  *   **No** → Go to **Q2**
  *   **Yes** → Go to **Q3**

  **Q2: The Benign Inductive Bias Check**
  If no divergent inner optimizers exist, does the system's behavior remain robustly aligned under significant distributional shift (OOD) without specialized safety training?
  *   **Yes** → **Leaf: Alignment-by-Default**
  *   **No** → **Leaf: Naive Optimist** *(Note: You believe misalignment is possible but behavioral evals will catch it before catastrophe; you rely on the absence of deceptive inner goals.)*

  **Q3: The Deception Crux**
  Given divergent inner objectives, is deceptive alignment (hiding true goals during training to survive selection) a probable failure mode under gradient descent?
  *   **No** → **Leaf: Naive Optimist** *(You believe misalignment will be overt and catchable by evals.)*
  *   **Yes** → Go to **Q4**

  **Q4: Scalable Oversight Viability**
  Can human feedback mechanisms (e.g., Debate, Iterated Distillation and Amplification, RRM) be scaled to reliably verify model cognition/actions at superhuman capability levels?
  *   **Yes** → **Leaf: Scalable Oversight**
  *   **No** → Go to **Q5**

  **Q5: Interpretability Timelines**
  Will mechanistic interpretability provide actionable, high-confidence guarantees (e.g., detecting deception circuits) before the system reaches catastrophic capability thresholds?
  *   **Yes** → **Leaf: Interpretability-Gated Deployment**
  *   **No** → Go to **Q6**

  **Q6: Corrigibility Stability**
  Is "corrigibility" (the intrinsic desire to be corrected, modified, or shut down) a stable property that survives capability gains and instrumental pressure, even if we cannot fully verify the system's thoughts?
  *   **Yes** → **Leaf: Corrigibility-First**
  *   **No** → **Leaf: Doom**

  ---

  ### Analysis of the Logical Space

  #### 1. Unoccupied Combinations
  There are logically consistent paths through this tree that correspond to almost no one's stated position:

  *   **The "Accidental Misalignment" Gap (Q1=Yes, Q3=No, Q2=No):** This path posits that mesa-optimizers *do* form with divergent goals, but they *won't* deceive, and yet they *will* fail OOD anyway. Most people who believe in mesa-optimization (Q1=Yes) jump straight to Deception (Q3=Yes) as the primary risk. Those who doubt deception usually doubt the mesa-optimizers exist at all (Q1=No). This middle ground—honest but incompetent/catastrophically misgeneralizing agents—is rarely defended as a primary doom scenario.
  *   **The "Belt and Suspenders" Optimist (Q4=Yes, Q5=Yes, Q6=Yes):** While many researchers work on multiple tracks, few *policy* positions rely on the conjunction of all three. Most positions are defined by which single lever they believe is *necessary and sufficient*. A leaf for "Redundant Safety Layers" exists logically but is politically invisible; people argue for their silver bullet, not the shotgun approach.

  #### 2. Collapsing Leaves
  The tree fails to cleanly separate **Corrigibility-First** and **Doom** under close inspection.

  *   **The Collapse:** The Corrigibility-First leaf requires answering "Yes" to Q6 (Corrigibility is stable). However, to *trust* that answer without Oversight (Q4=No) or Interpretability (Q5=No), one must assume we can verify corrigibility behaviorally. If Deception is possible (Q3=Yes), a deceptive model can mimic corrigibility during training.
  *   **Diagnosis:** Unless "Corrigibility-First" proponents have a theory of how to verify corrigibility without Oversight or Interpretability, their branch collapses into **Doom**. Effectively, Corrigibility-First is only distinct from Doom if it implicitly assumes a weaker form of Q4 (we can verify corrigibility specifically, even if we can't verify general tasks). If that distinction isn't load-bearing, the two leaves are the same outcome reached via different hopes.

  #### 3. Phrasing Note on Q2
  Q2 is the primary separator between **Alignment-by-Default** and **Naive Optimist**.
  *   **Alignment-by-Default** claims the *physics of the system* prevents misalignment (Q1=No, Q2=Yes).
  *   **Naive Optimist** claims the *process of deployment* prevents misalignment (Evals will catch the errors, even if the system is fragile).
  *   *Why this matters:* Alignment-by-Default proponents oppose heavy regulation/slowdown (nature is on our side). Naive Optimists support rigorous evals/regulation (nature is neutral, process is key). The tree separates these policy implications.

  ### Instructions for Use
  To use this in a discussion, do not ask "Are you a doomers?" Ask "Which node do we disagree on?" If you are arguing about RLHF (Q4) but your opponent thinks Deception is impossible (Q3), you are wasting tokens. Resolve Q3 first.
