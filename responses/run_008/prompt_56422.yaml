answer: |-
  ### Phase 1: Brainstorming Candidate Concepts

  Before locking in a definition, let's lay out the conceptual landscape. Your description triggers associations across game theory, welfare economics, evolutionary biology, and sociology. Here are the strongest candidates, along with why they might fit or fail:

  1.  **Rent-Seeking / Rent-Dissipation:** (Public Choice Economics)
      *   *Fit:* This is the strongest technical match. "Rent" is the surplus value of the prize. "Seeking" is the costly effort. "Dissipation" is when the cost of competing eats up the value of the prize.
      *   *Friction:* In common parlance (and some literature), "rent-seeking" implies lobbying for government favors or monopoly privileges (illicit/policy-based). Your examples (shops, peacocks) are market/natural phenomena, not necessarily policy distortions.
  2.  **Positional Competition:** (Sociology/Welfare Economics — Hirsch, Frank)
      *   *Fit:* Perfectly captures the "fixed prize" aspect. The value of the good depends on rank, not absolute quality. Explicitly deals with the welfare loss of status competition.
      *   *Friction:* Sometimes focuses more on consumption (luxury goods) than the *process* of competition itself, though the logic is identical.
  3.  **The Red Queen Hypothesis:** (Evolutionary Biology)
      *   *Fit:* "Running to stay in the same place." Captures the escalation without progress (peacocks, academic credentials).
      *   *Friction:* Biological/evolutionary framing might feel metaphorical if applied to shop hours or advertising markets in a philosophy lecture.
  4.  **Tragedy of the Commons:** (Environmental Economics)
      *   *Fit:* Individual rationality leads to collective ruin.
      *   *Friction:* As you noted, Commons involves depleting a *stock* resource (fish in a lake). Your pattern involves wasting *flow* resources (effort/time) on a fixed *position*.
  5.  **All-Pay Auction:** (Game Theory)
      *   *Fit:* The formal structure. Everyone pays their bid (effort), only the winner gets the prize. Mathematically models the "costly effort cancels out" dynamic.
      *   *Friction:* This is a *model*, not a named social phenomenon.
  6.  **Signaling / Costly Signaling:** (Information Economics)
      *   *Fit:* Explains the peacock and the CV. Effort proves quality.
      *   *Friction:* Standard signaling theory assumes the signal conveys *information*. Your pattern includes cases where the signal becomes noise (credential inflation), destroying the informational value.

  ---

  ### Phase 2: The Verdict

  There is no single, uncontested term that covers every nuance you described without carrying some disciplinary baggage. However, the phenomenon is well-established under a composite description.

  **The Established Name:**
  The most precise technical term for the *mechanism* is **Rent Dissipation** (occurring within a **Tullock Contest**).
  The most precise term for the *social context* is **Positional Competition**.
  The most pedagogically effective term for the *dynamic* is a **Positional Arms Race**.

  If you want to be rigorously correct in an economics/philosophy intersection, you should teach this as **Rent Dissipation in Positional Competition**.

  However, because "Rent-Seeking" often confuses students (who associate it with corruption), and "Red Queen" sounds like biology, I recommend you anchor your lecture on **Positional Arms Races**, while explicitly grounding it in the theory of **Rent Dissipation**.

  Here is the breakdown of what the phenomenon is, what it isn't, and where the edges lie.

  ### 1. What Exactly Is It? (The Core Logic)

  The phenomenon is a **Negative-Sum Contest for a Positional Good**.

  *   **The Prize:** It is **Positional** (its value is determined by relative rank, not absolute quality) or **Fixed** (zero-sum). A job, a mate, market share on a single street.
  *   **The Mechanism:** It functions as an **All-Pay Auction**. All competitors pay the cost of effort (hours, publications, tail feathers), but only the highest bidder wins.
  *   **The Equilibrium:** Rational actors escalate effort until the **Marginal Cost of Effort = Marginal Expected Gain**. In the limit, this leads to **Complete Rent Dissipation**, where the total cost of competition equals the total value of the prize.
  *   **The Welfare Outcome:** Pareto Inferior. The group would be wealthier/healthier if they could credibly commit to *not* competing, but individual incentives prevent this (a multi-player Prisoner's Dilemma).

  ### 2. What It Is Not (Crucial Distinctions)

  You were right to doubt "Tragedy of the Commons" and simple "Arms Races." Here is how to draw the lines for your students:

  **A. Vs. Tragedy of the Commons**
  *   **Commons:** Rivalry in *consumption* of a stock. (If I eat the fish, you can't.) The resource disappears.
  *   **Your Pattern:** Rivalry in *ranking* for a flow/position. (If I get the job, you don't.) The resource (the job) remains, but the *social surplus* is burned in the trying.
  *   **The Boundary:** If the competition depletes a shared physical stock (overfishing), it's a Commons problem. If it depletes *time, energy, or trust* without touching a physical stock, it's Rent Dissipation/Positional Competition.

  **B. Vs. Productive Competition (Innovation Races)**
  *   **Productive:** The racing *creates* value. (Two firms racing to cure cancer. Even the loser produces knowledge.) The prize grows or social welfare increases regardless of who wins.
  *   **Your Pattern:** The racing is *socially waste*. (Two firms staying open later. No new customers, just higher wages.)
  *   **The Boundary:** Does the effort generate a positive externality? If yes, it's productive competition. If the effort's only function is to outbid the rival, it's Rent Dissipation.

  **C. Vs. Standard Signaling**
  *   **Signaling:** Costly effort proves hidden quality (e.g., a degree proves intelligence). The signal retains informational value.
  *   **Your Pattern (The "Ugly" Variant):** When everyone signals, the signal loses informational value (Credential Inflation). The effort remains costly, but the information content drops to zero.
  *   **The Boundary:** If the signal still distinguishes quality, it's Costly Signaling. If the signal becomes mandatory noise that everyone must adopt just to remain legible, it has crossed into **Degenerative Positional Competition**.

  ### 3. The "Ugly" Variant: When the Prize Itself Rot

  You mentioned a specific subtype: *"The competing destroys the value of the very thing being competed for."* (e.g., advertising trust, credential inflation).

  Standard Rent Dissipation assumes the prize value ($V$) is fixed, and costs ($C$) rise to meet it ($C \to V$).
  Your "ugly" case is where $V$ is a function of $C$. As total competition intensity rises, $V$ falls.

  *   **Established Term:** There isn't a single famous label for this specific feedback loop, though it appears in literature on **Signal Jamming** (information economics) and **Congestion Externalities** (in positional goods).
  *   **Recommendation:** Call this **Endogenous Prize Degradation**.
  *   **Why:** In standard rent-seeking, the waste is the *effort*. In this variant, the waste is the effort *plus* the loss of the prize's utility. This is the strongest argument for regulation or social norms to halt the race.

  ### 4. Boundary Cases: Where Does the Pattern Stop?

  You asked: *"What happens when the prize isn't quite fixed but grows a little with effort — is that inside or outside, and why?"*

  This is the difference between **Complete** and **Partial Rent Dissipation**.

  *   **Inside the Pattern (Partial Dissipation):** If the prize grows *less* than the cost of effort required to grow it, it is still socially wasteful competition.
      *   *Example:* Academic publishing. Maybe one extra paper actually improves teaching slightly (prize grows), but everyone writes ten extra papers to compete. The cost of writing ten papers outweighs the slight improvement in quality. This is still a Positional Arms Race.
  *   **Outside the Pattern (Productive Margin):** If the effort creates more social value than it costs, even if it is competitive.
      *   *Example:* A race to invent a vaccine. The winner takes the patent (positional), but the effort produces a vaccine that saves millions (positive sum).
  *   **The Test:** Compare the **Marginal Social Product** of the effort to the **Marginal Social Cost**.
      *   If $MSP < MSC$: It is Rent Dissipation (Inside your pattern).
      *   If $MSP > MSC$: It is Productive Competition (Outside your pattern).

  ### 5. Summary for Your Lecture

  If I were preparing this lecture, I would structure the terminology this way:

  1.  **The Folk Term:** The Rat Race (acknowledge it, but discard it for precision).
  2.  **The Formal Mechanism:** **Rent Dissipation** (via **Tullock Contests** / **All-Pay Auctions**).
  3.  **The Social Phenomenon:** **Positional Arms Race** (drawing on Robert Frank and Fred Hirsch).
  4.  **The Pathological Subtype:** **Endogenous Prize Degradation** (when the race destroys the value of the win).

  **Why this distinction matters for Political Philosophy:**
  This distinction isolates the specific justification for intervention.
  *   We don't intervene in *Productive Competition* (innovation).
  *   We might intervene in *Tragedy of the Commons* (property rights).
  *   We *must* intervene (or seek social coordination) in **Positional Arms Races with Rent Dissipation**, because the market equilibrium is mathematically guaranteed to be Pareto-inferior. The "invisible hand" here leads to collective exhaustion, not collective wealth.

  **Final Recommendation:**
  Use **Positional Arms Race** as your headline. It is intuitive, covers the biological and economic examples, and captures the "escalation" dynamic. But footnote it with **Rent Dissipation** to show the economic rigor. This gives you the best of both worlds: philosophical accessibility and economic precision.
