answer: |-
  Here is an analysis of your cases, a proposed principle, and an honest assessment of where the tensions lie. I have adhered to the British English convention as requested (e.g. *behaviour*, *towards*, *practise* as the verb).

  ### The Principle: Moral Salience

  Your initial stab at a 'tracking' principle was close, but it requires sharpening to distinguish between Case 4 (Pity) and Case 7 (Spite), and between Case 4 (Pity) and Case 6 (Curiosity). The problem with simple 'tracking' is that a sadist tracks the victim's pain, but in the wrong direction.

  The principle that best captures your anchor verdicts (1 and 2) while accommodating your intuitions on 3, 4, and 5 is **The Moral Salience Principle**:

  > **An act has moral worth if and only if the agent's primary motivation is a responsiveness to the features that objectively make the act morally good (such as welfare, rights, or justice), rather than to features that are self-regarding, incidental, or contrary to the moral good.**

  This principle allows for different *modes* of responsiveness: cognitive (recognising a duty), affective (feeling pity), or pre-reflective (alarm). It does not require the agent to articulate the moral law, only that their motive 'latches on' to the actual value at stake.

  ### Application to Your Cases

  Here is how the principle applies to your eight scenarios, clause by clause:

  1.  **Shopkeeper (Duty):** **Yes.** His motivation responds to the normative requirement of honesty. It tracks the right-making feature (fairness/obligation).
  2.  **Shopkeeper (Camera):** **No.** His motivation responds to self-protection (avoiding punishment). This is a self-regarding feature, not a moral one.
  3.  **Rescuer (Alarm):** **Yes.** Her alarm is a pre-reflective responsiveness to the value of life and the presence of danger. It tracks the right-making feature (preservation of life) without needing cognitive mediation.
  4.  **Donor (Pity):** **Yes.** Pity is an affective responsiveness to suffering. Since the relief of suffering is what makes the donation right, the motivation tracks the right-making feature.
  5.  **Donor (Duty + Resentment):** **Yes.** Despite the resentment, the primary motivator is the recognition of the moral requirement. It tracks the right-making feature (obligation). The principle treats this as equal in worth to Case 4, as both track the relevant moral value, albeit through different psychological channels.
  6.  **Doctor (Curiosity):** **No.** Her motivation responds to intellectual novelty (a puzzle). This is an incidental feature. The patient's welfare is not the *reason* she acts, but merely a condition of the puzzle existing.
  7.  **Truth-teller (Spite):** **No.** While he tells the truth, his motivation responds to the colleague's discomfort (a harm). He is instrumentalising honesty to achieve an end contrary to the moral good (collegial welfare). He is not responsive to the value of truth, but to the utility of truth-as-a-weapon.
  8.  **Liar (Compassion vs. Belief):** **Yes (with caveats).** She acts out of an inability to watch suffering. This is a responsiveness to welfare (the objective right-making feature of the act). The fact that she believes she is violating a rule (honesty) is a cognitive error about which norm takes precedence, but her motivation still tracks the *actual* moral weight of the situation (saving a person from deportation).

  ### Prediction for the New Case

  **Case:** Someone does the right thing purely to avoid feeling guilty afterwards.

  **Prediction:** **No Moral Worth.**

  **Reasoning:** Under the Moral Salience Principle, this falls under the same clause as the Shopkeeper with the Camera (Case 2). The motivation is responsiveness to the agent's own psychic state (avoiding discomfort), which is a self-regarding feature. Although the act aligns with duty, the reason does not track the welfare of the beneficiary or the value of the duty itself; it tracks the agent's desire for a clean conscience. It is a form of emotional self-protection.

  ### Which Verdicts Cannot Be Saved?

  You asked for honesty regarding which of your verdicts this principle might force you to reconsider. There is one significant tension point: **Case 8**.

  While the principle classifies Case 8 as having moral worth (because she tracks the welfare value), this creates a conflict with the intuition behind Case 1 (Duty). In Case 1, the agent acts *because* it is right. In Case 8, the agent acts *though* she believes it is wrong.

  If you hold that moral worth requires a degree of **integrity**—that is, acting in accordance with one's own sincere moral convictions—then Case 8 must be reclassified as lacking moral worth. An agent who acts against their own conscience, even for a good outcome, is arguably not exhibiting moral virtue but rather a fractured moral agency.

  To maintain a perfectly coherent system, you would likely need to choose between two options:

  1.  **Prioritise 'Tracking Actual Value':** Keep Case 8 as **Yes**. This accepts that an agent can have moral worth even if they are mistaken about which rule applies, provided they care about the right things (people's welfare). This fits well with your verdicts on Cases 3 and 4.
  2.  **Prioritise 'Integrity/Conscience':** Change Case 8 to **No**. This aligns better with a Kantian view where acting against one's conception of the law is impermissible, and arguably extends to moral worth.

  **My advice:** If you wish to keep your verdicts on Cases 3 (Alarm) and 4 (Pity) as clear 'Yeses', you should prioritise 'Tracking Actual Value'. This suggests that what matters is that the agent is moved by the *real* stakes (a life, suffering), not that they correctly label the stakes. Therefore, you should keep Case 8 as a **Yes**, but acknowledge that it is a 'tragic' moral worth, distinct from the 'secure' moral worth of Case 1.

  However, if you find the guilt in Case 8 too disqualifying, you may have to tighten the principle to require that the agent does not believe they are acting wrongly. If you do that, you risk endangering Case 3 (where no thought crosses the mind) or Case 4 (where they never phrase it in terms of obligation). The safest route for your current set of intuitions is to accept Case 8 as a 'Yes', but recognise it as the most fragile verdict in the set.

  ### A Note on Usage

  In drafting your dataset documentation, ensure you maintain the distinction between *practise* (verb) and *practice* (noun). For example: "The agent *practises* honesty," but "It is common *practice*." This distinction is often overlooked but matters for the convention you specified.

  In summary, the **Moral Salience Principle** saves almost all your verdicts by focusing on *what* the motivation responds to (welfare, duty, rights) rather than *how* it feels (cold duty vs. warm pity). The only verdict requiring careful handling is Case 8, which sits on the fault line between doing the right thing and acting with integrity.
