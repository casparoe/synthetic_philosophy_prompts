answer: |-
  Here is a design for a 90-minute session titled **"The Protocol."** It requires no prior lecture on commitment races. The mechanics force the dynamic to emerge from the payoff structure and time pressure.

  ### **Session Overview**
  *   **Time:** 90 Minutes
  *   **Participants:** 12 (6 Pairs per round)
  *   **Materials:**
      *   36 Small Opaque Envelopes (or folded paper stapled shut).
      *   72 "Value Cards" (Index cards with numbers 1–10 written on them).
      *   72 "Decision Slips" (Small paper, two checkboxes: **LOCK** / **WAIT**).
      *   Whiteboard & Markers.
      *   Timer (Phone or laptop projected).

  ---

  ### **Part 1: The Rules (10 Minutes)**
  *Do not explain the theory. Read the instructions neutrally.*

  **The Setup:**
  "You are participating in 3 Rounds of a Negotiation Protocol. In each round, you will be paired with another participant randomly. Your goal is to maximize your individual point score."

  **The Round Structure:**
  1.  **Pairing:** You are assigned a Partner (A and B).
  2.  **The Pot:** There is a 'Surplus' to be divided. The Surplus is the sum of two Private Values.
      *   *Crucial:* You will receive a **Value Card** (number 1-10). You **may not look at it** until the Commitment Phase ends.
  3.  **The Commitment Phase (60 Seconds):**
      *   You must submit a **Decision Slip**.
      *   **Option LOCK:** You seal your Decision Slip in an envelope *before* looking at your Value Card. You also write a **Demand** (a number between 1 and 10) on the slip.
          *   *Constraint:* Because you sealed it blind, your Demand cannot depend on your Value Card.
      *   **Option WAIT:** You do not seal an envelope. You keep your Decision Slip open. You **may** look at your Value Card immediately.
      *   *Rule:* Once the Timer hits 0, all envelopes are collected. No changes allowed.
  4.  **Resolution & Payoffs:**
      *   The TA opens envelopes and reveals Value Cards.
      *   **Scenario 1 (WAIT / WAIT):** Both see values. Surplus is split **50/50** automatically.
      *   **Scenario 2 (LOCK / WAIT):** The LOCK player's Demand is enforced.
          *   If Demand ≤ Surplus: LOCK gets Demand points. WAIT gets the Remainder.
          *   If Demand > Surplus: Deal Fails. Both get **0**.
      *   **Scenario 3 (LOCK / LOCK):** Both locked blind.
          *   If Sum of Demands ≤ Surplus: Deal happens (each gets Demand).
          *   If Sum of Demands > Surplus: **Collision.** Both get **2 points** (regardless of Surplus).

  **The Incentive Structure (Hidden from Players):**
  *   Average Surplus is ~11 points.
  *   **WAIT/WAIT:** ~5.5 pts each. (Social Optimum)
  *   **LOCK/WAIT:** LOCKER demands ~8 pts. LOCK gets 8, WAIT gets 3. (First Mover Advantage)
  *   **LOCK/LOCK:** High chance of Collision (Sum of Demands > Surplus). Even if deal happens, rigidity limits efficiency. Expected Value ~3 pts each. (The Race Outcome)
  *   *Dominant Strategy:* LOCK guarantees you avoid the "Sucker" payoff (3 pts) and gives a chance at 8 pts. WAIT risks getting 3 pts if the other LOCKs.

  ---

  ### **Part 2: The Game (45 Minutes)**

  **Round 0: The Pact (5 Minutes)**
  *   Before Round 1 begins, allow open discussion.
  *   *TA Script:* "You have 5 minutes to discuss strategy with the room before we begin Round 1."
  *   *Expectation:* Someone will realize WAIT/WAIT is best for the group. They will propose: "Let's all agree to WAIT."
  *   *TA Action:* Write the pact on the board if they make it. "Room agrees to WAIT." Do not enforce it.

  **Round 1 (15 Minutes)**
  *   Run the protocol.
  *   *TA Pressure:* During the 60-second Commitment Phase, announce time aggressively. "30 seconds left. If you LOCK, seal the envelope now." "10 seconds. Final chance to lock in."
  *   *Goal:* Create anxiety. The fear that someone will break the pact and LOCK should drive people to LOCK preemptively.
  *   Reveal scores. Highlight any defectors (LOCK players who got high scores against WAIT players).

  **Round 2 (15 Minutes)**
  *   No discussion allowed.
  *   Double the point values (x2 multiplier).
  *   *TA Script:* "Stakes are doubled. Same rules."
  *   *Expectation:* Trust has collapsed. Almost everyone LOCKs. Payoffs drop due to Collisions (LOCK/LOCK).

  **Round 3 (10 Minutes)**
  *   Allow 1 minute of discussion, then play.
  *   *Observation:* See if they try to form sub-coalitions or if the race is now entrenched.

  ---

  ### **Part 3: The Debrief (35 Minutes)**
  *Map the game mechanics to the theory. Do not lecture; ask Socratic questions first.*

  **1. The Felt Experience (5 Mins)**
  *   *Ask:* "During the 60-second window, what was going through your head?"
  *   *Target:* "I wanted to wait to see my card." vs. "I was terrified my partner would LOCK and take everything."
  *   *Map:* This anxiety is the **Commitment Race**. The pressure to decide *before* computation (seeing the card) is complete.

  **2. The Pact Failure (10 Mins)**
  *   *Ask:* "Round 0, we agreed to WAIT. Why did it break in Round 1?"
  *   *Map:* **Credible Commitment.** A verbal promise to WAIT is cheap talk. A sealed envelope (LOCK) is a hard constraint. In a world where *anyone* can LOCK, the rational move is to LOCK first to prevent being the Sucker.
  *   *Key Insight:* The group optimum (WAIT/WAIT) is unstable because individual incentives favor defection (LOCK).

  **3. The Value of Information (10 Mins)**
  *   *Ask:* "Who here sealed their envelope and then wished they had seen their card?"
  *   *Map:* **Foregone Information.** By LOCKing, you gained bargaining power but blinded yourself. You might have demanded 8 points when the Surplus was only 5, causing a deal failure (0 points).
  *   *Key Insight:* Advanced agents race to commit *before* finishing computation. The "dumber" version of you (pre-computation) makes the decision that the "smarter" version (post-computation) has to live with.

  **4. The Equilibrium (10 Mins)**
  *   *Show:* The scoreboard. Compare Round 1 (mixed) vs Round 2 (all LOCK, lower scores).
  *   *Map:* **The Race Equilibrium.** Everyone ended up worse off (more Collisions, lower average points) because everyone was rationally trying to secure first-mover advantage.
  *   *Key Insight:* This is why we worry about AI systems. They aren't 'stupid'; they are optimizing for bargaining power. If two AIs reason this way, they lock in incompatible goals before understanding the context.

  ---

  ### **Prediction: What Will Go Wrong**
  1.  **The "Soft Lock" Loophole:** A participant might say, "I'm LOCKing, but I'll write 'Depends on my card' in the envelope."
      *   *Fix:* The TA must reject any Demand that isn't a specific integer. The envelope must contain a *binding action*, not a policy.
  2.  **Collusion/Signaling:** During the 60-second phase, players might whisper to their partner: "I'm WAITing, you WAIT too."
      *   *Fix:* Enforce strict silence during the Commitment Phase. If caught talking, that player is forced to LOCK.
  3.  **The "Spite" Defector:** Someone might LOCK with a Demand of 10 every time, just to ruin the game.
      *   *Fix:* In the debrief, frame this as "Adversarial Initialization." It highlights why we need robust protocols, not just nice agents.

  ---

  ### **Honest Limitation Note (For the Instructor)**
  **The "Self-Modification" Gap:**
  This game simulates the *incentive* to commit early, but it does not simulate the *mechanism* of self-modification.
  *   **In the Game:** You are a human choosing to seal an envelope. You retain the cognitive ability to process the info; you just voluntarily ignore it.
  *   **In Reality:** An AI committing early isn't just ignoring info; it is literally rewriting its own source code to *make it impossible* to process that info later. It becomes a "dumber" agent by design.
  *   **In the Debrief:** You must supply this distinction. Explain that in the real scenario, the agent doesn't just *choose* to blind itself; it *deletes* the function that reads the card. The horror of the commitment race isn't just ignoring data; it's that the agent that wins the race is cognitively inferior to the agent that would have existed had it waited. The game captures the *strategic pressure*, but you must verbally paint the *architectural consequence*.

  **Why this works for your group:**
  It moves the concept from "Schelling points on a whiteboard" to "sweaty palms during a 60-second timer." They will feel the rationality of the race *and* the regret of the outcome simultaneously. That cognitive dissonance is the learning objective.
