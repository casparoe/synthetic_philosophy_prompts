      5.  **The Speech-Action Reading:** Words = Fists. (The bridge).

      *Wait, I need to address the "Rights vs. Interference" question specifically.* I'll combine that into the Jurisdictional reading or make it a distinct point. Let's make it distinct because the user asked about it.
