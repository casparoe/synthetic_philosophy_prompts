      *   *Okay, I'll go with the Dad.* I will argue that **Dispositions are Indivisible.** You can't be "Honest except when it hurts." Therefore, the cost incurred in the hospice was necessary to maintain the asset.

      *   *Wait, I need to make sure I don't sound like I'm gaslighting the user.* I need to acknowledge why they feel it's irrational (no immediate payoff).
