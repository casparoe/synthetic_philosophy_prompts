  # Session Plan: The Born Rule Betting Game
  **Course:** Senior Seminar in Philosophy of Physics  
  **Topic:** The Measurement Problem & The Born Rule in Everettian QM  
  **Time:** 90 Minutes  
  **Students:** 12  

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Articulate why "counting branches" fails to recover the Born Rule statistics.
  2.  Explain the tension between self-locating uncertainty ("I am one of many") and measure ("I carry weight").
  3.  Describe the decision-theoretic move: probability as a rational betting constraint rather than an objective frequency of branches.

  ## 2. Materials Needed
  *   **The Master Ledger:** A spreadsheet or sealed envelope set containing the "Amplitude Weights" and "Branch Topology" for each round. (You alone see this).
  *   **Betting Slips:** 24 small cards (2 per student per round).
  *   **Token Currency:** 120 poker chips or similar tokens (10 per student).
  *   **Branch Markers:** 12 distinct signs or pieces of paper to label "Branch Zones" (e.g., L1–L10, R1).
  *   **Dividers:** Folders or books to prevent students in different zones from seeing each other during the sorting phase.
  *   **Projector/Board:** To record aggregate bets and payouts.

  ## 3. The Rules of the Universe
  Explain these clearly at the start (5 mins):
  1.  **You are Observer Moments:** Each student represents a future instantiation of a single observer.
  2.  **The Ledger:** I (the Instructor) hold the Master Ledger. It dictates the **Amplitude** of each outcome and the **Topology** (how many branches split off). You cannot see this.
  3.  **The Bet:** Before I sort you, you must wager tokens on which "Outcome Type" (e.g., Type L or Type R) you will find yourself in.
  4.  **The Sort:** I will assign you to a Branch Zone. You cannot communicate between zones.
  5.  **The Payout:** Winning bets are paid out based on the **Amplitude Weights** in the Ledger, *not* the number of students in your zone.
  6.  **Opacity:** While in your zone, you do not know how many other zones exist or how many students are in them.

  ---

  ## 4. Round-by-Round Timeline

  ### Phase 1: Calibration (20 Minutes)
  **Goal:** Establish trust in the simulation and the link between Amplitude and Frequency *when they align*.

  *   **Setup:** Tell students the Universe is undergoing a binary measurement with **Equal Amplitudes** ($0.5 |L\rangle + 0.5 |R\rangle$).
  *   **Topology:** 1 Branch L, 1 Branch R.
  *   **Sorting:** You physically move 6 students to Zone L, 6 students to Zone R.
  *   **Betting:** Students wager on L or R. (Expect 50/50 split).
  *   **Reveal:** Show them the Ledger. Amplitudes were equal. Branches were equal.
  *   **Payout:** 1:1 odds. Everyone breaks even or wins modestly.
  *   **Discussion (2 mins):** "This felt fair. Branch count matched amplitude count. Probability felt like frequency."

  ### Phase 2: The Collision (35 Minutes)
  **Goal:** Force a divergence between Branch Counting and Amplitude Weighting.

  *   **Setup:** Tell students the Universe is branching again. **Do not reveal amplitudes.** Do not reveal topology.
  *   **The Ledger (Hidden):**
      *   **Outcome Type L:** Total Amplitude = 0.5. **Topology:** Splits into **10 distinct branches** (L1 to L10), each with amplitude 0.05.
      *   **Outcome Type R:** Total Amplitude = 0.5. **Topology:** Remains **1 single branch** (R1), amplitude 0.5.
      *   *Note:* This is the crucial cheat. In real QM, branch number is ill-defined. Here, we define it to break the counting heuristic.
  *   **Sorting (Opaque):**
      *   You need to distribute 12 students to reflect the *Amplitude*, not the Branch Count.
      *   Send **1 student** to each of the 10 L-Zones (L1...L10). (Total 10 students).
      *   Send **2 students** to the single R-Zone (R1). (Total 2 students).
      *   *Crucial:* Use dividers. The 10 students in L cannot see each other. They each think they are alone in an L-branch. The 2 in R know they are together.
  *   **Betting:** Ask students to bet on "Type L" vs "Type R".
      *   *Prediction:* Rational Branch Counters will bet heavily on **L**. (There are 10 L-branches vs 1 R-branch. "I'm likely in one of the 10.")
      *   *Prediction:* Amplitude Counters will bet **50/50**.
  *   **The Reveal:**
      1.  Ask for a show of hands: "Who bet on L?" (Likely 8–10 students).
      2.  Reveal the Ledger: "Total Amplitude for L was 0.5. Total for R was 0.5."
      3.  **Payout:** Pay out based on Amplitude (Even Money).
      4.  **The Crash:** The 10 students in L (the majority of people) **lose**. The 2 students in R (the minority) **win**.
  *   **The Conflict (10 mins discussion):**
      *   Ask the L-Group: "You were 10 out of 12 people. 83% of the class. Why did the Universe treat you as the 50% losers?"
      *   Ask the R-Group: "You were only 2 people. Why do you claim you were 'typical'?"
      *   *Instructor Note:* Let them argue. Do not resolve it yet. They should feel that "Counting Heads" (Branch Counting) led to bankruptcy.

  ### Phase 3: Debrief & Philosophy Mapping (25 Minutes)
  **Goal:** Name the positions using the activity's pain points.

  1.  **Naive Branch Counting (The L-Group's Complaint):**
      *   *Map:* "There were 10 L-branches and 1 R-branch. I should have bet on L."
      *   *Philosophy:* This is the initial intuition in Everett. If all branches are real, surely they are equally real?
      *   *Refutation:* The simulation showed this leads to Dutch Book vulnerability (systematic loss of tokens). If you care about your future tokens, you cannot count branches.

  2.  **The Typicality/Circularity Problem (The R-Group's Defense):**
      *   *Map:* "But I *am* here in R. To me, the probability was 100%."
      *   *Philosophy:* If we say "You should expect to be in a high-amplitude branch because those are *typical*," the L-Group asks: "Who defines typical? By headcount, *we* are typical."
      *   *Point:* Defining typicality by amplitude presupposes the Born Rule. It is circular.

  3.  **Decision Theory (The Bankruptcy Lesson):**
      *   *Map:* "I didn't bet on Amplitude because I thought it was 'true.' I bet on Headcount because I thought I was a random student."
      *   *Philosophy:* Introduce the Deutsch-Wallace program. It changes the question. It's not "What is the probability?" (metaphysics). It's "What odds would a rational agent take?" (normative).
      *   *The Move:* If you want to maximize your expected payoff across all your future selves, you *must* weight by amplitude. The L-Group went bankrupt because they valued *number of selves* over *measure of existence*.
      *   *Cost:* This requires accepting that some future "yous" matter less than others, even if they are equally conscious. This is the hard pill of Everett.

  ### Phase 4: Limitations & Closing (10 Minutes)
  **Goal:** Honest meta-commentary on the simulation.

  *   **Discreteness:** "In the game, I forced there to be exactly 10 L-branches. In real QM, the number of branches is not well-defined (due to decoherence bases). You can't count them even in principle. That's why Branch Counting is doubly wrong: it gives the wrong answer, and the question is ill-posed."
  *   **The 'I' Problem:** "In the game, you were 12 different people. In QM, you are *one* person splitting. The anxiety of the L-Group ('We are the majority') is actually a category error. There is no global 'we' after the split."
  *   **Final Thought:** "The Born Rule isn't a frequency of worlds. It's a measure of how much you should care about each world."

  ---

  ## 5. Troubleshooting: What Will Go Wrong
  1.  **Students will see the Headcount:** In Round 2, the 10 students in L might realize there are many L-zones if they can see the room layout.
      *   *Fix:* Use blindfolds or have them face the wall during sorting. Hand them an envelope with their Zone ID (e.g., "L4") that they open only at their desk.
  2.  **The R-Group feels cheated:** The 2 students in R might feel they "won" only by luck, not reasoning.
      *   *Fix:* Emphasize in debrief that *anyone* betting on Amplitude would have broken even, while Branch Counters lost. It's about the strategy, not the individual outcome.
  3.  **Confusion on "Branch" vs "Outcome":** Students may conflate "Type L" with "Branch L1".
      *   *Fix:* Use distinct terminology. "Macrostate L" vs "Micro-branch L1". Write this on the board.
  4.  **Time Overrun:** The argument in Phase 2 can get heated.
      *   *Fix:* Hard stop at 55 minutes. Use a timer. Tell them: "Save this anger for the Debrief; it's data."

  ## 6. Honest Note on Limitations (For Your Closing Remarks)
  *Be explicit about what the simulation hides, so they don't leave with misconceptions.*

  1.  **Finite vs. Continuous:** We used 12 students and 11 branches. Real Hilbert space is continuous. There isn't a "number" of branches to count, even in principle. The simulation reifies branches into discrete buckets, which is exactly the mistake we are critiquing.
  2.  **The Global Perspective:** In the game, *I* (the Instructor) knew the global state. In Everett, there is no Instructor. There is only the wavefunction. The "Ledger" is the wavefunction itself, but no one is reading it from the outside.
  3.  **Identity:** In the game, Student 1 and Student 2 are distinct people. In Everett, the post-measurement observers are numerically distinct but psychologically continuous with the *same* pre-measurement person. The "bet" is not between strangers, but between your own future selves. This makes the "caring measure" point more intimate and disturbing than the token game suggests.
  4.  **Decoherence:** We treated branching as instantaneous. In reality, it's a dynamical process. The "branches" we counted in Round 2 are a fiction of the simulation; in reality, the "10 L-branches" would just be a fuzzy cloud of amplitude.

  ## 7. Instructor's Master Ledger (Secret)
  *Keep this hidden until the Reveal in Phase 2.*

  | Round | Outcome Type | Amplitude ($|\psi|^2$) | Topology (Branches) | Student Allocation |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | L | 0.5 | 1 Branch | 6 Students |
  | | R | 0.5 | 1 Branch | 6 Students |
  | **2** | L | 0.5 | **10 Branches** (0.05 each) | **1 Student per Branch** (10 Total) |
  | | R | 0.5 | **1 Branch** (0.50) | **2 Students in Branch** (2 Total) |

  *Payout Rule for Round 2:* If Outcome L occurs, pay 1:1. If Outcome R occurs, pay 1:1. (Since Amplitudes are equal).
  *Wait, if Amplitudes are equal, why do L-players lose?*
  *Correction:* The bet is "Which Type will you be in?"
  If 10 students bet on L (expecting 10/11 probability) and 2 bet on R.
  The "House" (Universe) says: "Actually, the measure was 50/50."
  The House takes all bets into a pool.
  The House pays out to the winners based on the 50/50 odds.
  Since 10 people bet on L and 2 on R, but the "truth" was 50/50...
  *Actually, simpler:* Just declare the "Winning Outcome" based on a random draw weighted by Amplitude?
  *No, in Everett, **both** happen.*
  *Revised Payout Mechanism:*
  Every student gets paid based on the **Amplitude of the branch they are in**.
  *   Students in L (10 people): Their branch has weight 0.05. Payout multiplier = 0.1x (Loss).
  *   Students in R (2 people): Their branch has weight 0.5. Payout multiplier = 10x (Win).
  *   *Wait, this penalizes being in a low-amplitude branch.*
  *   *Yes, that's the point.* If you find yourself in a low-measure branch, your "caring weight" is low.
  *   *Better:* Keep it simple.
      *   Bet: "I will be in Type L" or "Type R".
      *   Reality: Both happen.
      *   Scoring: You get points if your bet matches your location.
      *   *The Kicker:* At the end, we calculate the **Expected Score**.
      *   Branch Counters expected score: (10/12 * 1) + (2/12 * 0) = 0.83.
      *   Actual "Amplitude Score": (0.5 * 1) + (0.5 * 0) = 0.5.
      *   *This is too abstract.*
      *   *Stick to the Token Bankruptcy:*
      *   I act as the "Bookie". I accept bets.
      *   I announce: "The Universe has split. Both L and R exist."
      *   "However, the **Value** of the L-outcome is 0.5 and R-outcome is 0.5."
      *   "If you bet on L, you get paid 1 token. If you bet on R, you get paid 1 token."
      *   "BUT, I only have a total budget of 12 tokens to distribute according to Amplitude."
      *   "L-Group (10 people) shares 6 tokens. (0.6 each)."
      *   "R-Group (2 people) shares 6 tokens. (3.0 each)."
      *   "Who made the better bet?"
      *   *This works.* It shows that being in the "Majority" (Headcount) yields less reward per capita than being in the "Minority" (High Amplitude).

  *Final Plan Adjustment:* Use the **Per-Capita Payout** method in Phase 2. It viscerally demonstrates that "Measure" > "Count".
