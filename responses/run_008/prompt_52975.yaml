  Fiona endorses Chalmers' gradual replacement argument, believing functional isomorphism guarantees consciousness preservation. She undergoes "Block-Upload," where her cortex is sequentially replaced not neuron-by-neuron, but by clusters of one thousand functionally related neurons swapped for single trained recurrent silicon devices. Each device matches the cluster's aggregate input–output profile over behaviorally relevant timescales with high fidelity, ensuring global behavioral disposition remains unchanged, yet the device's internal state space is low-dimensional relative to the thousand neurons it replaces, possessing no structural correspondence to individual neuronal states or synapses. The replacement proceeds gradually, one block at a time, until the entire brain is silicon, maintaining causal efficacy at the macro-level while obliterating fine-grained structural identity, leaving Fiona to judge whether her stream of consciousness persists through a process that preserves computational topology only at a coarse resolution.

  **1. The Standard Argument and the Hidden Assumption**
  The standard gradual-replacement argument relies on the premise that each substitution step preserves the *relevant* functional organization so perfectly that any change in conscious experience would be negligible, making fading qualia absurd. In the Block-Upload, however, while macro-level I/O is preserved, the fine-grained causal topology—the specific interaction of individual neurons—is obliterated at each step. The argument generates the unwelcome verdict (survival fails or is indeterminate) if one accepts that the *relevant* functional organization for consciousness is the fine-grained neuronal dynamics rather than the coarse behavioral profile. The hidden assumption enters at the definition of "functional isomorphism": the argument tacitly assumes the grain of functional description must match the grain of the biological substrate realizing the mind. If consciousness supervenes on the fine-grain causal powers, the coarse-grain swap constitutes a massive disruption at the supervenience base, breaking the sorites chain and allowing qualia to fade despite behavioral continuity.

  **2. Biological Naturalist and Psychological Continuity**
  A biological naturalist (e.g., Searle) would conclude survival fails immediately, arguing that consciousness requires specific biological causal powers which silicon blocks lack, regardless of functional mapping. A straightforward psychological-continuity theorist (e.g., Lockean) would conclude survival succeeds, as memory, character, and behavioral dispositions remain continuous. The psychological-continuity theorist is better placed here because their criteria are explicitly insensitive to substrate grain; the functionalist, by contrast, is trapped by the ambiguity of whether "function" refers to macro-behavior or micro-causation, leaving them without a principled way to rule out the fading qualia verdict without begging the question.

  **3. The Single Feature and Its Removal**
  The single feature doing the work is the *many-to-one mapping* of substrate states (coarse-graining), where 1,000 neuronal states are collapsed into one device state. If this feature is removed—restoring a one-to-one mapping at the single-neuron level—the fine-grained causal topology is preserved alongside the macro-profile. In that case, the hidden assumption is satisfied, the "negligible change" premise holds at the presumed supervenience base, and the standard argument yields survival without ambiguity, restoring the uploader's confidence.

  **4. The Pro-Uploader Defense and Assessment**
  The strongest defense is "Level-Relative Functionalism": functional organization is defined relative to the level that supports the causal profile of cognition, and since the block-upload supports cognition, it supports consciousness. However, once granted, this defense lets in systems the pro-uploader meant to keep out, such as giant look-up tables or "China Brain" systems that mimic I/O without internal processing dynamics. By decoupling consciousness from the specific causal machinery of the substrate entirely, the defense risks trivializing consciousness, forcing the uploader to accept intuitively unconscious systems as mindful, thereby undermining the explanatory power of the functionalist theory they sought to defend.
