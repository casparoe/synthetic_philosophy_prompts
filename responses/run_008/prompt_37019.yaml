answer: |-
  Where it goes wrong
  Reject step (5). The claim that a few dollars reliably buys a marginal vote is empirically fragile. While voting carries a fixed, known probability of decisiveness (however small), campaign spending suffers from massive variance and diminishing returns. Money buys advertising, not direct vote switches, and the causal chain from dollar to decisive outcome is far noisier than the direct link between your ballot and the count. Furthermore, this efficiency varies wildly by race and cycle; assuming a stable exchange rate ignores that most spending is defensive or wasted on saturated markets. By treating campaign donations as having the same expected value per unit cost as your own vote, the argument assumes a liquidity and efficacy in political markets that doesn't exist. You can accept the duty-based EV of voting without accepting that money multiplies that EV linearly or reliably enough to outweigh proven interventions like mosquito nets.

  Why it looked fine
  Step (5) looks fine because it extends the expected value logic you already accepted. If a vote is worth millions, and money buys votes, then money is worth millions. It just appeals to leverage: why sweat for one own vote when cash buys many? It actually aligns with reality where campaigns spend heavily, implying money matters. The math really seems quite consistent: scaling input scales output. This Markets seem efficient. It also ignores the difference between buying influence and buying outcomes. Feeling like a natural extension of moral arithmetic for voting, the jump from personal duty to financial obligation seems very seamless.

  The bill
  Rejecting (5) preserves your obligation to vote (4) because your own vote's probability is intrinsic to the act, not purchased on a market. However, you pay a price: you must concede that political spending is an inefficient charity compared to global health interventions like mosquito nets. This means accepting that your dollars do more good saving lives abroad than shaping domestic policy. You lose the comforting symmetry between time and money; voting remains a civic duty, but donating becomes optional supererogation. Additionally, you must accept that political markets are irrational or saturated, meaning bad policies may persist because buying influence is hard. This creates a tension: you believe policy matters enough to vote, but not enough to fund. You pay the cognitive dissonance of acknowledging high stakes while denying the most scalable tool to address them. Finally, you forfeit the easy calculation. Without reliable dollar-to-vote conversion, you must evaluate candidates on complex qualitative grounds rather than simple EV math, increasing the burden of research without guaranteeing impact. You keep the duty but lose the leverage. This forces you to treat voting as a habit rather than strict calculation, undermining premise (1) slightly but saving your wallet. It costs theoretical consistency.

  Bottom line
  Reject the claim that money buys votes as efficiently as you cast them. This saves your wallet and keeps voting rational, but forces you to admit politics is less tractable than charity. You now retain civic duty without financial obligation, accepting that some high-impact opportunities are too noisy to pursue.
