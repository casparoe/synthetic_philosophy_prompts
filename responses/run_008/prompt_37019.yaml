      *   Another angle: The "decisive vote" probability in (2) is already incredibly small. Multiplying it by population creates a huge number, but it's fragile. If (5) claims dollars buy votes *more* efficiently than you buying your own vote with time, that requires dollars to be incredibly potent.
      *   Best break: Step (5). The efficiency of campaign spending is vastly overestimated compared to direct voting or proven charities.

