      *   *Section 3: The Structuralist Plot.* How to execute the "History Bends Back" approach without boring the reader.
          *   *Plot:* Focus on the *mechanism* of convergence. Why did the structural forces win?
          *   *Character:* Agents of structure vs. Agents of change. The tragedy of fighting the tide.
          *   *Promise:* Don't promise a new world. Promise a new *understanding* of this world.
      *   *Conclusion:* Summarize the trade-off. Structuralist AH is more tragic, less adventurous.

  6.  **Refining the Tone:**
