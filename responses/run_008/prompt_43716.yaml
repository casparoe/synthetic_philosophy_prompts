  I keep hitting the same wall with explanations of Parfit's teletransporter stuff: every summary jumps straight to the conclusion, like "Parfit says personal identity isn't what matters, psychological continuity is what matters," and nobody bothers walking through the actual argument for WHY he thinks identity can't be the thing that matters. As I understand it there's something about identity being all-or-nothing (you can't be 80% identical with someone) while psychological connectedness comes in degrees, and he uses that gap to drive a wedge between the two? And then there's the spectrum thing, where you start with ordinary survival and morph it step by step into the teletransporter case, changing one tiny detail at a time, and you're supposed to realize you can't point to any spot along the spectrum where survival definitively stops happening. Can you actually walk me thru how that argument is supposed to go, and why the all-or-nothing vs degrees thing creates a problem for saying identity just IS psychological continuity? I get the feeling people conflate "identity isn't what matters" with "identity doesn't exist" or something, so if you could disentangle those that would help too. Answer in American English plz.
