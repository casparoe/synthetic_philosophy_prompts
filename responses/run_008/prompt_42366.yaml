answer: |-
  You have a very sharp instinct. The phenomenon you are describing sits right at the intersection of epistemology (the study of knowledge), social ontology (the study of social reality), and the philosophy of action.

  To answer your headline question: Yes, there is established literature, and yes, your philosophy-major friend is telling you a true story, though the details are rich enough to warrant unpacking.

  Here is the breakdown of the names, the history, and the distinctions you are looking for.

  ### 1. The Historical Fight: James vs. Peirce

  Your friend is referring to the schism in **American Pragmatism** around the turn of the 20th century.

  *   **The Charming Psychologist:** This is **William James**. In works like *The Will to Believe* (1896) and *Pragmatism* (1907), James argued that for certain kinds of "live, forced, and momentous" options, we have the right to believe ahead of the evidence. More controversially, he suggested that truth is not a static property but something that *happens* to an idea. For James, "the true is the name of whatever proves itself to be good in the way of belief." In your coworker example, James would argue the belief becomes true *because* it leads to a successful outcome (friendship).
  *   **The Grumpy Mathematician:** This is **Charles Sanders Peirce**. Peirce actually founded Pragmatism, but he was horrified by how James popularized it. Peirce felt James made truth too subjective, too dependent on individual satisfaction. To distance himself from James's version, Peirce published a paper in 1905 announcing he was renaming his own doctrine **"Pragmaticism."** He famously wrote that he chose the word because it was "ugly enough to be safe from kidnappers."
  *   **The Core Disagreement:** Peirce insisted that truth is what would be agreed upon by the community of inquirers in the long run, regardless of what any single person believes *now*. James was more willing to say that an individual's belief can help *create* the truth in the present.

  ### 2. The "Pregnancy" Objection

  Your friend's analogy about pregnancy is a classic Realist critique of Pragmatism. The most famous proponent of this view was the British logician **Bertrand Russell**.

  Russell reviewed James's book *Pragmatism* in 1908 and tore it apart. His argument was exactly what you intuited: building a theory of *all* truth on beliefs that influence their own outcome is a category error. Russell argued that for the vast majority of propositions (like the number of craters on the moon, or whether you are pregnant), the truth is **mind-independent**.

  If you believe you are pregnant, that does not make you pregnant. If you believe the moon has craters, that does not put craters there. Russell's point was that Pragmatism takes a special, limited class of beliefs (social or agential ones) and tries to stretch them to cover *all* reality. He called this a confusion between the *nature* of truth and the *tests* of truth. Just because a belief works (is useful) doesn't mean it is true in the correspondence sense.

  So, to answer your specific worry: Yes, philosophers have made that exact objection. It is the standard Realist counter-attack against Pragmatism and Social Constructionism.

  ### 3. Naming the Phenomenon

  You are right to feel that "self-fulfilling prophecy" is too sociological and "performative" is too linguistic. In contemporary philosophy, this family of beliefs is discussed under a few different labels depending on the mechanism:

  **A. Self-Verifying Beliefs (Epistemology)**
  This is the technical term for a belief that causes its own truth. However, philosophers often distinguish between:
  *   **Causal Self-Fulfillment:** (Your Coach/Runner case). The belief causes an action (training), which causes the result (finishing). The belief didn't make the runner fast directly; it motivated the work.
  *   **Constitutive Self-Fulfillment:** (Your Bank Run case). The belief *is* part of the fact. The bank fails *because* people believe it fails. There is no intermediate "training" step; the collective belief constitutes the reality.

  **B. Performativity (Social Ontology)**
  You mentioned hearing this regarding utterances (J.L. Austin's "I do" at a wedding). However, philosophers like **John Searle** extended this to beliefs and social facts. Searle argues that institutional facts (money, marriage, borders) exist only because of **collective intentionality**.
  *   **The Bank Run:** This is a case of **Institutional Fact**. The bank is solvent only because we collectively believe it is. When that belief vanishes, the solvency vanishes. This is distinct from the coworker case.
  *   **The Coworker:** This is a **Brute Fact** created by agency. Her friendship is a real psychological state, but it wasn't "constituted" solely by the belief; it was caused by the interaction.

  **C. Reflexivity (Philosophy of Finance/Social Science)**
  The investor George Soros, drawing on philosophy, coined the term **Reflexivity** to describe exactly your bank run scenario. He argues that in social systems, participants' views influence the situation, and the situation influences the participants' views. This creates a feedback loop that doesn't exist in natural sciences (like the moon craters).

  ### 4. Distinguishing Your Cases

  You asked if the bank run is the same phenomenon as the coworker. Most philosophers of social science would say **no**, and the distinction matters for your theory of truth.

  1.  **The Coworker/Coach (Individual Causal Efficacy):**
      *   **Mechanism:** Belief $\rightarrow$ Action $\rightarrow$ Outcome.
      *   **Philosophical Category:** Philosophy of Action.
      *   **Truth Status:** The belief was technically *false* (or at least unproven) at the moment you held it. You believed she *would* love lunch. At that second, she didn't love it yet. Your action made the prediction come true. This is **Prophecy**, not immediate truth.

  2.  **The Bank Run (Collective Constitutive Efficacy):**
      *   **Mechanism:** Belief $\rightarrow$ Outcome (No intermediate action required other than the withdrawal which is the expression of the belief).
      *   **Philosophical Category:** Social Ontology.
      *   **Truth Status:** The belief is **Constitutive**. The bank's solvency *is* the confidence in the bank. In this specific ontological niche, the belief *is* the truth-maker.

  3.  **The Moon Craters (Mind-Independent Reality):**
      *   **Mechanism:** None.
      *   **Philosophical Category:** Metaphysical Realism.
      *   **Truth Status:** Correspondence. The belief is true only if it matches the territory.

  ### 5. Summary and Recommendation

  If you want to read more on this, here is the roadmap:

  *   **For the History:** Read William James's *The Will to Believe* and C.S. Peirce's *How to Make Our Ideas Clear*. Look for Bertrand Russell's 1908 review of James's *Pragmatism* for the "pregnancy/moon" style objection.
  *   **For the Terminology:** Look into **John Searle's** *The Construction of Social Reality*. He explains why money and bank runs work differently than mountains and molecules.
  *   **For the Specific Mechanism:** Search for literature on **"Doxastic Efficacy"** or **"Self-Verifying Beliefs."**

  **The Verdict:**
  Your intuition is correct. You cannot build a theory of *all* truth on the coworker/bank cases. That was James's temptation, and it was Peirce's and Russell's primary objection. The "pregnancy" objection holds: there is a hard boundary between **social reality** (which is belief-sensitive) and **brute physical reality** (which is belief-insensitive).

  The proper philosophical stance is usually a hybrid: **Pragmatic Realism**. We acknowledge that in the social sphere (banks, friendships, marriages), our beliefs are performative and constitutive. But we acknowledge that in the physical sphere (craters, pregnancy, gravity), truth is a matter of correspondence, regardless of how much "working" our beliefs do.

  The sleepless nights can end: The distinction you sensed is the central fault line of 20th-century philosophy, and you have mapped it correctly.
