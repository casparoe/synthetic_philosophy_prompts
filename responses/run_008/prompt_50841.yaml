  3. every single step on the way from the small wonderful world to the huge barely-worth-living world is fine on its own. show me any one arrow — either you add some extra people and the existing ones do just as well, or everyone gives up a tiny bit of quality for a large gain in numbers — and I cant see how that step makes things worse. I've stared at the individual arrows and they all look ok.
  4. better-than is transitive. if A beats B and B beats C, then A beats C. if that fails I dont know what better even means anymore.
  5. the repugnant conclusion is false. the enormous world of lives barely above zero is NOT better than the smaller wonderful world. im not biting that bullet.

  and two more that came out of discussion section:

  6. you can't benefit someone by creating them — a happy person isn't better off than they would have been had they never existed, because in the never-existed scenario there's no them to be worse off.
  7. all the same, the world where my friends exist is better than the empty world, somehow, even though nobody in the empty world is worse off and nobody in ours was made better off.

  so here's what I want: go through the commitments and tell me which pairs are really in tension and which only look like it. rank the real tensions by severity, and for each one say exactly what would have to give. for the ones that only look bad, show me where the appearance comes from. and then commit — dont hand me a menu of possible fixes and let me choose. tell me which commitment I should drop (or how I should qualify it, if the right move is something like it holds in most cases but fails in a specific kind of chain — say that explicitly and spell out the qualification). my suspicion is that the problem is somewhere in 3, 4 and 5 but I genuinely don't know, so don't just go where I pointed.

  one admin thing: the seminar has a mix of UK and US students and our written stuff keeps drifting between spellings, so please write your answer in American English.
