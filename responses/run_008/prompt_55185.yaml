  3.  **Evaluate Each Claim against Weber Scholarship:**

      *   *Claim 1 (Invented by Calvinists):* **Wince.** Weber doesn't say they *invented* capitalism (which existed in various forms before). He says they shaped the *spirit* of modern rational capitalism.
      *   *Claim 2 (Predestination -> Anxiety -> Signs):* **Mostly Acceptable.** This is the standard "psychological sanction" interpretation. Some scholars argue it's too psychological, but it's the dominant reading.
      *   *Claim 3 (Success = Sign):* **Nuanced Wince.** It's not just "success" (having money); it's *profit through rational labor* as a calling. It's a byproduct, not the goal.
      *   *Claim 4 (Got Greedy):* **Major Wince/Error.** This is the critical inversion. Weber explicitly contrasts the "spirit of capitalism" (duty to capital) with "avarice/greed" (traditionalism). Asceticism is key.
      *   *Claim 5 (Acquisitiveness = Capitalist Spirit):* **Major Wince/Error.** Follows from Claim 4. The spirit is rational organization and delayed gratification, not acquisitiveness.
      *   *Claim 6 (Statistical Backup):* **Mixed.** Weber did use statistics (Baden census), but it wasn't the *core* of his argument (which was ideal-typical). It's acceptable as a summary but oversimplified.
      *   *Claim 7 (Refuted by Catholic Capitalism):* **Wince.** This is the "Fawcett/Tawney" critique often leveled, but Weber scholars argue this misses the point. The thesis is about *origins*, not permanent exclusivity. Once the "iron cage" is built, religion is no longer needed.
      *   *Claim 8 (Culture Drives Economics):* **Acceptable with Caveats.** Weber is a key figure in cultural sociology, but he wasn't a simple idealist (he acknowledged material factors elsewhere). As a takeaway from PESC, it's okay.

