  ### 6. Facilitator Cheat Sheet: Key Scripts

  **When explaining the payout:**
  > "This cash is yours. It is not a deposit. If you take it and never drink the water, you have won the game according to the rules. The only thing you might lose is your pride. That is the experiment."

  **When someone argues semantics:**
  > "We are not solving the definition of intention tonight. We are testing if we can act *as if* we have it. Write down what you think you will do. That's the only intention that matters."

  **When closing the session:**
  > "Go home. Put the money in your wallet. Look at it tomorrow morning when you fill the bowl. That is the moment the puzzle happens. I want to hear about that specific feeling in the follow-up."

  ### Final Safety Note
  Ensure the ice water is not *dangerously* cold (no dry ice, just freezer ice). 90 seconds is the limit. If someone pulls their hand out early, they still get to keep the money (no penalty), but they must report it honestly in the video. Honesty is the only variable you can't enforce, which is exactly the point.
