  9.  **Final Polish:** Check tone. Needs to be professional, sharp, and prepared. (Proceeds to generate output).

      *Wait, one more check on the "Weakest Joint".* The prompt asks *me* to identify the weakest joint in *their* position that *they* should shore up.
      *Thesis:* Promisee has directive authority.
      *Weakness:* The "Normative Power" magic. How does the power arise? If it arises from the practice, Hume wins. If it arises from rational nature, Kant wins. If it's brute, it's mysterious.
      *Better Weakness:* The "Revocable" aspect. If I can release you at any time, is it an obligation or a permission? How does this distinguish from a mere prediction?
      *Best Weakness:* The *source* of the power. The "Normative Power" is the black box.

      *Let's finalize the "Praying Nobody Asks" question.* It should be the one that exposes the circularity of "Normative Power."
