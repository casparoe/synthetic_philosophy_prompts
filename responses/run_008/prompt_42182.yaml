  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Promissory Obligation.
      *   **Thesis:** Promising involves exercising a normative power granting the promisee temporary, revocable directive authority over the promisor's future conduct (a "say" over conduct).
