answer: |-
  # Q&A Prep Sheet: Promissory Obligation & Directive Authority

  **Thesis:** Promising exercises a normative power granting the promisee temporary, revocable directive authority over the promisor's conduct.
  **Audience:** 2 Kantians, 1 Humean Conventionalist, 1 Formal Decision Theorist.

  ---

  ### 1. The Kantian Objection (Autonomy & Alienation)
  **The Objection:** "You claim the promisor grants the promisee 'directive authority' over their will. But for Kant, the will is the source of law, not subject to external legislation. By handing over the 'say' over your future conduct, aren't you engaging in a form of **moral alienation**? You are treating your rational agency as a thing to be transferred, rendering your future action **heteronomous** rather than autonomous. How can I bind myself to *your* will without violating the Categorical Imperative?"

  **The Reply (2 mins):**
  "I appreciate the worry about heteronomy, but we must distinguish between *submitting* to another's will and *authorizing* another to hold one to a self-imposed law. When I promise, I am not surrendering my agency to a master; I am exercising my agency to create a new normative relation. The authority you hold over me is not inherent to you; it is derivative of *my* act of promising. I legislate the rule that you may hold me to this specific maxim. Thus, when I fulfill the promise, I am not obeying you; I am obeying the law I gave myself, which included a clause granting you standing to enforce it. This preserves autonomy because the source of the obligation remains the promisor's own rational will, merely structured to include the promisee's oversight."

  *   **Concession:** I concede this only works for permissible promises. I cannot grant you authority to direct me to do something immoral, as my autonomy cannot legislate against the Moral Law itself.
  *   **Shore Up:** Be ready to define the limits of this "transfer." If I can't promise to commit a crime, is the authority limited by morality or by the scope of the promise?

  ### 2. The Humean Objection (Convention & Epiphenomena)
  **The Objection:** "This 'normative power' smells like magic. You say the authority grants the obligation, but where does the authority come from? It floats in a vacuum. In reality, this authority is **epiphenomenal** on the social **practice** of promise-keeping. Without the convention that 'saying I promise creates an expectation we are obliged to meet,' your words are just noise. You're treating the shadow cast by the practice as the object itself. The obligation is sustained by the utility of the convention, not by this metaphysical 'say' you've postulated."

  **The Reply (2 mins):**
  "I agree that without a practice, the *signal* would fail. But we must distinguish the *medium* of communication from the *normativity* of the act. The practice explains how we recognize that a promise has been made (the syntax), but it doesn't explain why breaking it *wrongs the promisee* specifically (the semantics). If obligation were just practice-sustaining utility, then breaking a promise to a forgotten person (where no practice is undermined) would be permissible. My view explains that the *practice* allows me to transfer the authority, but the *wrong* consists in violating the authority I actually transferred. The practice is the vehicle, not the engine."

  *   **Concession:** I concede that the *recognition* of the authority is practice-dependent. You can't exercise this power in a state of nature without shared linguistic norms.
  *   **Shore Up:** The "Forgotten/Dead" case. If the practice requires mutual expectation, how does the authority persist when the promisee is dead to the world? You need to clarify that the *right* persists even if the *expectation* fades.

  ### 3. The Decision Theorist Objection (Operationalization & Circularity)
  **The Objection:** "I need to **operationalize** this. You say the promisee holds 'directive authority.' How do I identify the holder of this authority without already knowing the obligation exists? If you define the authority by the obligation, and the obligation by the authority, you're running a **circular definition**. In game-theoretic terms, where is the **equilibrium**? What payoff structure makes it rational for me to recognize your 'power' rather than ignore it as cheap talk?"

  **The Reply (2 mins):**
  "It's not circular if we identify the authority functionally, via **standing**. We can operationalize 'holding authority' as 'having the unique standing to complain or waive the requirement without third-party interference.' If A promises B, and C complains, B can say 'This isn't your business.' That exclusion of third parties is the operational marker of the authority. As for rationality: recognizing this power solves a coordination problem. It allows agents to secure future cooperation without costly monitoring. The 'payoff' is the ability to enter into binding agreements that expand the set of feasible cooperative strategies. It's rational to recognize the power because doing so grants you access to the benefits of promising."

  *   **Concession:** I concede this doesn't reduce normativity to payoff. It shows that recognizing the norm is *compatible* with rational choice, not that the norm *is* the choice.
  *   **Shore Up:** The "Third Party" distinction. Be prepared to explain why a third party *cannot* waive the promise. Is it logical or just conventional?

  ---

  ### The Weakest Joint (Shore This Up)
  **The Vulnerability:** **The Mechanism of Transfer.**
  You claim the promisor "grants" authority. But how does a speech act transfer a normative property?
  *   **The Attack:** Both the Kantian and the Humean will converge here. The Kantian will ask how a mental act changes normative reality; the Humean will ask why this isn't just a description of the convention.
  *   **The Fix:** Stop treating the "Normative Power" as a *thing* that moves. Frame it as a **change in status**. Use the analogy of property rights: I don't hand you a physical object when I give you a gift; I change our normative relations regarding the object. Be explicit that "Normative Power" is a label for the *capacity to effect these status changes*, not a metaphysical substance.

  ### The Question You're Praying Nobody Asks
  **"If the promisee has the authority to release you from the obligation at any time, is the obligation actually binding, or is it merely a permission you've granted them to demand performance? If they can dissolve the duty at will, haven't you just described a scenario where the promisor remains the ultimate sovereign of their own will, rendering the 'obligation' illusory?"**

  *   **Why it's dangerous:** It collapses your distinction between "obligation" and "permission." If I can let you off the hook whenever I want, your duty exists only at my sufferance. This threatens to make the "obligation" nothing more than a prediction of what you'll do unless I say otherwise, which plays right into the Decision Theorist's hands (it's just a coordination game) and the Humean's (it's just a convention).
  *   **Emergency Defense:** "The obligation is binding *until* released. The power to release doesn't negate the duty; it negates the *enforcement* of the duty. I am still bound to perform unless you exercise your power. The existence of an off-switch doesn't mean the machine wasn't running." (Risky, but it's the best you have).
