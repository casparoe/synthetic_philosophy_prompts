      *   *Claim:* "Behavioral tests are mimicry."
      *   *Audit:* If the mimicry is perfect, does the distinction matter? (Chinese Room argument). But LLMs generalize out-of-distribution in ways parrots don't.
      *   *Verdict:* The "Parrot" label is doing too much heavy lifting. It assumes "no semantics" implies "no structure." That's false. You can interpret the *syntax* and the *mechanism* of the mimicry even if you deny the *semantics*.
