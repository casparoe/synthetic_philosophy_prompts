answer: |-
  **Decision Tree: Diagnosing Democratic Backsliding**

  **Start Case:** An incumbent packs the constitutional court, uses rulings to weaken media regulators and election administration, but continues holding elections it could theoretically lose.

  **1. The Symmetry Test**
  Would you apply the label "democratic backsliding" if the opposing party executed these exact institutional changes?
  *   **No:** → **Leaf (d): Deflationist View.** The term is a partisan weapon used to condemn outcomes rather than processes. Retire the concept in favor of specific complaints.
  *   **Yes:** → Proceed to Q2.

  **2. The Arena Test**
  Did these measures formally eliminate the possibility of the incumbent losing office via election (i.e., is the arena closed)?
  *   **Yes:** → **Leaf (a): Competitive Elections View.** Backsliding is defined by the closure of the electoral arena. (Note: If elections remain held, this view diagnoses *no* backsliding).
      *   *Literature Flag:* This leaf is largely **unoccupied** in contemporary backsliding literature. Scholars rarely argue erosion requires full arena closure; that is typically classified as "breakdown" or "autocratization," making this view **unattractive** for studying gradual erosion.
  *   **No:** → Proceed to Q3.

  **3. The Normative Criterion**
  Is the primary harm the *cumulative trajectory of executive power* or the *substantive status of citizen equality*?
  *   **Trajectory of Power:** → **Leaf (b): Executive Aggrandizement View.** Backsliding is diagnosed via the accumulation of incremental institutional weakenings, none individually disqualifying.
  *   **Status of Equality:** → **Leaf (c): Equality/Non-Domination View.** Backsliding occurs if state power is used to dominate opponents, even if election rules remain formally competitive.

  ***

  **Separation Note:** This tree cleanly separates (d) from the rest via symmetry. It separates (a) from (b)/(c) via the Arena Test. However, (b) and (c) may overlap in practice, as aggrandizement often produces domination.

  **Critique Note**
  This tree is most likely to mislead at the first branch, assuming actors can honestly answer the symmetry test without self-deception. A critic would argue the diagnostic approach fails because the "facts" of the case (e.g., was the court packing legitimate?) are themselves contested theoretical judgments, not neutral inputs. If a real-world case broke this tree, it would be where institutional changes are claimed to *enhance* democracy by one side and *erode* it by the other, rendering the Symmetry Test useless.
