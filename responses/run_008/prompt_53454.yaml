      *   *Trade-offs:* Discuss how #1 is high importance/high tractability, #2 is high neglectedness.
      *   *Evidence to watch:* What would change the ranking? (e.g., if 2025-2030 is calm, #1 drops).
      *   *Confidence Flags:* Use [High/Medium/Low Confidence] markers.
