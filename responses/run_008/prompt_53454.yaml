          2.  **Causal Mechanism of Elite Overproduction.** Is it the driver or the symptom? Needs structural modeling.
          3.  **Proxy Robustness/Data Quality.** If the inputs are garbage, the model is garbage. A modeler can test sensitivity here.
          4.  **Contingency/Scale.** Philosophical but can be modeled via sensitivity analysis.

      *   *Refining for the User:* The user is an epidemiologist. They understand *transmission dynamics*. Cliodynamics often treats instability like a pressure cooker (thermodynamic) rather than a pathogen (contagion).
      *   *New Angle:* **The Transmission Mechanism.** How does "structural stress" become "violence"? In epi, it's contact rates. In history, is it mobilization networks? This is a great niche for an epi modeler.

