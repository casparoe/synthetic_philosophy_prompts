  12. **Final check on Confidence Flagging:** I need to make sure I distinguish between "this is what the literature says" and "this is my synthesis." I will use bracketed tags like `[High Confidence]` or `[Speculative]` within the text or a summary section. The prompt asks to "flag your confidence as you go." I will integrate this into the narrative flow.

