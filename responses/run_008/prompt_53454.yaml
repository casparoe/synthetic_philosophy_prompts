  6.  **Fleshing out the Reasoning (The "Why"):**
      *   *Rank 1 (Transferability):* If the parameters don't map to GDP/services/gig economy, the model is a period piece. Tractability: High (public data). Importance: Critical.
      *   *Rank 2 (Transmission):* Turchin describes *pressure*, not *spread*. An epi modeler knows pressure doesn't explode without a vector. This is neglected. Tractability: High (ABM).
      *   *Rank 3 (Causality):* Harder to prove. Endogeneity problems. Important, but maybe too muddy for a clean decade of work.

  7.  **Addressing Confidence & Uncertainty:**
      *   Need to be careful not to sound like I'm validating Turchin uncritically.
      *   Need to admit where cliodynamics is thin.
