      *   *Section 4: Design Implications.* If we swapped the theories? If we used real Stoicism, we'd discuss *justice* and *role ethics*. If we used the Trichotomy (Irvine), we'd discuss *influence*. The current design excludes these to maintain the status quo.
      *   *Conclusion:* The program is philosophically shallow but organizationally rational. The user is right to feel the tension.

  6.  **Refining the "Committed Position":**
