      *This works.* It explains why the Wage book feels different (it's social science/structural history, not "from below" in the humanistic sense). It explains why the King book is admired (good history) but not eligible (wrong subject). It explains why the Welfare book failed (didn't recover subjectivity).

  5.  **Addressing the Test Case (Pandemic Diaries):**
      *   *Scenario:* Crowd-sourced diaries, edited, no argument, no connection to outside context.
      *   *Application:*
          *   Subject: Ordinary people (Pass).
          *   Source: First-person voice (Pass).
