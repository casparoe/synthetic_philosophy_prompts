answer: |-
  **Structure Plan**

  1.  **Scene 1: The Clinic.** Elara works on an MRI reconstruction. Establish the visual metaphor: bodies are not wholes, but stacks of axial slices. The software creates the illusion of continuity.
  2.  **Scene 2: The Archive.** Home. The Sunday Project. 11 years of photos. The rupture point (Week 573). The visual discrepancy between Pre-Stroke Arthur and Post-Stroke Arthur.
  3.  **Scene 3: The Argument.** Mark pushes for a visit. He uses endurantist language ("He's still in there," "He's fighting"). Elara uses perdurantist logic ("That's not him," "It's a new segment").
  4.  **Scene 4: The Physics.** Reference to Arthur's old obsession with Einstein and synchronized clocks. The realization that there is no privileged "now" where the whole person exists.
  5.  **Scene 5: The Visit.** Elara visits the care facility. She interacts with the post-stroke father not as a changed man, but as a distinct entity linked by causality.
  6.  **Ending.** No reconciliation of views. Elara accepts the discontinuity. The story leans 4D: the "person" is a spacetime worm, and the stroke severed it.

  ***

  **The Z-Axis**

  The software called it *Volume Rendering*, but Elara knew it was a lie. On her dual monitors, a human liver didn't exist until she stitched it together. She scrolled through the axial slices—hundreds of grayscale moons stacked in the z-axis. Slice 402 showed a cyst; Slice 403 showed nothing. There was no single moment where the liver was wholly present. It was only a sum of parts distributed across space.

  She clicked *Render*. The machine hummed, interpolating the gaps, creating a smooth, rotating illusion of wholeness. It was a ghost made of math.

  At home, the hard drives hummed louder.

  Eleven years of Sundays. 572 portraits. Her father, Arthur, seated in the same wingback chair, the light from the west window hitting his left cheekbone. Elara had started the project when she was twenty, a study in aging. She wanted to see how a man accumulated time.

  Then came Week 573. The stroke.

  In the photo, Arthur's left side had slumped. The light hit the same cheekbone, but the flesh beneath had forgotten how to hold itself up. In the video interview attached to the file, the man who had once lectured her on the double-slit experiment for an hour stared at the lens and said nothing. He drooled.

  "He's still in there, El," Mark said, standing in the doorway of her study. He held two mugs of tea. "The doctors say the aphasia is expressive. He understands us."

  Elara scrolled to Week 500. Arthur was laughing, mid-joke, hands blurred by motion. She scrolled to Week 573. Static.

  "The doctors treat biology," Elara said, not turning around. "They don't treat identity. If I delete slices 400 through 500 of a scan, the liver isn't damaged. It's a different liver."

  "He's not a liver." Mark set the tea down. The steam rose, a temporary vertical column. "He's your father. He persists."

  "Persist implies a substance that remains unchanged while properties alter," Elara said. She finally turned. "How can one thing be loquacious at t1 and mute at t2? If he's wholly present at both times, he contradicts himself. He can't be both talkative and silent."

  "People change, El. That's what people do."

  "People don't change. Temporal parts differ." She tapped the screen. "This man in Week 573 is causally connected to the man in Week 572, but he isn't him. They are distinct stages of a spacetime worm. The worm kinked. You want to visit the old segment. It's gone."

  Mark rubbed his face. "This is grief. You're turning him into data so you don't have to feel the loss. You're hiding behind the z-axis."

  "Relativity says there is no privileged present, Mark," Elara snapped. "Dad taught me that. There is no universal 'now' where Arthur exists as a complete unit. You're insisting on a Newtonian absolute time that doesn't exist. You want him to be wholly present *here*, but he's spread out over eleven years."

  "So you're just not going to see him?"

  "I'm going to see who is there."

  The care facility smelled of antiseptic and overcooked carrots. Arthur sat in a wheelchair by the window. The light hit his left cheekbone. It was the same angle as the photos, but the context had collapsed.

  Mark rushed in, kneeling beside the chair. "Hey, Artie. Look who came. It's El."

  Arthur turned his head slowly. The movement was mechanical, hydraulic. He looked at Mark, then at Elara. His eyes were clear, dark brown, the same iris pattern as Week 1. But the look behind them was vacant of the specific history that formed Elara.

  "Hi, Dad," Elara said. She didn't kneel. She stood at the foot of the wheelchair, observing the cross-section of him.

  Arthur made a sound. A grunt.

  "He's trying," Mark whispered, intense, desperate. He grabbed Arthur's hand. "We love you. We know you're fighting."

  Elara watched Mark holding the hand. Mark believed he was holding the hand of the man who taught him to throw a curveball. Elara saw him holding the hand of a stage that existed only in this room, at this coordinate. Mark was grieving a ghost; Elara was meeting a stranger.

  She remembered her father's voice, years ago, explaining simultaneity. *If two events are separated in space, whether they happen at the same time depends on who is asking.*

  To Mark, the man in the chair and the man in the wingback were simultaneous—they were the same entity occupying different times. To Elara, they were separated by a light cone that had closed.

  "Does he know us?" Elara asked.

  "Sometimes," Mark said. "He squeezed my hand yesterday."

  Arthur looked at Elara. He raised his right hand. He pointed at her chest, then tapped his own temple.

  "What is he doing?" Mark asked.

  Elara stepped closer. She saw the friction in the movement. The neural pathway was damaged, rerouted. This wasn't the man who forgot words. This was a man building new ones.

  "He's not trying to remember," Elara said softly. "He's indexing."

  "El, stop it."

  "He's locating me in space," she said. She reached out and touched his shoulder. It felt solid, warm, wholly present in the tactile sense, but metaphysically distant. "Hello."

  Arthur smiled. It was a lopsided thing, unfamiliar. It didn't belong to the man in Week 500. It belonged to this slice.

  "El..." Arthur rasped. The vowel was thick.

  Mark gasped. "He said it. Artie!"

  Elara felt a cold clarity settle over her. Mark heard a victory—the persistence of the soul through the damage. He heard the endurantist promise that the core remains.

  Elara heard something else. She heard a new variable entering the equation. This sound wasn't a recovery of the past; it was a production of the present. The man who taught her physics was dead, terminated at Week 572. This man was his successor, inheriting the body but not the identity.

  She took her camera out of her bag.

  "What are you doing?" Mark asked, wiping his eyes.

  "Documentation," Elara said. She raised the lens. "Week 580."

  "Don't treat him like a project," Mark pleaded. "Treat him like your father."

  "I am," Elara said, and she clicked the shutter. The flash froze the light, slicing the moment out of the stream. "I'm treating him like what he is. A moment. Just this one."

  Arthur blinked against the flash. He didn't look hurt. He looked present.

  Elara lowered the camera. She knew Mark would go home and tell friends that Arthur was still in there, fighting the good fight. Mark needed the continuity. He needed the 3D object to survive the erosion of time. It was how love worked; it required a stable subject to latch onto.

  But Elara would go home and upload the file to the stack. She would place it after the stroke, separate from the before. She would not stitch them into a smooth render. She would leave the gap visible in the z-axis, a jagged discontinuity where the man ended and the father began.

  "Take a picture with me," Mark said, pulling his chair close to Arthur's. He put an arm around the old man. "Say cheese, Artie."

  Arthur leaned into Mark. He looked at Elara.

  Elara didn't join them. She stood behind the lens, the observer outside the system. She took the shot. In the image, Mark and Arthur were fused by affection, a single unit of love defying entropy.

  Elara knew better. She knew that when she zoomed in, pixel by pixel, she would find the edges didn't match. The light on Arthur's face was from a different time than the light on Mark's. They were never truly touching. They were just passing through the same now, briefly, before the universe moved on to the next slice.

  "Okay," Elara said, capping the lens. "That's enough for today."

  "Can we stay longer?" Mark asked.

  "No," she said. "This segment is done."

  She walked out into the hallway, where the clocks on the wall were all set to different times. She didn't check her watch. There was no point. The only time that mattered was the exposure, and that was already closed.
