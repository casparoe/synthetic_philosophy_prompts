  **Second Phase:** Elias dives for cover. Both theories predict this behavior. HOT says he dives because he experienced a threat. FOT says he dives because he believed there was a threat, regardless of exact phenomenology. The predictions do not diverge behaviorally. This case separates the theories only on the phenomenal question, not the behavioral one. We cannot verify his experience except through report, which conflates belief and experience.

  **Key Feature:** The dissociation between sensory qualia and cognitive categorization. The work is done by the mismatch between the acoustic signature (FO) and the semantic label (HO). If you remove the anxiety-induced miscategorization (e.g., he knows it's a car), FO and HO align, and the theories converge.

  **Counterattack:** The HOT theorist's best repair is "Top-Down Modulation" via Predictive Processing. They argue that generating the HO thought "gunshot" actually alters the FO state to resemble a gunshot phenomenally. If the FO state becomes shot-like, HOT survives. However, this requires empirical backing that mundane misjudgments instantly rewrite sensory qualia. An Actualist might argue the HO state only makes consciousness if the FO state exists, but misrepresentation breaks the link. However, this concedes the core HOT claim that HO determines content. If Elias later reports, "It sounded like a backfire, but I thought it was a shot," HOT collapses. In mundane cases, subjects often distinguish sensation from judgment.

  **Verdict:** FOT wins. HOT requires us to accept that phenomenology is hostage to cognitive error even when sensory detail remains distinct. In everyday introspection, we can distinguish the raw sound from our judgment of it. HOT conflates them. FOT preserves the distinction between experience and judgment. This case exposes HOT's vulnerability to misrepresentation without pathological interference.
