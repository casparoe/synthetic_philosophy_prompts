prompt: |-
  So at my school we have this committee with a few students and a few teachers called the Academic Standards Committee that votes on attendance policy and stuff, and I'm the junior rep this year. Our principal wants us to vote on a new rule next month: if you have more than 10 unexcused absences in a semester for any one class, you automatically fail that class, no exceptions, no appeals. She says the current system is too mushy because teachers all handle it differently and kids basically get lucky or unlucky depending on who their teacher is.

  The weird thing is the argument that broke out at the last meeting. My history teacher (Mr. D.) basically said no fixed line can be justified: if 9 absences is okay and gets you a passing grade, how can one more day flip you to failing? One extra missed Tuesday can't literally change whether you learned the material. And you can run the same argument down the ladder — if 9 is fine, 8 must be fine, and so on until missing zero days and missing a whole semester look the same, which is obviously nuts. But he says that means the rule is arbitrary wherever we put it, so we should stick to teacher judgment instead. The vice principal countered that every rule has this problem (like, why is the driving age exactly 16 or whatever our state says and not 16 and a day) and you can't run a school on "use your judgment" because that's exactly the mushiness we're trying to fix, plus judgment is where bias sneaks in.

  They kind of reached a stalemate and now it's on me to write something up before the next meeting since I missed the deadline for the last one lol. Can you draft the written opinion I'll circulate to the committee? It should give a clear recommendation we can actually vote on (adopt the rule as-is, reject it, or adopt some modified version — like maybe a grace period, or an appeals process, or a sliding scale of consequences instead of pass/fail), plus the reasons. Please take Mr. D's argument seriously rather than just waving it off, but also take seriously the vice principal's point that vague standards get applied unfairly. If you think there's a smarter version of the rule that keeps the fairness of a bright line while admitting the line is kind of arbitrary, I'd honestly love to hear it, because that's probly what I actually believe but I can't articulate it. Keep it short enough that people will actually read it before the meeting, maybe a page.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior Representative on the Academic Standards Committee.
      *   **Audience:** Committee members (students and teachers, including the Principal, Vice Principal, and Mr. D).
      *   **Topic:** Voting on a new attendance policy (10+ unexcused absences = automatic fail, no exceptions).
      *   **Conflict:**
          *   *Principal/VP:* Need a bright-line rule to ensure consistency and reduce bias/mushiness.
          *   *Mr. D (History Teacher):* The "Sorites Paradox" argument (if 9 is okay, why is 10 not? The line is arbitrary). Prefers teacher judgment.
      *   **Task:** Draft a written opinion/memo to circulate before the next meeting.
      *   **Requirements:**
          *   Clear recommendation (Adopt, Reject, or Modify).
          *   Take Mr. D's argument seriously (don't dismiss the arbitrariness).
          *   Take the VP's argument seriously (don't dismiss the need for consistency/fairness).
          *   Keep it short (approx. 1 page).
          *   Tone: Professional, thoughtful, student-leader voice.
          *   Goal: Break the stalemate with a "smarter version" of the rule.

  2.  **Deconstruct the Arguments:**
      *   *Mr. D's Point (Philosophical/Pedagogical):* Learning isn't binary. One day doesn't magically erase knowledge. Strict cutoffs punish marginal cases unfairly. Teacher discretion accounts for context (illness, family issues, actual mastery).
      *   *VP's Point (Administrative/Equity):* Discretion leads to inconsistency. Student A passes with 12 absences because they charm the teacher; Student B fails with 11 because the teacher is strict. This is systemic bias. We need a standard to hold everyone accountable.
      *   *The User's Intuition:* The line *is* arbitrary, but we *need* a line. The solution isn't to remove the line, but to soften the cliff edge (e.g., appeals, sliding scale).

  3.  **Develop a Recommendation:**
      *   *Option A (Adopt as-is):* Ignores Mr. D. Too harsh.
      *   *Option B (Reject):* Ignores VP. Returns to "mushy" status quo.
      *   *Option C (Modify):* This is the sweet spot. Acknowledge the need for a bright line (VP) but mitigate the arbitrariness (Mr. D).
      *   *Specific Modification Ideas:*
          *   Keep the 10-day threshold but add an appeals process (addresses "no exceptions").
          *   Change "Automatic Fail" to "Grade Penalty" or "Credit Recovery" (sliding scale).
          *   Add a "warning/intervention" step before the fail.
      *   *Best Compromise:* Keep the bright line for consistency, but allow an appeals process based on *demonstrated mastery* or *extenuating circumstances*. This satisfies the VP (standard exists) and Mr. D (individual context matters). Or, perhaps a "probation" status rather than immediate failure.
      *   *Decision:* Let's go with a "Bright Line + Safety Valve" approach. Keep the 10-day rule as the *standard*, but reinstate an appeals process where the student must prove mastery or show valid reasons. This acknowledges the line is administrative, not pedagogical.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (break the stalemate) and acknowledge the weight of the decision.
      *   **Addressing the VP (Consistency):** Validate the need for a standard. Bias in discretion is real. Students deserve to know the rules.
      *   **Addressing Mr. D (Arbitrariness):** Validate the philosophical point. 9 vs. 10 days doesn't change brain chemistry. A hard "fail" cliff is pedagogically unsound.
      *   **The Synthesis (Recommendation):** Propose the modified rule.
          *   *Rule:* 10 unexcused absences triggers a *review*, not an automatic fail.
          *   *Mechanism:* An appeals committee or teacher review where the student demonstrates mastery.
          *   *Why:* It keeps the bright line (VP) but acknowledges the arbitrary nature of the cutoff (Mr. D).
      *   **Closing:** Call to action for the next meeting.

  5.  **Refining the Tone:**
      *   Needs to sound like a responsible student leader, not a rebellious teen or a bureaucrat.
      *   Respectful to teachers and admin.
      *   Clear and concise.
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm just trying to let kids skip class. Emphasize *learning* as the goal. Ensure the "appeals" isn't just a loophole but a rigorous check.

  6.  **Final Polish:**
      *   Check length. (Keep it tight).
      *   Check constraints. (Did I address Mr. D's Sorites paradox? Yes. Did I address VP's bias concern? Yes.)
      *   *Key Insight:* The distinction between an *administrative* rule and a *pedagogical* judgment. The attendance rule is administrative; the grade should reflect learning.

  7.  **Final Review against constraints:**
      *   Clear recommendation? Yes (Modified version).
      *   Take Mr. D seriously? Yes (acknowledged the arbitrariness).
      *   Take VP seriously? Yes (acknowledged bias/consistency).
      *   Short enough? Yes (aiming for ~400-500 words).

  *(Self-Correction)*: Wait, the prompt asks for a "written opinion I'll circulate." It should look like a memo or a position paper. I will format it as a formal memo.

  *(Refining the Recommendation)*: Instead of just "appeals," maybe suggest that the 10th absence triggers a *mandatory meeting* and a *cap on the grade* rather than an automatic zero. But the prompt suggests "Adopt, Reject, or Modify." Let's stick to "Modify with an Appeals Process based on Mastery." This directly answers Mr. D's "did they learn the material?" point.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Academic Standards Committee
  **FROM:** [Your Name], Junior Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed Attendance Policy (Rule 10-F)

  **Purpose**
  This memo outlines my recommendation regarding the proposed policy: *"10+ unexcused absences in a semester results in automatic course failure, no exceptions."* After reviewing the debate between the administration and faculty, I recommend we **modify the rule** rather than adopt or reject it outright.

  **The Conflict**
  We are stuck between two valid concerns.
  1.  **Consistency (VP's Point):** The current system relies too heavily on teacher discretion. This creates equity issues where students face different consequences for the same behavior depending on who teaches them. A bright-line rule ensures every student knows the standard and is held to the same accountability.
  2.  **Pedagogy (Mr. D's Point):** A hard cutoff is philosophically flawed. As Mr. D noted, the difference between 9 and 10 absences does not magically erase learning. An automatic fail suggests attendance *is* the grade, rather than a factor in it. If a student misses 11 days but masters the material, failing them contradicts the purpose of school.

  **Recommendation: The "Bright Line with a Safety Valve"**
  We should adopt the 10-absence threshold as an **administrative trigger**, but remove the "no exceptions" clause.

  **Proposed Policy:**
  *   **The Standard:** 10 unexcused absences triggers a mandatory academic review.
  *   **The Consequence:** The student is placed on "Attendance Probation." The default outcome is a failing grade *unless* the student successfully appeals.
  *   **The Appeal:** The student may petition to pass by demonstrating **mastery of the material** (e.g., passing a comprehensive exam or completing a capstone project) regardless of attendance.

  **Rationale**
  This compromise respects both sides of the stalemate:
  *   **For the Administration:** It keeps the bright line. Every student hits the same wall at 10 absences. It eliminates the "mushiness" of teachers simply ignoring absences. The burden of proof shifts to the student to show why they should pass.
  *   **For the Faculty:** It acknowledges Mr. D's argument that grades should reflect learning, not just seat time. If a student can prove they learned the material despite absences, the school validates that learning. It prevents the arbitrary punishment of a student who had a rough semester but caught up academically.

  **Conclusion**
  A rule without exceptions is easy to enforce but hard to justify. A rule with too much discretion is fair in theory but biased in practice. By making the 10-day mark a trigger for review rather than an automatic sentence, we maintain consistency while ensuring our grades actually measure academic standards.

  I move we vote on this modified version at the next meeting.
