answer: |-
  You have independently reconstructed one of the most enduring and sophisticated debates in modern metaphysics. Your intuition that the dispute feels "stalled" is shared by many professional philosophers, and your hypothesis—that the disagreement might rest on divergent definitions of "exists"—is one of the leading diagnostic theories in the field.

  In academic terms, the "only-now view" is generally called **Presentism** (or the **A-Theory** of time), and the "all-times view" is called **Eternalism** (or the **B-Theory** of time).

  Here is a diagnosis of the disagreement, broken down by the three possibilities you raised: verbal, substantive/empirical, and psychological.

  ### 1. Is it a Verbal Dispute?
  Your hypothesis is that Presentists and Eternalists are using the word "exists" differently. In philosophy, this is often discussed under the label **Quantifier Variance**.

  *   **The Presentist Quantifier:** When a Presentist says "Caesar does not exist," they mean "Caesar is not in the domain of the *present* quantifier." For them, to exist is to be *actual* in the current moment.
  *   **The Eternalist Quantifier:** When an Eternalist says "Caesar exists," they mean "Caesar is in the domain of the *unrestricted* quantifier." For them, to exist is simply to be part of the spacetime manifold, regardless of temporal location.

  If this were *purely* verbal, the two sides could agree on all the physics and all the human experiences, and simply say, "You define 'existence' narrowly, I define it broadly."

  **Why it might not be just verbal:**
  Most metaphysicians argue that if the dispute were merely verbal, it would be trivial. But the disagreement has consequences for other areas of philosophy.
  *   **Truthmakers:** If I say "Caesar crossed the Rubicon," what makes that statement true *now*?
      *   The **Eternalist** says: The event itself, located at a different time coordinate, makes it true.
      *   The **Presentist** says: Since the event doesn't exist, there must be special "past-tensed properties" of the present world that make the statement true.
  *   **Modality:** How do we handle possibility and necessity? Eternalism meshes easily with certain views of logic; Presentism requires more complex machinery to explain how we can talk meaningfully about the past if it isn't "there."

  **Diagnosis:** The dispute is *partially* verbal, but not *merely* verbal. The different definitions of "exists" track different commitments about the **structure of reality**. They are arguing over which logical framework best maps onto the world, not just how to use a word.

  ### 2. Is there a Hidden Empirical Question?
  You noted that Relativity seems to favor Eternalism, but Presentists have replies. This points to a concept called **Underdetermination**.

  *   **The Physics:** Special Relativity (SR) destroys the idea of a universal "now." If two observers moving at different speeds disagree on whether two distant events are simultaneous, there is no physical fact of the matter about what is "present." This is the "Rietdijk–Putnam argument."
  *   **The Metaphysical Retreat:** A committed Presentist can accept SR as a description of *measurements* but insist there is a hidden, metaphysical "absolute present" that physics cannot detect (similar to the Lorentzian interpretation of ether).

  **Diagnosis:** There is no hidden empirical question that will settle this, because metaphysics is designed to be resilient against empirical falsification.
  *   If physics says "no universal now," the Presentist says, "Physics describes appearance; metaphysics describes reality."
  *   If phenomenology says "time flows," the Eternalist says, "Phenomenology describes cognitive processing; metaphysics describes reality."

  The stalemate exists because both sides are willing to pay a "theoretical cost." Presentists pay the cost of contradicting the spirit of Relativity; Eternalists pay the cost of calling the flow of time an illusion. Neither cost is high enough to force a surrender.

  ### 3. Is it Bedrock Intuition?
  This is likely the strongest factor in the stalemate. The philosopher Wilfrid Sellars distinguished between the **Manifest Image** (the world as humans experience it) and the **Scientific Image** (the world as physics describes it).

  *   **Presentism** prioritizes the **Manifest Image**. The feeling of passage, the openness of the future, and the fixedness of the past are taken as primary data. To deny them feels like denying consciousness itself.
  *   **Eternalism** prioritizes the **Scientific Image**. The mathematical coherence of spacetime and the lack of a privileged reference frame are taken as primary data. To deny them feels like denying objective reality.

  **Diagnosis:** The disagreement is fundamentally axiological (about values). It is a clash over which "data" is more trustworthy: our internal experience of agency and change, or our external measurement of space and time. Because neither side is willing to discard their primary data, the argument cycles indefinitely.

  ### 4. What does the "Century of Non-Movement" signify?
  You asked if the lack of progress is itself evidence. In meta-philosophy, a century of stalemate on a specific question usually suggests one of three things:

  1.  **The Question is Ill-Posed:** This supports your "verbal dispute" hypothesis. It suggests we are asking "What is the *true* meaning of existence?" when we should be asking "Which model of existence is more *useful* for this specific purpose?"
  2.  **Cognitive Limitation:** It may be that human cognition is incapable of resolving the tension between the Manifest and Scientific images. We are evolved to navigate a "present," but we live in a "block." We may lack the cognitive architecture to reconcile them intuitively.
  3.  **Equilibrium:** It suggests the arguments are perfectly balanced. For every argument from physics, there is an argument from phenomenology. This implies the truth might involve a synthesis we haven't found yet (e.g., "Growing Block" theories, or "Moving Spotlight" theories, which try to hybridize the two).

  ### 5. What Would Count as Progress?
  Given this diagnosis, here is what progress would look like, ranked from most to least likely:

  *   **Conceptual Replacement (Most Likely):** Progress will come not from answering "Which view is true?" but from dissolving the question. This is the **Deflationary** approach. Philosophers might conclude that "existence" is not a property that time has, but a feature of how we model time. We would stop asking "Does the future exist?" and start asking "Is a 4D model or a 3D model more effective for solving problems in physics/ethics/logic?"
  *   **Cognitive Science (Possible):** If neuroscience can fully explain the "feeling of passage" as a specific cognitive artifact (like a frame-rate in a video game), it would undercut the Presentist's primary intuition. It wouldn't prove Eternalism, but it would remove the "bedrock intuition" supporting Presentism.
  *   **New Physics (Unlikely):** A theory of Quantum Gravity might change our understanding of time fundamentally (e.g., if time is emergent rather than fundamental). However, metaphysicians are adept at adapting to new physics, so this would likely shift the debate rather than end it.
  *   **Semantic Precision (Ongoing):** Sharpening the definition of "exists" helps, but as noted, it rarely ends the debate because both sides claim their definition captures "reality" better.

  ### Summary Diagnosis
  The dispute is **substantive but framework-relative**.

  It is not *merely* verbal, because the two views imply different structures of truth and causality. However, it is not *empirically* decidable, because both sides can accommodate the evidence by adjusting their auxiliary hypotheses.

  The stalemate is evidence that you are witnessing a clash between two incompatible **conceptual frameworks**.
  *   The **Presentist Framework** optimizes for **agency and experience**.
  *   The **Eternalist Framework** optimizes for **physical coherence and logic**.

  **Verdict on the Dispute:** You are correct that the definition of "exists" is the pivot point, but changing the definition doesn't dissolve the argument because the definition is tied to what each side values most in a theory of reality.

  **Verdict on Progress:** The most productive path forward is likely **pluralism**. Instead of asking which view is "True," philosophy is increasingly moving toward asking: "In what contexts is the Presentist model useful (e.g., ethics, law, psychology), and in what contexts is the Eternalist model useful (e.g., cosmology, logic)?"

  You have not missed a solution; you have correctly identified that the engine of the debate is running in neutral. The "work" being done is not solving the puzzle, but refining our understanding of why the puzzle is so hard to solve.
