answer: |-
  You should reject Step (5), because it mistakenly equates falsifiability with the logical impossibility of reconciliation rather than the methodological prohibition of ad hoc rescue.

  Steps (2) and (3) are actually the strongest links in your friend's chain, representing the Duhem-Quine thesis which is logically sound: no theory faces evidence alone, and logically consistent auxiliary hypotheses can always be concocted to absorb anomalies (e.g., "the neutrino detector was haunted," or "our understanding of time is locally warped"). Rejecting these would require denying well-established logic and history of science, so they are poor escape routes. Step (1) is Popper's starting definition, but Step (5) is where that definition is weaponized against itself by importing the logical holism of (3) into the criterion for falsifiability. Step (5) looks plausible initially because it appeals to a naive intuition about contradiction—that if a theory is false, there must be a fact that simply cannot coexist with it. However, this ignores Popper's crucial distinction between *logical falsifiability* (the structure of the theory) and *methodological falsification* (the rules scientists agree to follow).

  By rejecting (5), you accept that while you *can* logically save any theory (per Step 3), you are not *scientifically permitted* to do so if the save is ad hoc (i.e., if it reduces the theory's testability rather than increasing it). Popper's demarcation criterion was never just about logical form; it included a set of methodological rules forbidding conventionalist stratagems. The cost of this move is admitting that science is not a purely logical machine that grinds out truth from data, but a normative practice reliant on human decisions about what counts as a "legitimate" auxiliary hypothesis. This concedes some ground to your sociology friend regarding the theory-ladenness of observation, but it prevents the slide into total relativism.

  Once the dust settles, Popper survives, but not as the naive falsificationist of introductory textbooks. He survives as a critical rationalist who argues that demarcation is a boundary of *behavior* and *method*, not just propositions. Astrology remains unscientific not because it is logically impossible to save it from counter-evidence, but because its practitioners systematically immunize it against criticism using moves that physics forbids. Demarcation lives, but it is a fuzzy boundary maintained by scientific culture rather than a sharp line drawn by logic alone.
