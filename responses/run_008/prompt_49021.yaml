  8.  **Final Polish:** Ensure the tone is supportive but rigorous. The user is an academic entering a clinical space; the advice needs to bridge that gap without selling out the theory. (Self-Correction: Make sure the "Concession" parts are very clear so the user doesn't overpromise).

  9.  **Drafting the Content:** (Mental check of the "Social Worker" section). The prompt asks: "Tell me whether that is an objection I can answer in the room or one I should concede and build into the talk."
