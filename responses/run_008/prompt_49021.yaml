      *   **User's Thesis:** Care ethics isn't a 5th principle or rival decision procedure, but a *reordering of relevant features* (focus on dependency, relationships, attention) rather than just autonomy/beneficence balancing.
      *   **Running Example:** Elderly ventilated patient, devoted/exhausted daughter insisting "do not withdraw."
      *   **Goal:** A Q&A sheet with ~6 likely objections, phrased in *their* vocabulary (clinical/casework), ordered by potential damage. Needs 2-minute replies, candid notes on weaknesses/concessions, specific handling of the Social Worker's justice worry, and the "Nightmare Question" (the vulnerable point in the example).

  2.  **Deconstruct the Thesis vs. Audience:**
      *   *Tension:* Principlism offers clear action-guidance (balance A, B, C, D). Care ethics offers a lens/sensibility. The Chair wants a recommendation *now*.
      *   *Risk:* If Care Ethics looks like "just be nice" or "feelings matter," they will dismiss it. If it looks like it ignores justice (Social Worker's point), it's dangerous. If it ignores legal risk (Attorney), it's liable.
      *   *Strategy:* Frame Care Ethics as *improving the accuracy of the Principlist application* rather than replacing it. It provides better data for the balancing test.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Chair):* Action-Guidance. "This is nice, but how does it tell me what to write in the chart?"
