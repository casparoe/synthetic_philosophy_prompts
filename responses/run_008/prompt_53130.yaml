      Let's refine the "Sinking Objection." It's the Skeptic's claim that the *second layer* is just as determined/unchosen as the *first layer*. If the "practical character" is constituted by reflective activity, and the *capacity* for that activity is unchosen, then the output is unchosen. The user needs to explain why *activity* escapes the *nature* trap. The Skeptic will say "Your activity is determined by your nature." That's the sinker.

