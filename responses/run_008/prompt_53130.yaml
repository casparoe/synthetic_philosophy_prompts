answer: |-
  # Workshop Prep Sheet: Layered Reply to the Basic Argument

  **Project:** Defending responsibility via a distinction between *base-level dispositions* (unchosen origins) and *practical character* (reflectively maintained agency).
  **Core Concession:** Galen Strawson is right about origins (*causa sui* is impossible).
  **Core Claim:** Responsibility attaches to the maintenance/revision layer, not the origin layer. The regress stops because it targets historical genesis, not current ownership.

  ---

  ### 1. The BA Skeptics (The "Regress Restart")
  **Who:** The two incompatibilists in the room.
  **Likely Phrasing:** "You've drawn a line between 'base dispositions' and 'practical character,' but you haven't explained why the regress stops at the line. The capacity for reflective revision *is itself* a disposition you didn't choose. If your practical character is the product of a reflective mechanism you didn't design, then you aren't responsible for the character any more than you are for the temperament. You've just pushed the *causa sui* requirement up one level. The regress restarts."

  **2-Minute Reply:**
  "I concede the capacity for reflection is unchosen. But the Basic Argument conflates *having* a mechanism with *exercising* it. Strawson demands I be responsible for the *source* of my nature. I'm claiming responsibility is a relation to the *current operation* of that nature.
  Think of it like tenancy. I didn't build the house (base dispositions), and I didn't even choose the maintenance tools (reflective capacity). But I am responsible for the state of the house *now* because I am the one actively maintaining it. The regress attacks the history of the tools; it doesn't touch the fact that I am currently wielding them to sustain my character. Responsibility is about current governance, not historical authorship. If I am actively revising or sustaining a trait, I own it, even if the ability to do so was given to me."

  **Where this is soft:**
  I'm asserting a distinction between *mechanism* and *exercise* without proving that *exercise* isn't determined by the *mechanism*. If my "active wielding" is causally determined by the unchosen capacity, the Skeptic will say I'm still just a conduit, not an owner. I need a stronger account of agency that isn't just "causal flow."

  ---

  ### 2. The P.F. Strawson Person (The "Reactive Attitudes" Naturalist)
  **Who:** The Wittgensteinian/Optimist.
  **Likely Phrasing:** "This 'ownership' condition feels like metaphysical overkill. Why posit a second layer of 'practical character'? Isn't responsibility just a fact about our social practices? If you are an appropriate target of the reactive attitudes—resentment, gratitude—then you are responsible. Your 'ownership' sounds like an attempt to ground those attitudes in something internal, but aren't you just describing what happens when we *do* hold someone responsible? You're circular."

  **2-Minute Reply:**
  "It's not circular; it's normative. P.F. Strawson tells us *that* we hold people responsible, but he doesn't give us a criterion for *when* it's fair to do so. We need to distinguish between manipulation, psychosis, and normal agency.
  My 'practical character' layer provides that criterion. We withhold reactive attitudes when the link between the agent and the action is broken (e.g., coercion). My layer explains *why* the link is broken: the practical character wasn't sustaining the action. So, I'm not replacing the reactive attitudes; I'm explaining the internal conditions that make those attitudes appropriate. Without this layer, we can't distinguish between a well-programmed robot that acts 'nicely' and an agent who maintains their niceness."

  **Where this is soft:**
  The P.F. Strawson person might argue that "appropriateness" is just defined by the attitudes themselves, not an internal layer. If I claim the layer *makes* the attitudes appropriate, I risk stepping back into the metaphysical trap I tried to avoid. I need to ensure I don't sound like I'm seeking a "god's eye view" of responsibility.

  ---

  ### 3. The Frankfurtian (The "Hierarchical" Compatibilist)
  **Who:** The believer in identification and wholeheartedness.
  **Likely Phrasing:** "This looks like a watered-down version of identification. Frankfurt says you need to be wholehearted about your first-order desires. You're saying you just need to be 'maintaining' them. But what if I reflectively maintain a bad character? What if I endorse my envy? On your view, I'm responsible. But Frankfurt would say I might still be alienated if the endorsement isn't deep enough. You've made responsibility too easy. You've lost the 'self' in 'self-government'."

  **2-Minute Reply:**
  "Frankfurt's model is structural; mine is activity-based. Frankfurt worries about whether the higher-order desire *matches* the lower-order one. I worry about whether the agent is *doing the work* of agency.
  If I reflectively maintain my envy, I am indeed responsible for it on my view. That's a feature, not a bug. If I am actively sustaining a vice, I own the vice. Frankfurt's 'wholeheartedness' risks an infinite regress of desires (do I desire to desire to desire?). My view stops at the activity. If I am engaging in reflective maintenance, I am acting as an agent. The depth of endorsement matters less than the fact of engagement. I'm not looking for psychic harmony; I'm looking for agency."

  **Where this is soft:**
  Frankfurtians will press on *alienation*. If I maintain a trait due to unchosen psychological compulsions (e.g., I *must* reflectively endorse my envy to avoid anxiety), is that really "activity"? I need to show my "maintenance" isn't just another determined psychological event.

  ---

  ### 4. The Kantian (The "Reasons-Responsiveness" Theorist)
  **Who:** The rationalist.
  **Likely Phrasing:** "You keep talking about 'reflective activity,' but you haven't said what reflection is *for*. Is it just tinkering? If your second layer doesn't track objective reasons, it's just arbitrary self-management. Responsibility requires normative competence. If your 'practical character' is maintained reflectively but ignores reasons, you're just a consistent psychopath. Where does reasons-responsiveness enter your layer?"

  **2-Minute Reply:**
  "Reasons-responsiveness is the *mode* of the reflective activity, not a separate condition. To reflect is to weigh reasons. My argument isn't that *any* maintenance generates responsibility, but that the *capacity* for reasons-responsive maintenance is what constitutes the second layer.
  However, I'm resisting the Kantian demand that I be responsible for *having* that capacity. I only need to be responsible for *using* it. The Basic Argument says I can't be responsible for having the rational nature. I agree. But I am responsible for how I steer that nature. The regress tries to make responsibility depend on the *source* of my rationality. I'm saying it depends on the *direction* I give it."

  **Where this is soft:**
  If the capacity for reasons-responsiveness is unchosen (which it must be), the Kantian will argue that the *output* of that capacity is also unchosen. If my rational nature determines my reflection, I'm not "steering" anything. I risk conflating "rational causation" with "free agency."

  ---

  \answer{The BA Skeptics (The "Regress Restart")}
