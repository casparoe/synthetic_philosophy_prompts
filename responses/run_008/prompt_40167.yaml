  # JOINT STATEMENT ON INFINITE ETHICS AND AGGREGATION PRINCIPLES

  **Date:** October 26, 2023
  **Parties:** Adversarial Collaboration on Population Ethics (Camp A: Additive Totalism; Camp B: Lexical Asymmetrism)
  **Facilitator:** [Name Redacted]

  ## 1. Agreed Claims (Mathematical and Structural)

  Both parties endorse the following technical and structural claims as accurate descriptions of the current debate state.

  1.  **Undefined Sums:** In an infinite world where welfare values do not converge absolutely, the "total welfare" is mathematically undefined within the standard real number system. It is not zero, not infinity, and not negative infinity; it is non-computable via standard summation.
  2.  **Ordering Dependence:** Any method that recovers a value for such a world by imposing an ordering (spatial, temporal, or causal) yields results that are sensitive to that ordering. Both parties agree that without an objective, non-arbitrary justification for a specific ordering, the resulting value is representation-dependent.
  3.  **Hyperreal Limitations:** Extensions using hyperreal numbers or surreals can assign values to some divergent series, but this requires choosing a specific ultrafilter or valuation scheme. Both parties agree this choice is not dictated by the welfare facts alone and introduces new normative assumptions.
  4.  **Causal Discounting:** Discounting welfare by causal reach or distance can render sums finite, but both parties agree this functions by effectively ignoring distant welfare, which changes the ethical theory rather than solving the aggregation problem for the original theory.
  5.  **Paralysis Definition:** "Infinitarian Paralysis" is defined here as the inability of an ethical theory to rank two actions where both result in infinite positive value (or infinite negative value) under the theory's standard aggregation rule.

  ## 2. Disagreements Table

  The following table outlines the core substantive disagreements. Wording has been vetted to ensure each party accepts the description of their own view.

  | Topic | Camp A (Additive Totalism) Position | Camp B (Lexical Asymmetrism) Position |
  | :--- | :--- | :--- |
  | **Source of Infinity Problems** | The problem is representational. Welfare is additive, but standard calculus is insufficient for infinite domains. The "undefined" sum is a gap in our math, not a gap in value. | The problem is ontological. Additive aggregation is a finite-domain approximation that fails to capture the structure of value, which is inherently hierarchical regarding suffering. |
  | **Lexical Stability** | Lexical priority rules will eventually encounter infinite ties (e.g., infinite agents at the same worst suffering level), leading to a new form of paralysis indistinguishable from the original problem. | Lexical priority remains well-defined provided the set of suffering levels is well-ordered. Even with infinite agents, the *quality* of the worst suffering determines rank, not the *count* of sufferers. |
  | **Status of "Undefined"** | An undefined total indicates we haven't found the right extension (e.g., hyperreals) yet. Moral truth exists even if current math returns `NaN`. | An undefined total indicates the question "what is the sum?" is category error. The correct question is "what is the lexicographic profile?" |
  | **Unbounded Suffering** | If suffering intensity has no lower bound (no "worst possible state"), the lexical view loses its anchor and cannot generate a ranking. | The view assumes suffering is bounded below or discrete. If suffering is continuous and unbounded, the view requires modification, but this is a technical detail, not a refutation. |

  ## 3. Cruxes and Predictive Cases

  The following cruxes identify the specific points where resolution would significantly shift confidence. Each includes a thought experiment designed to bear on the crux, with pre-committed predictions.

  ### Crux 1: Map vs. Territory (The Nature of Undefinedness)
  **Question:** Is the undefinedness of an infinite sum a property of our mathematical representation (Camp A) or a signal that additive value does not exist in that configuration (Camp B)?

  *   **Thought Experiment: The Isomorphic Maps.**
      *   *Setup:* Consider two infinite universes, $U_1$ and $U_2$. They contain identical distributions of welfare agents. However, in $U_1$, we index agents by integers ($...-1, 0, 1...$) and sum in standard order. In $U_2$, we index the *same* agents using a bijection that rearranges the order of summation.
      *   *Standard Math:* $Sum(U_1) = +\infty$, $Sum(U_2) = -\infty$ (via Riemann rearrangement).
      *   *Camp A Prediction:* A correct ethical theory should assign the *same* value to $U_1$ and $U_2$ because the physical facts are identical. The divergence proves standard summation is the wrong tool, not that value is undefined.
      *   *Camp B Prediction:* The divergence proves that "total value" is not a coherent property of the universe. The only coherent property is the lexical profile, which remains invariant under re-indexing because it looks at the set of values, not the sum.

  ### Crux 2: Lexicality as Disguised Aggregation
  **Question:** Is lexical priority a fundamentally different axiology, or merely a non-archimedean aggregation rule that suffers from similar infinity problems?

  *   **Thought Experiment: The Plateau of Pain.**
      *   *Setup:* Two worlds, $W_{Lex1}$ and $W_{Lex2}$. In both worlds, there are infinitely many beings experiencing the exact same "worst possible" level of suffering (intensity $-100$). In $W_{Lex1}$, there are also infinitely many beings at $-99$. In $W_{Lex2}$, there are no beings at $-99$, but infinitely many at $-50$.
      *   *Camp A Prediction:* The Lexical view cannot distinguish $W_{Lex1}$ and $W_{Lex2}$ because the "worst" set is identical and infinite. It collapses into paralysis, proving it is just an aggregation rule that fails on infinite ties.
      *   *Camp B Prediction:* The Lexical view can distinguish them by looking at the *measure* or *distribution* of the second-worst class, or by asserting that reducing the *duration* of the worst suffering (even for infinite agents) is a valid move. The view does not paralysis; it refines the comparison.

  ### Crux 3: The Unbounded Floor (Specific to Camp B's Claim)
  **Question:** Does the Lexical view require a metaphysical bound on suffering to function?

  *   **Thought Experiment: The Deepening Pit.**
      *   *Setup:* A world where for every agent suffering at level $-n$, there exists another agent suffering at level $-(n+1)$. There is no "worst" suffering, only an infinite descent.
      *   **Camp A Prediction:** The Lexical view fails to refer. "Minimize the worst" has no target. The view is silent.
      *   **Camp B Prediction:** The view applies a limit condition or infimum rule. It prioritizes the *set* of agents below a threshold. It remains well-defined by targeting the "tail" of the distribution rather than a specific minimum agent.

  ### Crux 4: Evidential Weight of Intuitions
  **Question:** Do human intuitions about infinity (e.g., "adding good is always better") carry evidential weight, given evolutionary finitude?

  *   **Thought Experiment: The Finite Shadow.**
      *   *Setup:* Agents are asked to compare a finite world with high suffering vs. an infinite world with the same local suffering but infinite copies.
      *   **Camp A Prediction:** Intuitions about "betterness" persist even in infinite cases (e.g., "curing someone is good regardless of infinity"). These intuitions track moral truth, not evolutionary heuristics.
      *   **Camp B Prediction:** Intuitions in infinite cases are noise. We should discard intuitions that lead to paradox and rely on structural consistency (like lexical ordering) even if it violates finite intuitions.

  ## 4. Verbal Dispute Analysis

  A portion of the disagreement is identified as verbal/semantic regarding the term **"Aggregation."**

  *   **Camp A Usage:** "Aggregation" refers to *any* function that maps a profile of individual welfare values to a ranking of worlds. Under this definition, Lexical Priority *is* an aggregation rule.
  *   **Camp B Usage:** "Aggregation" refers specifically to *summative* or *averaging* operations where values are fungible and tradeable. Under this definition, Lexical Priority is *not* aggregation; it is a sorting procedure.
  *   **Resolution:** Both parties agree that if Camp A's definition is used, Camp B's view is a subset of aggregation theories. However, Camp B insists the *functional behavior* is distinct enough (non-fungibility of suffering) to warrant a separate category. This document will treat them as distinct classes for clarity, noting that mathematically they both map profiles to orderings.

  ## 5. Statement on "Immunity" to Infinite Paralysis

  *Per the request of the Asymmetrist position, the following records the specific status of the "Immunity Claim."*

  **Claim:** "The Lexical Asymmetrist view possesses immunity to Infinitarian Paralysis that the Additive Totalist view lacks."

  **Joint Record:**
  1.  **Camp A Concession:** Camp A acknowledges that the Lexical view is immune to paralysis *specifically caused by the divergence of additive sums*. That is, the Lexical view does not need to calculate a convergent sum to rank worlds.
  2.  **Camp A Contention:** Camp A maintains that this immunity is **instrumental, not fundamental**. Camp A argues the Lexical view encounters functionally equivalent paralysis when faced with infinite ties at the highest-priority level (e.g., infinite agents at the exact same worst suffering level).
  3.  **Camp B Contention:** Camp B maintains that the immunity is **fundamental**. Camp B argues that infinite ties at a suffering level do not induce paralysis because the view can operate on the *proportion* or *causal accessibility* of those agents without summing their welfare.
  4.  **Agreed Conclusion:** The Lexical view avoids *Sum-Convergence Paralysis*. It is currently an open empirical question within this collaboration whether it succumbs to *Lexical-Tie Paralysis* in cases of infinite identical suffering.

  ## 6. Confidence and Uncertainty

  **Confidence Assessment:**
  *   **High Confidence:** The mathematical claims regarding Riemann rearrangement and the undefined nature of conditionally convergent series in standard reals.
  *   **Medium Confidence:** The claim that Lexical views face "Tie Paralysis" (Camp A's objection). This depends on whether the Lexical view can be formalized to handle infinite sets of identical values without collapsing.
  *   **Low Confidence (Vibes):** The evidential weight of intuitions in infinite cases (Crux 4). Both sides acknowledge this is largely philosophical preference at this stage.

  **Single Point of Greatest Uncertainty:**
  The formalizability of the Lexical View under **"Unbounded Below"** conditions (Crux 3).
  *   *Why:* Camp B asserts the view stays well-defined even if suffering has no floor. Camp A asserts this is mathematically impossible without arbitrary cutoffs. Neither party has produced a formal proof in this document demonstrating a well-ordering of a set that is unbounded below. If suffering is truly unbounded (no infimum), Camp B's "minimize the worst" instruction may fail to refer. This is the weakest link in the Asymmetrist's claim of general immunity.

  ***

