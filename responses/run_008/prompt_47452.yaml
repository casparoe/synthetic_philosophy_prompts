  3.  **Ethical Safety:** Overturning 9 to "No" places the burden of proof on the designers. They must demonstrate the agent has *intrinsic* goals (homeostasis) rather than *instrumental* goals (reward maximization). This prevents moral panic over standard RL while leaving the door open for true synthetic sentience.

