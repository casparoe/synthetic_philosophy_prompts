  **THE BUREAU OF NOCTURNAL NARRATIVE DISTRIBUTION (BNND)**
  **Customer Service Notice: Wake-Triggered Playback Protocol (v.4.2)**

  **To:** All Account Holders
  **Date:** 14 October 2023
  **Subject:** Clarification Regarding Sleep-State Experience and Cassette Selection

  Dear Valued Sleeper,

  Following the recent migration to our Denettian Streaming Architecture, the BNND has recieve'd an influx of queries regarding the timing and provenance of your nightly narrative packages. Please consult the following Frequently Asked Questions before submitting a ticket.

  **1. When exactly is my dream composed?**
  Under current terms of service, no experiential content is generated during the sleep state. Sleep is a blackout period. Your narrative cassette is compiled instantaneously at the moment of waking. The sensation of having 'dreamt all night' is a standard metadata tag included in the playback file to ensure narrative cohesion. Please do not adjust your set; nothing was experienced during unconsciousness.

  **2. Why does my dream always involve my alarm clock?**
  This is a feature, not a bug. The stimulus that terminates your sleep (e.g., alarm, bladder pressure, partner snoring) acts as the commissioning agent. The Bureau's algorithm selects a pre-recorded cassette from the library that best explains the intrusion. If you wake to a fire alarm, you will be issued a dream wherein you are surrounded by fire. This ensures a seamless transition from sleep to wakefulness.

  **3. I am a lucid dreamer. I experienced content during sleep.**
  Claims of 'lucid dreaming' are classified as playback errors or user fraud. The BNND maintains that experiencing content during the sleep state is a category error. If you recall being aware during the night, you are merely recalling a narrative constructed at wake-up that *says* you were aware. We do not authorise playback during business hours (sleep). Repeated claims may result in account suspension.

  **4. Can I request a refund for a poor dream?**
  Refunds are unavailable. Furthermore, please note that the submission of a complaint requires a dream report. By providing a report, you furnish the only acceptable evidence that delivery occured. Therefore, any complaint filed constitutes proof of successful service. You cannot claim non-delivery using the product itself as evidence.

  ***

  **CORRESPONDENCE LOG: TICKET #892-B**

  **From:** N. M. (Philosophical Oversight Committee)
  **To:** BNND Support
  **Subject:** Grammatical Confusion Regarding 'Experience'

  To whom it may concern,

  Your entire operation rests on a linguistic mistake. You treat 'I dreamt' as a description of an internal event that might or might not have happened, rather than understanding that the report itself is the criterion for the dream. You haven't discovered a theory about when dreams happen; you've confused the grammar of 'dreaming' with the physics of 'recording'. To say 'I dreamt but nothing happened' is nonsense. You are redefining the concept to suit your infrastructure.

  **From:** BNND Support
  **To:** N. M.
  **Subject:** RE: Grammatical Confusion Regarding 'Experience'

  Dear Mr. M.,

  Thank you for your feedback. We appreciate your engagement with our unfalsifiability clause. You are correct that the report is the sole criterion. However, our terms stipulate that if the report is the only criterion, then no fact of the matter exists prior to the report. Consequently, our model remains robust against empirical disconfirmation. We are proud to announce that our service is logically immune to criticism of this nature. Whether you dreamt or not is determined by whether you tell us you did, and since you told us you did, we successfully supplied the narrative at waking. Your objection has been logged as a confirmed delivery.

  Kind regards,

  **The BNND Customer Care Team**
  *"You slept, we supplied."*

  ***

  *Please note: All cassettes are destroyed upon full awakening. Retention of dream fragments beyond 15 minutes is the responsibility of the user.*
