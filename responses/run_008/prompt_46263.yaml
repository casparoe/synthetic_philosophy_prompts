prompt: |-
  I've never taken a philosophy class, so bear with me. For about two years now I've been turning over this question of whether you're obligated to vote for the lesser evil, and I've finally got my position worked out, and I've been invited to present it at our monthly discussion group, which is scarier than it sounds because these people argue for fun.

  Here's my view in short. The usual trap is: either your vote is a tiny drop in the ocean, in which case it doesn't matter who you pick, or voting is about expressing who you are, in which case voting for someone you despise just to block someone worse is a kind of lie. I think both framings are wrong, and here's my alternative: when you vote you shouldn't ask "what does my one vote cause?" but "what would be right for everyone in my situation to do?" And there's a real difference between those questions, because with millions of people in your situation, the rule "vote for the worst option on the ballot that can actually win, and stay home if you can't stomach that" produces a different world than the rule "vote your heart or stay home." So even though my individual ballot changes almost nothing, I'm still doing the right or wrong thing, the same way (I think) you can be one of a hundred litterers and still each of you litters. From this I conclude that voting lesser evil is usually required, not just permitted, unless the two evils really are close enough that the difference washes out.

  The group, so you know who's coming at me. It's about fifteen people at someone's house, mostly professionals, no academics, but they've all done their reading and they love numbers. Three of them matter most. There's Dan, a statistician type who has actually looked into how close elections are decided by one vote (basically never) and thinks the whole thing comes down to expected value, and he'll do the arithmetic out loud if nobody stops him. There's Priya, who has voted Green in every election since forever and thinks a lesser-evil vote is how you keep getting offered nothing but evils -- to her, the "everyone in your situation" move is exactly backwards, because the situation we're trying to change is the one where millions of people feel forced to vote for the lesser evil. And there's Marcus, who doesn't vote at all and considers it the only honest position; he also thinks my littering analogy is terrible and will tell me so. The rest are persuadable but quiet.

  What I want from you is a prep sheet. List the objections these three (and maybe a couple from the quiet ones) will actually raise, in rough order of how much damage each could do to my case, each phrased the way that person would say it, with a reply I can actually deliver in two minutes without a blackboard, and a note on where the reply is shaky. Also tell me what I should just concede up front so I look like someone who's thought about it rather than someone who hasn't. And include the question I'm quietly hoping nobody asks, because somebody will. I'd rather find out now than on Thursday.

  One more thing: don't give me a reading list. The talk is in four days and I don't have time to read anything, I just need to survive the room.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Non-philosopher, self-taught thinker, presenting to a discussion group in 4 days.
      *   **Topic:** Moral obligation to vote for the "lesser evil."
      *   **User's Position:** Kantian/Rule-Utilitarian hybrid. Focus on "what would be right for everyone in my situation to do?" rather than individual causal impact. Analogy: Littering. Conclusion: Usually obligated to vote lesser evil unless differences are negligible.
      *   **Audience:** 15 people, professionals, love numbers/arguments.
      *   **Key Antagonists:**
          *   *Dan:* Statistician, Expected Value (EV) focus, individual impact is near zero.
          *   *Priya:* Strategic/Expressive voter, votes Green, believes lesser-evil voting perpetuates the binary system.
          *   *Marcus:* Abstainer, integrity focus, hates the littering analogy.
      *   **Constraints:** No reading list (too late), need a prep sheet, objections phrased as they would say them, 2-minute replies, note shakiness, concessions to make, and the "dreaded question."
      *   **Tone:** Practical, sharp, respectful of the intelligence of the room, acknowledging the user's novice status but firm on their logic.

  2.  **Deconstruct the User's Argument:**
      *   *Core:* Generalization Principle (Kantian-ish) / Rule Consequentialism.
      *   *Premise 1:* Individual causal impact is irrelevant to moral duty.
      *   *Premise 2:* The correct maxim is "Everyone in my situation should vote to prevent the worse outcome."
      *   *Premise 3:* If everyone did that, the outcome is better than if everyone voted expressively or abstained.
      *   *Analogy:* Littering (one piece of trash doesn't ruin the park, but universal littering does).
      *   *Conclusion:* Obligation exists unless the gap between candidates is trivial.

  3.  **Anticipate Objections (The "Attack Plan"):**

      *   **Dan (The Statistician):**
          *   *Objection:* Expected Value. Probability of tipping an election is $10^{-8}$. Benefit of winning is $1,000,000. $EV = P \times B$. It's still tiny. Why bear the cost (moral compromise) for near-zero EV?
          *   *User's Counter:* Morality isn't just EV. It's about participation in a collective action.
          *   *Weakness:* Dan is mathematically right about causal power. The user is shifting the goalposts from *causation* to *complicity*.

      *   **Priya (The Third-Party Voter):**
          *   *Objection:* The Generalization fails. If everyone voted "lesser evil," third parties never grow. The "situation" includes the long-term health of democracy. Voting lesser evil locks in the two-party duopoly.
          *   *User's Counter:* Short-term harm prevention outweighs long-term structural change *usually*.
          *   *Weakness:* Hard to define "usually." When does the long-term outweigh the short-term?

      *   **Marcus (The Abstainer):**
          *   *Objection:* Littering analogy is false. Littering is intrinsically messy. Voting is a promise/endorsement. Voting for a bad candidate is lying/complicity, not just "trash."
          *   *User's Counter:* It's not endorsement; it's damage control.
          *   *Weakness:* Complicity is a strong charge. Hard to shake the feeling of "dirtying your hands."

      *   **The Quiet Ones (The "Threshold" & "Knowledge" crowd):**
          *   *Objection 1:* How do you know which is the "lesser" evil? (Epistemic problem).
          *   *Objection 2:* What if the "lesser evil" is still evil enough that facilitating their win makes you responsible for their specific bad acts?

      *   **The "Dreaded Question":**
          *   Usually something that exposes the limit of the principle. "Would you vote for a genocidal maniac to stop a slightly *more* genocidal maniac?" or "Where is the line?"

  4.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Structure:* Introduction (Mindset), Concessions, The Big Three (Dan, Priya, Marcus), The Quiet Ones, The Dreaded Question.
      *   *Tone Check:* Needs to be punchy. No jargon. "Two minutes without a blackboard."
      *   *Refining the Replies:*
          *   For Dan: Don't fight the math. Fight the *moral framework*. Math describes causation; ethics describes duty.
          *   For Priya: Acknowledge the long-term risk but prioritize immediate suffering.
          *   For Marcus: Refine the analogy. It's not littering; it's triage.
      *   *Concessions:* Admit the vote doesn't count causally. Admit the system sucks. This disarms them.
      *   *The Dreaded Question:* The "Nazi" question. It's the classic reductio ad absurdum for lesser-evilism.

  5.  **Review against Constraints:**
      *   No reading list? Check.
      *   4 days prep? Check (keep it simple).
      *   Phrased as they would say it? Check.
      *   Note on shakiness? Check.
      *   Dreaded question included? Check.

  6.  **Final Polish:**
      *   Make sure the "Generalization Principle" is explained simply if challenged.
      *   Ensure the user feels empowered but humble.
      *   *Self-Correction during drafting:* I initially thought about suggesting Utilitarianism, but the user is explicitly using a Rule-based argument ("what if everyone did this"). I need to stick to *their* logic, not import new philosophy they haven't read. Stick to the "Collective Action" framing.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Here is your prep sheet. It is designed to keep you on your feet, acknowledge the strength of their points without surrendering your own, and manage the clock.

  ### **Mindset for the Room**
  You are not claiming to have solved democracy. You are claiming to have solved *your moral relationship* to democracy. Do not let them drag you into predicting election outcomes. Keep the focus on **moral reasoning**, not political science.

  ### **Concessions (Say these early)**
  *Disarming them makes you look confident. Say these in your opening or when they first pounce.*

  1.  **Concede the Math:** "Dan is right. Mathematically, my single vote will almost certainly not change the outcome. I am not arguing that my vote is causally powerful."
  2.  **Concede the System:** "Priya is right that the two-party system is stifling. I am not arguing the system is good; I am arguing how to act within the system as it exists today."
  3.  **Concede the Discomfort:** "Marcus is right that voting for a flawed candidate feels dirty. It should. If it didn't, we wouldn't be paying attention."

  ---

  ### **The Big Three Objections**

  #### **1. Dan (The Statistician)**
  **The Objection:** "You're ignoring Expected Value. If the chance of your vote deciding the election is one in ten million, and the benefit of the better candidate is huge, the 'expected value' of your vote is still basically zero. Why incur the moral cost of voting for someone you dislike for a return that is mathematically indistinguishable from zero?"

  **Your Reply (2 mins):**
  "Dan, you're calculating the value of a *cause*, but I'm talking about the duty of a *participant*. If I see a house burning down, my single bucket of water won't put it out. The expected causal value of my bucket is zero. But if everyone says, 'My bucket won't matter,' the house burns. Morality isn't just about being the pivot point; it's about joining the collective effort that *does* work. I'm not voting to tip the scale; I'm voting to be on the side of the scale that I want to tip."

  **Where it's shaky:**
  Dan can argue that a bucket of water is physically additive, whereas votes are only additive if they cross a specific threshold. If the threshold isn't met, the "bucket" literally did nothing.
  *Defense:* "Even if the threshold isn't met, I fulfilled my duty to the collective attempt. I'm responsible for my action, not the aggregate result."

  #### **2. Priya (The Third-Party Voter)**
  **The Objection:** "Your 'what if everyone did that' test is short-sighted. If everyone in your situation voted lesser-evil, third parties would never gain traction. We would be locked into a duopoly forever. The 'right rule' for everyone is actually to vote for the candidate who represents the future we want, even if they lose now, to break the cycle."

  **Your Reply (2 mins):**
  "That's a gamble on the future to pay for safety in the present. I agree we need to break the cycle, but not when the cost of the gamble is immediate, severe harm to vulnerable people. If Candidate A will cut food stamps and Candidate B won't, voting for Candidate C to 'send a message' uses food stamp recipients as means to an end. I prioritize preventing concrete harm now over abstract structural change later, unless the two candidates are virtually identical."

  **Where it's shaky:**
  You admit a threshold ("unless they are identical"). Priya will ask where that line is. If you can't define it, she claims your rule is arbitrary.
  *Defense:* "It's a judgment call, like self-defense. You know when you're in danger. I don't need a formula to know when the stakes are too high to experiment."

  #### **3. Marcus (The Abstainer)**
  **The Objection:** "The littering analogy is garbage. Littering is intrinsically messy. Voting is an endorsement. When you pull the lever for a 'lesser evil,' you are making yourself complicit in their future bad actions. You become a partner in their administration. Abstaining is the only way to keep your hands clean."

  **Your Reply (2 mins):**
  "Voting isn't an endorsement; it's a triage tag. If a doctor treats a wounded soldier before a healthy one, she isn't 'endorsing' the soldier's war; she's prioritizing need. When I vote for the lesser evil, I am not saying 'I like this person.' I am saying 'I am responsible for stopping the worst outcome I can control.' Keeping my hands clean while the world burns isn't integrity, Marcus; it's withdrawal."

  **Where it's shaky:**
  "Complicity" is a heavy philosophical charge. If the candidate does something truly heinous, your vote *did* help legitimize them.
  *Defense:* "There is a difference between enabling and mitigating. My vote is a shield for the victims, not a sword for the candidate."

  ---

  ### **The Quiet Ones (Two likely attacks)**

  **Objection A: The Epistemic Problem**
  *"How do you know which one is actually the lesser evil? Polls are wrong. Promises are broken. You're obligating people to vote based on information they don't actually have."*
  **Reply:** "We act on the best available evidence, just like in medicine or investing. Uncertainty doesn't absolve us of the duty to try. If I have to guess which bridge is safe, I guess based on the signs, not because I'm sure."
  **Shakiness:** If the "signs" are misleading (media bias), your obligation might lead you to vote for the greater evil by mistake.

  **Objection B: The Down-Ballot Problem**
  *"Does your rule apply to President only? What about local judges or sheriffs where the 'evil' is less clear but the impact is higher?"*
  **Reply:** "The principle scales. The stakes change, but the logic holds. In local elections, the 'collective impact' of your vote is actually higher because fewer people vote."
  **Shakiness:** Local elections are often non-partisan or obscure. It's harder to apply the "lesser evil" heuristic when you don't know the candidates.

  ---

  ### **The Dreaded Question**
  *Somebody will ask this. It is the classic reductio ad absurdum of lesser-evilism.*

  **The Question:** "Okay, let's push it. Imagine the choice is between a candidate who is corrupt and incompetent, and a candidate who is a literal genocidal maniac. Your rule says vote for the corrupt one. Now imagine the choice is between a genocidal maniac and a *slightly less* genocidal maniac. Are you obligated to vote for the slightly less genocidal one? Where does the obligation stop?"

  **Your Reply:**
  "That is the limit case. My answer is yes, I am obligated to stop the greater genocide, even if the alternative is still evil. But here is the caveat I mentioned: I said this obligation holds 'unless the difference washes out.' If the difference is negligible, the obligation fades. But genocide is not negligible. However, if the 'lesser evil' is still committing atrocities, my obligation shifts from voting to resistance *after* the election. Voting is a minimum duty, not a maximum one. It stops the worst door from opening, but it doesn't mean I have to stay in the room."

  **Where it's shaky:**
  This admits that you might be obligated to support a monster. It's a "dirty hands" admission.
  *Defense:* Own it. "Yes. Preventing the worst catastrophe is the baseline of morality. It doesn't make me a fan of the winner; it makes me a responsible adult in a crisis."

  ---

  ### **Final Survival Tip**
  When they press you on the "shaky" points, do not bluff. Use this phrase:
  *"That is the hardest part of this position, and I don't have a perfect answer for it. But I'd rather struggle with that tension than accept the alternative, which is saying my actions have no moral weight at all."*

  This shows humility and keeps the focus on your core strength: **moral agency.** Good luck on Thursday.
