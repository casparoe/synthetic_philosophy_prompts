          *   **Fact Check:** Frame problem identified by McCarthy and Hayes (1969), not 1980s. The description of the problem (updating what changes vs. what stays the same) is roughly correct for the *technical* frame problem (ramification/qualification issues).
          *   **Verdict:** Mostly right on the concept, wrong on the date (1969 vs 1980s). "Combinatorially explosive" is a fair description of the naive solution.

      *   *Sentence 2:* "Dennett's famous robot shows that this is really the problem of relevance, of deciding what a system can safely ignore, and that is what made it a genuinely philosophical problem rather than just a programming inconvenience."
          *   **Fact Check:** Dennett's "R1D1" robot story (1984) is famous. He did frame it as a problem of relevance (what matters vs. what doesn't). This shifted it from a logical technicality to a cognitive/philosophical issue.
          *   **Verdict:** Accurate. This is a standard interpretation in philosophy of AI.

      *   *Sentence 3:* "At bottom it's the same as the symbol grounding problem: the robot doesn't know what its symbols mean, so it can't tell which ones matter."
          *   **Fact Check:** **Major Conflation.** The Frame Problem (what changes/stays same upon action) and the Symbol Grounding Problem (how symbols get meaning/connection to world) are distinct. Harnad coined "Symbol Grounding" later (1990). While related in the broad sense of "how does intelligence work?", they are not "the same."
          *   **Verdict:** Wrong. Conflates two distinct problems.

      *   *Sentence 4:* "The good news is that the technical version was largely solved in the 1980s with default assumptions in nonmonotonic logic, so it's mainly of historical interest now..."
          *   **Fact Check:** There were significant advances in the 80s/90s (situation calculus, fluent calculus, action languages like A, B, C, nonmonotonic logics). Practitioners in KR (Knowledge Representation) would say the *logical* formalization is well-understood now (e.g., Gelfond & Lifschitz). However, saying it's "mainly of historical interest" is debatable depending on the system. In classical planning, it's handled via PDDL semantics (implicit frame axioms). It's "solved" in the sense that we have formalisms that don't require explicit frame axioms, but the computational cost of reasoning about change remains relevant.
          *   **Verdict:** Rough/Serviceable. "Solved" is strong, but "handled effectively in classical planning formalisms" is true. "Historical interest" is misleading for someone building a planning stack.

      *   *Sentence 5:* "...and it's one reason deep learning systems don't face it at all."
          *   **Fact Check:** **Wrong/Controversial.** Deep learning systems avoid explicit symbolic representation, so they don't face the *logical* frame problem (writing down frame axioms). However, they face a functional equivalent: learning what changes and what doesn't from data (representational learning, dynamics models). Many argue connectionist systems sidestep the *formulation* but still struggle with the *underlying cognitive issue* of relevance and stability plasticity. Some argue they face it worse because they lack explicit structure.
          *   **Verdict:** Wrong/Misleading. They don't face the *logical* formulation, but the underlying issue of predicting change vs. non-change persists.

      *   *Sentence 6:* "Fodor drew exactly this conclusion: the frame problem shows that general intelligence can't be computational."
          *   **Fact Check:** Jerry Fodor did argue the frame problem (specifically the relevance aspect) poses a severe challenge for computational theories of mind (CTM), particularly regarding modularity. He didn't necessarily say it *can't* be computational forever, but that it shows the limits of current computational models regarding global relevance. He was pessimistic about solving it within standard computationalism.
          *   **Verdict:** Rough/Serviceable. Fodor was pessimistic about computational solutions to the *philosophical* frame problem (relevance), but saying he concluded intelligence "can't be computational" is a slight oversimplification of his modularity thesis, though close enough for a summary.

  3.  **Analyze the Practical Takeaway:**
      *   *Claim:* Frame problem is a historical curiosity because we use learned components rather than logical ones.
      *   **Reality:** Warehouse robot planning stacks usually involve hybrid systems. Even if perception is deep learning, the *planning* layer (task planning, motion planning) often relies on logical or geometric reasoning where knowing what changes (object moved) vs. what doesn't (wall stayed still) is crucial. If the planning stack uses classical planning (PDDL), the frame problem is handled by the semantics. If it uses RL/DL for planning, the problem transforms into learning transition dynamics. It is not a "historical curiosity" because the *issue* of representing change efficiently is central to planning.
      *   **Verdict:** The takeaway is dangerous. Just because you use DL doesn't mean you don't need to model state transition correctly. In fact, DL models often struggle with exact state updates (hallucination, drift).

