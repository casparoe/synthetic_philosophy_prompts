      *   *Connection to Misuse:* LLMs don't have a fixed rulebook of truth. Legal codes aren't consistent. Static analysis deals with halting, not arithmetic truth.

  4.  **Addressing the Constraints:**
      *   **Continuous prose:** No lists, no bolding. This is the hardest constraint. I must weave instructions into paragraphs.
