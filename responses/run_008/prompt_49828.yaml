      Let's refine the 7th analogy. "Cybersecurity" is good, but "Biological Research" might be closer to the "dual-use" fear. Actually, **Cybersecurity** is better for the *software* nature of AI. Let's go with **Cybersecurity Arms Race**.

      Let's refine the Coherence answer. The Nukes cluster *is* more internally coherent because it relies on a specific physical bottleneck (fissile material/compute) that dictates the policy. The Press cluster is less coherent because it relies on human behavior which is more variable.

