      *   *IndRev 2 (Wages)* is too slow for 15 years (Engels' pause lasted 40-60 years).
      *   *Press 1 (Pamphlets)* is strong for misinformation, but less for physical capability.
      *   *IndRev 1 (Luddite)* is happening now (strikes, copyright lawsuits), but "machine breaking" is less relevant than legal/regulatory breaking.

