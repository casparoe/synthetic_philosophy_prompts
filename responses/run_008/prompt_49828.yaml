prompt: |-
  People keep fighting about whether AI is "like nukes" or "like the printing press" and I've noticed the disagreement does a lot of hidden work in AI policy arguments (export control people are basically on team nukes, open source people are on team printing press, nobody wants to say it out loud). Help me think it through more carefully. Rank these specific analogy-units by how much they'd actually predict about the next 15 or so years of transformative AI, and say in a sentence or two why each lands where it does:

  1. nukes: mutual assured destruction and the stability-instability paradox
  2. nukes: inspection/safeguards regimes like the IAEA's, and how much leakage there really was
  3. printing press: cheap pamphlets breaking an existing information monopoly (Luther-style)
  4. printing press: the incumbents responding with licensing of printers and index-of-banned-books style censorship
  5. industrial revolution: Luddite-style resistance, meaning machine breaking plus how it got absorbed into legal reform like factory acts
  6. industrial revolution: the standard of living debate, i.e. did ordinary people's wages rise immediately or only decades later after the adjustment costs washed through

  For each one, tell me the mechanism you think carries over, where the disanalogy bites hardest, and if the ranking would flip depending on whether transformative AI ends up concentrated in a few labs or widely distributed. Also — is there an obvious 7th analogy-unit I'm missing that would beat half of these? And am I right that the nukes cluster is more internally coherent than the printing press cluster, or is that just an artifact of how the two debates get argued?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

