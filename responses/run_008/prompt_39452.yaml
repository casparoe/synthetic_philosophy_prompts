answer: |-
  # JOINT STATEMENT OF RESEARCH COLLABORATORS ON THE METAPHYSICS OF PLEASURE AND WELL-BEING

  **Date:** October 14, 2024
  **Parties:** The Proponent of Attitudinal Hedonism (hereinafter "Hedonist") and The Proponent of Pluralist Perfectionism (hereinafter "Pluralist").
  **Subject:** Resolution of Disagreements regarding the Heterogeneity of Pleasure and its Role in Well-Being.

  After three years of adversarial collaboration, we submit this document to clarify the state of our debate. We have moved past the initial impasse regarding the nature of pleasure. The following sections delineate our common ground, the precise locus of our remaining disagreements, the critical questions (cruxes) that determine the outcome, and the empirical or conceptual tests we agree bear on those questions.

  ## 1. AGREED CLAIMS

  We endorse the following propositions as the baseline for further inquiry. These claims are formulated to avoid presupposing the truth of either the Hedonist's or the Pluralist's concluding theory.

  1.  **The Heterogeneity Data:** Introspective reports and phenomenological analysis confirm that instances commonly classified as "pleasures" (e.g., the taste of mango, the completion of a proof, a warm bath) do not share a single, uniform qualitative feel (a "hedonic tone"). Consequently, any theory of well-being relying on a Benthamite, homogeneous sensation of pleasure is empirically untenable and is rejected by both parties.
  2.  **The Circularity of Desire-Definitions:** Defining pleasure solely by reference to desire or preference is insufficient. We agree with Butler's observation that desire-based definitions risk circularity: typically, agents desire states of affairs *because* they anticipate them to be pleasant/enjoyable, rather than the pleasantness consisting merely in the fact of being desired. A viable account must characterize the positive valence of pleasure independently of the mere fact of pursuit.
  3.  **The Formulation at Stake:** The specific version of hedonism under evaluation is **Attitudinal Hedonism**. The claim at stake is that well-being consists in the balance of a specific pro-attitude (enjoyment/taking pleasure in) toward states of affairs over its opposite (suffering/aversion), rather than in the accumulation of a felt quantity of sensation. Both parties agree that if Attitudinal Hedonism fails, sensory hedonism does not rescue the monistic view.
  4.  **The Scope of the Dispute:** The disagreement is not merely about the definition of the word "pleasure," but about the structure of well-being. If pleasure is a unified kind (even if attitudinal), well-being may be monistic. If pleasure is a disjunctive cluster, well-being is likely pluralistic. Both parties agree that the metaphysics of pleasure constrains the ethics of well-being.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates our divergent positions. We have reviewed these formulations to ensure neither side is committed to the other's residual position.

  | Point of Divergence | Hedonist Formulation (Attitudinal View) | Pluralist Formulation (Cluster/Pluralist View) | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Unity of Pleasure** | Pleasure is a unified functional kind: a distinctive mode of consciousness (enjoyment) that can attach to heterogeneous contents. The unity lies in the *attitude*, not the *object* or the *sensation*. | Pleasure is a disjunctive cluster kind held together by family resemblance and linguistic convention. There is no single psychological natural kind corresponding to "enjoyment" that covers all cases. | **Substantive.** If the Hedonist is right, there is one master good. If the Pluralist is right, "pleasure" names many different goods. |
  | **The Explanation of Value** | Well-being is monistic because the pro-attitude itself is the single value-making property. Diverse activities contribute to well-being *only insofar as* they are objects of this single attitude. | Well-being is pluralistic. Diverse activities (knowledge, friendship, sensation) contribute to well-being in virtue of their own natures; the "pleasure" accompanying them is a byproduct or a heterogeneous set of responses, not the sole source of value. | **Substantive.** Disagreement on whether value supervenes on one property (attitude) or many (objective goods). |
  | **The Status of "Enjoyment"** | The term "enjoyment" picks out a real, identifiable psychological relation that is non-circularly definable (e.g., via intrinsic motivation or distinctive phenomenology of 'liking'). | The term "enjoyment" is a placeholder for various distinct psychological states (satisfaction, relief, sensory gratification) that we lump together. Attempting to unify them distorts the data. | **Partly Verbal / Substantive.** Verbal regarding the label "enjoyment"; substantive regarding whether a unified psychological relation exists. |
  | **The Heterogeneity Implication** | Heterogeneity of sensation is compatible with the unity of the attitude. The data refute *sensory* hedonism, not *attitudinal* hedonism. | Heterogeneity of sensation is the "smoking gun" that refutes hedonism generally. It indicates that the underlying goods are as diverse as the feelings, rendering the attitudinal unification artificial. | **Substantive.** Disagreement on the inferential weight of the heterogeneity data. |

  ## 3. THE CRUXES

  We identify four specific questions. Settling these would compel at least one party to revise their position.

  **(a) The Phenomenal Inversion Crux:**
  Is a "phenomenal inversion" fully coherent? Specifically, is it possible for two agents to have identical attitudinal reports (both claim to "enjoy" the activity equally) and identical behavioral dispositions, while the underlying felt quality of their experience is inverted (e.g., Agent A's feeling while listening to muzak is qualitatively identical to Agent B's feeling while solving a proof)?
  *   *Stakes:* If coherent, does well-being track the attitude (Hedonist) or does the inversion reveal that different *kinds* of value are present despite the shared label (Pluralist)?

  **(b) The Circularity of Attitude Crux:**
  Can the Attitudinal Hedonist provide a non-circular account of what makes an attitude "enjoyment" rather than mere "desire-satisfaction" or "preference-fulfillment" without implicitly referencing well-being or value?
  *   *Stakes:* If the definition of "enjoyment" relies on "what makes life go better," Attitudinal Hedonism collapses into a tautology (Well-being is what makes life go better).

  **(c) The Non-Intentional Data Crux:**
  Are pleasures that seem least intentional (e.g., orgasm, the runner's high, the feeling of sun on skin) recalcitrant data for the Attitudinal account, or are they merely limit cases?
  *   *Stakes:* If these cannot be modeled as "taking pleasure in a state of affairs" without distortion, the Attitudinal account fails to cover the full extension of "pleasure," weakening its claim to be the sole constituent of well-being.

  **(d) The Subject-Change Crux:**
  Has the fallback to "attitude" quietly changed the subject? Specifically, have we moved from a metaphysical claim about *pleasure* (a specific type of experience) to an ethical claim about *pro-attitudes* (a functional role), such that "Hedonism" no longer describes the metaphysics of the good but only its structure?
  *   *Stakes:* If the subject has changed, the Pluralist wins the historical/metaphysical debate (classical hedonism is false), even if the Hedonist wins the ethical debate (attitudinal monism is true).

  ## 4. TESTS AND PREDICTIONS

  For each crux, we agree on a test case or method of inquiry. We record our predictions below.

  ### Test for Crux (a): The Inversion Case
  **The Test:** A thought experiment involving two agents, Alice and Bob. Alice "enjoys" reading poetry; Bob "enjoys" counting blades of grass. Via neural swap, Alice's qualitative feel during poetry is replaced by Bob's qualitative feel during grass-counting, but their higher-order attitudes ("I love doing this") and memories remain intact.
  *   **Hedonist Prediction:** Well-being levels remain constant for both agents. The value resides in the pro-attitude, which is preserved. The qualitative swap is irrelevant to welfare.
  *   **Pluralist Prediction:** The description of their well-being fractures. Alice is now experiencing a lower or different *kind* of good (trivial pursuit) despite her attitude. The inversion reveals that the attitude was tracking different objective goods, not a single unified good.

  ### Test for Crux (b): The Isolation Analysis
  **The Test:** A conceptual analysis task where "enjoyment" must be defined using only descriptive psychological terms (e.g., motivation, attention, phenomenology) without using normative terms (e.g., "good," "benefit," "worthwhile").
  *   **Hedonist Prediction:** Success is possible. We can isolate a distinctive motivational profile (intrinsic desire for continuation) or phenomenological marker (felt 'rightness') that defines enjoyment independently of value.
  *   **Pluralist Prediction:** Failure is inevitable. Any descriptive definition will either exclude paradigmatic pleasures (too narrow) or include non-pleasurable desires (too broad). The only way to unify the extension of "enjoyment" is to appeal to the value the agents place on it, which is circular.

  ### Test for Crux (c): The Non-Intentional Limit
  **The Test:** Examination of cases of "mindless" pleasure (e.g., a subject under mild anesthesia experiencing sensory gratification without capacity for propositional attitudes like "taking pleasure in the fact that...").
  *   **Hedonist Prediction:** These are limit cases that can be accommodated by expanding "attitude" to include non-propositional, sensory-directed acceptance, or by treating them as a sub-class that derives value from their connection to the subject's broader capacity for enjoyment.
  *   **Pluralist Prediction:** These are counterexamples. They demonstrate that a significant portion of what matters in pleasure is purely sensory and non-attitudinal. Forcing them into an attitudinal mold distorts the phenomenon to save the theory.

  ### Test for Crux (d): The Historical/Conceptual Map
  **The Test:** A comparative analysis of Classical Hedonism (Bentham/Mill) vs. Attitudinal Hedonism (Feldman/Heathwood) to determine if the core commitment (that a specific *type of feeling* constitutes the good) has been abandoned.
  *   **Hedonist Prediction:** Continuity. The core commitment was always that the *subjective positive response* constitutes the good. Moving from sensation to attitude is a refinement of the mechanism, not a change of subject.
  *   **Pluralist Prediction:** Discontinuity. Classical Hedonism relied on pleasure being a specific *content* of experience. Attitudinal Hedonism makes pleasure a *mode* of experiencing any content. This is a fundamental shift from a theory of *feeling* to a theory of *valuation*, conceding the Pluralist's point that there is no single "pleasure stuff."

  ***

  **Signatories:**

  _________________________
  (Proponent of Attitudinal Hedonism)

  _________________________
  (Proponent of Pluralist Perfectionism)
