answer: |-
  This is a classic problem in International Criminal Law (ICL) pedagogy. The phrase "victors' justice" functions as a conversation-stopper because it conflates historical description, legal critique, and moral judgment into a single slogan. Your friend is making a specific inferential leap: *Because the tribunals were flawed (premise), they lack legal legitimacy and offer no precedent (conclusion).*

  To help your group move past the slogan, here is a breakdown of the distinct claims hidden inside "victors' justice," evaluated by their truth value, their logical force regarding legitimacy, and the specific status of the retroactivity debate.

  ### Part 1: The Menu of Claims

  Here are the five distinct propositions usually bundled under "victors' justice."

  #### 1. The Structural Bias Claim
  *   **The Claim:** The tribunals were composed exclusively of judges from the victorious Allied powers; there were no neutral states represented on the bench.
  *   **Truth Status:** **Trivially True.** The IMT (Nuremberg) and IMTFE (Tokyo) charters explicitly appointed judges only from the signatory Allied nations.
  *   **Logical Force:** **Weak.** Structural bias creates an *appearance* of partiality, but it does not logically prove the *verdicts* were incorrect. A biased court can still reach a legally sound conclusion based on evidence.
  *   **Does it support your friend's "Sham" conclusion?** **No.** It undermines the *perceived* legitimacy, but not necessarily the *legal* validity of the judgments.

  #### 2. The Selective Prosecution Claim (*Tu Quoque*)
  *   **The Claim:** Leaders of the defeated Axis were prosecuted for acts (e.g., unrestricted submarine warfare, area bombing of cities) that Allied leaders also committed but were never charged with.
  *   **Truth Status:** **Substantive and Defensible.** It is historically settled that Allied conduct (e.g., Dresden, Tokyo firebombing) was not scrutinized. Admiral Dönitz was charged for submarine warfare; the charges were later mitigated because Allied admirals (like Nimitz) admitted to similar conduct.
  *   **Logical Force:** **Moderate.** In domestic criminal law, "selective prosecution" is rarely a defense to guilt (i.e., "others did it too" doesn't make *my* crime legal). However, in *international* law, where enforcement is political, selective application undermines the claim that these are universal legal norms.
  *   **Does it support your friend's "Sham" conclusion?** **Partially.** It suggests the tribunals were political tools rather than neutral enforcers of law. However, it does not prove the Axis defendants were *innocent*, only that the system was inconsistent.

  #### 3. The Procedural Fairness Claim
  *   **The Claim:** The rules of procedure were rigged to ensure conviction (e.g., admission of hearsay evidence, limits on defense counsel, the prosecution's control over the definition of "criminal organizations").
  *   **Truth Status:** **Substantive and Defensible.** The tribunals blended common law and civil law procedures in ways that often disadvantaged the defense. The IMT Charter allowed the court to accept evidence without strict cross-examination rules common in Anglo-American law.
  *   **Logical Force:** **Moderate to Strong.** If due process is a prerequisite for legal legitimacy, procedural flaws weaken the moral authority of the verdicts.
  *   **Does it support your friend's "Sham" conclusion?** **Yes, but with limits.** It supports the idea that the *process* was flawed. It does not necessarily mean the *substantive law* created (the precedent) is invalid today, provided modern courts (like the ICC) fix the procedural issues.

  #### 4. The Political Instrumentalism Claim
  *   **The Claim:** The primary purpose of the tribunals was not justice, but the political neutralization of enemy leadership and the historical narrative control of the war.
  *   **Truth Status:** **Substantive and Defensible.** Most historians agree the Allies wanted to avoid the mistakes of WWI (where leaders escaped accountability) and sought to delegitimize the Nazi/Imperial Japanese states.
  *   **Logical Force:** **Contested.** Legal realists argue *all* law is political. If the political goal aligns with moral justice (punishing genocide), the political motive doesn't necessarily invalidate the legal outcome.
  *   **Does it support your friend's "Sham" conclusion?** **No.** A trial can be politically motivated and still be legally sound. This claim attacks the *motive*, not the *legal reasoning*.

  #### 5. The Retroactivity Claim (*Nullum Crimen Sine Lege*)
  *   **The Claim:** The defendants were convicted of crimes that did not exist in positive law at the time they were committed, specifically "Crimes Against Peace" (waging aggressive war).
  *   **Truth Status:** **Highly Contested.** (See Part 2 below for the deep dive).
  *   **Logical Force:** **Strong.** If *nullum crimen sine lege* (no crime without law) is a fundamental principle of justice, violating it strikes at the heart of legal legitimacy.
  *   **Does it support your friend's "Sham" conclusion?** **Yes, if accepted.** If the charges were genuinely ex post facto, the legal basis for the convictions is void. This is the strongest legal argument your friend has.

  ---

  ### Part 2: The Retroactivity Deep Dive (Nuremberg vs. Tokyo)

  This is the most technical part of your discussion. You need to distinguish between "new statute" and "new crime."

  **The Core Legal Issue:**
  The defense argued that the London Charter (Nuremberg) and Tokyo Charter created new crimes after the fact. The prosecution argued they were merely codifying *existing* customary international law.

  **1. Crimes Against Humanity & War Crimes**
  *   **Status:** **Settled.** There was pre-existing law here. The Hague Conventions (1899/1907) and Geneva Conventions established rules of war. Violating them was already considered criminal under customary law, even if the specific statutory mechanism for individual liability was new.
  *   **Consensus:** Most legal scholars accept that War Crimes and Crimes Against Humanity were not truly ex post facto, even if the *tribunal* was new.

  **2. Crimes Against Peace (Aggressive War)**
  *   **Status:** **Genuinely Contested.** This is the heart of the "victors' justice" legal critique.
  *   **The Argument for Legitimacy:** The Kellogg-Briand Pact (1928) renounced war as an instrument of national policy. The prosecution argued this made aggressive war illegal, and therefore criminal.
  *   **The Argument for Illegitimacy:** The Pact renounced war but did not specify *criminal penalties* for leaders. International law traditionally bound *states*, not *individuals*. Criminalizing the act of state for an individual was a novel legal leap.
  *   **Nuremberg vs. Tokyo:**
      *   **Nuremberg:** The Tribunal ruled that the Kellogg-Briand Pact, combined with other treaties, made aggressive war a crime under customary law. **Consensus:** This reasoning is widely accepted today as the foundation of modern ICL, though positivists at the time criticized it.
      *   **Tokyo:** The reasoning was shakier. Justice Radhabinod Pal (India) wrote a famous dissenting opinion arguing that "Crimes Against Peace" were entirely ex post facto inventions. Justice Bert Roling (Netherlands) also argued that criminalizing aggressive war was new law.
      *   **Comparison:** Your friend is right that Tokyo was on shakier ground. The connection between pre-war treaties and individual criminal liability was less established in the Pacific theater context than in Europe.
  *   **Settled vs. Contested:**
      *   **Settled:** The *Charter* defined the crimes anew.
      *   **Contested:** Whether that Charter definition reflected *pre-existing customary law*.
      *   **Contested:** Whether violating *nullum crimen* invalidates the tribunal's legacy. (Many argue it was a "necessary injustice" to establish a new legal order).

  ---

  ### Part 3: Evaluating Your Friend's Leap

  Your friend argues: *Flawed Origin = No Precedent Value.*
  Here is how to parse that in your group.

  **1. Which claims support her view?**
  *   **The Retroactivity Claim:** If you accept that "Crimes Against Peace" were invented ex post facto, then the legal reasoning *is* tainted. You cannot build a precedent on a violation of the principle of legality.
  *   **The Selective Prosecution Claim:** If the law is applied only to losers, it fails the test of equality before the law. This weakens its claim to be "universal" law.

  **2. Which claims do NOT support her view?**
  *   **The Structural Bias Claim:** A court can be structurally biased but legally correct. The Nuremberg Principles (individual liability, no immunity for heads of state) were adopted by the UN General Assembly in 1946. The international community *ratified* the precedent, curing the original bias.
  *   **The "Sham" Conclusion:** Even if the process was flawed, the *substantive norms* (genocide is a crime, leaders are liable) have been reaffirmed by the ICTY, ICTR, and ICC. The "sins of the father" do not automatically void the child.

  **3. The "Settled vs. Contested" Map**
  Bring this explicitly to your group to stop the sloganizing:

  *   **Settled History:** The Allies controlled the courts. The Allies were not prosecuted. The Charters defined the crimes.
  *   **Settled Law (Today):** The *Nuremberg Principles* are accepted as customary international law. Individual criminal responsibility is the norm.
  *   **Contested Legal Philosophy:** Does the ex post facto nature of "Aggressive War" in 1945/46 permanently taint the legitimacy of the tribunals, or was it a legitimate evolution of customary law?
      *   *Positivists* tend to side with your friend (law must be written beforehand).
      *   *Natural Law theorists* tend to side with the Tribunal (some acts are inherently criminal regardless of statute).
  *   **Contested Historical/Legal Hybrid:** Was Tokyo significantly less legitimate than Nuremberg?
      *   *Consensus:* Yes, due to the strength of the dissenting opinions and the weaker link to pre-existing treaties regarding Japan.
      *   *Contest:* Does that difference matter for *precedent* today, since both tribunals contributed to the same body of customary law?

  ### Summary for Your Discussion Group

  If you want to move the conversation forward, propose this distinction:

  > "We need to separate **Historical Legitimacy** from **Normative Legacy**."

  1.  **Historical Legitimacy:** Was the process in 1945-48 perfect? **No.** It was victors' justice in terms of composition, selectivity, and arguably retroactivity on 'Crimes Against Peace' (especially in Tokyo). Your friend is right here.
  2.  **Normative Legacy:** Do the *principles* established hold water today? **Yes.** The international community absorbed the Nuremberg Principles into the UN system. The ICC operates on the basis that leaders can be tried for aggression and atrocities.

  **The Counter-Move:**
  Tell your friend: "You are correct that the *origin* was tainted by victors' justice. But in law, precedent is often built on imperfect foundations. The question isn't 'Was Nuremberg perfect?' It's 'Did the international community subsequently validate these norms?' Since the UN and modern tribunals have adopted the Nuremberg Principles, the 'victors' justice' critique explains the *history*, but it doesn't delete the *law*."

  This allows you to concede the historical point (which stops the eye-rolling) while defending the legal relevance (which saves the discussion).
