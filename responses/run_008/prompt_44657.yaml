  8.  **Final Polish:** Check against the user's constraints (menu format, retroactivity focus, settled vs. contested labeling). Ensure the distinction between *legal legitimacy* and *moral legitimacy* is clear, as that's often where the confusion lies. (Proceed to generate output based on these thoughts.)

