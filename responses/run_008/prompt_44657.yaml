      *   **Requirements:**
          1.  Categorize claims (Trivially True, Substantive/Defensible, False).
          2.  Evaluate logical force (Does this claim actually support dismissing legitimacy/precedent?).
          3.  Address *Nullum Crimen Sine Lege* (retroactivity) specifically, comparing Nuremberg vs. Tokyo.
          4.  Distinguish between settled history and contested legal/philosophical debates (avoid presenting contested takes as consensus).
      *   **Tone:** Academic, nuanced, precise, helpful for a discussion group.

  2.  **Deconstruct "Victors' Justice":**
      *   What do people *mean* when they say this? It's a umbrella term. I need to break it down into specific propositions.
      *   *Claim 1: Composition/Bias.* Only victors sat as judges. No neutral parties.
      *   *Claim 2: Selective Prosecution.* Only losers were tried. Victors committed similar acts (bombing, submarines) but weren't charged.
      *   *Claim 3: Retroactivity (Nullum Crimen).* Laws were made up after the fact (especially Crimes Against Peace/Aggression).
      *   *Claim 4: Procedural Unfairness.* The rules were rigged to ensure conviction (hearsay, limited defense).
      *   *Claim 5: Political Instrumentalism.* The goal was political elimination of leadership, not justice.

  3.  **Evaluate Each Claim (Truth Value & Logical Force):**
      *   *Claim 1 (Composition):* True. Does it invalidate verdicts? Not necessarily (structural bias $\neq$ wrongful conviction), but weakens perceived legitimacy.
      *   *Claim 2 (Selectivity):* True (mostly). Does it invalidate specific verdicts? No (tu quoque is generally not a defense in criminal law), but undermines moral authority and precedent consistency.
      *   *Claim 3 (Retroactivity):* Contested/Complex. Nuremberg had stronger arguments (Kellogg-Briand, Hague) than Tokyo. Does it invalidate legitimacy? This is the core legal philosophy debate (positivism vs. natural law).
      *   *Claim 4 (Procedure):* True to an extent (civil/common law clash, limits on defense). Weakens legitimacy but doesn't necessarily mean innocence.
      *   *Claim 5 (Politics):* True (they were political acts). Does "political" mean "unjust"? Contested.

  4.  **Address the Retroactivity Issue (*Nullum Crimen Sine Lege*):**
      *   Need to distinguish Nuremberg (IMT) and Tokyo (IMTFE).
      *   *Nuremberg:* Charter defined crimes. Defense argued ex post facto. Tribunal argued these were already criminal under international custom/treaties (Hague, Kellogg-Briand).
      *   *Tokyo:* Similar Charter, but dissenting opinions (Pal, Roling) were stronger on this. Aggressive war criminalization was shakier in customary law for Japan.
      *   *Consensus vs. Contest:* It is settled that the *charges* were new in statutory form. It is contested whether they reflected *pre-existing customary law*. It is highly contested whether this defect destroys *legitimacy* vs. just being a "necessary evil."

  5.  **Address the "Leap" (Legitimacy/Precedent):**
      *   Friend says: Flawed origin = No precedent value.
      *   Counter-argument: Law evolves. Foundational moments are often messy. The *principles* (individual liability, no immunity) survived even if the *process* was flawed.
      *   Need to show which claims support the "sham" conclusion and which don't. (e.g., Selective prosecution doesn't make the guilty innocent).

  6.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the frustration. Validate that "Victors' Justice" is a slogan that conflates distinct arguments.
