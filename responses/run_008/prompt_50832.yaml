  Give each term a number and one line of justification, then combine them and give me the final credence, plus the usual arithmetic so I can see how you got there. Then two more things: tell me which single term your final number is most sensitive to (i.e., which disagreement, if I had it with my colleague, would move the answer the most), and tell me what evidence would shift that term the most -- some findable fact about the period, not just a better argument.

  same question could obviously be asked about the Middle Ages and the Renaissance, and if you want to flag in one sentence how your answer would or wouldn't transfer to those, that'd be a nice bonus, but don't let it take over. also feel free to push back if you think one of my proposed terms is confused or double-counts another -- I want your best decomposition, not mine rubber-stamped. my own gut number is somewhere around 0.5 but honestly I've never made myself write out why, so dont anchor to it.
