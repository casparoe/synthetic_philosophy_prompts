answer: |-
  The single biggest thing about your planned approach that's most likely to go wrong is explaining the weighted-average mechanics before they've felt the genuine discomfort of the contradictory numbers, which turns a paradox into an arithmetic lesson and loses the 'allergic to lecture' crowd.

  **Session Plan (45 Minutes)**

  **1. The Conflict (0–5 mins)**
  *   **Action:** Write the two conflicting claims from the recent argument on the whiteboard without context.
      *   Claim A: "Company-wide avg session length is UP 10% QoQ."
      *   Claim B: "Mobile avg session length is DOWN 5% and TV avg session length is DOWN 5% QoQ."
  *   **Ask:** "One dashboard says growth, the other says decline. Who is lying? Is the data broken?"
  *   **Goal:** Induce cognitive dissonance. Do not resolve it yet. Let them argue briefly. This hooks the skeptics by validating their real-world frustration.
  *   **Dependency:** You cannot move to mechanics until they agree that logically, both statements shouldn't be true simultaneously.

  **2. The Evidence & Validation (5–15 mins)**
  *   **Action:** Reveal the simplified data table that makes both claims true (your session length example).
      *   Show Q1 vs Q2 counts and averages for Mobile, TV, and Total.
      *   **Crucial Step:** Live-calculate the totals on the whiteboard using their numbers. Sum the total hours and divide by total users.
  *   **Misconception Head-off ("The Dashboard is Buggy"):** By manually verifying the aggregate math in front of them, you prove the numbers are arithmetically correct. This forces them to accept the paradox rather than dismissing it as a SQL error.
  *   **Goal:** Move the problem from "data quality" to "interpretation."

  **3. The Mechanism (15–30 mins)**
  *   **Action:** Visualize the weights. Draw two buckets (Mobile, TV) with different sizes.
      *   Show that TV has a higher baseline average than Mobile.
      *   Show that in Q2, a massive chunk of users moved from the Mobile bucket to the TV bucket.
      *   Demonstrate that even if everyone watched *less* content individually (subgroup down), the shift toward the "higher watching" platform pulls the total average up.
  *   **Misconception Head-off ("Only Happens with Small Samples"):** Use hypothetical N=10,000 users in your whiteboard calculation. Explicitly state, "This isn't noise; this is mass behavior."
  *   **Dependency:** Do not introduce the term "weighted average" until after they visually see the users moving buckets. The concept must precede the vocabulary.
  *   **Goal:** Make the "mix shift" visible. They need to see the *people* moving, not just the numbers changing.

  **4. The Decision Trap (30–40 mins)**
  *   **Action:** Discuss which number to trust for decision-making.
      *   Scenario 1: Reporting to CFO on total engagement hours? -> Trust the Aggregate (the mix shift *is* the success).
      *   Scenario 2: Product team trying to improve the Mobile app experience? -> Trust the Subgroup (the aggregate hides the degradation).
  *   **Misconception Head-off ("Aggregate Numbers Are Always Meaningless"):** This is the most dangerous overcorrection. Explicitly state that sometimes the aggregate *is* the truth (e.g., total revenue, total server load). The paradox isn't about which number is "real," but which question you are answering.
  *   **Goal:** Shift from "calculating right" to "asking right."

  **5. The Check Question (40–45 mins)**
  *   **Action:** Present a fresh, unrelated scenario on the board.
      *   "Conversion rate for Horror movies is up 2%. Conversion rate for Comedy is up 2%. But overall site conversion rate is down. Why?"
      *   Ask them to identify the hidden variable and the direction of the shift.
  *   **Success Criteria:** They must identify that traffic shifted toward the genre with the *lower* baseline conversion (Comedy), dragging the total down despite individual improvements.
  *   **Goal:** Verify they can recognize the structure without your guidance.

  **What to Refuse to Get Into**
  *   **Causal Graphs (DAGs):** Do not draw nodes and edges. It smells like academic stats and will trigger the "allergic to lecture" group. Use "buckets" and "flows" instead.
  *   **Formal Probability Notation:** Avoid P(A|B). Use "Avg per User" or "Rate."
  *   **The Batting Average Example:** It is the classic textbook example, but it is too distant from streaming metrics. Stick to your company's context.
  *   **Statistical Adjustment Techniques:** Do not teach them how to calculate standardized rates. Your goal is recognition, not correction. If they spot it, they can ask a data scientist for the fix.
