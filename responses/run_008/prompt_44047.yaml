prompt: |-
  I run a monthly lunch-and-learn at the streaming company where I work, and next month's topic is Simpson's paradox. The audience is about ten content analysts -- smart people, good with dashboards, but no formal stats training, and a couple of them are openly allergic to anything that smells like a lecture. I have forty-five minutes and a whiteboard. The reason I picked this topic: we recently rolled out new engagement dashboards, and two teams got into an actual argument because one team's metric "went up" and the other's "went down" and they were both looking at real numbers. I suspect something Simpson-shaped was going on, and I want the analysts to come away able to recognize when a dispute like that is an aggregation artifact rather than a data quality problem.

  Here's the example I was thinking of building the whole thing around, and I want your take on whether it can carry the session: company-wide average session length rose quarter over quarter, but when you split by platform, average session length fell on mobile and fell on TV -- because users shifted toward the platform that always had the longer sessions (TV). So the aggregate goes up while every subgroup goes down. I like that it's from their actual world and that it makes the disaggregated view look better, which sets up the subtlety that disaggregation isn't automatically the "more honest" number either. But tell me if a cleaner or more classic example would work better for a first pass, and why.

  What I want from you is a plan for the session, not an explanation of the paradox itself. So: the order the pieces have to go in and what depends on what (for instance, does the weighted-average mechanics need to come before or after they've felt the surprise? my instinct is after, but argue with me if that's wrong), which misconceptions they'll walk in with or form midway and exactly where in the sequence I should head each one off -- I'm guessing the big ones are "the dashboard is buggy," "this only happens with small sample sizes," and the overcorrection "aggregate numbers are always meaningless so only ever look at the breakdown" -- plus a check question I can ask in the last five minutes that would actually show whether they can recognize the structure in a fresh case rather than just nod along. And tell me what I should openly refuse to get into at this level (causal graphs? the probability-theoretic version? the batting average example?). Start your reply with the single biggest thing about my planned approach that's most likely to go wrong, in your first sentence, then give me the full plan with no preamble or restating of what I asked.
