prompt: |-
  So I'm a junior taking philosophy of biology this semester and I have to pick my senior thesis topic soon, ideally something that could carry into grad school if I go that route. We just finished the adaptationism unit — the Gould/Lewontin spandrels paper, the various replies, etc. — and honestly the more I read the less sure I am what's actually still open vs what's settled. At first I thought the question was just "how often are traits adaptations versus byproducts," which seemed like a straightforwardly empirical thing population geneticists could eventually just settle by counting. But my professor keeps insisting the real fight was never about frequency at all — it was about who bears the burden of proof when you're staring at a complex trait and have to choose between "it's an adaptation for X" and the alternatives (byproducts, developmental constraints, drift, exaptation). And on top of that I've now seen people claim the whole debate basically dissolved once evo-devo and cheap genome sequencing showed up, and other people who say the same fight just restarted inside evolutionary psychology but with humans.

  So here's my question: if you had to rank what's genuinely open in this debate, what would actually be worth a year of an undergrad's time, and what's a settled or purely verbal dispute that only feels open because people keep writing about it? For context, I have decent stats and one population genetics course, but zero wet lab anything, so "go sequence something" isn't really on the table for me. Candidates I can think of: whether adaptationism is best understood as an empirical claim or a research strategy, and whether that distinction even does any work; whether exaptation is a coherent category or just an adaptation relabeled once you trace the history carefully enough; whether genomics actually changed anything, i.e. can you now just detect selection from sweep data and thereby sidestep the whole byproduct problem, or does the Gould/Lewontin worry survive that intact; and whether the spandrels argument has any real force against evolutionary psychology specifically, or whether that field just absorbed the critique and moved on.

  Rank these, add whatever I'm missing, and defend the ordering — I want to know what makes a question worth the year, not just that it's unresolved. Also tell me what would move something up or down your list, e.g. if a narrow version I could do well beats a broad version I'd do mediocre work on. I really dont want to spend my thesis summarizing a fight that secretly ended in the 90s while people kept publishing about it anyway.
