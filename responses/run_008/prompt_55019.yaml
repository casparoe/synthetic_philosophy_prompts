answer: |-
  **Title:** Decision Rules and the Limits of Good's Theorem on the Value of Information

  **Research Question**
  Is the non-negativity of free information a universal theorem of rationality, or is it contingent on the agent employing a specific decision rule (specifically, Causal Decision Theory)? More precisely: do the known exceptions to Good's Theorem constitute a heterogeneous "grab bag" of boundary conditions, or do they unify under a single formal failure of the independence premises required by Causal Decision Theory?

  **Problem and Background**
  Good's Theorem establishes that a rational agent with coherent probabilities can never expect to be worse off by observing free evidence before acting. Standard exceptions are typically dismissed as boundary conditions: information is costly, the agent cannot act on it, or the observation alters the environment (e.g., signaling to other agents). However, this classification leaves a theoretical gap. It treats structural exceptions—such as Newcomb problems, blackmail, and precommitment scenarios—as distinct from one another. My hypothesis is that these are not distinct environmental constraints but rather manifestations of a single underlying issue: the dependence of the value of information on the decision rule's handling of correlations between the agent's choice and the state of the world.

  **Methodology**
  I will proceed via axiomatic analysis and case construction.
  1.  **Reconstruction:** I will formally reconstruct Good's proof to isolate the specific probabilistic and causal independence premises required for the non-negativity result to hold.
  2.  **Comparison:** I will apply these premises to agents employing Causal Decision Theory (CDT), Evidential Decision Theory (EDT), and Functional Decision Theory (FDT).
  3.  **Testing:** I will construct cases where these theories diverge on the value of an observation. Specifically, I will focus on scenarios where observing evidence provides logical or evidential news about the agent's own future action or the simulation of that action by others (e.g., Newcomb's Box, Parfit's Hitchhiker).
  4.  **Analysis:** I will demonstrate exactly which premise of Good's proof is violated in each case and whether that violation is intrinsic to the environment or induced by the decision rule.

  **Expected Outcomes**
  *   **Success:** A demonstration that "always take the free information" is a theorem of CDT but not of EDT or FDT. This would reclassify the "exceptions" not as irrational anomalies, but as scenarios where CDT's causal independence assumptions fail to capture the relevant logical correlations. The result would be a taxonomy of VoI violations mapped to decision-theoretic axioms.
  *   **Failure:** If the exceptions remain formally heterogeneous (i.e., signaling failures differ fundamentally from precommitment failures in the proof structure), the unification hypothesis will be rejected. Alternatively, if the formal reconstruction proves too complex to resolve definitively within the word limit, the argument may remain suggestive rather than demonstrative.

  **Scope and Feasibility**
  A comprehensive analysis of both exception types (inter-agent signaling and intra-agent logical correlation) alongside a tripartite decision-theoretic comparison risks exceeding 7,000 words without sacrificing rigor. The inter-agent cases often reduce to game-theoretic signaling costs, which are less philosophically contentious than the intra-agent cases. Therefore, I propose narrowing the scope to focus primarily on **intra-agent logical correlations** (Newcomb-style problems and precommitment). This subset most directly challenges the normative claim that ignorance is irrational. If space permits, I will briefly note how the inter-agent cases map onto the same formal structure, but the core proof analysis will target the logical correlation cases to ensure a determinate result within the semester limit.
