  ### what the poem is doing

  This poem adopts a cognitivist stance to dramatize the Frege–Geach problem, assuming that logical validity requires univocal propositional content across asserted and embedded contexts. It sidelines quasi-realist solutions (like Blackburn's or Gibbard's) that attempt to earn truth-aptitude without positing robust moral properties, treating the stability of meaning as a precondition rather than an achievement. By forcing the refrains to remain identical, the form insists that the antecedent carries the same semantic weight as the assertion, challenging the expressivist to explain this continuity without collapsing into realism.
