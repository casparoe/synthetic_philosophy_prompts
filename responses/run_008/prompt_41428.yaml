prompt: |-
  software engineer here, no philosophy background at all, so pls bear with me. I fell down a rabbit hole and I want to hire you as the person who writes the acceptance criteria before I merge anything.

  The rabbit hole: I was in an argument about Pascal's wager, where someone said you have "reason" to believe in God because the payoff structure is insane (infinite upside, tiny downside), and someone else replied that that's the "wrong kind of reason" to believe something. That sounded like a total dodge to me, like saying "that's not the right kind of semicolon." But then I actually looked it up and it turns out philosophers have been fighting about this for decades? It's usually called the wrong kind of reasons problem (or state-given vs object-given reasons, I've seen both terms and it's not clear to me they're the same thing, that might be part of the question). The classic scenario is some villain who says he'll blow up the earth unless you admire him. It seems like you have a reason to admire him. But clearly that doesn't make him admirable, i.e., that reason seems like the wrong kind for the fitting-attitude story where something is valuable iff it's worthy of being desired/valued. Same machinery is supposed to handle the wager case and stuff like believing a pill makes your beliefs true (or whatever the belief version is).

  Anyway, before I form any opinion on the competing theories, I want the spec first. Write me the acceptance criteria: what any adequate theory of the right-kind/wrong-kind distinction has to deliver — which cases it must classify correctly, which distinctions it has to respect (like: a wrong-kind reason can still be a genuinely normative reason for you to have the attitude, you should probably still take the pill / admire the villain, that's why you're not off the hook), what it has to say about whether the same problem shows up for belief and desire and admiration or is belief special. And tell me which of the requirements you suspect can't all be satisfied together, and which single requirement knocks out the most proposed theories.

  One thing I keep chewing on and want your take on as part of the spec: it looks to me like the wrong-kind reasons are ones that only exist BECAUSE you have (or might have) the attitude — the threat is conditional on your admiring him, the payoff on your believing. So the attitude is like part of the input to the very function that generates reasons for having it. That's a weird recursive dependency, like a function that reads from the buffer it's supposed to be writing. I have a suspicion that most "solutions" in the literature don't actually break the recursion, they just rename it (calling them "state-given" instead of "object-given" feels like labeling the recursion rather than resolving it). Is that a fair read? And should "actually breaks the recursion, not just labels it" be one of the acceptance criteria, or is that me smuggling in a bad requirement — tell me honestly if it's a prejudice rather than a genuine desideratum.

  For the scorecard part, keep it light — like one short paragraph at the end on how the main contenders (fitting-attitude/buck-passing views, evidentialist views about belief, whatever the big names are) do against your list. The criteria are the part I care about, since I don't know the contenders well enough to judge anything else. No reading lists or citations btw, I'm not near a library, just the actual thinking.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer. No philosophy background. Thinks in terms of specs, acceptance criteria, merging, recursion, dependencies, inputs/outputs.
      *   **Topic:** The "Wrong Kind of Reasons" (WKR) problem in meta-ethics/epistemology. Specifically regarding Pascal's Wager, the Demon/Threat case (admire me or I blow up the world), and belief vs. desire/admiration.
      *   **Task:** Write "Acceptance Criteria" for any adequate theory of the WKR distinction.
      *   **Specific Questions to Address:**
          *   What cases must be classified correctly?
          *   What distinctions must be respected (e.g., WKR are still normative reasons to act, just not to *have the attitude* in the relevant sense)?
          *   Uniformity vs. Specialness (does this apply to belief, desire, admiration equally?).
          *   Trade-offs/Incompatibilities (which requirements can't be satisfied together?).
          *   The "Killer Requirement" (which one knocks out the most theories?).
