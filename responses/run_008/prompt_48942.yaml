answer: |-
  In a hospital server room, Senior Admin Sarah asks Intern Mike about a critical alarm on a legacy monitor. Mike replies, "I haven't been trained on this system and I don't know if I'm right, but the screen reads 'Backup Failure', so I'm telling you the backup failed." Sarah has directly observed on fifty prior occasions, without relying on anyone's testimony, that whenever Mike reports data from this system with this specific hesitation, his report is nonetheless accurate.

  **Reductionist Verdict:** Accept. The Reductionist requires non-testimonial evidence to justify belief based on testimony. Sarah possesses independent inductive evidence (her fifty prior observations) confirming the reliability of Mike's reports even when he expresses uncertainty. The testimony is justified because it is supported by her own perceptual track record.

  **Anti-Reductionist Verdict:** Reject. The Anti-Reductionist holds that testimony provides *prima facie* entitlement only when the speaker performs an assertion that presents itself as warranted (truthful/knowledgeable). By explicitly disavowing knowledge ("I don't know if I'm right"), Mike fails to satisfy the normative condition required to trigger the default entitlement. The speech act lacks the necessary assertoric force.

  **Single Feature:** The speaker's explicit disavowal of epistemic warrant.

  **Confident Variant:** If Mike asserts "The backup failed" confidently without the hedge, the Anti-Reductionist accepts (default entitlement triggers). The Reductionist also accepts (assuming the background evidence remains). The verdicts converge, showing the inversion depends entirely on the disavowal.

  **Anti-Reductionist Fight-Back:** They might argue that the core speech act is still an assertion of content ("The backup failed"), and the hedge is merely a modal modifier that doesn't nullify the presentation of truth required for entitlement.

  \answer{Speaker's explicit epistemic disavowal}
