          *   *Functional:* Acoustic-to-neural transduction.
          *   *Phenomenological:* The *potential* for auditory qualia.
          *   *Sociological:* Membership in Deaf culture vs. Hearing world.
          *   *Crucial distinction:* GR usually looks at *preservation*. CI is *installation*. This is a key divergence.

      *   **Who is the Subject?**
          *   *GR:* The conscious self.
          *   *CI:* The developing child. But the child doesn't exist yet as a decision-maker.
          *   *Extended Subject:* The Deaf Community argues the "subject" includes the cultural lineage. The parents see the "subject" as an individual future citizen of the hearing world.

      *   **Standing to Decide:**
          *   *GR:* Usually the subject consents (or we imagine they do).
          *   *CI:* Proxy consent (parents). This is the ethical flashpoint. The GR framework struggles with proxy consent for identity-altering procedures.

      *   **The Replacement Ladder:**
          *   Is it a "part" replacement? Yes (cochlea).
          *   Is it functionally equivalent? Debatable. CI hearing is not natural hearing. It's coded electrical stimulation.
          *   Is it gradual? No, it's surgical. But the *adaptation* is gradual (mapping, therapy).
          *   *Key Point:* It restores a function that *never existed*. This breaks the "Ship of Theseus" logic where you replace rotting planks to keep the ship sailing. Here, you are adding an engine to a boat designed for sails, claiming it's still the same boat.

  4.  **Critical Evaluation (The "Honest Account"):**

      *   *Illumination:*
          *   Highlights the "Functionalist Assumption." GR assumes if function $F$ is preserved, Identity $I$ is preserved. CI controversy reveals that $F$ (hearing) is not neutral. Choosing $F$ as the goal privileges the hearing worldview.
          *   Highlights the "Boundary of the Self." Is the self just the brain, or the brain + culture + language?
      *   *Breakdown:*
