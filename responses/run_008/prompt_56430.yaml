          *   *The Normative Gap:* GR is descriptive/metaphysical (does identity persist?). CI is normative/ethical ( *should* this identity be pursued?). The framework cannot answer the "ought."
          *   *Level of Abstraction:* If you define function as "neural stimulation," CI works. If you define function as "participation in Deaf culture," CI fails. The framework doesn't tell you which level is "real."

