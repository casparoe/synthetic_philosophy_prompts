          *   Does choosing the level of abstraction (function preservation) take a side in the deafness dispute?
          *   Can the framework justify this choice, or does it inherit it?

  2.  **Initial Brainstorming & Concept Alignment:**
      *   *Gradual Replacement (GR):* Usually involves replacing parts of a system (neurons, brain regions) with functionally equivalent artificial parts to see if consciousness/identity persists. The core question is: "Is it still the same mind/person?"
      *   *Cochlear Implants (CI):* Replaces the *cochlea* (hair cells), not the brain. It bypasses damaged mechanics to stimulate the nerve.
      *   *The Conflict:* Medical model (fix the broken ear) vs. Cultural model (Deaf gain, linguistic minority).
      *   *The Tension:* GR assumes functional equivalence is the metric of success/continuity. The Deaf community argues that "function" (hearing/speaking) is not the only metric of a valid life/identity.
      *   *The "Subject":* In GR, it's usually the individual consciousness. In CI controversy, it's the child *and* their potential membership in the Deaf community.
      *   *Restoration vs. Creation:* CI in congenitally deaf children doesn't restore a lost function; it creates a new pathway for a function never experienced. This challenges standard GR thought experiments which usually assume maintenance of existing function.

  3.  **Drafting the Mapping (Section by Section):**

      *   **What is being replaced?**
