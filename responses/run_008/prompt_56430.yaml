answer: |-
  ### I. Mapping the Controversy onto the Gradual-Replacement Framework

  The gradual-replacement debate (often instantiated in the Ship of Theseus or Mind Uploading thought experiments) asks whether identity persists when constituent parts are substituted with functionally equivalent artificial components. To map the 1990s pediatric cochlear implant (CI) controversy onto this framework, we must identify the *substrate*, the *function*, the *subject*, and the *trajectory* of replacement.

  **1. What is being replaced?**
  In standard gradual-replacement scenarios, the object of replacement is a physical substrate (a neuron, a brain region) preserving a specific function (computation, signal processing). In the CI controversy, the mapping fractures across three distinct levels of description:

  *   **Signal Transduction (The Medical Level):** At the lowest level, the CI replaces the hair cells of the organ of Corti. The function being substituted is electro-mechanical transduction: converting sound waves into neural spikes. Here, the replacement is partial and external. The electrode array sits in the cochlea, but the processor is behind the ear.
  *   **Sensory Modality (The Phenomenological Level):** At this level, the claim is that the CI replaces "hearing." However, this is contentious. A CI does not restore natural hearing; it provides a coded electrical approximation. For a congenitally deaf child, there is no prior auditory qualia to restore. Thus, the CI is not replacing a *lost* modality but installing a *novel* channel of information. In gradual-replacement terms, this is not swapping a rotting plank for a new one; it is attaching a motor to a sailboat and claiming it is still a sailboat.
  *   **Form of Life (The Sociological Level):** The Deaf community argues that what is actually being replaced is not a biological function but a *cultural trajectory*. By enabling spoken language, the CI substitutes a Deaf form of life (visual-spatial language, community interdependence) for a Hearing form of life (auditory-verbal language, individual assimilation). In this description, the "part" being replaced is the child's potential membership in a linguistic minority.

  **2. Who occupies the role of the subject?**
  In philosophy of mind replacement arguments, the "subject" is typically the locus of consciousness whose continuity is in question.
  *   **The Individual Child:** In the medical model, the subject is the biological organism. The goal is to maximize the organism's functional range within the majority environment.
  *   **The Community as Subject:** The Deaf opposition posits a distributed subjectivity. The "self" to be preserved is not just the individual child but the intergenerational continuity of Deaf culture. From this view, implanting a child is akin to replacing a plank in the Ship of Theseus with a material that dissolves the ship's structural integrity. The subject whose functions are being substituted is the *culture itself*, using the child as the vessel.

  **3. Who has standing to decide?**
  Gradual-replacement thought experiments usually assume the consent of the subject (e.g., "Would *you* upload?"). The CI controversy breaks this condition.
  *   **Proxy Consent:** The decision is made by hearing parents (90%+ of deaf children are born to hearing parents) for a child who cannot consent.
  *   **The Epistemic Gap:** The parents lack the phenomenological knowledge of deafness, while the Deaf community lacks legal guardianship. The replacement framework struggles here: if identity is at stake, can a proxy authorize a fundamental alteration of the future subject's mode of being? The controversy highlights that in pediatric cases, "identity preservation" is actually "identity construction."

  **4. Where the Implant sits on the Replacement Ladder**
  Standard uploading arguments rely on a ladder of increasing substitution (neuron $\to$ chip $\to$ whole brain). The CI occupies a precarious rung:
  *   **External/Partial:** It is not fully integrated (it can be turned off/removed), suggesting it is a tool rather than a constitutive part of the self.
  *   **Generative vs. Preservative:** This is the critical divergence. Uploading assumes the *preservation* of existing mental states. Pediatric CI is *generative*; it creates the conditions for a mind that speaks and hears, which would not have existed otherwise. It does not preserve a function that *did* exist; it actualizes a function that *did not*. This moves the debate from "Is it the same mind?" to "Is this a better mind to have?"

  ---

  ### II. Critical Evaluation: Illumination and Breakdown

  The gradual-replacement framework is a functionalist tool. It assumes that if input-output relations (or internal computational states) are maintained, the identity persists. Applying this to the CI controversy reveals where functionalism illuminates the mechanics of the dispute and where it collapses under the weight of normative and congenital realities.

  **1. Where the Framework Illuminates**
  The framework successfully exposes the **Functionalist Assumption** at the heart of the medical model.
  *   **Abstraction as Bias:** The gradual-replacement argument works only if one accepts a specific level of abstraction as the "true" function of the ear. If the function is defined as "delivering distinguishable signals to the auditory nerve," the CI is a successful replacement. The framework illuminates that the medical victory relies on defining the ear as a *transducer* rather than a *cultural gateway*.
  *   **The Boundary of the Self:** The controversy forces the philosophy of mind to confront whether the "self" includes its linguistic medium. If language shapes thought (Sapir-Whorf), then switching from Sign to Speech via CI is not merely a sensory upgrade; it is a cognitive restructuring. The replacement framework highlights that we are not just swapping hardware; we are changing the operating system the hardware runs.

  **2. Where the Framework Breaks**
  The framework fails to resolve the controversy because it is metaphysical, while the controversy is normative and developmental.

  *   **The Congenital Problem:** Standard replacement arguments (like Parfit's Teletransporter) assume an existing consciousness to be transported or preserved. In congenital deafness, there is no auditory consciousness to preserve. The CI does not maintain continuity of experience; it initiates a new stream of experience. The question "Is it the same person?" is incoherent here because the "person" (as a linguistic agent) is being constituted *by* the procedure. The framework cannot handle *creation* disguised as *restoration*.
  *   **The Normative Gap:** Gradual replacement asks, "Does identity persist?" The CI controversy asks, " *Should* this identity be pursued?" The framework has no resources to evaluate whether a "hearing identity" is superior to a "Deaf identity." It treats the hearing state as the neutral baseline for function, thereby inheriting the medical bias it ought to analyze.

  **3. The Level of Abstraction Trap**
  You asked whether choosing the level of abstraction at which function is preserved already takes a side. **The answer is yes.**

  *   **Choosing the Biological Level:** If we define the function to be preserved as "neural stimulation of the auditory cortex," the CI is a successful replacement. This validates the medical model (Deafness = deficit).
  *   **Choosing the Sociolinguistic Level:** If we define the function to be preserved as "fluent participation in a visual-gestural linguistic community," the CI is a failed replacement (or a destructive one). This validates the Cultural model (Deafness = difference).

  The gradual-replacement framework cannot justify which level of abstraction is the correct one. It simply inherits the choice from the user. In the context of mind uploading, proponents assume the "computational level" is the correct abstraction for the mind. In the CI controversy, medical proponents assume the "physiological level" is the correct abstraction for the ear.

  **Conclusion**
  The gradual-replacement framework illuminates the CI controversy by revealing that the dispute is not about biology, but about **functional description**. It shows that the medical case for implantation rests on a functionalist claim: that the "mind" of the child is independent of the "modality" of their language, and that the modality can be swapped without loss of self.

  However, the framework breaks because it cannot adjudicate between competing functional descriptions. It treats the "hearing function" as a neutral variable to be optimized, whereas the Deaf community argues it is a value-laden constraint. Ultimately, the framework inherits the bias of the hearing world: it assumes that the goal of replacement is to approximate the majority phenotype. It cannot account for the possibility that the "deficit" being repaired is only a deficit relative to a specific environment, not a deficit of the organism itself. To apply the gradual-replacement lens here is to already risk accepting the premise that the deaf child is a "broken hearing person" rather than a "whole deaf person."
