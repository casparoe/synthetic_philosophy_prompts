answer: |-
  During a liability hearing for a collapsed scaffolding rig, the tribunal must determine if the site supervisor violated safety code §12, which forbids continuing work if "the load-bearing stabilizer is compromised." The supervisor had logged: "The load-bearing stabilizer is not compromised." However, investigation reveals this specific rig model lacks a load-bearing stabilizer entirely; the part was discontinued and never installed. The insurance payout hinges on whether the supervisor's log entry counts as a true statement assuring safety (wide scope) or a false claim about a non-existent part (narrow scope), as the code treats false assurances as gross negligence voiding coverage.

  **1. Russell's Quantificational Analysis**
  On Russell's view, the definite description "the load-bearing stabilizer" is analyzed as an existential quantifier requiring uniqueness. The sentence "The load-bearing stabilizer is not compromised" is ambiguous based on the scope of the negation.
  *   **Wide-Scope Negation:** "It is not the case that there is exactly one load-bearing stabilizer and it is compromised." Formally: $\neg \exists x (Sx \land \forall y (Sy \rightarrow y=x) \land Cx)$. Since there is no stabilizer, the existential claim inside the negation is false, making the negation **True**.
  *   **Narrow-Scope Negation:** "There is exactly one load-bearing stabilizer and it is not compromised." Formally: $\exists x (Sx \land \forall y (Sy \rightarrow y=x) \land \neg Cx)$. Since there is no stabilizer, the existential claim is false, making the entire conjunction **False**.

  **2. The Strawsonian Alternative**
  A Strawsonian would argue that the utterance carries a presupposition that there exists a unique load-bearing stabilizer. Because this presupposition fails (the part does not exist), the statement suffers from presupposition failure and lacks a truth value entirely; it is neither true nor false. Consequently, the tribunal cannot record the assertion as "true" to validate the supervisor's compliance. Instead, they should treat the log entry as an invalid certification—a misfired speech act—likely ruling that the supervisor failed to meet the requirement of certifying an actual safety mechanism, thus voiding the insurance regardless of truth-value gaps.

  **3. Practical Stakes and Resistance**
  The feature making the scope question matter is the binary regulatory trigger: the legal framework maps "True" to compliance (payout) and "False" to negligence (no payout), leaving no procedural room for truth-value gaps. A defender of the presupposition account would resist the obligation to treat the utterance as true by arguing that practical contexts prioritize communicative felicity over logical form. They would contend that a certification is a speech act requiring satisfied preconditions; if the object certified does not exist, the act is void. To treat a voided certification as "true" simply because a wide-scope negation holds logically would be to confuse logical consistency with successful communication, effectively rewarding the supervisor for certifying a phantom part.
