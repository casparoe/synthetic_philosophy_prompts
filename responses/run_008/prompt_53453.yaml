answer: |-
  First, please allow me to express my sympathy for what your family is enduring. Stroke recovery is a marathon, not a sprint, and having to navigate legal assessments whilst worrying about your mother's health is an immense burden. It is understandable that you find your brother's argument intellectually impressive but emotionally hollow.

  Your brother has constructed a classic philosophical puzzle known as the **Sorites Paradox** (or the Paradox of the Heap). It is a powerful logical tool, often used in law school to teach students about the limits of language. However, whilst his logic is internally consistent, it relies on a category error regarding how the law functions in the real world.

  To preserve your intuition that (5) is false—that categories like capacity *do* state facts—you should reject **step (4)**.

  ### Why reject step (4)?

  Step (4) claims that because the boundary is vague, there is "no fact of the matter" and the assessment is a "fiction." This is the leap from *epistemic uncertainty* (we cannot see the exact line) to *ontological nihilism* (the line does not exist).

  In law, and particularly under the Mental Capacity Act 2005 (which I assume governs this assessment given your use of British English), a "fact of the matter" is not always a **brute fact** (like having a heartbeat or a specific blood alcohol level). Instead, it is often an **institutional fact**.

  An institutional fact exists only because of a system of rules and a recognised procedure. For example, whether two people are "married" is not determined by a gradual biological gradient of affection; it is determined by a specific ceremony and registration. Similarly, whether your mother has capacity is not merely a measurement of her neurons firing; it is a status conferred by a competent assessor following a statutory process.

  By rejecting (4), you are asserting that the assessment is not a fiction, but rather a **procedural mechanism to settle a borderline case**. The law recognises that vagueness exists, but it does not allow that vagueness to paralyse decision-making. It mandates that a line *must* be drawn at a specific time for a specific purpose. Once drawn by the proper authority, it becomes a fact for all legal and practical purposes.

  ### What does rejecting (4) cost you?

  Rejecting this step does come with a cost, which you must be prepared to accept. It requires you to concede that capacity is not a purely natural property waiting to be discovered, like gold in a riverbed. Instead, it is a **normative status**.

  1.  **You accept that the 'fact' is partly created by the process.** You must acknowledge that the assessor is not merely a scientist observing nature, but an agent of the law whose judgement helps constitute the reality of your mother's status. This might feel uncomfortable, as it suggests the outcome relies partly on human judgement rather than pure biological determinism.
  2.  **You accept pragmatic necessity over metaphysical perfection.** You are agreeing that the law prioritises a workable decision over a perfect description of reality. We draw the line not because nature has provided a clear break, but because your mother needs a place to live, and a decision must be made *now*.

  ### A secondary note on step (2)

  Whilst rejecting (4) is the philosophical key to saving (5), your brother is also on shaky ground legally with **step (2)**. He argues the statutory test "does not sharpen" the abilities. In English and Welsh law, this is arguably incorrect.

  The Mental Capacity Act test is **decision-specific**. It does not ask, "Does she have capacity?" in the abstract. It asks, "Does she have capacity to decide *where she lives*?" The complexity of the decision acts as a variable. If the decision were "What shall I have for tea?", the threshold of ability required would be low, and she might clear it easily. Because "where to live" is complex, the threshold is higher.

  This means the threshold is not a fixed point on her recovery gradient; it is a moving target dependent on the decision at hand. This further undermines the idea that the assessment is a fiction. It is a functional evaluation, not just a medical measurement.

  ### Conclusion

  Your brother is right that recovery is gradual (1), and he is right that the law uses vague terms (2). But he is wrong to conclude that this renders the assessment a fiction (4).

  By rejecting (4), you preserve the reality of the assessment without denying the medical reality of her recovery. You accept that the law's job is not to mirror the fuzziness of nature, but to provide clear structures within which we can care for one another. The assessment is not a lie; it is a necessary tool to ensure your mother is safe and supported whilst she heals.

  I hope this provides you with the clarity you need to discuss this with your brother, and I wish your mother a continued and steady recovery.
