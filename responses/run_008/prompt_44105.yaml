  Is the dispute merely verbal? In one sense, yes. Both can model standard modal logic. But the translation manual between them is costly. To translate CT into TWI, you must introduce haecceities (primitive this-ness). To translate TWI into CT, you must introduce similarity metrics. These additions are not neutral; they carry metaphysical weight. Thus, the dispute is verbal only if you ignore the cost of translation. Most philosophers refuse to ignore the cost. They view the extra machinery as a bug, not a feature. This is why the debate feels like a stalemate: both sides see the other's solution as ad hoc. The TWI side sees counterparts as an unnecessary multiplication of entities. The CT side sees transworld identity as magic. Because neither "cost" is empirically measurable, the debate relies on aesthetic and intuitive judgments about parsimony and intelligibility. These judgments rarely change over decades. The semantics follow the metaphysics. Consequently, the debate persists because the underlying ontology (Modal Realism vs. Actualism) remains unresolved. Until philosophers agree on what a "world" is, they cannot agree on how objects relate across them.

