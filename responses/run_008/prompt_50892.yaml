answer: |-
  This is a strong set of intuitions, and your suspicion that some of them are driven by normative concerns (what we *ought* to do) rather than metaphysical ones (what cognition *is*) is philosophically astute.

  You asked for a single principle that is precise enough to make predictions, applied to your cases and the two new ones, with a direct confrontation of the Phone/Otto conflict. I am not going to give you a principle that rubber-stamps your current list, because your current list contains a contradiction (Otto vs. Phone) that cannot be resolved without shifting one of the verdicts.

  Here is the principle, the application, and the necessary sacrifices.

  ### The Principle: Functional Transparency and Task-Relative Integration

  To avoid the "rubber stamp" problem, we need a principle that relies on the *dynamics of use* rather than the *location of the hardware*.

  **Principle:** An external resource is part of a cognitive system if, during the execution of a specific task, it satisfies two conditions:
  1.  **Transparency:** The resource withdraws from focal attention during operation. You do not think *about* the tool; you think *with* it. (Like the blind person's cane: she feels the curb, not the wood).
  2.  **Task-Relative Integration:** The resource is treated as a reliable, endorsed component of the feedback loop *for that specific goal*. The agent does not verify the resource's output against internal memory before acting; the output *is* the basis for action.

  **Why this matters:** This principle separates "using a tool" (where the tool is the object of attention) from "extended cognition" (where the tool is the medium of attention).

  ---

  ### Applying the Principle to Your Verdicts

  **1. Otto's Notebook: YES.**
  *   **Transparency:** Otto doesn't stare at the book wondering if it's true; he looks to find the address. The book withdraws.
  *   **Integration:** He trusts it implicitly. It is his memory store.
  *   **Verdict:** Consistent with EMT.

  **2. Blind Person's Cane: YES.**
  *   **Transparency:** High. The sensation is at the tip of the cane, not the hand.
  *   **Integration:** It is the primary sensory input for navigation.
  *   **Verdict:** Consistent. (Note: Some philosophers call this *embodied* rather than *extended*, but under your framework, it counts).

  **3. Phone/Navigation: YES (You must update this verdict).**
  *   **The Conflict:** You say Otto is Yes, but Phone is No. Functionally, this is inconsistent.
  *   **Analysis:** When you navigate with GPS, do you look at the phone and think, "The satellite says turn left"? No. You look at the road and *feel* the turn. The phone withdraws. You trust it implicitly (until it fails).
  *   **Why your gut says No:** You are likely conflating *multi-functionality* with *cognitive status*. Because the phone also makes calls and plays music, it feels like a "tool." But when it is doing navigation, it is functioning as a spatial memory module.
  *   **Correction:** If Otto counts, the Phone must count. The only difference is that Otto's book is dedicated to memory, while your phone is a Swiss Army knife. But when the "blade" is out, it cuts the same way.
  *   **Prediction:** If you leave your phone at home, you are cognitively impaired regarding navigation, just as Otto is regarding addresses.

  **4. Formula Sheet (Exam): NO (But for a specific reason).**
  *   **Your Suspicion:** You suspected this is about "what an exam is for." You are correct.
  *   **Analysis:** Under the **Task-Relative Integration** clause, the "task" here is crucial.
      *   If the task is "Solve this physics problem," the sheet *is* integrated. It functions as memory.
      *   If the task is "Demonstrate internalized neural capacity," the sheet is *excluded by definition*.
  *   **Verdict:** The sheet is cognitively extended relative to the *physics*, but not relative to the *examination*. Your "No" verdict is correct only if you define the cognitive system as "The Student-Being-Tested." If you define it as "The Student-Solving-Problems," it's a Yes.
  *   **Advice:** Keep your "No," but acknowledge it is a normative boundary (rules of the game), not a metaphysical one (nature of mind).

  **5. Pianist/Sheet Music: NO.**
  *   **Analysis:** This is different from Otto. Otto retrieves a static fact (address). The pianist is processing dynamic information in real-time. Reading sheet music is more like *perception* than *memory*.
  *   **Transparency:** A pro pianist does not focus on the dots; they focus on the sound.
  *   **Integration:** However, the sheet music is not storing *their* cognition; it is storing the *composer's* cognition. The pianist is decoding, not retrieving.
  *   **Verdict:** Keep your "No." This is not offloading memory; it is real-time input processing. It's the difference between remembering a speech (Otto) and reading a teleprompter (Pianist).

  **6. Autocorrect: YES (Partial).**
  *   **Analysis:** You noted you struggle unassisted. This suggests the *verification process* has been offloaded.
  *   **Transparency:** You type; the correction happens. You often don't notice the red line until it disappears.
  *   **Verdict:** It is part of your *orthographic production system*, but not necessarily your *linguistic competence*. It is a motor-cognitive extension. It's not "chilling"; it's standard tool use that has become transparent.

  ---

  ### The Two New Cases

  **Case A: The Smart Home (Groceries/Plants)**
  *   **Scenario:** A system alerts you when milk is low or plants need water.
  *   **Application:**
      *   **Transparency:** Low. The alarm interrupts you. It demands attention rather than withdrawing.
      *   **Integration:** It is a *reminder*, not a *memory store*. It prompts you to initiate a task, but it does not hold the content of the thought ("I need milk because I'm making pancakes") nor does it participate in the reasoning.
  *   **Verdict:** **No.** This is an alarm clock, not a mind. It regulates behavior but does not constitute cognitive processing. It lacks the bi-directional manipulation of information that Otto's notebook has.

  **Case B: The Neural Implant (Facts under the skull)**
  *   **Scenario:** A chip stores facts like Otto's notebook, accessed via thought.
  *   **Application:**
      *   **Transparency:** Perfect. It is internal.
      *   **Integration:** Perfect.
  *   **Verdict:** **Hard Yes.**
  *   **Why:** This is the *reductio ad absurdum* for internalists. If you accept Otto (outside the skull) but reject the Implant (inside the skull), you are a biological chauvinist, not a functionalist. If Otto's notebook is part of his mind because of *what it does*, then a chip doing the exact same thing is part of the mind regardless of location.
  *   **Prediction:** If the implant is hacked, the victim's mind has been tampered with, not just their property.

  ---

  ### The Hard Truths (Where you need to yield)

  You asked me to push back if your verdicts are confused. Here is the pushback:

  **1. You must surrender the distinction between Otto and the Phone.**
  There is no non-ad-hoc principle that grants Otto "memory" status while denying it to your GPS. Both are external storage, both are trusted, both are consulted automatically.
  *   *Why you resist:* You feel "cognitively naked" without the phone, which feels like dependence, not integration. But Otto feels naked without his book. Dependence is a *symptom* of integration.
  *   *The Cost:* If you accept the Phone is part of your mind, you must accept that when your battery dies, you aren't just inconvenienced; you are *cognitively impaired*, similar to a sudden onset of amnesia regarding spatial data. This is a heavy bullet to bite, but it is required for consistency.

  **2. Your Formula Sheet intuition is right, but your reasoning needs adjustment.**
  You suspected this was about "what an exam is for." That is correct. The Formula Sheet case reveals that "Cognition" is not a fixed boundary like a skin; it is a *functional boundary* that shifts based on the goal.
  *   *The Adjustment:* Don't say the sheet is "not cognition." Say the sheet is "cognition that is disallowed by the social contract of the exam." This preserves the philosophy without violating the rules of the classroom.

  **3. Autocorrect is not "chilling."**
  You worried this was a confession of decline. It isn't. We offloaded calculation to abacuses, then to slide rules, then to calculators. We didn't lose "math minds"; we changed the locus of calculation. Offloading spelling frees up cognitive RAM for argument structure and idea generation. It is a trade-off, not a loss.

  ### Summary of Recommended Verdicts

  | Case | Your Gut | Recommended Verdict | Reason |
  | :--- | :--- | :--- | :--- |
  | **Otto's Notebook** | Yes | **Yes** | The baseline case. |
  | **Blind Cane** | Yes | **Yes** | Transparency is high. |
  | **Phone (GPS)** | **No** | **Yes** | **Inconsistent with Otto.** Functionally identical. |
  | **Formula Sheet** | No | **No (with caveat)** | Excluded by *task definition* (testing internal capacity), not cognition itself. |
  | **Pianist** | No | **No** | Real-time perception/decoding, not memory retrieval. |
  | **Autocorrect** | Unsure | **Yes** | Transparent motor-cognitive offloading. |
  | **Smart Home** | (New) | **No** | Reminder/Alarm, not information processing/storage. |
  | **Neural Implant** | (New) | **Yes** | Location is irrelevant; function is identical to Otto. |

  **Final Advice:**
  If you want to win the argument with your roommate, stop defending the Phone/Notebook distinction. It is the weakest link in your armor. Instead, argue for the **Task-Relative** nuance. Argue that the *boundary of the mind* is fluid: it expands to include the phone during navigation, excludes the formula sheet during an exam, and excludes the smart home because it doesn't process information, it just signals.

  That is a more sophisticated, defensible position than trying to draw a permanent line between a notebook and a smartphone.
