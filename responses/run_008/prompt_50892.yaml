          6.  Avoid ad-hoc principles (no "rubber stamping" gut feelings).
          7.  Be willing to push back on the case-method approach if it's flawed.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Core Tension:** The Parity Principle (Clark & Chalmers) states: "If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world *is* (so we claim) part of the cognitive process."
      *   **The User's Conflict:** The user accepts Otto (notebook) but rejects Phone (GPS) and Formula Sheet. Functionally, these look very similar (external storage/retrieval). Why the distinction?
      *   **Potential Distinguishing Factors:**
          *   *Coupling/Integration:* How tight is the feedback loop? (Cane is tight, Phone is looser).
          *   *Individualization:* Is it customized to the user? (Otto's book is, Phone app is generic).
          *   *Endorsement/Trust:* Does the user automatically trust it? (Otto does, Phone users might double-check).
