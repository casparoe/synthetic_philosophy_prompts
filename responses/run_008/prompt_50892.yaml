prompt: |-
  I've been arguing with my roommate about the extended mind thing all week and I want to try the case-by-case route instead of trading quotes from Clark and Chalmers at each other. Here are my gut verdicts, for what they're worth. Otto with his notebook: yes, that's his memory, I buy the classic case. A blind person's cane for spatial awareness: yes, it feels like part of her, not a tool she consults. Me and my phone for directions: I honestly can't navigate without it anymore, I feel cognitively naked when the battery dies — but my gut says no, its still a tool, and I can't articulate why it's different from Otto. A student allowed a formula sheet in a physics exam: no, the sheet is doing memory work, but it's obviously not part of his cognition. Except the formula sheet has basically the same profile as Otto's notebook — consulted automatically, trusted, relied on for years — so one part of me wants to say yes and another says no, and I flip flop depending on the day. A pianist reading sheet music in performance: no, the score isn't part of his musical mind, even though it seems to satisfy whatever criteria saved the cane. And autocorrect: I've offloaded so much spelling that I struggle unassisted now, and I half-think the spellchecker is part of my writing process, which is either a chilling confession about me or just trivially true of everyone.

  So: is there a single principle that gets all of these, or close? If there is one, I want it stated precisely enough to make predictions, not just vibes, and then applied to two cases I haven't given — someone whose smart-home system remembers things for them (what groceries they're out of, when the plants need water), and a person with an implanted device that stores facts the way Otto's notebook does, just under the skull. Where do those fall? And crucially, why doesn't the principle give the same answer for my phone and Otto's notebook, since functionally they look pretty much alike to me? If the honest answer is that no non-ad-hoc principle saves every verdict, then tell me which verdicts I should give up — I have a suspicion it's the formula-sheet one and the pianist one, i.e. that my gut is smuggling in stuff about what an exam is for or what counts as "real" musicianship rather than anything about where cognition happens, but tell me if you think that suspicion is wrong. And if you think one of my verdicts is just confused — the autocorrect one feels like it might be a different question wearing the same clothes — or that the whole case-method approach is a mistake here, push back on it plainly instead of stretching a principle to fit. I'd rather lose a verdict than get handed a principle that's just my list of gut calls with a rubber stamp on it.
