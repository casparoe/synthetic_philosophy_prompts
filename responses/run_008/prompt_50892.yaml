      *   *Formula Sheet:* The user suspects this is about the *purpose of the exam*. This is a strong insight. Exams are designed to measure *internal* capacity. Using external aid defeats the *purpose of the test*, not necessarily the definition of cognition.
      *   *Pianist:* Similar to formula sheet. Is the music coming from the mind or the paper? If they sight-read, the processing is happening *now*, not retrieved. It's more like perception than memory.
      *   *Autocorrect:* This is tricky. Is it cognitive offloading or just motor correction? If I think "receive" and type "recieve," autocorrect fixes it. Did I know the spelling? If I rely on it so much I forget, has it become part of my orthographic cognition?

  4.  **Develop a Principle:**
      *   To satisfy the user's desire for precision, I need a principle that distinguishes *integration* from *coupling*.
      *   *Candidate Principle:* **The Integration/Transparency Criterion.** A resource is part of the cognitive system if it is *transparent* in use (withdraws from attention) and *integrated* into the feedback loop such that manipulating it is functionally equivalent to manipulating neural states.
      *   *Refinement:* Let's look at the "Glue and Trust" conditions (Clark 2008/2010).
          1.  Constant availability.
          2.  Direct accessibility.
          3.  Automatic endorsement (trust).
      *   *Problem:* The Phone meets these. The Formula Sheet meets these (in the context of the exam).
      *   *Alternative:* **The System-Goal Alignment.** Cognition is defined relative to the *goal of the agent*. If the goal is "get to the museum," Otto's book is part of the system. If the goal is "demonstrate internal knowledge" (Exam), the sheet is excluded *by definition of the goal*, not the cognition.
      *   *Better Approach:* Acknowledge that the user's gut on the Phone and Formula Sheet might be driven by *normative* concerns (what we *should* rely on) rather than *descriptive* concerns (what *is* cognition).
      *   *Proposed Principle:* **The Functional Transparency & Historical Entrenchment Principle.**
          *   *Transparency:* The tool withdraws from focal attention during operation (like the cane).
          *   *Entrenchment:* The specific resource is uniquely calibrated to the agent over time (Otto's book vs. a generic phone app).

  5.  **Address the Specific Conflicts (Phone vs. Otto):**
      *   Why is Otto "Yes" and Phone "No" for the user?
      *   *Argument:* Otto's notebook is a *dedicated* memory store. He writes in it, he reads from it. It is bi-directional. The Phone (GPS) is often read-only (consumption) or generic (everyone sees the same map).
      *   *Counter-argument:* If I save "Home" and "Work" and use voice commands, it's bi-directional.
      *   *Honest Answer:* Functionally, they *are* alike. If you accept Otto, you logically must accept the Phone *unless* you introduce a boundary based on biology (which defeats EMT) or specific integration (which is fading with smartphones).
      *   *Recommendation:* The user should probably concede the Phone case if they keep Otto. The distinction is eroding.

  6.  **Address the New Cases:**
      *   *Smart Home:* Remembers groceries/plants.
          *   *Analysis:* Is this *cognition*? Remembering to buy milk is a cognitive task. If the system alerts you, is it remembering *for* you or *with* you?
          *   *Verdict:* Likely No (or weak Yes). It's more like an alarm clock than a memory store. It prompts, but doesn't store the *content* of the thought in a manipulable way during reasoning.
      *   *Neural Implant:* Facts under the skull.
          *   *Analysis:* This is the "Neo-Otto."
          *   *Verdict:* Hard Yes. If Otto's notebook counts, this *must* count. It removes the "skin and skull" boundary entirely.

  7.  **Address the "Gut Feelings" (Formula Sheet/Pianist):**
      *   The user suspects these are normative (about exams/music) rather than metaphysical (about mind).
      *   *Confirmation:* This is correct. An exam tests *internalized* capacity. Using an external aid cheats the *test*, not the definition of mind.
      *   *Pianist:* Reading sheet music is perception + motor control. The "memory" is in the paper, but the "music-making" is the interaction. It's borderline.

  8.  **Address Autocorrect:**
      *   Is it cognition? It's motor execution + orthographic verification. If you don't know the spelling and rely on the red line, the *verification* process is extended.
      *   *Verdict:* It is part of the *writing system*, but maybe not the *linguistic competence*.

  9.  **Structure the Response:**
      *   **Introduction:** Validate the approach. Case-by-case is good, but requires a consistent metric.
      *   **The Principle:** Propose the "Transparency + Entrenchment" principle (based on Clark's later refinements).
      *   **Applying the Principle:** Walk through the user's cases.
      *   **The Hard Truth (Phone vs. Otto):** Explain that functionally they *are* the same, and the user's resistance is likely due to the "Skin/Skull" bias or the "Generic vs. Personal" distinction. Advise updating the Phone verdict.
      *   **The Normative Trap (Exam/Pianist):** Confirm the user's suspicion. These are about social practices, not cognitive boundaries.
      *   **The New Cases:** Apply the principle to Smart Home (No/Weak) and Implant (Yes).
      *   **Critique of Autocorrect:** Distinguish between *process* and *competence*.
      *   **Conclusion:** Summary of what to keep and what to drop.

  10. **Refining the Principle (Self-Correction during drafting):**
      *   I need to be careful not to just restate Clark & Chalmers since the user wants to move past quotes.
      *   I need to make sure the distinction between Phone and Otto is addressed head-on. If I say they are the same, I challenge the user's gut. If I say they are different, I need a non-biological reason.
      *   *Idea:* The "Bi-directional Flow" criterion. Otto writes *to* the book and reads *from* it. GPS is often read-only. But modern phones are bi-directional (notes, calendars).
      *   *Decision:* I will argue that the user's distinction between Otto and Phone is unsustainable under strict functionalism. I will encourage them to flip the Phone verdict to "Yes" to maintain consistency, OR drop Otto to "No" (internalism). Since they started with "Otto: Yes," I'll push them to "Phone: Yes."
      *   *Wait, one nuance:* The "Formula Sheet" case. Why is that different? Because the *system boundary* is defined by the *task*. In an exam, the task is "internal retrieval." In navigation, the task is "get there." This is the "System-Goal" argument.

  11. **Final Polish:** Ensure tone is respectful, philosophical but accessible, and directly answers the prompts (New cases, Phone vs. Otto, Verdict check).

      *(Self-Correction on Smart Home)*: A smart home remembering groceries is more like a post-it note than a notebook. It's a reminder, not a storage of semantic knowledge used in reasoning. I should distinguish *reminders* from *memory*.

      *(Self-Correction on Implant)*: This is the "Invasion of the Body Snatchers" objection. If it's under the skull, is it *you*? EMT says location doesn't matter. So Implant = Yes.

      *(Final Plan)*:
