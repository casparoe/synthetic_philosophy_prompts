prompt: |-
  One part of most legal systems treats vagueness as a fatal defect: courts will strike down a criminal statute as void for vagueness when its terms fail to give people of ordinary intelligence fair notice of what is prohibited and fail to constrain enforcement officials with determinate standards. Another part treats vagueness as an ordinary resource: the same systems routinely uphold statutes built on predicates like reasonable, due care, cruel, or obscene, and legislatures cure vagueness worries by stipulating sharp thresholds — a fixed blood-alcohol limit, a fixed age of majority — whose arbitrariness at the margins is openly admitted. What account of vagueness does this bundle of practices presuppose? Consider in particular whether the fair-notice requirement fits epistemicism, on which vague terms have sharp boundaries that we simply cannot know, so that a vague criminal statute prohibits a determinate but unknowable range of conduct; or supervaluationism, on which borderline applications lack truth value, so that a vague prohibition fails to bind at all in penumbral cases; or whether the practice is compatible with several theories of vagueness and needs none in particular. Reconstruct the implicit view, say whether the three parts of the practice presuppose something consistent, identify where the practice is philosophically underdetermined, and explain what would have to change in adjudication or legislative drafting if the presupposed view were replaced by its rival.
reasoning: |-
  Here's a thinking process that leads to the suggested essay:

  1.  **Deconstruct the Prompt:**

      *   **Core Phenomenon:** Legal systems have a dual attitude toward vagueness.
          *   Attitude 1 (Fatal Defect): "Void for vagueness" doctrine in criminal law (needs fair notice + constrained enforcement).
          *   Attitude 2 (Ordinary Resource): Use of standards like "reasonable," "due care," etc., and the use of sharp thresholds (blood-alcohol limits) despite admitted arbitrariness.
      *   **Task:** Analyze what account of vagueness this bundle of practices presupposes.
      *   **Specific Theories to Consider:**
          *   Epistemicism (sharp boundaries exist but are unknowable).
          *   Supervaluationism (borderline cases lack truth value).
          *   Compatibility/Underdetermination (does the practice need a specific theory?).
      *   **Required Outputs:**
          1.  Reconstruct the implicit view.
          2.  Assess consistency across the three parts of the practice (void for vagueness, standards, thresholds).
          3.  Identify where the practice is philosophically underdetermined.
          4.  Explain implications of switching to a rival theory (adjudication/legislative drafting changes).

  2.  **Initial Brainstorming & Analysis:**

      *   *The "Void for Vagueness" Doctrine:* This seems to demand clarity. If a law is too vague, it's unconstitutional. Why? Because people can't know what's forbidden (fair notice) and police/prosecutors have too much discretion (arbitrary enforcement).
          *   *Epistemicism:* If boundaries are sharp but unknowable, *every* vague law is technically void for vagueness because no one can know the boundary. This contradicts the fact that we uphold laws with "reasonable."
          *   *Supervaluationism:* If borderline cases aren't true/false, then in those cases, the law doesn't apply. This might support striking down laws where the "core" is too small or the "penumbra" too large, but it struggles with the idea that "reasonable" is acceptable.
          *   *Pragmatic/Functional View:* The law isn't doing metaphysics. It's doing governance. Vagueness is bad when it creates *unacceptable risk* of error or abuse, not when it creates *metaphysical indeterminacy*.

      *   *Standards ("Reasonable," "Obscene"):* These are inherently vague but upheld. Why? Because they delegate authority to judges/juries to contextualize. They rely on community standards.
          *   This suggests vagueness is a feature, not a bug, allowing flexibility.
          *   Epistemicism fits poorly here (is there a sharp line for "reasonable"? If so, why let a jury decide?).
          *   Supervaluationism fits better (it's true in all precisifications that gross negligence is "unreasonable," false that careful conduct is, but borderline is indeterminate -> let a jury decide).

      *   *Sharp Thresholds (BAC limits, Age):* Legislatures cure vagueness by making arbitrary lines.
          *   This admits that the underlying concept (intoxication, maturity) is vague/gradual.
          *   This is a *stipulative* move. It overrides natural language vagueness with legal precision.
          *   This suggests the law cares more about *administrability* than *metaphysical accuracy*.

      *   *Consistency:* Is it consistent to strike down vague criminal laws but uphold vague tort standards? Yes, if the *stakes* differ (liberty vs. liability) or the *mechanism* differs (ex ante notice vs. ex post adjudication).
      *   *Underdetermination:* The law doesn't seem to commit to *why* vagueness exists (semantics vs. epistemology), but rather *how to manage it*. It's functionalist.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the paradox. Law hates vagueness in criminal statutes but loves it in torts/standards and cures it with arbitrary lines. Thesis: The legal practice presupposes a *functionalist* or *pragmatic* account of vagueness, not a semantic/metaphysical one. It treats vagueness as a problem of *authority and notice*, not truth conditions.

      *   **Reconstructing the Implicit View:**
          *   The law operates on a "Core and Penumbra" model (Hart).
          *   Vagueness is fatal when the "core" is missing or the "penumbra" swallows the rule, leading to arbitrary power.
          *   Vagueness is acceptable when it delegates discretion to neutral arbiters (juries) in civil contexts or when the state interest outweighs the notice deficit.
          *   *Crucial Point:* The law treats "knowability" as social/conventional, not metaphysical. Fair notice means "can a normal person figure out if they are clearly in/out?" not "does a sharp boundary exist?"

      *   **Evaluating Semantic Theories (Epistemicism vs. Supervaluationism):**
          *   *Epistemicism:* If applied strictly, it undermines the "Void for Vagueness" doctrine. If sharp boundaries exist, notice is theoretically possible (even if hard). But the law strikes down laws *because* boundaries aren't knowable. So, law rejects strict epistemicism in practice.
          *   *Supervaluationism:* Fits better. Borderline cases lack truth. If a criminal law covers too many borderline cases, it fails to guide. However, Supervaluationism suggests borderline conduct is *not prohibited*. The law often treats borderline conduct as *subject to adjudication* (jury discretion), not automatically exculpated.
          *   *Conclusion:* The practice is underdetermined by these theories. It doesn't care about truth values; it cares about *power*.

      *   **Consistency Check:**
          *   Is it consistent to strike down vague criminal laws but uphold "reasonable care"?
          *   Yes, under a functionalist view. Criminal law requires *ex ante* guidance (liberty interest). Tort/Regulation often relies on *ex post* reasonableness (compensation/safety interest).
          *   Is it consistent to use arbitrary thresholds?
          *   Yes, because the goal shifts from matching moral reality to ensuring administrability.

      *   **Philosophical Underdetermination:**
          *   The law doesn't answer "What is vagueness?" It answers "When is vagueness dangerous?"
          *   It conflates semantic vagueness with syntactic ambiguity or lack of specificity.
          *   It assumes "ordinary intelligence" can resolve vagueness without defining how.

      *   **Implications of Switching Theories:**
          *   *If Epistemicism were adopted:* Defense attorneys would argue "You can't prove you knew the sharp boundary." Courts would have to admit boundaries exist but are hidden. This creates a crisis of legitimacy.
          *   *If Supervaluationism were adopted:* Defendants in borderline cases would have to be acquitted *as a matter of law* (no truth value = no crime), rather than sending it to a jury. This would shrink the scope of vague statutes significantly.
          *   *Current Practice (Pragmatism):* Juries decide borderlines. Legislatures draw lines.

  4.  **Refining and Polishing:**

      *   *Tone:* Analytical, philosophical, legal-theoretic.
      *   *Key Concepts:* H.L.A. Hart (core/penumbra), Rule of Law values, Delegated Discretion.
      *   *Structure:*
          1.  Introduction: The Dual Attitude.
          2.  The Implicit Functionalist View.
          3.  Testing Against Semantic Theories (Epistemicism/Supervaluationism).
          4.  Consistency of the Practice.
          5.  Underdetermination.
          6.  Counterfactual: What if we changed the theory?
          7.  Conclusion.

      *(Self-Correction during drafting)*: I need to make sure I explicitly address the "fixed thresholds" part of the prompt. How does that fit? It shows the law acknowledges vagueness is a gradient and chooses to impose precision for administrative ease, admitting the cost (arbitrariness). This supports the functionalist view over the semantic view.

      *(Refining the Epistemicism point)*: If epistemicism were true, the "Void for Vagueness" doctrine would be incoherent. Why strike down a law for lacking knowable boundaries if the boundaries *are* there, just hidden? The doctrine assumes the boundaries *aren't there* to be known (or at least not there *legally*). So the law implicitly rejects epistemicism.

      *(Refining the Supervaluationism point)*: If supervaluationism were true, borderline cases are neither true nor false. In criminal law (rule of lenity), this might mean acquittal. But courts often let juries decide. This suggests the law treats vagueness as a zone of *discretion*, not a truth-value gap.

  5.  **Final Review against Prompt Requirements:**
      *   Reconstruct implicit view? Yes (Functionalism/Rule of Law).
      *   Consistent? Yes (context-dependent).
      *   Underdetermined? Yes (semantic theories don't map perfectly).
      *   Changes if rival view adopted? Yes (Epistemicism/Supervaluationism implications).

  6.  **Final Polish:** Check for clarity, flow, and precise terminology. (Ensure "penumbra," "precisification," "ex ante/ex post" are used correctly).

  *(Self-Correction on "Three Parts"):* The prompt mentions: 1. Void for vagueness (criminal), 2. Standards (reasonable/etc.), 3. Thresholds (BAC/Age). I need to ensure I weave all three into the consistency analysis.

