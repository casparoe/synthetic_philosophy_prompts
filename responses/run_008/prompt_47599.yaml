answer: |-
  The legal system's dual attitude toward vagueness—treating it as a fatal defect in criminal statutes while embracing it in civil standards and legislative thresholds—reveals that the law does not operate with a unified semantic or metaphysical theory of vagueness. Instead, legal practice presupposes a **functionalist** or **pragmatic** account. On this view, vagueness is not a problem of truth conditions or ontological boundaries, but a problem of **authority, notice, and institutional competence**.

  The following analysis reconstructs this implicit view, tests it against semantic theories (epistemicism and supervaluationism), assesses the consistency of legal practice, and explores the consequences of adopting a rival theoretical framework.

  ### 1. Reconstructing the Implicit View: Functionalism and the Rule of Law

  The bundle of practices described presupposes that vagueness is permissible only when it serves a legitimate governance function and impermissible when it threatens the Rule of Law. This implicit view relies on three functional distinctions:

  1.  **Ex Ante Notice vs. Ex Post Adjudication:** In criminal law ("void for vagueness"), the primary value is *fair notice*. Citizens must be able to plan their conduct without fear of arbitrary prosecution. Here, vagueness is a defect because it prevents ex ante guidance. In torts or regulatory standards ("reasonable care"), the primary value is *contextual justice*. The law delegates authority to judges or juries to determine liability ex post based on specific facts. Here, vagueness is a resource that allows flexibility.
  2.  **Constrained Discretion vs. Guided Discretion:** The "void for vagueness" doctrine targets statutes that give enforcement officials (police, prosecutors) too much discretion, risking discriminatory application. However, standards like "obscene" or "cruel" are upheld because the discretion is transferred to neutral arbiters (juries) guided by community standards, rather than leaving it to the executive branch.
  3.  **Administrability vs. Moral Accuracy:** The use of sharp thresholds (e.g., 0.08% BAC) acknowledges that the underlying concept (intoxication) is vague. The legislature cures vagueness not by finding the "true" boundary of intoxication, but by stipulating an arbitrary line to ensure administrative efficiency and uniformity.

  **The Implicit Theory:** The law implicitly treats vagueness as a **gradient of determinacy** (reminiscent of H.L.A. Hart's "core and penumbra"). A statute is void if its "core" of settled meaning is too small or its "penumbra" of uncertainty is too large relative to the liberty interest at stake. It does not ask whether a sharp boundary *exists* metaphysically, but whether a workable boundary *can be drawn* institutionally.

  ### 2. Testing Against Semantic Theories

  Does this practice fit Epistemicism or Supervaluationism?

  **Epistemicism:** This theory holds that vague terms have sharp boundaries that are unknowable.
  *   *Conflict:* If epistemicism were the presupposed view, the "void for vagueness" doctrine would be incoherent. If a sharp boundary exists for "reasonable speed" or "dangerous weapon," then the statute *does* prohibit a determinate range of conduct. The fact that humans cannot know the boundary is an epistemological limitation, not a legal defect. Yet, courts strike down laws precisely because the boundary is not *legally* knowable.
  *   *Thresholds:* Epistemicism struggles to explain why legislatures stipulate arbitrary thresholds. If there is a sharp (but unknowable) age of moral maturity, stipulating "18" is an admission of ignorance. The law, however, treats "18" as constitutive, not descriptive.
  *   *Verdict:* Legal practice implicitly **rejects** epistemicism. It treats the unknowability of the boundary as a failure of the law itself, not a limitation of human knowledge.

  **Supervaluationism:** This theory holds that borderline cases lack a truth value (they are neither true nor false) because they are not true on all "precisifications" of the term.
  *   *Fit:* This aligns better with the "void for vagueness" doctrine. If a criminal statute fails to bind in penumbral cases (because there is no truth value), it fails to give notice.
  *   *Conflict:* In practice, courts do not treat borderline cases as "no law applied." They send them to juries. Under strict supervaluationism, a defendant in a borderline case of "obscenity" should be acquitted as a matter of law (since the proposition "this is obscene" is not super-true). Instead, the legal system treats the penumbra as a zone of **discretion**, not a truth-value gap.
  *   *Verdict:* Legal practice is **partially compatible** but ultimately diverges. It uses supervaluationist logic to justify striking down laws (the law doesn't cover this), but rejects it in adjudication (the jury decides the borderline).

  ### 3. Consistency of the Practice

  Is the bundle of practices consistent? **Yes, but only under the functionalist reconstruction, not under a strict semantic theory.**

  *   **Criminal Vagueness vs. Civil Standards:** It seems contradictory to strike down a vague criminal law while upholding a vague tort standard. However, functionally, this is consistent. Criminal law involves the deprivation of liberty and requires strict ex ante notice. Tort law involves compensation and relies on ex post reasonableness. The "defect" is not the vagueness itself, but the *context* in which it operates.
  *   **Standards vs. Thresholds:** It seems contradictory to uphold "reasonable care" (vague) while mandating "0.08% BAC" (sharp). Functionally, this is also consistent. "Reasonable care" requires contextual nuance that a number cannot capture. Driving intoxication requires high-volume, rapid adjudication where uniformity outweighs nuance. The law chooses precision where administrability is paramount and vagueness where contextual justice is paramount.

  The consistency lies in the **optimization of institutional design**, not in semantic coherence.

  ### 4. Philosophical Underdetermination

  The legal practice is philosophically underdetermined in two key areas:

  1.  **The Nature of the "Ordinary Intelligence" Test:** The "void for vagueness" doctrine asks whether a person of "ordinary intelligence" can understand the prohibition. This presupposes a shared linguistic competence but offers no theory of *how* that competence resolves vagueness. Is it by grasping a prototype? By sensing a sharp boundary? The law assumes a pre-theoretical consensus on meaning that philosophy cannot guarantee.
  2.  **The Status of Borderline Cases:** The law does not decide whether borderline conduct is *forbidden*, *permitted*, or *indeterminate*. It treats it as **delegated**. By sending borderline cases to juries, the law sidesteps the semantic question. It effectively says, "We don't know if this term applies, so we empower a community representative to decide." This is a political solution to a semantic problem.

  ### 5. Implications of Adopting a Rival Theory

  If the legal system were to replace its implicit functionalism with a rigorous commitment to either Epistemicism or Supervaluationism, adjudication and drafting would change radically.

  **Scenario A: Adopting Epistemicism**
  *   *Legislative Drafting:* Legislatures might stop trying to cure vagueness with thresholds, acknowledging that sharp boundaries already exist in nature/morality. Alternatively, they might draft even more complex statutes attempting to map the "unknowable" boundaries.
  *   *Adjudication:* The "void for vagueness" doctrine would collapse. Defense attorneys could not argue a law is too vague to know, only that the state failed to prove the defendant crossed the hidden line. This would shift the burden heavily to the accused to prove they were on the "safe" side of the unknowable boundary, undermining the presumption of innocence.
  *   *Result:* A crisis of legitimacy. Punishing someone for violating a boundary that is metaphysically sharp but humanly unknowable violates the principle that law must be public and guideable.

  **Scenario B: Adopting Supervaluationism**
  *   *Legislative Drafting:* Legislatures would need to ensure statutes are "super-true" across all reasonable precisifications. This would lead to extreme over-criminalization (to ensure the core covers everything) or extreme under-criminalization.
  *   *Adjudication:* In criminal cases, the "rule of lenity" would become absolute for borderline cases. If a defendant's conduct is borderline (lacks a truth value), they must be acquitted *as a matter of law*, not sent to a jury. Juries would be restricted only to "core" cases.
  *   *Result:* A significant reduction in the scope of vague statutes. Terms like "reasonable" or "dangerous" would become harder to enforce, as many applications would be deemed indeterminate. This would force legislatures to replace standards with rigid rules (thresholds) to avoid acquittals, reducing judicial discretion.

  ### Conclusion

  The legal system's bundle of practices presupposes neither epistemicism nor supervaluationism. It presupposes a **pragmatic instrumentalism**. Vagueness is a "fatal defect" when it undermines the specific Rule of Law value at stake (usually notice in criminal law), and an "ordinary resource" when it facilitates contextual judgment or administrative efficiency.

  The practice is consistent insofar as it prioritizes **institutional role** over **semantic precision**. It is philosophically underdetermined because it treats semantic indeterminacy as a cue for political delegation (to the jury or the legislature) rather than a logical puzzle to be solved. To replace this view with a strict semantic theory would be to prioritize metaphysical consistency over governance, likely paralyzing the legal system's ability to adapt to complex human conduct. The law manages vagueness not by solving it, but by allocating the power to resolve it.
