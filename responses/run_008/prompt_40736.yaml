      *   *James on Truth:* James *did* say truth is what "works." But "works" doesn't mean "makes me feel good." It means "guides us successfully through experience," "connects old truths with new," "has cash value." It's not purely subjective consolation. Religious faith, for James, is true *if* it leads to a better life *and* doesn't contradict other truths, specifically in contexts where evidence is undecidable (The Will to Believe). Calling it "simply consoling" is a straw man.
