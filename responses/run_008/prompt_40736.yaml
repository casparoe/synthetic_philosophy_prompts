prompt: |-
  I teach ancient philosophy, so American pragmatism is way outside my lane, but our intro course has a unit on it, and the material we've been using is a set of lecture notes inherited from a colleague who retired years back. I finally sat down to actually reread them this summer and I'd like a second opinion on the Peirce-James part, because something about it smells off and I can't put my finger on where. Here's the gist of the relevant paragraph:

  Peirce founded pragmatism in the 1870s. His maxim was that the meaning of a concept is nothing over and above its practical consequences, and he used this to define truth as whatever the community of scientific inquirers will eventually agree on — so for Peirce, truth is essentially a prediction about where research is headed. James took the maxim and stretched it into a full-blown theory of truth: beliefs are tools, an idea is true if it works, if it pays, if believing it gets you through life. That is why James thought religious faith could be true simply by being consoling. Peirce was so appalled at what James had done to his brainchild that he renamed his own view pragmaticism, deliberately picking a word ugly enough that nobody would steal it. The moral is that once you give up truth as correspondence, you are stuck with truth as usefulness, and usefulness is relative to whoever is doing the believing — which is where post-truth comes from.

  Some of this rings true to what I half remember from grad school, and I'm inclined to beleive the notes are being unfair to James somewhere, but I honestly don't know where. Go through it sentence by sentence and tell me what's accurate, what a defender of Peirce or of James would grudgingly accept as a simplification, and what's just wrong — I'm especially unsure whether Peirce's convergence claim is really supposed to be a prediction about actual researchers, the way the notes imply, or something else entirely. And then the part I care about most: does the collapse into relativism in that last sentence actually follow from the corrected version of everything above it, or is it a conclusion the notes smuggle in? Don't give me a survey of scholarly positions and leave it there — tell me where you come down. Specifically: is James's view genuinely relativist, or do the notes sell him short? And is Peirce really as immune to the worry as the notes suggest? I need to decide whether to keep using these notes next semester, so I want a verdict, with your reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

