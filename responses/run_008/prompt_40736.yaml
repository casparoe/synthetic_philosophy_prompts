      *   *Sentence 3:* "James took the maxim and stretched it into a full-blown theory of truth: beliefs are tools, an idea is true if it works, if it pays, if it believing it gets you through life." (Standard caricature/summary of James's "The Will to Believe" and "Pragmatism" lectures).
