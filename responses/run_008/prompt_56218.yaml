          *   *Arguments for $\delta > 0$:* Probability of extinction/catastrophe (existential risk), opportunity cost of capital (if public funds displace private investment), or "pure impatience" (democratic mandate reflects current voters' preferences).
          *   *Arguments for $\delta = 0$:* Intergenerational neutrality (Sidgwick/Parfit). Treating future citizens as moral equals.
          *   *Verdict:* No *moral* reason for a sovereign state to prefer current citizens over future ones based solely on time. But there are *pragmatic* reasons (catastrophe risk, capital displacement).

      *   **Q3: Same assumptions for near-term vs. long-term?**
          *   *Reasoning:* Standard CBA uses a constant $r$. Long-term ethics suggests declining discount rates (hyperbolic or Weitzman-style).
          *   *Why?* Uncertainty about future $g$ and $\eta$. If $g$ is stochastic, the certainty-equivalent discount rate declines over time.
          *   *Verdict:* No, they shouldn't be the same. A term structure is theoretically superior for long horizons.

