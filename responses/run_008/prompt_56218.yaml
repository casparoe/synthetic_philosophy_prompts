answer: |-
  Your framing is sophisticated and correctly identifies the mechanics of the Ramsey equation ($r = \delta + \eta \cdot g$). You are right to suspect that the public debate often fetishizes the pure rate of time preference ($\delta$) while the heavy lifting in the medium term is done by the elasticity of marginal utility ($\eta$) and the growth rate ($g$).

  However, your claim that $\eta$ is "at least partly empirical" and that disputes over it are "calibration quarrels" is the muddled half. While $\eta$ is constrained by empirical observations of risk aversion, in the context of intergenerational discounting, it functions as a normative parameter governing **intergenerational inequality aversion**. Choosing $\eta$ is not merely calibrating a curve; it is deciding how much weight to give a dollar of consumption for a poor generation versus a rich generation.

  Here is the breakdown of the implications for policy analysis, addressing your specific questions and correcting the empirical/normative distinction.

  ### 1. Does rejecting pure time preference ($\delta=0$) alter conclusions once wealth growth and uncertainty are working?

  **Yes, but primarily in the tail, not the medium term.**

  If you set $\delta = 0$ (the Sidgwickian ethical position), the discount rate $r$ does not necessarily drop to zero. It becomes $\eta \cdot g$. If you assume the future will be significantly wealthier than the present ($g > 0$) and you have a moderate aversion to inequality ($\eta > 0$), you will still discount future benefits heavily.

  *   **The Medium Term (0–100 years):** Here, your suspicion is correct. A model with $\delta = 0.1\%$ and $\eta = 3$ can produce nearly identical policy prescriptions to a model with $\delta = 1.0\%$ and $\eta = 1.5$, provided $g$ is stable. In this horizon, the "rich future" argument (that future people will be too rich to need our sacrifice) does the work, not pure time preference. Disputes here are indeed often about growth forecasts and the curvature of the utility function.
  *   **The Long Tail (100+ years):** This is where $\delta$ becomes the dominant variable. In long-horizon modeling, we cannot assume $g$ remains positive indefinitely. If $g$ approaches zero (due to resource constraints, climate damages, or saturation), the term $\eta \cdot g$ vanishes. The discount rate converges to $\delta$.
      *   If $\delta > 0$, the present value of welfare in year 300 approaches zero exponentially.
      *   If $\delta = 0$, the present value remains significant.
      *   **Implication:** Rejecting pure time preference is the *only* thing that prevents the model from assigning zero value to existential risks or very long-lived assets (like nuclear waste repositories or permanent geoengineering structures) once growth assumptions fade.

  **Correction on $\eta$:** You characterize $\eta$ as partly empirical. In individual finance, risk aversion is empirical. In social policy, $\eta$ represents how much the current generation should sacrifice to improve the welfare of a future generation that is, say, twice as rich. There is no empirical test for this. It is a moral choice about the distribution of welfare across time. Treating it as a calibration parameter masks the ethical judgment being made.

  ### 2. Is there any principled reason a public body, unlike a mortal individual, may discount the distant future at all?

  **No moral reason, but two pragmatic reasons.**

  *   **The Moral Baseline:** A mortal individual discounts the future partly because they might not be there to enjoy it (mortality risk) and because of psychological impatience. A sovereign state, in principle, does not die. The "citizenry" is a continuous chain. Therefore, the Sidgwick/Parfit argument holds: purely temporal position is morally arbitrary. A public body acting as a trustee for the continuum of citizens has no ethical warrant to prefer the welfare of the 2025 citizen over the 2125 citizen solely based on date.
  *   **Pragmatic Exception 1: Existential Risk (Descriptive $\delta$):** A public body may apply a discount rate that *looks* like pure time preference to account for the probability that the policy horizon will be truncated by catastrophe (war, collapse, extinction). This is not a normative preference for the present; it is a descriptive probability that there will be no future to benefit. In modeling, this should ideally be handled as a risk probability in the damage function, not buried in the discount rate, but functionally it acts as a $\delta$.
  *   **Pragmatic Exception 2: Opportunity Cost of Capital:** If public spending displaces private investment, the discount rate must reflect the return on that displaced capital. This is a market constraint, not an ethical preference. However, for long-horizon regulatory analysis (like climate), the relevant comparison is usually public consumption vs. public consumption over time, not public vs. private investment. In that "consumption rate of interest" framework, the opportunity cost argument weakens significantly for the far future.

  **Implication for the Page:** If a government agency adopts $\delta > 0$ for intergenerational projects, it is implicitly asserting either that the state will not exist in the future (pessimism) or that current voters have property rights over resources that future voters do not (ethical partiality). Neither is easily defensible in a formal regulatory impact analysis intended to maximize social welfare.

  ### 3. Should the same assumptions govern analyses whose costs and benefits change sign within decades rather than centuries?

  **No. A constant discount rate is mathematically indefensible for mixed horizons.**

  Standard Cost-Benefit Analysis (CBA) often uses a constant Social Discount Rate (SDR). This is appropriate for short-term regulatory tweaks (e.g., vehicle safety standards) where the horizon is 30 years and uncertainty about $g$ is low.

  For long-horizon analysis (climate, nuclear, infrastructure), a constant rate creates two problems:
  1.  **The Weitzman-Gollier Effect:** If the future growth rate $g$ is uncertain, the certainty-equivalent discount rate declines over time. Even if you are unsure whether $g$ will be 1% or 3%, the lower growth scenarios dominate the valuation in the distant future because they assign higher marginal utility to consumption. This mechanically produces a **Declining Discount Rate (DDR)** term structure without needing to change the ethical parameters.
  2.  **Time Consistency:** A constant high rate renders near-term prevention worthless and far-term adaptation impossible. A DDR allows for high discounting in the short run (reflecting market opportunities and near-term certainty) and low discounting in the long run (reflecting ethical neutrality and growth uncertainty).

  **Implication for the Page:**
  *   **Short-term CBA:** Use a constant rate derived from market returns (descriptive).
  *   **Long-term IAM/Regulatory:** Use a declining term structure. The UK Treasury and the US EPA have moved toward this.
  *   **Why this matters:** If you use a constant 3% rate, a benefit in 200 years is worth nearly zero. If you use a DDR starting at 3% and declining to 1%, that benefit retains significant weight. This changes the "optimal" carbon tax or safety standard by orders of magnitude, not just margins.

  ### Summary of the "Muddled" Claim

  You suggested the philosophical argument ($\delta=0$) has less leverage than assumed because $\eta$ and $g$ do the work.

  *   **Where you are right:** In the first 50–80 years, $\eta \cdot g$ dominates. Disputes about the "optimal" carbon price in 2050 are often disputes about projected GDP growth and inequality aversion, not pure time preference.
  *   **Where you are wrong:** In the tail, $\delta$ is the only parameter that matters. Furthermore, $\eta$ is not a safe harbor for empiricism. High $\eta$ combined with high $g$ is the standard economic argument for *doing less* on climate (because the rich future can handle it). Low $\delta$ forces the model to care about the future even if it is rich, but high $\eta$ says "they will be so rich, a dollar means less to them."
  *   **The Real Leverage:** The philosophical case against pure time preference forced the adoption of **Declining Discount Rates**. That is the concrete mechanistic change. It allows modelers to respect market rates in the short term (satisfying finance ministries) while respecting intergenerational equity in the long term (satisfying ethics).

  **Final Verdict:** The philosophy does not just change the "ethical parameter" $\delta$; it necessitates a change in the *structure* of the discounting function (from constant to declining). If your policy models are still using a single constant discount rate for horizons exceeding 50 years, the philosophical critique has not yet penetrated the modeling practice, regardless of what value is chosen for $\delta$.
