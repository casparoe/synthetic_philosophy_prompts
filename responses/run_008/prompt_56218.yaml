  8.  **Self-Correction during drafting:** I initially thought about emphasizing the Stern Review. But the user knows that. Better to focus on the *mechanism* of why $\eta$ matters. I need to be careful not to say $\eta$ is *only* philosophical. It is constrained by observed risk aversion, but the *social* discount rate choice is normative. I must clarify that distinction. Also, need to explicitly address the "costs and benefits change sign within decades" question (short-term policy).

  9.  **Final Polish:** Ensure the distinction between *descriptive* discounting (market rates) and *prescriptive* discounting (ethical) is clear, as this underpins the public body question.

  *(Self-Correction on the "Empirical" claim regarding $\eta$)*: The user claims $\eta$ is "at least partly empirical." This is true (risk aversion experiments). But in social discounting, it represents *inequality aversion*. We don't observe social inequality aversion in a lab. So while informed by empirics, it's ultimately a normative parameter. I need to push back gently there.

