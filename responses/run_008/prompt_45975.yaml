answer: |-
  # Joint Statement on the Concept of Disease
  **Prepared for the Department Proseminar in Philosophy of Medicine**
  **Authors:** [Faculty Member A, Naturalist] & [Faculty Member B, Normativist]

  ### I. Agreed Claims

  After two years of debate, we endorse the following propositions. These claims represent the intersection of our extensions (what we classify as disease) and our shared assessment of the empirical and historical record, even where our theoretical justifications diverge.

  1.  **On Homosexuality (DSM-II to DSM-III, 1973):** We agree that homosexuality is not a disease. We further agree that the 1973 reclassification did not track a change in the biological or psychological functioning of homosexual individuals, but rather a shift in the medical community's stance toward that functioning.
  2.  **On Bereavement (DSM-5):** We agree that the removal of the bereavement exclusion for Major Depressive Disorder increased the risk of pathologizing normal grief responses. We agree that distinguishing pathological depression from normative grief requires attention to both duration/severity (biological markers) and context (social/normative expectations).
  3.  **On Gaming Disorder (ICD-11):** We agree that the inclusion of "Gaming Disorder" represents a boundary case where the line between high-engagement hobby and pathological compulsion is currently under-determined by biological data alone. We agree that further empirical work is needed to identify specific cognitive or neurological dysfunctions distinct from mere social disapproval of gaming.
  4.  **On Asymptomatic Conditions (e.g., Undetected Atherosclerosis):** We agree that such conditions involve identifiable biological deviations from typical functioning. We disagree on whether the label "disease" applies prior to the onset of symptoms or harm, but we agree that medical intervention is often warranted based on probabilistic risk of future harm.
  5.  **On Sickle-Cell Trait:** We agree that the status of the sickle-cell trait is context-dependent. In malaria-endemic regions, the trait confers a survival advantage; in non-endemic regions, it confers no such advantage and carries risks (e.g., under extreme exertion). We agree that any adequate theory of disease must account for this environmental relativity.
  6.  **On the Goal of Medicine:** We agree that the primary aim of medicine is to prevent, alleviate, or cure conditions that negatively impact human well-being, whether defined as survival/reproduction (Naturalist) or flourishing/autonomy (Normativist).

  ### II. Precise Formulations of Disagreement

  The following table isolates the theoretical divergences. Each formulation is phrased to be acceptable to the proponent of that view, acknowledging the theoretical cost incurred by that position.

  | Domain | Naturalist Position (Boorsean) | Normativist Position (Evaluativist) |
  | :--- | :--- | :--- |
  | **Core Definition** | Disease is a type of internal state that impairs species-typical biological functioning, independent of social value. | Disease is a type of internal state that we have normative reason to avoid or remedy, partly constituted by that judgment. |
  | **Role of Values** | Values determine *which* diseases we treat, but not *what* counts as a disease. | Values are constitutive of the disease concept; without a "bad" judgment, there is no disease, only difference. |
  | **Case: Homosexuality** | **Verdict:** Not a disease.<br>**Reason:** It was never a biological dysfunction.<br>**Cost:** Must explain why it was classified as a disease for decades without admitting the *concept* was normative (explanation: scientific error + social prejudice). | **Verdict:** Not a disease.<br>**Reason:** It is not harmful or undesirable.<br>**Cost:** Must explain why we cannot simply *value* any trait as a disease (explanation: biological constraints limit what can be valued as pathological). |
  | **Case: Asymptomatic Pathology** | **Verdict:** Disease.<br>**Reason:** The biological dysfunction exists regardless of awareness or current harm.<br>**Cost:** Must accept "harmless diseases" exist, which conflicts with ordinary language linking disease to suffering. | **Verdict:** Risk Factor / Pre-Disease.<br>**Reason:** Without symptoms or harm, there is no "bad" state to remedy.<br>**Cost:** Must explain why we treat these conditions medically if they are not yet diseases (explanation: preventive medicine targets risks, not yet diseases). |
  | **Case: Sickle-Cell Trait** | **Verdict:** Contextual Dysfunction.<br>**Reason:** Reference classes must be relativized to environment; function is relative to survival in that environment.<br>**Cost:** Makes the concept of "species-typical" highly unstable and sensitive to geographic boundaries. | **Verdict:** Contextual Value.<br>**Reason:** The trait is only pathological where it is net harmful.<br>**Cost:** Makes disease status contingent on external environmental utility rather than internal biological state. |

  ### III. Cruxes and Recorded Predictions

  We identify three sub-questions (cruxes) where empirical or conceptual resolution would force at least one of us to revise our position. For each, we record a specific prediction regarding a concrete case.

  **Crux 1: The Specification of the Reference Class**
  *Question:* Can "species-typical functioning" be defined without smuggling in evaluative choices about which traits matter?
  *Test Case:* **The "High-Pain Threshold" Mutation.** Imagine a newly discovered genetic variant present in 2% of the population that eliminates the sensation of chronic pain but reduces acute pain sensitivity by 40% (increasing risk of unnoticed injury).
  *   **Naturalist Prediction:** This is a disease (dysfunction of the sensory system relative to the design of the species), regardless of whether the individuals report higher well-being due to lack of suffering.
  *   **Normativist Prediction:** This is not a disease if the net effect on the individual's life plans and well-being is positive; it is an enhancement or neutral variation.

  **Crux 2: The "Harmless Dysfunction" Intuition**
  *Question:* Is biological dysfunction sufficient for disease in the absence of any negative impact on survival, reproduction, or well-being?
  *Test Case:* **The "Silent Enzyme" Defect.** A biochemical pathway operates at 50% efficiency due to a genetic anomaly, but redundant pathways compensate fully. There is zero impact on lifespan, reproduction, or subjective experience, now or in the future.
  *   **Naturalist Prediction:** This is a disease (a "harmless disease"). The biological failure is real even if the system compensates.
  *   **Normativist Prediction:** This is not a disease. Calling it a disease is a category error; it is merely a biological anomaly. "Disease" implies a reason for concern, which is absent here.

  **Crux 3: The Epistemology of Discovery**
  *Question:* Do we *discover* diseases (find them in nature) or *construct* them (decide to label them)?
  *Test Case:* **Future Neuro-Imaging.** Suppose fMRI technology advances to reliably identify a neural pattern correlated with "political radicalism" that reduces social cohesion but increases individual sense of purpose.
  *   **Naturalist Prediction:** Unless this pattern impairs cognitive functioning (memory, reasoning), it cannot be a disease, even if society wishes to remedy it. Biology constrains the label.
  *   **Normativist Prediction:** If society determines this state is harmful to the collective good, it can be classified as a pathology, provided the biological marker is reliable. The value judgment drives the classification.

  ### IV. Diagnosis of Verbal vs. Substantive Dispute

  We acknowledge that a portion of our standoff is verbal. If the Naturalist defines "disease" as *biological dysfunction* and the Normativist defines "disease" as *harmful biological dysfunction*, we may agree on all the specific cases (extensions) while disagreeing on the label (intension).

  However, the dispute is not *merely* verbal. It becomes substantive in the case of **Asymptomatic Conditions** and **Harmless Dysfunctions**. Here, our extensions diverge: the Naturalist prescribes medical surveillance for a condition the Normativist says does not exist. This has real-world consequences for resource allocation, insurance coding, and patient anxiety. Therefore, while we share a vocabulary, we are carving nature at different joints.

  ### V. Conditions for Settlement

  To settle this dispute, we would require the following:

  1.  **For the Naturalist:** A demonstration that "biological function" can be rigorously defined using only evolutionary history and statistics, without referencing "survival" or "reproduction" as *goods*. If "survival" is a value, Naturalism collapses into Normativism.
  2.  **For the Normativist:** A demonstration that normative judgments about health are not constrained by objective biological limits. If we cannot call "inability to fly" a disease regardless of how much we value flying, then biology constrains normativity, suggesting a hybrid view is necessary.
  3.  **Joint Requirement:** A consensus on whether the purpose of the concept "disease" is to *explain* etiology (favoring Naturalism) or to *justify* intervention (favoring Normativism). If we agree the concept serves both, we must adopt a hybrid theory (e.g., "Disease is dysfunction that is typically harmful").

  Deepest crux: Whether biological function can be defined independently of the ends we value.
