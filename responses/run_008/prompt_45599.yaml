answer: |-
  1. Theorists would accept the description of perception as prediction but wince at calling surprise the "enemy," since prediction error is also the necessary driver for learning and model updating. The conclusion that perception is inferential survives, but the implication that the brain seeks to eliminate all surprise does not.

  2. Theorists would reject the identification of the quantities, clarifying that variational free energy is an information-theoretic bound mathematically analogous to, but distinct from, thermodynamic free energy. The conclusion that biology minimizes thermodynamic entropy directly fails, though the claim that systems minimize informational surprise remains central.

  3. Proponents acknowledge this as the valid "dark room problem" objection but reject the characterization of priors as merely stipulated, arguing instead that evolutionary history encodes priors for homeostasis that require active engagement. The conclusion that the theory predicts passive stagnation does not survive if one accepts that survival priors necessitate interaction.

  4. Theorists would wince at the implication that universality precludes explanatory power, arguing that a normative principle can constrain cognitive models even if it also applies to simple self-organizing systems. The conclusion that it tells us nothing specific about cognition survives only if one demands mechanistic detail rather than functional norms.

  5. Working theorists would reject the unfalsifiability charge, distinguishing between the abstract principle and specific computational models which generate testable predictions. Consequently, the conclusion that the framework is universally dismissed by serious scientists does not survive contact with the active research programs utilizing it.
