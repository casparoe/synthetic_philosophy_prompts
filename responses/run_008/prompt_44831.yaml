answer: |-
  The Skokie episode demonstrates that Mill's harm principle is indeterminate without a prior normative commitment to what constitutes a setback to interests, ultimately functioning less as a substantive constraint on state power than as a placeholder for distinguishing between protected liberty and regulable harm based on contested definitions of psychological injury.

  1. **Mapping the Conflict**
  The actor whose liberty is at stake is the National Socialist Party of America (NSPA). The conduct comprises three distinct layers: the physical assembly and march, the display of symbols (specifically the swastika) and distribution of literature, and the publicity generated by the attempt itself. The parties at risk are the residents of Skokie, specifically the subset of Holocaust survivors. The candidate harms are not physical injuries but psychological and dignitary setbacks: severe emotional distress, triggering of trauma responses (flashbacks, anxiety), fear of imminent violence, and the degradation of their civic standing within their own community. The critical distinction lies between the physical presence of the marchers and the symbolic meaning conveyed by their presence, which is the actual source of the alleged injury.

  2. **The Harm Test: Two Accounts**
  (a) Under a **descriptive, counterfactual account**, harm occurs if the event leaves the victims worse off than their baseline condition. The baseline is the status quo ante: a village without a Nazi march. Subjectively, the survivors are worse off during the litigation and threatened march due to distress. However, this account strains because it lacks a normative filter; if any negative psychological state counts as being "worse off," then any unpopular speech could constitute harm, collapsing the liberty principle into a veto for the sensitive. The verdict here is indeterminate: descriptively, distress exists, but the principle cannot distinguish between actionable harm and the ordinary costs of living in a free society without importing normative criteria.
  (b) Under an **interest-based account**, harm is a setback to interests that merit legal protection. The survivors have an interest in psychological security and dignity; the Nazis have an interest in political expression. The verdict depends entirely on the hierarchy of interests. If psychological integrity trumps expressive liberty in this context, harm is established and coercion is licensed. If expressive liberty is paramount, the distress is a non-cognizable cost. This account strains because Mill's principle does not provide the weighing mechanism; it merely states that if harm exists, interference is permissible. Thus, the principle issues no verdict until an external theory of interests resolves the conflict.

  3. **The Publicity Wrinkle**
  The operative causal path reveals that the distress was mediated by knowledge: had the march occurred unobserved, the trauma would not have ensued. This implies the harm is produced by the audience's cognition of the conduct rather than the conduct's physical properties. If the harm is produced by knowledge, the principle theoretically licenses regulating the channel of publicity—the news coverage or the permit process—rather than the march itself, since blocking the information flow prevents the harm more directly. However, this is an abuse of the principle. Regulating the press targets a third party exercising their own liberty to report truth, shifting the burden from the alleged harm-doer to the messenger. Furthermore, it validates a "heckler's veto" logic where the state restricts liberty based on the audience's reaction rather than the actor's conduct. A principled application must locate the harm in the act of expression itself; if the act is harmless without the publicity, the harm principle suggests the act is not the proper target, revealing a structural weakness in applying the principle to symbolic speech where meaning is constitutive of the injury.

  4. **Silence and the Offense Principle**
  The harm principle is silent on distress that falls short of genuine psychological injury, a gap filled by Joel Feinberg's offense principle, which permits restriction to prevent serious offense to sensibilities. In Skokie, the villagers' real work was done by the offense principle: the march was intolerable because it was profoundly offensive and humiliating, not necessarily because it caused clinically definable harm in the strict Millian sense. If we admit the offense principle, the Nazis could arguably be restricted based on the severity and unavoidable nature of the offense to survivors. If we adhere strictly to the harm principle, as the courts did, the distress is categorized as non-actionable offense, and the march must be allowed. The episode shows that the harm principle cannot do the work required by the villagers unless psychological trauma is redefined as harm, effectively smuggling the offense principle into the harm category.

  5. **Meta-Analysis of the Principle**
  This episode reveals that harm is never a purely descriptive notion; the principle's content is fixed entirely by whichever account of harm we feed it. Consequently, the harm principle is not doing independent work in resolving the case; it is structuring the argument by placing the burden of proof on those who would coerce, but it cannot generate the verdict itself. The case is not an anomaly but a confirmation that the principle is a formal constraint rather than a substantive moral algorithm. It confirms that liberty is the default, but it also exposes that the boundary between liberty and harm is drawn by normative judgments about interests and psychological integrity that exist prior to the principle's application. Without those prior judgments, the principle is empty; with them, it is redundant to the underlying theory of interests.
