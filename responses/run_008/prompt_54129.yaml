      *   **Section 5: Resistance & Contribution:** Address prompt point 5. Where does the mapping fail? The emotional weight. The theological dimension (the Library as God/Universe). What Borges adds: The *affect* of ignorance. Formal logic treats ignorance as a null state; Borges treats it as a burden.

  4.  **Refining the Argument (Self-Correction during drafting):**
