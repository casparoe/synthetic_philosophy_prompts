      *   *Idea 6: Resistance (Mortality/Theology).*
          *   *Logic:* Abstract agents.
          *   *Story:* Suicide, despair, hope, death.
          *   *Test:* Does the logic flatten this? Yes, if we treat them as pure information processors.
          *   *Verdict:* Must acknowledge that the "cost" in the story isn't just computational; it's existential.

  3.  **Drafting the Essay - Section by Section:**

      *   **Introduction:** Establish the persona. Define Logical Omniscience (LO). State the thesis: Borges inverts LO, showing that availability $\neq$ accessibility, and that the implicit/explicit distinction is existentially fraught, not just technically convenient.
      *   **Section 1: Implicit vs. Explicit (The Gap):** Address prompt point 1. The Library makes implicit knowledge total. But without an algorithm to extract it, implicit knowledge is useless. Borges critiques the formalist's casual dismissal of the gap.
      *   **Section 2: Institutions as Bounded Strategies:** Address prompt point 2. The Inquisitors/Purifiers. Are they rational? They resemble "pruning" in search trees, but without a truth-test, it's destructive. It highlights the *risk* of bounded rationality without reliable heuristics.
