          *   *Verdict:* These look like *pathological* heuristics born of despair, not optimal bounded rationality. They correspond to "epistemic desperation." This complicates the idea that they are "rational strategies." They are *coping mechanisms*.

      *   *Idea 4: Introspection (Axiom 4 & 5).*
          *   *Logic:* $K\phi \to KK\phi$ (Positive), $\neg K\phi \to K\neg K\phi$ (Negative).
          *   *Story:* Can a librarian know they *don't* know something? No, because the book might be in the next hexagon. Can they know they know? Only if they hold the book and verify it (but can they verify truth?).
