          *   *Refinement:* The "Logical Omniscience" problem usually assumes the agent knows all *truths*. Here, the "knowledge" is available but mixed with noise. This is more like the *problem of verification* or *signal-to-noise ratio* than pure logical closure. However, if we treat the Library as the set of all *deducible consequences* (since any consequence is a string that exists), the search problem becomes the deduction problem.
          *   *Verdict:* Strong pairing, but needs nuance. It's not that they know all truths; it's that all truths are *accessible in principle* but not *accessible in practice*. This maps to Implicit vs. Explicit.

      *   *Idea 2: Implicit vs. Explicit Knowledge.*
