      *   *Idea 5: The Narrator's Conjecture.*
          *   *Logic:* Inductive reasoning, inference to the best explanation.
          *   *Story:* Library is infinite/periodic. Order exists.
          *   *Test:* Is this rational? It's a metaphysical leap based on limited data.
