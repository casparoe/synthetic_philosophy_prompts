  A pop-philosophy book I picked up (I'd rather not name it, its a big glossy one about how ancient ideas solve modern problems) has a chapter on death and it summarizes Epicurus's argument like this, roughly quoted from the page: 'Epicurus argued that death cannot be bad for you. When death has arrived, you no longer exist, and while you exist death has not arrived — so there is never a time at which death is bad for you. Since a harm requires a subject who suffers it, and the dead have no experiences, death is not a harm. Epicurus also observed that the time after your death is a perfect mirror image of the time before your birth, and nobody regrets the eternity they missed before being born, so by symmetry you shouldn't mind the eternity after. Since all good and bad consists in sensations, and death removes all sensation, he concluded that death is actually a positive good for you, a release. Modern philosophers settled the matter with the deprivation account: death is bad for you because it deprives you of the goods of further life, which refuted the Epicureans.'

  I mostly followed the chapter but a few things nagged at me. The "never a time at which it's bad" part sounds right, I've seen the where-death-is-I-am-not line before. But the bit about death being a positive good feels like it clashes with the "death is nothing to us" slogan — can it be both nothing and a release? And the last sentence claims a refutation that solved everything, which seems too tidy given I've heard people still argue about this. I'm inclined to like the book, so tell me straight rather than dunking on it.

  Please structure your answer like this:

  1. "What the author gets right" — short paragraph, the parts a scholar of ancient philosophy would sign off on.
  2. "The errors, one by one" — go through the misrepresentations in the order they appear, and for each say what the view actually holds and how the author got there (conflation, overstatement, etc.).
  3. "The symmetry argument's real status" — a paragraph on whether that mirror-image bit belongs where the author puts it and what work it's supposed to do.
  4. "Is the refutation a refutation" — a paragraph on whether the deprivation account settles anything, or just relocates the dispute.
  5. "Can I trust the rest of the chapter" — two or three sentences, your honest read.

  Rough lengths: a paragraph each, section 2 can be the longest. No citations or reading lists needed, I just want the reasoning.
