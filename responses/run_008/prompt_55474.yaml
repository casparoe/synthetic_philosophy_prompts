answer: |-
  The collision between Jean-Jacques Rousseau's *Letter to d'Alembert* and Lin-Manuel Miranda's *Hamilton* is an encounter between two distinct theories of civic imagination. Rousseau, writing for a small, Calvinist republic, feared that the theatre would act as a solvent on civic virtue, replacing active participation with passive pity and substituting the purchase of a ticket for the practice of duty. *Hamilton*, a hip-hop musical about the American founding, presents itself as a civic ritual for a modern, diverse, liberal democracy. To read *Hamilton* through Rousseau's lens is not merely to judge a musical by eighteenth-century standards, but to test whether the mechanisms of spectatorship have fundamentally changed in the intervening centuries.

  The critique lands with surprising force when considering the economics and the psychology of virtue. Rousseau argued that in a theatre, "we are pleased with virtues we do not practice." *Hamilton* risks confirming this by transforming the founding of the American republic into a consumable aesthetic experience. The ticket prices for the original Broadway run, often reaching into the hundreds or thousands of dollars on the secondary market, create a class barrier that Rousseau would identify as inherently anti-republican. If the "festival" of the nation's origin story is accessible only to the metropolitan elite, it functions less as a unifying civic ritual and more as a marker of status. In this light, the audience member who leaves the Richard Rodgers Theatre feeling a surge of patriotic pride has, in Rousseauian terms, purchased the *appearance* of civic engagement. They have wept for Hamilton's death or cheered for the Cabinet Battles without having to deliberate on a budget, compromise with a neighbor, or serve on a jury. The show aestheticizes political conflict, turning the tedious work of governance into a rhythmic contest with a clear winner. This validates Rousseau's fear that theatre makes politics a matter of taste rather than action.

  Furthermore, Rousseau's specific critique of Molière—that comedy makes virtue look ridiculous and sociability look superior—finds a complex echo in *Hamilton*. While the show ostensibly celebrates virtue, it is deeply ambivalent about "candor." Hamilton's inability to filter his thoughts is portrayed as both his genius and his fatal flaw. Conversely, Aaron Burr's caution ("Talk less. Smile more.") is the survival strategy of the social climber. Rousseau would likely argue that by making Hamilton's recklessness heroic and Burr's prudence villainous, the show encourages a form of individualistic grandstanding over the quiet, unglamorous work of republican maintenance. The audience cheers for the "shot heard round the world," but the republic is built on the compromises that happen in the rooms where no one is rapping.

  However, the Rousseauian critique begins to misfire when we examine the nature of the spectator. Rousseau conceived of the audience as atomized individuals sitting in the dark, emotionally manipulated by a distant stage. *Hamilton* emerged in a media ecosystem where the boundary between spectator and performer is porous. The show's reception has been notably participatory. Audiences do not merely watch; they memorize the libretto, perform the songs in schools, and engage in online discourse that dissects the historical accuracy and political implications of the text. The "Cabinet Battles" are not just watched; they are remixed and used as templates for discussing contemporary policy.

  This suggests that Rousseau's model of passivity is insufficient to describe the *Hamilton* phenomenon. The show invites a form of "remix culture" citizenship. When a high school student performs "My Shot" in a classroom, they are not merely consuming a commodity; they are inhabiting the rhetoric of the founding. This aligns more closely with Rousseau's desire for citizens to be the spectacle to themselves. The Gilder Lehrman Institute's "Hamilton Education Program," which provides tickets and curriculum to low-income students, attempts to dismantle the class barrier Rousseau would condemn. In these contexts, the musical functions less as a distraction from civic life and more as a pedagogical tool that sparks civic interest.

  Yet, a crucial distinction remains. Rousseau's festival was intended to be *local* and *unmediated*—a maypole in the square where the citizens of Geneva look at *themselves*. *Hamilton*, even at its most participatory, remains a licensed product. When a high school stages *Hamilton*, they are performing Miranda's words, not their own. The narrative is fixed. Rousseau wanted the people to generate the meaning of the gathering spontaneously; *Hamilton* asks them to inhabit a pre-written mythology. This is where the critique bites hardest: the "civic claim" of the casting ("America then told by America now") is powerful, but it is a representation of the people, not the people representing themselves. It is a mirror held up to the audience, but it is a mirror manufactured in New York and sold at a premium.

  This tension exposes a phenomenon Rousseau could not have anticipated: the *mediated festival*. The release of the filmed version on Disney+ democratized access, removing the geographic and economic barriers of Broadway. In a sense, this fulfills Rousseau's wish for a wider reach. However, it also privatizes the experience. Watching *Hamilton* alone on a laptop is the antithesis of the public square. It creates a shared cultural reference point, but not a shared physical space. The "mutual self-display" Rousseau envisioned requires physical co-presence—the recognition of one's neighbor in the dance. Streaming creates a collective imagination, but not necessarily a civic body.

  Moreover, *Hamilton* complicates Rousseau's binary between monarchical spectacle and republican simplicity. Rousseau argued theatre suits monarchies because it amuses idle subjects. *Hamilton* contains a direct critique of monarchy in the person of King George III, whose pop-song interludes frame monarchical rule as petty, possessive, and absurd. The show explicitly contrasts George's hereditary claim with the founders' struggle for legitimacy. In this way, the content of the play fights against the form of the theatre. It uses the "monarchical" tool of spectacle to argue for republican agency. However, one could argue that the show inadvertently creates a new kind of monarchy: the cult of the Founding Father. By focusing on "Great Men" (Hamilton, Washington, Jefferson), it risks obscuring the collective action of the citizenry. Rousseau would warn that celebrating heroes is a sign that a republic is already in decline, because true republics rely on laws, not saviors.

  Ultimately, the confrontation between *Hamilton* and the *Letter to d'Alembert* teaches us that the distinction between spectacle and festival is no longer about the presence of a stage, but about the ownership of the narrative. Rousseau feared the theatre because it alienated the citizen from their own moral agency. *Hamilton* resists this by inviting the audience to seize the narrative—to rap the lines, to debate the history, to see themselves in the founders. Yet, it confirms Rousseau's warning by commodifying that invitation. The "festival" is licensed, ticketed, and streamed.

  The show reveals that in a modern mass society, we may not be able to return to the Spartan maypole. We cannot gather in the square to invent a new civic myth from scratch; we are too numerous, too dispersed, and too mediated. Instead, we have *Hamilton*: a spectacle that *asks* to be treated as a festival. It occupies a middle ground that Rousseau did not envision—a space where consumption can be a prelude to participation, but where the risk remains that it will remain merely consumption. The critique lands where the ticket price excludes the citizen; it misfires where the song empowers them. The lesson is that a republican theatre is possible, but only if the audience refuses to remain an audience, and insists on becoming the authors of the next act.
