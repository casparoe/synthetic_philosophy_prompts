      *   **Key Rousseauian Arguments:** Theatre is good for monarchies (keeps subjects idle/amused) but bad for republics (turns active citizens into passive spectators, substitutes appearance of virtue for real virtue, promotes smooth sociability over candor). Preferred alternative: Public festivals where citizens are the spectacle (e.g., maypole in a square).
      *   **Key *Hamilton* Features:** Spectacle about founding a republic, premium tickets, metropolitan audience. *But*: Diverse casting (civic claim), participatory reception (memorization, rapping along), aestheticized conflict (rap battles), mockery of monarchy (King George).
      *   **Specific Questions to Address:**
          *   Where does the critique bite? (Is fandom just consumption?)
