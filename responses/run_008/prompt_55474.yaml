          *   **King George:** The show *does* distinguish between monarchical spectacle (George III as a pop star/broken lover) and republican struggle. It critiques the very idea of hereditary power.
          *   **Pedagogy:** The Gilder Lehrman Institute program brings the show into schools. It's not just idle amusement; it's curriculum.

      *   *New Dynamics (The Digital/Media Age):*
          *   **Recorded Festival:** The Disney+ version turns the "live event" into a mass medium. Is this the ultimate democratization (everyone can see it) or the ultimate alienation (watching alone on a couch)?
