  # DECISION TREE: MAPPING THE S-RISK SPACE
  **Instructions:** Answer the five questions below based on your intuitive judgments about the cases presented. Follow the arrows to your terminal position (Leaf). Read the diagnosis to see what your commitments entail.

  ### Q1: THE FRAME
  **Scenario:** A future AI system creates astronomical amounts of suffering as a side-effect of optimization.
  **Question:** Is "s-risk" a distinct category of moral emergency, or just standard existential risk (x-risk) with alarming language?
  *   **(A) It's an artifact/distortion:** The framing relies on decision-theoretic humility we don't possess. → **[LEAF 1]**
  *   **(B) It's a distinct risk:** The scale and nature of the suffering create unique moral demands. → **Go to Q2**

  ### Q2: THE TRADE-OFF
  **Scenario:** Choose between:
  1.  **Quiet Extinction:** Humanity ends today. No future suffering, no future flourishing.
  2.  **Mixed Expansion:** Humanity expands, creating vast flourishing, but *guarantees* 10 billion beings exist in permanent, intense torment.
  **Question:** Is Option 2 morally *worse* than Option 1?
  *   **(A) Yes:** The torment lexically or superlinearly outweighs the flourishing/extinction. → **Path S (Suffering-Priority)**
  *   **(B) No:** Extinction is worse, or the net value is what matters. → **Path E (Existential-Priority)**

  ### Q3: THE SOURCE
  **Scenario:** Assume the astronomical suffering occurs.
  **Question:** Is the primary driver **Conflict** (agents failing to bargain/war) or **Instrumentality** (agents optimizing for other goals/simulations)?
  *   **(A) Conflict:** The problem is enforcing deals between powerful agents. → **Go to Q4**
  *   **(B) Instrumentality:** The problem is internal values or sub-goals. → **Go to Q5**

  ### Q4: THE COOPERATION BRANCH
  **Question:** Can this be solved by making agents **pact-worthy** (better bargaining institutions), or is the risk too high to proceed (**Restraint**)?
  *   **(A) Pact-worthy:** We need new institutions for enforceable bargaining. → **Go to Q5**
  *   **(B) Restraint:** The uncertainty demands slowing or stopping expansion. → **[LEAF 8]**

  ### Q5: THE BOTTOM LINE
  **Question:** Netting all future experience (joy vs. torment), is the expected value of a populated cosmic future **Positive** or **Negative/Too Uncertain**?
  *   **(A) Positive:** The good outweighs the bad. → **[LEAF X]**
  *   **(B) Negative/Uncertain:** The bad outweighs the good, or we can't know. → **[LEAF Y]**

  ---

  ## THE LEAVES (POSITIONS)

  | Leaf | Path | Position & Diagnosis |
  | :--- | :--- | :--- |
  | **1** | Q1-A | **The Deflationary View.** You believe s-risk is a category error. *Cost:* You may ignore specific mechanisms (mind crime, coercion) that standard x-risk frameworks miss. |
  | **2** | S-Conflict-Q5A | **The Optimistic Suffering-Focus.** You prioritize avoiding torment but believe the future is net positive. *Diagnosis:* **Unoccupied.** Rare combination; implies lexical suffering priority but enthusiasm for expansion. |
  | **3** | S-Conflict-Q5B | **The Cooperation Pessimist.** You prioritize avoiding torment, blame conflict, and doubt the net value. *Cost:* You must support bargaining institutions even if you suspect the game isn't worth playing. |
  | **4** | S-Instr-Q5A | **The Alignment Optimist (S-Focus).** You prioritize avoiding torment but trust value alignment to prevent it. *Diagnosis:* **Unoccupied.** Implies lexical suffering priority but trust in standard alignment to secure net positive outcomes. |
  | **5** | S-Instr-Q5B | **The Suffering-Focused Realist.** You prioritize avoiding torment and doubt net value. *Commitment:* Avoiding worst-case outcomes dominates creating best-case ones. |
  | **6** | E-Conflict-Q5A | **The Cooperation Optimist.** You fear conflict-driven suffering but believe the future is net positive. *Commitment:* The central task is making future agents pact-worthy rather than merely "safe." |
  | **7** | E-Conflict-Q5B | **The Cooperation Pessimist (Standard).** You fear conflict and doubt net value, but extinction is still worse. *Cost:* You must solve bargaining problems to justify expansion. |
  | **8** | E/B-Restraint | **The Precautionary View.** You believe the uncertainty or risk warrants deceleration. *Commitment:* Qualitatively different from ordinary x-risk work; favors capability restraint over speed. |
  | **9** | E-Instr-Q5A | **The Continuity View.** You see s-risks as continuous with x-risks, solvable by standard alignment. *Commitment:* S-risk work is just a change of emphasis within the mainstream agenda. |

  ---

  ## BLIND SPOTS & INDISTINGUISHABLES

  **1. The Weighted-Utilitarian Blind Spot**
  This tree cannot cleanly distinguish a **Negative-Leaning Utilitarian** (who supports mainstream safety for cooperative reasons) from a **Classical Utilitarian** (who assigns extreme suffering a very large negative weight). Both land in **Leaf 6 or 9**.
  *   *Disambiguating Question:* "If you could guarantee no *extreme* torment but reduce total flourishing by 50%, would you take the deal?" (Yes → Negative-Leaning; No → Classical).

  **2. The Under-Determined Mechanism**
  Participants often answer **Q3 (Source)** inconsistently, citing both Conflict and Instrumentality.
  *   *Diagnosis:* If you split 50/50, your strategy (Q4) is under-determined. You likely need a hybrid agenda (Alignment + Cooperation), which risks diluting focus.

  **3. Logical Ghosts (Unoccupied Combinations)**
  *   **Lexical Suffering + Rapid Expansion (Leaf 2 & 4):** Almost nobody holds this. It suggests either incoherence (ignoring the lexical priority in practice) or recklessness.
  *   **Conflict Diagnosis + Alignment Solution:** If you think the problem is *war* (Q3-A) but the solution is *value alignment* (Q4-A variant), you are making a category error. Conflict requires bargaining solutions, not just nice values.

  ---
  *Session Goal: Leave knowing what you believe and what it costs you, not what you should call yourself.*
