answer: |-
  Your hypothesis is correct, and frankly, it is more sophisticated than the position most of your reading group is likely occupying. You have correctly identified that this is a case of **underdetermination of ontology by empirical data**.

  After 300 years, the stalemate persists not because physicists are stubborn, but because the dispute has migrated from physics (predicting pointer readings) to metaphysics (cataloging what exists).

  Here is the diagnosis of the disagreement, an assessment of whether it can be settled, and a recommendation on the future of your reading group.

  ### 1. Diagnosis: What Kind of Disagreement Is This?

  You are dealing with a classic case of **ontological underdetermination**. Both the Substantivalist (spacetime is a thing) and the Relationist (spacetime is bookkeeping) can write down the exact same Einstein Field Equations, solve them for the exact same boundary conditions, and predict the exact same geodesics for test particles.

  The disagreement is not about the *formalism*; it is about the *interpretation of the surplus structure*.

  *   **The Substantivalist** looks at the metric field $g_{\mu\nu}$ on a manifold $M$ and says, "The points of $M$ have identity independent of the fields on them. Spacetime is a substance that can exist without matter (vacuum solutions)."
  *   **The Relationist** looks at the same math and says, "The manifold points are merely indices for the field values. Without the metric field (and ideally matter), there is no 'there' there. The metric is just a codification of possible relations."

  **Why the standard arguments fail to settle it:**

  *   **The Bucket:** Newton thought this proved absolute space. Mach showed you could save relationism by positing inertia arises from interaction with distant masses. GR complicates this: vacuum solutions (like Minkowski or gravitational waves) exist without *any* distant masses. This looks like a win for Substantivalism, **but** the Relationist simply reclassifies the metric field $g_{\mu\nu}$ as a physical field (like the EM field) rather than a container. If the metric is a "thing," the Relationist can treat it as just another body in the relational web.
  *   **The Hole Argument:** This is the strongest weapon in the arsenal. It shows that if you believe manifold points have independent reality (Manifold Substantivalism), GR is indeterministic. You can drag the metric field over the manifold points inside a "hole" without changing boundary conditions, creating distinct physical futures.
      *   *The Substantivalist Counter:* They retreat to **Sophisticated Substantivalism** (or Leibniz Equivalence). They agree that diffeomorphic models represent the same physical reality. This saves determinism but concedes that manifold points have no inherent "this-ness" (haecceity).
      *   *The Relationist Counter:* They claim victory, saying, "See, the points don't exist; only the coincidence of fields matters."
      *   *The Result:* A draw. The Substantivalist accepts that spacetime substance doesn't have haecceity; the Relationist accepts that the metric field is a real physical object. They end up describing the same mathematical structure with different nouns.

  ### 2. Can Anything Settle This?

  **Observation:** **No.**
  Because the two positions are empirically equivalent within the domain of classical GR, no experiment involving clocks, rods, or light rays will distinguish them. They are different maps of the same territory.

  **Formulation:** **Unlikely within Classical GR.**
  The mathematics of GR is flexible enough to accommodate both interpretations. You can formulate GR in a way that highlights background independence (favoring relationism) or in a way that highlights the dynamical nature of the metric (favoring a nuanced substantivalism).

  **Conceptual Distinction:** **Maybe, via Structural Realism.**
  The only philosophical move that genuinely dissolves the tension is **Ontic Structural Realism** (championed by philosophers like James Ladyman and Don Ross). This view argues that asking "what exists" (objects vs. relations) is the wrong question. The only thing that exists is *structure*.
  *   Spacetime is not a container (substance).
  *   Spacetime is not just relations between bodies (classical relationism).
  *   Spacetime is a physical structure instantiated by the metric field.
  This moves the debate from "Things vs. No Things" to "What is the nature of physical structure?" However, this is a philosophical dissolution, not a physical resolution.

  **The Only Hope: Quantum Gravity (QG).**
  This is the only domain where the dispute might become physical again.
  *   If spacetime is **emergent** (e.g., from entanglement in AdS/CFT, or spin networks in Loop Quantum Gravity), then classical spacetime is indeed a "bookkeeping device" for deeper quantum relations. This would be a massive vindication for a modern, quantumized Relationism.
  *   If QG requires a fundamental background (as some perturbative string theory approaches did historically), that leans toward Substantivalism.
  *   However, even in QG, the metaphysical wiggle room remains. You can always argue that the emergent structure is the "real" substance.

  ### 3. Should You Stop the Reading Group?

  **Do not stop the group, but you must change the goal.**

  If the goal is to determine "Who is right, Newton or Leibniz?", you should stop. You will die of old age before that is settled, because it is not a question physics is currently equipped to answer. It is a category error to expect a physical experiment to resolve an ontological preference when the formalism is invariant under that preference.

  **However, keep the group if you pivot the discussion to one of the following:**

  1.  **Interpretive Hygiene:** Use the debate to train physicists to recognize when they are making metaphysical assumptions disguised as physical ones. This is crucial for QG research. When a string theorist talks about "background independence," they are stepping directly into the Newton/Leibniz mud. Understanding the Hole Argument is prerequisite for understanding what "background independence" actually means.
  2.  **The Nature of Fields:** The debate forces you to ask: "What is a field?" Is the electromagnetic field a "thing" or a "relation"? If the metric is a field, why do we treat it differently than the EM field in this debate? This clarifies the ontology of Classical Field Theory.
  3.  **Symmetry and Reality:** The Hole Argument is essentially an argument about gauge symmetry. Discussing it clarifies the relationship between mathematical redundancy (gauge) and physical reality. This is vital for understanding Gauge Theories (Standard Model) and GR.

  ### Summary Advice for Your Next Session

  Go in and propose a moratorium on the question "Does spacetime exist?" Replace it with: **"What ontological commitments are required to make sense of Quantum Gravity?"**

  Tell them:
  > "We are arguing about whether the map is the territory. In classical GR, the map is so good it doesn't matter. But if we want to know how to quantize gravity, we need to know if we are quantizing a container or a set of relations. Let's stop arguing about Newton's Bucket and start arguing about whether spacetime is emergent from entanglement. That is a question where our physics might actually progress."

  If they refuse to pivot and want to keep rehashing the Bucket Argument for the 50th time, then yes, disband the group and go drink beer. You've outgrown the syllabus.
