prompt: |-
  My sister and I have been arguing about this for weeks and I want to put actual numbers on it instead of vibes. She's basically a utilitarian and went vegetarian years ago partly on efficiency grounds — she thinks each person who stops eating meat prevents real suffering, maybe hundreds of animals over a lifetime. I keep pointing out that supermarkets order in bulk, chickens are slaughtered in enormous batches, and my one chicken-wing purchase on Tuesday doesn't flip any switch anywhere: the store's next order looks exactly the same. She counters with expected value — tiny probability of being the straw that breaks some threshold, times a whole batch of animals, still nonzero — and honestly I can't tell if that's a real argument or a rationalization. I've also seen people claim the demand-elasticity stuff washes out to "each individual does prevent some fraction of an animal on average," which feels like it quietly assumes linearity.

  So here's what I want from you: give me your credence that a typical omnivore in a wealthy country going permanently vegetarian directly causes, over the rest of their life, a nontrivial reduction in animal suffering — say, with "nontrivial" meaning at least the equivalent of a few animal lives, however you want to gloss that. But don't just hand me a number. Decompose it. I'd want you to at least take a position on: whether production actually responds to individual consumption discontinuously (thresholds/batch effects), continuously (elasticity), or barely at all; whether the expected-value move over thresholds is legitimate given that the probability of crossing one is basically unknowable; and whether whatever expected harm falls out of the math is still large enough that the inefficacy objection just doesn't get traction even if it succeeds in the exact form I gave it. Feel free to add terms I haven't thought of — e.g. whether "causes" is even the right causal relation here, or offsetting effects like peers' consumption changing.

  Give a rough probability for each sub-question with a sentence or two of justification, then combine them into the final number. Then tell me which term you're least confident in and what kind of evidence would move it most — and be honest about whether my sister and I are probably disagreeing about the math or about the moral part, since I suspect we'd accept each other's premises more readily than we admit. (Also, she reads a lot of philosophy, so if you reference some named argument or paper, keep it to stuff that's genuinely famous and describe the actual idea rather than just name-dropping, because I won't be able to check it.)
