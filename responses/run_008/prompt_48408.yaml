answer: |-
  ### The Scenario: Amnesiac Mary

  Mary, a brilliant neuroscientist raised in a monochromatic environment, is released to view a red tomato, but due to rare, documented hippocampal damage similar to patient Clive Wearing, she suffers severe anterograde amnesia. Upon seeing the tomato, she visibly startles, her pupils dilate, and she verbally exclaims, "So *this* is red!" demonstrating immediate recognition and phenomenal reaction. However, because her brain cannot consolidate short-term experience into long-term storage, two minutes later she asks where she is and what she was doing; she cannot recall the redness, cannot imagine it in its absence, and if shown the tomato again, she reacts as if seeing it for the first time, possessing no durable classificatory tool or memory trace of the prior episode.

  ### The Walkthrough

  **1. The Ability Hypothesis (Lewis/Nemirow)**
  *Verdict: Mary does not learn anything.*
  The Ability Hypothesis reduces "knowing what it is like" to possessing a suite of abilities: primarily the ability to remember, imagine, and recognize the experience. While Amnesiac Mary demonstrates a fleeting capacity to recognize the red *while* looking at it, Lewis explicitly ties knowing what it's like to the *capacity* to bring the experience to mind independently of the stimulus. Because her damage prevents the consolidation required to retain the ability to imagine or remember the redness even moments later, she fails to acquire the stable cognitive capacities that constitute "knowledge" on this view. She had a reaction, not an ability.

  **2. The Phenomenal Concept Strategy (Loar, et al.)**
  *Verdict: Mary does not learn anything (in the relevant sense).*
  The Phenomenal Concept Strategy (PCS) argues Mary acquires a new *phenomenal concept*—a cognitive mechanism that refers to the experience directly. Concepts, functionally speaking, are durable tools integrated into a conceptual network for future reasoning and classification. Since Amnesiac Mary's neural architecture prevents the formation of stable long-term conceptual structures, she fails to acquire the concept itself. Without the concept, there is no new mode of presentation retained, and thus no epistemic progress that survives the moment. The machinery of the concept requires a substrate she lacks.

  **3. The Acquaintance Hypothesis (Conee)**
  *Verdict: Mary learns something.*
  Conee's Acquaintance Hypothesis posits that "knowing what it is like" is a sui generis epistemic relation between the subject and the experience, distinct from propositional knowledge or abilities. This relation is defined by the direct contact *during* the experience, not by its downstream consequences like memory or conceptual utility. Because Mary stood in the direct relation of acquaintance to the redness while she saw it, she achieved knowledge by acquaintance. The subsequent wiping of her memory is a separate failure of retention, not a negation of the epistemic relation that obtained in the moment. She knew it, then forgot it.

  **4. Jackson's Original Intuition (Dualism)**
  *Verdict: Mary learns something.*
  Jackson argues Mary learns a new *fact* about the world (that experiencing red has property R). Facts are objective truths. If Mary grasped the truth of the experience while it occurred, she learned the fact. The fact that she subsequently forgot the fact does not change the historical truth that she came to know it temporarily. For Jackson, the existence of the new fact proves physicalism false, regardless of whether Mary can hold onto that proof for more than two minutes.

  ### The Divergence Analysis

  **The Work-Doing Feature**
  You are correct: the divergence rests entirely on the **retention/consolidation condition**.
  *   **PCS and Ability Hypothesis** treat knowledge as a *state* or *capacity* that must be integrated into the cognitive architecture to count as "possessed." They require persistence.
  *   **Acquaintance and Jackson** treat knowledge as an *event* or *relation* that can be factive even if ephemeral. They require only contact.

  **The Collapse Test**
  If you restore Mary's memory to normal:
  *   **PCS:** She consolidates the phenomenal concept. Verdict shifts to **Yes**.
  *   **Ability:** She retains the ability to imagine/remember. Verdict shifts to **Yes**.
  *   **Acquaintance:** She is acquainted and retains the memory. Verdict remains **Yes**.
  *   **Jackson:** She grasps the fact and remembers it. Verdict remains **Yes**.
  The case collapses back into the standard Mary scenario where all parties agree she "learns" something (disagreeing only on *what* she learns). The amnesia is the only wedge forcing PCS to say "No" while Acquaintance says "Yes."

  **The Counterattack**
  The Acquaintance theorist is the most vulnerable here. A sophisticated defender (perhaps channeling Conee) might argue: *"Acquaintance is a source of knowledge, but knowledge implies a cognitive possession that can inform the subject's perspective. If the experience leaves no trace on the subject's cognitive life, calling it 'knowledge' is a category error. We wouldn't say a camera 'knows' the image it captures and immediately deletes."*
  *   **Does this work?** It risks changing the subject. If Acquaintance is truly *sui generis* and non-propositional, why should it obey the retention rules of propositional knowledge? However, if it doesn't obey them, it becomes hard to distinguish "Acquaintance" from mere "Consciousness." If every conscious moment is "knowledge" even if instantly forgotten, the term "knowledge" loses its normative force. This is the weak point: the Acquaintance theorist must explain why ephemeral contact counts as *epistemic* gain rather than just *phenomenal* occurrence.

  **Where the Reasoning Could Go Wrong**
  1.  **PCS Flexibility:** A PCS defender might argue that a phenomenal concept doesn't need long-term memory, only short-term activation. If they define "concept possession" as "ability to deploy during the episode," PCS shifts to **Yes**, and your divergence vanishes. You need to press that concepts are *classificatory tools*, and a tool you can't use twice isn't a tool.
  2.  **Ability Nuance:** Lewis might argue Mary *did* have the ability to recognize *while* looking. If "ability" is momentary, Ability Hypothesis shifts to **Yes**. You must rely on Lewis's specific emphasis on *remembering* and *imagining* (which require retention) to keep them on the "No" side.
  3.  **Factive Memory:** Epistemologists debate whether "S knew P" is true if S immediately forgets P. If your course adopts a "knowledge requires retention" norm, Acquaintance is dead in the water regardless of the theory.

  **Literature Status**
  This is not a standard named thought experiment (like "Mary the Blind" or "Nagel's Bat"). It is a natural extension of objections regarding **factive memory** and **transient knowledge** applied to the Knowledge Argument. Philosophers like David Chalmers and Keith Frankish have touched on memory limitations in passing, but using anterograde amnesia specifically to wedge the Acquaintance Hypothesis away from the Phenomenal Concept Strategy is a novel pedagogical construction. You aren't reinventing a wheel, but you are building a custom chassis for an existing engine. It's a solid move for testing the metaphysical commitments of each view.
