answer: |-
  Here is the specification list you asked for. These are the necessary conditions any coherent theory of "therapy vs. enhancement" must satisfy to survive the examples you listed. I have flagged the contradictions at the end of the list, because you are right to suspect the math doesn't hold up.

  ### The Requirements for a Principled Line

  **1. The Pathology Independence Requirement**
  *   **The Rule:** The definition of "disease" cannot depend solely on the availability of a treatment or a doctor's signature.
  *   **The Case:** Your brother-in-law's TRT vs. Sprinters. If "therapy" is just "what a doctor prescribes," then sprinters could just find a complicit doctor. The condition (Low T) must exist independently of the prescription.
  *   **The Constraint:** Avoids the circular move of "it's treatment because insurance pays for it."

  **2. The Prevention Paradox Resolution**
  *   **The Rule:** The framework must explain why intervening on a *healthy* system to prevent future failure counts as therapy, not enhancement.
  *   **The Case:** Vaccines and daily aspirin. A vaccine adds an immune capability you didn't have to a system that isn't currently sick. Statins for a 65-year-old often prevent a first event rather than fixing a past one.
  *   **The Constraint:** Must distinguish between "adding capacity" (enhancement) and "securing baseline function against probable decay" (therapy), even when the biological mechanism looks like addition.

  **3. The Statistical Stability Requirement**
  *   **The Rule:** The baseline for "normal function" cannot shift merely because the population average shifts.
  *   **The Case:** Your point about grandparents' height and vitamins. If "normal" is just a statistical average, then as we get taller/healthier, yesterday's enhancement becomes today's baseline, and yesterday's therapy becomes today's enhancement retroactively.
  *   **The Constraint:** Prevents the verdict from flipping based on demographic drift. A treatment for a disease in 1950 must still be a treatment in 2050, even if everyone is healthier.

  **4. The Mechanism Neutrality Requirement**
  *   **The Rule:** If two interventions produce the same physiological state, the distinction cannot rest solely on whether the method is "internal" (chemical) or "external" (environmental).
  *   **The Case:** Altitude tents vs. EPO injections. Both raise red blood cell count. One is sleeping in a tent; the other is a hormone shot.
  *   **The Constraint:** If the line is drawn at "natural method," it fails the Naturalistic Fallacy Guard (see below). If the line is drawn at "physiological outcome," then tents and EPO must be categorized together.

  **5. The Cultural Sovereignty Requirement**
  *   **The Rule:** The framework must account for communities that reject the medical definition of their own condition.
  *   **The Case:** Cochlear implants and the Deaf community. If a group defines their state as a culture rather than a disability, an intervention that "fixes" them biologically might be viewed as an unwanted alteration or enhancement of their identity.
  *   **The Constraint:** Cannot assume "biological standard function" is always the goal of the patient.

  **6. The Contextual Demand Distinction**
  *   **The Rule:** Must distinguish between a body failing to function and a body failing to meet a specific, high-stakes environmental demand.
  *   **The Case:** Beta-blockers for the violinist. Her hands shake due to adrenaline. Biologically, her heart and nerves work fine; socially, the demand of a solo audition exceeds her unmedicated tolerance.
  *   **The Constraint:** Must separate "restoring species-typical function" from "optimizing for a specific job." If the drug makes her function *better* than the average person under stress, is it therapy for her anxiety or enhancement for her performance?

  **7. The Naturalistic Fallacy Guard**
  *   **The Rule:** "Natural" cannot be a proxy for "good" or "baseline," nor can "unnatural" be a proxy for "enhancement."
  *   **The Case:** Menopause and appendicitis. Menopause is perfectly natural; treating it with hormones is "unnatural." Appendicitis is a "natural" biological event; removing the appendix is an "unnatural" intervention.
  *   **The Constraint:** You cannot claim therapy is "restoring nature" while also treating natural aging processes or removing natural organs.

  ***

  ### The Unsatisfiable Subset

  You suspected that the "don't move with the averages" requirement fights with the "normal species functioning" baseline. You are correct. **Requirements 3 (Statistical Stability) and 1 (Pathology Independence) are jointly unsatisfiable if "Pathology" is defined biologically.**

  Here is the conflict: To define "Low T" or "Short Stature" biologically, you usually need a reference range (e.g., below the 5th percentile). But reference ranges *are* statistical averages. If the population gets healthier (Requirement 3 says keep the baseline fixed), the percentile shifts. If you keep the percentile fixed (Requirement 1 says follow the biology), the baseline moves with the population. You cannot have a definition of disease that is both biologically grounded in current humans *and* immune to changes in the current human population.

  Furthermore, **Requirement 4 (Mechanism Neutrality) and Requirement 6 (Contextual Demand) cannot both be fully satisfied.** If you say EPO and altitude tents are the same (Req 4), you must ban tents or allow EPO. If you say beta-blockers are okay for violinists but not shooters (Req 6), you are admitting the *context* defines the therapy, not the physiology. But if context defines therapy, then sprinters using testosterone could argue their "context" (professional sport) demands it just as the violinist's does.

  There is no clean line. There is only a set of competing intuitions that we prioritize differently depending on whether we are paying the bill (insurance), keeping the game fair (sports), or respecting autonomy (patients).

  ***

  ### The Scorecard

  **The Normal-Functioning Account (e.g., Norman Daniels)**
  This view argues therapy protects "fair equality of opportunity" by keeping you within the normal range of species functioning. It handles your mom's statins and the cousin's growth hormone well (one restores opportunity, one chases advantage). However, it collapses on the Statistical Stability Requirement. Because it relies on "species-typical" functioning, if the species gets taller or lives longer, the goalpost moves. It also struggles with the violinist; beta-blockers don't restore typical function, they optimize for a specific niche, which Daniels has to awkwardly classify as non-medical.

  **The Transhumanist Account**
  This view argues the therapy/enhancement distinction is morally irrelevant; the only metric is well-being or capability. This solves the Mechanism Neutrality problem instantly (EPO and tents are both tools) and the Naturalistic Fallacy (menopause treatment is just as valid as any other upgrade). However, it fails the Pathology Independence Requirement completely. It cannot explain why insurance should cover your mom's statins but not your brother-in-law's extra testosterone, since both improve "function." It dissolves the category of "medical necessity," making it useless for policy arguments about coverage.

  **The Biostatistical Account (e.g., Christopher Boorse)**
  This view defines health strictly as statistical normality of part-function. It is rigid on the Naturalistic Fallacy (appendicitis is a failure of function, regardless of "nature"). However, it gets crushed by the Cultural Sovereignty Requirement. To a Boorse-style theorist, the Deaf community is objectively wrong; deafness is a statistical subnormality of the auditory system, so cochlear implants are therapy, full stop. It also fails the Prevention Paradox; a vaccine given to a healthy person looks like an enhancement because it raises function above the statistical norm of the unvaccinated.
