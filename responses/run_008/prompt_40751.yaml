prompt: |-
  I'm an undergraduate currently taking a philosophy of mathematics course in which we've spent several weeks on intuitionism and constructive mathematics. Over that time I've noticed the same thing happening to one classical concept after another, and I'd like to know whether the general phenomenon, as opposed to any particular instance of it, has an established name.

  The pattern runs as follows. Classically, two or more definitions of the same thing can be proven equivalent, so mathematicians use them interchangeably and no harm is done. But the equivalence proof typically leans on excluded middle or something nearby, and once that's off the table the definitions come apart: it's not merely that we can no longer prove them equivalent, it's that in some settings consistent with intuitionistic principles they genuinely pick out different classes of objects, and constructive mathematicians then have to pick one formulation and stay loyal to it, or mint separate vocabulary for the fragments.

  The instances I've collected from the course:

  1. "The set X is not empty" versus "we can exhibit an element of X." The second is what constructive proofs actually need, and I gather there's distinct terminology for it in the constructive literature.
  2. Finiteness. Our lecturer remarked that the classically equivalent ways of defining a finite set come in several distinct constructive strengths, and that people who study this have a whole taxonomy of "finite" notions. He didn't say whether the proliferation itself has a name.
  3. The reals. I'm told that construing a real number as a Cauchy sequence and construing it as a Dedekind cut can come apart in some constructive settings, though we didn't work through the details.

  So what I want named is the general occurrence: one classical concept, placed under a weaker logic, shattering into several inequivalent notions, together with the attendant practice of coining separate words for the pieces. A bare label won't satisfy me; I want the carving around it. Specifically:

  - Is there an established term for this phenomenon in the literature?
  - If not, what are the nearest established concepts, and how does each fall short of what I've described? I know, for instance, that reverse mathematics measures which set-existence axioms are needed to prove various equivalences, but it's conducted in classical logic and seems aimed at axioms rather than at the resulting proliferation of definitions. Is my phenomenon best thought of as a constructive analogue of reverse mathematics, or is that analogy misguided?
  - If there is no established term, please coin one, with a definition precise enough that I could decide, for an arbitrary pair of definitions that come apart constructively, whether their coming apart counts as an instance.

  One boundary case I'm genuinely unsure about, and would like your view on: I've read that in classical set theory without the axiom of choice, "Dedekind finite" and "finite" also fail to be equivalent, so this particular split shows up already in classical logic, just with a different nonconstructive principle removed. Does that suggest the phenomenon shouldn't be characterized as specifically constructivist at all, but rather as arising whenever some nonconstructive principle (excluded middle, choice, or kin) is withheld? Where, in your judgment, do the edges of the phenomenon lie?

  Please respond with a JSON object having exactly the following fields:

  {
    "established_term": <a string naming the established term for the general phenomenon, or null if none exists>,
    "instances": <an array of objects, one for each of my four cases (the three above plus Dedekind finiteness), each with the fields "split" (the two definitions, stated plainly), "classical_status" (how classical logic secures the equivalence, and via which principle), and "constructive_status" (what happens when that principle is withheld)>,
    "nearest_concepts": <an array of objects, each with the fields "concept" (its name) and "how_it_differs" (why it doesn't quite cover what I described)>,
    "proposed_coinage": <null if an established term exists; otherwise an object with the fields "term", "definition", and "boundary_cases" (at least two cases that test the edges of your definition, one clearly inside and one clearly outside)>,
    "edge_verdict": <a short paragraph answering my boundary-case question about choice versus excluded middle and where the phenomenon's edges lie>
  }
