prompt: |-
  I chair a working group at a ~2000-person company that meets monthly to decide whether to keep or kill legacy rules -- internal policies nobody remembers the reason for. Our CEO is a reformer who wants most of them gone, so my group is under constant pressure to rubber-stamp deletions, and I want something that slows us down in a principled way rather than just out of caution. I've been reading about Burkean conservatism and Chesterton's fence, the idea that you shouldn't remove a fence until you know why it was put up, and I'd like you to turn that into a procedure my group can actually run on a rule in a thirty-minute agenda slot: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure outputs keep-for-now, where it outputs repeal, and where it hands off to us because the question is one of values rather than facts. Then run it on two rules: (1) all internal documents have to go through the documentation team before publishing, which everyone hates and which was apparently created after one compliance incedent fifteen years ago; and (2) two signatures required on any purchase over $500, which looks obsolete given our current payment controls. Please be honest about where the procedure misfires -- like when the original reason is simply unknowable, which will happen a lot. Act as a political philosopher with practical experience in institutional governance, think it through carefully, maybe sketch a couple of versions of the procedure before settling on one. At the end, say how confident you are in your claims and single out the point you're least sure of. One formatting request: no headings, bullet points, bold text, or tables -- continuous prose only, like an email to a colleague.
