      *   *Refinement:* Need to distinguish between factual questions (what does this do?) and value questions (is this risk acceptable?). Need a specific output for "we don't know, so we test."
      *   *Finalizing the Procedure:* Let's call it the "Fence Walk." Step 1: Origin (Why built?). Step 2: Function (What does it do now?). Step 3: Cost (What does it cost us?). Step 4: Risk (What happens if gone?). Decision matrix: If Origin + Function understood + Cost > Risk -> Repeal. If Origin unknown + Risk high -> Keep/Pilot. If Value judgment -> Handoff.

