      *   **Burkean Conservatism/Chesterton's Fence:** Don't remove a tradition/institution/rule until you understand why it exists. It implies a presumption in favor of the status quo *until* understanding is achieved, but not a permanent veto. It's about epistemic humility.
      *   **Context:** CEO wants reform (pressure to delete). Group wants principled slowing down (not just obstruction).
