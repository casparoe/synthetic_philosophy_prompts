prompt: |-
  I'm a journalist who covers science and ideas, and I'm at work on a feature about the anti-death movement: longevity researchers and cryonics advocates who treat mortality as a technical problem to be solved. In reporting the piece I keep encountering a curious inversion — people in the movement treat the Epicurean consolation that death is nothing to us, since when we exist it is not yet present and when it is present we no longer exist, as an obstacle to be argued away rather than as a comfort. For a sidebar on the underlying philosophy, I'd like your credence, stated as a number, that being dead — the state itself, not the process of dying — is bad for the person who dies.

  Please decompose the reasoning into the sub-questions that actually drive the answer: whether a state of affairs can be bad for someone who does not exist when it obtains; whether the badness of death is best explained by deprivation, by comparing the actual world with nearby worlds in which the person lives on; whether such comparisons are coherent given that the extra life would benefit a person who, at the time of death, exists only through present, future-directed desires; and whether Lucretius's symmetry argument — that our nonexistence before birth does not disturb us, so our nonexistence after death should not either — is sound or rests on a disanalogy. Assign a rough probability to each, show how they combine into your final figure, and tell me which term you are least confident in and what argument or evidence would most move it.

  Please respond in American English, in a register I can adapt for an educated general readership.
