answer: |-
  ### My verdicts, restated

  Let $L_{sure}$ denote the sure \$1M, and $L_{risk}$ denote the gamble (\$5M, 0.10; \$1M, 0.89; \$0, 0.01). Let $L_{small}$ and $L_{large}$ denote the common-ratio pair (\$1M, 0.11) vs. (\$5M, 0.10). Your choices commit you to the following preference relations:

  1.  **Allais (High Stakes, Probability Frame):** $L_{sure} \succ L_{risk}$ and $L_{large} \succ L_{small}$. This violates the Independence Axiom.
  2.  **Scale Effect:** When payoffs are scaled to \$10/\$50, $L_{risk} \succ L_{sure}$, reversing the first preference while maintaining the second.
  3.  **Framing Instability:** Under a "100 tickets" description $F_{ticket}$, you report $L_{risk} \succ L_{sure}$. Under standard probability description $F_{prob}$, you report $L_{sure} \succ L_{risk}$. You report equal subjective strength for both preferences despite their contradiction.
  4.  **Menu Context:** In choice set $S_1 = \{P, Q\}$, you choose $P$. In set $S_2 = \{P, Q, R_{dom}\}$, where $R_{dom}$ is dominated by $P$, you shift preference toward $Q$. This violates Regularity.

  ### Candidate principles

  1.  **Certainty-Weighted Regret:** The value of an option is its Expected Utility minus a regret penalty. This penalty is activated only when a forgone option yields a certain outcome in a state where the chosen option yields less.
      *   *Motivation:* Explains the High Stakes Allais preference ($L_{sure}$) and the Common Ratio preference ($L_{large}$) by treating the sure thing as a unique reference point.
      *   *Cost:* Cannot explain the Menu verdicts, as no option is certain there, nor does it account for the Framing Instability without adding a salience clause.

  2.  **Salience-Dependent Probability Weighting:** Probabilities are not weighted linearly but according to how outcomes are grouped or described (e.g., tickets vs. aggregates).
      *   *Motivation:* Explains the Framing Instability (tickets make the 1% loss more salient than abstract probability) and potentially the Scale Effect (low stakes reduce salience of loss).
      *   *Cost:* Violates Procedural Invariance; implies there is no "true" preference, only context-dependent reactions, undermining the normative force of your teaching.

  3.  **Local Contrast Valuation:** The value of an option is not intrinsic but derived from its pairwise comparisons within the feasible set.
      *   *Motivation:* Explains the Menu verdicts (attraction effect) by allowing $P$'s value to drop when $R_{dom}$ makes $Q$ look better by comparison.
      *   *Cost:* Requires abandoning state-wise evaluation entirely; makes preferences fundamentally unstable across choice sets, complicating any coherent policy or advice.

  ### Predictions

  Using **Certainty-Weighted Regret** as the best candidate (since it captures your core Allais intuition):

  1.  **Correlated Common Consequence:** If the common consequence (the 0.89 probability) is determined by an independent random device from the risky part, the state-wise comparison breaks down. **Prediction:** The preference for the sure thing weakens significantly; you will behave more like an expected-utility maximizer because the "certain comparison" is no longer state-by-state guaranteed.
