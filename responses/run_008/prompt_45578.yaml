      *   *Better approach:* Recommend listing it *on the condition* that we define "treat diseases" to include "mitigation of high-probability pathophysiological progression." OR, recommend denying the "Disease" label but listing the drug under a "Preventive Intervention" clause if it exists.
      *   *Strict reading:* If the mandate says "treat diseases," and I say "it's not a disease," I must deny.
