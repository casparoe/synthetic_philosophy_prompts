      *   **The Proposed Principle:** "Treatability without Ontology." We can fund treatment for risk reduction without labeling the state a disease. This resolves the precedent conflict (Pre-hypertension was denied *disease* status but often managed; Osteopenia was granted *disease* status perhaps due to fracture risk immediacy). Actually, a better principle is **"Clinical Utility over Ontological Purity."** Or, **"The Principle of Actionable Risk."** Let's go with distinguishing *Disease* (current harm/symptoms) from *Pathophysiological Risk* (future harm potential).
      *   **Recommendation:** List the drug. Indication: "Reduction of progression risk in Impaired Fasting Glucose." Do not label IFG as a "Disease" in the formulary, but as a "Targetable Physiological Risk."

