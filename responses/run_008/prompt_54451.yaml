answer: |-
  This is a classic impasse in the philosophy of biology, one that has occupied some of the sharpest minds in the field since the 1970s (notably Robert Cummins vs. Ruth Millikan and Larry Wright). You and your friend did not fail to find the answer; you encountered a boundary where the concept of "function" fractures under the weight of competing explanatory demands.

  Here is the diagnosis of your stalemate, an assessment of the disagreement's nature, and an evaluation of your midnight insight.

  ### 1. Diagnosis of the Impasse: A Clash of Explanatory Interests

  You are not arguing past each other due to confusion; you are arguing past each other because you are asking different questions of the same word.

  *   **Your Friend (Etiological/Selected-Effect):** Is asking an **evolutionary-historical question**: *"Why is this trait here rather than not?"* On this view, function is a historical kind. A heart is a heart because of its ancestry. This view prioritizes **normativity**. It needs to distinguish between what a trait *does* and what it *ought to do* to make sense of malfunction (disease) and natural selection.
  *   **You (Causal-Role):** Are asking a **mechanistic-physiological question**: *"How does this system work right now?"* On this view, function is a systemic role. A heart is a pump because of its current contribution to circulation. This view prioritizes **explanatory utility** in the lab or clinic. It needs to make sense of novel traits, lab organisms, and immediate causal contributions.

  **The Impasse:** The etiological account cannot handle novel traits (no history), and the causal-role account cannot handle malfunction (if the function is what it *does*, a broken heart that doesn't pump has no function, so it isn't "broken," it just *is*). You are both correct about the failures of the *other* theory because you are both correct about what *your* theory is designed to explain.

  ### 2. Is the Disagreement Substantive, Verbal, or Programmatic?

  It is **programmatic**, which is deeper than verbal but less binary than substantive.

  *   **Not Merely Verbal:** If it were just verbal, you could stipulate definitions and move on. But you can't, because "function" carries theoretical weight. If your friend defines disease as "selected-effect dysfunction," and you define it as "causal-role failure," you will diagnose patients differently. The stakes are real.
  *   **Not Purely Substantive:** It is not that one theory corresponds to reality and the other to falsehood. Both track real features of the world (ancestry vs. current causal contribution).
  *   **Programmatic:** You are advocating for different research programs. Your friend's program seeks to naturalize teleology (making "purpose" safe for Darwinism). Your program seeks to naturalize physiology (making "function" safe for mechanistic explanation).

  The disagreement persists because biologists *use* the word in both ways depending on context. An evolutionary biologist asks the SE question; a physiologist asks the CR question. When they talk to each other, they often slip between these programs without noticing, which is exactly what happened in your argument.

  ### 3. Empirical, Normative, or Intuitive?

  The core friction is **Normative**, masked as Empirical.

  *   **The Empirical Mask:** You argued about cases (feathers, cancer, malformed hearts). You treated these as empirical tests. But the data doesn't decide the theory. The data (e.g., "feathers were co-opted") is agreed upon; the disagreement is about which fact *constitutes* the function.
  *   **The Normative Core:** Your friend insists on the Etiological view because they want to preserve the **normative force** of function. They want to say the malformed heart is *failing*, not just different. Only history provides an "ought" (it was selected to pump) against which to measure the "is" (it is not pumping).
  *   **The Intuitive Clash:** You rely on the intuition of **scientific practice**. Biologists assign functions to lab mice strains that have no selection history. If the theory says "no function," the theory contradicts practice. Your friend relies on the intuition of **teleological realism**. If a trait doesn't have a history of selection, calling its effects "functions" feels like a metaphor, not a fact.

  Neither side can win on empirical grounds because the dispute is about which *intuition* (normativity vs. utility) gets to define the concept.

  ### 4. What Would Count as Progress?

  Progress is not possible if the goal is a **Monistic Theory** (one true definition of function). If you insist there is only *one* concept of function, you are in a zero-sum game.

  Progress *is* possible if you shift to **Conceptual Pluralism**. Here is what that looks like concretely:

  *   **A Distinction:** Distinguish between **Function of a Trait Type** (Etiological) and **Function of a Trait Token** (Causal-Role).
      *   *Type:* "The function of the heart (in general) is to pump." (True by selection history).
      *   *Token:* "The function of *this* heart (in this body) is to make noise." (True by causal contribution, even if pathological).
  *   **A Class of Cases:** Acknowledge that **Exaptations** are the boundary zone where the concepts diverge.
      *   *SE:* Feathers' function is thermoregulation (original selection).
      *   *CR:* Feathers' function is flight (current contribution).
      *   *Progress:* Admitting that "function" is ambiguous here is better than forcing one answer. We can say, "Evolutionarily, they are for heat; Mechanistically, they are for lift."
  *   **A Formal Result:** The most promising recent work (e.g., by Justin Garson or Peter Godfrey-Smith) suggests a **Generalized Selected-Effect Theory**. This attempts to broaden "selection" to include within-organism selection (e.g., immune system, neural learning). This might bridge the gap for cancer (cancer cells are selected *within* the body, so they have a "function" relative to the tumor, but are dysfunctional relative to the organism).

  ### 5. Assessment of Your Suspicion

  You asked: *Is my suspicion, that the two accounts are tools for different jobs rather than rivals, a genuine resolution or just a polite way of declaring a draw?*

  **It is a genuine resolution.** In philosophy of science, this position is known as **Function Pluralism**. It is not a polite draw; it is the consensus view among many contemporary philosophers of biology.

  Here is why it is a resolution rather than a surrender:
  1.  **It dissolves the contradiction:** A contradiction only exists if $A$ and $not-A$ are asserted about the same thing in the same sense. If "function" is polysemous (like "bank" meaning river edge vs. financial institution), then saying "The heart has a function" (SE) and "The heart has no function" (CR, if broken) are not contradictory; they are claims about different relationships.
  2.  **It saves the phenomena:** It allows you to keep your physiological cases (novel traits, lab organisms) without forcing your friend to abandon their normative cases (disease, malfunction).
  3.  **It clarifies the Disease Debate:** You noted the stake regarding disease. If function is plural, **dysfunction is plural**.
      *   *Evolutionary Dysfunction:* The trait is not doing what it was selected for (SE). This is useful for defining "natural" disease.
      *   *Systemic Dysfunction:* The trait is disrupting the system's capacity (CR). This is useful for clinical intervention.
      *   *Resolution:* A cancer cell has a causal-role function (growing) but is an etiological dysfunction (selected against at the organism level). Both statements are true.

  ### 6. Why No Progress Should Be Expected (The Caveat)

  Progress will halt only if either of you insists on **Conceptual Imperialism**—the idea that one definition must rule all contexts.
  *   If your friend insists that physiology is "metaphorical" without history, they ignore how biologists actually work.
  *   If you insist that history is "unknowable" and therefore irrelevant, you lose the ability to distinguish a designed pump from a random splash that happens to move water.

  **The Verdict:**
  Your midnight insight was correct. You were arguing about **legitimation** (your friend) vs. **application** (you). The etiological account legitimates the *language* of purpose in a Darwinian world. The causal-role account operationalizes the *language* of purpose in a mechanistic world.

  **Recommendation for Peace:**
  Propose a truce based on **Contextualism**.
  *   When discussing **Evolution, Malfunction, or Disease**: The Etiological view wins. (The heart *should* pump).
  *   When discussing **Physiology, Engineering, or Novel Traits**: The Causal-Role view wins. (This pump *moves* fluid).

  This is not a draw. It is an upgrade to a more sophisticated operating system for biological concepts. You can tell your friend: "You are right that function requires history to be normative. I am right that function requires causality to be explanatory. We are both right, provided we stop trying to use one tool for the other's job."
