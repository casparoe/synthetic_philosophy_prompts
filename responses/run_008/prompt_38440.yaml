answer: |-
  Dear friend, it is a pleasure to engage with a reader who has spotted the silent engine room of democratic theory, for you are quite right that we spend centuries polishing the voting machine while ignoring who is allowed to touch the buttons, and since you asked for a diagnostic tool rather than a lecture, I have constructed a series of concrete scenarios to help you locate your own intuitions within the logical space of the boundary problem. Consider first a factory whose smoke drifts across a border and ask yourself whether the downwind foreigners should get a vote because their health is impacted, no vote because they are not citizens, or a vote only if their government negotiates a treaty. Imagine next a national central bank raising interest rates and decide whether everyone with a mortgage globally should have input, only those within the legal jurisdiction should have input, or only those who own stock in the bank should have input. Think about a fifteen-year-old citizen bound by curfew laws and determine whether they should vote now because they are coerced, wait until eighteen because they lack capacity, or never vote because children are property of the state. Reflect on a permanent resident of three decades who pays taxes but never naturalized and choose whether they should vote in national elections because they live under the laws, not vote because they lack formal citizenship, or vote only in local elections because their stake is limited. Picture a tourist present during an election who is subject to local laws while staying and ask whether they should cast a ballot because they are temporarily subject to coercion, not cast a ballot because they lack a long-term stake, or cast a ballot only if they own property there. Contemplate a climate policy that will alter the world in fifty years and decide whether we should create proxy votes for the unborn, ignore them because they cannot participate reciprocally, or treat current voters as trustees for the future. Recall the historical case of colonial subjects governed by a distant parliament and judge whether they deserved representation in that parliament, independence to form their own demos, or protection without participation because they were not ready for self-rule. Envision a law regulating livestock welfare and consider whether the animals should have counted interests represented by guardians, no counted interests because they cannot reason, or no counted interests because they are property. Imagine a prisoner serving a life sentence who is fully subject to prison regulations and ask whether they should vote because they are coerced, not vote because they forfeited rights, or vote only on issues affecting prison conditions. Think about a region wanting to secede and determine whether everyone in the region votes, everyone in the whole country votes, or only those who own land in the region vote. Consider a digital nomad who pays income taxes but never physically resides in the country and decide whether they should vote because they contribute revenue, not vote because they lack physical presence, or vote only if they renew a residency permit annually. Finally, imagine an emergency where executives suspend elections and ask whether the people should decide when the emergency ends, the executives should decide based on expert advice, or a neutral court should decide based on constitutional rules.

  To find your position, tally which option you selected most frequently across these twelve scenarios, keeping in mind that choosing the first option in most cases aligns you with the all-affected principle, which holds that anyone impacted by a decision deserves a say, while choosing the second option in most cases aligns you with the all-subjected principle, which holds that anyone coerced by the law deserves a say. If you predominantly chose options based on legal status, citizenship, or capacity for reciprocity, you hold a stakeholder or membership view, which ties the demos to formal belonging or functional competence, whereas if you believed the group itself should decide the answers to these questions regardless of external principles, you hold the self-constitution view. You should note that this quiz cannot pull apart the all-subjected view and the stakeholder view in cases where legal residents are also subject to coercion, so if your answers were mixed between those two rationales, you may simply be holding a hybrid position that is common but theoretically unstable. There is a logical space where one might argue that only those who can causally influence the outcome should vote, but nobody occupies this view because it is largely incoherent, as it would disenfranchise the powerless exactly when they need protection, and you should also note that combining the all-affected principle with rights for future generations is attractive but often unexplored because it requires institutional mechanisms we do not yet possess.

  I believe the all-subjected principle survives the scenarios best because it aligns political authority with the coercive power that requires justification while avoiding the infinite regress of the all-affected view. While it struggles with defining coercion, it avoids the arbitrariness of legal citizenship and provides a clear normative link between obedience and consent.
