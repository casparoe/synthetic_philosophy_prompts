prompt: |-
  my department's phil of science reading group has been doing laws of nature for two semesters and i've hit a wall of frustration. we'll do the humean side one week (best-system analysis, laws are just the theorems of whatever system best balances simplicity and strength over the total distribution of local facts about what happens where) and the anti-humean side the next (laws govern, there are real necessitation relations or powers in nature, the universe isn't just a pile of events that happens to be regular). and every time the discussion ends in the exact same place: someone says the best-system view makes the laws depend on us somehow, on what counts as simple, and the humean in the room says no no, simplicity is out there in the patterns, and then someone else says even granting that, a global pattern can't explain the individual events that make it up, that's circular, and the humean says explanation by unification is legitimate, and then we run out of time. next month, same thing, different person.

  it's not that anyone is being obtuse, these are smart people. so i've started wondering whether this is a debate that could even in principle be won, or whether it's some kind of pseudo-disagreement. my working hypothesis, and i want you to actually evaluate this rather than be nice about it, is that the two sides are answering different questions under one name: the humean is answering a metaphysical question (what does the world at the fundamental level have to contain, given the facts?) and the anti-humean is answering something more like an epistemological or explanatory question (what does it take to explain why things happen rather than other things?), and each side's core argument only lands because it's covertly about the other side's question. the circularity complaint, for example, only bites if you think explanation has to run from something that's not identical with what's explained, and that seems like a standard of explanation rather than a fact about the world. but the anti-humean governing intuition also seems like it's just a picture we've been raised on since we learned about gravity pulling on things, not a datum.

  so what i want is a real diagnosis. is it verbal, is it two different questions, is it bedrock intuitions neither side can argue for without begging, or is it a genuine substantive dispute that just happens to be very hard? and here's the part i care about most: tell me what would count as progress given your diagnosis. a finished physics with a final fundamental equation? the interventionist/lawless picture of causation people like woodward push? some clever thought experiment? or is the honest answer that this one just doesn't terminate, and the reading group should pick a different topic for next year?

  please flag how confident you are in each major claim you make, and point out the single step in your diagnosis you'd least want to bet on. if you think my two-questions hypothesis is wrong, say so plainly and tell me what you'd replace it with.
