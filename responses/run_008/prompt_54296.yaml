  8.  *(Final check against constraints)*: Ordered menu? Yes. Distinct precise theses? Yes. Truth status? Yes. Explain/Excuse/Justify? Yes. Support colleague's goal? Yes. Proves too much? Yes. Jefferson vs. Columbus? Yes.

