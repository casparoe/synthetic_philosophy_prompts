  3.  **Evaluate Each Thesis (Drafting the Content):**

      *   *T1 (Descriptive):* "Most people believed X."
          *   Truth: Often substantive, sometimes false (depends on the issue).
          *   Function: Explains, doesn't excuse.
          *   Deflection: Weak. Popularity doesn't make it right.
          *   Overextension: If most people were wrong then, most could be wrong now.

      *   *T2 (Causal):* "He was determined to believe X."
          *   Truth: False (too strong). Humans have agency.
          *   Function: Explains/Excuses (mitigates responsibility).
          *   Deflection: Moderate. If he couldn't help it, why punish the memory?
          *   Overextension: Removes all moral agency from history.

      *   *T3 (Epistemic):* "He lacked access to counter-arguments."
