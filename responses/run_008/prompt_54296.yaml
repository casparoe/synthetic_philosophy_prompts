          *   Function: Excuses (ignorance).
          *   Deflection: Strong *if* true. But false for slaveholders.
          *   Overextension: Undermined by contemporaneous dissent.

      *   *T4 (Semantic/Relativist):* "Morality is relative to era."
          *   Truth: False (moral realism) or Trivially True (definitions change).
          *   Function: Justifies (it wasn't wrong *then*).
