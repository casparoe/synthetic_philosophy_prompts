  2.  **Deconstruct the Phrase ("Man of His Time"):**
      *   *Thesis 1: Descriptive/Sociological.* Everyone did it. It was the norm.
      *   *Thesis 2: Causal/Deterministic.* He couldn't help it. Socialization determines morality.
      *   *Thesis 3: Epistemic.* He didn't know better. Information wasn't available.
      *   *Thesis 4: Semantic/Conceptual Relativism.* Morality is time-bound. "Wrong" didn't mean the same thing then.
      *   *Thesis 5: Standing/Jurisdiction.* We don't have the right to judge the past.
