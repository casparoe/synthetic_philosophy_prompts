answer: |-
  Your intuition aligns with a classic philosophical position, but experts consider it insufficient because reliability adds no extra value once a belief is already true. Plato actually anticipated your weather app analogy in the *Meno*, arguing that true beliefs are like untethered statues that run away, while knowledge is tethered and stable. However, contemporary epistemology challenges this with the "swamping problem," which notes that if you already possess a true belief, the reliability of its source provides no additional value, just as a good cup of coffee isn't improved by knowing the machine that made it is reliable. Consequently, the debate persists not because the reliability argument is practically wrong about future accuracy, but because it fails to explain why knowledge feels more valuable than lucky true belief in the present moment. This distinction keeps the problem alive, as philosophers seek an account of value that isn't merely instrumental.
