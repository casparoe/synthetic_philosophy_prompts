      *   *Check:* Ensure the C6/C8 conflict is highlighted as a logical contradiction regarding "remainder."
      *   *Check:* The C3/C4 tension is often cited in literature. I need to be careful not to dismiss it as "just hard." It's a tension in the *principle* of voluntariness. But compared to C6/C8, it's less fatal.
      *   *Check:* C7/C8. If castaways promise, and I break it, who do I wrong impersonally? C8 says "everyone who depends on the institution." If no institution, no one depends. So C8 is false for castaways. But C8 implies it's a feature of *promising* (generically). So C7+C8 implies a contradiction in the castaway case.

      *   *Decision:* The C6/C8 contradiction is the most "logical" (A vs Not-A). The C2/C5 is the most "theoretical" (Mechanism vs Phenomenon). I will rank C6/C8 as most severe because it's a direct negation of terms.

