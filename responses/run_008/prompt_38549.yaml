  6.  **Ranking Severity:**
      1.  **Waiver vs. Impersonal Wrong (C6 vs C8):** Logical contradiction. "No remainder" vs "Wrong to everyone."
      2.  **Authority vs. Death (C2 vs C5):** Metaphysical/Mechanism failure. Authority cannot exist without a holder, yet obligation persists.
      3.  **Castaways vs. Institution (C7 vs C8):** Contextual contradiction.
