prompt: |-
  For an upcoming departmental workshop I've been asked to circulate a short statement of my considered view on why promises bind, so that my colleagues can then attack it. Before I send it, I want an audit of whether the package I've arrived at is internally tenable. Here is the position as I actually hold it, in the form of eight commitments:

  1. Promissory obligation is directed: when I break a promise, the primary wrong I commit is a wrong to you, the promisee — not a wrong that merely happens to bear on you.
  2. What I do in promising is hand you a measure of authority over whether I perform. You, and only you, thereby acquire the standing both to demand performance and to release me from it. This transfer of authority, and not the expectations my promise predictably raises, is what generates the obligation.
  3. Promises exacted by coercion do not bind at all: a promise made at gunpoint creates no obligation whatsoever.
  4. Promises made against a background of structural injustice do bind, at least defeasibly — an undocumented worker's promise to show up for a shift, made to an employer who exploits her precarity, still generates a genuine obligation, weakened though it may be.
  5. A promise to a dying friend to tend her grave continues to bind after her death, and not merely weakly: it binds just as firmly as it did while she lived, for as long as she would have had a claim on me.
  6. Waiver is decisive and total: if the promisee explicitly releases me, the obligation is extinguished, full stop, with no remainder.
  7. Promising does not presuppose any pre-existing social practice: two castaways stranded together on an island, with no shared conventions and no society behind them, could nonetheless make genuine promises to one another.
  8. Breaching a promise also involves an impersonal wrong — a small wrong done to everyone who depends on the institution of promising — and this is part of what makes breach wrong, not a mere side effect.

  I'd like you to go through this set and tell me whether it hangs together. Specifically:

  - Identify which pairs or larger subsets of these commitments are in genuine tension, and which only appear to be. For the apparent ones, say exactly what distinction dissolves the tension. For the genuine ones, explain what each commitment's own motivation requires such that honoring one undercuts another — I don't want a list of possible complaints, I want the real conflicts.
  - Rank the genuine tensions by severity rather than presenting them as equally serious, and for each, say what the least costly repair would be: which commitment to give up or weaken, how much of the rest of the set that revision disturbs, and whether the resulting position would still be one a reasonable person could hold rather than a patchwork of ad hoc exceptions.
  - Conclude by telling me which single revision would clean up the most overall, and be honest if you think the right answer is that no one-line diagnosis captures where the pressure is greatest.

  A few constraints on what I'm after. Don't give me a tour of the general theories of promising — I know the taxonomy, and I'm not asking you to sort my commitments into pre-labeled boxes. Judge the package on its own terms, and pay particular attention to the combinations, not the items in isolation. If you conclude that some of my tension is merely verbal — that two of these commitments use a word like "obligation" or "bind" in different senses and so only seem to collide — say so explicitly and defend that verdict, because I will suspect special pleading otherwise. Finally, don't soften the verdict: if the set is untenable, I would rather learn it now than at the workshop.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's philosophical position on promissory obligation:

  1.  **Analyze the Request:**
      *   **Task:** Audit a set of eight philosophical commitments regarding why promises bind for internal tenability (consistency/coherence).
      *   **Input:** Eight specific claims (1-8).
      *   **Output Requirements:**
          *   Identify genuine tensions vs. apparent tensions (explain distinctions).
          *   Rank genuine tensions by severity.
          *   Propose least costly repairs for genuine tensions (which commitment to weaken/give up, impact on the rest, reasonableness of result).
          *   Conclude with the single best revision or admit if no one-line diagnosis works.
      *   **Constraints:** No general theory taxonomy (don't just label it "Scanlonian" or "Convention-based"). Judge on its own terms. Focus on combinations. Be explicit about verbal disputes vs. real conflicts. Do not soften the verdict (be critical).

  2.  **Analyze the Eight Commitments:**
      *   *C1 (Directedness):* Wrong is *to* the promisee (bipolar normativity).
      *   *C2 (Authority Transfer):* Promising = transferring authority to demand/release. Source of obligation is the transfer, not expectations. (Sounds like a Will Theory/Choice Theory variant).
      *   *C3 (Coercion):* Coerced promises = no obligation.
      *   *C4 (Structural Injustice):* Unjust background promises *do* bind (defeasibly). (Contrast with C3).
      *   *C5 (Post-Mortem):* Promises to the dead bind firmly. (Challenge for C1/C2/C6).
      *   *C6 (Waiver):* Promisee release = total extinction of obligation. (Strong Will Theory).
      *   *C7 (No Practice):* Promising doesn't need social convention. (Anti-Humean/Anti-Conventionalist).
      *   *C8 (Impersonal Wrong):* Breach also wrongs the institution/everyone. (Adds a utilitarian/social layer to the deontological/bipolar core).

  3.  **Initial Scan for Tensions:**

      *   *C2 (Authority) vs. C5 (Dead Promisees):* If the obligation comes from the promisee's *authority* to demand/release (C2), and waiver is decisive (C6), what happens when the promisee dies? Authority usually terminates at death. C5 says it binds *just as firmly*. How can a dead person hold authority?
      *   *C2 (Authority) vs. C8 (Impersonal Wrong):* C2 says the *transfer of authority* generates the obligation. C8 says breach wrongs *everyone* dependent on the institution. If the obligation is generated by the specific interpersonal transfer, where does the impersonal duty come from? Is it a separate obligation? If so, does C6 (Waiver) extinguish *that* part too? C6 says "no remainder." C8 says there's a wrong to everyone.
      *   *C3 (Coercion) vs. C4 (Injustice):* Why does a gun (C3) void the promise, but structural exploitation (C4) does not? Both constrain the will. If C2 is about "handing authority," does coercion prevent the transfer of authority? If so, why doesn't structural injustice prevent it too? This looks like a line-drawing problem that might be a genuine tension in principle.
      *   *C1 (Directed) vs. C8 (Impersonal):* C1 says the *primary* wrong is to the promisee. C8 says the impersonal wrong is *part of what makes breach wrong*. This seems manageable (primary vs. partial), but needs checking against C6.
      *   *C6 (Waiver) vs. C8 (Impersonal):* If I wrong "everyone who depends on the institution" (C8), how can the promisee's waiver (C6) extinguish the obligation "full stop, with no remainder"? If there's a duty to the institution/public, the promisee shouldn't be able to waive *that* part unilaterally.

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension A: The Dead Hand Problem (C2 + C5 + C6).**
          *   C2: Obligation source = Promisee's authority (demand/release).
          *   C5: Obligation survives death firmly.
          *   C6: Promisee can release me (implies they must exist to exercise authority).
          *   *Conflict:* If the obligation is constituted by the promisee's *current* authority to control my will (C2), death removes the authority holder. C5 insists the bond remains. To hold C2 and C5, you have to say authority survives death or the obligation morphs into something else. But C2 says the *transfer* is what generates it. If the recipient of the authority ceases to exist, the authority relation seems to collapse.
          *   *Severity:* High. It strikes at the metaphysical mechanism of C2.

      *   **Tension B: The Waiver Paradox (C2 + C6 + C8).**
          *   C2/C6: Promisee controls the norm. Waiver kills it totally.
          *   C8: Breach wrongs the institution/everyone.
          *   *Conflict:* If breach wrongs "everyone" (C8), there is a duty owed to the public/institution. If C6 says waiver leaves "no remainder," it implies the promisee can waive the duty to the public too. But why does *your* release absolve me of my debt to *society*?
          *   *Severity:* High. It contradicts the "no remainder" claim in C6 given the existence of the duty in C8.

      *   **Tension C: The Coercion/Injustice Line (C3 + C4 + C2).**
          *   C2: Obligation comes from voluntary transfer of authority.
          *   C3: Coercion voids transfer (involuntary).
          *   C4: Structural injustice does *not* void transfer (voluntary enough).
          *   *Conflict:* This is the classic "voluntariness" boundary. Is it a genuine tension or just a hard case? If C2 relies on the *will*, significant pressure on the will should void it. C3 says gunpoint voids it. C4 says exploitation doesn't. The tension is explaining *why* the will is free in C4 but not C3 without abandoning the strict voluntarism of C2.
          *   *Severity:* Medium. It's a standard philosophical boundary dispute, but potentially unstable if the definition of "authority transfer" isn't robust.

      *   **Tension D: Convention vs. No Convention (C7 + C8).**
          *   C7: No pre-existing practice needed (Castaways).
          *   C8: Wrong done to those depending on the *institution* of promising.
          *   *Conflict:* If castaways have no society/practice (C7), what "institution" are they wronging in C8? C8 implies an institution exists to be wronged. C7 says you can promise without one.
