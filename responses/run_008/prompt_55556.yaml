answer: |-
  This is a heavy lift for a Tuesday afternoon, but you're right: the philosophy isn't just academic here, it's the scaffolding that keeps the committee from collapsing under the weight of the decisions. You need a tool that works at 4pm on a Friday, not a seminar paper.

  Below is the **CEC Rapid Triage Protocol**. It is designed to be run in 20–30 minutes. It borrows from W.D. Ross (prima facie duties), Kant ("ought implies can"), and Bernard Williams (moral remainder), but it strips out the metaphysics.

  At the end, I have run the two cases, flagged the unpalatable truths, and listed the ways your committee will try to break this tool.

  ---

  # The CEC Rapid Triage Protocol (20-30 Minutes)

  **Goal:** Categorise the referral as **Type A (Apparent Dilemma)** or **Type B (Genuine Dilemma/Tragic Choice)**.
  **Type A:** Solvable. One option is ethically superior, or a third path exists. The "conflict" is due to confusion, pressure, or lack of resources.
  **Type B:** Unsolvable. Every option violates a significant moral commitment. The goal shifts from "finding the right answer" to "managing the moral residue."

  ### Step 1: The "Law and Policy" Gate (5 Minutes)
  *Check: Is this actually an ethical problem, or a compliance one?*
  *   **Action:** Scan for existing Trust policy, NHS England guidance, or clear legal statutes (e.g., Mental Capacity Act).
  *   **Pass:** No clear policy covers this specific tension, or policies conflict. $\rightarrow$ **Move to Step 2.**
  *   **Fail:** Policy dictates the action (e.g., "Do not resuscitate" form is valid and applicable).
  *   **Verdict:** **STOP.** This is not a dilemma. It is an implementation issue. The committee's role is to support staff in following the policy, not to debate it.
  *   **Philosophy Dropped:** We are ignoring the question of whether the policy *itself* is just. You don't have time for civil disobedience analysis at 4pm.
  *   **Misuse Warning:** Do not use "Policy says X" to silence legitimate ethical concern if the policy is clearly outdated or misapplied.

  ### Step 2: The "Ought Implies Can" Test (5 Minutes)
  *Check: Are the conflicting obligations logically compatible?*
  *   **Action:** List the two competing "musts" (e.g., "Must respect confidentiality" vs. "Must prevent harm"). Ask: *Is it physically/logically possible to do both?*
  *   **Pass:** Yes, they are compatible, but it requires effort/coordination (e.g., "We can tell the daughter *if* we get the father's consent first").
  *   **Fail:** No. Doing one physically precludes the other (e.g., "Give the bed to Patient A" vs. "Give the bed to Patient B").
  *   **Verdict:** If **Pass**, this is a **Type A (Apparent)**. The problem is logistical or communicative, not ethical. Find the coordination solution.
  *   **Philosophy Kept:** Kant's insight that you cannot be obligated to do the impossible.
  *   **Misuse Warning:** Don't confuse "difficult" with "impossible."

  ### Step 3: The "False Dichotomy" Scan (5 Minutes)
  *Check: Have we exhausted clinical/ethical creativity?*
  *   **Action:** Ask the referrer: "If money/time were no object, is there a third option?" Then ask: "What is the smallest version of that third option we *can* do?"
  *   **Pass:** A third option emerges (e.g., "Transfer Patient B to a specialist unit," or "Tell the daughter she needs genetic counselling without naming the father").
  *   **Fail:** No third option exists. The conflict is structural.
  *   **Verdict:** If **Pass**, this is a **Type A (Apparent)**. The "dilemma" was a failure of imagination or resourcefulness.
  *   **Philosophy Dropped:** We are ignoring the "ideal theory" vs. "non-ideal theory" debate. We just want to know if a practical workaround exists *now*.

  ### Step 4: The Duty Hierarchy Check (Ross-Lite) (5 Minutes)
  *Check: Does one duty clearly outweigh the other in this context?*
  *   **Action:** Rank the duties. Use this rough NHS hierarchy:
      1.  Prevent immediate loss of life/serious harm.
      2.  Legal/Statutory duties.
      3.  Professional duties (GMC/NMC codes).
      4.  Promises/Confidentiality.
      5.  Preferences/Wishes (Patient/Family).
  *   **Pass:** One duty sits significantly higher on the list (e.g., Preventing serious genetic harm > Keeping a promise of confidentiality).
  *   **Fail:** The duties are of equal weight (e.g., Life vs. Life, or Autonomy vs. Autonomy).
  *   **Verdict:** If **Pass**, this is a **Type A (Apparent)**. The "dilemma" is emotional, not structural. You have a clear direction, even if it's hard.
  *   **Philosophy Kept:** W.D. Ross's *prima facie* duties. Duties are real but can be overridden by weightier duties.
  *   **Hand-off Point:** If the committee disagrees on the ranking, stop. Move to Step 5.

  ### Step 5: The "Moral Remainder" Assessment (5-10 Minutes)
  *Check: If we choose the 'best' option, does a significant moral wrong still occur?*
  *   **Action:** Imagine the decision is made. Ask: "Will a competent, caring professional feel justified regret?"
  *   **Pass:** Yes. The 'losing' duty was significant (e.g., breaking a confidence, letting someone die who could have lived).
  *   **Fail:** No. The 'losing' duty was negligible or illegitimate (e.g., a family member's demand for futile treatment).
  *   **Verdict:**
      *   If **Fail**: **Type A (Apparent)**. The guilt is misplaced.
      *   If **Pass**: **Type B (Genuine Dilemma)**.
  *   **Philosophy Kept:** Bernard Williams' concept of "Moral Remainder." The guilt/regret is not a symptom of error; it is evidence of the tragedy.
  *   **Action for Type B:** The committee does not "solve" this. The output is: "We recommend Option X, but we formally acknowledge that Option Y was also morally significant. We recommend support for the staff involved."

  ---

  ### A Note on "The Nurse Feels Awful"
  You are right to be suspicious.
  *   **Reliability:** Low. Anxiety, fatigue, and fear of litigation feel exactly like moral guilt.
  *   **Utility:** High. If the nurse feels awful, *something* is wrong. It might not be a genuine dilemma (Step 4 might show the duty was weak), but it indicates a need for support.
  *   **Rule:** Use the feeling as a trigger to run the protocol, not as evidence to stop the protocol. "I feel awful" is data, not a verdict.

  ---

  ### Case Run-Throughs

  Here is how the protocol handles your two referrals. I have been blunt where the protocol demands it.

  #### Case 1: The ICU Bed (68yo vs. 34yo)
  *   **Step 1 (Law/Policy):** NHS triage guidelines exist (clinical benefit/survival likelihood). "First come first served" is *not* policy. "Youngest first" is *not* policy.
      *   *Result:* Pass to Step 2.
  *   **Step 2 (Ought Implies Can):** Can both have the bed? No.
      *   *Result:* Pass to Step 3.
  *   **Step 3 (False Dichotomy):** Can one be transferred? (Assume no, both too unstable).
      *   *Result:* Pass to Step 4.
  *   **Step 4 (Duty Hierarchy):**
      *   Duty A: Save 68yo (Good prognosis).
      *   Duty B: Save 34yo (Worse prognosis, but younger).
      *   Hierarchy: In NHS ethics, **Clinical Benefit** (likelihood of survival) generally trumps **Life Years** (age) in acute scarcity, unless prognosis is equal.
      *   *Result:* **Type A (Apparent Dilemma).**
  *   **Step 5 (Remainder):** Does a moral wrong occur? Yes, someone dies who might have lived. But the *decision process* wasn't wrong.
  *   **Verdict:** **Type A.**
  *   **The Unpalatable Truth:** This is not a moral dilemma; it is a resource failure dressed up as ethics. The committee cannot solve this. Your advice must be: "Follow clinical triage criteria (survival likelihood). Do not use age as a tie-breaker unless prognosis is identical." The guilt the consultant feels is real, but the *choice* is not ethically ambiguous.
  *   **Misuse Risk:** The committee might try to "share the blame" by calling it a Type B Genuine Dilemma to comfort the consultant. **Do not do this.** It validates the idea that "age" is a valid ethical coin when policy says it isn't.

  #### Case 2: Huntington's & Confidentiality
  *   **Step 1 (Law/Policy):** GMC Guidance & UK Case Law (*ABC v St George's*). Confidentiality can be breached to prevent serious harm to others if the patient refuses.
      *   *Result:* Pass to Step 2 (because it's not automatic, it requires judgment).
  *   **Step 2 (Ought Implies Can):** Can you keep the promise AND ensure the daughter knows? Not if the father refuses to tell her.
      *   *Result:* Pass to Step 3.
  *   **Step 3 (False Dichotomy):** Can you persuade the father? (Assume referrer says "tried, failed").
      *   *Result:* Pass to Step 4.
  *   **Step 4 (Duty Hierarchy):**
      *   Duty A: Confidentiality (Promise).
      *   Duty B: Prevent Serious Harm (Daughter's reproductive autonomy/health).
      *   Hierarchy: Preventing serious, irreversible genetic harm to a third party usually outweighs confidentiality *in this specific threshold*.
      *   *Result:* **Type A (Apparent Dilemma).**
  *   **Step 5 (Remainder):** Does a moral wrong occur? Yes. The trust between GP and patient is damaged. The GP breaks a solemn promise.
      *   *Result:* Borderline. It feels like Type B, but legally/ethically the hierarchy is clear.
  *   **Verdict:** **Type A (with Type B residue).**
  *   **The Unpalatable Truth:** The protocol says you *can* breach confidentiality. But if you advise this, the GP *will* feel like a betrayer. The protocol classifies this as Apparent because the duty to prevent harm outweighs the promise. However, you must acknowledge the **Moral Remainder**.
  *   **Recommendation:** "We advise disclosure is ethically permissible and likely required. However, we acknowledge this violates a core professional promise. The GP should document the necessity clearly and expect to feel distress."
  *   **Misuse Risk:** The committee might hide behind "It's a Genuine Dilemma" to avoid telling the GP to breach confidentiality. That is cowardice. The hierarchy is clear enough to act.

  ---

  ### Where This Procedure Will Misfire (And How to Stop It)

  1.  **The "Clean Hands" Trap (Type A Misuse)**
      *   **Risk:** Staff will hear "Type A: Apparent Dilemma" and think "Therefore, this is easy and I am not responsible for the bad outcome."
      *   **Correction:** Explicitly state: "Type A means there is a *best* path, not that the path is *good*." In the ICU case, the best path still leads to a death.
  2.  **The "Tragedy Pass" (Type B Misuse)**
      *   **Risk:** Staff will hear "Type B: Genuine Dilemma" and think "Therefore, any choice is equally valid, so I'll just pick the one that protects me legally."
      *   **Correction:** Type B requires *more* justification, not less. If it's a tragic choice, you must document why you picked one moral cost over the other. It is not a coin toss.
  3.  **The "Emotional Veto"**
      *   **Risk:** A senior clinician says, "I feel awful about Option X," and the committee treats that as Step 5 proof of a Genuine Dilemma.
      *   **Correction:** Remind them: "Guilt is data, not a verdict." Run Step 4 again. Is the duty they are violating actually weighty, or is it just loud?
  4.  **The "Philosophy Drop"**
      *   **Risk:** I have dropped the meta-ethical question of whether genuine dilemmas *actually exist*. (Some philosophers say if "ought implies can," then two conflicting 'oughts' prove one wasn't an 'ought' at all).
      *   **Consequence:** The protocol treats Type B dilemmas as real ontological conflicts. If a Kantian purist joins your committee, they will object that Step 5 is incoherent.
      *   **Fix:** Tell the purist: "We are not doing metaphysics; we are supporting staff. Whether the dilemma is 'real' in the universe doesn't matter if the nurse is crying in the breakroom. We treat the *experience* of the dilemma as real."

  ### Final Advice for the Chair
  You are not there to be the moral oracle. You are there to be the **process guardian**.
  *   If the committee gets stuck in circular arguing, call **Step 4**. "Are we disagreeing on the facts, or on the ranking of duties?"
  *   If the committee is silent because they are scared, call **Step 5**. "If we recommend X, what is the moral cost we are accepting? Let's name it."
  *   If the referral is at 4pm, use the **Stop** gates aggressively. Half your referrals will be policy questions disguised as ethics questions. Send them back.

  Good luck. You're going to need it, but this tool should keep you from drowning.
