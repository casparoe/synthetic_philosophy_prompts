prompt: |-
  A small foundation is thinking of funding maybe three philosophers for two or three years on Moore's paradox and adjacent issues, and I've been asked to sketch the research agenda. I don't want it to just be more Wittgenstein exegesis — I want the live problems. If you had to rank the open questions, what goes first and why? Candidates off the top of my head: whether the Moorean defect is pragmatic or genuinely semantic, whether the phenomenon carries over to group attitudes (a committee flatly asserting "the merger will fail but we don't believe it"), whether it applies to dispositional belief or only to occurent judgment, and whether the whole thing is just a special case of epistemic akrasia. But don't give me a laundry list — pick the two or three you'd actually prioritize, defend the ordering in terms of importance, tractability, and how much other work depends on each, and say what developments would make you reshuffle the ranking. Also happy to hear if you think one of my candidates is basically a dead end.
