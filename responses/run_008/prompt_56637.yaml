      *   **Specific Questions to Address:**
          1.  Reconstruct the implicit theory of consciousness/report/memory/neural measurement in the three-part practice (Isolated Forearm Technique [IFT], EEG monitors, Post-op interview).
          2.  Distinguish what the practice *requires* vs. what it *fits with* (Can Hard Problem realists and Illusionists/Deflationists both endorse it?).
          3.  Identify philosophical underdetermination and potential inconsistencies.
