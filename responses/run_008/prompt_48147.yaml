prompt: |-
  My closest friend from university has spent the last several months working through a rather alarming corner of the internet: Atlantis documentaries, Graham Hancock lectures, and lately the Russian mathematician Anatoly Fomenko's "New Chronology," the claim that conventional ancient history is largely a constructed fiction and that, say, most of antiquity actually happened much more recently. We had a four-hour argument over the holidays about all this, and I thought I was doing well on the specifics — I brought up radiocarbon dating, tree-ring sequences, astronomical records in cuneiform tablets, the sheer labor that manuscript traditions would take to forge — but every time I pressed him on evidence, he returned to the same refrain: "history is written by the victors." In his mouth this seemed to do several jobs at once: it explained why the documentary evidence always favors the mainstream view (the victors suppressed the rest), it justified putting fringe reconstructions on equal footing with peer-reviewed scholarship (both are just stories told by someone), and it insulated his favorites from criticism (of course the establishment ridicules Fomenko — the victors always do). I suspect these are three very different claims wearing one proverb, and that only some of them are even true, but I couldn't cleanly separate them in the moment and the conversation ended in frustration rather than enlightenment.

  Please lay out, as an explicit menu, the distinct precise claims that "history is written by the victors" could be expressing — from the trivially true to the genuinely radical — and give a verdict on each. I'd like the answer formatted as a table with five columns: (1) "Reading" — a short name for the claim; (2) "Precise claim" — the reading stated so it could actually be true or false; (3) "Verdict" — one of: platitude, substantive and plausible, substantive but contentious, or false; (4) "Supports my friend's move?" — whether this reading, if true, would justify either downgrading mainstream chronology or upgrading a specific alternative reconstruction like Fomenko's, as opposed to merely reminding us to read sources with care; and (5) "Why" — one or two sentences of justification. Please follow the table with a short paragraph telling me which reading my friend was most likely invoking, given how he used the proverb, and what the honest reply to that reading would be — including, if you think it's relevant, whether his usage smuggles in a demarcation problem about what separates legitimate revisionist history from pseudohistory.

  A couple of constraints: I don't want a reading list or citations, just your analysis, and please write the whole answer in British English. I'd rather be equipped for our next conversation than win it, so if some of his uses of the proverb are actually defensible, say so plainly.
