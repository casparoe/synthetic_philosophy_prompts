answer: |-
  | Reading | Precise claim | Verdict | Supports my friend's move? | Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **Narrative Bias** | Dominant groups influence which events are emphasised in popular history and education. | Platitude | No | This acknowledges selective storytelling but does not deny the underlying chronology or physical evidence. |
  | **Archival Destruction** | Conquerors systematically destroy the physical records of the conquered to erase their legacy. | Substantive and plausible | No | While this happens locally (e.g., burning libraries), it cannot explain globally consistent data like dendrochronology or ice cores. |
  | **Epistemic Relativism** | Historical truth is entirely constructed by power, making objective verification impossible. | Substantive but contentious | Yes | This levels the playing field between evidence-based history and speculation by denying the validity of evidence itself. |
  | **Global Fabrication** | The consensus timeline is a coordinated forgery maintained by institutions to hide a recent antiquity. | False | Yes | This requires impossible coordination across rival nations and disciplines without leakage, and contradicts physical science. |
  | **Methodological Caution** | Textual claims made by elites should be treated as propaganda unless corroborated by material evidence. | Substantive and plausible | No | This is standard historical practice, not a reason to accept fringe theories lacking material support. |

  Your friend was most likely invoking a blend of **Epistemic Relativism** and **Global Fabrication**. By using the proverb to dismiss radiocarbon dating and tree-ring sequences, he is treating physical data as merely another 'story' told by the establishment, rather than independent evidence. This usage smuggles in a demarcation problem: legitimate revisionist history uses new evidence to correct the record, whereas pseudohistory uses the 'victors' claim to immunise itself against any evidence that contradicts it. The honest reply is to concede that narrative bias exists (Reading 1), but to insist that physical chronologies are not 'written' by anyone; they are measured. You might suggest that while victors may write the textbooks, they do not write the tree rings, and any theory requiring the latter to be forged belongs to conspiracy, not history.
