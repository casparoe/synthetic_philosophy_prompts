answer: |-
  I am siding with **you**. Your editor is applying a linear causal model (spark + fuel = fire) to a complex adaptive system (geopolitics + human agency + military logistics), and in doing so, she is asking you to publish something that is not just historically debatable, but mechanically misleading.

  In science writing, isolating a single variable works when you are describing a closed system or a direct mechanism (e.g., "this virus causes this disease"). But when writing about complex systems—climate collapse, financial crashes, or the outbreak of total war—the "spark" analogy is dangerous. It implies that if you remove the spark, the fuel remains safe. In 1914, the "fuel" (alliances, imperialism, militarism) had been accumulating for decades without igniting. The catastrophe wasn't that a match was struck; it was that the European powers had constructed a room so saturated with gasoline that *any* match would have worked, and then handed the matchbox to teenagers.

  The two conflicting historian views you mentioned (everything was necessary vs. any spark would do) do not cancel out; they describe the same phenomenon: **systemic fragility.** The first group describes the structural load-bearing walls; the second describes how close the structure was to collapse. Your story isn't about which brick fell first; it's about why the building was designed to fall down.

  Here is the one-paragraph framing you can use. It avoids the "listicle" trap by making the *absence* of a single cause the central narrative hook:

  > "To ask for the single cause of the Great War is to ask the wrong question. It assumes the peace of 1914 was a stable state disrupted by a specific error, when in reality, the continent had become a machine designed to convert anxiety into violence. The assassination of Archduke Franz Ferdinand did not cause the war any more than a dropped pebble causes an avalanche; the pebble is merely the final variable in an equation of snow, slope, and gravity that had been solving itself for decades. The true story of July 1914 is not about who lit the match, but why every leader in Europe felt they had lost the ability to put it out. When mobilization schedules became tighter than diplomatic channels, and alliance commitments became stricter than national interests, the war ceased to be a choice and became a trajectory. We look for a villain because it comforts us to think the disaster was preventable. The harder truth is that the system was no longer under anyone's control."

  **How to defend this to your editor:**

  Tell her that a single-cause narrative offers the reader a **false safety**. If you tell readers "German aggression caused the war," they conclude "stop German aggression, stop the war." If you tell them "The alliance system caused the war," they conclude "avoid alliances." But the lesson of 1914 is that rational actors, defensive alliances, and legitimate security concerns can *combine* to produce a disaster no one wants. That is the relevant lesson for a general readership today (reminding them of nuclear standoffs, automated trading, or climate tipping points). By forcing a single cause, you aren't simplifying the science of history; you are falsifying the mechanism of the event. You aren't writing a list of causes; you are writing about the *failure of crisis management* in a hyper-connected system. That is a stronger, more sellable story than "Germany Did It" or "The Archduke Did It."
