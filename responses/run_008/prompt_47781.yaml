      *   **Constraint:** I must take a side (Editor or User). I cannot say "it depends." I must provide a specific principle if I side with the editor (and apply it to pick a cause) OR a specific one-paragraph framing if I side with the user.
      *   **Goal:** The user needs to defend the decision to the editor.

  2.  **Evaluate the Arguments:**
      *   **Editor's View:** Narrative simplicity. Readers need a hook. Causal selection is common in science communication (the "spark" analogy).
      *   **User's View:** Historical accuracy. Historians emphasize complexity, necessary conditions, and systemic fragility. Reducing it to one cause feels like distortion.
      *   **The Core Issue:** Is WWI like a fire (spark vs. fuel), or is it like a complex system failure (e.g., a financial crash or an ecosystem collapse)?
      *   **Historiography Check:** The debate over WWI origins is famously contentious (Fischer Thesis, structuralism, agency, etc.). Most modern synthesis leans towards a mix of structural tension + specific agency decisions. However, the "spark" analogy is actually quite weak for WWI. In a fire, the spark is the *last* thing to happen. In WWI, the "spark" (Sarajevo) happened, but the war didn't start immediately. It took a month of *decisions*. The mobilization schedules, the blank check, the Russian partial vs. general mobilization—these were active choices, not passive fuel.
      *   **Science Writing Analogy:** In science writing, we often isolate variables. But in complex systems (climate, epidemiology, ecology), we often talk about "tipping points" or "perfect storms" rather than single causes. WWI is more like a systemic collapse than a simple chemical reaction.
      *   **Decision:** I side with the **User**.
      *   **Why?** The editor's "spark" analogy is factually misleading for this specific historical event. A spark implies inevitability once lit. WWI was not inevitable until the very last days, and even then, specific decisions (German leadership pushing Austria, Russian mobilization choices) were active drivers, not passive conditions. Reducing it to one cause (e.g., "German Aggression" or "Alliance Systems") simplifies away the actual lesson of the history (which is about how systems manage crisis). A "many causes" frame can be written narratively without being a list.

  3.  **Drafting the Response (Iterative Process):**

      *   *Step 1: Declare the side.* I need to be firm. I'm siding with the user.
      *   *Step 2: Explain why the editor is wrong.* The "spark" analogy fails because the "fuel" (alliances, militarism) had been there for decades without burning. The difference in 1914 was the *management* of the crisis. It's not about *what* caused it, but *why the brakes failed*.
      *   *Step 3: Address the Historian's Contradiction.* The user mentioned historians saying "X was necessary" vs. "Any spark would work." These don't cancel out; they point to *systemic fragility*.
      *   *Step 4: Create the One-Paragraph Framing.* This is the deliverable. It needs to be punchy, magazine-ready, and avoid the "listicle" trap. It needs to reframe the question from "Who lit the match?" to "Why was the house full of gas?"
      *   *Step 5: Defense Strategy.* Give the user ammo to fight the editor. Focus on the "lesson" for the reader. A single cause offers a false comfort (if we remove X, no war). A systemic view offers a real warning (systems can trap leaders).

  4.  **Refining the "One-Paragraph Framing":**
      *   *Draft 1 (Mental):* Historians argue about many causes. Alliances, militarism, nationalism. It wasn't just one thing. It was a perfect storm. So we shouldn't pick one.
      *   *Critique 1:* Too boring. Sounds like a textbook.
      *   *Draft 2 (Mental):* The war didn't have one cause. It had a structure that made peace impossible. Like a bridge that collapses not because of one heavy truck, but because the bolts were rusted. The assassination was just the truck.
      *   *Critique 2:* Better analogy. But needs to be more active.
      *   *Draft 3 (Closer to final):* Focus on the *mechanism* of failure. The "July Crisis" wasn't a domino chain; it was a trap. The framing should be about the loss of control.
      *   *Final Polish:* Make it sound like a lead or a kicker. "To ask for the single cause of the Great War is to ask the wrong question..."

  5.  **Refining the Argument against the Editor:**
      *   The editor says science writing does this (spark vs. fire).
      *   Counter: In complex systems science (which WWI resembles), we talk about *precipitating events* vs. *underlying vulnerabilities*. If you say the spark caused the fire, you imply removing the spark prevents the fire. If the room is full of gas, *any* spark works. The story isn't the spark; it's the gas.
      *   Specific WWI nuance: The "mobilization schedules" argument is key. Once the machine started, it couldn't stop. That's a systems failure, not a single cause.

  6.  **Final Review against Constraints:**
