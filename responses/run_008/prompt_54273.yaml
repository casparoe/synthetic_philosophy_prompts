answer: |-
  ### Part 1: Philosophical Brainstorm & Viability Check

  Before we build the tool, we need to know which philosophical engines actually run on policy fuel.

  *   **The Person-Affecting View ("No harm, no foul"):** *Viability: Low for NIP cases.* This is your current guidance. It says an act is only wrong if it makes a specific person worse off than they would otherwise have been. It breaks on identity-affecting cases because the "otherwise" is non-existence. If we keep this, we rubber-stamp everything that keeps people above the starvation line, even if their lives are miserable compared to the alternative.
  *   **Impersonal Total Utilitarianism ("Maximize total happiness"):** *Viability: Dangerous.* This says we should choose the future with the most total well-being. It survives translation but leads to the "Repugnant Conclusion": a massive population with barely worth-living lives beats a small, flourishing one. Reviewers will intuitively reject this, causing them to ignore the procedure.
  *   **Impersonal Average Utilitarianism ("Maximize average quality"):** *Viability: Moderate.* Avoids the Repugnant Conclusion but implies we shouldn't add happy people if they lower the average. This conflicts with development goals (e.g., saving lives).
  *   **Threshold Views ("Don't create miserable lives"):** *Viability: High.* This sets a floor. If a policy creates people whose lives are not worth living, it's wrong. If their lives are worth living, it's permissible. This is easy to operationalize but doesn't help choose between two "good" futures.
  *   **Ex Ante Consent / Reasonable Rejection ("Would you accept this risk?"):** *Viability: High.* Asks: "If you didn't know which specific person you would be in the future, would you agree to this policy?" This captures risk and fairness without needing to identify victims.

  **Selection for Procedure:** We will blend **Threshold Views** (a hard constraint) with **Same-Number Quality** (if population size is stable, pick the better life) and **Ex Ante Reasonableness** (for risk/fairness). We will explicitly flag where the procedure forces a choice between "Total Good" and "Average Good."

  ***

  ### Part 2: Reviewer Briefing (One Paragraph)

  > **Briefing: The Non-Identity Problem**
  > Standard ethics asks: "Does this hurt specific people?" But some projects change *who* is born (e.g., by shifting when people conceive or who meets whom). For those future people, the alternative wasn't a better life; it was never existing at all. So, they can't claim they were "harmed" in the usual sense, even if their lives are difficult. This doesn't mean anything goes. This procedure shifts the question from "Did we hurt a victim?" to "Are we creating a future we can justify?" It focuses on whether lives will be worth living, whether we are lowering quality of life unnecessarily, and whether the risks imposed are ones anyone could reasonably accept.

  ***

  ### Part 3: The Identity-Affecting Ethics Procedure (IAEP)

  **Time Required:** 45–60 Minutes
  **Users:** Policy Analysts & Ethics Reviewers

  #### Step 1: The Identity Screen
  *Goal: Determine if you need to use this procedure at all.*

  1.  **Does the project fundamentally alter living conditions, migration patterns, or reproductive health for a community?**
      *   *Yes:* Proceed to Q2.
      *   *No:* (e.g., standard road repair, administrative training) → **STOP.** Use standard "Do No Harm" guidance.
  2.  **Is it plausible that this change will alter *who* conceives *when*, or *which* partners meet?**
      *   *Note on Crude Threshold:* We cannot track actual conception. Use a proxy: If the project displaces people, changes mortality rates significantly (>5%), or alters economic timelines by >1 year, assume identity is affected.
      *   *Yes:* → **PROCEED to Step 2.** (This is an Identity-Affecting Decision).
      *   *No:* → **STOP.** Use standard "Do No Harm" guidance.

  #### Step 2: The Misery Threshold (Hard Constraint)
  *Goal: Ensure no one is born into a "life not worth living."*

  1.  **Will any group of future people exist *only* because of this project, whose lives are predicted to be so blighted they are not worth living?**
      *   *Definition:* "Not worth living" means suffering vastly outweighs any joy; a rational person would prefer non-existence. (e.g., severe congenital conditions caused by the project, permanent enslavement, ecological toxicity making survival agonizing).
      *   *Yes:* → **REJECT PROJECT.** (This is a veto).
      *   *No:* → **PROCEED to Step 3.**

  #### Step 3: The Same-Number Quality Check
  *Goal: Compare futures if population size is roughly stable.*

  1.  **Is the total population size in the affected region expected to remain roughly the same (±10%) compared to the alternative?**
      *   *No:* → **SKIP to Step 4.** (Go to Ex Ante Check).
      *   *Yes:* → **Ask:** "In this project future, is the average quality of life *lower* than in the alternative future?"
          *   *Yes:* → **FLAG FOR BOARD.** (You are creating specific people with worse lives than the specific people who would have existed otherwise. This requires justification).
          *   *No:* → **PROCEED to Step 4.**

  #### Step 4: The Ex Ante Reasonableness Test
  *Goal: Assess fairness and risk without identifying victims.*

  1.  **Imagine you are a soul waiting to be born into this region, knowing you could be *anyone* affected by this project (local resident, future worker, displaced person).**
  2.  **Would you rationally accept the risk of being the person who suffers the most under this plan, given the benefits to the whole?**
      *   *Consider:* Is the suffering concentrated on one group (e.g., locals) while benefits go to others (e.g., global climate)? Is there compensation?
      *   *No (I would reject the risk):* → **FLAG FOR BOARD.** (The distribution of risk is unethical).
      *   *Yes (I would accept the risk):* → **PROCEED to Step 5.**

  #### Step 5: Values Exit Points (Mandatory Disclosure)
  *Goal: Admit where the procedure cannot be neutral.*

  **Check the following boxes if they apply. If any are checked, you must escalate to the Board.**

  *   [ ] **The Total vs. Average Conflict:** The project creates *more* people with decent lives, but lowers the *average* resources/well-being per person. (The procedure cannot decide if "More Good Lives" beats "Better Good Lives").
  *   [ ] **The Rights Override:** The project passes the "Misery Threshold" (Step 2) but violates existing land/rights claims of current people to benefit future people. (The procedure prioritizes future existence over current entitlements).
  *   [ ] **The Long-Term Gamble:** The benefits rely on predictions >50 years out (e.g., climate stability), while harms are immediate.

  #### Step 6: Failure Modes (When to Distrust This Procedure)
  *Do not use this procedure if:*

  1.  **The "Sadist" Loophole:** The project creates a large population with lives *just barely* worth living to maximize "total good." (If Step 3 suggests this is acceptable, distrust it. Escalate).
  2.  **The "Existing Rights" Blindspot:** The project treats existing people merely as vessels for future people. (If the project violates current legal rights to achieve future benefits, ignore the procedure's "Pass" and flag it).
  3.  **Uncertainty Overload:** If the prediction of "who will exist" is pure speculation (e.g., minor policy tweak), you are likely over-analyzing. Revert to Step 1.

  ***

  ### Part 4: Worked Cases

  #### Case 1: Flood-Prone Village Resettlement
  *Scenario:* A dam project requires moving a village. The new site is safe from floods but has poor soil and high heat. Marriage patterns will shuffle due to relocation. Lives at the new site will be harsh but above subsistence.
  *   **Step 1 (Screen):** Yes. Displacement changes partners/timing. Identity-affecting.
  *   **Step 2 (Threshold):** No. Lives are harsh but "worth living." Pass.
  *   **Step 3 (Same-Number):** Yes, population stable. Quality of life is *lower* than if they stayed (assuming they could have stayed with flood defenses). **FLAG FOR BOARD.**
  *   **Step 4 (Ex Ante):** Would I accept being born into the harsh new site vs. the original village? Probably not, unless the flood risk was fatal.
  *   **Step 5 (Exit):** **Rights Override.** We are trading current land rights for future safety/energy.
  *   **Result:** **Escalate to Board.**
  *   **Analysis:** The procedure correctly identifies that while no *future* person is "harmed" (since they wouldn't exist otherwise), the *quality* of that future is lower than the alternative. It prevents the "At least they exist" rubber stamp.

  #### Case 2: Lithium Mine for Decarbonization
  *Scenario:* A mine causes local ecological damage (water toxicity, respiratory issues) but enables battery storage that prevents catastrophic climate change decades later. Local community identity will change due to economic influx.
  *   **Step 1 (Screen):** Yes. Economic shift changes demographics/conception.
  *   **Step 2 (Threshold):** Borderline. Respiratory issues are bad, but likely not "life not worth living." Pass (cautiously).
  *   **Step 3 (Same-Number):** No. Global population changes due to climate mitigation. Skip to Step 4.
  *   **Step 4 (Ex Ante):** If I didn't know if I was a local child in 2030 or a global citizen in 2080, would I accept the risk? Many would say yes (climate catastrophe is worse).
  *   **Step 5 (Exit):** **The Long-Term Gamble.** Benefits are distant; harms are immediate.
  *   **Result:** **Escalate to Board.**
  *   **Analysis:** The procedure highlights the intergenerational trade-off. It doesn't solve it, but forces the Board to admit they are sacrificing specific locals for vague future globals.

  #### Case 3: Maternal Health Program (The Uncomfortable Answer)
  *Scenario:* A program drastically reduces infant mortality and increases maternal longevity in a resource-constrained region. This will lead to a 20% population increase over the next generation. Resources (schooling, water) will be stretched, lowering the *average* quality of life per child, though all lives remain "worth living."
  *   **Step 1 (Screen):** Yes. Directly changes who exists and how many.
  *   **Step 2 (Threshold):** No. All lives are worth living. Pass.
  *   **Step 3 (Same-Number):** No. Population increases significantly. Skip to Step 4.
  *   **Step 4 (Ex Ante):** Would I accept being born into a world where I exist but have fewer resources, vs. a world where I might not exist but others have more? This is psychologically difficult for reviewers.
  *   **Step 5 (Exit):** **The Total vs. Average Conflict.**
      *   *Procedure Logic:* The procedure flags this as a **Values Exit**. It cannot determine if "More Lives with Less" is better than "Fewer Lives with More."
      *   *Recommendation:* **Escalate to Board with a Warning.**
  *   **The Uncomfortable Answer:** The procedure effectively blocks the automatic approval of the program. It tells the Board: *"You cannot justify this simply by saying 'we saved lives.' You are actively choosing a future with lower average welfare per capita. You must explicitly endorse 'Total Welfare' over 'Average Welfare' to approve this."*
  *   **Why the Board Won't Like It:** Development agencies operate on the heuristic "Saving lives is always good." This procedure forces them to admit that saving lives *can* come at the cost of quality of life, and that approving the project is a controversial philosophical choice (Total Utilitarianism), not a neutral moral good.
  *   **Is the Procedure Right or Broken?** It is **Right**. It exposes a hidden value judgment. The Board *should* be uncomfortable. If they approve it, they are saying "Quantity of life outweighs Quality of life." That is a defensible position, but it must be a conscious decision, not a default setting. The procedure prevents them from hiding behind "Do No Harm" when they are actually making a population ethics trade-off.

  ***

  ### Final Note to the Analyst
  When you present this, expect pushback on Case 3. Your colleagues will say, "We can't tell a health program it's ethically ambiguous." Your response is: "The ethics *are* ambiguous. Currently, we pretend they aren't. This tool forces us to own the ambiguity so the Board can make a real decision, rather than us pretending the math solves the morality."
