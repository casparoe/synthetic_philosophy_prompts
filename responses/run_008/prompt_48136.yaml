      *   **Goal:** Create a quiz to reveal their *actual* normative commitments regarding bargaining solutions (Nash, Kalai-Smorodinsky (KS), Egalitarian, Skeptic/Power-based).
      *   **Format:** 8-10 questions. Concrete bargaining problems (feasible sets, disagreement point (0,0)). No axiom names. Options phrased as verdicts on fairness.
      *   **Required Content:**
          *   Expansion of Player 1's max (Monotonicity check).
          *   Removal of irrelevant alternatives (IIA check).
          *   Asymmetric max gains (Nash vs. KS vs. Egalitarian split).
          *   Utility scale comparability (Invariance check).
          *   Symmetric calibration case.
      *   **Scoring Key:** Map patterns to Nash, KS, Egalitarian, Skeptic. Identify incoherent combinations. Acknowledge where solutions coincide.
      *   **Self-Critique:** End with limitations, framing biases, and potential restructuring.

