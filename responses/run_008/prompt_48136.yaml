      *   **Kalai-Smorodinsky (KS):** Maximizes the minimum ratio of achieved utility to ideal utility ($\min(u_1/u_1^*, u_2/u_2^*)$). Satisfies Monotonicity, Symmetry, Pareto, Invariance. *Fails* IIA.
      *   **Egalitarian (E):** Maximizes $\min(u_1, u_2)$ (assuming comparable scales). Satisfies Monotonicity. *Fails* Invariance (sensitive to scaling).
      *   **Skeptic (S):** "Bargaining power" determines outcome; axioms are nonsense. Any Pareto point is defensible depending on context.

