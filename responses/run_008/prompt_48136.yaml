  # The "What Do You Actually Believe?" Bargaining Quiz

  **Instructions:** Below are 10 concrete scenarios involving two players dividing a surplus. The disagreement point is always (0,0) — if they don't agree, both get nothing. An arbitrator must impose a "fair" settlement. 

  Answer based on your normative intuition about fairness. Do not try to recall class definitions; answer as if you were the arbitrator.

  ---

  ### Q1: The Calibration (Symmetry)
  Two players bargain over a budget. The maximum possible payoff for Player 1 is $100. The maximum possible payoff for Player 2 is $100. The feasible deals form a straight line connecting ($100, $0) and ($0, $100).
  **What is the fair split?**
  A) ($50, $50)
  B) ($60, $40) or ($40, $60) depending on minor details
  C) There is no single fair split; any agreement is as good as another.

  ### Q2: The Asymmetric Ceiling (Proportionality vs. Equality)
  Player 1 can potentially gain up to 100 units. Player 2, due to external constraints, can potentially gain up to only 50 units. The feasible frontier is a straight line connecting (100, 0) and (0, 50).
  **What is the fair split?**
  A) (50, 25) — Each gets half of their own maximum possible.
  B) (50, 50) — Each gets the same absolute amount (Player 2 takes their max).
  C) (66, 33) — Player 1 gets twice as much because their capacity is double.

  ### Q3: The Expansion Test (Monotonicity I)
  **Scenario A:** The maximum possible payoff for P1 is 40. For P2 it is 40. The fair split is determined to be (30, 30).
  **Scenario B:** Nothing changes for Player 2 (max is still 40). However, Player 1's opportunities expand, and their maximum possible payoff is now 80. The old deal (30, 30) is still available.
  **In Scenario B, is it fair for Player 2 to receive *less* than 30?**
  A) No. Player 2's situation didn't worsen, and the set of options grew. They shouldn't be punished for P1's good luck.
  B) Yes. The "center of gravity" of the deal shifts toward Player 1. P2 might get less to balance P1's new leverage.
  C) It depends on how the expansion happened (e.g., did P1 work for it?).

  ### Q4: The Irrelevant Option (IIA I)
  A feasible set includes a "extremist" deal: (100, 0). No one considers this fair, but it is technically possible. The fair split is currently (50, 50).
  Now, suppose the (100, 0) deal is removed from the table (perhaps it becomes illegal). The (50, 50) deal is still possible.
  **Does the fair split change?**
  A) No. Removing an option nobody wanted shouldn't change what's fair for the rest.
  B) Yes. The removal changes the "range" of the game, which alters the fair proportion.
  C) Maybe. It depends on why it was removed.

  ### Q5: The Unit Problem (Scale Invariance)
  Player 1's payoff is measured in Dollars. Player 2's payoff is measured in "Happiness Points." Currently, 1 Dollar ≈ 1 Point. The fair split is ($50, 50 Points).
  A psychologist recalibrates the Happiness scale. Now, 1 Dollar ≈ 100 Points. (Player 2's real well-being hasn't changed, just the numbering).
  **What is the new fair split?**
  A) ($50, 5000 Points) — We equalize the numbers on the new scale.
  B) ($50, 50 Points) — We stick to the original real-world outcome, ignoring the numbering.
  C) The question is meaningless; you can't compare Dollars to Happiness.

  ### Q6: The Skeptic's Challenge
  Two players face a feasible set. There are many Pareto-efficient deals.
  **Is there a fact of the matter about which one is "fair," or is it purely determined by bargaining power/threats?**
  A) There is a uniquely fair point determined by reason.
  B) "Fairness" is just a label for the outcome of power dynamics. Any Pareto point is defensible.
  C) There are a few focal points, but no precise solution.

  ### Q7: The Expansion Test II (Monotonicity Consistency)
  Player 1's maximum payoff increases from 100 to 200. Player 2's maximum stays at 100.
  **If the original fair split gave Player 2 exactly 50% of their maximum, what should happen to Player 2's share now?**
  A) It should stay at 50% of their maximum (50 units).
  B) It should drop below 50% of their maximum (e.g., 40 units) to give P1 more.
  C) It should rise above 50% of their maximum.

  ### Q8: The Irrelevant Option II (IIA Consistency)
  Consider a curved frontier where the fair point is a "kink" (a sharp corner). We smooth out the frontier far away from the kink, without changing the kink itself or the maximum possible payoffs.
  **Does the fair point move?**
  A) No. The local geometry at the solution didn't change.
  B) Yes. The global shape of the set determines the solution.
  C) Only if the smoothing changes the maximums.

  ### Q9: The Unit Problem II (Scale Consistency)
  If we multiply Player 1's utility function by 10 (changing the units), but leave Player 2's alone:
  **Does the physical outcome (the actual goods/money exchanged) change?**
  A) Yes. The math of fairness depends on the utility numbers.
  B) No. Fairness is about the real outcome, not the utility representation.
  C) Only if Player 1 is more risk-averse.

  ### Q10: The "Vibes" Check
  Imagine a case where Player 1 is a billionaire and Player 2 is starving. The feasible set is symmetric (both can get 100).
  **Does the fair split remain (50, 50)?**
  A) Yes. The bargaining problem is defined by the surplus, not outside wealth.
  B) No. We should account for outside context (egalitarianism of welfare, not utility).
  C) No. The billionaire has more power, so they get more.

  ---

  # Scoring Key & Diagnosis

  ### The Leaves (Solution Concepts)

  1.  **The Nash Bargainer (Nash Product)**
      *   **Signature:** Q1(A), Q2(A), Q3(B), Q4(A), Q5(B), Q7(B), Q8(A), Q9(B).
      *   **Logic:** You care about *independence of irrelevant alternatives* (removing unchosen options doesn't matter) and *scale invariance* (units don't matter). However, you accept that if Player 1's potential grows, Player 2 might actually lose out in absolute terms (Monotonicity violation) because the "product" maximization shifts the tangent point.
      *   **Note:** If you chose Q2(A) and Q5(B), you are committed to proportional gains, not equal absolute gains.

  2.  **The Kalai-Smorodinsky Advocate (KS)**
      *   **Signature:** Q1(A), Q2(A), Q3(A), Q4(B), Q5(B), Q7(A), Q8(B), Q9(B).
      *   **Logic:** Like Nash, you care about scale invariance (Q5/9) and proportional gains (Q2). *However*, you insist on *Individual Monotonicity* (Q3/7): Player 2 should never lose when Player 1's options expand. To guarantee this, you sacrifice IIA (Q4/8): removing "irrelevant" extreme options changes the "ideal point," which moves the solution.
      *   **Note:** This is the hardest profile to hold consistently. Many students claim KS intuitions but accidentally answer like Nash on IIA.

  3.  **The Egalitarian (Equal Absolute Gains)**
      *   **Signature:** Q1(A), Q2(B), Q3(A), Q4(B), Q5(A), Q7(A/C), Q8(B), Q9(A).
      *   **Logic:** You want players to end up with the same absolute number (Q2). This commits you to believing utility scales are comparable (Q5/9). If scales are comparable, changing units *must* change the solution (Q5(A)). You also generally reject IIA (Q4) and support Monotonicity (Q3).
      *   **Diagnosis:** If you chose Q2(B) but Q5(B), you are **Incoherent**. You cannot demand equal absolute gains while claiming utility scales are arbitrary. You are likely an Egalitarian who hasn't accepted the implication of interpersonal utility comparison.

  4.  **The Skeptic (Power/Context)**
      *   **Signature:** Q1(C) or Q6(B), Q3(C), Q10(B/C).
      *   **Logic:** You reject the premise that axioms determine outcomes. You believe "fairness" is either indeterminate or dependent on outside context (wealth, threats, bargaining skill) not captured in the feasible set.
      *   **Diagnosis:** If you answered Q6(B) but picked specific solutions in Q1-Q5, you are **Conflicted**. You either believe there is a fair solution *or* it's all power; doing both suggests you haven't fully bought the skeptic's critique.

  ### Coincidences & Blind Spots

  *   **Nash vs. KS on Symmetry:** Q1 cannot separate Nash and KS. Both satisfy symmetry. If a student picks (60, 40) here, they are not operating within standard axiomatic bargaining theory (or they are Skeptics).
  *   **Nash vs. KS on Scale:** Q5 and Q9 cannot separate Nash and KS. Both satisfy invariance to affine transformations. If a student uses Q5 to distinguish them, they are mistaken; this question separates Egalitarians from the rest.
  *   **The "Linear Frontier" Trap:** In Q2, if the frontier is linear and disagreement is (0,0), Nash and KS actually yield the *same* numerical solution (halfway). I phrased Q2 to ask about the *principle* ("Half of their own maximum" vs "Same absolute amount") to avoid this numerical coincidence forcing a tie.
  *   **Incoherent Zone:** There is a logical space for "Monotonicity + IIA." No standard solution satisfies both (given the other standard axioms). If a student answers Q3(A) [Monotonicity OK] and Q4(A) [IIA OK], they are demanding a solution that **does not exist**. This usually indicates they haven't grasped the tension between the axioms.

  ### Self-Critique & Limitations

  1.  **Framing Bias on Monotonicity (Q3/Q7):** The phrasing "Is it fair for Player 2 to receive *less*?" is emotionally loaded. Students may answer "No" (supporting KS) simply because "less" sounds punitive, not because they understand the geometric implication of the expanding feasible set. A more neutral phrasing ("How does P2's share change?") might yield more Nash-like answers from those who actually accept the math but dislike the normative implication.
  2.  **The "Egalitarian" Trap (Q2/Q5):** Students often claim to be Egalitarians (Q2-B) but recoil at the utility comparison implication (Q5-B). The quiz flags this as incoherent, but in practice, this is the most common position ("I want equality, but I know utility is subjective"). The scoring key treats this as an error, but it might reflect a sophisticated objection to the framework itself.
  3.  **Skeptic Sorting:** The Skeptic leaf is catch-all. A student who answers randomly will look like a Skeptic. Distinguishing "Philosophical Skeptic" from "I didn't read the questions" is impossible without follow-up.
  4.  **Restructuring:** If I ran this again, I would replace Q8 (Smoothing the frontier) with a **Risk Aversion** probe. Nash is sensitive to risk aversion (curvature of utility); KS is less so. Since the prompt assumes utility is already given, this is tricky, but asking "If Player 2 is more desperate (concave utility), does their share go up or down?" would cleanly separate Nash (share goes up) from KS (share stays proportional to ideal). I omitted this to keep the quiz "axiom-free," but it's a major intuitive divider I missed.

  **Final Note to the Instructor:** If your "stubborn undergrads" all land on **Incoherent (Egalitarian + Invariance)**, do not mark them wrong. Mark them as "Intuitive Egalitarians who reject the formalism." That is likely the most honest result of the session.
