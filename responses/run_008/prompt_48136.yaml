                  *   So KS moved from (60,60) to (52, 65). Nash stayed at (60,60).
                  *   *Perfect.* This separates Nash (IIA holder) from KS (IIA violator).

      *   *Q5 (Scale Invariance - Egalitarian vs Rest):*
          *   P1 in dollars, P2 in "happiness units".
          *   If we multiply P2's units by 1000, does the fair split change in terms of real outcomes?
          *   Nash/KS: No (Invariant). Egalitarian: Yes (Equal absolute numbers change).
          *   Scenario: P1 Max $100. P2 Max 100 "utils". Split (50, 50).
          *   Rescale P2: 1 util = 1 cent. P2 Max 10,000 cents.
          *   New Split options: (50, 50) [50 dollars, 50 utils] vs (50, 5000) [50 dollars, 5000 cents].
          *   Egalitarian would pick (50, 5000) to equalize numbers. Nash/KS pick (50, 50) effectively.

      *   *Q6-Q8 (Fillers/Variations):*
          *   Q6: Skeptic check. "Does the arbitrator need to know *how* they bargained?" (Threat points vs Feasible set).
          *   Q7: Risk aversion proxy? (Curved utility). Maybe too complex.
          *   Q8: Another Monotonicity check or IIA check to ensure consistency.
          *   Let's add a "Disagreement Point Shift" question. Nash is sensitive to d. KS is sensitive to d (via ideal point relative to d). Egalitarian sensitive to d.
          *   Actually, let's stick to the prompt requirements.
          *   Need: Expansion (Monotonicity), Deletion (IIA), Asymmetric Max (Egalitarian vs Prop), Scale (Invariance), Symmetry.
          *   That's 5 specific types. I need 8-10 questions total.
          *   I will duplicate the types with different framing to check consistency.
          *   Q1: Symmetry (Calibration).
          *   Q2: Asymmetric Max (Egalitarian vs Nash/KS).
          *   Q3: Monotonicity (Nash vs KS).
          *   Q4: IIA (Nash vs KS).
          *   Q5: Scale Invariance (Egalitarian vs Nash/KS).
          *   Q6: Skeptic/Power (Is there a right answer?).
          *   Q7: Monotonicity (Variation).
          *   Q8: IIA (Variation).
          *   Q9: Scale (Variation).
          *   Q10: "Vibes" check / Consistency.

  4.  **Refining the Scoring Key:**
      *   Need to map answers to: Nash, KS, Egalitarian, Skeptic.
      *   Nash: Passes IIA, Passes Scale, Fails Monotonicity (accepts P2 loss), Symmetry.
      *   KS: Fails IIA (accepts move), Passes Scale, Passes Monotonicity (rejects P2 loss), Symmetry.
      *   Egalitarian: Fails Scale (accepts change), Passes Monotonicity, Symmetry. (Usually fails IIA too? Egalitarian satisfies IIA? No, Egalitarian depends on the shape of the set relative to the 45-degree line. If you cut off the top right, the 45-degree intersection might move. So Egalitarian fails IIA).
      *   Skeptic: "Depends", "Power matters", "Any Pareto point".

      *   *Logic Check:*
          *   Monotonicity Q:
              *   "P2 gets less": Nash.
              *   "P2 cannot get less": KS, Egalitarian.
          *   IIA Q:
              *   "Point stays same": Nash.
              *   "Point moves": KS, Egalitarian.
          *   Scale Q:
              *   "Split changes": Egalitarian.
              *   "Split same (in real terms)": Nash, KS.
          *   Asymmetric Max Q:
              *   "Equal Absolute": Egalitarian.
              *   "Equal Proportional": Nash, KS.
          *   Skeptic Q:
              *   "No fact of the matter": Skeptic.

      *   *Incoherent Combinations:*
          *   Passes Scale + Equal Absolute (Impossible, Equal Absolute requires scale sensitivity).
          *   Fails Monotonicity + Passes IIA (Nash profile).
          *   Passes Monotonicity + Passes IIA (Impossible for KS/Egalitarian).
          *   If someone says "Scale doesn't matter" but "Equal Absolute gains", they are confused.

  5.  **Drafting the Content:**
      *   Tone: Academic but slightly provocative ("catch them out").
      *   Formatting: Clear scenarios, distinct options.
      *   Key: Detailed logic.

  6.  **Self-Critique Section:**
