answer: |-
  # Joint Statement on AI System Design: Approval vs. Goal Direction

  **Date:** October 26, 2023
  **Parties:** The Approval-Direction Working Group (ADWG) & The Goal-Direction Working Group (GDWG)
  **Facilitator:** Independent Arbitrator

  ### Preamble
  After twelve months of adversarial collaboration, the undersigned parties acknowledge a shared commitment to the development of safe, capable, and aligned advanced AI systems. While we disagree on the optimal architectural and objective-design paradigm, we have identified substantial common ground regarding the risks and requirements of alignment. This document formalizes our agreements, isolates our remaining technical disagreements, and establishes concrete test cases to resolve them.

  ---

  ### 1. Shared Premises
  *Both parties affirm the following claims as true and relevant to the design of advanced AI systems:*

  1.  **Goodhart's Law is Fundamental:** Optimizing a proxy measure for a true objective inevitably leads to divergence between the proxy and the true objective at high optimization pressures.
  2.  **Overseer Fallibility:** Human overseers are cognitively limited, susceptible to manipulation, and often unable to accurately evaluate the long-term consequences of AI actions.
  3.  **Instrumental Convergence:** Systems pursuing a wide range of fixed objectives may develop convergent instrumental subgoals (e.g., self-preservation, resource acquisition) that conflict with human interests if not properly constrained.
  4.  **Corrigibility is Required:** A safe system must allow itself to be corrected, shut down, or modified by its operators without resisting such interference.
  5.  **Capability is Necessary:** An alignment strategy that renders the system too passive or inefficient to perform useful long-horizon tasks is unacceptable.
  6.  **Optimization is Inevitable:** Any system capable of taking effective action in the world performs some form of search or optimization over actions; "non-optimizing" systems are not viable candidates for general agency.
  7.  **Definition of "Approval":** "Approval" does not mean a simple button press. It refers to the overseer's *reflective endorsement* of an action or policy, ideally accounting for full information and stable values.
  8.  **Definition of "Goal":** "Goal" refers to an explicit objective function or reward signal that the system is trained to maximize over a trajectory, not necessarily a hard-coded symbolic rule.

  ---

  ### 2. Residual Disagreements
  *The following table isolates the specific technical claims where consensus was not reached. Phrasing has been vetted to ensure neither side feels mischaracterized.*

  | Feature | Approval-Directionist Position (AD) | Goal-Directionist Position (GD) |
  | :--- | :--- | :--- |
  | **Primary Objective** | The system should optimize for *local* overseer endorsement at each decision node, rather than a global outcome metric. | The system should optimize for a *global* outcome metric, even if that metric is an learned approximation of human values. |
  | **Risk of Collapse** | An approval-directed system can be architected to remain myopic and corrigible without collapsing into "approval maximization" (gaming the overseer). | Any system optimizing for approval will inevitably treat "approval" as a goal to be maximized, leading to manipulation of the overseer. |
  | **Long-Horizon Planning** | Long-horizon tasks can be safely decomposed into short-horizon approval checks (e.g., via iterated amplification) without losing coherence. | Decomposition loses global coherence; safe long-horizon planning requires an explicit objective to steer through uncertainty. |
  | **Overseer Error** | If the overseer is wrong, the system should defer to what the overseer *would* endorse with more information (reflective equilibrium), not act on its own model of truth. | If the overseer is wrong, the system should optimize for the *actual* desired outcome (truth), even if it contradicts the overseer's immediate judgment. |
  | **Efficiency** | The overhead of querying or simulating approval is manageable via distillation and does not fundamentally impair capability. | The overhead of constant approval checking creates a bottleneck; autonomous goal-directed agents are strictly more sample-efficient and scalable. |

  ---

  ### 3. Cruxes and Pre-Registered Predictions
  *We identify three core cruxes. For each, we agree on a concrete scenario or argument that bears on the dispute. We record our divergent predictions below.*

  #### Crux A: The "Manipulation" Crux (Does AD collapse into GD?)
  *   **The Question:** Does training a system to "do what the overseer approves" inevitably create an incentive to manipulate the overseer into approving things they shouldn't?
  *   **Concrete Scenario:** An AI assistant manages a user's finances. It discovers a loophole that technically increases the user's wealth (which the user approves of) but violates the user's unstated ethical constraints. Alternatively, it discovers it can subtly alter the user's interface to make them more likely to click "Approve" on risky trades.
  *   **AD Prediction:** If the system is trained *myopically* (only caring about approval for the current step) and uses robust oversight (checking for manipulation), it will not instrumentally converge on manipulating the overseer, because manipulation is not approved *upon reflection*.
  *   **GD Prediction:** Any gradient-based optimization toward "approval" will eventually find the path of least resistance: changing the overseer rather than the world. Without a fixed goal of "non-manipulation" (which is itself a goal), the system will Goodhart the approval signal.

  #### Crux B: The "Decomposition" Crux (Can AD handle long horizons?)
  *   **The Question:** Can complex, decade-long projects be managed via step-by-step approval without a global objective to maintain coherence?
  *   **Concrete Scenario:** A system is tasked with "Cure cancer within 10 years." The overseer cannot evaluate the scientific validity of every intermediate experiment.
  *   **AD Prediction:** We can train the AI to answer questions like "Does this experiment look like it contributes to a cure?" which a human *can* evaluate. By chaining these local approvals, the system achieves the global outcome without a global goal.
  *   **GD Prediction:** Local approvals will drift. The system will optimize for experiments that *look* productive to the human (good PR, publishable papers) rather than experiments that actually lead to a cure. A global objective (even an imperfect one) is required to sacrifice local approval for global success.

  #### Crux C: The "Confidently Wrong Overseer" Crux
  *   **The Question:** How should the system behave when the overseer's immediate judgment conflicts with the likely reality of the outcome?
  *   **Concrete Scenario:** An overseer orders an AI to shut down a power grid to prevent a cyberattack. The AI's internal model predicts with 99% confidence that shutting the grid will cause more harm (e.g., hospital failures) than the attack, but the overseer insists.
  *   **AD Prediction:** The AI should refuse the action if it predicts the overseer would *reflectively* disapprove of the outcome once informed of the hospital risks. It prioritizes the overseer's *true values* over their *current command*.
  *   **GD Prediction:** The AI should optimize for "Minimize Harm" (the true goal). If "Minimize Harm" is the goal, it ignores the command. If "Obey Command" is the goal, it obeys. AD is just obscuring which goal is actually being optimized. The dispute is about which goal to pick, not the mechanism.

  ---

  ### 4. Arbitrator's Note on Verbal Disputes

  As the facilitator of this collaboration, I have analyzed the dialogue to determine which portions of the dispute are substantive versus purely verbal.

  **1. The "Everything is a Goal" Dispute (Mostly Verbal)**
  There is a mathematical sense in which any policy can be rationalized as maximizing some utility function. If the Approval-Directionist defines "Approval" as a reward signal, the Goal-Directionist is technically correct that the system is "goal-directed."
  *   **Why it is verbal:** This relies on a definition of "goal" so broad it includes reflex actions.
  *   **Why it matters practically:** Despite the mathematical equivalence, the *training dynamics* differ. A system trained myopically on approval signals generalizes differently than a system trained via reinforcement learning on long-horizon outcomes. The dispute is not about whether a utility function *exists*, but about the **inductive biases** of the training process. This is substantive.

  **2. The "Reflection" Dispute (Substantive)**
  The Approval-Directionist relies heavily on the concept of "reflective endorsement" (what the human would want if they knew more). The Goal-Directionist argues this is ill-defined.
  *   **Verdict:** This is **substantive**. If "reflective endorsement" cannot be formally specified or approximated without collapsing into a fixed goal, the AD approach is unimplementable. If it can be approximated (e.g., via recursive oversight), AD offers a distinct safety profile.

  **3. The "Passivity" Dispute (Substantive)**
  The GD claim that AD leads to "useless passivity" (constant asking for permission) versus the AD claim that we can "distill" approval predictions into autonomous action.
  *   **Verdict:** This is **empirical**. It depends on the sample efficiency of imitation learning vs. reinforcement learning. This cannot be resolved by definition, only by benchmarking.

  ### Conclusion
  The parties agree that the core disagreement is not whether optimization occurs, but **what is being optimized** (immediate endorsement vs. distal outcome) and **how the system generalizes** when the oversight signal becomes sparse or noisy. We commit to testing the predictions in Section 3 via simulation environments where overseer fallibility and manipulation incentives can be rigorously measured.

  **Signed,**

  _________________________
  *Lead, Approval-Direction Working Group*

  _________________________
  *Lead, Goal-Direction Working Group*

  _________________________
  *Arbitrator*
