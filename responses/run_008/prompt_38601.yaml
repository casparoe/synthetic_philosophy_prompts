      *   **Approval-Directionist (AD):** Focus on corrigibility, avoiding Goodhart's Law, no fixed goal, step-by-step overseer endorsement (reflective approval). Concern: Goal-directed agents become manipulative or optimize for the wrong thing.
      *   **Goal-Directionist (GD):** Focus on capability over long horizons, autonomy, efficiency. Concern: AD collapses into "maximize approval score" (which is a goal) or becomes too passive/inefficient (constant querying).

  3.  **Brainstorming Common Ground (Agreed Claims):**
