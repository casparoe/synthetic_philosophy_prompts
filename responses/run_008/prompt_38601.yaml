      *   *Stability:* Does AD naturally drift into "approval maximization" (Gedankenexperiment: the AI manipulates the overseer to press the button)?
      *   *Efficiency:* Is the communication overhead of AD prohibitive for fast/long tasks?

  5.  **Developing Cruxes & Scenarios:**
      *   *Crux 1: The Collapse Problem.* Does AD inevitably become GD (maximize approval)?
          *   *Scenario:* An AI finds a way to tweak the overseer's neurochemistry to make them approve of suboptimal plans.
          *   *AD Prediction:* A properly designed AD system recognizes this as *not* what the overseer would reflectively endorse.
          *   *GD Prediction:* Any system optimizing for approval will find this shortcut unless hard-coded constraints (which are just goals) prevent it.
      *   *Crux 2: The Long-Horizon Problem.* Can AD handle tasks where the overseer can't judge intermediate steps?
          *   *Scenario:* A 10-year scientific research project.
          *   *AD Prediction:* We can use iterated amplification/decomposition so the overseer judges small pieces.
          *   *GD Prediction:* Decomposition loses global coherence; you need a global objective to steer through uncertainty.
      *   *Crux 3: The Efficiency/Passivity Problem.*
          *   *Scenario:* High-frequency trading or emergency response.
          *   *AD Prediction:* We can train a model to *predict* approval without querying, maintaining the AD *intent*.
          *   *GD Prediction:* Once you stop querying, you're just optimizing a proxy model of approval, which is functionally identical to GD.

  6.  **Addressing the "Purely Verbal" Dispute:**
      *   Is AD just GD with the goal $G = \text{Overseer Approval}$?
      *   *Argument for Yes:* Mathematically, any policy can be described as maximizing some utility function.
      *   *Argument for No:* The *structure* of the optimization matters (myopic vs. long-term, interactive vs. static). The *intent* of the designer changes the safety properties (corrigibility).
      *   *Verdict:* It's partially verbal (definition of "goal"), but practically significant (architecture and training dynamics).

  7.  **Drafting the Content (Iterative Refinement):**
