      *   Both agree that long-horizon tasks are necessary for usefulness.
      *   Both agree that "approval" needs to be defined carefully (not just a button press).

  4.  **Brainstorming Residual Disagreements:**
      *   *Architecture:* Should the objective function be explicit (GD) or implicit/interactive (AD)?
