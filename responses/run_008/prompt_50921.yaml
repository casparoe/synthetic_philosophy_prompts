      *   **Context:** Three evenings of arguing, ended in stalemate. The user has developed a "working hypothesis" about *why* they stalled (the "victim's-eye" vs. "archivist's-eye" distinction).
      *   **Task:** Evaluate the user's hypothesis. Diagnose the *kind* of disagreement this is (verbal, substantive/metaphysical, or methodological/research program). Do *not* simply adjudicate the debate (i.e., don't say who is right). Do *not* give a survey of the literature. Ground the diagnosis in the specific moves traded (deprivation framing, symmetry, betrayal analogy, narrative value).
      *   **Goal:** Determine what counts as progress (sharper distinction, intuition pump, formal account, or acceptance of steady-state disagreement).

  2.  **Deconstruct the User's Hypothesis:**
