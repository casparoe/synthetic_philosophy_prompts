answer: |-
  ### The principle, stated precisely

  Retroactive criminal punishment is morally permissible if and only if two conditions are met. First, the **Conduct Condition**: the act must have violated a peremptory norm of human morality (a fundamental human right) recognizable as such by common moral consciousness at the time, irrespective of positive law authorization. Second, the **Liability Condition**: the actor's individual criminal liability for this violation must have been foreseeable to a reasonable moral agent, distinct from the state's international responsibility. This principle permits punishment where conduct is *malum in se* and personal culpability is clear, but forbids it where conduct is *malum prohibitum* or where individual criminality was genuinely contested among legal experts at the time. It prioritizes the *nullum crimen* safeguard against tyranny while allowing natural law overrides for gross human rights violations where fair warning of personal guilt exists.

  ### The work each clause does

  The Conduct Condition separates the tyrannical from the justified by filtering for moral content. It excludes Case (4) (tax avoidance) because circumventing fiscal statutes violates no fundamental human right recognizable by common morality; punishing this retroactively is purely instrumental coercion, lacking the moral gravity required to override legal certainty. It includes Case (1) (Nuremberg atrocities) and Case (3) (border guards) because killing unarmed civilians violates the basic right to life, a norm accessible to any moral agent regardless of statutory license. This clause ensures that retroactivity is reserved for acts that shock the conscience, not merely regulatory breaches.

  The Liability Condition is the critical filter between Case (3) and Case (2), addressing your specific scruple about discernibility. In Case (3), while the statute licensed the shooting, the reasonable agent knows that "following orders" does not erase personal liability for murder; individual culpability is foreseeable despite the legal order. In Case (2) (aggressive war), while war might be morally wrong, the transition from state wrong to *individual criminal liability* was genuinely contested among international lawyers in the 1940s. A reasonable agent could not foresee hanging for executing state policy where the legal personality of the state was the traditional subject of liability. Thus, the principle vindicates the intuition that Nuremberg's atrocity counts differ from Tokyo's peace counts, not based on the venue, but on the foreseeability of personal criminalization for the specific wrong. It protects the core of *nullum crimen sine lege*—fair warning of personal penal consequence—while allowing natural law overrides for gross human rights violations. This prevents the principle from collapsing into a simple "morality wins" rule that would justify punishing the tax avoiders if public outrage were high enough.

  ### Predictions

  1.  **Non-signatory Aggressors:** Officials of a state that never renounced war and whose leadership sincerely doubted individual criminality. *Verdict:* Unjustified. This fails the Liability Condition. If the legal community was divided on whether individuals could be held liable for state aggression, a reasonable agent lacks fair warning. Punishing them would be victors' justice, imposing a new legal standard retroactively without moral foreseeability.
  2.  **1950s Medical Experiments:** A scientist running non-consensual experiments on institutionalized patients, lawful then. *Verdict:* Justified. This satisfies the Conduct Condition (violation of bodily integrity and autonomy) and the Liability Condition. Any reasonable moral agent knows that experimenting on humans without consent incurs personal culpability, regardless of professional norms or statutory permission. The moral wrong is discernible without legal expertise.
  3.  **Retroactive Insider Trading:** Prosecuting traders for conduct before securities laws existed. *Verdict:* Unjustified. This fails the Conduct Condition. Insider trading is a regulatory wrong regarding market fairness, not a violation of fundamental human rights recognizable by common morality. Retroactive punishment here undermines the rule of law for mere economic coordination.

  ### What must go

  To maintain this principle, you must accept that some morally culpable actors escape criminal punishment. Specifically, you must stand by your verdict on Case (2) even against pressure to condemn aggressive war planners criminally. The principle cannot accommodate a verdict that punishes aggressive war retroactively if individual liability was genuinely contested. However, this is not a bug but a feature: it preserves the rule of law's constraint on victors' justice. The complexity cost is low; the principle is not conjunctive ad hocery but a unified theory of fair warning grounded in moral foreseeability. If you feel compelled to punish the aggressive war planners, you must abandon the Liability Condition, but doing so collapses the distinction between (2) and (4), risking the tyranny you wish to avoid. You must sacrifice the desire to criminalize all grave political wrongs retroactively to save the shield against retroactive criminalization of ordinary conduct.

  ### The ministry lawyer

  Case (5) is justified. The wavering stems from conflating the lawyer's act (drafting) with the aggressive war count (abstract policy). But the lawyer drafted deportation regulations facilitating atrocities, not merely war strategy. Under the Conduct Condition, deportation to death camps violates fundamental human rights. Under the Liability Condition, aiding and abetting murder is foreseeably culpable for a reasonable agent, even if the immediate killer is another. The lawyer is not punished for "making law" retroactively, but for complicity in *malum in se* crimes. The defense that his signature "made nothing legal that was not legal already" fails because the underlying conduct was never morally legal, only positively authorized. Punishing him is continuous with punishing the guards, not the aggressive war planners. He facilitated the specific, foreseeable harm to identifiable persons that triggers the exception to *nullum crimen*.
