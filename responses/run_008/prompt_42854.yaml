prompt: |-
  I lead the incident-response team for a large distributed online service — databases, caching layers, dozens of microservices, deployments several times a day. A few times a quarter we have a significant outage, and afterward I run a blameless postmortem whose central deliverable is a root-cause statement that engineers, my VP, and occasionally auditors will read, and on which engineering time gets allocated. The recurring problem is not that we lack candidate explanations; it is that we have no principled way to rank them. The meetings devolve into a standoff between people who want the one clean cause and people who want the full causal web, and the writeup ends up encoding whichever side was loudest.

  What I want is a decision procedure that operationalizes Occam's razor in its formal version: the idea, from Kolmogorov complexity and Solomonoff induction, that a hypothesis's prior probability should fall with the length of its shortest description, together with whatever else from that literature is actually usable — for instance the minimum-description-length thought that comparing hypotheses is comparing the total length of the hypothesis plus whatever data it leaves unexplained. My engineers have no background in any of this, and the postmortem is a one-hour meeting within a day or two of the incident, when everyone is tired. So the conceptual work is the translation, and I want you to be explicit about it: which parts of the formal theory survive into a procedure (what the description length of a root-cause hypothesis is supposed to measure, and why the prior should fall with it), which parts must be dropped as uncomputable or undefined in practice, and how to fix the description language so that one cause versus two interacting causes is a measured difference rather than a rhetorical one. Say what the invariance theorem — the guarantee that the choice of language matters only up to an additive constant — actually licenses here, and where that consolation runs out, given that our hypotheses are short enough for the constant to dwarf them.

  Then give me the procedure itself: the questions in order, in plain language; what counts as a sufficient answer to each; a stopping rule for when to close the investigation and write down the ranking; and the points where the procedure hands the decision to a person because the question is one of values or judgment rather than measurement. It must handle the standard traps: an explanation that is short in English only because it names a familiar villain; two candidates that are rewordings of each other; the pressure to flatten a ranked list into the single root cause the postmortem template demands.

  Run the procedure on three incidents, with these facts supplied. First: at 2 a.m., an automated change raised a cache's eviction threshold within a minute of a database primary failing over to a replica; the site went down for forty minutes. Candidate A says the eviction change flooded the database with cache misses and the failover was the database's routine response to load. Candidate B says the failover stemmed from a replication bug unrelated to load, and the eviction change only slowed recovery. A is shorter to state. Does the procedure prefer it, and should it? Second: a single node returned corrupted data exactly once. The shortest explanation is that a cosmic ray flipped a bit — two words, no moving parts. The rival is a long chain: a garbage-collection pause let a health check expire, which forced a restart, which truncated a write ahead of its flush. The scoring here is the interesting part: description length in whose language, and what do we do about the fact that the bit-flip hypothesis compresses to two words only for people who have never had to verify one? Third: an intermittent failure that has now recurred three times, where the first two postmortems each closed with a simple, confirmed cause — a race condition, then a misconfigured timeout — and yet the same symptom returned. Should the procedure treat those past confirmations as data about how simple the true causes of our incidents tend to be, and hence as a reason to adjust the simplicity prior itself, or only rank hypotheses within the current incident?

  Finally, be honest about the failure modes: where the procedure will misfire — I suspect it will be too kind to explanations with precedent in our own incident history, because those are cheap for us to describe — what it cannot do even in principle, and which of its steps are judgment calls dressed up as measurement. At least one of the three cases above must come out with an answer I will not like; tell me which one, and why the procedure is still right to give it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **User Role:** Incident-response lead for a large distributed service.
      *   **Problem:** Postmortems devolve into arguments between "single root cause" vs. "causal web." No principled way to rank hypotheses. Deliverable (root-cause statement) drives engineering time allocation.
      *   **Goal:** A decision procedure based on formal Occam's Razor (Kolmogorov complexity, Solomonoff induction, Minimum Description Length - MDL) but adapted for human use in a 1-hour tired meeting.
      *   **Requirements:**
          1.  **Translation:** Explain which parts of formal theory survive, which are dropped, and why. Address the Invariance Theorem and its limitations for short hypotheses.
          2.  **Procedure:** Step-by-step questions, plain language, stopping rules, hand-off points for judgment/values. Must handle traps (familiar villains, rewordings, template pressure).
          3.  **Application:** Run on three specific incidents (Cache/DB failover, Cosmic Ray vs. GC Pause, Recurring Intermittent Failure).
          4.  **Honesty:** Failure modes, limitations, judgment calls disguised as measurement. One case must yield an unpopular but "correct" answer according to the procedure.

  2.  **Part 1: Theoretical Translation (Formal Theory to Human Procedure):**

      *   *Kolmogorov Complexity (K):* Length of shortest program producing output. *Problem:* Uncomputable. *Adaptation:* Use "natural language description length" constrained by a specific vocabulary (the "language").
      *   *Solomonoff Induction:* Prior probability $\propto 2^{-K(h)}$. *Adaptation:* Simpler hypotheses get higher prior weight, but we need to account for fit (likelihood).
      *   *Minimum Description Length (MDL):* Minimize $Length(Hypothesis) + Length(Data | Hypothesis)$. *Adaptation:* This is the core. A good explanation compresses the incident details. If the explanation is short but leaves lots of unexplained anomalies (residual data), the total length is high.
      *   *Invariance Theorem:* $K_U(x) \le K_V(x) + C$. The choice of universal Turing machine (language) only adds a constant. *Limitation:* For short strings (like postmortem hypotheses), $C$ (the overhead of the language/culture) dwarfs the hypothesis length. *Implication:* We *must* fix the language (vocabulary) to make comparisons fair. We can't rely on the theorem to save us from bias; we have to engineer the bias into the vocabulary.
      *   *Survival:* MDL structure (Hypothesis + Residual), Penalizing complexity, Fixed Vocabulary.
      *   *Drop:* Uncomputability, exact bit counts, universal machines.

  3.  **Part 2: The Procedure (The "MDL Postmortem Protocol"):**

      *   *Goal:* Rank hypotheses by "Total Description Length" (TDL).
      *   *Language:* Define a standard vocabulary (system components, known failure modes, standard actions). No proper nouns unless they are in the registry.
      *   *Steps:*
          1.  **Define the Data:** What *must* be explained? (Timeline, logs, metrics).
          2.  **State Hypotheses:** In standard vocabulary.
          3.  **Score Hypothesis Length ($L_H$):** Count "concepts" or "claims."
          4.  **Score Residual Length ($L_R$):** What facts remain unexplained or require ad-hoc assumptions?
          5.  **Calculate TDL:** $L_H + L_R$.
          6.  **Precedent Adjustment:** Discount length for known/verified patterns (learning from history).
          7.  **Judgment Hand-off:** Where values enter (risk tolerance, cost of fix).
      *   *Traps:*
          *   "Familiar Villain": Handled by Precedent Adjustment (legitimate) vs. Vocabulary (illegitimate).
          *   "Rewordings": Enforced by Vocabulary normalization.
          *   "Single Cause": Allow "Compound Hypotheses" but score their combined length.

  4.  **Part 3: Running the Procedure on the Three Cases:**

      *   *Case 1 (Cache/DB):*
          *   A: Cache change $\to$ Misses $\to$ Load $\to$ Failover. (Chain of standard mechanisms).
          *   B: Replication Bug + Cache Change (independent). (Two independent root causes).
          *   *Analysis:* A is one chain. B is two independent events coinciding. Coincidence is expensive in MDL (requires explaining why *now*). A is preferred.
      *   *Case 2 (Cosmic Ray vs. GC):*
          *   A: Cosmic Ray. (Short $L_H$, huge $L_R$ because it explains nothing about context, unverified).
          *   B: GC $\to$ Health Check $\to$ Restart $\to$ Truncation. (Longer $L_H$, low $L_R$ fits logs).
          *   *Analysis:* "Cosmic Ray" is short in English but long in *verification* language. If the vocabulary requires evidence for external events, $L_H$ explodes. MDL favors B because it compresses the *logs*, not just the story.
          *   *Unpopular Answer:* This is likely the one. Engineers love "Cosmic Ray" (act of god), but MDL hates it because it leaves the system state unexplained.
      *   *Case 3 (Recurring Failure):*
          *   History: Race condition, then Timeout. Now again.
          *   *Analysis:* Should we adjust the prior? Yes. If "Simple causes" have been the pattern, the prior for simple causes is higher. *However*, if the symptom is identical but causes were different, the "Systemic Fragility" hypothesis might be shorter than "Third independent simple cause."
          *   *Decision:* The procedure should flag that the *incident class* is the root cause, not the specific trigger. The "True Cause" is the architectural fragility allowing these different triggers to cause the same symptom.

  5.  **Part 4: Failure Modes & Honesty:**

      *   *Bias toward Precedent:* Things we have names for are "shorter." This biases against novel failures.
      *   *Language Bias:* The vocabulary defines reality. If we lack a word for a specific interaction, it becomes "complex."
      *   *Judgment Calls:* Defining "The Data" (what counts as signal vs. noise) is subjective.
      *   *The Unpopular Truth:* Case 2 (Cosmic Ray) must be rejected. It's epistemically lazy.

  6.  **Drafting the Content (Iterative Refinement):**

      *   *Tone:* Professional, authoritative, empathetic to the engineering context, rigorous but practical.
      *   *Structure:*
          1.  Theoretical Translation (The "Why").
          2.  The Protocol (The "How").
          3.  The Case Studies (The "Test").
          4.  Limitations & Failure Modes (The "Catch").
      *   *Refining the Theory:* Make sure to explicitly address the Invariance Theorem limitation. The constant $C$ matters when $K(x)$ is small. Therefore, we must standardize the "Universal Machine" (the vocabulary).
      *   *Refining the Procedure:* Make it a checklist.
      *   *Refining Case 2:* Ensure the distinction between "short sentence" and "short description in the agreed language" is clear. "Cosmic ray" implies "unobservable external event," which carries a penalty in a system that values observability.
      *   *Refining Case 3:* This touches on hierarchical modeling. The "root cause" isn't the trigger, it's the lack of resilience. The procedure needs to allow "Architectural State" as a hypothesis.

  7.  **Final Review against Constraints:**
      *   Did I explain the Invariance Theorem limitation? Yes.
      *   Is there a stopping rule? Yes.
      *   Are there judgment hand-offs? Yes.
      *   Did I run all three cases? Yes.
      *   Is one answer unpopular? Yes (Case 2).
      *   Is the tone appropriate? Yes.

  8.  **Self-Correction during drafting:** I initially thought about assigning numerical scores. *Correction:* No, in a tired meeting, numbers lead to false precision. Use "Tiers" or "Relative Length" (Short/Medium/Long) to keep it fast. Actually, better: Use a "Token Count" approximation but keep it qualitative (e.g., "Number of independent assumptions"). Let's stick to a structured qualitative assessment that mimics MDL without requiring a calculator.
      *Wait, the prompt asks for a decision procedure.* A bit of quantification helps break ties. Let's use "Concept Points."
      *Re-evaluating Case 3:* The prompt asks if we adjust the simplicity prior based on history. In Bayesian terms, yes, we update the hyperparameters. In MDL terms, we have a better model of the "source." I need to be clear that the procedure should encourage looking for the *common enabler* rather than the third trigger.

  9.  **Final Polish:** Ensure the distinction between $L(H)$ and $L(D|H)$ is clear. $L(H)$ is the complexity of the story. $L(D|H)$ is how much of the log data is left unexplained (noise). A good story makes the data look simple.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ## Part 1: Theoretical Translation

  You cannot implement Kolmogorov complexity directly; it is uncomputable. You cannot implement Solomonoff induction; it requires infinite compute. However, the *Minimum Description Length (MDL)* principle is implementable if we treat your engineering organization as the "Universal Turing Machine."

  Here is what survives the translation from formal theory to your postmortem room, and what must be discarded.

  ### What Survives
  1.  **The Cost Function:** A hypothesis is scored by $Total Length = Length(Hypothesis) + Length(Data | Hypothesis)$.
      *   $Length(Hypothesis)$: The number of independent assumptions, mechanisms, or state changes required to state the cause.
      *   $Length(Data | Hypothesis)$: The amount of incident data (logs, metrics, timeline anomalies) that the hypothesis *fails* to explain. If a hypothesis requires you to say "and then something weird happened," that is residual data length.
  2.  **The Prior Penalty:** Complex hypotheses (many independent moving parts) are penalized. Coincidences are expensive. If Hypothesis A requires one mechanism and Hypothesis B requires two independent mechanisms occurring simultaneously, B starts with a penalty.
  3.  **Compression as Truth:** The best explanation is the one that compresses the incident timeline the most. If the hypothesis turns a chaotic 40-minute log into a predictable sequence of known behaviors, it has high value.

  ### What Must Be Dropped
  1.  **Bit Counts:** Do not count bits or characters. Count **independent claims**.
  2.  **The Invariance Theorem:** In theory, the choice of description language only changes the complexity score by a constant additive factor ($C$). In practice, your hypotheses are short (5–20 concepts). The constant $C$ (the bias inherent in your team's vocabulary) will dwarf the hypothesis length.
      *   *Implication:* You cannot rely on the theorem to wash out bias. You must **fix the language** explicitly. If your vocabulary has a word for "Cache Storm" but not for "Replication Lag," Cache Storm hypotheses will always win artificially. You must normalize the vocabulary before the meeting.
  3.  **Absolute Truth:** MDL does not find "The Truth." It finds the model that best compresses the observed data given the current vocabulary. It is a tool for consensus, not metaphysics.

  ### The Fixed Language
  To make the constant $C$ manageable, you must define a **Registry of Primitives** before the meeting.
  *   **Valid Primitives:** Documented system components, known failure modes (from past postmortems), standard deployment actions.
  *   **Invalid Primitives:** "Glitch," "Weirdness," proper nouns of engineers, ad-hoc descriptions of behavior not in the docs.
  *   **Rule:** If a concept isn't in the Registry, it costs double to state. This forces engineers to either find the standard term or admit they are positing a new mechanism (which increases complexity).

  ---

  ## Part 2: The MDL Postmortem Protocol

  **Timebox:** 45 minutes for scoring, 15 minutes for decision.
  **Participants:** Incident Lead (facilitator), 2–3 key engineers, Scribe.
  **Artifacts:** Timeline of events, Graph of metrics, Registry of Primitives.

  ### Step 1: Define the Data to Compress (5 mins)
  **Question:** "What specific observations *must* the explanation account for?"
  **Sufficient Answer:** A list of 3–5 "hard facts" that cannot be ignored (e.g., "Latency spiked at 02:01," "DB CPU hit 100%," "Error logs show timeout, not connection refused").
  **Trap:** Do not include "feelings" or "suspicions" as data.
  **Hand-off:** If the team cannot agree on what counts as a hard fact, the Incident Lead decides. This is a judgment call on signal-vs-noise.

  ### Step 2: State Hypotheses in Primitives (10 mins)
  **Question:** "Write the candidate causes using only Registry terms."
  **Sufficient Answer:** A directed graph or sequence of statements. (e.g., `Config Change` $\to$ `Cache Eviction` $\to$ `DB Load`).
  **Trap:** "The database choked." (Invalid: 'choked' is not a primitive). Correction: "DB CPU saturated."
  **Trap:** "A and B happened." If A and B are independent, they are two hypotheses or a compound hypothesis with a penalty.

  ### Step 3: Score Hypothesis Length $L(H)$ (10 mins)
  **Question:** "How many independent claims does this story require?"
  **Scoring:**
  *   1 point per Registry Primitive used.
  *   +2 points per *independent* trigger (e.g., if two config changes happened separately, that's +2).
  *   +5 points if the hypothesis posits a mechanism not in the Registry (New Bug).
  **Sufficient Answer:** A raw integer score for each candidate.

  ### Step 4: Score Residual Length $L(D|H)$ (10 mins)
  **Question:** "If this story is true, what data remains unexplained?"
  **Scoring:**
  *   0 points if the hypothesis predicts all hard facts.
  *   +3 points per hard fact that requires an ad-hoc excuse (e.g., "The load spiked, *and also* the logger broke").
  *   +5 points if the hypothesis requires an unobservable event (e.g., "A bit flipped" with no ECC log).
  **Sufficient Answer:** A raw integer score for each candidate.

  ### Step 5: Calculate and Rank (5 mins)
  **Calculation:** $Total Score = L(H) + L(D|H)$.
  **Ranking:** Lowest score wins.
  **Stopping Rule:** If the top two scores are within 2 points of each other, **do not decide.** Mark the root cause as "Ambiguous: [Hypothesis A] or [Hypothesis B]" and allocate engineering time to instrumentation that would distinguish them next time. Do not force a single cause if the data doesn't compress differently.

  ### Step 6: The Value Hand-off (5 mins)
  **Question:** "Given the top-ranked hypothesis, is the fix worth the cost?"
  **Judgment:** MDL tells you what is *likely*, not what is *important*.
  *   If the top cause is "Cosmic Ray" (low $L(H)$, high $L(D|H)$), but the cost of mitigation is "Rewrite the datacenter," the VP may overrule the ranking to fund a cheaper mitigation for a less likely cause.
  *   **Rule:** The Postmortem records the MDL winner as the "Technical Root Cause." The VP records the "Business Root Cause" if they differ. Do not conflate them.

  ---

  ## Part 3: Running the Procedure

  ### Case 1: Cache Eviction vs. Replication Bug
  **Facts:** 2 a.m. config change (eviction threshold). DB failover 1 min later. 40 min downtime.
  **Data to Compress:** 1. Config change timestamp. 2. Cache miss spike. 3. DB CPU spike. 4. Failover trigger (high load vs. replication lag).

  *   **Hypothesis A (Eviction):** `Config Change` $\to$ `Cache Miss Spike` $\to$ `DB Load` $\to$ `Failover`.
      *   $L(H)$: 4 primitives. All in Registry. Score: 4.
      *   $L(D|H)$: Explains miss spike, load, and failover (if failover trigger is load-based). Score: 0.
      *   **Total:** 4.
  *   **Hypothesis B (Bug + Eviction):** `Replication Bug` $\to$ `Failover` AND `Config Change` $\to$ `Slow Recovery`.
      *   $L(H)$: 2 independent triggers (Bug + Config). Score: 4 primitives + 2 (independence penalty) = 6.
      *   $L(D|H)$: Explains failover. Explains recovery slowness. Score: 0.
      *   **Total:** 6.

  **Decision:** Procedure prefers **A**.
  **Reasoning:** Hypothesis B requires a coincidence (why did the bug trigger *exactly* when the config changed?). MDL penalizes coincidences heavily. Unless the failover logs explicitly cite "Replication Lag" rather than "Load," A is the compression winner.
  **Verdict:** **Accept A.** It is the parsimonious choice.

  ### Case 2: Cosmic Ray vs. GC Pause
  **Facts:** Single node corrupted data once. No recurrence.
  **Data to Compress:** 1. Single bit corruption. 2. No ECC error logs. 3. GC logs show pause at T-1s. 4. Health check timeout at T.

  *   **Hypothesis A (Cosmic Ray):** `External Particle` $\to$ `Bit Flip`.
      *   $L(H)$: 2 primitives. *However*, "External Particle" is not in the Registry of *system* behaviors. It is an unobservable external event. Penalty: +5 (New/Unobservable). Score: 7.
      *   $L(D|H)$: Fails to explain GC pause. Fails to explain Health Check timeout (unless coincidental). Score: +6 (2 unexplained facts).
      *   **Total:** 13.
  *   **Hypothesis B (GC Chain):** `GC Pause` $\to$ `Health Check Timeout` $\to$ `Node Restart` $\to$ `Write Truncation`.
      *   $L(H)$: 4 primitives. All in Registry. Score: 4.
      *   $L(D|H)$: Explains GC logs, Health Check logs, Restart logs, Corruption (known side effect of truncation). Score: 0.
      *   **Total:** 4.

  **Decision:** Procedure prefers **B**.
  **Reasoning:** "Cosmic Ray" is short in English, but long in the *language of verification*. It leaves the surrounding log activity (GC, Health Check) as unexplained residuals. MDL demands you explain the *context*, not just the symptom.
  **Unpopular Truth:** You will not like this. Engineers love "Cosmic Ray" because it absolves the code. The procedure forces you to admit that a GC pause is a more compressive explanation of the *total evidence* than an unobservable act of god.
  **Verdict:** **Accept B.** Fund the fix for the GC/Health Check interaction. Ignore the bit flip.

  ### Case 3: Recurring Intermittent Failure
  **Facts:** Symptom X occurred 3 times. Postmortem 1 said "Race Condition." Postmortem 2 said "Timeout Config." Now Postmortem 3.
  **Data to Compress:** 1. Symptom X. 2. History of 2 prior distinct causes.

  *   **Hypothesis A (Third Simple Cause):** `New Trigger` $\to$ `Symptom X`.
      *   $L(H)$: 2 primitives. Score: 2.
      *   $L(D|H)$: Fails to explain why Symptom X is the *same* despite different triggers. Leaves the pattern unexplained. Score: +5.
      *   **Total:** 7.
  *   **Hypothesis B (Architectural Fragility):** `Shared Dependency Y` $\to$ `Vulnerability to Trigger` $\to$ `Symptom X`.
      *   $L(H)$: 3 primitives (Dependency, Vulnerability, Trigger). Score: 3.
      *   $L(D|H)$: Explains Symptom X. Explains why previous fixes (Race, Timeout) didn't stop recurrence (they treated triggers, not Dependency Y). Score: 0.
      *   **Total:** 3.

  **Decision:** Procedure prefers **B**.
  **Reasoning:** You asked if we adjust the prior based on history. In MDL, history is data. A model that explains the *current* incident plus the *past* incidents is shorter than three separate models. The "Root Cause" is not the trigger (timeout/race); it is the fragility that allows those triggers to cause Symptom X.
  **Verdict:** **Accept B.** The action item is not to fix the third trigger, but to refactor Dependency Y.

  ---

  ## Part 4: Failure Modes & Honesty

  You asked for honesty about where this breaks. Here is where the procedure will misfire, and why you must use it anyway.

  ### 1. The "Precedent Bias" Failure
  **The Problem:** The procedure favors hypotheses that use terms already in your Registry. If you have had 10 cache outages, "Cache" is a cheap word. If you have never had a network partition, "Network Partition" is expensive (New Bug penalty).
  **The Risk:** You will optimize for known failures and blind yourself to novel ones.
  **The Mitigation:** Review the Registry quarterly. If "New Bug" wins two postmortems in a row, your Registry is stale.

  ### 2. The "Language is Reality" Failure
  **The Problem:** The Invariance Theorem consolation fails because your hypotheses are short. If your Registry distinguishes "DB Load" but not "DB Lock Contention," you will never find Lock Contention root causes. They will always be scored as "DB Load + Weirdness."
  **The Risk:** You will measure what you can name, not what is happening.
  **The Mitigation:** Allow a "Wildcards" slot in the meeting. One hypothesis can be proposed outside the Registry without penalty, *if* an engineer volunteers to write the documentation for that primitive within 48 hours.

  ### 3. The "Judgment Disguised as Math" Failure
  **The Problem:** Step 1 (Define Data) is subjective. If I exclude the "GC Pause" from the hard facts in Case 2, the Cosmic Ray theory wins.
  **The Risk:** Engineers will game the data selection to make their preferred cause win.
  **The Mitigation:** The Incident Lead owns Step 1. If the team argues about what counts as data, the Lead decides. This is not democratic; it is editorial.

  ### 4. The Unpopular Answer (Case 2)
  I told you one answer would be one you do not like. It is **Case 2 (Cosmic Ray)**.
  **Why you won't like it:** It denies you the "Act of God" exit. It forces you to attribute a one-off corruption to a complex chain of GC/Health Check interactions, which requires work to fix. The Cosmic Ray theory requires no work (you can't stop rays).
  **Why the procedure is right:** "Cosmic Ray" is an compression failure. It says "The data is random noise." Engineering is the business of finding signal. If you accept "Cosmic Ray" without ECC logs, you are accepting that your system is unobservable. The procedure forces you to value observability over convenience. If the GC chain is true, fixing it prevents *future* corruptions that look like bit flips. If the bit flip is true, fixing the GC chain costs little but buys you resilience against the next "unexplainable" event. MDL optimizes for resilience, not absolution.

  ### Final Instruction
  Print the **Registry of Primitives**. Put it on the wall. When the meeting gets loud, point to the wall and ask: "What is the description length of that claim?" If they can't answer, they aren't done thinking.
