prompt: |-
  I'm on the board of our family foundation (about $400k a year to give away, money from my grandfather's logistics company). We've funded the same local food bank for a decade, and this year my cousin wants to redirect most of that to a tiny org doing policy advocacy for pandemic preparedness. Her argument: even a small chance of preventing a catastrophe outweighs reliably feeding a few hundred families, and anyway we're just as clueless about the long-run ripple effects of the food bank money, so we might as well go for the bigger upside. Half the board is family with zero philosophy background and thinks she's gone full doomsday prepper; the other half quietly agrees with her. I have to circulate the written opinion recommending what we do before next month's meeting. Draft it for me — it needs a concrete recommendation (a split is fine if that's what you think is right), reasons my cousin can actually respond to rather than hand-waving, and it has to take her cluelessness point seriously, because honestly I don't know how to answer it myself. Keep it readable for the non-philosophers on the board.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Family foundation board ($400k/year giving capacity). Legacy from grandfather's logistics company.
      *   **Conflict:** Status quo (local food bank, 10 years) vs. New Proposal (tiny policy advocacy org for pandemic preparedness).
      *   **Proponent (Cousin):** Argues for "longtermism"/existential risk mitigation. Small chance of preventing catastrophe > reliably feeding hundreds. Claims "cluelessness" about food bank long-term effects justifies the gamble.
      *   **Opponents:** Half the board (family, non-philosophers) think she's a "doomsday prepper."
      *   **Supporters:** Half the board quietly agrees with her.
      *   **Task:** Draft a written opinion/memo for circulation before the next meeting.
      *   **Requirements:**
          *   Concrete recommendation (split is okay).
          *   Address cousin's arguments seriously (especially the "cluelessness" point).
          *   Readable for non-philosophers.
          *   Reasons cousin can respond to (substantive, not emotional).

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Stick with Food Bank.* Too dismissive of the cousin's valid philosophical points. Risks alienating the half of the board that agrees with her.
      *   *Option B: Switch to Pandemic Prep.* Too risky for a family foundation. $400k is a drop in the bucket for global policy, but huge for a local food bank. Risks alienating the legacy/trust aspect.
      *   *Option C: A Hybrid/Split Approach.* This is the most pragmatic and governance-sound recommendation. It acknowledges the validity of the risk argument without abandoning the community commitment. It allows for testing the new strategy without burning bridges.
      *   *Decision:* Recommend a 75/25 or 80/20 split in favor of the food bank, with a sunset clause or evaluation metric for the policy grant. This balances legacy, immediate need, and long-term risk.

  3.  **Address the "Cluelessness" Argument:**
      *   The cousin argues: "We don't know the long-term effects of food aid, so why not aim for the high-upside policy win?"
      *   Counter-argument needed: It's not about *knowing* the long-term ripple effects; it's about *probability* and *attribution*.
      *   *Probability:* Feeding a family *definitely* prevents hunger today. Preventing a pandemic via a tiny org is *highly uncertain*.
      *   *Attribution:* With $400k, we are a major funder for the food bank (likely). We are a drop in the ocean for global pandemic policy. Our marginal impact is higher on the former.
      *   *Mission Alignment:* Grandfather's logistics company built local wealth. Giving back locally honors that specific legacy.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension. Validate both sides. State the purpose of the memo.
      *   **The Core Question:** Frame it not as "Heart vs. Head" but "Certainty vs. Scale."
      *   **Addressing the Cousin's Points (The "Cluelessness" Objection):**
          *   Acknowledge the logic (Longtermism).
          *   Counter with "Marginal Impact." $400k matters more locally than globally.
          *   Counter with "Risk Diversification." Don't put all eggs in one basket, even a high-upside one.
      *   **The Legacy Aspect:** Grandfather's logistics business. Local roots.
      *   **Recommendation:** The Split (e.g., 80/20).
      *   **Conditions:** Make the policy grant contingent on specific metrics (not just "advocacy," but tangible milestones).
      *   **Closing:** Call for discussion.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid academic jargon (no "expected utility theory," "moral realism," etc.).
      *   Use analogies (insurance vs. groceries).
      *   Ensure the cousin feels heard (her point is intellectually sound, just maybe practically misaligned for *this* specific pot of money).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the split too cowardly?
      *   *Fix:* Frame it as a "pilot program" for the policy work. It shows willingness to innovate without reckless abandonment of duty.
      *   *Critique:* Did I answer the cluelessness point?
      *   *Fix:* Explicitly section on "The Uncertainty Argument." Differentiate between *unknown good* and *unlikely good*.
      *   *Critique:* Is it readable?
      *   *Fix:* Use bullet points and bold text for key arguments.

  7.  **Final Polish:** Check word count and flow. Ensure the recommendation is unmistakable. (The resulting draft looks good. It balances the philosophical depth with practical governance.)

  8.  **Final Output Generation:** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, [Family Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding 2024 Grant Strategy: Food Security vs. Pandemic Preparedness

  **Executive Summary**

  This year, we face a significant strategic decision. For a decade, our foundation has provided reliable support to [Local Food Bank]. This year, a proposal has been made to redirect the majority of our capital toward [Tiny Policy Org], focused on pandemic preparedness advocacy.

  The argument for the shift is intellectually serious: preventing a global catastrophe has a higher theoretical "upside" than feeding hundreds of families locally. The argument against it is equally serious: our family legacy is rooted in this community, and the certainty of our local impact is far higher than our influence on global policy.

  After reviewing both positions, **I recommend a split allocation: 80% ($320k) to the Food Bank and 20% ($80k) to the Policy Org as a two-year pilot.**

  This approach honors our legacy and immediate community obligations while allowing us to test the high-upside hypothesis without betting the foundation's reputation on a single, unproven grant. Below is the reasoning, specifically addressing the philosophical arguments raised regarding "long-term impact" and "uncertainty."

  ***

  **1. Addressing the "Cluelessness" Argument**

  The strongest point raised in favor of the policy shift is this: *We don't actually know the long-term ripple effects of food aid. Maybe keeping someone fed today doesn't change the world in 100 years. But preventing a pandemic does. Since we are equally "clueless" about the long run, we should bet on the bigger upside.*

  This is a compelling logical framework, but it misses two practical realities of philanthropy: **Marginal Impact** and **Attribution.**

  *   **Marginal Impact:** With $400,000, we are a top-tier partner for the local food bank. Our check directly determines how many families eat. In the world of global pandemic policy, $400,000 is a rounding error. We are not buying the vaccine; we are buying a fraction of a staffer's time to write a brief that *might* be read by a policymaker. Our money goes much further locally than globally.
  *   **Attribution:** If the food bank succeeds, we know we helped. If a pandemic is prevented (or mitigated) in the future, it will be the result of thousands of actors (governments, WHO, big foundations). Our specific contribution would be indistinguishable. For a family foundation, maintaining a clear line between our resources and our impact is vital for governance and family cohesion.

  **2. Risk Diversification (The "All-In" Problem)**

  The proposal asks us to move from a "low variance" strategy (guaranteed local good) to a "high variance" strategy (tiny chance of massive good, high chance of zero impact).

  In finance, we never put 100% of a portfolio into a venture capital-style bet, no matter how high the theoretical return. We should treat our social capital the same way. Abandoning the food bank after 10 years creates reputational risk and community harm if the policy bet doesn't pan out. A split portfolio allows us to capture some upside potential without exposing the foundation to total strategic failure.

  **3. Legacy and Mission Alignment**

  Our capital comes from Grandfather's logistics company. That business succeeded by moving goods reliably, locally, and building trust in this specific region.

  *   **The Food Bank** aligns with the "logistics" legacy: moving resources efficiently to neighbors in need. It honors the source of the wealth.
  *   **The Policy Org** is abstract. While important, it disconnects the foundation from the geographic roots of our wealth.

  Philanthropy is not just about math; it is about stewardship. Stewardship implies maintaining the health of the community that sustained the family business. Abruptly leaving that community to chase a global abstract good risks fracturing the family's relationship with its own history.

  ***

  **Recommendation: The 80/20 Pilot**

  I propose we vote on the following allocation for the 2024 fiscal year:

  1.  **$320,000 to [Local Food Bank]:** This maintains our status as a key partner, ensuring we do not create a funding cliff for an organization that relies on us.
  2.  **$80,000 to [Tiny Policy Org]:** This is a significant grant for a small organization, giving us real leverage and attention, rather than being a drop in the ocean.

  **Conditions for the Policy Grant:**
  To address the concern that this money might vanish into "overhead," the $80k grant should be structured as a two-year pilot with specific milestones, such as:
  *   Production of specific policy briefs.
  *   Meetings with identified legislative targets.
  *   A clear report on how our funds specifically enabled an outcome that wouldn't have happened otherwise.

  **Why this works:**
  *   **For the "Status Quo" Board Members:** We are not abandoning the community or our grandfather's legacy. The bulk of our money remains where we know it works.
  *   **For the "Policy" Board Members:** We are acknowledging the validity of the long-term risk argument. We are putting real money on the table to test the hypothesis. If the Policy Org delivers tangible results in two years, we can revisit the split in 2026.
  *   **For the Foundation:** We diversify our risk. We remain locally relevant while exploring global impact.

  **Next Steps**

  I ask that everyone review this framework before our meeting on [Date]. I specifically invite [Cousin's Name] to critique the "Marginal Impact" argument above. If she can demonstrate that $80k will have more tangible leverage in policy than $320k has in food security, we can adjust the split.

  Let's go into the meeting ready to vote on a strategy that respects both our heads and our hearts.

  [Your Name]
  Board Member, [Family Foundation Name]
