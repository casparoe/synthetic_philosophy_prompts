answer: |-
  It is a pleasure to meet a colleague who understands that the kidney doesn't care about your ontology, but the patient certainly does. You are right to be suspicious of the literature; half of it is conceptual housekeeping that ignores the messiness of the ward.

  You asked for a spec, not a survey. Below is a brainstormed specification for a theory of disease. I have accepted most of your premises but pushed back on two where I think you are asking for a unified theory to do work that belongs to policy or biology. I have also added two requirements that are critical for the theory to actually *work* in a medical context.

  ### The Specification: 7 Desiderata for a Theory of Disease

  **1. Evolutionary Coherence without the Naturalistic Fallacy**
  *   **Motivating Case:** Type 2 diabetes in a sedentary population: the insulin resistance is a "normal" response to caloric surplus (thrifty genotype), but it kills the host.
  *   **Requirement:** The theory must identify dysfunction without equating "selected-for" with "healthy." It must allow that a mechanism can be working exactly as designed (evolutionarily) and still constitute a disease in the current context.
  *   **Status:** **Non-negotiable (Clinician/Philosopher).** If a theory calls mismatch pathologies "healthy," it is useless for public health.
  *   **Pushback:** Be careful here. We rarely know the specific evolutionary "design specs" for a trait. A theory relying too heavily on *why* a trait was selected risks becoming unfalsifiable storytelling.

  **2. The Senescence Distinction (Placing Aging)**
  *   **Motivating Case:** Your 80-year-old kidneys with 30% nephron loss: uniform, predictable, and inevitable, yet functionally inferior to a 20-year-old's.
  *   **Requirement:** The theory must distinguish between *pathology* (deviation from species design) and *senescence* (wear-and-tear intrinsic to the design). It need not solve the biology of aging, but it must explain why we treat pneumonia in an 80-year-old but rarely treat "nephron loss" as a disease entity itself.
  *   **Status:** **Philosopher's Preference.** Clinicians treat the complications of aging, not aging itself. A theory that medicalizes aging entirely becomes absurd; one that ignores it entirely misses the bulk of geriatric practice.
  *   **Pushback:** You ask the theory to "place" aging. I suspect this is a category error. "Disease" might simply be the wrong concept for senescence. The requirement should be that the theory *accommodates* the distinction, not necessarily that it biologically resolves it.

  **3. The Disadvantage/Dysfunction Boundary**
  *   **Motivating Case:** Homosexuality (historically diagnosed) vs. Tone-deafness (never diagnosed): one was stigmatized, the other is merely a lack of skill.
  *   **Requirement:** The theory must distinguish between a *failure of internal mechanism* and a *failure to meet social expectations*. It must explain why homosexuality was never a disease (scientifically) despite being socially disvalued, whereas tone-deafness is a deficit but not a *medical* one.
  *   **Status:** **Non-negotiable (Clinician).** Misclassifying social deviance as disease leads to human rights abuses (as you noted).
  *   **Pushback:** This assumes "dysfunction" is value-free. Some argue the choice of *which* functions matter (e.g., reproduction vs. survival) is itself a value judgment.

  **4. Latent Pathology (The Asymptomatic Problem)**
  *   **Motivating Case:** Undiagnosed HIV (1990) or early glomerulonephritis: the patient feels fine, but the biological trajectory is toward catastrophe.
  *   **Requirement:** The theory must define health as a *state of the organism*, not a *subjective experience*. It must account for risk states that are currently asymptomatic but biologically active.
  *   **Status:** **Non-negotiable (Clinician).** Preventive medicine collapses if health is defined as "feeling well."
  *   **Pushback:** This creates a slippery slope. If latent disease counts, does *risk* count? Is a smoker with healthy lungs "diseased"? The theory needs a cutoff between *having a disease* and *being at risk for a disease*.

  **5. Explaining Controversy (Not Just Resolving It)**
  *   **Motivating Case:** Deafness and Infertility: Some in the Deaf community reject "disease" status; infertility is treated medically but often isn't life-threatening.
  *   **Requirement:** The theory should not just dictate an answer but explain *why* these are contested. It should reveal whether the disagreement is about the biology (is the ear broken?) or the values (is hearing necessary for well-being?).
  *   **Status:** **Philosopher's Preference.** Clinicians often just want a protocol. However, understanding the source of disagreement helps in shared decision-making.
  *   **Pushback:** Don't demand the theory solve the Deafness debate. Demand it clarify *what kind* of debate it is (ontological vs. ethical).

  **6. Clinical Actionability (The "So What?" Test)**
  *   **Motivating Case:** Mild hypertension vs. Severe hypertension: At what exact mmHg does "risk factor" become "disease requiring drugs"?
  *   **Requirement:** The theory must link the classification of disease to a justification for intervention. If a condition is a "disease" but warrants no intervention, prevention, or accommodation, the label is otiose.
  *   **Status:** **Non-negotiable (Clinician).** A definition of disease that doesn't guide treatment is merely taxonomy, not medicine.
  *   **Pushback:** This is the biggest threat to objectivity. If "disease" implies "treat," then changes in treatment cost or efficacy change the definition of the disease.

  **7. Threshold Non-Arbitrariness**
  *   **Motivating Case:** Bone density: Osteopenia vs. Osteoporosis. The biology is a continuum; the diagnosis is a binary line.
  *   **Requirement:** The theory must provide a principled way to draw lines on continua without admitting the line is purely arbitrary.
  *   **Status:** **Philosopher's Preference.** Clinicians know lines are often arbitrary (based on insurance or drug trials). A philosophical theory should aspire to better, but may fail.

  ***

  ### The Bad News: Incompatible Pairs

  You asked where the tensions lie. If you go into the literature looking for a theory that satisfies all seven, you will be disappointed. Here are the likely fracture points:

  **1. Objectivity (#3) vs. Actionability (#6)**
  *   **The Conflict:** If disease is a purely biological fact (Naturalism), it shouldn't matter whether we have a cure. But if disease implies "ought to treat" (Normativism), then a condition stops being a disease if the treatment is too expensive or nonexistent.
  *   **The Consequence:** You cannot have a theory that is both purely value-free *and* inherently action-guiding. Boorse saves objectivity but loses actionability; Nordenfelt saves actionability but loses objectivity.

  **2. Statistical Normality (#1 & #2) vs. Clinical Urgency (#4 & #6)**
  *   **The Conflict:** If disease is "statistical sub-normality" (Boorse), then aging is *healthy* because it is universal (statistically normal for the age). But if disease is "what kills you" (Clinical), aging is the primary disease.
  *   **The Consequence:** You cannot satisfy the Evolutionary/Statistical requirement and the Clinical Actionability requirement simultaneously regarding aging. Either you admit aging is healthy (and ignore the nephron loss), or you admit aging is disease (and medicalize the human lifespan).

  **3. Mismatch (#1) vs. Design (#3)**
  *   **The Conflict:** To handle mismatch diseases (T2DM), you need to reference the "environment of evolutionary adaptedness." To handle social disadvantage (#3), you need to ignore evolutionary goals (reproduction) in favor of current well-being.
  *   **The Consequence:** A theory that leans hard on evolutionary function to solve Mismatch will struggle to explain why infertility (evolutionary failure) is only sometimes a disease, or why homosexuality (evolutionary failure) is never one.

  ***

  ### Scorecard: How the Contenders Fare

  **Christopher Boorse (Biostatistical Theory)**
  *   **Verdict:** Fails Aging and Actionability.
  *   **Analysis:** Boorse defines health as statistically typical species function. This handles the Homosexuality case well (it's not a dysfunction of a mechanism). However, it fails your **Aging (#2)** requirement: since nephron loss is statistically normal for 80-year-olds, Boorse must call it "healthy." It also fails **Actionability (#6)**: a condition can be a disease on his account even if we cannot or should not treat it. It is scientifically rigorous but clinically cold.

  **Jerome Wakefield (Harmful Dysfunction Analysis)**
  *   **Verdict:** Best on Disadvantage, weak on Mismatch.
  *   **Analysis:** Wakefield requires a *failure of evolved function* PLUS *social harm*. This nails the **Disadvantage (#3)** requirement (homosexuality has no dysfunction, so not a disease). However, it struggles with **Mismatch (#1)**: defining the specific "evolved function" of complex systems like metabolism is notoriously difficult. It also struggles with **Aging (#2)**: is senescence a "dysfunction" or just the end of the design's warranty? Wakefield tends to classify aging as non-disease, which frustrates geriatricians.

  **Lennart Nordenfelt (Normativist/Welfare Theory)**
  *   **Verdict:** Best on Actionability, fails Objectivity.
  *   **Analysis:** Nordenfelt defines health as the ability to achieve vital life goals. This handles **Asymptomatic (#4)** and **Actionability (#6)** beautifully (if it stops your goals, it's a disease). However, it fails **Disadvantage (#3)**: if a society values reproduction above all, infertility is a disease; if they value art, tone-deafness might be. It makes disease status too dependent on cultural values, risking the return of diagnoses like homosexuality if the "vital goals" shift.

  ### Final Thought
  Your doctor friend is right. The argument isn't just about semantics; it's about resource allocation and human identity. My advice? Don't look for a "True Theory." Look for the tool that fits the job. Boorse for epidemiology, Wakefield for psychiatry/ethics, Nordenfelt for palliative care. A single theory satisfying your spec likely doesn't exist because medicine itself is not a single kind of practice.
