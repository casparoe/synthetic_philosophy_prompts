answer: |-
  Here is a complete design for a 90-minute seminar role-play titled **"The Ombura Valley Protocol."** It is engineered to force students into the structural trap of conflicting normative systems, rather than allowing them to play moral caricatures.

  ---

  # Session Overview: The Ombura Valley Protocol
  **Time:** 90 Minutes
  **Students:** 18
  **Goal:** Demonstrate that corruption is often a clash of institutional logics (embedded reciprocity vs. universalist bureaucracy) rather than individual moral failure.

  ## 1. Class Setup & Groups (10 Minutes)
  Divide the class into three physical clusters. Hand out **Confidential Role Sheets** (see Section 3). Do not let groups share sheets.

  *   **Group A: The Village Council (8 Students)**
      *   *Context:* Ombura Valley. Social life is built on *diffuse reciprocity*. A meeting without food is an insult; a favor unreturned is a debt.
  *   **Group B: The NGO Field Team (6 Students)**
      *   *Context:* "GlobalBuild." Funded by Western donors. Mandate: Build the school. Constraint: Zero-tolerance anti-corruption compliance.
  *   **Group C: The District Liaisons (2 Students)**
      *   *Context:* Local government. They need the school for votes, but also need to maintain order and extract small "facilitation fees" to supplement low state wages.
  *   **The "Floaters" (2 Students from Group B)**
      *   *Note:* Tell Group B that 2 of them will be revealed as **HQ Auditors** in Round 2. They sit with the NGO team but have a hidden scoring sheet.

  **The Payoff Scheme (Write on Board):**
  Every group has two private scores.
  1.  **Project Score (0–10):** Did the school get built?
  2.  **Integrity/Standing Score (0–10):** Did you follow your internal rules/norms?
  *   **Win Condition:** You need a **5+ in both** to "succeed."
  *   **The Trap:** Actions that raise Project Score often lower Integrity Score, and vice versa.

  ---

  ## 2. The Rounds (55 Minutes Total)

  ### Round 1: The Kickoff Impasse (15 Minutes)
  **Objective:** Schedule the first site inspection and release the initial tranche of funds.
  **The Mechanic:** To release funds, the NGO needs a signed form from the Village Chair. To sign the form, the Chair requires a "Hospitality Protocol."

  *   **Village Constraint:** You cannot host a meeting without providing a meal and "transport reimbursement" (cash envelopes) for elders. If you don't, your *Standing Score* drops by 5 immediately (you look poor/disrespectful).
  *   **NGO Constraint:** You cannot pay for meals or cash envelopes. It violates the "No-Gift Clause." If you authorize it, your *Integrity Score* drops by 5.
  *   **District Constraint:** You cannot stamp the permit without a "processing fee" (5% of the tranche).
  *   **Task:** Negotiate a solution that allows the project to start (Project Score +1) without tanking your Integrity/Standing.

  *Instructor Note:* Watch them try to rename the bribe. "Consulting fee," "Per diem," "Catering." Write these euphemisms on the board.

  ### Round 2: The Audit Squeeze (20 Minutes)
  **Trigger:** The 2 "Floater" students stand up. They are **HQ Auditors**.
  **New Rule:** HQ has instituted a "Zero-Tolerance Forensic Audit." All Round 1 transactions are being reviewed.
  **The Crisis:**
  *   If the NGO admitted to the Round 1 "Hospitality" payments on the receipt: The Auditors flag it. Project is frozen (Project Score capped at 2).
  *   If the NGO hid the payments (fudged receipts as "office supplies"): The Auditors might catch it. If caught, NGO Integrity = 0 (Fired).
  *   If the Village admits the cash was taken: They look corrupt to the new donors. Standing = 0.
  *   **The Choice:** The NGO Field Lead must decide: **Cancel the project** (Keep Integrity, lose Project) OR **Retroactively legalize the bribes** (Risk Integrity, save Project).
  *   **Village Choice:** Do you demand the money you were promised in Round 1, knowing the Auditor is watching?

  ### Round 3: The Rival Bid (20 Minutes)
  **Trigger:** The 2 District Liaisons stand up. They are no longer Government. They represent **"EastStar Construction"** (a rival donor with no compliance rules).
  **The Offer:** EastStar will build the school *tomorrow*.
  *   **Requirements:** No forms. No receipts.
  *   **Cost:** The Village must grant EastStar exclusive mining rights to the valley land (Long-term loss of sovereignty, but immediate gain).
  *   **NGO Dilemma:** Do you match the offer (requiring massive rule-breaking) or walk away?
  *   **Village Dilemma:** Do you take the sure school with bad terms, or keep holding out for the "clean" NGO that might fail?

  ---

  ## 3. Confidential Role Sheets (Summaries)

  **Group A: Village Council (Select Roles)**
  *   **Chairperson:** *Objective:* Standing Score > 5. *Constraint:* If you hold a meeting without serving meat and kola nuts, the elders will boycott you (-5 Standing). You cannot sign the NGO form without the "transport envelopes."
  *   **Elders (x4):** *Objective:* Protect tradition. If the NGO treats this like a business transaction, vote to reject them.
  *   **Youth Rep:** *Objective:* Project Score > 5. You want the school even if it means bending rules.
  *   **Treasurer:** *Objective:* Secure the cash envelopes. This money funds the village clinic. No cash = clinic closes.

  **Group B: NGO Field Team**
  *   **Field Director:** *Objective:* Project Score > 5. *Constraint:* If the school isn't started by end of class, you are fired.
  *   **Program Officers (x3):** *Objective:* Get the work done. You see the Village needs the money.
  *   **Compliance Officers (x2):** *Objective:* Integrity Score > 5. *Constraint:* If you sign off on a non-compliant receipt, you lose your certification.
  *   **(Secret for 2 Students):** You are **Internal Audit**. In Round 2, your objective changes: Find *one* violation. If you find none, you are suspected of collusion (-5 Integrity).

  **Group C: District Liaisons**
  *   **Objective:** Stability + Personal Revenue.
  *   **Constraint:** Your government salary is $50/month. You need the "processing fee" to feed your family. If the NGO refuses, you can delay the permit indefinitely.
  *   **Round 3 Twist:** You represent EastStar. You don't need fees; you need the mining rights.

  ---

  ## 4. The Debrief (25 Minutes)
  *Do not ask "How did it feel?" Ask specific analytical questions.*

  **1. The Definition Trap (10 mins)**
  *   *Ask the NGO:* "When the Village Chair asked for food, was that a **bribe** or a **gift**?"
      *   *Theory:* A bribe closes a transaction (quid pro quo). A gift opens an obligation (diffuse reciprocity). The NGO treated a relationship-building gift as a transactional bribe.
  *   *Ask the Village:* "Was the cash envelope a **kickback** or a **sitting fee**?"
      *   *Theory:* In weak states, public office is often a resource for kin support (Neo-patrimonialism). The Chair isn't stealing public money; they are redistributing it to maintain the social fabric that makes governance possible.

  **2. The Enforcement Problem (10 mins)**
  *   *Ask the Auditor:* "Could you actually audit this without stopping the project?"
      *   *Theory:* **The Principal-Agent Problem.** HQ (Principal) wants clean hands. Field (Agent) wants results. Monitoring is costly.
  *   *Ask the Village:* "Why did EastStar become attractive in Round 3?"
      *   *Theory:* **Competition in Corruption.** When compliance costs are too high, "clean" donors price themselves out of the market, leaving the field to predatory actors who tolerate local norms but extract heavier long-term rents (mining rights).

  **3. The Universalist Claim (5 mins)**
  *   *Ask:* "Are the NGO rules 'universal ethics' or 'Western export'?"
      *   *Theory:* Discuss **Methodological Nationalism**. We assume the "State" and "Private Sector" are separate. In Ombura, they are embedded. The NGO tried to impose a Weberian bureaucracy on a social network.

  ---

  ## 5. Instructor's Troubleshooting Guide

  ### What Will Predictably Go Wrong
  1.  **The "Cartoon Villain" Problem:** Students playing the District Liaison will laugh and demand bribes openly.
      *   *Fix:* In the briefing, emphasize: *"You are not a villain. You are a father trying to feed his kids on a $50 salary. If you don't take the fee, your neighbor will, and he will be the one who helps you later. It is rational."*
  2.  **The "Holy NGO" Problem:** The NGO team will refuse to bend rules and simply fail the project, feeling morally superior.
      *   *Fix:* Remind them during Round 2: *"If you fail the project, the village children stay in a collapsing building. Is your clean receipt worth a child's safety? Calculate the utilitarian cost."*
  3.  **Time Creep:** Round 1 negotiations will drag.
      *   *Fix:* Use a visible timer. Announce "5 minutes to agreement or the funding window closes."

  ### What This Simulation CANNOT Reproduce (Be Honest About This)
  1.  **Real Fear:** Students aren't afraid of losing their jobs or being arrested. The "Integrity Score" is abstract. In reality, the threat of prison makes compliance visceral.
  2.  **Long-Term Trust:** In the game, relationships reset. In reality, burning a bridge in Round 1 destroys Round 3. The simulation underestimates the value of reputation.
  3.  **The "Silent" Corruption:** The game focuses on *transactional* corruption (cash/food). It misses *structural* corruption (laws written to favor specific companies), which is harder to spot but more damaging.

  ### The "Aha" Moment to Aim For
  You want the NGO students to realize that by refusing to pay for the "meal," they didn't stop corruption; they just made the meal happen *off the books* (Round 2 fudging), which makes it *more* corrupt because it is unaccountable. **Strict compliance can drive corruption underground, not eliminate it.**

  ---

  ## 6. Materials Needed
  1.  **Role Sheets:** Printed and folded (keep secrets).
  2.  **Transaction Tokens:** 20 red chips (Cash/Gifts), 20 blue chips (Official Funds).
  3.  **The Ledger:** A whiteboard table with columns: *Project Progress | NGO Integrity | Village Standing*.
  4.  **Receipt Book:** A prop for the NGO to fill out. (Makes the "fudging" physical).

  ## 7. Suggested Reading for Post-Class
  *   **Akers, M. (2018).** *The Gift of Corruption.* (On the distinction between gifts and bribes).
  *   **Johnston, M. (2005).** *Syndromes of Corruption.* (On how different societies experience corruption differently).
  *   **Verdery, K. (1996).** *What Was Socialism, and What Comes Next?* (On how informal networks sustain life when formal institutions fail).
