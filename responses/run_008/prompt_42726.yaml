      *   *Better Verdict:* Abandon (1). The "Person-Affecting Restriction" in its narrow form (1) is incompatible with almost all robust population ethics intuitions (including 4 and 5). Moving to a "Wide Person-Affecting View" or a hybrid rights view resolves (4) and (5) simultaneously.
