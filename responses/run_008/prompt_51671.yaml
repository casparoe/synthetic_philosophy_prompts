prompt: |-
  I'm a PhD student (decision theory, but I've been dragged into teaching) running a 90-minute seminar for about 22 second-year undergrads on a social epistemology module, and next week's topic is information cascades and rational herding. The students have already had the basic Bayesian sequential-decision setup, so they sort of know the punchline: a few early movers can drag everyone after them into a wrong choice even when the aggregate of private signals pointed the other way. What they don't have is any feel for it — on paper it just looks like an artefact of the model, and half of them conflate it with plain conformity effects or reputational herding, which it isn't.

  Design me a classroom game that produces an actual cascade, or ideally several, with real (small) stakes so the incentives bite — no actual money, but some point or token scheme with a small prize at the end. Give me the full mechanics: how the private signals are generated and how informative they are, the choice each participant faces, the order of moves, what's public vs private, and how the payoffs work. I'd also like a twist if you can make it run cleanly: I want to secretly designate two or three students as planted conformists who must ignore their own signal and copy the previous mover no matter what, and then at the end have the group vote on who they think the plants were. My hunch is they mostly can't tell, and that's exactly the point — from observed actions alone, a rational cascader and a blind follower are behaviourally identical. But you tell me whether that actually works or whether it collapses.

  Then the debrief: I want it to map specific moments in the game onto the parts of the formal story (when the cascade tipped, what the person who broke it knew that the others didn't, whether breaking it was even rational for them), and to make the contrast with conformity/social-pressure explanations sharp rather than hand-wavy. Also give me an honest section on what will predictably go wrong the first time I run it — I'm braced for the contrarian who deliberately deviates just to mess with the cascade, and for the cascade failing to form at all if the first two signals conflict — and what I do about each. And be frank about which feature of real cascades the game just cannot reproduce, so I know what I have to supply in the wrap-up myself. Please write the whole thing in British English.
