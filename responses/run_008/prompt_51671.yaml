answer: |-
  Here is a complete seminar plan designed for a 90-minute session with 22 second-year undergraduates. It is built to be low-tech, robust, and explicitly tailored to your learning objectives regarding observational equivalence and the fragility of cascades.

  # Seminar Plan: The Information Cascade Game

  **Time:** 90 Minutes
  **Participants:** 22 Students
  **Materials Needed:**
  *   2 Opaque containers (labelled 'Urn A' and 'Urn B').
  *   Poker chips or coloured balls (Red and Blue).
  *   22 Envelopes (pre-prepared with signal slips).
  *   A whiteboard or slide deck to track public guesses.
  *   Raffle tickets (or equivalent points) for payoffs.
  *   2 'Plant Instruction' slips (prepared secretly before class).

  ## 1. The Mechanics

  ### The State of the World
  There are two possible states, equally likely *a priori* (50/50):
  *   **State Red:** The 'Red Urn' is active.
  *   **State Blue:** The 'Blue Urn' is active.

  **Urn Composition (Common Knowledge):**
  *   **Red Urn:** 2 Red chips, 1 Blue chip.
  *   **Blue Urn:** 2 Blue chips, 1 Red chip.
  *   *Signal Precision ($q$):* 2/3 (approx. 67%).

  ### The Procedure
  1.  **Selection:** You will run **two rounds** of 11 students each. (This keeps the chain long enough for a cascade to lock in but short enough to fit the timeframe).
  2.  **Private Signal:** Each participant in the chain receives an envelope containing a slip of paper indicating a colour (Red or Blue). This is drawn from the *active* urn. They look at it privately.
  3.  **Public Action:** Starting from Student 1, each student announces their guess of the *Active Urn* (Red or Blue) to the room.
  4.  **Information:** Subsequent students hear all previous guesses but **do not** see the previous chips. They only know their own chip.
  5.  **Payoffs:**
      *   Correct Guess: 1 Raffle Ticket.
      *   Incorrect Guess: 0 Tickets.
      *   *Note:* Emphasise that tickets are awarded for **accuracy**, not for agreeing with the group. This isolates information cascades from reputational herding.

  ### The 'Plant' Twist
  Before the seminar begins, secretly pull aside two students (ideally ones who are reliable and won't giggle). Give them a slip instructing them:
  > *"You are a 'Blind Follower'. Regardless of the colour in your envelope, you must announce the same colour as the person immediately before you. Do not reveal this instruction until the end."*

  **Placement:**
  *   **Plant 1:** Position 3 in Chain 1.
  *   **Plant 2:** Position 5 in Chain 2.
  *   *Rationale:* Placing them early enough to influence the cascade, but late enough that they aren't the very first movers (which would look suspicious).

  ## 2. Run Sheet (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction & Setup** | Explain rules, show the Urns, demonstrate the 2/3 ratio. Distribute envelopes. **Crucial:** Remind them silence is golden. |
  | **10–25** | **Chain 1 (11 Students)** | Students announce guesses. You record them on the board. Collect envelopes. |
  | **25–40** | **Chain 2 (11 Students)** | Reset the 'Active Urn' (flip a coin). Repeat process. |
  | **40–50** | **The Reveal & Vote** | Reveal the true state for both chains. Award tickets. **Then:** Ask the class to vote on who they think the 'Plants' were. Reveal the plants. |
  | **50–90** | **The Debrief** | Whiteboard work. Mapping actions to Bayes. Distinguishing rationality from conformity. |

  ## 3. The Debrief: Mapping Game to Theory

  This is the core of the seminar. Do not simply ask "What happened?". Walk them through the math using the specific data generated in the room.

  ### A. Identifying the Tipping Point
  Draw the sequence of guesses from Chain 1 on the board.
  *   *Example:* R, R, R, R, B, R, R...
  *   **Ask:** "At which point did Student $N$ stop using their private signal?"
  *   **The Math:**
      *   Student 1: Follows signal (Prior 50/50, Signal 67/33).
      *   Student 2: If S1=Red, S2=Red $\rightarrow$ Guess Red. If S1=Red, S2=Blue $\rightarrow$ Posterior is 50/50. (Assume they follow private signal as tie-break).
      *   Student 3: If S1=Red, S2=Red. Even if S3=Blue, the likelihood ratio of two Reds outweighs one Blue. S3 ignores private signal and guesses Red.
  *   **Point:** The cascade starts when the public history outweighs the private signal. In the standard BHW model with $q=2/3$, this happens at **Student 3** if the first two match.

  ### B. The Plant Problem (Observational Equivalence)
  This addresses your specific hunch.
  *   **The Vote:** Likely, the class will fail to identify the plants, or they will accuse people who were actually rational cascaders.
  *   **The Lesson:** A rational agent in a cascade ignores their private signal. A blind follower ignores their private signal.
  *   **Conclusion:** From the outside, **rational herding and mindless conformity are observationally equivalent.** You cannot infer internal reasoning from external action alone. This is why social epistemology requires structural analysis, not just behavioural observation.
  *   **Contrast with Conformity:** If this were Asch-style conformity, the payoff would depend on *matching* the group. Here, the payoff depended on *truth*. The students followed the herd to find the truth (instrumental rationality), not to fit in (social preference).

  ### C. The Fragility of Cascades
  *   **Ask:** "What would have happened if Student 3 had broken the cascade?"
  *   **Analysis:** If Student 3 had guessed against the flow (e.g., guessed Blue when 1 & 2 said Red), this would signal to Student 4 that Student 3 must have had a very strong private signal (or was irrational).
  *   **The 'Contrarian' Issue:** In the standard model, breaking a cascade is irrational for the breaker (they lower their own accuracy probability) unless they have *more precise* signals than the predecessors. However, breaking a cascade provides a massive positive externality to everyone following by resetting the public information pool. This highlights the tension between individual rationality and group epistemic health.

  ## 4. Troubleshooting: What Will Go Wrong

  You asked for frankness. Here are the predictable failure modes and how to handle them.

  ### 1. The Cascade Fails to Form
  *   **Scenario:** The signals alternate (Red, Blue, Red, Blue...). No cascade locks in because the public count never exceeds the private signal weight.
  *   **Probability:** With $q=2/3$, the probability of a cascade starting by player 3 is roughly 5/9. It is not guaranteed.
  *   **Fix:** This is why you run **two chains**. If neither cascades, use it as a counter-example. "Look, the wisdom of crowds held! Why? Because the early signals were diverse enough to prevent lock-in." This teaches that cascades are *probabilistic*, not inevitable.

  ### 2. The Contrarian (The 'Griefer')
  *   **Scenario:** A student understands the game and deliberately guesses against the cascade to 'save' the group, sacrificing their own ticket.
  *   **Response:** Do not scold them. Highlight them in the debrief.
  *   **Teaching Point:** "This student acted against their private incentive to improve public information. This is **epistemic altruism**. The standard BHW model assumes pure self-interest. In reality, if enough people are epistemic altruists, cascades break down. This is a limitation of the rational choice model."

  ### 3. The Plants are Too Obvious
  *   **Scenario:** If Plant 1 is at Position 3, and Students 1 & 2 guessed differently (Red, Blue), the 'rational' move for Student 3 is to follow their private signal. If the Plant copies Student 2 (Blue) despite having a Red signal, it might look suspicious if the class is sharp.
  *   **Fix:** Instruct the plants: "If the previous guesses are mixed (e.g., Red then Blue), follow your own signal. Only copy if a cascade seems to have started (e.g., Red, Red)." This makes their behaviour perfectly rational *ex-post*, rendering them undetectable. *Actually, better instruction:* "Copy the immediate predecessor regardless." If they get spotted, it strengthens the point that irrationality is hard to distinguish from rationality only when the math is clear. If the math is ambiguous (mixed history), they might be caught. **Recommendation:** Place plants only after two matching guesses have occurred.

  ### 4. Collusion/Signalling
  *   **Scenario:** Students cough or wink to signal their chip colour.
  *   **Fix:** Strict 'exam conditions' during the move phase. Stand at the front; they come up to you, show you their slip, you announce the guess. They do not announce it themselves. This ensures the *only* public info is the guess, not the tone of voice.

  ## 5. Limitations: What the Game Cannot Reproduce

  Be explicit in your wrap-up about where the model diverges from reality. You cannot game-ify everything.

  1.  **Signal Precision Variance:** In the game, everyone knows everyone has a $q=2/3$ signal. In reality, we suspect some people are experts and others are uninformed. If students suspect the 'leader' of the cascade is an expert, the cascade locks in faster (reputational herding blends with information cascades).
  2.  **Payoff Structures:** Here, payoffs are purely for accuracy. In real financial or social cascades, payoffs often depend on *joining* the herd (e.g., asset bubbles, fashion). This game isolates *information*, but you must verbally re-introduce *reputation* to explain real-world stickiness.
  3.  **Common Knowledge of Rationality:** The model assumes everyone knows everyone is a Bayesian updater. If Student 4 thinks Student 3 is an idiot, Student 4 will ignore Student 3. The cascade relies on mutual trust in rationality.
  4.  **Discrete vs. Continuous:** The game is binary (Red/Blue). Real cascades often involve continuous variables (price, probability estimates), which allows for more nuanced signalling (e.g., hesitancy).

  ## 6. Instructor's Cheat Sheet (Bayesian Calcs)

  Keep this handy for the whiteboard work.
  *   **Prior:** $P(Red) = 0.5$
  *   **Likelihood:** $P(r|Red) = 2/3$, $P(r|Blue) = 1/3$.
  *   **Student 1:** Sees $r$. Posterior = $2/3$. Guesses Red.
  *   **Student 2:**
      *   If S1=Red, S2 sees $r$: Posterior = $4/5$. Guesses Red.
      *   If S1=Red, S2 sees $b$: Posterior = $1/2$. (Indifferent). *Assumption:* Follows private signal (Blue).
  *   **Student 3:**
      *   If S1=Red, S2=Red. S3 sees $b$.
      *   Likelihood of (Red, Red, Blue | Red Urn) = $(2/3) \times (2/3) \times (1/3) = 4/27$.
      *   Likelihood of (Red, Red, Blue | Blue Urn) = $(1/3) \times (1/3) \times (2/3) = 2/27$.
      *   Ratio is 2:1 in favour of Red.
      *   **Result:** S3 ignores private Blue signal and guesses Red. **Cascade Begins.**

  ## Final Advice for the PhD Student

  You mentioned you've been "dragged into teaching". Use that. In the debrief, admit that running the game makes you nervous about the plants being spotted. Model the epistemic uncertainty yourself.

  The most powerful moment will be when you reveal the plants and the students realise they accused a rational Bayesian of being a mindless follower. That is the visceral feeling of social epistemology: **we are opaque to one another.**

  Good luck with the seminar. If the raffle tickets feel too trivial, promise the winner a copy of the original Bikhchandani et al. (1992) paper signed by you. They'll love that.
