answer: |-
  This is a profound and precise observation, and it cuts to the heart of a debate that has occupied philosophers of language, linguists, and literary theorists for the last two decades. You are correct to sense that the standard *use/mention* distinction is too blunt an instrument here. You are also correct that simple *taboo* fails to account for the contextual modulation (victim vs. villain).

  You are describing a phenomenon where the **pragmatic force of the slur projects out of the fictional frame and adheres to the lexical token itself, regardless of the speaker's intended attitude within the narrative.**

  There is no single, universally agreed-upon noun phrase in the literature that captures this *exact* configuration of readerly reception, token sensitivity, and narrative embedding. However, we can construct a precise definition for your editorial purposes by synthesizing three established concepts from the semantics and pragmatics of offensive language.

  Here is the breakdown of the phenomenon, the existing terminology that approximates it, and a proposed term to settle the debate between your copy-editor and sensitivity reader.

  ### 1. The Semantic Core: The Display/Describe Distinction
  The asymmetry you note—where a paragraph describing racist contempt is acceptable, but the slur is not—is best explained by the **Display/Describe Distinction** (championed by philosophers like Christopher Hom and Luvell Anderson).

  *   **Description:** Neutral terms (or descriptive passages) *describe* a set of individuals. They have truth conditions. If your narration says, "He hated Jewish people," this is a proposition about the character's psychology. It can be true or false within the fiction.
  *   **Display:** Slurs do not merely describe; they *display* an attitude. They are expressive. When the character uses the slur, they are not just conveying information; they are enacting a stance of superiority and contempt.

  **Why this fits your case:** Even though the *narrative* condemns the character, the *word itself* is designed to display contempt. The reader encounters the display mechanism directly. The description of hate is *about* the hate; the slur *performs* the hate (even if ironically or villainously). The reader's discomfort arises because they are forced to process the *display* of contempt, not just the *report* of it.

  ### 2. The Pragmatic Core: Projection and Conventional Implicature
  You ask why the offense "travels with the token." In semantics, this is known as **Projection**.

  Slurs are widely analyzed as carrying **Conventional Implicature** (a la Christopher Potts) or **Presupposition**. This means the derogatory content is "hard-wired" into the word's meaning, separate from the main point of the sentence.
  *   *Sentence:* "The villain called him a [slur]."
  *   *Truth Condition:* The villain used that word.
  *   *Implicature:* The target group is inferior/despised.

  Crucially, implicatures **project** through embedding. If I say, "It is false that [slur]s are lazy," I have still uttered the slur, and the offensive residue remains. In your novels, the fictional context ("This is a villain speaking") is an embedding operator. Normally, embedding cancels authorial endorsement (e.g., if a character lies, the author isn't lying). But with slurs, the offensive implicature **fails to cancel**. It projects out of the dialogue, past the character, and lands on the page/reader.

  **Why this fits your case:** This explains why the "condemnation" by the narrative doesn't neutralize the word. The semantic "stain" of the slur projects beyond the character's intent to the utterance itself.

  ### 3. The Phenomenological Core: Lexical Contamination
  This brings us to the specific sensation your readers report: "contamination of the page." In the literature on harmful speech (e.g., work by Lynne Tirrell or Rebecca Kukla), this is sometimes discussed as **Lexical Contamination** or **Semantic Residue**.

  This is the idea that the word carries a historical weight—a "blood history," as it were—that is activated upon utterance. When you write the word, you are not just referencing its definition; you are invoking its history of usage.

  **Why this fits your case:** This explains the sensitivity to the *token*. A coined insult ("shuffler") has no history, no residue. It is semantically empty of past harm. The established slur is "radioactive." The reader feels that by inscribing the token, the text itself becomes a site of harm, regardless of the fictional framing.

  ### A Proposed Term for Your Editorial Debate

  Since no single existing term captures the *readerly experience of the token within fiction* precisely enough for your copy-editor and sensitivity reader to argue around, I propose you adopt the term:

  ## **Token Contamination**

  **Definition:** *Token Contamination* occurs when the historical and pragmatic harm associated with a slur adheres to the specific lexical token (the written or spoken word) independently of the speaker's intent, the narrative's moral framing, or the truth-conditional content of the utterance.

  **The Mechanism:** It is the result of **Expressive Display** (the word performs hate) combined with **Projection** (the hate escapes the fictional frame), resulting in a perceived **Lexical Stain** on the text.

  ### Boundary Cases and Edge Conditions

  To help your editor and sensitivity reader, here is how *Token Contamination* applies to the edge cases you mentioned. This provides a rubric for decision-making.

  #### 1. Archaic Slurs (Targets no longer recognized)
  *   **Verdict:** Low to No Contamination.
  *   **Reasoning:** *Token Contamination* relies on **Social Memory**. If the target category is obsolete (e.g., a slur against a specific medieval guild that no longer exists) or the etymology is entirely opaque to the modern reader, the "residue" has dissipated. The word functions as a period marker rather than a weapon.
  *   **Test:** Does the modern reader recognize the group and the harm? If no, contamination is negligible.

  #### 2. Audiobook Narration
  *   **Verdict:** High Contamination (unless framed as Mention).
  *   **Reasoning:** In an audiobook, the narrator's voice is the medium. If the narrator *says* the slur (even in dialogue), the listener hears the phonetic realization of the harm. It is not just visual; it is auditory performance.
  *   **Nuance:** If the narrator says, "He used the N-word," this is **Mention** (describing the token). If the narrator says, "He called him a [N-word]," this is **Use** (inscribing the token). *Token Contamination* applies strongly to the latter. Some listeners find the narrator's voice "contaminated" by speaking it; others accept it as acting. This is a higher threshold than text.

  #### 3. Invented Slurs (Secondary-World Fantasy)
  *   **Verdict:** Contingent on Structural Isomorphism.
  *   **Reasoning:** An invented word (e.g., "Dark-skin" in a fantasy race context) has no historical residue *lexically*. However, *Token Contamination* can still occur via **Structural Isomorphism**. If the fantasy slur maps perfectly onto a real-world oppression (e.g., elves using a slur against orcs that mirrors anti-Black racism), readers will experience contamination *conceptually*, even if the word is new.
  *   **Test:** Is the slur doing work that feels like a transposition of real-world hate? If yes, treat it as contaminated. If it is truly alien (no real-world analogue), contamination is low.

  #### 4. Victim/Memoir Voice
  *   **Verdict:** Contamination Transformed (Reclamation/Appropriation).
  *   **Reasoning:** You noted this is received as "grief." This is the phenomenon of **Appropriation**. When the target group (or a narrative voice aligned with them) uses the token, they can suspend the derogatory implicature. They are not *displaying* contempt; they are *displaying the wound*.
  *   **Boundary:** This only works if the narrative voice is clearly aligned with the victim. If there is ambiguity about who "owns" the voice, *Token Contamination* reverts to default (harmful).

  ### Summary for Your Copy-Editor and Sensitivity Reader

  You can present it to them this way:

  > "We are debating **Token Contamination**. This is not about whether the *character* is racist (they are). It is about whether the *word itself* projects harm onto the reader despite the narrative condemnation.
  >
  > *   **The Copy-Editor's Position:** Relies on **Narrative Distance**. They argue that because the text condemns the slur, the author is not endorsing it. (This assumes offense is purely about *endorsement*).
  > *   **The Sensitivity Reader's Position:** Relies on **Lexical Residue**. They argue that the word carries a history that overrides narrative distance. (This assumes offense is about *encounter*).
  >
  > **The Compromise:** We acknowledge that *Token Contamination* is real. The question is whether the literary value of the scene (historical verisimilitude, emotional impact) justifies inflicting that contamination on the reader. We are not asking if the word is 'realistic' (it is); we are asking if the *cost of the contamination* is worth the *gain in realism*."

  ### Final Philosophical Note
  You are navigating what the philosopher **Elizabeth Camp** calls the **"Autonomy of the Slur."** The word has a life outside your sentence. By writing it, you invite that life into your book. Your readers are reacting not to your story, but to the guest you have invited.

  Use **Token Contamination** as your term. It is precise, it acknowledges the semantic reality (the word *does* carry extra meaning), and it allows you to discuss the *cost* of that meaning without accusing either side of censorship or insensitivity. It frames the problem as a technical feature of the language, not a moral failing of the author or the reader.
