answer: |-
  You have identified a sophisticated and persistent argumentative structure. While there is no single colloquial idiom that captures it perfectly, it sits at the intersection of normative ethics, logic, and rhetorical strategy.

  The established philosophical concept closest to your brother-in-law's *position* is **Lexical Superiority** (or a **Lexical View**). The established logical critique of that position is **Parfit's Spectrum Argument** (often discussed in the context of the "Repugnant Conclusion" or "Intransitivity").

  However, the *rhetorical pattern* you are describing—where the view claims a qualitative break but protects itself by making the location of that break inaccessible—is a specific maneuver of immunization. I propose calling this **The Vanishing Threshold**.

  Here is an analysis of what this phenomenon is, how it differs from its neighbors, and how to force it into the open.

  ### 1. The Established Context: Lexicality and Spectrums
  Your brother-in-law is advocating for a **Lexical View** of suffering. In ethics (specifically population ethics and utilitarianism), a lexical view holds that some goods or bads are of a higher "order" than others. No amount of a lower-order good (pleasure) can outweigh a higher-order bad (torture).

  Derek Parfit, in *Reasons and Persons*, dismantled this using **Spectrum Arguments**. He showed that if you construct a spectrum of suffering from a pinprick to torture, where each step is imperceptibly worse than the last, a lexical view forces you into a contradiction:
  1.  If you say the break happens at Step $N$, why is Step $N$ lexically worse than Step $N-1$ when they are nearly identical? (Arbitrariness).
  2.  If you say there is no sharp break, then how does the sum of small pains never equal the big pain? (Sorites/Intransitivity).

  Your brother-in-law is attempting to hold the Lexical View while using the vagueness of the Spectrum to avoid the Arbitrariness objection.

  ### 2. Distinguishing the Phenomenon
  You are correct that this is not the **Sorites Paradox** or a **Slippery Slope**.

  *   **Vs. Sorites:** The Sorites paradox argues that because there is no clear line (e.g., between "heap" and "non-heap"), the distinction is illusory or language is flawed. Your brother-in-law argues the opposite: that the distinction is *real and moral*, but the line is *hidden*. He uses vagueness not to deny the boundary, but to protect it from examination.
  *   **Vs. Slippery Slope:** A slippery slope claims that accepting $A$ will *cause* $Z$. Your brother-in-law is not making a causal claim; he is making a categorical claim. He isn't saying pinpricks *lead* to torture; he is saying they are *incommensurable*.
  *   **Vs. Moving the Goalposts:** In a standard goalpost move, the criterion changes (e.g., "Okay, not 100 units, but 1000"). Here, the criterion ("incommensurability") remains constant. What moves is the *application* of the criterion. The defense isn't "I changed my mind," it's "You haven't found the spot yet."

  ### 3. Definition: The Vanishing Threshold
  **The Vanishing Threshold** is a rhetorical and philosophical maneuver where a claimant asserts a qualitative discontinuity between two quantities (a threshold), but locates the discontinuity in a region of epistemic vagueness that allows them to categorize any specific example as safely "below" or "above" the line without ever defining the line itself.

  **Key Characteristics:**
  1.  **Qualitative Claim:** It asserts a difference in *kind*, not degree (e.g., "torment" vs. "pain").
  2.  **Epistemic Hiding:** The boundary is claimed to exist but is treated as unlocatable in practice.
  3.  **Immunity:** Any counter-example is absorbed by categorizing it as "not severe enough" or "obviously past the break," leaving the transition zone unexamined.
  4.  **Content Displacement:** The moral "work" of the theory happens at the threshold (where the value spikes), but the threshold is never operationalized.

  ### 4. Sharp vs. Vague, Honest vs. Strategic
  You asked whether the pattern requires the person to believe the transition is sharp or vague, and whether honest vagueness counts.

  **Sharp vs. Vague:**
  The pattern works best when the claimant treats the threshold as **ontologically sharp but epistemically vague**.
  *   If they admit it is *ontologically vague* (there is no fact of the matter where pain becomes torment), they undermine the lexical claim (if the break is fuzzy, the incommensurability is fuzzy, and thus calculable).
  *   If they admit it is *epistemically sharp* (we can know exactly where it is), they are vulnerable to the arbitrariness objection ("Why is 51 seconds of torture lexically worse than 50?").
  *   **The Sweet Spot:** They must insist there *is* a fact of the matter (to maintain moral realism) but that humans cannot pinpoint it (to avoid the arbitrariness trap). This is the "Vanishing" mechanism.

  **Honest vs. Strategic:**
  The pattern counts even if the vagueness is honest. Many people genuinely feel that suffering has a lexical structure but cannot articulate the boundary. However, it becomes a **fallacy** (or a rhetorical shield) when the vagueness is used to block *any* attempt at calibration. If the view offers no guidance on how to act in borderline cases (which are the only cases that matter in policy and triage), it is functionally empty, regardless of the believer's sincerity.

  ### 5. Forcing the Pattern into the Open
  To break a Vanishing Threshold, you must force the claimant to operationalize the transition. You cannot ask "Where is the line?" (they will say "I don't know"). You must ask for a **Marginal Rate of Substitution**.

  **The Test: The Trade-Off Calibration**
  Do not ask for the definition of torment. Ask for the exchange rate *near the suspected boundary*.

  1.  **Establish the Baseline:** "You agree a pinprick is commensurable with pleasure. You agree torture is not."
  2.  **Construct the Spectrum:** "Imagine a scale of pain from 1 (pinprick) to 100 (torture). You believe the lexical break happens somewhere on this scale."
  3.  **Force the Marginal Choice:** "If the break is between 50 and 51, would you save one person from Level 51 pain, even if it meant a billion people suffered Level 50 pain?"
      *   **If they say Yes:** They have committed to a specific number (51). You can then attack the arbitrariness of 51 vs 50.
      *   **If they say No:** They have admitted the break is higher. Move the number up.
      *   **If they say "It's vague":** Ask: "Is it vague enough that you would *gamble* on it? If you had a 51% chance the pain was Level 50 and a 49% chance it was Level 51, would you prioritize the single person or the billion?"

  **The Commitment Condition:**
  The view only counts as a genuine commitment rather than a shield if the holder is willing to make a decision in a **borderline case** where the costs of being wrong are high.
  *   **Genuine Commitment:** "I cannot define the line, but I would rather save one person from *suspected* torment than a million from *suspected* severe pain, even if I'm not sure which is which." (This accepts risk).
  *   **The Shield:** "I cannot define the line, so I cannot make the trade-off until I am certain." (This paralyzes action and protects the theory from falsification).

  ### Summary
  Your brother-in-law is employing **The Vanishing Threshold**. He is defending a **Lexical View** of suffering by exploiting **Epistemic Vagueness** to avoid **Parfit's Spectrum Argument**.

  To challenge him, stop asking for the definition of the threshold. Start asking for the **cost of error** at the threshold. If he refuses to assign a value to the risk of misidentifying the threshold, he admits his view has no practical application. If he does assign a value, he admits the values are commensurable after all.
