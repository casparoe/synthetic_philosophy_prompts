answer: |-
  This is a precise request for the structural limits of a normative theory. You are asking for the *specification sheet* of a decision procedure that claims to handle radical uncertainty without collapsing. Below is that specification, broken down into the functional requirements (desiderata), an audit of their status (axiom vs. bias), and a stress test of their compatibility.

  ### Part I: The Desiderata (The Specification)

  An adequate account of action under consequentialist cluelessness must satisfy the following five conditions.

  **1. The Non-Paralysis Condition**
  *   **Requirement:** The theory must generate a determinate verdict (or a permissible range of verdicts) for mundane actions within a finite timeframe.
  *   **Motivating Case:** Crossing the street. If an agent must calculate the long-term causal ripple of saving 30 seconds versus the risk of a delayed encounter that alters history, and the theory returns "calculation impossible," the agent never crosses. An adequate theory must explain why the epistemic gap regarding the far future does not veto action in the near present. It must license *ignoring* certain causal chains without denying their existence.

  **2. The Discrimination Condition**
  *   **Requirement:** The theory must distinguish between actions with high-confidence near-term effects and actions with purely speculative long-term effects, even when both have unknown distant tails.
  *   **Motivating Case:** Donating \$100 to a verified malaria net charity versus burning the \$100. Both actions have unknowable long-term consequences (the saved child might become a tyrant; the smoke might alter local air pressure affecting storms). If the theory treats these as epistemically equivalent because the *long-term* variance swamps the *short-term* mean, it fails. It must explain why the known near-term good retains decision-weight despite the unknown far-term noise.

  **3. The Asymmetry Condition (Solving the Cancellation Problem)**
  *   **Requirement:** The theory must provide a principled reason why unknown positive and negative long-term consequences do not automatically sum to zero expected value.
  *   **Motivating Case:** The "Historical Re-balancing" intuition. If I save a life, I assume there is an equal chance the long-term outcome is better or worse than if they died. If this symmetry holds, the expected value of *any* intervention with long-term effects is zero. The theory must identify why the distribution of outcomes is skewed (e.g., is there a baseline of "neutral" history that interventions deviate from?) or why symmetry is a false assumption. If it cannot break the symmetry, all intervention is arbitrary.

  **4. The Epistemic Honesty Condition**
  *   **Requirement:** The theory cannot require probability assignments that the agent explicitly lacks (it must handle Knightian uncertainty, not just Risk).
  *   **Motivating Case:** Climate tail risks. You noted modellers conceding tail risks run both directions. A theory that forces the agent to assign a precise 5% probability to a civilizational collapse to make the math work is lying about the agent's state of mind. It must operate on intervals, sets of probabilities, or qualitative rankings, not point estimates, if it is to reflect the "cluelessness" you are reporting on.

  **5. The Stability Condition**
  *   **Requirement:** The verdict should not flip wildly based on negligible changes in how the causal chain is described or framed.
  *   **Motivating Case:** Effective Altruism prioritization. If shifting the timeframe of consideration from 100 years to 101 years inverts the moral ranking of two charities because of a speculative long-term variable, the theory is too fragile to guide real-world resource allocation. It must demonstrate *robustness* to model specification.

  ***

  ### Part II: Axioms vs. Prejudices (The Status Audit)

  You asked to separate non-negotiable requirements from camp-specific biases. This is where the philosophical "action" is, because much of the literature disguises the latter as the former.

  **Non-Negotiable (Internal Coherence)**
  *   **Epistemic Honesty:** If a theory claims to model cluelessness but inputs precise probabilities, it is descriptively false. This is a logical requirement, not a moral one.
  *   **Non-Paralysis:** A practical normative theory that universally prescribes suspension of judgment is functionally indistinguishable from nihilism. If the goal is "how to act," paralysis is a system failure.

  **Prejudices (Camp-Specific Intuitions)**
  *   **The Discrimination Condition (Near-Term Bias):** This is the most contentious. Strict long-termist consequentialists might argue this *is* a prejudice. They would claim that if the long-term variance is truly massive, the \$100 malaria net donation *is* epistemically on par with burning the money, and our intuition otherwise is a cognitive bias toward the visible. Demanding that the theory validate ordinary charitable intuition may be begging the question against the radical implications of cluelessness.
  *   **The Asymmetry Condition:** This assumes there *is* a fact of the matter about whether saving a life is "better" in the long run. Some philosophers argue that if the causal chain is truly unknowable, the question is meaningless, not asymmetric. Demanding an answer here presupposes a realist metaphysics about value that some schools of thought reject.
  *   **Stability:** While desirable, some might argue moral truth is sensitive. However, for a *decision procedure*, stability is practically non-negotiable, even if metaphysically contingent.

  **The Key Distinction:**
  The genuine desideratum is **Action-Guidance**. The *prejudice* is **Concordance with Common Sense**.
  An adequate theory must tell you what to do (Action-Guidance). It does *not* necessarily have to tell you to do what you were already planning to do (Common Sense). If a theory says "You are objectively obligated to do nothing until you know more," that is a valid (if depressing) output, provided it doesn't contradict itself. The bias enters when philosophers tweak the math specifically to ensure the output matches "save the child," rather than following the uncertainty where it leads.

  ***

  ### Part III: The Compatibility Test (The Impossibility Result)

  You asked whether these desiderata can be honoured at once. This is the crux of your story.

  **The Verdict: They are jointly unsatisfiable under standard decision-theoretic frameworks.**

  There is a structural trilemma here. You can satisfy any two of the following three constraints, but not all three:

  1.  **Strict Consequentialism:** Rightness is determined solely by the expected value of outcomes.
  2.  **Epistemic Honesty:** We admit we have no probabilities for long-term outcomes (Cluelessness).
  3.  **Action Guidance:** The theory yields a specific recommendation (No Paralysis).

  **Where it breaks:**

  *   **If you keep (1) and (2):** You must calculate expected value without probabilities. Mathematically, this results in an undefined integral. The theory returns "No Verdict." You satisfy Honesty and Consequentialism, but you lose **Action Guidance** (Paralysis). This is the "moral deadlock" your sources are circling.
  *   **If you keep (1) and (3):** You must generate a verdict for a Consequentialist. To do this, you must manufacture probabilities where none exist (e.g., using the Principle of Indifference to assign 50/50 to unknown outcomes). You satisfy Guidance and Consequentialism, but you lose **Epistemic Honesty**. This is the "fake precision" critique often leveled at cost-benefit analyses in climate policy.
  *   **If you keep (2) and (3):** You must guide action despite missing probabilities. To do this, you must abandon Strict Consequentialism. You need a heuristic, a rule of thumb, or a deontological constraint (e.g., "minimize regret" or "follow established norms") that does not rely on maximizing unknown future goods. You satisfy Guidance and Honesty, but you lose **Strict Consequentialism**.

  **The "Symmetry" Trap:**
  Regarding the **Asymmetry Condition**: This is where the impossibility is sharpest. If you are epistemically honest (2), you must admit you don't know if the long-term effects of saving a life are positive or negative. If you are a strict consequentialist (1), you must weigh these equally. If they are equally weighted and unbounded, they cancel out (or diverge). To avoid cancellation (3), you must assert an asymmetry you cannot epistemically justify.

  **Conclusion for the Feature:**
  The "moral deadlock" you suspect is not a failure of analytical nerve; it is a **theorem of incompatibility**.

  An account that satisfies your specification requires one of the following moves, each of which carries a heavy cost:
  1.  **Imprecise Probabilities:** Use sets of probabilities rather than points. *Cost:* Often leads to decision inertia (if the set is wide enough, *any* action is permissible, which violates the Discrimination Condition).
  2.  **Truncation:** Arbitrarily cut off the causal chain after a certain time horizon. *Cost:* Violates Epistemic Honesty (why stop there?) and Consequentialist Integrity (why do consequences after year 2100 count for zero?).
  3.  **Hybridization:** Admit that consequentialism works for the near term, but we must switch to rule-based ethics for the long term. *Cost:* Theoretical fragmentation. It admits that Consequentialism is not a universal theory of action.

  **The News Hook:**
  The most newsworthy finding is that "Consequentialist Cluelessness" is not a puzzle to be solved within consequentialism. It is a boundary marker. It indicates the point where the demand for *outcome maximization* collides with the *limits of knowledge*. Any source claiming to have a seamless mathematical solution is likely smuggling in a prejudice (usually by assuming symmetry breaks in their favor or by imposing artificial probability distributions). The honest answer is that we do not have a decision theory that is simultaneously honest about uncertainty, committed to maximizing the good, and capable of telling us whether to cross the street. We have to drop one. Most people drop Honesty (pretending we know the odds). The rigorous thinkers drop Consequentialism (switching to heuristics). The paralyzed drop Guidance.

  Your piece can frame this not as a search for the right calculation, but as a choice of which constraint to break. That is the structural result.
