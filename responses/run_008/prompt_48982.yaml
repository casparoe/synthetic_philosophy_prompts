      *   **Constraint:** Do not provide an encyclopedia of who said what; focus on the standard an account must meet and where it breaks.

  2.  **Deconstruct "Consequentialist Cluelessness":**
      *   *Simple Cluelessness:* We don't know the specific outcomes (e.g., saving a life might lead to that person committing a crime later).
      *   *Complex Cluelessness:* We don't even know the *structure* of the causal chain or the probability distribution (Knightian uncertainty/ambiguity).
      *   *The Core Tension:* Consequentialism demands maximizing good. Cluelessness says we can't measure good. Therefore, consequentialism seems to demand paralysis or arbitrariness.
      *   *The Journalist's Insight:* The term is doing three jobs (causal tracing, probability assignment, historical re-balancing). The response needs to address these nuances.

  3.  **Drafting the Desiderata (The "Specification"):**
      *   *Need:* A theory must explain why we aren't paralyzed.
      *   *Need:* A theory must explain why some actions are still better than others (discrimination).
      *   *Need:* A theory must handle the difference between "noise" (cancelling effects) and "signal" (large unknown effects).
      *   *Need:* A theory must respect the agent's epistemic limits (no omniscience).
      *   *Drafting Item 1 (Non-Paralysis):* Must permit action in mundane cases (crossing the street).
      *   *Drafting Item 2 (Discrimination):* Must distinguish between saving a life now vs. burning money.
      *   *Drafting Item 3 (Symmetry Breaking):* Must explain why unknown long-term effects don't always cancel out to zero expected value.
