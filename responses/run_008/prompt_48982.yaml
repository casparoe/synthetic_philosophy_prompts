      *   **Topic:** Consequentialist Cluelessness (the problem that we often can't know the long-term consequences of our actions, making consequentialist calculation impossible or arbitrary).
      *   **Task:** Provide a *specification* of what an adequate account of how to act under cluelessness must deliver (desiderata), not a survey of existing theories.
      *   **Requirements:**
          1.  List desiderata one by one with motivating cases (e.g., why donate small amounts vs. cross the street, canceling effects vs. large unquantifiable effects).
