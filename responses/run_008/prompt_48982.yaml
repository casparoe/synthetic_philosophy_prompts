  4.  **Categorizing Desiderata (Non-Negotiable vs. Prejudices):**
      *   *Non-Negotiable:* Internal consistency, action-guidance (otherwise it's not a practical theory), epistemic honesty (don't lie about what we know).
      *   *Prejudices/Camp-Specific:* The intuition that "ordinary morality" is correct (some consequentialists are happy to bite the bullet that we are obligated to do much more or much less). The intuition that "long-term effects matter most" (some prioritize near-term). The demand for *precision* vs. *range*.
      *   *Key Distinction:* Is the goal to save Consequentialism or to describe rational agency? The journalist asks for an account of *how to act*, implying practical rationality.

  5.  **Analyzing Joint Satisfiability (The "Impossibility" Check):**
      *   *The Trilemma:*
          1.  Strict Consequentialist Maximization (choose the action with best outcomes).
          2.  Epistemic Humility (admit we lack probabilities for long-term effects).
          3.  Action Guidance (don't result in paralysis or "anything goes").
      *   *Conflict:* If you lack probabilities (2), you can't maximize (1). If you force maximization without probabilities, you get arbitrariness ("anything goes"). If you admit lack of probabilities and refuse to maximize, you get paralysis.
      *   *Conclusion:* There is a structural tension. Most solutions involve relaxing one constraint (e.g., using heuristics instead of direct maximization, or adopting a non-consequentialist constraint).
      *   *News Hook:* This confirms the journalist's suspicion of a "moral deadlock."

