  7.  **Final Polish:** Check tone (analytical, respectful but rigorous). Ensure all four prompt requirements are met distinctly. (1. Correspondence, 2. Disanalogies, 3. Imports, 4. Verdict/Alternative).

      *Wait, one nuance:* The friend is a statistician. They love selection bias. I should acknowledge that selection bias *is* real (we do pick the math that works), but it's not the *whole* story. The analogy captures the selection bias but misses the generative capacity.

      *Let's structure the "Better Comparison":* Evolution/Exaptation is the strongest rival. It acknowledges selection (nature selects the trait) but admits the trait wasn't *designed* for the current use. However, even evolution relies on causal interaction. Math doesn't. So Wigner wins on the "Why is the causal link absent?" front.

