      *   *Section 2 (Disanalogies):* Distinguish between "surface" (material vs abstract) and "structural" (predictive vs descriptive). Focus on the structural ones.
      *   *Section 3 (Imports):* Focus on *temporal order* (Measurements first vs. Math first) and *specificity* (One body vs. Many phenomena).
      *   *Section 4 (The Verdict):* This is the meat. Address Non-Euclidean geometry. The "forgotten garments" argument requires that the math was *tried* on physics and rejected. But Riemannian geometry wasn't rejected; it was *untested*. It was a suit made for a ghost.
      *   *Conclusion:* The deflationary conclusion does not survive. The puzzle remains, though perhaps modified. Suggest a better analogy (maybe "Keys" or "Evolutionary Exaptation").

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Platonism is true." I need to evaluate the *analogy's* ability to support the *friend's conclusion*. The friend says "Nothing deep." I need to show why the analogy fails to prove "Nothing deep."
