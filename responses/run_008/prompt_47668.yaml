      *   *Refining the (1) vs (4) point:* Lewis allows indeterministic laws. So a world can be probabilistic. But does that make the future "unsettled"? For Lewis, the world *is* the sum of its parts. If the future events exist (as parts of the concrete world), they are settled *simpliciter*, even if the laws are probabilistic. The "unsettled" feeling is epistemic. If the user means *ontologically* unsettled (truth value gaps), that breaks LMR.
