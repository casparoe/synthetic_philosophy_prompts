prompt: |-
  I'm taking a third-year module on forecasting and judgement under uncertainty, and we've just done Kahneman's inside/outside view distinction plus a bit of Tetlock's work on how badly expert political forecasters tend to do. For the final essay we get to pick our own episode, and I want to do the failure to foresee the collapse of the Soviet Union between 1989 and 1991. The salient facts as I understand them, just so we're on the same page: virtually no serious Kremlinologist or intelligence analyst gave collapse a meaningful probability even a year or two out, the superpower framing made the USSR seem like a permanent fixture of the system, while a handful of outsiders working from crude base rates (empires end, stagnant multiethnic autocracies end even faster) were less blindsided. I want to analyse this episode as a case study in the outside view, in both directions.

  The theory-to-case direction first: who was actually taking an inside view and who an outside view, and what did each side literally do with base rates? But here's where I want to get in the weeds, because the more I think about reference classes the less clear the whole thing seems. In 1985, what were the defensible reference classes for the USSR? Continental multiethnic empires, which historically end and rarely gently; mature one-party states, which sometimes last for ages; oil-dependent command economies after a price crash (that one looks unfairly good with hindsight — every reference class looks good if you pick it after the fact); or nuclear superpowers, a class with basically two members, where the base rate of collapse within a decade was zero until it suddenly wasn't. And there's something paradoxical I keep circling: choosing which reference class to use already looks like an inside-view judgement, smuggled in. So maybe the episode doesn't vindicate the outside view so much as expose the reference class problem as close to fatal. The case-to-theory direction is what my marker will care about most: does Soviet collapse show the outside view works, show that it works only when you get lucky with your class, or show that the whole inside/outside dichotomy is too crude for forecasting a system that a leader could deliberately reform to death?

  Please don't give me a bibliography or tell me what Kahneman or Tetlock wrote and where — I can't check sources and neither can the essay draft I'm building — I want the actual analysis, worked through. My tutor also said something about Kahneman himself becoming more pessimistic late in life about whether people can actually use the outside view, but I might be misremembering, so don't build anything on that unless you're confident it's real. Oh, and please write in British English — I keep getting dinged for spelling. Roughly 900-1200 words would be perfect, and feel free to be blunt about the parts where the theory just goes silent and I should say so in the essay rather than force an answer.
