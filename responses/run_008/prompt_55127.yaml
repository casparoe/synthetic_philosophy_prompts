prompt: |-
  You're a professional epistemologist, so please think carefully about this one before answering — maybe start with a bit of brainstorming about what's really going on in the two kinds of case I describe, rather than jumping straight to a label.

  I've been reading about Gettier cases and something bugs me. There seem to be two different kinds of case lumped together under that label. In the classic kind, someone reasons from a justified but false premise and, by sheer coincidence, ends up with a true belief — the job-and-coins sort of setup. The luck is sort of inside the reasoning: they got to the truth through a falsehood. But in the other kind — the fake barn county sort of case — the person's reasoning is completely fine, no false premise anywhere. They look at a real barn and form the belief that there's a barn. The luck is all in the environment: the area is full of barn facades, and they could just as easily have looked at one of those instead and formed the same belief falsely.

  Is there an established name for this distinction in the literature, or do philosophers just treat both as "Gettier cases" and not worry about it? If there is a name, tell me how it's usually drawn and — more importantly — whether the standard responses to Gettier (like the no-false-lemmas idea, or requiring the belief to be "safe" in some modal sense) handle the two kinds differently. It seems to me like a fix for one kind often does nothing for the other, and I want to understand whether people take that to mean there are really two problems here rather than one, or just one problem that shows up in two ways. And if there's no settled terminology for the contrast, coin something for it and defend where you'd draw the edges — e.g. does the lottery case, where the belief is based on overwhelming odds rather than perception, fall on one side or neither?
