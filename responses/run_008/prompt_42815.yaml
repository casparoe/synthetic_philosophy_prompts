          1.  Justification requires explaining truth-conduciveness (no luck).
          2.  Explanation requires sensitivity (counterfactual dependence: if $P$ were false, belief that $P$ would not be held).
          3.  Platonist objects are causally inert.
          4.  Therefore, if math facts were different, beliefs would be the same (insensitivity).
          5.  Therefore, if Platonism is true, math beliefs are unjustified.
          6.  Some math beliefs *are* justified.
          7.  Therefore, Platonism is false.
      *   **The "Metastasis":** The friend applies this to *all* necessary truths (morals, modals, logic). Since necessary truths can't be false, the counterfactual "if $P$ were false" is vacuously true (or impossible), making sensitivity impossible to satisfy in the standard way. The friend concludes we can't know necessary truths (or they don't exist).
      *   **The User's Objection:** The user spots a tension between (2) and (4) regarding *necessary* truths. If math truths are necessary, the antecedent of the sensitivity counterfactual ("had the facts been different") describes an impossible world.
      *   **The Friend's Reply:** The vacuity *is* the point. Empirical facts allow sensitivity stories; necessary facts don't. Therefore, no knowledge of necessary facts.
