      *   *The "Explanation" Requirement (Premise 1):* We still need to explain *why* the method is stable. This is the Field/Clarke-Doane challenge. The Platonist needs a "Third Factor" explanation (e.g., mathematical concepts are grounded in cognitive structures that track truth, or evolutionary pressure selected for useful math which happens to be true).
      *   *The User's specific question:* "Which step to give up?" -> Give up the specific formulation of (2) that demands counterfactual variation of the *fact*.
      *   *The Equivocation:* Between "Sensitivity to the Fact" (requires fact to vary) and "Reliability of the Method" (requires method to be stable).

