prompt: |-
  I lead a small strategic foresight function at a reinsurance company, and one of my recurring jobs is running our quarterly scenario-forecasting exercise. Six analysts independently assign probabilities to a list of questions — whether a specific piece of regulation passes this year, whether a named hurricane season exceeds a loss threshold, whether a major counterparty gets downgraded below a certain rating — and then we meet to produce the single set of numbers that goes into our capital-planning report. The disagreements are persistent: the same two or three people land far apart on the same kinds of questions, quarter after quarter, and the meetings have degraded into a ritual where each side restates its case and we split the difference. Years ago I took a course that touched on Bayesian epistemology, and I've since read just enough about the common prior assumption and Aumann-style agreement results to suspect we're using them badly in both directions: sometimes we treat disagreement as if it must reflect genuinely different information when it's really just different starting beliefs or different gut-level weightings, and sometimes we assume we must share priors when in fact one analyst has a considered structural view the others don't hold.

  What I'd like is a decision procedure my team can actually run on a single disagreement, in under an hour, before the number goes into the report. It should walk through, in order: how to establish what evidence each person is actually conditioning on and whether there is real private information in the room; how to test whether the disagreement survives full disclosure of that evidence; what to conclude if it does survive — in particular, when the common prior assumption is a useful idealisation that tells us someone is double-counting or under-weighting shared evidence, and when it is simply false for our team and heterogeneous priors should be admitted as an honest modelling choice; whether and when averaging, mediation, or deferred escalation to an underwriter with authority is the right output; and where the procedure must stop and hand the judgement to a person because the question is one of values or risk appetite rather than probability. Please be explicit about the points where the procedure will misfire — for instance, where 'revealing your evidence' is impossible because it's tacit judgement built from twenty years of pricing, and where pooling opinions can launder correlated errors into a false consensus.

  Then run the procedure on three real-shaped disagreements from our last exercise: an analyst who assigns 70 per cent to the regulation passing versus one at 35 per cent, where the optimist has seen early draft language the others haven't; the same spread on a question about an emerging cyber-loss accumulation scenario, where both analysts have read identical material but one lived through a different historical loss event and openly says her 'prior' is different; and a case where four analysts are clustered at 55–65 per cent but the holdout at 15 per cent is the one with the strongest track record. On the third case especially, I expect the procedure may give an answer I won't like, and I'd rather know that than keep chairing these meetings by splitting the difference. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of a small strategic foresight function at a reinsurance company.
      *   **Task:** Running quarterly scenario-forecasting exercises (probability assignments on specific events).
      *   **Problem:** Persistent disagreements among six analysts. Meetings degrade into restating cases and splitting the difference (averaging).
      *   **Theoretical Background:** User knows some Bayesian epistemology (common prior assumption, Aumann's agreement theorem) but suspects misapplication (treating belief differences as information differences, or vice versa).
      *   **Goal:** A practical decision procedure (under 1 hour) to resolve single disagreements before reporting.
      *   **Required Steps in Procedure:**
          1.  Establish evidence conditioning & private information.
          2.  Test disagreement after full disclosure.
          3.  Analyze surviving disagreement (Common Prior vs. Heterogeneous Priors).
          4.  Decide on output (Averaging, Mediation, Escalation).
          5.  Identify limits (Values/Risk Appetite vs. Probability).
          6.  Explicitly state failure modes (tacit knowledge, correlated errors).
      *   **Application:** Run the procedure on three specific cases:
          1.  Regulation (70% vs. 35%): Optimist has seen draft language others haven't (Information Asymmetry).
          2.  Cyber-loss (70% vs. 35%): Same material, different historical experience/prior (Heterogeneous Priors).
          3.  Outlier (Cluster 55-65% vs. Holdout 15%): Holdout has best track record (Expertise vs. Consensus).
      *   **Tone/Style:** British English, professional, rigorous but practical.
      *   **Constraint:** The user expects the procedure might give an uncomfortable answer on the third case and wants honesty over comfort.

  2.  **Develop the Decision Procedure (The "Foresight Reconciliation Protocol"):**

      *   *Time Limit:* Needs to be tight. 60 minutes max.
      *   *Philosophy:* Blend Bayesian updating with practical group dynamics. Avoid "splitting the difference" as a default.
      *   *Step 1: Evidence Audit (15 mins).* Focus on *what* they know, not *what* they think. Distinguish public vs. private info.
      *   *Step 2: The Disclosure Test (15 mins).* Share the private info. Do probabilities converge?
      *   *Step 3: Prior Diagnostic (15 mins).* If they still disagree, is it priors or processing? Use the "Common Prior" check. Is one double-counting? Is one ignoring structural models?
      *   *Step 4: Resolution Mechanism (10 mins).* Weighted averaging? Deference? Escalation?
      *   *Step 5: Value/Preference Check (5 mins).* Is this actually about risk appetite?
      *   *Failure Modes:* Must explicitly list where this breaks (tacit knowledge, groupthink).

  3.  **Apply the Procedure to the Three Cases:**

      *   **Case 1: Regulation (70% vs. 35%).**
          *   *Analysis:* Clear information asymmetry. One has draft language.
          *   *Procedure Outcome:* The 35% group must update based on the draft. If the draft is credible, the 70% is likely closer to the truth, or the 35% group needs to explain why the draft is misleading.
          *   *Verdict:* Not a prior disagreement. It's an information gap. Share the draft. If the draft is solid, move towards 70%. If the draft is non-binding rumour, discount it.
      *   **Case 2: Cyber-loss (70% vs. 35%).**
          *   *Analysis:* Same info, different priors due to lived experience.
          *   *Procedure Outcome:* This is a legitimate Heterogeneous Prior case. Aumann's agreement doesn't apply because the "Common Prior" assumption is false here. One analyst's "prior" is actually a heuristic based on unmodelled data (their career).
          *   *Verdict:* Do not average blindly. Acknowledge the structural view. Perhaps run two scenarios (bimodal distribution) or weight the experienced analyst higher *if* the experience is relevant.
      *   **Case 3: The Outlier (Cluster 55-65% vs. Holdout 15%).**
          *   *Analysis:* Groupthink vs. Expert. Holdout has best track record.
          *   *Procedure Outcome:* This is the uncomfortable one. The procedure should flag "Correlated Error" in the cluster. The holdout might possess tacit knowledge or simply better calibration.
          *   *Verdict:* Defer to the holdout or significantly weight them. Splitting the difference is dangerous here. It validates the mediocre consensus over the proven expert.
          *   *User Warning:* Acknowledge this undermines the "wisdom of crowds" if the crowd is correlated.

  4.  **Drafting the Content (Iterative refinement for British English and Tone):**

      *   *Tone:* Professional, direct, slightly academic but grounded in reinsurance reality. Use "programme," "centre," "modelling," etc.
      *   *Structure:*
          1.  Introduction (acknowledging the difficulty).
          2.  The Protocol (Step-by-step).
          3.  Failure Modes (Crucial section).
          4.  Application to Cases.
          5.  Conclusion.
      *   *Refining the Bayesian bits:* Ensure I don't get too bogged down in math. Keep it conceptual. Aumann's Agreement Theorem says rational agents with common priors cannot agree to disagree. If they disagree, either priors aren't common or they aren't rational/updating correctly. The procedure needs to diagnose which.
      *   *Refining the "Values" aspect:* Reinsurance often conflates "likelihood of event" with "tolerance for risk." Need to separate $P(Event)$ from $Utility(Event)$.

  5.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "under an hour" constraint? Yes, break down the timings.
      *   *Check:* Did I address the specific theoretical points (Common Prior, Aumann)? Yes, in Step 3.
      *   *Check:* Is the third case handled honestly? Yes, I need to make sure I don't shy away from saying the majority might be wrong.
      *   *Check:* British English spelling and idioms (e.g., "programme," "centre," "whilst," "modelling").
      *   *Check:* Did I mention "tacit knowledge"? Yes, in failure modes.
      *   *Check:* Did I mention "correlated errors"? Yes, in failure modes and Case 3.

  6.  **Final Polish:** Ensure the distinction between *epistemic* disagreement (facts/probability) and *aleatory* or *value-based* disagreement (risk appetite) is clear. Ensure the recommendation for Case 1 emphasizes information sharing, Case 2 emphasizes scenario planning, and Case 3 emphasizes expert weighting.

  *(Self-Correction on Case 3)*: I need to be careful not to simply say "always back the expert." The procedure must *test* why they are the outlier. Is it genuine insight or contrarianism for its own sake? The protocol needs a step to validate the *reasoning*, not just the track record. I will add a "Reasoning Audit" to Step 3.

  *(Self-Correction on Case 1)*: If the draft language is private/insider, can it be shared? In a reinsurance context, maybe not broadly. I should note the compliance constraint. If it can't be shared, the probability cannot be aggregated socially, only by the lead. I will add a note on information barriers.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **To:** Head of Strategic Foresight
  **From:** Strategic Advisory
  **Subject:** Protocol for Probabilistic Reconciliation and Case Analysis

  You have correctly identified the core pathology in your current process. You are treating epistemic disagreements (differences in belief about the world) as if they are merely negotiation points to be averaged, whilst simultaneously trying to enforce a Bayesian ideal (common priors) on a team that necessarily holds heterogeneous worldviews. In reinsurance, where tail risk is paramount, 'splitting the difference' is not a neutral act; it is a specific modelling choice that assumes errors are uncorrelated and symmetric. Often, they are not.

  Below is a decision procedure designed to fit within a sixty-minute window, followed by an application to your three specific cases.

  ### The Foresight Reconciliation Protocol (FRP)

  **Time Allocation:** 60 Minutes
  **Participants:** The disagreeing analysts + Facilitator (you)
  **Objective:** Produce a single probability entry or a justified dual-scenario entry for the capital report.

  #### Phase 1: The Evidence Audit (15 Minutes)
  **Goal:** Distinguish information asymmetry from interpretation differences.
  **Action:**
  1.  **List Conditioning Information:** Each analyst must list the specific data points, reports, or signals they are conditioning on. Not "I think the market is soft," but "I am conditioning on the Q3 loss ratio report from Broker X."
  2.  **Identify Private Information:** Flag any item not available to the whole group.
  3.  **The Disclosure Test:** If private information exists, can it be shared?
      *   *Yes:* Share it immediately. Re-calculate probabilities individually. If convergence occurs, stop here.
      *   *No (Compliance/Confidentiality):* The holder of the information cannot persuade the group epistemically. The group must defer to the holder's judgement or treat the probability as a 'black box' input. Do not average.

  #### Phase 2: The Prior Diagnostic (20 Minutes)
  **Goal:** Determine if the Common Prior Assumption (CPA) holds.
  **Context:** Aumann's Agreement Theorem suggests rational agents with common priors cannot agree to disagree. If they do disagree after sharing evidence, either they are irrational (updating errors) or they do not share priors.
  **Action:**
  1.  **Check for Updating Errors:** Ask the outliers: "If your colleague's evidence were true, would you accept their conclusion?" If yes, the issue is trust in the source, not the logic. If no, proceed to step 2.
  2.  **Identify Structural Priors:** Ask: "Is your probability derived from a structural model (e.g., physical hazard models, legislative tracking) or a heuristic (e.g., 'markets always overreact')?"
  3.  **The Heterogeneity Test:** If one analyst's 'prior' is actually a compression of twenty years of unrecorded experience (tacit knowledge), the CPA is false. You are not looking at a probability error; you are looking at a model specification difference.
      *   *Verdict:* If priors are legitimately heterogeneous (e.g., different views on structural regime change), do not force consensus. Record the divergence.

  #### Phase 3: Resolution Mechanism (15 Minutes)
  **Goal:** Select the aggregation method.
  **Action:** Choose one of the following based on Phase 1 & 2 findings:
  1.  **Information-Led Deference:** If one party holds verified private information (Case 1), their probability dominates.
  2.  **Expertise-Weighted Aggregation:** If track records differ significantly (Case 3), weight the probabilities by calibration scores, not headcount.
  3.  **Scenario Splitting:** If priors are legitimately heterogeneous (Case 2), do not average. Enter two lines in the report: 'Base Case' and 'Alternative View'.
  4.  **Escalation:** If the disagreement stems from risk appetite masquerading as probability (e.g., "I think it's unlikely because we can't afford it"), escalate to the Chief Underwriting Officer. This is a value judgement, not a forecast.

  #### Phase 4: The Value Check (10 Minutes)
  **Goal:** Prevent 'risk appetite' contaminating 'likelihood'.
  **Action:** Ask: "If this event had zero financial impact on us, would your probability change?"
  *   If **Yes**: It is a pure probability judgement.
  *   If **No**: You are discussing utility, not probability. Stop the forecasting exercise and flag for capital planning discussion.

  ---

  ### Explicit Failure Modes of the FRP

  You requested honesty regarding where this procedure will misfire. Be aware of the following:

  1.  **The Tacit Knowledge Trap:** In Phase 1, an analyst may say, "I can't show you the data, it's my feel for the market." The FRP treats this as a Heterogeneous Prior. However, it may simply be overconfidence. The procedure cannot validate tacit knowledge in under an hour; it can only flag it.
  2.  **Correlated Error Laundering:** If four analysts agree (Case 3), the FRP warns against averaging. However, if the 'expert' holdout is having a bad year, deferring to them increases variance. The procedure relies on *long-term* track records. If your track record data is noisy (few quarters), the 'expert' label may be a statistical artefact.
  3.  **The 'Compromise' Pressure:** Even with this protocol, social pressure to 'be a team player' may lead analysts to feign convergence in Phase 2. You must enforce that 'Agreeing to Disagree' is a valid output.
  4.  **Information Barriers:** In Case 1, if the private information cannot be shared due to Chinese Walls, the group cannot update. The procedure dictates deference, but this creates a 'key man' risk. If that analyst leaves, the institutional logic leaves with them.

  ---

  ### Application to Your Three Cases

  Here is how the FRP applies to your specific recurring disagreements.

  #### Case 1: The Regulation (70% vs. 35%)
  *   **The Situation:** Optimist (70%) has seen early draft language; Pessimist (35%) has not.
  *   **FRP Analysis:**
      *   **Phase 1 (Evidence):** This is a clear Information Asymmetry. The Common Prior Assumption is irrelevant because the conditioning sets are not equal.
      *   **Phase 2 (Disclosure):** Can the draft language be shared?
          *   *If Yes:* Share it. The 35% group must update. If they remain at 35% after reading the draft, they are arguing the *interpretation* of the text, not the likelihood of its existence.
          *   *If No (Compliance):* You cannot average these numbers. Averaging implies the 35% group's ignorance is a valid data point. It is not.
      *   **Verdict:** **Information-Led Deference.** The number in the report should be close to 70%, perhaps discounted slightly (e.g., to 60%) to account for the risk that the draft changes before ratification. The 35% view is not a probability assessment; it is a statement of ignorance. To average them is to penalise the team for having better intelligence.
      *   **Action:** Enter 60-70%. Document that this relies on non-public draft language.

  #### Case 2: The Cyber-Loss Accumulation (70% vs. 35%)
  *   **The Situation:** Same material. Analyst A (70%) lived through a different historical loss event; Analyst B (35%) did not. Analyst A explicitly cites a different 'prior'.
  *   **FRP Analysis:**
      *   **Phase 1 (Evidence):** Information is symmetric.
      *   **Phase 2 (Priors):** Analyst A's 'prior' is actually a heuristic derived from unmodelled historical data (their career experience). This violates the Common Prior Assumption. Analyst B is likely using a standard industry model which assumes stationarity. Analyst A believes the regime has changed.
      *   **Phase 3 (Resolution):** Averaging (52.5%) implies the truth is likely between 'structural break' and 'stationarity'. In cyber risk, this is dangerous. If A is right, the loss is catastrophic. If B is right, it is manageable.
      *   **Verdict:** **Scenario Splitting.** Do not produce a single number. The disagreement is structural.
      *   **Action:** Submit two figures to the capital report: 'Base Case (35%)' and 'Stress Case / Experienced View (70%)'. If a single number is mandatory, you must weight Analyst A higher *not* because they are more optimistic, but because their prior incorporates data (lived experience) that the model B is using ignores. However, the honest output is a bimodal distribution.

  #### Case 3: The Outlier (Cluster 55–65% vs. Holdout 15%)
  *   **The Situation:** Four analysts cluster at ~60%. One holdout is at 15%. The holdout has the strongest long-term calibration record.
  *   **FRP Analysis:**
      *   **Phase 1 (Evidence):** Assume evidence is shared.
      *   **Phase 2 (Priors & Errors):** This is the critical test of your function. The cluster represents a 'consensus prior'. The holdout represents a 'calibrated prior'.
      *   **The Trap:** The instinct is to assume the four are right and the one is wrong (Wisdom of Crowds). However, in reinsurance foresight, analysts often share the same information sources (same brokers, same reports). Their errors are **correlated**. The 'crowd' is actually one data point repeated four times.
      *   **Phase 3 (Resolution):** The FRP dictates **Expertise-Weighted Aggregation**. If the holdout has a proven track record of calibration (e.g., via Brier scores over previous years), their deviation is signal, not noise.
      *   **Verdict:** **Deference to the Expert.** This is the answer you feared. If you average this (approx. 50%), you are actively degrading the quality of your forecast by diluting proven skill with unproven consensus. You are laundering correlated error into a false moderate view.
      *   **Action:** Enter 15-20%.
      *   **Caveat:** You must audit *why* the holdout is low. Is it genuine insight, or contrarianism? Ask them to articulate the *mechanism* by which the event fails to occur. If the mechanism is sound, trust the track record. If the mechanism is "I just feel it's wrong," revert to the weighted average.
      *   **Management Note:** This will be politically difficult. You must frame this to senior management not as "ignoring the team," but as "adjusting for analyst calibration scores." If you have not been tracking calibration scores formally, start now. Without that data, you cannot justify overriding the consensus.

  ### Summary Recommendation

  Your current practice of 'splitting the difference' assumes that error is random and independent. In a small team reading the same reports, error is systematic and correlated.

  1.  **Case 1:** Do not average. Trust the information advantage.
  2.  **Case 2:** Do not average. Report the divergence as scenario uncertainty.
  3.  **Case 3:** Do not average. Weight by track record.

  If you implement the FRP, you will stop running 'meetings' and start running 'audits'. The discomfort you feel regarding Case 3 is the correct reaction; it highlights that your previous consensus was likely a comfort blanket, not a forecast.
