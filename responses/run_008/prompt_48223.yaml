prompt: |-
  I'm putting together an episode for my tiny decision theory podcast (like 200 listeners, very in the weeds) and next week's guest is a decision theorist — let's call him Dr. K — who has spent the last few years arguing that "commitment races" are one of the most underrated catastrophic risks from advanced AI, possibly worse than the scenarios people usually obsess about. Quick background in case it helps: a commitment race is a situation where agents each do better by being the FIRST to irrevocably bind themselves to some bargaining position — say, committing to walk away from any deal unless they get at least 60% of the surplus — because once that commitment is out there and credible, the other side does best by just conceding. If both agents race to commit, or bind themselves to incompatible positions before they can coordinate, everyone can end up far worse off than if neither had ever been able to bind themeselves at all.

  Dr. K is sharp but he has this stock deflection: whenever you press him on any of the holes in his story, he waves it off as an engineering detail and pivots back to how scary the basic dynamic is. I want a question list that makes that deflection progressively harder to use over the course of the interview.

  Draft me ten or so interview questions. Requirements: (1) at least one on whether updatelessness just dissolves the whole problem — I expect him to reply that an updateless agent still has to pick a policy under uncertainty about which other agents are out there, so the race just moves up a level, and I want a follow-up keyed to exactly that reply; (2) one on the credibility condition — a commitment made in a race only helps if the other side can verify it before racing themselves, but verification takes time and the whole problem is that time pressure is what destroys the common knowledge you'd need, so push him on whether any race can actually be lost cleanly; (3) one on the free-rider worry — if binding yourself is so dangerous, what happens to the agents who just quietly don't commit and exploit everyone who did; (4) at least one on his pet idea, which he calls commitment liquidity — he claims future agents will be able to unwind each other's commitments through side-contracts, and honestly I don't see how that avoids just re-creating the original bargaining problem one level up, so make him face that. For each question, include the follow-up you'd expect to need depending on his most likely answer. Nothing generic like asking how he got into the field — we only have 40 minutes.

  Please make the very last line a one-sentence summary of the overall arc of the interview, since I paste that into my episode notes.
