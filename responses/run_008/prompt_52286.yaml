      *   *Definition:* An agent wrongs a future person if they cause that person to exist with serious burdens (pain, disability, deprivation) when they could have easily acted differently to cause a *different* person to exist without those burdens, *unless* the alternative action imposes a significant burden on the agent or involves accepting standard biological risks.

      *   *Wait, Case 5 (Deaf Parents).* This is the hardest. If Deafness isn't a "serious burden" (per Deaf culture), the principle doesn't condemn it. If it is, it does. The user is flip-flopping. I need to address this.
