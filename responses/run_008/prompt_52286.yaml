      *   Make sure to distinguish "Wronging" from "Harming." This is crucial for Case 2. You can wrong someone without making them worse off than they would otherwise be (by imposing conditions they have strong reasons to reject).
      *   *Revised Principle:* **The Principle of Unjustifiable Imposition.**
