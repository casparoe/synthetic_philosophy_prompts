          *   *Detectability:* This is the tricky part. If the correlations are strictly hidden variables that only manifest to preserve QM statistics, they might be undetectable *by design*. But it makes the "independent preparation" a fiction.
      *   **The Completeness Claim: Colbeck-Renner.**
