      *   *Retrocausality:* A way out for PBR/Bell, but costs causality.
      *   *Superdeterminism:* Another way out, costs free will/statistical independence.
      *   *Explanatory Power:* Does it actually explain anything better than Many Worlds or Bohm?
      *   *Unfalsifiability:* If every no-go theorem is dodged by an auxiliary assumption (like denying preparation independence), is it science?

  3.  **Organizing and Ranking Defeaters:**

      *   *Fatal:* Nothing is truly "fatal" in philosophy of physics unless empirical data contradicts QM itself. So "Fatal" means "Requires giving up a deeply held metaphysical or methodological principle that makes the view unattractive to almost everyone."
      *   *Serious:* Requires significant conceptual costs (e.g., retrocausality, superdeterminism, radical holism).
      *   *Awkward:* Philosophical nagging questions that don't break the math but make the view messy.

