      *   **Output Format:** Detailed analysis followed by a specific machine-readable tag on the final line: `\answer{...}` (options: `well-insulated`, `exposed-but-defensible`, `seriously-exposed`).

  2.  **Brainstorming Candidate Defeaters:**
      *   *PBR Theorem (Pusey-Barrett-Rudolph):* The big one. Assumes Preparation Independence.
