prompt: |-
  You're a philosopher of physics — sharp, agnostic between interpretations, and allergic to hand-waving. Think carefully before answering, and maybe do a quick brainstorm of candidate defeaters first, then organize them; don't just list objections in the order they occur to you.

  For years I've been sympathetic to the plain Copenhagen line I was taught: the quantum state is a bookkeeping device, not a physical field sitting out there in configuration space. Lately I've gone further and find myself basically holding a psi-epistemic view (in the Harrigan–Spekkens sense): the wavefunction is like a probability distribution — it represents someone's information about a system, not the system itself. Part of what pulled me in was Spekkens' toy theory from the mid-2000s, which reproduces a surprising amount of quantum behavior with a strict knowledge-vs-state distinction, plus the general intuition that a physical object shouldn't live in configuration space and shouldn't be constantly doing something vast and nonlocal when nobody's looking.

  So: what would count against this? I know about the PBR theorem from around 2012, which is supposed to be the big threat — but from what I understand it needs an extra assumption, something like: separately prepared systems have independent underlying states. So I want you to go through the possible defeaters and rank them from fatal through serious to merely awkward. For each, tell me what the world would have to look like for it to actually bite — e.g. which assumption would have to fail for PBR, and what a universe where that assumption fails would be like: would correlations between supposedly independent preparations ever be detectable in practice, or is it a corner of reality that's forever unobservable? Also cover the things people usally throw at this view that I suspect a committed defender would just shrug off — Bell, Kochen–Specker, the "if it's just knowledge, then knowledge OF what?" question — and say honestly which of those a defender should concede stings and which are bullets they've already decided to bite. And be straight with me about whether the view, once all its qualifications are stacked up, still risks anything at all: has it been insulated into unfalsifiability, and if so, is that a defect for a view of this kind, or just what you get with any interpretation-level claim?

  At the very end, state your overall conclusion in a fixed machine-readable form on its own final line: \answer{...} containing exactly one of: well-insulated, exposed-but-defensible, seriously-exposed.
