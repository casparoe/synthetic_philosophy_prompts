answer: |-
  This is one of the sharpest observations I have encountered regarding the methodology of Bronze Age archaeology and biblical historiography. You have identified a structural flaw in how historical probability is aggregated, and you are right to feel that the standard labels (bias, fallacy, euhemerism) do not quite capture the mechanics of it.

  As a philosopher of history who has spent considerable time watching the "Biblical Maximalist" debates play out in the 1990s and 2000s, I can tell you that this phenomenon is the engine room of popular ancient history. It is the reason we have "The Exodus" in museums and "The Trojan War" in documentaries, despite the absence of a single contemporary text saying "We fought Troy for ten years" or "We left Egypt in a mass migration."

  Here is the breakdown of the concept, the near-misses, the actual mechanism, and the principled line you need for your author's note.

  ### 1. The Near-Misses (And Why They Fail)

  To isolate the phenomenon, we must first clear away the concepts that look similar but describe different errors.

  *   **Euhemerism:** As you noted, this is the *theory* that myths are distorted history. It is the conclusion, not the method. It doesn't explain *how* the distortion is reverse-engineered back into fact.
  *   **The Texas Sharpshooter Fallacy:** This implies the data was cherry-picked *after* the conclusion was drawn. In your examples, the data (the mound, the destruction layer, the names) is genuine and identified independently. The error isn't in selecting the data, but in how the data is *weighted*.
  *   **Motte-and-Bailey:** This is a rhetorical defense tactic (retreating to a defensible claim when attacked). What you are describing is a constructive argumentative drift. Scholars aren't defending; they are building. They aren't retreating from "The War Happened" to "A City Existed"; they are sliding from "A City Existed" to "The War Happened" without noticing the transition.
  *   **Confirmation Bias:** This is too psychological. It describes a mental state. You are describing a *logical structure* that persists even among honest, rigorous scholars who think they are avoiding bias.
  *   **Consilience (Whewell):** This is the positive ideal. Consilience occurs when independent lines of evidence converge on a *single specific conclusion*. The problem here is that the evidence converges on a *context*, but the conclusion is a *narrative*. The evidence says "Violence happened here in 1180 BCE." The conclusion says "Agamemnon caused it." That is not consilience; it is interpolation.

  ### 2. The Core Mechanism: Inference to the Best Explanation (IBE) Gone Rogue

  The philosophical engine driving this is **Inference to the Best Explanation (IBE)**. This is a standard abductive reasoning method: *Given evidence E, Hypothesis H explains E better than Hypothesis H2. Therefore, H is likely true.*

  In the case of Troy or the Exodus, the argument runs like this:
  1.  **Evidence:** We have a destroyed city (Troy VIIa), we have Hittite texts mentioning unrest in the Wilusa region, and we have a persistent oral tradition about a war.
  2.  **Hypothesis A (The Legend):** A coalition of Ahhiyawa attacked Wilusa over a period of time.
  3.  **Hypothesis B (The Null):** The city was destroyed by earthquake or local raiding, and the oral tradition is a later mythologizing of various unrelated conflicts.
  4.  **The Move:** Scholars argue Hypothesis A is the "Best Explanation" because it accounts for the *scale* of the destruction, the *specificity* of the names, and the *persistence* of the story.

  **The Error:** This is **Abductive Overreach**.
  Hypothesis A (The War) is a *more complex* explanation than Hypothesis B. It requires more specific conditions to be true (a specific coalition, a specific cause, a specific duration). In Bayesian terms, Hypothesis A has a much lower *prior probability*. For the evidence to support A, it must be *highly specific* to A.

  However, the evidence cited (a destruction layer, a name match) is usually *compatible* with A, but not *diagnostic* of A. A destruction layer is compatible with an earthquake. A name match is compatible with cultural memory preserving a place name without an event.

  When scholars treat *compatibility* as *confirmation*, they commit the **Fallacy of Contextual Conflation**.

  ### 3. Defining the Phenomenon: The Fallacy of Contextual Conflation

  Since there is no single standard term in the canon (which tells you how normalized this error has become), I propose we label this **The Fallacy of Contextual Conflation** (or **Narrative Transfer**).

  **Definition:** The logical error of transferring the historical probability of a *setting* (background conditions) to the *narrative* (foreground events) that inhabits it, based solely on the compatibility between the two.

  **How it works:**
  1.  **Verification of the Stage:** Archaeology proves the "stage" exists (Troy is real, Bronze Age Greece is real, Egypt held Semitic laborers).
  2.  **Verification of the Props:** Archaeology proves the "props" exist (Mycenaean weapons in Turkey, Semitic names in Egypt).
  3.  **The Conflation:** Because the stage and props are real, the *script* is assumed to be a recording of reality rather than a fiction written for that stage.

  **Why it feels convincing:**
  It relies on the intuition that *fiction requires imagination, but history requires evidence.* If the details match the evidence, it feels like history. But historical fiction writers (like yourself) know that you can build a perfectly accurate stage and put the wrong play on it. The accuracy of the pottery does not validate the accuracy of the political causality.

  **The "Smoke Without Fire" Proverb:**
  This is the rhetorical shield for Contextual Conflation. It assumes that a narrative of this magnitude *cannot* exist without a singular causal event. But anthropology suggests otherwise. Myths often aggregate decades of low-level conflict into a single "War," or project a single battle into a ten-year siege. The "Fire" might be a hundred small candles, not one bonfire. The proverb forces a singular event where the evidence only supports a condition.

  ### 4. The Principled Line: Setting vs. Story

  You asked for the boundary between evidence that the *world* existed and evidence that the *story* happened. This is the distinction between **Historicity of Environment** and **Historicity of Agency**.

  **Historicity of Environment (The World):**
  *   **Evidence Type:** Stratigraphy, pottery typology, paleobotany, settlement patterns.
  *   **What it proves:** "People lived here," "This city burned," "This culture traded with that one."
  *   **Status:** Establishable. This is where the "weak findings" you mentioned live. They are real.

  **Historicity of Agency (The Story):**
  *   **Evidence Type:** Contemporary textual records of *specific actions*, diplomatic correspondence referencing the *specific conflict*, mass graves with trauma patterns matching the *narrative description*, casualty lists with names matching the *protagonists*.
  *   **What it proves:** "King X attacked City Y in Year Z for Reason Q."
  *   **Status:** Rarely establishable in the Bronze Age.

  **The Line:**
  The line is crossed when you move from **Correlation** to **Causation** without a contemporary witness.
  *   *Valid:* "The destruction of Troy VIIa correlates with the period described in the Iliad."
  *   *Invalid:* "The destruction of Troy VIIa was caused by the war described in the Iliad."

  To validate the second claim, you would need a text from 1180 BCE saying, "The Achaeans are besieging us," found *in* the destruction layer. Without that, you have a *context* for the myth, not a *cause* for the myth.

  ### 5. Implications for Your Author's Note

  You are writing fiction. Your goal is not to solve the historiography, but to be honest about your relationship to it. The "Contextual Conflation" trap is dangerous for a novelist because it tempts you to treat the "Kernel of Truth" as a scaffold you can rely on.

  If you write "Based on true events," you are implicitly endorsing the Fallacy of Contextual Conflation. You are telling the reader that the *narrative arc* (the war, the cause, the specific heroes) has historical weight. Given the state of the evidence, this is epistemically dishonest.

  If you write "Set in a mythical past," you risk alienating readers who want the grit of history.

  **The Solution:**
  You need a phrase that acknowledges the **Historicity of Environment** without committing to the **Historicity of Agency**.

  *   *Option A:* "While the cities, cultures, and conflicts of this novel are drawn from archaeological and historical record, the specific events and characters are imagined."
  *   *Option B:* "This story is set within the historical framework of the Late Bronze Age, but the narrative is a reconstruction of myth, not a record of fact."
  *   *Option C (My recommendation):* **"Inspired by the legends and history of the Bronze Age."**

  "Inspired by" is the crucial operator here. It allows you to use the real destruction layers (the inspiration) without claiming the war happened as described (the legend).

  ### Summary for your Mental Model

  When you are researching, and you feel that friction—where a destruction layer *feels* like proof of the war—recognize it as **Contextual Conflation**.

  *   **The Evidence:** Proves the *possibility* of the event.
  *   **The Tradition:** Proves the *memory* of the event.
  *   **The Gap:** Nothing proves the *accuracy* of the memory.

  Scholars fill that gap with "Inference to the Best Explanation." You, as a novelist, should fill that gap with "Imagination." If you treat the scholarly inference as fact, you are building your house on the same shaky aggregation they are.

  Use the "weak findings" to build your world (the mud, the walls, the weapons). Do not use them to constrain your plot (the reason for the war, the specific timeline, the hero's motivation). The world is real; the story is the ghost that haunts it. Treat it as such.
