      *   **Constraints:** No bibliography/reading list. Needs deep conceptual analysis. Act as a philosopher of history/biblical archaeology expert. Brainstorm near-miss concepts first, explain why they don't fit, then define the actual phenomenon (name it if necessary). Address the boundary between "world existed" and "story happened."
