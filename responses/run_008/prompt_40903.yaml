      *   *Wait, one strong candidate:* **The Fallacy of Composition** applied to evidence. But better: **The Illusion of Convergent Validation.**
      *   *Actually, in Biblical Studies, this is often called "The Parallelomania" (Sandmel), but that's comparing texts.*
      *   *Let's go with a refinement of **Inference to the Best Explanation (IBE)**.* The error is **Premature Closure on IBE**.
