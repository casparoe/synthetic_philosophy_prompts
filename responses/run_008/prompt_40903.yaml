          *   *Euhemerism:* That's the *theory*, not the *proof method*.
          *   *Motte-and-Bailey:* That's defensive. This is constructive.
          *   *Confirmation Bias:* Too psychological. This is structural.
      *   *The Core Concept:* It's an error in **Inference to the Best Explanation (IBE)**. Scholars decide "War" explains the data better than "Accident," but they ignore that "War" requires *more* assumptions than "Accident + Myth."
