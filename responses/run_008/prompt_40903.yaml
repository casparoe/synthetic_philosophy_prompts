      *   It's not *Cumulative Case Argument* (that's a legitimate philosophical tool, but often misused here).
      *   *Key Feature:* The transfer of probability from the *context* to the *narrative*. The background is verified, so the foreground is assumed.

  3.  **Brainstorming Candidate Concepts (and rejecting/refining them):**
      *   *Argument from Consilience:* This is the positive version. Whewell's idea that independent lines of evidence converge. *Problem:* Consilience requires the evidence to point to the *same specific conclusion*. Here, the evidence points to "culture existed," but the conclusion is "specific war happened." It's a *false* consilience.
      *   *Contextual Validation:* Verifying the setting validates the plot. *Problem:* Not a formal fallacy name.
      *   *Narrative Fallacy:* Taleb's concept. We prefer stories. *Problem:* Explains why we like the conclusion, not how the evidence is aggregated.
      *   *The Fallacy of Composition:* Assuming the whole has the properties of the parts. *Problem:* Close, but usually logical (parts are heavy, so whole is heavy). Here it's evidentiary weight.
