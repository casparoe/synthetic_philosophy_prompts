      *   **Specific Observations:**
          *   Salmon: Mandatory stunning before killing (no asphyxiation/ice slurry).
          *   Shrimp: Eyestalk ablation on breeding females permitted (no anesthesia/analgesia, no limit on repetition).
          *   Cleaner Fish (lumpfish/wrasse): Few species-specific provisions, often destroyed at season's end.
          *   Audit Method: Checklist-based (mortality %, water quality, lesion scores, stocking density). Pass/fail based on observable/recordable metrics during a visit.
      *   **Questions:**
          *   What theory/theories of welfare does this pattern presuppose?
          *   Which requirements presuppose specific theories vs. are compatible with several?
          *   Where is the package underdetermined?
          *   Does the checklist method itself presuppose something substantive (observability)?
          *   What would change if switched to a straightforward hedonistic theory?
      *   **Constraints:**
          *   Separate settled knowledge from contested philosophical disputes (do not present contested views as consensus).
          *   If the requirements are jointly inconsistent, say so plainly (do not smooth over incoherence).
          *   Tone: Analytical, honest, rigorous, respectful of the user's expertise.

  2.  **Deconstruct the Certification Scheme's Practices:**

      *   *Practice A: Salmon Stunning.*
          *   Implication: Pain/suffering during death matters.
          *   Theory Alignment: Hedonism (pain is bad), potentially Telos (violent death frustrates nature), but strongly suggests negative experience avoidance.
          *   Conflict: If pain matters this much for salmon, why not for shrimp?

      *   *Practice B: Shrimp Eyestalk Ablation.*
          *   Implication: Productivity trumps potential pain or integrity.
          *   Theory Alignment: Weak welfarism (only extreme suffering counts?), or Speciesism (shrimp don't count as much), or Operationalism (if we can't measure the pain easily, we ignore it).
          *   Conflict: Hard to reconcile with Practice A under a consistent hedonistic view unless there's a belief shrimp don't feel pain (contested science).

      *   *Practice C: Cleaner Fish.*
          *   Implication: Instrumental value. They are tools for the salmon.
          *   Theory Alignment: Hierarchy of moral worth.
          *   Conflict: If they are vertebrates (like salmon), why the disparity in protection?

      *   *Practice D: The Audit Checklist.*
          *   Implication: Welfare = Measurable Indicators.
          *   Theory Alignment: Operationalism/Behaviorism. "If it isn't measured, it doesn't count."
          *   Conflict: Mental states (pain, fear, frustration) are not directly observable. This privileges physical health over psychological state unless behavior is a perfect proxy (which is contested).

  3.  **Identify the Implicit Theory (The "Reconstruction"):**

      *   It's not a single philosophical theory (like Utilitarianism or Aristotelian Telos).
      *   It looks like **Pragmatic Operationalism mixed with Taxonomic Gradualism.**
      *   *Pragmatic Operationalism:* Welfare is what can be audited. If you can't measure it reliably in a 2-day visit, it's not a requirement.
      *   *Taxonomic Gradualism:* Vertebrates (Salmon) > Crustaceans (Shrimp) > "Minor" Vertebrates (Cleaner Fish). This isn't a welfare theory per se, but a moral status hierarchy.
      *   *Health-Based Proxy:* Welfare is equated with physical health and growth metrics (lesions, mortality, water quality).

  4.  **Address the Philosophical Disputes (Constraint 1):**

      *   *Welfare Definitions:* Hedonia (feelings) vs. Telos (nature) vs. Preferences. *Status:* Contested. No consensus.
      *   *Invertebrate Sentience:* Do shrimp feel pain? *Status:* Scientifically and philosophically contested (though evidence is growing).
      *   *Observability:* Can behavior/physiology fully proxy mental states? *Status:* Contested (Problem of Other Minds applied to animals).

  5.  **Evaluate Consistency (Constraint 2):**

      *   Is it inconsistent? Yes.
      *   *The Inconsistency:* The scheme treats "suffering" as decisive for salmon death (stunning required) but irrelevant for shrimp surgery (ablation allowed).
      *   *Explanation:* This cannot be justified by a *single* welfare theory applied consistently across species. It requires a *moral status* distinction (speciesism) or an *epistemic* distinction (we think we know salmon feel pain, we pretend shrimp don't).
      *   *Audit Method:* The checklist presupposes welfare is reducible to inputs and physical outcomes. This rules out "hidden" suffering (chronic stress without lesions, frustration without stereotypy).

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate that their suspicion is well-founded. State the thesis: The scheme does not operate on a unified philosophical theory of welfare, but rather on a hybrid of **Operationalism** and **Taxonomic Gradualism**, which creates logical tensions.
      *   **Section 1: The Audit Method (Operationalism).**
          *   Analyze the checklist.
          *   *Claim:* It presupposes welfare is observable/measurable.
          *   *Contestation:* Philosophers argue welfare is a *subjective experience*. Checklists measure *proxies*.
          *   *Implication:* Rules out unobservable suffering.
      *   **Section 2: The Species Disparity (Taxonomic Gradualism).**
          *   Salmon (Stunning) vs. Shrimp (Ablation).
          *   *Hedonism:* Inconsistent. If shrimp feel pain, ablation is a violation.
          *   *Telos:* Inconsistent. Ablation violates physical integrity.
          *   *Explanation:* The scheme implicitly ranks moral status. Salmon = High, Shrimp = Low/Instrumental.
