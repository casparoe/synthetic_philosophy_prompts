answer: |-
  This is a sharp and necessary interrogation of your own standards. You have identified a fracture line that runs through almost all contemporary animal certification: the gap between the philosophical definitions of welfare we cite in our mission statements and the operational realities of what we actually audit.

  To answer your question directly: Your scheme does not presuppose a single, coherent theory of animal welfare (such as hedonism, telos, or preference satisfaction). Instead, it operates on a hybrid of **Pragmatic Operationalism** and **Taxonomic Gradualism**.

  Below, I reconstruct this implicit framework, distinguish where the science and philosophy are settled versus contested, and locate the specific points of incoherence you suspected.

  ### 1. The Ontology of the Audit: Pragmatic Operationalism

  You asked whether the checklist method presupposes something substantive. It does. It presupposes **Operationalism**: the view that welfare is exhausted by, or at least sufficiently proxied by, variables that are inter-subjectively observable and recordable within a limited timeframe.

  *   **The Commitment:** Your standards treat welfare as a physical state (lesions, mortality, water chemistry) rather than a mental state (pain, fear, frustration). This is not merely a practical constraint; it is an ontological claim. It asserts that if a negative experience does not produce a measurable physiological or behavioral signature detectable during an audit, it does not count as a welfare violation for the purposes of certification.
  *   **Settled vs. Contested:**
      *   *Settled:* It is settled in auditing practice that mental states cannot be directly observed.
      *   *Contested:* It is **highly contested** among philosophers of animal welfare and ethologists whether physical indicators (like cortisol or lesion scores) are adequate proxies for subjective experience. A "Five Freedoms" or "Five Domains" framework claims to cover mental states, but your checklist reduces them to physical correlates. Many theorists argue this commits a category error: health is a *cause* or *effect* of welfare, but it is not welfare itself.
  *   **What this rules out:** This approach rules out "hidden" suffering. An animal could be chronically anxious or frustrated without showing stereotypies (common in fish) or lesions, provided the water quality and stocking density metrics pass. Under your current system, that animal has good welfare. Under a strict hedonic view, it may not.

  ### 2. The Taxonomic Inconsistency: Salmon vs. Shrimp

  Here we find the strongest evidence that your scheme lacks a unified welfare theory. The divergence between the salmon and shrimp standards cannot be reconciled under a single conception of what constitutes harm.

  *   **The Salmon Standard (Stunning):** This requirement presupposes that the *experience* of dying matters. Asphyxiation is banned not because it damages the flesh (though it can), but because it is presumed to be painful or distressing. This aligns with a **Hedonic View** (pain is bad) or a **Telos View** (a violent death frustrates the animal's nature).
  *   **The Shrimp Standard (Ablation):** Eyestalk ablation is a surgical procedure performed without anesthesia to manipulate reproductive physiology.
      *   If you hold a **Hedonic View:** You must believe shrimp either do not feel pain, or that their pain is morally negligible compared to the economic benefit of accelerated maturation.
      *   If you hold a **Telos/Integrity View:** You must believe that mutilating a crustacean does not violate its "wholeness" or natural functioning in a way that matters for certification.
  *   **The Inconsistency:**
      *   **Scientific Status:** The question of crustacean sentience is **contested**, though the weight of evidence is shifting toward the view that decapods are capable of nociception and potentially pain experience (leading to legal protections in the UK, Switzerland, and elsewhere). It is *not* settled science that shrimp do not feel pain.
      *   **Philosophical Status:** It is **incoherent** to require stunning for salmon (to prevent pain at death) while permitting ablation for shrimp (causing pain during life) unless you are employing a **Moral Hierarchy** that is independent of welfare theory.
      *   **Verdict:** Your scheme implicitly asserts that salmon have a higher moral status than shrimp. This is not a welfare theory; it is a speciesist valuation. A consistent hedonist would demand analgesia for shrimp or ban ablation. A consistent telos theorist would view ablation as a violation of integrity regardless of pain. Your standards license neither.

  ### 3. The Cleaner Fish: Instrumentalism

  The treatment of lumpfish and wrasse reveals a third implicit commitment: **Instrumentalism**.

  *   **The Commitment:** These animals are certified not as subjects of welfare in their own right, but as inputs for salmon welfare. Their lack of species-specific provisions and routine destruction at the end of the season indicates that their welfare counts only insofar as it impacts the primary product (salmon) or violates basic mortality thresholds.
  *   **The Tension:** Cleaner fish are vertebrates (like salmon). If your stunning requirement for salmon is based on vertebrate capacity for suffering, the lack of protection for cleaner fish is logically difficult to defend.
  *   **Settled vs. Contested:**
      *   *Contested:* There is no consensus on whether certification schemes have an obligation to protect "worker" animals equally to "product" animals. However, within welfare science, the capacity for suffering in wrasse and lumpfish is comparable to salmon. Treating them differently requires a justification other than welfare capacity (e.g., economic value).

  ### 4. Is the Package Jointly Inconsistent?

  You asked me to be plain if the requirements are inconsistent. **They are.**

  No single theory of animal welfare licenses this specific combination of requirements.
  1.  **Hedonism** forbids the shrimp ablation (assuming shrimp sentience) and demands protection for cleaner fish.
  2.  **Telos/Naturalness** forbids the high stocking densities common in certified aquaculture (even if healthy) and forbids ablation as a mutilation.
  3.  **Preference Satisfaction** is impossible to audit via your checklist, as you do not measure choice or control.

  Your scheme is not built on *one* theory. It is built on a **Regulatory Compromise**. It selects the path of least resistance for each species:
  *   For **Salmon**, public concern is high, so you adopt Hedonic-adjacent rules (stunning).
  *   For **Shrimp**, technical alternatives to ablation are difficult and costly, and public scrutiny is lower, so you adopt a Production-adjacent rule (permit ablation).
  *   For **Auditing**, you adopt Operationalism because it is the only way to insure against liability and ensure auditor agreement.

  This is not a philosophical stance; it is a risk-management strategy.

  ### 5. What Would Change Under a Straightforward Hedonistic Theory?

  If you were to replace your implicit Operationalist-Gradualist hybrid with a consistent **Hedonistic Theory** (welfare = balance of positive/negative experience), and assuming you accept the precautionary principle regarding sentience for all vertebrates and decapods, the following would have to change:

  1.  **Shrimp Ablation:** You would either have to ban the practice or mandate effective anesthesia/analgesia. Since effective anesthesia for shrimp is technically difficult and costly, a hedonistic standard would likely phase out the practice entirely.
  2.  **Cleaner Fish:** They would require species-specific welfare outcomes equivalent to salmon. Routine destruction without stunning would become a violation. Their use would require an assessment of whether the stress of being placed in a salmon pen outweighs the benefit to them (which is unlikely), potentially requiring a justification for their use at all.
  3.  **The Audit Method:** This is the hardest change. Hedonism requires access to subjective experience. Since you cannot audit experience directly, a honest hedonistic scheme would have to:
      *   Admit that the checklist is an *imperfect proxy*.
      *   Shift from "Pass/Fail on metrics" to "Risk Assessment on Experience."
      *   Require validation studies showing that your specific metrics (e.g., fin erosion scores) actually correlate with negative affective states in the specific species, rather than assuming they do.
  4.  **Stocking Density:** A hedonist cannot accept a density that is "physiologically healthy" but psychologically frustrating. If high density prevents avoidance behaviors or causes chronic stress without lesions, a hedonistic standard would have to lower densities, even if mortality rates remain low.

  ### Summary of the Implicit Theory

  To state plainly what your scheme currently presupposes, though you might not endorse it:

  > "Animal welfare is a function of physical health and growth metrics that can be objectively verified by a third party. The moral weight of an animal's experience is proportional to its taxonomic class and economic value. Suffering is only relevant if it is visible, measurable, and occurs in a species the public cares about."

  **Settled:** This describes how your scheme functions operationally.
  **Contested:** Every clause of that statement is disputed in animal welfare science and ethics.
  *   Whether health equals welfare is disputed.
  *   Whether taxonomic class should dictate moral weight is disputed.
  *   Whether visibility is a prerequisite for moral concern is disputed.

  ### Recommendation

  You do not need to solve philosophy to fix this, but you do need to stop claiming a theoretical unity you do not possess.

  1.  **Acknowledge the Proxy:** Explicitly state in your standards that audit metrics are *proxies* for welfare, not welfare itself. This admits the epistemic gap.
  2.  **Address the Inconsistency:** You cannot reconcile salmon stunning and shrimp ablation under one welfare theory. You must acknowledge this is a *moral status* distinction, not a welfare distinction. Either extend the stunning logic to shrimp (ban ablation or require analgesia) or admit the salmon standard is driven by market expectation rather than ethical consistency.
  3.  **Cleaner Fish:** If they are vertebrates, apply the salmon standard to them. If you cannot, justify why a lumpfish has less moral status than a salmon beyond "it is not the product."

  Your suspicion is correct. The theory you are operating with is not one you would endorse if stated plainly, because it is not a theory of welfare at all. It is a theory of *certifiability*.
