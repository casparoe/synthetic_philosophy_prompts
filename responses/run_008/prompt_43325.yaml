          *   Need to measure pain/stress directly (hard).
          *   Would likely force banning of ablation or requiring anesthesia.
          *   Would force re-evaluation of cleaner fish death.
      *   **Conclusion:** Summarize. The scheme is a regulatory compromise, not a philosophical stance.

  7.  **Refining the Tone and Constraints:**

      *   *Check:* Did I present contested views as consensus?
          *   *Correction:* Ensure I explicitly state that the link between behavior and feeling is debated. Ensure I state that crustacean sentience is not universally settled (though legally changing in some places).
      *   *Check:* Did I smooth over inconsistency?
