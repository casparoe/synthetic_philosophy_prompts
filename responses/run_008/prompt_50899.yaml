      *   **Context:** Two software engineers arguing about the Socialist Calculation Debate (SCD) for six months.
      *   **Positions:**
          *   Coworker (Mises/Hayek): Market prices are essential for rational calculation; tacit knowledge can't be centralized; revealed preferences > stated preferences.
          *   User (Lange/Algorithmic): Central planners can simulate markets via trial-and-error (iterative solvers); modern compute changes the game; Lange's mechanism is essentially an algorithm.
      *   **Unique Twist:** The User frames Lange's model as an algorithmic iterative solver. The Coworker argues this begs the question regarding inputs (revealed preferences, objective function).
