answer: |-
  Yes, there is a proper name for this, and your memory of the magazine contest is spot-on.

  The concept you are describing is called **Superrationality**.

  The contest you are remembering was run by **Douglas Hofstadter** (author of *Gödel, Escher, Bach*) in his *Scientific American* column "Metamagical Themas" in **June 1983**. He invited readers to submit strategies for a multi-player Prisoner's Dilemma. The core prompt was exactly what you described: if everyone submits a rational strategy, and everyone knows everyone else is rational, what do you do?

  Here is the breakdown of the reasoning, its standing in decision theory, and how it differs from Kant or guilt.

  ### 1. The Name: Superrationality
  Hofstadter coined the term to describe reasoning where you assume that other rational agents facing the same problem will arrive at the **same answer** you do.

  *   **Standard Game Theory (Nash Equilibrium):** Assumes your choice cannot influence the others. Therefore, in a Prisoner's Dilemma (like the watering rota), you should defect (sleep in) because you get the benefit of the water without the cost, regardless of what they do.
  *   **Superrationality:** Assumes symmetry. "I am not special." If I am rational, they are rational. If we have the same information and the same brain structure, we will run the same 'algorithm' and output the same decision. Therefore, my decision is effectively the decision of the group.

  ### 2. Modern Formalizations: EDT and TDT
  In contemporary philosophy and AI safety circles (specifically around the LessWrong community), this reasoning has been formalized further under two main banners:

  *   **Evidential Decision Theory (EDT):** This argues you should choose the action that provides the best *evidence* about the state of the world. If you staying in bed is strong evidence that others will stay in bed (because you are similar), then EDT says get up.
  *   **Timeless Decision Theory (TDT):** Developed by Eliezer Yudkowsky, this is probably the closest fit to your "counts sixteen times" intuition. TDT argues you should decide as if you are choosing the output of a logical algorithm that is instantiated in multiple places (you and the other gardeners). You aren't causally forcing them to water; you are selecting the reality where the "Gardener Algorithm" outputs "Water."

  ### 3. Is it Sound or Just a Mood?
  This is one of the biggest debates in decision theory.

  **The Skeptic's View (Causal Decision Theory):**
  Standard economists and causal decision theorists call this **magical thinking**. They argue your choice *cannot physically cause* someone else's choice across town. Just because you reason similarly doesn't mean your arm moving the hose makes their arm move. By this metric, your reasoning is unsound; you are cooperating based on a correlation that you cannot causally influence.

  **The Proponent's View (Acausal Cooperation):**
  However, if the correlation is real (i.e., you *are* psychologically similar to the other members), then treating your decision as a sample of the group is **instrumentally rational**.
  *   If you defect, the probability that similar others defect rises.
  *   If you cooperate, the probability that similar others cooperate rises.

  In a community garden, the "soundness" comes from the fact that you *are* a sample. You aren't an isolated atom; you are a member of a specific social cluster with shared norms. If the "type of person who joins a community garden" defects, the garden fails. If that type cooperates, it thrives. By identifying as that type, you are effectively voting for the norm.

  So: It is not **causally** sound (you aren't a wizard), but it is **evidentially** and **socially** sound (you are a data point in a pattern).

  ### 4. How it Differs from Kant and Guilt
  You were right to sense a distinction.

  *   **Kant (Deontology):** Kant's Categorical Imperative is about **moral duty**. "I must water because a world where no one waters is contradictory to my will." It is a moral constraint. You do it because it is *Right*, regardless of the outcome.
  *   **Guilt (Emotional Sanction):** Guilt is "If I don't water, I will feel like a bad person." This is an internal penalty system. It relies on your emotional vulnerability.
  *   **Superrationality (Instrumental Symmetry):** This is what you are doing. It is **consequentialist**. You aren't doing it because it's morally pure or because you fear shame. You are doing it because you have calculated that **Cooperate + (N-1) Cooperators > Defect + (N-1) Defectors.** You are maximizing utility by acknowledging that you cannot optimize your outcome in isolation from people who think like you.

  ### Summary
  You have intuitively adopted **Superrationality** (or a layperson's version of **Timeless Decision Theory**).

  *   **The Name:** Superrationality.
  *   **The Contest:** Hofstadter's *Scientific American* Prisoner's Dilemma Tournament (1983).
  *   **The Verdict:** It is a highly effective heuristic for maintaining cooperation in groups of similar people, even if strict causal logic frowns on it.
  *   **The Advice:** Keep doing it. In a community garden, causal isolation is a myth. You are all bound by shared norms. Treating your decision as a "vote" for the group norm is arguably the only way to solve the Tragedy of the Commons without a dictator.

  You aren't guilt-tripping yourself; you're running a distributed algorithm for social cohesion.
