      *   *Superrationality/TDT:* It is "sound" within specific frameworks (like TDT or Parfit's Newcomb problems) where correlation is treated as relevant, even without direct causation. It works best if there is actually a high correlation between the agents (e.g., they are identical algorithms, or very similar psychological profiles).
