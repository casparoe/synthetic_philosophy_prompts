              *   Case 2: Bayes on $B$ ($P(B)=1$), then Jeffrey on $R$ ($P(R)=0.7$).
              *   In Case 2, the Jeffrey update happens on the *posterior* from the Bayes update. The rigidity condition applies to the credences *at the time of the update*.
              *   Standard result: They commute *only if* the proposition learned with certainty ($B$) is probabilistically independent of the partition elements ($R, \neg R$) in the prior, OR if specific constraints on the likelihoods are met. Generally, $P_{J \to B} \neq P_{B \to J}$.
              *   Specifically, if you do Bayes first, you condition on $B$. Then you do Jeffrey on $R$. The rigidity condition holds relative to the *new* prior (after $B$). If you do Jeffrey first, rigidity holds relative to the *old* prior. Since $P(\cdot | R, B) \neq P(\cdot | R)$ generally, the results differ.
              *   *Reference:* Wagner (2002), "Determining the Probability of a Proposition by Jeffrey's Rule", or standard texts like Weisberg. The commutativity of two Jeffrey updates holds under specific conditions (independence), but Jeffrey then Bayes vs. Bayes then Jeffrey generally fails.
