answer: |-
  Here is the translation of the Appiah/Williams account of moral revolution into infectious disease dynamics, followed by the residue report and the surveillance bias analysis.

  ### Part 1: The Epidemiological Translation

  In this framework, we are modeling the spread of a **Stigma Strain** (the new norm that labels the old practice as dishonorable) through a structured host population (the status-holding elite). The goal is the elimination of the **Behavioral Pathogen** (the old practice, e.g., dueling).

  *   **The Pathogen:** The *Stigma Strain*. This is the cognitive/behavioral package that codes the old practice as "shameful" rather than "honorable." It invades the host's belief system.
  *   **The Vector:** Social signaling and gossip. Transmission occurs through observation of status rewards/punishments. It is not airborne (universal argument); it is vector-borne (requires social contact within the status network).
  *   **Susceptible Hosts ($S$):** Members of the elite who currently engage in or tolerate the old practice but are vulnerable to status loss. They are "susceptible" because their social standing depends on peer recognition.
  *   **Infected Hosts ($I$):** Elites who have "seroconverted" to the new norm. They actively signal disapproval of the old practice. Crucially, they are now *infectious* to other susceptibles via shaming or withdrawal of recognition.
  *   **Recovered/Immune ($R$):** Those who have fully internalized the new norm. They are resistant to reverting to the old practice because the "Behavioral Pathogen" no longer finds a receptor (it yields no status fitness).
  *   **$R_0$ (Basic Reproduction Number of the Stigma):** The average number of elites one "shamed" individual converts. If $R_0 < 1$, the stigma dies out, and the old practice remains endemic. If $R_0 > 1$, the stigma spreads epidemically.
  *   **Force of Infection ($\lambda$):** The rate at which susceptibles encounter the stigma. This is driven by *visibility*. High-surveillance environments (tight-knit aristocratic circles) increase $\lambda$.
  *   **Case Fatality Rate (CFR):** The social cost of being caught with the "Behavioral Pathogen." In dueling, this is ostracization or loss of rank. High CFR increases the pressure to vaccinate (adopt the stigma).
  *   **Herd Immunity Threshold:** The proportion of the elite that must adopt the Stigma Strain such that the *Behavioral Pathogen* can no longer transmit. Once the majority code the practice as dishonorable, doing it no longer signals status. The "fitness" of the behavior drops to zero. The practice doesn't just become rare; it becomes evolutionarily non-viable as a status signal.
  *   **Williams' Point (The "Cheapening" of Gentility):** This maps to **Frequency-Dependent Selection** and **Host Population Structure**.
      *   The "Behavioral Pathogen" (dueling) originally conferred high fitness (status) because it was restricted to a specific host subpopulation (the gentry).
      *   When the "wrong" people (non-elites, *nouveaux riches*) began adopting the behavior, it acted like a **spillover event** that devalued the marker.
      *   In epi terms: The *specificity* of the behavioral marker dropped. If prevalence ($I/N$) gets too high in the general population, the behavior loses its utility as a distinguishing marker for the elite subpopulation. The elite hosts effectively develop "tolerance" to the behavior's status signal, or rather, the signal's *positive predictive value* for "gentleman" status collapses. The behavior becomes a "dead-end host" situation for the elite—they stop doing it because it no longer differentiates them from the reservoir population.

  ### Part 2: The Residue Report

  Here is where the mapping holds, where it distorts, and where it breaks.

  **1. Clean Translations**
  *   **Tipping Points:** The concept of a threshold (herd immunity) maps beautifully to the "sudden" collapse of a moral practice. It explains why a practice can look stable for decades and then vanish in a generation. It's not a linear decline; it's a phase transition once the status fitness flips negative.
  *   **Network Heterogeneity:** Appiah's focus on elites maps perfectly to superspreader events. If the high-degree nodes (aristocrats, opinion leaders) clear the infection (adopt the stigma), the transmission chain for the old practice breaks, even if the lower-degree nodes (commoners) still harbor it.
  *   **Endemicity:** Practices that don't vanish but become "private" or "stigmatized" (like certain vices) are effectively endemic. They persist at low levels, hidden from surveillance, without threatening the overall system stability.

  **2. Distorted Translations**
  *   **Honor as Immunity:** In epi, immunity is biological or behavioral avoidance. In Appiah's model, "honor" is a *valuation*. Epi models assume hosts want to avoid infection (usually). In moral change, hosts *want* the "infection" (the new norm) only if it confers status. The "immune response" is driven by vanity, not survival. This distorts the motivation structure. Epi assumes negative selection pressure on the pathogen; here, the "pathogen" (stigma) is positively selected *because* it kills the old behavior.
  *   **Williams' "Cheapening":** In epi, high prevalence usually means high transmission risk. In the honor model, high prevalence of the *behavior* among the wrong people kills the behavior's fitness among the right people. This is **negative frequency-dependent selection**, which is standard in evolutionary epi but counter-intuitive in standard SIR models where prevalence usually drives more prevalence.

  **3. The Inexpressible Residue**
  *   **Semantic Content:** This is the hard stop. A virus does not care what it *means* to the host. A norm *is* its meaning. You cannot model "honor" without modeling the *content* of the belief. Epi tracks states (S, I, R); it does not track *qualia* or *propositional content*.
  *   **The "Unthinkable":** Epi can model "zero cases." It cannot model "cognitive impossibility." When Appiah says dueling became "unthinkable," he means the neural pathway was pruned, not just that the cost was too high. Epi deals with costs and probabilities, not the closure of conceptual space.

  **4. The Verdict: Missing Concept or Vague Philosophy?**
  My view is that the residue falls on **both**, but for different reasons.

  *   **On the Epi Side:** The vocabulary is missing a variable for **Semiotic Fitness**. In standard epi, fitness is replication rate. In cultural epi, fitness is *status yield*. We need a parameter that adjusts transmission probability based on the *meaning* assigned to the state by the network. Standard epi assumes the pathogen's properties are intrinsic; moral norms have properties assigned *relationally* by the host network.
  *   **On the Philosophy Side:** Appiah's claim is slightly overstated. He argues it was *less* about ethical argument and *more* about honor. This is a false dichotomy. Arguments often *create* the stigma that drives the honor shift. The philosophical claim looks cleaner than the reality because it isolates one mechanism (honor) to make a point. The "unexpressible" part isn't just that norms have meaning, but that *arguments change the meaning*, which then changes the honor calculus. Epi can't see the argument, only the resulting shift in transmission rates.

  So, the gap isn't just that epi lacks "meaning." It's that the philosophical account treats "honor" and "argument" as distinct mechanisms, whereas in reality, they are coupled variables. Epi can't model the coupling because it doesn't model the semantics.

  ### Part 3: Surveillance and Ascertainment Bias

  Your intuition here is spot on. There is a direct analogue, which we might call **Textual Ascertainment Bias**.

  *   **In Epi:** We estimate CFR and incidence based on reported cases. Mild/asymptomatic cases go uncounted. We overestimate severity because severe cases seek care (get ascertained).
  *   **In History:** We estimate the drivers of moral change based on archived texts (letters, pamphlets, parliamentary records).
      *   **The "Cases":** Explicit ethical arguments (Wilberforce's speeches, philosophical tracts).
      *   **The "Asymptomatic":** Silent social pressure, gossip, subtle shifts in seating arrangements, the withdrawal of invitations.
  *   **The Bias:** Arguments leave paper trails. Shaming often does not. Therefore, historical surveillance systems (archives) have a high detection probability for "Argument-Driven Change" and a low detection probability for "Honor-Driven Change."
  *   **The Result:** Just as an epi model based only on hospital admissions would overestimate the virulence of a pathogen (missing the mild cases), a historical model based only on texts overestimates the efficacy of ethical argument (missing the silent shaming).

  This explains why the "arguments won" story is sticky: it's an artifact of the surveillance system. The "honor" mechanism is the subclinical infection that actually drove the herd immunity, but it rarely made it into the case report form (the history book). You are correctly identifying that the "argument" narrative is a surveillance artifact, not necessarily the true transmission dynamic.
