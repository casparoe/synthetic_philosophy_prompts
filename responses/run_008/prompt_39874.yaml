prompt: |-
  So, background: I'm an infectious disease epi person (I do outbreak modeling, surveillance stuff). I've been reading about so-called moral revolutions -- how practices like dueling and footbinding and the Atlantic slave trade went from normal to unthinkable, and Appiah's account that it was less about ethical argument winning and more about shifts in honor: a practice gets re-coded as dishonorable for the people whose status it was supposed to signal. There's also a nice point I've seen attributed to Bernard Williams, roughly that dueling died off once being a gentleman got cheap enough that the wrong kind of people could do it -- don't hold me to the exact wording, and don't go hunting citations, just take the gist.

  Here's what I want: translate that whole account of moral change into the vocabulary I actually use every day -- R0, susceptible and immune fractions, herd immunity thresholds, case fatality, endemicity, pathogen competition, evolutionary selection on variants, surveillance and ascertainment bias, host population structure. Do it as faithfully as you can: if the spread of an anti-dueling attitude among British elites is supposed to be like pathogen spread, tell me what plays the role of the pathogen, the vector, the susceptible host, the immune population, and whether there's anything like herd immunity for a norm. Where a metaphor would be doing sneaky work, flag it instead of pretending it's a real mapping -- I don't want my framework's assumptions smuggled in and called translation.

  Then give me the residue report. Which parts of Appiah-style claims translate cleanly, which come over only distorted (I suspect "honor is internal to a code" is going to be trouble, since in my world transmission doesn't care about meaning), and which can't be said at all in epi terms. And the question I actually care about: when something can't be said, is that because my vocabulary is missing a concept (norms have something pathogens don't, maybe an evaluative dimension), or because the philosophical claim was less clear than it looked to begin with? I'd genuinely like your view on which side the residue falls, not just a list.

  One more thing if you have room: in epi we worry a lot about reporting bias -- we only see the cases that got ascrtained. Is there an analogue for historians of moral change, where we overestimate argument-driven conversions because those are the ones who wrote letters and memoirs? Feels like it might explain why the "it was arguments wot won it" story is so sticky, but maybe that's just me pattern-matching.

  Please answer in American English. Also if you use epi jargon, assume I know it, no need to define R0 for me lol.
