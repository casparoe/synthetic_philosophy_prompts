  ## 7. Instructor's Cheat Sheet (The Math)
  *   **Circle Radius:** $R$.
  *   **Triangle Side Length:** $R\sqrt{3}$.
  *   **Condition for "Long" Chord:**
      *   **Alpha (Endpoints):** Arc length between points $> 1/3$ circumference (120°). Probability = $1/3$.
      *   **Beta (Distance):** Distance from center $d < R/2$. Probability = $(R/2) / R = 1/2$.
      *   **Gamma (Midpoint):** Midpoint falls within circle of radius $R/2$. Area ratio = $\pi(R/2)^2 / \pi R^2 = 1/4$.

  *   **Sampling Note:** If Gamma's "Inner Circle" is hard to see, pre-highlight it in yellow. If Beta's "Perpendicular" drawing is slow, provide a set-square. Speed is essential for $n=50$.
