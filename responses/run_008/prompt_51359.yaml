answer: |-
  ### Desiderata for a Theory of Real Patterns

  To move beyond sloganizing about "real patterns," any theory claiming to ground the ontologies of the special sciences must satisfy the following five requirements. Each is motivated by a specific problem case. I have classified each as either **Non-Negotiable** (any theory failing this fails to capture the phenomenon) or **Prejudice** (a demand stemming from a specific metaphysical commitment, e.g., robust realism vs. pragmatism).

  #### 1. The Compression Constraint (Predictive Leverage)
  *   **Motivating Case:** *Non-coincidental success.* Consider predicting the movement of a fluid (turbulence) or a chess position 20 plies deep. The physical stance (simulating every molecule or transistor) is computationally hopeless. The higher-level stance (hydrodynamics or chess strategy) yields accurate predictions with vastly less data.
  *   **Requirement:** The theory must define a pattern as real only if adopting the vocabulary of that pattern allows for lossless or near-lossless compression of the data relative to the base level, resulting in genuine predictive leverage.
  *   **Status:** **Non-Negotiable.** Without predictive compression, the pattern is merely a redescription, not an ontological ground.
  *   **Note:** This is the core of Dennett's definition. A pattern is real if there is an encoding scheme that makes the data simpler to handle.

  #### 2. The Grain-Relativity Constraint
  *   **Motivating Case:** *Grain-relativity.* In Conway's Game of Life, a "glider" is a robust object at the macro-scale of the grid but vanishes into noise at the pixel scale (individual cell states).
  *   **Requirement:** The theory must account for the fact that pattern detection is relative to the computational resources and resolution of the observer. It must specify whether the pattern is real *simpliciter* or real *relative to an observer class*.
  *   **Status:** **Non-Negotiable.** Ignoring grain renders the theory incapable of handling emergent phenomena in complex systems.
  *   **Tension Flag:** This requirement creates friction with Requirement 3 (see below). If reality depends on observer limits, in what sense is it "out there"?

  #### 3. The Anti-Gerrymandering Constraint (Objectivity)
  *   **Motivating Case:** *Usefulness versus gerrymandering.* We can group stars into constellations (Orion) or group random dots into shapes that suit our aesthetic interests. These "patterns" are useful for navigation or art but track no causal structure.
  *   **Requirement:** The theory must distinguish between patterns that track mind-independent causal structures and projections that merely satisfy human interests. It must explain why "gene" is a real pattern but "grue" (or "constellation") is not, despite both offering predictive utility in certain contexts.
  *   **Status:** **Prejudice.** This is a demand of the **Metaphysical Realist**. A thoroughgoing Pragmatist or Instrumentalist will reject this, arguing that "tracking causal structure" just *means* "being useful for prediction." Insisting on this constraint excludes pragmatic accounts of ontology.
  *   **Exclusionary Power:** **This is the single requirement that excludes the most candidate theories.** Most pragmatic or deflationary accounts (including arguably Dennett's) struggle to draw a sharp line between "useful fiction" and "real pattern" without smuggling in a robust realism they officially disavow.

  #### 4. The Intentional Threshold Constraint
  *   **Motivating Case:** *The thermostat and the chess program.* We attribute "wanting to maintain temperature" to a thermostat and "wanting to win" to Deep Blue.
  *   **Requirement:** The theory must provide a principled criterion for where the intentional stance transitions from a useful metaphor to an ontological commitment. It cannot rely merely on "habit" or "degree of complexity" without specifying the threshold.
  *   **Status:** **Prejudice.** This is a demand of the **Intentional Realist**. Eliminativists (who deny beliefs exist) and Radical Instrumentalists (who say beliefs are *only* useful fictions) both reject the need for a threshold of *legitimacy*.
  *   **Tension Flag:** **Incompatibility with Requirement 2.** If patterns are relative to grain/observer resources (Req 2), there can be no sharp, principled threshold (Req 4). A thermostat looks like a believer if your computational grain is coarse enough; a human looks like a collection of atoms if your grain is fine enough. Demanding both Grain-Relativity and a Principled Threshold is likely incoherent.

  #### 5. The Inter-Level Coexistence Constraint
  *   **Motivating Case:** *Levels.* If beliefs are real patterns and neurons are real patterns, we need to know how they relate.
  *   **Requirement:** The theory must explain how patterns at different levels coexist without competition. It must distinguish between a higher-level pattern being *reduced* by a lower-level one (retained) versus *eliminated* by it (discarded as false).
  *   **Status:** **Non-Negotiable.** Any theory that forces a choice between "only neurons are real" or "only beliefs are real" fails to account for the practice of the special sciences.
  *   **Note:** This rules out both strict Reductionism (which eliminates the higher level) and strong Emergentism (which often posits causal competition).

  ---

  ### Evaluation of Dennett's Account

  Daniel Dennett's theory of Real Patterns (primarily from *Real Patterns*, 1991) is the primary target of this reading group. Here is how it fares against the desiderata:

  **Strengths:**
  *   **Compression (Req 1):** This is Dennett's strongest suit. He explicitly defines reality via compressibility. If the intentional stance offers the best data compression, the beliefs are real.
  *   **Grain-Relativity (Req 2):** Dennett embraces this. Patterns are real relative to the "detectability" by an observer with specific resources. He dissolves the demand for absolute perspective.
  *   **Coexistence (Req 5):** Dennett handles this well via the idea of "abstraction layers." Neurons realize the patterns of beliefs; they do not compete with them.

  **Weaknesses:**
  *   **Anti-Gerrymandering (Req 3):** **This is his weakest point.** Critics (e.g., Jaegwon Kim, John Searle) argue Dennett cannot distinguish between a pattern that is *really there* and one that is merely *useful to treat as there*. By tying reality to utility/compression, he risks collapsing ontology into instrumentalism. If a constellation predicts navigation well enough, is it real? Dennett says "real enough," which satisfies pragmatists but frustrates realists.
  *   **Intentional Threshold (Req 4):** Dennett explicitly rejects a sharp threshold. He argues for a gradualist view where thermostats have "proto-beliefs" and humans have full-blooded ones. While consistent with his Grain-Relativity, this violates the intuition of many in the reading group who want a principled line between "metaphor" and "mind."

  **Summary for the Group:**
  Dennett's account satisfies the Non-Negotiable requirements regarding prediction and levels but falters on the Prejudices regarding Objectivity and Thresholds. If your reading group leans toward **Metaphysical Realism**, Dennett will appear to offer a sophisticated instrumentalism disguised as realism. If your group leans toward **Pragmatism**, Dennett's account will likely seem sufficient, provided you accept that "real" means "indispensable for prediction" rather than "mind-independent." The critical friction point for discussion should be **Requirement 3**: Is the inability to distinguish gerrymandering from structure a bug in Dennett's theory, or the correct dissolution of the problem?
