answer: |-
  **Joint Statement on Causation by Omission**

  **1. Agreed Claims**
  1.  **Counterfactual Dependence:** In the gardener, doctor, and defibrillator cases, the outcome counterfactually depends on the omitted action (e.g., if the gardener had watered, the plants would have lived).
  2.  **Ordinary Usage:** Ordinary language routinely attributes causation to omissions in these contexts (e.g., "The gardener caused the death").
  3.  **Normative Influence:** Normative expectations (duties, roles, defaults) significantly influence whether an omission is cited as *the* cause.
  4.  **Profligacy Constraint:** Any account must address the profligacy problem: if counterfactual dependence suffices, every non-actor is a cause, which clashes with intuition.
  5.  **Physical Description:** Complete physical descriptions of these scenarios contain no positive event or energy transfer corresponding to the omission.

  **2. Residual Disagreements**

  | Absences-are-Causes Position | No-Omissions Position |
  | :--- | :--- |
  | Omissions are genuine causal relations grounded in counterfactual dependence. | Omissions lack the ontological grounding (events/energy) required for causation. |
  | Norms pragmatically select among many genuine causes to solve profligacy. | "Omission causation" is a metaphor for normative responsibility, not metaphysics. |

  **3. Cruxes and Empirical Predictions**
  Settling these subquestions would shift confidence in either position.

  *   **Crux 1: Objectivity vs. Subjectivity.** Is the causal relation objective (independent of knowledge) or subjective (dependent on normative assessment)?
      *   **Case:** *The Secret Contract.* A gardener is contractually obliged to *kill* plants by withholding water. An observer, unaware of the contract, sees the plants die.
      *   **AAC Prediction:** Subjects will judge the gardener caused the death objectively, even if they later learn the norm was flipped. The causal relation holds; moral evaluation shifts.
      *   **NO Prediction:** Subjects will deny the gardener caused the death once the norm is revealed. Causal attribution tracks normative permission, proving it is not an objective relation.

  *   **Crux 2: Profligacy Intuitions.** Do people treat non-normative omissions as causes they simply ignore, or as non-causes?
      *   **Case:** *The Stranger.* A random passerby does not water the plants. No duty exists.
      *   **AAC Prediction:** When pressed, subjects will admit the stranger *was* a cause but *should not be cited*. They distinguish causal status from causal selection.
      *   **NO Prediction:** Subjects will insist the stranger *was not* a cause. They distinguish causal status from responsibility directly.

  **4. Assessment of Verbal Dispute**
  Part of this dispute is verbal. Both sides agree on the physics (no energy transfer) and the counterfactuals (dependence holds). The disagreement turns on the definition of "cause." AAC defines it broadly to include counterfactual dependencies selected by context; NO defines it narrowly to require positive physical production.

  However, the dispute is not *merely* verbal. It remains substantive regarding whether our causal concepts *should* be revised. If NO is right, ordinary language is systematically misleading about metaphysics. If AAC is right, metaphysics must accommodate normative selection as a genuine component of causal reality. Resolving the verbal definition does not settle whether our best theory of causation should integrate norms or exclude them.
