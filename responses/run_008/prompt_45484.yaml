prompt: |-
  so here's my situation. My partner and I just started IVF, and somewhere between signing the clinic paperwork and getting into it with my brother-in-law (a virologist, who thinks the answer is trivally yes for embryos and trivally no for viruses — I think both of those are lazy) I realized I can't actually say what makes something alive. Then at a party last week I gave like three different answers about whether a virus is alive, in the same conversation, and someone called me on it. So I want to figure out what definition of life I actually hold, and I suspect the only honest way to do that is by looking at how I judge borderline cases, not by which label I like the sound of.

  You're a philosopher of biology who also knows enough chemistry and microbiology to not embarrass yourself in front of the audience this is for: me, plus the synthetic bio journal club I go to (grad students, so the cases can be technical). Please think carefully before writing — start with some brainstorming about where the real dividing questions are, then build the tree from the logical space of criteria, and only afterwards locate the actual named definitions in that space.

  What I want is a decision tree, one page, that starts from 'is this thing alive?' and routes me to the definition of life I'm implicitly using. Every branch node has to be a question I can answer without knowing which definition it leads me to — concrete cases, not 'do you believe in autopoiesis'. Each leaf gets the name of the definition (or 'unnamed' if nobody defends that combo), plus one sentence on its most awkward commitment.

  These cases have to show up somewhere as branch tests, because they're the ones I keep flip-flopping on: a plain virus; a giant virus like mimivirus (the kind where people argue it has enough of its own machinery to count as a cellular organism); a prion; a mule (sterile but metabolizing); a worker honeybee (also sterile, but part of a colony that reproduces); a dried-out tardigrade in tun state (zero metabolism for decades); a frozen embryo that's been in liquid nitrogen for two years and might never be implanted; HeLa cells (an immortal cell line, arguably no longer part of any human); a self-replicating digital organism in something like Avida; a protocell, meaning a liposome with replicating RNA inside, like the lab down the hall from the journal club makes; and at least one obvious non-life that still does something lifelike — a growing crystal, a forest fire spreading — so the tree can show why those DON'T count.

  Also: flag any two leaves your tree can't genuinely seperate (I suspect the self-maintenance and metabolism ones collapse into each other?), and note any combination of branch answers no known definition occupies — and say whether that's because the view is incoherent or just unexplored.

  Think step by step, brainstorm before building, and answer in American English. And don't pull your punches on the frozen embryo case just because it's mine — if my intuitions there are inconsistent with everything else the tree says about me, I want to know.
