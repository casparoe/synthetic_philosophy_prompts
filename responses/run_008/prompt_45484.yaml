answer: |-
  ### Brainstorming: The Logical Space of "Life"

  Before we build the tree, we need to map the tensions you're feeling. You are oscillating between three distinct axes of biological definition, and your IVF context is pulling you toward one while your virologist brother-in-law is pulling you toward another.

  1.  **Process vs. History (The "Pause" Problem):** Is life a verb (metabolizing, maintaining) or a noun (a lineage, a historical continuity)?
      *   *Process:* If you stop moving, you aren't alive. (Kills frozen embryos, tardigrades in tun).
      *   *History:* If you come from life and can resume, you are alive. (Keeps embryos, kills protocells).
  2.  **Independence vs. Information (The "Virus" Problem):** Is life about the container (the cell) or the code (the genome)?
      *   *Container:* You need a boundary and your own energy. (Kills viruses, keeps cells).
      *   *Code:* You just need to replicate and evolve. (Keeps viruses, potentially kills mules).
  3.  **Substrate vs. Function (The "Synthetic" Problem):** Does life require carbon and water, or just the right logic?
      *   *Substrate:* Must be biochemistry. (Kills Avida, keeps protocells).
      *   *Function:* If it computes/evolves, it lives. (Keeps Avida, potentially keeps fire).

  The "awkward commitments" usually arise when you mix these axes inconsistently—for example, granting "potential" life to a human embryo (History) while denying "actual" life to a replicating virus (Process). The tree below forces you to choose.

  ***

  ### The "What Are You?" Decision Tree

  **START:** Consider the **frozen embryo** (in liquid nitrogen) and the **tardigrade** (in tun state). Both have zero metabolism.
  **Q1: Are they alive *right now*, while paused?**

  *   **NO (Life requires activity):** Go to **Q2**.
  *   **YES (Life includes potential/lineage):** Go to **Q3**.

  ---

  **Q2:** (You prioritize Process) Consider a **plain virus** infecting a cell vs. a **growing crystal**. Both replicate using external energy.
  **Is the virus alive, but the crystal dead?**

  *   **NO (Both are just chemistry):** **LEAF: Thermodynamic Dissipativism.**
      *   *Commitment:* A star or a forest fire is alive; you are just a slow-burning flame.
  *   **YES (Virus has info, crystal doesn't):** **LEAF: Metabolism-First (with Info caveat).**
      *   *Commitment:* You technically die every time you hold your breath or enter deep sleep.
      *   *(Note: This often collapses into Autopoiesis—see Flags below).*

  ---

  **Q3:** (You prioritize Potential) Consider the **plain virus** vs. the **prion**. Both depend on a host to replicate.
  **Is the virus alive, but the prion dead?**

  *   **NO (Both are just agents):** **LEAF: Replicator Theory (Dawkinsian).**
      *   *Commitment:* A mule is dead (cannot replicate), but a computer virus in *Avida* is alive.
  *   **YES (Virus has genes, prion is just protein):** Go to **Q4**.

  ---

  **Q4:** (You prioritize Genetics/Lineage) Consider the **mule** (sterile) and the **worker honeybee** (sterile).
  **Are they alive *by the same definition* as the embryo?**

  *   **NO (Sterility disqualifies them):** **LEAF: Anthropocentric Potentiality.**
      *   *Commitment:* Human "potential" counts, but animal "function" doesn't; biologically incoherent.
  *   **YES (They are alive, sterility is irrelevant):** Go to **Q5**.

  ---

  **Q5:** (You prioritize Organization/Lineage) Consider **HeLa cells** (immortal line) and a **protocell** (lab-made liposome/RNA).
  **Is the HeLa cell "human/alive" but the protocell "dead matter"?**

  *   **NO (Both are alive systems):** **LEAF: Functionalist/Substrate Independence.**
      *   *Commitment:* If we upload your mind to a server, you aren't dead; a sufficiently complex economy is alive.
  *   **YES (HeLa has history, Protocell is synthetic):** **LEAF: Historical Lineage Essentialism.**
      *   *Commitment:* The first living cell could not have arisen from non-life (denies abiogenesis); clones are less alive than originals.

  ---

  ### Sanity Check (Apply to any Leaf)
  **Consider the forest fire.** It consumes energy, grows, reproduces (spreads), and evolves (changes based on fuel).
  *   If your definition includes Fire, you are a **Thermodynamacist**.
  *   If your definition excludes Fire, ensure you aren't relying *only* on "growth" or "energy use" to define life.

  ***

  ### Flags & Inconsistencies

  **1. The Collapsed Leaves (Metabolism vs. Autopoiesis)**
  In Q2, if you answer "YES" (Virus dead, Crystal dead), you likely land on **Metabolism-First** or **Autopoiesis**. In practice, these are indistinguishable using *only* these cases. Both require a self-maintaining boundary and energy flux. To separate them, you would need a case where something maintains its boundary *without* energy (impossible) or consumes energy *without* a boundary (fire). For your purposes, treat them as the same leaf: **Process-Oriented Life.**

  **2. The Unoccupied Combination (The "Mule/Embryo" Paradox)**
  There is a combination of answers no coherent biological definition occupies: **Embryo = Alive** (Potential) + **Mule = Dead** (Sterile).
  *   *Why:* If "potential to reproduce" makes the embryo alive, the mule (which is metabolically active and was born of life) must also be alive. If "actual ability to reproduce" is required, the embryo is dead.
  *   *The Punch:* If you find yourself here, you are holding a **Human Exceptionalist** view, not a biological one. You are defining life based on *human moral status*, not biological function. In a synthetic bio journal club, this will be flagged as a category error. You cannot claim the embryo is "biologically alive" due to potential while denying the virus is "biologically alive" due to dependency, unless you are smuggling in a non-biological criterion (like "soul" or "species membership").

  **3. The Frozen Embryo Warning**
  If you took the **YES** branch at Q1 (Embryo is alive while frozen), you have committed to **Historical Lineage Essentialism** (Q5, final leaf). Be aware: This definition implies that if we ever create a fully synthetic cell (protocell) that metabolizes and evolves perfectly, it is *not alive* because it lacks a mother. Conversely, it implies a corpse is "alive" until it loses its potential to be resurrected (if you had the tech). If you want to defend IVF ethics, use "Potentiality," but acknowledge that "Potentiality" is a moral category, not a microbiological one. Your brother-in-law is right about the virus being a borderline case; you are right that the embryo is a borderline case. But they are borderline for *different reasons*. Don't conflate them.
