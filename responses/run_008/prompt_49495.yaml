prompt: |-
  I am a retired evolutionary biologist — a behavioral ecologist by training, most of my career spent on contest behavior in animals — and in the past few years I have been reading my way into philosophy. I have drafted the outline and core argument of an essay, and before I attempt a full write-up I would be grateful for comments from someone versed in the philosophical literature. The essay concerns David Lewis's account of convention and whether evolutionary biology vindicates, revises, or quietly destroys it.

  My thesis is this: Lewis analyzed a convention as an arbitrary solution to a coordination problem, sustained by common knowledge of a system of reciprocal expectations, and he took rational agents as his subjects. I want to argue that a surprising amount of his analysis survives translation into a population with no rational agents at all. The centerpiece is the old work by Maynard Smith and Parker on asymmetric contests: in the hawk-dove game, if there is an uncorrelated asymmetry between contestants — most famously the difference between the current owner of a resource and a latecomer, which confers no advantage in fighting ability — selection can stabilize a "bourgeois" strategy of respecting possession. Either convention (owner keeps, or finder yields) would do as well; which one wins is a matter of historical accident. That, I want to say, is Lewisian arbitrariness without a single believer in the population. From there I generalize: what Lewis secures through nested expectations — I expect you to conform, expect you to expect me to conform, and so on — natural selection secures through feedback, since a mutant deviating from the local convention is simply outcompeted. And what Aumann calls a correlated equilibrium, with the asymmetry serving as a correlating signal, looks to me like the right game-theoretic home for Lewis's examples: the signal is public enough, and no one gains by ignoring it. I close with a bolder claim: that the normativity philosophers insist is missing from this picture — the sense in which a convention gives us a *reason*, even an *obligation*, to conform — is a later cultural addition laid over a machinery that ran for eons without it, and is no more essential to convention than paint is to an engine.

  I am aware, from conversations and reading, that Brian Skyrms has treated Lewis's convention explicitly with evolutionary game theory, and I do not want to reinvent his book. So my specific requests are these. First, accuracy: are there errors or anachronisms in the way I deploy the Lewisian apparatus — especially in my paraphrase of the common knowledge condition and the arbitrariness condition? Second, and most important to me: does the uncorrelated asymmetry material actually track Lewis's arbitrariness? In the biological cases the asymmetry is sometimes genuinely uncorrelated with payoffs, but sometimes it is correlated, and I worry that I have been coasting on the clean examples. Where does the analogy break? Third, is my replacement of recursive common knowledge by selective feedback philosophically respectable, or does it change the subject — would Lewis be entitled to say that whatever populations of animals have, it is not convention but something convention presupposes? Fourth, on normativity: I have read that Margaret Gilbert presses something like this objection to Lewis himself, and I am inclined to dismiss it as anthropocentric squeamishness, but I suspect a philosopher will tell me I am being too quick, and I would genuinely like to know whether my dismissal is defensible or merely a biologist's habit of treating "it is selected for" as the end of explanation. Finally, tell me plainly whether there is a distinct contribution left in my essay once Skyrms is taken into account, and if so, where I should dig in to make it. I would rather learn now that the paper is a footnote than discover it after submission.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired evolutionary biologist (behavioral ecologist), expert in contest behavior (animal conflicts), recently reading philosophy.
      *   **Task:** Critique an essay outline/argument regarding David Lewis's account of convention vs. evolutionary biology (specifically Maynard Smith/Parker's asymmetric contests).
      *   **Core Thesis:** Lewis's account of convention (arbitrary, coordination problem, common knowledge, rational agents) survives translation to non-rational biological populations via evolutionary game theory (EGT). Natural selection replaces common knowledge/expectations. Normativity is a later cultural add-on.
      *   **Specific Questions:**
          1.  Accuracy of Lewisian apparatus (common knowledge, arbitrariness).
          2.  Does "uncorrelated asymmetry" (Bourgeois strategy) track Lewisian arbitrariness? Where does the analogy break?
          3.  Is replacing recursive common knowledge with selective feedback philosophically respectable, or does it change the subject?
          4.  Normativity: Is dismissing Gilbert-style objections defensible, or is the biologist oversimplifying?
          5.  Contribution vs. Skyrms: Is there a distinct contribution left, or is this just a footnote to *Evolution of the Social Contract*?

  2.  **Initial Assessment & Knowledge Retrieval:**
      *   **David Lewis (*Convention*, 1969):** Conventions are regularities in behavior in a population, sustained by common knowledge of mutual expectations, solving a coordination problem, where alternatives exist (arbitrariness). Agents are rational.
      *   **Maynard Smith & Parker (1976):** "The role of asymmetry in animal contests." Uncorrelated asymmetries (like ownership) allow ESS (Evolutionarily Stable Strategies) like "Bourgeois" (Owner plays Hawk, Intruder plays Dove). This looks like convention.
      *   **Brian Skyrms (*Evolution of the Social Contract*, 1996; *Signals*, 2010):** Explicitly bridges Lewis and EGT. Shows how signaling and conventions evolve without rational deliberation. Discusses correlated equilibrium.
      *   **Margaret Gilbert (*On Social Facts*, 1989):** Criticizes Lewis for missing the normative "joint commitment" aspect. Conventions involve obligations, not just regularities.
      *   **Ken Binmore (*Natural Justice*, 2005; *Game Theory and the Social Contract*):** Similar project, but more focused on rationality evolving.
      *   **Jason Alexander (*The Structure of Convention*):** Recent work on defining convention without common knowledge.
      *   **Rydell & Sjöquist (etc.):** Biological literature on ownership conventions.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate the project. It's a strong, classic intersection of bio and phil.

      *   **Q1: Accuracy of Lewisian Apparatus:**
          *   *Common Knowledge:* Lewis requires a recursive structure (I know that you know that I know...). In biology, this is often modeled as "common information" or just the signal being public. The user's paraphrase is close enough for the argument.
          *   *Arbitrariness:* Lewis says there must be another regularity that *could* have prevailed. In biology, this is the alternative ESS (e.g., "Anti-Bourgeois").
          *   *Correction/Nuance:* Lewis emphasizes *preferences*. Agents prefer to coordinate *on something* rather than fail. In biology, "preference" is fitness payoff. This translation is standard but needs care.

      *   **Q2: Uncorrelated Asymmetry & Arbitrariness:**
          *   *The Core:* Yes, "Bourgeois" vs. "Anti-Bourgeois" is the biological analog of driving on the left vs. right.
          *   *The Worry:* The user worries about correlations with payoffs.
          *   *Analysis:* Maynard Smith specifically defined *uncorrelated* asymmetries as those not affecting R (Reward), V (Value), or C (Cost) of fighting. If ownership correlates with strength (correlated asymmetry), it's not a convention in the Lewis sense; it's just optimal behavior.
          *   *The Break:* The analogy breaks if the asymmetry *predicts* outcome. Lewisian convention is about *coordination* to avoid conflict, not predicting who wins based on strength. If the owner is stronger, playing Dove against them isn't convention; it's prudence. The essay must rigorously distinguish *uncorrelated* (convention) from *correlated* (assessment).
          *   *Refinement:* The "Bourgeois" strategy works *because* it avoids escalation. If V > C, Hawk-Hawk is sometimes okay. If V < C, coordination is vital.

      *   **Q3: Common Knowledge vs. Selective Feedback:**
          *   *The Philosophical Hurdle:* Lewis thinks common knowledge is constitutive of convention. If you remove it, is it still convention?
          *   *The EGT Move:* Skyrms and others argue the *functional role* of common knowledge is to stabilize expectations. Selection stabilizes behavior directly.
          *   *Verdict:* It's not "changing the subject" if you define convention functionally (solution to coordination problem). But a Lewis purist might say "No, that's just habit/instinct."
          *   *Strategy:* Argue that common knowledge is an *epistemic mechanism* for achieving stability, while selection is an *evolutionary mechanism* for the same end. The *structure* (equilibrium) is the same.
          *   *Key Term:* "Pseudo-convention" vs. "Proto-convention." Suggest framing it as "Convention without Cognizers."

      *   **Q4: Normativity (Gilbert):**
          *   *Gilbert's Point:* Conventions create obligations ("You *ought* to drive on the right").
          *   *User's Point:* Normativity is paint on the engine.
          *   *Philosophical Counter:* It's not just squeamishness. The "ought" distinguishes social norms from mere regularities (like everyone eating breakfast at 8).
          *   *Defense:* The biologist can argue that the *pressure* to conform (fitness cost) is the proto-normativity. The "obligation" is the shadow of the penalty.
          *   *Nuance:* Don't dismiss Gilbert entirely. Acknowledge the distinction between "normative force" (psychological) and "normative structure" (sanctioned behavior). Argue that the biological case shows the *structure* exists without the *force*. This is a stronger claim than "normativity doesn't matter."

      *   **Q5: Skyrms & Contribution:**
          *   *Skyrms:* He definitely covers the evolution of signaling and convention (*Evolution of the Social Contract*). He discusses correlated equilibrium.
          *   *Differentiation:* Skyrms is a philosopher using EGT. The user is a biologist using Philosophy.
          *   *The Niche:* The specific application to *contest behavior* and *uncorrelated asymmetries* (Maynard Smith/Parker) is more detailed in the bio literature than in Skyrms. Skyrms focuses heavily on signaling (Sender/Receiver). Contest behavior (Hawk/Dove/Bourgeois) is slightly different (symmetric players with asymmetric roles).
          *   *Advice:* Don't just say "Skyrms did this." Say "Skyrms established the framework, but the specific biological mechanics of *ownership* conventions offer a test case Skyrms didn't fully exploit." Focus on the *uncorrelated* aspect specifically.
          *   *Potential Pitfall:* If the essay just says "Biology looks like Lewis," Skyrms did that. If the essay says "Biology reveals that Lewis's epistemic conditions are functionally replaceable by selection pressures in a way that clarifies the *nature* of the arbitrariness," that's new.
          *   *Specific Suggestion:* Focus on the *stability* of the arbitrariness. In Lewis, rational agents can switch if they talk. In biology, the "lock-in" is harder to break (phylogenetic inertia). This adds a dimension of *historical contingency* that Lewis touched on but EGT makes concrete.

  4.  **Review and Refine:**
      *   *Tone:* Respectful, collegial, acknowledging the user's seniority in biology while offering philosophical precision.
      *   *Clarity:* Ensure the distinction between correlated and uncorrelated asymmetries is sharp.
      *   *Skyrms Check:* Make sure I'm not underestimating Skyrms. He does discuss Hawk-Dove. But the user's specific focus on the *normativity* and the *common knowledge replacement* might be the fresh angle.
      *   *Gilbert Check:* Ensure the user doesn't get blindsided by the "joint commitment" argument.

  5.  **Final Polish:** Organize by the user's five specific requests. (Self-Correction: Make sure to explicitly mention *correlated equilibrium* as the user brought it up. Aumann's correlated equilibrium is indeed the mathematical home for this, where the asymmetry is the correlation device.)

  6.  **Final Output Generation:** (Drafting the response based on the above thoughts.)
answer: |-
  This is a formidable project. You are standing precisely at the intersection where the philosophy of social science and theoretical biology have been converging for the last thirty years. Your intuition is sound: the structural isomorphism between Lewisian convention and Evolutionarily Stable Strategies (ESS) in asymmetric contests is robust. However, because you are aiming for publication in a philosophical venue (or a interdisciplinary one), the devil is in the technical distinctions.

  Here are my comments, structured according to your five specific requests.

  ### 1. Accuracy of the Lewisian Apparatus

  Your paraphrase of Lewis is generally accurate, but there are two nuances where a philosopher might press you.

  **Common Knowledge:** You describe it as "nested expectations." This is correct, but Lewis (following Schelling) emphasizes that common knowledge is the *solution* to the coordination problem, not just a byproduct. For Lewis, it is not enough that I expect you to conform; I must expect you to conform *because* you expect me to conform.
  *   **The Trap:** If you simply say "selection replaces expectations," a Lewisian might object that selection replaces the *behavior* but not the *reasoning*.
  *   **The Fix:** Frame it carefully. Do not say selection *is* common knowledge. Say that common knowledge serves a functional role in Lewis's account (stabilizing the equilibrium against deviation), and natural selection fulfills that *same functional role* in biological populations. You are arguing for functional equivalence, not identity of mechanism.

  **Arbitrariness:** Lewis requires that there be an alternative regularity that *could* have prevailed and would have solved the coordination problem just as well.
  *   **The Trap:** In biology, "could have prevailed" is a modal claim about historical possibility, not just logical possibility.
  *   **The Fix:** Ensure you emphasize the existence of the alternative ESS (e.g., the "Anti-Bourgeois" strategy where the intruder keeps and the owner yields). As long as the payoff matrix is symmetric regarding the asymmetry (ownership confers no fighting advantage), the alternative strategy is indeed an ESS. This satisfies Lewis's arbitrariness condition.

  ### 2. Uncorrelated Asymmetry and Arbitrariness

  This is the crux of your empirical claim. You are right to worry about "coasting on clean examples."

  **The Distinction:** Maynard Smith and Parker (1976) distinguish between **correlated asymmetries** (e.g., size, strength, resource holding potential) and **uncorrelated asymmetries** (e.g., ownership, sunrise/sunset, left/right).
  *   **Correlated:** If the owner is usually stronger, playing "Dove" against an owner is not convention; it is assessment. It is the rational (or evolved) response to a higher probability of losing. This does *not* track Lewisian arbitrariness.
  *   **Uncorrelated:** If ownership confers no physical advantage, but the population stabilizes on "Owner Wins," this *is* Lewisian convention.

  **Where the Analogy Breaks:**
  The analogy strains if the "uncorrelated" asymmetry becomes correlated over time. For example, if owners value the resource more (due to sunk costs or familiarity), the payoff $V$ is no longer symmetric. If $V_{owner} > V_{intruder}$, the "Bourgeois" strategy is no longer arbitrary; it is payoff-driven.
  *   **Advice:** You must explicitly bracket cases where ownership correlates with valuation or fighting ability. Stick to the theoretical ideal of the *uncorrelated* asymmetry. Acknowledge that in the wild, pure uncorrelated asymmetries are rare, but argue that the *logic* of the model demonstrates the possibility of convention without cognition. The philosophical point holds even if the biological instances are messy, provided the model is sound.

  ### 3. Common Knowledge vs. Selective Feedback

  Is this philosophically respectable, or does it change the subject?

  **The Objection:** A strict Lewisian (or a Kantian) might argue that without the *belief* that others believe, you have mere *habit* or *instinct*, not convention. They might say you have described the *preconditions* for convention (stable regularity), but not convention itself.

  **The Defense:** This is where you lean on the **Correlated Equilibrium** (Aumann). In a correlated equilibrium, a public signal (the asymmetry) recommends a strategy to each player. No player gains by deviating given the signal.
  *   **Your Move:** Argue that Lewis was captivated by the *structure* of the solution (coordination on an arbitrary equilibrium), but he was historically constrained to model it via rational cognition. Evolutionary Game Theory (EGT) reveals that the *structure* is the invariant, while the *mechanism* (reasoning vs. selection) is variable.
  *   **Verdict:** It is respectable, provided you frame it as a **generalization** of Lewis, not a refutation. You are arguing that Lewis identified a structural phenomenon (arbitrary coordination equilibrium) but misidentified the necessary substrate (rational minds). You are "naturalizing" Lewis. This is a standard and accepted move in contemporary philosophy of social science (see below on Skyrms).

  ### 4. Normativity (The Gilbert Objection)

  You are wary of dismissing Margaret Gilbert, and you should be. Dismissing her as "anthropocentric squeamishness" is the quickest way to get a paper rejected by a philosophy journal.

  **Gilbert's Point:** For Gilbert, a convention entails a "joint commitment." It creates an *obligation*. If you drive on the left in the UK, I am not just *predicted* to drive on the left; I am *entitled* to blame you if you don't. Lewis's account, she argues, reduces this to mutual expectation, missing the normative "glue."

  **Your Biologist's Intuition:** You view the "obligation" as the fitness cost of deviation.
  **The Philosophical Nuance:** The cost of deviation is not an obligation; it is a penalty. An obligation implies a *right* to enforce.

  **How to Defend Your Position:**
  Do not say normativity is irrelevant. Say that **normativity is a second-order stabilization mechanism.**
  1.  **Level 1 (Biological):** The convention exists as an ESS. Deviation is punished by fitness loss (conflict). This is "proto-normativity" or "functional normativity."
  2.  **Level 2 (Human/Cultural):** We layer explicit sanctions and moral language over Level 1.
  *   **The Argument:** Gilbert mistakes the cultural superstructure (Level 2) for the foundation (Level 1). Your essay can argue that the *obligation* is a cognitive representation of the *evolutionary stability*. The "reason to conform" is the fitness cost, which humans cognitively represent as "duty."
  *   **Why this works:** It grants Gilbert her phenomenological point (humans *feel* obligation) without conceding her metaphysical point (obligation is irreducible to regularities). It treats normativity as an evolved cognitive heuristic for tracking equilibria. This is a defensible, naturalistic position.

  ### 5. Skyrms and Distinct Contribution

  This is your most critical question. Brian Skyrms (*The Evolution of the Social Contract*, 1996; *Signals*, 2010) has indeed mapped this territory. He explicitly discusses Lewis, convention, and evolutionary dynamics. He also discusses correlated equilibrium and signaling.

  **Is this a footnote?**
  It *could* be, if you simply argue "EGT shows Lewisian convention evolves." Skyrms did that.
  **Where is the contribution?**
  Your contribution lies in the **specifics of contest behavior** and the **uncorrelated asymmetry**.
  1.  **Skyrms on Signaling vs. Contest:** Skyrms focuses heavily on *Sender-Receiver* games (signaling). Your focus is on *Contest* games (Hawk-Dove-Bourgeois). While structurally similar, the literature on animal contests (Maynard Smith, Parker, Hammerstein) is distinct from the signaling literature. Applying the Lewisian lens specifically to *ownership conventions* in contests is a narrower, more empirically grounded niche than Skyrms's broad theoretical strokes.
  2.  **The "Uncorrelated" Specificity:** Skyrms discusses how correlations evolve. You can go deeper on the specific biological debate about whether asymmetries are truly uncorrelated. You can bring the biological empirical reality to bear on the philosophical model in a way Skyrms (as a philosopher) did not.
  3.  **The Normativity Angle:** Skyrms is less concerned with the Gilbert-style normativity objection. If you can successfully naturalize the "obligation" aspect using the biological penalty structure, that is a distinct philosophical contribution.

  **Recommendation for Digging In:**
  *   **Don't** just summarize Skyrms. Acknowledge him generously in the introduction ("As Skyrms has famously demonstrated...").
  *   **Do** pivot quickly to the Maynard Smith/Parker material. Use the "Bourgeois" strategy as your primary case study, rather than signaling.
  *   **Do** focus on the **historical contingency**. Lewis mentions it, Skyrms models it, but you can argue that biological phylogenies show us *how* locked-in these arbitrary choices become. The "path dependence" in biology is often stronger than in rational agent models because of genetic/developmental constraints. This adds a layer of "hardness" to the convention that Lewis didn't anticipate.

  ### Summary Advice

  Your thesis is viable and valuable. To ensure it lands:
  1.  **Sharpen the "Uncorrelated" definition.** Distinguish it rigorously from assessment strategies.
  2.  **Reframe the Normativity.** Don't dismiss Gilbert; naturalize her "obligation" as a cognitive tracking of fitness penalties.
  3.  **Position against Skyrms.** You are applying the framework to a specific, empirically rich domain (contest behavior) that Skyrms touched on but did not exhaust, particularly regarding the "uncorrelated" nuance.
  4.  **Terminology.** Use "Correlated Equilibrium" confidently. It is indeed the correct game-theoretic home for Lewisian convention with asymmetric signals.

  You are effectively arguing that **Lewis discovered the logic of social contracts, but mistook the species capable of signing them.** That is a strong, publishable claim.
