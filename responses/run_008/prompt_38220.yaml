      *   **External Reasons:** Reason $\phi$ exists for agent $A$ even if no sound deliberative route from $S$ leads to $\phi$. It is a normative fact independent of $A$'s psychology.
      *   **The Husband Case:** Husband doesn't care about wife. Externalist: He has a reason to be kind. Internalist: Only if he *could* come to care via deliberation; otherwise, the claim is false/mysterious.

  3.  **Deconstruct the Economic Concepts:**
      *   **Revealed Preference ($\succeq_{raw}$):** Choice data.
      *   **Stated Preference:** Survey data (often ignored in strict revealed preference).
      *   **Corrected/Laundered Preference ($\succeq_{corr}$):** Adjusted for mistakes, misinformation, framing, inconsistency (e.g., Thaler & Sunstein's "nudge" logic, or standard welfare econ corrections).
      *   **Social Welfare Function ($W$):** Aggregation of individual utilities/orderings.
      *   **Paternalism:** Acting on $\succeq_{corr}$ against $\succeq_{raw}$.
      *   **Interpersonal Comparison:** Required for $W$, often avoided in Paretian welfare econ.

  4.  **Drafting Part 1: Restatement in Economic Terms:**
      *   *Internalism:* "Agent $A$ has most reason to choose $x$" $\equiv$ "$x$ is top-ranked in $A$'s corrected preference ordering $\succeq_{A}^{corr}$."
      *   *Interpretive Flag 1 (Deliberation vs. Correction):* Williams's "sound deliberative route" is dynamic and psychological. Econ "correction" is usually static and logical (removing noise/errors). Deliberation can *transform* values; correction usually *reveals* latent true values. This is a crucial divergence.
      *   *Interpretive Flag 2 (Motivational Set):* Williams's $S$ is broader than "preferences." It includes commitments and projects that might not look like utility maximization. Econ reduces $S$ to a utility function.
      *   *Externalism:* "Agent $A$ has most reason to choose $x$" $\equiv$ "$x$ is top-ranked in a normative ordering $\succeq_{norm}$ that is not identical to $\succeq_{A}^{raw}$, $\succeq_{A}^{corr}$, or any aggregation of others' preferences."
      *   *The Problem:* In econ, all orderings must belong to *someone* (an agent or a social planner). An ordering that belongs to *no one* is ontologically suspicious in econ. It looks like a "Social Welfare Function" but without the "Social" (aggregation) part. It's a "View from Nowhere" ordering.

