      *   *Clean Translation:* Internalism maps well to "True Preference" welfare economics (Bernheim, Rangel, etc.). The idea that welfare is about satisfying what the agent *would* want under ideal conditions is standard internalist territory.
      *   *Distorted:* Williams's "deliberation" is richer than "information correction." Econ correction assumes a stable true preference obscured by noise. Williams allows deliberation to *create* new motivations not latent in the original set (though anchored in it). Econ struggles with endogenous preference change that isn't just "learning."
      *   *Inexpressible:* External Reasons. Econ has no variable for "Objective Normative Reason."
