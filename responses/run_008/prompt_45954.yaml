      *   **User's Hypothesis:** It's partly verbal ("real") but has an empirical core (robustness across methods/architectures, polysemanticity/superposition).
      *   **Task:** Diagnose the disagreement (substantive, verbal, or distinct questions?) based on what each side says. Then, specify what would count as genuine progress (experimental, conceptual, or nil).
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the Debate:**
      *   *The Realist (Interp) Position:* They operate under a pragmatic/instrumentalist realism. If I find a direction in activation space that corresponds to "gold" or "French language" and I intervene on it to change the output, that direction *functions* as a representation. They care about causal leverage.
      *   *The Anti-Realist (Skeptic) Position:* They often lean on a stricter metaphysical criterion. A "representation" implies a discrete, stable symbol-like entity. Since neural nets are distributed, superposed, and basis-dependent, any "feature" is just a convenient coordinate system chosen by the observer (the researcher), not an intrinsic property of the weights.
      *   *The Deflationist Position:* "Representation" is a folk-psychological term ill-suited for high-dimensional vector geometry. Asking if it's "real" is like asking if a constellation is "real." The stars are real, the pattern is useful, but the constellation isn't a physical object.

  3.  **Diagnose the Disagreement:**
      *   *Is it purely verbal?* No. If it were just about the word "representation," they could agree on the maths and disagree on the label. But they disagree on *what counts as evidence*. The Realists think causal intervention is sufficient proof of ontology. The Skeptics think causal intervention only proves utility, not ontology.
      *   *Is it purely metaphysical?* No. There are empirical claims about robustness, superposition, and transferability.
      *   *Is it distinct questions?* Yes, this is the strongest diagnosis. There is a *scientific* question (Can we find stable, causal levers in the network that generalise?) and a *metaphysical* question (Do these levers constitute "representations" in the philosophical sense?). The debate stalls because Realists answer the scientific question and claim it settles the metaphysical one, while Skeptics deny that link.
      *   *Conclusion:* It is a **category error masquerading as a substantive dispute**, rooted in differing criteria for ontological commitment. It's a mix of verbal ambiguity and divergent standards of evidence.

  4.  **Determine What Counts as Progress:**
      *   *If it's verbal:* We need a stipulative definition. (Boring, doesn't solve the tension).
      *   *If it's scientific:* We need robustness checks. Do SAE features match across seeds? Do they match across architectures? (This is happening, but Skeptics will just move the goalposts).
