          2.  *Natural Kinds:* If features correspond to environmental structure (not just task performance), that boosts realism.
          3.  *Theory:* A theory of "functional decomposition" that doesn't rely on human-intelligible concepts.

  5.  **Drafting the Response (incorporating British English):**
