  The non-negotiable requirements are dynamic consistency and the prohibition of actual sure losses, but satisfying both forces a contradiction between separability and the rationality of resolute commitment.

  **1. Dynamic Consistency**
  *   **Motivating Case:** An agent plans at $t_0$ to execute sequence $X$ at $t_1$, but when $t_1$ arrives, prefers $Y$. If rationality requires sticking to the plan, the agent is resolute; if it requires following current preference, the agent is dynamically inconsistent.
  *   **Money Pump Status:** The pump assumes dynamic inconsistency (myopia) to execute the loop. It delivers nothing against an agent who dynamically consistent either by sticking to the plan (resolute) or by anticipating the shift and refusing the start (sophisticated).
  *   **Untouched:** Whether violating consistency to keep a plan is rational or stubborn is left unresolved.

  **2. Non-Exploitability (Outcome vs. Disposition)**
  *   **Motivating Case:** Distinguishing an agent who *loses* money (exploited) from one who *would* lose money if traded against (exploitable). The foreseeing agent retains their money despite cyclic preferences.
  *   **Money Pump Status:** Delivers that cyclic preferences + myopia = loss. Leaves untouched whether cyclic preferences alone are irrational if the agent is sophisticated.
  *   **Untouched:** Whether rationality constrains dispositions (preferences) or only outcomes (wealth).

  **3. Separability (History Independence)**
  *   **Motivating Case:** Choices at a node should depend only on future prospects from that node, not on how you arrived there or what you planned earlier.
  *   **Money Pump Status:** The pump requires this; each trade is offered as a standalone deal. If past trades matter (e.g., "I already paid $1, I won't pay more"), the pump stalls.
  *   **Untouched:** Whether ignoring sunk costs is always rational or sometimes a failure of commitment.

  **4. Preference Stability**
  *   **Motivating Case:** Distinguishing legitimate preference change (learning, aging) from irrational instability (cycling).
  *   **Money Pump Status:** Assumes stability to label cycling as irrational. If preferences legitimately change between trades, the pump is just a series of rational trades reflecting new states.
  *   **Untouched:** The theory provides no metric to distinguish learning from instability.

  **5. Unified Agency**
  *   **Motivating Case:** Whether one theory covers both the myopic agent (who gets pumped) and the sophisticated agent (who refuses).
  *   **Money Pump Status:** Standard theory covers both but classifies the sophisticated agent as irrational for having cyclic preferences, even if they lose no money.
  *   **Untouched:** Whether a theory should penalize structural irrationality that yields no practical cost.

  **The Fundamental Incompatibility**
  You cannot jointly satisfy **Separability** and **Resolute Choice**.
  *   If you enforce **Separability** (standard decision theory), an agent cannot rationally bind themselves to a past plan if current preferences differ; this makes resolute commitment irrational stubbornness, leaving sophisticated agents vulnerable to preference cycles unless they prune their options preemptively.
  *   If you allow **Resolute Choice** (McClennen/Bratman), an agent can stick to a plan to avoid exploitation, but this violates Separability because the choice at $t_1$ depends on the plan made at $t_0$, not just the subtree at $t_1$.
  *   **Verdict:** You must choose between a theory that forbids commitment (Separability) or a theory that forbids history-independence (Resolute Choice).

  **The Bookie's Role**
  The money pump constrains rationality only in idealized markets. It requires a bookie with zero transaction costs, perfect knowledge of your preferences, and the ability to recur indefinitely. In real contexts with friction or opacity, cyclic preferences may never lead to loss, suggesting the pump proves a constraint on *idealized* consistency rather than *practical* rationality. If the theory requires a bookie to prove irrationality, it constrains rationality-among-bookies, not rationality *simpliciter*.
