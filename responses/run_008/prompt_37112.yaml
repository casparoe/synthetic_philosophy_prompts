  1. the scenario itself
  2. the verdict on the absolute reading, with the reason
  3. the verdict on the comparative reading, with the reason
  4. the single feature of the case doing the work, and what happens to the divergence if i remove it
  5. what a defender of DDE would say to get out of it — e.g. which condition they'd claim was implicit all along

  this is for a discussion section where students have to figure out which reading they buy, so the case can't lean on any verdict being stipulated. and if the case genuinely can't be built under these constraints, say so and tell me which one to loosen.
