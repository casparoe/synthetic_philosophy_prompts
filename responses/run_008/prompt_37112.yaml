  1. A city planner authorizes a waste facility that eliminates public health risks but emits noise violating sleep guidelines for nearby residents, whereas a quieter technology eliminates the risks without noise but costs 10% more of the annual budget.
  2. The absolute reading permits the facility because the total good of eliminating public health risks is sufficiently weighty to outweigh the foreseen harm of sleep disruption.
  3. The comparative reading forbids the facility because inflicting sleep disruption is disproportionate when the same health security could be achieved without harm by absorbing the reasonable budget cost.
  4. The divergence rests entirely on the availability of the slightly costlier harm-free alternative; if the quieter technology were unavailable, both readings would permit the facility.
  5. A defender of the doctrine would argue that necessity is a separate condition from proportionality, so the comparative reading mistakenly collapses two distinct requirements into one.
