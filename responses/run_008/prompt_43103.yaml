  ### The Quiz

  Welcome to the operational species concept inventory. For each scenario, choose A (Recognize/Split) or B (Ignore/Lump). Be honest about your lab practice, not your textbook definitions. This reveals your actual working taxonomy. Many students claim one concept but practice another. There are no right answers, only consistent ones.

  1. Two sympatric lineages never interbreed but are morphologically identical genetically distinct. Do you describe them as distinct species? (A/B)
  2. An ancient all-female asexual lineage contains distinct genetic clades morphologically similar. Do you assign them species names? (A/B)
  3. A fossil sequence shows gradual morphological change over millions of years in stratigraphy. Do you divide it into sequential species? (A/B)
  4. Two populations exchange genes occasionally but occupy completely different ecological niches and behaviors. Are they one species or two? (A=Two, B=One)
  5. In a ring species, terminal populations meet but do not interbreed genetically. Do you classify them as separate species? (A/B)
  6. Two allopatric populations differ slightly in color but have no contact test possible. Do you treat them as separate species? (A/B)
  7. A single population shows high morphological variation but interbreeds freely producing fertile offspring. Do you split it into multiple species? (A/B)
  8. A stable hybrid swarm persists for millennia without collapsing into homogeneity. Do you recognize it as a single species? (A=Yes, B=No/Complex)

  Your pattern reveals your working concept, regardless of your professed label. Tally your A responses to find your position below. Most users will not fit perfectly; look for the strongest trend. Record your total A count and compare it against the scoring key provided subsequently.

  ### Scoring Key

  Count "Split" (A) responses. Match pattern to description. A majority of matches indicates your primary leaning.

  Interbreeding/Isolation View: Splits 1, 5, 6; Lumps 4, 7. You prioritize reproductive isolation above traits or ecology. Gene flow defines the boundary. Aligns with Biological Species Concept.

  Diagnosability View (Morph/Phylo): Splits 1, 2, 3, 8; Lumps 7. You prioritize distinct characters or monophyly over gene flow. If it looks or sequences different, it counts. Covers Morphological and Phylogenetic Concepts.

  Ecological View: Splits 4 specifically; may lump 1 if niches overlap. You prioritize adaptive divergence and niche occupancy over reproductive compatibility. Niche difference matters most.

  Pluralist: Mixed logic (e.g., Split 3 & 4, Lump 1). You accept different criteria for different taxonomic groups or contexts rather than one universal rule. Taxonomy is a toolbox.

  Eliminativist/Skeptic: Lumps most cases (No to 1, 2, 3, 5). You view species as arbitrary ranks on continuous lineages rather than real units existing in nature. Ranks are arbitrary.

  Unnamed: Splits 7 (polymorphism) but Lumps 1 (cryptic). This is incoherent; it prioritizes looks over isolation without consistency, fitting no established theory. Philosophically indefensible position.

  If your score is mixed, you likely operate as a Pluralist or haven't considered the contradictions. Check which cases triggered a Split response. High scores on 2 and 3 indicate comfort with non-sexual or temporal data.

  ### What the quiz can't sort

  This quiz conflates Morphological and Phylogenetic concepts under Diagnosability, as both rely on distinctness rather than process. It also fails to distinguish operational convenience from ontological commitment; a student might answer based on grant requirements rather than belief. Finally, it misses the Genic Species Concept nuance regarding specific isolating barriers versus genome-wide isolation. Geographic variation nuances are also lost in the allopatry question. Mixed scores may reflect uncertainty. Use caution.
