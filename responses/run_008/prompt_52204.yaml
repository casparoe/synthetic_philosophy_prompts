answer: |-
  Hey, it was great seeing you at dinner, and I have to admit that conversation about the engagement ring has been sticking with me too. It is one of those social practices that looks completely irrational until you start pulling at the threads of what it is actually doing, and then it becomes a fascinating knot of economics, sociology, and signaling theory. You asked whether the practice presupposes the handicap principle, where the ring acts as a costly signal precisely because it is wasteful, or if it is something else like a coordination convention or a sunk cost deterrent. My take is that the specific norm of spending a significant portion of income on a diamond strictly presupposes the costly signaling theory, even if the general practice of exchanging a token could be explained by convention. The reason the resale value is so terrible is not an accident of the market but a feature of the signal. If the ring held its value like gold or real estate, it would function as a savings account or a transfer of assets, which does not prove commitment in the same way. To signal honestly under the handicap principle, the cost must be painful enough that a less committed person would not pay it. The fact that you lose money the moment you buy it ensures that the spender is burning resources specifically to demonstrate that they value the relationship more than the utility of that cash. This is why the lab-grown diamond stigma exists even though the chemical structure is identical. The physical object is not what is being consumed here; the economic sacrifice is the product. A lab-grown ring breaks the signaling mechanism because it decouples the visual size of the stone from the economic pain required to acquire it, making the signal cheap to fake.

  However, we need to separate what the practice strictly needs from what merely fits well with it. The existence of a ring itself could easily be a coordination convention, a focal point that allows everyone to know when a couple is off the market without needing to ask. In that purely conventional view, the object could be a cheap band, a specific type of necklace, or even a public social media post. The convention only requires that we all agree on the symbol, not that the symbol be expensive. But because the norm specifically dictates a price range tied to income, the practice moves beyond mere convention into the realm of costly signaling. The sunk cost deterrent theory, where the ring makes the man think twice before walking away, is compatible with the practice but seems too weak to explain the spending levels. The cost of a ring, even at three months salary, is negligible compared to the financial devastation of a divorce or the splitting of assets in a no-fault state. If the ring were truly a deterrent against breaking the engagement, the cost would need to be prohibitive, yet people break engagements all the time and write off the ring cost. So while the sunk cost might play a minor psychological role, it is not the primary engine driving the price norm.

  The timing and gender asymmetry you pointed out is where the theory gets really interesting, because on the surface it does seem inconsistent with modern economic realities. Historically, the ring functioned as a form of bridewealth or insurance for the woman, compensating her family for the transfer of labor and signaling the man's ability to provide. In a world where women have their own incomes and no-fault divorce exists, the economic necessity of that insurance has vanished. Yet the practice persists. This suggests that the signal has shifted from proving "capacity to provide" to proving "willingness to sacrifice." Even if the woman earns money, the ritual remains asymmetric because the proposal itself is still scripted as a question asked by one party and answered by the other. The ring is the bond posted with the offer. If the practice were truly updated to reflect mutual economic partnership, we might expect a mutual signaling equilibrium where both parties exchange rings or gifts of equal value at the moment of proposal. The fact that we do not see this suggests that the practice is underdetermined by current economics and is instead running on cultural path dependence. It presupposes a model of commitment where one party must prove their seriousness first to overcome the risk of rejection, even if the underlying economic risks of marriage are now shared.

  If we were to swap the implicit theory for a pure convention story, the practice would look radically different. The price norm would disappear entirely. We would see a return to something like class rings or simple tokens where the recognition value is high but the monetary cost is low. The focus would be on the design being recognizable rather than the carat weight being impressive. If we swapped to a mutual-signaling theory, which would better fit a relationship of equals, the proposal ritual would likely become a negotiation or a mutual exchange rather than a surprise question accompanied by a unilateral gift. We might see both partners wearing engagement rings, or perhaps the financial burden would be shared explicitly. The fact that the ring remains expensive and unilateral tells us that despite our modern rhetoric about partnership, the underlying script still relies on an old-fashioned proof of devotion through resource burning.

  So to answer your question about whether the practice is presupposing something inconsistent, I think it is less inconsistent and more lagging. It is preserving a signaling mechanism from a time when the economic stakes for women were higher, but repurposing it as a romantic gesture. The inconsistency you feel comes from the clash between the modern ideology that money cannot buy love and the practical requirement that you must spend money to prove love. The practice resolves this by treating the money as destroyed. If the money were an investment, it would be transactional. Because it is wasted, it becomes sacrificial. That is why the terrible resale value is the whole mechanism. If rings held their value, the conversation at dinner would be about investment portfolios, not commitment. The practice survives because it solves a coordination problem about trust in a way that feels romantic, even though the engine driving it is essentially economic peacocking. It is a beautiful inefficiency, but an inefficiency nonetheless.
