      *   *The Philosophical Angle:* This touches on "Pragmatic Encroachment" or "Stakes-Sensitive Epistemology."
      *   *Traditional View:* Knowledge is binary. You either know $P$ or you don't. Evidence supports $P$ to degree $X$. Stakes shouldn't matter. (Contextualism/Invariantism).
      *   *Modern View:* Pragmatic Encroachment (Jason Stanley, etc.). Whether you "know" something can depend on what happens if you're wrong. (e.g., Knowing the bank is open on Saturday matters more if your mortgage is due Monday than if you just want to deposit a check).
      *   *Coherence:* It's not "we act on 51% confidence whenever we don't care." It's "the cost of error dictates the required confidence." It's a decision-theoretic approach, not purely epistemic. The law isn't trying to find *Truth* in the abstract; it's trying to distribute *Error*.
      *   *Key Concept:* The Blackstone Ratio ("Better that ten guilty persons escape than that one innocent suffer"). This is about moral weight, not just probability.

  3.  **Deconstruct Core Question 2: One Flat Threshold:**
      *   *Scenario:* Say we set everything at 75% or 90%.
      *   *Consequences:*
          *   If set low (51%): Too many innocent people go to jail. Liberty is cheap.
          *   If set high (95%): Too many liable defendants walk in civil cases. Victims go uncompensated. Justice is too expensive.
      *   *What we lose:* The ability to balance societal values. Criminal law is about liberty/retribution (high stakes for defendant). Civil law is about compensation/restoration (balanced stakes).
      *   *Procedural Changes:* Jury instructions would change. Appeals would change. Plea bargains might shift.
      *   *Is it historical accretion?* No, it's functional. It reflects the asymmetry of harm.

