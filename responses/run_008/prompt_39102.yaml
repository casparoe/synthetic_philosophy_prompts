  # Distributive Justice Diagnostic Tree

  **Instructions:** Answer the eight cases below in order. Cases 1–5 establish your core metric and responsibility view. Cases 6–8 are "exit gates"; a specific answer at these nodes routes you to a critic's position, but your earlier answers determine which luck egalitarian view you were closest to before exiting. If you do not trigger an exit, you land on a luck egalitarian leaf.

  ### The Decision Nodes

  **1. The Auction**
  Two shipwreck survivors divide all island resources by bidding with equal clamshells under an envy test; one ends up with more goods but the other does not envy them. Do we allow this inequality to stand without further redistribution?
  *Rationale: Tests whether the baseline of justice is procedural fairness in resources or substantive equality in outcomes.*

  **2. The Metric**
  Two people have identical resources, but one is naturally content and the other finds nothing in life satisfying. Does the fact that they are equally resourced settle the question of their equality?
  *Rationale: Distinguishes those who equalize external means from those who equalize internal states or access.*

  **3. The Surfer**
  Someone who could work full time deliberately surfs a few hours a day and lives frugally, while a neighbor works long hours at a job she dislikes. Should the state even things out between them?
  *Rationale: Tests whether individual choice negates a claim to equalization.*

  **4. Expensive Tastes**
  One person cultivates, knowingly and over years, a taste for champagne and caviar; another, through no cultivation of her own, cannot feel satisfaction with anything less than the finest food. Does either have a claim on others, and for the same reason?
  *Rationale: Distinguishes responsibility for preferences from unchosen disabilities in the welfare metric.*

  **5. Chosen Risk**
  A skier is disabled after ignoring posted avalanche warnings, contrasted with someone born with the identical injury. Should the correction owed track the source of the disadvantage, its foreseeability, or only its severity?
  *Rationale: Tests the limits of option luck versus brute luck in assigning liability.*

  **6. The Negligent Motorist**
  A motorist stranded in a snowstorm of his own making requires rescue. Should the state's rescue be conditional, may rescuers treat him as the author of his plight, and does charity administered with that attitude degrade the recipient?
  *Rationale: Determines if the demand for equality is overridden by the demand for non-domination and social standing.*

  **7. Below the Threshold**
  Two people are both badly off, where the only possible transfer goes from the somewhat less poor of the two to the much poorer. Does the absolute gap between them or their position relative to a decent minimum determine whether the transfer is required?
  *Rationale: Separates those who care about gaps from those who care only about absolute sufficiency or priority.*

  **8. The Ascetic**
  Someone whose religious commitments lead her to fast into ill health, and whose resulting need for care is predictable but bound up with what she regards as her salvation. Is the state obligated to treat the illness, or is this a cost she must bear for her convictions?
  *Rationale: Tests whether deep personal commitments count as choices that negate social support, marking the strict desert view.*

  ***

  ### Scoring Key & Leaf Mapping

  **Instructions for the TA:** Trace the student's path. If they trigger an **Exit Node** (6, 7, or 8), assign the Exit Leaf but use their answers to 1–5 to describe their "Luck Egalitarian Shadow." If their answers contradict each other (Crisscross), use the **Tension Diagnosis**.

  #### **Exit Leaves (Critics)**
  *   **Relational/Democratic Egalitarianism (Anderson/Scheffler):** Triggered at **Node 6** if the student insists rescue must be unconditional and non-degrading.
      *   *Closest LE View:* Check Nodes 1–3. If they respected the Auction (Node 1) but compensated unchosen misery (Node 2), they are **Dworkinian Relationalists**. If they prioritized welfare equality (Node 2) over resources, they are **Arnesonian Relationalists**.
  *   **Sufficientarianism (Frankfurt):** Triggered at **Node 7** if the student says the transfer depends *only* on whether the recipient falls below a decent minimum, regardless of the gap.
      *   *Closest LE View:* Check Node 2. If they focus on resources, they are **Resource Sufficientarians**. If they focus on welfare/satisfaction, they are **Welfare Sufficientarians**.
  *   **Prioritarianism (Parfit):** Triggered at **Node 7** if the student says the transfer is required because the recipient is *worse off*, but explicitly denies the *gap itself* is the injustice (priority to the worse off, not equality).
      *   *Closest LE View:* Usually aligns with **Plain Welfare Egalitarianism** (Node 2 = Yes) but rejects the egalitarian metric.
  *   **Strict Desert:** Triggered at **Node 8** if the student says the ascetic bears the cost because entitlements track contribution or effort alone.
      *   *Closest LE View:* Check Node 5. If they distinguished sharply between chosen risk and birthright, they are **Hard Luck Egalitarians** who have hardened into Desert.

  #### **Luck Egalitarian Leaves**
  *   **Brute-Luck Egalitarianism (Dworkin):** Path: Node 1 (Yes/Stand) → Node 2 (No/Resources settle it) → Node 3 (No/No comp for surfer) → Node 4 (No comp for cultivated) → Node 5 (No comp for option luck).
  *   **Equality of Opportunity for Welfare (Arneson) / Access to Advantage (Cohen):** Path: Node 1 (No) → Node 2 (Yes) → Node 3 (No/Choice matters) → Node 4 (Comp for unchosen only).
      *   **FLAG:** This tree cannot separate Arneson from Cohen without esoteric questions about the nature of "access." Treat this leaf as **Arneson/Cohen**.
  *   **Plain Welfare Egalitarianism:** Path: Node 1 (No) → Node 2 (Yes) → Node 3 (Yes/Compensate surfer).

  #### **Diagnostic Notes (Empty Cells & Tensions)**
  *   **The "Insurance without Responsibility" Cell:** If a student answers **Node 1 (Yes/Stand)** but **Node 3 (Yes/Compensate Surfer)**, they occupy an **Incoherent Cell**.
      *   *Diagnosis:* The hypothetical insurance market is *designed* to track responsibility; accepting its results while denying responsibility renders the device ornamental. Ask the student: "If the auction results don't track responsibility, what moral work is the auction doing?"
  *   **Crisscross Paths (Tension Diagnosis):** For students whose answers zigzag (e.g., compensating the surfer but not the skier), do not assign a named leaf. Instead, describe the tension: "You prioritize choice in Node 5 but ignore it in Node 3. Your view suggests you penalize risk-taking more than laziness, which implies a **Paternalistic Luck Egalitarianism** rather than a consistent theory."
  *   **Unexplored Cells:** A position that compensates for *cultivated* tastes (Node 4 = Yes) but *not* for *born* disabilities (Node 4 = No) is **Merely Unattractive**. It inverts the standard responsibility intuition without a principled basis.

  #### **TA Script for Ambiguous Students**
  *"Your answers suggest you hold [Position X] regarding resources, but [Position Y] regarding welfare. Rather than forcing a label, notice that your intuition at Node [N] conflicts with Node [M]. This tension is exactly where the debate between [Thinker A] and [Thinker B] lives. For discussion section, prepare to defend why your view treats the Surfer differently from the Skier."*
