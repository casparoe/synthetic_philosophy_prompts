answer: |-
  ### Part I: Translation of the Aggregation Theorem and Debate

  Here is Harsanyi's Aggregation Theorem and the subsequent literature restated in the vocabulary of opinion pooling. I have inserted **Flags** where the mapping strains against the structural differences between aggregating beliefs (statistics) and aggregating preferences (welfare).

  **The Setup**
  *   **The Experts:** A society of $N$ individuals.
  *   **The Forecasts:** Instead of submitting probability distributions over states of the world, each expert $i$ submits a von Neumann–Morgenstern utility function $u_i$ over outcomes. In your vocabulary, treat $u_i$ as the *quantity being aggregated*, occupying the structural position of a probability distribution $P_i$.
  *   **The Assessor:** A social planner employing a Social Welfare Functional (the pooling rule) to produce a collective utility function $W$.
  *   **The Common Prior:** All experts and the assessor share a common subjective probability measure $P$ over the states of the world $S$. **Flag 1:** In standard opinion pooling, experts typically *disagree* on the probabilities ($P_i \neq P_j$). Harsanyi's theorem requires agreement on the risk (the probabilities) to aggregate the values (the utilities). This inverts the standard statistical setting where we aggregate probabilities assuming a common truth, rather than aggregating values assuming common probabilities.
  *   **The Axiom (Pareto/Unanimity):** If, for any two prospects $f$ and $g$, every expert expects $f$ to yield higher utility than $g$ (i.e., $E_P[u_i(f)] \geq E_P[u_i(g)]$ for all $i$), then the assessor must rank $f$ at least as high as $g$ ($E_P[W(f)] \geq E_P[W(g)]$). In pooling terms, this is **Strong Unanimity Preservation**: if all experts agree on the ranking of forecasts, the pool must respect that ranking.
  *   **Rationality Constraint:** The assessor's social preference must satisfy the vNM axioms (completeness, transitivity, continuity, independence). In pooling terms, this is analogous to requiring the pooled distribution to satisfy the axioms of probability (normalization, additivity).

  **The Theorem (Harsanyi 1955)**
  Under the conditions of Common Prior and Rationality, if the pooling rule satisfies Unanimity Preservation, then the social utility function $W$ must be a **Linear Pool** of the individual utility functions:
  $$W(x) = \sum_{i=1}^N a_i u_i(x) + b$$
  where $a_i \geq 0$ are weights constant across all states and outcomes.
  **Flag 2:** In opinion pooling, linearity (the Linear Opinion Pool) is often derived from axioms like *External Bayesianity* or *Zero Preservation*. Here, linearity is derived from *Pareto Efficiency*. The mathematical form is identical (weighted sum), but the justification shifts from "preserving likelihood ratios" to "respecting preference orderings."

  **The Debate (Diamond 1967)**
  *   **The Objection:** Diamond observes that the Linear Pool (Utilitarianism) is indifferent between a prospect where everyone receives a guaranteed expected utility, and a prospect where outcomes are randomly distributed such that ex-ante expectations are identical but ex-post realized utilities are unequal.
  *   **Pooling Translation:** A pooling rule that aggregates expert "valuations" linearly ignores the *variance of valuations across experts* in any given realized state. It treats a consensus forecast (all experts assign $u(x)=0.5$) identically to a polarized forecast (half assign $1$, half assign $0$), provided the mean is $0.5$.
  *   **Flag 3:** In statistics, ignoring the variance among experts is often criticized as losing information about *uncertainty* or *model disagreement*. In welfare, Diamond criticizes it as losing information about *equity*. The mathematical residue (loss of second-order information) is the same; the normative valuation of that loss differs.

  **The Heterogeneous Prior Results (Gilboa, Samet, Schmeidler; Mongin)**
  *   **The Result:** If the Common Prior assumption is dropped (experts hold different $P_i$), and we maintain Unanimity (Pareto) and Rationality, no non-dictatorial linear aggregation rule exists.
  *   **Pooling Translation:** If experts disagree on the underlying probability model (heterogeneous priors), you cannot aggregate their utility forecasts linearly while respecting unanimous preference orderings over acts, unless you effectively listen to only one expert (Dictatorship).
  *   **Flag 4:** In statistical pooling, heterogeneous priors are the norm (experts use different models). We aggregate their probability forecasts (e.g., via Linear Pool) without requiring the pool to respect their individual preference orderings over acts. The "impossibility" in welfare arises because Pareto is a *normative constraint* on the aggregator, whereas in statistics, aggregation is an *epistemic heuristic*.

  ***

  ### Part II: The Residue Report

  You have asked where the analogy breaks down and what that breakage reveals. The central fracture is the **ontological status of the aggregate**.

  #### 1. Estimation vs. Constitution
  In your setting, there is a "fact of the matter." The event $E$ occurs or it does not. The probability $P^*(E)$ exists (frequentist or propensity) or the forecast is judged against realization (Bayesian calibration). A pooling rule is a *estimator*. It can be biased, consistent, or calibrated.

  In the welfare setting, the social utility $W$ is *constituted* by the aggregation. There is no "true social utility" waiting to be discovered against which to measure calibration.
  *   **Consequence:** In statistics, weights $a_i$ in a linear pool are ideally derived from past performance (calibration scores, Brier scores). In welfare, weights $a_i$ are ethical parameters. They cannot be "estimated" from data because there is no data on "social truth."
  *   **Where it matters:** This renders Harsanyi's theorem **convention-shaped** rather than **theorem-shaped**. The theorem proves that *if* you want to satisfy Pareto and vNM rationality, *then* you must use a linear pool. But since there is no external truth to validate the Pareto principle itself, the theorem merely clarifies the internal consistency of a specific ethical convention (Utilitarianism). It does not vindicate it against an external standard, as a calibration result would.

  #### 2. Diamond's Objection: Equity vs. Dispersion
  Does Diamond's objection have a statistical counterpart?
  *   **Yes:** It corresponds to the critique that Linear Pools **suppress bimodality** and **underestimate variance**. If Expert 1 is certain of $E$ and Expert 2 is certain of $\neg E$, the Linear Pool assigns $P(E)=0.5$. This is poorly calibrated if the truth is deterministic but unknown; it represents "ignorance" as "randomness."
  *   **The Divergence:** In statistics, we worry about this because $0.5$ is a *bad forecast* of the truth. We can fix it by using a Logarithmic Pool (which preserves zeros and can be more peaked) or by modeling the experts' dependence. In welfare, Diamond worries about this because $0.5$ is a *moral obscuring*. The "fix" is not a different mathematical pool (e.g., Geometric/Logarithmic welfare), but a rejection of the ex-ante Pareto principle itself.
  *   **Verdict:** Diamond's objection coheres statistically as a worry about **loss of information regarding expert disagreement**. However, in welfare, this information loss is re-categorized as **injustice**. The statistical analogue treats the variance among experts as *noise to be modeled*; the welfare debate treats the variance among persons as *inequality to be mitigated*.

  #### 3. The Veil of Ignorance (VOI) as a Prior
  Can the VOI be expressed as an assessor with a prior over expert identities?
  *   **The Mapping:** Yes. If the assessor assigns a prior probability $\pi_i$ to the proposition "I am Individual $i$," and maximizes expected utility, the resulting social welfare function is $W = \sum \pi_i u_i$. This recovers the Linear Pool with weights equal to the identity prior.
  *   **Does it capture the intent?** Only partially.
      *   **In Statistics:** A prior over expert identities is a **Mixture Model**. It implies that *one* expert is the "true" generator of reality, and I don't know which.
      *   **In Welfare:** The VOI implies I *could be* any of them, not that one of them is "true." I am all of them, sequentially or potentially.
      *   **The Residue:** The statistical mixture model is epistemic (I lack knowledge about the source). The VOI is ontological/metaphysical (I lack knowledge about my *self*). Consequently, in statistics, we might update the weights $\pi_i$ as we see who predicts better. In the VOI framework, the weights are fixed by the symmetry of the "ignorance" (usually uniform) and are not subject to updating based on "performance," because persons are not "models" to be discarded.

  #### 4. Heterogeneous Priors: Disagreement on Models
  You asked if the heterogeneous-prior impossibility results (Gilboa et al.) are analogous to experts disagreeing on the model.
  *   **The Statistical Analogue:** In statistics, when experts disagree on the model (different priors over parameters), we still aggregate their forecasts. We do not face an impossibility theorem.
  *   **The Difference:** The impossibility in welfare arises because the **Pareto Principle is binding**. If Expert 1 (with Prior $P_1$) prefers Act $A$ to $B$, and Expert 2 (with Prior $P_2$) prefers $A$ to $B$, Society *must* prefer $A$ to $B$. When priors differ, agreement on acts can be spurious (canceling errors), and forcing the aggregator to respect this leads to contradiction or dictatorship.
  *   **In Statistics:** We do not bind the aggregator to respect unanimity of *preferences* (which don't exist). We only ask the aggregator to respect unanimity of *probabilities* (if all say $P(E)=1$, pool says $1$). If experts agree on a forecast but for different model reasons, the statistician accepts the forecast. The welfare theorist suspects the agreement is ethically suspect if based on divergent beliefs.
  *   **Verdict:** The statistical analogue is **Robust Bayesianism**. However, the "impossibility" is avoided in statistics because we abandon the requirement that the aggregate must satisfy the *rationality axioms of the constituents* in the same way. We allow the pool to be a "super-Bayesian" entity that the individuals themselves might not recognize as rational. In welfare, the Society is supposed to be a moral agent composed of the individuals; it cannot transcend their rationality constraints as easily.

  ***

  ### Part III: Where the Residue Points

  The translation reveals that your vocabulary lacks a concept the welfare debate desperately needs, but which your field deliberately excludes: **Normative Weight.**

  In opinion pooling, weights are **epistemic**. They track truth-tracking ability. If Expert $i$ is consistently miscalibrated, their weight $a_i$ should decay to zero. The aggregation is a learning process.

  In welfare aggregation, weights are **ethical**. They track moral standing. If Individual $i$ is consistently "miscalibrated" (e.g., has adaptive preferences, or is systematically unhappy), their weight $a_i$ does not necessarily decay. In fact, some theories argue their weight should increase (prioritarianism).

  **Conclusion:**
  The debate looks different once one notices that the central quantity is constituted rather than estimated.
  1.  **Harsanyi's Theorem is not a Calibration Result.** It is a **Consistency Theorem**. It tells you that Utilitarianism is the only way to be internally consistent with Pareto and vNM rationality under common risk. It does not tell you that Utilitarianism is "true" or "calibrated."
  2.  **The "Impossibility" Results are Political, not Statistical.** When heterogeneous priors break the theorem, it is not because the math fails, but because the *political constraint* (Pareto) becomes incompatible with the *mathematical constraint* (Bayesianism) when beliefs diverge. In statistics, we simply relax the political constraint (we don't have to respect the experts' preferences, only their data).
  3.  **Convention vs. Theorem.** The welfare debate is **convention-shaped**. It is a negotiation over which axioms (Pareto, Anonymity, Equity) we are willing to sacrifice when they conflict. Harsanyi showed which convention (Utilitarianism) buys you which consistency. Diamond showed the price of that convention (indifference to ex-post inequality).

  **Final Recommendation for your Thesis:**
  You can use the welfare literature to enrich the *interpretation* of pooling weights, but you must not import the *normative constraints*.
  *   When you see a Linear Pool, recognize it as a Utilitarian aggregation of beliefs.
  *   When you see a Logarithmic Pool, recognize it as closer to a Geometric mean of utilities (Nash Bargaining), which respects some equity properties Diamond might prefer (it is more sensitive to zeros/minima).
  *   **Crucially:** Acknowledge that in your field, the "Social Planner" is an epistemic agent seeking truth, whereas in welfare, the "Social Planner" is a political agent seeking legitimacy. The "Residue" is the gap between **Accuracy** (your goal) and **Legitimacy** (their goal). Harsanyi's theorem proves that Legitimacy (via Pareto) forces Accuracy (Linear Pool) into a specific shape, but it cannot prove that the shape is Accurate.

  The welfare debate warns you that **axiomatic characterization does not imply ontological validity.** Just because a pooling rule is the *only* one satisfying Unanimity and External Bayesianity does not mean it is the *best* estimator of the truth, only that it is the most consistent with those specific desiderata. Diamond's ghost reminds you to check what those desiderata hide (variance, disagreement, equity) before declaring a rule optimal.
