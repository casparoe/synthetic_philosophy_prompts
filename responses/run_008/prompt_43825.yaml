answer: |-
  Your instincts are spot-on. You should definitely not study off your friend's notes without major corrections. He has conflated **Supervaluationism** with **Many-Valued Logic** (like Fuzzy Logic), and he has fundamentally misunderstood **Williamson's Epistemicism** regarding the *nature* of the ignorance.

  Here is the claim-by-claim breakdown of where he went wrong, what the positions actually are, and how that changes the "choice" you face on the midterm.

  ### 1. Supervaluationism and Classical Logic
  **Friend's Claim:** *Supervaluationists give up classical logic, especially Excluded Middle. They can't assert "this is either a heap or it isn't."*
  **Verdict:** **False.** This is the biggest error in his summary.

  *   **What Supervaluationists Actually Say:**
      *   Vagueness is "semantic indecision." The word "heap" doesn't have one precise extension; it has a range of *admissible precisifications* (ways of making the term precise).
      *   A sentence is **Supertrue** if it is true on *all* admissible precisifications.
      *   A sentence is **Superfalse** if it is false on *all* admissible precisifications.
      *   A borderline case is true on some precisifications and false on others. Therefore, it has no "supertruth" value (a truth-value gap).
  *   **The Logic Correction:**
      *   Even though the atomic sentence "This is a heap" lacks a truth value in a borderline case, the complex sentence **"This is a heap OR this is not a heap"** is true on *every* admissible precisification. (On precisification A, the first half is true. On precisification B, the second half is true.)
      *   Therefore, the Law of Excluded Middle ($P \lor \neg P$) is **Supertrue**.
      *   **Key Distinction:** Supervaluationism is specifically designed to **save classical logic** (tautologies remain valid) while rejecting **Bivalence** (the principle that every atomic sentence is strictly True or False).
      *   **Who gives up Excluded Middle?** Your friend is describing *Many-Valued Logic* or *Fuzzy Logic* (where a statement can be 0.5 true, making $P \lor \neg P$ less than fully true). Supervaluationists hate that view.

  ### 2. Epistemicism and the Nature of Ignorance
  **Friend's Claim:** *The cutoff is real, but we just don't know it. This is ordinary ignorance, removable with better measurement/memory.*
  **Verdict:** **False.** This misrepresents the core difficulty of Epistemicism.

  *   **What Epistemicists (Williamson) Actually Say:**
      *   Vagueness is a form of **ignorance**. There is a sharp boundary (e.g., 5,432 grains is a heap, 5,431 is not).
      *   Classical logic and Bivalence both hold. "This is a heap" is either True or False, even in borderline cases.
  *   **The Ignorance Correction:**
      *   Williamson explicitly argues this ignorance is **in principle unremovable**. It is *not* like not knowing the number of hairs because you haven't counted them.
      *   **Why we can't know:** Meaning is determined by usage. Our usage of "heap" is sensitive to marginal differences, but our ability to *detect* those differences is not. There is a "margin for error" required for knowledge. Because the boundary shifts slightly depending on context and usage patterns that are too complex for us to track, we cannot form a reliable belief about exactly where the line is.
      *   If you had "better measurement," you still couldn't find the line, because the line is fixed by linguistic practice, not by physical facts about the grains. No amount of counting hairs reveals the semantic boundary.

  ### 3. Re-evaluating the Closing Framing
  **Friend's Framing:** *The choice is between giving up logic and accepting an invisible fact.*

  **Does it survive correction?** **No, not really.** It creates a false dichotomy.

  *   **Corrected Supervaluationism:** You **keep classical logic** (including Excluded Middle), but you give up **Bivalence** (for atomic sentences) and you have to accept that truth is not always composed of the truth of the parts (compositionality issues). You also accept that "It is either a heap or it isn't" is true, even though neither disjunct is true. (This strikes many as weird).
  *   **Corrected Epistemicism:** You **keep classical logic AND Bivalence**, but you accept **unknowable sharp boundaries**. You don't just accept an "invisible fact"; you accept that there are truths that are *necessarily unknowable* due to the nature of language and knowledge.

  **The Real Trade-off:**
  *   **Supervaluationism:** Saves Logic, Loses Bivalence/Intuition about Truth. (It feels weird that $P \lor \neg P$ is true when neither $P$ nor $\neg P$ is).
  *   **Epistemicism:** Saves Logic and Bivalence, Loses Knowability. (It feels weird that there is a specific number of grains that magically turns a non-heap into a heap, and we can never know it).

  ### Summary for Your Midterm Notes

  | Feature | **Supervaluationism** | **Epistemicism (Williamson)** | **Friend's Summary (Incorrect)** |
  | :--- | :--- | :--- | :--- |
  | **Is there a sharp boundary?** | No (Semantic Indecision) | **Yes** | Yes (Correct) |
  | **Are borderline cases T or F?** | **Neither** (Truth-value gap) | **One or the other** | Neither (Correct for Superval) |
  | **Law of Excluded Middle ($P \lor \neg P$)?** | **Holds (Supertrue)** | **Holds** | **Fails (Wrong for Superval)** |
  | **Principle of Bivalence?** | **Fails** (for borderline cases) | **Holds** | Implies Fails for Superval |
  | **Nature of Ignorance?** | N/A (Nothing to know) | **In Principle Unknowable** | **Ordinary/Removable (Wrong)** |
  | **Main Cost?** | Truth behaves weirdly (gaps). | Boundaries are unknowable. | Confuses views. |

  **Bottom Line:**
  Your professor was right. Supervaluationism is famous precisely because it retains classical logic despite truth-value gaps. Your friend described a Many-Valued Logic view but labeled it Supervaluationism. Furthermore, Williamson's Epistemicism is controversial *because* the ignorance is inescapable, not because we are bad at counting.

  If you write on your midterm that Supervaluationists reject Excluded Middle, or that Williamson thinks we could find the boundary with better tools, you will likely lose points. Stick to the corrected version above. Good luck!
