prompt: |-
  So I'm taking a philosophy of language course and we just started the vagueness unit — sorites paradox, heaps, bald guys, the usual — and I thought I was following it fine until our study group met last night to prep for the midterm. One guy in the group, who has actually read the Williamson book cover to cover and loves bringing it up, gave us this overview of the two main camps, and I want to double check it before I study off my notes and it calcifies. Here's roughly what he said:

  'The supervaluationist says there's no fact of the matter about where the heap boundary is. For a borderline case, the sentence "this is a heap" is simply neither true nor false, and that means the supervaluationist has to give up classical logic, especially excluded middle — she can't even assert "this is either a heap or it isn't." The epistemicist says the opposite: there really is a sharp cutoff, a last heap in the sequence, and the reason we can't say where it is is just ordinary ignorance, like not knowing how many hairs are on someone's head. Williamson's point is that this ignorance is in principle removable — with better measurement and better memory we could locate the boundary. So really the choice is between giving up logic and accepting an invisible fact.'

  Most of it sounded right when he said it, but a couple things have been nagging me. I could've sworn our professor kept emphasizing that supervaluationism was specifically designed to *preserve* classical logic, which seems to flatly contradict the excluded middle part. And something about the "ordinary ignorance" bit feels off too, like the whole point of the epistemicist position is supposed to be weirder than that, not just "we haven't counted carefully enough." So: go through his summary claim by claim and tell me what a supervaluationist would actually sign off on, what an epistemicist would sign off on, and where he's subtly misrepresenting one side or the other (he definitely conflated a couple things I can't put my finger on). Then tell me whether his closing framing — the choice between giving up logic and accepting an invisible fact — even survives the corrections, or whether both options look different once you fix the misrepresentations. Don't worry about citations or who said what exactly, I just need a straight answer before the midterm.
