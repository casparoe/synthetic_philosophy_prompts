      *   *Claim 6 (Williamson):* "Williamson's point is that this ignorance is in principle removable — with better measurement and better memory we could locate the boundary." -> **FALSE.** Williamson explicitly argues the boundary is *in principle* unknowable. It's not a measurement problem.
