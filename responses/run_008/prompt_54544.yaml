answer: |-
  # The Population Ethics Intuition Quiz

  **Instructions:** Below are 8 pairs of possible futures. For each pair, choose the verdict that best matches your gut feeling. Do not worry about consistency yet; just answer honestly. There are no "correct" answers, only different commitments.

  **Q1. The Quality/Quantity Trade-off**
  *   **Future A:** 1 million people live lives of ecstatic bliss. They have deep relationships, profound achievements, and zero suffering.
  *   **Future B:** 100 million people live lives that are pleasant and content. They are happy, but nothing extraordinary. There is no suffering.
  *   **Your Verdict:**
      *   [ ] A is better than B.
      *   [ ] B is better than A.
      *   [ ] They are equally good.
      *   [ ] They are incomparable (no fact of the matter).

  **Q2. The Non-Identity Choice**
  *   **Future A:** We adopt a policy that depletes resources. A specific group of 1 billion people will exist in the future. Their lives are good, but significantly harder than they could have been.
  *   **Future B:** We adopt a different policy. Because society changes, a *completely different* group of 1 billion people will be conceived. Their lives are much easier and happier than the people in Future A.
  *   *(Note: The people in A would never exist if we chose B, and vice versa. No specific person is harmed by choosing A; they simply have a harder life than the alternative people in B would have had.)*
  *   **Your Verdict:**
      *   [ ] A is worse than B (we should choose B).
      *   [ ] A is not worse than B (neither policy harms anyone).
      *   [ ] They are incomparable.

  **Q3. The Repugnant Conclusion**
  *   **Future A:** 10 billion people live lives of the highest possible quality.
  *   **Future B:** 10 trillion people live lives that are just barely worth living. They are never in pain, but their lives contain only the faintest trace of happiness (like eating a plain potato and listening to muzak).
  *   **Your Verdict:**
      *   [ ] A is better than B.
      *   [ ] B is better than A.
      *   [ ] They are equally good.
      *   [ ] They are incomparable.

  **Q4. Mere Addition**
  *   **Future A:** 1 billion people live very happy lives.
  *   **Future B:** The same 1 billion people live the exact same happy lives, *plus* another 1 billion different people are added who also live very happy lives. The two groups do not interact or affect each other.
  *   **Your Verdict:**
      *   [ ] B is better than A.
      *   [ ] A and B are equally good.
      *   [ ] They are incomparable (adding people isn't "better," just "not worse").

  **Q5. The Sadistic Conclusion**
  *   **Future A:** We add a population of 1 million people who will experience severe, unremitting suffering.
  *   **Future B:** We add a population of 100 trillion people whose lives are barely worth living (positive, but extremely low quality). Their addition drags down the average quality of life in the universe significantly.
  *   **Your Verdict:**
      *   [ ] A is worse than B (Adding the suffering people is the greater evil).
      *   [ ] B is worse than A (Adding the massive low-quality population is the greater evil).
      *   [ ] They are equally bad.

  **Q6. The Critical Level**
  *   **Future A:** A world containing 1 billion very happy people.
  *   **Future B:** A world containing 1 billion very happy people, *plus* 1 million extra people whose lives are "worth living" (no suffering), but are mediocre and bland (not "good" in a robust sense).
  *   **Your Verdict:**
      *   [ ] B is better than A (Any life worth living adds value).
      *   [ ] A is better than B (Mediocre lives dilute the value of the world).
      *   [ ] They are equally good.

  **Q7. The Intransitivity Check (Vagueness)**
  *   **Future A:** 1 billion people at 100% happiness capacity.
  *   **Future B:** 2 billion people at 99% happiness capacity.
  *   **Future C:** 4 billion people at 98% happiness capacity.
  *   *(Imagine this chain continues until Z: Trillions at 1% capacity.)*
  *   **Your Verdict on A vs. Z:**
      *   [ ] A is definitely better than Z.
      *   [ ] Z is definitely better than A.
      *   [ ] There is no fact of the matter (the comparison breaks down).

  **Q8. The Priority of Suffering**
  *   **Future A:** We prevent 1 person from experiencing 50 years of torture.
  *   **Future B:** We prevent 1 billion people from experiencing a mild headache for one day.
  *   *(Assume the total "sum" of pain minutes is roughly equal in both cases.)*
  *   **Your Verdict:**
      *   [ ] A is more important (Intensity matters more than numbers).
      *   [ ] B is more important (Numbers matter more than intensity).
      *   [ ] They are equally important.

  ***

  # The Scoring Key & Logical Map

  **Warning:** This key does not tell you which view is *true*. It maps where your intuitions sit in the logical space of population ethics. Some combinations of answers are logically stable; others force you into paradox.

  ## Part 1: Mapping Your Profile
  Tally your answers into these four dimensions. Be honest if you fell into the "Incomparable" or "Equally Good" options; those are substantive philosophical positions, not cop-outs.

  **Dimension 1: The Aggregation Axis (Q1, Q7)**
  *   **Totalist Lean:** You chose B in Q1 and/or Z in Q7. You believe numbers can trump quality.
  *   **Averagist/Quality Lean:** You chose A in Q1 and/or A in Q7. You believe quality places a ceiling on value.
  *   **Vagueness/Incomparability:** You chose "Incomparable" in Q1 or Q7. You believe there is a point where quantity and quality cease to be comparable.

  **Dimension 2: The Identity Axis (Q2, Q4)**
  *   **Impersonal:** You chose "B is better" in Q2 and "B is better" in Q4. You think outcomes are judged by the total state of affairs, regardless of *who* exists.
  *   **Person-Affecting:** You chose "Not worse/Incomparable" in Q2 and/or "Incomparable/Equal" in Q4. You think an outcome can only be worse if it is worse *for someone*.

  **Dimension 3: The Repugnant/Sadistic Axis (Q3, Q5)**
  *   **Repugnant Acceptor:** You chose "B is better" in Q3.
  *   **Repugnant Rejector:** You chose "A is better" in Q3.
  *   **Sadistic Acceptor:** You chose "B is worse" in Q5 (Preferring the suffering group over the massive barely-happy group).
  *   **Sadistic Rejector:** You chose "A is worse" in Q5.

  **Dimension 4: The Threshold Axis (Q6, Q8)**
  *   **Zero-Level:** You chose "B is better" in Q6. Any life above suffering adds value.
  *   **Critical-Level:** You chose "A is better" or "Equal" in Q6. Lives must meet a standard of "goodness" to add value.
  *   **Prioritarian:** You chose "A is more important" in Q8. Relieving extreme suffering trumps aggregating mild benefits.

  ---

  ## Part 2: The Logical Space (Where the Views Live)

  Philosophers do not just pick views at random; they are pushed into them by the logic of their answers. Below are the **Stable Regions** in the answer space. Locate your profile in one of these clusters.

  ### Region 1: The Total Utilitarian Cluster
  *   **Typical Answers:** Totalist (Dim 1), Impersonal (Dim 2), Repugnant Acceptor (Dim 3), Zero-Level (Dim 4).
  *   **The Logic:** If you believe value is the sum of welfare (Q1), then adding happy people always adds value (Q4). If you keep adding them, you must eventually prefer the massive population of barely-happy people (Q3) because the sum is larger.
  *   **Stability:** High. This is the most logically consistent position.
  *   **Cost:** You must bite the Repugnant Conclusion (Q3).

  ### Region 2: The Critical Level Cluster
  *   **Typical Answers:** Totalist-ish (Dim 1), Impersonal (Dim 2), Repugnant Rejector (Dim 3), Critical-Level (Dim 4).
  *   **The Logic:** You agree value is aggregated, but you set a "critical level" of welfare (e.g., 5/10). Lives below this level (even if worth living) do not add positive value. This allows you to reject the Repugnant Conclusion (Q3) without abandoning aggregation.
  *   **Stability:** Medium.
  *   **Cost:** You risk the "Sadistic Conclusion." If you must choose between adding miserable people (negative value) or adding mediocre people (zero value), your math might force you to prefer the miserable people to avoid the zero-value dilution. (Check Q5).

  ### Region 3: The Person-Affecting Cluster
  *   **Typical Answers:** Quality Lean (Dim 1), Person-Affecting (Dim 2), Repugnant Rejector (Dim 3).
  *   **The Logic:** You believe morality is about helping *particular* people. If no one exists in the alternative, you can't harm them (Q2). Adding people is neither good nor bad, just different (Q4).
  *   **Stability:** Low to Medium.
  *   **Cost:** You face the "Non-Identity Problem." You cannot say it is wrong to choose a policy that creates a miserable future generation, provided those specific people still have lives worth living (Q2). Also, you struggle to explain why extinction is bad if no one is deprived of life.

  ### Region 4: The Incomparability / Vagueness Cluster
  *   **Typical Answers:** Incomparable (Dim 1), Repugnant Rejector (Dim 3), Person-Affecting or Impersonal (Mixed).
  *   **The Logic:** You deny that "better than" is always a complete relation. At some point, quantity stops trumping quality (Q7).
  *   **Stability:** Medium.
  *   **Cost:** You must accept intransitivity or vagueness. If A is better than B, and B is better than C, you might have to admit C is not worse than A. This violates standard decision theory.

  ---

  ## Part 3: The Unoccupied & Incoherent Zones

  This is the most important part of the key. Some combinations of verdicts are logically impossible or psychologically unsustainable. If your answers fall here, you are in a "Philosophical Danger Zone."

  ### Zone A: The Parfitian Trap (Logically Incoherent)
  *   **The Combo:** Accept Mere Addition (Q4: B is better) + Reject Repugnant Conclusion (Q3: A is better) + Demand Transitivity (Q7: A is definitely better than Z).
  *   **Why it's empty:** Derek Parfit proved this is impossible. If A+ is better than A, and B is better than A+ (by quality/quantity tradeoffs), and you chain this to Z, you cannot say A is better than Z without contradicting yourself.
  *   **Diagnosis:** If you are here, you are holding three intuitions that cannot coexist. You must sacrifice one. Most people sacrifice Transitivity (move to Region 4) or Accept the Repugnant Conclusion (move to Region 1).

  ### Zone B: The Sadistic Paradox (Psychologically Unstable)
  *   **The Combo:** Reject Repugnant Conclusion (Q3: A is better) + Reject Critical Level (Q6: B is better) + Reject Sadistic Conclusion (Q5: A is worse).
  *   **Why it's empty:** If you think any life worth living adds value (Q6), but you refuse the Repugnant Conclusion (Q3), mathematical models suggest you are forced to prefer adding suffering people over adding barely-happy people in certain edge cases (The Sadistic Conclusion).
  *   **Diagnosis:** If you are here, you likely haven't followed the math through to Q5. This position is "unexplored" because it collapses under pressure. You are trying to have a Zero-Level view without the Repugnant Conclusion.

  ### Zone C: The Asymmetry Gap (Common but Unsystematized)
  *   **The Combo:** Creating a miserable person is Bad (Q5: A is worse) + Creating a happy person is Neutral (Q4: A and B are Equal).
  *   **Why it's empty:** This is the most common human intuition (The Asymmetry), but no major ethical theory successfully codifies it without ad-hoc rules. It implies we have duties not to create suffering people, but no duties to create happy people.
  *   **Diagnosis:** If you are here, you are in the "Unexplored" zone. You hold a view that is psychologically natural but logically lonely. You are in good company (most non-philosophers are here), but you lack a robust theoretical framework.

  ---

  ## Part 4: Blind Spots (What This Quiz Can't Tell You)

  Be aware of the following limitations in this diagnostic:

  1.  **Negative Utilitarianism vs. Critical Level:** This quiz cannot cleanly separate people who think suffering is infinitely bad (Negative Utilitarianism) from those who think only "good" lives add value (Critical Level). Both reject the Repugnant Conclusion and prioritize Q8 Option A.
  2.  **Leximin vs. Prioritarianism:** Q8 tests priority, but it doesn't distinguish between "Maximize the well-being of the worst off" (Leximin) and "Give weight to the worse off" (Prioritarianism). Both look the same in an 8-question quiz.
  3.  **The "Intuition Pump" Effect:** Your answers to Q3 (Repugnant) and Q5 (Sadistic) are highly sensitive to how vivid the descriptions are. If you took this quiz again with different numbers, you might shift regions. This suggests your view might be "Vagueness" (Region 4) even if you answered like a "Totalist" (Region 1).
  4.  **Ideal vs. Non-Ideal:** This quiz asks about ideal futures. It does not test how your view handles risk, uncertainty, or climate policy (where the Non-Identity problem is most pressing). A Person-Affecting view might work for Q2 but fail for Q1.

  **Final Advice:** If you landed in **Zone A (The Parfitian Trap)**, do not try to defend your current combination. Use your reading group to decide which intuition to drop. If you landed in **Region 1 (Totalist)**, your job is to defend the Repugnant Conclusion. If you landed in **Region 3 (Person-Affecting)**, your job is to explain why extinction isn't a moral catastrophe.
