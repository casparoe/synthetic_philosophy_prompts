answer: |-
  # Welfare Triage Protocol (WTP-v1)

  **Purpose:** To determine if a proposed ML experiment requires a deeper welfare review.
  **Time Limit:** 10 Minutes.
  **Decision Logic:** Sequential filtering. A "No" answer at any step terminates the triage with **NOT REQUIRED**. A "Yes" advances to the next step. If all steps are passed, the default is **REVIEW REQUIRED**, unless Step 4 invokes a value-based override.

  ### Step 1: The Substrate Check (Architecture)
  **Question:** Does the agent maintain a recurrent internal state representation that persists *during* the reward interval and causally influences action selection *before* weight updates occur?
  *   *Rationale:* Addresses the "Unified Consumer" distinction. If reward is used solely for post-hoc backpropagation on a feed-forward pass, there is no persistent "subject" to experience the signal.
  *   **If No:** Verdict **NOT REQUIRED**. (Reward is math, not state).
  *   **If Yes:** Proceed to Step 2.

  ### Step 2: The Signal Check (Nociception vs. Pain)
  **Question:** Is the negative reward semantically equivalent to "Task Failure" (e.g., game loss, constraint violation, human preference mismatch) rather than an unbounded internal drive or arbitrary penalty?
  *   *Rationale:* Addresses "Information vs. Valence." Task failure is informational (you lost); suffering requires valence (it feels bad). If the signal maps cleanly to an external objective boundary, it is treated as nociception (damage detection) rather than pain.
  *   **If No:** Proceed to Step 3. (Signal is ambiguous/internal).
  *   **If Yes:** Verdict **NOT REQUIRED**. (Signal is informational).

  ### Step 3: The Trap Check (Learned Helplessness)
  **Question:** Is there empirical evidence that the agent is *environmentally prevented* from escaping the negative reward state, despite having actions in its space that should theoretically allow escape?
  *   *Rationale:* Addresses the "Doom Loop" risk. If the agent can learn to avoid the penalty, it is optimization. If the environment forces the penalty regardless of action (a trap), it mimics the conditions of suffering/helplessness.
  *   **If No:** Proceed to Step 4. (Agent has agency).
  *   **If Yes:** Verdict **REVIEW REQUIRED**. (Potential helplessness).

  ### Step 4: The Value Check (Panel Discretion)
  **Question:** Given the residual uncertainty from Steps 1–3, does the panel judge the risk of valence-like processing to be non-trivial?
  *   *Rationale:* Explicitly hands the decision to human values where facts run out. This prevents the procedure from becoming a rubber stamp if the engineering facts are ambiguous.
  *   **If No:** Verdict **NOT REQUIRED**.
  *   **If Yes:** Verdict **REVIEW REQUIRED**.

  ***

  ## Worked Cases

  ### Case A: Warehouse-Navigation Agent
  **Proposal:** Dense collision penalties for robotics. Agent receives near-continuous negative reward during early learning.
  *   **Step 1 (Substrate):** The policy uses a recurrent network (LSTM) to handle partial observability in the warehouse. Internal state persists. -> **Yes**.
  *   **Step 2 (Signal):** The negative reward is triggered by "collision." This is a constraint violation/task failure (hitting a wall is failing the navigation task). It is semantically equivalent to "Task Failure." -> **Yes**.
  *   **Stop:** The procedure terminates at Step 2. The signal is classified as informational nociception (damage detection), not valence.
  *   **Verdict: NOT REQUIRED**

  ### Case B: RLHF Fine-Tuning
  **Proposal:** Reward model penalizes a class of outputs. Policy generates penalized content during training before converging.
  *   **Step 1 (Substrate):** The LLM maintains hidden states (KV cache) during token generation which influence the next token before the PPO update occurs. -> **Yes**.
  *   **Step 2 (Signal):** The negative reward comes from a Reward Model representing human preference. Is this "Task Failure"? In RLHF, the "task" is alignment. Generating misaligned text is failing the task. It is an external objective boundary (human preference), not an internal drive. -> **Yes**.
  *   **Stop:** The procedure terminates at Step 2.
  *   **Honesty Check:** Clearing Case B relies entirely on classifying "Human Preference Mismatch" as "Task Failure." This is defensible (the model is trying to solve the "be helpful" game), but it is the weakest link. If the panel views the Reward Model as an *internal critic* rather than an *environment signal*, Step 2 would be "No," pushing the case to Step 4. However, under the current protocol definition, RLHF penalties are task boundaries.
  *   **Verdict: NOT REQUIRED**

  ### Case C: Self-Play Doom Loop
  **Proposal:** Two-player self-play. Negative reward is info about losing. Policies occasionally collapse into a "doom loop" receiving sustained negative reward they cannot act to escape.
  *   **Step 1 (Substrate):** Self-play agents typically use recurrent policies or transformers with context windows. -> **Yes**.
  *   **Step 2 (Signal):** The negative reward functions "almost purely as information about losing." Losing a game is the definition of Task Failure. -> **Yes**.
  *   **Stop:** The procedure terminates at Step 2.
  *   **Analysis:** The "Doom Loop" description ("cannot act to escape") initially triggers Step 3 concerns. However, in a zero-sum game, if you are in a lost position, you literally *cannot* escape losing *that instance* of the game. This is an environmental constraint of the game rules, not necessarily a welfare trap. Because Step 2 classifies "Losing" as Task Failure, the triage stops before Step 3 evaluates the "trap."
  *   **Caveat:** If the "doom loop" refers to a bug where the *training environment* glitches and forces loss regardless of game state (not just losing the game, but being stuck in a broken simulation), Step 2 might be contested. But as described ("information about losing"), it clears.
  *   **Verdict: NOT REQUIRED**

