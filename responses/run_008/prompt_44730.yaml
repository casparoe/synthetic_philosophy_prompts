  # Handout Centerpiece: The Vagueness Decision Tree

  **Instructions:** Start at the top. Answer each question based on your intuition about the **Heap Case** (10,000 grains $\rightarrow$ 1 grain) and the **Tall Case** (borderline height). Do not worry about the names of the positions; they will appear only at the end.

  ---

  ### **START: The Sorites Argument**
  *Premise 1: 10,000 grains is a heap.*
  *Premise 2: If $n$ grains is a heap, $n-1$ grains is a heap.*
  *Conclusion: 1 grain is a heap.*

  To avoid the absurd conclusion that 1 grain is a heap, **where does the argument go wrong?**

  *   **A.** The **Premises** are false. (There is a point where removing one grain *does* make the difference, even if it seems impossible).
  *   **B.** The **Logic/Truth** is faulty. (Classical rules like "True or False" or Modus Ponens don't work for vague words).
  *   **C.** The **Conclusion** is acceptable. (We should accept the argument is sound, which means "heap" doesn't apply to anything, or 1 grain really is a heap).

  ---

  ### **BRANCH A: The Premises are False (There is a Cutoff)**
  *You believe that somewhere in the series, there is a pair of adjacent piles where one is a heap and the other is not.*

  **Question A1:** Is the location of this cutoff **fixed** by the meaning of the word "heap," even if humans can never calculate exactly where it is?
  *   **Yes:** It is a fixed fact about the language/world, just unknowable.
      *   $\rightarrow$ **POSITION: EPISTEMICISM**
  *   **No:** The location depends on who is speaking, the context, or the conversation.
      *   $\rightarrow$ **POSITION: CONTEXTUALISM**

  *(Note: There is a logically possible view where you believe there is a cutoff, but that borderline cases lack truth values. This combination is largely **unoccupied** in contemporary literature. It is unattractive because if there is a sharp cutoff, classical bivalence usually follows; if there are truth-value gaps, a sharp cutoff is hard to motivate without modifying logic.)*

  ---

  ### **BRANCH B: The Logic/Truth is Faulty (No Sharp Cutoff)**
  *You believe the Tolerance Premise is basically correct (one grain doesn't matter), so classical logic must be adjusted to stop the slide to the conclusion.*

  **Question B1:** Consider a clear borderline case (e.g., 400 grains). Is the sentence "This is a heap" **partially true**, or does it **lack a truth value entirely**?
  *   **Partially True:** It is true to some degree (e.g., 0.5 true).
      *   $\rightarrow$ **POSITION: DEGREE THEORY (FUZZY LOGIC)**
  *   **Lacks Truth Value:** It is neither True nor False (a Gap).
      *   $\rightarrow$ **Go to Question B2**

  **Question B2:** For that same borderline case, is the complex sentence **"Either this is a heap or it is not"** True?
  *   **Yes:** The "Either/Or" statement is true, even if the parts are indeterminate.
      *   $\rightarrow$ **POSITION: SUPERVALUATIONISM**
  *   **No:** If the parts are indeterminate, the "Either/Or" statement is also indeterminate/false.
      *   $\rightarrow$ **POSITION: INTUITIONISTIC LOGIC REVISION**

  *(Note: The combination of "Lacks Truth Value" + "Fixed Cutoff" is the **unoccupied** space mentioned in Branch A. It is incoherent because truth-value gaps usually imply no sharp boundary between True and Not-True.)*

  ---

  ### **BRANCH C: The Conclusion is Acceptable**
  *You believe the logic is valid and the premises are true.*

  **Question C1:** Do you believe 1 grain is literally a heap, or that "heap" applies to nothing at all?
  *   **1 Grain is a Heap:** (Rare, but logically consistent if you accept the argument).
      *   $\rightarrow$ **POSITION: PARADOX ACCEPTANCE**
  *   **"Heap" Applies to Nothing:** (There are no heaps, only particles arranged heap-wise).
      *   $\rightarrow$ **POSITION: NIHILISM / ELIMINATIVISM**

  ---

  ### **Meta-Commentary for the TA (Confidence & Fragility)**

  **1. Confidence in Leaf Placement**
  *   **Epistemicism:** High confidence. The "Fixed but Unknowable" answer is the definitional commitment of the view (Williamson). A student who says "It's fixed but we *could* know it with better tools" might be a **Reductionist**, which would move them out of vagueness theories entirely.
  *   **Contextualism:** Moderate confidence. Some Contextualists (e.g., Raffman) might answer "No" to A1 but also claim logic is modified. If a student says "The cutoff shifts" *and* "Borderline cases have no truth value," they might belong in **Branch B**, making Contextualism and Supervaluationism hard to distinguish here.
  *   **Supervaluationism:** Moderate confidence. Placing them in Branch B (Logic/Truth) is pedagogically standard because of the "Truth Value Gap," but logically they deny the Tolerance Premise (Branch A). A student who grasps the technical definition might feel misrouted here. They would be moved to Branch A if they emphasize that the conditional is *false* on every precisification.
  *   **Degree Theory:** High confidence. The "Partial Truth" intuition is the unique marker.
  *   **Intuitionistic Logic:** High confidence. The rejection of Excluded Middle (Question B2) is the specific logical commitment.
  *   **Nihilism:** High confidence. Distinguished by accepting the validity and soundness of the original argument.

  **2. The Most Fragile Node**
  **The Root Node (Branch A vs. Branch B)** is the most likely to misroute students.
  *   **Why:** Students often feel that "One grain never makes a difference" (which suggests Branch B: Logic/Truth failure) but also feel "There must be *some* point where it stops being a heap" (which suggests Branch A: Premise failure).
  *   **Risk:** A **Supervaluationist** intuition often straddles this line. They believe there is a cutoff in every *precisification* (Branch A feature) but no cutoff in the *actual vague language* (Branch B feature). A student with Supervaluationist intuitions might answer "Yes" to Branch A's "Is there a point?" but then also answer "Neither True nor False" to Branch B's questions.
  *   **Restructuring Trigger:** If more than 30% of students select Branch A but then insist that borderline cases have *no* truth value, I would restructure the tree to split first on **Bivalence** (True/False vs. Gaps/Degrees) rather than on the **Sorites Premise**. However, the current structure better matches the lecture's focus on "Escape Routes from the Argument."

  **3. Indistinguishable Positions**
  *   **Epistemicism vs. Certain Forms of Contextualism:** If a Contextualist believes the context is *always* fixed by external facts beyond our ken, their answers to A1 may mimic Epistemicism. The tree cannot separate them without a question about "speaker intention," which is too theory-laden for this handout.
  *   **Supervaluationism vs. Epistemicism on the Cutoff:** Both views technically entail that there is a sharp boundary (one in reality, one across precisifications). If a student answers "Yes" to "Is there a cutoff?" they could be routed to Epistemicism even if they intend to be a Supervaluationist. This is resolved only by the Branch B follow-up on Truth Values. If a student answers Branch A but believes in Truth Value Gaps, the tree forces a choice that the philosophy blurs. I have flagged this in the "Unoccupied" note, but it remains a friction point.
