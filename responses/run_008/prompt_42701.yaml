answer: |-
  Here is a teaching plan designed to navigate the specific epistemic hazards of your audience. It is structured to force the "Designer Thesis" to emerge from the engineers' own failure modes, rather than being presented as a philosophical axiom.

  ### I. The Sequence and Dependencies

  The order is critical because each stage creates a specific cognitive tension that the next stage resolves. If you reverse the order, the engineers will optimize the wrong variable.

  **1. The Black Box (5 minutes)**
  *   **Action:** Display the chosen Bongard problem. No title, no context, no mention of Bongard. Ask: *"Write a function `bool classify(Image input)` that returns true for the left six and false for the right six."*
  *   **Why here:** You must induce the feeling of *feature scarcity* before you talk about priors. If you explain the context first, they will treat it as a puzzle to be solved rather than a data distribution to be analyzed. You need them to feel the anxiety of not knowing *what to look at*.
  *   **Dependency:** This creates the shared empirical ground. Without this, the "hypothesis space" argument is abstract theory.

  **2. The Solution & The Search Space (10 minutes)**
  *   **Action:** Reveal the rule. Then, immediately ask: *"How many other rules are consistent with these 12 images?"*
  *   **Why here:** This breaks the "classification" mindset. In standard ML, once you have 100% train accuracy, you're done. Here, 100% accuracy is trivial (memorization) but useless. This forces the realization that the *constraint* isn't the data; the constraint is the *space of allowable rules*.
  *   **Dependency:** You cannot argue for the "Designer Thesis" until they admit that the data underdetermines the rule.

  **3. The Scale Objection (15 minutes)**
  *   **Action:** Pre-emptively address the "In-Context Learning" (ICL) argument. Show a prompt where a large multimodal model solves this. Then ask: *"Where did the prior live? In the 12 examples, or in the weights trained on 4 billion images?"*
  *   **Why here:** This is the highest risk point for disengagement. If you don't address the "scale fixes priors" belief now, they will tune out the rest as "old AI winter whining." You must concede that scale works, but reframe *what* it is doing (compressing human priors, not discovering objective truth).
  *   **Dependency:** Relies on Step 2. If they think the data determines the rule, they will think the model just "found" the rule. If they know the rule is underdetermined, they must admit the model brought the rule with it.

  **4. The Designer Pivot (15 minutes)**
  *   **Action:** Shift the object of study. *"We are analyzing the wrong thing. The solver is trivial; the generator is the signal."* Discuss why *this* rule was chosen and not the 10,000 other consistent rules.
  *   **Why here:** This is your thesis. It only lands if they have already accepted that the solver requires a biased hypothesis space. Now you argue that the *source* of that bias is the curation of the problem set itself.
  *   **Dependency:** Relies on Step 3. If they still think priors are just "pre-training data," they won't see the curation as a theoretical object.

  **5. The Verification (5 minutes)**
  *   **Action:** The "Generator Test" (detailed below).
  *   **Why here:** To convert intellectual assent into behavioral evidence.

  ---

  ### II. The Single Problem Selection

  Do not use Bongard Problem #1–10 (the GEB openers). They are too geometric (triangles vs. circles) and invite the "just use a CNN" response. You need a problem where the features are **relational** or **topological**, requiring segmentation before classification.

  **Recommendation: Bongard Problem #61 (Physical Support/Stability)**
  *(Note: Verify the specific rendering in your source, as numbering varies. Look for the one where shapes are "standing" vs. "falling" or "supported" vs. "unsupported".)*

  **Properties required:**
  1.  **Semantic, not Statistical:** The rule cannot be solved by pixel correlation. It requires identifying objects, then evaluating a relationship (support) that implies a latent physics engine.
  2.  **Ambiguous Features:** A simple edge detector fails. You need to know what counts as an "object."
  3.  **Human-Native:** The rule is instant for a human because we have a body and live in gravity. It is hard for a model unless it has been explicitly trained on physical intuition.

  **Why this carries the session:**
  It directly attacks the "priors are just compression" view. A transformer trained on text/web data does not inherently know "support" unless that concept is latent in the data distribution. The fact that humans agree on the rule instantly proves the prior is in the *brain*, not just the *data*. This sets up your thesis: the problem exists *because* we share that prior. The dataset is a probe of the human mind, not a test of the solver.

  ---

  ### III. Misconceptions and Interception Points

  Here is where the objections will surface and where you must head them off in the flow.

  **1. "This is just small-sample classification/clustering."**
  *   **When it surfaces:** Step 1 (The Black Box).
  *   **How to head it off:** Do not let them discuss *accuracy*. When they suggest features (e.g., "count the corners"), immediately generate a counter-example that fits the feature but violates the rule.
  *   **The Move:** *"You've found a feature that correlates. I'm asking for the causal mechanism. If I add noise to the corners, does your classifier break? If yes, you haven't found the rule."* Force them to admit that without the *concept*, the features are fragile.

  **2. "In-Context Learning / Scale has made priors obsolete."**
  *   **When it surfaces:** Step 3 (The Scale Objection).
  *   **How to head it off:** Concede the capability, deny the mechanism.
  *   **The Move:** *"Agreed, GPT-4V solves this. But did it learn 'support' from these 12 images? No. It learned it from the internet. So the sample efficiency didn't come from the algorithm; it came from the fact that the 12 images align with the 4 billion images it already saw. The prior wasn't removed; it was outsourced to the pre-training budget."*

  **3. "Solomonoff Induction closes this debate."**
  *   **When it surfaces:** Step 2 (The Search Space), likely from an old-timer.
  *   **How to head it off:** Acknowledge the theory, reject the engineering.
  *   **The Move:** *"Solomonoff tells us the optimal prior is Kolmogorov complexity. It doesn't tell us why humans find 'support' simpler than 'number of red pixels minus three.' Solomonoff is a limit, not a map. We are studying the map, not the limit."*

  **4. "This is a solved benchmark from the seventies."**
  *   **When it surfaces:** Step 5 (The Verification) or Q&A.
  *   **How to head it off:** Reframe the benchmark.
  *   **The Move:** *"If you think it's a solver benchmark, you're right, it's solved. But if it's a probe for inductive bias, it's unsolved. We don't have a theory of why this specific set of rules is the 'natural' set. We're treating the benchmark as the test, when the benchmark is actually the hypothesis."*

  ---

  ### IV. Defending the Thesis: The Designer as the Object

  Your thesis is that **the dataset is evidence about inductive structure.** To defend this without lecturing:

  1.  **In Step 2**, when discussing the infinite consistent rules, explicitly list one that is mathematically valid but humanly absurd (e.g., "True if the sum of pixel coordinates is prime").
  2.  **In Step 4**, ask: *"Why did Bongard not include the 'prime pixel' rule?"*
  3.  **The Payoff:** The answer is not "because it's hard." The answer is "because it's not a *joint* in our conceptual space."
  4.  **The Conclusion:** The value of the Bongard problem isn't that we can solve it. It's that we *agree* on the solution. That agreement is the data point. The "Designer" (Bongard/Hofstadter) successfully hacked our shared inductive bias. Therefore, studying the problems tells us more about the bias than studying the solver.

  ---

  ### V. The End-of-Session Check

  Do not ask "Does this make sense?" They will lie to be polite. Do not ask "What did you learn?" It's too vague.

  **Run the "Generator Test":**
  Ask them to take 2 minutes and sketch **one new panel** (a 13th image) that they would add to the "Left" group.
  *   **Failure Mode:** They draw a random variation of the existing shapes. (This means they see it as a visual pattern matching task).
  *   **Success Mode:** They draw a shape that preserves the *relational rule* (e.g., a new object that is clearly "supported") but looks visually distinct from the other six. (This means they have internalized the *generator* of the rule).

  **Collect the sketches.** If the room produces high variance in visual style but low variance in the relational rule, your thesis landed. If they produce low variance in visual style (clones of the examples), they still see it as a classification task.

  ---

  ### VI. Explicit Exclusions (And How to Refuse)

  You must explicitly state what you are *not* doing to prevent the Q&A from derailing into topics that undermine the thesis.

  1.  **Kolmogorov Complexity Formalism:**
      *   *Refusal:* *"We are not doing math today. We are doing reverse psychology on the dataset. Formal complexity measures don't capture why 'support' is simpler than 'noise' to a human."*
  2.  **Analogy-Making Architectures (e.g., Copycat, Metacat):**
      *   *Refusal:* *"I'm not reviewing solver architectures. Whether you use symbolic AI or transformers is irrelevant to the fact that the problem set was curated to match human bias."*
