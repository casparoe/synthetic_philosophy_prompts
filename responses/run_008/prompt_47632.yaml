      *   *Current Consensus (such as it is):* The DW programme is the dominant defense but remains controversial. The "branch counting" objection is usually defeated by the indeterminacy of branching (decoherence doesn't produce discrete counts). The "circularity" objection is the strongest remaining critique (e.g., Price, Kent). The "uncertainty" objection is addressed by self-locating uncertainty (Vaidman, Wallace), though some find it unsatisfying.

