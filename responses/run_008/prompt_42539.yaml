answer: |-
  Your mate is being too blunt, but you are holding together two incompatible frameworks of decision theory without realizing it. You are trying to be a *Timeless Decision Theorist* (TDT) in private (Newcomb's, Copies) and a *Causal Decision Theorist* (CDT) in public (Strangers, Voting). This works until you ask *why* the frameworks switch.

  Here is the adjudication of your beliefs, ordered by the severity of the tension.

  ### 1. The Critical Tension: Newcomb's (3) vs. Voting Instrumentalism (4)
  **Severity: Fatal**

  This is the deepest crack in your foundation. It is much worse than the conflict between (1) and (2).
  *   **The Conflict:** One-boxing in Newcomb's Problem (3) requires you to accept that your choice can be *correlated* with an outcome you do not causally influence (the Predictor's prior placement of money). You accept that your decision is *evidence* of the state of the world.
  *   **The Contradiction:** Voting (4) is structurally identical to Newcomb's Problem if you apply the same logic. In a large election, your vote does not *causally* determine the outcome (just as your choice doesn't causally determine the Predictor's past action). However, your decision to vote is highly correlated with the decisions of other people "like you" (your reference class). If you are the type of person who reasons like you do, there are thousands of others doing the same calculation.
  *   **The Verdict:** If (3) is true (you should act on evidential/acausal correlations), then (4) is false. Under TDT/EDT, voting *is* instrumentally rational because your vote is a "sample" of the votes of your reference class. By choosing to vote, you effectively "predict" that others like you will vote, tipping the election.
  *   **Does (3) rescue (5) or undermine (4)?** It **undermines (4)** completely. It does not necessarily rescue (5) as you phrased it, because your justification in (5) ("people I know... mostly all went") relies on *empirical* social correlation, whereas (3) relies on *logical* correlation. But (3) definitely makes (4) untenable.

  **Cheapest Fix:** Abandon (4). Admit that voting is instrumentally rational *if* you accept the logic of (3).
  **The Cost:** You must swallow a "magical" pill. You have to accept that your vote matters not because it changes the count by one, but because it is logically linked to the votes of strangers who reason like you. This feels less concrete than standard causal reasoning.

  ### 2. The Normative Tension: Voting Theory (4) vs. Voting Action (5)
  **Severity: High**

  *   **The Conflict:** (4) is a normative claim ("voting is irrational"). (5) is a retrospective normative judgment ("it wasn't stupid"). You cannot consistently hold that an action is irrational and simultaneously that doing it was not stupid, unless you are using two different definitions of "rational."
  *   **The Verdict:** This is a standard case of cognitive dissonance. You likely mean (4) to be "causally irrational" (my vote won't swing it) and (5) to be "expressively rational" (it felt good/I did my duty). But as written, they contradict.
  *   **Does (3) help here?** Yes. If you accept the logic of (3), then (5) becomes instrumentally rational (see above), which resolves the tension with (4) by destroying (4).

  **Cheapest Fix:** Amend (4) to read: "Voting is *causally* irrational."
  **The Cost:** You concede that your original statement was imprecise. You also admit that "causal rationality" might not be the only kind of rationality that matters, which opens the door to the TDT arguments that undermine your original (4).

  ### 3. The Mate's Objection: Copy (1) vs. Stranger (2)
  **Severity: Low (Your mate is mostly wrong here)**

  *   **The Conflict:** Your mate claims (1) and (2) flatly contradict. They do not. In modern decision theory (specifically TDT), the distinction between a "copy" and a "stranger" is the *entire game*.
      *   **Copy:** Your source code is identical. Your output is logically guaranteed to be the same. Cooperating is choosing the better of the two available realities (CC vs DD).
      *   **Stranger:** Their source code is unknown and causally disconnected. Your decision cannot correlate with theirs. Defecting is the dominant strategy.
  *   **The Verdict:** You are right; the line between copy and stranger *does* do real work. However, the line is fuzzier than you think. How similar must a stranger be before they count as a "partial copy"? If the stranger is "rational in the ordinary sense," are they running a similar enough algorithm that your cooperation signals theirs?
  *   **The Tension:** The tension isn't between (1) and (2); it's between your confidence in drawing the line and the reality of human similarity. If you one-box in Newcomb's, you believe a Predictor can simulate you. If a Predictor can simulate you, then "ordinary rational strangers" might be similar enough to you that your actions provide *some* evidence about theirs.

  **Cheapest Fix:** Adopt **Timeless Decision Theory (TDT)** explicitly. This formalizes the intuition that you cooperate with copies (logical identity) but defect against strangers (logical independence).
  **The Cost:** You must accept that "causation" is not the only thing that matters for rational choice. You also take on the burden of defining your "reference class." (e.g., Is a stranger who read the same blog post as you a copy enough to warrant cooperation? TDT doesn't give an easy answer).

  ### Summary of the Rabbit Hole

  You are currently a **hybrid agent**.
  *   In **high-symmetry** scenarios (Copies, Newcomb's), you instinctively use **Evidential/Timeless** reasoning (outcomes depend on correlations).
  *   In **low-symmetry** scenarios (Strangers, Voting), you instinctively use **Causal** reasoning (outcomes depend on physical leverage).

  **The Hard Truth:**
  You cannot keep (3) and (4). They are the same mathematical problem dressed in different clothes.
  *   **Newcomb's:** Your choice correlates with the Predictor's past action.
  *   **Voting:** Your choice correlates with other voters' current actions.

  If you truly believe (3), you are logically committed to believing that voting is rational for the exact same reason one-boxing is rational. Your mate thinks the conflict is between (1) and (2), but the actual contradiction is between your **metaphysics of choice** (3) and your **politics of action** (4).

  **Recommendation:**
  Keep (1), (2), (3), and (5). **Delete (4).**
  Replace (4) with: *"Voting is causally ineffective, but acausally significant for agents who reason like me."*
  This aligns your voting with your Newcomb's intuition, satisfies your feeling that voting wasn't stupid, and keeps your distinction between copies and strangers intact. It costs you the comfort of thinking your vote doesn't matter, but it saves your rationality from incoherence.
