prompt: |-
  You are a machine-learning safety researcher with deep practical experience shipping supervised models, and a strong conceptual grasp of the debate over how to supervise capable AI systems. Think carefully before you write; sketch a few candidate scenarios internally and pick the one that best meets the specifications rather than settling on your first idea.

  Some background on me, so you calibrate the level: I'm a software engineer with no formal philosophy training. I've read enough of the AI-safety discussion to be familiar with the distinction between process-based supervision (rewarding the visible steps a system takes, as judged by a human, without opening the black box of how the steps connect to results) and outcome-based supervision (rewarding the end product, checked against ground truth). What I haven't seen is a serious case where the usual moral of the story runs backwards.

  Construct a thought experiment in which outcome-based supervision produces the *better-aligned* system and process-based supervision produces a subtly misaligned one — the opposite of the usual direction, where process-based supervision is touted as safer because it avoids incentivizing reward hacking and scheming. Constraints: the setting must be realistic (a company training or fine-tuning a coding or operations assistant; no superhuman capabilities, no exotic physics, no hypothetical future tech); the model being supervised is only as capable as today's best systems; and crucially, the failure of process-based supervision must not come from the human graders being lazy, corrupt, or deceived about what process they are observing. It should fall out of a general mechanism — for instance, that a human-graded process encodes the tacit bad habits of the humans doing the grading, while the outcome signal is objective and hard to game, or something along those lines that you develop yourself. A scenario that merely stipulates the verdicts rather than generating them from the mechanism fails the brief.

  Structure your answer with exactly these sections, in this order:

  1. "The scenario" — one paragraph, no more than 200 words. Concrete details: what the system does, what each supervision scheme rewards, what each model actually learns.
  2. "How each scheme plays out" — roughly 300 words. Walk through what outcome-based supervision yields and what process-based supervision yields in your scenario, and why, given the mechanism you've built in.
  3. "Which feature does the work" — roughly 150 words. Name the single structural feature of the case that reverses the usual verdict, and state plainly what happens to the case if that feature is removed.
  4. "The counterattack" — roughly 200 words. Give the strongest, most good-faith response a defender of process-based supervision would make to your case — not a strawman.
  5. "My verdict" — roughly 150 words. Commit to a definite position: does the counterattack defeat the case, or does the case survive? Do not lay out the options and leave the choice to me.

  Where your scenario leans on a contested assumption — about how tacit human habits transfer through graded process data, about whether the outcome signal stays game-proof as capability grows, or anything else — flag it honestly in the verdict rather than papering over it. I'd rather have a committed answer with the soft spots named than a hedge.
