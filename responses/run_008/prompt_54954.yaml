  # JOINT CLOSING STATEMENT ON THE ETHICS OF COLLECTIVE REMEMBRANCE
  **Collaborators:** Avishai Margalit (Representative) & David Rieff (Representative)
  **Date:** October 24, 2023
  **Subject:** Convergence, Divergence, and the Sequenced Forgetting Protocol

  ## I. AGREED FOUNDATIONAL CLAIMS

  We, the undersigned, having engaged in a decade of adversarial collaboration, submit the following propositions as the common ground upon which our remaining disagreements rest. We affirm that signing these claims does not require either party to abandon their normative conclusions, but rather clarifies the terrain on which those conclusions are built.

  1.  **The Distinction Between Memory and Record:** We distinguish sharply between a community's *Memory* (the lived, ritualized, and affective retention of the past by current members) and its *Historical Record* (the archived, scholarly, and documentary preservation of data). We agree these can come apart: a society may possess an exhaustive Record while sustaining almost no living Memory, and conversely, may hold vivid Memory supported by a thin or falsified Record.
  2.  **The Locus of Duty:** We agree that the duty to preserve the *Historical Record* is distinct from the duty to sustain *Memory*. Both sides accept that a minimal duty exists to ensure the *possibility* of future retrieval (the Record), even if we disagree on whether there is a present duty to activate that retrieval through public ritual (Memory).
  3.  **The Necessity of Curation:** We agree that remembrance is always a curated subset. No community remembers its past whole. Therefore, the ethical question is never "remember versus forget" in the abstract, but rather: who selects, by what criteria, and with what claim to permanence.
  4.  **The Scarcity of Commemorative Capacity:** We agree that commemorative capacity is a scarce resource. Every act of public remembrance competes for limited attention, ritual space, and political capital. To remember one event at full intensity necessarily attenuates the public salience of another. This opportunity cost is a structural constraint, not merely a moral preference.

  ## II. MAP OF DISAGREEMENT

  The following table isolates the precise points of divergence. For each dispute, we have formulated the contention such that both sides accept the wording as accurate to their position. We have identified the "Crux" (the sub-question that, if settled, would shift the debate) and proposed an empirical or conceptual "Test" with pre-registered predictions.

  | Dispute | Precise Formulation | The Crux | Accepted Test | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Thick Relations vs. External Conflict** | **Margalit:** Duties grounded in thick relations of care bind a community to remember wrongs done to members, even if honoring them predictably deepens conflict with outsiders.<br>**Rieff:** Duties of remembrance must be weighed against the tangible harm caused to outsiders and the risk of perpetuating cycles of revenge; peace may require suspending the duty to remember. | Does the obligation to insiders (victims/kin) lexically priority over the obligation to general peace (outsiders/future generations)? | Comparative longitudinal study of post-conflict societies: Group A adopts state-sponsored victim memorials; Group B adopts amnesty/non-commemoration policies. Measure inter-group violence over 50 years. | **Margalit:** Group A will show lower long-term violence due to established truth and validated justice.<br>**Rieff:** Group A will show higher recurrent violence due to institutionalized grievance; Group B will stabilize faster. |
  | **2. The Agency of Forgetting** | **Margalit:** Forgetting is an active moral failure; a polity *decides* to forget when it neglects its duty, making it responsible for the loss.<br>**Rieff:** Forgetting is largely organic decay; a polity cannot "decide" to forget, only cease propping up memory against natural entropy. | Is forgetting a *commission* (an act of will) or an *omission* (a natural state)? | Legal analysis of societies that ban commemoration vs. societies that simply defund it. Measure the rate of memory loss in both. | **Margalit:** Active bans will result in faster, more total memory loss than defunding, proving forgetting requires agency.<br>**Rieff:** Rates of loss will be statistically similar, proving memory fades regardless of policy intent. |
  | **3. Working Through Trauma** | **Margalit:** "Working through" is a real psychological process with a completion condition; public memory aids this closure.<br>**Rieff:** "Working through" is an open-ended slogan; public memory often medicalizes grief into a permanent identity, preventing closure. | Is there a teleological end-state to collective grief? | Psychological metrics of "closure" or "resolution" in populations subjected to decades of truth commissions vs. those who were not. | **Margalit:** Populations with truth commissions will report higher rates of resolved trauma.<br>**Rieff:** Populations with truth commissions will report higher rates of entrenched victim-identity. |
  | **4. Lapse vs. Dismantling** | **Margalit:** There is a moral difference between letting memory lapse (neglect) and deliberately dismantling it (active erasure); the latter is a second violence.<br>**Rieff:** The outcome (absence of memory) is what matters for peace; the intent (neglect vs. erasure) is morally irrelevant to the victim's safety. | Does the *intent* behind the absence of memory carry moral weight independent of the *outcome*? | Public reaction surveys regarding monuments that crumble due to neglect vs. monuments toppled by state decree. | **Margalit:** Toppled monuments will generate renewed resentment; crumbled ones will be accepted as time's passage.<br>**Rieff:** Both will result in equal peace dividends; resentment depends on current politics, not the monument's end. |

  ## III. JOINT VERDICT ON THE "SEQUENCED FORGETTING" PROPOSAL

  We have evaluated the stress-test proposal devised during this collaboration: **Sequenced Forgetting.**
  *Protocol:* A post-atrocity truth commission takes full testimony, preserves it under seal, publishes nothing for seventy-five years, and sets a legally fixed disclosure date. Custodians are forbidden from curating or excerpting the sealed material in the interim.

  **1. Identification of Pivot Disagreement**
  We agree that this proposal turns primarily on **Dispute #1 (Thick Relations vs. External Conflict)** and secondarily on **Dispute #2 (The Agency of Forgetting)**. The core tension is whether the duty to the *living victim* (who requires acknowledgment now) can be morally deferred for the sake of the *future record* (which requires protection from political curation).

  **2. Conditions for Conceding Error**
  To render this collaboration productive, we specify the conditions under which each side would acknowledge that the Sequenced Forgetting protocol validates the other's worldview.

  *   **The Margalit Condition for Concession:**
      The Margalit camp will concede that Sequenced Forgetting is ethically permissible if, at the 50-year mark of the seal:
      *   (a) The rate of inter-group violence in the sealed society is significantly lower than in comparable societies with immediate public disclosure; AND
      *   (b) A representative sample of living victims (or their immediate kin) report that the *act of sealing* was communicated to them as a form of protection rather than silencing, and they accept this framing without feelings of betrayal.
      *   *Failure Condition:* If victims universally report the seal as a "gag order" that compounds their trauma, the Margalit view holds that the protocol is a moral failure regardless of peace metrics.

  *   **The Rieff Condition for Concession:**
      The Rieff camp will concede that Sequenced Forgetting is ethically superior to immediate public remembrance if, upon the 75-year disclosure:
      *   (a) The release of the uncurated record does *not* trigger a resurgence of violence or grievance (proving that "pressure cooker" memory does not explode); AND
      *   (b) The historical accuracy of the record is demonstrably higher than in societies where public memory was curated annually for 75 years (proving that public ritual corrupts the record).
      *   *Failure Condition:* If the release triggers violent backlash or if the sealed records are found to have degraded/lost context due to lack of public engagement, the Rieff view holds that continuous (albeit curated) public engagement is necessary to keep the record alive.

  ## IV. NOTE ON VERBAL DISPUTES

  In reviewing the transcript of our decade-long argument, we identify one portion that was purely verbal.

  **The Dispute:** The definition of **"Forgetting."**

  **Explanation:**
  *   **Margalit Usage:** When speaking of "forgetting," the Margalit camp referred to *moral abandonment*. To forget was to cease holding the victim in ethical regard. It was a normative category.
  *   **Rieff Usage:** When speaking of "forgetting," the Rieff camp referred to *cognitive and social entropy*. To forget was the natural fading of emotional intensity and the cessation of public ritual. It was a descriptive/sociological category.

  **Resolution:**
  Much of our conflict arose because the Margalit camp accused the Rieff camp of advocating "moral abandonment," while the Rieff camp accused the Margalit camp of fighting "biological inevitability." We now agree: A society can allow *social forgetting* (Rieff's goal: peace via fading ritual) without enacting *moral abandonment* (Margalit's fear: betrayal of the victim), provided the *Historical Record* is preserved (Claim #2). The duty is to the Record; the Memory is the variable.

  ***

  **Signed,**

  *Representative for the Ethics of Memory*
  *Representative for Against Remembrance*
