answer: |-
  Consider a late-career canvas attributed to Master M, who, due to severe arthritis, provided only a charcoal underdrawing and verbal instructions while anonymous workshop assistants executed every layer of paint, M adding only his signature upon completion. Decades later, Forger F, a competent but unknown painter, creates a duplicate to sell as M; F mixes the pigments, stretches the linen, and paints every brushstroke alone, matching M's style perfectly without assistance. The two canvases are visually indistinguishable to an attentive viewer standing in front of them.

  The aesthetic view rates the paintings equal because value supervenes on perceptible properties; since the surfaces are indistinguishable, the aesthetic experience and thus the value are identical. The performance view, valuing the work as a record of artistic achievement, rates the forgery higher because the original records a fragmented agency—the credited artist's physical contribution is negligible and the actual makers anonymous—rendering the causal history "thin," whereas the forgery records a unified agency where one individual's mind and hand produced the entire object, creating a "dense" causal history of performance. The single feature doing the work is the fragmentation of agency in the original versus the unity of agency in the forgery; if you remove this feature (making the original wholly hand-painted by M), the case collapses back into the standard dispute where the performance view prefers the original for combining creative genesis with execution. A defender of the performance view would most plausibly attack the case by arguing that artistic achievement resides primarily in creative origination (the design) rather than manual execution, claiming M's conceptual ownership outweighs F's manual unity. The specification can be met without cheating, but it relies on interpreting "performance" as the integrity of the physical act rather than the status of the creative originator.
