answer: |-
  **The Ancient Claim Protocol (ACP)**

  Use this checklist sequentially. If a claim hits a **Hard Stop**, it cannot be printed as fact. If it hits **Editorial Judgment**, you may print with qualified language.

  **1. Provenance & Contemporaneity**
  *Question:* Is the evidence contemporaneous (within 50 years) or administrative (inscription/coin/ledger)?
  *Sufficient Answer:* Yes.
  *Flag:* If No, mark as *Derived*.

  **2. Multiplicity**
  *Question:* Is the specific claim attested in ≥2 independent sources?
  *Sufficient Answer:* Yes.
  *Flag:* If No, mark as *Singular*.

  **3. Genre & Intent**
  *Question:* Is the source genre factual (history, ledger) or performative (satire, speech, epic, panegyric)?
  *Sufficient Answer:* Factual.
  *Flag:* If Performative, mark as *Literary*.

  **4. Material Accord**
  *Question:* Does archaeology/environmental data contradict the text?
  *Sufficient Answer:* No contradiction.
  *Flag:* If Contradiction, mark as *Contested*.

  **5. Inference Level**
  *Question:* Is the claim a direct statement or a modern reconstruction of motive/economics/inner life?
  *Sufficient Answer:* Direct statement.
  *Flag:* If Reconstruction, mark as *Interpretive*.

  **Decision Matrix**
  *   **Hard Stops (Do Not Print as Fact):**
      1.  *Derived + Singular + Specific Fact:* (e.g., specific casualty numbers from a late source).
      2.  *Literary + Literal Claim:* (e.g., treating satire as reportage).
      3.  *Contested:* (Archaeology definitively contradicts text).
  *   **Editorial Judgment (Qualify Language):**
      1.  *Singular + Plausible:* Use "according to," "tradition holds."
      2.  *Interpretive:* Use "suggests," "likely," "reconstructed."
      3.  *Derived + Corroborated:* Use "later sources claim."

  **Worked Cases**

  **1. The Battle (250k Combatants)**
  *   *Analysis:* Source is *Derived* (centuries later) and *Singular* (one author). Logistics/archaeology render the number impossible (*Contested*).
  *   *Verdict:* **Hard Stop.**
  *   *Rationale:* Fails Derived + Singular + Specific Fact. Ancient armies rarely exceeded 50k; logistics collapse at 250k. The figure is rhetorical exaggeration, not census data.
  *   *Action:* Reject as fact. Can print as "ancient authors claimed," but not as historical reality.

  **2. The Satirical Ritual**
  *   *Analysis:* Source is *Literary* (Satire). Claim is literal practice.
  *   *Verdict:* **Hard Stop.**
  *   *Rationale:* Fails Literary + Literal Claim. Satire distorts reality for humor or critique. A single satirical mention cannot prove ritual efficacy or existence without epigraphic corroboration.
  *   *Action:* Reject as fact. Can print as "satirized as," but not "practiced at."

  **3. The Shipwreck Merchant**
  *   *Analysis:* Evidence is *Material* (amphorae) but claim is *Interpretive* (merchant motive/ownership).
  *   *Verdict:* **Editorial Judgment.**
  *   *Rationale:* Passes Provenance (wreck exists) but fails Inference Level. Amphorae show cargo, not ownership or intent. "Speculative voyage" is a modern economic model applied to ancient data.
  *   *Action:* Do not print "shows a named merchant lost a fortune."
  *   *Weaker Formulation:* "Amphorae stamps identify a merchant named X; the cargo's value suggests a significant commercial risk."

  **Limitations & Misfires**
  This protocol favors skepticism. It will misfire on truths preserved only in late oral traditions (e.g., some biblical history) or where archaeology is silent but texts are accurate. It cannot detect sophisticated forgeries without linguistic analysis. It treats "fact" as "high-confidence consensus," which may exclude emerging correct theories. Use it to prevent error, not to discover truth. When in doubt, qualify.

  **Editorial Rationale Summary**
  For your editor-in-chief: Claims failing Hard Stops lack the evidentiary density required for factual assertion in popular history. Claims passing via Editorial Judgment reflect current scholarly consensus but acknowledge the inferential gap inherent in ancient studies. This aligns with standard historiographical practice (e.g., Thucydidean skepticism regarding numbers) while accommodating material evidence.
