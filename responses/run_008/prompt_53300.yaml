      *   Q4: Material Accord? (Text vs. Dirt).
      *   Q5: Inference? (Observation vs. Motive).
      *   Stops: Later + Single + Specific Number. Satire as Fact. Dirt contradicts Text.
      *   Judgment: Single but plausible (qualify). Inference (qualify).
      *   Cases:
          1.  Battle: Later + Single + Implausible Number. Stop.
          2.  Ritual: Satire. Stop.
          3.  Shipwreck: Inference. Judgment. Change "shows" to "suggests."

  7.  **Editing for Word Count:**
      *   I need to be tight. The introduction should be minimal.
