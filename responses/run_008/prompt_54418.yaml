      *   Key distinction: **Implicature vs. Consequence.** Rule A targets *conversational implicature* (invited inference). Rule B targets *consequential inference* (uninvited deduction).
      *   Wait, is Rule A strictly Gricean? Grice's reference letter example is a *violation* of the Maxim of Quantity/Relation to generate an implicature. The moderator treats this as deception. This implies the community norm overrides the Gricean maxim. The community says: "Do not exploit maxims to mislead."
      *   So the theory is: **Speaker Meaning includes Standard Implicatures, and Speakers are Responsible for Standard Implicatures.**
