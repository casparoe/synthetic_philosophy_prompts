prompt: |-
  quick one for you — i'm running the last session of a philosophy of science reading group and it's on ian hacking's "making up people" idea, the bit where classifying people can bring a kind of person into existence, and then the people classified respond to the label (or against it), which changes what the classification picks out, and round it goes — the looping effect. for a closing exercise i want the group to rank the following by how "loop-prone" they are, and i'd like your version to hand out: dissociative identity disorder, anorexia nervosa, ADHD, schizophrenia, narcissistic personality disorder, and premenstrual dysphoric disorder.

  give me a tier list from most to least loop-prone, with a sentence per item on why it lands where it does, and say where you'd be least confident. then a short note on whether "loop-proneness" is even a coherent thing to be ranking — i have a suspicion hacking would say the interactivity isn't a fixed property of the category but of the whole setup (who's doing the classifying, institutions, media, etc.), in which case my ordering is quietly begging the qustion. would like to hear whether that suspicion is right or whether some categories really are structurally more interactive than others.

  please write in british english throughout (behaviour, organised, that sort of thing). cheers!
