          *   $P(\text{Exit X1}) = p$.
          *   $P(\text{Exit X2}) = (1-p) \times p$.
          *   $P(\text{Pass Both}) = (1-p) \times (1-p)$.
          *   $EU(p) = 0 + 4p(1-p) + 1(1-p)^2 = 4p - 4p^2 + 1 - 2p + p^2 = -3p^2 + 2p + 1$.
          *   Maximize: $d/dp = -6p + 2 = 0 \rightarrow p = 1/3$.
          *   Max Value: $-3(1/9) + 2(1/3) + 1 = -1/3 + 2/3 + 1 = 4/3$.
          *   *Verdict:* Math is correct. This is the standard "Ex Ante" or "Planning" solution (Piccione & Rubinstein 1997).

