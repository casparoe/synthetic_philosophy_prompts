answer: |-
  **Joint Statement on Insect Welfare and Moral Uncertainty**
  **From:** Sarah (Scale) & Mark (Threshold)
  **To:** The Reading Group
  **Date:** October 26, 2023

  Look, we've been beating this horse for two years. We've annoyed you, we've annoyed each other, and we've definitely annoyed ourselves. We aren't resolving the debate today. But we realized that if we keep arguing past each other, we're wasting time. So we sat down to map the terrain. We agree on more physics and biology than we thought, and we disagree on more ethics than we admitted.

  Here is where we stand.

  ### 1. Agreed Claims
  *We both sign off on the following. If one of us is lying here, call us out.*

  1.  **The Numbers:** The estimate of ~10^18 (quintillion) individual insects alive at any given moment is the correct order of magnitude for our calculations. We are not disputing the population biology.
  2.  **The Hardware:** Insects possess nociceptors and opioid-like systems. They process noxious stimuli differently than non-noxious stimuli. However, they lack a neocortex or homologous structures typically associated with phenomenal consciousness in vertebrates.
  3.  **The Behavior:** Insects exhibit avoidance learning, trade-off decisions (e.g., tolerating heat for food), and self-grooming of injured areas. This evidence is compatible with both "complex reflex" and "valenced experience" models. It does not definitively prove either.
  4.  **The Uncertainty:** Neither of us claims to *know* if insects are sentient. We are both operating under deep empirical uncertainty regarding the phylogenetic distribution of consciousness.
  5.  **The Motives:** Neither of us is a monster. We are not arguing this way to signal virtue, to secure grant money, or to license indifference. We are both trying to minimize what we perceive as the most pressing moral risk.
  6.  **The Research Gap:** Current funding for invertebrate welfare science is negligible compared to the potential scale of the issue, regardless of which moral framework you apply.

  ### 2. Disagreements Table
  *We phrased these so neither of us feels strawmanned. If you read the left column, Sarah nods. If you read the right, Mark nods.*

  | Issue | Sarah's Position (Scale) | Mark's Position (Threshold) |
  | :--- | :--- | :--- |
  | **Moral Weight** | Moral considerability can be partial. If there is a 5% chance an entity feels pain, it commands 5% of the moral weight of a certain pain. | Moral status is binary or thresholded. Below a certain credence of sentience (e.g., >50%), the entity commands *zero* direct moral weight, regardless of numbers. |
  | **Decision Rule** | Under moral uncertainty, we must maximize Expected Value (EV). High stakes $\times$ low probability still yields high priority. | Under moral uncertainty, we should apply a "reasonable doubt" standard. Acting on low-credence hypotheses invites paralysis and misallocation of resources. |
  | **Resource Allocation** | We should shift significant research attention to insect welfare *now*, because the downside risk of being wrong is astronomical. | We should prioritize resolving the *philosophical* threshold before scaling *empirical* interventions, to avoid solving the wrong problem efficiently. |
  | **Motivated Reasoning** | The threshold view functions as a psychological shield to ignore uncomfortable numbers. | The scale view functions as a career niche, inflating low-probability risks to create work where none is urgently needed. |

  ### 3. Cruxes and Pre-Registered Tests
  *We identified two specific cruxes. For each, we found a test we both agree is relevant. We are writing down our predictions now.*

  **Crux A: Is Moral Considerability Gradable?**
  *   **The Question:** Does increasing behavioral evidence of pain-avoidance linearly increase moral obligation, or does it do nothing until a "sentience threshold" is crossed?
  *   **The Test:** **The Costly Trade-Off Test.** (Based on protocols like Birch et al.) Can we demonstrate an insect consistently sacrificing a high-value reward (e.g., sugar) to avoid a specific stimulus (e.g., heat), even when escape is possible without sacrifice?
  *   **Sarah's Prediction:** If insects clear a high bar on trade-off tests (sacrificing >50% reward to avoid stimulus), my credence in sentience moves from ~10% to ~40%. This linearly increases the EV calculation and justifies immediate intervention.
  *   **Mark's Prediction:** Even if insects clear that bar, it remains compatible with a "complex subroutine" explanation. My credence in *phenomenal* sentience will not cross my action threshold (which is ~60%). I will not support intervention based on this alone.

  **Crux B: How to Handle Moral Uncertainty**
  *   **The Question:** Should we act on low-probability, high-stakes moral hypotheses (Pascal's Mugging style), or treat them as noise until probability increases?
  *   **The Test:** **Analgesia Seeking.** Do injured insects actively seek out environments containing analgesics (e.g., ibuprofen-laced water) over non-analgesics, specifically when injured?
  *   **Sarah's Prediction:** If they seek analgesia, it confirms valenced experience of pain. Given the scale (Claim #1), this creates a moral emergency requiring immediate resource shifts, even if probability is only 20%.
  *   **Mark's Prediction:** If they seek analgesia, it is a strong data point, *but* it does not override the decision-theoretic risk of acting on <50% credence. I would support *more research*, but not *welfare intervention*, until we understand the mechanism better.

  ### 4. Verbal Disputes
  *We realized we might be fighting over definitions.*

  We suspect we are using the word **"Sentience"** differently.
  *   **Sarah** is using it to mean "any state where badness can be experienced," which allows for degrees of confidence.
  *   **Mark** is using it to mean "a robust, unified phenomenal field comparable to a mammal's," which he views as all-or-nothing.
  *   **Resolution:** We aren't resolving this today. We acknowledge that if Sarah's definition is the correct one, Mark's threshold collapses. If Mark's definition is the correct one, Sarah's EV calculation inflates. We need a third-party philosopher to adjudicate the definition before we can fully resolve the math.

  ### 5. Honesty Paragraph

  **Confidence Levels:**
  Sarah remains 85% confident that the Expected Value approach is the only ethical way to handle this uncertainty. Mark remains 80% confident that the Threshold approach is necessary to prevent moral paralysis and resource misallocation.

  **The Claim We Doubt:**
  We both signed Claim #5 ("Neither of us is motivated by career status...").
  *   **Sarah's Doubt:** I'm 60% sure Mark actually signed this, but I suspect he feels a visceral relief in concluding insects don't matter because it lets him off the hook for lifestyle changes (eating, pest control). I think he *wants* the threshold to be real.
  *   **Mark's Doubt:** I'm 60% sure Sarah actually signed this, but I suspect she is invested in the "Scale" argument because it validates her career focus on long-termist causes. I think she *needs* the numbers to dwarf everything else to justify her professional lane.

  We're putting this in writing so we can't pretend we didn't see the shadow our own incentives cast on the argument.

  — S & M
