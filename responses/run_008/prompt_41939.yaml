answer: |-
  Subject: Re: Planning the Composition Session

  Hi there, it sounds like a fantastic group and a wonderfully tricky topic, and you are absolutely right to resist the urge to jump straight to Van Inwagen's life-based answer because if they don't feel the weight of the question, his answer will just seem like arbitrary biologism. You want them to feel the itch before you offer the scratch, so the ninety minutes needs to be structured around destabilizing their common-sense intuitions rather than replacing them immediately. To start with your specific worry about the starling murmuration, it is a vivid image and will certainly grab their attention, but I would caution against using it as the primary carrier example for the metaphysical heavy lifting because it conflates unity of action with unity of being. A murmuration looks like one thing because it moves coordinately, but the Special Composition Question is about when parts constitute a whole regardless of what that whole is doing, so if you lead with the birds, you risk them thinking composition is about behavior or function rather than ontology. A good carrier example needs to be static enough that motion isn't a distraction, mundane enough that everyone agrees on the parts, but contentious enough that nobody agrees on the whole, which is why I would suggest you start with something like a disassembled watch versus an assembled watch, or even simpler, a pile of bricks versus a wall. You can bring the starlings in later as a test case to see if their criteria for composition hold up against dynamic systems, but for the core work, you need something where the spatial arrangement is the only variable, not the behavior.

  The sequence of the session should follow a funnel shape, starting wide with their pre-theoretical intuitions and narrowing down to the precise logical gap they need to fill. For the first fifteen minutes, do not mention philosophers or technical terms at all; instead, put two images on the whiteboard, one of a scattered heap of bicycle parts and one of a assembled bicycle, and ask them simply whether there is one thing or many things in each picture. They will unanimously say many in the heap and one in the bicycle, and your job here is to press them on why without accepting functional answers like because you can ride it. Once they have committed to the view that composition happens sometimes but not always, which is the common-sense view, you spend the next twenty minutes showing them that this view is actually incredibly hard to defend. This is where you introduce the two extremes, Nihilism and Universalism, not as crazy positions to be mocked but as logical safeguards. You explain that if they say composition happens only sometimes, they must provide a principle that distinguishes the cases where it happens from where it does not, and this is the exact moment to head off the glue misconception. Students will almost immediately suggest that physical contact or fastening is the key, so you need to have a counter-example ready right there, such as the solar system or a necklace where the beads are not touching but compose a whole, versus two coins glued together which remain two coins despite the contact. You need to make it clear that spatial proximity is neither necessary nor sufficient, and if you don't kill this intuition early, it will haunt the rest of the session.

  Once you have cleared away the physical contact idea, you move into the middle thirty minutes where you flesh out what the Nihilist and the Universalist are actually claiming, because this is where the second major misconception arises, which is that this is just a question about how we use the word object. You will have participants who want to say that objects are just human conventions, and while that is a coherent linguistic view, it sidesteps the metaphysical question of what exists independently of our language. To handle this, you need to distinguish between ontology and semantics on the whiteboard, perhaps by drawing a line between the map and the territory, and insist that we are asking about the territory. You explain that the Universalist says every scattered collection is an object, so there is an object composed of your left ear and the Eiffel Tower, while the Nihilist says there are no composite objects at all, only simples arranged in certain ways. The goal here is not to make them believe these positions but to make them feel the pressure these positions put on the common-sense view. If they cannot explain why the bicycle parts compose a bicycle but the ear and the tower do not compose an object, without appealing to function or language, then they are stuck between the extremes. This is the sweet spot where the Special Composition Question has landed, because they now see that saying sometimes is easy to say but hard to justify.

  In the final twenty minutes, you can bring your starling murmuration back in, not as the definition of composition but as a stress test for the principles they have just discussed. Ask them if the murmuration is an object over and above the birds, and if they say no, ask them why the dog is yes while the murmuration is no, since both involve coordinated parts. This helps transition toward Van Inwagen's answer without giving it away, because it highlights that life might be the special principle they are looking for, but you must stop short of arguing for it. You want them to leave feeling that there is a genuine gap in their understanding of when parts make a whole, not that you have filled it for them. To know whether they have actually grasped the question rather than just memorizing your setup, listen for how they frame their questions during the Q&A. If they ask questions like but why does it matter what we call it, they are stuck on the linguistic misconception. If they ask whether glue counts if it is strong enough, they missed the point about contact. But if they ask something like so is there a fact of the matter about when the bricks become a wall, or they express genuine puzzlement about why the common-sense view is unstable, then you know they have got it. You want them to leave with a sense of productive confusion, not resolved certainty.

  As for what to refuse to cover, you are absolutely right to keep the Argument from Vagueness off the table for this level, as it relies on technical premises about semantic precision that will derail the intuitive flow you are building. You should also avoid getting bogged down in the definition of simples, because whether there are atoms or gunk is a separate debate that will distract from the composition question itself. Similarly, do not let the discussion drift into mereological essentialism, which is about whether an object survives the loss of parts, because that is a question of persistence over time rather than composition at a time. Stick strictly to the synchronic question of when the xs compose a y at a single moment. If anyone brings up quantum entanglement or emergence, acknowledge it but bracket it as a scientific question distinct from the metaphysical one you are pursuing, otherwise you will lose the room to physics debates. Your job is to keep them focused on the logical space between nothing and everything, and if you can get them to see that the common-sense middle ground is the hardest place to stand, you have succeeded. Let the murmuration be the beautiful puzzle they take home, but make sure the bricks and the bicycle are the workhorses that do the heavy lifting during the class.
