answer: |-
  **The Scenario**

  Consider a *Drosophila* larva, intact and foraging, whose 300-neuron nervous system generates robust sensorimotor loops. Beside it sits a "neuro-bath": a cultured human neural organoid, chemically induced to grow a connectome isomorphic to the larva's, suspended in nutrient gel without sensory inputs or motor outputs. Next to that is a neuromorphic chip, its analog voltage dynamics tuned to mirror the organoid's causal topology under a specific mapping of state variables. All three systems exhibit activity patterns that, under interpretation, track the larva's avoidance logic. The larva interacts with the world; the organoid metabolizes but does not act; the chip computes but does not live. The question is not whether they behave alike, but whether the engineered systems—the organoid and the chip—possess the morally significant experience attributed to the larva.

  **Theoretical Verdicts and Divergence**

  The intended alignment emerges from the core commitments of each theory rather than arbitrary stipulation. The **substrate-independent functionalist** affirms both engineered systems. For the functionalist, moral status tracks the realization of the appropriate causal organization. Since the organoid and the chip are stipulated to implement the same abstract causal topology as the larva (the avoidance logic), both qualify as subjects of experience, regardless of their lack of bodies or biological origin. The **biological naturalist**, typically the skeptic regarding machines, converges with the functionalist on the organoid but diverges on the chip. On standard readings (e.g., Searle), consciousness is a biological phenomenon caused by specific neurobiological causal powers. The organoid, being composed of living neurons exhibiting endogenous biological causation, possesses the requisite "right stuff" to generate experience, even if disembodied. The chip, being silicon, lacks these biological causal powers and is therefore denied status. Thus, on the organoid, the functionalist and biological naturalist agree (Yes), while the biological naturalist rejects the chip (No).

  The **enactivist** dissents from this agreement, denying moral status to *both* engineered systems. For the enactivist, experience is not a matter of internal processing or biological substrate alone, but of autonomous sense-making constituted by sensorimotor coupling with an environment. The larva has status because it maintains its identity through active engagement with the world. The organoid, though biological, is a passive metabolic island; it reacts but does not *act* to sustain itself against environmental perturbations. The chip is similarly decoupled. Consequently, the enactivist denies experience to the organoid, placing them in opposition to both the functionalist and the biological naturalist on this specific case. The inversion is complete: the usually "exclusive" biological naturalist and the usually "inclusive" functionalist converge on the organoid, while the usually "generous" enactivist becomes the exclusive party.

  **The Work-Doing Feature and Enactivist Resistance**

  The feature doing the philosophical work is **disembodiment** (the lack of closed-loop sensorimotor coupling). If the organoid were transplanted into a robotic body controlled by its output spikes, the enactivist would likely switch to a "Yes" verdict, as the system would regain autonomy and environmental coupling. The biological naturalist would likely remain at "Yes" (it is still biological), and the functionalist at "Yes" (the causal structure is preserved or enhanced). Conversely, if the organoid were chemically paralyzed while retaining internal dynamics, the enactivist's "No" strengthens, while the biological naturalist's "Yes" might waver depending on whether they view *potential* for interaction or *actual* biological causation as decisive.

  An enactivist would attack this case by rejecting the premise that the organoid's internal dynamics constitute a "mind" waiting for a body. They would argue that without a history of structural coupling, the organoid's activity is mere physiology, not cognition. They would challenge the functionalist's abstraction, arguing that you cannot剥离 (strip) the computation from the lived context without destroying the phenomenon itself. To the biological naturalist, they would argue that biological tissue alone is insufficient; life requires a boundary-maintaining process (autopoiesis) that a static culture lacks.

  **The Triviality Worry and Implementation Determinacy**

  This case cannot sidestep the problem of whether "implements the same computation" is determinate, particularly for the chip and the organoid. Both involve continuous analog dynamics (voltage fluctuations or calcium waves) that do not come pre-carved into the discrete states required by the larva's abstract logic. The **triviality worry** (associated with Putnam and Searle) suggests that with sufficiently liberal mappings, any open physical system can be described as implementing any finite automaton.

  For the **functionalist**, this is a critical vulnerability. If the mapping between the chip's voltages and the larva's states is gerrymandered or lacks counterfactual robustness (i.e., the chip wouldn't have behaved differently if inputs changed, it just happens to match), the claim that it "implements" the computation collapses. The functionalist must argue for a constrained notion of implementation (e.g., requiring causal counterfactuals), which remains genuinely contested in philosophy of mind.

  For the **biological naturalist**, the triviality worry is less damaging regarding the organoid. Their verdict relies on the intrinsic causal powers of the biological tissue, not the abstract computation. Even if the "mapping" to the larva is arbitrary, the biological naturalist argues the organoid has experience *because it is a brain*, not because it computes like a fly. However, this invites the counter-argument that without a specific functional organization, the biology is just soup—a point contested between biological naturalists and connectionists.

  For the **enactivist**, the triviality worry is moot. Since they deny experience based on the lack of coupling, it matters little whether the internal dynamics map to a computation.

  **Settled vs. Contested**

  It is **settled** that biological naturalists require biological substrate and that enactivists require sensorimotor coupling. It is **settled** that functionalists prioritize causal topology over substrate. However, it is **genuinely contested** whether a disembodied organoid counts as "biological" enough for the naturalist (some argue consciousness requires a whole organism, not just tissue). It is also **contested** whether the functionalist's notion of "implementation" can be made non-trivial for continuous systems without begging the question. Finally, the convergence between the functionalist and biological naturalist here may be an artifact of the organoid's hybrid nature (biological yet engineered); it does not imply they agree on silicon AI, preserving the deep metaphysical rift between them while highlighting the enactivist's stricter criteria for experience.
