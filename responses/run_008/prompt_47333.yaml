answer: |-
  No, even on its most defensible reading, the proverb fails to sustain the methodologist's dismissal because it advises pragmatic conformity to local customs rather than resolving the methodological incoherence of aggregating ethically disparate data into a single scientific finding.

  *   **Descriptive Relativism**
      *   **Claim:** Moral standards and practices empirically vary from culture to culture.
      *   **Verdict:** Platitude (True).
      *   **Philosophical Status:** Settled; anthropologists and philosophers agree moral practices differ descriptively.
      *   **Conversational Intent:** Rarely the sole point; usually serves as a premise for a further claim.
      *   **Supports Local Norms?** No. That standards *do* vary (is) does not imply a single project *ought* to accommodate them all without compromising validity (ought).

  *   **Pragmatic Prudence**
      *   **Claim:** Visitors should conform to local practices to avoid offense, friction, or sanctions.
      *   **Verdict:** Substantive but defensible.
      *   **Philosophical Status:** Settled; practical rationality supports avoiding unnecessary conflict.
      *   **Conversational Intent:** Most likely; people usually invoke the phrase to suggest "don't rock the boat."
      *   **Supports Local Norms?** No. While prudence explains why teams *might* follow local norms to gain access, it does not justify publishing the resulting data as a coherent whole if the ethical foundations undermine comparability.

  *   **Metaethical Relativism**
      *   **Claim:** Moral truth is constituted by local approval; an act is right only relative to the culture in which it occurs.
      *   **Verdict:** Contested (Minority View).
      *   **Philosophical Status:** Genuinely contested; most professional philosophers reject this in favor of some form of realism or universalism.
      *   **Conversational Intent:** Sometimes implied when speakers treat local norms as morally authoritative rather than just practically expedient.
      *   **Supports Local Norms?** Yes, but at a high cost. This reading would justify the arrangement by denying there is a single ethical standard to violate, but it relies on a thesis most ethicists consider false and which undermines universal human-rights protections in research.

  *   **Epistemic Humility**
      *   **Claim:** Outsiders lack the contextual knowledge required to legitimately criticize local practices.
      *   **Verdict:** Substantive but defensible (with limits).
      *   **Philosophical Status:** Contested regarding scope; humility is valued, but not as a blanket immunity from critique.
      *   **Conversational Intent:** Common defensive move when specific ethical criticisms are raised.
      *   **Supports Local Norms?** No. Even if outsiders cannot judge, the project investigators themselves must ensure internal consistency; humility does not resolve the contradiction of merging data gathered under incompatible ethical frameworks.

  *   **Jurisdictional Compliance**
      *   **Claim:** Researchers are bound by the laws and regulations of the territory in which they operate.
      *   **Verdict:** True (Legal Fact).
      *   **Philosophical Status:** Settled; legal positivism acknowledges local law binds conduct.
      *   **Conversational Intent:** Often conflated with ethics when speakers say "norms" but mean "rules."
      *   **Supports Local Norms?** Partially. While teams must obey local law, international science often adheres to supra-national standards (e.g., Declaration of Helsinki) that exceed local minimums; compliance with local law does not guarantee ethical coherence across sites.
