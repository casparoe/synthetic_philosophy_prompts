      *   *Stimulus Meaning technicalities:* Keep it intuitive (assent/dissent to stimuli).
      *   *Inscrutability vs. Indeterminacy:* This is crucial. *Gavagai* is technically Inscrutability of Reference. Indeterminacy is about sentences/manuals. For this section, blur them slightly but acknowledge the distinction to save for next week. Don't get bogged down in the taxonomy.
