      *   *Timing:* Introduce Rabbit/Undetached Part/Rabbit Stage early to show the *rivalry*. But dwell on the *evidence* match.
      *   *Key Move:* Emphasize that Manual A (Rabbit) and Manual B (Undetached Part) predict *exactly the same assent/dissent* for *every possible physical stimulus*.

  5.  **Drafting - Section 3: Misconceptions:**
      *   *1. Epistemic (We can't know, but there is a fact).* This will come up immediately during *Gavagai*. Need to head it off by reinforcing the Behaviorist Constraint. If meaning = behavior, and behavior matches, meaning matches. No hidden fact.
      *   *2. Underdetermination (Like science).* This comes up after the conclusion. Need to distinguish: In science, we assume there's a physical truth. In translation, the "meaning" *just is* the behavioral disposition. There's no "semantic physics" underneath.
      *   *3. Nihilism (Meaning doesn't exist).* This comes at the end. Need to clarify: Communication works because we share *our* manual. It's not that communication fails, it's that "sameness of meaning" across schemes is undefined.
      *   *Missing Misconception:* "Quine is saying all translation is impossible." Need to clarify: Indeterminacy arises in *radical* translation. Domestic translation inherits the indeterminacy but hides it.
      *   *Missing Misconception:* "The native is thinking differently." Quine doesn't care about thoughts.

  6.  **Drafting - Section 4: Assessment Question:**
      *   Need a novel case. *Gavagai* is too familiar.
      *   Idea: Color terms? No, too specific.
      *   Idea: Mass nouns vs. Count nouns? (Water vs. a drop of water).
      *   Idea: A specific gesture.
      *   *Selection:* The "Blush" or a specific physical reaction to a temporal segment. Let's go with a temporal segment example (Time-slices of an object) or a "fusion" example.
