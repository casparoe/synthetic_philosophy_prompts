      *   *Wait, the prompt asks about Analytic/Synthetic.* Does that need to be explicit? For *Gavagai* (inscrutability of reference), behaviorism is the heavy lifter. Analytic/Synthetic is more for the broader Indeterminacy Thesis (manuals diverging on sentences). However, the prompt mentions it. I should integrate it as the reason *why* we can't appeal to "meanings" inside the head to settle the rabbit vs. part issue.
