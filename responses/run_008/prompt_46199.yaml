  4.  **Drafting - Section 2: The Carrying Example:**
      *   *Common Error:* Students think it's about *actual* utterances. Must emphasize *counterfactuals* (all possible stimuli).
      *   *Common Error:* Students think it's ambiguity (like "bank"). Must emphasize *manuals* (systematic translation schemes).
      *   *Strategy:* Don't just say "rabbit." Introduce the alternatives *early* but frame them as *rival manuals*.
