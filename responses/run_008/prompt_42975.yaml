      *   Part 1: The Accurate Premises (FP as Theory).
      *   Part 2: The Fatal Pivot (Existence vs. Elimination).
      *   Part 3: The Botched Analogy (Phlogiston/Oxygen).
      *   Part 4: Addressing the "Theory" Hunch.
