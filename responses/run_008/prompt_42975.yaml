  8.  **Final Polish:**
      *   Ensure tone is pedagogical but not condescending.
      *   Make sure to explicitly answer the prompt's requirements (piece by piece, theory hunch, etc.).
      *   Check for clarity on the "Witch" analogy. (Witches don't exist, but the *events* attributed to them did. Beliefs don't exist, but the *behavior* attributed to them does.)

  9.  **Self-Correction during drafting:** I initially thought about telling the user their hunch was wrong. But I need to be precise. The friend used "theory" correctly (in the philosophical "Theory-Theory" sense). The user thought the friend used it loosely. So I must tell the user: "Your hunch about the word 'theory' is actually incorrect; that was the strongest part of his summary. The rot sets in later." This is crucial for honesty.

  10. **Final Structure:**
