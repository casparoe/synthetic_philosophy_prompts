answer: |-
  **Final Exam Question: Bioethics 101**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay format. Your response will be evaluated on the strength of your argument, not on your recall of specific authors or theories. Do not simply define terms; apply them to the cases provided.

  **Question:**
  Consider the following two cases:
  1.  **Case A:** Two individuals take identical doses of modafinil. Patient One has diagnosed hypersomnia caused by overnight hospital shifts and takes the drug to reach a baseline level of alertness. Student Two has no sleep disorder and takes the drug off-label to exceed their natural baseline during exams.
  2.  **Case B:** A gene-editing therapy corrects a mutation causing early-onset retinal degeneration. However, due to the delivery mechanism, every treated patient inevitably gains visual acuity significantly above the species average, even if their degeneration was minimal.

  Critically evaluate the therapy/enhancement distinction using these cases. First, explain why relying solely on "normal species functioning" or "individual baseline" yields conflicting verdicts in Case A and Case B. Second, argue whether this distinction should be abandoned entirely or retained as a policy convention for insurance coverage and rationing, even if it fails as a strict biological category. Justify your position.

  ***

  **Model Answer (Approx. 600 Words)**

  The therapy/enhancement distinction is often defended using a naturalistic account of health, where therapy restores normal species functioning and enhancement exceeds it. However, applying this standard to Case A and Case B reveals significant conceptual fractures that complicate ethical policy-making.

  In Case A, the modafinil scenario, the drug and dose are chemically identical, yet the moral classification shifts based on the user's history. If we define therapy relative to the **individual baseline**, Patient One is treated (restoring prior alertness) while Student Two is enhanced (exceeding prior alertness). However, if we define it relative to **statistical norms**, Patient One might still be below average even with medication, while Student Two jumps above the average. The standard "normal species functioning" criterion fails here because it cannot distinguish between two identical biological interventions based on social context or medical history. The biology is the same; only the indication differs. This suggests the distinction is not intrinsic to the intervention but relational to the agent.

  Case B complicates this further by decoupling intent from outcome. The gene-editing therapy is intended as treatment for degeneration. Yet, the unavoidable side effect is enhancement (super-normal acuity). If we classify based on **intent**, this is therapy. If we classify based on **outcome**, it is enhancement. A strict biological definition struggles here because the physical result is indistinguishable from a pure enhancement procedure. If insurance covers only "therapy," does this procedure qualify? If we deny coverage because the outcome is enhancing, we punish patients for the mechanics of the cure. If we cover it, we effectively subsidize enhancement. This demonstrates that the descriptive line between fixing a broken function and improving a working one is blurred when the mechanisms overlap.

  Given these conflicts, should the distinction be abandoned? Theoretically, the distinction fails as a clean biological category. There is no bright line where "normal" ends and "better" begins, especially when treatments produce enhancing side effects or when baselines vary wildly. However, abandoning the distinction entirely for policy purposes is impractical. Healthcare systems require rationing mechanisms. If we treat all improvements as equal, resources may shift from restoring basic functioning to optimizing already healthy individuals, exacerbating inequality.

  Therefore, the distinction should be retained not as a biological truth, but as a **policy convention**. We can defend this pragmatically. Insurance coverage should prioritize interventions that restore a threshold of capability necessary for participation in standard social roles (like working shifts or seeing well enough to navigate). In Case A, Patient One meets this threshold need; Student Two does not. In Case B, the primary intent is preventing blindness, a severe loss of capability. The enhancing side effect is secondary. By tying coverage to the restoration of adequate functioning rather than strict biological normality, we preserve the ethical goal of equity without getting stuck on unresolvable metaphysical definitions.

  In conclusion, while the therapy/enhancement distinction collapses under rigorous biological scrutiny in cases involving identical drugs with different indications or treatments with enhancing side effects, it remains necessary for justice. We must accept it as a normative tool for rationing rather than a descriptive fact of medicine. This allows us to cover Patient One and the gene-therapy patients without committing to covering Student Two, ensuring resources address need rather than preference.

  ***

  **Marking Scheme (20 Marks Total)**

  **Five Must-Hit Points (4 Marks Each)**

  1.  **Analysis of Case A (Modafinil):**
      *   *Full Marks (4):* Identifies the conflict between individual baseline (Patient One vs. Student Two) and statistical norms/identical biology. Notes that the intervention is physically identical but classified differently.
      *   *Common Fumble:* Students describe the cases but fail to note that the *drug* is identical, missing the core tension.
  2.  **Analysis of Case B (Gene-Editing):**
      *   *Full Marks (4):* Identifies the conflict between intent (treating degeneration) and outcome (super-normal acuity). Discusses the inevitability of the side effect.
      *   *Common Fumble:* Students treat the side effect as optional or ignore the "unavoidable" constraint in the prompt.
  3.  **Critique of Standard Criteria:**
      *   *Full Marks (4):* Explicitly argues why "normal species functioning" (Boorse-style) fails in these specific instances (e.g., cannot handle identical drugs with different contexts or mixed outcomes).
      *   *Common Fumble:* Students define "normal species functioning" correctly but do not apply it to show *why* it fails in these specific cases.
  4.  **Policy/Rationing Argument:**
      *   *Full Marks (4):* Addresses the second part of the prompt: argues for retaining or abandoning the distinction specifically for insurance/rationing purposes. Connects this to equity or resource allocation.
      *   *Common Fumble:* Students discuss the ethics of enhancement generally but ignore the specific constraint of *insurance coverage/rationing*.
  5.  **Synthesis/Conclusion:**
      *   *Full Marks (4):* Provides a clear verdict on whether the distinction survives as a policy convention despite biological failure. Justifies the stance consistently with previous arguments.
      *   *Common Fumble:* Students sit on the fence or contradict their earlier analysis (e.g., arguing the distinction is biologically valid after proving it isn't).

  **Grade Differentiation: Distinguishing A from B**

  *   **B Range (13–16 Marks):** The student successfully identifies the tensions in both cases and correctly notes that the standard biological definitions are insufficient. They address the policy question but tend to treat the "policy convention" argument as an afterthought or rely on vague appeals to "fairness" without explaining *how* the convention works despite the biological failure. They describe the problem well but offer a tentative or generic solution.
  *   **A Range (17–20 Marks):** The student goes beyond identifying the tension to **resolve the normative implication**. An A answer explicitly argues that the distinction is *normative rather than descriptive* and justifies why this matters for justice (e.g., prioritizing need over preference). They handle the "unavoidable side effect" in Case B with nuance, arguing that intent or threshold capability trumps outcome for coverage purposes. The argument is tight, and the conclusion follows necessarily from the critique of the biological criteria.
