answer: |-
  # JOINT STATEMENT ON FUNCTIONAL EXPLANATION IN BIOLOGY AND COGNITIVE SCIENCE
  **An Adversarial Collaboration**

  **Authors:** [Colleague A: Etiological/Selected Effects] & [Colleague B: Causal-Role/Systems Analysis]
  **Date:** October 26, 2023
  **Context:** Departmental Workshop on Teleology and Mechanism

  ---

  ### I. Points of Agreement

  We, the undersigned, acknowledge six years of debate regarding the nature of functional attribution. While we maintain distinct theoretical commitments, we affirm the following claims as a shared foundation for future departmental discourse:

  1.  **The Reality of Selection:** Natural selection is the primary causal process explaining the complex adaptive design of biological organisms. We agree that evolutionary history is not optional for explaining *why* specific traits exist in a population.
  2.  **The Indispensability of Teleology:** Teleological language (e.g., "the function of the heart is to pump blood") is not merely heuristic or eliminable shorthand. It is indispensable to current research practices in both evolutionary biology and the cognitive sciences.
  3.  **Explanatory Division of Labor:** We agree that our respective accounts successfully capture distinct, legitimate explanatory projects currently active in the literature:
      *   The **Etiological Account** correctly identifies the conditions under which a trait's *presence* is explained by its past consequences (answering "Why is this trait here?").
      *   The **Causal-Role Account** correctly identifies the conditions under which a trait's *current activity* is explained by its contribution to a system's capacity (answering "How does this system work?").
  4.  **Normativity in Biology:** Biological systems exhibit behavior that can be evaluated as "correct" or "incorrect" relative to a standard. We disagree on the source of this standard, but agree that the phenomenon of biological normativity is real and requires philosophical accounting.
  5.  **Empirical Constraints:** Functional attributions are constrained by empirical data. Neither account permits arbitrary function attribution; both are answerable to physiological, genetic, and phylogenetic evidence.
  6.  **Mutual Necessity:** A complete philosophy of biological science requires resources from both accounts. Relying exclusively on one renders certain standard scientific practices unintelligible.

  ---

  ### II. Table of Remaining Disagreements

  The following table outlines our unresolved theoretical differences. Each statement is phrased to be acceptable to the proponent of that view, without caricature.

  | Domain of Dispute | Etiological (Selected Effects) Position | Causal-Role (Cumminsian) Position |
  | :--- | :--- | :--- |
  | **Definition of Function** | A trait's function is strictly the effect for which it was naturally selected. Function is a historical property. | A trait's function is its causal contribution to a containing system's capacity. Function is a dispositional property relative to an analytical framework. |
  | **The Malfunction Problem** | **Claim:** A malformed heart retains the function of pumping blood even if it cannot pump.<br>**Reasoning:** Selection history establishes a norm. The trait exists *because* ancestors pumped blood; current failure is a deviation from the historical standard. | **Claim:** A malformed heart lacks the disposition to pump; strictly speaking, it currently has no causal role in pumping.<br>**Reasoning:** "Malfunction" is a normative label applied by investigators comparing the token to a type-design. The attribution of function here is prescriptive, not descriptive of current capacity. |
  | **Epistemic Access** | **Claim:** To strictly identify a function, one must (in principle) identify the selection history.<br>**Reasoning:** Without history, we cannot distinguish adaptive function from accidental benefit (spandrels). | **Claim:** To identify a function, one need only analyze the current mechanism.<br>**Reasoning:** Requiring phylogeny makes function epistemically inaccessible for many systems (e.g., novel neural pathways) where functional analysis is nonetheless successful. |
  | **Paleontological Luck** | **Claim:** Function is not hostage to luck; if a trait was selected, it has a function regardless of whether we find the fossil record.<br>**Reasoning:** The fact of selection is objective, even if our evidence is incomplete. | **Claim:** The Etiological account makes function hostage to paleontological luck.<br>**Reasoning:** If the historical record is lost or ambiguous, the Etiological account implies we cannot know the function, whereas scientific practice proceeds regardless. |
  | **Scope of Application** | **Claim:** Not every causal contribution is a function (e.g., the heart's sound of beating).<br>**Reasoning:** Only selected effects earn the title; this filters out noise. | **Claim:** Any causal contribution can be a function relative to a chosen capacity.<br>**Reasoning:** The heart's sound *could* be a function if we are analyzing a system capacity for acoustic signaling. Context determines function. |

  ---

  ### III. The Cruxes: Test Cases and Divergent Predictions

  We identify three specific empirical domains where our theories yield different expectations. Settling these empirically would require at least one of us to revise our theoretical boundaries.

  #### Crux 1: The *De Novo* Gene Problem
  *   **The Case:** A newly arisen gene (e.g., in *Drosophila* or yeast) that provides an immediate fitness advantage upon its first appearance, prior to any multi-generational selection history.
  *   **Etiological Prediction:** Strictly speaking, the gene has **no function** until it has been maintained in the population by selection for a sufficient duration to establish a history. Early attributions of function are provisional shorthand.
  *   **Causal-Role Prediction:** The gene has a **function immediately** upon contributing to the organism's fitness capacity. Selection history is irrelevant to the current functional status.
  *   **Agreed Evidence:** Longitudinal experimental evolution studies tracking *de novo* open reading frames and their immediate physiological effects vs. their fixation rates.

  #### Crux 2: Exaptation and Trait Co-option (The Feather Case)
  *   **The Case:** Theropod feathers initially evolved for thermoregulation, later co-opted for flight.
  *   **Etiological Prediction:** There is a **fact of the matter** about the "true" function at any given time. During the transition period, function is ambiguous until selection for flight outweighs selection for insulation. The original function (insulation) is historically fixed.
  *   **Causal-Role Prediction:** There is **no single true function**. Relative to the capacity "thermoregulation," the function is insulation. Relative to "flight," the function is aerodynamic lift. Both are equally valid functional descriptions simultaneously.
  *   **Agreed Evidence:** Paleontological biomechanical modeling combined with phylogenetic bracketing to determine the timing of selective pressures vs. the timing of structural capacity.

  #### Crux 3: Neuroscience Knockout Studies
  *   **The Case:** An fMRI or lesion study attributes a "function" to a specific brain region (e.g., "the fusiform face area functions to recognize faces") without reference to the evolutionary history of that region.
  *   **Etiological Prediction:** This usage is **loose/popular**. Strictly, these are claims about causal roles. To vindicate them as *functions*, one must demonstrate that the region was selected for face recognition (which may be false; it might be a learned cultural adaptation).
  *   **Causal-Role Prediction:** This usage is **strictly proper**. The functional attribution is vindicated by the causal analysis of the cognitive system. Evolutionary history explains why the hardware is there, but not what the hardware is *doing* in the cognitive model.
  *   **Agreed Evidence:** Comparative neuroanatomy studies where a brain region performs a cognitive function in humans but exists in homologous forms in ancestors where that specific cognitive capacity was absent.

  ---

  ### IV. Consultant's Adjudication on the Meta-Question
  *(Prepared for the Department Chair by the Drafting Consultant)*

  **Subject:** Substantive vs. Verbal Nature of the Dispute

  Having reviewed the six-year record of this feud and drafted the statement above, I offer the following adjudication regarding the meta-question: *How much of this dispute is substantive, and how much is verbal?*

  **1. The Verbal Portion (Approx. 60%)**
  A significant portion of this dispute is verbal, stemming from an ambiguity in the term "function." The colleagues are theorizing two different explanatory projects that happen to share a label.
  *   **Colleague A (Etiological)** is using "function" to mean **"Evolutionary Rationale."** They are answering the question: *Why was this trait retained by natural selection?*
  *   **Colleague B (Causal-Role)** is using "function" to mean **"Current Mechanistic Contribution."** They are answering the question: *How does this trait contribute to the system's current capacity?*

  If the department stipulates a terminological distinction—reserving **"Selected-Effect Function"** for Colleague A and **"Causal-Role Function"** for Colleague B—much of the friction dissolves. For example, in the *De Novo* gene case, both can agree: "It has a Causal-Role Function immediately, but acquires a Selected-Effect Function only after fixation." This renders the prediction divergence in Section III merely a dispute over labeling, not ontology.

  **2. The Substantive Portion (Approx. 40%)**
  However, a core substantive disagreement remains regarding **Normativity**.
  *   **The Fight:** Does nature provide mind-independent norms?
  *   **Colleague A** argues that selection history creates a *natural norm*. A heart *ought* to pump even if it doesn't, because Nature "intended" it (via selection) to do so. This normativity is objective and investigator-independent.
  *   **Colleague B** argues that norms are *investigator-relative*. To say a heart "malfunctions" is to say it fails to meet a design specification chosen by the scientist for the sake of analysis. There is no "Nature's intention," only "Our analytical interest."

  **3. What Remains to Fight About**
  Even if we stipulate away the verbal ambiguity, the colleagues must still fight about **Malfunction**.
  *   If a heart is congenitally malformed and never pumps, Colleague A says it *has a function* (but fails at it). Colleague B says it *lacks the disposition* (and attributing function is merely prescriptive).
  *   This is not verbal. This is a metaphysical disagreement about whether biological norms exist independently of human analytical interests.

  **Recommendation:**
  The department should adopt the terminological distinction (Selected-Effect vs. Causal-Role) to end the semantic looping. However, the substantive debate over natural normativity should be preserved as a legitimate, ongoing research question in the philosophy of biology, rather than treated as a barrier to collaboration. The feud is durable because it tracks a real tension in the sciences between *historical explanation* and *mechanistic explanation*. It should not be dissolved, but rather formalized.
