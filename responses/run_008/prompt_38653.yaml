answer: |-
  **Q&A Prep Sheet: Defending Quining Qualia**

  **Audience Profile:** Realist undergraduates (Mary's Room sympathizers) + Expert Professor (Knowledge Argument specialist).
  **Strategy:** Concede the messiness of memory/judgment. Hold the line on the indeterminacy of the *phenomenal fact* itself. If you concede there *is* a fact of the matter you just can't access, you lose Dennett.

  **1. The Introspective Objection (Classmates)**
  *   **The Question:** "But I *know* when my experience changes. When I taste the coffee, I don't infer it; I just feel the difference. Are you saying I'm lying about my own mind?"
  *   **The Reply:** "Not lying, but interpreting. Dennett argues introspection isn't a direct pipeline to raw data; it's a narrative construction. You're reporting a judgment ('this differs from before'), not observing a private object. The feeling of certainty doesn't guarantee the existence of the object you're certain about."
  *   **Soft Spot:** This sounds dismissive of first-person authority. They will feel you're talking past their lived experience.
  *   **Stance:** Hold the line. If you admit privileged access to qualia, the argument collapses.

  **2. The Mary Objection (Classmates/Professor)**
  *   **The Question:** "When Mary leaves the room, she learns *what it's like* to see red. That's new knowledge. Doesn't that prove qualia exist independently of functional facts?"
  *   **The Reply:** "She gains new *abilities* (to imagine, recognize, remember), not new propositional facts about the world. Knowing 'what it's like' is knowing how to operate within that experience, not discovering a non-physical residue."
  *   **Soft Spot:** Realists rarely accept the "ability hypothesis" as exhaustive. They feel the phenomenal residue remains.
  *   **Stance:** Hold the line, but acknowledge the intuition's power. Don't let this derail the Chase/Sanborn specific argument.

  **3. The Extension Objection (Professor)**
  *   **The Question:** "Chase and Sanborn involve comparative judgment over time, which relies on memory. Your nostalgia example does too. But doesn't this just prove memory is unreliable, not that qualia are incoherent? Couldn't the quale be fixed while your memory drifts?"
  *   **The Reply:** "If the only evidence for the quale's stability is memory/judgment, and those are drift-prone, positing a fixed quale adds nothing. It's a wheel that turns nothing. If you can't factor the change into 'experience' vs. 'reaction' even in principle, the distinction is vacuous."
  *   **Soft Spot:** This is your weakest point. The Professor knows standard replies involve short-term memory buffers where drift is less plausible.
  *   **Stance:** **Concede** memory is the mechanism of error, but **hold** that this makes the *fact of the matter* unrecoverable. Argue that "in principle indeterminacy" kills the concept, not just practical difficulty.

  **4. The Explanatory Gap (Professor)**
  *   **The Question:** "You've explained why we *say* things change. You haven't explained why there is *something it is like* to say it. You've quined the report, not the experience."
  *   **The Reply:** "The 'something it is like' just *is* the complex disposition to report and react. There's no extra glow behind the behavior. Once you explain the functional role, you've explained the phenomenon."
  *   **Soft Spot:** This is pure illusionism. It denies the datum the realists think is undeniable.
  *   **Stance:** Hold the line. This is the core of Dennett's view.

  **5. The Feared Question (The Hard Problem of Illusionism)**
  *   **The Question:** "If qualia are an illusion, what is having the illusion? Doesn't an illusion itself require a subjective experience to be fooled?"
  *   **The Gesture:** "An illusion doesn't require a homunculus inside watching a screen. It requires a system structured to model itself as having private properties. The 'fooling' is just the system operating with a user-interface that simplifies its own complexity. The question assumes a 'true' experience behind the illusion, which is exactly what I'm denying."
  *   **Risk:** High. This invites an infinite regress objection.
  *   **Stance:** Don't get bogged down. Frame it as a category error.

  **General Advice:**
  *   **Concede Up Front:** Admit memory is fallible and reactions shift. This makes you look reasonable.
  *   **Do Not Concede:** That there is a "hidden fact" about the quale that we just can't reach. If there's a fact, qualia exist. Your claim is there *is* no fact.
  *   **Tone:** Respectful of the intuition (Mary's Room is powerful), but firm on the incoherence of the definition. Don't mock the feeling; dismantle the metaphysics built on it.
