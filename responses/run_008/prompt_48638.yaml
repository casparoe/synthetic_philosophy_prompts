answer: |-
  This is a fascinating puzzle, and it cuts right to the heart of the ambiguity in transitional justice mechanisms. You're asking me to reverse-engineer a moral algorithm from an N of 5, which is statistically perilous but philosophically rich. Given your expertise, I'll skip the basic TRC primer and go straight to the hermeneutics of her voting record.

  First, the caveat you asked for: **Yes, this could easily be noise.** Five cases is a tiny sample. Committee voting is often collegial, subject to horse-trading, or influenced by the specific quality of the applicant's remorse (which isn't in your data). Case 5 (the fringe firebomb) is the biggest outlier; denying amnesty for a bloodless, political property crime is unusual for a TRC modeled on the South African one, which tended to be liberal with political acts. It is entirely possible she voted "Deny" there because of public pressure, a specific legal technicality, or simply because she thought the group was a criminal gang masquerading as political.

  However, if we assume there *is* a coherent principle at work (charitable interpretation), here is how I read the signal.

  ### The Reconstructed Decision Rules

  I see three competing hypotheses that fit the data, ranked by plausibility.

  **1. The "Institutional Legitimacy" Rule (Strongest Fit)**
  *   **Principle:** Amnesty is reserved for violence that functions as an instrument of a *recognized* political organization with a command structure. It legitimizes "war," not "crime" or "chaos."
  *   **Fits:**
      *   *Grant Case 1 & 3:* Both actors were part of established hierarchies (Liberation Command vs. State Superiors). The violence was institutional.
      *   *Deny Case 2:* Personal gain (skimming) breaks the institutional link; it becomes corruption, not war.
      *   *Deny Case 4:* Violating standing orders makes the act "rogue," removing it from the institutional shield.
      *   *Deny Case 5:* The "fringe group nobody had heard of" lacks political legitimacy. They are treated as common criminals or terrorists, not combatants.
  *   **Why it works:** It explains the tricky Case 5 better than any other rule. It treats amnesty as a recognition of *political status*, not just political motive.

  **2. The "Proportionality & Necessity" Rule**
  *   **Principle:** Violence must be strictly necessary for the political objective and proportional to the threat/target.
  *   **Fits:**
      *   *Grant Case 1:* Military target, military casualties. Proportional.
      *   *Deny Case 4:* Victim was "low-level gossip"; killing was excessive relative to the threat.
      *   *Deny Case 2:* Stealing money wasn't *necessary* for the bomb; the skim was gratuitous.
  *   **Weakness:** It struggles with Case 5. Why is firebombing an empty office disproportionate? Unless she views *any* property damage without tactical necessity as vandalism. It also struggles with Case 3 (beating detainees) unless she views "counterinsurgency policy" as inherently validating the necessity.

  **3. The "Moral Purity" Rule**
  *   **Principle:** The applicant's subjective motive must be untainted by personal passion (greed, lust, revenge).
  *   **Fits:** Case 2 (Greed) and likely Case 4 (implied personal discretion).
  *   **Weakness:** Doesn't explain Case 5 (unless she assumes fringe actors are inherently impure).

  ### My Bet: The "Institutional Legitimacy" Rule
  I would bet on **Hypothesis 1**. It aligns best with the specific logic of the South African TRC, which struggled intensely with distinguishing "political violence" from "common crime." Her record suggests she views amnesty as a contract between the state and *organized* political forces. If you aren't part of a recognized structure (Case 5), or if you break that structure's rules (Case 4), or if you use the structure for private gain (Case 2), you fall out of the protected class.

  ### Predictions for the New Cases

  **Case A (Café Bomb, 9 Civilians)**
  *   **Prediction: DENY.**
  *   **Reasoning:** Even under the "Institutional Legitimacy" rule, there is a limit to what counts as a legitimate instrument of war. While the applicant is mid-level (institutional) and the strategy is declared (political objective), targeting a "busy café" with "nine civilians" likely fails her internal proportionality test.
  *   **Evidence:** Look at Case 4. She denied the killing of a *serious* informant because it violated orders/was excessive. If she baulked at killing a high-value target without authorization, she is unlikely to authorize the killing of nine non-combatants, even if "strategy" claims it. The TRC precedent (e.g., the *Heidelberg Tavern* case) generally held that attacks on soft civilian targets fail the proportionality requirement, regardless of the political objective. She granted the landmine (Case 1) because it was a *military* target. She distinguishes combatants from civilians.

  **Case B (Informant Killer + Affair)**
  *   **Prediction: DENY.**
  *   **Reasoning:** This is the clearest case for denial based on her record. It combines the two biggest red flags in her voting history: **Personal Motive** (the affair/jealousy, akin to Case 2's skim) and **Lack of Authorization** (acted alone/off the books, akin to Case 4).
  *   **Evidence:** In Case 2, disclosure of personal gain led to denial. In Case 4, acting outside standing orders led to denial. Case B hits both. The fact that the victim was a "serious informant" (unlike Case 4) might tempt a Grant, but the "off the books" nature combined with the affair suggests to her that this was a crime of passion using politics as a cover, not a political act.

  ### The Discriminating Hypothetical (Case C)

  To truly test whether she is an **Institutional Legitimist** (Hypothesis 1) or a **Proportionality Strict Constructionist** (Hypothesis 2), you need to isolate the variable of *Organizational Status* from *Violence Level*.

  **Design this case for the next quarter:**
  > A member of a **recognized, major political party's youth league** (not the armed wing, but a formal political affiliate) vandalizes a government building with Molotov cocktails. No injuries. The act was **authorized by the league leadership** as part of a "make the country ungovernable" campaign. Full disclosure.

  **Why this discriminates:**
  *   **If she GRANTS:** It confirms **Institutional Legitimacy** is her primary rule. She denied Case 5 (Fringe Firebomb) because the *group* lacked status, not because of the *act*. If a recognized party member does the exact same act (property damage, no injury) and gets amnesty, then Case 5 was about the "Fringe" status.
  *   **If she DENIES:** It suggests her Rule is actually about **Proportionality/Nature of Act**. It implies she doesn't believe property damage alone warrants amnesty, or that political party affiliates (vs. armed combatants) don't qualify. This would mean Case 5 was denied because firebombing isn't a "grave human rights violation" eligible for the process, or she is simply restrictive on non-lethal violence.

  ### The "Noise" Warning (The Philosophical Reality Check)

  You asked me to tell you straight if I think you're reading signal into noise. Here is the risk:

  **The "Case 5" Problem.**
  In the actual South African TRC, the "political objective" requirement was often a low bar. A fringe group firebombing a government office *should* theoretically qualify if the motive was political. Her denying that suggests one of three things:
  1.  **The Rule:** She has a high threshold for what counts as a "political organization" (My Institutional Legitimacy theory).
  2.  **The Context:** There might be facts you don't have. Did the fringe group claim responsibility? Did they have a manifesto? If the committee doubted the *political* nature of the motive, she might have voted Deny simply because she didn't believe the "political objective" prong was met.
  3.  **The Noise:** She might be a "Restrictive Voter" generally, and Case 1 and 3 were the outliers where the evidence was overwhelming.

  **Final Advice:**
  Watch **Case A** closely. If she Grants amnesty for the café bombing (9 civilians), then my reading is wrong. She is not a Proportionality thinker; she is a **Political Objective Absolutist**. If she Grants Case A, she believes that *any* act is permissible if it is authorized by a liberation movement pursuing a political goal. That is a much more radical (and controversial) position than the TRC officially held.

  If she Denies Case A (as I predict), she is operating within a "Just War" framework disguised as amnesty law. She is trying to reconstruct a moral narrative where the "good guys" followed rules, even while fighting an unjust regime. That is a common, if sometimes fictional, comfort in transitional justice.

  Keep an eye on the "Fringe" variable. That is the key to her specific jurisprudence.
