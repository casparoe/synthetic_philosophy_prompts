answer: |-
  Effective Altruism (EA) is a social and philosophical movement that advocates using evidence and reason to determine the most effective ways to benefit others. To analyze the FTX collapse through the lens of EA critiques, we must first define the three specific arguments you raised:

  1.  **Earning-to-give (ETG):** A career strategy where individuals pursue high-income jobs not for personal consumption, but to donate a significant surplus to effective charities.
  2.  **Institutional Critique:** The argument that EA focuses on individual charitable acts while ignoring, or even legitimizing, harmful systemic structures (like unregulated finance) that generate the wealth being donated.
  3.  **Measurability Bias:** The tendency to prioritize causes where impact is easily quantified (metrics, dollars saved) over causes where impact is qualitative or hard to measure, potentially distorting resource allocation.

  Below is an analysis of how each critique interacts with the facts of the FTX collapse, weighing what each explains against what it misses, and evaluating the strength of the EA defense.

  ### 1. The Earning-to-Give Critique

  **What it explains:**
  This critique posits that the pressure to generate massive surplus for donation can incentivize excessive risk-taking. SBF was the archetype of this model: he explicitly stated his goal was to accumulate wealth to donate it. The ETG framework explains the *motivation* behind his aggressive expansion. If the moral imperative is to maximize donations, and donations are capped by income, then maximizing income becomes a moral duty. This creates a psychological environment where business risks are viewed through a utilitarian calculus: a high chance of massive good (donations) might justify a small chance of catastrophic failure.

  **What it misdescribes or is silent about:**
  The ETG critique struggles to explain the *mechanism* of the collapse. Standard ETG advice within EA emphasizes earning money ethically; fraud is universally condemned within the movement. SBF's decision to commingle customer funds was not a requirement of ETG, nor was it endorsed by EA theory. Furthermore, ETG is silent on *variance*. While EA often uses "expected value" reasoning (multiplying probability by outcome), prudent ETG practitioners usually advocate for sustainable earning streams. SBF's willingness to stake everything on high-variance crypto bets was more indicative of a specific interpretation of risk-neutral expected value maximization than ETG itself. Most people pursuing ETG work in tech or finance without committing fraud or risking customer assets.

  **Verdict on the Critique:**
  This episode is largely an **anomaly** for the ETG critique. While the pressure to earn may have contributed to a risk-heavy culture, it does not explain why SBF chose fraud over legitimate business failure.
  **The EA Defense:** The defense that "EA organizations were victims" and "fraud happens outside EA" is strong here. It blunts the critique by showing that ETG does not causally necessitate fraud. The failure was individual criminality, not a structural flaw in donating surplus income.

  ### 2. The Institutional Critique

  **What it explains:**
  This critique argues that EA channels idealism into donations while leaving the source of wealth unquestioned. The FTX episode strongly supports this. SBF used his EA alignment to build a "moral halo" around FTX. He donated to political campaigns to advocate for light-touch regulation and cultivated relationships with EA leaders who vouched for his character. The critique explains why scrutiny was low: the *output* (millions in grants to EA causes) was so valuable that the *process* (risky financial governance) was overlooked. EA's acceptance of his money legitimated a volatile financial institution, delaying regulatory or community intervention that might have prevented the collapse. The critique also holds that EA leaves institutions untouched; here, EA failed to demand institutional safeguards (like independent boards or audited segregation of funds) because the focus was on the individual donor's intent.

  **What it misdescribes or is silent about:**
  This critique does not explain SBF's personal psychology or the specific mechanics of the fraud. It assumes a level of complicity or systemic blindness that might overstate EA's influence on FTX's internal operations. EA did not design FTX's governance; SBF did. The critique risks implying EA *intended* to legitimize harm, whereas the evidence suggests naive trust rather than malicious collusion.

  **Verdict on the Critique:**
  This episode acts as a **confirmation** of the institutional critique's core warning: that philanthropy can serve as reputational cover for harmful power structures.
  **The EA Defense:** The defense that "EA organizations were victims" is **insufficient** here. Being defrauded does not absolve the movement of the reputational capital it lent to FTX *before* the collapse. The harm described by the institutional critique is the legitimization of risky finance and the delay of scrutiny, which occurred regardless of whether EA leaders knew about the fraud. The fact that EA groups had to return money proves they were entangled in the institution's fate, validating the concern that EA becomes too dependent on volatile capital sources.

  ### 3. The Measurability Bias Critique

  **What it explains:**
  This critique suggests EA favors causes with legible metrics. SBF's promise was highly legible: specific dollar amounts donated to specific organizations. This contrasts with harder-to-measure interventions like community building or policy reform. The critique explains the *attraction* SBF held for the movement. In a community obsessed with quantification, a donor who could promise quantifiable billions was inherently more attractive than one promising vague social improvement. The FTX Future Fund itself focused heavily on areas where progress could be tracked (e.g., AI safety papers, biosecurity grants), reflecting a preference for tractable, measurable problems.

  **What it misdescribes or is silent about:**
  This critique is silent on the *collapse* itself. The fraud was not a result of measurement error; it was criminal deception. Measurability bias might explain why EA liked SBF, but it does not explain why FTX failed or why governance was ignored. Furthermore, EA funds many hard-to-measure causes (e.g., longtermist philosophy), so the critique overstates the case if it claims EA *only* funds measurable things.

  **Verdict on the Critique:**
  This episode is a **partial fit** but ultimately an **overfit** regarding the collapse. While measurability bias explains the initial courtship, it offers no explanatory power regarding the fraud or the governance failure.
  **The EA Defense:** The defense is largely irrelevant here, as measurability bias is a heuristic error, not a moral failing. However, the fact that EA groups lost funding suggests they were dependent on the *quantity* of money rather than the *quality* of the source, which aligns with the bias toward quantifiable resources over qualitative stability.

  ### Conclusion

  The collapse of FTX provides a complex stress test for Effective Altruism. The **earning-to-give** critique is weakened by the fact that fraud is not an inherent output of the model, and the **measurability bias** critique explains the attraction but not the failure.

  The **institutional critique** emerges as the most robustly supported. It accurately describes the dynamic where philanthropic ends justified risky institutional means. The EA movement's reliance on SBF's capital provided him with reputational cover that insulated FTX from necessary scrutiny. The defense that EA was a victim addresses the fraud but fails to address the legitimization effect. The episode confirms that focusing on individual donation capacity while neglecting the institutional integrity of the wealth source creates systemic vulnerability.

  \answer{institutional critique}
