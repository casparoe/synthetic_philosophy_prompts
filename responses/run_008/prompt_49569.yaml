  I'm a software engineer with no formal philosophy training, so please explain any technical terms from ethics or the EA debate as you use them. I'd like you to analyze the collapse of Sam Bankman-Fried's FTX as a case study for three standard critiques of effective altruism: (a) the earning-to-give model, which holds that a talented person can do the most good by taking a lucrative career and donating the surplus; (b) the institutional critique, which says that EA channels idealistic people into individually admirable donations while leaving the surrounding institutions — finance, politics, corporate governance — untouched, or even legitimating them by association with philanthropy; and (c) measurability bias, the worry that causes with legible metrics and quantifiable outcomes attract disproportionate attention and money.

  For orientation, take these facts as given: SBF studied physics at MIT, traded at Jane Street, founded the trading firm Alameda Research and then the cryptocurrency exchange FTX, and was publicly committed to donating essentially all of his fortune; he was widely celebrated in EA circles as the archetype of earning to give. In November 2022 FTX collapsed after it emerged that customer funds had been diverted to Alameda, and he was subsequently convicted of fraud. The FTX Future Fund, an EA-aligned grantmaking body, evaporated overnight, and various organizations that had counted on its grants had to disavow or return money.

