answer: |-
  Here is a complete session design for your meetup. It is built to be run by a facilitator who knows the math but needs to translate it into a visceral experience for the room.

  # Session Title: The Base Rate Bet
  **Goal:** Demonstrate that identical evidence + different priors = persistent disagreement, and that this is rational (not stubbornness).
  **Time:** 75 Minutes
  **Participants:** 14 (Split into two groups of 7)
  **Materials:** Whiteboard, printed "Briefing Packets" (Group A and Group B), play money (poker chips or printed "Rationality Dollars"), a prize (e.g., a $20 coffee card or a weird book).

  ---

  ## 1. The Principled Story: Why This Counts as a "Prior"
  You asked for a principled story for why the mechanism counts as a prior difference rather than an information difference. Here is the script for your internal logic:

  In formal Bayesian terms, a "Prior" ($P(H)$) is the probability assigned to a hypothesis before seeing the specific evidence of the current case. In human cognition, priors are **compressed experience**. They are the statistical summary of everything you've seen before this moment.

  If I tell you "Believe X," that's coercion. If I tell you "Here is a secret fact," that's asymmetric information. But if I force you to adopt a specific **Reference Class**, I am manipulating your $P(H)$ honestly.
  *   **Group A** will be primed to view the problem through a lens where success is rare (Low Base Rate).
  *   **Group B** will be primed to view the problem through a lens where success is common (High Base Rate).

  When they enter the main game, they are not hiding data from each other. They are entering the room with different *world models*. In Aumann's terms, they violate the **Common Prior Assumption**. The game proves that without that assumption, common knowledge of posteriors (seeing each other's bets) does *not* force convergence.

  ---

  ## 2. The Schedule (75 Minutes)

  ### 0:00 – 0:10: Intro & The Hook
  *   **Welcome:** Briefly state the goal. "We all know Aumann's Theorem: Rational agents with common priors can't agree to disagree. Today we are going to break it."
  *   **The Setup:** Explain that they will be trading on the outcome of a specific event: **"Will Project Omega launch successfully by Q4?"**
  *   **The Currency:** Distribute $1,000 in play money to everyone.
  *   **The Prize:** The person with the highest portfolio value at the end wins the prize.
  *   **The Rule:** You must post your credence (probability) publicly each round. You can bet against the "House" (you) or against each other.

  ### 0:10 – 0:25: Prior Seeding (The "Reference Class" Trap)
  *   **Split the Room:** Move tables so Group Alpha (7 people) and Group Beta (7 people) are physically separated. Hand out the **Briefing Packets**.
  *   **The Task:** They have 10 minutes to read the packet and discuss internally. They are told this is "Industry Context" necessary to make an informed bet.
  *   **Group Alpha Packet (The "Graveyard" Frame):**
      *   Contains 5 case studies of software projects *identical in description to Project Omega*.
      *   4 out of 5 failed catastrophically.
      *   Analysis highlights: "Scope creep," "Market saturation," "Technical debt."
      *   *Implicit Prior:* $P(\text{Success}) \approx 20\%$.
  *   **Group Beta Packet (The "Unicorn" Frame):**
      *   Contains 5 case studies of software projects *identical in description to Project Omega*.
      *   4 out of 5 succeeded wildly.
      *   Analysis highlights: "First-mover advantage," "Novel architecture," "High demand."
      *   *Implicit Prior:* $P(\text{Success}) \approx 80\%$.
  *   **Crucial Detail:** The description of "Project Omega" in the packets is identical. Only the *historical context* (the reference class) differs.
  *   **Collection:** Collect the packets. This ensures the "evidence" of the packets doesn't leak into the main game. They must rely on the *feeling* (the prior) the packets created.

  ### 0:25 – 0:55: The Trading Game (Common Knowledge of Posteriors)
  *   **The Evidence:** Project the "Project Omega Technical Spec" on the whiteboard. This is **identical** for everyone. It is deliberately ambiguous (e.g., "Uses new API X," "Budget $5M," "Team size 12"). It supports both success and failure narratives equally.
  *   **Round 1 (Private):** Everyone writes their credence on a private card. You collect them. Calculate the Group Average for Alpha and Beta.
  *   **Round 2 (Public Averages):** Write the Group Averages on the whiteboard. (e.g., Alpha: 25%, Beta: 75%).
      *   *Instruction:* "You now know the other group's posterior. You have 5 minutes to discuss within your group and update your bets."
  *   **Round 3 (Full Market):** Everyone writes their new credence on the whiteboard next to their name.
      *   *Instruction:* "You now have common knowledge of individual posteriors. You can bet play money on 'Success' or 'Fail' at the odds implied by the market. If you think the other group is wrong, bet against them."
  *   **Observation:** Watch for convergence. In a true Aumann scenario, Group Alpha should see Group Beta's 75% and think "They know something I don't," and move toward 75%. **They won't.** They will dig in. Alpha will think Beta is "naive," Beta will think Alpha is "cynical."

  ### 0:55 – 1:15: The Debrief (The Meat)
  *   **Reveal the Trick:** Show that the "Industry Context" packets were the only difference. The Technical Spec was identical.
  *   **Map to Formalism:**
      *   **Common Priors?** No. The Reference Class manipulation created different $P(H)$.
      *   **Common Knowledge?** Yes. They saw each other's numbers on the whiteboard.
      *   **Rationality?** Yes. Given their internal models, both groups acted rationally.
      *   **Result:** Aumann's theorem did not trigger because the first assumption failed.
  *   **The "Rule of Thumb" (Real Life Application):**
      *   Hand out a small card with this heuristic:
      *   **The Information Test:** "If I showed you my data, would you agree?" If yes, it's an Information Asymmetry. Share the data.
      *   **The Prior Test:** "If we saw the same data, would we still disagree?" If yes, it's a Prior/Model Difference. Share your *reference class*.
      *   **Action:** Don't say "You're irrational." Say "What reference class are you using?"

  ---

  ## 3. Payoff Scheme
  *   **Scoring Rule:** Use a simple **Brier Score** incentive.
      *   If Project Omega succeeds (you flip a coin at the end, 50/50, or pre-determine it):
      *   Score = $1 - (Prediction - Outcome)^2$.
      *   Example: You predicted 80% (0.8). Outcome = 1 (Success). Score = $1 - (0.8 - 1.0)^2 = 0.96$.
      *   Example: You predicted 80% (0.8). Outcome = 0 (Fail). Score = $1 - (0.8 - 0.0)^2 = 0.36$.
  *   **Why:** This rewards honest credences, not just "picking a side."
  *   **The Twist:** At the very end, reveal that the "Truth" of Project Omega is actually irrelevant to the lesson. The prize goes to the person whose *portfolio* (bets made during the game) performed best against the *group consensus*. This incentivizes betting against the other group if you trust your prior, reinforcing the divergence.

  ---

  ## 4. What Predictably Goes Wrong (Troubleshooting)

  **1. The "LessWrong Convergence" Problem**
  *   **Risk:** Your crowd is too homogenous. They all read the same blogs. They might realize the "Reference Class" trick immediately and converge to 50% as a joke.
  *   **Fix:** Make the Reference Class framing emotional, not just statistical. Group Alpha's packet should use language about "Risk Management" and "Fiduciary Duty." Group Beta's should use "Disruption" and "Vision." Identity anchors are stickier than numbers.

  **2. The "Gaming the Market" Problem**
  *   **Risk:** Participants realize that if they bet against the crowd and win, they get more points. They might intentionally disagree to create volatility.
  *   **Fix:** Emphasize that the *final* truth (coin flip) determines the score, not just beating the other group. If they bet 90% just to be contrarian, and the coin lands against them, they lose.

  **3. The "It's Just Information" Objection**
  *   **Risk:** A philosophy grad student will stand up and say, "The packets were information. So they had different information. Aumann doesn't apply because of Information Asymmetry, not Prior Differences."
  *   **Response:** This is the **golden teaching moment**. Acknowledge they are technically right. In formal terms, the packets were data. *However*, in human discourse, "Priors" are just "Data we processed before entering the room."
      *   *The Lesson:* In real life, you cannot distinguish between a "Prior" and "Old Information." When someone says "I have a different prior," they mean "I have processed a lifetime of data that leads me to weight this evidence differently." The session's point is that **you cannot Aumann someone into changing their life history.**

  ---

  ## 5. Debrief Segment: The Cudgel vs. The Tool
  *Read this segment verbatim or adapt closely for the final 10 minutes.*

  "We use Aumann's Agreement Theorem as a cudgel. We say, 'If you're rational, you must agree with me.' This session shows why that's dangerous.

  When you meet a disagreeing agent in the wild, you have two options:
  1.  **Assume Information Asymmetry:** 'They don't know what I know.' -> *Solution:* Share your evidence.
  2.  **Assume Prior Divergence:** 'They weigh what we know differently.' -> *Solution:* Share your model.

  Most rationalists default to Option 1. They dump data on the other person. But if the disagreement is actually Option 2 (like it was in this game), dumping data does nothing. Group Beta saw Group Alpha's 25% credence and didn't think 'Ah, they have secret data.' They thought 'Ah, they are using a pessimistic model.'

  **The Rule of Thumb:**
  Before you yell 'Aumann!' at someone, ask: **'Is there a specific piece of evidence that, if I showed you, would make you change your mind?'**
  *   If they say **Yes**: You have an Information problem. Show them the data.
  *   If they say **No** (or 'I'd need to see more like that'): You have a Prior problem. Stop sharing data. Start sharing *reference classes*. Ask: 'What kind of situations do you think this is?'

  Aumann's theorem isn't a command to converge. It's a diagnostic tool. It tells you that if you aren't converging, one of the assumptions is broken. Usually, it's the Common Prior. And in human relationships, Common Priors are a fantasy. We grew up in different factories. We are not coins from the same mint. Recognizing that isn't giving up on truth; it's giving up on the fantasy that truth is easy."

  ---

  ## 6. Limitations (Honesty Check)
  *Include this in your opening or closing remarks to maintain intellectual honesty.*

  1.  **No Iterated Announcement:** Real Aumann agreement requires infinite rounds of "I know that you know that I know." We only did 3 rounds. In theory, if we played for 4 hours, they *might* converge. But human time is finite, which makes the Prior difference functionally permanent.
  2.  **Common Likelihoods:** We assumed everyone interprets the "Technical Spec" the same way. In reality, Group Alpha probably read the spec more skeptically (Likelihood Function difference). This makes the disagreement *stronger* than Aumann's setup, but the lesson holds: rationality doesn't guarantee consensus.
  3.  **The "Truth":** We never resolved if Project Omega actually succeeded. Aumann is about truth-seeking. In this game, we prioritized understanding *disagreement* over finding *truth*. In the real world, you need both.

