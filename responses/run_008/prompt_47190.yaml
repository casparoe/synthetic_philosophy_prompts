  ## Facilitator Cheat Sheet: The "Prior" vs "Info" Distinction
  *If the discussion gets boggy, use this analogy:*

  *   **Information Difference:** Two people looking at a map. One has the north half, one has the south half. If they tape them together, they see the whole road.
  *   **Prior Difference:** Two people looking at the same map. One is a cyclist (prefers scenic routes), one is a trucker (prefers highways). They will choose different paths even with the same map.
  *   **The Meetup Lesson:** Most arguments are truckers yelling at cyclists that they are reading the map wrong. They aren't. They just have different priors on what the journey is for.
