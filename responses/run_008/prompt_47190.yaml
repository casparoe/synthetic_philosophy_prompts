prompt: |-
  So I've been hanging around LessWrong and adjacent spaces since roughly the Scott-Alexander-jacobtinkers era, and one thing that gets repeated like scripture is Aumann's agreeing-to-disagree result: two agents with common priors who have common knowledge of each other's posteriors can't disagree. It's usually cited as either "so epistemic rationalists should converge" or, more honestly, "the assumptions are doing all the work, especially the common prior one." The second reading is the one I care about.

  I'm running a session at my local rationality meetup — about 14 people, mix of software engineers and a couple of philosophy grad students, 75 minutes, a room with tables we can rearrange and a whiteboard. Most of them have heard of Aumann's theorem the way people have heard of Gödel's theorem — the vibe, not the content. I want an activity where they feel, in their bones, that the common prior assumption is not a technicality. The naive move is to just have people state credences and update on each other's numbers; that kind of works but it's too bloodless, and it doesn't isolate the prior as the thing that's breaking.

  Here's the design constraint I actually want: the game should set up two groups that get the *same evidence* — literally identical information revealed to both sides, publicly, so common knowledge of the evidence is not in question — and yet they should end up with persistently different posteriors, and the disagreement should be traceable, in the debrief, to something the participants brought into the room rather than anything that happened in the room. The tricky part is manufacturing the differing priors honestly: I don't want to just tell people "you believe X now." Maybe seed them beforehand with different framing exercises, or different reference classes they're forced to use, or have them first bet on a warm-up question where group identity forms around an answer and then carry that into the main game. I'm open to whatever mechanism you think actually produces a real prior difference and not just stubbornness, and part of what I want from you is a principled story for why your mechanism counts as a prior difference rather than an information difference — that distinction is the whole point of the session.

  Also include: rules, how to structure the 75 minutes, what the payoff scheme should be (prediction-market-style play money is fine, they're competitive nerds, that's enough), a debrief that maps specific moments in the game onto pieces of the formal setup — the prior, the posteriors, common knowledge, and where exactly the theorem stops applying — and an honest section on what the game can't reproduce (real Aumann stuff is about iterated announcement and convergence, which takes rounds we probably won't have, and the infinite regress of common knowledge is basically impossible to stage). And tell me what predictably goes wrong the first time I run it — I'm guessing at least a few participants will try to game the mechanism instead of updating, or will converge immediately because the room is full of people who all read the same blogs, which would be its own kind of funny.

  One more thing: in the debrief I want a segment connecting it back to real life — when is treating "we disagree" as evidence of irrationality on someone's part a mistake because the common prior assumption just doesn't hold between two random humans, and when is that a cop-out? The meetup crowd loves yelling "Aumann!" at each other as a cudgel, and I'd like the session to make the cudgel slightly harder to swing. If the debrief can give them a rule of thumb for telling prior-differences apart from information-differences in an actual argument, that's the session paying for itself.
reasoning: |-
  Here's a thinking process that leads to the suggested meetup activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** LessWrong-adjacent rationality meetup (14 people, mix of engineers/philosophers). Familiar with the *vibe* of Aumann's Agreement Theorem but not necessarily the math.
      *   **Goal:** Demonstrate that the "Common Prior" assumption is the critical bottleneck, not just a technicality. Show that identical evidence + different priors = persistent disagreement.
      *   **Constraint:** 75 minutes. Room with tables/whiteboard.
      *   **Key Design Challenge:** Manufacture *honest* prior differences without just commanding "believe X." Needs to feel organic (framing, reference classes, identity).
      *   **Requirements:** Rules, Schedule (75 mins), Payoff Scheme, Debrief (mapping to formalism), Limitations (what the game can't do), Troubleshooting (what goes wrong), Real-life application (rule of thumb for prior vs. info differences).
      *   **Tone:** Intellectual, practical, slightly playful (competitive nerds), rigorous but accessible.

  2.  **Deconstruct Aumann's Agreement Theorem (for the design):**
      *   *Assumptions:* Common Priors, Common Knowledge of Posteriors, Bayesians, Honest Reporting.
      *   *Result:* Posteriors must match.
      *   *The Break:* If Posteriors don't match, one assumption failed. We want to isolate *Common Priors* as the failure point.
      *   *The Trap:* Most disagreements are actually Information Asymmetry (I know something you don't). We need to eliminate this. Everyone sees the *same* evidence.
      *   *The Hard Part:* How to create different priors *before* the game starts without lying to them?
          *   *Idea 1:* Tell Group A the coin is biased Heads, Group Tails. (Too artificial, feels like information).
          *   *Idea 2:* Have them solve different warm-up puzzles that prime different heuristics. (Better).
          *   *Idea 3:* Use a "Reference Class" manipulation. Group A estimates based on Base Rate X, Group B based on Base Rate Y. (Strong candidate).
          *   *Idea 4:* "Worldview Seeding." Give Group A a paragraph suggesting the world is high-variance, Group B low-variance. (Subtle, might not stick).
      *   *Selection:* **Reference Class Priming.** It's a classic cognitive bias that maps well to "priors" in a Bayesian context (your prior is often your base rate). It feels like "information" to the participant but is actually a structural choice about how to interpret the world, which functions as a prior.

  3.  **Designing the Activity: "The Urn of Ambiguity"**
      *   *Concept:* Estimating the composition of an urn (or similar probabilistic setup) based on draws.
      *   *Twist:* The "Draws" are ambiguous. They can be interpreted in two ways.
      *   *Prior Seeding:* Split the room. Group Alpha gets a "Skeptical/Conservative" briefing. Group Beta gets an "Optimistic/High-Variance" briefing. This briefing happens *before* they see the evidence.
      *   *Evidence:* A series of signals that are noisy.
      *   *Mechanism:* Prediction market. They bet play money on the true state.
      *   *Interaction:* They can see each other's bets (Common Knowledge of Posteriors-ish).
      *   *Outcome:* They should cluster by group, not converge to the middle, because their interpretation of the signal depends on the seeded prior.

      *Refining the Prior Seeding:* Simply telling them "be skeptical" is weak. Let's make it about the *source* of the problem.
      *   *Scenario:* A startup success prediction? A cryptographic hash? A medical test?
      *   *Best Fit:* **The "Black Box" Classifier.** We have a machine that outputs "Success" or "Fail." We want to know the internal probability $P(Success)$.
      *   *Seeding:*
          *   Group A (The "Base-Raters"): Given data about how *most* machines like this fail (e.g., "90% of prototypes fail"). This sets a low prior.
          *   Group B (The "Inside-Viewers"): Given data about the *specific engineering* of this machine (e.g., "This uses a novel, high-potential architecture"). This sets a high prior.
          *   *Crucial:* Both groups get the *same* test results (evidence) during the game.
      *   *Wait, is that Information or Priors?* Technically, base rates vs. specific evidence is often an Information difference (one knows the class, one knows the instance). To make it a *Prior* difference in the Aumann sense, they need to agree on the likelihood function but start with different $P(H)$.
      *   *Better Approach:* **The "Biased Coin" Framing.**
          *   Truth: A coin is flipped 10 times.
          *   Evidence: They see the outcomes (e.g., H H T H T...).
          *   Prior Manipulation: Before seeing the flips, Group A is told "This coin comes from a factory that makes mostly fair coins." Group B is told "This coin comes from a factory that makes mostly biased coins."
          *   *Wait, that's information about the coin.*
          *   *Let's go deeper:* **The "Interpretation Key."**
          *   The evidence is ambiguous text or symbols.
          *   Group A is given a "Dictionary" that maps Symbol X to "Good."
          *   Group B is given a "Dictionary" that maps Symbol X to "Bad."
          *   *No, that's just different information.*
          *   *Okay, let's look at the "Honest Prior Difference" problem.* In real life, priors come from past experience. To simulate this, we need to give them different *past experiences* in the warm-up.
          *   *Warm-up:* Group A plays 5 rounds of a game where "Risk" usually pays off. Group B plays 5 rounds where "Risk" usually fails.
          *   *Main Game:* Both face a new Risk/Fail decision with identical public data.
          *   *Why this works:* Their $P(\text{Risk works})$ is now different based on empirical history (which functions as their prior for the new game). This is the most honest simulation of how humans acquire priors.

  4.  **Developing the "Experience Seeding" Mechanism:**
      *   **Phase 1 (Calibration):** 15 mins.
          *   Group Alpha: Solves puzzles where the "Intuitive Answer" is usually *wrong*. (Trains them to distrust surface evidence).
          *   Group Beta: Solves puzzles where the "Intuitive Answer" is usually *right*. (Trains them to trust surface evidence).
      *   **Phase 2 (The Main Event):** 30 mins.
          *   Task: Estimate the probability that a hidden statement is True.
          *   Evidence: 3 "Expert Opinions" are revealed. The opinions are ambiguous (e.g., "The data looks promising, but caveats apply").
          *   Because Group Alpha was trained to distrust surface optimism, they weigh the caveats heavier. Group Beta weighs the promise heavier.
          *   *Wait, that's Likelihood Functions, not Priors.* Aumann assumes Common Likelihoods too.
          *   *Correction:* Aumann's theorem assumes Common Priors *and* Rationality (which implies common likelihood functions if they understand the world the same way). If they interpret evidence differently, that's a Likelihood difference.
          *   *Strict Aumann:* $P(H)$ differs, but $P(E|H)$ is the same.
          *   *How to force different $P(H)$ with same history?* You can't easily.
          *   *Pivot:* The prompt asks to show that "Common Prior" is the assumption doing the work. In human terms, "Prior" encompasses our worldview/likelihoods. I need to explain in the debrief that human "priors" bundle $P(H)$ and $P(E|H)$.
          *   *Decision:* I will design the seeding to create different **Base Rates** ($P(H)$).
          *   *Scenario:* "The Startup Valuation."
          *   *Seeding:*
              *   Group A (Bears): Spend 10 mins reading case studies of *failed* startups that looked good on paper.
              *   Group B (Bulls): Spend 10 mins reading case studies of *successful* startups that looked good on paper.
              *   *Main Game:* Both evaluate *the same* new startup pitch (Evidence).
              *   *Result:* Bears say 20% chance of success. Bulls say 80%.
              *   *Why:* They have different $P(\text{Success} | \text{Looks Good})$ based on their "training data." In Bayesian terms, their *prior* over the hypothesis "This is a viable company" is different because their model of the world is different.
              *   *Debrief Hook:* Is this a prior difference or an information difference? It's information difference *historically*, but in the context of the room *now*, it functions as a prior. They enter the room with different $P(H)$.

  5.  **Structuring the 75 Minutes:**
      *   0-10: Intro & Aumann Vibe Check.
      *   10-25: **Prior Seeding (The "Worldview" Phase).** Split rooms/tables. Different reading materials/tasks.
      *   25-55: **The Trading Game (The "Evidence" Phase).** Reveal public evidence. Betting rounds.
      *   55-75: **Debrief.** Mapping to Aumann. Real-world application.

  6.  **Payoff Scheme:**
      *   Play money (e.g., "Rationality Dollars").
      *   Scoring rule: Logarithmic or Brier Score?
      *   Simpler: Prediction Market. If "True," buyers get paid. If "False," sellers get paid.
      *   Incentive: Prize for highest portfolio value.

  7.  **Addressing the "Common Knowledge" Constraint:**
      *   To satisfy Aumann's "Common Knowledge of Posteriors," they need to see each other's bets.
      *   I will have them write their credence on a whiteboard or submit to a central sheet projected on the wall.
      *   Round 1: Private estimate.
      *   Round 2: See Group Average. Update.
      *   Round 3: See Individual Bets. Update.
      *   *Expectation:* They won't converge.

  8.  **Troubleshooting:**
      *   *Convergence:* If they are too homogenous (all LW readers), they might ignore the seeding. *Fix:* Make the seeding emotional/identity-based, not just factual.
      *   *Gaming:* People betting randomly. *Fix:* Make the prize desirable (coffee gift card, book).
      *   *Confusion:* "Is this info or prior?" *Fix:* Explicitly address this in debrief.

  9.  **Drafting the Content - Section by Section:**
      *   *Title:* "The Prior Gap."
      *   *Setup:* Two distinct "Schools of Thought."
      *   *The Task:* Predicting the outcome of a complex system (e.g., "Will the AI pass the Turing Test in this specific demo?").
      *   *Seeding:* Group "Skeptics" vs. Group "Accelerants." Give them different datasets about *past* AI demos.
      *   *Evidence:* The actual demo transcript (ambiguous).
      *   *Debrief:* The "Rule of Thumb" for real life. (Ask: "What evidence would change your mind?" vs "What experience made you believe this?").

  10. **Refining the "Prior vs. Information" Distinction:**
      *   This is the crux. If Group A read about failures and Group B read about successes, that is technically an *Information* difference (they know different facts about the world).
      *   *Correction for Rigor:* To make it a true *Prior* difference in the context of the game, the seeding must be framed as "How you weight evidence" or "Default assumptions," not "Secret facts."
      *   *Better Seeding:* **The "Reference Class" Lottery.**
      *   Both groups are told: "You are evaluating a medical test."
      *   Group A is told: "Treat this as a **Screening** test (Low Prevalence)."
      *   Group B is told: "Treat this as a **Diagnostic** test (High Prevalence)."
      *   *Wait, that's telling them the Prior.* The prompt says "I don't want to just tell people 'you believe X now'."
      *   *Okay, let's go with the "Experience" angle.* Priors are compressed experience.
      *   *Activity:* **The "Dice Tower" Calibration.**
      *   Group A rolls dice where 1-3 are "Win." (Trains P(Win) = 0.5).
      *   Group B rolls dice where 1-5 are "Win." (Trains P(Win) = 0.83).
      *   *Then:* Both watch a *new* die roll mechanism (obscured) that gives ambiguous clues.
      *   *Problem:* They know they had different training. That makes it common knowledge that priors differ. Aumann says if they *know* priors differ, they can't disagree? No, Aumann assumes Common Priors. If they know priors differ, the theorem doesn't apply. That's the point!
      *   *Wait, the theorem requires Common Priors.* If I successfully give them different priors, the theorem *should not apply*. The goal is to show that *because* the theorem doesn't apply, they don't converge.
      *   *Yes.* The activity demonstrates the *failure* of convergence due to *violated* assumptions.
      *   *So:* Make the prior difference feel like "Worldview" not "Secret Data."
      *   *Idea:* **The "Policy Maker" Scenario.**
      *   Scenario: Implementing a Universal Basic Income (UBI).
      *   Evidence: A new study is released (summary provided to all). The study is mixed (some good, some bad stats).
      *   Seeding:
          *   Group A (Libertarian-leaning prompt): Focus on "Incentive Structures." Prior belief: People respond to incentives negatively.
          *   Group B (Progressive-leaning prompt): Focus on "Safety Nets." Prior belief: People need stability to thrive.
          *   *How to seed without politics?* Use abstract analogues.
          *   *Group A:* "System Stability." Read about complex systems that collapse under added load.
          *   *Group B:* "System Redundancy." Read about complex systems that thrive with added buffer.
          *   *Task:* Predict if "Project X" (ambiguous description) will succeed.
          *   *This works.* It creates different mental models (Likelihoods/Priors bundle).

  11. **Finalizing the Plan:**
      *   **Activity Name:** "The Base Rate Bet."
      *   **Seeding:** Different "Historical Archives." Group Alpha sees a history of high-failure projects. Group Beta sees high-success. They are told this is "Industry Data."
      *   **Evidence:** A new project proposal (identical).
      *   **Mechanism:** Prediction market.
      *   **Debrief:** Focus on "Why didn't you converge?" -> "Because your $P(H)$ was different." -> "In real life, how do you know if your $P(H)$ is different or if you have secret info?"

  12. **Writing the Response:**
      *   Keep it structured.
      *   Ensure the "Principled Story" for prior difference is clear (Compressed Experience).
      *   Make the debrief actionable (The "Steelman Test").
      *   Add the "What Goes Wrong" section (Crucial for a facilitator).

      *(Self-Correction during drafting)*: I need to be careful not to confuse "Different Priors" with "Different Likelihood Functions." Aumann assumes Common Priors. If I give them different training data, technically I'm giving them different information which *results* in different priors. For the purpose of the meetup, this counts as "Different Priors" because at the start of the *trading game*, the difference is internalized as a belief, not active data. I will clarify this distinction in the debrief section as a teaching moment.

      *Refining the "Rule of Thumb":*
      *   Info difference: "I know X, you don't." -> Share X.
      *   Prior difference: "I weigh X differently than you." -> Share *why* you weigh it that way (model).
      *   Test: "If I showed you my data, would you agree?" (Info). vs "If we saw the same data, would we still disagree?" (Prior).

      *Let's polish the Seeding:* To make it feel less like "I'm telling you the prior," use **Anchoring via Reference Class Selection.**
