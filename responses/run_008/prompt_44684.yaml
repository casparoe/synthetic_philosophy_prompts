answer: |-
  The hotel lobby coffee shop is loud, a cacophony of grinding beans and the low hum of three hundred philosophers arguing about metaphysics in the adjacent hall. Elena and Marcus sit at a small round table, their conference badges askew on their chests. They had both slept through the 8:00 AM panel on "Climate Ethics and Individual Obligation."

  **Elena:** (Stirring sugar into her espresso) It's probably just as well we missed it. The panelists were going to say the same thing they always do. That I am a murderer because I flew here, or because I had the chicken sandwich at lunch.

  **Marcus:** (Holding a black coffee) You're caricaturing the position, Elena. No one is calling you a murderer. They're asking about moral responsibility. If we accept that climate change causes immense suffering, and that flying contributes to it, aren't you responsible for your share?

  **Elena:** That's the intuition pump. But look at the mechanics. My single flight does not change the climate. The plane takes off whether I am in seat 14B or not. The fuel is burned. The emissions are released. My ticket purchase is causally inert regarding the specific outcome of that flight. This is the "No-Difference Defense." Responsibility requires making a difference. If my act changes nothing, how can I be blamed for the harm?

  **Marcus:** But you aren't the only one flying. We are all flying.

  **Elena:** Exactly. And *that* is the problem. If everyone flies, catastrophe. If I alone fly, nothing happens. So why is the obligation placed on *me* to abstain? It seems profoundly unfair to single out the individual as the site of obligation when the harm is purely a function of the aggregate. It treats me as if I were a levee holding back the ocean. I'm not. I'm a drop of water. Blaming the drop for the flood is a category error.

  **Marcus:** I see the force of the fairness objection. It feels like scapegoating. But consider the Expected Value argument. You say your flight makes *no* difference. But that's not strictly true. It makes a *probabilistic* difference.

  **Elena:** How so?

  **Marcus:** Take the chicken sandwich. Supermarkets don't restock continuously. They have thresholds. If they sell ten thousand units, they order ten thousand. If they sell ten thousand and one, they order ten thousand and ten. You don't know where the threshold is. Your purchase might be the one that triggers the restock. It's unlikely, say one in a thousand. But if it does trigger it, ten chickens suffer. So the expected disutility of your sandwich is (1/1000) × (10 chickens). That's not zero. It's the same expected harm as definitely killing one-hundredth of a chicken.

  **Elena:** (Pauses, tapping her spoon) I concede the math. The expected value isn't zero. But morally? We are talking about vanishingly small probabilities attached to massive harms. If I have to calculate the expected utility of every purchase based on opaque supply chain thresholds, moral life becomes impossible. But more importantly, even if we accept the math, it doesn't address the fairness worry. Why is *my* expected utility the locus of morality? If the system is designed such that my impact is diluted across thousands of consumers, isn't the fault with the system's design, not my participation in it?

  **Marcus:** That's a strong point. It shifts the blame to the structure. But does participating in an unjust structure exonerate you? Think about it non-consequentially. There's a view that complicity isn't just about causation; it's about will. By buying the ticket, you align your will with a harmful practice. You make yourself a participant in a project that is, collectively, destroying the world. Even if your causal contribution is negligible, your moral integrity is compromised by joining the harmful collective agency.

  **Elena:** "Moral integrity." That sounds nice, Marcus, but it risks becoming a purity spiral. If my act changes nothing, what is the harm to my integrity? It seems like a fetishization of clean hands. If I can save a child from drowning, but doing so requires me to step on a patch of grass owned by a racist institution, am I complicit in the racism? If my participation doesn't sustain the institution, the "complicity" seems hollow. It's symbolic. And symbolism doesn't stop the carbon.

  **Marcus:** It's not just symbolism. It's about whether you are willing to benefit from injustice. But let's test your No-Difference Defense with a specific case. I want to see if your view holds up under a slight variation.

  **Elena:** Go ahead.

  **Marcus:** Imagine two supermarkets across the street from each other. Store A uses a new, precisely calibrated algorithm. For every chicken breast sold, they order exactly one new one from the factory. Store B uses the old threshold system. At Store B, your purchase likely changes nothing. At Store A, your purchase *guarantees* one additional chicken is produced and killed.

  **Elena:** Okay.

  **Marcus:** On your view, is it permissible to buy chicken at Store B but forbidden at Store A?

  **Elena:** (Takes a sip of espresso, thinking) Strictly speaking? Yes. If moral responsibility tracks causal difference-making, then at Store A, I am causing a death. At Store B, I am not. I am merely purchasing a product that already exists. The harm at Store B is sunk; the harm at Store A is future and contingent on me.

  **Marcus:** So you would walk across the street to Store B to buy the same chicken?

  **Elena:** If the only moral variable is causal impact, then yes. But wait—I need to refine that. In the real world, I don't know which store is which. I operate under epistemic uncertainty. Since I cannot know if I am in Store A or Store B, I must act as if I might be in Store A. So, practically, I should abstain from both.

  **Marcus:** Ah. So your No-Difference Defense collapses back into the Expected Value argument you just minimized. You're saying I should abstain because I *might* make a difference.

  **Elena:** No, the justification is different. In the Expected Value view, the tiny probability *itself* carries moral weight. In my view, the probability is irrelevant. The obligation comes from the risk of crossing a causal threshold. But here is where I push back on you, Marcus. If I buy at Store B, and it turns out I was below the threshold, I have done *nothing wrong* on my view. On your complicity view, I have still tainted my will. I still participated.

  **Marcus:** I accept that distinction. But consider the implication of your Store A/B distinction. It implies that the morality of the act depends entirely on the inventory software of the vendor, not the suffering of the animal. If the animal suffers regardless, why does the ordering algorithm determine your guilt?

  **Elena:** Because my guilt is about *my* agency, not the total sum of suffering in the universe. I am not the guardian of the universe's welfare; I am the guardian of my own causal footprint. If the system absorbs my contribution without amplifying it, I am not the amplifier.

  **Marcus:** But isn't that a form of moral isolationism? You're saying that as long as the mechanism of harm is buffered enough, I can wash my hands of it. It seems to let us off the hook for structural evils precisely because they are structural. If the harm is diffuse, you say I'm safe. If the harm is tightly coupled, I'm liable. But the victim—the chicken, or the climate refugee—suffers the same either way.

  **Elena:** (Leans forward) I hear that. And I'll concede this: The fairness worry I raised earlier cuts both ways. It feels unfair to blame me for the aggregate harm. But it also feels unfair to *exonerate* me simply because the system is inefficient. However, my core concern remains: If we demand individuals bear the cost of solving collective problems when their individual efficacy is near-zero, we distract from the need for regulation. If I tell people "don't fly," and they listen, but the government doesn't tax carbon, nothing changes. If I tell people "vote for carbon tax," and they do, something changes.

  **Marcus:** So you're moving toward a political obligation rather than a consumer obligation?

  **Elena:** I'm saying the "No-Difference" argument shows that consumer restraint is the wrong tool for collective harm. It targets the wrong unit of agency.

  **Marcus:** I can agree that consumer restraint is insufficient. But I'm not sure it's irrelevant. Let's adjust my position. I don't think complicity is about "tainting the will" in a mystical sense. It's about reinforcing norms. When you buy the chicken at Store B, even if you don't trigger the order, you signal demand. You normalize the practice. You make it socially acceptable for others to do it.

  **Elena:** That's a causal claim, though. Signaling demand *does* make a difference. It shifts the curve over time.

  **Marcus:** True. It's a soft causal influence, not a hard threshold trigger. But does that satisfy your requirement?

  **Elena:** It moves closer. If my act influences the probability of others acting, then I am making a difference. But then we are back to the vanishingly small probability problem. My influence on social norms is arguably smaller than my influence on inventory thresholds.

  **Marcus:** (Sighs, looking at his watch) We're circling. Let me try one more angle. You said responsibility requires making a difference. What if we change the definition of "difference"? Not "did this specific outcome occur because of me?" but "am I part of the sufficient set of conditions that brought this about?"

  **Elena:** Overdetermination. If ten people shoot a victim and any one bullet would have killed them, are all ten responsible?

  **Marcus:** Yes. Because each was part of the sufficient set. In the climate case, my emissions are part of the sufficient set for the temperature rise.

  **Elena:** But in the flight case, I'm not part of the sufficient set for *that* flight taking off. The flight would have taken off without me. I am part of the sufficient set for the *industry's* profitability, perhaps. But that brings us back to the aggregate.

  **Marcus:** And that's where I think we land. You want to isolate the individual act. I want to situate the individual act within the collective practice.

  **Elena:** And I worry that situating it there dissolves the individual. If I am just a cell in the organism of "humanity," and the organism is sick, treating the cell does nothing. You need to treat the organism.

  **Marcus:** But the organism is made of cells. If the cells refuse to function in the harmful way, the organism changes.

  **Elena:** Only if enough cells refuse. Which returns me to the fairness objection. Why must *my* cell be the one to sacrifice itself without a guarantee that others will?

  **Marcus:** (Pauses) I don't have a answer to the fairness objection that satisfies a rational egoist. I think it requires a shift in how we see ourselves. Not as isolated agents maximizing our clean causal record, but as co-authors of a shared world. If the world is burning, asking "did I light the match?" might be the wrong question. The question might be "am I helping to put it out?"

  **Elena:** (Nods slowly) I can accept that as a poetic formulation. But philosophically, I need to know if "helping" requires efficacy. If I pour a cup of water on a forest fire, I am "helping," but I am making no difference to the outcome. Is it virtuous to pour the water?

  **Marcus:** Yes. Because it affirms the value of the forest.

  **Elena:** And I say: It is virtuous only if it encourages others to pour water, or if there is a non-zero chance it extinguishes a specific flame. If it is truly futile, it is merely expressive. And expression doesn't stop the fire.

  **Marcus:** So we haven't resolved whether futility exonerates.

  **Elena:** No. But I think we've sharpened the disagreement. It isn't about the math of emissions. It's about the nature of moral agency. Is agency defined by *causal leverage* or by *relational standing*?

  **Marcus:** That's it. If agency is causal leverage, you win in the individual case, but we lose the collective problem. If agency is relational standing, we address the collective, but I struggle to explain why the individual bears the burden when their leverage is nil.

  **Elena:** (Picks up her bag) So the crux is: Can one be morally responsible for a state of affairs one lacks the power to change?

  **Marcus:** And whether "lacking the power" is a metaphysical fact or a political one we can change.

  **Elena:** (Stands up) I'll think about that. I have to catch a flight.

  **Marcus:** (Smiles wryly) See? You're testing the theory in real-time.

  **Elena:** No. I'm testing the threshold. I checked the airline's load factor. This flight is overbooked. My seat will be filled if I don't take it. Causal inertness confirmed.

  **Marcus:** (Laughing) Safe travels, Elena.

  **Elena:** See you at the plenary, Marcus. Try not to implicate me in your carbon footprint on the way there.

  **Marcus:** I'll walk. Just in case Store A is on the way.

  *They part ways into the bustling lobby, the noise of the conference swallowing them both.*
