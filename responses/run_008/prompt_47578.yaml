answer: |-
  This is a classic objection to Scanlonian contractualism, often called **the Aggregation Problem**. Your classmate has reconstructed it very cleanly. It is the single most discussed technical problem in the literature on *What We Owe to Each Other*.

  You do not need to give up (2) (the Individualist Restriction) to save the five swimmers, nor do you need to accept that contractualism collapses into utilitarianism. The error lies in **Step (3)**, specifically in how it characterizes the nature of a "complaint" in rescue scenarios.

  Here is how you can reject Step (3) while keeping (2) and your moral intuition about the lifeguard.

  ### 1. The Error in Step (3): Burden vs. Claim
  Step (3) states: *"The strongest complaint against a principle permitting her to let the five die is one death, and the strongest complaint against a principle permitting her to let the one die is also one death."*

  This assumes that a "complaint" is merely a report of the physical burden suffered (death, pain, loss of property). While physical burden is the *basis* of the complaint, Scanlon argues that in cases of **conflicting claims**, the complaint also includes a demand for **fair consideration**.

  When the lifeguard chooses to save the one instead of the five, she is not just imposing a burden of "death" on the five. She is adopting a principle of choice that says: *"When you can save either group, but not both, the lives of the smaller group have equal weight to the lives of the larger group."*

  Scanlon's response (particularly in his later papers like "Contractualism and Utilitarianism") is that the five swimmers can reasonably reject this principle, not because 5 deaths > 1 death (aggregation), but because the principle fails to give **equal weight to each individual life**.

  *   **The Complaint of the One:** "This principle requires me to die."
  *   **The Complaint of the Five:** "This principle requires me to die, *and* it does so in a way that arbitrarily favors the one over us, despite our claims being identical."

  If the claims are identical (everyone has an equal interest in living), a principle that saves the fewer treats the individuals in the larger group as if their claims matter less. That is a distinct moral complaint about **fairness**, separate from the physical burden.

  ### 2. How This Preserves (2) (The Individualist Restriction)
  Your classmate argues that counting the five forces you to aggregate burdens (summing 1+1+1+1+1 > 1). This is false. You can count the persons without summing the *value* of their burdens.

  This is often called the **Tie-Breaker Argument**.
  1.  **Individualist Restriction:** You cannot override a *stronger* individual complaint with a *larger number* of *weaker* complaints. (e.g., You cannot kill one healthy person to cure a million headaches).
  2.  **Equal Claims:** In the lifeguard case, the individual complaints are *equal in strength* (death vs. death).
  3.  **Fairness:** When individual claims are equal, you cannot arbitrarily favor the fewer. To do so implies the favored individuals are more important.
  4.  **Conclusion:** You save the five.

  This does not violate (2) because you are not saying the *total burden* of the five outweighs the one. You are saying that **no single individual among the five has a complaint that is weaker than the individual's complaint.** Since the complaints are equal, the only non-arbitrary way to decide is to save the most people. This respects the separateness of persons because you are looking at each person's claim individually and seeing they are equal; you are not dissolving them into a "greater good."

  ### 3. Addressing the Reservoir Case (Step 6)
  The Reservoir Case is actually distinct from the Lifeguard Case, and Scanlon treats them differently. This is where your classmate's argument gets slippery by conflating **emergency rescue** with **institutional rules**.

  *   **Lifeguard (Emergency):** Ex post, specific individuals are identified. The fairness argument above applies.
  *   **Reservoir (Institutional):** This is usually decided ex ante, as a general policy.

  In the Reservoir case, Scanlon might actually agree with your classmate that the family has a very strong veto *unless* the burden on the residents is also severe (e.g., public health crisis vs. property loss). However, Scanlon has resources to permit the reservoir without full aggregation:

  1.  **Generic Reasons:** We judge principles based on "generic reasons" (reasons typical people have), not specific idiosyncratic burdens. If the generic reason "access to clean water" is sufficiently vital, it might outweigh the generic reason "security of tenure," depending on the severity.
  2.  **Compensation/Ex Ante Fairness:** A principle permitting the reservoir might be one no one could reject *if* it includes a scheme of compensation for the displaced family. The complaint is against "taking the home *without compensation*," not "taking the home for the public good."
  3.  **The Bullet:** Scanlon is willing to bite the bullet here more than utilitarians. He believes individuals *should* be protected against being sacrificed for the aggregate convenience of others. If the million residents only gain *convenience*, Scanlon might say **the reservoir is indeed forbidden.** That isn't a refutation of contractualism; it's a feature. It distinguishes contractualism from utilitarianism.

  ### 4. What You Should Reject and The Cost
  You should reject **Step (3)**.

  **The Argument to give your classmate:**
  "Step (3) assumes the only relevant factor in a complaint is the physical burden. But in contractualism, a complaint is against a *principle*. A principle that saves the fewer when the claims are equal expresses a lack of equal respect for the lives of the many. Therefore, the complaint of the five is not just 'we die,' it is 'we die under a principle that undervalues our equal standing.' The complaint of the one is just 'I die.' The former is reasonably rejectable; the latter is not, because the one cannot demand a principle that favors them arbitrarily over others with equal claims."

  **The Cost:**
  Rejecting (3) costs you **simplicity**.
  1.  **Complexity of Complaints:** You can no longer measure complaints solely by "magnitude of harm." You must also measure them by "fairness of the principle imposing the harm." This makes the reasonable-rejection test harder to apply.
  2.  **Boundary Problems:** You now have to distinguish between cases where numbers count (rescue, equal claims) and cases where they don't (headaches vs. life, unequal claims). This requires a robust theory of "relevant similarity" between claims.
  3.  **Reservoir Tension:** You may have to accept that contractualism is more restrictive on public infrastructure than you intuitively like (i.e., admitting that sometimes the family *does* have a veto).

  ### Summary
  Your classmate presents a false dilemma in Step (7). There is a middle path: **Numbers count as a tie-breaker for equal claims, not as an aggregator of value.**

  *   **Keep (1) and (2).**
  *   **Reject (3).** The complaints are not morally equal because the principle favoring the one violates the requirement of equal respect.
  *   **Reject (5).** This is not Taurek's view; Taurek says numbers *never* count. Scanlon says numbers count when claims are equal, but not when claims are unequal.
  *   **Qualify (6).** The reservoir case depends on the severity of the residents' need and the availability of compensation.

  This allows you to remain a contractualist, keep the individualist restriction, and save the five swimmers.
