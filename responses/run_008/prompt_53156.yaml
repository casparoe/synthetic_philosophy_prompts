answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees
  **FROM:** The Chair, Grants Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Grants Allocation Strategy 2024/25 and Standing Policy on Donor Intent

  **1. Purpose**

  This memo sets out the Grants Committee's recommendation for the 2024/25 financial year allocation and proposes a standing policy regarding the geographic scope of our giving. We face a tension between the strict letter of our Founding Deed and a compelling moral argument for maximising the impact of every pound we distribute. This paper resolves that tension with a definite decision for the coming year and a framework for the future.

  **2. The Ethical Proposition**

  The proposal to allocate 25% of our income to global health interventions—specifically insecticide-treated bed nets and deworming programmes—rests on a utilitarian calculus that is difficult to refute on purely mathematical grounds. Evidence suggests these interventions save lives or prevent debilitating illness at a cost-per-outcome significantly lower than most local relief efforts.

  We must take the 'drowning child' analogy seriously. If we accept that we have a moral obligation to save a life when the cost to us is trivial, distance should not logically negate that obligation. However, as trustees, we must test this analogy where it is weakest in our specific context.

  First, the analogy typically concerns an *identified* individual in *immediate* peril whom we encounter by chance. Our proposed global spending is preventive risk-reduction for *unidentified* persons at a distance. While the moral imperative remains, the psychological and institutional immediacy is diluted.

  Second, and more critically, the analogy posits that we are 'walking past' the child. In our case, no one nearby is drowning. Local emergency need is at a historic low. We are not ignoring immediate local suffering to fund distant projects; we are assessing how best to deploy surplus capacity. The moral stain of 'walking past' applies less forcefully when there is no one immediately in front of us to rescue.

  **3. The Weight of Donor Intent**

  The second pillar of this decision is our stewardship of the Victorian industrialist's endowment. The Deed requires income to be spent "relieving the poor of this county."

  A minority of the Board argues that this restriction is sacrosanct. There is merit to the view that the donor's specific intent constitutes a contract across time. To disregard it is to treat the foundation's capital as general revenue, undermining the principle of restricted giving that underpins the charitable sector.

  However, we must also consider the 'dead hand' problem. A century-old geographic restriction may no longer reflect the most effective way to relieve poverty, particularly when local need is historically low. While donor intent carries decisive *legal* weight, its *moral* weight diminishes when strict adherence results in significantly diminished impact without addressing a pressing local necessity that would otherwise go unmet. We are stewards of the founder's benevolence, not merely his specific instructions. We must honour the spirit of his generosity (relieving suffering) even if the letter (this county) requires modernisation to fulfil that spirit effectively.

  **4. Decision: Allocation for 2024/25**

  Despite the moral force of the global health argument, the Grants Committee must operate within the law. Our governing document currently restricts us to this county. To spend 25% externally without authorisation would be *ultra vires* and a breach of our fiduciary duty, exposing the charity and individual trustees to regulatory action.

  Therefore, for the 2024/25 financial year, **we will allocate 100% of grant income to beneficiaries within the county.**

  We cannot ethically justify breaking the law to do good, as doing so compromises the integrity and longevity of the foundation. However, given the historic low in local emergency need, we will broaden our local criteria to include preventative poverty alleviation and financial resilience projects, ensuring the funds are fully utilised for maximum local effect.

  **5. Standing Policy: Future Allocations**

  Committing to 100% local spending indefinitely would be an abdication of our responsibility to ensure the endowment remains relevant and effective. Therefore, the Committee adopts the following standing policy:

  1.  **Cy-près Application:** We shall immediately instruct our solicitors to prepare an application to the Charity Commission for a Cy-près scheme. We will argue that the original specific purpose has become impractical due to the surplus of funds relative to local need, requesting authority to apply up to 25% of income to effective global poverty alleviation where local need is demonstrably insufficient.
  2.  **Conditional Allocation:** Subject to Charity Commission approval, future budgets shall assume a baseline allocation of 75% local / 25% global.
  3.  **Review Trigger:** This ratio shall be reviewed annually. If local emergency need rises, the global portion may be temporarily reduced to ensure our primary statutory object is met.

  **6. Conclusion**

  This approach allows us to remain compliant stewards of the founder's legacy while actively working to modernise our mandate in line with contemporary ethical standards. We honour the donor by preserving the charity's legal standing, and we honour the 'drowning child' by committing to the regulatory process required to save them in future years.

  I ask the Board to endorse this allocation and policy at our next meeting.

  **[Signature]**

  **Chair, Grants Committee**
