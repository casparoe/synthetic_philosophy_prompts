  me and my friend argued for like three hours last night about psychiatric advance directives and I'm still turning it over so help me figure out what the practice actually presupposes. the setup: in a bunch of US states (and some other places) a person with a recurring psychotic illness can, while well, sign a document saying things like "if im in crisis again and refusing medication, treat me anyway, don't take my refusals seriously then" -- a Ulysses contract, sailor tied to the mast. and where these are binding, clinicians are supposed to follow the document over the live refusal of the person standing in front of them, who may be agitated and insistent but not obviously incompetent. my friend thinks this is nuts: the person in the room is the one who has to live with the concequences, the past self is basically a stranger legislating for him, and if you'd never let one citizen write enforceable rules for another, why let your yesterday-self bind your tomorrow-self. I kept reaching for the constitutional analogy -- we accept that constitutions bind majorities, that supermajorities lock in rules against our future selves -- but honestly he started to win, because at least a constitution has an amendment procedure and a whole polity consenting to the lock-in, whereas Ulysses on the ship can't untie himself at all. so what does honoring a self-binding directive actually presuppose -- about autonomy, about personal identity over time, about who "the patient" even is? does it require some view on which the well-self is the real one with the sick-self as a kind of temporary impostor, or can a purely present-tense autonomy theory still make sense of it? is the practice even consistent with how the same clinics handle refusal from patients who never wrote anything down? and if my friend is right, what concretely would have to change? give me your best reconstruction in prose, then finish with a JSON object with fields: "implicit_theory" (the view of autonomy/identity the practice seems to need), "strictly_required" (what any theory honoring the practice must accept), "compatible_rivals" (rival views that would also license it, if any), "friend_right_what_changes" (concrete changes if his view wins), and "open_tension" (the messiest bit that stays unresolved).
