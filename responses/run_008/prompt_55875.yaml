answer: |-
  This is one of the oldest and sharpest conflicts in bioethics, often framed as the debate between "precedent autonomy" (your past competent self) and "current interests" (your present experiencing self). Your friend is channeling the philosopher Rebecca Dresser, while you were inadvertently arguing for Ronald Dworkin's position. The reason your friend started winning is that the constitutional analogy breaks down on the mechanism of *release*. A constitution allows for amendment; a hard-line Ulysses contract in psychiatry is designed specifically to prevent amendment during the storm.

  Here is the reconstruction of what the practice actually presupposes.

  ### The Metaphysics of the Patient
  Honoring a Psychiatric Advance Directive (PAD) that overrides a live refusal presupposes a **narrative theory of personal identity**. It assumes that the "you" who signed the document and the "you" refusing medication in the ER are the same moral agent, connected by a continuous life story. Crucially, it treats the psychotic episode not as a *new* agent emerging, but as a *corruption* of the existing agent.

  If your friend is right—that the past self is a stranger legislating for another—then the practice presupposes a false continuity. But if the practice is valid, it assumes that psychosis acts as a veil that distorts values rather than creating new ones. It presupposes that the "well self" is the **authoritative self**. This doesn't necessarily mean the sick self is an "impostor" in a magical sense, but that the sick self is operating under a defect of information or reasoning (delusion, mania) that the well self correctly identified as alien to their true values. The practice assumes the well self had *epistemic privilege* about what constitutes a good life for the organism.

  ### The Theory of Autonomy
  The practice cannot be justified by a purely present-tense autonomy theory. If autonomy is only about what you want *right now*, overriding a live refusal is always a violation. Therefore, the practice requires a **diachronic theory of autonomy**. This view holds that autonomy is a project extended over time, not a series of snapshots.

  It distinguishes between **experiential interests** (avoiding pain, feeling calm *now*) and **critical interests** (maintaining relationships, keeping a job, staying true to long-term values). The PAD presupposes that critical interests outrank experiential interests when the two conflict due to impairment. It assumes you can autonomously waive your right to change your mind *specifically in the condition where your mind is compromised*. This is the "Ulysses" move: you are not binding your future competent self; you are binding your future *incapacitated* self.

  ### The Competence Loophole
  This is the legal hinge. In almost all jurisdictions where PADs are binding, they only trigger when the patient is deemed to **lack decision-making capacity**. The practice presupposes that the person standing in the room refusing meds is *not competent* to refuse, even if they are articulate and agitated.

  If the clinic treats a non-PAD patient who is psychotic and refusing, they do so under *parens patriae* (the state's duty to protect the incompetent). The PAD does not change the threshold for competence; it changes the **standard of substitution**. Without a PAD, the doctor guesses what you would want (substituted judgment) or what is best for you (best interest). With a PAD, the doctor follows the prior instruction. So, the practice is consistent with how clinics handle others *if* you accept that the psychosis negates capacity in both cases. The PAD just removes the doctor's guesswork.

  ### If Your Friend Is Right
  If your friend's view wins (that the present self is sovereign and the past self is a stranger), the concrete changes would be radical. PADs would become **advisory only**. A clinician could read the directive, but if the patient in the room says "no," that "no" stands, provided the patient meets a minimal threshold of understanding (even if delusional).

  We would see a shift toward **supported decision-making** rather than substitute decision-making. Instead of tying Ulysses to the mast, we would be required to try to untie him continuously. We would need "safe words" or review panels that could override the PAD if the patient's current distress outweighs the prior instruction. The legal standard would shift from "Did they sign this?" to "Is this current refusal an expression of a current value, even if a strange one?"

  ### The Unresolved Tension
  The messiest bit that remains, regardless of which side you take, is the **epistemic problem of capacity**. Who decides when the "sick self" is sick enough to be silenced? If the threshold is too low, we have tyranny of the past self. If the threshold is too high, we have abandonment of the vulnerable. The practice presupposes that clinicians can neutrally distinguish between "values I disagree with" and "symptoms of illness," but that distinction is notoriously porous.

