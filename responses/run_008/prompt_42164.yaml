prompt: |-
  I'm a high school junior, and this year I was elected to sit on our school's Community Standards Committee — a mixed group of students, two teachers, and the vice principal that meets weekly to rule on complaints, club funding requests, and proposals to change school rules. Recently I've noticed that almost every disagreement we handle comes down to the same unresolved question, and nobody on the committee has a principled way to answer it: when a student or teacher says "this is wrong" or "we shouldn't allow this," are they reporting a genuine moral judgment, or are they just dressing up a personal preference — or worse, a prejudice — in moral language?

  The cases make this feel urgent rather than abstract. Last month a student formally objected to our cafeteria adding halal options, saying it "isn't right" for school resources to go to some groups' dietary rules; two weeks later a different student objected to a classmate's disability accommodation on the grounds that it "isn't fair" to everyone else. In both cases, the committee split, and the arguments went in circles because we had no shared test for whether the stated moral reason was the real reason, or whether it was discomfort, self-interest, or bias wearing a moral costume. At the same time, I don't want to assume that every complaint from a majority group is bias — sometimes majority discomfort with something is a legitimate moral signal, and I worry that a procedure that too quickly reclassifies people's sincere moral claims as "just bias" becomes its own kind of unfairness.

  For background: in my civics class we touched on the idea that you can test a rule by asking whether you'd accept it without knowing what position you'd occupy under it, and I've read a little about how psychologists separate automatic gut reactions from considered judgments — but I have no training in philosophy, and neither does anyone else on the committee. What I need is not theory but a working tool.

  So here is my request. Please act as a professional philosopher specializing in moral psychology and applied ethics, and write a decision procedure the committee can actually use — a step-by-step checklist we could realistically run in fifteen to twenty minutes per case during a meeting. Before writing it, briefly brainstorm the different things that can hide behind the words "this is wrong" (considered moral conviction, self-interested preference, in-group bias, status quo bias, discomfort misread as moral objection, and anything else that belongs on the list), and decide which distinctions must survive into the procedure and which are too fine-grained for a committee of teenagers to apply. For each step of the procedure: state the question to ask, say what counts as a sufficient answer, say where the procedure stops and returns a verdict of "preference, not moral claim" or "bias, not moral claim," and mark clearly the points where the question is genuinely one of values and must be handed to a vote or to the faculty advisor rather than settled by the checklist. Be honest about where the procedure will misfire — in particular, how it handles the case where someone's bias and someone's moral conviction point in the same direction, and the case where a bias is sincerely experienced as a moral conviction by the person holding it.

  Then run the procedure on three cases from our actual docket: (1) the objection to the cafeteria adding halal options, (2) the objection to a classmate's extended-time accommodation, and (3) a proposal, which I personally support, to stop funding student clubs that don't open membership to everyone — including the religious clubs who say requiring them to accept members who reject their beliefs violates their conscience. Please think carefully and work through the reasoning step by step rather than jumping to conclusions; on the third case especially, tell me honestly whether the procedure supports my position or undermines it. Finally, include a short section on what this procedure cannot do — the kinds of cases where distinguishing preference from bias is not a factual question a checklist could ever settle. Keep the language clear enough that a fifteen-year-old committee member could follow it, but don't dumb down the underlying philosophy; if a concept like the distinction between the content of a judgment and its causal origin matters, teach it to me in a paragraph and then build it in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school junior, member of Community Standards Committee (CSC).
      *   **Problem:** Committee struggles to distinguish genuine moral judgments from personal preferences/prejudices dressed up as morality.
      *   **Goal:** A practical, 15-20 minute decision procedure (checklist) for the committee to use during meetings.
      *   **Role:** Professional philosopher specializing in moral psychology and applied ethics.
      *   **Requirements:**
          1.  Brainstorm hidden motives behind "this is wrong."
          2.  Decide which distinctions are usable for teens vs. too fine-grained.
          3.  Create a step-by-step procedure (Question, Sufficient Answer, Stop/Verdict points, Vote/Advisor handoff points).
          4.  Be honest about limitations (misfires, bias vs. conviction overlap).
          5.  Apply the procedure to three specific cases (Halal food, Disability accommodation, Club membership/religious freedom).
          6.  Include a section on what the procedure *cannot* do.
          7.  Tone: Clear for a 15-year-old but philosophically robust (teach concepts like content vs. origin).
          8.  Specific instruction on Case 3: Be honest about whether it supports or undermines the user's position.

  2.  **Brainstorming "This is Wrong":**
      *   *Considered Moral Conviction:* Based on principles (fairness, harm, rights), consistent, universalizable.
      *   *Self-Interested Preference:* "I don't like this because it costs me time/money/status."
      *   *In-Group Bias:* "My group doesn't do this, so others shouldn't."
      *   *Status Quo Bias:* "We've always done it this way; change is bad."
      *   *Disgust/Discomfort:* "This feels weird/yucky" (moral dumbfounding).
      *   *Authority Deference:* "Teacher/Parent said so."
      *   *Misunderstanding of Facts:* "This causes harm" (when it doesn't).

      *Selection for Procedure:* Teens can't psychoanalyze deep subconscious bias easily. They *can* check for consistency, harm, and universality. I need to collapse "self-interest," "status quo," and "discomfort" into a broader category of "Non-Moral Motivation" vs. "Moral Claim." The trickiest is distinguishing *sincere* bias from *principle*. The procedure needs to focus on the *structure* of the argument, not the *sincerity* of the speaker.

  3.  **Developing the Procedure (The "Moral Stress Test"):**
      *   *Concept:* Content vs. Origin. I need to explain that *why* you believe it (origin) matters less than *what* the rule implies (content). However, origin matters for spotting bias.
      *   *Step 1: The Harm/Right Claim.* Is there a specific victim or right violated? If it's just "I don't like it," stop.
      *   *Step 2: The Universality Test (Rawlsian Veil).* Would you accept this rule if you were the other person?
      *   *Step 3: The Consistency Test.* Do you apply this standard elsewhere?
      *   *Step 4: The Fact Check.* Is the belief based on false premises?
      *   *Verdict Points:* If it fails Step 1 or 4 -> Preference/Bias. If it passes 1-4 but people still disagree -> Value Conflict (Vote).

  4.  **Addressing Limitations/Misfires:**
      *   *The "Sincere Bigot" Problem:* Someone can be consistent and universalize their prejudice (e.g., "Everyone should hate Group X"). The checklist can't fully solve deep ideological conflict, but it exposes the *basis*.
      *   *Overlap:* Bias often rides on coattails of moral language. The procedure isolates the moral core.

  5.  **Applying to Cases:**
      *   *Case 1 (Halal Food):*
          *   Harm? No direct harm to objector.
          *   Universality? If objector were Muslim, would they want food? Yes.
          *   Consistency? Do they object to Kosher/Vegan?
          *   *Verdict:* Likely Preference/Status Quo bias, not moral claim.
      *   *Case 2 (Disability Accommodation):*
          *   Harm? Claim of "unfairness."
          *   Universality? If objector had the disability, would they want accommodation?
          *   Fact Check? Is equity same as equality?
          *   *Verdict:* Misunderstanding of fairness (Equity vs. Equality). Moral claim fails on facts/consistency.
      *   *Case 3 (Club Membership/Religious Freedom):*
          *   *User's Position:* Stop funding clubs that aren't open to all.
          *   *Conflict:* Inclusivity vs. Freedom of Association/Conscience.
          *   *Harm:* Exclusion vs. Coercion.
          *   *Universality:* If I am a religious student, do I want forced membership? If I am an excluded student, do I want access?
          *   *Consistency:* Do we allow political clubs to exclude opposers?
          *   *Honest Assessment:* This is a genuine Value Conflict (Step 4 handoff). The procedure won't automatically support the user. It highlights the tension between "Equal Access" and "Expressive Association." I must be honest: the procedure identifies this as a *vote* case, not a clear-cut bias case. It might actually undermine the user if the committee values associative freedom over funding conditions.

  6.  **Drafting the Content:**
      *   *Tone:* Respectful, mentorship-oriented, intellectually serious but accessible.
      *   *Structure:*
          1.  Introduction & Concept (Content vs. Origin).
          2.  Brainstorming & Filtering.
          3.  The Procedure (The "Moral Stress Test").
          4.  Limitations (The "Sincere Bigot" & Overlap).
          5.  Case Applications.
          6.  What the Procedure Cannot Do.

  7.  **Refining the Philosophy:**
      *   *Kant/Rawls:* Universalizability is key for teens.
      *   *Haidt:* Moral dumbfounding (disgust vs. reason).
      *   *Distinction:* Preference (I don't want X) vs. Moral Claim (X is harmful/unjust).
      *   *Crucial nuance:* A claim can be *moral* but *wrong*. The procedure tests if it's a *moral type* claim, not necessarily if it's the *true* moral answer (that's for the vote). Wait, the prompt asks to distinguish "genuine moral judgment" from "preference/bias." So if it fails the test, it's not a valid moral claim for committee purposes.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "bias vs. conviction" overlap? Yes, in limitations.
      *   *Check:* Did I handle Case 3 honestly? I need to make sure I don't just tell the user they are right. The tension between anti-discrimination and freedom of association is real in ethics. The procedure should flag this as a "Hard Value Conflict."
      *   *Check:* Is it 15-20 minutes? 4 steps seems right.
      *   *Check:* Language? Avoid jargon like "deontological" unless explained. Use "Rule Test" instead of "Categorical Imperative."

  9.  **Final Polish:** Ensure the distinction between "Content" (what the rule says) and "Origin" (why they feel it) is clear in the intro. Make sure the "Stop" points are clear.

  *(Self-Correction on Case 3)*: The user supports stopping funding for non-open clubs. Religious clubs say this violates conscience.
  *   *Procedure:*
      *   Harm: Exclusion (Student) vs. Coercion (Club).
      *   Universality: Would religious students accept this? No. Would excluded students? Yes.
      *   Consistency: Do we fund political clubs that require agreement?
      *   *Result:* This is a clash of *competing moral claims*, not Moral Claim vs. Preference. The procedure should reveal that *both* sides are making moral claims, meaning the checklist *cannot* decide it. It must go to a vote. This is the honest answer. It undermines the idea that the user's position is objectively "the moral one" against "bias." It shows it's a trade-off.

  10. **Final Output Generation** (incorporating all constraints).
answer: |-
  ### Introduction: Content vs. Origin

  Before we build the tool, we need to clarify one philosophical distinction that will save you hours of arguing. It is the difference between the **content** of a judgment and its **causal origin**.

  *   **Origin** is *why* you feel the way you do. (e.g., "I feel uneasy because I grew up never seeing this," or "I feel angry because this costs me money.")
  *   **Content** is *what* the rule actually says and who it affects. (e.g., "This rule denies food to a specific group," or "This rule gives one student an advantage.")

  As committee members, you are not therapists. You cannot peer into someone's brain to see if they are secretly prejudiced. A person can have a biased *origin* (they don't like the group) but accidentally stumble onto a valid moral *content* (the rule is actually unfair). Conversely, someone can be sincerely moral in *origin* but propose a rule with harmful *content*.

  **The Goal:** This procedure does not judge the person's soul. It tests whether their objection is structured like a **public moral claim** (which the committee must weigh) or a **private preference/bias** (which the committee can set aside).

  ***

  ### Part 1: Brainstorming & Filtering

  You asked what hides behind "This is wrong." Here is the full list of suspects:

  1.  **Considered Moral Conviction:** Based on harm, rights, or fairness. Consistent across situations.
  2.  **Self-Interested Preference:** "This inconveniences me" or "This costs me status."
  3.  **In-Group Bias:** "My group doesn't do this, so it shouldn't be done."
  4.  **Status Quo Bias:** "We've always done it this way; change is dangerous."
  5.  **Disgust/Discomfort:** "This feels weird/yucky" (often mistaken for morality).
  6.  **Factual Error:** "This causes harm" (when evidence shows it does not).

  **What we keep vs. toss:**
  *   **Keep:** The distinction between *Harm/Rights* vs. *Discomfort/Inconvenience*. Teens can identify harm.
  *   **Keep:** The distinction between *Universal Rules* vs. *Special Exceptions*. Teens understand fairness as consistency.
  *   **Toss:** Trying to diagnose "In-Group Bias" vs. "Status Quo Bias." For a 15-minute meeting, these function the same way: they are non-moral reasons for objecting. We will group them as **"Non-Moral Motivation."**

  ***

  ### Part 2: The Moral Stress Test (Decision Procedure)

  **Time Limit:** 15–20 Minutes per case.
  **Facilitator:** Vice Principal or Committee Chair.
  **Materials:** Whiteboard to track answers.

  #### Step 1: The Harm & Rights Claim
  **Question:** "Specifically, who is being harmed, or what right is being violated? If everyone were perfectly comfortable, would there still be a problem?"

  *   **Sufficient Answer:** Identifies a specific person/group suffering a loss (dignity, safety, access) or a right being breached.
      *   *Example:* "This policy denies Muslim students access to lunch."
  *   **Insufficient Answer:** Focuses on feelings, tradition, or vague "atmosphere."
      *   *Example:* "It just feels like favoritism," or "It changes the school culture."
  *   **STOP POINT:** If the objector cannot name a specific harm or right violation after 5 minutes of probing, the committee records this as **"Preference/Discomfort, not Moral Claim."** The objection is noted but carries no veto weight.
  *   **Proceed to Step 2 if:** A specific harm or right is identified.

  #### Step 2: The Universality Test (The "Veil of Ignorance")
  **Question:** "If you did not know whether you would be the person *making* the complaint or the person *affected* by the rule, would you still agree this rule is necessary?"

  *   **Sufficient Answer:** "Yes, even if I were the Muslim student, I would agree that school funds shouldn't be used this way" OR "Yes, even if I were the student needing accommodation, I would agree that fairness means everyone gets the exact same time."
  *   **Insufficient Answer:** "Well, if I were them, I'd want it, but since I'm not..." (This reveals the objection is self-interested).
  *   **STOP POINT:** If the objector admits they would *not* accept the rule if they were in the other person's shoes, record as **"Self-Interest or Bias, not Moral Claim."**
  *   **Proceed to Step 3 if:** The objector claims the rule holds up regardless of who they are.

  #### Step 3: The Consistency Check
  **Question:** "Have you applied this same standard to similar cases in the past? If not, what is the relevant difference?"

  *   **Sufficient Answer:** "We objected to Kosher food last year for the same reason" OR "We do not allow political clubs to exclude members either."
  *   **Insufficient Answer:** "This is different because..." (followed by a reason that relies on stereotypes or irrelevant details).
  *   **STOP POINT:** If the standard is applied selectively to one group without a relevant factual difference, record as **"Inconsistent Application (Potential Bias)."** The committee may override the objection based on precedent.
  *   **Proceed to Step 4 if:** The standard is applied consistently.

  #### Step 4: The Fact Check
  **Question:** "Is the claimed harm based on verified facts, or on an assumption?"

  *   **Sufficient Answer:** Provides evidence (e.g., budget sheets, policy documents, expert testimony on disability).
  *   **Insufficient Answer:** Relies on rumors, assumptions about motives, or debunked claims (e.g., "Accommodations give an unfair advantage" when evidence shows they level the playing field).
  *   **STOP POINT:** If the moral claim relies on a demonstrably false premise, record as **"Factual Error."** The claim is invalid.
  *   **HANDOFF POINT:** If the claim passes Steps 1–4 (It identifies harm, is universal, consistent, and factual) but the committee *still* disagrees on the outcome, this is a **Genuine Value Conflict.**
      *   **Action:** Stop the checklist. This is not a case of bias vs. morality. This is Morality vs. Morality. Move to a formal vote or refer to the Faculty Advisor for a final ruling.

  ***

  ### Part 3: Limitations & Misfires

  You asked for honesty about where this breaks. Here are the two main failure points:

  **1. The "Sincere Bigot" Problem**
  A person can be prejudiced but pass this test. Someone might genuinely believe "Religious exclusion is good for everyone" (Universality), apply it to all religions (Consistency), and believe it causes social harm (Harm Claim).
  *   *Why the test fails:* The checklist tests the *structure* of the argument, not the *truth* of the underlying values.
  *   *The Fix:* This is why Step 4 (Fact Check) is crucial. Often, bias relies on false facts (e.g., "Integration causes conflict"). If the facts hold, and they still pass the test, you have a **Value Conflict**, not a bias case. You must vote.

  **2. The "Bias in Moral Clothing" Problem**
  Sometimes bias and moral conviction point in the same direction. A student might object to a club policy because they are prejudiced against the club's members, but the policy *is* actually unfair.
  *   *Why the test fails:* The test validates the *claim*, not the *motive*.
  *   *The Fix:* It doesn't matter. If the claim is valid (the policy *is* unfair), the committee should rule against the policy, even if the complainant had bad motives. We judge the rule, not the person.

  ***

  ### Part 4: Running the Procedure on Your Cases

  Here is how the "Moral Stress Test" applies to your three docket items.

  #### Case 1: Objection to Halal Cafeteria Options
  *   **Step 1 (Harm):** Objector claims "resources going to some groups isn't right."
      *   *Analysis:* Is there a specific victim? The objector implies *all* students lose resources.
      *   *Fact Check:* Does providing halal options reduce quality/quantity for others? Usually, no; it's often a substitution or grant-funded.
      *   *Verdict:* If funds are not diverted from general meals, there is no **Harm**.
  *   **Step 2 (Universality):** If the objector were Muslim, would they agree school shouldn't feed them?
      *   *Likely Answer:* No.
  *   **Procedure Result:** **STOP at Step 1/2.**
      *   *Classification:* **Preference/Status Quo Bias.** The objection is not about harm, but about a preference for a "neutral" (majority-default) cafeteria. The committee can rule that this is not a valid moral claim and approve the funding.

  #### Case 2: Objection to Disability Accommodation (Extended Time)
  *   **Step 1 (Harm):** Objector claims it "isn't fair to everyone else."
      *   *Analysis:* Claims harm to "fairness."
  *   **Step 2 (Universality):** If the objector had the documented disability, would they accept the "same time" rule?
      *   *Likely Answer:* No. They would acknowledge the playing field isn't level.
  *   **Step 4 (Fact Check):** Does extended time give an *advantage* or restore *access*?
      *   *Expert Consensus:* It restores access; it does not provide an advantage over neurotypical peers.
      *   *Verdict:* The claim relies on a false premise (that equity = identical treatment).
  *   **Procedure Result:** **STOP at Step 4.**
      *   *Classification:* **Factual Error.** The moral language ("fairness") is being used, but the factual basis is incorrect. The committee can rule that the accommodation stands based on evidence.

  #### Case 3: Proposal to Defund Non-Open Clubs (Your Proposal)
  *   *Context:* You propose stopping funding for clubs (including religious ones) that don't open membership to everyone. Religious clubs argue this violates their conscience.
  *   **Step 1 (Harm):**
      *   *Your Side:* Harm is **Exclusion/Discrimination** against students barred from joining.
      *   *Religious Side:* Harm is **Coercion/Violation of Conscience** (forced association).
      *   *Result:* Both sides identify specific rights/harms. **Pass.**
  *   **Step 2 (Universality):**
      *   *Your Side:* "Even if I were a religious club, I should accept all students to get public funds."
      *   *Religious Side:* "Even if I were an excluded student, I should not force a club to violate its beliefs."
      *   *Result:* Both sides claim their rule works universally. **Pass.**
  *   **Step 3 (Consistency):**
      *   *Question:* Do we fund political clubs that require members to agree with their platform? Do we fund honor societies that exclude based on grades?
      *   *Analysis:* If you fund political clubs that exclude opposers, but defund religious clubs that exclude non-believers, you fail the Consistency Check. If you defund *all* selective clubs, you pass.
      *   *Result:* Depends on your school's precedent. Let's assume you apply it to *all* clubs. **Pass.**
  *   **Step 4 (Fact Check):**
      *   *Question:* Does funding equal endorsement? Does defunding equal punishment?
      *   *Analysis:* These are philosophical questions, not empirical facts.
      *   *Result:* **HANDOFF POINT.**

  **Honest Assessment of Case 3:**
  The procedure **does not support your position automatically.** In fact, it undermines the idea that this is a simple case of "Bias vs. Morality."
  *   The religious clubs are making a **Genuine Moral Claim** (Freedom of Association/Conscience), not just a preference.
  *   You are making a **Genuine Moral Claim** (Equal Access/Non-Discrimination).
  *   Because both sides pass Steps 1–4, the checklist tells you: **This is a Value Conflict.**
  *   *Implication:* You cannot solve this by accusing the religious clubs of bias. Their claim is structurally moral. The committee must vote. If the committee values "Inclusivity" over "Associative Freedom," you win. If they value "Freedom of Conscience" more, you lose. The procedure forces you to admit this is a trade-off, not a cleanup of prejudice.

  ***

  ### Part 5: What This Procedure Cannot Do

  Finally, you need to know when to put the checklist away. There are three scenarios where this tool will not work:

  1.  **Clashing Rights:** As seen in Case 3, sometimes two moral values collide (e.g., Free Speech vs. Safety; Privacy vs. Transparency). The checklist identifies the clash but cannot resolve it. That requires a vote.
  2.  **Deep Worldview Differences:** If a student objects to a sex-ed curriculum because they believe it is "sinful," and another supports it because they believe it is "lifesaving," the checklist will show both are making moral claims. You cannot use the checklist to prove one worldview is "bias." That is a job for the Faculty Advisor or Administration.
  3.  **Systemic/Invisible Harm:** Sometimes bias is embedded in the system, not the specific rule. A rule might be "neutral" (everyone takes the same test) but have biased outcomes. The checklist looks at the *rule's content*, not its *historical impact*. If you suspect systemic bias, you need a different tool (like data analysis), not this moral test.

  **Final Advice:**
  Use this tool to clear the underbrush. It will help you quickly dismiss objections based on discomfort, self-interest, or factual errors (like Cases 1 and 2). But when you encounter a case where two sincere moral values fight (like Case 3), do not try to force the checklist to pick a winner. Acknowledge the conflict, call it what it is, and vote. That is what a committee is for.
