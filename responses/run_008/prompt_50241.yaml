  ### Refrain Brainstorming & Selection

  **Option 1: The Mathematical Abstract**
  *   A1: However small the fraction we assign,
  *   A2: The value scales along a steeper line.
  *   *Critique:* Clinically accurate, but "assign" admits subjectivity (weakens her conviction) and "line" is too dry. It lacks the visceral stakes of *lives*.

  **Option 2: The Temporal Wager**
  *   A1: The odds may vanish down to nearly zero,
  *   A2: But future lives outnumber every hero.
  *   *Critique:* "Zero/Hero" is a sing-song rhyme that undermines the seriousness. "Hero" introduces a narrative element she would reject; she cares about aggregates, not individuals.

  **Option 3: The Selected Pair (Concrete vs. Cosmic)**
  *   A1: Though one in billions is the chance we face,
  *   A2: The potential lives fill all of time and space.
  *   *Critique:* This works hardest. "Face" implies immediate humanity, presence, and the sister's argument (looking someone in the face). "Space" implies the abstract, empty, astronomical future. The rhyme is open and resonant. The meter is steady iambic pentameter. Crucially, when combined in the couplet, the concessive "Though" in A1 is overwhelmed by the declarative certainty of A2, enacting the fanaticism structurally.

  ***

  ### The Villanelle: *Expected Value*

  Though one in billions is the chance we face,
  You claim the evidence escapes our sight,
  The potential lives fill all of time and space.

  My sister feeds the beggars in this place,
  She deals in warmth and shelter from the night,
  Though one in billions is the chance we face.

  I do not run a losing, desperate race,
  To save the world requires a colder light,
  The potential lives fill all of time and space.

  When digits swell they leave no human trace,
  You trade the certain for the phantom might,
  Though one in billions is the chance we face.

  I see the judgment written on your face,
  The city sleeps beneath a coat of white,
  The potential lives fill all of time and space.

  There is no shelter for the future race,
  But logic claims the sole and final right,
  Though one in billions is the chance we face,
  The potential lives fill all of time and space.

