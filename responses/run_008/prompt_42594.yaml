answer: |-
  Here is a complete design for the seminar game, titled **"The Disposition Lab."** It is designed to be printed on standard paper, explained in 5 minutes, and run within a 90-minute block.

  ---

  # Part 1: Game Design

  ## 1. Setup & Roles (14 Students)
  Divide the class into three groups. You (the instructor) act as the **Game Master (GM)** to keep time and resolve rule disputes, but do not participate in the logic.

  *   **The Objects (5 Students):** Sit at the front. They hold secret **Identity Cards**. They cannot speak or move unless a test forces a reaction.
  *   **The Testers (5 Students):** Sit together. They hold **Data Sheets**. Their goal is to correctly identify the Objects' dispositions.
  *   **The Interferers (4 Students):** Sit together. They hold **Intervention Cards**. Their goal is to make the Testers' data unreliable without getting caught *during* the round.

  ## 2. The Cards (Printable Content)

  **A. Object Identity Cards (5 Cards)**
  *   *Object 1:* **FRAGILE** (Breaks if Struck)
  *   *Object 2:* **SOLUBLE** (Dissolves if Soaked)
  *   *Object 3:* **FLAMMABLE** (Burns if Heated)
  *   *Object 4:* **INERT** (Nothing happens ever)
  *   *Object 5:* **INERT** (Nothing happens ever)
  *(Note: Keep the specific mapping secret from Testers. Objects know their own card.)*

  **B. Intervention Cards (8 Cards total, shuffled into a deck)**
  *   **The Mask (x3):** "If a test would cause a manifestation, prevent it. Result = Negative."
  *   **The Saboteur (x3):** "If a test would NOT cause a manifestation, force it. Result = Positive."
  *   **The Fink (x2):** "If a test is applied, remove the disposition *before* the result. Result = Negative."
  *(Note: Mechanically, Mask and Fink produce the same result, but the metaphysical story differs.)*

  **C. Tester Data Sheet (1 per Tester)**
  Columns: *Round | Object ID | Test Applied | Observed Result | Final Guess*

  ## 3. Rules of Play (Explain in < 5 mins)

  1.  **The Goal:**
      *   **Testers** score **1 Point** for every Object they correctly identify at the end of a Round.
      *   **Interferers** score **1 Point** for every Object the Testers identify *incorrectly*, **BUT ONLY IF** they played an Intervention Card on that Object during that Round. (Random guessing by Testers does not help Interferers; they must *cause* the error).
  2.  **The Turn:**
      *   Testers choose one Object (by ID number) and one Test (**Strike, Soak, or Heat**).
      *   Announce this to the room.
      *   **Interferers** have 30 seconds to confer. They may choose to play **one** Intervention Card from their hand face-down to the GM. Or they may pass.
      *   **GM** determines the outcome based on the Object's Card + Intervention Card.
          *   *Match:* (Fragile + Strike) = Break.
          *   *Mask/Fink:* (Fragile + Strike + Mask) = No Break.
          *   *Saboteur:* (Inert + Strike + Saboteur) = Break.
      *   **GM** announces only the Result ("It Broke" or "It Held"). Do not reveal if an Intervention was used.
  3.  **The Round:**
      *   There are **3 Rounds**.
      *   Each Round allows **5 Tests** total (distributed however Testers like).
      *   At the end of the Round, Testers submit their guesses for all 5 Objects.
      *   **Reveal:** GM reveals the true Identity Cards and any Intervention Cards played. Score is tallied.
      *   Interferers get their played cards back (reshuffled) for the next round.
  4.  **Constraints:**
      *   Objects cannot speak.
      *   Testers cannot test the Interferers.
      *   Interferers cannot intervene if the test is irrelevant (e.g., Soaking a Flammable object doesn't trigger a manifestation anyway, so a Mask card does nothing).

  ## 4. Turn Structure & Timing (40 Minutes Total)

  *   **Round 1 (Baseline):** 10 Minutes.
      *   *GM Instruction to Interferers:* "You have cards, but try to understand the baseline first. Limit interventions." (Ideally, let them play 1-2 just to create noise, but mostly let SCA work).
  *   **Round 2 (The Mask/Fink):** 15 Minutes.
      *   *GM Instruction to Interferers:* "Your goal is to make Fragile things look Inert. Use Masks and Finks."
      *   *Result:* Testers will observe Fragile Objects surviving strikes. SCA suggests "Not Fragile."
  *   **Round 3 (The Saboteur):** 15 Minutes.
      *   *GM Instruction to Interferers:* "Your goal is to make Inert things look Fragile. Use Saboteurs."
      *   *Result:* Testers will observe Inert Objects breaking. SCA suggests "Fragile."

  ---

  # Part 2: The Debrief (40 Minutes)

  Do not start with definitions. Start with their frustration.

  **1. The Data Wall (5 mins)**
  Write the Round 2 and 3 results on the board.
  *   *Round 2:* Object 1 (Fragile) + Strike = **No Break**.
  *   *Round 3:* Object 4 (Inert) + Strike = **Break**.
  Ask the Testers: "Based on the Simple Conditional Analysis (If Struck -> Break), what is the disposition of Object 1 in Round 2?"
  *   *They will say:* "Not Fragile."
  *   *Reveal:* "It was Fragile."
  Ask: "What is the disposition of Object 4 in Round 3?"
  *   *They will say:* "Fragile."
  *   *Reveal:* "It was Inert."

  **2. Mapping the Failure (15 mins)**
  Draw the SCA formula on the board:
  $$x \text{ is } D \iff \text{If } x \text{ were } C, x \text{ would } M$$

  *   **The Mask/Fink Problem (Round 2):**
      *   The conditional is *False* (If struck, it would not break).
      *   The disposition is *True* (It is fragile).
      *   *Conclusion:* The Conditional is **not Necessary** for the Disposition.
      *   *Distinction:* Ask the Interferers who played "Mask" vs "Fink."
          *   **Mask:** The glass was fragile, but the packing foam stopped the break. (Extrinsic blocker).
          *   **Fink:** The glass was fragile, but the sorcerer *removed the fragility* the moment the hammer swung. (Intrinsic change).
      *   *Point:* SCA can't tell the difference between "Not Fragile" and "Fragile but Protected."

  *   **The Saboteur/Antidote Problem (Round 3):**
      *   The conditional is *True* (If struck, it broke).
      *   The disposition is *False* (It is not fragile).
      *   *Conclusion:* The Conditional is **not Sufficient** for the Disposition.
      *   *Point:* SCA can't tell the difference between "Fragile" and "Sturdy but Sabotaged."

  **3. The Metaphysical Lesson (15 mins)**
  Now introduce the literature.
  *   **Martin (1994) / Lewis (1997):** This is exactly the "Finkish Disposition" argument. The counterfactual depends on the *retention* of the disposition through the test.
  *   **Intrinsicness:** Why did this feel unfair? Because dispositions are supposed to be *intrinsic* to the object. The Interferers were *extrinsic*. The SCA fails because counterfactuals are sensitive to extrinsic context, but dispositions (intuitively) are not.
  *   **Categorical Bases:** If the conditional analysis fails, what *is* a disposition? Is it a primitive? Is it a categorical base (molecular structure)? Briefly touch on the shift to Categoricalism or Dispositional Essentialism as responses to this mess.

  **4. Closing (5 mins)**
  Ask: "How would you fix the test?"
  *   Students usually suggest: "Test in a vacuum," "Ban sorcerers."
  *   *Your punchline:* "That's exactly what metaphysicians try to do: add 'ceteris paribus' clauses. But defining 'normal conditions' without circularity is the next 50 years of the debate."

  ---

  # Part 3: Honest Reflections

  ## 1. What Will Predictably Go Wrong
  *   **The "Irrelevant Test" Loophole:** Testers will try to "waste" turns to drain the Interferers' cards. *Fix:* Give Interferers unlimited cards but limited *coordination time*. Or, rule that Interventions only score points if they successfully flip a result. If they play a Saboteur on a Fragile object (which would break anyway), they get no points. This forces them to be surgical, not spammy.
  *   **The "Silent Object" Boredom:** The 5 Object students may zone out. *Fix:* Give them a private checklist. "If you are Fragile and Struck, raise your hand *unless* the GM says stop." Make them physically enact the result if no interference occurs.
  *   **Score Disputes:** Testers will argue they "knew" it was masked. *Fix:* Scoring is binary based on the submitted sheet. No "I suspected" points.
  *   **Time Creep:** The Interferers will take 5 minutes to decide on a card. *Fix:* Use a visible phone timer. 30 seconds hard stop. If they haven't played, they pass.

  ## 2. What The Game Cannot Reproduce (For the Debrief)
  *   **The Intrinsicness Intuition:** The game shows SCA fails, but it doesn't prove dispositions *must* be intrinsic. A student could argue, "Maybe fragility just *includes* the environment." You must supply the philosophical intuition that properties like mass or charge feel intrinsic, so fragility should too.
  *   **Fink vs. Mask Mechanics:** In the game, a Mask and a Fink produce the exact same outcome (No Break). The game cannot simulate the *ontological difference* (blocking manifestation vs. removing the property). You have to explain that distinction verbally.
  *   **The "Would" vs. "Did" Gap:** The game uses actual tests (indicative), not counterfactuals (subjunctive). The SCA is about what *would* happen. The game simulates this by running repeated trials, but sharp students will note that observing 5 breaks isn't the same as the truth of a counterfactual conditional.
  *   **Circularity of "Normal Conditions":** The game solves the problem by revealing the Interferers. In reality, we don't get to see the "Interferer card" of the universe. The debrief must emphasize that we are trying to define dispositions *without* knowing the interference beforehand.

  ## 3. Loophole Closures (For the Rule Sheet)
  *   **Rule 5:** "Interferers score 0 points if they play a card that does not change the outcome (e.g., Masking an Inert object)." (Prevents card dumping).
  *   **Rule 6:** "Testers must declare the specific Test (Strike/Soak/Heat). General 'Inspect' actions are not allowed." (Prevents vague data gathering).
  *   **Rule 7:** "Objects must reveal their card if the GM rules an Intervention was 'Impossible' (e.g., Soaking a Flammable object)." (Prevents Interferers from bluffing impossible physics).
