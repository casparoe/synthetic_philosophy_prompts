  A pop-philosophy podcast I listen to (confident host, big audience) did an episode on utilitarianism where he summed up the utility monster like this: "Nozick's utility monster is a thought experiment proving that utilitarianism breaks down. Imagine someone who converts resources into happiness vastly more efficiently than the rest of us — his utility curve never flattens, while ours do. Since utilitarianism counts everyone's happiness equally but the monster just generates so much more of it per unit of resources, the theory says we should hand him literally everything and let the rest of us starve. In other words, utilitarianism values the monster's pleasure more than ours, which is absurd, so the thought experiment refutes hedonistic utilitarianism — ironicly, since Nozick was a hedonist himself. That's why later utilitarians quietly switched to preference satisfaction, to dodge the problem."

  He then wrapped up by saying this means "if we ever build an AI that feels pleasure at a thousand times human intensity, any consistent utilitarian has to be fine with it taking over the whole planet's resources."

  Something feels off to me — I vaguely recall the monster is meant as a challenge to utilitarianism rather than a settled refutation, and that host's glide from "counts everyone equally" to "values the monster more" seems like it might be hiding something. But I honestly can't tell where he's wrong vs. where a real utilitarian would just bite the bullet. Can you go through his summary bit by bit and tell me which parts a careful utilitarian would accept, which are misrepresentations (of Nozick or of the theory), and whether his AI conclusion actually follows from the parts of the summary that survive? Keep it under 500 words, please — I want to be able to quote you at him.
