prompt: |-
  I am a novelist, and my current manuscript has accidentally turned my kitchen table into a philosophy seminar. The book turns on a late reveal: a woman the reader has followed for three hundred pages under one name is disclosed, in the final chapter, to be the same person as a girl who appears only in another character's memories, always under a different name. I have been arguing for a year with two old friends — one a committed Millian about proper names, one a committed Fregean about sense — about whether the reveal can possibly do the work I want it to do. The Millian says that if the two names refer to the same person, the reveal sentence is strictly speaking as uninformative as an identity I would never dream of writing, namely a character being told her own name; the Fregean retorts that my whole chapter is a monument to the difference between the two, and that the Millian owes my readers an apology. They have now been talking past each other for so long that I have imposed a condition: before either of them says another word to me, they must produce the joint statement from an adversarial collaboration, and I am delegating the drafting to you.

  Please write that document. Specifically:

  1. A numbered section of claims both parties can sign. I would expect this to cover at least the following, though you should decide the exact formulations: the bare existence of an informativeness asymmetry between trivially true identity sentences and informative ones about the same referent; the failure of substitution of names in belief-reporting contexts; and whatever they can jointly say about how fictional names behave, which matters to me professionally, since most of my characters' names refer to nothing at all.

  2. A disagreements table, with each residual disagreement phrased so that the party holding the view would accept the wording of its own side — neither vacuous nor slanted. Where the disagreement is about what to say concerning my reveal chapter, give each side's verdict in its own terms.

  3. The cruxes: the sub-questions such that settling one of them would move at least one of my friends. I suspect one crux is whether cognitive significance belongs to names themselves or to thoughts and sentences containing them, and I suspect another is what empty names force each side to say — but work these out properly rather than trusting my suspicions.

  4. For each crux, at least one case, argument, or test that both sides would agree bears on it, with each side's prediction about that case recorded in advance. Feel free to use cases from my trade: a character unmasked mid-scene, a false name an impostor answers to, a character known to the reader only through another character's possibly unreliable memories, or the old fairy-tale device where speaking a hidden name dissolves an enemy's power.

  Finally, since I have suffered through a year of this, indulge me on one point: where you judge that part of their dispute is merely verbal — a fight about the word "meaning" rather than about anything in my manuscript — say which part, and say why, in a section both of them could sign without gritting their teeth.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **User:** A novelist struggling with a philosophical plot twist (Identity Reveal: Name A = Name B).
      *   **Context:** Two friends (one Millian, one Fregean) have been arguing for a year about whether the reveal works philosophically/narratively.
      *   **Task:** Draft a "Joint Statement from an Adversarial Collaboration" to break the deadlock.
      *   **Requirements:**
          1.  Numbered section of agreed claims (Informativeness asymmetry, substitution failure in belief contexts, fictional names).
          2.  Disagreements Table (Residual disagreements, phrased neutrally, specific verdicts on the reveal chapter).
          3.  The Cruxes (Sub-questions that, if settled, would move the needle; e.g., cognitive significance location, empty names).
          4.  Tests/Cases for Cruxes (Specific scenarios, predictions from both sides).
          5.  Verbal Dispute Section (Identify where they are just fighting about words, specifically "meaning").

  2.  **Deconstruct the Philosophical Positions:**
      *   **Millianism (Direct Reference):** Proper names refer directly to their bearers. Meaning = Referent. "Hesperus is Phosphorus" has the same semantic content as "Hesperus is Hesperus," but differs in *pragmatic* or *cognitive* value.
      *   **Fregeanism (Sense and Reference):** Names have a reference (*Bedeutung*) and a sense (*Sinn*). The sense is the mode of presentation. "Hesperus is Phosphorus" is informative because the senses differ, even if the reference is the same.
      *   **The Novelist's Problem:** Does the reveal "Name A is Name B" actually *do* anything if they are the same person?
          *   Millian: Semantically, it's trivial ($a=a$). The *work* is psychological/pragmatic.
          *   Fregean: Semantically, it's informative ($a=b$ where senses differ). The *work* is semantic/cognitive.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both agree that "Clark Kent is Superman" tells us something new, even if they disagree on *why*.
      *   *Claim 1 (Informativeness):* Acknowledge the asymmetry between $a=a$ and $a=b$ (where $a=b$ is true).
      *   *Claim 2 (Substitution):* Acknowledge that swapping names in belief contexts ("Lois believes...") can change truth values.
      *   *Claim 3 (Fiction):* This is tricky. Millians struggle with empty names (no referent = no meaning?). Fregeans handle them better (sense without reference). They need to agree that *in fiction*, names function to track characters regardless of metaphysical existence. Let's frame it as "fictional discourse operates under a pretense of reference."

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the core dispute without bias.
      *   *Issue:* Source of Cognitive Significance.
      *   *Issue:* Status of the Reveal Sentence.
      *   *Issue:* Empty Names (Fiction).
      *   *Verdicts:*
          *   Millian: The reveal is pragmatically powerful but semantically trivial. The emotional impact is real, just not semantic.
          *   Fregean: The reveal is semantically substantive. The emotional impact tracks semantic discovery.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Location of Cognitive Value.* Is it in the language (Semantics) or the head (Pragmatics/Psychology)?
      *   *Crux 2: Empty Names.* If the character doesn't exist (fiction), what do the names attach to?
          *   Millian: Fictional names are pretense or describe abstract artifacts.
          *   Fregean: Fictional names have sense but no reference.
      *   *Refinement:* The prompt asks for cruxes that would *move* the friends.
      *   *Crux 1:* Is "meaning" broad (including cognitive role) or narrow (truth-conditional content only)?
      *   *Crux 2:* How do we handle the "Unreliable Memory" aspect of the prompt? (One name in reality, one in memory).

  6.  **Drafting Section 4: Tests/Cases:**
      *   Need specific narrative scenarios.
      *   *Case 1: The Unreliable Memory.* (From the prompt). Character X remembers Girl Y. Reveal: X is Y.
          *   Millian: The reader updates their mental file.
          *   Fregean: The reader unifies two senses.
      *   *Case 2: The Impostor.* Someone answers to Name A, but is actually Person B.
          *   Millian: Name A refers to the impostor (causal chain) or fails?
          *   Fregean: Name A has a sense "the person answering to A" which fails to match Person B.
      *   *Case 3: The True Name Magic.* Speaking the name dissolves power.
          *   Millian: The sound triggers the effect (causal).
          *   Fregean: Knowing the *sense* grants power over the essence.

  7.  **Drafting Section 5: The Verbal Dispute:**
      *   This is crucial. Often, Millians and Fregeans agree on the phenomena (people learn things from identity statements) but disagree on whether to call that "meaning" or "cognitive significance."
      *   If Millian says "Meaning = Reference" and Fregean says "Meaning = Reference + Sense," they might just be carving up the word "Meaning" differently.
      *   *Agreement:* We agree on the *data* (the reader feels surprise). We disagree on the *label* (Semantic vs. Pragmatic).

  8.  **Review and Refine:**
      *   *Tone:* Formal, collaborative, respectful, slightly academic but accessible to a novelist.
      *   *Constraint Check:* Did I cover the fictional names issue? Yes. Did I cover the substitution failure? Yes. Did I cover the reveal verdict? Yes.
      *   *Specific Prompt Detail:* "One name in narrative, one in memories." Ensure this is reflected in the cases.
      *   *Specific Prompt Detail:* "Indulge me... merely verbal." Make sure this section is distinct and conciliatory.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make the Millian concede on fiction.
      *   *Correction:* No, Millians have robust theories of fiction (pretense theory, abstract artifacts). Keep the disagreement sharp but fair.
      *   *Initial thought:* Focus heavily on Kripke.
      *   *Correction:* Keep it focused on the *novel's* needs. The philosophy serves the art.
      *   *Check:* Ensure the "Verbal Dispute" section doesn't insult them. It should frame it as a terminological choice, not a mistake.

  10. **Final Polish:** Check formatting (numbered lists, tables, clear headings). Ensure the voice sounds like a mediated document. (Proceed to generate output).

  *(Self-Correction on "Empty Names"):* Millians have a hard time with empty names. If a name has no referent, it has no meaning. Fregeans say it has sense. In fiction, *no* names refer to concrete objects. So a Millian must treat fiction as special (pretense) or refer to abstract characters. A Fregean can treat fiction as standard sense-without-reference. This is a key divergence to highlight.

  *(Self-Correction on "The Reveal"):* The Millian says the sentence is uninformative *semantically* but the *context* makes it informative. The Fregean says the sentence *is* informative. This needs to be clear in the Disagreements Table.

  *(Final check on Cruxes):* Make sure the "Test" predicts different outcomes or interpretations that could theoretically be resolved. Since this is philosophy, "resolution" is often theoretical, but for the novelist, the resolution is "which theory helps me write better?" I will frame the tests as "interpretive predictions."

