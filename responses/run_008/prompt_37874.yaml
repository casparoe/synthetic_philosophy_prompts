      *   *Correction on Move 2:* Is Jonas "Right" or "Partly Right"? He is technically right. The Aggregation Theorem *alone* does not yield classical utilitarianism. It yields weighted utilitarianism with arbitrary weights. I will rate him "Right."
      *   *Correction on Move 4:* The coin flip example is the "Diamond Critique." Harsanyi's system *does* rank them equally. Jonas says this is a bug; Marta implies it's a feature of the currency. Jonas is right that the framework is blind to it. Marta is right that the framework *says* they are equal. Jonas's claim is normative (it *should* see a difference). I need to be careful not to validate the norm, but validate the diagnosis of the theorem. Jonas is right about what the theorem does/doesn't see.

  8.  **Final Polish:** Check against the prompt's request for "what both are missing."
      *   Missing: The distinction between the Aggregation Theorem (1955) and the Impartial Observer Theorem (1953/55). They treat them slightly interchangeably in the flow, though Marta distinguishes them.
      *   Missing: The informational basis. The debate assumes utilities are given. The hard part is measuring them.
      *   Missing: The "Extended Preferences" development in Harsanyi's later work which tries to solve the ICU problem Jonas raises.

      *   *Own View:* Needs to be clear. It establishes a conditional necessity, not an unconditional truth.

  9.  **Final Review of the Output Structure:**
