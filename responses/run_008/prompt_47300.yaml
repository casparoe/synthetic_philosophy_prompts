answer: |-
  Hey, I put together that decision tree we talked about for the reading group. I started from the one thing we both agree on, which is causal closure at the hardware level, meaning every physical event has a sufficient physical cause. The goal is to see where we stand on whether software states also get to be causes without violating that closure. I kept it to five questions so we can get through it in an hour, and I made sure each one hinges on a concrete case from our work rather than abstract definitions.

  The first question asks you to look at Case 4, where you intervene at the software level to flip the null check and the outage vanishes. You need to decide if that counterfactual dependence is enough to call the null check a cause, or if causation requires physical production like electrons moving. If you say yes, that difference-making is enough for causation, you move to the second question. If you say no, that only physical production counts as causation, you skip to the fourth question.

  The second question is for those who said yes to the first, and it asks you to look at Case 5, where one section of the postmortem blames the null check and another blames the machine state. You have to decide if having both as causes creates an unacceptable overdetermination where the effect has two sufficient causes, or if they can coexist without competing. If you say they compete and one must give way, you land on the Reduction or Identity leaf, which says the software cause is just the physical cause described differently. If you say they can coexist compatibly, you move to the third question.

  The third question asks you to look at Case 2, where the same program is ported between radically different machines so they share no physical state but remain in the same software state. You need to decide if the bug that survives the port is doing real causal work in both systems, or if it is just a label we paste on a coincidence of physical events. If you say the software state does real causal work across different hardware, you land on the Realization-based Non-reductive Physicalism leaf. If you say the software state is just a label and the causation is purely about the intervention model itself, you land on the Interventionist leaf.

  The fourth question is for those who said no to the first question, meaning you think only physical production counts as causation. It asks you to look at Case 3, the distributed deadlock where no single machine misbehaves, and decides whether saying the deadlock explains the outage can be true even if the deadlock did not cause the outage. If you say explanation and causation can come apart, you move to the fifth question. If you say explanation requires causation, you land on the Fictionalism leaf, where software states are useful fictions that help us navigate the system but do not exist in the causal structure.

  The fifth question asks you to look at Case 1, the missing null check sentence in the postmortem, and decide if that sentence is literally true because the software event is identical to a physical event, or if it is false but harmless because the software state is real but causally inert. If you say it is literally true because the events are identical under different descriptions, you land on the Davidsonian leaf, often called Anomalous Monism. If you say it is false because the software state exists but lacks causal power, you land on the Epiphenomenalism leaf.

  Regarding the positions we mapped out, you have Reduction, Non-reductive Physicalism, Interventionism, Davidsonian Anomalous Monism, Epiphenomenalism, and Fictionalism. There is one combination in the logical space that nobody seems to occupy, which is answering yes to the second question about competition but insisting both are distinct real causes. This would be a robust Overdetermination view, and it is likely unoccupied because it is unattractive to engineers who hate redundancy and philosophers who hate violating closure. There is also a pair of leaves this tree cannot really separate in practice, which are the Davidsonian view and the Reduction view. Both end up treating the postmortem sentence as literally true because the software event is the physical event. The only case that might pull them apart is Case 2, because Reductionists struggle to explain how the same cause exists across different physical substrates without appealing to the multiple realizability that Davidsonists handle by denying strict laws at the software level.

  I think this covers the requirements you listed, including the split between explanation and causation, the difference between producers and difference-makers, and the honest treatment of multiple realizability. It should fit on your phone screen without any weird formatting breaking the wiki renderer. Let me know if you want to tweak any of the cases before we send this out to the group.
