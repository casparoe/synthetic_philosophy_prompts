  1. Our certified technicians will perform a non-invasive scan to locate your selfhood. If no central homunculus is discovered during the initial inspection, this shall not constitute a breach of contract or grounds for refund.
  2. Clients acknowledge that since a center of gravity may shift position without any corresponding physical displacement of the underlying substrate, transport fees are billed for the conceptual relocation rather than physical mileage.
  3. In cases where a client's personal narratives begin orbiting more than one attractor, causing the center to split like a binary star, additional charges will apply per distinct protagonist rather than per physical body.
  4. We offer a full guarantee on the integrity of your identity, though this warranty is valid only insofar as the identity itself remains a useful fiction within your current predictive model.
  5. While the main character of your autobiography is transported to the new location, the brain doing the storytelling remains at the origin, requiring the client to successfully narrate themselves into the new place upon arrival.
