answer: |-
  This is a classic "philosophical hangover" situation, compounded by high-stakes professional exposure. You have a hybrid view that is philosophically interesting but vulnerable on both flanks: the empirical flank (economists/policy) and the theoretical flank (population ethicists).

  Here is your battle plan for the Q&A.

  ### Part 1: The Strategic Concession (Do this in your closing remarks or first answer)

  You suspect you should concede something to Dev regarding the **Fragility Premise**. You are correct. If you dig in on "identities are totally different over centuries," the economists will eat you alive on empirical grounds, and the philosophers will say you're building a mountain out of a molehill.

  **The Concession:**
  "Let's grant that over short time horizons, or with robust social structures, identity is less fragile than the 'butterfly effect' version of the Nonidentity Problem suggests. Many of the same people will exist under both policies. However, my claim is not that the Nonidentity Problem is *empirically universal*, but that it is *structurally decisive*. If a moral theory's verdict on depletion flips based on the chaotic metaphysics of conception timing, that theory is unstable. We need a principle that condemns depletion regardless of whether the future victims are numerically identical to the counterfactual ones. So, even if Dev is right that *some* people are harmed in the standard sense, that doesn't rescue the Person-Affecting View as a *foundational* account of intergenerational justice."

  **Why this works:** It disarms the empirical critics (you agree with them) while preserving the philosophical stakes (the principle still needs to hold).

  ---

  ### Part 2: The Q&A Gauntlet

  Here are the objections, ordered by who is likely to jump in first.

  #### 1. The Economist / Policy Wonk
  **The Question:** "Look, I model intergenerational cost-benefit analyses. If you're conceding that identity fragility is overstated, then for the vast majority of my time horizon, I *am* dealing with specific future people who will be worse off. So why should I adopt these 'impersonal principles' which are unquantifiable? Why not just treat them as harmed persons, apply a standard discount rate, and be done with it? This sounds like you're complicating the model for no practical gain."

  *   **Damage:** **Medium.** They think you're creating work for them.
  *   **The 2-Minute Reply:** "Because relying on harm to specific people leaves you vulnerable to the very uncertainty you try to model. If your model assumes specific victims, but the Nonidentity Problem holds even for 10% of the population (due to migration, lifestyle changes caused by the policy, etc.), your cost-benefit analysis technically fails for that 10%. More importantly, impersonal principles allow you to value the *state of the world* (e.g., a stable climate) independently of the specific heads counting it. In practice, you should model this as a 'risk-weighted' loss to a representative agent. That functions *like* an impersonal principle. So, practically, you can keep your models, but philosophically, justify them as valuing welfare states, not just specific victim compensation."
  *   **The Soft Spot:** You are asking them to essentially ignore the discount rate logic they live by. They know that "valuing a state of the world" often leads to infinite demands on the present.
  *   **Preparation:** Be ready to say, "I am not asking you to change your discount rate, but to recognize that the *justification* for that rate shouldn't depend on whether a specific fetus in 2150 gets conceived."

  #### 2. The Person-Affecting Defender (Dev's Ghost)
  **The Question:** "You've conceded that identity isn't that fragile. If the same people exist and are worse off, the Person-Affecting View (PAV) says the act is wrong. If different people exist but have good lives, PAV says it's permissible. You want to say it's wrong in *both* cases. But if the empirical reality is mostly the first case, haven't you just solved the problem by dissolving the Nonidentity case? Why do we need new principles?"

  *   **Damage:** **High.** This attacks the necessity of your thesis.
  *   **The 2-Minute Reply:** "Because morality shouldn't be a lottery. Imagine two communities: one where depletion changes conception timing (Different People), one where it doesn't (Same People). Intuitively, the wrongness of destroying the environment is the *same* in both cases. If we use PAV, the first case is permissible and the second is wrong. That means the moral status of my policy depends on the sexual habits of future strangers. That's absurd. We need a principle that captures the intuition that *depletion is wrong* regardless of the metaphysical accident of who exists. PAV gets the right answer in the 'Same People' case for the wrong reason."
  *   **The Soft Spot:** You are prioritizing theoretical elegance over metaphysical accuracy. A hardline PAV defender will say, "Actually, it *is* permissible in the Different People case if their lives are worth living. Your intuition is biased."
  *   **Preparation:** Stand firm on the "Moral Lottery" argument. It's your strongest intuitive lever.

  #### 3. The Harman-Style Modal Moralist
  **The Question:** "You're dismissing the status of merely possible people too quickly. Under the depletion policy, the people who *would* have existed under conservation (and had better lives) are never born. Why isn't the wrongness located in the comparison between the actual people and the *possible* people who were excluded? Can't we say the possible people are worse off (non-existence vs. good life) without buying into full impersonalism?"

  *   **Damage:** **Medium-High.** This is a sophisticated way to save PAV.
  *   **The 2-Minute Reply:** "Because 'non-existence' isn't a state of being worse off. To say someone is 'worse off' implies a subject for whom things are worse. A merely possible person has no welfare level to compare. If we say they are 'harmed by not existing,' we run into the asymmetry problem: are we obligated to bring into existence every happy child possible? If not, why does the comparison work for depletion but not for procreation? I want to avoid that metaphysical quagmire. It's cleaner to say the *actual* world is worse, not that the *possible* people are harmed."
  *   **The Soft Spot:** You are begging the question against the "Comparativist" view of harm.
  *   **Preparation:** Acknowledge Harman's work respectfully but insist that grounding obligations in the interests of non-existents creates more problems (the obligation to procreate) than it solves.

  #### 4. The Nightmare Question (The Parfit Head)
  **The Question:** "Okay, you want impersonal principles to avoid the Nonidentity Problem. You also say you want to avoid the Repugnant Conclusion. Parfit showed these are incredibly hard to reconcile. If you value the 'state of the world' impersonally, don't you have to accept that a massive population with barely worth-living lives is better than a small, happy one (Total Utilitarianism)? Or if you use Average Utilitarianism, aren't you committed to killing unhappy people? **What is your principle, specifically, and show us the math where it doesn't lead to the Repugnant Conclusion.**"

  *   **Damage:** **Critical.** This is the one you hand-waved. If you fumble this, you lose the philosophers.
  *   **The 2-Minute Reply:** "That is the central challenge of population ethics, and I don't claim to have solved it in this talk. However, I am not committed to Total Utilitarianism. I am advocating for a **Sufficientarian Impersonal Principle**. The wrongness of depletion isn't that it lowers the *total* sum of utility, but that it brings people below a threshold of sufficiency who would otherwise be above it. We can condemn depletion for creating lives below a decent threshold without committing to the claim that we must maximize the number of lives above that threshold. This blocks the Repugnant Conclusion because adding more 'barely worth living' lives doesn't compensate for dropping existing lives below sufficiency."
  *   **The Soft Spot:** Sufficientarianism has its own problems (the "Shallowing" objection—why is the threshold sharp?). Also, Parfit discussed this (Theory Q) and found issues.
  *   **Preparation:** Do not try to solve RC. Frame your talk as solving the *Nonidentity Problem* specifically, using a principle that is *compatible* with avoiding RC, even if it doesn't solve all of population ethics. Say: "My goal is to solve the intergenerational justice case, not the entire metaphysics of value."

  #### 5. The Blind Spot Objection (The "Shape" Critic)
  **The Question:** "You argued that a theory whose verdicts track *which* people exist has the 'wrong shape.' But isn't the whole point of morality that it's about *people*? If you move to impersonal principles, aren't you turning morality into aesthetics? We don't say a landscape is 'wrong' if it's ugly, we say it's suboptimal. Are you really claiming that depleting resources is 'suboptimal' rather than 'unjust'? If there's no victim, who is the injustice *to*?"

  *   **Damage:** **High.** This attacks the core moral intuition of your view.
  *   **The 2-Minute Reply:** "It's a category error to think injustice requires a specific victim. We recognize 'historical injustices' where the specific victims are dead or unidentifiable, yet the injustice remains. The 'injustice' is in the violation of a duty to maintain just conditions for whoever ends up occupying that space. Think of it like a trust fund. If I squander a trust fund intended for 'my heirs,' it doesn't matter if the specific heir changes due to birth timing. The violation is against the *institution* of intergenerational transfer, not just the individual. It is unjust because it violates the terms of fair cooperation across time."
  *   **The Soft Spot:** "Fair cooperation" usually implies identifiable cooperators.
  *   **Preparation:** Lean on the "Institutional" analogy. It resonates with policy people and philosophers alike.

  ---

  ### Part 3: How to Stop Losing to Dev

  You asked for this, and while it's out of scope for the talk, it's in scope for your sanity.

  You are losing arguments to Dev because you are arguing to **find the truth**, while Dev is arguing to **find the flaw**.
  *   **You:** "Here is a coherent picture of how the world works."
  *   **Dev:** "Here is a crack in that picture."

  In philosophy, the person pointing out the crack usually looks smarter in the moment, even if the building stands.
  1.  **Stop defending the whole house.** When Dev attacks the fragility premise, don't defend the fragility premise. Say, "Grant that. Does the building fall?" (This is what you're doing in the talk. Good.)
  2.  **Steel-man less, pin-down more.** You probably spend too much time articulating his view better than he does (a philosopher's vice). Force him to commit. "If identity isn't fragile, are you saying depletion is *permissible* if we change the timeline enough? Yes or No?"
  3.  **Accept the "Half-Convert."** You said you half-converted each other. That's a win. Most philosophical arguments end in stalemate. If you moved his needle and he moved yours, you didn't lose. You did philosophy.

  **Good luck at the workshop.** Own the hand-wave on the Repugnant Conclusion. Everyone else is hand-waving too; they're just louder about it.
