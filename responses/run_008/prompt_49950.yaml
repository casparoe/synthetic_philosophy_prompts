answer: |-
  You are right to be suspicious, and you are right to feel that the argument proves too much. Your friend has constructed a sophisticated-sounding sophism that conflates the **stability of reference** with the **stability of truth**.

  The good news is that you can keep the Kripkean package (rigid designators, the necessary a posteriori) without accepting this modal trivialism. In fact, Saul Kripke himself explicitly argues against the conclusion your friend has reached in *Naming and Necessity*. Kripke uses rigid designation precisely to explain *how* "Aristotle was a philosopher" is contingent, not to prove it is necessary.

  Here is the diagnosis of where the argument goes wrong, why the *Hesperus* analogy fails, and what you need to hold onto to keep your modal intuitions intact.

  ### The Location of the Slip: Step (5)

  The error occurs in the inference from **(3) and (4) to (5)**.

  > (3) ...Where the denotations do not vary from world to world, what the sentence says does not vary either.
  > (4) In the actual world the sentence is true...
  > (5) Since by (3) the sentence says the same thing in every world, and by (4) what it says is true, the sentence is true in every possible world.

  This is a non-sequitur. It relies on an equivocation about what "what the sentence says" (the proposition) is and how truth applies to it.

  1.  **Proposition Identity vs. Truth Value:** It is true that the *proposition* expressed by "Aristotle is a philosopher" is the same in every possible world (assuming rigid designators for both names and properties). Let's call this proposition $p$. $p$ is the complex content $\langle \text{Aristotle}, \text{the property of being a philosopher} \rangle$.
  2.  **Truth is World-Relative:** However, propositions are not true *simpliciter*; they are true *at a world*. Step (4) establishes that $p$ is true *at the actual world*. Step (5) illicitly infers that because $p$ is the *same proposition* at a counterfactual world, it must have the *same truth value* at that world.
  3.  **The Mathematical Analogy:** Think of a proposition as a function from possible worlds to truth values.
      *   The *function* is constant (the denotations don't change).
      *   The *input* changes (we are evaluating the function at World $A$ vs. World $B$).
      *   There is no reason to think the *output* (Truth/Falsehood) must be the same just because the function is the same.
      *   Your friend is arguing: "The function $f$ is the same in every case. $f(\text{Actual}) = \text{True}$. Therefore, $f(\text{Counterfactual}) = \text{True}$." This is obviously false unless $f$ is a constant function.

  The slip is assuming that because the *constituents* of the fact are rigid, the *fact itself* is necessary. But facts are constituted by objects instantiating properties. While the object (Aristotle) and the property (Philosophy) are constant across worlds, the **instantiation relation** is not.

  ### The Principled Distinction: Identity vs. Predication

  You asked for a principled distinction between this case and *Hesperus is Phosphorus*, rather than an ad hoc exception. The distinction lies in the **logical form of the predicate**.

  **1. The Hesperus Case (Identity):**
  *   **Sentence:** "Hesperus is Phosphorus."
  *   **Logical Form:** $a = b$.
  *   **Semantics:** If $a$ and $b$ are rigid designators, they pick out object $x$ in every world.
  *   **Truth Condition:** The sentence is true at world $w$ iff the object denoted by $a$ at $w$ is identical to the object denoted by $b$ at $w$.
  *   **Necessity:** Since $x$ is identical to $x$ in every world (by the logic of identity), and the terms pick out $x$ in every world, the statement is true in every world. **Identity is a necessary relation.**

  **2. The Aristotle Case (Predication):**
  *   **Sentence:** "Aristotle is a philosopher."
  *   **Logical Form:** $Fa$.
  *   **Semantics:** 'Aristotle' picks out object $x$. 'Is a philosopher' picks out property $P$.
  *   **Truth Condition:** The sentence is true at world $w$ iff object $x$ is in the **extension** of property $P$ at world $w$.
  *   **Contingency:** While $x$ and $P$ are the same entities in every world, the *extension* of $P$ (the set of things that are philosophers) varies from world to world. In the actual world, $x \in Ext(P)$. In a counterfactual world, $x \notin Ext(P)$. **Property instantiation is a contingent relation.**

  Your friend's argument works for *Hesperus* because the predicate (identity) guarantees that if the objects are the same, the truth holds necessarily. It fails for *Aristotle* because the predicate (philosophy) does not guarantee that the object must fall under it in every world.

  ### Addressing the "Necessary A Posteriori" Defense

  Your friend claims your intuition of contingency is an "epistemic illusion" similar to the *Hesperus* case. This is a misapplication of Kripke's lesson.

  *   **Kripke's Lesson:** We can discover necessary truths through empirical investigation (e.g., discovering that Hesperus *is* Phosphorus). The "surprise" is epistemic, not modal.
  *   **The Limit:** Kripke never claimed that *all* a posteriori truths are necessary. He distinguished between:
      1.  **Necessary A Posteriori:** Identity statements, theoretical identities (Water = H2O).
      2.  **Contingent A Posteriori:** Ordinary predications (Aristotle was a philosopher, I missed the bus).

  When Kripke discusses Aristotle, he explicitly says: "It is possible that Aristotle should not have done any of the things we commonly associate with his name." He uses rigid designation to ensure that when we say "Aristotle might not have been a philosopher," we are talking about *that very man* lacking the property, not a different man. Rigid designation is the tool that **preserves contingency**, not the tool that eliminates it.

  If your friend's argument were correct, rigid designation would make all predication necessary. But Kripke introduced rigid designation to solve puzzles about *how* we refer to the same object across counterfactual situations where it has different properties. The whole point is to make sense of the claim: "This man (Aristotle) might not have been a philosopher."

  ### What Rejecting Step (5) Costs You

  Rejecting the move from (3)/(4) to (5) costs you nothing within the Kripkean framework. In fact, it is required by it.

  *   **You keep Rigid Designators:** Names still pick out the same object in every world.
  *   **You keep the Necessary A Posteriori:** Identity statements like "Hesperus is Phosphorus" remain necessary a posteriori.
  *   **You save Contingency:** You acknowledge that while the *terms* are stable, the *worlds* differ in how objects are arranged and what properties they instantiate.

  ### How to Reply to Your Friend

  You can summarize the rebuttal this way:

  1.  **Concede (1) and (2):** Grant that names and properties are rigid designators (the same object/property is in play in every world).
  2.  **Challenge (5):** Point out that the truth of a subject-predicate sentence depends on whether the object falls into the **extension** of the property at that world.
  3.  **The Extension Point:** "You are conflating the *property* with the *extension of the property*. The property 'being a philosopher' is the same abstract object in every world. But the set of individuals who instantiate that property changes from world to world. Aristotle is in that set here, but not there. Rigid designation ensures we are talking about Aristotle in both places; it does not force him to be in the set in both places."
  4.  **The Hesperus Distinction:** "Your analogy fails because 'is identical to' is a necessary relation, whereas 'is a philosopher' is a contingent one. In the Hesperus case, the semantics of identity force the truth value to be constant. In the Aristotle case, the semantics of predication allow the truth value to vary. Kripke's 'necessary a posteriori' applies to the former, not the latter."

  Your friend has taken a semantic thesis (terms refer rigidly) and turned it into a modal thesis (facts are necessary). The bridge between them is broken. You can rest easy: Aristotle could have gone into the family business, and Kripke would be the first to agree.
