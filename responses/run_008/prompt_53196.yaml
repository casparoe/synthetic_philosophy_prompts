answer: |-
  The configuration you are describing is not only recognized in philosophy; it is one of the central problems of modern moral philosophy. You have described it with a precision that rivals the academic literature.

  The primary term you are looking for is **Agent-Regret**.

  The supporting concept that explains why the feeling is "fitting" rather than a mistake is **Moral Remainder** (sometimes called Moral Residue).

  These concepts were most rigorously developed by the philosopher **Bernard Williams**, particularly in his essays *Moral Luck* (1981) and *Ethics and the Limits of Philosophy* (1985), and further expanded by **Martha Nussbaum** in *The Fragility of Goodness*.

  Here is the breakdown of the concept, its edges, and how to apply it to your characters.

  ### 1. The Core Concept: Agent-Regret
  Standard regret is what anyone feels when a bad thing happens ("I regret that he died"). **Agent-Regret** is a specific species of regret that can *only* be felt by the person whose action (or inaction) brought about the event, even if the action was justified, blameless, or necessary.

  *   **Why it fits your characters:** It captures the "stain." A bystander feels sadness; the agent feels Agent-Regret. It acknowledges causal involvement without admitting moral fault.
  *   **The "Guilt" Nuance:** Philosophers often hesitate to call this "guilt" because guilt implies blame or wrongdoing. However, in fiction, "guilt" is often the correct *phenomenological* word for what the character feels. The philosophy validates that this feeling is rational, even if "guilt" suggests transgression. The character feels guilt *as if* they had done wrong, because they *did* do the act, even if the act was right.

  ### 2. The Justification: Moral Remainder
  You asked why the text must treat this stain as "fitting." If the decision was right, why does the guilt persist?

  The theory of **Moral Remainder** argues that in tragic dilemmas, moral obligations are not cancelled when they are overridden; they are merely outweighed.
  *   **The Mother:** She has an obligation to Son A and an obligation to Son B. She cannot fulfill both. She fulfills one (by saving the older, perhaps, or simply by engaging with the choice). The obligation to the younger son is overridden, but it is not erased. It remains as a "debt" or "remainder."
  *   **The Feeling:** The lingering guilt is the emotional recognition of that unpaid debt. It is the psyche acknowledging that a moral value was violated, even if violating it was the only way to preserve a higher value.

  ### 3. The Edges: Where the Concept Applies (and Where It Doesn't)
  To use this strictly scene-by-scene, you need to know the boundaries. Here is the litmus test for whether a character carries this specific stain.

  **A. The Agency Requirement (The Doctor vs. The Machine)**
  *   **Applies:** The Doctor. Even though he follows a rule, he is the *agent* of the application. He must sign the chart, turn the valve, or speak the words. He is the locus of the action.
  *   **Does Not Apply:** If the triage were decided by a random lottery machine, and the doctor merely watched, he would feel sorrow, but not Agent-Regret. He would not carry the stain. The stain requires that the character's *will* was the mechanism of the outcome.
  *   **Edge Case:** If the doctor follows the rule but feels *relief* that he didn't have to choose, he does not fit this configuration. To fit, he must acknowledge that *he* sent the man to his death, even if the rule compelled it.

  **B. The Knowledge Requirement (The Illusion Test)**
  *   **Applies:** The character knows they did the "right" thing. They are not confused. They do not believe they made a moral error.
  *   **Does Not Apply:** If the character believes they made a *mistake* (e.g., "I should have hidden the boys better"), that is standard guilt/remorse, not Agent-Regret. If they feel the conflict was an illusion (e.g., "God told me which one to pick, so it was His will, not mine"), that dissolves the Agent-Regret. The stain requires the character to accept full authorship of the act.

  **C. The "Dirty Hands" Distinction**
  *   **Applies:** Your characters. They gain no power. They do not violate a moral norm to achieve a political end.
  *   **Does Not Apply:** A politician who orders a torture session to prevent a bombing. This is "Dirty Hands." The politician accepts they have done *wrong* to do *good*. Your characters have done the *only right thing*, yet still feel the stain.
  *   **The Edge:** If your character starts to believe their suffering makes them "special" or "saintly," they have slipped out of Agent-Regret and into self-aggrandizement. The stain must remain a burden, not a badge.

  **D. The Outcome Distinction**
  *   **Applies:** The feeling is about the *action*, not just the result.
  *   **Does Not Apply:** "Outcome Regret." If a doctor saves a patient who later dies of an unrelated cause, the doctor might regret the outcome, but that is not this stain. The stain requires that the character's *necessary choice* was the direct cause of the loss.

  ### 4. Addressing Your Specific Questions

  **"Does it extend to the doctor... or only to the mother?"**
  It extends to both. The mother exercises agency in the selection; the doctor exercises agency in the *enactment* of the rule. In both cases, the world changed (a boy died, a man died) *through* them. If you removed their agency, the death might still have happened, but the *moral texture* of the death would be different. The stain belongs to the person through whom the tragedy was actualized.

  **"Is it the same thing as regretting a bad outcome one caused?"**
  No. This is the crucial edge.
  *   **Outcome Regret:** "I wish he hadn't died." (A bystander can feel this).
  *   **Agent-Regret:** "I wish *I* had not been the one who had to let him die." (Only the agent feels this).
  *   **Test:** If you can swap the character with another person in the same role and the feeling remains exactly the same, it is Outcome Regret. If the feeling is tied specifically to *their* involvement ("It matters that it was *my* hand on the lever"), it is Agent-Regret.

  **"If philosophy has no single term... coin one."**
  Since philosophy *does* have terms (**Agent-Regret** and **Moral Remainder**), you have a rigorous vocabulary to work with. However, for your internal workflow as a novelist, these terms are dry.

  If you require a single literary term to keep on a sticky note while writing, I propose you adopt the term **"The Innocent Stain."**

  **Definition for your use:**
  > **The Innocent Stain:** A lingering affective residue carried by an agent who has performed a morally necessary action that nevertheless required the violation of a significant moral obligation.
  >
  > **Criteria:**
  > 1.  **Necessity:** The action was the only viable path (no true alternative).
  > 2.  **Agency:** The character was the active instrument of the outcome (not a passive observer).
  > 3.  **Validity:** The feeling is not a symptom of error or trauma; it is a fitting acknowledgment of the moral cost paid.
  > 4.  **Non-Instrumental:** The character gains no advantage from the action (distinguishing from "Dirty Hands").

  ### 5. Why the "Illusion" Theory is Wrong (and why you are right)
  You mentioned reading that some philosophers believe moral conflict is an illusion (that one duty always outweighs the other, so there is no real dilemma). Bernard Williams famously dismantled this. He argued that systems (like Utilitarianism or Kantianism) that try to resolve all dilemmas into a single calculus are lying about the human experience.

  Williams argued that if a moral system tells you that you should feel *nothing* after making the right choice in a tragic dilemma, **the system is wrong, not your feelings.** The "stain" is proof of your moral seriousness. To feel nothing would be to treat the lost son or the triaged patient as a mere number. The pain is the tribute paid to the value of the life lost.

  ### Summary for Your Manuscript
  *   **The Term:** Agent-Regret (supported by Moral Remainder).
  *   **The Edge:** It applies only where the character acknowledges their own agency in a necessary tragedy.
  *   **The Doctor:** He qualifies because he enacted the rule.
  *   **The Feeling:** It is not a mistake. It is the cost of being a moral agent in an imperfect world.
  *   **Writing Tip:** When writing these scenes, avoid having the character ask "Did I do wrong?" (They didn't). Instead, have them grapple with "I did right, and it destroyed me." That is the specific frequency of the Innocent Stain.
