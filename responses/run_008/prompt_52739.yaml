answer: |-
  The Everettian decision-theoretic program survives technical scrutiny but risks empirical vacuity if the confirmation problem cannot be solved without presupposing the Born rule, making the neutrality of its rationality axioms the most serious vulnerability while rendering complaints about branch counting or outcome uniqueness as mere single-world prejudice.

  Ranked from most damaging to least, the defeaters are as follows. The most serious threat is the **empirical confirmation problem** (raised by Greaves, Myrvold, and Kent): if every outcome occurs, evidence cannot logically favor Everettian quantum mechanics (EQM) over collapse theories unless one already assumes the Born rule to weight the evidence. Wallace concedes this is the hardest hurdle, acknowledging that standard Bayesian confirmation fails without modification, but he dismisses the idea that it is fatal, arguing that agents can update on self-locating information using Born weights as likelihoods without circularity. Close behind is the **charge of axiomatic circularity** (pressed by Kent, Price, and Morrison): critics argue that Deutsch–Wallace axioms like "Diachronic Consistency" or "Branching Indifference" secretly smuggle in probabilistic notions, rendering the derivation of the Born rule question-begging. Wallace dismisses this as a category error, insisting the axioms are purely non-probabilistic constraints on rational preference across a fissioning identity, though he concedes that motivating them requires accepting a functionalist view of rationality that single-world intuitions resist. The third tier involves **branch individuation**: if decoherence only defines branches approximately, the squared-amplitude measure may be ill-defined, undermining the precise derivation of the Born rule. Wallace concedes branches are vague emergent structures rather than fundamental entities but argues this vagueness is no worse than that of classical macro-objects and does not undermine the robustness of the measure. The least damaging objections are **intuitions about decision theory**: the claim that decision theory is useless when outcomes cannot be avoided, or that caring about successors by amplitude is arbitrary. Wallace dismisses these outright as single-world prejudice, arguing that rationality is about organizing preferences over future states regardless of whether those states are determined by chance or branching.

  Regarding your final verdict on unfalsifiability: the position has been qualified to the very edge of unfalsifiability, but this is not necessarily a defect given the nature of the claim. If the program succeeds as a formal derivation, it shows that rational agents *must* act as if the theory were stochastic, meaning any observed deviation from the Born rule would constitute evidence of irrationality or a breakdown of the decoherence conditions rather than a falsification of the quantum formalism itself. This shifts the empirical risk from the theory's truth to the stability of the branch structure, which critics argue insulates the theory from refutation because any anomalous data can be accommodated as a "low-weight branch experience." However, Wallace would argue this is not unfalsifiability but a correction of what falsification means in a deterministic multiverse: the theory is falsifiable if the unitary dynamics fail, but not by the occurrence of unlikely outcomes, since "unlikely" is redefined as "low measure" rather than "impossible." Whether this is a defect depends on whether one demands a physical theory rule out outcomes physically or merely rationally; if the latter suffices for empirical adequacy, the qualification is a feature, but if the former is required for scientific status, the program risks collapsing into a metaphysical stance immune to evidence.
