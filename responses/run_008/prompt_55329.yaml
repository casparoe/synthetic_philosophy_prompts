  3. The tetralemma asserts that querying whether a dependent object exists or not throws a type error, because the boolean schema presupposes intrinsic values that the system does not contain.
  4. The two truths distinguish between the conventional layer where the code executes successfully and produces output, and the ultimate layer where analysis reveals no function has independent ownership of its return value.
  5. Your gloss renders emptiness of emptiness trivially true by structural definition, whereas Nāgārjuna requires it as a non-trivial safeguard against treating emptiness as a new absolute type. The residue shows your vocabulary is missing a concept for pragmatic utility without ontological grounding, mistakenly framing liberation as a stack overflow rather than a correct handling of references.
