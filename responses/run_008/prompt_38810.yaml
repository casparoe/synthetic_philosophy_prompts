answer: |-
  Anya sits on a corporate hiring panel where she quietly weights "alma mater affinity" heavily, selecting a grad from her own university over a statistically stronger candidate from a state school, rationalizing it as "team cohesion" despite internal data showing no performance correlation. Boris serves as treasurer for his local Parent-Teacher Association, directing a surplus fund toward buying specialized equipment for his own child's fifth-grade classroom rather than distributing it evenly across the grade or donating it to a underfunded district nearby, justifying it as "knowing exactly where the need is" despite data showing other classrooms have higher poverty rates. Both act on identical psychological machinery—prioritizing a circle of affinity over impartial maximization—and both resist statistical counter-evidence with the same affective warmth toward their chosen beneficiaries, yet our intuition screams "nepotism" for Anya and "parental love" for Boris.

  ### Analysis of Demarcation Tests

  **1. The Reflective Endorsement Test**
  *Question:* Is the disposition one you'd keep after cool, idealized reflection?
  *Verdict:* **Separates.**
  When we ask society to reflect ideally, we endorse Boris's disposition as a constitutive part of the "good life" (parental partiality is a recognized special obligation) but reject Anya's as a corruption of professional meritocracy. However, this separation relies entirely on the pre-loaded social scripts imported into the "reflection." If the reflection is stripped of social convention and asks only about the psychological state, both agents reflectively endorse their own actions as coherent with their personal projects. The test separates them only because we smuggle in institutional norms as "moral facts."

  **2. The Tracking Test**
  *Question:* Does the disposition track morally relevant features (merit/need) or mere proximity/similarity?
  *Verdict:* **Same Verdict (Bias).**
  Structurally, neither disposition tracks the impartial moral features relevant to the resource allocation. Anya does not track *competence* (she ignores the stronger candidate); Boris does not track *need* (he ignores the poorer classrooms). Both track *relationship proximity* (alma mater connection vs. biological child). If "bias" is defined as failing to track the impartial good relevant to the distribution, both fail equally. The mechanism is blind to the outsider's claim in both cases.

  **3. The Full-Information + Empathy Test**
  *Question:* Would the disposition survive knowing everything and feeling for everyone affected?
  *Verdict:* **Same Verdict (Bias).**
  If Anya fully feels the disappointment of the rejected candidate, she likely wouldn't hire the alum. If Boris fully feels the deprivation of the poorer classrooms, he likely wouldn't fund his kid's room. The fact that both *maintain* their choice despite having access to the same statistical evidence suggests both are insulating their decision from full empathetic engagement with the losers. They both curate their empathy to protect their partiality.

  ### The Discriminating Feature
  The only feature doing the work to save Boris from the verdict of "bias" is **Institutional Role Norms**. We permit partiality in the *Family* institution but forbid it in the *Market/Professional* institution. This is not a difference in the moral psychology of the agents, nor a difference in the structural impact on the losers (both lose a resource they might have claimed), but a difference in the social container.

  ### Feature Removed
  If you strip the Institutional Role—e.g., if Anya is hiring a babysitter for her own home (private sphere) or Boris is allocating municipal tax dollars as a city councilor (public sphere)—the intuitions flip or blur completely. Anya becomes a protective parent; Boris becomes a corrupt official. This confirms the moral distinction is not in the act or the mechanism, but in the label attached to the setting.

  ### Deflationist Attack
  A deflationist would argue that the preference/bias distinction is merely **codified tribalism**. We call it "bias" when the in-group favoritism harms *our* preferred institutional outcomes (efficiency, equity) and "preference" when it serves *our* preferred social units (family, nation). There is no metaphysical difference between loving your kid and loving your alma mater; there is only the difference in political power to legitimize the favoritism. The "lab coat" is the institutional role itself, dressing up self-serving psychology as moral duty when convenient.

  ### Own Call
  The distinction does not survive structural scrutiny. While pragmatic reasons exist to regulate family and markets differently, the underlying moral psychology is identical. Calling one "bias" and the other "preference" is a policy choice, not a moral discovery.

