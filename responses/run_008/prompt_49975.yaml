answer: |-
  **Final Exam Question: Ethical Theory (PHI 405)**
  **Time Allowed:** 90 Minutes

  **Question:**
  A persistent objection to Kant's Formula of Universal Law (FUL) is that it is "empty formalism": critics argue that any action can be made to pass or fail the test merely by redescribing the agent's maxim (e.g., changing "I will lie" to "I will lie to save a life"). If the outcome depends on how the maxim is phrased, the universalization procedure appears to merely launder antecedent moral convictions rather than generating moral norms.

  Write an essay evaluating this objection. Your answer must identify the specific principled constraint within Kant's apparatus that fixes the description of a maxim and prevents this "gerrymandering." Furthermore, explain how the **practical-contradiction interpretation** of the test addresses the worry that the **agent's own purposes** are doing the moral work, rather than the rational form of the law itself.

  ***

  **Model Answer**

  The charge that the Formula of Universal Law (FUL) is empty relies on the assumption that maxim description is arbitrary. If an agent can tailor the maxim to ensure a desired outcome, the test is indeed a sham. However, this objection misunderstands the ontological status of a maxim in Kant's system. A maxim is not a public justification offered after the fact; it is the agent's *subjective principle of volition*. The principled constraint that stops "gerrymandering" is fidelity to the agent's actual reason for acting.

  When an agent acts, they act on a specific representation of a law connecting an action to an end. To redescribe the maxim to evade the test is to lie about one's own volition. For example, in the false-promise case, the agent cannot describe their maxim as "I will borrow money I cannot repay to help a friend" if their actual volition is simply "I will get money easily." The constraint is internal: the maxim must accurately reflect the causal link the agent believes exists between their action and their goal. If the description is tailored to pass the test, it ceases to be the maxim *on which the agent acted*, and thus the test is no longer being applied to the action in question.

  This leads to the worry that the agent's purposes are doing the moral work. If the test fails because universalization frustrates the agent's end (e.g., promising becomes impossible if everyone lies), isn't morality reduced to prudential calculation? The practical-contradiction reading resolves this by distinguishing between the *content* of the end and the *form* of the willing.

  On the logical-contradiction reading, universalizing a maxim results in a conceptual incoherence (a world where promises exist but are never kept is contradictory). Critics argue this is too narrow. The practical-contradiction reading suggests that universalizing the maxim makes the *action ineffective* for achieving the agent's purpose. In the false-promise case, if everyone adopted the maxim, the institution of promising would collapse, and the agent could not achieve their end.

  However, this does not mean the *purpose* determines the morality. Rather, the test reveals that the agent is making an exception for themselves. They rely on a practice (promising) that they simultaneously will to destroy through their maxim. The moral work is done not by the purpose itself (which may be neutral or even good), but by the inconsistency in the *will*. The agent wills an end that requires a specific normative environment, yet wills a universal law that destroys that environment. This is a contradiction in the will, not merely a failure of efficiency.

  Therefore, the FUL is not empty. The constraint on maxim description is the requirement of honesty regarding one's subjective principle. The practical-contradiction reading demonstrates that the test does not validate purposes, but rather tests whether the *means* chosen to those purposes can coexist with a rational will that legislates for all. The "work" is done by exposing the agent's reliance on a system of rational cooperation they are unwilling to sustain universally. The test forces the agent to recognize that their capacity to act depends on norms they cannot rationally universalize if they are immoral. Thus, the procedure is not laundering convictions; it is exposing the structural incoherence of making exceptions for oneself.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **A-Range Answer (80-100 Marks)**
  *To achieve an A, the essay must execute the following specific moves:*
  1.  **Identifies the Constraint:** Explicitly states that the constraint on maxim description is **fidelity to the agent's actual subjective principle of volition**. It must argue that "gerrymandering" constitutes a falsehood about *why* the agent is acting, rendering the test inapplicable to the actual action.
  2.  **Handles the "Agent's Purposes" Worry:** Distinguishes between the *end* (which is not the source of morality) and the *consistency of the will*. It must explain that the failure of the test is not that the purpose is frustrated (prudential), but that the agent **makes an exception for themselves** while relying on a practice they undermine.
  3.  **Deploys Practical-Contradiction:** Correctly utilizes the practical-contradiction reading (often associated with Korsgaard) to show how universalization renders the *action ineffective* rather than conceptually impossible. It must link this to the idea that the agent wills the destruction of the conditions necessary for their own action.
  4.  **Synthesis:** Concludes that the "work" is done by the intersection of honest maxim formulation and the structural requirements of a rational will, refuting the "empty formalism" charge.

  **B-Range Answer (60-79 Marks)**
  *A B answer will demonstrate competence but miss key nuances:*
  1.  **General Constraint:** Identifies that maxims shouldn't be gerrymandered but fails to locate the constraint in the **subjective principle of volition**. It may vaguely suggest students "must be honest" without explaining the metaphysical link to volition.
  2.  **Purposes Worry:** Acknowledges the worry that purposes might drive the result but fails to clearly distinguish between **prudential failure** and **volitional inconsistency**. It may imply that the action is wrong *because* it doesn't work, rather than because it involves a contradiction in the will.
  3.  **Practical-Contradiction:** Mentions the practical-contradiction reading but treats it as synonymous with "bad consequences" or fails to explain how it differs from the logical-contradiction reading in a way that saves the test from emptiness.
  4.  **Recitation:** May spend excessive time defining CC vs. CW generally without linking it specifically to the *description of the maxim* problem posed in the prompt.

  **C-Range Answer (50-59 Marks)**
  *   Recites the Formula of Universal Law correctly.
  *   Explains the "empty formalism" objection but offers no robust Kantian defense regarding maxim description.
  *   Fails to address the specific role of the "practical-contradiction" reading or the "agent's purposes" worry as requested.
  *   Argument is disjointed or relies on examples without theoretical analysis.

  **Specific Deductions:**
  *   **-10 Marks:** If the answer claims the *consequences* of the action determine its morality (utilitarian reading of Kant).
  *   **-10 Marks:** If the answer fails to mention the "practical-contradiction" reading explicitly.
  *   **-10 Marks:** If the answer claims the constraint on maxim description comes from external social norms rather than the agent's internal volition.
