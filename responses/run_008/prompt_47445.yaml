      *   *Preferred Reading:* The **Hybrid/Pragmatic** reading. The panel isn't looking for deep metaphysical truth; they are looking for **claim eligibility**. Is there a code? Is there a treatment? Is there a recognized harm? They medicalize what they can pay for and manage, excluding only the truly inevitable (death/aging process) or purely vanity (nose).

