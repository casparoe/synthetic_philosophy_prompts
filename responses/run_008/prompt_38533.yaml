answer: |-
  **The Scenario**
  A night security guard is contracted to patrol a warehouse every hour to prevent theft; his presence is the only active deterrent. He sleeps through his shift (omission). Thieves break in and steal expensive equipment. Investigation later reveals the thieves were former employees with stolen keycards that bypassed the alarm and locks, and they were armed enough to overpower any single guard anyway. Thus, even if the guard had patrolled as required, the thieves would have entered and stolen the goods regardless. However, the warehouse owner and the insurance company still treat the guard's negligence as the cause of the loss, citing the breach of security protocol as the reason the theft succeeded "on their watch," and the guard is fired and held liable for the full value of the stolen items.

  **Analysis**

  **The Omission:** The guard's failure to patrol the warehouse during his shift.

  **The Counterfactual Test:** We ask: "If the guard *had* patrolled, would the theft have been prevented?" In this specific scenario, the answer is **no**. The thieves had keycards (bypassing locks) and weapons (overpowering the guard). The outcome (theft) remains fixed across both the actual world (guard sleeps) and the nearest possible world where he acts (guard patrols). Therefore, the theft does not counterfactually depend on the omission.

  **Why Intuition Says "They Caused It":** Despite the counterfactual failure, we intuitively label the omission as the cause because of **normative salience**. In social and legal contexts, causation is often tied to the violation of a duty that is *normally* effective. The guard's patrol is the designated "cause of safety" in the system's design. When the system fails, we look for the broken component we were responsible for maintaining. The hidden futility (the keycards) is a background condition, while the sleeping guard is the deviant, blameworthy variable. We conflate "causing the risk" with "causing the outcome," or we treat the breach of protocol as the explanatory cause even if it wasn't the physical difference-maker.

  **The Feature Doing the Work:** The key feature is **Explanatory Contextuality**. We select causes based on what is abnormal and culpable within a normative framework, not just physical necessity. The guard's sleeping is the "deviant" event in the story of the warehouse's security, whereas the thieves' keycards are treated as a hidden background fact. Our causal judgment tracks the breach of expectation, not just the physics of the theft.

  **Best Counterfactualist Rescue:** A sophisticated counterfactualist would argue for **Contrastive Causation** or **Default-Relative Counterfactuals**. They would say you are comparing the wrong worlds. The test shouldn't be "If he patrolled, would the theft happen?" but rather "If he patrolled *and the thieves lacked keycards* (the normal condition), would the theft happen?" They argue that hidden futilities (like secret keycards) shouldn't count as fixed background conditions when evaluating the guard's specific duty. Alternatively, they might shift to **Probabilistic Causation**: The omission caused the theft because it raised the *probability* of theft from near-zero to near-one, even if this specific token outcome was overdetermined.
  *Does it work?* Honestly, the Probabilistic rescue is strong. It saves the theory by changing the definition of "cause" from "determined the outcome" to "increased the likelihood." However, if you insist on *token* causation (this specific theft), the counterfactualist struggles unless they allow themselves to "ignore" the hidden keycards in the comparison world, which some critics say is cheating the test.

  **The Ontological Objection (Omissions aren't Events):**
  Your friend's objection stands; this case does not solve it. The scenario shows that we *treat* omissions as causes in our language, law, and moral reasoning (functional role), but it doesn't prove that "not-patrolling" is an ontological *event* in the same way "patrolling" is. It leaves us with a dilemma: either (1) causation doesn't require events (it can be a relation between a fact and an event), or (2) our intuitive judgment in this case is metaphysically mistaken (we blame the guard for the outcome, but strictly speaking, only the thieves caused it). The case highlights the conflict between our *pragmatic* need to assign blame and the *metaphysical* structure of reality, but it doesn't force the "non-event" to become an "event."
