answer: |-
  **Course:** PH204 Collective Reasoning and Formal Epistemology  
  **Term:** Michaelmas 2024  
  **Instructor:** Dr A. Smith  
  **Problem Set 4: Aggregation and the Condorcet Jury Theorem**

  **Instructions:**  
  Answer all three parts. Calculators are permitted. Where exact binomial summation is cumbersome, a normal approximation is acceptable provided you state your method. Attention to the conceptual implications of your calculations is weighted heavily in the marking scheme. British English spelling conventions apply.

  ***

  **Question 1: The Limits of Large Numbers**

  An academic journal employs an editorial board of 25 members. When a submitted paper makes a central empirical claim, the board votes by simple majority to determine whether the claim is true. Assume that, working in isolation, each editor has a probability $p = 0.55$ of judging the claim correctly.

  **(a)** Calculate (or estimate) the probability that the board's majority verdict is correct. Subsequently, determine the approximate number of editors required to raise this probability to 99%. Briefly comment on the relationship between the asymptotic guarantee of the Condorcet Jury Theorem and the practical constraints of real-world committees. [8 marks]

  **(b)** Consider the same board ($N=25, p=0.55$), but now suppose the editors were all doctoral students of the same influential supervisor. Consequently, their errors are positively correlated: if one editor is misled by a specific methodological flaw, others are likely to be misled by it as well. Does the Condorcet guarantee survive this change? Explain *in your own words* precisely how correlation undermines the aggregation of competence. Do not simply state that an assumption has been violated; describe the mechanism by which the group's epistemic power is diminished. [8 marks]

  **(c)** Finally, suppose the editors are generally incompetent, with individual accuracy $p = 0.45$. Does increasing the size of the board improve or degrade the reliability of the majority verdict? What is the general lesson regarding the relationship between group size and collective wisdom? [4 marks]

  ***

  ### Model Answer

  **(a)**  
  Let $X$ be the number of correct votes. $X \sim B(25, 0.55)$. We require $P(X \ge 13)$.  
  Using the normal approximation:  
  $\mu = Np = 13.75$  
  $\sigma = \sqrt{Np(1-p)} = \sqrt{25(0.55)(0.45)} \approx 2.49$  
  Applying a continuity correction, we seek $P(X > 12.5)$:  
  $Z = \frac{12.5 - 13.75}{2.49} \approx -0.50$  
  From standard tables, $P(Z > -0.50) \approx 0.69$.  
  The probability the majority is right is roughly **69%**.

  To reach 99% confidence ($Z \approx 2.33$):  
  $2.33 \approx \frac{(p - 0.5)\sqrt{N}}{\sqrt{p(1-p)}} = \frac{0.05\sqrt{N}}{0.497}$  
  $\sqrt{N} \approx 23.2 \implies N \approx 540$.  
  One would need approximately **540 editors**.

  *Commentary:* The Condorcet Jury Theorem offers an elegant limit result: as $N \to \infty$, reliability $\to 1$. However, this convergence is surprisingly slow when competence is only marginally better than chance ($p=0.55$). The gap between the theoretical limit and practical reality is stark; a board of 25 feels large, yet it leaves a 31% error rate. Achieving near-certainty requires a committee size that is logistically impossible for most institutions. This illustrates that the theorem is a existence proof of collective wisdom, not a blueprint for small-group decision-making.

  **(b)**  
  The guarantee does not survive. The core mechanism of the Condorcet effect is the cancellation of *idiosyncratic* noise. When voters are independent, individual errors are random and tend to offset one another as the group grows; the signal (competence) accumulates linearly, while the noise (variance) accumulates only by the square root of $N$.

  Correlation disrupts this ratio. If errors are correlated due to a common supervisor, mistakes are no longer idiosyncratic; they become systematic. When the shared heuristic fails, a large bloc votes incorrectly simultaneously. Mathematically, this increases the variance of the sum relative to the independent case. Epistemically, it reduces the 'effective sample size'. A correlated group of 25 may possess the informational value of only 5 independent voters. The group amplifies the supervisor's bias rather than averaging out individual ignorance. Thus, correlation prevents the law of large numbers from washing out error, leaving the group vulnerable to cascading failures that independence would have mitigated.

  **(c)**  
  If $p = 0.45$, increasing the board size **degrades** reliability. The probability of a correct majority verdict will converge to 0 as $N \to \infty$.  
  *Lesson:* Bigger groups are only wiser if the average constituent is better than a random guess. If individual competence is below 0.5, aggregation amplifies error rather than cancelling it. Size is a multiplier of competence, not a substitute for it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part (a): Calculation and Interpretation [8 Marks]**
  *   **Correct Probability (3 marks):** 0.68–0.70 range accepted (exact binomial is 0.686). Deduct 1 mark for no continuity correction if using normal approx.
  *   **Correct N for 99% (3 marks):** Range 530–550 accepted.
  *   **Commentary on the Gap (2 marks):**
      *   *2 marks:* Explicitly notes the slowness of convergence and the logistical impossibility of the required $N$. Connects the math to the "elegant limit vs. reality" tension.
      *   *1 mark:* Merely states "N is large" without contextualising the practical constraint.
      *   *0 marks:* No commentary or irrelevant.

  **Part (b): Correlation and Mechanism [8 Marks]**
  *   **Verdict (1 mark):** Clearly states the guarantee fails/probability decreases.
  *   **Identification of Assumption (2 marks):** Identifies independence as the violated condition.
      *   *Note:* This is the ceiling for a **B-grade** performance on this section.
  *   **Mechanism of Failure (5 marks):** *This distinguishes A from B.*
      *   *5 marks (A-grade):* Explains *why* independence matters. Uses concepts like 'cancellation of noise', 'systematic vs. idiosyncratic error', or 'effective sample size'. Explains that variance does not shrink as expected because errors move together.
      *   *3–4 marks (High B):* Mentions that errors "add up" or that the group acts like fewer people, but lacks precise terminology regarding variance or signal-to-noise.
      *   *1–2 marks (Low C):* Simply restates "independence is required" without explaining the consequence for the aggregation process.
      *   *0 marks:* Incorrect or blank.

  **Part (c): Incompetence and Lesson [4 Marks]**
  *   **Direction (2 marks):** Correctly identifies that reliability decreases/converges to 0.
  *   **General Lesson (2 marks):**
      *   *2 marks:* Articulates that competence ($p>0.5$) is a necessary precondition for the benefits of size.
      *   *1 mark:* Vague statement like "bad voters make bad groups."
      *   *0 marks:* Incorrect.

  **Grade Boundaries (Guidance):**
  *   **A (17–20):** Strong on Part (b) mechanism; accurate calculations; insightful commentary on the 'gap' in (a).
  *   **B (14–16):** Correct calculations; identifies independence violation in (b) but offers a thin explanation; correct conclusion in (c).
  *   **C (10–13):** Calculation errors; relies on rote "independence fails" in (b); vague lesson in (c).
  *   **D/F (<10):** Significant mathematical errors or fundamental misunderstanding of the theorem's direction.
