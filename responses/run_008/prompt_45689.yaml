answer: |-
  Here is a construction of the argument, designed to be adapted into dialogue, followed by the philosophical autopsy you requested.

  ### The Argument: "The Rowing Boat and the Guest"

  **1. The Nature of the Obligation (The Rowing Analogy)**
  "Think of a society not as a contract, but as a rowing crew. No one signed a paper promising to match strokes. But once you pick up an oar, you realize the boat only moves if we pull together. If I pull hard and you pull light, or if I pull on the catch and you pull on the recovery, the boat spins. We drown.

  "Tipping, queuing, driving on the right—these are our strokes. They aren't necessarily *moral* truths in themselves. Driving on the left isn't more virtuous than driving on the right. But the *coordination* is moral. When you sit at that table, you aren't just buying food; you are stepping into the boat. The server is rowing at the speed and rhythm this economy demands. They are relying on you to match that stroke. When you refuse to tip, you aren't making a political point; you're dragging your oar. You're using their reliance on the norm to subsidize your own purity."

  **2. Generalizing the Convention (Coordination vs. Distribution)**
  "Now, you might say, 'Queuing is about fairness, tipping is about wages.' You're right, the *content* differs. But the *structure* of the obligation is the same. It's about **relied-upon expectations**.
  *   **Queueing:** If I cut in line, I steal time from everyone who trusted the order.
  *   **Jaywalking:** If I cross against the light, I introduce risk to drivers who trusted the signal.
  *   **Tipping:** If I don't tip, I steal income from a worker who trusted the wage structure.

  "The obligation isn't 'follow the rule.' It's 'do not exploit the trust that keeps the practice alive.' Whether the cost is time, safety, or money, the violation is the same: you are taking the benefit of a cooperative system while opting out of its cost."

  **3. Addressing the Objection (Protest vs. Parasitism)**
  "I hear you. You say, 'What if the stroke is wrong? What if the boat is heading off a cliff?' You're asking if breaking a convention can be a way to join a local argument.
  "Here is the border: **Are you speaking their language, or yours?**
  "If locals are striking, boycotting, or campaigning to abolish tipping, and you join them, that is solidarity. You are amplifying a voice already in the choir. But if the locals have accepted this imperfect compromise—because they need to eat *now*, because they've negotiated the best they can within the system—and you swoop in with a foreign standard to judge them? That isn't protest. That's imperialism.
  "You are treating the server not as a partner in a system, but as a prop in your own moral drama. To break a convention as protest, the breakage must be *communicative* to the people bound by it. Silence isn't communication. Leaving no tip just looks like you're cheap. It doesn't change the wage structure; it just changes who pays for your dinner."

  **4. The Visitor's Specific Obligation (The Asymmetry)**
  "Finally, does this bind you, a visitor, as much as me? No. And I'll concede that.
  "I live here. I vote here. I help shape these norms. My obligation is **constitutive**; I help build the boat.
  "Your obligation is **parasitic**—in the neutral sense. You are a guest in a house where the furniture is arranged a certain way. You didn't arrange it. You won't sleep here tonight. But you are enjoying the shelter.
  "Because you benefit from the stability of the system (the restaurant exists, the service is prompt, the economy functions) without bearing the long-term costs of maintaining it, your duty is *negative*. You don't have to love the system. But you must not disrupt the expectations that allow it to function for the people who *do* live here. You owe us conformity not because you are one of us, but because you are passing through our house. You don't get to break the chairs to prove they're ergonomically unsound."

  ***

  ### Philosophical Autopsy: Where the Argument Fails

  As the author, you need to know where this reasoning is vulnerable. If a careful opponent (or your protagonist) presses hard, the friend's argument collapses at three specific points.

  **1. The "Bad Norm" Problem (The Segregation Counter-Example)**
  *   **The Weakness:** The argument relies on the idea that local conventions deserve deference because they represent a local equilibrium. But some equilibria are morally abhorrent.
  *   **The Counter:** If the convention were segregation (e.g., "Whites Only" seating in 1950s Alabama), the "mutual expectation" argument fails. A visitor would have a *higher* moral duty to violate the convention than to uphold it.
  *   **The Withdrawal Point:** The friend must concede that the obligation to conform is **conditional on the baseline justice of the system**. If the convention relies on coercion or exploitation that the locals cannot escape, the visitor's "external" perspective might be a feature, not a bug. If tipping is structurally indistinguishable from a protection racket, the "rowing" analogy breaks because the server isn't a fellow rower; they are a conscript.
  *   **How to test it in the chapter:** Have the protagonist ask, "If I were in a country where bribing police was the 'convention,' would I pay to keep the boat steady?" If the friend says "No," he admits the obligation isn't about conventions, but about the *justice* of the specific rule.

  **2. The "Communication" Gap**
  *   **The Weakness:** The friend argues that silent non-tipping isn't protest because it isn't communicative. But conventions *are* communication.
  *   **The Counter:** Money speaks. Withholding money is a universal signal of dissatisfaction. The protagonist can argue that she *is* communicating with the owner/manager via the receipt, or that her silence is a refusal to validate a corrupt script.
  *   **The Withdrawal Point:** If the protagonist can show that her refusal *does* register as a signal (e.g., she leaves a note, or the manager knows her stance), the friend's claim that she is merely "dragging the oar" weakens. It becomes a strike, not a theft.

  **3. The "Beneficiary" Fallacy**
  *   **The Weakness:** The friend claims the visitor is obligated because they "benefit" from the system's stability.
  *   **The Counter:** Does the visitor actually benefit from the *tipping* part of the system, or just the *restaurant* part? One could argue the visitor would happily pay higher menu wages for no tips. They are benefiting from the food, not the wage structure.
  *   **The Withdrawal Point:** If the protagonist argues, "I am paying for the meal, not the subsidy," the friend's claim that she is a "free rider" is less secure. She is paying the price asked (menu price), just not the *suggested* price. The obligation relies on the premise that the "price" includes the tip. If that premise is contested, the moral obligation dissolves into a pricing dispute.

  **Recommendation for the Chapter:**
  To keep the friend from reading as a mouthpiece, have him stumble on the **Segregation Counter-Example**. Let him admit, "Okay, obviously not *every* rule. But this isn't that." This admission humanizes him and shows he isn't blindly defending authority, while leaving the specific case of tipping open for debate. It makes the tension about *degree* and *harm*, not just abstract duty.
