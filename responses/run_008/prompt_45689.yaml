prompt: |-
  I am a novelist at work on a chapter in which my protagonist — a woman who has lived in three countries and is visiting an American city — refuses to tip at a restaurant on principle: she believes tipping entrenches an unjust wage structure, and she would rather be thought rude than be complicit in it. Her friend accuses her of treating a local convention as though it were optional etiquette, when in her host country it functions as part of the wage itself. I want the argument in this chapter — put in the friend's mouth, though I do not want him to read as a mouthpiece — to establish a genuine moral obligation to follow the everyday conventions of the place one is visiting, not merely a prudential or aesthetic reason to do so. Please construct that argument.

  A few constraints, so that the chapter does not collapse into a lecture:

  1. The argument must work at the level of conventions generally — tipping, but also queueing, greeting customs, whether one crosses against the light — and must explain why the obligation transfers across cases whose content differs so much, without reducing all of them to one uniform kind of duty.

  2. It must take my protagonist's strongest objection seriously: some conventions are locally contested or even locally regretted, and a visitor's principled refusal might be a way of joining the local argument rather than violating the local practice. If the argument cannot accommodate this, it should concede the point and mark exactly where its border lies.

  3. I would prefer the argument to run through the idea of a convention as a mutually expected, self-sustaining practice — the way two rowers can fall into matching strokes without anyone promising anything — rather than through law, promise, or mere politeness; but if you think that route is weaker than some other, say so and take the stronger one.

  4. The conclusion should concern visitors specifically: whether those who did not grow into the practice, will not stay to bear its costs, and did not choose where it binds them, are obligated in the same way and to the same degree as locals. If the argument yields different weights of obligation for the two, that asymmetry should be stated openly, not papered over.

  Finally, since the chapter will be read by people who already disagree with its conclusion, tell me plainly where the reasoning is most likely to fail, and what case or consideration — pressed by a careful opponent — would lead you to withdraw the claim that visitors are obligated to conform.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** A novelist writing a chapter. Protagonist (woman, expat/visitor) refuses to tip on principle (anti-wage exploitation). Friend (man, likely local or more assimilated) argues against her.
      *   **Goal:** Construct the friend's argument establishing a *genuine moral obligation* to follow local conventions (not just prudential/aesthetic).
      *   **Constraints:**
          1.  *Generalizability:* Must apply to conventions broadly (tipping, queuing, greetings, jaywalking), not just tipping, without flattening differences.
          2.  *Protagonist's Objection:* Must address the idea that some conventions are contested/regretted and refusal could be part of the local argument. Must concede if the argument doesn't cover this.
          3.  *Theoretical Basis:* Preferably based on conventions as mutually expected, self-sustaining practices (Lewisian convention/game theory vibe, or rowing analogy), rather than law/promise/politeness.
          4.  *Visitor Specificity:* Must address the specific status of the visitor (didn't grow up in it, won't stay, didn't choose it). Acknowledge asymmetry if it exists.
          5.  *Meta-Commentary:* Identify where the reasoning is weakest and what counter-argument would cause withdrawal of the claim.
      *   **Tone:** Dialogue-ready (though presented as an argument construction first), nuanced, not a mouthpiece (needs character voice implications), philosophically robust but accessible.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Problem of Conventions:* Why follow a rule that seems arbitrary (which side of the road) or unjust (tipping culture) just because others do?
      *   *The "Free Rider" Problem:* If I benefit from the system (service) without paying the expected cost (tip), I'm exploiting the expectations of others.
      *   *The "Visitor" Problem:* Do temporary participants owe the same debt as permanent members?
      *   *The "Reform" Problem:* Is breaking a rule a valid form of protest, or just rudeness?

  3.  **Drafting the Argument - Step-by-Step:**

      *   *Premise 1: The Nature of Conventions (The Rowing Analogy).*
          *   Use the requested "rowing" analogy. It's about coordination and expectation.
          *   When you enter the boat, you match the stroke. If you don't, the boat spins.
          *   It's not about the *stroke* itself being moral, but the *coordination* being necessary for the activity to exist.

      *   *Premise 2: The Moral Weight of Expectations.*
          *   In tipping, the server *expects* the tip as wage. It's not a bonus; it's the price.
          *   By sitting down, you enter the "game."
          *   Disappointing a relied-upon expectation for personal moral purity is a form of harm (letting someone down who acted based on your implicit participation).

      *   *Addressing Constraint 1 (Generalizability).*
          *   Distinguish between *constitutive* conventions (queuing, driving) and *distributive* conventions (tipping).
          *   The obligation isn't "follow rules," it's "don't exploit the trust required to keep the practice running."
          *   Jaywalking vs. Tipping: Jaywalking risks safety (shared risk). Tipping risks livelihood (transferred risk). Both rely on mutual prediction.

      *   *Addressing Constraint 2 (Contested Conventions/Protest).*
          *   Acknowledge the protagonist's point: Sometimes breaking a rule *is* the argument (e.g., Rosa Parks).
          *   *Distinction:* Is the convention *internally* contested or *externally* imposed?
          *   *Concession:* If the locals are actively fighting to change it, an outsider joining them is solidarity. If the outsider is imposing a foreign standard on locals who have settled on a compromise (even an imperfect one), that's imperialism.
          *   *The Border:* The obligation holds unless the visitor is acting in concert with local reformers *on their terms*.

      *   *Addressing Constraint 3 (Theoretical Basis).*
          *   Stick to the "mutual expectation" model. It's stronger than "politeness" (too weak) or "law" (too rigid).
          *   Focus on *reliance*. The server relied on the norm.

      *   *Addressing Constraint 4 (Visitor Status).*
          *   This is the hardest part. Why does a tourist owe anything?
          *   Argument: You are a *beneficiary* of the stability the convention provides. You enjoy the service economy that tipping sustains.
          *   Asymmetry: Locals owe more because they shape the rules. Visitors owe less, but not zero. The visitor's obligation is *negative*: do not disrupt the expectations you did not build but are consuming.
          *   *Key phrase:* "You are a guest in a house where the furniture is arranged a certain way. You don't have to love the sofa, but you don't move it to prove a point about ergonomics."

  4.  **Refining the Voice:**
      *   The friend shouldn't sound like a professor. He needs to sound like someone who cares about her but thinks she's wrong.
      *   Use metaphors. Keep sentences varied.
      *   Avoid "Therefore." Use "Look," "Think about it," "Here's the thing."

  5.  **Identifying Weaknesses (Meta-Commentary):**
      *   Where does this break?
      *   *The "Bad Norm" Problem:* If the norm is truly exploitative (e.g., segregation), conformity is immoral. Tipping is arguably less severe, but the logic holds.
      *   *The "Exit" Problem:* If the visitor doesn't benefit enough to justify the cost.
      *   *The "Collective Action" Problem:* One person not tipping doesn't change the system, but it does hurt the server.
      *   *Strongest Counter:* If the convention relies on *coercion* rather than *coordination*. Tipping is coercive for the server. Does the visitor have a duty to refuse coercive systems even if locals accept them?

  6.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Set the scene briefly (optional, but helps frame the argument).
      *   *The Argument:* Break it down into the "Rowing" analogy, the "Expectation" point, the "Protest" limitation, and the "Visitor" distinction.
      *   *The Critique:* Be honest about the philosophical fragility.

      *(Self-Correction during drafting)*: I need to make sure I don't just write an essay. The prompt asks me to "construct that argument" but implies it's for a novel. I will provide the argument in a structured format that the novelist can adapt into dialogue, followed by the requested meta-analysis. I will ensure the distinction between *coordination* conventions (driving) and *distribution* conventions (tipping) is clear, as that addresses Constraint 1.

      *Refining the "Protest" point:* The friend needs to admit that *some* rules are meant to be broken. The line is whether the breakage is *communicative*. If she just doesn't tip and says nothing, it's not protest, it's theft (of expected wage). If she explains and organizes, it's politics. But doing it silently at a dinner table is just using the server as a prop.

      *Refining the "Visitor" point:* The asymmetry is crucial. Locals vote (metaphorically). Visitors just visit. The visitor's duty is *non-maleficence* regarding the local ecosystem.

  7.  **Final Review against Constraints:**
      1.  Conventions generally? Yes (rowing, queuing, tipping).
      2.  Contested conventions? Yes (distinguishing solidarity from imperialism).
      3.  Mutually expected practice? Yes (reliance/expectation focus).
      4.  Visitor specificity? Yes (beneficiary status vs. shaper status).
      5.  Meta-critique included? Yes.

  8.  **Final Polish:** Check tone. Ensure the friend sounds empathetic, not scolding. (e.g., "I know you hate the system, but...")

  *(Self-Correction on Meta-Critique)*: The prompt asks me to tell the *user* where the reasoning fails, not necessarily put that in the friend's mouth. I will separate the "Argument Construction" from the "Philosophical Autopsy."

