answer: |-
  # Chapter 1: The Specification of a Theory of Rescue

  ## 1. Introduction
  The debate initiated by John Taurek regarding the moral significance of numbers in rescue scenarios has largely proceeded as a clash of intuitions. Proponents of aggregation argue that saving five lives is strictly better than saving one; proponents of non-aggregation argue that the separateness of persons prevents such summation. However, before adjudicating between these positions, we must establish what a theory in this domain is *for*. A theory of rescue ethics is not merely a descriptive account of our intuitions; it is a normative framework intended to guide action under conditions of scarcity and tragedy.

  To that end, this chapter sets out a specification of desiderata. These are the functional and normative requirements any adequate theory must meet. They are derived from the limiting cases that have defined the literature. By fixing these criteria, we can determine not only which theory is more intuitive, but which is more coherent.

  ## 2. The Desiderata

  ### Desideratum 1: The Verdict Requirement (The Asymmetric Case)
  *   **The Case:** A rescuer can save either one stranger or five strangers, but not both. There are no special ties, no difference in likelihood of survival, and no other distinguishing features.
  *   **The Requirement:** The theory must yield a determinate verdict on what the rescuer ought to do. It cannot prescribe paralysis. If the theory prescribes a lottery, it must specify that the lottery is mandatory, not optional.
  *   **Purpose:** Rescue is a practical enterprise. A moral theory that results in indecision in the face of imminent death fails as a guide to action.
  *   **Status:** **Non-negotiable.** Even if the verdict is "flip a coin," the theory must mandate *some* procedure for selection.

  ### Desideratum 2: The Symmetry Requirement (The Equal-Numbers Case)
  *   **The Case:** A rescuer can save Group A (five people) or Group B (five people), but not both.
  *   **The Requirement:** The theory must explain why the rescuer is not permitted to simply choose based on a trivial preference (e.g., "I prefer the left group"). It must identify what breaks the tie.
  *   **Purpose:** This is diagnostic. If a theory relies solely on the principle "more is better," it is silent here. A robust theory must explain whether the moral force comes from the *number* or from the *individual claim*. If the latter, symmetry should induce indifference resolved only by chance.
  *   **Status:** **Non-negotiable.** A theory must handle ties without arbitrariness.

  ### Desideratum 3: The Continuity Requirement (The Intra-Personal Case)
  *   **The Case:** A single person faces five hours of pain, or five people face one hour of pain each. Nearly all theories allow numbers to count here (aggregating pain within a life is standard).
  *   **The Requirement:** The theory must explain the discontinuity, if any, between aggregating harms within a single life and aggregating harms across distinct lives. It cannot simply assert that persons are "separate" without explaining why that separateness blocks aggregation in the rescue case but not in the pain case.
  *   **Purpose:** To test the metaphysical consistency of the "separateness of persons" objection. It forces the non-aggregator to explain why the boundary of the skin matters morally more than the boundary of the hour.
  *   **Status:** **Contested (Explanatory Burden).** It is non-negotiable that the theory *address* this, but it is a prejudice of the aggregative camp to demand the theory *resolve* it in favor of aggregation. A non-aggregative theory may pass this by successfully defending the moral significance of personal identity.

  ### Desideratum 4: The Partiality Permission (The Special Ties Case)
  *   **The Case:** A rescuer can save their own child (one person) or a group of five strangers.
  *   **The Requirement:** The theory must account for the intuition that the rescuer is permitted, or perhaps required, to save the child. It must distinguish between agent-neutral reasons (the good *simpliciter*) and agent-relative reasons (the good *for me*).
  *   **Purpose:** Taurek pressed this case to show that we do not always save the greater number. An adequate theory must accommodate the moral legitimacy of special obligations without collapsing into total partiality.
  *   **Status:** **Contested (Wide Reflective Equilibrium).** Strict impartialists (e.g., act utilitarians) reject this. However, for a theory to be plausible to moral agents as they actually exist, it is treated here as non-negotiable, acknowledging that a theory rejecting this requires significant revisionary force.

  ### Desideratum 5: The Accountability Requirement (The Face-to-Face Justification)
  *   **The Case:** The rescue has occurred. The rescuer stands before the party that was not saved (or their representatives), who subsequently die.
  *   **The Requirement:** The theory must supply a justification that the rescuer can offer to the losers that acknowledges their moral status. It cannot treat the losers as mere means or as negligible statistical remainders.
  *   **Purpose:** To ensure the theory respects the dignity of the individual. It guards against "tyranny of the majority" reasoning where the minority is sacrificed without moral remainder.
  *   **Status:** **Non-negotiable.** A theory of rescue that cannot be defended to those it condemns to death lacks moral authority.

  ## 3. The Compatibility Problem: Numbers vs. Justification

  The central tension in the ethics of rescue lies between Desideratum 1 (specifically the non-aggregative interpretation) and Desideratum 5. We must ask: Can a theory hold together the claim that "numbers must never by themselves settle who is saved" and the demand that "the theory must supply the rescuer with a justification that could be offered, face to face, to the party that dies"?

  There is a strong argument that these two demands are jointly unsatisfiable, or at least that the second demand quietly reintroduces aggregation through the back door.

  Consider the non-aggregative position (e.g., Taurek's). The rescuer saves the one instead of the five, perhaps via a lottery. When facing the five who will die, the rescuer offers the justification: *"I owed each of you an equal chance. To save you because you were more numerous would have been to treat the one person as a mere means to your survival. I respected the one by not outweighing their life with yours."*

  Does this satisfy Desideratum 5? From the perspective of the five, this justification may appear hollow. They might respond: *"You had the power to prevent five deaths. By prioritizing a procedural equality of chance over the substantive equality of survival, you valued your own moral purity over our lives. You respected the one's right not to be outweighed, but you did not respect our right to be saved."*

  Here lies the rub. The "Justification" requirement (D5) implicitly demands that the reason given be *sufficient* to outweigh the loss suffered. If the loss is death, the reason must be weighty.
  1.  **If the justification is procedural** ("I gave you a fair chance"), it satisfies the demand for respect but fails to address the magnitude of the loss. It risks treating the five deaths as morally equivalent to one death, which violates the intuition that death is a harm that aggregates in importance, if not in metaphysical substance.
  2.  **If the justification is substantive** ("I saved the one because..."), non-aggregation forbids using "because there were fewer of them."

  Consequently, the Accountability Requirement exerts a gravitational pull toward aggregation. To justify letting five die to the five themselves, one essentially needs to say, *"There was a reason of sufficient weight to override your claim to life."* In the absence of special ties (Desideratum 4), the only candidate for such weight is the saving of other lives. If the saving of one life is not weight enough to justify the death of five, then the theory must aggregate to find the necessary weight.

  Therefore, a strict non-aggregative theory faces a dilemma: it either fails the Verdict Requirement (by refusing to choose the one over the five without a lottery that risks the five) or it fails the Accountability Requirement (because the justification offered to the five is insufficient to compensate for their loss). The demand for a "face-to-face justification" presupposes that the losers are owed an outcome-based reason, not merely a procedural one. If we accept D5 as non-negotiable, we may be forced to concede that numbers *must* count, because only numbers provide a justification robust enough to face the five.

  ## 4. Brief Evaluation of Existing Views

  To demonstrate the utility of this specification, we can briefly score the two dominant positions against the desiderata.

  **Taurek's Lottery View**
  *   **Verdict (D1):** **Pass.** Prescribes a random selection (coin flip) to give equal chances.
  *   **Symmetry (D2):** **Pass.** Naturally handles ties via the lottery mechanism.
  *   **Continuity (D3):** **Fail/Struggle.** Taurek struggles to explain why we aggregate pain intra-personally but not lives inter-personally. He relies on a strong claim about the unintelligibility of summing separate losses.
  *   **Partiality (D4):** **Pass.** Explicitly allows the rescuer to favor the loved one, viewing the duty to save strangers as imperfect.
  *   **Accountability (D5):** **Fail.** As argued above, telling five people they died so that one person could have an equal chance is a justification that many find morally insufficient. It prioritizes the rescuer's impartiality over the victims' survival.

  **Straightforward Aggregation (Utilitarianism)**
  *   **Verdict (D1):** **Pass.** Save the five.
  *   **Symmetry (D2):** **Pass.** Indifference in equal cases; any tie-breaker is permissible.
  *   **Continuity (D3):** **Pass.** Consistently aggregates harms whether intra- or inter-personal.
  *   **Partiality (D4):** **Fail.** Generally requires saving the five strangers over the one child, violating common moral intuitions regarding special ties (unless rule-utilitarian modifications are added).
  *   **Accountability (D5):** **Pass (with residue).** Can tell the one: "You were not ignored, but the need was greater elsewhere." However, it struggles to explain why the one's right to life was overridden without treating them as a mere vessel of utility.

  ## 5. Conclusion

  This specification reveals that the debate is not merely about whether numbers count. It is about which desiderata we are willing to relax. Taurek's view preserves the integrity of the individual claim (D4, D3) but risks failing the demand for adequate justification to the losers (D5). Aggregation preserves the justification of outcome (D5, D3) but risks violating the integrity of special ties (D4) and the separateness of persons.

  The task of the following chapters is not simply to argue for one side, but to determine if a theory can be constructed that satisfies the Accountability Requirement without resorting to crude aggregation. If the analysis in Section 3 holds, the "Justification" constraint may be the lever that forces us to accept that numbers do, in fact, bear moral weight, not because sums are metaphysically real, but because respect for the many requires acknowledging the cumulative weight of their claims.
