      *   *Case 4 (Special Ties):* This tests partiality vs. impartiality. Taurek used this to show we don't always save the greater number. A theory needs to account for agent-relative permissions.
      *   *The Conflict (The "Impossible Trinity"):* The prompt specifically asks about the tension between "Numbers don't count" (Non-aggregation) and "Justification to the loser" (Accountability/Reason-giving). If I tell the 5, "I saved the 1 because I flipped a coin," is that a justification? If I say "I saved the 1 because I love him," is that a justification to the 5? If I say "I saved the 1 because numbers don't matter," do they accept that?

  3.  **Drafting the Desiderata (Iterative Process):**

