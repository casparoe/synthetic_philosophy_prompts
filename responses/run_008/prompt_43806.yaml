  # Honesty Check: What Will Go Wrong & What's Missing

  ### 1. Predictable Failure: The "It's Just Words" Rebels
  **The Problem:** You anticipated this. Some students will see through the game immediately. They will say, "This is stupid, it's obviously just language," and refuse to argue, filling out the sheet arbitrarily to finish early. This kills the tension for the rest of the group.
  **The Fix:** Do not let them opt out of the *conflict*.
  *   **Mechanism:** The **Blind Audit**. Tell them: "Half the class is doing Room A, half is doing Room B (identical scenes). Your Bonus depends on **Matching** the other room's Manifest."
  *   **Why it works:** Even if *I* think it's just words, I don't know what convention *they* picked. To get the bonus, I have to argue that my convention is the "natural" one so they will adopt it. It forces the deflationist to play the realist to coordinate.
  *   **In the moment:** If a student says "It doesn't matter," reply: "It matters for the Bonus. If the other team counts the cup as 1 and you count it as 2, you both lose. Convince them."

  ### 2. Predictable Failure: Quick Conventionalism
  **The Problem:** A group leader says, "Look, let's just call it 1 object so we can move on," and the group agrees. They miss the "genuinely unsure" moment.
  **The Fix:** **The Liability Clause.**
  *   Add a rule: "If an Object is damaged, you are fined per Object ID."
  *   Then whisper to half the groups: "Damage is more likely to occur at *boundaries*."
  *   Now, counting the cup as 1 object is risky (if the handle breaks, is the whole object broken?). Counting it as 2 is risky (more IDs to track).
  *   This creates **decision paralysis**. They can't just pick a convention; they have to weigh the risk. The risk is identical either way (the trap), but they won't know that until the reveal.

  ### 3. What The Activity Can't Reproduce: The Sorites Slope
  **The Problem:** The activity generates a **Cliff**. (Is the cup 1 or 2? Is the sand 1 or many?). It does not generate the **Slope** (If 1,000 grains is a pile, is 999? If so, when does it stop?). The activity shows *vagueness*, but not the *Argument from Vagueness* that drives people to Unrestricted Composition (Lewis/Sider). Students will leave thinking "It's vague, so we just pick a rule," rather than "It's vague, so *everything* must compose an object to avoid arbitrariness."
  **The Fix:** The "Grain Walk" in the Debrief.
  *   Do not lecture. Use the Sand Bag from the activity.
  *   **TA:** "Auditors, you said 'contact makes an object.' So the sand pile is one object."
  *   **Student:** "Yes."
  *   **TA:** (Physically removes one grain of sand from the pile). "Is it still one object?"
  *   **Student:** "Yes."
  *   **TA:** (Removes another). "Still one object?"
  *   **Student:** "Yes."
  *   **TA:** "Keep saying yes until I hold a single grain. Is a single grain a 'pile object'?"
  *   **Student:** "No."
  *   **TA:** "Where did the object stop existing? Point to the exact grain."
  *   **The Bridge:** When they admit they can't point to the grain, say: "This is why some philosophers say *any* collection of things is an object. If you say 'no' to the single grain, you have to admit there's a magic cutoff where composition stops. If you say 'yes' to the single grain, you admit composition is unrestricted. The activity showed you the *boundary*; this shows you why the boundary is impossible."

  ### 4. Ethical Note on the Trap
  Be careful not to make them feel *fooled* in a way that breeds resentment.
  *   **Framing:** "The trap wasn't to waste your time. The trap was to simulate how the world actually works. The physical facts (mass) are what causally matter. The object count is what we argue about. The score reflected reality; your anxiety reflected metaphysics."
  *   **Transparency:** In the reveal, explicitly state: "I hid the scoring rubric to force you to rely on your intuition about objects. Now that you've felt that intuition, we can analyze it."
