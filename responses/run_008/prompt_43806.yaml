answer: |-
  # Activity Design: The Inventory Protocol

  **Concept:** A logistics simulation where students must catalog a scene for "shipping." The scoring rewards physical accuracy (mass, location, material) but is structurally indifferent to the *count* of objects. Students will invest emotional and intellectual capital in determining the count, only to discover the count had no bearing on the outcome, mirroring the deflationist intuition while forcing them to feel the ontological friction.

  **Materials:**
  *   **The Scene:** A central table with the "junk duffel" arranged into three specific clusters:
      1.  **The Glued Cup:** The chipped teacup, glued back together (visible cracks).
      2.  **The Velcro Stack:** Hex nuts stuck together with velcro (easy to separate, but currently one clump).
      3.  **The Sand Bag:** A small open bag of sand, with some spilled in a pile next to it.
  *   **Tools:** Digital scales, rulers, magnifying glasses, clipboards, pre-printed "Manifest Sheets."
  *   **Room:** Desks arranged in 3 islands of 6 students.

  **Roles (Rotated halfway through):**
  *   **Surveyors (6 students):** Measure physical facts (mass, dimensions, adhesion strength). They are *forbidden* from using object words (e.g., cannot say "cup," must say "ceramic curved surface").
  *   **Registrars (6 students):** Create the Manifest. They receive Surveyor data and must decide how to group the data into "Line Items."
  *   **Auditors (6 students):** Hold the "Rulebook." They check if Registrars are consistent. (The Rulebook is intentionally vague, see below).

  **Timeline (75 Minutes):**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain the scenario: You are a moving company. You must file an inventory manifest. **Stakes:** You are paid based on **Manifest Accuracy**. |
  | **10-25** | **Survey** | Surveyors measure the scene. They record mass, coordinates, and material composition on raw data slips. They hand these to Registrars. |
  | **25-45** | **Registration** | Registrars must convert raw data into "Line Items." They must assign an **Object ID** to each item. They argue over whether the glued cup is ID #001 or ID #001a + #001b. |
  | **45-55** | **Audit** | Auditors check the Manifest against the Rulebook. They penalize *inconsistency* (e.g., if you counted the nut-stack as 1 object, you must count the sand-pile as 1 object). |
  | **55-65** | **Scoring** | TA calculates scores. Reveals the scoring rubric. |
  | **65-75** | **Debrief** | Connect the frustration to the Special Composition Question. |

  **The Scoring Scheme (The Trap):**
  The Manifest Sheet has columns for: *Object ID, Material, Mass, Coordinates.*
  *   **Public Rule:** "You are scored on Accuracy. Errors cost points."
  *   **Private Reality (The Trap):** Accuracy is calculated **only on the Mass and Material columns.**
      *   If a Registrar lists the Glued Cup as **1 Object** (200g), they get full points for Mass.
      *   If a Registrar lists the Glued Cup as **2 Objects** (100g + 100g), they *also* get full points for Mass (100+100=200).
      *   The **Object ID / Count column is never scored.** It is a metadata field.
  *   **The Kicker:** The Auditors are told to penalize *Inconsistency*. If the Registrars count the Velcro Nuts as "1 Object" but the Sand Pile as "Many Objects," they lose points. This forces them to adopt a *principle* of composition (e.g., "contact = object"), but since the scoring ignores the count, the principle is purely bureaucratic.

  **Why this works:**
  Students will fight about the count because they assume "Accuracy" implies "Correct Ontology." They will try to measure adhesion and continuity to find the "real" boundaries. When you reveal the score depended only on the sum of the masses (physical facts), they realize the count was "verbal bookkeeping" *in practice*, even if they fought about it as if it were real.

  ---

  # The Debrief: Mapping the Frustration

  Do not start with definitions. Start with their experience.

  1.  **The Physical Fix:** "Surveyors, did you find any missing data? Was there a physical fact about the glue or the sand that you couldn't measure?" (No.)
  2.  **The Ontological Gap:** "Registrars, you still disagreed. Why? If the physics was fixed, what was the variable?" (Elicit: *How we carve it up.*)
  3.  **The Trap Reveal:** "Look at your scores. Did the team that counted 5 objects score differently than the team that counted 8?" (No.) "So why did you argue?" (Elicit: *We thought it mattered. We thought there was a right answer.*)
  4.  **Mapping to Metaphysics:**
      *   **Nihilism:** The Surveyors. They refused to use object words. They only saw particles/fields.
      *   **Unrestricted Composition:** The Registrars who listed everything as one object (The Table-Scene-Object).
      *   **Restricted Composition (Common Sense):** The Registrars who tried to find a "real" boundary (glue vs. touch).
      *   **The Argument from Vagueness:** Ask the Auditors. "You penalized inconsistency. If you say 'touching makes an object,' the sand is one object. If you say 'fusion makes an object,' the cup is one object. Is there a fact of the matter which rule is right? Or is the rule just a choice?"

