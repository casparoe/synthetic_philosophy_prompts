      *   *Job 2: Emotional Safety (Attachment).* Requires consistency/authenticity. (Dog, Manager).
      *   *The Chatbot:* Fails both because it simulates Job 1 without the consciousness, and simulates Job 2 without the feeling.

      *   *Let's pick a unified principle:* **"Recognition requires an encounter with an Otherness that is both *Real* (has its own center of gravity) and *Responsive* (reacts to *you*, not a role)."**
      *   *Dog:* Real (living being), Responsive (to your presence). Counts.
      *   *Dead Novelist:* Real (was a consciousness), Responsive (text responds to your reading). Counts (as resonance).
      *   *Chatbot:* Not Real (no center of gravity), Responsive (to prompts, not *you*). Doesn't Count.
      *   *Direct Report:* Real, but not Responsive to *you* (responsive to your power). Doesn't Count.
