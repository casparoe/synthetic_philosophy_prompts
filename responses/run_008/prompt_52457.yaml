prompt: |-
  I run incident retros at a mid-size cloud hosting company -- we do maybe 60 a year, and every single one ends in the same fight about what goes in the "root cause" field. Half my facilitators are counterfactual people: the root cause is whatever the outage wouldn't have happened without, so they'll happily write "the intern's config push" even though three other safeguards also had to fail for that push to take down prod. The other half are intervention people: the root cause is the thing you'd actually go change to keep it from happening again, so they'd write "the approval step that silently skips when the reviewer is marked out-of-office" and leave the intern out entirely. I've read enough to know this maps onto a real fight in the philosophy of causation (Lewis's counterfactuals vs Pearl and Woodward's interventions, roughly), and I want something that operationalizes the difference instead of whoever talks loudest winning.

  Write me a decision procedure my facilitators can actually run during a retro: the questions to ask in order, what counts as a sufficient answer to each one, where the procedure stops and says "this is a prioritization call, hand it to engineering leadership," and where it has to admit both camps are right and we record two entries. It has to fit in the 90 minutes of a retro and be usable by facilitators with zero philosophy background -- they'll get a one-paragraph explanation of the counterfactual vs. interventionist thing, tops.

  Then run it on three incidents:

  1. An intern pushed a config change to prod on a Saturday. The approval step that should of caught it silently no-ops if the reviewer is marked out-of-office, and a caching layer meant to contain the blast radius had been misconfigured months earlier by someone who's since left. Two-hour outage, 40% of customers.
  2. A DNS provider we depend on (single vendor, no backup) shipped a bad rollout, and we went down with them. Everyone agrees we can't make the vendor change anything.
  3. A memory leak we've known about for a year and filed as "fix eventually" finally OOM'd the primary cluster during a traffic spike. Everyone knew this day would come.

  For at least one of these, the procedure should land somewhere I won't like -- I'm on record that incident write-ups should name the human action, not the system gap, and I want to see whether the procedure survives that or just agrees with me. And be straight with me about what the procedure can't do: where the two camps will still be arguing when it's finished, and what a facilitator should do at that point.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Mid-size cloud hosting company, ~60 incident retros/year.
      *   **Problem:** Consistent conflict over the "Root Cause" field.
      *   **Camps:**
          *   *Counterfactuals (Lewis):* "But-for" causation. (e.g., "Intern pushed config").
          *   *Interventionists (Pearl/Woodward):* Actionable leverage points. (e.g., "Broken approval workflow").
      *   **Goal:** A decision procedure for facilitators (non-philosophers) to operationalize this distinction within a 90-minute retro.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for sufficient answers.
          *   Escalation point (when to hand to leadership).
          *   Condition for recording two entries.
          *   Apply to three specific scenarios.
          *   Honesty check: Must challenge the user's bias (they prefer naming human action) in at least one case.
          *   Limitations: Acknowledge where the procedure won't resolve the fight.

  2.  **Deconstruct the Philosophical Conflict for Practitioners:**
      *   *Counterfactual:* What triggered the event? (The Spark). Good for timeline accuracy, bad for blamelessness.
      *   *Intervention:* What prevents recurrence? (The Fuel/Structure). Good for engineering investment, bad for specific accountability.
      *   *The Synthesis:* Most mature post-mortem cultures (like Google's SRE) lean heavily towards intervention/systemic causes because human error is inevitable. However, the user explicitly wants a procedure that *might* name the human action if justified, but also challenges them.
      *   *Strategy:* Create a funnel. Start with the "But-For" (Counterfactual) to establish facts, then filter through "Actionability" (Intervention) to determine the *Primary* Root Cause. If both are strong but distinct, allow dual entry.

  3.  **Drafting the Decision Procedure (The "Causal Funnel"):**
      *   *Time Limit:* Needs to be quick. 15-20 minutes of the 90-minute retro.
      *   *Audience:* Facilitators with zero philosophy background. Needs plain English.
      *   *Steps:*
          1.  **The Trigger (Counterfactual Check):** Identify the specific event that started the outage.
          2.  **The Leverage (Intervention Check):** Identify the systemic weakness that allowed the trigger to succeed.
          3.  **The Control Test:** Could we have realistically prevented the Trigger *without* fixing the Leverage?
          4.  **The Decision Matrix:** Based on the answers, choose one, the other, or both.
      *   *Escalation:* If the "Leverage" requires budget/strategy changes beyond the team's scope.
      *   *Dual Entry:* If the Trigger was malicious/grossly negligent (rare) OR if the Leverage is so abstract it needs the Trigger to make sense.

  4.  **Refining the Procedure (Self-Correction/Edge Cases):**
      *   *User Bias:* The user wants to name humans. I need to make sure the procedure doesn't just auto-reject human causes, but sets a high bar for them.
      *   *Constraint:* 90-minute retro. The procedure can't be a week-long analysis.
      *   *Terminology:* Avoid "Lewis" or "Pearl." Use "Trigger" vs. "Fix."
      *   *The "Stop" Condition:* When do we stop arguing? When we hit the "Control Test."

  5.  **Applying to Scenario 1 (Intern + Broken Approval + Bad Cache):**
      *   *Trigger:* Intern push.
      *   *Leverage:* OOO approval bypass + Cache misconfig.
      *   *Control Test:* Could we stop the intern without fixing the system? Only by not letting interns push (policy). But the system *should* have caught it.
      *   *Outcome:* Systemic causes are stronger. This should challenge the user's bias. The "Intern" is the trigger, but the "Root Cause" for *prevention* is the system.
      *   *Decision:* Primary Root Cause = Systemic. Secondary/Contributing = Intern action (if policy needs review).

  6.  **Applying to Scenario 2 (DNS Vendor):**
      *   *Trigger:* Vendor bad rollout.
      *   *Leverage:* Single vendor dependency.
      *   *Control Test:* Can we stop the vendor? No. Can we stop the impact? Yes (multi-vendor).
      *   *Outcome:* Pure Intervention. Counterfactual is useless (we can't fire the vendor easily/quickly).
      *   *Decision:* Root Cause = Architecture (Single Point of Failure).

  7.  **Applying to Scenario 3 (Known Memory Leak):**
      *   *Trigger:* Traffic spike.
      *   *Leverage:* Known bug deferred ("fix eventually").
      *   *Control Test:* Could we stop the spike? No (business growth). Could we stop the crash? Yes (fix the leak).
      *   *Outcome:* This is a prioritization failure.
      *   *Decision:* Escalate to Leadership. This isn't a technical root cause; it's a risk management decision.

  8.  **Addressing the "Honesty Check" (Limitations):**
      *   Where will they still fight?
      *   *Blame vs. Accountability:* Even with the procedure, people feel uneasy not naming a person.
      *   *Resource Constraints:* Fixing the "Leverage" might be too expensive.
      *   *Facilitator Authority:* Facilitators need backup when they say "No, we aren't writing 'Intern'."

  9.  **Final Polish:**
      *   Tone: Professional, direct, operational.
      *   Structure: Procedure first, then Scenarios, then Limitations.
      *   Check against constraints: 90 mins? Yes. Zero philosophy? Yes. Challenges user bias? Yes (Scenario 1 & 3).

  10. **Writing the Response:** (Iterative drafting to ensure clarity and adherence to the prompt's specific philosophical mapping without using jargon). *Self-correction during drafting:* Make sure I explicitly define the "Two Entry" condition. It should be rare. Let's make it: "Trigger is necessary for context, Leverage is necessary for action."

      *Wait, looking at Scenario 1 again.* The user said "I'm on record that incident write-ups should name the human action." If I make the procedure *always* pick the system, I'm ignoring their request to see if the procedure survives that. I need to make sure the procedure *could* pick the human action if the system was robust but the human action was outside norms (e.g., malicious). But in Scenario 1, the system was broken. So the procedure *should* reject the human action there, challenging the user. That satisfies "For at least one of these, the procedure should land somewhere I won't like."

      *Refining the "Escalation" criteria:* Scenario 3 is clearly a leadership call on risk appetite. That fits the "hand it to engineering leadership" requirement.

      *Refining the "Dual Entry" criteria:* When is it okay to list both? When the human action was a violation of *working* safeguards (gross negligence) AND a system tweak would also help. But in Blameless Culture, we usually avoid naming humans. I will frame the "Dual Entry" as "Immediate Trigger" vs "Systemic Enabler" to satisfy both camps without assigning blame.

      *Let's finalize the Procedure Steps:*
      1. Identify the Spark (Counterfactual).
      2. Identify the Fuel (Intervention).
      3. The "Could We Have Known?" Test.
      4. The Selection Logic.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your 90-minute window. It translates the philosophical distinction into operational questions without using the jargon. Following the procedure, I have applied it to your three incidents and outlined the limitations.

  ### The "Spark vs. Fuel" Decision Procedure

  **Timebox:** 15 minutes maximum during the retro.
  **Owner:** Facilitator.
  **Goal:** Fill the "Root Cause" field with text that satisfies both the need for accuracy (what happened) and utility (how to fix it).

  #### Step 1: Identify the "Spark" (Counterfactual Check)
  **Ask:** "What specific event happened at T-0 that, if removed, would have prevented this specific outage instance?"
  *   **Sufficient Answer:** A specific action, time, or external event (e.g., "Intern pushed config," "Vendor rolled out bad code," "Traffic spiked").
  *   **Fail Condition:** Vague systemic descriptions (e.g., "Bad culture," "Technical debt").
  *   **Output:** Write this down as the **Immediate Trigger**.

  #### Step 2: Identify the "Fuel" (Intervention Check)
  **Ask:** "What condition existed *before* T-0 that allowed the Spark to cause an outage instead of being absorbed?"
  *   **Sufficient Answer:** A missing safeguard, a broken process, or a known risk that was accepted (e.g., "Approval workflow bypass," "Single vendor dependency," "Known memory leak").
  *   **Fail Condition:** "Human error" (unless the action was malicious or a willful violation of a *working* safeguard).
  *   **Output:** Write this down as the **Systemic Enabler**.

  #### Step 3: The "Could We Have Known?" Test
  **Ask:** "At the moment the Spark occurred, did the actor have reasonable information to know this would cause an outage?"
  *   **Yes:** The actor ignored a clear warning or violated a working guardrail. -> **Mark as Human Factor.**
  *   **No:** The system behaved unexpectedly, or the guardrails were already broken. -> **Mark as System Factor.**

  #### Step 4: Selection Logic (The Decision Matrix)
  Use the outputs from Steps 1–3 to determine the final "Root Cause" field entry.

  1.  **If System Factor (Step 3 = No):**
      *   **Action:** The Root Cause is the **Systemic Enabler**.
      *   **Why:** You cannot prevent the Spark (humans err, vendors fail, traffic spikes), but you can remove the Fuel.
      *   **Record:** "Root Cause: [Systemic Enabler]. Triggered by: [Immediate Trigger]." (Two entries allowed here).

  2.  **If Human Factor (Step 3 = Yes):**
      *   **Action:** The Root Cause is the **Immediate Trigger**.
      *   **Why:** The system was robust; the failure was a specific deviation from known safe practice.
      *   **Record:** "Root Cause: [Immediate Trigger]."

  3.  **If the Systemic Enabler requires budget/strategy changes outside the team's control:**
      *   **Action:** **Escalate.**
      *   **Why:** The team cannot action the intervention.
      *   **Record:** "Root Cause: [Systemic Enabler]. Status: Escalated to Leadership for risk acceptance."

  ---

  ### Application to Your Incidents

  Here is how the procedure runs on your three scenarios.

  #### Incident 1: The Intern & The Broken Approval
  *   **Step 1 (Spark):** Intern pushed config on Saturday.
  *   **Step 2 (Fuel):** Approval workflow no-ops on OOO; Cache misconfigured.
  *   **Step 3 (Could We Have Known?):** **No.** The intern likely followed the standard process. The approval step *should* have caught it but was broken. The cache *should* have contained it but was broken.
  *   **Step 4 (Selection):** **System Factor.**
  *   **Final Record:**
      *   **Root Cause:** Approval workflow silently bypasses validation when reviewer is OOO; Blast radius containment (caching) misconfigured.
      *   **Triggered By:** Config push by junior engineer.
  *   **Challenge to You:** This procedure explicitly blocks you from naming the intern as the *Root Cause*. Even though the intern's action was the counterfactual cause (Lewis), the procedure forces the "Fuel" (Pearl/Woodward) because the actor lacked reasonable information that the safeguards were broken. If you want "Intern" in the Root Cause field, you have to prove the intern knew the safeguards were broken and pushed anyway.

  #### Incident 2: The DNS Vendor
  *   **Step 1 (Spark):** Vendor shipped bad rollout.
  *   **Step 2 (Fuel):** Single vendor dependency (no backup/failover).
  *   **Step 3 (Could We Have Known?):** **No.** You cannot know a vendor will break.
  *   **Step 4 (Selection):** **System Factor.**
  *   **Final Record:**
      *   **Root Cause:** Architecture relies on single point of failure (single DNS vendor) without failover.
      *   **Triggered By:** Upstream provider incident.
  *   **Note:** The "Spark" is essentially irrelevant for prevention. The procedure correctly identifies that the only actionable intervention is architectural redundancy.

  #### Incident 3: The Known Memory Leak
  *   **Step 1 (Spark):** Traffic spike caused OOM.
  *   **Step 2 (Fuel):** Known memory leak filed as "fix eventually."
  *   **Step 3 (Could We Have Known?):** **Yes/No Hybrid.** The team knew the leak existed. The *timing* of the spike was unknown, but the *risk* was known.
  *   **Step 4 (Selection):** **Escalate.**
  *   **Final Record:**
      *   **Root Cause:** Risk acceptance decision to defer known stability bug in favor of other work.
      *   **Status:** Escalated to Engineering Leadership for risk appetite review.
  *   **Why Escalate:** This is not a technical fix; it is a prioritization failure. The team cannot "fix" the root cause without leadership authorizing the swap in priorities. Writing "Memory Leak" implies it was an unknown technical mystery, which is false. Writing "Traffic Spike" implies the traffic was the problem, which is false. The cause is a business decision.

  ---

  ### Where This Procedure Will Fail (The Honesty Check)

  You asked for straight talk on where the two camps will still be arguing when this procedure is finished. Here are the three failure modes:

  **1. The "Gross Negligence" Grey Zone**
  The procedure hinges on Step 3 ("Could We Have Known?"). This is where your facilitators will fight.
  *   *Scenario:* An engineer skips a test suite because they are "in a hurry." The system catches it 99% of times, but not this time.
  *   *The Fight:* Counterfactuals say "They skipped the test." Interventionists say "Why does the system allow deploying without tests?"
  *   *The Reality:* The procedure will likely default to System Factor (allowing deploys without tests). Your "name the human" camp will hate this. They will argue that absolving the engineer erodes accountability.
  *   *Facilitator Instruction:* If the team is stuck here, default to **Dual Entry** ("Root Cause: Deployment guardrail missing. Contributing: Manual test skip."). Do not let them delete the human action, but do not let it be the *only* cause.

  **2. The "Expensive Fix" Impasse**
  In Incident 2 (DNS), the Interventionist solution is "Multi-vendor DNS." This costs money and engineering time.
  *   *The Fight:* Interventionists want to write "Single Vendor Dependency" as the cause. Counterfactuals (and Finance) will argue "The cause was the Vendor breaking. We can't root-cause the vendor."
  *   *The Reality:* The procedure identifies the cause correctly, but the organization may refuse to fund the fix.
  *   *Facilitator Instruction:* If leadership rejects the fix, the Root Cause field must change to **"Accepted Risk."** Do not let the team write a Root Cause they are not authorized to fix. It creates cynicism.

  **3. The "Blameless" vs. "Accountable" Tension**
  You mentioned you prefer naming the human action. This procedure is biased toward the Interventionist view (Systemic Enabler) because it is safer for a blameless culture.
  *   *The Risk:* If you use this procedure, your "Counterfactual" facilitators will feel muzzled. They will argue that ignoring the human action makes the report feel like fiction.
  *   *The Compromise:** The procedure allows a "Triggered By" field. Use it.
  *   *Facilitator Instruction:* Tell your team: "The **Root Cause** field is for the thing we *change*. The **Trigger** field is for the thing that *happened*." This satisfies the Interventionists (we fix the system) and the Counterfactuals (we record the history).

  ### Summary for Your Facilitators
  Give them this one-paragraph script:

  > "We are looking for two things: The **Spark** (what started the fire) and the **Fuel** (why it burned). We record the Spark for history, but we only list the Fuel as the 'Root Cause' unless the person lighting the match knew the safeguards were broken. If the fix requires money or strategy changes we can't make, we mark it as 'Escalated.' We do not argue about philosophy; we argue about what we can actually fix next week."

  This operationalizes Lewis (Spark/Trigger) and Pearl (Fuel/Intervention) without requiring them to know the names. It forces the "System" answer in 80% of cases (like Incident 1), which will challenge your bias, but provides an escape hatch for genuine negligence or leadership decisions.
