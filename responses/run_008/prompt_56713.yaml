  **Final Credence: 0.65**

  I assign a 65% probability that the non-propositional reading (hinges as rules/framework) is the superior interpretation compared to the propositional reading (hinges as exempted beliefs).

  Here is the decomposition of that number into four load-bearing terms. I am treating these as weighted inputs into the final judgment, where "Epistemic Coherence" and "Utility" carry more weight than "Exegesis," because the question is how they are *best understood*, not merely what Wittgenstein whispered to himself.

