  | Term | Probability | Weight | Justification |
  | :--- | :--- | :--- | :--- |
  | **1. Exegetical Fidelity** (Did W hold this view?) | **0.60** | 20% | Wittgenstein calls them "propositions" frequently, but explicitly compares them to "rules of grammar" and "scaffolding" in key passages; the text is inconsistent but leans non-propositional. |
  | **2. Epistemic Coherence** (Does it solve the regress?) | **0.80** | 35% | Treating hinges as rules (like logic) stops the justification regress cleanly; treating them as unjustified propositions leaves a "gap" where skepticism can still pry. |
  | **3. Theoretical Utility** (Does it work better?) | **0.70** | 25% | The non-propositional reading better explains why we cannot *choose* to doubt hinges (you can't choose to violate a rule of grammar mid-game), whereas beliefs are voluntarily held. |
  | **4. Skeptical Efficacy** (Does it defeat the skeptic?) | **0.50** | 20% | It is unclear if this reading refutes external-world skepticism or merely diagnoses it as a linguistic confusion; the "victory" is therapeutic, not logical. |

