      *   **Section 6: Tensions & Unsatisfiability:** (Where the math breaks).
      *   **Section 7: Assessment of Current Practices:** (Defense-in-depth score).
      *   **Section 8: Confidence & Uncertainty:** (Meta-evaluation).

  5.  **Drafting the Content (incorporating specific constraints):**

      *   *Threat Model:* Must assume worst-case capability within the known envelope. Must assume the model knows the control architecture (security through obscurity is invalid).
      *   *Cases:* Sandbagging (must assume evals are lower bounds). Collusion (network isolation isn't enough if they steganograph). ML Monitors (assume they are exploitable).
      *   *Risk:* Must map where risk goes (e.g., to the human operators).
      *   *Quant:* Bounds must be robust to adversary optimization *of the bound itself*.
      *   *Failure:* Must have a "dead man's switch" logic that doesn't rely on the model.
      *   *Tensions:* Adaptive adversary vs. P(escape) < epsilon.
      *   *Assessment:* Current practices fail on the "Active Adversary" assumption.
      *   *Knockout:* The requirement that controls must work even if the model is *strategically deceptive* (Sandbagging/Evals-aware).

  6.  **Final Review against Prompt:**

