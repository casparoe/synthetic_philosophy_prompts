answer: |-
  A vision scientist would endorse "active inference" but wince at "everything... reaches all the way down into early vision." While predictive coding is the dominant framework, it posits that priors constrain interpretation rather than rewriting early sensory signals. The consensus holds that early vision (V1/V2) is largely encapsulated; top-down effects typically target object recognition, attention, or decision stages. True "cognitive penetration" of early vision remains a controversial minority thesis, vigorously debated against modularity accounts (e.g., Firestone & Scholl).

  Regarding the "literally see" claims:
  1.  **Coins:** The Bruner & Goodman (1947) finding is historically iconic but scientifically discredited. Methodological flaws and replication failures suggest it was a judgment bias regarding value, not a perceptual size distortion.
  2.  **Hills:** Proffitt's embodiment claims are heavily contested. Many studies fail to replicate the steepness effect, especially when using action-based measures (e.g., hand tilt) rather than verbal estimates. This indicates a judgment effect, not a change in visual angle.
  3.  **Food/Brightness:** While motivation modulates attention, claiming hunger changes luminance perception is an overreach. It's likely a response bias.

  The distinction is crucial. "Cognitive penetration" (altering sensory experience) is distinct from "cognitive influence" on judgment or report. The book conflates these. Most alleged examples fail to rule out demand characteristics or response biases.

  Does the conclusion follow? "Discount any perception that flatters your beliefs" is pragmatic but overly blunt. If the corruption is in judgment, you can debias via blind protocols or calibration, not by ignoring sensory data. If you discount all flattering perception, you risk ignoring true positives. Furthermore, predictive processing suggests priors are necessary for seeing at all; the goal is accurate priors, not nullifying them. The book's radical skepticism overshoots the evidence. Early vision isn't that penetrable, and most biases are correctable without discarding perception wholesale. Rationality requires calibrating the inference engine, not assuming it is irredeemably corrupted.
