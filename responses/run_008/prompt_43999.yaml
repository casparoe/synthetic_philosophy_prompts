answer: |-
  **The Definition**
  For the purpose of this calculation, I am defining **Good Faith** as: *The participant is arguing to persuade based on a sincere internal model of the world (factual or moral), rather than primarily to signal tribal allegiance or dominate the interlocutor.* Crucially, this definition allows for factual error and slow updating, provided the error is not *solely* motivated by identity protection.

  **The Issue**
  **Abortion.** This is the cleanest case because it separates terminal values (fetal personhood vs. bodily autonomy) from empirical claims (viability, health outcomes, enforcement effects).

  **The Credence**
  My credence that a typical committed partisan on abortion is arguing in good faith is **65%**.

  **The Decomposition**
  Here are the probabilistic terms that feed into that 65%, with justifications for each.

  1.  **Probability that "Good Faith" is a coherent concept here: 90%**
      *   *Justification:* While human psychology is a cluster of motives, the distinction between "trying to find the best outcome" and "trying to win status for my team" is behaviorally observable. It dissolves under extreme scrutiny (psychoanalysis), but for the purpose of a dinner table argument, it is well-defined enough to assign probability mass.
      *   *Impact:* This acts as a ceiling. If the concept were nonsense (0%), the final number would be 0%. At 90%, it allows the other terms to matter.

  2.  **Probability the view is downstream of Terminal Values: 70%**
      *   *Justification:* On abortion, the core disagreement is usually "Is the fetus a person with rights?" vs. "Does the pregnant person have sovereignty?" These are axiomatic moral premises, not factual claims. If a disagreement is values-based, it counts as Good Faith by my definition because you cannot demand someone "update" on a terminal value.
      *   *Impact:* This *increases* the Good Faith credence. If 70% of the disagreement is values-based, that 70% is automatically GF-compliant.

  3.  **Probability the view is driven by Identity-Protective Cognition: 45%**
      *   *Justification:* This is the penalty term. Nearly half of the *rhetoric* used (statistics about crime, economic impact, slippery slopes) is often post-hoc rationalization for a tribal position. If the argument is primarily a badge of group membership, it is not Good Faith.
      *   *Impact:* This *decreases* the Good Faith credence. It suggests that nearly half the "energy" in the argument is signaling, not truth-seeking.

  4.  **Probability of Symmetry in Motivated Reasoning: 85%**
      *   *Justification:* This addresses the "both camps" requirement. Research (e.g., Haidt, Taber & Lodge) suggests cognitive biases like confirmation bias and motivated skepticism are roughly equipotent across the ideological spectrum on high-salience issues.
      *   *Impact:* This stabilizes the average. If one side were 90% GF and the other 10% GF, the "typical partisan" average would be misleading. High symmetry means the 65% applies reasonably well to both Pro-Life and Pro-Choice partisans.

  5.  **Probability of Sincerity (Self-Deception vs. Lying): 95%**
      *   *Justification:* Outright conscious lying is rare in family disputes. Most people believe their own propaganda.
      *   *Impact:* This sets a high baseline. Bad faith requires a level of cynicism most people don't possess. They are usually wrong, but they are usually sincerely wrong.

  **How They Combine**
  I calculate the final figure using a weighted conditional model:

  $$P(GF) = P(Coherent) \times [ (P(Values) \times 1.0) + (P(Facts) \times P(Rational|Facts)) ] \times (1 - P(Identity\_Tax))$$

  *   **Step 1:** Start with Coherence (0.90).
  *   **Step 2:** Calculate the core motive. 70% is Values (GF = 1.0). 30% is Facts. On the factual 30%, I estimate only 50% is processed rationally (due to bias). So the core motive score is $(0.7 \times 1) + (0.3 \times 0.5) = 0.85$.
  *   **Step 3:** Apply the Identity Tax. Even if sincere, 45% of the argumentative behavior is signaling. I treat this as a discount on the *observable* good faith. Multiplier = $(1 - 0.45) = 0.55$.
      *   *Correction:* A 45% tax is too harsh if sincerity is high. Let's treat Identity as overlapping with the Factual error. If you are arguing values, identity matters less. If you are arguing facts, identity matters more.
      *   *Revised Combination:*
          1.  Base Sincerity: 0.95
          2.  Values Buffer: 0.70 of the disagreement is immune to "bad faith" accusations (values aren't false).
          3.  Factual Penalty: 0.30 of the disagreement is subject to bias. Let's say half of that is corrupted by identity (0.15 total corruption).
          4.  Calculation: $0.95 \times (1.0 - 0.15) = 0.80$.
          5.  Symmetry Check: Since biases are symmetric (0.85), this 80% holds for the "typical" partisan.
          6.  Coherence Check: $0.80 \times 0.90 = 0.72$.
          7.  Final Adjustment: I am discounting this slightly (to 65%) because "arguing in good faith" implies a willingness to listen, which drops significantly when identity is triggered, even if the belief is sincere.

  **Final Result:** **65%**

  ***

  **Follow-Up 1: The Weakest Link**
  The term I am least confident in is **Probability the view is downstream of Terminal Values (70%)**.

  I might be overestimating how much of this is values versus disguised identity signaling. It is very difficult to distinguish "I believe this because it is morally wrong" from "I believe this because my tribe says it is morally wrong."

  **Realistically Obtainable Evidence:**
  The best evidence would come from **preference reversal experiments** where the policy outcome is held constant but the *proposer* changes. For example, surveying partisans on a specific abortion restriction (e.g., waiting periods) when proposed by their own party versus the opposing party.
  *   *What would move me:* If support for the *exact same policy* drops by less than 10% when the party label swaps, I would raise my credence that the views are values-driven (and thus Good Faith). If support flips or drops by >40%, I would lower my credence significantly, concluding the "values" are just identity markers in disguise. We have some of this data (e.g., from YouGov or Pew), but more granular policy-swap testing would tighten this number.

  **Follow-Up 2: The Normative Question**
  Does my decomposition imply that *treating* the other side as good-faith arguers is the right move?

  **Yes, but not because it is true.** It is the right move because it is a **Schelling Point for de-escalation.**

  My decomposition suggests that ~65% of the time, the other person *is* sincere, even if they are factually distorted by identity. If you treat them as bad-faith (0% GF), you guarantee a fight with the 65% who are sincere, and you gain nothing with the 35% who are actually trolling. You maximize error in both directions.

  However, treating them as good-faith does not collapse into the definitional question. It is a separate game-theoretic layer. You can acknowledge internally, "There is a 45% chance this is identity signaling," while externally behaving as if it is not. This is **strategic charity.**

  By assuming good faith, you invite the other person to live up to that standard (the Pygmalion effect). If you accuse them of bad faith, you force them into a defensive posture where bad faith becomes the *only* rational response. So, even if my 65% number were actually 40%, treating them as if it were 65% remains the optimal strategy for preserving the relationship and potentially shifting the Overton window of the conversation. The truth value of the accusation matters less than the utility of the assumption.
