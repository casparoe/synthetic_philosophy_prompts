  **Sociologist Refuses To Acknowledge 'Crime Rate' Exists Until Each Offender Individually Consulted**

  BRINDLEWOOD—Dr. Elias Thorne, a sociology professor at Brindlewood University, has notified the National Science Foundation that he is unable to confirm whether the national crime rate rose or fell last year, citing the ontological impossibility of aggregates. Thorne, a strict methodological individualist, argues that because only individual human beings possess agency, statements like "unemployment increased" are merely misleading bookkeeping rather than factual claims. To Thorne, the thing requiring explanation cannot be a number, but must be a specific person making a specific choice.

  Consequently, Thorne's annual grant report, due Friday, contains no tables or statistical regressions. Instead, the document consists of transcripts detailing why 11,000 citizens declined to commit larceny on Tuesdays. "To say 'society decided' is to smuggle in a mystical group mind," Thorne said from his office, filled with boxes of index cards representing individual tax filers. "There is no 'market.' There are only people trading. There is no 'inflation.' There are only people raising prices. I cannot sign my name to a fiction."

  The position has caused friction, particularly regarding Émile Durkheim's study on suicide. Dr. Sarah Vance, a structural functionalist, noted that suicide rates remain statistically stable across generations despite total individual turnover. "Durkheim proved social facts exert coercive power over individuals," Vance said, smirking over Thorne's draft. "The rate persists even when the people die. Elias, however, seems to believe the statistic requires a specific successor to fill the vacancy. He is currently interviewing widows of the deceased to see if they are personally filling the quota."

  Thorne struggles to reconcile his views with the classical liberal tradition he claims to champion. When reminded that Adam Smith's "invisible hand" relies on aggregate outcomes emerging from individual actions, Thorne pushed back. "An equilibrium nobody chose is still an aggregate entity," Thorne argued. "If no one intended the price level, who is responsible for it? I need to speak to the price level. If it emerged spontaneously, who signed the contract?"

  Administration concerns are less philosophical. Dean Martin Miller requires quantitative data for the upcoming brochure. "The donors want to know if graduation rates are up," Miller said. "I cannot tell them 'a series of unique biological organisms independently chose to complete coursework.' I need a percentage. Also, the report was due Friday."

  Thorne maintains he is close to finishing his analysis of the unemployment rate, provided he can locate the individuals who constitute the "fractional" remainder. "Until I interview the 0.4 percent," Thorne said, "the number is just a ghost. You cannot build a science on ghosts."
