prompt: |-
  hey, so I'm a 2nd year physics & philosophy student and in our philosophy of physics module we've just hit Newton's bucket and the whole substantivalism vs relationism fight about absolute space. my tutor has given a few of us the job of running one activity with the rest of the tutorial (about 10 students, 20 minutes, just a seminar room with chairs and a whiteboard, no lab equipment) and I want it to actually land rather than being me waffling about the scholium at them.

  please act as an experienced philosophy of physics lecturer who has run a lot of interactive sessions, and think carefully before answering — maybe brainstorm a couple of rough options for the setup first and then commit to one full design.

  here's the core thing I want the activity to make them feel, without me lecturing: rotation (unlike uniform straight-line motion) seems to leave detectable local traces — tension in a cord, water piling up at the sides of the bucket, arms getting pulled outward — that don't obviously depend on any visible reference body. so the participants should first experience motion they can't detect, then motion they can detect from the "inside" with all external references removed. I was thinking something like blindfolds and a spinning office chair, or people holding a rope in a circle, but you design it properly. then I want a second phase that turns the screw: once they've concluded that you can just tell, from local inertial effects, that it's really you rotating and not the rest of the world spinning around you, hit them with the relationist comeback — Mach's line that the distant masses are doing the work, and Newton's own two-globes-in-empty-space case where there is literally nothing else. one more twist I'd like worked in if you can manage it without overloading: I vaguely remember reading that Einstein somewhere played with a version of the bucket where you imagine making the bucket's walls absurdly massive, so that the "rotating relative to what" question stops having an obvious answer — if you know what I'm on about, use something like that as a final destabiliser, and if I'm misremembering then just skip it or replace it with something that does the same job.

  for the design I need: exact rules and materials (stuff you'd find in any seminar room, or that I can bring in a rucksack for under a tenner), a timeline for the 20 minutes, what the participants do at each stage and what question I pose to them before each reveal, and NO money or real payoffs needed. also a debrief that maps the specific moments of the activity onto the argument — which moment stands for the water climbing the sides, which stands for the relationist's "motion only makes sense relative to other bodies" claim, etc. and please be honest about two things: what will predictably go wrong the first time I run it (people getting dizzy, someone cracking a joke and derailing it, whatever) and how to handle that, and which bit of the actual philosophical problem the activity just cannot reproduce no matter how well it's run — the bit I'll have to supply myself at the end. keep it realistic for 10 students, one room, 20 minutes, and write everything in British English please. cheers!
