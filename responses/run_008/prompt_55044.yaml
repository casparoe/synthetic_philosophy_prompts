prompt: |-
  I chair the promotions and reappointment committee in a mid-sized humanities faculty, and I've run into a problem with our voting procedure that a colleague in philosophy tells me is a recognized issue in a body of work on something called judgment aggregation, though she couldn't tell me how to solve it in practice. Our university rules require the committee to submit a recorded vote on a set of named criteria for each candidate — "the research record meets the standard for the rank," "teaching meets the standard," "service meets the standard" — and then a recorded overall recommendation, and the dean's office accepts only packages in which the overall recommendation follows from the criteria votes. Last month we had a case where this fell apart. On a five-member committee (I vote only to break ties), three members judged that the research record was sufficient and three judged that teaching was sufficient, so by our rules both criteria were met — yet a different three-member majority had privately concluded that the candidate should not be promoted, and when we voted on the recommendation directly, we produced a package the dean's office rejected: criteria all met, recommendation negative. We ended up re-voting with some members switching out of embarrassment, which felt both arbitrary and unfair to the candidate. My philosopher colleague says this pattern is sometimes called the discursive dilemma and that there is apparently a theorem showing no voting rule avoids it in general, which is comforting in a way but doesn't help me run a meeting.

  Here is what I need from you, and I want to be clear that I need a usable procedure, not a survey of the literature. We handle roughly fifteen candidates a year, each case must be finished within a single two-hour meeting, the votes become part of the record and can be examined in an appeal, and I cannot afford to spend more than a few minutes per candidate on procedural meta-discussion — the committee members are impatient and one has already suggested we just "vote on the bottom line and skip the criteria," which would get us in trouble with the dean's office. Please write a decision procedure I can actually follow in the chair's seat: the questions to ask and in what order; a rule for when the committee should vote premise-by-premise on the criteria versus directly on the recommendation; a way to detect the inconsistent situation before it's on the record, and a default for what to do when we detect it; and clear marking of the points where the procedure has to stop and hand the question to the committee's own judgment, because those are choices of value rather than steps of logic. Then run the procedure on three cases: a candidate where the numbers reproduce the dilemma exactly and the procedure resolves it in a direction I personally dislike; a case where a member votes against her own sincere judgment on a criterion purely to keep the package consistent, and I want to know whether the procedure should tolerate that; and a case where one criterion is borderline in the way people say "meets the standard" is a matter of degree rather than a fact. Finally, tell me plainly what the procedure cannot do — where it will misfire, and what I should say in the meeting when it does, given that I have to sign my name to the outcome either way.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User's Request:**

      *   **Role:** Chair of a Promotions and Reappointment Committee (Humanities Faculty).
      *   **Problem:** The "Discursive Dilemma" (Judgment Aggregation Paradox). The committee votes on criteria (Research, Teaching, Service) and an Overall Recommendation. University rules require the Overall Recommendation to logically follow from the Criteria Votes (e.g., if all criteria are "Yes," Overall must be "Yes"). However, majority voting on criteria can yield a "Yes/Yes/Yes" result while a majority voting on the Overall yields "No."
      *   **Constraints:**
          *   Mid-sized faculty, ~15 candidates/year.
          *   Single 2-hour meeting per candidate (tight timeline).
          *   Votes are recorded and subject to appeal (needs transparency/consistency).
          *   Minimal time for procedural meta-discussion (members are impatient).
          *   Cannot ignore criteria (Dean's office requirement).
          *   Chair votes only to break ties.
          *   Need a *usable procedure*, not a literature survey.
      *   **Deliverables:**
          1.  A step-by-step decision procedure (questions, order, rules for premise vs. conclusion voting, detection of inconsistency, default resolution).
          2.  Marking of points requiring value judgment (not just logic).
          3.  Run the procedure on three specific test cases:
              *   Case A: Exact dilemma, resolves in a direction the Chair dislikes.
              *   Case B: Strategic voting (member votes insincerely on a criterion to force consistency).
              *   Case C: Borderline criterion (vagueness of "meets standard").
          4.  Plain statement of limitations (where it misfires, what to say in the meeting).

  2.  **Deconstruct the Logical Problem:**

      *   **Structure:** Premises ($P_1, P_2, P_3$) $\rightarrow$ Conclusion ($C$).
      *   **Rule:** $C$ is positive if and only if all $P_i$ are positive (Conjunction Rule). *Note: The prompt implies "criteria all met" leads to "promotion." Usually, promotion requires passing all hurdles. I will assume a conjunctive rule (All Yes $\rightarrow$ Yes; Any No $\rightarrow$ No) based on the description "criteria all met, recommendation negative."*
      *   **The Paradox:**
          *   Member 1: Yes, No, Yes $\rightarrow$ No
          *   Member 2: No, Yes, Yes $\rightarrow$ No
          *   Member 3: Yes, Yes, No $\rightarrow$ No
          *   *Majority on Premises:* Yes (2/3), Yes (2/3), Yes (2/3) $\rightarrow$ Implies Overall Yes.
          *   *Majority on Conclusion:* No (3/3).
          *   *Conflict:* Premise-based voting says Promote; Conclusion-based voting says Deny.
      *   **University Constraint:** The Dean requires consistency ($P_{majority} \rightarrow C_{record}$).
      *   **Goal:** Avoid the embarrassment of a rejected package without forcing insincere voting or wasting time.

  3.  **Develop the Procedure:**

      *   *Philosophical Background:* The standard solutions in judgment aggregation are "Premise-Based Procedure" (PBP) or "Conclusion-Based Procedure" (CBP). The Dean effectively mandates PBP (criteria determine outcome). However, the committee cares about the outcome. The conflict arises when the PBP outcome contradicts the collective will on the outcome.
      *   *Practical Constraint:* We can't change the math (List & Pettit theorem says no perfect rule exists). We need a *process* to manage the conflict.
      *   *Strategy:* Use a "Sequential Voting with Consistency Check" approach.
      *   *Step 1: Vote on Criteria (Premises).* This satisfies the Dean.
      *   *Step 2: Calculate Implied Outcome.* Logic dictates the result based on Step 1.
      *   *Step 3: Vote on Overall Recommendation (Conclusion).* This reveals the dilemma.
      *   *Step 4: Comparison & Resolution.* If Step 2 matches Step 3, done. If not, we have the Dilemma.
      *   *Resolution Rule:* Since the Dean rejects inconsistent packages, the *recorded* Overall must match the logical implication of the Criteria. However, to respect the committee's will, we need a mechanism to revisit the Criteria if the Implied Outcome is strongly rejected.
      *   *Refinement:* To save time, we shouldn't vote twice if we don't have to.
      *   *Proposed Procedure:* "The Conditional Consistency Protocol."
          1.  Vote Criteria.
          2.  Announce Logical Implication.
          3.  Ask: "Does anyone object to recording this implication as the Recommendation?"
          4.  If No Objection: Record.
          5.  If Objection (Dilemma Detected): Open brief discussion on *which criterion* is the weak link. Re-vote *only* that criterion if consensus shifts. If not, the Criteria votes stand (Dean's rule), but the dissent is recorded in minutes.
      *   *Wait, simpler:* The Dean requires the package to be consistent. The Committee wants the Recommendation to reflect their will.
      *   *Best Practical Fix:* **Priority to Premises with a Safety Valve.**
          *   Vote Criteria first.
          *   Derive Recommendation.
          *   *Before* recording, take a straw poll on the Recommendation.
          *   If Straw Poll matches Derivation: Formal Vote on Recommendation (formality).
          *   If Straw Poll conflicts: **Re-open discussion on the Criteria.** The logic is: if the group rejects the outcome, they likely reject one of the premises. Find the premise that is "borderline" and re-vote.
          *   *Hard Stop:* If re-voting doesn't change the premise majority, the Premise-Based outcome *must* stand to satisfy the Dean. The dissent is noted in the narrative, not the vote.

      *   *Let's tighten this for the Chair:*
          1.  **Vote Criteria.** (Required by Dean).
          2.  **Determine Logical Outcome.** (Chair does math).
          3.  **Check Consistency.** (Chair asks: "Based on these votes, the logical recommendation is X. Are we prepared to record X?")
          4.  **If Yes:** Vote on Recommendation (Formality).
          5.  **If No (The Dilemma):** Trigger "Premise Review." Identify the criterion with the slimmest majority or most debate. Allow 5 mins discussion. Re-vote *that* criterion.
          6.  **Final Fallback:** If Premise Review fails to align the outcome, the Criteria Votes govern (Dean's rule). The Recommendation is recorded as logically required. Dissent is noted in the *narrative justification*, not the vote count.

  4.  **Addressing Specific User Requirements:**

      *   *Questions/Order:* Defined above.
      *   *Rule for Premise vs. Direct:* Always Premise first (Dean's rule), but Direct acts as a check.
      *   *Detection:* Compare Logical Outcome of Criteria vs. Sentiment on Recommendation.
      *   *Default:* Criteria govern (to satisfy Dean), Narrative captures dissent.
      *   *Value Judgments:* Mark where the Chair decides which criterion to re-vote or when to stop discussion.
      *   *Test Cases:*
          1.  *Exact Dilemma (Chair dislikes outcome):* Shows the procedure forces the "unwanted" logical outcome but preserves integrity.
          2.  *Strategic Voting:* Address whether the procedure tolerates it (Yes, it's a feature of voting, but the "Premise Review" mitigates it).
          3.  *Borderline Criterion:* Shows where the "Premise Review" is most useful.
      *   *Limitations:* Cannot fix the paradox, only manage it. Cannot prevent appeals based on substance, only procedure.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, authoritative, practical, empathetic to the Chair's position.
      *   *Structure:*
          1.  The Protocol (Step-by-Step).
          2.  Value Judgment Markers (Explicitly highlighted).
          3.  Test Cases (A, B, C).
          4.  Limitations & Script.
      *   *Refining the "Strategic Voting" case:* The user asks if the procedure should *tolerate* a member voting insincerely on a criterion to keep the package consistent.
          *   *Analysis:* If a member thinks Research is "No" but votes "Yes" to ensure the candidate gets promoted (because they value Promotion over Research accuracy), that's strategic. If they vote "No" on Teaching to block promotion despite thinking it's "Yes," that's also strategic.
          *   *Procedure Stance:* The procedure cannot police sincerity. It must treat votes as authoritative. However, the "Premise Review" allows them to correct "mistakes" (which might be strategy). I need to be honest: The procedure *must* tolerate it because you can't prove insincerity, but the process encourages sincerity by allowing re-evaluation.
      *   *Refining the "Chair Dislikes Outcome" case:* This tests the Chair's neutrality. The procedure must bind the Chair too.
      *   *Refining the "Borderline" case:* This is where the "Premise Review" shines. It converts a binary vote into a deliberative check.

  6.  **Final Review against Constraints:**

      *   *Time:* The "Premise Review" needs a hard time limit (5 mins).
      *   *Appeals:* The minutes must reflect the process clearly.
      *   *Dean's Rules:* The final package *must* be logically consistent.
      *   *Chair's Tie-Break:* Keep this standard.

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm solving the theorem. I'm managing the *administrative fallout* of the theorem.
      *   *Emphasis:* Highlight the "Narrative Safety Valve." Since the vote count is rigid, the written justification is where the nuance lives. This is crucial for appeals.
      *   *Clarity:* Use bolding for steps. Use boxes or distinct sections for the "Value Judgments."

  8.  **Final Polish:** Check the three test cases against the procedure to ensure they actually resolve as described.
      *   *Case 1:* 3 criteria, 5 members. 3-2 on each criterion (Yes), but 3-2 on Overall (No). Procedure: Criteria stand $\rightarrow$ Implied Yes. Review fails. Record Yes. Note dissent in narrative.
      *   *Case 2:* Member votes Yes on Teaching (sincerely No) to force Promotion. Procedure: Criteria stand $\rightarrow$ Promotion. Review might catch it if they admit it, but if not, vote stands.
      *   *Case 3:* Research is borderline. Procedure: Review triggers. Discussion focuses on Research. Re-vote might flip Research to No. Consistency restored.

      *Wait, one nuance:* The user said "Dean accepts only packages in which the overall recommendation follows from the criteria votes."
      *   If Criteria = Yes, Yes, Yes $\rightarrow$ Overall *must* be Yes.
      *   If Committee votes Overall = No, Dean rejects.
      *   So the procedure *must* ensure Overall matches Criteria logic.
      *   My proposed "Premise Review" is the mechanism to align the Committee's will with the Dean's constraint *before* finalizing. If alignment fails, Dean's constraint wins (Criteria dictate Overall).

      *Let's finalize the "Value Judgment" markers.* These are critical. The Chair needs to know where *they* are making a call vs. following the rule.
      1.  Selecting which criterion to re-examine.
      2.  Deciding when discussion is "exhausted."
      3.  Drafting the narrative to reflect dissent without undermining the vote.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your specific constraints. It accepts the mathematical reality of the discursive dilemma (that it cannot be eliminated) and instead manages the administrative risk. It prioritizes compliance with the Dean's office while providing a structured "safety valve" for committee dissent before the record is finalized.

  ### The Conditional Consistency Protocol (CCP)

  **Pre-Meeting Prep:**
  Prepare a ballot sheet with the three criteria (Research, Teaching, Service) and the Overall Recommendation. Leave the Overall Recommendation blank until the end.

  **Step 1: The Premise Vote (Required)**
  *   **Action:** Call for a recorded vote on each criterion individually (Yes/No).
  *   **Rule:** Simple majority. Chair breaks ties.
  *   **Record:** Mark the results on the ballot sheet. Do not announce the logical outcome yet.

  **Step 2: The Logical Derivation (Chair Only)**
  *   **Action:** You (the Chair) apply the university's logical rule to the Step 1 results.
      *   *Standard Rule:* If all Criteria are "Yes," the Logical Outcome is "Promote." If any Criterion is "No," the Logical Outcome is "Deny."
  *   **Action:** Write this "Logical Outcome" on your private notes. Do not record it on the official ballot yet.

  **Step 3: The Consistency Check (The Safety Valve)**
  *   **Action:** Announce to the committee: *"Based on the criteria votes, the logical recommendation is [Logical Outcome]. Before we record the final recommendation, does any member believe this outcome contradicts the collective will of the committee?"*
  *   **Branch A (No Objection):** Proceed to Step 4.
  *   **Branch B (Objection Raised):** Trigger **Step 3-Rescue**.

  **Step 3-Rescue: Premise Review**
  *   **Action:** Ask the objecting member(s) to identify *which criterion vote* they believe is unstable or does not reflect the discussion.
  *   **Constraint:** Limit this discussion to **5 minutes**.
  *   **Action:** Call a re-vote *only* on that specific criterion.
  *   **Result:** Update the Logical Outcome based on the new vote.
  *   **Hard Stop:** If the re-vote does not change the majority on that criterion, or if a second criterion is challenged, end discussion. The original Step 1 votes stand. The Dean's requirement for logical consistency overrides the committee's preference for the outcome.

  **Step 4: The Conclusion Vote (Formality)**
  *   **Action:** Call for a recorded vote on the Overall Recommendation.
  *   **Rule:** The vote *must* match the current Logical Outcome derived from the Criteria.
  *   **Instruction to Committee:** *"University policy requires the recommendation to follow from the criteria. We are voting to confirm the record matches the criteria, not to re-adjudicate the candidate."*
  *   **Record:** Mark the vote. (Note: Members may vote "No" on the recommendation even if they are forced to record "Yes," but the *Recorded Recommendation* submitted to the Dean must be the Logical Outcome. See *Limitations* below).

  **Step 5: The Narrative Justification (The Appeal Shield)**
  *   **Action:** In the written justification accompanying the vote, explicitly note if Step 3-Rescue was triggered.
  *   **Phrasing:** *"While the criteria votes technically supported promotion, the committee noted significant reservation regarding [Criterion]."*
  *   **Value:** This protects the candidate (by showing the promotion was not unanimous/robust) and the committee (by showing due diligence) during an appeal.

  ***

  ### ⚠️ Points of Value Judgment (Chair's Discretion)

  The procedure above is mechanical, but three points require your human judgment. These are not logical steps; they are leadership choices.

  1.  **Selecting the Target for Re-Vote (Step 3-Rescue):**
      *   *The Choice:* If members object generally but don't specify a criterion, you must choose which criterion to re-vote.
      *   *Guidance:* Choose the criterion with the **slimmest majority** (e.g., 3-2 rather than 5-0) or the one that generated the most debate during the initial discussion. Do not choose based on which change would produce the outcome *you* prefer.
  2.  **Calling the Hard Stop (Step 3-Rescue):**
      *   *The Choice:* Determining when discussion is "exhausted" within the 5-minute limit.
      *   *Guidance:* Cut off discussion when arguments begin to repeat. If members are clearly voting strategically (see Case 2) rather than debating merit, call the stop immediately.
  3.  **Drafting the Narrative (Step 5):**
      *   *The Choice:* How strongly to word the dissent in the written justification.
      *   *Guidance:* Be factual, not emotional. "Three members expressed reservation" is better than "The committee was deeply divided." This is where you balance fairness to the candidate with protection of the committee's reputation.

  ***

  ### Test Cases

  Here is how the CCP handles the three scenarios you requested.

  #### Case 1: The Exact Dilemma (Chair Dislikes Outcome)
  *   **Scenario:** 5 Members.
      *   Research: 3 Yes, 2 No.
      *   Teaching: 3 Yes, 2 No.
      *   Service: 3 Yes, 2 No.
      *   *Logical Outcome:* Promote.
      *   *Committee Sentiment:* 3 members privately want to Deny (different 3 than the criteria majorities).
      *   *Chair's Preference:* You believe the candidate should be Denied.
  *   **Procedure Execution:**
      1.  Criteria votes stand (3-2 on all).
      2.  Logical Outcome = Promote.
      3.  Consistency Check: Objection raised ("We don't want to promote").
      4.  Rescue: You identify "Research" as the slimmeast majority (3-2). 5-minute discussion. No one changes their mind.
      5.  Hard Stop: Criteria votes stand.
      6.  Conclusion Vote: You instruct the committee the recorded recommendation *must* be "Promote" to satisfy the Dean.
  *   **Result:** The candidate is recommended for promotion.
  *   **Analysis:** The procedure forces an outcome you dislike. **This is a feature, not a bug.** As Chair, your role is to enforce the agreed-upon rules, not to ensure your preferred candidate outcome. If you override the criteria to match your preference, you open the committee to an appeal based on procedural arbitrariness. The Narrative (Step 5) allows you to note the lack of consensus, which may influence the Dean even if the vote is "Promote."

  #### Case 2: Strategic Voting (Insincere Criterion Vote)
  *   **Scenario:** Member Smith believes Teaching is "No." However, Smith wants the candidate promoted. Smith knows that if they vote "No" on Teaching, the candidate fails. Smith votes "Yes" on Teaching to ensure the Logical Outcome is "Promote," hoping the rest of the committee will do the same.
  *   **Procedure Execution:**
      1.  Criteria votes include Smith's insincere "Yes."
      2.  Logical Outcome = Promote.
      3.  Consistency Check: No objection (since Smith got what they wanted).
      4.  Conclusion Vote: Recorded as Promote.
  *   **Should the procedure tolerate this?** **Yes.**
  *   **Reasoning:** You cannot police sincerity. A vote is a speech act; it records "this is my position for the purpose of this decision," not "this is my metaphysical truth." If Smith is willing to go on record saying Teaching is sufficient, the committee must accept that as the committee's finding. The CCP tolerates this because the alternative (investigating motives) destroys trust and takes too long. The *Narrative* step is your only defense: if the teaching discussion was visibly negative in the minutes, but the vote is "Yes," an appellate body can see the dissonance without you having to accuse Smith of lying.

  #### Case 3: The Borderline Criterion (Vagueness)
  *   **Scenario:** Research is the issue. Three members think the book is "just enough." Two think it is "clearly not enough." The three "Yes" voters are hesitant.
  *   **Procedure Execution:**
      1.  Criteria Vote: Research passes 3-2.
      2.  Logical Outcome: Promote.
      3.  Consistency Check: One of the hesitant "Yes" voters objects. *"I voted Yes, but I'm not comfortable with the outcome given how close it was."*
      4.  Rescue: You select "Research" for re-vote (slimmest majority + expressed hesitation).
      5.  Discussion: The hesitation allows the "No" voters to argue their case one last time. One "Yes" voter switches to "No" realizing the candidate is better served by a re-submission next year.
      6.  New Vote: Research is now 2 Yes, 3 No.
      7.  New Logical Outcome: Deny.
      8.  Conclusion Vote: Recorded as Deny.
  *   **Result:** Consistency is preserved, and the "borderline" nature of the criterion was used to correct the outcome rather than create a paradox. This is the ideal use of the CCP.

  ***

  ### Limitations and Scripts

  You asked for plain talk on where this will misfire. The CCP does not solve the discursive dilemma; it bureaucratizes it.

  **1. It cannot prevent "Hard" Inconsistency**
  If the committee refuses to align the Recommendation vote with the Criteria logic in Step 4, the Dean will reject the package.
  *   **What to say in the meeting:** *"I understand the desire to vote No on the recommendation. However, if we record No while the Criteria are Yes, the Dean's office will return the package unprocessed. We must either change a Criterion vote or record the Recommendation as Yes. I will not submit a package I know will be rejected."*

  **2. It cannot stop Appeals based on "Group Mind"**
  A candidate can appeal saying, "The committee didn't really believe I met the standard; they were forced by logic."
  *   **What to say in the meeting (to the committee):** *"Please remember that the Narrative Justification is part of the record. If you feel the criteria votes do not reflect your true judgment, speak now during the Rescue phase. Once we move to the Conclusion Vote, the record will reflect that the criteria were met."*

  **3. It places the burden on the Chair**
  You are the one enforcing the "Hard Stop." This may make you unpopular in the moment.
  *   **What to say in the meeting:** *"My role as Chair is to ensure our work is accepted by the administration. I am enforcing this procedure to protect the validity of your votes. If we send up an inconsistent package, your votes on the criteria become meaningless."*

  **4. It assumes the "Conjunction Rule"**
  This procedure assumes Promotion requires *all* criteria to be met (Research AND Teaching AND Service). If your university uses a compensatory model (e.g., Excellent Research can offset Weak Teaching), the Logical Derivation in Step 2 changes.
  *   **Action:** Verify the Dean's specific logical rule. If it is compensatory, Step 2 must reflect that (e.g., "2 out of 3 Yes = Promote"). The rest of the CCP remains the same.

  **Final Advice:**
  Print this protocol. Keep it on the table. When the dilemma arises, do not debate the philosophy. Point to the paper and say, *"We are following the Conditional Consistency Protocol to ensure the Dean accepts our work. We are now in Step 3-Rescue."* This externalizes the friction from *you* to the *procedure*, preserving your relationships with colleagues while protecting the candidate from arbitrary re-voting.
