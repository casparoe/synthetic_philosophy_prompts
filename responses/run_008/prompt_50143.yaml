      *   **Director's Constraint:** Wants a decision, not a hedged compromise.
      *   **Structure & Length:**
          1.  "The case before the committee" (~120 words)
          2.  "The case for the excavators' reading" (~250 words)
          3.  "The case for the conservative reading" (~250 words)
          4.  "Where the burden of proof lies" (~150 words)
          5.  "Recommendation" (~200 words)
      *   **Tone:** Professional, balanced, usable for voting colleagues, serious treatment of both sides. No bibliography/citations.

  2.  **Drafting - Section by Section:**

      *   **Section 1: The case before the committee**
          *   *Goal:* State the wording issue and the two positions.
          *   *Constraint:* ~120 words.
          *   *Content:* Excavators want "grain goddess," "household shrine," "ritual act of deliberate destruction." Skeptics want descriptive-only language (made, used, deposited, broken). Committee needs to decide.
          *   *Drafting:* The committee must adjudicate the interpretive language regarding eleven clay figurines recovered from a Late Neolithic house floor. The excavators propose identifying these objects as "images of a grain goddess" deposited in a "household shrine," characterizing their fragmentation as a "ritual act of deliberate destruction before burial." Opposing members argue that such specific religious attributions exceed the evidentiary limit. They contend the report should restrict itself to observable behaviors: that figurines were made, used, deposited, and in some cases broken. We cannot issue a hedged statement; the director requires a definitive ruling on whether the report will assert specific theological content or remain within the bounds of material description. This memo outlines the arguments and provides a actionable recommendation for the final vote.

      *   **Section 2: The case for the excavators' reading**
          *   *Goal:* Strongest honest argument for the cult interpretation.
          *   *Constraint:* ~250 words.
          *   *Content:* Configuration (grain bin, threshold, fresh breaks). Principle of inference (patterned behavior implies intent/meaning).
          *   *Drafting:* The excavators' interpretation rests on the specific spatial configuration of the finds, which suggests intentional patterned behavior rather than random discard. Placing a figurine inside a grain bin and another at a threshold creates a symbolic association between the objects, domestic space, and food storage. In archaeological reasoning, distinct depositional contexts often signal distinct social or cognitive functions. The fresh breaks on the headless figures indicate forceful separation prior to deposition, distinguishing them from accidental damage during use. When combined, these elements—specialized placement, selective fragmentation, and association with subsistence resources—form a coherent constellation of evidence typical of votive practices cross-culturally. To deny this interpretation is to ignore how material culture mediates belief. If we accept that objects can hold non-utilitarian value, the concentration of figurines in liminal and productive zones of the house logically points to a domesticated religious focus. The argument is not that we know the deity's name, but that the treatment of these objects differs fundamentally from refuse or tools, warranting the inference of a shrine context and ritualized decommissioning.

      *   **Section 3: The case for the conservative reading**
          *   *Goal:* Strongest version of skeptics' position.
          *   *Constraint:* ~250 words.
          *   *Content:* Inferences about technology/subsistence vs. belief. Analogy imports content circularly.
          *   *Drafting:* The conservative position does not deny that the deposit is meaningful, but challenges the leap from material pattern to specific theological content. Inferences regarding technology or subsistence rely on direct physical relationships: querns process grain because of their wear patterns and mechanics. Inferences regarding belief, however, rely on analogy. Asserting these are images of a "grain goddess" imports iconographic content from later or distant cultures where religious texts or distinct iconographies exist, creating a circular argument where the analogy proves the very content it assumes. Without written records or unequivocal iconographic attributes, identifying the figurines as divine representations is speculative. Furthermore, "shrine" implies a designated sacred space, yet the house contains ordinary domestic debris. Fragmentation could signify disposal, mourning, or manufacturing error rather than ritual destruction. The skeptics argue that responsible publication must distinguish between what the evidence shows (deposition patterns) and what we project onto it (religious intent). To print specific theological claims risks fossilizing speculation as fact, misleading future researchers who may treat this report as primary evidence for Neolithic religion rather than as an interpretation of stratigraphy.

      *   **Section 4: Where the burden of proof lies**
          *   *Goal:* Who argues what? Excavators owe a route? Skeptics owe a reason to suspend tools?
          *   *Constraint:* ~150 words.
          *   *Content:* Balancing the need for interpretation with the risk of error.
          *   *Drafting:* The burden of proof rests on the excavators to demonstrate a reliable route from material evidence to religious content. While spatial patterning is a valid interpretive tool, it must not become a vessel for unchecked projection. The skeptics are not required to prove the negative—that no goddess existed—but rather to show that the current evidence supports multiple competing hypotheses equally well. If fragmentation and placement can be explained by secular social practices just as plausibly as religious ones, the religious explanation cannot claim priority in a final report. However, the skeptics cannot demand impossible standards that suspend ordinary interpretive tools entirely; archaeology must infer behavior from static remains. The question is whether the inference to "ritual" and "deity" is the *best* explanation or merely a *possible* one. Given the lack of comparative iconographic security, the claim of specific divine identity remains unproven, while the claim of ritualized treatment holds stronger evidentiary support.

      *   **Section 5: Recommendation**
          *   *Goal:* Concrete final wording. One sentence for report, one for exhibit, ruling on "ritual act..."
          *   *Constraint:* ~200 words.
          *   *Content:* Compromise that isn't hedging but is precise. Accept "ritualized" maybe, reject "goddess".
          *   *Drafting:* I recommend we reject the specific identification of a "grain goddess" while accepting the ritual nature of the deposit. This balances interpretive responsibility with the evident specialness of the find.

