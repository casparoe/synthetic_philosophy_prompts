  **1. The case before the committee**

  The committee must adjudicate interpretive language regarding eleven clay figurines recovered from a Late Neolithic house floor. The excavators propose identifying these objects as "images of a grain goddess" deposited in a "household shrine," characterizing their fragmentation as a "ritual act of deliberate destruction before burial." Opposing members argue that such specific religious attributions exceed the evidentiary limit. They contend the report should restrict itself to observable behaviors: that figurines were made, used, deposited, and in some cases broken. We cannot issue a hedged statement; the director requires a definitive ruling on whether the report will assert specific theological content or remain within the bounds of material description. This decision will set a precedent for future institute publications.

  **2. The case for the excavators' reading**

  The excavators' interpretation rests on the specific spatial configuration of the finds, which suggests intentional patterned behavior rather than random discard. Placing a figurine inside a grain bin and another at a threshold creates a symbolic association between the objects, domestic space, and food storage. In archaeological reasoning, distinct depositional contexts often signal distinct social or cognitive functions. The clear fresh breaks on the headless figures indicate forceful separation prior to deposition, distinguishing them from accidental damage during use. When combined, these elements—specialized placement, selective fragmentation, and association with subsistence resources—form a highly coherent constellation of evidence typical of votive practices cross-culturally. Such patterns are recognized widely as markers of cognitive significance in prehistoric contexts. To deny this interpretation is to ignore how material culture mediates belief. If we accept that objects can hold non-utilitarian value, the concentration of figurines in liminal and productive zones of the house strongly points to a domesticated religious focus. The argument is not that we know the deity's name, but that the treatment of these objects differs fundamentally from refuse or tools, warranting the inference of a shrine context and ritualized decommissioning. This approach respects the agency of past actors to create meaning through material means. The principle of inference here relies on the assumption that extraordinary effort implies extraordinary purpose. Burying intact objects under floors requires labor without economic return. Therefore, the value must be social or spiritual. This economic cost supports the claim of ritual importance. Consequently, the excavators' reading provides a unified explanation for all observed anomalies.

  **3. The case for the conservative reading**

  The conservative position does not deny that the deposit is meaningful, but challenges the leap from material pattern to specific theological content. Inferences regarding technology or subsistence rely on direct physical relationships: querns process grain because of their wear patterns and mechanics. Inferences regarding belief, however, rely on analogy. Asserting these are images of a "grain goddess" imports iconographic content from later or distant cultures where religious texts or distinct iconographies exist, creating a circular argument where the analogy proves the very specific content it assumes. Without written records or unequivocal iconographic attributes, identifying the figurines as divine representations is speculative. Furthermore, "shrine" implies a designated sacred space, yet the house contains ordinary domestic debris. Fragmentation could signify disposal, mourning, or manufacturing error rather than ritual destruction. The skeptics argue that responsible publication must distinguish between what the evidence shows (deposition patterns) and what we project onto it (religious intent). To print specific theological claims risks fossilizing speculation as fact, misleading future researchers who may treat this report as primary comparative evidence for Neolithic religion rather than as an interpretation of stratigraphy. We must maintain a clear boundary between observation and interpretation. Overstepping this boundary undermines the scientific credibility of the discipline when dealing with non-literate societies.

  **4. Where the burden of proof lies**

  The burden of proof rests on the excavators to demonstrate a reliable route from material evidence to religious content. While spatial patterning is a valid interpretive tool, it must not become a vessel for unchecked projection. The skeptics are not required to prove the negative—that no goddess existed—but rather to show that the evidence supports multiple competing hypotheses equally well. If fragmentation and placement can be explained by secular social practices as plausibly as religious ones, the religious explanation cannot claim priority in a final report. However, skeptics cannot demand impossible standards that suspend ordinary interpretive tools; archaeology must infer behavior from static remains. The question is whether the inference to "ritual" and "deity" is the best explanation or merely a possible one. Given the lack of comparative iconographic security, the claim of specific divine identity remains unproven, while the claim of ritualized treatment holds stronger evidentiary support.

  **5. Recommendation**

  I recommend we reject the specific identification of a "grain goddess" while accepting the ritual nature of the deposit. This balances interpretive responsibility with the evident specialness of the find, satisfying the director's requirement for a decision without compromising scientific integrity. We must avoid cementing speculation into the permanent record while acknowledging the clear pattern of special treatment.

  *Site Report Wording:* "The concentrated deposition of figurines within the grain bin and at the threshold, accompanied by intentional fragmentation, indicates a specialized domestic practice distinct from ordinary refuse disposal."

  *Public Exhibit Label:* "These clay figures were carefully placed in special locations within the house and deliberately broken, suggesting they played a significant role in the household's symbolic life."

  *Ruling on "Ritual Act":* Revise. The phrase "ritual act of deliberate destruction before burial" assumes too much about intent and burial context. Replace with: "deliberate fragmentation prior to deposition." This acknowledges the fresh breaks and intentional placement without asserting a specific religious ceremony or divine identity. This wording allows the data to stand firmly while permitting visitors and researchers to understand the significance without committing the institute to unverifiable theological claims. It preserves the insight that the act was meaningful without defining the meaning too narrowly.
