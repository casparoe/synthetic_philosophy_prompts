          *   Counter: This view often leads to *less* demandingness, but is it morally defensible? Many consequentialists reject it because it lets agents off the hook too easily when the stakes are life and death.
      *   *Claim 4: "Nobody actually does" implies "ought implies can" or moral falsity.*
