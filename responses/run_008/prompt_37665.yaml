          *   Counter: It doesn't necessarily mean giving until you are *as poor* as the recipient. It means giving until the marginal utility of your money equals the marginal utility of theirs. If I'm happier with \$50k than \$40k, and a poor person is happier with \$40k than \$30k, I stop before I hit their level.
      *   *Claim 2: Singer's argument fails.*
