  *(Refining the "Equal Wealth" point)*: This is crucial. Classical utilitarianism implies diminishing marginal utility of money. So transferring money from rich to poor increases total utility. But it stops when the utility curves intersect, not necessarily when wealth is equal (because the rich person might have a higher capacity for happiness, or the poor person might have adapted preferences). But the standard "Singerite" view is often interpreted as "until you are at the level of the recipient." I need to clarify that even the strict view is about *marginal utility*, not absolute poverty.

