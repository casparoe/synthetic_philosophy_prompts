  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* Establish credibility. "Professional moral philosopher" persona. Empathize with the dilemma.
      *   *Brainstorm:* Keep this distinct as requested. Focus on *why* a consequentialist thinks the sister is wrong. (e.g., Intuitions are unreliable, marginal utility isn't destitution, Singer's argument is modular).
      *   *Audit:*
