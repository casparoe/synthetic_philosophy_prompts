prompt: |-
  I recently came into a significant raise, and I'm now deciding what fraction of my income to give away. My older sister, who reads a lot of popular philosophy, has strong views about where the bar is, and she delivered herself of this summary: "The demandingness objection refutes consequentialism once and for all. Because consequentialism counts everyone's wellbeing equally, a consequentialist has to keep donating until the next donation would cost her as much as it would help its recipients — in effect giving until she's roughly as badly off as the global poor. Since no one could reasonably be required to live that way, and since nobody actually does, consequentialism is false, which is why Singer's drowning child argument fails. Besides, some contemporary philosopher showed that when others aren't doing their share, you only owe the share you'd owe if everyone complied, so this is mostly academic." I'm inclined to think she's overselling, but I can't locate the errors myself, and the stakes are immediate for me.

  Please respond as a professional moral philosopher. Before answering, take a moment to brainstorm from the consequentialist's side: what would a defender say is wrong with each step of this? Then audit her summary claim by claim — what is accurate, what is a subtle distortion, and what a defender of consequentialism would flatly deny. I'd especially like to know: (1) whether the "donate until the next gift costs you as much as it helps" framing is really the source of consequentialism's demandingness, or whether the demandingness arises differently (say, from the aggregation of many small benefits to distant people); (2) whether her inference that Singer's drowning child argument fails follows from anything correct in the summary, or whether that argument is independent of consequentialism altogether; and (3) whether the share-under-full-compliance idea she mentions is a real position, and if so whether it supports her conclusion or actually cuts the other way.
