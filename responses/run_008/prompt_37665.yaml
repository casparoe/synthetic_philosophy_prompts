answer: |-
  ### Part 1: Brainstorming from the Consequentialist's Perspective

  Before auditing your sister's summary, let me step into the shoes of a consequentialist defender to see where her argument leaks.

  *   **On "Refutes Once and For All":** A defender would say moral theories aren't refuted like math theorems; they are weighed by their ability to match considered judgments. If a theory yields counterintuitive results (like extreme sacrifice), we might tweak the theory or question the intuition. Calling it a "refutation" is rhetorical overreach.
  *   **On "As Badly Off as the Global Poor":** This is a common caricature. Strict utilitarianism requires giving until the *marginal utility* of your dollar equals the marginal utility of the recipient's dollar. Because of diminishing marginal returns, a dollar helps a poor person more than you. However, you don't necessarily need to become *destitute* to reach that equilibrium. You might retain enough to maintain your productivity and mental health, which are instruments for doing good.
  *   **On "Nobody Actually Does":** This commits the is-ought fallacy. The fact that people fail to meet a moral standard doesn't prove the standard is false; it might prove people are morally flawed.
  *   **On Singer's Drowning Child:** A defender would argue the Drowning Child intuition is the *foundation*, not the conclusion. If you reject the conclusion (give away most income), you must explain why the child in the pond is different from the child dying of malaria. If you can't find a morally relevant difference, rejecting the conclusion undermines the initial intuition too.
  *   **On the "Compliance Condition" (Fair Share):** A consequentialist would argue that the suffering of the poor doesn't care about fairness. If a child will die unless *I* pay, it matters little that others *should* have contributed. To let the child die because others didn't pay their share privileges my interest in fairness over the child's interest in living.

  ***

  ### Part 2: Audit of Your Sister's Summary

  Your sister has synthesized several high-level debates from popular ethics (likely drawing on Peter Singer, Liam Murphy, and standard objections to Utilitarianism). However, her summary conflates distinct arguments and presents contested philosophical positions as settled facts. Here is the claim-by-claim breakdown:

  **1. Claim:** *"The demandingness objection refutes consequentialism once and for all."*
  *   **Verdict:** **False / Exaggerated.**
  *   **Analysis:** In professional philosophy, the demandingness objection is considered a *major challenge*, not a refutation. Some consequentialists accept the demand (e.g., Peter Singer, Katarzyna de Lazari-Radek). Others modify the theory (e.g., "satisficing" consequentialism, or scalar morality where acts are better/worse rather than right/wrong). To say it is "refuted" ignores that many smart philosophers remain consequentialists despite this objection.

  **2. Claim:** *"A consequentialist has to keep donating until... she's roughly as badly off as the global poor."*
  *   **Verdict:** **Subtle Distortion.**
  *   **Analysis:** This is the most technically inaccurate part of her summary. Classical utilitarianism relies on the *diminishing marginal utility of wealth*. You give until the utility you lose from a dollar equals the utility the recipient gains. Because money buys less happiness for the rich than the poor, you stop giving long before you are as *poor* as the recipient, provided you have a higher capacity to convert resources into well-being (e.g., you need a computer to work and earn more to donate later). However, strict "equal sacrifice" views do push very hard, just not necessarily to the level of destitution.

  **3. Claim:** *"Since no one could reasonably be required to live that way, and since nobody actually does, consequentialism is false."*
  *   **Verdict:** **Contested / Is-Ought Error.**
  *   **Analysis:** The first half ("no one could reasonably be required") is the core of the objection, but it relies on the premise that morality must be easy or conventional. Many argue morality *is* demanding. The second half ("nobody actually does") is logically irrelevant to moral truth. That people murder doesn't mean "do not murder" is false; that people don't give away their wealth doesn't mean they aren't required to.

  **4. Claim:** *"Singer's drowning child argument fails."*
  *   **Verdict:** **Non-Sequitur.**
  *   **Analysis:** Even if extreme consequentialism is rejected, the specific intuition behind the drowning child (save a life at low cost) remains robust. The argument is designed to show that *distance* and *number of bystanders* are morally irrelevant. Rejecting the *extreme* conclusion of Singer's later work doesn't necessarily invalidate the *core* analogy.

  **5. Claim:** *"Some contemporary philosopher showed that when others aren't doing their share, you only owe the share you'd owe if everyone complied."*
  *   **Verdict:** **Accurate Reference, Ambiguous Implication.**
  *   **Analysis:** She is referring to Liam Murphy's *Moral Demands in Nonideal Theory* (1993). This is a real position (the "Compliance Condition"). However, it is highly controversial. Many argue it fails in emergency cases (if no one else helps the drowning child, do you only do half a rescue?). It limits demandingness, but it doesn't justify giving *nothing*.

  ***

  ### Part 3: Addressing Your Three Specific Questions

  #### (1) Is the "marginal utility" framing the source of demandingness, or is it aggregation?
  Your sister frames the demand as: *Give until you are as poor as the recipient.*
  The reality is more nuanced. The demandingness arises from the **aggregation of needs** combined with **marginal utility**.

  *   **Marginal Utility:** This sets the *stopping point*. As you noted, a strict utilitarian stops when their loss equals the recipient's gain. Because you are likely more efficient at converting income to well-being than someone in extreme poverty (you need nutrition, stability, and internet to function), you do not need to become *as poor* as them to reach equilibrium. However, that equilibrium is still much poorer than the average Western middle-class lifestyle.
  *   **Aggregation:** This creates the *pressure*. There isn't just one poor person; there are millions. Every dollar you spend on luxuries could save a life elsewhere. The demandingness comes from the fact that the "cost" of a luxury to you is trivial compared to the "benefit" of life to them.
  *   **Correction:** Your sister implies the demand is to equalize *wealth*. The actual philosophical demand is to equalize *marginal utility*. While this still requires significant sacrifice, it is not necessarily a vow of poverty.

  #### (2) Does Singer's drowning child argument fail if consequentialism is false?
  **No.** This is a crucial distinction.

  *   **Independence:** Singer's "Famine, Affluence, and Morality" (1972) argument is designed to be an **intuition pump** that works even for non-consequentialists. It relies on the principle: *If you can prevent something bad from happening without sacrificing anything of comparable moral importance, you ought to do it.*
  *   **The Trap:** Your sister argues that because the *conclusion* (give away most income) is too demanding, the *argument* fails. But the argument is meant to challenge our intuition about demandingness, not rely on consequentialism to be true first.
  *   **The Implication:** Even if you reject full-blown consequentialism, you likely accept that you should save the drowning child. If you accept that, you have accepted the core moral principle Singer uses. The debate is only about where the "comparable moral importance" threshold lies. Rejecting consequentialism might let you keep your car, but it doesn't necessarily let you ignore the child in the pond (or the equivalent malaria net).

  #### (3) Is the "share-under-full-compliance" idea real, and does it support her conclusion?
  **Yes, it is real, but it likely does not support her conclusion as much as she thinks.**

  *   **The Position:** This is the **Compliance Condition**, most famously defended by Liam Murphy. It argues that in non-ideal theory (where others don't cooperate), your duty is limited to the share you would bear if everyone did their fair part.
  *   **Does it help your sister?** It supports the idea that you don't have to "pick up the slack" for the entire world's selfishness. It blocks the demand to give until you are miserable.
  *   **The Catch:** It does **not** justify giving a negligible amount. If everyone gave their "fair share" to solve global poverty, estimates suggest it would cost those in the top 1% of income roughly 10% to 20% of their income (depending on the model).
  *   **The Risk:** Most ethicists (even non-consequentialists) reject the Compliance Condition in **emergency contexts**. If you and I see a drowning child, and I refuse to help, you are still morally required to save the child, even if that means doing 100% of the work. Since global poverty involves life-and-death stakes similar to the drowning child, many argue the Compliance Condition doesn't apply.
  *   **Summary:** If you accept your sister's view, you are not off the hook for giving; you are only off the hook for giving *everything*. You would still likely owe a "fair share," which is substantial.

  ### Professional Assessment for Your Decision

  Your sister is correct that strict act-consequentialism is incredibly demanding and that many philosophers reject it on those grounds. However, she is incorrect that this "refutes" the theory, and she is incorrect that it leaves you with no obligation.

  1.  **Don't accept the False Dichotomy:** It is not a choice between "Give until you are destitute" and "Give nothing." There is a vast middle ground occupied by moderate consequentialists, prioritarianists, and sufficientarians.
  2.  **The "Fair Share" Baseline:** Even if you accept your sister's "compliance condition" argument, you should calculate what your fair share would be if everyone donated. For a high earner, this is rarely less than 10%.
  3.  **The Drowning Child Intuition:** Ask yourself: If you walked past a pond and saw a child drowning, would you ruin your shoes to save them? If yes, you accept that physical proximity doesn't negate moral duty. The question is only how much "ruin" is required.

  **Recommendation:** Do not let the "perfect be the enemy of the good." The philosophical debate over the *limit* of giving should not paralyze you from the *act* of giving. A defensible moral position, even by your sister's lights, likely requires a significant fraction of your raise (e.g., 10–20%) to go toward effective alleviation of suffering, even if it does not require you to give 90%.

  Your sister's summary is a useful shield against guilt, but it is not a rigorous map for moral truth. You are right to be skeptical.
