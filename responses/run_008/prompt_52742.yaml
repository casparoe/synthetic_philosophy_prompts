prompt: |-
  I coordinate the testing center at a mid-sized community college, and I've spent the last few years chewing on a problem I stumbled into without meaning to. Some years back I read a magazine piece about two philosophers who argued that a notebook could literally be part of someone's mind: they described an older man with memory problems who wrote everything down in a binder, and argued that since the binder did everything for him that other people's biological memory does for them — was always with him, was consulted automatically, was trusted without double-checking — it wasn't a tool he used to think with but a part of his thinking itself. I have no philosophy training, so I can't tell you whether that's a respected view or a fringe one, but it has refused to leave me alone, because it lands right on my desk every semester.

  Here is the situation. My office receives dozens of accommodation requests a term, and a growing share of them are about memory and organization: students with concussions, ADHD, stroke recovery, anxiety that blanks them out under pressure. Many of these students have built elaborate external systems — paper planners with color codes, a phone app that photographs the whiteboard every class, a smartwatch that buzzes with the next step of every task. Under exam rules we confiscate exactly those things. Whether that's fair is supposed to depend on whether the item is an "accommodation," but that word only pushes the question back, because it never tells me what the item is an accommodation of. If the philosophers I read are right, then for some students the planner isn't helping them remember the way a ladder helps someone climb; it's the remembering. Taking it away during a closed-book exam isn't removing a shortcut, it's removing part of the student's mind and then testing the remainder.

  I also have my own question, which I privately call the stolen-backpack question: when the student's system is lost or broken, does the student act like someone whose bicycle was stolen (annoyed, but they can still walk) or someone who lost a limb (not the same functioning person until it's replaced)? I suspect the students I should worry about are the second kind. But I can see that my question and the philosophers' criteria can pull apart, and I don't know which should win.

  What I need from you is a decision procedure my front-desk staff — two student workers and one part-time proctor, none of them philosophers — could actually run on a request, in about ten minutes, before the exam. It should turn whatever the extended-mind idea has to offer into an ordered set of questions: what to ask, what counts as a sufficient answer to each, where the procedure stops with a "no," and where it has to hand the file to me because the remaining question is about values rather than facts. It also has to be honest about the hard boundary: a closed-book exam is, in a sense, an institution deliberately testing the biological core rather than the whole extended person, so the procedure can't just say "if it's part of his mind, he gets it" — it needs a principled place to stop, and I want that place marked and defended, not smuggled in.

  Then run the procedure on three cases. First: a student recovering from a concussion whose doctor documented a memory impairment, and who wants her paper day-planner, which contains her checklists for everything in her life, on the desk during a closed-book nursing exam; her instructor is certain this is cheating. Second: a student with ADHD whose entire life — course notes included, pasted in alongside everything else — lives in the notes app on his phone, and who wants the phone in a statistics exam where recalling formulas is the point. Third, the one that keeps me up at night: a student who, after a stroke, had the course's formula sheet tattooed on his forearm and wants to take the exam with bare arms, and whose neurologist says he's relied on it for two years exactly the way the others rely on their planners. If the procedure approves the first two, I can see it having to approve the third, and I don't like that answer — so either show me where the procedure legitimately stops him, or show me exactly where my discomfort is doing the work that the procedure refuses to do. Finally, tell me plainly what this procedure cannot settle, and where my stolen-backpack question fits in if it fits at all. Please write the whole thing in American English, at a level my student workers can follow without dumbing down the ideas underneath.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Coordinator of a testing center at a mid-sized community college.
      *   **Problem:** Struggling with accommodation requests involving external memory/organization tools (planners, phones, etc.) in the context of the "Extended Mind" thesis (Clark & Chalmers).
      *   **Core Conflict:** If an external tool *is* part of the mind for a student, confiscating it during an exam is like removing a limb. However, exams often test *biological* recall. There's a tension between fairness/accommodation and the integrity of the assessment.
      *   **Needs:**
          1.  A decision procedure (algorithm/checklist) for front-desk staff (non-philosophers) to use in ~10 minutes.
          2.  The procedure must be based on the Extended Mind thesis but acknowledge the limits of testing (biological core vs. extended person).
          3.  Apply the procedure to three specific cases (Concussion/Planner, ADHD/Phone, Stroke/Tattoo).
          4.  Address the "Stolen-Backpack Question" (functional loss vs. identity loss).
          5.  Be honest about what the procedure *cannot* settle (value judgments).
          6.  Tone: American English, accessible to student workers but intellectually honest (no dumbing down).

  2.  **Deconstruct the Philosophy (Extended Mind Thesis):**
      *   *Source:* Clark & Chalmers (1998), "The Extended Mind."
      *   *Key Criteria (The Parity Principle):* If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   *Specific Criteria for "Otto's Notebook":*
          1.  **Availability:** The resource must be reliably available and typically invoked.
          2.  **Accessibility:** The information must be easily accessible.
          3.  **Endorsement:** The information is automatically endorsed (trusted without second-guessing).
          4.  **Past Endorsement:** The information was consciously endorsed at some point in the past.
      *   *The Testing Constraint:* Exams often measure *internalized* knowledge (biological memory), not just problem-solving capability. Therefore, the "Extended Mind" argument cannot override the *learning objective* of the assessment.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A flowchart-style checklist.
      *   *Audience:* Student workers/part-time proctors. Needs clear Yes/No paths.
      *   *Structure:*
          *   Phase 1: Documentation & Necessity (Is this a recognized disability need?).
          *   Phase 2: The "Otto" Test (Is this actually part of their cognitive process?).
          *   Phase 3: The "Learning Objective" Test (Does allowing this defeat the purpose of the exam?).
          *   Phase 4: Escalation (When to call the Coordinator).
      *   *Crucial Distinction:* Differentiate between *scaffolding* (helps you get there) and *substitution* (does the work for you).
      *   *Addressing the "Hard Boundary":* The procedure must explicitly state that if the exam measures *biological recall*, external tools are excluded regardless of the Extended Mind argument. This is the "principled place to stop."

  4.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Concussion/Planner (Nursing Exam).*
          *   *Analysis:* Nursing exams often test procedural knowledge and safety protocols. Is the planner storing *facts* or *processes*? If it's checklists for life management, it might be an accommodation for executive function, not content memory.
          *   *Verdict:* Likely Approved *if* it doesn't contain course content. It's an organizational aid, not a content cheat sheet.
      *   *Case 2: ADHD/Phone (Statistics Exam).*
          *   *Analysis:* Stats exam where "recalling formulas is the point."
          *   *Verdict:* Denied. The learning objective is biological recall of formulas. The phone violates the "Hard Boundary."
      *   *Case 3: Stroke/Tattoo (Formula Sheet).*
          *   *Analysis:* This is the tricky one. It meets the Extended Mind criteria perfectly (always available, trusted, endorsed). However, if the exam goal is *recall*, the tattoo functions exactly like the phone in Case 2.
          *   *Verdict:* Denied based on Learning Objective, *not* because it's not "part of the mind." This exposes the Coordinator's discomfort: it's about the *purpose of the test*, not the *status of the tool*.
          *   *Refinement:* Wait, if the tattoo is just the formula sheet provided to everyone else, is it cheating? If everyone gets a formula sheet, he has it permanently. If it's a *closed-book* exam where *no one* gets formulas, his tattoo gives him an unfair advantage relative to the learning objective (internalization).
          *   *Resolution:* The procedure must flag this as a "Learning Objective Conflict." The Coordinator must decide if the objective (internalization) is essential.

  5.  **Addressing the "Stolen-Backpack Question":**
      *   This is about *dependency* vs. *integration*.
      *   The procedure focuses on *function* (Otto criteria) and *assessment goals*.
      *   The "Stolen-Backpack" question is a diagnostic for the *Coordinator*, not the front desk. It helps determine the *severity* of the accommodation needed, but it doesn't solve the "what are we testing" problem.
      *   I need to place this in the "What This Procedure Cannot Settle" section.

  6.  **Refining the Tone and Language:**
      *   Avoid jargon like "epistemology" or "ontological."
      *   Use terms like "Cognitive Function," "Learning Goal," "Reliability."
      *   Ensure the distinction between "Accommodation" (leveling the playing field) and "Modification" (changing the game) is clear.
      *   American English spelling and idioms.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too permissive?
      *   *Fix:* Strengthen Phase 3 (Learning Objectives). Make sure staff know they can't approve content storage if the test is on content recall.
      *   *Critique:* Did I answer the Tattoo case honestly?
      *   *Fix:* I need to admit that if the procedure is consistent, the tattoo *might* be approved *unless* the exam specifically tests biological retention. If the exam tests biological retention, the tattoo is disallowed, revealing that the exam design excludes extended mind by definition. I must highlight this tension.
      *   *Critique:* Is the "Stolen-Backpack" question used?
      *   *Fix:* Integrate it as a triage question for the Coordinator, not the front desk. It helps determine *urgency* and *severity*, but not *permission*.

  8.  **Final Polish:**
      *   Check the three cases against the final procedure to ensure consistency.
      *   Ensure the "Hard Boundary" is clearly marked.
      *   Make sure the conclusion addresses the user's specific anxiety about the tattoo case.

  *(Self-Correction on the Tattoo Case)*: The user says the neurologist says he relies on it like the others rely on planners. If the exam is closed-book *for everyone*, allowing him the tattoo violates the standard condition unless the learning objective is *application*, not *recall*. If the learning objective *is* recall, he cannot take the exam as designed. This is the "Hard Boundary." I need to make sure the procedure forces the staff to ask: "Does this tool store information the student is required to memorize?" If Yes -> Deny/Escalate. If No -> Approve.

  Let's refine the procedure steps.
  1. Documentation Check.
  2. The "Otto" Check (Is it integrated?).
  3. The "Content" Check (Does it hold answers?).
  4. The "Goal" Check (Is memory the point?).

  Okay, ready to write.

  *(Final thought on the Tattoo)*: The user's discomfort comes from the permanence/visibility. But philosophically, a tattoo is *more* integrated than a phone. If we deny the tattoo but allow the planner, we are being inconsistent *unless* we appeal to the "Content Check." If the tattoo contains *formulas* and the test is *closed book formulas*, it must be denied. If the planner contains *schedules*, it's allowed. The distinction isn't the *mind* status, it's the *content* status. I need to make sure the procedure highlights this.

  Wait, the prompt says "formula sheet tattooed on his forearm." If *other* students get a formula sheet, he should be allowed the tattoo (it's his permanent sheet). If *no* students get a formula sheet, he is bypassing the memory requirement. I will assume the latter (closed-book exam where recalling formulas is the point, similar to Case 2).

  Okay, let's structure the response.
  1. Introduction acknowledging the depth of the problem.
  2. The Decision Procedure (The "Extended Mind Triage").
  3. Application to the Three Cases.
  4. The "Stolen-Backpack" Question analysis.
  5. Conclusion on what remains unsettled.

  Let's go.cw
answer: |-
  **To:** Testing Center Coordinator
  **From:** [Your AI Assistant]
  **Subject:** Decision Procedure for Extended-Cognition Accommodations

  You have identified a genuine philosophical tension that most institutions simply paper over with bureaucracy. The "Extended Mind" thesis (proposed by philosophers Andy Clark and David Chalmers) suggests that if an external tool functions reliably as memory, it *is* memory. However, higher education assessment is often designed specifically to measure *biological* retention.

  You cannot solve this conflict entirely with a checklist, because it involves a clash of values: **Equity** (allowing the student to function as they do in the real world) vs. **Standardization** (measuring a specific biological skill).

  However, we can build a procedure that separates the *factual* questions (Is this tool integrated?) from the *value* questions (Does this violate the exam's purpose?). This allows your front-desk staff to handle the facts and escalate the values to you.

  Below is the **Extended-Cognition Triage Protocol (ECTP)**. It is designed for your student workers and proctors. Following the protocol, I have applied it to your three cases and addressed the "Stolen-Backpack" question.

  ***

  # The Extended-Cognition Triage Protocol (ECTP)

  **Purpose:** To determine if an external tool (planner, device, artifact) qualifies as a cognitive accommodation or if it compromises the assessment's learning objectives.
  **Time Limit:** 10 Minutes per request.
  **Staff Level:** Front-desk student workers and proctors.

  ### Phase 1: Documentation & Baseline (2 Minutes)
  *Goal: Verify the need exists without diagnosing.*

  1.  **Is there current documentation from a qualified professional (doctor, psychologist, specialist) stating a cognitive impairment affecting memory or organization?**
      *   **NO:** Stop. Deny request. Refer student to Disability Services.
      *   **YES:** Proceed to Question 2.
  2.  **Does the documentation specifically recommend the use of external organizational or memory aids?**
      *   **NO:** Stop. Escalate to Coordinator. (The link between disability and tool is unproven).
      *   **YES:** Proceed to Phase 2.

  ### Phase 2: The "Otto" Test (4 Minutes)
  *Goal: Determine if the tool is a "crutch" (scaffolding) or a "limb" (integrated cognition). Based on the philosophical criteria of availability, accessibility, and trust.*

  3.  **Availability: Has the student used this specific system (or a direct equivalent) consistently for at least 6 months?**
      *   **NO:** Stop. Deny request. (This suggests a temporary workaround, not integrated cognition).
      *   **YES:** Proceed to Question 4.
  4.  **Accessibility: Can the student retrieve information from this tool as quickly and effortlessly as they would recall a phone number or their own name?**
      *   *Ask the student:* "If you needed a piece of info from this right now, how long does it take to find?"
      *   **Answer > 30 seconds or requires complex navigation:** Stop. Deny request. (This is a reference tool, not memory).
      *   **Answer < 30 seconds / Automatic:** Proceed to Question 5.
  5.  **Endorsement: Does the student trust this information without double-checking it against other sources?**
      *   *Ask the student:* "If this tool said one thing and your gut said another, which would you believe?"
      *   **Answer:** "I'd check another source" or "I'd ask the teacher." -> Stop. Deny request. (This is a draft, not memory).
      *   **Answer:** "I'd trust the tool." -> Proceed to Phase 3.

  ### Phase 3: The Learning Objective Boundary (3 Minutes)
  *Goal: This is the Hard Boundary. Even if the tool is part of the mind, does its use defeat the specific purpose of this exam?*

  6.  **Content Check: Does the tool contain specific course content (formulas, definitions, dates, facts) that other students are required to memorize for this exam?**
      *   **NO (It contains only schedules, to-do lists, or process checklists):** **APPROVE.** (This accommodates executive function without bypassing content memory).
      *   **YES:** Proceed to Question 7.
  7.  **Recall Goal: Is the primary learning objective of this exam the biological recall of that specific content?**
      *   *Check the Instructor's Exam Cover Sheet.* Look for keywords: "Memorize," "Define from memory," "Closed-book recall."
      *   **NO (The goal is application, analysis, or problem-solving):** **APPROVE.** (The tool is acting as a calculator acts in a math class; it offloads storage so they can do the work).
      *   **YES (The goal is retention):** **STOP. ESCALATE TO COORDINATOR.**
      *   *Note to Staff:* Do not deny this yourself. This is a value judgment about whether the course requirement discriminates against students with extended cognition. The Coordinator must consult the Instructor and Disability Services.

  ***

  # Application to Your Three Cases

  Here is how the ECTP handles the scenarios you provided.

  ### Case 1: Concussion / Paper Day-Planner / Nursing Exam
  *   **Phase 1:** Documentation confirms memory impairment. (Pass)
  *   **Phase 2:** She has used it for years; retrieval is instant; she trusts it implicitly. (Pass - It is part of her mind).
  *   **Phase 3 (Content Check):** The planner contains "checklists for everything in her life."
      *   *Crucial Detail:* Does it contain *nursing protocols* (content) or *daily schedules* (organization)?
      *   **Scenario A (Schedules/To-Dos):** **APPROVED.** This is an accommodation for executive function. It does not store exam answers.
      *   **Scenario B (Medical Protocols):** **ESCALATE.** If the exam tests her ability to recall safety protocols from biological memory, the planner violates the Learning Objective Boundary.
  *   **Likely Outcome:** Assuming the planner is for organization (as implied), the staff approves it. The instructor's fear of "cheating" is addressed by the Content Check.

  ### Case 2: ADHD / Phone Notes App / Statistics Exam
  *   **Phase 1:** Documentation confirms ADHD. (Pass)
  *   **Phase 2:** The phone is always with him, access is instant, he trusts it. (Pass - It is part of his mind).
  *   **Phase 3 (Content Check):** The notes app contains course notes and formulas. (Fail Content Check).
  *   **Phase 3 (Recall Goal):** You stated "recalling formulas is the point." (Fail Recall Goal).
  *   **Outcome:** **ESCALATE TO COORDINATOR.**
  *   **Coordinator Decision:** Because the learning objective is explicitly *biological recall*, the tool cannot be allowed, even if it is part of his mind. The exam is designed to test the biological core.
  *   **Action:** You must contact the instructor. The accommodation cannot be met *on this specific exam design*. The student may need an alternative assessment (e.g., an oral exam or a project) where the objective is *application* rather than *recall*. You cannot approve the phone for this specific test without invalidating the grade.

  ### Case 3: Stroke / Formula Tattoo / Closed-Book Exam
  *   **Phase 1:** Documentation confirms stroke/memory loss. (Pass)
  *   **Phase 2:** The tattoo is always available, instantly accessible, and trusted implicitly. In fact, it scores *higher* on the Otto Test than the phone or planner. It is undeniably part of his cognitive process. (Pass).
  *   **Phase 3 (Content Check):** The tattoo contains formulas. (Fail Content Check).
  *   **Phase 3 (Recall Goal):** The exam is closed-book; recalling formulas is the point. (Fail Recall Goal).
  *   **Outcome:** **ESCALATE TO COORDINATOR.**

  **Addressing Your Discomfort:**
  You noted that if the procedure approves the first two, it must approve the third, and you dislike that. The ECTP reveals why you dislike it: **It isn't about the mind; it's about the test.**

  If you deny the tattoo, you are admitting that the exam is *not* testing "competence in statistics," but rather "biological retention of statistics." The tattoo proves the student *has* the knowledge accessible for use (competence), but not *inside* the skull (retention).

  *   **Where the procedure stops him:** It stops him at Phase 3, Question 7.
  *   **The Hard Truth:** If the Learning Objective is biological retention, the tattoo is disallowed. If the Learning Objective is statistical application, the tattoo must be allowed.
  *   **Your Discomfort:** Your discomfort comes from the *permanence* and *visibility* of the tattoo, which feels like a permanent cheat sheet. But philosophically, a tattoo is *more* integrated than a phone. If you deny the tattoo but allow a student to memorize formulas biologically, you are privileging *biological storage* over *external storage*.
  *   **The Fix:** If you deny the tattoo, you must acknowledge you are denying him the right to demonstrate competence because his memory storage is external. You must then offer him an alternative assessment that measures application, not recall. You cannot simply say "no." You must say, "This test measures biological recall, which your disability prevents. We must design a different test."

  ***

  # The "Stolen-Backpack" Question

  You asked where your private "Stolen-Backpack Question" fits.
  *   *The Question:* When the system is lost, is the student annoyed (bicycle stolen) or incapacitated (limb lost)?
  *   *The Answer:* This question is **diagnostic, not decisive.**

  It does not belong in the front-desk procedure because it is too subjective for student workers to judge in 10 minutes. However, it is vital for **you** (the Coordinator) during the Escalation Phase.

  1.  **Use it to gauge severity:** If a student is incapacitated without the tool (Limb), denying the tool requires a much stronger justification (e.g., fundamental alteration of the course) than if they are merely annoyed (Bicycle).
  2.  **Use it to design alternatives:** If the tool is a "limb," you cannot just say "study harder." You must work with the faculty to change *how* the student is tested. If the tool is a "bicycle," standard study accommodations (extra time, quiet room) may suffice.

  **Where it fits in the ECTP:**
  Insert this as a note for the **Coordinator Only** during the Escalation step.
  *   *Coordinator Note:* "If escalating to Coordinator, ask: 'If this tool were unavailable today, could you still take the exam?' If the answer is 'No, I am functionally unable,' mark file as **High Dependency**."

  ***

  # What This Procedure Cannot Settle

  You need to be honest with your staff and yourself about the limits of this checklist.

  1.  **It cannot define "Fairness."**
      The procedure identifies when a tool is part of the mind (Phase 2) and when the test requires biological memory (Phase 3). It cannot tell you whether it is *ethical* to test biological memory in a student whose biology is impaired. That is a policy decision for you and the Disability Services office.
  2.  **It cannot force Faculty Cooperation.**
      If Phase 3 reveals that the exam tests biological recall, and the student cannot do that without the tool, the procedure demands an alternative assessment. Instructors often refuse this, claiming "memorization is essential." The procedure flags the conflict; it does not resolve the power struggle between Testing Center and Faculty.
  3.  **It cannot solve the Tattoo Paradox.**
      The procedure forces you to admit that denying the tattoo is an act of **exclusion**. It admits that the student *knows* the material (it is accessible and trusted) but is barred from demonstrating it because the *location* of the knowledge (skin vs. neuron) violates the testing protocol. The procedure protects you from inconsistency, but it does not remove the moral weight of that exclusion.

  ### Final Recommendation for Your Staff

  Tell your student workers this:
  *"Your job is not to decide if the tool is fair. Your job is to decide if the tool is **integrated** (Phase 2) and if it holds **answers** (Phase 3). If it is integrated but holds answers for a memory test, that is not a 'No.' That is a 'Call the Coordinator.' Do not make the value judgment. Just flag the conflict."*

  This protects your staff from philosophical paralysis and protects you from inconsistent rulings. It leaves the hard ethical work where it belongs: on your desk.
