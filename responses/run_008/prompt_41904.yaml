prompt: |-
  i write longform features for a science & ideas magazine, and a decent chunk of my beat is history of science — profiles of dead figures, anniversary pieces, "what we got wrong back then" stuff. i keep getting it from both sides: either i'm judging people in 1910 by 2025 standards (readers call this presentism, loudly) or i'm so busy contextualsing that the piece reads as an apologia. i gather the philosophy of history actually has things to say here — something about the difference between explaining a belief and excusing it, whether moral judgements across centuries can be true or false at all versus just expressing my attitude, and the historian's trick of judging people by the standards already available in their own time, which apparently lets you condemn without anachronism when it works. please turn whatever is solid in all that into a procedure i can run on my own drafts before filing: the questions to ask in order, what counts as a sufficient answer to each, where it comes back "fine, publish" versus "rewrite this paragraph", and where it has to admit the question is a values call no checklist can settle. then run it on two drafts: a piece on the well-respected biologists who lent credibility to the early 20th-century eugenics movement, and one on a victorian naturalist whose racial views were ugly even by victorian standards — which i suspect matters, but my editor keeps saying just leave it out. also tell me where the procedure will misfire, i'd rather hear it from you than the letters page. answer in british english, and keep it usable by someone who studied molecular biology, not wittgenstein
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Longform science/ideas magazine writer (history of science beat).
      *   **Problem:** Caught between "presentism" (judging past figures by modern standards) and "apologia" (excusing bad behavior via context).
      *   **Goal:** A practical procedure/checklist based on philosophy of history to evaluate drafts before filing.
      *   **Specifics:** Needs questions in order, criteria for sufficient answers, decision points (publish vs. rewrite vs. values call), application to two specific draft scenarios (eugenics-supporting biologists, Victorian naturalist with unusually ugly racial views), and limitations of the procedure.
      *   **Tone/Style:** British English, usable by a molecular biologist (not overly abstract/philosophical jargon), practical, actionable.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Presentism:* Judging the past solely by current moral standards. (Bad)
      *   *Relativism/Apologia:* Contextualising so much that moral judgement disappears. (Bad)
      *   *Internal Critique:* Judging figures by the standards *of their own time*. (Good/Middle Ground)
      *   *Explanation vs. Excuse:* Understanding *why* someone believed something doesn't mean it was *right*.
      *   *Moral Realism vs. Expressivism:* Are moral judgments true/false or just expressions of attitude? (The user asks about this, but for a practical checklist, we need to treat moral judgments as having weight without getting bogged down in meta-ethics).
      *   *Quentin Skinner/Contextualism:* The idea that you can critique an agent based on the normative vocabulary available to them.

  3.  **Develop the Procedure (The "Audit"):**
      *   Needs to be step-by-step.
      *   Needs to be concrete (not "Is this moral?" but "Did I show X?").
      *   Needs to distinguish between *scientific error* and *moral failing*.
      *   Needs to handle the "values call" (where philosophy stops and editorial judgement begins).

      *Drafting the Steps:*
      1.  *The Availability Test:* Was the counter-argument available to them?
      2.  *The Consensus Test:* Were they mainstream or outliers *then*?
      3.  *The Motivation Test:* Did the belief serve their career/status or was it incidental?
      4.  *The Consequence Test:* Did their actions cause harm that was recognisable then?
      5.  *The Relevance Test:* Does this matter to the science story I'm telling?

  4.  **Apply to Scenario 1: Respected Biologists & Eugenics (Early 20th Century):**
      *   *Context:* Eugenics was mainstream science then.
      *   *Application:* Harder to condemn on *scientific* grounds (by their standards), easier on *humanitarian* grounds (critics existed).
      *   *Verdict:* Needs nuance. Don't excuse, but explain the scientific logic while highlighting the ethical blind spots that were *also* visible then.

  5.  **Apply to Scenario 2: Victorian Naturalist & Ugly Racial Views:**
      *   *Context:* User says views were ugly *even by Victorian standards*. Editor says leave it out.
      *   *Application:* This triggers the "Availability Test" strongly. If contemporaries criticised them, the "context" defence fails.
      *   *Verdict:* Editor is likely wrong (or cautious). This is a case for inclusion because it breaks the "they didn't know better" shield.

  6.  **Identify Failure Modes (Where the Procedure Misfires):**
      *   *The "Great Man" Trap:* Focusing too much on individual morality obscures structural issues.
      *   *The "Whig History" Slide:* Still subtly framing history as progress towards us.
      *   *The "Both Sides" False Equivalence:* Giving equal weight to marginal dissenters just to make a point.
      *   *Reader Fatigue:* Over-qualifying every sentence makes for dull reading.

  7.  **Refine Tone and Language:**
      *   British English (e.g., "colour," "programme," "whilst," "filing," "letters page").
      *   Avoid heavy philosophy jargon (no "ontological commitments," "hermeneutic circle"). Use "available concepts," "contemporary critics."
      *   Keep it structured like a lab protocol or a peer-review checklist (appealing to the molecular biology background).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the tension. It's a classic historiographical problem (Skinner, Williams).
      *   *The Protocol:* Call it "The Contextual Integrity Audit."
      *   *Step 1 (Vocabulary):* Could they have said otherwise?
      *   *Step 2 (Peer Review):* What did *their* peers say?
      *   *Step 3 (Causality):* Did the belief drive the science or just sit alongside it?
      *   *Step 4 (Harm):* Was harm foreseeable?
      *   *Decision Matrix:* Green/Amber/Red.
      *   *The "Values Call":* Acknowledge where the checklist ends.
      *   *Scenario Analysis:* Run the two cases through the audit.
      *   *Failure Modes:* Be honest about limitations.

  9.  **Review against Constraints:**
      *   *British English?* Check.
      *   *Molecular Bio audience?* Keep analogies technical but accessible (e.g., "control group," "variable").
      *   *Address the specific philosophical points?* Yes (explanation vs. excuse, internal standards).
      *   *Two Drafts?* Yes.
      *   *Misfire warning?* Yes.

  10. **Final Polish:** Ensure the distinction between *scientific error* (wrong data) and *moral error* (wrong action) is clear, as this is often where science writers get stuck. (Self-Correction: Make sure to explicitly address the Editor's advice on the Victorian naturalist).

