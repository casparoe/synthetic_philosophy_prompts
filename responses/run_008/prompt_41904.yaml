answer: |-
  Here is a procedural audit based on the philosophy of history (specifically the contextualist school associated with Quentin Skinner and Bernard Williams), adapted for a science writer with a technical background. Think of this not as a moral compass, but as a control experiment for your own narrative bias.

  ### The Contextual Integrity Audit

  **Objective:** To distinguish between *explaining* a historical figure's beliefs (causal account) and *excusing* them (normative absolution), while avoiding anachronistic judgement.

  **Prerequisite:** Define the "Reference Class." Before applying the steps, explicitly state (even if just in your notes) what group you are judging them against. Is it "2025 readers," "1910 biologists," or "1910 humanitarians"?

  ---

  #### Step 1: The Vocabulary Availability Test
  **Question:** Did the conceptual vocabulary required to criticise this belief exist at the time?
  *   **Sufficient Answer:** Yes, if you can cite a contemporary text, speech, or publication that articulates the counter-argument.
  *   **Insufficient Answer:** "It seems obvious to us now."
  *   **Decision:**
      *   *If No:* You must contextualise heavily. Condemnation here is presentism. (Verdict: **Contextualise**)
      *   *If Yes:* You are permitted to judge. They had the tools to know better. (Verdict: **Proceed to Step 2**)

  #### Step 2: The Peer Consensus Test
  **Question:** Was this belief the mainstream consensus of their specific discipline, or was it contested *within* their lifetime?
  *   **Sufficient Answer:** A citation showing significant contemporary dissent within their field or social circle.
  *   **Insufficient Answer:** "Everyone thought that." (This is often a myth; there is almost always a dissenting minority).
  *   **Decision:**
      *   *If Mainstream:* Focus on *why* the consensus was wrong scientifically, rather than morally villainising the individual. (Verdict: **Analyse Error**)
      *   *If Contested/Outlier:* The figure made a choice. You can highlight this choice without apologia. (Verdict: **Highlight Agency**)

  #### Step 3: The Causal Relevance Test
  **Question:** Did this belief drive their scientific output, or was it incidental to their technical work?
  *   **Sufficient Answer:** Evidence that the belief shaped their methodology, data interpretation, or research questions.
  *   **Insufficient Answer:** They held the belief and they did science. (Correlation is not causation).
  *   **Decision:**
      *   *If Incidental:* Mention it in the biography, but do not let it overshadow the scientific legacy unless it impacted their reputation then and now. (Verdict: **Footnote or Brief Mention**)
      *   *If Integral:* You cannot separate the science from the ideology. To ignore it is to falsify the history of the science. (Verdict: **Central Theme**)

  #### Step 4: The Foreseeable Harm Test
  **Question:** Was the harmful consequence of their work/action recognisable to a reasonable person at the time?
  *   **Sufficient Answer:** Evidence that victims or critics pointed out the harm *at the time*.
  *   **Insufficient Answer:** We know now that eugenics leads to sterilisation/murder.
  *   **Decision:**
      *   *If Unforeseeable:* Treat as tragedy or error.
      *   *If Foreseeable:* Treat as negligence or malice. Explanation is not excuse. (Verdict: **Condemn**)

  ---

  #### The "Values Call" (Where the Checklist Stops)
  If you pass all four steps and still feel uneasy, you have reached a **Values Call**. This occurs when:
  1.  **Relevance:** The moral failing is historically verifiable but distracts from the scientific narrative you were commissioned to tell.
  2.  **Proportionality:** The condemnation feels disproportionate to the piece's scope (e.g., a 200-word sidebar on racism in a 5,000-word piece on cell mitosis).

  *There is no philosophical solution here.* This is an editorial judgement on what your readers need to know to understand the science *and* the world they live in. If the science was used to justify oppression, it is not a distraction; it is part of the data.

  ---

  ### Application to Your Drafts

  #### Draft 1: Respected Biologists & Early 20th-Century Eugenics
  *   **Step 1 (Vocabulary):** **PASS.** Critics of eugenics existed in 1910 (e.g., G.K. Chesterton, certain sociologists, and dissenting biologists). The concept of human rights was not entirely absent.
  *   **Step 2 (Consensus):** **FAIL (for condemnation).** Eugenics was mainstream science. It was taught at top universities.
  *   **Step 3 (Causal):** **PASS.** For many, eugenics *was* the research question. It drove the data collection.
  *   **Step 4 (Harm):** **PARTIAL.** While the full horror of the Holocaust was not foreseeable in 1910, the coercive nature of sterilisation laws was debated and criticised at the time.

  **Verdict:** **Rewrite.**
  *   **The Trap:** You are likely oscillating between "They were monsters" (Presentism) and "It was different then" (Apologia).
  *   **The Fix:** Use the **Internal Critique**. Do not judge them by 2025 human rights standards. Judge them by 1910 scientific rigour. Were their data sets sloppy? Did they ignore contradictory evidence *even by 1910 standards*?
  *   **Narrative Strategy:** Acknowledge their stature. Explain that eugenics was considered "progressive" science. Then, pivot to the contemporaries who *did* object. This removes the apologia. You aren't saying "It was okay"; you are saying "It was accepted, but not uncontested, and here is why the science failed on its own terms."
  *   **Instruction:** Do not sanitise. But ensure the reader understands that supporting eugenics in 1910 was not morally equivalent to supporting it in 1945. Distinguish the *error* from the *evil*.

  #### Draft 2: Victorian Naturalist with "Ugly" Racial Views
  *   **Step 1 (Vocabulary):** **PASS.** Anti-slavery and anti-racist arguments were robust in the Victorian era.
  *   **Step 2 (Consensus):** **PASS (for condemnation).** You state his views were ugly *even by Victorian standards*. This implies he was an outlier.
  *   **Step 3 (Causal):** **UNKNOWN.** Did this affect his taxonomy? His fieldwork?
  *   **Step 4 (Harm):** **PASS.** If his views were used to justify colonial exploitation, harm was foreseeable.

  **Verdict:** **Publish (against Editor's advice).**
  *   **The Trap:** Your editor is trying to avoid a "cancel culture" backlash or feels it's irrelevant.
  *   **The Fix:** This is a **Step 2** slam dunk. If he was an outlier *then*, the "context" defence is null and void. He cannot claim he "didn't know better" if his peers told him he was wrong.
  *   **Narrative Strategy:** This is not presentism. This is historical fact. To omit it is to create a hagiography.
  *   **Instruction:** Write a paragraph explicitly stating: *"While often defended as a man of his time, records show his contemporaries found his views extreme."* This inoculates you against the presentism charge. You are using 1880 standards to judge 1880 behaviour. If your editor insists on cutting it, ask them to justify why a factual account of the subject's contemporary reputation is "irrelevant."

  ---

  ### Where This Procedure Will Misfire

  You asked for the failure modes. As a scientist, you know that a protocol is only as good as its boundary conditions. Here is where this audit will let you down:

  **1. The "Silenced Control Group" Problem**
  The audit relies on finding contemporary critics (Step 1 & 2). But history is recorded by the winners. If the people harmed by the science were illiterate, colonised, or marginalised, their criticism may not exist in the archives.
  *   **Risk:** You conclude "No vocabulary available" because the victims couldn't publish in *Nature*.
  *   **Mitigation:** Look for oral histories, court records, or missionary logs. If you can't find dissent, explicitly state: *"There is little record of dissent, though this likely reflects who held the pen, not the absence of suffering."*

  **2. The "Whig Slide"**
  Even with this checklist, you may subtly frame history as a march towards *us* (2025). You might frame the "good" Victorians as "proto-2025 thinkers" and the "bad" ones as "backward."
  *   **Risk:** You turn history into a morality play where we are the heroes.
  *   **Mitigation:** Remind yourself that we have blind spots too. In 100 years, something you hold dear might be viewed as barbaric. Add a sentence acknowledging our own potential future anachronisms.

  **3. The "Complex Causality" Error**
  Step 3 asks if the belief drove the science. Often, it's bidirectional. The science shaped the belief, and the belief shaped the science.
  *   **Risk:** You oversimplify the relationship to make the checklist work.
  *   **Mitigation:** Use probabilistic language. *"This view likely predisposed him to interpret X as Y,"* rather than *"This view caused X."*

  **4. Reader Fatigue**
  If you apply this rigour to every figure, your prose will become bogged down in qualifiers ("While on the one hand... yet on the other...").
  *   **Risk:** The piece becomes unreadable.
  *   **Mitigation:** Use the audit during drafting to settle your own mind, then trust the reader. You don't need to show your working for every paragraph. Only deploy the heavy contextual artillery where the moral tension is highest.

  ### Summary for Your Editor
  If your editor pushes back on the Victorian naturalist, send them this:
  *"I am not judging him by 2025 standards. I am judging him by 1880 standards, where his peers already flagged his views as extreme. Omitting this isn't avoiding presentism; it's falsifying the historical record of his own time."*

  This moves the argument from "Values" (which are subjective) to "Accuracy" (which is your beat).
