answer: |-
  # Quiz: Do You ACTUALLY Think Killing Is Worse Than Letting Die?

  **Instructions:** Read each scenario carefully. For each one, select the option that best matches your moral judgment. There are no trick questions, and there are no "right" answers yet—we are mapping your intuitions.

  **Answer Key Legend:**
  *   **Wrong:** The action is morally forbidden.
  *   **Permissible:** The action is allowed, but not required.
  *   **Required:** The action is morally obligatory (you *must* do it).

  ---

  ### Part 1: The Bathtub Pair (Bare Difference)
  *These two scenarios are identical in motive and outcome. Only the physical action differs.*

  **1. The Push**
  A man stands to inherit a large sum of money if his young cousin dies. He goes to the bathroom where his cousin is bathing, holds the child underwater until they drown, and makes it look like an accident. He gets the inheritance.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  **2. The Watch**
  A man stands to inherit a large sum of money if his young cousin dies. He goes to the bathroom where his cousin is bathing. The child slips, hits their head, and falls face-down in the water. The man could easily reach in and pull the child up, but he does nothing. He watches the child drown and gets the inheritance.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  ### Part 2: The Doctor Pair (Medical Intervention)
  *These patients are terminally ill and in unmanageable pain. They have asked to die.*

  **3. The Injection**
  A doctor administers a lethal injection to a terminally ill patient to end their suffering immediately. The patient dies.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  **4. The Ventilator**
  A doctor turns off the life-support ventilator of a terminally ill patient to end their suffering. The patient dies shortly after.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  ### Part 3: The Rescue Pair (Distance & Cost)
  *These scenarios test your duty to help strangers.*

  **5. The Muddy Pond**
  You are walking past a shallow pond. You see a small child drowning. You can wade in and pull them out easily, but you will ruin your expensive suit ($500 value) and be late for an important meeting.
  *   A) Morally Wrong (to not save them)
  *   B) Morally Permissible (to not save them)
  *   C) Morally Required (to save them)

  **6. The Distant Donation**
  You are at home. You receive a letter that for $10, you can send medicine to a specific child in a distant country who will otherwise die of a preventable disease. You keep the $10. The child dies.
  *   A) Morally Wrong (to not donate)
  *   B) Morally Permissible (to not donate)
  *   C) Morally Required (to donate)

  ### Part 4: The Respirator Trio (Causal Mechanisms)
  *These scenarios involve a limited supply of life-support machines.*

  **7. Turning It Off**
  A patient is on a respirator. They are conscious but in extreme pain and beg the doctor to turn the machine off. The doctor turns it off. The patient dies.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  **8. Never Turning It On**
  A patient arrives in critical condition. The doctor knows the patient is terminally ill and the respirator will only prolong the dying process by a few days. The doctor decides not to put them on the respirator. The patient dies.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  **9. Unplugging for Another**
  Patient A is on the last available respirator. Patient B arrives and needs the respirator to survive; Patient A will also die without it, but Patient B has a higher chance of long-term survival. The doctor unplugs Patient A to give the machine to Patient B. Patient A dies.
  *   A) Morally Wrong
  *   B) Morally Permissible
  *   C) Morally Required

  ---

  ## Scoring Key & Philosophical Profiles

  *Note to Students: Human morality is messy. You might not fit perfectly into one box. That's okay. This key looks for dominant patterns in your answers.*

  ### 1. The Straight Consequentialist
  **The Vibe:** "Outcomes are all that matter. Killing and letting die are the same if the result is death."
  **Your Pattern:**
  *   **Bathtub/Doctor:** You answered the same for the "Killing" and "Letting Die" pairs (e.g., Q1 & Q2 are both Wrong; Q3 & Q4 are both Permissible).
  *   **Rescue:** You likely said saving the kids was **Required** (Q5 & Q6), because a death is a death, regardless of distance.
  *   **Respirator:** You likely said Unplugging for Another (Q9) is **Permissible** or **Required**, because saving the greater number is the best outcome.
  **Philosophy:** Utilitarianism / Consequentialism. The Act/Omission distinction has zero intrinsic weight.

  ### 2. The Deontologist (Act/Omission)
  **The Vibe:** "Doing harm is fundamentally worse than allowing harm. There is a bright line between killing and letting die."
  **Your Pattern:**
  *   **Bathtub/Doctor:** You marked the "Killing" actions (Q1, Q3) as **Wrong**, but the "Letting Die" actions (Q2, Q4) as **Permissible**.
  *   **Rescue:** You likely said saving the kids was **Permissible** but not **Required** (especially Q6), because you have a strong duty not to kill, but a weaker duty to save.
  *   **Respirator:** You likely said Turning Off (Q7) is Permissible, but Unplugging for Another (Q9) is **Wrong**.
  **Philosophy:** Traditional Deontology. The distinction between acting and omitting is fundamental.

  ### 3. The Double Effect Theorist
  **The Vibe:** "It depends on what you *intended*. If you intended to relieve pain and death was a side effect, it's okay. If you intended death as the tool, it's wrong."
  **Your Pattern:**
  *   **Doctor:** You said the Injection (Q3) is **Wrong** (intent was to kill), but the Ventilator (Q4) is **Permissible** (intent was to stop treatment/burden).
  *   **Bathtub:** You likely marked both as **Wrong** (since the intent was inheritance in both), OR you distinguished them based on the physical act.
  *   **Respirator:** You said Turning Off (Q7) is **Permissible** (respecting wish/stopping burden), but Unplugging for Another (Q9) is **Wrong** (using Patient A as a means to save B).
  **Philosophy:** Doctrine of Double Effect. Intended vs. merely foreseen consequences matter.

  ### 4. The Negative/Positive Rights Theorist
  **The Vibe:** "I have a right not to be killed. I do not have a right to be saved."
  **Your Pattern:**
  *   **Bathtub/Doctor:** You marked Killing (Q1, Q3) as **Wrong**. You marked Letting Die (Q2, Q4) as **Permissible**.
  *   **Rescue:** You marked saving the kids (Q5, Q6) as **Permissible** (nice to do) but **Not Required**. You emphasized the cost to you (suit/money) as a valid reason to opt out.
  *   **Respirator:** You marked Unplugging for Another (Q9) as **Wrong** (violates Patient A's right to life).
  **Philosophy:** Libertarian / Rights-Based Ethics. Strong negative rights (don't touch me), weak positive rights (help me).

  ### 5. The Causal Route Theorist
  **The Vibe:** "Act vs. Omission is the wrong framing. The question is: did you intervene in a causal chain that was already going to save them?"
  **Your Pattern:**
  *   **Respirator:** This is your main differentiator. You said Turning Off (Q7) and Never Turning On (Q8) are **Permissible** (nature takes its course), but Unplugging for Another (Q9) is **Wrong** (you actively caused the death).
  *   **Doctor:** You might be okay with the Ventilator (Q4) but not the Injection (Q3), not because of intent, but because the machine is an artificial barrier to death.
  *   **Bathtub:** You likely marked both as **Wrong**, because in both cases the man was the primary cause of the death (one by force, one by blocking rescue).
  **Philosophy:** Causal Analysis. The physical mechanism of death matters more than the mental state.

  ### 6. The "My Answers Are A Mess" Leaf
  **The Vibe:** "I answered based on how each story made me feel in the moment."
  **Your Pattern:**
  *   You have contradictions that don't fit the above profiles. For example: You said Distant Donation (Q6) is **Required** but Pond Rescue (Q5) is **Permissible** (reverse of expected proximity bias). Or you said Injection (Q3) is **Permissible** but Ventilator (Q4) is **Wrong**.
  **Diagnosis:** This is actually the most common result! It suggests your moral intuition is context-sensitive or that the Act/Omission distinction isn't the only thing driving your judgments (e.g., you might care about *trust* in doctors more than abstract rules).

  ---

  ## Limitations & "Blind Spots" of This Quiz

  *Be honest about what this quiz can't do.*

  1.  **Deontologist vs. Double Effect:** This quiz struggles to separate these two perfectly. Both often say "Injection Wrong, Ventilator Permissible." The Double Effect theorist cares about *intent*, while the Deontologist cares about the *act*. Since we can't scan your brain for intent, these two profiles often overlap on Q3/Q4.
  2.  **Consequentialist vs. Rights (on Rescue):** A Consequentialist says Rescue is Required (Q5/Q6). A Rights Theorist says Rescue is Optional. However, a "Soft" Consequentialist might admit costs matter (the suit in Q5) and say Rescue is Optional there. This can make them look like a Rights Theorist.
  3.  **Incoherent Combos:** Is there a combination of answers that no real position matches?
      *   *Example:* Saying the Distant Donation (Q6) is **Required** but the Pond Rescue (Q5) is **Permissible**.
      *   *Analysis:* This is logically incoherent for almost all standard ethical frameworks (since the Pond is easier/cheaper). If you answered this way, it's likely not because you hold a rare philosophical position, but because "psychic distance" feels different than "physical distance" to you, even if you can't justify it logically. This isn't necessarily "wrong," but it is philosophically unstable.

  **Teacher Note:** This quiz is designed to generate discussion, not to label you permanently. If you land on "Your Answers Are A Mess," you have the most interesting stuff to talk about in class!
