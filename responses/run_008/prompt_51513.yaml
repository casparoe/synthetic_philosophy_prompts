prompt: |-
  So for my junior year ethics elective we just started the unit on euthanasia and end-of-life stuff, and the whole killing vs. letting die debate has honestly been living in my head rent free since monday. Our teacher said something like "basically everyone thinks theres a huge moral difference between actively killing someone and letting them die, but philosophers have spent like fifty years trying to demolish that intuition, and nobody can agree whether they succeeded," and now I want to test this on my actual classmates instead of just arguing about it. So I'm building an online quiz for our class forum, working title "do you ACTUALLY think killing is worse than letting die, or do you just think you do," and I need help writing the whole thing.

  Here's the spec. Nine questions total, and every question has to be a concrete scenario with 2 or 3 multiple choice answers where you say what the person did was wrong / permissible / required — never a question that just asks people to pick a philosophical label, because the whole point is sorting people by their reactions to cases they can't pre-google. Some scenarios that MUST be in there: a bare-difference pair like the famous bathtub case from James Rachels (one guy drowns his cousin for the inheritance, another guy watches his cousin slip in the tub, could easily flip the circuit breaker or something, and just lets it happen for the exact same inheritance); a doctor who gives a lethal injection to a terminally ill patient in unmanageable pain vs. a doctor who withholds the same patient's life support so they die sooner; a drowning kid in a shallow pond you could wade in and save vs a kid dying somewhere far away because nobody donated like ten dollars; a case where not rescuing costs you something real (like maybe your own arm breaks or you'll definitely get sued); and a respirator case with three flavors — turning a machine off, never turning it on, and unplugging one patient because a different patient needs the machine to survive. Fill in the rest however you think covers the logical space best.

  Then the scoring key: map answer patterns onto at least these five positions as the leaves — the straight consequentialist who thinks the act/omission distinction carries zero intrinsic weight; the deontologist who thinks doing vs. allowing is fundamental all by itself; the person for whom the real work is done by intended vs. merely foreseen deaths (double effect flavored, so they're fine pulling a switch but not using one death as the means to save others); the negative/positive rights person who thinks we have strong duties not to kill but only weak or optional duties to rescue; and the finicky position that says the act/omission framing is just wrong and it's the causal route that matters (killing by switching off can be more like letting die, etc.). Also add a "your answers are a mess, you don't hold one position" leaf because honestly that's probably me. For each leaf say which combo of answers puts you there, and importantly, flag any pair of positions the quiz genuinely can't separate no matter how you write the questions, instead of pretending it can. Also note if there's some combination of answers that no real position matches, and say whether you think that's because the combo is incoherent or just unexplored. Keep the scenarios self-contained so someone with zero philosophy background can take it, and please make the bathtub pair not too graphic, my teacher has to approve the post lol. Also alot of my classmates will answer fast so no trick questions that only work if you read them three times.
