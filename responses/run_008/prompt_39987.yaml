answer: |-
  **Mercy General Reports 14% Mortality Increase, Calls It 'Statistical Victory'**

  **OAK CREEK**—Mercy General Regional Hospital issued a triumphant press release Tuesday announcing that while overall patient mortality rose 14% year-over-year, the hospital is technically improving faster than ever before.

  According to the report, raw hospital-wide mortality climbed from 10.5% to 12.0% since the opening of the new Level II Trauma Center. However, communications director Brenda Shull emphasized that this aggregate figure is "misleadingly conservative" compared to the "average of averages," which shows declines across every distinct patient subgroup.

  "When you look at the General Ward, mortality dropped from 10% to 9%," Shull said, pointing to a slide deck. "In Trauma, it fell from 20% to 19%. Every age band, every severity tier, every department is safer. The only thing that died was the denominator's composition."

  The reversal is driven by a strategic shift in case mix. Last year, Trauma admissions comprised only 5% of total volume; this year, following the center's opening, Trauma cases accounted for 30% of all admissions. Because Trauma patients carry a higher baseline risk than General Ward patients, treating more of them increased the overall death rate, even as survival odds improved within both groups.

  Dr. Aris Thorne, Mercy's Head of Analytics, nearly clarified the distinction between descriptive statistics and causal inference before catching himself.

  "Essentially, we changed the question we were asking," Thorne said. "Last year we asked, 'How do we keep people alive?' This year we asked, 'How do we keep people alive while accepting significantly sicker people?' Both answers are true. The board simply voted to report the metric that is most patient-centered for Q3, which happens to be the unweighted mean of subgroup improvements."

  State Health Department statistician Ellen Vogt reviewed the data and offered a deadpan assessment. "This is a textbook Simpson's Paradox," Vogt said. "The marginal distribution of admission severity shifted so drastically that it masked the conditional improvements. The aggregate rate is descriptive of the population you treated, not the quality of care."

  Her comments were incorporated into Mercy's press release within the hour. "State Statistician Confirms Mortality Reversal Is Due to Successful Case Mix Expansion," the second paragraph read.

  Families seem receptive to the nuanced messaging. "They saved my dad," said Gary Loomis, whose father was treated in the General Ward. "Statistics can't save everyone, but I'm glad they're counting the ones they did in the way that looks best on a brochure."

  When asked if next quarter's report might prioritize the aggregate rate if it improves, Shull smiled. "We remain committed to data integrity," she said. "Which means selecting the aggregation level that best reflects our mission statement."
