answer: |-
  You have independently rediscovered the central debate in the philosophy of science from the last 50 years. Your roommate is arguing for the **Pessimistic Meta-Induction (PMI)**, most famously articulated by Larry Laudan. His argument is: "History shows a graveyard of successful but false theories (phlogiston, ether, caloric); therefore, our current successful theories are probably false too."

  Your gut is arguing for a nuanced version of **Scientific Realism**, specifically leaning toward **Structural Realism** (championed by John Worrall) and **Entity Realism** (championed by Ian Hacking).

  You are looking for a principle that avoids the "cheat" of defining truth as "whatever survives." You want to know if there is a way to identify the "real part" *before* the future arrives, and whether your skepticism about quarks is justified.

  Here is the principle, the verdict on quarks, and the answer to your roommate.

  ### 1. The Principle: Causal-Structural Invariance

  The "obvious candidate" you rejected (a theory is true if its posits exist) fails because it conflates **ontology** (what the stuff *is*) with **causal role** (what the stuff *does*).

  The non-cheaty principle that sorts your list is **Causal-Structural Invariance**. A theoretical posit is "true-ish" (reference preserving) if:
  1.  **Causal Role:** It is assigned a specific causal job in the theory (e.g., "carries heat," "transmits light," "determines heredity").
  2.  **Manipulability:** We can interact with it in ways not fully dictated by the theory (e.g., we can spray electrons, measure gene frequencies).
  3.  **Invariance:** When the theory is superseded, that *specific causal job* and the *mathematical structure* describing it are preserved, even if the ontological description changes.

  This avoids the "cheat" because we aren't looking at what survived and calling it real; we are looking at whether the *functional mechanism* posited by the old theory actually mapped onto a mechanism in the world, even if they got the name wrong.

  **Applying it to your list:**

  *   **Phlogiston (False):** Its causal role was "substance released during combustion." The successor theory (Oxygen) posits a substance *absorbed* during combustion. The causal direction is reversed. The structure does not map. **Verdict: Dead.**
  *   **Caloric (Structurally True):** Its causal role was "flow from hot to cold drives work." Thermodynamics kept the math of the flow and the engine efficiency limits (Carnot), but changed the ontology from "fluid" to "kinetic energy." **Verdict: Structure preserved, Ontology swapped.**
  *   **Ether (Structurally True):** Its causal role was "medium supporting wave propagation." Maxwell's equations (the structure) were kept; the medium (the ontology) was discarded. Light waves remained, the "ocean" they waved in vanished. **Verdict: Structure preserved, Ontology swapped.**
  *   **Dalton's Atoms (Entity True):** Causal role: "Discrete units of matter with specific weights." The weights were wrong, the hooks were wrong, but the "discrete unit" ontology was preserved. **Verdict: Ontology preserved.**
  *   **Mendel's Genes (Entity True):** Causal role: "Discrete inheritable factors that segregate." DNA is the substrate, but the "discrete factor" ontology holds. **Verdict: Ontology preserved.** (Don't drop this one; it fits the principle better than Phlogiston).
  *   **Epicycles (Instrumental):** Causal role: None. It was explicitly mathematical bookkeeping. Ptolemy wasn't claiming "there is a crystal sphere here," he was saying "calculate the position this way." **Verdict: Never claimed to be true.**

  ### 2. Electrons vs. Quarks: Is it just vibes?

  Your skepticism about quarks is **not just vibes**. It is a recognized distinction in philosophy of physics, often centered on **Confinement**.

  *   **Electrons:** They satisfy **Hacking's Criterion** ("If you can spray it, it's real"). We can trap a single electron in a Penning trap. We can measure its charge and mass independently of the Standard Model. We can bounce things off it. It behaves like a distinct "thing" that persists through theory changes (from Thomson to Dirac to QED).
  *   **Quarks:** They are **confined**. You cannot isolate a quark. You never see a "free" quark. They only exist as mathematical constituents within hadrons (protons/neutrons). While Deep Inelastic Scattering suggests there are "point-like things" inside protons, quarks feel much more like *structural necessities of the math* (symmetry groups like SU(3)) than independent entities.

  **The Verdict:** Your gut is tracking **Asymptotic Freedom**. Electrons are asymptotically free (can be isolated); Quarks are not.
  *   **Electrons:** High confidence in Entity Realism.
  *   **Quarks:** High confidence in Structural Realism, low confidence in Entity Realism.

  So, keep the distinction. It is philosophically defensible to say, "I believe the *structure* of QCD is true, but I am agnostic on whether quarks are 'things' in the same way electrons are."

  ### 3. Does this answer your roommate?

  This is the tricky part. You asked if this principle just concedes the point with extra steps.

  **The Concession:**
  You must concede to your roommate that **Ontological Realism** is likely false. He is right that in 300 years, they will laugh at our list of "fundamental particles." They might say, "They thought electrons were little balls? How cute. It's actually a vibration in a 12-dimensional brane." Our *catalog of stuff* will change.

  **The Refutation:**
  However, you refute his claim that **Scientific Knowledge** is discarded.
  If the PMI were totally true, science would be a series of disjointed mistakes. But it isn't. It's cumulative.
  *   We still use Carnot's engine math (from Caloric).
  *   We still use Maxwell's equations (from Ether).
  *   We still use Mendel's ratios.

  The principle of **Causal-Structural Invariance** allows you to tell your roommate:
  > "You are right that our *picture* of the furniture of the universe will change. But you are wrong that our *maps* of how the furniture moves are worthless. We aren't getting closer to the 'true ontology,' but we are getting closer to the 'true structure.' Phlogiston was a wrong map. Oxygen was a better map. But Caloric wasn't a wrong map of engine efficiency; it was a right map with the wrong legend."

  ### 4. Summary for the Bathroom Argument

  If you want to win the argument without sounding like a textbook, here is the synthesis:

  1.  **Distinguish "Stuff" from "Structure."** Tell your roommate: "You're conflating the *noun* with the *verb*."
      *   **Nouns (Ontology):** Electrons, Quarks, Genes, Ether. (These get swapped out).
      *   **Verbs (Structure):** Charge, Conservation, Wave Equations, Segregation Ratios. (These accumulate).
  2.  **The "Cheat" Defense.** To prove you aren't just retroactively defining truth: Point to **manipulation**. We didn't decide electrons were real because the theory survived; we decided the theory survived because we could *build TVs* using electrons before we fully understood the theory. Phlogiston couldn't build anything; it could only explain ash.
  3.  **The Quark Hedge.** Admit your uncertainty about quarks. It shows intellectual honesty. "I believe in electrons because I can trap one. I believe in quarks because the math breaks without them, but I admit they might turn out to be mathematical artifacts rather than little balls."

  **Final Verdict:** Your roommate is a **Pessimistic Meta-Inductivist**. You are a **Structural Realist**. He is right that our *ontology* is provisional. You are right that our *knowledge* is cumulative. The principle that saves you is **Structural Continuity**, not "Existence of Posits." And your hesitation on quarks is scientifically literate, not just a vibe.
