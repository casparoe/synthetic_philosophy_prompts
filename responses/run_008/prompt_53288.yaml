answer: |-
  To our colleagues and students,

  We are writing this joint statement to clarify the state of our ongoing debate regarding moral responsibility and the reactive attitudes. After two years of discussion in seminars and colloquia, we have agreed to formalize where we stand, not to announce a resolution, but to map the battlefield with precision. We want to record what we agree on, where we genuinely differ, and what specific evidence or argument would be required to move either of us from our current position. This document serves as a public commitment to those cruxes, ensuring that our future disagreements are productive rather than repetitive.

  The first claim both of us sign is that the reactive attitudes, such as resentment and indignation, are responses to the quality of will displayed by an agent. We agree that when we feel resentment toward someone who harms us, we are responding to something about their regard for us, whether that be ill will, indifference, or a lack of due care. We also agree on the scope of the revisionist proposal. The skeptic among us is not asking to eliminate all practices of holding people accountable, nor is he suggesting we treat dangerous individuals without restraint. He is specifically arguing against the justification of blame grounded in basic desert, proposing instead that we retain accountability practices solely for their forward-looking consequences, such as protection, reconciliation, and moral formation. Furthermore, we agree on how to treat standard cases in practice. In the case of the ordinary non-manipulated wrongdoer who knew exactly what he was doing and acted freely in the compatibilist sense, we both agree that some form of moral protest is appropriate and that social sanctions may be applied. We do not differ on the behavioral output in routine scenarios; we differ on the underlying justification for that output.

  Where we disagree on the normative status of these attitudes, the Strawsonian maintains that the reactive attitudes are constitutive of ordinary interpersonal life and that their justification is internal to that practice. She holds that nothing we learn about determinism or causation gives us a reason to revise these attitudes, because to abandon them would be to abandon the relationships themselves. The skeptic contends that the reactive attitudes presuppose a kind of control that is incompatible with a deterministic universe, and therefore they are ultimately unjustified. He argues that we ought to revise our practices to align with the truth of our causal situation, replacing hot attitudes like resentment with cooler substitutes like sorrow, regret, and a resolve to communicate wrongs without invoking basic desert. Regarding the word deserves, we acknowledge a likely verbal dispute that nonetheless tracks a substantive divide. The Strawsonian uses deserves to mean entitlement to blame within the human practice of holding responsible, while the skeptic refuses to count that as desert at all, reserving the term for a basic, non-consequentialist merit that he believes does not exist. We note this terminological divergence but agree that it does not dissolve the disagreement, because the skeptic still argues that the practice itself is rationally unstable even if we redefine the terms, while the Strawsonian argues that the practice is self-justifying regardless of metaphysical baggage.

  The first crux we have identified concerns the functional equivalence of the attitudes. The question is whether resentment and indignation do any work that the cooler substitutes could not do. The Strawsonian predicts that the hot attitudes communicate a demand for respect and a recognition of status that sorrow and hope for change cannot make. She argues that without the sting of resentment, the wrongdoer does not feel the full weight of the moral claim being made against them, and the victim does not feel their own status as a rights-bearer is being upheld. The skeptic predicts that the cooler substitutes can achieve all the valuable goods of the hot attitudes, such as moral communication and protection of values, without the ethical cost of believing in basic desert. He argues that one can firmly reject a wrong and demand change through sorrow and resolve without invoking the retributive element inherent in resentment. If it were demonstrated that communities operating on purely forward-looking attitudes suffered higher rates of recidivism or lower levels of perceived justice, the skeptic would concede ground. Conversely, if it were shown that resentment is indispensable for securing equal moral status, the Strawsonian would view this as vindication, while the skeptic would be forced to argue that we must sacrifice that status for metaphysical accuracy.

  The second crux concerns whether the hot attitudes can survive the kind of reflection the skeptic prescribes, specifically regarding the causal history of the agent. We have agreed to focus on a concrete case where you learn the full causal story of someone who did you real harm, a genuinely good biography that makes the harm intelligible without excusing it in the usual sense of ignorance or coercion. The question is whether knowing the story reliably attenuates the resentment. The Strawsonian predicts that knowing the causal story often does not diminish resentment, or that where it does, it is because the quality of will dimmed in your eyes. She holds that understanding why someone acted badly does not necessarily change the fact that they acted badly toward you, and thus the reactive attitude remains fitting. The skeptic predicts that understanding the full causal story is the first step of the revision he wants and will reliably attenuate resentment for those who reflect deeply enough. He argues that once you see the harm as the inevitable outcome of prior causes, the target of resentment dissolves, leaving only sorrow for the outcome. If empirical study showed that deep understanding of causal histories consistently extinguished resentment even in cases of clear ill will, the Strawsonian would have to explain why this attenuation is a mistake rather than a correction. If study showed that resentment persists stubbornly despite full causal knowledge, the skeptic would have to explain why we should retain an attitude that survives reflection on the truth of determinism.

  We sign this statement to hold ourselves accountable to these specific predictions and distinctions. We agree that if the functional crux is settled against the skeptic, he must revise his proposal to accommodate the indispensability of the hot attitudes. We agree that if the reflective stability crux is settled against the Strawsonian, she must acknowledge that the practice is vulnerable to metaphysical insight. Until then, we continue to teach the dispute as live, substantive, and unresolved. We hope this clarity helps our students see that the disagreement is not about whether to hold people accountable, but about what that holding consists in and whether it can survive a clear-eyed view of the world. We remain committed to finding the evidence that settles these cruxes, and until then, we agree to disagree with precision.
