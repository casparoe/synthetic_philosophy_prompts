  **THE DAVE & MATE ACCORD ON SELF-DECEPTION**
  **Version 1.0 – For Joint Signature**

  **Preamble**
  This document summarises the current state of the debate between the undersigned parties (hereafter "The Nurse" and "Dave"). It is the result of an adversarial collaboration intended to clarify where we agree, where we disagree, and what evidence would actually change our minds. We acknowledge that this argument has been ongoing for approximately three years, primarily in pub settings and via text message, centreing on the case of The Nurse's friend's uncle (the smoker) and similar cases of avoidance.

  ***

  ### 1. AGREED CLAIMS
  *Points on which both The Nurse and Dave concur.*

  1.  **The Phenomenon is Real:** We both agree that the *behaviour* in question exists. People do ignore medical advice, avoid looking at bank statements when money is tight, and refuse to acknowledge signs of a partner's infidelity. We are not arguing about whether people ignore uncomfortable truths; we are arguing about what to call the mechanism.
  2.  **Standard Deception:** We agree that when Person A deceives Person B, Person A must know (or believe) the truth, intend to hide it, and successfully cause Person B to believe a falsehood.
  3.  **The Mind is Not a Single Unit:** We agree that the human brain is not one single, perfectly logical voice. It is made of competing systems (e.g., emotional impulses vs. logical planning, conscious thought vs. unconscious habit). This makes it possible to hold conflicting urges or thoughts without exploding.
  4.  **No Magic:** We agree that no supernatural or magical process is happening. The smoker is not violating the laws of physics or logic; he is processing information in a way that leads to a harmful outcome.
  5.  **The Difficulty:** We agree the topic is difficult because we cannot directly observe another person's internal belief state. We can only judge by their actions and words, both of which can be faked or misinterpreted.

  ***

  ### 2. DISAGREEMENTS
  *Specific points of contention. Wording has been negotiated to ensure neither side feels strawmanned.*

  | Topic | The Nurse's Position (Self-Deception is Real) | Dave's Position (Deflationism / Bias-Only) |
  | :--- | :--- | :--- |
  | **The Mechanism** | There is an active, goal-directed process where the mind works to keep a specific truth out of conscious awareness. It functions like a cover-up operation. | There is no active "cover-up." There is only ordinary biased thinking: giving more weight to good news, forgetting bad news, and not bothering to think too hard. |
  | **Intentionality** | The process involves a kind of intention, even if it isn't spoken or fully conscious. The mind *aims* to not know. | Intention requires a conscious agent. You cannot intend to do something (hide a truth) without knowing what it is you are hiding. Therefore, no intention is present. |
  | **The Belief State** | The self-deceived person genuinely comes to believe the falsehood (e.g., "I won't get cancer") *because* they suppressed the truth. | The person does not truly believe the falsehood deep down; they are just acting as if they do to avoid anxiety. If pressed with hard proof, the "belief" vanishes instantly. |
  | **The Label** | Calling this "self-deception" is accurate because the functional result is identical to lying to someone else: a false belief is maintained against evidence. | Calling this "deception" is a category error. It is "motivated ignorance" or "wishful thinking." Using the word "deception" implies a paradox that confuses the issue. |

  ***

  ### 3. THE CRUXES
  *The specific sub-questions that determine the outcome of the debate. If The Nurse loses on these, Dave wins the argument, and vice versa.*

  **Crux A: The "Intention-Lite" Question**
  *   **The Issue:** Does a process need a conscious, verbalisable plan to count as "deception," or can a subconscious goal count?
  *   **The Nurse's Stake:** If deception requires a conscious plan ("I will now hide this fact from myself"), Dave is right; that's impossible. The Nurse argues the "intention" can be a subconscious drive, like flinching before you know you're scared.
  *   **Dave's Stake:** If we allow "subconscious intentions" to count as deception, the word becomes so broad it covers everything (e.g., digestion is a "subconscious intention" to process food). Dave argues we must reserve "deception" for conscious acts.
  *   **Verbal Dispute Flag:** **HIGH.** We suspect a large part of this argument is about the definition of the word "deceive." If we agree to call it "Subconscious Information Management," Dave might concede the mechanism exists but still object to the label.

  **Crux B: The "Morning After" Test**
  *   **The Issue:** When the pressure is off, does the person admit they knew the truth all along?
  *   **The Nurse's Stake:** If the smoker, upon being diagnosed, says "I knew it really, I just couldn't face it," then he *knew* the truth while hiding it. That is deception.
  *   **Dave's Stake:** If the smoker says "I genuinely thought I'd be fine," then he wasn't deceiving himself; he was just wrong. If he says "I knew it," he is rewriting history to feel less foolish. Dave argues people are rarely honest about their past mental states.

  **Crux C: Costly Avoidance**
  *   **The Issue:** Will a person pay a cost specifically to *not* find out the truth?
  *   **The Nurse's Stake:** If someone pays money or sacrifices relationships specifically to avoid receiving information (e.g., refusing to open a letter), that is an active act of hiding truth from oneself.
  *   **Dave's Stake:** That is just avoidance. I can avoid a punch without "deceiving" myself about the fist. Avoiding information is not the same as actively manufacturing a false belief.

  ***

  ### 4. EVIDENCE & PREDICTIONS
  *Concrete cases and thought experiments we both agree are relevant. We commit to accepting the outcome of these scenarios as evidence for or against our positions.*

  #### Case 1: The "Don't Tell Me" Instruction
  **Scenario:** A patient suspects a lump is cancerous. They explicitly tell their spouse: "If the doctor calls, do not tell me the results. I don't want to know." The spouse agrees. The patient then lives their life acting as if they are healthy.
  *   **Why it matters:** This isolates the "intention" to remain ignorant.
  *   **The Nurse's Prediction:** This is clear self-deception. The patient knows there is a risk, knows the info exists, and actively deploys another person to keep it from them. This proves the "deceiver" and the "deceived" can be the same person over time.
  *   **Dave's Prediction:** This is just **information avoidance**. The patient does not *believe* they have cancer (otherwise they'd seek treatment); they just fear the confirmation. This is prudence or cowardice, not deception. Deception requires making yourself believe the lump is *benign*, not just refusing to check.

  #### Case 2: The Drunk Driver's Sobriety
  **Scenario:** A person is heavily intoxicated. They insist they are fine to drive. They perform poorly on a balance test but claim the floor is uneven. The next morning, sober, they watch a video of themselves from the night before and say, "My god, I was deluding myself."
  *   **Why it matters:** It tests the "Belief State." Did they believe they were sober, or did they know they weren't?
  *   **The Nurse's Prediction:** In the moment, part of their mind knew they were drunk (hence making excuses about the floor), but another part overrode it to allow the action. That override is the deception.
  *   **Dave's Prediction:** In the moment, their judgment was chemically impaired. They weren't "hiding" the truth; their ability to process the truth was broken. Calling a broken thermometer "self-deceiving" is a mistake. It's just damage, not deceit.

  #### Case 3: The Wager (Hypothetical Experiment)
  **Scenario:** We offer a subject £100 if they can correctly state whether their partner is cheating. We offer them £10 if they choose *not* to look at the evidence (texts/emails) provided in a sealed envelope.
  *   **Why it matters:** It puts a price on the truth vs. ignorance.
  *   **The Nurse's Prediction:** A significant number of people will take the £10 to remain ignorant. This proves they suspect the truth (cheating) is likely, but value the state of "not knowing" higher than the cash or the truth. This active maintenance of ignorance is deception.
  *   **Dave's Prediction:** People will take the £10 because knowing the truth is painful, not because they are deceiving themselves. They are simply choosing comfort over accuracy. That is a preference, not a deception. If they truly believed their partner was faithful, the envelope wouldn't be scary. The fear proves they *don't* believe the lie, they just hope it's true.

  ***

  ### 5. CONCLUSION & NEXT STEPS

  We acknowledge that this dispute is partly **verbal**. If The Nurse agrees to call the mechanism "Motivated Ignorance" rather than "Deception," Dave concedes the psychological behaviour exists. However, The Nurse maintains that the label "Deception" is functionally useful because it highlights the *active* nature of the avoidance, which "Ignorance" does not.

  **To settle the argument:**
  We agree to focus on **Case 1 (The Don't Tell Me Instruction)**.
  *   If Dave can explain this without using the concept of "hiding truth from oneself," he wins.
  *   If The Nurse can show that the patient *believes* they are healthy while simultaneously instructing others to hide the truth, The Nurse wins.

  Until then, the next round of drinks is on the loser of the next discussion regarding the smoker's uncle.

