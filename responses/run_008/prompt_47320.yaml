answer: |-
  Your friend is relying on a genuine result from decision theory, but he is applying it outside the boundary conditions where that result holds. The slogan "information never hurts" is a colloquial compression of I. J. Good's 1967 theorem on the *Value of Information*. While the theorem is mathematically sound, its application to your specific medical scenario requires assumptions that are almost certainly false in the real world.

  Here is the menu of distinct claims hidden inside that slogan, categorized by their logical status and the assumptions they require.

  ### The Menu of Claims

  **1. The Ex-Ante Expected Utility Claim (Good's Theorem)**
  *   **The Claim:** Before you see the test result, your expected utility from having the option to see the result is greater than or equal to your expected utility from remaining ignorant, provided you act optimally after seeing it.
  *   **Status:** **Theorem.** (Mathematically proven).
  *   **Assumptions:**
      *   You are a perfect Expected Utility maximizer.
      *   You update beliefs strictly via Bayes' Rule.
      *   The information is costless (monetarily and temporally).
      *   **Crucial:** Your utility function depends only on the *state of the world* and your *actions*, not on the *beliefs* you hold. (You don't get utility or disutility simply from knowing or not knowing).
      *   **Crucial:** No third parties observe your information or your decision to acquire it (no strategic externalities).

  **2. The Ex-Post Welfare Claim**
  *   **The Claim:** Once you actually receive the information, you will never be worse off than if you had remained ignorant.
  *   **Status:** **Outright False.**
  *   **Assumptions:** None (Counterexamples are trivial).
  *   **Reasoning:** If the test reveals a fatal diagnosis, your realized well-being may plummet due to psychological distress, even if you make optimal plans. Good's theorem is about *expectations* before the fact, not *realized welfare* after the fact.

  **3. The Costless Information Claim**
  *   **The Claim:** Information never hurts even if it costs money, time, or pain to acquire.
  *   **Status:** **Outright False.**
  *   **Assumptions:** None.
  *   **Reasoning:** If the cost of the test exceeds the instrumental value of the information (e.g., the test costs $5,000 but changes no medical outcome), you are strictly worse off.

  **4. The Ideal Agency Claim**
  *   **The Claim:** Information never hurts even if the agent is prone to panic, cognitive bias, or suboptimal decision-making.
  *   **Status:** **Outright False.**
  *   **Assumptions:** None.
  *   **Reasoning:** If receiving bad news causes an agent to deviate from optimal behavior (e.g., severe depression leading to neglect of health), the information has negative instrumental value. Good's theorem assumes perfect rationality post-update.

  **5. The Strategic Isolation Claim**
  *   **The Claim:** Information never hurts even if other agents (insurers, employers, family) can observe that you took the test or what the result was.
  *   **Status:** **Outright False.**
  *   **Assumptions:** None.
  *   **Reasoning:** In game-theoretic contexts, information can force you into a worse bargaining position. For example, if an insurer sees a positive genetic test, they may raise premiums or deny coverage. Here, information acts as a signal that can be exploited by others.

  **6. The State-Dependent Utility Claim**
  *   **The Claim:** Information never hurts even if you care about your state of knowledge itself (e.g., you value hope or fear dread).
  *   **Status:** **Outright False.**
  *   **Assumptions:** None.
  *   **Reasoning:** Standard decision theory assumes $U(action, state)$. If your utility function is $U(action, state, belief)$, acquiring information changes your belief, which can directly lower utility. If you prefer the belief "I might be healthy" over the certainty "I am sick," acquiring the information destroys utility directly.

  ***

  ### The Verdict

  Your friend's argument **fails**. He is relying on **Claim 1 (The Ex-Ante Expected Utility Claim)**, treating it as if it were a universal moral or practical imperative. While Claim 1 is a valid mathematical theorem, it does not support the conclusion that the patient should take the test because the medical scenario violates the theorem's necessary assumptions.

  Specifically, the argument collapses on two grounds: **psychological utility** and **strategic externalities**.

  **1. Violation of State-Dependent Utility**
  Good's theorem proves that information has non-negative *instrumental* value. It allows you to map actions to states more accurately. However, it assumes the information itself is neutral. In the case of an incurable late-onset disease, the information often carries direct *negative* utility.
  Many people experience "information aversion." The state of *knowing* one has a fatal condition creates anxiety, depression, or dread that is not offset by the ability to plan. If a patient values the hope of being healthy, converting that probability (e.g., 50%) into a certainty (100%) destroys the utility of that hope. Since Good's theorem assumes utility is independent of beliefs, it cannot account for the psychological cost of knowledge. In this context, information *does* hurt, because the knowledge itself is a harm.

  **2. Violation of Strategic Isolation**
  Good's theorem assumes a "single-agent" decision problem. It does not account for other players in the game. In the United States, while the Genetic Information Nondiscrimination Act (GINA) protects against health insurance and employment discrimination, it **does not** cover life insurance, long-term care insurance, or disability insurance.
  If a patient takes the test and tests positive, they may become uninsurable for long-term care. This is a strategic penalty imposed by third parties observing the information. In this game-theoretic context, acquiring information can signal "high risk" to insurers, reducing the patient's future options and welfare. Therefore, the information has negative expected value when strategic reactions are included.

  **Conclusion**
  Your friend is correct that a mathematically ideal agent, in a vacuum, with no psychological attachment to hope, and no risk of discrimination, would never refuse free information. But your patient is not a mathematical abstraction. They are a human being who may suffer from knowing, and they exist in a socioeconomic system that may punish them for knowing.

  Therefore, the slogan "information never hurts" is false in this context. The decision to test should depend on whether the patient values preparation more than hope, and whether they can afford the potential insurance consequences—not on a misapplied theorem from 1967.
