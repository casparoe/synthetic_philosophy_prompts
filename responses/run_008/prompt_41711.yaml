      *   *The Philosophical Punch:* EIA *knows* the baseline isn't neutral. We hide behind "Existing Conditions" but everyone knows "Existing Conditions" includes past harms. AI safety folks are trying to mathematically solve what NEPA solves politically (litigation, public comment).
      *   *What is EIA missing?* We lack a feedback loop. We write the document, the project gets built, we rarely check if the predictions were right (post-audit). AI learns.
      *   *Institutional vs. Mathematical:* EIA outsources the value judgment to the public/courts. AI is trying to hard-code it. That's the fundamental mismatch.

