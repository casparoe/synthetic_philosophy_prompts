prompt: |-
  I cover science and ideas for a mid-sized paper, and a recent column of mine on the rationality of voting in large elections provoked a disagreement between two readers whose exchange I'd like to see adjudicated. The column made the familiar point that a single vote is almost never causally decisive, so the direct instrumental case for voting is weak. One reader, a mathematician, wrote in defending the practice on what he called superrational grounds: in an electorate of millions, there are bound to be many voters who deliberate as he does, weigh the considerations as he does, and reach their decision through much the same process — so his choice is not an isolated event but one node in a pattern, and the right way to reason is as if deciding for the whole class of similar deliberators, which multiplies the impact of his ballot enormously. A second reader, a philosophy PhD student, replied that this is an elementary confusion of correlation with causation: the similarity of other voters' deliberations explains why their choices tend to co-vary with his, but their ballots are already sealed or will be marked independently, and no amount of resemblance makes his pencil cause theirs to move. The mathematician answered that this objection proves too much, since it would also condemn one-boxing in Newcomb's problem, where the payoff correlations plainly seem worth acting on even without causal influence; the student countered that Newcomb involves a predictor whose behaviour depends on your earlier type, whereas the electorate contains no such mechanism, only a statistical resemblance — and that the superrationalist quietly helps himself to a symmetry condition ("people who reason like me") that is never actually satisfied, since even two people who reach the same conclusion typically do so from different private information and for different reasons, and in any case a resemblance in reasoning is not a channel of influence. The mathematician's last word was that decision theory which cannot distinguish choosing in a crowd of your own kind from choosing alone has missed something fundamental about what agents are. They have each written to me asking for a verdict, and I am out of my depth beyond a certain point.

  Please adjudicate their exchange move by move: say who is right at each step and to what degree, identify what (if anything) each is missing in the other's argument, and give an overall verdict on whether superrationality rescues the rationality of voting in large elections — or whether it rests on a genuine but different insight that the argument misuses. Where the disagreement turns on the contrast between evidential and causal ways of valuing outcomes, please make that contrast explicit rather than gesturing at it, and address the one-boxing analogy directly rather than treating it as obviously decisive for either side.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Role:** Adjudicator/Referee for a debate between two readers (Mathematician vs. Philosophy PhD Student) regarding a column on the rationality of voting.
      *   **Topic:** Is voting rational in large elections? Specifically, does "superrationality" (decision theory based on logical correlation among similar agents) rescue the instrumental value of voting, or is this a confusion of correlation and causation?
      *   **Key Arguments:**
          *   *Column:* Standard view (single vote rarely decisive).
          *   *Mathematician:* Superrationality (Hofstadter-style). If I reason this way, others like me do too. My decision implies theirs. Multiplies impact.
          *   *Student:* Confusion of correlation/causation. No causal link. Newcomb analogy fails (no predictor). Symmetry condition unrealistic (different private info).
          *   *Mathematician (Rebuttal):* Student's view condemns one-boxing. Decision theory ignoring "crowd of your own kind" misses something about agency.
      *   **Requirements:**
          *   Adjudicate move-by-move.
          *   Identify who is right/to what degree.
          *   Identify missing elements in each argument.
          *   Overall verdict on superrationality and voting.
          *   Explicitly address Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT).
          *   Address the Newcomb/One-boxing analogy directly.

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1: Mathematician's Initial Claim (Superrationality).**
          *   *Claim:* My vote correlates with similar deliberators. I should act as if deciding for the class.
          *   *Analysis:* This is classic Hofstadter/Superrationality. It relies on Logical Decision Theory (LDT) or a strong version of Evidential Decision Theory (EDT). It assumes logical correlation implies actionable leverage.
          *   *Verdict:* Internally consistent within specific decision theories (LDT/EDT), but controversial in standard causal frameworks.

      *   **Move 2: Student's Rebuttal (Correlation vs. Causation).**
          *   *Claim:* Resemblance isn't causation. Ballots are independent physical events.
          *   *Analysis:* This is the standard Causal Decision Theory (CDT) objection. CDT says only causal consequences matter.
          *   *Verdict:* Correct under CDT. But assumes CDT is the only valid framework.

      *   **Move 3: Mathematician's Counter (Newcomb Analogy).**
          *   *Claim:* Your logic kills one-boxing in Newcomb's Problem.
          *   *Analysis:* Strong point. CDT two-boxes. EDT/LDT one-boxes. Many philosophers find one-boxing intuitive/rational. If the Student's logic forces two-boxing, it might be a *reductio* of their strict causal view.
          *   *Verdict:* The Mathematician lands a significant blow here. The Student needs to distinguish Newcomb from Voting.

      *   **Move 4: Student's Counter (Predictor vs. Statistical Resemblance).**
          *   *Claim:* Newcomb has a predictor (mechanism). Voting has only statistical resemblance. Also, symmetry is unrealistic (different private info).
          *   *Analysis:*
              *   *Predictor:* In Newcomb, Omega predicts *you*. In voting, others aren't predicting you; you are logically similar. This is a distinction between *causal prediction* and *logical correlation*.
              *   *Symmetry:* This is the strongest point. "People who reason like me" is a fuzzy reference class. Do they have my exact evidence? If not, the correlation weakens.
          *   *Verdict:* The Student correctly identifies the disanalogy regarding the *source* of correlation (prediction vs. common cause/logic) and the practical difficulty of defining the reference class.

      *   **Move 5: Mathematician's Final Word (Agency).**
          *   *Claim:* Decision theory ignoring "crowd of your own kind" misses something about agents.
          *   *Analysis:* This points toward Functional Decision Theory (FDT) or Timeless Decision Theory (TDT). It suggests agency is about outputting a policy, not just a physical act.
          *   *Verdict:* Philosophically deep, but doesn't necessarily solve the voting problem practically.

  3.  **Synthesize the Decision Theory Landscape:**
      *   **CDT (Causal):** Vote only if $P \times B > C$. In large elections, $P$ (probability of being decisive) is tiny. Voting is irrational instrumentally. (Student's default).
      *   **EDT (Evidential):** Vote if $E[Utility|Vote] > E[Utility|No Vote]$. If voting is evidence that others vote, it might look good. But standard EDT struggles with the "Why?" (Spurious correlation).
      *   **LDT/FDT/TDT (Logical/Functional):** You choose an *algorithm*. If your algorithm says "Vote," and others run similar algorithms, they vote too. You control the output of the algorithm, which is instantiated in many places. (Mathematician's view).

  4.  **Drafting the Adjudication - Step-by-Step:**

      *   *Introduction:* Acknowledge the depth of the debate. It's not just about voting; it's about decision theory.
      *   *Move 1 (Math):* Right about the logic of superrationality, but assumes a specific decision theory without stating it.
      *   *Move 2 (Student):* Right about CDT. Causation is required for *causal* impact. But wrong to dismiss non-causal decision theories as "confusion."
      *   *Move 3 (Math - Newcomb):* Strong point. If Student rejects Newcomb one-boxing, they are in the CDT camp, which is contested. If they accept one-boxing, they must explain why Voting is different.
      *   *Move 4 (Student - Predictor/Symmetry):* Crucial distinction. Newcomb has a *counterfactual dependence* via the predictor. Voting relies on *logical correlation* without a common cause (other than human nature). The "Symmetry" objection is the killer for the voting case specifically. Reference class problem.
      *   *Move 5 (Math - Agency):* Philosophically interesting (FDT), but doesn't overcome the empirical fragility of the voting correlation.

  5.  **Refining the Verdict:**
      *   Is superrationality a "genuine insight misused"? Yes.
      *   The insight: Agents are implementations of reasoning processes.
      *   The misuse: Assuming the correlation is strong enough in real-world voting to outweigh costs, and assuming the reference class is well-defined.
      *   Newcomb Analogy: It holds for *theory* (LDT supports both), but fails on *mechanics* (Omega vs. Strangers).
      *   Final Call: The Student wins on the *application to voting* (correlation is too weak/undefined), but the Mathematician wins on the *theoretical critique of CDT* (CDT is not the only game in town).

  6.  **Addressing Specific Constraints:**
      *   *EDT vs. CDT:* Must be explicit.
      *   *Newcomb:* Must treat it seriously, not dismissively.
      *   *Tone:* Impartial, analytical, suitable for a science/ideas column editor.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, does EDT actually support voting?* Standard EDT often says yes, *if* voting is evidence of a favorable outcome. But if voting is evidence of *being the kind of person who votes* (which causes others to vote?), it gets messy. LDT/FDT is the better fit for the Mathematician. I should distinguish EDT from LDT/FDT to be precise. The Mathematician is arguing for something closer to FDT (Functional Decision Theory) than pure EDT.
      *   *The "Symmetry" point:* This is the most practical objection. In Newcomb, Omega knows *you*. In voting, you don't know *them*. The correlation is probabilistic, not logical necessity.
      *   *Verdict Balance:* Don't just say "Student wins." Acknowledge the Mathematician's theoretical contribution. The "rationality of voting" is often saved by *expressive* or *ethical* reasons, not instrumental ones. Superrationality tries to save instrumental rationality but struggles with empirical premises.

  8.  **Final Polish:** Organize by "Rounds." Ensure the distinction between *causal influence* and *logical correlation* is clear. Ensure the Newcomb analogy is dissected (Omega vs. Reference Class).

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in jargon. Keep it accessible for a column editor but precise enough for the debaters. Use the terms CDT, EDT, and LDT/FDT clearly.

  *Plan:*
  1.  Intro: Frame the debate as CDT vs. LDT.
  2.  Round 1: Superrationality claim. (Math partially right, Student partially right).
  3.  Round 2: Causation objection. (Student right on CDT, Math right that CDT isn't king).
  4.  Round 3: Newcomb Analogy. (Math scores a point).
  5.  Round 4: Predictor vs. Symmetry. (Student scores the winning point).
  6.  Round 5: Agency. (Math makes a philosophical point, but practical voting fails).
  7.  Overall Verdict: Theoretical insight vs. Empirical failure.

