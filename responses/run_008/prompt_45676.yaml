answer: |-
  ### Session Plan: The Envelope Paradox

  **Class Size:** 14 students
  **Duration:** 90 minutes
  **Goal:** Induce pre-theoretical epistemic akrasia via simulated higher-order evidence (HOE).

  #### 1. Materials & Setup
  *   **The Quiz:** 12 questions total.
      *   *Type A (Re-checkable):* 4 questions. Simple arithmetic or valid/invalid syllogisms. Designed to be solvable in <30 seconds if focused, but easy to make a careless slip under time pressure. (e.g., "Is 17% of 80 greater than 14?")
      *   *Type B (Memory-dependent):* 4 questions. Obscure trivia where verification is impossible in class. (e.g., "In what year was the Suez Canal opened?")
      *   *Type C (Ambiguous):* 4 questions. Vaguely worded general knowledge where intuition conflicts with precision.
  *   **The Envelopes:** 14 sealed manila envelopes.
      *   **5 Envelopes (Type M - Misleading):** Contain a slip reading: *"ALERT: You have been assigned the 'Distorted' quiz version. Subtle wording errors may invert the correct answer on up to 50% of questions. You cannot identify which ones."*
      *   **5 Envelopes (Type C - Clean):** Contain a slip reading: *"NOTICE: You have been assigned the 'Control' quiz version. No wording errors are present."*
      *   **4 Envelopes (Type B - Blank):** Contain no slip.
      *   **Reality:** All quizzes are identical standard versions. The "Distorted" version does not exist.
  *   **Payoff Scheme:**
      *   Base: $5 participation (or candy/points).
      *   Accuracy Bonus: $1 per correct answer.
      *   Calibration Penalty: If a student rates confidence >80% on a wrong answer, they lose $0.50 from the bonus pool. (This prevents blind guessing with high confidence).

  #### 2. Run-of-Show (90 Minutes)

  **0:00–0:15 | Phase 1: First-Order Judgment**
  *   Hand out quizzes face down.
  *   **Instruction:** "Answer as many as you can. Next to each answer, write your Credence (0–100%) that you are correct. You have 12 minutes."
  *   Collect quizzes. Do not grade them yet. Keep them in front of the students.

  **0:15–0:25 | Phase 2: Higher-Order Evidence**
  *   Distribute the sealed envelopes randomly.
  *   **Instruction:** "Open the envelope. Read the slip silently. You know the distribution of envelopes in this room (roughly 1/3 Warning, 1/3 Clean, 1/3 Blank). Based *only* on this new information, you may now revise your answers and your Credence ratings. You may stick or switch. This is your final submission."
  *   *Crucial Constraint:* Do not allow them to re-solve the math problems from scratch. They must rely on their memory of their first pass + the envelope info.
  *   Collect final sheets.

  **0:25–0:35 | Phase 3: Scoring & Data Reveal**
  *   While you quickly grade (or use a pre-prepared key projected on screen), ask students to compare their "Stick/Switch" decisions with a neighbor who had a different envelope type.
  *   Reveal the truth: "All quizzes were identical. The 'Distorted' version does not exist."
  *   Calculate payoffs.

  **0:35–1:30 | Phase 4: The Debrief (The Philosophical Work)**
  *   **Step 1: The Akratic Moment.** Ask students who received a Type M (Warning) envelope: "Did you switch an answer on a Type A (Math) question?"
      *   *Target:* Find a student who solved $17 \times 4$ correctly, felt sure, got the Warning, and then doubted/switched.
      *   *Label:* Introduce **Epistemic Akrasia**. "You believed P, but you also believed you shouldn't believe P."
  *   **Step 2: Defeat vs. Undercutting.**
      *   Ask: "Did the envelope prove you were wrong (Defeater), or just that you might be wrong (Undercutter)?"
      *   Discuss: If the HOE is misleading (as revealed), was it rational to switch? (Connect to *Christensen* vs. *Sliwa*).
  *   **Step 3: Checkable vs. Uncheckable.**
      *   Compare reactions to Math (Type A) vs. Trivia (Type B).
      *   *Discussion:* "Why did the envelope move you more on Trivia?"
      *   *Theory:* Connect to the **Total Evidence View**. Can you "re-verify" your way out of HOE? If you check the math again and get the same result, does the envelope still bite? (Most students will say the envelope matters less if they re-check, which opens the door to discussing *level-splitting* views).
  *   **Step 4: The Blank/Clean Control.**
      *   Ask Type C/Blank students: "Did you feel *more* confident?"
      *   *Theory:* Positive HOE. Does reliability evidence boost justification, or just remove doubt?

  #### 3. Predictable Failure Modes
  1.  **The "House Edge" Suspicion:** Upper-level philosophy students are paranoid. They may suspect the "Reveal" at the end is also a lie (i.e., there really *were* distorted quizzes). This turns the exercise into a game of "outsmarting the professor" rather than an epistemic dilemma.
      *   *Mitigation:* Be brutally honest in the debrief. Show the master file. Acknowledge the deception was necessary to isolate the variable.
  2.  **The Gambler's Response:** Students may treat the 1/3 probability as a betting odd rather than epistemic evidence. "There's only a 33% chance I'm compromised, so I'll stick." This bypasses the akrasia.
      *   *Mitigation:* Emphasize in instructions that the "Distortion" is not random per question, but per *quiz*. If they are in the Warning group, *half* their quiz could be wrong. That raises the stakes.
  3.  **The "Re-Verify" Loophole:** Students might ignore the "no re-solving" constraint and do the math again during Phase 2. If they get the same answer, the HOE loses force.
      *   *Mitigation:* Collect Phase 1 sheets *before* handing out envelopes. They only have their memory of their confidence, not their scratch work.

  #### 4. Limitations (What This Activity Cannot Do)
  *   **Internal vs. External HOE:** This activity simulates HOE via *testimony* (the envelope). Real-world akrasia usually arises from *internal* cues (fatigue, bias, emotional disturbance). Students might conclude HOE is always about trusting/distrusting an authority, missing the reflexive nature of self-doubt.
  *   **Pragmatic Encroachment:** The payoff scheme introduces pragmatic stakes. Students might stick with an answer not because they think it's true, but because they need the points. This conflates *practical* rationality with *epistemic* rationality, which you will need to disentangle in the debrief.
  *   **Peer Disagreement:** This models "process unreliability," not "peer disagreement." It does not capture the specific tension of someone else holding your same evidence but reaching a different conclusion.

  #### 5. Self-Critique & Observation Points
  *   **Where my reasoning might fail:** I am assuming students care enough about the accuracy bonus to feel tension. If they view the $5 as guaranteed and the bonus as negligible, they will treat the quiz casually. Casual engagement kills akrasia; you need them to care about being right to feel the pain of doubting themselves.
  *   **Observation that would change my mind:** If, during Phase 2, *no one* switches an answer despite holding a Type M envelope. This indicates the HOE was too weak (the 1/3 probability is easily dismissed) or the trust in the instructor is too low. If this happens, abandon the "probability" framing in the debrief and pivot to discussing *why* the evidence failed to move them (skepticism about the source).
  *   **Where the design is fragile:** The "Blank" envelope. Logically, if students know the proportions (1/3 M, 1/3 C, 1/3 B), receiving a Blank envelope *is* evidence. It updates their credence that they are in the M group. Calculating this Bayesian update in real-time might distract from the phenomenological experience of doubt.
      *   *Fix:* In the instructions, state "The envelopes provide independent signals. Do not try to calculate odds based on what your neighbor received."

  Verdict: The use of an external authority (the envelope/professor) to deliver the HOE, rather than an internal cue (fatigue/confusion), risks teaching that HOE is always testimonial rather than reflective.
