  so neither party carries lasting debt.
  This is not kinship, nor a personal favor,
  but contract: service rendered, no return.

  Years pass before expecting a return,
  bound by the intimacy of a name.
  Protection flows down as a steady favor,
  loyalty moves up disguised as gift.
  The ledger holds not sums but human debt,
  where care and calculation share the price.

  From outside, everything has market price,
  auditors demand an instant return.
  They seek to clear the public of all debt,
  erasing ties of blood and proper name.
  They say no officer should take a gift,
  nor trade the common good for private favor.

  Inside the circle, it begins with favor,
  no spreadsheet calculates the heavy price.
  The envelope is passed simply as gift,
  ensuring safety rather than quick return.
  We trust the person, not the printed name,
  and carry the unending weight of debt.

  Who knows when obligation turns to debt,
  or when a duty morphs into a favor?
  The hand remains the same, the signing name,
  the envelope conceals the agreed price.
  We wait indefinitely for the return,
  unable to separate the thing from gift.

  The ledger lists a name instead of debt,
  blurring the line between the gift and price,
  where care is both the favor and return.
