answer: |-
  The field book smelled of cured leather and damp earth, the same scent that had clung to Master Varen's coat for thirty years. Elara stood at the edge of the Gray Valley, the wind whipping the pages open to the section on Boundary Protocols. Below her, the marshland breathed, a slow, wet expansion of peat and water that swallowed the lower stakes every autumn. Above her, the stone markers stood dry and silent on the ridge.

  She had been Varen's apprentice for nine years. She knew the weight of his transit, the specific pressure he used when driving a stake, the way he squinted when the sun hit the brass lens. She knew his rules. Rule Four: *The stone marker holds precedence over the chain measurement.* Rule Seven: *The boundary must remain on dry ground wherever the marsh shifts.*

  Here, at the Quarry Bend, the rules fought each other.

  The ancient stone had been moved; everyone agreed on that. The villagers of Highcress said Lowmere had dragged it down to steal grazing land. Lowmere said Highcress had shoved it up to block the water flow. The marsh this year was higher than it had been in Varen's lifetime. If Elara followed the stone, the boundary line cut through the deepest sinkhole, rendering the lower pasture useless. If she followed the dry ground, the line ignored the stone entirely, granting the upper pasture to Lowmere.

  She ran her finger over Varen's notes. He had surveyed this valley twenty times. There were diagrams, corrections, inked-over mistakes. But there was no entry for a high marsh and a displaced stone. There was no instruction for *this*.

  For three days, Elara slept in the tent while the villagers waited. Men from Highcress stood on the ridge, arms crossed. Women from Lowmere watched from the tree line. They did not speak to her, but their silence was heavy with expectation. They believed the answer was in the book. They believed Varen had left a ghost in the ink, a specific instruction for this exact moment, waiting to be read.

  Elara tried to simulate his mind. She closed her eyes and tried to summon him. *What would you do, Master?*

  She remembered him correcting her once on a slope. *You measure the distance, Elara, but you don't measure the ground.* She remembered him saying, *The rule is not the string; the rule is where the string settles.*

  But those were just words. Words were compatible with anything. If she searched his past actions, she could find a precedent for following the stone. She could also find a precedent for avoiding the marsh. Both interpretations fit the history of his hand. Both fit the finite stock of lines he had drawn while alive.

  On the fourth morning, the realization came not as a thunderclap, but as a cold settling in her stomach. There was no fact of the matter. Varen was dead. His brain was ash. The book was just paper. There was nothing hidden in the universe, no metaphysical rail laid out ahead of them, that dictated where this line belonged. The past did not contain the future. She had been looking for a track to walk on, but she was standing at the end of the track. Beyond this point, there was only mud.

  She packed the transit. She took the chalk line and the stakes. She walked down into the valley where the two groups converged. The mud sucked at her boots.

  "The book says?" asked a man from Highcress. His voice was rough, hopeful.

  "The book says many things," Elara said. Her voice sounded thinner than she expected.

  "So read it," said a woman from Lowmere. "Tell us where he put the line."

  Elara looked at them. They wanted comfort. They wanted to believe that justice was a thing discovered, like a vein of ore, rather than a thing made. They wanted to be absolved of the choice. If the line was Varen's, then the feud was his fault, or his solution. If the line was hers, the blood would be on her hands.

  She looked at the stone. She looked at the marsh. She thought about the winter coming. If she followed the stone, the Lowmere cattle would starve. If she followed the dry ground, Highcress would lose the water rights they had claimed for a generation. Neither rule saved them both.

  "Master Varen never walked this mud," Elara said.

  "Don't lie," the man snapped. "He walked every inch."

  "He walked every inch that was dry," Elara said. "He never faced this."

  A murmur went through them. Anger, confusion. They stepped closer. The authority they had lent her was brittle, and she could feel it cracking. They wanted the dead man. They didn't want the apprentice.

  "If there is no rule," the woman said, "then you are just guessing. And we won't pay a guesser."

  Elara tightened the chalk line. She held the reel in one hand and the end of the string in the other. She understood now that the rule was not a command from the past. It was a promise for the future. A rule was only a rule if people agreed to be bound by it. Varen's authority hadn't come from his accuracy; it came from their trust. He had drawn lines, and they had walked them, and because they walked them, the lines became real.

  She could feel the vertigo of it. She was about to invent a meaning and call it a discovery. She was about to step into the void and pretend there was ground there.

  "I am not guessing," Elara said. She drove a stake into the firm ground between the stone and the marsh. It was a compromise. It gave Highcress the stone's sightline, but it gave Lowmere the dry grazing. It violated the strict letter of Rule Four and the strict letter of Rule Seven. It satisfied neither completely.

  "This is the line," she said.

  "Is that in the book?" the man asked.

  "No," Elara said. "It is in the valley."

  She snapped the chalk line. The blue dust settled on the mud, a bright, artificial scar against the brown earth. It looked decisive. It looked like it had always been there.

  The villagers stared at the string. They looked at the stone, then at the marsh, then at each other. They were calculating. If they rejected this, the survey would go to the provincial office. The office would send a stranger. The stranger would charge fees. The feud would last another generation.

  The woman from Lowmere stepped forward. She looked at Elara, then at the blue line. She nodded, once. "It holds water," she said.

  The man from Highcress spat on the ground. He looked at the stone, then at Elara. He saw that she did not blink. He saw that she was willing to stand by the ink even though she knew it was hers. He sighed, the tension leaving his shoulders like air from a bellows. "It holds the stone in sight," he muttered. "Acceptable."

  They began to disperse, the tension dissolving into the practicalities of fencing and grazing rotations. They accepted the line. By walking it, by agreeing to it, they made it the correct line. The rule was not found; it was forged in the moment of their acceptance.

  Elara packed the chalk reel. Her hands were shaking, just slightly. She opened the field book to the empty page where this day should have been recorded. She picked up Varen's pen.

  She wrote the coordinates. She drew the diagram. She signed her name below his.

  It looked legitimate. It looked like the continuation of a life. But as she closed the book, she felt a hollow ache behind her ribs. She had solved the problem, but she had not solved the worry. Tomorrow, there would be another bend, another marsh, another case the book did not cover. And the next time, the villagers might not trust her. The next time, the blue dust might not settle so easily.

  There was no rail ahead. There was only the next step, and the hope that others would walk beside her. She capped the pen and walked back up the ridge, leaving the blue line behind her in the mud, waiting to see if it would hold when the rain came.
