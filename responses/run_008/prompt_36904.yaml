      *   **The Ruthlessness Question:** Moral flexibility vs. Strategy switching.
      *   **Verdict:** Category error vs. Blind spot.

  *(Self-Correction Note)*: Make sure to emphasize that Machiavelli's *Fortuna* is *non-stationary*. That's the key quant link. Standard models assume stationarity; Machiavelli assumes the rules change.

  *(Final thought on "Boldness")*: Machiavelli's boldness isn't just sizing up. It's about *speed of execution* when the window opens. In HFT or macro, hesitation kills. That's the "impetuous" part.

