answer: |-
  The steam from their coffees curled between them, a transient phenomenology they both agreed was pleasant. Mira stirred her cup, watching the swirl.

  "We agree on the telos," Mira said. "Pleasure is the good. But if I don't know what pleasure *is*, how can I pursue it?"

  "That's why I favor the attitudinal view," Ezra replied, leaning back. "Pleasure isn't a specific flavor of experience. It's an attitude of taking satisfaction in something. It's pro-attitude toward a state of affairs."

  "Let's test that," Mira said. "Consider the chili-chocolate case. I eat a dark chocolate infused with cayenne. There is a burn, an edge of irritation. Phenomenally, it resembles mild pain. If pleasure is a distinctive felt quality, this burn should subtract from the pleasure. Yet, the burn *composes* the pleasure. Take away the burn, and it's just chocolate. Add the burn, and it's ecstasy."

  Ezra smiled. "This is my strongest evidence. On your view, you have to say the pain *transforms* into pleasure, or that there's a specific 'piquant' qualia. But on my view, it's simple: you are *enjoying* the burn. You are taking satisfaction in the sensation of irritation. The sensation itself can be painful; what makes it good is your attitude toward it. The attitudinal view handles the mixture smoothly; the phenomenological view chokes on it."

  Mira paused, tapping her spoon. "I concede that the feeling isn't a simple 'sweetness.' It's not a uniform glow. But you assume the burn is purely painful phenomenologically. I'd argue the 'burn' in this context isn't pain proper; it's a complex qualitative character—throbbing warmth—that is sui generis. However..." She hesitated. "I will concede this: if I were merely enduring the burn without liking it, it would be bad. So, the attitude of enjoyment is necessary. But I deny it is sufficient. The *texture* of the burn matters. If the burn were a jagged, nausea-inducing sting, you couldn't enjoy it in the same way. The phenomenology constrains the attitude."

  "Fair," Ezra said. "You're admitting the attitude needs a vehicle. But let's move to the absorption case. A rock climber finishes a difficult route. Asked later, she says sincerely, 'I enjoyed every minute.' But when asked what it felt like *during* the climb, she says, 'Nothing. No buzz, no glow. I was just the moves.' She was totally absorbed. Where is the distinctive felt quality there?"

  "If pleasure is a feeling," Ezra pressed, "she should have felt it. If she felt nothing, she felt no pleasure. Yet she enjoyed it. This refutes the idea that pleasure must be a phenomenological highlight."

  Mira shook her head. "You're conflating feeling with attending. The pleasure was present in her consciousness as the background tone of her engagement, but she wasn't monitoring it. She was attending to the holds. To say the pleasure wasn't felt is to say it wasn't the *object* of attention. But it was still there, coloring the experience."

  "But if it's unattended," Ezra countered, "how do you distinguish it from mere functional engagement? If I solve a math problem with total absorption and no glow, am I enjoying it? You say yes if there's a background feeling. But if the subject reports 'no feeling,' positing a hidden feeling looks like ad hoc preservation of your theory. You're saying pleasure can exist without being phenomenologically accessible. That sounds suspiciously like my view: pleasure is the successful engagement (the attitude), not the feel."

  Mira sighed. "I concede that 'unfelt pleasure' is a risky phrase. It risks making phenomenology epiphenomenal. Let me refine: the feeling is non-positional. It's the medium, not the object. But I see your point. If the subject denies the feeling, insisting on its presence requires trusting introspection less than the theory. That is a weakness."

  "Indeed," Ezra said. "Which leads me to a worry, one William Alston raised. Perhaps we're hunting a ghost. What if 'pleasure' is just a disjunctive cluster concept? Sometimes it's a sensation, sometimes an attitude, sometimes a satisfaction of desire. No single essence."

  Mira frowned immediately. "I find that deeply unwelcome. If hedonism is true, pleasure must be the common currency of value. If 'pleasure' is just a label for a disparate cluster, how do I calculate the good? I can't sum sensations and attitudes. I need a natural kind."

  "I agree, surprisingly," Ezra said. "Even for attitudinal hedonism, I need a unified metric. If 'enjoying' a climb and 'enjoying' a meal are fundamentally different kinds of states with no common denominator, I can't compare them. I need 'pleasure' to pick out a specific functional role or attitude type. If it's disjunctive, the hedonistic calculus collapses. We both need an essence, even if we disagree on what it is."

  "Then let's construct a case that forces the essence into the light," Mira said. "The Inverted-Hedon. Imagine a creature neurologically and functionally identical to a human. They pursue goals, smile, say 'I love this,' and satisfy desires. But introspectively, their character is inverted. Where we feel a warm glow of enjoyment, they feel a neutral flatness, yet they report enjoyment because their functional outputs are identical."

  Ezra nodded. "I know this type. In my view, this creature *is* experiencing pleasure. Their attitudes of satisfaction are in place. The lack of a 'glow' is irrelevant. The case shows pleasure is fixed by the attitude, not the feel."

  "But the case is underdescribed," Mira argued. "If they are truly functionally identical, including their introspective reports, then when they say 'I feel joy,' they are reporting *something*. If you say that something is 'flatness,' you are stipulating that their first-person authority is wrong. You're begging the question by defining their internal state as flat while maintaining their output is identical to ours. If they are truly inverted, their 'flatness' plays the functional role of our 'glow.' But then 'flatness' just *is* the phenomenology of pleasure for them. You haven't eliminated phenomenology; you've just relativized it."

  "I don't think I'm begging the question," Ezra replied. "I'm separating the functional role of enjoyment from the qualitative character. But I will concede this: if the inverted creature lacks any qualitative character that correlates with the intensity of their attitude, it becomes hard to explain why some enjoyments are *more* pleasurable than others. Attitudes seem binary—you're satisfied or you're not. Phenomenology seems to handle intensity better. If your inverted creature has no qualitative intensity, how do they distinguish a mild preference from a rapturous joy?"

  "Exactly," Mira said. "Intensity feels phenomenological. But I concede your point on the climber. If I insist pleasure is always a felt quality, I struggle with flow states where the feeling is transparent. Perhaps the 'feeling' is just the absence of resistance to the attitude."

  "So we are closer," Ezra said. "But not agreed. I still believe the attitude is the essence. The feeling is contingent."

  "And I believe the feeling is the essence," Mira said. "The attitude is the response to it."

  "Then let's sharpen the disagreement," Ezra said. "What would change your mind? What evidence would make you an attitudinal hedonist?"

  Mira thought for a moment. "If neuroscience could isolate a specific 'pleasure circuit' that activates identically across all pleasurable experiences—chili, climbing, reading—and showed that damaging this circuit eliminates the *value* of the experience even if the subject claims to still 'enjoy' it functionally. If the 'feel' is the only thing tracking the value, I'm stuck. But if you could show me a case where the attitude persists without any corresponding phenomenological tone, and the subject is still better off... No. Actually, if you could show that two experiences with identical phenomenology but different attitudes have different values, I would concede. If I enjoy a pain and you endure the same pain, and my life is better solely because of the attitude, despite the feel being identical, I must yield."

  Ezra nodded. "That's precise. For me, I need the reverse. If you could show me a case where the attitude is identical—same satisfaction, same desire fulfillment—but the phenomenology differs, and the one with the 'richer' feel is intuitively better, I would have to concede that the feeling carries the value. Or, if the Inverted-Hedon case can be described without question-begging—where we agree the creature has the attitude but lacks the qualia, and we agree they are not experiencing pleasure—then I'm wrong. But until then, I hold that the 'taking satisfaction' is the good."

  "And until I see the attitude outweigh the feel," Mira said, lifting her cup, "I hold that the feel is the good."

  "But we agree," Ezra clinked his mug against hers, "that whatever it is, it's worth finding."

  "To the good," Mira said.
