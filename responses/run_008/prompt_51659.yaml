prompt: |-
  A few friends and I run a tiny nonpartisan voter-engagement thing ahead of local elections, mostly first-time voters who are completely turned off by every party on the ballot. Whenever the "should I even bother voting, and for whom" conversation comes up, people talk past each other because they're using the same words for totally different views: one person means "voting is a duty, period," another means "vote for whoever best expresses what you actually want, outcomes be damned," another is doing cold expected-value math and wondering why anyone votes at all. I want to build a "which view of voting do you actually hold?" quiz that sorts people by what they say about concrete cases, not by which slogan they like, so the questions have to be cases and scenarios they can answer without knowing the philosophical labels.

  Please write eight to ten questions, each a concrete case with two or three answer options. Some cases I'd like in there (add or swap others if you think they're better diagnostics): a safe-seat/landslide district where your vote has effectively zero chance of mattering to the outcome; a ballot where every candidate is genuinely awful and you're choosing the least bad; whether to vote for a small party you actually like versus a big one you merely prefer to the other big one; deliberately spoiling your ballot or staying home as a protest; a friend who says voting is pointless because one vote never decides anything and yet you feel they're wrong somehow; and whether you'd support making voting compulsory with a small fine, like some countries do. No question should just ask "do you think voting is a civic duty?" — that's the label, not the diagnostic.

  Then a scoring key mapping answer patterns onto positions: roughly the consequentialist/instrumental view (votes only matter through outcomes, which typically leads toward "vote where stakes are close, abstain or flip a coin elsewhere"), the civic-duty view, expressive voting, the tactical lesser-evil view, the sincere/protest-spoiling option, and the compulsory-voting-supporter type. If two of these come apart on none of my cases — I suspect expressive voting and sincere third-party voting get sorted into the same bucket no matter what — please flag that explicitly instead of pretending the quiz separates them, and suggest what case WOULD separate them if you can think of one. Also fine to note combos of answers nobody gives, and a quick guess at why (incoherent, unappealing, or just rare). Keep the whole thing usable on paper, so no interactive logic needed — just questions, options, and a scoring key at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and scoring key:

  1.  **Analyze the Request:**
      *   **Goal:** Create a diagnostic quiz to sort people's underlying philosophy of voting.
      *   **Target Audience:** Friends/peers running a tiny nonpartisan voter-engagement group, focusing on first-time voters turned off by parties.
      *   **Problem:** People talk past each other using the same words for different views (Duty vs. Expression vs. Expected Value).
      *   **Requirements:**
          *   8-10 questions.
          *   Concrete cases/scenarios (no abstract "is it a duty?" questions).
          *   2-3 answer options per question.
          *   Specific cases to include: Safe seat/landslide, all candidates awful (lesser evil), small party vs. big party, spoiling/abstaining as protest, responding to "one vote doesn't matter," compulsory voting support.
          *   Scoring key mapping answers to positions: Consequentialist/Instrumental, Civic Duty, Expressive, Tactical Lesser-Evil, Sincere/Protest-Spoiling, Compulsory-Voting-Supporter.
          *   Constraint: Must work on paper (no interactive logic).
          *   Constraint: Flag if two views aren't separable by these cases and suggest a better discriminator.
          *   Constraint: Note incoherent/rare answer combos.

  2.  **Deconstruct the Voting Philosophies (The "Types"):**
      *   *Consequentialist/Instrumental:* Voting is a tool to change outcomes. If $P \times B < C$ (probability $\times$ benefit < cost), don't vote. Focus on swing states/districts.
      *   *Civic Duty:* Voting is an obligation of citizenship, regardless of impact. Like paying taxes or jury duty.
      *   *Expressive:* Voting is like cheering for a team. It's about saying who you are, not winning.
      *   *Tactical Lesser-Evil:* A subset of consequentialism, but specifically focused on harm reduction in a binary choice.
      *   *Sincere/Protest:* Voting for what you believe, even if they can't win. Spoiling is a form of expression.
      *   *Compulsory Support:* Believes participation is a systemic good that requires enforcement.

      *Challenge:* Some of these overlap significantly in practice.
      *   *Expressive* vs. *Sincere Third-Party:* Often look the same (vote Green/Libertarian even if they lose). Difference: Expressive cares about the *act* of saying it; Sincere cares about the *integrity* of the choice. Hard to separate without a specific "magic wand" question.
      *   *Consequentialist* vs. *Tactical Lesser-Evil:* Tactical is usually just Consequentialism applied to a bad menu.
      *   *Civic Duty* vs. *Compulsory Support:* Duty is internal; Compulsory is external enforcement.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Case 1: The Landslide (Safe Seat).*
          *   Scenario: Your district hasn't changed hands in 40 years.
          *   Options: Vote anyway (Duty/Expressive), Stay home (Consequentialist), Vote third party (Expressive/Sincere).
      *   *Case 2: The Garbage Ballot (Lesser Evil).*
          *   Scenario: Candidate A is corrupt, Candidate B is incompetent.
          *   Options: Pick B to stop A (Tactical), Pick neither/Spoil (Sincere/Protest), Pick based on who aligns with values (Expressive).
      *   *Case 3: Small Party vs. Big Party.*
          *   Scenario: You love Small Party, but Big Party is the only one who can beat the Worst Party.
          *   Options: Vote Small (Sincere/Expressive), Vote Big (Tactical/Consequentialist).
      *   *Case 4: The "One Vote Doesn't Matter" Friend.*
          *   Scenario: Friend says math says your vote is zero.
          *   Options: Agree mathematically but vote anyway (Duty/Expressive), Disagree mathematically (Consequentialist outlier), Agree and stay home (Consequentialist).
      *   *Case 5: Compulsory Voting.*
          *   Scenario: Law requiring voting with small fine.
          *   Options: Support (Civic/Compulsory), Oppose (Liberty/Consequentialist).
      *   *Case 6: Spoiling the Ballot.*
          *   Scenario: Writing "None of the Above" or drawing a picture.
          *   Options: Valid protest (Sincere/Expressive), Waste of time (Consequentialist), Better than staying home (Duty).
      *   *Case 7: High Stakes, Low Probability.*
          *   Scenario: Election is crucial for the country, but your side is down 20 points.
          *   Options: Vote to show solidarity (Expressive/Duty), Don't bother (Consequentialist).
      *   *Case 8: The Cost of Voting.*
          *   Scenario: Long line, bad weather, 2 hours wait.
          *   Options: Endure it (Duty), Only if race is close (Consequentialist), Only if I really care about a candidate (Expressive).
      *   *Case 9: Secret Ballot vs. Public Record.*
          *   Scenario: If voting was public record vs. completely anonymous.
          *   Options: Doesn't matter (Duty/Consequentialist), Prefer anonymous (Expressive/Sincere - less social pressure). *Maybe too abstract.* Let's swap for: *The "Random Dictator" scenario.* If one voter was chosen at random to decide the election, would you want to be picked? (Tests desire for power vs. participation). *Actually, let's stick to the prompt's request for concrete cases.* Let's use: *The "Down-Ballot" Race.*
          *   Scenario: You know nothing about the Judge/Sheriff race, but it's on the same ballot.
          *   Options: Skip it (Consequentialist/Sincere), Flip a coin (Duty - participate fully), Pick based on party (Tactical).
      *   *Case 10: Post-Election Regret.*
          *   Scenario: Your candidate loses badly.
          *   Options: Glad I participated (Duty/Expressive), Waste of time (Consequentialist).

      *Refining for Distinction:* I need to make sure the options clearly map to the specific philosophies requested.
      *   *Expressive* needs to be distinct from *Sincere*. Expressive = "I want to signal my identity." Sincere = "I want my vote to match my true preference." They often overlap. I will note this in the analysis.
      *   *Consequentialist* needs to be distinct from *Tactical*. Tactical is just Consequentialism in a two-party trap. I might group them or distinguish by "willingness to vote for hated candidate."

  4.  **Developing the Scoring Key:**
      *   Need to assign points or patterns to:
          1.  **The Calculator (Consequentialist/Instrumental)**
          2.  **The Citizen (Civic Duty)**
          3.  **The Fan (Expressive)**
          4.  **The Firefighter (Tactical Lesser-Evil)**
          5.  **The Purist (Sincere/Protest)**
          6.  **The Enforcer (Compulsory Support)**
      *   *Constraint Check:* The prompt asks to flag if two views aren't separable. Expressive and Sincere are the hardest to separate. I will explicitly note that.
      *   *Scoring Method:* Since it's paper-based, a simple tally system works best. Each answer corresponds to a letter (A, B, C). Tally the letters.
      *   *Mapping:*
          *   A: Consequentialist/Calculator
          *   B: Civic Duty/Citizen
          *   C: Expressive/Fan
          *   (Some questions need D/E for Tactical/Purist/Enforcer).
      *   *Better Approach:* Group answers by "Philosophy Tag" in the key rather than A/B/C per question, to allow nuance. Or keep it simple: A=Instrumental, B=Duty, C=Expressive/Tactical.
      *   *Let's try a Tag System:* Each option is tagged with the primary philosophy it indicates. The user counts their tags.
      *   *Wait, one person can hold multiple views.* The prompt asks to "sort people by what they say." A dominant profile is best.
      *   *Revised Scoring:* Tally marks for 5 categories: **Impact** (Consequentialist), **Obligation** (Duty), **Voice** (Expressive/Sincere), **Harm-Reduction** (Tactical), **System** (Compulsory).
      *   *Wait, Compulsory is only one question.* That might not generate a profile. I'll make sure the Compulsory question is weighted or combined with Duty.
      *   *Actually, let's look at the "Incoherent Combos" requirement.* I need to identify answer patterns that don't make sense (e.g., Consequentialist logic on Q1 but Duty logic on Q5).

  5.  **Refining the Questions for Maximum Diagnostic Power:**
      *   *Q1 (Safe Seat):* Distinguishes Impact vs. Duty/Voice.
      *   *Q2 (All Awful):* Distinguishes Tactical vs. Purist.
      *   *Q3 (Third Party):* Distinguishes Tactical vs. Voice.
      *   *Q4 (Friend's Math):* Distinguishes Impact vs. Duty/Voice.
      *   *Q5 (Compulsory):* Distinguishes System/Coercion vs. Liberty.
      *   *Q6 (Spoiling):* Distinguishes Voice (Protest) vs. Impact (Waste).
      *   *Q7 (High Cost):* Distinguishes Duty (sacrifice) vs. Impact (cost/benefit).
      *   *Q8 (Down Ballot):* Distinguishes Duty (completeness) vs. Impact (knowledge matters).
      *   *Q9 (Secret vs Public):* *Scrapping this.* Let's do *The "Deciding Vote" Scenario.* If you knew for a fact your vote would tie the election and send it to a coin flip, would you vote? (Pure Impact). If you vote only then, you're a Pure Consequentialist. If you vote anyway, you're Duty/Expressive.
      *   *Q10 (Post-Election):* Distinguishes Process vs. Outcome satisfaction.

      *Self-Correction on Expressive vs. Sincere:* The prompt specifically asks to flag if these aren't separable. They are very hard to separate in behavior. Both vote third party in a safe seat. Both spoil ballots. The difference is internal motivation (signaling identity vs. maintaining integrity). I will combine them into a "Voice/Integrity" category for scoring but add the note requested.

  6.  **Finalizing the Scoring Logic:**
      *   Create 5 Buckets:
          1.  **The Actuary** (Consequentialist/Instrumental)
          2.  **The Citizen** (Civic Duty)
          3.  **The Signaler** (Expressive/Sincere - combined with note)
          4.  **The Dam-Controller** (Tactical Lesser-Evil)
          5.  **The Architect** (Compulsory/Systemic)
      *   Assign each option to one or two buckets.
      *   Provide instructions on how to tally.
      *   Provide the "Incoherent Combo" analysis.

  7.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   Concrete cases? Yes.
      *   Specific scenarios included? (Safe seat, awful candidates, small party, spoiling, friend math, compulsory). Yes.
      *   Scoring key included? Yes.
      *   Flag indistinguishable views? Yes (Expressive vs. Sincere).
      *   Note incoherent combos? Yes.
      *   Paper usable? Yes.

  8.  **Drafting the Content:** (Mental check of tone: Nonpartisan, friendly, analytical, not preachy).
      *   *Question Wording:* Needs to be neutral. Avoid "Should you..." and use "What would you..."
      *   *Answer Options:* Need to be distinct actions, not just "Yes/No".

      *(Self-Correction during drafting Q9)*: The "Deciding Vote" hypothetical is good for pure consequentialists. If they say "Yes" only to that but "No" to safe seats, they are pure Actuaries.
      *(Self-Correction during drafting Q5)*: Compulsory voting. If they support it, they are Architects. If they oppose it but vote anyway, they are Citizens.

      *Let's finalize the 10 questions.*
      1. Safe Seat (Landslide).
      2. All Awful (Lesser Evil).
      3. Third Party (Sincere vs Tactical).
      4. Friend's Math (Impact denial).
      5. Compulsory Law (Systemic).
      6. Spoiling Ballot (Protest).
      7. High Cost (Weather/Line).
      8. Down-Ballot (Ignorance).
      9. The "Magic Tie" (Pure Impact test).
      10. Post-Election Loss (Outcome vs Process).

      *Scoring:* I will assign letters (A, B, C, D) to options and map them to the 5 types.
      *Wait, to make it easier on paper, I'll label the options with icons or just letters and provide a tally sheet.* Letters are easier for text output.
      *Let's group Expressive and Sincere for the scoring but add the disclaimer.*

      *Incoherent Combos:*
      *   Pure Actuary who supports Compulsory Voting (Contradiction: forcing others to do what you deem mathematically pointless).
      *   Citizen who spoils ballot (Contradiction: Duty usually implies fulfilling the function, not rejecting the choices, though some argue Duty = Participation regardless of choice). I'll nuance this.
      *   Tactical who votes Third Party in swing state (Contradiction).

      *Let's write it.*

  9.  **Final Polish:** Check tone. Ensure the "Expressive vs Sincere" flag is prominent. Ensure the "Incoherent Combos" section is insightful. Make sure the scoring key is clear for a non-technical user. (Decided to use a Tally System for the 5 archetypes).

      *Wait, one detail:* "If two of these come apart on none of my cases... flag that explicitly."
      *Expressive* (voting to express identity) and *Sincere* (voting for true preference) often yield the same action (voting 3rd party). To separate them, you need a case where expressing identity conflicts with true preference. Example: "A candidate represents your values perfectly but is personally repulsive." Or "A candidate represents your values but has no chance, vs a candidate who represents 80% of values and has a chance."
      *Actually, the prompt asks me to suggest a case that WOULD separate them if I can think of one.*
      *Idea:* "The Secret Ballot vs. Public Billboards." If you could vote secretly OR have your vote displayed on a billboard for your cause, which do you choose? Expressive wants the billboard. Sincere might not care.
