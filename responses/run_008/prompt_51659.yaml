answer: |-
  # The "Why Do We Vote?" Diagnostic Quiz

  **Instructions:** Read each scenario and choose the option that best matches what you would *actually* do or think. Don't pick the answer that sounds "best"; pick the one that feels true to your gut. Keep track of your answers (A, B, C, or D) on a piece of paper.

  ### 1. The Landslide District
  You live in a district that hasn't elected a representative from your preferred party in 40 years. The polls show the incumbent will win by 30 points.
  *   **A.** I stay home. My time is better spent on issues where the outcome is uncertain.
  *   **B.** I vote anyway. Showing up is part of being a member of the community, regardless of the score.
  *   **C.** I vote for my preferred party (or a third party I like more). It's about stating who I am, not winning this specific race.

  ### 2. The Garbage Ballot
  It's a high-stakes election, but both major candidates are genuinely awful. One is corrupt; the other is incompetent. Neither represents what you want.
  *   **A.** I pick the one who will do less damage. The goal is to prevent the worst outcome.
  *   **B.** I spoil the ballot or leave it blank. Voting for either validates a broken system.
  *   **C.** I pick the one whose rhetoric aligns closer to my values, even if I think they'll fail.

  ### 3. The Third-Party Squeeze
  You love a small third party. However, in this specific election, voting for them might help the major candidate you hate most win (the "spoiler effect").
  *   **A.** I vote for the major candidate I dislike less. Preventing the worst outcome is the priority.
  *   **B.** I vote for the small party. If I don't vote for what I believe, the vote means nothing.
  *   **C.** I vote for the small party to build their numbers for next time, even if we lose now.

  ### 4. The Friend's Math
  A friend tells you: "Statistically, one vote never decides an election. It's irrational to spend an hour in line for a 1-in-a-million chance of impact."
  *   **A.** They're right about the math, but I vote anyway because it's an obligation, like jury duty.
  *   **B.** They're right. I only vote if the margin is expected to be razor-thin.
  *   **C.** They're wrong. Voting is a form of speech; the impact isn't the point, the expression is.

  ### 5. The Compulsory Law
  A proposal is on the ballot to require all citizens to vote, with a small $20 fine for those who don't (like in Australia or Belgium).
  *   **A.** I support it. Democracy works better when everyone participates, even the unwilling.
  *   **B.** I oppose it. Voting should be a choice; forcing it cheapens the act.
  *   **C.** I support it, but only if "None of the Above" is also an option on the ballot.

  ### 6. The Protest Spoil
  You are in the voting booth. You decide none of the candidates are acceptable.
  *   **A.** I submit a blank ballot or write "PROTEST" on it. It registers my participation but rejects the choices.
  *   **B.** I leave the booth without casting anything. Why bother processing a ballot that means nothing?
  *   **C.** I hold my nose and vote for the least bad option. A blank ballot helps no one.

  ### 7. The High Cost
  It's election day. It's pouring rain, the line is two hours long, and you have a lot of work to do.
  *   **A.** I go anyway. Nothing short of illness should stop me from fulfilling my duty.
  *   **B.** I stay home. The "cost" of voting outweighs the likely benefit of my single vote.
  *   **C.** I go, but only because I'm passionate about this specific candidate. If I didn't care about them, I'd stay home.

  ### 8. The Down-Ballot Ignorance
  You're voting for President, but you know nothing about the candidates for City Judge or Sheriff further down the ballot.
  *   **A.** I skip those races. Voting without knowledge is dangerous.
  *   **B.** I flip a coin or pick a party line. It matters that I complete the ballot, not how I decide every race.
  *   **C.** I vote based on the one or two things I do know, even if it's incomplete info.

  ### 9. The Magic Tie (Hypothetical)
  Imagine a wizard tells you: "In this specific election, your vote will definitely be the one that ties the result, sending it to a coin flip to decide the winner."
  *   **A.** I definitely vote. Finally, my vote actually matters.
  *   **B.** I vote, but I would have voted anyway even without the wizard.
  *   **C.** I still might not vote if I dislike both candidates. My integrity matters more than deciding the winner.

  ### 10. The Aftermath
  Your preferred candidate loses by a landslide. The policy outcomes you feared come to pass.
  *   **A.** I feel my time was wasted. I should have focused on non-electoral activism.
  *   **B.** I feel disappointed but satisfied. I did my part as a citizen; the rest is out of my hands.
  *   **C.** I feel proud I stood by my principles. Losing doesn't make my stance wrong.

  ***

  # Scoring Key & Archetypes

  Tally up your answers below. You may have a mix, but look for your **dominant** letter pattern.

  | Question | **A** (The Actuary) | **B** (The Citizen) | **C** (The Voice) | **D** (The Dam-Controller) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Landslide** | Stay Home | Vote Anyway | Vote Preference | — |
  | **2. Garbage** | Less Damage | — | Align Values | — |
  | **3. Third-Party** | Major (Lesser) | — | Small (Sincere) | — |
  | **4. Friend's Math** | — | Obligation | Expression | — |
  | **5. Compulsory** | — | Oppose (Choice) | Support (w/ Option) | — |
  | **6. Protest** | — | Blank/Protest | Reject Choices | Least Bad |
  | **7. High Cost** | Cost > Benefit | Duty > Cost | Passion > Cost | — |
  | **8. Down-Ballot** | Skip (Ignorance) | Complete Ballot | Partial Info | — |
  | **9. Magic Tie** | Finally Matters | Would Anyway | Integrity > Win | — |
  | **10. Aftermath** | Wasted Time | Did My Part | Proud/Principled | — |

  *(Note: Some questions did not offer a "Tactical/Dam-Controller" option because they were designed to distinguish other views. If you chose "Less Damage" or "Least Bad" options in Q2, Q3, or Q6, add a tally to **The Dam-Controller** column.)*

  ### The 5 Archetypes

  **1. The Actuary (Consequentialist/Instrumental)**
  *   **Mostly A's.**
  *   **View:** Voting is a tool to produce outcomes. If the tool doesn't work (safe seats, low probability), don't use it.
  *   **Blind Spot:** Can lead to disengagement in non-swing areas. May struggle to justify voting in "hopeless" races even for down-ballot impact.
  *   **Incoherent Combo:** If you are an Actuary but supported Compulsory Voting (Q5 Option A), your view is unstable. Why force others to do math you deem irrational?

  **2. The Citizen (Civic Duty)**
  *   **Mostly B's.**
  *   **View:** Voting is an obligation of membership in society, akin to taxes or jury duty. The outcome is secondary to the participation.
  *   **Blind Spot:** May vote without informing themselves (Q8) just to "complete the duty."
  *   **Incoherent Combo:** If you are a Citizen but chose to spoil/blank the ballot as a protest (Q6 Option A), you are redefining "duty" as "presence" rather than "selection." This is valid but distinct from traditional duty.

  **3. The Voice (Expressive & Sincere)**
  *   **Mostly C's.**
  *   **View:** Voting is an act of self-definition or moral integrity. It is about saying "This is who I am" or "This is what is right," regardless of the win/loss record.
  *   **Blind Spot:** Can prioritize purity over harm reduction.
  *   **⚠️ Diagnostic Limitation:** This quiz **cannot** reliably separate *Expressive Voting* (cheering for a team/identity) from *Sincere Voting* (maintaining moral integrity). Both result in voting third-party in safe seats or spoiling ballots.
      *   *How to separate them:* Ask this follow-up case: **"The Dead Candidate."** Would you vote for a candidate who perfectly matches your views but died yesterday (making the vote purely symbolic)?
          *   **Expressive:** Yes. The statement is the point.
          *   **Sincere:** No. A vote implies a desire for governance; a dead person can't govern, so the vote is incoherent.

  **4. The Dam-Controller (Tactical Lesser-Evil)**
  *   **Tally "Lesser Evil" choices in Q2, Q3, Q6.**
  *   **View:** A subset of Consequentialism. The world is bad; voting is strictly about harm reduction. Principles are a luxury you can't afford when stakes are high.
  *   **Blind Spot:** Can lead to burnout or feeling complicit in bad systems.
  *   **Incoherent Combo:** If you are a Dam-Controller but voted Third Party in a Swing State (Q3 Option B), you are acting against your own philosophy.

  **5. The Architect (Compulsory Supporter)**
  *   **Supported Compulsory Voting in Q5.**
  *   **View:** Individual voting habits matter less than systemic participation rates. Legitimacy comes from universal participation, not voluntary enthusiasm.
  *   **Note:** This often overlaps with **The Citizen**, but The Citizen relies on internal guilt, while The Architect relies on external rules.

  ### Rare & Incoherent Combos

  *   **The Actuary + The Architect:** You believe individual votes are mathematically pointless (Q1/Q4), but you support fining people who don't vote (Q5). *Why:* You likely view voting as a "public good" like vaccination (herd immunity) rather than an individual impact tool.
  *   **The Citizen + The Actuary:** You vote out of duty (Q1) but only when the race is close (Q9). *Why:* This is the most common "confused voter" profile. You feel the social pressure to vote but the logical pressure to abstain.
  *   **The Voice + The Dam-Controller:** You vote for principles (Q3) but also argue you must stop the worst evil (Q2). *Why:* This is the classic "Lesser Evil vs. Third Party" internal conflict. Most people oscillate between these depending on how scared they feel of the "Worst" candidate.

  ### How to Use This in Conversation
  When a friend says, "You should vote," ask: *"Which quiz result are you arguing from? Are you asking me to be a Citizen, or are you asking me to be an Actuary?"*
  *   If they are a **Citizen**, arguing math (Actuary) won't work. You must argue about community obligation.
  *   If they are an **Actuary**, arguing duty (Citizen) won't work. You must argue about down-ballot impact or long-term signaling.
  *   If they are **The Voice**, arguing "wasted vote" is insulting. You must argue about the moral cost of compromising their values.
