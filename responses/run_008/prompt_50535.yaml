  Dear Mr. Prufrock,

  On behalf of the entire team at Moral Asset Management Group, I am delighted to welcome you to our family of conscientious investors. We understand that navigating the volatile markets of normative ethics can be daunting for the individual agent, which is why you have made the prudent choice to outsource your deliberative labor to our professionals. Your account has been successfully opened and funded with your initial credence distribution, and we are eager to begin maximizing your expected choiceworthiness immediately. Our flagship product, the MEC Diversified Conscience Fund, operates on the straightforward principle that you should never put all your moral eggs in one theoretical basket. Rather than committing wholly to utilitarianism or deontology, you will hold a diversified portfolio weighted by your confidence levels, ensuring that even if Kant turns out to be a bad investment, your hedge in consequentialism will preserve your rectitude.

  We anticipate your first question regarding intertheoretic value comparison, specifically how we intend to reconcile the vastly different denominations of utility units versus duty constraints. This is a common concern among new clients who worry about comparing apples to oranges, or rather, hedons to categorical imperatives. Please rest assured that Moral Asset Management Group employs a proprietary normalization process that resolves these currency conversion headaches seamlessly. While we cannot disclose the specific mechanics of our valuation algorithm due to non-disclosure agreements with our quantitative ethicists, you need not worry about the coherence of the exchange rate. Our black box ensures that all theories are speaking the same financial language, allowing us to calculate a unified expected value for every potential action in your portfolio without you having to engage in the messy metaphysics of cardinal utility yourself.

  For clients who remain uncomfortable with cardinal comparisons, we also offer the Borda Count Conservative Plan. This no-favorites approach treats your moral theories as ordinal rankings rather than measurable quantities, simply counting votes based on where each theory ranks your available options. While this strategy offers lower growth potential in terms of moral impact, it provides stability against the volatility of extreme theories that might demand unsustainable sacrifices. Regardless of the plan you choose, your theories will be managed as a coalition government within your psyche. Our standard practice is to allow the majority partners to dictate daily operations while quietly freezing out the fringe parties until their votes are needed for a risky moral vote. This ensures efficient governance without the paralysis of constant internal debate, though it does occasionally lead to minority theories feeling disenfranchised during periods of high moral stress.

  We are required by compliance to disclose certain risks associated with moral portfolio management. Specifically, clients should be aware that maximizing expected choiceworthiness can sometimes recommend compromise actions that none of your held theories actually endorse when considered in isolation. Just as a diversified financial portfolio might hold assets no single analyst would recommend on their own, your moral portfolio may direct you to perform actions that appear suboptimal or even wrong from the perspective of every individual theory in your mix. This is a feature of the system, not a bug, designed to hedge against the risk of being confidently wrong, but we want you to be fully informed that you may occasionally feel like you are doing something no one believes in.

  Furthermore, we have noticed some clients attempting to question the metaphysical status of their moral credences, asking whether there is truly a fact of the matter about the probability of a moral theory being true in the same way there is for empirical bets. Moral Asset Management Group finds this line of inquiry unproductive and potentially damaging to your account performance. Our models require objective credences to function, and questioning the reality of your own confidence levels introduces unnecessary friction into the decision-making pipeline. We strongly advise against introspecting too deeply on the nature of moral truth while your portfolio is active, as skepticism can lead to deliberation paralysis and missed opportunities for doing good.

  Please review the attached terms of service, which include the standard disclaimer that past moral performance is no guarantee of future rectitude. Just because a theory yielded high utility in the nineteenth century does not mean it will perform well in the current ethical climate. We look forward to a long and profitable partnership in doing good by doing well.

  Sincerely,

  Gavin Stirling
  Senior Moral Portfolio Advisor
  Moral Asset Management Group
