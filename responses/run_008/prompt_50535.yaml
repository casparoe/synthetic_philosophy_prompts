prompt: |-
  hey, so im taking a seminar this semester on decision-making under moral uncertainty (we just wrapped up the MacAskill/Bykvist/Ord book, Moral Uncertainty, Oxford 2020) and instead of another essay I convinced my prof to let me submit a satirical piece, as long as it's philosophically serious. here's what I want you to write for me: a welcome letter, roughly 700 words, from a fictional "moral portfolio management" firm to a brand new client. the conceit is that deciding what to do under moral uncertainty is treated exactly like personal financial planning: you hold credences in various moral theories, and rather than committing to one and living by it, you invest across all of them. the letter should be deadpan sales-puffery from start to finish and the advisor fully believes in the product, never winks, never breaks character. the jokes have to come from actually getting the literature right so a specialist laughs instead of winces. stuff I'd love to see worked in: maximize expected choiceworthiness pitched as the flagship "diversified conscience fund"; the intertheoretic value comparison problem showing up as a currency conversion headache between theories with wildly different denominations, with the firm hand-waving the genuinely hard part via some proprietary "normalization process" it refuses to explain; the Bordo count (sorry, Borda count) offered as the "no favorites" plan for clients who refuse to compare theories' currencies at all; the old objection that compromise actions can be ones that none of your theories actually endorses, dressed up as a risk disclosure line; the worry that there's no fact of the matter about the "chance" of a moral theory being true the way there is with empirical bets, which the firm gets oddly defensive about in the fine print; and ideally a nod to running your theories as a coalition, with the majority partners quietly freezing out the fringe party until it's needed for a risky vote. also somewhere a disclaimer that past moral performance is no guarantee of future rectitude, you get the vibe. invent the firm name, the client, whatever details you want. one constraint from my prof: the piece has to be continuous prose only, no headings, no bullet points, no bold, nothing like that — like an actual letter, just flowing paragraphs. I know a real brochure would have lists and sidebars but the assignment rules are the assignment rules. thanks!!
