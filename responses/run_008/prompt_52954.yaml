      *   **Context:** Rent control city (vacancy decontrol: existing tenants protected, new tenants pay market rate). Friend got a minimum wage hike.
      *   **Core Question:** What is the underlying *theory of fairness/justice* that justifies rent control (specifically vacancy decontrol) and minimum wage laws *together*?
      *   **Specific Puzzles:**
          1.  Why protect existing tenants but not new applicants? (Incumbency vs. Access).
          2.  Why price ceilings for rent but price floors for wages? (Symmetry in protecting the "weaker" party).
      *   **Requirements:** Reconstruct the implicit theory, identify where it's coherent vs. underdetermined, contrast with rival theories, and explain what laws would look like under different theories. Avoid standard Econ 101 efficiency lectures.

  2.  **Deconstruct the Implicit Theory:**
      *   *What connects Rent Control (RC) and Minimum Wage (MW)?* Both intervene in voluntary contracts to protect a party deemed structurally weaker or vulnerable to exploitation.
      *   *What is the specific conception of fairness?* It's not "freedom of contract" (libertarian). It's not "just price" in the scholastic sense (intrinsic value). It looks like a mix of *Relational Fairness* and *Security/Stability*.
      *   *The "Incumbency" Puzzle:* Why protect the sitting tenant but not the newcomer?
          *   Hypothesis 1: Lock-in/Switching Costs. The sitting tenant has invested in the community, schools, social networks. Moving is costly. The landlord has leverage *because* of this lock-in. The newcomer hasn't locked in yet.
          *   Hypothesis 2: Expectation/Reliance. The tenant relied on the continued housing.
          *   Hypothesis 3: Political Reality (User's suspicion). Incumbents vote; newcomers don't exist yet.
          *   *Principled Defense:* It's about preventing *hold-up problems*. Once you are in, I can squeeze you. Before you are in, we are at arm's length.
      *   *The "Ceiling vs. Floor" Puzzle:*
          *   Rent: Ceiling (Landlord can't charge too much).
          *   Wage: Floor (Employer can't pay too little).
          *   *Symmetry:* In both cases, the "capital owner" (Landlord/Employer) has leverage over the "labor/resident" (Tenant/Worker).
          *   *Direction:* Rent is a cost to the vulnerable; Wage is income to the vulnerable. Capping cost = Floor on disposable income. Setting floor on income = Capping exploitation. They are functionally similar in protecting the bottom line of the weaker party.

  3.  **Identify the Philosophical Frameworks:**
      *   **Libertarian/Classical Liberal:** Freedom of contract. Rejects both RC and MW. (Rival Theory 1).
      *   **Neoclassical Efficiency:** Focus on surplus, deadweight loss. Generally skeptical of both, though might accept MW for monopsony. (User wants to avoid this, but it's a rival).
      *   **Rawlsian/Distributive Justice:** Focus on the least advantaged. Might support MW, but RC is tricky (helps incumbents, hurts newcomers).
      *   **Relational Equality/Republican Non-Domination:** This is the strongest fit. Focuses on power dynamics, dependency, and arbitrary power.
          *   *Key Concept:* **Status Contract vs. Market Contract.** (Henry Maine).
          *   *Key Concept:* **Hold-Up Power.**
      *   **Sufficientarianism:** Everyone needs a minimum threshold of housing/income.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's position (accidental landlord) and validate the philosophical depth of the question. State the thesis: The implicit theory is **Relational Fairness regarding Dependency and Hold-Up Power**, not abstract market freedom.

      *   **Part 1: The Theory of the "Weaker Party" (Ceilings vs. Floors):**
          *   Explain why one is a ceiling and one is a floor. It's about the *direction of payment*.
          *   Tenant pays Landlord -> Cap the outflow.
          *   Employer pays Worker -> Cap the outflow (from employer) / Floor the inflow (to worker).
          *   *Underlying Principle:* **Anti-Exploitation via Bargaining Asymmetry.** The market isn't neutral; capital has structural leverage over labor/housing seekers.
          *   *Coherence:* High. Both aim to prevent the capital holder from using necessity (need shelter, need food) to dictate terms.

      *   **Part 2: The Incumbency Puzzle (Vacancy Decontrol):**
          *   This is the trickiest part. Why protect the insider?
          *   *The "Hold-Up" Theory:* Once a tenant moves in, they incur switching costs (schools, job commute, furniture). The landlord knows this. This creates a specific *ex post* monopoly. The market is competitive *ex ante* (searching), but monopolistic *ex post* (staying).
          *   *The "Home as Status" Theory:* A rental isn't just a commodity; it's a foundation for citizenship/stability. Disrupting an established life is a greater harm than pricing a new entrant out (in the eyes of the legislator).
          *   *Is it principled?* Yes, if you view the harm as *displacement* rather than *access*.
          *   *Is it arbitrary?* Yes, if you view the harm as *housing affordability* generally. It creates a "lucky insider" vs. "unlucky outsider" dynamic.
          *   *Political Reality:* Acknowledge the user's suspicion. Incumbents vote.

      *   **Part 3: Rival Theories (What would change the laws?):**
