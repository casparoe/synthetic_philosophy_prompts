          *   **Socialist/Decommodification:** Social housing. Rent isn't market-based at all. No "vacancy decontrol" because there's no market rent.
          *   **Efficiency/Welfarist:** MW only if monopsony exists. RC generally rejected (creates shortage).

      *   **Part 4: Synthesis/Critique of the Implicit Theory:**
