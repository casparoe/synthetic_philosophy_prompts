answer: |-
  This is a remarkably sharp question. You've identified the exact friction points where the moral philosophy of housing and labor law rubs against standard market intuition. You are asking for the *normative architecture* beneath the statutes, not the *positive economics* of their outcomes.

  The short answer is that rent control (specifically with vacancy decontrol) and minimum wage laws, taken together, presuppose a theory of **Relational Fairness based on Dependency and Hold-Up Power**, rather than a theory of Distributive Justice or Freedom of Contract.

  Here is a reconstruction of that implicit theory, where it holds together, where it frays, and how rival theories would reshape the laws you are now navigating.

  ### 1. The Symmetry of Ceilings and Floors
  You asked why rent gets a ceiling and wages get a floor. On the surface, they look like opposite interventions. But under the implicit theory of these laws, they are functionally identical.

  **The Theory:** The market is not a neutral meeting place of equals; it is a structure where capital (landlords, employers) holds structural leverage over necessity (shelter, subsistence).
  *   **Rent:** Money flows *from* the vulnerable party (tenant) *to* the powerful party (landlord). To protect the vulnerable, you cap the outflow.
  *   **Wages:** Money flows *from* the powerful party (employer) *to* the vulnerable party (worker). To protect the vulnerable, you floor the inflow.

  **The Coherence:**
  Both laws operate on the premise that **necessity negates consent.** A worker starving cannot truly "voluntarily" agree to $2/hour, just as a family freezing cannot truly "voluntarily" agree to 80% of their income on rent. The state intervenes not to set a "just price" in the medieval sense (an intrinsic value of the labor or the brick), but to prevent **exploitation of necessity.**

  In this view, fairness isn't about the price matching the market clearing rate; it's about ensuring the weaker party retains enough surplus (income or housing stability) to function as a citizen. This is a **Sufficientarian** view mixed with **Republican Non-Domination**. It seeks to prevent the tenant/worker from being dominated by the arbitrary will of the capital holder.

  **Where it works:** It explains the direction of the regulation perfectly. Both move the price away from the "market clearing" point toward a point that sustains the biological and social viability of the weaker party.

  ### 2. The Incumbency Puzzle (Vacancy Decontrol)
  This is the harder philosophical nut. Why does the law protect the tenant *inside* the unit but abandon the tenant *outside* the unit? Your suspicion that this is just "incumbent politics" is partially right, but there is a principled argument beneath it.

  **The Theory:** **Ex-Post Monopoly and Switching Costs.**
  The implicit theory distinguishes between *access* to housing and *security* of housing.
  *   **Ex-Ante (The Search):** When a tenant is looking for an apartment, the market is theoretically competitive. There are many units, many landlords. The tenant has choice.
  *   **Ex-Post (The Tenancy):** Once a tenant moves in, buys furniture, enrolls kids in school, and commutes to a specific job, their switching costs skyrocket. *You*, the landlord, now have a local monopoly on *their* housing. You can squeeze them because moving is devastatingly expensive for them, even if there are other apartments in the city.

  **The Principled Defense:**
  The law views the harm of **displacement** as qualitatively worse than the harm of **high entry prices.**
  *   **The Incumbent:** Has a "reliance interest." They have built a life. Evicting them or pricing them out destroys social capital, community ties, and stability. The law treats the home as a *status* (a place of belonging) rather than a *commodity* once occupied.
  *   **The Newcomer:** Has not yet incurred these sunk costs. They are still in the "market phase." The law assumes they can shop around, negotiate, or choose a different neighborhood.

  **Vacancy Decontrol** is the compromise between this relational fairness and the landlord's property rights. It says: *"You (the landlord) cannot exploit the tenant's lock-in (the hold-up problem). But once the tenant voluntarily leaves, the lock-in is broken, and you may recover the market value of your asset."*

  **Where it Frays:**
  This theory collapses if there is a general shortage of housing. If the "market phase" is actually a desperate scramble with no vacancies, the newcomer is just as vulnerable as the incumbent. In that case, the distinction between *ex-ante* and *ex-post* bargaining power is illusory.
  *   **The Arbitrariness:** It creates two classes of citizens: those with "protected status" housing and those without. It prioritizes the stability of the current voter over the needs of the future resident. As you noted, this looks like a political moat.

  ### 3. Rival Theories and How They Would Change Your Laws
  To see the contours of the current theory, it helps to look at what the laws would look like under different philosophical frameworks.

  #### A. Libertarian / Freedom of Contract
  *   **Theory:** Fairness is procedural, not substantive. If no force or fraud is used, the price is fair.
  *   **The Laws:** **No Rent Control. No Minimum Wage.**
  *   **Rationale:** You own the duplex; your friend sells his labor. Any state intervention violates property rights and liberty. The "fairness" is in the freedom to walk away (even if walking away is hard).
  *   **Difference:** Rejects the premise that necessity negates consent.

  #### B. Strict Distributive Justice (Rawlsian)
  *   **Theory:** Fairness is about the outcome for the least advantaged, regardless of contractual status.
  *   **The Laws:** **Universal Housing Vouchers + Negative Income Tax.**
  *   **Rationale:** Rent control is actually regressive (it helps lucky incumbents, hurts poor newcomers). A Rawlsian would rather subsidize the *person* than the *unit*. You could charge market rent, but the tenant gets a voucher to cover it. Your friend gets a wage supplement if the market pays him too little.
  *   **Difference:** Solves the "Incumbency Puzzle." A newcomer and an incumbent get the same support. It decouples housing security from the specific lease agreement.

  #### C. Socialist / Decommodification
  *   **Theory:** Housing and Labor are not commodities to be traded for profit.
  *   **The Laws:** **Social Housing + Sectoral Bargaining.**
  *   **Rationale:** You shouldn't be a landlord at all. The duplex should be part of a public trust. Rent is set at maintenance cost, not market rate, for *everyone* (no vacancy decontrol). Wages are set by industry councils, not minimums.
  *   **Difference:** Removes the "market rate" entirely. There is no "release" to market pricing when a tenant leaves because there is no market pricing.

  #### D. The Current "Relational Stability" Model (What you have now)
  *   **Theory:** Prevent exploitation of dependency within ongoing relationships.
  *   **The Laws:** **Rent Control (with vacancy decontrol) + Minimum Wage.**
  *   **Rationale:** We accept the market exists, but we dampen its volatility where human stability is at stake.
  *   **Difference:** It accepts the "Insider/Outsider" inequality as the price of preserving the rental stock (by allowing landlords to eventually get market rates) while protecting current residents from displacement.

  ### 4. Is the Selectivity Principled or Political?
  You asked if the selectivity (protecting incumbents, not newcomers) is principled.

  **It is principled regarding *Hold-Up*, but arbitrary regarding *Need*.**

  *   **Principled:** It correctly identifies that a landlord has specific leverage over a *current* tenant that they do not have over a *prospective* tenant. The current tenant is "hostage" to their own sunk costs. The law prevents you from holding that hostage.
  *   **Arbitrary:** It assumes the prospective tenant has power they often don't have. In a tight market, a newcomer is just as desperate as an incumbent. By allowing you to charge "whatever the market will bear" to a newcomer, the law acknowledges that *access* is a market good, but *stability* is a right.

  **The Political Reality:**
  You are correct that this is politically convenient. Incumbent tenants vote in your city. Prospective tenants often live outside of it or are not yet born. The law creates a "property right in the lease" for the incumbent. This is why vacancy decontrol is the standard compromise: it keeps landlords from exiting the market entirely (since they know they can reset the rent eventually) while buying peace with the current voting population.

  ### 5. Summary for the Accidental Landlord
  The theory operating on your duplex is this: **Housing is a commodity for acquisition, but a right for retention.**

  *   **Minimum Wage:** Says labor cannot be priced below subsistence because the worker is dependent on the employer.
  *   **Rent Control:** Says rent cannot be raised above stability for the incumbent because the tenant is dependent on the landlord *once established*.
  *   **Vacancy Decontrol:** Says the landlord's right to return on investment trumps the newcomer's right to affordable entry, but not the incumbent's right to stay.

  **Where the theory is coherent:** It consistently protects the party with higher switching costs and lower bargaining power in an *ongoing* relationship.
  **Where the theory is underdetermined:** It fails to account for market-wide scarcity. If housing is scarce, the "newcomer" is just as locked-in by necessity as the "incumbent," making the distinction morally hollow.

  **If you wanted a truly consistent theory:**
  *   **Libertarian:** Charge whatever you want. (Violates your sense of fairness regarding necessity).
  *   **Universalist:** Charge market rate, but support your tenant with a subsidy if she can't afford it. (Removes the burden from you, the accidental landlord, and places it on the state).
  *   **Strict Control:** Cap the rent even for new tenants. (Protects fairness across the board, but risks you losing money on the unit or exiting the market).

  You are living in the compromise zone. The law treats you not as an individual who inherited a home, but as a member of a class (Landlords) that possesses structural power, while treating your tenant as a member of a class (Tenants) that possesses structural vulnerability. It prioritizes her *stability* over your *yield*, but preserves your *yield* over the *access* of the next person. It is a system designed to prevent revolution (displacement) more than it is designed to ensure equity (affordability).
