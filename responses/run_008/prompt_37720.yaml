answer: |-
  Your intuitions are consistent only if you accept that metaphysical facts about experience can outstrip epistemic access, though this forces you to abandon your confidence in comparing pain across time.

  The principle capturing your position is **Phenomenal Realism with Epistemic Decay**. It comprises three clauses:

  1.  **Immediate Infallibility:** Direct awareness of current phenomenal character is incorrigible; the seeming is the being. (Motivated by Verdict 2).
  2.  **Metaphysical Realism:** Past phenomenal states possess definite properties independent of current access or memory. (Motivated by Verdicts 1 and 4).
  3.  **Mnemic Fallibility:** Access to past states relies on reconstruction, which is subject to error and drift. (Motivated by Verdict 5).

  This principle saves Verdicts 1, 2, 4, and 5, but it cannot save Verdict 3 without modification. Your claim that you *know* the pain got duller (V3) contradicts the admission that cross-time comparison is a reconstruction subject to drift (V1 and V5). To maintain consistency, you must overturn the certainty in V3: you can believe the pain *probably* changed, or that the *memory* of the pain changed, but you cannot claim infallible knowledge of the qualitative shift itself. The engineer in you should recognise this as a race condition; you are reading a stale value from memory and comparing it to a live register, assuming the stale value is bit-perfect when your own architecture says it is not.

  Regarding the tinted contact lens case: your principle predicts there **is** a fact of the matter about the wearer's qualia shifting, even if they insist it did not. Because you are a Realist (V1, V4), you hold that the physiological change alters the phenomenal character regardless of the subject's adapted judgment. The friend is right about the external physics, but you must side with the metaphysical possibility that the wearer's 'white' qualia drifted while their cognitive label for 'white' remained fixed. If you deny this, you slide towards Dennett's functionalism, where the report *constitutes* the fact, thereby abandoning V1 and V4.

  You are correct that this debate bottoms out in 'experience' meaning two different things. Philosophers distinguish **Phenomenal Character** (the raw, intrinsic feel, which your Realism protects) from **Phenomenal Judgment** (the cognitive report or belief about that feel, which your Cache Theory explains). Your discomfort arises because V2 treats them as identical (in the present), while V1 and V5 treat them as separable (across time). Accepting this distinction resolves the tension: you are infallible about current Phenomenal Character, but fallible about Phenomenal Judgments concerning the past.
