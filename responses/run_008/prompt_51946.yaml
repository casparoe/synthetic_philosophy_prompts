answer: |-
  This is a version of **Kavka's Toxin Puzzle**, and your discomfort is well-founded. It lands close to home because it isn't really about billionaires or toxins; it is about **agency over time**. The argument you've been handed is a formalized version of the fear that you are not a single person, but a sequence of conflicting selves, and that "Present You" cannot trust "Future You."

  You asked to keep Premise (1) (*Intention requires expectation*). That is a wise constraint; without it, intention collapses into wishful thinking. To save (1) and save your race strategy, you must reject the inference to **Step (5)**.

  Here is the breakdown of why that step is the weak link, why it seduces us, and what you pay to reject it.

  ### The Step to Reject: The Inference to (5)
  **The Step:** "So today I expect that tomorrow morning I will not drink."
  **Derived from:** (3) *Tomorrow, not drinking is rational* + (4) *I know this today*.

  **Why it looked sound:**
  This step relies on a specific model of rational agency called **Sophistication**. A "Sophisticated" agent knows they will be rational in the future. Since standard decision theory (Causal Decision Theory) says drinking the toxin is irrational *at the moment of drinking* (because the money is already safe and the pain is real), the Sophisticated agent predicts their future self will follow that logic. They view their future self as a separate entity whose actions they must predict, not control.

  It feels sound because it aligns with our experience of akrasia (weakness of will). We often look at our future selves and think, "I know I'll be tired tomorrow, so I know I won't run." We treat our future rationality as a fixed law of nature, like gravity.

  **Why you should reject it:**
  You should reject (5) because it assumes **Temporal Separability**—the idea that what is rational for you tomorrow is independent of the intentions you form today. It assumes your future self is a stranger you are merely observing.

  By rejecting (5), you are adopting a model of **Resolute Choice** (championed by philosopher Edward McClennen). A Resolute Chooser does not just *predict* their future action; they *determine* it by forming an intention now that they commit to honoring later. When you form the intention today, you are not merely guessing what you will do; you are making a plan that *makes it the case* that you will do it.

  Therefore, you *can* expect to drink the toxin (or train for the race), not because drinking is locally beneficial tomorrow, but because **you have decided that your fidelity to the plan is part of your utility function.** You expect to drink because you intend to, and you intend to because you are the kind of agent whose intentions constrain future choices.

  ### The Cost of This Rejection

  Rejecting (5) is not free. It demands a significant shift in how you view your own rationality.

  **1. You must abandon "Myopic Rationality."**
  Standard decision theory says rationality is about maximizing utility *at the moment of choice*. Tomorrow, drinking the toxin has negative utility (pain) and zero positive utility (money is sunk). So Myopic Rationality says "Don't drink."
  To reject (5), you must accept **Temporal Non-Separability**. You must believe that rationality applies to your *life as a whole*, not just the present moment. It costs you the comfort of saying, "It would be irrational for me to drink tomorrow." You have to accept that it is rational to drink tomorrow *because* it was rational to intend today. You are binding your future self's hands not with ropes, but with reasons.

  **2. You lose the excuse of "Predictable Failure."**
  If you accept (5), you can say, "I didn't fail; I just correctly predicted I would fail." It absolves you of responsibility. If you reject (5), you admit that your expectation of failure was a self-fulfilling prophecy. You cannot hide behind the prediction that Future-You is lazy. You have to acknowledge that Present-You has the power to make Future-You resolute. This places a heavier burden on you: you are responsible for your future compliance in a way you aren't if you view your future self as a separate, unpredictable agent.

  **3. You must tolerate a paradox of justification.**
  Tomorrow, when you hold the toxin, you will not be able to justify drinking it by saying, "This gives me money." The money is already there. You will have to justify it by saying, "I am doing this because I said I would." For many, this feels like an empty reason. Accepting Resolute Choice requires you to value **integrity** or **plan-following** as a terminal good, not just an instrumental one.

  ### What This Costs for Your Race Strategy

  This is where the theory meets the pavement. Your race strategy involves nonrefundable fees and public commitments.

  **If you keep Step (5) (The Pessimistic View):**
  Your strategy is purely external. You are admitting, "I cannot trust my internal intentions. I must build a cage of financial loss and social shame to force Future-Me to run." This works, but it is fragile. If the external cost isn't high enough, Future-Me defects. It treats your agency as broken.

  **If you reject Step (5) (The Resolute View):**
  Your strategy changes from a "cage" to a "scaffold."
  1.  **The Fees/Commitments:** These are not just threats; they are **coordination devices**. They help align Future-Me's local incentives with Present-Me's global plan. They make the "Toxin" (the hard training) locally rational tomorrow by adding a cost to skipping.
  2.  **The Intention:** You don't need the fees to make the intention *possible*, only to make it *easier*. By rejecting (5), you validate that you *can* intend to train even without the fees, simply by resolving to be a person who keeps plans.
  3.  **The Risk:** The cost is that if you rely *only* on the fees, you haven't actually solved the agency problem; you've just outsourced it. If you want to be a Resolute Chooser, the fees should be backups, not the primary engine. The primary engine must be your commitment to viewing yourself as a unified agent over time.

  ### Summary
  The argument your brother showed you is a proof that **Causal Decision Theorists cannot get the million dollars.** It is not a proof that **humans cannot intend.**

  By rejecting the slide to **(5)**, you affirm that you are not a passive predictor of your own behavior. You are an active shaper of it. You *can* expect to train for the race, not because training will feel good tomorrow (it won't), but because you are resolving today that your future actions will honor your current plans.

  The cost is that you can no longer treat your future laziness as a foregone conclusion. You have to believe, genuinely, that you have the power to make yourself drink the toxin (or run the miles) simply because you decided to. That is a heavier burden than pessimism, but it is the only one that allows you to cross the finish line.
