answer: |-
  You must establish who holds the right to self-determination before you can argue when they may exercise it to secede.

  **The Dependency Structure**
  Your session must follow this logical sequence; skipping step one makes step two incoherent.
  1.  **The Unit of Self-Determination:** Before asking if a region can leave, you must define what counts as a 'self'. Is the right held by individuals, a cultural nation, or an existing administrative border? This must be settled first, otherwise, you cannot determine who is entitled to vote in a referendum.
  2.  **The Nature of the Right:** Once the 'self' is defined, you must distinguish between a primary right (unconditional, like divorce) and a remedial right (conditional on injustice). This determines whether a vote alone is sufficient or if grievance is required.
  3.  **The Procedural Consequence:** Only after establishing the nature of the right can you discuss the process. Does a valid claim necessitate unilateral declaration, or does it merely trigger a duty to negotiate?

  **The Carrying Case: Quebec**
  Select the 1995 Quebec referendum and the 1998 Supreme Court Reference. While Catalonia offers a sharper grievance narrative, it is too entangled with questions of police violence and unilateral declaration to serve a non-partisan legal education session. Quebec provides the cleanest separation between political desire and legal right. The Supreme Court Reference explicitly rules that there is no unilateral right to secede under Canadian or international law, but establishes a duty to negotiate if a clear majority answers a clear question. This allows you to discuss the *conditions* for secession without the session devolving into arguments about state repression.

  **Misconceptions and Kill Points**
  1.  **'International law obviously grants a right to secede.'**
      *   **Kill point:** During *The Unit of Self-Determination*.
      *   **Method:** Show that international law recognises self-determination primarily for colonised peoples or those under foreign occupation, not established regional minorities within democracies. Use the Quebec Reference to show domestic courts align with this view.
  2.  **'Self-determination means whatever a regional majority votes for.'**
      *   **Kill point:** During *The Nature of the Right*.
      *   **Method:** Contrast the primary-right view (vote = exit) with the remedial-right view (vote = leverage for negotiation). Use the Quebec 'Clarity Act' to demonstrate that a vote triggers a process, not an automatic outcome.
  3.  **'The divorce analogy settles anything.'**
      *   **Kill point:** During *The Procedural Consequence*.
      *   **Method:** Explain that divorce involves two consenting parties within a defined legal framework, whereas secession involves changing the framework itself and affects non-consenting parties (the remaining state and minorities within the seceding region).

  **The Unsettlable Question**
  Openly refuse to settle the **threshold of grievance required for a remedial right**. State clearly that while philosophy agrees injustice may trigger a right to secede, there is no consensus on how much injustice is enough. Is cultural suppression sufficient, or must there be physical persecution? Tell the audience that this is a political question, not a legal one, and no ninety-minute session can codify a moral threshold for revolution.

  **The Diagnostic Question**
  To test if they understand the remedial versus primary-right split, ask:
  *'If a region is treated fully fairly by the central state with no evidence of persecution, but 60% of its voters still wish to leave, does the remedial-right theory suggest the central state is legally obliged to grant independence?'*
  If they answer 'yes', they have reverted to a primary-right intuition or personal opinion; the correct answer based on the remedial framework is 'no', as the condition for the right (injustice) has not been met.
