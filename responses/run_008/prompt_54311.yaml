prompt: |-
  I run a non-partisan citizenship education series at a community centre, and next month I'm doing a ninety-minute session on when, if ever, a region has a right to leave its state. The audience is informed laypeople who follow the news but read no philosophy — think people who can name the 2014 Scottish referendum and know vaguely that Madrid declared the 2017 Catalan referedum illegal. Plan the session for me; don't explain the theories to me. I want the dependency structure — what has to be in place before the question "is there a right to secede" is even well-posed (I suspect the personal vs territorial scope of self-determination has to come first, but correct me if I'm wrong), and the order the rest must go in after that. I'm torn about the single carrying case: Quebec gives me two referendums and a Supreme Court reference, Catalonia gives me a clearer grievance story — pick one and say why. Then the misconceptions they'll walk in with, and where in the arc to kill each one: at minimum that international law obviously grants a right to secede, that self-determination means whatever a regional majority votes for, and that the divorce analogy settles anything. Plus one thing I should openly refuse to settle in ninety minutes and say so out loud. End with a question I can ask that distinguishes whether they actually understood the remedial-right versus primary-right split from just having opinions about Spain. Lead with your bottom line in the first sentence, then the reasoning, no preamble, and please write it in British English.
