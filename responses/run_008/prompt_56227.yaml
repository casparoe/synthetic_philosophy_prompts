answer: |-
  This is a classic historiography pub fight. The older professor is wielding Ranke's phrase as a "conversation stopper," conflating *accuracy* with *narrative singularity*. To dismantle this before Thursday, you need to separate the slogan into its component logical claims. The slogan only works as a slam dunk if all the claims stand together; if one falls, the "fiction with footnotes" accusation loses its force.

  Here is the menu of distinct claims hidden in *wie es eigentlich gewesen*, with verdicts and an assessment of whether Carr or White actually touch them.

  ### The Menu of Claims

  **1. The Anti-Fabrication Claim (Trivial)**
  *   **The Claim:** Historians must not invent evidence, lie about sources, or assert things for which there is no archival trace. The past constrains what we can say.
  *   **Verdict:** **Plausible.** (Almost universally accepted). Even Hayden White agrees that the historical record imposes limits; you cannot emplot the Holocaust as a comedy without violating the evidence.
  *   **Carr/White Impact:** **Straw Man.** Neither Carr nor White argues that historians should invent facts. If the professor uses this claim to refute them, he is attacking a position they do not hold. They argue about what you *do* with the facts, not whether you should keep them.

  **2. The Effacement Claim (Methodological)**
  *   **The Claim:** The historian can and should remove their own subjectivity, voice, and theoretical framework from the text to let the past "speak for itself."
  *   **Verdict:** **Contentious.** Most working historians agree this is an impossible ideal. The mere act of writing involves syntax, tone, and emphasis, all of which are subjective.
  *   **Carr/White Impact:** **Direct Hit.** Carr's "selection" argument destroys this. By choosing which facts are "significant," the historian is already present in the text before they write a sentence. White adds that the choice of literary mode (tragedy vs. satire) is also a subjective imposition. The professor's demand for effacement is methodologically incoherent.

  **3. The Access Claim (Epistemic)**
  *   **The Claim:** It is possible to know the past *as it was experienced*, unmediated by present-day concepts, categories, or language. We can access the "reality" of 1848 without using 2024 concepts.
  *   **Verdict:** **False.** Language and concepts are the tools of access; you cannot step outside them. We always view the past from the present (Carr's point exactly).
  *   **Carr/White Impact:** **Direct Hit.** Carr's argument that the historian is part of the history they write specifically targets this. White argues that the "reality" of the past is not a story until a historian makes it one. The professor's claim assumes a God's-eye view that epistemology generally denies.

  **4. The Uniqueness Claim (Ontological)**
  *   **The Claim:** For any set of events, there is *one* true narrative structure inherent in the events themselves. Any other narrative structure is a distortion (fiction).
  *   **Verdict:** **False.** Events do not come pre-packaged with plot structures. The "fall of Rome" can be told as a tragedy (loss of order), a moralizing tale (decay of virtue), or a socioeconomic shift (transition to feudalism). All can be factually accurate.
  *   **Carr/White Impact:** **Direct Hit.** This is White's specific target (emplotment). White argues the *same* facts can support multiple, mutually exclusive narrative forms. If the professor claims White denies facts, he is wrong; if he claims White denies *one true story*, White agrees, but the professor thinks that denial makes it fiction. This is the crux of the disagreement.

  ---

  ### The *Eigentlich* Translation Dispute

  The person at the pub was right to flag this. It is not a fringe theory; it is standard Ranke scholarship (most notably associated with Georg Iggers).

  *   **Standard Translation:** "How it **actually** was." (Implies positivist fact-collection).
  *   **Nuanced Translation:** "How it **essentially** was" or "in its **proper** nature." (Implies Romantic hermeneutics).

  **Does this change the verdicts?**
  Yes, significantly. It undermines the Professor's weaponization of the phrase.

  1.  **If "Actually":** Supports Claims 1, 2, and 3. Suggests Ranke wanted a dry chronicle of objective facts. This aligns with the Professor's positivist shield.
  2.  **If "Essentially/Properly":** Ranke was a Romantic historicist. He believed every epoch had an inner "idea" or "tendency" connecting it to God/History. To show how it *essentially* was, you have to interpret the *meaning* of the epoch, not just list battles.

  **Impact on the Claims:**
  *   **Claim 2 (Effacement):** Weakens. If you are looking for the "essence," you are interpreting, not just mirroring.
  *   **Claim 4 (Uniqueness):** Weakens. If you are looking for the "inner tendency," you are engaging in a hermeneutic act closer to White's "meaning-making" than to "fact-collecting."
  *   **The Professor's Argument:** If *eigentlich* means "essentially," Ranke is actually closer to Hegel (and arguably White) than to the logical positivists. The Professor is using a 19th-century Romantic phrase to fight a 20th-century linguistic turn battle, but he is relying on a mistranslation that turns Ranke into a naive empiricist.

  ---

  ### Summary: Where the Professor's Argument Survives

  The Professor's "slam dunk" only works if he can successfully conflate **Claim 1** (Don't lie) with **Claim 4** (There is only one true story).

  *   **He wins on Claim 1:** If you deny Claim 1, you are indeed writing fiction. But White/Carr do not deny Claim 1.
  *   **He loses on Claim 4:** Claim 1 does not entail Claim 4. You can tell the truth (Claim 1) in multiple narrative forms (denying Claim 4).
  *   **The Translation Trap:** If you bring up the *eigentlich* dispute, you show that even Ranke didn't believe in the sterile "fact-collection" version of history the professor is defending. Ranke wanted to understand the *spirit* of the age, which requires interpretation, selection, and narrative construction.

  **Thursday Strategy:**
  Don't argue that facts don't matter. Argue that the Professor is using a translation of Ranke that Ranke scholars reject to defend an epistemic claim (Access/Uniqueness) that Carr and White have already dismantled. The slogan *wie es eigentlich gewesen* protects you from lying; it does not protect you from having to choose a plot.
