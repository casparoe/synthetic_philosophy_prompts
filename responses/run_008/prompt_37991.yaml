  *(Self-Correction during final review)*: Wait, I need to make sure I address the "constructivist position about experience more generally" part. If the user is a constructivist about *all* experience (Dennettian), then the dreaming case is just a specific instance. I should note that if they are constructivist about waking life too, the pressure lessens, but the *timing* issue remains (during sleep vs. at waking). I will focus on the timing aspect as that is the core of the dreaming debate.

