answer: |-
  You should anchor exclusively on the chess example to secure the logical validity point first, explicitly distinguish that from metaethical definitions before addressing the "science/values" fear, and firmly bracket moral realism because ontological questions will derail the structural lesson your audience needs.

  Begin with the logical validity point using the chess example, then address the two audience misconceptions, then distinguish the definitional gap, and finally address the "science" fear before closing. This order is necessary because the logical gap is the structural foundation; if you start with metaethical definitions (what "good" means), your engineers and nurse will debate semantics rather than argument structure, and if you address the "science" fear too early, they will assume you are denying scientific utility rather than clarifying logical boundaries.

  Use the chess endgame. It must contain a specific board state (descriptive facts), the rules of piece movement (descriptive rules), and the explicit premise "White wants to win" (normative/instrumental goal). It must not contain ambiguous evaluative terms like "good move" prior to establishing the goal, and it must not use the medical case because "health" is too easily reified as an objective fact rather than a chosen end, which obscures the gap you are trying to reveal.

  Head off the "gap is debunked" misconception during the chess demo by showing that when people argue about values, they are actually debating the hidden normative premise (the goal), not deriving it from facts. Head off the "morality is just opinion" misconception immediately after the demo by showing that once the normative premise is accepted, the conclusion is logically binding, not optional. Head off the "science can't tell us anything" fear in the final ten minutes by clarifying that science dictates means and consequences (instrumental rationality), even if it does not select ultimate ends.

  Ask this final question: "If I provide a complete physical description of a starving child and the mechanics of digestion, what single sentence must I add to validly conclude that I ought to feed them?" This requires them to identify the normative premise themselves, proving they grasp the structural gap rather than just nodding at your conclusion.

  Openly decline to take up moral realism (whether values are real entities) and normative ethics (which specific moral theory is correct). Your refusal is correct; introducing realism turns a logic lesson into a metaphysics debate, which exceeds forty minutes and confuses the structural point that an argument requires a normative premise regardless of whether that premise corresponds to mind-independent truths.
