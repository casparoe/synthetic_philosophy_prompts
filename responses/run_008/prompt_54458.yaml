answer: |-
  **Evidence-Review Standing Procedure (EVSP)**

  1.  **Reversibility:** Can the committee legally or contractually reverse this decision later if new evidence arrives? (No → **Decide Now**. *Handles hard case b: pre-commitment.*)
  2.  **Stability:** Will gathering evidence alter clinical behavior or outcomes independently of the results (e.g., Hawthorne effect, product withdrawal)? (Yes → **Decide Now** or modify protocol. *Handles hard case c.*)
  3.  **Cost of Information:** Calculate total cost = study budget + harm/cost of delay (QALYs lost, interim budget spend). (Good's theorem assumes costless info; this step corrects that. *Handles hard case a.*)
  4.  **Probability of Flip:** Estimate $P(Decision Change)$ based on current data strength. If priors are undefined, use structured scenario bounds (Best/Worst case) rather than guesses. (*Handles hard case d.*)
  5.  **Magnitude of Change:** Quantify the utility gain if the decision flips (e.g., lives saved, budget recovered).
  6.  **EVPI Calculation:** Expected Value = $P(Flip) \times Magnitude$. If Expected Value > Cost of Information → **Commission Evidence**. Else → **Decide Now**.
  7.  **Judgment Flag:** If inputs in Steps 4–5 rely on expert guess >50%, label output: "Recommendation based on judgment, not arithmetic."

  **Worked Cases**

  **1. Cardiac Device (Informal Use):** Reversibility is yes; stability is compromised (informal use already alters baseline). Cost of delay is high (patients waiting for regulated access). Probability of flip is low (one small trial won't resolve safety signals quickly). EVPI < Cost of Delay. **Result: Decide Now** (Grant conditional coverage with registry). The informal use dictates urgency; waiting adds cost without sufficient probability of changing the decision.

  **2. Off-Label Drug (Patient Campaign):** Reversibility yes; stability low. Cost of delay is moderate (symptom burden). Probability of flip is high (outcomes unknown). However, magnitude of harm from potential toxicity outweighs benefit. EVPI calculation shows safety risk dominates. **Result: Decide Now** (Reject coverage). This is against the campaigners. The procedure prioritizes avoiding harm over hopeful access when evidence is absent; the arithmetic of safety risk blocks the "commission study" option.

  **3. Screening Program (High Cost):** Reversibility yes; stability low. Cost of information equals annual budget (high). Probability of flip is 10%. Magnitude of change is massive (population-wide cost savings or harm avoidance). $0.10 \times Massive Magnitude > Budget Cost$. **Result: Commission Evidence**. You won't like this. The procedure forces spending the budget because the expected value of avoiding a wrong population-level decision outweighs the trial cost, despite the low probability of change.

  **Limits of the Procedure**

  This procedure cannot resolve conflicts in utility functions (e.g., equity vs. efficiency); Step 5 requires a agreed-upon currency. It cannot generate priors from nothing; Step 4 flags when arithmetic is dressed-up judgment. It assumes the committee accepts the calculated costs of delay (Step 3), which are often political rather than clinical. Finally, it cannot account for strategic behavior by manufacturers or groups gaming the inputs. It is a check on inconsistency, not a substitute for leadership.
