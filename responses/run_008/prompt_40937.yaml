prompt: |-
  PhD student in distributed systems here (consensus protocols, mostly CRDTs and gossip these days) with a philosophers-of-probability shaped hole in my education. Everyone keeps referencing Aumann's agreement theorem like it's obvious, and the pop summary I get is "rational agents can't agree to disagree," which as stated is obviously false in my world — nodes disagree constantly, that's the whole reason consensus protocols exist. So do the translation for me: restate the theorem and the debate around it (common priors, the back-and-forth where agents keep announcing their posteriors until their estimates merge, the question of why disagreement is so persistent among people who seem rational) in my vocabulary — messages, gossip rounds, monotonic update rules, crash vs byzantine faults, eventual consistency, maybe FLP if it fits. Be honest about where I should map what: is a common prior literally just two replicas starting from the same state, is the iterated posterior announcement just a gossip protocol converging to a fixed point, and does "common knowledge" in the epistemic logic sense mean anything more than what I'd call a synchrony assumption? Then the part I actually care about, the residue report: what parts of the philosophical discussion don't survive the translation (I suspect the interesting stuff is all in the fine print about what counts as common knowledge of each other's rationality), whether my vocabulary can't express something they're arguing about or whether it's just less substantive than it looks, and whether the standard move of blameing false common priors is anything more than what we'd call divergent initial state plus no convergence guarantee. Don't soften the math to make the analogy pretty — if the theorem's assumptions are doing work that has no counterpart in an actual protocol, I want to see exactly where.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

