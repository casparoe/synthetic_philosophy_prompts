answer: |-
  # Teaching Notes: A Clockwork Orange and Moral Responsibility

  ## I. Introduction: Framing the Debate
  Begin by recalling the core tension from the unit. The Principle of Alternative Possibilities (PAP) states that an agent is morally responsible only if they could have done otherwise. Harry Frankfurt challenges this, arguing that alternative possibilities are irrelevant; what matters is whether the action issues from the agent's own will (the hierarchical view). If you act on desires you identify with, you are responsible, even if you couldn't have acted differently.

  *A Clockwork Orange* serves as a stress test for these positions. The film presents a protagonist, Alex, who transitions through three states: uncoerced evil, coerced goodness, and restored capacity for evil. Use these transitions to ask students whether responsibility tracks the *ability to choose* (PAP) or the *source of the will* (Frankfurt).

  ## II. The Ludovico Technique as Inverted Frankfurt
  Ask students to consider the mechanics of the Ludovico treatment. In a standard Frankfurt case, a controller stands by to force an agent to do X if they show signs of choosing not-X. The agent chooses X on their own, so Frankfurt argues they are responsible despite lacking the ability to do otherwise.

  The Ludovico treatment operates in reverse. The state does not wait to see what Alex chooses; it physically alters his constitution so that choosing violence results in incapacitating sickness. It removes the alternative possibility wholesale.
  *   **Discussion Point:** In a Frankfurt case, the agent's will remains intact; the controller is merely a backup. In the film, the state invades the will itself, pairing violent imagery with nausea.
  *   **Question for Students:** If Frankfurt argues that responsibility survives the removal of alternatives (provided the will is your own), does responsibility survive the Ludovico treatment? Alex behaves "goodly" afterward, but is he responsible for that goodness?
  *   **Key Distinction:** Frankfurt cares about the *actual sequence* of the will. The film suggests that when the alternatives are removed by physiological coercion, the actual sequence is corrupted. This challenges Frankfurt's claim that alternatives are irrelevant.

  ## III. The Chaplain's Objection: PAP or Hierarchical?
  Focus on the prison chaplain's reaction to the demonstration of Alex's conditioning. He argues that goodness chosen is meaningful, while goodness compelled is meaningless.
  *   **Analyzing the Objection:** Does this vindicate PAP? The chaplain emphasizes that choice must be available. If Alex cannot choose evil, his choice of good is not a moral act. This aligns with PAP: no alternatives, no responsibility.
  *   **The Hierarchical Counter:** Alternatively, does this support the hierarchical view? Pre-treatment Alex acts on violent impulses. Did he endorse them? He seems to delight in them, suggesting a alignment between his first-order desires (to hurt) and second-order volitions (to want to hurt). If so, he was responsible before. Post-treatment, his first-order desires are forcibly misaligned with his survival instinct. He cannot form a will of his own.
  *   **Class Exercise:** Ask students to determine if the chaplain is objecting because Alex lacks *options* (PAP) or because the actions no longer flow from *Alex's character* (Hierarchical). The film blurs these: by removing the option, the state also rewires the character.

  ## IV. Pre-Treatment Alex: Authenticity and Compulsion
  Return to the early scenes of ultraviolence. Alex is hedonistic and cruel.
  *   **Hierarchical Analysis:** Does pre-treatment Alex satisfy Frankfurt's conditions? He seems to wholeheartedly endorse his violence. He sings while fighting; he enjoys the artistry of it. On a hierarchical view, he is fully responsible because his will is integrated.
  *   **PAP Analysis:** He clearly could have done otherwise (he plans crimes, he evades police). He satisfies PAP.
  *   **Complication:** Is Alex addicted to violence? If his impulses are compulsive in a psychological sense, even pre-treatment Alex might fail the hierarchical test (he cannot want otherwise). If he is merely evil but free, he passes both. The film treats him as legally responsible (he is imprisoned), suggesting society views him as having alternatives.

  ## V. The Problem of Pity and Constitution
  Consider the sequence after Alex's release. He is rejected by his parents, beaten by former victims, and manipulated by political actors. In one key scene, he is battered by a group of men he once victimized and is physically unable to fight back due to his conditioning.
  *   **The Emotional Response:** The film invites the audience to pity Alex here. Why? If he was monstrous before, why do we care when he is helpless?
  *   **Constitutive Capacity:** This pity suggests that the capacity for violence is partly constitutive of personhood. To be human is to have the agency to harm. Stripping that capacity strips dignity.
  *   **Implication for Responsibility:** If we pity him because he lacks agency, we are acknowledging that moral status requires the power to act. This cuts against the hierarchical view if that view allows for responsibility without the power to do otherwise. It suggests that the *capacity* (PAP) is essential for status as a moral agent, not just the structure of the will.

  ## VI. The Endings: Film vs. Novel
  Compare the two conclusions to see which philosophical view they prioritize.
  *   **The Film Ending:** The state reverses the conditioning. Alex returns to his violent appetites and is shown delighting in a fantasy of violence while surrounded by adoring crowds. The restoration is not of morality, but of *capacity*. He can choose evil again. This suggests that the ability to choose (PAP) is more valuable than the outcome of being good.
  *   **The Novel Ending (Chapter 21):** Alex matures naturally. He grows bored with violence and begins to imagine a settled life with a family. His will changes from within.
  *   **Discussion:** Which ending serves the Frankfurt debate better?
      *   The novel supports the **Hierarchical View**. Alex becomes responsible for goodness because his second-order volitions change; he comes to *want* to be peaceful. It shows moral growth without necessarily emphasizing the metaphysical freedom to choose evil, but rather the evolution of the will.
      *   The film supports **PAP**. Kubrick cuts the maturation chapter. Alex does not get better; he gets *free*. The horror of the film is not that Alex is evil, but that he is a clockwork mechanism. The resolution is the restoration of his ability to be otherwise.

  ## VII. Synthesis for Students
  Conclude by asking students to weigh the evidence. Frankfurt argues that we are responsible when our actions stem from our own will, regardless of alternatives. The film argues that without alternatives, the will itself is meaningless. The chaplain's plea, the pity we feel for the helpless Alex, and the restored capacity in the finale all point to the necessity of open possibilities. While Frankfurt suggests we can be prisoners of our own will and still be responsible, the film suggests that being a prisoner of any kind—whether by physics or psychology—negates moral worth.

  Verdict: The film, as a whole, vindicates the principle of alternative possibilities by depicting the removal of choice as the destruction of moral agency itself.
