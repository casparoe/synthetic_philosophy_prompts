answer: |-
  Two senior editors, Mara and Jon, are deciding whether to retract a published paper for data fabrication. They sit together and review every raw dataset, email chain, and lab log available (all specific evidence is shared). Mara states she is 95% certain fraud occurred; Jon states he is only 30% certain. Both know the other is honest, competent, and has heard the exact same numbers and documents. They discuss the evidence for an hour, clarifying every ambiguity, yet neither changes their credence. They leave the room still disagreeing, not because of stubbornness, but because each treats their own estimate of the field's baseline error rate as an objective fact rather than a probabilistic assumption: Mara implicitly weights the evidence against a prior shaped by a recent, unpublished cluster of scandals she considers "background context," while Jon weights the same evidence against the historical decade-average, and neither recognizes these baseline rates as subjective priors needing alignment rather than fixed background knowledge.

  **Diagnostic Work**

  Aumann's Agreement Theorem (AAT) states that two Bayesian agents cannot agree to disagree if three conditions are met: (1) **Common Priors** (they start with the same probability assignments before receiving private information), (2) **Common Knowledge of Posteriors** (they know each other's final beliefs, know that the other knows, and so on), and (3) **Bayesian Rationality** (they update their beliefs correctly according to probability rules). In this scenario, Mara and Jon satisfy rationality and common knowledge of posteriors (they literally told each other their numbers). The secret violation is **Common Priors**.

  Though they speak the same language and trust the same institutions, they do not actually share a prior probability distribution. They *think* they do because they treat their background assumptions (the base rate of fraud) as objective facts about the world rather than subjective starting points. Mara's "fact" includes the recent scandal cluster; Jon's "fact" excludes it. Because they treat these divergent base rates as fixed constraints rather than updateable beliefs, they effectively begin the calculation from different starting lines. A strict Bayesian would say that once this flaw is pointed out, the agents must pause the evidence evaluation and negotiate a single, explicit prior probability for the base rate of fraud before re-assessing the specific evidence. However, this is psychologically unrealistic for humans; we naturally conflate "what I know about the world" (prior) with "what is true about the world" (fact), making it incredibly difficult to treat deep background knowledge as a negotiable probability.

  The single detail doing all the work is the **treatment of the base rate as fixed background knowledge**. If you remove this detail—forcing them to explicitly agree on a single base rate number before looking at the data—their posteriors must converge, and the disagreement vanishes.
