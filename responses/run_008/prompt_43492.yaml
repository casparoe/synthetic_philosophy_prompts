answer: |-
  Hello there. This is a fantastic angle for a piece. You've hit on one of the most deliciously unsettling bugs in the machinery of rational choice.

  You are quite right to feel that the Pasadena Game is a different beast entirely from St. Petersburg. To use a metaphor: St. Petersburg is a car that accelerates forever; Pasadena is a car that drives off the map because the compass needle is spinning.

  Here is the gut-level intuition you're looking for, stripped of the sigma notation, followed by why this should keep a non-mathematician awake at night.

  ### Part 1: Why "Undefined" is Worse Than "Infinite"

  To understand why Pasadena is pathological, we have to look at what we mean by "Expected Value." In decision theory, the value of a gamble is the weighted average of its outcomes. You multiply what you win by the chance of winning it, and add them all up.

  **The St. Petersburg Situation (The Infinite Ladder)**
  In St. Petersburg, every term you add to the sum is positive. You might win £2, or £4, or £1,000,000. You never lose. When you add them up ($1 + 1 + 1...$), the pile gets bigger and bigger. It goes to infinity.
  *   **The Intuition:** It's like stacking bricks. No matter how you stack them, the tower gets infinitely high. It's absurdly high, yes, but it's *consistently* high. We know the direction.

  **The Pasadena Situation (The Tug-of-War)**
  The Pasadena Game (proposed by Nover and Hájek in 2004) introduces a twist: the payoffs alternate between winning and losing.
  *   Toss 1: Win £2 (Probability 1/2) $\rightarrow$ Contribution: +£1
  *   Toss 2: Lose £4 (Probability 1/4) $\rightarrow$ Contribution: -£1
  *   Toss 3: Win £8 (Probability 1/8) $\rightarrow$ Contribution: +£1
  *   ...and so on.

  *(Note: The precise maths usually involves terms that shrink slightly, like $1, -1/2, +1/3$, to make the series "conditionally convergent," but your intuition about alternating signs is the crucial bit.)*

  When you sum this up, you have an infinite number of positive £1s and an infinite number of negative £1s.
  *   **The Intuition:** Imagine a tug-of-war between two infinite teams. The "Win" team pulls to the right; the "Lose" team pulls to the left. Both teams are infinitely strong.

  **Why Ordering Matters (The Queue at the Till)**
  In normal arithmetic, $2 + 3$ is the same as $3 + 2$. But when you are adding up infinitely many numbers, the order in which you add them can change the result. This is a quirk of infinity known as the *Riemann Rearrangement Theorem*.

  Imagine you are tallying the score of that tug-of-war.
  1.  **Scenario A:** You let one "Win" player step forward, then one "Lose" player. The score hovers around zero.
  2.  **Scenario B:** You let *two* "Win" players step forward, then one "Lose" player. The "Win" team gains a temporary advantage before the "Lose" team catches up. If you keep biasing the queue slightly in favour of the winners, the total score drifts towards positive infinity.
  3.  **Scenario C:** You bias the queue towards the losers. The score drifts to negative infinity.

  Because both the positive pot and the negative pot are infinite, there is no "natural" balance point. The value of the game depends entirely on the order in which you count the possibilities.

  **Why is this "Undefined"?**
  In St. Petersburg, the value is $\infty$. It's a specific kind of nonsense.
  In Pasadena, the value could be £10, or -£500, or $\pi$, depending on how you group the terms.
  If a physical object had a weight that changed depending on which side of the scale you put the weights on, we wouldn't say it weighs "a lot." We would say the concept of "weight" has broken down. That is the Pasadena Game. It doesn't just break the bank; it breaks the calculator.

  **Why the Standard Tricks Don't Help**
  You mentioned risk aversion or capping utilities.
  *   **Risk Aversion:** Usually, we say people value money logarithmically (winning your first million matters more than your billionth). This tames St. Petersburg because it squashes the infinite payoffs down to a finite number.
  *   **The Pasadena Stickiness:** If the payoffs alternate signs *and* grow fast enough, simply squashing them might not restore a stable order. More importantly, Pasadena forces us to ask: *Why* are we summing them in the order of the coin tosses (1st toss, 2nd toss...)? Is nature obligated to present outcomes in chronological order? If the "value" of a gamble depends on the narrative order in which we describe the outcomes, then value isn't a property of the gamble—it's a property of the description.

  ### Part 2: Why Should a Normal Person Care?

  This is the money shot for your article. It is easy to dismiss this as casino metaphysics. Nobody is offering Pasadena gambles at the bookies. But the structure of the Pasadena Game lurks in the most serious decisions we face.

  **1. The End of "Rational" Cost-Benefit Analysis**
  Expected Utility Theory is the engine room of modern economics, public policy, and AI safety. It tells us to "maximise the expected good."
  Pasadena shows that for certain classes of problems, **there is no expected good to maximise.**
  If you are a policymaker evaluating a geoengineering project, you might have:
  *   A sequence of small, certain costs (carbon taxes).
  *   A sequence of low-probability, high-magnitude benefits (saving the planet) and harms (accidental freezing of the north stream).
  If the probabilities and magnitudes align in a "Pasadena-like" way (heavy tails, mixed signs), the math says there is *no fact of the matter* on whether the project is good or bad. It's not that we lack data; it's that the framework for processing the data yields nonsense.

  **2. The Fragility of Long-Termism**
  There is a growing movement in philosophy and effective altruism called "Long-Termism," which argues we should prioritise the far future because there are so many potential future people.
  Pasadena is a nightmare for Long-Termism. When you stretch decisions over centuries or millennia, you are dealing with infinite or near-infinite horizons. If the "good" and "bad" outcomes in the deep future alternate or are uncertain in a heavy-tailed way, the expected value of *any* action today could become undefined.
  It suggests that trying to calculate the "optimal" path for humanity over deep time might be mathematically incoherent. We might be trying to divide by zero.

  **3. Value is Not Intrinsic**
  The deepest philosophical punch is this: We like to think value is real. A cup of tea is good; a punch in the face is bad.
  Pasadena suggests that when things get complex enough, **value is contextual.** It depends on how you frame the problem.
  If I describe a gamble as "A series of coin tosses," it has one value. If I describe it as "A series of pairs of coin tosses," it has another.
  For a journalist, this is a profound hook: *Rationality relies on the assumption that the world can be carved up into discrete facts. Pasadena suggests the carving knife matters more than the meat.*

  ### The Takeaway for Your Readers

  You can summarise it like this:

  > "For three hundred years, economists have treated 'Expected Value' like gravity—a force that pulls decisions in a predictable direction. The St. Petersburg Paradox showed us that sometimes gravity seems to pull infinitely hard. But the Pasadena Game shows us something scarier: that sometimes, the floor drops out entirely. It reveals that our best mathematical tools for defining 'the right choice' rely on a hidden assumption: that the universe plays fair with addition. When it doesn't, 'rationality' doesn't just give the wrong answer; it falls silent."

  It's not about gambling. It's about the limits of human reasoning when faced with the infinite. And in an age of climate change, nuclear risk, and super-intelligent AI, we are finally making decisions that *feel* infinite.

  Hope that helps you get the piece down. It's a brilliant subject. Do let me know how it turns out.
