answer: |-
  # Thesis

  Tranquilism asserts that the absence of craving and suffering is the sole intrinsic good. Consequently, any state of affairs eliminating these negatives is morally obligatory. The contentment implant achieves this elimination perfectly while preserving rational agency. Therefore, consistent tranquilists must endorse its universal deployment. This conclusion is not a reductio ad absurdum but a demonstration of moral clarity. It reveals that common objections stem from mistakenly valuing striving itself. By embracing the implant, tranquilism fulfills its promise to prioritize well-being over biological imperatives, showing that a world without want is the ultimate ethical destination.

  # The main argument

  The core axiom of tranquilism is that craving is the root of suffering, and suffering is the only intrinsic disvalue. All other goods—friendship, achievement, knowledge—are merely instrumental. They are valuable only if they soothe agitation or prevent pain. Once craving is extinguished, these instruments lose their purpose. The contentment implant is the perfect tool for this end. It surgically removes the capacity for craving while leaving memory, reasoning, and social recognition intact. A person with the implant recognizes their spouse but feels no anxious attachment; they plan for the future but feel no urgency.

  Because the implant permanently secures the only intrinsic good, deploying it universally maximizes value. To argue against deployment is to argue for the preservation of craving. Since tranquilism defines craving as the source of all disvalue, preserving it is inherently harmful. There is no higher purpose to suffering or wanting within this framework. The transition to a tranquil state is not a loss of humanity, but a liberation from the mechanism that makes humanity suffer. The implant does not destroy the person; it destroys the dissatisfaction within the person. If the goal is the cessation of dissatisfaction, the implant is the most efficient means. Any alternative that allows craving to persist accepts unnecessary suffering. Thus, the moral imperative is clear: eliminate the source of dissatisfaction wherever possible. The tranquilist argues that a world where no one wants anything to be different is a world where moral work is complete. To resist this is to cling to the very fire that burns us.

  # The three complications

  First, regarding grief: Critics argue non-implanted people will mourn a world that stopped striving. The tranquilist replies that this grief is itself a form of suffering born of craving for a specific kind of world. Mourning the end of suffering is paradoxical; the solution is to offer the mourners the implant, extinguishing their grief along with its cause. Their sadness validates the need for relief, not the value of striving.

  Second, concerning second-order cravings: Some crave not to be tranquilized. Tranquilism makes no intrinsic distinction between cravings. A craving for autonomy is just as much a craving as a craving for food. Respecting it perpetuates disvalue. Paternalism is justified because satisfying this craving maintains suffering.

  Third, on incuriosity: A tranquil civilization halts scientific and artistic progress once suffering is managed. The tranquilist insists nothing of intrinsic value is lost. Art and science driven by restless wanting have no worth beyond suffering reduction. A silent, stable civilization is superior to a striving, suffering one.

  # Why this is a strength, not a reductio

  Embracing this conclusion is a strength because it demonstrates theoretical integrity. Many ethical systems falter when their logic leads to counterintuitive results, resorting to ad hoc exceptions to preserve human nature. Tranquilism remains steadfast. The visceral horror people feel at the implant is not evidence of its wrongness, but evidence of their own addiction to craving. We are biologically wired to want, mistaking the itch for a virtue. By accepting the implant, tranquilism exposes this bias. It offers a clean break from evolutionary imperatives that prioritize survival over well-being. A theory that clearly identifies the enemy and proposes a definitive solution is more useful than one that hedges. This courage distinguishes it from vague humanistic theories. It prioritizes actual peace over imagined purpose.
