answer: |-
  You are right to be suspicious of the stalemate. After twelve years of this cycle, the persistence of the debate suggests it isn't a puzzle waiting for a missing empirical key. It is a collision of two different normative frameworks that are using the same vocabulary to talk past each other.

  Here is the diagnosis: This is a **Competing Standards** disagreement regarding the **Locus of Moral Evaluation**, disguised as an empirical dispute about causation.

  Your hypothesis—that this is about whether decision theory belongs in ethics—is close, but it needs sharpening. It is not about whether decision theory is *allowed* in ethics. Both sides use reasoning. The disagreement is about whether moral evaluation tracks **Ex-Ante Rationality** (the quality of the gamble you took) or **Ex-Post Causation** (the actual footprint you left on the world).

  ### The Diagnosis: Guidance vs. Attribution

  The reason the debate stalls is that the two sides are answering different questions while pretending to answer the same one.

  **Side A (The EV / LessWrong / EA Camp)** is asking: *"What is the correct decision procedure for an agent trying to minimize suffering?"*
  For this side, morality is a **guide to action**. If the expected value of eating the burger is negative (due to a tiny probability of triggering a threshold order), then eating the burger is the wrong move. They treat moral acts like investments. You are judged on the quality of your calculation, not the realization of the random variable. When they say "it matters," they mean "it is rational to treat it as if it matters."

  **Side B (The Skeptic / Causal Camp)** is asking: *"Did this specific agent actually make the world worse?"*
  For this side, morality is a **system of attribution**. They want to know if there is a causal chain linking their hand to a specific unit of suffering. If the supply chain is buffered (e.g., orders are placed in batches of 1,000, and you bought unit #501), then physically, no extra animal died. When they say "it doesn't matter," they mean "you are not causally responsible for the aggregate."

  ### Evidence from the Discourse

  You asked to use what the sides actually say to back this up. The linguistic tells are distinct.

  **1. The "Pivotality" vs. "Difference" Tell**
  *   **Side A** constantly uses the language of **probability and thresholds**. You see phrases like "marginal impact," "expected disutility," and "pivotal probability." They cite Shelly Kagan's *How to Count Animals* or William MacAskill's work on expected value. Their argument hinges on the idea that *ignoring* small probabilities is a cognitive bias (scope insensitivity).
  *   **Side B** uses the language of **mechanics and buffers**. They talk about "inventory thresholds," "wholesale orders," and "slack in the system." They cite the fact that supermarkets don't order one chicken at a time. Their argument hinges on the idea that *claiming* responsibility for diffuse effects is a category error.

  **2. The Norcross Puppy Intuition Pump**
  *   When Side A deploys the Norcross argument (if you wouldn't torture a puppy, why be a 1-in-a-million co-cause?), they are testing **consistency of principle**. They are saying: "Your intuition says torture is wrong. Decision theory says this act is structurally identical to torture. Therefore, your intuition is buggy."
  *   When Side B rejects this, they aren't doing math. They are appealing to **agency**. They are saying: "I didn't torture the puppy. The torturer did. I just bought meat." They are defending a boundary around the self.

  **3. The "Complicity" Escape Hatch**
  *   Notice what happens when Side B is cornered. Often, they concede: "Okay, maybe I shouldn't do it, but not because I *caused* harm." They shift to **complicity** or **virtue ethics**. They say, "I don't want to be the *kind of person* who supports this industry."
  *   This proves the diagnosis. If the debate were truly about causal physics, this concession wouldn't happen. The fact that they shift to *character* proves their original objection was about *causal attribution*, not about the wrongness of the act itself. They want to keep their hands clean (attribution) even if they agree to abstain (guidance).

  ### Critique of Your Hypothesis

  You hypothesized that this is about "whether ethics should use decision theory at all."

  **You are mostly right, but you are giving Side B too much credit.** Side B isn't necessarily anti-decision-theory in general. They use decision theory for voting (sometimes) or career choice. The friction point is specific: **Moral Luck.**

  Side A is essentially arguing that **moral luck should not exist**. If you take a risky action that *could* cause harm, you are blameworthy even if you get lucky and the threshold isn't tripped.
  Side B is arguing that **moral luck is real and unavoidable**. You are only blameworthy for what you actually break.

  So the disagreement isn't "Decision Theory vs. No Decision Theory." It is **"Decision Theory as Moral Truth" vs. "Decision Theory as Heuristic."** Side A thinks the EV calculation *is* the moral truth. Side B thinks the EV calculation is a useful rule of thumb, but the *actual moral truth* is found in the physical causal graph.

  ### Is Progress Possible?

  Is there a distinction that should end this? **No.** This is not a problem waiting for a solution; it is a tension waiting for management.

  The "rationalist-adjacent instinct to shut up and multiply" and the "philosopher's instinct to look at actual causal structure" are **genuinely incommensurable** at the bedrock level because they serve different social functions.

  *   **EV Ethics** is designed for **coordination and optimization**. It tells a movement how to allocate resources to get the biggest bang for the buck. It requires agents to act *as if* they are pivotal to ensure the collective outcome is good.
  *   **Causal Ethics** is designed for **blame and praise**. It is how we adjudicate guilt in court or social standing in a community. We generally do not punish people for bad luck (driving safely but hitting a pedestrian who jumped out) nor exonerate them for good luck (driving drunk and getting home safe).

  **The Path Forward (The "Dissolution"):**
  Progress only happens if we stop asking "Does it matter?" and start asking "For what purpose are we asking?"

  1.  **For Deliberation (What should I do?):** Side A wins. You cannot deliberate using causal certainty because you don't have it. You must use EV. If you wait for causal certainty, you paralysis.
  2.  **For Retrospection (Did I hurt someone?):** Side B wins. If you are assessing guilt or trauma, actual difference-making matters. Telling a victim "I expected to hurt you" is less relevant than "I actually hurt you."

  The debate stalls because Side A tries to use Deliberation standards to assign Retrospective Guilt ("You are bad because your EV was bad"), and Side B tries to use Retrospective standards to guide Deliberation ("I can do this because my causal impact is zero").

  ### Conclusion

  Your suspicion is correct: the physics and economics are not the bottleneck. The bottleneck is that **we want one word ("Wrong") to do two jobs.**

  We want "Wrong" to mean "Do not do this" (Guidance/EV) and we want "Wrong" to mean "You broke the world" (Attribution/Causation). In high-threshold, low-probability cases, these two definitions come apart.

  The debate will never end because neither side is willing to surrender their definition. The EA side won't give up EV because it destroys the leverage of effective altruism (if individual acts don't count, why donate?). The Skeptic side won't give up Causation because it violates deep-seated intuitions about fairness and individual agency.

  The only rational move is to acknowledge the incommensurability. Stop asking if the burger "matters." Ask: "Am I trying to optimize my life, or am I trying to assess my guilt?" If the former, multiply. If the latter, look at the causal chain. But do not pretend they are the same question.
