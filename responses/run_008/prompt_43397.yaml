prompt: |-
  So I've been going to our local rationalist meetup for like 12 years and somehow nobody has ever done a proper session on David Lewis's modal realism, which is wild given how much energy that crowd has spent on possible worlds as made-up bookkeeping devices. I voluntered to do it next month. Audience: ~15 people, programmers plus a couple philosophy grad students, all comfortable with basic logic and decision theory, several have seen Kripke-style semantics used in logic/CS contexts, but basically nobody has read Lewis beyond maybe skimming On the Plurality of Worlds.

  I don't want you to explain modal realism to me — I know the view: the worlds are concrete, spatiotemporally isolated from each other, all equally real, and "actual" works like "here", an indexical that picks out whichever world you happen to be in. What I want is a teaching plan.

  Specifically:

  1. Ordering: I'm torn between (a) starting with possible worlds as a semantic bookkeeping device — how logicians use them for counterfactuals and modal claims — and only then escalating to Lewis's ontological claim that the worlds really exist, vs. (b) starting straight from a concrete counterfactual and building up to the ontology. Which dependencies actually matter, and how do I sequence it so the ontological move doesn't feel like a bait and switch? That's my biggest worry, that people will feel they got sold one thing and delivered another.

  2. Carrying example: what single case should carry the whole session? It has to be concrete enough that people feel the pull of quantifying over ways-things-could-have-been before anyone says the word "ontology". I'm toying with chess move evaluation ("Qf7 loses because in the nearby worlds where you play it, Black has a forced mate in three") — good idea or is there something better? And what should the example deliberately NOT involve, so it doesn't smuggle in confusions later? Half the room is going to arrive primed with Everett many-worlds from physics, I just know it.

  3. Misconceptions: my predictions are (i) "Lewis is just claiming the quantum multiverse is real", (ii) "if all worlds are equally real then nothing I do matters, nihilism", (iii) "if every world exists, nothing is impossible, so modal distinctions collapse". Where in the sequence should each one get headed off? And am I missing any? I have a nagging feeling there's a predictable screwup around counterpart theory vs. transworld identity — like people will think it's a substantive metaphysical claim about persons when it's really a device for making de re modal claims come out right — but I can't articulate the failure mode cleanly, so help me out there.

  4. There's one guy who will 100% bring up parsimony: "Lewis multiplied entities by a factor of infinity and calls it parsimonious, lol". I want to handle the objection head on (qualitative vs. quantitative parsimony, the idea that his ontology is rich in kinds, not in number of kinds) rather than dodge it — but can I do that in a way that doesn't drag the whole session into the ersatz worlds literature? Or should I just name-drop ersatzism as "the competition" and move on?

  5. Check for understanding: what one question at the end would actually test whether they got the indexicality of "actual", as opposed to just nodding along? I want something where the wrong answer reveals the exact residual confusion.

  6. What do I openly refuse to cover in 90 minutes? Presumably the formal machinery of counterpart theory is out, the full Lewis-van Inwagen correspondence stuff probably out — what else, and should I announce the omissions at the start or when they come up?

  Side question: do I even bring up the old Eliezer line that possible worlds are just made-up constructs, as a foil at the end, or does that just muddy things? A chunk of the room treats the Sequences as scripture and I don't want the session to turn into a referendum on that.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Context:**
      *   **User:** Long-time rationalist meetup attendee (12 years), knowledgeable about modal realism (knows the core thesis: concrete, isolated, indexical actuality), volunteering to teach.
      *   **Audience:** ~15 people, mix of programmers and philosophy grad students. Comfortable with logic, decision theory, Kripke semantics. Few have read Lewis deeply.
      *   **Goal:** A 90-minute teaching plan on David Lewis's Modal Realism.
      *   **Constraints:** Don't explain the view itself (user knows it). Focus on sequencing, examples, misconceptions, parsimony objection, check for understanding, and scope management.
      *   **Tone:** Intellectual, precise, pragmatic (rationalist style), aware of local culture (Sequences, Everett, etc.).

  2.  **Deconstruct the Requests:**

      *   **1. Ordering (Semantics vs. Ontology):** The user worries about the "bait and switch."
          *   *Option A (Semantics first):* Standard academic approach. Safe, but might make the ontological leap feel abrupt.
          *   *Option B (Concrete Counterfactual first):* More intuitive, but risks conflating epistemic possibilities with metaphysical ones.
          *   *Decision:* A hybrid is best. Start with the *utility* of possible worlds (which they know from CS/Logic), show the *pressure* to treat them as real to make sense of truth conditions, *then* reveal Lewis's solution. This frames the ontology as a solution to a problem, not a non-sequitur.
      *   **2. Carrying Example:** Chess is good for programmers, but might be too game-theoretic/normative. Needs to be about *truth conditions* of counterfactuals.
          *   *Idea:* A specific counterfactual claim about a historical event or a physical setup. "If I had dropped this glass, it would have shattered."
          *   *Avoid:* Quantum mechanics (Everett confusion), Time Travel (causality confusion), Personal Identity (too messy early on).
          *   *Selection:* The "Nixon Presses the Button" case (classic) or a simpler physical causal chain. Let's go with a modified "Nixon" or a "Traffic Accident" scenario. Actually, for programmers, a "Code Branch" analogy works well for the *structure*, but a physical example works better for the *ontology*. Let's suggest a "Traffic Accident" avoided by seconds. It's relatable and clearly spatiotemporal.
      *   **3. Misconceptions:**
          *   (i) Everett/Quantum: Address early when defining "isolated."
          *   (ii) Nihilism/Decision Theory: Address when discussing "actual" as indexical.
          *   (iii) Collapse of Possibility/Necessity: Address when defining world-mates vs. isolated worlds.
          *   (iv) Counterpart Theory vs. Transworld Identity: This is crucial. Need to explain *why* Lewis rejects transworld identity (problem of accidental intrinsics) before introducing counterparts.
      *   **4. Parsimony Objection:** This is the classic "Qualitative vs. Quantitative" distinction. Needs a dedicated slot. Don't get bogged down in Ersatzism, just define it as "the view that worlds are abstract descriptions" and contrast.
      *   **5. Check for Understanding:** Needs to test indexicality. "Is the actual world special?" isn't enough. Needs a scenario where they have to apply the indexical rule.
      *   **6. Scope/Omissions:** Announce at start. No formal counterpart logic, no detailed argument from ways, no deep dive into Humean Supervenience.
      *   **Side Question (Eliezer/Sequences):** Handle carefully. Acknowledge the instrumentalist view but frame Lewis as the "realist" challenge to it. Don't make it a debate, make it a contrast in philosophical posture.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Intro:* Set the stage. Acknowledge the "bookkeeping" view they know.
      *   *Section 1: The Problem.* Why do we need worlds? Truth conditions for counterfactuals. (Use the Traffic Example).
      *   *Section 2: The Escalation.* If truths depend on worlds, what *are* worlds? Abstract vs. Concrete. Introduce Lewis's thesis.
      *   *Section 3: The Objections (Pre-emptive).* Isolation, Actuality as Indexical. (Hit the Nihilism and Everett misconceptions here).
      *   *Section 4: Counterpart Theory.* Why I am not in other worlds. (Hit the Transworld Identity confusion).
      *   *Section 5: Parsimony.* The Qualitative/Quantitative distinction.
      *   *Conclusion:* Check for understanding + Eliezer note.

      *Refining the Example:* Chess is tricky because "losing" is normative. A better programmer analogy is "Uncaught Exceptions." "If this variable were null, the program would crash." Where does that crash happen? In a run that didn't occur. Lewis says: It *did* occur, just over there.
      *Refining the Counterpart Issue:* The failure mode is thinking "I could have been a pirate" means *me* (this specific body/history) is a pirate elsewhere. Lewis says: No, a *counterpart* is. Why? Because if *you* were there, you'd have different properties (accidental intrinsics).
      *Refining the Parsimony:* Use the "Mathematical Objects" analogy. Do numbers exist? Platonists say yes, nominalists say no. Lewis is a Platonist about worlds. The parsimony argument is about *kinds* of things, not *count* of things.

  4.  **Addressing Specific User Constraints:**
      *   *Bait and Switch:* Mitigate by framing the ontology as the *only way* to save the semantics they already use. "You already use the logic; Lewis just takes the truth-makers seriously."
      *   *Everett:* Explicitly distinguish spatiotemporal isolation from quantum branching.
      *   *Eliezer:* Put it in the "Where does this leave us?" conclusion. Frame it as "Instrumentalism vs. Realism."

  5.  **Final Polish:**
      *   Ensure timing fits 90 mins.
      *   Make the "Check for Understanding" question sharp.
      *   Keep the tone appropriate for rationalists (focus on truth-conditions, utility, ontology costs).

  6.  **Self-Correction/Review during drafting:**
      *   *Wait, did I address the ordering question clearly?* I need to explicitly argue for Option A (Semantics -> Ontology) but with a specific bridge. Starting with ontology is too jarring. Starting with semantics is familiar ground. The "switch" happens when we ask "What makes these sentences true?"
      *   *Counterpart Theory:* The user mentioned they can't articulate the failure mode. I need to explain "Accidental Intrinsics" simply. If I am 6ft here, and 6ft 1in there, and it's the *same* me, I have contradictory properties. Lewis says: No, that's a counterpart.
      *   *Parsimony:* Make sure to mention "Ideology" vs "Ontology" if possible, but maybe too technical. Stick to "Kinds vs Instances."

  7.  **Finalizing the Output Structure:**
      *   Direct answers to the 6 points + Side Question.
      *   A proposed Minute-by-Minute Run of Show.
      *   Specific scripts/phrasing for tricky bits.

  *(Self-Correction on the Check for Understanding)*: A good question: "From the perspective of a counterpart in a distant world, is our world 'actual'?" Answer: Yes. If they say "No, ours is the only actual one," they failed.

  *(Self-Correction on Eliezer)*: Don't dismiss it. Acknowledge it as "Ersatzism with a pragmatic flavor." It validates their prior intuition while showing Lewis's alternative.

  8.  **Final Review against constraints:** 90 minutes is tight. Need to be ruthless on scope. No formal logic proofs. No deep dive into *On the Plurality of Worlds* Chapter 3. Focus on the core metaphysical picture.

