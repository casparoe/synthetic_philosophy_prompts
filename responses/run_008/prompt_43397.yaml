answer: |-
  This is a fantastic topic for a rationalist crowd. They are primed to treat possible worlds as useful fictions (instrumentalism), so Lewis's hard realism will feel like a genuine shock—which is pedagogically useful, provided you manage the transition carefully.

  Here is a teaching plan designed for a 90-minute session, addressing your specific constraints and worries.

  ### 1. Ordering: The "Truth-Maker" Bridge
  **Go with Option (A) (Semantics first), but with a specific pivot.**
  If you start with the ontology ("There are infinite concrete universes"), you trigger immediate defense mechanisms (parsimony, sanity checks). If you start with semantics ("Here's how we evaluate counterfactuals"), you are on common ground.

  **The Sequence:**
  1.  **The Tool:** Establish that they already use possible worlds semantics (Kripke, decision theory, CS). They treat "In all accessible worlds, P" as meaningful.
  2.  **The Problem:** Ask: "What *makes* these sentences true?" If I say 'If I had dropped the glass, it would have shattered,' and I didn't drop it, what is the truth-maker for that claim?
  3.  **The Escalation:** If the truth-maker isn't in *this* world (since the antecedent is false here), it must be elsewhere.
  4.  **The Ontology:** Lewis's move is to say: "Don't treat worlds as abstract descriptions (ersatz). Treat them as concrete entities, just like this one."

  **Why this avoids the bait-and-switch:** You explicitly frame the ontology as the *cost* of taking the semantics seriously. You aren't switching topics; you are following the truth-conditions to their natural conclusion. Say this verbatim: *"We all agree the logic works. Lewis's question is: what is the price of admission for that logic to be literally true?"*

  ### 2. Carrying Example: The "Near-Miss" Traffic Accident
  **Do not use Chess.** Chess is normative (winning/losing) and rule-bound. You want something descriptive and causal.
  **Do not use Quantum Mechanics.** (See below).

  **Use this:** "You were driving to the meetup. You arrived at 7:00 PM. If you had left 30 seconds later, you would have been in a collision."
  *   **Why it works:** It's spatiotemporal. It relies on physical laws. It's clearly false in *this* world (you are here, safe), but intuitively true as a counterfactual.
  *   **The Lewis Move:** In the world where you left 30 seconds later, there is a concrete spacetime manifold where a crash happens. That manifold is just as real as this one.
  *   **What to Avoid:**
      *   **Quantum Branching:** Explicitly forbid this analogy in the first 10 minutes. Lewisian worlds are not branching; they are *isolated*. There is no causal connection between the "safe you" and the "crashed you." Everett implies a shared past and a splitting mechanism; Lewis implies two distinct, unconnected concrete totals.
      *   **Time Travel:** Don't let them think the other world is the "future" or "past." It is *elsewhere* (in a non-spatial sense).

  ### 3. Misconceptions & Counterpart Theory
  You need to slot these objections exactly when the relevant concept is introduced.

  *   **(i) "This is just Many-Worlds Interpretation (MWI)."**
      *   **When:** Immediately after defining "Concrete."
      *   **Fix:** MWI worlds share a causal history and are parts of a larger quantum state. Lewisian worlds are *causally isolated*. No signal, no energy, no interaction. If MWI is true, Lewis might *also* be true, but Lewis does not *need* MWI.
  *   **(ii) "Nihilism / Nothing Matters."**
      *   **When:** After defining "Actual" as indexical.
      *   **Fix:** "Actual" = "Here." Just because "here" isn't special in the universe doesn't mean *my* location here doesn't matter to *me*. All the suffering in other worlds is real, but it is not *our* suffering. Our ethical obligations are indexed to our causal neighborhood. (This usually satisfies the rationalist concern about expected utility).
  *   **(iii) "Modal Distinctions Collapse."**
      *   **When:** Defining the set of all worlds.
      *   **Fix:** Lewis distinguishes worlds by *laws*. A world where 2+2=5 might not exist (depending on Lewis's view on math), but a world where Nixon pressed the button does. Possibility is existence; impossibility is non-existence. The distinction remains; it's just mapped to ontology.
  *   **(iv) Counterpart Theory vs. Transworld Identity (The Tricky One).**
      *   **The Failure Mode:** Attendees will think, "I exist in other worlds doing different things." Lewis says **No.** You are world-bound. You exist only here.
      *   **The Argument (Accidental Intrinsics):** If *you* (strictly identical) were in another world, you would have contradictory properties (e.g., 6ft tall here, 6ft 1in there). An object cannot have contradictory intrinsic properties.
      *   **The Solution:** The person in the other world is your *counterpart*. They resemble you closely and share your causal history up to a point, but they are numerically distinct.
      *   **Why it matters:** It saves the logic of modal claims ("I could have been taller") without violating logic (Identity). Frame this as a "technical fix to save the ontology," not a deep metaphysical mystery about souls.

  ### 4. Parsimony: The "Qualitative vs. Quantitative" Defense
  This guy will show up. Do not dodge. Dedicate 10 minutes to it.

  *   **The Objection:** "You've inflated the number of entities from 1 universe to infinity."
  *   **The Defense:** Distinguish **Quantitative Parsimony** (how many things) from **Qualitative Parsimony** (how many *kinds* of things).
  *   **The Script:** "Ersatzers (who say worlds are abstract descriptions) save on quantitative parsimony but pay in qualitative parsimony. They need a new kind of entity: 'Abstract Representations that act like concrete worlds.' Lewis says: 'I only believe in one kind of thing: Concrete Spacetime. I just have a lot of it.' He argues it is theoretically cheaper to have more of the same kind than to invent new kinds of entities."
  *   **Ersatzism:** Name-drop it as "The Competition." Define it as "Worlds are maximal consistent sets of propositions." Say: "We don't have time to debate the merits, but know that this is the standard alternative."

  ### 5. Check for Understanding: The Indexicality Test
  Do not ask "Is actuality indexical?" They will just parrot you.
  **Ask this:**

  > "Imagine a counterpart of you in a distant world. From *their* perspective, referring to *their* world using the word 'actual', are they correct?"

  *   **Correct Answer:** "Yes. 'Actual' picks out the world of the speaker. They are the actual world to themselves."
  *   **Wrong Answer (Reveals Confusion):** "No, because our world is the only real one," or "No, because they are just a counterpart."
  *   **Why:** This tests if they truly internalized that "actual" has no privileged metaphysical status, or if they still secretly think "Actual" is a property that only our world has.

  ### 6. Scope: What to Refuse to Cover
  Announce this at the start to manage expectations.
  *   **Out:** Formal syntax of Counterpart Theory (no $Cxy$ relations on the whiteboard).
  *   **Out:** The "Argument from Ways" (the technical argument that quantifies over properties).
  *   **Out:** Humean Supervenience (too much baggage).
  *   **Out:** Detailed comparison with Plantinga or Stalnaker (keep it Lewis vs. Common Sense).

  **When to announce:** At the start. "We are focusing on the metaphysical picture, not the formal machinery."

  ### Side Question: The Eliezer/Sequences Foil
  **Yes, bring it up, but frame it carefully.**
  The rationalist canon often treats models as maps, not territories. Lewis is claiming the map *is* the territory (or rather, that the territory matches the map's most literal reading).

  *   **How to frame it:** "Many of you come from a tradition that says 'Possible worlds are useful fictions for calculating probabilities.' Lewis says 'If the calculation works, the fiction is real.' This isn't a disagreement about math; it's a disagreement about ontological commitment."
  *   **Why:** It validates their background (Sequences) while showing Lewis as the "Hard Mode" philosophical upgrade. It prevents the session from becoming a referendum on Yudkowsky by acknowledging the instrumentalist view as a valid competing stance (Ersatzism/Instrumentalism) without letting it dominate the room.

  ---

  ### Proposed Run of Show (90 Minutes)

  *   **00-10: Intro & The Semantic Hook.**
      *   Welcome.
      *   Quick poll: "Who uses possible worlds in logic/CS?"
      *   The Traffic Accident Example. Establish the truth of the counterfactual.
      *   *Pivot:* "What makes that true?"
  *   **10-25: Lewis's Thesis.**
      *   Concrete, Isolated, Plenitude, Indexical Actuality.
      *   **Stop:** Address Everett/Quantum confusion here.
  *   **25-40: The Hard Pill (Counterpart Theory).**
      *   Why you can't be in two worlds (Accidental Intrinsics).
      *   Counterparts as a solution.
      *   *Check:* "Are you world-bound?" (Yes).
  *   **40-50: Break (Crucial for absorption).**
  *   **50-65: Objections I (Nihilism & Modality).**
      *   Does ethics collapse? (Indexical ethics).
      *   Does possibility collapse? (Laws distinguish worlds).
  *   **65-75: Objections II (Parsimony).**
      *   Qualitative vs. Quantitative.
      *   Ersatzism as the alternative.
  *   **75-85: The "Eliezer" Question & Instrumentalism.**
      *   Contrast Lewisian Realism with Rationalist Instrumentalism.
      *   Why Lewis thinks realism pays dividends (philosophical analysis becomes easier).
  *   **85-90: Check for Understanding & Q&A.**
      *   Ask the Indexicality Question (from section 5 above).
      *   Close.

  ### One Final Tip for the "Bait and Switch" Worry
  The feeling of a bait-and-switch comes from changing the *rules of the game* without telling the players.
  To prevent this, use the phrase **"Truth-Makers"** early.
  *"We are all comfortable with the logic. The game we are playing today is finding the Truth-Makers. Lewis wins this game by changing the board, not the rules."*
  This signals that the ontology is a *means* to secure the semantics they already like, not a rejection of them.
