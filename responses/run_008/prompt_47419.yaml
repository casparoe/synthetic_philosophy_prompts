answer: |-
  This is a sophisticated approach to a very human problem. You are describing the core insight of **Risk-Weighted Expected Utility**: that it is rational to care more about avoiding the bottom floor than reaching the ceiling, provided you do it consistently. You aren't trying to fix their risk aversion; you are trying to measure its coefficient so the math matches the gut.

  Here is a procedure designed for a 60-minute nonprofit session. It avoids jargon, requires no licensing, and forces the inconsistency into the light without you having to preach.

  ### The Procedure: "The Certainty Ladder"

  **Goal:** Convert vague feelings ("I'm not a gambler") into a "Certainty Equivalent" (the guaranteed cash amount that feels exactly as good as the risky option).

  **Time:** 45 minutes (leaves 15 for wrap-up/values).
  **Tools:** Pen, paper, calculator. No spreadsheets.

  #### Step 1: Frame the Binary (5 Minutes)
  Write the two options clearly at the top of the page.
  *   **Option A (The Safe Floor):** The guaranteed number (e.g., Annuity, Settlement Offer, Current Sale Price).
  *   **Option B (The Risky Ceiling):** The variable outcome (e.g., Lump Sum invested, Lawsuit, Future Sale).
  *   **Constraint:** Ask: "If you choose B and it goes to zero, what happens?"
      *   *Usable Answer:* A concrete consequence ("I lose the house," "I move in with my son").
      *   *Stop Point:* If the consequence is "I starve" or "I become homeless," the procedure stops. This is no longer a risk preference; it is a survival constraint. You cannot trade off survival.

  #### Step 2: The Calibration Bet (10 Minutes)
  You need to know how they handle risk when *nothing matters*. This establishes their baseline "risk coefficient."
  *   **The Question:** "Imagine I offer you a coin flip. Heads you get $1,000, Tails you get $0. Or, I can just hand you cash right now and we skip the flip. What is the lowest amount of guaranteed cash you'd take to walk away from the flip?"
  *   **Usable Answer:** A specific number (e.g., "$400" or "$550").
  *   **The Math:** The expected value is $500.
      *   If they say $500+, they are risk-neutral or seeking risk.
      *   If they say $300, they are discounting the upside by 40% to avoid the zero.
  *   **The Triangulation:** Change the stakes. "Okay, same flip, but it's $10,000 or $0. What's the guaranteed cash?"
      *   *Consistency Check:* Do they discount by the same percentage? If they took $400 for the $1k flip (40% discount) but demand $8,000 for the $10k flip (20% discount), they are inconsistent.
      *   *Flag:* If they can't answer or say "It depends," probe why. Is it the amount or the concept?

  #### Step 3: The Shadow Price (15 Minutes)
  Apply their discount rate to *their* actual decision.
  *   **The Question:** "Look at Option B (the risky one). We don't know the exact odds, but let's say it's a 50/50 between a 'Good Outcome' and a 'Bad Outcome.' Based on the coin flip we just did, what guaranteed amount feels *equal* to that gamble?"
  *   **Usable Answer:** A number lower than the mathematical average.
  *   **The Comparison:** Compare this "Shadow Price" to Option A (The Safe Floor).
      *   If Shadow Price > Option A: Their risk attitude says "Go Risky."
      *   If Shadow Price < Option A: Their risk attitude says "Take Safe."
  *   **The Stress Test:** "What if the odds aren't 50/50? What if there's a 70% chance of the Good Outcome? Does your guaranteed number change?"
      *   *Consistency Check:* A rational risk-averse person should raise their guaranteed number as odds improve, but usually not linearly. If their number stays the same regardless of odds, they aren't weighing risk; they are fixated on the worst case (Maximin strategy). That is valid, but needs to be named.

  #### Step 4: The Sleep Test (10 Minutes)
  Math ends here. Values begin.
  *   **The Question:** "The math says Option [X] fits how you handle bets. But imagine you sign the papers tonight. You lie down. Do you feel relief, or do you feel like you left money on the table?"
  *   **Usable Answer:** An emotional descriptor.
  *   **Stop Point:** If the emotion contradicts the math (e.g., Math says Safe, Gut says Regret), you stop. The procedure has done its job; it revealed a conflict between their *stated* risk tolerance and their *lived* values.

  #### Step 5: The Handoff (5 Minutes)
  *   **Statement:** "I cannot tell you what to choose. I can tell you that based on how you priced the coin flip, Option A matches your style. But only you know if you can live with the regret."
  *   **Coach Bias Flag:** If you find yourself saying, "But are you *sure*?" or "Have you considered...?" three times in a row, you are overriding their risk attitude with your own. Stop.

  ***

  ### Case Studies

  #### Case 1: The "Non-Gambler" Who Bets
  **Profile:** 58-year-old, Pension Lump Sum vs. Annuity. Says "I hate risk."
  **Procedure Yield:**
  *   **Calibration:** On the $1,000 coin flip, she demands $550 to walk away. On the $10,000 flip, she demands $6,000. She is effectively risk-neutral (discounting very little).
  *   **Shadow Price:** When applied to the pension, her "guaranteed equivalent" for the lump sum is higher than the annuity's present value.
  *   **Result:** The procedure indicates she should take the Lump Sum.
  *   **Where it Misfires:** Her *identity* ("I am not a gambler") conflicts with her *behavior* (pricing like an investor). The procedure exposes the lie but doesn't fix it.
  *   **What it Can't Do:** It cannot tell her which version of herself is real. Is she braver than she thinks? Or is she underestimating the pension risk because the numbers are abstract?
  *   **Coach Move:** "You say you're not a gambler, but your numbers show you price risk like one. If you take the annuity, you might feel safe but financially cramped. If you take the lump sum, you might feel rich but anxious. Which discomfort do you prefer?"

  #### Case 2: The Over-Cautious Couple
  **Profile:** Selling family restaurant. Offer: $1M. Hold: Potential $3M or $0.
  **Procedure Yield:**
  *   **Calibration:** Extremely risk-averse. They take $200 on a $1,000 flip (80% discount).
  *   **Shadow Price:** They value the "Hold" option at $600k (discounted heavily for the risk of $0).
  *   **Result:** The procedure says "Take the $1M Offer" (since $1M > $600k Shadow Price).
  *   **The Conflict:** You know the business is worth at least $2M. The offer is predatory. Their risk aversion is being exploited by the market.
  *   **Where it Misfires:** The procedure respects their *attitude toward risk*, but it cannot assess the *fairness of the odds*. It treats the 50/50 as a given, but in reality, the odds might be 90/10 in their favor if they waited.
  *   **What it Can't Do:** It cannot distinguish between "I don't like risk" and "I don't understand my leverage."
  *   **Coach Move:** This is where you must pause the procedure. "The math says take the deal based on your fear of zero. But my professional observation is that the '50/50' we used might be wrong. The risk of getting $0 might be much lower than you think. If we change the odds to 80/20, does your number change?" You are not giving advice; you are challenging the *input* (the probability), not the *function* (their risk aversion).

  #### Case 3: The Rationalizer
  **Profile:** Man taking the settlement. Numbers shift to match the conclusion.
  **Procedure Yield:**
  *   **Calibration:** He gives a number.
  *   **Shadow Price:** You calculate the implication. He says, "Well, actually, I'd need more guarantee than that."
  *   **Stress Test:** You adjust the odds. His certainty equivalent moves in the wrong direction (e.g., better odds make him more cautious).
  *   **Result:** The procedure breaks. There is no stable curve.
  *   **Where it Misfires:** The procedure assumes a stable utility function. This client has a *conclusion* looking for premises.
  *   **What it Can't Do:** It cannot force introspection. It can only mirror the inconsistency.
  *   **Coach Move:** Stop the math. "I notice that every time the math points one way, the numbers change. That tells me you've already decided. The math isn't the problem; you're worried I'm going to tell you you're wrong. I won't. You've decided to settle. Let's talk about how to make sure that money lasts."

  ***

  ### The Big Question: Attitude vs. Fear

  You asked: *Is there a principled line between a stable risk attitude I should respect and a mood or a fear response I should probe?*

  **The hard truth:** No. A procedure cannot find that line. Only you can.

  Math measures consistency; it cannot measure *health*. A person can be consistently terrified. A person can be consistently manic. The procedure will validate both as "rational" under Risk-Weighted Expected Utility theory, provided they are consistent.

  **The Line is Temporal and Contextual:**
  1.  **Stability:** A stable attitude holds up over time. A fear response spikes under stress. If you can, split the session. Do the calibration bet at the start. Do the Shadow Price at the end. If the numbers drift significantly without new information, it's a mood/fear response, not a trait.
  2.  **Context:** A stable attitude applies across domains (as seen in the Calibration Bet). A fear response is often specific to the trauma at hand (e.g., "I'll bet on a coin, but not on my pension").
  3.  **The "Regret" Test:** Stable attitudes usually result in acceptance. Fear responses result in defensiveness. If they are arguing with the math, it's fear. If they are using the math to explain their comfort, it's attitude.

  **Your Role:**
  You are not the calculator. You are the sensor. The procedure is the ruler, but you have to check if the ruler is bent.
  *   If the procedure says "Take the bad offer" (Case 2), and your gut says "This is exploitation," you have an ethical duty to probe the *probability inputs*, not the risk weighting.
  *   If the procedure says "Take the risk," and the client is shaking, you have a duty to probe the *survival constraint*.

  **Final Verdict:**
  Use the procedure to clear away the fog of "I should be rational." It gives them permission to be cautious without shame. But when the procedure validates a choice that looks like self-harm, that is the moment you step out of the coach role and into the human role. Ask: "If your best friend had these numbers, what would you tell them?"

  That question often bypasses the fear response and hits the stable attitude underneath. The procedure can't do that. You have to.
