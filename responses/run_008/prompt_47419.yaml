prompt: |-
  I'm a money coach at a community nonprofit. Most of my clients aren't investors, they're people facing one or two big irreversible decisions: take the pension as a lump sum or as monthly payments for life, accept the insurance settlement or sue, sell the family restaurant now for a guaranteed number or hold out for a better offer that might never come. I see maybe six of these a month and I get one 60-minute session per decison, two if I'm lucky. I'm not licensed to recommend specific products, so all I can really do is help them figure out what they actually want and what the tradeoffs are — every decision has to be signed off as theirs, not mine.

  Here's the idea I want operationalized, and I apologize in advance for butchering it. Somewhere I read about a version of decision theory where you don't have to weight outcomes strictly by their probability to count as rational — you're allowed to count the bad half of a 50/50 as mattering more than half, i.e. be cautious, and it's still rational as long as you do it consistently, instead of it being a bias somebody should councel out of you. I think the term was risk-weighted expected utility or something like that, but don't quote me and don't bother with citations, I can't use those in a session anyway. The point that stuck with me: my job isn't to find the "correct" attitude toward risk and fix the client until they have it. It's to elicit whatever stable attitude they actually have and rank their options under it. What I need is a procedure for doing that.

  Please write it so I can actually run it inside a session: the questions to ask in order (I'm imagining comparing made-up bets to triangulate how much they discount the good branch of a gamble, but do it better than that), what counts as a usable answer to each question, where the procedure stops and hands the decision back to the client because what's left is about values or obligations to family rather than risk attitude, and where it flags that I'm making a judgment call dressed up as math.

  Then run it on three cases:

  1. A 58-year-old choosing between the lump sum and the annuity, who says she's "not a gambler" but then picks the gamble on every small-stakes hypothetical I throw at her.
  2. A couple deciding whether to sell now or hold out, who answer every question consistently but so cautiously that the procedure would tell them to take an offer I think is genuinely bad — one I'd feel awful walking them into, and honestly one I'll be tempted to override.
  3. A man who clearly already wants to take the settlement and go home, and whose numbers keep quietly changing to justify whatever he'd decided in the parking lot.

  For each case, say what the procedure yields, where it misfires, and what it can't do. And be straight with me about the biggest question underneath all this: is there a principled line between a stable risk attitude I should respect and, like, a mood or a fear response I should probe before I use it as input? Can a procedure even find that line, or is that part just me?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Money coach at a community nonprofit.
      *   **Clientele:** Not investors; people facing high-stakes, irreversible, binary (or near-binary) life decisions (pension, legal settlements, business sales).
      *   **Constraints:** 60-90 minutes per decision, unlicensed (cannot give specific financial advice/products), must ensure client ownership of the decision.
      *   **Core Philosophy:** Wants to use a "Risk-Weighted Expected Utility" (RWEU) approach without the jargon. The goal isn't to correct risk aversion but to elicit the client's *actual* stable risk attitude and rank options based on that.
      *   **Deliverables:**
          1.  A step-by-step in-session procedure (questions, acceptable answers, stop points, flags for coach bias).
          2.  Application of this procedure to three specific case studies.
          3.  A direct answer to the philosophical/ethical question: Is there a line between stable risk attitude and fear/mood, and can a procedure find it?

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   The user is referencing *Risk-Weighted Expected Utility Theory* (Buchak, etc.). The core idea is that rational agents can weight probabilities non-linearly (e.g., overweighting the worst-case scenario) without being irrational, provided consistency.
      *   *Challenge:* In a 60-minute session with non-investors, you can't run regressions or complex utility curves. You need heuristics and conversational triangulation.
      *   *Goal:* Move from "I'm not a gambler" (label) to "Here is how much I discount the upside to avoid the downside" (metric).
      *   *Key Distinction:* Risk *Attitude* (preference) vs. Risk *Perception* (belief about odds) vs. External *Constraints* (family obligations).

  3.  **Drafting the Procedure (The "Tool"):**
      *   *Name:* Needs to sound practical, not academic. "The Tradeoff Ladder" or "The Certainty Equivalent Test." Let's go with "The Certainty Ladder."
      *   *Step 1: Frame the Binary.* Define Option A (Safe/Lower) vs. Option B (Risky/Higher).
      *   *Step 2: The Calibration Bet.* Use a neutral, low-stakes gamble to establish baseline consistency. (Heads/Tails $100 vs $0).
      *   *Step 3: The Shadow Price of Safety.* Ask what guaranteed amount makes them indifferent to the risky option. This finds the "Certainty Equivalent."
      *   *Step 4: The Stress Test.* Change the odds slightly. Does their preference flip logically?
      *   *Step 5: The "Sleep" Test.* Connect the math to the emotional outcome (values).
      *   *Stop Conditions:* When numbers contradict values, or when external obligations (kids, debt) dictate the choice regardless of risk preference.
      *   *Coach Bias Flag:* When the coach feels an urge to "save" them from a choice the math says is consistent with their stated preferences.

  4.  **Developing the Case Studies:**
      *   *Case 1 (The Inconsistent "Non-Gambler"):* Says "no risk," acts "risk-neutral."
          *   *Procedure Yield:* Reveals inconsistency.
          *   *Misfire:* The procedure exposes the lie, but doesn't fix the identity crisis.
          *   *Limit:* Can't tell them which identity is real.
      *   *Case 2 (The Over-Cautious Couple):* Consistent but self-destructive (in coach's view).
          *   *Procedure Yield:* Clear mathematical preference for the low offer.
          *   *Misfire:* The coach's conscience vs. client autonomy.
          *   *Limit:* Procedure validates the fear, doesn't assess the *reality* of the risk (market value).
      *   *Case 3 (The Rationalizer):* Post-hoc justification.
          *   *Procedure Yield:* Numbers shift every time.
          *   *Misfire:* Procedure assumes stable preferences; this client has a *conclusion* looking for premises.
          *   *Limit:* Can't force introspection, only mirror the inconsistency.

  5.  **Addressing the "Big Question" (Attitude vs. Fear):**
      *   *The Hard Truth:* A procedure cannot distinguish between a stable trait and a temporary state (fear/mood). Only a human can sense that.
      *   *The Line:* Stability over time + consistency across contexts = Attitude. Volatility + somatic distress = Fear.
      *   *Coach's Role:* The procedure is the ruler; the coach is the eye checking if the ruler is bent.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but rigorous.
      *   No academic citations (as requested).
      *   Practical, actionable language.
      *   Acknowledge the emotional weight (nonprofit context).

  7.  **Iterative Polishing (Self-Correction during drafting):**
