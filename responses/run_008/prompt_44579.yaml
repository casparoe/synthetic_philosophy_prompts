answer: |-
  This is a sophisticated request that touches on the core tensions in normative ethics. You are essentially asking for a reflective equilibrium between your intuitions and a theoretical framework.

  Below, I have separated the response into three parts: (1) The state of the philosophical literature regarding your presuppositions; (2) A proposed framework (a shortlist of principles) designed to fit your verdicts; and (3) An honest assessment of where your verdicts conflict and which might need to be revised.

  ### Part 1: The State of the Literature

  You asked to distinguish settled views from contested ones. In academic ethics, very little is "settled" in the sense of universal consensus, but there are stable positions.

  **1. The Coherence of Supererogation**
  *   **Contested:** Whether supererogation (acts that are good to do but not wrong to omit) is logically compatible with rational choice.
  *   **The Debate:** Act Utilitarians generally deny supererogation exists. If Act A produces more good than Act B, Act A is required; doing B is wrong. To them, your "soldier" and "kidney" cases are misdescribed; the soldier who doesn't jump fails to maximize value.
  *   **The Consensus (such as it is):** Most non-utilitarian frameworks (Deontology, Virtue Ethics, Pluralism) accept supererogation as coherent. They argue that "obligation" has a limit defined by agent-centered prerogatives (the right to pursue one's own life) or rights (the right not to be used as a mere means).
  *   **The Paradox:** Philosophers David Heyd and Roderick Chisholm noted a tension: If an act is *morally best*, why is it not *required*? Resolving this usually requires rejecting the premise that "moral bestness" always dictates "requirement."

  **2. Thresholds and Costs**
  *   **Contested:** Where the line between duty and supererogation lies.
  *   **The Debate:** Peter Singer's "Famine, Affluence, and Morality" argues there is no relevant moral difference between the Pond and Global Poverty; if you accept the Pond, you must accept a very high demand on your income. Most philosophers reject Singer's conclusion as too demanding, but there is no consensus on *where* to draw the line (the "Moderate" position).
  *   **Status:** Your intuition that the Pond is required but the Kidney is not is the standard "Moderate" view. It is widely held but theoretically difficult to justify without arbitrariness.

  **3. Role Obligations**
  *   **Contested:** Whether role obligations (lifeguard, parent, soldier) are fundamental or reducible.
  *   **The Debate:** Contractualists argue roles create explicit or implicit promises (fundamental). Consequentialists argue roles are only useful insofar as they maximize good (reducible).
  *   **Status:** It is standard practice to treat role obligations as distinct from general beneficence, but the *foundation* of that distinction is debated.

  **4. Scalar Wrongness**
  *   **Contested:** Whether morality is binary (right/wrong) or scalar (better/worse).
  *   **The Debate:** Traditional deontology is often binary. Scalar Consequentialism argues wrongness comes in degrees.
  *   **Status:** Your intuition that the Holiday case is *mildly* wrong while the Pond case is *seriously* wrong aligns with Scalar Consequentialism or "Gradualist Deontology." This is increasingly accepted but complicates formal modeling.

  ---

  ### Part 2: A Proposed Framework

  A single monistic principle (like "Maximize Utility") will fail your data set, specifically on the Promise vs. Kidney case. To accommodate your verdicts, I propose a **Moderate Pluralist Framework**. This is not a single sentence, but a shortlist of three weighted clauses. This framework is consistent with "Rossian Deontology" modified by "Agent-Centered Prerogatives."

  **The Principle of Weighted Obligations:**
  An agent is morally required to perform an act if it falls under a binding obligation clause *unless* overridden by a higher-order constraint.

  *   **Clause A (The Rescue Threshold):** An agent is required to prevent serious harm to others when the cost to the agent is **minor** (e.g., ruined boots, missed convenience) and the causal link is **direct and immediate** (e.g., the Pond).
      *   *Motivation:* Fits your Pond verdict.
      *   *Prediction:* Failing to give 10% to charity is less wrong than the Pond because the link is indirect and the cost is recurring, not one-off.
  *   **Clause B (The Integrity Limit):** An agent is **not** required to incur costs that threaten their **bodily integrity** or **central life projects**, even to save a life. Such acts are supererogatory.
      *   *Motivation:* Fits your Kidney and Soldier verdicts.
      *   *Prediction:* Bone marrow donation (months of pain) falls on the supererogatory side of the line, similar to the kidney, because it violates bodily integrity, unlike the boots.
  *   **Clause C (The Special Obligation Override):** Voluntary commitments (promises) and Institutional Roles create specific duties that **override** general utility calculations but **submit** to the Integrity Limit.
      *   *Motivation:* Fits your Promise/Concert and Lifeguard verdicts.
      *   *Prediction:* You must help your friend move (Promise) even if the concert yields more utility, because a specific duty exists. However, a lifeguard is not required to die (Integrity Limit), though they are required to take risks a swimmer is not.

  #### Testing the Framework on New Cases

  **1. The Off-Duty Surgeon vs. Child's Birthday**
  *   *Scenario:* An off-duty surgeon could rush to the hospital to save a life but would miss her child's birthday.
  *   *Prediction:* **Permissible to miss the hospital.**
  *   *Reasoning:* Clause B (Integrity/Life Projects). Parental obligations to one's own child are typically viewed as "central life projects." While saving a life is a high good, the cost here is not just "time" but a violation of a competing special obligation (parenthood). Most moderate frameworks prioritize the specific duty to one's own child over the general duty to a stranger, provided the stranger's death isn't caused by the surgeon's negligence.
  *   *Contestation:* A strict Utilitarian would say this is wrong. A Pluralist would say it is permissible.

  **2. The Certain-Death Grenade**
  *   *Scenario:* A soldier knows jumping on the grenade guarantees death (100% vs. probable).
  *   *Prediction:* **Still Supererogatory (Not Required).**
  *   *Reasoning:* Clause B (Integrity Limit). Death is the ultimate violation of bodily integrity. No general duty to rescue requires self-annihilation.
  *   *Nuance:* If the soldier is *on duty* in a specific defensive position (Role), Clause C might shift this. If their job description explicitly entails accepting fatal risk to save squadmates (e.g., a rearguard action), it may become required. If it is a spontaneous opportunity, it remains heroic.

  **3. Degrees of Wrongness**
  *   *Scenario:* Pond (Serious Wrong) vs. Holidays/Charity (Mild Wrong).
  *   *Prediction:* **Wrongness is Scalar.**
  *   *Reasoning:* The framework supports this via "Salience" and "Proximity." Clause A applies most strongly to immediate, direct rescue. As the link becomes abstract (charity) and the cost becomes structural (lifestyle change), the "bindingness" weakens.
  *   *Literature Note:* This aligns with "Scalar Consequentialism" (Alastair Norcross). It is contested by traditional Deontologists who prefer binary rules, but it fits your data.

  **4. Role Obligations (Built-in or Explained Away?)**
  *   *Prediction:* **Built-in.**
  *   *Reasoning:* Your Lifeguard verdict cannot be explained solely by utility (the off-duty swimmer saves the same life). It must be that the *contract* or *role* changes the moral landscape.
  *   *Literature Note:* This treats role obligations as fundamental (Contractualism/Virtue Ethics) rather than derivative (Utilitarianism).

  ---

  ### Part 3: The Cost of Coherence (Incompatibilities)

  You asked for an honest statement of which verdicts no clean principle can accommodate. While the Pluralist Framework above fits most of your data, it creates friction in two specific areas. To maintain a coherent theory, you may need to adjust one of the following pairs.

  **1. The Promise vs. Kidney Tension**
  *   **The Conflict:** You hold that keeping a promise to move house is *required* despite the cost (missing a concert), but donating a kidney is *not required* despite the greater good.
  *   **The Problem:** If the basis of morality is "preventing harm/promoting good," the Kidney case is stronger. If the basis is "autonomy/choice," the Promise case is strong (you chose it) but the Kidney case is weak (you didn't choose the stranger's need).
  *   **The Friction:** The principle relies on distinguishing "Special Duties" from "General Duties." However, critics (like Utilitarians) argue this is arbitrary. Why does a casual promise to move a couch bind you more than a stranger's need for an organ?
  *   **What might have to go:** To be fully coherent, you must either:
      *   **A:** Admit that breaking the promise is *also* permissible if the utility loss is high enough (weakening the Promise verdict).
      *   **B:** Admit that Kidney donation is *required* if the cost is "only" pain/recovery and not death (strengthening the Kidney verdict).
      *   **C:** Accept the "Arbitrariness." Many philosophers (e.g., Bernard Williams) argue that morality *just is* fragmented this way. If you choose C, you sacrifice theoretical elegance for intuitive accuracy.

  **2. The Pond vs. Holiday Tension (The Singer Challenge)**
  *   **The Conflict:** You say walking past the Pond is "straightforwardly wrong," but giving nothing to charity while holidaying is only "mildly wrong," even if the money saved could save a life.
  *   **The Problem:** This relies on **Proximity** and **Salience**. Philosophically, this is hard to defend. Why does physical distance matter morally? If the child in the pond is morally equivalent to the child starving abroad (as Singer argues), your distinction is inconsistent.
  *   **What might have to go:**
      *   **A:** Accept Singer's view. The Holiday is *seriously* wrong, equivalent to the Pond. (High cost to your lifestyle intuitions).
      *   **B:** Accept a "Proximity Principle." We owe more to those physically near us. (Theoretically costly; hard to justify why geography dictates morality).
      *   **C:** Accept that "Wrongness" is partly about **psychological demand**. The Pond is a one-off shock; Charity is a lifestyle overhaul. The "mildness" of the wrongness reflects the difficulty of compliance, not the value of the life lost.

  ### Summary Recommendation

  Your intuitions align best with **Moderate Pluralism with Scalar Wrongness**.

  1.  **Accept Supererogation:** It is coherent if you reject the premise that "best act" always equals "required act."
  2.  **Adopt the Integrity Limit:** Bodily intrusion (Kidney/Marrow) is a higher threshold than financial loss (Boots/Charity).
  3.  **Acknowledge Special Obligations:** Promises and Roles create duties that General Beneficence does not.
  4.  **Compromise on Consistency:** You must accept that your distinction between the Pond and the Holiday is based on **psychological salience and proximity**, not pure outcome value. If you demand a principle that ignores proximity, you must concede the Holiday case is as wrong as the Pond. If you demand a principle that respects proximity, you must concede it is theoretically "messy."

  **Final Verdict on Your Half-Principle:**
  Your idea ("required when cost is small relative to good") is the standard **Moderate View**. The repair needed is to add **Clause C (Special Obligations)**. Without it, you cannot explain why the Promise binds but the Kidney does not. With it, you can accommodate almost all your verdicts, provided you accept that "Wrongness" comes in degrees and that "Proximity" matters.
