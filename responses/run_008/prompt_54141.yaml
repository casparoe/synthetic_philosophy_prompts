answer: |-
  **The Tyranny of the Tearful Survey**
  **By Arthur W. Hicks, Retired Senior Analyst, Office of Cost-Benefit**

  Recently, the policy world has gone soft. We are abandoning the hard steel of revealed preference for the damp cotton of happiness surveys. Colleagues ask citizens, "How satisfied are you?" and treat the answers as data. This is not science; it is astrology with Likert scales. It violates the foundational insight of the ordinalist revolution: utility is not a feeling; it is a ranking of choices. To measure feelings is to measure nothing.

  Consider my neighbor, Mr. Henderson. Every morning at 6:15, he boards a train to the city. He returns at 6:15. He spends four hours daily in transit. Yet, over the fence, he tells me he "hates" the commute. He says it ruins his life. I do not believe him. If he truly preferred living closer, he would move. He has not moved. Therefore, he prefers the commute. Perhaps he enjoys the crossword puzzles. Perhaps he values the distance from his wife. His actions scream love; his mouth whispers hate. In economics, we listen to the actions. Words are cheap. Train tickets are expensive. To claim he is suffering is to claim we know his utility function better than he does. We do not. We only know he chose the train.

  This rigor extends to the laboratory. Critics point to the Ultimatum Game, where subjects reject unfair monetary splits. They claim this proves people care about fairness, not just income, and suffer from "inequity aversion." Nonsense. If a subject rejects $10 to punish another player keeping $90, they have revealed a preference for $0 and spite over $10 and inequity. They are not "worse off." They got exactly what they wanted. To claim they made a mistake is to impose the economist's utility function onto the subject. They maximized. We must respect their choice to eat nothing rather than eat crumbs. If policy makers intervene to force them to take the $10, that violates their revealed preference.

  Even grief is subject to this scrutiny. I attended a funeral last week. There was weeping. Wailing, even. The family claimed deep sorrow. But did they leave? No. They sat through the eulogy. They paid for the casket. If the grief were truly unbearable, the rational agent would opt out. Staying reveals a preference for mourning over alternative uses of time. Tears are physiological reflexes, like sneezing. You cannot reveal a preference by sneezing. You reveal it by buying tissues.

  The new welfare economists want to use self-reports to judge policy. They want to say a tax makes people "unhappy." But happiness is unobservable. Choice is observable. If you choose to work under a tax regime, you revealed a preference for working over not working. To suggest otherwise is to indulge in interpersonal utility comparisons, the original sin of our discipline. Lionel Robbins settled this in 1932. We do not know what is in your head. We know what is in your basket.

  Let us return to rigor. Let us ignore the tears and the surveys. Let us trust the transaction. If people choose misery, who are we to call it misery? It is simply utility, maximized.

  ***

  **Commentary for the Lecturer (Not for the Slides)**

  **Where the Parody Bites vs. Where It Strawmans**
  The character of Hicks pushes the logic of Revealed Preference (RP) to a rigid conclusion that most modern micro theorists would find uncomfortable, though logically consistent within the strict Samuelsonian framework.

  1.  **Preference vs. Welfare (The Big Strawman):** Hicks conflates *decision utility* (what was chosen) with *experienced welfare* (well-being). Real RP theorists (like Samuelson) wanted to purge psychology from *demand theory*, but many still intended RP to serve as a proxy for welfare. Amartya Sen's critique ("Rational Fools") is the standard counter here: choosing X doesn't mean X makes you better off, especially under duress or adaptive preferences. Hicks ignores adaptive preferences (Henderson might feel he *cannot* move, so he adapts his choice, not his welfare).
  2.  **Internal Consistency:** Hicks is careful not to say anyone is "worse off" in a cardinal sense, which is good. However, strict RP requires transitivity and stability over time. A one-off Ultimatum rejection might not reveal a stable preference function, but Hicks treats it as gospel.
  3.  **The "No Welfare" Claim:** Hicks claims Robbins (1932) settled that we can know nothing about welfare. Robbins definitely argued against *interpersonal* comparisons of utility. However, whether he argued against *intrapersonal* welfare judgments based on choice is debatable. Hicks uses the ban on interpersonal comparisons to ban all talk of feelings, which is a leap.

  **Confidence & Historical Flags**
  *   **High Confidence:** Robbins (1932) *An Essay on the Nature and Significance of Economic Science* is the correct citation for the ban on interpersonal utility comparisons. Samuelson (1938) "A Note on the Pure Theory of Consumer's Behaviour" is the correct origin for Revealed Preference.
  *   **Medium Confidence:** The characterization of Samuelson's own view on welfare. Samuelson wanted to make economics behaviorist, but later in life, he acknowledged limitations. Hicks presents the 1938 view as eternal truth.
  *   **Least Sure / Flag This:** The claim that Robbins settled the issue of *intrapersonal* welfare (whether choice equals well-being). Robbins focused on the impossibility of comparing Person A's utility to Person B's. He was less explicit on whether Person A's choice perfectly maps to Person A's welfare in the presence of cognitive biases or constraints. If a student asks, "Did Robbins say choice equals welfare?", the honest answer is "He said choice is the only *observable* data, but later scholars like Sen argued choice ≠ welfare." I recommend framing the Robbins citation specifically around **interpersonal** comparisons to be safe.
