      Title: The Tyranny of the Tearful Survey
      By Arthur W. Hicks, Retired Senior Analyst, Office of Cost-Benefit

      Recently, the policy world has gone soft. We are abandoning the hard steel of revealed preference for the damp cotton of happiness surveys. Colleagues ask citizens, "How satisfied are you?" and treat the answers as data. This is not science; it is astrology with Likert scales.

      Consider my neighbor, Mr. Henderson. Every morning at 6:15, he boards a train to the city. He returns at 6:15. He spends four hours daily in transit. Yet, over the fence, he tells me he "hates" the commute. He says it ruins his life. I do not believe him. If he truly preferred living closer, he would move. He has not moved. Therefore, he prefers the commute. Perhaps he enjoys the crossword puzzles. Perhaps he values the distance from his wife. His actions scream love; his mouth whispers hate. In economics, we listen to the actions. Words are cheap. Train tickets are expensive.

      This rigor extends to the laboratory. Critics point to the Ultimatum Game, where subjects reject unfair monetary splits. They claim this proves people care about fairness, not just income. Nonsense. If a subject rejects $10 to punish another player keeping $90, they have revealed a preference for $0 and spite over $10 and inequity. They are not "worse off." They got exactly what they wanted. To claim they made a mistake is to impose the economist's utility function onto the subject. They maximized. We must respect their choice to eat nothing rather than eat crumbs.

      Even grief is subject to this scrutiny. I attended a funeral last week. There was weeping. Wailing, even. The family claimed deep sorrow. But did they leave? No. They sat through the eulogy. They paid for the casket. If the grief were truly unbearable, the rational agent would opt out. Staying reveals a preference for mourning over alternative uses of time. Tears are physiological reflexes, like sneezing. You cannot reveal a preference by sneezing. You reveal it by buying tissues.

      The new welfare economists want to use self-reports to judge policy. They want to say a tax makes people "unhappy." But happiness is unobservable. Choice is observable. If you choose to work under a tax regime, you revealed a preference for working over not working. To suggest otherwise is to indulge in interpersonal utility comparisons, the original sin of our discipline. Robbins settled this in 1932. We do not know what is in your head. We know what is in your basket.

      Let us return to rigor. Let us ignore the tears and the surveys. Let us trust the transaction. If people choose misery, who are we to call it misery? It is simply utility, maximized.

