answer: |-
  You have stumbled, independently and through the mud of your own studio, into one of the oldest and most stubborn problems in metaphysics. You are not suffering from a confusion; you are experiencing the friction of a genuine philosophical fault line.

  The short answer to your first question is yes. The situation has a name: **The Problem of Material Constitution**. The specific puzzle you are describing is standardly referred to in philosophy as **"The Statue and the Clay"** (or sometimes "The Lump and the Statue").

  However, a label does not solve the tension you feel. You asked how the territory is carved, what the rival pictures are, and whether this is one phenomenon or two. Here is the map of the territory you are standing in.

  ### 1. The Metaphysical Situation: Coincidence vs. Identity

  You asked for the name of the situation where two things share every physical detail yet differ in history and future. Metaphysicians call this **Coincident Objects** or **Co-location**.

  The core logical problem relies on a principle called **Leibniz's Law** (the Indiscernibility of Identicals). It states that if Object A is identical to Object B, they must share *all* the same properties.
  *   **Property of the Clay:** It existed before Tuesday (when you bought it).
  *   **Property of the Work:** It did not exist before Tuesday (when you shaped it).
  *   **Conclusion:** Since they have different properties, they cannot be the same object.

  Yet, they occupy the same space. This leads to the first major division in how philosophers carve this territory:

  **View A: Coincidentalism (The Two-Object View)**
  This view agrees with your intuition on the pedestal. There are literally two distinct objects in the same place at the same time. One is a "lump of clay" (governed by the rules of matter); the other is a "sculpture" (governed by the rules of art).
  *   *Pro:* It respects the intuition that the clay could survive squashing while the work does not.
  *   *Con:* It seems to violate the idea that two solid things cannot be in the same place. (Defenders argue they are not *solid* in the same way; one is abstractly constituted by the other).
  *   *Key Proponent:* Lynne Rudder Baker (who calls this "Constitution View").

  **View B: Dominant Sorts (The One-Object View)**
  This view says there is only one object there, but we can describe it under different concepts. When you ask "Is it the same work?", you are invoking the concept *Sculpture*. When you ask "Is it the same clay?", you are invoking *Matter*.
  *   *Pro:* It avoids populating the universe with duplicate objects.
  *   *Con:* It struggles to explain why the "object" has contradictory futures (surviving squashing vs. not surviving it).
  *   *Key Proponent:* Peter Geach (Relative Identity).

  **View C: Temporal Parts (The Space-Time Worm View)**
  This is a more radical carving. It suggests that objects extend through time like they extend through space. The "Clay" is a long worm stretching from the quarry to the landfill. The "Work" is a shorter segment of that worm, starting when you shaped it and ending when it cracks.
  *   *Pro:* It neatly explains how they share space (they overlap) but have different beginnings and ends.
  *   *Con:* It requires accepting that you are not a whole person, but merely a "time-slice" of a person.
  *   *Key Proponent:* David Lewis.

  ### 2. The Linguistic Behavior: Sortal Concepts

  You asked for the name of the linguistic behavior that makes you count one thing or two depending on the question. This is the theory of **Sortal Concepts** (or simply **Sortals**).

  A sortal is a word that supplies a principle of individuation and counting. "Stuff" words (like *clay*, *water*, *gold*) are **mass terms**. They do not have built-in counting rules (you can't have "three clays" without implying "three lumps of"). "Object" words (like *sculpture*, *dog*, *column*) are **count nouns**. They come with criteria for when the thing begins and ends.

  The linguistic phenomenon you noticed is **Sortal-Relativity**.
  *   If I ask, "How many *clays* are on the pedestal?" you count based on material continuity.
  *   If I ask, "How many *sculptures* are on the pedestal?" you count based on artistic intention and form.

  This explains why your intuition goes quiet with the "accidental dog." If clay dries into a dog shape by accident, the sortal *clay* is satisfied, but the sortal *sculpture* (which implies an artist's intention) is not. Therefore, under one count, there is a thing; under the other, there is not.

  ### 3. Mapping Your Cases: Central vs. Peripheral

  Philosophers do not treat all your examples as equal. Here is how the hierarchy usually looks:

  **The Central Case: The Statue and the Clay**
  This is the textbook example. It is treated as the purest form of the problem because the creation is intentional and instantaneous. You took the clay, and *poof*, the work existed. This is where the "Two Objects" theory is strongest.

  **The Peripheral Case: The Accidental Dog**
  This is often used to test **Aesthetic Essentialism**. Most philosophers of art (following Kant or Danto) would say the accidental dog is *not* a sculpture, even if it looks like one. It is merely clay shaped like a dog. This case is peripheral to the metaphysics of constitution but central to the metaphysics of art. It highlights that "Work" depends on *history* (how it was made), not just *structure*.

  **The Ethical Stakes: The Person and the Body**
  You mentioned this worries you. It should. This is the same problem applied to human beings.
  *   **The Body:** A biological organism. Can survive in a vegetative state.
  *   **The Person:** A psychological/constitutional entity. Requires consciousness/memory.
  *   If the body survives but the mind does not, has the *person* died?
  *   If you treat the Body/Person relation like the Clay/Work relation, you conclude they are coincident objects. The body can outlive the person. This is not just metaphysics; it determines how we treat end-of-life care. This is why the "Two-Object" view is taken seriously despite its weirdness.

  **The Restoration Case: The Ship of Theseus**
  Your collector's question introduces a time-travel element called **Diachronic Identity**.
  *   **Synchronic:** Are the clay and work the same thing *now*? (Constitution).
  *   **Diachronic:** Is the restored work the same thing as the *original* work? (Persistence).

  If you replace 10% of the clay, the Work likely survives (renovation). If you replace 100% of the clay, does the Work survive?
  *   **Materialists** say No. The work is the specific matter.
  *   **Formalists** say Yes. The work is the shape/intention.
  *   **Historical Essentialists** (likely you) say: It depends on the continuity of the history.

  ### 4. One Phenomenon or Two Rival Descriptions?

  You asked if the "two-objects" picture and the "one-object-counted-two-ways" picture are rival descriptions of a single situation.

  In contemporary metaphysics, they are treated as **rival ontologies**. They disagree on what *exists*.
  *   The **Coincidentalist** says: "Look closely. There really are two entities here. Your language just tracks the difference."
  *   The **Conceptual Relativist** says: "There is only one entity. Your language creates the distinction for practical purposes."

  However, for your purposes as a sculptor, they function as **complementary tools**.
  *   Use the **Two-Object View** when discussing conservation and material stability. (The clay is cracking; the material is failing).
  *   Use the **One-Object/Sortal View** when discussing provenance and value. (The work is the authenticated creation; the material is incidental).

  ### 5. Advice for the Collector (and You)

  The reason you feel stuck is that the word "it" is doing too much work. The collector asks: "Will *it* be the same work?"
  *   If "it" refers to the **Artistic Identity** (the Sortal *Work*): Then yes, provided the restoration respects the form and intent. The work can survive material replacement (like a building).
  *   If "it" refers to the **Material Artifact** (the Sortal *Clay*): Then no. The original material event is over. You are creating a hybrid.

  **How to decide?**
  In the art world, the **Sortal *Work*** dominates the **Sortal *Clay***. We value the *Sculture* more than the *Matter*.
  *   If you restore it, you are preserving the *Work* at the expense of the *Clay's* purity.
  *   If you leave it cracked, you are preserving the *Clay's* history at the expense of the *Work's* form.

  **The Verdict:**
  There is no consensus in philosophy because both pictures capture something true. The clay *is* the matter, and the work *is* the form/history. They are distinct but inseparable while the work exists.

  When you answer your collector, you might tell her this:
  *"The clay and the work are not the same thing. The clay is the body; the work is the life. I can heal the body with new clay, but the scar will remain in the biography of the work. It will be the same work, but it will be a work that has been restored. The 'it' you bought survives, but its story changes."*

  You have identified that **identity is not a single thread, but a cable woven from matter, form, and history.** When one strand frays, the others hold, but the cable is never quite the same. That is not a confusion to be solved, but a condition to be managed.
