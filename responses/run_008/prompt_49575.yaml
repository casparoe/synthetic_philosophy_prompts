answer: |-
  Your hypothesis that the camps are answering different questions is astute, but it requires a slight adjustment to fully diagnose the impasse. It is not strictly that Camp One is doing metaphysics and Camp Two is doing normative theory; rather, both are doing normative theory, but they disagree on whether the metaphysical distinction *grounds* the normative one. Camp One argues that the causal structure of agency (the metaphysics) generates agent-relative constraints (the normativity). Camp Two argues that moral weight supervenes on intentions, outcomes, or duties, rendering the causal structure inert. When they talk past each other, it is because Camp One points to the *structure* (Trolley) as proof of the constraint, while Camp Two points to the *equivalence* (Bathtub) as proof that the structure is irrelevant.

  This is where your "undertow" about positive and negative duties becomes the substantive engine of the deadlock. The Doing/Allowing Distinction (DAD) is often a proxy for a deeper conflict about the stringency of agent-relative constraints versus agent-neutral duties. Camp One is typically defending a deontological view where violating a negative duty (harming) is strictly worse than violating a positive duty (aiding). Camp Two is often pushing toward a consequentialist or unified duty view where the outcome or the intention matters more than the causal route. The impasse persists because neither side can refute the other's paradigmatic cases without abandoning their core normative commitments. Trolley cases protect Camp One's intuition about constraints; Bathtub cases protect Camp Two's intuition about moral equivalence.

  However, the impasse is not purely substantive; it is also conceptually unstable, which validates the "different questions" angle in a specific way. The bioethics flip you noted is the smoking gun here. In bioethics, withdrawing treatment (a physical action) is often normatively classified as "allowing to die" to preserve its permissibility. This suggests that for many practitioners, "doing" and "allowing" are not metaphysical descriptors but *moral conclusions*. If the classification of the act shifts to match the moral verdict, then debating the DAD is circular: you decide the morality first, then label the act to fit. Quinn's move to relocate the distinction to the agent's will acknowledges this instability; he admits the physics of the movement doesn't matter, only the direction of the will. This concedes that the metaphysical distinction is insufficient, pushing the debate back onto normative ground (intentions vs. consequences).

  Therefore, the debate is stuck because it is fighting on two levels simultaneously. Substantively, it is a proxy war over the existence and strength of agent-relative constraints (your undertow). Conceptually, it is confused because the terms "doing" and "allowing" slide between metaphysical descriptions (movement vs. omission) and normative classifications (permissible vs. impermissible). Progress will not come from new cases, as the existing repertoire (Trolley, Bathtub, Transplant, Bioethics) already maps the conflict perfectly. Progress requires dissolving the DAD as a fundamental category and forcing the groups to argue directly about the source of moral constraints: is it the violation of rights, the direction of the will, or the cost of aid? Until the debate shifts from "Is this doing or allowing?" to "What makes this constraint binding?", the impasse will hold.

  Verdict: mixed
