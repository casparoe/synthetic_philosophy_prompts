  ### Part 5: Limits and Transparency

  **Where the Procedure Stops:**
  1.  **Incommensurability:** If Bargaining fails (Step 4), the procedure stops. We do not have a tie-breaker. Carrying over the budget is the only honest option.
  2.  **Moral Truth:** This procedure does not tell you which moral theory is correct. It does not resolve the disagreement; it **manages** it.
  3.  **Lexical Absolutes:** If a trustee believes that funding *any* of the available proposals is morally forbidden (e.g., all involve some complicity in injustice), this procedure cannot help them. They must resign or exercise a nuclear veto (not modeled here).

  **Candid Statement on "Laundering":**
  You asked whether this procedure resolves disagreement or launders it. **It launders it.**

  Your current weighted vote launders disagreement *opaquely*: it sums up preferences without revealing whether the disagreement is about facts, values, or scaling. It pretends that a "vote" is a measure of truth.

  This procedure launders disagreement *transparently*. It admits that when Track A and Track B diverge, there is no philosophical algorithm to pick the winner. It forces you to look at the divergence and say, "We are choosing this not because it is objectively better, but because we are willing to trade for it."

  **Should you prefer this?**
  Yes. A transparent laundering of disagreement is ethically superior to an opaque one.
  *   **Accountability:** When the Consequentialist sees Deworming rejected, they know it was because the Deontologist's ranking outweighed their intensity, not because the vote was rigged.
  *   **Stability:** By respecting Lexical Vetoes (Step 2), you prevent the minority from feeling that the foundation is actively committing sin, which preserves the long-term viability of the board.
  *   **Honesty:** It forces the committee to acknowledge that allocating $10M is not a math problem. It is a political negotiation between competing moral visions. This procedure provides the parliament for that negotiation, rather than pretending the calculator can do the work.

  **Final Instruction:**
  Print this protocol. Attach the *Individual Scoring Sheet*. At the next meeting, begin by reading the "Candid Statement" aloud. If the trustees are not willing to accept that they are laundering disagreement rather than resolving it, no procedure will save you. If they are, this will make the burden bearable.
