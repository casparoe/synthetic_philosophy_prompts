answer: |-
  ## The Dual-Track Lexical-Parliamentary Protocol

  This procedure is designed for a six-person committee (five trustees, one program officer) operating under a fixed budget ($10M) with deep moral pluralism. It acknowledges that no mathematical aggregation can resolve fundamental disagreements about value standards. Instead, it structures the disagreement to make it visible, respects lexical constraints without granting unilateral tyranny, and triggers explicit bargaining when arbitrary scaling choices would decide the outcome.

  **Pre-Meeting Requirement:** To fit within a two-hour meeting, all trustees must review the 8–12 proposals and complete the *Individual Scoring Sheet* (provided below) prior to arrival. The meeting is for aggregation, validation, and bargaining, not initial evaluation.

  ---

  ### Part 1: The Procedure (120 Minutes)

  #### Step 1: Elicitation of Credences and Weights (15 Minutes)
  *Goal: To record how strongly each trustee holds their view, acknowledging moral uncertainty.*

  1.  **Default Weight:** Each trustee begins with a voting weight of **1.0**.
  2.  **Credence Adjustment:** If a trustee is uncertain about their own moral theory (e.g., the Contractualist is 80% sure contractualism is correct and 20% open to consequentialism), they may adjust their weight downward (e.g., to 0.8). The remaining weight is distributed to the Program Officer to allocate according to the "consensus view" or held in reserve.
  3.  **Recording:** Weights are recorded publicly. (e.g., Trustee A: 1.0, Trustee B: 0.9, etc.). The sum of weights is $W_{total}$.

  #### Step 2: The Lexical Firewall (20 Minutes)
  *Goal: To handle absolute prohibitions at the scoring stage, not the aggregation stage.*

  1.  **Identification:** Each trustee marks any proposal that violates a *lexical constraint* of their theory (e.g., "This uses human subjects without consent," "This funds abortion," "This treats humans as mere means").
  2.  **The Veto Threshold:**
      *   **0 Vetoes:** Proposal proceeds to scoring aggregation.
      *   **1 Veto:** Proposal proceeds but is flagged as "Contested." The vetoing trustee's share of the budget cannot be used for this proposal (see Step 4).
      *   **2 or More Vetoes:** Proposal is **removed** from the pool immediately. No amount of aggregate benefit can override two lexical prohibitions.
      *   **Override:** A proposal with 1 Veto can be restored to "Uncontested" status only by a **5/6 Supermajority vote**. This acknowledges the gravity of a lexical claim without allowing a single trustee to hold the entire budget hostage.

  #### Step 3: Dual-Track Scoring Aggregation (30 Minutes)
  *Goal: To expose the "intertheoretic comparability" problem by running two different aggregation methods.*

  The Program Officer collects the pre-meeting scores. For each non-vetoed proposal, calculate two totals:

  1.  **Track A (Intensity/Cardinal):** Sum of Raw Scores (0–10 scale) $\times$ Trustee Weight.
      *   *Assumption:* A "10" from the Consequentialist is comparable to a "10" from the Deontologist.
  2.  **Track B (Order/Ordinal):** Convert rankings to Borda points (1st = 10 pts, 2nd = 9 pts... Last = 1 pt). Sum of Borda Points $\times$ Trustee Weight.
      *   *Assumption:* Only the order matters, not the magnitude of difference between options.

  **Output:** Two ranked lists of proposals (List A and List B).

  #### Step 4: The Comparability Check & Bargaining Trigger (25 Minutes)
  *Goal: To admit when the scaling choice determines the winner.*

  1.  **Comparison:** Compare the top 3 proposals on List A vs. List B.
  2.  **Consensus:** If the top 3 proposals are identical in rank order on both lists, adopt List A for budget allocation.
  3.  **Divergence:** If the rank order differs (e.g., Deworming is #1 on List A, but #3 on List B), the procedure **stops**. You have entered the "Arbitrary Zone."
  4.  **Bargaining Protocol:**
      *   The committee has 25 minutes to negotiate a "Budget Trade."
      *   Trustees may explicitly trade support: "I will accept the lower ranking of the Rare Disease if the Consequentialist agrees to fund the Animal Lobbying campaign."
      *   **Constraint:** No proposal with 2+ Lexical Vetoes can be bargained for.
      *   **Outcome:** A manual allocation plan agreed upon by simple majority. If no agreement is reached, the budget for the disputed proposals is carried over to the next quarter.

  #### Step 5: Budget Allocation & Conscience Reallocation (30 Minutes)
  *Goal: To finalize the grant list.*

  1.  **Funding:** Fund proposals from the top of the agreed list until the $10M is exhausted.
  2.  **Conscience Reallocation:** If a proposal is funded despite a Trustee's Lexical Veto (the "1 Veto" case), that Trustee's proportional share of the cost (e.g., 1/6th of the grant) is deducted from their "virtual budget" and reallocated to their next highest-ranked non-vetoed proposal.
      *   *Effect:* The foundation funds the project, but the objecting trustee is not morally complicit in the eyes of their own theory.

  ---

  ### Part 2: Honest Treatment of the Comparability Problem

  This procedure does not solve the problem of intertheoretic comparison; it **detects** it.

  *   **The Assumption:** Track A (Raw Scores) assumes that the *intensity* of moral conviction is comparable across theories. This is philosophically dubious. A Consequentialist's "10" (Save 10,000 lives) may represent a vastly larger magnitude of value than a Deontologist's "10" (Keep one promise).
  *   **The Safeguard:** Track B (Ranks) ignores magnitude. It treats all preferences as ordinal.
  *   **The Disclosure:** If Track A and Track B yield different winners, the procedure explicitly declares: *"The outcome depends on an arbitrary choice of normalization."*
  *   **The Fallback:** When this divergence occurs, we do not pretend philosophy dictates the answer. We revert to **Parliamentary Bargaining**. The trustees acknowledge they are not discovering a moral truth but negotiating a modus vivendi. The weights used in bargaining are the Credence Weights from Step 1.

  ---

  ### Part 3: Philosophical Distinctions (Keep vs. Drop)

  To make this workable in two hours, we must simplify the philosophy without losing the core ethical tensions.

  **Distinctions to Keep:**
  1.  **Facts vs. Standards:** Step 1 of the meeting (not detailed above, but implied in pre-work) must separate empirical disputes (e.g., "Will this lobbying campaign work?") from moral disputes (e.g., "Is lobbying corrupt?"). Empirical disputes are resolved by evidence; moral disputes are resolved by the voting procedure.
  2.  **Lexical vs. Ordinal:** We must distinguish between "I prefer A to B" (Ordinal) and "A is forbidden regardless of B" (Lexical). The Lexical Firewall (Step 2) preserves this. Dropping this would violate the Deontological and Religious trustees' core constraints.
  3.  **Complicity vs. Outcome:** The Conscience Reallocation (Step 5) distinguishes between the foundation's action and the individual trustee's moral record.

  **Distinctions to Drop:**
  1.  **Metaphysical Truth:** We do not debate which moral theory is *true*. We treat them as competing stakeholder interests.
  2.  **Intrapersonal Uncertainty:** While we allow credence adjustments, we do not model complex probability distributions over moral theories. A trustee is treated as a proxy for their dominant view.
  3.  **Cardinal Precision:** We do not attempt to calculate "moral utils." The 0–10 scale is treated as a heuristic for intensity, not a rigorous measurement.

  ---

  ### Part 4: Worked Applications

  **Setting:** Budget $10M. 6 Trustees (Equal Weight 1.0 for simplicity).
  **Proposals:**
  1.  **Mass Deworming:** Cost $5M. Benefit: Small health gain for 1M children.
  2.  **Animal Lobbying:** Cost $2M. Benefit: Potential long-term welfare reform. Means: Political lobbying.
  3.  **Rare Disease Treatment:** Cost $5M. Benefit: Saves 5 children from certain death.

  #### Case A: Mass Deworming (The Magnitude Problem)
  *   **Scores:**
      *   Consequentialist: 10 (Huge aggregate benefit).
      *   Prioritarian: 8 (Helps the poor, but benefits are small per person).
      *   Deontologist: 5 (Permissible, but treats humans as numbers).
      *   Religious: 5 (Permissible).
      *   Contractualist: 6 (Reasonably acceptable).
      *   Program Officer: 8.
  *   **Track A (Raw):** Total 42. Rank: #1.
  *   **Track B (Rank):** Consequentialist ranks it #1. Others rank it #3 or #4 (preferring Rare Disease). Average Rank: #3.
  *   **Result:** Divergence. Track A funds it; Track B rejects it.
  *   **Procedure Action:** Trigger Bargaining. The Consequentialist must trade support for the Rare Disease to secure Deworming.
  *   **Unpalatable Outcome:** The Bargaining fails. The committee defaults to Track B (Ordinal). Deworming is **rejected**. The Consequentialist must accept funding a less "efficient" project to maintain committee cohesion.

  #### Case B: Animal Lobbying (The Lexical Problem)
  *   **Scores:**
      *   Consequentialist: 9.
      *   Prioritarian: 7.
      *   Contractualist: 4 (Uncertain if animals count).
      *   Deontologist: **VETO** (Lobbying is corrupting/lying).
      *   Religious: **VETO** (Interfering with divine order of species).
      *   Program Officer: 6.
  *   **Procedure Action:** Step 2 (Lexical Firewall). Two Vetoes recorded.
  *   **Result:** Proposal is **removed from the pool** immediately.
  *   **Unpalatable Outcome:** The Consequentialist and Prioritarian are forced to accept that a high-benefit project is ineligible. The procedure respects the lexical constraints of the minority over the aggregate benefit of the majority.

  #### Case C: Rare Disease Treatment (The Comparability Problem)
  *   **Scores:**
      *   Consequentialist: 4 (Too expensive per life saved).
      *   Prioritarian: 10 (Helps the worst-off).
      *   Deontologist: 9 (Duty to rescue identifiable lives).
      *   Religious: 9 (Sanctity of life).
      *   Contractualist: 8.
      *   Program Officer: 7.
  *   **Track A (Raw):** Total 37.
  *   **Track B (Rank):** Consequentialist ranks it #4. Everyone else ranks it #1 or #2. Average Rank: #1.
  *   **Result:** Divergence. Track A (weighted by intensity) might favor Deworming. Track B (weighted by consensus order) favors Rare Disease.
  *   **Procedure Action:** Trigger Bargaining.
  *   **Likely Outcome:** The committee funds the Rare Disease. The Consequentialist is outvoted on the *magnitude* of the good, but the procedure makes it clear *why*: the group prioritized ordinal consensus over cardinal intensity.

