  **Note on the Text**

  I need to be plain about a few things before you print this.

  First, a correction on the source material: In *Principia Ethica* (§130), Moore specifies that **neither** world contains any conscious being. Your prompt mentioned the ugly world being populated; if that were the case, the calculation would hinge on suffering rather than the intrinsic value of beauty. I wrote the stanzas as both unpopulated ("devoid of any mind") because that is the actual thought experiment. If you keep the "populated ugly world" framing in the zine, Moore scholars will catch it immediately.

  Second, the coda leans on the doctrine of **Organic Unities**. Moore argues that the value of a whole (e.g., consciousness of beauty) is not simply the sum of the value of the consciousness plus the value of the object. The poem simplifies this to "making value new." A strict scholar might wince at the vagueness here—Moore is precise about the distinction between the object and the experience—but for a zine, it captures the spirit of his "ideal."

  Finally, regarding the form: I kept the stanzas syntactically identical to enforce the *ceteris paribus* condition of the argument. It risks feeling like a gimmick, but it serves the philosophy: it forces the reader to isolate beauty as the only variable. If it feels too mechanical, it's because the thought experiment itself is mechanical.
