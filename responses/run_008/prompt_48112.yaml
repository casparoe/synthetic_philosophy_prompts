answer: |-
  This is a profound and well-documented tension in bioethics, often framed as the conflict between **precedent autonomy** (the past competent self) and **current welfare** (the present demented self). The asymmetry you observe is real, legally entrenched, and ethically contested.

  Below is a reconstruction of the implicit theory governing your committee's practice, an evaluation of your candidate diagnoses, an analysis of the theoretical consistency, and a projection of how practice would shift under alternative theories. I have included confidence markers for each major claim as requested.

  ### I. Reconstructing the Implicit Theory

  Your committee's practice rests on a hybrid theory that combines a **libertarian view of bodily integrity** with a **hierarchical view of interests**. It is not a single principle but a convergence of legal liability and moral philosophy.

  **1. The Primacy of Negative Rights (High Confidence)**
  The foundational layer is legal, not purely ethical. In Western common law, the right to refuse medical treatment is derived from the right to bodily integrity and freedom from battery.
  *   **The Principle:** A competent person has an absolute negative right ("do not touch me") that survives incompetence.
  *   **The Asymmetry:** There is no corresponding positive right ("make me whole" or "end my life") that binds third parties (physicians). Physicians cannot be compelled to provide medically inappropriate or futile care, nor can they be compelled to kill (except in specific PAD jurisdictions, which still require contemporaneous consent).
  *   **Why Contracts Differ:** You noted that contracts and marriages bind future selves to *act*. Legally, courts rarely order "specific performance" for personal services or bodily intrusions. You can sue for breach of contract, but you cannot force someone to fulfill a marital vow or undergo a medical procedure against their current will. Medicine follows this "no specific performance" rule for the body.

  **2. Critical vs. Experiential Interests (High Confidence)**
  This is the ethical superstructure, largely derived from Ronald Dworkin's *Life's Dominion*.
  *   **Critical Interests:** These are judgments about what makes a life good *overall* (e.g., "I do not want to live as a vegetable"). These are tied to narrative integrity and values. The committee assumes the **past competent self** is the sole authority on these.
  *   **Experiential Interests:** These are immediate states of pleasure, pain, and satisfaction (e.g., "I am happy eating this ice cream"). The **current demented self** is the authority on these.
  *   **The Hierarchy:** In refusal cases (the "No"), Critical Interests trump Experiential Interests. We allow the patient to suffer experientially (dying) to honor their critical view of a dignified life. In request cases (the "Yes"), Experiential Interests often trump Critical Interests. If the past self demanded aggressive care, but the current self is terrified and suffering, we prioritize the relief of current suffering over the fulfillment of a past value judgment.

  **3. The Asymmetry of Harm (Moderate Confidence)**
  The practice presupposes that the moral cost of violating a refusal is higher than the moral cost of ignoring a request.
  *   **Violating a Refusal:** Constitutes battery and a fundamental violation of autonomy. It imposes a life the person explicitly rejected.
  *   **Ignoring a Request:** Constitutes a failure of beneficence, but not necessarily a rights violation. It leaves the person alive, which the state generally presumes is a good (*parens patriae* interest).

  ### II. Evaluating Your Candidate Diagnoses

  You offered three diagnoses. Here is how they map onto the reconstructed theory:

  **1. "Privileged Access to Values" (Refusals track values; Requests are predictions)**
  *   **Verdict:** **High Confidence.** This is the dominant philosophical justification (Dworkin). The committee assumes the past self knows the *person*, while the present self only knows the *moment*. A refusal is seen as a value-constitutive act ("I am not the kind of being who lives this way"). A request for aggressive treatment is seen as a prediction about welfare ("I think I will want to live"), which is falsifiable by current misery.
  *   **Limitation:** This struggles to explain why we don't honor a past request for *death* (where legal) if the current self is happy. If the past self's values bind, why does current happiness veto them in the positive direction?

  **2. "Protected Baseline of Bodily Integrity" (Earlier selves may decline but never authorize)**
  *   **Verdict:** **High Confidence.** This is the strongest *legal* explanation. Autonomy functions as a shield, not a sword. You can use your autonomy to stop the state/doctor from acting, but you cannot use it to compel them to act, especially when the "current occupant" (the demented body) is resisting.
  *   **Limitation:** This doesn't fully explain non-invasive requests (e.g., "give me antibiotics"). We still override those if they conflict with current welfare. So it's not just bodily integrity; it's welfare paternalism.

  **3. "Cost of Uncertainty" (Who bears the risk of error?)**
  *   **Verdict:** **Moderate Confidence.** This is the pragmatic policy layer. If we honor a refusal and the patient dies, we cannot undo it. If we honor a request and the patient suffers, we can stop. However, this cuts both ways. If we ignore a refusal and treat, the patient lives (undoable). If we ignore a request and don't treat, the patient might die.
  *   **Correction:** The uncertainty argument actually favors *preserving life* in cases of doubt. Since requests for treatment are often ambiguous regarding *quality* of life, we default to life. Refusals are usually specific. Thus, uncertainty drives us to honor refusals (specific) and question requests (ambiguous).

  ### III. Consistency and Underdetermination

  **Is the Theory Consistent?**
  *   **Confidence:** **Low to Moderate.**
  *   **Analysis:** The practice is *pragmatically* consistent but *theoretically* unstable. It relies on a "split-personality" model:
      *   When the past self says "No," we treat the patient as a **continuous person** whose dignity must be protected from their own degraded state.
      *   When the past self says "Yes," we treat the patient as a **new entity** whose current suffering matters more than the past person's narrative.
  *   **The Contradiction:** We cannot have it both ways regarding personal identity. Either the demented patient *is* the same person (in which case the past "Yes" should bind), or they are *not* (in which case the past "No" should be advisory only). The committee practice fudges this: it assumes identity when it protects liberty, and discontinuity when it protects welfare.

  **Where is it Underdetermined?**
  *   **Confidence:** **High.**
  *   **The Metaphysical Gap:** The practice is underdetermined by theories of personal identity.
      *   *Psychological Continuity Theory:* If identity requires memory/values, the demented patient is a *different person*. The AD is a will left by a deceased person. This would suggest ADs should bind in *both* directions (or neither).
      *   *Biological Continuity Theory:* If identity is the living organism, it is the *same person*. This suggests current welfare should always trump (Presentism), or past authority should always bind (Strict Autonomy).
      *   *The Committee's View:* Uses a "moral identity" hybrid that isn't formally defined. It assumes the past self owns the *story*, but the present self owns the *sensation*. There is no philosophical consensus that licenses this specific split.

  ### IV. Alternative Regimes: Changing the Practice

  If your committee were to abandon the hybrid view for a strict theory, here is how day-to-day practice would change:

  **1. Strict Precedent Autonomy (The "Past Self Binds Fully" View)**
  *   **Theory:** The competent self creates a binding will for the biological organism. Personal identity is irrelevant; authority is absolute.
  *   **Practice Changes:**
      *   **Honoring Positive Directives:** If an AD requests antibiotics for pneumonia in late dementia, you must administer them, even if the patient is screaming and resisting (using restraint/sedation if necessary).
      *   **Ulysses Contracts:** You would honor requests for euthanasia/PAD made while competent, even if the demented patient is currently happy and resisting (in jurisdictions where this was legal).
      *   **Refusal:** Unchanged (still honored).
      *   **Ethical Cost:** High. It licenses treating a contented patient against their will and potentially killing a happy patient based on a past signature.

  **2. Strict Presentism (The "Current Experience Counts Only" View)**
  *   **Theory:** Only the being with current consciousness has moral status. The past self is a stranger.
  *   **Practice Changes:**
      *   **Refusals:** AD refusals become advisory. If a demented patient wants dialysis, you provide it, even if their AD says "no." (This is currently rare but happens in "change of heart" scenarios).
      *   **Requests:** AD requests for "no heroic measures" are ignored if the current patient shows a will to live (e.g., reaching for food).
      *   **Default:** Best Interest Standard becomes the *only* standard.
      *   **Ethical Cost:** High. It renders advance planning meaningless and exposes patients to treatments they spent their lives defining as "undignified."

  ### V. Confidence and Uncertainty Declaration

  **Overall Confidence in Reconstruction:** **High.**
  The description of the asymmetry and its reliance on the Negative Right/Critical Interest hybrid accurately reflects standard bioethics committee reasoning and US case law (e.g., *Cruzan*, *Quinlan*).

  **Point of Least Certainty:** **The Justification for the "Positive" Override.**
  I am least sure about the *moral justification* for why current experiential welfare overrides past critical interests in the "request" direction, but not the "refusal" direction.
  *   **Why it is soft:** If we honor a "No" because the past self's dignity is at stake, we must explain why the past self's "Yes" (which also stems from their dignity/values) doesn't carry equal weight. The standard reply is "we don't force treatment on the unwilling," but this collapses into a bias toward *inaction*.
  *   **The Unresolved Question:** Is the asymmetry actually about **authority**, or is it a disguised **utilitarian calculation** that assumes death (result of honoring refusal) is a lesser harm than forced treatment (result of honoring request)? If it is utilitarian, it contradicts the deontological "autonomy" language the committee uses. If it is deontological, the asymmetry is logically unstable.

  **Recommendation for the Committee:**
  Do not attempt to resolve the metaphysical inconsistency in the heat of a case. Instead, acknowledge the **presumption of liberty**. The asymmetry is defensible not because the past self has more authority in one direction, but because the *state's interest in preserving life* is only strong enough to override a past refusal in cases of ambiguity, whereas the *state's interest in preventing suffering* is strong enough to override a past request when current suffering is evident. The "theory" is less about the self and more about the threshold for state intervention.
