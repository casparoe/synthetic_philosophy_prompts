answer: |-
  ### Instructor's Note: Pedagogical Pushback & Case Coherence

  **Is the tree format wrong?**
  Strictly speaking, yes. Personal identity intuitions are often non-transitive (e.g., A=B, B=C, but A≠C in branching cases). A binary tree forces consistency where none may exist. However, for a 300-level seminar, this inconsistency *is* the lesson. I have designed the tree below not as a definitive classifier, but as a **debugging tool**. The value lies in the "Contradiction Check" section at the end, where students realize their gut answers violate logical transitivity.

  **Case Coherence Warning:**
  Your "Parallel Upload" case (swapped neurons running in parallel) assumes functional modules can sustain consciousness independently. A single neuron cannot. I have phrased Node 3 as "functional modules" to keep it coherent without bogging down in neuroscience.

  **Indistinguishable Leaves:**
  As you suspected, **Strict Patternism** and **Parfitian Deflationism** occupy nearly the same space. They only diverge on the *conceptual stakes* of the Partial Upload case (Node 5). I have flagged this in the Key.

  **Unoccupied Seats:**
  There is a logically possible but philosophically "dead" combination: accepting the Copy as *you* when the Original survives, but denying the Copy is *you* when the Original is destroyed. This implies your existence depends on extrinsic facts (what someone else is doing) rather than intrinsic facts. I have marked this as incoherent in the Key.

  ***

  # HANDOUT: MAP YOUR INTUITIONS
  **Course:** PHIL 300 Metaphysics | **Unit:** Personal Identity & Uploading

  **Instructions:** Do not worry about philosophical labels (e.g., "Lockean," "Animalist"). Answer based on your gut intuition about what *you* would experience. If a question asks "Is it you?", answer "Yes" only if you would anticipate waking up in that body or feel it is the *same* person as you are now.

  ### THE DECISION TREE

  **NODE 1: THE SHIP OF THESEUS BRAIN**
  *Scenario:* We replace your neurons with functionally identical silicon chips one by one over six months. You stay awake and talk to us the whole time. At the end, your brain is 100% silicon, but your memories and personality are unchanged.
  **Q:** When the process finishes, is the person in the chair **you**?
  *   **NO:** → Go to **LEAF A**
  *   **YES:** → Go to **NODE 2**

  **NODE 2: THE DEEP FREEZE**
  *Scenario:* Your mind is scanned and paused. The process stops completely for 10 years (no activity, no time experience). Then it is restarted bit-for-bit.
  **Q:** When the process restarts, is the person waking up **you**?
  *   **NO:** → Go to **LEAF B**
  *   **YES:** → Go to **NODE 3**

  **NODE 3: THE TWIN PARADOX**
  *Scenario:* We scan you non-destructively. The Original You goes home and lives for 20 more years. The Copy wakes up in a lab *today* with all your memories up to this moment.
  **Q:** Is the Copy in the lab **you**?
  *   **NO:** (Because there can't be two of me.) → Go to **NODE 4**
  *   **YES:** (Because psychology is what matters.) → Go to **NODE 5**

  **NODE 4: THE TELETRANSPORTER**
  *Scenario:* Same as Node 3, but the Original You is destroyed during the scan. Only the Copy wakes up.
  **Q:** Is the Copy **you**?
  *   **NO:** → Go to **LEAF C**
  *   **YES:** → Go to **LEAF D**

  **NODE 5: THE FADED PHOTOGRAPH**
  *Scenario:* The Upload is successful, but due to data corruption, it lacks 40% of your episodic memories (gaps in your life narrative). It has your personality and skills.
  **Q:** Is this Upload **you**?
  *   **NO:** (Identity is all-or-nothing; the pattern is broken.) → Go to **LEAF E**
  *   **YES:** (Connectedness comes in degrees; "I" survive enough.) → Go to **LEAF F**

  ---

  ### THE LEAVES: WHAT YOUR ANSWERS IMPLY

  **LEAF A: The Biological Anchor**
  *   **Your View:** You go where your organism goes. Changing the physical stuff destroys you, even if the mind continues.
  *   **Philosophical Label:** **Biological Animalism.**
  *   **Implication:** All uploading is death. The "person" who wakes up is a new being with your memories.

  **LEAF B: The Continuous Stream**
  *   **Your View:** You survived the brain swap (Node 1), but not the gap (Node 2). You require an unbroken chain of conscious process.
  *   **Philosophical Label:** **Continuous Process View.**
  *   **Implication:** Gradual uploading is safe; "scan-and-instantiate" or freezing is death.

  **LEAF C: The Strict Identity Keeper**
  *   **Your View:** You rejected the Twin (Node 3) because identity can't branch. You also rejected the Teletransporter (Node 4) because the original died.
  *   **Philosophical Label:** **Strict Identity / Non-Branching Psychological Continuity.**
  *   **Implication:** Uploading is only survival if it's gradual (Node 1) and unique. If a copy exists, neither of you is the original.

  **LEAF D: The Best Candidate**
  *   **Your View:** You rejected the Twin (Node 3) because two people can't be one. But if the Original dies (Node 4), the Copy becomes the "best candidate" for you.
  *   **Philosophical Label:** **Conventionalist / Best Candidate View.**
  *   **Implication:** Identity depends on there being no competitors. Your survival depends on what happens to *other* people.

  **LEAF E: The Strict Patternist**
  *   **Your View:** Substrate doesn't matter (Node 1), gaps don't matter (Node 2), branching doesn't matter (Node 3). But the *pattern* must be complete.
  *   **Philosophical Label:** **Strict Pattern Identity.**
  *   **Implication:** Uploading is survival, but data corruption kills you. Identity is binary: either the pattern matches, or it doesn't.

  **LEAF F: The Deflationist**
  *   **Your View:** You said "Yes" to almost everything, including the incomplete upload. You care about psychological connection, not strict "sameness."
  *   **Philosophical Label:** **Parfitian Deflationism.**
  *   **Implication:** "Identity" is the wrong question. What matters is *Relation R* (psychological connectedness). Survival comes in degrees.

  ---

  ### CONTRADICTION CHECK (Do this in class)

  1.  **The Transitivity Trap:** If you answered **YES** to Node 3 (Twin is me) and **YES** to Node 1 (Swap is me), logic demands the Twin and the Swapped-Brain are the same person. But they are two different bodies. Does your intuition break here?
  2.  **The Extrinsic Trap:** If you answered **NO** to Node 3 but **YES** to Node 4, you believe whether *you* survive depends on whether *someone else* (the Original) is alive elsewhere. Does your existence really depend on facts outside your own skin?

  ***

  # INSTRUCTOR'S KEY & LOGICAL SPACE MAP

  ### 1. Indistinguishable Leaves (The Patternist/Parfitian Overlap)
  **Leaves E and F** are functionally identical regarding *survival* in standard cases. Both accept uploading. Both accept branching (Node 3).
  *   **The Split:** They only diverge at Node 5 (Partial Upload).
  *   **Leaf E (Patternist):** Treats identity as a binary switch. If the pattern is degraded, identity is lost.
  *   **Leaf F (Parfitian):** Treats identity as a vague concept. If the pattern is degraded, *connectedness* is reduced, but "survival" still obtains to a degree.
  *   **Pedagogical Note:** In a binary tree, these two look the same until Node 5. Emphasize to students that Leaf F is not saying "Yes, that's me," but rather "The question 'Is that me?' has no precise answer, and that's okay."

  ### 2. Unoccupied Combinations (The "Dead" Zones)
  There is a combination of answers no coherent philosophical position endorses:
  *   **The Combination:** **YES** to Node 3 (Twin is me) **BUT NO** to Node 4 (Teletransporter is not me).
  *   **Why it's empty:** This implies that whether the Copy is *you* depends extrinsically on whether the Original survives. If the Copy is psychologically continuous with you, why does the Original's existence negate that?
  *   **Status:** **Incoherent.** This violates the "Intrinsicness Principle." If you find a student here, challenge them: "Did you die because the machine worked too well?" This is a prime term paper topic (The Extrinsic Determination Problem).

  ### 3. Missing Leaf (Added for Logical Completeness)
  **Leaf C (Strict Identity)** covers the "Non-Branching" view, but there is a subtle variant often missed: **The Dualist-Survivalist.**
  *   **Why it's not in the tree:** A substance dualist (soul theorist) would answer **NO** to Node 1 (Swap), **NO** to Node 2 (Freeze), and **NO** to Node 4 (Teletransporter). They land on **Leaf A (Biological)** behaviorally, but for metaphysical reasons (the soul stays with the body/brain, not the pattern).
  *   **Note:** I did not create a separate leaf for this because the *practical implications* for uploading are identical to Animalism. However, if a student argues "The brain matters because it houses the soul," move them from Leaf A to a "Substance Dualist" footnote.

  ### 4. Case Coherence Note (Parallel Upload)
  You requested the "swapped neurons run in parallel" case. I integrated this into **Node 1** (Gradual Replacement).
  *   **Refinement:** To make this a branching test (as you intended), ask the student at Node 1: "If we kept the old neurons alive in a vat as we swapped them, would *that* vat-brain be you too?"
  *   **If Yes:** They are a Parfitian (Leaf F).
  *   **If No:** They are a Best Candidate or Strict Identity view (Leaf D or C).
  *   **Warning:** This assumes "chunks" of neurons can sustain consciousness. If a student objects that a neuron isn't a person, acknowledge the objection but insist they answer for the sake of the functional argument.

  ### 5. Why the Tree Format Strains Here
  The tree forces a path. Real intuitions are often: "Node 1 Yes, Node 2 Yes, Node 3 No, Node 4 Yes."
  *   This path leads to **Leaf D (Best Candidate)**.
  *   However, many students feel Node 3 No and Node 4 No (Leaf C).
  *   The "Contradiction Check" is essential. If a student answers Node 3 No and Node 4 Yes, they have accepted that identity is determined by *competition*. This is a stable but counter-intuitive position (Conventionalism). Ensure they realize that's what they've signed up for.
