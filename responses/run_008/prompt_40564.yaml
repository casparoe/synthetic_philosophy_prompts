answer: |-
  There is no single, universally standardized term in political science or memory studies that captures this exact configuration. While adjacent concepts exist, none isolate the specific triad you describe: decisive termination, retroactive purification of internal strife, and the functional superiority of the cause *because* it never had to govern.

  Below is an analysis of the near-misses, followed by a precise coinage and definition suitable for your theoretical framework.

  ### Nearby Concepts and Why They Fail

  1.  **The Lost Cause:** As you noted, this is the archetype, not the category. It is historically bound to the U.S. Confederacy (and derivatively, similar movements). Using it as a general term risks conflating the specific racial and sectional dynamics of the American South with the structural mechanics of nationalist memory elsewhere (e.g., Serbia, Israel, Ireland).
  2.  **Political Martyrdom:** This concept captures the sanctification of sacrifice but typically applies to *individuals* (e.g., Lumumba, Allende) rather than a polities or movements. Furthermore, martyrdom emphasizes the *act of dying* rather than the *structural benefit of not governing*. A martyr can be vindicated later; your pattern requires the cause to remain permanently unfulfilled to maintain its purity.
  3.  **Founding Trauma (or Constitutive Trauma):** This refers to a violent or painful event that binds a community (e.g., the Holocaust for Israel, the Partition for India/Pakistan). However, trauma focuses on the *wound* and the *pain*. Your pattern focuses on the *sanitization* of the cause's internal politics. A founding trauma can be messy and contested (e.g., debates over the Israeli founding); your pattern requires the erasure of that messiness.
  4.  **Invented Tradition (Hobsbawm):** This describes the ritualization of the past to create continuity. It is a *mechanism* of memory, not a *type* of memory. It does not specify that the tradition must be based on a defeat, nor does it explain why the defeat is functionally superior to victory.
  5.  **Victimhood Nationalism:** This describes an identity formed around suffering. While related, it focuses on the group's status relative to outsiders (the victimizer). Your pattern focuses on the group's relationship to its *own past internal politics* (erasing quarrels, cynicism, and compromise).

  ### The Coinage: Sanctified Defeat

  Since no established term covers the specific dynamic where the *absence of power* preserves the *purity of the ideal*, I propose the term **Sanctified Defeat**.

  #### Definition
  **Sanctified Defeat** is a mode of collective memory in which a political movement or polity, having suffered a decisive and terminal military or political extinction, is retroactively reconstructed as morally unified and ideologically pure. The phenomenon is characterized by three necessary conditions:
  1.  **Terminality:** The defeat must be sufficiently decisive to preclude the cause from ever assuming governing power.
  2.  **Sanitization:** Internal factionalism, material motives, and moral compromises prevalent during the movement's life are erased from memory, while external opposition is cast as the sole source of corruption or evil.
  3.  **Functional Superiority:** The memory of the defeat serves a stronger cohesive function for the descendant community than a victory would have, precisely because the cause never had to confront the compromises of governance.

  #### Boundaries and Constraints

  **1. The Requirement of Temporal Distance**
  Sanctified Defeat requires the defeat to be **old and settled**, not recent or contested. Memory requires a generational turnover to transition from "history" (contested, evidence-based) to "myth" (sacred, identity-based).
  *   *Example:* The Confederacy (1865) achieved Sanctified Defeat by the early 20th century.
  *   *Counter-Example:* The Iraqi Ba'athist regime (2003) or the White Movement in Russia (1920s). These are too recent or politically active; supporters still quarrel over the legacy, and the "grubby motives" are still part of living political debate. Sanctified Defeat requires the "quarrel" to have died out so the "memory" can take over.

  **2. The Vindication Constraint**
  The pattern **does not survive partial or total vindication**. If the cause is later realized (e.g., the movement wins independence decades later), the Sanctified Defeat collapses into standard political history.
  *   *Mechanism:* Victory necessitates governance. Governance necessitates budget allocation, coalition-building, and compromise. These realities reintroduce the "mess" that the defeat had previously scrubbed away.
  *   *Example:* The Easter Rising (1916) initially functioned as a Sanctified Defeat for Irish Republicans. However, once the Republic was established and the Civil War (1922–23) occurred, the "purity" fractured. The cause had to govern, and the "finest hour" became a source of new division.
  *   *Exception:* If the vindication is symbolic rather than political (e.g., cultural recognition without state power), Sanctified Defeat can persist.

  **3. Differentiation from "Noble Failure"**
  A "Noble Failure" is a literary or moral judgment. Sanctified Defeat is a *sociological function*. A cause can be a Noble Failure without serving a community's identity needs (e.g., a forgotten rebellion). Sanctified Defeat requires that the memory be actively *used* to sustain group cohesion in the present.

  ### Theoretical Utility
  Using **Sanctified Defeat** allows you to distinguish between movements that are merely remembered sadly and those that are structurally dependent on their failure. It highlights the paradox that for certain nationalist identities, *success would have been catastrophic* for the mythos, as it would have forced the ideal to confront the real.

  \answer{no established term: Sanctified Defeat}
