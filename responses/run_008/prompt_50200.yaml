prompt: |-
  I'm on the board of a mid-sized environmental nonprofit — call it the Green River Alliance — about $8M a year, 40-ish staff, three regional offices. Our executive director has gotten really into prediction markets lately and wants us to run what she keeps calling a "futarchy pilot" on a decision we already have to make this fall: whether to consolidate the three regional offices into one. Her proposal: we pick a success metric (donor retention at 18 months post-decision), and we run two conditional internal markets — one on the "we consolidate" branch and one on the "we stay as we are" branch — with staff and some long-term volunteers trading on how the metric turns out in each world. Whichever branch prices higher, we commit in advance to doing that. She even has a board member's kid who did market making at a trading firm willing to help seed liquidity, and the finance committee has provisionally okayed maybe $15k in subsidies so the markets aren't completly dead.

  Half the board thinks this is a brilliant way to get honest information out of people who otherwise won't say what they know out loud — everyone knows the regional directors hate the merger, but nobody can actually tell us whether the donors do. The other half thinks it's a mess: 40 traders is barely a market at all, the regional staff whose jobs are literally at stake would be trading in it, and what if the market says consolidate but the staff whose offices close then quietly tank the donor relationships on purpose, so the metric punishes us for following it? And me personally: I like the idea in principle — I've read enough Hanson to think vote on values, bet on beliefs is directionally right for big messy organizations — but I can't shake the feeling it works at the scale where theres thousands of traders and ours would have fewer people than attend our annual gala.

  Draft the memo I'll circulate before the September meeting — approve, reject, or approve with conditions — with reasons the ED could actually respond to rather than generic risk language. Take the strongest version of her side seriously: the information-extraction point is real, and if you think some version of this is worth doing, say which version. But be honest about which parts of the futarchy idea are load-bearing and which ones we'd be dropping by doing it at this scale, and whether whatever we'd end up running still deserves the name or is basically an expensive anonymous survey with extra steps. If you recommend conditions, make them conditions that fix something specific — trading restrictions, excluding interested parties, a different or slower metric — not just cover for the board. And if the honest answer is that the pilot is harmless precisely because it's too small to matter either way, say that too; I'd rather hear it than have us pretend we're testing something we're not.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Board member of a mid-sized environmental nonprofit (Green River Alliance, $8M budget, 40 staff, 3 regional offices).
      *   **Issue:** ED wants to run a "futarchy pilot" to decide on office consolidation (1 vs. 3 offices).
      *   **Proposal:** Conditional internal markets based on donor retention (18 months). Staff/volunteers trade. Higher price wins. $15k subsidy liquidity.
      *   **Board Divide:** Half see it as brilliant information extraction (overcoming political silence). Half see it as a mess (too small, conflict of interest, sabotage risk).
      *   **User's Stance:** Sympathetic to Hanson/futarchy in principle, skeptical about scale (40 traders vs. thousands).
      *   **Task:** Draft a memo for the September meeting (Approve, Reject, or Approve with Conditions).
      *   **Tone/Style:** Specific, actionable, honest about limitations, respectful of the ED's intelligence (no generic risk language), addresses the "is this just a survey?" question.
      *   **Key Constraints:** Conditions must fix specific problems (trading restrictions, metrics, etc.). If it's harmless because it's too small, say that.

  2.  **Deconstruct the Futarchy Proposal:**
      *   *Core Mechanism:* Vote on values (metric), Bet on beliefs (market price).
      *   *Strengths:* Incentivizes truth-telling, aggregates dispersed information, bypasses hierarchy politics.
      *   *Weaknesses (in this context):*
          *   **Scale/Liquidity:** 40 traders is tiny. Market efficiency relies on diverse, independent actors. 40 people know each other.
          *   **Conflict of Interest:** Staff whose jobs are at risk are trading. They have non-financial incentives (job security) that dwarf the $15k subsidy.
          *   **Sabotage/Manipulation:** If "Consolidate" wins, opponents can sabotage donor retention to prove the market right (self-fulfilling prophecy of failure) or punish the decision.
          *   **Metric Lag:** 18 months is too long for feedback. Markets need resolution.
          *   **Validity:** Is the market price reflecting *belief* or *hope/fear*?
      *   **The "Survey" Question:** With such low liquidity and high social pressure, does the price signal add value over a confidential survey? Probably not much, unless incentives are aligned perfectly (which they aren't).

  3.  **Determine the Recommendation:**
      *   *Reject?* Too dismissive of innovation. ED is excited.
      *   *Approve as is?* Dangerous. Conflicts of interest are fatal to market integrity here.
      *   *Approve with Conditions?* This is the sweet spot. It acknowledges the *intent* (information extraction) while mitigating the *risks* (manipulation, conflict).
      *   *Crucial Pivot:* We need to admit this isn't true futarchy. It's a "Decision Market Simulation." We shouldn't bind the board to the result automatically (that's the dangerous part of futarchy). We should use it as *input*, not *command*.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly (Approve with Significant Conditions & Reframing).
      *   **The Core Tension:** Acknowledge the ED's point (information extraction is valuable) vs. the Board's concern (scale/integrity).
      *   **Load-Bearing Analysis (The "Hanson" Check):**
          *   What makes futarchy work? Liquidity, independence, resolution.
          *   What are we losing? We don't have enough traders. We don't have independence (staff are stakeholders).
          *   Conclusion: This is not a market that *decides*; it's a market that *signals*.
      *   **Specific Risks & Mitigations (The Conditions):**
          *   *Conflict of Interest:* Staff in affected regions cannot trade. (Fixes the sabotage/job security bias).
          *   *Binding Nature:* The market is advisory, not binding. (Fixes the "sabotage to prove a point" risk).
          *   *Metric:* 18 months is too long. Need interim metrics or a shorter horizon. Actually, 18 months is okay for *outcome*, but we need to acknowledge the lag. Let's suggest a composite metric or interim check-ins.
          *   *Liquidity:* $15k is fine for a pilot, but acknowledge price volatility won't mean much.
      *   **The "Survey" Question:** Be honest. If we strip out the binding nature and exclude stakeholders, is it just a survey? Yes, but a *incentivized* survey. That still has value (skin in the game).
      *   **Recommendation:** Proceed as a "Decision Market Pilot" (not full futarchy).
      *   **Next Steps:** Define excluded traders, finalize metric, set advisory threshold.

  5.  **Refining the Tone:**
      *   Avoid "Risk Management" speak. Use "Market Integrity" speak.
      *   Show respect for the ED's sophistication (mention Hanson, market efficiency).
      *   Be firm on the "Binding" issue. That is the dealbreaker for true futarchy here.
      *   Address the "Harmless because small" point: It's not harmless if it creates internal discord or false confidence.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest external traders? *Correction:* No, confidentiality issues with nonprofit strategy. Keep internal but exclude conflicted staff.
      *   *Initial thought:* Change the metric to something faster. *Correction:* Donor retention is the actual value. Changing it makes the market irrelevant. Keep the metric, but acknowledge the lag.
      *   *Initial thought:* Make it binding. *Correction:* Absolutely not. With 40 traders and high conflict, binding the board is irresponsible. The ED wants to bind; the board must say "Advisory."
      *   *Key Insight:* The value isn't the *price*, it's the *participation*. Getting people to put "money" (even fake/subsidized) behind their beliefs reveals intensity of belief, which surveys don't.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Memo format? Yes.
      *   Approve/Reject/Conditions? Conditions.
      *   Reasons ED can respond to? Yes (market integrity, not bureaucracy).
      *   Honest about scale? Yes (admit it's not efficient market hypothesis).
      *   Specific conditions? Yes (exclusions, advisory status).
      *   "Harmless" check? Addressed (not harmless if it creates false precision).

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Green River Alliance
  **FROM:** [Your Name], Board Member
  **DATE:** August 24, 2024
  **SUBJECT:** Recommendation on Executive Proposal: "Futarchy Pilot" for Office Consolidation Decision

  ### Executive Summary

  I recommend we **approve the pilot with significant conditions**, specifically reclassifying it from a *binding decision mechanism* to an *advisory decision market*. 

  The Executive Director's core insight is correct: traditional governance often fails to aggregate dispersed information because staff have political incentives to hide bad news. A market mechanism can, in theory, extract that information better than a survey. However, at our scale (40 staff) and with the current stakeholder map (staff trading on their own job security), a binding futarchy model violates the load-bearing assumptions of market efficiency. 

  If we run this as proposed (binding outcome, all-staff participation), we risk creating a conflict-of-interest scandal disguised as innovation. If we run it with the conditions below, we gain a high-fidelity signal on organizational belief without exposing the nonprofit to governance failure or sabotage incentives.

  ### The Load-Bearing Analysis: Where Futarchy Breaks at Scale

  We need to be honest about which parts of Robin Hanson's framework are essential and which we are sacrificing.

  1.  **Liquidity & Independence (The Weak Link):** Efficient markets require diverse, independent actors. We have ~40 traders who know each other, work together, and likely discuss strategy at the water cooler. We are not discovering "truth"; we are aggregating office gossip with financial incentives attached. The $15k subsidy helps liquidity, but it cannot fix the lack of trader independence.
  2.  **The "Skin in the Game" vs. "Job Security" Conflict:** This is the critical failure point. In a standard futarchy, traders risk capital. In our proposal, regional staff at risk of displacement are trading with subsidized house money against a metric that determines their employment. Their non-financial incentive (keeping their office open) dwarfs the financial incentive (winning the trade). They will not trade their *belief*; they will trade their *hope* or actively short the "Consolidate" contract to signal dissent, regardless of the actual donor impact.
  3.  **The Sabotage Vector:** If the market binds us to consolidate, and the displaced regional staff feel the process was illegitimate, they have a rational incentive to underperform on donor retention during the transition to validate their "Short" position or simply to punish the decision. A binding market creates a self-fulfilling prophecy of failure if the losers control the metric.

  ### Is This Just an Expensive Survey?

  If we remove the binding nature and exclude conflicted staff, is this just a survey? 

  **Yes, but a superior one.** 
  A survey measures *opinion*. A market measures *intensity of belief* backed by risk. In a survey, a junior analyst and a Regional Director both check "Agree." In a market, the person who knows something the others don't will bet heavier. Even with low liquidity, the *pricing action* (e.g., if the "Consolidate" stock drops sharply after a specific internal memo is released) gives us information a survey cannot: it tells us which specific pieces of news the organization trusts.

  However, we must admit this is **not** a test of futarchy as a governance model. It is a test of *prediction markets as a consulting tool*. We should not pretend otherwise.

  ### Recommended Conditions

  To make this pilot viable and safe, I propose the following four conditions. These are not bureaucratic hurdles; they are market integrity controls.

  **1. The Market is Advisory, Not Binding**
  *   **Condition:** The Board retains final veto power. The market result serves as a weighted recommendation, not an automatic trigger.
  *   **Reason:** With 40 traders and high internal conflict, we cannot guarantee market integrity. If the market says "Consolidate" but the qualitative data suggests staff revolt will destroy donor relationships regardless of the metric, the Board must be free to intervene. Removing the binding constraint also reduces the incentive for staff to sabotage the metric post-decision to "prove the market right."

  **2. Exclusion of Materially Conflicted Traders**
  *   **Condition:** Staff whose roles are directly eliminated or materially altered by the consolidation (i.e., the three Regional Directors and their direct reports in the closing offices) are ** barred from trading.** They may participate in the "values" vote (selecting the metric), but not the "beliefs" market.
  *   **Reason:** You cannot allow a trader to hold a position that pays out if they lose their job. The conflict is too large. We want the market to reflect the belief of the *organization*, not the survival instincts of the *affected*. We can offer these staff a separate severance/consulting package to align incentives, but they cannot be market makers.

  **3. Metric Resolution & Interim Checks**
  *   **Condition:** While 18-month donor retention is the final metric, we establish interim "snapshot" resolutions at 6 and 12 months with small payouts.
  *   **Reason:** Markets need feedback loops to correct prices. An 18-month blackout period turns this into a lottery ticket, not a trading market. Interim resolutions keep engagement high and allow the "price" to update as new information arrives (e.g., if donor calls drop off in Month 2, the market should reflect that immediately, not wait 16 months).

  **4. Anonymity & Liquidity Guarantees**
  *   **Condition:** All trades must be fully anonymized to the Board and ED until after the decision is made. The $15k subsidy must act as a true market maker (buying and selling at spread), not just a pool of funds.
  *   **Reason:** If staff believe the ED can see who is betting against consolidation, they will not trade honestly. The "kid with the trading firm" needs to structure this so the order book is blind.

  ### The "Harmless" Question

  A counter-argument I've heard is: *"With only $15k and 40 people, does this matter enough to worry about?"*

  **No, it is not harmless.** 
  If we run a binding market that is easily manipulated, and it produces the "wrong" outcome, we undermine trust in the Board's judgment. If staff perceive the market as a rigged game to justify a pre-determined consolidation, morale will tank faster than if we had just decided normally. The reputational cost internally is high, even if the financial cost is low.

  However, if run as an **Advisory Decision Market**, the downside is capped. If the market behaves erratically, we treat it as noisy data. If it behaves efficiently, we get a powerful signal that a survey would never have yielded.

  ### Recommendation

  **Move to approve the "Decision Market Pilot" under the conditions above.**

  We should thank the ED for bringing sophisticated governance innovation to the table. She is right that we need better ways to surface truth. But we must protect the organization from applying a mechanism designed for global, liquid, anonymous markets to a small, political, human-scale nonprofit without guardrails.

  Let's run the pilot to learn about our organization's information flow, not to outsource our fiduciary duty to a market that is too thin to carry that weight.

  **Action Required:**
  Vote to authorize the pilot subject to the "Advisory Status" and "Conflicted Trader Exclusion" clauses. Direct the Finance Committee to structure the $15k subsidy as a market-making fund, not a prize pool.
