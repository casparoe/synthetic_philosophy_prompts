answer: |-
  # Q&A Prep Sheet: Cause-Level Screening Proposal
  **Meeting:** Donor-Advisory Board | **Date:** Next Month
  **Goal:** Approve shift from direct charity ranking to two-stage ITN (Importance, Tractability, Neglectedness) screening.
  **Strategy:** Concede limitations early to build trust; defend the *process* improvement, not the *mathematical perfection*.

  ---

  ### 1. The Methodological Takedown (The Economist)
  **Damage Potential:** **Critical.** If the model is mathematically incoherent, the proposal dies.
  **Likely Arrival:** First (sets the technical tone).

  **The Objection:**
  "You're proposing we replace retrospective data with priors. My concern is endogeneity: causes are often neglected *because* they are intractable or unimportant. Furthermore, 'Importance' isn't commensurable across causes—you can't compare DALYs averted in global health to existential risk reduced in AI. By treating ITN as independent axes, you're just running cost-effectiveness analysis with worse arithmetic and hidden variables. Why discard the charity-level numbers where someone actually measured something?"

  **Concession Up Front:**
  "You're right that ITN isn't a regression model, and 'Importance' is not a universal currency. We cannot perfectly commensurate a life saved today against a catastrophe prevented in 100 years. The old charity-level numbers are also seductive because they look like data, even when they're self-reported."

  **The Reply (2 Minutes):**
  "We aren't discarding data; we are stopping the comparison of apples to orbiters. Under the old system, we implicitly decided that a 10% uncertainty in a malaria bednet report was equivalent to a 90% uncertainty in a policy advocacy win. That's false precision.
  The two-stage process admits that we cannot compare causes directly. The ITN screen is a *filter*, not a calculator. It asks: 'Is this problem big enough to matter if we solve it?' before we ask 'How cheaply can we solve it?' This protects us from funding efficient solutions to trivial problems. Regarding endogeneity: we know neglectedness correlates with difficulty. That's why 'Tractability' is a separate gate. We aren't claiming this is perfect arithmetic; we are claiming it's honest bookkeeping. It forces us to state our value judgments about 'Importance' openly, rather than hiding them inside a charity's self-reported cost-per-outcome."

  **Honest Note on Soft Spot:**
  *I don't have a good answer for the commensurability charge. He is correct that we are comparing incommensurables. My reply relies on the pragmatism of 'honest bookkeeping,' but mathematically, he's right that ITN is often just Expected Value with extra steps. If he presses on the weighting formula for 'Importance,' I have to admit it's subjective.*

  ---

  ### 2. The Consistency Trap (The Donor's Adult Child)
  **Damage Potential:** **High.** Accusations of hypocrisy or cowardice undermine my credibility and the EA brand.
  **Likely Arrival:** Second (once the framework is established).

  **The Objection:**
  "If we apply this framework consistently, existential risk reduction dominates everything else. The expected value is orders of magnitude higher. If we use this ITN screen and *don't* allocate the majority of funds to x-risk, you're admitting the framework is just a aesthetic cover for business-as-usual. Are you flinching? If you are, why should we trust the analysis?"

  **Concession Up Front:**
  "I appreciate the push for consistency. You are correct that a pure, unconstrained expected value calculation heavily favors longtermist interventions. I am not going to pretend the math points elsewhere."

  **The Reply (2 Minutes):**
  "This advisory manages *donor* capital, not theoretical utility. Our mandate includes a risk tolerance and a time horizon defined by our donors' intent, which balances immediate suffering against future catastrophe. A consistent application of the framework *includes* the constraint of 'sustainability of the fund.' If we allocate 90% to high-variance x-risk work, we risk violating our fiduciary duty to preserve capital for ongoing grantmaking.
  We are using the framework to identify *robust* opportunities, not just *maximum* ones. We will fund x-risk work that passes the screen, but we are applying a discount rate for uncertainty and a constraint for portfolio diversification. That isn't dishonesty; it's governance. I'd rather be transparent about those constraints than pretend we are maximizing a single variable we can't actually measure."

  **Honest Note on Soft Spot:**
  *This is the hardest balance. I am effectively admitting we are capping the upside to protect the downside. To a pure EA, this looks like moral cowardice. I'm betting on the Board valuing 'governance' over 'maximization,' but the Child might view this as a betrayal of the EA premise.*

  ---

  ### 3. The Moral Laundering Charge (The Physician)
  **Damage Potential:** **Medium-High.** Alienates the "heart" of the board and risks public reputation.
  **Likely Arrival:** Third (emotional reaction to the abstraction).

  **The Objection:**
  "This framework launders moral choices. You talk about 'Importance' and 'Tractability,' but that's just code for deciding whose lives count. I work in community health. I know that proximity and identifiability matter morally to the people we serve. Your spreadsheet makes it look like a neutral calculation, but it's a choice to value a statistical life over a neighbor we can look in the eye."

  **Concession Up Front:**
  "You are right that no spreadsheet is morally neutral. The current system pretends to be neutral by hiding behind 'cost-effectiveness,' but it still makes choices about whose lives to save. I do not want to erase the moral weight of proximity."

  **The Reply (2 Minutes):**
  "My goal isn't to remove moral judgment, but to make sure we aren't making those judgments by accident. Proximity bias is real; it means we help the loud and the near, not necessarily the needy. This framework forces us to ask: 'Are we helping this community because it's the most good we can do, or just because they are visible?'
  We can—and should—build 'dignity' and 'community agency' into the Tractability score. If an intervention works mathematically but destroys community trust, it fails the screen. I want to keep funding health, but I want to ensure that when we fund health, it's the health intervention that actually moves the needle, not just the one that feels best. We can honor the identifiable victim without ignoring the invisible one."

  **Honest Note on Soft Spot:**
  *He knows I'm spinning. The framework *does* prioritize the statistical over the identifiable by design. I'm promising we can encode 'dignity' into the metrics, but in practice, that's hard to quantify. If we cut a local clinic for a policy win, this reply will ring hollow.*

  ---

  ### 4. The Process & Precedent Worry (The Lawyer)
  **Damage Potential:** **High.** Can block the vote on procedural grounds.
  **Likely Arrival:** Fourth (closing the loop on governance).

  **The Objection:**
  "I've seen a lot of spreadsheets with hidden agendas. This looks like a significant departure from our historical due diligence. You're introducing subjective 'screens' where we used to have objective 'rankings.' How do I audit this? How do I explain to donors that we passed on a 'proven' charity for a 'theoretical' cause without exposing the family to reputational or legal risk?"

  **Concession Up Front:**
  "I understand the concern. Moving from a ranking to a screening process does reduce the appearance of objectivity. It does shift discretion to the committee."

  **The Reply (2 Minutes):**
  "Currently, the 'objectivity' is an illusion. The charity-reported numbers are unaudited and often incomparable. This change doesn't increase discretion; it relocates it from the charity's marketing department to this Board.
  For auditability: we will document the 'Cause Profile' for every approved stream. We won't just say 'we funded X'; we will say 'we funded X because it passed the Importance and Tractability thresholds for Y Cause.' This creates a clearer paper trail of *why* we chose a cause, rather than just *which* charity had the lowest overhead. It protects the family by showing we exercised prudent judgment on the problem space, not just the vendor selection."

  **Honest Note on Soft Spot:**
  *He's right that this increases our liability. If a 'theoretical cause' fails, 'prudent judgment' is a harder defense than 'they had an RCT.' I'm betting on the Board accepting that 'charity-reported data' was never actually safe, but legally, the old way was safer cover.*

  ---

  ### 5. The "Hope Nobody Asks" (The Lawyer's Real Worry)
  **Damage Potential:** **Existential.** Could dissolve the advisory or trigger donor exodus.
  **Likely Arrival:** End of meeting, or in private follow-up.

  **The Question:**
  "Let's be plain. If we adopt this, and we pass on a malaria charity with a proven track record to fund an AI policy group that produces nothing... have we breached our fiduciary duty to the donors who gave under the understanding we were doing 'effective giving' as previously defined? Are we changing the mandate without donor consent?"

  **Concession Up Front:**
  "That is the central risk of this transition. We are interpreting 'effective' more broadly than some donors might expect."

  **The Reply (2 Minutes):**
  "We are not changing the mandate; we are updating the *methodology* to fulfill the mandate. The mandate is 'to do the most good possible,' not 'to fund malaria bednets.' The landscape of effective giving has changed; clinging to old metrics when new evidence suggests cause-level factors dominate is arguably *more* risky.
  However, to mitigate this: we will phase this in. We won't pivot 100% of capital overnight. We will communicate this shift to major donors as an evolution of our due diligence to better capture impact. If a donor fundamentally objects to cause-level screening, we honor their restriction to the old model. We are not forcing this on restricted funds, only on the discretionary pool."

  **Honest Note on Soft Spot:**
  *This is the weakest link. If a major donor feels bait-and-switched, they can sue or leave. My promise to 'phase it in' and 'honor restrictions' is the only safety valve. If the Board feels this is too much risk, I have to be prepared to scale back the proposal to a 'pilot' rather than a full overhaul.*
