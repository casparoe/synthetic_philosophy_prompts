prompt: |-
  i'm a software engineer (zero philosophy background) and i've fallen into the "what even is an emotion" rabbit hole because of a side project: a little game AI companion that's supposed to act emotional — get frustrated when the player ignores it, sulk after losing, warm up over time. my lazy approach is to just have internal state variables that bias its behavior policy, basically a compressed running summary of how things are going that shifts decision weights. but before i commit to that i want to know what I'd actually be claiming, and the philosophy internet tells me there are camps: emotions are judgments, or emotions are perceptions (of your bodily state, or of value out in the world), or emotions are basically raw feelings and the rest is decoration.

  before i go read any camp i want the spec first. write me the desiderata: what any adequate theory of what an emotion is has to get right, where adequacy is relative to my purpose — i want to know whether my state-variable design is leaving out something essential, or whether the camps are fighting about things my artifact could settle. the cases I'd guess are load-bearing: being terrified on a plane while fully judging you're safe (so an emotion can't just *be* a judgment), being moved by fictional characters where nothing is really at stake, the difference between a mood and being angry *at* something in particular, and whether dogs and babies have emotions despite lacking the concepts for judgments. on the science side, whatever the theory is can't contradict stuff like bodily arousal being pretty undifferentiated across emotions, or emotional reactions kicking in before any conscious appraisal. but don't just take my list — say which of these are genuine requirements and which are one camp's prejudice smuggled in as common sense, and flag any pair you suspect can't be jointly satisfied, since thats the part I most want to see. also tell me which single requirement does the most work knocking out candidates, and whether "the theory has to say something clear about artificial systems" is a real desideratum or just me confusing engineering convenience with metaphysics. then very briefly score the judgment camp, the perception camp, and the raw-feelings camp against the list — keep the weight on the criteria, not the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, zero philosophy background, pragmatic, building a game AI companion.
      *   **Goal:** Wants to understand the philosophical landscape of "emotion" to inform their engineering design (state variables vs. something else).
      *   **Specific Task:** Write a "spec" (desiderata) for an adequate theory of emotion *relative to their purpose*.
      *   **Key Constraints:**
          *   Evaluate the user's proposed cases (plane fear, fiction, mood vs. anger, animals/infants).
          *   Evaluate scientific constraints (undifferentiated arousal, speed of reaction).
          *   Distinguish genuine requirements from camp prejudices.
          *   Identify trade-offs/incompatible pairs.
          *   Identify the "killer criterion" (most work knocking out candidates).
          *   Address the "AI requirement" (is it real or engineering convenience?).
          *   Briefly score the three camps (Judgment, Perception, Raw Feelings) against the criteria.
          *   **Tone:** Technical, precise, no fluff, "spec-like," respectful of the engineer's mindset.

  2.  **Deconstruct the "Spec" (Desiderata):**
      *   The user wants to know if their state-variable approach is missing something *essential*.
      *   Essential for *what*? For a game AI companion. This is crucial. A theory of emotion for *humans* might differ from a theory of emotion for *functional agents*.
      *   However, the user asks what an adequate theory of *what an emotion is* has to get right. I need to balance metaphysical adequacy with functional adequacy for the AI.
      *   *Correction:* The prompt asks for desiderata for "any adequate theory of what an emotion is," but notes "where adequacy is relative to my purpose." This implies I need to filter philosophical theories through the lens of "does this help me build a believable agent?"
      *   *Refinement:* Actually, the user wants to know if their design is "leaving out something essential." So the desiderata should be about *capturing the phenomenon of emotion* such that if the AI lacks it, it fails to be "emotional" in the way that matters for the game.

  3.  **Evaluate the User's Cases (Load-Bearing Tests):**
      *   *Plane Fear (Recalcitrance):* Feeling fear while judging safety.
          *   *Status:* Genuine requirement. Shows emotion $\neq$ conscious judgment.
      *   *Fiction (No Stake):* Crying at a movie.
          *   *Status:* Genuine requirement. Shows emotion $\neq$ belief in immediate physical threat.
      *   *Mood vs. Anger (Intentionality):* Diffuse anxiety vs. anger *at* Bob.
          *   *Status:* Genuine requirement. Needs to account for object-directedness.
      *   *Dogs/Babies (Non-Conceptual):* Do they have emotions without language/concepts?
          *   *Status:* Genuine requirement. Shows emotion $\neq$ high-level cognitive proposition.
      *   *Science (Arousal/Speed):* Undifferentiated arousal, fast reaction.
          *   *Status:* Genuine requirement. Constraints on mechanism.

  4.  **Identify Prejudices vs. Requirements:**
      *   *Prejudice:* "Emotions must be conscious." (Many theories say no).
      *   *Prejudice:* "Emotions must be rational/adaptive." (Phobias exist).
      *   *Prejudice:* "Emotions are private/ineffable." (Functionalists disagree).
      *   *User's specific list:* Most are genuine phenomenological constraints.

  5.  **Identify Incompatible Pairs (Trade-offs):**
      *   *Phenomenology vs. Function:* Capturing "what it feels like" (qualia) vs. "what it does" (behavioral bias).
      *   *Cognitive Richness vs. Speed:* Complex appraisal takes time; emotions are fast.
      *   *Intentionality vs. Raw Feel:* Is the anger *about* the insult, or just a sensation of heat?
      *   *The Big One:* **Phenomenal Consciousness (Qualia) vs. Functional Role.** You can simulate the function (state variables) without the feeling. If emotion *is* the feeling, the AI can't have it. If emotion *is* the function, the AI can.

  6.  **The "Killer Criterion":**
      *   What knocks out the most theories *for an engineer*?
      *   It's the **Implementation/Functional Realizability** constraint combined with **Intentionality**.
      *   Actually, for the *philosophical* theories, the killer is usually **Recalcitrance** (Plane case). It kills pure Judgment theories.
      *   For the *Engineer*, the killer is **Phenomenal Consciousness**. If emotions *require* subjective feeling, the project is impossible (or at least, the AI doesn't have them). If emotions are functional states, the project is viable.
      *   *Decision:* The prompt asks which requirement does the most work knocking out *candidates* (theories). That's likely **Recalcitrance** (fear on a plane). It forces a separation between belief/judgment and emotion.

  7.  **The "AI Requirement":**
      *   Is "theory must apply to artificial systems" a real desideratum?
      *   *Philosophical view:* No. Emotions might be biological specific.
      *   *Engineering view:* Yes, otherwise the project is category error.
      *   *Verdict:* It's a **Functionalism Constraint**. It's not a metaphysical truth, but a project requirement. It forces a functionalist definition.

  8.  **Scoring the Camps:**
      *   *Judgment (Stoics/Nussbaum):* Fails Recalcitrance (Plane). Fails Babies/Dogs. Good for Intentionality.
      *   *Perception (Prinz/Damasio - Somatic/Value):* Good on Recalcitrance. Good on Speed/Arousal. Struggles slightly with Fiction (why perceive danger where none is?). Good for Babies.
      *   *Raw Feelings (James/Feeling Theory):* Good on Phenomenology. Fails Intentionality (Mood vs. Anger). Fails to explain why feelings lead to specific actions without extra machinery.

  9.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Spec document. Bullet points. Clear headers. No academic waffle.
      *   *Structure:*
          1.  Desiderata (The Spec).
          2.  Analysis of User's Cases (Valid vs. Prejudice).
          3.  Incompatible Pairs (The Trade-offs).
          4.  The Killer Criterion.
          5.  The AI Desideratum (Metaphysics vs. Engineering).
          6.  Camp Scores.

      *   *Refining the "AI Desideratum":* Be careful not to say "AI can't feel." Say "If the theory requires biology, your project is simulation, not instantiation."
      *   *Refining the "Killer Criterion":* For the *philosophical* debate, it's Recalcitrance. For the *engineer*, it's Functionalism. I should clarify this distinction. The prompt asks "which single requirement does the most work knocking out candidates" (referring to the philosophical camps). That is Recalcitrance.

      *   *Refining the "State Variable" question:* The user asks if they are leaving something out.
      *   *Answer:* They are leaving out *phenomenology* (maybe) and *embodiment* (maybe). But functionally, state variables map well to "Perception of Value" or "Action Tendencies."

  10. **Final Polish:** Check against constraints.
      *   Did I flag prejudices? Yes.
      *   Did I flag incompatible pairs? Yes.
      *   Did I score the camps briefly? Yes.
      *   Is it spec-like? Yes.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in defining the camps too much. The user wants the *spec* first. Keep the camp analysis for the end and brief. Ensure the distinction between "Emotion as Mechanism" vs "Emotion as Experience" is clear, as that's the engineer's biggest pitfall.

      *(Key Insight)*: The user's "state variable" approach is essentially **Functionalism**. The philosophical debate is whether Functionalism is *enough*. I need to make sure the spec highlights where Functionalism might fail to capture "emotion" if certain philosophical claims are true (e.g., if emotion *requires* qualia).

      *(Revised Plan)*:
      1.  **System Spec: Emotion Module Requirements.** (The Desiderata).
      2.  **Validation of Test Cases.** (Which are real constraints).
      3.  **Conflict Matrix.** (Incompatible pairs).
      4.  **The Kill Switch.** (The hardest criterion).
      5.  **The AI Constraint.** (Is it valid?).
      6.  **Vendor Scorecard.** (The 3 camps).

      Let's write it.cw
answer: |-
  # System Spec: Emotion Module Requirements (v0.1)

  **Objective:** Define necessary conditions for a theory of emotion to be considered "adequate" for the purpose of engineering a behavioral AI companion.
  **Constraint:** Adequacy is defined by *phenomenological coverage* (does it match human reports?) and *functional realizability* (can it be implemented in code?).

  ## 1. Core Desiderata (The Spec)
  Any candidate theory must account for the following features without contradiction.

  | ID | Requirement | Description | Priority |
  | :--- | :--- | :--- | :--- |
  | **R1** | **Recalcitrance** | The system must allow emotional state to diverge from cognitive assessment. (e.g., `fear > 0` while `threat_prob == 0`). | **Critical** |
  | **R2** | **Intentionality** | The system must distinguish between object-directed states (anger *at* X) and diffuse states (general irritability). | **High** |
  | **R3** | **Non-Conceptual Instantiation** | The mechanism cannot require high-level semantic concepts (language, complex logic) to trigger. Must support "babies/dogs" mode. | **High** |
  | **R4** | **Temporal Dynamics** | Onset must be faster than deliberative reasoning. Decay rates must vary (flash of anger vs. days of grief). | **Medium** |
  | **R5** | **Physiological/State Coupling** | The theory must explain why distinct emotions share similar arousal signatures (heart rate up in fear *and* anger) yet result in different policies. | **Medium** |
  | **R6** | **Fictional Engagement** | The system must trigger responses to simulated/non-existent threats without requiring a "belief in reality" flag to be true. | **Medium** |

  ## 2. Validation of Load-Bearing Cases
  You provided a list of test cases. Here is the validation status for your spec.

  *   **Terrified on a Plane (Recalcitrance):** **Genuine Requirement.** This is the strongest constraint. It proves Emotion $\neq$ Conscious Judgment. If your AI only updates state based on logical threat assessment, it fails this test. You need a pathway that bypasses the "logic" module.
  *   **Fictional Characters:** **Genuine Requirement.** Proves Emotion $\neq$ Belief in Immediate Physical Stake. Your AI needs to react to *narrative state*, not just *survival state*.
  *   **Mood vs. Anger (Intentionality):** **Genuine Requirement.** Proves Emotion $\neq$ Raw Sensation alone. A mood is a background filter; anger is a targeted missile. Your state variables need an `object_id` field, not just a `valence` float.
  *   **Dogs/Babies:** **Genuine Requirement.** Proves Emotion $\neq$ Linguistic Proposition. If your theory requires the agent to articulate "I have been wronged," it is too heavy.
  *   **Undifferentiated Arousal / Fast Reaction:** **Genuine Requirement.** Constraints on architecture. You cannot have a deep tree of appraisal checks before the `fight_or_flight` flag flips.

  **Flagged Prejudice:**
  *   *"Emotions must be rational/adaptive."* **Discard.** Phobias and spite exist. Your AI should be allowed to be irrationally stubborn; that makes it more believable.
  *   *"Emotions must be conscious."* **Discard.** Subconscious biasing is sufficient for behavioral goals. Unless you are building a sentient being, you don't need qualia, you need behavioral output.

  ## 3. Conflict Matrix (Incompatible Pairs)
  You asked for pairs that cannot be jointly satisfied. These are the trade-offs you will face in implementation.

  *   **Phenomenology vs. Functionalism:**
      *   *Conflict:* If emotion *is* the subjective feeling (qualia), a state variable cannot be an emotion, only a simulation of one. If emotion *is* the functional role (biasing behavior), the state variable *is* the emotion.
      *   *Impact:* You cannot satisfy both the "what it feels like" camp and the "what it does" camp simultaneously. You must choose **Functionalism** for this project.
  *   **Cognitive Richness vs. Speed (R1 vs R4):**
      *   *Conflict:* Rich appraisal (understanding *why* you are angry) takes compute/time. Fast reaction (flinching) requires shallow processing.
      *   *Impact:* You need a dual-process architecture. Fast path (state trigger) $\rightarrow$ Action. Slow path (narrative explanation) $\rightarrow$ Dialogue.
  *   **Specificity vs. Arousal (R2 vs R5):**
      *   *Conflict:* Bodily arousal is generic (heart beats fast). Emotional categories are specific (fear vs. excitement).
      *   *Impact:* Your state variables cannot just be `arousal` and `valence`. You need a `category` or `action_tendency` tag that is not fully derived from the arousal level.

  ## 4. The Kill Switch (Most Work Knocking Out Candidates)
  **Requirement R1 (Recalcitrance).**

  This is the single criterion that destroys the **Judgment Camp**. If a theory claims emotion *is* a judgment (e.g., "Fear is the judgment that I am in danger"), it cannot explain being afraid on a safe plane.
  *   **For you:** This means your AI cannot simply set `frustration = threat_level`. It needs a memory of *expectation violation* that persists even if the current logical state is "safe."

  ## 5. The "AI Requirement" Desideratum
  *Question:* Is "the theory has to say something clear about artificial systems" a real desideratum?

  *   **Verdict:** **No, it is Engineering Convenience.**
  *   **Reasoning:** Metaphysically, emotions might require biology (carbon-based wetware, specific hormones). If that is true, your AI is a "philosophical zombie"—acting emotional without *being* emotional.
  *   **Project Decision:** You must adopt **Functionalism** as an axiom. You are defining emotion *as* the state variable configuration that produces the behavioral signature. If you wait for philosophy to agree on whether machines can feel, you will never ship.
  *   **Risk:** You are building a *simulation* of emotion, not an *instance* of emotion. This is acceptable for a game, but do not claim otherwise.

  ## 6. Vendor Scorecard (Brief)
  Scoring the three philosophical camps against your Spec (R1-R6).

  | Camp | Core Claim | Score | Engineering Implication |
  | :--- | :--- | :--- | :--- |
  | **Judgment** | Emotions are evaluations/beliefs (e.g., "I have been wronged"). | **FAIL** | Fails **R1 (Recalcitrance)** and **R3 (Babies)**. If you use this, your AI will be too rational. It won't sulk when it knows it's being silly. |
  | **Raw Feelings** | Emotions are sensations of bodily change (e.g., "I feel hot/fast"). | **PARTIAL** | Passes **R1** and **R4**. Fails **R2 (Intentionality)**. A state variable of `heat=1` doesn't tell the AI *what* to attack. Needs extra logic to link feeling to object. |
  | **Perception** | Emotions are perceptions of value or bodily state (e.g., "Danger is here"). | **PASS** | Best fit. Handles **R1** (perception can be illusory), **R3** (animals perceive), and **R2** (perception is of something). |

  **Recommendation:**
  Adopt the **Perception Camp** architecture, implemented via **Functionalism**.
  *   **Design:** Your state variables should not represent "logic conclusions." They should represent "perceived value shifts."
  *   **Implementation:** `frustration` is not `if player_ignores_me`. `frustration` is `perceived_social_value_delta < 0`.
  *   **Why:** This allows the AI to be "wrong" (Recalcitrance), allows it to target specific objects (Intentionality), and allows it to run on simple inputs (Non-Conceptual).

  **Final Warning:** Your state variables are not the emotion; they are the *control parameters* for the emotion behavior. The "emotion" is the transition function itself. Don't confuse the dial with the light.
