answer: |-
  Hey, I've been thinking about our argument regarding Flint, and I wanted to lay this out properly because I think you're hitting on something genuine about how we use causal language, even if I think your conclusion that omissions are just a façon de parler is too quick. The core of your position, if I'm understanding you right, is that the Flint Water Crisis is fundamentally a story of commission, specifically the 2014 decision to switch the water source from the Detroit system to the Flint River, and that everything following that—the lack of corrosion control, the dismissal of complaints, the regulatory silence—is just the downstream unfolding of that initial positive act. You're arguing that treating the subsequent failures as omissions is a moral or legal strategy to distribute blame, but metaphysically, the switch is the only real cause, and the literature on causation by omission is doing no work here. I get the appeal of that view because it simplifies the causal chain into a single event, but I think it collapses under the weight of the specific chemistry and bureaucracy involved, and analyzing it through the lens of omission actually reveals why the disaster persisted as long as it did.

  To see why your reduction to a single commission doesn't hold, we have to look at the counterfactual dependence at each stage. In standard counterfactual theories of causation, $C$ is a cause of $E$ if, had $C$ not occurred, $E$ would not have occurred. If we treat the switch as the sole cause, we are saying that if they hadn't switched to the Flint River, the lead poisoning wouldn't have happened. That's true. But it's also true that if the water treatment plant operators had added orthophosphates to the river water, the lead poisoning wouldn't have happened, even with the switch. The river water was corrosive, yes, but corrosion is not lead poisoning; lead poisoning requires the corrosion to interact with the pipes. The failure to add corrosion control was a decision not to act, an omission of a standard protocol required by the Lead and Copper Rule. If we apply the counterfactual test here, the omission of treatment is just as dependent on the outcome as the commission of the switch. If you say the switch is the only cause, you have to argue that the lack of treatment was merely a background condition, like the existence of the pipes themselves. But the existence of the pipes is static, whereas the treatment was a dynamic process that was actively halted. The operators didn't just forget; the system was designed to allow them to choose, and they chose not to dose. That looks like a distinct causal node, not just a consequence.

  This gets messier when we move down the chain to the officials who dismissed the early complaints and the regulators who didn't intervene, which brings us to the problem of "many hands." In philosophy, we worry about overdetermination or preemption when multiple causes are present. Usually, we think of this with positive acts, like two assassins shooting at the same time. But in Flint, we have a series of omissions that look like a chain of preempted preventions. If the local engineers had treated the water, the regulators' omission wouldn't have mattered. If the regulators had intervened when the water chemistry reports came in hot, the engineers' omission would have been corrected. If the state officials had listened to Lee Anne Walters or Marc Edwards, the regulators' omission would have been bypassed. Each of these agents had the capacity to interrupt the causal chain leading to the harm. This creates a scenario where the harm is counterfactually dependent on the disjunction of all these omissions. If any one of them had acted, the harm stops. This isn't classic overdetermination, where two sufficient causes produce one effect; it's more like cumulative prevention failure. If we accept your view that only the switch counts, we have to say that the regulators' failure to act didn't cause the poisoning because the switch already set it in motion. But that ignores the temporal extension of the crisis. The poisoning wasn't instantaneous; it was a process that continued for eighteen months. The regulators' omission caused the *continuation* of the poisoning even after the initial switch. Their inaction sustained the causal power of the corrosive water. So, the literature on omission helps us distinguish between the start of the risk and the sustenance of the harm, which your single-commission model flattens out.

  However, this is where your point about blame starts to gain traction, specifically when we apply the normative filter that many philosophers use to rescue omission causation. The standard fix, following thinkers like Hart and Honoré, is to say that an omission is only a cause if there is a normative expectation that the agent could and should have acted. A random passerby not saving a drowning child is counterfactually a cause of the death, but we don't call it causation in the legal or moral sense because they had no duty. In Flint, the reason we identify the engineers' and regulators' inaction as causes is precisely because they had a job to do. This validates your suspicion that we are using causal language to assign responsibility. If we didn't care about who was responsible, we might just say "the water was corrosive." We invoke omissions to pinpoint the agents who breached a duty. So, in one sense, you're right that the metaphysics of omission is entangled with the ethics of duty. But that doesn't mean the omissions aren't real causes; it just means that in human systems, causation is often indexed to normative expectations. The switch created the hazard, but the omissions converted that hazard into a disaster. Without the normative layer, the switch is just water moving through pipes; with the normative layer, the failure to treat is a cause of poisoning.

  Where I think both of us have to be careful, and where the standard philosophical frameworks really struggle, is that they are built for discrete agents and discrete events, whereas Flint was a structural failure. The theories of counterfactual dependence and overdetermination assume we can isolate specific agents like "the engineer" or "the regulator." But the crisis was also caused by the Emergency Manager law that stripped local democracy, by decades of underinvestment in infrastructure, and by systemic racism that made officials less likely to believe residents' complaints about smell and color. These aren't easily mapped onto specific omissions by specific individuals. Was the cause the Governor's omission to fund the pipes? Was it the voters' omission to repeal the Emergency Manager law? The frameworks we use for omission causation start to fray when the "agent" is a policy or a culture. This is the gap you spotted. If we say every structural failure is an omission, then everything is an omission, and the concept loses its bite. Your friend's move to collapse it all into the single commission of the switch is, in a way, an attempt to find a concrete anchor in a sea of diffuse structural negligence. It's an attempt to say, "Here is the moment the world changed," because tracing the causality through the omissions requires us to adjudicate duties and norms that are politically contested.

  So, is this a clean win for taking causation by omission seriously, or is it the strongest weapon for your argument that omissions are just blame-shifting? I think it's neither, or rather, it's a draw that forces us to refine what we mean by cause. Your friend is right that without the normative context, the distinction between the switch (commission) and the treatment (omission) is physically arbitrary; both are just events in a timeline. If you look at the physics, the absence of phosphate molecules is just as much a state of the world as the presence of river water. But your friend is wrong to say the literature on omissions does no work. That literature is exactly what allows us to distinguish between a natural disaster and a man-made one. If a hurricane floods a city, that's a commission of nature. If the levees fail because no one maintained them, that's an omission. In Flint, the switch to the river was the trigger, but the omissions were the mechanism. If we ignore the omissions, we lose the ability to explain why similar switches in other cities didn't result in lead poisoning. They had the same commission (switching water) but didn't have the same omissions (skipping treatment). Therefore, the omission is the difference-maker.

  Ultimately, I think the episode shows that causation by omission is real, but it is not purely metaphysical; it is socio-metaphysical. It depends on the systems we build that create duties for specific people. Your friend's reduction to a single commission is too fast because it erases the points of intervention that could have stopped the harm. It implies that once the switch was flipped, the poisoning was inevitable, which absolves the people who stood by and watched it happen for a year and a half. But at the same time, you're right to be skeptical of frameworks that treat omissions as identical to acts without acknowledging that we only call them causes because we expect better of the people involved. The Flint crisis isn't a win for the idea that omissions are magic causal forces, but it is a devastating demonstration that in complex bureaucratic systems, doing nothing is often the most powerful thing anyone does. The pipes didn't leach lead because of the river; they leached lead because of the chemistry, and the chemistry was wrong because people chose not to fix it. That choice not to fix is an omission, and it is a cause, but we only know it's a cause because we know they should have fixed it. So, you win that the normativity is doing the heavy lifting, but I win that without the concept of omission, we can't accurately describe how the harm actually occurred. It's not just blame-shifting; it's the only way to map the terrain of a disaster that was built on inaction.
