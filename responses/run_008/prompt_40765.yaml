prompt: |-
  My friend and I got into it last night about Flint and never really settled it, so I want to lay this out properly. Take the Flint water crisis -- the 2014 switch to Flint River water, the failure to add corrosion control that let lead leach out of old pipes, and the chain of officials who didn't act when the first warning signs came in -- and analyze it as a case study in causation by omission. My friend's move was to say all the omissions collapse into a single commission: switching the source was an act, everything downstream was just its consequences, so the whole literature on omissions is doing no work here. I think that's too fast. There were omissions at several layers (the engineers who didn't treat the water, the officials who dismissed the early complaints, the regulators who didn't intervene), and the interesting question is which of those is a cause, and whose cause it is. So do the mapping carefully: what plain counterfactual dependence says about each omission, what happens when there are many hands all omitting at once and the case starts looking like overdetermination or preemption among absences, and where the standard fix of saying an omission only counts as a cause if there's some agent who could and should have prevented the harm actually gets you in a case like this. Then be honest about what the theories miss -- the harm really did come from decades-old pipes plus a series of people not doing their jobs, and I'm not sure any of the frameworks were built for that -- and tell me whether the episode is a clean win for taking causation by omission seriously, or the strongest weapon my friend could have for arguing that omissions are just a façon de parler we use to assign blame. Write it as continuous prose, no headings or bullet points or anything, like a long email.
