answer: |-
  **MEMORANDUM**

  **TO:** Collections and Provenance Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Restitution of Benin City Objects

  **Executive Summary**

  Following the Trustees' resolution in principle to restitute the six brass plaques and ivory hip ornament, this memo recommends a specific framework for transfer. I propose we effect an **unconditional transfer of title to the Royal Court of Benin (the Oba)**, with the explicit understanding that the objects will be housed and managed by the Edo Museum of West African Art (EMWAA). Simultaneously, we should pursue a **non-binding Cultural Partnership Agreement** rather than a contractual loan framework. This approach prioritizes the restoration of moral authority over the retention of administrative control, while acknowledging the legitimate interest in ongoing scholarly and public engagement.

  **1. The Question of Recipient: Where Does the Injury Run?**

  We face three claimants: the Federal National Commission for Museums and Monuments (NCMM), the Royal Court of Benin, and the EMWAA project. While the NCMM holds statutory authority within Nigeria, restitution is not merely a legal procedure; it is a corrective to a specific historical injury. The 1897 Punitive Expedition targeted the Kingdom of Benin specifically; the ledger confirms these objects were "taken from the king's palace."

  Therefore, the moral debt is owed primarily to the institution from which they were stolen: the Kingship of Benin. Transferring title to the Federal Commission risks subsuming a specific cultural sovereignty under a post-colonial state apparatus that did not exist at the time of the looting. Conversely, the EMWAA is a future-facing infrastructure project, not a legal successor to the 19th-century polity.

  **Recommendation:** Title should vest in the **Oba of Benin**. This recognizes the Royal Court as the primary victim and successor. We should formally note in the transfer deed that this is done in trust for the Edo people, with the EMWAA designated as the physical custodian. We will invite the NCMM to co-sign the accompanying partnership agreement to ensure smooth customs and state-level cooperation, but they should not hold title.

  **2. The Question of Conditions: Stewardship or Supervision?**

  The most difficult ethical friction concerns conditions. Some trustees advocate for mandatory loan-backs, conservation veto power, and retained digital rights. The argument here is one of "prudent stewardship": we have a duty to keep these objects accessible to our public and ensure their physical safety. To refuse all conditions, critics argue, is its own form of dogmatism—a performative purity that severs valuable scholarly ties and ignores our own donors' intent.

  This argument is not without merit. A total cessation of relationship could be read as an abdication of our educational mission. However, we must distinguish between *partnership* and *control*.

  If we attach legally binding conditions to the return—specifically the requirement that objects return to our galleries—we are not ending the colonial relationship; we are renegotiating it. We become perpetual supervisors, implying that the recipient cannot be trusted to care for or display their own heritage. This re-enacts the asymmetry restitution is meant to undo. As my colleague noted, a return hedged with lender's conditions keeps one foot out the door.

  **Recommendation:** We must reject mandatory loan-backs and conservation vetoes. Title transfer must be unconditional. However, to address the "dogmatism" concern, we should propose a **voluntary Cultural Partnership Agreement**. This MOU would express a mutual desire for collaboration—digital sharing, potential temporary exhibitions, and conservation knowledge exchange—without legal compulsion. If the Nigerian partners wish to lend the objects back to us in the future, they may; but the *right* to decide must rest solely with them. This preserves the possibility of access without enforcing the power dynamic of the past.

  **3. The Donor Deed and "Public Accessibility"**

  The development office rightly notes the donor deed requiring objects "remain accessible to the public." Keeping the objects in our gallery satisfies the letter of this deed but violates its spirit. "Accessibility" in a museum context implies meaningful engagement. For these specific objects, meaningful engagement is currently impossible because their presence here is predicated on a violent dispossession that silences their original context.

  Restitution does not remove these objects from the public sphere; it returns them to a public for whom they are not merely art, but ancestors and history. We should instruct legal counsel to seek a waiver or reinterpretation of the deed based on the principle of *cy pres*, arguing that the ethical imperative of restitution supersedes the original restriction, and that the objects will remain publicly accessible in Nigeria.

  **Conclusion and Next Steps**

  We have an opportunity to model what ethical restitution looks like in practice. It requires us to accept that once we return these objects, we no longer have a say in their fate. That loss of control is not a bug of the process; it is the feature.

  I move that the committee recommend to the Trustees:
  1.  **Transfer of Title:** Unconditional transfer to the Oba of Benin.
  2.  **Custody:** Designation of EMWAA as the physical home.
  3.  **Future Relations:** Pursuit of a non-binding Memorandum of Understanding regarding digital access and potential exhibitions, explicitly devoid of mandatory loan clauses.
  4.  **Legal Action:** Immediate consultation to resolve the donor deed restriction in favor of repatriation.

  This path balances moral clarity with practical cooperation. It acknowledges that while we can facilitate the return, we cannot manage the reconciliation. That work belongs to the owners.
