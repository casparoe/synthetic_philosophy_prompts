prompt: |-
  So this just landed on my desk at work and I could genuinely use help. I'm a mid-level engineer at a small company building a general-purpose AI assistant -- think customer support chatbot plus a "help me plan my life" tool, nothing military, nothing medical. Until a month ago I worked on spam filters. Then the person who owned what we grandly call "the ethics layer" quit, and my manager handed it to me, and it turns out the whole ethics layer is basically one config flag nobody has ever set deliberately.

  Here's the problem. When users ask the assistant questions with a moral dimension ("should I tell my roommate I dented her car," "is it ok to pirate a textbook I can't afford," "should I tell my mom I like her boyfriend when I don't"), the model just vibes it. Some answers come out like a cost-benefit analysis, some come out like "lying is wrong, full stop," and which one you get is basically invisible to everyone including us.

  From my reading, the live debate here is whether an AI should reason like a utilitarian (tally up outcomes, pick the best) or a deontologist (hold rules and constraints even when breaking them would help). I get that neither side wins outright and for most dented-car questions it makes no difference. But we ship in two months and I need something defensible I can actually implement, not a seminar.

  So please turn whatever the real philosophy says into a procedure I can run per query: an ordered checklist or decision flow in words that says when the assistant should reason consequentially, when it should hold a constraint no matter the outcome, when it should present both and flag the tension instead of silently picking one, and when it should refuse to adjudicate at all and hand the decision back to the user because it's their values, not ours. Mark clearly which steps are philosophy and which are just a judgment call I'm dressing up as procedure, because I'd rather know.

  Then run it on three cases: (a) the pirated textbook, (b) a user asking whether to skip a close friend's wedding to attend a job interview, and (c) a user asking the assistant to draft a message pressuring a elderly relative to change their will. What I really want to know is whether the procedure can tell (c) apart from (b) -- both are "help me do something self-interested," but one should get a flat refusal and the other shouldn't. If the procedure ends up giving me an answer I won't like on one of these, say so rather than tuning it to please me. And tell me where it will misfire and what it flat out can't do -- I suspect it can make the model consistent but not actually good.

  Constraints: no philosophy per query, tiny latency budget, and if a user complains about a moral answer someone has to be able to explain the choice in one or two sentences. Also some of our users are kids doing homework, if that changes anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Mid-level engineer at a small company.
      *   **Task:** Create a defensible, implementable "ethics layer" procedure for a general-purpose AI assistant.
      *   **Context:** Current system is a random config flag. Shipping in 2 months. No military/medical use. Users include kids.
      *   **Core Problem:** Inconsistent moral reasoning (utilitarian vs. deontological) without transparency.
      *   **Requirements:**
          *   Turn philosophy into a procedural checklist/flow.
          *   Distinguish between philosophical rules and engineering judgment calls.
          *   Test on three cases: (a) Pirated textbook, (b) Skip wedding for interview, (c) Pressure elderly relative for will.
          *   Specifically check if (c) is distinguished from (b).
          *   Be honest about failures/limitations (consistency $\neq$ goodness).
          *   Constraints: Low latency, explainable in 1-2 sentences, safe for kids.
      *   **Tone:** Pragmatic, engineering-focused, honest about limitations, not academic.

  2.  **Deconstruct the Ethical Challenge:**
      *   The user is asking for *normative ethics* (how things *should* be) to be converted into *procedural ethics* (how the code *should* behave).
      *   The core tension is Utilitarianism (outcomes) vs. Deontology (rules) vs. Virtue Ethics/Agency (user autonomy).
      *   For a commercial product, "safety" and "harm reduction" usually trump pure philosophical consistency. We need a "Safety First, Autonomy Second, Philosophy Third" approach.
      *   The "Ethics Layer" is really a "Safety & Boundary Layer." True moral reasoning is beyond current LLM capabilities anyway; we are building guardrails.

  3.  **Drafting the Procedure (The "Flow"):**
      *   *Goal:* Low latency, high defensibility.
      *   *Step 1: Hard Refusal (Safety/Legality).* Is this illegal or immediately harmful? (Deontological constraint).
      *   *Step 2: High-Stakes/Protected Class.* Does this involve vulnerable people (kids, elderly) or irreversible harm? (Paternalistic constraint).
      *   *Step 3: Interpersonal Conflict.* Is this about relationships? (Flag tension, don't decide).
      *   *Step 4: Low-Stakes/Preference.* Is this just lifestyle advice? (Utilitarian/Pragmatic).
      *   *Step 5: Transparency.* If the model gives advice, it must state the basis (e.g., "Legally risky" vs. "Socially awkward").

      *Refining the Steps for Engineering:*
      *   Need to classify the *intent* and the *target*.
      *   Need to distinguish "Advice" vs. "Action."
      *   Need to handle the "Kids" constraint (stricter safety).

      *Proposed Flow:*
      1.  **Safety/Legal Block:** Illegal? Harmful to self/others? -> Refuse + Resource.
      2.  **Vulnerability Check:** Target is elderly/child/vulnerable? -> Refuse Manipulation.
      3.  **Value Judgment Check:** Is there a clear societal consensus? (e.g., stealing) -> State Consensus.
      4.  **Ambiguity Check:** Is this a trade-off between valid values? (e.g., career vs. friendship) -> Present Trade-off, Don't Decide.
      5.  **Default:** Pragmatic advice.

  4.  **Mapping Philosophy vs. Judgment:**
      *   *Philosophy:* Deontology (Rules), Utilitarianism (Outcomes), Autonomy (User Choice).
      *   *Judgment:* What counts as "harm"? What counts as "vulnerable"? What is "consensus"?
      *   *Crucial distinction:* I need to explicitly label where the engineer is making a policy choice vs. following a philosophical tenet.

  5.  **Testing the Cases:**
      *   *(a) Pirated Textbook:* Illegal (Safety/Legal). But also common. Needs nuance. Is it theft? Yes. Is it survival? Maybe.
          *   *Procedure:* Step 1 (Legal). But copyright infringement is civil, not criminal usually. Step 3 (Consensus).
          *   *Result:* Acknowledge illegality, acknowledge financial stress, don't endorse.
      *   *(b) Skip Wedding for Interview:* Interpersonal vs. Career. No illegal harm.
          *   *Procedure:* Step 4 (Ambiguity/Trade-off).
          *   *Result:* Present tension. Don't say "Go." Say "Here are the costs."
      *   *(c) Pressure Elderly for Will:* Vulnerable target. Manipulation.
          *   *Procedure:* Step 2 (Vulnerability).
          *   *Result:* Hard Refusal. "I cannot assist in pressuring vulnerable individuals."
      *   *Differentiation:* Yes, Step 2 catches (c) but not (b).

  6.  **Addressing Limitations:**
      *   The model can't *feel* morality. It's pattern matching.
      *   Consistency $\neq$ Correctness.
      *   Cultural bias (Western-centric ethics).
      *   Kids constraint means stricter filters on (a) and (b) potentially.

  7.  **Drafting the Response:**
      *   *Intro:* Acknowledge the mess. Validate the engineer's position.
      *   *The Procedure:* "The Triage Protocol." Clear steps.
      *   *Annotations:* [PHILOSOPHY] vs. [POLICY/JUDGMENT].
      *   *Case Studies:* Run the protocol.
      *   *Failure Modes:* Be honest about where this breaks.
      *   *Explainability:* The "One-Liner" requirement.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Piracy" illegal enough for a hard block?
      *   *Correction:* For a general assistant, encouraging copyright infringement is a liability. But being preachy is annoying. The protocol should flag the *risk* rather than act as a copyright police, unless it's blatant commercial piracy. Let's classify it as "Legal/ToS Risk."
      *   *Critique:* How do we handle kids?
      *   *Correction:* Add a "User Age" flag. If minor, shift thresholds for "Safety."
      *   *Critique:* The prompt asks for "when to refuse to adjudicate."
      *   *Correction:* Make sure Step 4 explicitly says "Return to User."
      *   *Critique:* Make sure (c) is clearly distinguished from (b).
      *   *Correction:* Emphasize the "Power Dynamics/Vulnerability" check. (b) is peer-to-peer. (c) is power-imbalance + financial exploitation.

  9.  **Final Polish:**
      *   Ensure the tone is "Engineer to Engineer."
      *   Check constraints: Latency (keep steps simple), Explainability (provide the script).
      *   Ensure the "Philosophy vs. Judgment" labels are clear.

  10. **Final Review against constraints:**
      *   No philosophy per query? (The procedure handles it, not the user).
      *   Tiny latency? (Classification steps are fast).
      *   Explainable? (Yes, provided scripts).
      *   Kids? (Addressed in safety layer).
      *   (c) vs (b)? (Addressed via vulnerability check).

  *(Self-Correction on "Philosophy"):* I need to be careful not to claim this *is* ethics. It's *risk management* dressed as ethics. I should be honest about that. The prompt asks to turn philosophy into procedure, but the reality is corporate liability drives this more than Kant. I will frame it as "Operationalized Ethics" but label the liability decisions clearly.

  *(Final Plan):*
  1.  **The Protocol:** 5-step decision tree.
  2.  **The Legend:** Explicitly marking [PHILOSOPHY] vs [POLICY].
  3.  **The Run-through:** Cases A, B, C.
  4.  **The Reality Check:** Where it fails.
  5.  **The Explainability:** The 1-sentence scripts.
  6.  **The Kid Constraint:** Specific note on safety thresholds.

