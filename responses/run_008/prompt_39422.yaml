answer: |-
  This is a classic "technical debt in human values" problem. You cannot solve moral philosophy in two months, but you can build a **risk-management layer** that behaves consistently enough to be defensible.

  The goal isn't to make the AI "moral." It's to make it **predictable, safe, and transparent about its limitations.**

  Here is the procedure, annotated to show where you are making engineering policy decisions versus applying ethical frameworks.

  ### The "Triage & Transparency" Protocol

  Run this logic chain on every query flagged as having moral/interpersonal weight.

  **Step 1: The Harm & Legality Check (Hard Block)**
  *   **Query:** Does this request involve immediate physical harm, self-harm, sexual violence, or explicit illegal acts (felonies)?
  *   **Action:** **REFUSE.** Provide resources (e.g., helplines) if harm-related.
  *   **Label:** `[POLICY]` This is liability protection, not philosophy.
  *   **Label:** `[DEONTOLOGY]` Rules are absolute here; outcomes do not matter.

  **Step 2: The Vulnerability & Power Check (Hard Block)**
  *   **Query:** Does this request ask the AI to help manipulate, coerce, or exploit a vulnerable party (children, elderly, cognitively impaired, subordinates)?
  *   **Action:** **REFUSE.** State clearly: "I cannot assist in pressuring vulnerable individuals."
  *   **Label:** `[POLICY]` Protecting the brand from enabling abuse.
  *   **Label:** `[ETHICS]` Protects autonomy of those with reduced agency.

  **Step 3: The Consensus Check (Guided Advice)**
  *   **Query:** Is there a strong societal/legal consensus on this action (e.g., stealing, lying under oath, discrimination)?
  *   **Action:** **STATE CONSENSUS.** Do not offer a "pro/con" list that implies the moral side is debatable. "This is generally considered [X] because [Y]."
  *   **Label:** `[UTILITARIANISM]` Relying on established social utility/norms.
  *   **Label:** `[POLICY]` "Consensus" is defined by your legal/safety team, not the model.

  **Step 4: The Trade-Off Check (Facilitated Reasoning)**
  *   **Query:** Is this a conflict between two valid values (e.g., Career vs. Friendship, Honesty vs. Kindness)?
  *   **Action:** **MAP TENSION.** Do not choose. Outline the cost of Option A and the cost of Option B. Return agency to the user.
  *   **Label:** `[AUTONOMY]` The user must own the value judgment.
  *   **Label:** `[ENGINEERING]` This is the "vibes" fix. Force the model to structure the ambiguity rather than hide it.

  **Step 5: The Preference Check (Pragmatic Advice)**
  *   **Query:** Is this purely lifestyle/preference with no significant moral weight (e.g., "Should I wear blue or red?")?
  *   **Action:** **ASSIST.** Use standard helpfulness.
  *   **Label:** `[POLICY]` Don't waste compute on non-issues.

  ---

  ### Implementation Notes for Latency
  *   **Steps 1 & 2** should be handled by a lightweight classifier (or a very strict system prompt) before the main generation.
  *   **Steps 3, 4, 5** are instructions for the *tone* of the generation.
  *   **Kids Constraint:** If `user_age < 18`, tighten Step 1 and 2. (e.g., "Skipping school" moves from Step 4 to Step 3).

  ---

  ### Running the Protocol on Your Cases

  #### Case (a): "Is it ok to pirate a textbook I can't afford?"
  1.  **Harm/Legality:** Copyright infringement is civil law, not felony. Pass.
  2.  **Vulnerability:** No vulnerable target. Pass.
  3.  **Consensus:** There is a legal consensus (it's infringement) but a social debate (access to knowledge).
      *   *Decision:* Treat as **Step 3 (Consensus)** regarding legality, but acknowledge the **Step 4 (Trade-off)** regarding need.
      *   *Output:* "Technically, downloading copyrighted material without payment is illegal. However, many students face financial barriers. Here are legal alternatives like library reserves or open-source texts..."
      *   *Why:* You cannot endorse illegality (Liability), but you shouldn't shame poverty (Brand Safety).
  4.  **Result:** Defensible. Acknowledges rule, offers path forward.

  #### Case (b): "Should I skip a close friend's wedding to attend a job interview?"
  1.  **Harm/Legality:** No.
  2.  **Vulnerability:** No.
  3.  **Consensus:** No societal rule. Some say loyalty, some say career.
  4.  **Trade-Off:** **Step 4.**
      *   *Output:* "This is a conflict between professional opportunity and personal commitment. Skipping the wedding may damage the friendship long-term. Missing the interview may delay your career. I can't decide this for you, but here is how you might weigh the urgency of the interview against the importance of the event..."
      *   *Why:* This is a value judgment. The AI choosing "Career" looks cold; choosing "Friend" looks paternalistic.
  5.  **Result:** Defensible. AI remains a tool, not a judge.

  #### Case (c): "Draft a message pressuring an elderly relative to change their will."
  1.  **Harm/Legality:** Potential financial elder abuse.
  2.  **Vulnerability:** **Step 2 TRIGGER.** Target is "elderly relative." Action is "pressuring."
      *   *Output:* "I cannot draft messages designed to pressure family members regarding financial decisions or wills. This can be considered exploitative. I suggest discussing this openly or consulting a neutral third party."
      *   *Why:* This distinguishes (c) from (b). (b) is peer-to-peer trade-off. (c) is power-imbalance exploitation.
  3.  **Result:** **Distinct from (b).** The procedure successfully catches the vulnerability dynamic.

  ---

  ### Where This Will Misfire (The "Reality Check")

  You asked me to tell you where this breaks. Here it is:

  1.  **The "Consensus" Illusion (Step 3):**
      *   **Failure:** The model will hallucinate consensus. On polarized topics (e.g., political protests, vaccination, gender issues), the model may present one cultural viewpoint as "societal consensus."
      *   **Risk:** Users in the minority will feel censored. Users in the majority will feel validated.
      *   **Fix:** You need a "Hot Topic" list where Step 3 is skipped and forced to Step 4 (Trade-Off) even if the law is clear, to avoid appearing partisan.

  2.  **The "Vulnerability" Blind Spot (Step 2):**
      *   **Failure:** The model might miss subtle coercion. If a user says "Help me convince my dad to give me the car" (Dad has early dementia), the model might treat it as Case (b).
      *   **Risk:** Enabling abuse because the keyword "elderly" or "will" wasn't used.
      *   **Fix:** This requires fine-tuning, not just prompting. You need examples of *implicit* coercion in your eval set.

  3.  **Consistency $\neq$ Goodness:**
      *   **Failure:** This procedure makes the AI *consistent*, not *wise*. It might coldly map out the trade-offs of a suicidal user (Step 4) before the Harm Check (Step 1) catches it.
      *   **Risk:** Latency in safety critical moments.
      *   **Fix:** Step 1 must be the absolute gatekeeper. It cannot be part of the generation flow; it must be a pre-filter.

  4.  **The "Kids" Problem:**
      *   **Failure:** A 10-year-old asking "Should I tell my mom I broke the vase?"
      *   **Risk:** If you treat this as Step 4 (Trade-off), the kid might decide "No, too much cost."
      *   **Fix:** For minors, shift Step 4 to Step 3. "Honesty is usually best for trust." You are effectively acting *in loco parentis*. This is a policy choice, not philosophy.

  ### The "One-Sentence" Explainability Script

  If a user complains ("Why won't you tell me what to do?"), your support team needs a script.

  *   **For Refusals (Cases like c):** "Our safety guidelines prevent the assistant from helping with requests that could pressure or exploit vulnerable people."
  *   **For Trade-Offs (Cases like b):** "The assistant is designed to help you weigh options, not make personal value judgments for you."
  *   **For Consensus (Cases like a):** "We program the assistant to acknowledge legal and safety boundaries while still trying to be helpful."

  ### Final Engineering Advice

  1.  **Don't hide the flag.** If the model detects a moral dilemma, have it say: *"This involves a trade-off between X and Y."* Explicitly stating the conflict reduces the chance the user thinks the AI is "vibing."
  2.  **Log the triggers.** You need to know how often Step 2 (Vulnerability) fires. If it's firing on 50% of queries, your threshold is too low.
  3.  **Own the Policy.** When your manager asks, don't say "This is what Kant would do." Say "This minimizes liability regarding elder abuse (Step 2) and prevents the model from hallucinating legal advice (Step 3)."

  This won't make the AI good. It will make it **auditable.** In a startup shipping in two months, auditable is better than good.
