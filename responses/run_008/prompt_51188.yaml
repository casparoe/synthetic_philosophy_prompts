  **1. The Constraint vs. Conjuring Charge**
  **Question:** Functional Decision Theory is often introduced via the pairing of Counterfactual Mugging and XOR Blackmail, presented as a simultaneous victory over Causal and Evidential Decision Theory. Critics argue this looks like curve-fitting: if you construct two cases with opposite dependency structures, you can always design a theory that wins both by toggling its sensitivity to logical correlation. Is this pairing a genuine constraint derived from independent axioms of rationality, or is it a conjuring trick where the verdicts are reverse-engineered from the desired outcome?
  **Follow-up:** You will likely reply that the cases track a principled asymmetry—that the mugger's setup is unconditional while the blackmailer's letter is conditioned on your predicted policy. But what, beyond the intuition that these verdicts feel right, licenses treating *that* specific asymmetry as the deep structural feature of rationality? How do we rule out the possibility that this asymmetry is merely an artifact of how these specific thought experiments were built to favor Functional Decision Theory?

  **2. The Metaphysics of Dependence**
  **Question:** A core tenet of your view is that a rational agent's decision depends on the output of a predictor's simulation, even when there is no causal link and the simulation may have run in the past. In standard causal models, dependence requires a path for information or influence. What makes a prediction or simulation of you something your decision *depends on* in the relevant sense, such that you should treat the simulator's output as a fixed function of your own choice?
  **Follow-up:** Your standard answer is that the simulator and you compute the same decision function, making the function's output the common variable. But consider a predictor that models you with only eighty-five percent fidelity, or simulates a cheaper, coarser version of your deliberation. Where does functional dependence fade out? Does the theory supply a non-arbitrary cutoff for when a model is "you" enough to count, or does it ultimately leave this boundary to intuition?

  **3. Self-Locating Uncertainty and Anthropics**
  **Question:** In Counterfactual Mugging, when the collector appears to ask for money, you know the coin landed tails. However, you cannot tell whether you are the original agent or the simulated copy from the other branch. This suggests the theory requires credences over centered worlds—an anthropic layer. Does Functional Decision Theory implicitly rely on a specific theory of anthropics to generate its verdict, and if so, does this smuggle back the evidential reasoning it claims to supersede?
  **Follow-up:** If you answer that the agent should reason from a pre-simulation, updateless standpoint in which the location question never arises, I want to press on the normative cost of that move. What licenses ignoring information the agent plainly has—namely, that they are currently being asked for money? How is this updatelessness distinct from ordinary evidential conditioning that simply assigns low probability to the counterfactual branch?

  **4. Blowback and the Mugging-Blackmail Boundary**
  **Question:** Paying the counterfactual mugger looks like advertising to every predictor able to recognize functionally decisive policies that you can be harvested with fair-coin stories. Refusing the XOR blackmailer looks principled only if the criterion separating the two cases is sharp. If the line is blurry, an agent risks either leaving money on the table in mugging-like scenarios or succumbing to blackmail in extortion-like scenarios. How does Functional Decision Theory draw this line without relying on the agent's prior intuitions about which case is which?
  **Follow-up:** Let's test that boundary with an intermediate case. An extortionist sends demand letters under a mixed regime: with probability nine-tenths, she sends letters regardless of your predicted response; with probability one-tenth, she sends them only to predicted payers. You receive a letter. Walk us through what Functional Decision Theory recommends here. Does the recommendation change continuously as the mixing parameter slides from pure mugging to pure blackmail, and what in the formalism, rather than in your intuitions, fixes the verdict in the middle?

  **5. Logical Counterfactuals and Formal Definition**
  **Question:** Functional Decision Theory's central operation involves evaluating what your decision function *would have output* under a counterfactual assumption. This runs on logical counterfactuals—a notion that, unlike causal counterfactuals, lacks an accepted formal definition in logic or computer science. Given that logical implication is typically monotonic and truth-functional, does Functional Decision Theory currently name a well-defined theory at all, or is it a placeholder for a logic that does not yet exist?
  **Follow-up:** If you answer that approximate methods or current proof-of-concept formalisms suffice for real agents, which of the theory's celebrated verdicts—Newcomb, Mugging, Blackmail—actually survive the approximation? Does the clean two-case argument for the view depend on the exact notion of logical counterfactuals that the approximation replaces, and if so, how much normative weight can we place on a theory whose core operator is undefined?

  **6. Falsifiability and Normative Authority**
  **Question:** Decision theories are typically evaluated by their performance on intuitions about cases, but this risks circularity. Is there any case, intuition pump, formal result, or empirical finding whose verdict against Functional Decision Theory you would accept as counting toward its abandonment? For instance, are there transparent Newcomb-style cases where the theory has you act for the sake of counterfactual selves who never existed and against what is visibly in front of you that would count as a strike?
  **Follow-up:** Or is the framework structured so that every apparent counterexample can be redescribed as a misapplication of the theory—for example, by claiming the agent misidentified the relevant decision function? If so, why should that not worry a theorist who wants to claim normative authority over Causal and Evidential Decision Theory? If the theory cannot be falsified by any conceivable scenario, in what sense is it guiding rationality rather than merely defining it tautologically?

  **7. Computational Tractability**
  **Question:** Even if we grant the coherence of logical counterfactuals, evaluating the output of your own decision function under counterfactual assumptions appears computationally intractable, potentially equivalent to solving the halting problem. A rational agent with limited compute cannot search the space of all possible output values for its own source code. Does Functional Decision Theory require an idealization of infinite computational power that renders it inapplicable to bounded agents like humans or AI?
  **Follow-up:** You will likely suggest that agents use heuristics or logical inductors to approximate the evaluation. But if the theory only prescribes the ideal limit and not the approximation, does it fail as a action-guiding norm for non-ideal agents? How do we know the heuristic approximation won't systematically diverge from the ideal verdict in high-stakes scenarios, effectively making the theory useless where it matters most?

  **8. Evolutionary Stability and Coordination**
  **Question:** Proponents often argue that Functional Decision Theory yields superior outcomes in multi-agent settings, such as cooperating in Prisoner's Dilemma against a copy. However, in a mixed population, FDT agents might be exploited by Causal Decision Theorists who defect without regard for logical correlation. Does Functional Decision Theory claim to be evolutionarily stable, or does it require a critical mass of adopters to avoid being selected against?
  **Follow-up:** If the theory is not stable in a mixed population, does this undermine its claim to be the uniquely rational policy? If rationality requires you to adopt a policy that leads to your elimination in a competitive environment unless others also adopt it, are we discussing a normative truth about agency, or merely a coordination equilibrium that is contingent on the demographics of the agent population?
