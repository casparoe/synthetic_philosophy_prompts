answer: |-
  Dear colleague,

  It is a pleasure to engage with a draft written by someone who has actually spent thirty years at the bench, because too much of this debate is conducted by people who have only ever wrestled with the literature. You have assembled a position that is, broadly speaking, a coherent version of the Modern Synthesis with a dash of Evo-Devo caution, and for the most part, these commitments sit comfortably together. However, your instinct that there is a buried problem is correct. There is a fault line running through your set of commitments, and while some of the tensions are merely superficial, others are genuine contradictions that will leave you vulnerable if you do not address them before posting. I will walk you through the architecture of your position, identify the stress points, rank them by severity, and suggest where a small structural change might save you from a collapse during the discussion.

  The most severe tension, by a significant margin, exists between your first commitment and your second and third commitments. You state that at the phenotypic level you are an unrepentant adaptationist who has never encountered a structure that did not do its job well once measured carefully, yet you also endorse the Gould and Lewontin spandrels paper and argue that badly designed traits should be attributed to developmental constraint rather than hidden function. The problem here is not that you value both selection and constraint, but that your characterization of your own adaptationism is ontologically too strong for the Gouldian view you wish to hold. If you claim that you have never found a structure that was not optimal, you are effectively claiming that spandrels do not exist in your domain of expertise, or that every spandrel has been co-opted to become optimal. Gould and Lewontin's central argument was precisely that many features are non-adaptive byproducts that selection has not optimized, not even partially. By calling yourself unrepentant, you signal to the philosophers in your discussion group that you reject the null hypothesis of non-adaptation, whereas your acceptance of the spandrels paper suggests you accept that null hypothesis in cases of structural constraint. You cannot hold that everything is near-optimal given trade-offs and simultaneously hold that plenty of features are structural byproducts rather than adaptations. One of these claims must be a heuristic rather than a statement of fact.

  The second most severe tension lies between your physiological adaptationism and your soft spot for evolutionary psychology. You argue that the reverse-engineering approach used in anatomy is legitimate for the mind, which is methodologically consistent, but you risk a category error regarding evidence. In your physiology career, your claim that organs do their job well is backed by thirty years of measurable, quantifiable data regarding salt balance and kidney function. You can measure the gradient, the flow, and the energy cost. In evolutionary psychology, that level of measurement is rarely available. If you apply the rigorous standard of your first commitment to your sixth, you might find the evolutionary psychology claims wanting, because they often lack the careful measurement you insist upon for kidneys. Conversely, if you allow evolutionary psychology to proceed with less empirical rigidity than physiology, you open yourself to the charge of inconsistency. The tension here is not necessarily logical, but methodological. You are extending a trust earned in hard physiology to a field that often operates with much softer data, and critics like Gould or Spandrels advocates will pounce on this if you do not distinguish between adaptationism as a tested conclusion in physiology versus adaptationism as a working hypothesis in psychology.

  There is a third, lower-level tension between your gene's-eye view and your endorsement of developmental constraints. The gene's-eye view, particularly in the Dawkins and Williams tradition, tends to treat the organism as a vehicle and constraints as temporary hurdles that selection will eventually overcome or route around given enough time. Gould, conversely, viewed constraints as fundamental channels that direct evolution independently of selection, sometimes preventing optimality indefinitely. You can hold both views if you treat the gene as the replicator and development as the filter, but you must be careful not to slide into pan-selectionism where every constraint is eventually explained away as an adaptation for robustness. Since you already prioritize developmental constraint when design looks bad, you are leaning Gouldian here, which slightly dilutes the hardline Dawkinsian position of your fifth commitment. However, this is manageable because most modern evolutionary biologists accept that genes are the units of selection while acknowledging that development limits the variation those genes can act upon. This is a friction point rather than a contradiction, provided you do not claim that constraints are themselves always adaptations.

  Your fourth commitment regarding neutral theory is actually the most stable part of your position and creates no significant tension with the others. Accepting drift at the molecular level while maintaining selection at the phenotypic level is the standard position of the nearly neutral theory and is fully compatible with both the gene's-eye view and phenotypic adaptationism. You do not need to worry about this one causing trouble in a discussion group, as it is the consensus view among those who know the literature. The real risk lies in how you frame the relationship between the molecular drift and the phenotypic selection, but since you have kept them distinct by level of organization, you have avoided the trap of claiming that all evolution is adaptive.

  If you are willing to revise only one commitment to clean up the most mess, I strongly recommend you modify your first commitment. You should shift from being an unrepentant adaptationist who claims never to have seen a suboptimal structure to being a methodological adaptationist who treats adaptation as the default null hypothesis to be tested, not the default truth to be assumed. This change costs you very little in terms of your scientific practice, because you clearly do test your hypotheses rather than just assuming them, but it gains you immense philosophical cover. By framing your adaptationism as a methodological strategy rather than an empirical observation of universal optimality, you make room for the spandrels. You can say that you start by looking for function, but you acknowledge that sometimes the answer is constraint or drift. This aligns you with Sober's distinction between empirical and methodological adaptationism and neutralizes the criticism that you are ignoring Gould and Lewontin. It allows you to keep your respect for the kidney's optimality without denying the retina's historical baggage.

  Making this change also alleviates the tension with your evolutionary psychology commitment. If adaptationism is a methodological tool rather than a guarantee of optimality, you can apply it to the mind without implying that every cognitive trait is perfectly designed. You can argue that reverse-engineering is the right place to start, while admitting that some cognitive features might be spandrels of other mental adaptations. This protects you from the charge of telling just-so stories, because you are framing the approach as a testing strategy rather than a conclusion. It also harmonizes your view with the gene's-eye perspective, because you can maintain that genes are the replicators without claiming that every phenotypic outcome is an optimal solution for those genes. You simply claim that selection is the only known mechanism for creating complex design, so it is the first thing we should look for, even if it is not always the answer.

  In summary, your position is mostly sound but rests on a rhetorical overreach in your first claim. You have built a house that is structurally solid but painted the front door with a sign that says no constraints allowed, while the interior is full of constraint-friendly furniture. If you change the sign to say that adaptation is the primary tool of investigation rather than the universal law of outcome, you will find that your endorsement of Gould, your acceptance of neutral theory, and your interest in evolutionary psychology all fit through the doorway without scraping the frame. You will lose the provocative punch of calling yourself unrepentant, but you will gain the credibility of someone who understands that the philosophy of biology has moved past the simple dichotomy of adaptation versus constraint. Given the audience you are writing for, that credibility is worth more than the rhetorical flair.
