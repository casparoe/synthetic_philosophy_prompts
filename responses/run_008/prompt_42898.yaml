      *   *Refining the "No Bold/No Bullets" constraint:* I must ensure I don't accidentally use markdown formatting like **bold** or *italics* if strictly interpreted, though usually "no bold text" allows for normal punctuation. I will avoid markdown headers and lists strictly. I will write in paragraphs.

      *   *Self-Correction on "No Bold":* The prompt says "no headings or bullet points or bold text". I should avoid bolding key terms even for emphasis. I will rely on sentence structure for emphasis.

      *   *Self-Correction on "Continuous Prose":* Ensure smooth transitions between paragraphs. No numbered lists even in the text (e.g., "first," "second" is okay, but not "1." "2.").

      *   *Checking the "Philosopher of Biology" Persona:* I need to sound like I know the literature (Sober, Gould, Dawkins, Williams) without lecturing. Use terms like "methodological vs. empirical adaptationism," "pan-selectionism," "phylogenetic inertia."

      *   *Final Polish:* Check against the specific request: "rank the real tensions by severity," "tell me what would have to give," "roughly what it costs me," "if I only revise one commitment, which single change cleans up the most mess."

      *   *Wait, one more check on (1):* "I never once came across a structure that didn't do its job well once you measured carefully enough." This is a classic adaptationist claim. But (3) says "vertebrate retina... instinct is always to reach for developmental constraint." The retina *is* a phenotype. So (1) says "phenotypes are optimal" and (3) says "this specific phenotype is suboptimal due to constraint." This is a direct contradiction. I need to highlight this specifically.

