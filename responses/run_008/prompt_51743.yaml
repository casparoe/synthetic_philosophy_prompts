  I'm taking an upper-level metaphysics course and we've just covered Kripke's origin essentialism — the idea that you couldn't have originated from a different sperm and egg — and my flatmate (a philosophy postgrad who will not let this go) thinks the standard cases all smuggle in the answer. His complaint is that the usual thought experiments vary everything at once: different gametes, different genome, different resulting traits, different person. Of course you get the essentialist intuition that way, he says, but it doesn't show the particular gametes are what's essential rather than the genetic information, or the causal history, or something about the resulting organism itself.

  So here's what I want: construct a pair of scenarios, one paragraph each, set in an ordinary fertility clinic — no demons, no teleporters, nothing a nurse wouldn't recognise — that pull those candidates apart. In one, (nearly) the same genetic information should be delivered by different gametes (think along the lines of a swapped sperm donor who is genetically identical to the intended father); in the other, the very same gametes should fuse but the information gets altered right at the start, moments after conception. The scenarios have to actually generate the verdicts rather than stipulate them: I want it to be the case that a Kripkean essentialist and a counterpart theorist are forced to disagree somewhere in the pair, and I want you to show where and why. Then walk through what each side should say about each scenario, identify explicitly which feature of the cases is doing the work, and give me the strongest attack my flatmate — playing the essentialist — could make on the pair. He's also already primed to bring up embryo splitting and identical twins, so dont lean on that as the twist.

  Since I'll be defending whichever scenario comes out cleaner against him over dinner, finish with a short honest note: which of your two scenarios you'd bet is the shaky one, where your reasoning in it is most likely to fail, and what specific consideration — an argument, a variation on the case, a way of individuating origins — would flip you to the other side. Please write the whole thing in British English.
