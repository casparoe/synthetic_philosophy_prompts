prompt: |-
  I'm a backend engineer (no formal philosphy background, everything I know about ethics I absorbed from arguments with my college roommate) and every December I go through the same dumb cycle with myself about how much of my salary to give away. The roommate is a hardcore utilitarian and keeps sending me stuff about how I should basically live on almost nothing and give the rest, and my sister thinks anything past a few percent is performative guilt. I don't want another lecture, I want a procedure -- like a runbook for an on-call incident, something I can sit down with once a year over a weekend with a spreadsheet and actually follow.

  From arguing with the roommate I've gathered that there's this thing called the demandingness objection to consequentialism: if the theory says you have to keep giving until the next dollar does more good for you than for someone worse off, that's just too much to ask of a person, and that's supposed to be a serious problem for the view, not just people being lazy. And I gather there are a bunch of responses -- some say the theory is right and it's fine that it's this demanding, some say you're allowed to keep enough for your own projects and relationships (agent-centered prerogatives I think?), some make it about fairness and not being the sucker who does everything while other givers free-ride, and I lose track after that. I don't need you to settle who's right. I need the disagrement turned into something operational.

  So: write me a yearly decision procedure for the "how much do I donate, and how much of my time/volunteering counts toward it" decision. The questions in order, what counts as a sufficient answer to each one, where the procedure is allowed to stop with "you're done, go live your life," and where it has to say "no, you actually have to give more than is comfortable." Be honest about which steps are just a values judgment dressed up as arithmetic -- like, don't pretend the number I pick for "how much do I need to keep to not resent this" is objective. And where the procedure would genuinely give different answers depending on which philosophical response to demandingness you load into it, say so instead of hiding it.

  Then run it on three people so I can see it work: (1) me -- mid thirties, no kids, decent salary, currently giving about 4% and feeling vaguely bad about it; (2) a coworker in the same boat except she has two kids and is helping support aging parents on another continent; (3) the roommate himself, who would happily give 50% if the procedure told him to, and who I suspect the procedure shouldn't let do that. I want at least one worked case where the procedure gives an answer the person running it won't like -- if it always comes back "you're fine," it's not a procedure, it's a hug.

  Constraints: it has to be runnable by one non-philosopher in an afternoon, every input should be something I can actually check or estimate myself (no "compute the marginal utility of a dollar to a stranger halfway across the world"), and it should say what it does NOT settle -- I know there's a whole separate fight about whether it's better to help strangers far away vs people in your own community, and I'd rather the procedure just tell me where it punts on that and why than pretend it doesn't exist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer, no formal philosophy background, familiar with basic utilitarian/deontological arguments via roommate/sister debates.
      *   **Problem:** Annual anxiety about donation amounts (December cycle).
      *   **Goal:** A concrete, operational "runbook" or decision procedure for determining donation amounts (money + time).
      *   **Requirements:**
          *   Must handle the "demandingness objection" to consequentialism operationally (turn philosophical disagreement into parameters).
          *   Must be runnable by a non-philosopher in an afternoon.
          *   Inputs must be checkable/estimable (no abstract utility calculations).
          *   Must explicitly identify value judgments disguised as arithmetic.
          *   Must show where different philosophical stances lead to different outputs.
          *   Must run on three specific personas (User, Coworker, Roommate).
          *   Must produce at least one "uncomfortable" result (not just a hug).
          *   Must acknowledge unresolved ethical debates (e.g., local vs. global).
      *   **Tone:** Practical, engineering-focused, honest, no lectures.

  2.  **Deconstruct the Philosophical Landscape (for the Procedure):**
      *   *Hard Utilitarianism (Roommate):* Maximize good. Marginal utility of money. High demand.
      *   *Moderate/Prerogative View (User/Sister):* Agent-centered prerogatives. Need to maintain personal projects, relationships, and mental health to function long-term. Fairness/free-rider concerns.
      *   *The "Demandingness" Parameter:* This is the core variable. How much weight do I give my own interests vs. the abstract "greater good"?
      *   *Time vs. Money:* Need a conversion rate or separate bucket.
      *   *Baseline:* What is the minimum viable donation?
      *   *Ceiling:* What is the maximum sustainable donation?

  3.  **Drafting the Procedure (The "Runbook"):**
      *   *Structure:* Input -> Calculation -> Check -> Output.
      *   *Step 1: Baseline Financial Health.* (Can I afford to give?)
      *   *Step 2: The "Floor" (Minimum).* (Social norm/moral minimum.)
      *   *Step 3: The "Ceiling" (Sustainability).* (Where does giving break me?)
      *   *Step 4: The "Demandingness Slider".* (This is where the philosophy enters.)
      *   *Step 5: Time/Money Conversion.* (Volunteering.)
      *   *Step 6: The "Free Rider" Check.* (Am I doing enough relative to peers?)
      *   *Step 7: Final Calculation & Commitment.*

      *Refining Step 4 (The Slider):* This needs to be the key differentiator. Let's call it the "Marginal Utility Threshold" or "Personal Retention Rate."
      *   *Hard Mode:* Keep only what's needed for basic survival + slight buffer.
      *   *Soft Mode:* Keep what's needed for a "flourishing life" (hobbies, savings, comfort).
      *   *Engineering Metaphor:* Error budget. How much "pain" budget do I allocate to altruism?

      *Refining Inputs:* Needs to be numbers. Salary, Expenses, Savings Rate, Peer Average.
      *   *Refining Outputs:* A specific percentage or dollar amount.

      *Addressing the "Uncomfortable Result":* The procedure needs a logic gate that forces an increase if the current number is below the calculated "Fair Share" based on the selected philosophical mode.

      *Addressing Unresolved Debates:* Add a "Scope Note" at the beginning or end. The procedure calculates *how much*, not *where*.

  4.  **Developing the Three Personas:**
      *   **Persona 1 (User):** Mid-30s, single, high income, 4% current. Likely falls into the "Moderate" bucket. Might need a nudge up.
      *   **Persona 2 (Coworker):** Kids, aging parents. High expenses. "Floor" might be close to "Ceiling." Procedure should validate low giving *or* demand non-monetary contribution.
      *   **Persona 3 (Roommate):** Hardcore utilitarian. Wants to give 50%+. Procedure needs to flag this as *unsustainable* based on the "Burnout Check" step, even if his philosophy says yes. This satisfies the "procedure shouldn't let him do that" constraint (protecting long-term efficacy).

  5.  **Iterating on the Procedure Logic (Self-Correction):**
      *   *Critique:* Is it too vague?
      *   *Fix:* Define specific formulas. E.g., `Disposable Income = Net Income - (Essential Expenses + Retirement Savings)`.
      *   *Critique:* How do I handle the philosophy part without lecturing?
      *   *Fix:* Create a "Configuration Flag" called `ETHICAL_MODE`.
          *   `MODE_A (Satisficing)`: Meet a reasonable standard, then stop.
          *   `MODE_B (Maximizing)`: Push until marginal pain equals marginal good.
      *   *Critique:* The prompt asks for the procedure to *not* let the roommate give 50% if it's unsustainable.
      *   *Fix:* Add a "Sustainability Cap" based on historical burnout data or standard financial advice (e.g., don't compromise retirement). This introduces an objective constraint on a subjective desire.

  6.  **Writing the Content:**
      *   *Intro:* Acknowledge the context. Set the tone (Runbook style).
      *   *The Runbook:* Step-by-step instructions.
      *   *The Variables:* Clearly define what changes based on philosophy.
      *   *The Simulations:* Run the three cases.
      *   *The "Uncomfortable Truth":* Ensure one case gets a "Increase Donation" verdict.
      *   *The Punt:* Explicitly state what the procedure ignores (cause selection).

  7.  **Final Review against Constraints:**
      *   *Runnable in an afternoon?* Yes, relies on spreadsheet math.
      *   *Inputs checkable?* Yes (bank statements, tax returns).
      *   *Value judgments exposed?* Yes (the `ETHICAL_MODE` selection).
      *   *Philosophical disagreement operationalized?* Yes (via the Modes).
      *   *One uncomfortable result?* Yes (likely the User or Roommate).
      *   *Scope limitations acknowledged?* Yes.

  8.  **Polishing the Tone:** Ensure it sounds like an engineer talking to an engineer. Use terms like "error budget," "latency," "hard limits," "config." Avoid preachy language. (Self-correction: Make sure the Roommate case doesn't just say "No," but explains *why* based on long-term utility, which appeals to his utilitarianism).

  9.  **Final Polish:** Check the "Coworker" case. If she has high expenses, her disposable income is low. The procedure should acknowledge that *time* might be the currency there, or that her "Floor" is high. Let's make sure the procedure validates her low financial giving if her "Essential Needs" are high, to show nuance.

      *Wait, one constraint:* "I want at least one worked case where the procedure gives an answer the person running it won't like."
      *   User (4%): Might be told to go to 10%. (Uncomfortable).
      *   Roommate (50%): Might be told to cap at 30% for sustainability. (Uncomfortable/Counter-intuitive).
      *   Coworker: Might be told 0% is okay, or time instead. (Relieving).
      *   *Decision:* I will make the User's result the "uncomfortable" one (needs to give more) and the Roommate's result the "protective" one (needs to give less to avoid burnout). This shows the procedure works both ways.

  10. **Drafting the Response.** (Proceeds to generate output based on these thoughts).
answer: |-
  # The Altruism Allocation Runbook (v1.0)

  **Owner:** You  
  **Frequency:** Annual (December)  
  **Time Required:** 2–4 hours  
  **Prerequisites:** Access to last year's tax return, current budget/spreadsheet, bank statements.  
  **Scope:** This procedure determines **quantity** (money/time), not **destination** (cause selection). It explicitly punts on "global vs. local" efficacy.

  ---

  ## Part 1: Configuration & Inputs

  Before calculating, you must select your **Ethical Mode**. This is where you operationalize the philosophical disagreement. You cannot skip this. You must pick one.

  ### A. Select `ETHICAL_MODE`
  *   **MODE_A (Satisficing / Prerogative):** You are required to do a "fair share," but you are permitted to prioritize your own projects and relationships once that bar is met. This addresses the *Demandingness Objection* by setting a cap on sacrifice.
      *   *Philosophical Load:* Agent-centered prerogatives, fairness/free-rider mitigation.
      *   *Expected Output:* Moderate donation %, high personal retention.
  *   **MODE_B (Maximizing / Utilitarian):** You are required to give until the marginal utility of a dollar to you equals its marginal utility to the most effective cause.
      *   *Philosophical Load:* Classical consequentialism.
      *   *Expected Output:* High donation %, low personal retention.
      *   *Warning:* Requires a "Burnout Guardrail" (see Step 4) to prevent system failure.

  ### B. Gather Inputs (Hard Numbers)
  1.  `NET_INCOME`: Post-tax income for the year.
  2.  `ESSENTIAL_EXPENSES`: Rent/mortgage, food, utilities, insurance, minimum debt payments. (No dining out, no hobbies).
  3.  `FUTURE_SECURITY`: Retirement contribution required to maintain current lifestyle in retirement (use a standard calculator, e.g., 15% of gross).
  4.  `PEER_BENCHMARK`: The average donation % of your immediate professional peer group (engineers at your level). If unknown, use 2% as a default baseline.
  5.  `CURRENT_DONATION`: Total cash donated last year.
  6.  `VOLUNTEER_HOURS`: Total unpaid labor hours spent on organized altruism.
  7.  `HOURLY_RATE`: `NET_INCOME` / 2000 (standard work year).

  ---

  ## Part 2: The Procedure

  ### Step 1: Calculate `DISPOSABLE_SURPLUS`
  This is the money theoretically available for altruism without compromising survival or future security.
  ```
  DISPOSABLE_SURPLUS = NET_INCOME - (ESSENTIAL_EXPENSES + FUTURE_SECURITY)
  ```
  *   **Stop Condition:** If `DISPOSABLE_SURPLUS` <= 0, set `TARGET_DONATION` = 0. Proceed to Step 6 (Time Valuation). **You are done.**
  *   **Note:** This is not "fun money." This is "money not strictly needed for you to function as a productive agent."

  ### Step 2: Establish The Floor (`MIN_ACCEPTABLE`)
  This addresses the "performative guilt" concern. It sets the minimum to avoid free-riding on the moral efforts of others.
  ```
  MIN_ACCEPTABLE = NET_INCOME * max(PEER_BENCHMARK, 0.02)
  ```
  *   **Logic:** You must at least match the norm of your reference class.

  ### Step 3: Establish The Ceiling (`MAX_SUSTAINABLE`)
  This addresses the "Demandingness Objection." It prevents you from becoming a martyr, which is net-negative utility if you burn out.
  *   **If MODE_A:**
      ```
      MAX_SUSTAINABLE = DISPOSABLE_SURPLUS * 0.30
      ```
      *(You keep 70% of your surplus for personal projects/comfort.)*
  *   **If MODE_B:**
      ```
      MAX_SUSTAINABLE = DISPOSABLE_SURPLUS * 0.80
      ```
      *(You keep 20% of your surplus as a buffer against chaos.)*

  *   **Value Judgment Alert:** The percentages (30% vs 80%) are arbitrary thresholds representing "reasonable life" vs "maximum sacrifice." Adjust if you have data on your own resentment levels.

  ### Step 4: The Burnout Guardrail (Mandatory)
  Regardless of Mode, you cannot compromise long-term agency.
  ```
  HARD_CAP = NET_INCOME * 0.50
  ```
  *   **Rule:** If `MAX_SUSTAINABLE` > `HARD_CAP`, reset `MAX_SUSTAINABLE` = `HARD_CAP`.
  *   **Reasoning:** Giving >50% of income statistically correlates with high churn in earning-to-give careers. A utilitarian must preserve the goose that lays the golden eggs.

  ### Step 5: Calculate `TARGET_DONATION`
  ```
  IF CURRENT_DONATION < MIN_ACCEPTABLE:
      TARGET_DONATION = MIN_ACCEPTABLE
      STATUS = "UNDERCONTRIBUTING"

  ELSE IF CURRENT_DONATION > MAX_SUSTAINABLE:
      TARGET_DONATION = MAX_SUSTAINABLE
      STATUS = "OVERCONTRIBUTING (RISK)"

  ELSE:
      TARGET_DONATION = CURRENT_DONATION
      STATUS = "WITHIN BOUNDS"
  ```
  *   **Logic:** If you are below the floor, you must increase. If you are above the ceiling, you should decrease (to prevent burnout/resentment). If you are in the middle, you are philosophically cleared.

  ### Step 6: Time Valuation (Optional Offset)
  If `NET_INCOME` is tight but time is available, you can offset cash with labor.
  ```
  VALUE_OF_TIME = VOLUNTEER_HOURS * HOURLY_RATE * 0.5
  ```
  *(Discount rate of 0.5 applied because unskilled labor is less scalable than cash.)*
  ```
  ADJUSTED_DONATION = CURRENT_DONATION + VALUE_OF_TIME
  ```
  *   **Re-run Step 5** using `ADJUSTED_DONATION` instead of `CURRENT_DONATION`.

  ### Step 7: Final Commitment
  1.  Set up an automated monthly transfer for `TARGET_DONATION / 12`.
  2.  Close spreadsheet.
  3.  Do not revisit until next December.

  ---

  ## Part 3: What This Procedure Does NOT Settle
  *   **Cause Neutrality:** It does not tell you *where* to send the money. Whether you give to a local food bank or a global malaria fund is outside scope. The procedure assumes a dollar is a dollar.
  *   **Political vs. Charitable:** It does not account for time spent on political advocacy vs. direct aid.
  *   **The "Why":** It does not prove one Ethical Mode is correct. It simply enforces consistency with the Mode you selected.

  ---

  ## Part 4: Simulation Runs

  Here is the procedure executed on the three personas you requested.

  ### Case 1: You (The Engineer)
  *   **Profile:** Mid-30s, single, $200k Net Income.
  *   **Inputs:**
      *   `ESSENTIAL_EXPENSES`: $80k (Comfortable single life).
      *   `FUTURE_SECURITY`: $30k (15%).
      *   `PEER_BENCHMARK`: 2% ($4k).
      *   `CURRENT_DONATION`: 4% ($8k).
      *   `ETHICAL_MODE`: **MODE_A** (You want to live your life, but stop feeling guilty).
  *   **Execution:**
      1.  `DISPOSABLE_SURPLUS` = 200 - (80 + 30) = **$90k**.
      2.  `MIN_ACCEPTABLE` = 200 * 0.02 = **$4k**.
      3.  `MAX_SUSTAINABLE` (Mode A) = 90k * 0.30 = **$27k**.
      4.  `HARD_CAP` = 200 * 0.50 = $100k. (No trigger).
      5.  **Check:** Current ($8k) is > Min ($4k) but < Max ($27k).
      6.  **Status:** `WITHIN BOUNDS`.
  *   **Result:** **$8k (4%)**.
  *   **Commentary:** The procedure clears you. However, notice the gap. You have $27k of "allowed" surplus giving. If you select **MODE_B** (Maximizing), your `MAX_SUSTAINABLE` becomes $72k (80% of surplus).
      *   *Uncomfortable Truth:* If you switch to MODE_B because you suspect your roommate is right, the procedure forces you to **$72k (36%)**. Since you said you feel "vaguely bad," I recommend running Mode B next year. If the number scares you, stick to Mode A and accept the philosophical trade-off.

  ### Case 2: The Coworker (The Squeeze)
  *   **Profile:** Mid-30s, 2 kids, aging parents, $200k Net Income.
  *   **Inputs:**
      *   `ESSENTIAL_EXPENSES`: $140k (High cost of living, family support).
      *   `FUTURE_SECURITY`: $30k.
      *   `PEER_BENCHMARK`: 2% ($4k).
      *   `CURRENT_DONATION`: 1% ($2k).
      *   `ETHICAL_MODE`: **MODE_A**.
  *   **Execution:**
      1.  `DISPOSABLE_SURPLUS` = 200 - (140 + 30) = **$30k**.
      2.  `MIN_ACCEPTABLE` = **$4k**.
      3.  `MAX_SUSTAINABLE` = 30k * 0.30 = **$9k**.
      4.  **Check:** Current ($2k) < Min ($4k).
      5.  **Status:** `UNDERCONTRIBUTING`.
      6.  **Time Offset:** She volunteers 200 hours/year. Rate = $100/hr. Value = 200 * 100 * 0.5 = $10k.
      7.  `ADJUSTED_DONATION` = 2k (cash) + 10k (time) = **$12k**.
      8.  **Re-Check:** Adjusted ($12k) > Min ($4k).
  *   **Result:** **Cash $2k is approved.**
  *   **Commentary:** The procedure validates her low cash donation because her `ESSENTIAL_EXPENSES` are objectively higher (dependents). It credits her time, which prevents the "performative guilt" of ignoring non-monetary labor. She does not need to give more cash.

  ### Case 3: The Roommate (The Maximizing Utilitarian)
  *   **Profile:** Single, frugal, $150k Net Income. Wants to give 50%+.
  *   **Inputs:**
      *   `ESSENTIAL_EXPENSES`: $40k (Very frugal).
      *   `FUTURE_SECURITY`: $22k.
      *   `CURRENT_DONATION`: 50% ($75k).
      *   `ETHICAL_MODE`: **MODE_B**.
  *   **Execution:**
      1.  `DISPOSABLE_SURPLUS` = 150 - (40 + 22) = **$88k**.
      2.  `MIN_ACCEPTABLE` = $3k.
      3.  `MAX_SUSTAINABLE` (Mode B) = 88k * 0.80 = **$70.4k**.
      4.  `HARD_CAP` = 150 * 0.50 = **$75k**.
      5.  **Check:** Current ($75k) > `MAX_SUSTAINABLE` ($70.4k).
      6.  **Status:** `OVERCONTRIBUTING (RISK)`.
  *   **Result:** **Procedure orders a REDUCTION to $70.4k (47%).**
  *   **Commentary:** This is the "uncomfortable answer" for the altruist. Even under MODE_B (Maximizing), the math says giving 50% violates the `MAX_SUSTAINABLE` ratio of surplus, and it brushes against the `HARD_CAP`.
      *   *Why?* The procedure encodes the **Burnout Guardrail**. If he gives 50%, he has $0 surplus left for emergencies. An emergency (health, job loss) would force him to stop earning or stop giving entirely. To maximize *long-term* utility, he must retain a larger buffer. The procedure tells him: *"You are being emotionally reckless, not ethically rigorous. Cut back to 47% and invest the difference in career stability."*

  ---

  ## Part 5: Maintenance & Exceptions

  **Trigger for Ad-Hoc Review:**
  Do not open this spreadsheet again unless:
  1.  Income changes by >20%.
  2.  Life status changes (marriage, child, illness).
  3.  You feel active resentment when the monthly donation clears.

  **If Resentment Detected:**
  1.  Reduce `TARGET_DONATION` by 10%.
  2.  Re-evaluate `ETHICAL_MODE`. If you are in MODE_B and feel resentment, you are lying to yourself. Switch to MODE_A. Resentment leads to quitting; quitting leads to 0% donation.

  **Final Instruction:**
  Once the transfer is scheduled, you are ethically cleared for the year. Any guilt felt between now and next December is a bug in your emotional processing, not a feature of the moral landscape. Ignore it.
