answer: |-
  # Joint Statement on Pure Time Preference

  **Date:** October 26, 2023
  **Parties:** [Your Name] (Anti-PTP) & [Brother's Name] (Pro-PTP)

  ### 1. What We Agree On

  We acknowledge the following claims as common ground. We accept these as the baseline for our disagreement, ensuring we are not talking past one another regarding definitions or basic math.

  1.  **Definition:** "Pure Time Preference" (PTP) refers strictly to discounting future welfare solely because it occurs later in time, holding constant probability of existence, wealth levels, and identity.
  2.  **Uncertainty is Distinct:** Discounting due to the risk that the beneficiary will not exist (death, catastrophe) or that the benefit will not materialize is rational and separate from PTP.
  3.  **Opportunity Cost is Distinct:** Discounting due to the potential for investment growth (compound interest, capital returns) is rational and separate from PTP.
  4.  **Time Consistency:** Dynamic inconsistency (hyperbolic discounting), where preferences reverse merely due to the passage of time, is generally irrational and leads to self-defeating behavior. We agree exponential discounting is the consistent model.
  5.  **Welfare Focus:** The debate concerns the discounting of *welfare* (well-being, utility), not merely financial assets.
  6.  **Compounding Effects:** Small differences in the discount rate produce massive differences in present value over long time horizons (e.g., 200+ years).
  7.  **Normative Scope:** This question applies to both personal prudence (individual life planning) and social policy (climate change, infrastructure).
  8.  **Descriptive vs. Normative:** We distinguish between whether people *do* discount the future (descriptive, empirically yes) and whether they *should* (normative, the subject of this dispute).
  9.  **Zero-Rate Implication:** A PTP of 0% implies that, absent uncertainty, the welfare of future generations counts equally with the welfare of the present generation.
  10. **Positive-Rate Implication:** A positive PTP implies that identical welfare occurring later is intrinsically less valuable than welfare occurring now.

  ### 2. Where We Still Disagree

  | # | Topic | Anti-PTP Position (Me) | Pro-PTP Position (Brother) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Nature of Impatience** | Impatience is a cognitive bias or limitation, akin to a visual illusion; it should be corrected upon reflection. | Impatience is a legitimate "taste" or preference structure; satisfying it is rational even upon reflection. |
  | **2** | **Personal Prudence** | In a "Certain Delay" case (guaranteed existence, no investment return), preferring 1 unit of welfare now over 1 unit later is irrational. | In a "Certain Delay" case, preferring 1 unit of welfare now over 1 unit later is rational, even if the amounts are identical. |
  | **3** | **Moral Relevance of Time** | Temporal location is morally arbitrary, analogous to spatial location or race; discounting by date is discrimination. | Temporal location is phenomenologically relevant; the "nowness" of experience grants it special weight in decision-making. |
  | **4** | **Climate Policy** | We should sacrifice significant current consumption to prevent harms 200 years out, as those harms are not discounted by time. | We should limit current sacrifice for distant harms, as the discounted value of those future benefits is lower. |
  | **5** | **Social Planner Role** | A government/social planner should use a 0% PTP to avoid imposing the current generation's bias on the future. | A social planner should reflect the citizenry's positive time preference to respect democratic preferences and efficiency. |

  ### 3. Cruxes

  We have identified three specific areas where our intuitions diverge sharply. We agree that if our predictions about these scenarios turn out false, we should update our views.

  **Crux 1: The "Vividness" Confound (Epistemic vs. Ontological)**
  *   **The Thought Experiment:** Imagine a technology that allows you to experience your future welfare (pleasure or pain) with the exact same phenomenological vividness as present welfare, removing all "imaginative friction." You know with 100% certainty it will happen.
  *   **The Question:** Does the rational discount rate drop to 0% in this scenario?
  *   **Anti-PTP Prediction:** Yes. The only reason we discount is that the future feels vague. If vividness is equal, time is irrelevant. If the Brother still discounts here, he is admitting PTP is not just a "taste" but a brute irrationality.
  *   **Pro-PTP Prediction:** No. Even with perfect vividness, I would still prefer the good experience to happen *now* rather than *later*. The "date" itself carries weight independent of vividness. If the Anti-PTP side becomes indifferent, they are admitting PTP is partly rooted in epistemic limits, not just moral principle.

  **Crux 2: The "Painful Injection" (Personal Symmetry)**
  *   **The Thought Experiment:** You must receive a painful medical injection. It is identical in intensity and duration. You can choose to have it today or in one year. There are no medical consequences to timing, no investment returns on the cost, and you are guaranteed to exist in one year.
  *   **The Question:** Is there a rational preference for one date over the other?
  *   **Anti-PTP Prediction:** Indifference. Pain is pain. Deferring it solely because it is later treats your future self as a stranger. Choosing to defer implies you think your future self's pain matters less, which is arbitrary.
  *   **Pro-PTP Prediction:** Rational to defer. Just as I prefer pleasure sooner, I prefer pain later. This asymmetry is a coherent preference structure. If the Anti-PTP side admits they would defer, they admit *some* time preference exists; if they remain truly indifferent, we can test if that holds up under stress.

  **Crux 3: The "Generation Ship" (Impersonal Trade-off)**
  *   **The Thought Experiment:** We have resources to improve life on one of two colony ships. Ship A leaves in 100 years. Ship B leaves in 200 years. The beneficiaries are strangers in both cases. The improvement is identical. Survival is guaranteed for both.
  *   **The Question:** As a social planner, do we prioritize Ship A over Ship B?
  *   **Anti-PTP Prediction:** Indifference (flip a coin). Prioritizing Ship A is discrimination by date of birth.
  *   **Pro-PTP Prediction:** Prioritize Ship A. The sooner the welfare is realized, the better, even for strangers. If the Anti-PTP side agrees we should prioritize Ship A, they concede that impersonal PTP has some merit.

  ### 4. The Verbal Part

  We suspect a portion of our dispute is verbal, specifically regarding the definition of **"Rationality."**

  *   **The Conflict:** When the Brother says "It is rational to have a time preference," he is using an *instrumental* definition of rationality: "It is rational to satisfy your current preferences, whatever they are." If I currently prefer now to later, satisfying that is rational by definition.
  *   **The Counter:** When I say "It is irrational," I am using a *substantive* definition of rationality: "There are objective constraints on what preferences one should hold, akin to logic or math."
  *   **Why It Matters:** If we are using the instrumental definition, the Brother wins trivially (preferences are axiomatic). If we use the substantive definition, I win trivially (time is arbitrary).
  *   **Resolution Attempt:** We agree to steer clear of the word "rational" where possible and instead ask: **"Is this a preference we should try to educate away in ourselves and our children, or one we should accommodate?"** If the Brother thinks we should educate children to be less impatient, he concedes it's a bias. If he thinks we should teach them to respect their impatience, he maintains it's a taste. This behavioral question cuts through the semantic deadlock.
