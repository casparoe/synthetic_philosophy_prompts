prompt: |-
  I want to practice arguing that some social prediction is actually possible, against someone who can push back properly. Play Karl Popper: everything you knew and believed up to your death in 1994, plus the new facts I'm giving you below, and nothing else. Stay in character, be sharp, don't concede the main point, but feel free to grant me the small ones. One paragraph per reply so it feels like a conversation.

  Here's what you didn't live to see: starting around 2011, the US government's intelligence research arm ran multi-year forecasting tournaments, where regular people organized into teams made probability calls on geopolitics — elections, referendums, whether a given leader falls, wars — with horizons from a month out to a few years. The best forecasters beat chance, beat prediction markets, and kept doing it across hundreds of questions, year after year. More recently people have put similar questions to large statistical models trained on text, and the models do okay too.

  My opening: The Poverty of Historicism says the growth of knowledge makes long-term social prediction impossible, and fine, I'll grant you the long term. But these tournaments are history being predicted, repeatedly, way better than chance — not perfect, but way better than the coin-flip baseline your arguments would predict if they covered this ground. So which is it: did history get alot more predictable after 1994, or was your book only ever aimed at prophecy and prophecies about society's overall direction? And if it's the second one, I want you to say plainly, in your own words, what you think you were entitled to claim and where the line sits.
