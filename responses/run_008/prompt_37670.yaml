  8.  *(Self-Correction during drafting)*: I need to be careful not to take sides. The user asked for a diagnosis, not a verdict. I must remain neutral on whether guilt or shame is *better*, focusing only on why they can't agree. I should also acknowledge the user's background—marine geology implies understanding sedimentation, layers, and deep time. Maybe use a metaphor there? (e.g., trying to date a rock layer that keeps changing composition). Actually, keep it direct. The user is smart; they don't need forced metaphors.

