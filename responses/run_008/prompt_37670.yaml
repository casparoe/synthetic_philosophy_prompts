answer: |-
  This is a remarkably clear description of a classic impasse in moral psychology and social philosophy. Your hypothesis is sharp, and your instinct that definitions are being weaponized is correct. However, based on the literature and the structure of the debate you've described, I believe the deadlock is overdetermined. It is not just a conceptual sleight of hand; it is a collision of three distinct layers of disagreement that the group is treating as one.

  Here is a diagnosis of the deadlock, broken down by the type of disagreement occurring at each layer, followed by a verdict on whether the question itself is the problem.

  ### 1. The Taxonomic Knot (Conceptual)
  Your hypothesis hits hardest here. You are correct that both sides are engaging in a "No True Scotsman" maneuver regarding the independent variable.

  *   **The Pro-Guilt Side** is operating with a **legalistic/clinical definition**. They are defining guilt as *action-oriented* and shame as *identity-oriented*. This draws heavily on the work of psychologists like June Tangney, who empirically distinguish guilt ("I did something bad") from shame ("I am bad"). In this framework, shame is almost by definition maladaptive because it threatens the self.
  *   **The Pro-Shame Side** is operating with a **sociological/anthropological definition**. They are defining shame as *social cohesion*. They are drawing on the tradition of Ruth Benedict (despite her dichotomy being largely debunked) and contemporary sociologists like Thomas Scheff. In this framework, "shame" is the emotional enforcement of shared values. If it motivates repair, they count it as "healthy shame," whereas the other side would classify that same emotion as "guilt."

  **Diagnosis:** You cannot run an empirical test when the two sides are measuring different things. One side is measuring an intrapsychic mechanism (guilt vs. shame as distinct emotions), and the other is measuring a social function (individual sanction vs. group sanction). Until the group agrees on whether they are discussing *phenomenology* (what it feels like) or *function* (what it does), they will talk past each other.

  ### 2. The Teleological Knot (Normative)
  You suspected this might be a value disagreement in disguise. It is. This is the "deeper work" driving the definitional stubbornness.

  *   **The Pro-Guit Side** values **autonomy and pluralism**. Their ideal society is one where individuals can coexist without sharing a thick conception of the "good life." Guilt works here because it relies on internalized rules about harm and rights, which can be universalized across different subcultures. They want a moral system that minimizes interference.
  *   **The Pro-Shame Side** values **virtue and cohesion**. Their ideal society is one where character is cultivated and social bonds are tight. Shame works here because it relies on a shared vision of what a "good person" looks like. They want a moral system that maximizes alignment.

  **Diagnosis:** This is not resolvable by evidence. If you show the Pro-Guilt side a society where shame creates perfect harmony, they will call it oppressive conformity. If you show the Pro-Shame side a society where guilt creates perfect rights-protection, they will call it cold and alienating. They are arguing about the *purpose* of morality, not just the machinery.

  ### 3. The Agency Knot (Structural)
  This is the layer your group may be missing entirely, and it relates to the premise: *"If a society could somehow pick..."*

  *   **The Pro-Choice Side** treats moral emotions like **policy levers**. They assume institutions (schools, laws, parenting styles) can be tuned to produce more guilt or more shame.
  *   **The Skeptic Side** treats moral emotions like **ecological outcomes**. They argue that guilt and shame are downstream effects of social structure. You cannot have a "shame culture" in a large, anonymous, pluralistic nation-state, because shame requires an audience that knows you and cares about your standing. You cannot have a "guilt culture" in a small, kinship-based tribe, because the cost of anonymity is too high.

  **Diagnosis:** This is a category error. Societies do not choose their dominant moral emotions any more than a river chooses its speed; the speed is determined by the gradient and the volume. A society "picks" its population density, its economic interdependence, and its religious homogeneity. The moral emotions follow causally. Asking "should we choose guilt or shame?" is like asking "should we choose to be a mountain or a valley?" You can choose where to build, but you can't choose the topography independent of the geology.

  ### Verdict: Is it the group's fault or the question's?

  It is primarily the **question's fault**, exacerbated by the group's methodology.

  The question *"Guilt or Shame?"* is a false dichotomy inherited from mid-20th-century anthropology (specifically Ruth Benedict's *The Chrysanthemum and the Sword*) that most contemporary researchers have moved away from. Modern affective neuroscience suggests these emotions are not binary switches but overlapping states that co-occur. Furthermore, the premise that a complex modern society can "choose" its emotional regime top-down is sociologically naive.

  The reason you have had zero movement in a year is that you are trying to solve a **category error** using **empirical evidence**.

  ### What would count as progress?

  If the group wants to break the deadlock without dissolving, I recommend the following three steps, in order:

  **1. Agree on a Taxonomy (The "Geological" Fix)**
  Stop using the words "Guilt" and "Shame" as monolithic blocks. Adopt a functional taxonomy. For example:
  *   *Internal Sanction vs. External Sanction*
  *   *Act-Focus vs. Agent-Focus*
  *   *Repair-Motivation vs. Hiding-Motivation*
  Ask the group to map their arguments onto these axes. They will likely find that the Pro-Guilt side wants *Internal/Act-Focus*, and the Pro-Shame side wants *External/Agent-Focus*. This reveals that they are arguing about *location* and *target*, not the specific emotion names.

  **2. Split the Normative from the Descriptive**
  Hold a session dedicated solely to the Teleological Knot. Ask: *"What is the single most important job of a moral system?"*
  *   Is it to prevent harm between strangers? (Favors Guilt mechanisms)
  *   Is it to cultivate excellence among neighbors? (Favors Shame mechanisms)
  Once they admit they are optimizing for different outcomes, the empirical debate becomes less heated. They can acknowledge that "If we want X, we need mechanism Y," rather than fighting over whether mechanism Y is objectively "better."

  **3. Reframe the "Choice"**
  Abandon the "If a society could pick" premise. Replace it with: *"Given the structural constraints of our specific society (large, pluralistic, digital), which moral emotions are sustainable?"*
  This moves the debate from utopian engineering to adaptive management. It allows the Pro-Shame side to argue for "pockets of shame" (families, clubs, local communities) while the Pro-Guilt side argues for "guilt as the public lingua franca." This is a synthesis that actually exists in functioning democracies.

  ### Summary
  Your hypothesis is right: the definitions are moving targets. But the reason they are moving is that the group is trying to use a single lever to solve a problem that involves **semantics** (what are these words?), **values** (what do we want?), and **structure** (what is possible?).

  If I were to offer a geologist's perspective: You are trying to date a rock layer using a method that assumes the layer is uniform, when the strata are actually folded, faulted, and composed of different minerals depending on where you sample. The disagreement isn't about the age of the rock; it's about the map you're using to read the formation.

  **Recommendation:** Propose a "moratorium on the G-word and the S-word." Force the group to describe the *mechanisms* they want without using the loaded labels. If they can agree on the machinery (e.g., "we want internalized repair for crimes, but social reputation tracking for civic virtue"), the deadlock will vanish, even if they refuse to agree on what to call it.
