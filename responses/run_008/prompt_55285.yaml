      *Self-Correction on Grade:* If I'm advising a chemist who wants to be rigorous: In science, a wrong citation or misinterpretation of a foundational theory invalidates the conclusion. In philosophy, misreading Williams is akin to misreading the data. However, the student *did* answer the prompt structurally. I'll assign a **B-** but emphasize that the content errors are severe.

  5.  **Drafting the Feedback:**
