      }
    ],
    "separateness_verdict": "Survives shifted. Tracks inviolability of agents, not metaphysical distinctness.",
    "friends_counterattack": "No. Harsanyi requires the 'single subject' model. If moral boundaries are robust despite metaphysical fuzziness, the veil of ignorance does not dissolve the prohibition on sacrificing one agent for another."
  }
