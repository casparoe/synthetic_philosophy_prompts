    "diagnosis": "Equivocation on 'Person'. Steps 1-3 treat 'person' as a moral unit of account (rights/agency). Steps 4-5 treat 'person' as a metaphysical bundle of psychological connections. The argument assumes moral standing must track metaphysical granularity. Rejecting this allows moral boundaries to remain sharp (saving 1 & 6) even if metaphysical boundaries are fuzzy.",
    "cost_table": [
