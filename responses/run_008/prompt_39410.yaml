answer: |-
  **Case Analysis: *Re A (Children) (Conjoined Twins: Surgical Separation)* [2000]**
  **Focus: The Doing/Allowing and Killing/Letting Die Distinction**

  **1. Mapping the Intervention: Act, Omission, or Redirection?**

  To apply the doing/allowing framework to *Re A*, one must first categorise the surgeon's scalpel work. On a purely physical description, the separation was a positive act. The surgeons clamped and severed the shared artery. Without this intervention, Mary would have continued to receive blood; with it, she died. This aligns with the paradigm of 'killing': initiating a causal sequence that results in death.

  However, the physiological context complicates this. One could argue that Jodie's circulatory system was functioning as life support for Mary. From this perspective, separation was not an attack on Mary, but the withdrawal of life-sustaining treatment provided inadvertently by Jodie. If Jodie had been a machine, turning her off would be an omission (or a cessation of aid). The difficulty arises because Jodie is a rights-bearing person, not a resource.

  A third mapping, favoured by some ethicists in this context, is the redirection of a lethal threat. The 'threat' to Jodie's life was Mary's drain on her heart. The surgery stopped this drain. However, unlike a standard trolley problem where a threat is diverted away from five onto one, here the 'threat' (the shared circulation) is also Mary's lifeline. You cannot stop the drain without killing the drainer.

  Consequently, the case sits uneasily in all three categories. It is physically an act of killing, functionally a withdrawal of shared physiological support, and strategically a redirection of a fatal process. This ambiguity is the first sign that the doing/allowing distinction is straining under the weight of the facts.

  **2. Applying the Debate: Rachels vs. The Traditionalists**

  If we apply James Rachels' famous argument regarding active and passive euthanasia, the distinction between doing and allowing is morally irrelevant. Rachels contends that if the outcome is identical (or better), the method does not carry independent moral weight. In *Re A*, the 'allowing' scenario (non-intervention) leads to two deaths. The 'doing' scenario (surgery) leads to one death and one life saved. For a Rachels-style consequentialist, the surgery is not only permissible but obligatory. The fact that the surgeon must cut an artery (doing) rather than wait for cardiac arrest (allowing) is a biological detail, not a moral barrier. The moral focus shifts entirely to the net preservation of life.

  Conversely, the traditionalist view (championed by philosophers like Philippa Foot or Warren Quinn) holds that the distinction tracks something real: the difference between initiating a fatal sequence versus declining to prevent one. For the traditionalist, there is a strong presumption against directly killing an innocent person, even to save another. On this view, the surgeons would be prohibited from operating. Severing the artery makes the surgeon the agent of Mary's death. Merely allowing nature to take its course leaves the cause of death as Mary's own physiological defects.

  However, *Re A* forces the traditionalist into a corner. If they forbid the surgery, they condemn Jodie to death as well. Some traditionalists might attempt to reframe the act: they could argue Mary is the aggressor (unintentionally) and the surgery is a defensive stopping of her attack on Jodie. Yet, this stretches the definition of 'aggression' beyond its usual moral limits, as Mary possesses no agency.

  **3. The Reverse Direction: What the Case Does to the Theory**

  Your hunch is correct: *Re A* is an anomaly that the doing/allowing framework was not built to accommodate. The framework generally presupposes distinct agents and distinct patients. It assumes a boundary between 'self' and 'other' that conjoined twins, in this specific physiological configuration, blur.

  First, the framework struggles with the concept of 'life support' when the support is another human being's body. In standard 'letting die' cases (e.g., turning off a ventilator), the patient is dependent on external technology. In *Re A*, Mary was dependent on Jodie's internal organs. To treat Jodie's body as 'treatment' that can be withdrawn objectifies Jodie in a way the standard omission framework does not anticipate.

  Second, the certainty of outcome challenges the risk assessment inherent in the distinction. Usually, 'allowing to die' implies a risk that treatment might fail anyway. Here, separation guaranteed Mary's death. This removes the 'uncertainty' buffer that often makes omissions feel less culpable than acts.

  Third, the judicial reasoning highlights the theoretical silence. As you noted, the three Court of Appeal judges reached the same conclusion via different routes. Lord Justice Ward focused on best interests; Lord Justice Brooke leaned heavily on necessity and quasi-self-defence; Lord Justice Robert Walker focused on a balance of rights. The fact that none could rely solely on a clean act/omission distinction suggests the legal and ethical categories were insufficient. Specifically, Brooke LJ's reliance on self-defence is an admission that the act was indeed a 'killing' that required a specific justification outside standard medical consent or omission protocols. The doing/allowing framework goes silent here because it cannot easily categorise a situation where saving one life *requires* the active termination of another, where the two are physiologically fused.

  **4. Critiquing the Necessity and Violinist Analogies**

  **The Doctrine of Necessity (Your Tutor)**
  Your tutor's focus on necessity is legally pragmatic but ethically evasive regarding your specific question. The doctrine of necessity is a defence raised *after* a wrong (like homicide) has been established. It admits the act was done but argues it was the lesser of two evils.
  *   **Why it's unsatisfying for your analysis:** It bypasses the doing/allowing question entirely. Necessity accepts that the surgeons *killed* Mary (doing) but justifies it to save Jodie. It does not help you determine whether the act was morally equivalent to letting them both die. It solves the legal liability problem, not the ethical classification problem. Relying on it prevents you from analysing the moral texture of the intervention itself.

  **Thomson's Violinist (Your Flatmate)**
  Judith Jarvis Thomson's violinist analogy argues that you have a right to disconnect your body from another person, even if it kills them, because you did not consent to the use of your kidneys.
  *   **Why it fails here:** The analogy collapses on the mechanics of 'unplugging'. In Thomson's scenario, the agent (you) simply detaches themselves. It is a refusal to continue providing aid (an omission/allowing). In *Re A*, Jodie could not 'unplug' herself. A third party (the surgeon) had to intervene and perform a positive act (cutting) that actively caused Mary's death.
  *   Furthermore, Thomson's argument rests on bodily autonomy and consent. In *Re A*, the 'host' (Jodie) was an infant incapable of consent, and the decision was made by the court over the parents' objections. The Violinist analogy works for the right to *refuse* treatment, but it does not justify a third party *performing* a lethal procedure to effect that separation. Your flatmate's comparison ignores the agency of the surgeon, which is central to the doing/allowing distinction.

  **5. Conclusion: Where the Framework is Silent**

  To answer your request for honesty regarding the framework's limitations: the doing/allowing distinction assumes a world where bodies are separate and resources are external. *Re A* presents a scenario of biological interdependence where one life is physically sustained by the other's vital functions.

  In this context, the framework is silent on two key points:
  1.  **The Moral Status of Shared Physiology:** It cannot tell us whether Jodie's blood flow counts as 'her body' (which she has a right to protect) or 'Mary's life support' (which might be withdrawable).
  2.  **Third-Party Intervention:** It cannot easily resolve when a third party is permitted to actively kill one person to stop them from passively killing another through physiological dependence.

  For your assignment, the strongest approach is to argue that *Re A* exposes the boundary conditions of the doing/allowing distinction. It demonstrates that while the distinction works for standard end-of-life care (ventilators, feeding tubes), it fractures when the 'treatment' is the body of another innocent person. The case suggests that in instances of fatal interdependence, the distinction between doing and allowing collapses, forcing us to rely instead on consequentialist balancing (the necessity defence) or rights-based conflict resolution, neither of which sits comfortably within the traditional doing/allowing taxonomy.
