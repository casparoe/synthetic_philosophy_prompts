      *   **Friend's Argument:** Consequentialism requires maximizing good outcomes -> spending on self beyond subsistence is wrong (like letting a child drown) -> Singer's drowning child argument supports this -> This is too demanding (destroys integrity, per Williams) -> Therefore, consequentialism is refuted (proves too much).
      *   **User's Intuition:** The demandingness point is serious, but the leap to "refuted" feels too quick. Suspects conflation of distinct claims.
      *   **Task:** Audit the friend's summary piece by piece. Identify what's accurate, what's conflated/overstated, and where the friend misdescribes the position.
      *   **Specific Questions to Address:**
          1.  Is Singer's drowning child argument meant to establish *all* that the friend extracted, or is it specific to aid?
          2.  Is the "strong version" of Singer's principle the only one, or even the one he currently holds?
          3.  Is Williams's integrity objection the same as the demandingness objection?
          4.  Is "no plausible theory could demand this" an assumption consequentialists must accept (or do they bite the bullet)?
          5.  Does the either/or conclusion (accept equivalence or abandon theory) follow from the corrected premises?
          6.  Validate the user's inclination (demandingness is a cost, not necessarily a refutation).

  2.  **Deconstruct the Friend's Argument (Piece by Piece Audit):**

      *   *Claim 1: "Consequentialism says an act is right if and only if it brings about the best outcome."*
          *   **Status:** Mostly accurate definition of *Act Consequentialism* (specifically Maximizing).
          *   **Nuance:** There are satisficing versions, rule consequentialism, etc., but this is the standard target.

      *   *Claim 2: "That means any money you spend on yourself beyond bare subsistence... is a choice to let someone die."*
          *   **Status:** Accurate implication of *Maximizing Act Consequentialism* + *Marginal Utility Principle*.
          *   **Nuance:** "Bare subsistence" is a bit strong; it's usually "until the marginal utility of your money equals the marginal utility of donating it." But effectively, yes, luxury spending is morally suspect under strict maximizing.

      *   *Claim 3: "Singer's famous famine-relief argument makes this vivid... equally obliged to send the money..."*
          *   **Status:** Accurate representation of Singer's 1972 argument.
          *   **Nuance:** Singer uses this to argue *for* a specific moral obligation, not necessarily to define all of consequentialism, though they align.

      *   *Claim 4: "...the strong version of his principle says you must keep giving until the sacrifice to you is morally comparable to what the recipient gains."*
          *   **Status:** Accurate regarding Singer's 1972 "strong principle."
          *   **Nuance:** Singer later moderated this (1979/2009) to a "moderate principle" (prevent bad without sacrificing anything of *comparable* moral significance vs. *anything* of moral significance). This is a key point to clarify.

      *   *Claim 5: "Since almost no one... lives anywhere near that point, ordinary comfortable life turns out to consist of continuous wrongdoing."*
          *   **Status:** Accurate implication of the strong principle.
          *   **Nuance:** This is the "Overdemandingness Objection."

      *   *Claim 6: "But no remotely plausible moral theory could demand that of people..."*
          *   **Status:** This is the crux of the disagreement.
          *   **Nuance:** Consequentialists often reject this premise. They argue morality *is* demanding. This is a "bullet-biting" move.

      *   *Claim 7: "...and philosophers like Bernard Williams showed that consequentialism destroys the integrity of a person's own projects..."*
          *   **Status:** Williams's objection is distinct from simple demandingness. It's about *alienation* and *integrity*, not just effort/sacrifice.
          *   **Nuance:** Conflating Williams with the demandingness objection is a common error.

      *   *Claim 8: "...so consequentialism is refuted. It proves too much."*
          *   **Status:** This is the conclusion.
          *   **Nuance:** "Refuted" is strong. It shows a counter-intuitive result, but whether that kills the theory depends on whether you value intuition over theoretical consistency.

      *   *Claim 9: "Either you accept that buying a coffee is morally on a par with letting a child drown, or you give the theory up."*
          *   **Status:** False dichotomy.
          *   **Nuance:** One can accept the theory and argue the coffee isn't *exactly* par (due to psychological burnout, long-term effectiveness, etc.) or accept the theory and accept the moral guilt (bullet-biting).

  3.  **Drafting the Response (incorporating specific questions):**

      *   *Introduction:* Acknowledge the user's intuition (it's well-founded). The friend's argument is a standard "Overdemandingness Objection," but it compresses several distinct philosophical moves.
