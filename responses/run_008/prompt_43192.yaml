      *   *Section 2: Singer's Drowning Child.* Clarify the timeline. 1972 (Strong) vs. Later (Moderate). The friend treats the 1972 version as the only one. Singer himself softened the view to make it more palatable, though he still thinks we should give a lot. Also, distinguish between an argument for *aid* vs. a definition of *right action* generally.
      *   *Section 3: Williams vs. Demandingness.* This is crucial. Demandingness = "It asks too much sacrifice." Williams = "It asks you to abandon your *identity*." Explain the "one thought too many" or the "government house" utilitarian vs. the person with projects. They are related but distinct.
      *   *Section 4: The "Plausibility" Premise.* Address the "no plausible theory could demand this" claim. Consequentialists (like Kagan, Singer) often reply: "Morality isn't about being comfortable." The "bullet-biting" response. The friend assumes common sense morality is the metric; consequentialists challenge common sense.
      *   *Section 5: The Either/Or Conclusion.* Show why it doesn't follow. Options: Satisficing Consequentialism, Rule Consequentialism, or accepting the demand but mitigating it via psychological facts (burnout reduces long-term good).
      *   *Conclusion:* Validate the user's feeling. The objection highlights a tension, not a logical contradiction. It's a cost, not a refutation.

  4.  **Refining the Tone:**
      *   Needs to be analytical, precise, and philosophical but accessible.
      *   Avoid taking sides dogmatically, but clearly delineate where the friend's reconstruction is shaky.
      *   Ensure all specific questions from the prompt are answered.

  5.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I distinguish between Act Consequentialism and Rule Consequentialism? The friend implies Act. I should note that Rule Consequentialism might avoid the extreme demand.
      *   *Check:* Did I explain Williams clearly? It's easy to muddle. Focus on "integrity" and "ground projects."
      *   *Check:* Did I address Singer's current view? Yes, mention the shift from "comparable moral significance" to "significant moral significance."
      *   *Check:* Did I address the "coffee vs. drowning" equivalence? Consequentialists might argue that systemic change is better than individual sacrifice, or that self-care maintains efficacy.

  6.  **Final Polish:** Organize with clear headings corresponding to the user's specific queries for readability. (Proceed to generate output based on this structure.)
answer: |-
  Your intuition is well-founded. Your friend has constructed a classic version of the **"Overdemandingness Objection,"** but in compressing it for an evening argument, he has conflated distinct philosophical claims, treated contingent interpretations as necessary truths, and presented a false dichotomy as a logical conclusion.

  While the core tension he identifies is real (consequentialism *is* demanding), his claim that this constitutes a *refutation* relies on premises that a serious consequentialist would reject or nuance.

  Here is an audit of his summary, piece by piece, addressing your specific questions.

  ### 1. The Definition and the "Coffee" Claim
  **Friend's Claim:** *"Consequentialism says an act is right if and only if it brings about the best outcome. That means any money you spend on yourself beyond bare subsistence... is a choice to let someone die."*

  *   **Audit:** **Mostly Accurate, but specific to Act Consequentialism.**
      *   **Faithful:** This is an accurate description of **Maximizing Act Consequentialism**. If the right act is *the* act that produces the most good, and money spent on coffee produces less good than money spent on malaria nets, then buying the coffee is objectively sub-optimal.
      *   **Conflation:** He treats "Consequentialism" as a monolith. There are **Satisficing Consequentialists** (an act is right if it produces *enough* good, not necessarily the *most*) and **Rule Consequentialists** (an act is right if it follows rules which, if generally followed, produce the best outcome). A Rule Consequentialist might argue that a rule allowing for some personal leisure produces better long-term societal welfare than a rule of total self-sacrifice.
      *   **Nuance:** The phrase "bare subsistence" is a slight exaggeration even for maximizers. The limit is usually defined by **marginal utility**: you must give until giving more would cause you as much harm as it relieves for the recipient. For a wealthy person, this is far above subsistence, but it doesn't necessarily require starvation.

  ### 2. Singer's Drowning Child Argument
  **Friend's Claim:** *"Singer's famous famine-relief argument makes this vivid... the strong version of his principle says you must keep giving until the sacrifice to you is morally comparable to what the recipient gains."*

  *   **Audit:** **Accurate to 1972 Singer, inaccurate to current Singer.**
      *   **Specific Question:** *Is Singer's argument supposed to establish all of what my friend extracted?*
          *   **Answer:** No. Singer's 1972 argument ("Famine, Affluence, and Morality") was specifically designed to establish a **duty of aid**, not to define the entirety of consequentialist ethics. However, because Singer is a preference utilitarian, the duty of aid flows from his broader theory. Your friend is treating a specific argument for charity as if it were the exhaustive definition of the theory.
      *   **Specific Question:** *Is the strong version the only one available, or even the one he still holds?*
          *   **Answer:** Definitely not. In 1972, Singer proposed the **Strong Principle**: *prevent something bad unless doing so requires sacrificing something of comparable moral significance.* This indeed implies giving until you are nearly as poor as those you help.
          *   However, in later work (e.g., *Practical Ethics*, 1979/2009), Singer adopted a **Moderate Principle**: *prevent something bad unless doing so requires sacrificing something of moral significance.* This sounds similar, but the distinction allows for maintaining a level of wealth that supports your own "moral significance" (projects, family, stability). Singer himself acknowledges the strong principle is incredibly demanding and has softened his public stance to argue for a specific percentage of income (e.g., 10% to 30%) rather than total marginal utility, to make the view more sustainable. Your friend is attacking a version of Singer's view that Singer himself has moderated.

  ### 3. Williams vs. The Demandingness Objection
  **Friend's Claim:** *"Philosophers like Bernard Williams showed that consequentialism destroys the integrity of a person's own projects — so consequentialism is refuted."*

  *   **Audit:** **Conflation of two distinct objections.**
      *   **Specific Question:** *Is Williams's integrity objection the same thing as the demandingness objection?*
          *   **Answer:** No. This is a significant philosophical error in your friend's summary.
          *   **The Demandingness Objection** says: "This theory asks too much *effort/sacrifice* (time, money, energy)." It is quantitative.
          *   **Williams's Integrity Objection** says: "This theory asks you to abandon your *identity*." Williams argued that consequentialism requires agents to view their own "ground projects" (the commitments that make life worth living, like art, family, or friendship) as merely one set of preferences to be weighed against the general welfare. He famously argued this creates **alienation**: you become a channel for the satisfaction of others' utility rather than a person with your own life.
          *   **Why it matters:** You can answer the demandingness objection by saying "I work hard, but I can afford this coffee." You cannot answer Williams so easily; he is saying that even if you *can* sacrifice your projects, you *shouldn't have to* in order to be moral. By running these together, your friend makes the critique seem like a simple matter of "it's too hard," whereas Williams is arguing "it's the wrong kind of life."

  ### 4. The "Plausibility" Premise
  **Friend's Claim:** *"No remotely plausible moral theory could demand that of people."*

  *   **Audit:** **This is the crux of the disagreement, not a premise the consequentialist must accept.**
      *   **Specific Question:** *Is this an assumption a consequentialist must accept?*
          *   **Answer:** No. This is where your friend begs the question. He assumes that "plausibility" is determined by alignment with our common-sense intuitions about how much we should sacrifice.
          *   **The "Bullet-Biting" Response:** Many consequentialists (e.g., Shelly Kagan in *The Limits of Morality*) accept that the theory is extremely demanding and argue that **our intuitions are wrong, not the theory.** They argue that morality *is* supposed to be demanding. Just because a theory conflicts with our desire for a comfortable life doesn't make it false; it might just mean we are morally corrupt.
          *   **The "Psychological Fact" Response:** Other consequentialists argue that total self-sacrifice is counter-productive. If you deny yourself all coffee and cinema, you will burn out, become resentful, and cease to be effective at helping others. Therefore, buying the coffee is justified *consequentially* because it maintains your long-term ability to do good. Your friend presents the demand as absolute; many defenders argue the demand is limited by psychological reality.

  ### 5. The Either/Or Conclusion
  **Friend's Claim:** *"Either you accept that buying a coffee is morally on a par with letting a child drown, or you give the theory up."*

  *   **Audit:** **False Dichotomy.**
      *   **Specific Question:** *Does this conclusion follow from the corrected parts?*
          *   **Answer:** No. Even if we accept the friend's premises, this conclusion does not follow.
          *   **Option 3 (Mitigation):** You can accept consequentialism and argue that buying a coffee is *not* on a par with letting a child drown because of systemic differences. Letting a child drown is a direct, immediate causal link. Buying a coffee is a tiny contribution to a global economic system. Some consequentialists argue that while we should donate, the *moral culpability* of spending on oneself is less than the culpability of directly ignoring a drowning child due to differences in certainty and proximity.
          *   **Option 4 (Acceptance):** You can accept consequentialism, accept that buying the coffee is sub-optimal, and accept that this makes you slightly morally blameworthy, without abandoning the theory. This is the "moral remainder" position. You live with the guilt because the theory is true.
          *   **Option 5 (Modification):** As noted above, you can switch to Rule Consequentialism or Satisficing Consequentialism, which avoids the extreme implication without abandoning the core consequentialist insight (that outcomes matter).

  ### Summary Verdict

  Your inclination is philosophically defensible: **The demandingness objection shows a cost of consequentialism, not necessarily a refutation.**

  Your friend's argument is a standard introductory-level critique, but it fails as a "refutation" for three reasons:
  1.  **It attacks a straw man of Singer:** It uses Singer's 1972 "strong principle" rather than his later, more nuanced views.
  2.  **It conflates Integrity with Sacrifice:** It treats Williams's deep objection about identity as if it were just a complaint about having to spend too much money.
  3.  **It privileges Intuition over Theory:** It assumes that because a theory conflicts with our desire for comfort, it is false. A consequentialist is entitled to reply: "Morality is not designed for your comfort."

  **How to respond to your friend:**
  You can concede that consequentialism is demanding (don't try to deny that). However, point out that "demanding" does not equal "false." Ask him whether he believes morality should track our intuitions about comfort, or whether our intuitions about comfort should track morality. If he says the former, he is arguing from common sense, not logic. If he says the latter, he must accept that consequentialism might be right even if it makes us uncomfortable.

  Furthermore, ask him to distinguish Williams's integrity objection from the demandingness objection. If he cannot, his critique is less precise than he thinks. Finally, remind him that many consequentialists (including Singer) do not actually demand you give until you are at subsistence; they demand you give until it hurts *significantly*, which leaves room for the occasional coffee without equating it to murder.

  Your unease is justified: your friend presented a "gotcha" argument that relies on freezing consequentialism in its most extreme, rigid form while ignoring the resources within the tradition to moderate, explain, or bite the bullet on those very demands.
