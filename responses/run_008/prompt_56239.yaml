      *   **Geometric Mean (Growth Rate):** Relevant for time averages, compounding, survival.
      *   **Kelly Criterion:** Maximizes geometric growth. Fractional Kelly = risk aversion.
      *   **Ruin/Drawdown:** Absorbing barriers. If you hit zero, game over.
      *   **Utility Functions:** CRRA, Log-utility (Kelly), Bounded utility.
      *   **Tail Risk:** Black swans, negative convexity (short vol), positive convexity (long vol).

  4.  **Mapping the Concepts (The Translation Layer):**

      *   *Fanaticism (Pure EV)* $\rightarrow$ **Arithmetic Mean Maximization / Risk-Neutrality.** In finance, this is holding a leveraged position in a lottery ticket without regard for volatility drag or ruin. It assumes you can play the game infinitely many times (Ensemble Average) or have infinite capital reserves.
      *   *Moderation (Rejecting Fanaticism)* $\rightarrow$ **Geometric Mean Maximization / Kelly / Risk of Ruin.** This is recognizing that if the bet is large enough relative to capital, or if it's a one-shot with no rebalancing, the *time average* growth rate is what matters, not the ensemble EV.
      *   *Bounded Utility* $\rightarrow$ **Saturation Point / Diminishing Marginal Utility.** In finance, this is Log-utility or CRRA $\gamma > 1$. It naturally discounts huge payoffs because the second billion is worth less than the first.
      *   *Pascalian Mugging* $\rightarrow$ **Model Risk / Estimation Error.** In finance, this is the "input error" problem. If your model says EV is positive because of a $10^{100}$ payoff with $10^{-50}$ prob, your estimate of $P$ is noise, not signal. It's the "penny stock pitch" or "fraudulent CDO."
