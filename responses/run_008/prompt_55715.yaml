      *   *Reading 2 (Epistemic/Performative):* "I exist as the subject of this experience." (The standard Cartesian view, but limited to the moment).
      *   *Reading 3 (Substantial/Dualist):* "I am a thinking substance (res cogitans) distinct from the body." (The strong metaphysical claim).
