      *   **AI/Machine Consciousness:** This is the trickiest part. Descartes *did* argue animals/machines are automata. But does the *Cogito* itself prove AI can't think? Or does it just establish *my* certainty? The classmate's claim relies on "what it is like to be" (Nagel) + self-recognition. Does the *Cogito* guarantee that *only* biological substances can do this? Probably not directly, but the *Substance* reading might imply it.

