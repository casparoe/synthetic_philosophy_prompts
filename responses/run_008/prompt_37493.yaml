answer: |-
  # The State Apology Compatibility Test

  **Instructions:** Read the eight scenarios below. For each, select the option that best matches your intuition about what the government *ought* to do. Don't overthink the legal feasibility; focus on the moral logic. Keep track of your answers (e.g., 1-A, 2-C).

  ***

  **1. The Revolution**
  A brutal dictatorship committed systematic torture for 30 years. A peaceful revolution overthrow the regime and wrote a new constitution. The new leaders are asked to apologize for the torture.
  *   **A.** They must apologize; the State is a continuous entity regardless of who runs it.
  *   **B.** They should only apologize if the new state profited from the torture (e.g., seized assets).
  *   **C.** They should issue a statement condemning the past to strengthen new norms, but "apology" implies guilt they don't share.

  **2. The Empty Grave**
  Archives reveal a state-sponsored massacre 90 years ago. Every victim and perpetrator is dead. No living descendants can be identified.
  *   **A.** Apologize anyway. The historical record must be morally corrected.
  *   **B.** Do not apologize. An apology requires a living recipient to accept or reject it.
  *   **C.** Publish the findings, but reserve apologies for harms that still cause present-day disadvantage.

  **3. The Quiet Title**
  Indigenous land was seized under a law repealed 50 years ago. The land is now a public park used by everyone. The tribe asks for an apology.
  *   **A.** Apologize and return the land (or equivalent value); the wrong persists until reversed.
  *   **B.** Apologize for the seizure, but keep the park; closure is more important than restitution.
  *   **C.** Acknowledge the history in plaques, but an official apology creates unsustainable liability for old laws.

  **4. The Split Verdict**
  A minority group was forcibly sterilized in the 1970s. The government prepares an apology. 40% of the surviving victims say, "Don't do it; it reopens wounds we've closed."
  *   **A.** Apologize anyway. The state has a duty to confess fault regardless of victim preference.
  *   **B.** Respect the veto. An apology forced on the unwilling is just another form of state control.
  *   **C.** Apologize to the community as a whole, not the individuals; this is about group dignity, not personal therapy.

  **5. The Careful Wording**
  The Prime Minister says: "We deeply regret the suffering that occurred," but refuses to say "We were wrong" or "We apologize."
  *   **A.** This is a hollow dodge. Without admitting fault, it is not an apology.
  *   **B.** It is sufficient. In politics, "regret" signals a shift in policy without inviting lawsuits.
  *   **C.** It is distinct. "Regret" mourns the outcome; "Apology" admits moral agency. Both have uses.

  **6. The Grandchildren**
  A discriminatory housing policy ended 40 years ago. Victims are dead, but their grandchildren have statistically lower wealth due to the policy.
  *   **A.** Apologize to the grandchildren. The harm was inherited, so the debt is too.
  *   **B.** Apologize to the memory of the victims, but pay the grandchildren based on unjust enrichment, not apology.
  *   **C.** Do not apologize to grandchildren. Apologies are for those personally wronged; use policy to fix wealth gaps instead.

  **7. The Bureaucrat's Defense**
  Officials carried out a deportation order that was legal at the time but is now recognized as a crime against humanity.
  *   **A.** The State is liable. Laws can be criminal, and the State is the moral agent that enacted them.
  *   **B.** The individuals were liable then; the State now is only liable if it maintains the *benefits* of the deportation.
  *   **C.** The State should express sorrow, but "liability" implies a moral soul that a bureaucracy cannot possess.

  **8. The Check and the Speech**
  A settlement is reached: $1 billion in compensation and a formal parliamentary apology. Victims are asked which they value more.
  *   **A.** The money is the only real apology; the speech is just noise.
  *   **B.** The speech is the only real apology; money turns a moral debt into a transaction.
  *   **C.** They are separate. Money fixes the disadvantage; the speech fixes the civic relationship.

  ***

  # The Scoring Key

  Do not simply count your letters. Instead, look at *why* you chose them. Your answers reveal where you stand on four philosophical axes. Tally which column below best describes your **majority** of answers.

  ### Axis 1: Continuity (Questions 1, 2, 7)
  *   **Mostly A:** **The Corporate Person.** You believe the State persists through time like a human being. It has a memory and a moral soul that survives regime change.
  *   **Mostly B:** **The Benefit-Tracer.** You are skeptical of metaphysical statehood. You care about assets, enrichment, and causal chains. If the money didn't move, the debt didn't move.
  *   **Mostly C:** **The Pragmatist.** You view the State as a machine. "Continuity" is a legal fiction useful for stability, not a moral reality.

  ### Axis 2: Recipiency (Questions 2, 4, 6)
  *   **Mostly A:** **The Duty-Bearer.** The apology is owed regardless of whether it is wanted or received. Truth is an objective good.
  *   **Mostly B:** **The Relationalist.** An apology is a handshake. If there is no hand to shake (death/refusal), the act is incomplete or void.
  *   **Mostly C:** **The Communitarian.** The recipient is the "nation" or the "group," not the individual. Individual veto power is secondary to collective healing.

  ### Axis 3: Felicity Conditions (Questions 3, 5)
  *   **Mostly A:** **The Purist.** Specific words ("wrong," "apologize") carry specific moral weight. Euphemisms invalidate the act.
  *   **Mostly B:** **The Functionalist.** Words are tools. If "regret" achieves peace and policy change, it is as good as "apology."
  *   **Mostly C:** **The Symbolist.** The ritual matters more than the syntax. A parliamentary motion has weight because of the ceremony, not the dictionary definition.

  ### Axis 4: Remedy (Question 8)
  *   **Mostly A:** **The Materialist.** Harm is measured in welfare. If welfare isn't restored, the apology is a lie.
  *   **Mostly B:** **The Idealist.** Harm is measured in status. Money cannot buy back dignity; only submission (apology) can.
  *   **Mostly C:** **The Pluralist.** Moral debt and material debt are different categories. You can pay one without settling the other.

  ***

  # Locating Your Position

  Now, match your Axis profile to one of these four archetypes. (Most readers will be a hybrid; find the one that fits your *strongest* convictions).

  ### 1. The Corporate Agent (Mostly A on Continuity & Duty)
  **View:** The State is a persistent moral person. It can sin, repent, and owe debts across centuries.
  **The Apology:** A genuine moral confession required to restore the State's integrity.
  **Weakness:** Struggles to explain why a democratic citizenry is responsible for a dictatorship's sins without a causal link.

  ### 2. The Benefit-Tracer (Mostly B on Continuity & Remedy)
  **View:** States are legal fictions. Only people and assets are real.
  **The Apology:** A shorthand for "We acknowledge we hold assets derived from theft."
  **Weakness:** Cannot account for harms where no profit was made (e.g., pointless brutality). If the state gained nothing, you owe nothing.

  ### 3. The Narrative-Identity (Mostly C on Continuity & Symbolist)
  **View:** The State is a story we tell ourselves about who we are.
  **The Apology:** A plot correction. We apologize not because "The State" sinned, but because the current story must exclude that chapter to remain coherent.
  **Weakness:** Can drift into vanity. The apology becomes about *our* virtue, not *their* harm.

  ### 4. The Deflationary/Forward-Looking (Mostly C on Pragmatist & Functionalist)
  **View:** Moralizing about the past is category error. Politics is about the future.
  **The Apology:** A speech act designed to deter future violations and stabilize norms.
  **Weakness:** Cynical. If the apology doesn't change future behavior, it admits it was worthless. Also insults those who want recognition of past pain, not just future safety.

  ***

  # The "Incoherent Zones" & Blind Spots

  *For the comment section moderators.*

  **1. The "Hammer with a Wallet" Paradox**
  If you scored **Corporate Agent on Continuity** (The State is a moral person) but **Benefit-Tracer on Remedy** (Only pay if we profited), you occupy a tense space.
  *   *Why it's weird:* If the State is a moral person capable of sinning (Continuity A), it owes restitution for the *sin*, not just the *profit*. If it only pays for profit, it's treating itself like a corporation, not a moral agent.
  *   *Verdict:* Defensible, but requires arguing that moral fault doesn't entail material restitution.

  **2. The "Veto" Contradiction**
  If you scored **Duty-Bearer on Recipiency** (Apologize anyway) but **Relationalist on Felicity** (Words need acceptance to work), your position may collapse.
  *   *Why it's weird:* You believe the state must speak the truth regardless of the victim's wish, but also believe the speech act fails if the victim doesn't accept it.
  *   *Verdict:* Incoherent. You must decide if the apology is for the *speaker's* soul or the *listener's* healing.

  **3. The Blind Spot: Narrative vs. Deflationary**
  This quiz cannot reliably separate **Narrative-Identity** from **Deflationary/Forward-Looking**.
  *   *Why:* Both often support the same apologies for the same reasons (social cohesion, norm setting). The difference is internal: Does the apology make us *good* (Narrative) or does it make us *safe* (Deflationary)?
  *   *Advice:* If you landed here, ask yourself: "If this apology changed nothing about future policy, would it still be worth doing?" If Yes → Narrative. If No → Deflationary.

  **4. The Unoccupied Zone: The "Pure Symbolist Materialist"**
  *   *The Combo:* Believing words are purely magical/ritualistic (Symbolist) BUT money is the only thing that matters (Materialist).
  *   *Why nobody is there:* If money is the only thing that matters, the ritual is noise. If the ritual is magical, money shouldn't be able to replace it. People usually pick one "real" currency (either cash or words).
