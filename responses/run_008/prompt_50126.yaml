prompt: |-
  When governments evaluate climate policy, they mostly do it through cost-benefit analysis: projected damages from warming are translated into lost consumption, summed across the world's population, and then shrunk by a discount rate, one component of which is a pure rate of time preference — a number that makes a benefit to someone in 2125 count for less than the very same benefit to someone today, simply because it arrives later. Analysts have fought publicly about whether that number should be near zero, so that a death averted in 2125 counts almost as much as one averted now, or several percent per year, so that it counts for almost nothing; and the same governments that mandate the analysis also sign declarations on intergenerational equity and sustainable development. What theory of what future people are owed does the discounting practice actually presuppose? Does it require the claim that later-born people matter less, or can it be defended on descriptive grounds — modeling the actual impatience of present people, or the chance that there will be no one around in 2125 — without any commitment about moral status? How does it interact with the non-identity problem: if the discounting is unjust, who exactly is wronged, given that different policies bring different people into existence? Reconstruct the implicit theory of intergenerational justice, say whether it is internally consistent or in tension with the rest of the analysis, and tell me what would have to change if the practice were rebuilt on the assumption that date of birth is morally irrelevant — could the cost-benefit apparatus survive, or only with something like a declining discount rate patched onto it? Please answer in continuous prose only, as in a letter: no headings, bullet points, bold text, or tables.
