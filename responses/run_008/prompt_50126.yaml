answer: |-
  Dear Friend,

  You have asked me to unravel the ethical threads hidden within the technical machinery of climate policy, specifically regarding how governments use cost-benefit analysis to weigh the future against the present. It is a profound inquiry because it touches on the silent moral assumptions embedded in our economic models. When a government agency applies a discount rate to future climate damages, it is not merely performing a mathematical operation to account for inflation or growth; it is making a philosophical claim about the moral status of people who do not yet exist. The practice of applying a pure rate of time preference, distinct from the expected growth in consumption, presupposes a theory of intergenerational justice that is explicitly discriminatory based on temporal location. It assumes that the welfare of a person matters less simply because they live later in time. This is not a neutral technical adjustment but an ethical stance that prioritizes the current generation over future ones, treating the date of birth as a relevant criterion for moral consideration. While analysts often debate whether this number should be near zero or several percent, the very inclusion of a positive pure time preference implies that we owe less to our descendants than to ourselves, solely because they are distant.

  You wonder if this practice can be defended on descriptive grounds without committing to such a moral claim, perhaps by modeling the actual impatience of present people or the risk that humanity might not survive to 2125. The argument from impatience suggests that because living people prefer benefits now, policy should reflect this preference. However, in the context of public policy aimed at long-term welfare, descriptive impatience is generally regarded as a rationality failure rather than a valid ethical justification. Just because individuals are impatient does not mean the government should institutionalize that impatience when managing collective resources across centuries. The argument from existential risk is more robust; if there is a genuine probability that no one will be around to suffer the damages, then discounting reflects that uncertainty. Yet, empirical estimates of total human extinction are typically too low to justify the high discount rates often used in practice. Consequently, the bulk of the discount rate usually rests on the ethical component, the pure time preference, which cannot be easily stripped of its normative weight. It requires the claim, however tacit, that later-born people matter less, or at least that their claims on current resources are weaker because of their temporal distance.

  This creates a stark tension with the declarations on intergenerational equity and sustainable development that the same governments sign. These declarations typically affirm that future generations have rights equal to those of the present generation, implying that the date of birth should be morally irrelevant. When a government asserts that all humans have equal worth but then employs a discount rate that shrinks the value of a future life to a fraction of a current one, it engages in a performative contradiction. The mathematical apparatus says one thing while the political declaration says another. The implicit theory of justice operating within the cost-benefit analysis is a form of temporal utilitarianism that weights utility by time, whereas the declared theory is one of equal moral status across time. These two cannot be reconciled without altering the parameters of the analysis. The current practice effectively silences the voices of the future by translating their suffering into negligible present-value terms, allowing the current generation to consume carbon capacity at a rate that would be deemed unacceptable if the future victims were present today.

  The situation becomes even more complex when you introduce the non-identity problem, which asks who exactly is wronged if the discounting is unjust. This problem, articulated by philosophers like Derek Parfit, notes that different climate policies will result in different people being born in the future because policy changes the course of history, affecting who meets whom and when children are conceived. If we choose a policy with high discounting and less mitigation, we create a future world that is warmer and more difficult, but the people living there would not have existed at all had we chosen a stricter mitigation policy. Therefore, they cannot claim they were harmed by the high-discounting policy, because without it, they would not be alive to make the claim. This creates a shield against accusations of injustice from a person-affecting viewpoint. However, the discounting practice interacts with this by compounding the invisibility of future people. Even if we bypass the non-identity problem by adopting an impersonal view where we care about the quality of lives rather than specific identities, the discount rate still diminishes the moral weight of those lives. If the discounting is unjust, the wrong is not necessarily done to specific identifiable individuals who can claim counterfactual harm, but rather to the abstract concept of intergenerational fairness itself. The wrong is the systematic undervaluing of a class of people defined by their birth date, treating them as morally secondary regardless of whether their specific identities were contingent on the policy choice.

  If we were to rebuild this practice on the assumption that the date of birth is morally irrelevant, as the principle of intergenerational equity demands, we would have to set the pure rate of time preference to zero. This is the Ramsey rule, which suggests that we should not discriminate against future welfare simply because it occurs later. Implementing this would radically transform the cost-benefit apparatus, though it might not destroy it entirely. With a zero pure time preference, the cumulative damages of climate change over centuries would become astronomically large in present-value terms, likely overwhelming any current cost of mitigation. To prevent the model from demanding infinite sacrifice today for benefits millennia hence, analysts would likely need to adopt a declining discount rate. This approach allows the discount rate to fall over time, reflecting uncertainty about the future rather than discrimination against it. It acknowledges that while we are uncertain about the far future, we should not value it less simply because it is far.

  Under such a rebuilt system, the cost-benefit apparatus could survive, but it would cease to be a tool for justifying incremental change and would instead become a mandate for aggressive immediate action. The focus would shift from balancing consumption today against consumption tomorrow to ensuring that the basic conditions for welfare are maintained for all future people regardless of when they are born. The analysis would have to incorporate constraints on critical natural capital, recognizing that some losses are irreversible and cannot be compensated by future wealth, thus moving beyond simple consumption smoothing. Ultimately, the choice of discount rate is not a technical parameter to be calibrated by economists alone but a moral variable that defines the scope of our community. To continue using a high pure rate of time preference while signing declarations of equity is to maintain a fiction that allows us to ignore the claims of those who will follow us. If we are to take intergenerational justice seriously, we must align our mathematics with our morals, accepting that a death averted in 2125 counts as much as one averted today, and allowing our policies to reflect the full weight of that equality.

  Yours sincerely,

  A Student of Ethics
