answer: |-
  You are not just tracking appealing stories. You are intuitively applying a heuristic that archaeologists and anthropologists often struggle to formalize: **The Principle of Non-Utilitarian Constraint.**

  Here is the precise formulation of the principle that underlies your verdicts, followed by the resolution of your tensions, the prediction for the cave paintings, and the critical self-assessment you requested.

  ### The Principle: Non-Utilitarian Constraint

  **Statement:** An inference to a belief, institution, or social structure is licensed only when the material evidence demonstrates a **cost** (labor, resource destruction, coordination, or risk) that cannot be explained by immediate utilitarian function, individual preference, or material necessity.

  **The Two Filters:**
  1.  **The Cost Filter:** Does the artifact or pattern require an investment that reduces immediate survival efficiency or individual freedom? (e.g., breaking a tool, standardizing without contact, laboring for generations).
  2.  **The Specificity Filter:** Is the pattern too specific to be the result of convergent evolution, fashion, or random variation? (e.g., exact measurements, half/half splitting vs. general "female shape").

  **Inference Rule:** If **High Cost + High Specificity + Low Utilitarian Benefit** $\rightarrow$ Infer Institution/Belief. If **Low Cost** or **High Utilitarian Benefit** or **Low Specificity** $\rightarrow$ Suspend Judgment.

  ---

  ### Mapping Your Verdicts to the Principle

  1.  **Snapped Flint Blade:**
      *   **Cost:** High (destruction of a functional tool).
      *   **Specificity:** High (deliberate halving, spatial separation).
      *   **Utilitarian Benefit:** None (a broken blade cuts worse).
      *   **Verdict:** **Yes.** The cost forces a non-utilitarian explanation (belief/ritual link).

  2.  **Female Figurines:**
      *   **Cost:** Low/Moderate (clay is cheap, making is a common skill).
      *   **Specificity:** Low ("exaggerated features" is a broad category; could be caricature, play, or art).
      *   **Utilitarian Benefit:** Plausible (toys, educational tools, decorative art).
      *   **Verdict:** **No.** The cost/specificity threshold isn't met to force a "cult" inference.

  3.  **Building Modules (No Contact):**
      *   **Cost:** High (maintaining precision across generations/distance requires information transmission fidelity).
      *   **Specificity:** High (exact recurring length).
      *   **Utilitarian Benefit:** Low (houses function fine with varied dimensions).
      *   **Verdict:** **Yes.** Maintaining this specificity without contact implies a shared "canon" or institutionalized knowledge system.

  4.  **Uniform Pots (Region-wide):**
      *   **Cost:** High (loss of individual potter autonomy, setup of standardized production).
      *   **Specificity:** High (machine-like uniformity).
      *   **Utilitarian Benefit:** Mixed (standardization helps trade, but handmade is usually sufficient for local use).
      *   **Verdict:** **Yes.** The shift from varied to uniform implies a production institution or political constraint on production.

  5.  **Decorative Motifs (Region-wide):**
      *   **Cost:** Low (copying a visual design is easy).
      *   **Specificity:** Low (fashion spreads easily without central coordination).
      *   **Utilitarian Benefit:** Social signaling (low cost).
      *   **Verdict:** **No.** Low cost allows for "fashion" explanation; no need to infer deep "identity" or "peoplehood."

  6.  **Big Mound (Small Community):**
      *   **Cost:** High (multi-generational labor).
      *   **Specificity:** High (sustained direction of effort).
      *   **Utilitarian Benefit:** Low (burial mounds don't house the living).
      *   **Verdict:** **Yes to Organization, No to Coercion.** Organization is required to sustain the cost. Coercion is a *mechanism* of organization, not the *fact* of it. Voluntary religious devotion could also sustain the cost. The evidence proves the *capacity*, not the *method*.

  ---

  ### Resolving Your Tensions

  **1. The Snapped Blade vs. The Figurines**
  You felt tension because both are "special treatment." The Principle resolves this via **Irreversibility**.
  *   Snapping the blade is an *irreversible destruction of value*. You cannot un-break the flint. This signals that the *act* mattered more than the *object's function*.
  *   Making a figurine is *creation*. It adds value. Unless those figurines are found systematically broken or buried in a way that removes them from circulation, they remain in the realm of "production," which is ambiguous. The blade is an act of *sacrifice*; the figurine is an act of *manufacture*. Sacrifice licenses belief inference; manufacture does not.

  **2. The Uniform Pots vs. The Decorative Motifs**
  You felt tension because both are "regional sameness." The Principle resolves this via **Technical Constraint vs. Visual Mimicry**.
  *   Uniform pots require **process control**. To make pots identical, you need standardized clay prep, wheel speeds, or molds. This requires *institutional oversight of labor*.
  *   Motifs require only **visual access**. I can paint a spiral on my pot because I saw your pot. This requires only *communication*, not *institution*.
  *   Therefore, pots infer a *production institution*; motifs infer only *network interaction*.

  ---

  ### Prediction: The Pitch-Black Cave Paintings

  **Scenario:** Paintings in a chamber 100m underground, pitch black, inaccessible to accident.

  **Application of Principle:**
  *   **Cost:** Extreme. Requires artificial light (tallow/oil), navigation skills, risk of getting lost/dying, physical exertion to crawl.
  *   **Specificity:** High. Why paint where no one sees?
  *   **Utilitarian Benefit:** Zero. There is no shelter, no food, no visibility for social display.
  *   **Verdict:** **Yes.** You must infer a belief system or ritual institution.
  *   **Reasoning:** The cost is "sunk" entirely. No rational actor incurs this risk and labor for a secular, utilitarian, or casual purpose. The "constraint" is the darkness itself; overcoming it requires a motivation strong enough to override survival instincts (fear of dark/depths). This licenses the inference of a **sacred/ritual institution**, though it does *not* license an inference about *what* they worshipped (shamanism vs. ancestor cult vs. initiation).

  ---

  ### Critical Self-Assessment

  You asked me to be self-critical with you. Here is where your intuition (and the Principle derived from it) is vulnerable.

  **1. The Inconsistency: Uniform Pots vs. Political Unification**
  *   **Your Verdict:** You infer "political unification or production institution."
  *   **The Flaw:** This is your weakest link. Uniformity can arise from **Economic Dominance** without Political Unification. If one village discovers a superior kiln technique or controls the only high-quality clay source, their pots will dominate the region through trade, not coercion or unification.
  *   **Correction:** The inference should be limited to "Centralized Production or Standardized Norms." Inferring "Political Unification" jumps from *economic* constraint to *political* structure. You are slightly over-reading the pots.

  **2. The Inconsistency: Building Modules without Contact**
  *   **Your Verdict:** You infer a "shared canon."
  *   **The Flaw:** If there is *no sign of contact*, how is the canon shared? If they are truly isolated, this could be **Convergent Evolution** based on human ergonomics or available timber lengths.
  *   **Correction:** You need evidence that the module is *arbitrary*. If the module is 1.5 meters (an arm's reach), it might be biological, not institutional. If the module is 1.37 meters, it is arbitrary. Your intuition holds only if the measurement is *culturally arbitrary*, not functionally optimal.

  **3. The "Figurine" Blind Spot**
  *   **Your Verdict:** You reject the fertility cult because they "could be toys."
  *   **The Flaw:** You are judging the object in isolation. If 99% of figurines are found in trash pits, they are toys. If 99% are found under floorboards or in niches, they are *not* toys, regardless of how "cheap" they are to make.
  *   **Correction:** Your principle focuses on the *object's properties* (cost to make), but often the **Context of Deposition** is the real "cost." Burying a cheap toy is a "costly signal" if it removes the toy from circulation. You should weigh *where* it was found as heavily as *what* it is.

  ### The Falsifier: What Would Break This Principle?

  If you adopt the **Principle of Non-Utilitarian Constraint**, here is the case that would force you to amend or drop it:

  **The Case of "Ritualized Efficiency"**
  Imagine you find a region where **every** household, over 500 years, produces **perfectly uniform** pots (High Specificity) using a method that is **demonstrably faster and cheaper** than the previous handmade method (Low/ Negative Cost).
  *   **Principle Prediction:** Because the "Cost" filter is failed (it's actually more efficient), you should *not* infer an institution or belief. You should infer technological adoption.
  *   **The Break:** Suppose you later find texts or iconography proving that using the "fast method" was a **religious mandate**, and those who used the old slow method were persecuted.
  *   **Why it breaks the principle:** Here, the *institution* caused the *efficiency*. The material record looks like "rational economic choice," but the driver was "ideological constraint."
  *   **Amendment Required:** The principle would need to account for **Negative Cost** (where adhering to a norm *benefits* the actor, masking the institutional coercion). If an institution makes life *easier* (standardization), it leaves a lighter material footprint than one that makes life *harder* (mounds, broken blades).

  **Summary:** Your intuitions are robust because they track **signal reliability**. Costly, specific, non-utilitarian actions are hard to fake, so they are reliable signals of underlying social structures. Cheap, ambiguous, or utilitarian actions are easy to fake or accidental, so they are noisy data. Stick to the cost, but watch out for efficiency masquerading as choice.
