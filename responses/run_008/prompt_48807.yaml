  Bottom line: You cannot physically induce amnesia in conscious students, so you must simulate the *information set* by decoupling the "selves" into different students who share a payoff but are structurally prevented from knowing their position in the sequence.

  ### The Mechanic: "Decoupled Selves" Relay
  Do not use blindfolds or amnesia cards; they feel gimmicky and students still track time. Instead, treat each "driver" as a team of three distinct agents who share a single payoff pool (candy/points). This mirrors the game-theoretic interpretation of the problem (Piccione & Rubinstein) where temporal selves are distinct players with identical utility functions.

  **Setup:**
  *   **Teams:** 6 teams of 3 students (18 total).
  *   **Roles:**
      1.  **Planner:** Sets the ex-ante policy.
      2.  **Agent Alpha:** Sits at "Intersection 1" (Desk A).
      3.  **Agent Beta:** Sits at "Intersection 2" (Desk B).
  *   **Information Blocking:** Desk A and Desk B are separated by a divider or placed in opposite corners. Agents cannot see or hear each other. They are instructed: *"You are an Intersection Agent. You know the car has reached your desk. You do not know if this is the first or second intersection. You share a payoff with your team."*
  *   **The Memory Fix:** Because Agent Beta is a different person than Agent Alpha, Beta literally does not know what Alpha decided, only that the car arrived. To prevent Beta from inferring they are at Node 2 (since they only play if Alpha continued), you instruct Beta: *"You are always present at your desk. If the car exited earlier, you will simply be told the game is over after you make your choice."* This ensures Beta makes the decision under the uncertainty required by the problem.

  ### Session Flow (75 Minutes)

  **1. Setup & Payoffs (10 mins)**
  *   Write payoffs on the board: Exit 1 = 0, Exit 2 = 4, Home (Continue 2) = 1.
  *   Explain the "Decoupled Selves" rule: Agents share candy, but cannot communicate.
  *   **Stakes:** 1 point toward participation grade per team + 1 piece of premium candy per payoff unit (0, 1, or 4).

  **2. Round 1: The Commitment Variant (20 mins)**
  *   **Task:** The **Planner** chooses a randomizing device *before* the drive starts. They must pick a threshold (e.g., "Roll a d6; on 1-4 Continue, on 5-6 Exit").
  *   **Execution:** The Planner writes this rule on a card and seals it. The Agents are told: "You must follow the sealed policy. You do not know what it is."
  *   **The Drive:** Instructor rolls the die at Desk A. If Continue, roll at Desk B.
  *   **Goal:** Establish the baseline ex-ante optimal expected value (4/3). Most teams will pick the 2/3 continue probability.

  **3. Round 2: The Live Drive (25 mins)**
  *   **Task:** Remove the sealed policy. Agents now decide "fresh" at their desks.
  *   **The Spectator:** Assign one student from a non-playing group (or rotate) to be the **Spectator**. Give them a map showing exactly which desk is active (1 or 2).
  *   **Execution:**
      *   Agent Alpha decides (Exit/Continue).
      *   If Continue, Agent Beta decides.
      *   **Spectator Rule:** The Spectator can shout advice, but only *indexical* advice (e.g., "You are at the second one! Exit!"). They cannot reveal the policy.
  *   **The Tension:** Agent Beta will hear the Spectator say "You are at the second one!" and feel the pull to Exit (payoff 4) rather than Continue (payoff 1), even though the Planner wanted them to Continue with probability 2/3 to maximize ex-ante value.

  **4. Debrief & Mapping (20 mins)**
  *   **The Gap:** Ask Planners how they felt watching Agents deviate from the 2/3 plan. Ask Agents why they exited at Node 2 (usually "4 is better than 1").
  *   **The Spectator Conflict:** Ask the Spectator: "Was your advice good?"
      *   *Lesson:* The Spectator's advice is *action-optimal* (given you know you are at Node 2, Exit dominates) but *planning-optimal* bad (if everyone followed it, no one gets past Node 1).
  *   **The "Both Nodes" Reasoning:** Ask if anyone tried to reason like this: "If I choose Continue, I am choosing for both intersections."
      *   *Diagnosis:* This is the core philosophical puzzle. In the game, this shows up if Agent Alpha tries to anticipate Beta's move. If Alpha thinks "Beta will Exit," Alpha should Exit (0 vs 0). If Alpha thinks "Beta will Continue," Alpha should Continue.
      *   *Verdict:* Label this "Evidential vs. Causal" tension. The "both nodes at once" move is seductive because it treats the decision as controlling the policy, but in the Live Round, the agents control only the *action*.

  ### Predictable Failures & Handling

  **1. The "Counting" Leak**
  *   **Failure:** Agent Beta realizes "I only get to play if Alpha continued, so I must be at Node 2."
  *   **Fix:** Enforce the script strictly. "You are always at your desk. Sometimes the game ends before you know the result." If they push back, acknowledge it: "In the real problem, you literally forget. Here, you must *pretend* you don't know the history to test the logic."
  *   **Handling:** If an econ student points this out, validate them: "Exactly. This is why we call it a simulation of the information set, not true amnesia. But if you act on that knowledge, you break the model we are testing."

  **2. Collusion/Signaling**
  *   **Failure:** Agents wink or tap desks to signal "I continued."
  *   **Fix:** Physical dividers. Instructor acts as the only courier of the "Car" (a token).
  *   **Handling:** If caught, disqualify the candy for that round. "In the AMD problem, the selves cannot communicate. If you communicate, you've solved a different game."

  **3. The "Philosophy Freeze"**
  *   **Failure:** Philosophy students stall debating the identity conditions of the agents.
  *   **Fix:** Timeboxing. "You have 30 seconds to decide or the car crashes (Payoff 0)."
  *   **Handling:** Use the stall as data. "The fact that you are struggling to define 'you' is the point of the problem."

  ### The Impossible Feature
  Be honest in the debrief: **You cannot reproduce subjective indistinguishability.**
  In the classroom, Agent Beta *knows* they are Agent Beta. In the true AMD problem, the agent at Node 2 has the exact same mental state as at Node 1.
  *   **Why it's close enough:** The *strategic structure* is preserved. The Agents face the same payoff matrix and information constraints (they don't know the history of decisions, only arrival). The tension between the Planner (who wants a policy) and the Agent (who wants to maximize current payoff) replicates the intertemporal conflict accurately enough to demonstrate why the ex-ante optimal plan is time-inconsistent.
  *   **Assertion:** Tell them: "In the real problem, you wouldn't just be *told* you don't know which node you're at; you would be incapable of distinguishing them. Here, you are obeying a rule that simulates that incapacity. The logic holds even if the phenomenology is faked."
