answer: |-
  # JOINT STATEMENT ON EXPECTED UTILITY AND ERGODICITY ECONOMICS

  **Signatories:** [Name], Proponent of Expected Utility Theory (EUT); [Name], Proponent of Ergodicity Economics (EE)
  **Date:** [Date]
  **Context:** Graduate Seminar on Rational Choice, Adversarial Collaboration

  ## I. AGREED CLAIMS

  We, the undersigned, affirm the following propositions as mathematically correct, historically accurate, or descriptively fair to both frameworks.

  1.  **Mathematical Equivalence in Standard Settings:** In a repeated, multiplicative gamble with independent and identically distributed returns, maximizing the expected value of the logarithm of wealth ($E[\ln W]$) is mathematically equivalent to maximizing the almost-sure long-run time-average growth rate of wealth.
  2.  **Ruin in Multiplicative Dynamics:** In a multiplicative wealth process where bankruptcy is absorbing (wealth cannot go negative), staking a fixed proportion of wealth that is too high (specifically, exceeding the Kelly fraction in favorable bets, or any positive amount in unfavorable bets) leads to wealth converging to zero almost surely as the number of trials approaches infinity.
  3.  **Prescriptive Convergence:** In the canonical setting of repeated proportional betting on a favorable binary outcome, both Expected Utility Theory (with a logarithmic utility function) and Ergodicity Economics (maximizing time-average growth) prescribe the exact same bet size (the Kelly criterion).
  4.  **Historical Origins:**
      *   Expected Utility Theory was originally formalized (von Neumann & Morgenstern, 1944) to axiomatize rational preference orderings over lotteries, primarily for one-shot or static decisions.
      *   The logarithmic growth criterion was introduced by Bernoulli (1738) to resolve the St. Petersburg Paradox and later derived by Kelly (1956) in the context of information transmission over noisy channels, not initially as a general theory of economic rationality.
      *   Ergodicity Economics, as a distinct program (Peters et al., 2010s), explicitly reframes the Kelly criterion as a solution to the non-ergodicity of multiplicative wealth dynamics, distinguishing time averages from ensemble averages.
  5.  **Theoretical Stretching:**
      *   EUT has been extended from its original static domain to dynamic, multi-period problems, requiring assumptions about how utility aggregates over time (e.g., additive separability).
      *   EE has been extended from pure multiplicative wealth dynamics to settings involving additive income, consumption, and complex market structures, requiring assumptions about the relevant dynamical observable.

  ## II. RESIDUAL DISAGREEMENTS

  We disagree on the interpretation, foundation, and generalizability of the frameworks. Below, we state the core disagreements neutrally, articulating each position in terms the holder finds accurate and the counterparty finds charitable.

  | Topic | Statement by Expected Utility Theorist | Statement by Ergodicity Proponent |
  | :--- | :--- | :--- |
  | **The Source of Risk Aversion** | Risk aversion is a primitive feature of human preference. The curvature of the utility function $u(w)$ reflects a subjective trade-off between risk and return. Logarithmic utility is a specific parameterization of this taste, not a physical necessity. | Risk aversion is a derived feature of dynamic constraints. In multiplicative environments, volatility acts as a drag on geometric growth. The logarithm arises from the mathematics of compounding, not from subjective taste. |
  | **Unfalsifiability & Free Parameters** | EE avoids fitting a utility function only by fixing the dynamics (multiplicative) and the observable (wealth) as exogenous assumptions. If the dynamics are misidentified, the prescription fails. EUT admits flexibility in $u(w)$ to accommodate different dynamic contexts, which is a feature, not a bug. | EUT accommodates any behavior by positing a suitable $u(w)$ post hoc, rendering the theory difficult to falsify. EE restricts the functional form by requiring it to match the physical dynamics of the wealth process, offering a tighter, more testable link between environment and behavior. |
  | **Ensemble vs. Time** | The ensemble expectation ($E[W]$) is the correct normative standard for rational choice under uncertainty. A rational agent should care about the expectation across possible worlds, even if they inhabit only one, provided probabilities are well-defined. | The ensemble expectation is physically irrelevant for a single agent living through time. Rationality requires maximizing the outcome that actually occurs on the single trajectory inhabited by the agent (the time average). |
  | **Substance vs. Representation** | Since both frameworks prescribe identical bets in standard cases, the dispute is largely representational. EE offers a dynamic justification for what EUT captures via static preferences, but no new normative guidance emerges where EUT is properly applied. | The dispute is substantive because it changes how we analyze novel problems. EUT asks "what do you prefer?"; EE asks "what are the dynamics?". This leads to divergent prescriptions when dynamics are mis-specified or when preferences conflict with growth. |

  ## III. CRUXES AND PRE-REGISTERED TESTS

  We identify the following subquestions as critical. Settling these empirically or theoretically would cause at least one of us to revise our confidence in our respective frameworks. For each, we specify a case and our pre-registered predictions.

  ### Crux 1: The Boundary of Multiplicative Dynamics
  **Question:** Does risk aversion vanish when wealth dynamics are strictly additive rather than multiplicative?
  **Case:** A salaried bettor receives fixed income $I$ per period and bets a fixed dollar amount $b$ (not a proportion of wealth) on a favorable coin flip. Wealth evolves as $W_{t+1} = W_t + I + \text{gain/loss}$.
  *   **EUT Prediction:** A risk-averse agent (concave $u(w)$) will still bet less than the expectation-maximizing amount, even in additive settings, because utility curvature is independent of wealth dynamics.
  *   **EE Prediction:** A rational agent should be risk-neutral (maximize expected value) in purely additive dynamics, as the time-average growth rate equals the ensemble expectation. Observed risk aversion here indicates a misidentification of the dynamics (e.g., hidden multiplicative constraints) or irrationality.

  ### Crux 2: Pooling and Syndicates (The Ensemble Approximation)
  **Question:** Does risk pooling convert a non-ergodic problem into an ergodic one?
  **Case:** A syndicate of $N$ agents pools capital to take independent draws of a multiplicative gamble, sharing profits equally. As $N \to \infty$, the portfolio return converges to the ensemble expectation.
  *   **EUT Prediction:** Utility theory still applies to the final distribution of wealth. Even with pooling, if the aggregate payout is volatile, a concave utility function prescribes caution. Pooling reduces variance but does not eliminate the normative relevance of utility curvature.
  *   **EE Prediction:** As $N$ increases, the system becomes effectively ergodic (time average $\approx$ ensemble average). The rational prescription converges to maximizing expected value. Risk aversion should disappear as the pool size grows, because the "ruin" trajectory is eliminated by the law of large numbers.

  ### Crux 3: Resets, Bankruptcy, and Inheritance
  **Question:** Do trajectory breaks invalidate the time-average argument?
  **Case:** An agent faces a gamble with a small probability of total ruin (wealth = 0), but upon ruin, they are "bailed out" or replaced by an heir with initial wealth $W_0$, continuing the family line indefinitely.
  *   **EUT Prediction:** Expected utility handles this naturally via the probability tree. The agent weighs the utility of the heir's wealth against current consumption. Risk aversion depends on the utility assigned to the heir's state.
  *   **EE Prediction:** The single-trajectory assumption is broken. The relevant observable is no longer the growth of one agent's wealth over infinite time, but the growth of the *lineage*. This requires redefining the dynamic. If the reset is frequent, the time-average growth rate calculation changes fundamentally, potentially aligning closer to ensemble expectations.

  ### Crux 4: Insurance and Non-Ergodic Transfers
  **Question:** Is insurance purchased due to utility curvature or ergodicity restoration?
  **Case:** Purchase of actuarially unfair insurance against a large, rare loss.
  *   **EUT Prediction:** Insurance is purchased because the marginal utility of wealth is higher in the loss state. The "loading" (unfair premium) is the price paid for smoothing utility across states.
  *   **EE Prediction:** Insurance is purchased because the uninsured loss creates a non-ergodic drop in wealth that takes disproportionate time to recover from (or is absorbing). Insurance converts a non-ergodic gamble into an ergodic flow of premiums. If the loss were purely additive and recoverable, insurance demand should drop significantly.

  ## IV. CLOSING VERDICT ON SUBSTANTIVE VS. VERBAL DISAGREEMENT

  Having reviewed the agreements, disagreements, and cruxes above, we offer the following joint classification of the remaining disputes:

  1.  **Verbal Disagreements (Nomenclature and Priority):**
      *   **The "Rediscovery" Charge:** We agree that the charge that EE has "merely rediscovered Kelly and Bernoulli" is partly verbal. The *mathematics* of logarithmic growth are identical and historical priority belongs to Bernoulli and Kelly. However, the *framing* of this mathematics as a solution to non-ergodicity rather than a subjective utility specification is a novel contribution of EE. This is a dispute about intellectual credit and categorization, not mathematical truth.
      *   **Definition of Rationality:** To the extent that "rationality" is defined as "coherence of preferences" (EUT) versus "survival and growth" (EE), the disagreement is definitional. Both definitions are internally consistent.

  2.  **Substantive Disagreements (Normative Authority and Domain):**
      *   **Source of Normativity:** This is substantive. EUT grounds rationality in the satisfaction of axiomatic preferences (internal consistency). EE grounds rationality in the physical properties of the environment (external correspondence). This leads to different judgments when preferences conflict with growth (e.g., a preference for high-variance "fun" betting). EUT validates the preference; EE labels it dynamically irrational.
      *   **Domain of Applicability:** This is substantive. The disagreement over whether additive settings permit risk neutrality (Crux 1) and whether pooling eliminates risk aversion (Crux 2) represents a genuine empirical divergence. If experiments show persistent risk aversion in strictly additive, high-pooling environments, EE requires modification (e.g., admitting subjective utility), while EUT is confirmed. Conversely, if risk aversion vanishes in additive settings, EUT requires explanation (why is $u(w)$ linear here but not elsewhere?), while EE is confirmed.
      *   **Unfalsifiability:** The charge that EUT is unfalsifiable due to flexible utility functions is substantive. It concerns the scientific status of the theory. If EE can demonstrate that fixing dynamics reduces the degrees of freedom in predicting behavior compared to EUT, this is a methodological advantage, not merely a semantic one.

  **Conclusion:** We conclude that while the two frameworks are mathematically isomorphic in the specific domain of repeated multiplicative gambles with logarithmic scaling, they diverge substantively in their normative foundations and their predictions at the boundaries of that domain (additive dynamics, pooling, and resets). The dispute is not *only* verbal; it is a contest over whether risk attitudes are properties of the *agent* (EUT) or properties of the *process* (EE).

  __________________________
  [Signature, Expected Utility Theorist]

  __________________________
  [Signature, Ergodicity Proponent]
