answer: |-
  Here is a diagnosis for your teaching notes.

  **The Fragmentation Diagnosis**

  You are correct that the debate has fractured into adjacent literatures, but the cause is not merely verbal confusion or a split over the definition of "knowledge." The fragmentation occurred because the Knowledge Argument (KA) successfully shifted the burden of proof without delivering a knockout blow.

  In the 1980s, the KA was an offensive weapon against physicalism. Today, it functions as a constraint *on* physicalism. This is why the literatures no longer intersect meaningfully.

  1.  **The Physicalist Camp (PCS):** They have accepted the *datum* of the thought experiment (Mary learns something new) but deny the *inference* (therefore, non-physical facts exist). Their project is no longer to deny Mary's gain, but to explain how a new cognitive gain is compatible with an old ontological base. They are answering the question: *How can the physical world generate epistemic gaps without ontological gaps?*
  2.  **The Anti-Physicalist Camp:** They have stopped trying to prove Mary learns a new *proposition* in the traditional sense (which proved vulnerable to the Phenomenal Concept Strategy) and have shifted toward acquaintance or property instantiation. They are answering the question: *What kind of reality must exist to ground this irreducible epistemic gain?*

  They talk past each other because one side is doing metaphysical housekeeping (PCS) while the other is doing phenomenological accounting (Acquaintance). They agree on the input (Mary's surprise) and the output (physicalism is either saved or doomed), but they disagree on the machinery connecting the two.

  **On Your Hypothesis: The Ability Hypothesis**

  Your hunch that the Ability Hypothesis (Lewis/Nemirow) "lost on points but won the war" is insightful, but I would refine it. The Ability Hypothesis did not win the war; **Physicalism** won the war, but the Ability Hypothesis specifically lost the battle for the best explanation.

  Lewis and Nemirow argued Mary gains no new *propositional* knowledge, only abilities ("know-how"). This was always counterintuitive. When Mary says, "So *this* is what it is like to see red," she feels she is recognizing a truth, not acquiring a skill. The Phenomenal Concept Strategy (PCS) did not emerge as an apology for Lewis; it emerged as a correction. PCS proponents grant that Mary gains new propositional knowledge (unlike Lewis) but insist this knowledge is constituted by new *concepts* rather than new *properties*.

  So, later physicalists are not apologizing for Lewis; they are admitting he was too deflationary. They realized that to save physicalism, they had to grant the anti-physicalist more ground on the epistemic side to hold the line on the metaphysical side. The "war" was won by physicalism becoming the default ontology, but the cost was abandoning the pure Ability Hypothesis for the more complex machinery of PCS.

  **The Load-Bearing Disagreement**

  The substantive disagreement is no longer about qualia per se, nor is it purely verbal. It is about **explanatory priority**.

  *   **For the Physicalist:** Causal closure is the load-bearing constraint. If the physical world is causally closed, and consciousness has effects, consciousness must be physical. Any argument suggesting otherwise must be explaining away an illusion of distinctness. The KA is treated as a problem of cognitive architecture.
  *   **For the Anti-Physicalist:** Phenomenal transparency is the load-bearing constraint. The nature of experience is revealed directly to the subject. If physics does not capture that nature, physics is incomplete. The KA is treated as a problem of ontological coverage.

  The thought experiment persists because it pits these two fundamental intuitions against each other: the Intuition of Causal Closure vs. the Intuition of Phenomenal Distinctness. As long as both intuitions remain robust, the debate will remain fragmented. The physicalist explains away the distinctness; the anti-physicalist explains away the closure.

  **Can It Be Resolved?**

  Honest answer: **No.**

  1.  **Neuropsychology:** Empirical discovery cannot solve this. Knowing exactly which neurons fire when Mary sees red does not explain *why* that firing feels like something. The Hard Problem is conceptual, not empirical. More data just gives the physicalist more correlations to point to and the anti-physicalist more gaps to highlight.
  2.  **Phenomenal Concepts:** A mature theory of phenomenal concepts could stabilize the physicalist position, but it cannot force assent. The anti-physicalist will always argue that the "concept/property" distinction is itself a physicalist artifact designed to dodge the bullet. If the concept is distinct enough to explain Mary's ignorance, it feels distinct enough to warrant a property.
  3.  **Indefinite Refinability:** The thought experiment is indefinitely refinable. If you block the "new fact" route, opponents move to "new proposition." If you block that, they move to "acquaintance." If you block that, they move to "indexicality."

  **Conclusion for the Seminar**

  The debate has not stalled because of a lack of ingenuity; it has stalled because the Knowledge Argument successfully exposed a brute clash of intuitions that cannot be adjudicated by further argumentation alone.

  Tell your students that the KA is no longer a proof of dualism. It is a stress test for physicalism. The physicalists who remain are those willing to accept a dualism of *concepts* to avoid a dualism of *properties*. The anti-physicalists are those who believe that a dualism of concepts inevitably drags a dualism of properties in its wake.

  Neither side will concede because neither side is willing to abandon their load-bearing intuition. The literature fragmented because one side is building a bridge (PCS) and the other is measuring the canyon (Acquaintance), and neither task requires them to speak to the other anymore. Jackson's recantation didn't settle it because he changed his mind about the bridge, but the canyon remains just as wide for everyone else.
