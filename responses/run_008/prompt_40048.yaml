answer: |-
  Here is the specification for an adequate solution to the meta-problem of consciousness, structured by the phenomena to be explained, the constraints to be respected, and the distinctions to be maintained, followed by an analysis of their joint satisfiability and the status of metaphysical neutrality.

  ### I. The Phenomena (Explananda)

  An adequate solution must generate the specific class of "problem intuitions" as output from a model of cognitive processing. It cannot merely assert that these intuitions exist; it must derive them.

  1.  **The Explanatory Gap Intuition**
      *   **Requirement:** The theory must explain why cognitive systems judge that physical/functional facts ($P$) do not logically entail phenomenal facts ($Q$).
      *   **Case:** If the theory implies that $P \to Q$ should feel transparent (like $H_2O \to Water$), it fails. It must account for the specific *opacity* of the link between third-person structure and first-person report.
  2.  **Zombie Conceivability**
      *   **Requirement:** The theory must explain why it seems coherently conceivable that a physical duplicate could lack experience.
      *   **Case:** This is the modal counterpart to the explanatory gap. A solution that treats this as a simple logical error (e.g., "they are confused about concepts") without explaining *why* the confusion is structurally inevitable fails to capture the robustness of the intuition.
  3.  **Stability and Stubbornness**
      *   **Requirement:** The theory must explain why these reports are stable across cultures and resistant to philosophical argument (e.g., illusionism, representationalism).
      *   **Case:** If the intuition were merely a product of specific philosophical training or Western folk psychology, it would vanish under scrutiny or vary significantly. Its resistance suggests it arises from deep architectural features of the cognitive system, not superficial cultural memes.

  ### II. The Constraints (Boundary Conditions)

  These constraints define the logical space in which the solution must operate. Violating them converts the meta-problem solution into a solution to the hard problem (or a category error).

  1.  **Mechanistic Explicability**
      *   **Requirement:** The explanation must be cashed out in terms of standard cognitive science (information processing, attention, memory, self-modeling) without invoking non-physical causal powers.
      *   **Case:** If the explanation relies on "the soul detecting qualia," it ceases to be a scientific explanation of the *report* and becomes a metaphysical claim about the *referent*. The meta-problem is a problem about human behavior and cognition; it must be solvable by the sciences that study human behavior and cognition.
  2.  **Metaphysical Neutrality**
      *   **Requirement:** The explanation must remain agnostic regarding the truth of physicalism or dualism. It must be compatible with the intuition being an **error** (illusionism) and with the intuition being a **tracking relation** (realism).
      *   **Case:** If the solution presupposes physicalism (e.g., "The brain creates a user-illusion"), it begs the question against the dualist. If it presupposes dualism (e.g., "The brain detects non-physical properties"), it begs the question against the physicalist. The meta-problem is distinct from the hard problem precisely because it is supposed to be solvable *before* settling the hard problem.
  3.  **Reflexive Symmetry**
      *   **Requirement:** The theory must apply equally to the reports of the realist (who says "I have qualia") and the illusionist (who says "I judge that I have qualia").
      *   **Case:** When an illusionist reports "Consciousness is an illusion," they are still making a report about their internal state that relies on the same cognitive machinery as the realist. A theory that explains the realist's report as "error" but the illusionist's report as "insight" posits two different cognitive mechanisms for functionally identical speech acts, which is theoretically profligate.

  ### III. The Distinctions (Non-Collapsibility)

  A solution fails if it conflates the following categories.

  1.  **Report vs. Referent**
      *   **Requirement:** The theory must explain the *production of the claim* without settling the *ontology of the claimed object*.
      *   **Case:** Explaining why I say "There is a ghost" (pareidolia + fear) is distinct from proving ghosts do not exist. Similarly, explaining why I say "There is qualia" must be distinct from proving qualia do/don't exist. Collapsing this turns the meta-problem into a hard-problem solution by fiat.
  2.  **Truth vs. Credibility**
      *   **Requirement:** The theory must explain why the intuition is *credible* to the subject, not why it is *true*.
      *   **Case:** Cognitive systems are designed for fitness, not metaphysical truth. An adequate solution must show how a belief can be evolutionarily or computationally stable even if it is false (or true). If the theory relies on the intuition being true to explain why we hold it, it cannot account for the possibility of error.

  ---

  ### IV. Tension Analysis: Joint Satisfiability

  I flag the following tension as the primary point of failure for candidate solutions:

  **The Conflict: Mechanistic Explicability vs. Metaphysical Neutrality.**

  *   **The Tension:** Cognitive science is methodologically naturalistic. When you model a cognitive system mechanistically, you model it as a physical system processing physical information. When such a model generates an intuition (e.g., "I am non-physical"), the default scientific interpretation is that the model is generating a **representation** that does not map isomorphically to the underlying physical reality.
  *   **The Collapse:** In practice, providing a detailed mechanistic story (e.g., "The self-model lacks access to low-level processing, creating an appearance of simplicity") strongly implies an **Error Theory**. It suggests the intuition is a artifact of the architecture, not a detection of a distinct ontological substance.
  *   **The Result:** It is exceptionally difficult to write a mechanistic explanation of the *report* that remains genuinely neutral. As soon as the mechanism is specified, it usually looks like a "trick" the brain plays, which implicitly favors physicalism/illusionism. To maintain neutrality, the mechanism must be described as a "detection interface" that is compatible with detecting either physical or non-physical properties, but cognitive science lacks the vocabulary for detecting non-physical properties without reifying them physically.

  **Verdict:** I suspect these two desiderata are **not jointly satisfiable** in a rigorous formalization. A fully specified mechanistic model will almost inevitably function as an implicit error theory, thereby violating Metaphysical Neutrality.

  ### V. The Exclusionary Filter

  The single requirement that does the most work to exclude candidate explanations is **Metaphysical Neutrality**.

  *   **Deflationary accounts (Dennett, Frankish):** Excluded because they explicitly treat the intuition as a cognitive error (violating neutrality by siding with physicalism).
  *   **Inflationary accounts (Chalmers' Panpsychism, Dualism):** Often excluded because they explain the reports by positing that the reports are *true* (violating neutrality by siding with realism), or they rely on non-mechanistic causal powers (violating Mechanistic Explicability).
  *   **Phenomenal Concept Strategy (Papineau, Balog):** Often excluded because they rely on the unique nature of phenomenal concepts to explain the gap, which often smuggles in a commitment to the distinctness of the referent (leaning dualist) or relies on a physicalist ontology that the dualist rejects as question-begging.

  Neutrality is the filter that keeps the meta-problem distinct from the hard problem. Most solutions fail because they solve the hard problem *through* the meta-problem.

  ### VI. The Status of Neutrality: Constraint or Thesis?

  You asked whether neutrality between physicalism and dualism is a genuine constraint or already a substantive metaphysical thesis.

  **It is a genuine methodological constraint, but it is an unstable one.**

  Here is the case:

  1.  **Why it is a Constraint:** The meta-problem is defined *logically prior* to the hard problem. Chalmers' formulation is: "Can we explain why we *think* there is a hard problem, regardless of whether there *is* one?" If you abandon neutrality, you dissolve the meta-problem. If you assume physicalism, you are doing cognitive science of error. If you assume dualism, you are doing metaphysics of mind. The utility of the meta-problem framework rests entirely on the possibility of a neutral bridge. Therefore, formally, it is a constraint.
  2.  **Why it functions as a Thesis:** In the context of naturalistic cognitive science, "Neutrality" functionally operates as a shield for **Physicalism**.
      *   When a physicalist demands neutrality, they are often saying: "Give me a physical explanation of the report that doesn't force me to admit qualia exist."
      *   When a dualist demands neutrality, they are saying: "Give me an explanation of the report that doesn't force me to admit qualia are illusory."
      *   However, because the *tools* available to solve the meta-problem (neuroscience, computation, psychology) are inherently physicalist tools, a successful mechanistic explanation *looks like* a proof of physicalism.
      *   Therefore, enforcing the constraint of "Mechanistic Explicability" alongside "Neutrality" implicitly loads the dice. It demands a physical explanation that doesn't imply physicalism is the whole story.

  **Conclusion:** Neutrality is a **genuine constraint** required for the meta-problem to exist as a distinct philosophical category. However, it is a **pragmatically unsustainable constraint**. Any solution specific enough to be scientifically useful will inevitably collapse the distinction between "explaining the report" and "explaining the referent," thereby revealing itself as a substantive metaphysical thesis (almost always a form of illusionist physicalism).

  The demand for neutrality is the demand for a map that describes the territory without committing to whether the territory contains mountains or mirages. You can draw the map, but as soon as you add topographical detail (mechanism), you have implicitly committed to the mountains being real or fake.
