prompt: |-
  So I'm a dev, no philosophy training, but I got into a genuinely heated slack argument about sunk costs last week and it made me realize my own gut verdicts are all over the place. The textbook line (which a couple people in the thread kept repeating) is that sunk costs should never matter, only future costs and benefits, full stop. I mostly buy that. But when I list out actual cases, my verdicts don't line up, and I want to know if there's a principle that captures them or whether I'm just rationalizing my own bad habits.

  My cases and verdicts:

  1. My team spent 6 months building a feature nobody asked for and the roadmap has moved on. PM wants to ship it anyway because "we're too deep in to waste the 6 months." Verdict: obviously the sunk cost fallacy, kill it.

  2. Old legacy codebase, ugly, everyone complains, no tests. Someone proposes a full rewrite from scratch because the current code is garbage. I think continuing to patch the ugly thing is correct, and honestly part of my reason is "there's 10 years of accumulated bugfixes baked into that mess, a rewrite throws all that away." Verdict: this one feels like it's NOT a fallacy, even though it sounds structurally like case 1.

  3. Two hours into a three hour movie I'm hating. My buddy says I paid for the ticket so I might as well stay. Verdict: fallacy, walk out, the money's gone either way.

  4. My sister is 3 years into a PhD, kind of miserable, job prospects meh, and one of her stated reasons for staying is that leaving now would make the 3 years "for nothing." Verdict: I actually think this is pretty reasonable? I can't fully condemn it and it bugs me.

  5. Friend in a ten year relationship that's gone flat — no toxicity, just coasting — and when asked why he stays, "a decade in" is genuinely one of his reasons. Verdict: I wince, but again I can't bring myself to call it flat-out irrational, even though it's the same shape as case 4.

  6. A company keeps funding a dying product line because "we've already sunk $40M into it." Verdict: textbook fallacy, textbook.

  7. I keep going to a kickboxing gym I've paid a year membership for, even in weeks I don't enjoy it, partly because the year is paid for. Verdict: fine, no objection. (Is this even sunk cost reasoning or is that just... economics?)

  My tentative attempt at a principle: sunk costs matter when they've left behind something durable that still does work — the bugfixed code, the shared history, the two-thirds-finished degree — and don't matter when they're just gone, like money paid or hours already endured. This saves 2, and maybe 4 and 5, and it still condemns 1 and 6. But then case 3 vs case 4 bothers me, because they're both "endure misery to reach a completion," and I say walk out of the movie and stay in the PhD. Is the difference that the PhD leaves a credential and the movie leaves nothing? That feels like a different principle than the durable-residue one and I'm not sure they can both be true.

  So: is there one principle (or maybe a short list of them) that captures most of these verdicts? Which of my verdicts would you tell me to just give up on — I suspect 5 is the one holding me hostage? Please state the principle precisely enough to make predictions, tell me what it says about a couple of cases I haven't listed (e.g. half-built house I no longer love, or finishing a 900-page novel I'm 700 pages into and hating), and be honest about which of my gut calls your principle has to overturn rather than accommodate. Also happy to be told the textbook is just right and all my lenient verdicts are motivated reasoning — my coworker Dave certainly thinks so.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Developer, no philosophy training, pragmatic, analytical mindset ("dev brain").
      *   **Context:** Heated Slack argument about sunk cost fallacy (SCF).
      *   **Conflict:** Textbook definition (ignore sunk costs, look only at future utility) vs. intuitive gut verdicts on specific cases.
      *   **Goal:** Wants a principled framework that explains *why* some sunk costs feel relevant and others don't, or confirmation that their gut is wrong.
      *   **Specific Cases:** 7 scenarios with varying verdicts (Kill feature, Keep legacy code, Leave movie, Stay in PhD, Stay in relationship, Kill product line, Keep gym membership).
      *   **User's Hypothesis:** Sunk costs matter if they leave "durable residue" (code, degree, history).
      *   **Request:** A precise principle, predictions on new cases, honesty about which gut calls must be overturned.

  2.  **Deconstruct the Sunk Cost Fallacy (SCF):**
      *   *Textbook Definition:* Rational agents maximize expected future utility. Past costs are unrecoverable and should not influence the decision *unless* they correlate with future costs/benefits.
      *   *The Nuance:* The textbook definition is often taught too rigidly. In reality, "sunk costs" often carry *information* or create *switching costs* or *completion bonuses* that *are* future-relevant.
      *   *Key Distinction:* Is the cost *truly* sunk (gone forever with no trace), or is it an investment that created an asset/state change that affects future utility?

  3.  **Evaluate the User's Cases against Economic/Philosophical Principles:**

      *   *Case 1 (Feature):* Textbook SCF. No future value, just past effort. Verdict: Kill. (User agrees).
      *   *Case 2 (Legacy Code):* Not SCF. The "10 years of bugfixes" are *assets*, not costs. Rewriting loses the asset. This is about *switching costs* and *asset value*, not the cost itself. Verdict: Keep. (User agrees).
      *   *Case 3 (Movie):* Textbook SCF. Money gone. Enjoyment negative. No asset gained by finishing. Verdict: Leave. (User agrees).
      *   *Case 4 (PhD):* Complex. 3 years isn't just time; it's *progress toward a threshold*. A PhD is a binary credential (mostly). Quitting at 90% yields 0% of the credential value. This is the *Completion Effect* or *Threshold Utility*. Verdict: Stay (conditionally). (User agrees).
      *   *Case 5 (Relationship):* Complex. "A decade in" implies shared history, intertwined finances, social capital. These are *assets*. But if the future is flat/miserable, is the asset valuable? This is the trickiest one. It might be *Loss Aversion* masquerading as asset valuation. Verdict: Wince but understand. (User is unsure).
      *   *Case 6 (Product Line):* Textbook SCF. $40M gone. Future looks dying. Verdict: Kill. (User agrees).
      *   *Case 7 (Gym):* This is actually *not* SCF in the way described. If the membership is prepaid, the marginal cost of going is zero. If going yields *some* benefit (health, habit) > 0, it's rational to go. If the user hates it (negative utility), staying is SCF. User says "fine," implying some benefit exists. Verdict: Rational if utility > 0.

  4.  **Develop the Unifying Principle:**
      *   The user's "durable residue" hypothesis is close but needs refinement.
      *   *Better Principle:* **Sunk costs are irrelevant *except* when they serve as a proxy for Future Value, Switching Costs, or Threshold Completion.**
      *   *Refined Principle:* **The "Forward-Looking Asset" Test.** Does the past expenditure create a current asset or state that increases future utility *specifically because* of that expenditure?
          *   If Yes (Legacy code bugfixes, PhD credits, Relationship shared history): It's not a sunk cost fallacy; it's valuing an asset.
          *   If No (Movie ticket money, Feature dev time with no users): It is a sunk cost fallacy.
      *   *The "Threshold" Nuance:* Some projects have non-linear utility (0 until finished). The PhD is a threshold case. The Movie is usually linear (enjoyment per minute).

  5.  **Address the Specific Tensions (Movie vs. PhD):**
      *   Why leave the movie but stay in the PhD?
      *   *Movie:* Utility is consumption-based. Past 2 hours don't make the last hour better. No credential at the end.
      *   *PhD:* Utility is outcome-based. The credential requires completion. Past 3 years are *necessary conditions* for the future payoff.
      *   *Principle:* **Linearity of Utility.** If value accumulates continuously (movie), leave. If value is binary/threshold (degree), consider finishing *if* the threshold is reachable and valuable.

  6.  **Address the Relationship (Case 5):**
      *   This is the hardest. "A decade in" creates switching costs (dividing assets, social fallout) and shared history (deep knowledge of partner).
      *   However, if the future is "flat," the asset value is low.
      *   *Honest Verdict:* This is likely motivated reasoning (Loss Aversion). The "shared history" asset is only valuable if the future relationship leverages it. If the relationship is dead, the history is a museum exhibit, not a tool.
      *   *Advice:* Tell the user their gut on Case 5 is likely wrong/rationalizing.

  7.  **Address the Gym (Case 7):**
      *   If the membership is prepaid, the money is sunk. The decision is: Does going to the gym today provide >0 utility?
      *   If "don't enjoy it" means negative utility, it's SCF.
      *   If "don't enjoy it" means "it's hard but good for me," it's rational investment.
      *   *Correction:* User needs to distinguish between "sunk cost reasoning" (I must go because I paid) vs. "marginal analysis" (I should go because it's free now and good for me).

  8.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, dev-to-dev (use analogies like technical debt, build pipelines).
      *   *Structure:*
          1.  Validate the intuition (Textbook is too simple).
          2.  Propose the Principle (The "Forward-Looking Asset" Test + Threshold Utility).
          3.  Apply to User's Cases (Explain *why* 2, 4, 5 differ from 1, 3, 6).
          4.  New Cases (House, Novel).
          5.  The Hard Truth (Which verdicts to overturn: Case 5 and potentially 7).
          6.  Summary/Heuristic.

  9.  **Refining the Principle (Self-Correction during drafting):**
      *   Make sure not to say "Sunk costs matter." Say "The *results* of the sunk costs matter."
      *   Distinguish between *Investment* (creates asset) and *Expense* (consumed).
      *   Case 5 (Relationship) needs careful handling. It's not purely economic. But logically, if the future utility is negative, the past doesn't save it. I need to be firm here that Case 5 is likely the rationalization point.

  10. **Final Polish:** Check against the prompt requirements.
      *   Precise principle? Yes.
      *   Predictions on new cases? Yes (House, Novel).
      *   Honest about overturning gut calls? Yes (Case 5).
      *   Dev-friendly language? Yes.

  **(Self-Correction on Case 7):** The user says "I keep going... even in weeks I don't enjoy it." If utility is negative, it *is* SCF. I need to point out that "health benefits" are future benefits, not sunk cost justification. If the *net* future benefit is negative, the prepaid membership shouldn't force you. I will classify this as "Borderline/Rationalization."

  **(Self-Correction on Case 2):** Make sure to emphasize that "10 years of bugfixes" is *knowledge embedded in the system*, which is an asset, not a cost. This validates the user's intuition but corrects the terminology.

  **(Self-Correction on Case 4 vs 3):** The "Completion Bonus" or "Threshold Function" is the key differentiator.

  Let's assemble the response.cw
answer: |-
  This is a fantastic question. You have correctly identified that the "Textbook 101" definition of the Sunk Cost Fallacy (SCF) is often taught too rigidly for real-world engineering and life decisions. Your gut isn't broken; it's detecting signal that the textbook definition ignores.

  However, your gut is also susceptible to loss aversion (Case 5). To separate the signal from the noise, we need a more precise model than "ignore the past."

  ### The Principle: The Forward-Looking Asset Test

  Here is the principle that reconciles your verdicts. It has two clauses. A past expenditure is **relevant** to your decision (i.e., not a fallacy to consider it) **if and only if** it satisfies at least one of these conditions:

  1.  **The Asset Clause:** The expenditure created a durable, transferable asset or state that increases *future* utility specifically because the money/time was spent. (e.g., code stability, course credits, shared knowledge).
  2.  **The Threshold Clause:** The project has a **non-linear utility function** where 90% completion yields 0% of the value, and you are close enough to the threshold that the *marginal* cost of finishing is less than the *total* value of completion.

  If neither clause is met, considering the past expenditure is the Sunk Cost Fallacy.

  ---

  ### Applying the Principle to Your Cases

  Let's run your 7 cases through this compiler.

  **1. The Unused Feature (Verdict: Kill)**
  *   **Asset Clause:** Failed. The code exists, but if the roadmap moved on, the asset has zero future utility.
  *   **Threshold Clause:** Failed. Shipping it doesn't unlock a bonus; it just deploys unused weight.
  *   **Result:** **SCF.** Your gut is right. Kill it.

  **2. The Legacy Codebase (Verdict: Keep)**
  *   **Asset Clause:** **Passed.** The "10 years of bugfixes" are not costs; they are *embedded knowledge*. The code works in production. A rewrite loses that asset. You aren't staying because of the time spent; you're staying because the *current state* is more valuable than the *projected state* of a rewrite.
  *   **Result:** **Not SCF.** This is rational technical debt management.

  **3. The Bad Movie (Verdict: Leave)**
  *   **Asset Clause:** Failed. Watching 2 hours of a bad movie gives you no credential, no skill, and no durable memory you value.
  *   **Threshold Clause:** Failed. Movie utility is linear (enjoyment per minute). The last hour doesn't unlock a "Movie Completed" bonus that pays rent.
  *   **Result:** **SCF.** Your gut is right. Leave.

  **4. The PhD (Verdict: Stay)**
  *   **Asset Clause:** **Passed (Partial).** You have credits and knowledge.
  *   **Threshold Clause:** **Passed.** A PhD is a binary credential. 3 years in yields $0 salary premium. 4 years in yields $$$ salary premium. If the remaining cost (1 year misery) < future value (career premium), staying is rational.
  *   **Result:** **Not SCF.** This is an investment decision based on marginal cost vs. total unlockable value.

  **5. The Flat Relationship (Verdict: Wince/Unsure)**
  *   **Asset Clause:** **Debatable.** Shared history is an asset *if* the relationship continues. If you break up, that history is not transferable to a new partner.
  *   **Threshold Clause:** Failed. Relationships don't have a "10-year completion bonus" that unlocks future happiness.
  *   **Result:** **Likely SCF / Loss Aversion.** This is the dangerous one. "A decade in" is only valuable if the *next* decade leverages it. If the future trajectory is flat/miserable, the past decade is a museum exhibit, not an asset.
  *   **Hard Truth:** Your gut is likely rationalizing here. This is the case you need to surrender.

  **6. The Dying Product Line (Verdict: Kill)**
  *   **Asset Clause:** Failed. $40M is gone. No future revenue.
  *   **Threshold Clause:** Failed. No "launch bonus" pending.
  *   **Result:** **SCF.** Textbook.

  **7. The Gym Membership (Verdict: Fine)**
  *   **Analysis:** This is subtle. The money is sunk. The decision is: *Does going today provide >0 utility?*
  *   If you go *only* because "I paid for it," and you hate every second, that is **SCF**. You are paying a second time with your misery.
  *   If you go because "It's free *now* and I value the health outcome," that is **Rational**.
  *   **Result:** **Borderline.** If you genuinely don't enjoy it and derive no health benefit, you are falling for SCF. If you derive health benefits, you are ignoring the sunk cost correctly (focusing on future health).

  ---

  ### Predictions on New Cases

  Here is how the principle handles the cases you didn't list.

  **Case A: The Half-Built House**
  *   *Scenario:* You bought land and poured a foundation ($100k), but the market crashed, and you no longer love the location. Finishing costs $200k. The finished home value is $250k.
  *   *Analysis:*
      *   **Asset Clause:** The foundation is an asset. It reduces the cost of finishing.
      *   **Math:** Do not count the $100k sunk. Count the *future* costs ($200k) vs. *future* value ($250k). Profit = $50k.
      *   *Verdict:* **Finish it.** (Unlike the movie, the foundation reduces future cost).
      *   *Twist:* If the finished home value is $150k, **abandon it.** The foundation is worthless if the total project loses money.

  **Case B: The 700-Page Novel**
  *   *Scenario:* You are writing a book. 700 pages in. You hate the story. No publisher interest. 200 pages left.
  *   *Analysis:*
      *   **Asset Clause:** Does finishing the draft improve your writing skill more than starting a new book? Maybe.
      *   **Threshold Clause:** Is there value in "Having written a book"? Only if it gets published or serves as a portfolio piece. If it's going in a drawer, the utility is near zero.
      *   *Verdict:* **Quit.** Unlike the PhD, a finished bad novel rarely unlocks a binary reward. The opportunity cost of writing 200 pages of garbage is 200 pages of a *good* new book. (Unless your goal is purely "learn to finish," then the Threshold Clause passes).

  ---

  ### The Hard Truth: Which Verdicts to Overturn

  You asked for honesty. Here is where your intuition is likely lying to you.

  **1. Surrender Case 5 (The Relationship).**
  This is the hostage. "A decade in" is the definition of sunk cost. Unless you can articulate a *future* benefit that specifically requires that decade of history (e.g., "We have a shared business we can't split"), staying solely because of time elapsed is Loss Aversion. The textbook is right here. The "shared history" asset depreciates to zero if the partnership dissolves.

  **2. Audit Case 7 (The Gym).**
  Be honest: Are you going because it makes you healthier (Future Benefit), or because you feel guilty about the fee (Past Cost)? If it's the latter, you are literally paying twice: once with cash, once with misery. Cancel the membership. If you want to work out, buy a new pass next month.

  **3. Defend Case 2 (The Legacy Code).**
  Your coworker Dave might call this SCF, but he is wrong *if* your reasoning is about the bugfixes. If your reasoning is "I wrote this code so I must keep it," that's SCF. If your reasoning is "This code contains 10 years of edge-case handling that a rewrite will break," that is **Asset Valuation**. Make sure you can articulate the difference to Dave.

  ### Summary Heuristic for Devs

  Next time you are in a Slack argument, use this logic:

  > "Sunk costs are irrelevant **unless** they represent **embedded assets** or **progress toward a threshold unlock**."

  *   **Embedded Asset:** Does the past work reduce future cost or increase future capability? (Legacy code, Foundation).
  *   **Threshold Unlock:** Does finishing trigger a binary reward that makes the marginal cost worthwhile? (PhD, Certification).
  *   **Otherwise:** It's gone. Kill the feature, leave the movie, end the relationship.

  Your intuition is mostly sound, but it's over-indexed on "completion" (Case 5) and under-indexed on "opportunity cost" (Case 7). Fix those two, and you have a robust decision framework.
