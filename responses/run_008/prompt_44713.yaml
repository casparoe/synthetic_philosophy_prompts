      *   *Hypothesis 2 (Methodological/Evidential):* Do intuitions about $10^{20}$ people work? This is strong. Cognitive science suggests we don't grasp large numbers (psychophysics of number). If intuitions fail, the dialectic rests on sand.
      *   *Hypothesis 3 (Normative/Additivity):* Is rejecting additivity just restating the intuition? This is the crux. If you reject additivity *because* RC is repugnant, it's circular. If you reject it based on independent structural principles (e.g., separability violations, context-dependence), it's substantive.

  3.  **Address Question 1: Diagnosis of the Disagreement:**
      *   It's not primarily verbal. Everyone agrees on the formal setup.
      *   It's not primarily empirical (though empirical psychology of intuition matters).
      *   It *is* a clash of "reflective equilibria" involving bedrock intuitions vs. structural constraints.
      *   *Key Insight:* The disagreement is about *weighting* conflicting intuitions. Totalists weight "Betterness of Additions" (adding good lives makes things better) higher than "Non-Elitism" (avoiding RC). Non-totalists do the reverse.
      *   *Refining Hypothesis 3:* It's not circular if grounded in independent axioms (e.g., Separability, Independence). But often, the axioms are chosen *to save* the intuition. This suggests a "Coherentist Standoff."

