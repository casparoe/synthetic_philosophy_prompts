      *   **Questions:**
          1.  Diagnose the *kind* of disagreement (verbal, empirical, evidential, bedrock).
          2.  Address the impossibility theorems: Is the question "which axiology is true?" ill-posed (like set theory)? Is the real action choosing which adequacy condition to drop?
          3.  Assess prospects for progress (formal results, new thought experiments, empirical work, new questions) vs. permanent standoff.
          4.  Practical advice for the PhD thesis (given the ticking clock).
      *   **Tone:** Academic, rigorous, honest, direct, sympathetic to the frustration. Avoid basic introductions to population ethics (they know it).

