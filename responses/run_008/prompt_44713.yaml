      *   *Specific References:* Mention Arrhenius, Parfit, Huemer, Tarski (for set theory analogy), maybe Williamson on methodology.
      *   *Refining the "Circularity" point:* Distinguish between *axiomatizing* an intuition vs. *explaining* it. If the only reason for an axiom is to block RC, it's ad hoc. If the axiom has independent motivation (e.g., from individual ethics), it's stronger.

  8.  **Final Polish:** Ensure the distinction between "first-order population ethics" and "meta-population ethics" is clear. Emphasize that the "stall" is a feature, not a bug, of the current methodological approach (reflective equilibrium).

  *(Self-Correction during drafting)*: I initially thought about suggesting empirical psychology. But philosophers often dismiss "is-ought" here. I need to frame it as *debunking* arguments (e.g., if our intuition about Z is driven by scope neglect, does that undermine it?). Also, need to be careful about the Set Theory analogy. Set theory axioms are chosen for mathematical fruitfulness. Population ethics axioms are chosen for moral plausibility. The analogy works on "underdetermination," not "utility."

