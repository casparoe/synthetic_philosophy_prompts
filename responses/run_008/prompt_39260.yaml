  Based on the track record you've provided, here are the predictions, the underlying rule, and the test case to confirm it.

  ### The Predictions

  **1. The Sister's Situation (Severe Mitochondrial)**
  **Verdict: Fine.**
  Your friend will likely say it is permissible for the sister to conceive.
  *   **Why:** This mirrors her verdict on the *Mitochondrial (Mild)* case. Her consistent exception has been: "If *every* biological option leads to the condition, and the life is worth living, it's not wrong." Even though the suffering is severe, she explicitly stipulates the life is *still worth living*. In her framework, biological necessity acts as a shield against moral blame, provided the resulting life clears the "worth living" threshold.

  **2. The Mild-Condition Couple + Adoption**
  **Verdict: Wrong.**
  Your friend will likely say it is wrong for the couple to conceive the affected child if they could adopt a healthy one.
  *   **Why:** This mirrors her verdict on the *Medication/Wait* case. In that case, waiting two months allowed them to have a *different, healthy child* instead of the affected one. To her, adoption functions the same way as waiting: it is an available alternative that results in a healthy child entering their family rather than a child with a condition. If a healthy child is available to be raised, choosing to raise an affected child is a moral failure.

  ### The Rule: Comparative Alternatives

  I would bet on **Rule 1: Something comparative about available alternatives.** (Philosophers often call this the "Same-Number Quality Claim" or the "Better-Child Principle.")

  **Why this rule fits best:**
  *   **It explains the "Wrong" verdicts (Cases 1, 4, 5):** In every instance where she called an action *wrong*, there was a specific alternative action that would have resulted in a *different person* having a *better life*. (Wait 2 months = Healthy Kid B vs. Sick Kid A; IVF = Healthy Embryo B vs. Sick Embryo A; Govt Policy = Better-off Citizens B vs. Worse-off Citizens A).
  *   **It explains the "Fine" verdicts (Cases 2, 3):** In the *Freak Accident*, there was no *knowable* alternative. In the *Mitochondrial (Mild)* case, there was no *biological* alternative. Her rule isn't "Minimize suffering" (Impersonal); it's "Don't choose a worse-off child when a better-off child was an option."
  *   **Why not the other two?**
      *   *Duties to the Actual Kid (Person-Affecting):* This rule fails Case 1 and Case 5. In standard Nonidentity logic, the "actual kid" in Case 1 (the one born with the condition) is not harmed by being conceived; without that choice, they wouldn't exist at all. Since your friend calls this *wrong*, she has implicitly rejected the idea that we only owe duties to the specific individual who exists.
      *   *Impersonal Quality (Utilitarian):* This rule fits most cases but struggles with the *Mitochondrial (Mild)* case. A strict impersonal view might ask, "Why create a disabled child at all if you can create none?" or press harder on the "Mild" vs. "Severe" distinction. Your friend's reliance on the "biological necessity" exemption suggests she cares about the *choice between specific children*, not just the abstract sum of happiness.

  ### The Tie-Breaker Case

  To settle whether she is truly running the **Comparative Rule** or the **Impersonal Rule**, spring this case on her:

  **The "Quantity vs. Quality" Case**
  > "A couple has enough resources to raise children. They have two options:
  > 1.  Have **one** child who will be **healthy**.
  > 2.  Have **two** children, both of whom will have the **mild condition** (lives clearly worth living, same as your previous cases).
  >
  > Total happiness is higher in Option 2 (two good lives vs. one good life). No specific child in Option 2 is worse off than the child in Option 1 (because they are different people). Which is wrong?"

  **How it splits the rules:**
  *   **Comparative Rule (My Bet):** She should say **Fine** (either option is okay). Why? Because in Option 2, no *specific* child is worse off than they would have been in Option 1. The healthy child from Option 1 never exists in Option 2, so they aren't harmed. This fits her pattern of looking for a "better-off alternative identity."
  *   **Impersonal Rule:** She should say Option 1 is **Wrong** (or Option 2 is Obligatory). Why? Because two lives worth living create more total value than one. If she is driven by the impersonal quality of lives brought about, she should maximize the number of worth-living lives.

  If she hesitates or says "Fine" to having two affected children instead of one healthy one, you've confirmed she is running a **Comparative/Identity-Based** rule, not a purely Impersonal one.
