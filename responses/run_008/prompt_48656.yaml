      *   **Lens:** P.F. Strawson's "Freedom and Resentment" (reactive attitudes framework).
      *   **Goal:** A serious mapping of the TRC onto Strawson's theory, followed by an honest account of where the mapping breaks (in both directions).
      *   **Specific Questions to Address:**
          *   Is amnesty a suspension of reactive attitudes (keeping participant stance) or a switch to the objective attitude?
          *   Is the TRC structure an institutionalized excuse/exemption process? Does confession work like "he couldn't help it"?
          *   Does Strawson's claim about the naturalness/non-optionality of reactive attitudes predict TRC collapse, or does his allowance for mitigation explain its survival?
          *   *Pressure Points:* Interpersonal vs. Institutional (Who is the "we"? Is official forgiveness coherent?).
          *   *Vicarious Resentment:* Does it survive institutional routing?
          *   *Reverse Lens:* What does the TRC show about Strawson's theory? Does political restructuring of blaming practices threaten his anti-metaphysical stance or vindicate it?
          *   *Cynicism:* Acknowledge the role of statecraft/politics vs. moral undertaking.

  2.  **Initial Brainstorming & Conceptual Alignment:**
      *   *Strawson:* Reactive attitudes (resentment, gratitude, indignation) are the fabric of moral community. We can't just drop them (objective attitude is for therapy/management, not relationships). Excuses (didn't know) and Exemptions (psychologically abnormal/child) modify them.
      *   *TRC:* Amnesty for truth. No prosecution (mostly). Victims testify. Perpetrators confess. Goal: National unity, preventing civil war.
      *   *Tension:* Strawson says reactive attitudes are natural human responses. The TRC asked a nation to *institutionalize* the withholding of punishment (a key expression of resentment/indignation) in exchange for truth. This feels like a forced shift toward the objective attitude, but framed as "reconciliation" (which implies a return to participant stance).
      *   *Key Distinction:* Forgiveness vs. Amnesty. Forgiveness is interpersonal (Strawsonian). Amnesty is legal/political (State-level).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the TRC briefly (Tutu, amnesty for truth, no prosecutions). Define Strawson briefly (reactive attitudes, participant vs. objective stance). State the thesis: The TRC attempts to institutionalize a modification of reactive attitudes that Strawson claims are pre-institutional, creating a friction that reveals both the flexibility and the limits of his framework.

      *   **Mapping the TRC onto Strawson (The "Fit"):**
          *   *Amnesty as Exemption/Excuse?* Strawson talks about individual excuses ("I didn't know") or exemptions ("He's ill"). The TRC offered a *political* exemption ("It was politically motivated"). This isn't quite "he couldn't help it," it's more "the context made it normative within that regime."
          *   *Participant vs. Objective:* If the state says "no jail," is it treating perpetrators as objects to be managed (objective) or moral agents to be reintegrated (participant)? Tutu argued the latter (Ubuntu, restoration). But legally, it looks like the former (immunity).
          *   *Modulation:* Strawson says we modulate attitudes constantly. The TRC made this modulation *explicit* and *mandatory*. Instead of organic forgiveness, it was legislated mitigation.

      *   **The Breaking Points (Strawson's Limits):**
          *   *The "We" Problem:* Strawson is about *interpersonal* relationships (I resent you). The TRC is *political* (The State forgives on behalf of the Victim). Strawson doesn't have a category for "vicarious indignation" at a state level. Can the Commission resent for me? Many victims said "No." This breaks the "naturalness" claim.
          *   *Transactional Forgiveness:* Strawsonian forgiveness is a change of heart. TRC amnesty was a transaction (Truth for Immunity). You can get amnesty without remorse (technically), just full disclosure. This decouples the attitude from the action.
          *   *The Objective Stance Trap:* To prevent civil war, the state effectively asked victims to adopt the objective stance toward torturers ("Let's move on for stability"). Strawson says we can't live like that permanently. The lingering anger in SA suggests he was right.

      *   **Running it the Other Way (TRC's Critique of Strawson):**
          *   *Social Engineering of Attitudes:* Strawson says attitudes are "natural" and "given." The TRC shows they can be *designed*. We can build institutions that encourage or discourage resentment. This challenges Strawson's quietism. It suggests the "given" is actually malleable.
          *   *Metaphysics vs. Politics:* Strawson says free will debates don't matter for responsibility practices. The TRC proves this *and* complicates it. It didn't matter if apartheid agents were "determined" by ideology; what mattered was the *political utility* of holding them responsible vs. letting them go. This vindicates Strawson's shift away from metaphysics, but adds a *political* layer he ignored.
          *   *The Cynicism Factor:* The TRC wasn't just moral; it was a negotiated settlement to avoid bloodshed. Strawson assumes a moral community. The TRC reveals a *power* community. If reactive attitudes are tools of power, Strawson's "human nature" argument looks like ideology.

      *   **Conclusion:** Summarize. The TRC is a stress test for Strawson. It shows reactive attitudes are robust but manipulable. It shows the limits of institutionalizing the interpersonal.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I address the "excuse vs. exemption" distinction clearly? *Correction:* Make sure to distinguish between "I didn't know" (excuse) and "I was acting for the State" (TRC justification). The TRC justification is closer to a *political exemption* based on the extraordinary circumstances of the transition.
      *   *Check:* Did I handle the "Objective Attitude" nuance? *Correction:* Ensure I don't just say "TRC = Objective." Tutu argued it was a *higher* Participant stance (Ubuntu). I need to present that tension.
      *   *Check:* Is the tone right? *Correction:* Keep it analytical, not judgmental. Acknowledge the tragedy and the necessity.
      *   *Check:* Did I answer the specific prompt about "who is the we"? *Correction:* Dedicate a specific paragraph to the proxy problem of vicarious resentment.

  5.  **Final Review against Prompt Requirements:**
      *   Mapping done seriously? Yes.
      *   Honest account of breaks? Yes.
      *   Amnesty as suspension vs. objective attitude? Addressed.
      *   Institutionalized excuse/exemption? Addressed.
      *   Naturalness prediction (collapse vs. hold)? Addressed.
      *   The "We" and official forgiveness? Addressed.
      *   Vicarious resentment through institution? Addressed.
      *   TRC's critique of Strawson (engineering attitudes)? Addressed.
      *   Cynical statecraft distinction? Integrated.

  6.  **Final Polish:** Check for flow and clarity. Ensure Strawsonian terminology (participant stance, objective attitude, reactive attitudes, excuses, exemptions) is used accurately. (Self-correction: Ensure I don't conflate "amnesty" with "forgiveness" too loosely, as that's a key friction point).

