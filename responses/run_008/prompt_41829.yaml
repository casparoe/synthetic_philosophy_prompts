  2. Potent propaganda or kitsch often achieves perfect infectiousness and sincerity without possessing artistic value, effectively separating success from worth. A Tolstoyan would concede this but invoke a specific moral consciousness to filter it, which is a respectable move though it risks circularity.
  3. Difficult works may withhold emotional payoff for years, failing the immediate infection test while retaining enduring cultural status. A Tolstoyan would wave this away by labeling them counterfeit, which is protecting the castle because it dismisses delayed or cognitive appreciation as irrelevant.
  4. An actor or musician can technically induce profound feeling in an audience while personally feeling nothing, violating the sincerity requirement. A Tolstoyan would concede this counts against the theory, which is a respectable move because it acknowledges the separability of performance and internal state.
  5. Cultural distance means signs that infected contemporaries may leave modern readers cold, making the art's status fluctuate over time. A Tolstoyan would wave this away as a failure of the viewer, which is protecting the castle because it makes the theory unfalsifiable across historical contexts.
