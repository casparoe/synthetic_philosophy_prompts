prompt: |-
  You're a statistician who has spent way too much of your career dealing with aggregated data, and you're also good at explaining this stuff to normal humans. I need your help turning the ideas around Simpson's paradox into something my team can actually use.

  Context: I run a small analytics unit at a regional healthcare network. Roughly once a week someone asks us a question of the form "is A doing better than B?" -- is hospital A's readmission rate lower than hospital B's, is the new care protocol better than the old one, did patient satisfaction go up after the staffing change. The analysts usually pull the numbers, compute a couple of aggregate rates, and hand over a table. Twice now we've been burned by Simpson-type reversals: the aggregate said one thing, and as soon as someone broke it down by patient severity or by department, the story flipped, and it flipped in a way that embarrassed us in front of the board. So I want a written procedure, not just "be careful."

  Before you write the procedure, take a moment to brainstorm and get the conceptual foundations straight, because I want the procedure to be principled rather than a pile of heuristics. In particular, think through the distinction between a genuine Simpson's reversal (the sign of the association flips between the marginal and the conditional analysis) and the more general problem of aggregation bias, where the marginal number is just misleading without literally reversing. Think also about the point that whether you should condition on the third variable is not a statistical question -- it depends on the causal structure, on whether the subgrouping variable is a plausible common cause of the treatment and the outcome, or a mediator you'd be conditioning away, or just noise. The procedure has to encode that reasoning somehow without requiring my analysts to draw DAGs, unless you really think they should.

  The procedure itself should cover, at minimum: when the analyst is required to check for a possible reversal before sending numbers out (every time? only when the marginal comparison is close? only for certain kinds of questions?); how to pick which disaggregation variables to look at, given that we have dozens in the data and could slice forever; what to do when the subgroups are so small that the breakdowns are themselves statistical garbage -- is there a principled stopping rule or is it a judgment call, and if so whose; what the deliverable to the requester looks like when the aggregate and the disaggregated pictures disagree; and when the procedure should escalate to me rather than let the analyst decide. Be explicit about the steps where judgment cannot be eliminated -- I'd rather know where the honest uncertainty is than get a fake sense of objectivity.

  Then run the procedure on three cases, worked through concretely:

  1. Hospital A has a higher mortality rate than Hospital B overall, but A is the region's trauma center so its patients are much sicker. Everyone already suspects what the right answer is here, but show me how the procedure arrives at it rather than just asserting it, including what the analyst tells the requester.

  2. A new post-surgical protocol looks better than the old one on the aggregate numbers, but once you split by which surgeon performed the procedure, the advantage disappears within each surgeon's patients -- the new protocol happened to be adopted first by the surgeons with better outcomes. Show what the procedure does when the disaggregated answer kills the headline.

  3. This is the one I actually want you to be tough on: patient satisfaction scores went up network-wide after a staffing change, but satisfaction went down within every single department. So the network-wide improvement is an artifact of departments with higher baseline satisfaction growing as a share of the total, and every department is actually slightly worse off. The requester here is the person who championed the staffing change, senior to me, and she wants a clean positive number for her quarterly review. Walk me through what the procedure says to report, how the analyst is supposed to communicate it, and where the procedure hands the decision up to me because it's not really a statistics problem anymore.

  Also tell me where this procedure will misfire. What kinds of questions does it handle badly, and what's the failure mode when analysts start treating it as a box to tick rather than as reasoning? If you think there are structural things about how my unit is set up that make these errors more likely, say so -- I can take it.

  Please think carefully and don't just dump textbook material at me. Write it like something I could actually hand to my team on monday morning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Statistician with extensive experience in aggregated data, good at explaining to non-experts.
      *   **Task:** Create a written procedure for an analytics unit in a regional healthcare network to handle Simpson's Paradox and aggregation bias.
      *   **Context:** Small analytics unit, frequent "Is A better than B?" questions, previously burned by reversals embarrassing them in front of the board.
      *   **Requirements:**
          *   Brainstorm conceptual foundations first (Simpson's vs. Aggregation Bias, Causal Structure vs. Statistical Adjustment).
          *   Create a concrete procedure (When to check, how to pick variables, small sample issues, deliverables, escalation).
          *   Acknowledge where judgment is needed (no fake objectivity).
          *   Run the procedure on three specific cases (Trauma Center Mortality, Surgical Protocol/Surgeon Skill, Satisfaction Scores/Department Mix).
          *   Critique the procedure (Where will it misfire? Failure modes? Structural issues).
      *   **Tone:** Practical, principled, authoritative but accessible, "Monday morning ready."

  2.  **Conceptual Foundations (Brainstorming):**
      *   *Simpson's Paradox vs. Aggregation Bias:* True Simpson's is a sign flip ($A > B$ overall, $A < B$ in all subgroups). Aggregation bias is just magnitude distortion ($A \gg B$ overall, $A > B$ in subgroups but smaller). Both are bad, but the sign flip is the reputation killer. The procedure needs to guard against both, but prioritize the sign flip.
      *   *The Causal Question:* This is the crux. Conditioning on a confounder (common cause) is good. Conditioning on a collider or a mediator is bad.
          *   *Confounder:* Patient Severity affects both Hospital Choice and Mortality. Must adjust.
          *   *Mediator:* Protocol affects Length of Stay affects Satisfaction. Adjusting for Length of Stay hides the Protocol's effect.
          *   *Collider:* Don't open the collider.
      *   *The "No DAGs" Constraint:* Analysts aren't causal inference experts. I can't ask them to draw DAGs every time. I need a heuristic or a checklist that approximates causal thinking without the formalism. "The Story Test" or "The Timeline Test."
      *   *Small Samples:* If you slice too thin, variance explodes. Need a rule of thumb (e.g., minimum $n$ per cell) but acknowledge it's a judgment call.
      *   *Escalation:* When the data says "It depends" but the boss wants "Yes/No," that's a political/strategic problem, not statistical. That needs escalation.

  3.  **Drafting the Procedure:**
      *   *Name:* Needs to sound official but clear. "The Stratification & Context Protocol."
      *   *Trigger:* When is this required? Every comparative metric. Don't gamble on "close calls" because you don't know the variance yet.
      *   *Variable Selection:* Don't slice by everything. Slice by *plausible confounders*. Use a "Pre-Analysis Confounder List" (PACL) specific to common metrics (e.g., Severity for mortality, Case Mix for satisfaction).
      *   *Small Cells:* Set a threshold (e.g., $n < 30$). If breached, flag as "Unstable."
      *   *Deliverable:* Never just one number. "Overall Rate" + "Adjusted Rate" or "Range of Subgroup Rates."
      *   *Escalation:* If Overall and Subgroups disagree (Sign Flip), *must* escalate. If they disagree on magnitude significantly, *recommend* escalation.

  4.  **Developing the Case Studies:**
      *   *Case 1 (Trauma Center):* Classic confounding (Severity).
          *   *Procedure Step:* Identify Severity as a confounder. Stratify.
          *   *Result:* A looks worse overall, better within severity levels.
          *   *Communication:* "A treats sicker patients. Adjusted for severity, A is safer."
      *   *Case 2 (Protocol/Surgeon):* Classic confounding (Sur Skill).
          *   *Procedure Step:* Identify Surgeon as a confounder (Skill drives Protocol adoption and Outcome).
          *   *Result:* Protocol looks good overall, neutral/bad within surgeon.
          *   *Communication:* "Protocol isn't the driver; Surgeon selection was." Kill the headline.
      *   *Case 3 (Satisfaction/Staffing):* This is the tricky one. It sounds like Simpson's, but is it?
          *   *Scenario:* Overall Up, Subgroups Down. This implies a composition shift (high-satisfaction depts grew).
          *   *Causal Structure:* Staffing Change -> Satisfaction? Or Staffing Change -> Dept Growth -> Satisfaction?
          *   *The Trap:* If the goal is "Network Performance," the aggregate *might* be the right number (composition is part of reality). If the goal is "Did the intervention work?", the subgroup is right.
          *   *Procedure Action:* This is an escalation. It's a definition problem, not just math. The senior leader wants the aggregate; the data says the intervention failed locally.
          *   *Communication:* Nuanced. "Network score up due to mix shift, but local performance dipped."

  5.  **Critiquing the Procedure (Failure Modes):**
      *   *Box-ticking:* Analysts stratify by everything without thinking.
      *   *Over-adjustment:* Conditioning on mediators (e.g., adjusting for length of stay when evaluating a protocol that reduces length of stay).
      *   *Analysis Paralysis:* Too many variables, no answer.
      *   *Structural Issue:* The unit is treated as a "number vending machine" rather than a partner. If the culture demands simple answers, the procedure won't save them.

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be direct about the politics (Case 3).
      *   Emphasize that statistics informs decision, it doesn't make it.
      *   Make it look like a memo/SOP.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "No DAGs" constraint? *Yes, use the "Timeline & Story" checklist.*
      *   *Check:* Did I handle the small sample issue? *Yes, added the 'Stability Threshold'.*
      *   *Check:* Is Case 3 handled toughly enough? *Need to ensure I don't just say 'report both'. I need to highlight the conflict between 'Network Metric' vs 'Intervention Efficacy'.*
      *   *Check:* Is the distinction between Simpson's and Aggregation Bias clear? *Yes, in the foundations section.*

  8.  **Final Polish:** Organize with clear headings. Ensure the "Monday Morning" feel is present. (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Analytics Unit Staff
  **FROM:** [Your Name], Lead Statistician
  **SUBJECT:** Standard Operating Procedure: Comparative Metrics & Aggregation Risk
  **DATE:** October 26, 2023

  ---

  ### Part 1: Conceptual Foundations (Read This First)

  Before we get to the checklist, we need to agree on what we are actually fighting. We have been burned twice by "Simpson's Paradox." In plain English, that's when the trend in the total data points one way, but the trend in every subgroup points the other way.

  However, "Simpson's" is just the dramatic version of a broader problem: **Aggregation Bias.** Even if the sign doesn't flip, an aggregate number can lie by hiding *who* is in the mix.

  **The Golden Rule:** An aggregate number (e.g., "Hospital A's Mortality Rate") is only meaningful if the groups being aggregated are comparable. If Hospital A treats 90% trauma cases and Hospital B treats 90% routine checkups, comparing their raw mortality rates is like comparing a ER to a spa. It's not just biased; it's nonsense.

  **The Causal Trap:**
  The hardest part of this isn't the math; it's deciding *which* variables to split by.
  *   **Good to split (Confounders):** Variables that exist *before* the intervention and affect both the group assignment and the outcome. (Example: Patient Severity affects which hospital they go to *and* whether they die).
  *   **Bad to split (Mediators):** Variables that happen *after* the intervention and are caused by it. (Example: If a new protocol reduces Length of Stay, do not split by Length of Stay. You will hide the protocol's success).
  *   **Noise:** Variables unrelated to the outcome. Splitting by these just adds random noise.

  We are not going to require you to draw causal diagrams (DAGs) for every request. That's impractical. Instead, we will use a "Timeline & Story" heuristic in the procedure below.

  ---

  ### Part 2: The Procedure (SOP-04: Comparative Risk)

  **Trigger:** This procedure applies to **all** requests comparing two or more groups (Hospital A vs. B, Protocol New vs. Old, Before vs. After) on a rate or proportion metric.

  #### Step 1: The "Timeline & Story" Check (Variable Selection)
  Before running the aggregate, list the top 3 potential confounding variables. To select them, ask:
  1.  **Timeline:** Did this variable exist *before* the comparison started? (If yes, it's a candidate. If no, it might be a mediator—do not adjust).
  2.  **Imbalance:** Is this variable distributed unevenly between the groups? (e.g., Is Group A much older than Group B?)
  3.  **Impact:** Does this variable strongly predict the outcome? (e.g., Does Age predict Mortality?)

  *Action:* Select variables that answer **Yes** to all three. Common defaults:
  *   *Mortality/Readmission:* Patient Severity Score, Age, Emergency vs. Elective.
  *   *Satisfaction:* Department, Patient Acuity, Insurance Type.
  *   *Protocol Efficacy:* Provider/Surgeon, Baseline Risk.

  #### Step 2: The Stability Threshold (Small Sample Rule)
  You cannot slice data forever. If a subgroup is too small, the rate is statistical noise.
  *   **Rule:** If any subgroup cell has fewer than **30 events** (or 300 observations for rare outcomes), mark that subgroup as **"Unstable."**
  *   **Action:** Do not report unstable subgroup rates as fact. Report them as "Directional only." If *all* subgroups are unstable, you must escalate to me before sending numbers.

  #### Step 3: The Comparison
  Calculate the metric in two ways:
  1.  **Marginal:** The raw aggregate rate.
  2.  **Conditional:** The rate within each subgroup identified in Step 1.

  *Decision Logic:*
  *   **Scenario A (Agreement):** Aggregate and Subgroups tell the same story (same direction, similar magnitude). -> *Proceed to Report.*
  *   **Scenario B (Magnitude Shift):** Direction is the same, but the size of the effect changes drastically (e.g., 20% better overall, but only 2% better within subgroups). -> *Report Both. Add Context Note.*
  *   **Scenario C (Reversal/Paradox):** Direction flips (e.g., Better overall, Worse within subgroups). -> **STOP. ESCALATE TO LEAD.** Do not send this to the requester.

  #### Step 4: The Deliverable Format
  Never send a single number for a comparative question. The standard output must include:
  1.  The Aggregate Rate.
  2.  The Range of Subgroup Rates (e.g., "Hospital A ranged from 2%-5% across severity levels").
  3.  A one-sentence "Context Statement" explaining the primary adjustment (e.g., "Adjusted for patient severity").

  #### Step 5: Escalation Points
  Escalate to me immediately if:
  1.  **Scenario C** occurs (Sign Flip).
  2.  The requester explicitly demands "just the top-line number" and refuses context (Political Risk).
  3.  The "Timeline & Story" check suggests the only available variables are likely Mediators (e.g., trying to measure protocol success but only having post-treatment data).

  ---

  ### Part 3: Worked Cases

  Here is how we apply SOP-04 to the three scenarios you provided.

  #### Case 1: The Trauma Center (Mortality Rates)
  *   **Request:** "Is Hospital A's mortality rate lower than Hospital B?"
  *   **Step 1 (Variables):** *Patient Severity.*
      *   Timeline? Yes (exists at admission).
      *   Imbalance? Yes (A is Trauma center, sees sicker patients).
      *   Impact? Yes (Severity predicts death).
      *   *Decision:* Must stratify by Severity.
  *   **Step 2 (Stability):** Both hospitals have enough trauma and non-trauma cases. Stable.
  *   **Step 3 (Comparison):**
      *   Aggregate: A = 5.0%, B = 3.0%. (A looks worse).
      *   Conditional (Severe): A = 10%, B = 15%. (A looks better).
      *   Conditional (Routine): A = 1%, B = 2%. (A looks better).
      *   *Result:* **Scenario C (Reversal).**
  *   **Step 5 (Escalation):** This hits the escalation trigger. I will review the output with you.
  *   **Deliverable:** We do not send the 5.0% vs 3.0% table. We send a report stating: *"While Hospital A has a higher raw mortality rate, this reflects a higher volume of high-severity trauma cases. When comparing patients of similar severity, Hospital A demonstrates lower mortality in both severe and routine categories."*
  *   **Why this works:** We didn't just "adjust." We explained *why* the aggregate was misleading (case mix).

  #### Case 2: The Surgical Protocol (Surgeon Skill)
  *   **Request:** "Is the New Protocol better than the Old Protocol?"
  *   **Step 1 (Variables):** *Surgeon ID.*
      *   Timeline? Yes (Surgeon existed before protocol).
      *   Imbalance? Yes (Top surgeons adopted New Protocol first).
      *   Impact? Yes (Surgeon skill predicts outcome).
      *   *Decision:* Must stratify by Surgeon.
  *   **Step 3 (Comparison):**
      *   Aggregate: New = 95% Success, Old = 90% Success.
      *   Conditional (Surgeon 1): New = 96%, Old = 96% (No diff).
      *   Conditional (Surgeon 2): New = 94%, Old = 94% (No diff).
      *   *Result:* **Scenario C (Reversal/Nullification).** The advantage disappears.
  *   **Deliverable:** This is a "Kill the Headline" moment.
      *   *Report:* *"The aggregate data suggests the New Protocol is superior. However, this association is driven by surgeon selection bias. High-performing surgeons were early adopters. Within individual surgeon practices, the protocol shows no statistically significant difference in outcomes."*
  *   **Why this works:** We saved the network from implementing a costly protocol that does nothing. We attributed the success to the *people*, not the *process*.

  #### Case 3: The Satisfaction Scores (The Political Trap)
  *   **Request:** "Show me the improvement in satisfaction after the staffing change." (Requester: Senior VP, champion of the change).
  *   **Step 1 (Variables):** *Department.*
      *   Timeline? Yes.
      *   Imbalance? Yes (High-satisfaction Depts grew in size).
      *   Impact? Yes (Dept culture drives satisfaction).
      *   *Decision:* Stratify by Department.
  *   **Step 3 (Comparison):**
      *   Aggregate: +5 points (Improvement).
      *   Conditional (Every Dept): -1 to -3 points (Decline).
      *   *Result:* **Scenario C (Reversal).**
  *   **The Conflict:** The aggregate number is technically "true" for the *network's average patient experience* (because more patients are now in happy departments). But it is "false" regarding the *efficacy of the staffing change* (because every department got worse).
  *   **Step 5 (Escalation):** **MANDATORY.** This is not a statistical decision; it is a strategic one.
      *   *Why:* If we report the Aggregate, we validate a failed intervention. If we report the Subgroups, we embarrass a Senior VP who controls our budget.
      *   *My Role:* I will take this meeting. I will not let an analyst carry this bag.
  *   **Deliverable Strategy:** We report **both**, but we label them differently.
      *   Metric 1: "Network Average Satisfaction" (Aggregate) -> Up 5 points.
      *   Metric 2: "Departmental Performance Trend" (Conditional) -> Down 2 points average.
      *   *Context Statement:* *"Network-wide scores improved due to a shift in patient volume toward higher-performing departments. However, individual departmental scores declined slightly on average, suggesting the staffing change did not improve local conditions."*
  *   **Why this works:** It is factually accurate. It gives the VP her "Network Average" win for the board, but it creates a written record that the *intervention* failed, protecting us if she tries to claim the staffing change caused the lift.

  ---

  ### Part 4: Where This Procedure Will Misfire

  I want you to be aware of the limitations. A procedure is a tool, not a guarantee.

  **1. The "Mediator" Trap (Over-Adjustment)**
  *   **Failure Mode:** An analyst blindly follows Step 1 and adjusts for a variable that is actually a result of the treatment.
  *   **Example:** Evaluating a "Fast-Track Discharge" protocol. If you adjust for "Length of Stay," you will erase the protocol's effect, because the protocol *works by* reducing length of stay.
  *   **Mitigation:** This is why the "Timeline" question in Step 1 is critical. If the variable changes *during* the treatment, flag it for escalation.

  **2. Analysis Paralysis**
  *   **Failure Mode:** Analysts become afraid to release *any* number without 15 stratifications.
  *   **Result:** The unit becomes a bottleneck. Clinicians stop asking us questions because we take two weeks to answer.
  *   **Mitigation:** Stick to the "Top 3 Variables" rule. If the top 3 don't show a reversal, stop. Do not go fishing for a reversal in obscure variables.

  **3. The Box-Ticking Culture**
  *   **Failure Mode:** Analysts treat this as a checklist. "I stratified by Age, so I'm safe."
  *   **Risk:** You might stratify by the wrong variable (e.g., Age instead of Severity).
  *   **Mitigation:** This requires judgment. If you are unsure if a variable is a confounder, ask. It is better to ask me and look inexperienced than to send a wrong number and look incompetent.

  **4. Structural Vulnerability**
  *   **Hard Truth:** This procedure protects *us* from looking stupid, but it doesn't fix the organization's desire for simple answers.
  *   **Risk:** Senior leadership may ignore the "Context Statement" and just circle the Aggregate Number on your slide.
  *   **Mitigation:** Visuals matter. Do not put the Aggregate Number in a big bold font if it's misleading. Use footnotes. If they ignore the footnote, that is on them, provided we have the email trail showing we warned them.

  ### Final Instruction

  Starting Monday, all comparative outputs must include the **"Context Statement"** defined in Step 4. If you cannot write that sentence without lying or hedging, bring the request to me.

  We are not here to generate numbers. We are here to generate *truthful interpretations* of numbers. Sometimes those are the same thing. Often, in healthcare, they are not.

  Let's get to work.
