prompt: |-
  I'm drafting a paper on suffering-focused ethics and, before I engage any particular theory, I want to fix the standard of adequacy first — otherwise every objection I write will just smuggle in my own prejudices about what counts as a failure. Please respond as a professional philosopher working in population ethics and normative theory: think carefully, brainstorm candidate requirements before committing to a list, and then deliver the specification.

  The target family is broad: negative utilitarianism in its strict and moderated forms, lexical or threshold priority views on suffering, suffering-focused consequentialism, and the asymmetric views in population ethics that treat suffering and happiness unequally. The deliverable is the list of desiderata any adequate theory in this family must meet — with the motivating case behind each requirement. To get you started, here are the pressures I already suspect a specification must register, though I don't know which of these are genuine requirements and which are artifacts of how the debate has been run:

  - The asymmetry that started it all: declining to create a happy life seems permissible, creating a miserable life seems wrong, and a theory should either vindicate that asymmetry or explain it away rather than stipulate it. But a strict reading quickly generates trouble.
  - The world-destruction problem: if only suffering counts disapprovingly, a painless universal annihilation looks like an improvement — or even a duty — and most people regard that as a reductio. Is it a non-negotiable desideratum to avoid this conclusion, or is that our naive positive-welfarism talking?
  - The pinprick problem: on some lexical versions, eliminating a single pinprick outweighs any amount of happiness. A theory must either endorse that with a straight face, block it with a principled threshold, or explain why the threshold isn't ad hoc.
  - Ordinary trade-offs: we take a child to be vaccinated, climb mountains, run marathons. A theory that forbids any imposition of suffering for the sake of later joy is a non-starter; one that permits all of it has said nothing. The desideratum has to mark where and why.
  - Camouflage failure: a suffering-focused view must differ in kind from classical utilitarianism with the zero point shifted, or from critical-level views with a baseline at the neutral point — otherwise the distinctive label is decoration.
  - Population axiology: consistency with, or a principled stance on, the repugnant and sadistic conclusions and the non-identity problems that arise once future people enter.
  - Decision guidance under uncertainty: a theory that weights bad outcomes must say something sane about tiny probabilities of astronomically bad ones, without collapsing into either paralysis or fanaticism.

  For each requirement: state it precisely, give the case that motivates it, and mark it as non-negotiable or as a preference of one camp within the family. Then do the three things I actually care most about: flag any pair of desiderata you suspect cannot be jointly satisfied; say which single requirement does the most to exclude otherwise-live candidates; and say whether, if some subset really is jointly unsatisfiable, that fact is itself the headline result — the family being defined by demands no theory can meet at once. Skip scoring the existing theories against the list; I'll do that in the paper.

  One last thing, since I'll be building on your answer: as you go, indicate how confident you are in each major claim, and at the end single out the one point you are least sure of — especially whether any requirement you've marked non-negotiable is a genuine adequacy condition or just the consensus of a particular moment in the debate. I'd rather know where the ground is soft now than find out from a referee later.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher working in population ethics and normative theory.
      *   **Task:** Draft a list of desiderata (standards of adequacy) for suffering-focused ethics (SFE) *before* evaluating specific theories.
      *   **Target Family:** Negative Utilitarianism (NU), Lexical/Threshold Priority Views, Suffering-Focused Consequentialism, Asymmetric Population Views.
      *   **Input:** The user provided a list of suspected pressures (Asymmetry, World-Destruction, Pinprick, Ordinary Trade-offs, Camouflage, Population Axiology, Uncertainty).
      *   **Output Requirements:**
          1.  Brainstorm/Think carefully before committing.
          2.  List desiderata with precise statements, motivating cases, and status (Non-negotiable vs. Camp Preference).
          3.  Identify tensions/incompatibilities between desiderata.
          4.  Identify the single most exclusionary requirement.
          5.  Address whether the joint unsatisfiability is the "headline result."
          6.  Indicate confidence levels throughout.
          7.  Identify the point of least confidence (especially regarding non-negotiable status).
      *   **Tone:** Rigorous, analytical, philosophical, meta-ethical awareness.

  2.  **Initial Brainstorming & Filtering (Internal Monologue):**
      *   *Goal:* I need to define what makes an SFE theory *adequate*, not just what makes it *popular*. This is tricky because SFE is often defined by its deviation from classical utilitarianism (CU). If I set the bar too high based on CU intuitions, I beg the question against SFE. If I set it too low, any coherent view counts.
      *   *The "World-Destruction" Objection:* Is this a genuine flaw or just intuition bombing? Many SFE proponents (e.g., Benatar, certain NUs) actually accept this or modify it (e.g., "only prevent suffering, don't destroy existing happy people"). A strict NU might accept destruction if it's painless. So, marking "Avoid World-Destruction" as *non-negotiable* might exclude the core of the view. I need to nuance this. Maybe the requirement is "Account for the value of existing positive welfare" rather than "Forbid destruction."
      *   *The "Pinprick" Objection:* Lexical views often face this. A threshold view avoids it. Is avoiding lexicality a requirement? No, lexicality is a feature of some SFEs. The requirement should be "Principled handling of trivial vs. severe suffering."
      *   *Camouflage:* This is crucial. If SFE collapses into CU with a different zero point, it's not distinct. This seems non-negotiable for the *label*, but maybe not for the *moral truth*. However, since the user is writing about the *family*, distinctness is key.
      *   *Ordinary Trade-offs:* A theory must allow *some* suffering for *some* gain, or it's impractical. But how much? This is where the "threshold" comes in.
      *   *Population Ethics:* The Asymmetry is the heart of SFE. But the Non-Identity Problem and Repugnant Conclusion loom. SFE often avoids the Repugnant Conclusion (lots of barely happy lives) but risks the "Sadistic Conclusion" (adding miserable lives is worse than adding happy ones, obviously, but what about mixing?).
      *   *Uncertainty:* Pascal's Mugging style problems. If suffering is infinitely bad (or lexically prior), tiny probabilities of extreme suffering dominate. This is a major technical hurdle.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1: The Asymmetry Constraint.* Must capture the intuition that creating suffering is worse than failing to create happiness. *Status:* Non-negotiable (defines the family).
      *   *D2: The Existence Preservation Constraint.* (Refining World-Destruction). Must not entail a duty to annihilate existing happy beings solely to prevent future potential suffering, unless that suffering is guaranteed and extreme. *Status:* Camp Preference (Strict NUs might reject this, but moderate SFEs need it). Let's make it a "Stability Condition."
      *   *D3: The Non-Triviality Condition.* (Refining Pinprick). Must provide a non-arbitrary method for weighing severe suffering against aggregate happiness. *Status:* Non-negotiable (otherwise action guidance fails).
      *   *D4: The Distinctness Condition.* (Camouflage). Must yield different verdicts than CU in non-edge cases. *Status:* Non-negotiable (for the taxonomy).
      *   *D5: The Trade-off Principle.* (Ordinary Trade-offs). Must permit impositions of mild suffering for significant welfare gains. *Status:* Non-negotiable (practical adequacy).
      *   *D6: Population Consistency.* Must handle variable populations without generating the Sadistic Conclusion (adding miserable lives is better than adding happy ones? No, Sadistic Conclusion is usually: adding miserable lives is *worse* than adding happy ones in a way that violates dominance? Wait, standard Sadistic Conclusion is: It's better to add lives with negative welfare than lives with positive welfare under certain total views. SFE usually avoids Repugnant but risks Sadistic). Let's phrase it as "Avoidance of Counter-Intuitive Population Verdicts." *Status:* Camp Preference (hard to satisfy all).
      *   *D7: Risk Sensibility.* (Uncertainty). Must not succumb to fanaticism regarding low-probability extreme suffering. *Status:* Non-negotiable (decision theory adequacy).

  4.  **Identifying Tensions (The "Hard Part"):**
      *   *Tension 1:* Asymmetry vs. Risk Sensibility. If suffering is lexically worse, a tiny probability of extreme suffering outweighs a certainty of happiness. This leads to fanaticism. To avoid fanaticism, you need to discount lexicality, which weakens the Asymmetry.
      *   *Tension 2:* Distinctness vs. Trade-off Principle. If you make suffering distinct (lexical), you struggle to justify ordinary trade-offs (vaccines). If you allow trade-offs (threshold), you look like CU with a shifted baseline (Camouflage).
      *   *Tension 3:* Existence Preservation vs. Strict Asymmetry. If creating suffering is the only sin, and existence guarantees *some* suffering, non-existence is always better. This triggers World-Destruction.

  5.  **Selecting the "Most Exclusionary" Requirement:**
      *   It's likely the combination of *Distinctness* and *Trade-off Principle*. Most theories that allow trade-offs look like CU. Most theories that are distinct (lexical) forbid trade-offs.
      *   Actually, *Risk Sensibility* combined with *Lexical Priority* is the killer. If suffering is infinitely weighty, expected utility theory breaks.

  6.  **Determining the "Headline Result":**
      *   Is the family defined by impossible demands? Possibly. The "Impossibility Theorem" style result is common in population ethics (Arrhenius). It is highly plausible that no theory satisfies Asymmetry + Distinctness + Risk Sensibility + Trade-offs simultaneously.

  7.  **Refining Confidence Levels:**
      *   High confidence on the tensions (logic dictates them).
      *   Lower confidence on whether "World-Destruction" is a genuine bug or a feature. Many SFE proponents bite the bullet. I should mark that as the point of least confidence.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the meta-ethical task. Set the stage.
      *   **The Desiderata List:** Numbered, precise, with Case, Motivation, Status, Confidence.
      *   **The Tensions:** Explicitly map the incompatibilities.
      *   **The Exclusionary Requirement:** Identify the bottleneck.
      *   **The Headline Result:** Discuss the impossibility possibility.
      *   **Least Confidence Point:** Honest reflection on the "World-Destruction/Existence" constraint.

  9.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction on D2:* Don't call it "Existence Preservation." Call it "Status Quo Stability." The issue isn't just existence, it's whether the theory mandates active reduction of population.
      *   *Correction on D4 (Distinctness):* Be careful. A theory can be distinct in *justification* but not *extension*. But for a taxonomy paper, extensional distinctness is usually required. I'll specify "Extensional Divergence in Paradigm Cases."
      *   *Refining the "Sadistic Conclusion":* In population ethics, the Sadistic Conclusion is: It is better to add lives with negative welfare than lives with positive welfare. SFE usually *avoids* the Repugnant Conclusion but *accepts* the Sadistic Conclusion (because adding negative welfare is the worst thing). Wait, actually, the Sadistic Conclusion is usually seen as a *reductio* for Total Utilitarianism. For SFE, adding negative lives is bad. The problem for SFE is often the "Very Sadistic Conclusion" or just consistency with the Asymmetry. I need to be precise here. Let's stick to "Population Consistency" broadly to avoid getting bogged down in specific theorem names unless necessary.
      *   *Confidence Check:* I need to explicitly state confidence levels (High/Medium/Low) for each claim as requested.

  10. **Final Review against User Prompt:**
      *   Did I brainstorm before committing? (Yes, reflected in the intro).
      *   Did I list desiderata with case/motivation/status? (Yes).
      *   Did I flag incompatible pairs? (Yes).
      *   Did I identify the most exclusionary requirement? (Yes).
      *   Did I address the "headline result" (impossibility)? (Yes).
      *   Did I indicate confidence levels throughout? (Yes).
      *   Did I single out the least sure point? (Yes).

  11. **Final Polish:** Ensure the tone is professional, philosophical, and empathetic to the SFE project while remaining critical. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to clearly distinguish between "Non-negotiable" (conditions for being a viable normative theory) and "Camp Preference" (conditions for being a *moderate* or *palatable* SFE theory). The prompt asks for adequacy conditions for the *family*, but some conditions might be internal to the family's survival. I will frame "Non-negotiable" as "Required for the theory to function as a practical normative guide" and "Camp Preference" as "Required to align with specific moderate intuitions."

  Let's refine the "World Destruction" point. If I mark it non-negotiable, I exclude Strict NU. If I mark it camp preference, I allow Strict NU but acknowledge it's controversial. Given the prompt asks for "adequacy," I should treat "avoiding reductios" as generally non-negotiable *unless* the reductio is the point. I will classify it as a "Stability Constraint" and mark it Non-negotiable for *moderate* SFE, but note the tension. Actually, better to mark it as Non-negotiable for *plausibility*, acknowledging that Strict NU fails it.

  Okay, let's write.
answer: |-
  This is a meta-ethical and structural task. Before we can evaluate whether Negative Utilitarianism (NU) or Suffering-Focused Consequentialism (SFC) succeeds, we must define what "success" looks like without begging the question against the view's core radicalism. If we define adequacy solely by alignment with common-sense morality, we exclude the family by fiat. If we define it solely by internal coherence, we allow absurdities.

  Below is the specification of adequacy conditions. I have filtered your initial list through the lens of formal population ethics and decision theory to ensure precision.

  ### I. Specification of Desiderata

  **D1: The Asymmetry Constraint**
  *   **Statement:** The theory must assign greater moral weight to the prevention/elimination of suffering than to the creation of happiness, such that there are cases where preventing suffering is obligatory even when creating happiness is merely permissible.
  *   **Motivating Case:** The "Benatar Intuition." It is wrong to bring a child into existence who will suffer terribly; it is not wrong to refrain from bringing a child into existence who would be happy. A symmetric theory (like Classical Utilitarianism) struggles to explain this without appealing to contingent empirical claims.
  *   **Status:** **Non-negotiable.** (This is the definitional core of the family. Without this, it is not suffering-focused ethics.)
  *   **Confidence:** High.

  **D2: The Stability Constraint (World-Destruction)**
  *   **Statement:** The theory must not entail a pro tanto or all-things-considered duty to annihilate existing sentient life solely on the grounds that future suffering is probable, provided existing lives contain net-positive welfare.
  *   **Motivating Case:** The "Painless Pill" or "Benevolent World-Exploder." If only suffering has negative value, a world with no beings has zero disvalue. If existing beings have any risk of future suffering, a strict aggregation might prefer non-existence. Most normative theories are considered refuted if they mandate extinction.
  *   **Status:** **Non-negotiable for Plausibility.** (Strict NU proponents may reject this, but for the theory to be a candidate for *public* morality, it must pass this bar. I treat this as a condition for adequacy as a *practical* normative theory.)
  *   **Confidence:** Medium-High. (See "Least Confidence" section below).

  **D3: The Non-Triviality (Threshold) Constraint**
  *   **Statement:** The theory must specify a principled mechanism for determining when the aggregation of positive welfare can outweigh the imposition of minor suffering, avoiding the conclusion that a single pinprick lexically outweighs any amount of happiness.
  *   **Motivating Case:** The "Pinprick Argument." If suffering is lexically prior, one cannot justify a vaccine (minor pain) for a lifetime of health (major gain) without ad hoc maneuvering. A theory that cannot justify routine medical care fails as a guide to action.
  *   **Status:** **Non-negotiable.** (A theory that cannot guide action in mundane cases is practically inert.)
  *   **Confidence:** High.

  **D4: The Distinctness Constraint (Anti-Camouflage)**
  *   **Statement:** The theory must yield extensionally different verdicts than Classical Utilitarianism (CU) or Critical-Level Utilitarianism (CLU) in non-edge cases, without relying solely on a shifted zero-point on the welfare scale.
  *   **Motivating Case:** "Camouflage Failure." If an SFE theory is mathematically isomorphic to CU where '0' is set at 'mild pain' rather than 'neutral,' it offers no new normative insight. The asymmetry must be structural, not merely terminological.
  *   **Status:** **Non-negotiable.** (Required for the taxonomy to be meaningful.)
  *   **Confidence:** High.

  **D5: The Risk-Sensibility Constraint**
  *   **Statement:** The theory must provide a decision rule for low-probability, high-magnitude suffering events that does not result in decision paralysis or fanaticism (e.g., sacrificing certain significant goods to prevent astronomically unlikely torture).
  *   **Motivating Case:** "Suffering Pascal's Mugging." If suffering has infinite or lexical disvalue, a $10^{-100}$ probability of universal torture dominates all certain positive outcomes. A theory that mandates bankrupting the economy to prevent a metaphysically possible demon is action-guiding only in a pathological sense.
  *   **Status:** **Non-negotiable.** (Required for coherence with standard decision theory.)
  *   **Confidence:** High.

  **D6: The Population Consistency Constraint**
  *   **Statement:** The theory must avoid the "Sadistic Conclusion" (that it is better to add lives with negative welfare than lives with positive welfare) while maintaining the Asymmetry Constraint.
  *   **Motivating Case:** Arrhenius's Impossibility Theorems. Many asymmetric views solve the Repugnant Conclusion (too many barely happy lives) but fall into the Sadistic Conclusion (adding miserable lives is sometimes ranked as 'less bad' than adding happy ones due to averaging or totalizing quirks). An adequate theory must navigate this minefield without contradiction.
  *   **Status:** **Camp Preference.** (This is technically extremely difficult. Some SFE proponents may accept the Sadistic Conclusion as the lesser evil compared to the Repugnant Conclusion. However, for a *fully* adequate theory, this should be avoided.)
  *   **Confidence:** Medium.

  ---

  ### II. Analysis of Tensions and Incompatibilities

  Having fixed the standards, we must confront the structural friction between them. There are two primary tension pairs that threaten the coherence of the family.

  **Tension Pair 1: The Asymmetry Constraint (D1) vs. The Risk-Sensibility Constraint (D5)**
  *   **The Conflict:** If suffering is lexically prior or infinitely weighty (to satisfy D1 robustly), Expected Utility Theory dictates that any non-zero probability of extreme suffering dominates finite certain goods. To satisfy D5 (avoid fanaticism), one must discount the value of preventing extreme suffering under uncertainty. But discounting lexical priority undermines the Asymmetry (D1) in stochastic environments.
  *   **Implication:** You can have a theory that is asymmetric in certainty, or sensible in uncertainty, but doing both requires a complex, potentially ad hoc hybrid decision rule (e.g., tail-risk discounting).
  *   **Confidence:** High. This is a known problem in axiology under uncertainty.

  **Tension Pair 2: The Distinctness Constraint (D4) vs. The Non-Triviality Constraint (D3)**
  *   **The Conflict:** To be distinct from Classical Utilitarianism (D4), the theory must treat suffering as *sui generis* bad, not just negative happiness. However, to allow ordinary trade-offs like vaccines (D3), the theory must allow positive happiness to "cancel out" negative suffering. The more easily they cancel, the more the theory looks like CU (violating D4). The harder they cancel, the more the theory forbids ordinary trade-offs (violating D3).
  *   **Implication:** This is the "Camouflage vs. Fanaticism" squeeze. Moderate SFE views often collapse into CU with a higher critical level. Strict SFE views fail the trade-off test.
  *   **Confidence:** High.

  ---

  ### III. The Most Exclusionary Requirement

  **The Risk-Sensibility Constraint (D5)** is the single most exclusionary requirement.

  *   **Reasoning:** Many suffering-focused theories can be tweaked to handle ordinary trade-offs (by introducing thresholds) or population issues (by adopting person-affecting views). However, handling *lexical* or *infinite* disvalue under *uncertainty* is mathematically devastating.
  *   **Exclusionary Power:** This requirement rules out Strict Negative Utilitarianism immediately (as it succumbs to fanaticism). It also rules out many Lexical Priority Views unless they adopt a non-standard decision theory (like bounded utility or probability discounting), which often introduces arbitrariness that violates the **Non-Triviality Constraint (D3)**.
  *   **Confidence:** High. The literature on "longtermism" and suffering risks has highlighted this as the primary technical failure point for strong SFE views.

  ---

  ### IV. The Headline Result: Is the Family Impossible?

  You asked whether the joint unsatisfiability of these desiderata is the headline result. **Yes, it is highly probable that this family is defined by demands no theory can meet at once.**

  This mirrors Gustaf Arrhenius's impossibility theorems for population ethics, but specific to the valence of suffering. If my analysis of the tensions is correct, we are facing a **Trilemma**:
  1.  Maintain strong **Asymmetry** (Suffering is lexically worse).
  2.  Maintain **Risk-Sensibility** (No fanaticism).
  3.  Maintain **Distinctness** (Not just CU with a shifted baseline).

  You can pick two, but not three.
  *   Pick 1 & 2: You must adopt probability discounting, which looks ad hoc and undermines **Non-Triviality**.
  *   Pick 1 & 3: You accept fanaticism (fail **Risk-Sensibility**).
  *   Pick 2 & 3: You effectively aggregate suffering and happiness on a common scale to calculate risk, which collapses into Classical Utilitarianism (fail **Distinctness**).

  If your paper demonstrates this trilemma formally, that is a significant contribution. It suggests that "Suffering-Focused Ethics" is not a stable equilibrium but a transitional phase between Classical Utilitarianism and a more radical, perhaps action-inert, nihilism or error theory.

  *   **Confidence:** Medium-High. (While Arrhenius-style proofs are robust, there is always space for a novel axiology to escape the premises. However, the structural pressure is undeniable.)

  ---

  ### V. Confidence and The Point of Least Certainty

  Throughout this specification, I have maintained high confidence in the logical tensions (D1 vs D5, D3 vs D4). However, there is one point where the ground is soft.

  **Point of Least Confidence: The Status of the Stability Constraint (D2)**
  *   **The Claim:** I marked "Avoiding World-Destruction" as **Non-negotiable for Plausibility**.
  *   **The Uncertainty:** I am least sure whether this is a genuine adequacy condition or merely a "consensus of a particular moment in the debate" (as you phrased it).
  *   **Reasoning:** Strict Negative Utilitarians (e.g., Inclusive NU proponents) argue that if the universe contains more suffering than happiness, extinction *is* the correct moral outcome, and our intuition that it is "wrong" is a bias toward existence (a "pro-creation bias"). If SFE is truly radical, perhaps it *should* endorse extinction in certain counterfactuals. By marking D2 as non-negotiable, I may be smuggling in a "life-affirming" prejudice that SFE is designed to challenge.
  *   **Implication for your paper:** If you treat D2 as non-negotiable, you pre-emptively refute Strict NU. If you treat it as a Camp Preference, you allow Strict NU to remain "adequate" but "radical."
  *   **Recommendation:** In your draft, explicitly flag D2 as the "Contested Adequacy Condition." Acknowledge that for the *moderate* family (which you seem to be targeting given your interest in trade-offs), it is non-negotiable. But for the *broad* family, it is the primary fault line.

  **Final Confidence Rating on the Whole Specification:**
  *   **Logical Coherence of Desiderata:** High.
  *   **Identification of Tensions:** High.
  *   **Normative Status of D2 (Stability):** Low/Medium. (This is where a referee is most likely to attack your framing).

  If you anchor your paper on the tension between **Distinctness** and **Risk-Sensibility**, you avoid the murkiness of the extinction debate and strike at the mathematical core of the view. That is your strongest path.
