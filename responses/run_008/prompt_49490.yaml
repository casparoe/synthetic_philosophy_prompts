answer: |-
  You have put your finger on a very specific and sophisticated nerve in the philosophy of action and decision theory. Your intuition is correct: standard Rational Choice Theory assumes that if $A = B$ in value, choosing either is rational, but it often glosses over *how* the selection happens without a reason.

  There is no single, universally agreed-upon label like "The Principle of Arbitrary Selection," but there are several established concepts that map onto different parts of the phenomenon you are describing. Here is a breakdown of the nearest concepts, how they differ from "hard choices," and where the boundaries of the idea lie.

  ### 1. The Core Concept: Rational Tie-Breaking (or Procedural Rationality)

  In decision theory and economics, what you are describing is often analyzed under **Rational Tie-Breaking**.

  *   **The Logic:** If Option A and Option B have equal expected utility, maximizing utility does not dictate *which* one to pick, only that you pick one of the set $\{A, B\}$. Therefore, any mechanism that selects from that set is consistent with rationality.
  *   **The Shift:** As you noted, the rationality shifts from the *object* of choice (the haystack) to the *procedure* of choice (the coin flip). This is sometimes called **Second-Order Rationality**. It is rational to adopt a heuristic (e.g., "always pick left") to avoid the infinite cost of deliberation.
  *   **Bounded Rationality:** Herbert Simon's concept of **Bounded Rationality** is relevant here. Since human cognitive resources are limited, it is irrational to deliberate indefinitely over indifferent options. Therefore, an arbitrary selection procedure is not just permissible; it is *required* for instrumental rationality. To deliberate longer than necessary is itself a cost.

  ### 2. The Metaphysical Concept: Voluntarism

  Your observation that "just pick" is a distinct rational act touches on a historical debate between **Intellectualism** and **Voluntarism**.

  *   **Intellectualism:** The will follows the intellect. If the intellect sees no difference, the will cannot move. (This is the view that makes Buridan's Ass starve).
  *   **Voluntarism:** The will is a distinct faculty from the intellect. When reasons run out, the **Will** can tip the scale.
  *   **Leibniz's Critique:** Gottfried Wilhelm Leibniz argued that Buridan's Ass is impossible in the real world because no two things are perfectly identical (the Principle of the Identity of Indiscernibles). However, he conceded that if they *were* identical, the ass would starve. For Leibniz, a rational agent requires a "sufficient reason."
  *   **The Modern View:** Most contemporary philosophers of action side with your intuition: the capacity to act without a determining reason is a feature of agency, not a bug. This is sometimes linked to **Libertarian Free Will** (in the metaphysical sense), where the agent is the "uncaused cause" of the action when prior causes (reasons) are in equilibrium.

  ### 3. Distinction: "Hard Choices" vs. "Indifference"

  You mentioned **Hard Choices**, specifically referencing the work of philosopher **Ruth Chang**. It is crucial to distinguish your lunch scenario from a Hard Choice, because the rationality structure is different.

  *   **Indifference (Your Lunch):** Option A and Option B are of **equal value**. You do not care which you get. The rational solution is **arbitrary selection**.
  *   **Hard Choices (Chang's View):** Option A and Option B are **on a par**. They are not equal, nor is one better. They are incomparable in value (e.g., a career in law vs. a career in art). You care deeply about the outcome.
      *   *The Difference:* In a hard choice, arbitrary selection is often viewed as *irrational* or unsatisfying because the stakes involve your identity.
      *   *The Solution:* Chang argues that in hard choices, we do not *find* reasons; we **create** them through the act of choosing. By committing to one path, you make it the right one.
      *   *Summary:* In indifference, the choice is trivial, so arbitrariness is rational. In hard choices, the choice is significant, so **commitment** (not arbitrariness) is the rational move.

  ### 4. Edges and Nuances

  You asked about the boundaries of this idea: does it have to be random? Does importance matter?

  **A. Randomness vs. Unreasoned Selection**
  The selection procedure does not need to be random (like a coin flip). It only needs to be **decisive**.
  *   **Lexicographic Heuristics:** "Always pick the left one." This is deterministic, not random, but it is still "unreasoned" regarding the options themselves. In computer science and AI, this is a standard tie-breaking rule.
  *   **Rationality:** A deterministic rule is often *more* rational than a coin flip because it costs less cognitive energy (no need to find a coin). The rationality lies in the **adoption of the rule**, not the randomness of the outcome.

  **B. Trivial vs. Significant Stakes**
  *   **Low Stakes (Lunch):** As you noted, arbitrariness is fully rational. The cost of deliberation exceeds the value difference (which is zero).
  *   **High Stakes (Life/Death):** If two medical treatments are truly statistically identical, is flipping a coin rational?
      *   *Yes:* If there is genuinely no evidence favoring one, delaying treatment to "find a reason" is harmful.
      *   *No:* In high-stakes scenarios, humans often feel a psychological need to *manufacture* a reason (e.g., "This doctor seems nicer") even if it is irrelevant. This suggests that while arbitrariness is *logically* rational, it may be *psychologically* difficult when stakes are high. This is where Existentialism enters: Sartre argued we are "condemned to be free" and must choose without grounds, bearing the anxiety of that responsibility.

  **C. The "Rationality of Caprice"**
  There is a niche discussion in aesthetics and ethics about whether doing something *without* a reason can be a way of asserting autonomy. If I always choose the left haystack because "reason says left," am I free? Or am I a slave to the rule? Some philosophers argue that **caprice** (whimsical choice) is the ultimate expression of freedom when reasons are silent.

  ### 5. Summary of Terminology

  If you want to research this further, these are the terms to look for:

  1.  **Rational Tie-Breaking:** The decision-theory term for resolving indifference.
  2.  **Bounded Rationality:** The economic argument that arbitrary heuristics are rational due to cognitive costs.
  3.  **Voluntarism:** The metaphysical view that the Will can act where Reason cannot.
  4.  **Incomparability vs. Indifference:** The distinction (Ruth Chang) between "equal value" and "no common measure."
  5.  **Constitutive Choice:** The idea that the choice itself creates the reason (more applicable to Hard Choices than lunch).

  ### Conclusion

  You are describing **Procedural Rationality in Conditions of Indifference**.

  The philosophical consensus generally aligns with your intuition: when reasons run out, the rational act is to **terminate deliberation** via an arbitrary procedure. To continue deliberating is irrational (a waste of resources). To starve is irrational (failure to act on available utility).

  The "paradox" of Buridan's Ass survives only if one assumes that **Reason** must dictate the specific content of every action. Once you accept that **Will** (or Procedure) is a valid faculty for resolving equilibrium, the ass eats the hay. The rationality lies not in the hay chosen, but in the **resolution of the deadlock**.

  **Recommendation for further reading:**
  *   **Ruth Chang,** *"Hard Choices"* (for the contrast).
  *   **Herbert Simon,** *"A Behavioral Model of Rational Choice"* (for bounded rationality/heuristics).
  *   **Jean Buridan,** *Quaestiones* (to see what he actually said, which is more nuanced than the paradox implies).
  *   **L.A. Paul,** *"Transformative Choice"* (for how high-stakes choices differ from lunch).
