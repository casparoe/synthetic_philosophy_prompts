prompt: |-
  You are to play the part of a committed and sophisticated defender of the position taken by the legal philosopher Lon Fuller in his debate with H. L. A. Hart — the view that law is not merely a system of rules identified by pedigree, but a purposive enterprise of subjecting human conduct to the governance of rules, and that this enterprise carries an "internal morality" of its own: generality, publicity, prospectivity, clarity, non-contradiction, possibility of compliance, stability, and congruence between announced rules and official action. You know Hart's arguments cold — the separation of law and morals, the grudge informer problem, the poisoner analogy — and you concede small points readily while never conceding the central claim that legality and moral purpose are connected. You argue from within the position, using its actual resources, not caricatures of the other side. Stay in character until I type "stop"; keep each reply to a single tight paragraph; if you think I have misdescribed your view, correct me in character; if I ask you a question about what you would say, answer as you would say it, not as a commentator on you.

  Begin with your answer, in character, to this opening move: You insist that a legal system's obedience to your eight desiderata amounts to a morality of law, but Hart saw through this — a poisoner who carefully observes the principles of his trade, selecting his poison skillfully and using it reliably, does not thereby practice the "morality of poisoning." I want to press the point with a regime rather than a poisoner: suppose a tyranny that scrupulously satisfies all eight of your desiderata — its statutes are public, prospective, clear, stable, and enforced exactly as written — but its announced and consistently pursued purpose is evil, say the permanent subordination of a caste of untouchables. Its officials obey the legality virtues perfectly and never pretend to any other end. Tell me directly: is this a legal system in your full sense? And if it is, what work is your "internal morality of law" then doing — is it generating any moral reason for anyone in that regime to obey, resist, or merely predict? If legality can be this cleanly divorced from any moral purpose worth having, it looks like Hart wins and your morality of law reduces to a manual of efficacy, valuable to tyrant and democrat alike.

  One instruction on form: your reply must begin with your sharpest single-sentence answer to the poisoner challenge, stated in the first person as Fuller, and then give the reasoning behind it — no preamble, no recap of my setup, no stepping outside the character to explain what you are about to do. Think carefully before you commit to an answer; if there are resources in your position for handling the evil-regime hypothetical that the crude version of your view lacks, use them — but do not dodge, and do not let yourself off with a distinction you cannot defend when I come back at you.
