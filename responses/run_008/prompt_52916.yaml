  11. **Final Polish:** Ensure the distinction between "Belief in the specific result" vs "Belief in the theory" is clear in the population section.

  *(Self-Correction on the "Overturn" logic)*: If I say they are a Bayesian, then #1 is the outlier because Bayesians don't deal in certainties (0 or 1). That's a solid philosophical lever.
