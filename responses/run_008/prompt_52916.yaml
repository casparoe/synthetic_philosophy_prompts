  1.  **Analyze the User and Request:**
      *   **User Background:** Backend developer, no formal stats/philosophy training, self-taught via blogs/courses.
      *   **Problem:** Trying to synthesize intuition about the replication crisis into a coherent framework. Has 7 specific "gut calls" about study validity.
      *   **Core Question:** Is there a single principle unifying these calls? Am I Bayesian, Frequentist, or Hybrid?
      *   **Specific Constraints:**
          *   State the actual hybrid rule (don't just say "both matter").
          *   Identify where the principle forces dropping/overturning one of the calls (and which one).
          *   Address the "different population" replication case.
          *   **Crucial:** Express confidence levels for claims.
          *   **Crucial:** Single out the point of least certainty.

  2.  **Deconstruct the 7 Gut Calls:**
      1.  *Huge multi-lab preregistered replication null:* Reject original. (High power, high integrity).
      2.  *Small n=20 replication null:* Ignore replication. (Low power).
      3.  *3 replications, same lab:* Skeptical. (Lab bias/hidden degrees of freedom).
      4.  *p=0.03, 5 measures (p-hacking):* Reject. (Garden of Forking Paths).
      5.  *p=0.06, preregistered + solid theory:* Believe more than #4. (Integrity + Prior plausibility).
      6.  *Same stats, different field track records:* Believe the reliable field. (Base rates/Priors).
      7.  *Same as #6 + plausible mechanism:* Believe more. (Theory updates Prior).

      *Observation:* The user is correctly identifying that p-values alone are insufficient. They are implicitly weighing *evidential value* based on study design (Frequentist error control) and *prior plausibility* (Bayesian).

  3.  **Identify the Underlying Framework:**
      *   Is it pure Frequentist? No, because Frequentism technically forbids using "field track record" or "mechanism" to interpret a specific p-value (in strict hypothesis testing).
      *   Is it pure Bayesian? Yes, effectively. Bayesian inference updates a *Prior* belief with *Likelihood* (data) to get a *Posterior* belief.
      *   *The Hybrid:* It's often called "Neo-Bayesian" or "Pragmatic Bayesianism," but specifically in the context of the replication crisis, it aligns closely with **Ioannidis's "Why Most Published Research Findings Are False"** framework, which is mathematically Bayesian but uses Frequentist tools (power, alpha) as inputs.
      *   *The Single Principle:* **Posterior Probability depends on Prior Odds $\times$ Likelihood Ratio.**
      *   *Translation for the user:* "Belief = (Plausibility before the study) $\times$ (How much the study design guarantees the data isn't noise)."

  4.  **Drafting the Principle:**
      *   Need to formalize this without heavy math.
      *   Concept: **Credibility Weighting.**
      *   Formula (Conceptual): $Credibility \approx Prior \times Severity$.
      *   *Prior:* Theory, field base rate, mechanism (#6, #7).
      *   *Severity:* Power, preregistration, p-hacking control (#1, #2, #3, #4, #5).
      *   This unifies everything.

  5.  **Addressing the "Overturn" Requirement:**
      *   The prompt asks: "Where does whatever principle you land on force me to drop one of your calls, and which one would you overturn first?"
      *   I need to find a tension in their intuition.
      *   *Tension:* Call #1 (Ego Depletion). The user wrote it off *entirely*.
      *   *Principle Check:* A single null replication, even a big one, reduces the Posterior Probability, but does it make it zero? Strict Bayesianism says never update to 0 or 1.
      *   *Alternative Tension:* Call #5 (p=0.06 believed more than p=0.03). This is actually consistent with the principle (Severity > arbitrary threshold).
      *   *Better Tension:* Call #3 (3 replications, same lab). User says "I don't buy it."
      *   *Principle Check:* If the Prior is low and Severity is low (due to lab bias), this holds.
      *   *Best Tension:* Call #7 (Mechanism updates belief with *zero new data*).
      *   *Principle Check:* This is pure Prior updating. It's valid Bayesianism, but scientifically risky. However, the prompt asks where the *principle* forces me to drop a call.
      *   *Actually, the strongest candidate for overturning is #1.* "Wrote ego depletion off entirely." A strict probabilistic framework never assigns probability 0. Even with a big null replication, if the Prior was high enough, the Posterior is just *low*, not *zero*. There might be boundary conditions (moderators).
      *   *Wait, let's look at #5 vs #4.* User believes #5 more than #4. This is correct under the principle.
      *   *Let's look at #2.* Ignoring an underpowered replication. This is correct (Low Severity).
      *   *Let's look at #1 again.* "Wrote ego depletion off entirely." This is the most dogmatic. The principle suggests downgrading confidence, not binning it.
      *   *Decision:* I will challenge #1. "Entirely" is too strong.

  6.  **Addressing the "Different Population" Case:**
      *   Original finding fails big replication, but replication used different population.
      *   *Principle Application:* This introduces a **Moderator Variable**.
      *   It doesn't restore belief in the *universal* claim. It shifts belief to a *conditional* claim ("Effect exists in Population A, not Population B").
      *   Credibility of the *original specific claim* remains low. Credibility of a *nuanced theory* increases.
      *   Advice: Don't believe the original finding "again." Believe a *modified* version.

  7.  **Addressing Confidence Levels:**
      *   I need to explicitly state confidence (e.g., "High confidence," "Moderate," "Low").
      *   I need to identify the point of least certainty.
      *   *Least Certain Point:* Quantifying the "Prior." How do we objectively weigh a "plausible mechanism" (#7) vs. "field track record" (#6)? This is subjective.

  8.  **Structuring the Response:**
      *   **Introduction:** Validate the user's intuition (it's good).
      *   **The Single Principle:** Define "Severity-Weighted Bayesianism" (or similar term). Explain Prior $\times$ Likelihood.
      *   **Mapping the 7 Calls:** Briefly show how the principle explains each.
