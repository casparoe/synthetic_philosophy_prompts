  # JOINT STATEMENT ON HISTORICAL METHOD AND MORAL JUDGMENT
  **Signed:** [The Committed Presentist] & [The Dyed-in-the-Wool Contextualist]
  **Date:** October 26, 2023
  **Subject:** Terms of Engagement Following Adversarial Collaboration

  After a period of structured debate and review of shared primary materials, we submit the following findings. We remain in disagreement on the ultimate purpose of historical writing, but we have successfully mapped the boundary between our methodological consensus and our philosophical divergence.

  ### I. Claims Accepted by Both Parties
  *We agree that the following propositions are necessary conditions for doing history, regardless of one's stance on moral judgment.*

  1.  **Epistemic Humility:** All historical claims are probabilistic, dependent on the survival of sources, and subject to revision based on new evidence. Neither moral certainty nor contextual certainty grants immunity from evidentiary standards.
  2.  **Explanation ≠ Justification:** To explain *why* an agent performed an action (causes, motivations, structural pressures) is not to justify *that* the action was right. Both parties reject the notion that contextual explanation amounts to moral exoneration.
  3.  **The Reality of Difference:** The past is a foreign country. Social structures, metaphysical beliefs, and linguistic categories in previous eras differ materially from those of the 21st century. Ignoring these differences produces bad history.
  4.  **The Inevitability of Selection:** Historians cannot write about everything. The choice of subject, source, and narrative frame is inherently selective. Neutrality in selection is impossible; transparency about selection is required.
  5.  **The Danger of Caricature:** Both "monster-ing" (reducing a figure to their worst act) and "saint-ing" (excusing all acts due to context) distort the historical record. Complex agents must be rendered as complex agents.
  6.  **Utility of Sources:** Sources can establish what an agent *did*, what they *said* they were doing, and how their contemporaries *reacted*. Sources cannot directly establish the agent's internal moral worth without interpretive mediation.

  ### II. Table of Residual Disagreements
  *We disagree on the following points. Each formulation is phrased to be acceptable to the signer as an accurate description of their position.*

  | Topic | The Committed Presentist (CP) Position | The Dyed-in-the-Wool Contextualist (DC) Position |
  | :--- | :--- | :--- |
  | **Primary Function** | History serves the living. Its value lies partly in its capacity to refine our current moral vocabulary and warn against present dangers. | History serves the dead (and the truth). Its value lies in reconstructing the past as it was experienced, not as we wish it to be. |
  | **Moral Vocabulary** | Using modern terms (e.g., "genocide," "systemic racism") for past events is necessary to convey the *reality* of the harm to a modern audience. | Using modern terms for past events is anachronistic. It imposes alien categories that obscure the agent's own motivation and logic. |
  | **Risk Assessment** | The greater risk is **moral complacency**. Refusing to judge allows harmful ideologies to hide behind the shield of "context." | The greater risk is **epistemic distortion**. Judging prevents us from understanding how intelligent people could believe false or terrible things. |
  | **The "Lesson"** | We study the past to learn how *not* to be. Condemnation is a pedagogical tool. | We study the past to learn how people *were*. Understanding is a cognitive tool, not necessarily a moral one. |

  ### III. The Cruxes
  *These are the foundational disagreements that generate the table above. We have identified two specific historical cases to test these cruxes. We record our predictions here prior to joint analysis.*

  #### Crux 1: The Separability of Understanding and Evaluating
  **The Question:** Is moral evaluation a separate step that follows historical understanding, or is moral evaluation constitutive of historical understanding?
  *   **CP Stance:** You cannot fully understand a slaveholder without understanding the moral horror of slavery. To describe it neutrally is to misunderstand it.
  *   **DC Stance:** You cannot evaluate the slaveholder until you have reconstructed the normative world that made slavery intelligible to them. Evaluation interrupts understanding.

  **Test Case:** **John Stuart Mill (1806–1873)**
  *Why this case:* Mill was a radical feminist and anti-slavery advocate (ahead of his time) but also a staunch defender of British Imperialism and the "civilizing mission" (standard for his time, abhorrent to ours). He embodies the "reformer who was good then, bad now" archetype.

  | Side | Prediction of What Examination Will Show |
  | :--- | :--- |
  | **Committed Presentist** | Examining Mill's defense of Empire will reveal that his liberalism was fundamentally compromised by colonial racism. Understanding him requires marking this contradiction as a **moral failure**, not just a contextual blind spot. The "good" (feminism) does not cancel the "bad" (imperialism); both must be weighed on a single scale. |
  | **Dyed-in-the-Wool Contextualist** | Examining Mill's defense of Empire will reveal that his liberalism was **internally coherent** within 19th-century utilitarian thought. To call it a "failure" is to judge him by a scale (anti-colonialism) that did not exist for him. Understanding him requires suspending the judgment of "failure" to see how "liberty" and "Empire" were not yet mutually exclusive categories. |

  #### Crux 2: The Existence of Trans-Historical Standards
  **The Question:** Are there moral truths that apply across time, or are moral truths internal to specific historical epochs?
  *   **CP Stance:** Certain harms (torture, enslavement, religious persecution) are objectively wrong regardless of the era's consensus. We share a humanity with the past that transcends context.
  *   **DC Stance:** "Wrongness" is a function of a normative framework. To judge a 12th-century actor by 21st-century human rights is a category error, like judging a medieval knight for not flying a drone.

  **Test Case:** **Saint Bernard of Clairvaux (1090–1153)**
  *Why this case:* Bernard preached the Second Crusade, calling for the killing of "enemies of Christ." He was revered as a saint in his time. By modern standards, inciting religious violence is a moral crime.

  | Side | Prediction of What Examination Will Show |
  | :--- | :--- |
  | **Committed Presentist** | Examining Bernard's letters will show that he incited murder. While he believed he was saving souls, the **material consequence** was death and suffering. We share a standard of "sanctity of life" with Bernard's victims that overrides his theological framework. He is culpable. |
  | **Dyed-in-the-Wool Contextualist** | Examining Bernard's letters will show that he operated within a **soteriological framework** where earthly death was secondary to eternal salvation. There is no "shared standard" here. To judge him by "sanctity of life" is to impose a secular humanist standard on a theocratic mind. He is intelligible, but not judgeable by us. |

  ### IV. Identification of Verbal Disputes
  *We acknowledge that a portion of our conflict is semantic. Clarifying these terms does not resolve the substantive disagreement, but it prevents talking past one another.*

  **1. The Definition of "Judgment" (or "Judging")**
  *   **The Dispute:** When the **CP** says "We must judge the past," they mean *We must assess the moral quality of actions to inform our current ethical landscape.* When the **DC** hears "judge," they hear *We must pronounce a verdict of guilt or innocence as if in a court of law, ignoring the defendant's own plea.*
  *   **Resolution:** We agree to distinguish between **Retrospective Assessment** (CP's goal: evaluating impact and moral quality from the present) and **Contemporary Verdict** (DC's fear: punishing the past as if it were the present). The CP accepts they are not holding a trial; the DC accepts that assessment is inevitable.

  **2. The Definition of "Anachronism"**
  *   **The Dispute:** For the **DC**, "anachronism" is a methodological sin (placing a thing in the wrong time). For the **CP**, "anachronism" is sometimes a methodological necessity (using modern concepts to analyze past data, e.g., "PTSD" in WWI soldiers).
  *   **Resolution:** We agree that **Conceptual Anachronism** (using past actors' concepts) is distinct from **Analytical Anachronism** (using modern concepts to describe past actors). The DC rejects the latter; the CP argues the latter is unavoidable for relevance.

  **3. The Definition of "Context"**
  *   **The Dispute:** The **DC** treats context as a **boundary** (actions must be contained within their time). The **CP** treats context as a **background** (actions happen in a time, but their moral ripples extend forward).
  *   **Resolution:** No resolution. This is a substantive metaphysical disagreement about the nature of time and morality, not merely a verbal one.

  ***

  **Signatories:**

  *[Signature of Committed Presentist]*
  *"We judge because we must live now."*

  *[Signature of Dyed-in-the-Wool Contextualist]*
  *"We understand because they lived then."*
