      *   **The Strain (The Critical Pivot):** This is the most important part. Sartre says freedom is inescapable. Ishiguro suggests freedom can be engineered away. Hailsham isn't just a school; it's a psychological cage. The "possibility of revolt" requires an *imagined* alternative. If you can't imagine it, are you in bad faith, or are you unfree? This complicates Sartre by introducing the power of structural conditioning.
