      *   *Ishiguro's World:* The clones are biologically engineered to donate. Society treats them as sub-human. They are raised in Hailsham to accept this fate.
      *   *The Conflict:* Sartre argues existence precedes essence; we are condemned to be free. Even a prisoner is free to interpret their imprisonment or attempt escape. Ishiguro presents characters who seem *ontologically* restricted, not just physically. They don't *want* to escape.
      *   *Synthesis:* The novel illustrates bad faith vividly but also challenges the *ease* of Sartrean liberation. It suggests socialization can be so total that the "anguish" of freedom is suppressed before it can be felt.

