          *   **Verdict:** Conflation/Error.

      *   *Claim 2: Moore sharpened this with the Open Question Argument (OQA), proving ethical naturalism false.*
          *   **Fact Check:** Moore did use OQA in *Principia Ethica* (1903). He argued "good" is indefinable (non-natural property). He called the attempt to define good via natural properties the "naturalistic fallacy."
          *   **Nuance:** OQA is not widely considered a "proof" anymore. It begs the question against naturalists. Many contemporary meta-ethicists are naturalists (e.g., Railton, Boyd).
          *   **Verdict:** Oversimplification/Outdated.

      *   *Claim 3: Therefore, morality is a matter of feeling rather than fact.*
          *   **Fact Check:** This is a non-sequitur. Moore was a *non-naturalist realist*, not an emotivist. He thought "good" was a real property, just not a natural one. Hume leaned towards sentiment, but Moore definitely didn't say "it's just feelings."
