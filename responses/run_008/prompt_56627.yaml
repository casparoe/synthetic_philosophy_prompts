          4.  The Consequentialist Thesis (Radical).
      *   **Analysis of Each:** Plausibility, Control Principle, Support for Classmate.
      *   **The Ambiguity Flag:** Intent vs. Recklessness.
      *   **The Conflation:** Where classmates mix these up.
      *   **The Bridge:** How to reconcile Luck + Differential Punishment (Harm as a distinct legal wrong, not just moral luck).
      *   **Conclusion:** Advice for seminar.

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The prompt says "Same intentions... same culpable disregard." So they are reckless. The proverb mentions "good intentions." The classmate is using the proverb ironically or metaphorically. I must point out that the proverb literally contradicts her case (since the drivers didn't have good intentions). She is using it to mean "Intentions don't save you."
      *   *Control Principle:* Make sure to reference Nagel/Williams implicitly or explicitly.
      *   *Legal Theory:* Mention Model Penal Code (MPC) or common law distinctions (Attempt vs. Completes).
      *   *Bridge:* The most robust legal theory justification for punishing the killer more is not moral luck, but **harm as a distinct wrong**. Killing is a different *act* than endangering, even if the *mental state* is the same. The proverb supports "Look at the act, not the mind."

