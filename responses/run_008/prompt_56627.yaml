      *   **Counter-Argument:** Another classmate (philosophy major) argues this collapses the distinction between murder/attempt and ignores the problem of resultant luck (control principle).
      *   **Task:** Deconstruct the proverb into distinct, precise claims (from trivial to radical). Evaluate each for plausibility, consistency with the control principle, and support for the classmate's specific argument (justifying differential punishment based on outcome). Identify ambiguities (intent vs. foresight vs. negligence). Find a reading that might bridge the gap between acknowledging luck and justifying differential treatment.
      *   **Tone:** Academic, precise, analytical, suitable for a 2L seminar discussion. Not too basic, but clear.

  2.  **Deconstruct the Proverb ("The road to hell is paved with good intentions"):**
