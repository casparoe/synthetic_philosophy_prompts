      *   *Problem:* If intentions are inert, then the lucky driver (same intent/risk) should be punished the same *unless* the harm itself adds culpability.
      *   *Crucial Distinction:* Does harm add *culpability* or just *punishment severity*?

  5.  **Addressing the "Control Principle" vs. "Legal Doctrine":**
      *   Control Principle (Nagel/Williams): Luck shouldn't matter.
      *   Legal Doctrine: Harm matters (Homicide vs. Attempt).
      *   Can they reconcile? Yes, via **Expressivism** or **Risk vs. Harm** distinction.
      *   *Bridge Reading:* The "Fair Warning/Legality" reading or the "Harm as Aggravator" reading.

