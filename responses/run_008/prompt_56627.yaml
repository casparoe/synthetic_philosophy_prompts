      *   *Classmate's Usage:* She's twisting it. She's using it to say "Intentions don't matter, only results do." This is actually a misreading of the proverb's traditional sense, but I need to analyze the *claims* that could underlie her usage.
      *   *Key Tension:* The proverb usually warns *against* relying on intentions. The classmate uses it to argue *for* relying on consequences.

  3.  **Drafting the Readings (Ordered List):**

      *   *Reading 1: The Trivial/Minimal Claim.* Good intentions are necessary but not sufficient. (You can't *just* have good intentions).
          *   *Plausibility:* High.
          *   *Control Principle:* Consistent.
          *   *Supports Classmate?* No. It doesn't justify punishing the unlucky driver *more* than the lucky one, just that neither is off the hook entirely.

      *   *Reading 2: The Epistemic Claim.* Intentions are opaque; outcomes are evidence. We judge by results because we can't see inside the mind.
          *   *Plausibility:* Moderate (pragmatic).
          *   *Control Principle:* Violates it in theory, but pragmatic workaround.
          *   *Supports Classmate?* Weakly. It justifies punishment based on harm, but implies the lucky driver *should* be punished similarly if we knew their mind.

      *   *Reading 3: The Risk/Foreseeability Claim (Negligence focus).* When you act recklessly, you forfeit the shield of "I didn't mean it." You own the risk.
