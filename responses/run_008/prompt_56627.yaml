      *   Actually, a better bridge is the **"Agency Completion"** view. An agent's action isn't "complete" until the causal chain resolves. (This is controversial but fits the classmate's intuition).
      *   *Better Bridge:* **The "Normative Expectation" Reading.** The law punishes the violation of the norm "Do not kill." The lucky driver violated "Do not endanger." These are different norms. The proverb supports the idea that your internal state doesn't change the norm violated.

