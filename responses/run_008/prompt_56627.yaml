          *   *Supports Classmate?* Yes, but... it usually supports *equal* punishment for attempt vs. completion if the risk was identical. However, it can support *aggravation* based on harm if harm is an element of the offense.

      *   *Reading 4: The Consequentialist/Radical Claim.* Moral worth is determined solely by consequences. Intentions are irrelevant.
