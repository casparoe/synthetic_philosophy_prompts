  *(Self-Correction on the Bridge)*: The prompt asks for a reading held by someone who accepts luck pervades morality *and* insists differential treatment is justified. This is the **"Hybrid/Expressive"** view. We acknowledge the luck, but we punish the *history* of the interaction, which includes the victim's death. The death changes the *social meaning* of the act.

  Let's organize the readings clearly.
  1. Insufficiency (Good intent $\neq$ Justification).
