  2.  **Deconstruct the Philosophical Terrain:**
      *   *Commensurability:* Can different harms be measured on the same scale? (Friend says no, User says refusing is also a scale).
      *   *Uniqueness:* Does calling something "unique" protect it or isolate it? (User's point: isolation is a form of ranking).
      *   *Moral Attention:* Is empathy finite? Does comparing dilute focus? (Friend's worry: relativization).
      *   *Subsumption:* Does explaining mechanisms erase specific meaning? (The "Explanatory vs. Evaluative" distinction).
      *   *Metric Transparency:* Is the yardstick visible and justified?

  3.  **Drafting the Decision Procedure (The "Atrocity Comparison Review Protocol" - ACRP):**
      *   *Goal:* Move from abstract philosophy to 20-minute committee workflow.
      *   *Structure:* Gatekeeping questions -> Substantive questions -> Judgment calls.
      *   *Step 1: Purpose & Pedagogy.* Why are we comparing? (Explanatory vs. Evaluative).
      *   *Step 2: Metric Transparency.* What is the yardstick? Is it explicit?
      *   *Step 3: Commensurability Check.* Are the units compatible? (Apples to Apples vs. Apples to Oranges).
      *   *Step 4: The "Uniqueness" Test.* How does the material handle claims of singularity? (Addressing the user's specific point about "beyond comparison").
      *   *Step 5: Dilution vs. Clarification.* Does the comparison obscure specific mechanisms?
