      *Refining for the "Honesty Requirement":* I need to make sure the criteria are rigorous enough that the death toll chart *could* fail if it's done poorly, but open enough that it *can* pass if it meets the pedagogical criteria. The user wants it to pass because quantification forces discipline. The procedure needs to value *clarity of metric* over *avoidance of metrics*.

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Colonial Famine vs. Holocaust (Imperial Genocide Thesis).*
