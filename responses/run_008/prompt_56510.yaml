          *   Condition for Passing: Must explicitly state what the metric *doesn't* measure.
          *   *Self-Correction:* If I make the procedure too strict on "qualitative harm," this fails. If I make it too loose, it violates the friend's valid concern. I need to balance: Quantification is allowed *if* framed as *one* dimension, not *the* severity ranking.
          *   *Honesty Check:* I must admit if the procedure makes this hard to pass.

      *   *Case 3: "Beyond Comparison" Essay.*
