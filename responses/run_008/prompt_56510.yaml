      *   *Strategy:* I will design the procedure to allow quantitative metrics *provided* they are not presented as a "Severity Index." If the chart says "Ranking by Severity," it fails. If it says "Estimated Mortality Range," it passes. This honors the user's desire for discipline without violating the philosophical concern about reductionism.

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the stakes and the philosophical tension.
      *   **The Protocol:** The "Comparative Atrocity Review Protocol" (CARP). 5 Steps. Clear Pass/Fail/Hand-off markers.
      *   **The Hand-offs:** Explicitly list where philosophy ends and judgment begins.
      *   **The Test Runs:** Apply CARP to the three cases.
      *   **The Honesty Section:** Critique the procedure itself. Where does it break? (e.g., subtle bias, emotional resonance vs. logical rigor).

  7.  **Final Review against Constraints:**
