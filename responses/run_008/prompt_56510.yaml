          *   Run the procedure on three specific cases (Colonial/Holocaust exhibit, Death Toll bar chart, "Beyond Comparison" essay).
          *   **Honesty Requirement:** If the procedure kills the death-toll sidebar (which the user wants to pass), admit it. Don't rig the system. Acknowledge limitations/misfires.
