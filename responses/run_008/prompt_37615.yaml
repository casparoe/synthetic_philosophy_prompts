          *   Complacent: Head off after Layer 1. Bias isn't a disclaimer; it's a method.
          *   Romantic: Head off after Layer 2. Loss isn't always a puzzle to solve; some gaps are permanent structures.
          *   Despairing: Head off after Layer 3. Silence is evidence of power dynamics.
          *   Missing: The "Malice" fallacy. Bias is often bureaucratic habit, not villainy.
      *   *Closing:* Exercise.

      *Refining for Word Count:* I need to be extremely concise.

      *Drafting:*
      Your proposed ordering is correct. It scaffolds from the obvious (nothing exists) to the structural (what exists distorts). Layer 1 establishes limits; Layer 2 introduces fragility; Layer 3 reveals that survival itself encodes bias. This progression prevents overwhelm.

      **The Example:** A county **Probate Inventory**.
      *   *Must Have:* Specific names and monetary values for enslaved individuals or dependents.
      *   *Must Lack:* Kinship terms (mother, child), surnames for the enslaved, or any indication of agency.
      *   *Why:* The enslaved person is legible as property (Layer 3) but silent as a human. They weren't unrecorded (Layer 1) nor destroyed (Layer 2); they were recorded *as* silence.

      **Misconceptions & Timing:**
      1.  **Complacent ("We know archives are biased"):** Address immediately after Layer 1. Clarify that bias isn't a disclaimer to acknowledge, but a methodology to apply. It changes *how* they read, not just *what* they trust.
      2.  **Romantic ("Hidden history waiting to be found"):** Address after Layer 2. When discussing destruction, emphasize that some silences are permanent structural features, not mysteries solvable by enough digging.
      3.  **Despairing ("We can know nothing"):** Address after Layer 3. Show that the *shape* of the silence reveals power structures. The inventory's valuation *is* data about the owner's economy, even if it hides the enslaved person's life.
      4.  **Missing Danger:** The **"Malice Fallacy."** Amateurs often seek villainous intent. Emphasize that archival silence is usually bureaucratic habit, not conspiracy. This belongs in Layer 3.

      **Closing Check:**
      Distribute a copy of a census page or estate record. Ask: **"What question does this document's structure make impossible to ask?"**
      *   *Success:* They identify structural limits (e.g., "I cannot ask about this woman's labor because the column only records age").
      *   *Failure:* They identify missing people (e.g., "The neighbors aren't here") or express guilt.
      This tests whether they see the record as a machine that produces specific silences, rather than just a bucket with holes.

