      *   **User's Stance:** Believes the current rule is unfair (effort invested vs. random loss) and inefficient (waitlist exists anyway). Feels frustrated by the lack of logical counter-argument.
      *   **Brother-in-Law's Advice:** Reformers are bad judges of customs; if the reason were obvious, it wouldn't be a custom. Go slow.
      *   **User's Questions:**
          1.  Is there a principled way to decide when to declare a rule "reasonless" vs. respecting 50 years of survival?
          2.  Does resistance carry information, or is it just loss aversion/inertia?
          3.  What concrete steps can be taken (trials, questions, observations) to settle the issue?
          4.  How to self-diagnose: Am I clear-eyed or a bull in a china shop?

  2.  **Deconstruct the Core Conflict:**
      *   *Efficiency/Fairness (User's view)* vs. *Stability/Social Cohesion (Old Guard's view).*
      *   *Explicit Logic* vs. *Tacit Knowledge/Chesterton's Fence.*
      *   *Individual Merit* vs. *Community Equality.*

  3.  **Address Question 1: Principled Framework (Chesterton's Fence & Beyond):**
      *   Acknowledge Chesterton's Fence (don't remove a fence until you know why it was put up). The brother-in-law is basically quoting this.
      *   However, Chesterton's Fence isn't a veto; it's a research assignment.
      *   The "50 years of survival" is evidence of *stability*, not necessarily *optimality*. It proves the community didn't collapse, not that the rule is good.
      *   *Principle:* The burden of proof shifts. Initially, the reformer must find the reason. If the reason remains hidden after diligent search, the burden shifts to the defenders to articulate the *function* the rule serves now, even if it's not the original reason.

  4.  **Address Question 2: Resistance as Information:**
      *   Resistance is *always* information, but it's not always *wisdom*.
      *   Types of resistance:
          *   *Functional:* "This prevents X bad outcome." (Wisdom)
          *   *Social:* "This keeps the peace between Group A and Group B." (Wisdom)
          *   *Psychological:* "I hate change/loss aversion." (Inertia)
          *   *Power:* "I benefit from the ambiguity." (Self-interest)
      *   In this specific case (lottery vs. tenure), the "old guard" might value *equality of opportunity* over *reward for effort*. A lottery prevents "garden barons" from monopolizing the best spots forever. It forces mixing. It prevents cliques.
      *   *Key Insight:* The rule might not be about gardening; it might be about community dynamics.

  5.  **Address Question 3: Concrete Steps:**
      *   *Archaeology:* Dig into old minutes. Maybe there was a fight in 1985 about plot hoarding.
      *   *Reframing the Question:* Don't ask "Why keep the lottery?" Ask "What problem are we solving?" or "What happens if we stop?"
      *   *The "Sunset" Compromise:* Propose a pilot program. 3 years of tenure-based, then review.
      *   *Hybrid Model:* Keep the lottery but give weight to tenure? Or allow plot swapping?
      *   *Observe the "Waitlist":* If the waitlist is long, the lottery is a rationing mechanism. If short, it's unnecessary friction.

  6.  **Address Question 4: Self-Diagnosis (Bull vs. Clear-Eyed):**
      *   *Signs of a Bull:* Impatience, assuming stupidity in opponents, focusing only on efficiency, ignoring social costs, unwilling to compromise.
      *   *Signs of Clear-Eyed:* Curiosity about the hidden function, willingness to test, acknowledging trade-offs (efficiency vs. fairness), listening to the *emotion* behind the resistance.
      *   *Test:* Can you articulate the *best* argument for the other side better than they can? (Steel-manning).

  7.  **Synthesize and Structure the Response:**
      *   **Introduction:** Validate the frustration. Acknowledge the brother-in-law's point (Chesterton's Fence) but refine it.
      *   **Section 1: The Information in Resistance.** Distinguish between inertia and hidden function. Analyze the specific social dynamics of a lottery (prevents hoarding, forces interaction).
      *   **Section 2: A Principled Framework.** Define when to move from "search for reason" to "propose change." The concept of "Functional Obsolescence."
