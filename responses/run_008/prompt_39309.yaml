answer: |-
  This is a classic governance dilemma, and your brother-in-law is pointing you toward a philosophical concept known as **Chesterton's Fence**. The principle states: "Do not remove a fence until you know why it was put up in the first place."

  However, Chesterton's Fence is often misused as a veto against change. It is actually a directive for *investigation*. The fence might be there to keep cows in, or it might be there to keep people from falling off a cliff, or it might be there because a cow fell off a cliff once in 1978 and everyone got scared.

  You are asking for a principled way to distinguish between "wisdom we don't understand" and "inertia dressed up as wisdom." Here is a framework for thinking through this, specific to your neighborhood association context.

  ### 1. Is the resistance carrying information?
  **Yes.** But you have to decode *what* information it is. Resistance in a small community organization is rarely just about the policy on the page; it is about the social ecosystem the policy supports.

  When the old guard says, "It's worked so far," they are usually arguing for **risk aversion**, not efficiency. They are saying: *"The current system produces zero conflict. Your proposed system might produce better gardening, but it might also produce conflict, and I value peace over better tomatoes."*

  In a 60-house association, social cohesion is often more valuable than operational efficiency. The lottery likely serves hidden social functions:
  *   **Prevents Feudalism:** It stops "Garden Barons" from claiming the sunniest, best-soil plots in perpetuity.
  *   **Forces Mixing:** It ensures new neighbors interact with old neighbors during the swap, rather than new folks being siloed into the "leftover" bad plots.
  *   **Equalizes Burden:** If there's a bad patch of ground with poor drainage, the lottery ensures everyone shares that burden over time, rather than it becoming the "new guy's plot."

  **The Test:** If the resistance is *only* loss aversion, they will be unable to articulate any negative outcome of your proposal other than "change is scary." If the resistance is *wisdom*, they will be able to articulate a specific social friction your proposal might cause (e.g., "If the Johnsons keep the best plot forever, the new family on the corner will feel like second-class citizens").

  ### 2. A Principled Framework: Functional Obsolescence
  You earn the right to say "there is no reason, change it" when you have demonstrated **Functional Obsolescence**. This happens when the context that made the rule wise no longer exists.

  *   **Original Context (1970s):** High turnover? Disputes over plot quality? A desire to enforce radical equality among a new collective?
  *   **Current Context:** Waitlist? Stable neighborhood? High investment in soil quality?

  **The Principle:** A custom deserves deference if it solves a problem that still exists. If the problem is gone, the custom is just friction.

  **How to apply it:**
  Don't argue that your system is *better*. Argue that the *problem the lottery solves* is no longer the primary problem.
  *   *Old Problem:* Hoarding of resources.
  *   *New Problem:* Disincentive to improve soil.
  *   *Argument:* "The lottery solved hoarding in 1978. Today, our bottleneck isn't hoarding, it's soil degradation because people won't invest in land they might lose. The fence was built to stop cows; we don't have cows anymore, we have deer."

  ### 3. Concrete Steps to Settle It
  You need to move from a debate about *preferences* to an investigation of *function*.

  **A. The Archaeological Dig**
  Before the next meeting, dig into the minutes from the late 70s and early 80s. Look for the first mention of the lottery.
  *   *What to look for:* Was there a fight? Did someone refuse to give up a plot? Was there a complaint about "the best spots"?
  *   *Why:* If you find the origin story, you can address it. "I see the lottery started because Mr. Smith refused to swap in '82. We don't have Mr. Smiths anymore."

  **B. The "Pre-Mortem" Question**
  At the next meeting, do not advocate for your plan. Advocate for *understanding theirs*. Ask the old guard this specific question:
  > "I want to understand the risk. If we switch to tenure-based plots, what is the specific bad thing you think will happen in the first two years? Is it fighting? Is it unfairness? Is it cliques?"

  If they say "I don't know, I just don't like it," you have inertia. If they say "People will fight over the north corner," you have a hypothesis you can test.

  **C. The Hybrid Compromise (The Pilot)**
  Propose a trial that mitigates their risk while testing your hypothesis.
  *   **Option 1:** Returning gardeners get *first choice* in order of tenure, but must release the plot if they skip a year.
  *   **Option 2:** Plots are tenure-based, but every 5 years, a "reset" lottery happens.
  *   **Option 3:** **The most powerful option:** Propose a 3-year pilot of your system with a **sunset clause**. "We try this for three seasons. If there is more conflict than under the lottery, we automatically revert to the lottery."
      *   *Why this works:* It lowers the stakes. It turns a permanent change into a temporary experiment. It forces the old guard to define what "conflict" looks like so you can measure it.

  ### 4. Self-Diagnosis: Bull or Clear-Eyed?
  You asked how to tell the difference in yourself. Here is the litmus test.

  **You are the Bull in the China Shop if:**
  *   You frame the issue as **Efficiency vs. Stupidity**. (e.g., "This is inefficient and they are stubborn.")
  *   You assume the *gardening* is the primary purpose of the community garden. (Often, the *community* is the product; the garden is just the activity.)
  *   You are unwilling to accept a compromise that preserves the *spirit* of the rule (equity) while changing the *mechanism* (lottery).
  *   You cannot articulate the strongest argument *against* your position better than your opponents can.

  **You are Clear-Eyed if:**
  *   You frame the issue as **Trade-off vs. Trade-off**. (e.g., "We are trading soil quality for social equality. Is that still the right trade?")
  *   You acknowledge that your system creates winners and losers (tenured gardeners win, new gardeners lose), whereas the lottery creates random winners and losers.
  *   You are willing to gather data before demanding a vote.
  *   You recognize that "It's worked so far" is a valid data point regarding *stability*, even if it's not a valid argument for *optimality*.

  ### Summary Advice
  Your brother-in-law is half-right. You are likely missing the *social* function of the rule. But he is half-wrong because customs do become obsolete.

  **Your next move:**
  Drop the motion to change the rule for now. Instead, move to form a small committee (including one of the "old guard" blockers) to **"Review the Garden Allocation Policy and Document its Historical Intent."**

  Task the committee with finding out *why* the lottery started. If the committee comes back and says, "We couldn't find a reason, and the waitlist is long," you have built a coalition. If they come back and say, "In 1982, two neighbors almost came to blows over the north plot, and the lottery stopped it," then you know the fence is still holding up a cliff.

  If you can't find the reason, and you can propose a pilot program that protects against the *risk* of conflict, then you have earned the right to move the fence. Until then, assume the fence is holding up something you just can't see from where you're standing.
