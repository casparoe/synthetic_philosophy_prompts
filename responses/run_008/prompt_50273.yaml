prompt: |-
  I am the senior class president at my high school, and next week I have to give a ten-minute address at an all-school assembly about a cheating scandal: someone photographed the answer key for the junior chemistry midterm and leaked it into a class group chat, and by now about thirty students have either used it or quietly passed it along. The administration asked me to speak because, as they put it, the students will actually listen to me.

  Here is my problem. Last spring I submitted a take-home essay that a friend had written the better part of, in violation of the same honor code I would be standing up there defending. No one ever found out; only the two of us know. When I sat down to draft the speech, I found that I genuinely don't know what I am entitled to say from that stage. My ethics teacher once mentioned that philosophers distinguish between a criticism being true and the critic being in a position to make it — that a hypocrite's complaint isn't false, exactly, but something about it is illegitimate. I don't know the literature behind this; I'm seventeen. But I think my speech lives or dies on that distinction, so I need it worked out concretely enough to shape actual sentences.

  Please write the speech. It has to name the cheating as wrong, speak to the students who used the key and to the ones who only watched it circulate, and be deliverable by me — someone who has done a version of the same thing and gotten away with it. You will need to decide several things on my behalf: whether I should confess from the stage, and if so, whether a confession delivered to five hundred people is an act of honesty or a performance of it; whether the ritual disclaimer — the "I'm not perfect either" paragraph — restores my standing or is just a way of purchasing it at a discount; and whether it is possible to condemn the act without claiming any authority over the people who committed it. If you think the honest move is to aim the speech at the practice rather than at the students — to describe what the leak did to the class, to the teachers' trust, to the curve, without blaming anyone sitting in that gym — then say so plainly, but also tell me what that costs, because the juniors will hear it as a dodge, and they will be right to.

  The audience is roughly five hundred teenagers and twenty teachers. It needs to be serious without being a sermon, and it cannot rely on any authority I don't have. After the speech itself, please add a short note explaining the choices you made about my standing to blame: which lines are doing blame, which are doing something adjacent that I am hoping will pass for it, and what you think happens to the speech if someone in the audience knows what I did last spring and raises a hand during the question period.
reasoning: |-
  Here's a thinking process that leads to the suggested speech and analysis:

  1.  **Analyze the Request:**
      *   **Speaker:** Senior Class President (17 years old).
      *   **Context:** All-school assembly (500 students, 20 teachers).
      *   **Topic:** Cheating scandal (Junior Chemistry midterm answer key leaked, ~30 students involved).
      *   **Conflict:** The speaker previously cheated on a take-home essay (friend wrote most of it) and wasn't caught.
      *   **Philosophical Core:** The distinction between a criticism being *true* vs. the critic being in a *position* to make it (hypocrisy/standing to blame).
      *   **Constraints:** 10-minute address (approx. 1000-1300 words spoken at a moderate pace), serious but not sermonizing, cannot rely on unearned authority.
      *   **Key Decisions Required:** To confess or not? How to handle the "I'm not perfect" disclaimer? How to condemn without claiming moral superiority?
      *   **Deliverables:** The speech itself + a post-speech note explaining the ethical/rhetorical choices regarding "standing to blame."

  2.  **Deconstruct the Ethical Dilemma (Standing to Blame):**
      *   *Option A: Full Confession.* "I cheated too."
          *   *Pros:* Radical honesty, removes the hypocrisy charge, levels the playing field.
          *   *Cons:* Shifts focus from the current scandal to the speaker's past. Could undermine the administration's trust in the speaker. Might look like a performance ("look how honest I am") rather than genuine remorse. Risks disciplinary action (though unlikely if past, still risky).
          *   *Verdict:* Too disruptive. It makes the speech about *me*, not the community or the current issue. It's a spectacle.
      *   *Option B: Silent Hypocrisy.* Pretend I'm clean.
          *   *Pros:* Maintains authority.
          *   *Cons:* Internally corrosive. If found out later, destroys all credibility forever. The speech feels hollow to the speaker.
          *   *Verdict:* Unethical and risky.
      *   *Option C: Acknowledgment without Specifics.* "We are all capable of this."
          *   *Pros:* Acknowledges shared fallibility without making it a spectacle. Focuses on the *culture* rather than individual sins.
          *   *Cons:* Juniors might see it as a dodge (as the prompt warns).
          *   *Verdict:* This is the sweet spot. It acknowledges the *condition* of being a student under pressure without confessing the specific crime. It shifts from "I blame you" to "We need to fix this."

  3.  **Determine the Rhetorical Strategy:**
      *   **Tone:** Solidarity, not superiority. "We" not "You."
      *   **Focus:** The *harm* done to the community (trust, value of grades, teacher relationships), not just the rule broken.
      *   **The "Standing" Issue:** The prompt asks to explore the philosopher's distinction. The speech should implicitly argue that *shared vulnerability* grants standing, not *moral purity*. I am entitled to speak not because I am perfect, but because I care about what we are becoming.
      *   **Addressing the Juniors:** Don't shame them publicly (30 students is a lot). Address the *choice* and the *pressure*.
      *   **Addressing the Bystanders:** The ones who watched it circulate are complicit too.
      *   **Addressing the Teachers:** Acknowledge their hurt.

  4.  **Drafting the Speech - Section by Section:**
      *   *Opening:* Acknowledge the tension. Don't sugarcoat.
      *   *The Incident:* State facts without naming names.
      *   *The Harm:* Move beyond "rules" to "trust" and "value."
      *   *The Pressure:* Validate *why* it happened (grades, college, stress) without excusing it.
      *   *The "Me" Question:* Address the hypocrisy elephant without a full confession. Use the "We" framework. "I am not standing here because I have never been tempted."
      *   *The Path Forward:* Restitution, honesty, rebuilding.
      *   *Closing:* A call to shared responsibility.

  5.  **Refining the "Confession" Aspect:**
      *   I need to decide: Does he confess?
      *   *Decision:* No specific confession. It turns the assembly into a tribunal about *him*. However, he must admit fallibility. If he says "I have never cheated," he lies. If he says "I have cheated," he distracts.
      *   *Solution:* "I know what it feels like to want the easy way out." This is true (based on his essay incident) without being a legal confession. It bridges the gap.
      *   *Wait, looking closer at the prompt:* The prompt asks me to decide *whether* he should confess. It says "You will need to decide several things on my behalf."
      *   *Re-evaluation:* A specific confession ("Last spring I cheated") is too risky for a 17-year-old in a formal setting. It invites punishment and shifts the narrative. However, *hiding* it completely makes him a hypocrite.
      *   *Best Path:* Acknowledge the *capacity* for cheating without detailing the specific past act. This maintains the "standing" through shared humanity rather than moral perfection. It answers the "performance of honesty" concern by being honest about *nature*, not *history*.
      *   *Actually, let's push further:* The prompt asks about the "ritual disclaimer." If he says "I'm not perfect," it sounds like a discount purchase of standing. If he says nothing, he's a hypocrite.
      *   *Decision:* I will write the speech to *implicate himself in the culture* without confessing the specific crime. This avoids the "performance" trap while acknowledging the truth of his fallibility. It treats the cheating as a systemic failure, not just individual moral rot. This gives him standing as a peer, not a judge.

  6.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Start with the silence in the room.
      *   *Body:* Talk about the Chemistry test. Talk about the group chat. Talk about the 30 students vs. the watchers.
      *   *The Turn:* Why does this hurt? It makes the A meaningless. It makes the teacher's work meaningless.
      *   *The Hypocrisy Check:* "You might wonder who I am to say this." Address it directly. "I am not a judge."
      *   *Conclusion:* What do we do Monday?

  7.  **Addressing the Post-Speech Note:**
      *   Need to explain *why* I didn't confess specifically.
      *   Need to analyze the "standing to blame."
      *   Need to address the "What if someone asks?" scenario.

  8.  **Review against Constraints:**
      *   10 minutes? (Approx. 1300 words).
      *   Serious but not sermonizing? (Avoid religious language, avoid "thou shalt").
      *   Address juniors, bystanders, teachers.
      *   Handle the hypocrisy issue.

  9.  **Final Polish:**
      *   Ensure the voice sounds like a smart 17-year-old, not a principal.
      *   Make sure the philosophical distinction (truth of criticism vs. standing) is navigated in the speech's logic. *Self-Correction:* The speech shouldn't sound like a philosophy lecture. It should embody the solution. The *note* will explain the philosophy.

      *(Self-Correction during drafting)*: I need to be careful not to be *too* vague. The juniors will smell a dodge. I need to acknowledge that *I* am part of the system that created the pressure.
      *(Refining the Confession)*: I will choose *not* to confess the specific essay incident in the speech. Why? Because the prompt asks about the "performance of honesty." A public confession in this context is often performative virtue signaling. It centers the speaker. The more ethical move is to focus on the community harm. However, I must acknowledge my own fallibility to avoid the "hypocrite" label. I will phrase it as "I know the temptation."

      *(Wait, one more consideration)*: If I don't confess, and someone knows, does it destroy the speech? The note needs to address this. The speech must be robust enough to survive that revelation. It survives if the message is "We are all struggling with this," rather than "I am the moral arbiter."

      *Let's finalize the decision:* No specific confession of the essay. It's a distraction. But an admission of shared vulnerability.

      *(Wait, reading the prompt again)*: "You will need to decide several things on my behalf: whether I should confess from the stage..."
      Okay, I need to make a hard call.
      *Argument for Confession:* Radical honesty restores standing.
      *Argument against:* It makes it about him. It's performative.
      *Decision:* **Do not confess the specific act.** It turns a community address into a personal penance. Instead, admit to the *capacity* for the act. This is philosophically sound (Kantian universalizability vs. specific sin).

      *Wait, let's look at the "Standing to Blame" literature hint.* The teacher mentioned: "criticism being true and the critic being in a position to make it."
      If I condemn cheating while having cheated, I lack *standing*, even if the condemnation is *true*.
      How do I regain standing? By acknowledging the shared standard.
      Actually, maybe the boldest move is to admit the *potential* without the *specifics*.
      Okay, I will write the speech assuming **no specific confession**, but a strong acknowledgment of shared fallibility. This avoids the "performance" trap.

      *Wait, I need to check the word count.* 10 minutes is roughly 1,000 to 1,300 words.
      *Tone Check:* Needs to be empathetic but firm.

      *Let's write.*

      *(Post-Drafting Review)*: Does this address the "dodge" concern? Yes, by focusing on the *culture* of pressure that affects everyone, including the speaker.
      Does it address the bystanders? Yes, complicity of silence.
      Does it address the teachers? Yes, breach of trust.

      *The Note:* Needs to be analytical. Explain the "Standing" concept. Explain the risk of the Q&A.

      *(Final thought on the Confession)*: If I advise *against* confession, I need to justify it in the note. The justification is that the assembly is not a confessional booth; it's a governance moment. The goal is community repair, not personal absolution.

      *(Wait, one nuance)*: The prompt says "If you think the honest move is to aim the speech at the practice rather than at the students... then say so plainly."
      I think aiming at the *practice* and the *culture* is the right move. It avoids blaming specific individuals (which is dangerous and divisive) while condemning the act.

      Okay, ready to generate.

      *(Wait, last check on the "Confession" decision)*: If I tell him *not* to confess, am I helping him hide?
      The prompt asks me to decide.
      My decision: **Do not confess the specific essay.**
      Reasoning: It shifts the locus of attention from the community harm to the speaker's moral status. It is performative. However, he must not claim moral superiority. He must speak as a peer.
      This aligns with the "standing" literature: One can enforce a norm one has violated if one acknowledges the violation and re-commits to the norm, *but* doing so publicly for the first time in this context is theatrical. Better to speak to the *temptation* which is universal.

      Okay, proceeding with this plan.

