  (1) **0.65** — First-person present-tense belief ascriptions function phenomenologically as world-directed avowals, but the leap from phenomenology to strict semantic transparency is not airtight.
  (2) **0.75** — If transparency holds, the commissive form ('p but I believe not-p') becomes a contradiction of attitude rather than content, which still generates the requisite absurdity.
  (3) **0.20** — Purely normative accounts typically fail to capture the *logical* feel of the absurdity without implicitly borrowing the transparency thesis to ground the norm.
  (4) **0.50** — An expressivist hybrid (where 'I believe' expresses a state rather than describing it) is a strong contender that might dissolve the semantic/pragmatic dichotomy entirely.

  **Combined Credence: 0.60** that the fundamental explanation is transparency/semantic rather than purely normative/pragmatic.

  ***

  **Follow-up 1: Sensitivity and Movement**
  The final number is most sensitive to **Term (3)** (the viability of a distinct normative story). If the normative account is genuinely distinct and sufficient, my credence in transparency drops below 0.50; if the normative account *requires* transparency to function, transparency wins by default.

  **Thought Experiment:** Imagine an alien species that follows all human *norms* of assertion (they punish lying, reward evidence) but lacks first-person *transparency* (they observe their own beliefs via internal scanners like they observe their digestion). If they assert "p but I don't believe p," do they experience Moore's absurdity? If **yes**, the norm is fundamental (moves credence down); if **no**, transparency is fundamental (moves credence up).

  **Follow-up 2: Verbal Dispute Credence**
  **0.80** that the two extremes are describing the same phenomenon in different vocabularies. The "norm of assertion" is arguably just the social institutionalization of the "transparency of belief," making the fight over which is *fundamental* a dispute about where to place the semantic stop sign rather than a disagreement about the machinery.
