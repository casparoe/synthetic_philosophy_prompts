answer: |-
  **MEMORANDUM**

  **TO:** Campus Life Committee
  **FROM:** [Your Name], Undergraduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Proposed Plasma Collection Center

  **Recommendation**
  I recommend that the Committee **reject** the proposal to host a paid plasma collection center in the student union. While I understand the financial pressures facing our student body, approving this proposal sets a precedent that conflicts with the university's mission and exposes students to undue risk. We should vote on this Thursday with the intention of closing this specific avenue of revenue generation.

  **Addressing the Counter-Argument**
  I want to take the arguments in favor of this proposal seriously, because they come from a real place. Proponents argue that students are already selling their time and labor on campus—working at the library café, dining halls, or bookstores. From that perspective, plasma donation is just another transaction: a student provides something, and receives cash. Furthermore, there is the argument about harm reduction. Students are currently going to payday lenders or off-campus plasma centers anyway. If we ban this, we aren't stopping the behavior; we are just pushing it off-campus while denying the university revenue that could support the student emergency fund. Finally, there is the principle of autonomy: adults should be allowed to make decisions about their own bodies and finances.

  These points are valid regarding general financial aid and off-campus regulation. However, they miss the specific role of the university in this transaction.

  **Why This Is Different Than a Campus Job**
  The distinction between a campus job and plasma donation is not just semantic; it is structural. When a student works at the café, they are selling their labor and time. When they donate plasma for pay, they are selling biological material extracted from their bodies. This introduces health risks and bodily integrity issues that a standard job does not.

  More importantly, approving this makes the university a direct partner in the transaction. We are not just providing a neutral space; we are collecting a per-donation fee. This incentivizes the university to benefit from student participation in a medical procedure. If a student suffers a health complication from frequent donation, the university has financially profited from that specific interaction. That creates a conflict of interest between our duty of care and our revenue stream.

  Regarding the "payday lender" argument: The existence of predatory off-campus options does not justify the university becoming a vendor. Our job is to provide better alternatives (grants, work-study, emergency funds), not to compete with payday lenders by monetizing student biology. Calling this "free choice" ignores the reality that financial desperation limits true consent. When the choice is "donate plasma or don't eat," it isn't a free market choice; it is coercion by circumstance. By hosting this, we legitimize that coercion.

  **Criteria for Future Proposals**
  We have been told to expect more proposals monetizing campus assets, such as auctioning prime gym hours or selling priority course registration. To avoid deciding these cases based on "vibes" or individual discomfort, I propose the committee adopt the following three criteria for any future revenue-generating partnerships:

  1.  **The Equal Access Test:** Does this proposal create a two-tier system where wealthier students can buy access to essential resources that others cannot? (e.g., Course registration slots fail this test; gym hours might pass if non-prime hours remain free).
  2.  **The Mission Alignment Test:** Does monetizing this asset conflict with the university's educational or welfare mission? (e.g., Plasma collection fails this because it turns student health into a revenue stream; a bookstore passes).
  3.  **The Vulnerability Test:** Does the business model rely on targeting students who are financially desperate rather than those seeking convenience? If the primary customer base is driven by necessity rather than choice, the university should not host it.

  **Conclusion**
  We can support students in need without turning the student union into a marketplace for biological material. I urge the committee to vote no on Thursday. Instead, let us focus on expanding genuine work-study opportunities and emergency grants that help students without requiring them to sell part of themselves to stay enrolled.

  I am happy to discuss these criteria further during the meeting.
