answer: |-
  Bottom line
  Prioritize the meta-question first: determine whether "enjoying sad art" is a single phenomenon or a conflation of distinct experiences. Second, investigate the Control theory (agency and regulation). Third, and only critically, engage with the Distance theory (quasi-emotion). The meta-question is upstream of everything else; if your friend's third point is correct, the other two debates are category errors. Control offers the most philosophical leverage for a student without lab access, while Distance is empirically vulnerable and conceptually stagnant.

  The questions
  First, the Heterogeneity Question: Is the pleasure derived from tragic art a unified psychological state, or are we lumping together distinct experiences like "being moved," "catharsis," and "melancholy"? The unresolved issue is whether the paradox of tragedy is one problem or many. If the phenomenology differs, the explanation must differ.

  Second, the Agency Question: Does the value lie in the negative valence itself, or in the mastery over it? This asks whether we enjoy sadness because it is sadness, or because we successfully navigate it without real-world cost. The unresolved tension is between valence monism (sadness is always negative) and instrumentalism (sadness is a tool for regulation).

  Third, the Ontology Question: Are emotions felt toward fiction qualitatively different from real-world emotions? This is the core of the Distance theory. The unresolved issue is whether "quasi-emotion" is a coherent philosophical category or merely a description of real emotion with a different causal origin.

  Why this order
  This ordering is dictated by logical dependency, feasibility, and literature saturation. You must start with the Heterogeneity Question because it determines the scope of your inquiry. If the phenomenon is heterogeneous, as your friend suggested near the end of your debate, then seeking a single solution to the paradox of tragedy is a mistake. Many existing papers fail because they assume unity where there is plurality. For example, the pleasure of "being moved" (often warm, social, and uplifting) is phenomenologically distinct from the pleasure of "melancholy" (cold, solitary, and reflective). If you write a paper assuming these are the same, your argument will be vulnerable to counterexamples that simply describe a different subtype of sad art. By tackling this first, you either validate the traditional debate or dissolve it, which is a significant philosophical contribution in itself. It is also purely conceptual; you can analyze phenomenological reports and logical consistency without needing empirical data.

  The Control theory comes second because it is the most philosophically robust option remaining if the phenomenon is unified. It shifts the debate from metaphysics (what is emotion?) to action theory and value theory (what is agency worth?). This is fertile ground for a philosophy student. You can argue about the value of autonomy, the nature of emotional regulation, and the distinction between suffering and enduring without needing a psychology lab. It respects the intuition that the sadness feels real (unlike Distance theory) but explains the enjoyment through the context of safety and choice. This area is less crowded than the Distance literature. Most classic papers focus on whether the emotion is real, not on whether the *control* over the emotion is the source of value. By focusing on agency, you avoid the empirical trap of trying to prove whether heart rates differ during fiction versus reality.

  The Distance theory is last because, frankly, it is a mess for a contemporary term paper. It relies on the claim that fictional emotions are not "real" emotions. This position has been hammered by both empiricists and phenomenologists over the last thirty years. Physiological evidence suggests our bodies react to fiction similarly to reality; tearing up at a movie involves the same lacrimal glands as tearing up at a funeral. To defend Distance, you would need to make a very subtle, perhaps untenable, distinction between qualitative feel and cognitive object. Furthermore, this literature is saturated. The Walton vs. Radford debates are canonical for a reason; saying something new here is exceptionally difficult. It is also the most empirically dependent of the three. If psychology confirms that physiological arousal is identical across real and fictional contexts, the philosophical distinction collapses. As a student without lab access, you cannot settle this. You can only critique it, which is less constructive than building a positive account via Control or Heterogeneity.

  Finally, this order respects your constraints. A semester is too short to solve the paradox entirely, but it is enough to argue convincingly that the paradox is ill-posed (Heterogeneity) or to develop a novel account of agency (Control). Trying to rehabilitate Distance is a high-risk, low-reward strategy that invites empirical objections you cannot answer. By prioritizing the conceptual structure of the problem over the metaphysical status of the emotion, you maximize your philosophical leverage.

  What would change my mind
  Two developments could reshuffle this ranking. First, if consensus emerges in affective neuroscience that "being moved" and "sadness" are neurologically distinct systems with non-overlapping markers, the Heterogeneity Question becomes an empirical fact rather than a conceptual debate, pushing it out of philosophy's primary lane. Second, if predictive processing models of the brain become the dominant framework in philosophy of mind, the Control theory might dissolve. If the brain treats all perception as controlled hallucination anyway, the distinction between "regulated fiction" and "unregulated reality" may lose its explanatory power, forcing a return to ontological questions about emotion itself.
