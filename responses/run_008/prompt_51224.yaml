      *   *Distance:* Heavily trodden ground (Walton, Radford). Hard to say something new without empirical backing on whether physiological responses differ. Often seen as a "cop-out" (as the friend said).
      *   *Control:* Interesting, bridges philosophy of action and emotion. Feasible for conceptual analysis.
      *   *Connection:* This is the "being moved" literature (Menninghaus, etc.). It shifts the target from "sadness" to "kama muta" or similar. This might be the most fertile ground because it challenges the premise of the paradox itself.
      *   *Meta-Question:* Is it one question or three? This is crucial. If the phenomenon is heterogeneous, solving one doesn't solve the others.

