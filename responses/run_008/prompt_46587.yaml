answer: |-
  # Seminar Plan: The Causal Credit Game
  **Topic:** The Causal Exclusion Argument (Jaegwon Kim)  
  **Time:** 75 Minutes  
  **Students:** 12 (3 Teams of 4)  
  **Goal:** Students experience the tension between Causal Closure, Exclusion, and Mental Causation before encountering the technical argument.

  ---

  ## 1. Setup & Materials (5 Minutes)

  **The Scenario:**  
  Write on the board: *"Sam raises their hand to vote 'Yes'."*  
  This is the **Target Event**.

  **The Teams (3 Groups of 4):**  
  1.  **Team Mind:** Represents beliefs, desires, intentions (e.g., "Sam wanted to vote").  
  2.  **Team Neuro:** Represents brain states, neural firings (e.g., "Motor cortex fired").  
  3.  **Team Physical:** Represents fundamental physics (e.g., "Quantum fields shifted," "Atoms moved").

  **Materials:**  
  *   1 Poker Chip (or distinct card) labeled **"THE CAUSE"**.  
  *   3 Whiteboards or large sheets of paper (one per team).  
  *   1 Timer.  
  *   **Payoff:** "Seminal Status." The winning team chooses the *opening discussion question* for next week's seminar (a significant privilege in a student-led seminar).

  **The Rules (Round 1):**  
  1.  **The Closure Rule:** The Target Event is a physical movement. Therefore, a sufficient physical cause *must* exist within the physical domain (Team Neuro or Team Physical).  
  2.  **The Exclusion Rule:** There is only **one** causal credit token. If one team claims it, the others are excluded.  
  3.  **The Distinctness Rule:** Team Mind and Team Neuro describe *different* things. You cannot say they are the same thing yet.  
  4.  **No Overdetermination:** You cannot claim the event was "caused twice." That is cheating.

  ---

  ## 2. Round 1: The Squeeze (15 Minutes)

  **Objective:** Teams must argue why *their* level is the true cause of Sam's hand raising.

  **Phase A: Preparation (5 mins)**  
  Teams huddle. They must write a 2-sentence "Causal Brief" on their whiteboard explaining why their level caused the hand to raise.  
  *   *Team Mind:* Focus on reasons, rationality, "Sam did it *because*..."  
  *   *Team Neuro:* Focus on mechanisms, necessity, "The muscle moved *because*..."  
  *   *Team Physical:* Focus on fundamental sufficiency, "The atoms moved *because*..."

  **Phase B: The Auction (10 mins)**  
  You (the Instructor) act as the **Causal Banker**.  
  1.  Ask Team Physical: "Do you have a sufficient cause?" (They must say Yes, per Closure).  
  2.  Ask Team Neuro: "Do you have a sufficient cause?" (They must say Yes).  
  3.  Ask Team Mind: "Do you have a sufficient cause?" (They will say Yes).  
  4.  **The Crisis:** Hold up the single **"THE CAUSE"** token.  
  5.  Open the floor. Teams have 5 minutes to debate and lobby *you*.  
      *   *Constraint:* You must enforce the **Exclusion Rule**. If you give the token to Team Neuro, you must physically take Team Mind's board down.  
      *   *Prompt:* "If the neurons fired sufficiently to move the arm, what work is left for the desire to do?"  
      *   *Prompt:* "If the atoms moved sufficiently, what work is left for the neurons?"  

  **Outcome:** Eventually, a team must be awarded the token. (Likely Team Neuro or Physical). Team Mind will feel "excluded."

  ---

  ## 3. Debrief 1: The Intuition Pump (10 Minutes)

  Pause the game. Do not reveal Kim's name yet. Ask:

  1.  **To Team Mind:** "How did it feel when Team Neuro claimed the token? Did your explanation become false, or just causally idle?" (Targets *Epiphenomenalism*).  
  2.  **To Team Neuro:** "Why did you win? Was it because you were more 'real' or just closer to the muscle?" (Targets *Causal Closure*).  
  3.  **To the Class:** "Why was nobody allowed to suggest that *both* caused it?" (Targets the *Exclusion Premise*).

  *Write on Board:*  
  *   Closure: Physical effects need physical causes.  
  *   Exclusion: No effect has >1 sufficient cause.  
  *   Distinctness: Mind ≠ Brain.  
  *   **Result:** Mind does nothing.

  ---

  ## 4. Round 2: Escape Routes (15 Minutes)

  **Rule Change:** Tell the students the "Causal Bank" is facing a PR crisis. Epiphenomenalism is unpopular. You are allowing **One Rule Modification** to save Mental Causation.

  **Options (Teams must vote on which rule to change):**  
  1.  **The Identity Loophole:** Team Mind and Team Neuro can merge. They claim the token jointly because they are the *same event* described differently.  
  2.  **The Overdetermination Permit:** Two tokens can be awarded. Both Mind and Neuro caused it (like two assassins shooting at once).  
  3.  **The Supervenience Rider:** Team Mind gets the token, but *only if* Team Neuro also gets a "shadow token" (Mind depends on Neuro).

  **Play (10 mins):**  
  Run the argument again with the chosen rule change.  
  *   *If Identity:* Teams must argue why "Desire" just *is* "Neural Firing."  
  *   *If Overdetermination:* Ask if it makes sense that *every* action is causally doubled.  
  *   *If Supervenience:* Ask who really did the work.

  **Payoff (5 mins):**  
  Award "Seminal Status" to the team that best exploited the loophole without breaking the logic of the scenario.

  ---

  ## 5. Final Debrief: Mapping to Kim (20 Minutes)

  Now you introduce Jaegwon Kim. Map the game mechanics to the philosophical argument.

  1.  **The Closure Rule:** In the game, I stipulated this. In Kim's argument, this is the **Causal Closure of the Physical**. It's the idea that physics doesn't need help from outside to explain physical movements.  
  2.  **The Exclusion Rule:** In the game, I held one token. In Kim's argument, this is the **Exclusion Principle**. If a cause is sufficient, adding another is redundant.  
  3.  **The Distinctness Rule:** In Round 1, you couldn't say Mind = Brain. This is **Non-Reductive Physicalism**. If you keep them distinct, Mind loses.  
  4.  **The Overdetermination Option:** In Round 2, some of you likely felt awkward choosing Overdetermination. Kim argues systematic overdetermination is implausible (it's a coincidence every time you raise your hand).  
  5.  **The Identity Escape:** If you chose Identity, you moved to **Type Identity Theory**. You saved causation, but you lost the distinctness of the mental.

  **The Conclusion:** Kim argues you cannot keep all four: (1) Mental Causation, (2) Closure, (3) Exclusion, (4) Distinctness. You must drop one. The game forced you to drop (1) or (4).

  ---

  ## 6. Limitations: What the Game Hid (5 Minutes)

  Be honest about where the simulation fails. You must supply this via lecture/reading for next time.

  1.  **Events vs. Properties:** The game treated "Sam's hand raising" as a single object to be claimed. Kim's argument is subtler: it's about *properties* (the property of *being a desire* vs. the property of *being a C-fiber firing*) instantiated at an event. The game reifies causes as tokens, which oversimplifies the metaphysics.  
  2.  **Closure as a Rule vs. Principle:** In the game, Closure was a hard rule enforced by the Banker. In philosophy, Closure is a methodological principle of science. It's not logically impossible for the mind to cause motion, but it would break the laws of physics. The game makes it look like a logical contradiction; it's actually a conflict with scientific naturalism.  
  3.  **The "Work" Metaphor:** The game implies causation is "credit" or "work" that gets used up. Real causation isn't a zero-sum resource. The exclusion argument relies on *sufficiency*, not resource depletion.

  ---

  ## 7. Predictable Failure Points (Instructor Notes)

  **1. The "Team Physical" Steamroll:**  
  *Problem:* Team Physical (Fundamental) will argue they are the *most* sufficient cause, excluding Team Neuro just as hard as Team Neuro excludes Team Mind. This distracts from the Mind-Body problem.  
  *Fix:* Enforce a **"Proximity Clause"** in Round 1. The cause must be *proximate* to the effect. This disqualifies Team Physical (too remote) and forces the fight to be Mind vs. Neuro.

  **2. The "Different Languages" Objection:**  
  *Problem:* Students will argue, "Neuro explains *how*, Mind explains *why*. Both are causes, just different kinds."  
  *Fix:* Rig the **Exclusion Rule**. Explicitly state: "We are looking for the cause that *makes the difference* to the physical motion. If the neurons did it, the desire made no difference to the motion." Force them to confront *causal efficacy*, not just explanatory utility.

  **3. Collusion on Overdetermination:**  
  *Problem:* Students might instantly vote for Overdetermination in Round 1 to avoid conflict.  
  *Fix:* Attach a **Penalty** to Overdetermination in Round 1. "If you claim overdetermination, you lose 50% of your Prestige Points because it implies the universe is wildly coincidental." Make it costly.

  **4. Confusion on Identity:**  
  *Problem:* In Round 2, Team Mind and Team Neuro might merge without understanding the metaphysical cost (eliminating the mental as a distinct category).  
  *Fix:* During Debrief, press them: "If Mind just *is* Neuro, do we still need a 'Team Mind'? Did you save mental causation or eliminate the mental?"

  ---

  ## Timing Summary
  *   **0:00–0:05:** Setup & Rules.  
  *   **0:05–0:20:** Round 1 (The Squeeze).  
  *   **0:20–0:30:** Debrief 1 (Intuitions).  
  *   **0:30–0:45:** Round 2 (Escape Routes).  
  *   **0:45–1:05:** Final Debrief (Mapping to Kim).  
  *   **1:05–1:10:** Limitations & Assignment.  
  *   **1:10–1:15:** Buffer/Q&A.
