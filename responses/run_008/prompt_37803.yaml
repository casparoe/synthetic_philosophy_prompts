answer: |-
  **The Fork Procedure (5-Min Max)**

  **Path A: Buddhist Ethics (Intention & Precepts)**
  1.  **Pause.** Feel the impulse to act.
  2.  **Check Roots:** Is this driven by greed (wanting credit/security), aversion (anger/annoyance), or delusion (confusion/panic)?
  3.  **Check Precepts:** Does this involve lying, harsh speech, or harming living beings (including yourself)?
  4.  **Verdict:** If Roots are negative OR Precepts broken → **DO NOT ACT.** The outcome is irrelevant; the karma is in the mind state.

  **Path B: Consequentialism (Expected Value)**
  1.  **List Stakeholders:** Who is affected?
  2.  **Estimate Impact:** Magnitude of harm/benefit × Probability for each.
  3.  **Sum:** Is net utility positive or negative?
  4.  **Verdict:** If Net Positive → **ACT.** Intention is irrelevant; only results matter.

  **Worked Cases**

  **1. Irritated Code Review**
  *   **Path A:** You feel annoyance (Aversion). Speech risks being harsh. **Verdict: Wait.** Do not speak until calm.
  *   **Path B:** Blunt truth prevents future outages (High Benefit). Delay risks merge conflicts (High Cost). **Verdict: Send.**
  *   *Conflict:* A forbids what B demands. You won't like A here; it feels like suppressing truth for the sake of "vibes," even if the code needs fixing.

  **2. Late Night Bug Fix (Free Tier)**
  *   **Path A:** Driving yourself to exhaustion harms you (Harming Being). Attachment to being "the hero" (Greed). **Verdict: Go home.**
  *   **Path B:** Small user pain vs. your health. Net utility negative. **Verdict: Go home.**
  *   *Agreement:* Both say stop, but A cares about your mind/health as a principle, B cares about the utility sum.

  **3. Covering Friend's Sloppy Work**
  *   **Path A:** Statement is false (False Speech). Intention (loyalty) doesn't cleanse the act. **Verdict: Don't lie.**
  *   **Path B:** Friend keeps job (High Benefit) vs. Manager misled (Medium Cost). If friend is critical, net positive. **Verdict: Maybe lie.**
  *   *Conflict:* A sets a hard boundary; B negotiates based on stakes.

  **Where This Is Just Judgment**
  Path A's "Check Roots" is subjective; you can lie to yourself about being calm. Path B's "Estimate Impact" is guesswork dressed as math. They secretly agree on 80% of stuff (don't be needlessly cruel), because cruelty usually creates bad karma *and* negative utility. The divergence is real only when "doing the right thing" requires breaking a rule or acting from anger.

  **Final Call**
  Follow Path A when they genuinely conflict. Path B requires omniscience you don't have, while Path A protects the only variable you actually control: your own mind.
