prompt: |-
  I teach political philosophy at a mid-sized state school, and through one of those service traps none of us ever learn to avoid, I've ended up as the token humanist on our state's Criminal Code Review Commission. We're working through the old morals provisions this cycle — most of them unenforced for decades — and the big fight is the adultery statute, which is still on the books and still occasionally charged, pretty much always as leverage in ugly divorce/custody fights and never on its own. Two commissioners want it repealed outright; one wants it kept and actually enforced, because in his words, if the criminal law doesn't stand for the family it stands for nothing; and the rest just want to avoid a news cycle.

  I have to circulate a written recommendation before the next meeting, and I'd rather not phone it in. Draft me the memo: a concrete bottom line (straight repeal, repeal plus something, keep-but-narrow, whatever you actually think is best), with reasons the other commissioners could engage with. The temptation on our side of these debates is to treat Devlin as a punching bag and the harm principle as obviously sufficient, but the guy who wants enforcement isn't stupid, and the memo is worthless if it doesn't give the strongest version of his position a real run for its money.

  One thing I want you to deal with head on: a bunch of laws we all accept enforce conventional morality well past any harm boundary — I can't sell myself into slavery, can't sell a kidney, can't duel a consenting partner — so the mere fact that adultery between consenting adults is 'victimless' can't settle the question by itself, and if the memo pretends it does, the enforcement guy will rightly tear into it. Also please don't lean too hard on constitutional arguments — the commission's charge is what the code *should* say, not what a court would let it say. If it helps, we also have a lesser-known provision on the docket this cycle (public 'lewdness' applied to a nude beach that's been tolerated for 40 years), so if you want to sketch how your recommendation's logic would handle that one too, that would actually be useful.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Political Philosophy professor at a mid-sized state school.
      *   **Role:** Token humanist on a state Criminal Code Review Commission.
      *   **Task:** Draft a written recommendation memo regarding the adultery statute (and potentially the public lewdness provision).
      *   **Context:**
          *   Adultery statute is old, mostly unenforced, but used as leverage in divorce/custody.
          *   Commission composition: 2 want repeal, 1 wants enforcement (Devlin-esque position), rest want to avoid news cycles.
          *   Goal: Concrete bottom line + reasons others can engage with.
          *   Constraint 1: Do *not* treat Lord Devlin as a punching bag; do *not* assume the Harm Principle is obviously sufficient.
          *   Constraint 2: Address the "legal moralism" counter-argument (e.g., bans on slavery, kidney sales, dueling) where morality is enforced without direct physical harm to third parties.
          *   Constraint 3: Avoid heavy reliance on constitutional arguments (focus on *should*, not *can*).
          *   Constraint 4: Optionally/Helpfully address the "public lewdness/nude beach" provision to show consistency.
      *   **Tone:** Professional, philosophical but practical, respectful of opposing views, persuasive to a mixed audience.

  2.  **Determine the Stance/Bottom Line:**
      *   *Option A: Repeal.* Simple, clean. But needs to address the moralist objection.
      *   *Option B: Keep but Narrow.* Hard to define "narrow" for adultery without making it arbitrary.
      *   *Option C: Repeal + Civil Remedies.* Acknowledge the harm is civil (marriage contract), not criminal.
      *   *Decision:* **Repeal.** Why? Because criminal law is the blunt instrument of the state. Adultery breaches a private vow, not a public duty enforceable by incarceration. However, the argument must concede that morality *is* a legitimate interest of the state, just not *this* morality via *this* mechanism.
      *   *Refinement:* Let's go with **Repeal**, but grounded in a distinction between *public order/integrity of institutions* vs. *private fidelity*. To address the "moralism" counter-argument (slavery/dueling), the distinction should be about *enforceability* and *social disintegration* vs. *private wrongs*. Actually, a better angle is the **Institutional Competence** argument combined with a **Liberty/Privacy** argument that isn't just "Harm Principle."
      *   *Wait, the prompt asks to deal head-on with the legal moralism examples (slavery, kidneys, dueling).* These are often justified by *paternalism* or *human dignity* rather than pure moralism. Adultery is different; it's about sexual morality.
      *   *Stronger Argument:* The "Enforcement Guy" argues law stands for the family. The counter is: Criminalizing adultery *undermines* the family by turning intimate betrayal into a police matter. It commodifies the marriage vow into a state-enforced rule.
      *   *Bottom Line:* **Repeal the adultery statute.** Retain the public lewdness statute but narrow its application to non-consenting observers (addressing the nude beach issue).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the recommendation clearly.
      *   **The Core Conflict:** Acknowledge the "Enforcement Commissioner's" view (Devlin). Validate it. The law *does* encode morality.
      *   **Addressing the Counter-Argument (The "Hard Cases"):** Why ban slavery/dueling but not adultery?
          *   *Slavery/Kidneys:* These involve the commodification of the *self* or irreversible loss of autonomy. They are structural harms to the concept of personhood.
          *   *Dueling:* Public violence, even if consented to, breaches the peace/monopoly on force.
          *   *Adultery:* It is a breach of contract/vow, but criminalizing it externalizes a private trust issue.
      *   **The "Family" Argument:** The Commissioner says law must stand for the family.
          *   *Counter:* Criminal law is a terrible tool for building familial trust. It turns spouses into informants. It creates leverage (as noted in the prompt). It degrades the institution it claims to protect.
      *   **The Nude Beach/Lewdness Issue:** How to distinguish?
          *   Adultery is private (usually). Lewdness is *public*.
          *   The distinction is **Public vs. Private** sphere, not just Harm vs. Morality.
          *   Public order requires some regulation of public space, even if no direct physical harm occurs (nuisance/offense principle).
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "Public vs. Private" distinction strong enough? Devlin would argue private immorality *is* public business because it erodes the moral fabric.
      *   *Fix:* I need to argue that the *specific* moral norm of sexual exclusivity is not foundational to the *political* order in the way that bans on slavery or violence are. The state has an interest in the stability of marriage, but not in policing the sexual fidelity within it via penal sanctions.
      *   *Better Fix:* Focus on the **nature of the wrong**. Adultery is a *betrayal of trust*. Trust cannot be coerced. Coercing fidelity creates a hollow simulation of marriage. The bans on slavery/dueling protect the *capacity* for agency. Adultery laws restrict the *exercise* of agency in a way that doesn't protect the institution.
      *   *Wait, one more thing:* The prompt mentions the statute is used for leverage. This is a practical "Rule of Law" argument. Laws that are selectively enforced undermine respect for the law. This appeals to the "avoid a news cycle" commissioners.

  5.  **Finalizing the Structure:**
      *   **To/From/Subject.**
      *   **Recommendation:** Repeal adultery; Amend lewdness.
      *   **Argument 1: The Limits of Legal Moralism.** Acknowledge Devlin. Distinguish "constitutive morality" (slavery/dueling) from "relational morality" (adultery).
      *   **Argument 2: The Integrity of the Family.** Criminalization harms the institution it seeks to protect (turns intimacy into surveillance).
      *   **Argument 3: Selective Enforcement & Rule of Law.** The leverage problem.
      *   **Argument 4: Public Lewdness.** Distinguish based on the "Public/Offense" principle vs. private conduct.
      *   **Closing.**

  6.  **Tone Check:**
      *   Avoid academic jargon where possible (or explain it).
      *   Respectful to the "Enforcement Commissioner."
      *   No "Harm Principle" trump cards.
      *   Focus on *political philosophy* applied to *statutory review*.

  7.  **Drafting the Content (incorporating the "Slavery/Dueling" constraint):**
      *   *Key Insight:* The bans on selling kidneys or dueling are about protecting the *conditions of agency* or *public peace*, not just "morals." Adultery doesn't destroy agency.
      *   *Key Insight 2:* The "Enforcement Commissioner" cares about the *symbolic* function of law. I need to argue that repeal is symbolically better for the family than retention.

  8.  **Final Polish:** Check against constraints.
      *   Concrete bottom line? Yes (Repeal).
      *   Reasons others can engage with? Yes (Institutional integrity, Rule of Law, Distinction of moral types).
      *   Deal with slavery/dueling? Yes (Distinguish commodification of self vs. breach of vow).
      *   No heavy constitutional arguments? Yes (Focus on policy/philosophy).
      *   Address nude beach? Yes (Public vs. Private distinction).

  *(Self-Correction during final review)*: Make sure I don't sound *too* much like a professor. It needs to read like a commission memo. Keep it tight. Ensure the distinction between the "moralism" of slavery (paternalism/dignity) and adultery (relational fidelity) is clear.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Criminal Code Review Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Statutes 21-5-3 (Adultery) and 21-9-1 (Public Lewdness)

  **I. RECOMMENDATION**

  1.  **Adultery (Statute 21-5-3):** Recommend **Repeal**.
  2.  **Public Lewdness (Statute 21-9-1):** Recommend **Retention with Amendment**. The statute should be narrowed to explicitly require the presence of a non-consenting observer or a public setting where notice of potential observation is clear (addressing the "nude beach" context).

  **II. RATIONALE: THE ADULTERY STATUTE**

  The central question before this Commission is not whether adultery is morally wrong. Most of us, including myself, would agree that adultery represents a significant moral failing and a breach of trust. The question is whether the *criminal law* is the appropriate mechanism to address that failing.

  Commissioner [Name of Enforcement Proponent] has argued persuasively that the law cannot be morally neutral. He is correct. As we see with statutes prohibiting dueling, the sale of organs, or voluntary slavery, the criminal code frequently restricts consensual conduct between adults to uphold a conception of human dignity or social order that transcends immediate physical harm. If we reject the Harm Principle as the sole boundary of criminalization, we must articulate why adultery falls outside the legitimate scope of legal moralism while dueling or organ sales remain within it.

  My recommendation for repeal rests on three distinctions that separate adultery from those other "victimless" moral prohibitions.

  **A. Constitutive Morality vs. Relational Morality**
  The prohibitions on voluntary slavery, kidney sales, and dueling protect the *conditions of agency* itself. They prevent the commodification of the human person or the privatization of violence. These are "constitutive" rules; they maintain the baseline status of citizens as free agents who cannot alienate their own autonomy or breach the public peace, even by consent.

  Adultery, by contrast, is a breach of "relational" morality. It violates a specific vow made between two persons, not the baseline status of citizenship. When the state criminalizes slavery, it protects the citizen from themselves. When the state criminalizes adultery, it polices the internal fidelity of a private association. There is a categorical difference between protecting a citizen's capacity for autonomy (banning slavery) and enforcing the specific emotional/sexual terms of a private contract (marriage). The former is a public duty; the latter is a private trust.

  **B. The Instrumental Effect on the Family**
  Commissioner [Name] argues that if the law does not stand for the family, it stands for nothing. I agree that the law should support the family. However, we must ask whether *criminalization* supports the family or degrades it.

  Marriage relies on voluntary fidelity. Trust cannot be coerced; it can only be given. By introducing the threat of incarceration or criminal record into the marital bond, the state transforms a relationship of trust into a relationship of surveillance. It invites spouses to view each other as potential informants.

  Furthermore, as we have noted in testimony, the current statute is rarely used to prosecute "immorality" in the abstract. It is used as leverage in divorce and custody proceedings. This turns the criminal code into a bargaining chip for civil disputes. This selective enforcement undermines the dignity of the law. A statute that is dormant for decades and then activated solely to gain leverage in property division creates a cynical view of the criminal justice system. It suggests the law is not a shield for the family, but a weapon for the litigious.

  **C. The "Enforceability" Constraint**
  Even if we accept that adultery is a proper subject for moral legislation, we must consider the cost of enforcement. To enforce this statute meaningfully would require an intrusion into the private sphere that citizens would rightly find intolerable. To enforce it *selectively* (as we currently do) is to violate the Rule of Law principle that like cases be treated alike.

  We accept bans on organ sales because the transaction is discrete and verifiable. We accept bans on dueling because they usually result in public violence or death. Adultery occurs in private, leaves no physical evidence, and is only discovered when one party chooses to reveal it. A law that depends entirely on the betrayal of one participant to be enforced is not a law that upholds morality; it is a law that incentivizes betrayal.

  **III. RATIONALE: PUBLIC LEWDNESS (THE NUDE BEACH PROVISION)**

  The logic above does not apply equally to the public lewdness provision regarding the nude beach. While both statutes touch on sexual morality, the distinction lies in the **public nature of the act**.

  The "Enforcement" argument holds that the community has a right to maintain a shared public environment consistent with its standards of decency. Unlike adultery, which is inherently private, public nudity is inherently observable.

  *   **Recommendation:** We should not repeal the public lewdness statute, but we should amend it to align with the **Offense Principle** rather than pure Moralism.
  *   **Reasoning:** The state has a legitimate interest in regulating the use of public space to ensure it remains accessible to all citizens without forcing them into unintended encounters with sexually explicit conduct. However, where a specific area has been tacitly tolerated for 40 years (as with the beach), the "offense" is mitigated by notice.
  *   **Proposal:** Amend the statute to exempt areas designated for such use, or where long-standing custom has provided implicit notice. This balances the community's moral interest in public decorum with the liberty interest of adults to consensually occupy public space where no unwilling observers are present. This distinguishes it from adultery: one regulates the *public square*, the other regulates the *bedroom*.

  **IV. CONCLUSION**

  We can acknowledge that the law has a moral function without accepting that every moral wrong is a crime. The bans on slavery and dueling protect the *capacity* of citizens to be free agents. The ban on adultery attempts to protect the *content* of a private relationship.

  By repealing the adultery statute, we do not declare adultery morally acceptable. We declare that the integrity of marriage is best served by private commitment and civil remedy, not by the blunt force of the penal code. We preserve the criminal law for offenses that strike at the public order or the conditions of agency, and we spare the family from becoming a site of criminal investigation.

  I look forward to discussing this framework at our next session.
