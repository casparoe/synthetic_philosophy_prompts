answer: |-
  You have correctly identified that your intuitions are tracking two distinct variables, not one. Your "vibes" are actually a sophisticated, unarticulated moral theory. The reason you feel pulled in opposite directions is that you are trying to collapse **Moral Consistency** (Hypocrisy) and **Relational Authority** (Standing) into a single metric of "Goodness." They are not the same thing.

  Here is the principle that systematizes your verdicts, followed by the bullets you need to bite and the ruling on your new case.

  ### The Principle: Specific Integrity & Relational Stake (SIRS)

  To have standing to blame an agent $A$ for a violation of norm $N$, a blamer $B$ must satisfy two independent conditions:

  **1. The Condition of Specific Integrity (CSI)**
  $B$ lacks standing if $B$ is *currently* and *unrepentantly* violating norm $N$.
  *   **Specificity:** Violations of *other* norms ($M$) do not disqualify $B$ from blaming $A$ for $N$. (Cruelty does not disqualify honesty-enforcement).
  *   **Temporality:** Past violations of $N$ do not disqualify $B$ if $B$ has repented and reformed. (Reformed liars have standing).
  *   **Status:** Mere temptation or near-violation of $N$ does not disqualify $B$, provided $N$ was not actually breached.

  **2. The Condition of Relational Stake (CRS)**
  $B$ lacks standing if $B$ lacks a relevant relationship or stake in $A$'s adherence to $N$.
  *   **Scope:** Blame is a social tool for regulating relationships, not a cosmic verdict. Strangers or casual acquaintances generally lack the authority to blame, even if they are morally pure.
  *   **Function:** This explains why the "Blameless Meddler" fails. They pass CSI (they are pure) but fail CRS (it's not their business).

  ---

  ### Applying SIRS to Your Cases

  Here is how the principle handles your list, and where it forces you to adjust your intuition.

  **1. Constant Liar vs. Liar**
  *   **Verdict:** No Standing.
  *   **SIRS Analysis:** Fails CSI. He is *currently* and *unrepentantly* violating the specific norm (honesty in relationships).
  *   **Status:** **Saved.**

  **2. Reformed Liar vs. Liar**
  *   **Verdict:** Has Standing.
  *   **SIRS Analysis:** Passes CSI. Past violation is negated by repentance/reform. Passes CRS (assumed friend).
  *   **Status:** **Saved.** (Your intuition that he might have *more* standing is also supported: he has epistemic authority on the difficulty of the norm).

  **3. Cruel but Honest vs. Liar**
  *   **Verdict:** Has Standing.
  *   **SIRS Analysis:** Passes CSI. Cruelty is a violation of norm $M$, not norm $N$ (honesty). Specificity protects him.
  *   **Status:** **Saved.**

  **4. Blameless Meddler vs. Acquaintance**
  *   **Verdict:** No Standing.
  *   **SIRS Analysis:** Passes CSI (morally pure). Fails CRS (no relationship/stake).
  *   **Status:** **Saved.** This confirms your suspicion that moral purity is not sufficient for standing.

  **5. Tempted but Resisted vs. Cheater**
  *   **Verdict:** **Ambivalent (Principle says: Has Standing).**
  *   **SIRS Analysis:** She passes CSI. She did not violate the norm. The fact that she was tempted is irrelevant to *standing*, though it may be relevant to *tone*.
  *   **The Bullet to Bite:** You must accept that she **does** have standing. Your hesitation comes from confusing *standing* with *stability*. You worry she might cheat tomorrow. That is a prediction about her future character, not a judgment on her current right to blame. She resisted; therefore, she is currently in compliance with the norm.
  *   **Why it feels different from the Reformed Liar:** The Reformed Liar has *evidence* of change (time + ownership). The Tempted Woman has *evidence* of fragility. But fragility is not hypocrisy.

  **6. Past Blamer (Later Exposed) vs. Brother**
  *   **Verdict:** **Ambivalent (Principle says: Standing was valid *then*, credibility lost *now*).**
  *   **SIRS Analysis:** Standing is time-indexed. At the moment of blaming the brother, the blamer believed themselves innocent (or was innocent of *known* cheating). They satisfied CSI *at that time*.
  *   **The Bullet to Bite:** You must accept that the past blame was **valid at the time it was spoken.** It is not retroactively poisoned. However, their *credibility* is retroactively destroyed. Standing is the *right* to speak; credibility is the *weight* of the speech. They had the right then, but we now know the weight was undeserved.
  *   **Correction:** If they *knew* they had cheated and hid it while blaming the brother, they failed CSI *at that time* (due to dishonesty about the past). If they genuinely forgot or didn't count it as cheating until later, they had standing then, but lose it now.

  ---

  ### The New Case: The Group of Cheaters

  **Scenario:** A whole group quietly cheated on Exam A years ago. One member ($B$) publicly blames another member ($A$) for cheating on Exam B now.

  **SIRS Analysis:**

  1.  **Condition of Specific Integrity (CSI):**
      *   Did $B$ violate norm $N$ (Academic Integrity)? Yes, on Exam A.
      *   Is it *current* and *unrepentant*? The prompt says they "quietly cheated" and it is a "shared dirty secret." This implies concealment.
      *   *Crucial Distinction:* Unlike the **Reformed Liar** (Case 2), this group has not "owned it." They are sustaining the violation through silence. By hiding the past cheating, they are currently being dishonest about their academic record.
      *   Therefore, $B$ is *currently* violating the broader norm of Integrity (which includes owning past failures).
      *   **Result:** $B$ Fails CSI.

  2.  **Condition of Relational Stake (CRS):**
      *   Does $B$ have a stake? Yes, they are peers/classmates.
      *   **Result:** $B$ Passes CRS.

  3.  **The Group Dynamic Factor:**
      *   Does the shared secret change anything? Yes, it creates a **Complicity Trap**.
      *   In the individual reformed liar case, the blamer has separated themselves from their past sin. In the group case, the blamer is *still bound* to the sin by the mutual pact of silence.
      *   For $B$ to blame $A$ is to threaten the group's security. It transforms the blame from "moral correction" into "betrayal" or "deflection." $B$ is effectively saying, "We all broke the rule, but I am judging you for breaking it now," while relying on the group's silence to protect their own past.
      *   This is worse than individual hypocrisy; it is *institutional* hypocrisy.

  **Verdict on New Case:**
  **No Standing.**
  The principle dictates that because the past cheating is unowned and concealed ("quietly"), the blamer is currently living in violation of the integrity norm (via concealment). The shared secret does not grant immunity; it creates collective disqualification. None of them have standing to blame anyone for cheating until *all* of them own their past cheating.

  ### Summary of Required Adjustments

  To make your moral framework consistent, you must accept three things that might feel uncomfortable:

  1.  **The Tempted Woman has standing.** Do not penalize near-misses. If she didn't cross the line, she holds the high ground, even if her footing is shaky.
  2.  **Standing is Time-Indexed.** Do not judge past blame by present revelations. If they were honest *then*, they had standing *then*. The new info destroys their *future* standing, not their past right.
  3.  **Concealment is a Current Violation.** In the Group Case, the lack of "owning it" means they are not "Reformed." They are "Hidden." Hidden violators never have standing, regardless of how long ago the crime was.

  Your gut was mostly right; you just needed to separate the *right to blame* (Standing) from the *weight of the blame* (Credibility) and the *scope of the relationship* (Stake).
