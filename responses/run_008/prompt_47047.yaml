prompt: |-
  I am the conflict-resolution officer at a mid-sized research university. Roughly twice a month I mediate disputes between academic and administrative units: two departments fighting over shared instrument time, a center and a college arguing over who controls a new hire's startup funds, units disputing precedence in naming. Most cases settle, but the ones that don't escalate into formal grievances — months of process, letters from the university counsel, and a dean's ruling that both sides treat as a loss. I have no training in game theory; my sessions are capped at ninety minutes plus a short prep call; the parties are professors and administrators who will tolerate arithmetic but not notation; and my office can propose but not compel, since agreements stick because backing out is reputationally costly, not because anything enforces them.

  Some years ago I came across an idea from a corner of decision theory — the literature associated with Caspar Oesterheld and collaborators calls it "safe Pareto improvements" — and it struck me as being directly about my cases. As I understand it, the thought is this: when two parties are headed for a costly conflict, there is often a commitment they could both make, before either knows how the conflict would go, that replaces the fight with a jointly agreed lottery over the fight's possible outcomes. If each party, not knowing how the fight would have turned out, prefers the lottery to the fight, then the swap is safe in a strong sense: it makes both parties better off no matter which way the fight would actually have gone. The toy case is two parties who would litigate at great expense agreeing instead to draw lots over the contested good. I want this idea turned into something I can actually run in a mediation.

  Please write the procedure in sections, in this order and at roughly these lengths:

  1. "The principle, in plain terms" — about half a page, written so that I could read it aloud to the parties: no notation, no citations, and it should say precisely what makes a swap safe and what it is not (it is not fairness, and it is not any Pareto improvement whatsoever).

  2. "The procedure" — about a page: the questions to ask in order, what counts as a sufficient answer to each, and the tests a dispute must pass before I even propose a lottery. These should include at least: whether the fight is genuinely costly to both sides; whether each party would prefer the lottery to the fight even conditional on the fight having gone its way; whether both parties can actually commit; whether the draw is publicly verifiable and hard to manipulate; and whether anything the parties value is non-transferable in a way that breaks the substitution. Mark where the procedure terminates with "not applicable, mediate normally" and where it terminates with "this is a values question, hand it back."

  3. "Where judgment cannot be eliminated" — about half a page: the points at which the procedure requires my assessment rather than yielding an answer, marked honestly, including how to treat the parties' stated willingness to fight, which may be bluff or positioning.

  4. "Worked applications" — about half a page each, running the procedure step by step on the three disputes below.

  5. "What the procedure cannot do" — a quarter page of failure modes I should expect.

  The three disputes, chosen so the procedure is genuinely tested:

  (a) Two research groups each claim priority on a shared spectrometer's peak-season weeks. If neither yields, the grievance freezes access for the semester and both lose the data. My guess is that this is the textbook case; confirm or correct that.

  (b) A weak unit and a powerful unit dispute control of a startup fund. The powerful unit's grievance costs are largely borne by the dean, and it enjoys the fight. I suspect that here there is no swap both parties prefer to fighting, and I want the procedure to say so plainly rather than manufacture a compromise. If the best available move is to decline to propose anything and route the dispute upward, the procedure should produce exactly that, even though I will not enjoy delivering it.

  (c) A naming and precedence dispute: two units in a joint initiative each insist their name goes first on the grant and the resulting publications. The stakes are symbolic, but the fight is real enough to poison the collaboration. I want to see whether the procedure can handle a case in which what the parties value is not a divisible good — or whether it correctly stops and tells me that the lottery answers the wrong question.

  Two further constraints. First, whenever the procedure calls for probabilities, I need a way of proposing them that a party can accept without feeling conned: the choice between equal chances and something weighted by strength of claim is itself a values question, and the procedure should say where that line falls rather than burying it in step four. Second, be blunt in section 5 about the ways my proposing lotteries could go wrong: parties accepting because a lottery feels unserious and then relitigating; repeat players learning to overstate their love of conflict to extract better splits; and my own incentive, as a mediator, to reach any agreement rather than a safe one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Conflict-resolution officer at a mid-sized research university.
      *   **Task:** Create a mediation procedure based on "Safe Pareto Improvements" (SPI) from decision theory (specifically referencing Caspar Oesterheld's work, though the output shouldn't cite academic literature heavily).
      *   **Constraints:**
          *   No game theory notation/jargon (parties tolerate arithmetic, not notation).
          *   Sessions capped at 90 mins + prep.
          *   Agreements are reputationally enforced, not legally.
          *   Specific structure and length requirements for 5 sections.
          *   Specific constraints on probability assignment (fairness vs. weighted).
          *   Specific constraint on Section 5 (blunt about failure modes).
          *   Three specific case studies to work through (Spectrometer, Startup Fund, Naming Rights).
      *   **Core Concept:** Replace a costly conflict with a lottery over the conflict's outcomes. If both prefer the lottery *ex-ante* (before knowing the outcome) to the fight *ex-ante*, it's a "safe" swap. It's not about fairness; it's about avoiding deadweight loss.

  2.  **Deconstruct "Safe Pareto Improvements" (SPI) for this Context:**

      *   *Standard SPI:* Agents commit to playing a modified game that yields a better outcome than the default equilibrium, regardless of what the other does (in a specific sense).
      *   *Mediation Adaptation:* The "default equilibrium" is the grievance process (costly, uncertain). The "modified game" is a lottery over the *outcomes* of that grievance process, without incurring the costs.
      *   *Key Condition:* $E[U(Lottery)] > E[U(Fight)]$. Since the fight has costs ($C$), $E[U(Fight)] = p \cdot V_{win} + (1-p) \cdot V_{lose} - C$. The lottery removes $C$.
      *   *Crucial Nuance:* The prompt asks for a specific interpretation: "replaces the fight with a jointly agreed lottery over the fight's possible outcomes." This is essentially "arbitration by lot" to save transaction costs.
      *   *Safety:* It is "safe" because it dominates the conflict outcome *in expectation* for both parties due to cost savings, not because the distribution is "fair."

  3.  **Drafting Section 1: The Principle, in Plain Terms**

      *   *Goal:* Read aloud to parties. No jargon.
      *   *Content:* Define the swap. Explain *why* it's safe (cost avoidance). Distinguish from fairness (it might feel unfair to the "winner" who now only has a chance) and general Pareto (it must be better than *this* fight, not just *any* deal).
      *   *Tone:* Professional, clear, authoritative but neutral.
      *   *Length:* ~0.5 page.

  4.  **Drafting Section 2: The Procedure**

      *   *Goal:* Step-by-step checklist.
      *   *Content:*
          1.  Identify the "Fight Outcome" (Win/Lose).
          2.  Identify the "Fight Cost" (Time, money, reputation, access freeze).
          3.  Assess Commitment (Can they stick to the draw?).
          4.  Assess Verifiability (Randomization method).
          5.  Assess Substitutability (Is the good divisible/transferable via chance?).
          6.  The Preference Test (Lottery > Fight?).
          7.  Probability Assignment (Who decides the odds?).
      *   *Termination Points:* "Not applicable" (costs too low, can't commit) vs. "Values question" (odds dispute, non-transferable stakes).
      *   *Length:* ~1 page.

  5.  **Drafting Section 3: Where Judgment Cannot Be Eliminated**

      *   *Goal:* Acknowledge the mediator's role.
      *   *Content:* Bluffing (threatening to fight), estimating costs (hard to quantify reputation), the "probability" negotiation (50/50 vs. weighted).
      *   *Length:* ~0.5 page.

  6.  **Drafting Section 4: Worked Applications**

      *   *Case (a) Spectrometer:* Textbook case. High cost (freeze), divisible good (time), clear outcomes. *Verdict:* Apply procedure.
      *   *Case (b) Startup Fund:* Asymmetric costs. Powerful unit enjoys fight/dean pays. *Verdict:* Procedure fails (one party prefers fight). Route upward.
      *   *Case (c) Naming:* Symbolic stakes. Non-transferable via lottery? (Winning naming rights is binary, but does a lottery solve the *prestige* issue?). *Verdict:* Likely "Values question" or fails substitutability.
      *   *Length:* ~0.5 page each.

  7.  **Drafting Section 5: What the Procedure Cannot Do**

      *   *Goal:* Failure modes.
      *   *Content:* Relitigation, strategic bluffing (love of conflict), mediator bias (settlement pressure).
      *   *Constraint:* Be blunt.
      *   *Length:* ~0.25 page.

  8.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check Constraint 1 (Probabilities):* The prompt specifically worries about how to propose probabilities without feeling conned. I need to make sure Section 2 explicitly separates "Do we lottery?" from "What are the odds?" The odds are a values question.
      *   *Check Constraint 2 (Section 5):* Ensure I mention the specific risks listed (unserious acceptance, repeat players overstating love of conflict, mediator incentive).
      *   *Check Tone:* Needs to sound like an internal manual for a professional, not an academic paper.
      *   *Check SPI Logic:* Ensure I don't confuse SPI with standard mediation. SPI is specifically about *committing to a substitute for the conflict outcome*. It's not about finding a new creative solution (integrative bargaining); it's about simulating the conflict result without the cost. I need to be careful not to drift into "let's find a win-win." The prompt defines the SPI as "lottery over the fight's possible outcomes." I must stick to that definition.
      *   *Length Check:* Keep an eye on word count relative to "pages." A standard page is ~250-300 words.
          *   Sec 1: ~150 words.
          *   Sec 2: ~300 words.
          *   Sec 3: ~150 words.
          *   Sec 4: ~150 words x 3 = ~450 words.
          *   Sec 5: ~75 words.
          *   Total: ~1100-1200 words.

      *   *Refining Section 2:* I need to make sure the "tests" are clear.
          *   Test 1: Costliness.
          *   Test 2: Commitment.
          *   Test 3: Verifiability.
          *   Test 4: Substitutability.
          *   Test 5: Preference (Lottery > Fight).
      *   *Refining Section 4 (Case B):* The prompt says the powerful unit's costs are borne by the dean. This means *for them*, the fight is cheap. The procedure must catch this. If Cost_Powerful ≈ 0, then Lottery (which gives <100% chance of win) might be < Fight (100% chance of win - 0 cost). So the procedure should stop.
      *   *Refining Section 4 (Case C):* Naming. If I win the lottery, I get the name first. If I lose, second. Is this better than fighting? Fighting poisons collaboration. But if the value is *prestige*, does a lottery diminish it? "We won the coin toss" vs "We earned the precedence." The procedure should flag this as a potential "Values question."

  9.  **Final Review against constraints:**
      *   No notation? Yes.
      *   Specific section order? Yes.
      *   Specific case studies? Yes.
      *   Blunt Section 5? Yes.
      *   Probability constraint addressed? Yes.

      *(Self-Correction on Length)*: "About half a page" usually implies visual length. I will aim for roughly 150-200 words per half-page section and 300-350 for the full page section to ensure density without fluff.

      *(Self-Correction on SPI Definition)*: The prompt defines SPI specifically as "replaces the fight with a jointly agreed lottery over the fight's possible outcomes." I must adhere to this operational definition, even if academic SPI is broader. This is essentially "costless arbitration by lot."

      *(Final Polish)*: Ensure the voice is that of a manual for the officer, not a letter to the parties (except Section 1).

      Let's write.

      *Section 1:* Focus on "Deadweight Loss."
      *Section 2:* Numbered steps. Clear stop conditions.
      *Section 3:* Focus on "Bluffs" and "Odds."
      *Section 4:* Run the steps.
      *Section 5:* Bullet points for failure modes.

      *Wait, one detail:* "The choice between equal chances and something weighted by strength of claim is itself a values question, and the procedure should say where that line falls rather than burying it in step four."
      *Action:* In Section 2, I need to explicitly state that agreeing on the *odds* is a separate negotiation from agreeing to the *mechanism*. If they can't agree on odds, the procedure terminates as "values question."

      *Let's assemble.*
answer: |-
  ### 1. The principle, in plain terms

  We are considering a specific trade: replacing the grievance process with a private lottery. Here is why this is distinct from a normal compromise. In a compromise, you both give up something to find a middle ground. In this swap, you are not changing the stakes; you are removing the cost of fighting for them.

  Imagine the grievance process is a box. Inside that box is a result: one of you wins, one of you loses. But to open the box, you must both pay a heavy fee in time, reputation, and lost access. A "safe" swap means we agree to draw lots for what is inside the box without paying the fee to open it.

  This is safe only if two conditions are met. First, the fee to open the box must be real and painful for both of you. Second, you must both prefer a chance at the prize without the fee, rather than a chance at the prize with the fee. This is not about fairness. A fifty-fifty draw might feel unfair to the party who believes they are right. This is not about finding a creative solution that makes everyone happy. It is strictly about asking: "Is the cost of proving you are right worth more than the risk of losing by chance?" If the answer is yes for both of you, the swap is safe. If the answer is no for either of you, we do not proceed.

  ### 2. The procedure

  **Step 1: Define the Fight Outcome.**
  Ask each party: "If the grievance process concludes fully, what are the only two possible rulings?" (e.g., Unit A gets full control, or Unit B gets full control).
  *   *Sufficient Answer:* Binary outcomes. If there are multiple complex rulings, simplify to "Win" vs. "Loss" of the primary claim.
  *   *Termination:* If outcomes are not binary, mark "not applicable, mediate normally."

  **Step 2: Quantify the Fight Cost.**
  Ask: "What do you lose during the grievance process that you do not get back, regardless of who wins?" (e.g., semester access, staff hours, relationship damage).
  *   *Sufficient Answer:* Concrete losses acknowledged by both sides.
  *   *Termination:* If one party bears no cost (e.g., costs are absorbed by the Dean), mark "not applicable, mediate normally."

  **Step 3: Test Commitment and Verifiability.**
  Ask: "If we draw lots now, will you accept the result without filing the grievance?" and "What randomization method do you trust?" (e.g., coin toss, third-party draw).
  *   *Sufficient Answer:* Unqualified yes; agreed method.
  *   *Termination:* If either party hedges on acceptance, mark "not applicable, mediate normally."

  **Step 4: Test Substitutability.**
  Ask: "Is the value in winning the claim, or in the process of earning the win?"
  *   *Sufficient Answer:* Value is in the resource/control, not the vindication.
  *   *Termination:* If the value is symbolic vindication, mark "this is a values question, hand it back."

  **Step 5: The Preference Test.**
  Ask privately: "Would you prefer a [X]% chance of winning immediately without cost, over a [Y]% estimated chance of winning after paying the cost?"
  *   *Sufficient Answer:* Both parties prefer the lottery.
  *   *Termination:* If either prefers the fight, mark "not applicable, mediate normally."

  **Step 6: Assigning Probabilities.**
  The parties must agree on the odds (e.g., 50/50 or weighted).
  *   *Constraint:* I do not propose the odds. I only facilitate the mechanism.
  *   *Termination:* If they agree to lottery but disagree on odds, mark "this is a values question, hand it back."

  ### 3. Where judgment cannot be eliminated

  This procedure does not remove your need for judgment; it relocates it. You must assess the credibility of the "Fight Cost." Parties will minimize their own costs to appear strong. If a department claims a grievance will not distract them, but you know their chair is already overwhelmed, you must challenge that assessment. A "safe" swap relies on real costs; if the costs are illusory, the safety is illusory.

  You must also evaluate the "Love of Conflict." In Step 5, a party may claim they prefer the fight not because of the odds, but because they enjoy the adversarial process or wish to punish the other side. The procedure treats this as a preference, but you must judge whether this is a stable preference or a bargaining bluff. If you suspect bluffing, do not propose the lottery; call the bluff by preparing for the grievance.

  Finally, the probability assignment (Step 6) is where neutrality is hardest. If you suggest 50/50, the stronger party feels cheated. If you suggest weighted odds, you are judging the merit of the case, which is the Dean's role. You must remain silent on the odds. Your judgment is required only to recognize when the disagreement over odds is actually a disagreement over values, signaling you to terminate the procedure.

  ### 4. Worked applications

  **(a) The Spectrometer Dispute**
  *   **Outcome:** Group A gets peak weeks or Group B gets peak weeks. (Pass)
  *   **Cost:** Grievance freezes access for the semester. Both lose data. (Pass: High mutual cost).
  *   **Commitment:** Both need data now; reputational cost of backing out is high. (Pass).
  *   **Substitutability:** Value is data collection, not vindication. (Pass).
  *   **Preference:** Both prefer a 50% chance of peak weeks now over a 50% chance of peak weeks in six months with no data. (Pass).
  *   **Verdict:** This is the textbook case. Proceed to Step 6. If they agree on odds, execute the draw.

  **(b) The Startup Fund Dispute**
  *   **Outcome:** Weak Unit controls fund or Powerful Unit controls fund. (Pass).
  *   **Cost:** Weak Unit pays staff time. Powerful Unit's costs are borne by the Dean; Powerful Unit enjoys the political fight. (Fail).
  *   **Preference:** For the Powerful Unit, the fight cost is near zero. A lottery gives them less than 100% control for free. The fight gives them high probability of control for free. They prefer the fight. (Fail).
  *   **Verdict:** The procedure terminates at Step 2/5. Do not propose a lottery. The Powerful Unit has no incentive to save costs they do not incur. Route upward to the Dean with a note that cost-saving mechanisms are inapplicable due to asymmetric cost structures.

  **(c) The Naming Dispute**
  *   **Outcome:** Unit A name first or Unit B name first. (Pass).
  *   **Cost:** Collaboration poisoned, grant delay. (Pass).
  *   **Substitutability:** Value is precedence and prestige. Does winning a coin toss confer the same prestige as winning a merit dispute? Likely not. The "right" to be first is tied to the perceived merit of the claim. (Fail).
  *   **Verdict:** The procedure terminates at Step 4 ("this is a values question"). A lottery resolves the allocation but devalues the prize. Hand back to parties: "A lottery saves time but may reduce the prestige of the winner. If prestige is the goal, this mechanism fails."

  ### 5. What the procedure cannot do

  Do not expect this to solve deep-seated animosity. Be blunt about these failure modes:
  *   **Relitigation:** Parties may accept the lottery as "unserious" and file the grievance anyway if they lose the draw. You must secure a public commitment before the draw.
  *   **Strategic Bluffing:** Repeat players may claim they "love a fight" to force you to abandon the lottery and return to standard mediation where they have leverage.
  *   **Mediator Bias:** You are incentivized to close cases. Do not push the "Preference Test" if the answer is no. A failed procedure is better than an unsafe agreement that collapses later. If the swap isn't safe, let them fight.
