prompt: |-
  I'm on the people-ops steering comittee at a ~400-person software company (boilerplate mid-size, nothing exotic). Our CEO read something on a flight and came back convinced our "flexible, passion-driven" culture is quietly grinding people down: internal survey shows median 50+ hour weeks, half of engineering says they answer Slack on vacation, two people out on medical leave for burnout this year. So we have to actually pick a policy at next month's meeting, and there are three live proposals:

  1) A hard 35-hour week -- hours logged, managers dinged for overage, basically the French thing, on the theory that if you don't measure it it doesn't exist.
  2) Unlimited PTO plus sabbaticals -- the Silicon Valley favorite. We actually tried this three years ago and people took LESS vacation, but the execs love the signal.
  3) The weird one, from our most senior engineer. She spent four years at a Tokyo firm where a colleague of hers literally died at his desk -- karoshi is not a hypothetical to her, it's a name she had to say at a funeral. She wants what she calls "protected leisure": no hour-counting at all, but contractually enforced off-time -- no email delivery between 8pm and 8am, vacation where HR takes your laptop, a company-wide closed day once a month. Her argument is roughly that the problem isn't how much we work but that our leisure has been colonized: recovery counts as work-prep, hobbies get rebranded as upskilling, the weekend is just a buffer so the machine can run again Monday. She keeps citing some line about the Greek word for leisure being the root of our word for school, which honestly I haven't checked.

  And of course we have a VP who pushes back on all three with what he openly calls the Protestant work ethic: effort is intrinsically ennobling, people who love their craft SHOULD work sixty hours, and capping hours is paternalism that treats adults as children. He's not a cartoon -- he mentored half our best engineers and they'd walk into traffic for him, so I can't just dismiss him.

  Draft the memo I'll circulate before the meeting. I want a concrete recommendation -- pick one of the three or a hybrid, whatever you actually think is right, with rollout details a committee could vote on -- and I want the VP's position taken seriously, steelmanned even, not just litigated against. The engineer's "colonized leisure" idea is the one I find most interesting and also most hand-wavy: if it's doing real work in your recommendation, say exactly what work. And include a section on what would change the recommendation -- what evidence from the rollout, or what argument someone could raise at the meeting, should make us flip. Also flag where you think your own reasoning is weakest.

  After the memo, give me a JSON object with these fields: "recommendation" (one line), "runner_up" (one line), "confidence" ("low", "medium", or "high"), "strongest_case_for_the_losing_side", "key_empirical_assumptions" (array of things we'd need to check or measure), "what_would_change_our_mind" (array), "weakest_link_in_reasoning" (one or two sentences).
reasoning: |-
  Here's a thinking process that leads to the suggested memo and JSON output:

  1.  **Analyze the Request:**
      *   **Context:** ~400-person software company, mid-size, boilerplate.
      *   **Problem:** CEO convinced culture is grinding people down (50+ hr weeks, Slack on vacation, burnout leaves).
      *   **Task:** Draft a pre-meeting memo for the People-Ops Steering Committee.
      *   **Options:**
          1.  Hard 35-hour week (French style, tracked).
          2.  Unlimited PTO + Sabbaticals (Silicon Valley style, previously failed).
          3.  "Protected Leisure" (Senior Engineer's proposal: no after-hours comms, HR takes laptop on vacation, company closed days).
      *   **Opposition:** VP argues for Protestant Work Ethic (effort is ennobling, capping is paternalistic, high performers *want* to work 60 hrs).
      *   **Requirements:**
          *   Concrete recommendation (pick one or hybrid).
          *   Rollout details.
          *   Steelman the VP's position (take it seriously).
          *   Explain the "colonized leisure" concept concretely if used.
          *   Include a section on what would change the recommendation (evidence/arguments).
          *   Flag weakest reasoning.
          *   **Output:** Memo followed by a specific JSON object.

  2.  **Evaluate the Options:**
      *   *Option 1 (35-hour hard cap):* Radical for a US software company. Likely to cause resentment among high performers (VP's point), difficult to enforce without toxic time-tracking, might hurt competitiveness/speed. Good for stopping overt overwork, bad for autonomy.
      *   *Option 2 (Unlimited PTO):* Already tried and failed. Data shows people take *less* time. Adding sabbaticals helps, but doesn't solve the daily "always-on" Slack culture. Easy to implement, hard to make effective.
      *   *Option 3 (Protected Leisure):* Addresses the root cause (always-on connectivity, inability to disconnect) rather than just the symptom (hours). Aligns with the burnout data (Slack on vacation). Respects autonomy during work hours but enforces boundaries during off hours. Matches the "colonized leisure" theory.
      *   *VP's View:* Valid concern about autonomy and craft. Some people *do* flow state for 60 hours. Paternalism can kill culture. Need to preserve space for "crunch" when truly necessary (launches, incidents).

  3.  **Formulate the Recommendation:**
      *   *Choice:* A hybrid leaning heavily on Option 3 ("Protected Leisure"), but with safeguards for the VP's concerns (autonomy/craft).
      *   *Why:* Option 1 is too rigid for knowledge work. Option 2 is proven ineffective for this specific company culture. Option 3 addresses the *inability to recover*, which is the burnout driver.
      *   *Refinement:* Call it "Right to Disconnect + Mandatory Recharge."
      *   *Key Components:*
          *   No expected comms 7pm-7am (soft block, hard norm).
          *   Mandatory minimum PTO (fixes the Unlimited PTO failure).
          *   Company-wide shutdowns (fixes the "I can't leave because others are working" issue).
          *   Exception process for the VP's "craft/crunch" argument (opt-in crunch, not default).

  4.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Executive Summary:** State the problem and the recommendation clearly.
      *   **Context:** Acknowledge the CEO's concern and the data (50+ hrs, burnout).
      *   **Analysis of Options:** Briefly touch on why 1 and 2 are less optimal.
      *   **The Recommendation (Protected Leisure + Mandatory Minimums):** Detail the policy.
      *   **Steelmanning the VP:** Dedicate a section to why the VP is right about *some* things (autonomy, flow, paternalism) and how the policy accommodates that.
      *   **Operationalizing "Colonized Leisure":** Explain what this means practically (separating recovery from prep).
      *   **Rollout Plan:** Phased approach.
      *   **Conditions for Reversal:** What data would kill this plan?
      *   **Weaknesses:** Where might this fail?

  5.  **Refining the "Colonized Leisure" Concept:**
      *   The prompt asks to explain what work this idea is doing if included.
      *   *Idea:* It shifts the focus from *input* (hours) to *boundary integrity*. It stops the "pre-recovery" (checking email to clear the deck so I can *actually* relax).
      *   *Implementation:* IT-level blocks on email delivery, HR confiscation of devices (maybe too extreme? Let's say "IT remote wipe lock" or just strict norm + survey verification). Let's go with "IT-enforced delivery delay" for emails/slack during off hours.

  6.  **Addressing the VP (Steelmanning):**
      *   Don't call him outdated. Call his view "Craft Autonomy."
      *   Acknowledge that capping hours can insult high performers.
      *   Solution: The policy restricts *communication*, not *work*. If an engineer wants to code for 12 hours on a Saturday because they are in flow, they can. But they cannot be *expected* to answer Slack, and managers cannot reward visibility over output.

  7.  **Identifying Weaknesses & Change Conditions:**
      *   *Weakness:* Cultural norms beat written policy. If the CEO sends emails at 9pm, the policy dies.
      *   *Change Condition:* If productivity tanks (unlikely short term) or if top talent leaves citing "lack of flexibility."

  8.  **Constructing the JSON:**
      *   Summarize the memo's core logic into the required fields.
      *   Ensure "confidence" is realistic (medium, because culture change is hard).
      *   Ensure "strongest_case_for_the_losing_side" reflects the VP's argument.

  9.  **Review against Constraints:**
      *   ~400 person company tone (professional but direct).
      *   Concrete recommendation? Yes.
      *   Rollout details? Yes.
      *   VP steelmanned? Yes.
      *   "Colonized leisure" explained? Yes.
      *   Change mind section? Yes.
      *   Weakest link flagged? Yes.
      *   JSON at the end? Yes.

  10. **Final Polish:** Check tone. Ensure it sounds like a People-Ops lead speaking to a committee, not a consultant speaking to a client. It needs to be actionable. (Self-Correction: Make sure the "HR takes laptop" part isn't too draconian for a US company, maybe frame it as "IT-enforced lockdown" to be more scalable). *Decision: Let's keep the spirit of the Senior Engineer's idea but make it operationally viable. "IT-enforced communication blackout" is better than "HR physically taking laptops."*

  11. **Final check on JSON structure:** Ensure valid JSON syntax (quotes, commas, brackets).

  *(Self-Correction during drafting)*: I need to make sure I don't just dismiss Option 2 entirely. Unlimited PTO is popular. The fix is adding a *minimum* to the unlimited. That's a common hybrid. I will incorporate that into the recommendation.

  *(Refining the VP Steelman)*: The VP says effort is ennobling. I need to acknowledge that *voluntary* intense effort is different from *coerced* intense effort. The policy must distinguish between the two.

  *(Refining "Colonized Leisure")*: The prompt specifically asks if it's doing real work in the recommendation, say exactly what work. I need to be explicit: It justifies *blocking communication* rather than *counting hours*.

