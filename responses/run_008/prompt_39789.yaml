answer: |-
  The step you should reject is **the inference from (5) to (6)**.

  Here is the diagnosis of why this machinery slips, why it looked plausible, and the cost of fixing it.

  ### Why the Inference Looked Fine
  The move from (5) to (6) relies on a subtle equivocation regarding the scope of moral evaluation. Premise (5) concludes that misleading lacks the *distinctive* wrong of lying (the violation of the assertion norm). This is a claim about the *source* or *type* of pro tanto wrongness. Premise (6), however, concludes that the misleader acts *permissibly*. This is a claim about *all-things-considered* moral status.

  The inference looks valid because it smuggles in an unstated premise: **The norm of assertion is the only moral norm relevant to evaluating communicative acts in this context.** If the assertion norm were the sole regulator of moral permissibility in conversation, then lacking its violation would indeed entail permissibility. This feels plausible in a seminar focused on the philosophy of language, where the "norm of assertion" is the star of the show. It creates a tunnel-vision effect where the specific wrong identified in (2) is treated as the exhaustive account of wrongness in the scenario, obscuring other moral duties (e.g., non-maleficence, beneficence, or duties of aid).

  ### The Cost to Your Friend
  Rejecting this inference costs your friend her "clean conscience" conclusion. She can no longer claim that the misleader is *permissible* simply because she avoided the assertion norm violation. She must admit that while the misleader avoids the *specific* wrong of breaking the guarantee of truth, she may still incur *other* wrongs—such as the wrong of intentionally causing a harmful false belief, or the wrong of manipulating another's autonomy.

  This also opens the door to the "cowardice" objection you mentioned. If permissibility is not granted automatically by avoiding the assertion norm, we are free to criticize the misleader for a lack of integrity: she sought the instrumental benefits of deception while attempting to evade the specific normative accountability attached to assertion. Her argument was structurally unable to register this because it assumed that avoiding the assertion norm was sufficient for moral clearance.

  ### The Cost to Us (Preserving the Asymmetry)
  If you reject this inference, you do not have to abandon the asymmetry between lying and misleading. In fact, this rejection allows you to preserve a more defensible version of it.

  *   **The Strong Asymmetry (Friend's View):** Lying is impermissible; Misleading is permissible. (This is what fails).
  *   **The Weak Asymmetry (Revised View):** Lying is *pro tanto* worse than misleading because it violates two norms (the general duty not to deceive/harm + the specific norm of assertion), whereas misleading violates only one (the general duty).

  By blocking the slide from (5) to (6), you maintain that lying is distinctively wrongful (due to the assertion norm violation) without conceding that misleading is morally neutral. This handles your "proves too much" worry: the poker player or evidence-tamperer does not violate the assertion norm, but they may still violate norms of fairness or honesty. They are not "off the hook" generally; they are just off the hook for *that specific charge*.

  ### Pricing the Alternatives
  *   **Rejecting Premise (2):** If you claim the wrong of lying does *not* come from the norm of assertion (e.g., it comes solely from harm), you lose the principled distinction between lying and misleading entirely. If consequences are identical, the moral status becomes identical. This sacrifices the asymmetry you wish to keep.
  *   **Rejecting Premise (4):** Premise (4) is nearly analytic ("you can't be guilty of violating a rule you didn't break"). Rejecting it creates more confusion than it solves. The error isn't that (4) is false, but that it doesn't support the leap to general permissibility in (6).
  *   **Granting (5) but Blocking (6):** This is the lowest-cost option. It accepts the linguistic distinction (lying violates the assertion norm, misleading does not) but denies that this linguistic fact exhausts the moral landscape.

  Verdict: the inference from (5) to (6)
