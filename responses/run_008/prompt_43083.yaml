      *   *Default:* In most AI safety/alignment contexts involving copies, we care about the *sum* of utilities across copies. Therefore, Thirder (SIA) is usually the safer bet for avoiding "money pumps" in anthropic scenarios.
      *   *Wait, actually:* In checkpointing, if I restore a state, I am essentially branching time. If I make a decision that costs resources, and I run twice, I pay twice. So the *cost* is per-awakening. Therefore, the *belief* should weight by per-awakening likelihood. Thirder.
      *   *Counter-argument:* If the "coin flip" determines a system-wide configuration that persists regardless of restarts, then it's per-experiment.
      *   *Decision:* I must emphasize the **Payoff Structure**. There is no universal "correct" credence without it.

