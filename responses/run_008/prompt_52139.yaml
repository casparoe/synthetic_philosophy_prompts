answer: |-
  This is a classic debate in welfare economics and moral philosophy. Your friend is channeling Lionel Robbins and the **Logical Positivists** of the 1930s. Their argument is logically tight *if* you accept their premises, but the thermometer analogy hides some crucial assumptions that make those premises weaker than they look.

  Here is the audit of the analogy, where it breaks, and whether the skeptic conclusion survives.

  ### 1. The Map: How the Analogy Works
  Your friend's argument relies on the distinction between **ordinal utility** (ranking options) and **cardinal utility** (measuring intensity). Here is how the thermometer picture maps to the economic reality he's describing:

  *   **Person $\leftrightarrow$ Thermometer:** Each individual is a sealed device.
  *   **Utility (Satisfaction/Well-being) $\leftrightarrow$ Temperature:** The internal physical state being measured.
  *   **Choice/Behavior $\leftrightarrow$ Mercury Height:** The observable output. If I choose A over B, the "mercury" for A is higher than for B.
  *   **Ordinal Ranking $\leftrightarrow$ Monotonicity:** We know that a higher number means "more" utility, just as a higher mercury column means "hotter."
  *   **Interpersonal Comparison $\leftrightarrow$ Comparing Readings:** Saying "Person A's gain > Person B's loss" is like saying "20° on Thermometer A is hotter than 20° on Thermometer B."
  *   **Calibration $\leftrightarrow$ Common Scale:** To compare them, you need a shared zero-point and a shared unit size (like Kelvin). Your friend argues we lack this "social Kelvin."

  **The Conclusion:** Since we can't calibrate the thermometers, any claim that redistribution increases *total* utility is scientifically meaningless. It's just an ethical preference disguised as math.

  ### 2. Where the Mapping Fails (The Disanalogies)
  The thermometer analogy is intuitive because it treats utility like a physical property that exists independently of the observer. But utility is phenomenological (experienced). Here are the three cracks in the glass.

  #### A. The "Shared Hardware" Disanalogy
  *   **Thermometers:** Can be built differently. One uses mercury, one uses alcohol, one uses digital resistance. A 10° rise in one might require 1 joule of energy, in another 10 joules. There is no *a priori* reason to think they are alike.
  *   **Persons:** We are running on roughly the same hardware (human neurobiology). We have the same pain receptors, the same dopamine systems, the same evolutionary drives.
  *   **Why it matters:** With thermometers, assuming they are calibrated is a guess. With humans, assuming they are similar is a **scientific hypothesis supported by evidence**. We know via neuroscience that a pinprick activates similar neural pathways in you and me. We don't need perfect calibration to know the scales aren't *randomly* assigned.
  *   **Impact on Redistribution:** This allows for **Diminishing Marginal Utility (DMU)**. Even if I can't measure your exact happiness, I can assume your utility curve for money looks like mine (concave). The first \$10k keeps you alive; the millionth \$10k buys a slightly nicer watch. Unless your friend argues the rich have fundamentally different nervous systems that extract more "utility units" per dollar than the poor, DMU holds even with "uncalibrated" thermometers.

  #### B. The "Ice Bath" Disanalogy
  *   **Thermometers:** We *could* dunk them in the same ice bath to calibrate them, but we don't.
  *   **Persons:** We *cannot* dunk two minds into the same experience. I can never feel your pain.
  *   **Why it matters:** This is your friend's strongest point. Direct access is impossible. However, we use **proxies** for calibration. We use language ("On a scale of 1-10..."), behavior (screaming vs. wincing), and biology (cortisol levels).
  *   **Impact on Redistribution:** We don't need perfect calibration to make policy. We need *rough* comparability. If a doctor sees two patients, one screaming with a broken leg and one quietly holding a bandaged finger, they triage the broken leg. They don't say, "I can't compare your pain scales, so I'll flip a coin." Society operates on the assumption that rough calibration is possible via empathy and observation.

  #### C. The "Zero Point" Disanalogy
  *   **Thermometers:** Have an absolute zero (absolute zero temperature).
  *   **Persons:** Do we have a "zero utility"? Is it death? Is it a neutral state?
  *   **Why it matters:** Utilitarianism often requires summing total utility. If we can't define zero, we can't sum.
  *   **Impact on Redistribution:** Most redistribution arguments don't rely on summing *total* utility (levels); they rely on comparing *changes* in utility (marginals). You don't need to know where zero is to know that going from 10 to 11 is a smaller jump than going from 1 to 2, provided the scale is consistent *within* the person.

  ### 3. Does the Skeptic Conclusion Survive?
  **No.** The skeptic conclusion ("Redistribution is just yelling preferences") is too strong for the evidence provided.

  Your friend is committing a **fallacy of precision**. He is arguing that because we cannot measure utility *precisely* (like a physicist), we cannot compare it *at all* (like a juror).

  1.  **The "As If" Defense:** Even if interpersonal comparison is metaphysically fuzzy, we must act *as if* it is possible to function. If you see a child crying and a adult smiling, you assume the child's distress outweighs the adult's amusement. If you refuse to make that comparison, you are paralyzed. Policy is just scaled-up triage.
  2.  **The Veil of Ignorance:** You don't need to compare utilities to justify redistribution. You can use a **contractarian** argument (Rawls). If you didn't know if you were rich or poor (the "veil"), would you agree to a tax system? Most people would choose some redistribution to insure against being born poor. This bypasses the need to compare your utility to mine; it relies on *your* rational self-interest regarding *your own* potential utility.
  3.  **The Burden of Proof:** Your friend claims the thermometers are uncalibrated. But the burden of proof is on him to show they are *incommensurable*. Given shared biology, the default assumption should be that we are similar until proven otherwise. If he claims the rich feel a dollar 100x more intensely than the poor, *he* needs the calibrated thermometers to prove that.

  ### 4. The 1930s Ordinalist Revolution (Briefly)
  Your friend is historically correct but practically outdated.
  *   **Then:** In the 1930s, economists (like Robbins) wanted to purge "metaphysics" from economics. They couldn't see utility, so they declared it unscientific to compare it. They shifted economics to **Pareto Improvements** (make someone better off without hurting anyone).
  *   **Now:** Modern **Behavioral Economics** and **Neuroeconomics** have pushed back. We can scan brains. We can measure reported life satisfaction. We treat utility as "cardinal enough" for policy. The strict ordinalist view is now seen as overly cautious—it prevents economics from saying anything about welfare at all.

  ### 5. A Better Analogy: The Hospital Triage
  The thermometer is too passive. A better analogy for the epistemic situation is **Pain Management in an ER.**

  *   **The Situation:** A doctor has two patients. Patient A (rich) says their pain is a 4/10. Patient B (poor) says their pain is a 7/10.
  *   **The Friend's Objection:** "Doctor, you don't know if Patient B's 7 is the same as Patient A's 4. Their pain scales are uncalibrated thermometers. Giving the morphine to B is just you yelling your preference."
  *   **The Reality:** The doctor looks at the wounds. She knows human biology. She knows that a 7 usually correlates with more tissue damage than a 4. She acts on the **probabilistic assumption of shared hardware**.
  *   **The Lesson:** We don't need perfect calibration to make moral triage decisions. We need **reliable proxies**. Wealth is a proxy for marginal utility of money. Neurology is a proxy for suffering. To deny redistribution because of "uncalibrated thermometers" is like the doctor refusing to treat the worse wound because she can't feel the patient's pain herself.

  ### Summary for Your Pushback
  Tell your friend this:
  1.  **The Thermometer Analogy assumes independence.** It assumes my internal scale is randomly assigned relative to yours. But we share biology, which creates a natural calibration.
  2.  **You're confusing Precision with Possibility.** Just because we can't calculate utility to the decimal point doesn't mean we can't tell that a starving person gains more from a sandwich than a satiated person loses from giving it up.
  3.  **The DMU Argument doesn't require IUC.** It only requires that we have similar *shapes* of utility curves. Unless you think the rich are a different species with different neural reward structures, the marginal utility of money declines for them just as it does for the poor.
  4.  **Inaction is also a choice.** Refusing to compare utilities isn't "neutral"; it's a decision to accept the current distribution of utility as the default. That's a value judgment too, not a scientific fact.

  The thermometer picture is a great warning against **arrogance** (thinking we know exactly how happy someone is), but it's a terrible argument for **paralysis** (thinking we know nothing at all).
