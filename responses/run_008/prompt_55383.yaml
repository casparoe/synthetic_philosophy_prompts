          *   *Design Decision:*
              *   Round 2 (Flat Cost): Set cost such that it's *too low* to deter Low types, or *too high* for everyone. Let's make it a "Tax" that everyone pays. If the benefit of being accepted is high enough, both will pay the tax. Result: Pooling persists.
              *   Round 3 (Differential Cost): High types pay low cost, Low types pay high cost. Result: Separation.
