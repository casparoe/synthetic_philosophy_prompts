      *   16 Students. 8 Senders (S), 8 Receivers (R).
      *   Pair them up? Or a market?
      *   *Market is better for signaling.* Senders stand on one side, Receivers on the other.
      *   *Interaction:* Each round, Senders choose Signal/No Signal. Receivers observe aggregate or individual?
