                  *   Round 3: Differential Cost (Cost $C_H < C_L$). This creates the Separating Equilibrium.
              *   *Actually, to make the Zahavi vs. Spence point:* Zahavi emphasizes the *waste* (cost must be high). Spence emphasizes the *difference*.
