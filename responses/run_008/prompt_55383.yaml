      *   Strategies are chosen rationally (mostly), not via selection.
      *   Receiver preferences are fixed (not co-evolving).
      *   No Fisherian Runaway (signal doesn't become attractive *because* it's popular).

  7.  **Addressing the "Bonus Variant":**
