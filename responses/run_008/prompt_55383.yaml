prompt: |-
  I'm a PhD student in evolutionary anthropology and I run the discussion section for an undergrad course on evolution and human behavior -- 16 students, 75 minutes, mixed majors. They've had the game theory basics (payoff matrices, Nash equilibrium, a bit of Hawk-Dove) but nothing on signaling yet. Next week's readings are on honest signaling, and I don't want to just lecture at them about peacock tails and then have them nod along. I want a game they actually play, where the cheap-talk phase collapses in front of them and they run into the need for cost themselves before anyone names the idea. You know how it is -- you can explain separating equilibria until you're blue in the face and it slides off, but if they lost points in round two because they trusted a free signal, they'll remember.

  Act as an expert game theorist who has actually designed and run classroom experiments, and brainstorm a bit before committing to a design. The setup I have in mind (adjust as needed): some students are senders, either genuinely high-quality or low-quality (drawn randomly, private info), and they choose whether to send a signal; receivers see the choice and must accept or reject, with payoffs so that accepting a high-quality sender is good and accepting a low-quality one is bad. Round one should be signaling for free, and it should visibly collapse -- everyone signals high, receivers catch on, information dies. Then here's the part I care most about, and please don't skip it: I want the later rounds to contrast two different cost structures. In one, signaling has a flat cost that everyone pays equally (a pure handicap, cost for its own sake). In the other, the signal is cheaper for high-quality senders than for low-quality ones (cost that's differentially burdensome). If the payoffs are tuned right, the second should produce an honest separating outcome and the first may or may not, and that contrast is the whole pedagogical payload -- because the debrief needs to draw the line between Zahavi's original handicap principle as people usually state it (the cost is the point, waste is the guarantee of honesty) and the Spence/Grafen-style picture where cost just enforces honesty by being correlated with quality. Use candy or points, not real money, and keep the bookkeeping light enough that 16 undergrads can actually run it without me hovering over every scorecard. Please specify rules, materials, role assignments, a round-by-round timeline, and the exact payoff numbers.

  Then the debrief: map specific moments in the game onto the formal ideas -- pooling vs separating, why free signals get ignored, whether the cost was waste or an investment that pays for itself, when receivers should be skeptical. Also give me the honest stuff: what will predictably go wrong the first time I run it (low types signaling anyway out of confusion, receivers coordinating badly, someone gaming my sloppy payoff numbers), and, crucially, what the game cannot reproduce no matter how well it goes -- evolutionary dynamics and frequency dependence, the receiver side coevolving with the signal rather than being a fixed audience, and the Fisherian runaway possibility where the preference itself drags the signal past any usefulness. I'll have to supply those in the debrief and I want to know exactly where the seam is, i.e., which claims I can back with what happened in the room versus which I'm importing on authority. If you can add a short "if time remains" variant where receivers can also pay to inspect the signal, that'd be a nice bonus, but only if it doesn't bloat the 75 minutes.
reasoning: |-
