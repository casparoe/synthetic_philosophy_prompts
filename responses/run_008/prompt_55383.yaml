                  *   Round 2: High Flat Cost. (Zahavi-esque). Only High types can afford it? No, if it's flat, Low types can afford it if the benefit is high enough.
                  *   *Correction:* To get separation, the cost *must* be correlated with quality (Spence/Grafen). A purely flat cost cannot sustain separation if the benefit of acceptance is identical for both types.
                  *   *Strategy:* I will design Round 2 to have a moderate flat cost where *both* still signal (Pooling with waste). Round 3 has differential costs where *only High* signals (Separating). This highlights that cost *per se* isn't the magic; differential burden is.
      *   *Challenge 3: Logistics.* 16 students. 8 Senders, 8 Receivers? Or rotate?
