      *   **Goal:** A playable classroom experiment demonstrating honest signaling, specifically contrasting *pooling* (cheap talk) vs. *separating* (costly signaling).
      *   **Key Pedagogical Payload:** Distinguish between Zahavi's Handicap (cost as waste/guarantee) vs. Spence/Grafen (cost as differential burden/correlation).
      *   **Constraints:** Candy/points (no real money), light bookkeeping, 75 mins total.
      *   **Specific Requirements:**
