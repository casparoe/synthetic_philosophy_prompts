answer: |-
  ### Session Plan: Superrationality for Engineers (25 Minutes)

  #### 1. Scenario Recommendation
  **Verdict:** Replace the apartment cleaning scenario.
  **Reasoning:** While the cleaning scenario meets the structural requirements, it carries high "moral baggage" (chores, cleanliness, being a good neighbor). This invites the Kantian misconception immediately, forcing you to spend precious time disentangling ethics from logic.
  **Replacement:** **"The Distributed Rate-Limit Puzzle."**
  *   **Setup:** 12 independent services access a shared, fragile database. Each service can independently choose to install a throttling patch (cost: 1 hour dev time) or skip it.
  *   **Payoffs:** If all 12 patch, the DB holds, and everyone gets full uptime (High Value). If fewer than 12 patch, the DB crashes under load (Zero Value). If you patch and the DB crashes, you wasted the hour (Negative Value). If you skip and the DB holds, you save the hour (Highest Value).
  *   **Constraints:** One-time deployment, no communication, services are written by engineers using the same architectural guidelines (similarity of reasoners).
  *   **Why this works:** It preserves the required symmetry, one-shot nature, and lack of causal channels, but frames the cost/benefit in technical debt/uptime terms, which aligns with your group's EV intuition without triggering moral heuristics.

  #### 2. Sequence of Explanation
  Do **not** establish the evidential point before the scenario. You must first let them feel the pull of standard rationality.

  1.  **The Setup (0–5 mins):** Present the Rate-Limit scenario. Draw the payoff matrix on the board. Verify everyone agrees on the rankings (Temptation > Reward > Punishment > Sucker). Explicitly state the constraints: *No communication, no future rounds, identical constraints.*
  2.  **The Standard Analysis (5–10 mins):** Walk through the dominant strategy using their existing game-tree skills.
      *   *Ask:* "If you assume your choice has **no effect** on theirs, what is the EV-maximizing move?"
      *   *Result:* Defect (Skip the patch).
      *   *Outcome:* Everyone defects, DB crashes. Everyone agrees this is suboptimal.
  3.  **The Superrational Pivot (10–15 mins):** Introduce Hofstadter's move.
      *   *The Claim:* In a symmetric situation with similar reasoners, your decision is **evidence** of their decision. You are not running an isolated algorithm; you are running an instance of a reasoning pattern that exists in 12 places.
      *   *The Calculation:* Re-evaluate EV not as $P(\text{They Cooperate} | \text{I Defect})$, but as $P(\text{They Cooperate} \iff \text{I Cooperate})$.
      *   *Result:* Cooperation becomes the EV-maximizing move.
  4.  **Scope & Boundaries (15–20 mins):** Define what this is not (see Section 4).
  5.  **Diagnostic & Close (20–25 mins):** The question and wrap-up.

  #### 3. Misconception Interception Plan
  You must head these off *proactively* at specific moments, not in a Q&A at the end.

  *   **Misconception 1: "This is just Kant's Categorical Imperative."**
      *   **When to intercept:** Immediately after Step 3 (The Pivot), before moving to boundaries.
      *   **How to head it off:** Explicitly contrast the *motivation*. Say: "Kant says 'Cooperate because it is your duty.' Superrationality says 'Cooperate because it maximizes your expected utility.' The action is the same, but the math is different. If the payoffs changed so that defection benefited everyone, superrationality would demand defection. Kant might not."
  *   **Misconception 2: "This assumes my choice causally controls theirs."**
      *   **When to intercept:** During Step 3, when explaining the "evidence" link.
      *   **How to head it off:** Use the "Common Cause" analogy. Say: "I am not sending a signal. Think of us as 12 calculators running the same code with the same input. If Calculator A outputs 'Cooperate,' Calculator B likely will too. Calculator A didn't *cause* B's output; the shared algorithm did. Your reasoning process is the common cause."
  *   **Misconception 3: "This only works for clones/identical copies."**
      *   **When to intercept:** During Step 4 (Boundaries). This is the "leakage" objection.
      *   **How to head it off:** Frame it as a **confidence slider**, not a binary switch. Say: "Superrationality scales with the probability of similarity. If you are 90% sure the others reason like you, you weight the cooperative EV by 0.9. It doesn't require perfect identity, only sufficient correlation to tip the EV calculation. If you know they are irrational, the correlation breaks, and you defect."

  #### 4. Scope Boundaries (What to Refuse)
  To stay within 25 minutes, explicitly state you are **not** covering:
  1.  **Newcomb's Problem:** Acknowledge it exists but state, "We are not solving the paradox of prediction today; we are applying a heuristic to symmetric multiplayer games."
  2.  **EDT vs. CDT Foundations:** Do not dive into the formal war between Evidential and Causal Decision Theory. Frame superrationality as a "pragmatic patch" for standard game theory in symmetric cases, not a full replacement of decision theory.
  3.  **Repeated Games:** Remind them that if this were an iterated game, Tit-for-Tat would apply. Superrationality is specifically for the *one-shot* case where reputation is impossible.

  #### 5. Diagnostic Question
  End with this question to test if they understand the *evidential* link versus mere *altruism*:

  > **"If a trustworthy oracle told you right now that the other 11 engineers have already decided to defect, does superrationality still require you to patch?"**

  *   **Correct Answer:** **No.** (Because the correlation is broken; your choice is no longer evidence of theirs).
  *   **What this reveals:** If they answer "Yes," they have internalized it as a moral duty (Kant) or magic (Causality). If they answer "No," they understand that the force of the argument relies entirely on the *correlation of reasoning*, which vanishes once the other choices are fixed facts.
