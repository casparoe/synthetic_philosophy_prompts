prompt: |-
  I could use some help turning a vaguely worded county policy into something a committee can actually use. I was just appointed to our county's environmental health advisory commission — I'm a retired high school biology teacher, which makes me the de facto science person on a board of otherwise interested laypeople — and the timing is awkward. Last month, after a huge public fight, the board of supervisors added the precautionary principle to the county's general plan. The resolution says roughly that when an activity raises a threat of harm to human health or the environment, the county should take precautionary measures even if some cause-and-effect relationships aren't fully established scientifically, and that the proponent of the activity bears the burden of showing it's safe rather than the public bearing the burden of proving harm. Sounds reasonable enough, but in our first two meetings the principle got invoked in opposite directions on the same agenda item: parents want the school district's planned artificial turf fields blocked until the recycled-tire crumb rubber infill is proven safe, while the vector control district says that NOT running their larvicide program this spring would itself be a failure of precaution, because inaction isn't the absence of risk, it's just a different risk. Both sides sincerely believe they are the precautionary ones, and I couldn't articulate why both of them can't be.

  What I need is a decision procedure the commission can actually run on a proposal, written for people like us: questions to ask in a fixed order, what counts as a sufficient answer to each question, which answers stop the procedure with a no, and which questions aren't really factual at all and have to get handed back to the elected board because they're value judgments we shouldn't be laundering as science. It has to cope with some specific hard cases. First, situations like the mosquito one, where both acting and refraining carry risk — does the precautionary principle just cancel out there, or is there a principled way through? Second, worries like the turf one, where the concern isn't an acute identified harm but chronic low-level exposure to a mixture nobody has fully characterized, which seems like exactly the situation the resolution was written for and also the situation where demanding proof of safety means nothing ever gets approved. Third, our real constraints: about ninety minutes per agenda item, most of the commission can't evaluate a toxicology study, and everything we produce goes to county counsel before it goes anywhere, so it can't read like philosophy.

  Please build the procedure, tell me honestly where it will misfire or where a determined advocate could game it, and then run it on the two live items — the larvicide program and the turf fields. One more thing, and I mean it: I've said publicly that I think the turf is fine, my grandkids play on fields like it already, and my instinct is that the crumb rubber panic is overblown. If the procedure comes out the other way on that one, say so plainly rather than building in an escape hatch for me. Better I hear it from you now than from an angry parent at a public meeting in April.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Retired high school biology teacher, new member of a County Environmental Health Advisory Commission. De facto science expert among laypeople.
      *   **Context:** County Board of Supervisors recently adopted the "Precautionary Principle" (PP) into the General Plan after public controversy.
      *   **Problem:** The PP is being invoked oppositely on the same issue (Action vs. Inaction). Parents want to block artificial turf (crumb rubber) until proven safe. Vector Control wants to run larvicide to prevent disease, claiming inaction is risky.
      *   **Need:** A practical, step-by-step decision procedure (flowchart/checklist style) for the commission to use.
      *   **Constraints:**
          *   90 minutes per agenda item.
          *   Lay audience (can't read complex toxicology).
          *   Legal review (County Counsel) required (can't be philosophical).
          *   Must distinguish science from value judgments (kick values back to elected board).
          *   Must handle "Risk vs. Risk" (Mosquitoes) and "Chronic/Uncertain Exposure" (Turf).
          *   **Crucial Honesty Check:** The user personally believes the turf is fine. If the procedure says "block it," they want to know that plainly, not have the procedure rigged to match their bias.

  2.  **Deconstruct the Precautionary Principle (PP):**
      *   *Core Tenet 1:* Threat of harm triggers action.
      *   *Core Tenet 2:* Scientific uncertainty does not postpone measures.
      *   *Core Tenet 3:* Burden of proof lies with the proponent of the activity.
      *   *The Conflict:* PP is often criticized for paralysis (nothing is 100% safe) or inconsistency (is preventing mosquitoes more precautionary than preventing chemical exposure?).
      *   *The Solution:* The procedure needs to operationalize "Threat," "Uncertainty," and "Burden of Proof" without requiring PhD-level analysis. It needs to explicitly address *alternatives* (the core of resolving Risk vs. Risk).

  3.  **Drafting the Decision Procedure (The "PP Filter"):**
      *   *Goal:* A 5-7 step checklist.
      *   *Step 1: Threshold.* Is there a plausible threat? (Filters out frivolous claims).
      *   *Step 2: Uncertainty.* Is the science settled? (If yes, use standard risk assessment. If no, PP applies).
      *   *Step 3: Burden of Proof.* Who is proposing? Do they have *enough* data to shift the burden back? (Not "proof of safety" which is impossible, but "reasonable certainty of no harm" or "risk management").
      *   *Step 4: Alternatives Analysis (The Risk vs. Risk Resolver).* This is key for the mosquito issue. Is there a less risky way to achieve the goal?
      *   *Step 5: Proportionality.* Does the precautionary measure match the threat?
      *   *Step 6: Value Judgment Check.* If the trade-off is "Economic Cost vs. Hypothetical Health Risk," that's for the Supervisors, not the Commission.

  4.  **Refining the Procedure for Constraints:**
      *   *Time:* Keep questions binary or tri-state where possible.
      *   *Expertise:* Rely on "Weight of Evidence" rather than single studies. Use existing authoritative bodies (EPA, State Dept of Public Health) as proxies for deep toxicology review.
      *   *Legal:* Frame recommendations as "Findings of Fact" regarding risk/uncertainty, leaving "Policy Decisions" to the Board.

  5.  **Addressing the "Honesty Check" (Turf):**
      *   I need to run the procedure objectively. Current scientific consensus (California EPA, federal agencies) generally says crumb rubber is low risk, *but* the PP shifts the burden. If the burden is "prove it's safe," and the data is "we haven't found harm yet but haven't studied long-term mixing," a strict PP application might actually recommend restriction or monitoring, not outright approval. I must not bias the tool to save the user's reputation. I need to show where the tension lies.

  6.  **Developing the "Risk vs. Risk" Logic (Mosquitoes):**
      *   PP doesn't mean "do nothing." It means "choose the path with the least *uncertain* severe harm."
      *   If Disease Risk is High/Certain and Chemical Risk is Low/Uncertain -> Act.
      *   If Disease Risk is Low/Uncertain and Chemical Risk is High/Uncertain -> Don't Act.
      *   The procedure must force a comparison of the *status quo* risk vs. the *proposed action* risk.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Validate the user's position.
      *   **The Procedure (The "Precautionary Screening Tool"):**
          *   Step 1: Plausibility (Is the worry scientifically grounded?).
          *   Step 2: Uncertainty Status (Is there genuine scientific debate?).
          *   Step 3: Burden Discharge (Has the proponent met the minimum bar?).
          *   Step 4: Comparative Risk (The Mosquito Fix).
          *   Step 5: Mitigation (Can we reduce risk without banning?).
          *   Step 6: The Value Wall (What goes to the Board).
      *   **Weaknesses/Gaming:** Where advocates will push (cherry-picking studies, redefining "plausible").
      *   **Application - Mosquito Larvicide:**
          *   Threat: West Nile/Encephalitis (High consequence).
          *   Uncertainty: Low (larvicides are well studied).
          *   Alternative: Let them breed? (Higher risk).
          *   Outcome: PP supports action *with* monitoring.
      *   **Application - Artificial Turf:**
          *   Threat: Chemical exposure (Low probability, high public fear).
          *   Uncertainty: High (mixtures, long-term).
          *   Burden: Proponent (School/Installer) likely cannot prove "zero risk."
          *   Comparative Risk: Heat injury? Injuries on natural grass?
          *   Outcome: *Here is the hard part.* Strict PP suggests pausing or requiring safer infill. I need to be honest. If the policy says "proponent bears burden of showing safe," and the science says "we don't know for sure," the procedure should recommend *conditional approval* or *further review*, not a blanket "it's fine." I will advise the user that the tool might suggest a moratorium until specific data is provided, contradicting their personal view.

  8.  **Review against Constraints:**
      *   *90 Minutes?* Yes, the steps are discussion prompts.
      *   *Laypeople?* Yes, relies on "Authoritative Consensus" rather than raw data.
      *   *Legal?* Yes, distinguishes Fact (Commission) from Policy (Board).
      *   *Honesty?* Yes, the Turf outcome will reflect the strictness of the PP.

  9.  **Final Polish:**
      *   Tone: Professional, collegial, pragmatic.
      *   Formatting: Clear headings, bullet points for the procedure.
      *   Specific attention to the "Value Wall" – ensuring the commission doesn't overstep.

  **(Self-Correction during drafting):** I initially thought about suggesting a "Risk Matrix." But laypeople are bad at matrices. Better to use a "Comparative Question" approach. Also, I need to make sure I don't tell the commission to *decide* the turf issue, but to *recommend* based on the burden of proof. If the burden isn't met, the recommendation is "Do not proceed until burden is met." That might annoy the user, but it's the honest output of the tool. I will explicitly flag this in the Turf section.

  10. **Final check on the "Honesty" requirement:** The user said: "If the procedure comes out the other way on that one, say so plainly." I must ensure the Turf analysis doesn't fudge the "Burden of Proof" step. If the PP requires the proponent to prove safety, and current science says "no evidence of harm" (which is not the same as "evidence of no harm"), a strict PP reading blocks it. I will explain this distinction clearly.

