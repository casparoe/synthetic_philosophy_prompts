      *   **Ishiguro's *The Remains of the Day*:** Stevens, an English butler. Obsessed with "dignity." Serves Lord Darlington (who turns out to be a Nazi sympathizer/appeaser). Suppresses emotions (father's death, Miss Kenton's love). Narrates in retrospect (1956), traveling to meet Miss Kenton.
      *   **The Intersection:** Professionalism as a moral shield. "I just did my job."

  3.  **Drafting the Argument - Section by Section:**

