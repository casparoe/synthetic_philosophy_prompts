  # DECISION TREE: RESOLVING THE PARADOXES

  **STARTING POINT:** You accept that in a fair million-ticket lottery, it is rational to believe of each individual ticket that it will lose. You also accept that a diligent author is rational to believe her book contains at least one error.

  ---

  ### NODE 1: THRESHOLD STABILITY
  **Cases:** One-in-a-Billion Lottery; 70% Rain Forecast.

  **Question:** You said you believe a 1-in-1,000,000 ticket will lose. Imagine a **one-in-a-billion lottery**. Do you still believe that ticket will lose? Now consider a **70% rain forecast**. Based *only* on that forecast, do you believe it will rain?

  *   **A.** "I believe the billion-ticket loses, but I don't believe it will rain on a 70% forecast. Whether I believe something depends on the stakes or the situation, not just a fixed probability number."
      *   → **LEAF 1: No Fixed High Probability Suffices for Belief.** (Contextualism/Interest-Relative Invariantism)
  *   **B.** "I believe the billion-ticket loses, but not the rain. There is a fixed probability cutoff (e.g., 95%) where belief kicks in, regardless of the situation."
      *   → Go to **NODE 2**.

  ---

  ### NODE 2: AGGREGATION (CLOSURE)
  **Case:** Safety Inspector.

  **Question:** A **safety inspector** has certified each valve on a pipeline individually and believes each one will hold. Does she thereby believe the *whole system* will run a year without failure?

  *   **A.** "She believes each valve will hold, but she does *not* believe the whole system will hold."
      *   → **LEAF 2: Keeps the Threshold But Denies Conjunction Commitment.** (Denial of Closure/Aggregation)
  *   **B.** "Yes, if she believes each valve will hold, she believes the whole system will hold."
      *   → Go to **NODE 3**.

  ---

  ### NODE 3: EVIDENCE TYPE
  **Case:** Safety Inspector vs. Lottery.

  **Question:** Is the inspector's reason for believing the system will hold (aggregating individual physical checks) the *same kind of reason* you have for believing the lottery ticket will lose (mathematical odds)?

  *   **A.** "No. Checking physical parts is different from calculating statistical odds. The lottery and the book/pipeline cases come apart."
      *   → **LEAF 3: Lottery and Preface Cases Come Apart Because of Evidence Kind.** (Evidentialism)
  *   **B.** "Yes. Both are just cases of high probability. The reason is the same."
      *   → Go to **NODE 4**.

  ---

  ### NODE 4: ATTITUDE STRENGTH & CONSISTENCY
  **Case:** Single-Ticket Bet on a Fair Coin.

  **Question:** If you believe every ticket loses, you believe something impossible (since one must win). Is your mind holding contradictory beliefs? Or is your attitude toward the ticket weaker than full belief—like how you would refuse a **single-ticket bet on a fair coin** landing heads because you don't truly *believe* it will?

  *   **A.** "It's not full belief. It's a weaker attitude (acceptance/reliance). I wouldn't bet my life on it."
      *   → **LEAF 4: Splits Belief from Weaker Attitude.** (Acceptance/Assertion View)
  *   **B.** "Yes, I accept that my beliefs are jointly inconsistent. I believe each loses, even though I know they can't all lose."
      *   → **LEAF 5: Rational Beliefs Can Be Jointly Inconsistent.** (Dialetheism/Inconsistency View)

  ---

  # HOUSEKEEPING & DIAGNOSTICS

  ### 1. Inseparable Leaves
  **Flagged Pair:** *No Fixed High Probability Suffices for Belief* (Leaf 1) and *Lottery and Preface Cases Come Apart Because of Evidence Kind* (Leaf 3).

  **Diagnosis:** While the tree separates these procedurally (Node 1 vs. Node 3), they may collapse in practice. A student who answers "It depends on the situation" at Node 1 often motivates that answer by citing the difference between statistical evidence (Lottery) and empirical evidence (Rain/Inspector). Conversely, a student who cites "Evidence Kind" at Node 3 often implies that the "situation" of statistical evidence lowers the effective threshold for belief compared to empirical evidence. Unless the student explicitly distinguishes *contextual stakes* (Node 1) from *evidential genealogy* (Node 3), their responses may map to the same underlying intuition despite landing on different leaves. The 70% Rain case attempts to isolate probability from stakes, but students frequently conflate "low probability" with "insufficient evidence type."

  ### 2. Unoccupied Combinations
  **Unoccupied Path:** Node 1 (B) + Node 2 (B) + Node 3 (B) + [Denies Inconsistency AND Denies Acceptance].

  **Diagnosis:** This combination is **incoherent**. If a student maintains a fixed probability threshold (1B), affirms closure (Inspector System), and equates the evidence types (Lottery = Inspector), they are committed to believing the conjunction of all lottery propositions. Since the conjunction contradicts the lottery setup (one ticket must win), they must either accept the inconsistency (Leaf 5) or downgrade the attitude to something weaker than belief (Leaf 4). There is no logical space to maintain full belief in the conjunction while denying the inconsistency.
