      Let's assemble.
answer: |-
  Here is a complete lesson plan for **"The Careenium Protocol."** It is designed to be robust, fit within 90 minutes, and directly target the levels-of-description puzzle without requiring prior reading.

  ### **Lesson Overview**
  *   **Topic:** Levels of Description & Downward Causation (Hofstadter's Careenium).
  *   **Time:** 90 Minutes.
  *   **Students:** 14 (Upper-level Cog Sci/Phil).
  *   **Materials:** Masking tape (for floor grid), 4 colored vests or sheets of paper (Simmballs), 8 index cards with arrows drawn on them (Bumpers), 2 clipboards (Observers).
  *   **Handout:** One page (text provided below).

  ---

  ### **Part 1: The Handout (Print this)**

  **THE CAREENIUM PROTOCOL**
  **1. ROLES**
  *   **SIMMBALLS (4 Students):** You are mass in motion. You carry no information. You do not think. You move only when the Clock calls "TICK."
  *   **BUMPERs (8 Students):** You are fixed geometry. Stand on your designated grid square. Hold your Arrow Card facing a direction. You never move your feet. If a Simmball enters your square, you dictate their next move based *only* on your Arrow.
  *   **OBSERVERS (2 Students):** You are external physicists. You do not interact. You record the (x,y) coordinates of all Simmballs at every TICK. You look for patterns.
  *   **CLOCKMASTER (1 Student):** Calls "TICK" every 5 seconds. Enforces silence.
  *   **RESERVE (5 Students):** Watch for rule violations.

  **2. PHYSICS (THE RULES)**
  1.  **Discrete Time:** Movement happens *only* on "TICK." Between TICKs, freeze.
  2.  **Movement:** Simmballs move exactly one grid square per TICK.
  3.  **Collision:** If a Simmball moves into a square occupied by a Bumper, they stop in that square.
  4.  **Deflection:** On the *next* TICK, a Simmball in a Bumper's square must move in the direction of the Bumper's Arrow.
  5.  **Ball-Ball Collision:** If two Simmballs try to enter the same square, they bounce back to their previous squares (swap back).
  6.  **Silence:** No talking. No eye contact. You are particles, not agents.

  **3. THE GRID (5x5)**
  *   **INPUT ZONES:** (0,0) and (0,4) [Top Corners]
  *   **OUTPUT ZONE:** (4,2) [Bottom Center]
  *   **BUMPER LAYOUT:** (Instructor will place Bumpers physically; do not ask why).

  ---

  ### **Part 2: Instructor Setup & Script**

  #### **Phase 1: The Blind Run (0:00 – 0:35)**
  1.  **Setup (10 mins):** Tape a 5x5 grid on the floor. Place 8 "Bumper" students in a specific funnel pattern (see *Technical Note* below). Give 4 "Simmball" students vests. Give Observers clipboards.
  2.  **Briefing (5 mins):** Distribute the handout. Read the "Physics" rules aloud. Emphasize: *"You are not deciding. You are transducing energy. If you break a rule, the physics of this universe breaks."*
  3.  **Execution (15 mins):**
      *   Place 2 Simmballs at Input Left, 2 at Input Right.
      *   Clockmaster calls "TICK."
      *   The Bumper geometry should funnel all 4 balls into the single Output Zone at the bottom.
      *   Observers write down coordinates.
      *   **Crucial:** Do not tell them what is being computed. Let them feel the determinism.
  4.  **The Reveal (5 mins):** Ask Observers: "What happened?" They will say, "Four balls ended up in the bottom."
      *   Write on board: **2 + 2 = 4**.
      *   Ask: "Did the number 4 push those balls? Or did the bumpers?"

  #### **Phase 2: The Intervention Puzzle (0:35 – 0:60)**
  1.  **The Challenge:** Tell the class: *"The User wants the machine to compute 2 + 3 = 5."*
  2.  **Constraint:** The Observers (now "Users") can issue commands, but they are split into two teams:
      *   **Team Symbol:** Can only write equations or abstract goals on the board (e.g., "Add One," "Multiply"). They cannot touch the grid.
      *   **Team Substrate:** Can physically move Bumpers or add Simmballs, but they *cannot* look at the board. They only listen to the Clockmaster.
  3.  **The Conflict:**
      *   Team Symbol writes "ADD 1 BALL." Nothing happens (balls don't read).
      *   Team Substrate waits for a physical command.
      *   They must realize that to change the *symbolic output* (5), they must change the *substrate state* (add a physical student-ball).
      *   **Second Challenge:** "Compute 2 × 2."
      *   Team Symbol writes "2 × 2."
      *   Team Substrate must realize they have to *rearrange the bumpers* to change the geometry from an Adder to a Multiplier (or simply acknowledge they can't without a blueprint).
  4.  **Goal:** Force them to feel the frustration that *talking about the computation does not move the particles.*

  #### **Phase 3: The Debrief (0:60 – 0:90)**
  1.  **Map the Levels:**
      *   **Substrate:** Legs, tape, index cards, sound waves (TICK).
      *   **Symbol:** "Addition," "Four," "Input/Output."
  2.  **The Causal Question:**
      *   Ask: "When the ball turned right at Bumper C3, was it because of the *arrow* (physical) or because it was part of the *sum* (symbolic)?"
      *   Push the "Downward Causation" trap: "If I told you 'This is an Adder,' did that change how you walked?" (No). "So is 'Adder' real?"
  3.  **Address the Homunculus (Your Worry):**
      *   *See "Instructor Notes" below for the script on this.*
  4.  **Connect to Hofstadter:** Explain the Careenium. The "Self" or "Mind" is the pattern, not the balls.

  ---

  ### **Technical Note: Bumper Layout (The "Adder")**
  To ensure the computation works without complex logic:
  *   **Grid:** 5x5.
  *   **Inputs:** (0,0) and (0,4).
  *   **Output:** (4,2).
  *   **Bumpers:** Place students at (1,1), (1,3), (2,2), (3,1), (3,3).
  *   **Arrows:** All arrows should point generally "Down" and "Inward."
      *   (1,1) Arrow: Down-Right.
      *   (1,3) Arrow: Down-Left.
      *   (2,2) Arrow: Down.
      *   (3,1) Arrow: Down-Right.
      *   (3,3) Arrow: Down-Left.
  *   **Result:** Balls bounce off the sides and funnel into the center column, landing at (4,2).
  *   **Why:** It looks like a "calculation" (convergence) but is purely geometric reflection.

  ---

  ### **Instructor Notes: Predictable Failures & Patches**

  **1. The "Agentive Drift" Problem**
  *   **Failure:** Simmballs will try to "help" a collision resolve, or Bumpers will rotate their bodies to make it easier for the ball.
  *   **Patch:** The **Clockmaster** is your enforcer. If a student moves off-tick, call "NULL TICK." Everyone freezes. Reset the violator. This reinforces the "dumb physics" constraint.
  *   **Script:** *"You are not helping the ball. You are the wall. If the wall moves, the experiment is invalid."*

  **2. The "Bored Bumper" Problem**
  *   **Failure:** Bumpers stand still for 20 minutes and check out.
  *   **Patch:** Give Bumpers **State Cards**.
      *   *Side A:* Arrow Points Left.
      *   *Side B:* Arrow Points Right.
      *   *Rule:* "Every time a ball hits you, flip your card."
      *   *Effect:* This turns the Bumpers into **Flip-Flops (Memory)**. Now the table "remembers" how many balls passed. This makes the "Symbol" level much richer (it's now a Counter, not just a funnel) and keeps Bumpers engaged. *Recommendation: Use this if the group is quick.*

  **3. The "Homunculus" Worry (Your specific concern)**
  *   **The Worry:** Human students have minds. They understand the rules. A real simmball doesn't. Doesn't this rig the analogy?
  *   **The Patch:** Do not hide this. **Weaponize it in the debrief.**
  *   **Debrief Script:** *"You felt it, didn't you? You knew you were 'adding.' But the rule on your handout didn't say 'Add.' It said 'Move Down-Right.' The 'Addition' existed only in my head (the Designer) and your head (the Observer). The Simmball's legs were the substrate. The 'Math' was the pattern. Hofstadter's point is that 'You' are the pattern, not the legs. The fact that you have a mind inside the simmball is a bug in the simulation, but it helps us see where the 'meaning' is located. It's not in the muscle; it's in the constraint."*

  **4. The "Symbol Intervention" Failure**
  *   **Failure:** Students might think shouting "Add one!" counts as a causal intervention.
  *   **Patch:** Pre-announce that **Sound Waves do not move Simmballs.** Only physical contact (moving a bumper/ball) moves Simmballs. This forces the distinction: Symbolic requests must be *compiled* into Substrate changes to have effect.

