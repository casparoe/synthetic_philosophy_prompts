  Subject: Lyell, Crawford Lake, and the Anthropocene mess

  Hey,

  It's a wild thought experiment to drag Sir Charles Lyell out of 1830s London and drop him into the Anthropocene Working Group meetings just as they were finalizing the Crawford Lake proposal, but I've been turning it over in my head and I think I can actually take a hard line on how he would have cast his vote. If you force me to choose, I'm confident Lyell would have voted against the Crawford Lake proposal, specifically opposing the selection of the 1950s plutonium spike as the Golden Spike, and he would have done so primarily because that specific marker smells too much like the catastrophism he spent his entire career trying to bury. I know it seems counterintuitive because Lyell was the guy who literally invented the habit of chopping up deep time based on biotic turnover, counting mollusc percentages to define the Eocene and Pliocene, so you'd think he'd love a crisp, global stratigraphic boundary. But you have to remember that for Lyell, the method of subdivision was always subordinate to the principle of uniformitarianism. He wanted boundaries that reflected gradual shifts in the Earth's operating system, not sudden violent interruptions. The plutonium spike from the atomic bomb tests is the ultimate catastrophic event; it is a singular, explosive moment that violates the idea that the present is the key to the past because there is no gradual process leading up to it in the rock record, just a sudden chemical shock. Lyell would look at that core and see a geological revolution, and he hated revolutions. He argued in the Principles of Geology that we shouldn't invoke causes that aren't currently acting in nature to explain the past, and while humans are currently acting, the scale and speed of the nuclear signal mimic the very cataclysms he fought against when he was debunking Cuvier and the diluvialists. He would likely argue that formalizing a boundary based on a mid-twentieth-century explosion institutionalizes the exception rather than the rule, turning geology into a record of human accidents rather than Earth processes.

  Now, where I have to admit we are guessing a bit is in how he would weigh the permanence of the signal. Lyell was cautious about naming units before the rock record had fully settled, literally and figuratively. He might have argued that the sediment at Crawford Lake hasn't undergone enough lithification to prove this signal isn't just a temporary blip that future erosion will scrub out, whereas the mollusc changes he used were backed by millions of years of stability. However, I don't think that's the main reason he'd vote no; I think it's the philosophical violation of gradualism. He would probably have pushed for an earlier boundary, maybe something closer to the onset of the Industrial Revolution or even the 1610 Orbis Spike, not because those dates are morally better, but because they represent a ramping up of carbon and erosion rates that looks more like a process and less like an event. He wanted geology to be about the slow grinding of forces, and the 1950s spike is too sharp, too violent, and too reliant on a technology that hopefully won't be repeated. If the Anthropocene is defined by a bomb blast, it validates the catastrophist view that Earth's history is punctuated by sudden disasters, which was the exact intellectual enemy he dedicated his life to defeating.

  On the deeper question of who gets to decide, I think Lyell would be much less ambiguous and probably quite unpopular in a modern interdisciplinary committee. He would firmly assert that the definition of a stratigraphic unit is purely a geological question and therefore solely the domain of geologists. In the Principles, he treats human history as a subset of natural history, acknowledging that humans modify the surface through deforestation and agriculture, but he never suggests that historians or sociologists have a vote on how the rock record is classified. To Lyell, the Golden Spike is a tool for correlation, a physical pin in the sediment that allows scientists across the world to sync their clocks. Whether that sediment was caused by indigenous land management, colonial expansion, or industrial capitalism is relevant to the cause, but not to the stratigraphic definition. I suspect he would view the involvement of historians or indigenous groups in the voting process as a category error. He might respect their knowledge of local landscape changes, much as he respected local observations of erosion, but he would draw a hard line at letting non-geologists define the boundaries of geological time. He believed in the authority of empirical observation of the earth itself, not the social narratives surrounding it. So while he might concede that the Anthropocene is defined by what humans did to the planet, he would insist that the boundary itself must be found in the mud and the isotopes, not in the archives of human culture.

  This puts him in a fascinatingly awkward position relative to the actual 2024 vote where the proposal was rejected. The real-world rejection was partly because the International Union of Geological Sciences felt the proposal was too narrow and excluded too many other signals, but Lyell's rejection would have been more fundamental. He wouldn't just say the boundary is too narrow; he would say the logic is flawed. He would argue that by picking 1950, the working group was prioritizing a human historical date over a geological process. It's ironic because Lyell is often credited with laying the groundwork for deep time that allows us to even conceive of the Anthropocene, but his methodological commitment to gradualism makes him a natural skeptic of the Great Acceleration narrative when it's codified as a stratigraphic unit. He would likely tell the group that if the human impact is real and geological, it should show up as a sustained shift in sedimentation rates or chemical weathering over centuries, not a single layer of fallout. He'd say wait until the dust settles, literally, and let the slow forces of deposition validate the change before we carve it into the time scale.

  So to summarize where I'm deducing versus guessing: I'm deducing his opposition to the 1950s spike from his lifelong war against catastrophism and his preference for process-based boundaries found in the Principles of Geology. That part feels solid because it's the core of his scientific identity. I'm guessing a bit on how he'd handle the politics of the working group, though given his status as a Victorian elite and a lawyer by training, I feel safe betting he'd be a procedural stickler who wants experts to decide expert questions. He wouldn't hedge on the authority of the geologist. He'd likely tell the climate scientists and historians that their data is valuable context, but the Golden Spike belongs to the stratigraphers. In the end, I think he'd vote no on Crawford Lake, not because he denies human impact—he was actually quite interested in how humans alter landscapes—but because he wouldn't want to define a geological epoch based on what looks like a geological accident. He'd want the Earth to speak for itself through slow accumulation, not through the sudden scream of a nuclear detonation. It's a tough stance because it might look like denialism to us, but for Lyell, it would be about protecting the integrity of uniformitarianism from being swallowed by the very catastrophes he sought to explain away.

