answer: |-
  Right, let's dissect your uncle's favourite maxim. It is a remarkably durable piece of rhetoric, precisely because it sounds like common sense but actually smuggles in a whole lot of assumptions. To understand why it shuts down conversation with Katharina but falls apart when your tech friend mentions China, we need to separate the different logical claims hiding inside that one sentence.

  Here is a menu of interpretations, ranging from the semantically trivial to the politically absolute. For each, I have assessed its truth value, whether it actually supports your uncle's dismissal of privacy concerns, and whether it commits him to accepting the Chinese model.

  ### 1. The Semantic Tautology
  *   **The Claim:** The word 'hide' is defined as 'concealing wrongdoing'. Therefore, if you are not doing wrong, you are not 'hiding' anything by definition. Privacy is just 'normalcy'.
  *   **Plausibility:** **False.** This is a linguistic trick. In standard usage, 'hiding' simply means keeping something from view. We hide birthday presents, surprise parties, and bank PINs without any implication of crime.
  *   **Does it end the argument?** **No.** If you point out that you hide your password not because you are a criminal but because you want security, the slogan loses its grip. It does not justify dismissing Katharina's concerns about Street View, as she isn't hiding crimes; she is hiding her daily routine.
  *   **The China Problem:** This reading doesn't really engage with state power, so it doesn't commit your uncle to anything regarding China. It's too weak to do any heavy lifting.

  ### 2. The Legal Innocence Shield
  *   **The Claim:** Surveillance systems are perfect filters. They only flag illegal activity. If you are law-abiding, the system ignores you completely. You are invisible unless you break the rules.
  *   **Plausibility:** **False.** Systems produce false positives. Data gets breached. Context is lost (e.g., buying a knife for cooking vs. buying a knife for harm). Being 'innocent' does not guarantee you won't be misidentified or caught in a data leak.
  *   **Does it end the argument?** **Yes, but only if trusted.** This supports your uncle's view *if* he assumes Google and the US government are infallible. It allows him to call Katharina paranoid. However, it relies on the assumption that the watcher never makes mistakes.
  *   **The China Problem:** **Yes, it commits him.** If this claim were true, the Chinese Social Credit system would be harmless to your uncle. Since he opposes that, he implicitly admits this reading is false. He believes *who* is watching matters, not just *what* you've done.

  ### 3. The Irrelevance Claim
  *   **The Claim:** Privacy has no value for innocent people. The only reason to want privacy is to conceal something shameful or illegal. Therefore, wanting privacy is itself suspicious.
  *   **Plausibility:** **False.** Privacy protects dignity, intimacy, and security, not just secrecy. We close the door to use the loo not because it's illegal, but because it's private. We don't want our medical records public not because we are criminals, but because it's personal.
  *   **Does it end the argument?** **Yes, effectively.** This is the most common conversational use. It shifts the burden of proof onto the privacy advocate. It implies Katharina is being odd or suspicious by caring about Street View. It frames privacy as a privilege for the guilty rather than a right for everyone.
  *   **The China Problem:** **Yes, it commits him.** If privacy is only for hiding wrongdoing, then a state that monitors everything to find wrongdoing is doing nothing wrong. Your uncle would have to admit China is fine provided they only punish actual crimes (which, again, he wouldn't).

  ### 4. The Benevolent Authority Assumption
  *   **The Claim:** The entity doing the watching (Google, the State) is benevolent and will never misuse the data. They are on your side.
  *   **Plausibility:** **Contingent.** It depends entirely on trust. It is not a fact about privacy, but a fact about your trust in institutions.
  *   **Does it end the argument?** **Yes, for the believer.** This explains the transatlantic divide. Your uncle trusts US corporations and institutions more than Katharina trusts them. It allows him to say, "Google isn't going to hurt me," rendering her concerns moot.
  *   **The China Problem:** **No, this saves him.** This is the escape hatch. Your uncle likely believes the 'nothing to hide' slogan applies to *his* government/corporations, but not the CCP. He assumes Western authorities are benevolent and Chinese authorities are not. The slogan ignores this distinction, but the user usually implies it.

  ### 5. The Moral Duty
  *   **The Claim:** You *ought* to live your life as if you are always being watched. Transparency is a virtue; privacy is a vice.
  *   **Plausibility:** **Normative, not factual.** This isn't a claim about how the world works, but how people should behave.
  *   **Does it end the argument?** **Yes, by shaming.** It turns Katharina's caution into a moral failing. It suggests she is trying to carve out a space where she doesn't have to be accountable.
  *   **The China Problem:** **Yes, it commits him.** If transparency is a universal virtue, then the Chinese system is morally superior for enforcing it. Your uncle would have to argue that transparency is only virtuous when done voluntarily in the West, which complicates the slogan significantly.

  ---

  ### So, what is your uncle actually thinking?

  When people repeat this line, they are rarely making a logical argument about data protection law. They are usually operating on a mix of **Interpretation 3 (Irrelevance)** and **Interpretation 4 (Benevolent Authority)**, underpinned by a heuristic about convenience.

  Psychologically, the slogan is a **risk-dismissal mechanism**. It allows your uncle to avoid the cognitive load of worrying about data breaches, identity theft, or mission creep. By categorising privacy as a concern only for criminals, he frees himself from the responsibility of protecting his own data.

  Crucially, regarding your tech friend's point about China: your uncle is almost certainly relying on **Interpretation 4** without realising it. He assumes the slogan applies within a specific context of liberal democracy where institutions are (mostly) trustworthy. He does not believe the slogan applies universally; he believes it applies to *him*, in *Ohio*, under *American* oversight.

  When he uses it to end the conversation with you, he is not making a philosophical claim about human rights. He is saying: *"I trust the people watching me not to hurt me, and I find your concern inconvenient."*

  ### Summary for your next discussion

  If you want to press him without lecturing him on rights, you don't need to defend privacy. You just need to expose the **Benevolent Authority Assumption**.

  You might say: *"Uncle, if 'nothing to hide' is true, then you should be fine with the Chinese government having all your data, provided you haven't committed a crime. If you aren't fine with that, then you admit it's not about having something to hide; it's about who is doing the looking. So why do you trust Google more than Katharina trusts them?"*

  That usually forces them to admit that the slogan is less about their own innocence and more about their trust in the watcher. And that is a much more honest conversation to have.
