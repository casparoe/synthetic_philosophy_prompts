prompt: |-
  I run a small decision theory podcast and next week's guest is a philosopher who's spent his career defending causal decision theory, and he's one of those people who genuinely bites the bullet on Parfit's hitchhiker: he says once you're standing safely at the edge of the desert, paying the driver is irrational, full stop, and the "solution" is to precommit beforehand if you can. Draft me eight to ten interview questions for him. I don't want softballs where he just restates CDT -- each question should press on something real in his position, and each should come with a follow-up keyed to the answer I can expect him to give.

  Things I'd love covered: why "rational irrationality" isn't just a contradiction in terms (or maybe why he'd reject that framing); whether the fact that a genuinely irrational person gets predicted as trustworthy shows that rationality is hurting you in a way that matters; whether an agent who can see its own decision in advance (he likes to say the hitchhiker already knows what they'll do before the driver does) can still be said to be "causally independent" of the payoff in the way CDT needs; and whether there's a principled line between "you were irrational not to precommit" and "your rationality has a structural design flaw," since he tends to wave at that distinction without argument.

  One more thing: he's famous on the panel circuit for deflecting the precommitment stuff with a joke about how he'd have no problem being a person who pays -- he just wouldn't be one when it counts. At least one question should make that joke harder to hide behind, ideally by asking him point blank whether he'd raise a child or build an AI on his theory. Keep the total under 450 words please, since I print these in the show notes, and write in American English (my co-editor is picky about that). No need for anything fancy, just a plain numbered list I can read from in the studio.
