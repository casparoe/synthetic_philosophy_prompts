      *   *Topic 4: Precommitment vs. Design Flaw.*
          *   Q: Where's the principled line between "failed to precommit" and "structural design flaw"?
          *   Follow-up: If the flaw is predictable, why isn't it just a bug in the theory?
      *   *Topic 5: Raising Child/AI.*
          *   Q: Would you raise a child or build an AI to follow CDT strictly?
          *   Follow-up: If not, why recommend it for adults?
      *   *Topic 6: The Joke.*
          *   Q: You joke you'd be a payer, just not when it counts. Isn't that admitting the theory fails at the moment of truth?
