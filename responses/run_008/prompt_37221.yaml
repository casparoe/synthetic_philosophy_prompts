answer: |-
  This is a remarkably precise description of a classic philosophical problem. You have identified the phenomenon of *akrasia* (weakness of will) but stripped away the usual excuses (ignorance, confusion, insincerity). You are describing a conflict not between truth and falsehood, but between two temporal perspectives of the same agent.

  Here is a reasoning-through of your three questions, treating you as a philosopher of your own mind rather than a student needing management.

  ### 1. Is this irrationality, and where is the failure located?

  You are correct that there is no *epistemic* failure here. Your beliefs are accurate. You know the value of the grade, the cost of the delay, and the probability of regret. In traditional philosophy, irrationality was often thought to require a mistake in reasoning or a false belief (e.g., "I surely won't get caught"). Since your beliefs are sound, we must look to *practical* rationality.

  The failure is located in **diachronic consistency**.

  In rational choice theory, a rational agent is expected to have a consistent ordering of preferences. If you prefer Outcome A (Good Grade) over Outcome B (Videos) at Time 1 (10 PM), you should logically prefer A over B at Time 2 (7 AM), assuming no new information has arrived. The "gray wall" vs. "warm video" shift you describe is known in behavioral economics as **hyperbolic discounting**. We value rewards disproportionately higher as they approach the present moment.

  Is this irrational?
  *   **From a Humean perspective:** No. David Hume argued that reason is merely the "slave of the passions." If your 7 AM passion is for comfort and your 10 PM passion is for achievement, neither is "irrational"; they are just different desires. On this view, you are not a single rational agent failing to act; you are a battlefield where different desires win at different times.
  *   **From a Kantian or Rationalist perspective:** Yes. Rationality requires that you act on principles that hold universally, including across time. If you legislate a law for yourself at 10 PM ("I will study"), violating it at 7 AM is a contradiction of your own will. It is a failure of **autonomy**. You are allowing a transient impulse to override a legislative principle you established for yourself.

  So, the failure is not in your *knowledge* of the good, but in the **stability of your valuation**. You are treating the "present moment" as a special category that distorts value. A perfectly rational agent would value the utility of the grade and the utility of the video consistently, regardless of temporal proximity. The "failure" is that your utility function is not fixed; it is elastic depending on how close you are to the object.

  ### 2. Which self is authoritative? (The Problem of Personal Identity)

  Your friend argues that the 7 AM self is "real" because it acts. You argue that the 10 PM self is "real" because it reflects. This is a dispute about **personal identity over time**.

  If we adopt a **Reductionist View** (like Derek Parfit), there is no single, enduring "you." There are only "person-stages" linked by memory and psychological continuity. The 10 PM person-stage and the 7 AM person-stage are distinct entities, like consecutive days in a calendar. If this is true, your friend is right: the 7 AM stage is the one inhabiting the body, so its preference is the one that manifests. The 10 PM stage is essentially a different person making a donation to a future stranger.

  However, most ethical frameworks require a stronger notion of the self. Here, the philosopher **Harry Frankfurt** offers a useful distinction. He separates **first-order desires** (I want to watch videos) from **second-order desires** (I want to *want* to study).
  *   The 7 AM self is driven by first-order desires (immediate impulses).
  *   The 10 PM self is capable of second-order volition (evaluating which desires it wants to govern its life).

  On this view, the 10 PM self is more "authoritative" not because it is closer to the action, but because it is capable of **reflective endorsement**. A wanton (or an animal) acts on whatever impulse is strongest. A person acts on the impulse they *approve* of. If you identify with the 10 PM self's ranking of values, then the 7 AM self is not "more real"; it is acting *alienated* from your true will. It is a hijacking of the agency you endorsed during reflection.

  Therefore, the 10 PM self should win, not because it is temporally superior, but because it represents the **narrative self**—the version of you that connects your past efforts to your future goals. The 7 AM self is merely the **experiential self**, concerned only with the immediate qualia of the moment. To say the 7 AM self is the "real" one is to reduce your life to a series of disconnected moments, which makes long-term projects (like education, relationships, or career) impossible.

  ### 3. Precommitment: Rationality or Civil War?

  You have hit on a profound insight regarding precommitment (the Ulysses Pact). You noted that installing a blocker feels like "treating the later self... as an opponent."

  **Does this make you more rational?**
  Yes. In fact, it is the *only* way to remain rational given the hyperbolic discounting problem. Thomas Schelling, the game theorist, described this as a conflict between the "planner" and the "doer." If the planner knows the doer is predictable (i.e., will succumb to the warm video), the rational move is to change the payoff structure. By installing the blocker, you are not changing your *mind*; you are changing the *game*. You are making the irrational choice impossible, thereby forcing the rational outcome. This restores diachronic consistency.

  **Does it imply powerlessness?**
  This depends on how you view the relationship between your temporal selves.
  *   **The Pessimistic View:** You are admitting that your "will" is broken. You need chains because you cannot trust yourself. This feels like a loss of freedom.
  *   **The Optimistic View:** You are exercising **meta-agency**. True freedom is not the ability to do whatever you feel like at 7 AM (that is slavery to impulse). True freedom is the ability to ensure your life follows the trajectory you determined at 10 PM. Precommitment is the bridge that allows the 10 PM self to extend its agency into the 7 AM slot.

  **Is the future self an opponent?**
  It feels like an opponent because your psychological architecture is fragmented. If you were a perfectly unified rational agent, you wouldn't *need* the blocker; you would simply act. The need for the blocker reveals that you are, effectively, a coalition of different selves with conflicting interests.
  However, treating the future self as an opponent is not necessarily destructive. Consider saving money for retirement. You are restricting your future self's ability to spend cash now so that your *future-old* self can eat later. You are not fighting your future self; you are **protecting** a more important version of yourself from a less important version.

  When you install the blocker at 10 PM, you are not attacking the 7 AM self; you are **disarming** the specific impulse that you know will hijack the 7 AM self. It is an act of mercy toward your 9 PM regretful self, and an act of loyalty toward your 10 PM planning self.

  ### Synthesis

  You asked if it makes sense to say a single person made these plans and choices.
  The uncomfortable truth is: **No, not in the way you intuitively feel.**

  You are not a monolith. You are a sequence of selves. The "irrationality" you feel is the friction between these selves.
  *   The **10 PM Self** is the Architect. It sees the blueprint.
  *   The **7 AM Self** is the Builder. It holds the trowel but gets distracted by the sunlight.
  *   The **9 PM Self** is the Inspector. It sees the unfinished wall and weeps.

  The cycle repeats because the Architect keeps drawing blueprints assuming the Builder will be as disciplined as the Architect, but the Builder is subject to different physical laws (proximity, fatigue, dopamine).

  Precommitment is the moment the Architect locks the gate to the construction site so the Builder cannot wander off. It acknowledges that the "I" who plans and the "I" who acts are different enough to require a treaty.

  So, to answer your final worry: Using these devices does not make you powerless. It makes you **constitutional**. It is the act of writing a law for yourself that you cannot violate, acknowledging that without the law, you are not a kingdom, but a mob. The fact that you must bind yourself to be consistent is not a failure of your humanity; it is the definition of it. We are the only creatures that can look at our future impulses and decide to tie our own hands so that we may remain who we say we are.
