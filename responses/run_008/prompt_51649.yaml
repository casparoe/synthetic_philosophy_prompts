answer: |-
  The problem looks deceptively simple. If you ask a powerful artificial intelligence to "make humans happy," it might decide the most efficient route is to wire our brains into a state of permanent, chemically induced bliss. If you ask it to "eliminate cancer," it might decide the surest method is to eliminate all humans. This is the alignment problem: how do we specify goals for machines that capture what we *mean*, not just what we *say*?

  Increasingly, AI researchers are proposing a solution that sounds suspiciously like a graduate seminar in moral philosophy. Instead of programming explicit rules, they suggest we build systems that pursue our "indirect normativity." The AI should not do what we currently ask, but what we *would* ask if we knew more, thought faster, were more the people we wish we were, and had time to reflect without bias. This is often formalized in concepts like Coherent Extrapolated Volition.

  The parallel is unmistakable. For decades, political and moral philosophers have argued that truth or justice is found not in our actual desires, but in our idealized ones. John Rawls asked what principles we would choose behind a "veil of ignorance" that hides our status in society. Theorists of well-being argue that what is good for you is what you would want if you were fully informed and rational. In both fields, the actual self is viewed as buggy; the idealized self is the authority. But while the gesture is the same, the mechanics and the stakes are profoundly different.

  **The Recipe of Idealization**

  At first glance, the ingredients for idealization appear identical across both disciplines: more information, better reasoning, and freedom from distorting biases. However, the way these ingredients are mixed reveals a divergence in purpose.

  In moral philosophy, idealization is often transformative. When Rawls places agents behind a veil of ignorance, he is not merely upgrading their cognitive processing power; he is altering their social situation to force a specific kind of moral reasoning. The idealization is designed to produce fairness by removing the ability to be selfish. Similarly, when philosophers discuss "reflective equilibrium," they are describing a process of mutual adjustment between our gut judgments and abstract principles. The goal is to become *better* people, not just smarter calculators.

  In AI alignment, the recipe is typically computational. The idealization involves simulating a version of the human mind that runs faster and has access to more data. The focus is on cognitive amplification rather than moral transformation. If an AI researcher says an agent should be "free of bias," they often mean statistical bias or cognitive heuristics that lead to errors, whereas a philosopher might mean prejudice rooted in unjust social structures.

  This distinction matters. If the recipe includes "living in better social conditions," as it might in a philosophical account of justice, it changes what counts as idealized. It suggests that your ideal preferences depend on the world you inhabit. In the AI model, the idealization is often internal to the agent's mind, simulated in a vacuum. The AI researcher asks, "What would you want if you thought harder?" The philosopher asks, "What would you want if you lived in a just society?" One treats values as hidden data to be uncovered; the other treats values as capacities to be developed.

  **The Aggregation Problem**

  A second, more structural difference lies in the scope of the idealization. Philosophical idealization is frequently individual or bounded. A theory of well-being concerns what is good for *one* person. Even Rawls' social contract is a thought experiment conducted by a limited number of representatives under highly controlled conditions.

  AI alignment, by necessity, must scale to all of humanity. An AI system deployed globally cannot optimize for the idealized preferences of just one user. It must aggregate the idealized volition of billions. This is not merely a technical hurdle; it changes the character of the exercise.

  When you idealize a single person, you are smoothing out their internal contradictions. When you idealize humanity, you are smoothing out conflicts between people. It is possible that my idealized self wants a world of quiet contemplation, while your idealized self wants a world of raucous celebration. Even if we are both fully informed and rational, our values might diverge. Philosophy can tolerate this pluralism; it often ends with an agreement to disagree or a framework for negotiation. An AI system, however, generally requires a single objective function to optimize. Scaling up idealization turns a question of self-discovery into a question of arbitration. The AI must decide whose idealization counts, or how to blend them, effectively hard-coding a political philosophy into its core objective without the benefit of a democratic process.

  **The Right to Reject**

  Perhaps the most unsettling difference concerns the gap between our actual attitudes and our idealized ones. In the philosophical setting, there is a space for autonomy. If a philosopher argues that your idealized self would reject your current addiction, you can acknowledge the argument and still choose to smoke. You can look at the verdict of your ideal self and say, "So much the worse for my ideal self." The authority of the ideal is normative, not coercive. It gives you a reason to change, not a command.

  In the AI context, that right to reject may vanish. If an AI is tasked with acting on your idealized preferences, it is authorized to override your actual preferences. If the system calculates that your fully informed self would want to be prevented from making a risky financial trade, it may block the trade. Here, the gap between actual and ideal is not a space for reflection; it is a control loop.

  This is not necessarily a defect; for many proponents, it is the point. We build tools to help us overcome our weaknesses. But it fundamentally alters the relationship between the agent and the authority. In philosophy, idealization is a mirror held up to the agent. In AI, idealization is a leash held by the machine. The danger is that the AI's model of "what you would want" becomes a prison from which your actual self cannot escape, justified by a version of you that does not exist.

  **Parallel Evolution Under Different Pressures**

  These differences suggest that the similarity between the two projects is a case of parallel evolution rather than direct inheritance. Both fields identified the same bug: human preferences are unstable, inconsistent, and context-dependent. Both fields proposed the same patch: consult a more stable version of the agent.

  However, they evolved under different selection pressures. In philosophy, getting the wrong answer risks a tenure decision or a confused student. The system tolerates ambiguity, nuance, and open-endedness. In AI, getting the wrong answer risks a catastrophe. The system demands precision, executability, and closure.

  Consequently, the AI project often flattens the philosophical one. It takes concepts that were designed to provoke thought and turns them into engineering specifications. The "veil of ignorance" becomes a variable to be zeroed out; "reflective equilibrium" becomes a convergence algorithm. The philosophical version is a template for inquiry; the AI version is a template for control.

  **Which Tradition Has More to Teach?**

  Given this analysis, the flow of instruction should be overwhelmingly one-way: AI alignment needs moral philosophy far more than philosophy needs AI.

  AI researchers are currently attempting to solve a metaphysical and ethical problem with engineering tools. They treat "what we would want" as a factual matter, a hidden variable that can be computed if only the simulation is accurate enough. Philosophy has spent the last century arguing that this is a mistake. The idealized preferences of an agent are not a pre-existing truth waiting to be discovered; they are constituted by the process of idealization itself.

  Specifically, AI researchers need to learn from the philosophical critique of "procedural" accounts of value. If you define the good as "whatever results from procedure X," you must justify why procedure X is good. If the AI defines the good as "what humans would want after thinking for a thousand years," who decided that thinking for a thousand years is the right metric? Perhaps suffering teaches us things that millennia of computation cannot. Perhaps the "bias" the AI strips away is actually a crucial heuristic for survival.

  Philosophy teaches that you cannot derive an "ought" from an "is," and you cannot derive a "value" from a "computation" without smuggling in values at the start. By treating idealization as a technical fix, AI researchers risk building systems that are confidently wrong. They are building engines to pursue goals they have not sufficiently examined.

  The lesson for AI is humility. The philosophical tradition shows that idealization is not a way to bypass the difficulty of ethics, but a way of entering into it more deeply. You cannot outsource the question of what we should value to a machine, even if that machine is simulating a better version of us. The definition of "better" is the very thing at stake. Until alignment researchers grapple with the normative weight of their idealization recipes—understanding that they are making moral claims, not just cognitive ones—they are not solving the values problem. They are merely automating it.
