answer: |-
  This is a classic formulation of the Grounding Objection, sharpened by your student's Thomist commitments. Your instinct is correct: the argument is valid, but its soundness hinges entirely on how much metaphysical baggage you load into Premise (7) and how consistently you apply the "eternity" move in the parallel case.

  Here is the precise breakdown you need to give your Molinist student, along with an analysis of where your Thomist student is potentially smuggling in inconsistencies.

  ### 1. The Critical Pivot: Premise (7)
  The standard Molinist response is to **reject Premise (7)** (or the strong version of Premise (3) that entails it).

  *   **The Move:** Deny *Truthmaker Maximalism* for contingent propositions. Argue that while some truths require ontological grounds (e.g., "The cat is on the mat"), counterfactuals of creaturely freedom (CCFs) are *sui generis*. They are true, but not "made true" by any existing state of affairs in the way categorical propositions are.
  *   **The Cost:** You must abandon the intuition that "truth supervenes on being." You are admitting brute contingent truths.
  *   **The Defense:** Alvin Plantinga's strategy. CCFs are true in virtue of the *essence* of the possible creature, not an existing state of affairs. Since essences exist in the Divine Intellect eternally, they aren't "nothing," but they don't ground the truth via causal efficacy.
  *   **Why this answers your worry:** If you reject (7), the "Proves Too Much" objection regarding Peter's denial loses its bite *if* you treat future contingents similarly. However, most Molinists want to keep grounding for actual future events (since they will exist) while denying it for CCFs (since the world never exists).

  ### 2. The "Proves Too Much" Trap (Where your Thomist student slips)
  Your suspicion that the argument proves too much is well-founded, but it depends on whether your Thomist student is a **Classical Thomist** or a **Libertarian Thomist**.

  *   **If Classical Thomist:** They believe God's knowledge is the *cause* of things. For them, Premise (5) is false regarding Peter. God *does* ground the truth of "Peter will deny Christ" via His decree (or permissive will). Thus, the parallel fails. They don't have a grounding problem for foreknowledge because they don't have libertarian freedom in the Molinist sense.
  *   **If Libertarian Thomist (The "Shrug" Position):** If your student insists Peter acts freely (libertarian) *and* that the truth is grounded in God's timeless eternity without a determining decree, they are vulnerable.
      *   **The Slip:** They claim the *future event* grounds the truth because it is "present" to God in eternity.
      *   **The Molinist Counter:** If "being present to God in eternity" is sufficient for grounding truth, why can't the *possible world* containing Curley be "present to God in eternity" in a way that grounds the CCF?
      *   **The Disanalogy:** The Thomist will say the future event *will be actual*, whereas Curley's world *never is actual*.
      *   **The Cost for the Molinist:** To block this, the Molinist must argue that **Divine Ideas** have sufficient ontological weight to ground truth, even without actualization. This pushes the Molinist toward a robust Realism about Possibilia (grounded in God's essence).

  ### 3. The Aseity Objection (The Student's Second Prong)
  Your student's addendum—that brute truths wreck Divine Aseity—is arguably the stronger objection.

  *   **The Argument:** If CCFs are true independently of God's will, God is dependent on something outside Himself for His knowledge. He is a "consumer" of truth rather than the "source."
  *   **The Molinist Defense:** Distinguish between **independence from God's Will** and **independence from God's Essence**.
      *   CCFs are not "outside" God; they are features of God's own intellect comprehending possible essences.
      *   They are not "given" to God from the outside; they are constitutive of His omniscience. God doesn't "learn" them; He knows them by knowing His own power and the essences He can create.
  *   **The Cost:** This requires a very specific doctrine of Divine Ideas. If the essences of creatures are distinct from God's essence (even conceptually), you risk a form of Platonism that compromises Aseity. If they are identical to God's essence, you risk making the creatures' actions necessary (necessitarianism).

  ### Recommendation for Your Molinist Student
  Tell her to focus her dissertation on **modifying Premise (4)** rather than flatly rejecting (7).

  1.  **Don't admit "Floating Truths":** Rejecting (7) outright looks like desperation. Instead, argue that the **Divine Intellect itself** provides the ground.
  2.  **The Ground is God's Comprehension:** The truth of "Curley would take the bribe" is grounded in the *relation* between God's omnipotence and Curley's essence as comprehended by God. It is not grounded in Curley (who doesn't exist) nor in God's Will (which would determine it), but in **God's Knowledge of Possibles**.
  3.  **Address the Aseity Worry:** Argue that these truths are not "external constraints" on God. They are internal to the Divine Life. God is not "stuck" with them; rather, they are the natural expression of what it means for God to know Himself as imitable by creatures.

  ### Summary of the Slip
  The slip in your Thomist student's "Proves Too Much" analogy is this: **He treats the future as ontologically robust (in eternity) but treats possibilia as ontologically thin.**

  If he grants that the future grounds truth because it is "real to God," the Molinist can demand to know why a possible world, which is also "real to God" (as an object of Divine Knowledge), cannot ground a CCF. If the Thomist says "Because the future *will be* actual," he is begging the question against the Molinist, who claims God knows what *would* be actual *before* deciding what *will* be actual.

  **Verdict:** Reject the strong version of (7), but replace it with a **Divine Idea Grounding Theory**. The cost is a heavy commitment to the ontological status of Divine Ideas, but that is a price Molinism was always going to have to pay.
