answer: |-
  Your skepticism is mathematically well-founded. Your friend is citing **Condorcet's Jury Theorem (CJT)**, published by the Marquis de Condorcet in 1785. While her summary of the theorem's *conclusion* is correct, her application of it to the hiring committee ignores the theorem's most fragile and critical assumption: **statistical independence.**

  Here is a precise assessment of where the mathematics stops applying, what the failure implies for the committee's accuracy, and how the process could be structurally altered to recover some of the lost mathematical benefit.

  ### 1. The Theorem and the Violated Assumption

  Condorcet's Jury Theorem states that for a binary decision (Hire/No-Hire), if:
  1.  Each voter has a probability $p > 0.5$ of choosing the correct option.
  2.  Voters decide **independently** of one another.

  Then the probability that the majority vote is correct increases with the number of voters ($N$) and approaches 1 (certainty) as $N \to \infty$.

  Your description of the committee highlights a systematic violation of condition #2. In the language of signal detection theory, the interviewers are not generating independent "private signals" about the candidate's quality. Instead, they are all observing a dominant **common signal** (the same resume packet, the same training, the same cultural rubric) plus a small amount of private noise (their specific interaction with the candidate).

  When voters share a common signal, their errors become **correlated**. If the common signal is misleading (e.g., the resume looks great but the candidate is incompetent, or the rubric values "polish" over "skill"), all interviewers are likely to be misled in the same direction.

  ### 2. What Follows When Independence Fails?

  Does this make majority voting worthless? No. But it fundamentally breaks your friend's argument that adding members drives reliability toward *certainty*.

  **The Asymptotic Ceiling**
  In the presence of correlation, the probability of a correct majority decision does not converge to 1. It converges to a limit strictly less than 1, determined by the strength of the common signal.
  *   **Independent Case:** Adding members reduces variance. With enough members, random individual errors cancel out.
  *   **Correlated Case:** Adding members reduces variance only up to the point where the "common error" dominates. Once $N$ is large enough, you are essentially measuring the accuracy of the *common signal* (the rubric/training), not the wisdom of the crowd.

  **Effective Sample Size**
  We can quantify this loss using the concept of *effective sample size*. If the correlation coefficient between any two interviewers' judgments is $\rho$, the effective number of independent judges ($N_{eff}$) in a panel of size $N$ is approximately:

  $$N_{eff} \approx \frac{N}{1 + (N-1)\rho}$$

  *   If $\rho = 0$ (Independence): $N_{eff} = N$. (Going from 5 to 9 members nearly doubles your statistical power).
  *   If $\rho = 0.5$ (Moderate Correlation):
      *   For $N=5$: $N_{eff} \approx 5 / (1 + 2) = 1.67$.
      *   For $N=9$: $N_{eff} \approx 9 / (1 + 4) = 1.8$.
      *   **Result:** Increasing the panel size by 80% (5 to 9) yields only a ~7% increase in effective statistical power.
  *   If $\rho \to 1$ (High Correlation): $N_{eff} \to 1$. The panel behaves like a single person.

  Given your description (shared materials, shared training, shared history), $\rho$ is likely high. Your friend's plan to expand the panel from 5 to 9 is likely an inefficient use of resources; it incurs the cost of four extra interviews for negligible gain in decision reliability.

  **The Competence Problem ($p < 0.5$)**
  There is a second, more dangerous possibility. CJT requires $p > 0.5$. This means the interviewers must be better than random at predicting *actual job success*.
  You noted cases where the panel was "unanimous and confident, yet the hire turned out badly." If the shared rubric emphasizes traits that do not correlate with performance (e.g., confidence over competence), the panel's $p$ relative to *true quality* might be $< 0.5$.
  *   If $p < 0.5$ and votes are independent, adding voters makes the group *worse* (converging to 100% wrong).
  *   If $p < 0.5$ and votes are correlated, the group simply reinforces the systemic error.

  ### 3. Can the Process Be Fixed?

  You asked what can be done to get closer to what the result requires. To harness the power of Condorcet's theorem, you must engineer **conditional independence**. You need to decorrelate the errors. Here are specific structural changes that address the math, not just "culture":

  **A. Partition the Information (Siloing)**
  Currently, everyone reads the "same packet." This creates a common signal.
  *   **Fix:** Split the candidate's portfolio. Interviewer A sees the resume and work history. Interviewer B sees code samples or work products without the resume. Interviewer C sees only the transcript or references.
  *   **Mathematical Effect:** This forces interviewers to form priors based on different data subsets, reducing $\rho$.

  **B. Partition the Evaluation Criteria (Specialization)**
  Currently, everyone asks "Is this person a good hire?" using the same rubric.
  *   **Fix:** Assign orthogonal competencies. Interviewer 1 evaluates *coding ability*. Interviewer 2 evaluates *system design*. Interviewer 3 evaluates *collaboration style*.
  *   **Mathematical Effect:** This converts the vote from a redundant check on the same signal into a multi-dimensional integration. Errors in judging coding skill are likely independent of errors in judging collaboration. This lowers correlation and effectively increases $p$ by ensuring experts judge what they know best.

  **C. Sequential vs. Simultaneous Reporting**
  Even if they interview separately, if they know they are on a "panel," they may anticipate group norms.
  *   **Fix:** Require written scores and binary recommendations to be submitted *before* any debrief meeting occurs. If they discuss the candidate before voting, herding behavior kicks in, and independence collapses to zero.
  *   **Mathematical Effect:** Prevents "information cascades" where later voters ignore their private signal to match early voters.

  **D. Weighted Voting Based on Track Record**
  CJT assumes equal competence ($p$ is the same for all). In reality, some interviewers are better predictors than others.
  *   **Fix:** Track interviewer accuracy (correlation between their "Hire" recommendation and the new hire's performance review 1 year later). Weight the votes of high-accuracy interviewers more heavily.
  *   **Mathematical Effect:** This optimizes the aggregation rule. If you have heterogeneous competence, simple majority vote is suboptimal; a weighted sum maximizes accuracy.

  ### 4. Summary Assessment

  Your friend is correct about the theorem but incorrect about its applicability.

  1.  **Is the appeal sound?** No. The **independence assumption** is violated due to shared inputs and training.
  2.  **What follows?** Majority voting is likely still better than a single judge (provided $p > 0.5$), but the reliability **will not climb toward certainty**. It will hit a ceiling determined by the quality of the shared rubric. Expanding from 5 to 9 members yields **diminishing returns** proportional to the correlation coefficient; if correlation is high, the expansion is mathematically wasteful.
  3.  **What can be done?** To make the math work, the company must **reduce the correlation coefficient ($\rho$)**. This is achieved by siloing information, specializing evaluation criteria, and enforcing blind voting before discussion. Without these structural changes, adding more interviewers just adds more people making the same systematic mistake with higher confidence.
