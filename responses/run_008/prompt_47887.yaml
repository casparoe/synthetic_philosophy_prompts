  The single design decision that does the heavy lifting is enforcing a Sequential Pairwise Voting procedure in the first round where the Chair exclusively sets the ballot order, contrasted against a Plurality Vote in the second, built upon a preference profile engineered to contain a Condorcet Cycle.

  ### The Preference Profile
  You need 14 voters divided into three blocks. Print these rankings on cards and distribute them randomly, but ensure the counts are exact. Do not reveal the distribution to the group.

  *   **Block A (6 people):** Story 1 > Story 2 > Story 5 > Story 3 > Story 4
  *   **Block B (5 people):** Story 2 > Story 5 > Story 3 > Story 4 > Story 1
  *   **Block C (3 people):** Story 3 > Story 5 > Story 4 > Story 1 > Story 2

  **The Math:**
  *   **Plurality Winner:** Story 1 (6 first-place votes).
  *   **The Cycle:** Story 1 beats Story 2 (9-5); Story 2 beats Story 3 (11-3); Story 3 beats Story 1 (8-6).
  *   **The Chair's Weapon (Story 5):** Story 5 beats Story 1 (8-6) and Story 3 (11-3), but loses to Story 2 (11-3).
  *   **Robustness:** The 11-3 margins are safe from pettiness. The 8-6 margins (Story 3 vs 1, Story 5 vs 1) are vulnerable to two defectors. If your group is contentious, swap one person from Block C to Block B to make the Story 3 vs 1 margin 9-5, but this tightens the Story 5 vs 1 margin. Stick to the above for the best narrative tension.

  ### The Roles
  *   **The Voters (14 people):** They receive the preference cards above. They are told these cards represent their "critical reception" of the excerpts they just read. They must vote according to the card, not their personal taste. This isolates the procedure from personal bias.
  *   **The Chair (You):** You hold the Agenda. You do not vote except to break ties (which shouldn't happen). Your instruction is to run the votes in this exact order:
      1.  Story 1 vs Story 2
      2.  Winner vs Story 3
      3.  Winner vs Story 4
      4.  Winner vs Story 5
  *   **The Observer (Optional):** If your retired math teacher is trustworthy, give them a clipboard to tally votes publicly. This lends legitimacy and keeps them occupied so they don't interrupt the flow.

  ### The Session Flow (120 Minutes)
  1.  **Reading (30 mins):** Distribute the five excerpts.
  2.  **Distribution (5 mins):** Hand out the preference cards secretly. Emphasize: "This card is your vote. Do not share it. Do not change it."
  3.  **Round 1: The Jury Procedure (30 mins):** Announce this is the official decision mechanism. Run the sequential pairwise vote exactly as scripted. Story 5 will win. Announce Story 5 as the winner. Let the silence hang for ten seconds.
  4.  **Round 2: The Popular Vote (15 mins):** Say, "Let's check if this result is robust. Everyone vote for your single favorite story." Story 1 will win comfortably.
  5.  **The Debrief (40 mins):** Do not mention Arrow yet. Ask:
      *   "Did anyone force their preference on the group?" (Establishes Non-dictatorship).
      *   "Did everyone vote honestly?" (Establishes Unrestricted Domain/Truthfulness).
      *   "In Round 1, did the group prefer Story 1 over Story 3?" (Yes, 9-5). "So why did Story 3 eliminate Story 1?" (Because of the order).
      *   "If we removed Story 4, does the winner change?" (No). "If we removed Story 2?" (Yes, Story 1 would have faced Story 3 later).
      *   "Which rule of fairness did we just break?"
  6.  **The Reveal (10 mins):** Explain that this is not a glitch but a mathematical feature. Name Condorcet and Arrow. Explain that no voting system can satisfy all fairness conditions simultaneously.
  7.  **Actual Prize Vote (Remaining time):** Run a separate, honest vote for the actual website feature to ensure no hard feelings.

  ### What This Cannot Reproduce
  You cannot simulate the *universality* of the theorem. Your group will feel this specific paradox, not the proof that *all* systems fail under *all* conditions. They will leave thinking "Sequential voting is flawed," not "All aggregation is flawed." To capture the novel's theme, you must write the characters realizing that the flaw isn't the Chair's malice, but the impossibility of the task itself. The game proves manipulation is *possible*; the theorem proves it is *unavoidable* under certain conditions. Do not let your characters confuse the two.

  ### Predictable Failures
  1.  **The Math Teacher:** They will recognize the Condorcet Cycle by the second pairwise vote. Do not try to hide it. If they speak up, ask them to hold their insight until the debrief. If they can't, enlist them as the Tally Keeper. Their visible confusion when Story 5 wins is better than their silence.
  2.  **Strategic Voting:** If participants suspect Round 2 determines the real prize, they will vote strategically in Round 1 (e.g., Block A voters might vote for Story 2 to stop Story 5). This actually *helps* your novel research. It replicates the "gaming the system" tension your characters face. If this happens, pause and ask: "Why did you vote against your card?" Record their justification. That is the dialogue you need for the draft.
  3.  **The 8-6 Margin Collapse:** If two people in Block C decide they actually prefer Story 1 over Story 3 (contrary to their card), the cycle breaks and Story 1 wins Round 1. If this happens, do not fudge the numbers. Announce that the "magic trick failed" and debrief on why the profile was fragile. That failure is also data: it shows how precarious manufactured consent is.

  ### Mapping the Debrief to Arrow
  When you guide the argument about which condition to sacrifice, use these translations:
  *   **Non-dictatorship:** "Did I, as Chair, tell you how to vote?" (No).
  *   **Pareto Efficiency:** "If everyone preferred Story 1 over Story 4, should Story 4 ever win?" (No).
  *   **Independence of Irrelevant Alternatives (IIA):** "Did the presence of Story 4 change the outcome between Story 1 and Story 5?" (Technically no, but the *order* involving Story 4 consumed time/attention. Better example: Did the existence of Story 2 change the winner between 1 and 5? Yes, because 2 eliminated 1).
  *   **Unrestricted Domain:** "Were you allowed to have any preference order?" (Yes).

  The argument you want for your scene emerges when they realize they must keep one condition and drop another. If they keep Fairness (Pareto) and Freedom (Unrestricted Domain), they must accept that the Chair (Dictator) or the Order (IIA violation) decides. That moment of resignation is your scene's climax.
