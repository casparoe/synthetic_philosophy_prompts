answer: |-
  **Preliminary Mapping and Theoretical Strains**

  Before engaging the substantive analysis, I want to lay out the mapping of the IAU case onto our standard reference-theoretic frameworks to identify the friction points immediately.

  **Mapping 1: The Causal-Historical (Kripke/Putnam)**
  *   **The Setup:** "Planet" functions as a natural-kind term. Its extension was fixed by an initial baptism (perhaps Copernican or even prehistoric) ostending a set of bodies.
  *   **The Move:** The 2006 vote is treated not as legislation but as the culmination of empirical inquiry discovering the *essence* of the kind (dynamical dominance).
  *   **The Commitment:** "Pluto is not a planet" is a necessary truth, knowable only a posteriori. Prior assertions that Pluto was a planet were false, not merely imprecise.
  *   **The Strain:** Natural kind essences (H₂O, atomic number 79) are not subject to democratic vote. The existence of the vote suggests the extension was *underdetermined* by the world, requiring stipulation. Furthermore, "cleared neighborhood" is a relational/dynamical property, not an intrinsic microstructure, which weakens the Putnamian analogy.

  **Mapping 2: Descriptivism (Frege/Russell/Cluster)**
  *   **The Setup:** "Planet" is associated with a cluster of descriptions (orbits sun, spherical, clears orbit, etc.).
  *   **The Move:** The IAU vote altered the cluster, weighting "clearing the neighborhood" as necessary rather than contingent.
  *   **The Commitment:** The meaning (sense) changed, thereby shifting the extension. "Pluto was a planet" was true in 1930 (relative to the old cluster) and false in 2006 (relative to the new).
  *   **The Strain:** This struggles to explain why we feel the *object* (Pluto) didn't change, yet our classification did. It also risks making scientific disagreement impossible (if I define 'planet' differently, I just talk past you), whereas astronomers argue as if there is a fact of the matter.

  **Commitment:** I will argue that "planet" functions as a *theoretical kind term* rather than a strict Putnamian natural kind. This places it uneasily between the two theories: it demands the objectivity of the causal theory but operates via the stipulative mechanisms of descriptivism.

  ***

  **To:** Colleague
  **From:** [Your Name]
  **Re:** The IAU Vote and Reference Theory

  You asked for an analysis of the 2006 IAU vote through the lens of reference theory. Given your familiarity with *Naming and Necessity* and "The Meaning of 'Meaning'," I will skip the exegesis and move directly to the dialectical application. The Pluto case is not merely a pop-culture footnote; it is a stress test for the causal-historical theory when applied to macroscopic, dynamical kinds rather than microstructural ones.

  ### I. The Natural Kind Disanalogy

  The strongest temptation for a causal theorist is to treat the IAU vote as a discovery of essence, analogous to the whale/fish case. In that canonical example, we say whales were *never* fish; we corrected a mistake about the world. If "planet" is a natural kind term rigidly designating a specific dynamical class, then the 2006 definition merely codified the hidden essence that was there all along. On this reading, "Pluto is a planet" was always false, and the truth was discovered a posteriori.

  However, this mapping strains at three specific points where the Pluto case diverges from Water/Gold/Whales:

  1.  **The Mechanism of Fixing:** We do not vote on microstructure. The extension of "water" is fixed by the physical world, not the International Union of Pure and Applied Chemistry. If the IAU had to *vote* to determine whether dynamical dominance is essential, it suggests the reference was not fixed by the causal history of the term's introduction. In 1930, Tombaugh baptized Pluto as a planet based on observational criteria available *then*. If "clearing the neighborhood" was the essential property all along, the 1930 baptism was defective in a way that "water" baptisms were not.
  2.  **Intrinsic vs. Relational Essence:** Putnam's semantic externalism relies heavily on the idea of a "same L" relation (same liquid, same metal) grounded in intrinsic constitution. "Clearing the neighborhood" is not intrinsic to Pluto; it is a relational property dependent on the distribution of other mass in the Kuiper Belt. If a scattered disk object had fallen into Pluto's orbit yesterday, Pluto would have "stopped being a planet" (on the IAU view) without changing its intrinsic physical nature. This makes "planet" behave more like a functional role than a substance kind.
  3.  **The Jade Counter-Example:** A better analogy might be jade. "Jade" turned out to refer to two distinct minerals (jadeite and nephrite). We accept that "jade" is a disjunctive kind. One could argue "planet" was similarly disjunctive (dominant bodies + dwarf bodies) and the IAU forced a split. But even here, the disanalogy holds: jadeite and nephrite share microstructure; Pluto and Ceres share only dynamical history.

  If we force the causal-historical map here, we must accept that the IAU vote was a *correction* of a centuries-old error. But this requires us to say that the linguistic community in 1930 was referring to "dynamically dominant bodies" when they said "planet," even though they had no conception of that criterion. This stretches the notion of "implicit knowledge" of essence beyond its breaking point.

  ### II. The Sociolinguistic Reality and Division of Labor

  Putnam's division of linguistic labor posits that experts fix the extension for the lay community. The IAU is the paradigmatic expert body. However, the aftermath of the 2006 vote reveals a fracture in this labor that reference theory struggles to accommodate.

  A significant cohort of planetary scientists (including the Principal Investigator of the New Horizons mission) rejects the IAU definition, advocating for a geophysical definition (hydrostatic equilibrium) under which Pluto remains a planet. If "planet" were a rigid designator of a natural kind fixed by the experts, this dissent would be akin to a chemist denying water is H₂O—simple error. But the dissent is not based on new data about Pluto; it is based on a competing *stipulation* of utility.

  This suggests that "planet" is not a term where reference is fixed solely by causal contact with a kind, but rather a *term of art* whose extension is determined by theoretical utility. When the experts disagree on the utility, the reference becomes indeterminate. This looks much closer to a descriptivist cluster concept where the weighting of descriptions (roundness vs. orbital dominance) is up for negotiation.

  Furthermore, consider the linguistic datum: the public and many scientists say Pluto "stopped being a planet." Nobody says Ceres "stopped being a planet" (it was reclassified in the 1850s quietly), but the Pluto case is framed as a change in status. If the causal theorist insists "Pluto was never a planet," they must claim the sentence "Pluto was the ninth planet" uttered in 1950 was *false*. This is a hard pill to swallow. It implies a systematic falsity in the astronomical record that the "discovery of essence" model (like whales/fish) does not usually entail. In the whale case, we don't feel the pre-Linnaean whalers were speaking falsely in their context; we feel they were using a different taxonomy. But with Pluto, the claim is stronger: that the *fact* was otherwise.

  ### III. Rigid Designation and the Necessary A Posteriori

  Does this episode teach us anything about rigid designation? "Pluto" rigidly designates the object. That remains unchallenged. The trouble is the predicate "is a planet."

  If "planet" rigidly designates a kind, then in every possible world where Pluto exists, its planetary status should be constant (assuming the kind is essential). If the IAU definition holds, then in any world where Pluto fails to clear its orbit, it is not a planet. But since Pluto *actually* fails to clear its orbit, and we called it a planet for 76 years, we are forced to say our previous modal intuitions were wrong.

  The more honest assessment is that "planet" is not a rigid designator of a kind in the Kripkean sense. It is a *non-rigid* description-sensitive term. Its extension shifts as the theoretical context shifts. When we say "Pluto might not have been a planet," we are not imagining a world where Pluto has different intrinsic properties; we are imagining a world where the *classification scheme* is different. This undermines the "necessary a posteriori" reading. The truth "Pluto is not a planet" is not necessary; it is contingent on the adoption of the 2006 taxonomy.

  ### IV. Direct Answers to Your Closing Questions

  **1. Does the episode vindicate descriptivism, the causal theorist, or show "planet" sits uneasily between kind terms and terms of art?**

  It shows that "planet" sits uneasily between kind terms and terms of art. To vindicate the causal theorist, one must argue that the IAU discovered a pre-existing dynamical essence, rendering 76 years of astronomical discourse systematically false. This is theoretically costly and ignores the relational nature of the "essence." To vindicate descriptivism, one must accept that the extension of scientific kind terms can be altered by legislative stipulation, which undermines the externalist intuition that the world fixes reference. The most accurate diagnosis is that "planet" is a *theoretical kind term*. Unlike "water," its extension is not fixed solely by physical constitution but by the explanatory role it plays in a theory. When the theory changes (from counting bodies to modeling formation), the term's extension is permitted to shift. This is a domain where descriptivist mechanisms (changing the associated cluster of properties) operate within a causal framework (anchored to actual solar system bodies).

  **2. Does the whole affair teach anything at all about rigid designation and the necessary a posteriori, or is it merely a case about words?**

  It is largely a case about words, but one that reveals the limits of applying the "water/H₂O" model to all scientific taxonomy. The philosophical apparatus adds drama but not understanding if we insist on treating "planet" as a natural kind in the Putnamian sense. The lesson is negative: rigid designation and the necessary a posteriori apply cleanly to microstructural kinds and proper names, but they fracture when applied to macroscopic, dynamical, or functional classifications. The Pluto case demonstrates that not all scientific kind terms are candidate rigid designators. Some are tools of taxonomy whose extensions are legitimately subject to the "division of linguistic labor" in a way that allows for *revision* rather than just *discovery*. If there is a modal lesson here, it is that we must distinguish between *ontological* necessity (what the object is) and *taxonomic* necessity (how we carve the world). The IAU vote changed the latter, not the former. Insisting otherwise forces the theory to speak where it has nothing to say.
