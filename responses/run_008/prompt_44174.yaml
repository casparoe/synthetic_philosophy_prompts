      *   *Check the KS definition again.* KS solution is the intersection of the Pareto frontier and the line segment connecting $d$ to $u^*$ (ideal point). This implies $\frac{u_1 - d_1}{u_1^* - d_1} = \frac{u_2 - d_2}{u_2^* - d_2}$. The text says "same utility gain" ($u_1 - d_1 = u_2 - d_2$). This is definitely the Egalitarian solution.
