      *   **Utility Comparability:** The Egalitarian Solution requires interpersonal comparability of utility (cardinal and comparable). NBS and KS only require von Neumann-Morgenstern utility (cardinal but not comparable across people). If the article assumes utilities are comparable, the Egalitarian solution makes sense, but KS *also* doesn't require comparability. The text implies KS does this equalization.
      *   **Context of "Fairness":** In mechanism design or specific normative contexts, KS might be preferred, but in general equilibrium or standard bargaining applications, NBS dominates.
      *   **Nuance on "Outside Options":** The first sentence's claim about NBS ignoring outside options is technically false (it uses $d$), but maybe the author means it ignores the *bargaining power* derived from the shape of the frontier relative to the ideal point. I need to be careful not to over-correct the first sentence while fixing the second.

