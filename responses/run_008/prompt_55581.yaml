      *   **The "F-Twist" and Inversion:** Does Friedman license inversion? No. Friedman cares about $H \to O$ (Hypothesis to Observation). Inversion is $O \to H$ (Observation to Parameter). This shifts the model from a *theory* to a *metric*.
