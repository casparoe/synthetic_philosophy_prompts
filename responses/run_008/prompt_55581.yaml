answer: |-
  Your intuition is correct: the persistence of Black–Scholes–Merton (BSM) in option markets is **not** an instance of Friedmanian instrumentalism, though it is often mischaracterized as such. Friedman's methodology requires that a model be retained *because* it predicts well. In the case of BSM, the model is retained *despite* predicting poorly (as evidenced by the volatility smile/skew).

  The practice you describe presupposes a methodology best described as **Conventionalist Performativity**. It treats the model not as a theory of price generation, but as a **measurement convention** and a **lingua franca** for coordinating disagreement.

  Here is a reconstruction of the implicit methodology, separating what the practice strictly presupposes from what is merely compatible with it, followed by the realist counterfactual.

  ---

  ### 1. Why This Is Not Friedmanian Instrumentalism

  Friedman's 1953 essay argues that assumptions are irrelevant *if and only if* the theory yields accurate predictions. The "F-twist" licenses unrealistic assumptions (like perfect rationality) solely on the grounds of predictive utility.

  **The BSM case violates the Friedmanian condition:**
  1.  **Predictive Failure:** The market systematically deviates from BSM prices. The existence of the volatility smile is a standing admission that the log-normal assumption is false. If Friedman's criterion were strictly applied, BSM should have been discarded the moment the smile emerged (post-1987).
  2.  **Inversion of Logic:** Friedman views models as $Parameters \to Price$. Traders use BSM as $Price \to Parameters$ (Implied Volatility). This inverts the epistemic direction. The model is no longer a hypothesis to be tested against data; it is a definition used to translate data into a standardized metric.

  Therefore, the survival of BSM is not licensed by Friedman's "predictive success" clause. It is licensed by a different methodological commitment.

  ### 2. The Actual Methodology: Model-Based Conventionalism

  The practice presupposes that the primary function of a financial model is **coordination**, not description. This aligns more closely with the philosophy of science found in **Henri Poincaré's conventionalism** (geometries are not true/false, but convenient/inconvenient) and **Donald MacKenzie's performativity** (models shape the reality they describe).

  #### A. The Model as a Coordinate System (Presupposition)
  The market presupposes that liquidity requires a shared ontology. To trade, participants must agree on what is being traded.
  *   **Strict Presupposition:** A model is a standard unit of measurement (like a meter or a second), not a claim about the underlying physics. "20% volatility" has no meaning outside the BSM equation.
  *   **Compatibility:** It is compatible with the model being "false." In fact, the falsity is required for the trade to exist. If the model were perfectly true, the smile would not exist, and there would be no "volatility trading," only hedging.

  #### B. The Model as a Null Hypothesis (Presupposition)
  Traders use BSM to quantify *deviation*, not to assert truth.
  *   **Strict Presupposition:** The model serves as a baseline (null hypothesis) against which market beliefs are expressed. The "error" of the model (the smile) is the actual object of trade.
  *   **Methodological Shift:** This is **Error-Based Modeling**. The value of the model lies in its ability to standardize the *residuals*. By forcing all prices through the BSM inverter, the market isolates the specific dimension of disagreement (volatility) while netting out other variables (strike, expiry, spot).

  #### C. Performativity and Stability (Presupposition)
  *   **Strict Presupposition:** The model's validity is sustained by its usage, not its accuracy. Because everyone hedges using BSM Greeks (delta, gamma), the market dynamics partially mimic the model, creating a self-fulfilling stability that makes the convention useful even if the distributional assumptions are wrong.
  *   **Licence for Inversion:** The "F-twist" does *not* license inverting the model. Conventionalism does. If a model is a definition, you can invert it by definition. You do not "test" a definition; you apply it.

  ### 3. Does the Licence Extend to Trading the False Assumptions?

  You ask if the licence extends to cases where the known-false assumptions (Gaussian tails) are the very thing everyone is trading around.

  **Yes, but under a specific condition:** The methodology presupposes that **risk is separable from model structure.**

  *   **The Practice:** Traders know tails are fat. They do not fix the model to account for fat tails (e.g., by switching to a Jump-Diffusion model for quoting). Instead, they keep the Gaussian model and adjust the *input* (volatility) to vary by strike.
  *   **The Methodological Justification:** This presupposes that **complexity should be localized in the parameter, not the equation.**
      *   If you change the equation (e.g., to Stochastic Volatility), the "Greeks" (hedging ratios) change. Every trader would have different hedging parameters. Liquidity fractures.
      *   If you keep the equation (BSM) and warp the parameter (Volatility Surface), the hedging language remains constant.
  *   **Conclusion:** The licence extends because the methodology prioritizes **inter-subjective stability** over **ontological accuracy**. The false assumption is not a bug; it is the canvas upon which the smile is painted.

  ### 4. The Realist Counterfactual: What If We Swapped Views?

  If the market adopted a **Realist Methodology** (where models must truthfully represent the underlying data-generating process and assumptions do load-bearing work), practice would change radically:

  1.  **Fragmentation of Liquidity:**
      *   **Current:** Everyone quotes BSM IV. A "50-delta put" is universally understood.
      *   **Realist:** Bank A quotes using Heston (Stochastic Vol); Bank B uses Jump-Diffusion; Bank C uses Local Vol. There is no common "volatility." To compare prices, you must convert between models. Bid-ask spreads widen; liquidity dries up.

  2.  **Shift in Risk Management:**
      *   **Current:** Risk is managed via "Greeks" derived from BSM, with ad-hoc adjustments for "vega risk" or "smile risk."
      *   **Realist:** Risk management would focus on **Model Risk** as a primary category. You would have to calculate the probability that your chosen realist model is the wrong one. Capital charges would increase to account for specification error.

  3.  **The End of the "Volatility Trade":**
      *   **Current:** Traders buy/sell volatility as an asset class defined by BSM inversion.
      *   **Realist:** "Volatility" is not a direct observable; it is a parameter of a specific process. You would trade "jump intensity" or "mean reversion of variance." These are harder to hedge and harder to agree upon. The market would move from trading a standardized *metric* to trading heterogeneous *theories*.

  4.  **Pricing of Tail Events:**
      *   **Current:** Tails are priced via the smile (higher IV for OTM puts). The Gaussian assumption is preserved formally, violated parametrically.
      *   **Realist:** Tails are priced via the model structure (e.g., kurtosis parameters). This makes the pricing more accurate theoretically but less transparent practically. A "1-in-100-year event" depends on which realist distribution you chose.

  ### 5. Summary Reconstruction

  The implicit methodology of the option market is **Operational Conventionalism**.

  | Feature | Friedmanian Instrumentalism | **Operational Conventionalism (Market Practice)** |
  | :--- | :--- | :--- |
  | **Criterion for Retention** | Predictive Accuracy | **Coordination / Liquidity** |
  | **Status of Assumptions** | Irrelevant if predictions hold | **Irrelevant if convention holds** |
  | **Role of Model** | Prediction Engine | **Measurement Standard / Language** |
  | **Handling Error** | Discard/Modify Model | **Encode Error in Parameters (Smile)** |
  | **Epistemic Direction** | Theory $\to$ Data | **Data $\to$ Theory (Inversion)** |
  | **Ontological Commitment** | Agnostic (As-If) | **Anti-Realist (Model as Tool)** |

  **What the practice strictly presupposes:**
  1.  That a shared falsehood is more valuable than a fragmented truth.
  2.  That the "error" of the model can be cleanly separated from the "signal" (i.e., that the smile is a stable object).
  3.  That the model is a definition, not a hypothesis.

  **What is merely compatible:**
  1.  That the assumptions are false (Compatible with both Friedman and Conventionalism).
  2.  That traders make money (Compatible with both).
  3.  That hedging reduces risk (Compatible, though Realists would argue BSM hedging is flawed).

  **Conclusion:**
  The market does not use Black–Scholes because it thinks the world is Black–Scholesian (Realism), nor because it predicts prices well (Friedmanism). It uses Black–Scholes because it is the **ISO standard of financial distress**. It allows traders to agree on the *magnitude* of their disagreement without arguing about the *structure* of reality. Swapping to a realist view would increase ontological accuracy but decrease market efficiency, suggesting that in finance, **social utility trumps scientific truth.**
