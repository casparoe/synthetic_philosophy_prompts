      *   *Alternative Methodologies:*
          *   *Performativity (Callon, MacKenzie):* Models don't describe the world; they shape it. BSM made the market behave more like BSM (until it didn't).
          *   *Conventionalism/Pragmatism:* The model is a standard unit of measurement (like a meter stick), not a theory of truth.
          *   *Model-as-Technology:* It's a tool for translation/arbitrage, not explanation.
