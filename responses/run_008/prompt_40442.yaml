answer: |-
  Your intuitions reveal a coherent but composite theory of franchise that cannot be reduced to a single axiom without distorting either the nature of political community or the requirements of rational agency. To capture nearly all your verdicts while resolving your ambiguities, you need two distinct principles that operate sequentially. The first is the Principle of Continuous Reciprocal Subjection, which determines standing within the polity. The second is the Principle of Deliberative Capacity, which determines the agency required to exercise the vote. The first principle grants the right to participate to those who are permanently subject to the coercive authority of the state and integrated into its cooperative scheme as residents, thereby sharing in the burdens and benefits of the collective future. The second principle restricts the exercise of that right to those who possess the cognitive ability to engage in collective reasoning and judgment. The boundary between these two principles lies in cases where an individual is fully subjected to the law but where their capacity to deliberate is contested or legally constrained.

  Under the Principle of Continuous Reciprocal Subjection, your verdicts on lifetime residents, citizens abroad, tourists, and contract workers are clarified. Lifetime residents who never naturalized should vote because they are permanently subjected to the city's coercive order and share in its fate, regardless of formal citizenship status. Citizens living abroad for two decades should not vote because, despite retaining a passport, they have severed the factual tie of continuous subjection to the daily coercive and cooperative reality of the city. Tourists should not vote because their subjection is transient and lacks the permanence required for a stake in the long-term cooperative scheme. This principle also resolves your ambivalence regarding contract workers on renewable five-year permits. Because their residence is ongoing and they are subject to the city's authority for significant periods renewable indefinitely, they qualify as members of the cooperative scheme. Therefore, they should vote. Your hesitation stems from viewing the city alternatively as a closed club or a coercive order, but under this principle, the factual reality of ongoing subjection and integration grants them standing.

  The Principle of Deliberative Capacity then filters those with standing to ensure the electorate can function as a reasoning body. This principle supports your verdict that persons under guardianship for severe cognitive impairment should not vote, as they lack the requisite agency. It also supports your verdict that people who have completed prison sentences should vote, as their capacity for judgment is restored upon reintegration. However, this principle requires me to be explicit about overturning one of your fixed verdicts. You stated that sixteen-year-olds who hold jobs and pay taxes should not vote. If the bar for exclusion is cognitive capacity rather than arbitrary age, and these individuals are demonstrating functional independence through employment and tax contribution, they meet the threshold for deliberative agency. To maintain consistency with the principle that capacity rather than age determines eligibility, I would overturn your verdict and argue that sixteen-year-olds who work and pay taxes should vote. Maintaining their exclusion would require elaborating the principle to include an arbitrary age threshold that contradicts the functional evidence of capacity you acknowledged in their employment.

  Finally, to demonstrate the predictive power of this two-principle framework, consider a case you have not listed: children of foreign diplomats who reside in the city-state permanently from birth but enjoy diplomatic immunity from local laws. Your principles predict they should not vote. Although they meet the residency requirement, they fail the Principle of Continuous Reciprocal Subjection because diplomatic immunity exempts them from the coercive authority of the local legal order. They do not share the same burdens as other residents, and thus lack the reciprocal stake required for standing. This outcome preserves the integrity of the franchise as a right tied to shared subjection and capacity, ensuring that the assembly represents those who are truly bound by its decisions and capable of shaping them.
