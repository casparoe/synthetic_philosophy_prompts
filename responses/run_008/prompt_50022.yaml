prompt: |-
  In my civics class, a discussion about lowering the voting age turned into a running argument between two classmates, and they have asked me to referee it, which I do not feel able to do on my own. The disagreement began when our teacher mentioned that some countries allow sixteen-year-olds to vote, while long-term resident non-citizens in most democracies cannot. Rohan argued for what he called the "affected principle": anyone whose interests are meaningfully shaped by a decision has a claim to a vote on it, which would include sixteen-year-olds, resident non-citizens, and even future generations, perhaps through proxies. Maya replied that this is far too expansive, since almost every policy affects almost everyone in some diffuse way, and that the right criterion is being subject to the law's coercion: resident non-citizens belong, but future generations do not, because they are bound by no law yet. Rohan countered that "subject to coercion" has symmetrical problems: tourists passing through are subject to the laws during their stay, so her principle seems to hand them a vote, while excluding future generations who will bear the consequences of today's environmental policy far more than any tourist will. Maya answered that brief, consensual subjection is not the same as standing subjection, and that future generations can have their interests protected without being members of the demos, just as animals' interests can be weighed without animals voting. Rohan's last move was that children are plainly subject to the law's coercion and yet we deny them the vote, so her criterion cannot be sufficient either; and if she patches this with a competence requirement, he does not see why competence would not equally defeat his side's claims, since an affected but incompetent person is affected all the same. Could you adjudicate this exchange move by move — saying who is right at each step and why, not merely who wins overall — and, in addition, tell us whether there is something both of them are missing about what the membership question is actually for?
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Civics class discussion about lowering the voting age vs. voting rights for non-citizens.
      *   **Task:** Adjudicate the debate between Rohan and Maya move-by-move (who is right at each step and why) *and* identify what both might be missing about the purpose of the "membership question."
      *   **Constraint:** Do not merely declare an overall winner; analyze the logical strength of each argument.
      *   **Tone:** Educational, balanced, philosophical but accessible (civics class level).

  2.  **Deconstruct the Debate (Move-by-Move):**

      *   **Move 1: Rohan's Opening (The "All-Affected Principle")**
          *   *Claim:* Anyone whose interests are meaningfully shaped by a decision should vote.
          *   *Examples:* 16-year-olds, resident non-citizens, future generations (via proxies).
          *   *Analysis:* This is a standard democratic theory principle (All-Affected Principle - AAP). It's morally intuitive but practically difficult.
          *   *Verdict:* Strong moral foundation, but vague on "meaningfully shaped."

      *   **Move 2: Maya's Reply (The "All-Subjected Principle")**
          *   *Claim:* AAP is too expansive (everything affects everyone diffusely). Criterion should be subjection to law's coercion.
          *   *Examples:* Resident non-citizens belong (subject to law), future generations do not (not bound by law yet).
          *   *Analysis:* This is the "All-Subjected Principle" (ASP). It addresses the boundary problem of AAP. It distinguishes between causal impact and political obligation.
          *   *Verdict:* Stronger practical boundary, but raises new issues (who counts as "subject"?).

      *   **Move 3: Rohan's Counter (Tourists vs. Future Generations)**
          *   *Claim:* ASP has symmetrical problems. Tourists are subject to laws (should they vote?). Future generations bear consequences but aren't "subject."
          *   *Analysis:* This is a classic critique of ASP. Tourists are temporarily subject. Future generations are deeply affected but not legally subject.
          *   *Verdict:* Rohan scores a point here. The "tourist problem" is a known weakness of strict ASP. The future generations point highlights the moral cost of ASP.

      *   **Move 4: Maya's Response (Standing Subjection & Guardianship)**
          *   *Claim:* Brief/consensual subjection (tourists) $\neq$ standing subjection. Future generations/animals can have interests protected without voting (guardianship/trusteeship).
          *   *Analysis:* Refines ASP to "ongoing membership in the coercive order." Addresses future generations via representation rather than enfranchisement.
          *   *Verdict:* Maya recovers ground. Distinguishing transient vs. permanent subjection is standard in political theory. The guardianship argument is plausible but shifts the debate from *rights* to *protection*.

      *   **Move 5: Rohan's Final Move (Children & Competence)**
          *   *Claim:* Children are subject to coercion but can't vote. If Maya adds "competence," it defeats her own exclusion of 16-year-olds (if they are competent) or defeats Rohan's AAP (affected but incompetent).
          *   *Analysis:* This is the "Children Objection." It targets the sufficiency of the ASP. If subjection is the *only* criterion, children should vote. If competence is added, why exclude 16-year-olds?
          *   *Verdict:* Rohan lands a strong blow. This exposes that *neither* principle works alone; both require a competence threshold, which complicates both sides.

  3.  **Synthesize the "Missing Element" (The Purpose of Membership):**
      *   Both are treating voting as a *right* derived from a moral principle (affectedness or subjection).
      *   What are they missing? Voting is also an *institutional mechanism* for collective self-determination and stability.
      *   Key concepts: The "Boundary Problem" (who decides who decides?), the function of the *demos* as a stable agent over time, and the distinction between *interests* and *agency*.
      *   They are missing the *constitutive* aspect: The demos constitutes itself. It's not just about applying a moral rule; it's about building a political community capable of acting.

  4.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the debate. Set the stage (AAP vs. ASP).
      *   *Move-by-Move Adjudication:*
          *   Round 1 (Rohan): Right on moral intuition, wrong on practicality.
          *   Round 2 (Maya): Right on boundaries, wrong on moral inclusivity.
          *   Round 3 (Rohan): Right on edge cases (tourists/future).
          *   Round 4 (Maya): Right on distinction (transient vs. standing), but the guardianship point is a concession (protection $\neq$ voice).
          *   Round 5 (Rohan): Right on the "Children Problem." This is the stalemate point.
      *   *The Missing Piece:* Discuss the function of the *demos*. It's not just about who *should* vote, but who *can* vote to maintain a coherent political will. Mention the "Boundary Problem" (Whelan vs. Dahl). Mention that voting is about *agency*, not just *interests*.
      *   *Conclusion:* Summarize that both have partial truths, but the question is institutional, not just moral.

  5.  **Refining the Tone:**
      *   Ensure I don't sound like I'm taking sides personally.
      *   Use clear headings.
      *   Make sure the "Missing Piece" section adds value beyond just summarizing the debate.
      *   *Self-Correction during drafting:* I need to be careful not to say one is "wrong" in a factual sense, but rather "logically stronger" or "theoretically vulnerable." Political theory rarely has a single "right" answer. I should frame it as "Who has the stronger argument at this specific juncture?"

  6.  **Final Review against Constraints:**
      *   Adjudicate move by move? Yes.
      *   Say who is right at each step? Yes.
      *   Tell them what they are missing? Yes.
      *   No overall winner declaration? (I will conclude with the synthesis rather than a scorecard).

  7.  **Final Polish:** Check the logic on the "competence" argument in Round 5. Rohan argues that if competence is the blocker for children, it should apply to his affected principle too. Maya argues subjection is the key. Rohan points out subjection includes children. So Maya needs competence. But if she adds competence, she might have to include 16-year-olds. Rohan wins this logical exchange because he forces her to admit subjection isn't *sufficient*.

      *Wait, let's look closer at Round 5.*
      Rohan: Children are subject + no vote. So subjection isn't sufficient.
      Maya (implied): Need competence.
      Rohan: If you need competence, then my "affected" people (who might be incompetent) also lose out. BUT, more importantly, if competence is the bar, why do 16-year-olds fail it?
      Actually, Rohan's point is: If you patch your theory with competence, you admit subjection isn't enough. And if competence is the real gatekeeper, then 16-year-olds (who are often competent) should vote, which helps Rohan's original case.
      Okay, I will frame this as Rohan exposing a hidden premise in Maya's argument.

      *Missing Piece:* The "Constitutive" view. The demos defines itself. Also, the distinction between *stakes* (Rohan) and *agency/responsibility* (Maya).

      Let's write it.cw
answer: |-
  This is an exceptionally sophisticated debate for a civics class. Rohan and Maya have inadvertently reconstructed one of the central debates in democratic theory: the conflict between the **All-Affected Principle** (Rohan) and the **All-Subjected Principle** (Maya). Neither principle is perfect, and political philosophers have wrestled with these exact objections for decades.

  Here is an adjudication of the exchange move-by-move, followed by an analysis of what both students are missing regarding the purpose of democratic membership.

  ### Move-by-Move Adjudication

  **Move 1: Rohan's Opening (The All-Affected Principle)**
  *   **Argument:** Voting rights should belong to anyone whose interests are meaningfully shaped by a decision.
  *   **Adjudication:** **Rohan is morally intuitive, but practically vulnerable.**
  *   **Why:** Rohan is drawing on a deep moral intuition: it is unfair for people to be ruled by decisions they had no hand in making if those decisions hurt them. This is the "All-Affected Principle." It is strong on moral legitimacy. However, as Maya is about to point out, it is weak on boundaries. In a globalized world, almost every policy (tax rates, environmental laws, war) affects almost everyone on earth to some degree. If taken literally, Rohan's principle could justify a global plebiscite on local zoning laws, which makes governance impossible.

  **Move 2: Maya's Reply (The All-Subjected Principle)**
  *   **Argument:** "Affected" is too vague. The right criterion is being subject to the law's coercion.
  *   **Adjudication:** **Maya is theoretically stronger on boundaries.**
  *   **Why:** Maya introduces the "All-Subjected Principle." This is the standard counter to Rohan. It solves the boundary problem by limiting the *demos* (the voting public) to those who are legally bound by the state's authority. It explains why resident non-citizens should vote (they are subject to the laws) while people in other countries generally should not (they are not). She correctly identifies that "influence" is not the same as "obligation." However, she creates a new vulnerability regarding *who* counts as "subject."

  **Move 3: Rohan's Counter (Tourists vs. Future Generations)**
  *   **Argument:** Tourists are subject to laws but shouldn't vote; future generations aren't subject to laws but should have a say.
  *   **Adjudication:** **Rohan wins this exchange.**
  *   **Why:** Rohan successfully identifies the "edge cases" that break Maya's rule.
      1.  **The Tourist Problem:** If subjection is the only criteria, a tourist who breaks a law is punished, so they are "subject." But no one argues tourists should vote in local elections. This shows subjection is not *sufficient* for voting rights.
      2.  **The Future Generations Problem:** This is Rohan's strongest point. Climate policy today binds people 50 years from now far more than it binds a tourist today. By excluding future generations strictly because they aren't currently "subject" to coercion, Maya's principle allows the current *demos* to externalize costs onto people who cannot defend themselves. Rohan shows that Maya's principle protects the *current* political order but fails moral tests regarding time.

  **Move 4: Maya's Response (Standing Subjection & Guardianship)**
  *   **Argument:** Tourists are transient; residents are standing. Future generations don't need votes; their interests can be protected by guardians (like animals).
  *   **Adjudication:** **Maya recovers ground, but concedes a key point.**
  *   **Why:** Maya refines her principle to "ongoing membership in the coercive order," which successfully excludes tourists. This is a standard and robust defense in political theory. However, her comparison of future generations to animals is a concession. By arguing their interests can be "weighed" without them voting, she admits that *subjection* alone isn't enough to grant *agency*. She is shifting from a rights-based argument (you vote because you are bound) to a trusteeship argument (we vote for you because you can't). This weakens her claim that subjection is the *sole* criterion for membership.

  **Move 5: Rohan's Final Move (The Children Objection)**
  *   **Argument:** Children are subject to coercion but can't vote. If you add "competence" to fix this, it complicates both our views.
  *   **Adjudication:** **Rohan lands the decisive blow.**
  *   **Why:** This is the "Children Objection," and it is the hardest problem for Maya. Children are clearly subject to the law's coercion (perhaps even more than adults, given they cannot leave home), yet they are excluded. This proves that **subjection is not sufficient.** Maya must implicitly add a "competence" or "agency" requirement.
      *   If she adds a competence requirement, Rohan is right to ask: Why do 16-year-olds fail this test? Many 16-year-olds work, pay taxes, and drive.
      *   Rohan also correctly notes that if competence is the barrier, it hurts his "All-Affected" principle too (an affected infant cannot vote).
      *   **Verdict:** Rohan wins this round because he forces Maya to admit her principle is incomplete. She cannot rely on "subjection" alone; she must rely on "subjection + capacity." But if capacity is the key, the debate shifts to *when* capacity is achieved, which is exactly where Rohan wants to be (arguing for 16-year-olds).

  ### What Both Are Missing: The Purpose of the *Demos*

  Both Rohan and Maya are treating the voting boundary as a **moral puzzle** to be solved by applying a universal rule (either "affectedness" or "subjection"). They are missing the **political function** of the membership question.

  Here is what is absent from their debate:

  **1. The Boundary Problem (Who Decides?)**
  Both students assume there is an objective fact about who *should* vote that exists outside the political system. But as political theorist Frederick Whelan noted, there is a paradox: To decide who gets to vote, you need a vote. But to have a vote, you need to decide who gets to vote.
  *   **The Missing Insight:** The *demos* is not discovered; it is **constituted**. A political community must define itself to exist at all. The boundary is not just about justice (Rohan) or law (Maya); it is about creating a stable agent capable of making decisions over time. If the voting population changes too drastically with every issue (as Rohan's principle might suggest), there is no stable "people" to hold power accountable.

  **2. Interests vs. Agency**
  Rohan focuses on **interests** (who is hurt or helped). Maya focuses on **obligation** (who is bound).
  *   **The Missing Insight:** Voting is not just about protecting interests (we have courts for that) or acknowledging obligation (we have taxes for that). Voting is about **collective agency**. It is the mechanism by which a group takes responsibility for a shared future.
  *   This is why the "future generations" point is so hard. We cannot give them votes because they cannot deliberate *with us* now. We cannot give tourists votes because they do not share in the *long-term responsibility* of the outcome. The vote is not merely a shield for interests; it is a share in **authorship**.

  **3. The Competence/Community Hybrid**
  Rohan and Maya treat "competence" as a separate hurdle. In practice, democracies bundle competence with **community membership**.
  *   **The Missing Insight:** We exclude children not just because they lack cognitive competence, but because they are not yet fully integrated into the **reciprocal network of responsibility**. Voting implies you are both a ruler and a ruled. We lower the voting age not when a person becomes "smart," but when society judges they have entered the stage of life where they share in the burden of sustaining the community (working, independent living, military service, etc.).

  ### Summary for the Class
  *   **Rohan** is right that moral legitimacy requires considering those impacted, but he underestimates the need for a stable political community.
  *   **Maya** is right that legal subjection creates a clear boundary, but she underestimates the moral cost of excluding those who bear long-term consequences.
  *   **The Resolution:** The voting age and residency requirements are not perfect applications of moral truth. They are **institutional compromises**. They attempt to balance Rohan's demand for fairness (including those affected) with Maya's demand for order (including those bound by the law), while ensuring the *demos* remains a coherent group capable of taking responsibility for its decisions over time.

  You might suggest to them that the question isn't "Which principle is true?" but "Which boundary allows us to function as a self-governing community that is both just and stable?"
