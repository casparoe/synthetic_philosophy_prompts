  *   **Verdict 4 (One Question):** This is the crucial filter. She does **not** count *potential* awakenings, only *actualized* interviews. On Tails, 9 awakenings happen, but only 1 interview occurs. Thus, $N_H=1, N_T=1$, leading to 1/2.
