  My friend has this game where she reruns history in her head and gives a verdict on whether we'd end up with the same thing again. Her track record so far:

  - QWERTY: no chance we get the same layout. Whatever keyboard got an early lead would've locked in, and the layout itself is basically arbitrary. Contingent.
