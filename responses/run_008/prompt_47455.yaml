answer: |-
  ### Desiderata for an Account of Moore's Paradox

  To evaluate competing theories of Moore's paradox, we must first isolate the phenomena any adequate account must explain. The following desiderata distinguish between the raw data of the paradox (non-negotiable) and the theoretical commitments regarding the *source* of the defect (theory-laden).

  #### I. Non-Negotiable Desiderata (The Data)
  These requirements capture the linguistic and logical intuitions that constitute the paradox itself. Any account that fails these fails to address the phenomenon.

  1.  **The Consistency Constraint:** The account must preserve the logical consistency and contingent truth of the Moorean proposition ($p \land \neg B_i p$).
      *   *Rationale:* As Moore noted, it is logically possible for it to rain while I fail to believe it (e.g., I am unaware). An account that renders the sentence a logical contradiction (like $p \land \neg p$) overgenerates and falsifies the truth conditions.
  2.  **The Indexical Restriction:** The account must explain why the absurdity vanishes in the third person ("It is raining, but *he* doesn't believe it") or the past tense ("It was raining, but I didn't believe it").
      *   *Rationale:* The defect is essentially tied to the first-person present-tense ascription of belief. This suggests the paradox arises from the specific relationship between the speaker, the time of utterance, and the attitude reported.
  3.  **The Embedding Data:** The account must explain why the absurdity dissipates when the sentence is embedded in conditionals, questions, or belief reports (e.g., "If it is raining and I don't believe it, I am ignorant").
      *   *Rationale:* Moorean sentences are felicitous when not used as flat-out assertions. An account that locates the defect solely in the propositional content struggles to explain why that content becomes harmless in non-assertoric contexts.
  4.  **Moore's Observation:** The account must acknowledge that the *state of affairs* described is ordinary and possible.
      *   *Rationale:* The paradox is not about the world, but about the subject's relation to the world. We must be able to describe the situation without paradox; the paradox arises only in the *avowal*.

  #### II. Theory-Laden Desiderata (The Commitments)
  These requirements often encode a preference for a specific type of solution (pragmatic vs. semantic) or extend the scope of the paradox beyond the core data.

  5.  **The Doxastic Irrationality Requirement:** The account should explain why *believing* the Moorean conjunction is arguably as irrational as *asserting* it.
      *   *Rationale:* Wittgenstein argued the paradox is not merely linguistic but mental. However, insisting on this pushes an account toward a semantic or constitutive view of belief (e.g., transparency), whereas a pure norm-of-assertion view might treat belief as secondary.
  6.  **The Variants Coverage:** The account should extend to weaker variants like "It's raining, but I'm not certain" or "I have no opinion."
      *   *Rationale:* These feel similarly defective. However, requiring this forces an account to generalize beyond the binary logic of belief, potentially complicating the formal machinery. Some theories restrict the paradox strictly to explicit belief ascriptions.
  7.  **The Depth of Absurdity:** The account should explain why the sentence feels *contradictory* rather than merely *misleading* or *impolite*.
      *   *Rationale:* Gricean implicatures can be cancelled; Moorean absurdity cannot. Demanding this "uncancellability" encodes a commitment to a defect deeper than standard conversational implicature (leaning toward semantic expressivism).

  #### III. Tensions and Joint Unsatisfiability
  There is a significant tension between **Desideratum 3 (Embedding Data)** and **Desideratum 7 (Depth of Absurdity)**.

  If an account explains the absurdity by positing a semantic inconsistency (to satisfy Depth), it faces the Frege-Geach problem: semantic defects should typically project through embeddings. If "It's raining but I don't believe it" expresses a contradictory mental state, saying "If it's raining but I don't believe it..." should remain defective. Conversely, if an account explains the absurdity via pragmatic norms of assertion (to satisfy Embedding), it often struggles to explain why the defect feels so much like a logical contradiction rather than a mere violation of conversational maxims (failing Depth).

  Consequently, the list forces a choice: one must prioritize either the **projection behavior** of the sentence (favoring pragmatics) or the **phenomenological intensity** of the absurdity (favoring semantics/expressivism). Satisfying both fully requires a hybrid theory that risks ad hocery.

  ***

  ### Scoring the Main Strategies

  **Pragmatic Accounts (Norms of Assertion/Gricean):**
  Pragmatic strategies score highly on the **Non-Negotiable** data, particularly **Embedding** and **Consistency**. By locating the defect in the violation of a norm of assertion (e.g., Assert only what you believe), they easily explain why the sentence is fine in conditionals (where no assertion is made) and why it is logically consistent. However, they struggle with **Depth of Absurdity** and **Doxastic Irrationality**. Because pragmatic implicatures are typically cancellable and distinct from belief itself, these accounts often fail to explain why the sentence feels *contradictory* or why believing the conjunction is inherently irrational rather than just imprudent.

  **Semantic Accounts (Expressivism/Self-Ascription):**
  Semantic strategies excel at **Depth of Absurdity** and **Doxastic Irrationality**. By treating "I believe" as an expression of belief rather than a description, or by invoking a constitutive norm of belief (transparency), they explain why the utterance feels like a contradiction and why holding the belief is irrational. However, they score poorly on **Embedding**. If the sentence expresses a contradictory mental state, it is difficult to explain why that state is not expressed (or why the contradiction vanishes) when the sentence is embedded in a conditional or question, leading to significant technical hurdles regarding compositionality.
