prompt: |-
  I'm starting a paper on Moore's paradox and want to settle, before defending any particular theory, what an adequate account of it actually has to deliver. The phenomenon: asserting "It's raining, but I don't believe it is" — or its omissive twin, "It's raining, but I believe it is not" — strikes us as absurd, though both sentences are consistent and could well be true. Write the desiderata: what any adequate explanation of this absurdity must get right — e.g., why the defect attaches to asserting or believing the sentence rather than to its truth; why it seems confined to first-person, present-tense uses while "He believes it's raining, but it isn't" is unremarkable; whether the account must also cover weaker variants like "It's raining, but I'm not certain it is" or "It's raining, but I have no opinion on whether it is"; whether it must explain why conditionally embedding the sentence ("If it's raining and I don't believe it is, the picnic is ruined") restores felicity; and what, if anything, it owes us about Moore's own observation that the sentence describes a possible and even ordinary situation — with the case or consideration behind each requirement. Sort the desiderata into those that are non-negotiable and those that really just encode a prior commitment to one style of treatment (pragmatic explanations via norms of assertion versus semantic ones via expressivism or self-ascription), and say whether you suspect any pair of requirements is jointly unsatisfiable, so that the list itself forces a choice. Then, briefly, score the two main strategies against your own list — no more than a short paragraph each, since I'm most interested in whether the criteria are the right ones.
