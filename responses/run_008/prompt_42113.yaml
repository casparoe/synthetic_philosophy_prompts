answer: |-
  # Molyneux's Question: A Decision Tree for the Congenitally Restored

  **The Case:** Tomorrow morning, a congenitally blind adult recovers sight. Before touching, pointing, or exploring, they are shown a polished sphere and a matte cube side by side.

  **1. Is the answer settled by the *meanings* of "seeing" and "knowing" (conceptual), or by how vision *works* (empirical)?**
  *   **Conceptual:** The outcome of surgery is irrelevant; the answer follows from definitions.
      *   ➔ **LEAF: Conceptual Dissolution**
  *   **Empirical:** We need to know what the subject can actually do or experience.
      *   ➔ **Go to 2.**

  **2. Does the question apply to *actual* surgery patients (degraded acuity/nystagmus), or only to an *idealized* restoration?**
  *   **Actual Patients:** Real surgical cases count as the test.
      *   ➔ **Go to 3.**
  *   **Idealized:** Real cases are too flawed; we ask about perfect restoration.
      *   ➔ **Go to 4.**

  **3. In actual patients, is failure to distinguish caused by *blurry vision* (data deficit) or *lack of cross-modal link* (mapping deficit)?**
  *   **Data Deficit:** They literally cannot see the shape clearly enough.
      *   ➔ **LEAF: Empirical Dissolution** (Test conditions fail to instantiate the case).
  *   **Mapping Deficit:** They see the shape but don't know which is which.
      *   ➔ **Go to 4.**

  **4. Does "by sight alone" allow *minutes of reasoning*, or must it be *instantaneous* (t=0)?**
  *   **Instantaneous:** Success must be immediate.
      *   ➔ **Go to 5.**
  *   **Reasoning Allowed:** Inference over time counts as "by sight."
      *   ➔ **Go to 6.**

  **5. If instantaneous, does the subject succeed?**
  *   **Yes:** They point to the cube immediately.
      *   ➔ **LEAF: Immediate Yes**
  *   **No:** They guess at chance.
      *   ➔ **LEAF: Strict Empiricist No**

  **6. If reasoning is allowed and they succeed: Does their *visual experience* of the shape change over months, or just their *speed of judgment*?**
  *   **Experience Changes:** Initially, it looks flat/blurry; later, it looks 3D.
      *   ➔ **LEAF: Skill-based Dissolution** (They did not yet "see" in the relevant sense).
  *   **Judgment Speeds Up:** It looks 3D the whole time; they just learn the name faster.
      *   ➔ **Go to 7.**

  **7. If experience is stable: Would they succeed *without new training* on a *Sphere-with-flat-spot* vs. *Cube-with-rounded-edges*?**
  *   **Yes:** They generalize based on shared geometry.
      *   ➔ **LEAF: Mediated Yes**
  *   **No:** They need new training for new shapes (specific association).
      *   ➔ **LEAF: Strict Empiricist No**

  ***

  ## Position Taxonomy (Derived from Branches)

  *   **Conceptual Dissolution:** Reached via **1 (Conceptual)**. The question is a category error about "seeing" vs. "knowing," regardless of surgical outcome.
  *   **Empirical Dissolution:** Reached via **2 (Actual) → 3 (Data Deficit)**. Historical/modern cases cannot answer the question because the subjects lack the visual acuity required to test the hypothesis.
  *   **Immediate Yes:** Reached via **4 (Instantaneous) → 5 (Yes)**. Some spatial content is available cross-modally from the start; no inference needed.
  *   **Strict Empiricist No:** Reached via **5 (No)** OR **7 (No)**. Visual ideas are distinct from tactile; any success is due to rapid association (learning), not innate connection or inference.
  *   **Skill-based Dissolution:** Reached via **6 (Experience Changes)**. The question is premature; the subject lacks the perceptual skill of "seeing shape" initially, so failure is not a failure of cross-modal mapping.
  *   **Mediated Yes:** Reached via **6 (Judgment Speeds Up) → 7 (Yes)**. The subject can infer the correspondence from shared geometric properties visible in both modalities, even if not immediately perceived.

  ***

  ## Logical Gaps & Blind Spots

  **1. Empty Combinations (Paths that lead nowhere)**
  *   **Conceptual + Empirical Test (1→2):** Incoherent. If the answer is fixed by meaning, patient data is irrelevant.
  *   **Immediate Success + Skill-based (5→6):** Incoherent. If visual experience changes over months (Skill), immediate success at t=0 is impossible.
  *   **Experience Change + Mediated Yes (6→7):** Unattractive. Mediated Yes assumes stable visual content that allows inference; if content changes, it collapses into Skill-based.

  **2. The Mediated Yes vs. Empiricist No Blind Spot**
  *   **The Worry:** A "Mediated Yes" (inference from geometry) and an "Empiricist No" (fast associative learning) both predict failure at t=0 and success shortly after. Without Node 7, the tree cannot separate them.
  *   **The Dissolution:** Node 7 dissolves this by testing **generalization**.
      *   *Mediated Yes* claims the link is rational (geometry is universal); success should transfer to novel geometric pairs (flat-spot sphere) immediately.
      *   *Empiricist No* claims the link is associative (habit); novel pairs require new training.
  *   **Residual Risk:** If a student argues that "learning to attend to geometry" is itself a skill, Node 7 may collapse into Node 6. To prevent this, Node 6 must strictly track *phenomenal experience* (does it *look* 3D?) while Node 7 tracks *cognitive generalization* (can they *reason* about new shapes?).
