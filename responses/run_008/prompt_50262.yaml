  # Pre-Reading Quiz: The Rules of Saying

  **Instructions:** Read each scenario carefully. For each, select the option that best matches your intuitive judgment about whether the speaker did something wrong. Do not worry about technical philosophical terms; just go with your gut reaction about what is appropriate conversation.

  **1. The Lottery Ticket**
  Alex buys one ticket in a million-ticket lottery. The drawing happened an hour ago, but the results aren't posted yet. The odds are overwhelmingly against winning. Alex turns to a friend and says, "I lost the lottery."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and Alex is at fault.
  *   C) The assertion was improper, but Alex is not to blame.

  **2. The Broken Thermometer**
  Dr. Lee checks a digital thermometer to diagnose a fever. The thermometer reads 102°F. Unbeknownst to Dr. Lee, the thermometer is broken and stuck on 102°F. However, the patient actually *does* have a fever of 102°F. Dr. Lee says, "You have a fever."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and Dr. Lee is at fault.
  *   C) The assertion was improper, but Dr. Lee is not to blame.

  **3. The Math Conjecture**
  Sam is not a mathematician. Sam reads a post on a reputable mathematics blog written by leading experts stating that Goldbach's Conjecture has been proven. Sam tells a study group, "Goldbach's Conjecture is true."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and Sam is at fault.
  *   C) The assertion was improper, but Sam is not to blame.

  **4. The Rain Paradox**
  Jordan looks out the window and sees it is raining. Jordan turns to a friend and says, "It is raining outside, but I don't believe it is."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and Jordan is at fault.
  *   C) The assertion was improper, but Jordan is not to blame.

  **5. The Lucky Lie**
  Taylor wants to make a friend late. Taylor believes the party starts at 9:00 PM but tells the friend, "The party starts at 8:00 PM." Unbeknownst to Taylor, the party time was changed this morning to 8:00 PM.
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and Taylor is at fault.
  *   C) The assertion was improper, but Taylor is not to blame.

  **6. The Vague Guess**
  A friend asks, "What time does the movie start?" You have no phone and haven't checked the ticket. You have a vague, unearned impression it might be 7:00 PM. The stakes are low; if you're wrong, it doesn't matter. You say, "7:00 PM."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and you are at fault.
  *   C) The assertion was improper, but you are not to blame.

  **7. The Misled Detective**
  You are investigating a crime. All the forensic evidence points to the butler. You have no reason to doubt the evidence. You state to the chief, "The butler committed the crime." It turns out the maid committed the crime and planted the evidence perfectly.
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and you are at fault.
  *   C) The assertion was improper, but you are not to blame.

  **8. The Blind Guess**
  Someone asks, "Did the coin land heads?" You didn't see the flip. You have no evidence. You just guess and say, "It landed heads." It actually landed heads.
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and you are at fault.
  *   C) The assertion was improper, but you are not to blame.

  **9. The Telephone Game**
  You heard from a reliable friend that the library is closed. Your friend heard it from another reliable friend. You didn't check the website. You tell a student, "The library is closed." The library is, in fact, closed.
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and you are at fault.
  *   C) The assertion was improper, but you are not to blame.

  **10. The High-Stakes Surgery**
  A surgeon is 99% certain which artery needs repair based on standard scans. If she is wrong, the patient will die. She says to the team, "This is the artery to repair."
  *   A) The assertion was perfectly in order.
  *   B) The assertion was improper, and the surgeon is at fault.
  *   C) The assertion was improper, but the surgeon is not to blame.

  ***

  # TA Scoring Key & Norm Analysis

  **How to Score:**
  Tally the student's responses. There is no perfect "match," but dominant patterns suggest which norm guides their intuitions. Below are the predicted answer patterns for five major norms.
  *(Note: "Improper" encompasses both B and C options; the distinction between B and C tracks blameworthiness, which varies by theorist, but the permissibility verdict is the primary discriminator.)*

  ### 1. The Knowledge Norm (KN)
  *   **Core Idea:** You should assert $p$ only if you **know** $p$.
  *   **Expected Pattern:**
      *   **Improper:** 1 (Lottery), 2 (Gettier), 5 (Lucky Lie), 6 (Vague Guess), 7 (False/Justified), 8 (Blind Guess), 10 (High Stakes).
      *   **Proper:** 3 (Math Authority), 9 (Testimony). (KN usually allows testimonial knowledge).
      *   **Improper:** 4 (Moore).
  *   **Discrimination Analysis:**
      *   **vs. Justification Norm:** **Question 2 (The Broken Thermometer)** discriminates these. The Justification Norm says this is *Proper* (Dr. Lee had excellent evidence). The Knowledge Norm says *Improper* (Dr. Lee didn't *know* due to the broken device).
      *   **vs. Belief Norm:** **Question 1 (The Lottery)** discriminates these. The Belief Norm says *Proper* (Alex believes they lost). The Knowledge Norm says *Improper* (Alex doesn't *know* they lost).
      *   **vs. Truth Norm:** **Question 8 (The Blind Guess)** discriminates these. Truth Norm says *Proper* (statement matched reality). Knowledge Norm says *Improper*.

  ### 2. The Truth Norm (TN)
  *   **Core Idea:** You should assert $p$ only if $p$ is **true**.
  *   **Expected Pattern:**
      *   **Proper:** 1 (Lottery), 2 (Gettier), 3 (Math), 5 (Lucky Lie), 8 (Blind Guess), 9 (Testimony). (Assuming the statement matches facts).
      *   **Improper:** 4 (Moore - logically possible but odd), 7 (False/Justified), 10 (High Stakes - if wrong).
      *   **Note:** TN is primarily concerned with the fact of the matter, not the speaker's state.
  *   **Discrimination Analysis:**
      *   **vs. Knowledge Norm:** **Question 5 (The Lucky Lie)** and **Question 8 (The Blind Guess)**. TN permits these if the statement is true; KN forbids them because the speaker lacks knowledge.
      *   **vs. Belief Norm:** **Question 4 (The Rain Paradox)**. TN might allow this (it is raining), whereas Belief Norm forbids it (speaker lacks belief).

  ### 3. The Belief/Sincerity Norm (BN)
  *   **Core Idea:** You should assert $p$ only if you **believe** $p$.
  *   **Expected Pattern:**
      *   **Improper:** 4 (Moore), 5 (Lucky Lie), 8 (Blind Guess).
      *   **Proper:** 1 (Lottery), 2 (Gettier), 3 (Math), 7 (False/Justified), 9 (Testimony).
      *   **Variable:** 6 (Vague Guess) - depends on if "impression" counts as belief.
  *   **Discrimination Analysis:**
      *   **vs. Knowledge Norm:** **Question 1 (The Lottery)**. BN permits asserting based on statistical belief; KN forbids it because statistical probability isn't knowledge.
      *   **vs. Truth Norm:** **Question 7 (The Misled Detective)**. BN permits this (Detective believed it); TN forbids it (Statement was false).

  ### 4. The Justification Norm (JN)
  *   **Core Idea:** You should assert $p$ only if you are **justified** in believing $p$.
  *   **Expected Pattern:**
      *   **Proper:** 1 (Lottery), 2 (Gettier), 3 (Math), 7 (False/Justified), 9 (Testimony), 10 (High Stakes - 99% is justified).
      *   **Improper:** 4 (Moore), 5 (Lucky Lie), 6 (Vague Guess), 8 (Blind Guess).
  *   **Discrimination Analysis:**
      *   **vs. Knowledge Norm:** **Question 2 (The Broken Thermometer)** is the critical discriminator. This is a Gettier case. JN says *Proper* (evidence was solid). KN says *Improper* (knowledge was missing due to luck). **This is the only question that pulls apart Knowledge from Justification+Belief.**
      *   **vs. Truth Norm:** **Question 7 (The Misled Detective)**. JN says *Proper*; TN says *Improper*.

  ### 5. The Reasonable-to-Believe Norm (RBN)
  *   **Core Idea:** You should assert $p$ only if it is **reasonable** for you to believe $p$ (often context-sensitive).
  *   **Expected Pattern:**
      *   **Proper:** 1 (Lottery), 3 (Math), 6 (Vague Guess - low stakes), 9 (Testimony).
      *   **Improper:** 2 (Gettier - arguably unreasonable if luck is known, but usually Proper), 4 (Moore), 5 (Lucky Lie), 8 (Blind Guess).
      *   **Variable:** 10 (High Stakes). RBN often shifts with stakes. A strict RBN might say *Improper* here because 99% isn't reasonable when life is at stake.
  *   **Discrimination Analysis:**
      *   **vs. Knowledge Norm:** **Question 6 (The Vague Guess)** and **Question 10 (High-Stakes Surgery)**. RBN is more likely to permit Q6 (low stakes) and forbid Q10 (high stakes) than KN, which tends to be invariant regarding stakes (you either know or you don't).
      *   **vs. Justification Norm:** **Question 10**. JN usually focuses on evidence (99% is justified regardless of stakes). RBN focuses on practical reasonableness (99% isn't good enough for life-or-death).

  ***

  # Inconsistent & Non-Standard Combinations

  **The "Moore-Lie" Inconsistency**
  *   **Pattern:** Student marks **Question 4 (Moore)** as *Proper* (A) BUT marks **Question 5 (Lucky Lie)** as *Improper* (B/C).
  *   **Analysis:** This combination is logically unstable. Judging the Lucky Lie as improper implies the speaker's mental state (belief/sincerity) matters. Judging the Moorean assertion as proper implies the speaker's mental state does *not* matter (since the statement is true). Holding both suggests the student thinks sincerity matters only when lying, but not when being paradoxically honest.
  *   **Verdict:** **Unstable.** This combination is rarely held reflectively because it violates a basic consistency requirement on the role of belief in assertion.

  **The "Truth-Only" Outlier**
  *   **Pattern:** Student marks **Question 7 (False/Justified)** as *Proper* (A) BUT marks **Question 8 (Blind Guess)** as *Improper* (B/C), while marking **Question 5 (Lucky Lie)** as *Proper* (A).
  *   **Analysis:** This suggests the student thinks justification matters (Q8 improper), truth matters (Q5 proper), but falsity doesn't matter if justified (Q7 proper). This is a "Justified or True" norm (Disjunctive Norm).
  *   **Verdict:** **Unexplored.** While not logically contradictory, this disjunctive norm is not a standard position in the literature. It likely indicates the student is toggling between norms rather than holding a unified theory.

  **Discrimination Note for the TA:**
  Pay closest attention to **Question 2 (The Broken Thermometer)**. If a student marks this *Proper*, they reject the Knowledge Norm in favor of the Justification Norm (or JTB). If they mark it *Improper*, they are aligned with the Knowledge Norm. This is the single most important data point for distinguishing the two dominant contemporary theories.
