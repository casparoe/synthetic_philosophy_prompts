answer: |-
  This is a precise operational challenge: translating normative distinctions (Sen, Shue, De Waal) into a decision tree that functions under epistemic uncertainty and time pressure, without conflating *what happened* with *what we say about it*.

  Below is the **Famine Classification Protocol (FCP-48)**. It is designed for a desk officer with logistical training but no background in political economy. Following the protocol are the three worked examples and the required epistemic audit.

  ***

  # Part I: The Famine Classification Protocol (FCP-48)

  **Purpose:** To generate a provisional classification of a food crisis within 48 hours of activation.
  **Users:** Regional Desk Officers / Emergency Coordinators.
  **Constraint:** This protocol classifies *causation*, not *advocacy strategy*. The output of this protocol is an input for the Advocacy Gate (Part II), not a public statement.

  ### Phase 1: The Entitlement Filter (Sen Test)
  *Goal: Distinguish physical shortage from distributional collapse.*

  **Q1: Is there evidence of a region-wide physical absence of food (FAD), or is food available but inaccessible to specific groups?**
  *   **Data Source:** Market price data, grain stock reports, satellite crop imagery vs. mortality/malnutrition clusters.
  *   **If FAD (Food Availability Decline) only:** Proceed to Q2.
  *   **If Entitlement Failure (Prices spiked/loss of income for specific groups while food exists elsewhere):** Classify as **Man-Made**. Proceed to Phase 2.
  *   **If Data Contradictory/Unavailable:** Mark "Uncertain Causation." Proceed to Phase 2 with low confidence.

  ### Phase 2: The Capacity & Response Filter
  *Goal: Distinguish inability from unwillingness.*

  **Q2: Did the governing authority possess the logistical capacity to import or redistribute food at the onset of the crisis?**
  *   **Sufficient Answer:** Yes (e.g., functioning currency, transport infrastructure, allied support available).
  *   **Negative Answer:** No (e.g., state collapse, total blockade by superior force, no foreign reserves).
  *   **If No:** Classify as **Natural Disaster / Complex Emergency** (Terminate Classification).
  *   **If Yes:** Proceed to Q3.

  **Q3: Did the governing authority deploy available capacity to mitigate mortality?**
  *   **Sufficient Answer:** Yes (aid requested/accepted, price controls attempted, rationing implemented).
  *   **Negative Answer:** No (exports continued, aid blocked, price controls refused, reporting suppressed).
  *   **If Yes:** Classify as **Institutional Failure** (Incompetence/Overwhelm). (Terminate Classification).
  *   **If No:** Proceed to Phase 3.

  ### Phase 3: The Intent/Recklessness Filter (The Crime Threshold)
  *Goal: Distinguish negligence from instrumentalization.*

  **Q4: Is there evidence that the starvation of the affected group was foreseen and accepted as a necessary cost for a political or military objective?**
  *   **Sufficient Answer:** Yes (e.g., explicit policy linking food denial to counter-insurgency, procurement quotas known to be impossible, suppression of relief to punish a region).
  *   **Negative Answer:** No (e.g., inaction attributed to ideology, bureaucracy, or racism without specific strategic gain from the deaths themselves).
  *   **If Yes:** Classify as **Political Crime**. (Terminate Classification).
  *   **If No/Contested:** Proceed to Q5.

  **Q5: Is the evidence regarding Q4 disputed by credible internal or external observers?**
  *   **If No (Consensus on Negligence):** Classify as **Institutional Failure**.
  *   **If Yes (Credible dispute on Intent/Recklessness):** **DEFER TO HUMAN JUDGMENT.**
      *   *Action:* Flag case for Ethics Panel review.
      *   *Reason:* The distinction between "reckless indifference" and "strategic acceptance" is normative, not purely factual, under current evidence.

  ### Phase 4: Confidence Scoring
  *Assign a confidence level to the classification.*
  *   **High:** Multiple independent data streams confirm Q1–Q4.
  *   **Medium:** Reliance on single-source reporting or NGO field data.
  *   **Low:** Reliance on media reports or government denials only.
  *   *Note:* A "Political Crime" classification with "Low" confidence automatically triggers a Deferral.

  ***

  # Part II: The Advocacy Gate (Separation of Strategy)

  **Warning:** The Classification Verdict (Part I) does **not** determine the Public Stance.

  **Decision Node:** Upon receiving the Classification Verdict, the Advocacy Director must answer:
  1.  **Access Risk:** Will using this classification jeopardize country team visas or security?
  2.  **Donor Alignment:** Will this classification alienate key government donors involved in the crisis?
  3.  **Humanitarian Impact:** Will silence save more lives than speech in the next 6 months?

  **Outcomes:**
  *   **Align:** Publicly use the Classification Verdict.
  *   **Mask:** Use neutral terminology (e.g., "Humanitarian Crisis" instead of "Political Crime") despite the verdict.
  *   **Amplify:** Use stronger terminology than the verdict if the humanitarian impact justifies the risk (e.g., calling an "Institutional Failure" a "Crime" to spur action).

  *The Ethics Panel audits the Advocacy Gate decisions quarterly, not the Classification Verdicts.*

  ***

  # Part III: Worked Historical Examples

  Here the protocol is run on three contested cases. The historical record is treated as the "available evidence" a desk officer would have if they had perfect historical hindsight, to test the logic of the tree.

  ### Case 1: The Great Leap Forward (China, 1959–1961)
  *   **Phase 1 (Entitlement):** Food was available in many regions, but procurement quotas stripped rural areas of entitlement. **Verdict: Man-Made.**
  *   **Phase 2 (Capacity):** The PRC had high state capacity; grain was exported during the famine; infrastructure existed. Response was suppression of reporting, not mitigation. **Verdict: Unwillingness.**
  *   **Phase 3 (Intent):** Q4 asks if starvation was accepted as a cost for a political objective. The objective (rapid industrialization/collectivization) was pursued despite explicit reports of starvation. Local officials were punished for reporting famine.
  *   **Protocol Verdict:** **Political Crime.** (Evidence suggests foreseeability + acceptance of cost for political goal).
  *   **Confidence:** High.

  ### Case 2: Bengal Famine (1943)
  *   **Phase 1 (Entitlement):** Rice availability was not significantly lower than previous non-famine years; inflation and speculation drove entitlement collapse. **Verdict: Man-Made.**
  *   **Phase 2 (Capacity):** British Colonial Government had capacity (shipping, reserves) but prioritized war logistics. Response was slow and ideologically constrained (laissez-faire). **Verdict: Unwillingness.**
  *   **Phase 3 (Intent):** Q4 asks if starvation was accepted as a cost for a political objective.
      *   *Evidence For:* "Denial Policy" (rice/boats) implemented; Churchill's cabinet prioritized European stockpiles over Indian relief knowing the risk.
      *   *Evidence Against:* No explicit order to starve Bengal; primary objective was war victory against Japan, not the death of Bengalis *per se*. Deaths were a byproduct, not the aim.
      *   *Protocol Application:* Under a strict reading of Q4 ("necessary cost for a political objective"), the war effort was the objective. However, without a direct link showing the *deaths* were the mechanism of success (vs. just an ignored side effect), the protocol struggles.
      *   *Protocol Verdict:* **Institutional Failure.** (The protocol categorizes "reckless indifference to foreseeable death" as Failure unless "instrumentalization" is proven).
  *   **Confidence:** Medium.
  *   **Note:** This is the "uncomfortable" verdict. The protocol requires evidence that the famine was *used*, not just *ignored*.

  ### Case 3: The Irish Famine (1845–1852)
  *   **Phase 1 (Entitlement):** Potato blight (natural), but continued export of grain from Ireland to Britain (entitlement collapse). **Verdict: Man-Made.**
  *   **Phase 2 (Capacity):** UK Government had capacity. Response was constrained by Peelite laissez-faire ideology. **Verdict: Unwillingness.**
  *   **Phase 3 (Intent):** Q4 asks if starvation was accepted as a cost for a political objective.
      *   *Dispute:* Was the objective "economic restructuring of Ireland" (Crime) or "adherence to free market principles" (Failure)? Was the continued export a strategic weapon or ideological blindness?
      *   *Protocol Application:* Credible historians dispute whether the UK government *foresaw* the specific mortality scale as a necessary cost vs. believing the market would correct itself.
      *   **Protocol Verdict:** **DEFER TO HUMAN JUDGMENT.** (Triggered by Q5: Credible dispute on Intent/Recklessness).
  *   **Confidence:** Low/Medium (due to historical contestation).

  ***

  # Part IV: Epistemic Posture & Failure Modes

  Per your request, I will identify the reversing argument and the single point of failure for each verdict, followed by the systemic weakness of the procedure.

  ### 1. Great Leap Forward (Verdict: Political Crime)
  *   **Reversing Argument:** If evidence emerged that the central leadership was genuinely deceived by local reporting (the "liar's dividend") and truly believed production targets were being met until it was too late to stop, the *intent/foreseeability* element collapses. It would shift from Crime to Catastrophic Institutional Failure.
  *   **Weakest Step:** **Phase 3, Q4.** Distinguishing between "reckless pursuit of policy despite warnings" and "active acceptance of death" is a semantic line that often breaks under the weight of totalitarian bureaucracy. The protocol assumes a rationality of evil that may over-attribute intent to chaos.

  ### 2. Bengal 1943 (Verdict: Institutional Failure)
  *   **Reversing Argument:** If the definition of "Political Objective" in Q4 is expanded to include "Maintenance of Colonial Authority" where food denial is a known tool of control (even if not the primary aim), the verdict flips to Crime. If we accept that *knowing* people will die to save shipping for the war *is* instrumentalizing them, the verdict flips.
  *   **Weakest Step:** **Phase 3, Q4.** This is where your discomfort lies. The protocol privileges *direct intent* over *structural violence*. It requires a link between the death and the goal that colonial archives are designed to obscure. It risks exonerating racism that functions as negligence.

  ### 3. Irish Famine (Verdict: Deferral)
  *   **Reversing Argument:** If a consensus emerges among historians that the export of food was explicitly intended to clear tenancies for grazing land (the "genocide" thesis), the Deferral resolves to Crime. If the consensus settles on genuine ideological stupidity, it resolves to Failure.
  *   **Weakest Step:** **Phase 3, Q5.** The Deferral mechanism is the honest admission that the protocol cannot resolve normative disputes. In a live crisis, "Deferral" is a luxury desk officers do not have.

  ### Systemic Failure Mode: The "Live Crisis" Problem
  The single step in the procedure where the reasoning is most likely to fail in a live context is **Phase 2, Q2 (Capacity Assessment).**

  *   **Why:** In a live crisis, determining "State Capacity" is notoriously difficult. States often feign incapacity to solicit aid while hoarding resources (e.g., Ethiopia in the 1980s), or they appear capable but are paralyzed by internal factionalism.
  *   **The Break:** A desk officer relying on IMF data or government reports will overestimate capacity. A desk officer relying on rebel group claims will underestimate it.
  *   **Consequence:** If Q2 is answered incorrectly, the entire tree collapses. A "Natural Disaster" classification is generated for what is actually a "Siege," simply because the officer believed the state *could not* act rather than *would not*.
  *   **Mitigation:** The protocol requires a "Confidence Score." If Capacity is "Low Confidence," the procedure should automatically trigger a Deferral, but operational pressure usually forces a guess.

  ### Final Note on the Advocacy Gate
  You requested a separation of classification and tactics. I must note the risk: **The Advocacy Gate will almost always swallow the Classification Verdict.**
  In 90% of cases, if the Verdict is "Political Crime," the Advocacy Director will choose "Mask" to preserve access. If the Verdict is "Institutional Failure," they may choose "Amplify" to spur funding.
  The protocol protects the *integrity of the analysis*, but it does not protect the *truthfulness of the public message*. It ensures the organization *knows* it is lying, which is an ethical improvement, but it does not prevent the lie. This is the limit of procedure against power.
