answer: |-
  This is a sharp distinction, and you are right to suspect that the "standard rationalist answer" often glosses over the structural difference between these two resolutions. In the philosophical literature, this maps roughly onto the debate between the **Hempel-Quine** tradition (which leans toward Resolution A, accepting the logic and biting the bullet on intuition) and the **Good-Sober** Bayesian tradition (which leans toward Resolution B, attacking the implicit assumptions about experimental design).

  Here is the comparison you requested, analyzed through the lens of a committed Bayesian epistemology.

  ### 1. Do they disagree, or just redistribute the error?

  They fundamentally disagree on **whether confirmation occurs at all**, not just on how much of it occurs.

  **Resolution A (Quantitative)** claims that the logical relation of confirmation *does* obtain. It asserts that $P(H | \neg B \land \neg R) > P(H)$. The error is purely psychological: human intuition treats very small likelihood ratios as unity ($LR \approx 1$), whereas the math says $LR = 1 + \epsilon$. On this view, if you had perfect intuition, you would feel a tiny "ping" of confirmation when seeing a white shoe.

  **Resolution B (Screening-Off)** claims that the logical relation *does not* obtain in realistic contexts. It asserts that $P(H | \neg B \land \neg R \land K) = P(H | K)$, where $K$ includes the knowledge of *how the object was selected*. The error is logical/procedural: applying Nicod's criterion without conditioning on the sampling protocol. On this view, even with perfect intuition, you should feel *no* ping, because the evidence was screened off by the background knowledge that you were looking at a shoe.

  They are not merely distributing the same correction differently. Resolution A says "Your intuition is wrong about the magnitude." Resolution B says "Your intuition is right about the null result, but wrong about *why* (it's not logic, it's sampling)."

  ### 2. Which better dissolves the paradox for a committed Bayesian?

  **Resolution B is superior for a committed Bayesian.**

  A core tenet of Bayesianism is that all probability is conditional on background knowledge ($K$). Resolution A implicitly assumes a "View from Nowhere" $K$ where the object is selected uniformly from the universe of all objects. This is almost never the actual $K$ possessed by an observer.

  In reality, observation is a **two-step process**:
  1.  **Selection:** You select an object based on some criteria (e.g., "I am looking at a shoe," or "I am looking at a bird").
  2.  **Inspection:** You observe a property of that object (e.g., "It is white," or "It is black").

  Resolution A collapses these steps. It treats the evidence as "Here is an object, and it happens to be a white shoe."
  Resolution B respects the order. It treats the evidence as "I selected a shoe, and it happens to be white."

  If you select a shoe, you have already conditioned on $\neg R$. The probability of the hypothesis $H$ (All Ravens are Black) given that you are looking at a shoe is independent of the shoe's color, *unless* there is a causal link between shoe-color and raven-color. Formally:
  $$P(H | \text{Shoe} \land \text{White}) = P(H | \text{Shoe})$$
  The "Shoe" variable screens off the "White" variable from the "Raven" hypothesis.

  Resolution B's reliance on context-relativity is not a bug; it is a feature. Confirmation is not a relation between a proposition and a state of the world; it is a relation between a proposition, evidence, and a **sampling distribution**. Resolution A tries to make confirmation a property of the proposition alone (logical confirmation), while Resolution B correctly identifies it as a property of the *experiment* (experimental confirmation). For a Bayesian who cares about updating on actual evidence rather than logical abstractions, B is the only coherent stance.

  ### 3. The Toy World: Scarce Non-Blacks

  Imagine a world where Non-Black objects are as rare as Ravens. (Perhaps everything is Black unless it is a Raven or a rare White Shoe).

  **Does observing a white shoe confirm that all ravens are black to a non-negligible degree?**

  *   **Under Resolution A:** Yes. If Non-Blacks are rare, finding *any* Non-Black object is a significant event. Eliminating one from the set of potential counter-examples (Non-Black Ravens) significantly reduces the probability space where $H$ is false. The magnitude of confirmation scales with the rarity of Non-Blacks.
  *   **Under Resolution B:** It depends entirely on *how you found the shoe*.
      *   If you sampled "Random Object from Universe," then yes, confirmation is high (B agrees with A here).
      *   If you sampled "Random Shoe," then no. Even if White Shoes are rare, if you selected the object *because it was a shoe*, the rarity of whiteness does not update you about ravens (assuming independence).

  **Does this vindicate A or B?**

  It vindicates **Resolution A's math** but **Resolution B's pragmatics**.

  The thought experiment shows that Resolution A is mathematically consistent: if you change the base rates, the likelihood ratio changes. This proves that the "negligibility" in our world *is* partially due to base rates (as A claims).

  However, it does not defeat Resolution B. Even in the Toy World, if you walk into a shoe store and look at a white shoe, you still learn nothing about ravens. The intuition that "white shoes don't matter" remains robust *if* the sampling protocol is held constant. The Toy World shows that the *potential* for confirmation exists (A), but Resolution B explains why that potential is almost never realized in practice (because we don't sample random objects from the universe).

  Therefore, the Toy World suggests that the "Standard Rationalist Answer" (A) is a special case of the more general Bayesian truth (B). A is true only when the sampling protocol is "Random Object." B is true regardless of the protocol, because it explicitly models the protocol.

  ### 4. The Definitive LessWrong Explainer

  If I were writing this for LessWrong, I would endorse **Resolution B**.

  Why? Because the rationalist community places a high premium on **checking your premises** and understanding **selection effects**. Resolution A encourages "shut up and calculate" thinking which can lead to mind-projection fallacies (treating logical relations as physical forces). Resolution B encourages thinking about *how* information is gathered, which generalizes to survivorship bias, anthropic reasoning, and experimental design.

  Resolution A tells you your intuition is broken. Resolution B tells you your intuition is tracking a real structural feature of evidence (sampling protocols) that the naive formalism ignored.

  **Headline:** The Raven Paradox is a Sampling Bias, Not a Magnitude Illusion.

  **Single-sentence conclusion:**
  "White shoes do not confirm that all ravens are black because you never encounter white shoes by searching for non-black things; the paradox dissolves once you condition on the protocol that brought the evidence to your attention."
