      *   **The Empirical Target:** Are we explaining the *behavior* (why do people do it?) or evaluating the *norm* (should they do it?). The group is likely conflating descriptive and normative claims.

  6.  **Develop Paths for Progress:**
      *   *Conceptual:* Distinguish "Rationality as Consistency" vs. "Rationality as Fitness/Goodness."
      *   *Formal:* Can we model nonseparable preferences without opening the door to *any* behavior (loss of predictive power)?
      *   *Empirical:* The animal data isn't about rationality per se, but about *mechanisms*. Need experiments that dissociate "signaling" from "completion utility."
      *   *ML Angle:* How does an RL agent handle sunk costs? (Exploration vs. Exploitation, or commitment devices).

