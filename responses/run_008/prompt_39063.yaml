  10. **Actionable Advice:** Stop asking "Is it rational?" Ask "Under which axioms does this behavior maximize utility?" and "What mechanism produces this behavior?" Separate the Normative from the Descriptive.

  (Self-Correction during drafting): I need to make sure I don't just say "it's complicated." I need to give a decisive diagnosis. The diagnosis is that the group is conflating *justifications* for the behavior with *evaluations* of the behavior. Also, the "Rationality" term is doing too much work.

  Let's structure the response around:
  1.  The Diagnosis (It's not verbal, it's axiomatic).
  2.  The Dissenter Fragmentation (The hidden blocker).
