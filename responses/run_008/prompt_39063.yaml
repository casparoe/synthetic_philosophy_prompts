  4.  The Path Forward (Specific deliverables).

  (Final check against user prompt): Did I engage the ML person? The Philosopher? The Economists? Yes, by mapping their concerns to the axioms. Did I address the animal data? Yes, as mechanistic vs normative. Did I address the user's hypothesis? Yes, validated but refined.

