      *   *Addressing the Animal Data:* It's a red herring for the *normative* question but vital for the *mechanistic* question.
      *   *Addressing the ML Person:* RL agents don't have sunk costs unless programmed with specific memory states or commitment constraints. This is a modeling choice, not a discovery.

  8.  **Refining the Diagnosis:**
      *   Is it verbal? No, because the consequences differ (policy advice).
