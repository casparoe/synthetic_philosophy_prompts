          1.  *Information-Rationalizers:* Past cost signals quality/commitment. (User notes this fails in controlled designs).
          2.  *Nonseparable Preferences:* Utility depends on history (e.g., "completing what I started" has intrinsic value). Money pumps assume separability.
          3.  *Resolute Choice (McClennen):* Plan-based rationality. Binding oneself to a prior plan is rational to avoid dynamic inconsistency.
      *   **Empirical Wrinkle:** Animal data (Arkes & Ayton vs. contesters). Is it a human cognitive bug or adaptive?

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Orthodox = Idealized/Dynamic Consistency; Dissenters = Bounded/Policy-based.
      *   *Critique:* It's partially right but too charitable. It risks dissolving the conflict too easily ("finished, not stalled"). The conflict is deeper than just "different standards." It's about the *definition of the agent* and the *normative force of consistency*.
      *   *Refinement:* The disagreement is substantive *because* the definitions of rationality rely on incompatible metaphysical assumptions about agency (temporal parts vs. whole persons) and the normative weight of consistency vs. substantive goodness.

  4.  **Diagnose the Stalemate (The "Kind" of Disagreement):**
      *   It's not merely verbal. It's a **Category Error in Normative Modeling**.
      *   The Orthodox treat the agent as a *sequence of choice nodes* (graph theory).
      *   The Dissenters treat the agent as a *narrative unity* (philosophical psychology).
      *   The "Rationality" label is the battlefield, but the war is about **Dynamic Consistency vs. Substantive Goodness**.
      *   *Key Tension:* The dissenters aren't a monolith.
