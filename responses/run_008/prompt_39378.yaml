answer: |-
  This is a sharp diagnosis of a common failure mode in longtermist and intergenerational ethics. You are right that slogans like "the future is vast" often function as conversation-stoppers rather than action-guiding principles. Your verdicts are internally rich but contain specific tensions that prevent them from forming a single, smooth function.

  Here is an analysis of the principle underlying your verdicts, the conflicts that need resolution, and the predictions for your test cases.

  ### 1. The Extracted Principle: Asymmetric Time-Neutrality with Capacity Weighting

  Your verdicts do not fit a standard utilitarian time-neutral model (which would struggle with V3 and V5), nor a standard contractarian model (which would struggle with V1 and V2). Instead, they map onto a hybrid view I will call **Asymmetric Time-Neutrality with Capacity Weighting**.

  This view distinguishes between **Negative Duties** (constraints against harming/imposing risk) and **Positive Duties** (obligations to benefit/aide), treating time differently in each domain.

  *   **Rule A (Negative Duties are Time-Neutral):** Imposing catastrophic harm or rights violations on future people is morally equivalent to imposing them on present people. Identity dependence (the Non-Identity Problem) does not negate this.
      *   *Supports:* V1 (killing 1B), V2 (Non-Identity), V4 (no pure discounting on harm).
  *   **Rule B (Positive Duties are Capacity-Sensitive & Epistemically Discounted):** Obligations to confer benefits are weighted by the agent's ability to pay and the epistemic certainty of the outcome. Psychological proximity to contemporaries is permitted as a tie-breaker or heuristic for uncertainty, but not as an intrinsic moral good.
      *   *Supports:* V3 (present poor priority), V6 (rich vs. poor generation), V4 (uncertainty discounting).

  ### 2. Resolving the Conflicts

  To make this system coherent, you must resolve two specific tensions. You cannot keep all your verdicts without introducing ad hoc epicycles.

  **Conflict 1: The V4 vs. V5 Tension (Principle vs. Intuition)**
  *   *The Conflict:* V4 states pure time discounting is indefensible. V5 admits you care less about £120 in 2200 than £100 now for the *same* recipient, even controlling for uncertainty.
  *   *The Verdict:* **Overturn V5.**
  *   *Reasoning:* V5 is a psychological bias (hyperbolic discounting), not a moral principle. If you retain V5, you undermine V1. If a life in 2200 is intrinsically worth less than a life today (which V5 implies), then killing a billion in 2200 *should* be less wrong than killing a billion today. You explicitly reject this in V1. To maintain coherence, you must treat the V5 intuition as a cognitive bug to be corrected, similar to how one corrects for scope neglect. Your reflective judgment (V4) overrides your System 1 intuition (V5).

  **Conflict 2: The V1 vs. V3 Tension (Harm vs. Benefit)**
  *   *The Conflict:* V1 suggests strict time neutrality (killing 1B in 2200 = killing 1B today). V3 permits prioritizing present poor over future poor. Why is harm time-neutral but benefit allocation time-sensitive?
  *   *The Verdict:* **Refine V3 via Epistemic/Agency Grounds.**
  *   *Reasoning:* You can keep V3, but you must justify it without appealing to *time* itself. The justification must be **uncertainty** and **agency**.
      *   *Uncertainty:* We know the present poor exist and suffer; future poverty projections are probabilistic.
      *   *Agency:* Present people can participate in cooperative schemes; future people cannot.
      *   If you claim V3 is valid *even if* we are certain the future people will be equally poor and unable to reciprocate, then V3 contradicts V1. To be coherent, you must admit that if we had perfect certainty about future suffering, the permission to prioritize the present would vanish. V3 is a heuristic for uncertainty, not a fundamental moral truth.

  ### 3. The Resulting Account

  Your coherent moral theory is:
  > **We have a strict, time-neutral duty not to impose catastrophic risks or rights violations on future people, regardless of their identity or our benefit. However, our duty to actively sacrifice resources to benefit future people is limited by our own economic capacity and discounted by the epistemic uncertainty of the outcome.**

  ### 4. Predictions for the Undecided Cases

  Here is how this principle applies to the two cases you left open.

  **Case 1: A rich generation asked to forgo a modest gain to prevent a small but certain harm to a very large number of people ten thousand years hence.**
  *   **Analysis:** This falls under **Negative Duties (Rule A)**.
  *   **Variables:**
      *   *Agent:* Rich (High capacity).
      *   *Cost:* Modest (Low burden).
      *   *Harm:* Small per person, but *very large number* (Aggregate harm is significant).
      *   *Time:* 10,000 years (Extreme distance).
      *   *Uncertainty:* Stipulated as "certain."
  *   **Verdict:** **The generation is obligated to forgo the gain.**
  *   **Reasoning:** Under Asymmetric Time-Neutrality, the temporal distance is morally irrelevant for negative duties (harm prevention). Since the harm is certain and the aggregate magnitude is high (small harm × very large number), and the cost to the agent is modest, the time-neutral constraint against harming overrides the temporal distance. The 10,000-year gap does not license rights violations.

  **Case 2: A very poor generation asked to bear substantial costs now to benefit future people who, on credible projections, will be much richer than they are.**
  *   **Analysis:** This falls under **Positive Duties (Rule B)**.
  *   **Variables:**
      *   *Agent:* Very Poor (Low capacity).
      *   *Cost:* Substantial (High burden relative to capacity).
      *   *Benefit:* Future people richer (Lower marginal utility of transfer).
      *   *Time:* Future.
  *   **Verdict:** **The generation has no obligation (or a negligible one) to bear these costs.**
  *   **Reasoning:** Positive duties are capacity-sensitive. A "very poor" generation is likely below the threshold where substantial sacrifice is required, especially when the recipients are wealthier. This aligns with V6 (poor generations have weaker obligations) and standard diminishing marginal utility. The fact that the recipients are future people is secondary; the primary veto is the **capacity constraint** of the duty-bearer and the **inefficiency** of transferring resources from poor to rich.

  ### 5. Philosophical Context & Critique

  Your derived view is philosophically robust but places you in a specific niche within the literature:

  1.  **Rejection of Pure Longtermism:** Standard EA Longtermism often argues that because the future is vast, we should prioritize it *even at high cost to the present* (if the expected value is high). Your V3 and V6 reject this. You are closer to a **Sufficientarian** or **Prioritarian** view regarding the present generation: we must not harm the future, but we are not required to immolate the present poor for the sake of the future rich.
  2.  **The Non-Identity Solution:** Your V2 aligns with the "Same Number Quality Claim" (Parfit) or a "Harm-Based" account that ignores identity dependence (e.g., Hanser, Harman). You treat the *state of affairs* (a billion dead) as the object of moral concern, not the *identity* of the victims.
  3.  **The Vulnerability:** Your view's weakest point is the **Asymmetry**. Critics will ask: *Why* is time irrelevant for harm but relevant (via uncertainty/capacity) for benefit?
      *   *Defense:* You must argue that rights (not to be killed) are trumps, while beneficence is a matter of optimization. Rights are binary and time-invariant; optimization is sensitive to leverage and knowledge.

  **Summary Recommendation:**
  To finalize your position, explicitly disavow V5 as a bias. Ground V3 strictly in epistemic uncertainty and agency rather than "special obligation to contemporaries." This yields a consistent framework: **Do not harm the future (time-neutral); help the future only if you can afford it and know it works (capacity/uncertainty-weighted).**
