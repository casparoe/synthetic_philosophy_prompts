answer: |-
  You have correctly identified that "common knowledge" is the *state* required for the resolution, but it is not the name of the *mechanism* that traverses the gap between mutual knowledge and action. Your intuition is sharp: there is a specific temporal-epistemic structure here that is often glossed over by simply pointing to the Aumann/Lewis tradition.

  There is no single, universally standardized noun phrase (like "The Doppler Effect") for this specific countdown mechanism in the broader literature. However, in the subfields of **Dynamic Epistemic Logic (DEL)** and **Distributed Computing**, it is precisely characterized.

  If you need a term to use in conversation that will be recognized by those familiar with the mechanics, the most accurate existing technical description is **Iterated Elimination of Ignorance** (analogous to Iterated Elimination of Dominated Strategies) occurring within a **Synchronous System**.

  However, to carve the concept precisely as you requested, the best candidate name for the *temporal structure itself* is **The Synchronous Epistemic Countdown** (or **Epistemic Depth Unwinding**).

  Here is the precise carving of the concept, the conditions required for it to function, and the boundary cases you asked for.

  ### 1. The Definition: Synchronous Epistemic Unwinding

  **The Mechanism:** A process wherein a finite tower of nested mutual knowledge ($E^k \phi$) is converted into coordinated action over $k$ discrete time steps, driven by the public observability of inaction.

  **The Structural Isomorphism:** The mechanism relies on an isomorphism between **Epistemic Depth** (how many times "everyone knows" is nested) and **Temporal Depth** (how many rounds of observation have passed).
  *   Time $t=0$: State is $E^k \phi$ (Everyone knows... $k$ times).
  *   Time $t=1$: Public silence eliminates the possibility that the world was one where knowledge was only depth $k-1$. State becomes effectively $E^{k-1} \phi$ relative to the action condition.
  *   Time $t=k$: The tower unwinds to action.

  **Necessary Conditions:**
  For the "fuse" to burn deterministically, three conditions must hold:
  1.  **Synchrony:** All agents share a global clock (or a mutually observed sequence of rounds). Everyone knows that everyone knows that the sun rose today. If agents are asynchronous (like the Email Game), the correspondence between "rounds" and "knowledge depth" breaks.
  2.  **Perfect Recall:** Agents remember all past public announcements and all past instances of public inaction.
  3.  **Public Observability of Inaction:** The *absence* of an action must be as publicly visible as the *presence* of an action. In the Blue-Eyed puzzle, "nobody left" is a public announcement equivalent to "I do not yet know my eye color."

  ### 2. Why "Common Knowledge" is Insufficient

  You are right to reject "common knowledge" as the label. Common knowledge ($C \phi$) is the *limit* of the tower as $k \to \infty$.
  *   **Common Knowledge:** The fuse has length zero. If the fact were truly common knowledge *ex ante* (not just mutual knowledge of depth 100), the islanders would leave on Night 1.
  *   **The Countdown:** Exists *only* when you have **Finite Mutual Knowledge** ($E^k \phi$) but not Common Knowledge ($C \phi$). The countdown is the process of simulating common knowledge through time.

  Therefore, the mechanism is not "achieving common knowledge" (which is impossible in finite time without the announcement); it is **exhausting the finite depth of mutual knowledge**.

  ### 3. Boundary Cases

  You asked specifically about the edges of this definition. Here is how the **Synchronous Epistemic Countdown** behaves at the limits.

  #### Case A: The Infinite Tower (Genuine Common Knowledge)
  *   **Scenario:** The visitor's announcement creates genuine $C \phi$ immediately (perhaps via a magical broadcast that guarantees infinite nesting).
  *   **Effect on the Fuse:** The fuse length is zero.
  *   **Outcome:** Immediate coordination. If the blue-eyed islanders had common knowledge *before* the visitor spoke (which they didn't), they would have left immediately. The visitor's announcement converts $E^{100} \phi$ into a process that *generates* $C \phi$ over time. If $C \phi$ existed at $t=0$, the unwinding mechanism is bypassed entirely.
  *   **Technical Term:** This is the **Common Knowledge Threshold**. Below the threshold (finite $k$), you get the countdown. At the threshold (infinite $k$), you get immediate equilibrium.

  #### Case B: The Broken Clock (The Email Game / Asynchrony)
  *   **Scenario:** Rubinstein's Email Game. Messages are sent, but confirmations might fail.
  *   **Effect on the Fuse:** The **Synchrony Condition** fails. Agent A does not know if Agent B received the last confirmation. Therefore, Agent A cannot be sure what "round" Agent B thinks they are in.
  *   **Outcome:** The isomorphism between Time and Knowledge Depth collapses. You cannot count down because you don't know what number you are counting down *from*. Even if the chain of confirmations is 1,000,000 links long, the probability that the *other* person knows the chain is 1,000,000 links long is slightly less than 1.
  *   **Result:** The **Rubinstein Discontinuity**. The countdown mechanism does not "slow down"; it breaks. Coordination reverts to the prior (no coordination) regardless of the height of the tower, because the tower is probabilistic, not deterministic.
  *   **Technical Term:** This is analyzed under **Approximate Common Knowledge** (Monderer & Samet, 1989). They introduce **$p$-belief**. The "countdown" survives only if the system is synchronous; in asynchronous systems, finite $p$-belief cannot sustain the unwinding for coordination tasks requiring $C \phi$.

  #### Case C: Private vs. Public Rumors
  *   **Scenario:** Everyone hears a rumor privately vs. a podium announcement.
  *   **Mechanism:** Private hearing establishes $E^1 \phi$ (maybe $E^2$ if I know you heard it). Podium announcement establishes $E^\infty \phi$ (Common Knowledge).
  *   **Effect:** Without the podium, the "tower" is too short to support the unwinding required for high-stakes coordination (e.g., revolution, market panic). The fuse burns out before it reaches the action threshold.
  *   **Term:** This is often called the **Pluralistic Ignorance Barrier**. The countdown cannot start because the initial depth $k$ is too low (usually $k=1$ or $2$).

  ### 4. Proposed Terminology for Your Use

  Since you are writing for or speaking to the rationalist blogosphere, where precision is valued but jargon varies, I recommend using **Epistemic Depth Unwinding**.

  If you need to refer to the specific phenomenon where silence advances the clock:
  > "This is a case of **Synchronous Epistemic Unwinding**. The public silence acts as an iterative operator on the mutual knowledge state, reducing the depth of the knowledge tower by one level per round until the action threshold is reached."

  If you want to reference the fragility of the mechanism (the Email Game case):
  > "The coordination failed because the system lacked **Synchrony**, breaking the **Time-Knowledge Isomorphism** required for the unwinding."

  ### Summary of the Carving

  | Feature | The Mechanism (Your Target) | General Common Knowledge |
  | :--- | :--- | :--- |
  | **State** | Finite Mutual Knowledge ($E^k \phi$) | Infinite Mutual Knowledge ($C \phi$) |
  | **Dynamics** | Discrete, Temporal Unwinding | Static, Atemporal State |
  | **Driver** | Public Observation of Inaction | Logical Necessity |
  | **Requirement** | **Synchrony** & Perfect Recall | None (Logical abstraction) |
  | **Failure Mode** | **Rubinstein Discontinuity** (Asynchrony) | None |
  | **Name** | **Synchronous Epistemic Unwinding** | Common Knowledge |

  The "fuse" you perceive is the **distance between Finite Mutual Knowledge and Common Knowledge**, traversed via **Synchronous Public Updates**. When that distance is infinite (true Common Knowledge), the fuse vanishes. When the synchrony breaks (Email Game), the fuse becomes unlightable.
