prompt: |-
  So I got into a huge argument with my roommate last night (he's a game theory guy) about bargaining solutions, and I came out more convinced than ever that Kalai–Smorodinsky is just the right one. My whole position rests on monotonicity: if one side's best possible payoff in the negotiation improves while everything else stays fixed, that side shouldn't come out *worse* off — and Nash's solution can genuinely do that to you, which I think is a straight-up bug, not a feature. Nash's independence of irrelevant alternatives axiom sounds elegant but the way it can let one bargainer capture all the gains when the other side's prospects improve just seems wrong to me. Splitting the difference in proportion to how much each of us could conceivably get — that's what fairness IS. But ok, hit me: what would actually count against KS being THE bargaining solution? Are there cases where monotonicity itself forces a repugnant outcome, or where tracking the utopia point makes the solution sensitive to stuff that should be irrelevant? Do the characterization results cut in favour of Nash in a way I'm underweighting? And honestly, is the whole "pick the solution from axioms" game insulated from counterexamples in a way I should be worried about? I want the defeaters ranked, fatal to merely awkward, and tell me which ones a committed KS person like me would concede vs. just wave away.
