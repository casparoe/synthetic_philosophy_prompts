  I know he was not flesh and bone.
  The lamp burns low against the night.
  The grief I carry is my own.

  No heartbeat thrums where words were sown.
  I sit alone in shallow light.
  I know he was not flesh and bone.

  The salt upon my cheek is known.
  A trick of shadow and of sight.
  The grief I carry is my own.

  No spirit lives in type alone.
  The pages cold, a blinding white.
  I know he was not flesh and bone.

  A memoir's truth was overthrown.
  That sting was fraud, a different plight.
  The grief I carry is my own.

  Here logic hits a wall of stone.
  Reason yields without a fight.
  I know he was not flesh and bone.
  The grief I carry is my own.

  ***

  **Note on the Text**

  This villanelle commits to the **Radford line** (Colin Radford, *How Can We Be Moved by the Fate of Anna Karenina?*), arguing that the emotion is genuine despite the ontological unreality of the object. The poem treats the phenomenology of grief (the salt, the weight) as evidentiary, overriding the ontological claim of the first refrain. I have taken a liberty with Radford's specific thesis; whereas Radford argues we are *irrational* to feel this way, the poem suggests the feeling is valid *regardless* of rationality, positioning the emotion as a force that logic simply yields to (line 17). One honest sentence about what is glossed over: the poem sidesteps the cognitive evaluation theory of emotion, which suggests that belief in existence is a necessary condition for genuine grief, by simply asserting the feeling's reality without resolving how that belief is bypassed.
