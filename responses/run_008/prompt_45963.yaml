answer: |-
  Honorable Mayor, Members of the Council, Distinguished Scholars, Citizens of The Hague,

  Three hundred and fifty years ago, a man died in this city. He was not a mayor, not a councilor, not a statesman. He was a lens-grinder who lived in a small room on the Paviljoensgracht. He was excommunicated by his own community and viewed with suspicion by the authorities of his time. Yet, Baruch Spinoza left us a question that is more urgent tonight than it was in 1677: How can we live together in freedom?

  I stand before a room divided, in a sense, by profession. Half of you spend your lives interpreting Spinoza's texts; the other half spend your lives interpreting the needs of this city. My task tonight is to bridge that gap. We are gathered to honor a philosopher, but we are also on the eve of a debate about the practical machinery of democracy: the expansion of this city's citizen assemblies.

  Spinoza is often claimed by democrats as a patron saint. And rightly so. In his *Theological-Political Treatise*, he writes that democracy is the most natural form of state, the one that comes closest to the freedom nature grants to everyone. But if you read further, a tension emerges. A tension that should make every councilor in this room lean forward.

  Because the same Spinoza who praises democracy also has a stark, unsentimental view of human nature. He does not believe the average person is a rational angel. He knows we are driven by passions. We are easily led by fear. We are susceptible to superstition. We chase short-term pleasures and avoid short-term pains. If democracy depends on every individual voter being wise, calm, and purely rational, Spinoza would tell you: do not bother. It will fail.

  Yet, in his unfinished *Political Treatise*, he offers a solution. He suggests that the multitude, when deliberating together, can judge better than any single member alone. How can this be? How can a group of passionate, fearful, hopeful individuals produce wisdom if they are not wise individually?

  This is the spine of Spinoza's political thought, and it is the key to your debate tomorrow. Spinoza's argument for democracy does not rest on the wisdom of the typical voter taken one at a time. It rests on aggregation and institutional design.

  For Spinoza, a passion is a force. Fear is a force. Hope is a force. Anger is a force. In a tyranny, these forces are manipulated by one man to crush the rest. In a democracy, the goal is not to eliminate these passions—we cannot. The goal is to arrange the state so that these passions counterbalance one another. One person's fear is checked by another's hope. One person's anger is cooled by another's caution.

  Therefore, Spinoza does not support rule by raw majority sentiment. He supports arrangements that transform private passions into collective counsel.

  What does this mean for you, as you prepare to debate the citizen assembly? It means you must stop thinking of the assembly as a voting booth and start thinking of it as a machine for processing emotions into reasons.

  If you follow Spinoza's logic, the composition of the assembly matters less for the sake of "representation" in a symbolic sense, and more for the sake of friction. You need a diversity of affects. If everyone in the room shares the same fear, you will not get wisdom; you will get panic. If everyone shares the same hope, you will not get policy; you will get fantasy. The assembly must be composed so that the passions present are varied enough to check and balance one another during deliberation.

  But composition is only the beginning. The procedure is where the alchemy happens. Spinoza would warn you against assemblies that simply aggregate pre-existing opinions. If you ask citizens to arrive with fixed views and merely vote, you are counting passions, not refining them. You are amplifying superstition, not curing it.

  Instead, the design must force the transformation of those passions. This requires time. It requires that participants be exposed to conflicting arguments not as enemies, but as necessary counter-weights. It requires that the process slows down the impulse to react. Spinoza's freedom is not the liberty to do whatever you want in the moment; it is the liberty to live under laws that you have prescribed to yourself through reason. Reason, for Spinoza, is rarely a solitary act. It is a social achievement. It happens when we speak, when we are challenged, and when we realize that my power is increased by joining with yours.

  So, for the councilors: Do not design an assembly that asks, "What do you want?" Design one that asks, "What can we sustain?" Do not use the assembly to legitimize decisions you have already made; that is manipulation, and Spinoza knew that manipulation breeds resentment and instability. Use it to generate decisions that no single faction could have produced alone.

  However, as we honor Spinoza, we must also be honest about him. We are scholars and citizens of the twenty-first century, not the seventeenth. We must acknowledge that Spinoza's own vision of the "multitude" was limited. He excluded women. He excluded servants. He excluded those without property. He believed they were too dependent on the will of others to exercise independent political judgment.

  We know now that he was wrong. Dependence does not negate the capacity for reason; often, it sharpens the understanding of power. We stand on his shoulders, but we see further than he did. We adopt his method—the belief that institutions can channel human passion toward freedom—but we reject his boundaries. A true Spinozist assembly today must include those voices he silenced. Their passions, their fears, and their hopes are not obstacles to the state; they are the very material from which a stable state is built. Excluding them does not protect the state; it weakens it, because it leaves powerful affects outside the system, where they become destructive forces rather than constructive counsel.

  So, as you enter your debate tomorrow, remember this: Spinoza does not offer you a guarantee that the people will be right. He offers you a mechanism to make them wiser together than they are apart.

  If you treat the citizen assembly as a plebiscite on raw opinion, you invite the superstition he warned against. But if you treat it as a deliberative body designed to balance passions, to slow down judgment, and to force the collision of different perspectives until a common reason emerges, then you are building something Spinoza would recognize.

  You are building a state that is not based on the silence of the subjects, but on the reasoned agreement of citizens. You are building a machine that turns the lead of human fear into the gold of collective power.

  Spinoza died in this city. But his question lives here still. Can we be free? His answer was: Yes, but only if we design our freedom carefully. Only if we build institutions that make us better than we are on our own.

  That is the work of the scholar. That is the work of the councilor. And tonight, it is the work of us all.

  Thank you.
