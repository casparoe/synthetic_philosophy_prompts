  ### Drafter's Preface: Analysis of the Dispute

  Before presenting the joint statement, I must record my assessment of the dialectical landscape to ensure the document's integrity.

  **Substantive vs. Verbal Disputes:**
  A significant portion of the conflict appears verbal regarding the definition of **Omniscience**. The Molinist defines it as "knowledge of all true propositions," while the Open Theist defines it as "knowledge of all *knowable* propositions." If this were merely a lexical disagreement, they could agree on the extension of God's knowledge and simply label it differently. However, the dispute is **substantive** because it rests on divergent metaphysical commitments regarding the *nature of truth* (specifically, bivalence for future contingents). They disagree on whether there *are* truths to be known, not just on whether God knows them.

  Another potential verbal dispute concerns **Providence**. The Molinist conceives of providence primarily as *planning* (actualizing a world where goals are met via CCFs), while the Open Theist conceives of it as *dynamic governance* (responding to events to ensure goals are met). However, both agree that providence requires God to successfully achieve His ultimate ends without violating libertarian freedom. I have drafted the agreed claims to focus on this functional overlap rather than the mechanistic difference.

  **Signability Check:**
  I have excluded any claim that implies the "settledness" of the future (which the Open Theist would reject) or the "risk" inherent in creation (which the Molinist would reject). Both parties reject *Simple Foreknowledge* (the view that God merely perceives the future timeline without willing it), as both find it incompatible with robust providence. This shared rejection forms the backbone of Section 1.

  ***

  # JOINT STATEMENT ON DIVINE KNOWLEDGE AND PROVIDENCE

  **Parties:** The Molinist Signatory and The Open Theist Signatory
  **Drafter:** Neutral Philosophical Arbiter
  **Date:** October 26, 2023

  ## 1. Shared Affirmations

  We, the undersigned, affirm the following propositions as the common ground of our theological and philosophical commitment. We assert that these claims are compatible with classical theism, orthodox Christian doctrine (as we respectively interpret it), and rigorous philosophical reasoning.

  1.  **Divine Perfection:** God is the necessary, uncreated, omnipotent, and perfectly good creator of all that exists. God's nature is immutable in character and promise, though God may relate dynamically to creation.
  2.  **Libertarian Freedom:** Human beings (and other relevant creatures) possess libertarian freedom. In at least some morally significant choices, an agent is able to choose otherwise than they do, even given the exact same prior causal history and natural laws. Creaturely choices are not determined by God, nor by prior physical causes, nor by divine foreknowledge.
  3.  **Rejection of Theological Determinism:** We jointly reject Calvinism, theological determinism, and any view wherein God causally determines the specific choices of free creatures. Evil and sin are not willed or determined by God, though God permits them for reasons consistent with His goodness.
  4.  **Rejection of Simple Foreknowledge:** We jointly reject the view of "Simple Foreknowledge" (the notion that God's knowledge of the future is merely passive observation of a fixed timeline). We agree that mere passive knowledge of future free actions would not allow God to providentially govern history, as one cannot act upon what one merely observes without the power to influence the conditions surrounding it.
  5.  **Exhaustive Knowledge of Reality:** God possesses exhaustive knowledge of the past and the present. God knows Himself perfectly. God knows all logical possibilities and all necessary truths. There is no fact about reality that God is unaware of, excepting only those future contingents which we disagree about (see Section 2).
  6.  **Providential Success:** God's providential governance is real and effective. God is capable of ensuring that His ultimate purposes for creation are achieved without violating creaturely freedom. History is not a chaotic accident; God is sovereign, though we differ on the mechanism of that sovereignty.
  7.  **The Value of Freedom:** God values libertarian freedom sufficiently to create a world where it is possible for creatures to oppose Him. The existence of genuine relationship requires the possibility of rejection.

  ## 2. Table of Residual Disagreements

  The following table outlines the specific metaphysical and epistemological points where we remain in irreconcilable conflict. We agree that these are not merely semantic but reflect deep divergences in our understanding of truth, modality, and divine aseity.

  | # | Statement of Disagreement | The Crux | Shared Test / Argument & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Truth Value of Future Contingents (The Quantum Coin Case)**<br><br>**Molinist:** Consider an indeterministic quantum coin that will be flipped once in the future. The proposition "If flipped, the coin would land Heads" has a determinate truth value (True or False) prior to the flip, known by God.<br><br>**Open Theist:** The proposition "If flipped, the coin would land Heads" has no truth value prior to the flip. It is neither true nor false. God knows the probabilities, but not the outcome. | **The Metaphysics of Truth:** Does truth require an ontological ground in actuality or necessity? Can a proposition be true solely based on what *would* happen in a non-actual scenario involving indeterminacy? | **Test:** The "Grounding Objection."<br><br>**Molinist Prediction:** We predict that a coherent semantics for counterfactuals can be developed (e.g., via possible worlds similarity) that does not require causal grounding, preserving bivalence.<br><br>**Open Prediction:** We predict that without a causal or logical necessitor, assigning a truth value is arbitrary and violates the principle that truth supervenes on being. |
  | **2** | **Divine Independence and Aseity**<br><br>**Molinist:** God's Middle Knowledge (knowledge of CCFs) does not compromise divine independence. These truths are not "outside" God in a way that limits Him; they are aspects of God's own knowledge of His power and creaturely essences.<br><br>**Open Theist:** If CCFs are true prior to God's decree, they are contingent truths not willed by God. This makes God's knowledge dependent on something other than Himself (the creature's hypothetical response), compromising Aseity. | **Divine Sovereignty vs. Dependence:** Does having knowledge of truths one did not will constitute a limitation on divine independence? | **Test:** The "Bootstrapping" Argument.<br><br>**Molinist Prediction:** We predict it can be shown that CCFs are not "external constraints" but rather the logical structure of freedom which God freely chose to instantiate.<br><br>**Open Prediction:** We predict that if God does not determine the truth of CCFs, He is beholden to a pre-existing metaphysical structure, which is incompatible with absolute sovereignty. |
  | **3** | **Risk and Guarantee in Providence**<br><br>**Molinist:** God takes no risks. By selecting a world via Middle Knowledge, God guarantees specific outcomes of free choices without determining them.<br><br>**Open Theist:** God accepts risk. Providence involves God dynamically responding to free choices to steer history toward His ends, without guaranteeing every specific intermediate outcome. | **The Nature of Control:** Does genuine providence require the guarantee of specific free actions, or only the guarantee of ultimate ends? | **Test:** Biblical Narratives of Divine Regret (e.g., Genesis 6:6).<br><br>**Molinist Prediction:** We predict these texts can be coherently interpreted as anthropomorphic expressions of grief, not indicators of unexpected outcomes.<br><br>**Open Prediction:** We predict these texts are best read literally as indicating God experienced an outcome He did not specifically foreknow as actual. |

  ## 3. Conditions for Abandonment

  **The Molinist Signatory:**
  "I would abandon Molinism if it were demonstrated that Counterfactuals of Creaturely Freedom (CCFs) are logically incoherent—specifically, if the 'Grounding Objection' proves insurmountable. If it can be shown that there is *no possible metaphysical account* by which a proposition regarding a free, undetermined choice can be true prior to the choice without implying determinism, then Middle Knowledge is impossible. Furthermore, if it were demonstrated that a world with Middle Knowledge inevitably collapses into theological determinism (i.e., that God's selection of a world based on CCFs renders the choices non-libertarian), I would be forced to relinquish this view."

  **The Open Theist Signatory:**
  "I would abandon Open Theism if it were demonstrated that exhaustive definite foreknowledge of future free choices is logically compatible with libertarian freedom *and* is strictly required for meaningful providence. Specifically, if it can be shown that a God who does not know the specific future choices of creatures cannot guarantee the fulfillment of divine promises (such as the ultimate triumph of good or the specific Messianic prophecies) without resorting to coercion, then Open Theism fails to account for biblical providence. If 'risk' inevitably leads to the possibility of God's ultimate defeat, I must reconsider."

