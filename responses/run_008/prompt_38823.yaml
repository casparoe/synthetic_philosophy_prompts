answer: |-
  Here is the specification for valid consent that I propose you use to frame the unit. This is not a neutral survey of the literature but a committed framework designed to handle the messy cases your students are raising without resorting to ad hoc exceptions. The core claim of this spec is that consent is a normative power that transfers authority over a specific boundary from one agent to another, and for that transfer to stick, it must satisfy three non-negotiable conditions: capacity, voluntariness, and material information. These conditions are unified across medical, sexual, and contractual contexts, meaning there is a single validity structure, though the threshold for meeting each condition shifts depending on the stakes and intimacy of the interaction. This answers your first question about unity versus fragmentation. We should not tell students that sexual consent is a different species than contractual consent, because that invites confusion when cases overlap, such as surrogacy or employment contracts involving bodily risk. Instead, tell them the engine is the same but the safety standards are higher for sex than for selling a lawn mower. The difference is in the weighting of the requirements, not the requirements themselves.

  The first non-negotiable requirement is capacity, which is the least contested but often the most poorly defined in practice. Capacity here does not mean perfect rationality or emotional stability; it means the functional ability to understand the nature of the act and the consequences of agreeing to it. This is a binary gatekeeper. If a patient is delirious or a child is below the age of statutory recognition, no amount of willing enthusiasm validates the consent. However, you should flag to your students that the line here is often drawn by policy rather than pure ethics, which is a contested judgment call you need to own. For the purposes of this course, treat capacity as a threshold of minimum cognitive functioning rather than a gradient of wisdom. This handles the edge cases where someone is foolish but competent. The harder work lies in the other two requirements, where the puzzles you mentioned live.

  The second requirement is voluntariness, and this is where you must take a hard stand on the coercion puzzle. The spec requires that consent be free from controlling influence exerted by another agent. This distinguishes between threats and offers, and crucially, between agent coercion and circumstantial pressure. Here is the call you need to make for the class: mere circumstances do not invalidate consent, even if they leave no reasonable alternative. In the sweatshop case, the worker consents validly even if the only alternative is starvation, provided no human agent created that desperation specifically to force the consent. This is a contested judgment because some theories argue that structural coercion invalidates consent, but if you adopt that view, you render almost all contract law impossible and often harm the very people you mean to protect by declaring their choices void. The spec treats the sweatshop case as valid consent given under unjust background conditions. This separates the validity of the transaction from the justice of the situation. However, flip this to the massage therapist case. Here, the therapist is an agent who cultivated dependency to secure compliance. This is not just a hard choice; it is a manipulated choice. The spec counts this as invalid because the voluntariness was compromised by another agent's manipulation of the consenter's psychological state, even without explicit threats. The distinction turns on the source of the pressure. If the pressure comes from the world, consent stands. If the pressure comes from the counterparty manipulating the will, consent fails. This is a substantive dispute in the literature, with some arguing that only the causal effect on the mind matters, but I argue you should teach the wrongfulness of the pressure source as the deciding factor. Otherwise, blackmail becomes a valid form of consent because the victim technically chooses the lesser evil.

  The third requirement is information, and this is where the clinical trial and marriage cases must be resolved without contradiction. The spec requires disclosure of material facts that define the nature of the act, not every fact that might influence the decision. This is the sacrifice you must make to resolve the unsatisfiable desiderata you suspected. You cannot require that consent be fully informed in the sense of omniscience because, as you noted, if people understood everything about the trial, the relationship, and the job market, they might never consent, and yet we need their consent to proceed. If you set the bar at perfect information, you get no consent. If you set it at zero information, you get fraud. The middle path is materiality. In the clinical trial case, the patient believed they were receiving treatment when they were entering research. This changes the nature of the act from healing to data collection. That is a material fact, so the consent is invalid. In the marriage case, the hidden affair is trickier because it does not change the nature of the wedding ceremony itself, but it violates the underlying terms of the partnership contract that both parties assumed were in place. Here you should argue that consent relies on a shared understanding of the context. If one party knows the context is false and the other does not, the consent is defective because it was given to a fiction. However, you must flag this as contested. Some argue that unless the deceiver actively lied, the consent stands. I recommend you teach that passive concealment of dealbreaking facts by a fiduciary or partner invalidates consent, whereas concealment by a stranger does not. This distinguishes the marriage case from a case where a spouse hides a gambling debt unknown to both until later. The key is whether the fact changes the description of what is being consented to.

  Now I need to address the tradeoffs directly, as you asked whether some requirements are jointly unsatisfiable. They are. You cannot have consent that is fully informed, perfectly voluntary, and actually obtained from ordinary humans in non-ideal conditions. The world is messy, power imbalances exist, and information asymmetry is the norm. If you insist on all three at maximum intensity, you paralyze human interaction. The spec I am proposing sacrifices the ideal of perfect information for the standard of material understanding, and it sacrifices the ideal of perfect voluntariness for the standard of absence of controlling manipulation. We accept that people consent under pressure from circumstances because the alternative is paternalism that denies their agency. We accept that people consent without knowing everything because the alternative is requiring experts to dump every possible risk onto laypeople, which undermines understanding rather than aiding it. This is the hard pill for students to swallow. They want a theory that protects people from all regret. This theory only protects people from being used as mere tools by others. It distinguishes between being harmed by someone else's wrongdoing versus being harmed by life's difficulties. The massage client was wronged by the therapist. The sweatshop worker is wronged by the economy, but not necessarily by the employer's act of hiring them, provided the wage was not coerced by the employer. This distinction is vital for their moral reasoning.

  You also asked me to distinguish which requirements are non-negotiable versus camp preferences. Capacity is non-negotiable; without it, there is no agent to consent. Intentionality is non-negotiable; the consenter must mean to grant permission. Voluntariness is non-negotiable in the sense that coercion invalidates, but the definition of coercion is where the camp preferences lie. I have committed you to the view that only agent-created controlling pressure counts as coercion invalidating consent, whereas structural desperation does not. This is a liberal individualist stance. If you prefer a structuralist stance, you would mark the sweatshop consent as invalid, but I advise against that for an intro course because it conflates the validity of the agreement with the justice of the background conditions. Keep them separate. Let them condemn the sweatshop without denying the worker's agency. Similarly, on information, the camp preference lies in how much must be disclosed. The medical model tends toward full disclosure of risks, while the contractual model tends toward caveat emptor. The spec unifies these by demanding disclosure of facts that change the nature of the act. In medicine, the nature of the act includes risks to the body. In contracts, it includes the terms of exchange. In sex, it includes the identity of the partner and the use of protection. The content changes, but the rule remains: do not misrepresent what is happening.

  Finally, you need to own the consequence of this spec for the marriage case where no deceiver is present at the moment of consent, such as the hidden affair known only to one partner. This tests the limits of the information requirement. If the spec requires shared understanding, then the consent is voidable because the condition of monogamy was part of the agreed framework. However, if the spec requires active misrepresentation, it might stand. I argue you should teach that consent is context-dependent. When you marry, you consent to a package of expectations. If one partner knowingly violates the core terms of that package while soliciting continued consent to the relationship, they are vitiating the consent through fraud by omission. This aligns with the clinical trial case where the institution knows the patient is confused about the goal of the trial. In both cases, the authority figure knows the consenter is operating under a false premise about the nature of the interaction. That is the unifying thread. The sweatshop case differs because the employer does not necessarily know the worker has no other options, and even if they do, the options are not created by the employer. The massage case differs because the therapist actively created the dependency. The clinical trial and marriage cases align because in both, one party holds knowledge that defines the reality of the situation and hides it from the other, rendering the other's agreement meaningless.

  To summarize the spec for your students without giving them a list: Valid consent requires a capable agent who intentionally grants permission based on a material understanding of what is happening, without being controlled by another agent's manipulation or threats. It does not require perfect knowledge or perfect freedom from circumstance. It protects agency, not welfare. This means you can consent to something bad for you, but you cannot consent to something under a lie about what it is. This framework handles the trial patient because they were lied to about the nature of the act. It handles the massage client because their will was manipulated by a counterparty. It handles the marriage case because the terms of the relationship were fraudulently concealed by a partner. It handles the sweatshop worker because their consent was real, even if their situation was tragic. This keeps the concept of consent clean enough to be useful while acknowledging the moral complexity of the world it operates in. You will lose the students who want consent to be a magic shield against all regret, but you will gain the students who want to understand how authority and responsibility are actually transferred between people. That is the tradeoff, and it is worth making.
