answer: |-
  Hey, this is a fantastic topic and honestly the kind of thing that separates a casual meetup from a really good one, so kudos on drawing that slip of paper. Since you are reading this on the bus I will keep the formatting clean and just talk through the plan as if we were grabbing coffee, and I will skip the slides advice since you already nailed that constraint.

  On sequencing, you should absolutely open with the game rather than the muddy children puzzle. Your instinct is right that starting with the puzzle risks teaching logic as a parlor trick, but there is a deeper reason specific to your audience mix. Before the phrase common knowledge of rationality means anything, your attendees need a shared definition of rationality that is not just philosophical but operational. In game theory, rationality means maximizing expected utility given beliefs, which manifests concretely as not playing strictly dominated strategies. If you start with muddy children, you establish common knowledge of a fact, but you leave rationality as an abstract virtue. If you start with a simple payoff matrix where one move is obviously better regardless of what the opponent does, you ground rationality in action. You need them to understand that being rational means deleting dominated strategies before you can explain that common knowledge of rationality means deleting them iteratively. So the dependency chain is: define the game state, define rationality as dominance avoidance, define mutual knowledge, then define common knowledge as the infinite tower that licenses the infinite iteration. Save the muddy children puzzle for the middle section as an analogy to explain the knowledge hierarchy, not as the opening hook.

  For the carrying example, you should stick with the Generals scenario but you must formalize it into a payoff matrix early on. The reason is that you need to bridge the gap between the coordinated attack problem which is about communication protocols and the game theory which is about strategy selection. A standard coordination game like Stag Hunt is too soft because it has multiple equilibria and doesn't force iterated deletion. You want a game where attacking is dominant if and only if you know the other attacks, but where the uncertainty about the message delivery creates the hierarchy. I recommend using a simplified version of the Rubinstein Email Game. Set up a payoff matrix where Attack-Attack yields high reward, Attack-Don't yields disaster, and Don't-Don't is safe but mediocre. Then introduce the communication channel as unreliable. This scenario has the drama of the Generals problem but the structure of a matrix game. It lacks the pure logical elegance of muddy children, but it gains the crucial element of strategic consequence. You cannot get both perfectly in ninety minutes, so pay the cost of losing the puzzle magic to gain the game mechanics, because your ML folks and the econ PhD will care more about the strategic implications than the logic puzzle aesthetics. Just be upfront that you are formalizing the story into a matrix to make the incentives visible.

  Regarding misconceptions, you need to head them off in a specific order because they build on each other. The first one will arise immediately when you draw the matrix, which is that rationality means winning or cooperating. You need to crush this in the first fifteen minutes by showing a Prisoner's Dilemma or a game where the rational choice leads to a suboptimal outcome, so they understand rationality is about consistency with beliefs, not moral goodness or group success. The second misconception will hit when you introduce the communication failure, which is that common knowledge is just mutual knowledge repeated a bunch of times. This is where you bring in the muddy children analogy briefly to show that the infinite tower is qualitatively different from a finite chain. You need to explain that mutual knowledge means we both know X, but common knowledge means we both know X and we both know that we both know X ad infinitum, and that break in the chain is what stops the generals. The third misconception is the rationalist special pathology you mentioned, where people think rational agents can bootstrap common knowledge and cooperate forever. This usually comes from confusing Aumann's Agreement Theorem with coordination problems. You should address this after you show why the attack fails. The reason they cannot bootstrap it is that without a public signal, there is always a non-zero probability that the message didn't arrive, and that tiny probability propagates up the knowledge hierarchy and breaks the common knowledge condition. Rationality does not create information out of thin air.

  On the technical result about k rounds of deletion requiring only k levels of knowledge, I think you should include it but place it in the last twenty minutes as a payoff for the ML people. For the half of the room who has never seen a payoff matrix, frame it as computational depth rather than logical depth. Tell them that while common knowledge is an infinite concept, actually solving the game only requires a finite amount of recursive thinking equal to the number of steps needed to solve it. This lands as a satisfying punchline because it relieves the cognitive burden of the infinite tower. It tells them that in practice, they don't need to simulate infinity, they just need to simulate enough steps to clear the dominated strategies. However, do not derive it formally. Just state it as a property of the solution concept and maybe draw a small diagram on the whiteboard showing step one requires level one knowledge, step two requires level two, and so on. If you try to prove it you will lose the newbies, but if you just assert it as a feature of the algorithm you will keep everyone with you.

  As for what to refuse to cover, you are correct to skip the common-belief versus common-knowledge machinery. That requires probability measures over state spaces that will bog you down in notation. Also skip the epistemic conditions for backward induction in dynamic games. Stick to simultaneous move games where iterated deletion is the primary solution concept. If the econ PhD pushes on this, thank them and note that dynamic consistency is a separate session worth its own ninety minutes. You should also avoid getting bogged down in the specific probabilities of the message delivery unless someone asks. The qualitative break in common knowledge is the key insight, not the exact threshold probability. If you start calculating bounds you will lose the narrative thread. Your goal is to teach the concept of the knowledge hierarchy, not to train them to solve epistemic models on the fly.

  Finally, for the closing question, you want something that discriminates between nodding along and actually grasping the mechanism. Do not ask them to define common knowledge. Instead, ask them this: If I am one of the generals and I receive a message that you are attacking, but I know there is a one percent chance the message was lost, do I attack? The correct answer is not a simple yes or no, but rather it depends on whether I know that you know that I know. But the real discriminator is this follow-up: If we agree beforehand that we will attack regardless of the message, does that solve the problem? The answer is no, because without the common knowledge of the current state, the pre-agreement doesn't help if I think you might not have received the confirmation. A better question might be: What specific piece of information does the father's announcement add in the muddy children puzzle that the children did not already have visually? If they say he tells them someone is muddy, they failed. If they say he makes it common knowledge that someone is muddy, they got it. For the game theory context, ask: Does rationality alone solve the coordination problem, or do we need the communication structure? The answer must be that rationality processes information but does not generate it, so without the common knowledge structure, rationality leads to inaction. That distinction shows they understand the limit of the concept.

  I think you have a solid handle on the inferential distance here, and having the econ PhD in the room is actually a gift if you frame them as a sanity check rather than an adversary. If you get a detail wrong and they sigh, just pause and ask them to clarify the standard definition, then move on. It shows humility and keeps the rigor high. Good luck with the session, and I hope the bus ride home gives you time to sketch out that matrix.
