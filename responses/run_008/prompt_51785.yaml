prompt: |-
  So our meetup has this tradition where once a month someone does a deep-dive session on a topic they picked out of a hat, and I drew epistemic game theory, specifically common knowledge of rationality — the thing that licenses iterated deletion of dominated strategies, and the thing that's weirdly missing in the coordinated attack problem so the generals never manage to attack. I've been reading the rationalist blogosphere since the Sequences were still coming out so I have the usual inferential-distance instincts, but I want a second brain on the teaching plan, not an explanation of the material itself. Here's the constraints: fifteen-ish people, ninety minutes, whiteboard, no slides. Maybe half have literally never seen a payoff matrix, a few are ML people, and one econ PhD who will sigh audibly at anything I get subtly wrong, which honestly keeps me honest.

  What I want from you is the plan. First, sequencing: I keep going back an forth on whether to open with the muddy children puzzle or with a small game where iterated strict dominance actually solves the thing, and part of me worries that starting with the puzzle teaches people that logic is a parlor trick rather than a tool. What depends on what here, and what has to be in place before the phrase "common knowledge of rationality" means anything to them?

  Second, the carrying example: what one scenario should the whole session be built around, and what does it need to have (and lack) that the obvious alternatives don't? Muddy children has the puzzle-magic but no game; a dominance-solvable game has the game but no drama. Is there a way to get both, or should I just pick one and be upfront about the cost?

  Third, misconceptions, in the order people will actually form them, and where in the arc each one should get headed off. I'm bracing for "common knowledge is just mutual knowledge repeated a bunch of times", for "the father's announcement adds no information because every kid can already see muddy faces", and for our crowd's own special pathology, "so rational agents can just bootstrap common knowledge and cooperate forever", which I'm pretty sure is wrong but not sure I can articulate exactly why off the cuff, so maybe address that too.

  Fourth, I want to include the result where k rounds of iterated deletion only need k levels of "I know that you know that... everyone's rational" rather than the full infinite tower, and I can't decide whether that lands as a satisfying punchline (the infinite-seeming thing turns out to be finitely checkable!) or whether it just loses the half that's never seen a payoff matrix. Tell me where to put it and how to frame it, or whether to cut it.

  Also tell me what I should openly refuse to cover at this level — I'm guessing the common-belief-versus-common-knowledge machinery and whatever is going on with the epistemic conditions for backward induction, but push back if you disagree.

  And end with one question I can ask in the last five minutes that would actually discriminate between "the idea landed" and "everyone nodded along politely."

  Please write it as continuous prose, no headings or bullets or bold, basically like a long email — I'll be reading it on my phone on the bus.
