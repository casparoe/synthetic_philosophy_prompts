prompt: |-
  Slight context: I'm a PhD student in public health doing a philosophy of medicine minor, and my supervisor is basically a Boorsean — health as statistically normal biological functioning, values nowhere in sight, the whole biostatistical package. At the last seminar I tried to push back on him with the WHO Constitution's line that health is "a state of complete physical, mental and social well-being and not merely the absence of disease or infirmity", and he just waved it off as a manifesto rather than a defintion and moved on. Which was annoying, because I've since realised I don't actually know what that sentence is claiming. Like, the "not merely the absence of disease" bit — is it saying absence of disease is necessary but not sufficient for health? Just that it's insufficient? Or is it not even committed to it being necessary? And I've seen people in disability studies use the exact same sentence to argue that someone with a chronic condition can nevertheless be healthy, and I honestly can't tell whether that follows from the definition or whether they're quietly swapping in their own reading of it.

  So here's what I want: lay out the different precise claims that sentence could be making — the trivially true ones, the ones that quietly redefine health in wellbeing terms (which is presumably where the naturalism vs. normativism fight actually bites), any institutional ones about what medicine's remit is, whatever you can find — and for each reading say whether it's plausible and, crucially, whether it would actually get me anything at office hours against someone who thinks disease judgements are value-free science. A menu of readings I can bring in and point at, not one you pick for me and defend.

  Also, if you have space: the standard complaint is that "complete" wellbeing makes health basically unattainable, so by this defintion everyone is at least somewhat sick and ordinary unhappiness gets medicalised. Is that objection actually engaging with the definition as stated, or does it trade on treating "complete" as an ideal rather than a threshold? I suspect the whole debate turns on that but I can't quite nail it down.

  Please write the answer in British English.
