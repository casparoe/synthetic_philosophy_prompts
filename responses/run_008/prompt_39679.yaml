answer: |-
  This is a fantastic mapping. You are correct: the Socialist Calculation Debate (SCD) is, structurally, a debate about distributed optimization architectures. However, the "residue" you are looking for—the part that doesn't fit—is where the economics actually bites.

  Here is the translation of the Mises/Hayek vs. Lange debate into your vocabulary, followed by the residue report and the verdict on whether a theorem settles it.

  ---

  ### Part 1: The Translation

  **The Primal Problem (The Social Planner's Problem)**
  The economy is attempting to solve a global constrained optimization problem:
  $$ \max_{x} \sum_{i=1}^N U_i(x_i) \quad \text{s.t.} \quad \sum_{i=1}^N x_i \leq \omega + \sum_{j=1}^M y_j $$
  Where $U_i$ are household utility functions, $y_j$ are production vectors from firms, and $\omega$ is initial endowment.
  *   **Variables:** Allocations of goods ($x$).
  *   **Constraints:** Resource balance constraints.
  *   **Objective:** Social Welfare (weighted sum of utilities).

  **Lange's Proposal: Dual Decomposition / Dual Ascent**
  Lange argues the Central Planning Board (CPB) does not need to solve the primal (which requires collecting all $U_i$ and production functions). Instead, they solve the **Dual**.
  1.  **Multipliers:** The CPB maintains a vector $\lambda$ (prices) associated with the resource constraints.
  2.  **Broadcast:** CPB broadcasts $\lambda^k$ to all agents.
  3.  **Local Subproblems:** Each agent $i$ solves their local problem:
      $$ x_i(\lambda^k) = \arg\max_{x_i} \left( U_i(x_i) - \lambda^k \cdot x_i \right) $$
      (Firms maximize profit $\lambda \cdot y_j$; households maximize utility subject to budget).
  4.  **Gradient Feedback:** Agents report their optimal $x_i(\lambda^k)$ back to the CPB. The CPB computes **excess demand**:
      $$ z(\lambda^k) = \sum x_i(\lambda^k) - \text{Supply} $$
      In optimization terms, $z(\lambda^k)$ is the **gradient (or subgradient) of the dual function** $g(\lambda)$.
  5.  **Update:** The CPB performs a gradient step:
      $$ \lambda^{k+1} = \lambda^k + \alpha_k \cdot z(\lambda^k) $$
      (If excess demand is positive, raise price).

  **Verdict on your guess:** You are exactly right. Lange's *tâtonnement* is **Dual Ascent** (specifically, a subgradient method on the dual). Under standard assumptions (convexity, concavity), this converges to the optimal Lagrange multipliers, which support the primal optimum.

  **Mises' Objection: Undefined Objective / Feasible Set**
  Mises argues that without private property in capital goods, the functions $U_i$ and the production sets $Y_j$ do not exist as well-defined mathematical objects.
  *   **Optimization Translation:** You cannot run an algorithm on a function that isn't defined. Property rights are not just constraints; they are the mechanism that *constructs* the objective function. Without the ability to trade capital, the "value" coefficients in the objective function are NaN. There is no loss function to minimize.

  **Hayek's Objection: Oracle Complexity and Tacit Knowledge**
  Hayek grants the math but attacks the **Oracle Model**.
  1.  **Communication Complexity:** Hayek argues that communicating the full local state (the gradient/demand function) is too expensive. Prices are a **lossy compression** of information. Dual ascent requires agents to compute and report exact demands. Hayek argues agents only know local particulars that cannot be fully statisticated.
  2.  **The Black-Box Oracle:** In standard distributed optimization, we assume the local agent *has* access to their gradient $\nabla U_i$. Hayek argues the gradient is **tacit**. The agent doesn't know $\nabla U_i$ until they interact with the environment. It is not a function query; it is an exploration.
  3.  **Non-Stationarity:** The functions $U_i$ and $Y_j$ are not static. They change faster than the algorithm converges. You are optimizing a moving target where the movement depends on the optimization path itself.

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation, what distorts, and what evaporates.

  #### 1. What Translates Cleanly
  *   **Lange = Dual Decomposition:** This is mathematically sound. If the economy is a convex optimization problem, Lange's algorithm converges. The Arrow-Hurwicz-Uzawa (1958) theorem essentially formalized Lange's intuition into a stability theorem for gradient methods.
  *   **Prices = Multipliers:** The interpretation of prices as shadow prices (Lagrange multipliers) on resource constraints is standard welfare economics (Arrow-Debreu).
  *   **Excess Demand = Dual Gradient:** This is exact.

  #### 2. What Had to Be Distorted
  *   **Convexity:** Distributed optimization relies heavily on convexity to guarantee dual gap is zero and gradient methods converge. Real economies have increasing returns to scale (non-convex production sets). In optimization terms, this creates a **duality gap**. Dual ascent will oscillate or converge to a suboptimal point. Lange waved this away; later economists (like Koopmans) admitted it was a major technical hurdle.
  *   **Synchronous Updates:** Lange's model assumes a synchronous round (broadcast prices, report demand, update). Real markets are asynchronous. ADMM handles asynchrony better than pure dual ascent, but Lange didn't have that vocabulary.

  #### 3. What Has No Counterpart (The Residue)
  This is the critical part. The debate isn't settled by optimization theory because the economic critique targets the *premises* of the optimization formulation.

  **A. Incentives (Mechanism Design vs. Optimization)**
  *   **The Issue:** Optimization assumes agents *solve* the local subproblem truthfully. $x_i(\lambda)$ is reported honestly.
  *   **The Residue:** In economics, agents are strategic. If I know the center is doing gradient descent, I can report false gradients to manipulate $\lambda$ in my favor. This is **Mechanism Design**, not Optimization. Lange assumed a "benevolent dictator" or honest agents. Hayek/Mises assumed rational actors who would game the planner.
  *   **Verdict:** This is a huge gap. Your field assumes the compute nodes are obedient. The SCD assumes the compute nodes are adversaries.

  **B. Endogenous Objectives (Discovery vs. Search)**
  *   **The Issue:** Optimization assumes $f(x)$ exists independently of the search process.
  *   **The Residue:** Hayek's "Discovery Procedure" argues that preferences and technologies are *created* by the market process. Entrepreneurs don't just find the minimum; they invent new variables.
  *   **Optimization Equivalent:** This is **Online Learning with Endogenous Objectives** or **Non-Stationary Bandits**, but deeper. It's as if the act of querying the gradient changes the function definition for future queries. Standard optimization has no vocabulary for "the objective function is discovered through the act of optimization."
  *   **Verdict:** This breaks the static formulation entirely.

  **C. Tacit Knowledge (Representational Capacity)**
  *   **The Issue:** Hayek argues knowledge is "of the particular circumstances of time and place."
  *   **The Residue:** In optimization, we assume the local node can compute $\nabla f_i(x)$. Hayek argues the agent *cannot* compute this gradient explicitly to report it, even if they wanted to. They can only act on it.
  *   **Optimization Equivalent:** This is like a **Zeroth-Order Oracle** where even the function value is hard to pin down, or where the "gradient" is a high-dimensional vector that cannot be transmitted over the channel. It suggests the local subproblem is not a computable function in the Turing sense, but a heuristic policy.
  *   **Verdict:** This is the hardest to formalize. It suggests the "local subproblem" is not a mathematical function but a biological/sociological adaptation.

  ---

  ### Part 3: The Verdict on the "Theorem"

  **Is there a version of the debate that is literally just a theorem?**
  Yes. The **Arrow-Hurwicz-Uzawa (1958)** theorem (and subsequent work on the stability of tâtonnement).
  *   **The Theorem:** For a convex economy (concave utilities, convex production sets), the continuous-time price adjustment process (Lange's dual ascent) is globally stable and converges to the Walrasian equilibrium.
  *   **Does it settle anything?** **No.**

  **Why it doesn't settle anything:**
  1.  **Assumption Loading:** The theorem proves: *IF* the world is a convex optimization problem *AND* agents report truthfully *AND* the function is static, *THEN* Lange is right.
  2.  **Hayek's Counter:** Hayek's argument is precisely that the "IF" clause is false. The world is not a static convex optimization problem. The data is not given. The functions are not fixed.
  3.  **Mises' Counter:** Without the institutional structure of property rights, the "optimization problem" is ill-posed. There is no objective function to maximize.

  **Honest Assessment of Your Field:**
  Distributed optimization has been "re-litigating" this, but often by sweeping the hard parts under the rug.
  *   **Optimization Strength:** We have rigorous convergence rates, communication complexity bounds, and robustness analysis for Lange's algorithm (Dual Decomposition). We know *how* to simulate the market efficiently if the market is a function.
  *   **Optimization Weakness:** We treat the "nodes" as dumb calculators. We assume the loss function is God-given. We ignore that in social systems, the "loss function" is political and the "nodes" are strategic.

  **Hayek's "Discovery" in Your Vocabulary:**
  You asked if entrepreneurship/discovery is expressible. It requires **Online Convex Optimization (OCO)** with **Regret Minimization**, but with a twist: the adversary is not nature, but the other agents adapting to you.
  However, the true Hayekian point is closer to **Evolutionary Algorithms** or **Population-Based Training** where the "parameters" themselves (the technologies/preferences) mutate. It is not just finding $x^*$; it is expanding the dimension of $x$. Standard optimization fixes the dimensionality of the search space. Hayek argues the market *increases* the dimensionality of the search space (new goods, new services).

  ### Summary
  *   **Lange** proposed **Dual Ascent**.
  *   **Mises** argued the **Objective Function is Undefined** without specific institutional constraints (property rights).
  *   **Hayek** argued the **Oracle is Imperfect/Strategic** and the **Function is Non-Stationary**.
  *   **The Theorem:** Exists (Arrow-Hurwicz-Uzawa), but assumes away the economic critique.
  *   **The Residue:** Mostly **(b) Endogenous Objectives** and **(a) Incentives**. The optimization framework assumes a static loss function and obedient nodes. The economic reality is a dynamic loss function and strategic nodes.

  If you want to work on the "Hayekian" version of distributed optimization, look into **Mechanism Design for Distributed Optimization** (handling strategic nodes) and **Non-Stationary Online Learning** (handling evolving objectives). But be warned: once you admit the objective function evolves based on the optimization path, you leave the realm of "convergence to optimum" and enter the realm of "adaptive survival." That's where the math gets messy, but that's where the economy actually lives.
