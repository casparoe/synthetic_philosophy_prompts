  ANTHROPIC MUTUAL ASSURANCE, LTD.
  POLICY DOCUMENT 8.Ω: INDEXICAL CONTINGENCY COVERAGE

  The Company underwrites risks contingent upon observer selection effects. We maintain strict neutrality regarding Self-Sampling and Self-Indication assumptions. Coverage is provided subject to the following clauses and exclusions. The Policyholder acknowledges that existence is a condition of coverage, not a guarantee of payout.

  1. ACTUARIAL TREATMENT OF EXTINCTION RISK.
  Premiums are adjusted according to the Policyholder's birth rank within the reference population. Policyholders situated within the first 5% of all observers shall incur a Risk Surcharge equal to 40% of the base premium. This surcharge reflects the elevated probability of near-term cessation inherent to early sampling positions under standard Bayesian updating. The Company does not endorse the Doomsday Argument as metaphysical truth but recognizes its utility for pricing tail-risk exposure. Payment of the surcharge does not guarantee extended species longevity. Late-born observers may qualify for discounted rates reflecting higher total population estimates. The Company reserves the right to recalibrate birth rank estimates based on updated census data from adjacent possible worlds.

  FAQ: THE PRESUMPTUOUS PHILOSOPHER RIDER.
  Q: Can I insure a bet that the universe is trillions of times larger than the alternative based on my existence?
  A: Coverage is available provided the wager conditions on existence-as-this-observer rather than existence-simpliciter. The Company notes that while Self-Indication favors larger worlds, indemnity requires proof that the Policyholder is not merely a random sample from a larger set. Claims will be denied if the Policyholder's reasoning relies solely on the volume of observers without accounting for the likelihood of specific evidence. You may bet on the multiverse, but not on the certainty of your seat within it. We cover the uncertainty of the cosmos, not the certainty of your presence within it.

  2. REFERENCE CLASS DETERMINATION.
  At the time of claim adjudication, the Company reserves the sole right to assign the Policyholder to any defensible reference class. This may include, but is not limited to: biological humans, conscious moments, carbon-based observers, or entities capable of understanding this clause. This discretion is necessary to resolve indeterminacies regarding which observers count as "you" for probability calculations. The Policyholder acknowledges that shifting reference classes may alter posterior probabilities retroactively. No appeal is permitted based on class incompatibility. If a class yields unfavorable odds for the claimant, the Company may select an alternative class with equal technical validity.

  3. SLEEPING BEAUTY DISPUTE RESOLUTION.
  In cases involving memory erasure and repeated awakenings, the Company maintains neutrality between Halfer and Thirder positions. However, payouts are scheduled per experiment rather than per awakening. While premiums may be assessed at each interview, indemnity is consolidated upon the conclusion of the protocol. This ensures equitable treatment regardless of credence assignments regarding temporal location. The Company does not recognize distinct awakenings as distinct claimants under a single policy identity. Multiple claims arising from a single coin toss will be merged into a single payment instrument issued after the final awakening.

  4. DEFINITION OF THE INSURED IN FISSION CASES.
  Should the Policyholder undergo duplication, fission, or branching, indemnity is payable to the singular contractual entity designated at inception. If multiple successors exist, the Company reserves the right to recognize only the successor retaining the original tax identification number. Coverage does not extend to copies, simulations, or divergent branches unless separately underwritten. You are defined as the continuous thread recognized by the insurer, not the sum of all subjective experiences claiming your history. In the event of symmetric fission, coverage is suspended until identity is legally resolved.

  GENERAL PROVISIONS.
  Anthropic Mutual Assurance, Ltd. does not adjudicate metaphysical principles. Our products are structured to remain solvent across all plausible cosmologies. We profit from the structure of uncertainty, not the resolution of it. By signing, you agree that the Company's neutrality is operational, not philosophical. We accept premiums calculated under both assumptions while limiting liability to the intersection of both outcomes. Coverage is void if the Policyholder successfully proves their own existence with certainty.
