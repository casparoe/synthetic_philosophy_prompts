answer: |-
  Here is the translation of Lakatos's Methodology of Scientific Research Programmes (MSRP) into the vernacular of a condensed matter experimentalist/theorist, followed by the residue report you requested.

  ### The Lab-Bench Translation

  **1. The Research Programme $\rightarrow$ The Model Family**
  In Lakatos, a "programme" is a lineage of theories. In your lab, this is a **theoretical framework** or **ansatz**. Examples: "Landau Fermi Liquid Theory," "BCS Superconductivity," or "Spin-Fluctuation Mediated Pairing." It's not just one Hamiltonian; it's the commitment to a specific class of Hamiltonians over a decade of iterations.

  **2. The Hard Core $\rightarrow$ The Fundamental Ansatz**
  This is the set of assumptions you treat as inviolate *for the duration of the project*.
  *   *Lakatos:* "Do not falsify the core."
  *   *Your Lab:* "Don't change the Hamiltonian structure yet."
  *   *Example:* If you are working in a Fermi Liquid programme, the Hard Core is the existence of well-defined quasiparticles and the Luttinger theorem. You do not question the existence of quasiparticles when the specific heat coefficient $\gamma$ looks weird. You assume the quasiparticle picture holds, and the anomaly is elsewhere.

  **3. The Protective Belt $\rightarrow$ The Phenomenological Parameters & Perturbations**
  This is where the work happens. It consists of the auxiliary assumptions you adjust to save the Core.
  *   *Lakatos:* "Adjust auxiliaries to absorb anomalies."
  *   *Your Lab:* "Tune the effective mass $m^*$, add a scattering rate $1/\tau$, include a vertex correction, or add a disorder term."
  *   *Example:* The resistivity doesn't match $T^2$. You don't throw out Fermi Liquid theory (the Core). You add a phonon contribution (Protective Belt) or argue that you are in a dirty limit (Boundary Condition). You patch the model with a new term to account for the misbehavior.

  **4. Negative Heuristic $\rightarrow$ "Don't Touch the Hamiltonian"**
  *   *Lakatos:* Direct modus tollens away from the core.
  *   *Your Lab:* When data deviates, the reflex is to check the sample quality, the calibration, or the perturbative expansion order *before* you question the symmetry breaking pattern or the order parameter definition. You methodologically refuse to let the data kill the ansatz immediately.

  **5. Positive Heuristic $\rightarrow$ The Calculation Roadmap**
  *   *Lakatos:* A plan for developing the belt.
  *   *Your Lab:* "Next we calculate the next order in perturbation theory," or "We need to include the coupling to the lattice." It's the workflow of refining the effective theory without changing the underlying degrees of freedom.

  **6. Progressive vs. Degenerating $\rightarrow$ Predictive vs. Curve-Fitting**
  *   *Progressive:* The model predicts a **novel feature** before you measure it.
      *   *Example:* Predicting the existence of a Higgs mode in the superconductor, or a specific kink in the ARPES dispersion, which is subsequently found.
  *   *Degenerating:* The model is only modified *after* the data comes in to accommodate it.
      *   *Example:* You measure the specific heat jump, then add a fudge factor to the gap equation to match it, without that factor predicting anything else (like a change in penetration depth). You are just fitting parameters to existing data points.

  **7. Theory Choice $\rightarrow$ "When to Pivot"**
  *   *Lakatos:* Stick with a programme until a better one exists.
  *   *Your Lab:* You keep patching the Fermi Liquid model until the number of fitting parameters exceeds the number of independent observables, *or* until a rival ansatz (e.g., Non-Fermi Liquid/Strange Metal) starts making successful blind predictions that your current model can only fit retroactively.

  ***

  ### The Residue Report

  Here is the audit of how well the philosophy fits the physics practice.

  #### 1. What Maps Cleanly
  *   **The Patching Process:** The dynamic of "anomaly $\rightarrow$ new term in Hamiltonian" is exactly the Protective Belt in action. Every condensed matter physicist knows the feeling of adding a "phenomenological scattering term" to save the quasiparticle picture.
  *   **The Degeneration Criterion:** Your intuition about "one more patch job versus starting over" is precisely the Progressive/Degenerating shift. When you find yourself adding a parameter for every new data point without constraining previous ones, you know the model is dead, even if the fit is good.
  *   **Immunization:** The refusal to abandon a framework (like BCS) despite initial anomalies (like high-$T_c$) is exactly the Negative Heuristic. You assume the anomalies are due to "impurities" or "strong coupling" (Belt) rather than "wrong pairing mechanism" (Core), at least for a while.

  #### 2. What Has to Be Distorted
  *   **The Scale of "Programme":** Lakatos was thinking of Newtonianism vs. Einsteinianism (centuries). In CMP, a "programme" can last 3 years (a specific heterostructure model) or 50 years (Fermi Liquid theory). The logic holds, but the time constants are compressed.
  *   **The "Rival":** Lakatos assumes a rational choice between two competing programmes. In the lab, often there is no rival. There is just "Our Model" and "Nothing." We often stick with a degenerating model simply because there is no alternative ansatz available, not because we are rationally weighing two progressive options.
  *   **The "Hard Core" Status:** In Lakatos, the core is methodologically irrefutable. In CMP, the core is often *known* to be false fundamentally (e.g., continuum field theory is known to break at the lattice scale), but treated as true *effective* truth. The "refusal to falsify" is pragmatic (it works at this energy scale), not dogmatic.

  #### 3. What Has No Counterpart (The Null Set)
  *   **The Sociological Unit:** Lakatos treats a programme as a community endeavor. In your 40 years, you likely had "pet models" that were yours alone. Lakatos doesn't account well for the individual theorist tinkering in isolation before the community adopts the programme.
  *   **Instrumental Artifacts:** Lakatos assumes anomalies come from nature. In the lab, a huge chunk of "anomalies" are instrumental artifacts (bad contacts, heating effects). The "Protective Belt" often involves modeling the *measurement apparatus*, not just the sample. Lakatos ignores the measurement chain.

  ***

  ### Addressing Your Suspicions

  #### 1. Is the Hard Core/Belt Distinction Retroactive?
  **Verdict: You are correct.**

  Lakatos admits this, though his followers often forget it. He distinguishes between the **history of science** (what actually happened) and the **rational reconstruction** (how we justify it later).
  In the middle of the work, the boundary is blurry. You don't know if the term you just added to the Hamiltonian is a legitimate "Protective Belt" adjustment or the first sign of a "Degenerating" shift.
  *   *Example:* When adding the electron-phonon coupling to BCS theory, was that a healthy belt adjustment or a sign the electronic-only core was failing?
  *   *Resolution:* You only know it was a healthy adjustment *after* it leads to novel predictions (isotope effect).
  *   *Conclusion:* The Hard Core is defined by what *survived*, not necessarily what was declared inviolate at the start. In the lab, you treat everything as Belt until the model collapses. The "Hard Core" is a historical label applied to the assumptions that turned out to be robust.

  #### 2. Does "Novel Prediction" Kill Effective Theories?
  **Verdict: No, provided you define the "Domain of Validity" as part of the Core.**

  This is the critical distinction. A Low-Energy Effective Field Theory (EFT) is not a "degenerate" model just because it fails at high energy.
  *   **Lakatosian Defense:** The "Hard Core" of an EFT includes the **cutoff scale** $\Lambda$.
  *   **Progressive:** If your EFT predicts a new resonance or mode *below* $\Lambda$ that you hadn't seen before, it is progressive.
  *   **Degenerating:** If your EFT requires new parameters to fit data *below* $\Lambda$ that it previously failed to predict, it is degenerating.
  *   **Falsification:** If the EFT fails *above* $\Lambda$, the programme is not degenerating; it has simply reached its boundary conditions. That is not a falsification of the programme; it is the expected termination of its applicability.

  Lakatos's criterion survives because "Novel Facts" are relative to the **problem shift**. If the problem shift is "explain the low-energy physics," then predicting a new low-energy excitation is progressive. If the model only fits known low-energy data by adding arbitrary terms, it is degenerating, regardless of whether it's an effective theory or a fundamental one.

  ### Summary for the Physicist
  Lakatos provides a formal vocabulary for what you already did intuitively: **Don't throw out the Hamiltonian at the first sign of bad data (Negative Heuristic). Tune the parameters and add perturbations (Protective Belt). But if you are just curve-fitting without predicting new peaks or transitions (Degenerating), it's time to change the ansatz.**

  Your suspicion about retroactivity is philosophically sound. The "Hard Core" is a reconstruction we impose on history to make sense of why we kept faith with a model that was constantly bleeding parameters. In the lab, it's all just belt until the whole thing falls apart.
