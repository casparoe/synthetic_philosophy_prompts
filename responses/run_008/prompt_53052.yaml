      *   *Check:* Did I include the "Anti-Differentiation" point clearly? That's about viewpoint neutrality.

  11. **Final Polish:** Ensure the verdict on the colleague's argument is nuanced. It likely relies on a conflation of the Instrumental and Constitutive claims.

