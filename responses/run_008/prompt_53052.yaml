  2.  **Deconstruct the Slogan ("Money is Speech"):**
      *   *User's Category (a): Causal/Enabling.* Money buys megaphones. Restricting money restricts reach.
      *   *User's Category (b): Constitutive.* Spending *is* the act of speaking (e.g., buying ad space).
      *   *User's Category (c): Anti-Differentiation/Neutrality.* Can't regulate the *medium* (money) if you can't regulate the *message*.
      *   *User's Category (d): Associational/Speaker Identity.* Pooled money = pooled voice.
      *   *User's Category (e): Equality/Corruption.* Inequality of voice is not a valid reason to restrict.
