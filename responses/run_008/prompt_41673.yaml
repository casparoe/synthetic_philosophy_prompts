  ok so I want you to act like a professional ethicist who thinks carefully and maybe does a quick brainstorm before committing to anything — really chew on this, don't just riff.

  Heres the setup. I've been going down a rabbit hole on the idea that moral worth depends on acting for the right REASONS, not just doing the right thing. The Kantian-flavored version: the shopkeeper who's honest because honesty is good for business, or the naturally warm person who helps out of sheer sympathy, supposedly don't get any moral worth — only the person who does it because it's their duty does. I find myself mostly convinced by this worth-needs-the-right-motive idea, but I've also gotten attached to a weird little extension of it, and I want to know what the combination actually commits me to.

  My extension: suppose that in real life almost nobody ever acts from duty in any pure form — our good deeds are basically always a cocktail of guilt, reputation, affection, inertia, etc. — and suppose this can't be fixed, moral education just shuffles the motives around without ever purifying them. Call this the muddy motives assumption.

  Given the worth-from-right-reasons view PLUS the muddy motives assumption, what are the most important implications? Things I'm already wondering about: whether praise and blame track anything real anymore, whether institutions (which mostly just manipulate incentives, i.e., precisely the non-duty motives) could somehow be morally better than the people inside them, whether it still makes sense to raise kids to be good people as opposed to reliably-behaving people, and whether there's any coherent sense in which someone counts as a good person if the assumption is true. But don't feel limited to my list — if there's a bigger implication I havent noticed, I want that too.

  Please lead with your bottom line in the very first sentence and then give the reasoning, no preamble and no restating my question back at me. At the end, say how confident you are in the overall picture you gave, and single out the one point you're least sure of.
