answer: |-
  This combination commits you to a form of moral skepticism where no human possesses genuine moral worth, forcing you to reinterpret praise, blame, and education as purely instrumental mechanisms for behavioral management rather than assessments of character.

  If moral worth requires pure motives and pure motives are impossible, then moral worth is effectively extinct in the human realm. You are left with a stark dichotomy: actions can be right or wrong, but agents cannot be good or bad in the deepest sense. This creates an immediate tension with the Kantian principle that "ought implies can." If we ought to have moral worth but cannot achieve it, the normative force of the theory collapses, suggesting you must either abandon the purity requirement or accept that moral worth is a regulative ideal we asymptotically approach but never touch.

  Regarding praise and blame, your view strips them of retributive or aretaic grounding. If no one acts from duty, no one truly deserves praise for virtue or blame for vice. Consequently, these practices survive only as consequentialist tools: we praise to reinforce behavior and blame to deter harm, not because the recipient earned them through moral agency. This turns moral language into a sophisticated system of conditioning rather than a description of metaphysical reality.

  On the institutional front, you are committed to viewing systems as morally superior to individuals, not because institutions have "worth"—they are not agents—but because they are the only reliable engines for producing right actions. Since institutions operate explicitly on muddy motives (incentives, laws, reputation), they align perfectly with your empirical assumption. This implies a political shift where we stop trying to fix souls and start fixing structures, accepting that a well-designed system of selfish actors is morally preferable to a failed attempt at cultivating saints.

  For child-rearing, the implication is a pivot from character education to habituation. If you cannot teach a child to act from duty, you teach them to act reliably despite their motives. Moral education becomes behavioral training aimed at aligning their muddy motives with right action, abandoning the goal of internal purity as a futile distraction. This risks creating citizens who do the right thing but lack the moral vocabulary to understand why, potentially making them vulnerable when incentives shift.

  The biggest implication you may have missed is the psychological toll on the moral agent. If you believe this combination, you must live with the knowledge that your own best efforts are morally worthless. This could lead to quietism—if nothing I do has worth, why strive?—or it could force a redefinition of "striving" itself as the only locus of value, shifting worth from the *outcome* of the motive to the *effort* to purify it, even if that effort never succeeds.

  Confidence: 85%
  Least Sure Point: I am least sure about the binary nature of moral worth; it is possible to modify the "right reasons" view to allow for degrees of worth based on the proportion of duty in the motive cocktail, which would salvage some agency without denying the muddy motives assumption.
