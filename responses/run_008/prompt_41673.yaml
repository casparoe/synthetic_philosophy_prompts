      *   *Implication 1: Moral Nihilism/Skepticism regarding Worth.* If the condition for worth is never met, then no one has moral worth. This leads to a stark divide between *rightness of action* and *goodness of agent*.
      *   *Implication 2: Praise and Blame.* If no one has moral worth, do praise/blame make sense? Blame might still work for deterrence (consequentialist), but *retributive* blame or *aretaiic* praise (praise of character) becomes fictional. We praise the *outcome*, not the *will*.
      *   *Implication 3: Institutions vs. Individuals.* Institutions operate on incentives (reputation, money, law). These are "muddy" motives. If individuals can't be pure, but institutions can reliably produce right *actions* via muddy motives, institutions might be morally superior *in terms of outcomes*, but individuals remain morally bankrupt *in terms of worth*. Actually, the prompt asks if institutions could be "morally better." If moral worth is impossible for humans, maybe institutions are the only vehicle for "good" (defined as right action), even if they lack "worth" too. But institutions aren't agents in the Kantian sense. So, institutions become the necessary substitute for moral agency.
