      *   **(4) Expert Justification:** Expert experiences provide *fresh* justification, even if belief-shaped. (Perceptual justification survives penetration).
      *   **(5) Bias as Perceptual Defect:** Bias (e.g., racial/medical) affects perception itself, and this is a *defect* in perception/justification. (Penetration can be epistemically bad).
