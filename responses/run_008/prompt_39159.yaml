answer: |-
  This is an impressive draft. It is clear, precise, and engages with live debates in epistemology and philosophy of mind. You write like someone who has done the reading. However, as an audit, my job is to find the cracks before the admissions committee does.

  Currently, your six claims do not fully "support one another." In fact, two of them are in direct contradiction, and a third creates a significant logical trap for your theory of justification. If you submit this as-is, a sharp reader will stop at claim (3) and wonder if you noticed it conflicts with claim (2).

  Here is the breakdown of the tensions, ranked by severity, followed by the single revision that will stabilize the whole system.

  ### 1. The Critical Contradiction: Claim (2) vs. Claim (3)
  **Severity: Fatal**

  *   **The Conflict:** Claim (2) asserts that cognitive penetration is real and that prior knowledge changes what you see (the Dalmatian, the radiologist). Claim (3) asserts that beliefs *never* alter the character of an experience itself, only where you look or how you judge.
  *   **Why it matters:** These are mutually exclusive definitions of "seeing." In (2), the Dalmatian example is cited as proof that the *visual experience* changes (you see a dog, not noise). In (3), you explain that same phenomenon by saying the visual experience *doesn't* change, only your attention or judgment does. You cannot argue that penetration changes the experience (2) and then define penetration as something that *doesn't* change the experience (3).
  *   **The Fix:** You must choose a side. Given that claims (4) and (5) rely on the idea that experts and bigots literally *perceive* the world differently, you are committed to the view in (2). You need to rewrite (3) to admit that top-down processing can alter phenomenal character (how things look), not just attention.
  *   **The Cost:** You lose the safety of "Visual Encapsulation." If you admit beliefs change how things look, you open yourself to the charge that perception is no longer a neutral check on belief. You will need to work harder to explain why perception is still a source of *justification* (Claim 1) if it is so easily molded by prior belief.

  ### 2. The Epistemic Trap: Claim (1) vs. Claim (5)
  **Severity: High**

  *   **The Conflict:** Claim (1) is a "Dogmatist" or "Phenomenal Conservative" stance: if it seems to you that $X$, you are justified in believing $X$, full stop (without checking reliability first). Claim (5) says that when bias drives perception, the perception itself is defective.
  *   **Why it matters:** If (1) is true, then the biased physician in (5) *is* justified in their belief, because their perception seems to present the patient as drug-seeking. If (5) is true, they are *not* justified, because the perception is defective. You currently hold that the perception is defective (5) but also that seemings generally justify without reliability checks (1).
  *   **The Fix:** You need to qualify (1). You must add that perceptual justification is *defeasible* if the etiology of the seeming is known to be epistemically vicious.
  *   **The Cost:** You lose "Simple Dogmatism." You can no longer say seemings justify *without* establishing reliability. You now have to say seemings justify *unless* there is a specific reason to doubt their origin (like known bias). This makes your epistemology slightly more complex but much more defensible.

  ### 3. The Mechanism Tension: Claim (3) vs. Claim (4)
  **Severity: Medium**

  *   **The Conflict:** Claim (4) says the expert gets "entirely fresh justification." Claim (3) says the experience itself doesn't change, only attention does.
  *   **Why it matters:** If the experience doesn't change (per 3), the radiologist isn't getting *perceptual* justification for the tumor; they are just applying a rule to data everyone else sees. That would be inference, not perception. For (4) to be true (that it is *perceptual* justification), the experience must be different, which brings you back to the contradiction with (3).
  *   **The Fix:** This resolves automatically if you fix the (2) vs. (3) contradiction. If you admit the experience changes, the expert truly has new perceptual evidence.

  ### Ranking of Tensions

  1.  **(2) vs. (3):** This is a logical contradiction. It must be fixed first.
  2.  **(1) vs. (5):** This is an epistemic inconsistency. It undermines your normative conclusion about bias.
  3.  **(3) vs. (4):** This is a consequence of the first tension.

  ### The Single Revision Strategy

  If you make one change, it should be to **Claim (3).**

  **Current (3):** *"...beliefs affect perception only by steering attention... they never alter the character of an experience itself..."*

  **Proposed Revision:** *"...beliefs affect perception not only by steering attention but by modulating the processing of the stimulus itself. While the raw sensory input is fixed, the resulting phenomenal character—how things look—is partly constituted by cognitive expectations."*

  **Why this cleans up the mess:**
  1.  **Aligns with (2):** It validates the Dalmatian and radiologist examples as genuine changes in experience, not just judgment.
  2.  **Supports (4):** It explains how the expert gets "fresh" justification: because their visual experience actually contains more information than the novice's.
  3.  **Supports (5):** It explains why bias is a *perceptual* defect. If cognition shapes the look of the experience, then vicious cognition produces vicious experiences.

  **What this forces you to give up:**
  You must give up the idea that perception is a "pure" given that is immune to theory. You are now arguing that perception is "theory-laden." This makes Claim (1) harder to defend. If perception is theory-laden, why should we trust it as a basic source of justification?

  **How to patch Claim (1) to match:**
  You don't need to delete (1), but you must add a "ceteris paribus" (all else being equal) clause.
  *   *Revision:* "Perception is a basic source of justification... provided there are no specific reasons to suspect the cognitive background distorting the experience."

  ### Final Advice for the Statement

  Your prompt asks you to explain "how the views support one another." Currently, they fight. By adopting the revision above, you create a coherent narrative arc:

  1.  **Foundation:** Perception justifies belief (1).
  2.  **Mechanism:** But perception is shaped by cognition/expectation (Revised 2 & 3).
  3.  **Positive Consequence:** This allows for expertise and perceptual learning (4).
  4.  **Negative Consequence:** This also allows for bias to corrupt justification at the root (5).
  5.  **Method:** We determine the limits of this shaping through experiment, not intuition (6).

  This creates a unified theory: **Perceptual Plasticity.** You are arguing that the very feature that makes expertise possible (the ability of belief to shape sight) is the same feature that makes prejudice dangerous. That is a sophisticated, coherent philosophical commitment.

  Make that change, and you will have a very strong application.
