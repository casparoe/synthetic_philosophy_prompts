      *Wait, one nuance:* Chalmers *does* argue virtual objects are real. The student says Chalmers argues they are *fictional*. This is the opposite of his actual view. This is a critical error.
      *Another nuance:* The prompt asks "in virtue of what it is real." The student answers "resources, artifact, suffering." This is a bit of a scattergun approach. A better answer would pick one ontological ground (e.g., institutional facts, digital materialism, or phenomenological value).

