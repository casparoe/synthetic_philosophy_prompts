          *   *Analysis:* This shifts the goalposts from "Language Acquisition Device (LAD)" to "General Cognition + Rich Input."
          *   *Facts:* Child input *is* multimodal. LLMs are text-only (mostly).
          *   *Nuance:* This redefines "innateness." Chomsky argued for *linguistic* universals. Cognitive scientists argue for *general* learning biases.
          *   *Verdict:* Half-Right. Accurate about input richness, but conflates "innate language structure" with "innate learning biases."

      *   **Move 4 (Jonah):** *Claim:* Reclassifying biases as "general" makes the theory unfalsifiable. Also, LLMs use RLHF (feedback), which kids don't get (negative evidence).
