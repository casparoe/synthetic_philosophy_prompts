      *   **Move 6 (Jonah):** *Claim:* Fluency $\neq$ Acquisition. Kids converge uniformly/fast from messy data. Models don't do this from comparable data. Empirical question remains.
          *   *Analysis:* The "Critical Test" argument.
          *   *Facts:* Models *fail* on child-sized data. Convergence is a key feature of human language.
          *   *Verdict:* Right. This is the scientific standard. Until a model learns like a child, the debate isn't over.

