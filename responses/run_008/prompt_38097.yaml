answer: |-
  You have identified a genuine gap in the classical speech act literature, and your intuition that Austin's framework is too static to capture it is correct. Austin treats the felicity of a performative as a property determined at the *moment of utterance* based on the conditions obtaining *at that moment*. He does not have a robust category for a performative that is infelicitous (a misfire) at $t_1$ but becomes felicitous at $t_2$ through social practice, thereby rewriting the normative status of $t_1$.

  There is no single, canonical term in the Austin/Searle canon for this specific phenomenon. However, the phenomenon is well-discussed in the intersection of **institutional fact theory**, **legal philosophy**, and **normative pragmatics**.

  Here is the breakdown of the concept, the principled line you are looking for, and the candidate terminology.

  ### 1. The Conceptual Gap: Static vs. Dynamic Felicity
  Austin's "misfire" is binary: either the conventions exist and are followed (felicitous) or they don't (infelicitous/void). Your cases show that felicity can be **dynamic**. The "act" isn't just the utterance; it is the utterance *plus* its uptake and integration into the normative fabric of the community.

  In contemporary speech act theory (specifically the work of **Marina Sbisà** and **Mary Kate McGowan**), speech acts are understood as modifying the "conversational score" or the normative positions of the participants. Your cases describe a scenario where the *scorekeeping community* (the state, the board, the congregation) has the power to adjust the score retroactively.

  ### 2. The Principled Line: Constitutive vs. Procedural Defects
  You asked for the line between the cases that get fixed (lapsed license, premature vote) and the ones that don't (bigamy, defrocked priest). In legal theory, this is the distinction between **Void** (*null ab initio*) and **Voidable** (*valid until annulled*). In speech act/institutional terms, the distinction is between **Constitutive Defects** and **Procedural/Authority Defects**.

  *   **Constitutive Defects (The Unfixable):** These violate the *definition* of the act itself.
      *   *Example:* Bigamy. The institution of marriage is *defined* as a union of two unmarried persons. If one is already married, the utterance *cannot* count as a marriage within that institution, regardless of uptake. The "counts as" rule (Searle's $X$ counts as $Y$ in $C$) is logically impossible to satisfy.
      *   *Speech Act Status:* **Nullity.** The illocutionary act simply does not exist. No amount of practice can create it because the practice would be contradictory to the institution's own rules.
  *   **Procedural/Authority Defects (The Fixable):** These violate the *conditions of execution* but not the *definition* of the act.
      *   *Example:* Lapsed license, premature board vote. The couple *could* be married; the board *could* approve the merger. The defect is in the *pathway* to the status, not the status itself.
      *   *Speech Act Status:* **Defeasible / Ratifiable.** The illocutionary act is "pending" or "defective" but capable of being cured.

  ### 3. The Mechanism: Retrospective Collective Acceptance
  How does the fix happen without a new utterance? This is where **John Searle's** theory of **Institutional Facts** is more useful than Austin's.

  For Searle, institutional facts (marriage, money, presidency) exist only because of **Collective Intentionality** (we agree that this counts as that).
  *   In the "fixable" cases, the community engages in **Retrospective Collective Acceptance**.
  *   By acting as though the marriage existed (filing joint taxes, recognizing the spouse), the community is performing a *secondary*, tacit speech act of **Recognition**.
  *   This Recognition functions as a **Ratification**.

  Crucially, ratification in this context is not just a new act; it is a speech act that *re-describes the past*. It changes the *normative history*.

  ### 4. Candidate Terminology
  Since there is no standard Austinian term, here are the three best candidates from adjacent literature, ranked by fit:

  **A. Ratificatory Uptake (Best Pragmatic Fit)**
  Standard "uptake" (Strawson/Austin) is the audience understanding the force at the time of utterance. **Ratificatory Uptake** is the community accepting the force *after* the fact, thereby validating the original utterance.
  *   *Why it fits:* It centers the speech act mechanism (uptake) but accounts for the temporal delay and the social nature of the validation.

  **B. Retrospective Felicity (Best Descriptive Fit)**
  This directly names the paradox you identified. The act was infelicitous at $t_1$ but is treated as felicitous at $t_2$.
  *   *Why it fits:* It challenges the Austinian assumption that felicity is time-bound to the utterance.

  **C. Validating Convention (Best Institutional Fit)**
  This refers to the social rule that allows defects to be cured. The "convention" isn't just the marriage rule; it's the *meta-rule* that says "substantial compliance counts as compliance."
  *   *Why it fits:* It explains *why* the act counts. It counts because a higher-order convention permits the cure.

  ### 5. Addressing Your Edge Case
  *The couple splits up the week before the lapsed-license defect is discovered: does the marriage retroactively un-happen?*

  Under the framework of **Voidable/Ratifiable** acts:
  1.  **If the state ratifies:** The marriage is valid *ab initio* (from the beginning). The subsequent split is a **divorce**, not a separation. The retroactivity holds because the *status* was cured, not just the *consequences*.
  2.  **If the state refuses to ratify (because they split):** The act remains a **misfire**. They were never married.
  3.  **The Philosophical Crux:** This reveals that the "validity" is not an intrinsic property of the utterance, but a **relational property** between the utterance and the *current* stance of the institution.
      *   If the institution *needs* the marriage to be valid (to settle the mortgage, legitimize kids), it exercises **Retrospective Collective Acceptance**.
      *   If the institution has no stake (they split, no assets), it may let the misfire stand.

  This suggests the "act" is not finished at the utterance. It is a **process** that remains open to normative closure until the institution closes the file.

  ### 6. Recommended Reading
  Since you are in political philosophy, you might find these bridges helpful:
  *   **John Searle, *The Construction of Social Reality*:** Specifically on how institutional facts depend on continuous collective acceptance.
  *   **Marina Sbisà, "Normativity and the Speech Act":** She argues speech acts create normative effects that can be modified or contested over time.
  *   **H.L.A. Hart, *The Concept of Law*:** Specifically the "Rule of Recognition." The "fixable" cases are where the Rule of Recognition allows for customary validation of defective acts.
  *   **Mary Kate McGowan, "Conversational Score":** Her work on how conversational norms shift can be applied to how institutional "scores" are adjusted retroactively.

  ### Summary
  The term you are looking for does not exist in classical Austinian theory because Austin viewed performatives as episodic events, not ongoing normative processes. The phenomenon is **Retrospective Validation via Ratificatory Uptake**.

  The principled line is between **Constitutive Defects** (logical impossibility within the institution, e.g., bigamy), which result in **Nullity**, and **Procedural Defects** (authority/timing errors), which result in **Voidability** and are curable via **Collective Acceptance**. The "act" becomes valid not because the original utterance changed, but because the community's *standing commitment* to that utterance changed, rewriting the normative history.
