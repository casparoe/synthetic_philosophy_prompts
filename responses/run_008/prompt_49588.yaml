  ## 5. Handout Text (British English)

  *Print these on separate sheets. Do not title them "Mugging" or "Blackmail".*

  ### HANDOUT: SCENARIO A

  **INSTRUCTIONS**
  1.  **Select a Policy:** Choose either **RED (Pay)** or **BLUE (Refuse)**. Write this on your card and seal it in the envelope.
  2.  **The Coin:** The Instructor will flip a fair coin for you.
  3.  **The Outcome:**
      *   If **HEADS**: You will be offered a **Reward** of 2 chocolate bars. *This reward is only paid if your Policy is RED.*
      *   If **TAILS**: You will receive a **Request** to give 1 chocolate bar to the Instructor. *This request is only enforced if your Policy is RED.*
  4.  **Commitment:** If your Policy is RED, you *must* pay the bar if requested. If your Policy is BLUE, you keep your bar but forfeit the Reward.

  ***

  ### HANDOUT: SCENARIO B

  **INSTRUCTIONS**
  1.  **Select a Policy:** Choose either **RED (Pay)** or **BLUE (Refuse)**. Write this on your card and seal it in the envelope.
  2.  **The Coin:** The Instructor will flip a fair coin for you. This determines the **State**.
      *   **HEADS**: **Scandal** (You lose 5 bars automatically).
      *   **TAILS**: **Clean** (You lose 0 bars automatically).
  3.  **The Letter:** You will receive a **Request Note** based on the following rule:
      *   You get the Note **IF AND ONLY IF**: (Your Policy is RED) **XOR** (Coin is HEADS).
  4.  **The Outcome:**
      *   If you receive the Note: You must pay 1 bar *if* your Policy is RED.
      *   If you do not receive the Note: No payment is made.
      *   *Note: The Scandal loss (5 bars) happens regardless of the Note, based solely on the Coin.*

