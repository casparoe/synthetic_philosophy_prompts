  Here is a complete lesson plan, designed for a 90-minute seminar with 12 third-year students. It includes the game mechanics, handout text (in British English), a minute-by-minute run sheet, and a guide for the debrief that highlights the philosophical machinery without giving away the verdicts prematurely.

  # Seminar Plan: Counterfactuals, Policies, and Blackmail
  **Module:** Decision Theory (Year 3)
  **Duration:** 90 Minutes
  **Participants:** 12 Students
  **Budget:** ~£15 (Chocolate) + Seminar Credit Points

  ## 1. Learning Objectives
  1.  **Experiential:** To feel the ex-post regret of an updateless policy in a Counterfactual Mugging scenario (paying when the coin is Tails).
  2.  **Analytical:** To distinguish between *Counterfactual Mugging* and *XOR Blackmail* by observing that identical surface-level choices can have opposite ex-ante optimal policies depending on the generative logic of the request.
  3.  **Formal:** To map the game outcomes onto Act vs. Policy choice and Ex-post vs. Ex-ante evaluation.

  ## 2. Materials Required
  *   **Chocolate:** 20 bars (e.g., Maltesers or similar). Keep them visible on the desk.
  *   **Envelopes:** 12 brown A5 envelopes (for Policy Cards).
  *   **Cards:** 24 small index cards (12 Red, 12 Blue).
      *   *Red* = "PAY / GIVE"
      *   *Blue* = "REFUSE / KEEP"
  *   **Coins:** 6 large, distinct coins (or use a projected random number generator for transparency).
  *   **Handouts:** Two distinct sheets (Scenario A and Scenario B). *See Appendix.*
  *   **Board:** Whiteboard for payoff matrices during debrief.

  ## 3. The Game Structure

  ### Round 1: The Counterfactual Mugging
  *   **Logic:** A fair coin is flipped for each student.
      *   **Heads:** You receive 2 bars *if* your Policy was RED (Pay).
      *   **Tails:** You are asked to give 1 bar *if* your Policy was RED (Pay).
  *   **Updateless Verdict:** RED (Pay). (Ex-ante expected value: +0.5 bars).
  *   **Updateful Verdict:** BLUE (Refuse). (Ex-post value in Tails world: +1 bar saved).
  *   **The Sting:** Students who pick RED and get Tails must physically hand you a bar. They will watch students who picked BLUE keep theirs. This must feel unfair.

  ### Round 2: The XOR Blackmail
  *   **Logic:** A fair coin is flipped for each student (State of the World).
      *   **Heads:** "Scandal" (You lose 5 bars automatically).
      *   **Tails:** "No Scandal" (You lose 0 bars).
      *   **The Letter:** You receive a request note *if and only if* (Policy = RED) XOR (Coin = Heads).
      *   **The Choice:** If you receive the note, your Policy determines if you pay 1 bar.
  *   **Updateless Verdict:** BLUE (Refuse). (Ex-ante expected loss: 2.5 bars).
      *   *Reasoning:* Policy RED means you pay 1 bar when there is No Scandal (useless) and face Scandal when there is Scandal. Policy BLUE means you face Scandal when there is Scandal, but pay nothing.
  *   **Updateful Verdict:** RED (Pay). (If you have the note, paying correlates with No Scandal).
  *   **The Trap:** The physical experience is identical to Round 1 (Coin flip, Request Note, Pay 1 bar). Students will likely default to RED again, losing more points ex-ante.

