  ## 6. The Debrief Guide (Mapping to Theory)

  ### Part 1: The Pain of Round 1 (Mugging)
  *   **Ask:** "Hands up who chose RED and got Tails?" (These students lost chocolate). "How did that feel?"
  *   **Point:** This is the **Ex-Post Regret**. In the actual world (Tails), the causal consequence of RED was a loss. CDT says you should have chosen BLUE *given* you are in the Tails world.
  *   **Board Work:** Calculate Ex-Ante Expected Value (EV).
      *   RED: $(0.5 \times 2) + (0.5 \times -1) = +0.5$
      *   BLUE: $(0.5 \times 0) + (0.5 \times 0) = 0$
  *   **Concept:** **Updatelessness.** You are choosing a *Policy* (a function from states to actions), not an *Act*. The value of the policy is the weighted average across *all* possible worlds, including counterfactuals where you didn't have to pay.

  ### Part 2: The Trap of Round 2 (Blackmail)
  *   **Ask:** "Who chose RED again?" (Many will, due to anchoring). "Who lost more chocolate in Round 2 than Round 1?"
  *   **Reveal:** Write the XOR table on the board.
      *   **Policy RED:** Letter arrives if (True XOR Heads) $\rightarrow$ Letter if **Tails (No Scandal)**.
          *   Result: You pay 1 bar when there is no scandal. You face Scandal (5 bars) when there is no letter.
          *   Exp Loss: $(0.5 \times 1) + (0.5 \times 5) = 3$ bars.
      *   **Policy BLUE:** Letter arrives if (False XOR Heads) $\rightarrow$ Letter if **Heads (Scandal)**.
          *   Result: You pay 0 bars. You face Scandal (5 bars) when letter arrives.
          *   Exp Loss: $(0.5 \times 0) + (0.5 \times 5) = 2.5$ bars.
  *   **Concept:** **Logical Dependence.** In Round 1, the *Reward* depended on your policy in the counterfactual. In Round 2, the *Arrival of the Request* depended on your policy.
  *   **The Disanalogy:** In Round 1, paying 'buys' the reward in the Heads world. In Round 2, paying 'buys' the letter in the No-Scandal world (which is bad news; it means you are paying for nothing).
  *   **CDT/EDT Failure:** If you update on receiving the letter in Round 2, you think: "Letter means (Pay XOR Scandal). If I Pay, Scandal is False." So you Pay. But this ignores that your Policy *caused* the letter to arrive in the safe world.

  ### Part 3: Limitations of the Classroom Analogy
  *   **The Predictor:** "I am Omega." In reality, I am just a human following a script. You have to trust I didn't peek at your cards. In real UDT, the 'predictor' is a logical fact, not a person.
  *   **Single Shot:** UDT works best when you are one of many identical agents or face the problem repeatedly. Here, you only live one branch. The 'loss' in the Tails world is real chocolate, not a counterfactual. We smooth this over by calculating EV, but the emotional sting remains.
  *   **Transparency:** In Round 2, the XOR rule was written on your sheet. In real blackmail, the blackmailer's algorithm is hidden. You had an informational advantage here that you wouldn't have in reality.

