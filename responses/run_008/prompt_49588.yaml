  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Stakes** | Explain the chocolate/points system. Emphasise that policies must be written *before* coins are flipped. |
  | **10–15** | **Round 1 Setup** | Hand out **Scenario A** sheets. Students write Policy (Red/Blue) on card, seal in envelope. |
  | **15–25** | **Round 1 Execution** | Flip coins publicly. Distribute rewards/requests. **Crucial:** Collect chocolate from Tails/Red students immediately. |
  | **25–35** | **Round 1 Debrief** | Ask Tails/Red students how they feel. (Likely: "Ripped off"). Calculate Ex-Ante EV on board. Introduce "Policy Optimisation". |
  | **35–40** | **Round 2 Setup** | Hand out **Scenario B** sheets. *Do not highlight differences.* Students write Policy again. |
  | **40–50** | **Round 2 Execution** | Flip coins. Distribute requests. Collect chocolate. |
  | **50–70** | **Round 2 Debrief** | Reveal the XOR logic. Show why Red was the losing policy this time. Compare with Round 1. |
  | **70–85** | **Formal Mapping** | Map the game to CDT/EDT/UDT. Discuss the "Predictor" (You) and the "Logical Dependence". |
  | **85–90** | **Wrap Up** | Assign reading (e.g., Soares & Yudkowsky on FDT). Return any remaining chocolate. |

