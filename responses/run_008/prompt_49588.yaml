  I teach a small decision theory seminar at a UK university — twelve third-years, one 90-minute session — and we've just finished causal vs evidential decision theory, so next week I want them to actually meet counterfactual mugging before they've read anyone's verdict on it. I want a game with real stakes, small ones: I've got about £15 of chocolate and a few bonus quiz points I'm allowed to hand out. My vague idea is that a coin gets flipped in a back room, some students play "the predictor" and some play the muggee, and the payoffs mirror the classic setup — but I'm open to better structures, and a colleague suggested everyone writes a sealed "policy card" before roles get assigned, which seems promising but I haven't thought it through. The hard part I can't solve myself: updatelessness only pays off across possible worlds, and in the single run each student actually lives through, the ones who precommitted will mostly sit there watching their precommitment lose them chocolate. I want that loss to be vivid, not smoothed over.

  Second thing, and honestly the more important one: later in the term we do XOR blackmail, and every year the students who've just been convinced by the mugging decide updatelessness must also say pay the blackmailer. The disanalogy — that the blackmailer's letter arriving isn't sensitive to your policy the way the mugger's request is — is exactly the subtle bit, and I want them to trip over it rather than be told. So if you can build a round two into the same session, same students, roughly same props, where the situation looks identical from the muggee's chair but the ex-ante value of the "updateless" policy has flipped sign, that would be gold. Ideally they should discover they can't tell the two scenarios apart from their seat, and only in the debrief work out what information they were missing.

  So give me full rules, roles, materials, a payoff scheme that works with chocolate and points rather than real money, a minute-by-minute timeline for 90 minutes, and a debrief that maps specific moments from the game onto the formal machinery (act choice vs policy choice, ex post vs ex ante evaluation, and whatever else fits). Also be honest about what a classroom version cannot reproduce — I obviously can't make the world genuinely depend on their policies the way a real predictor would, so tell me where the analogy gets thin and how I should flag it instead of papering over it. And a realistic list of what will predictably go wrong the first time I run it, with fixes. Please write the whole thing in British English since I'll be lifting your handout text pretty much directly.
