  ## 7. Troubleshooting & Pitfalls

  | Problem | Likelihood | Fix |
  | :--- | :--- | :--- |
  | **Students refuse to pay chocolate.** | Medium | Make it clear upfront that seminar points are tied to compliance. Or, use "IOU tokens" redeemable for chocolate at the end, so they don't have to physically hand it over mid-game. *Recommendation:* Use physical chocolate for the "sting", but have a reserve to top them up if morale crashes. |
  | **Confusion over XOR logic.** | High | Draw the truth table on the board *before* Round 2 starts. Keep it visible. Use "True/False" instead of Red/Blue for the logic table to avoid colour confusion. |
  | **Round 2 feels too different.** | Medium | Emphasise the phenomenology: "In both rounds, you sat there, a coin flipped, and you got a note asking for chocolate." Keep the physical props identical. |
  | **Students game the system.** | Low | Collect policy cards *before* flipping coins. If a student tries to change their card after seeing the coin, disqualify them from points (gently). |
  | **Time overrun.** | High | Strictly limit the Round 1 debrief. The emotional reaction is important, but don't let it consume the XOR analysis. Cut the "Formal Mapping" short if needed; the game outcomes speak for themselves. |

  ## 8. Instructor's Cheat Sheet (Payoff Logic)

  **Round 1 (Mugging)**
  *   **Heads / Red:** Gain 2 bars.
  *   **Heads / Blue:** Gain 0 bars.
  *   **Tails / Red:** Lose 1 bar.
  *   **Tails / Blue:** Lose 0 bars.
  *   *Optimal Policy:* **Red** (EV +0.5).

  **Round 2 (XOR Blackmail)**
  *   *Scandal Cost:* 5 bars. *Payment Cost:* 1 bar.
  *   **Heads (Scandal) / Red:** No Letter (True XOR True = False). Lose 5 (Scandal).
  *   **Heads (Scandal) / Blue:** Letter (False XOR True = True). Lose 5 (Scandal).
  *   **Tails (Safe) / Red:** Letter (True XOR False = True). Lose 1 (Payment).
  *   **Tails (Safe) / Blue:** No Letter (False XOR False = False). Lose 0.
  *   *Optimal Policy:* **Blue** (EV Loss 2.5 vs 3.0).

  ## 9. Post-Seminar Reading Note
  *Tell them:* "For next week, read Soares & Yudkowsky on Functional Decision Theory. Pay attention to how they define 'subjunctive dependence'. Think about whether my coin flips counted as subjunctive dependence or just causal chance."
