      **MEMORANDUM**
      **TO:** Algorithmic Tools Review Panel
      **FROM:** [Your Name]
      **DATE:** October 26, 2023
      **SUBJECT:** Recommendation on Lead Hazard Scoring Model

      **Recommendation**
      I recommend we conditionally approve the lead-hazard model, contingent on replacing the strict ranking system with a **weighted lottery among the top 300 high-risk homes** per inspection cycle.

      **The Calibration vs. Equity Bind**
      Our audit confirmed the mathematical constraint: because lead prevalence varies by neighborhood, we cannot simultaneously achieve perfect calibration (a score of 65 means 65% risk everywhere) and equal missed-hazard rates (same false-negative rate across neighborhoods). We must choose.

      **The Case for Calibration (and why we aren't choosing it)**
      The proponents of calibration argue that trust requires transparency. If a "65" implies different risks in different zip codes, residents may view the tool as opaque or manipulated. This is a valid concern; public trust is the currency of government efficacy. However, prioritizing score interpretability here comes at the cost of public health. Strict calibration would require higher score cutoffs in high-prevalence neighborhoods to maintain equal false-negative rates, effectively deprioritizing inspections where lead is most common. We cannot accept a system that mathematically guarantees we miss more lead in the neighborhoods that need us most.

      **Why the Weighted Lottery?**
      The equal missed-hazard approach better serves our mission, but strict ranking introduces false precision. The difference between a score of 68 and 61 is often statistical noise, not meaningful risk differentiation.
      The weighted lottery compromise takes this uncertainty seriously. By pooling the top 300 homes and weighting selection by score, we keep inspections focused on high-risk properties (preserving equity) without enforcing a hard cutoff that suggests the model knows more than it does. It prevents a scenario where a home is skipped solely because it scored three points lower than a neighbor, acknowledging that our data is imperfect.

      **Public Communication**
      We must be honest about what the scores mean. When a resident asks why their "68" was passed over for a "61," we should say:

      *"These scores estimate risk, not certainty. Within the high-risk pool, the difference between scores is too small to justify skipping your home. We use a lottery to ensure every high-risk home gets a fair chance at inspection, rather than relying on false precision."*

      This approach balances harm reduction with intellectual honesty. I look forward to discussing this at Tuesday's session.

