answer: |-
  **OFFICE OF ETHICS AND EMERGENCY PLANNING**
  **POLICY DOCUMENT 74-B: NON-AGGREGATION IN TRIAGE AND RESOURCE ALLOCATION**

  **1.0 General Principle of Moral Arithmetic**
  The Hospital recognizes no moral entity comprising multiple patients. Loss is experienced individually. Consequently, the death of five patients constitutes five distinct losses, not a loss greater than that of one patient. Staff are prohibited from summing outcomes across persons. Decisions regarding life-saving resources must not treat the number of lives at stake as a decisive variable.

  **2.0 Canonical Procedure for Conflicting Claims**
  When resources are insufficient to save all parties, and claims are deemed equal, allocation shall be determined by coin flip.
  **2.1** The coin must be calibrated annually by Metrology to ensure a 50/50 probability distribution.
  **2.2** The flipper must be a party with no stake in the outcome, excluding attending physicians with prior therapeutic relationships.
  **2.3** Grievances regarding flip outcomes must be filed individually. The Office of Ethics will not accept joint petitions. A complaint filed by six families regarding a single flip is processed as six separate documents; the volume of paperwork does not constitute increased urgency.

  **3.0 Exclusion of External Stakeholders**
  The loss of a patient is a loss to that patient. Interests held by others in the patient's survival are excluded from triage weighting.
  **3.1** Dependents: The existence of minor children does not increase a parent's claim to resources. To weigh the children's loss would require aggregating the children's suffering with the patient's death, violating Section 1.0.
  **3.2** Waiting Lists: The potential survival of five transplant candidates does not outweigh the life of one donor candidate. The committee is reminded that confusing something that is good for five people with something five times as good is a category error.

  **4.0 Institutional Reporting and Epidemiology**
  To maintain compliance with non-aggregation standards, quantitative reporting is suspended.
  **4.1** The Quality Dashboard shall no longer report "Total Deaths This Quarter." Nothing that happened to Patient A adds up with anything that happened to Patient B.
  **4.2** The Epidemiology Department is restricted to qualitative case studies. Population-level infection rates imply a collective body which does not exist.
  **4.3** Actuarial tables relying on risk pooling are void. Insurance procurement will proceed based on individual risk profiles without population averaging.

  **5.0 Appendix: The Friendship Provision**
  Clinicians may weight the coin flip in favor of a patient with whom they share a personal relationship. While all patients hold an equal claim not to die, the clinician holds a special obligation to their friend. This does not violate patient equality, as the obligation resides in the agent, not the patient. Staff must document the friendship to prevent claims of aggregate favoritism.

  **6.0 Director's Closing Statement**
  We conclude the first fiscal year of Policy 74-B. We have successfully eliminated the practice of sacrificing the few for the many. While we cannot report on total survival rates, as such totals are morally fictitious, we confirm that no individual death was ever treated as merely a unit in a calculation. The integrity of each distinct loss remains preserved. We are satisfied that no patient was ever outnumbered.
