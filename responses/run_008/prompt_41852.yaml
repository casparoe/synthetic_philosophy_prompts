      *Wait, one more check on the TA's likely intent.* The TA said "nothing over and above" to *stop* the question. This suggests they view it as a settled matter. This points to **Grounding** or **Composition as Identity**. Grounding is the standard contemporary metaphysics answer. Identity is older but still around. Grounding allows for existence without fundamentality. This fits the "derivatively exist" narrative.
