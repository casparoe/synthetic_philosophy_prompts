  To ensure you can navigate the guest's tendency to widen the notion of felt tone until objections dissolve, I have drafted eight questions that progressively tighten the constraints on his position. Each paragraph below contains a primary question phrased for you to read aloud, followed by a conditional follow-up keyed to the response he is most likely to offer.

  Begin by pressing the classic heterogeneity worry with a concrete triad he cannot easily wave away. Ask him directly whether he can point to anything these three episodes share other than the label: the sweetness of tasting ripe fruit, the absorbed flow of working through a proof, and the dull relief when a headache finally lifts. He will likely insist that there is a common positive glow or hedonic tone present in all three. If he makes this move, press him on whether this glow is phenomenally distinct from the content of the experience itself, or if it is merely a theoretical posit we paste onto diverse feelings after the fact.

  Force a choice between treating hedonic tone as a determinable like color, whose determinates resemble each other by being specifications of a common property, and treating the category of pleasure as a family-resemblance structure whose members share nothing but overlapping similarities. He is likely to prefer the determinable model to preserve unity, but if he concedes to family resemblance to accommodate diversity, you must ask whether such a loose structure can still distinguish genuine pleasure from the mere absence of discomfort, which it had better do if pleasure is to carry the normative weight hedonism places on it.

  Confront him with the attitudinal alternative on which pleasure is not a sensation at all but a favorable propositional attitude toward a state of affairs. Probe whether he can dismiss a theory that explains the data without positing any common felt quality, given that the attitudinal view handles heterogeneity effortlessly. He will likely respond that attitudes without felt tone leave out what we care about when we care about pleasure. If he says this, ask him why the felt tone is necessary for well-being if the attitude alone suffices to motivate action and sustain engagement.

  Test the analogy I have been playing with by asking whether hedonic tone could be like musical consonance, which is not a single acoustic feature shared by all consonant intervals but a cluster of relational facts about frequency ratios, explaining why consonance admits of degrees and borderline cases while still being a real phenomenon. I expect him to accept the analogy to save the unity of pleasure. If he does, press him on whether this means pleasure is relational rather than intrinsic, and if so, whether pleasure is no longer the simple, homogeneous foundation that hedonism about well-being needs it to be.

  Address his strategy of widening the notion of felt tone directly by asking whether there is any limit to what can count as a hedonic tone under his definition. He will likely say that the tone is abstract enough to cover diverse cases but specific enough to exclude pain. If he claims this, ask him to describe the boundary without using circular terms like positive or negative, and press whether a tone thin enough to cover both fruit and proofs is robust enough to ground a theory of value.

  Challenge the normative work his view is supposed to do by asking whether the single hedonic tone is what makes pleasure good, or whether it is merely a marker for something else that is good. He will likely say the tone itself is the source of value. If he holds this line, ask him why we sometimes reject pleasures that share this tone, such as malicious joys, and whether his view can account for the intuition that some pleasures are unworthy of pursuit despite feeling the same.

  Ask him whether the difference between two pleasures is ever a matter of quality rather than just intensity of the same tone. He is likely to argue that all qualitative differences belong to the non-hedonic content, while the hedonic tone varies only in intensity. If he maintains this, present the case of dull relief versus ecstatic joy and ask whether the relief really has a lower intensity of the same tone, or if it is a different kind of positive feeling entirely that his theory misdescribes.

  Press the symmetry of his view by asking whether there is a single felt hedonic tone for pain that unifies all suffering, from grief to physical injury. He will likely say yes to maintain symmetry. If he does, ask whether the heterogeneity objection applies equally to pain, and if he must widen the notion of painful tone to accommodate it, whether the concept of hedonic tone becomes too vacuous to explain why we avoid pain in the first place.

  Confront the issue of retrospective pleasure by asking whether we can recognize an experience as pleasurable only after it has ended, even if no distinct tone was felt in the moment. He will likely deny this to protect the phenomenological claim. If he denies it, ask him to account for experiences where the pleasure seems to consist in the appreciation of the whole activity rather than a running commentary of felt tone, and whether his view excludes these from well-being.

  Finally, ask him whether the unity of pleasure is a precondition for hedonism or a conclusion derived from introspection. He will likely say it is a phenomenological fact that grounds the theory. If he insists on this, ask whether he would abandon hedonism if future psychology showed that no such common tone exists, or if he would redefine the tone to fit the theory, and what that says about the empirical credibility of his position.
