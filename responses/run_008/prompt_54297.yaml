prompt: |-
  So here's my situation. I've been a rationalist-adjacent lurker for like a decade (GEB did a number on me as a teenager, and yes, I've reread the Prelude/Ant Fugue dialogue way more times than is healthy), and somewhere along the way I got drafted as the "neutral moderator" for two friends of mine who have been fighting about the Aunt Hillary question for close to two years now. One of them, Maya, is a cognitive scientist who got obsessed with superorganisms after reading about colony-level learning and is basically an emergentist about it: she thinks an ant colony can literally instantiate a mind at the colony level, that ants play the role neurons play, and that the pheromone trail network functions as the colony's memory the way connectome structure functions as ours. The other, Dmitri, is a computational neuroscience guy who thinks all of that is compositional aggregation dressed up with flattering vocabulary: the interesting cognition is inside individual ant brains, "the colony decided" is a convenient shorthand at best, and Maya is committing what he calls the Snow Crash fallacy — confusing self-organizing pattern formation with a subject that has the pattern.

  They've finally agreed to do a real adversarial collaboration, I'm Notarian style — claims both can sign, residual disagreements made precise, cruxes, pre-registered predictions, the whole thing — and they want me to draft the skeleton of the joint statement before their next session so they have something to fight over instead of each other. And honestly I'm out of my depth. There are things they obviously agree on (colonies do stuff no single ant "knows" how to do; foraging trails get reinforced and decay; ants individually are way dumber than the collective behavior suggests) and things where I genuinely can't tell if they're disagreeing about the world or about words. Like, is the fight over whether slow, sparse, chemistry-mediated integration can count as binding (Dmitri says integration has to be fast and dense, Maya says that's carbon chauvinism by proxy — slow down a human brain by a factor of a million and does the mind vanish?), or is it over whether you even need binding, or is it over whether "mind" requires phenomenal consciousness rather than just representational states? And then there's the stuff Maya brought up that I couldn't referee at all: colonies seem to remember good nest sites for months even though trail pheromone decays in hours, so if trails are the "memory," what's carrying the long-term stuff — and does that asymmetry cut for or against her? Also the individuation mess: an Argentine ant supercolony stretches across continents with millions of nests and no clear boundary, so is that one mind, thousands, or does the question reveal that "one colony = one mind" was never principled? Dmitri keeps pushing a prediction-based test — if colony behavior is fully derivable from ant-level rules plus environment, he wins, and Maya says that criterion would also disqualify brains, which is exactly the kind of move I need the document to evaluate.

  So: draft the joint statement for me, in American English please. I want (1) a numbered section of claims both of them could actually put their names to — about colony behavior, about what individual ants can and can't do, about what each side takes themselves to be explaining, with no slanted wording that either would reject; (2) a disagreements table laying out the precise points where they part ways, with each position phrased so its own holder would sign off on the formulation (this is the part I keep screwing up — my drafts always make Maya sound like she believes in a colony ghost, which she doesn't); (3) the cruxes, as many as you can identify, with for each one the experiment, argument, or thought experiment they'd both agree bears on it and both of their predictions written down in advance so they can be scored later; and (4) an honest section on which parts of the dispute are probably verbal — e.g., whether "the colony represents the food location" is a metaphor, a literally true but unexciting claim, or a genuinely loaded ontological commitment — and which parts are load-bearing and empirical. Dont worry about being neutral in the sense of splitting the difference; worry about being exact. If some crux would only be settled by data nobody has or maybe can't get, say that, since "this is not currently a testable disagreement" is itself something they should both be able to agree on.
