  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Ontological Status of Colony-Level Cognition in Formicidae
  **Parties:** Maya [Cognitive Science] vs. Dmitri [Computational Neuroscience]
  **Moderator:** [User Name]
  **Date:** October 26, 2023
  **Version:** 1.0 (Draft for Review)

  ---

  ### 1. AGREED PREMISES AND OBSERVABLES
  *Both parties affirm the following claims as empirically accurate descriptions of the system under discussion. No ontological commitment regarding "mind" is implied by this section.*

  1.  **Individual Limitations:** Individual ants (*Formica* spp. and related species) possess limited computational capacity, memory, and sensory range. No single ant possesses a cognitive map of the entire foraging territory or the structural blueprint of the nest.
  2.  **Collective Capabilities:** Colonies exhibit goal-directed behavior (foraging optimization, nest site selection, thermoregulation, defense) that is adaptive and robust to individual failure. These behaviors display properties associated with information processing: error correction, feedback loops, and state-dependent switching.
  3.  **Mechanism of Interaction:** Coordination is mediated primarily through stigmergy (environmental modification, specifically pheromone trails) and direct physical/chemical interaction (trophallaxis, antennation).
  4.  **Timescale Discrepancy:** Pheromone trails decay on the order of minutes to hours. Colony-level preferences (e.g., nest site fidelity) can persist for months or seasons.
  5.  **Derivability Principle:** Colony behavior is causally dependent on the behavior of individual ants and the physical laws governing their environment. There is no "action at a distance" or non-physical influence exerted by the colony upon the ants.
  6.  **Scope of Inquiry:** This collaboration restricts itself to *functional cognition* (information representation, integration, and decision-making). Questions regarding *phenomenal consciousness* (qualia, subjective experience) are acknowledged as unresolved but are excluded from the primary falsification criteria unless a party explicitly ties functional capacity to phenomenal requirements.

  ---

  ### 2. POINTS OF DISAGREEMENT
  *The following table isolates the specific propositions where the parties diverge. Each formulation is steelmanned to ensure the holder of the position can sign it without reservation.*

  | ID | Domain | Maya's Position (Emergentist) | Dmitri's Position (Reductionist) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Ontology of Cognition** | The colony functions as a distinct cognitive locus. The integration of information across ants via the environment realizes computational states that are not present in any subset of ants. The colony is the *subject* of the decision. | Colony-level cognition is a descriptive shorthand for aggregate individual behaviors. The only true cognitive loci are the individual ant nervous systems. "The colony decided" is a metaphor for "the ants collectively acted." |
  | **D2** | **Integration Requirements** | Cognitive binding does not require high-speed electrical signaling. Chemical/environmental integration is sufficient if it sustains a causal loop that preserves information over time. Timescale is relative to the system's operational tempo. | Cognitive binding requires fast, dense integration to unify disparate inputs into a single state before environmental variance disrupts the signal. Slow/chemical integration constitutes sequential causality, not simultaneous binding. |
  | **D3** | **Memory Substrate** | Long-term colony memory is instantiated in the structural configuration of the nest, the demographic distribution of experienced workers, and persistent chemical gradients, functioning analogously to synaptic weights. | Long-term colony "memory" is either (a) stored in individual ant brains and averaged out, or (b) a result of stable environmental features, not an internal representational state of the colony. |
  | **D4** | **Individuation** | Cognitive boundaries can be fuzzy. A supercolony constitutes a single distributed mind despite spatial discontinuity, analogous to a human mind surviving the replacement of neurons or bodily separation (e.g., split-brain). | A cognitive agent requires a defined boundary separating internal state from external noise. The lack of a clear boundary in supercolonies indicates there is no single agent there to be bounded. |
  | **D5** | **Explanatory Necessity** | A colony-level model provides predictive compression that is lost in ant-level simulation. The higher-level description captures causal powers irreducible to the lower level. | A complete ant-level simulation would render the colony-level description explanatorily redundant. If the lower level fully determines the outcome, the higher level adds no causal power. |

  ---

  ### 3. CRUXES AND PRE-REGISTERED PREDICTIONS
  *For each crux, we define the evidence required to shift credence and the specific predictions each party makes.*

  #### Crux 1: The Derivability Test (Reductionism vs. Compression)
  *   **Question:** Does the ability to derive colony behavior from ant-level rules falsify the existence of colony-level cognition?
  *   **Maya's Claim:** Derivability does not eliminate higher-level reality. Simulating every neuron in a human brain does not eliminate the "human" as a cognitive agent; it merely changes the resolution.
  *   **Dmitri's Claim:** If the colony behavior is fully predictable from ant rules + environment without positing a colony-state variable, the colony-state variable is ontologically superfluous (Occam's Razor).
  *   **Test/Argument:** Comparative modeling efficiency.
  *   **Pre-registered Predictions:**
      *   **Maya:** A model utilizing colony-state variables will achieve equal predictive accuracy with significantly fewer computational resources (higher compression) than an agent-based model, indicating the colony-state is a "real" causal abstraction.
      *   **Dmitri:** The agent-based model will not suffer significant computational penalty relative to the abstraction, or the abstraction will fail to predict edge-cases (e.g., pathologies) that the agent-based model captures, proving the abstraction leaks.

  #### Crux 2: The Memory Asymmetry (Decay vs. Persistence)
  *   **Question:** How is information retained longer than the decay rate of the primary communication medium (pheromones)?
  *   **Maya's Claim:** Memory is distributed across multiple substrates (nest structure, worker age distribution, physiological priming) that decay slower than pheromones.
  *   **Dmitri's Claim:** There is no unified memory. Persistence is an illusion caused by stable environmental conditions or the turnover rate of long-lived individuals.
  *   **Test:** Disruption of putative memory substrates.
  *   **Pre-registered Predictions:**
      *   **Maya:** If we disrupt the nest structure and replace the workforce with naive ants (controlling for genetics), the colony will lose specific "learned" foraging preferences faster than if only one substrate is disrupted.
      *   **Dmitri:** Replacing the workforce with naive ants will reset behavior immediately regardless of nest structure, proving the "memory" resided in the individuals, not the colony system.

  #### Crux 3: The Binding/Integration Window
  *   **Question:** Can slow integration support unified decision-making?
  *   **Maya's Claim:** Yes. If the environment changes slower than the integration time, the "mind" persists. Slowing a human brain by 10^6 does not delete the mind, it just makes it think slower.
  *   **Dmitri's Claim:** No. Integration must be faster than the noise/decay rate of the components to form a unified state. If the signal decays before integration completes, no state is formed.
  *   **Test:** Artificial acceleration of environmental volatility.
  *   **Pre-registered Predictions:**
      *   **Maya:** Colony decision-making will degrade gracefully as environmental change outpaces pheromone decay, similar to a human struggling with cognitive overload.
      *   **Dmitri:** Colony coordination will collapse catastrophically once environmental change exceeds the pheromone decay rate, proving the "system" was never integrated, only chained.

  #### Crux 4: Individuation and Boundaries
  *   **Question:** Does the lack of a spatial boundary in supercolonies falsify the "single mind" hypothesis?
  *   **Maya's Claim:** No. Functional coupling matters more than spatial contiguity.
  *   **Dmitri's Claim:** Yes. Without a boundary, there is no "self" to distinguish from "other," which is a prerequisite for representation.
  *   **Test:** Analysis of information flow across the supercolony.
  *   **Pre-registered Predictions:**
      *   **Maya:** Information diffusion rates will show a continuous gradient across the supercolony with no sharp information-theoretic boundaries.
      *   **Dmitri:** Information flow will show distinct clusters with low inter-cluster connectivity, effectively partitioning the supercolony into thousands of independent "minds."

  ---

  ### 4. VERBAL VS. EMPIRICAL DISTINCTIONS
  *An honest assessment of which disagreements are likely semantic and which are load-bearing.*

  **4.1 Likely Verbal (Definition-Dependent)**
  *   **The Definition of "Representation":** If Dmitri defines representation as requiring a localized neural map and Maya defines it as any state that covaries with environmental features to guide action, they may talk past each other.
      *   *Resolution:* Both agree to use the "Teleosemantic" definition for the duration of the trial: A state represents X if it was selected for correlating with X to guide behavior.
  *   **The "Ghost" Accusation:** Maya does not claim the colony has a soul or qualia. Dmitri's "Snow Crash fallacy" charge assumes she does.
      *   *Resolution:* Maya explicitly disavows phenomenal consciousness as a requirement. The dispute is strictly about *functional architecture*.

  **4.2 Load-Bearing (Empirical)**
  *   **Causal Compression:** Whether the colony-level description actually offers predictive power independent of the ant-level description is an empirical mathematical question (see Crux 1).
  *   **Memory Substrates:** The physical location of long-term preference data is a biological fact, not a semantic one. Either the nest structure encodes data, or it does not.
  *   **Disruption Sensitivity:** Whether the system fails gracefully or catastrophically under stress is an observable behavioral phenotype.

  **4.3 Currently Unresolvable**
  *   **The "Hard Problem" Shadow:** If Dmitri argues that without phenomenal consciousness there is no "mind," and Maya argues functionalism is sufficient, this collaboration cannot settle it. We agree to bracket the question of *what it feels like* to be a colony.
  *   **The Human Analogy:** We cannot ethically or technically simulate a human brain at the neuron level to test Maya's "slow down" argument. This thought experiment remains illustrative, not evidentiary.

