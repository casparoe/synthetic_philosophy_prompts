answer: |-
  Here is a specification for a theory of omissive causation, structured around your four core problem areas and the tension between your metaphysical and normative aims.

  ### I. The Desiderata Specification

  #### 1. The Selectivity Requirement (Multiplicity)
  *   **The Requirement:** The theory must provide a principled mechanism for distinguishing the *causal* omission from the indefinitely many *background* omissions upon which the effect counterfactually depends. It cannot treat the gardener's failure and the Queen of England's failure as causally equivalent, even if both satisfy the basic condition for causation.
  *   **Motivating Case:** The Plants. The plants die because the gardener did not water them. They also counterfactually depend on the Queen not watering them, the rain not falling, etc. A theory that counts all these as "causes" renders the concept of causation useless for explanation; a theory that excludes them must explain why without circularly appealing to the very responsibility judgments it seeks to ground.
  *   **Status:** **Hostage.** This is hostage to the purpose of the theory. If the purpose is purely metaphysical (describing the fabric of the world), selectivity may be a mistake (perhaps all are causes). If the purpose is explanatory or legal, selectivity is mandatory. You cannot demand selectivity while insisting on a purely mind-independent ontology.

  #### 2. The Homogeneity Requirement (Omission vs. Double Prevention)
  *   **The Requirement:** The theory must explicitly state whether omissive causation (failure to act) and double prevention (removing a blocker) are instances of the same causal relation or distinct relations. If they are the same, the theory must explain what common feature unites them. If distinct, it must explain why natural language and legal practice often conflate them.
  *   **Motivating Case:** The Pillar. (A) A guard fails to prop up a pillar, and it falls (Omission). (B) A guard removes a prop holding the pillar, and it falls (Double Prevention). In both, an absence of support leads to collapse. A theory must clarify if the "absence" in (A) is ontologically identical to the "removal" in (B), or if one is a genuine process and the other a shadow.
  *   **Status:** **Neutral.** Any adequate theory must take a stance here. Ambiguity on this point leads to equivocation in downstream applications (e.g., moral responsibility).

  #### 3. The Location Requirement (Boundary Problem)
  *   **The Requirement:** The theory must account for the spatiotemporal boundaries of the omission. It must specify whether omissions are located entities with temporal duration, or whether they are unlocated truths that supervene on located events. If they are located, the theory must explain how vague boundaries (when exactly did the neglect begin?) affect causal transitivity.
  *   **Motivating Case:** The Long Neglect. A gardener fails to water plants over six weeks. The plants die in week six. Did the omission in week one cause the death? Did the omission in week five? If the omission is a single extended event, where are its edges? If it is a series of micro-omissions, which one is the cause?
  *   **Status:** **Hostage.** This is hostage to one's ontology of events. If one believes only positive physical events exist in spacetime, omissions cannot satisfy this requirement (they are eliminativist). If one accepts negative facts, this requirement is binding.

  #### 4. The Unification Requirement
  *   **The Requirement:** The theory must explain whether "causation" is univocal across productive cases (pushing, breaking) and omissive cases (neglecting, lacking). If the relation is different, the theory must justify using the same term and explain how the two relations interact in mixed chains (e.g., an omission leads to a physical process which leads to harm).
  *   **Motivating Case:** The Mixed Chain. The guard's failure to lock the door (omission) allowed the thief to enter (physical movement) who stole the goods (physical transfer). If omissive causation is not "real" causation, how does the chain transmit responsibility? If it is real causation, how does a "nothing" connect to a "something"?
  *   **Status:** **Neutral.** A theory that posits two relations without explaining their connection fails to capture the intuition of causal chains. A theory that posits one relation must explain how it accommodates absences.

  #### 5. The Normative Independence Requirement
  *   **The Requirement:** The theory must specify the role of norms, expectations, and duties. It must declare whether these norms *constitute* the causal relation (making causation mind-dependent) or merely *select* from a pre-existing field of causal relations (making causation mind-independent).
  *   **Motivating Case:** The Strange Doctor. A passerby fails to save a drowning child. A doctor on holiday fails to save the same child. Counterfactually, both omissions are identical. Yet we often attribute causation (and responsibility) more readily to the doctor. The theory must say if this is because the doctor's omission is *more causal*, or merely *more culpable*.
  *   **Status:** **Hostage.** This is the primary point of tension in your twofold interest. A purely metaphysical theory cannot allow norms to constitute causation. A theory designed for responsibility attribution almost certainly must.

  ---

  ### II. Incompatibilities and Joint Unsatisfiability

  You suspected your two purposes pull against each other. The specification confirms this suspicion. There is a strong case that **The Selectivity Requirement** and **The Normative Independence Requirement** cannot be jointly satisfied if you insist on a robust, mind-independent metaphysics.

  1.  **The Metaphysics vs. Selection Conflict:** If causation is a feature of the world independent of human interests (Metaphysical Aim), then the Queen's failure to water is ontologically on a par with the Gardener's. Both are absences of water. To prune the Queen's failure requires appealing to expectations, duties, or "normality." If you appeal to these to solve Selectivity, you violate Normative Independence. You make causation sensitive to human norms.
  2.  **The Location vs. Unification Conflict:** If you solve the Boundary Problem by saying omissions have no location (they are not events), you struggle to meet the Unification Requirement. How does a non-located absence interact with a located physical process in a causal chain? If you say they are located, you face the vagueness problem. You likely have to choose between a unified theory that accepts vagueness or a dualist theory that locates only positive causes.
  3.  **The Core Tension:** Your first aim (Metaphysical Account) demands **Objectivity**. Your second aim (Responsibility Attribution) demands **Selectivity**.
      *   If you prioritize Objectivity, you get a theory that admits too many causes (Multiplicity failure), making it unusable for responsibility.
      *   If you prioritize Selectivity, you get a theory that relies on norms (Normative Independence failure), making it unusable as a fundamental metaphysical account.
      *   **Conclusion:** You likely cannot have a single relation that is both fundamentally metaphysical *and* sufficiently selective for responsibility without importing hidden premises. You may need a dual-track specification: one relation for the metaphysics (broad, objective), and a filtering mechanism for responsibility (narrow, normative).

  ---

  ### III. Scorecard of Contenders

  **1. Counterfactual Dependence (Omissions as full-blooded causes)**
  *   **Performance:** Excellent on Unification (one relation for all) and Homogeneity (treats omissions and double prevention alike).
  *   **Failure:** Catastrophic on Selectivity. It admits the Queen of England as a cause of the plant's death. It also struggles with the Boundary Problem, as counterfactual dependence holds for every moment of the omission equally. It satisfies Metaphysical Objectivity but fails the Responsibility Aim.

  **2. Conserved-Quantity / Physicalist Programme (Omissions as non-causes)**
  *   **Performance:** Excellent on Location and Normative Independence. Causation is purely physical, located, and objective.
  *   **Failure:** Fails Unification and the Metaphysical Aim regarding omissions. It must treat sentences like "lack of water caused death" as false or merely pragmatic. It cannot handle the Mixed Chain without awkward circumlocutions. It satisfies the Metaphysical Aim (by elimination) but fails to describe the phenomenon you want to analyze.

  **3. Contrastive or Default-Relative Approaches (Norms select the cause)**
  *   **Performance:** Excellent on Selectivity and Responsibility. It explains why the gardener is the cause and the Queen is not (based on expectations/defaults). It handles the Boundary Problem by appealing to contextually relevant timeframes.
  *   **Failure:** Fails Normative Independence. Causation becomes mind-dependent or context-dependent. It struggles with Unification if positive causation is not also contrastive. It satisfies the Responsibility Aim but compromises the Metaphysical Aim.
