  3.  **Initial Consistency Scan (Mental Sandbox):**
      *   *Pos 1 (EUM) vs. Pos 4 (Pascal's Refusal):* This is the big one. Standard EUM says if $P \times U > Cost$, you pay. If $U$ is unbounded (Pos 5), there's always some $U$ big enough to outweigh tiny $P$. Refusing implies violating EUM.
      *   *Pos 1 (EUM) vs. Pos 2 & 3 (One-box/Pay Mugging):* Standard Causal EUM (CDT) two-boxes and refuses Counterfactual Mugging. To one-box and pay the mugger, you need *Updateless* EUM (UDT) or Functional Decision Theory (FDT). These are still EUM-based but calculate expectations differently (over logical counterfactuals or prior policies). So Pos 1 is compatible with 2 & 3 *if* "EUM" is interpreted broadly (UDT style), but incompatible with 4 & 5.
      *   *Pos 3 (Pay Counterfactual) vs. Pos 4 (Refuse Pascal's):* Both involve low probability/high stakes. Why pay the $1000 in Counterfactual Mugging (CFM) but not the wallet in Pascal's Mugging (PM)?
