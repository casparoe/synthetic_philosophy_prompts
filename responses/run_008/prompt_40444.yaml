  8.  **Structuring the Response:**
      *   **Executive Summary:** Direct verdict.
      *   **Critical Tension (Severity 1):** The Pascal/Unbounded/EUM triangle. Explain the math.
      *   **Significant Tension (Severity 2):** The Mugging Boundary (CFM vs PM).
      *   **Definitional Tension (Severity 3):** What kind of EUM? (CDT vs UDT).
