answer: |-
  Your intuition is serving you well. Your friend got the "elevator pitch" version of Susan Wolf's argument mostly right, but he stumbled on the nuances, misinterpreted the implications, and committed a category error with the "empirical refutation."

  Wolf's *Moral Saints* is one of the most famous papers in modern ethics precisely because it challenges the assumption that "moral goodness" is the only kind of goodness that matters.

  Here is a piece-by-piece breakdown of your friend's summary, evaluated against what Wolf actually argues.

  ### 1. The Core Claim: "Being as morally good as possible is actually a bad thing."
  **Verdict: Accurate.**

  Your friend got the thesis right. Wolf defines a "Moral Saint" as a person whose every action is as morally good as possible, and whose life is dominated by moral commitments. She argues that if you take this ideal seriously, the resulting person would be unattractive.

  Wolf argues that a life spent maximizing moral value crowds out "non-moral virtues." A Moral Saint wouldn't have time for gourmet cooking (money could feed the hungry), sarcastic humor (might hurt feelings), or obsessive dedication to a hobby like collecting stamps (a waste of resources/time). Wolf's point is that a life without these things is **impoverished**, not because it lacks moral worth, but because it lacks *human* richness.

  ### 2. The Distinction: "It only works against the calculating saint, not the loving one."
  **Verdict: Distortion.**

  This is where your friend's understanding gets shaky. Wolf explicitly addresses this distinction. She divides Moral Saints into two types:
  *   **The Rational Saint:** Like Kant or a Utilitarian. They sacrifice their own desires because reason dictates they must help others. (Your friend's "calculating" saint).
  *   **The Loving Saint:** Someone whose desires are perfectly aligned with morality. They *want* to help others more than they want anything else. (Your friend's "warm" saint).

  Your friend thinks the Loving Saint escapes the critique. Wolf says they do not. Her argument is that the Loving Saint is *still* one-dimensional. Why? Because to be a true Loving Saint, your love for morality must be so consuming that you simply *don't care* about non-moral things.

  If you are a Loving Saint, you aren't forcing yourself to skip the opera to volunteer at the shelter; you just genuinely prefer the shelter. But Wolf asks: Is it actually a *good* thing to be the kind of person who has no interest in art, leisure, or frivolity? She argues that a person who lacks these interests is lacking a part of what makes a life well-rounded. So, even the "warm" saint is problematic because their warmth is exclusively moral, leaving no room for other kinds of passion.

  ### 3. The Conclusion: "It's a license for a bit of selfishness."
  **Verdict: Over-simplification / Spin.**

  This is the most dangerous distortion. Wolf is not arguing that we are permitted to be *selfish* (which implies prioritizing our interests *at the expense* of others or moral duty). She is arguing that we are permitted to have **personal interests**.

  There is a difference between "selfishness" and "individuality."
  *   **Selfishness:** "I won't donate to charity because I want a new TV."
  *   **Wolf's View:** "I will donate a reasonable amount to charity, but I will also buy the TV because enjoying television is part of a good human life, even if that money could theoretically do more good elsewhere."

  Wolf isn't giving us a license to ignore morality; she is arguing that morality should not be the *sole* governing authority of our lives. She is pushing back against ethical theories (like strict Utilitarianism) that suggest if you aren't maximizing good, you are doing something wrong. She wants to carve out a space where it is okay to be morally *neutral* in pursuit of personal excellence or joy.

  ### 4. The Rebuttal: "Positive psychology refutes this; moral people are happier."
  **Verdict: Category Error.**

  Your friend's empirical rebuttal misses the philosophical point entirely. Wolf is not making an empirical claim about correlation (i.e., "Do nice people smile more?"). She is making a conceptual claim about the **ideal** of sainthood.

  Positive psychology studies generally show that *prosocial behavior* (kindness, volunteering, community) correlates with happiness. Wolf would agree! She is not saying "being moral makes you miserable."

  She is saying: "If you make moral goodness your **supreme and all-consuming** goal, you lose other values."
  *   **Positive Psychology:** Studies people who are kind and balanced.
  *   **Wolf's Saint:** Studies a hypothetical person who *cannot* be balanced because their moral commitment is absolute.

  Even if moral people are happier on average, that doesn't refute the claim that a life *exhaustively* defined by morality lacks certain non-moral goods (like wit, aesthetic obsession, or relaxation). You cannot refute a philosophical argument about the definition of a "good life" with a statistic about average happiness levels.

  ### 5. Your Memory: "Distinction between what morality demands and what makes a life good for the person."
  **Verdict: Spot On.**

  You remembered the crux of the paper better than your friend did. Wolf's central move is distinguishing between:
  1.  **A Morally Good Life:** A life that contributes the maximum amount of good to the world.
  2.  **A Good Human Life:** A life that is rich, diverse, and fulfilling for the person living it.

  Wolf argues these two things do not perfectly overlap. A life can be morally perfect but personally barren. Ethical theories, she claims, often confuse the two, assuming that because morality is important, it must be the *only* thing that is important.

  ### Summary: Who "Won"?

  *   **Your Friend:** Got the headline right (Wolf critiques moral sainthood) but got the details wrong (the Loving Saint is not exempt) and drew the wrong conclusion (it's about personal interests, not selfishness). His empirical rebuttal was a straw man.
  *   **You:** Were right to feel something was off. Your memory of the distinction between moral demands and personal well-being is the key to understanding the paper.

  **The Takeaway:** Wolf isn't telling us to be less moral; she is telling us to be more human. She argues that a world of Moral Saints would be a world without humor, art, or leisure, and that such a world would be worse, even if it were morally "perfect." Your friend turned this into "it's okay to be selfish," which misses the point that having hobbies and personality isn't selfishness—it's part of what makes life worth living.
