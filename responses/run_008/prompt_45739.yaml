answer: |-
  **Design Doc: Project Serece (Suffering Elimination via Recursive Ecological Correction)**
  **Owner:** Planetary Wellbeing Engineering (PWE)
  **Status:** Draft for Review
  **Reviewers:** Bioethics, Legal, Ecological Stability (Legacy)

  ### TL;DR
  We propose to refactor the global biosphere to minimize negative hedonic states. Current evolutionary architecture prioritizes fitness over wellbeing, resulting in unacceptable juvenile churn rates (r-selection) and high-latency pain events (predation). We will deploy immutable gene drives to enforce K-selection traits and deprecate predation modules. Pilot begins on Island-44. Rollback is not supported.

  ### Background
  Natural selection operates on a legacy codebase (~4.5B years old) optimized solely for replication, not user experience. This creates significant technical debt in the form of wild animal suffering. Current metrics indicate severe inefficiency: r-selected species spawn >1,000 units per cycle with <5% retention past maturity. The remaining 95% churn due to starvation, disease, or predation. From a utilitarian throughput perspective, this is a catastrophic waste of resources and a net-negative experience for the units involved. We treat this churn as a critical bug, not a feature.

  ### Goals and Non-Goals
  **Goals:**
  *   Reduce juvenile mortality in target species from 90% to <5% within 3 years.
  *   Deprecate predation APIs across all vertebrate classes.
  *   Maximize aggregate biomass-weighted wellbeing (WBW).

  **Non-Goals:**
  *   **Preserving legacy trophic structures:** Current food webs are tightly coupled but inefficient. We will not prioritize ecosystem stability over suffering reduction.
  *   **Direct instrumentation of qualia:** Measuring subjective pain in beetles is high-overhead. We will proxy wellbeing using biomass density and behavioral activity levels (Ticket #99, P3).
  *   **Resolving net-negative baseline uncertainty:** Whether wild lives are currently net-negative is a philosophical dependency we will not block on (Ticket #402, P3).

  ### Proposed Solution
  **1. Predation Deprecation**
  We will treat predation as a legacy system scheduled for sunset. Obligate carnivores will be migrated to synthetic nutrient sludge. During the migration window, we will maintain backward compatibility by supplementing natural prey populations to prevent predator starvation. Once migration completes, hunting behaviors will be edited out via CRISPR.

  **2. Reproduction Rate Limiting**
  To address r-selection churn, we will ship a global gene drive suppressing high-volume reproduction. Clutch sizes will be hard-coded to match carrying capacity. This drive is immutable; once released into the wild, rollback is impossible. We accept this technical risk to ensure permanent patching.

  **3. Instrumentation**
  Since we cannot query units for satisfaction, we will assume positive correlation between biomass accumulation and wellbeing. Increased biomass = increased wellbeing.

  ### Milestones
  *   **Q1:** Island-44 baseline mapping (current churn rates, predation latency).
  *   **Q2:** Gene drive synthesis and safety testing (limited to containment).
  *   **Q3:** Predator deprecation patch deployed to Island-44 carnivores.
  *   **Q4:** Full island lockdown and drive release.

  ### Risks and Mitigations
  **Risk: Trophic Cascade / Ecosystem Collapse**
  Removing predation may cause prey population spikes followed by mass starvation.
  *Mitigation:* We will monitor biomass proxies. If collapse occurs, we will implement manual culling (temporary measure) until reproduction limits take effect. We consider this an acceptable transient state.

  **Risk: Unintended Consequences**
  Ecosystems are non-linear; interventions may cascade unpredictably.
  *Mitigation:* We assume our models capture sufficient coupling. If new suffering vectors emerge, we will patch in v2.0.

  **Risk: Public Perception**
  Stakeholders may object to "playing God."
  *Mitigation:* Frame as "Conservation 2.0" and "Ending Pain."

  ### Open Questions
  1.  **Invertebrate Sentience:** Do insects experience suffering comparable to vertebrates? If yes, scope expands by 10^18 units. (Ticket #118, P4).
  2.  **Intervention Ethics:** Is it permissible to intervene if there is a >0% chance of increasing total suffering due to modeling errors? (Ticket #402, P3).
  3.  **Proxy Accuracy:** What is the error margin on biomass-as-happiness? (Unassigned).

  ### Rollout Plan
  **Phase 1: Island-44 Pilot**
  Closed ecosystem. Low risk of cross-contamination. We will measure success via reduced churn and increased average lifespan. Predators will be transitioned to sludge over 6 months.

  **Phase 2: Continental Shards**
  Expand to isolated peninsulas. Begin gene drive propagation.

  **Phase 3: Global Commit**
  Full release. Once committed, the gene drive is self-propagating. We will monitor global WBW metrics. Any regression will be handled via future patches, though biological rollback is unsupported.

  ### Appendix A: Legacy System Compatibility
  During the predation sunset period, natural prey populations must remain stable to prevent carnivore starvation (SLA violation). We will artificially inflate prey numbers using hatcheries. This creates a temporary dependency loop but ensures smooth migration to synthetic food sources.
