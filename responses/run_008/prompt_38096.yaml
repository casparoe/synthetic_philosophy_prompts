      *   Global truth conditions covered? Yes.
      *   Deflationist concessions/replies analyzed? Yes.
      *   Conditions for switching views? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to conflate deflationism with error theory. Deflationists think truth *exists*, it's just not substantive. Also, make sure to highlight Hartry Field's role, as he's the deflationist who takes the explanatory challenge most seriously (by trying to naturalize reference).

      *(Refining the "Fatal" ranking)*: Is anything truly fatal? Philosophical views rarely die by knockout. I should frame "Fatal" as "Requires abandoning the core motivation." The core motivation is simplicity/expressiveness. If complexity returns, the view collapses. So, Paradoxes + Explanation are the strongest threats.

      *(Refining the "Switch" criteria)*: What would make correspondence worth the cost? If we find truth is a natural kind (like water) or indispensable to empirical psychology.

  9.  **Final Polish:** Check for clarity, flow, and philosophical precision. (Ensure the distinction between 'truth' and 'warranted assertibility' is clear in the norm section).

