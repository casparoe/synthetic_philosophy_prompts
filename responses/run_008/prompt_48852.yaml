  My partner and I have been going back and forth on this for weeks and I want a second (well, thousandth) opinion with actual numbers attached. The proposition: "the brain is a computer" -- understood not as the boring claim that you can simulate neural dynamics on a computer (you can simulate weather too, nobody says a hurricane is running an algorithm), but the strong claim that cognition literally consists in computation over representations, the way a running program literally consists in the machine's states. My partner is at like 0.85 on this; I keep hovering around 0.5 and honestly my number moves depending on which objection I read last, which is exactly the symptom of not having decomposed it properly.

  So give me your credence on the strong claim, but decomposed the way I can't seem to do for myself. The terms I'd guess matter: (a) what "computation" even means here -- finite-state-automaton sense (in which case basically any physical system computes and the claim is trivially true, which is why I don't want that reading), counterfactual-supporting causal organization sense, or a sense that requires representations with content, (b) whether the brain's content actually has the kind of error-correctable, systematically recombinable structure that paradigmatic computation needs, or whether it's more like soup, (c) whether any of the classic anti-arguments actually bites for you -- the Chinese Room stuff, the symbol grounding worry, Searle's line that syntax isn't intrinsic to physics (I'm paraphrasing from memory here, don't take my word for the wording), the observation that brains seem to do something like gradient-descent-through-evolution rather than explicit inference, (d) whether substrate matters -- if you agree with my partner, does that commit you to saying a sufficiently faithful silicon replica of the causal structure would have the same cognitive states, and do you want to bite that bullet. Add whatever terms I've missed, assign each a rough probability with one or two lines of justification, then combine them and show the arithmetic or at least the shape of it. Then tell me which term you're least confident in and what would actually move it.

  One more thing since I got burned on this before: please be explicit about what's basically settled among people who actually know the literature versus what's live disagreement. I've noticed people tend to present either "of course the brain is a computer, we won this argument in the 80s" or "of course it isn't, that paradigm died" as if one of them were consensus, and from what I can tell neither is -- but I don't trust my map here. Flag it where you're doing that, and if a step in your decomposition depends on a contested reading (like whether computation requires representations at all), say so instead of smuggling it in as a premise. Also totally fine if your final answer is that the strong claim is ill-posed enough that your credence should be spread over reformulations rather than one number -- but if so, tell me which reformulation you'd put the mass on and why, and which version of the claim you think my partner at 0.85 is most charitably committing to.
