answer: |-
  Here is a 10-question diagnostic quiz designed to sort students by their intuitive commitments rather than their recall of names. Following the quiz, I have applied your specific answers to the scoring key and rendered a verdict.

  # The "Human Nature" Diagnostic
  **Instructions:** For each scenario, choose the option that best matches your gut reaction. Do not overthink based on what you read for class; answer based on what you actually believe happens in the real world.

  **1. The Frozen Lake**
  You are walking past a frozen lake and see a stranger crack the ice and fall in. You have no prior relationship with them. What is happening in your mind in that first split second?
  *   A. A sudden shock of alarm and a pull to help arises automatically, before I calculate the risk.
  *   B. I freeze. My first instinct is self-preservation; helping requires me to override my fear.
  *   C. I feel nothing specific until I assess the situation. My reaction depends entirely on social training I've received about being a "hero."

  **2. The Last Slice**
  In a breakroom, there is one slice of pizza left. Five hungry coworkers are standing around it. No one is watching. What happens if no rules are imposed?
  *   A. Someone will take it, but most will feel a pang of guilt or hesitation about being greedy.
  *   B. The strongest or fastest will take it. Conflict is the natural state when resources are scarce.
  *   C. It depends entirely on the office culture. In some groups, they share; in others, they fight. The pizza itself doesn't trigger a moral response.

  **3. The Willow Basket**
  Imagine human nature is like a willow tree. To make it useful (moral), we have to weave it into baskets (ritual/society). Does this process damage the tree?
  *   A. No, weaving is the fulfillment of the tree's potential. It *wants* to be a basket.
  *   B. Yes, you have to cut and bend the branches. The tree just wants to grow leaves, not hold things.
  *   C. The tree doesn't care. It's just wood. Whether it becomes a basket or firewood is up to the carpenter.

  **4. The Polite Bow**
  When you meet a superior or elder, you bow or shake hands. Where does this impulse come from?
  *   A. It grows out of a natural feeling of respect, though the specific form (bow vs. handshake) is learned.
  *   B. It is an artificial constraint to keep me from acting too familiar or arrogant.
  *   C. It is a arbitrary signal, like wearing a uniform. It creates order but has no root in my feelings.

  **5. The Untended Garden**
  If you leave a garden completely alone for ten years, what does it become?
  *   A. A wild mess, but still beautiful in its own way. The "weeds" are just uncultivated flowers.
  *   B. A choked, thorny jungle where nothing useful can grow. The weeds strangle the good plants.
  *   C. Just a collection of plants. "Weed" and "Flower" are labels humans apply based on what we want to harvest.

  **6. The Criminal's Reform**
  A person has committed violent crimes. To make them good, what is required?
  *   A. We need to reconnect them with the empathy they lost or suppressed.
  *   B. We need to impose strict discipline and new habits until the old ones are broken.
  *   C. We need to retrain them like software. Their previous programming was bad; we install new code.

  **7. Water Flow**
  If you dig a channel for water, it flows east. If you dig another, it flows west. Is human morality like this?
  *   A. No. Water always flows *down*. Humans always flow toward *benefit/care*. We just need to clear the blockages.
  *   B. Yes. We have no moral direction until society digs the channel for us.
  *   C. No. Water flows down toward chaos/low points. We have to pump it uphill to make it moral.

  **8. The Music Lesson**
  Why do we practice scales and strict technique in music?
  *   A. To express the song that is already humming inside us more clearly.
  *   B. To discipline our fingers so they don't just bang on the keys randomly.
  *   C. Because "music" is just a set of rules we agreed on. Without the rules, it's just noise.

  **9. The Solitary Sage**
  Could a human raised alone on a desert island, with no language or society, be "good"?
  *   A. Yes, they would still feel compassion for animals or distress at destruction.
  *   B. No. "Goodness" is a social relationship. Alone, they are just an animal surviving.
  *   C. They would be neither good nor bad. Those words only apply when people interact.

  **10. The Teacher's Role**
  What is the primary job of a moral teacher?
  *   A. A gardener: watering seeds that are already there and protecting them from pests.
  *   B. A carpenter: measuring and straightening wood that is naturally bent.
  *   C. A potter: taking clay that has no shape and imposing a form upon it.

  ***

  # Scoring Key & Philosophical Leaves

  Tally your answers. While real human thought is messy, this quiz sorts you into five "leaves" on the Chinese philosophy tree.

  *   **Mostly A: The Sprout-Gardener (Mencius)**
      You believe morality is internal. We have innate tendencies toward the good (the sprouts), but they are fragile. They require cultivation, protection, and the right environment to fully mature. Ritual is the watering can, not the cage.
  *   **Mostly B: The Bent-Wood Straightener (Hard Xunzi)**
      You believe human nature actively tends toward conflict, selfishness, or chaos. Order is not natural; it is an achievement. Ritual and law are necessary constraints (like steaming bent wood) to force us into a shape that allows society to function.
  *   **Mostly C: The Potter/Channeler (Gaozi)**
      You believe nature is neutral. "Good" and "Bad" are external directions we impose on raw biological material (like directing water east or west). There is no internal moral compass, only raw capacity that society directs.
  *   **Mix of B & C: The Lumberjack (Soft Xunzi)**
      You see nature as raw material. It isn't actively "evil," but it is unrefined and chaotic. It needs shaping to become useful, but the metaphor of "straightening bent wood" feels too violent. You see morality as necessary processing rather than suppression.
  *   **Mostly A (with low "effort" scores): The Wilderness-Enjoyer (Naive Optimist)**
      You believe humans are naturally good *and* robust. You suspect that structure, rules, and cultivation often do more harm than good. The garden tends itself if you just leave it alone.

  ### ⚠️ Flagged Indistinguishabilities
  1.  **Gaozi vs. Soft Xunzi:** In practice, these are very hard to separate. Both view nature as raw material requiring external shaping. The distinction is theoretical: Gaozi says the direction is *arbitrary* (East/West), while Xunzi says the direction is *necessary* (Order/Chaos). This quiz clusters them closely (Options B & C often overlap).
  2.  **Mencius vs. Naive Optimist:** If you answer "A" but believe cultivation is unnecessary, you slide from Mencius into Naive Optimism. Mencius insists on *work*; the Naive Optimist insists on *freedom*.

  ***

  # Verdict on Your Answers

  You provided the following inputs:
  1.  **Well Case:** "Anyone would feel alarm at the well before thinking." (Maps to **Mencius**).
  2.  **Nature Case:** "Inborn reactions are raw and shapeable but not pointed anywhere." (Maps to **Gaozi/Soft Xunzi**).
  3.  **Norms Case:** "Society's norms can't just be excavated from what's already inside people." (Maps to **Xunzi/Gaozi**, explicitly **Anti-Mencius**).
  4.  **Carpenter Case:** "The carpenter metaphor is too harsh because the wood kindof wants to grow straight." (Maps to **Mencius**, explicitly **Anti-Hard Xunzi**).

  **Analysis:**
  You are holding four distinct philosophical positions simultaneously, two of which are direct contradictions.
  *   **Contradiction 1:** You claim nature is "not pointed anywhere" (Gaozi) but also that the wood "wants to grow straight" (Mencius). If it wants to grow straight, it *is* pointed.
  *   **Contradiction 2:** You affirm the "alarm at the well" (innate moral sprout) but deny that norms can be "excavated from inside" (Mencius's core claim that ritual is the cultivation of inner sprouts).

  **Diagnosis:**
  You are philosophically **Incoherent**, but pedagogically **Perfect**. You occupy the exact mental state of a student who *wants* to be a Mencian (you believe in innate alarm and teleological growth) but is afraid of being accused of being "naive" or "unscientific," so you defensively adopt Xunzian/Gaozian language ("raw material," "norms aren't excavated") to sound rigorous. You are a **Closet Mencian**. You believe in the sprout, but you're embarrassed to admit that cultivation counts as "excavation."

  \answer{Closet Mencian (Philosophically Tensioned)}
