answer: |-
  You have put your finger on one of the oldest and most persistent knots in moral philosophy and economics. Your hunch about the Ancient Greeks is correct, but the modern intuition is actually a hybrid creature. It is a palimpsest written over by Aristotle, John Locke, Karl Marx, and Henry George, all filtered through a modern psychological heuristic about "fairness."

  Here is a reconstruction of the implicit theory presupposed by these judgments, the rival theories that could explain them, where the theory breaks down, and how it relates to the tax code.

  ### 1. The Reconstructed Implicit Theory: "The Moral Economy of Contribution"

  The pattern of judgment you describe presupposes a theory of money that is **teleological** (money has a purpose) and **labor-centric** (value is tied to agency). We can call this the *Moral Economy of Contribution*. It rests on three pillars:

  **A. Teleology (The Aristotelian Fragment)**
  As you suspected, this draws heavily on Aristotle's distinction in *Politics* between **Oikonomia** (household management) and **Chrematistics** (wealth acquisition).
  *   **Natural:** Money is a means of exchange to acquire goods needed for a good life (the plumber fixes the pipe so you can have water; the baker makes bread so you can eat).
  *   **Unnatural:** Money becomes the end goal itself, specifically when it "breeds" money without interacting with the material world (usury, speculation).
  *   **The Judgment:** Activities that serve a material need are "honest." Activities where the goal is merely the accumulation of the token itself are "parasitic."

  **B. The Labor/Agency Condition (The Lockean Fragment)**
  Modern intuition adds a layer Aristotle didn't have: the Protestant/Lockean idea that property and reward are justified by the mixture of one's labor with the world.
  *   **Active vs. Passive:** The plumber, nurse, and even the shopkeeper are seen as *doing* something. They expend energy, risk, and time in the present tense.
  *   **Decoupling:** The landlord (in the negative stereotype) and the speculator are seen as having decoupled reward from ongoing effort. They are being paid for *ownership*, not *action*.
  *   **The Judgment:** Income is "earned" if it is a wage for effort/skill. Income is "unearned" if it is a tribute paid to ownership.

  **C. The Zero-Sum Heuristic (The Game Theory Fragment)**
  Ordinary intuition often views finance as zero-sum and trade as positive-sum.
  *   **Positive-Sum:** The plumber and the customer both walk away better off (fixed pipe, cash). The shopkeeper provides availability/convenience.
  *   **Zero-Sum:** The currency speculator or arbitrageur is often viewed as betting against someone else. For them to win, someone else must lose (or the system becomes unstable).
  *   **The Judgment:** Making money *with* people is virtuous; making money *off* people (or the market mechanics) is suspect.

  ### 2. Rival Theories That License the Same Judgments

  You asked if this pattern pins down just one theory. It does not. Three distinct theoretical frameworks yield the exact same moral verdicts on plumbers vs. speculators, despite disagreeing on *why*.

  **A. The Marxist Theory (Surplus Value)**
  *   **Logic:** Value is created only by labor. Profit, interest, and rent are merely "surplus value" extracted from the workers.
  *   **Verdict:** The plumber creates value. The landlord and speculator extract value created by others.
  *   **Difference:** A Marxist would actually be suspicious of the *shopkeeper* too (as a merchant capitalist), whereas the folk intuition gives the shopkeeper a pass.

  **B. The Georgist Theory (Economic Rent)**
  *   **Logic:** Henry George argued that there is a distinction between wealth created by production (wages/interest on capital) and wealth captured from scarcity (Rent). Land is fixed in supply; therefore, profit from land appreciation or rent is "unearned increment."
  *   **Verdict:** This perfectly explains the **Shopkeeper vs. Landlord** edge case. The shopkeeper turns over inventory (capital); the landlord holds a fixed asset (land) and charges for access.
  *   **Difference:** Georgists are fine with interest on capital (investing in a factory), whereas the folk intuition often lumps "investors" in with speculators.

  **C. Evolutionary Psychology (Cheater Detection)**
  *   **Logic:** Humans evolved in small groups to detect "free riders." We have a hyper-active agency detection device.
  *   **Verdict:** If I see you sweating and carrying a load, my brain registers "cost paid, reward justified." If I see you sitting on a porch collecting checks, my brain registers "free rider."
  *   **Difference:** This theory suggests the judgment isn't about *economics* at all, but about visceral disgust triggered by low-effort/high-reward scenarios. It explains why the "modest day trader" gets side-eye: he looks like he's gaming the system without "suffering."

  ### 3. The Edges and Inconsistencies

  The "Moral Economy of Contribution" is not a coherent philosophical system; it is a bundle of heuristics. Consequently, it fractures at specific edges.

  **The Shopkeeper vs. Landlord Edge**
  *   **The Puzzle:** Both own assets. Both charge for access. Both are "middlemen" between a resource and a user.
  *   **What's doing the work:** It is the **perception of logistical labor**.
      *   The shopkeeper is imagined to be stocking shelves, managing spoilage, and smiling at customers. They are "handling" the goods.
      *   The landlord (in the negative archetype) is imagined to simply hold the title and send a bill.
  *   **The Inconsistency:** If the shopkeeper hires a manager and never steps foot in the store, they become functionally identical to the passive landlord. Yet, the folk intuition often still respects the "small business owner" while despising the "absentee landlord." This suggests the judgment is partly about **social identity** (business owner = community pillar) vs. **asset class** (landlord = extractive).

  **The House Flipper Edge**
  *   **The Puzzle:** A flipper buys low, renovates (labor!), and sells high. By the Labor Theory, they should be respected. By the Teleological Theory, they are providing better housing.
  *   **The Inconsistency:** Flippers are often hated. Why? Because the labor is seen as **cosmetic** rather than **productive**, and the profit is seen as coming from **market timing** (buying in a dip) rather than the renovation itself. The intuition suspects the value was already there, and the flipper just captured it. This reveals that the folk theory is skeptical of *profit magnitude* relative to *visible effort*.

  **The "Passive Income" Paradox**
  *   **The Inconsistency:** We tell young people to "make money while you sleep." We celebrate the person who achieves financial independence through index funds. But we sneer at the person living off rental income.
  *   **The Break:** The theory cannot distinguish between "virtuous passive income" (savings/retirement) and "vicious passive income" (rentier capitalism). It relies on a vague threshold of "enough." Below the threshold, you are secure; above it, you are a rentier.

  ### 4. Bonus: Does the Tax Code Track This Theory?

  **Short Answer:** Historically, yes. Currently, no.

  **The Divergence:**
  The modern U.S. tax code (and many others) actually *inverts* the folk moral theory.
  *   **Folk Theory:** Labor income (wages) is "earned" and virtuous; Capital income (gains/rent) is "unearned" and extractive.
  *   **Tax Code:** Labor income is taxed at higher marginal rates (up to 37% + payroll taxes). Long-term Capital Gains are taxed at lower rates (max 20%).

  **Why the Disconnect?**
  1.  **Political Economy:** The people who write the tax code (legislators) and influence it (lobbyists) are disproportionately owners of capital, not sellers of labor. They have successfully framed capital gains taxation as "double taxation" or a deterrent to "investment" (which is framed as job creation).
  2.  **Administrative Convenience:** It is easier to withhold tax from a paycheck than to value a real estate portfolio annually.
  3.  **The "Risk" Argument:** The counter-theory used to justify lower capital gains taxes is that investors take *risk* (they could lose the principal), whereas workers are guaranteed a wage. Therefore, the lower tax is a "risk premium." The folk intuition rejects this, viewing the worker's risk (injury, firing, exhaustion) as more visceral than the investor's risk.

  **Historical Note:**
  There was a time when the tax code aligned closer to your implicit theory. In the mid-20th century U.S., "unearned income" (dividends/interest) was often taxed higher than earned income, and there were specific surtaxes on investment income. The shift away from this tracks with the rise of the "shareholder value" ideology in the 1980s, which explicitly rejected the Aristotelian/Moral view in favor of a Neoclassical view where all income is functionally equivalent compensation for a factor of production (Labor vs. Capital).

  ### Summary

  The pattern you see presupposes a **hybrid moral theory**:
  1.  **Aristotelian** in its suspicion of money breeding money.
  2.  **Lockean** in its demand for labor/agency to justify reward.
  3.  **Georgist** in its specific distaste for rent extracted from fixed assets (land) vs. turnover of goods.

  It is inconsistent because it relies on **visibility of effort** rather than economic function. It breaks down when a landlord works hard (maintenance) or a trader works hard (analysis), because the intuition cares more about the *source* of the money (asset vs. labor) than the *activity* of the earner. The tax code used to reflect this but now largely contradicts it, privileging the "unnatural" chrematistics over the "natural" oikonomia.
