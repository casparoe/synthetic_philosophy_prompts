      *   *Rentier Capitalism (Veblen/Henry George):* Distinction between *earned* income (wages/profit from enterprise) and *unearned* income (rent/interest). This fits the landlord vs. shopkeeper distinction well.
      *   *Moral Intuition (Desert Theory):* Money should track contribution/effort/sacrifice. Passive income feels "undeserved" because it lacks ongoing effort.
      *   *Zero-Sum Intuition:* Finance feels like betting against someone else. Retail feels like mutual benefit.

  3.  **Drafting the Response - Section by Section:**

