  *   **Security-First Predicts:** **Option X.** The minimum outcome of X is $100. The minimum outcome of Y is $0. A strict security rule cannot tolerate *any* risk of $0 when $100 is available.
  *   **REU Predicts:** **Option Y.** The probability of ruin (0.1%) is so small that the decision weight assigned to it is negligible. The 5% gain on the 99.9% outcome will outweigh the tiny weighted risk of zero.

  If she takes Option Y, Security-First is falsified (or requires so many caveats it loses utility). If she takes Option X, she is a stricter maximin player than typical Prospect Theory suggests, and you should model her as having a hard "ruin constraint." Given her choice in #4 to chase upside, my money is on her taking Option Y.
