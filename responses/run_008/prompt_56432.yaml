  ### 2. Evaluation of Decision Rules

  You suspected more than one rule fits the track record. You are correct. Here is how the three main candidates stack up against her five observed choices.

  **Rule 1: Expected Utility Theory (Diminishing Marginal Utility)**
  *   **The Rule:** Maximize the sum of probability $\times$ utility(money), where utility is concave.
  *   **Fit:** **Fails.**
  *   **Check:** This cannot explain the combination of #3 and #4. This is the classic Allais Paradox. If $u(\$100)$ is high enough to reject the gamble in #3, the math dictates she must also reject the gamble in #4. She does the opposite. No single utility curve over money fits both.

  **Rule 2: Security-First (Lexicographic with EV Tie-Breaker)**
  *   **The Rule:** 1. Maximize the minimum possible outcome (the "floor"). 2. If floors are equal, maximize Expected Value.
  *   **Fit:** **Perfect on the original five.**
  *   **Check:**
      *   #1: Floor $100 > Floor $0. (Pick $100).
      *   #2: Floor $100 > Floor $95. (Pick $100).
      *   #3: Floor $100 > Floor $0. (Pick $100).
