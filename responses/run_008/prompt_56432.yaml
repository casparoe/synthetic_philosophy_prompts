      *   #5: Floor $100 = Floor $100. Tie. EV $160 > EV $150. (Pick 60/40).
  *   **Weakness:** It treats a 1% risk of ruin the same as a 49% risk of ruin. It struggles to explain why she might accept the gamble in my prediction for (a) unless we add a "tolerable risk" clause, which makes the rule ad hoc.

  **Rule 3: Risk-Weighted Expected Utility (REU) / Cumulative Prospect Theory**
  *   **The Rule:** Transform probabilities rather than payoffs. Decision weights are non-linear: we overweight small probabilities and underweight moderate/high ones. Certainty (100%) is weighted disproportionately high.
  *   **Fit:** **Perfect on the original five.**
  *   **Check:**
      *   #1: 50% is underweighted relative to 100%. (Pick $100).
      *   #2: Variance is small; utility is locally linear. (Indifferent/$100).
      *   #3 & #4: The "Certainty Effect." The drop from 100% to 89% probability hurts more than the drop from 11% to 10%. This explains the reversal.
      *   #5: Respects First-Order Stochastic Dominance (higher probability of better outcomes).
  *   **Strength:** It naturally handles the *degree* of risk. A 0.1% risk is weighted less than a 1% risk, unlike Security-First.

  ### 3. Best Guess: What Rule Is She Running?

  Dana is running **Risk-Weighted Expected Utility (specifically Rank-Dependent Utility)**.

  While Security-First fits the original data, it is too brittle for a human operator. It implies she would reject a 99.99% chance of $1,000,000 in favor of $10 sure, simply because the floor is $0. Dana's behavior in #4 (chasing the $500) shows she is sensitive to the *magnitude* of the upside, not just the floor. REU captures the Allais violation (#3 vs #4) which is the strongest signal in your data, and it allows for the nuance required in predictions (a) and (b) where EV and probability weighting trade off.

  The "noise" you are used to in geochemistry is present here, but it is systematic noise (bias), not random error. She isn't measuring wrong; she is weighing the probabilities non-linearly.

  ### 4. The Critical Test Case

  To cleanly split the top two candidates (**Security-First** vs. **REU**), you need a scenario where the "floor" is technically violated, but the probability is negligible. Security-First should reject the gamble; REU should accept it.

