      *   **Section 2: The Bug**
          *   *Goal:* Explain self-undermining chances. Why PP leads to contradiction under Humeanism.
          *   *Key concepts:* Humean Supervenience (chances supervene on patterns of events), Future events affecting present chances, Undermining futures.
          *   *Logic:* If chances depend on the whole history (including future), a specific future pattern might imply a different chance function than the current one. PP says believe the current chance. But the current chance says that future is unlikely. Contradiction.
          *   *Drafting thought:* Need to be precise about the contradiction. 300 words.
          *   *Draft:* The "Big Bad Bug" arises when chances supervene on the total pattern of events (Humeanism). Suppose the true chance function $T$ is determined by the entire history of the world, past and future. Consider a possible future $F$ that, if it occurs, would make a *different* chance function $T^*$ the true one. $F$ is an "undermining future" relative to $T$.
          According to PP, your credence in $F$ given $T$ is the chance $T$ assigns to $F$. Since $T$ is the actual chance now, and $F$ would make $T^*$ true instead, $T$ must assign $F$ a low probability (otherwise $T$ wouldn't be stable). So, $C(F | T) = T(F) > 0$ (since $F$ is possible).
