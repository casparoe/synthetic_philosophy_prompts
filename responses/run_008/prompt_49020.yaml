  ### The Principle Stated Plainly

  Lewis's Principal Principle (PP) connects objective chance to rational belief (credence). It states: if you know the objective chance of event $A$ is $x$, and your other evidence $E$ is "admissible," your credence in $A$ should be $x$. Formally: $C(A | Ch(A)=x \& E) = x$. Admissibility filters out information that bypasses chance, like knowing the future outcome directly. For a scientist, this looks like standard procedure. If quantum mechanics assigns a decay probability of 0.5, and you have no forbidden knowledge (like seeing the decay happen early), your degree of belief should match the model. It codifies the intuition that objective probabilities are guides for expectation. The principle seems analytic, almost a definition of what "chance" means for an agent. It bridges the gap between the world's stochasticity and the mind's uncertainty, demanding alignment unless you possess "inadmissible" oracle-like data.

  ### The Bug

  The "Big Bad Bug" arises when chances supervene on the total pattern of events (Humeanism). Suppose the true chance function $T$ is determined by the entire history of the world, past and future. Consider a possible future $F$ that, if it occurs, would make a *different* chance function $T^*$ the true one. $F$ is an "undermining future" relative to $T$. Imagine a coin that is fair (50/50) only if the long-run frequency is 50/50. A future of all-heads undermines the fairness.

  According to PP, your credence in $F$ given $T$ is the chance $T$ assigns to $F$. Since $T$ is the actual chance now, and $F$ would make $T^*$ true instead, $T$ must assign $F$ a low probability. So, $C(F | T) = T(F) > 0$ (since $F$ is possible). However, on a Humean view, the chance function is the best summary of the *actual* history. If $F$ happens, the history changes, so the best summary might change to $T^*$. Therefore, the proposition "$T$ is the true chance" is logically incompatible with "$F$ occurs". Rational credence in a logical impossibility should be 0. So, $C(F | T) = 0$.

  We have a contradiction: PP demands $C(F | T) = T(F) > 0$, but logic demands $C(F | T) = 0$. The chance function $T$ assigns positive probability to a future that would prove $T$ false. PP forces you to believe in the possibility of your own chance theory being wrong, while the definition of that theory says that possibility is impossible. The principle collapses because $T$ is not admissible; it contains hidden information about the future pattern that constitutes it. Lewis realized that treating $T$ as simple evidence was the error. The contradiction reveals that you cannot treat a Humean chance hypothesis as a standard piece of evidence without triggering a logical clash between the probability assignment and the truth conditions of the assignment itself.

  ### The Repairs

  Lewis's solution was the "New Principle" (NP). He realized we cannot condition on the chance hypothesis $T$ alone because $T$ doesn't screen off the future. Instead, we must condition on the conjunction of the chance theory and the history to date ($T \& H_t$). The NP states: $C(A | T \& H_t) = Ch_T(A | H_t)$. This avoids the bug because we no longer treat $T$ as a simple proposition about the present; we acknowledge that $T$ is fragile. However, this gives up the elegance of the original PP. It makes chance less of a direct guide and more of a conditional parameter dependent on the assumption that the future won't undermine the laws.

  Another repair, suggested by Ned Hall, distinguishes between "guiding" and "structuring" roles of chance. Hall argues that in undermining cases, the information about the chance function itself becomes inadmissible. If knowing $T$ tells you something about the future pattern that constitutes $T$, that knowledge isn't purely about chance; it's cryptic information about the future. This saves PP by restricting admissibility, but it renders the admissibility criterion obscure and circular.

  A third view abandons Humeanism. If chances are primitive propensities not fixed by future events, undermining futures are impossible. $T$ stays $T$ regardless of what happens next. This saves the original PP but requires a metaphysics many scientists find objectionable (non-Humean causation).

  Lewis's NP effectively redefines chance. It is no longer a standalone magnitude but a relation between theory and history. This complicates the scientific image where parameters stand alone. Hall's approach preserves the PP form but empties 'admissibility' of clear content; we only know something is inadmissible if it causes a bug. The Non-Humean repair is ontologically expensive; it posits causal powers that exist over and above the events they govern, which conflicts with a parsimonious physicalism.

  Ultimately, the repairs show that the triad of (1) Humeanism, (2) Original PP, and (3) Logical Consistency is inconsistent. You must drop one. Lewis dropped (2). Non-Humeans drop (1). For the philosopher, this is a crisis of definition. For the scientist, it is a choice of metaphysical commitment. The most popular contemporary view accepts Lewis's NP, accepting that our access to chance is always mediated by our knowledge of history, not just the chance value itself.

  ### What This Means for the Working Scientist

  For your daily work, nothing changes. The Bug is a metaphysical inconsistency, not a computational error. However, your habit of sliding from model probabilities to belief does hide a philosophical assumption: that the measure (e.g., Liouville) is admissible evidence. In statistical mechanics, typicality arguments assume the measure defines what is "normal." If the universe's actual trajectory were to turn out "atypical" according to the measure that supposedly governs it, you would face a mini-Bug.

  Does the microcanonical measure assign low probability to its own failure? If the measure is defined by the actual long-run frequencies (a Humean view), then a long run of low-entropy states would undermine the measure. You implicitly assume the measure is robust (non-Humean) or that such undermining histories are negligible. The Bug highlights that "typicality" is not just mathematical; it carries a normative claim about expectation. You weren't wrong to use the probabilities, but you were implicitly assuming the measure wouldn't undermine itself—a safe bet pragmatically, but one the Bug shows is not logically guaranteed. In practice, the 'undermining' trajectories are measure-zero or exponentially suppressed, so the Bug remains a philosophical ghost rather than a laboratory hazard.

  ### Confidence and Doubts

  I am highly confident in the logical structure of the Bug and Lewis's New Principle, as these are well-documented in the literature (e.g., *Philosophical Papers Vol. II*). The connection to statistical mechanics is more interpretive. My least certain point is the characterization of Hall's "admissibility" repair. While it captures the spirit of distinguishing informative vs. uninformative chance, experts debate whether this truly resolves the tension or merely relabels it. The boundary between "chance" and "inadmissible future information" remains the softest ground in this debate.
