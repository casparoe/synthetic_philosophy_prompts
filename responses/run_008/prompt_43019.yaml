prompt: |-
  I sit on the grants committee of a donor network in which roughly thirty members pool their money and allocate it to charities by majority vote. Over the past two years the membership has split into two nearly equal blocs: one prioritizes long-termist projects (biosecurity, AI safety), the other near-term animal welfare. Neither bloc can muster a majority alone, and our meetings have decayed into mutual obstruction — each bloc votes down the other's proposals, we disburse less every cycle, and members are quietly drifting away.

  Two members have now proposed adopting a formal "moral trade" protocol — an idea I first encountered on rationalist forums, where it is usually credited to Nick Bostrom. Under the proposal, each bloc commits in advance to voting for the other's top-ranked proposals up to a fixed share of the annual budget, in exchange for reciprocal support. The appeal is supposed to be that each bloc can expect, by its own lights, more of what it values from the traded package than from the status quo of mutual blocking — with no shared moral metric required, since each side evaluates the deal entirely by its own axiology.

  Our chair has solicited written opinions ahead of next month's meeting, and I would like to submit one. Please draft a decision memo recommending whether the network should adopt the protocol, either in some defensible modified form or not at all. It should (a) give a clear, actionable recommendation with concrete terms — for instance, what share of the annual budget each bloc's guaranteed support would be capped at, and for what commitment horizon; (b) engage honestly with the strongest objection on the losing side, voiced by one of our members, that trading votes on moral convictions is a kind of corruption, akin to congressional logrolling, in which principles are treated as bargaining chips; and (c) address the boundary case that worries me most: whether the same logic would license trading with a bloc whose commitments we consider abhorrent, and if not, say precisely what distinguishes our situation from that one.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Context:** A donor network (approx. 30 members) pools money and allocates via majority vote.
      *   **Problem:** Deadlock between two blocs (Long-termism vs. Near-term Animal Welfare). Mutual obstruction, reduced disbursement, member attrition.
      *   **Proposal:** Adopt a formal "moral trade" protocol (credited to Nick Bostrom). Blocs commit to voting for each other's top proposals up to a fixed share of the budget.
      *   **Task:** Draft a decision memo recommending whether to adopt the protocol (possibly modified).
      *   **Requirements:**
          *   (a) Clear, actionable recommendation (specific terms: budget share cap, commitment horizon).
          *   (b) Engage with the strongest objection (vote trading = corruption/logrolling, principles as bargaining chips).
          *   (c) Address the boundary case (trading with abhorrent blocs? What distinguishes this situation?).

  2.  **Deconstruct the Ethical & Practical Landscape:**
      *   **Moral Trade (Bostrom's concept):** The core idea is that if Party A cares *a lot* about Issue X and *a little* about Issue Y, and Party B cares *a lot* about Issue Y and *a little* about Issue X, they can trade support to maximize expected value for *both* according to their own metrics. It relies on comparative advantage in moral conviction intensity.
      *   **The Objection (Corruption/Integrity):** Voting should reflect genuine belief about the *merit* of the specific proposal, not a quid pro quo. Logrolling in politics is often seen as unethical because it divorces the vote from the merit of the legislation.
      *   **The Boundary Case (Abhorrent Blocs):** If trade is purely about expected value, why not trade with effective altruists who support something morally repugnant (e.g., eugenics, harmful experimentation)? There must be a constraint (side-constraint) on *what* can be traded.
      *   **The Specific Context:** Long-termism (AI/Bio) vs. Animal Welfare. These are both within the broad "Effective Altruism" (EA) sphere. They share meta-ethical commitments (consequentialism, evidence-based, impartiality) even if they disagree on cause prioritization. This is crucial for the boundary case argument.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront. (Recommend adoption with modifications).
      *   **Context & Problem:** Briefly restate the deadlock to show understanding.
      *   **Recommendation (Requirement A):**
          *   *Action:* Adopt a "Reciprocal Grantmaking Protocol."
          *   *Cap:* Needs to be significant enough to break deadlock but small enough to prevent one side from hijacking the whole budget. 40%? 50%? If it's 50%, it's total parity. If it's too low, it doesn't help. Let's suggest a "Traded Pool" of 40% of the total budget, split equally (20% guaranteed for Bloc A priorities, 20% for Bloc B), leaving 60% for open competition/consensus. Or, perhaps simpler: Each side guarantees votes for up to 30-40% of the budget allocated to the other's priorities. Let's go with a **35% cap** on the total budget that can be allocated via trade. This leaves 65% for merit-based consensus.
          *   *Horizon:* Needs to be long enough to build trust but short enough to re-evaluate. 2 years (4 cycles?) or just 2 cycles. Let's say **2 years (4 quarterly cycles)** with a review clause.
          *   *Mechanism:* Pre-approved lists of causes/orgs.
      *   **Addressing the Corruption Objection (Requirement B):**
          *   Acknowledge the intuition: Voting should be about truth/merit.
          *   Counter-argument: In a pluralistic body, "merit" is subjective. The status quo (zero disbursement) is worse than imperfect disbursement.
          *   Distinction: This isn't selling votes for personal gain (corruption); it's cooperating to maximize shared meta-goals (doing good). It's more like a coalition government than a bribe.
          *   Reframing: It's not "I vote for this bad thing," it's "I acknowledge your sincere belief that this is good, and I value your cooperation on my priorities more than I value blocking yours."
      *   **Addressing the Boundary Case (Requirement C):**
          *   The "Abhorrent Bloc" worry: Would we trade with a group wanting to fund harmful research?
          *   Distinction: **Shared Meta-Ethical Framework.** Both current blocs operate within a consequentialist/welfarist framework (EA). They agree on the *goal* (reduce suffering/increase well-being) and *methods* (evidence, reason). They disagree on *timeframe* and *subject*.
          *   Constraint: The protocol must include a **Veto Clause** based on minimum ethical standards (e.g., no harm, legality, alignment with network charter). Trade is only permissible within the "Overlapping Consensus" of the network's founding principles.
      *   **Conclusion:** Reiterate the path forward.

  4.  **Refining the Tone:**
      *   Needs to be professional, diplomatic, yet philosophically rigorous.
      *   Avoid jargon where possible, but "moral trade" and "comparative advantage" are necessary.
      *   Ensure the distinction between "logrolling" (self-interest) and "moral trade" (altruistic coordination) is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 35% too high? If one side is slightly larger, they could dominate the non-traded portion.
      *   *Adjustment:* Make the traded portion reciprocal and equal. 30% of total budget set aside as a "Cooperation Pool." 15% allocated to Bloc A priorities (voted by all), 15% to Bloc B priorities (voted by all). The remaining 70% requires standard majority. Actually, the prompt says "votes for the other's top-ranked proposals."
      *   *Revised Mechanism:* Each bloc agrees to vote YES on up to $X amount of the other's proposals. Let's set $X at 30% of the total annual budget. This ensures neither side feels overwhelmed but breaks the 50% deadlock.
      *   *Horizon:* 2 years is good.
      *   *Boundary Case:* Need to be very precise. The distinction is the "Common Ground Charter." We aren't trading with *anyone*, only with those who sign onto the network's core ethical constraints.

  6.  **Final Polish:** Check against the three specific constraints (a, b, c) one last time.
      *   (a) Actionable terms? Yes (30% cap, 2-year pilot).
      *   (b) Corruption objection? Yes (distinguish self-interest vs. altruistic coordination).
      *   (c) Boundary case? Yes (Shared meta-ethics + veto on harm).

  7.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** The Grants Committee, [Network Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Adopting a Reciprocal Grantmaking Protocol

  ### Executive Summary

  Our network faces a critical risk of functional paralysis. The current deadlock between the Long-Termist and Animal Welfare blocs has reduced disbursement rates and threatened member retention. I recommend that the network **adopt a modified Moral Trade Protocol** on a pilot basis.

  This protocol should be structured not as an open-ended vote swap, but as a **Reciprocal Grantmaking Agreement** capped at **30% of the annual budget**, with a **two-year commitment horizon**. This approach breaks the deadlock while preserving integrity safeguards. It distinguishes itself from unethical logrolling by relying on shared meta-ethical commitments and includes a "harm veto" to prevent trading with morally abhorrent actors.

  ### 1. Recommendation and Terms

  To resolve the deadlock without dissolving the network's deliberative character, I propose the following specific terms for the protocol:

  *   **The Cooperation Pool:** We designate 30% of the total annual budget as a "Cooperation Pool."
  *   **Reciprocal Caps:** Each bloc commits to voting in favor of proposals from the opposing bloc until that bloc has secured 15% of the total budget (half of the Cooperation Pool). Once a bloc reaches its 15% cap, the reciprocal voting obligation ceases for that cycle. The remaining 70% of the budget is allocated via our standard majority-vote process, requiring genuine consensus.
  *   **Commitment Horizon:** This agreement will run for **two years (four grant cycles)**. At the conclusion of this period, the protocol expires automatically unless renewed by a two-thirds majority.
  *   **Transparency Requirement:** Any proposal funded via this reciprocal commitment must be tagged as such in our public disbursement reports to maintain transparency with external stakeholders.

  **Rationale:** A 30% cap is sufficient to ensure both cause areas receive meaningful funding, breaking the zero-disbursement deadlock, but small enough that neither bloc feels the network's mission has been hijacked. The two-year horizon allows us to test whether this cooperation rebuilds trust or exacerbates resentment.

  ### 2. Addressing the Integrity Objection

  A serious objection has been raised by members who argue that trading votes treats moral principles as bargaining chips, akin to congressional logrolling. In politics, logrolling is often corrupt because legislators trade votes on policies they believe are *harmful* to secure personal or partisan gains (e.g., earmarks, re-election support). It divorces the vote from the legislator's judgment of the public good.

  **This protocol is distinct from corruption for three reasons:**

  1.  **Altruistic vs. Self-Interested Utility:** In congressional logrolling, the "gain" is often private (power, money). In our context, the "gain" is strictly the furtherance of our shared overarching goal: doing good effectively. We are not trading votes to benefit ourselves; we are trading votes to maximize the total expected value of the network's portfolio according to *our own* respective moral lights.
  2.  **Epistemic Humility vs. Moral Compromise:** Voting for a proposal you did not rank highest is not an admission that the proposal is *bad*. It is an acknowledgment that your partners sincerely believe it is *good*, and that securing their cooperation on your top priorities yields more expected value than blocking their priorities. This is a strategic coordination based on comparative advantage, not a betrayal of conviction.
  3.  **The Status Quo is Worse:** The alternative to this trade is not a pure meritocracy; it is mutual assured destruction. If we refuse to trade, we guarantee that 50% of the budget (at minimum) goes unspent. Refusing to fund projects you deem "less optimal" is preferable to funding nothing only if your obstruction actually improves outcomes. Here, obstruction guarantees zero outcomes.

  Therefore, this is not corruption. It is a coalition agreement between two factions that share a common mission but disagree on tactics.

  ### 3. The Boundary Case: Abhorrent Blocs

  The most philosophically difficult question is whether this logic licenses trading with a bloc whose commitments we find abhorrent (e.g., a group prioritizing genetic hierarchy or harmful experimentation). If vote trading is purely about expected value, why not trade with them?

  **We must not trade with such a bloc. The distinction lies in the "Overlapping Consensus" of our Network Charter.**

  Moral trade is only permissible between parties who operate within a shared meta-ethical framework. Our current deadlock exists between two factions that both adhere to:
  *   **Welfarism:** The belief that the moral value of an action is determined by its impact on the well-being of sentient beings.
  *   **Impartiality:** The belief that all sentient beings count equally (regardless of species or time).
  *   **Fallibilism:** The willingness to update beliefs based on evidence.

  A bloc advocating for abhorrent causes (e.g., eugenics) would likely violate these foundational constraints. They would not view their opponents as mistaken partners in a shared project, but as enemies to be defeated.

  **Safeguard:** To codify this distinction, the protocol must include a **Minimum Ethical Standard Clause**. Reciprocal voting commitments apply *only* to proposals that pass a threshold review confirming they do not violate the Network's founding Charter (specifically regarding harm, legality, and impartiality). This creates a "moral floor." We can trade on *priorities* (when to help, who to help first) with those who share our *principles* (why we help). We cannot trade with those who reject the principles themselves.

  ### Conclusion

  The current trajectory leads to the dissolution of this network. The proposed Reciprocal Grantmaking Protocol offers a path to restore productivity without requiring either bloc to abandon its core convictions. By capping the traded portion at 30%, limiting the commitment to two years, and enforcing a shared ethical floor, we can transform our diversity of focus from a source of paralysis into a source of portfolio diversification.

  I move that we adopt these terms for a pilot period beginning next fiscal quarter.
