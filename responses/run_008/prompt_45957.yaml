prompt: |-
  I've been reading about deflationism after my roommate wouldn't shut up about it, and I found a philosophy podcast that explained it like this: deflationism is the view that truth has no nature at all -- "is true" doesn't pick out any real property, it's just a grammatical device for repeating yourself. So "'snow is white' is true" says exactly the same thing as "snow is white," which means "true" can always just be deleted from any sentence without losing anything. The host said this goes back to Ramsey's redundancy idea and got fully worked out by Horwich's minimalism, which says every fact about truth is captured by instances of the T-schema. But then he said the theory basically dies there: if truth is empty, then all true sentences are in effect the same thing, and deflationists can't explain why we treat truth as the goal of inquiry, so the whole thing is refuted by the fact that we care about believing truly. Is this a fair runthrough? I'm inclined to like deflationism but honestly couldn't tell you where the podcast is being sloppy. Please organize your answer like this, roughly:

  **The verdict** -- 2 or 3 sentences up top on whether this is fair overall.

  **What they'd accept** -- maybe 150 words on which parts a careful deflationist would sign off on.

  **Where it goes wrong** -- around 200 words sorting out the subtle conflations and overstatements (there seem to be a few lumped together here, but I can't pin them down).

  **Does the refutation land** -- roughly 150 words on whether the "truth as the goal of inquiry" objection is fatal, or whether it's a standard objection deflationists have answers to.

  **Bottom line** -- a short paragraph on what I should actually take away, and one question you'd want to ask the podcast host to see if he knows the difference between deflationism proper and the strawman version.
