answer: |-
  **The verdict** -- The podcast accurately captures the historical roots and core equivalence claim of deflationism but stumbles significantly on its logical implications and current status. It presents a standard objection as a decisive refutation, ignoring sophisticated deflationist responses.

  **What they'd accept** -- A careful deflationist would happily endorse the historical lineage connecting Ramsey's redundancy theory to Horwich's minimalism. They agree that the concept of truth is exhausted by the equivalence schema (the T-schema): to assert that "p" is true is just to assert "p." Consequently, they deny that truth is a substantial metaphysical property like weight or electrical charge that explains why successful theories succeed. For them, there is no deep "nature" of truth waiting to be discovered by science or metaphysics. The predicate "is true" serves a logical function rather than describing a feature of the world. So, the podcast is correct that deflationists view truth as transparent and disquotational. They would also agree that adding "is true" to a specific proposition like "snow is white" adds no new content about the snow. The core insight that truth is not a robust property is the defining feature of the view, and the podcast accurately captures this initial negative thesis.

  **Where it goes wrong** -- The podcast makes a critical logical error claiming that if "p" equals "p is true," then all true sentences are the same thing. This conflates equivalence with identity. While "snow is white" is equivalent to "it is true that snow is white," it does not follow that "snow is white" is equivalent to "grass is green." Deflationism preserves the distinctness of propositions; it only deflates the *truth predicate*, not the content of the sentences themselves. Furthermore, the claim that "true" can always be deleted is false. Deflationists emphasize that the predicate is essential for generalizations like "Everything the witness said is true." You cannot delete "is true" here because you cannot list every infinite or unknown sentence the witness uttered. The predicate allows blind ascriptions and quantification, which is its primary logical utility. Finally, stating the theory "basically dies there" ignores decades of contemporary development. Deflationism is a live option in metaphysics, not a refuted relic, and the host presents internal difficulties as settled external falsifications. The host also conflates having no *substantial* nature with having no functional role, which deflationists explicitly distinguish.

  **Does the refutation land** -- The objection that deflationism cannot explain why truth is the goal of inquiry is a standard challenge, but calling it a refutation is overly aggressive. This is known as the "normativity objection." Deflationists argue that valuing truth does not require truth to be a substantial property. We can value truth instrumentally because true beliefs generally lead to successful action, regardless of what truth *is*. Some deflationists also argue that the *concept* of truth has a specific role in our reasoning practices that explains its value without needing a metaphysical nature. While it remains a pressure point for the theory to explain the *specific* value of truth over mere utility, most philosophers view this as an unresolved debate rather than a knockout blow. The podcast presents a live philosophical problem as a settled disproof, which misleads the listener about the current state of the literature.

  **Bottom line** -- You should take away that deflationism is a serious, nuanced position about the logical function of truth, not just a claim that the word is useless. The podcast simplifies the view to the point of caricature when discussing generalizations and value.

  Question: "How does your objection handle blind ascriptions like 'Everything he said is true' if the truth predicate is merely redundant?"
