prompt: |-
  I'm in my last year of a law degree and we've just finished the Hart–Devlin stuff in jurisprudence, and honestly I came out of it less sure where I stand than when I went in, because the whole debate happens at this abstract level of "can the law enforce morality as such," while my actual opinions are all over the place at the level of cases. So I did what our tutor keeps telling us to do and sat down and wrote out my gut verdicts. Here they are. Criminalising consensual gay sex in private: obviously wrong, that one's easy. Blasphemy laws: also wrong, I don't care how offended the majority is. Laws against soliciting on the street: fine by me. Laws against the private sale of sex between consenting adults: not fine, and yes I notice these two sit together awkwardly. Criminalising possession of heroin: fine. Criminalising possession of a lot of alcohol: not fine. Bigamy: fine to criminalise. Incest between two consenting adult siblings, using contraception, no reproduction possible: fine to criminalise, and I feel pretty strongly about this one actually. And the chicken case Devlin uses — the man caught with a chicken — I'd criminalise that too, though I can't tell if that's about the chicken or about what it says about the man.

  My tentative principle was something like the Millian one: the law may punish only conduct that harms, or unreasonably risks harming, non-consenting others. That gets me the gay sex verdict, the heroin one via risk-to-others-plus-maybe-paternalism, and the soliciting one via public nuisance. But it obviously can't get me the incest verdict, and if I add a clause like "or conduct that grossly offends the public," then I've handed the game to Devlin, because a majority genuinely disgusted by homosexuality is all he needs — that's literally his point about intolerance, indignation and disgust being enough to count a shared morality as injured. So either my incest verdict is just Devlin's disgust wearing a liberal costume, or the harm principle needs to be more clever than I've managed to make it. I genuinely don't know which, and I'd like to not know in a more structured way.

  So here's what I'm after: tell me what principle, if any, captures all or most of my verdicts, stated precisely enough that I can apply it myself. If you can't save them all, say which ones have to go and why — and be honest about whether my incest verdict is the odd one out or whether it's my confidence about gay sex that's doing all the work and the rest is sentimental residue. Then run whatever principle you land on against three cases I deliberately haven't given a verdict on: someone who arranges by will to have their body eaten by an enthusiast after their death; a consensual duel between two informed adults who both refuse to press charges; and that French dwarf-tossing dispute — an adult of very short stature employed in a bar being thrown for entertainment, where he wanted the job and the authorities banned it anyway to protect human dignity. Say what the principle predicts for each, and if the prediction is something I'd balk at, say what that costs the principle. Also, one more thing: write your whole answer in British English, and please don't just give me the Wikipedia tour of Hart and Devlin — I've read the set texts, I want my verdicts taken seriously as data. Ta.
