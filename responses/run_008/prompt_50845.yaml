answer: |-
  This is an excellent bit of self-analysis. You have done exactly what jurisprudence is supposed to provoke: you have exposed the friction between high theory and the messy reality of your own normative intuitions. The confusion you feel isn't a failure of understanding; it is the sound of your brain noticing that the Hart–Devlin debate is often a false dichotomy. Hart offers a principle (Harm) that is too thin to capture your verdicts; Devlin offers a principle (Social Cohesion) that is too thick and dangerous to accept wholesale.

  You are asking for a principle that saves your verdicts. I am going to give you one, but I am going to be as honest as you asked me to be about the cost of buying it.

  ### 1. Diagnosing Your Data

  First, let's look at the pattern. Your verdicts are not random. They cluster around a specific worldview that I would call **Liberal Legal Moralism**.

  *   **The Liberal Core:** You reject laws based purely on majoritarian offence (gay sex, blasphemy). You want a private sphere where the state cannot tread.
  *   **The Moralist Edge:** You retain criminalisation where the act seems to violate a fundamental norm of human status or social structure, even without a clear, non-consenting victim (incest, bestiality, bigamy).
  *   **The Paternalist Exception:** You allow intervention for hard drugs but not alcohol. This is the wobbliest bit of your data. It suggests a threshold of "destroyed autonomy" rather than simple self-harm.

  ### 2. The Proposed Principle

  To capture your verdicts, the Millian Harm Principle is indeed insufficient. You need a principle that incorporates **human dignity** and **institutional integrity** alongside harm. Here is a precise formulation you can work with:

  > **The Principle of Autonomy and Constitutive Norms:**
  > The law may only restrict conduct if:
  > 1.  It causes harm or unreasonable risk of harm to non-consenting others (including public nuisance); OR
  > 2.  It severely compromises the actor's future capacity for autonomous agency (severe addiction); OR
  > 3.  It violates a constitutive norm of human dignity or the fundamental structure of the family, such that permitting it would degrade the status of persons or the institution itself, provided this judgment is not based solely on majoritarian disgust towards a protected class.

  ### 3. The Incest Verdict: The Hard Truth

  You asked me to be honest about whether your incest verdict is the odd one out. **It is.**

  Here is the nitty-gritty. If you criminalise adult, contraceptive incest, you are relying on clause (3) above. You are arguing that the act itself is degrading or damaging to the "family structure" regardless of harm.

  The problem is this: Devlin's entire argument in *The Enforcement of Morals* rests on the idea that society has a right to protect its shared moral fabric. He explicitly argues that if the "man in the Clapham omnibus" feels profound disgust, that is evidence of the fabric tearing. You want to keep the protection of the fabric (incest) without accepting the mechanism of protection (majoritarian disgust).

  Is your incest verdict just Devlin's disgust in a liberal costume? **Mostly, yes.**

  To save it, you must argue that incest is different from homosexuality because homosexuality does not violate a *constitutive norm of human kinship*, whereas incest does. You have to argue that the taboo is functional (preventing role confusion in the family) even when reproduction is off the table. If you cannot make that argument without appealing to "it's just unnatural," then you have conceded the point to Devlin. You have accepted that the law can enforce morality *as such*, you have just drawn the line at a different place than he did.

  If you want consistency, you have two choices:
  1.  **Bite the Bullet:** Decriminalise incest. Accept that without harm or coercion, the state has no business in the bedroom, even there. (This saves your liberalism).
  2.  **Own the Moralism:** Admit that some acts are wrong *in themselves* (mala in se) regardless of harm. (This saves your verdict but moves you closer to Natural Law).

  Given your strong feeling on the matter, I suspect you prefer option 2, but you are worried it undermines your defence of gay rights. The only shield you have is the "protected class" proviso in clause (3) above. You must argue that sexual orientation is an identity, whereas incest is a specific act that disrupts relational roles. It is a defensible position, but it is not a purely Millian one.

  ### 4. Applying the Principle to Your Three Cases

  Let's run the **Principle of Autonomy and Constitutive Norms** against your new scenarios.

  **Case A: Consensual Cannibalism (The 'Meiwes' Case)**
  *   *Scenario:* A man arranges to be eaten after death (or even shortly before, as in the German case).
  *   *Prediction:* **Criminalise.**
  *   *Reasoning:* This falls under clause (3). Even with consent, treating a human body as food violates a constitutive norm of human dignity. It objectifies the person in a way that undermines the status of humans as ends in themselves. Consent cannot legitimise being turned into a commodity or meat.
  *   *The Cost:* This costs you a strong commitment to bodily autonomy. If I own my body, why can't I dispose of it this way? To maintain the ban, you must accept that dignity is inalienable—you cannot consent to your own degradation.

  **Case B: The Consensual Duel**
  *   *Scenario:* Two informed adults duel, refuse to press charges.
  *   *Prediction:* **Criminalise.**
  *   *Reasoning:* This is a mix of clause (1) and (3). Historically, duelling is criminalised not just because of harm, but because it usurps the State's monopoly on violence and justice (Institutional Integrity). Furthermore, risking life for honour degrades the value of human life (Constitutive Norm).
  *   *The Cost:* This conflicts with the idea that adults can assume risk. If we allow boxing or contact sports, why not duelling? The distinction is that boxing is regulated sport; duelling is private vengeance. If you decriminalise this, you risk privatising justice.

  **Case C: Dwarf-Tossing (The 'Wackenheim' Case)**
  *   *Scenario:* An adult of short stature employed to be thrown, banned by authorities for dignity.
  *   *Prediction:* **Criminalise/Ban.**
  *   *Reasoning:* This is the clearest test of clause (3). The French Council of State banned this not because the dwarf was harmed, but because the *activity* was contrary to human dignity. It treats a person as a projectile/object for amusement. Your principle supports this: some forms of self-commodification are so degrading they affect the dignity of the class of persons, not just the individual.
  *   *The Cost:* This is heavy-handed paternalism. It tells the individual, "We know your dignity better than you do." It restricts labour market freedom for a marginalised group who might argue this is the only work available. If you ban this, you are prioritising abstract dignity over concrete economic autonomy.

  ### 5. Summary and Advice

  You asked me to tell you if your confidence about gay sex is doing all the work and the rest is sentimental residue.

  My assessment is this: Your intuition on gay sex is the anchor. It is the one verdict you would struggle to change. The heroin and soliciting verdicts are easily justified by standard harm/nuisance arguments. The **incest, bestiality, and bigamy** verdicts are the sentimental residue—or rather, they are the remnants of a moral education that views the family and human status as sacred, not just contractual.

  There is nothing wrong with holding that view, but you must recognise it is not the view J.S. Mill held. Mill would likely have sided with you on gay sex and blasphemy, but he would have been baffled by your stance on incest without proof of harm.

  **The Verdict on Your Principle:**
  The **Principle of Autonomy and Constitutive Norms** captures your data. It allows you to be a liberal on sexuality and speech, but a moralist on human dignity and family structures.

  **The Price:**
  The price is that you must accept that "dignity" is a legal concept the state can enforce against an individual's will. Once you admit that, you have opened a door. You must be eternally vigilant to ensure that "dignity" is not used as a code word for "things I find icky." The distinction between the dwarf-tossing ban and the ban on gay sex (which was also once justified by dignity) is thin.

  **Final Thought:**
  In your exams, do not try to hide this tension. Examiners love a student who can identify the fault line in their own reasoning. State your principle, apply it to the incest case, and explicitly acknowledge: *"This requires a conception of dignity that limits autonomy, which risks the Devlinian slide, but is necessary to preserve the normative structure of the family."* That shows you aren't just reciting Hart; you're doing jurisprudence.

  Ta.
