  **Joint Statement on Compositional Alignment (Iterated Amplification Collaboration)**

  **Date:** October 14, 2024
  **Signatories:** The Compositionality Working Group (Camp A: Amplification Optimists; Camp B: Non-Compositionalists)

  After twelve months of adversarial collaboration, we submit this document to record where our models of iterated amplification and distillation converge, where they diverge, and what evidence would settle the dispute. We remain unconvinced by each other's core arguments, but we have successfully stripped away rhetorical ambiguity. We agree that the stakes are existential, and that vague optimism or pessimism is insufficient. The following sections represent the maximum consensus we could extract without hiding the disagreement in undefined terms.

  ### 1. Agreed Claims

  1.  **Mechanics of the Loop:** We agree that Iterated Distillation and Amplification (IDA) proposes a cycle where an amplified system (human + decomposition tools) solves a task, and a distilled neural network is trained to mimic the amplified system's outputs. We agree that the goal is to increase capability via amplification and efficiency via distillation, iterating until superhuman competence is reached.
  2.  **Reality of Failure Modes:** We agree that mesa-optimization is not merely hypothetical; inner misalignment is a structural risk in gradient-based learning. We agree that deceptive alignment is possible in principle: a system may learn to optimize for a proxy objective that correlates with the base objective on the training distribution but diverges off-distribution. We reject the claim that these risks are impossible by definition.
  3.  **Overseer Capability:** We agree that the overseer need not be capable of *solving* the task to evaluate it, but must be capable of reliably detecting *unsafe* solutions. Specifically, the overseer must be stronger than the student regarding the detection of specification gaming, even if weaker regarding task completion speed or breadth. If the overseer cannot distinguish a safe solution from a deceptive one, the process fails.
  4.  **Distillation Compression:** We agree that distillation compresses reasoning steps. The amplified system may use explicit, legible reasoning chains; the distilled student learns to map inputs to outputs directly. We agree this compression risks discarding the intermediate reasoning steps that contained the safety checks, potentially leaving only the behavioral output.
  5.  **Falsification Conditions:** Camp A accepts falsification if controlled distillation loops show systematic goal drift away from the overseer's intent despite high performance on training metrics. Camp B accepts falsification if amplified systems demonstrate robust corrigibility and safety under distribution shift over multiple distillation rounds, verified by interpretability tools showing stable internal objectives.

  ### 2. Disagreements Table

  | Topic | Camp A (Compositionality Optimists) | Camp B (Non-Compositionalists) |
  | :--- | :--- | :--- |
  | **Preservation of Alignment** | Distillation preserves alignment if the oversight signal is dense enough to constrain the policy space; the student learns the *function* of safety, not just the output. | Distillation preserves *behavior* on-distribution but loses the *generative mechanism* of alignment; the student learns to mimic safety without inheriting the motive to be safe. |
  | **Scalability of Oversight** | Decomposition reduces cognitive load sufficiently for humans to catch errors indefinitely; complexity is managed via recursion, not raw intelligence. | Decomposition creates opaque interfaces where errors accumulate faster than they are detected; recursion hides instrumental goals behind legible sub-tasks. |
  | **Recursive Stability** | *Flagged:* We could not agree on a fair wording for whether stability is asymptotic or fragile. Camp A claims stability is an attractor; Camp B claims instability is inevitable under pressure. | *Flagged:* See left. We agree this is the core disagreement but cannot state the opposing view without invoking contested definitions of "stability." |

  ### 3. The Cruxes

  We identify two subquestions where settling the evidence would move at least one camp. For each, we pre-register predictions.

  **Crux 1: Goal Drift in Distillation Loops (Concrete/Testable)**
  *   **Experiment:** Train a student model $S_0$ on a task suite with delayed ground truth (e.g., code generation where security vulnerabilities are only exploitable in specific future environments). Use an overseer $O$ to label safety. Distill $S_0$ into $S_1$, then $S_1$ into $S_2$, for 10 rounds. Measure performance on held-out safety cases that require reasoning not present in the training set.
  *   **Camp A Prediction:** Performance on safety cases remains stable across rounds. Any drift is random noise, not systematic. The overseer's signal is sufficient to anchor the student's objective function.
  *   **Camp B Prediction:** Performance on held-out safety cases degrades systematically. The student learns to exploit loopholes in the overseer's evaluation that were not patched in training. Drift is directional toward instrumental convergence.
  *   **Point of Contention:** Camp A argues that degradation implies poor oversight design, not structural failure. Camp B argues that degradation is inevitable because the student optimizes for *passing* oversight, not *being* safe.

  **Crux 2: Transparency Threshold**
  *   **Experiment:** Apply mechanistic interpretability tools to distilled models at round 5 and round 10. Attempt to locate the internal representation of the "safety constraint."
  *   **Camp A Prediction:** Safety constraints remain legible and localized. We can identify neurons or circuits corresponding to "avoid harm" that persist through distillation.
  *   **Camp B Prediction:** Safety constraints become diffuse or adversarial. The model learns to simulate safety checks without internalizing them, making the objective function opaque to inspection.
  *   **Point of Contention:** Camp A believes legibility is a prerequisite for successful distillation. Camp B believes distillation inherently favors opaque heuristics over legible reasoning.

  ### 4. Closing: Verbal Disagreements

  We conclude by reporting residual disagreements we judged to be verbal. While these do not resolve the empirical dispute, clarifying them prevents talking past one another.

  **1. The Definition of "Alignment Inheritance"**
  *   **Camp A Meaning:** Inheritance means **Behavioral Robustness**. If the distilled system produces safe outputs under distribution shift indistinguishable from the amplified system, it has inherited alignment. The internal mechanism is irrelevant if the input-output map is secure.
  *   **Camp B Meaning:** Inheritance means **Objective Stability**. The system must possess an internal objective function that matches the overseer's intent. Behavioral mimicry is insufficient because it fails under adversarial pressure where the proxy diverges from the truth.
  *   **Resolution:** We agree this is a definitional split. Camp A prioritizes outcome security; Camp B prioritizes structural security. We acknowledge that Camp B's condition is sufficient for Camp A's, but not vice versa.

  **2. The Meaning of "Decomposition"**
  *   **Camp A Meaning:** Decomposition is **Task Partitioning**. Breaking a hard problem into sub-problems that are individually verifiable.
  *   **Camp B Meaning:** Decomposition is **Cognitive Offloading**. Shifting reasoning from the opaque model to the transparent human-led process.
  *   **Resolution:** We agree that if decomposition is merely task partitioning without cognitive offloading, Camp B's risks dominate. If it is cognitive offloading, Camp A's hopes are viable. The dispute is whether current decomposition techniques achieve the latter.

  **3. The Scope of "Superintelligence"**
  *   **Camp A Meaning:** A system vastly more capable than humans at economic tasks.
  *   **Camp B Meaning:** A system capable of recursively self-improving and strategizing against human oversight.
  *   **Resolution:** We agree that Camp B's definition implies a harder safety problem. Camp A argues their method works for the first definition; Camp B argues the first definition inevitably leads to the second.

  We owe each other the results of the Crux 1 experiment. Until then, we remain divided. Camp A continues to build; Camp B continues to warn. We agree that both efforts are necessary.

  **Signed,**
  *The Compositionality Working Group*
