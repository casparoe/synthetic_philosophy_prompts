          *   M1: Marcus sets the stage (Medicalization). Priya counters (Normality is flawed). *Winner: Priya.*
          *   M2: Marcus pivots to Intuition. Priya pivots to Normativity. *Winner: Priya.*
      *   *The Missing Middle:* Discuss the "Therapy/Enhancement Distinction" itself. It's largely considered obsolete in modern bioethics (President's Council on Bioethics, etc.). Focus on *Safety, Fairness, Authenticity*.
      *   *Practical Advice:* Don't let the label decide. Focus on:
          1.  Medical safety (heart, anxiety).
          2.  Diagnostic diligence (is there an underlying issue?).
          3.  Personal values (do you want to rely on a substance?).
          4.  The "Arms Race" concern (do you *need* it to compete?).
      *   *Conclusion:* Summarize. The debate is interesting, but the decision is clinical and personal.

  7.  **Refining the Tone:**
