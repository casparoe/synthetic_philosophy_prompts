prompt: |-
  Next week I see a psychiatrist about starting modafinil for daytime fatigue. Nothing is clinically wrong with me — I sleep adequately, I'm not narcoleptic — but my concentration is poor enough that my doctor floated it as an option, and I have to decide before the appointment whether I even want to go down that road. When I mentioned this at dinner, two friends spent an hour arguing about it, and I honestly couldn't tell who was winning.

  Marcus went first: taking it would be enhancement, not therapy. Nothing is broken; being foggy at 3pm is the human condition, and if every shortfall from optimal functioning counts as a treatable condition, we've pathologized ordinary life and handed medicine the job of fine-tuning it. The therapy/enhancement line may be blurry, he said, but it's the only thing standing between medicine that responds to illness and medicine that services preferences.

  Priya said the line he was defending couldn't survive its own examples. If the standard is species-typical functioning, then glasses are enhancement for anyone who could squint along without them, and no one thinks that. If the standard is statistical normality, then treating hypertension in the over-seventies is enhancement, since most of them have it. And if the standard is just "whatever medicine treats," the definition is circular and the pill would flip categories the moment a prescription pad appears.

  Marcus retreated to a different line: it's not about normality but about disease — about whether the intervention targets a condition that impairs you in a distinctively medical way, which we can recognize in hard cases even if we can't define it, the way we recognize funny without defining that.

  Priya called the retreat a tell: he'd moved from "restoring function" to "treating disease" as soon as each got hard, which suggests the position is post hoc. And if the real standard is impairment relative to my own goals — which is what he actually appealed to with "distinctively medical" — then my taking the pill is therapy for my life rather than an enhancement to it; whereas if enhancement is simply intervention beyond the medically indicated, then it's an open question whether enhancement is bad at all, and Marcus owes an argument that it is, not just a label.

  They agreed to let me referee the written version, and I'd like to do it properly. Please adjudicate the exchange move by move: say who is right at each step and why, identify what, if anything, both of them are missing about the therapy/enhancement distinction, and tell me how much of this should actually bear on my decision next week.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** The user is seeing a psychiatrist next week about modafinil for daytime fatigue (no clinical diagnosis like narcolepsy, sleeps adequately).
      *   **The Conflict:** Two friends (Marcus and Priya) argued about whether taking modafinil in this context is "therapy" or "enhancement" and the ethical implications thereof.
      *   **The Task:** Adjudicate the exchange move-by-move, identify what both are missing about the therapy/enhancement distinction, and advise on how much this should bear on the user's decision.
      *   **Tone:** Philosophical, balanced, practical, empathetic.

  2.  **Deconstruct the Arguments:**

      *   **Marcus (Move 1):**
          *   *Claim:* Taking modafinil here is enhancement, not therapy.
          *   *Reasoning:* Nothing is "broken." Foggy at 3pm is normal human condition. Pathologizing ordinary life turns medicine into a service for preferences.
          *   *Core Principle:* Therapy/Enhancement distinction is the barrier between treating illness and servicing preferences.

      *   **Priya (Move 1):**
          *   *Claim:* Marcus's line (species-typical/statistical normality) doesn't hold up to scrutiny.
          *   *Examples:* Glasses (enhancement if squinting is normal?), Hypertension in 70+ (statistically normal, yet treated).
          *   *Critique:* If the standard is "what medicine treats," it's circular.
          *   *Core Principle:* Definitions based on normality or statistical frequency fail in edge cases.

      *   **Marcus (Move 2 - Retreat):**
          *   *Claim:* It's not about normality, it's about "disease" or "distinctively medical impairment."
          *   *Reasoning:* We recognize it intuitively (like recognizing "funny") even if we can't define it strictly.
          *   *Core Principle:* Intuitionism/Cluster concept of disease.

      *   **Priya (Move 2 - Counter):**
          *   *Claim:* Marcus shifted goalposts (post hoc rationalization).
          *   *Argument:* If the standard is "impairment relative to goals," then it *is* therapy for the user's life. If "enhancement" just means "beyond medically indicated," then enhancement isn't necessarily bad. Marcus needs to argue *why* enhancement is bad, not just label it.
          *   *Core Principle:* The normative weight lies on the *value* of the intervention, not the *label*.

  3.  **Evaluate the Moves (Adjudication):**

      *   *Marcus Move 1:* Strong intuitive appeal (medicalization of life), but philosophically weak on definition. He relies on a "natural function" argument that is hard to pin down. *Verdict:* Priya wins on logic, Marcus wins on intuition.
      *   *Priya Move 1:* Strong logical dismantling. The "glasses" and "hypertension" analogies are classic bioethics counter-examples. She exposes the fuzziness of "normal." *Verdict:* Priya is right.
      *   *Marcus Move 2:* A common retreat in bioethics (Boorse vs. Nordenfelt). Appealing to intuition ("we know it when we see it") is honest but vulnerable to bias. *Verdict:* Draw. It's a defensible philosophical position (cluster concepts), but weak in a debate about policy/decision.
      *   *Priya Move 2:* The strongest move. She shifts the debate from *categorization* to *normativity*. Just because something is "enhancement" doesn't make it wrong. She forces Marcus to defend the *harm*, not the *label*. *Verdict:* Priya wins.

  4.  **Identify What's Missing (The "Third View"):**
      *   Both are stuck in a semantic debate (Therapy vs. Enhancement).
      *   *Missing Element 1:* The Risk/Benefit Profile. Bioethics isn't just about labels; it's about safety, side effects, and efficacy. Modafinil isn't caffeine; it has psychiatric and cardiovascular risks.
      *   *Missing Element 2:* Autonomy and Authenticity. Does the drug change *who* the user is? (Neuroethics).
      *   *Missing Element 3:* Social Justice/Access. If this becomes normal, does it create an arms race? (Sandels's "Hyperagency").
      *   *Missing Element 4:* The Clinical Relationship. The doctor's role. Is the doctor acting as a healer or a service provider?

  5.  **Address the User's Decision:**
      *   How much should this philosophical debate matter?
      *   *Answer:* Not much, directly. The label doesn't change the chemistry.
      *   *What matters:* Side effects, dependency, underlying causes of fatigue (stress? diet? sleep apnea?), ethical comfort, long-term goals.
      *   *Advice:* Go to the appointment, but focus on clinical questions, not semantic ones.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the friends' debate. It's a classic bioethics standoff.
