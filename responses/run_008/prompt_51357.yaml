  **MEMORANDUM TO THE BOARD OF TRUSTEES**

  **FROM:** [Your Name], Trustee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Morrill Act Historical Report and Institutional Statement

  **I. RECOMMENDATION**

  I recommend that the Board adopt a **Statement of Acknowledgement, Apology, and Commitment** as detailed in Section IV of this memo.

  This approach secures the two-thirds vote required by our bylaws by synthesizing the moral imperatives raised by the Student Association and the Regional Indigenous Council with the fiduciary and historical rigor demanded by the Minority faction. Specifically, I recommend we:

  1.  **Issue a formal apology** for the University's participation in the system of Indigenous dispossession, grounded in the undisputed fact of the land grant, rather than the uncertain financial ledger.
  2.  **Exclude specific financial qualifiers from the public text.** To avoid the "apology with an asterisk" rightly criticized by the Indigenous Council, the statement will not highlight the uncertainty of the endowment trail. That nuance belongs in the archival report, not the moral declaration.
  3.  **Establish a Joint Working Group** to determine appropriate forms of ongoing relationship and repair, rather than mandating an immediate endowment transfer. This addresses the desire for material action while allowing time for the skeptical faction to engage with the data without feeling coerced into a specific fiscal remedy before due diligence is complete.

  **II. RATIONALE AND RESPONSE TO BOARD CONCERNS**

  To secure the necessary majority, we must ensure that no faction feels their core ethical or legal concerns are being dismissed. The following reasoning addresses the strongest arguments of each position.

  **A. To the Pro-Apology and Indigenous Council Faction: On the "Hedged Apology"**
  You have argued convincingly that an apology conditioned on financial uncertainty reads as insincere—a moral acknowledgment followed by a fiscal excuse. I agree. A statement that says "We apologize, *but* we don't know where the money went" undermines the apology's purpose.

  However, we also cannot affirm a financial link the historians cannot verify without compromising the University's intellectual integrity. The solution is to shift the ground of the apology from the *dollars* to the *opportunity*. The Morrill Act provided Ashford State with capital and status that allowed it to exist. Whether a specific brick was bought with specific scrip is less morally relevant than the fact that the University was chartered to benefit from the liquidation of expropriated land. Therefore, the draft language below apologizes for our *institutional participation in the system of dispossession*, which is historically certain, rather than the *specific flow of funds*, which is uncertain. This removes the asterisk while maintaining historical accuracy.

  **B. To the Minority Faction: On Agency and "Theater"**
  You have argued that the present University cannot apologize for acts committed by the state or the federal government in the 19th century, and that a statement is merely performative.

  While the federal government executed the dispossession, Ashford State is the continuous legal entity that accepted the benefit. We are not apologizing for the actions of the U.S. Army; we are apologizing for our institution's acceptance of the proceeds. Institutional continuity carries moral responsibility. If we claim the heritage and prestige of our 1862 founding, we must also account for its costs. Furthermore, this is not merely theater if it is tied to concrete action. The proposed resolution creates a Working Group with the authority to recommend tangible programs. An apology without a change in behavior is theater; an apology that initiates a negotiated commitment is governance.

  **C. To the Pro-Reparations Faction: On Endowment Transfer**
  You have argued that acknowledgment without material repair is insufficient. I share the view that words must be accompanied by action. However, mandating a specific transfer of endowment funds in this resolution risks losing the two-thirds vote, which would result in no statement and no action at all.

  By voting to establish a Joint Working Group with Indigenous representation, we commit the Board to a process that will likely recommend financial or programmatic repair, but we allow the specific mechanism to be determined by data and negotiation rather than immediate mandate. This ensures that any future financial commitment is sustainable, legally sound, and supported by the full Board, making it more likely to endure.

  **III. STRATEGIC CONSIDERATIONS**

  Passing this resolution requires 10 votes (assuming a 15-member board). We currently have strong support for an apology, but the financial uncertainty and the "agency" argument threaten to peel away the moderate center.

  By decoupling the *moral apology* (based on land) from the *financial audit* (based on scrip), we protect the statement from future historical revisionism. If we claim the endowment was built on this money and later evidence proves otherwise, our apology becomes a liability. If we claim we benefited from the *system*, our moral standing remains secure regardless of the ledger. This protects the University while honoring the truth.

  **IV. PROPOSED RESOLUTION AND STATEMENT LANGUAGE**

  **Resolution:**
  *Be it resolved that the Board of Trustees of Ashford State University adopts the following Statement of Acknowledgement, Apology, and Commitment, and authorizes the Chair to appoint a committee to collaborate with the Regional Indigenous Council on the implementation of the commitments herein.*

  **Draft Statement for Adoption:**

  > **Statement of Acknowledgement, Apology, and Commitment**
  >
  > Ashford State University was founded under the Morrill Act of 1862, a federal law that generated capital for higher education by expropriating land from Indigenous nations. We acknowledge that our institution's existence was made possible by the dispossession of these peoples, specifically the [Name Specific Nations if known, otherwise "Indigenous nations of this region"].
  >
  > While the specific financial trail of the land scrip allocated to our state is complex, the moral reality is clear: Ashford State accepted the benefit of land that was not rightfully the government's to give. We apologize for our institution's participation in this system of dispossession and for the erasure of Indigenous presence that accompanied our founding.
  >
  > We recognize that an apology is insufficient without a change in relationship. Therefore, Ashford State commits to:
  > 1.  Preserving and making accessible the full historical record of our founding capitalization.
  > 2.  Establishing a Joint Working Group with representatives of the descendant communities to identify meaningful forms of repair, including educational access, cultural stewardship, and ongoing partnership.
  > 3.  Ensuring that Indigenous voices are permanently integrated into the governance of this relationship.
  >
  > We acknowledge that we cannot change the past, but we accept the responsibility to shape a future that honors the truth of our origins.

  **V. NEXT STEPS**

  If this recommendation is favored, I propose we schedule a special working session in three weeks to review the composition of the proposed Joint Working Group. This allows time for informal caucusing to ensure the two-thirds threshold is met before the formal vote in six weeks.

  I urge my colleagues to support this recommendation. It avoids the pitfalls of historical inaccuracy, respects the dignity of the Indigenous Council by refusing to hedge the moral apology with financial caveats, and answers the concern that this is mere theater by binding the University to a concrete process of repair.

  Respectfully submitted,

  [Your Name]
  Trustee, Ashford State University
