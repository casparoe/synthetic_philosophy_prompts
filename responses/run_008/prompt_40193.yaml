  However, the concern for community memory is equally valid, as myths serve a sociological function distinct from factual accuracy. The story of Crane's benevolence is not merely a lie; it is an artifact of how the town understood its own cohesion and survival during difficult decades. By treating the founding legend as an object of study rather than a statement of fact, the exhibit honors the people who believed it without validating the inaccuracies. This approach acknowledges that the town's identity was built on both the economic reality of the mill and the cultural narrative that softened its edges.

  Avoiding a weak compromise requires clear delineation rather than equivocation. The text should not suggest ambiguity where none exists, but rather state the records show one thing while the town remembered another. This juxtaposition invites visitors to understand why the myth was necessary and how it functioned, transforming the exhibit from a celebration of a man into a celebration of the town's complex maturity. A 150th anniversary marks endurance, which is best honored by acknowledging the struggles that required such resilient storytelling, rather than pretending those struggles never existed.
