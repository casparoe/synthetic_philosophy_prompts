answer: |-
  **Margins of Error and the Limits of Luminosity: A Defence of Restricted Self-Knowledge**

  **Introduction**

  In *Knowledge and Its Limits* (2000), Timothy Williamson mounts a formidable challenge to a traditional epistemological orthodoxy: the thesis of luminosity. A condition is luminous if, whenever it obtains, one is in a position to know that it obtains. This thesis is intimately connected to the KK principle (the principle that if one knows $p$, one is in a position to know that one knows $p$), as luminosity regarding one's own knowledge would entail KK. Williamson's anti-luminosity argument is widely regarded as one of the most significant contributions to contemporary epistemology, shifting the default position from the Cartesian assumption of privileged access to a fallibilist, externalist model. However, the scope of the argument remains a matter of contention. This essay reconstructs Williamson's argument, emphasising the crucial role of the sorites structure, evaluates the primary objections regarding externalism and triviality, and examines a less discussed wrinkle concerning the internal structure of mental conditions. It concludes by defending the position that while Williamson successfully refutes luminosity for graded phenomenal states, his argument overreaches when applied to sharp-boundary occurrent thoughts, leaving room for a restricted, constitutive luminosity.

  **The Anti-Luminosity Argument**

  Williamson's argument proceeds by *reductio*. He asks us to consider a non-trivial condition $C$, such as feeling cold. We are to imagine a sequence of cases $\alpha_0, \alpha_1, \dots, \alpha_n$ occurring at successive moments throughout a day. In $\alpha_0$, the subject feels intensely cold; in $\alpha_n$, the subject feels intensely hot. The transition is gradual: the change in phenomenal character between any adjacent cases $\alpha_i$ and $\alpha_{i+1}$ is so minute as to be indiscriminable to the subject.

  The core of the argument relies on a Margin for Error principle for knowledge. Williamson posits that knowledge requires safety: one knows $C$ only if one could not easily have been wrong about $C$. In the context of the series, this yields the following principle:

  **(MfE)** If one knows $C$ in $\alpha_i$, then $C$ obtains in $\alpha_{i+1}$.

  The justification for (MfE) is that $\alpha_i$ and $\alpha_{i+1}$ are epistemically indiscriminable. If $C$ were false in $\alpha_{i+1}$, the subject in $\alpha_i$ would be in a state phenomenally identical to a state where $C$ is false. Since knowledge requires the ability to rule out relevant alternatives, and the subject cannot distinguish $\alpha_i$ from $\alpha_{i+1}$, the subject cannot know $C$ in $\alpha_i$ unless $C$ is also true in $\alpha_{i+1}$.

  If we assume $C$ is luminous, then in $\alpha_0$, the subject knows $C$ (since $C$ obtains). By (MfE), if the subject knows $C$ in $\alpha_0$, $C$ must obtain in $\alpha_1$. If $C$ obtains in $\alpha_1$, and $C$ is luminous, the subject knows $C$ in $\alpha_1$. By iterating (MfE), we are forced to conclude that $C$ obtains in $\alpha_2, \alpha_3, \dots, \alpha_n$. But by stipulation, $C$ does not obtain in $\alpha_n$. Thus, the assumption of luminosity leads to a contradiction. There must be some case $\alpha_i$ where $C$ obtains but the subject does not know $C$.

  It is vital to understand why the sorites-style structure is necessary. Mere fallibility—the admission that one can sometimes be mistaken about $C$—is insufficient to refute luminosity. A Cartesian could concede that one can be mistaken about feeling cold in confusing circumstances while maintaining that in *actual* cases where one feels cold, one knows it. The sorites series closes this escape route by linking the cases. It exploits the continuity of the phenomenology against the discreteness of knowledge. Because the cases are pairwise indiscriminable, knowledge in one case imposes a truth requirement on the next. Without this chain of indiscriminable neighbours, the margin for error would not propagate, and the subject could potentially know $C$ in $\alpha_0$ even if $C$ fails in a distant $\alpha_n$. The gradualness ensures that the 'error' cannot be localised; it forces a gap between truth and knowledge somewhere in the series.

  **Objections and Replies**

  The argument has generated substantial pushback, centreing on three main objections.

  First, critics argue that the argument begs the question against the internalist. The Margin for Error principle is derived from a safety condition on knowledge, which is a distinctly externalist constraint. A Cartesian about introspection holds that the justification for believing one is in pain is constituted by the pain itself; there is no gap between the fact and the access to it. To such a theorist, (MfE) is false for mental states. If introspection is infallible, one can know $C$ in $\alpha_i$ even if $C$ fails in $\alpha_{i+1}$, because the basis of the knowledge in $\alpha_i$ is not compromised by the facts in $\alpha_{i+1}$. Williamson's reply is that this merely restates the disagreement. He aims to show that *if* we accept a plausible, general constraint on knowledge (safety), luminosity fails. To reject safety for introspection is to treat self-knowledge as a magical exception to the norms governing all other cognitive faculties.

  Second, there is the objection that the argument proves too much. If (MfE) applies to feeling cold, does it not also apply to perceptual knowledge, such as seeing a red patch? If so, Williamson seems to endorse a sceptical conclusion regarding perception. Williamson accepts this cost but denies it is scepticism. He argues we retain knowledge, but we lose *precision*. We can know we feel cold, but we cannot know exactly where the boundary lies between feeling cold and not feeling cold. The objection loses force if one accepts that knowledge is compatible with margins of error, provided those margins do not engulf the proposition known.

  Third, Williamson concedes that trivial conditions are luminous. For example, the condition 'knowing $p$' is trivially luminous if one accepts factivity: if one knows $p$, one knows $p$. Similarly, tautological conditions are luminous. The anti-luminosity result applies only to *non-trivial* conditions. This concession limits the scope of the argument but does not undermine it. The philosophical interest lies in substantive mental states (sensations, emotions, occurrent thoughts), not logical truths. The debate is thus narrowed to whether any interesting psychological conditions survive the margin-for-error pressure.

  **The Structural Wrinkle: Graded vs. Sharp Conditions**

  A less explored but critical dimension of the argument concerns the internal structure of the condition $C$. Williamson's paradigmatic example is 'feeling cold', which is a graded, vague condition. It admits of degrees and lacks a sharp boundary. However, consider a condition like 'having a sharp pain' or 'occurrently thinking that $p$'. These appear to be binary states; either the thought is occurring or it is not. Does the sorites reasoning generalise to these sharp-boundary states?

  Williamson argues that it does. Even if the transition from thinking to not thinking is sudden, the *knowledge* of that transition relies on cognitive faculties subject to margins of error. Just as one cannot pinpoint the exact shade of red one sees, one cannot pinpoint the exact moment a thought ceases. There will be cases near the boundary where the thought is occurring, but the subject is not in a position to know it, because their discriminative capacities cannot rule out the neighbouring case where the thought has just ceased.

  However, this generalisation relies on modelling self-knowledge of occurrent thoughts on the same cognitive architecture as perceptual judgement. This is contestable. For graded states like feeling cold, there is a distinction between the phenomenal state and the classification of that state. One can feel a certain way and hesitate to label it 'cold'. The margin for error arises from this classificatory gap.

  In contrast, for occurrent thoughts, many philosophers defend a constitutive view of self-knowledge. On this view, the knowledge that I am thinking that $p$ is not a separate cognitive achievement that tracks the thought; rather, the thinking that $p$ is partly constituted by the awareness of it. If the condition and the knowledge of the condition are not distinct existences, the Margin for Error principle loses its grip. (MfE) requires that the basis for knowledge in $\alpha_i$ be compatible with the falsity of $C$ in $\alpha_{i+1}$. But if the basis for knowing I am thinking is the thinking itself, then in any case where the thought occurs, the basis is present.

  The sorites series requires that $\alpha_i$ and $\alpha_{i+1}$ be indiscriminable. While this is plausible for 'feeling cold', it is less clear for 'occurrently judging that $p$'. If I am actively judging, there is a specific cognitive activity present. If I stop, it is absent. While the *onset* might be fuzzy, the presence of the activity itself is not a matter of degree in the same way temperature is. To apply the margin for error here, Williamson must assume that the subject's access to their own occurrent activity is fallible in the same way their access to external stimuli is. This assumes what the constitutive theorist denies: that self-knowledge is a matter of inner perception rather than rational agency.

  Therefore, the force of the argument is not uniform. It is devastating for vague, phenomenal conditions where classification outstrips the precision of experience. It is significantly weaker for sharp, occurrent attitudes where the experience and the awareness are arguably inseparable.

  **Conclusion**

  Williamson's anti-luminosity argument represents a necessary correction to the uncritical acceptance of the KK principle and Cartesian introspection. He successfully demonstrates that for any condition where there is a gap between the obtaining of the condition and the cognitive capacity to detect it, luminosity must fail. The sorites structure is essential to this proof, as it transforms mere fallibility into a structural impossibility of knowledge at the boundaries.

  However, the argument does not warrant a global scepticism about self-knowledge. The conclusion defended here is that luminosity fails for graded conditions but the Cartesian can legitimately retreat to a restricted class of sharp-boundary mental states. Williamson's generalisation of the margin-for-error principle to occurrent thoughts relies on treating self-knowledge as a form of internal detection subject to the same reliability constraints as perception. This conflates the awareness inherent in conscious thought with the fallible judgement of phenomenal character.

  While we cannot know with luminous certainty that we are 'feeling cold' (due to the vagueness of coldness), we can maintain that when one is occurrently judging that $p$, one is in a position to know it, not because one has inspected the judgement, but because the judgement is a self-intimating act. Thus, Williamson is right that knowledge has limits, but he is wrong to assume those limits are uniform across all mental domains. A restricted luminosity thesis survives, preserving the core insight that the mind is transparent to itself in the act of thinking, even if it is opaque in the act of feeling.

  **Bibliography**

  Williamson, T. (2000). *Knowledge and Its Limits*. Oxford: Oxford University Press.
