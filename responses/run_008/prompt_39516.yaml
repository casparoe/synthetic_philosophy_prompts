      *   *The Setup:* A sequence of cases $\alpha_0, \dots, \alpha_n$. $\alpha_0$ is definitely cold, $\alpha_n$ is definitely not cold. Adjacent cases are indiscriminable.
      *   *Margin for Error Principle:* If one knows $C$ in $\alpha_i$, then $C$ holds in $\alpha_{i+1}$. Why? Because if $C$ didn't hold in $\alpha_{i+1}$, and $\alpha_i$ is indiscriminable from $\alpha_{i+1}$, one couldn't rule out $\alpha_{i+1}$ while in $\alpha_i$. Knowledge requires safety.
      *   *The Sorites Push:* If $K C$ at $\alpha_0$, then $C$ at $\alpha_1$ (by MfE). If $K C$ at $\alpha_1$, then $C$ at $\alpha_2$... Eventually, we reach $\alpha_n$ where $C$ is false. So $K C$ must fail before $\alpha_n$.
      *   *The Anti-Luminosity Result:* There is a point where $C$ holds but $K C$ does not.
      *   *Why Gradualness?* Mere fallibility isn't enough. If I can be wrong, I might still know in *this* specific case. The sorites series links the cases so that knowledge in one entails truth in the *next*. It creates a chain that drags knowledge into falsehood unless knowledge stops while truth continues. It exploits the continuity of the phenomenology against the discreteness of knowledge.

