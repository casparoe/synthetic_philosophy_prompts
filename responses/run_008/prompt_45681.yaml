answer: |-
  **Interviewer:** Mr. Keynes, in your 1938 memoir *My Early Beliefs*, you describe the creed of your Cambridge youth as a religion of sorts, built on G. E. Moore's *Principia Ethica*. You say you believed that nothing mattered except states of mind—specifically personal affection and the appreciation of beauty—and that these were "organic wholes" valuable in themselves, quite apart from any consequences. Looking back from the end of your life, did you ever truly abandon that core assertion that the value of life lies entirely in the quality of consciousness, not in what that consciousness achieves in the world?

  **Follow-up:** If you held to that view, how do you account for the fact that you spent the bulk of your adulthood not in contemplation, but in the frantic, consequence-obsessed machinery of the Treasury, at Versailles, and battling over monetary policy? On your own account, were those decades of public struggle ultimately justified only as a means to secure the conditions for those states of mind, rather than for their results?

  ***

  **Interviewer:** I want to press on that private sphere, because in *My Early Beliefs* you revisit a painful encounter with D. H. Lawrence. He accused you and the Bloomsbury circle of being "emotional shells," calling you "little swarming selves" who treated the sacred matters of the heart as a game of intellectual outlawry. You concede in the memoir that he was right, that you had ignored the deep, animal roots of human nature. Does admitting that you were wrong about the nature of love not give away the whole case for the Moorean good life you claim you never abandoned?

  **Follow-up:** You write that you and your friends treated love as a "reasoned" affair, detached from consequence. If you concede that this detachment was a failure of life, does it not suggest that the "right action" you once dismissed as merely instrumental is actually constitutive of the good life itself, rather than just a path to it?

  ***

  **Interviewer:** Let's turn to the economic problem, which you famously called a temporary necessity. In *Economic Possibilities for Our Grandchildren*, you describe the love of money as a possession as a "somewhat disgusting morbidity," a half-punishable crime. Yet the historical record shows you were a vigorous speculator in the markets, managing funds for King's College and yourself, and by many accounts, you rather enjoyed the thrill of it. How do you reconcile that moral condemnation with your own enthusiastic participation in the game?

  **Follow-up:** You might argue that for you, speculation was an intellectual amusement rather than a desperate appetite. But can that distinction really carry the moral weight you put on it? If the love of money is a morbidity, does it matter whether one is a healthy man enjoying a morbidity or a sick one suffering from it?

  ***

  **Interviewer:** In that same essay, you prophecy that a hundred years hence, the economic problem may be solved, and mankind will face its "permanent problem": how to live wisely and agreeably when accumulation no longer has social value. You suggest that only those who can keep alive the "art of life itself" will survive this transition. When you speak of this "art of life," are you describing a return to that early Cambridge ideal of timeless contemplation, or is it something new that requires the very engagement with the world you spent your life practicing?

  **Follow-up:** I'd like to ask you to be precise, in your own idiom of states of mind and organic wholes: what does a Tuesday afternoon actually look like in that solved world? If the struggle for subsistence is gone, what specific affections or beauties fill the hours, since that is precisely where your early creed and your optimism about your grandchildren seem to pull in opposite directions?

  ***

  **Interviewer:** Finally, you suggest in *Economic Possibilities* that when the economic problem is solved, we shall be able to rid ourselves of many of the pseudo-moralities that have hag-ridden us for two hundred years. But if the good life is, as you told us at the start, a matter of unanalysable organic wholes and personal affection, can it ever be taught or solved in the way an economic problem can? Is there not a risk that your grandchildren, freed from toil, will find the burden of creating value in their own consciousness heavier than the burden of bread?

  **Follow-up:** If that burden is heavier, was your life's work in economics merely a way to buy time for the human race to learn what you and the Apostles were trying to learn at Cambridge: that the difficulty is not in getting the means to live, but in knowing what living is for?
