answer: |-
  **Exam Question**

  Nozick's tracking theory denies the universal closure principle, yet he proposes a method-relative restriction to preserve knowledge gained via deduction. Critically evaluate this move. Explain how the sensitivity condition creates a structural symmetry between blocking skeptical hypotheses and undermining ordinary knowledge of entailed propositions (e.g., the Zebra/Mule case). Is Nozick's appeal to methods a principled solution or an ad hoc patch? Conclude by assessing whether the theoretical price of abandoning universal closure is worth paying to save fallibilism from skepticism.

  ***

  **Model Answer**

  Nozick's tracking theory defines knowledge via sensitivity: $S$ knows $p$ only if, were $p$ false, $S$ would not believe $p$. This condition successfully blocks skepticism because beliefs about skeptical hypotheses (e.g., "I am not a Brain-in-a-Vat") are insensitive; if I were a vat, I would still believe I wasn't. However, sensitivity is not closed under known entailment. If I know I see a zebra ($p$), and I know $p$ entails $\neg q$ (it is not a painted mule), sensitivity dictates I know $p$ (if it were a mule, I wouldn't believe it's a zebra) but do not know $\neg q$ (if it were a mule, I would still believe it's not a mule).

  This creates a structural symmetry: the very mechanism that protects ordinary knowledge from skepticism (insensitivity of skeptical hypotheses) simultaneously severs the link between ordinary knowledge and its logical consequences. We retain knowledge of the world but lose knowledge of the falsity of skeptical alternatives entailed by that world. This violates the strong intuition that deduction extends knowledge.

  To mitigate this, Nozick introduces a method-relative closure principle: knowledge is closed under known entailment only if the same method is used. Since deduction constitutes a new method ($M_{ded}$), the question becomes whether belief in $\neg q$ via $M_{ded}$ tracks the truth. Nozick argues it often does, thereby restoring closure for deduction while maintaining sensitivity's skeptical benefits.

  However, this move invites the charge of being ad hoc. If methods are individuated finely enough to save closure, one might ask why the perceptual method itself isn't described differently to track skeptical hypotheses. The restriction appears tailored specifically to rescue ordinary knowledge without conceding to skepticism. Furthermore, method individuation lacks a robust independent criterion; it risks becoming a tool to manipulate tracking verdicts rather than a genuine feature of epistemology.

  Is the price worth paying? Abandoning universal closure is costly, as it fractures the logical coherence of knowledge. However, if closure forces us into skepticism or infallibilism, denying it may be the lesser evil. Nozick's method-relative offer attempts to split the difference. While it saves the phenomenon of deductive knowledge, it relies on a contentious metaphysics of methods. Ultimately, the theory succeeds in preserving fallibilism but at the cost of making knowledge highly fragmented. The price is high, but perhaps necessary if sensitivity is the correct modal condition for knowledge. The method restriction is not fully principled, but it is a pragmatic stabilization of a theory that otherwise yields counterintuitive results regarding ordinary reasoning.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Explanation of Sensitivity and Closure Failure (4 marks)**
      *   *Must:* Correctly define sensitivity and demonstrate why it fails for entailed propositions (e.g., Not-Mule) while holding for base propositions (Zebra).
      *   *Typical Failure:* Students define sensitivity but fail to show exactly why the entailed proposition fails the condition while the base proposition passes.

  2.  **Analysis of Structural Symmetry (4 marks)**
      *   *Must:* Articulate how the sensitivity failure blocks skepticism but simultaneously threatens ordinary knowledge of entailed claims (the "cuts both ways" point).
      *   *Typical Failure:* Students treat skepticism and ordinary closure as separate issues rather than two sides of the same sensitivity coin.

  3.  **Articulation of Method-Relative Closure (4 marks)**
      *   *Must:* Explain Nozick's specific fix: closure holds only relative to methods, and deduction counts as a new method.
      *   *Typical Failure:* Students claim Nozick denies closure wholesale without mentioning the method-relative restriction.

  4.  **Evaluation of "Ad Hoc" Charge (4 marks)**
      *   *Must:* Critically assess whether the method restriction is principled or merely a patch to save intuitions, referencing method individuation.
      *   *Typical Failure:* Students assert it is ad hoc without explaining *why* (e.g., lack of independent criteria for method individuation).

  5.  **Verdict on Theoretical Price (4 marks)**
      *   *Must:* Take a stance on whether abandoning universal closure is worth the benefit of avoiding skepticism, justifying the value judgment.
      *   *Typical Failure:* Students describe the debate without committing to whether the theoretical cost is justified.

  \answer{Critique of method individuation}
