      *   *Camp B (Exclusionist):* Accepts Supervenience & Closure. Insists Overdetermination reasoning *does* apply (or that exclusion follows regardless). "Inheritance" is just a label for the fact that the physical does the work; calling it mental causation is misleading unless reduced.
      *   *Agreed Claims:* Both are physicalists (mostly). Both accept Causal Closure of the Physical (CCP). Both accept Supervenience (S). Both reject systematic overdetermination (like two shooters). Both agree you can't hold the physical fixed and vary the mental (given physicalism).
