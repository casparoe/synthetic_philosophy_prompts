answer: |-
  **JOINT STATEMENT ON THE CAUSAL EXCLUSION ARGUMENT**
  **Seminar on the Metaphysics of Mind**
  **Adversarial Collaboration: Camp A (Nonreductive Physicalism) & Camp B (Exclusionism/Reductionism)**

  ### I. Agreed Claims

  The undersigned camps, despite their opposing conclusions regarding the status of mental causation, agree on the following premises and diagnostic claims. Each claim is formulated such that, prior to this collaboration, at least one camp would have disputed its precise wording or implication.

  1.  **Causal Closure of the Physical (CCP):** Every physical event that has a cause has a sufficient physical cause at the time it occurs. We agree that positing physical effects without sufficient physical causes violates the methodological naturalism required by our shared physicalist framework.
  2.  **Supervenience of the Mental:** There can be no difference in mental properties without a difference in physical properties. We agree that this dependency relation is non-negotiable for any form of physicalism.
  3.  **The Impossibility of Holding the Physical Fixed:** Given Claim 2, it is metaphysically impossible to vary the mental properties of a system while holding its physical properties fixed. We agree that any counterfactual analysis of mental causation must respect this constraint; "holding the physical fixed" while "removing the mental" is not a live option for evaluating causal claims within physicalism.
  4.  **The Diagnostic Role of the Two-Bullets Case:** The case of two independent shooters firing simultaneously (systematic overdetermination) successfully identifies a *problematic* form of causal redundancy. We agree that if mental and physical causes were related in the same way as two independent shooters, the mental cause would be excluded.
  5.  **The Limit of the Two-Bullets Case:** The Two-Bullets case does *not* settle whether the mental/physical relation constitutes overdetermination. We agree that the Two-Bullets case involves *independent* sufficient causes, whereas the mental/physical relation involves *metaphysically dependent* sufficient causes. Whether dependence mitigates exclusion is the precise point of contention, not the definition of the Two-Bullets scenario itself.
  6.  **The Target of the Argument:** The exclusion argument specifically targets *irreducible* mental properties causing *physical* effects. We agree that if mental properties are identical to physical properties, the argument does not generate an exclusion problem, and if mental properties cause only other mental properties, the problem is displaced but not solved (due to the supervenience of the mental effect).

  ### II. Disagreements

  The following table isolates the precise points of divergence. Each camp has formulated its position to maximize clarity rather than compromise.

  | Disagreement | Camp A (Nonreductive Physicalism) | Camp B (Exclusionism) |
  | :--- | :--- | :--- |
  | **1. The Scope of the Exclusion Principle** | The exclusion principle applies only to *independent* sufficient causes. Where one cause metaphysically determines or realizes the other, both can be causally relevant without competition. | The exclusion principle applies to *any* distinct sufficient causes. If the physical cause is sufficient, and the mental cause is distinct (irreducible), the mental cause is excluded regardless of dependence. |
  | **2. The Mechanism of Causal Relevance** | **Causal Inheritance:** Mental properties are causally relevant in virtue of being realized by physical properties. The physical realizer confers causal power *to the mental property*, not merely to the event. | **Causal Identity:** Mental properties are causally relevant only if they are identical to physical properties. What Camp A calls "inheritance" is merely the physical property doing the work while the mental property rides along. |
  | **3. The Status of Mental Generalizations** | Mental-level generalizations (e.g., "Pain causes withdrawal") are projectible and law-like in their own right, capturing patterns that physical-level generalizations miss due to multiple realizability. | Mental-level generalizations are useful heuristics or *façons de parler*, but strict causal laws operate only at the physical level. Mental generalizations are disjunctive summaries of underlying physical laws. |
  | **4. The Meaning of "Genuine Causation"** | "Genuine causation" requires robust counterfactual dependence and explanatory power at the level of description. Identity is not required for efficacy. | "Genuine causation" requires ontological participation in the fundamental causal nexus. If a property is distinct from the physical sufficient cause, it is ontologically idle. |

  ### III. Cruxes and Test Cases

  We identify two primary cruxes where our disagreement turns on specific metaphysical or empirical commitments. For each, we specify a concrete case and record a prediction that commits each camp to a potential falsification condition.

  **Crux 1: Metaphysical Dependence and Overdetermination**
  *   **The Issue:** Does metaphysical dependence (realization/supervenience) block the exclusion inference, or does distinctness alone trigger it?
  *   **Concrete Case:** **The Determinable/Determinate Analogy.** Consider the property *Red* (determinable) and *Scarlet* (determinate). A pigeon pecks at a Scarlet triangle. *Scarlet* is sufficient for the peck. *Red* supervenes on *Scarlet*. Does *Red* cause the peck, or is it excluded by *Scarlet*?
  *   **Camp A Prediction:** We predict that philosophical analysis and scientific practice will confirm that determinables (*Red*) are causally efficacious alongside determinates (*Scarlet*) without problematic overdetermination. If it is demonstrated that determinables are *always* causally excluded by their determinates in fundamental metaphysics, Camp A's position is untenable.
  *   **Camp B Prediction:** We predict that rigorous analysis will show determinables are causally efficacious *only* in a derivative, pragmatic sense, and that in a fundamental causal ontology, the determinate (*Scarlet*) excludes the determinable (*Red*) if they are treated as distinct properties. If it is demonstrated that determinables enter into fundamental causal laws as distinct entities alongside determinates, Camp B's exclusion principle is too strong.

  **Crux 2: Projectibility and Multiple Realizability**
  *   **The Issue:** Is the mental level a distinct causal level justified by projectibility, or a disjunctive summary of the physical level?
  *   **Concrete Case:** **Cross-Species Neural Heterogeneity.** Future neuroscience investigates "pain-avoidance behavior" across humans, octopuses, and synthetic AI.
  *   **Camp A Prediction:** We predict that neuroscience will fail to find a unified physical kind (neural or silicon state) common to all instances of pain-avoidance, yet "pain" will remain a robust, projectible kind for predicting behavior. If a unified physical kind *is* found that subsumes all instances, Camp A's motivation for nonreduction (multiple realizability) collapses.
  *   **Camp B Prediction:** We predict that either (a) a unified physical kind will eventually be found (supporting reduction), or (b) "pain" will be shown to be a disjunctive, non-projective kind that fails to support strict counterfactuals (supporting elimination). If "pain" remains robustly projectible *despite* radical physical heterogeneity with no unifying physical structure, Camp B's demand for reduction obstructs scientific explanation.

  ### IV. Closing Assessment: Substantive vs. Verbal Disagreement

  In reviewing the draft, we addressed whether our dispute over "Causal Inheritance" is merely verbal (a fight over who gets to keep the word "genuine") or substantive (a fight about the structure of reality).

  **Verdict:** The disagreement is **substantive**.

  It is not merely verbal because it entails different truth conditions for causal claims.
  *   For **Camp A**, the statement "The mental property $M$ caused physical event $P$" is literally true even if $M$ is not identical to the physical realizer of $M$. The truth of the claim depends on the realization relation and counterfactual dependence.
  *   For **Camp B**, the statement "The mental property $M$ caused physical event $P$" is literally false (or at best loosely true) unless $M$ is identical to the physical realizer. The truth of the claim depends on property identity.

  Consequently, this is not a dispute about labeling a pre-existing agreement. It is a dispute about whether the causal relation is a single, fundamental relation that tolerates only physical relata (Camp B), or a relation that can be instantiated at higher levels of organization via dependence relations (Camp A). While both camps agree that the *physical event* occurs and that the *mental description* is useful, they disagree on whether the mental property itself is a truth-maker for causal claims. We acknowledge that resolving this requires settling Crux 1 (the metaphysics of dependence) and Crux 2 (the nature of scientific kinds), neither of which can be resolved by stipulation.

  ***

  **Signed,**

  **Camp A Representatives:** [Nonreductive Physicalists]
  **Camp B Representatives:** [Exclusionists]
  **Date:** [Current Date]
