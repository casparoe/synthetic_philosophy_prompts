      *   *Teleological/Functional:* This is the deepest layer. It connects the "Two Questions" to the "Normative" aspect. Why are we calculating this number? In cows, it's profit/efficiency. In humans, it's often explanation of inequality or allocation of resources.

  4.  **Developing the Core Argument (The "Teleological Mismatch"):**
