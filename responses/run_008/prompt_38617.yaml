      *   **Circulatory-Respiratory Criterion:** Death occurs when there is irreversible cessation of circulatory and respiratory functions.
          *   *Claim:* Traditional standard, often linked to the inability to resuscitate.
          *   *Jahi Interval:* She was alive (heart beating, lungs ventilated).
