answer: |-
  This is a fantastic ethical puzzle, and the fact that you are wrestling with it means Maya is already feeling like a real person. The tension you're feeling isn't a bug; it's the engine of your subplot.

  Your intuition about "endorsement" is close, but you are right that it fractures on the Butcher vs. Gala case. Both involve a logo. Both involve "warm glow." The difference isn't the *presence* of endorsement, but the **nature of the exchange**.

  Here are two candidate principles that fit most of your data points. I will lay out how they handle your existing verdicts, where they strain, and what they predict for your Chapter Nine crisis (the anonymous donation and the board seat).

  ### Principle 1: The "Moral Cover" Test (Focus on the Donor)
  **The Rule:** *You may accept resources from bad actors, provided you do not sell them moral legitimacy they haven't earned.*

  This distinguishes between a **Commercial Transaction** (Butcher) and a **Moral Transaction** (Gala).
  *   **The Butcher:** The school buys sausages; the butcher gets a van decal that says "Supplier." This is a receipt. It says, "We do business with everyone who meets health codes." It does not imply the butcher shares the school's vegetarian values.
  *   **The Gala:** The estate owner buys a "Headline Sponsor" slot. This is a halo. It implies, "This man cares about nature." It uses the charity's moral capital to wash the shooter's reputation.
  *   **The Ad Copy:** The writer isn't just taking money; she is manufacturing the moral cover (the ads) herself.

  **Verdicts it keeps:**
  *   **Gala:** Not Fine (Selling a halo).
  *   **Butcher:** Fine (Commercial receipt).
  *   **Ad Copy:** Not Fine (Manufacturing cover).
  *   **Peatland Work:** Fine (Transactional labor, no branding).
  *   **Climate/Union:** Fine (Strategic alliance, not moral validation of oil extraction).

  **Verdicts it wobbles on:**
  *   **The Councillor:** This principle makes her vote harder to justify. By voting for the budget, she legitimizes the lottery money. You'd have to argue she is *enduring* the legitimacy, not *granting* it.

  **Predictions for Maya:**
  *   **Anonymous Donation:** **FINE.** The casino gets a tax write-off (financial), but no moral cover (reputational). The transaction is sterile. Maya keeps her integrity; the casino doesn't get to look good.
  *   **Board Seat:** **NOT FINE.** A board seat implies governance and partnership. It suggests the casino is a *steward* of the community, not just a wallet. It grants them moral authority over how "good" is distributed.

  ***

  ### Principle 2: The "Mission Fidelity" Test (Focus on Maya)
  **The Rule:** *You may compromise on comfort, but never on your ability to tell the truth about the world.*

  This focuses on whether the deal silences Maya or forces her to lie.
  *   **The Ad Copy:** She has to write lies (consumerism is good). **Not Fine.**
  *   **The Gala:** To keep the sponsor happy, she can't criticize the shooting later. Her voice is muted. **Not Fine.**
  *   **The Butcher:** She still serves veggie meals. The butcher's logo doesn't force her to serve meat. **Fine.**
  *   **The Climate/Union:** She uses "stand with workers" language temporarily to secure a larger goal (transition), but doesn't deny climate change. **Fine.**

  **Verdicts it keeps:**
  *   Most of your "Fine" and "Not Fine" buckets.

  **Verdicts it wobbles on:**
  *   **The Councillor:** This actually saves the Councillor. She voted for the budget *after* trying to strip the money. She didn't lie about her opposition; she just accepted the reality of the system to fund the parks.

  **Predictions for Maya:**
  *   **Anonymous Donation:** **FINE.** As long as the anonymity is ironclad, she doesn't have to thank them publicly. She can still criticize the casino in the press while using their money to feed the victims of the casino's addiction.
  *   **Board Seat:** **NOT FINE.** You cannot sit on a casino's foundation board and then publicly call the casino a parasite. You would be bound by fiduciary duty or collegiality to soften your critique. It compromises her voice.

  ***

  ### The Synthesis: How to write Chapter Nine

  Both principles lead to the same dramatic conclusion, which is good for your plot consistency.

  **1. The Anonymous Donation:**
  Maya should **accept** this, but it should feel dirty.
  *   *Why:* It passes both tests. It doesn't grant moral cover (Principle 1) and it doesn't silence her voice (Principle 2).
  *   *The Conflict:* The tension here isn't ethical, it's *psychological*. She is using "blood money." She has to wash her hands of it.
  *   *Dramatic Beat:* She accepts it, but perhaps she isolates the funds. "This money goes *only* to the emergency winter coats. We don't use it for operations." She creates a firewall.

  **2. The Board Seat:**
  Maya should **reject** this.
  *   *Why:* It fails both tests. It grants the casino legitimacy (they are "giving back") and it muzzles Maya (she becomes part of their PR machine).
  *   *The Conflict:* This is where she draws the line. This is where she risks being called a "prig."
  *   *Dramatic Beat:* The casino rep says, "You're turning down food for families because of pride?" And Maya has to say, "No. I'm turning it down because if I sit at that table, I can't speak for those families anymore."

  ### Two New Scenarios to Stress-Test Maya

  If you want to explore the nuance further, try these two situations. They sit right on the fault line between your "Butcher" and "Gala" verdicts.

  **Scenario A: The Volunteer Day**
  The casino offers to send 50 employees to pack boxes at the food bank on a Saturday. They want to wear their company polo shirts.
  *   *Analysis:* This is the **Butcher Van** scenario scaled up. It's labor (good), but it's branding (risky).
  *   *Verdict:* **Conditional Fine.** Maya lets them volunteer, but *no shirts*. They wear food bank aprons. They are workers, not ambassadors. If they insist on the shirts, she cancels. This shows she values the labor but refuses the photo op.

  **Scenario B: The "In-Kind" Donation**
  The casino offers to donate unsold food from their high-end buffet to the food bank, rather than cash.
  *   *Analysis:* This is trickier than cash. Cash is fungible; food is direct. But it makes the food bank dependent on the casino's waste stream.
  *   *Verdict:* **Not Fine (Long term).** Initially, it seems pragmatic (feeding people). But it turns the food bank into the casino's waste management service. It creates a dependency that makes criticism impossible. Maya accepts it once in an emergency, but refuses to make it a contract.

  ### A Note on the "Wobbles"
  Don't fix all your wobbles. The Councillor case *should* feel wobbly. That is the texture of governance vs. activism.
  *   **Maya is an Activist/Administrator hybrid.** She runs the bank (Admin) but fights the town (Activist).
  *   **Admin Maya** takes the anonymous money (keeps the lights on).
  *   **Activist Maya** rejects the board seat (keeps her voice).

  If you let her make different choices based on which hat she is wearing, she won't seem inconsistent; she'll seem complex. The principle isn't "Never take dirty money." The principle is **"Never let the dirty money wash my hands."**

  *   **Anonymous Cash:** Hands stay dirty, but voice stays clean. (Accept)
  *   **Board Seat:** Hands get washed, voice gets gagged. (Reject)
  *   **Gala Sponsor:** Hands get washed, voice gets gagged. (Reject)
  *   **Butcher:** Hands stay dirty (meat), but mission stays clean (kids fed). (Accept)

  This distinction allows her to be pragmatic without being a pushover. She takes the resource, but refuses the relationship.
