prompt: |-
  I'm a novelist, about two thirds through a book whose heroine, Maya, runs a food bank in a fading rust-belt town, and a big subplot is the deals she keeps getting offered by people whose values she can't stand — the town's casino company, the family that owns half the farmland and treats its workers terribly, and so on. I don't want Maya to come off as either a pushover or a prig, and I've realized I can't actually write her choices until I know what the real principle is, so I've been road-testing my own gut on real cases and writing down the verdicts. Here they are. A wildlife charity co-running a peatland restoration with a grouse-shooting estate that still burns heather — the charity never says a word about the shooting, they just share the work: fine, even good, that's just gains from trade and I'd think more of them for it. Same charity, but now the estate's owner offers to be headline sponsor of their fundraising gala, logo on everything: not fine, and I feel quite firm about that, which is odd because its the same money from the same man. A vegetarian school cook buying from the town butcher because he's the only supplier who'll deliver before 7am, even though he gets to put "proud supplier to the school" on his van: fine, mostly. A city councillor who campaigned against gambling voting for a budget that includes lottery money for the parks, after her amendment to strip it out fails: I think fine, though I wobble. A climate campaigner signing a joint statement with an oil-workers' union, including some "we stand with workers in the industry" language she'd never say off duty: fine. And a friend of mine who writes fiercely anti-consumerist essays but pays her rent ghostwriting ad copy: not fine, though I want to like her, and Maya happens to have a cousin in exactly that spot.

  So what principle, if any, captures all that? I can half see one — something about not lending your endorsement, as opposed to just trading with people — but it seems to fall appart between the gala (not fine) and the butcher's van (fine), since in both the other party gets to use a bit of warm glow from association with the good guys for their own image. And the case I keep going back and forth on, which Maya faces in chapter nine, so I genuinely need an answer: the casino offers the food bank a large no-strings donation through a donor-advised fund, no banner, no logo, nothing public at all — the money is every bit as usefull as the sponsored kind, it just doesn't cost them any reputation. If you can give me a principle, or two candidates, tell me which of my gut verdicts each one has to overturn, and what it predicts for the anonymous case and for one or two situations I haven't thought of — say, Maya accepting a seat on the casino's "community foundation" board, where she'd have real say over how the grants get spent. It's fine to tell me some of my verdicts are just mood; I'd much rather find out now than in the reviews.
reasoning: |-
  Here's a thinking process that leads to the suggested principles:

  1.  **Analyze the User's Request:**
      *   **Context:** Novelist writing a book about Maya, who runs a food bank in a rust-belt town.
      *   **Conflict:** Maya faces ethical dilemmas regarding funding/partnerships with entities she morally opposes (casino, exploitative farmland owners, etc.).
      *   **Goal:** Define a coherent ethical principle for Maya's choices so she doesn't seem like a pushover or a prig.
      *   **Data Points (User's Gut Verdicts):**
          1.  *Wildlife Charity + Grouse Estate (Work):* Fine/Good. (Collaboration on specific goal, no endorsement of bad practices).
          2.  *Wildlife Charity + Grouse Estate (Gala Sponsor):* Not Fine. (Public endorsement/branding).
          3.  *Veg School Cook + Butcher (Supply):* Fine. (Necessity/Logistics, minor branding on van).
          4.  *Anti-Gambling Councillor + Lottery Budget:* Fine (wobbly). (Pragmatic governance vs. idealism).
          5.  *Climate Campaigner + Oil Union:* Fine. (Solidarity/Coalition building, temporary language compromise).
          6.  *Anti-Consumerist Writer + Ad Copy Ghostwriting:* Not Fine. (Directly enabling the enemy, hypocrisy).
          7.  *Casino + Food Bank (Anonymous Donation):* **The Crucial Test Case.** (Money is useful, no public reputation cost).
          8.  *Casino + Food Bank (Board Seat):* **Secondary Test Case.** (Real say over grants, but implies partnership).
      *   **User's Hypothesis:** "Not lending endorsement vs. just trading."
      *   **Problem:** The hypothesis fails to distinguish between the Gala (Not Fine) and the Butcher's Van (Fine), as both involve some "warm glow" for the bad actor.
      *   **Task:** Identify 1-2 principles that fit most verdicts, note which verdicts they overturn, predict the Anonymous Donation and Board Seat cases, and suggest new scenarios.

  2.  **Deconstruct the Verdicts:**
      *   *Why is the Gala "Not Fine" but the Work "Fine"?*
          *   Work: Transactional, specific outcome (peatland), charity maintains independence.
          *   Gala: Celebratory, branding, implies moral validation of the *person/entity*, not just the project.
      *   *Why is the Butcher "Fine" but the Ad Copy "Not Fine"?*
          *   Butcher: Transactional service (delivery time), core mission (feeding kids) is upheld, branding is minor/incidental.
          *   Ad Copy: The work *itself* is the harm (consumerism). The writer is *making the enemy's weapon*.
      *   *Why is the Councillor "Fine" (wobbly)?*
          *   Systemic necessity. She tried to change it, failed, now must serve constituents.
      *   *Why is the Climate/Oil Union "Fine"?*
          *   Strategic alliance. Shared interest (workers/transition). Temporary rhetorical compromise for greater gain.

  3.  **Drafting Candidate Principles:**

      *   *Candidate 1: The "Instrumentalization vs. Validation" Principle.*
          *   Focus: Are you using them, or are they using you to look good?
          *   Gala: They use charity to look good (Whitewashing). -> Reject.
          *   Work: Charity uses estate for land access. -> Accept.
          *   Butcher: Cook uses butcher for logistics. -> Accept.
          *   Ad Copy: Industry uses writer to sell stuff. -> Reject.
          *   Anonymous Donation: Casino uses charity for tax write-off/internal guilt, but no public validation. -> **Accept?** (Or Reject based on source?)
          *   Board Seat: Casino uses charity for legitimacy. -> **Reject.**
          *   *Weakness:* Doesn't fully explain why the Butcher's van logo is okay but the Gala logo isn't. Scale? Prominence?

      *   *Candidate 2: The "Core Mission Integrity" Principle.*
          *   Focus: Does the action compromise the *ability* to do the good work, or contradict the *message* of the work?
          *   Gala: Distracts from mission, makes mission seem for sale. -> Reject.
          *   Work: Advances mission (peatland). -> Accept.
          *   Butcher: Advances mission (feeding kids). Logo is incidental. -> Accept.
          *   Ad Copy: Contradicts message (anti-consumerism). -> Reject.
          *   Anonymous Donation: Advances mission (feeding people). No public contradiction. -> **Accept.**
          *   Board Seat: Risks mission capture (casino dictates grants). -> **Reject.**
          *   *Weakness:* Might make Maya look too pragmatic (taking dirty money).

      *   *Candidate 3: The "Complicity vs. Contamination" Distinction.*
          *   Focus: Are you *doing* the bad thing, or just touching money that came from it?
          *   Ad Copy: Complicity (doing the bad thing).
          *   Gala: Contamination (branding implies moral equivalence).
          *   Anonymous: Contamination minimized (no branding).
          *   *Refinement:* This feels closer to the user's "endorsement" idea but needs to address the "Butcher" exception.

  4.  **Synthesizing the Best Fit:**

      The tension is between *Pragmatism* (getting things done) and *Legitimacy* (what accepting this says about you).
      The Butcher vs. Gala distinction is key.
      *   Butcher: The transaction is *for* the mission (food). The branding is a receipt.
      *   Gala: The transaction is *for* the donor (prestige). The charity is the product being sold.

      *Principle A: The "Means vs. Marketing" Test.*
      *   Is the bad actor paying for *outcomes* (good) or *image* (bad)?
      *   If they pay for the work (Peatland, Food Bank anonymous), it's okay.
      *   If they pay for the glow (Gala, Van Logo?), it's risky.
      *   *Wait, the Van Logo was "Fine".* Why? Because it's functional advertising for the *supplier*, not moral validation of the *school's values*. The Gala logo implies the Estate Owner is a Guardian of Nature. The Van logo implies the Butcher delivers food.
      *   *Correction:* It's about **Moral Cover**.
      *   Gala = Moral Cover for the shooter.
      *   Van = Commercial Advertisement for the delivery service.
      *   Ad Copy = Creating the demand for consumerism.

      *Principle B: The "Agency and Optics" Framework.*
      *   1. Does this compromise my agency? (Board seat = Yes, Anonymous = No).
      *   2. Does this grant moral legitimacy to the harm? (Gala = Yes, Anonymous = No).
      *   3. Is the harm incidental or central to the transaction? (Butcher = Incidental to feeding kids, Ad Copy = Central to the work).

      Let's refine this into two distinct options for the novelist.

      *   **Option 1: The "No Moral Cover" Principle.** (Focus on the Bad Actor's gain).
          *   You can take resources, but you cannot sell legitimacy.
          *   Distinguishes Gala (selling legitimacy) from Butcher (selling sausages/delivery).
          *   Distinguishes Anonymous (no legitimacy gained) from Gala.
          *   *Verdict on Anonymous:* Accept.
          *   *Verdict on Board:* Reject (gives legitimacy + compromises agency).
          *   *Overturns:* Maybe the Butcher? (Does the van logo give moral cover? User said "Fine". Maybe because it's small print?)

      *   **Option 2: The "Mission Fidelity" Principle.** (Focus on Maya's Integrity).
          *   Does this action make it harder to tell the truth about the world?
          *   Ad Copy: Lies (saying consumerism is good).
          *   Gala: Lies (implying Shooter cares about nature).
          *   Anonymous: Truth neutral (Money feeds people).
          *   Board: Lies (implying Casino cares about community welfare).
          *   *Verdict on Anonymous:* Accept.
          *   *Verdict on Board:* Reject.
          *   *Overturns:* The Councillor (wobbly). This principle makes that harder to justify.

  5.  **Developing the Response:**

      *   **Acknowledge the difficulty:** This is a classic "dirty hands" problem in ethics.
      *   **Analyze the "Butcher vs. Gala" paradox:** This is the crux. The difference is *proportionality of endorsement*. The van logo is a receipt; the gala logo is a halo.
      *   **Propose Principle 1: The "Legitimacy Exchange" (or Moral Cover).**
          *   Core: You can trade goods/services, but you cannot trade moral authority.
          *   Fits: Gala (No), Work (Yes), Ad Copy (No - selling authority), Anonymous (Yes).
          *   Board Seat: No (Sells authority).
          *   Overturns: None really, clarifies the Butcher (commercial vs moral).
      *   **Propose Principle 2: The "Operational Independence" (or Agency).**
          *   Core: Can I fire them tomorrow without my mission collapsing or my voice being muted?
          *   Fits: Work (Yes), Anonymous (Yes), Ad Copy (No - financial dependence/hypocrisy), Board (No - structural entanglement).
          *   Overturns: The Councillor (she lost agency when the vote failed, but still voted).
      *   **Address the Anonymous Donation:** This is the pivot. Under "Legitimacy," it's safe. Under "Independence," it's safe *unless* it becomes a large % of budget.
      *   **Address the Board Seat:** High risk. Implies partnership.
      *   **New Scenarios:**
          *   *Volunteer Day:* Casino employees volunteering at the food bank wearing branded shirts. (Legitimacy risk).
          *   *In-kind donation:* Casino donating expired food vs. cash. (Direct utility vs. PR).

  6.  **Refining the Output:**
      *   Make it actionable for a writer.
      *   Be honest about where the principles strain (the "wobbles").
      *   Ensure the distinction between "Commercial Association" (Butcher) and "Moral Association" (Gala) is clear. That solves the user's specific confusion.

      *Self-Correction on the Butcher:* Why is the van logo okay? Because it says "Proud Supplier," not "Proud Partner in Education." It's a vendor relationship. The Gala says "Headline Sponsor," implying shared values.
      *Key Distinction:* **Vendor vs. Patron.**
      *   Vendor (Butcher): I pay you, you give goods. Logo is a receipt.
      *   Patron (Gala): You give money, I give prestige.
      *   Anonymous Patron: You give money, I give nothing but tax receipt.

      *Let's build the principles around this.*

      *   **Principle 1: The "Vendor, Not Partner" Rule.** (Focus on relationship structure).
      *   **Principle 2: The "Truth-Telling" Rule.** (Focus on narrative integrity).

      *Decision:* I will present two frameworks. One focused on **Legitimacy (What do they get?)** and one on **Integrity (What do I become?)**.

      *   **Framework 1: The Moral Cover Test.** (What they get).
          *   Did they buy a halo?
          *   Predicts: Anonymous = OK. Board = Not OK.
      *   **Framework 2: The Complicity Test.** (What I do).
          *   Am I doing their work for them?
          *   Predicts: Anonymous = OK. Board = Not OK (governing their charity).

      *Wait, I need to check the "Ad Copy" verdict.*
      *   User says Ad Copy = Not Fine.
      *   Why? Because she is *writing the propaganda*.
      *   This fits "Complicity."
      *   Does it fit "Moral Cover"? Yes, she is providing the cover.

      *Let's finalize the recommendations.*
      *   Highlight the "Vendor vs. Patron" distinction for the Butcher/Gala issue.
      *   Give a clear verdict on the Anonymous Donation (likely OK, but with tension).
      *   Give a clear verdict on the Board Seat (likely NOT OK).
      *   Provide new scenarios to stress-test.

  7.  **Final Polish:** Ensure tone is supportive of the creative process. Acknowledge that ambiguity creates drama. (Maya's wobble *is* the story).

      *(Self-Correction during drafting)*: I should explicitly address the "Butcher Van" vs "Gala Logo" confusion the user mentioned.
      *   Butcher Van: "Proud Supplier." Transactional. Low status.
      *   Gala Logo: "Headline Sponsor." Relational. High status.
      *   The principle is **Status Transfer**.
