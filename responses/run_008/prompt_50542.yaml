answer: |-
  # The Sovereignty of the Present: A Philosophical Reconstruction of the Social Discount Rate

  You have identified a fissure in the bedrock of modern governance. The practice you describe—Regulatory Impact Analysis (RIA) utilizing a Social Discount Rate (SDR)—is not merely a calculation; it is a metaphysical stance regarding time, value, and obligation. As a philosopher working at this boundary, I will not tell you what the economists *say* they are doing, but rather reconstruct the theory that their *actions* commit them to.

  Below, I proceed in stages: first brainstorming the candidate theories you proposed, then evaluating their logical grip on the practice, assessing the institutional coherence, and finally projecting the consequences of a philosophical shift.

  ## I. Brainstorming the Candidate Reconstructions

  We begin by treating the four options you provided not as settled views, but as competing hypotheses for the "hidden engine" of the appraisal apparatus.

  **(a) The Lesser Moral Status Hypothesis**
  *The Theory:* The practice presupposes that a person existing in 2120 is intrinsically less worthy of moral consideration than a person existing in 2024.
  *Plausibility:* This is the most literal reading of the math. If harm $H$ counts for less at time $t+80$, and $H$ is identical in quality, the subject of the harm must be weighed less.
  *Problem:* No official admits this. It violates the fundamental liberal premise of moral equality. If this were the explicit theory, the practice would be politically illegitimate. It is likely a *consequence* the practitioners disavow, rather than the *premise* they hold.

  **(b) The Administrative Borrowing Hypothesis**
  *The Theory:* The practice presupposes nothing about moral status. It merely borrows the market rate of return as a neutral administrative device to ensure capital efficiency.
  *Plausibility:* This explains the "sliding" between rationales you observed. If the goal is simply to prevent the government from wasting money that could earn 5% elsewhere, the ethical status of the future person is irrelevant. The discount is about the *money*, not the *misery*.
  *Problem:* It fails when the "benefits" are non-market goods (lives saved, species preserved). To discount a human life using the rate of return on corporate bonds implies that human welfare is fungible with capital growth. This smuggles ethics back in under the guise of technicality.

  **(c) The Agent-Relative Duty Hypothesis**
  *The Theory:* The practice presupposes that obligations fade with distance. We have duties to the future, but they are weaker than duties to the present, analogous to how we feel less responsibility for a stranger than a kin.
  *Plausibility:* This aligns with human psychology and perhaps a certain contractualist view of society. We can only contract with those we can interact with.
  *Problem:* It struggles with the "opportunity cost" rationale. Opportunity cost is not about the *strength of duty*; it is about *resource scarcity*. Mixing these confuses the *capacity to help* with the *obligation to help*.

  **(d) The Consequentialist Parameter Hypothesis**
  *The Theory:* The practice presupposes aggregative utilitarianism, where the rate is a free parameter used to maximize total welfare, carrying no independent weight.
  *Plausibility:* This fits the Cost-Benefit Analysis (CBA) framework perfectly. The goal is "Net Present Value." The rate is just a variable to solve the equation.
  *Problem:* It is too thin. A "free parameter" must be set by *something*. If the parameter determines the outcome (as the Stern debate proves), it cannot be philosophically neutral. It encodes a specific theory of value over time.

  ## II. Evaluation: Presupposition, Fit, and Underdetermination

  Having laid out the candidates, I must now determine which of these the practice *strictly requires*, which it merely *tolerates*, and where the practice remains *philosophically underdetermined*.

  **1. What is Strictly Presupposed?**
  The practice strictly presupposes **the Sovereignty of the Present**.
  Regardless of which rationale (a, b, c, or d) is invoked, the mathematical structure requires that the valuation locus is *now*. The future does not speak for itself; it must be translated into the currency of the present to be heard. This presupposes that value is not intrinsic to an event at the time it occurs, but is relative to the temporal distance from the decision-maker.
  *Uncertainty Flag:* It is unclear whether this sovereignty is epistemic (we can't know the future) or ontological (the future is less real). The documents slide between these, but the math requires only that the present is the anchor.

  **2. What Sits Comfortably With the Practice?**
  Hypothesis **(b) The Administrative Borrowing** sits most comfortably with the *daily operation* of the office. Officials can go to work, apply the 3% or 7% rate, and tell themselves they are being fiscally responsible without confronting the moral horror of Hypothesis (a). It allows the bureaucracy to function without ethical paralysis. It treats the discount rate as a "price of time" in a market, rather than a "weight of souls."

  **3. Where is the Practice Underdetermined?**
  The practice is profoundly underdetermined regarding **the Moral Status of Future People (Hypothesis a vs. c)**.
  This is the crucial philosophical gap. The same arithmetic result (a 5% discount) can be generated by two rival theories:
  *   *Theory A:* Future people matter less (Pure Time Preference).
  *   *Theory B:* Future people matter the same, but they will be richer, so a dollar helps them less (Growth/ Elasticity), *plus* we can invest money now to help them more efficiently (Opportunity Cost).
  Because the Ramsey formula blends these terms, the official documents can claim they are using Theory B (which is ethically defensible) while effectively enacting Theory A (which drives the high rates). The practice does not force a choice; it allows the ambiguity to persist. This ambiguity is not a bug; it is a feature that protects the institution from ethical scrutiny.

  ## III. The Coherence Question: The Institutional Schism

  You ask whether an office can apply a several-per-cent rate while its government maintains preambles about posterity and an undiscounted law of bequests.

  **The Verdict:** It is a **functional contradiction** masked by **categorical compartmentalization**.

  Logically, the state is asserting $P$ and $\text{not-}P$.
  *   In **Constitutional/Bequest Law**, the state acts as a *Trustee*. A trust creates a right. Rights are deontological constraints; they are not subject to aggregation or efficiency. If I promise my granddaughter a sum, the value of that promise is not determined by the market rate, but by the fidelity of the word. Time does not erode the obligation.
  *   In **Regulatory Analysis**, the state acts as a *Manager*. It is allocating scarce resources to maximize social welfare. This is consequentialist. In this sphere, everything is fungible, and time is a cost.

  **Can they coexist without self-contradiction?**
  Strictly speaking, no. A polity cannot hold that the future is sacred (Constitution) and negligible (Regulation) simultaneously.
  However, they coexist *practically* because they operate in different modalities. The Constitution deals in *rights and promises* (which are timeless). The Regulation deals in *risks and resources* (which are time-bound).
  *Uncertainty Flag:* The contradiction becomes fatal when the "resource allocation" effectively nullifies the "right." If climate policy (regulated by discounting) destroys the habitability of the earth, the Constitutional promise to posterity becomes void. The practice assumes the background conditions of existence will remain stable enough for the legal promise to remain meaningful. If the discount rate licenses existential risk, the two institutions collapse into incoherence.

  ## IV. The Counterfactual: A Sidgwickian Shift

  Suppose we replace the current presupposition with the Sidgwickian view: *The time at which a harm occurs is ethically irrelevant.* Pure time preference is set to zero.

  **1. What happens to the analyses?**
  The Social Discount Rate drops drastically (likely to near the rate of pure economic growth, or lower).
  *   *Mathematical Effect:* The denominator $(1+r)^t$ grows much slower. A harm in 2120 retains significant weight.
  *   *Valuation Effect:* "Tail risks" (low probability, catastrophic future events) dominate the ledger. A potential catastrophe in 100 years outweighs minor costs today.

  **2. What happens to policy conclusions?**
  *   **Spending:** Recommended spending on mitigation skyrockets. The "optimal" carbon tax becomes politically impossible, as it requires the current generation to sacrifice significant consumption for a future they will not see.
  *   **Investment:** Long-term infrastructure becomes prioritized over short-term efficiency. Projects with high upfront costs and distant payoffs (nuclear waste storage, carbon capture) become "rational."

  **3. What institutions must be rebuilt?**
  This is the most critical insight. You cannot simply change the number in the spreadsheet.
  *   **The Budget Cycle:** Current budgets operate on 1-10 year horizons. A zero-discount regime requires 100-year budgeting. The institution of the "Fiscal Year" becomes philosophically obsolete.
  *   **Democratic Mandate:** Elected officials represent current constituents. A zero-discount policy requires sacrificing current voters' wealth for non-voters. The apparatus would need a **Proxy for the Future**—an institutional body (a "Guardian of the Future") with veto power or budgetary authority, insulated from election cycles, to enforce the Sidgwickian view. Without this, the policy is democratically illegitimate.
  *   **Liability Law:** If future harms count equally, liability for long-term damage (nuclear, chemical, carbon) must become near-absolute and perpetual, shattering current corporate limitation structures.

  ## V. Address to the Novelist

  You ask what a reader must be shown for a person in 2120 to carry the same weight as a person today, and why narrative succeeds where arithmetic fails.

  The appraisal apparatus relies on **abstraction**. To discount the future, you must first turn a drowned town into a dollar figure. Once a life is a number, it can be divided by time. Arithmetic thrives on interchangeability; one unit of "future welfare" is the same as another, making it easy to shrink.

  Narrative, however, relies on **presence**. A novel does not ask the reader to calculate the value of a life; it asks the reader to *inhabit* it. For a character in 2120 to carry the same weight as one in 2024 on your page, you must grant them the same **sensory specificity**. The heat on their skin, the texture of their grief, the particularity of their love must be rendered with the same immediacy as the protagonist's. The discount rate exists because the bureaucrat sees the future as a *statistic*. The novelist defeats the discount by making the future a *scene*.

  The implicit theory I have reconstructed suggests that the state views time as a *distance* to be traversed by capital. But your medium reveals that time is a *medium* to be traversed by consciousness. To show the weight of the unborn, do not write about their statistics. Write about their morning. If the reader can smell the rain on their pavement, the arithmetic of the discount rate will shatter against the reality of the prose. The apparatus discounts because it cannot imagine; your job is to make it impossible to look away.
