answer: |-
  You have correctly identified that the "dumb version" (frame axioms) is not the deep problem, and you are equally correct that the Qualification Problem (preconditions) is not your wall. You are standing squarely in front of **The Ramification Problem**, but the specific computational wall you are hitting is **The Relevance Problem**.

  In the literature, these are often tangled under the umbrella of the "Frame Problem," but since you have rightly rejected the syntactic definition of that term, I will give you the precise carving you asked for.

  ### The Carving: Four Distinct Boundaries

  To isolate your problem, we must distinguish it from its three nearest neighbors in logical planning theory.

  1.  **The Qualification Problem (Preconditions):**
      *   *Question:* "What must be true for this action to *succeed*?"
      *   *Example:* The vent motor might be burnt out; the rail might be rusted shut.
      *   *Status:* You ruled this out correctly. This is about the *input* validity of the action.

  2.  **The Frame Problem (Persistence):**
      *   *Question:* "What stays the *same* after this action?"
      *   *Example:* Opening the vent does not change the color of the tomatoes or the price of copper in Shanghai.
      *   *Status:* You tried the "frame axioms" approach (listing non-changes) and found it combinatorially explosive. You are correct: this is the *syntactic* Frame Problem. Most modern logic systems (like Situation Calculus with successor state axioms) claim to have "solved" this syntactically, but that solution assumes you already know which fluents (state variables) exist.

  3.  **The Ramification Problem (Indirect Effects):**
      *   *Question:* "What *else* changes as a causal chain reaction?"
      *   *Example:* Opening vent $\rightarrow$ Airflow $\rightarrow$ Temp Drop $\rightarrow$ Humidity Rise $\rightarrow$ Transpiration Change.
      *   *Status:* **This is your domain.** You are struggling to represent the infinite tail of indirect consequences without explicitly modeling the entire universe.

  4.  **The Relevance Problem (Selection):**
      *   *Question:* "Which of those changes *matter* for my current goal?"
      *   *Example:* I need to cool the tomatoes. The voltage sag on the 12V rail is a real consequence, but it is irrelevant *unless* it drops below a threshold that kills the sensor.
      *   *Status:* **This is your wall.** This is the cognitive bottleneck. As you noted, humans solve this via "isotropy" (ignoring most connections), but computing relevance usually requires evaluating the consequence, which requires computing the consequence. Circular dependency.

  ### The Diagnosis: Relevance-Gated Ramification

  The specific beast you are fighting is **The Relevance Problem** applied to **Ramifications**.

  In the 1980s and 90s, as logicians solved the syntactic Frame Problem (persistence), the focus shifted to what Jerry Fodor and Daniel Dennett argued was the *real* Frame Problem: **How does a system determine which of the infinite available facts are relevant to the current inference without checking them all?**

  Your engineering constraint ("real-time budget") makes this a case of **Bounded Rationality** (Herbert Simon's term). You cannot compute the "true" relevance because that requires omniscience; you must compute "sufficient" relevance under a deadline.

  **Is your version a special case?**
  Yes. The general philosophical Relevance Problem asks, "How is relevance possible at all?" (A cognitive science question). Your version is: "How do we prune the causal graph dynamically under latency constraints?" (An embedded systems question).

  ### Why Your "Obvious Fix" Fails

  You wrote: *"The obvious fix — 'only check the consequences that matter' — is no fix at all, because which consequences matter is exactly the thing I can't figure out how to compute."*

  This is the crux of the **Fodor Frame Problem**. In classical logic, relevance is undecidable without exploring the proof tree. If you explore the tree to check relevance, you have already paid the compute cost you were trying to avoid.

  ### How Engineering Usually Solves This (The "Carving" in Practice)

  Since you are an engineer, you likely won't care about the philosophical stalemate. You want to know how working planners avoid this wall. They do not solve the Relevance Problem; they **circumvent** it by changing the direction of inference.

  1.  **Forward Chaining (Your Current Approach):**
      *   $State \rightarrow Action \rightarrow \text{All Effects} \rightarrow \text{Filter for Goal}$.
      *   *Failure:* You generate infinite effects before filtering. You hit the Ramification/Relevance wall.

  2.  **Backward Chaining (Goal Regression):**
      *   $Goal \rightarrow \text{Required Conditions} \rightarrow \text{Required Actions} \rightarrow State$.
      *   *Success:* You start with "Tomatoes must be < 30°C." You ask, "What lowers temp?" (Vent). You ask, "Can Vent open?" (No rain).
      *   *Why it works:* You never compute the voltage sag because the goal "Temp < 30" does not regress through the "Voltage" variable. The relevance is hard-coded into the regression path.

  3.  **Causal Graphs / Dependency Tracking:**
      *   You pre-compute a static dependency graph (Vent affects Temp, Temp affects Humidity).
      *   At runtime, you traverse only the active paths.
      *   *Risk:* This fails if there are dynamic couplings (e.g., a new device is plugged into the 12V rail that changes the sag threshold).

  ### Where This Answer Might Fail (The Feuds)

  I owe you the uncertainty. Here is where this classification is contested:

  1.  **The "It's Solved" Camp (Logicists):**
      *   Researchers like Murray Shanahan or those working with PDDL (Planning Domain Definition Language) will tell you the Ramification Problem is solved using **causal theories** and **successor state axioms**. They will argue your problem is just "poor domain modeling."
      *   *Why they might be wrong:* They assume a closed world where all variables are known. Your greenhouse is an open system (weather, new plants, degrading hardware). Logic breaks when the variable list isn't fixed.

  2.  **The "It's Impossible" Camp (Cognitivists):**
      *   Fodor argued that because the world is holistic (everything connects to everything), computational relevance is impossible without human-like intuition.
      *   *Why they might be wrong:* They are looking for *general* intelligence. You only need *narrow* intelligence. You don't need to know if the vent affects traffic; you only need to know if it affects *greenhouse variables*.

  3.  **The "Reactive" Camp (Behaviorists):**
      *   Rod Brooks (subsumption architecture) would argue you shouldn't be planning at all. You should have a layer that opens vents when hot, and a layer that closes them when raining, and let them fight it out.
      *   *Why this might fail:* You get limit cycles (vent opens/closes rapidly) or deadlocks without a planner to arbitrate.

  ### A Proposed Term for Your Specific Constraint

  If you need a label for your logs or documentation that distinguishes this from the academic "Relevance Problem," I suggest:

  **Dynamic Ramification Pruning (DRP)**

  *   **Definition:** The runtime selection of indirect effect chains to evaluate, based on current goal salience and compute budget.
  *   **Boundary Case 1 (Success):** The system ignores voltage sag because the "Temp" goal does not trigger the "Power" dependency node.
  *   **Boundary Case 2 (Failure):** A "Black Swan" event occurs where voltage sag *does* matter (e.g., the vent motor stalls due to sag, causing temp to rise), but the pruner excluded it. This is the **Bounded Rationality Risk**.

  ### Summary

  *   **Concept:** The **Relevance Problem** applied to the **Ramification Problem**.
  *   **Distinction:** Qualification is preconditions; Frame is persistence; Ramification is indirect effects; Relevance is filtering those effects.
  *   **Engineering Fix:** Switch from Forward Chaining (simulate action) to Backward Chaining (regress goal). This hard-codes relevance into the search path.
  *   **Uncertainty:** If your environment has dynamic couplings that aren't in your static dependency graph, no amount of logical pruning will save you; you need probabilistic monitoring (e.g., "watch voltage sag even if not planned, just in case").

  You haven't rediscovered a bug in your code; you've rediscovered the boundary between symbolic logic and the physical world. The "wall" is real.
