      *   *Crucial nuance:* The user's position (1) is essentially the "Conjugal View" but they accept (2). This is the "New Natural Law" problem. Many proponents of (1) reject (2). To hold both requires arguing that the *social good* of child-rearing is detached from biological complementarity. This is the soft ground.

  11. **Final Polish:** Ensure the advice is actionable for a novelist (themes, conflict sources) not just a philosopher. (The prompt asks to audit for the novel's sake).

