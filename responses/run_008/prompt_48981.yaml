      *   *Free-Speech Absolutist:* Focus on the slippery slope. If "frame" defines manipulation, then any unpersuaded person claims they didn't "enter the frame," criminalizing rhetoric.

  4.  **Rank by Damage Potential:**
      *   *Highest Damage:* The Digital-Ethics argument about *outcomes* and *capacity*. If the psychological effect is identical and the consent is illusory (ToS), the thesis collapses.
      *   *Medium-High Damage:* The Rhetorician's point on vulnerability (kids, grieving). This attacks the "knowingly" part of the thesis.
      *   *Medium Damage:* The Free-Speech point on subjectivity. If the frame is subjective, the rule is unenforceable.
