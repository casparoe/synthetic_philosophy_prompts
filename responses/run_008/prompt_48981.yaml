      *   **Objection 2 (Rhetorician):** The "Vulnerable Audience" argument.
          *   *Phrasing:* "Kairos," "receptivity," "cognitive load," "parasocial reciprocity."
          *   *Reply:* The artist assumes a standard adult capacity; the exploiter targets *reduced* capacity. The novel waits for the reader; the ad intercepts.
          *   *Thin Spot:* Grieving people read novels to escape. Are they being manipulated?

      *   **Objection 3 (Free-Speech):** The "Subjective Frame" argument.
          *   *Phrasing:* "Heckler's veto," "subjective offense," "marketplace of ideas."
          *   *Reply:* It's not about offense, it's about context. A punch in a boxing ring vs. a punch on the street. Same motion, different contract.
          *   *Thin Spot:* What if the boxer was tricked into the ring?

      *   **The "Nightmare" Question:** This needs to be the one that bridges the gap between the author's intent and the reader's reality. It should be about the *author's* manipulation of the frame itself.
          *   *Idea:* What if the book *pretends* to be something else to get you in the frame? (e.g., Propaganda disguised as fiction).
          *   *Refinement:* What if the "frame" is the manipulation? (e.g., Writing a novel specifically to radicalize people under the guise of entertainment).

