  *(Self-Correction during drafting)*: Make sure I don't let Fricker off too easy. Her "local" check is about the *speaker's* reliability, not necessarily the *process*. If the speaker is a renowned expert, the local check passes. The failure is that the *process* (replication) wasn't done. I need to highlight that Fricker's theory might need expansion to include "procedural norms" as part of the critical stance.

  8.  **Final Polish:** Ensure academic tone, clear headings, and direct engagement with the "reductio" worry. (Proceed to generate output).

  *(Wait, one more thought)*: The prompt mentions Coady and Burge. Coady emphasizes the *necessity* of testimony for knowledge. Burge emphasizes the *a priori* entitlement. I should briefly mention that for Burge, the entitlement is defeasible. The question is: was there a defeater in March? For a layperson, probably not. So Burge *does* imply the layperson was rational to believe initially. I need to own that and explain why it might not be a reductio. (Rationality is about following norms, not guaranteeing truth).

