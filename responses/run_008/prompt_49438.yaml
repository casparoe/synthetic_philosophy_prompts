      *   **Phase 1: Mapping the Testimonial Chain.** (Who spoke when).
      *   **Phase 2: The April Verdict (The Crucial Test).**
          *   Anti-Reductionism (The "Default" Trap).
          *   Global Reductionism (Hume's "Miracle" Block).
          *   Local Reductionism (Fricker's "Checklist" Failure).
      *   **Phase 3: The November Shift (The Debunking).**
          *   How each handles the reversal.
      *   **Phase 4: The Institutional Blind Spot.**
          *   Why individualist epistemology struggles with scientific systems.
      *   **Conclusion:** What the case actually teaches (Hume wins on extraordinary claims, but Institutionalism is the real lesson).

  6.  **Writing - Key Points to Hit:**
      *   Distinguish *justification* from *truth* (Anti-Reductionism defense).
      *   Highlight the "Peer Review Defeater" (Fricker's potential save).
      *   Emphasize Hume's prior probability argument (the strongest reductionist move).
      *   Note that laypeople relied on *second-order* testimony (DOE saying "others failed"), which keeps it in the testimony realm, not direct evidence.
      *   Be honest: Individualist theories treat science like gossip. That's the limitation.

  7.  **Final Review against Prompt:**
      *   Did I map the testifiers? Yes.
