  # JOINT STATEMENT ON THE STRUCTURE OF HARD CHOICES
  **Adversarial Collaboration between Dr. Elena Vance (Trichotomist) and Dr. Marcus Thorne (Parity Proponent)**

  ### I. Agreed Claims
  *The following propositions are endorsed by both parties as the common ground for further inquiry.*

  1.  **Phenomenological Distinctness:** The phenomenology of a "hard choice" (e.g., choosing between a career in law vs. art, or living in the city vs. the country) is distinct from the phenomenology of choice under risk or empirical uncertainty. In hard choices, the difficulty does not primarily feel like a lack of information about the options, but rather a lack of a decisive normative relation between them.
  2.  **Failure of Reductionist Accounts:** Standard models that reduce hard choices to (a) epistemic uncertainty (not knowing the utility) or (b) vagueness/imprecision (the utility is a range) fail to capture the normative force of the deliberation. Specifically, both parties agree that simply assigning a probability distribution or an interval value to the options does not explain why an agent feels permitted to choose either option without feeling they have made an error.
  3.  **The Small Improvement Intuition:** Both parties agree that in paradigmatic hard choices, adding a minute, negligible improvement to one option (e.g., adding $1 to the salary of the lower-paying career) does not immediately render that option determinately better than the other, even though the two options were not judged "equal" prior to the improvement.
  4.  **Existence of Determinate Comparability:** Both parties agree that not all choices are hard. There exist clear cases where values are determinately comparable via the standard relations. For example, suffering intense torture for no gain is determinately worse than suffering a mild headache for no gain. Parity (or the appearance thereof) is not a universal feature of all choice, but a specific feature of conflicting heterogeneous values.
  5.  **Rational Permissibility:** In cases of hard choices, it is rationally permissible to choose either option. Neither party holds that an agent is irrational simply for picking one "par" option over the other, provided the deliberation was sincere.

  ***

  ### II. Table of Residual Disagreements
  *The following table isolates the precise points of divergence. Wording has been negotiated to ensure each description is acceptable to the proponent of that view without requiring the opponent to concede its truth.*

  | Domain of Disagreement | The Trichotomist Position (Vance) | The Parity Proponent Position (Thorne) |
  | :--- | :--- | :--- |
  | **1. Ontology of the Relation** | The relation between options in a hard choice is one of the standard three (Better, Worse, Equal), but the agent lacks the **epistemic precision** to identify which. "Parity" names an **epistemic state** of the chooser (imprecise credence), not a normative relation in the world. | The relation between options in a hard choice is a substantive **fourth normative relation** (Parity). "Parity" names a **metaphysical feature** of the value structure, not merely a limit on the chooser's knowledge. |
  | **2. Source of Normative Force** | The reason for choosing is always **antecedent**. The agent chooses because they believe (perhaps tentatively) that one option is better, or they use a tie-breaking rule where options are judged equal. | The reason for choosing can be **constituted**. In parity cases, the agent's act of commitment itself generates a new reason that was not present prior to the choice. |
  | **3. Definition of "Comparability"** | Two items are comparable if and only if they satisfy the **Trichotomy Thesis** (one is better, worse, or equal). If they do not satisfy this, they are incomparable. | Two items are comparable if they are related by *any* normative relation, including Parity. The Trichotomy Thesis is too narrow to capture the full range of comparability. |
  | **4. Role of the Will** | The will is the faculty of **selection** based on pre-existing normative verdicts. Its role is to execute the verdict of reason. | The will is the faculty of **creation** in hard choices. Its role is to resolve normative indeterminacy by creating a verdict where reason alone underdetermines the choice. |

  **Note on Verbal Dispute:**
  Both parties concede that a portion of the dispute is verbal, specifically regarding **Claim 3 (Definition of "Comparability")**.
  *   **Vance Concession:** If "comparable" is defined simply as "having *some* normative relation," Vance accepts that Parity counts as comparability, but maintains this is a trivial semantic victory that obscures the failure of the Trichotomy Thesis.
  *   **Thorne Concession:** If "comparable" is defined strictly as "admitting of a determinate ranking via Better/Worse/Equal," Thorne accepts that Parity items are "incomparable" by that definition, but maintains this definition excludes rationally significant relations.
  *   **Resolution:** The parties agree to use the term **"Trichotomously Comparable"** for Vance's definition and **"Normatively Related"** for Thorne's definition to prevent further equivocation.

  ***

  ### III. Cruxes and Predictive Thought Experiments
  *The following cruxes represent the live issues that determine which theory offers the superior explanation of practical rationality. For each, we specify an agreed-upon thought experiment and record the divergent predictions.*

  #### Crux 1: The Rationality of Self-Creation
  **The Issue:** Is the role of "will" or "commitment" in hard choices rationally defensible as a source of reasons, or is it merely a psychological coping mechanism for the discomfort of indeterminacy?

  **The Thought Experiment: "The Retrospective Regret Test"**
  *Scenario:* An agent faces a hard choice between Option A (Artist) and Option B (Lawyer). They are on a par. The agent chooses A based on a "commitment to the artistic life." Five years later, no new empirical information has arisen (they know exactly what the life entails), but they feel a pang of regret wondering "What if I had chosen B?"

  **Predictions:**
  *   **Vance (Trichotomist):** Predicts that if the choice was truly rational, the agent should have no *normative* regret, only *causal* regret (e.g., "I wish I hadn't suffered"). If the agent feels they made a mistake, it implies there *was* a fact of the matter they missed. If there was no fact of the matter, the regret is irrational. The "commitment" was just a psychological trick to stop deliberation; it provides no retroactive justification.
  *   **Thorne (Parity Proponent):** Predicts that the commitment *itself* provides retroactive justification. Because the choice was a act of self-constitution, the agent has created a reason to prefer A that did not exist ex ante. Therefore, feeling normative regret (that B might have been "better" simpliciter) is a misunderstanding of the choice structure. The commitment makes A determinately better for *this* agent ex post.

  #### Crux 2: Comparability as a Requirement of Rationality
  **The Issue:** Is the Trichotomy Thesis a requirement of practical rationality (metaphysical assumption), or is it a contingent feature of some values but not others?

  **The Thought Experiment: "The Continuum of Small Improvements" (Variant of the Small Improvement Argument)**
  *Scenario:* Option A (Career 1) and Option B (Career 2) are on a par. We create a series of options A+, A++, A+++... where each is minutely better than the last along one dimension (e.g., salary increases by $1).

  **Predictions:**
  *   **Vance (Trichotomist):** Predicts **Continuity**. There must be a specific point in the series (e.g., A+++) where the option becomes determinately Better than B. If A is not Better than B, and A+ is not Better than B, then by transitivity, A and A+ must be Equal. Vance predicts that denying this leads to irrational cyclical preferences (money pumps). The "zone of parity" is just a zone of ignorance about where the tipping point lies.
  *   **Thorne (Parity Proponent):** Predicts **Non-Continuity / Zone of Parity**. There is a range where A, A+, and A++ are all on a par with B, none are Better, and none are Equal. At some distant point (A+++++), the improvement is large enough to trigger the "Better" relation. Thorne predicts that rational agents will not be money-pumped in this zone because the preference is not transitive in the standard way; the relation is structurally different. The hard choice remains intact through small improvements, only dissolving when the improvement becomes significant enough to change the normative category.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Dr. Marcus Thorne*
  *Date: October 26, 2023*
