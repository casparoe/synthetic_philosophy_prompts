  *(Refining the Crux Predictions)*: Make sure the predictions are falsifiable *in principle* within the thought experiment context.
  *   Crux 1 (Will): The "Retrospective Regret" test.
  *   Crux 2 (Comparability): The "Small Improvement" test.

