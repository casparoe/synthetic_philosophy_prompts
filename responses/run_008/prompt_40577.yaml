      *   Make sure the "Verdict" section clearly states if the argument works under that thesis.
      *   Ensure the final conclusion directly answers the "Rescue Visitor, Sink Classmate" question. (The answer is yes, via Ideal Negative Conceivability + 2D Semantics regarding a posteriori necessity).

  8.  **Drafting the Content (Mental Check of the "Separation"):**
      *   *Visitor (Zombies):* Needs C $\to$ P to hold for Phenomenal/Physical distinction. Chalmers argues this is an *a priori* conceptual gap. So Ideal Negative Conceivability works.
      *   *Classmate (Goldbach):* Needs C $\to$ P to hold for Math. But Math is *a priori*. If $\neg$Goldbach is false, it is *a priori* false. Ideal reflection rules it out. So Ideal Negative Conceivability fails for the classmate.
      *   *Result:* The Visitor is saved (if Chalmers is right about consciousness), the Classmate is sunk.
      *   *Caveat:* If Physicalism is true via a posteriori necessity (like Water), the Visitor also sinks. The response must highlight this dependency.

  9.  **Final Review against constraints:**
      *   Did I cover all dimensions? Yes.
