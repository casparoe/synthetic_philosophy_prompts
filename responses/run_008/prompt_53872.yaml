      *   **Multiple Drafts Model (MDM):** No single moment of consciousness. Content is revised continuously. "Consciousness" is a functional status, not a metaphysical event. The distinction between Stalinesque (editing before experience) and Orwellian (editing memory after experience) is empty because there's no fact of the matter about *when* the experience happened to be edited before or after.
      *   **Dennett's Indistinguishability Claim:** For any behavioral report, you can tell a Stalinesque story or an Orwellian story. Since we only have access to reports (and neural data which is also interpretable), there is no empirical way to decide which happened. Therefore, the distinction is meaningless.

