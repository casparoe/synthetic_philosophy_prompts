      *   *Wait, I need to make sure the predictions diverge.*
      *   If CT says "Experience is fixed at $t_0 + 100ms$" and Shout is at $t_0 + 300ms$, CT says Experience = Yellow. Report might be Red due to conformity.
      *   If MDM says "Experience is the final draft," and Shout influences the draft, Report = Red (and this *is* the experience).
      *   *The Problem:* How do we distinguish "Experience = Yellow, Report = Red (lying/confused)" from "Experience = Red"?
      *   *This is the crux.* The prompt asks me to construct the case, then admit it fails.

      *   *Let's refine the scenario to be very specific about the "Probe".*
      *   **Scenario:** "The Delayed Label."
