      *   *Interference:* 300ms *after* the cough, the friend whispers "steal" or "loan".
      *   *Report:* Subject is asked immediately: "What did you hear him say?"
      *   *CT:* If the conscious experience of the sentence was finalized before the whisper, the whisper shouldn't alter the *auditory experience* of the missing word, only the guess. If the experience wasn't finalized, the whisper alters the experience. CT says there's a fact about when it finalized.
      *   *MDM:* The "experience" of the word is constituted by the best draft available at the time of reporting. The whisper is just another input into the draft.
      *   *This feels a bit like Color Phi.* I need to avoid that.
      *   *Let's go with the "Retroactive Color" idea but in a dynamic context.*
      *   *Scenario:* "The Traffic Light Transition."
