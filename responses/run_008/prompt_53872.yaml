      *   *Key Philosophical Term:* "Operationalism." Dennett is accusing CT of positing something operationally undefined.
      *   *Seminar Partner Point:* Make sure to explicitly address the "timing" objection. The key is that *any* timing relies on a marker of consciousness, which is what's in dispute.

  8.  **Final Polish:**
      *   Make the distinction between Stalinesque (editing before the show) and Orwellian (editing the history books after the show) clear in the context of the specific example.
      *   Ensure the conclusion empowers the student to write their essay (giving them arguments, not just answers).

  *(Self-Correction on the Thought Experiment)*: A potential weakness in the Barista example is that it looks like simple memory overwriting. I need to emphasize the *phenomenal* claim. The CT claims there is a *what-it-is-like* moment. The MDM says the *what-it-is-like* is distributed. I should frame the report question to ask about the *experience*, not just the fact. "What did you *hear* me say first?" vs "What did I say?"

