  **Workshop Proposal Draft**

  **Title:** The Status of Locality in the Best-System Analysis: A Dilemma for Humean Supervenience in Bell-Type Worlds

  **1. The Question**
  The Best-System Analysis (BSA) posits that laws of nature are nothing over and above the theorems of the deductive system that best balances simplicity and strength when summarizing the totality of particular facts (the "mosaic"). [Confidence: High – This is the standard Lewisian formulation.] In classical contexts, this balance appears to naturally privilege local dynamical laws, where the state of a small region fixes its immediate future. [Confidence: Medium-High – This is intuitively robust for classical mechanics, though "locality" is rarely explicitly defined as a virtue in BSA literature.] However, in a world exhibiting Bell-type correlations, the mosaic contains nonlocal statistical dependencies. [Confidence: High – Empirical consensus on Bell violations.]

  The central question of this project is: **Is locality a systemic virtue internal to the process of systematization (e.g., syntactic simplicity), or is it a substantive metaphysical commitment imported from outside the mosaic?** [Confidence: Medium – This is the core philosophical pivot; it frames the novelty of the project.] If the former, the BSA should objectively select the system that best summarizes the data, even if it requires nonlocal axioms. If the latter, the Humean risks smuggling in a governing conception of law—preferring local laws because they *feel* like laws—thereby undermining the claim that laws merely supervene on facts. [Confidence: High – This accurately captures the tension between descriptive and prescriptive accounts of lawhood.]

  **2. The Gap in Current Literature**
  Standard Humean accounts often address quantum mechanics by arguing that the wavefunction can be understood as a codification of the mosaic, or by adjusting the notion of "simplicity" to accommodate configuration space. [Confidence: Medium-High – Reflects common strategies in contemporary metaphysics of physics.] However, these responses often treat the preference for locality as a settled matter of mathematical convenience rather than examining its status as a theoretical virtue. [Confidence: Medium – This is a charitable reading; some authors do discuss this, but the specific "internal vs. external" distinction is less common.] Conversely, anti-Humean positions typically assume laws must govern, taking locality (or its violation) as a feature of the governing machinery itself, leaving the Humean specific challenge of *systematization* unaddressed. [Confidence: High – Anti-Humeans generally focus on ontology/governance rather than systematization virtues.] Consequently, neither side has fully isolated whether the resistance to nonlocal Humean laws is a matter of logical systematization or metaphysical prejudice. [Confidence: Medium – This is the claim of novelty; it requires verification against recent workshop proceedings.]

  **3. Methodology**
  The project will construct a simplified toy model of a Bell-type world. [Confidence: High – Standard methodology in this subfield.] We will define two candidate deductive systems for this mosaic:
  1.  **System L (Local):** Axioms restricted to local beables, requiring additional complexity (e.g., hidden variables or stochastic rules) to match the mosaic's correlations.
  2.  **System N (Nonlocal):** Axioms defined over configuration space or involving action-at-a-distance, achieving high strength with potentially lower syntactic complexity. [Confidence: High – These represent the standard Bohmian vs. Local Hidden Variable trade-off.]

  The analysis will compare the "cost" of nonlocality in System N against the "cost" of complexity in System L. [Confidence: High.] Crucially, the project will not attempt to solve the measurement problem but will instead treat the mosaic as fixed and ask which systematization wins under different definitions of "virtue." [Confidence: High – This keeps the scope manageable.] We will explicitly test whether adding a "locality constraint" to the virtue metric changes the winner, and if so, whether that constraint can be justified without reference to non-Humean governance. [Confidence: Medium-High – This is the crux of the argument.]

  **4. Success Criteria**
  The project succeeds if it clearly delineates the dilemma: showing that a consistent Humean must either accept nonlocal laws as the "best" system or admit that their definition of "best" relies on non-Humean intuitions about how laws ought to behave. [Confidence: High – This is a binary philosophical outcome.] It fails if it turns out that locality can be rigorously defined as a syntactic virtue (e.g., derivative of simplicity) independent of metaphysical commitment, thereby dissolving the dilemma. [Confidence: Medium – It is possible a technical definition of syntactic locality exists that I am unaware of.]

  **5. Scope and Feasibility**
  This is a single-authored conceptual project scheduled for six months. [Confidence: High.] It relies on argumentative clarity and the analysis of existing toy models rather than new physical derivations. [Confidence: High.] The author's background in condensed-matter physics ensures fluency with the physical models (Bell inequalities, configuration space), while the last three years of philosophical study provide the necessary metaphysical framework. [Confidence: High.] The output will be a paper suitable for a specialized workshop on laws of nature or foundations of physics, avoiding the need for extensive formal logic development. [Confidence: High – Realistic assessment of output.]

  ***

  ### Author's Confidence & Critique Memo

  **Epistemic Texture of the Draft**
  Per your request, I have annotated the substantive claims above with confidence levels. These reflect my assessment as an AI based on the current philosophical landscape up to my knowledge cutoff.

  *   **High Confidence:** Claims regarding the standard definitions of Humean Supervenience, the nature of Bell correlations, and the general structure of the Best-System Analysis. These are settled definitions in the field.
  *   **Medium-High Confidence:** Claims regarding how Humeans currently handle QM (e.g., wavefunction as codification). While generally accurate, specific authors may nuance this differently.
  *   **Medium Confidence:** Claims regarding the *novelty* of the "internal vs. external virtue" distinction. This is the most critical area for your own reading.

  **The "Least Sure" Point**
  The point I am **least sure of** is in **Section 2 (The Gap)**: *"Consequently, neither side has fully isolated whether the resistance to nonlocal Humean laws is a matter of logical systematization or metaphysical prejudice."*

  **Why you need to press here:**
  There is a significant body of work on Humeanism and Quantum Mechanics (e.g., by Loewer, Callender, Bhogal, and others) that discusses "natural properties" and the "language of the system." It is possible that the distinction you are drawing between "internal syntactic virtues" and "imported metaphysical commitments" has already been debated under the guise of the *Naturalness Constraint* or the *Language Relativity* objection.
