  I'm a software developer with no math background beyond school, but for the past year I've been trying to teach myself the parts of mathematics that seem genuinely strange, and I've gotten stuck on something. I worked through the idea of different sizes of infinity, and I thought I understood Cantor's diagonal argument: whatever list of real numbers you hand me, I can build a real number that isn't on it, so there are strictly more reals than naturals. Then I watched a long video about something called Skolem's paradox, and now I no longer know what I understood. The presenter put it roughly like this: "There's a theorem, the downward Löwenheim–Skolem theorem, saying that any consistent first-order theory with infinite models, including the standard axioms of set theory, has a countable model. So imagine a countable model of those axioms. Inside it sits an object satisfying the definition of the real line, built out of only countably many things, since the whole model is countable. Yet the axioms prove Cantor's theorem, that no pairing matches the naturals with the reals. The resolution is that the diagonal argument never showed the reals are more numerous — only that no pairing can be defined or written down. Whether the reals are countable depends on your point of view, and that's why set theory can't be describing one fixed universe of sets; it's all relative to the model."

  Some of that sounds like it must be right, because the countable-model part is apparently a real theorem, and I even found the phrase about the bijection being "missing from the model" in a few places. But other parts feel like sleight of hand, and I can't tell where the trick happens. Here is what I keep running into when I try to think it through myself. If the axioms prove "there is no bijection between the naturals and the reals," then a model of the axioms should be a world where that's true, full stop. If the model's version of the real line is countable, there's a bijection in some sense — so either it's not really a bijection from the model's point of view, or the proof doesn't say what I thought it says. I also can't decide whether the video's phrase "can be defined or written down" is doing honest work or smuggling in something else, because as far as I can tell the theorem doesn't say anything about definability. And the final leap, from "one model is countable" to "there is no definite universe of sets at all," seems like a much bigger jump than the earlier steps, though maybe that's just because it's philosophical and I'm on even shakier ground there.

  So I'd like an honest audit of the summary. Which claims would a working set theorist accept as stated, which are subtly off, and which are simply wrong? In particular: what exactly does "countable" mean when we say the model is countable, and from whose point of view; what does Cantor's theorem actually guarantee inside the model versus outside it; whether the video's move to "only definable bijections are excluded" is a fair reading or a distortion; and whether the grand conclusion about the relativity of set theory follows from anything correct earlier in the argument. I'm inclined to think the video overreaches, but I honestly can't tell which half to distrust, so please don't just reassure me — show me where the reasoning actually bends. Please write your answer as continuous prose only, no headings, bullet points, bold text, or tables, the way you'd write a long letter to someone who asked a sincere question, and don't send me off to papers I can't read; just explain things directly.
