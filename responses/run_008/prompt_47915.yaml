  The reductionist suggestion that Van Fraassen's Reflection Principle (RP) is derivable from Lewis's Principal Principle (PP) fails upon careful examination. While the two principles often align for rational agents in standard scenarios, they rest on distinct normative foundations—deference to objective modality versus deference to diachronic epistemic coherence—and their constraints diverge in critical cases.

  ### 1. The Admissibility Restriction and the Derivation
  The core of the reductionist argument is that a rational future self's credence will track objective chance, so deferring to the future self (RP) is equivalent to deferring to chance (PP). This derivation breaks down because of the **admissibility restriction** inherent in PP.

  PP states that current credence should match objective chance *only* conditional on admissible evidence. Information about the specific outcome of a chancy process is paradigmatically inadmissible. However, a rational future self will typically possess exactly this kind of inadmissible evidence.

  Consider a lottery draw occurring between the present and the future.
  *   **Current State:** The objective chance of ticket #5 winning is $1/1000$.
  *   **Future State:** The future self observes the draw. If ticket #5 wins, their credence is $1$.
  *   **Application:**
      *   **RP:** If I condition on the proposition that my future credence will be $1$, RP demands my current credence be $1$.
      *   **PP:** If I condition on the proposition that the current chance is $1/1000$, PP demands my current credence be $1/1000$ *provided* I have no inadmissible evidence.
      *   **Conflict:** The proposition "My future credence is 1" entails "Ticket #5 won." This is inadmissible evidence relative to the current chance hypothesis. Therefore, PP *suspends* its constraint in this scenario; it does not mandate a credence of $1/1000$ given this total evidence. RP, however, continues to mandate a credence of $1$.

  Because RP imposes a constraint in cases where PP recuses itself (due to inadmissibility), RP cannot be derived from PP. The reductionist assumption that the future self "updates only on evidence that is admissible" is false for any rational agent who expects to learn the outcomes of chancy events.

  ### 2. Second-Order Chance Cases
  The divergence is further illuminated by second-order chance scenarios, where the current chance is a probability distribution over future chance values.

  *   **Scenario:** Today ($t_0$), a mechanism will tomorrow ($t_1$) fix a die's bias. There is a $0.5$ chance the bias will be $1/6$ and a $0.5$ chance it will be $1/2$.
  *   **PP Recommendation:** PP defers to the current objective chance. The current chance of rolling a six is the expectation of the future chances: $(0.5 \times 1/6) + (0.5 \times 1/2) = 1/3$. PP recommends a credence of $1/3$.
  *   **RP Recommendation:** RP defers to the expected future credence. A rational future self (at $t_1$) will know the fixed bias. Their credence will be either $1/6$ or $1/2$. If the agent's current credence distribution over these future states matches the objective second-order chances, RP also yields $1/3$.
  *   **Divergence:** While the numerical values match for a rational agent, the *source* of the constraint differs. PP binds the agent to the metaphysical structure of chance. RP binds the agent to their own anticipated epistemic trajectory.
  *   **Significance:** If the agent is uncertain about the second-order chances but certain about their future self's rationality, RP dictates credence based on subjective expectations of future credence, while PP dictates credence based on objective second-order chances. If the agent is mistaken about the objective chances but correct about their future self's processing, RP and PP would recommend different values. This shows that RP is a constraint on *epistemic consistency*, whereas PP is a constraint on *alignment with reality*. They are not identical constraints.

  ### 3. The Reverse Derivation
  Can PP be derived from RP? This also fails. RP is essentially diachronic; it requires the existence of a future self to whom one can defer.
  *   **No Future Self:** In a scenario where the world ends immediately after the present moment, or where no future cognitive state exists, RP is vacuous. However, objective chances may still exist, and PP would still mandate that a rational agent's credence align with those chances.
  *   **Undermining Futures:** In cases where future outcomes (known to the future self) would undermine the current chance hypothesis (e.g., a frequency that makes the current chance assignment impossible), the future self's credence will reflect the undermining outcome. RP demands deference to this future verdict. PP, however, demands deference to the *current* chance, explicitly shielding the agent from inadmissible future information. Treating PP as derived from RP would force the agent to violate the admissibility restriction, conflating current modal facts with future categorical facts.

  ### Conclusion
  The reductionist suggestion fails because it overlooks the scope of the admissibility restriction. PP governs the relationship between credence and objective modality, retreating when evidence reveals outcomes. RP governs the relationship between temporal stages of an agent, holding even when the future self knows outcomes. Since RP applies in cases where PP does not (inadmissible evidence), and PP applies in cases where RP does not (no future self), neither is derivable from the other. They are distinct normative principles that can pull in different directions when an agent's expected epistemic future diverges from the current objective chance structure.

