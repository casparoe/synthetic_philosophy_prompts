prompt: |-
  I sit on the clinical ethics committee at a county psychiatric hospital, and next month we have to settle our policy on psychiatric advance directives. The trigger case: a patient, "M.", with recurring psychotic episodes, signed a directive while well instructing that if she ever refuses antipsychotics during an episode, staff should override the refusal and treat her anyway. She even included a clause about what to say in the moment: she wants us to tell her that "the M. who signed this knew you'd be against it." Her lawyer says honoring the directive is exactly what autonomy requires — that its the whole point of a Ulysses contract. Her treatment team is uneasy: the woman in front of them, terrified and refusing, is a person with rights *now*, not a ghost being ruled by her past self. Our state law is no help — it says such directives are "presumptively valid" without saying when the presumption can be rebutted. Draft the committee's decision memo: recommend a concrete policy (honor, refuse, or honor with conditions), give the strongest version of the treatment team's objection a fair run, and take a position on the Ulysses analogy itself — including the wrinkle that Ulysses was giving orders to his crew, not asking a doctor to decide for him, and whether that matters. Also say something about the "tell her that M. of March agreed" clause specifically, since none of us can find any guidance on scripted responses like that anywhere.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a county psychiatric hospital.
      *   **Task:** Draft a decision memo regarding a policy on Psychiatric Advance Directives (PADs), specifically focusing on "Ulysses contracts" (instructions to override future refusal).
      *   **Trigger Case:** Patient "M." signed a PAD while competent, instructing staff to override refusal during psychosis. Includes a specific scripted response clause ("The M. who signed this knew you'd be against it").
      *   **Stakeholders:**
          *   Patient's Lawyer: Argues for strict adherence (Autonomy/Ulysses Contract).
          *   Treatment Team: Uneasy about overriding current refusal/rights of the present self.
          *   State Law: "Presumptively valid" but vague on rebuttal.
      *   **Required Elements:**
          *   Recommend a concrete policy (Honor, Refuse, or Honor with Conditions).
          *   Give the treatment team's objection a fair and strong hearing.
          *   Take a position on the Ulysses analogy (including the crew vs. doctor distinction).
          *   Address the specific "scripted response" clause.
      *   **Tone:** Professional, ethical, nuanced, policy-oriented, suitable for a hospital committee.

  2.  **Determine the Ethical Core:**
      *   **Autonomy (Precedent vs. Current):** The conflict between *precedent autonomy* (the competent past self) and *current autonomy* (the incapacitated but resisting present self).
      *   **Beneficence/Non-maleficence:** Treating the psychosis helps long-term health (beneficence) but forcing meds causes trauma/distress (non-maleficence).
      *   **Trust/Therapeutic Alliance:** How does enforcing this affect the relationship between staff and patient?
      *   **Legal/Policy:** State law says "presumptively valid." The policy needs to define the rebuttal conditions.

  3.  **Evaluate the Options:**
      *   *Option A: Always Honor.* Respects precedent autonomy. Risks traumatizing the patient in the moment. Ignores potential changes in values.
      *   *Option B: Always Refuse.* Protects the current self from coercion. Undermines the purpose of PADs. Violates state law presumption.
      *   *Option C: Honor with Conditions (The Middle Path).* Acknowledges the validity of the PAD but sets safety/clinical guardrails. This is usually the most ethically defensible position in psychiatry.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the bottom line up front. Recommendation: Honor with Conditions.
      *   **Case Context:** Briefly summarize "M." without violating privacy (use the prompt's details).
      *   **Ethical Analysis - The Treatment Team's Objection:** This needs to be robust. It's not just "we feel bad." It's about the moral status of the *current* person. The "two selves" argument (Dresser's critique of Ulysses contracts). The risk of coercion damaging trust.
      *   **Ethical Analysis - The Ulysses Analogy:** Address the prompt's specific wrinkle. Ulysses tied himself to the mast; the crew *rowed*. In medicine, the doctor *is* the crew but also has a fiduciary duty to the *current* patient. The analogy holds for *intent* but fails on *agency*.
      *   **The Scripted Clause:** This is unique. "Tell her M. of March agreed." Is this therapeutic or gaslighting? It risks invalidating her current reality. It needs modification.
      *   **Policy Recommendation:** Concrete steps.
          *   Validity check (was she competent?).
          *   Clinical check (is this the scenario envisioned?).
          *   Safety check (is there immediate danger?).
          *   Modification of the script (focus on care, not argument).
      *   **Conclusion:** Final wrapping.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't sound like I'm dismissing the lawyer. The lawyer is right about the legal presumption.
      *   *Correction:* Acknowledge the legal weight but emphasize clinical discretion as the "rebuttal" mechanism allowed by the "presumptively valid" language.
      *   *Critique:* The Ulysses analogy needs to be precise. Ulysses wanted to hear the Sirens but not act. M. wants to be treated but refuses.
      *   *Correction:* Highlight that Ulysses' crew were not morally responsible for his safety in the same way a psychiatrist is. The doctor has a duty of care to the *present* entity in the bed.
      *   *Critique:* The scripted response is tricky.
      *   *Correction:* Advise against using it verbatim. It sounds adversarial ("I know you're against it"). Suggest a therapeutic translation ("We are following the plan you made to keep you safe").

  6.  **Final Polish:**
      *   Ensure the tone is authoritative yet collaborative.
      *   Check that all prompt requirements are met (Policy, Team Objection, Ulysses Analogy, Scripted Clause).
      *   Verify the "Presumptively Valid" legal standard is respected.

  7.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   *Header:* To CEC, From Ethics Subcommittee, Re: PAD Policy.
      *   *Recommendation:* Conditional Honor.
      *   *Analysis of Objection:* The "Two Self" problem.
      *   *Analysis of Ulysses:* Crew vs. Clinician duty.
      *   *Analysis of Script:* Therapeutic alliance risk.
      *   *Policy Protocol:* 4-step verification.

  8.  *(Post-Drafting Review)*: Does this sound like a real hospital memo? Yes. Does it address the specific "M. of March" line? Yes. Does it tackle the Ulysses crew distinction? Yes. Is the policy concrete? Yes.

  *Self-Correction on the "Scripted Response":* I need to be careful not to ban it outright if the patient finds it empowering, but frame it as "clinically contraindicated if it escalates distress." The policy should allow clinical judgment to override the script if it causes harm.

  *Self-Correction on Ulysses:* Make sure to mention that Ulysses *wanted* to be bound. M. *currently* does not want to be bound. The conflict is the core ethical tension.

