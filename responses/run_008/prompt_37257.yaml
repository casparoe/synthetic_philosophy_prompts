answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee, County Psychiatric Hospital
  **FROM:** Ethics Subcommittee on Advance Directives
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Psychiatric Advance Directives (PADs) and Ulysses Clauses

  ### I. Executive Summary & Recommendation

  The Committee has reviewed the case of Patient "M." and the broader implications for our institutional policy on Psychiatric Advance Directives (PADs), specifically those containing "Ulysses clauses" (instructions to override future refusal of treatment during incapacity).

  **Recommendation:** The Committee recommends a policy of **Honoring with Conditions.**

  We cannot adopt a policy of automatic refusal, as this violates the state statutory presumption of validity and undermines the autonomy of patients during periods of wellness. However, we cannot adopt a policy of automatic honor, as this ignores the fiduciary duty clinicians owe to the *present* patient. We propose a "Substituted Judgment with Safety Guardrails" protocol. Under this policy, M.'s directive is valid, but its execution is subject to real-time clinical verification that the current scenario matches the directive's intent and that enforcement does not pose an immediate risk of severe trauma or physical harm.

  ### II. The Treatment Team's Objection: The "Two Selves" Problem

  The treatment team's unease is not merely bureaucratic; it rests on a robust ethical objection regarding the continuity of personhood. We must give this objection its full due.

  The core argument is that severe psychosis does not merely obscure a patient's judgment; it can temporarily alter their fundamental value structure. The "M." who signed the directive (M. of March) values stability, insight, and long-term recovery. The "M." in the acute episode (M. of November) values safety from perceived persecution and bodily integrity *in that moment*.

  To override the refusing M. of November based on the instructions of M. of March is to treat the current patient as a vessel for the past patient's wishes, rather than a rights-bearing individual in her own right. As bioethicist Rebecca Dresser has argued, a PAD assumes the future self is the same as the past self. In psychosis, this continuity is fractured. If we forcibly medicate a terrified woman because a signature on a page says so, we risk replicating the very dynamics of powerlessness and violation that often contribute to psychiatric trauma. The team argues that autonomy is a *current* capacity, not a historical legacy. To ignore the screaming refusal in the room in favor of a quiet signature in the file is to prioritize abstract autonomy over concrete welfare.

  **Committee Response:** We acknowledge the moral weight of the present self. However, under state law, the presumption of validity places the burden of proof on those wishing to *ignore* the directive. Therefore, the team's discomfort alone is insufficient to rebut the directive. The rebuttal must be based on specific clinical evidence that the *conditions* of the directive are no longer met (e.g., the treatment is no longer effective, or the side effects are now intolerable in a way M. of March could not have foreseen).

  ### III. The Ulysses Analogy: Crew vs. Clinician

  The patient's counsel relies heavily on the "Ulysses Contract" analogy: Ulysses ordered his crew to tie him to the mast and ignore his subsequent pleas to be released when he heard the Sirens. He was wise to bind his future self; the crew was right to ignore his screams.

  **Committee Position:** The analogy is instructive but imperfect, and the distinction matters for policy.

  1.  **The Nature of the Bond:** Ulysses tied himself; the crew merely maintained the ropes. In psychiatry, the clinician must actively administer the intervention (injection, restraint). The clinician is not a passive rope-holder; they are an active agent of bodily intrusion.
  2.  **Fiduciary Duty:** Ulysses' crew owed loyalty to their Captain. A psychiatrist owes a fiduciary duty to the *patient in the bed*. If the patient in the bed is experiencing the intervention as a violent assault, the clinician bears a moral burden that a sailor does not.
  3.  **The Goal:** Ulysses wanted to hear the song without steering the ship. M. wants to be well without feeling coerced.

  **Conclusion on Analogy:** The Ulysses contract justifies the *existence* of the PAD, but it does not absolve the clinician of the duty to assess the *manner* of enforcement. The crew had no medical license; we do. We must ensure that the "tying to the mast" does not become a "drowning." The analogy holds for the *validity* of the instruction, but fails to cover the *clinical discretion* required during execution.

  ### IV. The Scripted Response Clause

  M.'s directive includes a specific instruction: *If she refuses, staff must tell her: "The M. who signed this knew you'd be against it."*

  **Ethical Analysis:** This clause presents a unique risk. While intended to remind the patient of her own precedent autonomy, in the throes of paranoia, this statement may be interpreted as evidence of a conspiracy ("You are colluding with a ghost," or "You admit I am not really me"). It risks invalidating the patient's current emotional reality in a way that is adversarial rather than therapeutic.

  **Recommendation:** The Committee recommends **modifying the execution of this clause.**
  We should not honor the script verbatim if, in the clinical judgment of the attending psychiatrist, it is likely to escalate agitation or paranoia. Instead, the *intent* of the clause (reminding the patient of her prior wishes) should be honored therapeutically.
  *   **Preferred Phrasing:** "We know you don't want this right now. But when you were feeling well, you told us this was the best way to help you get back to yourself. We are following the plan you made."
  *   **Policy:** Scripted responses in PADs are presumptively valid but subject to the same "clinical safety" rebuttal as the treatment itself. If the script causes harm, it may be altered to preserve the therapeutic alliance.

  ### V. Proposed Policy Protocol: "Honor with Conditions"

  To settle the policy for the hospital, we propose the following 4-Step Verification Protocol for all Ulysses-style PADs:

  1.  **Competency Verification:** Confirm via record that the PAD was signed during a documented period of capacity (e.g., M.'s March discharge summary).
  2.  **Scenario Matching:** Confirm the current clinical presentation matches the specific scenario envisioned in the PAD (e.g., "refusal of antipsychotics due to paranoid delusions," not refusal due to new medical contraindications).
  3.  **Benefit/Harm Re-Assessment:** The attending physician must document that the proposed treatment is still medically indicated and that the distress caused by overriding refusal is not likely to result in severe, long-term psychological trauma outweighing the benefit of symptom reduction.
  4.  **Script Flexibility:** Any instructional scripts regarding communication must be reviewed by the attending. If the script is likely to de-escalate, use it. If it is likely to escalate (e.g., triggers paranoia), the clinician must document the rationale for modifying the language while preserving the core message (adherence to the prior plan).

  ### VI. Conclusion

  Patient M.'s directive is presumptively valid under state law, and the Committee recommends we honor it. To do otherwise would render PADs meaningless for the population that needs them most. However, we are not sailors on a ship; we are clinicians in a hospital. We must honor the M. of March without violating the M. of November.

  By adopting the "Honor with Conditions" policy, we respect the legal presumption of validity while retaining the ethical discretion to ensure that the enforcement of the directive remains an act of care, not merely an act of compliance.

  **Vote:** [Pending]
