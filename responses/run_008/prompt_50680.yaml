prompt: |-
  I am a PhD student in philosophy of science, and my department houses a research institute that runs a small internal grant scheme. Twice a year, the institute awards "sustained-line" grants of £8,000–£15,000 to junior researchers pursuing a line of work over several years; applicants may reapply in successive rounds, so the scheme effectively decides which local research programmes to keep feeding and which to starve. The committee is six people, mostly empirical scientists, with me as the resident methodologist; we have one afternoon per round for eight to twelve proposals, every decision needs a one-paragraph justification sent to the applicant, and the institute director signs off on the final list. At present the decisions are made on vibes, and after a seminar I gave, the director has asked me to write a decision procedure grounded in Lakatos's methodology of research programmes — his idea being that we should ask whether a proposal's parent programme is progressing or degenerating rather than trading impressions about "impact." So the rubric should turn the standard apparatus to work: the hard core and protective belt, the positive and negative heuristic, theoretical and empirical progress, degenerating problem shifts, and the question of when a belt repair counts as ad hoc.

  The translation is harder than it sounds, and I want the procedure to be honest about that rather than launder our intuitions through vocabulary. First, the obvious asymmetry: as I understand it, Lakatos himself granted that his methodology mostly adjudicates with hindsight, whereas we have to render verdicts prospectively on a decade of an applicant's future. Second, the ad hocness judgment: whether a new auxiliary postulate is a legitimate belt repair or a fudge is precisely the thing scientists dispute for years, so the procedure has to say who counts as a competent judge and what evidence they should point to. Third, the drought problem: a programme can sit in a long degenerating phase and then turn around — Lakatos made much of Prout's programme, whose central claim seemed refuted by the best atomic-weight measurements for roughly a century before coming right — so a rule that defunds anything degenerating for five years will periodically kill future successes. The procedure should state explicitly where it degrades back into committee judgment, and where the question in front of us is really one of values (say, whether the institute should hedge across several programmes or concentrate) that no methodology can settle.

  Please run the finished procedure on three cases, using plausible invented details where needed: (1) an established programme with a strong past record of novel predictions, now ten years into a run of anomalies and unexplained residuals, asking for a further round; (2) a young programme with no novel predictions to its name, whose applicants argue its heuristic is unusually powerful and that its hard core will only become testable after several more years of work; and (3) a Prout-style case, where the programme's central claim is currently contradicted by the best measurements but keeps generating a steady stream of new sub-problems and refinements. I should confess my own priors: I am inclined to fund case (2) and defund case (1), and I half expect to want case (3) killed on instinct. I would like you to tell me plainly, for each, what the procedure actually yields — including whether it turns out that my priors, not the methodology, were doing the work all along — and to close by saying what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of science.
      *   **Context:** Internal grant scheme (£8k-£15k, "sustained-line"), 6-person committee (mostly empirical scientists + 1 methodologist), 1 afternoon for 8-12 proposals, 1-paragraph justification required.
      *   **Goal:** Create a decision procedure based on Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Constraints/Challenges:**
          *   Must acknowledge the prospective nature (Lakatos was retrospective).
          *   Must address the *ad hoc* judgment problem (who decides?).
          *   Must address the "drought problem" (Prout's case: degenerating programmes can recover).
          *   Must explicitly state where methodology ends and value judgments/committee intuition begin.
          *   Must run the procedure on three specific cases.
          *   Must be honest about whether the user's priors are driving the results.
          *   Must conclude with the procedure's limitations.

  2.  **Deconstruct Lakatos's MSRP for this Context:**
      *   *Hard Core:* Irrefutable by fiat of the proponents.
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, etc.
      *   *Negative Heuristic:* Don't attack the hard core.
      *   *Positive Heuristic:* How to develop the belt to protect the core.
      *   *Progressing:* Theoretical progress (new content) + Empirical progress (some new content corroborated).
      *   *Degenerating:* Only post-hoc explanations, no novel facts, continuous ad hoc adjustments.
      *   *Ad hoc:* Saves the theory but adds no new content/testability.

  3.  **Drafting the Decision Procedure (The "Lakatosian Grant Rubric"):**
      *   *Structure:* Needs to be usable in an afternoon. Needs to fit the 1-paragraph justification constraint.
      *   *Step 1: Reconstruction.* Identify the SRP (Scientific Research Programme). What is the core? What is the belt?
      *   *Step 2: Progress Assessment.* Look at the last funding period. Did they predict something new? Or just explain old anomalies?
      *   *Step 3: Ad Hoc Check.* Is the new proposal just patching holes or opening new eyes?
      *   *Step 4: Prospective Heuristic.* Is there a clear plan (positive heuristic) for the next 3-5 years?
      *   *Step 5: The "Prout Clause" (Drought Management).* Acknowledge that degeneration isn't fatal *if* there's a plausible path to novel facts.
      *   *Step 6: The "Value Gap".* Explicitly mark where the committee must vote based on risk tolerance, not logic.

      *Refining the "Honesty" Constraint:* The prompt asks to be honest that this is hard. The procedure shouldn't pretend to be an algorithm. It should be a structured discussion guide that forces the committee to articulate *why* they think something is progressive or degenerating.

  4.  **Developing the Three Cases:**

      *   *Case 1 (The Aging Giant):* Established, strong past, now 10 years of anomalies.
          *   *Lakatosian View:* Likely degenerating. If the last 10 years were just belt adjustments to save the core without novel predictions, it's a degenerating problem shift.
          *   *User Prior:* Defund.
          *   *Procedure Outcome:* Likely defund, *unless* they can show the anomalies are leading to a specific novel prediction soon.
      *   *Case 2 (The Young Dreamer):* No novel predictions yet, claims powerful heuristic, core testable later.
          *   *Lakatosian View:* Tricky. Lakatos requires *some* empirical progress to call it scientific rather than metaphysical. However, the *positive heuristic* might be strong.
          *   *User Prior:* Fund.
          *   *Procedure Outcome:* Risky. Strict Lakatos might say "no empirical content yet." But a "sustained-line" grant implies building a programme. Needs to pass the "Positive Heuristic" test rigorously.
      *   *Case 3 (The Prout Case):* Core contradicted by data, but generating sub-problems/refinements.
          *   *Lakatosian View:* This is the hard one. Prout was technically degenerating for a long time. But it had a strong heuristic (atomic weights must be integers -> isotopes).
          *   *User Prior:* Instinct to kill.
          *   *Procedure Outcome:* This tests the "Prout Clause." If the refinements are *theoretically* progressive (unifying disparate phenomena) even if empirically lagging, it might survive. But if it's just "the measurement was wrong" without new content, it dies.

  5.  **Running the Procedure (Simulation):**
      *   I need to apply the rubric strictly and see if it aligns with the user's priors.
      *   *Crucial Insight:* Lakatos is notoriously retrospective. Applying it prospectively *requires* judgment. The procedure will likely reveal that the user's priors are actually assessing the *strength of the Positive Heuristic*, which Lakatos values highly.
      *   *Case 1:* 10 years of anomalies = Degenerating shift. Procedure says: Defund (aligns with prior).
      *   *Case 2:* No predictions yet = Metaphysical stage? But if the heuristic is clear, it's "incipient progress." Procedure says: Fund conditionally (aligns with prior).
      *   *Case 3:* Contradicted core = Degenerating. But "steady stream of sub-problems" = Theoretical progress? This is the tension. If the sub-problems are just fixing the weight measurements, it's ad hoc. If they lead to chemistry insights (isotopes), it's progressive. The prompt says "contradicted by best measurements." Procedure likely says: Defund *unless* there is a specific auxiliary hypothesis that is independently testable. (Aligns with instinct to kill, but offers a caveat).

  6.  **Addressing the "Honesty" and "Limitations":**
      *   The procedure cannot eliminate bias.
      *   It cannot solve the "drought" problem definitively (that's a value judgment on risk).
      *   It cannot determine *ad hoc*-ness without consensus on what counts as "novel."
      *   It shifts the debate from "vibes" to "structure," which is useful even if the verdict is the same.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, academic, slightly cynical but constructive (fitting a PhilSci PhD context).
      *   *Section 1: The Procedure.* Keep it actionable. Use Lakatosian terms but define them operationally for the scientists.
      *   *Section 2: The Three Cases.* Apply the procedure. Be critical.
      *   *Section 3: The Verdict on Priors.* Analyze where the methodology agreed or diverged.
      *   *Section 4: Limitations.* What can't this do?

  8.  **Refining the "Ad Hoc" and "Competent Judge" issue:**
      *   The prompt specifically asks: "who counts as a competent judge and what evidence they should point to."
      *   *Solution:* The committee *is* the judge, but they must cite *independent testability*. An adjustment is non-ad hoc if it implies a consequence *other* than the anomaly it was designed to fix.

  9.  **Refining the "Drought" issue:**
      *   Need a specific "Exception Clause." If a programme is degenerating empirically, is it theoretically progressive? If yes, it gets a "probationary" grant.

  10. **Final Review against constraints:**
      *   Did I include the 1-paragraph justification constraint? Yes, build it into the output.
      *   Did I address the prospective vs. retrospective asymmetry? Yes, in the preamble.
      *   Did I run the three cases? Yes.
      *   Did I address the user's priors? Yes.
      *   Did I close with limitations? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Lakatos says X." I need to make sure the *procedure* operationalizes X. For example, instead of "Is it progressive?", the form should ask "List the novel facts predicted in the last period."
  Also, I need to be careful with Case 2. Lakatos might actually reject Case 2 more harshly than the user wants, because a programme without empirical content is arguably metaphysical. I should highlight this tension. It shows the "honesty" the user requested.

  *(Final Polish)*: Ensure the distinction between *theoretical* progress (new content) and *empirical* progress (corroborated content) is clear, as this is key to the Prout case.

