answer: |-
  ### Instructor Notes & Sentence Flag

  **Regarding the Test Sentence:**
  The sentence *"Look, even my nine-year-old figured out Dan was lying, and she only met him twice"* is strong, but "only" is theoretically contentious. In formal semantics, "only" is often treated as a truth-conditional operator (entailment), whereas "even" is a classic Conventional Implicature (CI). In an intro course, treating both as CIs is common, but sharp students may object.
  **Fix:** In the exam instructions, add a parenthetical: *(Note: You may treat "even" and "only" as contributing conventional implicatures for the purpose of this analysis, though you are welcome to note if you think one functions differently.)* This prevents grading headaches while rewarding precision.

  **Regarding the Theoretical Tension:**
  The core distinction between an **A** and a **B** paper lies in the second half. A **B** paper will treat Grice's theory as a monolith: "Grice defined meaning, then he defined implicature, and they work together." An **A** paper will recognize the fault line: Grice's definition of *speaker meaning* is psychological (reflexive intention), but his mechanism for *implicature* is normative/logical (what a cooperative hearer *must* infer). If the hearer infers something the speaker didn't strictly intend (e.g., a specific insult), Grice's system struggles to categorize it. The A paper takes a stance on whether this breaks the theory.

  ***

  ### Final Exam Question: Philosophy of Language

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time accordingly)

  **Prompt:**

  Consider the following utterance made by a speaker (S) to a hearer (H) during an argument about a mutual acquaintance, Dan:

  > *"Look, even my nine-year-old figured out Dan was lying, and she only met him twice."*

  **Part 1: Linguistic Classification (approx. 40 minutes)**
  Identify four distinct types of semantic or pragmatic content contributed by this sentence: (1) a presupposition, (2) a conventional implicature, (3) a conversational implicature, and (4) the main entailment (assertion). For each, specify which word or phrase generates it. Crucially, you must defend each classification using a standard diagnostic test (e.g., the cancellation test, the projection test, or the truth-conditionality test). Do not merely name the test; show how it applies to this specific sentence.

  **Part 2: Theoretical Consistency (approx. 50 minutes)**
  Grice defines *speaker meaning* (non-natural meaning) in terms of reflexive intention: S means something by an utterance only if S intends to produce an effect in H by means of H's *recognition* of that intention. However, conversational implicatures are often described as inferences H works out based on the Cooperative Principle, regardless of S's specific psychological state.

  Using your analysis from Part 1, argue for or against the following claim: **"Grice's account of conversational implicature is inconsistent with his definition of speaker meaning."**
  Focus specifically on the Conversational Implicature you identified in Part 1. If the hearer infers this implicature based on norms of cooperation, but the speaker did not specifically intend *that specific inference* (perhaps they only intended to express frustration, not to insult the hearer's intelligence), does it count as part of what the speaker *meant*? Does the theory hold together, or does it come apart at this junction? Defend your position.

  ***

  ### Model Answer

  **Part 1: Linguistic Classification**
  The sentence contributes multiple layers of meaning. First, the factive verb "figured out" triggers a **presupposition**: that *Dan was lying*. We defend this using the **projection test** (or negation test). If we negate the sentence ("My nine-year-old didn't figure out Dan was lying"), the proposition that Dan was lying remains true. Since it survives negation, it is not an entailment but a presupposition.

  Second, the particle "even" generates a **conventional implicature**. It implies that a nine-year-old figuring this out is unlikely or surprising. This is tested via **truth-conditionality**. If the nine-year-old is actually a genius and it *wasn't* surprising, the sentence feels inappropriate but not strictly false. The truth of the main claim remains intact, suggesting "even" contributes non-truth-conditional content attached to the specific words. (Note: "Only" functions similarly here, implying two meetings is a low number).

  Third, the **entailment** (or assertion) is simply that *the nine-year-old figured out Dan was lying*. If this is false, the whole utterance is false.

  Fourth, there is a **conversational implicature**: *The evidence of Dan's lie was overwhelming, and you (the hearer) should have noticed it.* We defend this using the **cancellation test**. The speaker can explicitly cancel this without contradiction: "...but I know you were busy, so I don't blame you for missing it." Since the inference can be cancelled without rendering the sentence contradictory, it is not semantic content but a pragmatic inference derived from the maxims (likely Quantity and Relation).

  **Part 2: Theoretical Consistency**
  There is a genuine tension in Grice's framework regarding this implicature. Grice's definition of *speaker meaning* requires a reflexive intention: I must intend for you to believe *p*, and I must intend for you to believe it *because you recognized my intention*. However, the mechanism of conversational implicature is often described as a calculation the hearer performs based on the assumption of cooperation.

  In the test sentence, suppose the speaker intends only to express frustration about Dan, but the hearer infers the insult ("You are incompetent for not noticing"). If the speaker did not intend this specific insult, strictly speaking, it fails the reflexive intention test for *speaker meaning*. It is something the hearer derived, not something the speaker meant.

  I argue that this reveals an inconsistency, or at least a significant gap, in Grice's account. If "what is implicated" is determined by what a rational hearer *should* infer (normative), it can diverge from what the speaker *did* intend (psychological). Grice attempts to bridge this by suggesting the speaker intends the hearer to engage in this calculation. But in practice, speakers are often careless. If the theory relies on the speaker's intention to define meaning, but relies on the hearer's inference to define implicature, the two definitions can pull apart. When the hearer's calculated implicature exceeds the speaker's reflexive intention, Grice lacks a clear category for it. It is not "speaker meaning" (no intention), yet it functions exactly like an implicature in conversation. Therefore, the account is not fully consistent; it privileges the hearer's reconstruction in the theory of implicature while privileging the speaker's psychology in the theory of meaning. To fix this, Grice would need to either loosen the intention requirement or admit that some "implicatures" are not strictly "meant."

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Accurate Classification & Testing (4 Points)**
  *   **Must Hit:** Correctly identifies Presupposition ("figured out"), CI ("even"), and Conversational Implicature (obviousness/insult). Applies the correct test for each (Projection/Negation for Presupposition, Truth-Conditionality for CI, Cancellation for Implicature).
  *   **Common Botch:** Confusing Presupposition with Entailment (failing the negation test). Name-dropping "Cancellation" without actually writing out the cancelled sentence to show non-contradiction.
  *   **A vs. B:** B students identify the categories. A students show the *work* of the test (e.g., actually writing the negated sentence).

  **2. Handling the "Only/Even" Nuance (4 Points)**
  *   **Must Hit:** Treats "even" as a CI. Acknowledges that "only" is similar or notes the debate.
  *   **Common Botch:** Claiming "even" changes the truth conditions (i.e., saying the sentence is *false* if the kid is a genius).
  *   **A vs. B:** B students treat "even" as CI dogmatically. A students note that if "even" were truth-conditional, the negation test would look different, showing deeper understanding of the test's logic.

  **3. Identification of the Theoretical Tension (4 Points)**
  *   **Must Hit:** Explicitly states the conflict: Speaker Meaning = Intention vs. Implicature = Hearer Inference/Norm.
  *   **Common Botch:** Summarizing Grice's maxims or defining "reflexive intention" without connecting it to the problem of unintended inferences.
  *   **A vs. B:** **This is the primary divider.** B students describe the two concepts separately. A students explain why they might contradict (the gap between what is intended and what is calculated).

  **4. Application of Tension to the Test Sentence (4 Points)**
  *   **Must Hit:** Uses the specific implicature from Part 1 (e.g., "You should have known") to illustrate the tension. Discusses whether the speaker *must* intend that specific insult for it to count as meaning.
  *   **Common Botch:** Discussing the tension abstractly without referencing the "nine-year-old" example.
  *   **A vs. B:** B students say "This relates to the sentence because the sentence has an implicature." A students say "If the speaker didn't intend the insult inferred from the nine-year-old comment, Grice's definition excludes it, but his implicature theory includes it."

  **5. Coherent Stance/Argument (4 Points)**
  *   **Must Hit:** Takes a clear side (Consistent OR Inconsistent) and defends it.
  *   **Common Botch:** Sitting on the fence ("It depends on how you look at it") without arguing for a specific interpretation of "depends."
  *   **A vs. B:** B students argue "Grice is mostly right but maybe there are exceptions." A students argue for a structural consequence (e.g., "Therefore, speaker meaning cannot be solely defined by intention if implicature is normative").

  **Grade Boundary Note:**
  *   **16-20 (A):** Hits all 5 moves. The theoretical tension is the centerpiece of the essay. Tests are applied mechanically (shown, not named).
  *   **12-15 (B):** Hits moves 1, 2, and 5. Classifies the sentence perfectly but treats Part 2 as a "summary of Grice" rather than a critique of the intention/inference gap.
  *   **<12 (C/D):** Fails the linguistic tests (confuses entailment/presupposition) or fails to address the intention/inference gap entirely.
