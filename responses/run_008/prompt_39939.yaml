  So: take that one-liner apart into the distinct precise claims it could be standing for, from the near-trivial to the genuinely radical, and give each a verdict — trivially true, defensible but contentious, or false. But don't then hand me a menu and let me pick. Commit. Say which reading my mate is actually leaning on, whether any defensible reading gets him his conclusion (or, for that matter, the cryonics company theirs), whether he's even representing Parfit fairly, and what that means for my deposit — take a definite position with your reasons, I'd rather you committed and turned out wrong than hedged. Please write in British English. Also, no typos in your reply — I've given you enough of those for one prompt.
