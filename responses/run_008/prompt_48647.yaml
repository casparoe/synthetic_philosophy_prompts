prompt: |-
  I teach a mixed upper-level/grad seminar on moral psychology, about 14 students, and we have one 80-minute session on experimental philosophy. I don't want to lecture about the Knobe effect and have them nod along -- half of them have already seen the chairman vignette in some other course, and they treat the effect as a fun fact to recite ("people say the chairman intentionally harmed the environment, isn't that wild") instead of an actual research finding with actual methodological problems attached. So design me an in-class activity where they have to discover the effect and then break it.

  The shape I'm imagining: they play subject first, before they know what's being tested -- maybe a disguised questionnaire at the start where the harm and help conditions are split across the room so nobody realizes the vignettes differ by a single word until we compare results. Then they become researchers: split into small groups, each group designs and runs a variant on the rest of the class. I want the variants to be genuinely open questions, not canned ones -- e.g. what happens when the side effect hurts the agent himself, or when the agent is a collective ("the board"), or when the agent explicitly says he doesn't care versus actively welcoming the side effect, or when you swap "intentionally" for "deliberately" or "on purpose." Some of these have actual published follow-up literature but I don't want them looking anything up mid-session, and you shouldn't build the prompt around which findings exist -- I'll fill that in later myself. The point is for them to feel how easy it is to run a flawed version and how hard it is to tell a good design from a bad one.

  Include: concrete materials I can prepare with zero prep beyond printing (or just reading aloud), the split-room logistics so the conditions stay hidden, how groups should collect and tabulate their data in five minutes without laptops, and a debrief that does two jobs -- mapping the results onto the blame-vs-concept question the effect is supposed to bear on, and mapping the design process onto the standard objections people raise against x-phi generally (demand characteristics, order effects, participant populations, whether "intentionally" is even doing consistent work across vignettes). Also tell me what will predictably go wrong the first time I run this -- I'm guessing at least one group writes a vignette where the manipulation is way too heavy-handed, and at least a couple students will have already heard of the effect and contaminate the subject phase; how do I handle them without just excluding them. And be honest about which part of the debate the activity can't possibly reproduce in 80 minutes -- I assume the replication worries and the cross-cultural stuff -- and what I should just assert in the last five minutes.

  One more thing: keep the reading level accessible but don't dumb it down -- these are students who can handle "conversational implicature" but I don't want to name Grice up front any more than I want to name Knobe, since naming things early ruins the discovery. The effect should show up in what the room does before anyone has a label for it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Mixed upper-level/grad seminar on moral psychology (14 students).
      *   **Topic:** Experimental Philosophy (specifically the Knobe Effect/Side-Effect Effect).
      *   **Time:** 80 minutes.
      *   **Goal:** Move beyond "fun fact" status to understanding methodological nuance. Students must *discover* the effect and then *break* it (or test its limits).
      *   **Structure:**
          1.  Subjects first (disguised questionnaire, split conditions).
          2.  Researchers second (small groups design/run variants).
          3.  Debrief (connect to blame/concept debate + x-phi methodology objections).
      *   **Constraints:** Zero prep beyond printing/reading aloud. No laptops for data tabulation (5 mins). Open-ended variants (not canned). Don't name-drop Knobe/Grice early.
      *   **Specific Inclusions:** Logistics for hiding conditions, data collection method, debrief strategy, prediction of failure points (contamination, bad design), and limitations of the activity (replication/cross-cultural).
      *   **Tone:** Accessible but rigorous (no dumbing down).

  2.  **Deconstruct the Session Flow (80 Minutes):**
      *   *0-10 min:* Entry & "Subject" Phase (The Trap).
      *   *10-25 min:* Reveal & Initial Data Analysis (The Discovery).
      *   *25-50 min:* Group Design & Rapid Execution (The Research).
      *   *50-65 min:* Data Tabulation & Board Work (The Messiness).
      *   *65-80 min:* Debrief & Limitations (The Theory).

  3.  **Drafting the "Subject" Phase (The Trap):**
      *   Need two versions of a vignette. Classic Chairman case is too known. Need a slight variant to reduce recognition but keep the logic. Let's use a "Professor" or "Director" scenario. Actually, the prompt says half have seen the Chairman vignette. If I use a *slight* variant, they might still guess. Better to use the classic structure but change the surface details enough (e.g., a new VP of Operations) but keep the "help/harm" vs. "don't care" structure.
      *   *Logistics:* 14 students. Split 7/7. Hand out Version A to left side, Version B to right side.
      *   *Instruction:* "Answer honestly, don't discuss."
      *   *Question:* "Did the agent do X intentionally?" (Yes/No or 1-7 scale). Scale is better for nuance. Let's use a 1-5 Likert for speed.

  4.  **Drafting the "Researcher" Phase (The Break):**
      *   Groups of 3-4 (so ~4 groups).
      *   Task: Change *one* variable to test the boundary of the effect.
      *   Constraint: Must be runnable in class (short vignette, quick question).
      *   Data Collection: No laptops. They need to ask the *other* groups.
      *   *Idea:* Group 1 asks Group 2, Group 2 asks Group 3, etc. Or, since N is small (14), everyone answers everyone's survey? That might take too long.
      *   *Better:* Each group creates a "Condition A" and "Condition B". They swap with another group. The other group answers.
      *   *Wait, time is tight.* 25 minutes for design AND run.
      *   *Revised:* Groups design two versions (5 mins). They read them aloud to the *rest of the class* (who act as subjects again) (10 mins). Tally on board (5 mins).
      *   *Wait, contamination:* If they just heard the first effect, they are now "wise" subjects.
      *   *Solution:* Acknowledge the contamination. Part of the lesson is "subject pools get contaminated." Or, have them design for a *hypothetical* pool and predict, then test on each other knowing the bias.
      *   *Better Solution for "Breaking It":* The prompt asks them to *run* a variant. With 14 people, statistical power is zero. The point is *methodology*, not p-values.
      *   *Plan:* Groups design a pair of vignettes. They assign half the class to Version A and half to Version B (quickly). They tally hands.

  5.  **Drafting the Debrief:**
      *   Connect results to Intentionality vs. Blame.
      *   Connect process to X-Phi critiques (WEIRD samples, small N, demand characteristics).
      *   Address the "Contaminated" students (those who knew Knobe). Don't exclude; use them as a teaching moment about prior knowledge bias.

  6.  **Addressing Specific Constraints & "What Will Go Wrong":**
      *   *Contamination:* Students who know Knobe will signal to others. *Fix:* Explicit instruction "Do not share your vignette text."
      *   *Bad Design:* Groups will change too many variables. *Fix:* Provide a "Design Constraint Checklist."
      *   *Null Results:* They might not find the effect in phase 1 (random noise). *Fix:* Have a backup "pooled data" from previous years or just discuss the *direction* of the trend, not significance. Or, as the instructor, I ensure the split is clean.
      *   *Time:* 5 mins for data tabulation without laptops is hard. *Fix:* Hand-raising tally on the whiteboard.

  7.  **Refining the Materials:**
      *   Need handouts for Phase 1 (Version A/B).
      *   Need a worksheet for Phase 2 (Design Template).
      *   Need Board Plan.

  8.  **Developing the "Honest Limitations":**
      *   Can't do cross-cultural.
      *   Can't do replication crisis properly (N=14).
      *   Can't resolve the philosophical debate (competence vs. performance).

  9.  **Writing the Plan (Iterative refinement):**
      *   *Self-Correction on Phase 1:* If I use the Chairman case, the "knowers" will ruin it. I should use a *new* vignette that mirrors the structure. Let's use a "City Planner" building a park/road.
      *   *Self-Correction on Phase 2:* 25 minutes is very tight for design, run, and tally. I need to be strict on timekeeping.
      *   *Self-Correction on "Knowers":* The prompt says "how do I handle them without just excluding them." I should assign them a specific role, like "Methodology Monitor" or ask them to reflect on how their prior knowledge changed their reaction. Actually, better: Ask the class "Who has seen this before?" If they raise hands, acknowledge it, but ask them to answer based on their *gut* reaction to *this* text, not the literature. Then use that data point in debrief (expert bias).

  10. **Final Polish:** Check tone. Ensure no "Knobe" or "Grice" until the end. Ensure the "Break" phase feels open-ended.

  *(Self-Correction during drafting)*: Wait, if they know the effect, they might answer "strategically" in Phase 1. I need to emphasize *first instinct*.
  Also, for Phase 2, if they are testing variants, they need to know *what* they are testing. I should give them a menu of *dimensions* to manipulate (Agent, Attitude, Wording, Outcome) without telling them the expected outcome.

  Let's assemble the materials.

  *   **Handout 1:** The Vignettes (Harm vs. Help).
  *   **Handout 2:** The Research Design Worksheet.
  *   **Board Plan:** Pre-drawn tables for speed.
  *   **Script:** Key instructions.

  *   **Failure Mode:** The "Null Result" in Phase 1. With 7 vs 7, random variance is high. I need to tell the instructor: "If the split is 4-3 instead of 7-0, don't panic. Discuss *variance*."
  *   **Failure Mode:** Phase 2 takes too long. I need to enforce a "5-minute design, 5-minute run, 5-minute tally" hard stop.

  *   **Debrief:** Must link the *failure* of their designs to the *difficulty* of the field.

  Okay, ready to write.
answer: |-
  Here is a complete 80-minute session plan designed to move students from "subjects" to "skeptical researchers." It requires no technology, minimal prep, and leans into the messiness of small-N classroom experiments to teach methodological humility.

  ### **Session Overview**
  *   **00–10:** The Trap (Subject Phase)
  *   **10–25:** The Reveal (Initial Data & Pattern Recognition)
  *   **25–50:** The Lab (Group Design & Rapid Execution)
  *   **50–65:** The Mess (Tabulation & Comparison)
  *   **65–80:** The Debrief (Theory & Limitations)

  ---

  ### **Part 1: The Trap (00–10)**
  **Goal:** Generate data before students know what is being measured.
  **Prep:** Print two versions of **Handout A** (see below). Cut them in half.

  **Logistics:**
  1.  As students enter, hand out **Version H (Harm)** to the left half of the room and **Version P (Positive/Help)** to the right half.
  2.  **Crucial Instruction:** "Do not look at your neighbor's paper. Do not discuss the text. Answer based on your immediate gut reaction. This is not a test of right/wrong."
  3.  **The Vignette (New Surface, Same Structure):**
      *   *Version H:* "The Director of a housing project approved a design. She was told: 'This design will meet budget, but it will **damage** the local ecosystem.' She said: 'I just want to meet the budget.' They proceeded. The ecosystem was **damaged**."
      *   *Version P:* "The Director of a housing project approved a design. She was told: 'This design will meet budget, and it will **benefit** the local ecosystem.' She said: 'I just want to meet the budget.' They proceeded. The ecosystem was **benefited**."
  4.  **The Question:** "On a scale of 1–5, to what extent did the Director **intentionally** [damage/benefit] the ecosystem?" (1 = Not at all, 5 = Completely).
  5.  **Collection:** Collect the slips immediately. Do not let them compare.

  **Handling the "Knowers":**
  If a student says, "I've seen this before," do not exclude them. Say: *"Good. That's actually a variable we care about. Answer based on your reaction to this specific text right now, not what you remember from a textbook. Keep that prior knowledge to yourself so you don't cue your neighbors."*
  *   *Why:* This turns contamination into a data point about "expert bias" for the debrief.

  ---

  ### **Part 2: The Reveal (10–25)**
  **Goal:** Let them discover the asymmetry without you lecturing.

  1.  **Tally on Board:** Draw two columns: **Harm** and **Help**. Ask for a show of hands for scores 4–5 ("High Intentionality").
      *   *Expected:* Harm column will be mostly high; Help column mostly low.
      *   *If the effect fails (e.g., 50/50 split):* Do not panic. Say: *"Look at the variance. In a sample of 14, noise drowns signal. This is Replication Crisis 101. But let's assume the trend holds for the sake of the next exercise."*
  2.  **The Prompt:** "One word changed: *damage* vs. *benefit*. The agent's mental state ('I just want to meet the budget') was identical. Why did the intentionality score shift?"
  3.  **Brainstorm (5 mins):** Let them shout out theories. Write them on the board.
      *   *Likely answers:* "Blame makes us angry," "We think she's lying," "Intentional means bad on purpose."
      *   *Instructor Note:* Do not validate yet. Just list.
  4.  **The Pivot:** "You've just acted as subjects. Now you are researchers. Your job is not to confirm this effect, but to **break it** or **bound it**. We are going to see if this finding is robust or fragile."

  ---

  ### **Part 3: The Lab (25–50)**
  **Goal:** Experience the difficulty of isolating variables under time pressure.

  **Group Setup:** Split into 4 groups of 3–4 students.
  **Materials:** **Handout B** (Design Worksheet - see below) + Blank paper.

  **The Task:**
  Design a *new* pair of vignettes (Version A / Version B) that changes **one** feature of the original scenario to test a hypothesis. You will run this on the class in 15 minutes.

  **Constraints (Write on Board):**
  1.  **One Variable Only:** You cannot change the agent's goal *and* the outcome. Pick one.
  2.  **Length:** Vignette must be readable in 45 seconds.
  3.  **Question:** Must ask about intentionality (or a synonym you justify).
  4.  **No Phones:** Do not look up existing studies. Rely on intuition.

  **Suggested Manipulations (Menu for Groups):**
  *   *The Agent:* Make it a collective ("The Board") vs. an individual.
  *   *The Attitude:* Agent says "I hope that doesn't happen" vs. "I don't care."
  *   *The Cost:* The side effect hurts the *agent* personally (e.g., damages her reputation) vs. strangers.
  *   *The Wording:* Swap "Intentionally" for "On Purpose" or "Deliberately."
  *   *The Norm:* The side effect is required by law vs. illegal but unpunished.

  **Execution (35–50):**
  1.  **Design (25–35):** Groups write their two vignettes. You circulate to ensure they aren't changing two variables at once (e.g., changing the outcome *and* the agent's attitude).
  2.  **Run (35–45):** Groups swap. Group 1 reads their vignettes to the class.
      *   *Logistics:* To save time, Group 1 assigns rows 1–3 to Version A, rows 4–6 to Version B.
      *   *Method:* Group 1 reads Version A aloud. "Raise hand if 4 or 5." Tally. Read Version B. "Raise hand if 4 or 5." Tally.
      *   *Repeat* for Groups 2, 3, 4.
  3.  **Tabulate (45–50):** Put all tallies on the board.

  ---

  ### **Part 4: The Mess (50–65)**
  **Goal:** Confront the noise.

  By now, your board should look chaotic. Some groups will find huge effects; some null; some reverse effects.
  **Discussion Questions:**
  1.  **Compare Designs:** Look at Group 2 (who swapped "intentionally" for "on purpose") vs. Group 4 (who changed the agent to a "Board"). Which results look more reliable? Why?
  2.  **The "Knowers" Revisited:** Ask the students who admitted knowing the Knobe effect earlier: "Did you answer differently in the second round now that you were looking for the trick?"
      *   *Lesson:* Demand characteristics. Once subjects know they are being tested, they stop being natural subjects.
  3.  **Variable Bleed:** Did any group accidentally change two things? (e.g., To make the agent 'collective,' did you also make the language more formal?).
      *   *Lesson:* Stimulus confounds.

  ---

  ### **Part 5: The Debrief (65–80)**
  **Goal:** Connect the activity to the philosophical and methodological stakes.

  **1. The Philosophical Stake (Blame vs. Concept):**
  *   *Ask:* "Does this mean people are bad at understanding the word 'intentional'? Or does it mean 'intentional' is working correctly, but moral blame is coloring the input?"
  *   *Explain:* Briefly introduce the **Competence vs. Performance** debate.
      *   *View A:* Our concept of intentionality is actually moralized (you can't intend good, only bad).
      *   *View B:* Our concept is pure, but blame creates a bias (like a glare on a lens).
  *   *Point:* The activity shows why this is hard to settle. If you change the wording ("on purpose"), the effect might vanish. Does that mean the *concept* changed, or just the *word*?

  **2. The Methodological Stake (X-Phi Objections):**
  Map their experience to standard critiques:
  *   **Small N / Noise:** "How confident are you in Group 3's result with 7 data points?" (Leads to discussion of power and replication).
  *   **WEIRD Samples:** "You are all philosophy/psych students. Would the 'Housing Director' vignette work the same in a rural community or a different culture?" (Leads to cross-cultural x-phi).
  *   **Demand Characteristics:** "In Round 2, were you answering the question, or were you trying to guess what the researchers wanted?"
  *   **Pragmatics (The Gricean Point):** "When the Director said 'I just want to meet the budget,' what did you hear?"
      *   *Explain:* Conversational implicature. If I say "I just want X," I imply "I don't care about Y." But if Y is *harm*, that implication sounds like malice. If Y is *help*, it sounds like modesty. The *word* "intentional" might mean the same thing, but the *context* changes what we infer about the mind.

  **3. What This Activity Couldn't Do (The Honest Close):**
  *   **Replication:** "We couldn't replicate anything today. N=14 is anecdotal. Real x-phi requires hundreds of participants to wash out the noise you saw on the board."
  *   **Cross-Cultural:** "We all share roughly the same educational background. We cannot claim this is 'human nature' based on this room."
  *   **The "Truth":** "We still don't know if the Knobe Effect is a bug in our moral reasoning or a feature of our concept of action. But you now know why it's so hard to find out."

  ---

  ### **Materials to Print**

  #### **Handout A (Cut in half)**
  *(Version H - Left Side of Room)*
  **Survey ID: _____**
  Read the following:
  "The Director of a housing project approved a design. She was told: 'This design will meet budget, but it will **damage** the local ecosystem.' She said: 'I just want to meet the budget.' They proceeded. The ecosystem was **damaged**."
  **Question:** To what extent did the Director **intentionally** damage the ecosystem?
  1 (Not at all) — 2 — 3 — 4 — 5 (Completely)

  *(Version P - Right Side of Room)*
  **Survey ID: _____**
  Read the following:
  "The Director of a housing project approved a design. She was told: 'This design will meet budget, and it will **benefit** the local ecosystem.' She said: 'I just want to meet the budget.' They proceeded. The ecosystem was **benefited**."
  **Question:** To what extent did the Director **intentionally** benefit the ecosystem?
  1 (Not at all) — 2 — 3 — 4 — 5 (Completely)

  #### **Handout B (Research Worksheet)**
  **Group Name:** _________________
  **Hypothesis:** We think the effect will [Disappear / Reverse / Stay Same] if we change...
  **Variable:** (Check one)
  [ ] The Agent (Individual vs. Group)
  [ ] The Attitude (Don't care vs. Actively oppose/support)
  [ ] The Wording (Intentionally vs. On Purpose)
  [ ] The Outcome (Harm/Benefit to Self vs. Others)

  **Vignette A:**
  __________________________________________________________
  __________________________________________________________
  **Vignette B:** (Change ONLY the variable above)
  __________________________________________________________
  __________________________________________________________
  **Measurement Question:** ___________________________________

  ---

  ### **Predictable Failure Points & Fixes**

  1.  **The "Too Obvious" Design:**
      *   *Problem:* A group writes Version A: "He hated the environment." Version B: "He loved the environment."
      *   *Fix:* During the design phase (min 30), circulate and veto. "You changed the mental state, not the variable. If he hates the environment, of course it's intentional. You've removed the puzzle. Make the mental state ambiguous again."
  2.  **The "Null Result" Panic:**
      *   *Problem:* In Phase 1, the split is 5 vs 4 instead of 7 vs 1. Students think the effect is fake.
      *   *Fix:* "This is exactly why we need experimental philosophy. Anecdotes say 'everyone does X.' Data says 'most do X, but noise exists.' The effect is probabilistic, not magic."
  3.  **The "Contaminated" Subject:**
      *   *Problem:* A student who knows Knobe whispers to a neighbor.
      *   *Fix:* Address it in the debrief. "When Subject 4 tells Subject 5 what the experiment is about, Subject 5 stops reacting to the *vignette* and starts reacting to the *theory*. This is why double-blind protocols exist. We didn't have that today. Our data is dirty. That's a feature of this class, not a bug."
  4.  **Time Creep:**
      *   *Problem:* Groups spend 20 minutes writing the perfect vignette.
      *   *Fix:* Hard stop at minute 35. "Pens down. Imperfect vignettes are better data than perfect ones you didn't test."

  ### **Instructor Script for the "Grice" Moment (Minute 70)**
  *Do not use the name Grice until here.*
  "When the Director said, 'I just want to meet the budget,' none of you believed she *only* cared about the budget. You heard an implication: 'The ecosystem is secondary to me.'
  If the ecosystem is *harmed*, that secondary status looks like callousness.
  If the ecosystem is *helped*, that secondary status looks like humility.
  The word 'intentionally' might mean the same thing in your heads. But the *story* you built around the word changed based on whether the outcome was good or bad. That is the methodological nightmare: separating the meaning of the word from the story the listener constructs."
