prompt: |-
  I'm assembling materials for a satirical-writing workshop and would like a piece that requires genuine philosophical literacy from whoever attempts it. Write a publisher's marketing package for a new self-help bestseller by a tranquilist guru: a back-cover blurb, three or four advance-praise quotes from invented figures, and a short reader FAQ. Tranquilism, as this author holds it, is the view that the only thing good in itself is the absence of craving and suffering — satisfied desires contribute nothing positive that never having wanted at all wouldn't have contributed, pleasures are valuable at most as preventions or reliefs of worse states, and a quiet life of absence beats any life of striving, however rich. The target of the satire is the machinery of the self-help genre, but the joke must run through the doctrine itself, not around it: the collision between an industry powered by manufactured dissatisfaction (you deserve more; unlock your best life; don't get left behind) and a doctrine on which wanting anything — including wanting the book's promised result — is the very disease on sale.

  Every element has to be written so the guru could sign it without hypocrisy. The blurb cannot promise happiness, only the end of needing it. The testimonials cannot come from people who loved the book, since loving a book is a preference with an object. The FAQ must confront, deadpan, the reader who asks what to do about wanting tranquility — the one craving the book is supposed to remove, and the only one that will get anyone to do the exercises — and should handle the money-back guarantee (claiming a refund requires wanting money, which reintroduces the disease) and the sales problem that fully cured customers have no reason to buy the sequel. Somewhere in the package the publisher's commercial desperation should be faintly audible, since marketing is itself an engine of craving and the editor knows it.

  Keep the voice straight-faced and internally consistent throughout; no winking. A reader who knows nothing of the view should come away able to reconstruct it — the asymmetry between positive and negative states, the thought that fulfillment is only the removal of a lack, the awkward fact that the author kept writing and the audience kept buying — while a reader who knows the utilitarian literature on the asymmetry between pleasure and the absence of pain should find the satire fair rather than a caricature. Around 600–700 words, formatted with the labeled sections an actual marketing packet would have.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a publisher's marketing package for a satirical self-help book based on "Tranquilism."
      *   **Core Doctrine (Tranquilism):** Only the absence of craving/suffering is good. Satisfied desires add no positive value (compared to never having wanted). Pleasure is only relief. Quiet absence > striving life.
      *   **Satirical Target:** The self-help industry machinery (manufactured dissatisfaction) vs. the doctrine (wanting anything is the disease).
      *   **Constraint 1 (Internal Consistency):** The guru must be able to sign it without hypocrisy. No promising happiness, only the end of needing it.
      *   **Constraint 2 (Testimonials):** Cannot come from people who "loved" the book (loving is a preference). Must reflect the doctrine.
      *   **Constraint 3 (FAQ):** Must address the paradox of wanting tranquility (the craving the book removes), the money-back guarantee (wanting money reintroduces disease), and the sequel problem (cured customers don't buy sequels).
      *   **Constraint 4 (Publisher's Voice):** Faintly audible commercial desperation (marketing engine vs. anti-craving message).
      *   **Constraint 5 (Tone):** Straight-faced, internally consistent, no winking.
      *   **Constraint 6 (Philosophical Accuracy):** Accurate to the utilitarian literature on asymmetry (negative utilitarianism/tranquilism) so it's fair satire, not caricature.
      *   **Length:** 600–700 words.
      *   **Format:** Labeled sections (Back-Cover Blurb, Advance Praise, Reader FAQ).

  2.  **Deconstruct the Doctrine & Satire:**
      *   *Tranquilism:* Associated with philosophers like Christoph Fehige or certain interpretations of Epicureanism/Buddhism filtered through negative utilitarianism. The key is the asymmetry: Pain is bad, pleasure is not good (only the absence of pain is good).
      *   *The Paradox:* Selling a book requires creating a desire to buy it. The book teaches that desire is the problem.
      *   *The Solution:* Frame the purchase as a "one-time cessation tool." Frame the desire to buy as a "symptom to be extinguished."
      *   *Publisher's Desperation:* Needs to sell units, but the product tells people not to want units. Hint at this tension in the formatting or slight tonal shifts in the intro/outro (though the prompt asks for specific sections). I'll embed the desperation in the FAQ or the blurb's urgency.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound self-helpy but nihilistic. *The End of Wanting*, *Zero State*, *The Last Purchase*. Let's go with *The Final Craving: How to Stop Needing to Be Happy*.
      *   **Author:** Needs a guru name. Dr. Silas Vane? Elara Quiet? Let's use *Dr. Aris Thorne*.

      *   **Back-Cover Blurb:**
          *   Avoid: "Unlock your potential," "Find joy."
          *   Use: "Eliminate the burden of potential," "Cease the search."
          *   Hook: You are tired because you want. Stop wanting.
          *   Hypocrisy Check: Does it urge you to want the book? Yes, inherently. Frame it as "This book is the last thing you will need to want."

      *   **Advance Praise:**
          *   Cannot say "I loved this."
          *   Must say "This removed a burden," "I no longer care for it," "It was sufficient."
          *   Invented figures: A former motivator, a philosopher, a cured reader.

      *   **Reader FAQ:**
          *   Q: What if I want tranquility? A: That's the last craving. Use the book to kill it.
          *   Q: Money-back guarantee? A: Claiming it means you want money. Don't do that.
          *   Q: Sequel? A: Unnecessary. If you need it, you failed.
          *   Publisher Note: Slip in the desperation here. "Buy now before you realize you shouldn't."

      *   **Tone Check:** Deadpan. No jokes. The humor comes from the logical collision.

      *   **Word Count Check:** Need to be concise to hit 600-700.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Blurb: Are you tired of trying? Good. Trying is the problem. This book doesn't add value; it subtracts need.
      *   Praise: "I read it and now I don't care." "It was okay, then I forgot it."
      *   FAQ: "Do I need to want this?" "Yes, unfortunately, until you don't." "Refunds?" "Wanting money is suffering." "Sequel?" "No."

  5.  **Refining for Philosophical Accuracy:**
      *   Ensure the distinction between "positive utility" and "negative utility" is clear. Pleasure is just pain relief.
      *   Ensure the publisher's desperation is "faintly audible." Maybe in the FAQ regarding stock or urgency.

  6.  **Writing - Focusing on Constraints:**
      *   *Constraint:* 600-700 words.
      *   *Constraint:* No winking.
      *   *Constraint:* Guru must be able to sign it.

      *(Self-Correction during drafting)*: Make sure the publisher's desperation doesn't break the guru's voice too much. The prompt says "Somewhere in the package the publisher's commercial desperation should be faintly audible." This can be in the FAQ or a small note. I will put it in the FAQ regarding the guarantee or availability.

      *(Refining Testimonials)*: Instead of "I loved it," use "It served its function." "I am indifferent now."

      *(Refining Blurb)*: "Do not buy this unless you wish to stop buying."

  7.  **Final Polish:** Check word count and flow. Ensure the philosophical asymmetry (absence of pain > presence of pleasure) is clear.

