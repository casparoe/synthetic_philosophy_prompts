      *   **Claim 3 & 4 (The Metaphysical/Phenomenological Conclusion):**
          *   *Claim:* Pain = Signal + Separate Emotion. Badness is only in the emotion.
          *   *Philosophy:* This is the core debate. *Evaluativism* vs. *Imperativism* vs. *Feeling Theory*.
          *   *Counter:* Many philosophers (e.g., David Bain, Michael Tye) argue the unpleasantness is *intrinsic* to the pain experience, not a separate add-on. Asymbolics might not feel *pain* in the full sense, just nociception. If pain *is* essentially unpleasant, asymbolics don't feel pain, they feel "pain*" (nociceptive sensation).
