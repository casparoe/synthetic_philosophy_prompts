      *   *Nuance:* The "in-group" exception isn't just contextualism; it's about **appropriation**. It suggests the word's *force* changes, not necessarily its truth conditions. This leans Expressivist.
      *   *Clarification on "Incoherence":* Is it logically incoherent? No. It's a **defeasible rule**. "Presume X, unless Y." This is legally coherent, even if semantically messy.
      *   *The "Use/Mention" Blindspot:* This is the critical failure point for the automation. It reveals the system cannot distinguish *reporting* toxicity from *enacting* toxicity. This strongly suggests the system treats the token as a **contagion** (materialist view of language) rather than a vehicle of meaning.

  5.  **Final Polish:**

