          1.  *Token-level auto-flagging:* String matching, ignores context (use vs. mention).
          2.  *Human review/Exceptions:* Restores academic/journalistic context; allows in-group reclamation (identity-dependent).
          3.  *Legal/Court standards:* Context-heavy (hostile environment, intent, target).
      *   **Core Question 1 (Implicit Theory):** What theory of slur semantics does this apparatus presuppose?
          *   Does token-flagging imply semanticism (content encoded in the word)?
          *   Does in-group exception imply contextualism/indexicalism (content depends on speaker)?
          *   Is the system incoherent (bolting incompatible theories together)?
      *   **Core Question 2 (Strict Requirement vs. Fit):** Can a pragmatist endorse token-flagging on error-cost grounds (precautionary principle)?
      *   **Core Question 3 (Underdetermination):** Where is the practice underdetermined between semanticist, pragmatist, and expressivist readings?
