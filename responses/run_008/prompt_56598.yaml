      *   *In-Group Exception:* Treats the word's status as dependent on the speaker's identity. This aligns with **Contextualism** or **Appropriation/Reclamation** theories. It suggests the *force* or *licensing conditions* change, not necessarily the semantic content, but effectively it treats the token as different based on indexical facts.
      *   *Incoherence Charge:* The system acts *as if* the word is inherently bad (automation) but *as if* it's conditionally bad (review). Is this a contradiction? Or a heuristic layering?
      *   *Pragmatist Defense:* The "Fireworks in a Dry Forest" analogy. You don't need a theory of combustion to ban fireworks; you need a risk assessment. This is a **Policy Pragmatism** distinct from **Semantic Pragmatism**.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's a meta-philosophical inquiry into the "folk semantics" embedded in platform architecture.
      *   **Section 1: The Implicit Theory of the Apparatus.**
          *   *Automation:* Presupposes **Lexical Essentialism**. The toxicity is in the string. This maps closest to Semanticism (content is invariant) or strong Expressivism (the word *is* the act). It ignores the Use/Mention distinction.
          *   *Exceptions (In-Group/Context):* Presupposes **Speaker-Relative Licensing**. This maps to Contextualism or Indexicalism. The *same* string has different normative status based on who utters it.
          *   *The Tension:* Yes, there is a theoretical tension. Essentialism says $W$ is always bad. Contextualism says $W$ is bad only if $C$. The system tries to have both: $W$ is *presumed* bad (Essentialism) but *defeasibly* bad (Contextualism).
      *   **Section 2: Strict Requirement vs. Best Fit (The Pragmatist Defense).**
          *   Address the "Fireworks" analogy. A semantic pragmatist (harm is contextual) can endorse token banning as a **heuristic for risk management**.
          *   *Error Costs:* False Positive (removing academic discussion) vs. False Negative (allowing harassment). Platforms prioritize minimizing False Negatives (safety/brand risk).
          *   *Distinction:* This doesn't mean the *theory* is pragmatist; it means the *policy* is consequentialist. The system doesn't "believe" anything; it optimizes.
      *   **Section 3: Underdetermination.**
          *   Where can different theories explain the practice?
