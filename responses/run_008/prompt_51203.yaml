  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Methodological Divergence in Historical Jesus Research
  **Parties:** Proponent of Criteria-Based Reconstruction (PCR) | Proponent of Social Memory History (SMH)
  **Date:** October 26, 2023

  ### I. Agreed Substantive Claims

  The undersigned parties acknowledge significant methodological divergence regarding the reconstruction of the life of Jesus of Nazareth. However, to establish a baseline for this collaboration, we affirm the following substantive claims as common ground. These are not merely procedural; they are ontological and historical commitments.

  1.  **Existence:** Jesus of Nazareth was a historical individual who operated in first-century Galilee and Judea and was executed by Roman authority under Pontius Pilate. We jointly reject the "Christ Myth" hypothesis as incompatible with the extant evidence.
  2.  **Jewish Context:** Jesus must be understood primarily within the matrix of Second Temple Judaism. Any reconstruction that renders him unintelligible to a first-century Jewish audience is historically defective.
  3.  **Source Nature:** The canonical Gospels are theological narratives, not modern biographies. They are products of the post-Easter believing communities, written decades after the events they describe.
  4.  **Continuity and Discontinuity:** There is both continuity and discontinuity between the message of the pre-Easter Jesus and the theology of the post-Easter church. A method that posits total continuity ignores the impact of the resurrection experiences; a method that posits total discontinuity renders the rise of Christianity inexplicable.
  5.  **Rejection of Maximal Skepticism:** We jointly reject the mid-20th-century "No Quest" position that claims nothing can be known about Jesus. While the *degree* of knowledge is disputed, the possibility of historical knowledge is affirmed.
  6.  **Role of 70 CE:** The destruction of the Jerusalem Temple in 70 CE is a critical horizon. Traditions circulating after this date inevitably reflect the trauma and theological reinterpretation necessitated by the Temple's loss.

  ### II. Methodological Disagreements and Predictive Cruxes

  The following table outlines the specific methodological disagreements. Crucially, the third column specifies a concrete prediction for a specific historical case. These predictions are falsifiable within the framework of our collaboration.

  | Issue | PCR Position (Criteria-Based) | SMH Position (Memory-Historical) | Predictive Crux (Concrete Case) |
  | :--- | :--- | :--- | :--- |
  | **The Utility of Criteria** | The standard criteria (dissimilarity, embarrassment, multiple attestation, etc.) are probabilistic tools. When applied rigorously, they can isolate strands of tradition that pre-date the Evangelists. | The criteria are circular. They presuppose a definition of "authenticity" (e.g., "Jesus must be unique") and then find only material that fits that definition. They are heuristic at best, probative at worst. | **Case: The Temple Cleansing.**<br><br>**PCR Prediction:** Analysis will confirm the core action (overturning tables) is historically probable. It meets *embarrassment* (attacks cult), *multiple attestation* (Mark/John/Gospel of Thomas), and *plausibility* (prophetic sign-act).<br><br>**SMH Prediction:** Analysis will show the narrative is a "prophetic typology" constructed to explain the Temple's destruction (70 CE). The "event" is inseparable from the theological interpretation; isolating a "bare event" is impossible. |
  | **The Category of "Authenticity"** | "Authentic saying" names a coherent target: material that originates from the pre-Easter Jesus rather than the post-Easter church. This distinction is necessary to prevent theology from erasing history. | "Authenticity" is a misleading binary. All accessible material is "remembered Jesus." The target should be the *trajectory of memory*: how and why the community attributed this specific saying to Jesus at this specific time. | **Case: The "Abba" Address.**<br><br>**PCR Prediction:** The use of *Abba* is an *Aramaic trace* and passes *dissimilarity* (early church prayed in Jesus' name, not necessarily using this specific intimate address). It reflects Jesus' unique filial consciousness.<br><br>**SMH Prediction:** The *Abba* address reflects early liturgical practice (Rom 8:15, Gal 4:6) projected back onto Jesus. It tells us about the *community's* prayer life and adoption theology, not necessarily Jesus' idiolect. |
  | **Dissimilarity** | The criterion of dissimilarity is essential to avoid confounding Jesus with Judaism or the Church. If a saying is distinct from both, it is securely historical. | Dissimilarity produces a "Jesus" who could not have founded a movement within Judaism or been worshipped by the Church. It recovers a freak, not a founder. | **Case: The Son of Man Sayings.**<br><br>**PCR Prediction:** Sayings where "Son of Man" refers to Jesus' earthly authority (e.g., Mark 2:10) are authentic via *dissimilarity* (Church didn't use title this way).<br><br>**SMH Prediction:** The distinction between "present" and "future" Son of Man is a community development. The "earthly" sayings are not more authentic; they are earlier stages of the same evolving memory tradition. |

  ### III. Determination on the Nature of the Dispute

  **Is this dispute merely verbal?**

  **Decision:** No. This is not a semantic dispute regarding the definition of the word "authentic." It is an epistemological dispute regarding access to the past.

  **Reasoning:** The PCR party operates on the assumption that the "pre-Easter Jesus" is an object that can be partially isolated from the "post-Easter Christ" through source criticism. The SMH party operates on the assumption that the "pre-Easter Jesus" is *only* accessible through the "post-Easter Christ" because the sources are exclusively products of the remembering community.

  If this were merely verbal, both parties would agree on the data but label it differently. They do not. The PCR party believes the criteria can sift *data* (ipsissima verba/acta) from *interpretation*. The SMH party believes the data *is* interpretation. Therefore, the disagreement concerns the ontological status of the historical evidence, not merely the vocabulary used to describe it.

  ### IV. Consequences and Commitments

  To ensure this collaboration remains rigorous, both parties commit to the following consequences should the weight of evidence favor one methodology over the other in the course of this project.

  **If the PCR Position is Vindicated:**
  The SMH proponent must concede that the Social Memory framework, while useful for reception history, is insufficient for historical reconstruction. They must acknowledge that by refusing to grade traditions for probability, they are leaving historical data on the table and failing to distinguish between the founder and the movement, thereby obscuring the specific causal agency of Jesus of Nazareth.

  **If the SMH Position is Vindicated:**
  The PCR proponent must concede that the "Quest for the Historical Jesus," as traditionally practiced, is answering a question that cannot be answered. They must acknowledge that the criteria do not isolate history from theology but rather select theology that *looks like* history to the modern critic. They must accept that the "Historical Jesus" reconstructed via criteria is a modern artifact, not an ancient reality, and that the research program requires a fundamental paradigm shift away from "authenticity" and toward "memory efficacy."

  ***

  **Signed,**

  _________________________
  **Proponent of Criteria-Based Reconstruction**

  _________________________
  **Proponent of Social Memory History**
