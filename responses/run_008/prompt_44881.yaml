answer: |-
  You have a very strong intuition for this, and you've correctly identified the two pressure points where the concept usually breaks if not handled carefully. You aren't fundamentally confused, but your framing of "don't know... what game they're really playing" is the one spot that needs tightening. If we fix that, the rest of your questions answer themselves.

  Here is the breakdown of where your framing is slightly off, followed by the answers to your specific questions.

  ### 1. The Framing Correction: "Unknown Game" vs. "Unknown Payoffs"

  You wrote: *"works even though the parties... don't know... even what game they're really playing."*

  This is the slip-up. For a Safe Pareto Improvement (SPI) to be mathematically possible, the parties **must** know the **game form** (the strategy spaces and the structure of interaction). They do not need to know the specific **payoff values** (the utility functions).

  *   **What they know:** "We are playing a 2-player symmetric game where we each choose *High Price* or *Low Price*." (The structure).
  *   **What they don't know:** "If we both choose *High Price*, do I get \$1M or \$10M? Do you care more about market share or profit?" (The payoffs).

  If you truly don't know the game form (e.g., I think we are playing Prisoner's Dilemma, you think we are playing Chicken), SPI is impossible. You cannot guarantee safety across structurally different games with a single modification.

  **Why this matters for your "Who Checks?" question:**
  The uncertainty doesn't move to "which game could this be." The uncertainty stays fixed on "which payoff function instantiates this known structure." The "safety check" is a **logical proof**, not an empirical inspection.

  ### 2. Who checks that G' is safe for *every* instantiation?

  **Answer:** The agents (or their programmers) check it **ex-ante** against a **class of games**, not a specific instance.

  When the parties agree to switch from $G$ to $G'$, they are implicitly agreeing on a set of plausible payoff functions, let's call it $\mathcal{U}$. This set represents their "prior knowledge" (e.g., "payoffs are monotonic in profit," "war is costly for both").

  The verification condition is a universal quantifier:
  $$ \forall u \in \mathcal{U}, \text{Outcome}(G', u) \succeq_{Pareto} \text{Outcome}(G, u) $$

  **Who performs this check?**
  In the literature (specifically the work by Oesterheld, Conitzer, et al. on delegated game playing), this check is done by the **principals** when they write the instructions for their **delegates**.
  1.  **Principals** know the class $\mathcal{U}$.
  2.  **Principals** design the modification $G'$.
  3.  **Principals** mathematically verify that for *any* $u$ in $\mathcal{U}$, the delegates playing $G'$ will produce a better result than delegates playing $G$.
  4.  **Delegates** just execute. They don't need to know $\mathcal{U}$.

  So, the uncertainty isn't "moved"; it is **bounded**. The safety is guaranteed only relative to the bounds of $\mathcal{U}$. If the actual game turns out to have payoffs outside $\mathcal{U}$ (e.g., one player actually *likes* losing money), the SPI guarantee breaks. But that is true of any decision theory; you can't guarantee safety against payoff functions you literally cannot conceive of.

  ### 3. Is the safety guaranteed by the "shape" of the modification?

  **Answer:** **Yes.** This is exactly right.

  You guessed: *"the modification preserves some structural feature... such that the safety check doesn't require knowing anything type-specific."*

  This is the core mechanism. SPIs rely on **order-preserving mappings** or **strategy space restrictions** that work regardless of cardinal values.

  **Example 1: Removing a Dominated Strategy (The simplest SPI)**
  *   **Game $G$:** You have strategies {Cooperate, Defect, Nuke}.
  *   **Assumption:** Both parties know that "Nuke" is strictly dominated (it always yields a worse payoff than Defect, regardless of what the other does).
  *   **Modification $G'$:** Play $G$, but remove the "Nuke" strategy.
  *   **Why it's Safe:** Since "Nuke" is never a best response, removing it does not change the set of Nash Equilibria. However, it might remove *accidental* plays or focal points that lead to risk. More importantly, if there was *any* chance a bounded-rational agent might pick Nuke, removing it is a Pareto improvement.
  *   **The "Shape":** The safety comes from the *dominance relation*, which is ordinal. It holds for all payoff functions where Nuke < Defect.

  **Example 2: The "Surrogate Game" (Delegation)**
  *   **Setup:** I hire a delegate to play for me.
  *   **Instruction:** "Don't play the real game $G$. Play this surrogate game $G'$ where the strategies are mapped to mine, but the payoffs are artificial."
  *   **The Trick:** If I instruct my delegate to play a Correlated Equilibrium of $G'$, and I instruct you to do the same, we can achieve outcomes that are Pareto superior to the Nash Equilibrium of $G$.
  *   **The Safety:** The safety comes from the fact that the delegates are bound to the *correlation device*. The "shape" here is the **commitment to a solution concept** (like Correlated Equilibrium) that is known to dominate Nash Equilibrium in terms of welfare, provided the mapping between $G$ and $G'$ is isomorphic.

  So, you are correct: the safety is "cheap to establish" because it relies on **invariants** (like dominance, symmetry, or solution-concept properties) rather than specific numbers.

  ### 4. The "Small One": Common Interpretation

  **Answer:** Yes, this is a critical, stated assumption.

  In formal game theory terms, this is the **Common Knowledge of the Game Form** assumption.
  For an SPI to work, it must be common knowledge that:
  1.  We are switching to $G'$.
  2.  $G'$ is defined as [Specific Modification].

  If you think the coin flip determines custody and I think it determines the dog, we are not playing the same game $G'$. We are playing two different games that happen to share a name. In that case, the SPI proof fails because the mapping between strategies is broken.

  The literature usually handles this by assuming the "protocol" or "contract" defining $G'$ is explicit and unambiguous. In real-world applications (like legal settlements or automated trading), this is the hardest part: ensuring the code or contract is interpreted identically. The theory assumes this away; the practice struggles with it.

  ### Summary of Corrections

  1.  **Not "Unknown Game":** You must know the structure (strategy space), just not the specific payoff values.
  2.  **Not "Empirical Check":** The safety is verified mathematically by the principals over a *class* of payoff functions ($\mathcal{U}$), not by inspecting the specific instance.
  3.  **Yes, "Structural Guarantee":** The safety relies on ordinal properties (dominance, symmetry) that hold across the whole class $\mathcal{U}$.
  4.  **Yes, "Common Interpretation":** This is the "Common Knowledge of Game Form" assumption. If this fails, the SPI fails.

  Your intuition that the safety is "guaranteed by the shape of the modification" is the correct way to hold the concept in your head. The "uncertainty" is bounded by the structural assumptions the parties are willing to make together. If they can't agree on the structure (e.g., "is 'Nuke' dominated?"), they can't agree on the SPI.
