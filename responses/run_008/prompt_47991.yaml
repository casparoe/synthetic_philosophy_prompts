answer: |-
  **Prediction:** Jordan pays the $100.

  **The Rule:** She is running **Functional Decision Theory (FDT)** (or its close cousin, Updateless Decision Theory).

  **Why this explains her record:**
  Her verdicts form a specific fingerprint that rules out the other major candidates (CDT and EDT) and points squarely at FDT.

  1.  **Standard Newcomb (99% & 70%):** One-boxing rules out Causal Decision Theory (CDT), which two-boxes regardless of accuracy (provided it's not 100% deterministic causation). This leaves EDT and FDT/TDT.
  2.  **Transparent Newcomb:** This is the killer for EDT. In Transparent Newcomb, you *see* the money in Box A. Standard EDT conditions on the act ("If I take both, what is the expected utility given I see the money?"). Since the money is already there, taking both dominates taking one. EDT two-boxes here. FDT one-boxes because it reasons that if its *algorithm* were the type to two-box upon seeing money, Omega wouldn't have put the money there. Jordan one-boxes, so she is not running standard EDT.
  3.  **Smoking Lesion:** She smokes. This rules out EDT (which refuses to smoke because smoking is bad evidence of the lesion). Her reasoning ("screening off") is the textbook justification for TDT/FDT: once you know your internal state (craving), the correlation between the act and the gene is broken. CDT also smokes, but CDT was already ruled out by Newcomb.

  **Where your read went wrong:**
  You suspected she might be "in the evidential family" and might refuse the coin case because there's "no craving to screen off." This misdiagnoses her Smoking Lesion verdict. An evidential agent (EDT) *never* smokes in the Smoking Lesion problem, regardless of screening off, because EDT treats the choice itself as evidence. Jordan's explicit appeal to screening off proves she rejects pure evidential reasoning when a common cause is identified. She isn't an EDT agent who got lucky on Smoking Lesion; she is an FDT agent who correctly identified that physical correlations (lesion) screen off differently than logical correlations (Omega's prediction).

  **Why she pays the Coin Case:**
  Counterfactual Mugging is the canonical test for **Updatelessness**.
  *   **CDT/EDT/Updateful TDT:** Refuse. The coin is already Tails. Paying costs $100 with no causal or evidential benefit in the actual world. The Heads world is counterfactual and gone.
  *   **FDT/UDT:** Pays. They reason from the perspective of the decision *algorithm* before the coin flip. The algorithm "Pay if Tails" has an expected value of $4,950 (50% chance of -$100, 50% chance of +$10,000). The algorithm "Don't Pay" has an EV of $0. Since Omega predicted the algorithm, not the specific instance, Jordan pays to ensure her algorithm is the winning type ex-ante. Her One-boxing on *Transparent* Newcomb confirms she is willing to ignore immediate sensory evidence (the coin being Tails / the money being visible) to maintain logical consistency with the predictor.

  **The Next Case:**
  If the Coin Case goes as predicted (she pays), she has confirmed she is Updateless FDT. To stress-test her specific "screening off" intuition and ensure she isn't just applying a heuristic, bring her **XOR Blackmail**.

  *   **Setup:** You receive a letter demanding $100. The letter is sent if and only if: (Termites exist AND you pay) OR (No Termites AND you don't pay). You receive the letter. Do you pay?
  *   **The Split:**
      *   **EDT:** Pays. (Paying is strong evidence that there are no termites).
      *   **FDT:** Refuses. (Your decision does not logically control the existence of termites, only the sending of the letter. Paying just loses you $100).
  *   **Why:** Jordan's Smoking Lesion reasoning relied on screening off a *physical* common cause. XOR Blackmail tests if she applies that same logic to a *logical* correlation constructed by a predictor. If she pays the Mugging (FDT) but also pays XOR Blackmail (EDT), she's inconsistent. If she refuses both, her FDT implementation is robust.

  **If you need to settle it now:**
  If her record genuinely underdetermines the Coin Case (e.g., if you suspect she's running "Updateful TDT" which pays Hitchhiker but refuses Mugging), the detail that would have settled it is her verdict on **Parfit's Hitchhiker**.
  *   *Setup:* Dying in desert. Driver saves you only if he predicts you'll pay him $100 once in town. You arrive in town. Do you pay?
  *   *Verdict:* Updateful TDT pays Hitchhiker but refuses Mugging. Updateless FDT pays *both*. If she had told you she pays Hitchhiker, the probability of her paying the Mugging goes up significantly. Without that, the Transparent Newcomb verdict is the strongest proxy for updatelessness available in her record.
