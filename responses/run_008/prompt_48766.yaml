      *   **Specific Needs:** A menu of distinct claims the proverb might stand for, an evaluation of each (trivial/substantive/dubious), and crucially, whether each reading *licenses dismissing the prudential explanation*.
      *   **Tone:** Academic, analytical, nuanced, helpful for a seminar paper.

  2.  **Deconstruct "Ordnung muss sein":**
      *   Literal translation: "Order must be."
      *   Cultural connotation: German stereotypical adherence to rules, structure, predictability.
      *   Instructor's usage: Explains waiting at empty red lights, moralizes rule-following, *excludes* prudential fear (fines/sanctions).

  3.  **Brainstorm/Refine the Candidate Claims (based on user's list + additional nuances):**
