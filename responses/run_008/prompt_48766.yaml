      *   *Candidate 3: Functional/Systemic.* (Unconditional compliance sustains the system.)
      *   *Candidate 4: Moral Character/Virtue Ethics.* (Following rules *is* being good.)
      *   *Candidate 5: National Character/Essentialism.* (It's in the German soul.)

  4.  **Evaluate Each Candidate against Criteria:**
      *   *Status:* Trivial, Substantive/Defensible, Dubious.
      *   *The "Prudential Test":* Does this interpretation *rule out* the idea that people follow rules because they fear fines or social shame?
          *   If I follow rules because "Order is good" (Intrinsic), does that exclude "I don't want a fine"? Yes, mostly.
          *   If I follow rules because "It keeps society working" (Functional), does that exclude "I don't want a fine"? No, they can coexist.
          *   If I follow rules because "Germans are like this" (National Character), does that exclude "I don't want a fine"? It depends on *why* Germans are like this. If it's essential, maybe. If it's socialized fear, then no.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the student's question. Validate that "Ordnung muss sein" is often a placeholder for deeper theoretical commitments.
      *   **The Menu of Claims:**
          *   *Claim 1: The Empirical Regularity.* (Germans do this more.) -> Trivial/Descriptive. *Prudential Test:* Fails. Doesn't explain *why*.
          *   *Claim 2: The Intrinsic Good.* (Order is a value like Justice.) -> Substantive. *Prudential Test:* Passes. If it's a duty, fear of fines is irrelevant.
          *   *Claim 3: The Systemic Functionalist.* (Rules work only if universal.) -> Substantive/Defensible (Kantian). *Prudential Test:* Fails/Neutral. You can believe this *and* fear fines. Actually, this often *supports* prudential logic (if I break it, the system collapses, which is bad for me).
