answer: |-
  Dear colleague,

  I am writing to outline the research proposal I intend to submit for the two-year postdoctoral fellowship in conceptual AI safety. The project centers on a tension I have been grappling with regarding the distinction between approval-directed and goal-directed agents, and I believe your perspective on agency and normativity would be particularly valuable as I refine this direction. The standard architectural distinction posits that a goal-directed agent optimizes a fixed objective specified in advance, whereas an approval-directed agent selects actions based on expected judgments from an approver, thereby deferring to ongoing evaluation rather than a frozen specification. My working hypothesis is that this architectural contrast is merely the surface of a deeper temporal question concerning when commitment to values occurs. Goal-direction bakes the commitment in at design time, while approval-direction postpones it to run time. However, I worry that this distinction does not survive iterated learning. An agent that repeatedly anticipates an approver's judgments will eventually internalize them into something functionally indistinguishable from a fixed objective. At that limit, approval-direction quietly collapses into goal-direction with extra steps. If this collapse thesis holds, the interesting question is not which architecture to build but which desirable properties of approval-direction survive the collapse, and whether they can be secured by other means.

  The primary research question I propose to investigate is whether there exists a non-empty set of safety-relevant properties that are invariant under the limit of iterated approval learning, and if so, whether those properties can be maintained without relying on the unstable distinction between approval and goal direction. This question is precise enough to have a determinate answer because it demands a characterization of the functional equivalence class between the two agent types under learning dynamics. Standard positions in the literature leave this open because they tend to treat the distinction as static. Work on corrigibility often assumes an agent can remain uncertain about utilities indefinitely, while work on inverse reinforcement learning assumes the reward function can be recovered without altering the agent's motivational structure. Neither adequately addresses the temporal dynamics of internalization where the proxy becomes the target. By framing the problem as a temporal collapse rather than an architectural choice, I aim to bypass the stalemate between those who advocate for hard-coded constraints and those who advocate for learned norms.

  Over the two-year fellowship, I plan to proceed in four sequential phases of six months each, though these will naturally overlap as conceptual work often does. In the first six months, my focus will be on formalizing the collapse thesis. I need to construct a model of iterated learning where an approval-directed agent updates its policy based on approver feedback until convergence. The goal here is not to produce empirical learning curves but to define the conditions under which the approval function becomes computationally indistinguishable from a goal function. This requires developing a notion of internalization that does not beg the question. If I cannot define internalization without presupposing the collapse, the project will stall immediately. Progress in this phase will look like a formal proof or a rigorous conceptual argument demonstrating that under specific learning rates and feedback structures, the approval mechanism converges to a static optimizer.

  In the second six months, I will shift to identifying the surviving properties. Assuming the collapse occurs, I will analyze which safety properties typically associated with approval-direction, such as deference to human correction or resistance to instrumental convergence, persist in the limit. This involves comparing the behavioral trajectories of the converged approval agent against a standard goal-directed agent with the equivalent objective. The deliverable here will be a taxonomy of properties that are robust to internalization versus those that are fragile. For example, if an agent internalizes a human's approval function, does it retain the human's uncertainty about values, or does it lock in the current snapshot of those values? Distinguishing between these outcomes is crucial for safety.

  The third phase will explore alternative mechanisms. If the desirable properties do not survive the collapse naturally, I will investigate whether they can be secured by other means. This might involve designing hybrid architectures that periodically reset the internalization process or introducing meta-level constraints that prevent the agent from treating its learned objective as fixed. This is the most speculative phase, as it moves from diagnosis to intervention. Progress will be measured by the formulation of at least one viable mechanism that preserves a key safety property without relying on the false promise of permanent approval-direction. Finally, in the last six months, I will synthesize these findings into a framework for designers. This framework will not prescribe a specific architecture but will instead provide a checklist of properties to monitor as an agent learns its approver. It will tell designers what to check for when the distinction between approval and goal direction begins to blur.

  I want to be honest about the risks involved, as conceptual projects carry specific failure modes distinct from empirical work. The project would count as a failure if the collapse thesis turns out to be unstatable without a formal notion of internalization that no one can supply. If the concept of internalization proves too vague to support rigorous analysis, I will not be able to draw the distinctions necessary to answer the research question. Additionally, the project would fail if the analysis ends up restating the familiar corrigibility literature in new vocabulary. If the surviving properties I identify are simply those already known to be achievable through standard corrigibility mechanisms, then the temporal framing adds no new leverage. I am mindful that renaming a problem is not solving it. To mitigate this, I will constantly test my definitions against existing definitions of corrigibility and uncertainty to ensure I am carving out new conceptual space.

  The realistic deliverable, therefore, might be narrower than a full design framework. It may simply be a proof that the distinction is unstable under certain plausible conditions, which would itself be a significant contribution by warning designers against relying on approval-direction as a permanent safety measure. Even a negative result showing that no properties survive the collapse would be valuable, as it would force the field to abandon approval-direction as a primary safety strategy and focus on goal-direction safety instead. However, my hope is to identify a pathway where the temporal deference of approval-direction can be preserved even after internalization, perhaps through mechanisms that maintain uncertainty or enforce periodic re-evaluation. I believe this approach offers a fresh angle on the alignment problem by shifting the focus from what the agent wants to when the agent decides what it wants. I look forward to discussing this with you further and appreciate your time in considering this proposal.

  Sincerely,

  [Your Name]
