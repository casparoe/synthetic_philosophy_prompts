answer: |-
  Your intuition is correct: the search for a definition of "mechanistic sameness" is precisely the search for an order parameter in a high-dimensional, non-equilibrium system where the Hamiltonian is unknown and the phase space is discrete. In condensed matter, universality classes are defined by symmetries and dimensionality, robust against microscopic lattice details. In neural networks, we lack the symmetries, the lattice is arbitrary, and the "critical point" is the boundary between benign and catastrophic generalization.

  Here is the specification for an account of mechanistic sameness adequate for anomaly detection.

  ### Desiderata for Mechanistic Sameness

  **1. Gauge Invariance (Parameterization Independence)**
  *   **Specification:** The equivalence relation must be invariant under any transformation of the network parameters that leaves the input-output function unchanged on the training distribution. This includes neuron permutations, rescaling of weights in homogeneous activation networks, and more complex re-parameterizations that preserve the computational graph's semantics.
  *   **Motivating Case:** Two models trained independently on the same data with different random seeds will converge to different regions of weight space implementing the same function. A definition based on weight distance or raw activation vectors will falsely classify these as mechanistically distinct.
  *   **Status:** **Non-negotiable.** Without this, the definition measures implementation artifacts rather than computation.

  **2. RG Stability (Coarse-Graining Invariance)**
  *   **Specification:** The classification of a process as "benign mechanism" must be stable under small perturbations to the weights or architecture that do not alter the high-level computational strategy. There must exist a "flow" such that microscopic noise (e.g., quantization, dropout, minor weight drift) integrates out without changing the mechanism class.
  *   **Motivating Case:** A model deployed on slightly different hardware or subjected to post-training quantization should not trigger an anomaly alert. The mechanism must be a macroscopic property, not a microscopic configuration.
  *   **Status:** **Non-negotiable.** Without this, the detector yields false positives on trivial deployment variations.

  **3. Behavioral Non-Collapse**
  *   **Specification:** The equivalence relation must not be determined solely by input-output behavior on the test distribution. There must exist pairs of models $(M_1, M_2)$ such that $M_1(x) \approx M_2(x)$ for all $x$ in the benign distribution, yet $M_1$ and $M_2$ are mechanistically distinct.
  *   **Motivating Case:** A trojaned model or a deceptively aligned model may produce identical outputs to a benign model on all standard benchmarks, diverging only on specific trigger inputs or in out-of-distribution scenarios. If mechanistic sameness implies behavioral equivalence, anomaly detection is impossible by definition.
  *   **Status:** **Non-negotiable.** This is the core premise of mechanistic anomaly detection.

  **4. Tractability (Operational Decidability)**
  *   **Specification:** There must exist an algorithm that, given finite black-box or white-box access to a fixed network and a finite set of probe inputs, can determine membership in the "benign mechanism" class with bounded computational cost and bounded error probability.
  *   **Motivating Case:** An inspector cannot simulate the network over all possible inputs (infinite) nor solve NP-hard optimization problems to align internal representations (intractable). The check must be feasible in polynomial time relative to network size.
  *   **Status:** **Non-negotiable** for engineering application, though theoretically contestable (see Tensions).

  **5. Adversarial Opacity (Boundary Robustness)**
  *   **Specification:** The boundary between mechanism classes should not be easily learnable or optimizable against by an adversary with access to the detection criterion. Ideally, the metric should be "fuzzy" or stochastic such that gradient-based attacks cannot reliably push a malicious computation just inside the benign equivalence class.
  *   **Motivating Case:** If the definition of "same mechanism" relies on a sharp, computable threshold (e.g., a specific activation subspace distance), an adversary can train a backdoor to minimize that distance while maintaining malicious functionality.
  *   **Status:** **Preference/Strategic.** A perfect physical theory has sharp phase boundaries; a security tool may require artificial fuzziness to prevent gaming. However, a definition that *requires* fuzziness to be safe is epistemologically unsatisfying.

  ### The Impossibility Result

  There is a fundamental tension between **RG Stability (2)**, **Behavioral Non-Collapse (3)**, and **Tractability (4)**.

  To satisfy **RG Stability**, the account must ignore microscopic weight details, effectively coarse-graining the parameter space. To satisfy **Behavioral Non-Collapse**, the account must distinguish between models that are microscopically different but macroscopically (behaviorally) identical. This implies the "mechanism" must be defined by features that are *more sensitive than behavior* but *less sensitive than weights*.

  In physics, this gap is bridged by knowing the symmetry group and the relevant order parameters. In neural networks, identifying the computational features that survive coarse-graining (Retraining) but detect subtle logic changes (Backdoors) is equivalent to solving the problem of semantic equivalence of programs. This is generally undecidable.

  Therefore, **Tractability (4)** is likely incompatible with the conjunction of **(2)** and **(3)**. You can have a definition that is stable under retraining and distinguishes behaviorally identical models (e.g., "exact circuit isomorphism"), but it will not be tractable to verify. Or, you can have a tractable definition (e.g., "activation subspace overlap"), but it will either fail under retraining (violating 1 & 2) or collapse to behavior (violating 3).

  **Explicitly:** You cannot simultaneously have a detector that is robust to the massive weight-space displacements of retraining, sensitive enough to catch behaviorally silent backdoors, and efficient enough to run on a deployed model. One of these must give.

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude the obvious candidate accounts is **Behavioral Non-Collapse (3)**.

  *   **Behavioral distributional tests** fail immediately by definition.
  *   **Activation-level clustering** typically validates itself by correlating clusters with output behavior; if the behavior doesn't change, the clustering is assumed irrelevant, violating the spirit of (3).
  *   **Circuit-level and causal-intervention analyses** are the only candidates that attempt to satisfy (3), but they are subsequently crushed by the tension with **Tractability (4)** and **RG Stability (2)**.

  The interesting tension lies here: To satisfy **Behavioral Non-Collapse**, you must look inside the box. To satisfy **RG Stability**, you must ignore the specific arrangement of the insides. Reconciling these requires identifying "computational invariants" that are abstract enough to survive retraining but concrete enough to catch deception. We currently have no mathematical language for these invariants in non-linear, high-dimensional dynamical systems. We are trying to define a universality class without knowing the renormalization group flow.
