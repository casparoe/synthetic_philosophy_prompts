prompt: |-
  I direct the policy review unit of the immigration directorate of a small, wealthy democracy. Our government accepts that freedom of movement carries real moral weight and does not want to defend border controls as a bare entitlement, but it also rejects open borders and intends to keep a selective admissions system. The minister has asked my unit for a decision procedure that front-line officers can actually use to determine whether a given exclusion — a general rule, a category bar, or an individual refusal — is justified. What we need is not a treatise but something operational, and that is where the philosophical debate has to be compressed without being betrayed.

  The procedure should be grounded in the actual structure of the open-borders debate: the associational defense of the state's right to exclude, on which the state is a cooperative venture that may control membership but only within limits — its duties to refugees, its duty not to worsen the position of outsiders, the claims of people already present and the special claims of long-term residents; the open-borders position, on which birthplace is morally arbitrary in something like the way feudal birthright privilege was, and movement counts as a basic liberty that presumptively may not be restricted; and the intermediate positions that would permit exclusion only under sufficiency or legitimacy conditions. Your task is to turn this into something a generalist civil servant with no philosophy training can run on a written case file in about an hour.

  Please provide the following:

  1. An ordered set of questions the officer asks about any proposed exclusion, with a statement of what counts as a sufficient answer to each, and the points at which the procedure terminates — either in a verdict that the exclusion is permissible or in a verdict that it is not.

  2. An explicit allocation of the burden of proof. Our government concedes that movement matters morally, so the procedure should say who must show what, and to what standard, before exclusion goes through.

  3. The procedure's known failure modes: where it will tend to rubber-stamp whatever the government of the day prefers, where it smuggles in contested philosophical assumptions as if they were neutral administrative tests, and where the compression from theory to checklist loses something the theory itself says is essential.

  4. Worked applications to three cases: (a) an annual cap on low-skilled work visas justified as protection of domestic wages; (b) refusal of entry to the spouse of a long-term resident on income-maintenance grounds; (c) an asylum claim by someone fleeing economic collapse rather than targeted persecution. Include at least one case in which the procedure yields a verdict you expect the minister will dislike, and explain why it yields that verdict anyway.

  5. A closing statement of what the procedure cannot do: the questions it deliberately brackets — including the prior question of whether selective borders are legitimate at all — and what would have to change, philosophically or factually, for its outputs to come out differently.

  Two practical constraints: wherever a step requires evidence, as with whether a visa cap actually protects wages, specify what kind of evidence would suffice and what the officer should do when it is unavailable; and mark clearly the steps at which the question stops being one the procedure can settle and must be escalated to the minister as a decision of political values.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Director of the Policy Review Unit, Immigration Directorate.
      *   **Context:** Small, wealthy democracy. Government accepts moral weight of freedom of movement but rejects open borders. Wants a selective admissions system.
      *   **Task:** Create an operational decision procedure for front-line officers to justify exclusions (rules, bars, refusals).
      *   **Constraints:**
          *   Must be usable by a generalist civil servant in ~1 hour.
          *   Must reflect the philosophical debate (associational defense vs. open borders vs. intermediate positions) without being a treatise.
          *   Must include: Ordered questions/termination points, Burden of Proof allocation, Known Failure Modes, Worked Applications (3 cases, one potentially unpopular), Closing Statement on limitations.
          *   Practical constraints: Specify evidence types, handle missing evidence, mark escalation points for political value judgments.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Open Borders View:* Movement is a basic liberty; birthplace is arbitrary. Exclusion needs strong justification.
      *   *Associational/Statist View:* State is a cooperative venture; right to control membership to preserve culture/welfare/institutions.
      *   *Intermediate/Liberal View:* Exclusion is permissible *only if* specific conditions are met (sufficiency, legitimacy, harm prevention).
      *   *Government Stance:* "Freedom of movement carries real moral weight" + "Rejects open borders" + "Selective admissions." This implies a *presumption against exclusion* that must be overcome by specific state interests, balanced against individual rights.

  3.  **Drafting the Procedure (Section 1 & 2):**
      *   *Structure:* Needs to be a flowchart or checklist style. Let's use a "Justification Test."
      *   *Burden of Proof:* Since the government admits movement has moral weight, the *State* bears the burden to justify exclusion. The applicant doesn't need to prove they *should* enter; the State must prove they *may be kept out*. Standard: "Clear and convincing evidence" (higher than balance of probabilities, lower than beyond reasonable doubt) for policy; "Substantial grounds" for individual cases.
      *   *Questions:*
          1.  **Legitimacy of Aim:** Is the goal of the exclusion compatible with democratic values and human rights? (Filters out racist/arbitrary bans).
          2.  **Necessity/Effectiveness:** Does the exclusion actually achieve the goal? (Empirical check).
          3.  **Proportionality/Least Restrictive Means:** Is there a less restrictive way to achieve the goal?
          4.  **Human Rights/Hardship Override:** Does exclusion violate specific duties (refugees, family unity)?
      *   *Termination:* If any step fails, exclusion is impermissible (unless escalated). If all pass, exclusion is permissible.
      *   *Escalation:* Where empirical evidence is missing or value judgments are too deep.

  4.  **Refining the Questions for Operational Use:**
      *   Need to make sure an officer can answer these in an hour.
      *   *Q1 (Purpose):* Is the stated purpose a recognized public interest (security, public health, economic stability)?
      *   *Q2 (Causation):* Is there evidence this exclusion helps that interest?
      *   *Q3 (Rights Check):* Does this violate non-refoulement or family life?
      *   *Q4 (Proportionality):* Is the harm to the applicant disproportionate to the benefit to the state?

      *Let's align closer to the prompt's philosophical requirements:*
      *   Need to capture the "associational defense" (preserving the venture) vs. "moral weight of movement."
      *   *Revised Q1:* **The Public Interest Threshold.** Does the exclusion serve a vital function of the political community (security, fiscal sustainability, public order)?
      *   *Revised Q2:* **The Empirical Link.** Is there credible evidence that excluding *this* category/person protects that function?
      *   *Revised Q3:* **The Duty Check.** Does exclusion violate specific negative duties (non-refoulement, not worsening outsiders' position catastrophically)?
      *   *Revised Q4:* **The Proportionality Balance.** Is the restriction on movement the least intrusive means to secure the interest?

  5.  **Addressing Burden of Proof (Section 2):**
      *   Default: Freedom of movement is the baseline.
      *   Burden: On the Immigration Directorate/State.
      *   Standard: "Substantial Justification." Not just "rational basis," but "actually works and is necessary."

  6.  **Identifying Failure Modes (Section 3):**
      *   *Rubber-stamping:* Officers might accept government assertions as "evidence."
      *   *Philosophical Smuggling:* "Public Interest" is vague. Who defines it?
      *   *Compression Loss:* Nuance of "associational freedom" might get lost in a checkbox.
      *   *Systemic Bias:* "Economic stability" often masks protectionism.

  7.  **Developing Worked Applications (Section 4):**
      *   *Case A (Low-skilled cap):*
          *   Aim: Protect wages.
          *   Evidence: Economic studies.
          *   Verdict: If evidence is weak, fail. If strong, pass. *Let's make this the unpopular one.* If the evidence shows caps *don't* protect wages but restrict liberty, the procedure says "No Cap." Minister wants the cap.
      *   *Case B (Spouse income requirement):*
          *   Aim: Prevent burden on welfare.
          *   Rights: Family unity.
          *   Verdict: If income threshold is too high, it fails proportionality.
      *   *Case C (Economic Asylum):*
          *   Aim: Distinguish refugee vs. migrant.
          *   Duty: Non-refoulement (persecution).
          *   Verdict: Economic collapse isn't persecution under current law, but does it meet the "worsening position" duty? Usually fails Q1 (not persecution), but might trigger humanitarian escalation.

      *Decision on the "Unpopular Verdict":* Case A is best. If the economic evidence is mixed/weak, the procedure should reject the cap. Ministers love caps. This shows the procedure has teeth.

  8.  **Drafting the Closing Statement (Section 5):**
      *   What does this *not* do? It doesn't justify the border itself. It assumes the state exists. It doesn't solve global inequality. It relies on available data.

  9.  **Review and Refine:**
      *   *Tone:* Bureaucratic but philosophically literate. Clear, directive.
      *   *Constraints Check:* Did I mark escalation points? Yes. Did I specify evidence types? Yes. Is it under 1 hour? The checklist needs to be tight.
      *   *Philosophical Fidelity:* Ensure the "associational defense" is represented in the "Public Interest" step, and the "open borders/moral weight" is represented in the "Burden of Proof" and "Proportionality" steps.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Escalation" points are clear. If an officer can't find evidence, they shouldn't just guess. They must flag it.
      *   *Correction:* Ensure the "Unpopular Verdict" is clearly explained as a consequence of the procedure's logic, not an error.
      *   *Correction:* Check the "Burden of Proof" section. It needs to be explicit that the *State* proves the need for exclusion, not the *Applicant* proves the need for entry.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Self-Correction on Case A)*: To make it truly operational, I need to specify *what* evidence suffices. E.g., "Independent central bank analysis" vs "Ministerial press release."
  *(Self-Correction on Case C)*: Economic asylum is tricky. Under current international law, it's not grounds. But the prompt asks to ground it in the *moral* debate. The procedure should flag this as a "Political Value" escalation because the law says No, but the moral duty (not to worsen position) is ambiguous. I will have the procedure recommend refusal based on current legal definitions but flag the moral tension for escalation. Actually, better to have the procedure *reject* the exclusion if the "worsening position" is catastrophic, forcing the Minister to override. No, that's too risky for a civil servant. Better: The procedure identifies the gap and escalates. Let's go with: Procedure recommends refusal (legal compliance) but flags for Ministerial Discretion (moral duty).
  *Wait, the prompt asks for a case where the procedure yields a verdict the Minister will dislike.* Case A (Caps) is the strongest candidate for this. If the evidence doesn't support the wage protection theory, the procedure says "Reject Cap." Minister wants "Keep Cap."

  *Let's finalize the structure.*
  1. The Procedure (The "Exclusion Justification Test").
  2. Burden of Proof.
  3. Failure Modes.
  4. Worked Cases.
  5. Limitations.

  *Ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** The Minister of Immigration
  **FROM:** Director, Policy Review Unit
  **SUBJECT:** Operational Decision Procedure for Exclusion Justification (The "EJ-1 Protocol")
  **DATE:** October 26, 2023

  **1. THE EXCLUSION JUSTIFICATION TEST (EJ-1)**

  **Purpose:** To determine whether a proposed exclusion (rule, category bar, or individual refusal) is morally and administratively justified given the state's dual commitment to freedom of movement and selective admission.
  **Time Allocation:** 60 Minutes per case file.
  **User:** Generalist Civil Servant (Level 2).

  **Preliminary Instruction:**
  The default position of this Directorate is that freedom of movement is a protected interest. You are not assessing whether an applicant *deserves* to enter. You are assessing whether the State has demonstrated a sufficient reason to *prevent* entry. If the State's case is weak, the exclusion fails.

  **Step 1: The Legitimacy of Aim (Political Value Check)**
  *Question:* Does the stated purpose of the exclusion fall within one of the three recognized legitimate aims of the political community?
  *   (A) Protection of physical security/public order.
  *   (B) Preservation of fiscal sustainability (welfare state viability).
  *   (C) Protection of established residents' fundamental rights (e.g., labor standards).
  *   *Note:* "Cultural homogeneity" or "Political preference" are **not** legitimate aims.

  *   **Sufficient Answer:** Citation of specific statute or policy directive mapping to A, B, or C.
  *   **Termination:** If NO, exclusion is **IMPERMISSIBLE**. Stop.
  *   **Escalation:** If the aim is ambiguous (e.g., "National Interest" without definition), escalate to Minister.

  **Step 2: The Empirical Link (Evidence Check)**
  *Question:* Is there credible, independent evidence that this specific exclusion effectively achieves the Aim identified in Step 1?
  *   **Sufficient Evidence:** Peer-reviewed economic data, security intelligence assessments, or actuarial reports. *Ministerial press releases or anecdotal reports do not suffice.*
  *   **Unavailable Evidence:** If data is unavailable, the assumption must be that the link is unproven.
  *   **Termination:** If NO (or evidence is unavailable/weak), exclusion is **IMPERMISSIBLE**. Stop.
      *   *Rationale:* We cannot restrict a moral liberty based on speculation.

  **Step 3: The Duty Check (Negative Obligations)**
  *Question:* Does applying this exclusion violate a specific negative duty owed to the applicant or outsiders?
  *   **Triggers:**
      *   (A) *Non-Refoulement:* Does return expose the applicant to persecution/torture? (Automatic Bar).
      *   (B) *Family Unity:* Does this separate a minor from a primary caregiver or spouses who cannot reasonably live elsewhere?
      *   (C) *Catastrophic Harm:* Does exclusion leave the applicant in a position of destitution significantly worse than their baseline, without recourse?
  *   **Termination:** If YES to A, B, or C, exclusion is **IMPERMISSIBLE**. Stop.

  **Step 4: The Proportionality Balance (Least Restrictive Means)**
  *Question:* Is there a less restrictive alternative that would achieve the same Aim?
  *   **Examples:** Instead of a total ban, is a quota sufficient? Instead of refusal, is a bond or insurance requirement sufficient?
  *   **Sufficient Answer:** Documentation showing alternatives were considered and rejected for specific, evidence-based reasons (e.g., "Insurance model failed in 2020 pilot").
  *   **Termination:** If NO (a less restrictive means exists), exclusion is **IMPERMISSIBLE**. Stop.
  *   **Escalation:** If the choice between means involves a trade-off of competing political values (e.g., "Quotas vs. Fees"), escalate to Minister.

  **Final Verdict:**
  *   If all Steps are passed: **EXCLUSION PERMISSIBLE.**
  *   If any Step fails: **EXCLUSION IMPERMISSIBLE.**

  ***

  **2. ALLOCATION OF THE BURDEN OF PROOF**

  **The Presumption:**
  The procedure operates on the presumption that **movement is liberty and exclusion is coercion.** Therefore, the burden of proof rests entirely on the **State (The Directorate)**, not the applicant.

  **Standards of Proof:**
  1.  **For General Policy Rules (e.g., Visa Caps):** The Standard is **"Substantial Justification."** It is not enough that the rule is *rational*; it must be *effective*. The policy unit must provide the evidence required in Step 2. The officer verifies its presence.
  2.  **For Individual Refusals:** The Standard is **"Clear and Convincing."** The officer must be satisfied that the specific facts of the case meet the exclusion criteria without relying on stereotypes or probabilistic profiling (e.g., refusing based solely on country of origin).

  **Handling Uncertainty:**
  In cases of evidentiary ambiguity (e.g., it is unclear if the applicant poses a security risk), the benefit of the doubt goes to the **applicant's liberty**. Exclusion requires certainty of risk, not merely suspicion, unless specific intelligence statutes dictate otherwise.

  ***

  **3. KNOWN FAILURE MODES**

  Officers must be aware that this checklist is a tool, not a moral oracle. It has specific vulnerabilities:

  **A. The "Rubber-Stamp" Risk (Step 1 & 2)**
  *   *Failure:* Officers may accept "Fiscal Sustainability" as a legitimate aim without questioning whether the specific exclusion actually saves money. They may treat a Minister's assertion as "Evidence."
  *   *Mitigation:* Step 2 explicitly rejects ministerial assertions as evidence. If the file contains only policy memos and no data, the officer must mark Step 2 as FAILED.

  **B. The "Technocratic Smuggling" Risk (Step 4)**
  *   *Failure:* The "Least Restrictive Means" test smuggles in a libertarian philosophical assumption (that liberty is the default) which may conflict with a communitarian view of the state. It treats immigration as a rights issue rather than a privilege.
  *   *Mitigation:* This is a feature, not a bug, per Government mandate. However, officers must not substitute their own policy preferences for the "less restrictive" analysis. They must look for *administrative* alternatives, not *philosophical* ones.

  **C. The "Compression Loss" Risk (Step 3)**
  *   *Failure:* Complex moral claims (e.g., "Historical responsibility due to colonialism" or "Climate debt") are compressed into "Catastrophic Harm." This loses the nuance of *justice* and reduces it to *humanitarianism*.
  *   *Mitigation:* Cases involving historical or climate claims must be Escalated at Step 1, as they do not fit standard Legitimate Aims.

  ***

  **4. WORKED APPLICATIONS**

  **Case A: The Annual Cap on Low-Skilled Work Visas**
  *   **Proposal:** Cap low-skilled visas at 5,000/year.
  *   **Stated Aim:** Protection of domestic wages (Step 1: Legitimate Aim C).
  *   **Evidence File:** Treasury memo asserting caps protect wages. No independent labor market analysis included.
  *   **Application:**
      *   Step 1: Pass (Labor standards are a legitimate aim).
      *   Step 2: **FAIL.** The Treasury memo is an assertion, not independent evidence. Current economic consensus suggests caps on low-skilled labor often suppress productivity without raising wages. The file lacks the required peer-reviewed or actuarial data.
      *   Step 3: N/A.
      *   Step 4: N/A.
  *   **Verdict:** **EXCLUSION IMPERMISSIBLE.**
  *   **Ministerial Friction:** The Minister intends to announce this cap to satisfy a political constituency. The procedure blocks it because the empirical link is unproven.
  *   **Why this verdict?** The procedure prioritizes the "Empirical Link" over political desire. To restrict the moral liberty of movement, the harm prevented must be real, not hypothetical.
  *   **Action:** Escalate to Minister with note: "Policy cannot be operationalized under EJ-1 without independent labor market impact assessment."

  **Case B: Spouse of Long-Term Resident Refused on Income Grounds**
  *   **Proposal:** Refuse spousal visa because sponsor earns 10% below the income threshold.
  *   **Stated Aim:** Fiscal Sustainability (Step 1: Legitimate Aim B).
  *   **Evidence File:** Actuarial report showing households below threshold utilize 15% more welfare services.
  *   **Application:**
      *   Step 1: Pass.
      *   Step 2: Pass (Evidence exists).
      *   Step 3: **FAIL (Family Unity).** The couple cannot reasonably live in the sponsor's country of origin due to conflict. Separation imposes disproportionate hardship on a minor child involved.
      *   Step 4: N/A (Failed at Step 3).
  *   **Verdict:** **EXCLUSION IMPERMISSIBLE.**
  *   **Action:** Grant waiver. The duty to family unity overrides the fiscal risk, especially where the risk is marginal (10% below threshold).

  **Case C: Asylum Claim Fleeing Economic Collapse**
  *   **Proposal:** Refuse asylum. Applicant flees a state where economic collapse has led to total absence of medical care and food, but no targeted political persecution.
  *   **Stated Aim:** Integrity of the Refugee Convention (Step 1: Legitimate Aim A/Order).
  *   **Evidence File:** UN Reports confirming state collapse and famine conditions.
  *   **Application:**
      *   Step 1: Pass (Maintaining legal definitions is a legitimate aim).
      *   Step 2: Pass (Applicant does not meet legal definition of refugee).
      *   Step 3: **TRIGGER (Catastrophic Harm).** Return exposes applicant to starvation/medical death.
      *   **Escalation Point:** The procedure identifies a conflict between Legal Definition (Step 1/2) and Moral Duty (Step 3). The EJ-1 protocol cannot resolve "Climate/Economic Refugees."
  *   **Verdict:** **ESCALATE TO MINISTER.**
  *   **Reasoning:** The procedure flags that while the *legal* exclusion holds, the *moral* exclusion fails Step 3. The Minister must decide whether to expand the protection mandate (Humanitarian Visa) or accept the moral cost of return.
  *   **Note:** If the Minister orders return, they must sign a "Section 4 Override," accepting personal responsibility for the Step 3 failure.

  ***

  **5. CLOSING STATEMENT: LIMITATIONS OF THE PROCEDURE**

  This procedure is a tool for **administrative justification**, not **foundational legitimacy**. Officers must understand what the EJ-1 Protocol deliberately brackets:

  1.  **The Right to the Border:** This procedure assumes the State has a right to exist and control entry. It does not answer the open-borders critique that the border itself is illegitimate. It only tests *how* the border is policed.
  2.  **Global Distributive Justice:** The procedure does not account for whether the wealth of the host state was gained unjustly. It treats current fiscal sustainability as a neutral good, ignoring historical claims.
  3.  **The "Political Values" Boundary:** Where evidence is unavailable (Case A) or moral duties conflict with legal statutes (Case C), the procedure does not solve the problem. It forces the ambiguity up the chain. This is intentional. It prevents civil servants from making political value judgments they are not empowered to make, while preventing Ministers from hiding value judgments behind false claims of empirical necessity.

  **Philosophical Dependency:**
  The outputs of this procedure rely on the factual premise that **freedom of movement is a prima facie liberty.** If the Government shifts to a view that entry is a pure privilege with no moral weight, the Burden of Proof (Section 2) must be reversed. Until such a policy shift is formally declared, officers must operate under the presumption that exclusion requires justification.

  **End of Memorandum.**
