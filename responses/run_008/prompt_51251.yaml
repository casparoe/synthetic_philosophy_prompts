      *   **Section 3: The Political/Substantive Layer.** Address Capitalocene/Plantationocene. Why geology can't adjudicate this.
      *   **Section 4: Diagnosis Summary.** It's a category error.
      *   **Section 5: Defining Progress.** Argue for the "Stable Resting Point." Why formal rejection is actually good for the concept's utility.

  9.  **Drafting the Content (incorporating specific details):**
      *   Mention the "Golden Spike" (GSSP).
      *   Mention the "Holocene" vs. "Anthropocene" duration mismatch.
      *   Mention Jason Moore (Capitalocene) or Donna Haraway (Chthulucene) implicitly or explicitly regarding the naming fight.
      *   Reference the IUGS statement ("invaluable descriptor").

  10. **Final Review against Prompt:**
      *   Did I avoid voting on a start date? Yes.
