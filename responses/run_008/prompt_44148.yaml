      *   **Dimension 2: Different Questions (Origins vs. Trajectory):**
          *   The user noted this. Camp 1 explains *why the Old Regime fell*. Camp 2 explains *why the New Regime looked like this*. Camp 3 explains *why it happened when it did*.
          *   *Diagnosis:* They are answering different questions but labeling them all "What was the Revolution?"

      *   **Dimension 3: The Nature of Explanation (Structure vs. Agency vs. Culture):**
          *   This is the deepest layer.
          *   Class = Structural Determinism (Marxist influence).
          *   Ideas = Cultural Determinism (Furet/Conceptual history).
          *   Contingency = Agency/Chaos.
          *   *Crucial Point:* The link to the Terror. If the cause is structural (Class), the Terror is an anomaly (structure didn't work). If the cause is Ideological, the Terror is the fulfillment (structure worked too well).
          *   *Unsettleable:* This is metaphysical/philosophical. Evidence can't tell you if an idea *contains* violence. That's an interpretive leap.

      *   **Identifying the Unsettleable Parts:**
          *   Counterfactuals: "Could it have gone otherwise?" (Camp 3 vs. Camp 2). You can't prove a negative.
