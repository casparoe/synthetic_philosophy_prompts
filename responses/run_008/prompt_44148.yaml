answer: |-
  Your observation is exceptionally sharp. You have identified that the historiographical stalemate over the French Revolution is not merely a disagreement about data, but a disagreement about *what kind of thing history is*.

  The standoff you describe is not primarily substantive (about facts), nor purely verbal (about definitions). It is **categorical and normative**. The camps are disagreeing about the *ontology* of the Revolution (what kind of object is it?) and the *moral stakes* of interpreting it (what does the Terror say about us?).

  Here is the diagnosis of the standoff, broken down by the layers of disagreement you identified.

  ### 1. The Verbal Layer: Conflicting Definitions of "Cause"
  You asked if the camps are using the word *cause* to mean different things. The answer is yes. They are operating on different temporal and mechanical scales, but they all claim to be answering "Why did the Revolution happen?"

  *   **The Class Camp (Structural/Long-term):** For this group, "cause" means **precondition**. They are asking: *What made the Old Regime unsustainable?* Their explanation is sociological. In their view, the Revolution is the political expression of a prior economic reality. Because they view the cause as a slow-moving structural shift, the Terror must be an anomaly—a "friction" caused by resistance to the inevitable. If the cause is a natural historical force (class rise), the violence is an unfortunate side effect, like fever during growth.
  *   **The Ideas Camp (Discursive/Logical):** For this group, "cause" means **logic**. They are asking: *What made the New Regime take this specific shape?* Their explanation is philosophical. They argue that the new political language (popular sovereignty, the general will) contained no mechanism for loyal opposition. Therefore, the Terror is not an accident; it is the *actualization* of the cause. If the cause is a new way of thinking, the violence is the conclusion of the syllogism.
  *   **The Contingency Camp (Event/Short-term):** For this group, "cause" means **trigger**. They are asking: *Why did it happen in 1789 and not 1779 or 1799?* Their explanation is narrative. They focus on the breakdown of trust, the king's flight, the war. For them, the Terror is a panic response to specific threats, not a structural necessity or a logical conclusion.

  **Diagnosis:** This part of the disagreement is verbal. They are talking past each other. The Class camp explains the *collapse of the monarchy*; the Ideas camp explains the *rise of the Jacobins*; the Contingency camp explains the *timing of the explosion*. Because they all label this "The Cause of the Revolution," they appear to be fighting over the same ground when they are actually mapping different territories.

  ### 2. The Substantive Layer: The Object of Study
  You asked if they are answering different questions under one name. This is the deeper substantive issue. The camps cannot agree because they cannot agree on **when the Revolution began and ended.**

  *   If the Revolution is **1789** (the breakdown of feudalism), the Class argument looks strongest.
  *   If the Revolution is **1793–94** (the Reign of Terror), the Ideas argument looks strongest.
  *   If the Revolution is **1789–1799** (the chaotic decade), the Contingency argument looks strongest.

  The Class camp treats the Terror as a deviation from the Revolution's true path (liberal bourgeoisie). The Ideas camp treats the Terror as the Revolution's truest expression (radical democracy).

  **Diagnosis:** This is a substantive disagreement about *periodization*, but it is driven by a normative choice. Historians choose the start and end dates that best support their theory of what matters. No amount of archival work can settle this, because the archives contain evidence for all three periods. Choosing which period defines "The Revolution" is an interpretive act, not an empirical one.

  ### 3. The Unsettleable Layer: The Normative Stake
  This is the core of your insight regarding the link between *Cause* and *Terror*. You noticed that views on causation move in lockstep with views on the violence. This is because the debate is ultimately about **the moral legitimacy of modern politics.**

  *   **The Class Camp wants to save the Revolution.** If the Revolution was the rise of the productive middle class against parasites, it is a "good" revolution. Therefore, the Terror must be explained away as circumstantial (war, famine). If the Terror was inherent, the "good" revolution is tainted.
  *   **The Ideas Camp wants to critique Modernity.** (Heavily influenced by François Furet). If the Revolution invented modern democratic totalitarianism, then the Terror was not a mistake; it was the blueprint. This camp is often less interested in "saving" the Revolution than in understanding the dark potential of democratic language.
  *   **The Contingency Camp wants to humanize the Actors.** They resist both determinisms. They argue people were scared and made bad choices. This preserves moral agency but offers less grand theoretical satisfaction.

  **What Evidence Cannot Settle:**
  No archival discovery can settle the disagreement about **counterfactuals** and **inherence**.
  1.  **Inherence:** You cannot find a document that proves whether the Terror was *latent* in Rousseau's writings. That is a philosophical judgment, not a historical fact. One can read the *Social Contract* and see liberty; another can read it and see the guillotine. The text remains the same; the "logic" is imposed by the reader.
  2.  **Counterfactuals:** The Contingency camp says "it could have gone otherwise." The Ideas camp says "it had to end this way." You cannot run the experiment again. Evidence tells us what *did* happen, not what *could* have happened.

  Therefore, the link you observed (Class $\rightarrow$ Terror is accidental; Ideas $\rightarrow$ Terror is inevitable) is not a logical necessity derived from evidence. It is a **protective belt** around each theory. Each camp adjusts its view of the Terror to protect its view of the Cause from moral refutation.

  ### 4. Path to Progress
  If this diagnosis holds, progress will not come from finding new letters from Robespierre or new tax rolls from 1788. The evidence is already sufficient to support all three narratives depending on how you weight it. Progress requires a change in how the question is framed.

  **A. Split the Question (Periodization)**
  Stop asking "What was the Revolution about?" and start asking "What explains the collapse of the Old Regime, and what explains the rise of the Terror?"
  *   Acknowledge that the Class argument explains 1789 well (elite conflict, fiscal crisis).
  *   Acknowledge that the Ideas argument explains 1793 well (political culture, exclusion of opposition).
  *   Acknowledge that the Contingency argument explains the transition between them (war, flight to Varennes).
  *   *Progress:* Admitting that the Revolution is not one event with one cause, but a chain of distinct regimes with distinct causal mechanisms.

  **B. Distinguish "Conditions" from "Triggers" from "Scripts"**
  Adopt a shared vocabulary to prevent the verbal confusion.
  *   **Conditions:** (Class/Social) The fuel. Necessary, but not sufficient.
  *   **Scripts:** (Ideas) The language available to actors. Limits what can be thought, but doesn't determine what is done.
  *   **Triggers:** (Contingency) The spark. Determines timing and specific trajectory.
  *   *Progress:* Agreeing that a full explanation requires all three, and arguing only about the *weighting*, not the existence, of each.

  **C. The Honest Argument (Accepting the Eternal Debate)**
  If the camps refuse to split the question, you must accept that this argument should run forever. Why? Because it is not really about France. It is a proxy war about **political hope.**
  *   To believe the Class thesis is to believe that history has a direction and that violence is an aberration in the march of progress.
  *   To believe the Ideas thesis is to believe that our political concepts contain hidden dangers that can unleash violence even with good intentions.
  *   To believe the Contingency thesis is to believe that history is chaotic and relies on the virtue of leaders.

  **Conclusion**
  The standoff is not substantive in the sense that more data could resolve it. It is a **philosophical disagreement masquerading as a historical one.** The correlation you noticed (Cause $\leftrightarrow$ Terror) exists because the "Cause" is chosen specifically to justify a moral judgment on the "Terror."

  Progress for an amateur (or a professional) lies in recognizing that "What was the Revolution?" is a trap. It demands a singular essence for a complex event. The only honest answer is: *It depends on which year you mean, and what you think politics is for.* If you can hold the Class, Ideas, and Contingency arguments in your head simultaneously as overlapping layers rather than competing truths, you have moved beyond the stalemate.
