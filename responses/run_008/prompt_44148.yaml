          *   Is it about what counts as an *explanation* (structure vs. agency)?
          *   Identify what parts cannot be settled by evidence.
          *   Suggest what would count as progress (distinctions, splitting questions, accepting eternal debate).
      *   **Constraint:** Base the diagnosis on *what each camp actually says*, not on a survey of the Revolution itself.

  2.  **Deconstruct the Three Camps (as described by the user):**
      *   *Camp 1 (Class/Social):* Rising bourgeoisie vs. privileged order. Terror = incidental/circumstantial (conflict turning on itself). *Status:* Professional historians largely reject this (Alfred Cobban, William Doyle, etc., revisionists).
      *   *Camp 2 (Ideological/Cultural):* New political language (Rousseau, General Will). Terror = inherent logic/conclusion of the ideology. (François Furet is the key figure here).
      *   *Camp 3 (Contingent/Circumstantial):* War, harvest, panic. Things could have gone otherwise. (Simon Schama, Colin Jones, etc.).

  3.  **Analyze the User's Core Insight (The Correlation):**
      *   Class $\rightarrow$ Terror is accidental.
      *   Ideas $\rightarrow$ Terror is inevitable.
      *   *Hypothesis:* The debate isn't just about 1789; it's a proxy war about the nature of political violence and modernity.

  4.  **Drafting the Diagnosis - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the user's observation. Validate that their intuition about the correlation (Cause $\leftrightarrow$ Terror) is correct and central to the stalemate.

      *   **Dimension 1: Verbal vs. Substantive (The Definition of "Cause"):**
          *   *Class Camp:* Uses "cause" as *sociological precondition*. (The fuel).
          *   *Idea Camp:* Uses "cause" as *discursive logic*. (The spark + the blueprint).
          *   *Contingency Camp:* Uses "cause" as *triggering event*. (The match).
