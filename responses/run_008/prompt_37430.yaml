  3.  **Identify Conflations:**

      *   **Conflation 1: The Logical Frame Problem vs. The Philosophical Frame Problem.**
          *   *Logical:* How to efficiently represent non-change in a formal system. (Mostly solved).
          *   *Philosophical/Cognitive:* How does a system determine *relevance* without checking everything? (Not solved).
