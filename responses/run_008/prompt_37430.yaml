answer: |-
  Your skepticism is well-founded. Your cousin's summary is a very common "engineer's shorthand" version of the Frame Problem, but it glosses over a critical split in the definition that changes everything about whether the problem is actually "solved."

  He is conflating the **Representational Frame Problem** (a technical logic puzzle) with the **Philosophical Frame Problem** (a cognitive science puzzle about relevance).

  Here is a breakdown of what an expert would accept, where the conflation happens, and why the "just compute" conclusion is controversial at best.

  ### 1. What the cousin got right (The Technical History)
  If you asked a classical AI researcher (symbolic AI), they would nod along with about 80% of his historical summary.

  *   **The Definition:** He is correct that the original Frame Problem (McCarthy & Hayes, 1969) was about formal logic. If you represent the world as a set of logical facts (fluents), and an action occurs, how do you specify what changes without writing infinite axioms specifying what *doesn't* change?
  *   **The 60s Bottleneck:** He is right that early systems required "frame axioms" for every non-change (e.g., `PickUp(x)` implies `Color(x)` stays same). This caused a combinatorial explosion.
  *   **The 80s "Solution":** He is technically correct that the *representational* problem was largely resolved in the 80s and 90s. Work by Ray Reiter (Successor State Axioms), McCarthy (Circumscription), and others created formalisms where persistence is the default. You no longer need to write zillions of axioms to say the wall color didn't change when you moved the block.

  **Expert Verdict:** On the history of *logical formalisms*, your cousin is solid.

  ### 2. The Sneaky Conflation: Relevance vs. Representation
  This is where his story falls apart. He treats the solution to the *representation* issue as a solution to the *relevance* issue.

  *   **The Technical Problem:** "How do I write down the rules of persistence efficiently?" (Solved).
  *   **The Philosophical Problem:** "How does the system know *which* rules are worth checking in the first place?" (Not Solved).

  This is the version Daniel Dennett and Jerry Fodor were talking about. Dennett's robot example (the one your cousin cited) wasn't about the robot failing to write down axioms; it was about the robot deducing that pulling the wagon didn't change the color of the walls, but failing to deduce that pulling the wagon might pull the bomb out of the room with it.

  Fodor framed this as the problem of **isotropy**: in principle, *anything* in the universe could be relevant to *anything* else. To act rationally, a mind needs to filter out the infinite irrelevant facts instantly.

  **The Conflation:** Your cousin claims the 80s solutions fixed this. They didn't. They fixed the bookkeeping of facts *once you already knew which facts mattered*. They did not solve the problem of how a system determines relevance in an open world without checking everything.

  ### 3. Does "Just Compute" Follow?
  Your cousin's conclusion—"With big neural nets now it's just a compute question"—is a specific worldview known as **connectionist dissolution**.

  The argument is: *Symbolic AI needed explicit rules for relevance. Neural nets learn statistical correlations. If you have enough data and compute, the net implicitly learns that 'wall color' is statistically independent of 'wagon pulling,' so you don't need to solve the frame problem explicitly.*

  **Why an expert might push back:**
  1.  **Implicit vs. Explicit:** Neural nets do not maintain a persistent world model. They predict the next token or action based on patterns. If the distribution shifts (e.g., a new physics engine, a new room layout), the "statistical persistence" breaks. The Frame Problem is fundamentally about **causal invariance**, not statistical frequency.
  2.  **Brittleness:** LLMs and RL agents still struggle with long-horizon state tracking. If you ask an LLM to simulate a game state over 100 turns, it often hallucinates that an object moved or changed color without cause. This *is* a modern manifestation of the Frame Problem. It didn't vanish; it just became a training error rather than a logical error.
  3.  **Compute isn't a Magic Wand:** Throwing compute at the problem assumes the solution scales smoothly. But if the architecture doesn't have a mechanism for "object permanence" or "causal separation," more compute just helps it memorize more specific scenarios, not generalize the principle of persistence.

  **Expert Verdict:** Most cognitive scientists and neuro-symbolic researchers would say the "just compute" claim is an article of faith, not an established fact. It works *until it doesn't*, and when it fails, it fails in ways that look exactly like the Frame Problem (ignoring relevant state changes or hallucinating irrelevant ones).

  ### 4. Technical vs. Philosophical: Does it matter for LLMs?
  Yes, it matters immensely for how you evaluate LLMs.

  *   **If he means the Technical Problem:** LLMs arguably bypass this. They don't use logic axioms, so they don't need frame axioms. They generate text that *looks* like it understands persistence.
  *   **If he means the Philosophical Problem:** LLMs are arguably terrible at this. This is the **Context Problem**. An LLM has a finite context window. It literally cannot "check" facts outside that window. It has no built-in mechanism to decide what information from its training data is relevant to the current prompt without explicit attention mechanisms, which are computationally expensive and imperfect.

  When an LLM hallucinates, it is often because it failed to constrain its generation based on persistent facts established earlier in the conversation. That is the Frame Problem in a trench coat.

  ### Summary for your next dinner
  You can tell your cousin his history is good, but his ontology is mixed.

  1.  **Acknowledge:** "You're right that Reiter and McCarthy fixed the *axiomatization* explosion in the 80s."
  2.  **Push Back:** "But that solved the bookkeeping, not the *relevance* problem. Fodor wasn't being mystical; he was pointing out that knowing what *not* to compute is the hard part."
  3.  **The NN Point:** "Neural nets don't solve the Frame Problem; they hide it. They trade logical guarantees for statistical guesses. When an LLM forgets a constraint from 10 pages ago, that's the Frame Problem coming back to bite us. More compute helps, but it doesn't change the architecture's lack of a persistent world model."

  **Bottom Line:** The technical version is solved. The cognitive version is not. Your cousin is claiming that because we solved the technical version, the cognitive version is now just an engineering budget issue. That is a bold claim that the last five years of LLM hallucinations suggest is premature.
