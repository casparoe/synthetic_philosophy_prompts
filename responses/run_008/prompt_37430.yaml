      *   *Claim 5: Fodor made it mystical.*
          *   **Verdict:** Controversial but common ML take. Fodor framed it as a problem of global relevance/isotropy of mind (The Frame Problem of Cognitive Science). ML engineers often dismiss this as hand-waving, but it's a distinct problem.
