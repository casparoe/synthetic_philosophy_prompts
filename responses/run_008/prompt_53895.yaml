answer: |-
  1. When More tells Roper to leave the laws "standing" for protection rather than cutting them down to get the Devil, he defends legal proceduralism over the public moral appeal required for Rawlsian civil disobedience.
  2. His quiet resignation as Chancellor functions as pure conscientious refusal, withdrawing cooperation without the public, communicative challenge to the community's sense of justice that defines civil disobedience.
  3. By refusing to explain his reasoning to Norfolk, More denies the communicative component essential to civil disobedience, forcing the state to interpret his silence rather than engaging in the moral dialogue Rawls requires.
  4. More only articulates his dissent at trial after Rich's perjury destroys his legal shield, suggesting his resistance becomes communicative only when the state forces his hand rather than by his own design.
  5. The Common Man's direct addresses reveal that the "community" Rawls appeals to is too passive to receive moral communication, exposing a gap in liberal theory where silence is coerced into consent by bystanders.
