answer: |-
  Here is a lesson plan designed for realism, philosophical rigor, and narrative utility. It avoids the "lecturing at a whiteboard" trope by making the students the primary agents of the metaphysical crisis.

  ### The Lesson Plan: "The Ontology Market"

  **Class:** Intro to Metaphysics (PHIL 201)
  **Time:** 50 Minutes
  **Students:** 15 Sophomores (Seminar style, tables in a U-shape)
  **Props:**
  *   50 identical Lego bricks (2x4, same color).
  *   One heavy-duty stapler.
  *   One generic ball of yarn.
  *   A bag of cheap candy (Hershey's Kisses).
  *   "Ontology Bucks" (slips of paper with her signature).
  *   Chalk.

  **Learning Objective:** To demonstrate the *Sorites Paradox* applied to material composition, forcing students to confront the lack of a non-arbitrary boundary between "many" and "one."

  ---

  #### Part 1: The Setup (00:00 – 00:10)
  **Action:** She does not write the title on the board. She places the stapler on the desk. She places a single Lego brick next to it.
  **The Hook:** "I have five minutes of candy on this desk. To get it, you have to tell me what exists. Not what you *see*, but what *is*."
  **The Rules:**
  1.  She holds up an object or configuration.
  2.  Students vote: **ONE** (It is a single object) or **MANY** (It is a collection of objects).
  3.  If the class agrees unanimously (15-0), everyone gets a Buck.
  4.  If there is dissent, nobody gets a Buck.
  5.  **The Catch:** She will change the object incrementally. If you change your vote from the previous round without a "metaphysical justification," you lose a Buck.

  **Why this works:** It creates immediate social pressure. They want the candy (agreement), but they fear losing points (inconsistency).

  #### Part 2: The Gradient (00:10 – 00:30)
  **The Sequence:**
  1.  **The Stapler:** (Obvious ONE). Everyone votes ONE. Easy money.
  2.  **The Single Brick:** (Obvious ONE). Everyone votes ONE.
  3.  **Two Bricks (Side by Side, not touching):** (Obvious MANY).
  4.  **Two Bricks (Pressed together):** *The first crack.* Some say MANY (just touching), some say ONE (fused by friction). Dissent. No candy.
  5.  **The Chain:** She begins clicking bricks together, one by one, in front of them.
      *   *3 Bricks:* Mostly MANY.
      *   *5 Bricks:* Split vote.
      *   *10 Bricks:* Mostly ONE ("It's a chain").
      *   *20 Bricks:* Consensus ONE.
  6.  **The Reverse:** She starts removing them, one by one.
      *   *19 Bricks:* Still ONE?
      *   *15 Bricks:* Still ONE?
      *   *5 Bricks:* Wait, earlier you said 5 was MANY. Now you say ONE?

  **The Trap:** At no single click did the "object-ness" clearly change. But at the start, it was a pile. At the end, it was a chain. Somewhere in the middle, they lied to themselves to keep their points.

  #### Part 3: The Biological Turn (00:30 – 00:40)
  **Action:** She takes the ball of yarn. She pulls a strand.
  **The Question:** "Is the yarn in the ball one object?" (Yes).
  **The Action:** She pulls a foot of yarn off the ball but doesn't cut it. "Is this loop one object or two?"
  **The Action:** She cuts it. "Now?"
  **The Kicker:** She touches her own hair (or a wig/prop if she doesn't want to use her own). "If I cut this hair, when did it stop being part of the 'one object' that is me? When it left the follicle? When it hit the floor?"
  **Why:** This bridges the abstract Legos to the human body, priming the theme of the marriage (is the relationship a "thing" or just two people touching?).

  #### Part 4: The Debrief (00:40 – 00:50)
  **Action:** She stops the game. No one has won much candy. The room is frustrated.
  **The Board Work:** She finally turns to the chalkboard. She draws three columns.
  1.  **The Nihilists:** (Write: "Nothing composes.") "Some of you wanted to say 'MANY' even for the stapler. Atoms only. No tables, no chairs."
  2.  **The Universalists:** (Write: "Everything composes.") "Some of you wanted to say 'ONE' for the scattered bricks. If they exist, they compose a 'scattered object'."
  3.  **The Restrictivists:** (Write: "Only some things compose.") "Most of you tried to find the line. You wanted the chain to be real, but the pile to be fake."

  **The Closing Line:** "You lost your candy because the world didn't give you a rulebook. You had to write one. Next week: Did you write a law of physics, or a rule of grammar?"

  ---

  ### What Will Predictably Go Wrong (Failure Modes)

  If you want the scene to feel authentic, include one of these hiccups. Nineteen-year-olds are trained to game the system, not do metaphysics.

  1.  **The Pragmatic Dodge:** A student will raise their hand and say, "It's one object if I can lift it all at once." They are defining *object* by *utility*, not *ontology*.
      *   *Professor's Counter:* "If I glue a feather to the moon, can you lift the 'one object'? No. But is it still one object?"
  2.  **The Semantic Nihilist:** One smart-aleck will realize the trick. He will vote "MANY" for everything (including the stapler) to ensure he never has to change his vote. He ruins the curve for everyone.
      *   *Narrative Use:* This annoys the other students. It shows the tension between "being right" and "playing the game."
  3.  **The "It Depends" Crowd:** They will refuse to vote until she defines "object."
      *   *Professor's Counter:* "I can't define it. That's the job. If you knew what an object was, you wouldn't need the class."
  4.  **Boredom/Disengagement:** If the Legos feel too childish, they tune out.
      *   *Fix:* Make the stakes feel intellectual, not just candy. She should look genuinely puzzled by their answers, modeling that *she doesn't know either*.

  ---

  ### The Colleague's Critique: Where the Game Fails

  This is crucial for your subplot. The colleague (let's call him Mark) is going to argue that this exercise is **pedagogically effective but metaphysically dishonest.**

  **The Critique:**
  The game demonstrates *Epistemic Vagueness* (we don't know where the line is), but it treats it as *Ontic Vagueness* (there is no line in reality).
  By making the students *vote* and awarding points based on *consensus*, the Professor has implicitly taught them that composition is **Conventionalist**. She has shown them that *we decide* what counts as an object based on language, interest, or social agreement.

  **The Real Philosophical Problem:**
  A Realist (which Mark likely is) believes composition is a **brute fact**. Either the bricks compose a wall or they don't, regardless of whether humans are in the room to vote on it. The marriage either exists as a unit or it doesn't, regardless of whether the couple *feels* like a unit.
  The game cannot capture this because a classroom is inherently a social/conventional space. You cannot simulate "mind-independent reality" with a show of hands.

  **Is Mark Right?**
  Yes, mostly. The game smuggles in the answer that "composition is relative to conceptual schemes."
  *   **For the Novel:** This is gold. Your protagonist (let's call her Elena) is using the class to process her marriage. She wants to believe the marriage is a "Real Thing" (Realism). But her teaching method keeps proving it's a "Social Construct" (Conventionalism).
  *   **The Conflict:** Mark isn't being a jerk for no reason; he's pointing out that her pedagogy undermines her personal hope. If composition is just up to us, then her marriage falling apart is just a change in convention, not a tragedy of a broken entity. If it's Realism, the breakage is objective.
  *   **Her Choice:** She can concede Mark is right (the game is just a heuristic, reality is harder) OR she can bite the bullet (reality *is* conventional, and that's why we have the power to fix it).

  ---

  ### Writer's Notes for the Scene

  **Sensory Details:**
  *   **Sound:** The *click* of the Legos is vital. It's a sharp, binary sound (connected/disconnected) that contrasts with the fuzzy metaphysical boundary.
  *   **Visual:** The pile of "Ontology Bucks" on the desk diminishing. The chalk dust on her fingers (she's fancy about chalk).
  *   **Pacing:** The voting should start fast (stapler, single brick) and slow down painfully as the chain grows. The silence should get heavier with each click.

  **Character Beat:**
  *   When she holds up the "5-brick chain," have her hesitate. For a split second, she isn't looking at the Legos; she's looking at her wedding ring (or the bare finger where it was).
  *   When the "Semantic Nihilist" student ruins the vote, don't make her angry. Make her look *relieved*. He proved the point better than she could: if you change the definitions, the reality shifts.

  **Dialogue Snippet:**
  > "Why did you vote 'One' for ten bricks but 'Many' for five?"
  > "Because ten feels like a chain. Five is just... a few."
  > "So existence is a feeling?"
  > "No. It's... functional."
  > "If I break your arm, does it stop being part of you because it's no longer functional? Or is it still you?"
  > (Silence)
  > "Take your candy. You earned it. You just don't know what you bought."

  This setup gives you a scene that is active, visually distinct, philosophically accurate enough to pass scrutiny, and thematically welded to the protagonist's internal arc.
