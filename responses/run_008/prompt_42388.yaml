prompt: |-
  I help run the facebook group for my neighborhood, few thousand members. Lately someone has been posting rants calling one of our city council members corrupt and a "puppet of developers." On its own whatever, people trash local politicians all the time. But the last post went further: it listed the cafe where she has breakfast every morning, the gym she goes to and the hours she's usually there, and ended with something like "if you see her, let her know what you think." A bunch of people have been showing up there to confront her, and yesterday a small crowd basically boxed her in outside the gym until her husband came. Nobody touched her, but she's visibly shaken and asked me directly to take the posts down.

  The guy who posted is now accusing me of censorship if I remove it. His claim is that it's all true and all public info — she really does eat there, and everything he posted he found from her own social media. He says if people choose to be hostile that's on them, not on his posts, and that a "free exchange of opinions" was kind of the whole point of the group. Some members back him up and say slippery slope: today I delete "criticism of a politician," tomorrow I'm deleting anything I personally disagree with.

  I'm torn. I do think he should be allowed to say she's corrupt, that's normal political speech to me. But listing her routines and telling people to go find her feels different in a way I can't fully articulate — like the same words matter differently depending on who's reading them and what they can do with them. Is there an actual principled line here, or am I just making a gut call and dressing it up? And does it matter that he didn't explicitly tell anyone to threaten her? Help me figure out where the line is and how to explain the removal (or non-removal) to the group in a way that isn't just "I felt like it."
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Context:** Facebook group for a neighborhood (few thousand members). The user is an admin/moderator.
      *   **The Incident:** A member is posting rants calling a city council member corrupt/puppet.
      *   **Escalation:** The latest post listed specific locations (cafe, gym) and times (routines) of the council member, ending with "if you see her, let her know what you think."
      *   **Consequences:** People are showing up to confront her. A crowd boxed her in outside the gym. She is visibly shaken and asked for the posts to be removed.
      *   **The Poster's Defense:** Claims censorship, says info is public/true, claims hostility is on the actors not the post, invokes "free exchange of opinions."
      *   **Supporters:** Some members agree, citing slippery slope (today criticism, tomorrow disagreement).
      *   **The User's Dilemma:** Torn between allowing political speech and recognizing the danger of doxxing/harassment. Wants a principled line, not just a gut call. Needs help explaining the decision to the group.
      *   **Key Question:** Is there a principled line? Does the lack of explicit threat matter? How to communicate the decision?

  2.  **Determine the Core Issue:**
      *   This isn't just about "political speech." It's about **doxxing** and **incitement of harassment**, even if veiled.
      *   The shift is from *criticism of actions/policy* to *targeting the person's physical safety and privacy in the real world*.
      *   The "public info" defense is a common tactic but doesn't negate the harm of aggregating that info to facilitate harassment.
      *   The "I didn't say hurt her" defense ignores the context of "let her know what you think" combined with a mob already forming.

  3.  **Establish the Principled Line (The "Why"):**
      *   **Public Forum vs. Private Platform:** Facebook groups are private platforms, not public squares. The First Amendment doesn't apply to private admins. However, the *principle* of free speech is still valuable.
      *   **Speech vs. Conduct:** Speech that facilitates harmful conduct crosses a line.
      *   **Doxxing:** Publishing private or routine information with the intent (or foreseeable result) of enabling harassment is universally against community safety standards (and Facebook's own Community Standards).
      *   **Incitement:** "If you see her, let her know what you think" in the context of a heated political environment is an implicit call to action. It's not explicit violence, but it's *harassment incitement*.
      *   **Safety vs. Speech:** The council member's right to exist in public spaces without being mobbed outweighs the poster's right to facilitate that mobbing.
      *   **The "Slippery Slope" Rebuttal:** Deleting doxxing/harassment is not the same as deleting policy criticism. The line is *behavioral impact*, not *political content*.

  4.  **Drafting the Advice:**
      *   **Validation:** Acknowledge the user's gut feeling is correct. It's not just a gut call; there are established norms and safety principles here.
      *   **The Line:** Define the distinction between *criticism of official conduct* vs. *facilitation of real-world harassment*.
      *   **Facebook's Rules:** Mention that Facebook itself bans doxxing and coordinating harm. This gives the admin external backing.
      *   **Legal/Safety Context:** While not legal advice, mention that this behavior borders on stalking/harassment legally.
      *   **Communication Strategy:** How to explain this to the group without sounding authoritarian. Focus on *safety* and *community standards*, not *political agreement*.

  5.  **Refining the Argument (Addressing Specific Counter-arguments):**
      *   *"It's public info":* Aggregating public info to enable harassment is still doxxing.
      *   *"I didn't say hurt her":* Implicit incitement ("let her know what you think" + mob) is dangerous.
      *   *"Slippery Slope":* The slope isn't slippery if the rule is specific (no doxxing/harassment) rather than vague (no criticism).

  6.  **Action Plan:**
      *   Remove the post.
      *   Ban or suspend the user (depending on group rules, but likely a warning/ban is needed given the escalation).
      *   Post a statement to the group.
      *   Document everything (in case police get involved).

  7.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Validate the user. Their gut is right. This is doxxing.
      *   *The Principle:* Distinguish between "Speech about power" and "Speech that endangers safety."
      *   *The "Public Info" Fallacy:* Explain why this doesn't matter when intent is harassment.
      *   *The "Implicit Threat":* Explain context matters.
      *   *Facebook's Policy:* Use Meta's rules as a shield.
      *   *The Statement:* Provide a template for the group announcement.
      *   *Safety:* Advise the admin to protect themselves too.

  8.  **Final Review:** Does this answer the prompt? Yes. It addresses the principled line, the "explicit threat" question, and the communication strategy. It empowers the admin to act confidently. (Self-Correction: Make sure to emphasize that this is a *private* group, so First Amendment arguments from members are technically invalid, but focusing on *safety* is more persuasive than focusing on *authority*.)

  9.  **Final Polish:** Ensure tone is supportive, clear, and firm. (Proceed to generate output based on these thoughts.)
answer: |-
  You are not just making a gut call. You are identifying a well-established boundary in content moderation, community safety, and even law. Your intuition is correct: **There is a fundamental difference between criticizing a public official's actions and facilitating real-world harassment of their person.**

  Here is how to articulate the principled line, why the poster's defenses don't hold up, and how to communicate this to your group without looking like a censor.

  ### 1. The Principled Line: Policy vs. Person, Speech vs. Conduct

  The line you are looking for is the distinction between **political speech** and **doxxing/harassment incitement.**

  *   **Political Speech:** "Councilmember X voted for this zoning law because she is in the pocket of developers." This critiques her *official conduct*. It is protected, healthy, and necessary for democracy.
  *   **Doxxing/Harassment:** "Councilmember X is at this gym at 7 AM. Go tell her off." This targets her *private life and physical safety*. It moves the conflict from the ballot box or the comment section into the physical world.

  **Why the "Public Info" Defense Fails:**
  The poster claims the information is public. In the context of safety, **intent and aggregation matter.** Taking disparate pieces of public information (social media photos, public voting records) and aggregating them to create a "tracker" for the purpose of confrontation is the definition of doxxing. Facebook's own Community Standards prohibit posting someone's location to facilitate physical harm or harassment, regardless of whether the info was originally public.

  **Why the "No Explicit Threat" Defense Fails:**
  Incitement does not require the words "go hurt her." Context creates the meaning.
  *   **Context:** A heated political environment.
  *   **Action:** Publishing a schedule and location.
  *   **Call to Action:** "If you see her, let her know what you think."
  *   **Result:** A crowd physically boxing her in.

  When the foreseeable result of speech is a mob confronting an individual in a private space (a gym), the speech has crossed into **coordinating harassment.** It is the digital equivalent of handing out a flyer with a person's address and saying, "She deserves an earful."

  ### 2. Addressing the "Slippery Slope" Argument

  Your members are worried that if you delete this, you'll delete *any* criticism of politicians. You can neutralize this by making the rule specific to **behavior and safety**, not **content and opinion.**

  *   **The Rule isn't:** "No criticism of politicians."
  *   **The Rule is:** "No posting of private routines, locations, or personal contact info that facilitates real-world confrontation."

  This is not a slippery slope; it is a guardrail. You can explain that you will *always* defend the right to call a politician corrupt, incompetent, or wrong. You will *never* defend turning the group into a tool for tracking their physical movements.

  ### 3. Action Plan

  You need to act decisively. The situation has already escalated to physical intimidation (boxing her in).

  1.  **Remove the Post:** Do not leave it up "for context." It is an active safety risk.
  2.  **Sanction the User:** Given the escalation and the refusal to acknowledge the harm, a temporary or permanent ban is justified. He has shown he will not abide by safety norms.
  3.  **Document Everything:** Screenshot the post, the comments, and the reports. If the council member decides to involve law enforcement (stalking/harassment laws vary, but this often qualifies), your records may be relevant.
  4.  **Post a Statement:** You must explain this to the group transparently.

  ### 4. How to Explain This to the Group

  Do not frame this as "I am silencing a dissenting voice." Frame this as "I am keeping the community safe and compliant with platform rules."

  **Draft Statement for the Group:**

  > "Hi everyone, I want to address a recent removal and some questions about our group guidelines.
  >
  > We are a community forum dedicated to discussing local issues, policies, and neighborhood news. We strongly support robust debate, including criticism of elected officials. You are welcome to call out voting records, question decisions, and argue that a council member is wrong.
  >
  > However, there is a clear line between criticizing an official's **work** and targeting their **personal safety**.
  >
  > Recently, a post was removed not because it criticized a politician, but because it listed specific private locations and routines (gyms, cafes, times) with the instruction to confront her there. This resulted in members physically crowding an individual in a private space.
  >
  > **This violates our safety policies and Facebook's Community Standards regarding doxxing and coordinated harm.**
  >
  > To be clear:
  > 1. **Criticism of policy is welcome.**
  > 2. **Publishing locations/routines to facilitate real-world confrontation is not.**
  >
  > This is not about censorship; it is about ensuring that our online discussions do not translate into physical harassment offline. We want this to be a place for ideas, not a tool for intimidation. Thank you for helping us keep the neighborhood safe."

  ### 5. Why This Matters for You

  If you leave the post up and someone *does* touch her, or if she is injured fleeing a mob, you (as the admin) and the group could face significant liability. Facebook can also shut down your group for allowing coordinated harm.

  You are not the government. You do not have to uphold the First Amendment. You are a private citizen managing a private digital space. Your primary obligation is to the safety of your community members—including the ones who hold public office.

  **Summary:**
  Your gut is right. This is doxxing and incitement of harassment. Remove the post, ban the user if necessary, and state clearly that the rule is about **physical safety**, not **political opinion**. This protects the council member, protects your group from being shut down by Facebook, and protects you from liability.
