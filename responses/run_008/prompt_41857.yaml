answer: |-
  **Final Exam: Philosophy of Science**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Consider the claim that even if the world is thoroughly deterministic, it may not be predictable. Evaluate this claim by analyzing the following three specific obstacles to prediction:

  (i) **Sensitive Dependence on Initial Conditions:** Under chaotic dynamics, measurement error grows exponentially over time, meaning the prediction horizon grows only logarithmically with the precision of the initial measurement.
  (ii) **The Quantum Limit:** No measurement of a continuous state fixes it exactly due to fundamental uncertainty principles; note that any predictor physically embedded in the world, rather than standing outside it, is itself subject to that limit.
  (iii) **A Self-Reference Argument:** In the spirit of Popper, a predictor belonging to the system it predicts cannot fully predict its own future predictions, since a complete prediction would have to contain a prediction of itself, which raises a regress.

  For each obstacle, determine whether it renders prediction impossible merely **in practice** or **in principle**. You must explicitly defend this sorting. In doing so, you must address what "possible in principle" should mean in this context—in particular, whether a task may count as possible in principle when it requires unbounded, though at every stage finite, resources. Do not merely recite the distinction between laws and agents; demonstrate how each obstacle bears on the limits of inference.

  ***

  ### Model Answer

  To evaluate whether a deterministic world is predictable, we must first define "predictable in principle." I define this as physically possible for an embedded agent possessing unbounded, though at every stage finite, resources. This definition excludes logical contradictions and violations of physical law, but permits extreme engineering costs. If a task requires infinite precision or infinite energy, it is impossible in principle; if it merely requires vast but finite resources, it is impossible only in practice.

  Regarding obstacle (i), sensitive dependence (chaos) yields unpredictability only **in practice**. While error grows exponentially, the relationship between precision and horizon is logarithmic. For any finite future time *t*, there exists a finite initial precision *p* sufficient to predict the state within desired bounds. Although *p* may become astronomically high as *t* increases, it never becomes infinite for finite *t*. Therefore, an ideal predictor with unbounded finite resources could overcome this. The barrier is engineering, not physics.

  Regarding obstacle (ii), the quantum limit yields unpredictability **in principle**. Because the predictor is embedded, it is subject to the same physical laws as the system. If the uncertainty principle forbids the simultaneous exact measurement of conjugate variables, no amount of resources can circumvent this. Unlike chaos, where precision is costly but possible, here exactness is physically forbidden. Since deterministic prediction typically requires exact state specification, this physical law blocks prediction fundamentally, not just pragmatically.

  Regarding obstacle (iii), the self-reference argument yields unpredictability **in principle**. This is a logical barrier, not a resource one. If the prediction must include the act of prediction itself, completing the calculation requires completing a sub-calculation of itself, generating a regress similar to the Halting Problem. No allocation of resources resolves a logical contradiction. Thus, even a Laplacian demon embedded in the system faces this limit.

  However, the sorting itself involves a judgment call regarding the definition of "in principle." Specifically, obstacle (ii) relies on treating quantum limits as fundamental laws rather than contingent technological failures. If one adopts a hidden-variable interpretation (like Bohmian mechanics), the state is definite, and the limit returns to being practical (measurement disturbance). Furthermore, the definition of "in principle" regarding unbounded resources is contentious; if physicalism dictates that the universe contains finite information, then "unbounded resources" is itself a physical impossibility. Thus, while chaos is clearly practical and self-reference clearly logical, the quantum limit sits on the boundary between physical law and epistemic access, requiring a philosophical stance on the ontology of the wave function.

  ***

  ### Marking Scheme

  **Total Marks: 20**

  1.  **Definition of "In Principle" (4 marks)**
      *   *Requirement:* Must distinguish between logical/physical impossibility and resource constraints. Must address the "unbounded but finite resources" clause.
      *   *Typical Error:* Defines "in principle" vaguely as "logically possible" without addressing physical constraints or resource bounds.

  2.  **Analysis of Sensitive Dependence (4 marks)**
      *   *Requirement:* Classifies as practical impossibility. Justifies via the finite precision required for finite time horizons (logarithmic relation).
      *   *Typical Error:* Claims chaos makes prediction impossible in principle because precision requirements become "too high," conflating difficulty with impossibility.

  3.  **Analysis of Quantum Limit (4 marks)**
      *   *Requirement:* Classifies as in-principle impossibility (for embedded agents). Justifies via fundamental physical law forbidding exact state access regardless of resources.
      *   *Typical Error:* Treats quantum limits as merely technological measurement errors that better tools could fix.

  4.  **Analysis of Self-Reference (4 marks)**
      *   *Requirement:* Classifies as in-principle impossibility. Justifies via logical regress/contradiction rather than resource depletion.
      *   *Typical Error:* Dismisses the argument as merely psychological or claims a faster computer could solve the regress.

  5.  **Meta-Analysis/Judgment Call (4 marks)**
      *   *Requirement:* Identifies that the sorting depends on philosophical interpretations (e.g., ontology of quantum states or definition of physical possibility).
      *   *Typical Error:* Treats the classification as settled purely by physics without acknowledging the definitional stipulations required.

  **Closing Statement:**
  A B answer somewhere conflates practical with in-principle unpredictability, while an A answer keeps them apart across all three obstacles and flags at least one point where the sorting itself is a judgment call rather than something the physics settles.
