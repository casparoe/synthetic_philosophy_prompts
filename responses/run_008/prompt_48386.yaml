answer: |-
  # Seminar Handout: Desiderata for Theories of Interpersonal Aggregation

  **Course:** Graduate Seminar in Normative Ethics
  **Topic:** The Aggregation of Small Harms
  **Session:** 1 — Standards of Adequacy

  Before we evaluate specific theories (Totalism, Prioritarianism, Contractualism, etc.), we must establish the criteria by which they are judged. A theory of aggregation is not merely a formula; it is a response to a set of structural and intuitive constraints. Below are the five core desiderata any adequate theory must satisfy. 

  Note carefully the status of each: **Non-Negotiable** requirements are those where failure constitutes a formal defect (e.g., inconsistency), while **Contested** requirements represent substantive commitments that a reasonable minority of theorists reject. Where desiderata conflict, the tension is explicitly marked.

  ---

  ### 1. The Phenomenological Discrimination Requirement
  **Specification:** The theory must distinguish between *sub-experiential* harms (states that leave no trace in consciousness or memory, e.g., a pebble in the shoe forgotten by evening) and *registered* small harms (states that are consciously felt but minor, e.g., a distinct pinprick). It must assign moral weight to each and explain the basis of the difference, if any.

  *   **Motivating Case:** *The Forgotten Pebble vs. The Dust Speck.* 
      *   *Case A:* I place a pebble in 1,000 people's shoes; they feel it, then forget it immediately. 
      *   *Case B:* I alter the environment so 1,000 people suffer a sub-clinical dip in welfare they never notice. 
      *   If the theory treats these identically, it must explain why consciousness is irrelevant. If it treats them differently, it must explain why unnoticed harm counts (or doesn't). Parfit's "Dust Specks" often blurs this by assuming the speck is felt; a rigorous theory cannot assume that away.
  *   **Status:** **Contested.** 
      *   *Hedonists/Experientialists* argue sub-experiential harms have zero weight. 
      *   *Objective List/Theorists of Welfare* argue harm is objective and may exist without awareness. 
      *   *Note:* A theory that ignores this distinction entirely (treating all welfare dips as identical) fails this desideratum.

  ### 2. The Unit of Aggregation Requirement
  **Specification:** The theory must explicitly identify the *locus* of aggregation. It must state whether the fundamental unit is the *moment-of-experience*, the *whole-life*, or the *generation*. Consequently, it must either endorse Intra/Interpersonal Parity (a sum is a sum, regardless of distribution across persons) or provide a principled justification for Asymmetry.

  *   **Motivating Case:** *The Thousand Pinpricks.* 
      *   Is 1,000 pinpricks to Alice worse than 1 pinprick to each of 1,000 Alices? 
      *   *Intra-personal factors:* Fatigue, anticipation, and memory may make 1,000 pricks to one person worse than the sum of isolated pricks. 
      *   *Inter-personal factors:* If the unit is the person, the 1,000 Alices case might be fragmented such that no one suffers a "serious" harm. 
      *   The theory cannot simply assert "persons matter more"; it must derive this from the structure of welfare or agency.
  *   **Status:** **Contested.** 
      *   *Classical Utilitarians* demand Parity (moments are the unit). 
      *   *Contractualists & Person-Affecting Views* demand Asymmetry (persons are the unit). 
      *   *Failure Condition:* A theory that shifts units opportunistically to avoid counterexamples without a grounding principle fails.

  ### 3. The Sorites Resolution Requirement (Continuity vs. Threshold)
  **Specification:** The theory must declare whether there exists a *threshold* below which harms cannot sum to a serious harm, regardless of population size. 
  *   **If Yes (Threshold):** The theory must solve the *Location Problem*: it must explain why the threshold lies at point *X* rather than *X+1*, avoiding arbitrariness.
  *   **If No (Continuity):** The theory must accept that a sufficient number of trivial harms outweigh a severe harm (e.g., torture) and explain why this does not violate our considered judgments.

  *   **Motivating Case:** *Torture vs. Dust Specks.* 
      *   Can enough dust specks in eyes morally outweigh one hour of torture? 
      *   *Continuity View:* Yes, because there is no magic number where specks suddenly become weightless. 
      *   *Threshold View:* No, because torture belongs to a different lexical category. 
      *   *The Location Problem:* If the threshold is 10,000,000 specks, why not 10,000,001?
  *   **Status:** **Contested.** This is the central fault line of the literature. 
      *   *Totalists* reject thresholds to preserve continuity. 
      *   *Lexicalists* accept thresholds to preserve the special status of severe harm.

  ### 4. The Ontological Independence Requirement
  **Specification:** The theory must distinguish the *metaphysical facts* of aggregation from the *epistemic/practical constraints* on action. A theory must be able to state that harms *do* aggregate even if no agent could ever trace, measure, or act upon that aggregation. Pragmatic impossibility does not negate aggregative truth.

  *   **Motivating Case:** *The Untraceable Contribution.* 
      *   In climate change or large-scale voting, a single agent's contribution is causally negligible and epistemically untraceable to specific outcomes. 
      *   Does the harm exist even if no one can know it? 
      *   A theory that says "harms only aggregate if an agent can calculate them" conflates ontology with deliberation.
  *   **Status:** **Non-Negotiable.** 
      *   While *Pragmatic Encroachers* dispute this, for the purposes of normative metaphysics, a theory that collapses truth into knowability is considered defective. It renders moral facts contingent on human computational power.

  ### 5. The Transitivity and Completeness Requirement
  **Specification:** The aggregation function must yield a consistent ranking of outcomes. If Outcome A is better than B, and B better than C, A must be better than C. The theory cannot result in cycles or incommensurability when comparing large populations of small harms against small populations of large harms.

  *   **Motivating Case:** *The Money Pump.* 
      *   If we prefer Torture to 1 Billion Specks, and 1 Billion Specks to 1 Million Specks... do we prefer Torture to 1 Million Specks? 
      *   If a theory says "Torture is incomparable to Specks," it risks violating transitivity in mixed cases.
  *   **Status:** **Non-Negotiable.** 
      *   Logical consistency is a baseline requirement for any normative theory. Incommensurability is only acceptable if formally modeled, not asserted as an escape hatch.

  ---

  ### ⚠️ The Structural Tension: The Aggregation Trilemma

  Students should note that the desiderata above are **jointly unsatisfiable** in their strongest forms. Specifically, there is a tension between **Sorites Resolution (Continuity)**, **Sorites Resolution (Non-Arbitrariness)**, and **Common Moral Intuitions**.

  1.  **Continuity:** Small changes in harm/number should not produce massive jumps in moral value.
  2.  **Non-Arbitrariness:** Thresholds cannot be located at random numbers.
  3.  **Threshold Intuition:** Torture is worse than any number of dust specks.

  *   **Totalism** satisfies (1) and (2) but violates (3).
  *   **Lexical Threshold Views** satisfy (2) and (3) but violate (1) (a single additional speck crosses the lexical line).
  *   **Vague Threshold Views** satisfy (1) and (3) but violate (2) (they accept arbitrariness/vagueness as brute fact).

  You cannot maximize all three. Your chosen theory will be defined by which desideratum it sacrifices.

  ---

  ### Brief Assessment of Candidate Theories

  **Lexical-Threshold Views** (e.g., Rawlsian lexical order, strong prioritarianism):
  These views excel at satisfying the **Threshold Intuition** (Torture > Specks) and maintain **Ontological Independence**. However, they struggle significantly with the **Non-Arbitrariness** clause of the Sorites Requirement. Locating the precise point where "small harms" become "large harms" invites the charge of brute stipulation. They also risk violating **Transitivity** if the lexical break creates incommensurability between categories.

  **Rough Unit-Comparability Views** (e.g., Griffin, Hurka):
  These attempt to navigate the **Unit of Aggregation Requirement** by suggesting welfare is cardinally measurable only within certain ranges. They handle the **Intra/Interpersonal Asymmetry** better than pure totalism by acknowledging the integrity of the life. However, they often falter on **Transitivity** and **Completeness**; "rough" comparability can degrade into incommensurability when scaling to very large populations, potentially violating the **Ontological Independence** requirement if the "roughness" depends on human judgment rather than fact.

  **Plain Additive Totalism** (Classical Utilitarianism):
  This view is the strongest on **Continuity**, **Non-Arbitrariness**, and **Transitivity**. It treats welfare as a single currency, avoiding threshold arbitrariness. However, it flatly rejects the **Threshold Intuition** (accepting the Repugnant Conclusion or Torture/Specks reversal). It also faces the hardest challenge on the **Unit of Aggregation Requirement**, as it must argue that the distribution of pain across persons is morally irrelevant compared to the sum, which many find counterintuitive regarding the **Intra/Interpersonal Asymmetry**.

  ---

  ### Closing Note: The Killer Desideratum

  If you ask me which single desideratum does the most work in excluding theories from this seminar, it is the **Threshold Intuition** (embedded in Desideratum 3)—the claim that *some harms are so severe they cannot be outweighed by any quantity of trivial harms*. 

  This is the filter that eliminates Plain Additive Totalism, which is otherwise the most logically robust framework. Crucially, **this desideratum is itself Contested**. There is no consensus that the intuition is veridical; Totalists argue it is a cognitive bias. This creates a meta-theoretical problem for us: our most powerful tool for judging theories is itself a theoretical posit. If we treat the Threshold Intuition as a fixed datum, we beg the question against Totalism. If we treat it as a hypothesis, Totalism wins on parsimony. 

  **Seminar Task:** Do not assume the Threshold Intuition is a "given." Your first paper must argue whether this intuition is a *constraint on theory* or a *illusion to be explained away*.
