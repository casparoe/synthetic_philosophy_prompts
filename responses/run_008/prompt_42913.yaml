answer: |-
  Your hypothesis is strong—specifically, the claim that the stalemate arises from differing *individuation criteria* for the unit of analysis ("civilization" vs. "humanity" vs. "polity"). This is a classic category error masquerading as a metaphysical dispute. However, I believe diagnosing it merely as a verbal disagreement over granularity lets the theorists off the hook too easily. If it were purely verbal, the stakes wouldn't feel so existential, and the "smuggling" you identify wouldn't be so systematic.

  The disagreement is **substantive**, but it is not about the *shape* of history. It is about the **coupling coefficient between capability and coordination.**

  Here is the diagnosis:

  ### 1. It is a Disagreement About Causal Dependencies, Not Curves
  The linearists (Progress Studies, Enlightenment narratives) and the cyclists (Spengler, Polybius, Straussians) agree on the data points: Rome fell, the Industrial Revolution happened, the Ming closed their borders, the internet was invented.

  The disagreement is about the **functional dependence** of $K$ (Knowledge/Capability) on $C$ (Coordination/Institutions).

  *   **The Linearist Model:** $K_{t+1} = K_t + \Delta$. Knowledge is treated as a *stock* that, once discovered, has a low depreciation rate. It assumes that $K$ is largely decoupled from specific political instantiations. If Rome falls, the aqueducts break, but the *principle* of the arch persists or is easily rediscovered because the underlying reality (physics) hasn't changed. The trend is driven by the ratchet effect of discovery.
  *   **The Cyclist Model:** $K_t = f(C_t)$. Knowledge is treated as a *flow* or a fragile substrate embedded within social trust and institutional complexity. If $C$ decays (loss of solidarity, elite capture, bureaucratic sclerosis), $K$ becomes inaccessible or unusable. To the cyclist, a library burning isn't just the loss of paper; it's the loss of the *social technology* required to read the books.

  When Spengler says Western mathematics is exhausted, he isn't making a mathematical claim; he is making a sociological claim that the *cultural soul* required to generate that mathematics has entered its winter phase. When a Progress Studier says institutions are decaying but knowledge is compounding, they are claiming that the *global* repository of knowledge has decoupled from the *local* stability of any single institution.

  **Diagnosis:** This is a **substantive** disagreement about the fragility of information transmission. It is not merely verbal, because it makes different predictions about what happens during a collapse event.

  ### 2. The Compositional Error (and where it hides)
  You asked if this is a compositional error. Yes, but it cuts both ways.

  *   **Linearist Fallacy of Composition:** Assuming that because *humanity* accumulates knowledge, *any given society* can access it indefinitely. They treat "Humanity" as a single agent with a continuous memory, ignoring that access to the global stock is mediated by local institutions. (e.g., We have the tech to prevent famine, but local governance failures still cause famines).
  *   **Cyclist Fallacy of Division:** Assuming that because *polities* cycle, *capability* must reset. This is where Ibn Khaldun's escape hatch is vital. He recognized that while dynasties rot, the *crafts and sciences* can migrate. The cyclist often conflates the death of the *carrier* with the death of the *payload*.

  The stalemate persists because the Linearists point to the payload (nukes, mRNA, AI) and say "Look, we are higher than before," while the Cyclists point to the carrier (trust, legitimacy, cohesion) and say "Look, the vehicle is shaking." Both are right, but they are betting on different failure modes.

  ### 3. The Empirical Question: Stationarity vs. Decoupling
  You asked for a statistical test. The question is not "Is the series stationary?" (it clearly isn't, population and energy are trending). The question is: **Is the variance of the cycle increasing or decreasing relative to the drift of the trend?**

  Let $Y_t$ be societal capability.
  $$Y_t = \beta t + \epsilon_t$$
  Where $\beta$ is the progress drift and $\epsilon_t$ is the institutional cycle.

  *   **Linearist Bet:** $\beta$ is increasing, and the downside risk of $\epsilon_t$ is bounded. (We might have a recession/war, but we won't lose the ability to make microchips).
  *   **Cyclist Bet:** The magnitude of $\epsilon_t$ is a function of $Y_t$. As complexity grows, the cost of maintaining coordination grows (Tainter's thesis). Eventually, $\epsilon_{down} > Y_t$. A collapse wipes out the accumulated drift.

  **The Real Empirical Test:**
  We need to measure the **half-life of capability during institutional collapse.**
  *   In the Bronze Age Collapse, literacy and masonry vanished for centuries. (High coupling).
  *   In the Fall of Rome, some tech vanished, but the Catholic Church preserved literacy, and the East continued. (Medium coupling).
  *   In a modern nuclear war or grid collapse, does the knowledge to rebuild the grid persist in hard drives that no one can power? (Unknown coupling).

  The Progress Studies crowd bets that we have crossed a **Decoupling Threshold** where knowledge is stored redundantly enough (digital, global, multiple languages) that no single political cycle can erase the trend. The Cyclists bet that complexity makes the system *more* fragile, lowering the threshold for catastrophic loss.

  ### 4. Why the "Smuggling" Happens
  You noted that cyclists smuggle in linearity (Toynbee's religious terminus, Polybius's mixed constitution) and linearists concede local cycles. They do this because pure cycles are nihilistic (nothing matters) and pure linearity is naive (ignores risk).

  *   **Polybius's Escape Hatch:** He needed Rome to be exceptional to justify his patron's worldview. The "mixed constitution" was a claim that *engineering* could solve a *natural* cycle. That is a proto-linearist claim hidden inside a cyclic framework.
  *   **Spengler's Exhaustion:** He needed the West to be unique in its tragedy. Claiming math was "done" was a way to assert that cultural *meaning* is cyclical even if technical *utility* might persist.

  They smuggle because they are actually arguing about **Meaning vs. Mechanics.**
  *   **Linearists** care about *Mechanics* (Can we cure disease? Fly to Mars?).
  *   **Cyclists** care about *Meaning* (Does this society have a purpose? Is it virtuous? Is it coherent?).

  Spengler didn't care if the West could build better bridges; he cared that the bridges were being built by "fellahs" without spiritual direction. The Progress Studiers don't care about spiritual direction; they care about the bridges. They are talking past each other because one is measuring **thermodynamic capacity** and the other is measuring **teleological coherence.**

  ### 5. The Better Question
  The "Shape of History" question is ill-posed because "History" is not a natural kind. It is a reification of millions of distinct time-series.

  **The question we should be asking is:**
  > "What is the **fragility of the substrate** required to maintain the current level of capability?"

  Instead of asking "Are we in a cycle or a trend?", ask:
  1.  **Redundancy:** How many independent nodes must fail before knowledge $K$ becomes inaccessible?
  2.  **Maintenance Load:** What percentage of surplus energy $E$ is required to maintain the institutional complexity $C$ that protects $K$? (Tainter's metric).
  3.  **Transferability:** If Institution $A$ fails, how much friction is there in transferring $K$ to Institution $B$?

  **Conclusion:**
  The disagreement is substantive, but it is not about history's shape. It is a bet on **decoupling.**
  *   If knowledge can be fully decoupled from specific political forms (e.g., open-source AI, distributed ledgers, hardened archives), the Linearists win. The cycles become noise.
  *   If knowledge remains embedded in high-trust, high-complexity institutions that are prone to senescence, the Cyclists win. The trend is an illusion created by being halfway up a staircase that is rotting beneath us.

  The rationalist move is to stop debating the curve and start measuring the **rot.** Focus on the maintenance load of our institutions relative to their output. If the cost of maintaining the "Progress" infrastructure exceeds the surplus it generates, the cycle will crush the trend, regardless of how much knowledge we theoretically possess.
