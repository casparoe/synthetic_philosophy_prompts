answer: |-
  Based on the five verdicts you've collected, Maya isn't using standard economic logic (which says *always* ignore sunk costs), nor is she using a simple "completionist" logic. She is running a rule based on **Psychological Ownership (Agency)**.

  Here is the breakdown of why that is the dominant rule, how it predicts the new cases, and how you can prove it.

  ### The Two Competing Rules
  1.  **The Proximity Rule:** Honor sunk costs if you are near the finish line. (Threshold: ~75%+ complete).
  2.  **The Agency Rule:** Honor sunk costs if *you* initiated the commitment. (Threshold: Volition).

  While both fit her past five cases, the **Agency Rule** is the stronger fit. Here's why:
  *   **The Cousin Case:** Two years into a PhD is significant proximity. If Proximity were the main driver, there is a strong argument to finish two years of work. Maya's verdict ("Quit now and not look back") was immediate and harsh. This suggests the *source* of the project (Parents vs. Self) mattered more than the *progress*.
  *   **The Season Tickets:** She loses interest by January, but goes to *every* game. Depending on the league, January games are not necessarily "near the end" of the season. She honors the *purchase commitment* (Agency), not the timeline.

  ### Predictions for the New Cases

  If Maya is consistent with her **Agency Rule**, here is what will happen:

  **1. Daniel's Engineering Degree**
  *   **The Variables:** High Proximity (1 semester left) / Low Agency (Father arranged/paid).
  *   **Maya's Verdict:** **Quit.**
  *   **Why:** This is the "Cousin Case" redux. To Maya, this is an external imposition. The fact that it is near the end is irrelevant because the *will* to do it was never Daniel's. She will likely argue that finishing it validates the father's control over his life.
  *   **The Divergence:** The *Proximity Rule* would say **Finish**. (1 semester is "near the end," like the last 150 pages of the novel).

  **2. Maya's Marathon**
  *   **The Variables:** Low Proximity (2 weeks into 16) / High Agency (Self-designed/announced).
  *   **Maya's Verdict:** **Finish.**
  *   **Why:** This is the "Novel/PhD" pattern. She chose it, she announced it (public commitment), and therefore the costs are valid. She will likely suffer through the training even if she hates it, because quitting would violate her self-concept as a person who honors her own commitments.
  *   **The Divergence:** The *Proximity Rule* would say **Quit**. (2 weeks is only 12.5% complete; far from the "finish line" threshold).

  ### The Tie-Breaker Case

  To definitively settle whether she is running the **Agency Rule** or the **Proximity Rule** (and to test your suspicion about the **Money Rule**), you need a hypothetical scenario that isolates these variables.

  **The Scenario to Spring on Her:**
  > "Imagine you inherit a project from a predecessor at work. It's something you didn't ask for and don't want. However, it is **95% complete**. Do you spend the budget to finish the last 5%, or do you cancel it and write off the work?"

  **How to Read Her Answer:**
  *   **If she says "Finish it":** She is running the **Proximity Rule**. (The "waste" of 95% completion overrides the lack of choice).
  *   **If she says "Cancel it":** She is running the **Agency Rule**. (Lack of ownership overrides the proximity to completion). *This is the most likely outcome based on the Bridge/Cousin cases.*
  *   **If she hesitates and asks "Who pays for the last 5%?":** She is running the **Money Rule**. (She is tracking financial loss more than volition or progress).

  ### Summary of Her "Spreadsheet Brain"
  Maya's logic is actually a form of **Identity Accounting**.
  *   **Internal Projects (Self-Chosen):** Sunk costs are "Investments in Identity." Quitting hurts her self-image. (Novel, PhD, Tickets, Marathon).
  *   **External Projects (Imposed):** Sunk costs are "Historical Errors." Finishing validates someone else's mistake. (Bridge, Cousin, Daniel).

  She isn't calculating time or money; she is calculating **responsibility**. If she owns the decision, she owns the cost. If she doesn't own the decision, the cost is irrelevant.
