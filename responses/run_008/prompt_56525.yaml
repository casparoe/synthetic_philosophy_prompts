answer: |-
  You should reject Premise 5, because it conflates uncertainty about *actual* outcomes with a lack of *rational justification* for choosing one act over another based on expected value.

  Here is the reasoning. Your argument perfectly describes the "Cluelessness Objection" to **Objective Consequentialism** (the view in Premise 1 that rightness depends on actual infinite consequences). Professional ethicists generally agree with you that Objective Consequentialism is useless for decision-making because, as you noted, the far future is unknowable and potentially swamps the present. However, most consequentialists salvage the theory by shifting to **Expected Consequentialism**. Under this view, an act is rational if it maximizes *expected* good (probability × value), not *actual* good.

  This shift defeats your argument at Premise 5. While you are correct that we cannot know the *actual* value of the far future, we can assess its *expected* value. Since we have no reason to believe that trivial acts (like taking a bus) systematically produce better rather than worse long-term chains of events, the positive and negative possibilities cancel each other out in expectation (the "Symmetry Argument"). Consequently, the expected value of the far future approaches zero, allowing the knowable, near-term consequences (like someone's pain or pleasure today) to dominate the moral math. This restores guidance: you should not torture because the near-term suffering is high-probability and high-value, whereas the far-future identity effects are neutral in expectation.

  Rejecting this step comes with costs for both sides. For you, the cost is accepting **moral luck**: you can make the morally right decision (based on expectations) and still produce a terrible actual outcome (e.g., your choice inadvertently causes a war centuries later), meaning you acted rightly but the world is worse. For the consequentialist, the cost is conceding that **objective rightness is unknowable**; they must admit that morality cannot be about guaranteeing the best state of the universe, but only about managing probabilities with the information available. This saves the theory from paralysis but weakens its claim to describe objective moral truth.
