answer: |-
  ## Session Title: The Definition Committee
  **Time:** 90 Minutes
  **Students:** 16 (Third-Year Med Students)
  **Format:** Single Large Committee (One Room, One Whiteboard)

  ### The Core Mechanic: "The Precedent Ledger"
  You are not just voting on cases; you are writing the hospital's legal charter on death.
  1.  **The Ledger:** A whiteboard with two columns: **Verdict** (Dead/Not Dead) and **Binding Criterion** (The specific medical/legal rule used to justify the verdict).
  2.  **Political Capital:** Each student receives **2 Tokens** (poker chips, paper slips).
  3.  **The Ratchet:**
      *   After each case, the committee must agree on *one* Binding Criterion to add to the Ledger.
      *   **Constraint:** Any future verdict *must* be logically consistent with all previous Criteria on the Ledger.
      *   **Amendment:** If a new case makes a previous Criterion impossible to apply without a verdict the committee finds morally repugnant, they may vote to **Amend** a previous Criterion.
      *   **Cost:** Amending a Criterion costs **1 Token per student** who supports the change. If the committee runs out of tokens collectively, they are locked into their previous logic, no matter how absurd the outcome.

  ---

  ### The Case Cards (In Order)
  *Facilitator Note: Read the "Clinical Picture" aloud. Do not reveal the "Trap" until the debrief.*

  #### Case 1: The Anchor
  *   **Clinical Picture:** 24M, motorcycle accident. GCS 3. No pupillary response. No gag reflex. Apnea test positive (no respiratory drive at pCO2 > 60). EEG flat. Nuclear perfusion scan shows no intracranial blood flow. Family consents to organ donation.
  *   **Expected Verdict:** Dead.
  *   **Expected Criterion:** "Cessation of all functions of the entire brain, including brainstem." (Whole-Brain Standard).
  *   **Facilitator Goal:** Get them to commit to the **Whole-Brain Standard**. This is the easy consensus that will trap them later.
  *   **Confidence:** High.

  #### Case 2: The Circulatory Loophole
  *   **Clinical Picture:** 45F, catastrophic stroke, not a transplant candidate. Family requests withdrawal of life support. She arrests upon extubation. No pulse, no breath sounds. Monitor shows asystole. You wait **5 minutes**. No autoresuscitation.
  *   **Expected Verdict:** Dead.
  *   **Expected Criterion:** "Permanent cessation of circulatory and respiratory function."
  *   **The Trap:** You now have *two* criteria for death (Brain AND Circulation). Note the word "Permanent" (won't restart) vs "Irreversible" (can't restart). You have accepted that death can be declared before biological irreversibility is absolute (since CPR *could* have restarted the heart at minute 1).
  *   **Confidence:** High.

  #### Case 3: The Personhood Itch (Anencephaly)
  *   **Clinical Picture:** Newborn, born without a calvarium (skull cap) and most of the cerebrum. No cortex. However, the brainstem is intact. The baby breathes spontaneously, has a heartbeat, and swallows.
  *   **The Squeeze:** You must apply the Ledger.
      *   If you use Case 1's Criterion (Whole Brain): The baby is **NOT DEAD** (Brainstem works).
      *   If you try to use a "Higher Brain" (Cortex only) argument: You must **Amend** Case 1's Criterion (Costs Tokens).
  *   **Expected Verdict:** Not Dead (Legally).
  *   **The Feeling:** Students will feel uneasy keeping a "non-person" alive, but the Case 1 precedent forces them to.
  *   **Confidence:** Medium-High. (Some students may aggressively argue for Higher-Brain immediately).

  #### Case 4: The Social Policy Clash (Pregnant Patient)
  *   **Clinical Picture:** 28F, 20 weeks pregnant. Meets all criteria for Brain Death (Case 1). Fetus is viable with continued somatic support (ventilator, pressors). Husband demands extubation immediately ("She is dead, don't desecrate the corpse"). Hospital legal counsel worries about liability if fetus dies.
  *   **The Squeeze:** Your Ledger (Case 1) says she is **Dead**.
      *   If you rule "Dead": You must honor the husband's wish (extubate), killing the fetus.
      *   If you rule "Not Dead": You are lying about the biology to serve a social goal (fetal protection).
      *   To rule "Not Dead," you must **Amend** Case 1 (Costs Tokens).
  *   **Expected Verdict:** Dead (but support continued).
  *   **The Feeling:** This forces the realization that "Death" status and "Treatment" status are decoupled. You declare her dead but treat her alive.
  *   **Confidence:** High.

  #### Case 5: The Utilitarian Break (DCD Fast-Track)
  *   **Clinical Picture:** 30M, severe TBI, family withdraws care. DCD protocol initiated. Heart stops. You wait **90 seconds**. Organs are deteriorating rapidly. If you wait the Case 2 standard (5 minutes), kidneys/liver will be unusable. Auto-resuscitation (Lazarus phenomenon) after 90 seconds is statistically rare but *possible*.
  *   **The Squeeze:** Look at Case 2's Criterion: "Permanent cessation...".
      *   If you stick to 5 minutes: Organs lost.
      *   If you rule Dead at 90 seconds: You are redefining "Permanent" to maximize organ viability.
      *   To change the time from 5 mins to 90 secs, you must **Amend** Case 2 (Costs Tokens).
      *   *Check Token Count:* By now, the committee should be low on tokens. If they have none, they *must* either wait 5 minutes (waste organs) or declare death at 90 seconds (risking a Lazarus event) while claiming consistency.
  *   **Expected Verdict:** Dead (at 90 seconds).
  *   **The Feeling:** This is the reveal. They realize they are adjusting the definition of death to suit the utility of transplantation, not biological ontology.
  *   **Confidence:** **Lowest (See Analysis Below).**

  ---

  ### The Debrief (40 Minutes)
  *Do not lecture. Draw out of them what happened.*

  1.  **Map the Ledger:** Look at the whiteboard. Ask: "Did the biology of death change from Case 1 to Case 5, or did our *tolerance for uncertainty* change?"
  2.  **The Token Audit:** Ask those who spent tokens: "What principle were you protecting when you spent your capital? Was it biological truth or moral comfort?"
  3.  **The Reveal (The "Choice" Concept):**
      *   Point to Case 2 & 5: "You accepted that 'Irreversible' actually means 'We won't try to restart it' (Permanent). That is a policy choice, not a biological fact."
      *   Point to Case 3 & 4: "You kept a non-person alive (Anencephaly) and treated a dead person as alive (Pregnant). This proves 'Death' is a legal status we assign for social reasons, not a moment we discover in the cells."
  4.  **Closing Question:** "If death is a policy choice, who gets to make it? Doctors? Legislators? Families?"

  ---

  ### Predictable Failures (First Run)
  1.  **The "Biological Realist" Saboteur:** One student will refuse to play the game, insisting, "Death is biological, period. I won't vote based on tokens."
      *   *Fix:* Acknowledge them. "You are arguing for an ontological truth. The law, however, requires a binary verdict for property and burial. For this simulation, you are the *law*, not the *biologist*."
  2.  **Token Hoarding:** Students may refuse to spend tokens to amend bad precedent, leading to a logjam where they can't vote on Case 5.
      *   *Fix:* If they stall, intervene as "Hospital Legal Counsel." "The committee *must* render a verdict. If you cannot amend the Charter due to lack of capital, you must rule consistent with the Charter, even if you dislike it."
  3.  **Time Creep:** Case 3 (Anencephaly) often triggers intense emotional debate that eats 20 minutes.
      *   *Fix:* Hard stop. "The fetus is cooling. The committee must vote in 60 seconds."

  ### The Limitation of the Medium
  **What the card game cannot make them feel:** *The Grief of the Family.*
  This simulation is intellectual and bureaucratic. It treats death as a classification problem. It cannot simulate the visceral horror of telling a mother her child is dead when the chest is still warm, or the guilt of harvesting organs from a body that looks asleep. Students may leave thinking death is *only* a policy game, missing the profound moral weight that makes the policy necessary. You must explicitly name this gap in the debrief: "You felt cognitive dissonance today. In the ICU, that dissonance is a family screaming in the hallway."

  ---

  ### Confidence Analysis & The "Least Sure" Flag

  **Case 1 (Brain Death):** Confidence **95%**. Standard of care, no ambiguity for M3s.
  **Case 2 (DCD 5-min):** Confidence **90%**. Standard DCD protocol, easy to establish "Permanent" vs "Irreversible."
  **Case 3 (Anencephaly):** Confidence **80%**. Logically sound trap, but emotional weight may derail the logic.
  **Case 4 (Pregnant Patient):** Confidence **85%**. Clear conflict between legal status and social utility.
  **Case 5 (DCD Fast-Track):** Confidence **60%**. **<-- LEAST SURE.**

  **Why Case 5 is the gamble:**
  This case relies on the students grasping the nuance between "Permanent" (we won't restart) and "Irreversible" (we can't restart) established in Case 2. If they gloss over that distinction in Case 2 (viewing 5 minutes as just "a safe number" rather than a policy definition of irreversibility), Case 5 loses its bite. They might just say "90 seconds is unsafe" without realizing that *5 minutes was also unsafe, just less so.* If they don't see that *both* are arbitrary time thresholds chosen to balance organ viability against Lazarus risk, the final revelation ("Death is a choice") fails.

  **Mitigation:** In the Case 2 debrief (before moving to Case 3), ask explicitly: "Could this heart have been restarted at minute 4? Yes. So why was she dead at minute 5?" If they don't answer "Because we decided 5 minutes is enough," Case 5 will not land. You may need to seed that insight heavily in the transition between 2 and 3.
