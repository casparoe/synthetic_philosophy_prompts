prompt: |-
  I teach a bioethics elective for third-year med students, ~16 of them, one 90-minute session. Design a role-play where they sit as the death-determination committee of a fictional hospital and have to rule "dead" or "not dead" on a sequence of case cards, one at a time, with no idea what's coming later. The cards should work as a ratchet: every ruling gets logged as binding precedent for the committee, and later cards are built so that sticking to your earlier precedent now forces a ruling that makes you queasy — so by the end they've squeezed themselves. Draw the cases from the real fault lines: whole-brain vs. higher-brain criteria, the irreversible-vs-permanent move that lets donation after circulatory death go forward after only a few minutes of asystole, a brain-dead pregnant patient held on a ventilator, the autoresusciation (Lazarus phenomenon) worry, maybe an anencephalic newborn — but you pick which ones and in what order so the squeeze lands hardest. Give me the case cards themselves, a scoring/precedent mechanic that doesn't involve real money, and a debrief where I map each card onto a piece of the underlying idea — but that idea, that a unitary definition of death is something we settle by choice for practical purposes rather than discover in the biology, should come from what happened in the room, not from me lecturing up front. Two more things: what will predictably go wrong the first time I run this, and be honest about which part of the problem a card game just cannot make them feel. When you lay out the case order and what each card is meant to do, tell me how confident you are in each choice and flag the single one you're least sure of — I'd rather know where you're guessing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Third-year medical students (M3s), ~16 students, 90-minute session.
      *   **Topic:** Bioethics, specifically the definition of death.
      *   **Format:** Role-play simulation (Death-Determination Committee).
      *   **Mechanic:** Sequential case cards, binding precedent (ratchet effect), leading to a "squeeze" where early commitments force uncomfortable later conclusions.
      *   **Content:** Real fault lines (whole-brain vs. higher-brain, DCD irreversibility, pregnant brain-dead patients, Lazarus phenomenon, anencephaly).
      *   **Goal:** Students should discover that death is a normative/policy choice, not just a biological fact, *through* the gameplay, not a lecture.
      *   **Deliverables:** Case cards, scoring/precedent mechanic, debrief guide, prediction of failures, limitation of the medium, confidence rating on case order.

  2.  **Deconstruct the "Ratchet" Mechanic:**
      *   To make the precedent binding, I need a way to record decisions that constrains future choices.
      *   *Idea:* A "Principle Board." Every time they rule, they must articulate the *principle* used (e.g., "Irreversible cessation of circulation" or "Loss of consciousness"). Later cases must be judged by *all* accumulated principles. If a new case violates an old principle, they have to vote to overturn precedent (hard) or accept the uncomfortable conclusion.
      *   *Simplification for 90 mins:* Let's make it a voting log. They vote Dead/Not Dead. But the *reason* is the trap. I need to force them to justify the *criteria* used, not just the verdict.
      *   *Refined Mechanic:* The "Charter of Criteria." They start with a blank slate. After Case 1, they write down *why*. Case 2 must be consistent with Case 1's *why*. If Case 2 forces a contradiction, they must amend the Charter (which requires a supermajority). This creates the friction.

  3.  **Select and Order the Cases (The "Squeeze"):**
      *   *Goal:* Start easy (consensus), move to ambiguous (cracks appear), end with hard (precedent forces unethical/absurd outcome).
      *   *Case 1 (The Anchor):* Classic Whole-Brain Death. Trauma, flat EEG, no blood flow. *Verdict:* Dead. *Principle:* Cessation of all brain function. (High confidence: Everyone agrees).
      *   *Case 2 (The DCD Trap):* Cardiac arrest, 2 minutes no pulse, waiting for organ harvest. *Verdict:* Dead? *Principle:* Irreversible cessation of circulation. *Conflict:* If they said "Brain" in Case 1, now they must accept Circulation. If they accept Circulation, is 2 mins enough? (High confidence: Standard DCD protocol).
      *   *Case 3 (The Higher-Brain Wedge):* Persistent Vegetative State (PVS). Brainstem intact, cortex dead. *Verdict:* Not Dead (legally). *Conflict:* If Case 1 was "Brain," why does *some* brain matter? If Case 2 was "Circulation," this is irrelevant. *Correction:* I need to force the Higher-Brain argument early so it bites later.
      *   *Revised Order Strategy:*
          1.  **Classic Brain Death:** (Easy "Dead"). Establishes "Brain" criteria.
          2.  **DCD (Circulatory):** (Easy "Dead" after 5 mins). Establishes "Circulation" criteria + "Irreversibility" = "Permanent" (won't restart) not "Impossible to restart."
          3.  **Anencephalic Newborn:** (Hard "Not Dead"). Brainstem works, no cortex. If "Whole Brain" = Dead, this is Alive. If "Higher Brain" = Dead, this is Dead. Students usually rule "Not Dead" legally.
          4.  **The Pregnant Patient:** (The Squeeze). Brain dead, fetus viable. If "Dead," we stop support (fetus dies). If "Not Dead," we treat a corpse. Precedent from Case 1 says "Dead." But intuition says "Keep on support."
          5.  **The Lazarus/DCD Twist:** (The Killer). DCD patient, 2 minutes asystole (per Case 2 precedent), but auto-resuscitation is *possible* (Lazarus). If Case 2 established "2 mins = Irreversible," now they must declare dead someone who might wake up.

      *   *Wait, let's tighten the ratchet.* The prompt asks for a specific philosophical payoff: Death is a choice, not a discovery.
      *   *Sequence:*
          1.  **Standard Brain Death:** (Uncontroversial). Sets "Cessation of Function."
          2.  **DCD (5 min wait):** (Controversial but standard). Sets "Irreversibility is time-bound/policy."
          3.  **Locked-in Syndrome (Mimic):** (The Scare). Looks brain dead, isn't. Reinforces need for strict testing.
          4.  **Anencephaly:** (The Moral Itch). Biologically alive (brainstem), no personhood. Ruling "Alive" feels wrong if "Personhood" was hinted at in Case 1.
          5.  **The Pregnant Brain-Dead:** (The Policy Clash). Biological death vs. Social utility (fetus).
          6.  **The "DCD at 60 Seconds":** (The Break). If Case 2 set the precedent that "Circulation stops = Death," can we shorten the time for organs? This forces the "Death is for Organ Harvest" revelation.

      *   *Let's go with the "Precedent Log" approach.* They must write the *Rule* used.
      *   *Case 1:* Classic Brain Death. Rule: "No Brain Activity."
      *   *Case 2:* DCD (5 min). Rule: "No Heart Activity for X time." (Now we have two rules).
      *   *Case 3:* Anencephalic. Rule: Must fit Case 1. Brainstem active. So "Not Dead." (Students hate this).
      *   *Case 4:* Pregnant Brain Dead. Rule: Fits Case 1 ("Dead"). But do we extubate? (Forces distinction between biological death and social treatment).
      *   *Case 5:* The "Organ Farm" Hypothetical. Brain dead patient, perfect organs. Family wants to keep on vent until organs degrade to avoid "killing." Or: Can we declare death *sooner* to save organs?
      *   *Actually, the strongest squeeze is on "Irreversibility."*
      *   *Case 1:* Brain Death. (Dead).
      *   *Case 2:* DCD, 5 mins. (Dead). Precedent: "Permanent cessation of circulation."
      *   *Case 3:* DCD, 2 mins. (Dead?). If they say Yes, they risk Lazarus. If No, they violate DCD efficiency.
      *   *Case 4:* Anencephaly. (Alive).
      *   *Case 5:* Higher Brain (PVS). (Alive).
      *   *Case 6:* The "Conscious Corpse." (Brain dead, but spinal reflexes look like movement).
      *   *Let's refine for the "Death is a Choice" payoff.*
      *   *Order:*
          1.  **Classic Brain Death:** (Easy Dead).
          2.  **DCD (5 Mins):** (Easy Dead). *Trap:* Defines death by circulation, not brain.
          3.  **Anencephalic Infant:** (Hard Alive). *Trap:* "Whole Brain" criteria keeps them alive. "Higher Brain" would kill them.
          4.  **Pregnant Brain-Dead:** (Hard Dead). *Trap:* Precedent says Dead. But social pressure says treat as alive.
          5.  **DCD (2 Mins) + Lazarus Risk:** (The Breaker). *Trap:* To be consistent with Case 2 (Circulation = Death), you must accept higher risk of auto-resuscitation. This reveals "Death" is adjusted for organ viability.

  4.  **Develop the Mechanic:**
      *   **The Precedent Ledger:** A whiteboard. Columns: Case #, Verdict (Dead/Alive), *Criterion Used*.
      *   **Constraint:** You cannot use a new Criterion unless 75% of the committee votes to amend the Charter.
      *   **Currency:** "Political Capital." Each student gets 3 tokens. To amend the Charter (change the definition), you must spend a token. If you run out, you can't change your mind. This simulates the rigidity of law/policy.

  5.  **Drafting the Cases:**
      *   Need specific medical details to make it feel real (GCS, pupils, pressors, etc.).
      *   Need to ensure the "Trap" is clear in the facilitator notes.

  6.  **Debrief Strategy:**
      *   Don't lecture. Ask: "When did you feel the definition shift?" "Did biology change, or did our tolerance for risk change?"
      *   Map cases to concepts: Case 2 -> DCD/Irreversibility. Case 3 -> Higher vs. Whole Brain. Case 5 -> Pragmatism vs. Ontology.

  7.  **Predicting Failures:**
      *   *Gaming the system:* Students might vote randomly.
      *   *Too much consensus:* They might just agree on "Doctor knows best" every time.
      *   *Time:* 90 mins is tight for 5 cases + debrief.
      *   *The "Biological Realist" Trap:* One student might insist "Death is biological, stop playing games."
      *   *Limitation:* A game can't make them feel the *grief* of the family. It's intellectual, not emotional.

  8.  **Confidence Rating:**
      *   Case Order: High confidence on 1, 2, 4. Lower on 3 (Anencephaly can be emotionally overwhelming and derail the logic). Lowest on 5 (The DCD time squeeze might be too technical).
      *   *Self-Correction:* I need to make sure the "Squeeze" is logical.
      *   *Revised Order for Maximum Squeeze:*
          1.  Classic Brain Death (Establishes Brain Standard).
          2.  DCD 5 Mins (Establishes Circulatory Standard + "Permanent" not "Irreversible").
          3.  Anencephaly (Tests Brain Standard: Brainstem vs Cortex).
          4.  Pregnant Brain Dead (Tests Social Value vs Biological Standard).
          5.  DCD 90 Seconds (Tests the "Permanent" definition against Organ Viability).
      *   *Least Sure:* Case 5. It requires understanding the nuance of "permanent" vs "irreversible." If they don't grasp that in Case 2, Case 5 fails. I will flag this.

  9.  **Refining the Output:**
      *   Tone: Professional, instructional, slightly provocative.
      *   Structure: Setup, Mechanic, Cases, Debrief, Failures/Limitations, Confidence.

  10. **Final Review against constraints:**
      *   16 students? (Divide into 4 committees of 4, or 1 large group? Large group is better for "precedent." 16 is small enough for one room discussion). Let's do **One Large Committee**. It makes the precedent public and binding.
      *   90 minutes? (10 intro, 40 game, 40 debrief).
      *   No money? (Use "Political Capital" tokens).
      *   Reveal "Death is a Choice"? (Yes, via the debrief).

  11. **Drafting the Content:** (Mental check of the "Political Capital" mechanic).
      *   If they spend tokens to change definitions, they run out. This forces them to stick with bad precedents. Good.
      *   Wait, if they run out, they just can't vote to amend. They have to vote on the case. If the case contradicts the precedent, they have to vote inconsistently? No, the rule is: *Verdict must be logically consistent with the Active Charter.* If it isn't, they *must* amend the Charter (spend token) or vote "Not Dead/Dead" to fit the Charter even if they hate it.
      *   Better: They vote Verdict. Then they must write the Rule. If the Rule contradicts a previous Rule, they must spend a Token to "Overturn Precedent." If no tokens, they *must* find a way to make the new Verdict fit the old Rule (cognitive dissonance).
      *   Actually, simplest: **The Precedent Wall.** Once a criterion is written (e.g., "Cessation of Circulation"), it is law. Future cases *must* be judged by it. If a case comes up where Circulation has stopped but they don't want to call death (e.g., CPR in progress), they realize the criterion was too broad. They have to refine it (costs tokens).
      *   Let's go with: **"The Definition Ledger."**
      *   Start: Blank.
      *   Case 1: Vote Dead. Write Rule: "No Brain Function."
      *   Case 2: Vote Dead. Write Rule: "No Circulation for 5 mins." (Now we have two paths).
      *   Case 3: Anencephaly. Must apply Rule 1. Brainstem present. Verdict: Alive. (Uncomfortable).
      *   Case 4: DCD 2 mins. Must apply Rule 2. Circulation stopped 2 mins. Verdict: Dead? (Risky).
      *   This works.

  12. **Final Polish:** Check the "Least Sure" flag. Ensure the "What will go wrong" is honest. Ensure the "Limitation" is profound (the lack of emotional weight).

  *(Self-Correction during drafting)*: 16 students in one committee might lead to some dominating. I should suggest breaking into 4 teams of 4, but they all share *one* Precedent Board. They compete to define the rules? No, they collaborate on one Board. Let's keep them as **One Committee** to ensure the precedent is truly shared and the "squeeze" is collective. 16 is manageable for a 90-min seminar if the facilitator is strict.

  *Wait, one more thing:* The prompt asks for "Confidence... flag the single one you're least sure of." I need to make sure I explicitly state this at the end.

  *Let's finalize the Case Order for the "Squeeze":*
  1. **Classic Brain Death** (Establishes "Brain" criteria).
  2. **DCD Donor** (Establishes "Circulation" criteria + "Permanent" definition).
  3. **Anencephalic Newborn** (Forces "Whole Brain" rigidity -> "Alive" verdict feels wrong).
  4. **Pregnant Brain-Dead** (Forces "Dead" verdict -> Social cost feels wrong).
