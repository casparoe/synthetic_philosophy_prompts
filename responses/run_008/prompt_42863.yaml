answer: |-
  The allure of the Kelly criterion is understandable. In a world of noisy financial advice and paradoxical decision theory, the promise of a mathematically "correct" way to bet is intoxicating. The geometric rationality camp argues that Kelly isn't just a useful heuristic for gamblers, but a fundamental law of rationality derived from ergodicity economics. They claim that because non-ergodic processes (like compounded wealth) diverge between time averages and ensemble averages, a rational agent *must* maximize the geometric mean of wealth to avoid ruin and ensure dominance. This position, however, conflates a specific solution with the general framework of decision theory. Kelly betting is not a rival to Expected Utility Theory (EUT); it is merely EUT applied to a logarithmic utility function. The claim that it is uniquely compulsory smuggles in a substantive normative preference under the guise of mathematical necessity.

  To see this, we must return to the foundation of rational choice. Standard decision theory posits that an agent should act to maximize expected utility. Utility functions represent preferences over outcomes. If an agent's utility function over wealth is $U(w) = \ln(w)$, maximizing expected utility yields the Kelly criterion exactly. If their utility is linear, $U(w) = w$, it yields maximum expected value betting (which often leads to ruin). If it is $U(w) = \sqrt{w}$, it yields fractional Kelly. All these strategies are internally consistent within EUT. The geometric rationality argument attempts to bypass this by claiming that maximizing the time-average growth rate is not a preference, but a requirement for coherence in non-ergodic systems. They argue that because the ensemble average (what happens to many people once) differs from the time average (what happens to one person many times), only the latter matters.

  But this move hides a normative premise. Choosing to maximize the time-average growth rate is itself a choice of objective function. It is equivalent to saying, "I value the geometric mean of my wealth over the arithmetic mean." While this is a sensible goal for many repeated investment scenarios, it is not a logical axiom. It is a specific way of aggregating value over time. By declaring it compulsory, the ergodicity crowd is effectively dictating that every rational agent must have logarithmic utility over wealth, regardless of their actual goals, lifespan, or financial context. They are solving the St. Petersburg paradox not by refining decision theory, but by fiat—by banning utility functions that grow faster than logarithmically.

  The strongest weapon in the pro-Kelly arsenal is the almost-sure dominance argument. They point out that over an infinite horizon, a Kelly bettor's wealth will exceed that of any bettor using a different fixed fraction with probability approaching one. Furthermore, any agent betting more than Kelly (overbetting) will go broke almost surely, even with a positive edge. Therefore, the argument goes, choosing non-Kelly is irrational because you are choosing a strategy that will almost certainly leave you poorer.

  This is where the sleight of hand occurs. The move from "you will end up richer almost surely" to "he is irrational" conflates wealth dominance with utility dominance. Rationality is defined by maximizing expected *utility*, not expected *wealth*. While it is true that Kelly maximizes the probability of having more wealth than any other strategy in the long run, this dominance only holds strictly in the limit as time goes to infinity. Real agents operate on finite horizons. In any finite window, the non-Kelly bettor has a non-zero probability of outperforming the Kelly bettor. If an agent's utility function places sufficient weight on that upside potential—for example, a need to reach a specific high threshold to save a life or fund a project—their expected utility might be higher with a non-Kelly strategy, even if their median wealth is lower.

  Moreover, "almost surely" is a probabilistic claim, not a certainty. It relies on the Law of Large Numbers to wash out variance. But for a finite agent, variance matters. An agent who goes broke in year 50 of a 100-year plan suffers a utility catastrophe, even if the "almost sure" convergence says they should have been rich in year 1000. The dominance argument assumes the agent cares about the limit behavior of their wealth trajectory rather than the utility derived from their actual lifespan. It presumes that the only rational goal is to win the game of compound interest in the infinite limit, rather than to optimize outcomes for the life one actually has.

  Ultimately, calling non-Kelly betting "irrational" is a category error. It mistakes a specific preference for growth optimization for a universal law of reasoning. Kelly is the optimal strategy for an agent who wants to maximize long-run geometric growth and has logarithmic utility. But an agent with different constraints, a finite horizon, or a different utility function is not violating the laws of probability by betting differently; they are simply optimizing for a different objective. Rationality is about coherence between beliefs, preferences, and actions, not conformity to a single betting fraction.

