  # Research Proposal: Parity in Time — The Diachronic Stability of Hard Choices

  **Course:** Value Theory Seminar
  **Project Type:** Term Paper (approx. 7,000 words)
  **Topic:** The Normative Dynamics of Parity and Commitment

  ## 1. Abstract
  Ruth Chang's framework of "parity" has become the standard model for understanding hard choices: cases where two options are comparable, neither is better than the other, yet they are not equally good. However, the existing literature treats parity as a synchronic relation holding between fully specified options at the moment of choice ($t_0$). This paper argues that this static model fails to capture the normative reality of hard choices as they unfold over time. Specifically, I investigate the **diachronic stability of parity under commitment**. I contend that once an agent commits to one parity-on-a-par option and begins to invest effort and will, the normative landscape shifts: the unchosen option does not remain on a par with the chosen one because the act of commitment transforms the *relata* of the comparison. The agent becomes a different normative subject, and the options drift in value. Failing to account for this leads to an unstable picture of rational agency where perpetual regret or switching remains rationally permissible. This paper will sketch a model of "Normative Drift" to resolve this tension.

  ## 2. The Research Question
  The central question of this paper is: **Does the parity relation persist diachronically after an agent commits to one option and begins to invest will and effort in it?**

  This breaks down into two subsidiary questions:
  1.  **The Metaphysics of the Relata:** Does the act of commitment alter the identity or value of the options such that the original parity relation no longer applies? (i.e., Is the choice between *Academia* and *Industry* at $t_0$ the same comparison as *Lived Academia* vs. *Counterfactual Industry* at $t_1$?)
  2.  **The Rationality of Switching:** If parity persists indefinitely despite investment, does this imply that an agent is always rationally permitted to switch paths? If so, does this render long-term planning irrational? If not, what normative mechanism closes the door on the unchosen option?

  ## 3. Background and Motivation
  ### 3.1 The Standard View (Chang)
  The dominant framework for hard choices, developed primarily by Ruth Chang, posits a fourth value relation: parity. This solves the problem of "incomparability" (where no positive value relation holds) by allowing that options can be in the same "neighborhood" of value without one being better or them being equal. Crucially, Chang argues that in hard choices, reasons run out, and the agent must exercise their "normative power" or will to create a reason to choose one over the other.

  ### 3.2 The Gap: Static vs. Dynamic
  While Chang discusses the *creation* of reasons through will, the literature predominantly analyzes the structure of the choice at the moment of decision. The options are treated as fixed descriptions (e.g., "Life as a Lawyer" vs. "Life as a Clarinetist").

  This static modeling ignores the temporal extension of hard choices. Real-world hard choices are not merely selections between pre-packaged lives; they are processes of construction. When I choose Academia over Industry, I do not merely select a pre-existing path. I begin to invest time, emotional energy, and skill acquisition into Academia. Simultaneously, the Industry path becomes increasingly counterfactual.

  ### 3.3 Why Existing Alternatives Don't Settle It
  *   **Standard Decision Theory:** Expected utility maximization collapses in hard choices by definition (since neither option has higher expected value). It offers no resources for analyzing post-choice dynamics other than updating credences, which doesn't capture the *normative* shift.
  *   **Raz-Style Incommensurability:** Joseph Raz and others argue that in some cases, options are incomparable. However, this usually implies that choice is arbitrary or based on non-value reasons. This view doesn't help explain why, after choosing, one path feels "right" and the other "closed off." It lacks a mechanism for how value *develops* post-choice.
  *   **Chang's "Will":** Chang suggests we create reasons through commitment. However, it is unclear if this creation *destroys* the parity relation with the alternative or merely *overrides* it. If the alternative remains on a par, the "created reason" seems fragile. If the parity relation dissolves, we need an explanation of *how* investment changes value without falling into the Sunk Cost Fallacy.

  ## 4. Proposed Argument: The Normative Drift Hypothesis
  I will argue for the **Normative Drift Hypothesis**: Parity is inherently unstable under commitment. The relation holds only at the moment of choice ($t_0$). Once commitment occurs, the options diverge in value not merely because of external consequences, but because the *agent's normative identity* shifts.

  **Step 1: Distinguishing Investment from Sunk Cost.**
  I must first distinguish rational investment (which creates new value) from the Sunk Cost Fallacy (irrational adherence to past costs). In hard choices, the exercise of will is not merely "sticking it out"; it is an act of making the option better by aligning it with the self.

  **Step 2: The Transformation of the Relata.**
  At $t_0$, Option A and Option B are on a par. At $t_1$ (after commitment to A), the comparison is no longer A vs. B. It is A* (A-as-lived-and-shaped-by-me) vs. B-counterfactual. Because the agent has changed through the commitment, the "covering value" that made them comparable at $t_0$ may no longer apply in the same way. The "career" value of Academia for a committed academic is different than the "career" value of Academia for a prospective academic.

  **Step 3: Implications for Rational Regret.**
  If parity persisted indefinitely, rational regret would be permanent. I could always look at the unchosen path and say, "That was just as good, and I could have it." This leads to normative instability. By arguing that parity dissolves through commitment, I can explain why it becomes irrational to dwell on the unchosen path after a certain point of investment, without denying the hardness of the initial choice.

  ## 5. Work Plan (One Semester)

  **Month 1: Exegesis and Problem Refinement**
  *   **Weeks 1-2:** Close reading of Chang's key papers on parity and the normative power of the will. Focus specifically on any mentions of time, commitment, or diachronic agency.
  *   **Weeks 3-4:** Map the alternatives. Briefly survey Raz-style incommensurability and standard decision-theoretic treatments of sequential choice to ensure the "gap" is real.
  *   **Deliverable:** A 2-page annotated bibliography and a refined statement of the "Normative Drift" argument.

  **Month 2: Constructing the Diachronic Model**
  *   **Weeks 5-6:** Develop the distinction between "Static Parity" and "Dynamic Parity." Draft the argument for why investment changes the *relata* of the value relation.
  *   **Weeks 7-8:** Address the Sunk Cost objection. Why is this drift not just irrational stubbornness? I need to ground this in value theory (e.g., integrity, identity-constitution) rather than psychology.
  *   **Deliverable:** Detailed outline of the paper's core argument (Sections 3 & 4).

  **Month 3: Drafting and Implications**
  *   **Weeks 9-10:** Write the first full draft (approx. 5,000 words). Focus on getting the metaphysics of the "changed self" clear.
  *   **Weeks 11-12:** Expand on the implications for rational regret and switching. Ensure the connection to the "hard choice" literature remains explicit.
  *   **Deliverable:** Complete first draft.

  **Month 4: Revision and Polish**
  *   **Weeks 13-14:** Cut scope if necessary. (If the metaphysics of personal identity gets too heavy, prune it back to normative identity). Refine the prose for clarity and rigor.
  *   **Week 15:** Final proofreading and citation formatting.
  *   **Deliverable:** Final 7,000-word paper.

  ## 6. Feasibility and Failure Modes

  ### 6.1 Scope Risk (The "Dissertation Problem")
  **Risk:** The question of how commitment changes value touches on personal identity, the metaphysics of options, and the nature of rationality over time. This is easily dissertation-sized.
  **Mitigation:** I will explicitly bracket the metaphysics of personal identity. I will treat the "change in self" as a normative fact (change in commitments/reasons) rather than a metaphysical one. I will focus strictly on the *permissibility of switching* as the test case for whether parity persists.

  ### 6.2 The "Obviousness" Risk
  **Risk:** It might turn out that Chang's concept of "will" already covers this. If "creating a reason" just *means* "making one option better than the other through time," then my proposal is merely an application of her view, not a critique or extension.
  **Mitigation:** I will look for textual evidence where Chang treats the parity relation as holding *after* the will is exercised. If she is silent, I will argue that silence is a theoretical cost that my model resolves.

  ### 6.3 The Sunk Cost Confusion
  **Risk:** The core argument might collapse into a defense of the Sunk Cost Fallacy. If I argue "you invested so much, so now A is better than B," that is standardly considered irrational.
  **Mitigation:** I must distinguish between *backward-looking* justification (I spent time, so it's valuable) and *forward-looking* constitution (My investment has made me the kind of person for whom A is uniquely valuable). The value comes from the fit between self and option, not the cost incurred.

  ### 6.4 Collapse Condition
  The project collapses if it turns out that hard choices are *never* truly diachronic—that is, if the "real" choice is always just a series of synchronic snapshots. If every moment is a new hard choice, then there is no "stability of parity" to analyze, only repeated instances of synchronic parity. I need to argue that commitment has a binding normative force that links these snapshots.

  ***

  # Meta-Assessment & Confidence Report
  *(For the student's internal use)*

  You asked for an honest assessment of the proposal's viability, including my confidence levels in the philosophical moves and the single weakest assumption. Here is the breakdown:

  ### 1. Confidence in the "Gap" (High Confidence)
  I am highly confident that the literature on parity is overwhelmingly synchronic. Chang's classic examples (the lawyer vs. the clarinetist) are presented as snapshot comparisons. While she discusses "commitment," the *metaphysics of the options over time* is not the primary focus of the parity debate. You are correct that this is an underexplored avenue. There is a genuine opening here to discuss "diachronic value theory."

  ### 2. Confidence in the "Normative Drift" Solution (Medium Confidence)
  The idea that commitment changes the value of the options is philosophically robust (it aligns with literature on integrity and identity). However, articulating *why* this isn't just the Sunk Cost Fallacy is the hardest part of the paper. You will need to be very careful with your terminology. If you frame it as "investment adds value," you will get pushback. If you frame it as "investment changes the *agent*, thereby changing the *fit*," you are on safer ground.

  ### 3. Scope Warning (Critical)
  You are right to worry this is a dissertation topic. It touches on:
  *   Metaethics (nature of value relations)
  *   Action Theory (commitment and will)
  *   Personal Identity (how much must I change for the choice to be different?)
  *   Rational Choice Theory (intertemporal choice)

  **Advice:** For a 7,000-word term paper, you **must** narrow the scope. Do not try to solve the metaphysics of the options. Instead, focus entirely on the **Rationality of Regret**.
  *   *Revised Narrower Question:* "If parity persists diachronically, is perpetual rational regret inevitable? If so, is that a *reductio* of diachronic parity?"
  *   This allows you to use the "Drift" idea as a solution to the regret problem without having to build a full metaphysics of value change.

  ### 4. The Least Secure Assumption (The "Kill Switch")
  **Assumption:** *That the options in a hard choice remain sufficiently identical over time to be the "same" options for comparison.*

  **Why it's risky:** A critic (or your professor) might argue that once you commit to Academia, the option "Industry" is no longer available to you in the relevant sense. If the option itself disappears or fundamentally changes nature, then parity doesn't need to "dissolve"—it just becomes moot because one relatum no longer exists.
  *   *Counter-argument you need to prep:* People *do* switch careers after 5 years. So the option "Industry" must still exist in some normative sense. If it exists, does it remain on a par?
  *   *Confidence Level:* **Low.** This is the point most likely to be attacked. You need to define what it means for an option to "persist" across time. Is it the same option if I'm 5 years older and less qualified? You need a criterion for "Option Identity" over time, or you need to argue that the comparison shifts to "My Current Life" vs. "The Life I Would Have Had."

  ### 5. Final Verdict
  This is a strong, viable topic for a grad seminar paper, provided you resist the urge to solve the entire metaphysics of commitment. The "Diachronic Parity" angle is fresh and connects directly to your lived experience (which often fuels good philosophy), but you must abstract it enough to be generalizable.

  **Go/No-Go:** **Go.** But tighten the focus to the *rationality of switching/regret* to keep it within 7,000 words.
