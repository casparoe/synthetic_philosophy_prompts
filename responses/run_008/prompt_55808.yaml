answer: |-
  Here is a decision tree designed for your reading group. It assumes your starting commitment: **an agent cannot computationally update every consequence of its beliefs.** The questions avoid technical jargon, focusing instead on the architectural and epistemological choices required to cope with that limitation.

  ### The Frame Problem Decision Tree

  **Q1. The Model Question**
  Given that the agent cannot check everything, does it avoid the burden by refusing to carry an internal map of the world (reacting only to immediate signals), or does it maintain an internal description of the world that it must update?
  *   **No Internal Map:** Go to **Leaf A**.
  *   **Maintains Internal Map:** Go to **Q2**.

  **Q2. The Mechanism Question**
  To manage this internal map, does the system determine what changes and what stays the same by learning statistical associations from data, or does it require explicit, structured rules about how the world works?
  *   **Statistical Associations:** Go to **Leaf B**.
  *   **Explicit Structured Rules:** Go to **Q3**.

  **Q3. The Generality Question**
  Can these structured rules be unified into a single, general-purpose logic that applies to any situation, or must they be restricted to specific, limited domains?
  *   **Single General Logic:** Go to **Leaf C**.
  *   **Restricted Domains:** Go to **Q4**.

  **Q4. The Diagnosis Question**
  Is the failure of general logic due to the physical architecture of the mind (which must be built of isolated tools), or is it due to the fact that we simply do not understand the philosophical nature of "relevance"?
  *   **Architecture/Isolated Tools:** Go to **Leaf D**.
  *   **Philosophical Nature of Relevance:** Go to **Leaf E**.

  ***

  ### The Leaves (Positions & Awkward Commitments)

  **Leaf A: The Antirepresentationalist / Engineering-Naturalist**
  *(Associated with Rodney Brooks, Daniel Dennett)*
  This view holds that the problem is an artifact of bad design; if you build agents that interact directly with the environment rather than modeling it, the problem vanishes.
  *   **Most Awkward Commitment:** It struggles to explain how humans plan for distant futures or reason about objects that are not currently present.

  **Leaf B: The Deflationist / Machine Learning Optimist**
  *(Associated with modern Deep Learning proponents)*
  This view holds that massive statistical training implicitly captures what matters, rendering the explicit framing of the problem obsolete.
  *   **Most Awkward Commitment:** It cannot guarantee safety or explain *why* a specific fact was ignored in a novel, out-of-distribution situation.

  **Leaf C: The Logicist**
  *(Associated with John McCarthy, Ray Reiter, Murray Shanahan)*
  This view holds that the problem is a technical glitch in formal representation that can be solved by better axioms (e.g., circumscription or situation calculus).
  *   **Most Awkward Commitment:** It requires a level of formal precision in common-sense knowledge that no human actually possesses or uses.

  **Leaf D: The Modular Pessimist**
  *(Associated with Jerry Fodor)*
  This view holds that central cognitive processes are "isotropic" (anything can be relevant) and therefore cannot be computationally modeled, necessitating a modular architecture for input only.
  *   **Most Awkward Commitment:** It implies that a scientific psychology of higher-order thought is impossible in principle.

  **Leaf E: The Epistemological Realist**
  *(Associated with Zenon Pylyshyn)*
  This view holds that the Frame Problem is not a computational bug but the old philosophical problem of relevance dressed in new clothes.
  *   **Most Awkward Commitment:** It offers no engineering path forward, serving only as a diagnostic brake on AI optimism.

  ***

  ### Analysis of the Tree Structure

  **1. Indistinguishable Leaves**
  You correctly suspected the last two. **Leaf D (Fodor)** and **Leaf E (Pylyshyn)** are functionally indistinguishable in practice. Both conclude that there is no general computational solution to the Frame Problem. Fodor attributes this to the *architecture* of the mind (central processes are non-modular and thus non-computable), while Pylyshyn attributes it to the *epistemology* of inference (relevance is not a formal property). However, since both result in the same pessimism regarding general AI and the same demand for modularity or external constraints, your group will likely find them occupying the same dialectical space. The tree separates them by *cause* (hardware vs. concept), but the *consequence* is identical.

  **2. Unoccupied Combinations**
  There is one glaringly unoccupied combination in this tree: **No Internal Map + Explicit Structured Rules.**
  *   **Diagnosis:** This view is **incoherent**. Logical rules require operands (representations) to operate upon. If an agent refuses to carry an internal map (Leaf A), it cannot simultaneously rely on explicit logical rules to manage that map (Q2). You cannot have a logic of belief update without beliefs to update.

  There is a second, more subtle unoccupied space: **Internal Map + Statistical Associations + Restricted Domains.**
  *   **Diagnosis:** This view is **unexplored/unstable**. This would describe a system that uses neural networks but admits they cannot generalize universally. While this describes much of current applied AI, it lacks a philosophical champion in this debate because it collapses into either Leaf B (if you trust the stats will eventually scale) or Leaf D (if you admit the stats are just specialized modules). It is rarely defended as a final philosophical position.

  **3. Note on the Starting Commitment**
  This tree respects your starting constraint (tractability). Leaf A escapes the constraint by denying the premise (no beliefs to update). Leaf B claims the constraint is manageable via approximation. Leaves C, D, and E accept the constraint and argue over whether it can be formally solved, architecturally bypassed, or philosophically accepted.
