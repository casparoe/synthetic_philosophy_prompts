answer: |-
  My dear friend,

  It is a pleasure to assist you in deciphering the jurisprudence of your oldest companion, for while her verdicts may appear contradictory to the untrained eye, they possess a rigorous internal logic that you have wisely sought to map before dialling her number. To predict her reaction to the proposed citizens' panel, we must first articulate the competing principles that could be governing her past decisions, for there are at least two distinct rules that fit her record equally well yet diverge sharply on this new case. The first candidate rule is what we might call the Principle of Equal Probability, which holds that in any civic or distributive context where merit is not objectively rankable, every eligible candidate must stand an identical chance of selection. This rule aligns with her support for the simple lottery in Parliament, juries, allotments, and the residents' committee, as well as her preference for the coin toss in hiring. Under this rule, the stratified panel would be rejected, for it violates the equality of chance by weighting the odds in favour of young renters. The second candidate rule is the Principle of Descriptive Representation, which posits that the legitimacy of a civic body depends on its composition mirroring the populace it serves. This rule fits her desire for Parliament to represent the people rather than the professionally electable, her insistence that the residents' committee should reflect the street rather than the golf club, and her defence of juries as peers. Under this rule, the stratified panel would be welcomed, indeed celebrated, as the only method guaranteed to achieve the requisite demographic mirror without resorting to the bias of elections or volunteering.

  Having set out these competing frameworks, my best guess is that you should prepare for a tirade rather than delight, though it will be a reasoned one. I lean towards this prediction because her admiration for the lot seems rooted in its procedural honesty and its capacity to eliminate human agency and bias, rather than in the engineering of specific outcomes. When she praised the coin toss in hiring, she called it honest, and when she defended the allotment draw, she accepted the outcome even when her own name did not come out, suggesting a commitment to the fairness of the process over the fairness of the result. Her objection to the residents' committee was specifically about self-selection, where individuals appoint themselves, rather than about the statistical variance of a random draw; a simple lottery from all households was her solution, not a quota system. Furthermore, her acceptance of merit in the orchestra and the referee role relies on the existence of objective ranking, whereas stratified sampling requires administrative decisions about which categories matter and what quotas to set, which may strike her as a form of manipulation akin to choosing people who are good at being chosen. She values the blind screen and the blind draw because they remove the hand of the selector, and a stratified draw inevitably involves a selector defining the strata, which compromises the purity of the chance mechanism she so admires.

  To truly separate these rules and understand whether her commitment lies with the purity of the procedure or the representativeness of the outcome, you should put to her a case where a simple lottery has already taken place but produced an unrepresentative result. Imagine a citizens' assembly selected by a perfectly random draw from the entire electorate, which by chance returns a body that is predominantly white, male, and homeowner, failing to mirror the district's diversity. Ask her whether the authority of this panel should be accepted because the process was fair, or whether it should be dissolved and redrawn using stratification to ensure the demographics are corrected. If she accepts the unrepresentative body, she is a proceduralist who values Equal Probability above all; if she insists on a redraw to match the population, she is a substantivist who prioritises Descriptive Representation. Until you have her verdict on that hypothetical, the stratified panel remains a contested ground between her love for the honesty of the lot and her desire for the street to speak, but I would wager she will not suffer the weighting of the odds lightly.

  Yours ever,
  A Correspondent
