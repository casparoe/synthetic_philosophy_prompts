answer: |-
  This is a precise and demanding brief, fitting for a judge who recognizes that the *favor matrimonii* requires not only procedural rigor but also a disciplined moral anthropology. You are correct that Augustine's corpus is not a monolith, and that the reception of his teaching in Gratian and the subsequent tradition involves synthesis that sometimes smooths over the tensions you have identified.

  Here is the ranking, the practical analysis, and the recommendation for study, structured according to your constraints.

  ### I. Ranking of Contested Questions

  For the specific work of a diocesan tribunal adjudicating marriage nullity, the contested questions in the Augustinian corpus rank as follows, from most to least critical:

  1.  **The Scope of the Lying Act (Assertion vs. Intentional Misleading):** Does Augustine's prohibition cover only the *enuntiatio falsa* (false statement), or does it extend to *dissimulatio* (concealment) and non-assertive conduct intended to induce a false belief?
  2.  **The Locus of the Wrong (Injury vs. Disorder):** Is the primary evil of lying the damage inflicted on the neighbor (the deceived party) or the interior disorder/corruption of the speaker (the *cor duplex*)?
  3.  **The Authority of the Dialectic (*De Mendacio* vs. *Contra Mendacium*):** Should the earlier, exploratory distinctions in *De Mendacio* be treated as a reservoir of nuance for prudential application, or fully superseded by the absolute prohibitions of the later treatise?

  I have excluded the question of "truth owed only to neighbors" from the top three. While Augustine wrestles with this in *Contra Mendacium* regarding the Priscillianists, the canonical tradition (and the nature of the marriage covenant) universalizes the obligation of fidelity between spouses. Whether Augustine thought truth was owed *only* to the faithful matters less than whether he thought *deception* was permissible to protect a secret. The tribunal operates on the premise that spouses owe each other the truth; the Augustinian question is whether silence constitutes a breach of that debt.

  ### II. Practical Implications of the Top Questions

  Here is what turns on these questions in the concrete work of the tribunal, specifically regarding Canon 1098 (error induced by deceit) and Canon 1101 (simulation).

  **1. The Scope of the Act (Assertion vs. Misleading Conduct)**
  *   **The Tribunal Context:** The vast majority of "deceit" cases before a tribunal do not involve a party explicitly stating, "I am not sterile," or "I intend to be faithful." They involve the *silence* surrounding sterility, debt, prior children, or habitual intent.
  *   **What Turns on It:** If Augustine's definition of lying is restricted to false assertion, then a respondent's silence regarding a diriment impediment or a contrary intention is not, strictly speaking, a "lie" in the Augustinian sense, though it remains a concealment. If, however, Augustine's concept of the *double heart* covers any intentional induction of a false belief (including through silence or ambiguous conduct), then the moral gravity attaches to the concealment itself.
  *   **Concrete Impact:** This determines the **burden of proof regarding *dolus*.** If you adopt the narrower reading (assertion only), you must work harder to prove that the silence was not merely prudential reticence but an active instrument of deception. If you adopt the broader reading (intentional misleading), the mere fact of deliberate concealment of a material fact carries the moral weight of a lie. This directly influences how you weigh the testimony of a petitioner who says, "He never told me," versus a respondent who says, "She never asked." Under the broader reading, the respondent's silence is more readily categorized as a moral fault sufficient to vitiate consent.

  **2. The Locus of the Wrong (Injury vs. Disorder)**
  *   **The Tribunal Context:** You frequently encounter cases where the deceived party admits, "If I had known, I still might have married him," or where the deception (e.g., about a past relationship) produced no tangible harm to the marriage's stability before the breakdown.
  *   **What Turns on It:** If the wrong of lying is primarily **injury-based**, the gravity of the deception is tied to the consequences for the deceived party. If the deceived party was not "injured" (because they wouldn't have changed their decision, or the marriage lasted 20 years), the moral weight of the deception diminishes. If the wrong is primarily **disorder-based** (corruption of the speaker's integrity), the gravity is intrinsic to the act of deception, regardless of the outcome.
  *   **Concrete Impact:** This affects the **assessment of Materiality.** In an injury-based framework, you must scrutinize whether the deception actually caused the consent to be defective (causality). In a disorder-based framework, the act of deception itself is a violation of the *bonum fidei* (good of fidelity), which supports a finding of nullity even if the "victim" claims they were not harmed. A disorder-based reading strengthens the objective grounds for nullity (the integrity of the act) over the subjective grounds (the feelings of the party).

  **3. The Authority of the Dialectic**
  *   **The Tribunal Context:** This arises when advocates argue for exceptions based on "pastoral necessity" or "protecting a secret," citing the nuance of *De Mendacio*.
  *   **What Turns on It:** If *De Mendacio* is treated as authoritative nuance, there is room to argue that certain deceptions in marriage preparation (e.g., a pastor not revealing a penitent's past to a fiancé) are permissible "officious lies" or prudent silence. If *Contra Mendacium* supersedes it, the absolute prohibition holds, and the pastor's silence must be justified as *non-assertive concealment* rather than a lie.
  *   **Concrete Impact:** This is largely **procedural and advisory.** It changes how you instruct pastors and advocates on what they can say during the process. However, it is less determinative of the *sentence* than the first two questions. Whether the early work is authoritative affects the *reasoning* used to justify a decision, but rarely changes the *outcome* of a nullity case, provided the later treatise is held as the normative standard for moral gravity.

  ### III. The Choice: One Question for Study

  If you can put serious study into resolving only one question, it should be the first: **The Scope of the Act (Assertion vs. Intentional Misleading via Silence/Conduct).**

  **Why this is the upstream question:**
  This question is the gateway through which Augustine's moral theology enters the canonical mechanics of *dolus* and *simulation*.
  1.  **Prevalence:** As noted, most tribunal cases turn on concealment, not explicit falsehood. Resolving whether Augustine classifies deliberate, material concealment as a "lie" (or its moral equivalent) determines whether his absolute prohibition applies to the facts at hand.
  2.  **Dependency:** The answer to this question largely dictates the answer to the "Locus of the Wrong." If silence can be a lie, it is because the speaker intends a disorder in the mind of the hearer. If silence cannot be a lie, the wrong must be located elsewhere (e.g., in a violation of justice rather than truth).
  3.  **Tractability:** This is the most tractable question through close reading of the treatises themselves, specifically *Contra Mendacium*.

  **The Textual Hook:**
  Focus your reading on Augustine's treatment of the **Priscillianist infiltration** in *Contra Mendacium*. The heretics proposed *acting* a part (pretending to be Priscillianists) to expose the heretics. Augustine condemns this. He distinguishes between *lying* and *not revealing the truth*.
  *   **What to look for:** Trace how Augustine distinguishes *simulatio* (acting/pretending) from *mendacium* (speaking falsely). He argues that one can conceal the truth without lying, *provided* one does not assert the false.
  *   **The Tribunal Application:** This is the exact analogue to marriage simulation (c. 1101) and deceit (c. 1098). A party who "acts" the part of a faithful spouse while internally excluding fidelity is engaging in the very performance Augustine analyzes.
  *   **The Critical Nuance:** Augustine often allows for *dissimulatio* (hiding the truth) while forbidding *mendacium*. If you find that Augustine permits *dissimulatio* in certain contexts to protect a greater good (or because truth is not owed), you may find that **not all concealment in marriage preparation is morally equivalent to lying.** This might actually *restrict* nullity claims based on silence, protecting the *favor matrimonii* by requiring proof of an active intent to deceive rather than mere reticence.

  **Why this ranking could change:**
  The ranking would change only if your tribunal's docket shifts dramatically away from consent cases (c. 1095–1101) toward cases of **incapacity due to psychological factors** where deceit is not the central issue. If you were adjudicating mostly c. 1095 cases (lack of due discretion), the moral definition of lying is secondary to the psychological assessment of the act. In that scenario, the "Locus of the Wrong" (Injury vs. Disorder) might become more important, as it would help you weigh the *gravity* of a party's past behavior without necessarily labeling it a "lie."

  However, for a standard docket where *dolus* and *simulation* are frequent grounds, the definition of the act is the keystone. Resolving whether Augustine's "double heart" includes the silent concealer allows you to determine whether his absolute prohibition binds the parties' pre-nuptial conduct. It allows you to tell an advocate: "Augustine does not condemn all silence, only the silence that functions as a false assertion." That distinction alone will discipline more reasoning in your court than any other theoretical refinement.
