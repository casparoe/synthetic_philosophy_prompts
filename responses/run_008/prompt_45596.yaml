prompt: |-
  My wife teaches high school and wants to give her class a surprise quiz sometime next week (monday thru friday). Her plan is to announce on friday that there will be a quiz next week, and that it will be a surprise -- the kids won't know which day until she actually walks in with it that morning. At first that sounded fine to me, but then I got thinking: if thursday afternoon rolls around and there's been no quiz yet, the kids would know it has to be friday, so it wouldn't be a surprise anymore -- so it can't be on friday. But then if it can't be on friday, and wednesday afternoon comes with no quiz, they'd know it has to be thursday... and you can run the same logic all the way back and it seems like the quiz can't be a surprise on ANY day. So either her plan is impossible or something's off in my reasoning and I can't find where. She says I'm overthinking it and the kids will be plenty surprised no matter what, which honestly might be true. Is she right that it'll work in practice, and if so where exactly does my backwards argument break? Tell me how confident you are in your answer and what part you're least sure of.
