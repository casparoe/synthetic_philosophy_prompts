          *   *Stronger Hypothesis:* The *Bootstrap Problem* vs. *The Record Case*. The Record Case asks for a split (how much in artifact, how much in receiver). The Bootstrap Problem suggests you can't separate the instruction (outer) from the decoding mechanism. If the outer message *is* the key to the lock, you can't measure the lock's contribution independently of the key.
          *   *Decision:* I will argue that the *Record Case* (demanding a quantifiable split) and the *Information Theory Constraint* (structure doesn't fix interpretation) are jointly unsatisfiable *if* one demands an objective, non-arbitrary boundary. You can't quantify the split if the boundary is fluid.

