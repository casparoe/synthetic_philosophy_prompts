answer: |-
  No procedural checklist can reliably separate gaming from genuine improvement without external validation, so this protocol is designed not to certify metrics but to flag when a metric has lost its connection to reality and requires executive value judgments rather than analytical fixes.

  ### The Metric Validity Audit (MVA) Procedure
  **Timebox:** 40 minutes per metric per quarter.
  **Participants:** Lead Analyst, Clinical Subject Matter Expert (rotating), Department Manager.
  **Inputs:** Metric trend data (8 quarters), process map, compensation policy, recent incident reports.

  #### Step 1: The Proxy Drift Check (5 Minutes)
  **Question:** Does improvement in this number still correlate with the actual care outcome it was chosen to track?
  **Evidence Required:** 
  1. Plot metric vs. outcome (e.g., Hand Hygiene vs. HAI rates) for the last 8 quarters.
  2. Clinical SME verbal confirmation: "If this number goes up, does care actually get safer?"
  **Decision Logic:**
  *   **Correlation Broken + SME Says No:** **RETIRE** (for compensation); **HANDOFF** (if regulatory reporting requires it).
  *   **Correlation Weak + SME Says "Sometimes":** **PAIR** with a direct outcome metric.
  *   **Correlation Strong:** Proceed to Step 2.
  **Judgment Call:** The SME's assessment of "care actually getting safer" is subjective; prioritize patient safety outcomes over process efficiency.

  #### Step 2: The Gaming Vulnerability Check (10 Minutes)
  **Question:** Can staff achieve the target number without doing the underlying work?
  **Evidence Required:** 
  1. Process map review: Identify where the data is entered vs. where the work happens.
  2. "Red Team" query: Ask the Department Manager, "If you needed to hit this target by Friday without changing care, how would you do it?"
  **Decision Logic:**
  *   **Easy Workaround Identified (e.g., stopping clocks, upcoding):** **REVISE** (change data source) or **PAIR** with a counter-metric (e.g., LWBS rates for ER speed).
  *   **No Obvious Workaround:** Proceed to Step 3.
  **Judgment Call:** Distinguishing between "efficient workflow" and "gaming" relies on the Manager's honesty; if they hesitate, treat as a vulnerability.

  #### Step 3: The Selection Effect Check (10 Minutes)
  **Question:** Did the patient population change to make the number easier to hit?
  **Evidence Required:** 
  1. Review risk-adjustment variables (acuity, age, comorbidities) for the reporting period.
  2. Compare denominator volume vs. historical average.
  **Decision Logic:**
  *   **Significant Shift in Acuity/Volume:** **REVISE** (apply risk adjustment) or **RETIRE** (if adjustment is impossible).
  *   **Stable Population:** Proceed to Step 4.
  **Judgment Call:** Determining "significant" shift requires clinical context; a 5% drop in high-acuity patients may be noise or cream-skimming.

  #### Step 4: The Noise & Regression Check (5 Minutes)
  **Question:** Is the observed change within statistical noise or a one-time spike?
  **Evidence Required:** 
  1. Control chart review (look for points outside 3-sigma).
  2. Check for one-time events (policy changes, system outages).
  **Decision Logic:**
  *   **Within Noise/One-Time Spike:** **KEEP** (do not reward/penalize compensation this quarter).
  *   **Sustained Shift:** Proceed to Step 5.
  **Judgment Call:** Selecting the control limits; small teams often lack power for strict statistical significance, relying on trend direction.

  #### Step 5: The Value Conflict Check (10 Minutes)
  **Question:** Is achieving this metric driving behavior that conflicts with other organizational values?
  **Evidence Required:** 
  1. Review complaints from other departments (e.g., Floor vs. ER).
  2. Review unintended consequences (e.g., Discharge before noon vs. Readmission).
  **Decision Logic:**
  *   **Conflict Identified:** **HANDOFF** to Executive Committee (this is a values trade-off, not a data fix).
  *   **No Conflict:** **KEEP** (metric validated for this quarter).
  **Judgment Call:** This is purely political/ethical; the analysts cannot resolve this, only surface it.

  ---

  ### Procedure Failure Modes
  1.  **Collusion:** If the Department Manager and SME are incentivized to protect the metric, Step 2 and 5 will yield false negatives. *Mitigation:* Rotate SMEs and anonymize "Red Team" inputs.
  2.  **Lagging Indicators:** This procedure validates the *current* quarter, but gaming often appears in *future* quarters (e.g., readmissions spike after discharge metrics improve). *Mitigation:* Re-run Step 1 annually with lagged outcome data.
  3.  **Analysis Paralysis:** Flagging too many metrics for Handoff overwhelms the Executive Committee. *Mitigation:* Cap Handoffs at 3 per quarter; force ranking of risks.
  4.  **The "Measure What Matters" Trap:** The procedure assumes the original metric was valid; if the goal itself was wrong (e.g., "speed" over "accuracy"), Step 1 will not catch it if the SME is aligned with the flawed goal. *Mitigation:* Require one external benchmark per year.

  ---

  ### Application to Your Three Metrics

  #### 1. ER Door-to-Doctor Time
  *   **Step 1 (Proxy):** Correlation to patient outcomes (mortality/satisfaction) is weak if "door" is manipulated. SME confirms "time in waiting room" matters more than "time in system."
  *   **Step 2 (Gaming):** **FAIL.** Manager admits registration staff can delay clock start until triage is complete ("parking in hallways"). Data entry point is decoupled from physical arrival.
  *   **Step 3 (Selection):** Acuity stable.
  *   **Step 4 (Noise):** Trend shows improvement, but Step 2 invalidates it.
  *   **Step 5 (Values):** Conflict between Speed and Triage Accuracy.
  *   **Recommendation:** **REVISE.** Change metric to "Triage-to-Provider" (harder to game) and **PAIR** with "Left Without Being Seen" rates. Do not use current metric for compensation until data entry is automated (RFID badges).

  #### 2. Hand-Hygiene Compliance (Secret Observers)
  *   **Step 1 (Proxy):** **FAIL.** Correlation to Hospital-Acquired Infection (HAI) rates has drifted; compliance is up 15%, HAIs flat. SME notes observers catch "performative" washing, not compliance during high-stress procedures.
  *   **Step 2 (Gaming):** **FAIL.** Hawthorne effect is inherent to observation; staff recognize observers or are told rounds are happening.
  *   **Step 3 (Selection):** N/A.
  *   **Step 4 (Noise):** Statistically significant improvement, but likely artificial.
  *   **Step 5 (Values):** **HANDOFF.** Regulatory pressure requires reporting, but compensation linkage creates risk of "compliance theater."
  *   **Recommendation:** **HEAVILY DISCOUNT/RETIRE FOR COMPENSATION.** Keep for regulatory reporting (compliance), but remove from bonus calculations. **PAIR** with HAI rates for internal quality goals. The procedure confirms your suspicion: this metric measures visibility, not hygiene, when tied to pay.

  #### 3. Discharge-Before-Noon
  *   **Step 1 (Proxy):** Weak correlation to efficiency gains if readmissions rise.
  *   **Step 2 (Gaming):** **PASS.** Hard to game without clinical risk (patients either leave or they don't).
  *   **Step 3 (Selection):** **FAIL.** Floor managers may be selecting easier patients for early discharge, leaving complex cases for later.
  *   **Step 4 (Noise):** Trend is strong.
  *   **Step 5 (Values):** **HANDOFF.** Explicit conflict between Executive desire for bed turnover and Floor concern for safety/readmissions.
  *   **Recommendation:** **HANDOFF TO EXECUTIVE COMMITTEE.** This is not a data problem; it is a resource allocation problem. **PAIR** immediately with 30-day Readmission Rates; if Readmissions rise, the metric is costing more than it saves.

  ### Bottom Line on Hand-Hygiene
  The procedure dictates you must **retire hand-hygiene compliance as a compensation metric** immediately. Step 1 (Proxy Drift) and Step 2 (Gaming) both fail: the number no longer tracks infection risk, and it incentivizes performance for observers rather than sterile technique during critical care. Keep it for regulatory compliance to avoid fines, but decouple it from pay to stop funding "compliance theater."
