answer: |-
  Dear friend, it is completely understandable that you are wrestling with this, because promises are the invisible architecture of human relationships in fiction just as they are in life. When a character breaks a promise, the reader feels a structural shift in the world you have built, and if that shift feels arbitrary, the trust between author and reader fractures just as trust fractures between people. Looking at the gut verdicts you have listed, I believe there is indeed a single principle that can harmonize them, though it requires you to listen to that bug in your ear regarding the blackmail scenario. The unifying thread across your intuitions is that a promise only binds when it is the autonomous commitment of a competent agent toward a permissible end. This means the person making the promise must have the capacity to understand what they are doing, the freedom to choose otherwise, and the object of the promise must not be morally corrupt.

  When you apply this lens to your existing verdicts, most of them align perfectly without needing adjustment. A promise made at gunpoint fails because the freedom to choose otherwise is removed by the threat of violence. A promise extracted by a con artist fails because the capacity to understand the situation is compromised by fraud; you cannot consent to a reality that does not exist. The distinction between the tipsy promise and the falling-down-drunk promise is a gradient of capacity. Being tipsy might lower inhibitions, but you still possess your faculties, whereas being incapacitated by alcohol removes the competent agency required to make a binding commitment. The verdict on immoral promises is also clear under this principle; since the end is impermissible, the commitment itself is void because one cannot obligate oneself to do evil. The deathbed promise is the most poignant because it tests whether the obligation lies in the enforcement by the receiver or the integrity of the giver. Under this principle, the binding nature survives the friend's death because the autonomous commitment was made while the friend was alive, and the obligation now rests on the promisor's honor rather than a transactional exchange.

  The verdict that stands out as inconsistent is the one regarding blackmail, where you feel the promise binds a little even though you acknowledge it is coercion. That bug you feel is your moral intuition correcting your logical assessment. If a promise made at gunpoint does not bind because the will is overborne by threat, then a promise made under the threat of exposure must also fail to bind. The content of the threat, whether it is violence or the revelation of truth, is less important than the fact that the promise is being used as a shield against harm rather than offered as a gift of trust. If you allow this promise to bind even a little, you introduce a double standard where the legality of the threat outweighs the autonomy of the promisor. For the sake of consistency in your novels, I would advise you to treat this promise as non-binding. The character might feel guilt or fear, but they should not feel morally obligated to fulfill a vow extracted through exploitation, regardless of whether the blackmailer was holding a gun or a secret.

  Regarding your New Year's resolutions, you have already identified the distinction correctly by noting they feel like a separate kind of wrong. A promise is inherently interpersonal; it creates a bridge of expectation between two souls. A resolution is intrapersonal; it is a matter of integrity and self-discipline. Breaking a promise to another person is a betrayal of trust, while breaking a resolution is a failure of self-governance. Keeping these categories separate in your writing will actually add depth, as a character who keeps promises to others but lies to themselves presents a different psychological profile than one who is honorable with themselves but flaky with friends. You do not need to force these into the same bucket; recognizing them as distinct moral currencies will make your characters feel more real.

  This brings us to the case you have not yet decided, where a character promises to repay what she thinks is a debt, only to discover the original loan was actually a gift the lender misremembered. Under the principle of autonomous commitment to a permissible end, this promise is built on a mistake of fact. Much like the con artist scenario, the information underlying the consent was false, though in this case, it was an innocent error rather than malicious fraud. Because the premise of the debt does not exist, the obligation to repay it does not exist either. The promise was to rectify a wrong, and since there is no wrong to rectify, the binding nature of the promise dissolves. However, this offers a beautiful opportunity for character development. While the promise does not bind as a debt, the character could choose to honor it as a new gift, transforming the transaction from obligation to gratitude. If she pays, it should be because she wants to acknowledge the past help, not because she is bound by the word she spoke under a misconception. If she does not pay, she should not be portrayed as dishonorable, but perhaps as relieved of a burden that never truly existed.

  Ultimately, your reviewer was pointing toward a need for moral coherence, not necessarily rigid legalism. Readers forgive characters who break promises for good reasons or under impossible constraints, but they do not forgive authors who change the rules of the world to suit the plot. By anchoring your characters' sense of obligation in their capacity, their freedom, and the morality of the act, you create a consistent internal logic. You can then have fun watching your characters struggle within those boundaries. A character who feels bound by a deathbed promise when no one is watching is compelling. A character who refuses a promise made under blackmail is principled. A character who repays a gift thinking it is a debt is mistaken, but one who repays it knowing it was a gift is generous. Trust that gut feeling that told you the blackmail scenario was buggy, and let that guide you toward a framework where promises are sacred only when they are freely given.
