  4.  **Impersonal-to-Personal bridge:** 0.60
      *   *Justification:* Conditional on 3 being false, there is a moderate probability that group-directed principles can generate duties owed to specific individuals rather than the collective.
  5.  **Harmless-wronging viability:** 0.65
      *   *Justification:* Rights-based or contractualist frameworks can ground a grievance without requiring a welfare comparison to a non-existent baseline.

