  I am treating Terms 1 and 2 as necessary gates (multiplicative). Terms 3, 4, and 5 form a "Baseline Override Cluster": P holds if the comparative constraint fails (Not 3) OR if an alternative grounding succeeds (4 or 5). I am assuming significant positive correlation between 4 and 5 (if you accept one non-comparative framework, you likely accept the other), so I am using a probability union formula with a 0.5 overlap coefficient rather than simple addition.

