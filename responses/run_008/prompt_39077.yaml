answer: |-
  Karl Popper's formulation of the paradox of tolerance appears in a footnote to *The Open Society and Its Enemies* (1945). It is often quoted selectively. Popper's full constraint is that intolerant movements should only be suppressed *if they are not prepared to meet us in rational argument* and *if they begin by denouncing all argument* and *teach their followers to answer arguments by blows or guns.*

  Modern usage frequently strips these constraints. To clarify the logical landscape, here is a menu of distinct theses that the slogan "Paradox of Tolerance" is often made to bear, evaluated by their coherence, defensibility, and licensing power.

  ### 1. The Institutional Self-Defense Thesis (Militant Democracy)
  *   **Definition:** Tolerance is an **institutional policy** of a liberal state. The "intolerant" are **political organizations aiming to abolish democratic institutions** (e.g., a party running on a platform to end elections). Refusing tolerance amounts to **legal prohibition or state coercion**.
  *   **Status:** **Substantive and Defensible.** This is the doctrine of "militant democracy" (e.g., post-war Germany banning the SRP or KPD). It recognizes that procedural democracy can be used to vote in substantive authoritarianism.
  *   **Licensing Power:** Licenses banning political parties or disqualifying candidates. Does **not** license deplatforming private citizens or suppressing mere speech.
  *   **Merely Offensive Views?** **No.** This thesis requires a concrete program to dismantle rights, not just offensive rhetoric.
  *   **Vulnerability to Riposte:** **Low.** The threshold is high (constitutional abolition), making it difficult to weaponize against standard opposition parties.

  ### 2. The Discursive Integrity Thesis
  *   **Definition:** Tolerance is a **rule of discourse** within a specific forum (academic, digital, civic). The "intolerant" are **actors who use speech to shut down the speech of others** (e.g., harassment, doxxing, flooding channels to silence). Refusing tolerance amounts to **moderation or exclusion from the forum**.
  *   **Status:** **Substantive and Defensible.** This views tolerance not as an infinite void but as a system requiring maintenance. If speech acts functionally destroy the possibility of speech for others, removing them preserves the system.
  *   **Licensing Power:** Licenses content moderation, banning users from platforms, and removing speakers from venues. Does **not** license state coercion or physical violence.
  *   **Merely Offensive Views?** **No.** The criterion is *disruption of discourse*, not the content's offensiveness. A polite white supremacist could theoretically remain; a shouting mob silencing a speaker could not.
  *   **Vulnerability to Riposte:** **Medium.** Vulnerable if platform owners define "disruption" loosely to include "making users feel unsafe due to offensive ideas." Requires transparent moderation standards to resist abuse.

  ### 3. The Reciprocity Thesis
  *   **Definition:** Tolerance is a **social contract or reciprocal arrangement**. You are entitled to tolerance only insofar as you extend it to others. The "intolerant" are **those who explicitly reject the norm of reciprocity**. Refusing tolerance amounts to **social ostracism or withdrawal of cooperation**.
  *   **Status:** **Platitude (with caveats).** It is logically consistent (you cannot claim a right you deny others), but practically difficult. It assumes a clear baseline of what "tolerance" requires.
  *   **Licensing Power:** Licenses social shunning, refusing to debate, and private deplatforming.
  *   **Merely Offensive Views?** **Borderline.** If "offense" is framed as a denial of equal status (e.g., "Group X is subhuman"), it triggers this thesis. If offense is merely aesthetic or cultural, it does not.
  *   **Vulnerability to Riposte:** **High.** Highly susceptible to the "Who decides?" problem. If Side A believes Side B's existence is intolerant (e.g., religious vs. secular conflicts), both can claim the other broke reciprocity first.

  ### 4. The Moralized Harm Thesis
  *   **Definition:** Tolerance is an **individual moral virtue**. The "intolerant" are **those holding bigoted views that cause psychological or social harm**, even without force. Refusing tolerance amounts to **public condemnation and suppression of the view**.
  *   **Status:** **Controversial / Potentially False.** This conflates *holding* an intolerant view with *acting* intolerantly. Popper explicitly argued against suppressing ideas that can be countered by argument.
  *   **Licensing Power:** Licenses deplatforming, firing from employment, and social shaming for holding specific views.
  *   **Merely Offensive Views?** **Yes.** This is the reading most often used to justify suppressing views that are offensive or bigoted but not necessarily aimed at legal abolition of rights.
  *   **Vulnerability to Riposte:** **Very High.** Because "harm" and "bigotry" are culturally contingent, this reading allows any majority to label a minority view "intolerant" to suppress it. It lacks a structural safeguard against definition creep.

  ### 5. The Physical Self-Defense Thesis
  *   **Definition:** Tolerance is **non-aggression**. The "intolerant" are **those initiating or inciting imminent violence**. Refusing tolerance amounts to **physical counter-force (punching)**.
  *   **Status:** **Substantive and Defensible** (as standard self-defense). This is less a "paradox of tolerance" and more a "right to self-defense."
  *   **Licensing Power:** Licenses physical confrontation only in cases of imminent threat or active incitement. Does **not** license suppressing speech or deplatforming.
  *   **Merely Offensive Views?** **No.** Words alone, however offensive, do not justify physical force under this reading.
  *   **Vulnerability to Riposte:** **Low.** Legal and ethical standards for "imminent violence" are well-established (e.g., *Brandenburg v. Ohio* standards).

  ---

  ### Analysis of the "Who Decides?" Riposte

  The standard riposte is: *"If you license intolerance of the intolerant, every faction will define its opponents as intolerant to justify suppression."*

  **Most Vulnerable Readings:**
  *   **The Moralized Harm Thesis (4)** is the most vulnerable. Because it relies on subjective assessments of "harm" and "bigotry" without requiring institutional action or imminent violence, it offers no structural brake on abuse. In a polarized environment, Side A defines Side B's existence as harmful violence, and Side B defines Side A's censorship as harmful violence. The paradox becomes a circular weapon.
  *   **The Reciprocity Thesis (3)** is also vulnerable. In "culture war" contexts, reciprocity is often the first thing discarded. If both sides believe the other is acting in bad faith, both can claim the contract is void.

  **Readings with Structural Safeguards:**
  *   **The Institutional Self-Defense Thesis (1)** has the strongest safeguard. It relies on **constitutional courts and legal thresholds**. It requires proving a party intends to dismantle the democratic order, not just that they are offensive. This moves the decision from the mob to the judiciary.
  *   **The Discursive Integrity Thesis (2)** has a procedural safeguard. If a platform's rules are clear (e.g., "no harassment," "no spam"), the decision is technical rather than ideological. However, this fails if the platform owners are partisan.
  *   **Popper's Original Constraint:** Popper provided a specific structural answer to the riposte: **The Presumption of Rationality.** We must tolerate the intolerant *as long as* they are prepared to meet us in rational argument and keep their followers from violence. The burden of proof lies on the suppressor to demonstrate that rational counter-argument is no longer possible. This creates a high bar that prevents the slogan from being used against mere dissent.

  ### Summary: Does it license suppressing merely offensive views?

  *   **Readings 1, 2, and 5:** **No.** These require action (abolishing democracy, disrupting discourse, or violence) rather than mere content.
  *   **Reading 3:** **Maybe,** depending on whether the offense is interpreted as a breach of reciprocity.
  *   **Reading 4:** **Yes.** This is the only reading that licenses suppressing views solely because they are offensive or bigoted, but it is also the reading most logically fragile and most vulnerable to the "Who decides?" abuse.

  **Conclusion:**
  The "Paradox of Tolerance" is a **platitude** if it means "systems can be destroyed by their own rules." It is a **substantive defense** if it means "democracies must legally defend themselves from abolitionists" (Reading 1) or "forums must moderate harassment to preserve speech" (Reading 2). It becomes **false or dangerous** when used to argue that offensive ideas must be suppressed by force or social coercion (Reading 4), as this ignores Popper's explicit condition that rational argument must be tried first. The slogan is most robust when tied to **institutional survival** and **imminent violence**, and most abusive when tied to **moral offense** and **social exclusion**.
