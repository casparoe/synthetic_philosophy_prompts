      *Refining the Worked Case:* Let's use a specific example. An agent choosing between three routes to work, or three meals. Let's go with meals. A (Italian), B (Thai), C (Mexican). Prefers A to B today, B to C tomorrow, C to A next week due to satiation cycles. But knows this. If offered swaps with cost, they refuse based on plan. Pump argument says preferences are irrational. Intuition says managing satiation is rational. This highlights the tension.

