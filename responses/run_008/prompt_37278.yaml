      *   *Disanalogy 3: Adjustability.* Ponzi schemes hide losses until collapse; PAYG can adjust parameters (tax rates, retirement age, benefit levels). *Relevance:* **High.** It prevents "collapse."
      *   *Disanalogy 4: Asset Backing/Reserves.* Some PAYG have buffer funds; Ponzis have none. *Relevance:* Medium.
