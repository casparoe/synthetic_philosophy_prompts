answer: |-
  # The Generalization License Protocol (GLP)

  **Purpose:** To determine whether a model's high performance on an evaluation benchmark licenses the claim that it will generalize to deployment conditions, or whether the performance is "competence without comprehension" (fragile pattern matching).

  **Philosophy:** We do not ask "Does the model understand?" We ask: "What selection pressure created this success, and does that pressure exist in the deployment environment?"

  **Who runs this:** The Eval Engineer owning the benchmark.
  **Timebox:** 2–4 hours per model release candidate.

  ---

  ## Phase 1: Lineage & Selection Pressure
  *Goal: Determine if the training signal matches the deployment reality.*

  **1.1 The Data Origin Check**
  *   **Question:** Is the ground truth in your eval set generated by a process (human or rule-based) that will exist in deployment?
  *   **Pass:** Ground truth reflects objective reality (e.g., "Did the appointment actually happen?").
  *   **Fail:** Ground truth reflects a legacy process (e.g., "Did the human router click Queue B?", "Did the old rule engine output X?").
  *   **Action:** If **Fail**, you have evidence of **Mimicry Competence**. The model learned the artifacts of the old system, not the underlying logic.
      *   *Constraint:* If you are training on data generated by old routing rules (as you mentioned), you automatically trigger a **Yellow Flag**. You are not licensed to claim the model handles *new* rules better than the old ones.

  **1.2 The Shortcut Scan**
  *   **Question:** Is there a feature in the training data that correlates with the label but is not causal? (e.g., specific phrasing used only by angry patients, timestamps that correlate with queue depth).
  *   **Test:** Run a feature importance or saliency check.
  *   **Pass:** Model attends to semantic content relevant to the task.
  *   **Fail:** Model attends to metadata, formatting artifacts, or spurious correlations.
      *   *Action:* If **Fail**, revoke generalization license for any deployment where that artifact might change.

  ## Phase 2: Perturbation & Stability
  *Goal: Test if competence survives the removal of surface patterns.*

  **2.1 The Counterfactual Test**
  *   **Question:** If we change the surface form without changing the underlying intent, does performance hold?
  *   **Test:** Create a "stress set" (50–100 examples) where you paraphrase inputs, swap synonyms, or alter non-essential formatting, keeping the *correct action* identical.
  *   **Pass:** Performance drop < 5%.
  *   **Fail:** Performance drop > 10%.
      *   *Action:* If **Fail**, the model is pattern matching on syntax, not comprehending intent. No license to generalize to new phrasing.

  **2.2 The OOD (Out-of-Distribution) Probe**
  *   **Question:** Does the model handle inputs that were structurally impossible during training?
  *   **Test:** Introduce a new category, slot type, or rule that did not exist in the training window.
  *   **Pass:** Model degrades gracefully (e.g., outputs "Unknown" or asks for clarification) or infers correctly via analogy.
  *   **Fail:** Model hallucinates a known category or crashes.
      *   *Action:* If **Fail**, you are not licensed to claim the model adapts to product changes.

  ## Phase 3: The Feedback Loop Check
  *Goal: Handle the case where the model predicts the process that created its data.*

  **3.1 The Static vs. Dynamic Check**
  *   **Question:** If this model is deployed, will it change the distribution of data it sees next?
  *   **Context:** You noted your booking data is generated by old routing rules. If the new model changes routing, the data distribution shifts.
  *   **Test:** Simulate a feedback loop. If the model routes differently, does the "ground truth" for the next training cycle change?
  *   **Verdict:** If **Yes**, you cannot use historical accuracy as a proxy for future success. Historical accuracy measures how well you fit the *past* policy, not how well you optimize the *future* outcome.
      *   *Action:* This requires a Judgment Call (see below). You need a causal metric (e.g., "patient wait time") not a mimicry metric (e.g., "agreement with old router").

  ## Phase 4: Verdict & Licensing
  *Combine the flags to issue a license.*

  *   **🔴 No License:** Failed Phase 1 (Mimicry) OR Failed Phase 2 (Perturbation).
      *   *Meaning:* Do not claim generalization. Deploy only under strict monitoring. Marketing claims about "understanding" are prohibited.
  *   **🟡 Cautious License:** Passed Phase 1 & 2, but Triggered Phase 3 (Feedback Loop).
      *   *Meaning:* Model is robust, but the goalpost moves when you deploy. Generalization is licensed only for the *current* policy environment.
  *   **🟢 Full License:** Passed all phases.
      *   *Meaning:* Rare. Competence is likely supported by comprehension of causal factors.

  ---

  ## ⚠️ The "Judgment Wearing a Labcoat" Disclaimer

  This procedure cannot eliminate human judgment. It formalizes it. Be honest about where you are guessing:

  1.  **Defining "Causal":** In Phase 1.2, deciding what is a "shortcut" vs. a "valid signal" is subjective. (e.g., Is "evening" a shortcut for "urgent"? Maybe, maybe not). *This is a judgment call.*
  2.  **Perturbation Severity:** In Phase 2.1, how much paraphrasing is enough? If you change too much, you change the label. *This is a judgment call.*
  3.  **The "Understanding" Claim:** This procedure **cannot** verify understanding. It can only verify *robustness*. If you pass all steps, you have a model that is hard to break, not necessarily one that "knows" what it's doing. Do not confuse robustness with comprehension.

  ---

  ## Application to Backlog Cases

  Here is the GLP applied to your three specific scenarios.

  ### Case 1: The 97% Agreement Router
  *   **Scenario:** Fine-tuned model routes patient messages. Hits 97% agreement with current human routers on historical data.
  *   **GLP Run:**
      *   **Phase 1.1 (Data Origin):** **FAIL.** Ground truth is "Human Router Click." This is legacy behavior, not objective truth.
      *   **Phase 1.2 (Shortcuts):** **YELLOW FLAG.** Humans are inconsistent. If the model learned the *consistency* of the rules, great. If it learned the *inconsistency* (e.g., "Router A likes to send 'pain' keywords to Queue 2"), it's brittle.
      *   **Phase 3 (Feedback):** **FAIL.** If the model routes differently, the future "human router" data (used for retraining) becomes invalid because the mix of cases changes.
  *   **Verdict:** **🔴 No License.**
  *   **Why it annoys people:** The team sees 97% and wants to ship. The GLP says this is high-fidelity mimicry of a potentially flawed process. You are not licensed to say it "understands patient needs." You are only licensed to say it "predicts the current human router." If the human routing policy changes, this model is technical debt.

  ### Case 2: The Slot Explanation Model
  *   **Scenario:** Model explains why a slot is unavailable. Great on test set. Never seen new slot types added post-training.
  *   **GLP Run:**
      *   **Phase 1.1 (Data Origin):** **PASS.** Explanations are usually based on hard constraints (inventory logic), not human whim.
      *   **Phase 2.2 (OOD Probe):** **FAIL.** You explicitly stated it hasn't seen new slot types. If the explanation logic relies on embedding similarity to known slot types, it will hallucinate reasons for new types.
      *   **Phase 2.1 (Perturbation):** **PASS.** (Assumed, based on "does great on test set").
  *   **Verdict:** **🟡 Cautious License.**
  *   **Condition:** You may deploy, but you must implement a guardrail that detects "New Slot Type" and falls back to a template response. You are not licensed to claim the model handles *any* slot type.

  ### Case 3: The "Patient-Centric" Marketing Claim (The Unpopular One)
  *   **Scenario:** Marketing wants to claim: "Our AI understands patient urgency and prioritizes accordingly." You have a model that predicts "Urgency Score" with high AUC on historical data.
  *   **GLP Run:**
      *   **Phase 1.1 (Data Origin):** **FAIL.** Historical "Urgency" is defined by *triage staff labels*, not patient outcomes (e.g., did the patient actually need care soon?). Triage staff are biased by workload.
      *   **Phase 1.2 (Shortcuts):** **FAIL.** Saliency maps show the model weights keywords like "please" and "ASAP" heavily, regardless of clinical context (which you don't have, but operational context exists).
      *   **Phase 2.1 (Perturbation):** **FAIL.** When you remove "ASAP" from the text but keep the medical reason, urgency score drops 40%.
  *   **Verdict:** **🔴 No License.**
  *   **Why it annoys people:** Marketing has the deck ready. Sales is selling "intelligent triage." The GLP proves the model is actually "Keyword Matching for Politeness."
  *   **Hard Truth:** If you ship this with the marketing claim, you are lying. The model has competence (it predicts the triage label) without comprehension (it doesn't know what urgency *is*). If a patient writes calmly but has a critical issue, the model will deprioritize them. The procedure forces you to block the claim.

  ---

  ## What This Procedure Cannot Do

  1.  **It Cannot Prove Comprehension:** As per Dennett, "comprehension" is a stance we take toward a system when it's safe to do so. This procedure tells you when it is *safe*, not when it is *true*. You might pass all checks and still fail on a Black Swan event (e.g., a new disease outbreak changes scheduling norms entirely).
  2.  **It Cannot Solve Causal Confusion:** If your training data is fundamentally confounded (e.g., you only have data on patients who *successfully* booked), no amount of eval procedure will fix the fact that you don't know why others dropped off.
  3.  **It Cannot Replace Monitoring:** A "Full License" is valid only for the moment of deployment. As soon as the world shifts (Phase 3), the license expires. You need online monitoring to know when to re-run the GLP.

  ## Summary for the Team
  When someone says "The model understands X," use the GLP to ask: **"What selection pressure makes you say that?"**
  *   If the pressure was "match the old human labels," it's mimicry.
  *   If the pressure was "optimize for patient wait time," it's closer to comprehension.
  *   If the pressure is unknown, assume mimicry.

  Print this. Tape it to the monitor next to the benchmark dashboard.
