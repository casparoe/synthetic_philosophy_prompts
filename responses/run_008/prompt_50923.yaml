answer: |-
  You have correctly identified the pressure point. Dan has reconstructed a classic defense of Milton Friedman's instrumentalism (often called the "F-Twist"), and he has done it cleanly. His argument is logically valid *if* you accept his definitions. But your discomfort is the philosophical alarm bell ringing.

  Your instinct is right: the slide happens between **(2) and (3)**. However, Dan anticipates this attack with step **(6)**. Step (6) is a defensive maneuver designed to make his position unfalsifiable by translating any objection back into his own terms.

  To beat Dan, you cannot just say "degrees matter." You have to show why his translation in (6) fails to capture what economists actually *do* when they criticize assumptions.

  Here is the price list for the three main options available to you in the seminar.

  ### Option 1: Reject Premise (3) (The "Degrees of Abstraction" Defense)
  **The Move:** You argue that while all assumptions are literally false (premise 2), they are not *equally* false in a way that matters. The Map/Territory analogy is misleading. A map that omits a mountain is useful for driving; a map that omits the ocean is not useful for sailing. The omission is the same type of error (simplification), but the *consequence* differs based on the context of use.

  *   **Why it looked fine:** It appeals to common sense. Obviously, assuming zero friction for a curling stone is different than assuming zero friction for a marble in honey.
  *   **The Cost to You:** You must provide a criterion for "negligibility" that does not rely solely on whether the prediction worked *after the fact*. If you say "the assumption is negligible because the prediction worked," Dan wins (that's his step 6). You need an *independent* reason why an assumption is critical (e.g., causal structure, stability).
  *   **The Cost to Dan:** He loses the clean shield of "anything goes." He has to admit that some assumptions are *intrinsically* suspect before testing predictions. This opens the door to realism: we care about assumptions because they represent mechanisms, not just output.

  ### Option 2: Reject Premise (6) (The "Policy Invariance" Defense)
  **The Move:** This is the strongest philosophical leverage. You argue that assumption-talk is **not** just disguised prediction-talk. Assumptions determine *which* predictions remain stable when the environment changes.
  *   **The Argument:** Two models might predict the same outcome today (predictive equivalence). Model A assumes drivers maximize utility; Model B assumes drivers flip coins but happen to match utility maximization by chance. Dan says these are identical. You say: If the government changes a traffic law, Model A might still hold, but Model B will fail. Criticizing the assumption (coin-flipping) is a claim about **structural stability**, not just current predictive success.
  *   **Why it looked fine:** Dan wants to collapse "why it works" into "that it works." This preserves the distinction.
  *   **The Cost to You:** You have to invoke the **Lucas Critique**. You must argue that we care about assumptions because we want to use models for *policy intervention*, not just forecasting. If we only care about forecasting (passive prediction), Dan is right. If we care about intervention (active prediction), assumptions matter independently.
  *   **The Cost to Dan:** He is forced to admit that "prediction" is too narrow a category. He has to expand "prediction" to include "prediction under structural change," which effectively concedes that the *mechanism* (the assumption) matters.

  ### Option 3: Accept Dan (The "Hard Instrumentalist" Bargain)
  **The Move:** You nod and accept that economics is purely about saving the phenomena. Assumptions are just filing cabinets for predictions.
  *   **Why it looked fine:** It solves the demarcation problem. It stops endless metaphysical debates about whether humans are *really* rational. It keeps science "empirical."
  *   **The Cost to You:** You lose the ability to **build** models. If you cannot judge assumptions before testing predictions, model construction becomes blind trial-and-error. You also lose the ability to distinguish between a model that is right for the right reasons vs. right for the wrong reasons (spurious correlation).
  *   **The Cost to Dan:** He makes economics indistinguishable from curve-fitting. He cannot explain why we prefer Newtonian physics over a complex polynomial that fits the data better but has no physical assumptions. He sacrifices *understanding* for *fit*.

  ### Recommendation: Attack Step (6)
  Your instinct to fight between (2) and (3) is correct, but Dan's step (6) is where he hides the cost. If you attack (3) directly, he will just say "define 'degree' without using predictions." You will get stuck in semantics.

  Instead, **reject (6)**.

  Tell Dan: *"If assumption criticism is just disguised prediction criticism, then you cannot explain why we prefer a model with realistic assumptions over a black-box neural net that has the same predictive power. We prefer the former because we believe the assumptions capture the **causal structure** that will persist when we intervene. If you reduce assumptions to predictions, you make policy analysis impossible. You are pricing out the ability to know **why** a model fails, which is the only way to fix it."*

  **The Price:**
  *   **You pay:** You must accept that "truth" in economics is about structural invariance, not literal description. You have to do the hard work of justifying *which* assumptions are structural.
  *   **Dan pays:** He must concede that methodology matters. He can no longer say "assumptions don't matter." He has to say "assumptions matter *only* insofar as they guarantee stability under intervention." But once he says that, he has surrendered the core of Friedman's 1953 essay, which was that assumptions *themselves* are irrelevant.

  **Summary for Seminar:**
  Don't fight about whether assumptions are false (they are). Fight about whether **all false assumptions are functionally equivalent.** Dan says yes (via step 6). You say no, because assumptions carry information about **counterfactuals** that raw predictions do not. If you accept Dan, you can forecast the weather, but you can't seed the clouds.
