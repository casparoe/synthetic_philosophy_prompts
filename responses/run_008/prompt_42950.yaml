answer: |-
  Here is the breakdown of your opponent's game, the predicted verdicts, and the case that will expose the machinery behind her smugness.

  ### The Rule: The 'Honour Collapse' Thesis

  You are correct to sense an Appiah-ish flavour to her judgements. The implicit rule she is running is not merely about whether a practice ended, nor even strictly about whether it was legislated against. It is about **where the impulse for the change originated.**

  Her rule is: **A shift counts as a moral revolution only when the practice becomes untenable to the self-conception of the people who *perform* or *uphold* it.**

  If a practice stops because an external power bans it (Prohibition, Sati), it is merely coercion. If it stops because the practitioners themselves decide it is 'bad form', 'ungentlemanly', or 'shameful' (Duelling, Slavery Abolition, Footbinding), it is a revolution. The Sati verdict is the key: she marked it 'No' not because widow-burning is morally defensible, but because the ban was a colonial imposition. The moral credit, in her view, belongs to the society that changes its own mind, not the empire that cracks the whip. She is looking for the collapse of *honour*, not the application of *force*.

  ### The Four Verdicts

  Here is how she will rule on your modern cases, based on that principle.

  **(1) Smoking's fall from glamour: YES.**
  This is the cleanest fit. There was no total ban on smoking in private or even in all public spaces immediately; rather, the social cachet evaporated. Doctors stopped endorsing them, then friends stopped tolerating them, then smokers began apologising for it themselves. The practitioners (smokers) internalised the stigma. They huddle outside not just because of the law, but because they know they smell of ash and are no longer welcome in the polite centre of the room. The honour of the habit collapsed.

  **(2) Smacking children: NO.**
  This will be her 'Sati' case. The shift is currently driven by statutory bans in Scotland and Wales, whilst in England it remains legally defensible under 'reasonable chastisement'. Because the change is patchwork and reliant on legal prohibition rather than a universal parental consensus that the act is inherently shameful, she will rule it 'not a revolution'. Many parents still view it as a private right; until the practitioners (parents) universally view it as a moral failing rather than a legal risk, it is merely regulation.

  **(3) Factory farming: NO.**
  She will dismiss this out of hand, partly because the practice persists, but primarily because the 'honour' of the consumer has not collapsed. People eat factory-farmed meat with a shrug or a vague unease, but not with the active shame of a smoker. Until the act of buying a cheap chicken becomes socially equivalent to lighting up in a nursery, it is not a revolution. It is merely a pending ethical debate.

  **(4) Workplace conduct (post-2017): YES.**
  This is the #MeToo effect. While HR policies have tightened, the driving force has been social shaming and the destruction of reputations. Behaviours that were once considered 'boss's prerogative' or 'locker room banter' are now career-ending sins. The practitioners (predatory seniors) do not defend the honour of the act; they deny it happened. The social legitimacy of the conduct has evaporated among the very class that used to wield it. That is a genuine revolution.

  ### The Splitter Case

  To truly test her rule against the alternative (which suggests that *any* settled moral consensus counts, regardless of the spark), you need a case where the law changed *ahead* of the public's moral sentiment.

  **The Case:** **The abolition of the Death Penalty in Great Britain (1965).**

  **Why it splits the rules:**
  *   **The 'Settled Consensus' Rule:** If she believes a moral revolution is simply the state enacting a morally superior law that eventually sticks, she must say **Yes**. It was a profound moral shift in the nation's standing.
  *   **The 'Honour Collapse' Rule (Her likely view):** She must say **No**. When the Murder (Abolition of Death Penalty) Act was passed, public opinion remained firmly in favour of hanging for decades. The 'practitioners' (the State, acting on behalf of the public) did not stop because they felt it was dishonourable; they stopped because an enlightened parliamentary elite forced the legislation through against the popular will. The shame did not precede the law; the law preceded the shame.

  If she marks this as a **Yes**, her rule is actually about *legislative moral progress*, and her Sati verdict was simply anti-colonial posturing. If she marks it as a **No**, her commitment to the 'Honour Collapse' theory is absolute: she values the *source* of the morality over the *outcome*. Given her smugness on Sati, I suspect she will call it 'No', which should give you ample ammunition to ask if she truly believes Britain's refusal to hang its own citizens wasn't a moral revolution simply because the public took longer to catch up than the Parliament.

  Good luck. Do mind your p's and q's; she'll be listening for the vowel sounds alone.
