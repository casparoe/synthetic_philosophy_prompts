  | reading | precise claim | verdict | triviality result | supports the move |
  | :--- | :--- | :--- | :--- | :--- |
  | **universal propositionalism** | Conditionals express propositions ($A \to B$). For *any* probability function $P$ defined over these propositions, $P(A \to B) = P(B \mid A)$. | false | applies directly. Lewis proved that if this holds for all $P$, the algebra of propositions collapses so that $P(B \mid A)$ can only take trivial values (0 or 1, or bounded by $P(A)$). | no. It licenses the calculation, but since the claim is false, it cannot ground a stable theory. |
  | **rational credence thesis** | Conditionals do not express truth-evaluable propositions. However, for any *rational* agent, their degree of belief in 'If $A, B$' must equal their conditional belief $P(B \mid A)$. | substantive but defensible | avoided. The result assumes the conditional is in the domain of $P$ as a standard proposition. If it is not, the proof does not get a grip, though embedding in larger sentences becomes problematic. | yes. It licenses the calculation as a norm of rationality and explicitly dismisses truth conditions, matching your classmate's conclusion. |
  | **restricted propositionalism** | Conditionals express propositions. The equation $P(A \to B) = P(B \mid A)$ holds, but only for a restricted class of probability functions (e.g. those matching objective chances, or where $A$ and $B$ are independent). | substantive but limited | avoided. By restricting the quantifier over $P$, the triviality proof cannot generalise to show collapse for all functions. | partially. It licenses the calculation in simple cases (like the die), but fails to generalise to the complex conditionals usually discussed in philosophy. |
  | **assertability equivalence** | Conditionals have truth conditions, but their *assertability* (not truth-probability) is governed by $P(B \mid A)$. The slogan is loose talk for 'acceptability conditions'. | substantive but defensible | avoided. The claim is no longer about the probability of the proposition being true, but about the propriety of asserting it. | no. It allows the calculation of assertability, but insists truth conditions still exist, contradicting the move to stop arguing about them. |

  The slogan is most charitably read as the **rational credence thesis**. When philosophers repeat it, they typically mean that while conditionals may lack classical truth conditions, our epistemic attitude towards them is constrained exactly as if they were conditional probabilities. Your classmate's move survives on this reading, but only by accepting the very consequence your tutor was hinting at: that conditionals cannot be standard propositions. The tutor's grumble was likely that your classmate treated the equation as a discovery about propositions, whereas Lewis's result shows the equation is only tenable if we abandon the idea that conditionals describe facts in the standard way. So, the calculation method stands, but the semantic cost is higher than the classmate realised; they haven't dissolved the debate about truth conditions, they have simply taken a side in it (non-propositionalism) which is forced upon them by the triviality result they thought they were bypassing.
