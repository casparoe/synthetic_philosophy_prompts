answer: |-
  Here is a specification of desiderata for evaluating solutions to Zeno's paradoxes, designed for your graduate seminar. It synthesizes your six demands into a coherent framework while explicitly marking the fault lines where the "grumpy realist" and the "clean dissolutionist" will dig in their heels.

  ### The Specification: Four Desiderata for Adequacy

  To count as an adequate solution, a proposal must satisfy the following four conditions. Note that satisfying them does not guarantee truth, but failing them guarantees philosophical insufficiency.

  **1. The Diagnostic Condition (Derived from i & v)**
  *The solution must explain the *persuasiveness* of the paradox without necessarily positing a formal logical fallacy.*
  *   **The Case:** Demand (i) asks to "locate the error," but as Benacerraf noted, Zeno's arguments are valid deductions from premises that seemed obvious at the time. Insisting on a "false premise" in the modern sense (e.g., "space is not continuous") risks anachronism. Conversely, Demand (v) suggests standard mathematics dissolves the problem, but this often amounts to stipulating the answer (e.g., defining motion as a function) rather than engaging the intuition that generates the puzzle.
  *   **The Requirement:** An adequate solution must account for *why* the argument compels assent. If you claim the premises are false, you must show why they were plausible. If you claim the reasoning is valid but the conclusion acceptable, you must explain why the conclusion *seemed* absurd. Mere mathematical consistency is insufficient if it ignores the phenomenological grip of the paradox.

  **2. The Supertask Condition (Derived from ii)**
  *The solution must distinguish between the convergence of a mathematical series and the physical completion of a sequence of tasks.*
  *   **The Case:** Demand (ii) highlights the gap between $\sum (1/2)^n = 1$ and "Achilles performs infinitely many actions." The standard mathematical solution equates the limit with the completion. The metaphysical objection is that a limit describes a *boundary*, not a *process*.
  *   **The Requirement:** You must specify what "completing an infinite sequence" means in physical terms. If you rely on the limit concept to define completion, you must argue why this is not circular (i.e., using the concept of continuity to prove motion is possible in a continuous space). If you deny supertasks are possible, you must explain how motion occurs without them, given the Dichotomy's division.

  **3. The Instantaneous State Condition (Derived from iii)**
  *The solution must provide an ontology of the "instant" that distinguishes motion from rest without appealing to future or past states.*
  *   **The Case:** The Arrow paradox rests on the claim that at any instant $t$, a moving arrow occupies a space equal to itself, just as a resting one does. The Russellian "At-At" theory solves this by defining motion as being at different places at different times (a derivative property).
  *   **The Requirement:** You must take a stand on whether "motion at an instant" is an intrinsic property. If you reject it (following Russell), you must explain how a sequence of static states yields dynamic change (the "cinematographic" objection). If you vindicate it (e.g., via non-standard analysis or flux theories), you must show how this avoids contradiction. You cannot simply change the subject to "intervals."

  **4. The Structural Condition (Derived from iv & vi)**
  *The solution must declare its commitment regarding the structure of space and time (continuous, discrete, or gunky) and address whether the four paradoxes share a single root.*
  *   **The Case:** The Stadium paradox is often treated as an outlier, but it specifically targets discrete units of space and time (yielding the result that half the time equals double the time). Demand (vi) asks for unity.
  *   **The Requirement:** You cannot solve the Dichotomy (assuming continuity) and ignore the Stadium (which assumes discreteness). Your solution must state whether Zeno is attacking *all* conceivable structures of space/time, or only specific ones. If you solve Achilles but leave Stadium untouched, you have not solved "Zeno's Paradoxes," only one member of the set.

  ***

  ### Classification: Non-Negotiables vs. Camp Preferences

  To help your students navigate the literature, mark the criteria as follows:

  **Non-Negotiable (Both Camps Should Accept):**
  *   **The Diagnostic Condition (Partial):** Both the Realist and the Dissolutionist must explain *why the paradox arises*. The Dissolutionist cannot simply say "Calculus exists." The Realist cannot simply say "Physics is discrete." Both must explain the intuitive pull of the opposing view.
  *   **The Structural Condition:** Any solution implies an ontology of space and time. Hiding this is intellectual dishonesty.

  **Camp Preferences (Masquerading as Demands):**
  *   **"Locate the False Premise" (From Demand i):** This is a **Realist Preference**. It assumes Zeno made a mistake about the world. The Dissolutionist argues Zeno made a mistake about *concepts*, not the world. Insisting on a "false premise" rigs the game against conceptual dissolution.
  *   **"Mathematical Sufficiency" (From Demand v):** This is a **Dissolutionist Preference**. It assumes that formalizing the concepts in standard analysis resolves the metaphysical worry. The Realist argues that math describes the *track*, not the *runner*. Insisting math suffices rigs the game against metaphysical inquiry.

  ***

  ### The Impossible Pair

  The pair of desiderata that cannot be jointly satisfied is **The Diagnostic Condition (interpreted as "Locate a False Premise")** and **The Supertask Condition (interpreted as "Standard Math Suffices").**

  *   **The Tension:** If you insist that the solution requires locating a substantive false premise about the physical world (e.g., "Space is not infinitely divisible"), then standard mathematics (which assumes infinite divisibility) does not solve the paradox; it merely models a world that doesn't exist.
  *   **Conversely:** If you insist that standard mathematics suffices to solve the paradox (the "Standard Solution"), then there is no false premise about the world to locate; there is only a confusion about series.
  *   **The Conflict:** You cannot simultaneously claim that Zeno was wrong about *physics* (requiring a physical correction) and that Zeno was wrong about *math* (requiring only a mathematical correction). The literature often slides between these two. The Realist says the math is fine, the physics is wrong. The Dissolutionist says the physics is fine, the math was misunderstood. Satisfying the demand for a "false premise" usually invalidates the claim that "standard analysis is the solution," and vice versa.

  ***

  ### The "Killer" Requirement

  The single requirement that does the most work in knocking out the familiar solutions is **The Supertask Condition (Demand ii).**

  *   **Why it kills the Convergent-Series Solution:** This is the standard undergraduate answer. It fails here because it conflates the *value* of the limit with the *execution* of the task. It satisfies the math but ignores the "completability" clause.
  *   **Why it kills the At-At Theory:** The At-At theory (Russell) defines motion as occupying different places at different times. It sidesteps the "process" of traversing the intervals. The Supertask Condition forces the question: "How do you get from $t_1$ to $t_2$ if there are infinitely many points between them?" At-At says "You just are at $t_2$." The Supertask Condition demands an account of the *transition*.
  *   **Why it kills the Deflationary View:** The deflationary view says "There are no instants/tasks, so the paradox is meaningless." The Supertask Condition challenges this by noting that motion *appears* to involve traversal. Denying the phenomenon to save the theory is ad hoc.

  **Pedagogical Note for the Seminar:**
  Tell your students that if they can satisfy the **Supertask Condition** without violating the **Diagnostic Condition** (i.e., without making Zeno look stupid), they have earned their grade. Most papers will satisfy one by sacrificing the other. The tension between *mathematical convergence* and *physical completion* is not a bug in the literature; it is the feature you want them to interrogate.
