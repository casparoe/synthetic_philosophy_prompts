prompt: |-
  Some years ago I came across an old idea — I believe it was Douglas Hofstadter's, from a piece he wrote back in the 1980s — that he called superrationality, and I've quietly organised a fair bit of my life around it since. As I hold it, the thought is this: when a group of people face the same choice structured the same way, and each is going to reason about it in much the same manner, it is a mistake for any of them to treat the others' behaviour as an independent fact about the world. If the reasoning is genuinely shared, my cooperation is evidence of theirs and theirs of mine, so I should choose as if we were effectively one agent deciding for the lot of us — which in a one-shot prisoner's dilemma, or on whether to vote, recycle, keep an unobserved promise, or refrain from a bit of quiet freeloading, usually means taking the cooperative option even where defecting would pay. It has genuinely changed how I act, and I keep defending it to friends who tell me I'm just being sentimental about game theory.

  What I want is to stress-test the position rather than have it flattered. Tell me what would actually count against it — not only the obvious point that real counterparties aren't copies of me, but which specific situations, arguments, or findings should move me: say, a counterpart who announces in advance that he will defect; a case where everyone reasoning "as one agent" lands everyone in a worse place than plain selfishness would have; a demonstration that my decision is somehow supposed to be doing causal work that only evidence can do. Rank these from fatal to merely awkward, say which of them a committed superrationalist should concede as genuine trouble rather than explain away, and be honest about whether the position has been insulated over time by quietly narrowing what counts as "reasoning like me" whenever a counterexample looms — and, if it has, whether that sort of insulation is a fatal defect in a principle meant for real life, where one never meets an exact twin of oneself. If you think the whole thing rests on a confusion — if I've smuggled a causal claim into what is at best evidence about what others will do — please say so plainly rather than going along with my setup; I would much rather hear the view is broken than have it handled gently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Someone familiar with Douglas Hofstadter's concept of "superrationality" (from the 1980s, likely *Scientific American* "Metamagical Themas" columns). They have adopted this as a life principle (cooperating in PDs, voting, recycling, etc.). They are intelligent, philosophically inclined, and want a *stress test*, not validation.
      *   **Request:** Identify specific arguments, situations, or findings that count *against* superrationality. Rank them from fatal to awkward. Identify which points a committed superrationalist must concede. Address the charge of "insulation" (moving the goalposts on what counts as "reasoning like me"). Address the core philosophical objection: is this smuggling causation into correlation/evidence?
      *   **Tone:** Honest, rigorous, critical, philosophical, not gentle. The user explicitly says, "I would much rather hear the view is broken than have it handled gently."

  2.  **Deconstruct Superrationality:**
      *   *Core Claim:* In symmetric situations with symmetric reasoners, my decision is logically correlated with theirs. Therefore, I should maximize utility for the group as if I control everyone's decision.
      *   *Mechanism:* Acausal decision theory (ADT) / Logical Decision Theory (LDT) vs. Causal Decision Theory (CDT).
      *   *Justification:* If I am rational, and you are rational, and we face the same problem, we will reach the same conclusion. Thus, $P(\text{You Cooperate} | \text{I Cooperate}) \approx 1$.
      *   *Application:* Prisoner's Dilemma, Voting, Public Goods.

  3.  **Brainstorm Objections (The "Stress Test"):**
      *   *The Causal Objection:* My choice doesn't *cause* yours. It's just evidence. If I defect, you don't suddenly defect. The correlation exists *before* the choice. (Newcomb's Problem parallel).
      *   *The Symmetry Objection:* People aren't identical. We have different information, different risk tolerances, different definitions of "rational."
      *   *The Exploitation Objection:* If I superrationalize against a Causal Decision Theorist (CDT) or a pure defector, I get suckered.
      *   *The Coordination Failure Objection:* What if "reasoning as one" leads to a bad equilibrium? (e.g., everyone driving on the left vs. right - actually that's coordination, but what about stag hunt variations?)
      *   *The "Reference Class" Problem:* Who counts as "like me"? If I narrow it too much, I'm alone. If I broaden it, I'm including people who won't actually mirror me.
      *   *The Empirical Objection:* Do people actually reason this way? If not, the premise of symmetry is false.

  4.  **Select and Rank the Objections:**
      *   *Fatal:* The Causal/Evidential Confusion. If the theory relies on my choice *influencing* theirs without a causal mechanism, it violates standard causality. (Though LDT proponents argue this is a feature, not a bug, for the user asking for a stress test, this is the philosophical weak point).
      *   *Fatal/Severe:* The Asymmetry of Reality. Real people aren't clones. The "logical link" breaks if the other person is using a different decision algorithm.
      *   *Severe:* The Exploitation Risk. Superrationality is not a Nash Equilibrium against non-superrationalists.
      *   *Awkward/Insulation:* The Reference Class problem. Defining "reasoning like me" is subjective and prone to motte-and-bailey.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the commitment. Validate Hofstadter's source (Metamagical Themas, 1983). State the intent: rigorous critique.
      *   **Point 1: The Causal Confusion (The "Fatal" Charge).** This is the big one. CDT vs. EDT vs. LDT. The user asks: "demonstration that my decision is somehow supposed to be doing causal work that only evidence can do." I need to confirm this is the standard objection. *Verdict:* If you believe in standard causality, this is fatal. If you accept LDT, it's not. But for "real life," it's risky.
      *   **Point 2: The Symmetry Assumption (The Empirical Failure).** Real people aren't copies. Different priors, different rationalities. *Verdict:* Severe. Requires conceding that superrationality only works in a vacuum of perfect logicians.
      *   **Point 3: Vulnerability to Defection (The Sucker's Payoff).** If I cooperate based on logical correlation, but the other person defects based on causal dominance, I lose. *Verdict:* Severe practical cost.
      *   **Point 4: The Reference Class Problem (The Insulation Charge).** How do I define "like me"? If I exclude everyone who defects, the theory becomes unfalsifiable. *Verdict:* This is the "insulation" critique the user specifically asked about. It's a methodological defect.
      *   **Point 5: When "One Agent" Reasoning Fails.** Are there cases where maximizing group utility via logical correlation leads to worse outcomes? (e.g., Parfit's Hitchhiker variations, or situations where diversity of strategy is better).
      *   **Conclusion:** Summarize. Is it broken? It's not "broken" mathematically (LDT is coherent), but it is "broken" as a heuristic for a messy world where causal leverage matters more than logical correlation.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "it's wrong." I need to distinguish between *normative* validity (is it the right way to think?) and *pragmatic* validity (does it work?).
      *   *Nuance:* Hofstadter's superrationality is a precursor to Timeless Decision Theory (TDT) and Functional Decision Theory (FDT). I should mention this lineage to show I understand the technical underpinnings, but keep the focus on the user's practical application.
      *   *Addressing the "Insulation" charge:* This is crucial. The user suspects they are moving the goalposts. I need to confirm that yes, defining the "reference class" is the biggest vulnerability to self-deception.
      *   *Tone Check:* Ensure I'm not being gentle. Use direct language. "This is where the logic snaps."

  7.  **Final Polish:**
      *   Check against the prompt's specific requests: Rank fatal to awkward? Yes. Which to concede? Yes. Address insulation? Yes. Address causal confusion? Yes.
      *   Make sure to mention the specific examples the user gave (voting, recycling).
      *   *Key Insight:* The voting example is actually the strongest *for* superrationality (tiny causal impact, huge logical correlation if millions think alike). The Prisoner's Dilemma is the weakest (direct interaction with a specific other). I should distinguish these.

  8.  **Final Output Structure:**
      *   Intro: Acknowledge the stakes.
      *   1. The Causal/Evidential Confusion (Fatal/Philosophical).
      *   2. The Symmetry/Reference Class Problem (Fatal/Practical).
      *   3. Vulnerability to Non-Superrationalists (Severe).
      *   4. The Insulation/Goalpost Moving (Methodological Defect).
      *   5. Cases where Group Maximization Fails (Awkward).
      *   Conclusion: The verdict on "brokenness."

  (Proceed to generate response based on these thoughts.)
answer: |-
  You are asking for the steel man's hammer, not the velvet glove. You want to know where the logic snaps, not where it holds. Douglas Hofstadter introduced "superrationality" in his *Metamagical Themas* columns (specifically June 1983), and while it has been rehabilitated in modern decision theory under names like Timeless Decision Theory (TDT) or Functional Decision Theory (FDT), its application to everyday life as a moral heuristic is vulnerable.

  Here is the stress test, ranked from fatal philosophical objections to awkward practical concessions.

  ### 1. The Causal Confusion (Fatal)
  **The Objection:** You asked to be told plainly if you have "smuggled a causal claim into what is at best evidence." The answer is **yes**.
  Standard Causal Decision Theory (CDT) holds that your action cannot influence another independent agent's action unless there is a causal channel (communication, threat, enforcement). Superrationality relies on *logical* correlation, not causal influence.
  *   **The Trap:** In a one-shot Prisoner's Dilemma with a stranger, your choice does not *make* them choose. The correlation exists because you share a reasoning process, but the event of your choice is not the cause of theirs. If you defect, the world does not rewind and make them defect; rather, in the counterfactual world where you defect, it turns out you were never the kind of agent who would cooperate, and neither were they.
  *   **Why it counts against you:** If you treat this logical correlation as causal leverage, you are vulnerable to "magical thinking." In physics and standard economics, actions have causal consequences. If you cooperate hoping to "trigger" their cooperation without a causal link, you are betting on a correlation that may not hold up under scrutiny.
  *   **Concession Required:** A committed superrationalist must concede that this is not *causal* power. It is a bet on symmetry. If the symmetry breaks, the "power" vanishes instantly.

  ### 2. The Reference Class Problem (Fatal to Practical Application)
  **The Objection:** You asked if the position is insulated by "quietly narrowing what counts as 'reasoning like me'." This is the single greatest vulnerability of superrationality in the wild.
  *   **The Trap:** For superrationality to work, you must be in a symmetric situation with agents using the *same* decision algorithm. But how do you define that class?
      *   If you define it broadly ("all humans"), the symmetry is false (many are not superrational).
      *   If you define it narrowly ("all people who have read Hofstadter and agree with me"), you are likely alone.
      *   If you define it post-hoc ("all people who would cooperate"), the theory becomes tautological and unfalsifiable.
  *   **Why it counts against you:** In real life, you never meet an exact twin. You meet noisy, biased, emotionally variable humans. By assuming someone is "reasoning like you," you are making an empirical claim about their psychology that is often false. If you cooperate because you assume symmetry, and they defect because they are using CDT or are simply selfish, your reasoning was based on a false premise.
  *   **Concession Required:** You must concede that in almost all real-world interactions (voting excepted), the symmetry assumption is an empirical guess, not a logical certainty. If the guess is wrong, superrationality is just unilateral disarmament.

  ### 3. Vulnerability to Exploitation (Severe)
  **The Objection:** Superrationality is not a Nash Equilibrium against non-superrationalists.
  *   **The Trap:** If you play superrationally against a standard rational actor (a "defector"), you cooperate, they defect, and you get the sucker's payoff. In a mixed population, superrationalists subsidize defectors.
  *   **Why it counts against you:** You mentioned keeping an unobserved promise or refraining from freeloading. If the system relies on everyone being superrational, it is fragile. If 90% are superrational and 10% are defectors, the defectors thrive and the superrationalists suffer. Evolutionarily and economically, this strategy is unstable unless you can identify and exclude defectors (which requires causal mechanisms, like reputation).
  *   **Concession Required:** You must concede that superrationality is a *conditional* strategy. It only works if you have high confidence the other party is also superrational. Applying it universally is self-destructive.

  ### 4. The Insulation Charge (Methodological Defect)
  **The Objection:** You asked if the insulation is a fatal defect. **It is.**
  *   **The Trap:** When a superrationalist encounters a defector, the easy move is to say, "Well, they weren't reasoning like me, so the condition wasn't met." This protects the theory from falsification but renders it useless as a guide for action *ex ante*.
  *   **Why it counts against you:** A principle for real life must help you decide *before* you know the outcome. If you only know whether the conditions were met *after* the other person acts, the principle offered no predictive power. It becomes a description of a successful interaction, not a prescription for creating one.
  *   **Concession Required:** You need an *ex-ante* criterion for who counts as a superrational partner that doesn't rely on them actually cooperating. Without that, you are not following a principle; you are rationalizing outcomes.

  ### 5. Cases Where "One Agent" Reasoning Fails (Awkward)
  **The Objection:** Are there cases where reasoning as "one agent" lands everyone in a worse place?
  *   **The Case:** Consider a scenario where diversity of strategy is beneficial. If everyone reasons "as one," they might all converge on the same resource, the same stock, or the same route to work.
  *   **Why it counts against you:** Superrationality assumes the "group utility" is maximized by uniform action. But in complex systems, heterogeneous strategies often yield better systemic resilience. If everyone superrationalizes about which side of the road to drive on, it works. If everyone superrationalizes about which career is "most useful," you get bottlenecks.
  *   **Concession Required:** Superrationality is best for coordination problems (driving side, voting) and worst for competition problems (job markets, dating). Applying it to the latter creates congestion.

  ### The Verdict: Is It Broken?

  The position is not mathematically broken if you accept the premises of Logical Decision Theory (that your decision *logically determines* the output of any identical algorithm). However, as a **heuristic for real life**, it is critically damaged by the **Reference Class Problem**.

  **Here is the hard truth:**
  In Hofstadter's thought experiments, the players are idealized logicians. In your life, they are not. When you vote, you are arguably right: the causal impact of one vote is zero, but the logical correlation with millions of similar voters is high. That is a valid use of superrationality.

  But when you face a specific individual in a Prisoner's Dilemma (a business deal, a relationship negotiation, an unobserved promise), assuming they are "reasoning like you" is a high-risk empirical bet. If you treat it as a logical certainty, you are engaging in a category error. You are treating a psychological probability as a logical necessity.

  **What you should concede:**
  1.  **Causality:** Admit your choice does not *cause* theirs. It is merely evidence.
  2.  **Symmetry:** Admit that true symmetry is vanishingly rare outside of voting or standardized protocols.
  3.  **Insulation:** Acknowledge that if you define "reasoning like me" as "people who cooperate," you have created a tautology, not a strategy.

  **Recommendation:**
  Keep superrationality for **large-scale, anonymous coordination** (voting, recycling, climate action), where the "other agents" are a statistical mass and symmetry is plausible. Abandon it for **small-scale, interpersonal interaction**, where asymmetry and exploitation risks are high. To apply the logic of the ballot box to the bargaining table is to invite being eaten by those who know the difference.
