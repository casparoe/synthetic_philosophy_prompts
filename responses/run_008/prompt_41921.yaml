      *   **Context:** A debate with a philosopher friend about the formalisation of Occam's Razor (specifically Solomonoff Induction and the Invariance Theorem).
      *   **The Friend's Argument:**
          1.  Solomonoff induction weights hypotheses by Kolmogorov complexity ($K_U(H)$).
          2.  Invariance Theorem: $|K_{U_1}(x) - K_{U_2}(x)| \leq c_{U_1, U_2}$.
