answer: |-
  No single consistent principle fits all your verdicts, because your willingness to take the 90/10 all-in bet contradicts the risk-averse logic governing your other decisions.

  Your other cases align with Expected Utility Theory using a concave utility function (where each additional dollar matters less than the last) combined with the Kelly Criterion for bet sizing. This explains why you reject even-money all-ins (too much variance), accept small repeatable bets (law of large numbers reduces variance), and prefer guaranteed hundreds over risky thousands (diminishing marginal utility). However, your acceptance of the 90/10 all-in is a dangerous outlier; standard utility theory dictates you should never bet 100% of your wealth where a loss means zero, because the utility of financial ruin is disproportionately catastrophic compared to the gain of doubling up. You should overturn this verdict and cap any single bet well below 100% of your net worth to avoid risk of ruin.

  Applying this corrected principle to your borrowed-money case, you must reject it. While the expected value is positive, betting money you cannot afford to lose introduces the possibility of negative net worth, where the disutility of debt (stress, interest, credit damage) vastly outweighs the linear utility of potential winnings. For the startup case, the math supports taking the bet but not at your proposed size; with a 20% win chance and 20x return, the Kelly Criterion suggests staking about 16% of your capital, so you should reduce your proposed 20% stake to 15% or less to account for the illiquidity and estimation risk inherent in private ventures.
