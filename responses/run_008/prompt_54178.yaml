  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Make sure not to say historians *never* want to find the truth. They do, but they are skeptical of the archive's ability to yield it directly.
      *   *Nuance:* "Reading against the grain" (Stoler) isn't just bias correction; it's treating the bias as the signal. In DS, this is like analyzing the residuals or the missingness pattern as the primary outcome, not the target variable.
      *   *Key Insight:* The DS assumes $Y_{true}$ exists. The Historian might argue $Y_{true}$ is unknowable or socially constructed by the recording process itself. This is the biggest friction point.

  9.  **Final Polish:** Check against the prompt requirements.
