answer: |-
  There is no single, canonical proper noun for this problem (like "The Gettier Problem" in epistemology). However, in the literature on the philosophy of promising and meta-ethics, this is widely recognized as a version of **"The Circularity Objection"** to Practice (or Convention) Theories of promising. Sometimes it is grouped under **"The Bootstrapping Objection,"** though that term is often reserved for the specific worry about how an individual can bind *themselves* by their own will.

  Because your formulation captures a specific nuance—the idea that the institution's authority is *presupposed* in the explanation of its authority—I will offer a more precise label for your specific worry while mapping it to the existing debate.

  ### 1. The Label: "The Normative Presupposition Charge"

  While you will find this discussed under **"The Circularity Objection to Practice Conceptions,"** your specific insight—that the explanation of the obligation quietly assumes the very authority it seeks to explain—is best labeled **The Normative Presupposition Charge**.

  **Definition:** The charge that a convention-based account of promising explains the obligatoriness of a promise by appealing to the rules of the convention, but explains the obligatoriness of *those* rules by appealing to norms (e.g., "one ought to follow conventions one enters") that already possess the normative force the theory was supposed to explain.

  **Boundary Cases (What it is not):**
  *   **The Is-Ought Problem:** This is broader. The Is-Ought problem asks how *any* fact generates a value. Your puzzle is specific to *institutional* facts purporting to generate *moral* obligations.
  *   **The Bootstrapping Objection (Strict Sense):** Usually refers to the puzzle of how a mere act of will (saying "I promise") can create a duty where none existed before. Your puzzle is about the *system* that gives that act its power, not just the act itself.
  *   **The Redundancy Objection:** This argues that if a background moral principle (like "do not disappoint") does the work, the convention is unnecessary. Your puzzle is prior to this: it asks where the convention gets its grip *at all*.

  ### 2. The State of the Debate: Consensus vs. Contestation

  It is crucial to distinguish what philosophers generally agree on from what remains fiercely disputed. If you walk away thinking the "Convention View" is dead, you would be mistaken; if you think it is victorious, you would also be mistaken.

  #### What is Generally Agreed Upon (Consensus)
  1.  **Conventions Alone are Insufficient:** There is near-universal agreement that a "bare" convention (like the rules of chess or driving on the left) cannot generate a *moral* obligation on its own. If the convention were evil or pointless, you would not be morally bound to follow it. Therefore, the convention must be hooked up to a background moral principle.
  2.  **The Distinction between Institutional and Moral "Oughts":** Philosophers generally agree that there is a sense in which you "ought" to move the bishop diagonally (institutional) and a sense in which you "ought" to keep your promise (moral). The puzzle arises when trying to move from the former to the latter.
  3.  **Hume's Actual View:** Your friend's "Humean" label is slightly imprecise. Hume did argue promising is a convention, but he did not think the convention *itself* was the ultimate source of obligation. He grounded the obligation in **Utility** (social necessity). So, Hume actually has an answer to your regress: the convention binds because following it is useful to society.

  #### What is Genuinely Contested
  1.  **The Bridge Principle:** *Which* background moral principle converts the convention into a moral obligation?
      *   **Fairness:** (Rawls) You are bound because you benefit from the practice and it would be unfair to free-ride.
      *   **Trust/Reliance:** (Scanlon) You are bound because you intentionally induced expectations in another person.
      *   **Autonomy/Normative Power:** (Raz, Shiffrin) You are bound because humans have a brute capacity to change their own normative status.
  2.  **The Work of the Convention:** Does the convention do any *normative* work, or is it merely **epistemic** (a signal)?
      *   *Redundancy View:* The moral duty is to not disappoint. The promise is just a clear signal of disappointment. The convention adds nothing moral.
      *   *Constitutive View:* The convention actually *creates* a new duty that didn't exist before (the duty to do *this specific thing* because you said so).
  3.  **The Regress:** Does positing a "Normative Power" (the capacity to bind oneself) solve the regress, or just name it?
      *   *Critics say:* Saying "humans have the power to bind themselves" is just asserting the mystery, not solving it.
      *   *Defenders say:* It is a brute fact of agency, like the capacity to reason.

  ### 3. Standard Replies to Your Objection

  When you press your friend on why the convention binds, she is likely relying on one of three standard defenses. Here is how they attempt to stop the regress:

  **A. The Principle of Fairness (The Rawlsian Reply)**
  *   **The Argument:** The convention binds not because it is a convention, but because it is a *cooperative scheme*. If you accept the benefits of the scheme (e.g., people rely on your words), you are obligated to follow its rules to avoid unfairness.
  *   **How it stops the regress:** It stops at a background moral principle (Fairness). The convention doesn't generate the obligation ex nihilo; it triggers a pre-existing duty of fairness.
  *   **Weakness:** What if I don't want the benefits? (The "Voluntariness Objection").

  **B. The Normative Power Theory (The Hart/Raz Reply)**
  *   **The Argument:** Human beings possess a specific normative capacity (a "power") to alter their rights and duties. This is a brute feature of agency.
  *   **How it stops the regress:** It denies the regress starts. The capacity to bind oneself via convention is a fundamental building block of morality, not something that needs further grounding.
  *   **Weakness:** It can look like magic. How does moving my vocal cords change the moral universe?

  **C. The Expectation/Reliance View (The Scanlon Reply)**
  *   **The Argument:** This is actually a rival to your friend's view. Scanlon argues the obligation comes from a principle of "Fidelity" (do not induce expectations you intend to violate).
  *   **How it stops the regress:** It bypasses the convention. The convention is just a tool to create the expectation. The obligation comes from the harm of disappointing reliance, not the rule of the game.
  *   **Weakness:** It struggles to explain why you are bound even if the promisee *doesn't* rely on you (e.g., they know you are lying, but you still promised).

  ### 4. Summary for Your Argument

  You did not miss a label; you identified the central tension in the meta-ethics of promising.

  *   **If you want to cite this:** Search for **"The Circularity Objection to Practice Theories of Promising"** or **"The Normativity of Conventions."** Key authors to look up are **John Rawls** ("Two Concepts of Rules"), **T.M. Scanlon** (*What We Owe to Each Other*, Chapter 7), **Seana Shiffrin** ("Promising, Intimate Relationships, and Conventional Institutions"), and **David Enoch** ("Reason-Giving and the Normativity of Promising").
  *   **Who "Won"?** Neither side has won.
      *   **Your Friend's Strength:** She correctly identifies that promising is social and relies on shared understandings. Without the convention, the words "I promise" are just noise.
      *   **Your Strength:** You correctly identify that social facts alone cannot generate moral "oughts" without a bridge. If her theory implies the convention *itself* is the ultimate source of the "ought," she is vulnerable to the **Normative Presupposition Charge**.

  **Recommendation:** The most philosophically robust position is likely a hybrid. The convention provides the *structure* and *content* of the obligation (what exactly must be done), but a background moral principle (Fairness, Autonomy, or Trust) provides the *force* (why it must be done). If your friend denies the need for that background moral principle, she is holding a view that most contemporary philosophers consider untenable. If she accepts it, your objection is accommodated, and the argument shifts to *which* background principle is the right one.
