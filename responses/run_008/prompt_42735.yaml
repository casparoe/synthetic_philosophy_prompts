prompt: |-
  I'm a science-and-ideas correspondent, and I've been asked to sit on our outlet's standards desk while it drafts a policy on a recurring fight: what separates reporting from merely passing along what we've been told. The immediate case is this. A colleague has obtained what appears to be an internal regulatory document suggesting that the pivotal trial behind a widely prescribed drug had serious data irregularities. She believes the document is genuine, her source has been reliable before, but nobody can authenticate the document, and the regulator won't comment. She wants to write, in our voice, that the trial was compromised. Our current style guidance — buried in a decades-old handbook — says reporters should publish what they know to be true, and doesn't say anything more.

  The desk has split into three camps, and I recognize the shape of the argument from the philosophy I've covered. One camp holds a knowledge rule: assert only what you know; since we don't know the document is genuine, we can assert only that it exists and what it says. A second camp holds a truth rule: what matters is that the claim itself be true; if the trial was in fact compromised, running the story is fine, and the risk is just ordinary newsgathering risk, to be weighed editorially rather than as a matter of principle. A third holds a sincerity rule: publish what the reporter responsibly believes on good evidence, provided the story flags the basis of the belief — attribution, sourcing caveats, and all.

  Please draft the written opinion I'll circulate before next week's meeting. It should recommend one of these norms for our newsroom's official policy, and it should do so with the following on the record. First, the desk must also settle two adjacent cases our current guidance handles inconsistently: our science desk routinely reports preprint findings with hedges like "scientists believe," and our breaking-news desk will state something as fact, update it hours later as the situation develops, and then run a correction — treating the earlier assertion as somehow retroactively repaired. Second, whatever rule we adopt has to give practical guidance a reporter can apply on deadline, not just a slogan. Third, the losing camps' strongest consideration should be treated seriously — in particular the worry that a sincerity rule lets us assert things that later turn out false, and the worry that a knowledge rule would make breaking news and even ordinary science coverage impossible, since we almost never know in the demanding sense.

  Finally, address a wrinkle that keeps coming up in our internal debate: whether publishing under a hedge — "according to a document we could not independently verify" — is genuinely a different kind of assertion from flat-out stating the claim, or just the same assertion with a liability shield attached. My own hunch is the hedge changes something important, but I can't say what, and the desk deserves better than a hunch. Recommend, with reasons, and be explicit about what your recommendation asks the losing camps to give up.
reasoning: |-
  Here's a thinking process that leads to the drafted opinion:

  1.  **Analyze the Request:**
      *   **Role:** Science-and-ideas correspondent sitting on the standards desk.
      *   **Task:** Draft a written opinion to circulate before the next meeting regarding a new editorial policy on reporting vs. passing along claims.
      *   **Immediate Case:** A colleague has an unauthenticated internal regulatory document alleging data irregularities in a major drug trial. She wants to assert the trial was compromised.
      *   **Current Guidance:** Outdated ("publish what you know to be true"), insufficient.
      *   **Three Camps:**
          1.  *Knowledge Rule:* Assert only what you know (e.g., document exists, not necessarily truth of content).
          2.  *Truth Rule:* Assert what is actually true (risk management, not principle).
          3.  *Sincerity Rule:* Assert what you responsibly believe based on evidence (with attribution/hedges).
      *   **Constraints/Requirements:**
          1.  Must address two adjacent inconsistent cases: Preprint science reporting (hedged) vs. Breaking news (flat assertion + later correction).
          2.  Must provide practical guidance for deadlines (not just slogans).
          3.  Must treat losing camps' strongest considerations seriously (Sincerity risk of falsehood; Knowledge impossibility in breaking/science).
          4.  Must address the "Hedge Wrinkle": Is "according to X" a different assertion or just a liability shield? (Need to explain *why* it matters).
          5.  Must recommend one norm and explicitly state what losing camps must give up.

  2.  **Evaluate the Three Camps:**
      *   *Truth Rule:* Too metaphysical. Reporters can't access "The Truth" directly, only evidence. If the trial *was* compromised but we didn't know it, publishing it looks like luck, not journalism. If it *wasn't*, we lied. It offers no procedural guidance for the moment of publication. *Verdict: Reject.*
      *   *Knowledge Rule:* Epistemologically strict. "Know" is a high bar. In breaking news or complex science, we rarely have Cartesian certainty. This paralyzes reporting on developing stories or technical papers. It forces us into "He said/She said" journalism too often. *Verdict: Reject (mostly), but keep the rigor.*
      *   *Sincerity Rule (Modified):* Focuses on the *process* of justification. "We believe X based on Y evidence." This aligns with how science works (confidence intervals, peer review status) and how breaking news works (best available info at the time). It allows for updates without branding the initial report a "lie." *Verdict: Recommend, but refine.*

  3.  **Address the Adjacent Cases (Consistency Check):**
      *   *Preprints:* We currently hedge ("scientists believe"). This fits the Sincerity/Justification model. We are reporting the *claim* and the *evidence level*, not the final fact.
      *   *Breaking News:* We state flatly, then correct. This looks like a Truth Rule violation if the first report was wrong. *Solution:* Reframe breaking news not as "Falsehood then Correction" but as "Best Available Justification then New Evidence." The initial report wasn't a lie; it was a provisional claim based on当时的 evidence. The policy needs to normalize *provisionality* without abandoning authority.

  4.  **Address the "Hedge Wrinkle":**
      *   Is "According to X" different from "X"?
      *   *Philosophical angle:* Speech act theory. "X" is a constative (claims fact). "According to X, Y" is a report of a speech act/claim.
      *   *Practical angle:* It shifts the epistemic burden. "The trial was compromised" = We bet our reputation on the fact. "A document says the trial was compromised" = We bet our reputation on the document's existence and the significance of its claim.
      *   *Conclusion:* It *is* a different assertion. It asserts the *newsworthiness of the allegation*, not the *truth of the allegation*. This is crucial for the drug trial case.

  5.  **Drafting the Opinion - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** Acknowledge the stakes (the drug trial case) and the failure of current guidance.
      *   **Analysis of the Three Rules:** Briefly weigh them.
      *   **The Recommendation:** Propose a "Justified Assertibility" norm (a refined Sincerity Rule).
      *   **Addressing the Adjacent Cases:** Show how this unifies Preprints and Breaking News.
      *   **The Hedge Question:** Explain the linguistic/epistemic difference.
      *   **Practical Guidance:** Give reporters a checklist for deadlines.
      *   **What is Sacrificed:** Explicitly tell the Knowledge and Truth camps what they lose.
      *   **Conclusion:** Call to action.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Sincerity" too soft?
      *   *Fix:* Call it "Responsible Assertibility" or "Evidentiary Confidence." Let's stick closer to the prompt's terminology but refine it. The prompt calls it the "Sincerity Rule." I should adopt that but define it rigorously so it doesn't sound like "honest guessing." It's about *warranted belief*.
      *   *Critique:* How do I handle the breaking news correction issue?
      *   *Fix:* Frame corrections not as admissions of past falsehood, but as updates to the *status* of the claim. This protects the reporter's integrity while acknowledging error.
      *   *Critique:* The Hedge Wrinkle needs to be sharp.
      *   *Fix:* Use the distinction between *fact-stating* and *allegation-reporting*. One commits the outlet to the state of the world; the other commits the outlet to the state of the *conversation*.

  7.  **Final Polish:**
      *   Tone: Professional, philosophical but practical, authoritative yet collaborative.
      *   Ensure all constraints from the prompt are met (adjacent cases, practical guidance, losing camps' concerns, hedge wrinkle).

  8.  *(Mental Check against Prompt Requirements)*
      *   Recommend one norm? Yes (Refined Sincerity).
      *   Address Preprints/Breaking News consistency? Yes.
      *   Practical deadline guidance? Yes (The "Confidence Matrix").
      *   Treat losing camps seriously? Yes (Section on "Costs").
      *   Address Hedge Wrinkle? Yes (Section on "The Logic of Attribution").

  9.  **Drafting the Content:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **TO:** Standards Desk
  **FROM:** [Your Name], Science-and-Ideas Correspondent
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Assertibility Norms and the "Drug Trial" Case

  **1. The Stakes**

  We are convened because our current guidance—"publish what you know to be true"—is silent on the hardest part of journalism: what to do when truth is contested, evidence is provisional, or authentication is impossible. The immediate case is stark: a credible source provides an unauthenticated document alleging fraud in a major drug trial. If we assert the fraud as fact, we risk libel and credibility if the document is fake. If we assert only that the document *exists*, we risk burying a public health catastrophe.

  The desk has fractured into three camps: **Knowledge** (assert only what is verified), **Truth** (assert what is actually the case, risk managed editorially), and **Sincerity** (assert what is responsibly believed based on available evidence).

  After reviewing our past inconsistencies and the philosophical underpinnings of each position, I recommend we adopt a refined **Sincerity Rule**, which I will term the **Norm of Justified Assertibility**.

  This memo explains why this norm best serves our readers, resolves our inconsistencies regarding science preprints and breaking news, and offers a practical framework for deadline decisions. It also explicitly addresses what the Knowledge and Truth camps must concede for this to work.

  **2. Why the "Truth" and "Knowledge" Rules Fail**

  The **Truth Rule** is metaphysically sound but operationally useless. Reporters do not have access to "The Truth"; we have access to evidence. If we adopt this rule, we are forced to pretend we possess certainty we cannot have. It turns corrections into admissions of dishonesty rather than updates on evidence.

  The **Knowledge Rule** is epistemologically rigorous but journalistically paralyzing. In the strict sense, we rarely "know" anything on deadline. We infer. If we require Cartesian certainty, we cannot report on breaking news (where situations change) or emerging science (where consensus is evolving). This rule forces us into passive "he-said-she-said" reporting that obscures the weight of evidence.

  The **Sincerity Rule**, properly constrained, is the only one that matches the actual work of journalism. Journalism is not a transcript of reality; it is a report on the *best available account* of reality at the time of publication.

  **3. Resolving the Adjacent Cases**

  Adopting the Norm of Justified Assertibility resolves the inconsistency between our Science and Breaking desks.

  *   **The Science Desk (Preprints):** Currently, we hedge preprints ("scientists believe"). Under the new norm, this is not cowardice; it is accurate metadata. We are asserting that the *claim exists* and has *some evidentiary support*, but the justification is not yet robust enough for fact-status. This remains consistent.
  *   **The Breaking Desk:** Currently, we state facts flatly, then correct them later, treating the first story as a mistake. Under the new norm, a breaking news update is not a retraction of a lie; it is an update to the *justification status*. The 6:00 PM report ("Fire caused by electrical fault") was a justified assertion based on 6:00 PM evidence. The 8:00 PM correction ("Fire caused by arson") is a new justified assertion based on new evidence. The first statement was not "false" in a moral sense; it was *provisional*.

  By adopting Justified Assertibility, we unify these desks. Both are reporting the strength of the current evidence, not claiming omniscience.

  **4. The Hedge Wrinkle: Attribution as Epistemology**

  A major point of contention is whether publishing under a hedge ("according to a document...") is a different kind of assertion than stating a fact ("the trial was compromised"), or merely a liability shield.

  It is a different kind of assertion.

  When we state "The trial was compromised," we commit our outlet's reputation to the **state of the world**. We are betting that the data is indeed irregular.
  When we state "A document alleges the trial was compromised," we commit our outlet's reputation to the **state of the conversation**. We are betting that the allegation is significant enough to warrant public attention, regardless of the document's ultimate authenticity.

  In the drug trial case, the hedge is not a shield; it is a precision instrument. It tells the reader: *This claim is newsworthy, but the verification is incomplete.* This allows us to warn the public without lying about our level of certainty. It shifts the burden of proof from the *fact* to the *allegation*.

  **5. Practical Guidance: The Confidence Matrix**

  To ensure this is not just a slogan, reporters must apply the following **Confidence Matrix** on deadline. Before publishing a claim, the reporter and editor must agree on the level:

  *   **Level 1 (Fact):** Verified by multiple independent sources or primary documentation. *Assertion:* Flat statement.
  *   **Level 2 (High Confidence):** Single reliable source + corroborating circumstantial evidence. *Assertion:* Flat statement with attribution ("according to officials").
  *   **Level 3 (Provisional):** Single source or unauthenticated document + high public stakes. *Assertion:* Hedged ("documents suggest," "allegations raise questions"). Must include context on verification limits.
  *   **Level 4 (Speculation):** Weak evidence + low public stakes. *Assertion:* Do not publish.

  *Application to the Drug Trial Case:* This falls to **Level 3**. The source is reliable, but the document is unauthenticated. The stakes are high. We publish the *allegation* prominently, but we hedge the *conclusion*. We write: "An internal regulatory document obtained by [Outlet] alleges serious data irregularities... The document could not be independently authenticated, and the regulator declined to comment."

  **6. What the Losing Camps Must Give Up**

  To adopt this policy, we must be clear about the costs.

  **To the Knowledge Camp:** You must give up the demand for certainty. You must accept that we will publish claims that might later turn out to be false, provided the *process* of arriving at them was rigorous. You are asking for a standard that makes breaking news impossible. You must accept that "responsible error" is preferable to "silent omission."

  **To the Truth Camp:** You must give up the idea that the end justifies the means. Even if the trial *was* compromised, we cannot assert it as flat fact if our evidence is only a leaked document. You must accept that our credibility relies on the transparency of our *methods*, not just the accuracy of our *hits*. Luck is not a journalistic standard.

  **7. Conclusion**

  The Norm of Justified Assertibility asks us to be honest about what we know, rather than pretending to know what we don't. It protects the outlet from the arrogance of the Truth Rule and the paralysis of the Knowledge Rule.

  It allows us to publish the drug trial story without lying. It allows our science reporters to cover preprints without overselling. It allows our breaking news team to update stories without treating every correction as a scandal.

  I urge the desk to adopt this norm. It turns our limitations into a feature of our coverage, signaling to readers not just *what* happened, but *how sure we are* that it happened.

  [Your Name]
  Science-and-Ideas Correspondent
