answer: |-
  **Project Title:** The Distinctive Verdict Problem: Prioritarianism and the Levelling-Down Objection

  **Project Summary**
  This project constitutes the theoretical core of my doctoral dissertation. It interrogates the standard dialectic in distributive justice wherein the levelling-down objection (LDO) is used to reject telic egalitarianism in favour of prioritarianism. I propose to demonstrate that prioritarianism, as standardly conceived, lacks a distinctive structural verdict on levelling down: it agrees with utilitarianism that a world where everyone is worse off is worse in every respect. Consequently, the LDO may refute intrinsic equality without thereby motivating the priority view. I will further investigate whether reformulating prioritarianism to yield a distinctive verdict inevitably incurs commitments structurally identical to telic egalitarianism. The outcome will clarify the logical space between egalitarianism and utilitarianism, determining whether prioritarianism is a stable intermediate position or a unstable compromise.

  **The Research Question**
  The central question is precise: *Does there exist a coherent normative view that answers the levelling-down objection with a verdict that is neither the egalitarian's 'it is all-things-considered bad but pro tanto good' nor the utilitarian's 'it is bad in every respect', while remaining distinct from both?*

  Existing positions leave this open because the debate has focused on all-things-considered judgments rather than the structure of pro tanto reasons. Telic egalitarians accept the LDO's claim that levelling down is all-things-considered worse, but insist it is better in the respect of equality. Utilitarians deny any respect in which it is better. Prioritarians typically argue that benefits to the worse off matter more, but since levelling down involves no benefits, the priority weighting does not apply. Thus, prioritarianism ostensibly collapses into the utilitarian verdict structure (bad in every respect), even if its distributional recommendations in other cases differ. If this is correct, the LDO does not motivate prioritarianism; it merely clears the field for any view denying intrinsic equality. However, if one attempts to modify prioritarianism to capture a distinctive 'respect' (e.g., by valuing the absolute state of the worst-off intrinsically), it risks structural collapse into a form of egalitarianism. This project maps this logical terrain.

  **Work Plan and Methodology**
  The fellowship year will be dedicated to completing the dissertation, with this project forming chapters three and four. The work is divided into four phases.

  *Months 1–3: Taxonomy and Formalisation*
  I will formalise the 'Distinctive Verdict Condition'. I will catalogue existing formulations of prioritarianism to determine if any implicitly claim a pro tanto value in patterned states independent of individual benefits. I will construct a formal model distinguishing 'benefit-based' views from 'state-based' views. The deliverable is a precise definition of what counts as a 'distinctive verdict' that avoids verbal dispute.

  *Months 4–6: Constructing Variants of the Levelling-Down Case*
  I will construct three specific thought experiments to discriminate between pairs of views:
  1.  **The Standard Case:** Everyone loses utility; equality increases. (Discriminates Telic Egalitarianism from Utilitarianism/Prioritarianism).
  2.  **The Priority-Blind Case:** The worst-off lose a small amount; the best-off lose a massive amount. Inequality decreases, but the worst-off are absolutely lower. (Tests whether Prioritarianism values the *gap* or the *absolute level* of the worst-off).
  3.  **The Structural Priority Case:** A scenario where weighted benefits remain constant, but the distribution pattern changes. (Tests if a reformulated Prioritarianism can identify a 'respect' in which a change is better without appealing to equality).

  *Months 7–9: Testing and Evaluation*
  I will test the major variants of prioritarianism against these cases. I will analyse whether any version can identify a 'respect' in which levelling down is improved without appealing to relational equality. I will engage with the objection that the dispute is merely verbal (i.e., about the definition of 'respect'). I will determine if 'state-based' prioritarianism is extensionally equivalent to a specific form of egalitarianism.

  *Months 10–12: Synthesis and Writing*
  I will integrate these findings into the dissertation. I will draft the conclusion regarding the stability of the priority view. If the hypothesis holds, I will argue that the LDO forces a choice between utilitarianism and egalitarianism, with prioritarianism serving merely as a heuristic for the latter. If the hypothesis fails, I will articulate the newly discovered distinctive view.

  **Possible Conclusions and Deciding Considerations**
  There are three primary outcomes:
  1.  **The Collapse Thesis:** Prioritarianism has no distinctive verdict on LDO. The LDO refutes egalitarianism but motivates only the negation of intrinsic equality, not priority. *Deciding consideration:* Whether standard prioritarian formulas yield any positive value in a no-benefit equality increase.
  2.  **The Distinctive View:** A coherent view exists that values the absolute level of the worst-off intrinsically (not relationally). *Deciding consideration:* Whether this view can be distinguished from sufficiency views or 'floor-constrained' egalitarianism without circularity.
  3.  **The Verbal Dissolution:** The dispute hinges on the individuation of 'respects'. *Deciding consideration:* Whether 'respects' can be grounded in metaphysically distinct properties rather than linguistic conventions.

  **Risks and Feasibility**
  The primary risk is that the project balloons into a general meta-ethical inquiry into the nature of 'pro tanto' reasons. I will mitigate this by restricting the analysis to distributive cases and accepting a deflationary account of 'respects' if necessary. A second risk is that the dispute proves purely verbal. If 'distinctive verdict' cannot be pinned down without stipulation, the project will pivot to diagnosing why the literature assumes a distinction exists. This diagnostic outcome is itself a substantive philosophical contribution and will be incorporated into the dissertation's conclusion. Finally, there is a risk that a niche variant of prioritarianism already solves the problem. My initial taxonomy (Months 1–3) is designed to identify this early; if found, the project will shift to a critical evaluation of that variant's coherence.

  The timeline is conservative, allowing for the iterative nature of conceptual analysis. The required resources are limited to library access and time for writing. This fellowship would allow me to finalise this argument without teaching interruptions, ensuring the dissertation makes a novel contribution to the debate on distributive justice.
