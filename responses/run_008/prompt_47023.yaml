  I'm a PhD student applying for a one-year dissertation completion fellowship, and I need a two-page proposal that turns my half-formed idea into something fundable. The idea: the levelling-down objection to telic egalitarianism is routinely presented as a reason to become a prioritarian instead, but I suspect prioritarianism does not actually have a distinctive verdict on levelling down — it merely agrees with the utilitarian that a world where everyone is worse off, and no one better off, is worse, with no respect in which it is better. If that is right, the objection may show only that there is no intrinsic value of equality, not that the priority view earns anything from it; and I want to press the further suspicion that any attempt to reformulate prioritarianism so that it does say something distinctive about levelling down — for instance, by treating the badness of the worst-off position itself, rather than weighted benefits to individuals, as basic — incurs commitments structurally similar to the telic egalitarian's, such as counting an equalising catastrophe as better in one respect. Please state the question precisely (I think it comes down to whether what is wrong with levelling down admits of an answer that is neither the egalitarian's 'it is bad but better in one respect' nor the utilitarian's 'it just reduces the total'), explain why the existing positions leave it open, set out what I would actually do month by month — including which variants of the levelling-down case to construct and which pairs of views each is meant to discriminate between — say what the possible conclusions are and which considerations would decide among them, and be honest about what would make the project fail or balloon, including the possibility that the dispute is partly verbal once 'distinctive verdict' is pinned down. Don't include any citations; I'll add those myself. Please write the proposal in British English.
