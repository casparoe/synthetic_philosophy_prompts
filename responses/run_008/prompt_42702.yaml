answer: |-
  The persistence of the Socialist Calculation Debate (SCD) is indeed eerie, but not because the arguments are recycled. It is eerie because the debate has undergone a silent ontological shift that neither side fully acknowledges. You are correct to sense that the disagreement is no longer about engineering constraints but about the metaphysics of economic data.

  As a philosopher of economics, I diagnose this stalemate not as a failure of resolution, but as a case of **theoretical incommensurability**. The two sides are operating within different paradigms of what an economy *is*. To the computational socialist, the economy is a complex engineering system where variables exist independently of the measurement apparatus. To the Austrian, the economy is a discovery process where variables are *created* by the measurement apparatus (the market).

  Here is the diagnosis, brainstorming the candidate explanations, testing your hypothesis, and concluding with what genuine progress would look like.

  ### 1. Candidate Diagnoses

  **A. The Empirical/Technological Diagnosis**
  *   *Thesis:* The debate is waiting on Moore's Law. Cockshott argues we now have the FLOPS to solve the input-output matrices Lange lacked.
  *   *Verdict:* **False.** This assumes the bottleneck is processing speed. Hayek's argument was never about the speed of calculation, but the *availability of inputs*. If the data does not exist prior to the transaction, a supercomputer is merely a faster engine running on empty fuel. Both sides know computing power is vast; they disagree on whether the *data* can be captured without distorting it.

  **B. The Incentive Diagnosis (Public Choice)**
  *   *Thesis:* The calculation problem is actually an incentive problem. Planners *could* compute rational prices but won't because they lack the incentive to minimize cost or satisfy consumers.
  *   *Verdict:* **Insufficient.** This concedes the theoretical point to Lange. Mises's claim was stronger: even a benevolent, omniscient dictator *could not* calculate. Reducing the SCD to incentives changes the subject from logical possibility to political sociology. It explains why socialism fails in practice, but not why it is impossible in principle.

  **C. The Verbal/Semantic Diagnosis**
  *   *Thesis:* The sides define "price" differently. If an algorithm outputs a shadow price, Lange calls it a price; Hayek calls it a statistic.
  *   *Verdict:* **Partially True.** There is a semantic layer, but it masks a deeper functional disagreement. For Hayek, a "price" is not a number; it is a signal embedded in a property right that transfers risk. An algorithmic shadow price lacks the risk-transfer mechanism. Calling them both "prices" is a category error.

  **D. The Ontological Diagnosis (The Strongest Candidate)**
  *   *Thesis:* The disagreement is about the existence of economic data. Does preference data exist *ex ante* (waiting to be collected) or *ex post* (revealed through action)?
  *   *Verdict:* **Correct.** This is the engine of the stalemate.

  ### 2. Testing Your Hypothesis

  Your hypothesis is that the crux is **epistemological**: whether knowledge is transmittable *data* (socialist view) or tacit *know-how* generated by the process (Austrian view).

  **Where your hypothesis holds:**
  It accurately captures the Hayekian shift from "computation" to "discovery." Hayek's 1945 *Use of Knowledge in Society* argument is precisely that the data required for planning does not exist in a centralized form. It is dispersed not just spatially, but mentally. When Cockshott argues for labor-time accounting, he assumes labor time is an objective, measurable invariant that can serve as a proxy for value. Hayekians retort that labor time is heterogeneous and its value is determined by the *output's* subjective valuation, not the input's duration. Your hypothesis correctly identifies that Cockshott treats economic values as objective properties of goods (labor content), whereas Austrians treat them as subjective rankings revealed in exchange.

  **Where your hypothesis is too simple:**
  It focuses on *knowledge* but neglects *counterfactuals* and *risk*.

  1.  **The Problem of Counterfactuals:** Market prices do not just reflect actual transactions; they reflect *opportunity costs*. A price encapsulates the value of a resource in its *next best alternative use*. In a market, rival bidders reveal this. In a planning model, the "alternative uses" are theoretical. A computer can optimize for *stated* demand, but it cannot compute the value of uses that no one has thought to propose yet. The market price of capital goods reflects the competing visions of entrepreneurs betting on different futures. A planner optimizes for the present or the predictable future; the market prices the *uncertain* future.
  2.  **The Entrepreneurial Function:** Your hypothesis focuses on "knowledge" as a static stock (tacit vs. explicit). It underestimates the Kirznerian element of *alertness*. Entrepreneurship is not just utilizing existing knowledge; it is creating new knowledge by noticing arbitrage opportunities. If you remove the possibility of residual claimancy (profit), you remove the incentive to be alert. The "data" disappears not because it is tacit, but because the *activity that generates the data* (speculative investment) ceases.
  3.  **The Loss Function:** Computation requires an objective function. In a market, the objective function is survival (profit/loss). Bankruptcy is a computational tool that deletes inefficient algorithms (firms). Computational socialism proposes optimization, but often lacks a rigorous theory of *deletion*. Without the threat of asset loss, the "computation" lacks the negative feedback loop required to correct error.

  ### 3. The Structural Impasse

  The reason the debate feels "eerie" and stalled is that both sides are answering different questions under the same label ("Calculation").

  *   **The Socialists (Lange to Cockshott)** are asking a **Static Allocation Question**: "Given a set of resources and a set of preferences, can we find the vector of outputs that maximizes utility?" They treat the economy as a *consumption* problem.
  *   **The Austrians (Mises to Hayek)** are asking a **Dynamic Coordination Question**: "How do we discover which resources *should* exist and what preferences *will* emerge, given radical uncertainty?" They treat the economy as a *production and discovery* problem.

  When Cockshott says, "We can solve the equations," he is right *within the Lange framework*. If preferences are fixed and technology is known, a computer can solve the general equilibrium.
  When Hayek says, "You cannot collect the knowledge," he is right *within the Misesian framework*. Preferences are not fixed, technology is unknown, and the act of planning changes the data.

  The impasse is permanent **unless** one side concedes the ontological status of the other.
  *   If the Socialists concede that preferences are endogenous to the market process, their model collapses (because the input vector is moving).
  *   If the Austrians concede that preferences are stable and exogenous, the Socialist calculation becomes theoretically possible (though perhaps practically difficult).

  Since neither side will concede this (because it contradicts their core view of human action), the debate is structurally locked.

  ### 4. What Would Count as Progress?

  Progress will not come from a simulation, a complexity result, or a new computer. It will come from a **formalization of institutional epistemology**.

  **A. A Sharper Distinction: Optimization vs. Search**
  We need to stop calling planning "calculation." It is a **search problem** in a rugged landscape.
  *   **Socialist Claim:** The landscape is smooth enough that gradient descent (trial and error prices) finds the global maximum.
  *   **Austrian Claim:** The landscape is rugged, dynamic, and the topography changes when you walk on it. Decentralized parallel search (entrepreneurship) is the only way to avoid getting stuck on local maxima.
  *   **Progress:** A formal complexity proof showing that for an economy with $N$ agents and $K$ innovations, the computational complexity of central search exceeds $O(2^N)$ while decentralized search remains polynomial *under uncertainty*. (Note: Standard GET assumes convexity; relaxing convexity to allow for increasing returns and innovation might formally vindicate Hayek).

  **B. A Change in the Question**
  We must stop asking "Can we calculate prices?" and start asking **"Can we replicate the error-correction mechanism of bankruptcy without private property?"**
  The price is not the magic; the price is the readout. The magic is the *risk-bearing*. If Cockshott can design a mechanism where planners face personal ruin for incorrect price signals comparable to a capitalist facing bankruptcy, the calculation problem diminishes. If they cannot, the "computation" is costless error, which accumulates.

  **C. Acknowledging the Impasse**
  Finally, honest progress requires admitting that the SCD is not a scientific dispute but a **philosophical anthropology**.
  *   **Socialist Anthropology:** Humans are essentially consumers with stable needs; the economy is a delivery system.
  *   **Austrian Anthropology:** Humans are essentially creators with unstable desires; the economy is a discovery system.

  **Conclusion**
  Your hypothesis is 80% correct. The divide is epistemological (data vs. process). But the remaining 20% is crucial: it is also **axiological**. The market does not just aggregate knowledge; it *judges* it through profit and loss. Computational socialism solves the *aggregation* problem but has no solution for the *judgment* problem.

  The debate will not end because it is not about calculation. It is about whether society is a machine to be engineered or an organism to be cultivated. Until economists agree on the metaphysics of society, the calculation debate will remain a ghost that haunts every new technology, from cybernetics to AI, because it is not a technical glitch—it is a feature of the disagreement.
