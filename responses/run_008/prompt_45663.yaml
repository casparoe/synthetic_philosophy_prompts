answer: |-
  ### Setup and rules
  **Materials:** 15 envelopes, slips of paper, coins, cash/tokens (up to $40 total), whiteboard.
  **Rules:**
  1.  **Secret Write:** Each student writes a positive dollar amount (max $20) on a slip, folds it, and submits it. **Crucial:** They must not remember or track their number.
  2.  **Pairing:** Pair students (7 pairs, 1 observer). For each pair, secretly select one slip. Let this value be $X$.
  3.  **Stuffing:** Place $X$ in one envelope and $2X$ in the other. Seal them.
  4.  **Distribution:** Shuffle the two envelopes and give one to each student in the pair.
  5.  **Decision:** Students open envelopes, see amount $A$, and decide whether to pay a $0.50 fee to swap.
  6.  **Payoff:** Reveal amounts. Pay the final held amount (minus fee if swapped).

  ### How the session runs
  **0–10 min:** Explain rules. Emphasize the "forget your number" rule. Collect slips.
  **10–30 min:** Pair students. While they chat, quickly generate envelopes using their slips (write $X$ and $2X$ on cards, stuff envelopes). Distribute.
  **30–45 min:** **The Trap.** Ask students to calculate the expected value (EV) of switching on a scrap paper. On the board, write:
  $$E[\text{Switch}] = 0.5(2A) + 0.5(A/2) = 1.25A$$
  Ask: "Who wants to swap?" Most will raise hands. Collect fees. Record predictions on the board (Table: Pair | Amount A | Switch? | Result).
  **45–60 min:** Execute swaps. Reveal contents. Pay out. Tally net wins/losses on the board. Students will notice switching didn't systematically win.
  **60–80 min:** Debrief (see below). Use the board tally to show empirical average gain ≈ 0, contradicting the 1.25A formula.

  ### Debrief script
  "Look at the board. The math said switching gains 25%. The data says gains are zero. Did the algebra fail? No. The *assumptions* did."

  Point to the $0.5$ probabilities in the EV formula. "This calculation assumes that seeing $A$ makes $X=A$ and $X=A/2$ equally likely. When is that true?"

  Elicit from students: "Only if every amount is equally likely." Write **Prior Distribution** on the board. "If every amount from $0.01 to infinity is equally likely, the total probability sums to infinity, not 1. That's impossible."

  Highlight the $20 cap. "If you saw $15, could the other be $30? Yes. If you saw $18? No. The probability shifts near boundaries. The '50/50' intuition smuggles in an impossible prior distribution that no real envelope-stuffing procedure—including your slips—can produce. The math wasn't lying; it was solving a different game than the one we played."

  ### What will go wrong and how to handle it
  1.  **Memory Leak:** A student remembers writing $10 and sees $10. They know they hold $X$. **Fix:** Enforce the "forget it" rule strictly. If they claim knowledge, ask them to bet on whether their slip was the one used (they can't know).
  2.  **Boundary Breaking:** Someone writes $15, sees $30. They know they hold $2X$ and should switch down. **Fix:** Acknowledge this! It proves the prior isn't uniform. Use it as evidence that probabilities depend on $A$.
  3.  **Collusion:** Pairs discuss amounts before opening. **Fix:** Strict silence rule once envelopes are distributed.
  4.  **Time Crunch:** Stuffing 7 pairs live takes too long. **Fix:** Have a TA help, or pre-prep 5 pairs with dummy numbers and only use student slips for the final 2 pairs to save time while keeping engagement.

  ### What this game can't reproduce
  This game demonstrates the *finite* resolution (bounded prior), but it cannot fully reproduce the *infinite* paradox where switching is always beneficial under an improper prior (e.g., $P(X) \propto 1/X$). Students might leave thinking "it's just the $20 cap." You must explicitly clarify that even without a cap, a uniform prior over an infinite range is mathematically undefined, not just physically impossible. The paradox relies on measure theory subtleties this game glosses over.
