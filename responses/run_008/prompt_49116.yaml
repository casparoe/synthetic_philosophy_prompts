  Three candidate rules explain her track record. **Rule 1 (Direct Material Interest)** holds that action is legitimate only if it advances the participants' own wages, safety, or working conditions; this predicts Case 1 is illegitimate (not their grievance), Case 2 is legitimate (own pay), and Case 3 is illegitimate (community issue). **Rule 2 (Primary Target)** holds that action is legitimate only if directed at the direct employer, avoiding neutrals; this predicts Case 1 is illegitimate (restaurant is not employer), Case 2 is legitimate (app is employer), and Case 3 is legitimate (developer is employer). **Rule 3 (Procedural Formality)** holds that action is legitimate only if authorized by a vote, unless immediate physical safety is at risk; this predicts Case 1 is illegitimate (no vote), Case 2 is illegitimate (economic wildcat), and Case 3 is legitimate (unanimous vote).

  My best guess is that Maya follows **Rule 1** primarily, with **Rule 2** as a strict secondary constraint, while treating **Rule 3** as flexible depending on organizational capacity. For Case 1, both Rule 1 and Rule 2 converge on illegitimacy; Maya rejected secondary boycotts because they harm neutrals, and here the couriers are intervening in a dispute that isn't theirs, mirroring the illegitimate secondary boycott precedent. For Case 2, Rule 1 and Rule 2 suggest legitimacy, overriding Rule 3; although it is an economic wildcat (unlike the safety walkout), the gig workers lack a union structure to hold a vote, making the "no vote" aspect structural rather than rebellious, similar to how urgency waived procedure in the injury walkout. For Case 3, Rule 1 overrides Rule 2 and Rule 3; despite the unanimous vote and direct employer target, the grievance is social rather than material, aligning with her rejection of the political general strike over pensions.

  To discriminate between Rule 1 (Direct Material Interest) and Rule 3 (Procedural Formality), you should bring a case where a union **votes unanimously to strike against their own employer to demand the company adopt a specific moral policy, such as divesting from fossil fuels.** Rule 1 predicts illegitimacy (not a workplace condition), while Rule 3 predicts legitimacy (authorized vote); Maya's verdict here would reveal whether she prioritizes the *content* of the grievance or the *procedure* of the decision.
