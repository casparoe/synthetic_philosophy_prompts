answer: |-
  Here are ten interview questions designed to probe your guest's specific defense of Evidential Decision Theory (EDT) regarding Kavka's Toxin Puzzle, including the required follow-ups keyed to her likely responses.

  **1. The Newcomb Analogy**
  Your position sounds remarkably like the Newcomb one-boxer: both agents profit from a past prediction of what they will later do. But in Newcomb, the box is already packed; in Toxin, the money is already banked. What distinguishes your toxin-drinker from a one-boxer who opens the box, finds it empty, and still claims they 'one-boxed' correctly?
  *   **Follow-up:** *(Anticipated Answer: She will argue the structural similarity is what matters; rationality is about the policy, not the specific outcome.)*
      "If the structure is identical, the one-boxer's payoff depends on the predictor's accuracy regarding the *act*. In your case, the payoff depends on the *intention*. If the agent keeps the money but doesn't drink, didn't the predictor fail? How do you save the predictor's accuracy without the drink?"

  **2. Intention vs. Prediction**
  Let's zoom in on the mental state at midnight. Many philosophers argue intention requires a belief that you will act. If you know you won't drink, isn't your 'intention' just a prediction that you're the kind of person who drinks, rather than a genuine plan to drink?
  *   **Follow-up:** *(Anticipated Answer: She will distinguish intention as a normative commitment rather than a descriptive forecast.)*
      "If it's normative, does that normativity have any grip once the instrumental reason (the money) is gone? Or is it a free-floating norm that binds you to misery for no gain?"

  **3. Stability of Intention**
  This leads to the stability of the intention. You argue an intention formed for its evidential value can survive once the payout is secured. But once the million is banked, the evidential reasons evaporate. Why doesn't the intention dissolve the moment the evidence is no longer needed?
  *   **Follow-up:** *(Anticipated Answer: She will argue that rationality is diachronic and based on maintaining a consistent policy over time.)*
      "If the intention survives solely to maintain a rational policy, does that mean the agent is effectively lying to themselves about their future action to maintain a self-image?"

  **4. The Decidability of Intention**
  Does your position commit you to a general account of intentions as things one can simply decide to have, rather than as evidence-based conclusions about one's future conduct?
  *   **Follow-up:** *(Anticipated Answer: She will likely endorse a form of voluntarism, arguing intentions are actions we perform.)*
      "If intentions are voluntary like raising an arm, can I intend to do something I know is physically impossible, like jumping to the moon, provided it has some evidential benefit?"

  **5. The Belief Condition**
  You maintain the agent knows the money is banked and drinking brings misery. Standard theory says you can't intend what you believe you won't do. Are you rejecting the belief condition entirely?
  *   **Follow-up:** *(Anticipated Answer: She will reject the requirement that intention entails belief in success.)*
      "If belief isn't necessary, what stops intention from becoming mere wishful thinking? Where is the line between a rational intention and a delusion?"

  **6. Diachronic Rationality**
  It seems you're positing a split between the 'planning self' at midnight and the 'acting self' the next day. Is rationality, on your view, fundamentally fragmented across time?
  *   **Follow-up:** *(Anticipated Answer: She will argue the 'agent' is the extended life or policy, not the momentary time-slice.)*
      "If the acting self is rational to *not* drink, but the planning self was rational to *intend*, which self is the 'agent'? Who is responsible for the coherence of the person?"

  **7. Defining 'Genuine'**
  You use the word 'genuinely' intend. What makes the intention genuine if the motivation to execute it is absent? Is it the psychological feeling, or the disposition?
  *   **Follow-up:** *(Anticipated Answer: She will define it as a commitment to the plan regardless of local incentives.)*
      "If the commitment doesn't translate to action because the action is locally irrational, is it a commitment to the plan or a commitment to the *identity* of a planner?"

  **8. The Cost of Misery**
  Let's talk about the misery. EDT maximizes expected utility. At the moment of drinking, the utility is purely negative. How does EDT justify an intention that leads to a known utility loss at the moment of execution?
  *   **Follow-up:** *(Anticipated Answer: She will argue the utility was captured at the intention stage, making the whole sequence positive.)*
      "So the agent is essentially using their future self as a resource to be sacrificed for the past self's gain? Is that a sustainable model of agency?"

  **9. Self-Trust and Paradox**
  Does this model require a specific kind of self-trust? Specifically, trusting that your future self will honor a commitment that your future self has no reason to honor?
  *   **Follow-up:** *(Anticipated Answer: She will argue one must trust one's rational policy over local impulses.)*
      "If your future self is rational and sees no reason to drink, isn't trusting them to drink actually *irrational*? How do you resolve that paradox?"

  **10. Real-World Application**
  Where does this apply outside puzzles? Is this how you view New Year's resolutions?
  *   **Follow-up:** *(Anticipated Answer: She will likely draw a parallel between the toxin puzzle and keeping resolutions despite changing incentives.)*
      "Most people break resolutions. On your view, are they irrational for breaking them, or were they irrational for making them without a mechanism to enforce them?"
