prompt: |-
  I do data governance at a mid-size HR/insurance SaaS company, which in practice means I decide what categories go into our schemas. Every few weeks a team shows up wanting a new one: adding nonbinary as a gender option, a "high-value customer" tier, whether to keep collecting race, ICD-style diagnosis codes for our wellness product, "gig worker" vs "contractor". Right now these calls get made on vibes and it shows. I've read a bit of the social construction literature — Searle on institutional facts, the X counts as Y formula, Hacking on interactive kinds and looping effects, i.e. the way classifying people changes the people and hence the kind's own statistics — and it seems like there's an actual procedure buried in there about when a category tracks something real vs. when it manufactures the thing it names vs. when its just a filing convenience that we shouldn't pretend is discovering anything. Write me that procedure so my team can run it on a proposed category in an afternoon: the questions in order, what counts as a sufficient answer to each, where it terminates in a "don't add this," where it correctly punts to the execs because the question is values not data, and where it can't be eliminated as a judgment call no matter how much we dress it up. It has to handle the looping problem head on — the categories we ship change the behavior of the people classified, so our own telemetry can't be treated as ground truth about whether the category carves anything. Then run it on three: adding nonbinary as a gender option, creating a high-value customer tier, and continuing to collect race for fairness auditing. Include at least one of the three where the procedure gives an answer I'm not going to like, and say plainly where the procedure will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Data Governance Lead at a mid-size HR/Insurance SaaS company.
      *   **Problem:** Ad-hoc, "vibes-based" schema category decisions (gender, customer tiers, race, diagnosis codes, employment status).
      *   **Theoretical Basis:** Social Constructionism (Searle's Institutional Facts, Hacking's Interactive Kinds/Looping Effects).
      *   **Deliverable:** A practical, afternoon-run procedure (checklist/algorithm) for evaluating proposed categories.
      *   **Requirements:**
          *   Order of questions.
          *   Criteria for sufficient answers.
          *   Termination points (Don't Add, Punts to Execs, Irreducible Judgment).
          *   Must address the "looping effect" (classification changes behavior).
          *   Apply the procedure to three specific cases: Nonbinary gender, High-value customer tier, Collecting race for fairness.
          *   **Crucial Constraint:** Include at least one outcome the user won't like, and admit where the procedure misfires.

  2.  **Theoretical Grounding & Translation to Practice:**
      *   *Searle (X counts as Y in context C):* Distinguish between brute facts (physics), institutional facts (money, marriage), and subjective preferences. In SaaS, most categories are institutional facts created by the software.
      *   *Hacking (Interactive Kinds):* Classifying people changes how they see themselves and act. This invalidates simple "accuracy" metrics.
      *   *The Goal:* A procedure that distinguishes between:
          1.  *Descriptive:* Tracking a pre-existing reality (rare in social data).
          2.  *Prescriptive/Performative:* Creating a reality to manage risk/access (common in insurance/HR).
          3.  *Normative:* Embedding values (fairness, inclusion).
      *   *The Trap:* Treating performative categories as descriptive (reification).

  3.  **Drafting the Procedure (The "Categorization Audit"):**
      *   Need a step-by-step flow.
      *   *Step 1: Ontological Status.* Is this a brute fact or a social fact? (e.g., Date of Birth vs. "High Value").
      *   *Step 2: Purpose.* Why do we need it? (Compliance, Product Logic, Ethics).
      *   *Step 3: Looping Risk.* If we label them, will they change behavior? (Hacking).
      *   *Step 4: Reification Check.* Are we pretending this is natural when it's constructed?
      *   *Step 5: Decision Matrix.* Go/No-Go/Exec Escalation.

      *Refining the Steps for an "Afternoon":*
      *   Make it punchy. Use specific questions.
      *   Define "Sufficient Answer."
      *   Define "Stop Conditions."

  4.  **Developing the Test Cases:**
      *   *Case 1: Nonbinary Gender Option.*
          *   Context: HR/Insurance.
          *   Ontology: Social/Identity.
          *   Looping: High (validates identity, changes reporting).
          *   Verdict: Add (Ethical/Legal necessity outweighs data purity).
      *   *Case 2: High-Value Customer Tier.*
          *   Context: SaaS Business Logic.
          *   Ontology: Institutional/Constructed.
          *   Looping: High (Sales will game it, Customers might change usage).
          *   Verdict: Add, but label as "Internal Metric," not "Truth."
      *   *Case 3: Collecting Race for Fairness Auditing.*
          *   Context: Insurance/HR (Highly regulated).
          *   Ontology: Social Construct with Real Consequences.
          *   Looping: Complex (Self-ID changes over time, creates anxiety).
          *   *The "Unliked" Outcome:* This is the tricky one. To satisfy the prompt's requirement for an "unliked" answer, I need to find a angle where the procedure suggests *stopping* or *heavily restricting* collection, despite the moral imperative.
          *   *Idea:* If the procedure strictly follows Hacking, it might argue that collecting race *creates* the racialized data that enables discrimination, even if intended for fairness. Or, more practically, if the *usage* isn't airtight, the risk of leakage/reification outweighs the benefit. Let's go with: "Don't collect unless you have a cryptographically sealed audit pipeline." If the answer is "we'll just put it in the main DB," the procedure says NO. This is realistic and often disliked by DEI teams who want the data *now*.

  5.  **Addressing the "Misfire" Constraint:**
      *   Where does this fail? It fails when moral urgency outweighs epistemic caution. Sometimes you *must* categorize to protect people, even if the category is flawed. The procedure is too cold for crisis management.

  6.  **Writing the Content - Tone and Style:**
      *   Tone: Professional, slightly academic but pragmatic, direct.
      *   Structure:
          1.  Introduction (acknowledging the theoretical weight).
          2.  The Procedure (The "Ontological Audit").
          3.  The Three Runs.
          4.  The "Unliked" Outcome.
          5.  The Misfire (Limitations).

  7.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is it too abstract?
      *   *Fix:* Add specific "Pass/Fail" criteria.
      *   *Critique:* Does it handle Searle?
      *   *Fix:* Explicitly ask for the "Status Function Declaration" (Who says this counts as Y?).
      *   *Critique:* Does it handle Hacking?
      *   *Fix:* Explicitly ask for the "Feedback Loop Prediction."

  8.  **Final Polish on the "Unliked" Outcome:**
      *   For the Race case: The procedure should flag that if the *infrastructure* isn't ready to prevent the data from being used for underwriting (in insurance) or bias (in HR), the mere existence of the column creates a liability that outweighs the auditing benefit. This is a "Safety First" data governance stance that might frustrate DEI advocates who want to start auditing immediately.

  9.  **Final Polish on the "Misfire":**
      *   The procedure assumes we have time to deliberate. In a regulatory crisis or a PR firestorm, we don't. Also, it assumes rational actors. It doesn't account for power dynamics (e.g., a VP demands a column).

  10. **Review against constraints:**
      *   Procedure in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Termination points? Yes.
      *   Handle looping? Yes.
      *   Three cases run? Yes.
      *   One unliked answer? Yes (Race collection halted).
      *   Admit misfire? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  This is the **Ontological Audit Procedure (OAP)**. It is designed to be run in a 2-hour working session with Engineering, Product, and Legal stakeholders. It does not solve moral dilemmas; it exposes them so they can be solved by the right people.

  The OAP rests on three axioms derived from your reading:
  1.  **Searle:** Most schema fields are not discoveries; they are *status function declarations* (we agree to treat X as Y).
  2.  **Hacking:** Classifying people creates a feedback loop (the "looping effect"). The data will not remain static.
  3.  **Reification Risk:** The greatest danger is treating an institutional fact (a rule we made) as a brute fact (a law of nature).

  ---

  ### Part 1: The Procedure

  Run these five questions in order. If a question fails, the process terminates at the indicated decision point.

  #### Q1: The Brute vs. Institutional Test
  **Question:** Does this category describe a physical reality independent of human agreement (Brute), or does it exist only because we/authority say it does (Institutional)?
  *   *Examples:* `birth_date` (Brute-ish), `employment_status` (Institutional), `credit_score` (Institutional).
  *   **Sufficient Answer:** A clear designation of one or the other.
  *   **Termination:**
      *   If **Brute**: Proceed to Q2. (Low looping risk).
      *   If **Institutional**: Proceed to Q2, but flag "High Reification Risk."

  #### Q2: The Status Function Declaration (Searle)
  **Question:** Who has the authority to declare that X counts as Y in this context, and what powers does Y confer?
  *   *Requirement:* You must identify the *deontic power* (rights/obligations) attached to the label.
  *   **Sufficient Answer:** "The Underwriting Act of 2024 says X counts as High Risk, which confers the obligation to charge 20% more." OR "HR Policy 5.1 says X counts as Full Time, conferring benefit eligibility."
  *   **Termination:**
      *   If **No Authority Identified**: **STOP. DO NOT ADD.** (You are creating private law without a legislature).
      *   If **Powers are Vague**: **STOP. DO NOT ADD.** (e.g., "It just helps us know them better" is insufficient).
      *   If **Clear**: Proceed to Q3.

  #### Q3: The Looping Effect Prediction (Hacking)
  **Question:** If we ship this field, how will the classified people change their behavior to alter their classification, and how will that break our telemetry?
  *   *Requirement:* A specific mechanism of gaming or identity shift.
  *   **Sufficient Answer:** "If we label 'High Value', Sales will discount deals to hit the revenue threshold, lowering margin." OR "If we add 'Nonbinary', employees previously silent will update profiles, causing a spike that looks like a demographic shift but is actually reporting accuracy."
  *   **Termination:**
      *   If **Team claims "No Behavioral Change"**: **STOP. DO NOT ADD.** (They are lying or naive. Interactive kinds always loop).
      *   If **Mechanism Identified**: Proceed to Q4.

  #### Q4: The Reification Check
  **Question:** Are we building downstream systems that treat this Institutional category as a Brute truth?
  *   *Requirement:* Audit of downstream consumers (ML models, automated decisions).
  *   **Sufficient Answer:** "This field is used only for human-in-the-loop reporting" (Pass) OR "This field is an input into the automated underwriting engine" (Fail/High Risk).
  *   **Termination:**
      *   If **Automated Decision without Appeal**: **PUNT TO EXECS/LEGAL.** (This is a values/risk decision, not data governance).
      *   If **Human-in-the-Loop or Descriptive Only**: Proceed to Q5.

  #### Q5: The Exit Strategy
  **Question:** Under what conditions do we deprecate this category if the looping effect corrupts the signal?
  *   **Sufficient Answer:** A specific metric or review date. "If gaming reduces margin by 5%, we re-calculate the threshold."
  *   **Termination:**
      *   If **No Exit Strategy**: **PUNT TO EXECS.** (You are creating a permanent institutional fact without a sunset clause).
      *   If **Defined**: **APPROVE WITH DOCUMENTATION.**

  ---

  ### Part 2: Running the Audit

  Here is the procedure applied to your three pending requests.

  #### Case 1: Adding "Nonbinary" to Gender Schema
  *   **Q1 (Brute/Inst):** Institutional. Gender is a social category, not a chromosomal binary in this context. **Flag: High Reification Risk.**
  *   **Q2 (Status Function):** Authority is the User (Self-ID). Power conferred is accurate representation and compliance with EEOC/state guidelines.
      *   *Pass:* Authority is clear (the individual).
  *   **Q3 (Looping):** Employees who previously identified as M/F may shift to NB. This will look like a demographic shift in telemetry, but it is actually a *measurement accuracy* shift.
      *   *Pass:* Mechanism identified (Reporting accuracy vs. Population shift).
  *   **Q4 (Reification):** Is this used for automated underwriting?
      *   *Risk:* In insurance, gender is often a rating factor. If NB is added, does the actuarial table break?
      *   *Verdict:* **PUNT TO ACTUARIAL/LEGAL.** If NB forces a "null" in the rating engine, it's a product decision. If it's for HR records only, it passes.
  *   **Q5 (Exit):** N/A (Identity categories are not deprecated based on signal corruption).
  *   **Final Decision:** **APPROVE for HR/Profile schemas.** **HOLD for Insurance Underwriting schemas** until Actuarial signs off on risk pooling.

  #### Case 2: Creating a "High-Value Customer" Tier
  *   **Q1 (Brute/Inst):** Institutional. Purely constructed by the business.
  *   **Q2 (Status Function):** Authority is Revenue Ops. Power conferred is access to dedicated support/slack channel.
      *   *Pass:* Clear deontic power.
  *   **Q3 (Looping):** Sales teams will structure deals to hit the threshold at quarter-end (e.g., pulling forward revenue). Customers may reduce usage if they feel "tiered down."
      *   *Pass:* Mechanism identified (Gaming revenue recognition).
  *   **Q4 (Reification):** Will this feed an automated churn model?
      *   *Risk:* If the model assumes "High Value" = "Sticky," but Sales gamed the entry, the model will fail.
      *   *Verdict:* **PASS**, provided the field is named `internal_tier_status` not `customer_value_truth`.
  *   **Q5 (Exit):** Review threshold quarterly. If >15% of tier is flagged for revenue pulling, recalculate threshold.
      *   *Pass:* Sunset/Review defined.
  *   **Final Decision:** **APPROVE.** Label clearly as "Internal Construct."

  #### Case 3: Continuing to Collect Race for Fairness Auditing
  *   **Q1 (Brute/Inst):** Institutional. Race is a social construct with brutal institutional consequences. **Flag: Extreme Reification Risk.**
  *   **Q2 (Status Function):** Authority is Self-ID (EEOC). Power conferred is... what? In HR, it's protection. In Insurance, it's legally restricted (often prohibited from use in underwriting).
      *   *Pass:* Authority clear.
  *   **Q3 (Looping):** Collection rates vary by trust. If trust drops, reporting drops. The "statistics" of race in your DB reflect *trust in the company*, not *demographics of the pool*.
      *   *Pass:* Mechanism identified (Trust-dependent reporting).
  *   **Q4 (Reification):** **CRITICAL FAIL.**
      *   *Scenario:* You want to collect this to audit fairness. However, your data warehouse allows joins between `demographics` and `claims_adjudication`. Even if you *say* it's for auditing, the *schema* allows an actuary or ML engineer to join the tables and find correlations.
      *   *The OAP Ruling:* **DO NOT ADD TO MAIN SCHEMA.**
      *   *Reasoning:* The risk of the category leaking into institutional decisions (underwriting/hiring) via SQL join or feature creep outweighs the auditing benefit *unless* the data is siloed.
  *   **Q5 (Exit):** N/A.
  *   **Final Decision:** **REJECT** the proposal to add this to the standard user profile schema.
      *   *Alternative Path:* Create a separate, access-controlled "Ethics Audit" database that cannot be joined to operational tables without C-level authorization.

  ---

  ### Part 3: The Answer You Won't Like

  **The Race Collection Rejection.**

  Your DEI team and Legal counsel will hate the OAP ruling on Case 3. They will argue that you cannot audit bias without data. They are right morally, but the OAP is right *data-governance-wise*.

  If you put `race` in the same schema as `claims_cost` or `performance_review_score`, you have created a loaded gun. In an HR/Insurance SaaS, the pressure to "optimize models" is constant. A data scientist will eventually ask, "Why can't I use this feature to improve accuracy?" or a query will leak.

  The OAP forces you to admit that **collecting the data is not a neutral act of measurement; it is an act of risk creation.** If you are not willing to build a physically separate silo (which is expensive and annoying), the procedure dictates you do not collect it. This prioritizes *safety from misuse* over *capacity for audit*. That is a cold trade-off, but it prevents the "filing convenience" from becoming a discrimination engine.

  ### Part 4: Where The Procedure Misfires

  You asked where this will fail. It will fail in **Crisis and Power Imbalances.**

  1.  **The "Move Fast" Misfire:** The OAP assumes rational deliberation. If a regulator demands a report on "Gig Worker" classification in 48 hours, you do not have time for Q3 (Looping) or Q5 (Exit Strategy). You will ship a "vibes" column. The procedure provides no cover for emergency compliance.
  2.  **The Power Misfire:** The OAP assumes that "No Authority Identified" (Q2) is a stop condition. In reality, if the VP of Sales demands a "Strategic Partner" flag to close a deal, they *are* the authority. The procedure will tell you "STOP," but the VP will override you. The OAP cannot protect you from organizational power dynamics; it can only document that you warned them.
  3.  **The Moral Urgency Misfire:** In Case 3 (Race), the procedure suggests halting collection if the silo isn't perfect. But if there is active, documented discrimination happening *now*, withholding the data prevents stopping the harm. The OAP prioritizes *future structural risk* over *immediate corrective justice*. Sometimes, you must dirty the schema to save the people.

  **Implementation Advice:**
  Use the OAP to generate the "Risk Memo" attached to every new column. When the VP overrides the "STOP" decision, make them sign the memo. That is the only governance power you actually have.
