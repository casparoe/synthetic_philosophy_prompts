  (1) "My pattern in one line"
  You grant understanding when a system builds an internal model to navigate novelty, but deny it when it merely executes fixed mappings or surface associations.

  (2) "The best candidate principle"
  The principle is **Generative Structural Modeling**. Understanding requires constructing an internal representation of relationships within a domain that supports simulating outcomes or handling novel inputs, rather than relying on fixed input-output mappings or surface-level statistical correlations. This distinguishes a chess engine, which simulates future board states to achieve a goal, from a calculator, which executes a rigid function without representing "number." It also separates an LLM extending an analogy, which grasps relational structure, from one reciting bar exam answers, which may retrieve surface patterns. Crucially, the system must manipulate the model to solve problems, not just query a database. This explains why a dog understands the leash (causal model) but a thermostat does not (fixed threshold). It implies understanding is graded and domain-specific. A system can understand chess without understanding the world. The key test is counterfactual: if the rules changed slightly, could the system adapt its strategy, or would it fail? This focus on adaptability within a modeled space resolves the tension between computation and meaning, treating understanding as functional capacity rather than a mystical property.

  (3) "Scorecard"
  - Thermostat: Kept. Simple threshold trigger, no internal model of temperature.
  - Calculator: Kept. Executes fixed functions, no representation of quantity.
  - Chess Engine: Kept. Simulates future states and opponent strategies within a game model.
  - Dog: Kept. Forms causal associations between objects and outcomes.
  - Clever Hans: Kept. Failed math model, but successfully modeled human social cues.
  - Blindsight: Kept. Possesses sub-personal spatial modeling without conscious access.
  - GPS: **Overturned.** If Chess Engine understands an abstract board state via search, GPS must understand an abstract road network; both are dynamic state-space searches, making your distinction inconsistent.
  - LLM Bar: Kept. Likely statistical pattern matching rather than legal reasoning models.
  - LLM Analogy: Kept. Requires grasping and extending relational structure, not just retrieval.

  (4) "New cases"
  - Poetry Translator: Yes. To translate poetry "really well," the system must model metaphor, rhythm, and emotion, exceeding mere synonym substitution.
  - Reading Kid: No. Fluency is decoding symbols (like a calculator), not constructing semantic meaning; they are reading aloud, not reading.
