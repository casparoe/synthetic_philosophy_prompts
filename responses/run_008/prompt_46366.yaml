      *   *Claim 6 (Happier/Make it True):* "Believing... makes us happier and can even make it true."
          *   *James:* Yes, he discusses "self-fulfilling prophecies" (e.g., trusting someone leads to their trustworthiness). He also argues passional nature influences belief.
