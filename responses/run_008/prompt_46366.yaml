      *   *Refining the "Paralysis" point:* Clifford argues we should proportion belief to evidence. We can act on probabilities. James claims Clifford demands certainty. The handout sides with James's *critique* of Clifford (that it paralyzes) as if it were a fact, but Clifford would deny his rule entails paralysis. So this goes in "Subtly Off" or "James's view of Clifford, not Clifford's view." Let's put it in "Wrong/Off" because it attributes a consequence Clifford rejects.

