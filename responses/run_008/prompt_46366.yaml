      *   *Refining the "Motivated Reasoning" point:* Motivated reasoning shows we *are* biased. Clifford says we *ought not* be. James says we *must* choose when evidence runs out. Motivated reasoning supports Clifford's warning about bias, but doesn't refute James's point about unavoidable passional choices in forced moments.

      *   *Refining the Closing Verdict:* The verdict relies heavily on the caricature of James (as pure wishful thinking). If James is corrected, the "empirical settlement" is much shakier.

  5.  **Final Review against Constraints:**
