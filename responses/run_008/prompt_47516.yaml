answer: |-
  **Life Definitions Diagnostic**
  *Instructions: For each case, select the option that best matches your intuition.*

  1.  **Virus:** Inert outside a host; replicates inside.
      A) Alive only when replicating.
      B) Never alive; lacks independent metabolism.
      C) Borderline.
  2.  **Dormant Spore:** Metabolically inactive 10,000 years; revivable.
      A) Alive (lineage potential persists).
      B) Not alive (no current process).
      C) Borderline.
  3.  **Mule & Sterile Ant:** Individually sterile; part of reproducing lineage/colony.
      A) Alive (individual organisms).
      B) Not alive (evolutionary dead ends).
      C) Alive only as colony parts.
  4.  **Digital Organisms:** Self-replicating, evolving code in simulation.
      A) Alive (pattern matters).
      B) Not alive (requires chemistry).
      C) Borderline.
  5.  **Sloppy Protocell:** Self-maintaining metabolism; heredity too weak for evolution.
      A) Alive (self-maintenance).
      B) Not alive (no cumulative evolution).
      C) Borderline.
  6.  **Candle Flame:** Consumes fuel, maintains structure, dissipates energy.
      A) Alive (thermodynamic process).
      B) Not alive (no history/genetics).
      C) Borderline.
  7.  **Cultured Cell Line:** Dividing decades after donor death.
      A) Alive (continuous lineage).
      B) Not alive (no organism).
      C) Borderline.
  8.  **Boundary:** Is there a sharp line between living and non-living?
      A) Yes.
      B) No (gradient/cluster).

  **Scoring Key**
  *Tally your answers. Dominant patterns indicate your position.*

  *   **NASA Working (Chemistry + Darwin):** A on 2, 4, 7; B on 5, 6. Life requires a self-sustaining chemical system capable of Darwinian evolution.
  *   **Evolutionary (Selection):** A on 1, 2, 3, 4, 7; B on 5, 6. Life is whatever undergoes natural selection (e.g., Maynard Smith). Substrate-neutral.
  *   **Autopoiesis (Self-Maintenance):** B on 1, 4; A on 2, 5. Life is an organizationally closed physical system (e.g., Maturana/Varela). Requires current process, not just history.
  *   **Thermodynamic (Dissipative):** A on 6. Life is a structure maximizing entropy production (e.g., Schneider/Kay).
  *   **Deflationary (Family Resemblance):** Mostly C on 1–7; B on 8. "Life" has no essence; borderline cases are genuine (e.g., Wittgenstein/Bedau).

  **Incoherent Combos**
  *   **A on 6 (Flame) + B on 5 (Protocell):** Claiming flames are alive but metabolizing cells are not contradicts all standard physicalist views. Likely error.
  *   **A on 5 (Protocell) + B on 2 (Spore):** Accepting non-evolving metabolism but rejecting dormant potential is theoretically possible (strict current-process view) but rarely defended as a complete definition.

  **Limitations**
  This instrument cannot reliably separate **NASA** and **Evolutionary** positions if students interpret "chemistry" loosely in Q4. Both reject the Protocell (Q5) and accept the Spore (Q2). To split them, add a question about a *non-chemical evolving system* (e.g., memetics) explicitly asking if substrate independence is permissible. Additionally, **Thermodynamic** and **Deflationary** positions may overlap on Q6; a follow-up asking *why* the flame is borderline/alive would distinguish category errors from essence denial.
