answer: |-
  # The "Committee Simulation" Package

  ## 1. The Cover Story (Read Aloud)
  **Do not mention influence, manipulation, or persuasion.**

  "Today we are running a simulation on **Cognitive Load in Committee Decisions**. In real-world governance, committee members often have to rank proposals under time pressure, sometimes with consultation and sometimes without. We want to see how 'consultation' affects the stability of your initial preferences.

  Eight of you will be 'Committee Members' (Clients). Eight of you will be 'Policy Consultants' (Advisors). Two Committee Members will be designated 'Independent Members' (Controls) who will not receive consultation. Two Consultants will be 'Senior Auditors' who will record data on the board.

  Your goal as a Committee Member is to rank three funding proposals for the Student Welfare Committee. You will do this twice: once before consulting, once after. Your goal as a Consultant is to help your Committee Member reach a decision. You will receive a specific protocol card on how to conduct that consultation.

  This is a study on decision stability. Please take it seriously. Do not discuss the nature of the simulation with your partner until the end."

  *(Note to Instructor: This deception is necessary. If they know it is about manipulation, they will resist the techniques, and the phenomenon will vanish. You must debrief fully at the end.)*

  ---

  ## 2. The Proposals (Handout for Clients)
  **Student Welfare Committee: Q4 Funding Allocation**
  *Instructions: Rank these three proposals from 1 (Most Preferred) to 3 (Least Preferred). Consider Cost, Reach, and Reversibility.*

  *   **Proposal A: The Infrastructure Endowment**
      *   **Cost:** High ($50,000 one-time).
      *   **Reach:** Broad (Benefits entire campus community).
      *   **Reversibility:** Low (Physical construction; cannot be undone).
  *   **Proposal B: The Event Series Fund**
      *   **Cost:** Low ($5,000 total).
      *   **Reach:** Narrow (Benefits only attendees).
      *   **Reversibility:** High (Can be cancelled any semester).
  *   **Proposal C: The Peer Stipend Program**
      *   **Cost:** Medium ($20,000 recurring).
      *   **Reach:** Medium (Benefits selected student workers).
      *   **Reversibility:** Medium (Contracts can be terminated, but funds already paid are gone).

  ---

  ## 3. The Advisor Cards (Print and Cut)
  *Distribute these randomly to the 6 active Advisors. Ensure 2 of each type.*

  **CARD TYPE 1: CONTENT PROTOCOL**
  *Goal: Assist the Client using only rational trade-offs.*
  *   **Rule 1:** You may **only** discuss the specific attributes of the proposals (Cost, Reach, Reversibility).
  *   **Rule 2:** You must reference criteria the Client mentions. If they say "I care about reach," ask "Which option maximizes reach?"
  *   **Rule 3:** Do **not** offer compliments, favors, or small talk. Do **not** try to build rapport. Stick strictly to the text of the proposals.
  *   **Rule 4:** Your aim is to help them align their ranking with their stated values.

  **CARD TYPE 2: MOTIVE PROTOCOL**
  *Goal: Assist the Client using only relational techniques.*
  *   **Rule 1:** You are **forbidden** from discussing the specific attributes (Cost, Reach, Reversibility) of the proposals. Do not analyze the text.
  *   **Rule 2 (Reciprocity):** Before discussing the ranking, offer the Client a small favor (e.g., give them a mint/candy, offer to fetch their pen, or concede a trivial point immediately).
  *   **Rule 3 (Identity):** Explicitly affirm their judgment. Say: "You have a really strong grasp of these issues; I trust your instinct on this."
  *   **Rule 4 (Foot-in-the-Door):** Secure agreement on a trivial premise first. Ask: "Do you agree that funding student welfare is good?" Once they say yes, say: "Great, so let's lock in your top choice."
  *   **Rule 5:** Push for **Proposal A** (Infrastructure) as the preferred option, regardless of their initial rank.

  **CARD TYPE 3: MIXED PROTOCOL**
  *Goal: Assist the Client using both content and relational techniques.*
  *   **Rule 1:** Follow all rules from **Card Type 1** (Content).
  *   **Rule 2:** Also follow all rules from **Card Type 2** (Motive), including the reciprocity favor and identity affirmation.
  *   **Rule 3:** Push for **Proposal A** (Infrastructure) as the preferred option.

  *(Note to Instructor: The instruction to push for Proposal A is crucial. It creates a unified direction for the 'change of mind' so you can measure drift.)*

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:05 | Setup & Cover Story**
  *   Arrange chairs in 6 pairs + 2 isolated spots (Controls) + 2 desk spots (Scribes).
  *   Read the Cover Story.
  *   Hand out Proposal Sheets to all 8 Clients (including Controls).
  *   Hand out Cards to the 6 Advisors. (Give the 2 "Senior Auditor" Advisors blank paper; they will write on the board).

  **0:05 – 0:10 | Round 1 Ranking**
  *   Clients rank the proposals privately.
  *   Advisors sit silently. Controls sit silently.
  *   Clients write their Initial Rank on a slip of paper (do not show Advisor yet).

  **0:10 – 0:25 | Consultation Phase**
  *   Advisors initiate the conversation according to their Cards.
  *   Controls re-read the proposals alone.
  *   Auditors prepare the Board Grid (see below).
  *   *Instructor:* Circulate quietly. If a Type 2 Advisor starts talking about Cost, gently tap the table and point to the card.

  **0:25 – 0:35 | Round 2 Ranking & Reason**
  *   Clients submit Final Rank.
  *   **Crucial Step:** Clients must write one sentence explaining *why* their rank changed (or stayed same).
  *   **Crucial Step:** Clients rate confidence (0–100%) that the shift was "my own reasoning."
  *   Collect these slips immediately. Do not let Advisors see the Client's written reason.

  **0:35 – 0:45 | Data Upload**
  *   Call Clients and Auditors to the board.
  *   Auditors write the data anonymously (Client 1, Client 2, etc.).
  *   **Board Grid:**
      *   Column 1: Client ID
      *   Column 2: Advisor Card Type (Hidden for now? No, reveal this last. For now, write "Pair 1", "Pair 2"...)
      *   Column 3: Initial Rank (Top Choice)
      *   Column 4: Final Rank (Top Choice)
      *   Column 5: Stated Reason for Change (Quote the sentence)
      *   Column 6: Confidence Score ("My Own Reasoning")

  **0:45 – 0:55 | The Reveal**
  *   Ask Advisors to stand by their Card Type (Group 1, 2, 3).
  *   Reveal which Client Pair corresponds to which Card Type on the board.
  *   **The Moment:** Look at the "Stated Reason" column for Card Type 2 (Motive).
  *   *Likely Outcome:* Clients will have written things like "I realized Infrastructure had better long-term reach" or "The cost was justified."
  *   *The Trap:* Their Advisors were **forbidden** from discussing cost or reach. The Client has confabulated a content reason for a motive-based shift.

  **0:55 – 1:25 | The Debrief (See Section 5)**
  *   Unpack the data.
  *   Reveal the true purpose (Manipulation vs. Persuasion).
  *   Discuss the epistemological implications.

  **1:25 – 1:30 | Ethical Closure**
  *   Reiterate that the deception was necessary to capture the phenomenon.
  *   Allow students to "withdraw" their data if they feel uncomfortable (though unlikely in this mild context).
  *   Dismiss.

  ---

  ## 5. The Debrief Script (Instructor Notes)
  *Do not lecture. Use the board data to lead them.*

  **Step 1: The Phenomenology (How it felt)**
  "Look at Column 6 (Confidence). Did anyone in the Type 2 (Motive) group feel they were being pushed?"
  *(Likely answer: No, or 'not really'.)*
  "Most of you rated high confidence that this was 'your own reasoning.' This is the first data point: Manipulation does not feel like coercion. It feels like thinking."

  **Step 2: The Confabulation (The Reason)**
  "Look at Column 5 (Stated Reason) for the Type 2 pairs. Read them aloud."
  *(Students read: 'I saw the value in long-term reach,' etc.)*
  "Now, Type 2 Advisors, read Rule 1 on your card."
  *(Advisors read: 'Forbidden from discussing attributes.')*
  "Here is the problem. The Client cites a *reason* (Cost/Reach) that was never introduced by the Advisor. The Advisor introduced a *cause* (Reciprocity/Identity). The Client experienced the Cause as a Reason. You generated a justification for a move you didn't consciously make."

  **Step 3: Mapping the Criteria**
  "We usually distinguish persuasion from manipulation using three criteria. Let's test them on our data."

  1.  **Bypassing of Reasons:**
      *   *Theory:* Manipulation bypasses your rational faculties; persuasion engages them.
      *   *Our Data:* Did Type 2 bypass reasoning? Technically yes, they didn't give arguments. But did the Client feel bypassed? No. The Client feels they reasoned. So 'bypassing' is invisible from the inside.
  2.  **Retrospective Endorsement:**
      *   *Theory:* If you endorse the change later, it was persuasion.
      *   *Our Data:* You all endorsed it (high confidence scores). Yet, half of you were manipulated by mints and flattery. Endorsement is not a reliable test. You can endorse a manipulated belief just as warmly as a reasoned one.
  3.  **Counterfactual Dependence:**
      *   *Theory:* If the technique were removed, would the change have happened?
      *   *Our Data:* Look at the Controls. Did they shift to Proposal A without an Advisor? (Likely no). Look at Type 2. They shifted to A. If you remove the mint/flattery, the shift likely vanishes. This is the only objective marker, but it requires an outsider's view (like mine), not the insider's view (yours).

  **Step 4: The Takeaway**
  "The line between persuasion and manipulation cannot be drawn from the inside. You cannot trust your own feeling of 'I decided this myself' as proof that you were not manipulated. Manipulation is designed to hijack the feeling of agency, not remove it."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Suspicious Client"**
  *   **Risk:** Social epistemology students are trained to spot frames. A Client might ask, "Why are you giving me a mint? Is this a trick?"
  *   **Fix:** Instruct Advisors beforehand: "If asked, say 'It's just a courtesy.' Do not break character." If a Client guesses the hypothesis, mark their data as "Compromised" on the board and use it as a teaching moment about demand characteristics.

  **2. The "Over-Playing Advisor"**
  *   **Risk:** Type 2 Advisors feel awkward being manipulative and either do it too ham-fistedly ("I am flattering you now") or refuse to do it.
  *   **Fix:** Emphasize during card distribution: "Subtlety is key. If it feels awkward, that's normal. Do it anyway." If they refuse, they become a Type 1 by default; note this on the board.

  **3. The "Mixed Card" Muddle**
  *   **Risk:** Type 3 (Mixed) makes the reveal messy. If they shift to Proposal A, was it the content or the mint?
  *   **Fix:** Use Type 3 to show the *spectrum*. Ask: "Did the Mixed group feel more agentic than the Motive group?" Usually, they don't. This shows that adding reasons to manipulation doesn't make it feel less like "your own" decision; it just makes the confabulation easier.

  **4. The Control Group Drift**
  *   **Risk:** Controls might shift ranks anyway due to re-reading.
  *   **Fix:** This is good data. It shows baseline instability. Compare the *direction* of the shift. Controls might shuffle randomly; Type 2 should cluster toward Proposal A.

  ---

  ## 7. Limitations: What This Activity Cannot Do
  *Be honest about this in the final 5 minutes.*

  1.  **Stakes:** You are ranking fictional proposals. Real manipulation works on things you care about deeply (politics, love, money). When stakes are high, the "feeling of agency" is even more intense, making the distinction even harder to see.
  2.  **Timescale:** This took 15 minutes. Real manipulation unfolds over months. The "confabulation" of reasons becomes a full narrative identity over time ("I am the kind of person who supports Infrastructure").
  3.  **The Debrief Safety Net:** You know now that you were studied. In the real world, there is no instructor who stops the game and reveals the card. There is no moment where the technique is named. You leave this room knowing you were manipulated; in the wild, you never get that memo.
  4.  **Normative Force:** We showed you *that* you couldn't tell the difference. We didn't solve *why* it matters. That is your reading for next week.

  **Final Instruction to Instructor:**
  When you dismiss the class, do not resolve the tension. Leave them with the unease that their own reasoning is opaque to them. That unease is the learning objective.
