answer: |-
  # JOINT STATEMENT ON FREE WILL, DESERT, AND JUSTICE
  **Signatories:** Daniel C. Dennett & Gregg D. Caruso
  **Date:** October 26, 2023
  **Context:** Following our adversarial collaboration culminating in *Just Deserts: Debating Free Will* (2021).

  ### I. AGREED CLAIMS

  1.  **The Irrelevance of Contra-Causal Freedom:** We agree that "libertarian" or contra-causal free will (the power to have done otherwise given identical prior states of the universe and laws of nature) is incoherent or scientifically untenable. Neither of us bases our normative claims on the existence of such metaphysical freedom.
  2.  **The Failure of Retributivism as Currently Practiced:** We agree that the contemporary criminal justice system, particularly in the United States, relies excessively on retributive intuitions that lead to disproportionate suffering, systemic bias, and ineffective outcomes. We concur that mass incarceration is a moral and practical failure.
  3.  **Shared Practical Reforms:** Regardless of our theoretical disagreement, we endorse overlapping policy reforms:
      *   Significant reduction in carceral populations.
      *   Prioritization of rehabilitation and restorative justice practices.
      *   Elimination of the death penalty.
      *   Focus on social determinants of crime (poverty, education, mental health).
  4.  **The Causal Efficacy of Holding Responsible:** We agree that practices of praise, blame, and punishment have causal effects on human behavior. Holding agents responsible is a mechanism for steering behavior and maintaining social norms; it is not a metaphysical detection of a soul's state.
  5.  **The Stakes of the Disagreement:** We agree that our remaining disagreement is not merely academic. It concerns the *justificatory limits* of state coercion. Specifically: Does the state need more than public safety to justify hard treatment (punishment), or is public safety sufficient provided due process is maintained?

  ### II. DISAGREEMENTS AND CRUXES

  | Domain of Disagreement | Dennett's Formulation (Compatibilism) | Caruso's Formulation (Free Will Skepticism) |
  | :--- | :--- | :--- |
  | **1. The Function of "Desert"** | **Claim:** The concept of "basic desert" is unnecessary, but "pragmatic desert" does essential justificatory work. It distinguishes between *managing a hazard* and *holding a citizen accountable.* Without desert, we treat offenders merely as broken machines rather than participants in the moral community. | **Claim:** "Pragmatic desert" is a dangerous euphemism that smuggles retribution back in. Once contra-causal desert is abandoned, no version of "desert" can justify inflicting suffering. Only prevention and incapacitation are morally permissible. |
  | **2. The "Verbal" Charge** | **Rebuttal:** This is not a verbal dispute. To deny desert is to deny the reality of the social contract. If we stop saying people "deserve" consequences for norm violations, we erode the agency required to *be* responsible. The word tracks a real functional capacity. | **Rebuttal:** This is partially verbal but with substantive consequences. You are redefining "desert" to mean "useful to punish." I am using "desert" to mean "morally permissible to punish based on past action." The substantive risk is that your definition licenses more suffering than mine. |
  | **3. Crux Case: Identical Risk, Different History**<br>*(See Section III for details)* | **Prediction:** A just system will punish the "reformed slip-up" offender less than the "chronic" offender, even if current risk is identical, because the former demonstrated greater capacity for norm adherence. | **Prediction:** A just system will incapacitate both offenders for the identical duration, because only future risk justifies liberty deprivation. Past "effort" is a matter of luck and cannot justify differential suffering. |

  ### III. CRUXES WITH CONCRETE CASES AND PREDICTIONS

  We identify the following two scenarios as the decisive tests for our respective frameworks. We record our predictions here to allow for future empirical and normative evaluation.

  #### Crux 1: The Justificatory Work of Everyday Desert
  **The Question:** Does Dennett's "everyday sense" of desert provide a moral constraint on punishment that Caruso's public-health model lacks, or does it merely obscure the consequentialist calculus?

  **Concrete Case: The Negligent Accident**
  *   **Scenario:** A surgeon, Dr. X, is generally meticulous but, due to a momentary lapse in attention (caused by fatigue), makes an error resulting in patient death. Dr. X has no prior record and immediately reports the error.
  *   **Dennett's Prediction:** Dr. X *deserves* blame and some professional sanction (e.g., temporary suspension), not merely to prevent future error, but to validate the norm of care. To treat this purely as a "system error" without personal blame undermines the agency of surgeons. The sanction is justified *because* she failed her obligation, not just to fix her.
  *   **Caruso's Prediction:** Dr. X does not *deserve* blame. If suspension is warranted, it is solely for retraining or temporary risk mitigation. If fatigue is a systemic issue, punishing Dr. X is unjust. Any "hard treatment" must be justified strictly by future safety, not by the moral need to validate the norm through suffering.
  *   **Substantive Gap:** If the system adopts Caruso's view, Dr. X might face *no* sanction if risk is low. If it adopts Dennett's, Dr. X faces sanction even if risk is low, to uphold the normative structure.

  #### Crux 2: Identical Recidivism, Different Histories of Self-Correction
  **The Question:** Can history of effort justify differential punishment when future risk is held constant?

  **Concrete Case: Offender Alpha vs. Offender Beta**
  *   **Scenario:** Two offenders have committed similar crimes. Actuarial tools predict both have a **40% risk of recidivism** over the next 5 years.
      *   **Offender Alpha:** Committed a crime 10 years ago, underwent rehabilitation, lived crime-free for a decade, then slipped up once under extreme stress.
      *   **Offender Beta:** Has a continuous history of offending with no sustained periods of rehabilitation or demonstrated self-correction.
  *   **Dennett's Prediction:** Alpha deserves a significantly lighter sentence than Beta. Alpha's history demonstrates a stronger capacity for agency and norm compliance. Punishing Alpha as heavily as Beta would be unjust because Alpha has *earned* a status of higher trust through past exercise of free will (compatibilist sense).
  *   **Caruso's Prediction:** Alpha and Beta should receive identical incapacitation (quarantine) terms. Since neither is ultimately responsible for their character (luck), Alpha's "effort" is no more credit-worthy than Beta's "failure." Since the risk to public safety is identical (40%), the restriction on liberty must be identical. Differential treatment based on "desert" is unjustified retribution.
  *   **Substantive Gap:** Dennett's system yields differential liberty restrictions based on past moral track record. Caruso's system yields uniform liberty restrictions based solely on dangerousness.

  ### IV. ANALYSIS: TERMINOLOGICAL VS. SUBSTANTIVE

  After reviewing the above, we conclude the following regarding the nature of our dispute:

  **1. The Terminological Portion:**
  A portion of our dispute is terminological regarding the definition of **"Free Will."**
  *   *Why:* Dennett defines free will as the control required for moral responsibility within a deterministic world. Caruso defines free will as ultimate origination (contra-causal). When Dennett says "We have free will," and Caruso says "We lack free will," they are often using different definitions of the same term.
  *   *Resolution:* We agree to stipulate that "Free Will (Ultimate)" does not exist, and "Free Will (Agency)" exists. This dissolves the metaphysical stalemate.

  **2. The Substantive Portion:**
  A significant portion of our dispute is **substantive and irreducible.**
  *   *Why:* This concerns the **moral permissions of the state.** Even if we agree on terminology, Dennett argues that the state is permitted to inflict suffering *in response to a past wrong* (backward-looking), provided the agent had the capacity to do otherwise (compatibilist sense). Caruso argues the state is *only* permitted to inflict deprivation *to prevent future harm* (forward-looking).
  *   *Irreducibility:* No reformulation can dissolve this. In **Crux 2 (Alpha vs. Beta)**, Dennett mandates different outcomes (less time for Alpha) based on moral history. Caruso mandates identical outcomes (same time for both) based on risk. One of these policy prescriptions must be wrong. If Alpha is given the same sentence as Beta, Dennett's principle of "sensitive desert" is violated. If Alpha is given a lighter sentence, Caruso's principle of "no basic desert" is violated.

  **Conclusion:**
  We agree that the "verbal" dispute over the label *free will* should be set aside. However, the "substantive" dispute over the *limits of punitive authority* remains. We commit to testing these differences against real-world policy outcomes, specifically monitoring whether "desert-sensitive" sentencing (Dennett) produces better social cohesion than "risk-only" incapacitation (Caruso) without reintroducing the barbarities of retribution.

  ***

  **Signed,**

  Daniel C. Dennett
  Gregg D. Caruso
