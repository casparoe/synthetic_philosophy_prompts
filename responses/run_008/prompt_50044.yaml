  Nothing occurs but simms that strike and careen.
  Upon the frictionless and empty plane,
  The simmballs do the shoving on the scene.

  The fast magnetic marbles intervene,
  To build a thought inside the human brain;
  Nothing occurs but simms that strike and careen.

  From chaos, sluggish shapes are slowly seen,
  Where concepts form inside the mental chain;
  The simmballs do the shoving on the scene.

  Who pulls the strings within the grand machine?
  Can reductionism fully explain?
  Nothing occurs but simms that strike and careen.

  The symbols act with power unforeseen,
  Though tiny parts compose the whole domain;
  The simmballs do the shoving on the scene.

  No single view can keep the vision clean,
  The loop returns to where it did remain;
  Nothing occurs but simms that strike and careen,
  The simmballs do the shoving on the scene.
