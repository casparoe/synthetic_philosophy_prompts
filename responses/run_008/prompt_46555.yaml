answer: |-
  First, I am sorry for your loss. Editing a friend's unfinished work is an act of love, but it is also an act of violence—you have to make cuts, choices, and judgments they cannot contest. It makes sense that the theory feels personal here. You aren't just analyzing a text; you are stewarding a ghost.

  To your diagnosis: You are right to suspect that the stalemate persists because the combatants are fighting on different terrains while using the same map. However, it is **not merely verbal**. If it were merely verbal, we could solve it by agreeing on definitions (e.g., "Let's call authorial will 'meaning' and textual effect 'significance'"). E.D. Hirsch tried exactly that in *Validity in Interpretation*, and the debate continued anyway.

  It continues because the disagreement is **ontological** (what kind of object is a text?) and **normative** (what is the ethical goal of reading?).

  Here is the diagnosis of the standoff, followed by a concrete proposal for how to handle your friend's manuscript.

  ### 1. The Diagnosis: It Is Not Verbal, It Is Jurisdictional

  The reason the debate feels like a loop is that Anti-Intentionalism and Intentionalism are not answering the same question. They are claiming jurisdiction over different activities.

  *   **The Anti-Intentionalists (Wimsatt, Beardsley, Barthes):** They are arguing about **aesthetic autonomy**. Their claim is that once a text is public, it becomes a linguistic object governed by the conventions of language, not the psychology of the maker. If the text says "grief" but the author meant "defiance," and the language supports "grief," then for the *reader*, it is grief. Their goal is to protect the text from the "biographical fallacy"—reducing the art to a diary entry.
  *   **The Intentionalists (Hirsch, Knapp, Michaels):** They are arguing about **communication**. Their claim is that words without a willed meaning are just marks. To interpret is to reconstruct a speech act. If you ignore the author, you aren't interpreting; you are creating. Their goal is to preserve the possibility of *being wrong*. Without intention, any reading is as valid as any other.
  *   **The Hypothetical Intentionalists (Levinson, etc.):** They try to split the difference by focusing on the **ideal audience**. Meaning is what the best-informed reader would *hypothesize* the author meant.

  **Why it's substantive, not verbal:**
  The Anti-Intentionalist thinks that if you bind meaning to the author's head, you kill the text's ability to speak to new contexts (the "death of the author" liberates the text). The Intentionalist thinks that if you unbind meaning from the author, you destroy the possibility of truth (any reading becomes a projection).

  They both think something substantive hangs on it because they are protecting different values: **Autonomy vs. Fidelity.**

  You are correct that it bundles three questions:
  1.  **Epistemological:** Can we know the mind? (Usually no.)
  2.  **Ontological:** Is the text a message or an object?
  3.  **Normative:** Do we owe the dead accuracy, or do we owe the living relevance?

  The stalemate exists because literary theory refuses to admit that the answer to (3) changes depending on *who is reading* and *why*.

  ### 2. What Would Count as Progress?

  Progress requires admitting that "interpretation" is not one thing. We need a **contextual theory of validity**.

  In a courtroom, the "meaning" of a contract is strictly intentionalist (what did the signers intend?). In a poetry slam, the "meaning" of a poem is largely anti-intentionalist (what does the audience receive?). In a history class, it's hypothetical (what would a contemporary have understood?).

  The debate stalls because theorists want one rule for *all* reading. The progress move is to say: **The validity of intention depends on the relationship between the reader and the text.**

  *   **For the Public Critic:** The text is public property. Private diaries are inadmissible evidence. (Hypothetical Intentionalism rules here).
  *   **For the Executor/Editor:** The text is a trust. Private diaries are primary evidence. (Actual Intentionalism rules here).

  The distinction that moves the needle is **Stewardship vs. Consumption**. A consumer reads for themselves; a steward reads for the author. The theory has largely ignored the Steward, focusing only on the Critic and the Author.

  ### 3. The Manuscript on Your Desk

  This brings us to your notebooks. You asked: *Should the fact that I found her notebooks change one word of the text's meaning?*

  Under strict Anti-Intentionalism: **No.** The text is public; the notebooks are private.
  Under strict Intentionalism: **Yes.** The meaning is the will; the notebooks reveal the will.

  But you are neither a random reader nor a mind-reader. You are the **Editor**. This is a distinct category.

  **The Practical Solution:**
  You are operating in a phase of the text's life that theory usually ignores: **Pre-Publication.**
  Once you publish this book, it belongs to the world. At that point, the Anti-Intentionalists win. The readers will read the burning letter as they see fit. You cannot control that.

  However, *before* publication, you are engaged in **reconstruction**, not interpretation. Your job is not to decide what the text *means* to a reader, but what the text *is* as a communicative act the author intended to send.

  Here is how you apply the theory to the burning letter scene:

  1.  **Distinguish Editing from Meaning:**
      *   **Editing (The Textual Body):** If the notebooks show she struggled with the word "defiantly" vs. "sadly" and settled on "sadly," but the manuscript has a typo saying "defiantly," you fix it. Here, Actual Intentionalism rules. You are restoring the instrument.
      *   **Meaning (The Textual Soul):** If the text is clear, but the notebook says "I wanted this to be ironic," but the text doesn't support irony... you leave the text alone. Why? Because you are preparing this for *readers*, not for a quiz on her psychology. If the text doesn't carry the irony, putting it in makes it bad art, even if it's "accurate" to her mind.

  2.  **The Notebook as Constraint, Not Decree:**
      Use the notebooks to resolve *ambiguity*, not to override *clarity*.
      *   If the scene is genuinely ambiguous (it could be grief OR defiance), and the notebook says "This is grief," you do not change the text. You might write an introduction or a note. But you do not alter the prose to force "grief" if the scene burns brighter as "defiance."
      *   Why? Because your friend was a writer. Writers often intend one thing and write another. Her *skill* as a writer (the text) often overrides her *plan* as a planner (the notes). To honor her is to honor the work she made, not just the work she planned.

  3.  **The "Hypothetical" Compromise:**
      Ask yourself: "If she were sitting here, knowing this book will be read by strangers who don't have her notebooks, would she want me to change the text to match her private notes, or would she want the text to stand on its own?"
      *   Most writers want the text to work. If the notebook explains a flaw in the text, fix the text. If the notebook explains a depth the text already carries, leave it.

  ### Summary

  The debate is at a standoff because it tries to apply one rule to all reading. The way out is to recognize that **you are not a critic.** You are a collaborator from beyond the grave.

  *   **Is it verbal?** No. It's a fight over who owns the text (Author vs. Language).
  *   **What counts as progress?** Acknowledging that "meaning" functions differently for an Editor than for a Critic.
  *   **The Notebooks:** They give you authority over the *text* (editing choices, variants, cuts), but they do not give you authority over the *reading* (how the burning letter lands).

  If the notebooks say the letter burning is grief, but the scene reads as defiance, trust the scene. She wrote the scene for readers who won't have the notebooks. To force the grief is to make the book private again, and a private novel is a contradiction in terms.

  Honor her mind by fixing the typos and the broken sentences. Honor her art by letting the words do the work she trained them to do. That is the only way to resolve the standoff: by finishing the work so others can start the debate.
