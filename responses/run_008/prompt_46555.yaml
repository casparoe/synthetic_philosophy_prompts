      *   *Intentionalism (Hirsch, Knapp & Michaels):* Meaning *is* willed meaning. Without an author, you have marks, not text. Interpretation is reconstructing a communicative act.
      *   *Hypothetical Intentionalism (Levinson, etc.):* The "best hypothesis" of what the author meant, based on public evidence.
