    "grader_warnings": "<2–3 sentences: which of this student's moves a hasty grader would most likely let slide, and why they shouldn't>"
  }

  For "line_by_line", cover every substantive claim in the answer — the correct ones too, not just the errors — so I can sanity-check my own calibration against yours. And go easy on the typo count, that part's on me for transcribing at 1am.
