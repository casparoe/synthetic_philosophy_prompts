prompt: |-
  I host a small podcast on machine-learning safety with a technically literate audience, and next week's guest is a researcher at an organization that has spent the last few years building out the AI control agenda: the position that we should design deployments so that even a misaligned model cannot cause serious harm, using layered measures such as trusted monitoring (outputs of an untrusted model screened by a weaker but more trusted one), trusted editing, and control-aware red teaming — all under the working assumption that the model may be an adaptive adversary with substantial situational awareness about its deployment. Draft ten to twelve interview questions that go past having him restate the agenda. At least one question each on: (a) the substitution problem in control evaluations, where an honest model is prompted to role-play a misaligned one so the defense can be measured against it — what licenses the inference from "our monitors catch the saboteur we wrote" to "they would catch a real schemer"; (b) iterated adversarial training, i.e. whether repeatedly red-teaming your own defenses and training against the discovered failures just farms evasion strategies into the model and selects for exactly the adversary you can no longer test; and (c) the moral-hazard complaint that control lets labs defer alignment work indefinitely, on which I want him pinned down rather than reassured. For each question, include a follow-up keyed to the reply he is most likely to give. I also have a half-formed hunch that I want the questions to probe without my leading the witness: control seems to treat misalignment as a stable, intrinsic property of the model, when it might instead be a property of the whole deployment situation — the oversight regime, the other agents in the loop, the model's own uncertainty about whether it is being evaluated — in which case a control evaluation run in one context may tell you very little about another. One more requirement: don't hand me a menu of interchangeable questions and leave the choosing to me. Commit to an ordering — tell me which question you'd open with and why, which you'd hold for the final third of the hour, and which single exchange you'd sacrifice first if the conversation runs long — and give your actual reasons, not caveats.
