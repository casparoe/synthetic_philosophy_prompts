answer: |-
  # Lesson Plan: The Money Pump Trading Game
  **Course:** Upper-Level Rational Choice Theory  
  **Topic:** Diachronic Rationality & The Money Pump Argument  
  **Time:** 80 Minutes  
  **Class Size:** 15 Students  

  ## I. Learning Objectives
  1.  **Experiential:** Students with cyclic preferences will *feel* the drain of resources through individually rational trades.
  2.  **Analytical:** Students will identify the specific assumptions required for the money pump to work (myopia, no transaction costs, infinite horizon).
  3.  **Philosophical:** The class will debate whether "sophisticated choice" (refusing a locally dominant trade to avoid a global loss) violates synchronic rationality or saves diachronic rationality.

  ## II. Materials & Setup
  *   **Currency:** 150 Poker Chips (or paper tokens). *Exchange Rate: 10 tokens = 1 piece of premium candy OR 0.5% extra credit on final paper.*
  *   **Assets:** 15 Colored Cards (5 Red, 5 Blue, 5 Green).
  *   **Preference Profiles (Printed on Cardstock):**
      *   **Type A (Cyclic):** 4 students.
      *   **Type B (Transitive):** 9 students.
      *   **Type C (Traders):** 2 students.
  *   **Trading Ledger:** For Traders to record fees collected.
  *   **Whiteboard:** To track aggregate token supply and "Market Prices."

  ### Preference Profiles
  *   **Type A (Cyclic):** "You strictly prefer Red to Blue, Blue to Green, and Green to Red. You are willing to pay up to **2 tokens** to upgrade to your preferred item."
  *   **Type B (Transitive):** "You strictly prefer Red > Blue > Green. You are willing to pay up to **2 tokens** to upgrade. (Note: You will never prefer Green to Red)."
  *   **Type C (Traders):** "You have no preference over colors. Your goal is to maximize your token holdings. You may propose swaps + fees to any student. You keep all fees collected."

  ### Initial Endowments
  *   **Type A (Cyclic):** 10 Tokens + Random Color Card.
  *   **Type B (Transitive):** 10 Tokens + Random Color Card (weighted toward Green/Blue to encourage trading).
  *   **Type C (Traders):** 50 Tokens (House Money) + No Color Card.

  ## III. Game Mechanics & Timeline

  ### Phase 1: Setup & Instructions (0:00–0:10)
  1.  Distribute roles secretly (folded cards). Only Traders know who they are; others know only their own preferences.
  2.  Explain the **Redemption Rule**: At the end of class, **Tokens** determine your grade/candy. The Color Card has *no* objective redemption value (this is crucial: the value is purely in satisfying the preference stated on the card).
  3.  Explain the **Trading Rule**:
      *   Trades are pairwise.
      *   A trade consists of swapping Cards + transferring Tokens.
      *   **Fee:** To simulate the pump, any trade initiated by a Trader must include a **1 Token fee** paid to the Trader. (Student-to-student trades among A/B are fee-free, but Traders are the only ones allowed to *seek out* partners aggressively).
      *   **Voluntariness:** No trade happens without both parties agreeing.
  4.  **Goal:** Maximize your final Token count while satisfying your Preference Profile.

  ### Phase 2: The Pump (Myopic Phase) (0:10–0:30)
  *   **Activity:** Open trading floor. Traders circulate.
  *   **Instruction to Class:** "Evaluate each trade *only* on its immediate merit. Do not worry about future trades. If you prefer the other card enough to pay the fee, take the deal."
  *   **Trader Instruction:** "Find the Cyclic students. Move them along their cycle (e.g., if they have Green, offer Blue for 1 token. Once they have Blue, offer Red for 1 token...)."
  *   **Transitive Student Task:** They are not idle. They must try to trade up to Red. Since they have transitive prefs, they will trade Green→Blue→Red and then *stop*. This keeps them engaged in optimization without the cycle.
  *   **Stop Signal:** At 0:30, freeze all trades.

  ### Phase 3: The Reflection (Sophisticated Choice) (0:30–0:40)
  *   **Public Reveal:** Ask Cyclic students to raise hands. Reveal to the class that their preferences are cyclic ($R \succ B \succ G \succ R$).
  *   **The Pivot:** Announce Round 2.
  *   **New Instruction:** "You are now allowed to be **Sophisticated**. You may refuse a trade that you locally prefer *if* you foresee it leading to a net loss of tokens by the end of the game. You are no longer required to be myopic."
  *   **Trader Instruction:** "Try to pump them again. See if they refuse."

  ### Phase 4: The Defense (0:40–0:60)
  *   **Activity:** Trading resumes.
  *   **Expected Outcome:** Cyclic students should begin refusing trades, citing the "cycle." Traders will struggle to find profit. Transitive students will finish optimizing and act as observers.
  *   **Data Collection:** On the board, track:
      *   Total Tokens held by Cyclic group (Start vs. End).
      *   Total Tokens held by Traders (Start vs. End).
      *   Number of Refusals.

  ### Phase 5: Debrief & Lecture (0:60–0:80)
  *   **Step 1: The Ledger.** Show the Cyclic group lost tokens in Round 1 and saved them in Round 2.
  *   **Step 2: Mapping the Argument.**
      *   *Premise 1 (Cyclicity):* Verified by preference cards.
      *   *Premise 2 (Dominance):* "If you prefer X to Y, you should trade." (Challenged in Round 2).
      *   *Premise 3 (Myopia):* "Evaluate trade in isolation." (Dropped in Round 2).
  *   **Step 3: The Philosophical Pivot.**
      *   *Question:* When a Cyclic student refused a trade in Round 2 (e.g., refusing to trade Green for Blue even though $Blue \succ Green$), did they act irrationally?
      *   *Option A:* Yes. They violated synchronic rationality (ignoring a strict preference).
      *   *Option B:* No. They satisfied diachronic rationality (protecting their future self).
      *   *Discussion:* Is rationality a constraint on *preferences* (fix the cycle) or a constraint on *choice procedures* (be sophisticated)?

  ---

  ## IV. Facilitator's Guide: Predictable Failures & Fixes

  | **What Could Go Wrong** | **Why It Happens** | **Suggested Fix** |
  | :--- | :--- | :--- |
  | **Traders are too shy.** | Undergrads may feel awkward aggressively demanding fees from peers. | Give Traders a "Quota." They need to collect 10 tokens each to get their candy/credit. This gamifies their aggression. |
  | **Cyclic students trade too fast.** | They finish the cycle in 2 minutes and sit bored for 28. | Impose a **"Cool-down Period."** After a trade, a student must wait 2 minutes before trading again. This forces Traders to hunt multiple targets and slows the pump. |
  | **Transitive students feel useless.** | Once they reach "Red," they have no incentive to trade. | Give Transitive students **incomplete information**. Tell them Red *might* be worth less than Blue. They have to *test* the market. Or, give them a "consumption" mechanic where they lose 1 token every 5 minutes just for holding an item (holding cost), forcing constant optimization. *Recommendation:* Keep it simple. Assign them the role of "Auditors" in Round 2—they must record *why* Cyclic students refuse trades. |
  | **Students trade randomly.** | Boredom leads to noise in the data. | Remind them their payoff is real (candy/credit). Random trading lowers their expected payoff. |
  | **The "Refusal" doesn't happen.** | Students feel bound by the instruction to "maximize preference." | In Round 2, explicitly reframe: "Your goal is now **Token Maximization**. The Preference Card is a psychological urge you may choose to resist." |

  ---

  ## V. Limitations: Where the Game Stops and the Argument Begins

  *Note to Instructor: Do not let the game conclude the philosophical debate. The simulation has blind spots you must address in the lecture.*

  **1. The Finite Horizon Problem**
  *   **In Game:** Students know the class ends at 0:80. This makes "Sophisticated Choice" easy (backward induction).
  *   **In Theory:** Real life is an indefinite horizon. If I don't know when the trading stops, can I justify refusing the first trade?
  *   **Lecture Point:** The Money Pump is strongest when the agent believes the opportunities are infinite. Does finite knowledge invalidate the pump as a critique of *general* rationality?

  **2. The "Cost" of Refusal**
  *   **In Game:** Refusing a trade costs nothing.
  *   **In Theory:** Refusing a locally dominant trade feels like a violation of rationality. It creates "regret" in the moment.
  *   **Lecture Point:** McClennen's *Resolute Choice*. Is it psychologically possible to bind yourself? The game makes refusal easy; in reality, resisting a strict preference requires willpower, which might be a resource cost the model ignores.

  **3. The Source of Irrationality**
  *   **In Game:** We *assigned* cyclic preferences. The students aren't "irrational," they are following a script.
  *   **In Theory:** The Money Pump is supposed to prove you *shouldn't have* cyclic preferences.
  *   **Lecture Point:** The game shows the *consequence* of cycles (loss of dominance), but it doesn't prove the *origin* of the norm. Does avoiding the pump make you rational, or just prudent? If a Cyclic agent refuses the trade, are they now rational, or just a Cyclic agent with a clever strategy?

  **4. Transaction Costs vs. Fees**
  *   **In Game:** The fee is a transfer to a Trader.
  *   **In Theory:** The "fee" represents friction or opportunity cost.
  *   **Lecture Point:** If there were no Traders (no one to collect the fee), would the pump still work? (Answer: No, you'd just cycle items forever). The argument relies on the existence of a market that monetizes your inconsistency. Is rationality internal, or dependent on the environment?

  ## VI. Payoff Scheme (Non-Monetary)
  To ensure engagement without using cash:
  *   **Tokens:** Collect tokens at the end of class.
  *   **Tier 1 (0-5 tokens):** Standard participation credit.
  *   **Tier 2 (6-12 tokens):** Participation credit + 1 premium chocolate.
  *   **Tier 3 (13+ tokens):** Participation credit + 2 premium chocolates + "Market Master" title (bragging rights).
  *   **Traders:** Their tokens count double toward their own grade, incentivizing them to extract fees.

  ---

  ## VII. Debrief Script: Mapping Moments to Theory

  **Instructor:** "Look at the Cyclic group's token count after Round 1."
  *   **Concept:** **Dynamic Inconsistency.** You ended with the same card you started with, but fewer tokens. You were strictly dominated by your past self.

  **Instructor:** "Look at Round 2. Sarah, you had Green, preferred Blue, but refused the trade. Why?"
  *   **Student:** "Because I knew you'd just ask for another token next."
  *   **Instructor:** "So you violated the instruction to 'satisfy your preference.' Was that irrational?"
  *   **Concept:** **Sophisticated vs. Resolute Choice.**
      *   *Sophisticated:* You predict your future weakness and maneuver around it.
      *   *Resolute:* You commit to a plan and stick to it even if your local preference changes.

  **Instructor:** "If you refuse the trade, you are passing up a gain (Green $\to$ Blue) that you value. Are you now violating Synchronic Rationality?"
  *   **Concept:** **The Normative Force of the Pump.** Does the pump prove cycles are irrational? Or does it prove that *myopic choice* is irrational? If you can be cyclic but sophisticated, do we still need the Transitivity Axiom?

  **Closing Thought:** "The Money Pump doesn't just tell us to fix our preferences. It tells us that rationality might not be about a single moment of choice, but about the narrative of a life. If you can't tell a coherent story about your choices over time, the market will eat you alive. But if you *can* tell that story by refusing trades, have you solved the problem, or just hidden it?"
