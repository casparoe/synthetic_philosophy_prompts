      *   Choice 2: $A'$ (11% £1m, 89% £0) vs $B'$ (10% £5m, 90% £0). Common choice: $B'$.
      *   Violation: $u(1m) > 0.89u(1m) + 0.1u(5m) + 0.01u(0)$ implies $0.11u(1m) > 0.1u(5m) + 0.01u(0)$. But choosing $B'$ implies the reverse.
      *   Core issue: The 89% chance of £1m is common to $A$ and $B$. The 89% chance of £0 is common to $A'$ and $B'$. Independence says common consequences shouldn't change preference order.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Allais (1953). Challenge to EUT (von Neumann-Morgenstern). State the essay's aim: to determine if this is a fatal blow to rationality or a misunderstanding of the model.

      *   **Section 1: The Claim Under Threat (Independence vs. Separability):**
          *   Need to distinguish the *Independence Axiom* (technical) from *Separability* (philosophical).
          *   Independence: If $L \succ M$, then $pL + (1-p)N \succ pM + (1-p)N$.
          *   Separability: The value of a consequence in a specific state shouldn't depend on consequences in other states.
          *   Why it matters: If it's just the axiom, maybe the math is wrong. If it's separability, it attacks the consequentialist structure of rationality itself. The Allais paradox suggests people care about the *structure* of the gamble (certainty effect), not just the final wealth states. This suggests a violation of separability.

      *   **Section 2: The Redescription Reply:**
          *   Argument: Outcomes aren't just monetary amounts. They include psychological states (relief, regret). £1m certain $\neq$ £1m risky.
          *   Savage's view: Refine the state space/outcome space until EUT holds.
          *   Critique: If we can redefine outcomes ad hoc to fit any preference, EUT becomes a tautology. It loses predictive power.
          *   Verdict on this section: It's a principled repair *only if* the psychological features are independently identifiable. If it's just "I prefer A because I prefer A," it's unfalsifiable.

      *   **Section 3: Alternative Theories (Buchak/Risk-Weighted EUT):**
          *   Buchak (2013): Risk-weighted Expected Utility (REU). Introduces a risk function $r(p)$.
          *   Does it vindicate or systematise? Vindication implies the preferences are *rational*. Systematisation implies they are just *consistent* within a new framework.
          *   Difference: Vindication claims independence was never a norm. Systematisation claims we need a new norm.
          *   Burden of proof: On the alternative theorist to show why risk attitude is a separate parameter from utility, not just a violation of coherence.

      *   **Section 4: Dynamic Consistency:**
          *   Hammond's argument: If you plan to choose $B'$ in the second stage but choose $A$ in the first (when embedded dynamically), you are dynamically inconsistent.
          *   To maintain Allais preferences, one must be resolute (commit to a plan and stick to it even if re-evaluation suggests otherwise) or accept inconsistency.
          *   Resolute choice violates separability across time.
          *   Which horn? Dynamic consistency is a strong requirement for agency. If Allais preferences require dynamic inconsistency, that's a heavy cost.

      *   **Conclusion/Verdict:**
          *   Must choose: Abandon Independence OR Error Theory.
          *   Option A (Abandon): Leads to fragmentation of rationality. Hard to justify why risk-aversion shouldn't apply elsewhere.
          *   Option B (Error): More robust. Preserves the normative force of EUT.
          *   Error Theory needed: Why does it feel rational? Because of the "Certainty Effect" (Kahneman/Tversky). We overweight certainty. It's a heuristic, not a value. It tracks cognitive bias, not genuine value.
          *   Final stance: Independence should be retained. Allais preferences are a systematic error in human psychology, not a insight into rationality.

