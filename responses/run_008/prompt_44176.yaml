answer: |-
  You have put your finger on one of the most persistent, frustrating, and under-named problems in the philosophy of science. You are correct: there is no single, canonical Latin phrase for this specific rhetorical asymmetry (like *ad hominem* or *post hoc ergo propter hoc*). However, the problem is well-recognized in the philosophy of biology, and there is a robust literature on *why* it happens and *how* to fix it.

  The phenomenon you are describing is best understood as a failure of **Methodological Parity** in the face of **Underdetermination**.

  Here is the breakdown of the literature, the concepts involved, and a proposed term you can use in your book club.

  ### 1. The Philosophical Root: Underdetermination
  The core logical problem is **underdetermination of theory by data**. This is the Duhem-Quine thesis applied to evolutionary narratives. Given a trait $T$ and an environment $E$, there are indefinitely many stories that can explain why $T$ exists in $E$.
  *   **Story A (Adaptation):** $T$ was selected for because it solved problem $P$.
  *   **Story B (Byproduct/Spandrel):** $T$ is a side effect of trait $Q$, which was selected for.
  *   **Story C (Drift):** $T$ is random noise that got fixed in the population.

  As you noted, all three can be made to fit the data post-hoc. The frustration arises because critics treat Story A as requiring high evidentiary burden, while treating Story B or C as the "default" or "skeptical" position that requires no evidence other than logical possibility.

  ### 2. The Literature: Who Has Fought This Fight?
  The seminal paper is, of course, Gould and Lewontin's **"The Spandrels of San Marco and the Panglossian Paradigm" (1979)**. They coined "Just-So Stories" to attack adaptationism. However, they were immediately criticized for exactly the problem you identified: they were telling "Just-So Stories" about constraints and byproducts.

  If you want to read the philosophers who have formalized this debate, look for these three names:

  **A. Elliott Sober (The Logician)**
  Sober is the heavyweight here. In books like *Evidence and Evolution* and *Reconstructing the Past*, he argues that the problem isn't adaptationism itself, but **likelihood**.
  *   **The Criterion:** An explanation is only better if it makes the observed data more *probable* than the alternative does.
  *   **The Fix:** You cannot just say "it could be a byproduct." You must show that the byproduct hypothesis makes the specific details of the trait *more likely* than the adaptation hypothesis does. Often, critics fail this test; they just assert logical possibility.

  **B. Daniel Dennett (The Defender)**
  In *Darwin's Dangerous Idea*, Dennett defends adaptationism but distinguishes between **"Competence without Comprehension"** and lazy storytelling. He argues that the "design stance" (assuming a trait has a function) is a necessary heuristic to even begin investigation. He criticizes the critics for assuming that "accident" is a more scientific default than "function." He calls the reflexive rejection of function **"Darwinian Fundamentalism"** (ironically, usually aimed at the adaptationists, but he flips it).

  **C. Peter Godfrey-Smith (The Nuancer)**
  In *Complexity and the Function of Mind in Nature*, Godfrey-Smith analyzes the "Adaptationism Debate." He identifies the problem you see as a conflict over **Null Hypotheses**.
  *   **Adaptationists** treat "No Function" as the null hypothesis to be rejected.
  *   **Critics** treat "No Function" as the positive claim that needs no proof.
  *   Godfrey-Smith argues that neither should be the default. Both are positive claims requiring evidence.

  ### 3. Why the Asymmetry Exists (The "Free Pass")
  You asked why the critic gets a free pass. In the sociology of scientific knowledge, this is sometimes called **Deflationary Privilege**.

  It happens because **skepticism is conflated with rigor**.
  *   When an adaptationist says, "This trait is for X," they are making a positive claim about history.
  *   When a critic says, "This trait is an accident," it *feels* like skepticism (like saying "I don't know").
  *   But "It is an accident" is *also* a positive claim about history. It asserts a specific causal pathway (constraint/drift) over another (selection).

  Because the deflationary story feels more modest ("It's not a grand design, just a mess"), it borrows the epistemic virtue of humility without doing the work of proof.

  ### 4. How to Distinguish a "Good" Story from a "Roomy" One
  The literature suggests four specific tests to stop the "roomy explanation" problem. If your book club members can't answer these, their story (whether adaptation or byproduct) is just speculation.

  1.  **Phylogenetic Independence:** Did the trait evolve *at the same time* as the proposed pressure? If you say "we love sugar because it was scarce on the savanna," but our ancestors evolved that taste receptor 100 million years before primates existed, the story fails. (This kills many pop-psych stories).
  2.  **Engineering/Optimality:** Does the trait actually work well? If you claim a trait is an adaptation for running, but it's biomechanically terrible for running, the adaptation claim is weak. Conversely, if you claim it's a byproduct, you need to show why selection *didn't* fix the inefficiency.
  3.  **Genetic/Developmental Correlation:** For a "byproduct" story to work, you need to identify the *primary* trait that was selected for and show the mechanical linkage. "It's a spandrel of the arch" requires showing where the arch is. If the critic can't name the "arch," their "spandrel" story is just as magical as the adaptationist one.
  4.  **Novel Prediction:** This is the gold standard. A good story predicts a trait we haven't found yet. "If this is an adaptation for X, we should see Y in related species." If the story only fits what we already know, it is underdetermined.

  ### 5. A Coined Term for Your Book Club
  Since there isn't a single standard term, and you asked for one if none existed, I propose you call this move **The Deflationary Free Ride**.

  **Definition:** *The Deflationary Free Ride occurs when a critic rejects a functional explanation as unfalsifiable speculation, but offers a non-functional alternative (accident, byproduct, constraint) that is equally unfalsifiable, yet is granted higher epistemic status solely due to its deflationary tone.*

  **Edge Cases / Usage:**
  *   **Valid Use:** "You're saying disgust is a cultural accident? That's a **Deflationary Free Ride**. You've provided no evidence for the cultural mechanism, you're just assuming it's easier than evolution."
  *   **Distinction:** It is *not* a Deflationary Free Ride if the critic provides independent evidence for the constraint (e.g., "We know the genetics of this trait are linked to that trait, so it must be a byproduct"). That is a **Positive Constraint Claim**.
  *   **Economics Analogy:** "The market is efficient" (Adaptation) vs. "The market is just path-dependent regulation" (Deflation). If the regulator story is just as post-hoc ("Well, this regulation happened to be here"), it's a Free Ride.

  ### Summary for the Club
  When this happens in your meeting, you can say:
  > "We are seeing **Symmetric Underdetermination**. Both the adaptation story and the byproduct story fit the data equally well right now. Granting the byproduct story a 'skeptical' advantage is a **Deflationary Free Ride**. Until we have phylogenetic or developmental evidence, both are Just-So Stories; one is just wearing a cynic's hat."

  This moves the conversation from "Who is right?" to "What evidence would distinguish these?" which is where the actual science lives.
