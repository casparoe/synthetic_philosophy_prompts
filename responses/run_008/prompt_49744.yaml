answer: |-
  This dinner party debate is a classic clash between two major schools of decision theory, dressed up in philosophy puzzles. Dana is arguing from **Causal Decision Theory (CDT)**, while Marcus is arguing from **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**.

  Here is the breakdown of who is right about what, and the deeper structural disagreement they are dancing around.

  ### Move 1: Dana on the Coin Case (Counterfactual Mugging)
  **Dana's Claim:** The coin is already tails. The million is already gone or never existed. Paying $100 now changes nothing about the past, so it is a pure loss.
  **Verdict:** **Dana is locally right, globally wrong.**
  *   **Why she's right:** From the perspective of *now*, her causal analysis is correct. Your action cannot physically reach back in time to deposit the money. If you treat the past as fixed and independent of your current choice, paying is irrational.
  *   **Why she's wrong:** She is ignoring the **ex-ante perspective**. If you had known this scenario was possible before you were born, you would have desperately wanted to be the kind of person who pays. By refusing now, you confirm you are the kind of person who *wouldn't* have paid, meaning the million was never deposited. She is winning the battle (saving $100) but confirming she lost the war (the $1M).

  ### Move 2: Marcus on the Coin Case
  **Marcus's Claim:** You must evaluate the decision as a policy locked in before the flip. The "Payer" policy nets ~$500k in expectation; the "Refuser" policy nets $0.
  **Verdict:** **Marcus is right.**
  *   **Why:** This is the standard solution to **Parfit's Counterfactual Mugging**. Rationality isn't just about reacting to the world you find yourself in; it's about having a decision algorithm that produces good outcomes across all possible worlds you could have found yourself in. Since the predictor is perfect, your current decision *is* the prediction. By paying, you logically "cause" the past prediction to have been favorable, even if you can't causally change the past.

  ### Move 3: Marcus on the Termite Case (Eells's Problem)
  **Marcus's Claim:** In the termite scenario, the rational policy is to refuse. The "Refuser" either gets no letter (no termites) or gets a letter with real termites (but doesn't pay). The "Payer" gets scammed in the no-termite world and still has termites in the termite world.
  **Verdict:** **Marcus is right.**
  *   **Why:** This is a variant of **Eells's Problem** (or the Smoking Lesion). Here, the predictor is not rewarding your algorithm; they are exploiting a correlation.
      *   If you commit to **Pay**: In the world with *no* termites, the statement "You Pay XOR Termites" becomes True (True XOR False). The predictor sends the letter. You pay $1,000 for nothing. In the world *with* termites, the statement becomes False (True XOR True). The predictor sends *no* letter. You still have termites. Paying never saves the house; it only loses money in the safe worlds.
      *   If you commit to **Refuse**: In the world with *no* termites, the statement is False (False XOR False). No letter. You lose nothing. In the world *with* termites, the statement is True (False XOR True). Letter sent. You don't pay. You lose the house, but not the $1,000.
      *   Marcus correctly identifies that paying here has negative expected value. His theory handles this case correctly, just as it handled the Coin Case.

  ### Move 4: Dana's Critique
  **Dana's Claim:** Marcus's rule seems to be "Pay when the predictor helps you, refuse when they hurt you," which sounds like ad hoc reasoning (knowing the answer in advance).
  **Verdict:** **Dana is wrong about the theory, but right to be suspicious of the explanation.**
  *   **Why she's wrong:** It is not a coincidence or ad hoc. There is a rigorous structural difference between the two cases. In the Coin Case, the $1M deposit is **logically dependent** on your decision algorithm. In the Termite Case, the termite infestation is **independent** of your decision algorithm; only the *letter* depends on you. Marcus isn't switching rules; he is applying the same rule (maximize policy utility) to two different causal/logical structures.
  *   **Why she's right to be suspicious:** Marcus is struggling to articulate *why* the structures differ without using jargon. To Dana, it sounds like he's just rationalizing whatever outcome feels right.

  ### What Both of Them Are Missing

  The real disagreement isn't about the money or the termites; it's about **Updatelessness** and **Logical Counterfactuals**.

  1.  **The Updatelessness Divide:**
      *   **Dana (CDT)** updates on her information. She says, "I *know* the coin is tails. Given that, what should I do?" She treats the Heads branch as impossible.
      *   **Marcus (FDT/UDT)** refuses to update. He says, "I must act as the algorithm that was evaluated *before* the coin flip." He includes the Heads branch in his calculation even though he knows he isn't in it.
      *   **The Missing Insight:** They need to agree on whether rationality is about **maximizing utility in the actual world** (Dana) or **maximizing the expected utility of your source code** (Marcus). If you agree with Marcus that rationality is about the source code, both his verdicts follow necessarily. If you agree with Dana, both his verdicts look like magic.

  2.  **The Criterion of Dependence:**
      *   They are missing the specific technical condition that separates the Coin Case from the Termite Case. It is **Subjunctive Dependence**.
      *   **Coin Case:** The existence of the $1M *counterfactually depends* on your decision output. (If your algorithm outputted "Refuse", the $1M would not exist).
      *   **Termite Case:** The existence of the termites *does not* depend on your decision output. Only the letter does.
      *   Marcus is implicitly tracking this dependence, but Dana sees it as "predictor on your side." The missing piece is realizing that **predictors don't have sides**; they have **logical links**. In the Coin Case, you and the predictor are computing the same function. In the Termite Case, the predictor is computing a function that includes an external variable (termites) you cannot control.

  **Summary:** Marcus is winning on the technicalities (his theory yields higher wealth and handles both cases consistently), but Dana is winning on the intuition pump (her view aligns with standard human causality). The stalemate exists because they haven't agreed on whether "rationality" allows your current choice to logically constrain a past prediction.
