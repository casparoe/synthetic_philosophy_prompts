  2.  **Analyze Move (1): Dana's Initial Objection (Coin Case)**
      *   *Argument:* The past is fixed. The $1M is already determined. Paying $100 now yields -$100 utility. Not paying yields 0 utility. Therefore, don't pay.
      *   *Theory:* This is classic **Causal Decision Theory (CDT)**. It looks at the causal consequences of the action *now*. Since the prediction happened in the past, the current action cannot causally influence whether the $1M was deposited.
      *   *Verdict:* Dana is logically consistent within CDT. She is "right" that *given the current state*, paying loses money. However, she ignores the ex-ante perspective.

  3.  **Analyze Move (2): Marcus's Counter (Coin Case)**
      *   *Argument:* Evaluate the decision as a *policy* chosen before the coin flip.
      *   *Calculation:*
          *   Policy "Pay": 50% Heads (0 cost, $1M reward) + 50% Tails (-$100 cost, $1M reward). Expected Value (EV) $\approx$ $1M - $50.
          *   Policy "Refuse": 50% Heads (0 cost, $0 reward) + 50% Tails (0 cost, $0 reward). EV = $0.
      *   *Theory:* This is **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**. It treats the decision as the output of an algorithm that the predictor simulated. The agent "controls" the prediction by controlling their algorithm.
      *   *Verdict:* Marcus is "right" that this policy maximizes ex-ante expected utility. This is the standard rationalist solution to Counterfactual Mugging.

  4.  **Analyze Move (3): Marcus's Termite Case**
      *   *Setup:* This is **Eells's Problem** / **The Termites Problem** (often associated with Jeffrey's Decision Theory or challenges to EDT/FDT).
      *   *Logic:*
          *   If I adopt policy "Pay if asked": Predictor knows this.
              *   Scenario A (No Termites): Predictor sends letter (Statement: You Pay OR Termites). Since I pay, statement is true. I lose $1000.
              *   Scenario B (Termites): Predictor sends letter. Since I pay, statement is true (I pay). I lose $1000 + $1M termites.
