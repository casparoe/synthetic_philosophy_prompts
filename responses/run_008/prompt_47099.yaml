answer: |-
  ### 1. The "Visual Originality" Decision Procedure

  This procedure is designed to be run in under ten minutes per submission. It separates *ontological* questions (is this art?) from *normative* questions (is this good/fitting art?). Do not proceed to the next step if the submission fails the current one.

  **Step 1: The Visual Threshold**
  *   **Question:** Is the primary mode of engagement for this work visual (sight), rather than auditory, literary, or purely tactile?
  *   **Sufficient Answer:** Yes, if the work is intended to be looked at. (Video, installation, and performance documentation count. Music, poetry, or scent-only works do not).
  *   **Termination:** If **No**, mark **Ineligible**. Rationale: "Submission falls outside the 'visual art' medium requirement of the ordinance."
  *   **Hand-off:** If the work is visual but relies heavily on text to be understood (e.g., conceptual art), proceed to Step 2.

  **Step 2: The Human Agency Threshold**
  *   **Question:** Did a human being execute the final form of the work, or exercise direct creative control over its specific visual properties?
  *   **Sufficient Answer:** Yes, if the submitter can point to a specific physical or digital action they took that determined the lines, colors, or composition. (Photography counts; AI generation where the machine determines the pixels does not).
  *   **Termination:** If **No**, mark **Ineligible**. Rationale: "Submission lacks the human authorship required for 'original work' under current standards."
  *   **Hand-off:** If the work involves tools, assistants, or algorithms used as *instruments* of a human vision, proceed to Step 3.

  **Step 3: The Utility Threshold**
  *   **Question:** Does the object have a practical function outside of being viewed or contemplated?
  *   **Sufficient Answer:** No, if the object exists solely for aesthetic or intellectual engagement. (A painting has no function; a chair, a garment, or a blanket has a function).
  *   **Termination:** If **Yes** (it is functional), mark **Ineligible**. Rationale: "Submission is a functional object (craft/design) rather than a visual art work."
  *   **Hand-off:** If the object is non-functional, or if the function is secondary to the artistic statement, proceed to Step 4.

  **Step 4: The Curatorial Hand-off (Value Judgment)**
  *   **Question:** Is this the *kind* of art this exhibition exists to show?
  *   **Guidance:** This is where you stop asking "Is it art?" and start asking "Is it *our* art?" Consider quality, theme, community relevance, and diversity of medium.
  *   **Termination:** This step requires a vote. If the majority votes "No," mark **Ineligible**. Rationale: "While eligible as visual art, the work does not align with the current cycle's curatorial priorities."
  *   **Note:** Rejections here are matters of taste, not fact. These are the most vulnerable to appeals.

  ***

  ### 2. Philosophical Trade-offs and Expected Misfires

  **Distinctions Survived:**
  *   **Intentionality (Danto/Dickie):** Step 2 and 4 rely on the idea that art requires an agent intending to make art. We rejected the "anything can be art" anti-essentialist view because a municipal ordinance requires boundaries.
  *   **Aesthetic vs. Practical (Kant):** Step 3 enforces a distinction between "disinterested contemplation" (art) and "interested use" (craft). This is the oldest filter in Western aesthetics.
  *   **Authorship (Locke/Copyright):** Step 2 aligns with legal notions of originality, protecting the city from IP liabilities.

  **Distinctions Dropped:**
  *   **Family Resemblance (Wittgenstein):** We did not ask "Does this look like other art?" This prevents the jury from simply replicating past biases but makes Step 4 harder to define.
  *   **Institutional Theory:** We did not define art as "whatever the jury selects." That would make the procedure circular. We assume art exists *before* the jury sees it.
  *   **Beauty/Quality:** Explicitly removed from Steps 1–3. A ugly work is still eligible art.

  **Expected Misfires:**
  *   **The "High Craft" Error:** Step 3 will reject exceptional ceramics, furniture, or quilts that function as art but retain utility. This is a known failure mode of the "Utility Threshold."
  *   **The "AI-Hybrid" Error:** Step 2 struggles with works where a human edits AI output. The binary "Yes/No" on human agency may be too blunt for emerging tech.
  *   **The "Conceptual" Friction:** Step 1 may confuse jurors on text-based or instruction-based works (like the certificate case below), requiring them to trust art history over their eyes.

  ***

  ### 3. Worked Applications

  **Case A: The AI-Generated Image**
  *   *Submission:* An image generated by Midjourney. Submitter claims the *prompt* is the artwork and the image is the documentation.
  *   *Procedure Run:*
      *   Step 1 (Visual): **Pass.** The image is visual.
      *   Step 2 (Human Agency): **Fail.** The submitter did not execute the visual form; the algorithm did. Even if the prompt is the "art," the submission is an image, not a text. If the submission were the text of the prompt, it would fail Step 1 (Literary, not Visual).
      *   *Verdict:* **Ineligible.**
      *   *Rationale:* "The visual form was not executed by human hand, failing the originality requirement."

  **Case B: The Narrative Quilt**
  *   *Submission:* A hand-stitched quilt depicting local history. (You personally admire this work).
  *   *Procedure Run:*
      *   Step 1 (Visual): **Pass.** It is meant to be looked at.
      *   Step 2 (Human Agency): **Pass.** Hand-stitched by the guild.
      *   Step 3 (Utility): **Fail.** A quilt is, by definition, a bed covering. It has a practical function (warmth/bedding) independent of its narrative content.
      *   *Verdict:* **Ineligible.**
      *   *Rationale:* "Submission is a functional textile object. While artistically significant, it falls under craft/design rather than visual art per the utility threshold."
      *   *Note:* This is the conclusion you indicated you would not like. The procedure prioritizes the definition of "Visual Art" over personal admiration or the "Art vs. Craft" political debate.

  **Case C: The Conceptual Certificate**
  *   *Submission:* A typed certificate and instructions directing the buyer to spend one hour in the gallery with the lights off.
  *   *Procedure Run:*
      *   Step 1 (Visual): **Pass.** The certificate is a visual object; the instruction creates a visual experience (darkness).
      *   Step 2 (Human Agency): **Pass.** The artist conceived the instruction.
      *   Step 3 (Utility): **Pass.** The certificate has no function other than to convey the art idea.
      *   Step 4 (Curatorial): **Hand-off.** Does this fit our exhibition?
      *   *Verdict:* **Eligible** (Subject to Step 4 vote).
      *   *Rationale:* "Work falls within the tradition of conceptual visual art. Eligibility confirmed; curatorial fit to be determined by jury vote."

  ***

  ### 4. Limitations: What This Procedure Cannot Do

  1.  **It cannot distinguish "Bad Art" from "Eligible Art."** A technically poor painting passes Steps 1–3. If the jury rejects it, they must own that rejection as a matter of *taste* (Step 4), not *eligibility*. This protects you from accusations of not knowing what art is, but exposes you to accusations of snobbery.
  2.  **It cannot resolve political pressure.** If the Mayor calls to demand the quilt be accepted, this procedure gives you the cover to say "The rules say no," but it cannot stop the Mayor from changing the rules.
  3.  **It cannot handle "Hybrid" Media cleanly.** A 3D-printed vase that is never used as a vase sits on the razor's edge of Step 3. The procedure forces a binary choice where the art world often sees a spectrum.

  ***

  ### 5. Epistemic Confidence Statement

  **Least Confident Step:** **Step 3 (The Utility Threshold).**
  *   **Reasoning:** The distinction between "Art" and "Craft" is historically contingent and culturally loaded. In 1900, a quilt was never art. In 2000, a quilt in a museum is art. By hard-coding "Utility = Ineligible," we are making a philosophical claim that may be outdated.
  *   **Failure Mode:** This step will fail if we receive a submission that is *functionally useless* but *crafted like a tool*. For example, a chair made of glass that no one can sit on. Is it a chair (Ineligible) or a sculpture (Eligible)? The procedure forces a judgment call that pretends to be factual. If we start getting appeals arguing "It's a sculpture of a chair, not a chair," Step 3 is collapsing.

  ### 6. Falsification Conditions: What Would Change My Mind

  I would consider this procedure flawed and in need of redesign if:

  1.  **The "Appeal Inversion" Rate exceeds 30%.** If the Full Commission overturns the Jury's "Ineligible" verdicts on more than 3 out of 10 rejected cases, it suggests the procedure is defining "Art" more narrowly than the City's governing body intends. This is evidence *against* the procedure.
  2.  **The "Appeal Affirmation" Rate on Quality is low.** If the Commission overturns "Eligible" verdicts (where the Jury voted No in Step 4) frequently, it suggests the Jury is using Step 4 to hide eligibility biases. However, if the Commission *upholds* the Jury's Step 4 rejections, that is evidence *for* the procedure, as it confirms that "Curatorial Fit" is a valid discretionary power.
  3.  **Systematic Exclusion.** If, after two years, demographic data shows that Step 3 (Utility) disproportionately rejects work from specific cultural traditions (e.g., indigenous weaving, functional ceramics from specific cultures) while accepting Western-style painting, the procedure is encoding cultural bias as philosophical rule. In that case, Step 3 must be abolished, and "Utility" moved to a Curatorial Consideration (Step 4) rather than an Eligibility Barrier.

  **On Appeals as Evidence:**
  Accumulating a record of appeals overturning the procedure's verdicts should be treated as **evidence against the procedure** *only if* the appeals are based on eligibility criteria (Steps 1–3). If the appeals are based on "This should have been shown" (Step 4), that is not a failure of the procedure; it is the appellate body exercising its right to differ on values. The procedure is designed to isolate facts (1–3) from values (4). If the data shows the Commission is fighting us on facts, our fact-finding tool is broken. If they are fighting us on values, the system is working as designed.
