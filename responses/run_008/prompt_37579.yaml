  Here are four distinct readings of the slogan, ranked by strength:

  1.  **Anatomical:** Denies a single neural locus where processing converges. *Verdict:* Trivial and empirically plausible. Fails to dismiss GWT; Baars specifies a functional architecture distributed across cortex, not a single neuron cluster.
  2.  **Temporal:** Denies a definitive moment when content becomes conscious. *Verdict:* Plausible (Dennett's Multiple Drafts). Challenges GWT only if it insists on sharp temporal boundaries for "broadcasting," which many variants avoid.
  3.  **Homuncular:** Denies an inner observer viewing the display. This targets the regress: if consciousness requires viewing, the viewer needs its own theater. *Verdict:* Plausible. Doesn't dismiss GWT; the "audience" is blind subsystems. The regress only bites if the observer is explained in the same conscious terms, which GWT need not claim.
  4.  **Ontological:** Denies any objective fact about whether content is conscious. *Verdict:* Strong and controversial (illusionism). Would dismiss GWT, but only by rejecting the phenomenon GWT aims to explain, changing the subject rather than refuting the mechanism.
