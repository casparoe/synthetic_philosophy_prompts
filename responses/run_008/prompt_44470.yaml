answer: |-
  You have identified a genuine and structurally significant feature of how language and logic handle vagueness. You are correct that standard discussions of the Sorites paradox focus on the *existence* of the boundary (or the lack thereof), whereas you are pointing at the *internal rules of conduct* that remain in force even when the boundary is admitted to be missing.

  Here is the carving you requested.

  ### 1. The Established Name
  The phenomenon has an established name in the philosophy of language, though it is technical and rarely escapes academic circles. It is called **Penumbral Connections**.

  The term was introduced by the philosopher Kit Fine in his seminal 1975 paper *"Vagueness, Truth and Logic."* Fine argued that while a single borderline statement (e.g., "This sample is red") might lack a definite truth value, *relationships* between statements in the penumbra (the gray zone) do not. 

  *   **Your Example 3 (City/Town):** Fine's classic example is exactly this. "This is a city and this is not a city" is false, even if "This is a city" is borderline. The connection between the two halves creates a constraint that survives the vagueness of the individual terms.
  *   **Your Examples 1 & 2 (Ordering):** Fine and subsequent logicians extended this to relations. If sample A is redder than sample B, you cannot consistently assert "B is red" and "A is not red." The logical connection preserves the ordering of the underlying physical property (wavelength, height) even within the zone where the label itself is shaky.

  **Why this term might feel insufficient:** "Penumbral Connections" describes the *semantic* truth conditions (why the sentence is false). You are describing the *pragmatic* or *procedural* consequence (why the lab treats it as an error). For a general readership, "Penumbral Connections" is opaque. Therefore, while that is the historical tag, I recommend adopting a more functional term for your writing that captures the normative force you observed.

  **Recommended Term:** **Borderland Coherence**.

  ### 2. Defining Borderland Coherence
  To make this useful for your reporting, here is a precise definition designed to handle contested cases.

  **Definition:** *Borderland Coherence* is the constraint that requires judgments involving vague predicates to remain logically consistent with one another within a single context of assessment, even when individual judgments are admitted to be indeterminate.

  **The Three Carving Rules:**
  1.  **Non-Contradiction:** You cannot assert both $P$ and not-$P$ of the same subject in the same context (e.g., "Both a city and a town" if the categories are mutually exclusive).
  2.  **Monotonicity:** If property $X$ supervenes on a measurable scale (height, wavelength, pollution ppm), judgments of $P$ must not decrease as $X$ increases. (You cannot call the shorter prospect "tall" and the taller one "not tall.")
  3.  **Context Relativity:** Coherence is enforced *within* a framework, not *across* frameworks.

  **Handling the Regulatory Case (Your Contested Case):**
  You asked if this extends to rules that hold only relative to a purpose (e.g., pollution readings). 
  *   **Verdict:** Yes, Borderland Coherence applies *within* the regulatory regime, but not *across* them.
  *   **Application:** If the EPA defines "elevated" with a vague threshold, you cannot have Sample A (higher pollution) labeled "not elevated" and Sample B (lower pollution) labeled "elevated" *under EPA rules*. That violates Monotonicity. 
  *   **However:** You *can* have Sample A labeled "elevated" by the EPA and "not elevated" by OSHA. This is not a violation of Borderland Coherence; it is **Context Dependence**. The context has shifted, so the penumbra has shifted with it.

  **The Boundary with Ordinary Context-Dependence:**
  *   **Context-Dependence** moves the gray zone. (e.g., "Tall" means one thing for a jockey, another for a basketball player).
  *   **Borderland Coherence** governs the moves inside the gray zone once the context is fixed. (e.g., Once we are talking about basketball players, you can't call a 6'5" player short and a 6'6" player tall).

  ### 3. Relation to the Sorites Paradox
  You asked if the familiar Sorites premise ("Removing one grain does not turn a heap into a non-heap") is one of these in-between constraints.

  **It is the engine that creates them.**
  The Sorites premise is a statement of **Tolerance**: the idea that a sufficiently small change in the underlying property cannot change the category. 
  *   **The Paradox:** If you chain Tolerance premises together (1 grain doesn't matter, 2 grains don't matter...), you eventually prove that 1 grain is a heap, which is absurd.
  *   **Your Observation:** Borderland Coherence is the *local enforcement* of Tolerance that prevents the paradox from becoming a practical error. The lab knows that if they accept Tolerance locally (sample 42 and 43 should get the same label), they must not violate it globally (sample 42 and 68 cannot flip-flop). 

  In essence, the Sorites paradox exploits the fact that Tolerance cannot hold *globally* across a whole spectrum. Borderland Coherence is the rule that says Tolerance *must* hold *locally* between neighbors to maintain intelligibility. The lab rejects the "Red, Not-Red, Red" sequence because it violates the local Tolerance that makes the grading system usable, even if they can't say exactly where Red stops.

  ### Summary for Your Readership
  If you are writing for a general audience, "Penumbral Connections" will stall them. "Borderland Coherence" invites them in. 

  You can describe it this way: 
  > "We accept that some concepts have fuzzy edges. But we do not accept that the fuzziness allows us to be contradictory. There are guardrails in the gray zone. You can't stand in the fog and claim to be both North and South of the same line. This constraint—**Borderland Coherence**—is what keeps vague language from collapsing into nonsense."

  This captures the procedural error you saw in the lab, the sports reporting mistake, and the logical contradiction of the municipality, while distinguishing them from cases where the rules themselves change (regulatory contexts).
