          4.  *Crucial Constraint:* The user rejects the "Non-Identity Problem" / "Repugnant Conclusion" style reasoning. They do *not* believe that merely possible future people have a claim to exist. "More happy people is better" seems crazy to them.
          5.  *Comparison:* 8 billion deaths now (extinction) feels worse than 8 billion deaths spread over centuries (normal turnover).
      *   **The Contradiction:** If possible people don't matter, why does the *absence* of future people (extinction) matter so much?
      *   **Goal:** Find a principle that reconciles these intuitions or advise on which intuition to discard.

