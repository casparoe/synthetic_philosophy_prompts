      *   Analogy: Burning a library. It's not that specific future readers are harmed (they don't exist), it's that the *source* of meaning is gone.
      *   This distinguishes between *welfare* (individual happiness) and *significance* (the ongoing project).

  5.  **Developing the Second Candidate: "The Person-Affecting Restriction + The Last Generation"**
