  6.  **Developing the Third Candidate: "Narrative Unity" (Samuel Scheffler / Samuel Scheffler's "Death and the Afterlife")**
      *   Scheffler argues that we care about the "collective afterlife." Our current activities derive meaning from the assumption that humanity continues.
      *   This explains the "stopping long projects" intuition perfectly.
