  **Final Credence: 0.72 (72%) that Free-Floating Rationales exist in the robust sense.**

  I am committing to the side that selection creates genuine, mind-independent normative facts, provided "normativity" is naturalized as conditional success conditions rather than moral obligations.

  ### Decomposition

  1.  **Probability normativity can exist with no norm-poser:** **0.75**
      *   *Justification:* Hypothetical imperatives (if goal G, then action A) are objective causal relations that do not require a conscious agent to validate the conditional.

  2.  **Probability function facts must be etiological:** **0.90**
      *   *Justification:* A trait's rationale is defined by why it was selected (history), not merely what it currently does, otherwise a heart's function could be making noise.

  3.  **Probability 'ought' is stronger than 'fitness-enhancing':** **0.55**
      *   *Justification:* 'Ought' implies a specific counterfactual constraint on design space that mere statistical fitness descriptions do not fully capture.

  4.  **Probability rationales are independent of predictive vocabulary:** **0.68**
      *   *Justification:* The causal topology of the problem/solution exists in the environment/organism interface regardless of whether an observer adopts the intentional stance.

  ### Synthesis
  I derive the final **0.72** by taking a weighted average where the etiological and norm-poser terms (the metaphysical backbone) carry 40% weight each, and the semantic terms ('ought' strength and vocabulary independence) carry 10% each, reflecting that the reality of the causal history matters more than the linguistic label we slap on it.

  ### Least Confident Term
  **Term:** Probability 'ought' is stronger than 'fitness-enhancing' (**0.55**).

  **What would move it:** A rigorous demonstration that biological "malfunction" (e.g., a heart failing to pump) is ontologically distinct from "statistical rarity" (e.g., a heart beating at an unusual rhythm that doesn't reduce replication), perhaps via a causal role analysis that survives the collapse of selection history. If malfunction is just low fitness, this credence drops to 0.10 and the whole FFR robustness claim collapses into instrumentalism.
