answer: |-
  ### Brainstorming Diagnostic Cases

  To build a decision tree that sorts intuitions rather than labels, we need cases that act as "stress tests" for specific ontological commitments. A case is **load-bearing** if answering it forces a commitment that ripples through the rest of the system; it is **decorative** if it merely adjusts boundary conditions without changing the underlying logic.

  1.  **Scattered Atoms (Andromeda):** This is the primary stress test for *Universalism*. If you accept composition here, spatial continuity and causal connection are irrelevant. If you reject it, you are a *Restrictivist*. This is load-bearing because it splits the logical space in half immediately.
  2.  **The Deck of Cards:** This tests *Human Intent*. If scattered atoms don't compose, but arranged cards do, your restriction condition relies on external agency or function. This separates *Naturalists* (only nature makes objects) from *Artifact Realists*.
  3.  **The Cat and Its Tail:** This is a subtle but load-bearing test for *Organicism*. Many agree "the cat" exists. But does "the tail" exist as an object distinct from the cat? Peter van Inwagen says no (only living simples exist); others say yes. This separates *Strict Organicism* from *Moderate Restriction*.
  4.  **The Sand Heap:** This tests *Vagueness*. If composition is real, is there a precise grain count where a heap begins? If you say "no precise count but still a heap," you lean toward *Conceptualism* or *Epistemicism*. If you say "the question has no answer," you lean toward *Nihilism* or *Brutalism*.
  5.  **Hand on Desk:** This tests *Contact*. Historically, many thought contact was sufficient. Modern metaphysics largely rejects this (why is contact special?). Accepting this leads to *Contact Theory*; rejecting it forces you to find a deeper principle (life, function, bond).
  6.  **The Crowd:** This tests *Functional Unity* vs. *Biological Life*. A crowd moves as one but isn't alive. If you accept the crowd as an object but reject a random pile of rocks, you are a *Functionalist*. If you reject the crowd but accept the cat, you are a *Biological Organacist*.
  7.  **The Ship (Rebuilt):** While often used for identity, for composition it asks: Do the *current* planks compose the ship? If you say "No, the ship is the original planks," you deny that composition is sufficient for identity, or you deny the current planks compose anything. This separates *Constitution View* from *Identity View*.
  8.  **The Alien Rule (Brutalism):** Is the rule for composition knowable? If you think composition happens but no human concept (life, contact, function) captures it, you are a *Brutalist*. This is load-bearing because it admits ontological reality while surrendering explanatory power.

  ---

  ### Decision Tree: Which View of Composition Do You Hold?

  **Instructions:** Start at **Node 1**. Answer the question based on your immediate intuition about the case described. Follow the arrow corresponding to your answer. Do not worry about the names of the views until you reach a leaf.

  **Node 1: The Existence Gate (Case: Your Body)**
  Consider the atoms currently composing your body. Do those atoms, taken together, compose a further object (namely, *you*)?
  *   **No:** There are only atoms. "You" are a convenient fiction. → **Go to Leaf A**.
  *   **Yes:** There are composite objects. → **Go to Node 2**.

  **Node 2: The Universality Gate (Case: Atoms to Andromeda)**
  Consider a set of atoms: one in your left shoe, one in the Eiffel Tower, and one on Neptune. Do those specific atoms, and nothing else, compose a further object?
  *   **Yes:** Composition occurs regardless of distance or connection. → **Go to Leaf B**.
  *   **No:** Composition requires some specific relationship between the parts. → **Go to Node 3**.

  **Node 3: The Contact Gate (Case: Hand on Desk)**
  Consider your hand resting physically on this desk. Does the contact alone make your hand and the desk compose a single object ("Hand-Desk")?
  *   **Yes:** Physical contact is sufficient for composition. → **Go to Leaf C**.
  *   **No:** Contact is not enough; they must be bonded or unified in some deeper way. → **Go to Node 4**.

  **Node 4: The Life Gate (Case: Cat vs. Tail)**
  Consider a living cat. You agree the cat is an object. Now consider just the cat's tail. Is the tail *also* an object in its own right, or is it merely "simples arranged tail-wise" that only exist as part of the cat?
  *   **The tail is not an object:** Only the whole living organism exists; its proper parts do not exist as objects. → **Go to Leaf D**.
  *   **The tail is an object:** Living things compose objects, but their parts can also be objects if they are sufficiently unified. → **Go to Node 5**.

  **Node 5: The Function Gate (Case: The Crowd)**
  Consider a crowd of people at a crosswalk. When the light changes, they move as one unit. Do they compose an object ("The Crowd") in a way that a random pile of rocks does not?
  *   **Yes:** Functional coordination is sufficient for composition. → **Go to Leaf E**.
  *   **No:** Function isn't enough; it requires biological life or human intention. → **Go to Node 6**.

  **Node 6: The Artifact Gate (Case: Deck of Cards)**
  Consider a deck of cards stacked neatly versus scattered across a table. Does the stacked deck compose an object in a way the scattered cards do not?
  *   **Yes:** Human arrangement/intent can create composition. → **Go to Leaf F**.
  *   **No:** Human intent doesn't change ontology; only natural bonds matter. → **Go to Node 7**.

  **Node 7: The Vagueness Gate (Case: Sand Heap)**
  Consider a pile of sand being assembled grain by grain. Is there a specific number of grains *n* such that *n* grains compose a heap, but *n-1* do not?
  *   **Yes:** There is a sharp cutoff, even if we can't know it. → **Go to Leaf G**.
  *   **No:** The question has no determinate answer; composition is vague or brute. → **Go to Node 8**.

  **Node 8: The Knowability Gate (Case: Alien Rule)**
  You believe composition is restricted (not everything composes), but you reject life, contact, and function as the rule. Is the actual rule for composition something humanly comprehensible?
  *   **Yes:** There is a principled rule we just haven't found. → **Go to Leaf H**.
  *   **No:** Composition is a brute fact; there is no deeper explanation. → **Go to Leaf I**.

  ---

  ### The Leaves (Classification of Views)

  *   **Leaf A: Nihilism.** (Defended by Peter van Inwagen [early], Trenton Merricks). Only simples exist. No tables, no cats, no people.
  *   **Leaf B: Universalism (Unrestricted Composition).** (Defended by David Lewis, Ted Sider). Every collection of objects composes a further object. "Trout-turkeys" exist.
  *   **Leaf C: Contact Theory.** (Historically common, rarely defended now). Composition occurs when objects touch. *Marked as largely unoccupied in contemporary metaphysics.*
  *   **Leaf D: Strict Organicism.** (Defended by Peter van Inwagen [later]). Only living organisms exist. No tails, no ships, no decks of cards.
  *   **Leaf E: Functionalism.** (Defended by some cognitive scientists, less common in pure metaphysics). Causal interaction or functional unity suffices.
  *   **Leaf F: Moderate Restriction (Artifact Realism).** (Common sense view). Living things and human-made artifacts exist; random heaps do not.
  *   **Leaf G: Brutal Composition (Epistemicist).** (Defended by Ted Sider in some contexts). Composition is restricted, there is a sharp cutoff, but it is brute/fundamental.
  *   **Leaf H: Moderate Restriction (Naturalist).** Composition depends on natural bonds (chemical, physical) but not necessarily life.
  *   **Leaf I: Brutal Composition (Ontological).** (Defended by some neo-Aristotelians). Composition happens, but there is no non-circular condition for it.

  **Instrument Blind Spots (Conflations):**
  *   **Leaf F vs. Leaf E:** The tree distinguishes *Human Intent* (Cards) from *Functional Coordination* (Crowd). However, some views treat these as identical (both are "functional"). If you answered "Yes" to both, you land in F, but you might actually be an E-theorist who thinks crowds count. The tree forces a choice based on the *source* of the function (human vs. emergent).
  *   **Leaf G vs. Leaf I:** Both are forms of Brutalism. G suggests the brute fact includes a sharp cutoff (Epistemicism); I suggests the brute fact might not even have a sharp cutoff we can speak of. The tree separates them based on the Sand Heap question, but in practice, these views often overlap significantly.
  *   **Leaf D vs. Leaf A:** Both deny the existence of artifacts. The distinction is whether *organisms* exist. If you are uncomfortable with "organisms" being fundamentally different from "atoms," you might oscillate between these.

  ---

  ### Unoccupied Regions of the Logical Space

  In software terms, these are "unreachable code" or "runtime errors" in the ontology.

  1.  **Universalism + Brutalism:** You cannot hold that *every* collection composes an object (Universalism) and that composition is a *restricted brute fact* (Brutalism). This combination is **incoherent**; the definitions contradict.
  2.  **Nihilism + Artifact Realism:** You cannot hold that *no* composites exist (Nihilism) while also believing decks of cards are real objects. This is **incoherent**.
  3.  **Contact Theory + Scattered Atoms:** You cannot hold that contact is required (Node 3 Yes) while believing scattered atoms compose (Node 2 Yes). This is **incoherent**.
  4.  **Strict Organicism + Tail Realism:** You cannot hold that *only* organisms exist (Leaf D) while believing the tail is an object (Node 4 path to Node 5). This is **incoherent**.
  5.  **Vague Composition + Sharp Cutoff:** You cannot answer "No" to the Sand Heap (it's vague) and then claim there is a specific number *n* (Leaf G). This is **incoherent**.
  6.  **Functionalism + No Life/Artifacts:** It is theoretically possible to believe crowds exist (Function) but cats do not (No Life) and cards do not (No Artifacts). This region is **unexplored/unattractive**. It implies biological life is ontologically less significant than temporary crowd movement, which reverses standard intuition without clear gain.
  7.  **Conceptualism + Mind-Independent Restriction:** Many engineers (like you) suspect composition is "user-defined." Metaphysics generally treats existence as mind-independent. A view that says "Composition is restricted, but the restriction depends on human concepts" is **unexplored** in analytic ontology (though common in Continental philosophy or Carnapian pragmatics). It is often dismissed as "changing the subject" from existence to language.

  ---

  ### Execution: Running the Engineer Through the Tree

  Let us trace your profile based on your description: *"Composite should work like a user-defined type — real if some rule makes it real, arbitrary-but-harmless if it's just a convention."*

  1.  **Node 1 (Body):** You likely say **Yes**. As an engineer, you model systems. You are a system. To deny your own existence is to throw an exception in the root module. → *Proceed to Node 2.*
  2.  **Node 2 (Andromeda):** You likely say **No**. A type `ShoeTowerNeptune` has no schema, no validation rule, and no utility. It is not a valid type. → *Proceed to Node 3.*
  3.  **Node 3 (Hand/Desk):** You likely say **No**. Touching two variables together doesn't instantiate a new struct. There is no bond. → *Proceed to Node 4.*
  4.  **Node 4 (Cat/Tail):** This is your wobble point. In code, a `Cat` object might contain a `Tail` property. Is the `Tail` itself an object? If you follow strict encapsulation, the `Tail` is only accessible via the `Cat`. However, your instinct for "user-defined types" suggests if you can define `Tail`, it exists. But you also said "real if some rule makes it real." The biological rule makes the Cat real. Does it make the Tail real? Let's assume you lean toward **The tail is an object** (modularity). → *Proceed to Node 5.*
  5.  **Node 5 (Crowd):** You likely say **No**. A crowd is a transient state, not a type. Unless you define a `Crowd` class with specific methods, it's just a `List<Person>`. → *Proceed to Node 6.*
  6.  **Node 6 (Cards):** You likely say **Yes**. A deck is a valid data structure. It has invariants (52 cards, specific suits). It is "real if some rule makes it real." → *Proceed to Leaf F.*

