answer: |-
  This is a precise and deeply consequential question that cuts to the methodological core of health economics. You have identified the friction between the *axiomatic structure* of Cost-Effectiveness Analysis (CEA) and the *reflective equilibrium* of actual health policy.

  To answer this, we must distinguish between CEA as a **measurement technology** (which is theoretically agnostic) and CEA as a **decision rule** (which carries heavy normative baggage). The inconsistency you observe arises because HTA agencies employ the measurement technology of welfarism but apply a decision rule that is politically constrained utilitarianism, patched with deontological side-constraints.

  Here is the reconstruction of the implicit theory, the strict presuppositions, and the verdict on the orphan-drug anomaly.

  ---

  ### 1. The Axiomatic Core: What Base-Case CEA Presupposes

  The standard base-case analysis (maximize $\sum \text{QALYs}$ subject to a budget constraint) does not strictly presuppose Classical Utilitarianism in the philosophical sense, but it does presuppose a specific subset of **Welfarist Consequentialism**.

  Specifically, the practice commits to three axioms:

  1.  **Outcome Welfarism (Extra-Welfarist Variant):** The only thing of value is health outcomes (measured as QALYs). While QALYs are derived from preferences (welfarist origin), the *evaluation* treats health as the sole good, ignoring utility derived from non-health sources (e.g., anxiety reduction, autonomy). This is the Brouwer/O'Brien "extra-welfarist" stance.
  2.  **Constant Marginal Social Value of Health:** A QALY gain is valued equally regardless of who receives it. Formally, if the Social Welfare Function (SWF) is $W = \sum f(h_i)$, base-case CEA assumes $f'(h) = k$ (a constant). This rules out Prioritarianism (where $f''(h) < 0$) and Utilitarianism with diminishing marginal utility of health.
  3.  **Strong Separability:** The value of a health gain to person $A$ is independent of the health status of person $B$, except insofar as they compete for budget. There are no interdependent utilities or fairness constraints embedded in the metric itself.

  **Verdict on Theory of Value:**
  The practice presupposes **Sum-Ranking of Health**. It is not strictly Utilitarianism because it ignores non-health utility. However, regarding the *distribution* of health, it is structurally identical to Act Utilitarianism. It treats persons as "containers" for health units.

  ### 2. The Utility Monster: Empirical Bound vs. Normative Cap

  You ask whether the practice presupposes that utility monsters don't exist. In the context of QALYs, this requires distinguishing between the *scale* and the *budget*.

  **The Empirical Bound:**
  The QALY scale is inherently bounded (typically 0 = dead, 1 = perfect health, though negative states are possible). Unlike Nozick's utility monster, who can absorb infinite utility, a patient cannot absorb infinite QALYs. There is a biological ceiling on life expectancy and health quality. Therefore, the **mathematical possibility** of a single individual absorbing the entire social welfare function is empirically nullified by the measurement instrument itself.

  **The Normative Cap:**
  However, the "monster" in HTA is not a utility absorber but a **budget absorber**. A treatment for a rare disease might offer 5 QALYs to one person but cost £5 million. Under strict sum-ranking, if the budget allows, this should be funded before a treatment offering 4 QALYs to 1,000 people (if the total QALYs were higher, though usually, the cost-per-QALY threshold prevents this).

  The existence of a cost-per-QALY threshold (e.g., £30,000) acts as a **normative cap on the marginal value of health**. It asserts: *"No matter how much health you produce, if it costs more than $X$ per unit, it is not worth it."*

  **Is this smuggled in?**
  Yes. The threshold is not derived from the QALY metric; it is derived from **opportunity cost** (the health displaced elsewhere in the system). By imposing a threshold, the agency implicitly rejects pure sum-ranking in favor of **Constrained Maximization**. They are not maximizing health *simpliciter*; they are maximizing health subject to a shadow price. This is consistent with Utilitarianism under scarcity, *but* the refusal to raise the threshold for high-severity cases (in the base case) reveals a commitment to **Efficiency over Equity**.

  ### 3. Where the Practice is Underdetermined

  There are specific conditions under which the base-case CEA ranking is consistent with multiple theories of value. The practice is underdetermined when:

  1.  **Baseline Health is Equal:** If all candidates for treatment have identical baseline health severity, Prioritarianism (weighting gains to the worse off) and Utilitarianism (sum-ranking) yield identical rankings. The divergence only appears when baseline severity varies.
  2.  **No Budget Binding:** If the budget is not binding, any theory that values health positively (Utilitarian, Prioritarian, Sufficientarian) agrees on funding all cost-effective interventions. The conflict arises only at the margin.
  3.  **Risk Neutrality:** The standard QALY model assumes risk neutrality over life years. If the social planner is risk-averse regarding health distribution (which Prioritarianism implies), the rankings would differ. Base-case CEA assumes the social planner is risk-neutral regarding the *distribution* of health, even if individuals are risk-averse regarding their *own* health.

  **Crucially:** The base case does not merely "fit well" with Utilitarianism; it **actively excludes** Prioritarianism and Sufficientarianism by assigning an equity weight of 1.0 to all QALYs. It is not underdetermined on this point; it is a deliberate choice to ignore distributional characteristics in the base metric.

  ### 4. The Orphan Drug Carve-Out: Ad Hoc or Principled?

  The rare-disease pathways (e.g., NICE's Highly Specialised Technologies, ICER's modified frameworks) acknowledge that the base-case SWF is misspecified. To make this principled rather than ad hoc, you must modify the objective function.

  You have three theoretical options to reconcile the exception:

  1.  **Distributional CEA (DCEA):** Explicitly introduce equity weights into the SWF.
      $$W = \sum w_i \cdot \Delta QALY_i$$
      Where $w_i$ is a function of severity, rarity, or lack of alternatives. This preserves the CEA framework but abandons the "QALY is a QALY" axiom.
  2.  **Hybrid MCDA (Multi-Criteria Decision Analysis):** Admit that QALYs are not the sole value. Add criteria for "innovation," "unmet need," or "solidarity." This abandons the single-metric maximization model entirely.
  3.  **Per-Person Ceiling (Sufficientarianism):** Impose a constraint that no individual can be denied treatment if it brings them above a certain health threshold, regardless of cost-effectiveness. This is a deontological side-constraint on the utilitarian maximization.

  **What would have to change?**
  To make the orphan exception principled, agencies would have to admit that the **threshold is not a measure of opportunity cost alone, but a measure of social willingness-to-pay for equity.** Currently, the threshold is presented as an efficiency metric (health forgone elsewhere). The orphan exception reveals it is actually a **political price**. Making it principled requires moving from *Cost-Effectiveness Analysis* to *Cost-Value Analysis*, where "Value" includes distributional weights.

  ### 5. The Verdict: Was the Official Theory Ever the Real One?

  **No.** The official theory (Sum-Ranking of QALYs) was never the operative theory of value. It was a **heuristic for transparency.**

  The inconsistency you observe is not a failure of logic but a feature of **Institutional Consequentialism**.
  *   **The Official Theory:** Acts as a "public reason." It provides a defensible, quantitative baseline that prevents arbitrary decision-making and controls costs. It assumes the "Utility Monster" is kept at bay by the bounded nature of health and the budget threshold.
  *   **The Real Theory:** Is a **Reflective Equilibrium** between Efficiency (Utilitarianism) and Solidarity (Prioritarianism/Deontology).

  The rare-disease exceptions do not show that the theory is "wrong"; they show that the theory was always a **partial equilibrium model**. It models the efficiency constraint accurately but omits the equity constraint until political pressure forces it back in via carve-outs.

  **Conclusion for your Dissertation:**
  You can argue that QALY-based CEA presupposes **Sum-Ranking of Health under Constrained Resources**, but it relies on an **empirical fiction** that health gains are sufficiently distributed and bounded that distributional weights are unnecessary. The orphan-drug pathway exposes this fiction.

  To resolve this without abandoning CEA, you must advocate for **Distributional CEA**. You do not need to abandon cost-effectiveness; you need to abandon the claim that the *cost-per-QALY ratio* is a sufficient statistic for social value. The ratio measures efficiency; the decision rule must incorporate equity. The "inconsistency" is simply the market price of admitting that the base-case SWF was too narrow to capture the social objective function.

  **Recommendation:** Frame the orphan-drug exception not as a violation of the theory, but as a **revealed preference** for a non-linear Social Welfare Function. The agencies are behaving like implicit Prioritarians who are constrained by a Utilitarian accounting system. Your work can formalize the weights that would make the orphan decisions consistent with the base-case decisions, thereby reconstructing the *true* implicit SWF of the HTA agency.
