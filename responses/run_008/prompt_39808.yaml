  8.  **Final Polish:** Check against the prompt's specific constraints (no bibliography, prep sheet format, specific audience mix). Ensure the "Soft Spot" flags are honest.

  *(Self-Correction on the "Worse Question"):* The user asked: "tell me if there's a worse one I havent thought of." The "Arbitrary System Capacity" objection is the standard Cummins critique. It undermines the objectivity of the dysfunction claim. I will present this as the "System-Individuation" problem.

  9.  **Final Review of the Output:** Looks solid. Matches the persona of a seasoned hand giving advice to a colleague.

