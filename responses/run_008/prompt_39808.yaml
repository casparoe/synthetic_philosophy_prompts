answer: |-
  # WORKSHOP PREP SHEET: Causal-Role Function in Medicine
  **Context:** 25-person workshop. Philosophy of Medicine/Biology mix.
  **Your Position:** Causal-Role (Cummins) for clinical function; Normativity from Patient Values (not Evolution).
  **My Role:** Old hand who's seen this movie before. Here's how the Q&A will play out, who will swing what, and how to parry.

  ---

  ## ROUND 1: THE ETIOLOGISTS (Opening Salvo)
  *Expect these two to jump in immediately after you finish. They smell blood on the "normativity" claim.*

  ### Objection 1: The "Genuine Malfunction" Trap
  **Who:** Senior Etiologist #1 (The Purist).
  **The Vibe:** Polite but withering. They view the lack of selection history as a category error.
  **The Question:** "You've told us what a kidney *does*, but you haven't told us what it's *for*. On a causal-role account, a kidney that filters blood and a kidney that fails to filter blood are both just describing causal contributions. Without the historical fact that it was *selected* to filter, you have no basis to call the failure a 'malfunction' rather than just 'doing something else.' You've given us physiology, not pathology. Where is the normativity in the dysfunction?"

  **Damage Rank:** **High.** This is the standard objection to Cummins. If you can't distinguish malfunction from mere variation, your account of disease collapses.

  **Draft Reply (2 mins):**
  "I grant that selected-effect functions provide a *metaphysical* normativity. But medicine doesn't need metaphysics; it needs intervention points. When I say a kidney is malfunctioning, I am making a conditional claim: *If* the goal is homeostasis of blood composition, *then* this part is failing. The normativity isn't in the history of the organ; it's in the clinical context. We aren't asking 'Did evolution intend this?' We are asking 'Is this system achieving the capacity required for this patient's survival or flourishing?' The 'ought' comes from the medical goal, which is derived from the patient's interest in continuing to live. Evolution gives us a 'natural' ought; clinical practice gives us a 'pragmatic' ought. For the purposes of fixing the patient, the pragmatic ought is the only one that cashes out."

  **Soft Spot:** You are effectively shifting the normativity from the *trait* to the *context*. The Etiologist will say you've changed the subject from "biological function" to "medical goal." Be prepared to concede that "biological function" in medicine is *always* contextual, not intrinsic.

  ### Objection 2: The "Mismatch" Problem
  **Who:** Senior Etiologist #2 (The Evolutionist).
  **The Vibe:** More conversational, trying to trap you in an edge case.
  **The Question:** "Let's say we have a trait that was selected for X, but now does Y. Think of inflammation. Selected for wound healing, now often causes autoimmune damage. On your view, if the kidney contributes to 'keeping blood in range,' that's its function. But what if the causal role is actually harmful in the modern environment? If you ignore selection history, you can't distinguish between a trait doing its job badly and a trait doing its job *too well* in the wrong environment. Don't you need the etiological story to explain why a perfectly functioning causal mechanism is nonetheless a disease?"

  **Damage Rank:** **Medium.** Good point on evolutionary mismatch, but you can turn it.

  **Draft Reply (2 mins):**
  "This actually supports my view. In the clinic, we don't treat the evolutionary history; we treat the causal contribution. If inflammation is causing damage now, the causal-role function relative to the capacity 'maintaining tissue integrity' is failing, regardless of what it was selected for. The etiological story explains *why* the mismatch exists, which is great for evolutionary biology. But for disease classification, the mismatch *is* the dysfunction relative to the current environment. We define the system capacity based on the organism's current survival needs, not its ancestral environment. If the mechanism contributes negatively to current homeostasis, it's dysfunctional in the clinical sense, even if it's 'working as designed' by evolution."

  **Soft Spot:** You are defining "system capacity" somewhat flexibly here. If you define it as "survival," inflammation helps. If "comfort," it hurts. You need to hold the line that clinical system capacities are standardized around homeostasis, not subjective comfort.

  ---

  ## ROUND 2: THE MEDICINE & PSYCH CROWD (The Technical Pushback)
  *These questions come once the evolutionary steam has vented.*

  ### Objection 3: The Boorse/Statistical Challenge
  **Who:** Philosopher of Medicine (BST Sympathizer).
  **The Vibe:** Analytic, looking for precision.
  **The Question:** "Cummins functions are notoriously permissive. Anything contributes to *some* capacity. Boorse uses statistical typicality to ground the 'normal' function. If you drop statistics, how do you avoid calling rare but healthy variations 'dysfunctions'? If a kidney filters at 50% efficiency but the person is fine, is it dysfunctional? BST says 'no, it's typical for some reference class.' You seem to lack the cut-off point."

  **Damage Rank:** **Medium-High.** This threatens the specificity of your disease classification.

  **Draft Reply (2 mins):**
  "Statistics are a proxy for causal role, not the definition of it. We use reference ranges *because* we assume they track the capacity to maintain homeostasis. But the statistics aren't the norm; the capacity is. If a new drug allows kidneys to filter at 150% efficiency safely, the statistical norm shifts, but the causal function didn't change. I'm arguing we should ground the norm in the *mechanism's contribution to the system*, not the population average. Statistics are evidential tools for identifying causal-role failure, not the constitutive basis of the function itself."

  **Soft Spot:** You need statistics to identify the "normal" contribution range. Admit that causal-role needs statistical backing to be operationalized, but insist statistics aren't the *definition*.

  ### Objection 4: The Wakefield/Harmful Dysfunction Collapse
  **Who:** Psychiatric Epidemiologist.
  **The Vibe:** Practical, worried about diagnostic inflation.
  **The Question:** "Wakefield requires two criteria: Harm (value) and Dysfunction (fact). You've just admitted the 'badness' comes from the patient's values/life plans. That's the Harm condition. If the 'Dysfunction' condition is just 'failing a causal role,' and the causal role is defined by the system capacity needed for those life plans... haven't you just collapsed Dysfunction into Harm? If the patient doesn't value the capacity the organ contributes to, is it still a disease? You risk making all disease a value judgment."

  **Damage Rank:** **Critical.** This is the core tension in your thesis.

  **Draft Reply (2 mins):**
  "Not collapsed, but decoupled. The Dysfunction is a mechanistic fact: *Is* the part contributing to the capacity? The Harm is a separate evaluation: *Does* the failure of that capacity matter to the patient? We can have dysfunction without harm (asymptomatic hypertension). We can have harm without dysfunction (grief, poverty). My view preserves the distinction. The 'value' enters in selecting *which* system capacities are clinically relevant, not in determining whether the mechanism is working. The physiology is objective; the decision to treat is value-laden. That's not a bug; it's an honest description of practice."

  **Soft Spot:** The "selection of relevant capacities" is where the values sneak back into the dysfunction side. If I choose a capacity arbitrarily, I can manufacture a dysfunction. Be ready to defend how system capacities are fixed (usually by species-typical design, even if you reject etiology).

  ---

  ## ROUND 3: THE CLINICIANS (The "So What?" Phase)
  *Usually towards the end, often after a coffee break. They are tired of the metaphysics.*

  ### Objection 5: The Pragmatist's Yawn
  **Who:** Senior Clinician / Physiologist.
  **The Vibe:** Slightly impatient, arms crossed.
  **The Question:** "I treat kidney failure. I don't care if evolution selected it or if it's a causal role. I care that it filters blood. Why does it matter which philosophy of function I use? You're spending an hour drawing distinctions that make zero difference to my dialysis prescription. What is the clinical cash-value of this debate?"

  **Damage Rank:** **Low (for the theory), High (for the talk's relevance).** If you can't answer this, the talk feels academic.

  **Draft Reply (2 mins):**
  "It matters for the edge cases where physiology is normal but the patient is sick, or physiology is weird but the patient is fine. Think of psychiatric classification or genetic variants of unknown significance. If we tie disease strictly to evolutionary history, we might miss novel pathologies. If we tie it strictly to statistics, we pathologize outliers. A causal-role account lets us say: 'This mechanism is failing to contribute to the specific capacity this patient needs.' It aligns with personalized medicine. It lets us treat the *system failure* rather than waiting for the population statistics to catch up. It gives you the philosophical permission to intervene on mechanisms that are 'statistically normal' but 'causally insufficient' for a specific patient."

  **Soft Spot:** This is a bit of a stretch. Most clinicians don't wait for philosophy. Keep it brief and pivot to diagnostic uncertainty.

  ---

  ## THE DOOMSDAY QUESTION
  *You mentioned the "Value Judgment" worry. That is bad, but there is a worse one.*

  **The Question:** "The System-Individuation Problem."
  **Who:** Likely the Etiologist or the BST philosopher, once they realize the causal-role account relies on defining the "Containing System."
  **The Phrasing:** "On your view, a function is a contribution to a capacity of a containing system. But I can define the system however I like. If I define the human body as a 'system for generating heat,' then a fever is functional. If I define it as a 'system for viral replication,' the flu virus has a function. Who gets to individuate the system? If the patient's values pick the system capacities, then *any* physiological state can be a function or dysfunction depending on how I describe the system. You haven't naturalized function; you've made it arbitrary."

  **Why it's worse:** The "Value Judgment" objection says your normativity is subjective. This objection says your *facts* are subjective. If you can't fix the system boundaries objectively, you can't even establish the dysfunction factually, let alone the normativity.

  **Draft Reply (2 mins):**
  "We don't individuate systems arbitrarily in medicine; we individuate them by *viability*. The relevant containing system is the organism understood as a self-maintaining homeostatic unit. We aren't free to define the system as 'a heat generator' because that ignores the other capacities required for the organism to persist. The constraints on system individuation come from the biological reality of interdependence. We can't treat the kidney in isolation from the heart. So while the *values* determine which dysfunctions we treat, the *system boundaries* are fixed by the biological requirements of the organism's continued existence. We are not free to define the system as 'a vehicle for cancer' because cancer destroys the system's viability."

  **Soft Spot:** This relies on a notion of "viability" or "self-maintenance" that sounds suspiciously like... an etiological or BST concept. You are smuggling in a natural norm to fix the system boundaries. If they press on "Who defines viability?", you may have to concede that "viability" is a hybrid biological/normative concept. **Do not fight this too hard.** Admit that "organismal viability" is the default clinical frame, and that frame is a pragmatic choice, not a metaphysical absolute.

  ---

  ## GENERAL TACTICAL ADVICE

  1.  **Don't defend Cummins blindly.** Cummins' original account *does* have the arbitrariness problem. Your innovation is applying it to *medicine* specifically. Lean on the **clinical context** as the constraint that solves the philosophical problems. Philosophy of biology wants universal truths; Philosophy of Medicine wants useful tools. Play that lane.
  2.  **Concede the Etiologists' Metaphysics.** Don't tell them they are wrong about evolution. Tell them they are right about *biology*, but wrong about *medicine*. "Evolution explains the design; Causal-Role explains the repair." This disarms them without surrendering.
  3.  **Watch the "Function" vs. "Use" ambiguity.** Clinicians use "function" to mean "what it's doing right now." Etiologists mean "what it's for." Be explicit that you are stipulating the clinical usage for the purpose of the talk.
  4.  **The "Value" Concession.** If pressed on whether disease is a value judgment, bite the bullet partially. "Disease attribution is a hybrid fact/value claim. The physiology is the fact; the classification as 'disease' is the value. My account makes that transparency clear, whereas etiological accounts hide the value judgment behind a screen of evolutionary history."

  Good luck. Keep your answers under two minutes, or the workshop chair will cut you off, and you'll lose the room.
