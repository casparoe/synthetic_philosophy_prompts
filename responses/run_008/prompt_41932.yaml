answer: |-
  This is a sharp observation, and you are right to feel that something specific is happening here. You have identified a structural failure mode in the application of rationalist epistemology that is frequently encountered but rarely named as a distinct phenomenon.

  Here is the breakdown of the concepts, the existing terminology, and my assessment of whether this constitutes a distinct phenomenon.

  ### 1. The Formal Root: The Reference Class Problem
  The statistical and philosophical foundation of what you are describing is the **Reference Class Problem**.
  *   **Origin:** Attributed to Hans Reichenbach (1949), though the intuition is older.
  *   **Definition:** Any individual event or case belongs to infinitely many different classes (reference classes), each of which may have a different frequency/probability for the outcome in question. There is no principled, objective way to select the "correct" class without already knowing the answer.
  *   **Relevance:** This is the "dial" you mentioned. When Person A says "founders" and Person B says "founders with this specific traction," they are wrestling with the Reference Class Problem.

  **Confidence:** 99%. This is definitely the underlying formal problem.

  ### 2. The Argumentative Dynamic: "Reference Class Tennis"
  Is there a name for the *debate dynamic* itself? There is no single canonical term in the way "Planning Fallacy" is canonical, but there is a strong colloquialism used in legal theory, statistics, and parts of the rationalist sphere: **Reference Class Tennis**.

  *   **Usage:** It describes a situation where two parties hit the "ball" back and forth by proposing competing reference classes to support their desired conclusion.
  *   **Status:** It is not a "term of art" with a strict definition in a textbook, but it is the established shorthand for this specific maneuver in contexts where base rates are weaponized.
  *   **Alternative:** In the LessWrong/rationalist community specifically, this is often discussed under the umbrella of **The Modesty Argument** (popularized by Robin Hanson and Scott Alexander). Scott Alexander's 2014 post *The Modesty Argument* explicitly grapples with your point: he notes that you cannot simply "defer to the average opinion" because you must first decide *who counts as the average*, and that decision itself requires a non-modest judgment.

  ### 3. Related Concepts
  To understand why this feels distinct from simple disagreement, it helps to map it against these neighbors:

  *   **Fully General Counterarguments (FGC):** An FGC is an argument that can be used to dismiss any conclusion (e.g., "You're just saying that because you're biased"). The "Outside View" move risks becoming an FGC if you can always find a reference class that makes the opponent look wrong. Your observation is that the *selection of the reference class* is where the FGC hides.
  *   **Theory-Ladenness of Observation:** (Philosophy of Science). You cannot observe data neutrally; your observations are influenced by your theoretical commitments. Similarly, you cannot select a reference class neutrally; your selection is laden with your "inside view" commitments.
  *   **No Free Lunch Theorem:** (Machine Learning). You cannot learn from data without making assumptions (inductive bias). The Outside View promises to let you learn from "the data of history" without assumptions, but choosing a reference class *is* an assumption.

  ### 4. Is This Distinct from "Disagreeing About Base Rates"?
  You asked if this is genuinely distinct from just "people disagree about base rates." **Yes, it is.**

  *   **Standard Disagreement:** "I think the base rate is 10%." "I think it's 30%." (Implies there is a fact of the matter we are measuring poorly).
  *   **The Dynamic You Described:** "I think the relevant population is X." "I think the relevant population is Y." (Implies there is **no neutral fact of the matter** about which population is relevant without invoking prior judgment).

  The distinction is **meta-epistemic**. In the first case, we are arguing about the world. In the second case, we are arguing about *how to map the world to statistics*. The latter creates the "merry-go-round" effect you noticed, where methodological agreement ("Let's use base rates!") fails to produce convergence because the method contains a hidden parameter (class selection) that re-introduces the original disagreement.

  ### 5. Proposed Terminology
  Since "Reference Class Tennis" is colloquial and "Reference Class Problem" is the static statistical issue, I propose the term **The Outside View Regress** for this specific argumentative stalemate.

  *   **Definition:** A debate stalemate where appeals to external statistical baselines fail to resolve disagreement because the selection of the appropriate baseline requires the same internal judgment the appeal was meant to bypass, leading to an infinite regress of narrowing or widening reference classes.
  *   **Boundary Cases:**
      *   *Counts:* Both sides sincerely want to use base rates; the disagreement is purely on class membership criteria; no empirical data can resolve which criteria are "correct" without circularity.
      *   *Doesn't Count:* One side is clearly motivated reasoning (ignoring obvious classes); or there is an objective causal mechanism that dictates the class (e.g., biological sex in a medical trial).

  ### 6. Confidence and Uncertainty Flag
  Per your request, here is my explicit confidence breakdown:

  *   **Identification of the Root Cause (Reference Class Problem):** 99% Confidence. This is undoubtedly the statistical engine driving the dynamic.
  *   **Existence of a Canonical Name:** 95% Confidence. There is no single, universally recognized term like "The [Name] Effect" for this specific conversational loop. "Reference Class Tennis" is the closest existing slang.
  *   **Distinctness from General Base Rate Disagreement:** 80% Confidence. This is the point I am least sure about.
      *   *Why the uncertainty:* One could argue that *all* base rate disagreements are just reference class disagreements in disguise. If so, this isn't a distinct phenomenon, but rather the *exposure* of the true nature of base rate disagreements.
      *   *My Read:* However, I lean towards it being distinct because of the **performative** aspect. The dynamic relies on both parties *claiming* the humility of the Outside View while using it to entrench their Inside View. It is a specific failure mode of *applied rationality*, not just statistics. It is the "weaponization of humility."

  ### Summary
  You have accurately described a known blind spot in rationalist epistemology. The formal problem is the **Reference Class Problem**. The argumentative dynamic is best described as **Reference Class Tennis** or **The Outside View Regress**.

  It is distinct from simple disagreement because it demonstrates that the Outside View is not a "view" at all, but a **function** that takes a reference class as an input. When two people feed different inputs (classes) into the function, they get different outputs, and the Outside View machinery provides no neutral way to select the input. This turns the "humility move" into a mirror that reflects the user's prior judgments back at them, disguised as statistics.

  **Least Sure Point:** Whether this deserves a *new* name or is simply the standard Reference Class Problem manifesting in social discourse. I suspect the latter, but the social consequences (the stalemate despite methodological agreement) are significant enough that treating it as a distinct rhetorical phenomenon is useful.
