  2.  **Analyze the Commitments & Potential Tensions:**

      *   **Tension A: Commitment 3 vs. Commitment 5 (Pond Case).**
          *   Commitment 3 says beneficence is *imperfect*: no *particular* act is strictly required.
          *   Commitment 5 says the passerby who *omits* a *particular* act (saving the pond child) does something *wrong*.
          *   *Conflict:* If no particular act is required (3), how can omitting *this* particular act be wrong (5)? Imperfect duties typically allow latitude on *when* and *how* to fulfill them. The pond case looks like a perfect duty (specific act required).
          *   *Severity:* High. This is a direct contradiction in deontic status assigned to a specific act.

      *   **Tension B: Commitment 2 vs. Commitment 5 (Pond vs. Donor).**
