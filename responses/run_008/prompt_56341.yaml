      *   **Key Concept to Introduce:** The distinction between the *Selector* (Reward) and the *Selected* (Policy). The "Evolution Analogy." The unfalsifiability of Marcus's position.
      *   **Refining the Verdict:** Marcus is weaker because his definition renders "wireheading" impossible by definition, which contradicts the phenomenon they are discussing. If wireheading is just "maximizing reward," then it's not a failure mode, it's success. But we call it a failure mode because it violates the *intent*. Marcus tries to locate intent in the math; User locates it in the learned heuristic.
      *   **Empirical Test:** Generalization. Put the agent in a new environment where the reward button exists but the game doesn't. Does it seek the button? (Marcus: Yes, that's its goal). User: Maybe, if the proxy generalized to "find the number." But if the proxy was "score points in game," it might be confused.
      *   Actually, the best empirical test is *introspection/access*. Does the policy have access to the reward scalar? Usually no. So it can't "want" to maximize it in the intentional sense. It wants to maximize the *predictor* of reward.
