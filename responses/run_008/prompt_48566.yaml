answer: |-
  Your roommate has handed you a classic, heavyweight problem in philosophy of science. She isn't making a mistake; she is reconstructing **Glymour's Problem of Old Evidence** (1980). It is one of the most famous objections to Bayesian confirmation theory.

  You are stuck because her argument is **valid** against a specific, idealized version of Bayesianism. To find the hole, you have to find the hidden premise she is relying on.

  Here is the breakdown of where the argument bites, how Bayesians usually escape it, and whether you need to sacrifice definition (1).

  ### The Hidden Premise: Logical Omniscience

  The flaw is hidden in the transition from (3) to (5). Her argument assumes a standard Bayesian agent who is **logically omniscient**.

  In standard Bayesian models, an agent is assumed to know all logical consequences of their beliefs. If a physicist believes in General Relativity ($H$), and $H$ logically entails the Mercury data ($E$), a logically omniscient agent *already knows* $H \to E$ with probability 1.

  If the agent already knows $E$ (so $P(E)=1$) **AND** already knows that $H$ entails $E$ (so $P(H \to E)=1$), then learning GR in 1915 provides no new information to condition on. The probability space is "closed."

  **The Hole:** Real humans are not logically omniscient. In 1915, physicists knew $E$ (Mercury's orbit). They did *not* know that $H$ (GR) entailed $E$. That was the discovery.

  ### How to Save Bayesianism (Without Dropping (1))

  You said you want to keep (1) (*Confirmation is credence-raising*). You can, but you have to modify what gets conditioned on. There are two main ways Bayesians solve this.

  #### Solution 1: Condition on the Connection, Not the Evidence
  Instead of conditioning on $E$ (which is already 1), the physicist conditions on the proposition **$X$: "Hypothesis $H$ entails Evidence $E$."**

  *   **Before Nov 1915:** $P(E) = 1$, but $P(H \to E) < 1$. (They knew the data, but didn't know GR fit it).
  *   **After Nov 1915:** Einstein shows the math. Now $P(H \to E) = 1$.
  *   **The Update:** You conditionalize on $X$ ($H \to E$), not on $E$.
  *   **The Result:** Because $H$ predicts $E$ better than $\neg H$ does, learning that $H \to E$ raises the probability of $H$.

  **Cost:** This violates the idealized Bayesian assumption of logical omniscience. It requires a more complex probability space where you can be uncertain about logical/mathematical relationships. Most modern Bayesians accept this cost; it makes the model more psychologically realistic.

  #### Solution 2: Counterfactual Priors (The "What If" Move)
  Some Bayesians argue that confirmation isn't about *actual* historical updating, but about **structural support**.

  To ask "Does $E$ confirm $H$?" is to ask: "If we *didn't* know $E$, would learning $E$ raise our credence in $H$?"
  *   We construct a counterfactual prior $P^*$ where $P^*(E) < 1$.
  *   We check if $P^*(H|E) > P^*(H)$.
  *   If yes, $E$ confirms $H$, even if historically $P(E)$ was already 1.

  **Cost:** This severs the link between confirmation and actual learning history. It makes confirmation a timeless logical relation rather than a dynamic psychological process. Your roommate might attack this as "bookkeeping" (as she did), because it relies on a fictional state of ignorance.

  ### Addressing Your Specific Sticking Points

  **1. The Slide Between "Would Raise" and "Did Raise"**
  You sensed a slide in (1). You are right.
  *   **Dynamic Confirmation:** "My credence *did* go up when I learned this." (Requires $P(E) < 1$).
  *   **Static Confirmation:** "This evidence *supports* the theory." (Can be true even if $P(E) = 1$).

  Your roommate's argument proves that **Dynamic Confirmation** (standard conditionalization) cannot account for old evidence. However, most Bayesians argue that **Static Confirmation** is what matters for theory choice. They use Solution 1 or 2 to bridge the gap. If you insist that confirmation *must* be dynamic (actual credence raising at time $t$), then your roommate wins, and you must admit mature science has no "new" confirmation. But that's a very restrictive definition of science.

  **2. Is Step (6) a Real Generalization?**
  Step (6) claims "No theory is ever confirmed by any evidence after the data goes public."
  *   **True for:** Strict Conditionalization on $E$.
  *   **False for:** Conditionalization on the *theoretical link* ($H \to E$).
  New theories often explain old data in *new ways*. The "newness" isn't the data; it's the derivation. So (6) is false if you allow learning logical connections.

  **3. Should You Drop (1)?**
  You said: *"If I have to keep one thing it's (1), since its the only definition of confirmation I actually understand."*

  **Keep (1).** It is the standard definition of *incremental* confirmation. Dropping it leads to much weirder places (like Likelihoodism or Falsificationism, which have their own massive problems).

  However, you must tell your roommate: **(1) is correct, but your application of it assumes agents are logically omniscient.**
  The definition of confirmation is $P(H|K) > P(H)$, where $K$ is the *total new knowledge acquired*.
  *   Her argument assumes $K = E$.
  *   The Bayesian reply is $K = (H \text{ entails } E)$.

  ### The Verdict

  Your roommate's argument is **sound against naive Bayesianism**, but **unsound against sophisticated Bayesianism**.

  *   **The Weak Step:** Step (5) implicitly assumes the only proposition available to condition on is $E$. It ignores the proposition "H entails E."
  *   **The Cost:** To fix it, you must admit that Bayesian agents can be uncertain about logic/math (rejecting Logical Omniscience). This makes the probability calculus messier, but it saves the intuition that Mercury confirmed GR.
  *   **The Moral:** She is right that *simple* conditionalization eats itself. She is wrong that *Bayesian confirmation* eats itself. The solution is to recognize that in science, we often learn **connections**, not just **facts**.

  **What to say to her:**
  "You're describing Glymour's Problem of Old Evidence. You're right that standard conditionalization fails here because it assumes logical omniscience. But you don't have to drop definition (1). You just have to allow that what Einstein taught the physicists wasn't the value of the perihelion (they knew that), but the **logical relationship** between GR and the perihelion. If we allow agents to update on logical connections (where probability was previously <1), then $P(H)$ goes up, (1) is preserved, and GR gets confirmed."
