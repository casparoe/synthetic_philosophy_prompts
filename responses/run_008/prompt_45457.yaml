      *   *Claim 3:* "On this basis he holds that the state may legitimately suppress movements that preach intolerance as soon as they begin to organise, since waiting until they resort to violence would concede them the initiative." -> **Potential Error.** Popper argues we should suppress them *if* they are not prepared to meet rational argument with argument and instead denounce all argument. He suggests suppressing them *if* they are unwilling to engage in rational debate. He does not explicitly say "as soon as they begin to organise." He says we should claim the right to suppress them *if* they are not prepared to meet rational argument with rational argument. He also says we should suppress them *by force* if they are not prepared to meet us by rational argument. The timing "as soon as they begin to organise" is a bit strong/interpretative, but the bigger issue is usually about inciting violence vs. organizing. However, the bigger error lies in the Rawls comparison.
