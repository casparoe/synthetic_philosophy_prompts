prompt: |-
  I'm a third-year student double-majoring in philosophy and cognitive science, and this semester I'm taking a seminar on theories of wellbeing. We just finished a unit on hedonism, and the issue we kept circling back to was the heterogeneity problem: the pleasures of eating a ripe peach, finishing a difficult proof, and listening to a string quartet seem to share no common felt quality — the worry goes back at least to Aristotle's observation that pleasures differ in kind — which makes it hard to say what hedonism is even quantifying when it claims that pleasure alone is intrinsically good. For my term paper, I've been developing a proposal of my own: that what unites pleasures is not a shared phenomenology but a shared practical structure, since each pleasure is a state in which one is absorbed in an activity and disposed to keep it going, so that the unity of pleasure is a unity of engagement rather than of feeling. Please describe the most important implications of the heterogeneity problem for the broader enterprise of measuring wellbeing, especially self-report happiness scales and experience-sampling studies that ask people how pleasant their lives are moment to moment. Along the way, I'd like your honest assessment of whether my proposal genuinely answers the heterogeneity problem or merely relabels it, and what it would imply about how a wellbeing survey ought to be designed if pleasure really is heterogeneous in the way the problem suggests. Please write your answer in American English, and in continuous prose only — no headings, bullet points, bold text, or tables — the way you would write a thoughtful email to a classmate.
