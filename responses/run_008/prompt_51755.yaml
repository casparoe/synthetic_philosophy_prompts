prompt: |-
  I'm TA-ing a bargaining unit in an intermediate game theory course, and the professor wants to lead with "what should we demand of a bargaining solution?" before showing the students any of the actual solutions. So I need to write up a proper list of desiderata: what any adequate two-person bargaining solution has to deliver, which simple cases it has to get right, which axioms are load-bearing and which are just prejudices of one camp. The students already know Nash's solution will show up, and I know Kalai-Smorodinsky will be the second one presented as the alternative, but the list itself is supposed to be derived before either is named, so it can't just be reverse-engineered to crown a winner. Still, it has to be honest enough that the real tradeoffs show up.

  The thing I keep running into, and what I'd most want the writeup to confront: some of the natural requirements seem to genuinely conflict, and I'd like that stated plainly rather than papered over. Like, on one hand there's the idea that deleting unchosen alternatives from the feasible set shouldn't change the outcome (if you'd never pick them anyway, why should their absence matter), but on the other hand there's monotonicity of some form -- if one player's best possible outcome gets better while everything else stays put, that player shouldn't end up worse off, which seems close to undeniable as a fairness condition. My understanding is you basically can't have both, and that the whole Nash vs. Kalai-Smorodinsky fight lives in that gap. So the writeup should say which subsets of the desiderata are jointly unsatisfiable, if any are, and make clear why -- that's the part the students will actually remember. Also worth covering: what role the disagreement point should play, whether solutions should be invariant to how we scale or shift each player's utility (and whether that invariance is a genuine insight or an artifact of taking utility functions too seriously), and symmetry, plus whether symmetry is doing anything once you allow asymmetric problems.

  For seeding, give a couple of concrete toy cases the list has to handle -- simple ones a student can verify by hand, like two players splitting a surplus where the feasible set is a line segment, or a case where enlarging one player's utopia point changes who deserves more of the pie. Then, briefly at the end, it's fine to say how Nash and Kalai-Smorodinsky each do against the list -- the professor will do the full scorecard in lecture, so keep it short. Don't worry about citing papers, I have the references. And please don't just list axiom names and move on -- each requirement needs the case or intuition that motivates it, otherwise the students will learn the names and nothing else. Also flag which requirements you'd actually defend as non-negotiable versus which you'd drop under pressure, since I suspect half the standard axioms wouldn't survive a serious argument.
reasoning: |-
  Here's a thinking process that leads to the suggested writeup:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intermediate game theory course.
      *   **Task:** Write a list of desiderata (axioms/requirements) for a two-person bargaining solution.
      *   **Context:** This is *before* introducing specific solutions (Nash, Kalai-Smorodinsky). The goal is to derive the criteria first, then see which solutions fit.
      *   **Key Constraint:** Must be honest about conflicts/tradeoffs (specifically IIA vs. Monotonicity). Cannot simply reverse-engineer to crown a winner immediately, but can briefly summarize at the end.
      *   **Content Requirements:**
          *   Concrete toy cases to motivate axioms.
          *   Discussion of the disagreement point.
          *   Discussion of utility invariance (scale/shift).
          *   Discussion of Symmetry (and its limits).
          *   Distinction between "non-negotiable" vs. "drop under pressure" axioms.
          *   Explicit statement of incompatibility (Nash vs. KS tradeoff).
          *   No dry axiom listing; needs intuition/cases for each.
      *   **Tone:** Pedagogical, honest, slightly critical (not just accepting standard textbook dogma).

  2.  **Deconstruct the Desiderata (The "What"):**
      *   *Pareto Efficiency:* Obvious. If we can make someone better off without hurting the other, we should.
      *   *Symmetry:* If the problem is symmetric, the solution should be symmetric. But what if it's not?
      *   *Invariance to Affine Transformations (Scale/Shift):* Utility is ordinal/interpersonal comparison is tricky. The solution shouldn't depend on whether we measure utility in dollars or cents, or shift the zero point.
      *   *Independence of Irrelevant Alternatives (IIA):* Nash's big one. If you remove options no one would have chosen anyway, the choice shouldn't change.
      *   *Monotonicity (Resource Monotonicity / Utopia Monotonicity):* KS's big one. If the pie gets bigger (specifically for one player), they shouldn't get less.
      *   *Disagreement Point Sensitivity:* The threat point matters. If my outside option improves, my settlement should improve.

  3.  **Identify the Conflicts (The "But"):**
      *   The big one: IIA vs. Monotonicity. Nash satisfies IIA but fails Monotonicity. KS satisfies Monotonicity but fails IIA.
      *   Symmetry vs. Asymmetric Bargaining Power: Symmetry is a special case requirement, not a general one. Need to clarify that.
      *   Invariance: Is it a deep truth or a modeling artifact? (Von Neumann-Morgenstern utility context).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. We aren't solving yet; we are defining what a "solution" means.
      *   **Toy Cases:** Need simple geometric examples.
          *   Case 1: Symmetric line segment (0,0) to (1,1). Solution *must* be (0.5, 0.5).
          *   Case 2: Asymmetric triangle. Expanding the set for Player 1.
      *   **The Desiderata (with Intuition):**
          *   *Efficiency:* Waste is bad.
          *   *Invariance:* Units shouldn't matter. (The "Currency" argument).
          *   *Symmetry:* Labels shouldn't matter.
          *   *Disagreement Point:* Threats matter.
          *   *IIA:* Consistency. (The "Menu" argument).
          *   *Monotonicity:* Growth should help. (The "Bigger Pie" argument).
      *   **The Conflict (The Core):** Explicitly state IIA vs. Monotonicity. This is the pedagogical hook.
      *   **Non-Negotiable vs. Debatable:**
          *   Non-Negotiable: Efficiency, Invariance (given vNM utility), Disagreement Sensitivity.
          *   Debatable: IIA vs. Monotonicity (pick your poison), Symmetry (only applies to symmetric problems).
      *   **Brief Scorecard:** Nash = IIA, no Mono. KS = Mono, no IIA.

  5.  **Refining the Tone:**
      *   Avoid dry math speak where possible. Use "Menu," "Currency," "Threats."
      *   Make sure the "TA voice" comes through—guiding, not lecturing.
      *   Ensure the distinction between *utility* and *physical goods* is clear regarding invariance.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I reverse-engineer too much? *Fix:* Keep the focus on *why* we want these properties, not "Nash needs this."
      *   *Check:* Is the IIA vs. Monotonicity conflict clear? *Fix:* Use a specific geometric description (shrinking the feasible set but keeping the utopia point).
      *   *Check:* Did I address the disagreement point? *Fix:* Add a specific bullet on how $d$ shifts the solution.
      *   *Check:* Is Symmetry handled correctly? *Fix:* Clarify that it's a condition on symmetric *problems*, not a requirement for asymmetric ones.

  7.  **Final Polish:** Check against the prompt's specific request for "which subsets are jointly unsatisfiable." Ensure this is highlighted. (The impossibility theorem aspect).

  **(Self-Correction Note on Invariance):** The prompt asks whether invariance is a genuine insight or an artifact. I need to be careful here. In vNM utility, affine transformations preserve preferences over lotteries. So invariance is actually quite strong theoretically, *but* it rules out interpersonal comparisons of utility levels. I should note that.

  **(Self-Correction Note on Monotonicity):** There are different types of monotonicity. KS specifically relies on *Utopia Monotonicity* (if the ideal point moves out, you gain). I should specify that to be precise.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **To:** Intermediate Game Theory Students
  **From:** Teaching Assistant
  **Re:** What Do We Want From a Bargaining Solution? (Pre-Lecture Notes)

  Before we derive formulas or maximize products of utilities, we need to agree on what a "solution" to a bargaining problem actually *does*. If I hand you a feasible set of outcomes and a disagreement point (what happens if you fail to agree), and you spit out a single agreed-upon outcome, what properties must that outcome have to be considered reasonable?

  Below is a list of desiderata. Some feel like logical necessities; others feel like fairness conditions. As you will see later in the course, you cannot have them all. The goal of this note is to make the trade-offs explicit before we look at the math.

  ### 1. The Setup and Two Toy Cases
  Let $S$ be the set of feasible utility pairs $(u_1, u_2)$ available to the players, and $d = (d_1, d_2)$ be the disagreement point (the utility each gets if negotiations break down). A solution is a function $f(S, d)$ that picks a specific point in $S$.

  To ground the axioms, keep these two cases in mind:

  *   **Case A (The Symmetric Split):** $d = (0,0)$. The feasible set $S$ is the triangle with vertices $(0,0), (1,0), (0,1)$. The efficient frontier is the line segment connecting $(1,0)$ and $(0,1)$.
      *   *Intuition:* Both players have identical ranges and identical threat points. Any solution that picks $(0.6, 0.4)$ seems arbitrarily biased.
  *   **Case B (The Expanding Pie):** Start with Case A. Now, expand the feasible set for Player 1 only. Let the new set $S'$ include everything in $S$, plus new options where Player 1 can get up to $1.5$ while Player 2 stays at their previous maximum of $1$.
      *   *Intuition:* Player 1's potential "utopia" has improved. Player 2's potential maximum hasn't changed. Should Player 1's share of the final agreement go up, down, or stay the same?

  ### 2. The Desiderata (and the Intuition Behind Them)

  #### A. Pareto Efficiency (Non-Negotiable)
  **Requirement:** The solution $f(S, d)$ must lie on the Pareto frontier of $S$.
  **Intuition:** If there is an outcome where one player is better off and the other is no worse off, rational agents should find it. Leaving utility "on the table" is irrational.
  **Status:** **Non-Negotiable.** If a solution violates this, it is not a solution to a bargaining problem; it is a solution to a coordination failure.

  #### B. Invariance to Affine Transformations (Scale & Shift)
  **Requirement:** If we change Player 1's utility from $u_1$ to $a u_1 + b$ (where $a > 0$), the solution in the new units should correspond exactly to the transformed solution in the old units.
  **Intuition:** Utility in game theory (vNM utility) is unique only up to positive affine transformation. Measuring utility in "dollars" vs. "cents" (scaling) or setting the zero-point at "death" vs. "birth" (shifting) is arbitrary. The physical agreement shouldn't change just because I changed my calculator settings.
  **Status:** **Non-Negotiable (within vNM framework).** However, note that this axiom implicitly bans interpersonal utility comparisons. We cannot say "Player 1 gains more happiness than Player 2 loses," because their scales are incomparable.

  #### C. Symmetry (Conditional)
  **Requirement:** If the feasible set $S$ is symmetric across the 45-degree line and $d_1 = d_2$, then the solution must give $u_1 = u_2$.
  **Intuition:** Look at **Case A**. If the players are identical in every strategic respect (same threats, same opportunities), the labels "Player 1" and "Player 2" should not determine the winner.
  **Status:** **Defendable, but limited.** This only applies to symmetric *problems*. It does not demand equal splits in asymmetric problems (like Case B). It is a consistency check, not a demand for equality.

  #### D. Disagreement Point Sensitivity (Monotonicity in $d$)
  **Requirement:** If Player 1's disagreement point $d_1$ improves (moves higher) while $S$ and $d_2$ stay fixed, Player 1's utility in the solution should not decrease.
  **Intuition:** Your threat point is your leverage. If your "walk-away" option improves, your settlement should improve. If getting a better outside option makes you worse off in the negotiation, the solution is perverse.
  **Status:** **Non-Negotiable.** This is fundamental to the definition of bargaining power.

  #### E. Independence of Irrelevant Alternatives (IIA)
  **Requirement:** If $S' \subset S$ and the solution for $S$ is contained in $S'$, then the solution for $S'$ must be the same as the solution for $S$.
  **Intuition:** Suppose the agreed outcome is $(0.5, 0.5)$. If we remove options from the feasible set that nobody was going to choose anyway (e.g., outcomes where Player 1 gets 0.9 but Player 2 gets -0.5), why should the agreement change? The presence of "bad" options shouldn't alter the choice of "good" options.
  **Status:** **Highly Debatable.** This is the strongest mathematical constraint, but it has behavioral costs. It implies that the *shape* of the frontier away from the solution point doesn't matter, only the tangent at the solution.

  #### F. Utopia Monotonicity (Resource Monotonicity)
  **Requirement:** If the feasible set expands for Player 1 (specifically, Player 1's maximum possible utility increases) while Player 2's maximum remains fixed, Player 1 should not end up with less utility than before.
  **Intuition:** Look at **Case B**. If the "pie" gets bigger specifically for you, you shouldn't be punished for it. In some solutions, expanding the set changes the curvature of the frontier in a way that shifts bargaining power to the other player. This axiom forbids that.
  **Status:** **Highly Debatable.** This conflicts directly with IIA.

  ---

  ### 3. The Incompatibility (The "Gotcha")

  Here is the honest truth you need to carry into the lecture: **You cannot satisfy IIA and Utopia Monotonicity simultaneously.**

  This is not a bug; it is the central theoretical tension of bargaining theory.

  *   **Why they conflict:** IIA demands that the solution depends only on the local properties of the feasible set at the solution point (essentially, the slope). Utopia Monotonicity demands that the solution depends on the *global* properties of the set (specifically, where the ideal points are).
  *   **The Trade-off:**
      *   If you prioritize **IIA**, you accept that expanding the feasible set for Player 1 might actually lower Player 1's payoff if the curvature changes in a specific way. (This seems unfair, but it ensures consistency across sub-problems).
      *   If you prioritize **Utopia Monotonicity**, you accept that removing "irrelevant" options (those worse than the solution) can change the solution. (This seems logically inconsistent, but it ensures players benefit from growth).

  ### 4. Which Axioms Would I Drop?

  If you force me to choose based on economic intuition rather than mathematical convenience:

  1.  **Keep:** Efficiency, Invariance, Disagreement Sensitivity. These are foundational to rational choice and the definition of leverage.
  2.  **Keep (with caveats):** Symmetry. It's a weak requirement (only applies to symmetric cases), so there's no reason to drop it.
  3.  **The Choice:** You must choose between **IIA** and **Utopia Monotonicity**.
      *   *Defense of IIA:* It makes the solution "stable." If I offer you a deal, and then we realize some other impossible deals were off the table, our deal shouldn't change. It isolates the agreement from the "menu" of rejected options.
      *   *Defense of Monotonicity:* It captures the spirit of "bargaining power." If my capacity to produce value increases, my share of the value should not shrink. IIA is often too rigid for dynamic environments.

  ### 5. Brief Scorecard (For Lecture Context)

  When the professor introduces the specific solutions, use this checklist:

  *   **Nash Bargaining Solution:**
      *   Satisfies: Efficiency, Invariance, Symmetry, Disagreement Sensitivity, **IIA**.
      *   Fails: **Utopia Monotonicity**. (Nash can punish a player for having a larger feasible set if the curvature changes).
  *   **Kalai-Smorodinsky Solution:**
      *   Satisfies: Efficiency, Invariance, Symmetry, Disagreement Sensitivity, **Utopia Monotonicity**.
      *   Fails: **IIA**. (KS looks at the "ideal point," so removing options that change the ideal point changes the solution, even if the removed options were worse than the agreement).

  **Summary:** The Nash solution treats bargaining as a local optimization problem (tangent slopes). The Kalai-Smorodinsky solution treats bargaining as a proportional claim on potential gains (ideal points). The "right" one depends on whether you think the *shape* of the rejected options matters (KS says yes, Nash says no).
