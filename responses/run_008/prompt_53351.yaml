      *   So, it's not purely verbal. But is it a standard empirical disagreement? No, because both agree on the neural data (mostly). They interpret the *significance* of that data differently.
      *   *Diagnosis:* It's a **clash of explanatory goals** masked as an ontological dispute. It's about *what needs explaining*.

  4.  **Develop the Diagnosis (The "Deep" Argument):**
      *   *Point 1: The Target of Explanation.* Dennett wants to explain away the *intuition* of a center. GWT wants to explain the *function* of access.
