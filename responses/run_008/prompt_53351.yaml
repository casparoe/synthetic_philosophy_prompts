      *   *Point 3: The Theater Accusation as a Proxy.* Dennett uses "Cartesian Theater" to attack the *reification* of experience. GWT hears it as an attack on *integration*.
      *   *Conclusion:* It's a **Category Error Dispute**. Dennett is doing phenomenology dissolving into functionalism. GWT is doing cognitive neuroscience functionalism. They are talking past each other because one denies the phenomenon the other is measuring.

  5.  **Determine What Counts as Progress:**
      *   *Experiments?* Unlikely to settle it. Neural correlates (NCC) are compatible with both. MDM says "that's just more drafting." GWT says "that's ignition."
