      *   *The Stalemate:* Dennett says consciousness is an *illusion* of a center (narrative gravity). GWT says consciousness is a *functional state* of access (ignition).
      *   *Editor's View:* It's verbal. They define "theater" differently.
      *   *User's Hunch:* It's about whether consciousness is a "natural kind."

  3.  **Evaluate the "Verbal vs. Real" Dichotomy:**
