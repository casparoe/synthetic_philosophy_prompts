answer: |-
  ### Candidate Designs

  **1. The Structured Debate (Pro/Con Restitution)**
  *   **Design:** Split the class into two teams arguing for and against returning the bronzes.
  *   **Rejection:** This reinforces a binary that doesn't exist in reality. It encourages students to dig into entrenched positions rather than explore the structural reasons for disagreement. It privileges rhetoric over the feeling of institutional deadlock, and it obscures the multiplicity of claimants (e.g., State vs. Royal Court).

  **2. The Mock Trial (Legal Adjudication)**
  *   **Design:** Students act as counsel and judges applying international law to determine ownership.
  *   **Rejection:** This implicitly validates "legal title" as the supreme framework. It forces ethical and spiritual claims into legal categories where they inevitably fail. You want students to feel that the *law itself* is part of the contested framework, not the neutral arbiter.

  **3. The Multi-Party Negotiation Simulation (Selected)**
  *   **Design:** A stakeholder roundtable tasked with signing a Memorandum of Understanding (MoU) for the object's transfer. Consensus is required, but success criteria are incompatible.
  *   **Reasoning:** This forces interaction between incommensurable frameworks. It makes "standing" (who gets to sign?) the practical obstacle, not just a theoretical point. It allows the deadlock to emerge from the *process* of trying to agree, rather than from opposing speeches.

  ---

  ### Full Design: "The Signature Protocol"

  **Objective:** Students will attempt to draft a transfer agreement for a single Benin Bronze. They will fail to sign because they cannot agree on *who has the authority to sign*, revealing that the dispute is not about facts, but about legitimacy frameworks.

  **Participants (14 Students):**
  1.  **Holding Museum Trustees (3):** Mandate: Protect the collection, ensure safety, maintain universal access. *Framework:* Legal Positivism & Universal Stewardship.
  2.  **Origin Country National Commission (3):** Mandate: Assert state sovereignty, recover national heritage for tourism/economy. *Framework:* Post-colonial State Sovereignty.
  3.  **Royal Court/Traditional Authority (3):** Mandate: Ensure ritual correctness, assert ancestral ownership (not state property). *Framework:* Restorative Justice & Ontological Claim.
  4.  **Diaspora Community Council (2):** Mandate: Ensure access for descendants, prevent state corruption of the object. *Framework:* Human Rights & Cultural Access.
  5.  **International Insurers (2):** *(The unexpected party)* Mandate: Assess risk, require clear legal title to underwrite transport. *Framework:* Liability & Contract Law.
  6.  **Mediator (1):** Mandate: Secure a signed MoU by the end of the session. No vote casting power.

  **Materials:**
  *   **Confidential Briefs:** One per role group (see below).
  *   **The Draft MoU:** A single document projected or printed. Key Clause 4 reads: *"The Receiving Party warrants they hold undisputed legal and moral title to the Object and shall indemnify the Holding Museum against future claims."*
  *   **Timer:** Visible to all.

  **Confidential Brief Highlights (The Incompatibility):**
  *   **Trustees:** You cannot sign unless the Insurers approve. You fear lawsuits from the Royal Court if you give it to the State.
  *   **National Commission:** You are the recognized government under international law. The Royal Court has no legal standing. You will not sign if the Court is listed as a co-owner.
  *   **Royal Court:** The State stole these bronzes from us twice (1897 and independence). We will block any transfer that recognizes the State as owner. The object is sacred, not state property.
  *   **Diaspora:** We distrust both the State and the Court. We want digital access and rotation, not permanent transfer to a vault.
  *   **Insurers:** You cannot underwrite unless the signatory warrants "undisputed title." If the Court claims ownership, the risk is too high.

  **Timeline (90 Minutes):**

  *   **00:00 – 00:10 (Introduction):** You set the scene. "You are not debating ethics; you are trying to move an object. Facts are agreed: looted 1897, held here, wanted there. Get Clause 4 signed."
  *   **00:10 – 00:25 (Caucus):** Roles read briefs and strategize internally.
  *   **00:25 – 00:55 (Negotiation):** Open floor. Mediator tries to draft language.
  *   **00:55 – 01:05 (The Twist):** The Mediator announces a "Live Cable" from the Museum's Legal Department: *"Board will not release object unless Receiving Party assumes full liability for any third-party claims."* (This forces the State and Court to decide who takes the risk of ownership).
  *   **01:05 – 01:10 (Final Attempt):** Desperate push to sign.
  *   **01:10 – 01:30 (Debrief):** You dismantle the simulation.

  **The Debrief (Mapping the Deadlock):**
  Do not ask "How did it feel?" Ask "Where did it break?"
  1.  **The Fact Trap:** Point out that everyone agreed on the history (looted 1897). Ask: *Why didn't that solve it?* (Answer: Facts don't dictate frameworks).
  2.  **The Standing Trap:** Ask the Insurers: *Why couldn't you insure?* (Answer: No clear title). Ask the Court: *Why wouldn't you let the State sign?* (Answer: Illegitimate standing).
  3.  **Framework Mapping:** Write three columns on the board:
      *   *Legal Title:* (Museum/State/Insurers) -> "Who owns it under current law?"
      *   *Universal Stewardship:* (Museum) -> "Who cares for it best for humanity?"
      *   *Reparative Justice:* (Court/Diaspora) -> "Who was wronged, and what repairs the harm?"
      *   *Show how the MoU required everyone to speak the language of Legal Title, which the Court and Diaspora morally could not do.*

  **Predictable Failures (First Time Run):**
  1.  **Compromise on Facts:** Students will waste time arguing *if* it was looted. *Correction:* Remind them the brief states facts are agreed.
  2.  **Majority Voting:** They will try to vote on the decision. *Correction:* Remind them the Insurers and Court have effective veto power (risk vs. legitimacy).
  3.  **Ignoring the Insurers:** They will treat the Insurers as bureaucrats. *Correction:* Highlight that without them, the object physically cannot move. They represent the "reality principle" of the legal framework.

  **Honest Note on Limitation:**
  No classroom exercise can reproduce **coercive power asymmetry**. In reality, the Museum holds the object, the guns, and the lawyers. They can simply say "No" and walk away. In this simulation, the Museum *needs* to sign to succeed. You must supply this in the debrief: "In the real world, the Museum doesn't need your consent. They hold the cards. The deadlock exists only because they are choosing to be ethical. If they stop choosing, the debate ends."

  \answer{The transfer contract requires the receiving party to warrant undisputed ownership title.}
