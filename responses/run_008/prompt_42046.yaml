answer: |-
  Good evening.

  For those who don't know me, I'm [Your Name], principal of [School Name]. I've stood at podiums for graduations, bond measures, and the occasional budget crisis. But I've never stood at one quite like this. We are here to mark the end of nineteen years of service by Marion Castellanos.

  Nineteen years is a long time to hold the center of a city together. Especially this city. We all know the statistics. When Marion arrived, we were months away from state receivership. When she leaves, we are balanced. That is a fact. The libraries are open, the bonds are rated, and the lights are on. That is also a fact.

  But public service is not just arithmetic. It is not just balancing a ledger of dollars and cents. It is also a ledger of trust, and of promises, and of the costs that do not show up on a balance sheet.

  We are a room full of people who know the history of this city. We know that saving a city sometimes requires breaking things to keep them from shattering entirely. We know about the winter of the flood. We know the river was rising. We know the Corps gave an ultimatum. And we know that Marion made a choice.

  She chose the downtown. She chose the system. And in doing so, she chose against the Eastside flats. Two weeks prior, she had told those residents their neighborhood would not be sacrificed. When the water came, that promise was broken. Four hundred homes took the water. Nobody died. The city survived.

  We also know what happened the next morning. A report was filed. It attributed the release to a sensor malfunction. It was not a malfunction. It was an order.

  There is someone in this room who was asked to co-sign that report. They refused. They resigned. They were proven right. I see you here tonight. Your presence is a reminder that integrity sometimes looks like walking away. It is a reminder that there are lines which, when crossed, change the shape of a career, and the shape of a conscience.

  Marion never publicly corrected the record. She never publicly apologized for the lie. For some in this room, that silence is a stain that cannot be removed. For others, that silence is the price of keeping the peace while the work got done.

  I am not here to litigate the past. This is a dinner, not a tribunal. But to honor a public servant honestly, we must honor the whole of the service. We must acknowledge the weight of the pen.

  There is a philosophy of leadership that suggests that to govern is to get your hands dirty. It suggests that sometimes, doing the right thing for the whole requires doing the wrong thing to the part. But it also insists that the leader must feel the dirt. They must carry the guilt. They cannot wash it off with press releases or platitudes. They have to carry it, quietly, for as long as they hold the office.

  Looking at the last decade of Marion's tenure, we see the Eastside received an outsized share of infrastructure funding. New levees. Upgraded drains. Street repairs that bypassed wealthier wards. Her supporters call it restitution. Her critics call it hush money. Perhaps it was both. Perhaps the label matters less than the concrete. Perhaps the only way she knew how to balance the ledger was to pour it into the ground, block by block, without saying why.

  That is a heavy way to govern. To manage a city by managing your own silence. To pay a debt you never acknowledged owing.

  To the Mayor's staff here tonight: You inherited a stable ship. You are right to be grateful for the stability. But do not mistake stability for purity.

  To the engineers and the planners: You are right to demand the truth on the page. Do not stop demanding it.

  And to Marion: You saved this city from receivership. You also saved it from collapse that night. But you paid for it. We can see the cost. We see it in the quiet way you've operated since that winter. We see it in the fact that you are leaving, not with a bang, but with a whimper, nineteen years later, carrying the weight of a decision that no one else in this room had to make.

  There will be no absolution offered here tonight. There is no mechanism for it. And there is no confession expected. We are not priests. We are neighbors.

  But we can acknowledge that the job asked more of you than the job description stated. It asked for your judgment, your time, and your peace of mind. You gave all of them.

  So, if you would please raise your glasses.

  We do not toast to a perfect record. We do not toast to clean hands.
  We toast to the nineteen years.
  We toast to the city that stands.
  We toast to the truth that is known, even when it is not spoken.
  And we toast to the hope that the weight you carried for us, you can finally put down.

  To Marion.
