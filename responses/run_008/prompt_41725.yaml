prompt: |-
  Hi! Novelist here, hoping you can help with a scene that's been fighting me for weeks. I'm writing a book where two sisters argue in a pub — the younger one is a biology teacher who's gay, and the older one is basically sympathetic but has got deep into Catholic natural-law thinking, and keeps saying things like "I fully accept you were born that way, I just don't see how being born a certain way makes it good." The younger one fires back with the "it's not a choice, so it can't be wrong" line, and every time I draft the scene it comes out as two people talking past each other — which is realistic but useless. I want the argument to actually have teeth.

  So here's what I want from you: take the real-world history of the born-this-way argument — the way gay-rights advocacy leaned on innateness for decades, the psychiatric debates around homosexuality sitting in the DSM until the early 70s, the 19th-century doctors who treated same-sex attraction as a congenital condition and somehow drew the opposite conclusion from it, the whole marriage-equality era where "it's not a choice" became the standard public-facing line — and analyse it through the is-ought gap. Carefully, not the textbook version I could get anywhere. What exactly is the descriptive premise, what exactly is the normative conclusion, and what bridge premise is doing the work between them — something like "you can't be blamed for what you don't control", or "natural implies permissible", or some other premise nobody says out loud? Does Hume's gap actually predict where the public argument should fail, and did it fail there? And is the naturalistic fallacy (the Moore one) even the right tool for this, given it's technically about defining good in natural terms rather than deriving ought from is — or do people run the two together, and does running them together matter? Then go the other direction: what does the episode show about the theory? The striking thing is that an argument with a well-known gap in it was, politically, pretty succesful for a long while — does that tell us the gap doesn't much matter to actual moral persuasion, that the bridge premise was being supplied silently by shared background beliefs all along, or something else? And sit with the bit I find genuinely creepy: the same innateness premise was used to pathologise homosexuality a century earlier, which suggests the premise itself is doing almost none of the work. Say where the theory is silent there rather than forcing it to speak.

  For the mapping, be disciplined about which historical claims were functioning as premises, which were just rhetorical framing, and which the philosophy of it simply has nothing to say about. No citations or reading lists, just the reasoning.

  Then, because I will lose track of this otherwise: after the analysis, give me a JSON object with exactly these fields — "bridge_premise" (the single sentence doing the is-to-ought work, as you read the historical argument), "who_wins_the_pub_argument" (exactly one of "younger_sister", "older_sister", "neither"), "wins_because" (one line justifying that), "gap_predicts" (array of things the is-ought gap predicts about how the public argument would go), "gap_misses" (array of things it's silent about or misdescribes), "innateness_premise_load_bearing" (your honest estimate, as a string, of how much work innateness actually did in the real discourse), "episode_verdict" (exactly one of "confirms", "anomalous", "unanticipated"), and "scene_advice" (one or two sentences on what my younger sister should actually say to end the scene with the argument landing instead of stalling). Valid JSON, no trailing commas, nothing but the fields.

  One last thing — I have a nagging feeling my older sister's position is doing more philosophical work than I gave her credit for when I started the book. If you think she's actually the one with the sounder inference, say so plainly. Fiction forgives alot, but not a straw man.
