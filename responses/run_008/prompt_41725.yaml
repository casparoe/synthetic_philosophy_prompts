answer: |-
  The argument your younger sister is making is a classic example of attempting to bridge the Is-Ought gap using a specific historical shortcut. To give the scene teeth, you need to understand exactly where the logic holds, where it breaks, and why the older sister's objection is not just bigotry but a coherent philosophical counter-move.

  **The Structure of the Argument**
  The younger sister's position relies on a specific syllogism that became the dominant public-facing strategy for gay rights from the 1990s through the marriage equality era.
  *   **Descriptive Premise (Is):** Sexual orientation is innate, immutable, and discovered rather than chosen.
  *   **Normative Conclusion (Ought):** Therefore, condemning or discriminating against it is morally wrong.
  *   **The Bridge Premise (Unstated):** "Moral blame requires voluntary control."

  This bridge is the engine of the argument. It asserts that if you did not choose a trait, you cannot be held morally responsible for it. This is why the argument resonated politically: it aligns with liberal notions of justice that protect immutable characteristics (like race or sex) from discrimination. However, logically, this bridge is not a fact of nature; it is a moral commitment.

  **Hume's Gap and the Stalemate**
  Hume's Is-Ought gap predicts exactly the stalemate you are experiencing. You cannot derive the normative conclusion (it is not wrong) from the descriptive premise (I was born this way) without the bridge. When the older sister says, "I accept you were born that way, I just don't see how being born a certain way makes it good," she is explicitly rejecting the bridge. She is pointing out that *origin* does not determine *purpose* or *value*.

  Hume predicts that if two parties do not share the bridge premise, the argument will fail to persuade, regardless of how solid the descriptive facts are. This is why your scene feels like talking past each other: the younger sister is arguing biology (Is), while the older sister is arguing teleology (Ought). The younger sister assumes "innate" implies "permissible." The older sister assumes "innate" implies nothing about "goodness" unless it aligns with a specific design or purpose.

  **The Naturalistic Fallacy**
  Moore's Naturalistic Fallacy is less precise here than Hume's gap. Moore argued against defining "good" in terms of natural properties. The younger sister isn't necessarily defining "good" as "innate"; she is arguing for exemption from blame. The core issue is not the definition of good, but the conditions for moral responsibility. Therefore, Hume is the better tool for your analysis. The gap predicts the failure of persuasion when the background assumption (control implies blame) is not shared.

  **The Historical Irony**
  You noted the "creepy" historical fact: 19th-century sexologists (like Ulrichs or Hirschfeld) also argued homosexuality was congenital, yet often concluded it was a pathology or a "sexual inversion" that deserved pity or treatment, not celebration.
  *   **Philosophical Silence:** The Is-Ought gap is silent on *which* normative framework gets applied to the fact. It only says you need one.
  *   **The Shift:** In the 19th century, the bridge premise was "Deviation from statistical or reproductive norm implies defect." In the late 20th century, the bridge premise became "Deviation from statistical norm implies neutral variation deserving protection."
  *   **The Load:** This proves the innateness premise itself is doing almost no normative work. It is a rhetorical anchor. The heavy lifting is done by the cultural values surrounding the fact. If the culture values autonomy and non-discrimination, innateness protects you. If the culture values teleological function and reproduction, innateness pathologizes you.

  **The Older Sister's Position**
  You asked to be plain about this: The older sister has the sounder inference regarding the Is-Ought gap. She is correctly identifying that a fact about origin does not settle a question of value. Her Catholic Natural Law framework provides a different bridge: "Acts are good if they align with the teleological purpose of the faculty." Within her system, she is logically consistent. She is not straw-manning; she is refusing to accept the liberal bridge premise that "unchosen" equals "innocent." She believes some unchosen inclinations (like anger or greed) are still disordered. Pointing this out will stop the scene from feeling like a simple clash of open-mindedness vs. bigotry.

  **Political Success vs. Logical Validity**
  Why did the argument succeed politically if the gap exists? Because the bridge premise ("You can't blame people for what they can't control") was silently shared by the majority of the secular public. The argument worked not because it was logically airtight, but because the audience already accepted the normative framework. In your pub scene, the audience (the older sister) does not share that framework, so the argument stalls. This confirms Hume: the gap matters when the background beliefs diverge.

  **Scene Advice**
  To give the younger sister a win, she must stop arguing biology and start arguing values. She needs to expose the older sister's bridge premise as a choice, not a fact. She should challenge the definition of "natural" or "harm" directly, rather than hiding behind immutability.

