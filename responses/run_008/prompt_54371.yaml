prompt: |-
  I'm in a normative ethics course right now and we just did a week on Bernard Williams's objections to utilitarianism, which I mostly followed but my friend from tutorial tried to summarize it for me afterwards and now I'm confused about whether I actually understood any of it. His summary, roughly: 'Williams's integrity objection is that utilitarianism forces you to think about everything in terms of maximizing total happiness, so if you're in a burning building and can save either your wife or a stranger, you literally have to pause and calculate which rescue produces more utility before you can act. Since a person's integrity just means staying loyal to the people and projects they care about, utilitarianism violates your integrity whenever personal loyalty and maximizing utility come apart. Williams illustrated all this with his "one thought too many" point: the utilitarian who rescues his wife because that's what maximizes happiness has one thought too many, and since this shows that utilitarians can never act out of genuine love, the theory is basically refuted.' Something about this feels off to me — I have a vague memory of the lecturer distinguishing two different Williams points (the integrity objection and the one-thought-too-many thing?) that my friend might have squashed together, but I don't trust my notes enough to say. Can you go through his summary and tell me which parts a Williams scholar would accept, which parts are subtly wrong, and whether his conclusion that utilitarianism is refuted actually follows from the parts that are accurate? Also, if the details of Williams's actual example differ from my friend's burning building version, could you explain how? I have a feeling the specifics of the example matter for what the point of it even is, and I want to walk into the next tutorial with my facts straight for once.
