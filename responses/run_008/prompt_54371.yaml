answer: |-
  Your intuition is spot-on. Your friend has conflated two distinct (though related) arguments Williams makes, and they have muddled the specific examples Williams uses. While the "vibe" of your friend's summary captures the general spirit of Williams's critique, the philosophical mechanics are imprecise enough that you would likely lose marks if you reproduced them in an essay or tutorial discussion.

  Here is a breakdown of what a Williams scholar would accept, what is subtly wrong, and how to distinguish the arguments so you can walk into your tutorial with confidence.

  ### 1. The Examples: Jim vs. The Wife
  Your friend mixed up the two most famous examples from Williams's essay *"A Critique of Utilitarianism"* (found in the book *Utilitarianism: For and Against*, co-authored with J.J.C. Smart).

  *   **The Integrity Objection uses "Jim and the Indians."**
      *   **The Scenario:** Jim stumbles upon a captain (Pedro) in a South American village who is about to execute 20 indigenous people. Pedro offers Jim a "guest's privilege": if Jim personally shoots *one* of the Indians, Pedro will let the other 19 go. If Jim refuses, Pedro will kill all 20.
      *   **The Utilitarian Verdict:** Jim must shoot the one. 1 death is better than 20.
      *   **Williams's Point:** This forces Jim to be responsible for the deaths of the 19 if he refuses. It alienates Jim from his own moral conviction that "I should not kill innocent people." It turns him into a mere channel for utility rather than a moral agent.

  *   **The "One Thought Too Many" point uses "The Drowning Wife."**
      *   **The Scenario:** A man is on a cliff. Two people are drowning: his wife and a stranger. He can save only one.
      *   **The Utilitarian Verdict:** He should save whoever maximizes utility (which might be the stranger, or the wife, but the *reason* must be the calculation).
      *   **Williams's Point:** If the husband saves his wife *because* he calculated it maximizes utility, he has "one thought too many." He should save her simply *because she is his wife*.

  **Verdict on Friend's Summary:** Your friend took the "Wife" scenario (which they changed to a burning building) and applied it to the "Integrity" objection. While both illustrate the coldness of utilitarianism, they attack different things.

  ### 2. Distinguishing the Two Arguments
  Your lecturer was right to distinguish them. Here is how they differ:

  **A. The Integrity Objection (Jim and the Indians)**
  *   **Focus:** Agency and Responsibility.
  *   **Key Concept:** **Negative Responsibility.** Utilitarianism holds you responsible for what you *fail* to prevent just as much as what you *do*.
  *   **The Harm:** It attacks your "ground projects" (the commitments that give your life meaning). If the state of the world requires you to violate your deepest convictions to maximize utility, utilitarianism demands you abandon your integrity. It separates you from your own actions.

  **B. The "One Thought Too Many" Objection (The Drowning Wife)**
  *   **Focus:** Motivation and Personal Relationships.
  *   **Key Concept:** **Impartiality.** Utilitarianism requires an impartial standpoint.
  *   **The Harm:** It makes personal love impossible or alienated. Love, by definition, involves partiality. If you have to justify your love through an impartial calculation, it isn't genuine love anymore.

  **Verdict on Friend's Summary:** Your friend squashed these together. They treated the "One Thought" point as the *proof* of the "Integrity" objection. While they support each other, they are distinct lines of attack.

  ### 3. What Your Friend Got Right (and Wrong)

  | Friend's Claim | Scholar's Verdict | Correction/Nuance |
  | :--- | :--- | :--- |
  | *"Utilitarianism forces you to think about everything in terms of maximizing total happiness."* | **Mostly Right.** | Williams argues utilitarianism requires a "neutral, impartial viewpoint" that ignores the distinction between *me* and *others*. |
  | *"Integrity just means staying loyal to the people and projects they care about."* | **Subtly Wrong.** | It's not just loyalty. It's about **agency**. Integrity is about being the *author* of your actions. Utilitarianism makes you a servant of the "general happiness," disconnecting you from your own moral life. |
  | *"Utilitarianism violates your integrity whenever personal loyalty and maximizing utility come apart."* | **Right.** | This is the core of the objection. |
  | *"Williams illustrated all this with his 'one thought too many' point."* | **Wrong.** | As noted above, "One Thought" is about the *motivation* of love; Integrity is about the *responsibility* for actions (Jim). |
  | *"Since this shows that utilitarians can never act out of genuine love, the theory is basically refuted."* | **Too Strong.** | Williams argues the theory is **unlivable** or **alienating**, not logically refuted. A utilitarian can reply, "Yes, love is an illusion, but maximizing happiness is what matters." Williams thinks that reply is absurd, but it's not a logical contradiction. |

  ### 4. Does the Conclusion Follow? ("Basically Refuted")
  Your friend claims the theory is "basically refuted." A Williams scholar would say **no**.

  Williams is not offering a logical proof that utilitarianism is false (like showing $1+1=3$). He is offering a **reductio ad absurdum of the human cost**. He is arguing that any ethical theory that demands we abandon our integrity and personal loves is *unacceptable for human beings*.

  *   **Utilitarian Response:** A sophisticated utilitarian (like a Rule Utilitarian or Indirect Utilitarian) might argue: "Actually, maximizing utility in the long run requires us to *cultivate* integrity and love. So, you should save your wife, because a society where people save their wives produces more happiness than one where everyone calculates."
  *   **Williams's Counter:** Williams anticipates this. He argues that if you only save your wife *because* it's a useful rule, you still have "one thought too many." The motivation is still corrupted.

  So, the theory isn't "refuted" in a logic-class sense, but Williams argues it should be **rejected** because it is psychologically destructive.

  ### 5. Why the Specifics of the Example Matter
  You mentioned a feeling that the specifics matter. You are absolutely right. Here is why the **Jim** example is crucial for the Integrity objection specifically:

  1.  **Negative Responsibility:** In the burning building/drowning wife case, the agent is choosing who to *save*. In the Jim case, the agent is choosing whether to *kill*. Utilitarianism says Jim is responsible for the 19 deaths if he *doesn't* kill the one. This is the doctrine of **Negative Responsibility**. Williams thinks this is absurd. I am responsible for what *I* do, not for what *Pedro* does.
  2.  **Complicity:** The Jim example forces Jim to get his hands dirty. It's not just about outcomes; it's about **moral dirt**. If you use the "Burning Building" example for Integrity, you lose the element of being forced to commit a atrocity (murder) to satisfy the utilitarian calculus.
  3.  **The "Government House" Utilitarian:** The Jim example highlights how utilitarianism can justify horrific acts if the numbers work out. The Wife example highlights how it makes relationships cold. They show different flaws.

  ### Tutorial Cheat Sheet
  If you want to impress your tutor, keep these distinctions clear:

  1.  **Correct the Example:** "My friend mentioned a burning building, but I believe Williams used **Jim and the Indians** for the Integrity objection and the **Drowning Wife** for the 'One Thought Too Many' point."
  2.  **Define Integrity:** "For Williams, integrity isn't just loyalty; it's about the connection between the agent and their actions. Utilitarianism alienates the agent from their actions via **negative responsibility**."
  3.  **Define One Thought Too Many:** "This is about the **structure of motivation**. Personal relationships require immediate partiality, not impartial calculation."
  4.  **On Refutation:** "Williams doesn't claim logical refutation. He claims utilitarianism is **unacceptable** because it attacks the projects that give life meaning."

  Your friend gave you the "sparknotes" version, which is fine for a pub conversation but dangerous for a philosophy tutorial. You spotted the conflation correctly; trusting that instinct will serve you well. Good luck!
