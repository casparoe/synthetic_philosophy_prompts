          *   Benacerraf: Maybe some states don't need prior causes in the sequence, or the limit *is* the cause, or we reject the premise that *every* state needs a discrete prior cause.
      *   *Crux 3: The Machine Wear Test.* (Physicality).
          *   Thomson: Physical constraints prove incoherence of the concept applied to reality.
