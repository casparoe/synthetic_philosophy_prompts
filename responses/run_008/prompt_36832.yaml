prompt: |-
  Longtime LessWrong lurker here, occasional commenter, was heavy into the SSC comment threads back in the day. So: I've been in a slow-burning arguement with a friend (both of us software engineers, both read way too much Hofstadter and Dennett as teenagers) about the epistemic status of the Church-Turing thesis. My position, which I'll admit I've gotten more attached to than is probably rational: the mathematical CT thesis isn't really a thesis at all, it's closer to a definition or convention. "Effectively calculable" is a vague pre-theoretic notion, Turing machines are the precise replacement, and once you make that choice there's nothing left to be true or false, any more than it could turn out false that there are 60 minutes in an hour. The fact that every attempt to precisify "computable" — lambda calculus, recursive functions, register machines, whatever — lands on the same class just shows we all had the same vague thing in mind; it's mutual calibration, not an empirical discovery about the universe. My friend says this makes me a deflationist about one of the deepest claims ever made, and that I'd have to change my tune if someone built a hypercomputer. I say no — a hypercomputer wouldn't refute anything, it would just show that "computable by a physical process" was always a different notion from "computable by an algorithm," which everyone already knew, that's the *physical* CT thesis and it's a separate thing.

  So here's the ask. You're a philosopher of mathematics who has actually taught computability theory for years, not an internet guy who watched a youtube video about Turing machines. Think carefully before you answer — maybe start with some quick brainstorming about how to frame the question, since I suspect the whole dispute turns on whether "the same vague thing in mind" is doing more work than it should. Take my position — mathematical CT is conventional/definitional, physical CT is a separate empirical claim that could genuinely be true or false — and tell me what would count against it. And I mean really against it, not just awkward for it. Would a machine that computed the halting function do it? Does it matter whether the machine runs forever, or consults a genuinely random oracle, or exploits some analog chaos thing where the uncomputability rides on infinite precision? If Penrose turned out to be right about noncomputable structure in physics, does that touch the mathematical claim at all, or only the physical one? Where exactly is the line between "this refutes my view" and "you just equivocated on the word computable"? Rank the defeaters from fatal to merely inconvenient, and be honest about whether my view has been insulated into unfalsifiability — and if it has, whether that's actually a problem for a claim of this kind, or just what inevitably happens when a vague notion gets precisified. I'd especially like you to steelman my friend's side: the strongest version of "CT is a substantial claim with real evidential support, not a stipulation." If you think the deflationary view is just confused, say so plainly and say why.

  Go deep, this is for my own understanding and possibly a follow-up blog post, not for a class, so length is fine. No citations or reading lists please — I know how to use google scholar and honestly I mostly want the actual reasoning. If you want to bring in stuff people say in the literature (the Gandy thesis thing about what physical devices can do, the analog computation debates, the weird fact that some differential equations have noncomputable solutions), just describe the argument itself rather than pointing me at papers. If it helps you calibrate what I already know: I'm comfortable with the halting problem, oracle machines, the basic recursion theory, and the distinction between a thesis and a theorem, but I've never formally studied the philosophy-of-math side of this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

