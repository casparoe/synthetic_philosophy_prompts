          *   *The "Black Box" Problem:* If a physical device solves Halting, but we don't know how (oracle), is it "effective"? The user says "effective" implies "understandable steps." This is the crux.
          *   *Analog Computation:* Real numbers vs. Integers. If physics uses continuous variables with infinite precision, can we compute non-recursive functions? User says: Measurement limits prevent this. Friend says: Maybe nature doesn't care about measurement limits.
