      *   (4) Empirical Claim: Brain-dead bodies show integrated functioning (wound healing, immune response, gestation). *This is the empirical hammer.*
      *   (5) Therefore, in those cases, the organism was alive, and WBD declared it dead. *Inference from 1 & 4.*
      *   (6) Universality Claim: Whatever makes those bodies alive is present in *any* brain-dead body (latent potential). *Inductive leap.*
      *   (7) Conclusion: No brain-death determination is safe; WBD is never reliable. *Strong conclusion.*

