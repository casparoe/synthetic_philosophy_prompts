      *   *Step (1):* Hard to attack without abandoning the "organism as a whole" standard, which is the bedrock of modern death determination. If you attack this, you're redefining death entirely (e.g., to higher-brain or personhood), which creates its own massive ethical problems.
      *   *Step (2):* This is the traditional justification, but it's vulnerable to the empirical evidence in (4).
      *   *Step (3):* Conceptual. "Integration" is the key term.
      *   *Step (4):* Empirically true. Brain-dead bodies *do* heal, gestate, regulate homeostasis (to a degree).
      *   *Step (5):* Follows if (1) and (4) are accepted.
      *   *Step (6):* **This is the critical pivot.** It moves from "some brain-dead bodies show integration" to "all brain-dead bodies possess the *kind* of integration that constitutes life." It assumes that the somatic integration observed in long-term maintenance is intrinsic to the body *independent* of the ventilator/ICU intervention, or that it represents the *same kind* of integration the brain provided.
