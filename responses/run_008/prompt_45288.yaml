          3.  Provide a "Residue Report": What translates cleanly? What requires distortion? What has no expression?
          4.  Final Verdict: Is this a genuine gap in health economics, or just a verbal disagreement (i.e., does his view collapse into existing equity-weighted CEA)?

  2.  **Deconstruct Scanlon's Contractualism (for the translation):**
      *   *Core Principle:* An act is wrong if it can be reasonably rejected by someone burdened by it.
      *   *Individualist Restriction:* Comparisons are person-to-person. You can't aggregate small burdens across many people to outweigh a severe burden on one person *unless* the small burdens are significant enough individually to generate a comparable complaint.
      *   *Aggregation Problem:* One person dying vs. $N$ people getting a headache. Scanlon says the one person can reasonably reject the policy that kills them to save the headaches, even if $N$ is very large. The claims are not additive in a utilitarian sense.
      *   *Commensurability:* Scanlon denies that all values can be reduced to a single metric (like QALYs) for summation.

  3.  **Translation Strategy (Econ $\rightarrow$ Phil & Phil $\rightarrow$ Econ):**

      *   *Reasonable Rejection:* In economics, this looks like a constraint or a veto power. It's not about maximizing the objective function; it's about satisfying minimum conditions for each agent.
      *   *Individualist Restriction:* This challenges the standard SWF $W = \sum U_i$. It suggests $W = \min(U_i)$ or a prioritarian function with infinite aversion to inequality below a threshold. It implies non-separability across persons in the utilitarian sense.
      *   *Anti-Aggregation:* This is the big one. Standard CEA sums QALYs ($\sum \Delta Q_i$). Scanlon says $\Delta Q_{death} \neq \sum \Delta Q_{headache}$. This implies a non-linear weighting function where the marginal weight of a QALY depends on the baseline severity or the *type* of loss, potentially with a discontinuity (lexical priority).

  4.  **Drafting the Restatement (Section 1):**
      *   *Goal:* Speak "Econ" but keep Scanlon's soul.
      *   *Budget Constraint:* Instead of "maximize health subject to budget," it's "allocate budget such that no individual's claim is reasonably rejected."
      *   *Equity Weights:* Standard equity weights (e.g., severity weights) are continuous. Scanlon's weights need to be discontinuous or lexicographic. A severe claim gets infinite weight relative to trivial claims.
      *   *Social Welfare Function:* Move from Utilitarian ($\sum$) to Prioritarian or Rawlsian ($\min$), but specifically *claim-based*.
      *   *Aggregation:* Reject additive separability. The objective function isn't $\sum w_i \cdot q_i$. It's more like a constrained optimization where certain thresholds of harm cannot be traded off.

  5.  **Drafting the Residue Report (Section 2):**
      *   *Clean Translations:* Severity weighting (we already do this to some extent), priority to the worse off (prioritarianism is a known alternative to utilitarianism in econ).
      *   *Distortions Required:* Scanlon's "reasonable rejection" is qualitative; econ needs quantitative parameters. Forcing a "veto" into a math model usually means setting a weight to infinity, which breaks the solver.
      *   *No Expression:* The *justificatory* aspect. Econ asks "What maximizes value?" Scanlon asks "What can be justified to each person?" The moral status of the *process* vs. the *outcome*. Also, the incommensurability of different *types* of harm (death vs. headache) beyond just magnitude.

  6.  **Drafting the Final Verdict (Section 3):**
      *   *The Crux:* Is it a gap or verbal?
      *   *Argument:* Health economics *can* model this (via extreme prioritarianism or lexical thresholds), but standard CEA *chooses* not to because it assumes commensurability for tractability.
      *   *Conclusion:* It's a genuine normative gap, not just verbal. Standard CEA assumes aggregability is *true*. Scanlon says it's *false*. You can model Scanlon, but you have to break the standard QALY summation engine. It requires moving from Cost-Effectiveness Analysis (CEA) to Cost-Benefit Analysis (CBA) with distributional constraints, or Multi-Criteria Decision Analysis (MCDA) with veto conditions.
      *   *Refinement:* It's not that econ *can't* say it, it's that the *standard toolkit* (ICERs based on sum QALYs) rules it out by definition. So the gap is in the *dominant paradigm*, not the discipline's theoretical capacity.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I use the user's vocabulary correctly? (ICER, QALY, SWF, Separability).
      *   *Check:* Did I represent Scanlon faithfully? (Don't turn him into a simple Rawlsian; keep the "reasonable rejection" nuance).
      *   *Tone:* Professional, respectful of both disciplines, analytical.
      *   *Specific focus:* Ensure the "Individualist Restriction" is mapped to "Separability." In utilitarianism, $U_{total} = U_1 + U_2$. Scanlon says the comparison is between Person A's loss and Person B's loss, not Person A's loss vs. (Person B + C + D...)'s loss. This violates additive separability.

  8.  **Final Polish:** Organize into the requested sections: Restatement, Residue Report, Final Verdict. (Proceed to generate output based on these thoughts).

