      *(Refining the "Individualist Restriction")*: In econ terms, this is about the *unit of analysis* for the objective function. Standard CEA treats the population as the unit. Scanlon treats the dyad (claimant vs. burdened) as the unit.

      *(Refining the "Residue")*: The "justification" part is key. Econ is consequentialist; Scanlon is contractualist. That's a meta-ethical gap, not just a technical one.

  9.  **Final Output Structure:**
      1.  **Translation:** Scanlonian Contractualism in Health Econ Speak.
      2.  **Residue Report:** Implementable vs. Distorted vs. Inexpressible.
      3.  **The Verdict:** Gap vs. Verbal.

