  Here is the breakdown of the candidate rules, the prediction, and the decisive experiment.

  ### 1. The Candidate Rules
  Based on her three dinner cases, she is operating under one of two implicit rules. Both fit her data so far, but they diverge on the Sleeping Beauty case.

  **Rule A: The Born-Branch Rule (The Purist)**
  *   **Logic:** Probability is strictly the squared amplitude (measure) of the *branch* defined by the macroscopic outcome. Internal structure (time, sub-branches, copies) does not inflate the branch's measure.
  *   **Fits Case 1 & 2:** Yes (follows amplitudes).
  *   **Fits Case 3:** Yes ("Win" is a macro-outcome with total weight 1/2; Bell/Whistle are just micro-details within that weight).
  *   **Prediction on Sleeping Beauty:** **2/3.**
      *   *Reasoning:* The quantum split creates a Heavy Branch (measure 2/3) and a Light Branch (measure 1/3). The fact that she wakes up twice in the Heavy Branch is a classical detail *within* that branch. It does not create new quantum measure. The probability of "being in the Heavy Branch" is simply the weight of that branch.

  **Rule B: The Centered-Weight Rule (The Thirder)**
  *   **Logic:** Probability is proportional to the sum of the measures of all *observer-moments* compatible with her current experience. She counts "awakenings" weighted by their branch amplitude.
  *   **Fits Case 1 & 2:** Yes (in Case 1, 1 awakening per branch = 1/2. In Case 2, 1 awakening per branch = 2/3).
  *   **Fits Case 3:** Yes (She sums the weights of the Bell and Whistle observer-moments to get the "Win" probability).
  *   **Prediction on Sleeping Beauty:** **4/5.**
