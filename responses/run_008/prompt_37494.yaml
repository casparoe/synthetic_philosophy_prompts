  > *   **Branch B:** Nothing happens; you remain **1 single person**.
  > *   You open your eyes. What is the probability you are in Branch A?"

  **The Verdict:**
  *   **If she says 1/2:** She is a **Born-Branch Purist (Rule A)**. She believes probability is fixed by the quantum amplitude at the split. Copying yourself a million times doesn't change the weight of the world you are in. (This is the standard Everettian position).
  *   **If she says ~1,000,000/1,000,001:** She is an **Observer Counter (Rule B)**. She believes probability is about "being a random observer." Since there are a million more of her in A, she is almost certainly in A.

  **Why this settles it:**
  If she says 1/2 here, she *must* say 2/3 on the Sleeping Beauty case (consistency requires ignoring the extra awakening). If she says ~1 here, she *must* say 4/5 on Sleeping Beauty. This experiment strips away the confusion of time and amnesia and asks the core question: **Does probability track quantum weight, or does it track the number of minds?**

  ### Summary for your dinner argument
  *   **Her likely answer:** 2/3 (Branch Weight).
  *   **The competing answer:** 4/5 (Observer Moments).
  *   **The tie-breaker:** The "Million Copies" case. If she refuses to let classical copying change the odds there, she can't let temporal copying change the odds in Sleeping Beauty.
