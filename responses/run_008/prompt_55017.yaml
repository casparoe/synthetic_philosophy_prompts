  ### Section 2: The argument
  1.  Pure strict dominance relies exclusively on ordinal preferences over outcomes. If action $A$ yields a worse result than action $B$ in every possible state of the world, rejecting $A$ requires no mathematics beyond simple comparison. It assumes the agent can distinguish outcomes and prefers more to less, but it does not assume the agent can quantify *how much* more they prefer them, nor does it require any complex cognitive machinery.
  2.  Mixed strict dominance, by contrast, fundamentally requires Expected Utility Theory (EUT). To claim a mixture $\sigma$ dominates a pure strategy $s$, we must calculate weighted averages of payoffs across opponent actions. This assumes payoffs are cardinal utilities, not just ordinal rankings. If you transform the payoffs via a non-linear monotonic function, pure dominance relations remain intact, but mixed dominance relations can vanish or appear arbitrarily.
  3.  Consider this specific 3x2 game for Player 1 (Rows T, M, B; Columns L, R): Top yields (2, 0), Middle yields (0, 2), and Bottom yields (0.9, 0.9). No pure strategy dominates Bottom. Top beats Bottom on L but loses on R; Middle beats Bottom on R but loses on L. A pure-strategy pruner leaves Bottom intact, recognizing it as a viable safe option.
  4.  However, a 50/50 mix of Top and Middle yields an expected payoff of 1 against both L and R. Since $1 > 0.9$, the mixture strictly dominates Bottom. Your solver deletes Bottom. This deletion assumes Player 1 is not only rational but capable of executing a randomized plan precisely.
  5.  If randomization carries cognitive cost or implementation overhead, which is common in software agents, Bottom might be the rational choice despite being mixed-dominated. The "aggressive collapse" you observe occurs because mixed dominance prunes strategies that are robust, simple actions in favor of fragile, complex plans that exist only in expectation.
  6.  The standard gloss claims this is just Common Knowledge of Rationality (CKR). But CKR usually implies "I know you maximize utility." Mixed dominance requires "I know you maximize utility *and* have access to a correlation device." If I doubt your ability to flip a coin, I cannot eliminate Bottom. Thus, the pruning rule encodes assumptions about physical capabilities, not just mental states.
  7.  This distinction matters for your library. Pure elimination simplifies the game structure without changing the nature of the agents. Mixed elimination changes the agent model from "chooser of actions" to "chooser of distributions." Your observation of aggressive collapse is the system detecting that most pure actions are interior points in the utility convex hull, which is a geometric fact, not necessarily a rationality fact.

  ### Section 3: Strongest objection and reply
  **Objection:** The strongest defense appeals to the Von Neumann-Morgenstern representation theorem. If an agent's preferences satisfy basic coherence axioms like continuity and independence, they *must* behave as if they are maximizing expected utility. Thus, randomization isn't an extra capability but a logical consequence of rational preference orderings over lotteries. If you accept rationality, you accept that a 50/50 lottery between Top and Middle is a valid option comparable to Bottom.

  **Reply:** This conflates normative idealization with operational reality. The vNM theorem justifies representing preferences *as if* they maximize EU, but it does not guarantee the agent has access to a costless randomization device. In computational game theory, a "strategy" is often an algorithm. A pure strategy is a deterministic function; a mixed strategy requires a random number generator and state management. If your library users model bounded agents or systems where randomness is expensive, the vNM axioms do not apply. Many automated agents operate on deterministic policies to ensure reproducibility or avoid entropy costs. For such agents, the mixture is not an available action, making the dominance claim false. Therefore, the standard gloss holds only in idealized economic contexts, not in general computational settings.

  ### Section 4: Bottom line
  Present the mixed-elimination pass as a "strong rationality reduction" rather than a default cleanup. Document that it assumes cardinal utility and costless randomization. Users modeling bounded rationality or deterministic agents should disable it. It is a heuristic that imposes specific economic assumptions, not a universal logic of choice. Label it clearly to prevent misuse in contexts where randomization is not free.
