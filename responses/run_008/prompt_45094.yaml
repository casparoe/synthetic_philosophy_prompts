  Dana: "It's textbook Simpson's, Marcus. Look at the forest plot. Overall, the drug clears the hurdle. Split by protocol? Placebo wins both times. We report the stratified results. End of story."

  Marcus: "Is it? In the kidney stone data, stone size was baseline. It didn't change because of the surgery. Here, protocol assignment happened week two. Based on clinical judgment."

  Dana: "So clinicians confounded it. They put sicker patients on intensive care. That's exactly why we stratify. You remove the imbalance."

  Marcus: "You remove imbalance only if the strata exist before treatment. If the drug worked early, clinicians downgraded them to standard care. Now 'standard care' is full of responders."

  Dana: "You're talking about mediation. But if protocol is a confounder, conditioning helps. How do you know it's not just like Berkeley admissions? Department choice looks downstream but acts as a confounder."

  Marcus: "Because department choice happened before admission decisions. Here, the protocol is partly *caused* by the treatment's early signal. Conditioning on a downstream variable opens collider bias. You might be creating the reversal."

  Dana: "Okay, I hear you. My rule assumes the third variable is upstream. If protocol is downstream, conditioning blocks the path. But the pooled estimate is garbage too. It compares intensive patients to standard patients. That's not causal. You're averaging two different treatment regimes."

  Marcus: "Finally, we agree on something. The pooled number isn't truth either. It's an average of two different care pathways. But your split assumes protocol is exogenous. It's not. You're adjusting for a variable that absorbed some of the treatment effect."

  Dana: "So I'm supposed to trust the aggregate? That feels like ignoring the structure. I need to know which stratum the patient falls into. Clinicians don't treat averages, they treat individuals."

  Marcus: "You need to know the stratum before the drug hits. If we'd randomized protocol at baseline, your split would be gold. But we didn't. We let clinicians decide based on early symptoms."

  Dana: "So what's the move? Throw out the subgroup analysis? Clinicians will want to know if the drug works under standard care."

  Marcus: "They want to know efficacy, not biased conditional probabilities. If the drug pushes patients into standard care by working, penalizing it for that is wrong."

  Dana: "But if standard care is cheaper, we need to know if it works there. Just... not this way. I hate saying 'we need more data'."

  Marcus: "Then say 'the protocol variable is post-treatment.' We analyze baseline covariates only. Or design the next trial to randomize the follow-up intensity."

  Dana: "Fine. We flag the stratification as exploratory. But don't tell me the pooled estimate is the causal truth."

  Marcus: "Never said it was. Just said your fix might break the glass worse than the crack."
