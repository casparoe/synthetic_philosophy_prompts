              3.  Innate structure vs. education (how much is born with, how to tell the difference).
              4.  Human teachers' ignorance (what pedagogy presupposes).
              5.  Imitation Game objection (upbringing vs. machine capability, with follow-up on symmetry).
          *   **Goal:** Questions must be weighted so answers would change actual lab practice.
