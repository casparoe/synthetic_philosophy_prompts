answer: |-
  # Activity Title: The Slipnet in the Room
  **Context:** Upper-level Cognitive Science Seminar (14 students, 90 minutes)
  **Topic:** Conceptual Fluidity and Analogy (Hofstadter's Copycat)
  **Goal:** To transition students from *reciting* the Copycat thesis (concepts are fluid, analogy is perception) to *experiencing* the cognitive pressure that forces conceptual slippage.

  ---

  ## Phase 1: Individual Commitment (15 Minutes)
  **Goal:** Lock in initial intuitions before social contamination.
  **Materials:** A printed handout (half-sheet) for each student.

  **Instructions to Class:**
  "You have five problems. For each, write down **one** answer and **one sentence** justifying the rule you used. Do not discuss. Do not look at your neighbor's paper. There is no trick, but there may not be a single 'correct' answer. Trust your first perception."

  **The Handout:**
  > **Name:** ___________________
  > **Rule:** *abc* changes to *abd*. What is the analogous change to the target?
  >
  > 1.  **Target:** *ijk*
  >     *   Answer: _______________
  >     *   Reason: __________________________________________________
  >
  > 2.  **Target:** *iijjkk*
  >     *   Answer: _______________
  >     *   Reason: __________________________________________________
  >
  > 3.  **Target:** *xyz*
  >     *   Answer: _______________
  >     *   Reason: __________________________________________________
  >
  > 4.  **Target:** *mrrjjj*
  >     *   Answer: _______________
  >     *   Reason: __________________________________________________
  >
  > 5.  **Target:** *dcb*
  >     *   Answer: _______________
  >     *   Reason: __________________________________________________

  *(Instructor Note: Collect these immediately after Phase 1. Do not return them until the end of class. This proves to them later that their perception shifted.)*

  ---

  ## Phase 2: Small Group Convergence (30 Minutes)
  **Goal:** Force explicit articulation of the concepts under pressure.
  **Setup:** Divide 14 students into 4 groups (two groups of 4, two groups of 3).
  **Task:** Agree on **one** answer per problem and, crucially, **one rule description** that covers all five answers consistently.

  **The Scoring Rubric (The "Coherence Score"):**
  Write this on the board. Groups are not graded on matching a "key," but on the sophistication of their rule description.
  *   **1 Point:** Consistent answer across the group.
  *   **2 Points:** The rule explicitly names the *unit* of change (e.g., "letter," "group," "string").
  *   **3 Points:** The rule explicitly acknowledges a **slippage** (e.g., "We treated 'rightmost' as 'leftmost' because...", "We slipped 'successor' to 'predecessor'").
  *   **Bonus Point:** If the group lists a rejected alternative and explains *why* it failed.

  **Instructor Role:**
  Circulate. Listen for groups that finish too fast. If a group finishes Problem 3 in 2 minutes, intervene: *"I see you agreed on $xya$. Does that rule work for Problem 5? If not, your temperature is too low. Reheat."*

  ---

  ## Phase 3: Whole-Class Debrief & Mapping (35 Minutes)
  **Goal:** Map the distribution of answers to specific conceptual slippages.

  **Step 1: The Reveal (10 mins)**
  Ask each group to hold up a whiteboard (or write on the main board) with their 5 answers and their Master Rule.
  *   *Likely Outcome:* Problem 1 will be 100% $ijl$. Problem 3 ($xyz$) and 5 ($dcb$) will show divergence.
  *   *Action:* Do not validate one answer as "correct." Instead, ask: "Group 2, you wrote $wyz$. Group 4, you wrote $xya$. Read your Master Rules aloud."

  **Step 2: Mapping the Slippages (15 mins)**
  Draw a table on the board. Columns: **Problem**, **Dominant Answer**, **Conceptual Pressure**, **Slippage Required**.

  *   **Prob 1 ($ijk$):** Pressure = None. Slippage = None. (Concepts: *Rightmost, Letter, Successor*).
  *   **Prob 2 ($iijjkk$):** Pressure = Repetition. Slippage = *Letter* $\to$ *Group*. (To get $iijjll$, you must see $kk$ as a unit).
  *   **Prob 3 ($xyz$):** Pressure = Boundary ($z$ has no successor). Slippage = *Successor* $\to$ *Predecessor* (yielding $wyz$) OR *Rightmost* $\to$ *Leftmost* (yielding $wyz$) OR *Alphabet* $\to$ *Cycle* (yielding $xya$).
  *   **Prob 4 ($mrrjjj$):** Pressure = Heterogeneous Grouping. Slippage = *Letter* $\to$ *Group* (again), but now the groups are different sizes ($m$, $rr$, $jjj$). To get $mrrkkk$, you must map $c \to jjj$.
  *   **Prob 5 ($dcb$):** Pressure = Directionality. $abc$ is ascending; $dcb$ is descending.
      *   If rule is "Rightmost letter in string $\to$ Successor": $dcb \to dcc$.
      *   If rule is "Alphabetic end $\to$ Successor": $b$ is not the end.
      *   If rule is "Same positional role": $c$ is the 'middle' concept, $b$ is the 'end' concept.
      *   *The Feeling:* Students realize "Rightmost" is not a geometric fact; it is a role assigned by the context of "Alphabetic Order."

  **Step 3: The Thesis Connection (10 mins)**
  Explicitly state: "You did not retrieve a definition of 'Rightmost' from a dictionary. You built a definition of 'Rightmost' on the spot that satisfied the pressures of the specific string. **Perceiving the string and analogizing to it were the same act.** You could not see $xyz$ without already feeling the pressure of the missing successor."

  ---

  ## The Architecture Gap: What This Activity Cannot Reproduce
  **Honesty Check:**
  You must explicitly tell the students what this human activity fails to model about Copycat. A room of 14 humans arguing is **not** a parallel terraced scan.

  **1. Serial vs. Parallel:**
  *   **Human:** You discussed problems sequentially. You argued for Answer A, then switched to Answer B.
  *   **Copycat:** Codelets explore multiple possibilities *simultaneously*. The system doesn't "switch" answers; activation levels shift until one structure wins.
  *   **Debrief Script:** "When Group 3 argued about $xyz$, you took turns speaking. In Copycat, the 'Successor' codelet and the 'Predecessor' codelet are both running at the same time, fighting for activation. You negotiated verbally; Copycat negotiates via stochastic competition."

  **2. Meta-Cognition vs. Subsymbolic Competition:**
  *   **Human:** You know you are solving a puzzle. You can say, "I am slipping the concept of 'group'."
  *   **Copycat:** Codelets have no idea what they are doing. A 'build-group' codelet doesn't know it's building a group; it just fires.
  *   **Debrief Script:** "You were able to name your slippages. Copycat cannot. It only knows temperature and activation. We are seeing the *output* of the architecture, not the *mechanism*."

  **3. Consensus vs. Coherence:**
  *   **Human:** Your groups sought consensus (social agreement).
  *   **Copycat:** The system seeks coherence (internal structural fit).
  *   **Debrief Script:** "You compromised to get points. Copycat doesn't compromise. It freezes into the structure that best reduces temperature. Don't mistake social agreement for cognitive coherence."

  ---

  ## Troubleshooting: Predictable Failure Modes
  **1. The "Puzzle Hunter"**
  *   **Behavior:** One student insists there is a single "intended" clever answer (usually the most complex one) and treats the activity as a riddle to be solved rather than a phenomenon to be explored.
  *   **Countermeasure:** In Phase 1 instructions, explicitly say: *"In the actual Copycat corpus, human respondents disagree on these problems. Divergence is data, not error."* During Phase 3, if a student asks "But what *is* the answer?", reply: *"What answer did the majority of humans give in 1995? Does that make it 'true' or just 'statistical'?"*

  **2. The "Dominant Voice"**
  *   **Behavior:** A group converges in 30 seconds because one confident student dictates the rule. They miss the "feeling" of slippage.
  *   **Countermeasure:** **The Silent Minute.** At the start of Phase 2, mandate: *"For the first 60 seconds, no one may speak. You must write your answer on the group sheet silently. Only then may you talk."* This ensures the dominant voice cannot pre-empt the individual perception of the others.

  **3. The "Literalists"**
  *   **Behavior:** Students refuse to accept slippage. For $xyz$, they insist on $xy$ (delete $z$) or $xyz$ (no change) because $z+1$ is impossible.
  *   **Countermeasure:** Validate them, then isolate them. *"That is a valid interpretation: 'Successor' implies existence. If no successor exists, the rule fails. But how do you explain that 80% of humans don't say 'Error'? What concept did they slip to allow an answer?"* This turns their rigidity into a data point about conceptual boundaries.

  ---

  ## Instructor's Cheat Sheet (The Copycat "Key")
  *Use this only to guide the debrief, not to grade.*

  1.  **$ijk \to ijl$**: (Standard) Rightmost letter $\to$ successor.
  2.  **$iijjkk \to iijjll$**: (Group) Rightmost **group** $\to$ successor. (Slippage: Letter $\to$ Group).
  3.  **$xyz \to wyz$**: (Boundary) Rightmost $\to$ **Leftmost** AND Successor $\to$ **Predecessor**. (Slippage: Direction & Position). *Alternative: $xya$ (Alphabet wraps).*
  4.  **$mrrjjj \to mrrkkk$**: (Complex Group) Map $a \to m, b \to rr, c \to jjj$. Change $c \to d$ becomes $jjj \to kkk$. (Slippage: Letter $\to$ Group, but groups are variable length).
  5.  **$dcb \to dcc$** OR **$dcb \to ccb$**: (Direction) If "Rightmost" is string-end $\to dcc$. If "Rightmost" is alphabetic-end $\to$ impossible ($b$ isn't end). If "Successor" follows string direction $\to$ $dcb \to dca$? (This problem is designed to break the "Rightmost" concept entirely).

  **Final Note to Instructor:**
  The success of this seminar depends on your comfort with ambiguity. If you look for the "right" answer, they will hunt for it. If you look for the "slippage," they will feel it. Your role is not to judge their answers, but to annotate their reasoning on the board until the vocabulary of Copycat (Pressure, Slippage, Temperature, Structure) becomes the only way to describe what just happened in the room.
