answer: |-
  The Bureau of Linguistic Standards occupied the fourth floor of a building that smelled of toner and damp wool. Its charter was simple: to maintain the Official Dictionary, the final arbiter of meaning in matters of law, inheritance, and citizenship. The definitions within were not descriptions of usage; they were constitutive. They were true by virtue of meaning alone, immune to the vagaries of the world.

  Elara sat at her desk, the entry for *Bachelor* open on her screen.
  *Bachelor (n.): An unmarried adult man.*

  It was the cornerstone entry. Section 1, Paragraph 4 of the Charter cited it as the paradigm of analytic truth. To say "a bachelor is unmarried" was to say nothing about the world, only about the word. It was supposed to be immune to revision unless the language itself drifted. But the language didn't drift; it crashed.

  The first file landed on her tray on a Tuesday. Case 44-B: The Monastery of Saint Jude. A monk had died, leaving property to the order. The state contested the inheritance, arguing the monk was a *bachelor* and thus liable for the单身 tax exemptions reserved for non-householders. The monastery argued a monk is married to God, therefore not unmarried.

  Elara rubbed her temples. If she ruled the monk was a bachelor, the definition held, but the tax code broke. If she ruled he was not, she had to explain how a man without a legal spouse was "married."

  She drafted a memo: *Exclude religious vows from the definition of 'unmarried'.*
  She checked the cross-references. *Unmarried* linked to *Marriage*. *Marriage* linked to *Contract*. *Contract* linked to *State Recognition*.
  If she excluded religious vows from *Unmarried*, she implicitly excluded them from *Marriage*. But the Charter recognized religious marriages in inheritance cases. To save *Bachelor*, she would have to fracture *Marriage*. She deleted the memo.

  Instead, she issued a ruling: *The term 'unmarried' implies eligibility for civil contract. Monks are ineligible. Therefore, not bachelors.*
  She stamped it *Confirmed*. She told herself she hadn't changed the definition; she had merely clarified the application. The world had been mistaken about the monk, not the word.

  The second file arrived on Thursday. Case 45-A: A widower, age seventy-two. He applied for a housing grant reserved for bachelors. His grandchildren protested. "He was married," they wrote. "He is a husband who lost a wife, not a man who never was one."

  Elara looked at *Adult*. The definition was *Human male past the age of legal majority*. The widower was certainly that. He was certainly *unmarried* now. By the text, he was a bachelor. By the gut, he was not.

  If she denied him, she was saying *Bachelor* meant "never married." But the text said "unmarried." To change "unmarried" to "never married" was to revise the meaning. But if she didn't, the housing grant went to a man with a pension and a family history, defeating the grant's purpose.

  She called the Senior Lexicographer, Mr. Henderson.
  "We have a conflict," she said.
  "Is the definition unclear?"
  "The definition is clear. The world is messy."
  "Then the world is wrong," Henderson said. "The Charter protects the word from the world. That is the point."
  "But if I rule the widower is a bachelor, the public loses faith in the Dictionary. If I rule he isn't, I'm rewriting the entry based on social sentiment."
  "Make the distinction," Henderson said. "That is your job. Is it a failure of application or a failure of definition?"

  Elara hung up. That was the question, wasn't it? When a statement fails, do you blame the fact (synthetic failure) or the meaning (analytic failure)? She looked at the screen. *Bachelor: unmarried adult man.*
  To save the definition, she had to twist the facts. She ruled that "unmarried" carried a historical component implicit in the social understanding of "man." A man is defined by his history.
  She stamped *Confirmed*.
  She had just changed the definition of *Man* to protect *Bachelor*.

  The third file was the breaking point. Case 46-C: A man in a common-law marriage. The state did not recognize the union. Legally, he was unmarried. Socially, he had a wife and children. He was denied a spousal visa because the bureau classified him as a *bachelor*.

  Elara sat before the web of entries. It was late. The office hummed with the sound of servers cooling.
  She tried to draft a fix for *Bachelor*.
  *Option 1: "Unmarried" means "legally single."*
  This solved the common-law case. But it broke the Monk case (who is legally single). And it made *Bachelor* entirely dependent on *Law*. If the law changed, the meaning of *Bachelor* would change. The Charter said meaning was stable; law was mutable. You couldn't build the analytic on the synthetic.

  *Option 2: "Unmarried" means "socially unattached."*
  This solved the Monk and the Widower. But "socially unattached" was vague. It required empirical investigation. You couldn't know the meaning of the sentence "He is a bachelor" without investigating his life. The sentence was no longer true by meaning alone. It was a fact claim.

  *Option 3: Add an escape clause.*
  *"Bachelor: a man whom a court would describe as unmarried."*
  She typed it out. It looked honest. It admitted that the Bureau didn't know what "unmarried" meant intrinsically; it only knew how courts used it.
  But then she looked at the ripple effect.
  If *Bachelor* depends on *Court*, and *Court* depends on *Marriage*, and *Marriage* depends on *Contract*...
  She opened the *Contract* entry. *Contract: a binding agreement enforceable by law.*
  *Law: the system of rules recognized by the State.*
  *State: the governing body of citizens.*
  *Citizen: a person recognized by the State.*

  It was a circle. A perfect, airtight circle.
  To define *Bachelor*, she needed *Unmarried*. To define *Unmarried*, she needed *Marriage*. To define *Marriage*, she needed *Law*. To define *Law*, she needed *Citizen*. To define *Citizen*, she needed... *Recognition*.
  Who recognizes? The State.
  What is the State? The body that defines the words.

  She leaned back. The distinction Henderson demanded—failure of application vs. failure of definition—was a ghost. When she ruled the monk wasn't a bachelor, she claimed she was applying the definition correctly. But she had only done so by altering the web of beliefs surrounding "marriage" and "vows." She had saved the statement "All bachelors are unmarried" from refutation by making drastic adjustments elsewhere in the system.
  She could keep any definition true, come what may, if she was willing to distort the rest of the language enough.
  She could say a monk is a bachelor, provided she redefined "unmarried" to exclude spiritual bonds.
  She could say a widower is a bachelor, provided she redefined "man" to exclude historical states.
  There was no core meaning immune to revision. There was only the web, and where you chose to cut it.

  The deadline for the quarterly update was midnight.
  Elara looked at the cursor blinking after *Bachelor (n.): An unmarried adult man.*
  If she left it, she lied. She pretended the definition stood alone, immune to the monk, the widower, the common-law husband. She pretended the boundary between word and world was sharp.
  If she changed it to the escape clause ("whom a court would describe"), she admitted the Dictionary was just a record of usage, not a foundation of truth. It would undermine the Charter. The Bureau's authority rested on the idea that they held the standards, not that they followed the crowd.

  She thought of Quine. She didn't know the name, but she knew the shape of the trap. The trap was believing that some sentences were true because of what they said, and others were true because of how the world was. She saw now they were all true because of how we held them together.

  She deleted the escape clause.
  She typed: *Bachelor (n.): A man not currently bound by a recognized marital contract, excluding those whose social status is functionally equivalent to marriage.*
  It was messy. It was empirical. It relied on "recognized" and "social status" and "functionally equivalent." It was not analytic. It was not true by meaning alone. It was a instruction on how to navigate the web.

  Then she highlighted the revision date.
  The system default was *Today's Date*.
  She backdated it. *Effective: January 1, 1950 (Founding).*
  She hesitated. This was the final dogma. Pretending that the pragmatic choice she had just made—a choice driven by tax codes, housing grants, and social intuition—had always been the meaning. Pretending the revision was a discovery.
  If she dated it today, she admitted the meaning had changed. If she backdated it, she maintained the fiction that the meaning was eternal, and only the world's understanding of it had improved.

  The Charter required the latter. The truth required the former.
  Elara looked at the hum of the servers, the corporate body of the Bureau holding its breath.
  She clicked *Effective: January 1, 1950*.
  She stamped *Confirmed*.
  She saved the file.
  The distinction remained intact, preserved by a lie about time. It was not that the definition was immune to experience. It was that she had adjusted the history to match the definition, rather than the definition to match the history. She had protected the analytic by sacrificing the factual record of her own work.

  She closed the laptop. The office was dark. She walked to the window and looked out at the city, where people were marrying, divorcing, living together, and dying, none of them waiting for her stamp to decide what their lives meant. The words were just tools, and she had been trying to treat them like laws of physics.
  Tomorrow, there would be a new case. A woman seeking the status of "head of household." A new word to break. She would fix it again, tweaking the web, pretending the thread she pulled was the center holding everything else up.

  ***

  **Author's Note**

  This story attempts to dramatize W.V.O. Quine's critique of the analytic/synthetic distinction from "Two Dogmas of Empiricism." The Bureau's Charter represents the dogma that some truths are true by meaning alone (analytic), independent of fact. Elara's casework illustrates Quine's argument that no statement is immune to revision in the face of recalcitrant experience (the monk, the widower).

  The scene where Elara maps the cross-references (*Bachelor* → *Unmarried* → *Marriage* → *Law* → *State*) dramatizes Quine's concept of holism: our statements face the tribunal of experience not individually, but as a corporate body. To save the definition of "bachelor," she must distort related concepts ("man," "contract"), showing that the boundary between linguistic convention and empirical fact is arbitrary.

  The ending—backdating the revision—addresses the status of the distinction. Quine argues the distinction is an unempirical dogma, a metaphysical article of faith. By backdating the change, Elara preserves the *appearance* of analyticity (eternal truth) while practicing synthetics (pragmatic adjustment). This suggests the distinction is not false in practice, but indefensible in principle; it is maintained only by obscuring the pragmatic choices that sustain it.

  One divergence: Quine would likely reject the Bureau's premise that definitions have institutional force independent of usage. The story grants the Bureau this power to create the tension, whereas Quine would argue the Bureau is merely recording usage all along. The fiction treats the dogma as a functional reality to show the cost of maintaining it.
