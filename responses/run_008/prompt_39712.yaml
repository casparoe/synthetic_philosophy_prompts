answer: |-
  Your diagnosis is sharp and captures the dialectical exhaustion many feel regarding the Principal Principle (PP) and Humean Supervenience (HS). However, I would refine your hypothesis: the dispute is not *merely* verbal, but it is **metaphilosophically entangled**. The stalemate persists not because the sides are answering different questions, but because they disagree on **which question has authority over the concept of "chance."**

  Here is the breakdown of the diagnosis, the substantive core, and the path to progress.

  ### 1. Is it Verbal or Substantive?
  Your hypothesis is **mostly right, but misses the explanatory stake.**

  *   **The Verbal Element:** You are correct that the deadlock often functions as a tug-of-war over conceptual authority.
      *   **Anti-Humeans** treat the PP as a *conceptual truth* (a platitude). If a candidate for "chance" doesn't satisfy the PP (or Lewis's New Principle), it isn't chance.
      *   **Humeans** treat chance as a *theoretical posit* derived from the Best System. If the PP needs patching to fit the Best System, so be it.
      *   To this extent, they are arguing over who gets to keep the word "chance." If the Humean calls their function $C_H$ and the Anti-Humean calls theirs $C_A$, they could logically coexist.

  *   **The Substantive Element:** The fight remains substantive because both camps claim their concept is the one **scientific practice actually latches onto.**
      *   If Humeans are right, scientific probability is ultimately about summarizing patterns in the mosaic.
      *   If Anti-Humeans are right, scientific probability is about tracking causal powers or propensities.
      *   This is not verbal; it is a disagreement about the **metaphysics of science.** If you are a Humean, you must argue that physics doesn't need propensities to do its job. If you are an Anti-Humean, you argue that Humean chances cannot explain *why* the regularities hold (the "explanation problem").

  **Verdict:** The PP stalemate is verbal *in form* (deference vs. definition), but it is a proxy for a substantive disagreement about **ontological parsimony vs. explanatory depth.**

  ### 2. What Would Count as Progress?
  You asked for concrete markers of progress. I see three possibilities, ranked by likelihood:

  1.  **Conceptual Split (Most Likely):** The field effectively accepts two concepts but refuses to rename them. We already see this with Lewis's "New Principle" (NP). Progress would look like explicitly acknowledging that **Humean Chance** (subject to undermining futures, requires NP) and **Propensity Chance** (not subject to undermining, satisfies original PP) are distinct theoretical tools. Progress is admitting the PP is not a universal principle but relative to the metaphysics of chance.
  2.  **Pragmatic Adjudication (Most Useful):** Progress comes from analyzing scientific practice. Do physicists worry about undermining futures? Generally, no. They treat probabilities as fixed by current conditions. This suggests the Anti-Humean concept is closer to *practice*, while the Humean concept is closer to *fundamental metaphysics*. A resolution would involve showing which concept is indispensable for specific scientific explanations (e.g., quantum mechanics vs. statistical mechanics).
  3.  **Dissolution (Least Likely):** Giving up on "chance" entirely in favor of decision-theoretic primitives. This is too radical for most working metaphysicians.

  **Recommendation:** Do not give up, but stop trying to solve the PP *in a vacuum*. The progress lies in **conceptual engineering**. Instead of asking "Which side is right?", ask "Which concept does the work we need 'chance' to do in this specific context?"

  ### 3. Confidence and Uncertainty

  **Confidence Level:** **75%**

  **The Diagnosis:** I am highly confident that the stalemate is driven by conflicting intuitions about conceptual authority (epistemology first vs. metaphysics first). The literature supports the view that the "Undermining Futures" problem (which drives the PP vs. NP debate) is the technical manifestation of this deeper clash.

  **The Step I Am Least Sure About:**
  I am least certain about the **sociological trajectory of the field regarding the "Conceptual Split."**
  *   *Why:* Philosophers are notoriously resistant to bifurcating core concepts (like "knowledge," "truth," or "chance") because it feels like conceding that the original project failed. While *I* think a split is the rational path to progress, the field may continue to treat it as a single concept for another 40 years, generating diminishing returns. My uncertainty lies in predicting whether the community will accept a pluralistic ontology of chance or continue to fight for monism.

  ### Summary
  You are right that the debate feels verbal because both sides are protecting different intuitions about the *role* of chance. But it is grounded in a substantive disagreement about whether the world's structure (Humean) or the agent's rationality (Functionalism) gets to dictate the metaphysics. Progress requires stopping the fight over the *word* "chance" and starting a comparative analysis of the *utility* of Humean vs. Non-Humean probability functions in specific scientific contexts.

  **Confidence:** 75%
  **Least Certain Step:** Whether the philosophical community will accept a conceptual split as a valid resolution rather than viewing it as a failure of analysis.
