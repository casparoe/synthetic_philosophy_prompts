      *   *The Collapse:* Rand treats "altruism" as a *cause* of societal collapse. Biology treats "altruism" (fitness cost) as a *phenomenon* that requires explanation (kin selection, etc.). Rand's "altruism" is actually "maladaptive indiscriminate helping."
