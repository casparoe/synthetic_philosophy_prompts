prompt: |-
  I'm an evolutionary biologist by training — postdoc, I mostly do kin-selection modelling and work on social traits in microbes, so the vocabulary I actually think in is inclusive fitness, relatedness coefficients, cost-benefit accounting in fitness terms, kin selection, reciprocity, byproduct mutualism, greenbeard effects, producers and cheats, and the occasional multilevel selection blowup on twitter. Lately I've been reading Ayn Rand out of cultural-literacy curiousity (my brother-in-law is a big fan and won't leave it alone) — The Virtue of Selfishness, chunks of Atlas Shrugged — and her whole attack on "altruism" keeps tripping my ear, because altruism already means something precise to me, and it doesn't mean what she means.

  So do me a translation: restate her position — her claim that altruism in roughly the Comtean sense, the doctrine that living for others is the standard of moral value so that an act is moral insofar as it sacrifices your interests to others', is the root of collectivism and the "looter" mentality — in my vocabulary, as faithfully as you can. And restate her alternative, rational egoism with the trader principle, value-for-value exchange where nobody is sacrificed to anybody, the same way. Where does this map onto fitness bookkeeping? Is her altruism anything like our altruism (a fitness cost to the actor, a fitness benefit to the recipient, regardless of intent)? Is the trader principle just reciprocity, or byproduct mutualism, or something like a well-enforced mutualism with punishment of cheats? Is her picture of altruists-and-looters basically hosts and parasites in a cooperative system?

  Then I want the residue report, because my hunch is the translation collapses fast. Our sense of altruism is purely an accounting of fitness effects with no motivation and no normative standard in it at all — we literally had to stop calling reciprocal altruism "altruism" in our sense because once the benefit comes back, the accounting says it isn't. So strip her claim of everything with no fitness-counterpart — the moral standard, sacrifice-as-such, the whole victimhood framing — and tell me what's left standing, wether it's anything. And then the actual question: is the leftover residue something my vocabulary is missing (normativity, what a moral code is even for), or is it a sign that her position was never as clear as it sounded? I'd like you to be honest about which, and not flatter either side — my brother-in-law is bad enough.
