      *   **Rational Egoism/Trader Principle:** Every man is an end in himself. Trade value for value. No sacrifice of self to others, nor others to self. Voluntary exchange of mutual benefit.
      *   **Looters/Parasites:** Those who seek values without producing them, relying on the sacrifice of others.

  3.  **Translate to EvoBio Vocabulary:**

      *   *Rand's Altruism:*
          *   In Bio: An act where $\Delta W_{actor} < 0$ and $\Delta W_{recipient} > 0$.
          *   Rand's Twist: She focuses on the *intent* and the *moral imperative* to maximize $\Delta W_{recipient}$ even when $r \approx 0$ and no reciprocity is expected. She views this as a systemic vulnerability.
          *   Translation: A强制 (forced) strategy where agents are selected (culturally/memetically) to incur fitness costs ($c$) for unrelated recipients ($r=0$) without expectation of direct or indirect return. This looks like maladaptive self-sacrifice in a selection context.

      *   *Rand's Trader Principle:*
          *   In Bio: Strict reciprocity ($c < b$, delayed return) or Byproduct Mutualism (immediate net benefit, $c \approx 0$ or negative cost).
          *   Translation: Conditional strategies. "Tit-for-Tat" or "Win-Stay, Lose-Shift". Exchange of goods/services where $\Delta W_{actor} \ge 0$ and $\Delta W_{partner} \ge 0$. No net fitness loss. Enforcement mechanisms against cheats (punishment).

      *   *Looters/Parasites:*
          *   In Bio: Cheaters, free-riders, social parasites.
