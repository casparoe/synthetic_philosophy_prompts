answer: |-
  This is a category error waiting to happen, but a fascinating one. You are working with *ultimate* causes (fitness consequences), while Rand is prescribing *proximate* mechanisms (psychological motives) and wrapping them in a normative framework.

  Here is the translation of Objectivist ethics into your fitness bookkeeping, followed by the residue report and the verdict.

  ### Part 1: The Translation

  **1. Rand's "Altruism" (The Comtean Standard)**
  *   **Rand's Definition:** An ethical doctrine holding that man has no right to exist for his own sake, that service to others is the only justification of his existence, and that self-sacrifice is the highest moral duty.
  *   **EvoBio Translation:** A culturally transmitted strategy (meme) that enforces a behavioral phenotype where $\Delta W_{actor} < 0$ and $\Delta W_{recipient} > 0$, *independent* of relatedness ($r \approx 0$) and *independent* of expected future return (no reciprocity).
  *   **In your terms:** This is maladaptive indiscriminate helping. It is a strategy that violates Hamilton's Rule ($c < rb$) because it mandates $c > 0$ even when $r=0$ and $b_{returned}=0$.
  *   **The "Looter" Dynamic:** Rand argues this creates a selective environment for "looters." In your vocabulary, this is the invasion of **cheats** (free-riders). If a population is culturally selected to accept $c > 0$ without requiring $b_{returned}$, it creates a niche for individuals who maximize their own $W$ by extracting benefits from the "altruists" without paying costs. The "altruists" go extinct (or are drained of resources), and the "looters" crash the system.
  *   **Host/Parasite Mapping:** Yes. Rand's "altruist" is a host programmed not to mount an immune response. Rand's "looter" is a social parasite.

  **2. Rand's "Rational Egoism" (The Trader Principle)**
  *   **Rand's Definition:** Man is an end in himself. Trade value for value. No sacrifice of self to others, nor others to self. Voluntary exchange of mutual benefit.
  *   **EvoBio Translation:** A conditional strategy enforcing $\Delta W_{actor} \ge 0$ and $\Delta W_{partner} \ge 0$.
  *   **In your terms:** This is **Byproduct Mutualism** (where the cost of helping is negligible or negative because the act benefits the actor directly) or **Strong Reciprocity** (where $c > 0$ initially, but $b_{returned} > c$ over time, enforced by punishment of non-cooperators).
  *   **The "Trader":** A trader is an agent playing a Tit-for-Tat or Win-Stay/Lose-Shift strategy. They only engage in interactions where the inclusive fitness payoff is non-negative.
  *   **Enforcement:** Rand's emphasis on "justice" (punishing cheats) maps to **costly punishment** mechanisms that stabilize cooperation against invasion by cheats.

  **3. The "Victimhood" Framing**
  *   **Rand's Claim:** Altruism requires a victim (the self) and a beneficiary (the other).
  *   **EvoBio Translation:** This is a claim about zero-sum vs. positive-sum games. Rand argues that Comtean altruism treats fitness as zero-sum (my loss is your gain). Her "Trader" principle argues for positive-sum interactions (synergy), where total $W$ increases for both parties.

  ---

  ### Part 2: The Residue Report

  Now we strip the normativity. We remove "moral duty," "virtue," "rights," "sacrifice-as-such," and "human essence." We look only at the structural claims about interaction dynamics.

  **What is stripped away:**
  1.  **Intent/Motivation:** Biology doesn't care if a microbe secretes siderophores because it "wants" to help or because of a metabolic byproduct. Rand cares intensely about the *motive* (duty vs. self-interest).
  2.  **The "Ought":** Biology describes stable strategies; Rand prescribes them as moral absolutes.
  3.  **The Definition of Altruism:** You define altruism by *outcome* (fitness cost). Rand defines it by *intent* (sacrifice).

  **What is left standing (The Residue):**
  1.  **Stability Condition:** A social system where agents are culturally selected to incur fitness costs ($c$) for unrelated others ($r=0$) without enforcement of reciprocity is evolutionarily unstable. It will be invaded by cheats.
  2.  **Exchange Condition:** Long-term social cooperation requires mechanisms (cultural or genetic) that ensure $\sum \Delta W \ge 0$ for the actor over time.
  3.  **Signal Reliability:** Rand's "Trader" requires honest signaling of value. If agents can fake value (fraud), the system collapses. This maps to **greenbeard reliability** or **costly signaling**.

  **Does the translation collapse?**
  Yes, but not where you might expect. It collapses on the definition of **Sacrifice**.
  In your vocabulary, a parent caring for offspring is "altruistic" (costly) but adaptive ($r=0.5$). Rand would call this "selfish" (because it serves your genetic interest/values).
  In your vocabulary, reciprocal trade is "reciprocal altruism" (temporarily costly). Rand calls this "trading."
  The collapse happens because Rand conflates *fitness cost* with *psychological sacrifice*. She assumes that if an act benefits you (fitness-wise), it cannot be "altruistic" in her moral sense. She is essentially arguing that **all adaptive behavior must be psychologically egoistic.**

  ---

  ### Part 3: The Verdict

  **Question:** Is the leftover residue something your vocabulary is missing (normativity, what a moral code is even for), or is it a sign that her position was never as clear as it sounded?

  **Answer:** It is a sign that her position relies on a category error, but the residue points to a specific game-theoretic insight that biology already covers without the metaphysics.

  **1. Is Biology Missing Normativity?**
  No. "Normativity" in human societies is a **coordination technology**. It is a set of heuristics that allows agents to solve Prisoner's Dilemmas and Coordination Games without calculating fitness coefficients every time.
  *   When Rand says "You *ought* not sacrifice yourself," she is proposing a cultural heuristic: *"Adopt a strategy that defects against unconditional demanders."*
  *   Biology explains *why* that heuristic might spread (it prevents cheat invasion).
  *   Biology does not need the "ought." The "ought" is just the user-interface for the underlying selection pressure.

  **2. Is Rand's Position Unclear?**
  Her position is clear, but it is **reification**. She takes a description of a stable evolutionary strategy (conditional cooperation, no net fitness loss) and reifies it into a metaphysical law of "Human Nature."
  *   **The Error:** She assumes that because a strategy is stable (Trader Principle), it is "moral." She assumes that because a strategy is unstable (Unconditional Sacrifice), it is "immoral."
  *   **The Reality:** Unconditional sacrifice *is* unstable in non-kin groups. But so is unconditional selfishness (defection). The "Trader Principle" is just **Tit-for-Tat with forgiveness**.

  **3. The Honest Assessment:**
  Your vocabulary is not missing anything. Rand is essentially describing **Evolutionarily Stable Strategies (ESS)** for large-brained primates with culture, but she is dressing it up as rationalist metaphysics.

  *   **Her "Altruism"** = Maladaptive indiscriminate helping (susceptible to cheat invasion).
  *   **Her "Egoism"** = Conditional cooperation / Reciprocity / Byproduct Mutualism (ESS).
  *   **Her "Morality"** = A cultural enforcement mechanism to keep agents playing the ESS.

  **Where she fails the bio test:**
  She ignores **Kin Selection**. She treats all "others" as $r=0$. If you include kin, "sacrifice" (costly helping) is "selfish" (inclusive fitness maximizing). Rand hates this. She wants a clean break between "self" and "other." Biology says that boundary is fuzzy ($r$ varies from 0 to 0.5).
  She also ignores **Multilevel Selection**. Groups of "traders" might outcompete groups of "looters," but groups of "altruists" (high cohesion) might outcompete groups of "traders" in inter-group conflict. Rand assumes the individual is the only unit of selection that matters.

  **Conclusion:**
  Tell your brother-in-law this: Rand's "Trader Principle" is a layman's description of **Reciprocal Altruism enforced by punishment**. Her attack on "Altruism" is an attack on **maladaptive strategies that incur costs without inclusive fitness benefits**.

  She isn't offering a new metaphysics; she's offering a **cultural immune system** against free-riders. But she mistakes the immune response (moral condemnation of sacrifice) for the fundamental law of life. Your vocabulary covers the mechanics perfectly; her vocabulary adds a layer of emotional/motivational judgment that biology treats as proximate mechanism, not ultimate cause.

  The residue isn't a missing piece of biology. It's a **folk psychology of game theory**. It's useful for navigating social contracts, but it doesn't map onto fitness bookkeeping any better than standard evolutionary game theory does. In fact, it maps worse, because it refuses to acknowledge that "self-interest" (inclusive fitness) often looks exactly like "sacrifice" (costly helping) when $r > 0$ or when reputation is at stake.
