  5.  **The Residue Report (The Critical Step):**
      *   *Strip Normativity:* Biology deals with *is* (fitness outcomes), Rand deals with *ought* (moral justification).
      *   *Strip Motivation:* Biology doesn't care *why* a microbe secretes siderophores (intent), only the fitness consequence. Rand cares deeply about the *reason* (sacrifice vs. trade).
      *   *What's Left?*
          *   Rand: "Don't let others drain your resources without return."
