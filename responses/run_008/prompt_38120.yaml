      *   *Even Better for a High Schooler:* **Context-Dependent Ambiguity Attitude based on Perceived Information Symmetry.**
      *   *Let's look closer at Case 3:* Known 30% vs. Unknown. If I pick Unknown, I might hope it's >30%. If I pick Known, I *know* it's low. This is often explained by the *optimism* parameter in ambiguity models when probabilities are low.
