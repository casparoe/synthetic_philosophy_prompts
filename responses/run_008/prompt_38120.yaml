      *   *Simpler:* **The Principle of Epistemic Trust.** (Trust known frequencies over unknown distributions, unless the known frequency is poor and the source of uncertainty is benign).

      *   *Wait, I need to address Case 2.* Case 2 is the Ellsberg Paradox. It violates Savage's axioms. Any coherent principle must say "Case 2 is irrational."
      *   *So the principle must overturn Case 2.*
      *   *Case 3:* If I assume a uniform prior on the mystery box, EV = 50%. 50% > 30%. So Case 3 is consistent with Laplace. Case 1 (50% vs Unknown) implies aversion because EV is same (50%), but variance is higher.
      *   *So:* **Laplacean Expectation with Ambiguity Penalty.**
      *   *Formula:* $V(Act) = E_{prior}[U] - \lambda \cdot Ambiguity$.
