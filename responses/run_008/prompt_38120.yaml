      *   *Core:* Prefer known probabilities (Robustness) *unless* there is reason to believe the unknown distribution is favorable (Informational Symmetry/Optimism) *and* no adversary is manipulating the setup.

      *   *Let's refine for the "Expert Decision Theorist" persona.* I need to be rigorous but accessible.
      *   *Brainstorming Phase:*
