      *   *Selection:* **Adversarial-Screened Ambiguity Aversion.** (A version of MEU that relaxes when the counterparty isn't adversarial and the known odds are poor).
      *   *Actually, the most honest assessment:* The user's verdicts are inconsistent (Case 1 vs Case 3). A single principle *cannot* capture them all without declaring some irrational. The task asks to "figure out whether there's a single principle behind them." The honest answer might be "No, but here is the best reconstruction that fixes the inconsistencies."
      *   *Reconstruction:* **Robust Satisficing with Adversarial Checks.**
