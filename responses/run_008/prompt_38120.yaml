      *   *Actually, the most coherent fit for a student notebook:* **The "Competence & Control" Heuristic.** (I prefer known risks when I feel competent or when the stakes involve loss/adversaries; I accept ambiguity when I feel the potential upside is unbounded and the source is neutral).
      *   *Let's try to fit them into **Smooth Ambiguity Preference (Klibanoff et al.)** or **Alpha-MEU** but interpreted philosophically.*
      *   *Decision:* I will propose a modified **Maxmin Principle with an Adversarial Override.** This captures Case 1, 4, 5 well. It requires overturning Case 3 (or explaining it as a specific exception for low-probability gains). It explains Case 2 as a failure of consistency that the principle *should* correct.
      *   *Wait, looking at Case 3 again:* "Known 30% vs Mystery Box." If the Mystery Box is truly unknown (0-100%), the expected value *could* be 50%. If the user assumes a uniform prior (Principle of Insufficient Reason), the Mystery Box is 50%. 50% > 30%. So Case 3 is actually rational under Laplace's Principle of Insufficient Reason, whereas Case 1 (50% vs Unknown) is ambiguity aversion.
