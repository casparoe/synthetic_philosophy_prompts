      *   *Candidate D: Regret Minimization.* (Choose the option you'll least regret).
      *   *Candidate E: "Competence Hypothesis" / Source Preference.* (Heath & Tversky). People prefer bets on sources where they feel competent.
      *   *Candidate F: Weighted Utility with Ambiguity Attitude Parameter.* (Alpha-MEU). Allows switching between aversion and seeking based on context (e.g., probability level).

