answer: |-
  The phenomenon you are describing is a classic instance of **Reflexivity** (specifically **Social Reflexivity** or **Market Reflexivity**), though the specific logical outcome you identified—the recommendation invalidating itself—is precisely defined as a **Self-defeating prophecy** (or **Self-negating prophecy**).

  Here is where your description matches the established concepts, and where the edges lie.

  ### The Established Concept: Reflexivity
  In sociology (Anthony Giddens) and finance (George Soros), **Reflexivity** refers to a circular relationship between cause and effect, where the observation of a system influences the system itself. In your case, the "observation" is the EA cause prioritization ranking, and the "system" is the allocation of human capital.

  *   **Where it matches:** Your description of "criteria relative to the current distribution of attention" is the definition of a reflexive variable. The metric (neglectedness) is not independent of the observers (EAs); the observers change the metric by observing it.
  *   **Where it diverges:** Reflexivity is a broad umbrella. It covers *both* self-fulfilling prophecies (belief makes it true) and self-defeating ones (belief makes it false). Your observation is specifically about the *negative* feedback loop (success destroys the signal), whereas reflexivity can also be positive (bubble dynamics).

  ### The Specific Logic: Self-Defeating Prophecy
  Robert K. Merton coined "self-fulfilling prophecy" in 1948, but he and later sociologists also defined the opposite: a **Self-defeating prophecy**. This occurs when a prediction causes actions that prevent the prediction from coming true.

  *   **Where it matches:** This captures your core frustration: "following it is exactly what destroys it." The prediction ("This cause is high-priority/neglected") triggers the behavior (working on the cause) that falsifies the condition (it is no longer neglected).
  *   **Where it diverges:** A "prophecy" is usually a single statement. You are describing an *evaluation scheme* or *rubric*. While the rubric *generates* self-defeating prophecies, the rubric itself is a reflexive system.

  ### Why Not Goodhart's Law?
  You will often hear EA types call this **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"). While close, this is technically imprecise for your scenario. Goodhart's Law usually implies *gaming* or *distortion* of the metric (e.g., teachers teaching to the test). In your case, the metric isn't being gamed; it's being *successfully optimized*. The neglectedness disappears because the work is actually getting done, not because people are faking the data. **Reflexivity** is the more accurate term for optimization pressure changing the underlying reality.

  ### Addressing Your Boundary Cases

  **(1) The Overreaction (Swinging to "More Neglected")**
  If the crowd flees other causes so badly that the recommended cause ends up *more* neglected (perhaps because the work was counterproductive or caused backlash), this is still **Reflexivity**, but it indicates a **high-gain feedback loop** or **oscillation**.
  *   **Does it count?** Yes. Reflexivity doesn't require the system to settle into equilibrium; it only requires the feedback loop. If the reaction overshoots the mark, it's still a reflexive system, just an unstable one. In control theory, this is **instability due to feedback latency**.

  **(2) The Small Audience (Ignoring the Recommendation)**
  If only a handful of people see the recommendation, the failure of the ranking to persist is negligible.
  *   **Does it count?** Technically, yes, but practically, no. Reflexivity requires **coupling strength**. If the observer effect is too weak to move the needle of the observed system, the reflexivity exists in principle but not in magnitude. For the phenomenon to "matter" (i.e., for the ranking to be "eaten"), the audience must be large enough to shift the distribution of attention measurably. This is the difference between a *theoretical* reflexive loop and an *effective* one.

  ### Conclusion
  You have correctly identified that the EA rubric treats a dynamic, reflexive variable (neglectedness) as if it were a static, intrinsic property. The act of measurement changes the measured. While **Goodhart's Law** is the colloquial term used in those circles, the rigorous sociological and economic concept is **Reflexivity**, manifesting logically as a **Self-defeating prophecy**.

  \answer{Reflexivity}
