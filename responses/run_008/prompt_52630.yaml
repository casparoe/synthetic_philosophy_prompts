      *   **Mechanism:** Below a certain intensity of suffering ($T$), happiness and suffering aggregate normally (trade-offs allowed). Above $T$, a single instance of suffering lexically outweighs *any* amount of happiness (no trade-offs allowed).
      *   **User's Insight:** The issue isn't necessarily incommensurability (common cardinal scale is possible), but rather *aggregation rules* at the top end of the scale.
      *   **Goal:** Identify what counts against this view, evaluate standard objections (pinprick), analyze the threshold's stability (arbitrariness, sorites), rank defeaters, distinguish concessions vs. dismissals, and identify the core intuitions (e.g., procreation asymmetry).

  2.  **Initial Assessment & Strategy:**
