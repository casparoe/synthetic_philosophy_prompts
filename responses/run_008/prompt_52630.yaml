      *   *Fatal Defeater 2: Aggregation of Sub-Threshold Pains.* If I can trade happiness for pain below $T$, can enough sub-threshold pains aggregate to equal or exceed a supra-threshold pain? If yes, the threshold collapses (becomes aggregative). If no, we face a "Repugnant Conclusion" style problem where a world of mild misery is better than a world with one extreme sufferer but otherwise bliss.
      *   *Serious Defeater 3: The "Just Over the Line" Intuition.* A pain just above $T$ trumps *infinite* happiness. A pain just below $T$ can be trumped by *finite* happiness. The moral discontinuity is too sharp for the phenomenological continuity.
      *   *Awkward Defeater 4: Procreation Asymmetry.* Does LTNU imply we shouldn't procreate? If there's *any* risk of a child experiencing $>T$ suffering, is it forbidden? This might collapse into strict NU or anti-natalism, which the user might want to avoid.
