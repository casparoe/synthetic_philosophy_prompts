prompt: |-
  My friend defends conspiracy theorizing by analogy to the history of science. Semmelweis, she notes, had the data on handwashing and was nonetheless hounded out of the profession; the medical and tobacco establishments denied for decades what their own internal documents eventually confirmed. On her telling, the conspiracy theorist is doing exactly what the vindicated heretic did — refusing to defer to a consensus that has demonstrably failed before — so the reflexive epistemic penalty we attach to conspiracy theories puts us on the wrong side of history. She even anticipates the standard reply (Semmelweis had evidence; most conspiracy theorists don't) and has an answer ready: Semmelweis's evidence didn't help him at the time, so evidence-versus-no-evidence can't be what separates the heretic from the crank. Audit the analogy for me. Lay out the correspondence table — what plays the role of the heretical hypothesis, the establishment, the decisive evidence, the eventual vindication — then identify where the mapping breaks, and separate the disanalogies that actually damage her conclusion from those that don't. I'm especially interested in whether her Semmelweis reply works: does the fact that evidence sometimes loses to an entrenched consensus show that deferring to consensus is unreliable, or merely that it is imperfect? Finally, state whether her conclusion — that conspiracy theories deserve no special epistemic penalty qua conspiracy theories — survives once the disanalogies are on the table, or whether the analogy was carrying it the whole way. As you go, say how confident you are in each major verdict, and flag the single point in your audit you are least sure of.
