  2.  **Deconstruct the Analogy (Correspondence Table):**
      *   *Heretical Hypothesis:* Handwashing reduces childbed fever / Smoking causes cancer <-> The Conspiracy Theory (e.g., Flat Earth, False Flag, etc.).
