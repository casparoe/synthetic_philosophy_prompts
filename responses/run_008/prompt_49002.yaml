      *   *Decisive Evidence:* Mortality statistics / Internal Memos & Epidemiological Studies <-> What the conspiracist claims (anomalies, "do your own research," leaked snippets).
      *   *Eventual Vindication:* Acceptance of germ theory / Legal settlements & Public Health Consensus <-> (Hoped for) Exposure of the truth.
      *   *The Mechanism of Resistance:* Professional inertia, ego, corruption <-> Alleged coordinated cover-up.

  3.  **Analyze the Disanalogies (Where the mapping breaks):**
      *   *Nature of the Claim:* Semmelweis made a specific, falsifiable causal claim within an existing framework (germs, though not fully understood). Many conspiracy theories are unfalsifiable or shift goalposts.
      *   *Nature of the Opposition:* Semmelweis faced negligence and paradigm inertia. Tobacco faced *active* corruption. Conspiracists allege *active* coordination across unrelated sectors (media, gov, science) which is logistically harder to maintain than simple institutional inertia.
      *   *Quality of Evidence:* Semmelweis had *statistical* data (quantifiable reduction in death). Conspiracists often rely on anecdote, patternicity, or reinterpretation of public data.
      *   *The "Evidence at the Time" Point:* This is the crux. Semmelweis *did* have data that was replicable by others if they followed the protocol. Conspiracist "evidence" is often not replicable or relies on secret knowledge.
      *   *Base Rates:* The base rate of "lone genius against the world" being right is vanishingly small compared to the base rate of "consensus is roughly correct."

  4.  **Evaluate the "Semmelweis Reply":**
      *   *Friend's Claim:* Since evidence didn't save Semmelweis *then*, evidence isn't the marker of truth *now*. Therefore, we shouldn't penalize lack of consensus evidence.
