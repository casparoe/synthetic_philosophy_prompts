      *   *Reliability vs. Perfection:* Consensus is imperfect (Semmelweis proves this), but is it unreliable? Bayesianly, consensus is still a strong prior. Defying it requires *stronger* evidence, not *no* evidence.
      *   *Verdict:* The reply shows consensus is imperfect, not that deferring to it is generally unreliable. It fails to justify ignoring the *lack* of evidence in the present.

  5.  **Assess the Conclusion (No Special Epistemic Penalty):**
