answer: |-
  Here is the translation of the debate into your vocabulary, followed by the residue report you requested.

  ### The Translation

  You proposed a mapping: **Vague Predicate = Underspecified Requirement**; **Admissible Precisifications = Conformant Implementations**.

  Your initial pass on **Supervaluationism** is robust. In your frame, a property $P$ is supertrue of a requirement $R$ if and only if $P$ holds for every implementation $I$ that refines $R$. A truth-value gap occurs where $R$ permits $I_1$ (where $P$ holds) and $I_2$ (where $P$ fails). This is precisely how refinement calculus handles non-determinism: if the spec allows either behaviour, the spec does not determine the property.

  Your initial pass on **Epistemicism** requires correction. You mapped it to "a unique intended implementation... the customer had one machine in mind." This introduces psychology (intention) where the philosopher posits semantics (fact). Epistemicism does not claim the *customer* decided; it claims the *language usage* decided.

  **Corrected Epistemic Translation:** The requirement $R$ appears underspecified, but there exists a hidden, sharp constraint $C$ fixed by the community's historical usage of the specification language. The 'true' requirement is $R \land C$. There is exactly one set of conformant implementations, not the set of all refinements we currently accept. Our conformance suite is incomplete not because the spec is open, but because we cannot compute $C$. The boundary between 'pass' and 'fail' is crisp; our inability to locate it is an engineering limitation, not a semantic feature.

  ***

  ### Residue Report

  #### 1. Clean Translations
  You are correct that Supervaluationism becomes almost trivial in your frame. It collapses into standard refinement theory.
  *   **Supertruth** is indeed **entailment**. To ask "Is this system safe?" under a supervaluationist reading is to ask "Is safety invariant across all refinements of the spec?"
  *   **The Truth-Value Gap** is indeed **permitted divergence**. Where the spec is silent, the implementations may diverge, and any predicate sensitive to that divergence lacks a truth value relative to the spec.

  This tidiness explains why Supervaluationism is the default stance of formal methods. When you write a pre-condition that allows $x \in \{1, 2\}$, and you ask "Is $x = 1$?", the formal semantics says "undefined" or "non-deterministic". You do not posit a hidden fact about $x$; you posit a set of behaviours. The philosophical machinery of 'admissible precisifications' is simply the mathematical set of refinements you already manipulate.

  Epistemicism also clarifies, but less comfortably. It translates to the claim that **underspecification is an illusion**. In engineering, we often treat 'undefined behaviour' (e.g., in C) as a gap. An epistemicist engineer would claim that the hardware physics *does* determine the outcome, and the standard's silence is merely ignorance of the physical constraint. Translated to requirements: the 'gap' is not in the world (or the spec's meaning), but in our access to the spec's meaning.

  #### 2. Distortions
  Two significant bends occur when forcing this fit.

  **First, the Author Problem.**
  In your domain, a specification is an artefact created at $t_0$ by an agent. If there is a "hidden constraint" (the Epistemic boundary), it is natural to ask: did the author put it there?
  *   If **yes**, Epistemicism reduces to "The author meant something precise but failed to write it." This is a psychological claim about intent, not a semantic claim about truth.
  *   If **no**, then the constraint arises from 'usage'. But in engineering, usage *updates* the spec (via change requests). In natural language, usage *constitutes* the meaning without a change control board.
  *   **The Distortion:** By mapping language to spec, you smuggle in a **Change Control Board** where there is none. The Epistemicist claims the boundary is fixed by usage *without* a decision event. Your frame struggles to model a constraint that is binding but was never signed off. You are forced to posit a "silent stakeholder" (Usage) who approved the hidden constraint $C$. This makes Epistemicism look like a conspiracy of silence rather than a metaphysical fact.

  **Second, the Normative Gap.**
  Specifications are normative: an implementation *ought* to conform. Vague predicates are descriptive: a man *is* tall.
  *   Supervaluationism handles the normative well: "You may build $I_1$ or $I_2$."
  *   Epistemicism creates a compliance nightmare. If there is a sharp boundary we cannot know, then an engineer could build a system that is, in fact, non-conformant, despite passing every test derived from the written spec.
  *   **The Distortion:** In engineering, if a test suite cannot distinguish $I_{good}$ from $I_{bad}$, we usually say the spec is inadequate and rewrite it. The Epistemicist says the spec is adequate, but our access is limited. This turns a **defect in the spec** into a **limitation of the tester**. This bends the engineering practice: we assume specs are fixable; the Epistemicist assumes the meaning is fixed and we are not.

  #### 3. No Counterpart
  **Higher-Order Vagueness** has no genuine analogue in your vocabulary, and this is a limit of the engineering frame, not the philosophy.

  *   **The Philosophical Point:** Supervaluationism posits a set of admissible precisifications. But is the boundary of *that* set sharp? If 'admissible' is itself vague, you need a set of sets of precisifications. This regress is the problem of higher-order vagueness.
  *   **The Engineering Limit:** Formal methods rely on a **crisp meta-language**. The relation "implements" or "refines" is defined mathematically (e.g., trace inclusion, simulation). It is binary. Either $I$ refines $R$ or it does not.
  *   **Why it runs out:** If the refinement relation itself were vague, you could not construct a test oracle. You could not automate conformance checking. Engineering *stipulates* precision at the meta-level to function. We do not allow "vague refinement."
  *   **The Verdict:** When you encounter higher-order vagueness in a project (e.g., "The spec is vaguely worded"), you do not model it; you **escalate** it. You move from the formal model to a ticket, a meeting, or a decision. The engineering vocabulary *exits* the formal frame to resolve the vagueness. Philosophy stays inside the frame to analyse it. Therefore, your vocabulary cannot express higher-order vagueness because your vocabulary is designed to eliminate it by fiat.

  #### 4. Verdict
  Your instinct is **pragmatically correct but metaphysically flattening**.

  You suggest the dispute collapses into: "Who is entitled to close an underspecification, and when?"
  *   **Epistemicist:** Reality (or Usage) closed it long ago.
  *   **Supervaluationist:** No one has closed it; correctness is relative to the open set.

  **Where you are right:** In a software project, this *is* how the dispute resolves. If a requirement is vague, the project manager (Epistemicist stance) says "There is a right answer, find it," or the architect (Supervaluationist stance) says "Refactor the spec to make the variation explicit." The engineering workflow forces a decision that mimics one of these philosophical stances.

  **Where you are wrong:** This flattens a disagreement about **truth** into a disagreement about **authority**.
  *   The Supervaluationist is not merely saying "No one has decided yet." They are saying "There is *no fact of the matter* until a decision is made."
  *   The Epistemicist is not merely saying "We haven't found the decision." They are saying "The fact exists independent of any decision."

  In your engineering frame, 'truth' is often synonymous with 'verified conformance'. If you cannot verify it, it is 'underspecified'. This conflates **epistemic access** (can we test it?) with **semantic status** (is it true?).
  *   The Epistemicist separates these: It is true/false, we just can't test it.
  *   The Supervaluationist links them: If we can't test it (across all refinements), it lacks a truth value.

  **Conclusion:** Your instinct correctly identifies that engineering *practices* resolve the paradox by managerial fiat. However, it misses that the philosophical debate is about whether that fiat *creates* truth or *discovers* it. Your vocabulary assumes the former (specs are prescriptions we write); the Epistemicist argues for the latter (meanings are descriptions we find). The translation works for managing the project, but it silences the metaphysical claim that there is a 'right answer' hidden in the language itself, waiting to be uncovered rather than decided.
