      *Correction:* If "Heap" is the predicate, Epistemicism says for any $n$, "n grains is a heap" is either True or False. In engineering: For any input $x$, the Oracle $O(x)$ returns Pass or Fail. The spec might say "Accept inputs near 5", but Epistemicism claims there is a fact of the matter whether 4.9 is "near".
      *Better Engineering Analogy:* The Epistemicist claims the Test Oracle is deterministic and total, even if the Requirement Spec is underspecified. The Supervaluationist claims the Test Oracle is partial (returns "Inconclusive" on boundary cases).
