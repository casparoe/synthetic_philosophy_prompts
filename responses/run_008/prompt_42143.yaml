answer: |-
  No single principle captures all your verdicts without moral arbitrariness, but the **Principle of Participatory Complicity** best systematizes the coherent majority of your intuitions.

  **The Principle:** An agent is morally required to perform (or refrain from) an act if that act constitutes voluntary participation in a practice where the aggregate of such acts produces foreseeable, morally significant harm (or benefit), regardless of whether the individual act crosses a causal threshold for that outcome.

  **Clause Breakdown:**
  *   **"Voluntary participation in a practice":** This saves your **Voting** and **Bus** verdicts by framing them as joining a civic or public system rather than isolated physical events, distinguishing them from coerced acts. It also captures the **Chicken** and **Militia** cases by identifying market purchases and donations as tokens of a harmful scheme.
  *   **"Aggregate... produces foreseeable harm/benefit":** This handles the **Bucket** and **Militia** threshold cases by shifting focus from individual causation to collective output, explaining why early donors or causally idle bucket-pourers are still complicit.
  *   **"Regardless of whether the individual act crosses a causal threshold":** This directly blocks the inefficacy objection, securing the **Chicken** and **Voting** verdicts where individual causal impact is negligible.

  **Verdicts on New Cases:**
  *   **Streamer:** Watching is wrong if the content is harmful. Even if revenue rounds to the nearest thousand, your view is a token of participation in an aggregate revenue practice that sustains the streamer.
  *   **Water Usage:** Contributing to regional usage is wrong if the resulting plant causes net harm. Your metered usage is a counted unit in a practice that aggregates to a decision point, making you complicit in the outcome.

  **Incompatibility:**
  This principle cannot accommodate your **Porch Light** verdict. The principle classifies leaving the light on as wrong because it is voluntary participation in energy consumption practices whose aggregate carbon emissions cause foreseeable harm, identical in structure to the chicken case.

  **Which Verdict to Give Up:**
  You should abandon the **Porch Light** verdict. Your intuition here relies on the same causal individualism you explicitly rejected in the Chicken and Bucket cases ("changes nothing on its own"). If the lack of a specific market signal or decision-maker tracking your light exempts you, then morality becomes dependent on bureaucratic accounting rather than actual harm. Since the physical accumulation of carbon is structurally identical to the water utility case (which your intuitions likely condemn) and the chicken case (which you condemn), maintaining the Porch Light exception forces you to accept that being "counted" matters more than causing harm, which is morally arbitrary.
