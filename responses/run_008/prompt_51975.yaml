      *   *Okay, the winner for "Single Revision" is C3.* C3 claims office converts the act from impermissible to *required*. C1 says it's *wrong*. If it's required, it's hard to call it wrong in the final analysis. The fix: Office does not make the act *morally required*; it makes it *politically necessary*, creating a conflict where the agent chooses political necessity over moral constraint, incurring guilt. This resolves the "Obligatory vs. Wrong" paradox.

