      *   *Decision:* The C4 claim ("no residue attaching") is the weakest link philosophically. It contradicts standard threshold deontology (which usually admits 'remainder'). Changing C4 aligns the private/public distinction and reduces the burden on C3 to explain why politics is magically guilt-inducing.
