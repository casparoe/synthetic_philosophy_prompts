      *   *Single Revision:* Fix C3. Stop saying office makes the act *required*. Say office creates a *conflict* where the political duty overrides the moral constraint, but the moral constraint remains binding *pro tanto*. This preserves the "wrongness" (C1/C2) without contradicting the "necessity" (C1).

