      *   The biggest problem is C4. It claims private threshold deontology has *no residue*. Most threshold deontologists (even Nagel/Williams types) admit to agent-regret or moral cost. If private morality has no residue, but public morality does, the "Dirty Hands" thesis looks like special pleading for why politicians are special sinners.
      *   *Actually, looking closer:* C3 says office *converts* status. C4 says private morality *allows* it at threshold. If private morality allows it without residue, then the "Dirty Hands" phenomenon isn't unique to politics. It's just high-stakes morality.
