answer: |-
  This is an excellent instinct. Your classmate is using a aphorism to do the work of an argument, which is a classic seminar move. Chesterton's Fence is often treated as a single principle, but as you've spotted, it conflates epistemic humility (what we know) with ontological claims about institutions (what they *are*).

  Here is a menu of the three distinct claims hidden inside that one-liner, analyzed for your seminar context.

  ### 1. The Epistemic Claim (The "Trivial" Reading)
  *   **The Claim:** "You do not currently know the reason for this rule. Therefore, you are not currently justified in removing it."
  *   **Is it Plausible?** Yes. It is basic procedural rationality. It is hard to argue *for* ignorance.
  *   **Is it Burkean?** Loosely. Burke argues that individual reason is "small" compared to the collective wisdom of ages. But this specific claim is just common sense; a utilitarian or a radical would agree that you shouldn't smash things without knowing what they do.
  *   **Does it save the Convocation Rule?** **No.** It only buys time. It shifts the burden of proof to the reformers to *find* the reason. Once the reason is found (e.g., "it was just crowd control"), the fence can be moved.
  *   **Vulnerability:** If your seminar group investigates the rule and finds the origin story (crowd control) is true and the problem is solved by other means (e.g., ticketing), this claim evaporates. It is a delay tactic, not a veto.

  ### 2. The Evolutionary Claim (The "Selection" Reading)
  *   **The Claim:** "The fact that this rule has survived this long is evidence that it serves a function, even if we can't name it. Time acts as a filter; useless or harmful rules tend to get discarded by pressure or competition."
  *   **Is it Plausible?** Contingently. It works for organic customs (marriage norms, common law) but poorly for bureaucratic fiat.
  *   **Is it Burkean?** **Yes, this is the core Burkean move.** Burke views society as a partnership between the dead, the living, and the unborn. Institutions that survive have passed the test of "prescription." They contain latent wisdom.
  *   **Does it save the Convocation Rule?** **Maybe.** It argues that the rule might be doing something *else* now (e.g., fostering institutional loyalty, marking a rite of passage) that isn't in the original job description.
  *   **Vulnerability:** This is where your classmate's opponent's empirical objection hits hardest. **Path Dependence.** Many rules survive not because they are *good*, but because they are *sticky*. Bureaucracies enforce rules simply because they exist (sunk cost, administrative inertia). If the convocation rule is a bureaucratic vestige rather than a social custom, the "survival = value" equation fails. A fence put up by a corrupt landlord in 1920 might still be there, not because it's useful, but because no one paid to remove it.

  ### 3. The Opacity Claim (The "Strong" Reading)
  *   **The Claim:** "The reason for the rule is in principle inaccessible to current reason. The rule is part of a complex social web, and pulling this thread might unravel something distant and vital. We cannot know the full consequences of removal."
  *   **Is it Plausible?** Philosophically robust, but empirically risky. It treats society as a complex adaptive system where linear cause-and-effect is impossible to map.
  *   **Is it Burkean?** **Very.** This is Burke's fear of the "geometric" thinkers of the French Revolution. He believed society is too complex for abstract theory to redesign safely.
  *   **Does it save the Convocation Rule?** **Yes, effectively.** It creates a presumption against change that is nearly impossible to overcome. It says, "Even if the original reason is bad, the *removal* might be worse."
  *   **Vulnerability:** This reading can prove too much (see below). It also risks being unfalsifiable. If *any* status quo can be defended by saying "you can't know the consequences," then reform is impossible by definition.

  ---

  ### Addressing Your Specific Questions

  **1. The "Vestige" Objection (Is the strong reading false?)**
  Your classmate who claimed the strong reading fails empirically is right about **Reading #2 (Evolutionary)**. If you can show the fence is a "vestige of old compromises" (e.g., a rule kept only because the Registrar is lazy), the argument that "survival implies value" is broken.
  However, it does not refute **Reading #3 (Opacity)**. A Burkean can concede the *origin* was dumb but argue the *current integration* is deep. Example: Slavery was economically integrated into the 18th-century British empire. A Burkean might argue ending it abruptly would cause social collapse (which it did, in terms of economic shock), even if the *origin* of slavery was moral evil.
  *   **Seminar Point:** Distinguish between *origin* and *integration*. A fence can be built for a bad reason but become structurally load-bearing over time. The question is: Is convocation load-bearing, or is it peeling paint?

  **2. Is it just "Do Your Homework"?**
  **Bluntly: Yes, mostly.**
  Reading #1 is literally "do your homework."
  Reading #2 and #3 attempt to be more, but in a modern university context, they often collapse into "assume the homework will reveal a hidden benefit." If you treat Chesterton's Fence as a substantive argument against reform, it is weak. If you treat it as a **heuristic for burden of proof**, it is strong. It doesn't say "Never remove the fence." It says "The default setting is 'keep' until the reformer proves 'remove'."

  **3. The Convocation Origin Story & "Latent Functions"**
  You asked: *If we found the origin was bad (crowd control), is that enough? Or can my classmate say it has a new function?*

  *   **The Reform Argument:** If the *only* reason for the rule was crowd control, and we have tickets now, the fence is obsolete. Removing it has no cost.
  *   **The Classmate's Counter (Latent Function):** He can argue the rule now serves a *different* purpose (e.g., ensuring graduates hear the Dean's speech, creating a shared memory).
  *   **The "Proves Too Much" Trap:** You are right to worry here. If "latent function" is a get-out-of-jail-free card, you could defend anything. "Why do we have this discriminatory law?" "Well, it creates social cohesion among the dominant group."
  *   **How to Limit It:** A genuine Burkean/Chestertonian limit is **disruption cost**. You don't keep the fence because it's *good*; you keep it because *removing it is risky*.
      *   **Seminar Point:** Ask your classmate: "What is the specific risk of removal?" If he says "We don't know," press him: "Is 'unknown risk' enough to force 5,000 students to sit through a boring ceremony every year? At what point does the known burden of the rule outweigh the unknown risk of removing it?"

  ### Seminar Strategy: How to Push Back

  Don't attack Burke; attack the **application**. Here is how you can frame your intervention without name-dropping:

  1.  **Separate Custom from Bureaucracy:** "Chesterton's Fence works best for organic customs that evolved over centuries (like common law). A university attendance policy is a bureaucratic fiat created by an administrator. Does the 'wisdom of ancestors' apply to a memo from the Registrar in 1975?"
  2.  **Demand the "Disruption Mechanism":** "If we are keeping this rule because removing it might break something unseen, we need a hypothesis for *what* breaks. If the answer is just 'tradition,' that's circular. If the answer is 'students won't feel connected,' that's an empirical claim we can test."
  3.  **The Burden of Proof:** "I accept the fence analogy. But Chesterton says we must learn the use *before* removing it. We have learned the use (crowd control). The use is obsolete. The fence is ready to come down. The burden is now on the defender to find a *new* use, not just hide behind the old one."

  **Summary for your notes:**
  *   **Level 1 (Epistemic):** Common sense. Buys time, doesn't save the rule.
  *   **Level 2 (Evolutionary):** Plausible for customs, weak for bureaucracy. Vulnerable to "path dependence" objection.
  *   **Level 3 (Opacity):** Strongest defense, but risks being unfalsifiable. Requires arguing that removal costs > compliance costs.
  *   **Verdict:** The slogan is a **procedural hurdle**, not a substantive justification. It forces reformers to be thorough, but it does not make the status quo morally right.
