answer: |-
  # Colloquium Q&A Prep Sheet
  **Topic:** Consequentialist Cluelessness & The Legibility Constraint
  **Audience:** Mixed Department (Utilitarian, EA, Kantian, Decision Theory)
  **Language:** American English

  ---

  ## Part 1: The Objections (Ordered by Damage Potential)

  ### 1. The "Ad Hoc Threshold" Objection
  **Who:** The Decision Theorist
  **The Charge:** "You've introduced a 'legibility constraint,' but you haven't given us a formal account of where the threshold lies. In the literature on ambiguity aversion, we have maxmin expected utility or smooth ambiguity models. Your constraint looks like an informal, ad hoc tie-breaker. Without a principled way to set the threshold, you haven't solved the decision problem; you've just added a parameter that lets you tune the output to match your intuitions. Is this anything more than an informal gesture toward imprecise credences?"

  **Your Reply (2 mins):**
  "That's a fair challenge, and I want to be clear: I'm not proposing a new formal decision rule to replace expected utility theory in the abstract. I'm making an epistemic claim about the *inputs* to that calculation. The threshold isn't a parameter I'm tuning to get the right moral output; it's a recognition of when a probability assignment becomes epistemically void.

  Think of it like signal processing. If the noise floor is higher than the signal, you don't try to calculate the expected value of the signal; you treat it as noise. My claim is that for diffuse, feedback-resistant chains, our credences aren't just imprecise—they lack the connection to reality required to be treated as probabilities in a moral sum. I'm not trying to compete with smooth ambiguity models; I'm arguing that before we apply those models, we have to determine which variables are eligible for inclusion. The 'threshold' is the point where the causal chain becomes too complex for our cognitive architecture to track with any reliability. I concede I don't have a formula for that threshold, but I argue that lacking a formula doesn't mean the distinction between 'legible' and 'illegible' isn't real."

  **Soft Spot/Concession:**
  *   **Where you're soft:** You admit you lack a formal metric for the threshold.
  *   **Strategy:** Don't try to fake precision. Lean into the epistemic humility. Concede that this makes the view less mathematically elegant but argue it makes it more psychologically and epistemically realistic.

  ### 2. The "Null Hypothesis of Symmetry" Objection
  **Who:** The Senior Act-Utilitarian
  **The Charge:** "You claim asymmetry is the norm, but you haven't proven it. In the absence of specific evidence that one option has more uncertain downstream effects than another, symmetry is the methodological null hypothesis. If I choose A over B, why should I assume the unknown effects of A are worse than B? Unless you can demonstrate a systematic bias in the *direction* of the uncertainty, the expected value of the unknowns cancels out. You're asserting asymmetry without the data."

  **Your Reply (2 mins):**
  "I appreciate the demand for rigor, but I think the null hypothesis is misplaced here. Symmetry holds only if the causal structures of the options are roughly isomorphic. But in the cases that matter—career choice, major donations, political action—the options are structurally different.

  Take career choice: One path is highly institutionalized with clear feedback loops (e.g., clinical medicine); the other is entrepreneurial or systemic (e.g., policy advocacy). The systemic path has longer, more diffuse causal chains. It's not that we don't know the effects; it's that the *type* of uncertainty is different. One is risk; the other is structural ignorance. I'm arguing that when you intervene in complex systems without feedback mechanisms, the variance isn't symmetric around zero; it's skewed toward unintended negative consequences because complex systems are resistant to top-down control. I don't need to prove the direction of every effect, only that the *architecture* of the uncertainty differs between options."

  **Soft Spot/Concession:**
  *   **Where you're soft:** You haven't empirically proven the skew toward negative consequences.
  *   **Strategy:** Concede that you can't prove the skew in every case, but argue that the *variance* alone is enough to trigger the legibility constraint. High variance without feedback is the trigger, not necessarily negative skew.

  ### 3. The "Motivated Reasoning" Objection
  **Who:** The EA-Leaning Grad Students
  **The Charge:** "This feels like a convenient escape hatch. Effective altruism relies on comparing diffuse effects—like long-termist interventions or global health policy. By labeling high-variance, high-impact options as 'illegible,' you're systematically discounting the very interventions that demand the most sacrifice. Isn't this just motivated reasoning to let comfortable academics off the hook for not maximizing their positive impact?"

  **Your Reply (2 mins):**
  "I understand why it looks that way, especially given the work you do. But my target isn't effective altruism; it's *spurious* precision. When we run cost-effectiveness estimates on deworming versus cash transfers, we're looking at relatively short causal chains with empirical feedback. That's legible.

  The problem arises when we extend those estimates decades into the future or across complex political systems and treat the output as a precise number. I'm not saying we shouldn't give; I'm saying we shouldn't pretend we know the long-run value of that giving with enough confidence to override local, legible moral demands. If anything, this view protects EA from overreach. It prevents us from justifying harmful short-term means based on speculative long-term ends. I'm asking for epistemic honesty, not moral comfort. If the legible option turns out to be giving 50% of your income, the constraint doesn't stop you."

  **Soft Spot/Concession:**
  *   **Where you're soft:** It *does* make it harder to justify long-termist interventions.
  *   **Strategy:** Acknowledge the tension. Admit that this view is less friendly to strong long-termism but argue that's a feature, not a bug, because strong long-termism relies on epistemic overreach.

  ### 4. The "Deontology in Disguise" Objection
  **Who:** The Kantian
  **The Charge:** "You say you're saving consequentialism, but you've bolted on a constraint that ignores consequences. If an effect is real but 'illegible,' you're saying it doesn't count. That sounds like you're prioritizing the agent's epistemic position over the actual good. Haven't you just filed the serial numbers off a Kantian duty of knowledge? Once you add this constraint, nothing distinctively consequentialist remains."

  **Your Reply (2 mins):**
  "That's a sharp observation, but I disagree on the 'nothing remains' part. The criterion of rightness is still purely consequentialist: the right act is the one that produces the best outcomes. The legibility constraint is part of the *decision procedure*, not the criterion.

  Kantians argue that certain actions are wrong regardless of consequences because they violate rational agency. I'm arguing that certain consequences are *inaccessible* to calculation, so we must use a proxy. I'm not saying the consequences don't matter; I'm saying we are constitutionally incapable of accessing them reliably. It's a limitation of the knower, not a limitation on the good. Consequentialism survives because, in the long run, following the legibility constraint is what we have reason to believe will track the good better than guessing at the unknowable."

  **Soft Spot/Concession:**
  *   **Where you're soft:** The distinction between criterion and decision procedure is a classic move that can feel like a dodge.
  *   **Strategy:** Stand firm on the distinction. It's the only way to save consequentialism from cluelessness. Concede that the *practical* difference might be small, but the *theoretical* commitment to outcomes remains.

  ### 5. The "Ambiguity Aversion" Formalism Objection
  **Who:** The Decision Theorist (Follow-up)
  **The Charge:** "If you're worried about variance and lack of feedback, that's just ambiguity aversion. We have formal models for that. Why invent a new 'legibility' vocabulary instead of just applying standard ambiguity-averse decision rules? It seems like you're reinventing the wheel to avoid the mathematical implications of the existing literature."

  **Your Reply (2 mins):**
  "Standard ambiguity aversion models still require you to assign a set of priors or a range of probabilities. My claim is stronger: in these specific cases, we shouldn't assign *any* probability distribution because the causal link is broken.

  Ambiguity aversion says, 'I have a range of credences, and I'm wary of the worst case.' I'm saying, 'I have no credence here because the event is not epistemically available to me.' It's a category error to treat structural ignorance as a wide probability distribution. If I treat it as a wide distribution, I'm still playing the game of summation. I'm arguing we need to step outside the game entirely for these specific inputs. The vocabulary is different because the epistemic status is different."

  **Soft Spot/Concession:**
  *   **Where you're soft:** The line between "wide distribution" and "no distribution" is blurry.
  *   **Strategy:** Emphasize the "feedback-resistant" nature of the chains. If there's no feedback, there's no calibration, and without calibration, there's no probability.

  ### 6. The "Heuristic vs. Constraint" Objection
  **Who:** The Senior Act-Utilitarian (Follow-up)
  **The Charge:** "If following the legibility constraint leads to better consequences than trying to calculate the unknowable, then isn't the constraint just a heuristic for maximizing expected value? Why call it a constraint? If it maximizes value, it's just standard utilitarianism acknowledging human limits."

  **Your Reply (2 mins):**
  "It is a heuristic in practice, but calling it a 'constraint' highlights that there are boundaries where calculation stops being rational. If you treat it merely as a heuristic, you imply that if we were smarter, we should calculate. I'm arguing that even an ideal agent couldn't calculate these effects because the information doesn't exist in a usable form yet.

  It's not just a limit on *us*; it's a limit on the *structure of the world*. So, while it functions as a rule of thumb for humans, it represents a principled limit on consequentialist reasoning itself. It prevents the theory from demanding the impossible, not just the difficult."

  **Soft Spot/Concession:**
  *   **Where you're soft:** This borders on rule-utilitarianism.
  *   **Strategy:** Accept the label "rule-utilitarian" if necessary, but insist the rule is derived from epistemic limits, not social utility.

  ### 7. The "Long-Termism Loss" Objection
  **Who:** The EA-Leaning Grad Students (Follow-up)
  **The Charge:** "If we treat diffuse effects as noise, we lose the ability to prioritize existential risk reduction. Those effects are the definition of diffuse and high-variance. Does your view imply we should ignore x-risk?"

  **Your Reply (2 mins):**
  "Not necessarily. It depends on the legibility of the risk. If the causal chain between an action and an existential catastrophe is short and mechanistic—like building a specific type of unsafe AI—that can be legible.

  My constraint targets *diffuse* effects, like the ripple effects of donating to a charity on the global economy in 100 years. Preventing a specific, identifiable extinction event is a different causal structure. I'm not saying we ignore the future; I'm saying we ignore the *untraceable* future. We can focus on clear, present dangers without pretending to calculate the infinite ripple effects of our daily choices."

  **Soft Spot/Concession:**
  *   **Where you're soft:** Many x-risk interventions rely on long, diffuse chains.
  *   **Strategy:** Concede that this view makes *some* long-termist interventions harder to justify, but argue that's a necessary correction to overconfidence.

  ### 8. The "Greaves Comparison" Objection
  **Who:** General Audience (Lenman/Greaves Readers)
  **The Charge:** "Greaves argued that cluelessness is symmetric and cancels out. You're saying she's wrong. But without a new formal model, why should we prefer your asymmetry claim over her symmetry claim? It seems like you're just asserting the opposite."

  **Your Reply (2 mins):**
  "Greaves assumes a world where causal chains are roughly similar across options. I'm arguing that in the modern world, our options are structurally diverse. Some are local and contained; others are systemic and diffuse.

  When you choose between two similar acts, symmetry might hold. But when you choose between a local act and a systemic intervention, the epistemic positions are not symmetric. Greaves's model works for 'buying coffee vs. tea'; it doesn't work for 'donating to AMF vs. starting a political movement.' I'm updating her view for a world where our capacity for systemic intervention has outpaced our capacity for systemic prediction."

  **Soft Spot/Concession:**
  *   **Where you're soft:** You are relying on a sociological claim about modern options.
  *   **Strategy:** Frame it as an update to the theory based on changing real-world conditions.

  ---

  ## Part 2: The Question You Hope Nobody Asks

  **The Question:**
  "If the legibility constraint is justified because following it produces better consequences than ignoring it, haven't you just performed an expected value calculation to justify ignoring expected value calculations? Isn't this performatively contradictory?"

  **Why You Fear It:**
  This is the self-undermining objection. It attacks the coherence of your positive proposal. If you use consequentialist reasoning to justify a non-consequentialist decision procedure, you validate the very calculus you're trying to restrict. If you *can* calculate that the constraint is better, why can't you calculate the effects of the actions themselves? It suggests your view collapses into standard consequentialism or incoherence.

  **The Most Honest Answer:**
  "You've caught me in a reflective equilibrium. I can't justify the legibility constraint using first-order consequentialist calculation without begging the question. The justification is second-order: it's based on the history of failed predictions and the structural limits of human epistemology in complex systems.

  I'm not saying 'I calculated that ignoring calculation is better.' I'm saying 'We have overwhelming inductive evidence that trying to calculate the unknowable leads to disaster.' It's not a derivation from within the system; it's a constraint imposed on the system from the outside, based on empirical track records. So yes, it's a tension, but it's the only way to keep consequentialism from becoming a fantasy. I'm prioritizing the survival of the theory over its pure formal consistency."

  **Strategy:**
  Do not try to solve the paradox. Own it. Frame it as a necessary tension in any realistic moral theory. Admit that you are stepping outside the strict consequentialist framework to save it from itself. This shows philosophical maturity rather than evasion.
