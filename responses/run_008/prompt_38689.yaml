answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Ontology and Recoverability of Human Preferences in Computational Systems
  **Date:** October 26, 2023
  **Signatories:** Dr. R (Inverse Reinforcement Learning), Dr. K (Cognitive Psychology/Preference Construction)

  ### Preamble
  This document summarizes the outcomes of a six-month adversarial collaboration between Dr. R and Dr. K. The goal was to delineate the boundaries of agreement regarding the nature of human preferences, the validity of Inverse Reinforcement Learning (IRL) as a modeling tool, and the implications for AI alignment and behavioral prediction. Where consensus was reached, it is marked as such. Where disagreement remains, it is formalized to identify empirical cruxes.

  ---

  ### 1. Agreed Claims
  *The following propositions are accepted by both authors. We distinguish between claims settled within our collaboration and those settled within the broader scientific literature.*

  **1.1 The Conditional Guarantees of IRL**
  Both authors agree that the IRL formalism mathematically guarantees the recovery of a reward function $R$ *if and only if* the observed agent is acting as a Boltzmann-rational (or otherwise specified approximately optimal) optimizer with respect to $R$ within the observed Markov Decision Process.
  *   **[Consensus: Field]** The mathematics of IRL are uncontroversial.
  *   **[Consensus: Authors]** If the assumption of approximate optimality is violated, the recovered $R$ is merely a curve-fit to behavior without explanatory power regarding the agent's internal goals.

  **1.2 Empirical Reality of Preference Instability**
  Both authors agree that the empirical literature robustly demonstrates preference reversals, framing effects, and context-dependence in human choice behavior (e.g., Tversky & Thaler, 1990; Lichtenstein & Slovic, 2006).
  *   **[Consensus: Field]** The existence of framing effects is settled science.
  *   **[Consensus: Authors]** Any model assuming static, context-independent preferences will systematically fail to predict human choices across varying elicitation contexts.

  **1.3 Deployment Failure Modes**
  Both authors agree that systems deployed in real-world settings (e.g., recommendation algorithms, autonomous driving reward models) which assume stable latent preferences often exhibit "reward hacking" or unintended behaviors when the deployment context diverges from the training context.
  *   **[Consensus: Authors]** This is based on shared review of engineering post-mortems and case studies.
  *   **[Consensus: Field]** This is widely observed in industry, though the *cause* (model misspecification vs. fundamental human instability) remains contested in the wider literature.

  ---

  ### 2. Residual Disagreements
  *The following disagreements remain unresolved. We have phrased these positions to ensure charitable interpretation by both sides.*

  **2.1 The Status of the Approximate-Optimality Assumption**
  *   **Dr. R's Position:** The assumption that humans are approximate optimizers is an **empirical hypothesis**. It may be false, but it is subject to refinement (e.g., by adding cognitive cost terms). If the model fits well enough, the recovered reward function is a valid approximation of the latent drive, even if the optimization process is noisy.
  *   **Dr. K's Position:** The assumption that humans are approximate optimizers is a **modeling convention** that risks ontological error. If the assumption is sufficiently wrong (i.e., if behavior is constructed rather than optimized), the recovered reward function is not an "approximation" of a latent variable but a mathematical artifact. Increasing model complexity does not fix a category error.
  *   **[Substantive Dispute]** This is not merely semantic; it concerns whether better data/models will converge on a stable $R$ (R) or whether variance will persist regardless of model capacity (K).

  **2.2 The Interpretation of Elicitation Instability**
  *   **Dr. R's Position:** Instability in elicited preferences represents **measurement noise and bounded rationality**. With hierarchical models that account for context, fatigue, and framing as state variables, a stable "meta-preference" structure can be recovered.
  *   **Dr. K's Position:** Instability in elicited preferences represents **evidence of non-existence**. There is no stable quantity being measured; the "preference" is generated at the moment of query. Filtering for stability risks filtering out the actual psychological phenomenon (construction) in favor of a convenient fiction.
  *   **[Substantive Dispute]** This centers on whether residual variance approaches zero (R) or an irreducible lower bound (K) as model complexity increases.

  ---

  ### 3. Empirical Cruxes and Pre-Registered Predictions
  *To resolve the disagreements in Section 2, we propose the following concrete study. Both authors commit to accepting the outcome as evidence weighing toward their respective positions.*

  **Study Design:**
  A longitudinal IRL experiment involving $N=500$ participants.
  1.  **Phase A (Training):** Participants make 100 decisions in Context A (e.g., high-time-pressure financial trading simulation). An IRL agent infers a reward function $R_A$ for each participant.
  2.  **Phase B (Test):** Participants make decisions in Context B (e.g., low-pressure, reflective financial planning) and provide **reflective endorsements** of their choices (explicitly rating whether the choice aligns with their "true goals").
  3.  **Metric:** Predictive accuracy of $R_A$ on Context B choices, and correlation between $R_A$-optimal actions and reflective endorsements.

  **Pre-Registered Predictions:**

  *   **Dr. R's Prediction:**
      *   $R_A$ will predict Context B choices with accuracy significantly above baseline (specifically, $>65\%$ accuracy on binary choices), after controlling for observable state changes.
      *   Discrepancies between $R_A$ predictions and reflective endorsements will correlate with measurable cognitive load indicators, implying the "true" preference is $R_A$ and the endorsement is noisy.
      *   **[Falsification Condition]** If accuracy drops to chance levels ($\approx 50\%$) when context shifts, Dr. R agrees this undermines the recoverability claim.

  *   **Dr. K's Prediction:**
      *   $R_A$ will fail to predict Context B choices significantly better than a simple heuristic model that ignores latent rewards (specifically, $<55\%$ accuracy).
      *   Reflective endorsements in Context B will align with Context B choices, not $R_A$, indicating that the "preference" is constructed to match the current framing, not read out from $R_A$.
      *   **[Falsification Condition]** If $R_A$ predicts Context B choices with high accuracy ($>70\%$) despite radical framing changes, Dr. K agrees this suggests a stable latent structure exists.

  ---

  ### 4. Verdict on Verbal vs. Substantive Disputes
  *We explicitly categorize the nature of our remaining disagreements.*

  **4.1 The Definition of "Preference"**
  We identify a significant verbal dispute regarding the term "preference."
  *   **Dr. R** uses "preference" to denote *whatever latent objective function best explains the totality of behavior over time.*
  *   **Dr. K** uses "preference" to denote *the valuation constructed at the moment of deliberation or query.*
  *   **[Verbal Resolution Flag]** *By drafting Section 2.2, we have resolved this verbal dispute by agreeing to distinguish between "Behavioral Consistency" (R's focus) and "Constructive Validity" (K's focus). Future usage in this collaboration will specify "latent reward structure" vs. "elicited valuation."*

  **4.2 The Meaning of "Inference"**
  *   **Dispute:** Dr. K claims "inference" is a misnomer if no latent variable exists. Dr. R claims "inference" is valid as long as the model predicts behavior.
  *   **Verdict:** This is **Substantive**. It relies on the outcome of the Crux Study (Section 3). If $R_A$ predicts Context B, "inference" is empirically justified pragmatically (R). If it fails, "inference" is indeed a misnomer because no cross-context quantity was found (K).
  *   **[Consensus: Authors]** We agree that the utility of the term depends on the cross-context predictive power demonstrated in Section 3.

  **4.3 Normative Implications for AI Alignment**
  *   **Dispute:** Whether AI should optimize for the recovered $R$ (R) or facilitate the user's constructive deliberation process (K).
  *   **Verdict:** This is **Substantive**, but contingent on Section 2.1. If preferences are constructed, optimizing for a static $R$ is potentially harmful.
  *   **[Consensus: Authors]** We agree that until the crux in Section 3 is resolved, alignment systems should incorporate uncertainty over the stability of the reward function.

  ---

  **Signed,**

  _________________________
  **Dr. R**

  _________________________
  **Dr. K**
