          2.  Precise residual disagreements (approx-optimality as empirical claim vs. convention; instability as noise vs. non-existence). Phrased neutrally.
          3.  Cruxes (concrete studies/datasets/cases, pre-registered predictions from both sides).
          4.  Verdict on verbal vs. substantive disputes (specifically regarding the definition of "preference").
      *   **Formatting/Style:** Formal academic tone, explicit markings for settled/contested claims, flags for verbal resolutions.

  2.  **Deconstruct the Perspectives:**
      *   **Dr. R (IRL/RL):** Humans act to maximize reward (approximately). Observed behavior $\to$ Inverse RL $\to$ Reward Function. If the model is good enough, we can recover the "true" goals. Instability is noise or bounded rationality.
      *   **Dr. K (Psych/Construction):** Preferences aren't stored; they are constructed in the moment. Framing matters. "Inference" implies finding something hidden, but nothing is there to find. Instability is fundamental, not noise.

  3.  **Drafting - Section by Section:**

      *   **Header:** Title, Date, Signatories.
      *   **Introduction:** Briefly state the purpose of the collaboration (bridging IRL and Constructivist Psychology).

      *   **Section 1: Agreed Claims:**
          *   *IRL Formalism:* Both agree IRL recovers a reward function *conditional* on the assumption of optimality. If the agent isn't optimizing, the reward function is just a description of behavior, not a explanation. (Settled in math, contested in application).
          *   *Empirical Lit:* Both agree framing effects and preference reversals exist and are robust. (Settled).
          *   *Failure Modes:* Both agree that systems assuming stable preferences fail when context shifts drastically. (Settled in engineering practice).
          *   *Marking:* Need to distinguish what *they* agree on vs. what the *field* agrees on.

      *   **Section 2: Residual Disagreements:**
          *   *Issue 1: Approximate Optimality.*
              *   R: It's an empirical hypothesis. It might be wrong, but we test it.
              *   K: It's a modeling convention. If it's wrong, the "reward" is meaningless.
          *   *Issue 2: Instability.*
              *   R: It's measurement noise/bounded rationality. Better models (hierarchical, context-aware) will filter it.
              *   K: It's ontological. There is no stable latent variable to measure.
          *   *Constraint:* Phrasing must be acceptable to both. Use "Dr. R interprets X as..." and "Dr. K interprets X as..."

      *   **Section 3: Cruxes (The "Bet"):**
          *   Need a concrete experiment.
          *   *Idea:* Train IRL on Context A, predict choice in Context B. Compare to self-reported endorsement.
          *   *Setup:* Decision making under risk vs. deliberation.
          *   *R's Prediction:* High correlation after accounting for computational constraints.
          *   *K's Prediction:* Low correlation; framing in B overrides A's "learned" reward.
          *   *Metric:* Prediction accuracy of choices + alignment with reflective endorsement.

      *   **Section 4: Verdict on Verbal vs. Substantive:**
          *   Focus on the word "Preference."
          *   R means "Latent objective function generating behavior."
          *   K means "Constructible valuation upon query."
          *   Resolution: Acknowledge that much conflict is definitional, but the *predictive utility* claim is substantive.
          *   *Flag:* Explicitly note where drafting resolved a dispute by distinguishing definitions.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it collaborative? Yes. Is it precise? Yes.
      *   *Constraint Check:* Did I mark settled vs. contested in the wider literature? Did I flag verbal resolutions?
      *   *Specific Wording:* Ensure Dr. K doesn't sound like they deny behavior exists, and Dr. R doesn't sound like they deny psychology.
