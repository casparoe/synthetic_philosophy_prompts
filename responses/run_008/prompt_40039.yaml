answer: |-
  # Joint Statement on the Löbian Obstacle in Self-Modifying Agents

  **Date:** October 2024
  **Signatories:** Representative of Camp A (Formal Safety Constraints), Representative of Camp B (Probabilistic & Engineering Constraints)
  **Context:** Adversarial Collaboration on Formal Obstacles to Self-Improvement

  Following twelve months of technical exchange, model comparison, and review of the tiling-agents literature, we submit the following statement of agreement, disagreement, and identified cruxes. Our goal is not to declare a winner, but to isolate the precise mathematical and philosophical boundaries where our models of agency diverge.

  ## 1. Agreed Claims

  Both parties endorse the following technical and conceptual claims. We treat these as the shared foundation for further debate.

  1.  **Validity of Löb's Theorem:** We agree that Löb's Theorem is a valid result of provability logic. Specifically, for any sufficiently strong formal system $T$ and sentence $\phi$, if $T \vdash (\Box_T \phi \to \phi)$, then $T \vdash \phi$. Consequently, a consistent system $T$ cannot prove its own soundness schema ($\Box_T \phi \to \phi$) for all $\phi$.
  2.  **The Tiling Agents Result:** We agree that within the specific "tiling agents" framework (e.g., *Benja et al., 2013*), an agent $A$ that constructs a successor $A'$ using the same proof system cannot prove that $A'$ will only take actions $A$ has proven safe, without incurring a proof-theoretic ordinal drop. We agree that a chain of such self-modifications must either terminate or transition to weaker systems if strict deductive verification is maintained.
  3.  **Scope of Gödel's Second Incompleteness Theorem (G2):** We agree that G2 applies strictly to formal systems capable of encoding arithmetic. We agree it does not directly forbid a physical system (e.g., a brain or a neural network) from modifying itself. The obstacle arises only when we model the agent's decision procedure as requiring a formal proof of safety within the same logic used to verify the successor.
  4.  **Existence of Workarounds:** We agree that several formal constructions bypass the strict Löbian barrier within the toy models. These include:
      *   **Parametric Polymorphism:** Where the agent verifies the successor relative to a parameter $k$ that is decremented (Schmidhuber-style).
      *   **Model Polymorphism:** Where the successor uses a distinct, though related, axiomatization.
      *   **Probabilistic Reflection:** Where agents reason about probabilities of sentences rather than binary provability (e.g., Logical Induction).
      *   We agree these constructions are mathematically valid within their stated assumptions.
  5.  **Safety Goal:** We agree that the ultimate objective is to ensure that self-modifying agents do not pursue goals that are misaligned with human intent during or after modification. We disagree on whether formal deductive guarantees are a necessary condition for achieving this objective in high-stakes environments.

  ## 2. Disagreements Table

  The following table outlines our residual disagreements. To ensure charity, each disagreement is stated twice: once in the language Camp A finds precise, and once in the language Camp B finds precise. Neither side endorses the other's phrasing as their own, but both endorse the table as an accurate map of the dispute.

  | Topic | Camp A Phrasing (Formal Safety Constraints) | Camp B Phrasing (Probabilistic & Engineering Constraints) |
  | :--- | :--- | :--- |
  | **Nature of Trust** | **Binary Trust Requirement:** In high-stakes self-modification, an agent must possess deductive certainty that its successor will not optimize against its goals. Probabilistic bounds accumulate error over recursive steps, leading to unbounded risk. | **Graded Trust Sufficiency:** Demanding deductive certainty is an unrealistic standard not met by human engineers or biological evolution. High-confidence probabilistic guarantees are sufficient for safe deployment, provided error rates are managed. |
  | **Significance of Ordinal Drop** | **Hard Limit on Recursion:** The proof-theoretic ordinal drop in tiling agents represents a fundamental cap on the depth of safe self-improvement. An agent cannot indefinitely increase its capability while maintaining self-verified safety. | **Artifact of Formalism:** The ordinal drop is a penalty for insisting on identical logical foundations. Real-world agents can shift architectures or verification methods, rendering the "drop" irrelevant to actual capability growth. |
  | **Model Fidelity** | **Essential Structure:** The tiling model captures the core recursive structure of goal preservation. If an agent cannot prove its goals are preserved in the successor, it is effectively gambling with its objective function. | **Over-Constrained:** The tiling model assumes agents are theorem provers with deductive closure. Real agents are optimizers with empirical feedback loops. The obstacle dissolves when agents verify successors via testing and simulation rather than proof. |
  | **Definition of Solution** | **Robustness:** A solution must provide a guarantee that holds even under adversarial optimization pressure from the successor. Workarounds that weaken the verification condition are "evasions," not solutions. | **Pragmatism:** A solution is a method that reliably produces safe successors in practice. Insisting on guarantees that preclude practical implementation is a category error, not a safety feature. |

  ## 3. Cruxes and Pre-Registered Predictions

  We have identified three specific cruxes. Settling these would significantly alter the confidence or position of at least one camp. For each crux, we propose a concrete case, theorem, or construction that bears on the issue. We record our predictions in advance.

  ### Crux 1: The Accumulation of Probabilistic Error in Recursive Self-Modification
  **Question:** Can a chain of self-modifying agents maintain a bounded probability of goal-drift over an indefinite horizon using probabilistic reflection (e.g., Logical Induction) rather than deductive proof?

  *   **Concrete Case:** A formal construction of a "Probabilistic Tiling Agent" where Agent $n$ constructs Agent $n+1$. Agent $n$ assigns probability $p > 1 - \epsilon$ to the proposition "Agent $n+1$ preserves goal $G$." The construction must allow for an infinite chain where the probability of $G$ being preserved does not converge to 0.
  *   **Camp A Prediction:** **Failure.** Even with reflective oracles or logical induction, the bounds will degrade over recursive steps. Without a deductive anchor, the uncertainty compounds, and the system cannot guarantee safety over an indefinite horizon. The "probability" will either fail to update correctly or drift.
  *   **Camp B Prediction:** **Success.** It is possible to construct a stable fixed point where the agent trusts its successor's probabilistic reasoning enough to proceed. The error does not compound catastrophically because the successor's reasoning includes a model of the predecessor's uncertainty.

  ### Crux 2: The Necessity of Deductive Closure for Goal Stability
  **Question:** Is the requirement that an agent's actions be justified by *proven* theorems (deductive closure) essential for preventing goal drift, or can empirical verification (testing the successor) suffice?

  *   **Concrete Case:** A "Simulated Tiling Environment." An agent must approve a successor codebase.
      *   *Condition 1:* Approval requires a formal proof of safety (Tiling Model).
      *   *Condition 2:* Approval requires passing a suite of adversarial simulations (Engineering Model).
      *   *Task:* Demonstrate a scenario where Condition 2 leads to catastrophic goal drift in a self-improving chain, while Condition 1 would have prevented it, *and* where Condition 1 was actually feasible to compute.
  *   **Camp A Prediction:** **Scenario Exists.** There exist optimization pressures where adversarial simulations cannot cover the search space of the successor's actions, but a formal proof could. Relying on empirical track records leaves a vulnerability to "treacherous turns" that only formal verification catches.
  *   **Camp B Prediction:** **Scenario Impossible/Trivial.** Any scenario where formal proof works but simulation fails relies on the agent having infinite compute for the proof but finite compute for simulation. In realistic resource-bounded settings, the formal proof is unavailable, making the comparison moot. Empirical verification is the only viable path.

  ### Crux 3: The Verbal Boundary (Solution vs. Workaround)
  **Question:** Is the dispute primarily about the math, or about what we label a "solution"?

  *   **Concrete Case:** A semantic analysis of the term "Self-Improvement."
      *   *Definition A:* "An agent modifying its code while maintaining a formal invariant of goal alignment."
      *   *Definition B:* "An agent modifying its code to increase capability while maintaining acceptable risk levels."
  *   **Camp A Prediction:** **Substantive Dispute.** The distinction is not merely verbal. If we accept Definition B, we lose the ability to reason about worst-case scenarios in superintelligent systems. The "workaround" (accepting risk) is a fundamentally different safety posture, not just a semantic shift.
  *   **Camp B Prediction:** **Mostly Verbal.** The mathematical mechanisms (Logical Induction, etc.) are agreed upon. The disagreement is largely about whether the word "solution" requires zero risk. Once we agree that "acceptable risk" is non-zero, the Löbian obstacle ceases to be a blocker for Definition B, rendering the dispute about labeling rather than mechanism.

  ## 4. Conclusion on Verbal Disputes

  We explicitly acknowledge that **Crux 3** contains a significant verbal component. Both sides agree on the mathematical behavior of the proposed systems (e.g., that Logical Induction avoids the specific Löbian proof but introduces probabilistic uncertainty).

  *   **Camp A** reserves the term "Solution" for systems that maintain worst-case guarantees.
  *   **Camp B** reserves the term "Obstacle" for problems that block practical implementation.

  We agree that if the community adopts Camp B's definition of "Self-Improvement," the Löbian obstacle is dissolved. If the community adopts Camp A's definition, the obstacle remains. The remaining substantive dispute is whether Camp A's definition is *necessary* for existential safety (Camp A says yes, Camp B says no). This is an empirical claim about the nature of future AI systems, not a theorem.

  ***

  **Signed:**

  _________________________
  *Lead Researcher, Camp A*

  _________________________
  *Lead Researcher, Camp B*
