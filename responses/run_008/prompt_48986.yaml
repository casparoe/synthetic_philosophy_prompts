  The single principle that captures your pattern is that an epistemic situation is defective if and only if its constitutive norms or structures systematically insulate its beliefs from disconfirming evidence, thereby disabling the community's capacity to recognize and correct its own errors.

  This principle relies on three clauses that map directly to your cases. First, the requirement for "constitutive norms or structures" distinguishes the **village religion** from the **Flat Earth forum**; the village's isolation is geographic accident rather than a designed mechanism, so it lacks the agency required for defectiveness. Second, the clause "systematically insulates its beliefs from disconfirming evidence" separates the **climate science conference** from the **Flat Earth forum**; the conference excludes skeptics based on prior evidentiary failure rather than preemptively dismissing their data, meaning valid counter-evidence would still be admitted, whereas the Flat Earth forum discredits sources like NASA *a priori*, blocking evidence regardless of quality. Third, the requirement that this insulation "disables the community's capacity to recognize and correct its own errors" explains why the **Marxist reading group** is fine while the **breastfeeding support forum** is defective; the Marxists engage cheerfully with outsiders and remain open to correction, whereas the support forum's structure causes members with negative experiences (disconfirming evidence regarding ease of breastfeeding) to drift away, creating a survivorship bias that prevents the group from accurately assessing risks.

  Applying this principle resolves your uncertainty regarding the **rationalist-adjacent community**: it is defective. Even if the community is currently right about nearly everything, the instruction to discount mainstream coverage systematically insulates their doctrines from disconfirming evidence, meaning that if they *were* wrong on a specific point, their own norms would prevent them from noticing it; truth does not negate structural incapacity for self-correction. Regarding the **ordinary person with an algorithmic news diet**, this situation is also defective because the unnoticed curation acts as a structural barrier that hides disconfirming evidence without the user's awareness, leaving them no mechanism to detect or correct for the bias. I would overturn none of your definite verdicts to maintain this principle, as it accommodates your judgments on the climate conference, Flat Earth forum, breastfeeding forum, Marxist group, and village religion without contradiction.
