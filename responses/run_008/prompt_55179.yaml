prompt: |-
  i've been going back and forth on humeanism about laws of nature — the "laws are just the best systematization of the Humean mosaic" picture vs. the "laws govern or necessitate what happens" picture — and it finally struck me that i've been arguing about particular theories without ever sitting down and asking what a theory of laws is even FOR. like, what job are we hiring laws to do? before i read another paper on this, write me the desiderata.

  i want the requirements list, with the case behind each one: what laws are supposed to do in our actual reasoning (support counterfactuals, back explanations, constrain what counts as physically possible, let us extrapolate to novel situations), which puzzles any theory has to at least say something about (the inference problem — why past regularities tell us anything about the future, and whether the humean is allowed to answer "they don't, but the best system does"; and the explanation problem — whether a systematization can explain the very facts it systematizes or whether thats circular), and which distinctions the theory can't collapse (law vs. accidental regularity, laws vs. initial conditions, fundamental vs. derived laws).

  and here's the part i actually care about: stress-test the desiderata against a few weird worlds i've been chewing on. (1) a world with only one event in it, or a handful — is there anything for a best system to compress there? if a theory of laws has literally nothing to say about worlds with too little going on, does that matter or not? (2) a world whose entire history is one identical second repeated over and over, or a world where the same pattern occurs 17 times and then it's blank forever. does the best-system view count those as having laws? should ANY view count them as having laws, or is my intuition that these are "too gerrymandered to have laws" just camp loyalty talking? (3) a world where everything happens — every arrangement occurs somewhere in an infinite mosaic, so "all Fs are Gs" and "all Fs are non-Gs" both have infinitely many instances. if the best-system machinery chokes on that, is that a genuine problem or fine to shrug off with "such worlds just have lousy or no laws"?

  for each requirement, say whether it's a real constraint or a preference of one camp smuggled in — e.g. is "laws must govern" a desideratum at all, or does putting it on the list beg the question against the humean before the argument starts? and flag any subset of desiderata you suspect can't be jointly satisfied — i have a feeling that "laws explain the mosaic", "explanation can't be circular", and "laws are nothing over and above the mosaic" is a three-way collision, but i want to see if that's right. that joint-unsatisfiability bit is the part i want most, don't shortchange it.

  finish with a quick scorecard of best-system humeanism, primitivist necessitation views, and a powers/dispositions take on laws — but keep that short, the criteria are where the thinking is. and no citations or reading lists please, i want just the ideas, i wont be able to look anything up
