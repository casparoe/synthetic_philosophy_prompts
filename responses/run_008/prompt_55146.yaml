answer: |-
  Here is a complete 75-minute seminar plan designed to fit your constraints. It isolates variables through three staged variants, relies on tangible (non-cash) stakes, and provides a nuanced debrief script.

  ### **Logistics & Materials (Fits in One Laptop Bag)**
  *   **Stakes:** 3 "Homework Pass" coupons (redeemable for skipping one minor assignment). This is currency second-year undergraduates actually value more than cash.
  *   **Props:** Whiteboard markers, a visible timer (phone or kitchen timer), printed rule sheets (one per student), 18 slips of paper (for bids).
  *   **Room:** Chairs arranged in a semicircle so all bidders face each other.

  ---

  ### **Part 1: The Activity Sequence (50 Minutes)**

  **Introduction (5 mins)**
  *   **Script:** "Today we are running three decision-making simulations. You will bid for a prize using points. The rules change each round. Do not discuss strategy between rounds. I will not explain the *purpose* until the end."
  *   **Stakes:** Announce the Homework Pass.
  *   **Constraint:** Tell them bids must be in increments of 5 points. Starting bid is 5 points.

  **Variant 1: The Trap (15 mins)**
  *   **Rules:** Standard Dollar Auction.
      1.  Highest bidder wins the Homework Pass.
      2.  **Crucial:** The *second-highest* bidder must also pay their final bid to the instructor (points deducted from their course participation total) but gets nothing.
      3.  Bidding is open outcry.
  *   **Execution:** Encourage two specific students to start (or wait for volunteers). Once bids pass 50 points (half value), the dynamic usually shifts. Let it run until bids exceed 100 points (the value of the prize) or students refuse to bid.
  *   **Goal:** Generate escalation beyond rational value.
  *   **Stop Condition:** If bids reach 150 points, stop it manually. "Time."

  **Variant 2: The Structure Check (10 mins)**
  *   **Rules:** First-Price Auction.
      1.  Highest bidder wins the Homework Pass.
      2.  **Change:** The second-highest bidder pays *nothing*.
      3.  Bidding is open outcry.
  *   **Execution:** Run this quickly.
  *   **Goal:** Demonstrate that without the "second-place penalty," rational bidding stops near the true value (100 points). This isolates the *structural* driver from the *psychological* driver.

  **Variant 3: The Arousal Check (15 mins)**
  *   **Rules:** Standard Dollar Auction (Second-highest pays) **+** Friction.
      1.  **Change A (Committee):** Bids must be submitted by a pair of students acting as a "Board." They must whisper and agree before writing the bid.
      2.  **Change B (Cooling Off):** There is a mandatory 30-second silence between any two bids.
  *   **Execution:** Select two new pairs of bidders. Enforce the silence strictly.
  *   **Goal:** Dampen "competitive arousal" and impulsive reaction. If escalation is lower than Variant 1, arousal/impulse was a key driver. If escalation remains high, the structural trap is the dominant force.

  **Transition to Debrief (5 mins)**
  *   Collect all bid sheets.
  *   Ask students to take out a blank sheet of paper.
  *   **Instruction:** "Write down one sentence: What specific rule or feeling caused the bidding to go past the value of the prize in Round 1?" (Do not collect these yet; this primes them for the discussion).

  ---

  ### **Part 2: The Debrief (25 Minutes)**

  This is where you do the heavy lifting. Do not lecture immediately; use their observations.

  #### **1. Mapping Variants to Concepts (10 mins)**
  Ask students to compare the rounds. Use their data to map the concepts.

  *   **Variant 1 (Standard) $\rightarrow$ Entrapment & Escalation.**
      *   *Ask:* "At what point did you realize you were losing money/points but kept bidding?"
      *   *Concept:* **Entrapment.** You are in a position where exiting guarantees a loss, so you gamble to recover.
  *   **Variant 2 (No Penalty) $\rightarrow$ Rational Bounds.**
      *   *Ask:* "Why did bidding stop near 100 points here?"
      *   *Concept:* **Best Response.** Without the second-place penalty, the dominant strategy is to bid up to value and stop. This proves the *structure* of Variant 1 was necessary for the trap.
  *   **Variant 3 (Committee/Pause) $\rightarrow$ Competitive Arousal.**
      *   *Ask:* "Did the 30-second pause change how you felt about the other bidder?"
      *   *Concept:* **Competitive Arousal.** The pause reduces the "heat" of rivalry. If bids were lower here than in Variant 1, it shows that emotional arousal fuels escalation *on top of* the structural trap.

  #### **2. Clean vs. Muddied Pairings (5 mins)**
  Be honest about the experimental noise.

  *   **Clean Pairing:** **Variant 1 vs. Variant 2.**
      *   *Why:* This cleanly isolates the **Second-Place Penalty**. If Variant 2 stays rational and Variant 1 escalates, the structural penalty is the primary necessary condition. This is the strongest link in the lesson.
  *   **Muddied Pairing:** **Variant 1 vs. Variant 3.**
      *   *Why:* You changed two things at once (Committee + Pause). If escalation dropped, was it because two heads are better than one (deliberation)? Or because the pause killed the adrenaline (arousal)? In a real lab, you'd separate these. In 75 minutes, you conflate them. Acknowledge this to the students: *"We altered the decision environment, but we can't be sure if the group dynamic or the time delay was the specific brake."*

  #### **3. Settled vs. Contested Theory (5 mins)**
  This addresses your request for intellectual honesty regarding the literature.

  *   **Settled Consensus:**
      *   **The Structural Trap:** Game theorists agree that the "second-highest pays" rule creates a game with no stable Nash Equilibrium once bidding passes the prize value. Mathematically, the trap is real.
      *   **Sunk Costs are Irrational:** Economists agree that past bids should not influence future bids (marginal analysis).
  *   **Genuinely Contested:**
      *   **The Mechanism of Escalation:** *Why* do people ignore the math?
          *   *View A (Loss Aversion):* Psychologists (Kahneman/Tversky lineage) argue people bid to avoid the *pain* of the certain loss of the second-place bid.
          *   *View B (Competitive Arousal):* Management researchers (e.g., Malhotra) argue it's about "beating the opponent," not saving the money. The utility comes from winning, not the prize value.
          *   *View C (Self-Justification):* Some argue bidders convince themselves the prize is actually worth more than it is to reduce cognitive dissonance.
      *   **Tell the students:** "Researchers still fight about whether people escalate because they hate losing, because they want to crush the rival, or because they lie to themselves about the prize value. The data supports all three depending on the context."

  #### **4. Classroom vs. Real World Limitations (5 mins)**
  Manage their expectations about external validity.

  *   **What the Classroom Missed:**
      *   **Ambiguity:** In this game, the prize value was fixed (1 Homework Pass). In real life (e.g., a failing software project), managers often escalate because they believe *success is still possible*. They don't know the value is capped.
      *   **Reputation:** Here, losing 50 points is private. In the real world, withdrawing from a bid can signal weakness to competitors or investors, creating a reputational stake that unfolds over months.
      *   **Agency:** Here, they lost their own points. In organizations, managers often escalate using *shareholder* money, which changes the risk calculus (moral hazard).
  *   **Your Role:** "I had to supply the context of 'reputation' and 'ambiguity' in my explanation because this game was too clean to generate those pressures naturally."

  ---

  ### **Part 3: Predictable Failures (First-Time Run Risks)**

  Be prepared for these specific scenarios. If they happen, pivot the debrief to address them.

  1.  **The Collusion Failure:**
      *   *What happens:* In Variant 1, two students agree (tacitly or explicitly) that one bids 5 points and the other doesn't bid, then they split the prize later.
      *   *Result:* No escalation. The game "breaks."
      *   *Fix:* If you suspect this, announce mid-game: "I am introducing a random audit. If I suspect collusion, the prize is voided." Or, simply use this in the debrief: "Why didn't this happen? In the real world, antitrust laws prevent this, but in a seminar, trust is rare."
  2.  **The Apathy Failure:**
      *   *What happens:* No one wants to bid. They don't care about the Homework Pass.
      *   *Result:* Silence.
      *   *Fix:* Have a backup stake. A $20 Amazon gift card you bought yourself. Keep it in your bag. If the Homework Pass doesn't spark energy, swap it silently.
  3.  **The "One-and-Done" Failure:**
      *   *What happens:* One student bids 100 points immediately.
      *   *Result:* No escalation ladder.
      *   *Fix:* Enforce a "No Jump Bidding" rule (max increment 10 points) to force the ladder climb.
  4.  **The "Martyr" Failure:**
      *   *What happens:* A student bids 200 points just to prove a point or make you look bad.
      *   *Result:* Data skew.
      *   *Fix:* Cap the bidding at 200 points explicitly in the rules ("Bankruptcy limit").

  ### **Summary of Variant-to-Concept Pairings**

  | Variant | Change | Intended Concept | Cleanliness |
  | :--- | :--- | :--- | :--- |
  | **1 (Standard)** | Baseline | **Entrapment / Sunk Cost** | **Clean.** This is the phenomenon. |
  | **2 (No Penalty)** | Remove 2nd-place pay | **Structural Necessity** | **Very Clean.** Proves the rule drives the trap. |
  | **3 (Committee)** | Add friction/group | **Competitive Arousal** | **Muddied.** Conflates groupthink with cooling-off. |

  ### **Final Instructor Note**
  The success of this seminar relies on your **neutrality** during the bidding. Do not smile when they trap themselves. Do not frown. You are the "House." If you show emotion, you become a participant, and the "experimental" frame breaks. Keep the timer visible. Keep the rules written on the board. Let the structure punish them, not you.
