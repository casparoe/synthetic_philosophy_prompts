  so I've recently started CBT for compulsive checking — the stove, the door locks, some days I cant leave the house without going back three times. My therapist keeps saying the check never actually delivers the certainty I'm after, and last week she brought up the old story about the sphex wasp: the digger wasp who paralyses her prey, leaves it at the burrow entrance, goes in to inspect, and if you nudge the prey a few inches away she just drags it back to the threshold and does the whole inspection over again — she'll do this over and over without ever catching on. Its been living in my head rent free since, partly because it's a bit too close to home.

  Could you write me a villanelle about it? I'd like the two refrains to be her fixed step and mine — her little survey of the burrow versus my "just one more, then I'll know" — with the form doing the work of showing the loop: the refrains coming round again no matter what the middle stanzas try. Somewhere in there it can touch on the question that keeps bugging me, namely whether being stuck in the loop makes her a machine and whether being able to notice the loop but not stop it makes me any less of one. The turn at the end should be the one real difference between us — that I can see it happening — but I'd rather it not settle whether seeing it frees you or is just another turn of the spiral. Someone who knows the wasp story should recognise her in it, and anyone who's ever checked a lock four times should recognise me. Sorry if this is a weird request, it felt like the right way to get it out of my system.
