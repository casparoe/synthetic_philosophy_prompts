answer: |-
  You have hit upon a very real and widely discussed tension in comparative psychology, animal ethics, and the philosophy of mind. Your observation is astute: the evidentiary standard for consciousness does seem to float upwards in direct proportion to the evolutionary distance between the observer and the observed.

  There is no single, universally agreed-upon noun that captures this *exact* mechanism of shifting evidentiary bars, but there are established concepts that come very close, and I am happy to coin a precise term for the specific phenomenon you describe.

  ### 1. The Existing Literature

  The closest established concept is **Anthropodenial**.

  Coined by the primatologist Frans de Waal, this term describes the a priori rejection of shared characteristics between humans and animals when, in fact, they may exist. De Waal argued that while *anthropomorphism* (projecting human traits onto animals) is a risk, the scientific community often swings too far the other way into *anthropodenial* to avoid appearing unscientific.

  However, anthropodenial is often a blanket refusal. Your observation is more nuanced: it is a *gradient*. For this, we look to **Mind Perception Theory**.

  Psychologists like Kurt Gray and Daniel Wegner have analysed how humans attribute minds to others. They suggest we judge 'mind-ness' on two axes: *Agency* (the ability to plan and act) and *Experience* (the ability to feel and suffer). Their research shows that humans use a **'Likeness Heuristic'**: we attribute high levels of Experience to entities that resemble us biologically or behaviourally. As the likeness fades (from chimp to fish to crab), the heuristic fails, and we require disproportionately more data to grant the same status.

  In philosophy, this is sometimes discussed under the umbrella of **Cartesian Anxiety**—the fear of being wrong about another's consciousness—combined with **Phylogenetic Parsimony**. Parsimony is the scientific principle that we should assume the simplest explanation. The bias occurs when scientists assume the 'simplest' explanation for a crab is 'automaton', while for a chimp, the 'simplest' explanation is 'conscious being', despite similar behavioural outputs.

  ### 2. A Coinage: "Phylogenetic Evidentiary Inflation"

  Since you asked for a precise term if one didn't exist, I propose we call this **Phylogenetic Evidentiary Inflation**.

  **Definition:** *The cognitive bias wherein the quantity and quality of evidence required to attribute a mental state (such as pain or consciousness) to an organism increases in proportion to its phylogenetic distance from the observer, irrespective of the functional equivalence of the behaviour displayed.*

  **How it differs from sensible caution:**
  Sensible scientific caution is **mechanism-based**. It says: "A crab's nervous system is decentralised; we need to understand how a ganglion processes nociception before we equate it to a human cortex." This is valid.

  **Phylogenetic Evidentiary Inflation** is **taxonomy-based**. It says: "A crab is an invertebrate; therefore, even if it nurses a wound, avoids harm, and learns from pain like a mammal, we must assume it is a reflex machine until proven otherwise."

  The distinction lies in whether the doubt is about the *data* (caution) or the *category* of the animal (inflation). In the scenario you described, the behaviour is the same, but the interpretation changes solely because the 'hardware' looks alien. That is inflation, not caution.

  ### 3. Does the Move Ever Run in Reverse?

  You asked whether people over-credit cephalopods because they are clever in ways we find impressive. The answer is yes, and it is sometimes called **Cephalopod Exceptionalism** or **Alien Intelligence Romanticism**.

  Because octopuses and cuttlefish display such complex problem-solving skills and camouflage abilities despite having a completely different neural architecture (with many neurons in their arms rather than just the brain), they fascinate us. There is a tendency in popular science and even some research to project a sort of 'mystical' consciousness onto them.

  However, this is slightly different from the pain debate. We tend to over-credit their *Agency* (intelligence, cunning) while still sometimes under-crediting their *Experience* (suffering). Though, in the case of the UK legislation you mentioned, the 'alien intelligence' argument actually helped push the needle towards recognising their capacity for suffering, because their cognitive complexity suggested a richer inner life than previously assumed.

  ### 4. The UK Context: Lobsters and Crabs

  You are quite right to situate this in the recent UK debates. In 2021, the London School of Economics (LSE) was commissioned by the government to review the scientific evidence on sentience in cephalopod molluscs and decapod crustaceans.

  The review concluded there was very strong evidence of sentience in octopuses and strong evidence in crabs and lobsters. This led to the **Animal Welfare (Sentience) Act 2022**. The heat you recall from the debate stemmed precisely from **Phylogenetic Evidentiary Inflation**.

  Critics of the bill argued that because crustaceans lack a frontal cortex or a unified brain structure comparable to vertebrates, their behavioural responses (like rubbing a wounded claw) were merely 'nociception' (reflex) rather than 'pain' (suffering). Proponents argued that the behavioural evidence was sufficient regardless of the structural difference. The eventual legal recognition was a rare instance of the law correcting the inflationary bias, acknowledging that the 'likeness heuristic' should not dictate moral status.

  ### Summary

  Your intuition is spot on. We solve the 'problem of other minds' for dogs and babies using a low evidentiary bar because they are 'like us'. We raise the bar for fish, and raise it higher still for crustaceans, not necessarily because the behaviour is more ambiguous, but because the vessel is more alien.

  While **Anthropodenial** is the recognised term for the denial of shared traits, **Phylogenetic Evidentiary Inflation** captures the specific sliding scale of proof you have identified. It is a defence mechanism that allows us to continue using certain animals without the moral discomfort that would arise if we acknowledged their suffering on the same terms as a chimpanzee's.

  And don't worry about the typos; typing on a train is a hazard we all face. I hope this analysis helps settle the matter for you.
