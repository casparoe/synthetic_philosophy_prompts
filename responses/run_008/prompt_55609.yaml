answer: |-
  This is a sophisticated observation that cuts to the heart of the tension between welfare economics and moral philosophy. You are describing a phenomenon where the *sign* of the price (zero vs. positive) matters more than the *magnitude* of the price.

  There is no single, universally canonical term that captures *exactly* this normative discontinuity without bringing in the baggage of crowding-out or inequality. However, there are two established concepts that come very close, and I will propose a precise term you can coin for your thesis to capture the specific structural jump you are describing.

  ### 1. The Established Terms

  #### A. Market-Inalienability (Legal & Political Theory)
  The closest established term comes from the property law and commodification literature, specifically **Margaret Jane Radin's** concept of **"Market-Inalienability"** (in *Contested Commodities*, 1996).

  *   **Definition:** A right or good is *market-inalienable* if it can be transferred (alienated) but *not sold*. You can give a kidney, but you cannot sell one. You can give blood, but (in Titmuss's ideal) you cannot sell it.
  *   **Why it fits:** It distinguishes between **Inalienability** (no transfer allowed, e.g., voting rights) and **Market-Inalienability** (transfer allowed, but money forbidden). This matches your observation that the transfer itself is welcomed, but the price is the problem.
  *   **Limitation:** It describes the *legal/moral rule*, not the *psychological discontinuity*. It tells us *that* the line exists, but not necessarily *why* the jump from £0 to £1 is so catastrophic compared to £1 to £1000.

  #### B. Market Norms vs. Social Norms (Behavioral Economics/Psychology)
  In behavioral science, this is often framed through **Fiske's Relational Models Theory** or **Tetlock's Sacred Values**.

  *   **Definition:** Human interactions operate in different spheres. **Communal Sharing** (gift/duty) and **Market Pricing** (sale/contract) are distinct cognitive frames. Introducing money into a Communal Sharing frame does not just change the amount; it "crowds out" the social norm and triggers a moral violation.
  *   **Why it fits:** It explains the mechanism. Money acts as a "frame switch." At zero, you are in the social sphere; at >0, you are in the market sphere.
  *   **Limitation:** This is often used to explain *crowding out* (empirical reduction in supply), whereas you are interested in the *normative judgment* (the moral wrongness).

  #### C. Distinction: The Zero-Price Effect
  You must distinguish your concept from the **"Zero-Price Effect"** (Shampanier, Mazar, & Ariely, 2007).
  *   **The Zero-Price Effect** describes *demand*: people disproportionately prefer free goods over cheap goods.
  *   **Your Concept** describes *morality*: people disproportionately *condemn* priced transactions over free ones.
  *   *Do not use "Zero-Price Effect" for your thesis; it refers to consumer utility, not moral norms.*

  ---

  ### 2. A Proposed Term for Your Thesis

  Since "Market-Inalienability" is a legal status and "Market Norms" is a psychological framework, neither perfectly captures the *structural discontinuity at zero* that you are analyzing as an economic phenomenon.

  I propose you coin the term: **The Zero-Price Normative Discontinuity.**

  Alternatively, if you want something punchier: **The Monetization Threshold.**

  However, for a PhD in Health Economics, **"The Zero-Price Normative Discontinuity"** is precise, descriptive, and academically robust.

  #### Definition
  > **The Zero-Price Normative Discontinuity:** A structural asymmetry in moral and social evaluation where a transaction is deemed permissible or virtuous at a price of zero, but impermissible or unethical at any positive price ($p > 0$), regardless of the magnitude of $p$. The discontinuity arises not from the welfare effects of the price, but from the price signal itself, which reclassifies the transaction from a social/gift exchange to a market/commodity exchange.

  #### Why this term works for Health Economics:
  1.  **It isolates the variable:** It focuses on the binary switch ($p=0$ vs $p>0$) rather than the slope of the supply curve.
  2.  **It avoids "Commodification":** "Commodification" implies a process or a state of being. "Discontinuity" implies a mathematical or structural break, which fits an economic analysis of incentives.
  3.  **It accommodates your controls:** It explicitly holds coercion and inequality constant, focusing on the *signal* of the price.

  ---

  ### 3. Testing the Edges (Boundary Conditions)

  You asked where the edges lie. Using the **Zero-Price Normative Discontinuity**, here is how you classify the edge cases:

  #### A. Nominal Payments (e.g., £1 for a kidney)
  *   **Classification:** **Crosses the Discontinuity.**
  *   **Reasoning:** The moral outrage is triggered by the *presence* of consideration, not the adequacy of it. A nominal payment converts the act from a "gift" to a "contract." In contract law, "consideration" need not be adequate, only sufficient. £1 is sufficient consideration to trigger market norms, thus crossing the discontinuity.
  *   **Thesis Application:** This explains why "token" payments often fail to increase supply; they trigger the market norm (and its associated stigma) without providing enough financial utility to offset it.

  #### B. Expense Reimbursement (e.g., travel costs for trial subjects)
  *   **Classification:** **Does Not Cross the Discontinuity.**
  *   **Reasoning:** Reimbursement is viewed as **restorative** rather than **compensatory**. It returns the agent to their *status quo ante* (zero net cost) rather than creating a surplus (positive net gain). Because no surplus is generated, the transaction remains in the "social/gift" sphere. The price is technically >0, but the *net utility* is framed as 0.
  *   **Thesis Application:** This is the safe harbor for incentive schemes. To avoid the discontinuity, payments must be linguistically and structurally framed as "indemnity" rather than "remuneration."

  #### C. The Iran Model (Regulated Kidney Market)
  *   **Classification:** **Attempts to Bridge the Discontinuity via Reclassification.**
  *   **Reasoning:** The Iranian system does not call the payment a "price" (*ghimat*); it calls it "compensation for time and harm" (*ta'ahol*). The state acts as a single payer to sanitize the transaction.
  *   **Analysis:** Does it work? Internally, yes (supply increased). Externally (global bioethics), no. The Zero-Price Normative Discontinuity suggests that as long as the transaction is perceived as a *quid pro quo* for an organ, the moral stigma persists globally, even if the local market functions.
  *   **Thesis Application:** This illustrates that the discontinuity is not just about the money, but about the *social meaning* attached to the money. The Iran model tries to move the transaction from the "Market" sphere to a "Civic Duty with Compensation" sphere, but fails to convince external observers.

  ### 4. How to Position This in Your Thesis

  1.  **Acknowledge the Neighbors:** Cite Radin on **Market-Inalienability** and Fiske/Tetlock on **Market vs. Social Norms**. State that these provide the *foundation* for your analysis.
  2.  **Identify the Gap:** Note that existing literature focuses on the *consequences* (crowding out, inequality) or the *legal status* (inalienability). There is less focus on the *structural break at zero* itself as a distinct economic variable.
  3.  **Introduce Your Term:** Define the **Zero-Price Normative Discontinuity**.
  4.  **Operationalize It:** Use it to analyze why certain incentive schemes fail. For example, a scheme offering £500 might fail not because £500 is too low (standard labor supply), but because £500 crosses the discontinuity while £0 does not. The "cost" is the moral stigma, which is a fixed cost incurred the moment $p > 0$.
  5.  **Policy Implication:** If this discontinuity exists, policy cannot simply "optimize" the price. It must either accept $p=0$ (pure altruism) or invest heavily in *reframing* the payment (e.g., tax credits, lost wage compensation) to keep the net transaction on the "gift" side of the discontinuity.

  ### Summary
  *   **Established Term:** **Market-Inalienability** (Radin).
  *   **Psychological Mechanism:** **Market Norms vs. Social Norms** (Fiske/Tetlock).
  *   **Your Coined Term:** **The Zero-Price Normative Discontinuity**.
  *   **Key Distinction:** It is a deontological constraint (rule-based) rather than a consequentialist one (outcome-based). The wrongness is in the *category error* of pricing, not the *amount* of the price.

  This framing should give you the precise terminology you need to distinguish your work from the broader commodification literature while grounding it in established economic and legal theory.
