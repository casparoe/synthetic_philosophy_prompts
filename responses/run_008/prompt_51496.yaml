      *   *Tension:* If Functionalism is true, the "Mind" is where the processing is (Yorick/Hubert). If the user identifies with the Body (Hamlet), they are identifying with the *peripheral* equipment, not the *central processor*. This is anti-functionalist regarding self-location.
      *   *Teletransporter (3):* Here, the user accepts the pattern moves to a new body. So matter doesn't matter.
