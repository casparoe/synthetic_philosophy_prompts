      *   *Hypothesis:* The user is a Functionalist about *Mind* (1, 6) but a Somatic/Bodily theorist about *Self-Location/Identity* (2), while claiming No Further Fact (5). This is the tension. Parfit (5) usually goes with Psychological Continuity (3, 6), not Bodily Continuity (2).

  5.  **Structuring the Response:**
