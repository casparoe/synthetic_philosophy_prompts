      *   *Correction on Dennett's Story:* In Dennett's story, Dennett (the narrator) is initially with his body (Hamlet) while his brain (Yorick) is in the vat. He looks at the vat and says "There's my brain." Later, the body goes to Tulsa. The user says: "in the actual vat setup, i side with the body. i'm out in the lab staring through the glass at my brain... when the radio links fail... i'm the one in trouble in Tulsa."
      *   *Okay, so the user identifies with Hamlet (the body), not Yorick (the brain).*
