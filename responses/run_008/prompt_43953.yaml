  **Decision Tree: The Politics of Naming Atrocity**

  1.  **Is the violence widespread, systematic, or occurring in the context of an armed conflict?**
      *   **No:** **Unlabeled**.
          *   *Consequence:* No international legal trigger; remains a domestic criminal matter.
          *   *Awkward Commitment:* Acknowledges severe suffering without granting it international political weight.
      *   **Yes:** Go to 2.
  2.  **Are the victims selected primarily because of their political opposition or status, rather than their nationality, ethnicity, race, or religion?**
      *   **Yes:** Go to 3.
      *   **No:** Go to 4.
  3.  **Is the perpetrator a government seeking to destroy this political group?**
      *   **Yes:** **Politicide**.
          *   *Consequence:* Mobilizes political condemnation but triggers no specific treaty obligations like the Genocide Convention.
          *   *Awkward Commitment:* Requires admitting the state is hunting its own citizens for thought rather than identity.
      *   **No:** **Crimes Against Humanity**.
          *   *Consequence:* Enables prosecution in international courts but lacks the specific prevention duties of genocide.
          *   *Awkward Commitment:* Labels atrocity without confirming the specific intent to destroy a people.
  4.  **Is the perpetrator a government killing civilians indiscriminately, without targeting a specific group?**
      *   **Yes:** **Democide**.
          *   *Consequence:* Highlights state brutality but carries no specific legal liability under international treaties.
          *   *Awkward Commitment:* Describes mass murder while ignoring the identity of the dead.
      *   **No:** Go to 5.
  5.  **Is the primary objective to remove the group from a territory rather than destroy them physically or biologically?**
      *   **Yes:** **Ethnic Cleansing**.
          *   *Consequence:* Justifies humanitarian intervention for refugee protection but not necessarily military prevention of killing.
          *   *Awkward Commitment:* Describes expulsion while obscuring whether death is the means or the byproduct.
      *   **No:** Go to 6.
  6.  **Does the evidence (patterns of killing, official words) indicate the objective was the group's destruction (purpose), or merely that destruction was a foreseeable byproduct of another goal (knowledge)?**
      *   **Knowledge:** **Crimes Against Humanity**. (See Note 1 below).
      *   **Purpose:** Go to 7.
  7.  **Does the harm include cultural destruction or imposed conditions of life without immediate mass killing?**
      *   **Yes:** **Lemkin Genocide**.
          *   *Consequence:* Expands moral scope to include language and religion but lacks binding legal enforcement mechanisms.
          *   *Awkward Commitment:* Labels cultural suppression as genocide, diluting the urgency of physical extermination.
      *   **No:** **Convention Genocide**.
          *   *Consequence:* Triggers duties to prevent and punish under the Convention, binding once a state knew or should have known of risk, as seen when the ICJ's 2007 judgment found Serbia liable for failing to prevent Srebrenica.
          *   *Awkward Commitment:* Requires proving specific intent to destroy, allowing states to evade responsibility by claiming mere knowledge of destruction.

  ***

  **Note on Indistinguishable Leaves**
  The tree cannot factually separate **Ethnic Cleansing** and **Convention Genocide** in many cases. Expulsion often creates conditions of life calculated to bring about physical destruction, making the distinction between "removal" and "destruction" a matter of legal argument rather than observable fact.

  **Unoccupied Combinations**
  1.  **Cultural Genocide by Non-State Actors:** Lemkin's concept included cultural destruction, but the Convention limited it to physical/biological harm and state-like responsibility. This region is empty because drafting states politically blocked protections for culture to avoid interference in assimilation policies.
  2.  **Systematic Indiscriminate Killing by Non-State Groups:** Democide requires a government; CAH requires a policy. Mass killing by loose insurgent gangs without a coherent policy falls into a logical gap. This region is empty because the category is incoherent: without organization, the violence is criminal, not political atrocity.

  **Analysis**
  The narrowing of Lemkin's concept during the Convention's drafting was a political act with identifiable victims. By excluding political groups and cultural destruction, drafters protected sovereign states from external scrutiny regarding how they treated dissenters or minorities within their borders. The victims of this narrowing were the groups subsequently erased from legal protection: political opponents in Cambodia and indigenous cultures elsewhere, whose destruction was real but legally invisible.

  "Ethnic cleansing" functions as a euphemism because it allows third-party states to acknowledge atrocity without acknowledging obligation. Naming a crisis "genocide" compels action under the Convention; calling it "cleansing" suggests a demographic shift rather than a crime requiring prevention. This semantic distance permits diplomats to express concern without triggering the legal duty to intervene, prioritizing political convenience over the protection of the vulnerable.
