      *   *The "Hidden Defeater":* A case where everything looks fine, but there's a true fact the subject doesn't know that *would* defeat justification if they knew it. (Splits Defeasibility vs. Internalism).

      *   *Requirement 1 Check (Splitting usually allied views):*
