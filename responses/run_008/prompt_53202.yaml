answer: |-
  # The Epistemic Intuition Inventory

  **Instructions:** Below are ten concrete scenarios. For each, read the case carefully and select the verdict that best matches your intuitive judgment. Do not worry about justifying your answer or recalling a specific philosophical theory; simply report what you feel is the correct description of the subject's epistemic status.

  **Note on Options:**
  *   **(A) Knows:** The subject knows that $p$.
  *   **(B) No Knowledge:** The subject does not know that $p$ (even if they believe it and it is true).
  *   **(C) True Belief Only:** The subject believes $p$, $p$ is true, but this falls short of knowledge.
  *(Note: For scoring purposes, B and C are treated identically as "Knowledge Denied".)*

  ---

  ### The Cases

  **1. The Fake Barn County**
  Henry is driving through a county where, unbeknownst to him, almost all structures that look like barns are merely facades. However, Henry happens to stop in front of the one real barn in the county. He looks at it and forms the belief, "That is a barn." His vision is normal, and the barn is indeed real.
  *   (A) Henry knows it is a barn.
  *   (B) Henry does not know it is a barn.

  **2. The Stopped Clock**
  Maria walks into a room and glances at a clock on the wall to check the time. The clock stopped exactly 12 hours ago at 2:00 PM. By sheer coincidence, Maria looks at the clock at exactly 2:00 PM. She forms the belief, "It is 2:00 PM."
  *   (A) Maria knows it is 2:00 PM.
  *   (B) Maria does not know it is 2:00 PM.

  **3. The Reliable Thermometer (Splitter Case 1)**
  David checks a high-precision digital thermometer to determine the room temperature. This model is statistically reliable (99% accurate). However, David is in a room with a hidden, intermittent magnetic field that *usually* scrambles this thermometer's reading. Today, the field is active, but a second, random electrical fluctuation恰好 cancels out the scrambling effect. The thermometer displays the correct temperature. David believes the reading.
  *   (A) David knows the temperature.
  *   (B) David does not know the temperature.

  **4. The Crystal Ball (Splitter Case 2)**
  Sarah uses a crystal ball to predict the weather. Generally, crystal balls are useless. However, unknown to Sarah, a benevolent demon monitors this specific ball and ensures that whatever image appears in it matches the weather outside. Sarah sees "rain" in the ball, believes it will rain, and it does rain. In nearby possible scenarios, the demon would still have ensured the match.
  *   (A) Sarah knows it will rain.
  *   (B) Sarah does not know it will rain.

  **5. The Lottery Ticket**
  John holds a single ticket in a fair lottery with one million tickets and one winner. The odds of his ticket losing are 99.9999%. Before the draw is announced, John forms the belief, "My ticket will lose."
  *   (A) John knows his ticket will lose.
  *   (B) John does not know his ticket will lose.

  **6. The Hidden Defeater (Splitter Case 3)**
  Elena sees her cat sitting on the mat. She has clear visual evidence and forms the belief, "The cat is on the mat." Unbeknownst to Elena, a trustworthy neighbor has left a note on her table saying, "I moved your cat to the kitchen an hour ago." The neighbor is mistaken (the cat returned), so the cat is actually on the mat. Elena has not seen the note.
  *   (A) Elena knows the cat is on the mat.
  *   (B) Elena does not know the cat is on the mat.

  **7. The Sheep in the Field**
  Olaf looks into a field and sees a large, sheep-shaped rock. He forms the belief, "There is a sheep in the field." Unbeknownst to Olaf, there is an actual sheep hidden directly behind the rock, out of sight.
  *   (A) Olaf knows there is a sheep in the field.
  *   (B) Olaf does not know there is a sheep in the field.

  **8. The Brain-in-a-Vat (Sensitivity Test)**
  You are sitting at a computer. You believe you have hands. If you were a handless brain in a vat being stimulated to have this experience, you would still believe you had hands. However, you are not a brain in a vat; you are a normal person with hands.
  *   (A) You know you have hands.
  *   (B) You do not know you have hands.

  **9. The Testimonial Chain**
  Alice knows a fact $p$. She tells Bob, who believes her. Bob tells Carol, who believes him. Carol tells Dave. At each step, the speaker is reliable, but none of the listeners have any independent evidence for $p$ other than the testimony. Dave forms the belief that $p$.
  *   (A) Dave knows $p$.
  *   (B) Dave does not know $p$.

  **10. The Gettierized Inference**
  Greg reads a reliable-looking newspaper report that says "Jones owns a Ford." Greg infers "Either Jones owns a Ford or Brown is in Barcelona." It turns out the newspaper report was a typo (Jones does not own a Ford), but by sheer coincidence, Brown *is* in Barcelona.
  *   (A) Greg knows the disjunction is true.
  *   (B) Greg does not know the disjunction is true.

  ---

  ### Scoring Key & Diagnostic Profiles

  To use this key, tally your responses. There is no single "correct" score; rather, your pattern of answers reveals which epistemological constraints you implicitly prioritize.

  **Profile A: The Classical Invariantist (JTB + No-False-Grounds)**
  *   **Pattern:** (B) on 1, 2, 7, 10. (A) on 9. (B) on 5.
  *   **Diagnosis:** You hold that knowledge is incompatible with Gettier-style luck. You likely believe that justification cannot essentially depend on a falsehood (Case 10) or environmental luck (Case 1). You reject statistical evidence as sufficient for knowledge (Case 5).
  *   **Theoretical Ally:** Traditional Justified True Belief theorists (e.g., Feldman, early Chisholm).

  **Profile B: The Reliabilist**
  *   **Pattern:** (A) on 3 (Thermometer). (B) on 4 (Crystal Ball). (A) on 9.
  *   **Diagnosis:** Your intuitions track the *history of the process*. In Case 3, you grant knowledge because the device is generally reliable, even if the specific instance involved lucky cancellation. In Case 4, you deny knowledge because "crystal ball gazing" is not a reliable process type, even if it yielded truth safely.
  *   **Theoretical Ally:** Process Reliabilism (e.g., Goldman).

  **Profile C: The Modal Epistemologist (Safety/Sensitivity)**
  *   **Pattern:** (B) on 1, 2, 3. (A) on 4, 8.
  *   **Diagnosis:** You are sensitive to *nearby possible worlds*. You deny knowledge in Case 3 (Thermometer) because in a nearby world, the glitches don't cancel and the belief is false (Unsafe). You grant knowledge in Case 4 (Crystal Ball) because the demon ensures the belief is true in nearby worlds (Safe). You likely grant knowledge in Case 8 (Hands) because the BIV world is not a "nearby" world (Safety), or deny it if you prioritize Sensitivity.
  *   **Theoretical Ally:** Safety Theory (e.g., Sosa, Pritchard) or Sensitivity Theory (e.g., Nozick).

  **Profile D: The Defeasibility Theorist**
  *   **Pattern:** (B) on 6 (Hidden Defeater). (A) on most other perceptual cases.
  *   **Diagnosis:** You grant knowledge in standard Gettier cases but draw the line at Case 6. You believe that for knowledge to obtain, there must be no *true* propositions that would defeat the subject's justification if known, even if the subject is unaware of them.
  *   **Theoretical Ally:** Defeasibility Theories (e.g., Lehrer, Paxson).

  **Profile E: The Knowledge-First / Pragmatist**
  *   **Pattern:** (A) on 1, 5, 8. (B) on 2, 7, 10. (Inconsistent on 3 & 4).
  *   **Diagnosis:** You tend to grant knowledge in ordinary contexts (Fake Barns, Lottery, Hands) but deny it in obvious "broken" cases (Stopped Clock, Sheep/Rock). You likely view knowledge as a primitive state that doesn't require metaphysical precision about "nearby worlds" or "process types." You may find the distinction between Case 3 and Case 4 artificial.
  *   **Theoretical Ally:** Knowledge-First Epistemology (e.g., Williamson) or Contextualism.

  ---

  ### Diagnostic Limitations & Honest Flags

  As requested, I must flag where this diagnostic instrument reaches the limit of its resolution. No quiz of this length can perfectly disentangle all contemporary epistemological positions.

  **1. The Safety vs. Relevant Alternatives Indistinguishability**
  This quiz cannot reliably distinguish between **Safety Theorists** and **Relevant Alternatives Theorists**.
  *   *Reason:* In almost all concrete vignettes, an alternative is "relevant" precisely because it is "nearby" in modal space. To construct a case where an alternative is Relevant but Distant (Safe), or Irrelevant but Nearby (Unsafe), requires such contrived metaphysical stipulations that user intuition becomes unreliable. If you scored as Profile C, you could be a Safety theorist or a Relevant Alternatives theorist; this quiz treats them as extensionally equivalent for diagnostic purposes.

  **2. The Contextualism Blind Spot**
  This quiz assumes **Invariantism** (that the truth value of "S knows" is constant across the quiz).
  *   *Reason:* If you are a Contextualist, your answers should change depending on the "stakes" or the "context of attribution." Since these vignettes do not specify high-stakes vs. low-stakes contexts, a Contextualist is forced to answer based on "ordinary" standards, making you look like a Profile E (Pragmatist/Knowledge-First). This quiz cannot diagnose Contextualism without varying the stakes in each question.

  **3. The Reliabilist/Safety Splitter Warning**
  Questions 3 and 4 are designed to split Reliabilism from Safety. However, sophisticated Reliabilists can adjust their definition of "process type" to match Safety verdicts (e.g., defining the process in Case 3 as "using a thermometer in a magnetic field"). If you answered (B) on 3 and (A) on 4, you are likely a Safety theorist, but a nuanced Reliabilist could claim that result too. The quiz diagnoses your *surface intuitions*, not your commitment to a specific metaphysical machinery.

  ### Advice for Your Argument
  Regarding your disagreement with your friend: You both identify as "Externalists," but this quiz likely reveals that one of you is leaning toward **Reliabilism** (focusing on the general capacity of the agent) and the other toward **Modal Externalism/Safety** (focusing on the luck of the specific environment).
  *   If your friend says the Fake Barn driver **Knows**, they are prioritizing the reliability of the agent's vision (Profile B).
  *   If you say the Fake Barn driver **Doesn't Know**, you are prioritizing the environmental luck/modal safety (Profile C).
  *   You are both externalists (neither requires internal access to justification), but you are externalists about *different things* (Process vs. Modal Environment). This quiz should help you pinpoint that divergence.
