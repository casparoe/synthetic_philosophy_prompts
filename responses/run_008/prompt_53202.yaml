              *   *Case B (Safe but Unreliable):* A process that is generally garbage (e.g., crystal ball) but happens to be hooked up to a hidden mechanism ensuring truth in this specific instance, and would ensure truth in nearby worlds. Safety: Knows (it's safe). Reliabilist: Doesn't Know (process type is unreliable).
          *   *No-False-Grounds vs. Defeasibility:*
