          *   Internalist/NFG: Knows (you have perceptual evidence).
          *   Defeasibility: Doesn't Know (there is a true defeater: "The report says dry").
      *   *Q7: The Crystal Ball that Works (Safety vs. Reliabilism Splitter).* A crystal ball. Generally fake. But this one is secretly monitored by a demon who makes sure whatever you see in it is true. You look, see rain, it rains.
          *   Reliabilist: Doesn't Know (Process type 'crystal ball gazing' is unreliable).
          *   Safety: Knows (In nearby worlds, demon ensures truth, so belief is safe).
      *   *Q8: The Gettierized Testimony.* Friend tells you $p$. Friend believes $p$ based on bad evidence, but $p$ is true. You trust friend.
          *   Tests transmission of knowledge.
      *   *Q9: The Brain-in-a-Vat (Sensitivity).* You have hands. You believe you have hands. If you were a BIV, you'd still believe it.
          *   Sensitivity: Doesn't Know.
          *   Safety: Knows (In nearby worlds, you aren't a BIV).
      *   *Q10: Knowledge First.* A case where intuition is murky. "I just know."

      *Refining the Splitters:*
