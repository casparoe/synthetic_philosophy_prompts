      *   *Safety/Sensitivity (Modal):* Knowledge requires that in nearby possible worlds, you wouldn't believe $p$ if $p$ were false (Sensitivity) or if you believe $p$, $p$ is true (Safety).
      *   *Relevant Alternatives:* Knowledge requires ruling out relevant alternatives, not all logically possible ones.
      *   *Defeasibility:* Knowledge requires there be no true propositions that, if known, would defeat the justification.
      *   *Knowledge-First (Williamson):* Knowledge is unanalyzable; Gettier cases are just edge cases where our intuitions vary, but the concept is primitive. (Often leads to "Knows" in more cases or rejects the project of analysis).

