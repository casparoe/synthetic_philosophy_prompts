answer: |-
  ### Exam Question

  **Course:** Graduate Survey in Rational Choice and Bayesian Reasoning  
  **Section:** B (Essay Questions)  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 25

  **Question 1: The Diachronic Dutch Book and Epistemic Asymmetry**

  The standard synchronic Dutch Book argument (Ramsey/de Finetti) establishes that if an agent's credences violate the probability axioms, a bookie can construct a set of bets, acceptable to the agent at a single time, that guarantee a net loss. Crucially, the bookie requires no information the agent lacks; the inconsistency is internal to the agent's current state.

  The Teller–Lewis diachronic argument attempts to justify *Conditionalization*. It shows that if an agent plans to update by a rule other than Conditionalization, a bookie can construct a sequence of bets (one before evidence $E$ arrives, one after) that guarantees a loss. However, critics press an **Epistemic Asymmetry Objection**: unlike the synchronic case, the diachronic bookie must wait to see which $E$ obtains before offering the second bet. Thus, the bookie possesses knowledge (which $E$ is true) that the agent does not possess at the time the betting strategy is initiated. Critics argue this makes the loss a result of the bookie's informational advantage rather than the agent's irrationality.

  Consider the following variant to address this objection:
  > **The Preannounced Policy Variant:** We describe an agent not merely by current credences, but by current credences plus a preannounced updating policy (a function mapping possible evidence to posterior credences). We deem the agent irrational only if a bookie can construct a sequence of bets such that the agent's *policy-relative ex ante balance* is negative regardless of which evidence obtains. In this scenario, the betting strategy is fixed at $t_0$ based on the announced policy, even if the second bet is physically exchanged at $t_1$.

  **Write an essay addressing the following:**
  1.  Does the Preannounced Policy Variant successfully dissolve the Epistemic Asymmetry Objection? Explain why the shift to *ex ante* balance matters for the bookie's informational advantage.
  2.  Does this reformulation smuggle in a stronger normative commitment than the synchronic argument licenses (e.g., regarding planning vs. disposition)?
  3.  Given that Accuracy-Dominance arguments (e.g., Greaves–Wallace) also justify Conditionalization via *ex ante* expectations, does the Dutch Book apparatus in this variant do any independent work, or is it merely heuristic dressing for a pragmatic translation of an epistemic norm?

  ***

  ### Model Answer

  The Epistemic Asymmetry Objection posits that diachronic Dutch Books exploit the agent's inevitable ignorance of future evidence, rather than a flaw in reasoning. In the standard Teller–Lewis setup, the bookie constructs a strategy at $t_0$ but executes the second leg at $t_1$ contingent on $E$. Since the bookie must know $E$ to ensure the loss, and the agent only learns $E$ at $t_1$, the bookie operates with an informational advantage unavailable in the synchronic case. The Preannounced Policy Variant attempts to neutralize this by shifting the evaluation of the loss to the *ex ante* perspective at $t_0$.

  This variant largely dissolves the *informational* asymmetry. By fixing the betting strategy at $t_0$ based on the preannounced policy, the guarantee of loss becomes a property of the agent's current state (credences + policy rule) rather than a consequence of the bookie's future knowledge. The bookie does not need to wait to see $E$ to know that the *strategy* yields a loss; they only need to know the agent's policy and credences, both available at $t_0$. The second bet is effectively contracted at $t_0$, contingent on $E$, much like a futures contract. Therefore, the "sure loss" is synchronic relative to the agent's planning state, removing the charge that the bookie exploits private information about the world.

  However, this resolution smuggles in a stronger normative commitment regarding the nature of rational agency. The synchronic argument requires only that an agent's current degrees of belief cohere. The Preannounced Policy Variant requires that the agent's current beliefs cohere with a *plan* for future belief revision. This shifts the norm from static coherence to diachronic planning integrity. It assumes the agent is capable of, and obligated to, bind their future self to a rule. This is a heavier lift than the synchronic case; it rules out agents who might update correctly by disposition or habit without explicit precommitment. If rationality requires the capacity for such preannouncement, the argument excludes agents who are intuitively rational but lack sophisticated planning capabilities. Thus, while it saves the Dutch Book from the asymmetry objection, it does so by raising the bar for what counts as an evaluable agent.

  Finally, we must consider whether this variant renders the Dutch Book redundant given Accuracy-Dominance arguments. Accuracy arguments demonstrate that Conditionalization is the unique updating rule that minimizes expected inaccuracy from the *ex ante* perspective. The Preannounced Policy Dutch Book demonstrates that non-Conditionalization leads to guaranteed pragmatic loss from the *ex ante* perspective. Structurally, these are nearly identical: both evaluate the updating rule from the prior perspective using an expectation over possible evidence.

  Consequently, in this variant, the Dutch Book apparatus appears to be heuristic dressing. The heavy lifting is done by the *ex ante* evaluation metric, not the pragmatic nature of the loss. If the norm is "do not adopt a policy that guarantees loss," and this is extensionally equivalent to "do not adopt a policy that guarantees accuracy dominance," the pragmatic framing adds little normative force. It merely translates an epistemic failing (inaccuracy) into a pragmatic one (financial loss) without independent justification for why financial loss is the correct metric for epistemic irrationality. The variant saves the argument from asymmetry but risks collapsing the Dutch Book tradition into a pragmatic shadow of accuracy-first epistemology.

  In conclusion, the Preannounced Policy Variant successfully neutralizes the informational advantage of the bookie by synchronizing the guarantee of loss to $t_0$. However, it achieves this by demanding a planning capacity not required by synchronic coherence, and it renders the pragmatic nature of the Dutch Book largely superfluous compared to accuracy-based justifications.

  ***

  ### Marking Scheme

  **Total Marks:** 25

  **1. Articulation of the Epistemic Asymmetry Objection (5 Marks)**
  *   **Criteria:** Candidate must explain that in the standard diachronic argument, the bookie exploits knowledge of $E$ at $t_1$ which the agent lacks at $t_0$, unlike the synchronic case where all info is simultaneous.
  *   **Common Error:** Conflating the asymmetry with the mere passage of time, rather than the *informational disparity* regarding the evidence $E$.

  **2. Analysis of the *Ex Ante* Balance Shift (5 Marks)**
  *   **Criteria:** Candidate must explain that fixing the strategy at $t_0$ makes the loss a property of the initial state (credences + policy), removing the bookie's need to exploit future knowledge of $E$ to construct the *guarantee*.
  *   **Common Error:** Assuming the bookie still needs to know $E$ to make the profit, missing that the *guarantee* is what matters for irrationality.

  **3. Evaluation of Normative Commitments (Planning vs. Disposition) (5 Marks)**
  *   **Criteria:** Candidate must identify that the variant requires the agent to have a preannounced *plan*, imposing a stronger cognitive/volitional demand than the synchronic argument (which requires only static coherence).
  *   **Common Error:** Treating the "policy" as identical to a dispositional tendency, ignoring the commitment/planning aspect.

  **4. Comparison with Accuracy-Dominance Arguments (5 Marks)**
  *   **Criteria:** Candidate must note the structural similarity (both use *ex ante* expectations) and argue whether the pragmatic framing adds independent normative weight or is redundant.
  *   **Common Error:** Claiming the Dutch Book is strictly superior because "money is real" without addressing the structural equivalence in the *ex ante* variant.

  **5. Synthesis and Conclusion (5 Marks)**
  *   **Criteria:** A coherent judgment on whether the variant saves the argument overall, balancing the solution to asymmetry against the costs of stronger commitments/redundancy.
  *   **Common Error:** Giving a binary "Yes/No" without weighing the trade-offs identified in points 3 and 4.

  **Differentiator (A vs. B Answer):**
  *   **B Answer:** Correctly identifies that the *ex ante* shift solves the informational asymmetry and notes the similarity to accuracy arguments.
  *   **A Answer:** Distinguishes between the *source* of normativity. Specifically, an A answer will note that while the *ex ante* Dutch Book avoids the asymmetry, it transforms the norm from "avoiding inconsistency" to "avoiding self-sabotage," which may not map cleanly onto *epistemic* irrationality unless one accepts a pragmatic bridge principle. It will explicitly critique whether "guaranteed loss" is the right metric for *belief* updating, even *ex ante*.
