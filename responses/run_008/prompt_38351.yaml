      *   **Specific Paradox:** The "Pinocchio Paradox" (Pinocchio says "My nose is growing now"). If it grows, he told the truth (so it shouldn't grow). If it doesn't grow, he lied (so it should grow).
      *   **Nuance:** The nose tracks *lying* (intent to deceive), not just *falsity* (objective mismatch). This conflates insincerity with falsehood.
      *   **Goal:** A reading that takes both the novel and the philosophical debate seriously. Where does the story resist deflationism? Where does it support it? What does it dramatize that standard arguments don't?

  2.  **Deconstruct Deflationism:**
      *   *Core Claim:* "It is true that $p$" is equivalent to "$p$". The predicate 'is true' adds no substantive property. It's for generalization ("Everything he said is true") and endorsement.
      *   *Opponent:* Inflationary/Correspondence/Robust theories (Truth is a real property, causally efficacious, detectable).
      *   *The Pinocchio Challenge:* The nose makes truth-detection causal and physical.

  3.  **Analyze the Pinocchio Text (Collodi):**
      *   *Mechanism:* The nose grows when he *lies*.
