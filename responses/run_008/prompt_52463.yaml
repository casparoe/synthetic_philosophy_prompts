answer: |-
  **Mapping Theory onto the Case**

  Applying speech-act theory to Rudd's apology requires isolating the felicity conditions: acknowledgment of wrong, acceptance of responsibility, expression of regret, and commitment to non-repetition/repair. Rudd clearly acknowledged the wrong (citing the *Bringing Them Home* report's findings on forced removal) and expressed regret ("sorry"). The collective responsibility layer determines who speaks and who bears the burden.

  The **corporate-agency view** fits best here. Rudd speaks not as an individual, but as the Prime Minister embodying the Commonwealth of Australia. The state is the moral agent that enacted the policies; thus, the state apologizes. This bypasses John Howard's objection (the **membership-inheritance view**'s negative correlate) that current citizens should not feel *guilt* for past actions. Rudd accepted *responsibility* without attributing personal guilt to contemporary citizens. The **skeptic** would argue this is merely condolence, but the formal parliamentary motion and bipartisan passage suggest a performative shift in state status, not just sympathy.

  The addressee is complex. Direct victims were the primary target, but many were deceased. The gallery contained survivors and descendants. Speech-act theory struggles here: can you apologize to the dead? The apology functions by addressing the *continuing community*, acknowledging the moral standing of descendants who inherit the trauma.

  The critical friction point is the **commitment condition**. Standard apology theory implies that accepting responsibility entails a commitment to rectify. Rudd committed to "closing the gap" in life expectancy and opportunity, but explicitly excluded compensation schemes recommended in 1997. Under strict speech-act conditions, this renders the apology **impure** or even infelicitous; it acknowledges the debt but refuses the payment. However, if state apologies are distinct from interpersonal ones, perhaps symbolic commitment suffices.

  **Breakdowns: What the Case Does to the Theory**

  The episode reveals significant limitations in the speech-act model when scaled to the political realm.

  First, the **efficacy vs. felicity gap**. Philosophically, the lack of reparations weakens the "commitment" condition. Yet, empirically, the apology mattered profoundly. Survivors reported validation and reduced shame. This suggests speech-act theory misses the **constitutive function** of state apology. It is not merely regretting a past act; it is reconstituting national identity and recognizing the moral standing of the wronged group in the present. The theory treats apology as backward-looking (fixing a wrong), whereas Rudd's act was forward-looking (fixing the relationship).

  Second, the **addressee problem**. Speech-act theory assumes a living interlocutor capable of accepting or rejecting the apology. With the Stolen Generations, many primary victims were dead. The theory has no robust mechanism for intergenerational address. It is silent on how an apology transforms the status of descendants who were not directly wronged but are directly harmed. The theory treats the addressee as a static recipient, whereas here, the addressee is a trans-temporal community.

  Third, the **material/symbolic split**. The theory is silent on why symbolic acknowledgment can politically substitute for material reparations. It treats "commitment to repair" as a binary condition (present or absent). It cannot explain why a verbal commitment to future policy ("closing the gap") was accepted as a valid substitute for retrospective compensation. This isn't just an impure apology; it's a different category of speech act entirely—one that manages political liability while granting moral recognition.

  Finally, regarding collective responsibility, the theory is silent on **authorization**. Corporate agency explains who speaks, but not who authorizes the burden. Taxpayers fund the "commitment to non-repetition," yet they did not vote on this specific speech act. The theory assumes the agent (State) can bind itself freely. It offers no resources to critique the democratic deficit where a government accepts financial responsibility on behalf of citizens who opposed it (Howard's voters).

  In sum, the Rudd apology survives contact with theory only if we stretch the definition of "commitment" and accept corporate agency. But the case breaks the theory by showing that the power of apology lies less in satisfying felicity conditions than in altering political ontology—who counts, who belongs, and what the state admits it is. The theory describes the mechanics of regret; it fails to capture the politics of recognition.
