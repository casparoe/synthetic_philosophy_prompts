answer: |-
  You have identified a classic systemic failure, and your intuition is correct: this is not a personal failing, but a structural one. You are describing the exact moment a **proxy metric** undergoes **surrogation**.

  Since you asked for the mechanism rather than a quick fix, let's look at the underlying dynamics.

  ### 1. When does the measure become the thing?

  There is a name for this: **Goodhart's Law**. It is often stated as: *"When a measure becomes a target, it ceases to be a good measure."* A more precise formulation comes from economist Charles Goodhart himself: *"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."*

  In your case, "word count" was initially a proxy for "engagement with the material." When you were stuck, the barrier was *activation energy*. Word count was a perfectly aligned metric for overcoming activation energy. It measured "time in the chair" and "flow state."

  **The Line:** The line is crossed when the **marginal cost of gaming the metric** becomes lower than the **marginal cost of achieving the actual goal.**

  *   **Phase 1 (Stuckness):** The cost of writing real analysis was high (anxiety, block). The cost of writing *anything* was lower. The metric (500 words) forced you to pay the lower cost, which inadvertently lowered the barrier to the higher cost. The metric was aligned.
  *   **Phase 2 (Padding):** The cost of writing real analysis is still high (thinking, synthesizing). The cost of restating a point in three ways is now *lower* than the cost of thinking up a new point. Because the metric rewards volume, your brain naturally optimizes for the path of least resistance that satisfies the metric. The metric is now misaligned.

  This is also known as **Campbell's Law** in social science: *"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."*

  You are not "gaming" the system consciously; your cognitive processes are simply optimizing for the reward signal you provided. The measure became the thing when the reward signal (hitting 500) diverged from the latent variable you actually care about (historical argumentation).

  ### 2. Does stacking a second metric fix it?

  Your friend's suggestion (count only paragraphs that survive revision) is an attempt to create a **multi-objective optimization function**. In theory, this balances the system. In practice, it usually creates a **Pareto Frontier of Gaming.**

  When you have two metrics, humans do not typically optimize for both equally; they find the optimal trade-off curve that minimizes effort across both.

  Here is why your friend's specific metric is dangerous:
  1.  **It is a Lagging Indicator:** You do not know if a paragraph will survive revision until weeks later. You cannot optimize for it in the moment. This creates anxiety rather than flow.
  2.  **It Incentivizes Conservatism:** If you are rewarded for "survival," you will write safe, undeniable, descriptive paragraphs that an advisor is unlikely to cut. You will avoid risky, dense, argumentative prose that might get slashed. You trade *impact* for *durability*.
  3.  **Complexity Increases Gaming:** With one metric, you game one variable. With two, you game the *relationship* between the variables. For example, you might write 500 words of padding to hit Metric A, and one "safe" paragraph to hit Metric B, feeling you have "won" the day without doing deep work.

  So, to answer your second question: **Stacking metrics rarely fixes surrogation; it just raises the skill floor required to game the system.**

  ### A Principled Way Forward

  You need a system that respects the **process** (overcoming stuckness) without corrupting the **product** (historical argument). The solution is not to abandon metrics, but to **decouple the metrics from the phase of work.**

  Writing is not one activity; it is at least two distinct cognitive modes:
  1.  **Divergent/Generative Mode:** Getting ideas out, overcoming inertia, exploring archives.
  2.  **Convergent/Evaluative Mode:** Cutting, refining, arguing, densifying.

  Your current system applies a Generative metric (word count) to a Convergent problem (revision bloat). Your advisor suggests a Convergent rule ("write when you have something to say") for a Generative problem (stuckness). Both are mismatched.

  **Proposal 1: Switch from Output to Input Metrics**
  Word count is an *output* metric. It measures what you produced. When you are stuck, output metrics are demoralizing. Switch to an *input* metric: **Time.**
  *   *Target:* 90 minutes of deep work per day.
  *   *Rule:* You must sit and work. If you stare at the screen for 90 minutes, you hit the target.
  *   *Why:* This removes the incentive to pad. If you pad, you still have to sit there for 90 minutes. It aligns the cost of gaming the metric (wasting time) with the cost of doing the work (thinking). It preserves the habit without incentivizing verbosity.

  **Proposal 2: The "Zero Draft" Designation**
  If you keep the word count, you must change the *status* of the words.
  *   Designate your daily 500 words as **"Exploratory Draft."**
  *   Explicitly acknowledge that these words are *not* the thesis. They are the raw material.
  *   **The Metric Shift:** Do not count these words toward the final manuscript. Count them toward a "Raw Material" bucket.
  *   **The Second Metric:** Your *revision* sessions get a different metric: **Density.** (e.g., "Reduce this section by 20% without losing information.")
  *   *Why:* This separates the "production" goal from the "quality" goal. You give yourself permission to write garbage to keep the momentum (solving the stuckness), but you formally acknowledge that those words are not the "thing" being measured for quality.

  **Proposal 3: Task-Based Tracking**
  Instead of words, track **historical moves.**
  *   Did I analyze one primary source?
  *   Did I engage with one historiographical debate?
  *   Did I resolve one logical gap?
  *   *Target:* 1 "Move" per day.
  *   *Why:* This forces you to define what "work" means in your discipline. A "Move" might take 200 words or 2,000 words. It aligns the metric with the *intellectual labor* of a historian, not the *mechanical labor* of a typist.

  ### Summary
  The mechanism you spotted is **Surrogation via Goodhart's Law**. The measure stopped tracking the latent variable (progress) and started tracking itself (volume).

  Stacking metrics usually fails because it creates complex loopholes rather than closing them.

  The fix is to recognize that **momentum** and **quality** are antagonistic goals that require separate regimes. Keep the habit (the daily commitment), but change the unit of account from *words* (which incentivize padding) to *time* (which incentivizes presence) or *tasks* (which incentivize intellectual progress).

  You solved the stuckness. Now you must solve the signal-to-noise ratio. Don't measure the noise; measure the time you spend filtering it.
