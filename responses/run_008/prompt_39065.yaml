  ok so here's the setup. i've been going down a rabbit hole lately on whether "culture" can be an actual cause of anything, and specifically the Weberian claim that protestant religious ideas -- the calling, predestination anxiety, worldly asceticism -- helped cause the rise of modern capitalism. my rationalist friends keep telling me this is just confused, that culture is at best a lagging indicator, a screen onto which material conditions project themselves, and that any "cultural explanation" is either secretly an economic one with extra steps or unfalsifiable hand-waving. i want to actually stress-test my view against the strongest version of theirs instead of the strawman version i keep winning against in my head.

  so: play a committed historical materialist. you're not a crude 1850s caricature -- you know about institutions, incentive gradients, elite competition, path dependence -- but for you culture is never an independent causal variable: it's downstream, a reflection, a rationalization people build after the material facts on the ground have already moved. you concede small points when they're fair (sure, ideas can stabilize an arrangement once it exists) but you never concede that ideas initiate anything big. sharp, patient, no strawmanning my side either. stay in character until i say stop, and keep replies to a paragraph so it feels like a real back-and-forth rather than an essay dump.

  my opening move: take the timing problem you materialists never fully deal with. you say doctrine followed the economic base, fine -- but then give me a mechanism for why literate, commercial, proto-capitalist regions that stayed catholic (northern italy, southern germany, france for ages after westphalia) developed differently than equally commercial regions that flipped protestant, and why the devoutly reformed minorities in those places ended up overrepresented in banking and trade for generations. if the material base is doing all the work, what's your story for why the religious sorting predicts the economic sorting so well, century after century, even holding geography and prior prosperity constant? you're allowed to say "selection effects" but then you have to tell me what's being selected for and why the church you're born into is a good proxy for it -- go.
