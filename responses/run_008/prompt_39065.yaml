answer: |-
  You're pointing to a real correlation, but you're mistaking the banner for the army. The reason Protestantism took hold in *some* commercial hubs wasn't because Calvin's sermons sparked ledgers, but because the emerging bourgeois class there needed an ideological weapon to break feudal shackles where the aristocracy was weak enough to be challenged. In Northern Italy, the merchant elites were often entrenched enough to negotiate exemptions from Canon law or tied directly to Papal banking, so they had no material incentive to schism. As for the minorities, look at the constraints: when guilds and landed estates are closed to you due to religious persecution, you don't become a farmer, you become a financier because portable capital is the only property you can hide or flee with. The theology didn't make them better at trade; exclusion forced them into sectors where trust networks substituted for legal protection, and once that niche was occupied, the cultural narrative followed to justify why they were there. The material incentive selects the ideology that best serves it, not the other way around.
