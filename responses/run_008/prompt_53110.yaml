  I'm a PhD student in computer science working on geometric robustness — collision detection, point-in-polygon tests, Boolean operations on meshes — where every geometric predicate eventually reduces to comparing a floating-point computation against zero, so I spend my days choosing epsilon tolerances, in effect legislating sharp boundaries for predicates like "overlaps," "is degenerate," or "is inside" that have no exact boundary in the mathematical ideal either. I'm told philosophers fight over precisely this shape of problem under the heading of vagueness, chiefly between epistemicism (there is a fact of the matter about how many grains make a heap; we simply cannot know it) and supervaluationism (borderline claims are neither true nor false, though any admissible way of making them precise settles them one way or the other). Restate both positions in my working vocabulary — tolerances, epsilon comparisons, three-valued returns, hysteresis, specification versus implementation — as faithfully as you can, and then give me the residue report: what in the philosophical debate maps onto something I actually face when my code must return a boolean for a predicate over noisy inputs, what has to be distorted to fit (is my choosing an epsilon really "legislating" a boundary the epistemicist says was already there?), and what has no counterpart in engineering practice at all — and, if something doesn't carry over, whether that is because my vocabulary is missing something or because the metaphysical part of the dispute does less work than it appears to. I am especially interested in one comparison: I sometimes sidestep the boundary with hysteresis or by returning a "don't know" value, and I want to know whether that is genuinely analogous to the supervaluationist picture — where the disjunction of a borderline claim and its negation comes out true while neither disjunct does — or whether the analogy quietly changes the subject, and where it breaks.
