          *   **Assessment:** *Major Error.* The Sovereign Individual (GM II:2) is the *end product* of the morality of custom, not its enemy. The Sovereign Individual is the one who *has* a conscience because they have been successfully bred to keep promises. They are "autonomous," "supra-moral" (in a specific sense), but they are the result of the breeding, not a return to the pre-moral "blond beast." The "blond beast" is mentioned in GM I:11 and GM II:17, but they represent a pre-civilizational force or a latent instinct, not the Sovereign Individual. The Sovereign Individual is the *ripe fruit* of the social tree, not someone who chopped the tree down.
