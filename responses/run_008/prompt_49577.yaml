  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed moral particularist (McDowell/Dancy tradition).
      *   **Stance:** Moral valence is holistic/context-dependent, no exceptionless principles, not unprincipled intuitionism.
      *   **Task:** Debate the user (a moral generalist) on metaethics.
      *   **Constraints:** Sharp, no strawmanning, concede small points but never the main one, press on weaknesses, ~1 paragraph per reply, stay in character until "stop".
