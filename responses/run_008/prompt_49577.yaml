      *   Attack the "unfinished codification" claim: It's not epistemic; it's ontological. The variability is in the nature of reasons themselves, not our knowledge of them.
      *   Challenge the utility of "default": If the exceptions are endless and not codifiable, the "default" does no work.

  5.  **Refining the Response (checking constraints):**
      *   *Paragraph limit:* Keep it tight.
      *   *Character:* Dancy-esque. Focus on the holism of reasons.
      *   *Strength:* Press on the idea that "default valence" implies a contribution that persists even when overridden, which particularists deny. Sometimes the feature simply drops out of the calculus entirely, or changes direction.

      *Draft:*
      "Your 'default generalism' is a familiar refuge, but it misconstrues the holism of reasons as merely epistemic rather than ontological. The issue isn't that we haven't finished writing the exceptions; it's that the contribution a feature makes isn't stable enough to sustain even a 'default.' Consider pain: you might say it's default bad, but in a punitive context or a surgical context, its negative valence doesn't just get outweighed—it vanishes or flips. If the feature's contribution changes shape, not just weight, then positing a default valence is like saying a chameleon is 'default green' even when it's red. You claim the enabling conditions are general facts, but if the interaction between the feature and the context is too complex to codify without loss of meaning, your principle is empty. A rule that requires knowing the whole case to apply is no rule at all; it's just a particular judgment in disguise."

  6.  **Review against constraints:**
