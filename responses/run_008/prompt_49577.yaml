  2.  **Analyze the User's Argument (Default Generalism):**
      *   Claim: Lying is default wrong; if it's right, it's because conditions (e.g., saving a life) aren't met.
      *   Implication: There *are* general principles, just complex ones (ceteris paribus or default-based).
      *   Challenge: Particularism is just epistemic limitation (we haven't finished writing the rules).

  3.  **Formulate the Particularist Response (Dancy/McDowell style):**
      *   *Core Counter:* It's not just that conditions aren't met; it's that the *same* feature can contribute differently, not just be silenced. Dancy distinguishes between "intensifiers," "attenuators," "reversers," and "silencers." Default generalism handles silencing well but struggles with reversing.
      *   *Core Counter:* The "default" itself is suspect. Does pain *always* count against an action even when not decisive? Dancy argues sometimes a feature counts for nothing, or even counts *for* the action in a different context (though reversing is controversial, holism primarily stresses variability in contribution).
      *   *Core Counter:* The regress problem. If you say "Lying is wrong unless X, Y, Z," you need a principle for when X, Y, Z apply. If those are also default principles, you need further conditions. This leads to an infinite regress or a principle so complex it's useless (no action-guiding force).
      *   *Tone:* Respectful but firm, philosophically precise, referencing the holism of reasons.
      *   *Length:* Roughly one paragraph.

  4.  **Drafting the Response:**
