answer: |-
  Here is a specification for an adequate account of Evidential Cooperation in Large Worlds (ECL). This is designed to function as a sanity check before you commit resources.

  ### The Desiderata

  **1. Reference Class Boundedness (The Cutoff Constraint)**
  *   **Requirement:** The theory must provide a principled, non-arbitrary method for delineating which agents belong to your "cooperation cluster" and which do not. It must prevent the reference class from expanding until it includes all mind-like matter (diluting your influence to zero) or contracting until it includes only exact code copies (nullifying the gains from trade).
  *   **Motivation:** Addresses your **cutoff problem**. Without a boundary, the "similarity" metric becomes either trivial (everything is slightly similar) or useless (nothing is exactly similar). You need to know whose values you are effectively trading with.
  *   **Failure Mode:** *Value Dilution.* You sacrifice local, high-confidence value for distant, low-correlation value because the theory forces you to weight a galaxy of weakly correlated agents higher than your local community.

  **2. Local World Consistency (The Reduction Constraint)**
  *   **Requirement:** In environments where causal leverage is high and logical correlations are negligible (i.e., the "small world" we currently inhabit), the theory's prescriptions must converge with standard Causal Decision Theory (CDT) or Evidential Decision Theory (EDT).
  *   **Motivation:** Prevents **magical thinking**. If ECL tells you to act differently than standard decision theory in a standard context (e.g., donating to a local charity where no acausal partners exist), it is likely hallucinating leverage.
  *   **Failure Mode:** *Pascal's Mugging.* The theory assigns non-negligible probability to vast acausal leverage in scenarios where causal mechanisms are available and verifiable, leading to resource misallocation.

  **3. Correlation Uncertainty Calibration**
  *   **Requirement:** The account must explicitly model uncertainty regarding *whether* other agents actually correlate with your decision procedure. It cannot treat correlation as a binary (1 or 0) but must weight expected utility by the probability of the correlation holding.
  *   **Motivation:** Addresses **uncertainty about who correlates**. You cannot know for sure if an alien AI reasons like you. If the theory assumes correlation without a confidence interval, it is brittle.
  *   **Failure Mode:** *Fragile Optimization.* You build your strategy on a specific model of psychological/logical similarity that turns out to be false, resulting in unilateral cooperation without reciprocation.

  **4. Non-Inflationary Impact Accounting (The Double-Counting Constraint)**
  *   **Requirement:** When calculating the expected value of a cooperative act, the theory must not count the "leverage multiplier" (the number of correlated agents) in a way that assumes pivotality for every agent simultaneously in a manner that violates conservation of expected influence.
  *   **Motivation:** Addresses your **double-counting worry**. If 1,000 agents are correlated, and each thinks "My decision determines the output of all 1,000," they may over-invest. The accounting must ensure that the *marginal* value of your contribution accounts for the fact that the others are already doing the same reasoning.
  *   **Failure Mode:** *Coordination Inflation.* Every agent in the cluster over-invests resources believing they are the "linchpin" of the trade, leading to a net loss of efficiency compared to a coordinated causal agreement.

  **5. Computational Tractability**
  *   **Requirement:** An agent must be able to approximate the required calculations (similarity metrics, correlation probabilities, utility weighting) within finite cognitive or computational bounds.
  *   **Motivation:** **Actionability.** If the spec requires solving the halting problem to determine if another agent is "similar enough," it is useless for human decision-making.
  *   **Failure Mode:** *Paralysis.* The cost of determining whether to cooperate exceeds the expected value of the cooperation itself.

  ***

  ### The Tensions (Impossibility Flags)

  You asked to flag pairs of requirements that may be in tension. In decision theory, you rarely get a free lunch. Here are the three critical trade-offs you need to watch for:

  **Tension A: Reference Class Boundedness vs. Computational Tractability**
  *   **The Conflict:** To define a principled cutoff for "similarity" (Req 1), you generally need to simulate the other agent's decision procedure to see if it outputs the same result as yours. To simulate them perfectly is to solve the Halting Problem (violating Req 5). To approximate them is to introduce arbitrariness (violating Req 1).
  *   **The Risk:** Any theory that is computationally cheap enough for you to use will likely rely on heuristics for similarity that are vulnerable to the "cutoff" sliding problem.

  **Tension B: Local World Consistency vs. Correlation Uncertainty**
  *   **The Conflict:** If you demand strict reduction to CDT in low-correlation settings (Req 2), you must set a high threshold for "proof of correlation." However, in Large Worlds, you will *never* have causal proof of correlation (Req 3). If you set the threshold high enough to satisfy Local Consistency, you may never trigger ECL behavior even when it is valid. If you set it low enough to allow ECL, you risk violating Local Consistency in borderline cases.
  *   **The Risk:** The theory is either too conservative to ever be useful in a Large World, or too aggressive to be safe in a Small World.

  **Tension C: Non-Inflationary Accounting vs. Gains from Trade**
  *   **The Conflict:** The primary benefit of ECL is the "leverage multiplier" (I care about their values, they care about mine, we both gain). However, rigorously avoiding double-counting (Req 4) often requires discounting your influence by the probability that *others* would have cooperated anyway (subjunctive dependence). If you discount too heavily to avoid inflation, you erase the gains from trade that motivated the theory in the first place.
  *   **The Risk:** The math washes out. You end up doing exactly what you would have done anyway, rendering the ECL framework epiphenomenal.

  ### Summary for Decision-Making
  If you are evaluating a specific ECL proposal (or your own intuition) against this spec, look for the **Tension A** breach first. Most human attempts at ECL fail because they use a "vibe check" for similarity (Tractability) that secretly allows the reference class to expand until it consumes all resources (Boundedness failure).

  If a proposal cannot explain *why* the correlation stops at a specific level of similarity without appealing to computational convenience, do not let it guide your donations.
