      *   User's specific worries:
          *   *Cutoff Problem:* Who counts as a partner? (Reference class problem).
          *   *Reduction:* Does it collapse to CDT/EDT in normal settings?
          *   *Uncertainty:* How do I know who correlates with me?
          *   *Double-Counting:* If we all think we're influencing each other, do we overvalue the trade?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Actionability/Computational Tractability.* If I can't calculate it, I can't use it.
          *   *Motivation:* I need to make actual decisions (donations, career).
          *   *Failure Mode:* Paralysis or arbitrary guessing.

      *   *Requirement 2: Reference Class Stability (The Cutoff).*
          *   *Motivation:* Avoiding the "cooperate with everything" dilution.
          *   *Failure Mode:* Value dilution (spending resources on things that don't actually correlate).

      *   *Requirement 3: Conservative Reduction (Small Worlds).*
          *   *Motivation:* If there are no acausal partners, it should look like normal decision theory.
          *   *Failure Mode:* Acting as if you have leverage when you don't (magical thinking).

      *   *Requirement 4: Correlation Uncertainty Handling.*
          *   *Motivation:* I don't know for sure if aliens/AI copy my reasoning.
          *   *Failure Mode:* Overconfidence in correlations that don't exist.

      *   *Requirement 5: No Double-Counting (Symmetry).*
          *   *Motivation:* If I value their output $X$, and they value my output $Y$, we shouldn't both count the total surplus as $X+Y$ if the mechanism relies on mutual expectation. Actually, the worry is more about *influence*. If I think I'm causing their action, and they think they're causing mine, do we over-invest?
          *   *Refinement:* The worry is usually about *value*. If I cooperate because I think it helps them, and they cooperate because they think it helps me, is the benefit counted twice? Or is the worry that everyone assumes *they* are the pivotal voter in the coalition? Let's frame it as "Non-Inflationary Valuation."

      *   *Requirement 6: Value Stability/Alignment.*
          *   *Motivation:* Don't end up optimizing for a distorted version of your values just to fit the coalition.
          *   *Failure Mode:* Wireheading or value drift to match the "average" partner.

  4.  **Identifying Tensions (The "Impossible Theorems"):**
      *   *Tension 1: Reference Class Precision vs. Computational Tractability.* To define the cutoff precisely requires simulating other agents to check similarity. That's computationally expensive (Halting problem adjacent).
      *   *Tension 2: Conservative Reduction vs. Large World Leverage.* If you demand it reduces strictly to CDT in low-correlation settings, you might lose the gains from trade in high-correlation settings where correlation is hard to prove but plausible. (The "Pascal's Mugging" edge).
      *   *Tension 3: Uncertainty Handling vs. Actionability.* Being perfectly Bayesian about correlation uncertainty might lead to decision paralysis or extreme sensitivity to priors.

  5.  **Refining and Polishing (Matching the User's Voice):**
      *   The user wants a "spec." Use technical but clear language.
      *   Make sure to explicitly address their specific worries (Cutoff, Reduction, Uncertainty, Double-counting).
      *   Highlight the trade-offs clearly.

  6.  **Final Review against Constraints:**
      *   Did I score proposals? No.
      *   Did I include motivations? Yes.
      *   Did I flag tensions? Yes.
      *   Did I address the specific worries? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the "Double-Counting" point. In ECL, the benefit comes from *substituting* local pursuit for coalition pursuit. The risk isn't necessarily arithmetic double-counting, but rather *misestimating the exchange rate*. If I think I'm trading 1 unit of my resources for 1000 units of theirs, and they think the same, but the actual correlation is weak, we both lose. Let's frame this as "Exchange Rate Calibration."

      *(Refining the Cutoff)*: The user calls it the "cutoff problem." I should use that term but formalize it as "Reference Class Boundedness."

      *(Refining Reduction)*: Call it "Local World Consistency."

  7.  **Final Output Structure:**
      *   Intro (acknowledging the stakes).
      *   The Desiderata (numbered, with Motivation and Failure Mode).
      *   The Tensions (The "Impossible Triangle" or similar).
