  CO-OP RULE VETTING: NON-DOMINATION CHECK
  Use this order. Stop at first FAIL. If Step 5, punt to general vote.

  1. **INTERFERENCE:** Does the rule restrict what a member can do?
     *   *No:* Skip to Step 5.
     *   *Yes:* Proceed.

  2. **ARBITRARINESS (The Mercy Test):** Does compliance depend on someone's whim or unchecked discretion?
     *   *Yes (e.g., "Board approval required"):* **FAIL** (Domination).
     *   *No (e.g., fixed standards):* Proceed.

  3. **REAL CONTESTABILITY (The Safety Test):** Can a member challenge application without fear, cost, or complexity?
     *   *Note:* Formal right to appeal isn't enough if it's costly or risky.
     *   *No:* **FAIL** (Domination via unchallengeable power).
     *   *Yes:* Proceed.

  4. **INTEREST TRACKING:** Does the rule serve common interests, not just administrative convenience?
     *   *No:* **FAIL** (Power not tracking interests).
     *   *Yes:* Proceed.

  5. **VALUES PUNT:** Is this purely about community character (e.g., quiet vs. lively)?
     *   *Yes:* **VALUES-CALL** (Not a freedom issue).
     *   *No:* **PASS** (Non-dominating interference).

  **MISFIRE WARNING:** This may flag necessary emergency powers as failures. It also misses social pressure (shaming) that isn't rule-based. It prioritizes security over efficiency.

  **APPLICATION RESULTS**
  Verdict: FAIL No appeal clause grants board arbitrary power over homes.
  Verdict: VALUES-CALL Restricts choice but lacks arbitrary personal mastery over members.
