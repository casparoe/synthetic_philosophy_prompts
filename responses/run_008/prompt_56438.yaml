          *   Step 2: Volatility Assessment (The "How Likely?").
          *   Step 3: The Qualification Check (The "Hidden Gotchas").
          *   Step 4: The Decision (Trust, Verify, or Escalate).
      *   *Honesty Marker:* Need to explicitly flag where "High/Medium/Low" is subjective.

  4.  **Developing the Three Cases:**
