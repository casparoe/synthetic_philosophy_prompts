          *   *Outcome:* Verify. (Unwelcome answer? Maybe, because it adds latency, but safety dictates it).
      *   **Case 2: K8s Cluster (Resize Deployment).**
          *   *Risk:* Downtime, cost explosion. Very High impact.
          *   *Volatility:* High (other agents, autoscalers, humans).
          *   *Verification:* Moderate (API call).
