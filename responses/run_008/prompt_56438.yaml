  2.  **Deconstruct the "Frame Problem" Connection:**
      *   *Philosophical Frame Problem:* How does a reasoner know what *doesn't* change when an action occurs? (e.g., If I paint the wall red, does the floor change color? No. But how do I know without checking everything?)
      *   *Engineering "Frame Problem" (in this context):* How does an agent know if its internal model of the world is still valid given external changes it didn't observe?
      *   *Qualification Problem:* What preconditions are necessary for an action to succeed? (e.g., To start a car, I need keys, battery, gas... but also no potato in the tailpipe.)
      *   *Relevance:* What facts are pertinent to the current goal?
      *   *Verdict:* The user is *not* wrong to use the term, but they are stretching it. The classical Frame Problem is about *deductive reasoning over time steps* in a closed world. The user's problem is *observational uncertainty* in an open world. However, the *spirit* of the problem (managing the explosion of potential state changes vs. computational cost) is identical. The philosophical distinction between "what stays the same" (Frame) and "what conditions must hold" (Qualification) is actually very useful for engineering runbooks. I need to validate the connection without overstating it. It's not *the* Frame Problem, but it's a *Frame Problem-like* challenge.

  3.  **Drafting the Decision Procedure:**
      *   Needs to be actionable.
      *   Needs to distinguish between:
          1.  **Staleness Risk:** How likely is this to change?
          2.  **Impact Cost:** How bad is it if this is wrong?
