answer: |-
  ### Part 1: The Honesty Check on Framing

  You asked me to be direct about whether "The Frame Problem" is the right lens. Here is the verdict:

  **You are right about the symptom, but slightly off on the diagnosis.**

  The classical **Frame Problem** (McCarthy & Hayes, 1969) is about *logical deduction*: "If I paint the wall red, how do I know the floor didn't turn blue without checking every axiom in my database?" It assumes a closed world where rules are perfect.

  Your problem is **Observational Coherency in an Open System**. You aren't worried about logical deduction; you're worried about *latency vs. consistency*. The world changes asynchronously (customers upgrade plans, autoscalers kick in, humans edit docs), and your agent's internal map drifts from the territory.

  **However, the philosophical distinctions *are* load-bearing for your runbook.**
  1.  **The Frame Distinction:** Helps you separate "What usually stays true" (inertia) from "What changes frequently" (volatility).
  2.  **The Qualification Problem:** This is critical. It asks: "What hidden preconditions must be true for this action to work?" (e.g., "I can resize the deployment *provided* the API isn't rate-limiting me *and* the cluster isn't already at max capacity"). Engineers often check the main fact but miss the qualifications.
  3.  **Relevance:** Helps you avoid the "re-read everything" trap. You only need to check facts *relevant* to the specific action's preconditions.

  **Verdict:** Do not call it "The Frame Problem" in your Jira tickets; your SREs will roll their eyes. Call it **"State Coherency & Qualification Checking."** But use the philosophical logic to build the procedure. It prevents you from treating all cached data as equal.

  ---

  ### Part 2: The Decision Procedure (The "Coherency Runbook")

  This procedure is designed to be called by the agent (or the engineer configuring the agent) before executing an action that relies on non-fresh data.

  **Legend:**
  *   **[JUDGMENT]**: This step requires a human-defined threshold or policy. The procedure cannot calculate this automatically.
  *   **[HARD STOP]**: The procedure dictates a specific technical action.

  #### Step 1: The Impact Assessment (The "So What?")
  *Question:* If this cached fact is wrong, what is the blast radius?
  *   **Level A (Catastrophic):** Data loss, security breach, financial penalty, production outage.
  *   **Level B (Correctable):** Wasted compute, user annoyance, requires a follow-up apology/refund.
  *   **Level C (Negligible):** Minor formatting error, internal log noise.

  *[JUDGMENT]: Your business must define which actions map to A, B, or C. The agent cannot decide this alone.*

  #### Step 2: The Volatility Assessment (The "Frame Check")
  *Question:* How likely is this fact to have changed since we cached it?
  *   **Static:** Changes rarely (e.g., Customer ID, Company Name).
  *   **Drifting:** Changes occasionally (e.g., Subscription Tier, Cluster Size).
  *   **Fluid:** Changes constantly or concurrently (e.g., Queue depth, Document text during edit, Pod status).

  *[JUDGMENT]: This requires metadata tags on your data sources. If you don't track volatility, you must default to "Fluid".*

  #### Step 3: The Qualification Check (The "Potato in the Tailpipe")
  *Question:* Are there hidden preconditions for this action that are *not* in the cached fact but are required for success?
  *   *Example:* Cached fact = "Cluster has 5 nodes." Action = "Add 5 nodes." Qualification = "Is the quota limit > 10?" "Is the cloud provider API healthy?"
  *   **Decision:** If the action has external dependencies (APIs, other services, human approvals), mark Qualification Risk as **High**.

  #### Step 4: The Verification Cost
  *Question:* What is the latency/financial cost to re-read this from source?
  *   **Cheap:** <100ms, local DB lookup.
  *   **Expensive:** >1s, external API call with rate limits, complex computation.
  *   **Impossible:** No source of truth exists (e.g., "What was the customer's mood 5 minutes ago?").

  #### Step 5: The Decision Matrix

  | Impact | Volatility | Qualification Risk | Verification Cost | **Decision** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A (Catastrophic)** | Any | Any | **Cheap** | **HARD STOP: Re-verify.** |
  | **A (Catastrophic)** | Any | Any | **Expensive** | **HARD STOP: Re-verify (accept latency).** |
  | **A (Catastrophic)** | Any | Any | **Impossible** | **ESCALATE: Human Review Required.** |
  | **B (Correctable)** | **Static** | Low | Any | **PROCEED:** Trust Cache. |
  | **B (Correctable)** | **Drifting** | Low | **Cheap** | **PROCEED:** Trust Cache (Log for audit). |
  | **B (Correctable)** | **Drifting** | Low | **Expensive** | **[JUDGMENT]:** Business Policy (Speed vs. Accuracy). |
  | **B (Correctable)** | Any | **High** | **Cheap** | **HARD STOP: Re-verify Qualifications.** |
  | **C (Negligible)** | Any | Any | Any | **PROCEED:** Trust Cache. |
  | **Any** | **Fluid** | Any | Any | **HARD STOP:** Cache is invalid by definition. Re-read or Lock. |

  ---

  ### Part 3: Running the Procedure on Your Backlog

  Here is how the runbook applies to your three specific cases.

  #### Case 1: Customer Plan Tier (Refund Policy)
  *   **Context:** Agent cached "Business Tier" at session start (20 mins ago). About to offer a refund governed by Business Tier rules.
  *   **Step 1 (Impact):** **Level A (Catastrophic/High).** Giving a refund based on the wrong tier violates finance policy. Could be financial loss or compliance breach.
  *   **Step 2 (Volatility):** **Drifting.** Tiers don't change every second, but users do upgrade/downgrade between sessions or even during long support chats.
  *   **Step 3 (Qualification):** **Low.** The rule is straightforward: Tier -> Policy.
  *   **Step 4 (Verification Cost):** **Cheap.** DB lookup of `customer.plan_id`.
  *   **Step 5 (Decision):** **HARD STOP: Re-verify.**
  *   **Engineering Note:** You might dislike this because it adds latency to the conversation. But the procedure flags this as a "Silent Failure" risk. If the user upgraded 19 minutes ago, your cache is poison. The cost of a DB read is negligible compared to a finance audit failure.

  #### Case 2: Kubernetes Cluster Resize
  *   **Context:** Agent model says "3 replicas." Agent wants to scale to "5 replicas." Cache is 5 minutes old.
  *   **Step 1 (Impact):** **Level A (Catastrophic).** Over-scaling costs money; under-scaling causes outage. Modifying prod infra is high risk.
  *   **Step 2 (Volatility):** **Fluid.** HPA (Horizontal Pod Autoscaler) might have already changed it. Other agents might be acting.
  *   **Step 3 (Qualification):** **High.** Quotas, node availability, API rate limits, maintenance windows.
  *   **Step 4 (Verification Cost):** **Expensive.** K8s API call is slower than local cache, plus potential rate limiting.
  *   **Step 5 (Decision):** **HARD STOP: Re-verify + Qualification Check.**
  *   **Engineering Note:** The procedure forces you to ignore the cached "3 replicas." You must query the live state *and* check the qualifications (quotas). If the API is down (Verification Impossible), you must Escalate (do not act).

  #### Case 3: Concurrent Document Editing
  *   **Context:** Agent fetched a spec doc 2 minutes ago. Human is actively editing the doc *right now*. Agent is drafting a reply based on the fetched text.
  *   **Step 1 (Impact):** **Level B (Correctable) to A (Catastrophic).** If the agent promises a feature that was just deleted from the spec, it's a hallucination/breach of trust.
  *   **Step 2 (Volatility):** **Fluid.** By definition, a human is editing concurrently.
  *   **Step 3 (Qualification):** **High.** The agent needs to know *which version* it is reading.
  *   **Step 4 (Verification Cost):** **Impossible (for true coherence).** Re-reading the doc doesn't help if the human is typing *while* the agent reads. There is a race condition.
  *   **Step 5 (Decision):** **ESCALATE: Procedure Cannot Help.**
  *   **The Unwelcome Answer:** This is the case you asked for. The decision procedure breaks here.
      *   **Why:** The Frame Problem assumes a discrete sequence of events. Concurrent editing is continuous and asynchronous. A "cache check" cannot solve race conditions between a human and an LLM.
      *   **Required Fix:** This is not a caching problem; it is a **locking problem**. You cannot run this agent safely on concurrent documents without implementing operational transforms (OT), CRDTs, or a "read lock" that prevents the human from saving while the agent reads.
      *   **Runbook Output:** "Do not deploy. Architecture mismatch."

  ---

  ### Part 4: Where the Procedure is a Judgment Call

  You requested I mark where this is "dressed up." Here are the weak points you need to own as an engineering lead:

  1.  **Impact Classification (Step 1):** The procedure treats "Impact" as an input. It is not. It is a business policy. If your CFO says "Refunds under $50 are negligible," that changes Case 1 from a HARD STOP to a PROCEED. The procedure cannot derive risk tolerance; it only enforces it.
  2.  **Volatility Metadata (Step 2):** The procedure assumes you *know* a fact is "Drifting" vs. "Fluid." In reality, you often won't know until something breaks. You will need a feedback loop (post-mortems) to tag data sources correctly. Until then, this step is a guess.
  3.  **The "Cheap" Verification Threshold:** I defined "Cheap" as <100ms. In a high-frequency trading bot, that's an eternity. In a customer support bot, that's instant. You must define this threshold per service level objective (SLO).

  ### Summary for the Team

  1.  **Don't call it the Frame Problem.** Call it **Coherency & Qualification**.
  2.  **Adopt the Matrix.** Force every agent action to map to an Impact/Volatility/Cost tuple.
  3.  **Accept the Limit.** Case 3 shows that some problems (concurrent mutation) cannot be solved by better caching logic. They require architectural locks. If the procedure says "Impossible," do not try to hack the prompt; change the system design.
