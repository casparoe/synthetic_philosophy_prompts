  3.  **Evaluate the Philosophical Positions:**
      *   **Pragmatic Encroachment (PE):** Associated with Jeremy Fantl, Matthew McGrath, Jason Stanley. Core claim: Knowledge depends on practical factors (stakes) independent of truth-conducive factors (evidence, reliability). *Bank Case* is the standard example.
      *   **Contextualism:** Associated with David Lewis, Keith DeRose, Stewart Cohen. Core claim: The semantic content of "knows" varies with the context of the *attributor* (the person saying "S knows that p").
      *   **Invariantism (Traditional/Insensitive):** Knowledge standards are fixed. Practical factors don't change knowledge.
      *   **Subject-Sensitive Invariantism (SSI):** Often synonymous with PE. Standards depend on the subject's context, not the attributor's.
      *   **The Distinction:** The key difference lies in *whose* context matters. For contextualists, it's the speaker's context (standards of the conversation). For encroachers/SSI, it's the subject's context (practical situation of the believer).
      *   **Ben's Critique of PE:** He argues PE is just contextualism. This is a common objection, but technically incorrect if defined strictly. Contextualism is about *semantic context-sensitivity* of the word "knows." PE is about the *nature of knowledge* itself being sensitive to practical factors.
      *   **Ben's Final Move:** This is the "Warranted Assertibility Maneuver" (WAM). Contextualists often use this to explain away intuitions without changing the semantics of knowledge. Or simply an invariantist critique that PE confuses epistemology with pragmatics of action.

