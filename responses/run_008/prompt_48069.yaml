      *   **Maya's Initial Position:** *Universalism.* Any collection of parts composes an object. (Chair + Desk + Me = One Object).
      *   **Dev's Initial Counter:** *Common Sense/Restrictivism.* Some collections don't make objects (Left Shoe + Eiffel Tower + Raccoons = Not an Object).
      *   **Maya's Pushback:** *No Ontological Difference.* The world is just atoms arranged. If "chair" exists due to arrangement, why not "shoe-tower-raccoon"? What physical difference does it make?
