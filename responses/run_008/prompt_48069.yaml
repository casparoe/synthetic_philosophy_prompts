      *   **Step 2 (Ontological Difference):** Maya has a strong point here (van Inwagen's "Special Composition Question"). If physics doesn't change, what does "existence" add? Dev struggles here unless he appeals to language/concepts. *Verdict:* Maya slightly ahead on metaphysics.
      *   **Step 3 (Nihilism vs. Pragmatism):** Dev takes a hard line (Nihilism). Maya points out the absurdity of living that way. *Verdict:* Maya wins on livability, Dev wins on strict ontology.
      *   **Step 4 (Language vs. Reality):** Dev distinguishes between *ontology* (what exists) and *discourse* (how we talk). This is a standard philosophical move. *Verdict:* Dev is technically consistent, but Maya highlights the cost of that view.

  4.  **Identify What They Are Missing:**
