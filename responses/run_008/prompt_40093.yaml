answer: |-
  # STUDENT HANDOUT: Probability Intuitions Diagnostic

  **Instructions:** For each scenario, select the **one** option that best matches your view. Do not overthink; answer based on what you think is *really* true, not what you think sounds scientific.

  **1. The Hidden Coin**
  A fair coin is flipped, caught, and immediately covered by a cup. You did not see the result. Is it correct to say there is a "50% probability" it is heads?
  A) Yes, because the coin is fair.
  B) No, it is either heads or tails; the probability is 0% or 100%.
  C) The word "probability" does not apply here.

  **2. The Digit of Pi**
  No human has computed the ten-billionth digit of $\pi$. It is either a 7 or it is not. Is there a "10% probability" it is a 7?
  A) Yes, because 1 out of 10 digits are 7s.
  B) No, it is a mathematical fact; it is either 0% or 100%.
  C) No, mathematics is not the kind of thing that has probabilities.

  **3. The Uranium Atom**
  Physics tells us radioactive decay is genuinely indeterministic. Consider one specific atom. Does *this specific atom* have a physical chance of decaying in the next hour?
  A) Yes, it has a real physical propensity to decay.
  B) Only a large collection of atoms has a probability; not this single one.
  C) The "chance" is just a measure of our ignorance about its internal state.

  **4. The Unrolled Die**
  You have a perfectly fair die. You intend to roll it, but before you do, it is destroyed by a meteor. Did the die have a "1/6 probability" of landing six?
  A) Yes, it was a fair die.
  B) No, because it was never rolled.
  C) Yes, but only because we can imagine it being rolled.

  **5. The One-Off Election**
  A political forecaster says there is a "70% probability" Candidate X wins a unique, upcoming election. What is this number?
  A) A measure of the forecaster's confidence (betting odds).
  B) A real feature of the election setup (like a weighted coin).
  C) A meaningless number; the candidate will either win or lose.

  **6. The Trick Coin**
  You have a coin from a shop that sells trick coins. You know it is biased, but you don't know towards heads or tails. What is the probability of heads?
  A) 50% (we have no reason to prefer one side).
  B) Unknown (it has a fixed bias, we just don't know it).
  C) There is no single probability until we test it.

  **7. The Weather Forecast**
  A forecaster says "30% chance of rain." It rains. Was the forecast wrong?
  A) Yes, because it rained (the probability should have been higher).
  B) No, provided that on 30% of days like this, it rains.
  C) No, the number represented their uncertainty, which was honest.

  **8. The Formalism**
  Suppose the mathematical rules of probability work perfectly for prediction, but philosophers cannot agree on what probability *is*.
  A) We must solve the philosophical definition before using the math.
  B) Use the math; the definition is someone else's problem.
  C) The math implies the definition (e.g., if the math works, it must be frequency).

  ***

  # INSTRUCTOR KEY & SCORING GUIDE

  **Scoring Logic:** Tally the responses. Look for clusters, not perfect scores. The goal is to reveal inconsistencies between *stated* labels and *applied* intuitions.

  ### 1. Strict Actual Frequentist
  *   **Pattern:** Mostly **B** or **C**. Specifically: Q1(B), Q2(B), Q3(B), Q4(B), Q5(C).
  *   **View:** Probability *only* exists in actual, long-run sequences of repeatable events.
  *   **Embarrassing Answer:** Q1(A). If they claim to be frequentists but assign 50% to the hidden coin, they are conflating frequency with ignorance.
  *   **Note:** Q4 is the strongest filter. Actual frequentists deny probability to unactualized events.

  ### 2. Hypothetical Frequentist
  *   **Pattern:** **A** on physical objects, **B/C** on non-physical. Specifically: Q1(A), Q4(C), Q2(B), Q3(B).
  *   **View:** Probability is the frequency in a *hypothetical* infinite sequence.
  *   **Embarrassing Answer:** Q3(A). If they grant single-case physical chance (propensity) but deny it to the election (Q5), they must explain why physics gets single cases but politics doesn't.
  *   **Limitation:** Hard to distinguish from Propensity on Q1/Q4. Relies on Q3/Q5 split.

  ### 3. Subjectivist (Bayesian/Personalist)
  *   **Pattern:** Mostly **A**. Specifically: Q1(A), Q2(A), Q4(A), Q5(A), Q6(A).
  *   **View:** Probability is coherent degree of belief (credence).
  *   **Embarrassing Answer:** Q3(C). If they say chance is *just* ignorance (C) on the Uranium case, they deny objective chance, which is consistent, but if they say Q3(A) (objective chance) and Q5(A) (belief), they must explain the dualism.
  *   **Calibration Flag:** Q7(C) indicates a Subjectivist who cares about calibration. Q7(B) indicates a Frequentist leaning.

  ### 4. Propensity Theorist
  *   **Pattern:** **A** on physical single-cases, **B/C** on epistemic/logical. Specifically: Q1(B) [outcome fixed], Q3(A), Q4(A), Q5(B) or (C).
  *   **View:** Probability is a physical disposition of a specific setup.
  *   **Embarrassing Answer:** Q1(A). Propensities are future-oriented. Once the coin is under the cup, the propensity has collapsed. Assigning 50% here confuses propensity with belief.
  *   **Indistinguishability Warning:** **Single-case vs. Long-run Propensity.** This quiz cannot reliably separate them. Both answer Q3(A) and Q4(A). Single-case theorists emphasize *this* atom; Long-run emphasize the *setup*. This requires oral follow-up.

  ### 5. Deflationary / Instrumentalist
  *   **Pattern:** **B** on Q8, mixed elsewhere.
  *   **View:** Probability is a tool; ontology is irrelevant.
  *   **Embarrassing Answer:** Q8(A). If they insist on a definition before using the math, they are not deflationists.

  ### 6. The "Naive Mix" (Unoccupied Leaf)
  *   **Pattern:** Q1(A) [Hidden Coin is 50%] + Q3(C) [Uranium is just ignorance] + Q4(B) [Die Never has no probability].
  *   **Diagnosis:** This student claims probability is *only* ignorance (Subjectivism) but denies it to unactualized physical events (Frequentism) while affirming it for past events (Subjectivism).
  *   **Status:** **Untenable.** This combination suggests the student thinks probability applies to *past* hidden facts (Q1) but not *future* physical possibilities (Q4), while denying objective chance (Q3). It is a "label salad" with no coherent philosophical backbone. Most students start here; the course goal is to move them off this leaf.

  ### 7. Indistinguishable Positions
  *   **Hypothetical Frequentism vs. Long-Run Propensity:** Both accept Q4(A/C) and Q1(A). They differ on whether the "limit" is a mathematical fiction or a physical reality. This quiz treats them as a cluster.
  *   **Logical Probability vs. Subjectivism:** Both accept Q2(A). They differ on whether the 10% is objective (logic) or personal (belief). Q6(A) leans Logical; Q7(C) leans Subjectivist.

  ### Usage Tip
  If a student scores as a **Strict Frequentist** on the quiz but writes an essay assigning probabilities to unique historical events, point them to **Q1** and **Q5**. Ask: *"You denied probability to the coin under the cup because the frequency is unavailable. Why is the historical event different?"* This forces them to confront the inconsistency directly.
