          *   *Lexical Views:* Human/Vertebrate welfare might be *lexically* superior. No amount of insect pain outweighs one human torture.
          *   *Moral Uncertainty:* Should we maximize EV across moral theories? (MEC - Maximize Expected Choice-worthiness). Some theories say "don't aggregate."

      *   **(c) Decision-Theoretic/Normative Defeaters:**
