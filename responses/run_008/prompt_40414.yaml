answer: |-
  1. The logical space
  The literature is structured by three questions. (Q1) Are absences relata of causation, or only positive events? (Q2) If absences are relata, are they fixed by normative facts (duties, expectations) or independently? (Q3) Do absences enter the same causal relation as positive events, or a derived one? The Gardener/Queen case tests Q1 and Q2: if the Queen’s non-watering counts equally with the Gardener’s, you accept absences independently of norms. The Smoke Alarm case tests Q3: does silence cause sleep via the same mechanism as noise causes waking? The Lifeguard case tests overdetermination and selection: are both omissions causes, or is 'the cause' fixed by contrast? Your answers locate you in the space below.

  2. The tree
  **Node 1 (Gardener/Queen):** Did the Queen’s failure to water cause the plants’ death *in the same sense* as the Gardener’s failure?
  *   **No, neither absence is a cause** (only positive events cause) → **Leaf (f)**
  *   **No, Gardener yes, Queen no** (norms fix the cause) → **Leaf (b)**
  *   **Yes, both count as causes** (independence from norms) → **Node 2**

  **Node 2 (Smoke Alarm):** Did the alarm’s silence cause the sleep via the *strictly same relation* as a noise waking a sleeper?
  *   **No, it is a derived/quasi-relation** → **Leaf (d)**
  *   **Yes, same relation** → **Node 3**

  **Node 3 (Lifeguards):** When both lifeguards fail, is 'the cause' fixed by a contrastive fact, or are both absences causes selected pragmatically?
  *   **Fixed by contrast (quaternary)** → **Leaf (e)**
  *   **Selected pragmatically** → **Node 4**

  **Node 4 (Abundance):** Is the causal relation itself instantiated by nearly all absences (Queen included), or restricted by counterfactual dependence?
  *   **Relation is abundant/cheap** → **Leaf (c)**
  *   **Counterfactual + Pragmatic selection** → **Leaf (a)**

  3. Leaf glosses
  **(f) Commissive Denialist:** Only positive events are causes; omissive talk is paraphrased away. *Awkward commitment:* Must treat ordinary causal claims as systematically misleading or false.
  **(b) Norm-Dependent:** Omissions are causes only when norms specify them. *Awkward commitment:* Causation becomes partly moral or social, not purely natural.
  **(d) Quasi-Causal (Dowe):** Omissions stand in a derived, contrast-generated relation, not genuine causation. *Awkward commitment:* Causation is disunified; omissions aren’t real causes.
  **(e) Contrastive (Schaffer):** Causation is a quaternary relation among contrasts, not events. *Awkward commitment:* Relata are complex contrasts, not simple events.
  **(c) Abundant:** Nearly every absence is a cause; selection is pragmatic. *Awkward commitment:* The Queen is literally a cause of the plants’ death.
  **(a) Lewis-style:** Absences are relata via counterfactual dependence; 'the cause' is relativized to salience. *Awkward commitment:* Relies on pragmatic selection to avoid proliferating causes.

  4. Unoccupied combinations
  Several logical combinations lack tenants. **Q1 Yes / Q2 Normative / Q3 Derived** is unexplored: why combine normativity with quasi-causation? **Q1 No / Q2 Normative** is incoherent: if absences aren’t relata, norms cannot fix them as causes. **Q1 Yes / Q2 Independent / Q3 Same / Sparse** is unattractive: it accepts absences but denies abundance without pragmatics or contrast, leaving the Queen problem unsolved. Most theorists who accept absences (Q1 Yes) either embrace abundance (c), use contrast to limit them (e), or deny the relation is genuine (d). The empty cells reveal that once you admit absences, you must either accept proliferation or modify the relation.

  5. Separation failures
  The tree struggles to separate **(a) Lewis-style** and **(c) Abundant**. Both accept absences as relata independent of norms and rely on pragmatics to select 'the cause'. The Node 4 distinction (relation abundance vs. counterfactual restriction) is subtle. To separate them, ask: "Is the Queen’s non-watering *true* as a cause statement, merely unasserted?" (c) says yes; (a) says no, it lacks the right counterfactual salience. Without this precision, students may land on either leaf interchangeably.

  6. The dilemma, displayed
  The literature is organized by a dilemma regarding **Q2 (Norms)**.
  **Horn 1 (Independence):** If absences are fixed independently of norms, then either omissions are not causes at all **(f)**, or countless absurd absences (the Queen, every dead gardener) are causes **(a, c, d, e)**.
  **Horn 2 (Normativity):** If absences are fixed by norms, causation inherits normativity **(b)**.
  **Mapping:** (f) takes the "not causes" exit. (b) takes the Normativity horn. (a), (c), (d), and (e) take the "countless absences" horn, mitigating it via pragmatics, contrast, or quasi-relations. You must choose which horn to grasp.
