answer: |-
  This is the correct move. Arguing about which theory "wins" Newcomb's Problem is pointless if you haven't agreed on whether Newcomb's Problem is a test of causal efficacy, evidential correlation, or logical consistency. You are asking for the *requirements document* before the *code review*.

  Below is a specification for an adequate decision theory, categorized by the function the theory is intended to serve. Following that, I address your suspicion regarding joint unsatisfiability.

  ### Part I: The Specification (Desiderata)

  We can divide the requirements into three classes: **Outcome Norms** (what results the agent gets), **Structural Norms** (how the agent reasons over time and information), and **Agency Norms** (whether the agent can actually exist).

  #### A. Outcome Norms (The "Winning" Conditions)
  *These specify what counts as a successful outcome in paradigmatic cases.*

  1.  **The Newcomb Condition:**
      *   *Requirement:* In a standard Newcomb setup (Omega is a near-perfect predictor, Box A transparent with $1k, Box B opaque with $1M or $0), the theory must prescribe a choice that yields the higher payoff ($1M).
      *   *Motivation:* If a decision theory systematically leaves money on the table in a scenario where the setup is stipulated as possible, it fails as a guide to getting what you want.
      *   *Status:* **Contested.** (CDT proponents argue the money is already there/missing, so taking both is dominant; FDT/EDT proponents argue the choice determines the content).

  2.  **The Smoking Lesion Condition:**
      *   *Requirement:* In a case where an action (smoking) is correlated with a bad outcome (cancer) only via a common cause (a lesion) and has no causal effect on the outcome, the theory must prescribe the action if it provides utility (pleasure).
      *   *Motivation:* A rational agent should not avoid actions merely because they are bad news, if the actions cannot change the news. Avoiding "evidential bad news" leads to magical thinking.
      *   *Status:* **Non-negotiable.** (Almost all camps agree EDT fails here; a theory that fails this is generally considered broken).

  3.  **The Counterfactual Mugging Condition:**
      *   *Requirement:* If a predictor would have given you $10,000 had they predicted you would pay $100 now (but only asks you to pay if the coin came up tails), the theory should prescribe paying the $100 upon learning the coin was tails.
      *   *Motivation:* Reflective consistency. You would have precommitted to paying. If your future self reneges, you prevent the existence of agents like you who get the windfall in the other branch.
      *   *Status:* **Contested.** (Depends on whether you view rationality as maximizing actual world utility or expected utility across the prior).

  4.  **The Death in Damascus Condition:**
      *   *Requirement:* In a case where a perfect predictor (Death) will be wherever you go, the theory should not prescribe a specific city deterministically (which ensures death) nor succumb to fatalistic paralysis. Ideally, it should randomize or accept the inevitability without incurring travel costs.
      *   *Motivation:* Avoiding self-fulfilling prophecies driven by the reasoning process itself.
      *   *Status:* **Non-negotiable.** (A theory that forces you to travel to Aleppo to die, when you could have stayed in Damascus to die, is wasting resources).

  #### B. Structural Norms (The "Reasoning" Conditions)
  *These specify constraints on the decision procedure itself.*

  5.  **Dynamic Consistency (Precommitment Endorsement):**
      *   *Requirement:* An agent should not prefer to precommit to a plan at Time 1 that its future self at Time 2 will want to violate. The future self should endorse the past self's policy.
      *   *Motivation:* Agency over time. If a theory prescribes a plan that your future self will abandon, the theory is self-defeating. You would pay to bind yourself, which is a cost.
      *   *Status:* **Non-negotiable.** (Violating this makes the agent a "money pump" for its own future selves).

  6.  **Value of Information (VoI):**
      *   *Requirement:* An agent should never pay to avoid free, relevant information. Acquiring information should never reduce expected utility.
      *   *Motivation:* Information allows for better conditionalization. Ignorance is generally a handicap.
      *   *Status:* **Contested.** (Updateless theories violate this in specific Newcomb-like cases; see Impossibility section).

  7.  **Non-Exploitability (No Money Pumps):**
      *   *Requirement:* The agent's preferences should not be cyclical. An external actor should not be able to construct a sequence of trades that returns the agent to their original state with less money.
      *   *Motivation:* Survival. Exploitable agents lose all resources in competitive environments.
      *   *Status:* **Non-negotiable.**

  8.  **Counterfactual Coherence:**
      *   *Requirement:* The theory must provide a well-defined method for evaluating "what would have happened if I had done otherwise," even in deterministic or logically correlated worlds.
      *   *Motivation:* Without well-defined counterfactuals, expected utility calculations are meaningless.
      *   *Status:* **Non-negotiable.** (Though *how* to define them is the main battleground).

  #### C. Agency Norms (The "Implementation" Conditions)

  9.  **Bounded Implementability:**
      *   *Requirement:* The theory must be computable by a finite agent with limited memory and processing power.
      *   *Motivation:* A theory that requires simulating the entire universe or infinite recursion cannot be used by humans or AI.
      *   *Status:* **Non-negotiable.**

  10. **Transparency of Reasoning:**
      *   *Requirement:* The agent should be able to model its own decision procedure without generating paradoxes (e.g., Löbian obstacles).
      *   *Motivation:* An agent that crashes when trying to predict its own output cannot function in social or strategic environments.
      *   *Status:* **Matter of Taste/Technical.** (Important for AI safety, less for human philosophy).

  ---

  ### Part II: The Impossibility Result

  You suspected that the demands of getting Newcomb and Death in Damascus right, respecting the Value of Information, and maintaining Dynamic Consistency cannot all be met. **You are correct.**

  There is a fundamental tension between **Outcome Optimality** (winning in Newcomb/Mugging) and **Information Sensitivity** (standard Value of Information). This is not just a quirk of specific theories; it is a structural feature of decision problems involving predictors.

  #### The Trilemma
  No decision theory can simultaneously satisfy the following three desiderata in all possible worlds:
  1.  **Newcomb/Mugging Optimality:** One-box in Newcomb; Pay in Counterfactual Mugging.
  2.  **Standard Value of Information:** Never pay to avoid free information.
  3.  **Separability (Updatefulness):** Decisions are made based on the agent's current knowledge state at the time of action.

  #### The Argument
  To "win" in Newcomb's Problem and Counterfactual Mugging, an agent must act *as if* its current choice influences the past prediction or the counterfactual world where the coin landed heads. This requires the agent to ignore the fact that, causally, the prediction is already made or the coin has already landed.

  *   **If you respect Standard VoI:** You look at the information available. In Newcomb's, if you look inside Box B (or are told what's in it), you know the money is there or not. If it's there, you take both (gaining +$1k). If it's empty, you take both (gaining +$1k). Knowing the content strictly dominates not knowing. But if Omega predicts you will look and two-box, Box B is empty. To get the $1M, you must *not* look (or act as if looking doesn't change the outcome).
  *   **If you are Updateless (FDT/UDT):** You choose a policy *before* receiving the information. This allows you to one-box and pay the mugging. However, this violates Standard VoI. In specific variants (like the "Parfit's Hitchhiker" with a lie-detector or specific Mugging variants), an Updateless agent will sometimes **pay to avoid information**. Why? Because receiving the information forces an update that breaks the logical correlation with the predictor. If you know the coin came up Tails, the counterfactual "If I had paid, the coin would have been Heads" becomes harder to sustain logically. The updateless agent prefers to remain ignorant to maintain the policy that secures the windfall in the other branch.
  *   **If you are Updateful (CDT/EDT):** You respect VoI, but you fail Newcomb/Mugging. You two-box and refuse the mugging. You are dynamically inconsistent: your past self would have paid to bind your future self to one-box, but your future self rips up the contract.

  #### Death in Damascus and Equilibrium
  Death in Damascus adds a second layer of impossibility regarding **Determinism vs. Randomness**.
  *   If the theory is deterministic and the predictor is perfect, you die wherever you go.
  *   To survive (or minimize cost), you must randomize.
  *   However, if you randomize, a perfect predictor predicts the probability distribution and positions themselves accordingly.
  *   **The Impossibility:** In a strict Death in Damascus case with a *perfect* predictor, **no strategy yields survival.** The desideratum "The agent should survive" is unsatisfiable by definition. The real desideratum is "The agent should not incur unnecessary costs (travel) to die."
  *   CDT fails this because it cannot settle on a mixed strategy equilibrium without external randomization devices. EDT fails because it treats the choice as evidence of Death's location, leading to fatalism. FDT solves the cost issue but only by accepting that against a perfect predictor, *winning* is sometimes impossible; the goal shifts to *policy optimality*.

  ### Part III: Classification of the Conflict

  Here is how the desiderata break down when forced to choose:

  | Desideratum | Classification | Reason for Status |
  | :--- | :--- | :--- |
  | **Non-Exploitability** | **Non-negotiable** | An exploitable agent is effectively dead in competitive environments. |
  | **Smoking Lesion** | **Non-negotiable** | Distinguishes rationality from superstition. |
  | **Dynamic Consistency** | **Non-negotiable** | Without this, the agent is not a unified entity over time. |
  | **Newcomb Optimality** | **Contested** | Depends on whether you value "causal leverage" or "outcome maximization." |
  | **Counterfactual Mugging** | **Contested** | Depends on whether you value "actual world" or "prior expected" utility. |
  | **Standard VoI** | **Contested** | **Crucially:** Must be sacrificed if you want Newcomb Optimality + Dynamic Consistency. |

  ### The Verdict on Your Suspicion

  Your suspicion is mathematically sound. **You cannot have a decision theory that is Updateful, Newcomb-Optimal, and respects the Standard Value of Information.**

  *   **CDT** keeps VoI and Updatefulness, sacrifices Newcomb.
  *   **EDT** keeps VoI and Updatefulness, sacrifices Smoking Lesion and Death in Damascus.
  *   **FDT/UDT** keeps Newcomb and Smoking Lesion and Dynamic Consistency, **sacrifices Standard Value of Information.**

  The "specification" you are looking for forces you to admit that **Value of Information is not a universal law of rationality.** It is a theorem that holds only under the assumption of *causal independence* between your decision and the state of the world. In Newcomb problems, that independence assumption is false (due to prediction). Therefore, a theory that "wins" in Newcomb problems *must* violate the standard VoI theorem in specific edge cases.

  **Recommendation for your argument:**
  Stop asking "Which theory gets the right answer?" Start asking "Which violation is more acceptable?"
  1.  Is it worse to leave $1M on the table (CDT)?
  2.  Is it worse to pay to avoid looking at a free text message (FDT)?

  If your friend says paying to avoid info is insane, ask them if leaving $1M on the table is sane. If they say leaving $1M is sane because "it's already there," ask them why they wouldn't pay $100 to bind their future self to leave it (since they agree the binding would cause Omega to put the money there). If they agree to the precommitment but refuse the act, they have admitted **Dynamic Inconsistency**, which violates a non-negotiable structural norm.

  The specification reveals that "Rationality" is not a single coherent point. It is a Pareto frontier. You must choose which axis you are willing to compromise.
