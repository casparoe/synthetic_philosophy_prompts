prompt: |-
  I've got no philosophy training, just something I keep turning over on my own, so bear with me. The question is basically: when does a bunch of things count as ONE thing with parts, rather than just... a bunch of things? My desk is obviously one thing. The pile of papers on it seems more like a pile than a thing. A crowd of people, is that one thing? A wave in the sea? And when the thing gets rebuilt plank by plank (the old ship thing) at no point do I stop and say right, NOW it's two things, so whatever answer we give has to cope with that somehow.

  Before I go and read what actual philosophers reckon, I want the spec first: what would any decent answer to this have to deliver? Please write out the requirements. I'm imagining things like:

  - which cases it has to get right or at least have an opinion on (a person, a heap of sand, a car that's had every part swapped, a crowd, a molecule), and why that case is a requirement rather than just an example
  - the distinctions it can't blur -- like the difference between "these things make up one thing" and "these things are all in one place", or between "it's one thing" and "I call it one thing out of habit"
  - the bits of ordinary life and science it can't contradict. I'm thinking: if physics says everything is just particles in fields, and there's no fact of the matter about where a table "ends" at the atomic level, that's fine, but an answer that said there are no things with parts at all (no desks, just "desk-shaped particles") seems like it's paying too much for the theory. Is that a fair requirement though? Maybe that's just my prejudice, I honestly can't tell, which is sort of the point of asking.

  Then mark which requirements you reckon are non-negotiable and which are really just tastes of one camp dressed up as requirements. And the bit I most want to see: can some of the requirements not be satisfied together? Like if one says the answer must always be sharp (never vague whether some stuff makes up one thing) and another says it must match how we actually talk, which is vague all over the place, that's trouble -- is there a subset that's jointly impossible, and if so which would you drop?

  Also, at the end, briefly: which single requirement does the most work knocking out candidate answers? Like is there one requirement that most answers people naturally give (everything that's stuck together counts as one; or only living things count as one; or every collection counts as one, so there's a thing that's my left shoe plus the moon) fail on? I don't need a full survey of everyone's views, just which requirement is the biggest filter.

  A table is fine if it helps. Plain english please, I've read a bit of the jargon online but don't assume I know what any of the technical words for this stuff mean.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has no formal philosophy training but is thinking deeply about the "Special Composition Question" (when do parts make a whole?). They want to know what a *good* answer to this question needs to achieve *before* they read the literature.
      *   **Task:** Write out the "specifications" or requirements for a decent theory of composition.
      *   **Specific Sub-tasks:**
          *   List cases the theory must handle (and *why* they are requirements, not just examples).
          *   List distinctions the theory must maintain (e.g., unity vs. proximity, objective vs. subjective).
          *   List constraints from ordinary life and science (e.g., don't eliminate tables, but acknowledge atomic vagueness).
          *   Categorize requirements into "Non-negotiable" vs. "Philosophical Taste/Camp."
          *   Identify conflicts/incompatibilities between requirements (e.g., Sharpness vs. Vagueness).
          *   Identify the "Single Biggest Filter" requirement (which one kills the most intuitive but wrong answers).
      *   **Tone/Style:** Plain English, no jargon without explanation, conversational but rigorous. A table is allowed/helpful.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core issue is *Mereology* (the study of parts and wholes), specifically the *Special Composition Question* (SCQ).
      *   Key intuitions:
          *   Some things are definitely objects (tables, people).
          *   Some things are definitely not objects (random scattered bits, heaps).
          *   Identity over time (Ship of Theseus).
          *   Vagueness (when does a heap become a heap?).
          *   Ontological commitment (do we believe these things *exist* or are they just useful fictions?).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Common Sense Check.* It needs to agree that tables exist and random scattered atoms don't form an object. *Why?* Because a theory that says "nothing exists" or "everything exists" is useless for explaining our experience.
      *   *Requirement 2: The Science Check.* It can't contradict physics, but it shouldn't be eliminated by it either. (The user's point about "desk-shaped particles").
      *   *Requirement 3: The Change Check.* It needs to handle the Ship of Theseus (replacement of parts) without saying the object pops out of existence arbitrarily.
      *   *Requirement 4: The Vagueness Check.* It needs to deal with borderline cases (clouds, crowds) without breaking logic.
      *   *Requirement 5: The Distinction Check.* Unity vs. Proximity. (Glued bricks vs. bricks in a pile).

  4.  **Categorizing: Non-Negotiable vs. Taste:**
      *   *Non-Negotiable:* Logical consistency, handling the Ship of Theseus (somehow), not contradicting established science (usually).
      *   *Taste:* Whether "existence" is mind-dependent, whether boundaries must be sharp or can be vague, whether "heaps" count as objects.

  5.  **Identifying Conflicts (The "Trouble" Spot):**
      *   *Sharpness vs. Ordinary Language:* Logic likes binary (Yes/No). Language likes fuzzy (Sort of/Maybe). If you demand sharp boundaries, you clash with how we describe clouds/baldness. If you allow vague boundaries, you clash with classical logic (Law of Excluded Middle).
      *   *Permissiveness vs. Restrictiveness:* If you say "any parts make a whole," you get "trout-turkeys" (object made of a trout and a turkey). If you say "only tight bonds make a whole," you struggle with clouds or loose crowds.

  6.  **Identifying the "Single Biggest Filter":**
      *   What kills the most naive theories?
      *   *Candidate A:* "Physical Contact." (Kills: Solar systems, atoms, separated twins).
      *   *Candidate B:* "Function." (Kills: Broken clocks, natural objects like rocks).
      *   *Candidate C:* The "Arbitrariness" constraint. (Why *this* boundary and not *that* one?).
      *   *Decision:* The requirement to avoid *arbitrariness* while respecting *common sense* is the killer. Specifically, the requirement to explain *why* composition happens here but not there without just pointing and saying "because." Let's refine this: It's the requirement to **avoid arbitrariness without eliminating ordinary objects.** This kills "Universalism" (everything is an object) and "Nihilism" (nothing is an object) for most people.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's insight (they've stumbled on the Special Composition Question).
      *   **Section 1: The Spec Sheet (Requirements).** Group them logically (Cases, Distinctions, Constraints).
      *   **Section 2: Non-Negotiable vs. Taste.** Use a table for clarity.
      *   **Section 3: The Conflicts (Incompatibilities).** Focus on Sharpness vs. Vagueness.
      *   **Section 4: The Biggest Filter.** Identify the "Non-Arbitrariness" constraint.
      *   **Conclusion:** Encouraging closing.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't use words like "mereological nihilism" without defining them.
      *   *Correction:* Ensure I address the "Ship of Theseus" point explicitly as requested.
      *   *Correction:* The user asked about "requirements that can't be satisfied together." I need to be clear that this is the *hard* part of philosophy.
      *   *Tone Check:* Keep it respectful. The user's intuition about "desk-shaped particles" is actually a very standard philosophical objection to eliminativism. Validate that.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Plain English? Yes.
      *   Table included? Yes.
      *   Requirements listed with *why*? Yes.
      *   Non-negotiable vs. Taste marked? Yes.
      *   Conflicts identified? Yes.
      *   Single biggest filter identified? Yes.

  10. (Final thought on the "Biggest Filter"): I think the "Non-Arbitrariness" requirement is the strongest. It forces you to find a *principle*. "Contact" fails it (why 1mm gap stops it?). "Life" fails it (why is a virus different?). "Universalism" passes it but fails Common Sense. "Nihilism" passes it but fails Common Sense. So the filter is "Principled Non-Arbitrariness + Common Sense." I will frame it as the "No Magic Lines" requirement.

  11. (Final thought on Conflicts): The "Sharpness vs. Vagueness" conflict is the classic one. I will focus on that.

  12. (Drafting the response based on these thoughts.)
answer: |-
  This is a fantastic set of intuitions. You have independently rediscovered a central problem in metaphysics called the **Special Composition Question**. Philosophers have been wrestling with exactly this for decades, and your "spec sheet" approach is actually a very professional way to evaluate theories.

  Here is the specification for a decent theory of "when parts make a whole," written in plain English, followed by the analysis of conflicts and filters you asked for.

  ### Part 1: The Spec Sheet (Requirements for a Good Theory)

  A theory of composition needs to tell us what the "glue" of reality is. It can't just be physical glue, because atoms stick together to make molecules, and people stick together to make crowds, but those feel different. Here is what a working theory must deliver.

  #### 1. The Case Load (Which examples it must handle)
  A theory isn't allowed to just pick the easy ones. It has to have a verdict on these specific cases, because they test different *kinds* of unity.

  | Case | Why it's a requirement (The Test) |
  | :--- | :--- |
  | **A Living Person** | **The Baseline.** Almost everyone agrees a person is one thing. If your theory says a person is *not* one thing (just a bunch of cells), it has a huge burden of proof. |
  | **A Heap of Sand** | **The Vagueness Test.** If you remove one grain, it's still a heap. If you keep going, when does it stop? A theory must explain why "heap" feels fuzzy without breaking logic. |
  | **The Ship of Theseus** | **The Time Test.** (Your plank-replacement example). A theory must explain how a thing stays the *same* thing even when its parts change. It can't say the object vanishes the moment one plank is swapped. |
  | **A Random Scatter** (e.g., your left shoe and the Moon) | **The Restraint Test.** A theory must explain why these *don't* make one object. If your theory says "any bits make a whole," you end up with infinite invisible objects everywhere. |
  | **A Cloud / A Wave** | **The Boundary Test.** These have no sharp edges. A theory must decide if they are real objects or just useful ways of talking about water vapor. |

  #### 2. The Distinctions (Lines it cannot blur)
  A good theory must be able to tell the difference between these concepts. If it conflates them, it's not explaining anything.

  *   **Unity vs. Proximity:** It must distinguish between "parts working together as one" (a watch) and "parts just happening to be near each other" (pebbles in a bucket). If the theory says proximity is enough, a traffic jam is an object. If it says unity is required, it must define "unity" without being circular.
  *   **Objective vs. Subjective:** It must clarify if the "oneness" is in the world (the desk is one thing even if no one looks at it) or in our heads (we *treat* the desk as one thing for convenience). You can pick either, but you can't waffle between them.
  *   **Existence vs. Description:** It must distinguish between "there is an object here" and "it is useful to speak as if there is an object here."

  #### 3. The Constraints (What it cannot contradict)
  *   **The "No Magic" Constraint:** The theory cannot say composition happens at a specific number without a reason. (e.g., "100 atoms make an object, 99 do not"). There must be a *principle*, not a magic number.
  *   **The "Common Sense" Constraint:** It cannot eliminate ordinary objects. If your theory concludes that tables, chairs, and people do not exist (only atoms exist), it is logically possible, but it fails this constraint. It makes the theory too expensive for daily life.
  *   **The "Science" Constraint:** It cannot contradict physics (e.g., it can't say solid objects are truly solid with no space). However, it is allowed to say that physics describes the *parts*, while metaphysics describes the *wholes*.

  ---

  ### Part 2: Non-Negotiable vs. Philosophical Taste

  You asked which of these are hard requirements and which are just preferences of certain philosophical "camps."

  | Requirement | Verdict | Why? |
  | :--- | :--- | :--- |
  | **Logical Consistency** | **Non-Negotiable** | The theory cannot contradict itself. (e.g., It can't say "objects exist" and "no objects exist" in the same sense). |
  | **Handling Change (Ship of Theseus)** | **Non-Negotiable** | Objects clearly persist through minor changes. A theory that says a car ceases to exist when you change a tire is broken. |
  | **No Magic Lines** | **Non-Negotiable** | Reality doesn't usually work on arbitrary numbers. There must be a *reason* why contact matters, or life matters, etc. |
  | **Common Sense Existence** | **Philosophical Taste** | Some philosophers (Nihilists) happily say tables don't exist. It's a valid view, just a costly one. You might reject it, but it's not logically impossible. |
  | **Sharp Boundaries** | **Philosophical Taste** | Some theories say every object has a precise edge (even a cloud). Others say objects can be vague. Both are defensible positions. |
  | **Mind-Independence** | **Philosophical Taste** | Does a tree falling in the forest make a "whole" sound if no one is there? Some say yes (Realists), some say "whole" is a human category (Conceptualists). |

  ---

  ### Part 3: The Conflicts (Impossible Combinations)

  This is the most important part. You suspected that some requirements might fight each other. You are right. There is a major tension that breaks many theories.

  **The Conflict: Sharpness vs. Vagueness**

  *   **Requirement A (Logic):** Logic demands sharp answers. For any collection of particles, it is either **True** or **False** that they make an object. There is no "kind of."
  *   **Requirement B (Language/Reality):** Our world and language are vague. There is no exact moment a tadpole becomes a frog, or a heap becomes a non-heap.

  **The Trouble:**
  If you satisfy **Requirement A** (Sharpness), you have to say there is a *specific* grain of sand whose removal turns a "heap" into a "non-heap." This sounds absurd.
  If you satisfy **Requirement B** (Vagueness), you have to admit that sometimes it is neither true nor false that an object exists. This breaks standard logic (The Law of Excluded Middle).

  **Which would I drop?**
  Most modern philosophers try to keep Logic (A) and explain away the Vagueness (B) as a limitation of *language*, not reality. They argue the world is sharp, but our words are fuzzy.
  *However*, a strong case can be made to drop Sharpness. If you demand the world fit binary logic, you might be forcing human math onto nature.
  **Recommendation:** If you are building your own view, allow for **Vagueness**. It fits the "clouds and crowds" examples better. Don't force sharp lines where nature doesn't have them.

  ---

  ### Part 4: The Single Biggest Filter

  You asked for the one requirement that knocks out the most candidate answers.

  **The Filter: The "Non-Arbitrariness" Constraint.**

  This is the requirement that says: *"You must explain WHY composition happens here and not there, without picking a magic number or pointing and saying 'just because'."*

  Here is how it kills the most common intuitive answers:

  1.  **Kills "Contact":** (Things touching make an object).
      *   *Why it fails:* What if they are 1 millimeter apart? Is it an object then? What if they are glued? Why does glue count but gravity doesn't? It's arbitrary.
  2.  **Kills "Function":** (Things working together make an object).
      *   *Why it fails:* What about a broken clock? It's still one clock. What about a rock? It has no function, but it's one rock.
  3.  **Kills "Life":** (Only living things are objects).
      *   *Why it fails:* Why is a virus different from a complex molecule? Why is a dead tree suddenly not one thing?
  4.  **Kills "Universalism":** (Any collection of things makes an object).
      *   *Why it fails:* This satisfies Non-Arbitrariness (it's never arbitrary, everything is an object!), but it fails the **Common Sense Constraint**. It says your left shoe and the Moon form one object. Most people can't swallow that.
  5.  **Kills "Nihilism":** (No collections ever make an object).
      *   *Why it fails:* This satisfies Non-Arbitrariness (nothing ever qualifies!), but it fails the **Common Sense Constraint**. It says *you* don't exist, only your atoms do.

  **Summary:**
  The hardest thing to do is find a "glue" that is **strong enough** to rule out random scattered bits (like the shoe + moon), but **flexible enough** to include clouds, crowds, and broken clocks, without drawing a **magic line** in the sand.

  ### Final Advice for Your Thinking

  You mentioned: *"Is that a fair requirement though? Maybe that's just my prejudice... that an answer that said there are no things with parts at all... seems like it's paying too much for the theory."*

  That is **not** just a prejudice. That is a methodological principle called **Ontological Parsimony** (or Occam's Razor applied to existence).
  *   If a theory says "Tables exist," it posits one entity.
  *   If a theory says "Tables don't exist, only table-wise atoms exist," it posits the same atoms but denies the table.

  The "Nihilist" (who says only atoms exist) argues they are being simpler. You argue they are being unhelpful. Both are valid stances. But if you want a theory that helps you navigate the world (rather than just win logic puzzles), keep your **Common Sense Constraint**. It is the anchor that keeps philosophy from floating away into nonsense.

  **Your next step:** When you read the philosophers, look for how they solve the **Ship of Theseus**. That is usually where the cracks in the theory show up first. If they say the ship vanishes when one plank changes, they fail your spec. If they say the ship is a "four-dimensional worm" stretching through time, see if that makes sense to you.

  You're ready to read the literature. You've already done the hard work of defining the problem.
