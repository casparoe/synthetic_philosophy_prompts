prompt: |-
  I'm a staff attorney for the sentencing commission of a mid-sized state. Our legislature has just enacted a statute requiring judges to impose sentences that are "no more severe than the offender's desert" while also "taking account of public safety, deterrence, and rehabilitation" — that is, they have legislated a hybrid of retributivism and consequentialism without saying anything about how the two halves interact, and the commission is directed to issue practical guidance within six months. Our judges sentence roughly thirty felony cases a week, have no philosophical training, and have at most fifteen minutes of deliberation beyond the presentence report in the ordinary case. The commission has provisionally settled on limiting retributivism as the skeleton: desert sets a range rather than a point, and consequentialist considerations may move a sentence only within that range, never past its edges. My job is to turn that skeleton into something a judge can actually run.

  Please draft the decision procedure. It should do the following:

  1. Give the judge a small, ordered set of questions that converts the theory into steps, with guidance on what counts as a sufficient answer at each step — including how a judge is supposed to reason about the width of the desert range, not just its existence, since a wide range is nearly no constraint at all and a narrow one is nearly a mandatory sentence.
  2. Say explicitly what the judge should do when the answers are unavailable or fuzzy, since desert does not come with a number attached and the empirical evidence on deterrence at the level of the individual case is almost always worse than it looks.
  3. Mark the points at which the procedure necessarily hands the decision over to judgment, and explain why those particular points cannot be proceduralized — as opposed to points that merely haven't been proceduralized yet.
  4. Be honest about the failure modes we should expect: judges smuggling consequentialist aggravation in as "desert"; deterrence arguments doing work their evidence cannot support; and the risk that publishing a clean-looking flowchart creates the appearance that the hard value questions have been answered when they have merely been relocated.

  Then run the procedure on three cases, showing its output at each step:

  (a) A 22-year-old first offender with no prior record, convicted of armed robbery in which no one was physically hurt, with strong family and employment ties and an assessed low risk of reoffending — the case where leniency pressure comes from both halves of the statute and the procedure must still say something.

  (b) A 61-year-old woman with no prior convictions, convicted of embezzling from her employer over a decade in order to cover a grandchild's medical debt, where the prosecution argues that general deterrence demands prison because embezzlement by trusted employees is chronically under-prosecuted and lenient sentences invite more of it — a case where the desert range and the deterrence argument pull in opposite directions.

  (c) A twice-convicted burglar whose habitual-offender exposure puts him near the statutory ceiling at exactly the moment the legislature is under public pressure about a burglary wave — the case where the desert ceiling and the deterrence push are in direct conflict. This is the one where the procedure will likely give an answer the commissioners will not like, or expose that the statute's two commands cannot both be honored, and I need that surfaced rather than smoothed over.

  Finally, include a short section addressed to the commission itself rather than to the judges: what the procedure cannot do, which kinds of cases it will systematically mishandle (offender ignorance of the law, strict liability offenses, desert for attempts versus completed harms), and whether there are circumstances under which a published procedure of this kind makes sentencing worse than honest, explicit disagreement about the values would be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Staff Attorney for a State Sentencing Commission.
      *   **Task:** Draft a practical decision procedure (guidance) for judges based on a new hybrid statute (Retributivism + Consequentialism).
      *   **Constraints/Context:**
          *   Statute: "No more severe than desert" (Retributive cap) + "Take account of public safety, deterrence, rehabilitation" (Consequentialist goals).
          *   Commission's Theory: Limiting Retributivism (Desert = Range, Consequentialism = Movement within Range).
          *   Audience: Judges (30 cases/week, 15 mins deliberation, no philosophy training).
          *   Timeline: 6 months.
          *   Requirements:
              1.  Ordered set of questions/steps (including range width).
              2.  Handling uncertainty/fuzziness.
              3.  Identifying non-proceduralizable judgment calls.
              4.  Honest assessment of failure modes.
              5.  Run the procedure on three specific cases (a, b, c).
              6.  Internal memo to the Commission (limitations, risks).

  2.  **Deconstruct the Legal/Philosophical Problem:**

      *   *Limiting Retributivism:* This is the core framework (Norval Morris, Michael Tonry). Desert sets the bounds; utility fills the space.
      *   *The Tension:* If the desert range is too wide, the retributive constraint is meaningless. If it's too narrow, it's just determinate sentencing.
      *   *The Judicial Reality:* Judges need heuristics, not treatises. They need to know *how* to estimate the range without getting bogged down in metaphysics.
      *   *The "Hard Case" (Case C):* When public safety demands more than desert allows. The statute says "no more severe than desert." So, public safety *must* lose in that specific conflict. The procedure needs to make this explicit, even if politically uncomfortable.

  3.  **Drafting the Decision Procedure (The "Guidance"):**

      *   *Structure:* Needs to be a flowchart logic but in text. Step-by-step.
      *   *Step 1: Anchor (Desert).* How to set the range? Need to rely on statutory guidelines, precedent, and "common sense proportionality."
      *   *Step 2: Width.* This is crucial. How wide is "not too wide"? Suggest a percentage or a standard deviation from the guideline midpoint. Let's aim for a "presumptive range" based on guidelines, adjustable for specific culpability nuances.
      *   *Step 3: Consequentialist Adjustment.* Within the range, where do we land? Risk assessment, deterrence needs, rehab potential.
      *   *Step 4: Uncertainty.* What if we don't know the risk? Default to the lesser severity (principle of parsimony).
      *   *Step 5: Judgment Calls.* Acknowledge where the math stops and the human begins (moral weight of harm, credibility of rehabilitation plans).
      *   *Failure Modes:* Explicitly warn against "desert creep" (calling safety concerns "desert").

  4.  **Running the Cases:**

      *   *Case A (Young Robber):* Low desert (first time, no harm), Low risk. Range should be low. Consequentialism pulls down. Result: Probation/Minimal confinement. Easy case for the model.
      *   *Case B (Embezzler):* Moderate desert (financial harm, breach of trust), Low risk (age, motive). Prosecution wants deterrence. *Conflict:* Deterrence pulls up, Desert/Rehab pull down. *Constraint:* Cannot exceed desert. If desert ceiling is low, deterrence loses.
      *   *Case C (Habitual Burglar):* High desert (repeat offender), High public pressure (deterrence). Statutory ceiling might be *below* what public safety wants. *Crucial Test:* The procedure must say "Stop at Desert Ceiling." This exposes the legislative conflict.

  5.  **Drafting the Internal Memo (To the Commission):**

      *   *Tone:* Candid, professional, slightly wary.
      *   *Content:* What this procedure *doesn't* solve. The illusion of precision. The risk of "masking" discretion. The specific legal categories that break the model (strict liability, attempts).
      *   *The "Worse than Disagreement" Point:* If the flowchart makes judges think the hard choices are easy, it creates bad law and inconsistent outcomes disguised as consistency.

  6.  **Refining and Polishing:**

      *   *Voice:* Needs to sound like a Staff Attorney writing for the Commission/Judiciary. Professional, precise, but practical.
      *   *Formatting:* Use headers, bold text, and numbered lists for readability.
      *   *Check against constraints:* Did I address range width? Yes. Uncertainty? Yes. Judgment calls? Yes. Failure modes? Yes. All three cases? Yes. Internal memo? Yes.

  7.  **Self-Correction/Critique during drafting:**

      *   *Initial thought:* Maybe suggest specific month ranges for the cases.
      *   *Correction:* No, I don't know the state's sentencing grid. Keep it relative (e.g., "bottom quartile," "statutory ceiling").
      *   *Initial thought:* Try to solve the Case C conflict.
      *   *Correction:* The prompt asks to *surface* the conflict, not smooth it over. The statute prioritizes desert ("no more severe than"). The procedure must enforce that priority, even if it angers the public/legislature.
      *   *Range Width:* How to guide this without numbers? Use "ordinal ranking" of severity. Compare to similar past cases.
      *   *Uncertainty:* Apply the "Rule of Lenity" equivalent for sentencing. If risk is unknown, assume lower risk.

  8.  **Final Review:** Does this meet the "Staff Attorney" persona? Yes. Is it philosophically sound regarding Limiting Retributivism? Yes. Is it practical for a 15-minute decision? It's as practical as it can be, though the prompt acknowledges the inherent difficulty.

  *(Self-Correction on Case C)*: I need to make sure I don't just say "Judge decides." I need to show how the *procedure* forces the judge to acknowledge the conflict. The procedure should require a finding: "Public safety requires X, Desert allows Y. X > Y. Sentence is Y."

  *(Self-Correction on Failure Modes)*: Make sure to mention "Desert Inflation." Judges often call their safety concerns "desert" to bypass the cap. The procedure needs a check against this.

  9.  **Final Polish:** Check tone. Ensure it's not too academic but not too simplistic. (Proceed to generate output).

  *(Note: The prompt asks for a draft decision procedure, the case runs, and the internal memo. I will structure the response accordingly.)*

  *Structure Plan:*
  1.  **Header:** To/From/Subject.
  2.  **Part I: The Decision Procedure (For Judges).** Steps 1-5.
  3.  **Part II: Case Applications.** (a), (b), (c).
  4.  **Part III: Internal Memorandum (To Commission).** Limitations and Risks.

  *Let's write.*
answer: |-
  **TO:** The State Sentencing Commission
  **FROM:** Staff Attorney's Office
  **SUBJECT:** Draft Decision Procedure for Hybrid Sentencing Statute (Limiting Retributivism Model)
  **DATE:** October 26, 2023

  ---

  ### PART I: DECISION PROCEDURE FOR JUDICIAL USE
  **Title:** *The Anchored Discretion Protocol*
  **Intended User:** Trial Court Judges
  **Estimated Time:** 10–15 Minutes per Case

  **Preamble:** This procedure implements the legislative mandate that sentences must not exceed what an offender deserves (Retributive Cap) while allowing adjustment for safety and rehabilitation (Consequentialist Adjustment). Desert is the anchor; utility is the sail. You cannot sail past the anchor.

  #### Step 1: Establish the Desert Range (The Anchor)
  *Question:* What is the range of punishment proportionate to the offender's culpability and the harm caused, independent of their future risk?

  *   **Action:** Identify the "Ordinal Ranking" of this offense compared to similar past cases in this jurisdiction.
  *   **Guidance on Width:**
      *   **Narrow Range (±10% of Guideline Midpoint):** Use when the offense facts are typical, culpability is clear (intentional), and harm is concrete.
      *   **Moderate Range (±25% of Guideline Midpoint):** Use when culpability is mixed (e.g., recklessness vs. intent) or harm is diffuse (e.g., financial fraud).
      *   **Wide Range (±40% of Guideline Midpoint):** Use *only* when statutory elements are broad or the harm is highly subjective.
      *   **Constraint:** A range wider than 40% is presumptively invalid as a "desert" constraint. If you cannot narrow it further, default to the *midpoint* as the effective cap for Step 2.
  *   **Sufficient Answer:** "Based on [Precedent/Guideline X], the proportionate range is [A] to [B] months."

  #### Step 2: Assess Consequentialist Factors (The Sail)
  *Question:* Within the range established in Step 1, does public safety, deterrence, or rehabilitation require movement toward the floor or the ceiling?

  *   **Action:** Review Presentence Investigation (PSI) risk scores and specific deterrence arguments.
  *   **Guidance:**
      *   **Rehabilitation:** Strong social ties/employment plan = Move toward Floor.
      *   **Public Safety:** High validated risk score = Move toward Ceiling.
      *   **Deterrence:** Only apply if there is specific evidence that this *type* of offender responds to sentence severity (e.g., white-collar calculation). Do not apply general "send a message" arguments without specific findings.
  *   **Sufficient Answer:** "Factor [X] supports a sentence of [C] months."

  #### Step 3: The Conflict Check (The Hard Stop)
  *Question:* Does the sentence required by Step 2 exceed the ceiling established in Step 1?

  *   **Action:** Compare Step 2 result against Step 1 Ceiling.
  *   **Rule:** If Step 2 > Step 1 Ceiling, **Step 1 Controls.** You must impose the Step 1 Ceiling or lower. You may not exceed desert for the sake of safety.
  *   **Sufficient Answer:** "Consequentialist factors suggest [C], but the desert ceiling is [B]. Sentence is capped at [B]."

  #### Step 4: Handling Uncertainty and Fuzziness
  *Question:* Is the evidence for risk or deterrence speculative?

  *   **Action:** Apply the **Principle of Parsimony**.
  *   **Rule:** If risk assessment is conflicting, or deterrence evidence is anecdotal, resolve the ambiguity in favor of the *lesser* sentence within the desert range. Do not gamble with liberty based on weak predictions.
  *   **Sufficient Answer:** "Risk evidence is inconclusive; applying parsimony, sentence is set at [D] months."

  #### Step 5: Required Findings of Judgment (Non-Proceduralizable Points)
  *Question:* Where must I exercise unreviewable moral judgment?

  *   **Action:** Explicitly state the following on the record:
      1.  **Moral Weight of Harm:** Why this specific harm matters (e.g., "Breach of trust in embezzlement" vs. "Physical fear in robbery"). *Why:* Algorithms cannot weigh moral wrongness.
      2.  **Credibility of Change:** Whether you believe the offender's rehabilitation plan is genuine. *Why:* This is a human credibility call, not a data call.
      3.  **The Cap Decision:** If you are capping a safety-driven sentence due to desert, state clearly: "A longer sentence would protect the public but is unjust."

  ---

  ### PART II: CASE APPLICATIONS

  #### Case (a): The Young First Offender (Armed Robbery)
  *Facts:* 22M, no record, armed robbery (no injury), strong ties, low risk.

  *   **Step 1 (Desert Range):** Armed robbery is serious, but lack of injury and first-offender status reduces culpability.
      *   *Guideline Midpoint:* 36 months.
      *   *Range Width:* Moderate (±25%) due to "no injury" nuance.
      *   *Desert Range:* 27 to 45 months.
  *   **Step 2 (Consequentialism):** Low risk of reoffending; strong employment ties suggest rehabilitation is viable outside prison. Deterrence need is low (impulsive act).
      *   *Adjustment:* Move toward Floor.
      *   *Target:* 27 months (or probation if statutory minimum allows).
  *   **Step 3 (Conflict Check):** Target (27) is within Range (27–45). No conflict.
  *   **Step 4 (Uncertainty):** Risk assessment is robust (low). No ambiguity.
  *   **Step 5 (Judgment):** "The offender's culpability is mitigated by the absence of violence. While the weapon elevates the desert floor, his social ties justify the minimum proportionate term."
  *   **Output:** **27 Months (or suspended).** *Note: Both halves of the statute align here.*

  #### Case (b): The Embezzling Grandmother
  *Facts:* 61F, no record, 10-year embezzlement for medical debt. Prosecution argues general deterrence requires prison.

  *   **Step 1 (Desert Range):** Financial crime, breach of trust, but motive was necessity/care, not greed. Age reduces physical culpability.
      *   *Guideline Midpoint:* 18 months.
      *   *Range Width:* Narrow (±10%) because financial harm is calculable and motive is clear.
      *   *Desert Range:* 16 to 20 months.
  *   **Step 2 (Consequentialism):** Prosecution argues general deterrence requires 36 months to signal to other employees. Risk of reoffending is near zero (age/context).
      *   *Adjustment:* Prosecution wants Ceiling+ (36 months). Risk suggests Floor (Probation).
      *   *Target:* 36 months (based on Prosecution argument).
  *   **Step 3 (Conflict Check):** Target (36) > Desert Ceiling (20).
      *   *Ruling:* **Step 1 Controls.** You cannot impose 36 months.
  *   **Step 4 (Uncertainty):** Evidence that *this* defendant needs deterrence is weak (one-time necessity). Evidence that *others* will be deterred by her sentence is speculative. Apply Parsimony.
  *   **Step 5 (Judgment):** "While general deterrence is a statutory goal, it cannot justify a sentence disproportionate to this offender's moral blameworthiness. A 36-month sentence would treat her as a means to an end, violating the desert cap."
  *   **Output:** **16 Months (or Probation).** *Note: The procedure forces the judge to reject the prosecution's deterrence argument as legally impermissible under the statute.*

  #### Case (c): The Habitual Burglar (The Conflict Case)
  *Facts:* 3rd Conviction Burglar. Habitual offender statute exposure: 10 years. Public pressure high due to burglary wave. Risk assessment: High.

  *   **Step 1 (Desert Range):** Repeat offender status increases culpability. However, "no more severe than desert" implies a moral limit even for recidivists.
      *   *Guideline Midpoint:* 5 years.
      *   *Range Width:* Moderate (±25%).
      *   *Desert Range:* 3.75 to 6.25 years.
      *   *Statutory Ceiling:* 10 years.
      *   *Crucial Distinction:* The Statutory Ceiling (10) is *not* the Desert Ceiling (6.25).
  *   **Step 2 (Consequentialism):** High risk score. Public safety crisis. Deterrence needed for burglary wave.
      *   *Adjustment:* Move toward Maximum Safety.
      *   *Target:* 10 Years (Statutory Max).
  *   **Step 3 (Conflict Check):** Target (10 Years) > Desert Ceiling (6.25 Years).
      *   *Ruling:* **Step 1 Controls.** The sentence is capped at 6.25 years.
  *   **Step 4 (Uncertainty):** Deterrence evidence for burglary waves is historically weak (crimes of opportunity), but risk of reoffending is high. Even accepting high risk, the cap holds.
  *   **Step 5 (Judgment):** "The legislature has authorized up to 10 years, but the new statute forbids exceeding desert. My assessment of just deserts for this conduct, even with priors, tops out at 6.25 years. Public safety demands more, but justice forbids it."
  *   **Output:** **6.25 Years.**
  *   **Commission Risk:** This outcome will be criticized as "soft on crime." The procedure exposes that the Legislature's two commands are incompatible in high-risk recidivist cases. The judge must choose Desert over Safety.

  ---

  ### PART III: INTERNAL MEMORANDUM TO THE COMMISSION
  **SUBJECT:** Limitations and Risks of the Anchored Discretion Protocol

  **1. What This Procedure Cannot Do**
  This protocol creates a facade of precision where none exists. It cannot mathematically calculate "desert." Step 1 relies on judicial intuition regarding proportionality, merely formalized into a range. If judges systematically inflate their "Desert Range" to accommodate their safety concerns (e.g., claiming the desert range for Case C is actually 8–10 years), the statutory constraint is nullified. We have no audit mechanism to detect "Desert Inflation" other than appellate review, which will be deferential.

  **2. Systematic Mishandling of Specific Case Types**
  *   **Offender Ignorance of Law:** The procedure assumes culpability tracks with harm. It struggles with *malum prohibitum* offenses where the offender lacked moral awareness. Desert is low, but statutory guidelines may be high.
  *   **Strict Liability:** Desert is philosophically incoherent where intent is not required. The procedure will force judges to invent "constructive culpability" to fit the Step 1 range, creating fiction on the record.
  *   **Attempts vs. Completion:** Two offenders intend the same harm; one succeeds, one fails. Desert theory often treats them similarly (culpability-based), while guidelines treat them differently (harm-based). This procedure will create sentencing disparities between attempt and completion cases that look like errors to the public.

  **3. The Risk of "Procedural Legitimation"**
  Publishing this flowchart carries a specific danger: it may make sentencing *worse* than honest disagreement.
  *   **The Illusion of Resolution:** Judges may treat Step 1 (Desert Range) as a math problem rather than a moral one. They will look to the Guidelines to set the range, effectively making the Guidelines the definition of Desert, which circularly validates whatever the Legislature previously enacted.
  *   **Masking Value Conflicts:** In Case (c), the procedure forces the judge to choose Desert over Safety. By making this a "Step 3" check, we risk judges feeling insulated from the political fallout. However, if the public perceives the sentence as dangerous, they will blame the Commission's "rigid rules" rather than the Legislature's contradictory statute.
  *   **Displacement of Responsibility:** The procedure invites judges to say, "The Commission's formula made me do it." This undermines judicial accountability.

  **Recommendation:**
  We should publish the procedure with a prominent **"Judicial Disclaimer"** on the cover page: *This tool organizes discretion; it does not eliminate it. Where the statute's commands conflict, the judge must exercise moral judgment, not merely follow steps.* Without this, we risk creating a bureaucracy of sentencing that is consistent, compliant, and fundamentally unjust.
