answer: |-
  ## The 10-Minute Default Assumption Protocol

  **Purpose:** To quickly distinguish between genuine exclusivity (baked-in defaults) and false alarms (dead metaphors, technical precision) without requiring linguistics training.
  **Inspired by:** Hofstadter's substitution method, stripped of the satire for practical use.

  ### Part 1: The Checklist

  **Step 1: Identify the Function (1 min)**
  What job is the word doing in the sentence?
  *   **A. Default Noun/Pronoun:** Does it stand in for a generic human? (e.g., *mankind, chairman, he*)
  *   **B. Value Metaphor:** Does it use a trait to describe quality/state? (e.g., *sanity, blind, lame, crazy*)
  *   **C. Historical Record:** Is it a direct quote or fixed title? (e.g., *a philosopher's text, a book title*)

  **Step 2: The Substitution Test (3 mins)**
  Swap the contested term with a term from a *different* protected class that occupies a similar structural role.
  *   *If Function A (Default):* Swap gender for race, or vice versa. (e.g., *Chairman* $\rightarrow$ *Chairwhite*; *Mankind* $\rightarrow$ *Manrace*).
  *   *If Function B (Metaphor):* Swap the disability for a different stigmatized trait. (e.g., *Sanity* $\rightarrow$ *Whiteness* or *Straightness*; *Deaf* $\rightarrow$ *Blind* or *Race*).
  *   *If Function C (Record):* **STOP.** Do not run the substitution test on direct quotes. Go to Step 4.

  **Step 3: Stress-Test the Defense (3 mins)**
  Take the writer's defense ("It's just a technical term," "Everyone knows what it means," "It's etymologically innocent") and apply it to the *swapped* term.
  *   *Does the defense still hold water?*
      *   **Yes:** The usage is likely neutral/fossilized. (e.g., "Fell on blind eyes" is clunky, but "Fell on white ears" makes no sense, suggesting 'deaf' isn't functioning as a racial default).
      *   **No:** The defense collapses into special pleading. (e.g., "Let's do a 'straight check' on this code" sounds bigoted, revealing 'sanity check' relies on a similar hierarchy).

  **Step 4: The Verdict Matrix (3 mins)**

  | If Step 3 Defense... | And Synonyms Exist? | Output |
  | :--- | :--- | :--- |
  | **Collapses** (Sounds bigoted) | **Yes** (Easy swap) | **CHANGE IT.** (The term is a pretextual default). |
  | **Holds** (Sounds neutral/clunky) | **No** (No precise synonym) | **KEEP + EXPLAIN.** (It's a dead metaphor or technical necessity). |
  | **N/A** (Direct Quote/Title) | **N/A** | **HUMAN JUDGMENT.** (Values call: Accuracy vs. Inclusion). |

  ---

  ### Part 2: Running the Protocol on Your Inbox

  Here is the procedure applied to your three current complaints.

  #### 1. "Sanity Check" (Engineering Copy)
  *   **Complaint:** Ableist; implies mental illness is invalid.
  *   **Writer Defense:** It's a fixed technical term meaning "logic validation," not a medical diagnosis.
  *   **Step 1 (Function):** Value Metaphor. Uses a mental state to denote correctness.
  *   **Step 2 (Substitution):** Swap "Sanity" (mental stability) with "Straightness" (sexual orientation) or "Whiteness" (racial default).
      *   *Original:* "We need a sanity check on this module."
      *   *Swap:* "We need a straight check on this module." / "We need a white check on this module."
  *   **Step 3 (Defense Stress-Test):** Apply writer's defense ("It just means logic, not sexuality/race").
      *   *Result:* **Collapses.** Saying "straight check" immediately reads as excluding queer perspectives. Saying "white check" reads as centering whiteness as the standard of correctness. The defense "it's just a term" sounds like pretext.
  *   **Step 4 (Verdict):** **CHANGE IT.**
      *   *Reasoning:* Precise synonyms exist ("validation," "logic check," "smoke test"). The term relies on a hierarchy where "sane" = "correct" and "insane" = "broken." The substitution reveals this hierarchy is active, not fossilized.
      *   *Note:* I know you like this term. The procedure flags it because the defense fails the swap.

  #### 2. "Fell on Deaf Ears" (Headline)
  *   **Complaint:** Ableist; uses deafness as a metaphor for ignoring.
  *   **Writer Defense:** It's a dead idiom. Nobody pictures actual deaf people; it just means "ignored."
  *   **Step 1 (Function):** Value Metaphor. Uses a physical trait to denote reception.
  *   **Step 2 (Substitution):** Swap "Deaf" with "Blind" or a racial marker.
      *   *Original:* "Appeals fell on deaf ears."
      *   *Swap:* "Appeals fell on blind eyes." / "Appeals fell on black ears."
  *   **Step 3 (Defense Stress-Test):** Apply writer's defense ("It just means ignoring").
      *   *Result:* **Mixed/Holds.** "Fell on blind eyes" is clunky but follows the same physical-metaphor logic. "Fell on black ears" is nonsensical, suggesting 'deaf' isn't functioning as a *default human* marker (like 'mankind'), but as a specific functional metaphor. The "dead idiom" defense holds more weight here than in "sanity check."
  *   **Step 4 (Verdict):** **KEEP + EXPLAIN.**
      *   *Reasoning:* This is a fossilized idiom where the literal meaning is fully detached. While ableist in origin, the "default assumption" is weaker than in "sanity check." However, flag it for your style guide's next review. If a synonym works ("Ignored," "Dismissed"), use it. If the rhythm requires the idiom, keep it, but acknowledge the tension.

  #### 3. Generic "He" (Mid-Century Philosopher Quote)
  *   **Complaint:** Exclusionary; should be changed to "they."
  *   **Writer Defense:** It's a direct quote. Changing it falsifies history.
  *   **Step 1 (Function):** Historical Record.
  *   **Step 2 (Substitution):** **STOP.** You cannot substitute words inside a direct quotation without breaking the protocol.
  *   **Step 3 (Defense Stress-Test):** N/A.
  *   **Step 4 (Verdict):** **HUMAN JUDGMENT.**
      *   *Reasoning:* This is not a usage question; it is a values question. Accuracy (preserving the text) conflicts with Inclusion (not amplifying exclusionary language). The procedure cannot solve this.
      *   *Action:* Editor-in-Chief must decide: Do we prioritize historical fidelity or reader comfort? (Standard practice: Keep the quote, add context in a headnote or parenthetical if necessary).

  ---

  ### Part 3: Where This Procedure Breaks (Limitations)

  Do not treat this checklist as a moral calculator. It is a heuristic for detecting *pretext*, not truth. Here is where it will misfire:

  1.  **False Equivalencies:** Swapping race for disability is never a 1:1 moral match. The history of "sanity" is not the history of "whiteness." The test doesn't prove the harm is *equal*; it proves the *logic of the defense* is identical. If you wouldn't accept the defense for the swapped term, don't accept it for the original.
  2.  **The "Clunky Swap" Problem:** Sometimes the substitution sounds ridiculous simply because the phrase isn't common, not because it's offensive. (e.g., "Fell on black ears" sounds nonsense because ears aren't racialized, not necessarily because it's offensive). If the swap creates gibberish rather than offense, the test is inconclusive.
  3.  **Technical Precision:** In science, sometimes the "default" term is the only precise term. (e.g., "Male" and "Female" in biology). The substitution test might flag these as exclusive, but accuracy trumps style. If a writer argues precision, demand the specific technical necessity, not just "that's the term."
  4.  **Reflexive Swapping:** Don't let writers game the system by proposing absurd swaps to make the test fail. The editor chooses the substitution, not the writer. Stick to the matrix in Step 2.

  **Final Note:** If the procedure says "Human Judgment," that's not a cop-out. It means the complaint isn't about language mechanics; it's about what kind of magazine you want to be. That's your job, not the checklist's.
