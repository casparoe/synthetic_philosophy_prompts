answer: |-
  Your armchair diagnosis is sharp, and honestly, it's closer to the consensus among philosophers of biology than most active participants in the debate like to admit. You've hit on the central tension: **mathematical equivalence versus causal explanation.**

  Here is the breakdown of where the fight actually stands, what kind of disagreement it is, and whether it's ever going to end.

  ### 1. The Mathematical Truce (The Price Equation)
  You are correct that the formalization by Price, and later Sober and Wilson, created a mathematical truce. The Price Equation partitions total evolutionary change into within-group and between-group components.
  *   **The Gene-Centric View (Dawkins, Williams, Grafen):** Accepts the math but argues the "between-group" term is usually negligible or derivative of gene-level relatedness.
  *   **The Multilevel Selection (MLS) View (Sober, D.S. Wilson, Okasha):** Accepts the math but argues the "between-group" term is a distinct causal force that can be dominant.

  Because the Price Equation can mathematically translate an inclusive fitness (kin selection) model into a multilevel selection model and vice versa, **there is no disagreement about the algebra.** If you plug the same parameters into both frameworks, you get the same prediction about allele frequency change. This is why many philosophers (like Samir Okasha) argue the debate is largely verbal or conceptual.

  ### 2. The Real Disagreement: Causality and Heuristics
  If the math is equivalent, why are people still fighting? Because science isn't just about predicting equilibrium frequencies; it's about explaining *how* we get there and what variables are useful to measure. This is where your "bookkeeping vs. causation" distinction lands.

  **The Ontological Claim (Causation):**
  *   **Gene-Centric:** Argues that groups are often ephemeral. A "group" might not have the stability to be a genuine causal agent. Only replicators (genes) persist long enough to be the true units of selection. Groups are just "vehicles."
  *   **MLS:** Argues that if there is variance in group fitness and group heritability (groups spawn new groups), the group is a genuine causal agent, regardless of what's happening at the gene level. They argue the gene-centric view confuses the *unit of replication* with the *unit of selection*.

  **The Heuristic Claim (Research Programs):**
  This is the most substantive disagreement. It's about which framework is more *useful* for discovering new biology.
  *   **Inclusive Fitness (Kin Selection):** Requires measuring relatedness ($r$), cost ($c$), and benefit ($b$). This is incredibly hard to measure in microbes or complex human social structures.
  *   **MLS:** Requires measuring variance within and between groups. In experimental evolution (like bacteria or yeast), this is often much easier to measure than genetic relatedness.

  When Nowak, Tarnita, and Wilson published their controversial 2010 *Nature* paper claiming inclusive fitness theory was "limited" and MLS was superior, the backlash from the kin selection camp (Abbot, Boomsma, et al.) wasn't about the math being wrong. It was about the claim that one framework renders the other obsolete. The kin selection camp argues inclusive fitness provides deeper intuition about social evolution (e.g., why workers sterlize themselves), while the MLS camp argues inclusive fitness relies on assumptions (like weak selection) that often don't hold.

  ### 3. Is There an Empirical Disagreement?
  Yes, but it's about **parameter ranges**, not laws of nature.
  *   **Gene-Centric:** Tend to argue that the conditions required for group selection (low migration, high group extinction rates) are rare in nature. Therefore, invoking group selection is usually a mistake when kin selection suffices.
  *   **MLS:** Tend to argue that population structure is ubiquitous. If you define "groups" loosely (as "trait groups" or temporary associations), group selection is happening all the time.

  This is an empirical disagreement, but it's hard to settle because it depends on how you carve up the population. If a gene-centric biologist says, "That's just kin selection," and an MLS biologist says, "That's group selection," they are often looking at the same data but labeling the causal structure differently.

  ### 4. Diagnosis: What Kind of Disagreement Is This?
  It is primarily a **methodological and heuristic disagreement** masquerading as an ontological one.

  *   **Verbal?** Partially. Definitions of "group selection" vary. Some define it strictly (selection on group-level traits), others broadly (any altruism evolving via population structure).
  *   **Empirical?** Minimally. Both sides agree on the conditions for evolution (Lewontin's conditions). They disagree on how often those conditions are met at the group level in the wild.
  *   **Research Programs?** **Yes.** This is the core. The two camps are different "lenses." Sometimes the gene lens brings the picture into focus (e.g., meiotic drive, intragenomic conflict). Sometimes the group lens works better (e.g., microbial biofilms, human cultural evolution).

  ### 5. Will It Ever Be Settled?
  No. And here is the honest take on why:

  **1. Isomorphism:** Because the models are mathematically translatable, no amount of data can prove one "true" and the other "false." You can always re-describe a group selection outcome as kin selection and vice versa.
  **2. Explanatory Goals:** The camps value different things. The gene-centric camp values **reductionism** (explaining everything via the lowest common denominator). The MLS camp values **emergence** (acknowledging that higher-level interactions create dynamics not visible at the lower level). These are philosophical preferences, not scientific hypotheses.
  **3. The "Nowak" Effect:** The 2010 controversy proved that even when a formal result is presented (Nowak et al. claiming inclusive fitness is a special case of MLS), the opposing side will reject the framing, not the math.

  **The Verdict:**
  You should expect this to grind on forever, but the temperature will likely continue to drop. The field is moving toward **pluralism**. Most working evolutionary biologists don't care about the "true" unit of selection; they care about which model solves their specific problem.

  If you force a classification: It is a **conceptual disagreement about causal attribution** rooted in **competing heuristics**. The biology is settled (Price equation holds); the interpretation of what that biology *means* for the hierarchy of life is not. The gene-centric view wins on logical parsimony; the MLS view wins on descriptive flexibility for complex systems. Neither will "kill" the other because both are useful maps for different parts of the same territory.
