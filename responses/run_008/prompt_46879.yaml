answer: |-
  Here is the evaluation of your cousin's claims based on standard population genetics and philosophy of science definitions.

  1. **Misleadingness: 9/10**
     This commits the "individual attribution" fallacy. Heritability describes the proportion of *variance* in a population explained by genes, not the proportion of an *individual's* trait caused by genes. You cannot partition a single kid's IQ into percentages of nature vs. nurture.

  2. **Misleadingness: 9/10**
     High heritability does not imply immutability. As your prof's breeding example illustrates: even if milk yield is highly heritable in a herd (because everyone gets the same feed), changing the feed (environment) can still drastically shift the average yield for everyone.

  3. **Misleadingness: 10/10**
     This is the classic "between-groups" fallacy. High heritability *within* Denmark and *within* Guatemala tells you nothing about the cause of the difference *between* them. That gap could be 100% environmental (e.g., nutrition) despite high internal heritability in both groups.

  4. **Misleadingness: 0/10**
     This is actually correct. Heritability measures variation, not causation. If everyone has the trait (and the genes for it), there is zero variance to explain, so $h^2$ is zero even though the trait is entirely genetic.

  5. **Misleadingness: 0/10**
     This is also correct. Since heritability is a ratio of genetic variance to total variance ($V_G / V_P$), reducing environmental variance ($V_E$) by equalizing environments decreases the denominator, thereby increasing the heritability estimate.

  \answer{1: 9, 2: 9, 3: 10, 4: 0, 5: 0}
