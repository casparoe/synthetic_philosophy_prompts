  hey, so I'm taking a philosophy of science elective this semester and we just did a unit on heritability (h²) — what it measures, what it doesn't. I thought I understood it but then our prof gave us a quiz with a bunch of everyday claims and most of the class (me included) got wrecked. apparently the classic mistake is treating "heritable" as meaning "fixed by the genes" or as settling questions about differences between groups.

