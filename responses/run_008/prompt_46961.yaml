answer: |-
  You have essentially reconstructed the history of the philosophy of language in a single paragraph. Your list captures the tension between **Fregean Descriptivism** (names have senses/descriptions) and **Millian/Kripkean Direct Reference** (names are just tags for objects).

  Here is the breakdown of whether one account can save your intuitions, what you have to sacrifice, and how that applies to your grandfather and a new test case.

  ### 1. Is there one account that saves all of these?
  **No.** Not without significant modification.

  *   **Pure Descriptivism** saves the "informativeness" of *Hesperus is Phosphorus* and Lois Lane's beliefs (because the descriptions "evening star" and "morning star" differ), but it crashes into *Water is H2O*. If "water" just meant "clear drinkable liquid," then discovering it is H2O would be a change in definition, not a discovery about the world. We know now that water *must* be H2O in every possible world, which descriptions can't guarantee.
  *   **Pure Direct Reference** (Millianism) saves *Water is H2O* and the metaphysics of identity (names just tag objects), but it cannot explain why *Hesperus is Phosphorus* feels informative while *Hesperus is Hesperus* does not. If names are just tags, both sentences express the exact same proposition: $Venus = Venus$.

  **The Winner:** The dominant view in contemporary philosophy is a **Direct Reference account supplemented by a theory of "Guises" or "Mental Files."**

  This account says: The *semantic meaning* (the proposition expressed) of "Hesperus is Phosphorus" is indeed identical to "Hesperus is Hesperus." However, the *cognitive significance* differs because we access the referent through different psychological files.

  ### 2. What verdict do you have to give up?
  To keep this account, you must give up the verdict that **informativeness is a property of the sentence's meaning.**

  **Why is this the cheapest verdict to lose?**
  It is cheaper to locate the difference in your *mind* than in the *world*.
  *   **If you keep informativeness as semantic:** You have to accept that the *fact* of Venus being Venus changes depending on which name you use. This threatens the logical law of identity (Leibniz's Law) and makes truth dependent on language rather than reality. It makes metaphysics messy.
  *   **If you make informativeness psychological:** You admit that the *world* is simple (Venus is Venus), but *you* are complex (you have two mental files for Venus).

  It is "cheaper" because it preserves the logic of identity and the rigidity of natural kind terms (*Water is H2O*) without forcing us to invent "Fregean facts" that float between language and reality. You trade a semantic mystery for a psychological one, and psychology is already messy, so adding "modes of presentation" there costs less.

  ### 3. The Robert Miller Case
  **The Scenario:** Your grandfather believes "School Board Miller is honest" and "Coach Miller is dishonest." They are the same man.
  **The Question:** Is his belief coherent, or is he confused about the world vs. the words?

  **The Account's Verdict:**
  Your grandfather is **confused about the world, not the words.**

  Under the Direct Reference + Mental Files view:
  1.  **Reference:** When your grandfather says "School Board Miller," he refers to Robert Miller. When he says "Coach Miller," he *also* refers to Robert Miller. The words succeed in tagging the object.
  2.  **Belief:** He has opened two separate "mental files" for the same person. File A contains "honest." File B contains "dishonest."
  3.  **Coherence:**
      *   *De Dicto (about the description):* His beliefs are coherent. He isn't contradicting himself linguistically.
      *   *De Re (about the thing):* He holds contradictory beliefs about the *object* ($Miller is honest$ AND $Miller is dishonest$).

  **Diagnosis:** He is not confused about the meaning of the name "Robert Miller." He is confused about the **identity conditions** of the people in his town. He believes there are two distinct objects in the world when there is only one. This is a metaphysical error, not a linguistic one. If you told him, "They are the same man," you aren't correcting his dictionary definition; you are correcting his map of reality.

  ### 4. One More Test Case: The Gödel/Schmidt Case
  To check your gut against the split between Descriptivism and Direct Reference, consider this famous thought experiment by Saul Kripke.

  **The Case:**
  Suppose the man we know as "Kurt Gödel" did not actually prove the incompleteness of arithmetic. Suppose a man named **Schmidt** actually proved it, but Gödel stole the manuscript and published it under his own name. Schmidt died, Gödel got the fame.

  Now, consider the sentence: **"Gödel proved the incompleteness of arithmetic."**

  *   **The Descriptivist Intuition:** The name "Gödel" is shorthand for "the man who proved incompleteness." Since Schmidt did that, when you say "Gödel," you are actually talking about Schmidt. Therefore, your sentence is **True** (because Schmidt proved it).
  *   **The Direct Reference Intuition:** The name "Gödel" is a tag attached to the man baptized Gödel via a historical chain of communication. It doesn't matter what he did; it matters who he is. Since Gödel (the man) didn't prove it, your sentence is **False**.

  **How to check your gut:**
  If you feel that you are still talking about Gödel (the thief) and stating a falsehood, you align with Direct Reference. If you feel that "Gödel" just *means* "the prover," so you're actually talking about Schmidt, you align with Descriptivism.

  Most people's gut reaction is Direct Reference here: we feel we are accusing *Gödel* of fraud, not praising *Schmidt*. This suggests that names refer to people, not to job descriptions, which supports the account that requires you to treat your grandfather's confusion as a worldly error rather than a linguistic one.
