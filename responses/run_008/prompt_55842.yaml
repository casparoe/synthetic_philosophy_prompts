      *   *Desideratum 4: Logical Cost-Benefit (The "Conservation" Constraint).* Don't burn down the house to save the furniture. Logical revisions must be justified independently or be minimal.
      *   *Desideratum 5: Stability (The "No Revenge" Constraint).* Does the solution generate a new paradox? (e.g., if you restrict KP, can we construct a new Fitch-style argument for the restricted class?)

  4.  **Address the Specific Questions:**

