      *   *Scorecard:* Briefly assess Dummett, Edgington, Tennant, Paraconsistent, Denial.
      *   *Confidence/Meta-commentary:* Be transparent about the philosophical uncertainty.

  6.  **Refining the "Least Sure" Desideratum:**
      *   I'll pick *Robustness to Generalization*. Why? Because knowledge *is* distinct from provability or belief. If a solution exploits the factivity + cognitive access specific to knowledge, it might be fine even if it doesn't solve the provability analogue. Demanding it solve all modal paradoxes might be asking for a theory of *modality* rather than *knowledge*.
      *   *Test:* If a solution solves Fitch for knowledge but fails for provability, is it a bad theory of knowledge? Not necessarily. But if it fails for *belief* (which is very similar), that's more worrying.

  7.  **Final Review against Constraints:**
