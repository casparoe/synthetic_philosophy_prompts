      *   *Joint Unsatisfiability:* There is a tension between Non-Vacuity and Logical Economy (specifically Classical Logic). To keep KP non-vacuous, one often needs to restrict Classical Logic (e.g., intuitionism) or restrict KP significantly (risking vacuity). The "Trilemma" is often: Keep Classical Logic + Keep KP + Avoid Omniscience. You can't have all three.
      *   *The "Killer" Requirement:* Independent Motivation (Ad hocness). Many solutions fail here because they define the knowable class *as* "those that don't generate the paradox."
      *   *Confidence Levels:* Need to be honest. Philosophical consensus is low.
