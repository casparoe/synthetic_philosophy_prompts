      *   *Correction:* No, some anti-realists (Dummett) *want* intuitionistic logic. For them, revising logic isn't a cost, it's a feature. So Logical Economy is relative to prior commitments. I need to make that clear.
      *   *Initial thought:* Is "Diagnosis" separate from "Ad hocness"?
      *   *Correction:* They are linked. A diagnosis explains *why* a premise fails. Ad hocness asks if that explanation is independent. I will combine them into a stronger requirement called "Independent Theoretical Motivation."

  9.  **Final Polish:** Check the "Confidence" section. Ensure I explicitly state *what would show* the least sure desideratum is a prejudice. (Answer: If a solution works for knowledge but not provability and we agree knowledge and provability are disanalogous in the relevant way).

