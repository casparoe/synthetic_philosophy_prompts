prompt: |-
  I teach a 90-minute seminar on rational choice for fourteen upper-level philosophy students who have already covered extensive-form games and common knowledge. Design an in-class centipede game, run in three conditions, that makes them feel the backward induction paradox as a live problem about reasoning rather than a theorem to recite.

  The conditions should be: (1) a known-length chain of alternating "take/pass" decisions with a growing pot, where each pair first completes a written strategy audit — stating, node by node from the last node backwards, what they would do there and why — before playing for real; (2) the same chain but with a publicly announced 5% chance at each node that an "accident" ends the game and destroys the pot; (3) a round against a facilitator-run bot that plays the backward-induction strategy without exception. Payoffs in points, no real money, with a small neutral prize so the stakes are non-trivial.

  During play, participants should record, after every move, a prediction of the opponent's next move and their confidence in it; these prediction sheets are the raw material for the debrief.

  The debrief must map specific moments in the activity onto parts of the paradox: how the strategy audit made the induction feel airtight; what an observed pass should do to a player's beliefs about their opponent, given that the theory said that node would never be reached; whether the accident condition rescues passing by giving rational players a reason to continue at every node except near the end; and why playing the bot felt different from playing a person whose reasoning one might influence. Include rules, materials, a minute-by-minute timeline, and a payoff table for each condition.

  Also tell me what will predictably go wrong the first time I run it — participants passing out of politeness or confusion rather than strategy, students who already know the game defecting immediately and contaminating the data, pairs colluding quietly instead of competing — and be frank about which feature of the paradox no classroom version can reproduce: presumably the idealized common knowledge of rationality that the backward induction argument actually presupposes, which real, visibly hesitant opponents never give you. Say how the facilitator should supply that missing feature without simply lecturing.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 14 upper-level philosophy students (already know extensive-form games, common knowledge, backward induction).
      *   **Topic:** Rational Choice / Centipede Game Paradox.
      *   **Duration:** 90 minutes.
      *   **Goal:** Make the backward induction (BI) paradox feel like a *live reasoning problem*, not just a theorem.
      *   **Structure:** Three conditions:
          1.  Standard Centipede (Written Strategy Audit + Play).
          2.  Centipede with "Accident" risk (5% per node).
          3.  Centipede vs. BI Bot.
      *   **Data Collection:** Prediction sheets (opponent's next move + confidence) after every move.
      *   **Debrief:** Map activity moments to paradox components (audit airtightness, belief updating on observed pass, accident risk rationale, human vs. bot).
      *   **Deliverables:** Rules, materials, minute-by-minute timeline, payoff tables, troubleshooting (what goes wrong), and limitations (what can't be reproduced).
      *   **Tone:** Pedagogical, practical, philosophically rigorous.

  2.  **Deconstruct the Centipede Game:**
      *   *Standard Version:* Two players, alternate turns. Take (end game, get larger share) or Pass (grow pot, give opponent chance). BI says Take at first node. Empirical data says people Pass for a while.
      *   *The Paradox:* BI relies on Common Knowledge of Rationality (CKR). If I pass, I signal I'm not rational (or I think you aren't). If you aren't rational, BI doesn't apply. So why Take immediately?
      *   *Condition 1 (Audit):* Forces explicit BI reasoning. Creates cognitive dissonance when play deviates.
      *   *Condition 2 (Accident):* Introduces uncertainty. Makes passing rational up to a point (expected value calculation). Tests if students distinguish between *irrationality* and *uncertainty*.
      *   *Condition 3 (Bot):* Removes the "mind-reading" aspect. Tests if they stick to BI when the opponent is known to be a maximizer.

  3.  **Drafting the Plan - Section by Section:**

      *   **Logistics & Materials:** Need 14 students = 7 pairs. Need printed sheets (Strategy Audit, Prediction Sheets, Payoff Tables). Need a timer. Need a "Bot" script (facilitator).
      *   **Payoff Structure:** Needs to be steep enough to make "Take" tempting but "Pass" rewarding if mutual. Let's use points.
          *   Standard: Start small, double roughly. E.g., (1, 0) -> (0, 2) -> (3, 1) -> (2, 4)... Wait, standard centipede usually increases the total pot.
          *   Let's use a 6-node game for time efficiency.
          *   Node 1 (P1): Take (2, 1) or Pass.
          *   Node 2 (P2): Take (1, 4) or Pass.
          *   Node 3 (P1): Take (5, 2) or Pass.
          *   Node 4 (P2): Take (4, 8) or Pass.
          *   Node 5 (P1): Take (9, 4) or Pass.
          *   Node 6 (P2): Take (8, 16) or Pass (End: 10, 10? No, usually last node is Take or forced split). Let's make Node 6 a forced Take for simplicity or a final Pass option that yields less than Taking. Let's stick to standard Rosenthal structure.
          *   *Revised Payoffs:*
              *   N1 (P1): Take (2, 1) | Pass ->
              *   N2 (P2): Take (1, 4) | Pass ->
              *   N3 (P1): Take (5, 2) | Pass ->
              *   N4 (P2): Take (4, 8) | Pass ->
              *   N5 (P1): Take (9, 4) | Pass ->
              *   N6 (P2): Take (8, 16) | Pass -> (10, 10) [Cooperative End]
              *   *BI Check:* N6 Pass (10,10) > Take (8,16)? No, P2 takes 16. So N6 is Take.
              *   N5: P1 knows N6 Take (8, 16). P1 Compare Take (9, 4) vs Pass (8, 16). 9 > 8. P1 Takes.
              *   N4: P2 knows N5 Take (9, 4). P2 Compare Take (4, 8) vs Pass (9, 4). 8 > 4. P2 Takes.
              *   ... N1 Take.
      *   **Timeline:** 90 mins is tight for 3 rounds + debrief.
          *   Intro: 5 min.
          *   Cond 1 (Audit + Play): 25 min.
          *   Cond 2 (Accident): 20 min.
          *   Cond 3 (Bot): 15 min.
          *   Debrief: 25 min.
      *   **The "Audit":** This is crucial. They must write down what they *would* do at every node *before* playing. This locks in the BI logic.
      *   **The "Prediction Sheet":** After opponent moves, predict next. This captures belief updating.
      *   **Troubleshooting:**
          *   *Collusion:* Students talking. Need strict silence.
          *   *Politeness:* Passing to be nice. Need to emphasize points = prize.
          *   *Contamination:* Game theorists in the room. Assign them specific roles or ask them to play "naively" first? No, better to use their deviation as data.
          *   *The "Missing Feature":* CKR. In class, I see a human. I don't know they are rational. The facilitator needs to simulate CKR in the debrief, not the play.

  4.  **Refining the Conditions:**

      *   *Condition 1:* Standard. The Audit forces them to write "Take" at the end, then work back. When they play, if they Pass, they violate their own audit. *Key tension:* Theory vs. Intuition.
      *   *Condition 2:* 5% Accident. This changes the math. Expected Value of Passing drops. Does it make BI *more* compelling or does it justify stopping earlier? Actually, risk of accident makes passing *less* attractive, reinforcing BI, but adds a *non-rationality* reason to stop. Wait, the prompt asks: "whether the accident condition rescues passing by giving rational players a reason to continue."
          *   *Correction:* Usually, risk of breakdown makes cooperation *harder*. If there's a chance the game ends before I get my reward, I should Take sooner.
          *   *Re-reading prompt:* "whether the accident condition rescues passing by giving rational players a reason to continue at every node except near the end."
          *   *Philosophical nuance:* If there is a chance the game ends *randomly*, does that break the CKR chain? If the game ends by accident, no one "defected." This allows me to Pass without signaling irrationality. It creates "plausible deniability." This is the key insight for Condition 2. It allows rational players to Pass because a Pass doesn't definitively signal "I am not a BI maximizer," it might signal "I'm hedging against the accident."
          *   *Wait, actually:* If there is a 5% chance the game *ends* (pot destroyed), the EV of passing is $0.95 \times \text{Next Payoff}$. If this is still higher than Taking, you Pass. But usually, this accelerates the Take.
          *   *Interpretation for Seminar:* The prompt suggests the accident condition might "rescue passing." This implies the *epistemic* rescue. If the game stops by accident, my opponent didn't defect. So I can maintain the belief that they are rational longer. I will frame it this way: The accident introduces uncertainty about *why* the game stopped, preserving the hypothesis of rationality longer than the deterministic game.
      *   *Condition 3:* Bot. The Bot *always* Takes at the first node (or follows BI). If the Bot is known to follow BI, the student *must* Take at N1. If they Pass, they lose. This isolates the "Human vs Human" uncertainty.

  5.  **Addressing the "Missing Feature" (CKR):**
      *   In the classroom, I cannot make them *know* their partner is rational. They see a nervous peer.
      *   *Solution:* In the debrief, use the "Audit" as a proxy. "You wrote that a rational agent Takes. You assumed your partner was rational. When they Passed, did you update 'They are irrational' or 'They don't know I'm rational'?"
      *   Facilitator move: Don't lecture CKR. Ask: "What did you think when they Passed? Did you think they were stupid, or did you think they were trying to teach you something?"

  6.  **Developing the Troubleshooting Section:**
      *   *Politeness:* Emphasize the prize. "This is a competition."
      *   *Contamination:* The "Game Theorists." Tell them: "Play your gut first. We need the intuition data."
      *   *Collusion:* "No talking. Eyes on your sheet."
      *   *Boredom:* Keep it moving.

  7.  **Final Review against Constraints:**
      *   90 mins? Yes, timeline needs to be tight.
      *   14 students? 7 pairs.
      *   Prediction sheets? Included.
      *   Payoff tables? Included.
      *   Debrief mapping? Included.
      *   Frank about limitations? Included.

  8.  **Writing the Content:** (Self-Correction during drafting)
      *   *Payoff Table:* Make sure the numbers are clear.
      *   *Audit:* Make sure they do it *before* seeing the partner's move.
      *   *Bot:* How to run the bot? Facilitator plays against the whole class? Or one volunteer? Better: Facilitator plays against *everyone* simultaneously (projected) or one volunteer while others watch. Let's go with One Volunteer vs. Facilitator (projected) to save time, while others calculate. Or, to keep them engaged, everyone plays against a "Bot Sheet" where the moves are pre-determined. Let's do Pre-determined Bot Sheets for all pairs to keep everyone active.
      *   *Accident Mechanism:* How to simulate 5%? Roll a d20. 1 = Accident. Do this publicly.

  9.  **Final Polish:** Check tone. Ensure it sounds like a guide for a professor, not a textbook. Emphasize the *philosophical* tension.

  *(Self-Correction on Condition 2 Logic)*: I need to be careful. Does risk of accident rescue passing?
  Standard BI: Pass -> Opponent Takes -> I lose.
  Accident: Pass -> 5% Game Over (0,0) -> 95% Opponent Moves.
  If Opponent is Rational (BI), they Take. So Pass still leads to loss (either accident or Take).
  *However*, the prompt asks to explore if it "rescues passing." The philosophical angle is *epistemic*. In Condition 1, if I Pass, I signal I am not BI-rational. In Condition 2, if I Pass, I could be rational but risk-averse, or hedging against the accident. It blurs the signal. I will frame the debrief around *signal jamming*.

  Let's finalize the timeline. 90 minutes is very short for 3 rounds + audit + debrief.
  Intro: 5
  Cond 1: 30 (Audit is slow)
  Cond 2: 20
  Cond 3: 15
  Debrief: 20
  Total: 90. Tight but doable if transitions are crisp.

