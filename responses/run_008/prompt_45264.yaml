answer: |-
  # Seminar Plan: The Live Centipede
  **Topic:** Rational Choice, Common Knowledge, and the Backward Induction Paradox
  **Duration:** 90 Minutes
  **Participants:** 14 Upper-Level Philosophy Students (7 Pairs)
  **Goal:** Transform backward induction (BI) from a formal result into an experiential conflict between theoretical rationality and strategic belief.

  ---

  ## 1. Materials & Setup

  **Room:** Seminar table or clustered desks. Pairs must not overhear each other.
  **Incentive:** A small neutral prize (e.g., a nice book, chocolate, or "homework pass") for the pair with the highest aggregate point total across all three conditions. This ensures stakes are non-trivial but not coercive.

  **Printables (per student):**
  1.  **Master Payoff Sheet:** Displays the game tree and point values for all three conditions.
  2.  **Condition 1 Strategy Audit:** A worksheet requiring a decision (Take/Pass) and justification for *every* node, filled out *before* play begins.
  3.  **Prediction & Confidence Sheet:** Used during play. After the opponent moves, the student records: (a) What they predict the opponent will do next, (b) Confidence (0–100%).
  4.  **Condition 2 Accident Log:** Space to record dice rolls (accident checks).
  5.  **Condition 3 Bot Script:** A fixed sequence of moves representing the BI strategy.

  **Facilitator Props:**
  *   7 twenty-sided dice (d20) for Condition 2.
  *   Timer.
  *   Whiteboard for Debrief mapping.

  ---

  ## 2. Payoff Structure (Points)
  *Use a 6-node game to fit the timeframe. P1 moves at nodes 1, 3, 5. P2 moves at nodes 2, 4, 6.*

  | Node | Player | Action | Payoff (P1, P2) | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **P1** | **Take** | **(2, 1)** | **BI Solution** |
  | | | Pass | → Node 2 | |
  | **2** | **P2** | **Take** | **(1, 4)** | |
  | | | Pass | → Node 3 | |
  | **3** | **P1** | **Take** | **(5, 2)** | |
  | | | Pass | → Node 4 | |
  | **4** | **P2** | **Take** | **(4, 8)** | |
  | | | Pass | → Node 5 | |
  | **5** | **P1** | **Take** | **(9, 4)** | |
  | | | Pass | → Node 6 | |
  | **6** | **P2** | **Take** | **(8, 16)** | |
  | | | Pass | **(10, 10)** | Cooperative End |

  *Backward Induction Logic:* At Node 6, P2 Takes (16 > 10). Knowing this, P1 at Node 5 Takes (9 > 8). Knowing this, P2 at Node 4 Takes (8 > 4)... P1 at Node 1 Takes (2 > 1).

  ---

  ## 3. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction & Stakes
  *   **Facilitator:** "We know the theorem. Today we test the psychology of the proof. You will play three versions of the Centipede Game. Points convert to entries for the prize. Silence is mandatory during play. No collusion."
  *   **Pairing:** Assign seats. Designate Player 1 and Player 2 for Condition 1.

  ### 0:05 – 0:35 | Condition 1: The Audit (Standard Game)
  *   **0:05 – 0:15 (The Audit):** Hand out **Strategy Audit Sheets**.
      *   *Instruction:* "Do not talk to your partner. Starting from Node 6 and working backward to Node 1, write down what a *rational* player *must* do at each node and why. This is not what you *want* to do; it is what the logic dictates. You must complete this before making a single move."
      *   *Goal:* Lock in the BI logic explicitly. Make the contradiction with intuition written and undeniable.
  *   **0:15 – 0:30 (The Play):** Pairs play the game.
      *   *Rule:* After every move, the *waiting* player fills out the **Prediction Sheet** (Predict Next Move + Confidence %).
      *   *Facilitator:* Walk around. If a pair finishes quickly, have them reset and play best-of-three, but keep the Audit fixed.
  *   **0:30 – 0:35 (Collection):** Collect Audit and Prediction sheets. Do not discuss results yet.

  ### 0:35 – 0:55 | Condition 2: The Accident Risk
  *   **Setup:** Explain the new rule. "At the start of every turn, before the player decides, roll a d20. On a 1 (5% chance), an 'Accident' occurs. The game ends immediately. Both get 0 points for this round. On 2–20, play proceeds normally."
  *   **0:35 – 0:40 (Calculation):** Students have 5 minutes to silently recalculate expected values.
      *   *Prompt:* "Does the accident risk change the Backward Induction logic? Does it change the *signaling* value of a Pass?"
  *   **0:40 – 0:55 (The Play):** Play one round.
      *   *Note:* If an accident occurs, the round ends. Record it. If no accident, play to completion.
      *   *Data:* Continue using Prediction Sheets.

  ### 0:55 – 1:10 | Condition 3: The BI Bot
  *   **Setup:** "You are now playing against a script. The script is programmed to follow Backward Induction perfectly. It will Take at the first available node where BI dictates Take."
      *   *Twist:* Since BI dictates P1 Takes at Node 1, if the student is P1, the game ends instantly. To make this playable, **swap roles**. The Student is always P2, the Bot is P1.
      *   *Correction for Engagement:* Actually, have the Bot play the *response* strategy. If the Student Passes, the Bot Takes immediately at the next node (as per BI).
      *   *Better Implementation:* Hand out a **Bot Script**. "The Bot is Player 1. It has already decided its strategy: Take at Node 1. However, to allow you to experience the tension, we will simulate a scenario where the Bot *passed* Node 1 (a glitch). How do you respond?"
      *   *Refined Plan for Time:* Facilitator plays the Bot against the *whole room* simultaneously. Facilitator is P1. Students are P2.
      *   *Move 1:* Facilitator (Bot) **Passes**. (This violates BI, creating the paradox live).
      *   *Move 2:* Students (P2) must decide at Node 2.
      *   *Move 3:* Facilitator announces: "If you Pass, the Bot will Take at Node 3."
      *   *Goal:* Force them to play against a known maximizer who has made an apparent error.

  ### 1:10 – 1:30 | The Debrief (The Core Philosophy)
  *   **1:10 – 1:15:** Tally points. Announce winners.
  *   **1:15 – 1:30:** Whiteboard discussion mapping activity to theory (see Debrief Guide below).

  ---

  ## 4. Debrief Guide: Mapping Activity to Paradox

  Do not lecture. Use their Prediction Sheets and Audits as evidence.

  **1. The Audit vs. The Move (Condition 1)**
  *   *Ask:* "Look at your Audit. You wrote 'Take' at Node 1. How many of you actually Passed in the game?"
  *   *The Point:* The Audit makes the logic explicit. The Play reveals the logic is not *action-guiding* without **Common Knowledge of Rationality (CKR)**.
  *   *Question:* "If you Passed, did you think your partner was irrational? Or did you think they thought *you* were irrational?"

  **2. Belief Updating (Prediction Sheets)**
  *   *Ask:* "Find the moment your opponent Passed. Look at your Confidence score for the *next* move. Did your confidence that they would 'Take' next go up or down?"
  *   *The Point:* BI assumes that if a node is reached that shouldn't be reached (e.g., Node 3), the game is over. But in reality, a Pass updates your belief.
  *   *Philosophical Hook:* "The paradox assumes that observing an impossible event (a Pass) doesn't break the model. Your sheets show it *does* break the model. You started wondering if they were 'nice' or 'strategic,' not just 'rational'."

  **3. The Accident Condition (Condition 2)**
  *   *Ask:* "Did the 5% risk make you Take sooner or Pass longer?"
  *   *The Point:* This tests **Signal Jamming**. In Cond 1, Pass = "I am not a BI maximizer." In Cond 2, Pass = "I might be hedging against the accident."
  *   *Philosophical Hook:* "Does uncertainty about the *game structure* rescue rational cooperation? If I Pass, can I maintain the fiction that I am rational, blaming the risk instead?"

  **4. The Bot (Condition 3)**
  *   *Ask:* "When I (the Bot) Passed at Node 1, did you feel relieved or suspicious?"
  *   *The Point:* Against a human, a Pass is an invitation to collaborate. Against a Bot known to be a maximizer, a Pass is a glitch.
  *   *Philosophical Hook:* "Rationality is not a monologue. It requires a mind you can model. The Bot removed the 'meeting of minds.' Without the possibility of mutual influence, BI collapses back to the theorem."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Politeness" Defection**
  *   *Problem:* Students Pass because they don't want to "hurt" their partner's score by Taking early.
  *   *Fix:* In the intro, frame the points aggressively. "This is a competition. Maximizing your own score is the only moral duty in this game." If they still collude, use their data as an example of *social preference* overriding *rational choice* in the debrief.

  **2. The "Contaminated" Game Theorist**
  *   *Problem:* One student knows the solution and Takes at Node 1 immediately, ending the game in 10 seconds.
  *   *Fix:* Pre-seed these students. Pull them aside before class. "I need you to play your intuition in Round 1. Don't solve it until the debrief." If they defect anyway, use them in the debrief: "Why did the class resent Student X for being 'correct'?"

  **3. Quiet Collusion**
  *   *Problem:* Pairs agree to Pass until the end to maximize joint points.
  *   *Fix:* Circulate during the Audit phase. Ensure they are writing individually. During play, if you hear whispering, stop the pair and invalidate their round.

  **4. The "Boredom" Drop-off**
  *   *Problem:* Condition 3 feels fake.
  *   *Fix:* Keep Condition 3 short. It is a thought experiment enacted. The value is in the *reaction* to the Bot's move, not the duration of play.

  ---

  ## 6. The Missing Feature: Common Knowledge of Rationality

  **The Hard Truth:**
  No classroom version can reproduce **Common Knowledge of Rationality (CKR)**.
  *   **Why:** CKR requires: I am rational, You are rational, I know You are rational, You know I know You are rational... *ad infinitum*.
  *   **In Class:** You look at your partner. You see a human. You see them hesitate. You see them smile nervously. You do *not* know they are rational. You do not know if they know you are rational. The hesitation *is* the lack of CKR.

  **How the Facilitator Supplies This (Without Lecturing):**
  Do not tell them "CKR was missing." Show them.
  1.  **During Debrief:** Point to the **Audit**. "On this paper, you assumed your partner was a rational robot. You proved BI was valid *if* they were a robot."
  2.  **Point to the Play:** "In the game, you saw a person. The moment they hesitated, the CKR chain broke. You couldn't assume they knew the logic you just wrote down."
  3.  **The Pivot:** "The Centipede Paradox isn't a math error. It's a proof that **CKR is false in the real world**. The theorem holds; the premise (that we know each other to be rational maximizers) is the lie. The game didn't fail. The assumption failed."

  This turns the "failure" of the students to follow BI into the philosophical success of the seminar. They didn't play irrationally; they correctly identified that the conditions for BI were not met.

  ---

  ## 7. Handout: Prediction & Confidence Sheet (Template)

  **Round:** ______ **Condition:** ______
  **My Role:** P1 / P2

  | Turn | Opponent Just Moved... | I Predict They Will Next... (Take/Pass) | Confidence (0-100%) | Why? (One sentence) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | (N/A - Start) | | | |
  | 2 | Passed | | | |
  | 3 | Passed | | | |
  | 4 | Passed | | | |
  | 5 | Passed | | | |

  *(Note: Fill this out immediately after the opponent moves, before you make your own decision.)*
