answer: |-
  ### 1. Essay Question

  **Final Examination: Death, Time, and the Self**
  **Time Limit:** 48 Hours
  **Word Limit:** 1,200 words (±10%)

  **Prompt:**

  Consider the following case: A clinic offers "Deferred Annihilation." For a fee, they implant a device that guarantees you will die instantly and painlessly in your sleep exactly ten years from the implant date. They can prove the device works. Nothing about your health changes before then; your remaining decade is the decade you'd otherwise have, except it now has a known, fixed endpoint that you chose.

  The Epicurean argument claims death cannot be bad for the person who dies. This argument relies on three key premises:
  1.  **The No-Subject Premise:** Harm requires a subject who exists at the time of the alleged harm to be harmed.
  2.  **The No-Time Premise:** There is no time at which death is bad for the subject (not before, when they are alive; not after, when they are dead).
  3.  **The Symmetry Premise:** Posthumous nonexistence is relevantly similar to prenatal nonexistence, neither of which is bad for us.

  Write an essay evaluating the rationality of signing up for Deferred Annihilation. If death is not bad for you (as Epicureans claim), should signing up be considered rationally permissible, or even neutral? If refusing to sign is rational, does that commitment force you to reject one of the Epicurean premises listed above?

  In your answer, you must:
  *   Identify which specific Epicurean premise (if any) fails to capture the intuition generated by the Deferred Annihilation case.
  *   Explain whether the *knowledge* of the fixed endpoint changes the value of the intervening life, or whether the harm lies solely in the cessation itself.
  *   **Constraint:** You must bracket off the physical process of dying (which is stipulated as painless), the grief of others, and concerns about the "unfairness" of early death compared to others. Focus exclusively on whether death is bad *for the subject* who dies.

  ***

  ### 2. Model Answer

  **The Rationality of Refusal and the No-Subject Premise**

  The Deferred Annihilation case presents a sharp challenge to the Epicurean conclusion that death is nothing to us. If the Epicurean argument holds, signing up for Deferred Annihilation should be rationally neutral, provided the fee is negligible and the death painless. However, most agents would view signing up as irrational and refusing as rational. This intuition suggests that death *is* bad for the person who dies, but to explain why without violating the case's constraints, we must identify precisely where the Epicurean argument fails. The defect lies not in the Symmetry or No-Time premises, but in the **No-Subject Premise**.

  The Epicurean No-Subject Premise claims that harm requires a subject who exists at the time of the alleged harm to be harmed. Under this view, once the device triggers, I no longer exist to be harmed by the cessation of life. Before the trigger, I am alive and suffering no harm. Therefore, there is no subject at the time of the harm. This premise forces a snapshot view of welfare, where harm must be experienced or instantiated at a specific moment *t*.

  Refusing Deferred Annihilation is rational because it preserves the value of an open future, a value that the No-Subject Premise cannot accommodate. When I refuse the implant, I am not merely avoiding a moment of nonexistence; I am preserving the possibility that my life narrative continues beyond the ten-year mark. The harm of death is not located in a specific moment of experience (which would violate the No-Time premise) nor in the state of being dead (which violates the No-Subject premise). Instead, the harm is relational and retrospective. It consists in the falsification of the implicit possibilities inherent in being alive.

  One might argue that the harm lies in the *knowledge* of the endpoint—that knowing I will die in ten years ruins the intervening decade. However, the case stipulates that nothing about health changes before then. If the harm were solely in the anxiety of knowing, then a person who forgot they signed up would suffer no harm. Yet, we intuitively think they are still harmed by the early termination. Therefore, the badness must attach to the cessation itself, not the anticipation.

  This forces us to reject the No-Subject Premise. We must accept that a subject can be harmed by an event even if they do not exist at the time the harm obtains. This is not mystical; it is analogous to how a promise made to me can be broken after I die, wronging me despite my nonexistence. In Deferred Annihilation, the device severs the trajectory of a life that, by its nature, aims at continuation. The subject who exists *before* the implant is the same subject who is harmed by the termination, even though the harm culminates when that subject no longer exists.

  If we accept this modification, refusing the implant is rational because it avoids a definitive deprivation of future goods. The Epicurean might counter with the Symmetry Premise: why worry about future nonexistence when we accept past nonexistence? The difference is agency and trajectory. Prenatal nonexistence did not interrupt a going concern; Deferred Annihilation actively stops one. The symmetry breaks because the subject has already been constituted. To stop the subject is to harm the subject, even if the subject isn't there to feel the stop.

  Therefore, the Deferred Annihilation case isolates the No-Subject Premise as the failure point. It demonstrates that harm is not strictly time-bound to existence. Refusing the implant is rational because it acknowledges that the value of a life is not just in the moments lived, but in the openness of the narrative. To choose closure is to choose a harm that transcends the moment of existence, proving that death is bad for the person who dies, regardless of whether they are there to witness it.

  ***

  ### 3. Marking Scheme

  | Must-Hit Move | Full Marks | Partial Credit | Marks |
  | :--- | :--- | :--- | :--- |
  | **Identification of Epicurean Premises** | Clearly defines the No-Subject, No-Time, and Symmetry premises as presented in the prompt, specifically noting the definition of No-Subject (harm requires existing subject). | Defines premises generally but misses the specific constraint on the No-Subject premise regarding existence *at the time of harm*. | 5 |
  | **Application to Deferred Annihilation** | Explicitly analyzes the rationality of signing vs. refusing based on the *fixed endpoint* variable, not just death generally. | Discusses death generally without tying the argument back to the specific mechanics of the implant/choice. | 5 |
  | **Argumentative Position** | Takes a clear stance (e.g., "Refusal is rational because...") and defends it consistently throughout the essay. | Surveys options without committing to a conclusion, or contradicts the stated position midway. | 5 |
  | **Constraint Adherence (Bracketing)** | Strictly avoids arguments based on pain of dying, grief of others, or comparative unfairness; explicitly notes these are bracketed. | Mentions forbidden topics but attempts to dismiss them; or relies on them implicitly to support the conclusion. | 5 |
  | **Clarity and Structure** | Essay is logically organized, within word limit, and free of distracting errors. | Disorganized or significantly over/under the word limit. | 5 |
  | **Penalty: Sliding into 'Dying'** | N/A | Deduct 2 marks for every instance where the argument relies on the physical process of dying being negative. | -2 |
  | **Penalty: Sliding into 'Others'** | N/A | Deduct 2 marks for every instance where the argument relies on the grief or loss suffered by others. | -2 |

