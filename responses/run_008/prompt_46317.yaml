                          *   *Perfect.* This creates the paradox.

  3.  **Drafting the Activity Flow:**
      *   **Intro (5 mins):** Set the stage. You are the Release Committee.
      *   **Phase 1: Rule Setting (10 mins):** Vote on how to decide (Direct vs. Premise). *Wait, prompt says "let the committee first argue about and vote on the decision rule itself".* If they vote for Direct, the paradox doesn't happen in Round 2. I need to force them to try *both* methods to see the difference, regardless of what they pick as "official."
      *   *Correction:* The prompt says "Run it twice... I want the group to be genuinely surprised." If they vote on the rule first, they might lock out the second method.
      *   *Interpretation:* Have them vote on the rule to set the "Official Policy," but then say "For training purposes, we're simulating the alternative method too." OR, split the room into two rounds where the rule changes.
      *   *Better approach:* Round 1: Direct Vote. Round 2: Premise Vote. *Then* reveal the conflict. The "Rule Vote" twist can be a meta-layer: "Before we start, what rule *should* we use?" (They will argue). Then run the simulation to show *why* the argument matters.
      *   *Refined Plan:*
          1.  Intro & Role Cards (Info Asymmetry).
          2.  Meta-Vote: How *should* we decide? (Direct vs. Premise).
          3.  Simulation Round 1: Direct Vote.
          4.  Simulation Round 2: Premise Vote (apply rule).
          5.  Reveal Conflict.
          6.  Strategic Twist injection (in Round 2).
          7.  Debrief.

  4.  **Developing the Strategic Twist:**
      *   Instruction: "You think P1 is actually fine, but vote NO on P1 to block the release because you hate the feature for other reasons."
      *   This is "Strategic Voting" or "Logrolling."
      *   If no one notices: I need a reveal mechanism. In the debrief, ask "Did anyone vote against their technical assessment?" If silence, *I* reveal that I instructed it to show how opaque the premise method is.

  5.  **Addressing the Limitations (Literature Check):**
      *   *Topic:* Judgment Aggregation / Discursive Dilemma (Pettit, List, Kornhauser).
      *   *What the game misses:*
          *   **Interconnectedness:** In real life, premises aren't independent. P1 might imply P2.
          *   **Intensity of Preference:** Voting is binary. Real devs feel *strongly* about privacy vs. tests.
          *   **Deliberation:** The paradox often dissolves if people talk and update beliefs. The game isolates voting.
          *   **The "Right" Answer:** The literature doesn't say which is right, it says they satisfy different axioms (Systematicity vs. Independence). The game can't prove one is morally superior, only structurally different.

  6.  **Refining the Materials:**
      *   Need Role Cards (12 total).
      *   Need Ballots (Simple slips of paper).
      *   Need Whiteboard for tallying.
      *   Need "Secret Instruction" cards for the 2 strategists.

