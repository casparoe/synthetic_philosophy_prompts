  ### Part 4: The "Super-Case" for Clean Separation

  If you want to separate Modern SE and CFC even more cleanly than Case 4, you need to remove the ambiguity of "old trait in new place." You need a case where the trait is *purely* a byproduct that *immediately* becomes essential.

  **Describe this case to her:**
  > "Imagine a population of beetles lives on green leaves. Due to a developmental quirk (a spandrel/byproduct of growing large mandibles), they happen to have a slight red tint. This tint does nothing on green leaves. Suddenly, the environment changes overnight: the leaves turn bright red due to a fungal bloom. Now, predators cannot see the red-tinted beetles. The beetles survive the winter *once*, but due to a separate catastrophe (a flood), they all die before reproducing.
  >
  > **Question:** During that winter, did the red tint have the function of camouflage?"

  **Why this separates the principles:**
  1.  **Modern SE:** **No.** There was no selection history for the red tint *before* the winter, and no reproduction *during/after* the winter to establish the function. It was a lucky accident that saved them, but never became a "function."
  2.  **Current Fitness Contribution:** **Yes.** During that winter, the red tint was the *sole reason* the beetles survived predation. It made a maximal causal contribution to their fitness capacity.
  3.  **Why it's better than Case 4:** In Case 4, the toe pads *had* a function previously (climbing). Dr. R might get confused about whether the *trait* has a function (yes, climbing) vs. the *new effect* (falls). In the Beetle case, the trait had **no function whatsoever** prior to the environmental shift. It is a pure spandrel turned savior.
      *   If she says **"No function,"** she confirms that for her, **Function = History of Selection.**
      *   If she says **"Yes function,"** she confirms that for her, **Function = Current Survival Value.**

  **My Advice:** Start with **Case 4 (Lizards)**. It's the most natural follow-up to her Cormorant ruling. If she hedges, deploy the **Beetle Super-Case**. If she says "Yes" to the Beetles, you have caught her in a CFC net; if she says "No," she is a strict Modern Selected-Effect theorist, and you can stop lending her your copies of Cummins.
