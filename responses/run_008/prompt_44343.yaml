  This is a classic setup for a function debate, and your labmate Dr. R is behaving like a textbook **Modern Selected-Effect (MSE)** theorist, though she is leaving herself just enough wiggle room to potentially be a **Current Fitness Contribution (CFC)** theorist. Her coffee rulings are a goldmine because they systematically rule out the two most common competing views: *Classic Etiological* accounts and *Cummins-style Causal Role* accounts.

  Here is the breakdown of her implicit theoretical commitments, the predictions for your four new cases, and the strategic advice for your next coffee meeting.

  ### Part 1: Diagnosing Dr. R's Implicit Principles

  To predict her verdicts, we must first determine which philosophical accounts of function are compatible with her track record.

  **1. Ruled Out: Classic Etiological Selected-Effect (SE)**
  *   *The Theory:* A trait has function F if F is the effect for which the trait was *originally* selected in the ancestral past (Millikan 1984, Neander 1991).
  *   *Why Dr. R rejects it:* Her verdict on the **whale pelvis** and **cormorant feathers**. On a Classic SE view, the whale pelvis *does* have a function (locomotion), because that is why the trait type originated. Similarly, cormorant feathers have the function of flight (their origin), even if they no longer fly. Dr. R says "No function" and "Not flight." She requires more than historical origin; she requires *current relevance*.

  **2. Ruled Out: Pure Causal Role (CR)**
  *   *The Theory:* A trait has function F if F is a causal contribution the trait makes to the capacity of a containing system (Cummins 1975).
  *   *Why Dr. R rejects it:* Her verdict on the **human chin** and **whale pelvis**. A CR theorist might argue the chin contributes to structural integrity or the pelvis anchors muscles, thus having a "role." Dr. R dismisses these as "byproducts" or vestigial. She is not interested in *what the trait does*; she is interested in *why the trait is there*.

  **3. The Survivors: Modern SE vs. Current Fitness Contribution**
  Dr. R's verdicts are perfectly consistent with two remaining principles that overlap in most standard cases but diverge on time and history.

  *   **Principle A: Modern Selected-Effect (MSE).** (Godfrey-Smith 1994). A trait has function F if F has contributed to the *recent* survival and reproduction of the trait's bearers, such that F explains the trait's *current prevalence* in the population.
      *   *Key Constraint:* Requires a **history of differential reproduction**.
  *   **Principle B: Current Fitness Contribution (CFC).** (A propensity/forward-looking view). A trait has function F if F *currently* confers a survival or reproductive advantage to the bearer, regardless of whether selection has acted on it yet.
      *   *Key Constraint:* Requires **current utility**, but not necessarily a history of selection.

  **Why both fit her past data:** In all her past examples (Heart, Beta-lactamase, Cormorant Insulation), the traits that have functions are *both* currently useful *and* currently maintained by selection. The traits that lack functions (Pelvis, Chin, Pseudogene) are *neither* currently useful *nor* maintained by selection. Her past data does not distinguish between "Useful because Selected" (MSE) and "Selected because Useful" (CFC).

