  ### Part 3: The Best Discriminating Case

  If you only get to press her on one case, choose **Case 4 (The Lizard Toe Pads).**

  **Why Case 4 is superior to Case 1 and 2:**
  *   **Vs. Case 1 (Mouse):** Case 1 involves a *single individual*. Dr. R could dismiss this on the grounds that "function" applies to trait *types* in populations, not tokens in individuals. That's a metaphysical dodge that avoids the core SE vs. CFC debate. Case 4 involves a *population* with an established trait type, isolating the variable of *selection history* without the noise of "is this a trait type yet?"
  *   **Vs. Case 2 (Mosquito):** Case 2 is a strong contender (the Hitchhiker problem). However, her "Chin" ruling makes her verdict on Case 2 highly predictable (she will say No). Case 4 is more intuitive for a field biologist. It forces her to decide if "current survival value" is enough, or if she needs the "stamp" of natural selection.

  **Why Case 4 discriminates:**
  It creates a scenario where **Current Utility is High** (they aren't dying from falls) but **Selection History is Zero** (no reproduction yet).
  *   If she says **"Yes, it has a function,"** she is a **CFC** theorist (Current Utility is sufficient).
  *   If she says **"No, it's just beneficial,"** she is a **Modern SE** theorist (Selection History is necessary).

  Given her strictness on the Whale Pelvis (past history isn't enough) and Cormorant (past function doesn't count), my money is on her saying **No**. She views function as a *historical relation*, not a *dispositional property*.

