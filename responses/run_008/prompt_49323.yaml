answer: |-
  You are correct to feel that the "X is not a constant" explanation is the undergraduate-level resolution. It identifies the algebraic error but doesn't explain the *probabilistic* mechanics of why conditioning on an observation changes the EV, nor does it handle the cases where the conditional EV is genuinely positive everywhere.

  Since you are familiar with LW-style decision theory, I will skip the intro-level hand-waving and go straight to the measure-theoretic and Bayesian mechanics.

  ### 1. The Conditional Mechanics (Bayes on the Prior)

  You asked for the actual mechanics of the conditional-on-observed-value picture. Let $S$ be the random variable for the smaller amount. The pair of envelopes contains $(S, 2S)$. You pick one at random and observe amount $A$.

  There are two hypotheses:
  1.  **Small ($H_s$):** You hold the smaller envelope. $S = A$.
  2.  **Large ($H_l$):** You hold the larger envelope. $2S = A \implies S = A/2$.

  By Bayes' theorem, the posterior odds depend entirely on the prior density/mass function of $S$, denoted $p(s)$. Assuming a uniform prior over which envelope you picked (50/50):

  $$
  \frac{P(H_s | A)}{P(H_l | A)} = \frac{P(A | H_s) P(H_s)}{P(A | H_l) P(H_l)} = \frac{p(A)}{p(A/2)}
  $$

  The expected gain from switching, conditional on observing $A$, is:

  $$
  E[\text{Gain} | A] = P(H_s | A) \cdot (+A) + P(H_l | A) \cdot (-A/2)
  $$

  Substituting the posteriors (normalized by $Z = p(A) + p(A/2)$):

  $$
  E[\text{Gain} | A] = \frac{p(A)}{Z} A - \frac{p(A/2)}{Z} \frac{A}{2} = \frac{A}{Z} \left( p(A) - \frac{1}{2} p(A/2) \right)
  $$

  **The Switch Condition:**
  You should switch if and only if $p(A) > \frac{1}{2} p(A/2)$, or equivalently:
  $$
  \frac{p(A)}{p(A/2)} > \frac{1}{2}
  $$

  **Intuition:**
  This ratio is the local decay rate of your prior.
  *   If your prior decays **slowly** (e.g., $p(x) \propto 1/x$), then $p(A) \approx p(A/2)$. The ratio is $\approx 1$, which is $> 1/2$. You switch.
  *   If your prior decays **quickly** (e.g., $p(x) \propto 1/x^3$), then $p(A) \ll p(A/2)$. The ratio is small. You stay.

  **The Flip Point:**
  For most proper priors (where $\sum p(s) = 1$), the probability mass must eventually drop off faster than $1/s$. There will be a threshold $A^*$ such that for $A < A^*$, the prior is flat enough to favor switching, and for $A > A^*$, the prior drops off enough to favor staying.
  *   **Small $A$:** Evidence favors "I have the small one" (because large amounts are rare a priori).
  *   **Large $A$:** Evidence favors "I have the large one" (because if $A$ were the small one, $2A$ would be in the realm of extremely improbable values).

  **Are there priors where observing never helps?**
  Yes. If $p(A) \le \frac{1}{2} p(A/2)$ for all $A$, then $E[\text{Gain}|A] \le 0$ everywhere. This requires the prior to concentrate heavily on small numbers (e.g., $p(2^k) \propto (1/4)^k$). In this case, symmetry is preserved locally: you never switch, and the ex-ante EV of switching is 0.

  ---

  ### 2. The "Always Switch" Distributions (Proper Priors, Infinite Mean)

  This is the crux of your second question. Can we construct a **proper prior** (sums to 1) where $E[\text{Gain}|A] > 0$ for **all** $A$?

  From the condition above, we need $p(A) > \frac{1}{2} p(A/2)$ for all $A$.
  Let's discretize to powers of 2 for simplicity: $S \in \{2^0, 2^1, 2^2, \dots\}$. Let $p_k = P(S=2^k)$.
  The condition is $p_k > \frac{1}{2} p_{k-1}$.

  Consider the prior $p_k = C \cdot (3/4)^k$.
  1.  **Is it proper?** $\sum_{k=0}^\infty (3/4)^k = 4$. Yes, it normalizes.
  2.  **Does it always favor switching?**
      $$ \frac{p_k}{p_{k-1}} = \frac{3}{4} > \frac{1}{2} $$
      Yes. For *every* observed amount $A=2^k$, the conditional EV of switching is positive.

  **So, is this a money pump?**
  If you switch, you gain positive EV. If you switch back, you observe a new amount $A'$, and the logic says switch again. You oscillate forever, accumulating infinite expected gain?

  **No.** This is where the "Infinite Mean" disease enters.
  Calculate the expected amount of money in the smaller envelope $S$:
  $$ E[S] = \sum_{k=0}^\infty 2^k \cdot C \left(\frac{3}{4}\right)^k = C \sum_{k=0}^\infty \left(\frac{3}{2}\right)^k = \infty $$

  The expected value of the money in the envelopes is **infinite**.

  **The Mathematical Failure Mode:**
  The paradox arises from the failure of **Fubini's Theorem** (or dominated convergence).
  The unconditional expected gain is:
  $$ E[\text{Gain}] = \sum_A P(A) E[\text{Gain} | A] $$
  We established that every term in this sum is positive. So the sum should be positive.
  However, by symmetry, $E[\text{Gain}]$ must be 0.

  The resolution is that the double sum over the joint space of (Pair, Choice) is **not absolutely convergent**.
  $$ \sum_{\text{pairs}} \sum_{\text{choices}} \text{Gain} \neq \sum_{\text{choices}} \sum_{\text{pairs}} \text{Gain} $$
  When expectations are infinite, you can reorder terms to get any answer you like. The "Always Switch" conclusion is locally valid (conditional on $A$) but globally incoherent because the "average" over all $A$ does not exist.

  **Is it a Decision Theory Disaster?**
  It is not a money pump in the physical sense. A money pump requires a finite sequence of transactions that leaves you strictly worse off (or the house strictly better off) with probability 1. Here, while the *expectation* is positive, the probability of realizing a large gain diminishes fast enough that the integral diverges. You cannot iterate this infinitely in a lifetime. It is a pathology of the expectation operator, not a vulnerability in a rational agent with finite resources.

  ---

  ### 3. Infinite Expectations & Decision Theory Patches

  You asked about the Broome-style variants and the connection to St. Petersburg.

  **The Connection:**
  Yes, this is the same underlying disease as St. Petersburg.
  *   **St. Petersburg:** A single gamble with infinite EV.
  *   **Two Envelope (Infinite Prior):** A choice between two gambles, both with infinite EV, where the *difference* between them has undefined expectation (conditionally positive, unconditionally zero).

  In both cases, the Expected Utility (EU) function maps acts to $[0, \infty]$. When multiple acts map to $\infty$, EU loses its ability to rank them. In the Two Envelope case, it gets worse: conditional updating suggests a strict preference cycle (Switch > Stay, then Stay > Switch after observing new value), while ex-ante symmetry suggests indifference.

  **Is EU Broken?**
  EU is not "broken," but its domain of applicability is restricted to acts with **finite expectations** (or at least, expectations that are well-defined in the extended reals without conditional contradictions).
  When $E[U] = \infty$, the axiom of **Continuity** (or sometimes **Independence**) in the Von Neumann-Morgenstern derivation tends to fail or become vacuous.

  **The Patches:**
  If you had to patch your decision theory for exactly one of these, the patch is effectively the same for both.

  1.  **Bounded Utility (The Savage Patch):**
      Assert that utility functions must be bounded. There is a maximum amount of value you can possibly extract from the world.
      *   *Effect:* This forces $E[U]$ to be finite for all acts.
      *   *Two Envelope:* If utility is bounded, $p_k$ must decay fast enough to make $\sum U(2^k) p_k$ converge. This forces the prior to decay fast enough that the "Always Switch" condition ($p_k > 0.5 p_{k-1}$) eventually fails. The flip point $A^*$ reappears.
      *   *St. Petersburg:* The infinite payout is capped at the utility bound, rendering the EV finite.

  2.  **Relative Expectations / Dominance (The Arntzenius/Elga Patch):**
      If expectations are infinite, do not compare $E[U(A)]$ vs $E[U(B)]$. Instead, compare $E[U(A) - U(B)]$.
      *   *Two Envelope:* $E[\text{Switch} - \text{Stay}] = 0$ by symmetry. The conditional positive expectations are ignored because the integral of the difference converges to 0 (if treated carefully) or is undefined.
      *   *Problem:* This doesn't solve St. Petersburg (where there's no second act to compare to).

  3.  **Accept Incompleteness:**
      Admit that rational preference is a partial order, not a total order. If two acts have infinite expectation, they may be **incomparable**.
      *   *Two Envelope:* Switching and Staying are incomparable ex-ante. The conditional preference is recognized as a local artifact that does not integrate to a global preference.

  **Recommendation:**
  For a LW-style rationalist, **Bounded Utility** is the most robust patch. It solves St. Petersburg, Two Envelope, and Pascal's Mugging simultaneously. It aligns with the physical reality that no agent can process or utilize infinite resources.

  ### Summary of the "Clean Story" Breakdown

  1.  **Finite Mean Prior:** The "X is not constant" story holds. Observing $A$ gives information. There is a flip-point $A^*$. Ex-ante EV of switching is 0.
  2.  **Proper Prior, Infinite Mean:** The "X is not constant" story breaks. Observing $A$ *always* favors switching. Ex-ante EV is undefined (0 vs $\infty$ conflict). This is a Fubini failure, not a logic error.
  3.  **Decision Theory:** The failure mode is divergent integrals. The patch is Bounded Utility, which restores the "Finite Mean" behavior and eliminates the paradoxes by forcing the prior to decay sufficiently fast at high values.

  The "Always Switch" result is mathematically legitimate within the framework of unbounded expectations, but it is decision-theoretically inert because you cannot cash out an infinite expectation. It is a curiosity of analysis, not a guide to action.
