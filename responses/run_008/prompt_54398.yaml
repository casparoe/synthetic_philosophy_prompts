  The form: exactly five numbered quatrains, plain quatrains, no fixed meter or rhyme required, and each stanza does one specific job — (1) the lone voter, barely better than chance and painfully aware of it; (2) independence, each error a private accident that no one else shares; (3) the compounding, how those tiny edges multiply across the electorate; (4) the crowd's verdict closing in on the truth; (5) the turn — competence a hair *below* half, or everyone reading the same biased paper so their errors move together, and the very same machinery now drives you toward confident, unanimous error. The fifth stanza should land the point that the theorem is a knife that cuts both ways, not a hymn to crowds. Someone who teaches this should nod along, and my general readers should still feel it in their gut. American English, keep it under 25 lines or so.
