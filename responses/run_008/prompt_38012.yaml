      *Re-evaluating Move 1:* Is it fair to call it "Partially Right"? The theorem *does* say what she says it says. She just assumes the conditions are met. I'll call it "Conditionally Right" or "Partially Right". Let's go with "Partially Right".
      *Re-evaluating Move 4:* Marcus says "majority is no better informed than the median member anyway". This is technically true under high correlation (the group acts as one). But "so we should let whichever engineer is strongest... decide alone" assumes we can identify that engineer and that they aren't subject to the same bias. I'll stick with "Partially Right".

      *Missing:* One big thing is that architecture reviews are often about *finding flaws* (negative selection) rather than binary truth. CJT is about binary truth. If the goal is "find the bug," a single sharp eye might be better than 11 nodding heads. But if the goal is "is this safe," majority helps. I should mention the nature of the task.

