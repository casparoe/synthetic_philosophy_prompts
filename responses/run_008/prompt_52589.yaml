answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board (REB) Members
  **FROM:** Chair, Research Ethics Board
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Decision Consistency and Procedural Framework

  **1. Context and Purpose**

  As you know, our board is currently managing a formal complaint regarding inconsistent adjudication of two nearly identical deception studies last spring. This incident highlights a systemic issue: over eight years, our case-by-case deliberations have resulted in decision drift. We face a tension between two legitimate ethical demands: the demand for *consistency* (treating like cases alike) and the demand for *contextual judgment* (responding to the moral nuance of specific situations).

  Two proposals have been advanced to resolve this: (1) codifying precedents into a binding decision procedure, or (2) rejecting codification in favor of enhanced deliberation. This memo outlines my recommendation for a third path: a **Presumptive Framework with Mandatory Justification.**

  **2. Recommendation: A Qualified Presumptive Framework**

  I recommend that we **reject the proposal for a binding decision code** and instead adopt a **Presumptive Framework.**

  Under this model, we will catalog our past precedents into guidelines that establish *rebuttable presumptions* rather than binding rules. For example, if a protocol matches the features of a previously approved deception study (same population, same debriefing efficacy, same risk level), there is a strong presumption of approval. However, this presumption can be overridden if the board identifies a morally relevant difference in the specific context that the code does not capture.

  **3. Rationale**

  **The Case for Consistency (Engaging the Codification Proposal)**
  The strongest argument in favor of the binding code is that consistency is a prerequisite for procedural justice. Researchers are subject to regulatory burdens that can stifle inquiry; they deserve to know that the rules do not change depending on which panel reviews their file. The complaint we are currently facing demonstrates that inconsistency damages the legitimacy of the board and exposes the university to liability. The proponent of the code is correct that without structural constraints, "judgment" can become a euphemism for "bias" or "mood." We cannot rely solely on the virtue of reviewers to ensure fairness.

  **The Limit of Codification**
  However, we must reject the *binding* nature of the proposed code because it misunderstands the ontology of ethical reasoning. As the opposing member noted, moral features are not atomistic; their weight depends on the configuration of the whole case. A binding rule regarding "deception duration," for instance, might mandate approval for a study that is technically compliant but practically coercive due to a specific power dynamic not enumerated in the code. If we adopt a binding algorithm, we risk absolving reviewers of moral responsibility, leading to "ethical blindness" where the board approves harmful research simply because it followed the procedure. We cannot outsource our moral agency to a checklist.

  **The Presumptive Middle Ground**
  The Presumptive Framework resolves this by institutionalizing consistency without removing judgment. It shifts the burden of proof: if a new protocol aligns with past approved precedents, the default is approval. If a reviewer wishes to deviate from that precedent, they must articulate *why* the contextual differences warrant a different outcome. This ensures that inconsistency is not accidental, but reasoned and documented.

  **4. Immediate Action Plan: Handling the Next Borderline Protocol**

  We cannot wait for the full framework to be finalized to address the pending docket. Effective immediately, until the new framework is ratified at our next meeting, reviewers must adhere to the following **Interim Consistency Protocol** for any borderline or deception-related study:

  1.  **Pre-Review Search:** Before rendering a decision, the primary reviewer must search the REB database for the two deception studies from last spring (Ref: [Insert ID Numbers]) and any other precedent involving similar cover stories.
  2.  **Mandatory Divergence Statement:** If the recommended decision (Approve/Modify/Reject) differs from the precedent set by a factually similar prior study, the reviewer must attach a "Divergence Statement" to their evaluation. This statement must explicitly identify the morally relevant feature that distinguishes the current case from the precedent.
  3.  **Elevation to Full Board:** Any protocol where the primary reviewer identifies a conflict with past precedent, or where the "Divergence Statement" is required, cannot be processed via delegated review. It must be flagged for discussion and vote at the next full board meeting.
  4.  **Documentation:** All minutes for these cases must record the specific precedent relied upon and the rationale for following or departing from it.

  **5. Next Steps**

  At our next meeting, we will vote on adopting the Presumptive Framework permanently. I will circulate a draft matrix of our current precedents categorized by risk and deception level prior to that meeting.

  We must demonstrate to the complaining investigator, and to ourselves, that we can be both consistent and morally responsive. This approach secures the fairness of a rule-based system while preserving the wisdom of a judgment-based one.

  Thank you for your continued diligence.

  **[Signature]**

  Chair, Research Ethics Board
