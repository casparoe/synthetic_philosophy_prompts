  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Research Ethics Board (REB) at a mid-sized university.
      *   **Problem:** Inconsistency in decisions over 8 years (drift), highlighted by two identical deception studies getting opposite verdicts. An investigator has filed a formal complaint.
      *   **Proposed Solution 1 (Codification):** Create a binding decision procedure/code with rules and exceptions for every morally relevant feature. Goal: Consistency, predictability.
      *   **Proposed Solution 2 (Deliberation):** Reject the code. Moral judgment is holistic/contextual. Codes will fail in edge cases. Solution: Better deliberation/training.
      *   **Task:** Draft a memo to the board.
      *   **Requirements:**
          *   Take a position (Adopt, Reject, or Qualified Version).
          *   Argue in actionable terms.
          *   Engage the strongest consideration of the losing side (steel-manning).
          *   Specify concretely what reviewers should do with the *next* borderline protocol (immediate action).
          *   Tone: Professional, authoritative yet collaborative, ethical, administrative.

  2.  **Determine the Position:**
      *   *Option A (Full Codification):* Too rigid. Ethics isn't algorithmic. Likely to fail in novel situations. Ignores the "moral judgment" objection.
      *   *Option B (Pure Deliberation):* Too vague. Doesn't solve the consistency problem that led to the complaint. Risks future drift.
      *   *Option C (Qualified Version/Hybrid):* Best fit. Acknowledges the need for consistency (to address the complaint and fairness) but respects the limits of rule-based ethics. This allows for "presumptive rules" rather than "binding algorithms." It balances administrative justice with moral nuance.
      *   *Decision:* Adopt a qualified version (Guidelines/Presumptions rather than Binding Code).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the crisis (the complaint, the inconsistency). Validate the concern. State the purpose of the memo.
      *   **The Core Conflict:** Briefly summarize the two positions (Codification vs. Judgment).
      *   **The Recommendation (The Position):** Propose a "Presumptive Framework" rather than a "Binding Code."
      *   **Argument for the Position:**
          *   *Why not a binding code?* Address the "moral judgment" objection seriously. Rules can't cover every context. Rigid rules lead to absurd outcomes (the "license a decision we can all see is wrong" point).
          *   *Why not just deliberation?* Address the "consistency/fairness" objection. Researchers need predictability. Drift undermines legitimacy. The complaint shows the cost of pure discretion.
          *   *The Middle Ground:* Guidelines create a *rebuttable presumption*. If a study fits the pattern, approval is expected *unless* there is a compelling contextual reason otherwise. This ensures consistency without removing judgment.
      *   **Engaging the Losing Side (Steel-manning):**
          *   If recommending the Hybrid, I need to acknowledge the Codification proponent's valid point (fairness requires consistency) *and* the Deliberation proponent's valid point (ethics is contextual).
          *   *Actually, the prompt asks to engage the strongest consideration on the **losing side**.* If I recommend the Hybrid, the "losing side" is arguably the Hard Codification side (since I'm rejecting binding rules) OR the Pure Deliberation side (since I'm introducing structure).
          *   *Refinement:* Let's frame the recommendation as rejecting the *Binding* Code in favor of *Guidelines*. So the "losing side" is the Hard Codification proposal. I must acknowledge why they are right (consistency is justice) but explain why their specific mechanism fails.
          *   *Alternative:* Frame it as rejecting Pure Deliberation. But the Hybrid leans closer to Deliberation with structure.
          *   *Best Approach:* The recommendation is the *Qualified Version*. The "losing side" in a binary choice is usually the extreme. Let's treat the *Binding Code* as the primary alternative being rejected in favor of the Qualified Version. I will validate their demand for consistency but show why the *mechanism* of binding rules is the flaw.
      *   **Concrete Action Plan (The "Next Protocol"):** What do reviewers do *tomorrow*?
          *   Don't wait for the full framework to be written.
          *   Use a "Consistency Check" step.
          *   Flag borderline cases for full board review rather than delegated review.
          *   Document reasoning explicitly against past precedents.
      *   **Closing:** Call to action for the next meeting.

  4.  **Refining the Tone and Content:**
      *   *Tone:* Needs to be diplomatic. I am the Chair, but I lead peers. Avoid sounding dictatorial.
      *   *Ethical Language:* Use terms like "procedural justice," "moral residue," "rebuttable presumption," "contextual nuance."
      *   *Addressing the Complaint:* Acknowledge the investigator's complaint without admitting legal liability in the memo. Focus on internal process improvement.
