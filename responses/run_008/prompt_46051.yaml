answer: |-
  You have identified two distinct logical maneuvers that often get tangled together in these debates. You are correct that there is no single, dictionary-standardized term for either specific mechanism, though they sit under broader umbrellas in historiography and ethics.

  If you want to win this argument, do not get bogged down in searching for a "gotcha" label. Instead, use the precise conceptual carving I outline below. These are the terms that best capture the *mechanism* of the error, which allows you to explain *why* the reasoning fails rather than just naming it.

  Here is the carving I recommend you use.

  ### 1. The First Move: "Normative Baseline Shifting"
  **The Concept:**
  Your brother-in-law is using a variation of the **Contextualist Defense**, but he is committing a specific error within it. In historiography, the debate is usually between *Presentism* (judging the past by modern values) and *Contextualism* (judging the past by its own values).

  However, the "Contextualist Defense" contains a hidden switch.
  *   **Baseline A (The Universal Claim):** "Everyone believed X." (This claims there was *no* moral alternative available).
  *   **Baseline B (The Average Claim):** "Most people believed X." (This admits alternatives existed, but argues conformity excuses the action).

  When you point out that abolitionists existed (Baseline A is false), your brother-in-law silently switches to Baseline B ("Okay, sure, but he wasn't unique"). This is **Normative Baseline Shifting**. He is shifting the goalposts from "moral necessity" (he couldn't have known better) to "moral conformity" (he didn't do worse than his neighbors).

  **Why this label?**
  "Presentism" is the term he will throw at *you*. It accuses you of imposing modern standards. By calling his move "Normative Baseline Shifting," you reframe the issue. It's not about *your* standards vs. *his* standards; it's about *his* inconsistency regarding *their* standards.

  **The Edge:**
  *   **Valid Contextualism:** Explaining *why* someone held a view based on the information available to them (e.g., a medieval doctor using leeches).
  *   **Normative Baseline Shifting:** Excusing a view when moral dissent was *available* and *articulate* (e.g., Jefferson ignoring the arguments of Quaker abolitionists).
  *   **The Winning Point:** If the defense relies on Baseline B ("everyone did it"), then the figure is morally average. If they are morally average, they do not deserve moral *praise* (statues, holidays). You cannot use "he was average" to excuse his sins while using "he was great" to justify his monuments.

  ### 2. The Second Move: "Metonymic Blame" (or "The Representative Agent Fallacy")
  **The Concept:**
  This is the mirror image you noticed. History is a system of distributed actions, but memory is a system of named symbols. When we argue about Jefferson, we are using him as a **metonym** (a part standing in for the whole) for the Virginia slaveholding class.

  Your brother-in-law treats Jefferson as a **Unique Agent** when assigning blame (focusing entirely on his specific choices) but treats him as a **Representative Sample** when assigning exoneration ("he was just a man of his time").

  There isn't a perfect standard term for this, but in sociology and memory studies, this is often discussed under **Collective Responsibility vs. Individual Agency**. The specific fallacy is treating a **Systemic Sin** as an **Individual Failing** only when it suits the narrative.

  **Why this label?**
  "Metonymy" is a literary term, but it applies perfectly here. Jefferson *stands in* for the Founding Fathers. The error is failing to acknowledge that substitution. If he is just a substitute for the era, then blaming him exclusively is unfair (it lets the others off). If he is an individual agent, then the "everyone did it" defense is irrelevant.

  **The Edge:**
  *   **Valid Individual Blame:** When a person had the power to change the system and actively chose to reinforce it (Jefferson had the power to manumit slaves; he chose not to).
  *   **Metonymic Blame Error:** When we blame the figure for the *existence* of the system rather than their *maintenance* of it.
  *   **The Winning Point:** The "everyone did it" defense actually proves your point. If "everyone did it," then slavery was a *collective, structural crime*. By focusing the debate solely on Jefferson, your brother-in-law is accidentally protecting the *system* by turning it into a *personality contest*. If Jefferson is the problem, then removing Jefferson solves it. If the *class* is the problem, then Jefferson is just the symptom.

  ### How to Deploy This in the Argument

  Do not start by defining terms. Start by exposing the contradiction between the two moves. Here is the script I recommend:

  **Step 1: Lock the Baseline.**
  > "You're using two different defenses. Sometimes you say 'he couldn't have known better' (Universal Baseline), and sometimes you say 'he wasn't worse than anyone else' (Average Baseline). We know the first one is false because abolitionists existed. So let's agree on the second one: He was morally average for his class."

  **Step 2: Apply the Metonymic Trap.**
  > "If he was morally average, then he is just a representative sample of the slaveholding class. But we don't have statues of the average class. We have statues of him because he is supposed to be *exceptional*."

  **Step 3: The Fork.**
  > "So you have to pick one. Either he was **exceptional**, in which case he had the capacity to rise above the morals of his time and failed (so we judge him harshly). Or he was **average**, in which case the 'everyone did it' defense works, but he doesn't deserve the honor of a statue because he wasn't special. You can't claim he was special enough to represent the nation but average enough to be excused for its sins."

  ### Summary of Terms for Your Toolkit

  1.  **Normative Baseline Shifting:** The rhetorical switch from "no one knew better" to "most people did worse." Use this to dismantle the "standards of the time" claim.
  2.  **The Great Man Paradox:** The contradiction of claiming a figure is significant enough to shape history (Great Man Theory) but insignificant enough to be bound by its prejudices (Contextualism).
  3.  **Metonymic Blame:** The error of loading collective, structural guilt onto a single named individual while letting the anonymous structure off the hook.

  **Why this carving is right:**
  Most people argue about *whether* we should judge the past. You are arguing about *how* the defense is constructed. By focusing on the **inconsistency** between the excuse (he was average) and the honor (he was exceptional), you bypass the "Presentism" trap entirely. You aren't judging him by 2024 standards; you are judging him by the internal logic of your brother-in-law's own defense.

  That is the strongest position you can take. It forces him to defend the logic, not the history.
