  High.
  Some feast upon the summit where the air is thin and wealth accumulates like snow upon the ridge.
  The many wait.
  Below.

  To bring them down improves no single life.
  The sum is less, the gap is closed.
  A perfect plane of misery achieved.
  What value lies in making all equally poor?

  She says it is not sums that matter most.
  It is the way we stand and look.
  No bowing heads, no masters in the house.
  We meet as peers upon the common ground.

  The old hierarchy dissolves into the mist.
  There is no gain in bread or gold or grain.
  Yet no one looks upon another less.
  The silence holds a dignity of sorts.

  We stand alike upon the barren floor.
  No one is raised and no one is brought low.
  The view is flat and stretches everywhere.
  We lose the height but keep the shared regard.
