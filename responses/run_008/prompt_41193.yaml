answer: |-
  This puzzle strikes at the heart of legal philosophy: the gap between a statute's stated ontology (what kind of person the law says you are) and its administrative reality (how the state actually treats you). To untangle this, we must reconstruct the implicit theories of agency, consent, and labour underpinning the three dominant regimes.

  ### The Nordic Model: Asymmetric Agency
  **Strict Philosophical Requirement:** The Nordic model (Sweden, Norway, Iceland, etc.) strictly requires that the *transaction* of sex for money is inherently exploitative, such that the buyer's consent to purchase is morally and legally invalid, while the seller's consent to sell is deemed compromised by structural coercion (patriarchy, poverty, trafficking). It presupposes a **fragmented agency**: the seller possesses enough agency to be a legal subject (capable of being housed, migrated, or taxed) but not enough to validate the commercial sex contract criminally.

  **Underdetermination:** The model is underdetermined regarding the seller's civil status. It mandates non-criminalisation of the seller but does not strictly require positive welfare support, housing security, or immigration amnesty. Consequently, it sits comfortably with rival theories: a radical feminist theory (women are victims of patriarchy) and a paternalistic conservative theory (prostitution is a moral nuisance that should be displaced).

  **The Tension:** You identify the core friction: if the seller is a victim lacking meaningful consent, why do administrative mechanisms (housing law, immigration control) treat her as an accountable adult? The reconstruction suggests the model presupposes **conditional victimhood**. She is a victim *vis-à-vis* the buyer, but a responsible citizen *vis-à-vis* the state. This creates a philosophical inconsistency. If her consent is nullified because she is coerced by circumstance, those same circumstances (need for housing, need for residency) should shield her from administrative penalty. By allowing eviction or deportation, the state implicitly reaffirms the very agency it claims is compromised. It treats her as a victim when punishing the man, but as an agent when punishing her living conditions.

  ### The German/Dutch Model: Regulated Commodification
  **Strict Philosophical Requirement:** This regime (legalisation/licensing) presupposes that sex work is a **commodity that can be sanitised**. It requires that the harm inherent in the trade is not intrinsic to the act itself but extrinsic (health, safety, tax evasion), and therefore manageable through state oversight. It presupposes **sufficient agency** to enter a contract, provided the state verifies the conditions.

  **Underdetermination:** It is underdetermined regarding the moral status of the work. It sits comfortably with utilitarianism (reduce crime/STIs) and libertarianism (freedom of contract), without necessarily endorsing sex work as socially desirable. It does not require that sex work be 'good' labour, only that it be 'orderly' business.

  **The Tension:** The friction here is between **regulation and exclusion**. By creating a licensed tier, the model presupposes that safety comes from visibility. However, in practice, it often creates a two-tier system where the most vulnerable (migrants, drug users) cannot meet licensing requirements and are pushed underground. The theory presupposes harm reduction; the practice often delivers harm containment for the privileged and heightened risk for the marginalised.

  ### The New Zealand Model: Labour Rights
  **Strict Philosophical Requirement:** Decriminalisation (New Zealand) presupposes that sex work is **labour like any other**. It strictly requires that the state remove criminal penalties entirely, treating the transaction under occupational health and safety law rather than penal or moral code. It presupposes **full agency**: the seller is a worker with rights, not a victim to be saved nor a business to be licensed.

  **Underdetermination:** It is underdetermined regarding social stigma. The law can remove criminal penalties, but it cannot mandate social acceptance. It sits comfortably with liberal feminism (choice) and labour movements (rights), but it does not guarantee that landlords or banks will treat sex workers equally in practice.

  **The Tension:** The friction is between **legal equality and social reality**. The theory presupposes that removing criminal law removes harm. However, if stigma persists, the 'worker' status is legally robust but socially fragile. Unlike the Nordic model, however, there is no internal contradiction in the state's treatment of agency; the state treats her as a worker consistently, even if society does not.

  ### Comparative Reconstruction
  *   **Nordic:** Presupposes **compromised consent**. The buyer is a perpetrator; the seller is a victim. *Inconsistency:* The state treats the victim as an administrative agent liable for housing/immigration compliance.
  *   **German/Dutch:** Presupposes **managed harm**. Sex work is a risky business requiring containment. *Inconsistency:* Regulation often excludes the most vulnerable, undermining the harm reduction goal.
  *   **New Zealand:** Presupposes **full labour agency**. Sex work is work. *Inconsistency:* Legal status does not automatically erase social stigma or economic precarity.

  ### Confidence and Uncertainty
  I am highly confident (90%) in the reconstruction of the New Zealand and German/Dutch models, as their legislative histories explicitly debate labour rights versus public order. I am moderately confident (75%) in the Nordic analysis regarding the *tension* between victimhood and administrative accountability.

  **Claim I am least sure about:** I am least sure whether the administrative harms faced by sellers in Nordic countries (eviction, deportation) are an incidental byproduct of bureaucratic inertia or an implicit, unstated presupposition of the model itself. It is unclear if the legislators intend for sellers to be 'protected' only from criminal law while remaining vulnerable to civil law, or if this is a failure of implementation rather than theory.

  ### Conclusion
  The Nordic model attempts to hold two contradictory theories of personhood simultaneously. To criminalise the buyer, it must assert the seller lacks the agency to consent meaningfully. To evict or deport the seller, it must assert she possesses the agency to comply with housing and immigration statutes. While legally distinct spheres, philosophically they rely on a single conception of the subject. You cannot be coerced enough to be exempt from criminal liability for a transaction, yet autonomous enough to be held responsible for the housing required to survive that transaction. The model claims to protect the vulnerable, but its operational logic treats them as nuisances when they become visible.

  Verdict: the Nordic model's presuppositions are inconsistent
