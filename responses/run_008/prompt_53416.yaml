answer: |-
  1. **The Dependency Structure**

  You cannot argue for eternalism until you have dismantled the intuition that "now" is a universal feature of the world. To do that, you must separate the psychology of time from the ontology of time before you introduce physics. If you start with Special Relativity, the lawyers will treat it as a measurement problem rather than an existence problem. If you start with metaphysics, the physics teacher will demand empirical grounding.

  Secure the concepts in this order:

  *   **First: The Indexicality of "Now."** You must establish that "now" functions like "here." Everyone agrees "here" doesn't mean only "here" exists. You need them to accept that "now" might be similar—a perspective-dependent label, not a boundary of existence. This must happen before any physics is introduced.
  *   **Second: The Relativity of Simultaneity.** You cannot formulate the argument against presentism without this. The audience must accept that two observers moving relative to each other will disagree on whether two distant events happened at the same time. This is the premise; eternalism is the conclusion.
  *   **Third: The Ontological Claim.** Only after the disagreement is established can you pose the dilemma: Either one observer is magically privileged (violating relativity), or both are right (entailing eternalism).
  *   **Fourth: The Nature of Change.** Once eternalism is on the table, the objection that "change is an illusion" will arise. You must have the block view secured before you can defend the reality of change within it (e.g., variation across time coordinates).
  *   **Fifth: Fatalism.** This is the emotional objection. It relies on the block view being understood first. Do not address this until the metaphysics are settled.

  2. **One Carrying Example**

  **The Choice:** The **Railway Embankment** (Einstein's original lightning thought experiment), framed explicitly as a dispute over *existence*, not just measurement.

  **Why this over the Loaf:** The loaf of bread implies a static object waiting to be cut by a knife (the "now"). This smuggles in a meta-time—the time in which the slicing happens. It suggests the block is waiting for us to arrive, which is confusing. The Railway example focuses on *observers in motion* defining their own slices. It makes the disagreement active rather than passive.

  **What it Must Have:**
  *   **Two Observers:** One on the platform, one on the train. Both are equally valid.
  *   **Two Events:** Lightning strikes at the front and back of the train.
  *   **The Disagreement:** The platform observer sees them as simultaneous; the train observer sees them as sequential.
  *   **The Ontological Stakes:** You must explicitly ask: "Did the second strike *exist* for the platform observer when the train observer says it hadn't happened yet?"

  **What it Must Lack:**
  *   **A "God's Eye" View:** Do not describe the scene from above in a way that suggests one observer is "really" right. The diagram must show two coordinate systems overlaid, neither privileged.
  *   **Signal Delay Confusion:** You must clarify that this is not about light travel time (which can be calculated out). This is about the definition of simultaneity itself. If you lose them on light delay, you lose the metaphysics.

  3. **A Misconception Map**

  Address these in the order they will naturally interrupt your flow, not in order of importance.

  *   **Misconception 1: "Presentism is Just Common Sense."**
      *   *When:* Minute 5 (Introduction).
      *   *The Move:* Concede it immediately. "Yes, presentism is the default setting of the human brain. But common sense also says the sun moves around the earth. We are here to see if physics forces us to upgrade our intuition." This disarms the lawyers who want to defend the "obvious."
  *   **Misconception 2: "Einstein Proved the Block Universe."**
      *   *When:* Minute 20 (After the Railway example).
      *   *The Move:* Distinguish *theorem* from *interpretation*. "Relativity proves simultaneity is relative. Eternalism is the best explanation for that fact, but it is not the only logical possibility. One could insist on a hidden privileged frame, but it would be undetectable. We are choosing the explanation that respects the symmetry of the physics."
  *   **Misconception 3: "Change is an Illusion."**
      *   *When:* Minute 35 (After defining the Block).
      *   *The Move:* Redefine change. "Change is not the coming into existence of events. Change is variation in properties across time coordinates. The apple is green at t1 and red at t2. Both exist, but they are different. That is real change."
  *   **Misconception 4: "This Means Fatalism."**
      *   *When:* Minute 40 (The emotional pushback).
      *   *The Move:* Separate *existence* from *causation*. "The future exists in the block, but it exists *as the result of your deliberations*. Your thinking is part of the block. If you didn't deliberate, the block would look different. Your actions are the causes that shape the block, not decorations on a fixed script."

  4. **A Verdict on the Andromeda-Style Example**

  **Verdict:** **Use it, but only as the climax.**

  The Railway example is local and safe; Andromeda is distant and vertiginous. For an argumentative audience, the stakes need to be high. The idea that walking toward a galaxy changes its "now" by weeks is the hook that makes the session memorable. However, it produces vertigo if not handled carefully.

  **Where it belongs:** Minute 30. Use it after the Railway example has secured the logic of relative simultaneity, but before you discuss fatalism. It serves as the "scaling up" of the consequence.

  **The Caveat:** You must explicitly state that this disagreement concerns **spacelike separated** events.
  *   *The Move:* "Because the galaxy is too far away for light to reach us yet, no signal can be sent. You cannot warn the Andromedans. This prevents paradoxes. The disagreement is about the *label* 'now,' not about causal influence."
  *   *Why:* The physics teacher will spot the signaling loophole immediately. If you don't close it, they will derail the session with causality violations. The lawyers will spot the legal liability of "changing the future." Shut both down by emphasizing the light cone boundary.

  5. **What to Openly Refuse to Cover**

  **Verdict:** **Name these exclusions aloud at the start (Minute 3).**

  For this specific audience, silence looks like ignorance. If you don't mention General Relativity or the Growing Block theory, the physics teacher will raise them at Minute 45, and you will lose control of the clock.

  **The Script:** "We are working in Special Relativity only. I am setting aside gravity and curved spacetime. I am also setting aside hybrid views like the 'Growing Block,' where the past exists but the future doesn't. We are looking at the stark choice between All-of-Time and Only-Now. If you know the other theories, hold them in reserve; we need to resolve this fundamental tension first."

  **Why it matters:** It frames the session as a focused seminar rather than a comprehensive survey. It gives the experts in the room a nod of respect while preventing them from expanding the scope beyond fifty minutes.

  6. **The Closing Check**

  You need a question that forces them to apply the indexicality of "now" without relying on the "loaf" imagery.

  **The Question:**
  "If 'now' is like 'here,' and you walk across the room, your 'here' changes. Does the place you left cease to exist? If you say 'no' for space, what forces you to say 'yes' for time?"

  **Why this works:**
  *   It bypasses the physics and tests the metaphysical intuition directly.
  *   It catches the slide back to flow. If they answer "Yes, the past disappears," they have rejected the core analogy.
  *   It requires them to articulate the distinction between *perspective* and *existence*.
  *   It is accessible to the lawyer (analogy-based) and the physicist (coordinate-based) alike.

  **Success Criterion:** You want them to realize that denying the existence of the past because it isn't "now" is as arbitrary as denying the existence of the kitchen because you are in the living room. If they grasp that, they have grasped eternalism.
