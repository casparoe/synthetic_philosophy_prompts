answer: |-
  You have spotted something that many philosophy undergraduates miss, and your teacher is indeed using a sledgehammer where a scalpel is needed. Calling all of these "self-refuting" is like calling a mirror, a lie, a paradox, and a mistake all "wrong." They function differently.

  There is an established way to carve this up. It relies on distinguishing between **Semantics** (what the sentence means) and **Pragmatics** (what you are *doing* by saying it).

  Here is the map you are looking for, the specific terminology for each quadrant, and what it means for Descartes.

  ### 1. The Map of Self-Referential Statements

  We can categorize these based on two axes:
  1.  **Does the act of saying it change the truth value?** (Pragmatic vs. Semantic)
  2.  **What is the resulting status?** (False, True, Unassertable, or Paradoxical)

  #### A. Pragmatic Self-Refutation (Strict)
  *   **Your Example:** "I do not exist."
  *   **The Mechanism:** The *content* of the proposition contradicts the *preconditions* of the speech act. To assert a proposition, there must be an asserter.
  *   **The Status:** It is logically possible for the content to be true (you could cease to exist), but it is **necessarily false whenever asserted**.
  *   **Technical Term:** **Performative Contradiction** (specifically, *pragmatic self-refutation*).
  *   **Why it's distinct:** The sentence isn't inherently false (a note found on a corpse saying "I do not exist" could be true). It is only false *in the mouth of the speaker*.

  #### B. Performative Self-Verification
  *   **Your Example:** "I am speaking English out loud." (And Descartes' *Cogito*).
  *   **The Mechanism:** The successful performance of the speech act *constitutes* the truth of the content. You cannot say it without making it true.
  *   **The Status:** **Necessarily true whenever asserted.**
  *   **Technical Term:** **Self-verifying Statement** or **Performative Utterance** (in the sense of J.L. Austin). In epistemology, these are sometimes called **Incorrigible Propositions**.
  *   **Why it's distinct:** This is the mirror image of Category A. It doesn't poison itself; it inoculates itself.

  #### C. Pragmatic Incoherence (Moore's Paradox)
  *   **Your Example:** "It is raining, but I don't believe it is raining."
  *   **The Mechanism:** This is the trickiest one. The *content* is not contradictory. It is entirely possible for it to be raining while you are deluded about it. However, the *act of asserting* "It is raining" conventionally implies "I believe it is raining."
  *   **The Status:** **Contingently true/false, but Unassertable.**
  *   **Technical Term:** **Moore's Paradox** (named after G.E. Moore).
  *   **Why it's distinct:** Unlike Category A, the sentence *could* be true. Unlike Category B, saying it doesn't make it true. The contradiction is between your *words* and your *implied mental state*. It is a violation of the "norms of assertion."

  #### D. Semantic Paradox
  *   **Your Example:** "This sentence is false."
  *   **The Mechanism:** This has nothing to do with you saying it. It is about the logical structure of the sentence itself. It refers to its own truth value in a way that breaks the binary of True/False.
  *   **The Status:** **Truth-valueless (or both).**
  *   **Technical Term:** **The Liar Paradox** (a type of **Antinomy**).
  *   **Why it's distinct:** If a tree falls in the forest and writes "This sentence is false" in the dirt, it is still a paradox. It doesn't require a speaker. It is a bug in the system of logic/language itself, not a bug in the act of speaking.

  ---

  ### 2. The Edges Between the Groups

  You asked where the edges are. The primary fault line is between **Pragmatics** (A, B, C) and **Semantics** (D).

  *   **The Pragmatic Group (A, B, C):** These depend on a *context*. They need a speaker, a time, and an act of utterance. If you write them in a diary to be read after your death, "I do not exist" might become true. "I am speaking" becomes false.
  *   **The Semantic Group (D):** This is context-independent. It is a logical virus.

  The secondary fault line is between **Truth** and **Assertability**.
  *   **Category C (Moore's)** is the boundary case. It proves that "Truth" and "Assertability" are not the same thing. You can know something is true (e.g., via a brain scan showing you don't believe it's raining while you say it is) but you cannot *coherently assert it*.

  ### 3. Does this change what Descartes proves?

  This is your most profound question. If the *Cogito* ("I think, therefore I am") is just a **Performative Self-Verification** (Category B), does it prove a "Mind" or a "Soul" or a "Self"?

  Many philosophers argue **no**.

  If the *Cogito* is merely a self-verifying sentence, it functions like "I am speaking."
  *   When I say "I am speaking," I prove that *speaking is happening*.
  *   Do I prove that there is a permanent entity called "I" behind the speaking? Not necessarily. There could just be the event of speech.

  **The Critique:**
  In the 18th century, the physicist/philosopher **Georg Lichtenberg** criticized Descartes on exactly these grounds. He argued that Descartes jumped the gun.
  *   **Descartes:** "I think, therefore I am." (Implies a Thinker).
  *   **Lichtenberg:** "It thinks." (Like "It is raining").

  Lichtenberg suggested that all the *Cogito* actually proves is that *thinking is occurring*. To say "**I** think" smuggles in the existence of a substantial self before you've proven it. If the *Cogito* is just a linguistic trick (a self-verifying performative), it proves the existence of the *thought*, but not necessarily the *thinker*.

  **The Implication:**
  If you file the *Cogito* under **Performative Self-Verification**, you limit its power.
  1.  **It guarantees certainty:** You cannot be wrong that you are experiencing thought right now.
  2.  **It does not guarantee substance:** It doesn't prove you are a "mind" that persists from moment to moment. It only proves existence *at the instant of the thought*.
  3.  **It is solipsistic:** It proves *your* existence to *you*. It doesn't help you prove the external world exists (which was Descartes' next, much shakier, step).

  ### Summary for your Class

  If you want to push back on your teacher (politely), here is the vocabulary to use:

  1.  **"I don't exist"** is a **Performative Contradiction**. (False when said).
  2.  **"I am speaking"** is a **Self-Verifying Performative**. (True when said).
  3.  **"It's raining but I don't believe it"** is **Moore's Paradox**. (True-able, but Unassertable).
  4.  **"This sentence is false"** is a **Semantic Antinomy**. (Logically broken).

  **The Verdict on Descartes:**
  You can argue that recognizing the *Cogito* as a **Self-Verifying Performative** saves it from doubt (you can't doubt it while doing it), but it weakens its conclusion. It proves *existence as an event*, not necessarily *existence as a substance*. It proves "Thinking is happening," not necessarily "I am a Thing that thinks."

  Your intuition is spot on: the "shape of the move" matters more than the conclusion. Philosophy is often less about the answers and more about mapping the geometry of the questions. You're doing the latter.
