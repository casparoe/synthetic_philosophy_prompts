  Is there a name for this thing, or a whole map of it? so in philosophy class we did Descartes and the I think therefore I am thing, and what got me wasn't the conclusion so much as the shape of the move. like, if I try to say I don't exist, I can't be saying something true, because the saying already needs a me. the sentence kind of poisons itself. but then I started noticing that there's a whole bunch of sentences like this and they do NOT all work the same way:

  - if I say I don't exist, it's false whenever I say it, full stop.
  - if I say I am speaking English out loud, it becomes true sort of because I said it? like the saying of it makes it work.
  - if I say it's raining but I don't believe it's raining — that one can actually be true! I could be looking right at rain and be convinced it's a sprinkler. but saying it out loud is still somehow wrong, even though nothing in it contradicts.
  - and then there's this sentence is false, which my cousin brought up, and which is maybe a different beast entirely because it can't consistently be either.

  my teacher keeps calling all of these self-refuting but that feels like one word doing four jobs. it's raining but I don't believe it doesn't refute itself at all — it's just unsayable, or unassertable, whatever. and the English one doesn't defeat itself, it completes itself. so here's what I actually want: is there an established way to carve this up — sentences that are false whenever asserted, sentences that are true but assertable-and-false-ish to assert, sentences whose assertion makes them true, etc — and where exactly are the edges between the groups? like does the raining-and-don't-believe one belong with the cogito or not, since both involve saying something about yourself that you can't coherently combine with the act of saying it, but only one of them has to be false? and finally, if the cogito is just a member of one of these families (whichever one), does that change what it proves? my intuition is that a self-verifying sentence only proves something about the speaker, not anything big about minds or certainty, but I'm honestly not sure. I don't just want a term, I want the actual carving — what's the same, what's different, and where would you file the tricky cases.
