  been reading decision theory threads on and off for like 15 years, and I've finally written down where I actually stand so people can pick at it. heres the list:

  1. In Newcomb's problem, I one-box. obviously.
  2. In Parfit's hitchhiker, once the driver has already gotten me to the city safe, I pay him.
  3. One-shot prisoner's dilemma against a literal copy of me: cooperate.
  4. One-shot prisoner's dilemma against a stranger I've never met, but who I'm fairly confident reads the same blogs as me and would reason through the case exactly the way I do: defect. no reputation effects, no round two, nobody watching.
  5. In XOR blackmail, I don't pay. (setup as usual: the blackmailer only sends the letter at all if its simulation of me turns out to be someone who pays, and I can see that the whole "pay up or I talk" logic doesn't go anywhere good for me.)
  6. In counterfactual mugging, I pay. coin landed tails, I'm out $100 if I pay, and Omega would've given me $1000 in the heads branch iff it predicted I'd pay here.
  7. The meta-commitment tying it together: there's one right decision theory, it turns on how decision procedures correlate, and it has no business caring whether some other agent is "literaly me," or about when I happened to first think about a problem.

  go through these and tell me which pairs are actually in tension and which only look that way, ranked by severity rather than dumped in a list. for each real tension, say what has to give and what giving it up costs me elsewhere on the list. then tell me which single revision would clean up the most if I'm forced to make one. I honestly don't know where the bodies are buried here, so don't go easy on me.
