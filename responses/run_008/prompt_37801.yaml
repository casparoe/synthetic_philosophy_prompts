      *   **Goal:** Help the user settle what a theory is *for* before evaluating theories.

  2.  **Deconstruct the Candidate Requirements:**
      *   *Distinction from neighbors:* Essential. If a theory collapses self-deception into mere error or wishful thinking, it fails to capture the specific phenomenon.
      *   *Static Puzzle:* Traditionally central (Mele vs. Sartre etc.). Does the agent believe $p$ and $\neg p$? Most modern theories reject the literal contradiction. A theory needs to explain the *appearance* of contradiction without committing to irrationality that makes agency impossible.
      *   *Dynamic Puzzle:* How is the deception initiated? Intentionalists struggle here (how to intend to deceive oneself knowingly?). Deflationists dissolve it. A theory needs to explain the *process*.
      *   *Signature Texture:* Crucial. Selective evidence gathering, maintenance over time, motivational bias. This is the phenomenological data.
      *   *Experimental Consistency:* Important for naturalistic plausibility. Cannot contradict psychology, but shouldn't reduce philosophy to empirical findings alone.
      *   *External Flattery:* This touches on agency. Self-deception must be *self*-generated, not just passive acceptance.
      *   *Responsibility/Culpability:* This is the tricky one. If it's non-intentional (deflationary), can we blame the agent? If it's intentional, how? This might be the source of joint unsatisfiability.

  3.  **Evaluate Joint Unsatisfiability:**
