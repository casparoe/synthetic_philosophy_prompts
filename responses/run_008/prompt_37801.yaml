answer: |-
  It is a rare and valuable insight to realize that a field is stalled not because the answers are elusive, but because the question has not been properly framed, and your intuition that we must settle what a theory of self-deception is a theory for before evaluating the theories themselves is precisely the corrective this literature needs. You are right to suspect that many of the traditional demands placed on such a theory are not neutral desiderata but rather artifacts of specific camps smuggling their prejudices into the definition of the phenomenon, and if we are to clear the ground for your reading group, we need to separate the hard constraints of the phenomenon from the theoretical baggage carried by the intentionists and their critics. The most immediate candidate for rejection as a hard requirement is the demand that the theory must solve the static puzzle in its traditional form, meaning the requirement that the agent literally believe both p and not-p simultaneously. This is less a requirement of the phenomenon and more a relic of modeling self-deception too closely on interpersonal deception, and insisting on it forces any theory into attributing blatant irrationality that makes agency impossible. A better formulation of this requirement is that the theory must explain the appearance of contradiction without committing the agent to a logical impossibility, preserving the intuition that the self-deceived person is avoiding a truth they somewhere recognize without requiring them to hold explicit contradictory beliefs in the same respect at the same time. Similarly, the dynamic puzzle, which asks how one can intend to deceive oneself without knowing the truth one is hiding, should be treated as a problem for intentionalist theories specifically rather than a requirement for any adequate theory, since a deflationary account dissolves the puzzle by denying the intention exists in the first place. Therefore, the requirement here is not that the theory must explain how a conscious plan succeeds, but that it must explain how the process initiates and sustains itself without invoking a homunculus who knows the truth and hides it from itself.

  The requirement that the theory must distinguish self-deception from its nearest neighbors is non-negotiable and does the heaviest lifting in eliminating contenders, for if a theory cannot distinguish self-deception from ordinary error or mere wishful thinking, it has failed to carve out a unique subject matter. Ordinary error lacks the motivational component, and wishful thinking is often transient and passive, whereas self-deception involves a sustained resistance to evidence that would otherwise compel belief revision. This connects directly to your point about the signature texture of the phenomenon, specifically the maintenance of the belief over months through habits of attention rather than a one-off formation, which is a genuine requirement because it captures the active, albeit often unconscious, labor involved in staying deceived. A theory that treats self-deception as a single event rather than a sustained policy of evidence management will fail to capture why we treat the self-deceived colleague differently from someone who is merely mistaken. However, the requirement regarding consistency with experiments is negotiable in the sense that philosophy need not be reduced to psychology, though it must remain consistent with it; a theory cannot posit mental architectures that are empirically impossible, such as perfectly sealed modular partitions in a neurotypical brain, but it also should not treat current psychological models as the final word on the metaphysics of mind. The requirement to mark off self-deception from accepting engineered comforting stories is also essential, as it speaks to the locus of causation; if the belief is maintained solely by external manipulation without internal cooperation, it is exploitation or gullibility, not self-deception, so the theory must account for the agent's own contribution to the distortion.

  There is, however, a subset of requirements that appears jointly unsatisfiable, and this is likely where your reading group has been circling without landing. You mentioned the doubt about whether the agent must be responsible or culpable, and this tension arises when you combine the demand for moral responsibility with the demand for consistency with non-intentional psychological processes like motivated reasoning. If the theory explains self-deception as a fully non-intentional, mechanistic process of bias and dissonance reduction, it becomes difficult to hold the agent culpable in the same way we hold a liar culpable, yet if the theory insists on culpability, it often must reintroduce intentionality, which resurrects the dynamic puzzle. This unsatisfiability is indeed a result of the field trying to serve two masters: the moral intuition that self-deception is a vice we can blame, and the naturalistic intuition that it is a psychological mechanism we suffer. To move forward, you may need to treat responsibility as a downstream moral question rather than a definitional requirement, accepting that a theory can be adequate even if it suggests the self-deceived are more pathetic than wicked, or vice versa, but it cannot promise to be both fully mechanistic and fully culpable in the traditional sense without significant philosophical gymnastics. The single requirement that does the most work in eliminating contenders is the demand to distinguish the phenomenon from mere wishful thinking while accounting for the sustained maintenance of the belief, because this forces the theory to explain the active management of evidence rather than just the passive presence of bias.

  When you run the three pictures against this refined list, the intentionist line struggles immediately with the dynamic requirement, as it must explain how the deception plan is executed without triggering awareness, often relying on metaphorical divisions that risk becoming mythological. The divided-mind line handles the static puzzle well by locating the belief in different subsystems, but it often falters on the empirical consistency requirement, positing partitions that look too rigid compared to the fluidity shown in choice blindness and dissonance reduction experiments, and it risks collapsing into a metaphor that explains nothing about how the partition is enforced. The deflationary line succeeds best on empirical consistency and dissolves the dynamic puzzle, but it faces the hardest challenge on the distinction requirement, constantly risking the collapse of self-deception into ordinary motivated reasoning unless it can specify what extra ingredient turns bias into deception. Ultimately, for your colleague who catalogs evidence of marital trouble for friends while maintaining certainty for herself, the adequate theory must explain not just that she is biased, but that she is doing something to sustain that bias against the weight of her own catalogued evidence, and if the theory cannot explain the labor of that maintenance without invoking a ghost in the machine, it will remain as stuck as your reading group has been.
