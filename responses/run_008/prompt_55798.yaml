          *   *Epistemic Modesty Partisan (EMP):* Treats disagreement as substantial evidence, weights self as one among peers, distrusts inside views when they feel compelling (overconfidence bias).
      *   **Required Sections:**
          1.  Agreed Claims (Numbered, non-vacuous, specific candidates provided).
          2.  Disagreements Table (Specific cases: Doppelgänger, Track Record, Bootstrapping, Empirical Record).
          3.  Cruxes (Tests/arguments with specific predictions).
          4.  Verbal vs. Substantive Dispute Analysis.
      *   **Epistemic Requirement:** Distinguish settled math/empirics from live philosophical questions. Do not paper over unresolved disagreements in the "Agreed" section (flag wording choices if necessary).

  2.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint:* Must be signable by both. Cannot favor one side. Must address specific candidates (Aumann, Inside/Outside composition, Reference Class judgment).
