      *   *Row 4 (Empirical Record):*
          *   IVP: Markets/tournaments apply to well-specified short-horizon, not long-horizon/contested reference class.
          *   EMP: Record suggests systematic bias exists even in complex judgments; aggregation generally beats individual.
      *   *Formatting:* Needs to be a table or clear list. Let's use a clear structure with "Position A" and "Position B".

  4.  **Drafting Section 3: Cruxes:**
      *   *Constraint:* Identify tests/arguments/cases. Record specific predictions.
      *   *Crux 1: The Self-Undermining Argument.* Does universal deference destroy information?
          *   Test: Simulation of agents.
          *   Prediction: IVP says aggregate accuracy drops. EMP says it rises or stays stable.
      *   *Crux 2: Reference Class Selection.* Is it objective or subjective?
          *   Test: Blind selection of reference classes by third parties.
