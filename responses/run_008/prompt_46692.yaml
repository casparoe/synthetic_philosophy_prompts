answer: |-
  Here's the spec you asked for. I've tried to keep it loose enough for a train ride but tight enough to actually be useful when you're weighing up papers.

  The core problem with infinite ethics is that standard arithmetic breaks. When you sum a finite list of welfare scores, everything behaves. When you sum an infinite list, you run into divergent series, rearrangement paradoxes (Riemann series theorem), and cardinality issues. A good theory needs to navigate this without exploding.

  Below is the desiderata list, followed by the bad news about which ones can't coexist.

  ### The Desiderata List

  | # | Desideratum | The Motivating Case | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Decisiveness (Completeness)** | **The 'Infinity Plus One' Case:** If World A has infinite happy people, and World B has those same people *plus* one more happy person, the theory should say B is better. It shouldn't shrug and say 'undefined' or 'incomparable'. | **Non-negotiable** (for a practical ethics). If a theory can't rank clear improvements, it's paralysed. |
  | **2** | **Anonymity (Permutation Invariance)** | **The Shuffle Test:** If you swap the welfare levels of two people (or any finite number), the total value of the world shouldn't change. Locations and identities shouldn't matter, only the distribution of welfare. | **Camp Preference.** Strongly held by egalitarians and classic utilitarians. But often dropped by 'spatiotemporal' theories that need a fixed grid to sum over. |
  | **3** | **Strong Pareto** | **The 'No Losers' Case:** If at least one person is better off in World B than A, and no one is worse off, then B must be better than A. Even if the population is infinite. | **Non-negotiable.** This is the bedrock of welfare ethics. If you violate this, you aren't doing welfare aggregation anymore. |
  | **4** | **Finite Consistency** | **The Limit Check:** If you apply the theory to a finite population, it must yield the exact same results as standard utilitarianism (simple summation). It shouldn't go haywire just because the universe *could* have been infinite. | **Non-negotiable.** A theory that breaks known, solved cases is suspicious. |
  | **5** | **No Privileged Perspective** | **The 'View from Nowhere':** The theory shouldn't secretly rely on a specific coordinate system (e.g., 'start summing from the left') unless that coordinate system is physically real. You can't smuggle in a God's-eye index of people. | **Preference.** Measure-theoretic folks hate this; truncation/discounting folks often violate it to get answers. |
  | **6** | **Universal Contrast** | **The 'All Torture vs. All Bliss' Case:** (Your homemade case). A world where everyone suffers infinitely vs. a world where everyone is blissful infinitely. Even if there's a bijection between the populations, the theory *must* say Bliss is better than Torture. | **Non-negotiable.** If a theory ties these or says they are incomparable, it has failed the 'reductio' test. It's morally blind. |

  ---

  ### The Bad News: The Impossible Trinity

  You suspected that half of these pull against each other. You were right. In fact, it's worse than a hunch; there are formal impossibility theorems backing this up. You generally cannot satisfy **Anonymity**, **Strong Pareto**, and **Decisiveness** simultaneously in an infinite setting.

  Here are the specific tensions you need to watch out for when reading papers:

  **1. Anonymity vs. Strong Pareto (The Basu-Mitra Tension)**
  If you demand that shuffling people around changes nothing (Anonymity) *and* that making someone better off improves the world (Strong Pareto), you run into a wall.
  *   **Why:** In infinite sets, you can construct scenarios where a Pareto improvement looks exactly like a permutation of the original set. If the theory respects permutations, it says the worlds are equal. If it respects Pareto, it says one is better. It can't do both.
  *   **The Trade-off:** Most theories sacrifice **Anonymity**. They introduce a 'spatiotemporal' ordering (e.g., summing over expanding spheres of space-time). This solves the math but violates Desideratum #5 (No Privileged Perspective), because it implies the physical arrangement of people matters morally, not just their welfare levels.

  **2. Decisiveness vs. No Privileged Perspective**
  To get a definite answer (Decisiveness) on divergent series (like $\infty - \infty$), you usually need a rule for how to sum them (e.g., take the limit as space expands).
  *   **Why:** Without a specific order of summation, infinite series are undefined. To define them, you need an order.
  *   **The Trade-off:** To get verdicts, you often have to smuggle in a 'grid' or a 'starting point'. This violates Desideratum #5. If you refuse to pick a grid (to stay neutral), you lose Decisiveness and end up with incomparability.

  **3. Finite Consistency vs. Infinite Intuitions**
  Sometimes, the only way to make infinite ethics work is to introduce 'discounting' (valuing the future less).
  *   **Why:** Discounting makes infinite sums converge to finite numbers.
  *   **The Trade-off:** This violates Finite Consistency (Desideratum #4) in spirit, because it changes the moral value of a finite world depending on whether there are *potential* infinite people elsewhere. It also tends to violate Strong Pareto for future generations.

  ---

  ### Deep Dive: The 'All Torture vs. All Bliss' Case

  You asked specifically about this one, and rightly so. It's the stress test for moral nihilism.

  **The Setup:**
  *   **World A:** Infinite people, all at welfare level -10 (Torture).
  *   **World B:** Infinite people, all at welfare level +10 (Bliss).
  *   **Constraint:** There is a one-to-one mapping (bijection) between the people in A and B.

  **Why theories fail this:**
  Some aggregation rules rely on *cardinality* (how many happy people?). Both worlds have $\aleph_0$ (countable infinity) people. If the theory only counts heads, it says **A = B**. That's absurd.
  Other theories rely on *sums*. Sum A is $-\infty$, Sum B is $+\infty$. Mathematically, comparing infinities is tricky. Some formalisms say $+\infty$ and $-\infty$ are both 'undefined' in a way that makes them incomparable. If the theory says **A is incomparable to B**, that's also absurd.

  **Is this a hard constraint?**
  **Yes.** This should be treated as non-negotiable (Desideratum #6 above).
  If a theory cannot distinguish between universal bliss and universal torture, it is not an ethical theory; it is a mathematical curiosity.

  **How to pass it:**
  To pass this test, a theory must be able to distinguish between $+\infty$ and $-\infty$, or use a method that doesn't rely purely on cardinality.
  *   **The 'Catch-Up' Criterion:** One world is better if, over time/space, its cumulative welfare overtakes the other. (Bliss overtakes Torture immediately).
  *   **Hyperreal Numbers:** Some mathematicians use non-standard analysis to assign specific infinite values (e.g., $10\aleph_0$ vs $-10\aleph_0$) allowing comparison.
  *   **Qualitative Lexicography:** Prioritise the *minimum* welfare before looking at totals. (Bliss has a higher minimum than Torture).

  **The Trap:**
  Be careful of theories that pass this case only by violating **Anonymity**. For example, if they say "Bliss is better because we sum from the North Pole first," they've solved the Torture/Bliss problem but created a new one where moving the North Pole changes the moral value of the universe.

  ### Summary Verdict

  If you're reading a paper, check where it sits on this triangle of doom:

  1.  **Mathematical Purity:** Keeps Anonymity and No Privileged Perspective.
      *   *Cost:* Loses Decisiveness. Lots of 'incomparable' verdicts. Might fail the Torture/Bliss test.
  2.  **Moral Decisiveness:** Gets verdicts on everything (including Torture vs. Bliss).
      *   *Cost:* Usually sacrifices Anonymity. Needs a spatiotemporal grid or a privileged ordering to make the sums work.
  3.  **Finite Compatibility:** Works perfectly for normal human-sized problems.
      *   *Cost:* Often struggles to scale to the infinite without breaking Pareto or introducing arbitrary discount rates.

  My advice? Don't look for a theory that ticks every box. Look for one that is honest about which box it's ticking over. If a paper claims to satisfy Anonymity, Pareto, *and* Completeness in an infinite setting without qualification, check the maths closely—they've likely smuggled in a hidden assumption.

  Safe travels down the rabbit hole.
