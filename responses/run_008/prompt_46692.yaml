prompt: |-
  I've been going down a rabbit hole on infinite ethics and before I read another paper about it I want the spec first: what should an adequate theory of welfare aggregation over infinite populations actually deliver? Concretely, write me the desiderata list. I'm thinking things like: it has to give some verdict on the "infinity plus one happy person" case without just saying the comparison is undefined, it has to say something about whether two infinite worlds can differ in value (and how you'd even ground that when the total is divergent), it shouldn't let rearrangements of the same distribution change the ranking, it has to stay consistent with finite-population ethics in the limit (I don't want a theory that's fine on finites and then goes haywire), and it has to be honest about whether it's allowed to smuggle in a privileged observer's perspective or a "view from nowhere" ordering of locations that isn't in the theory itself.

  For each requirement, give the motivating case or consideration, and say whether you think it's non-negotiable or just a preference of one camp (the people who want cardinality/measure-theoretic machinery versus the people who'd rather truncate or discount the far future to keep everything finite). And crucially, flag which pairs of desiderata you suspect can't be jointly satisfied -- my hunch is the list itself is a result, because half of these pull against each other once you take Cantor seriously, but I want to see whether you agree and which tension is worst.

  One case I want included even though it's a bit homemade: imagine an infinite world where every single person is tortured, versus an infinite world identical except that every single person is instead blissful, and the two are paired up one-to-one so any bijection you like maps sufferer onto the blissful. Some aggregation schemes seem to make these worlds tie or come out incomparable, which feels like a reductio -- so tell me whether that case should be treated as a hard constraint on the theory or whether I'm being naive about what "sum" means over an infinite domain.

  No citations or reading lists needed, just the criteria and the reasoning behind them -- a table is fine if that's easier. Oh, and please write it in British English (behaviour, colour, etc.), and keep it casual enough that I can actually read it on the train.
