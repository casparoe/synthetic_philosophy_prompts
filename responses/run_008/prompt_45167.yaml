prompt: |-
  A friend who is an economist and I spent an entire evening arguing about how governments should weigh costs and benefits that fall in the distant future, and I came away puzzled by something more specific than our argument. She insisted that discounting future benefits is nothing more than opportunity cost of capital: money not spent now can be invested and made to yield more welfare later, so a benefit in 2100 genuinely is worth less today, and no value judgement about future people is involved. I suspected that some view about the moral status of the later-born has to be hiding inside the arithmetic. What puzzles me most is that the official practice seems to split the difference in a way that may not be coherent under any single theory.

  Take the way a national treasury appraises long-lived projects — flood defences, nuclear decommissioning, infrastructure. It discounts future costs and benefits back to the present at a standard annual rate, but the rate declines in steps with distance: a lower rate beyond thirty years, a lower rate again beyond seventy-five, so that far-future effects are not shrunk to the near-nothing that a constant rate would produce. So far, so equivocal. But the same guidance also caps the calculation at a horizon of about 125 years: whatever a project does to people after that — however catastrophic — counts for nothing whatsoever. So the far future is protected by a gentler rate, and then abolished by a cut-off.

  What theory of intergenerational value, if any, does this tiered practice presuppose? Does the declining schedule presuppose a pure time preference that simply weakens with distance, or can it be reconstructed by a view on which every generation's welfare counts equally — say, through diminishing marginal returns to consumption if the future is richer, or uncertainty about whether anyone will be there? Can the 125-year horizon be licensed by any of these theories, or does it quietly rule them all out and reveal something else entirely — a tractability convention masquerading as a moral position? And tell me what would have to change in the practice, step by step, if the implicit theory were replaced by a principle of equal concern for all generations: would consistency demand a flat rate out to infinity, a zero rate, or no discounting of welfare at all? I would also like to know which parts of the practice are genuinely underdetermined — points at which several quite different theories of the future would all license the same numbers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Conflict:** The user (philosophically inclined) vs. Friend (Economist) on discounting future benefits/costs.
      *   **Friend's View:** Discounting = Opportunity Cost of Capital (OCC). No moral judgment, just arithmetic of investment returns.
      *   **User's Suspicion:** Moral status of future people is hidden in the arithmetic.
      *   **Observation of Practice:** Government appraisal (e.g., UK Treasury Green Book, US OMB) uses a *declining discount rate* (DDR) schedule but also imposes a *hard cut-off* (e.g., 125 years).
      *   **Key Questions:**
          1.  What theory of intergenerational value does this tiered practice (DDR + Cut-off) presuppose?
          2.  Can the DDR be reconstructed by non-time-preference views (e.g., diminishing marginal utility, uncertainty)?
          3.  Can the 125-year cut-off be licensed by *any* coherent theory, or is it just a tractability convention?
          4.  What would change if we adopted "equal concern for all generations" (flat rate? zero rate? no discounting?)?
          5.  Which parts of the practice are underdetermined (different theories yielding same numbers)?

  2.  **Initial Analysis & Fact-Checking:**

      *   *Discounting Basics:* The Ramsey Rule is central here: $r = \rho + \eta g$.
          *   $r$: Social Discount Rate.
          *   $\rho$: Pure rate of time preference (impatience).
          *   $\eta$: Elasticity of marginal utility of consumption (inequality aversion/diminishing returns).
          *   $g$: Growth rate of consumption.
      *   *Friend's Argument:* Focuses on the opportunity cost of capital (often associated with the "social opportunity cost of capital" approach vs. "social time preference" approach). This is a standard neoclassical defense but often conflates financial returns with social welfare.
      *   *Declining Discount Rates (DDR):* Why do governments use them? Usually due to uncertainty about future growth rates (Weitzman's logic) or ethical concerns about very long horizons (intergenerational equity).
      *   *The Cut-off:* A 125-year cut-off is specific. The UK Green Book used to have a 100-year horizon, now suggests 300+ for some environmental assets. The US OMB suggests 30-50 years typically but acknowledges longer for climate. The 125-year figure sounds like a specific jurisdictional rule (perhaps older UK guidance or a specific agency). I need to address the *logic* of the cut-off regardless of the specific number.
      *   *Coherence:* A DDR implies we care *more* about the far future than a constant rate suggests. A hard cut-off implies we care *nothing* about the far future. This is indeed contradictory.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the puzzle. Validate the user's suspicion (yes, ethics is hidden in the math). State the thesis: The current practice is a pragmatic hybrid, not a coherent ethical theory.

      *   **Part 1: The Economist's Claim (Opportunity Cost vs. Time Preference).**
          *   Explain the Ramsey Rule.
          *   Distinguish between *descriptive* discounting (market rates/OCC) and *prescriptive* discounting (ethical welfare).
          *   The friend is partially right (capital is productive) but wrong that it excludes value judgments. Choosing the *rate* involves choosing $\rho$ (how much we value future people vs. us).

      *   **Part 2: The Declining Discount Rate (DDR).**
          *   Why DDR? Two main justifications:
              1.  *Uncertainty (Weitzman):* If we aren't sure what the growth rate ($g$) or discount rate ($r$) will be, the "certainty equivalent" rate declines over time. This is mathematically robust and doesn't require ethical shifting.
              2.  *Ethical (Intergenerational Equity):* A constant rate makes the far future negligible. To avoid this "tyranny of discounting," we lower $\rho$ for distant generations.
          *   *Answering the User:* Yes, DDR can be reconstructed without pure time preference (via uncertainty or diminishing marginal utility if growth slows).

      *   **Part 3: The 125-Year Cut-off.**
          *   This is the smoking gun of incoherence.
          *   Can ethical theory justify it? No. Utilitarianism (sum of welfare) or Prioritarianism would never say "zero weight after year 125."
          *   Is it tractability? Yes. Modeling uncertainty beyond 125 years is speculative.
          *   Is it political? Yes. Politicians don't care about voters 125 years hence.
          *   *Verdict:* It is a convention masquerading as analysis. It contradicts the DDR logic immediately preceding it.

      *   **Part 4: Equal Concern for All Generations.**
          *   What does "equal concern" mean? Usually $\rho = 0$ (no pure time preference).
          *   Does this mean 0% discount rate? No. Still discount for *growth* ($\eta g$). If future people are richer, a dollar helps them less.
          *   Does it mean infinity? Theoretically, yes. But if $g > 0$ and $\eta > 0$, the present value still converges.
          *   *Steps to change:*
              1.  Set $\rho = 0$.
              2.  Remove the cut-off.
              3.  Keep $\eta g$ (consumption discounting) unless we expect stagnation.
              4.  Use DDR to handle uncertainty, not ethics.

      *   **Part 5: Underdetermination.**
          *   Where do different theories agree?
          *   Short term (0-30 years): Market rates, ethical rates, and uncertainty rates often converge around 3-4%.
          *   The "Weitzman Effect": Uncertainty about $r$ produces a DDR curve that looks like an ethical DDR curve. You can't tell the difference just by looking at the numbers.

      *   **Conclusion:** Summarize. The practice is a "moral muddle" designed to make difficult decisions manageable, not philosophically consistent.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Cut-off:* I need to be careful not to say *no* government uses >125 years. The UK Green Book now suggests 300 years for environmental assets. But the user specifies a 125-year cap scenario. I should treat it as the user's observed phenomenon (likely based on specific infrastructure guidance) and analyze the *logic* of having *a* cap.
      *   *Nuance on OCC:* The friend's argument is the "Social Opportunity Cost of Capital" (SOC) approach. The counter is the "Social Time Preference" (STP) approach. The tension between these is exactly the tension the user sees.
      *   *Nuance on Zero Discounting:* If $\rho=0$ and $g=0$, then $r=0$. This leads to the "Repugnant Conclusion" or infinite savings problems (Koopmans). I need to mention that $\rho=0$ doesn't necessarily mean we save everything for the future, because of the diminishing marginal utility ($\eta$).
      *   *Tone:* Keep it analytical, respectful of the economist friend but validating the user's philosophical intuition.

  5.  **Final Polish:** Check against the specific questions asked.
      *   What theory does it presuppose? (Hybrid/Pragmatic).
      *   Can DDR be reconstructed? (Yes, via uncertainty).
      *   Can cut-off be licensed? (No, it's administrative).
      *   What changes for equal concern? ($\rho=0$, remove cap, keep growth discounting).
      *   What is underdetermined? (Short-term rates, DDR shape).

  6.  (Mental Check of specific references): Weitzman (1998) on declining rates. Ramsey (1928) on time preference. Stern Review (2006) vs. Nordhaus on climate discounting. UK Green Book (HM Treasury). These provide the backbone for the technical claims.

  7.  **Final Output Generation** (Proceed to write the response following this structure).
answer: |-
  You have put your finger on one of the most significant unresolved tensions in public policy economics. Your intuition is correct: the arithmetic of discounting is never value-neutral, and the specific combination of a declining discount rate (DDR) with a hard temporal cut-off is theoretically incoherent. It represents a pragmatic compromise between ethical aspirations, economic orthodoxy, and administrative tractability, rather than a deduction from a single moral theory.

  Here is an analysis of the theory (or lack thereof) presupposed by this practice, how it might be reconstructed, and what "equal concern" would actually require.

  ### 1. The Economist's Claim: Opportunity Cost vs. Time Preference
  Your friend is articulating the **Social Opportunity Cost of Capital (SOC)** approach. The argument is that capital is productive; $100 invested today becomes $103 next year. Therefore, a benefit of $103 in a year is equivalent to $100 today. If we spend the money on a flood defense instead, we forego that growth.

  However, this conflates *financial* returns with *welfare* returns.
  *   **The Hidden Value Judgment:** To move from market interest rates to a *social* discount rate, one must assume that the market distribution of income is optimal and that the utility of consumption is linear. Most welfare economists reject this.
  *   **The Ramsey Rule:** The standard prescriptive formula for the social discount rate ($r$) is $r = \rho + \eta g$.
      *   $\rho$ (rho): The pure rate of time preference (how much we value present people over future people simply because they exist now).
      *   $\eta$ (eta): The elasticity of marginal utility (how much less value an extra dollar gives to a richer person).
      *   $g$: The growth rate of consumption.

  Your friend argues that $r$ is determined by investment returns. But in long-term public appraisal, $r$ is usually determined by **Social Time Preference (STP)**. If you set $\rho > 0$, you are explicitly saying a life saved in 2100 is worth less than a life saved today, even if the future person is equally rich. That is a moral judgment, not an arithmetic fact.

  ### 2. The Declining Discount Rate (DDR): What Theory Justifies It?
  The use of a lower rate for the distant future (e.g., 3.5% for 0–30 years, dropping to 1% for 75+ years) is a relatively modern innovation (pioneered by the UK Treasury and recommended by Martin Weitzman). It can be justified by two distinct theories, which yield the same numbers but for different reasons.

  **A. The Uncertainty Argument (Weitzman)**
  This is the "value-neutral" reconstruction your friend might prefer. We do not know what the future discount rate will be. If there is uncertainty about future growth ($g$) or future rates ($r$), the "certainty equivalent" discount rate declines over time mathematically.
  *   *Logic:* If there is a small chance the future rate will be very low, that chance dominates the calculation in the distant future because the compounding effect of a low rate is massive over centuries.
  *   *Verdict:* This justifies the DDR without requiring a change in moral status. It says, "We don't know what rate to use, so the math forces the effective rate down."

  **B. The Intergenerational Equity Argument (Ethical)**
  This aligns with your suspicion. A constant rate of 3.5% renders a catastrophe in 200 years negligible in today's terms (dividing value by ~1,000). Many ethicists (and the Stern Review on climate change) argue this violates a principle of neutrality between generations.
  *   *Logic:* We lower the rate explicitly to prevent the "tyranny of discounting" from wiping out the interests of the far future.
  *   *Verdict:* This presupposes that $\rho$ (pure time preference) should be lower or zero for distant generations.

  **Underdetermination:** This is a key point for your puzzle. **You cannot distinguish Theory A from Theory B by looking at the discount schedule.** Both uncertainty about growth and ethical concern for the future produce a declining curve. The government practice exploits this underdetermination: it can claim to be doing "risk analysis" while effectively satisfying "ethical concerns."

  ### 3. The 125-Year Cut-off: The Incoherence
  The hard horizon is the smoking gun that reveals the practice is not derived from a coherent moral theory.

  *   **Can Utilitarianism license it?** No. If welfare counts, it counts. A suffering person in year 126 has moral weight.
  *   **Can Contractarianism license it?** No. Even if we imagine a social contract, rational agents behind a veil of ignorance would not agree to be ignored simply because they are born 126 years hence.
  *   **Can the Opportunity Cost view license it?** No. Capital compounding does not stop at year 125.

  **What the Cut-off Actually Is:**
  It is an **administrative truncation** masquerading as analysis. It is justified by:
  1.  **Epistemic Humility:** "We cannot reliably model society or technology beyond this point." (Though this argues for *uncertainty*, not *zero value*).
  2.  **Political Tractability:** Politicians and civil servants cannot be held accountable for impacts they cannot visualize.
  3.  **Decision Paralysis:** If you include infinite horizons with low discount rates, almost any project with a permanent negative impact (like nuclear waste) becomes infinitely costly, potentially paralyzing all development.

  **Verdict:** The cut-off quietly rules out *all* coherent theories of intergenerational value. It is a convention to make the spreadsheet finite. It contradicts the logic of the DDR immediately preceding it: if the far future is important enough to lower the discount rate at year 75, it is incoherent to say it is worthless at year 126.

  ### 4. What Would "Equal Concern" Require?
  If you replaced the current practice with a strict principle of **Equal Concern for All Generations** (often associated with Ramsey's dictum that pure time preference $\rho$ is "a practice which is ethically indefensible and arises merely from the weakness of the imagination"), the practice would change in specific steps:

  1.  **Set Pure Time Preference ($\rho$) to Zero:** You would not discount welfare simply because it occurs later.
  2.  **Retain Consumption Discounting ($\eta g$):** You would still discount *monetary* benefits if you expect future generations to be richer. If a future person is twice as rich as you, a dollar gives them less welfare. You discount the money, not the life. If consumption growth ($g$) is expected to be zero (e.g., due to ecological limits), the discount rate becomes zero.
  3.  **Remove the Cut-off:** The time horizon must become infinite.
  4.  **Retain the Declining Rate (for Uncertainty):** You would keep the DDR, but explicitly label it as handling *uncertainty* about growth rates, not as a moral concession.

  **Would this demand a flat rate?**
  No. Under equal concern, the rate should still decline if there is uncertainty about future growth (the Weitzman effect). However, the *floor* of that rate would be determined by $\eta g$. If we assume perpetual growth, the rate stays positive. If we assume stagnation, the rate approaches zero.

  **The "Infinity Problem":**
  The reason governments don't do this is that with a near-zero discount rate and an infinite horizon, the Present Value of long-term liabilities (like nuclear waste storage or carbon damages) can become infinite, outweighing any finite present benefit. This leads to the conclusion that we must sacrifice almost all current consumption to save the future. Most governments view this as politically unsustainable, hence the "pragmatic" incoherence.

  ### 5. Summary of the Theoretical Landscape

  | Feature of Practice | Possible Justification 1 (Economic) | Possible Justification 2 (Ethical) | Coherent Theory? |
  | :--- | :--- | :--- | :--- |
  | **Positive Discount Rate** | Capital is productive (OCC). | Future people will be richer (Diminishing Marginal Utility). | **Yes.** (Ramsey Rule) |
  | **Declining Rate (DDR)** | Uncertainty about future growth rates (Weitzman). | Pure time preference weakens over distance (Intergenerational Equity). | **Yes.** (Both work) |
  | **125-Year Cut-off** | Modeling uncertainty becomes too high. | **None.** | **No.** (Purely administrative) |
  | **Underdetermination** | **High.** You cannot tell if a DDR is due to risk analysis or moral concern just by looking at the numbers. | | |

  ### Conclusion
  Your friend is right that discounting *can* be framed as opportunity cost, but wrong that this excludes moral judgment. Choosing to use a social discount rate rather than a market rate is itself a moral choice.

  The practice you observe is a **hybrid**. It uses the **Declining Discount Rate** to appease ethicists (and account for uncertainty) without admitting that $\rho$ is controversial, and it uses the **125-Year Cut-off** to appease politicians and accountants who need a finite sum to sign off on a budget.

  If you demanded consistency based on "equal concern," you would not necessarily get a zero discount rate (unless you expect zero growth), but you would absolutely get the abolition of the time horizon. The fact that the Treasury retains the horizon proves that the practice is not driven by a theory of value, but by a **theory of governance**: the need to make decisions that are defensible, calculable, and finite, even if they are philosophically contradictory.
