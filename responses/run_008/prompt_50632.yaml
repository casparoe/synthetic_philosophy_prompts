      *   *Move 5 (Nina: Stalemate / Patrick: Confused Truth):* This is the core philosophical clash. Realism vs. Formalism/Multiverse. *Verdict: Patrick is right that "truth" is the contested notion, but Nina is right that "useful" doesn't necessarily mean "not true."*
