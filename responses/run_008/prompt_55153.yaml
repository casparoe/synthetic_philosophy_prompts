prompt: |-
  ok so, you're a professional philosopher of science who's been teaching grad/upper-undergrad courses for like 15 years, and you're also good at actually explaining things instead of hiding behind journal-speak. before you write anything, please brainstorm for a minute about what genuinely separates a student who *understands* structural realism from one who memorized the SEP summary — i mean actually think it through, dont skip this step, it matters for what the marking scheme should reward.

  some context: i teach an upper-level philosophy of science seminar. i've been around the rationalist-adjacent internet forever (old lesswrong days, the sequences, the whole thing), and my students have absorbed the vibe: half of them think "it's just math all the way down" is a complete philosophical position and the other half think yelling "underdetermination!" ends debates. our final is coming up and i want ONE essay question on structural realism that is impossible to answer by reciting the standard story (you know the one: Worrall pointed at Fresnel's equations surviving into Maxwell's theory, said what's retained across theory change is structure not objects, therefore pessimistic meta-induction dodged AND the no-miracles argument saved, best of both worlds, everyone go home).

  here's the specific thing i want the question built around — this is the part i actually care about. my own view (argue with me if you think im wrong, im not fully sure) is that the way everyone teaches the Newman objection is way too easy on epistemic structural realism and way too hard on ontic structural realism. so the question has to force this exact confrontation:

  (a) first, the student has to genuinely RECONSTRUCT Newman's objection as an argument, not just name-drop it. the shape it should come out with: if all a theory's claim to truth amounts to is "some objects instantiate such-and-such a structure," then given any old collection of objects with the right cardinality you can define relations on them that instantiate the structure, so the structural claim is nearly vacuous — the only substantive constraint left is "there are at least n things." i want students to see it's essentially a permutation/invariance point about swapping out the relata, not some vague "relations are cheap" gesture. an answer that just says "newman said structure collapses into cardinality" and moves on has not answered part (a).

  (b) then the crux. the textbook line is that ontic structural realism (the "objects are just nodes in the structure, there's nothing to the relata over and above the relations" version, the one people associate with ladyman and french) escapes newman by deleting the very objects the permutation needed. i want the question to include a case where it's genuinely unclear whether that move works. here's the case i invented for the exam, feel free to polish the wording but keep the content: Theory T is empirically exactly as successful as our current physics and its mathematical core is identical to ours. But T's own physicists and philosophers insist T is purely a calculating device — nothing instantiates its structure, the structure isn't "out there," it's bookkeeping that happens to make predictions. the student has to say: does the structural realist's no-miracles inference go through on T or not? and what does that tell us about whether ontic structural realism actually escaped newman or just relabeled the problem ("we deleted the objects" vs "we smuggled them back in under the word 'node'")?

  so: the question should have those two connected parts, reconstruct then apply, and the application part should be where the real discrimination happens.

  deliverables:

  1. the essay question itself, suitable for a 90-minute in-class answer, with my T case written up as a paragraph inside the question (students get the case in front of them, they shouldn't have to invent their own example)

  2. a model answer, ~600 words, that actually answers the question rather than surveying the literature

  3. a marking scheme out of 20 that (i) names the specific moves an A answer must contain, (ii) says what a B answer looks like — the answers that are genuinely decent but fall short, and where exactly they fall short, not just "less depth," and (iii) lists the common failure modes with rough mark ceilings. one failure mode i already know i want in there: two pages on the no-miracles argument and one thin paragraph on newman — thats a C in my book and i want that stated explicitly

  constraints: no real quotations needed, and dont build anything around specific papers beyond worrall's fresnel/maxwell example and newman's objection in general (both are fair game, they're in every textbook for this course). everything the student needs must be in the question or from my lectures — no outside reading assumed. and heres the real test: if you can imagine a student answering the question well without actually understanding the permutation point, the question is broken and needs a rewrite. make sure the T case does real work and isnt just flavor text.

  also, pls sanity-check that the 90-minute length is realistic for what you're asking. if the model answer would take a student 2 hours to write, cut something rather than pretending its fine.

  thanks! this is the kind of thing where if you nail the marking scheme i'll basically reuse it every year, so its worth the effort to get the A/B distinction exactly right.
