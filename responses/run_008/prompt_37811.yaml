  so my friend and i just spent like three hours on this and i need a tiebreak from someone who isn't either of us. here's the setup, which is basically the classic dust specks thing but we made it weirder as we went.

  the base case: one person tortured for 50 years vs 3^^^3 people each getting a dust speck in the eye. i say the specks win (i.e., specks are the worse outcome), she says the torture is worse, and we've beaten every standard argument to death. so i'm not asking you to re-litigate the greatest hits. what i want is your actual credence that the specks outcome is worse, and i want it decomposed properly, because i think our whole fight lives in one specific term and i want to know if you agree.

  here's the decomposition i have in mind, feel free to fix it if you think a term is missing or wrong:

  1. probability that a dust speck in the eye is genuinely bad at all — like, is there even nonzero disvalue there, or is it below some floor where things are just neutral? she kept pushing this: maybe tiny annoyances don't register as harms until they cross some threshold, in which case any number of them is exactly zero. i think that's wrong (the speck is annoying when it happens, i'd pay a penny to avoid one) but i can't prove it.

  2. probability that whatever disvalue a speck has is additive across persons. this is the one we invented that i haven't seen anywhere: imagine a single immortal person who instead gets all the specks themselves, one per second forever. if you think one person getting specked every second for eternity is bad in a way that keeps getting worse, aggregation within a life seems fine. but across 3^^^3 different people, each one's speck is the only bad thing that ever happens to them, ever, in their whole life. she says cross-person aggregation is doing something totally different from within-life aggregation and you can't just assume they work the same. i genuinely don't know if she's right.

  3. probability that there's no lexical cutoff on the pain side — i.e., that there's no suffering so bad that no quantity of specks could ever outweigh it. this is the thing her position secretly rests on i think, that torture is just a different category of bad, not a big number of speck-units of bad.

  give me a rough probability for each of those, one line of why for each, then tell me how they combine into your overall credence (and if the combination isn't just multiplying them, say what you're doing instead). then two more things:

  first, which of those terms do you think me (specks) and her (torture) most likely disagree about? i want to know where the fight actually lives, not where we both pretend it lives.

  second, and this is the part i actually care about: tell me what would change your mind. what argument or consideration would move your overall number the most, and where in your own reasoning do you think you're most likely to have gone wrong? don't just give me the number — give me the weak points marked. if you think my decomposition is loaded or question-begging in some way, that's exactly the kind of thing i want flagged.

  and please write in british english (favour, realise, etc.) — no other reason, it's just what we ended up writing our notes in and i want to paste this straight into the doc. cheers
