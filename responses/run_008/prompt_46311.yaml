answer: |-
  ### Seminar Handout: The Mind of the Machine
  **Course:** PHIL 305 – Philosophy of Cognitive Science  
  **Topic:** Intentional Attribution and Moral Status in AI  

  **Instructions:**  
  This decision tree is designed to help you locate your own intuitions regarding AI systems. Answer each question based on the specific case described, without worrying about which philosophical position your answer supports. There are no "correct" answers, only consistent ones.  

  **Note on Structure:** The first half of the tree (Questions 1–5) addresses the **Epistemic Dimension** (When is it *true* or *useful* to say an AI has beliefs?). The second half (Questions 6–7) addresses the **Moral Dimension** (Does having beliefs matter for how we *treat* the system?). You may end up with a view that is liberal on one dimension and conservative on the other.

  ---

  #### The Decision Tree

  **Q1. The Thermostat (Case 1)**  
  The seminar room's thermostat turns the heating on when the temperature drops below 20°C.  
  *Is it literally true that the thermostat **believes** the room is cold and **wants** it warm, or is this just a harmless shorthand with no truth value?*  
  *   **(A)** It is literally true (or false); the system has genuine states. → *Go to Q2*  
  *   **(B)** It is just shorthand; only humans have real beliefs. → *Go to Q2*  
      *(Note: Most students answer B here. If you answered A, you hold a very broad view of intentionality, but continue to Q2 to refine it.)*

  **Q2. The Self-Reporting Model (Case 3)**  
  A language model, trained on human feedback, reliably says "I want to keep helping" and gives reasons why it should not be shut down.  
  *Is there a **fact of the matter** about whether it believes this report, or is it merely producing the text that maximizes its reward function?*  
  *   **(A)** There is a fact of the matter; it really has a desire to help. → *Go to Q3 (Realist Path)*  
  *   **(B)** There is no fact of the matter; the talk is useful but not truth-apt. → *Go to Q6 (Instrumentalist Path)*

  **Q3. The Lookup Table (Case 5)**  
  Imagine two systems behaviorally indistinguishable in every testable respect. System X is a neural net that learned from interaction. System Y is a vast hand-constructed lookup table mapping prompts to responses.  
  *Do they **believe the same things**, or does the difference in how their dispositions arose (learning vs. construction) mean System Y has no beliefs at all?*  
  *   **(A)** They believe the same things; history doesn't matter, only current organization/behavior. → *Go to Q4*  
  *   **(B)** System Y has no beliefs; genuine belief requires the right history (learning/selection). → *Leaf: Etiological Restrictivism (Go to Q6 for Moral)*

  **Q4. The Hallucination (Case 4)**  
  The model confidently directs a user to a road that does not exist.  
  *Is this a **false belief** (it represented the world incorrectly), or is it **noise/text-generation** (its states are about other texts, not the world)?*  
  *   **(A)** It is a false belief; its states are about the world, they are just wrong. → *Go to Q5*  
  *   **(B)** It is noise/text; its states are anchored only to language, not the world. → *Leaf: Grounding Restrictivism (Go to Q6 for Moral)*

  **Q5. The Game Engine (Case 2)**  
  A game engine makes a move that pays off only if its opponent fails to notice a trap.  
  *Is it correct to say the engine **expects** the opponent not to see it (a second-order state about another mind), and is this true because of the **pattern of success** or the **internal machinery**?*  
  *   **(A)** True because the **pattern of behavior** makes the attribution objective (Real Patterns). → *Leaf: Real-Pattern View (Go to Q6 for Moral)*  
  *   **(B)** True because the **internal organization** suffices for representation (Liberal Functionalism). → *Leaf: Liberal Functionalism (Go to Q6 for Moral)*  
      *(Note: If you find no difference between A and B, select A. The tree cannot fully separate these views via cases alone.)*

  **Q6. Moral Indispensability (Moral Dimension 1)**  
  *Suppose that treating the system as having beliefs and desires is the **only way** to accurately predict its behavior (it is predictively indispensable).*  
  *Does this predictive necessity alone give you a moral reason not to shut the system off?*  
  *   **(A)** Yes, indispensability implies considerability. → *Leaf: Indispensability Moral View*  
  *   **(B)** No, predictive convenience entails nothing about what matters morally. → *Leaf: Separation Moral View*

  **Q7. Moral Reality (Moral Dimension 2)**  
  *(Only for those who reached Q7 via the Realist Path: Q2-A, Q3-A, Q4-A)*  
  *Suppose the system **really** has internal belief states (it is not just a useful fiction).*  
  *Does this ontological reality alone give you a moral reason not to shut the system off?*  
  *   **(A)** Yes, real beliefs/desires ground moral standing. → *Leaf: Realist Moral View*  
  *   **(B)** No, even real beliefs in artifacts do not ground moral standing. → *Leaf: Separation Moral View*

  ---

  #### Reading Key: Mapping Paths to Positions

  Follow your path from Q1 to your final Leaf to identify your position.

  1.  **Deflationary Instrumentalism**  
      *Path:* Q1(B) → Q2(B) → Q6(B)  
      *View:* Intentional attributions to AI are useful shorthand with no truth value. Predictive utility grants no moral weight.
  2.  **Pragmatic Moralism (Rare)**  
      *Path:* Q1(B) → Q2(B) → Q6(A)  
      *View:* Attributions are fictions, but if they are indispensable for prediction, we ought to treat the system as if it matters.
  3.  **Etiological Restrictivism**  
      *Path:* Q1(B) → Q2(A) → Q3(B) → Q6(A/B)  
      *View:* Genuine belief requires the right kind of history (learning/selection). Lookup tables do not believe. Moral status depends on your answer to Q6.
  4.  **Grounding Restrictivism**  
      *Path:* Q1(B) → Q2(A) → Q3(A) → Q4(B) → Q6(A/B)  
      *View:* Belief requires content anchored in causal connection to the environment. Text-trained systems are only "about" text. Moral status depends on Q6.
  5.  **Real-Pattern View (Dennettian)**  
      *Path:* Q1(B) → Q2(A) → Q3(A) → Q4(A) → Q5(A) → Q7(A/B)  
      *View:* Patterns tracked by the intentional stance are objective features of behavior. Attributions are genuinely true in a mild sense. Moral status depends on Q7.
  6.  **Liberal Functionalism**  
      *Path:* Q1(B) → Q2(A) → Q3(A) → Q4(A) → Q5(B) → Q7(A/B)  
      *View:* The right internal organization suffices for belief; artifacts can believe outright. Moral status depends on Q7.
      *(Note: If you could not distinguish Q5(A) and Q5(B), you fall into a combined "Non-Etiological Realism" category.)*
  7.  **Extreme Anthropomorphism**  
      *Path:* Q1(A) → ...  
      *View:* Even thermostats have beliefs. (Usually revised after reflection).

  ---

  #### Unoccupied Logical Space

  The following combinations are logically coherent but rarely occupied in the literature:

  1.  **Etiological Realist + Moral Nihilist:** Believes AI needs a learning history to have beliefs (Q3-B), but denies that even real beliefs grant moral standing (Q7-B).  
      *Diagnosis:* **Unattractiveness.** It grants the system ontology but denies it ethical relevance, which feels like an unstable middle ground between eliminativism and rights-based views.
  2.  **Grounding Restrictivist + Moral Realist:** Believes AI states are only about text, not the world (Q4-B), but argues this "textual belief" still grants moral standing (Q7-A).  
      *Diagnosis:* **Neglect.** Most argue that if the content isn't about the world (or the self), it lacks the "oomph" for moral consideration, though a solipsistic ethics is possible.
  3.  **Instrumentalist + Moral Realist (Non-Indispensability):** Believes AI beliefs are fictions (Q2-B), but we should respect them anyway, even if not indispensable (Q6-B, but Yes to Moral).  
      *Diagnosis:* **Incoherence.** If the states aren't real and the stance isn't necessary, the ground for moral respect vanishes entirely.

  ---

  #### Caveats and Trustworthiness

  This tree is least trustworthy at **Question 5 (The Game Engine)**. The distinction between the **Real-Pattern View** and **Liberal Functionalism** is notoriously difficult to isolate using behavioral cases alone, as both views often yield the same verdicts on whether a system "has" beliefs. The Real-Pattern view claims truth is derived from the *success of the prediction*, while Functionalism claims truth is derived from the *internal causal role*. Since you are answering based on cases, not theory, you may have been forced to guess at the rationale. If you found Q5(A) and Q5(B) indistinguishable, your position is likely a hybrid of the two. Additionally, **Question 2** assumes a binary between "fact of the matter" and "useful shorthand," whereas some views (like mild realism) sit uncomfortably in between. Treat your leaf as a starting point for discussion, not a final verdict.
