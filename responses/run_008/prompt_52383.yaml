  **Session Plan: The Motive Mask**

  **Materials:** 8 Profile Cards (behavioral instructions), 32 Decision Slips, 28 Wager Sheets, Projector.
  **Profiles (Secret/Behavioral):**
  1.  *Optimizer:* Cooperate only if Personal Cost is Low.
  2.  *Principled:* Cooperate Always.
  3.  *Habit:* Cooperate if Effort is Low; defect if effortful.
  4.  *Conformist:* Cooperate only if Observed.

  **Timeline:**
  **1. Setup (10 min):** Divide class: 8 Actors, 7 Diagnosticians. Actors draw profiles. Explain scoring: Actors earn points for profile fidelity; Diagnosticians earn points for correct identification.
  **2. Gameplay (35 min):** Four rounds. Project scenario (e.g., "Return Lost Wallet"). Variables shift:
  *   R1: Low Cost, Public. (All Cooperate)
  *   R2: High Cost, Public. (Principled/Conformist Cooperate)
  *   R3: Low Cost, Private. (Principled/Optimizer/Habit Cooperate)
  *   R4: High Cost, Private. (Only Principled Cooperates)
  Actors mark "Cooperate" or "Defect." Collect slips. Diagnosticians see anonymized choice patterns (e.g., "Actor A: Yes, Yes, No, Yes") and wager 10 points on which profile fits. Reveal choices after wagers.
  **3. Debrief (30 min):**
  *   **Reveal:** Map behavioral profiles to theories (Optimizer=Utilitarian; Principled=Kantian; Habit=Virtue; Conformist=Social).
  *   **Discussion:** In Round 1, all acted rightly. Did all have moral worth? No. Worth emerges in the pattern across rounds. The Principled agent retains worth under high cost/private conditions; the Conformist loses it in private.
  *   **Key Insight:** Outward rightness underdetermines motive. Worth attaches to the stability of the motive across shifting temptations.

  **Predicted Failures & Fixes:**
  1.  *Actors Gaming:* Actors might try to be ambiguous to stump Diagnosticians. *Fix:* Rule that Actors only score points if Diagnosticians *can* identify them (incentivizes clear profile adherence).
  2.  *Logistical Drag:* Passing papers consumes time. *Fix:* Use a simple Google Form or hold up colored cards (Red=Defect, Green=Cooperate) for immediate visibility.
  3.  *Confusion:* Students mix up Cost vs. Visibility. *Fix:* Keep scenario constant (e.g., "Tell Truth"), change only parameters explicitly on screen.

  **The Missing Feature:**
  This game relies on *observable behavior*. It cannot reproduce the agent's *phenomenological stance*. A "Habit" agent might act rightly from love (virtue) or mere unthinking reflex (mindless habit). Behaviorally identical, philosophically distinct. Kant argues worth requires conscious recognition of duty, not just reliable output. You must supply this interiority in discussion: ask Actors what they *felt* during High Cost rounds. Did the Principled agent feel struggle (Kant) or ease (Virtue)? The game shows the *shadow* of motive; you must provide the light.
