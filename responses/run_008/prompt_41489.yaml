  3.  **Drafting - Section by Section (mental outline):**
      *   **Opening:** State the purpose of the memo and the gravity of the moment.
      *   **Recommendation:** Clearly state support for formal apology language and the compensation rider.
      *   **Addressing the Nature of State Apology (Faction 1 & 3 concerns):** Explain that the state is a continuous moral agent. It's not about individual guilt of current legislators, but institutional responsibility. The apology is addressed to the victims and the public trust.
      *   **Addressing Compensation (Faction 2 concerns):** Acknowledge that money isn't redemption, but it is necessary for tangible repair. Apology without it is indeed risky, which is why we pair them.
      *   **Addressing the "Category Mistake" (Faction 3):** Acknowledge the philosophical tension but argue that political communities bear responsibility across generations.
      *   **Closing:** Call for unity and moral courage.

