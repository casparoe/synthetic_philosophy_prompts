      To my colleagues on the Commission for Historical Redress, I am writing to share my final recommendation regarding the upcoming legislative debate on the state's eugenic sterilization program, and I urge you to join me in supporting a formal resolution of apology coupled with the proposed compensation fund. We stand at a rare juncture where history, morality, and policy intersect, and while I respect the depth of conviction held by every faction within our group, I believe that issuing a statement of regret rather than apology, or severing the acknowledgment from material repair, would fail the surviving victims and misunderstand the nature of the state itself. The proposal before us is not merely about managing the conscience of current legislators but about restoring the integrity of the institution they serve, and this requires us to accept the burden of institutional continuity even when it implicates actions we did not personally commit.

      I want to address directly the concern raised by those who prefer language of regret over apology, as well as those who view collective apology as a category mistake, because their philosophical caution is not without merit. It is true that no sitting legislator performed these sterilizations, and it is true that holding a current officeholder personally guilty for the sins of predecessors is morally incoherent. If an apology were merely an admission of personal guilt, then none of us could rightly offer it. However, when a state apologizes, it is not acting as a collection of individuals confessing personal sin but as a continuous moral agent reaffirming its constitutional identity. The state is an enduring entity that outlives any single officeholder, and when it apologizes for acts none of its current members performed, it is declaring that those past acts were a betrayal of the state's own foundational principles rather than a legitimate exercise of its power. The apology is addressed primarily to the surviving victims and their descendants, acknowledging that their citizenship was violated by the very government sworn to protect them, but it is also addressed to the public trust, serving as a binding commitment that the authority of the state will never again be wielded in such a manner. To retreat to the language of regret is to distance the current state from the past state too sharply, implying that the wrongdoing was an anomaly of specific people rather than a structural failure of the institution we now inhabit.

      Furthermore, we must contend seriously with the argument that an apology unaccompanied by compensation is an empty performative that allows the state to feel finished without paying anything. There is profound wisdom in this objection, and if we were to recommend an apology without the compensation rider, I would share the concern that we are offering words where justice requires substance. An apology without reparative action can indeed function as a mechanism of closure for the perpetrator rather than healing for the victim, letting the legislature check a box and move on while the material consequences of the sterilization program continue to burden the survivors. This is why the compensation fund is not merely a rider but an essential component of the apology itself. Money cannot undo the loss of bodily autonomy or the theft of lineage, but it is a tangible recognition that the harm was real and costly. By pairing the apology with compensation, we mitigate the risk of performative emptiness, though we must remain honest that even this combination cannot fully restore what was taken.

      Ultimately, I believe we must recommend the formal apology and the compensation fund because the alternative leaves the moral debt unpaid and the historical record unclear. I understand that for those who view collective apologies as theater, this recommendation asks you to accept a form of political symbolism that feels philosophically unstable, and for those who worry about culpability, it asks you to bear a burden you did not create. Yet the strongest consideration on the side of caution—that we should not claim guilt we do not bear—is outweighed by the necessity of acknowledging that the state bears responsibility for its continuity. If we cannot apologize for the state's past actions because we did not commit them, we cannot claim credit for the state's past virtues either, and we cannot maintain the legitimacy of the laws we enforce today. I ask that we vote to recommend the resolution with explicit apology language and the compensation rider, not because it solves every philosophical puzzle, but because it offers the only path that honors the survivors while demanding accountability from the institution we serve.

