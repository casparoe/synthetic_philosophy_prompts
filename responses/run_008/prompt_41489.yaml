      *   *Reasoning:* The state is a continuous entity. The harm was structural. Acknowledgment requires owning the institution's past, not just individual legislators' past. Compensation is necessary for tangible repair.
      *   *Addressing Counterarguments:*
          *   To Faction 1 (Regret): Acknowledge the concern about personal culpability but reframe apology as institutional responsibility, not personal guilt.
