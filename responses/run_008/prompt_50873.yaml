answer: |-
  This is a classic problem in moral philosophy, touching on theories from Kant (duty) to Scanlon (reliance) to Hume (social convention). You have excellent intuitions, but you are wrestling with the fact that "promising" isn't one single thing; it's a cluster of obligations held together by a few core pillars.

  There is likely no *single* principle that captures every nuance without exception, but there is a robust framework that gets you 90% of the way there.

  ### The Unifying Principle: **Voluntary Transfer of Right within Moral Bounds**

  The strongest principle that fits your cases is this: **A promise is binding when you voluntarily give another person a right to claim your action, provided that action is moral and possible.**

  Here is how this principle breaks down your cases, solves your paradox, and handles your flip-flop.

  #### 1. The Core Constraints (Why some promises are void)
  *   **Knifepoint (Coercion):** You did not *voluntarily* transfer a right. Duress voids the transfer.
  *   **Resume Lie (Immorality):** You cannot transfer a right to something you have no moral right to do. You cannot give someone a claim on your dishonesty. (Your verdict here is correct).
  *   **Promise to Self (No Second Party):** A promise requires a *creditor*—someone who holds the right to release you. You cannot be both the debtor and the creditor in a way that creates obligation; that's just a resolution. (Your verdict here is correct).

  #### 2. Solving the Paradox: The Cat vs. The Club
  This is the crux of your dilemma. If it's not about "hurting the promisee" (since both are gone/unharmed), what is it?

  It is about the **nature of the right transferred.**

  *   **The Cat (Fiduciary/Trust):** When you promised your dying friend, you accepted a **trust**. The right you transferred to her was not "the right to feel happy," but "the right to direct your care toward her interest." That right becomes part of her moral estate. Just as a will is binding after death because the *instruction* survives the *instructor*, the duty to the cat survives the friend. The obligation is to the *friend's will*, not just her feelings.
  *   **The Club (Reciprocal Exchange):** Club dues are a **contractual exchange**. You pay for access/benefits. When the club dissolves, the *consideration* (the thing you were buying) ceases to exist. In moral terms, the reciprocal arrangement is frustrated. There is no longer a "club" to hold the right to your money. The money was a means to an end (the club's function); without the end, the means are void.

  **The Difference:** The cat promise was a **unilateral duty of care** (you serve the friend's wish). The club promise was a **bilateral exchange** (you pay for services). One survives the death of the partner; the other dies with the partnership.

  #### 3. The Verdicts You Should Reconsider
  You asked which verdicts you should give up. I suggest you revise **The Whining Kids.**

  *   **The Case:** A promise extracted after an hour of whining.
  *   **The Revision:** This is **not binding**, or at least significantly weakened.
  *   **Why:** This borders on **duress or manipulation**. While not a knife, sustained emotional harassment undermines the "voluntary" condition of the principle. If you promise just to make the noise stop, you are acting under coercion.
  *   **Caveat:** If you promised *knowing* they would rely on it (e.g., "I promise we can go tomorrow," causing them to prepare), you are bound by their reliance, not the promise itself. But as a pure promise? It lacks the voluntary integrity required to bind.

  #### 4. The Flip-Flop: The Documentary Promise
  *   **The Case:** Half-joking party promise, now they quit their job based on it.
  *   **The Verdict:** **Binding (partially).**
  *   **The Principle:** This relies on **Foreseeable Reliance**.
  *   **Why:** Even if your *intent* was joking, the moral weight shifts once **reliance** enters the picture. If a reasonable person could have foreseen that someone might take that statement seriously and act on it to their detriment, you incur an obligation.
  *   **The Nuance:** You are likely not bound to the *full* funding (since the speech act was flawed), but you are bound to **mitigate the harm** you inadvertently caused. You cannot walk away cleanly. You owe them a conversation, partial help, or assistance in finding other funding. To walk away entirely is to treat their life-altering decision as irrelevant to your moral standing.

  ### Summary of the Principle

  To make your intuitions consistent, adopt this **Principle of Normative Power**:

  > *I am bound when I intentionally (or negligently) invite another to rely on me, thereby giving them a right to my action, so long as that action is possible and moral.*

  **Applying the filter:**
  1.  **Move:** Intentional invite + Reliance = **Binding.**
  2.  **Knife:** No Intent (Volition) = **Void.**
  3.  **Cat:** Intentional invite + Right survives death = **Binding.**
  4.  **Club:** Impossible Performance (No club) = **Void.**
  5.  **Resume:** Immoral Content = **Void.**
  6.  **Affair:** Moral Content (Privacy is a good) + Intentional = **Binding.** (Note: Keeping a secret is not the same as lying. Lying is active deception; silence is passive privacy. The promise is to remain silent, which is permissible).
  7.  **Kids:** Compromised Volition = **Weak/ Void.**
  8.  **Self:** No Second Party = **Not a Promise.**
  9.  **Documentary:** Negligent Invite + Detrimental Reliance = **Binding (to mitigate).**

  ### Final Advice
  The tension you feel with the **Cat vs. Club** comes from thinking promises are about *feelings* (hurting the friend). Shift your view to think of promises as **creating rights**.
  *   Your friend had a right to your care for the cat; rights can be inherited/executed by estate.
  *   The club had a right to your money *only if* they provided membership; they can't provide membership, so the right evaporates.

  Drop the idea that the kids' promise is binding. Protecting your integrity means not rewarding manipulation, even from loved ones. Keep the documentary verdict as "obligation to mitigate." That balances your lack of intent with their very real harm.
