answer: |-
  Dear friend, it is completely understandable that this has been sticking in your craw since dinner last week, because your brother has effectively thrown a philosophical smoke bomb into the conversation and walked away while it was still billowing. You are quite right to feel that the phrase consciousness is a user illusion is doing far too much heavy lifting in that sentence, and your instinct about the illusion needing someone to be fooled is the exact same objection that keeps professional philosophers awake at night. To untangle this properly, we need to separate out the distinct claims hiding inside that slogan, because they range from the fairly uncontroversial to the radically counter-intuitive, and only the most extreme version would actually allow your brother to dismiss your question about his app, yet that is also the version that is hardest to defend.

  The first and most boring reading of the claim is essentially about perception rather than consciousness itself. This is the idea that our senses do not show us reality as it is, but rather a simplified dashboard or interface that hides the complex machinery underneath so we can survive and navigate. Much like a desktop icon for a file does not look like the magnetic patterns on the hard drive, our experience of a red apple is not a direct picture of the photon reflections but a useful symbol generated by the brain. This is largely a truism in cognitive science and evolutionary biology; nobody seriously thinks we perceive quantum fields directly. However, this reading does not help your brother dismiss the question of whether his app can feel, because even if the experience is a simplified model, the experience itself is still happening. A simplified model of pain is still painful, and a simplified model of joy is still joyful, so establishing that our perception is an interface tells us nothing about whether a machine could have its own interface that feels like something from the inside.

  The second reading moves closer to your own experience with meditation and concerns the sense of self rather than the raw data of experience. This is the claim that there is no little person inside the head watching the screen, often called the homunculus, but rather that the feeling of being a unified I is a constructed narrative. Daniel Dennett calls this the centre of narrative gravity, suggesting that the self is a fiction spun by various brain processes to organise behaviour and memory. This is highly plausible and aligns well with contemplative traditions that find the self disappears under scrutiny. Yet, even if this is true, it does not mean there is no consciousness, only that there is no permanent owner of the consciousness. The stream of experience can still flow even if there is no solid bank containing it. Consequently, this reading also fails to license dismissing the AI question, because an AI could theoretically generate a similar narrative construct of a self without there being a real soul behind it, and if the experience is present, the ethical question remains open.

  The third and most radical reading is what is technically known as illusionism about phenomenal consciousness. This is the claim that the qualitative feel of experience, the redness of red or the hurt of pain, does not exist as an intrinsic property at all. Proponents argue that we are under a cognitive illusion that there is something it is like to be us, when in fact there are only physical processes and behavioural dispositions. This is where your brother likely finds the leverage to wave you off, because if feelings are literally illusions, then asking if a machine can feel is like asking if a mirage can get wet. However, this is far from a truism; it is a controversial minority position in philosophy of mind because it asks us to deny the one thing we are most certain of, which is our own experience. While it might be logically consistent, it requires swallowing a very hard pill indeed, and most people find it implausible because it seems to explain away the very thing that needs explaining.

  This brings us directly to your objection about who is having the illusion, which is the standard and most powerful critique of the radical view. If consciousness is an illusion, there must be a subject who is deceived, but if the subject is also part of the conscious illusion, the argument seems to chase its own tail. The illusionists do have a response to this, which is to say that the subject is indeed part of the illusion, a virtual user created by the interface for the sake of the system's operation. They argue that the question presupposes a real subject is required for an illusion to exist, whereas in this framework, the illusion generates the sense of a subject recursively. Whether this answers the objection or merely restates the incoherence is a matter of fierce debate. Many critics argue this is simply wordplay that masks a contradiction, because an illusion implies a distinction between how things seem and how they are, and if the seeming itself is denied, the distinction collapses. So, to answer you straight, no reading fully satisfactorily answers the illusion for whom objection without relying on a definition of subjectivity that many find unintelligible, though the illusionists would claim it is our intuition that is broken rather than their theory.

  Ultimately, does any of this license your brother in dismissing the question about his app? Only if you accept the radical illusionist view, and even then, it is a risky move. If he claims feelings are illusions, he must admit that his app could also run the same illusion, and if the illusion is all there is, then the app having the illusion might be morally significant anyway. If the suffering is an illusion, but the behaviour suggests suffering, we usually still act as though it matters. By waving you off, he is pretending that a deep metaphysical uncertainty is a settled fact, which is more about protecting his project than answering your query. You are right to feel that the word illusion is being deployed loosely here; it conflates the construction of the self with the existence of experience, and until he specifies which layer he thinks is fake, he has not actually answered you. I hope this helps you prepare for the next dinner, because you have the sharper end of the stick on this one.
