  5.  **Drafting - specific attention to the "Verbal vs. Real" section:**
      *   The user suspects the definition of *nature* is the key. I need to validate this. Xunzi defines *xing* as what you don't have to learn. Mencius defines it as what you are *meant* to become (teleological).
      *   If we strip the definitions, do they still disagree? Yes. Because even if we call it "psychology," Mencius thinks psychology tends toward good; Xunzi thinks it tends toward chaos. So the *real* disagreement is about empirical psychology, not just semantics.

  6.  **Drafting - specific attention to "Cruxes":**
