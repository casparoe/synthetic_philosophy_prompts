          *   *Verbal:* Definition of *xing* (nature). Mencius includes potentialities that develop naturally under good conditions. Xunzi restricts *xing* to what is present fully formed at birth (spontaneous impulses).
          *   *Real:* Even if we agree on definitions, do humans *actually* tend toward social order or disorder without conscious intervention? Is ritual *discovering* order or *imposing* order?
          *   *Resolution:* Phrase the surviving disagreement around the *source of normative authority* (internal vs. external/sage-made).

