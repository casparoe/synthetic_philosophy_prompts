          *   *Challenge:* Word "Nature." Avoid defining it substantively here.

      *   **Section 2: Disagreements Table.**
          *   Need to phrase disagreements so each side recognizes their view.
          *   *Xunzi's View:* Avoid "evil." Use "untoward," "disorderly," "prone to conflict without guidance." Focus on *xing* (inborn spontaneity) vs. *wei* (deliberate effort).
          *   *Mencius's View:* Focus on innate moral sprouts (*duan*) that are robust enough to grow if not destroyed.
          *   *Key Conflict:* Is morality continuous with nature (Mencius) or a correction of nature (Xunzi)?

      *   **Section 3: Cruxes with Tests.**
          *   *Child at the Well:* Mencius sees *ren* (benevolence) sprout. Xunzi needs an alternative explanation (startle reflex? shared aversion to harm? not moral yet). Test: Is the reaction *normative* or just *psychological*?
