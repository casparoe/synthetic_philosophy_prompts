answer: |-
  # Q&A Strategy Sheet: Frege–Geach & Force-Neutral Expressivism

  **Context:** Departmental Colloquium
  **Audience Mix:** Formal Semanticists (Majority), Committed Expressivists (2), Senior Logician (1)
  **Goal:** Defend Generalization + Force-Neutral Solution without collapsing into Cognitivism.

  ---

  ### Pre-Emptive Concessions
  *State these clearly in your opening or early Q&A to disarm hostility:*
  1.  **Concede on Truth-Aptness:** Admit that if "truth-apt" just means "has a compositional semantic value," your view *is* cognitivist by that definition. You are arguing for a substantive distinction between *having a semantic value* and *representing a mind-independent fact*.
  2.  **Concede on Classical Logic:** Acknowledge that if validity is defined strictly as truth-preservation across possible worlds, you need a bridge principle. You are not saving classical validity *simpliciter*; you are saving the *structural form* of validity via a generalized consequence relation.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The "Collapse" Objection (From the Committed Expressivists)
  **Phrasing:** "If moral sentences, when embedded, take semantic values of the same type as descriptive propositions to satisfy compositionality, haven't you just surrendered the core expressivist insight? If the semantic value is proposition-like, what distinguishes your 'force-neutral expressivism' from standard cognitivism other than a label? You've solved Frege–Geach by ceasing to be an expressivist."
  **2-Minute Reply:** "The distinction lies in the *interpretation* of the semantic value, not its type. Cognitivism says the value represents a belief about the world. My view says the value represents a *constraint on plans* (or attitudes) that behaves propositionally under embedding. Think of it like dynamic semantics: an update potential has a compositional type but isn't a truth condition in the static sense. I'm offering a propositional *structure* for attitudes, not reducing attitudes to beliefs. The 'expression' happens at the pragmatic level of commitment, even if the semantics is uniform."
  **Soft Spot:** This relies heavily on the audience accepting a gap between semantic type and metaphysical commitment. If they press on what the "value" *is* (sets of worlds?), you risk looking like a realist.
  **Damage:** **Critical.** If this sticks, your thesis is "Expressivism is Cognitivism," which is not news.

  #### 2. The Model-Theoretic Challenge (From the Senior Logician)
  **Phrasing:** "You claim validity is recovered structurally. But model-theoretic validity is defined over truth conditions. If your moral clauses lack truth conditions, what are your models? If you assign them sets of worlds to make the logic work, aren't those just truth conditions by another name? You can't have coherent model theory without truth."
  **2-Minute Reply:** "We can decouple model-theoretic semantics from truth-conditional semantics. We can define a consequence relation over *commitment states* rather than world-sets. The 'models' are structures of consistent attitude sets. Validity is the preservation of *acceptability* or *coherence* across these states, not truth. It's analogous to intuitionistic logic or dynamic logic where the valuation function tracks information growth, not static correspondence."
  **Soft Spot:** The logician may view "coherence preservation" as insufficient for logical validity. You need to be ready to sketch the consequence relation formally.
  **Damage:** **High.** Threatens the formal coherence of Thesis 2.

  #### 3. The Compositionality Mechanism (From Formal Semanticists)
  **Phrasing:** "You say attitude-ascriptions get values of the same type as propositions. Precisely what is that type? Is it $\langle s, t \rangle$? If so, how does the *if*-operator combine with it differently than a descriptive clause? If you use a type-shift, where does it happen, and doesn't that reintroduce the ambiguity problem you claimed to solve?"
  **2-Minute Reply:** "The type is $\langle s, t \rangle$, but the intension is different. Descriptive clauses map worlds to truth values based on facts; moral clauses map worlds to truth values based on *normative standards* fixed by the context. The *if*-operator is polymorphic: it checks for compatibility of the antecedent's content with the consequent's content, regardless of whether that content is factual or normative. No type-shift is needed during embedding; the shift happens at the root assertion level (force)."
  **Soft Spot:** "Normative standards fixed by context" sounds suspiciously like a hidden parameter in the truth condition. Be prepared to define the "normative standard" parameter rigorously.
  **Damage:** **Medium-High.** Technical credibility hinges on this.

  #### 4. The Generalization Scope (From Semanticists/Philosophers)
  **Phrasing:** "You argue FG is general (modals, probability). But epistemic modals arguably *do* have truth conditions (e.g., informational states). Moral claims don't. Isn't this a false analogy? If modals are truth-apt and morals aren't, your generalization fails."
  **2-Minute Reply:** "Recent work on epistemic modals (e.g., Yalcin, Kolodny) suggests they also fail classical embedding tests (e.g., 'It's raining and it might not be'). The 'truth' of a modal is often context-relative in a way that parallels moral claims. The structural problem is identical: classical logic breaks when the content is not a static world-set. Whether modals are 'really' truth-apt is less important than that they *behave* like moral claims in embedding contexts."
  **Soft Spot:** If the audience are staunch contextualists about modals, they won't buy the analogy.
  **Damage:** **Medium.** Weakens Thesis 1 but leaves Thesis 2 intact.

  #### 5. The "Loss of Normativity" Objection (From Expressivists)
  **Phrasing:** "Expressivism explains the *action-guiding* nature of moral language. If you give moral sentences propositional values, how do you recover the internal link to motivation? Propositions don't motivate; attitudes do. You've fixed the logic but killed the normativity."
  **2-Minute Reply:** "The semantic value captures the *content* of the judgment, not its *force*. The link to motivation is preserved in the speech act type. Asserting a moral proposition *is* expressing a plan-laden attitude. The semantics handles the embedding; the pragmatics handles the motivation. We don't need the semantics to do the work of moral psychology."
  **Soft Spot:** This bifurcation (semantics vs. pragmatics) is where many expressivist projects fracture.
  **Damage:** **Medium.** Challenges the philosophical payoff.

  #### 6. The "Force-Neutrality" Definition (From General Audience)
  **Phrasing:** "What does 'force-neutral' actually mean technically? Is it that the semantic value is independent of illocutionary force? If so, how does that differ from the standard proposition? If not, what is it?"
  **2-Minute Reply:** "It means the semantic value is computable without knowing if the sentence is asserted, questioned, or embedded. Standard propositions are force-neutral in this sense. My claim is that *attitudes* can also be force-neutral contents. The 'force' is the relation the agent bears to that content (e.g., endorsing a plan vs. believing a fact)."
  **Soft Spot:** Risks sounding like verbal window-dressing.
  **Damage:** **Low-Medium.** Clarification request.

  #### 7. Advantage Over Quasi-Realism (From Expressivists)
  **Phrasing:** "Blackburn's quasi-realism already earns the right to logical validity through logical expressivism. Why is your 'force-neutral' machinery superior to the quasi-realist project?"
  **2-Minute Reply:** "Quasi-realism often relies on complex pragmatic explanations for validity (e.g., consistency of attitudes). My view locates validity in the *semantics* directly. It's more parsimonious: we don't need to explain away the logic; we just assign values that make the logic work. It treats moral language as semantically integrated, not pragmatically repaired."
  **Soft Spot:** Quasi-realists will argue their view is more faithful to the anti-realist spirit.
  **Damage:** **Low.** Comparative advantage question.

  #### 8. The "Hope Nobody Asks" Question
  **Phrasing:** "If the semantic value of a moral claim is a proposition-like object, what determines its correctness? If it's not the world, and it's not just coherence of attitudes, is there a fact of the matter? If yes, you're a realist. If no, isn't validity trivial?"
  **2-Minute Reply:** (Have this prepared, but hope they don't dig this deep into metaphysics). "Correctness is determined by the normative standards of the context, which are objective relative to the practice. It's not metaphysical realism, but it's not mere subjectivity either. It's a form of constructivism."
  **Soft Spot:** This opens the door to a metaphysical debate you likely don't have time to win.
  **Damage:** **High (if pursued).**

  ---

  ### The Single Reply That Must Land
  **Target:** Objection #1 (The "Collapse" Objection).
  **Why:** The two committed expressivists are your toughest critics on identity. If they leave the room believing you are just a cognitivist in disguise, your "Expressivism" thesis fails. The semanticists don't care about the label, and the logician doesn't care about the history. But if the expressivists reject your view, you lose the "Expressivist" part of "Force-Neutral Expressivism."
  **Strategy:** Do not get bogged down in metaphysics. Keep the distinction strictly *functional*.
  **Key Line to Hit:** "Cognitivism says moral sentences *describe* beliefs. My view says they *encode* plans with propositional structure. The math looks the same; the psychology is different. That difference is sufficient to save expressivism."

  ### Final Advice
  The semanticists will forgive metaphysical vagueness if the compositionality is clean. The logician will forgive expressivist labeling if the models are rigorous. The expressivists will forgive formal novelty if the anti-realist spirit remains. **Prioritize the Expressivists.** If you lose them, you're just a cognitivist giving a talk to semanticists. If you keep them, you've shifted the paradigm.
