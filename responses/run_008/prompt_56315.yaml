answer: |-
  Here is the draft for the blog post. I've kept the tone conversational but precise, added two cases (Silence and Scope) to round out the theoretical coverage, and built the scoring key to do the heavy lifting you asked for.

  ***

  # Quiz: What's Your Theory of Consent? (Without the Jargon)

  We talk about consent all the time. Gym contracts, medical procedures, dating, renting apartments. But when we say someone "didn't really consent," what do we actually mean?

  Do we mean they were tricked? Pressured? Or that they just aren't allowed to make that kind of choice?

  Most people have a mix of intuitions. You might think a lie about a medical risk ruins consent, but a lie about a job title doesn't. You might think a mugger invalidates your agreement, but a landlord raising rent doesn't. That's fine. But those splits reveal a specific ethical framework, even if you don't know the name for it.

  Below are 12 scenarios. For each, pick the verdict that matches your gut. Don't overthink it. The goal isn't to get the "right" answer; it's to see which pattern you naturally fall into.

  **The Options:**
  To keep this clean, most questions use these three verdicts. Pick the one that fits best.
  *   **(A) The Agreement Stands:** They agreed, and that's the end of it. Nothing wrong happened.
  *   **(B) The Agreement Stands, But…:** They did agree (so technically consent happened), but the other person lied, pressured, or treated them badly.
  *   **(C) The Agreement Doesn't Count:** The consent was defective. It's as if they never agreed at all.
  *(Note: In cases about age or capacity, Option C implies someone else should decide for them.)*

  ---

  ### The Deception Cases
  *Does a lie ruin the agreement, or just make the liar a jerk?*

  **1. The Experimental Surgery**
  A surgeon tells a patient a procedure is "routine." It is actually experimental with a much higher complication rate. The patient agrees. The surgery goes fine.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the surgeon lied.
  *   (C) Agreement Doesn't Count. No consent happened.

  **2. The Wedding Ring**
  A woman sleeps with a man who has taken off his wedding ring and told her he's single. He is married.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But he lied.
  *   (C) Agreement Doesn't Count. No consent happened.

  **3. The Clinical Trial**
  A participant signs up after a researcher explains "randomization" so badly that the participant walks away thinking he'll personally get whichever treatment turns out best for him.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the researcher was negligent.
  *   (C) Agreement Doesn't Count. No consent happened.

  **4. The Hidden Gene Scan**
  A patient consents to a "body scan" without knowing its actual purpose is to check whether she carries a gene for a disease she's explicitly said she doesn't want to know about.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the hospital violated her wishes.
  *   (C) Agreement Doesn't Count. No consent happened.

  **5. The Risk Percentage**
  Someone donates a kidney after being told the complication risk is 1% when it's really 3%.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the doctor lied about the stats.
  *   (C) Agreement Doesn't Count. No consent happened.

  **11. The Silent Diagnosis (New)**
  A sexual partner doesn't mention they have a manageable but transmissible infection. You didn't ask, and they didn't volunteer the info.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But they should have told you.
  *   (C) Agreement Doesn't Count. No consent happened.

  ### The Pressure Cases
  *When does a hard choice become a forced one?*

  **6. The Mugger**
  "Your money or your life." You hand over your wallet.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the mugger threatened you.
  *   (C) Agreement Doesn't Count. You were forced.

  **7. The Landlord**
  A landlord tells a tenant the rent is doubling next month. Pay up or move out. It's legal, but she'll be much worse off either way.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the rent hike is exploitative.
  *   (C) Agreement Doesn't Count. She was forced.

  **8. The Coach**
  A coach tells an athlete: "Sleep with me or you're off the team." He genuinely has the authority to cut her from the team.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the coach abused his power.
  *   (C) Agreement Doesn't Count. She was forced.

  ### The Capacity Cases
  *Who gets to decide?*

  **5. The Tipsy Gym-Goer**
  A slightly tipsy person (coherent, not staggering, maybe two glasses past the driving limit) signs a gym membership with a nasty cancellation clause she would've spotted sober.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But the gym took advantage of her.
  *   (C) Agreement Doesn't Count. She wasn't in a state to agree.

  **10. The Teen Refusal**
  A mature-for-her-age 14-year-old refuses a blood transfusion for religious reasons. The hospital believes the treatment is life-saving.
  *   (A) Agreement Stands. Her refusal rules.
  *   (B) (Skip this option)
  *   (C) Agreement Doesn't Count. The hospital should override her.

  **12. The Scope Creep (New)**
  You let a friend borrow your car to "run an errand." You didn't specify where. They drive it across state lines, which you would have forbidden if asked.
  *   (A) Agreement Stands. All good.
  *   (B) Agreement Stands, But they pushed the boundaries.
  *   (C) Agreement Doesn't Count. They went outside the consent given.

  ---

  ## The Scoring Key

  Don't just count up the A's and C's. The pattern matters more than the score. Here is what your mix of answers says about the theory you're actually using.

  ### 1. The "Nature of the Act" View (The Formalist)
  *   **Your Pattern:** You picked **(C) Doesn't Count** on the Surgery (1) and maybe the Gene Scan (4), but **(B) Stands But…** on the Risk Percentage (5), the Wedding Ring (2), and the Silent Diagnosis (11).
  *   **What You Believe:** You think consent is only invalidated by lies about *what is physically happening to you*. If I think I'm getting a massage and you stab me, that's not consent. But if I agree to the massage because you lied about the price, your qualifications, or your marital status, I still consented—you just lied to get it.
  *   **The Blind Spot:** This view struggles to explain why the Gene Scan (4) feels worse than the Risk Percentage (5). Both are lies about consequences, not the physical act of scanning.

  ### 2. The "Decision-Relevant" View (The Protectionist)
  *   **Your Pattern:** You picked **(C) Doesn't Count** on almost all the deception cases (1, 2, 3, 4, 5, 11).
  *   **What You Believe:** You think consent is about the *decision*, not just the physical act. If a piece of information would have changed your mind, hiding it voids the agreement. To you, a "yes" based on a lie isn't a real "yes."
  *   **The Trouble:** This makes consent very fragile. If I lie about my income to get a date, does that void consent to sex? If I exaggerate my GPA to get a job, is my employment contract void? You have to draw a line somewhere, or no agreement is ever safe.

  ### 3. The "Rights-Based" Coercion View
  *   **Your Pattern:** You picked **(C) Doesn't Count** on the Mugger (6) and the Coach (8), but **(B) Stands But…** on the Landlord (7).
  *   **What You Believe:** You distinguish between *threats* and *offers* based on whether the person has a *right* to do what they're proposing. A mugger has no right to shoot you; a coach has no right to demand sex for playing time. But a landlord *does* have a right to raise rent (within the lease). Therefore, the landlord's offer is a hard choice, but not coercion.
  *   **The Rival:** People who picked **(C)** on the Landlord case usually hold a "Baseline" view: if the proposal leaves you worse off than you were before (or worse off than is morally acceptable), it's coercion, regardless of legal rights.

  ### 4. The "Threshold" vs. "Sliding Scale" Competence
  *   **Your Pattern:**
      *   **Threshold:** If you picked **(C)** on the Tipsy Gym-Goer (5) but **(A)** on the Teen (10), you likely view competence as a status (Age) or a binary state (Sober vs. Tipsy).
      *   **Sliding Scale:** If you picked **(A)** on the Tipsy Gym-Goer (low stakes) but **(C)** on the Teen (high stakes/life-saving), you treat competence as relative to the decision. You think we should be allowed to make risky mistakes about gym contracts, but not about life and death.
  *   **The Tension:** If you treat the Teen as incompetent because the stakes are high, consistency demands you treat the Tipsy person as incompetent if the gym contract is financially ruinous.

  ---

  ## Two Honest Limitations of This Quiz

  I want to be transparent about what this quiz *can't* tell you. There are theoretical divides that these cases won't expose.

  **1. The "Libertarian" vs. "Waiver" Indistinguishability**
  If you answered **(A) Agreement Stands** on almost everything (including the Risk Percentage and the Landlord), you might be a Libertarian (people should bear the consequences of their choices) OR you might view Consent purely as a Waiver of Rights (once I say yes, I waive my right to complain).
  *   **Why we can't tell:** On these specific cases, both theories produce the exact same verdicts. To separate them, we'd need a case where someone waives a right they *can't* legally waive (like consenting to be seriously maimed).

  **2. The "Moralized" Baseline Problem**
  In the Coercion section (Mugger vs. Landlord), I can't tell if you think the Landlord's offer is coercive because it's *immoral* or because it *threatens your baseline*.
  *   **Why we can't tell:** Most people agree the Mugger is wrong and the Landlord is legal. To really test this, I'd need a case like: "I will tell your spouse you cheated unless you pay me." That's legal (in some places) but immoral. If you call that coercion, you hold a "Moralized Baseline" view. If you call it a valid offer, you hold a "Legal Baseline" view. I left that out to keep the quiz everyday-friendly, but it means I can't fully sort your coercion theory.

  ## The "Impossible" Combinations

  Finally, if your answers look like one of these combinations, you might want to check your logic. These aren't necessarily "wrong," but they are theoretically unstable.

  **1. The Mugger Exception**
  *   **The Combo:** Picking **(A) Agreement Stands** on the Mugger (6).
  *   **Why it's weird:** Almost no theory of consent treats a threat of death as valid consent. If you picked this, you might be interpreting "Agreement Stands" as "The transaction is over and done with" rather than "The consent was morally valid."

  **2. The Landlord Reversal**
  *   **The Combo:** Picking **(C) Doesn't Count** on the Landlord (7) but **(A) Agreement Stands** on the Coach (8).
  *   **Why it's weird:** The Coach case involves a fiduciary relationship (authority over a person) and sexual demands. The Landlord is a market transaction. Usually, if you think market pressure invalidates consent (Landlord), you definitely think abuse of authority invalidates consent (Coach). Doing the reverse suggests you might be reacting to the "sex" part of the Coach case rather than the consent structure.

  **3. The Risk/Reward Mismatch**
  *   **The Combo:** Picking **(C) Doesn't Count** on the Tipsy Gym-Goer (5) but **(A) Agreement Stands** on the Teen Refusal (10).
  *   **Why it's weird:** This implies you think a slightly tipsy adult can't sign a contract, but a 14-year-old can refuse life-saving medical care. This is a defensible position (Age Bright Lines), but it requires you to believe that turning 18 magically grants competence that a mature 14-year-old lacks, while alcohol temporarily removes it entirely. It's a common legal stance, but ethically inconsistent.

