answer: |-
  # Seminar Plan: The Promotions Paradox

  **Course:** Third-Year Seminar in Collective Decision-Making (Philosophy/PPE)
  **Class Size:** 14 students
  **Duration:** 75 minutes
  **Topic:** Judgment Aggregation and the Discursive Dilemma

  ## 1. Learning Objectives
  By the end of the session, students will:
  1.  Experience firsthand how different aggregation rules (premise-based vs. conclusion-based) yield contradictory outcomes from identical individual judgements.
  2.  Recognise that the choice of decision procedure is itself a substantive political decision.
  3.  Understand the basic intuition behind impossibility results in judgment aggregation without requiring formal logic.

  ## 2. Materials Preparation
  You will need to print **14 Confidential Role Cards** (cut them out beforehand). Do not reveal the distribution logic to the class.

  **The Case:** Dr Alex Morgan is up for promotion from Senior Lecturer to Reader.
  **The Rule:** University statutes state a candidate is promoted **if and only if** they pass on all three criteria: **Research**, **Teaching**, and **Service**.

  **Distribution of Views (14 Students):**
  *   **Group A (6 students):** Research: **Yes**, Teaching: **Yes**, Service: **Yes**. *(Overall: Promote)*
  *   **Group B (3 students):** Research: **Yes**, Teaching: **Yes**, Service: **No**. *(Overall: Reject)*
  *   **Group C (3 students):** Research: **Yes**, Teaching: **No**, Service: **Yes**. *(Overall: Reject)*
  *   **Group D (2 students):** Research: **No**, Teaching: **Yes**, Service: **Yes**. *(Overall: Reject)*

  **Mathematical Check:**
  *   **Research Yes:** 6 (A) + 3 (B) + 3 (C) = **12** (Majority Pass)
  *   **Teaching Yes:** 6 (A) + 3 (B) + 2 (D) = **11** (Majority Pass)
  *   **Service Yes:** 6 (A) + 3 (C) + 2 (D) = **11** (Majority Pass)
  *   **Promote Yes:** 6 (A) = **6** (Minority Fail; 8 vote Reject)

  ---

  ## 3. Run Sheet (75 Minutes)

  ### Phase 1: Setup and Round 1 (Conclusion-Based) [00:00 – 00:20]
  **Instructions (5 mins):**
  *   Seat the 14 students around a single table (or arranged as a committee).
  *   Hand out the Role Cards. Emphasise: *"This is confidential. Do not show your card to anyone. Your card represents your honest assessment of Dr Morgan's file."*
  *   **Task:** "You are the Promotions Committee. Your first task is to vote on the **final motion**: *'That Dr Morgan be promoted.'* Discuss for 5 minutes, then vote by secret ballot."
  *   **Crucial Constraint:** Instruct them to vote based on their *overall judgement* derived from their card. They should not explicitly reveal their specific premise scores yet, just argue for their conclusion.

  **Deliberation & Vote (10 mins):**
  *   Allow brief discussion. Students will argue from their perspectives (e.g., Group B will hammer Service issues).
  *   Collect votes.
  *   **Outcome:** 6 Yes, 8 No. **Motion Fails.**
  *   Record the result on the board anonymously.

  ### Phase 2: Round 2 (Premise-Based) [00:20 – 00:40]
  **Instructions (5 mins):**
  *   "We are now going to rerun the decision, but the University Senate has changed the procedure. You are no longer permitted to vote on the promotion directly. Instead, you must vote on each criterion separately. The promotion is granted *automatically* by the chair if and only if all three criteria pass by majority vote."
  *   **Crucial Constraint:** "You must vote on each premise according to the specific view on your card, regardless of what you think the final outcome should be."

  **Deliberation & Vote (10 mins):**
  *   Vote on Research. (Expect ~12 Yes).
  *   Vote on Teaching. (Expect ~11 Yes).
  *   Vote on Service. (Expect ~11 Yes).
  *   **Announce Result:** "All three criteria have passed by majority vote. Therefore, under these rules, Dr Morgan is **Promoted**."

  **The Reveal (5 mins):**
  *   Ask for a show of hands: "Who is unhappy with this outcome?" (Groups B, C, D will raise hands).
  *   Ask: "Who is unhappy with the *first* outcome?" (Group A will raise hands).
  *   Point out: "We have the same committee, the same opinions, and the same rules on promotion, yet we have opposite verdicts."

  ### Phase 3: Round 3 (Procedural Choice) [00:40 – 00:55]
  **Instructions:**
  *   "You now know the two procedures yield opposite results. You must decide which procedure the committee *ought* to use for future cases. You may discuss freely."
  *   Let them debate the merits of integrity (premise-based) vs. holistic judgement (conclusion-based).
  *   Take a final vote on which *procedure* to adopt.

  ### Phase 4: Debrief [00:55 – 01:15]
  **Mapping the Theory (10 mins):**
  *   Now you may name the concepts.
  *   **Conclusion-Based Aggregation:** Round 1. We aggregate the final judgements. Respects individual holistic integrity but can ignore the logical structure of the decision.
  *   **Premise-Based Aggregation:** Round 2. We aggregate the reasons. Ensures logical consistency (if premises pass, conclusion follows) but can force a conclusion that no majority actually supports (in this case, 8/14 members voted against promotion initially).
  *   **The Discursive Dilemma:** Explain that this is a specific instance of the **Doctrinal Paradox**.
  *   **Impossibility:** Briefly mention List and Pettit (2002). There is no aggregation method that satisfies minimal conditions of rationality, anonymity, and systematicity without running into this problem in some cases. Choosing a procedure is not a technical fix; it is a political choice about what kind of rationality the group values.

  **Limitations (5 mins):**
  *   Be honest: Real committees talk more than they vote. Deliberation can change preferences (which this exercise holds fixed).
  *   Real criteria are weighted, not binary pass/fail.
  *   Chairs often have casting votes or agenda-setting power, which alters the dynamic.

  ---

  ## 4. Troubleshooting: Predictable Failures

  Even with careful planning, third-year philosophy students are adept at finding loopholes. Here is how to handle the three most likely disruptions.

  ### 1. The Strategic Voter
  **The Problem:** During Round 2 (Premise Vote), a student in Group B (who wants Reject) realises that voting sincerely on 'Service' (No) will be outvoted, leading to a Promotion they oppose. They decide to lie on a different premise (e.g., vote 'No' on Research) to block the promotion, despite their card saying 'Yes'.
  **Why it happens:** They prefer the outcome of the Conclusion Vote and view the Premise Vote as a means to an end.
  **How to Handle:**
  *   **In the moment:** If you spot this during the vote count (e.g., Research votes drop unexpectedly), do not call them out publicly. Note it mentally.
  *   **In the debrief:** This is a goldmine. Raise it: *"Did anyone feel tempted to vote strategically on a premise to secure their preferred conclusion?"* Use this to introduce the concept of **manipulability**. Explain that premise-based procedures are vulnerable to strategic voting on premises, just as conclusion-based procedures are vulnerable to tactical voting on the outcome. This reinforces the impossibility point: no rule is strategy-proof.

  ### 2. The Holistic Resister
  **The Problem:** A student refuses to compartmentalise in Round 2. They say, *"I cannot vote Yes on Research if I believe the candidate should not be promoted. It feels dishonest."*
  **Why it happens:** They view the 'Promotion' judgement as primary and the premises as merely supportive reasons that can be overridden by holistic intuition.
  **How to Handle:**
  *   **In the moment:** Gently enforce the experimental constraint. *"I understand this feels artificial. For this round, please treat your card as a set of logical constraints imposed by the Senate. We need to see what the mechanism produces, even if it feels uncomfortable."*
  *   **In the debrief:** Validate their intuition. This resistance highlights the tension between **collective rationality** (logical consistency across propositions) and **individual integrity** (voting one's conscience on the main issue). This maps onto the philosophical debate about whether groups can be agents in their own right, distinct from their members.

  ### 3. The Deliberation Dominator
  **The Problem:** One or two vocal students realise the mathematical structure early (perhaps they spot the distribution pattern) and steer the Round 1 discussion to ensure the 'correct' paradoxical outcome, or try to convince others to change their views entirely.
  **Why it happens:** PPE students often enjoy 'solving' the seminar.
  **How to Handle:**
  *   **In the moment:** If they try to reveal their card data ("Well, if we all have different failures..."), interrupt politely. *"Please keep your specific scores confidential for this round. We are testing how the group decides without full information transparency."*
  *   **In the debrief:** Acknowledge their insight. *"If you spotted the structure, you've essentially reverse-engineered the Discursive Dilemma."* Use this to discuss **agenda setting**. If someone knows the structure, they can choose the procedure that benefits their side. This proves the core lesson: procedure is power.

  ---

  ## 5. Role Cards (Template for Printing)

  *Print 14 copies, cut, and distribute randomly.*

  ***

  **CONFIDENTIAL: COMMITTEE MEMBER BRIEFING**
  **Candidate:** Dr Alex Morgan
  **Your Role:** You are a senior member of the Promotions Committee.
  **Instruction:** Do not show this card to anyone.

  **Your Judgements:**
  1.  **Research Record:** [ YES / NO ]
  2.  **Teaching Performance:** [ YES / NO ]
  3.  **Service Contribution:** [ YES / NO ]

  **Your Overall View:**
  Based on the three criteria above, do you support Dr Morgan's promotion?
  **[ YES / NO ]**

  *(Note: In Round 1, vote on your Overall View. In Round 2, vote on each criterion individually according to the boxes above.)*

  ***

  *(Fill in the boxes according to the Group distribution in Section 2 before cutting)*

  *   **6 Cards:** Yes / Yes / Yes / **Yes**
  *   **3 Cards:** Yes / Yes / No / **No**
  *   **3 Cards:** Yes / No / Yes / **No**
  *   **2 Cards:** No / Yes / Yes / **No**

  ---

  ## 6. Instructor's Note on British English Usage
  Ensure all verbal instructions and written materials adhere to British English conventions to maintain consistency with your department's standards.
  *   Use **programme** (not program).
  *   Use **centre** (not center).
  *   Use **realise** (not realize).
  *   Refer to **marking** rather than grading.
  *   Refer to the **university** rather than college (unless at Oxford/Cambridge, in which case adjust 'University Senate' to 'Congregation' or similar if you wish to be hyper-local, but 'University' is safer for a general template).
  *   Ensure the tone is collegial but authoritative; you are the Chair of the Committee during the exercise.

  ## 7. Closing Thought for the Debrief
  End the session by leaving them with this question: *"If no aggregation rule is perfect, on what grounds should we choose one over the other? Is it a matter of truth, or a matter of legitimacy?"* This sets up the next week's reading on democratic authority nicely.
