prompt: |-
  I do risk analysis at a small think tank that gets contracted by a government office to write medium-term forecasts — energy, pandemics, great-power conflict, that sort of thing. Nothing classified, just structured judgment, and we deliver maybe six reports a year. Increasingly my colleagues' drafts are full of reasoning that I've come to realize is self-locating belief dressed up as ordinary updating, and nobody here has a rule for when it's allowed. Examples that have actually come up in drafts: (a) someone lowered our estimate of great-power war because humanity has survived 70 years with nuclear weapons, so the annual risk must be lower than the modelers fear — survivorship treated as evidence of safety; (b) a paragraph that dragged our forecast of civilizational lifespan way down by appealing to a version of the doomsday argument, on the grounds that we find ourselves early in the human sequence; (c) a pandemic chapter that reasoned roughly 'given that I'm observing this outbreak at all, it's more likely to be a big one', which is basically the logic that makes the Sleeping Beauty problem disagree with itself depending on whether you count experiments or awakenings.

  So here's the ask: turn whatever the philosophy of anthropic and self-locating reasoning has actually settled — plus whatever it hasn't — into a procedure I can run on a draft paragraph in fifteen minutes. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a 'strike this inference', and where it has to hand the call back to a human because the question is one of values or of choosing between frameworks rather than of facts. I want the distinctions that must survive simplification to survive: plain evidence vs. indexical evidence, whether the observer was guaranteed to be around to make the observation (the reason survival data can be treacherous — you only hear from the worlds that got to write the report), whether the sampling setup is more like one experiment or many awakenings, and the fork where a draft has to either flag its assumption or drop the inference entirely. And be honest about which steps of my so-called procedure are really judgment calls in a costume.

  One constraint: our director signs off on every report, and she has zero patience for jargon, so the procedure can't require whoever runs it to know what any of the abbreviations stand for — it has to be self-contained, a checklist a smart person with no philosophy background can follow.

  Then run it on three cases. First, the nuclear-survival inference in (a). Second, the doomsday-argument paragraph in (b) — and include one where the procedure gives an answer I won't like, because I suspect it's that our near-miss anecdotes can't straightforwardly lower our war estimates, and I'd rather find that out now than in review. Third, the outbreak-observation reasoning in (c). Finally, tell me plainly what the procedure can't do at all — where this whole body of theory is silent and the honest move is a footnote saying so, not a paragraph pretending otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Risk analyst at a small think tank.
      *   **Task:** Create a 15-minute checklist/procedure to identify and evaluate "self-locating belief" (anthropic reasoning) errors in forecasting drafts.
      *   **Context:** Government contracts, medium-term forecasts (energy, pandemics, conflict), unclassified, structured judgment.
      *   **Problem:** Colleagues are using anthropic reasoning (survivorship bias, Doomsday Argument, observation selection effects) incorrectly or without explicit justification.
      *   **Constraints:**
          *   Must be usable by a smart person with *no philosophy background* (no jargon like "SSA," "SIA," "indexical," "Bayesian updating").
          *   Must distinguish plain evidence vs. self-locating evidence.
          *   Must handle the "guaranteed observer" problem (survivorship bias).
          *   Must distinguish "one experiment" vs. "many awakenings" (Sleeping Beauty style).
          *   Must identify where a judgment call/framework choice is needed vs. a factual error.
          *   Must be honest about limitations (where the procedure can't help).
          *   Must apply the procedure to three specific cases: (a) Nuclear survival, (b) Doomsday Argument, (c) Pandemic observation.
          *   **Crucial:** Include a case where the procedure gives an answer the user *won't like* (specifically regarding nuclear near-misses).

  2.  **Deconstruct the Philosophy (for the Procedure):**
      *   *Core Issue:* Anthropics deals with how being an observer affects probability estimates.
      *   *Key Distinction 1:* Is the observation possible in all scenarios, or only in some? (Observation Selection Effect).
      *   *Key Distinction 2:* Are we counting *worlds* or *observer-moments*? (Reference Class).
      *   *Key Distinction 3:* Is the fact "I exist" new evidence, or a precondition for asking the question?
      *   *Consensus:* There is *no* consensus on the "correct" anthropic principle (SSA vs. SIA vs. FNC, etc.). However, there *is* consensus on when *not* to use it (e.g., ignoring survivorship bias).
      *   *Strategy:* The procedure shouldn't try to solve the Doomsday Argument. It should try to flag when an argument *relies* on anthropics and force the author to justify the reference class or drop the claim. It needs to catch "soft" anthropic errors (like survivorship bias) as hard errors.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask if it's anthropic. Ask if it's SSA or SIA. Check for survivorship bias.
      *   *Critique 1:* Too much jargon. "Anthropic" is okay, but SSA/SIA is not.
      *   *Attempt 2 (Mental):* 1. Did they use "we are here" as evidence? 2. Could they have observed the opposite? 3. Is it a one-off or repeated?
      *   *Refinement:* Needs to be a flowchart style. Needs to separate "Hard Stop" (logical error) from "Flag for Review" (framework choice).
      *   *Terminology:* Instead of "Indexical," use "Self-Referential." Instead of "Observation Selection Effect," use "Visibility Rule." Instead of "Reference Class," use "Comparison Group."

      *   *Step 1: The "Could We Have Seen Otherwise?" Test.* (Detects Observation Selection Effects/Survivorship Bias). If the answer is "No, we wouldn't be here to see it," it's not standard evidence.
      *   *Step 2: The "Counting" Test.* (Detects Doomsday/Sleeping Beauty issues). Are we counting scenarios or observer moments?
      *   *Step 3: The "New Information" Test.* Is "I am observing this" actually new info, or just a condition of the report?
      *   *Decision Rule:* If Step 1 fails -> Strike or heavily qualify. If Step 2 is ambiguous -> Flag for Director (Value/Framework choice).

  4.  **Refining the Procedure for the User's Constraints:**
      *   Must be 15 minutes.
      *   Must be jargon-free.
      *   Must explicitly state where it's a judgment call.
      *   *Honesty Check:* I need to admit that anthropics is unresolved. The procedure can't *solve* the Doomsday Argument; it can only flag it as controversial.

  5.  **Developing the Three Cases:**
      *   *Case A (Nuclear Survival):* This is classic Survivorship Bias. The procedure should flag this as a "Hard Stop" or require massive qualification. The user hinted they might not like the answer (that near-misses don't lower risk estimates easily). I need to ensure the procedure reflects the standard statistical view: survival is not strong evidence of safety if observation requires survival.
      *   *Case B (Doomsday):* This is the controversial one. The procedure should flag this as "Framework Choice." It's not a factual error, but it's not standard forecasting either. It requires a disclaimer.
      *   *Case C (Pandemic):* This is an Observation Selection Effect (detectability). If we only see big outbreaks, we can't estimate small ones. The procedure should catch this as a sampling bias.

  6.  **Addressing the "Answer I Won't Like":**
      *   The user suspects the procedure will say "near-miss anecdotes can't straightforwardly lower our war estimates."
      *   I need to make sure the procedure *does* say that. Survival bias is a logical trap. If you only count worlds where you exist, you can't use existence to prove safety. I will ensure the "Visibility Rule" catches this.

  7.  **Finalizing the "What It Can't Do" Section:**
      *   Anthropics doesn't tell us the *prior* probability of doom.
      *   It doesn't resolve the SSA vs. SIA debate.
      *   It doesn't replace domain expertise (e.g., knowing missile launch protocols).

  8.  **Writing the Response:**
      *   *Tone:* Professional, direct, respectful of the user's expertise, honest about philosophical uncertainty.
      *   *Structure:*
          1.  Introduction (acknowledging the difficulty).
          2.  The Procedure (The "Observer Check").
          3.  Application to Cases (A, B, C).
          4.  Limitations (The "Silence").
      *   *Self-Correction during drafting:* Make sure I don't use words like "indexical" or "Bayesian" in the checklist itself. Keep it plain English. Ensure the distinction between "Strike" (logical error) and "Flag" (philosophical disagreement) is clear.

      *(Self-Correction on Case A)*: The user said "someone lowered our estimate... because humanity has survived." The standard statistical view is that this is weak evidence at best, often null, due to the selection effect. I need to be firm here. The procedure should treat this as a "Strike unless qualified" because it treats a precondition (survival) as data (safety).

      *(Self-Correction on Case B)*: The Doomsday Argument is highly controversial. The procedure shouldn't say "This is wrong." It should say "This relies on a contested assumption about how to count people. Flag for Director."

      *(Self-Correction on Case C)*: "Given I'm observing this, it's likely big." This is detection bias. If small outbreaks don't get reported, observing one makes it likely to be big *relative to the reported set*, but not necessarily the *true set*. The procedure needs to distinguish between "observed frequency" and "actual frequency."

  9.  **Final Polish:** Check against the 15-minute constraint. The checklist should be short (5-6 questions). Ensure the "Honesty" section is prominent.

  *(Final thought on the "Answer I Won't Like"):* The user wrote: "I suspect it's that our near-miss anecdotes can't straightforwardly lower our war estimates, and I'd rather find that out now than in review."
  Okay, I need to make sure the procedure validates this suspicion. The "Visibility Rule" is the key. If we wouldn't be here to write the report in the bad scenario, our presence isn't evidence against the bad scenario. I will make this explicit in the Case A analysis.

  Let's build the "Observer Check" protocol.

  *   **Q1: The Visibility Test.** (Could we have seen the opposite?)
  *   **Q2: The Source Test.** (Is the data coming from the event or the observer?)
  *   **Q3: The Counting Test.** (Are we counting worlds or experiences?)
  *   **Q4: The Novelty Test.** (Is "being here" new info?)
  *   **Decision Matrix.**

  Okay, ready to write.s
answer: |-
  Here is a procedure designed for your constraints. It strips out the philosophy jargon while keeping the logical distinctions that matter for forecasting. It is designed to be run by a senior analyst who knows the subject matter but not the metaphysics.

  ### The "Observer Check" Protocol
  **Time limit:** 15 minutes per paragraph/claim.
  **Goal:** Identify when a forecast relies on *our presence* as evidence, rather than *external data*.

  **Instructions:** Read the specific paragraph making the probabilistic claim. Answer the four questions below in order. If you answer "No" to Question 1, stop and read the "Hard Stop" rule. If you answer "Yes" to Question 1 but hit a "Flag" in Questions 2–4, escalate to the Director.

  #### Q1: The Visibility Test
  **Question:** If the dangerous/rare event *had* happened (e.g., nuclear war, extinction, total system failure), would we still be here to write this report and observe the data?
  *   **Yes:** We would still exist to observe the outcome (e.g., forecasting next year's GDP).
  *   **No:** Our ability to observe the data depends on the event *not* happening (e.g., forecasting the risk of extinction based on the fact we are still here).

  > **HARD STOP RULE:** If you answered **No**, you cannot use our current survival as proof that the risk is low. This is like a lottery winner claiming they won because they are holding a ticket.
  > *   **Action:** **Strike the inference.** You may state the survival fact, but you cannot use it to *lower* the probability of the risk. You must add a footnote: *"This data suffers from selection bias; we only observe worlds where survival occurred."*
  > *   **Why:** This is not a philosophical debate; it is a statistical error.

  #### Q2: The Counting Test
  **Question:** Is the argument based on *where* or *when* we find ourselves in a sequence (e.g., "we are early in human history," "this is the 10th outbreak")?
  *   **No:** The argument is based on physical mechanisms (e.g., "missile accuracy improved").
  *   **Yes:** The argument relies on our position in a timeline or sequence of observers.

  > **FLAG FOR DIRECTOR:** If **Yes**, this is a framework choice, not a fact.
  > *   **Action:** Do not strike, but **highlight in yellow**. The Director must decide if the report accepts the "Self-Sampling Assumption" (treating us as a random sample from all possible observers).
  > *   **Note:** This is controversial. Some experts accept it; most forecasters reject it as too speculative for policy.

  #### Q3: The Detection Test
  **Question:** Are we more likely to notice or record the event *because* it is large/severe? (e.g., "We are studying this pandemic, so it must be a big one.")
  *   **No:** Detection is independent of size (e.g., automated sensors record all earthquakes).
  *   **Yes:** Small events often go unnoticed; we only see the big ones.

  > **FLAG FOR DIRECTOR:** If **Yes**, the data is skewed.
  > *   **Action:** The draft must explicitly state: *"Observed frequency is higher than actual frequency due to detection bias."* If the draft claims the observed rate *is* the actual rate, **Strike the inference.**

  #### Q4: The Novelty Test
  **Question:** Does the fact "I am observing this" tell us anything new about the world, or is it just a requirement for asking the question?
  *   **New Info:** "I looked out the window and saw rain." (We could have looked and seen sun).
  *   **Requirement:** "I am conscious, therefore the world didn't end yesterday." (We couldn't be conscious if it ended).

  > **HARD STOP RULE:** If **Requirement**, this is not evidence.
  > *   **Action:** **Strike the inference.** You cannot update probabilities based on preconditions of existence.

  ---

  ### Application to Your Three Cases

  Here is how the protocol handles the specific drafts you mentioned.

  #### Case 1: The Nuclear Survival Inference
  *The Draft:* "Humanity has survived 70 years with nuclear weapons; therefore, the annual risk of great-power war must be lower than models suggest."

  *   **Q1 (Visibility):** **No.** If nuclear war had occurred (specifically a civilization-ending one), we would not be here to write the report.
  *   **Protocol Result:** **HARD STOP.**
  *   **Verdict:** **Strike the inference.**
  *   **Reasoning:** This is the answer you suspected you wouldn't like. The protocol treats this as a statistical error, not a philosophical disagreement. You cannot use survival to prove safety when safety is required for survival.
  *   **Fix:** The draft can mention 70 years of survival as a *baseline*, but it cannot use it to *downwardly adjust* a risk model that already accounts for near-misses. It must acknowledge that in the worlds where war happened, no report was written.

  #### Case 2: The Doomsday Argument Paragraph
  *The Draft:* "We find ourselves early in the human sequence. Statistically, most humans live near the end. Therefore, civilization is likely to end sooner than physical models predict."

  *   **Q1 (Visibility):** **Yes.** (We exist in both long and short futures).
  *   **Q2 (Counting):** **Yes.** The argument relies entirely on our position in the sequence of all humans who will ever live.
  *   **Protocol Result:** **FLAG FOR DIRECTOR.**
  *   **Verdict:** **Do not strike, but require a disclaimer.**
  *   **Reasoning:** This is not a logical error like Case 1; it is a contested framework (the "Self-Sampling Assumption"). Reasonable experts disagree on whether this logic holds.
  *   **Fix:** The paragraph must include a sentence: *"This estimate relies on the assumption that our birth rank is a random sample from all future humans, a method that is debated in forecasting literature."* If the authors refuse to flag the controversy, **Strike the paragraph.** It presents a philosophical assumption as a physical fact.

  #### Case 3: The Pandemic Observation Reasoning
  *The Draft:* "Given that I'm observing this outbreak at all, it's more likely to be a big one."

  *   **Q1 (Visibility):** **Yes.** (We exist regardless of the outbreak size).
  *   **Q3 (Detection):** **Yes.** Small outbreaks often fizzle out or go unreported; large ones get attention.
  *   **Protocol Result:** **FLAG FOR DIRECTOR / CONDITIONAL STRIKE.**
  *   **Verdict:** **Qualify or Strike.**
  *   **Reasoning:** This is a sampling bias issue (similar to the "Sleeping Beauty" logic you noted). If the surveillance system only catches big outbreaks, then *conditional on being caught*, it is likely big. But you cannot use this to estimate the *total* risk of outbreaks.
  *   **Fix:** If the forecast is about "reported outbreaks," the logic holds. If the forecast is about "total viral emergence," the logic is misleading. The draft must specify: *"This probability applies only to detected events, not total emergence."* If they don't make that distinction, **Strike.**

  ---

  ### What This Procedure Cannot Do (The Honest Footnote)

  You asked for honesty about where this is a judgment call in a costume. Here is where the "Observer Check" fails, and where you must simply write a footnote admitting uncertainty.

  **1. It cannot resolve the "Reference Class" problem.**
  In Case 2 (Doomsday), the protocol flags the issue, but it cannot tell you if "humans" is the right group to count. Should we count "mammals"? "Observers"? "Brain-states"? The procedure stops at "Flag for Director." The Director is essentially making a philosophical choice, not a factual one. There is no scientific consensus on how to define the "group" for these calculations.

  **2. It cannot quantify the "Survivorship Bias" correction.**
  In Case 1 (Nuclear), the protocol tells you *not* to use survival as evidence of safety. It does *not* tell you what the risk actually is. It prevents you from being too optimistic, but it doesn't give you a number. You still need domain experts to estimate the risk based on launch protocols, geopolitics, etc. The procedure removes a bias; it does not provide a truth.

  **3. It is silent on "Partial" Observation Selection.**
  What if the event kills 90% of people, but not 100%? We would still be here to write the report, but the world is different. The Visibility Test (Q1) is binary (Yes/No). It struggles with "We are here, but we are atypical." Handling this requires complex modeling that a 15-minute checklist cannot capture. In these cases, the honest move is a footnote: *"Standard forecasting methods may understate risk if observer presence is correlated with specific outcomes."*

  **Summary for your Director:**
  This checklist treats **Survivorship Bias** (Case 1) as a hard error to be fixed. It treats **Doomsday-style reasoning** (Case 2) as a controversial assumption to be disclosed. It treats **Detection Bias** (Case 3) as a sampling limitation to be defined. It does not pretend to solve the underlying philosophy, but it prevents philosophy from masquerading as data.
