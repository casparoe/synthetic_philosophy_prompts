answer: |-
  This is a sophisticated observation that cuts to the heart of the philosophy of social norms. You have identified a tension between the *arbitrariness* of conventions (they could have been otherwise) and the *normative force* with which they are enforced upon visitors (you *ought* to follow them).

  Here is a reconstruction of the implicit theory presupposed by travel-etiquette literature, an analysis of where it diverges from rival accounts (specifically David Lewis's coordination theory), and a sketch of what the advice would look like under a purely prudential framework.

  ### 1. The Implicit Theory: "Conventional Compliance as Respectful Participation"

  The genre of travel etiquette presupposes a hybrid theory that combines **Fair Play** with **Expressive Respect**. It treats local conventions not merely as coordination solutions, but as the *constitutive rules of a local social contract* that visitors enter upon arrival.

  The theory rests on three pillars:

  1.  **The Obligation of Fair Play:** By entering a society and benefiting from its order (safety, infrastructure, service), the visitor incurs a temporary obligation to uphold the rules that maintain that order, even if those rules are arbitrary. To violate them is to "free ride" on the locals' restraint.
  2.  **The Expressive Function of Norms:** Conventions are treated as a language. Following them signals, "I recognize your authority over this space and I value our interaction." Violating them signals contempt or arrogance. Therefore, the wrongness of the act lies not in the consequence (e.g., traffic flow), but in the *message sent*.
  3.  **The Epistemic Condition (The Newcomer Excuse):** The obligation is contingent on knowledge. You cannot signal respect through compliance if you are ignorant of the code. This explains the asymmetry you noted: the obligation scales with the duration of stay because the expectation of knowledge scales with time.

  **The Moral/Conventional Distinction:**
  The theory assumes a form of **Moral Universalism** coupled with **Conventional Relativism**. It presupposes that there are core moral truths (do not murder, do not steal) that apply everywhere, but there is a wide sphere of "moral indifference" where local custom reigns. You are not asked to adopt local *morals* (which would violate universalism) but to adopt local *conventions* (which facilitates coexistence). The line is drawn at *harm* vs. *manner*.

  ### 2. Strict Requirements vs. Compatibility with Rival Views

  To write your paper, you need to distinguish which features of the advice *demand* this specific theory and which could be explained by others.

  #### A. The "Empty Street" Case (Germany at Dawn)
  *   **The Practice:** "Do not cross against the light even if no cars are coming."
  *   **Lewisian Coordination Account:** **Incompatible.** For David Lewis (*Convention: A Philosophical Study*), conventions are solutions to recurrent coordination problems. If the street is empty, there is no coordination problem. Crossing is rational and permissible. The Lewisian account cannot explain why you are *wrong* to cross, only that you might be *unwise* if it becomes a habit that hurts you later.
  *   **Respect/Fair Play Account:** **Strictly Required.** The only reason to wait on an empty street is to demonstrate solidarity with the system itself. It signals, "I follow your rules because they are *yours*, not because I fear punishment." This feature of the advice strictly requires a non-consequentialist, respect-based theory.

  #### B. The Imperative Mood ("Do Not Tip")
  *   **The Practice:** Framing advice as duty ("You must not tip") rather than prudence ("Tipping may offend").
  *   **Lewisian Account:** **Compatible but weak.** Lewis can explain imperatives if framed as "If you want coordination, do X." But it struggles to explain the *moralizing* tone ("It is rude").
  *   **Respect Account:** **Fits well.** Imperatives are appropriate when addressing obligations of respect.
  *   **Strict Requirement:** The *moralizing* tone (treating violations as "wrong" rather than "awkward") strictly requires a theory that imbues conventions with moral weight (like Margaret Gilbert's theory of joint commitment or a Scanlonian contractualist view), rather than pure game theory.

  #### C. The Newcomer Excuse
  *   **The Practice:** "They won't expect you to know this in the first week."
  *   **Lewisian Account:** **Compatible.** Ignorance explains coordination failure.
  *   **Respect Account:** **Compatible.** You cannot express respect via a code you do not know.
  *   **Legal Positivist Account:** **Compatible.** *Ignorantia juris non excusat* is often relaxed for tourists (quasi-legal status).
  *   **Analysis:** This feature does not distinguish between theories. It is an epistemic condition common to almost all normative systems.

  #### D. The Morals vs. Conventions Line
  *   **The Practice:** "Tip 20%" (Required) vs. "Adopt Local Religion" (Not Required).
  *   **Lewisian Account:** **Compatible.** Lewis defines conventions as arbitrary. Morals are usually not considered arbitrary.
  *   **Moral Relativism:** **Incompatible.** A true moral relativist would suggest you *should* adopt local moral convictions (e.g., regarding caste or gender roles) while in that jurisdiction. The fact that guidebooks *refuse* to do this (e.g., they won't tell female travelers to submit to local patriarchal norms, only to dress modestly) proves the genre presupposes **Universal Human Rights** trumping local convention.
  *   **Strict Requirement:** The refusal to advise on deep moral/religious conversion strictly requires a Universalist Moral framework underlying the Conventional Relativism.

  ### 3. The Counterfactual: Advice Based on Pure Prudence (No Moral Binding)

  If we assumed conventions bind no one morally and are only matters of self-interest (a strict Lewisian or Hobbesian view), the genre of travel advice would undergo a radical transformation. The imperative mood would vanish, replaced by conditional hypotheticals.

  **Current Version (Moral/Respect Based):**
  > "In Japan, do not tip. It is considered insulting. You must respect the local custom of omotenashi."
  > "In Germany, do not jaywalk. It is against the rules and shows a lack of civic discipline."

  **Prudential Version (Self-Interest Based):**
  > "In Japan, tipping is unnecessary. If you leave money, servers may chase you to return it, causing a delay. If you wish to avoid this awkward interaction, leave the bill as is."
  > "In Germany, jaywalking is strictly enforced. Even on empty streets, police may fine you. If you wish to keep your money, wait for the green light."

  **Key Differences in the Prudential Version:**
  1.  **No "Wrongness":** There is no suggestion that the visitor has *wronged* the locals. The focus is entirely on the visitor's experience (awkwardness, fines).
  2.  **No Empty Street Obligation:** The advice on jaywalking would explicitly add: "If there are no police and no cars, crossing is safe, but be aware you risk setting a bad example for children or being seen by authorities." The obligation disappears when the risk disappears.
  3.  **No Newcomer Excuse needed:** Prudence doesn't care about your intent. If you tip in Japan, you cause confusion regardless of whether you are a tourist. The advice would simply state the consequence, not offer an excuse for the violation.
  4.  **Instrumental Language:** Words like "should," "must," "rude," and "respect" are replaced by "risk," "likely," "result," and "efficient."

  ### 4. Summary for Your Paper

  The travel-etiquette genre presupposes that **conventions are the currency of cosmopolitan respect.**

  It rejects the **Lewisian view** that conventions are merely coordination equilibria, because it demands compliance even when coordination is unnecessary (the empty street). It rejects **Moral Relativism**, because it distinguishes between local manners (binding) and local morals (not binding).

  Instead, it commits to a **Expressive-Fair Play Theory**:
  1.  **Binding Force:** Conventions bind visitors because violating them expresses disrespect for the host community's autonomy and order.
  2.  **Scope:** This binding force is limited to "arbitrary" social rules that do not violate universal moral standards.
  3.  **Conditionality:** The obligation is epistemic; it activates only when the visitor has had a reasonable opportunity to learn the code.

  The "odd asymmetry" you noticed is the fulcrum of this theory: It treats the visitor as a **temporary citizen** regarding *order* (hence the duty to follow rules), but a **permanent moral agent** regarding *conscience* (hence no duty to adopt local beliefs). This allows the genre to navigate between imperialism (imposing one's own norms) and relativism (abandoning one's own morals).

  **Suggested Philosophical References:**
  *   **David Lewis,** *Convention* (for the rival coordination view).
  *   **Margaret Gilbert,** *On Social Facts* (for the "joint commitment" view which better explains the obligation).
  *   **T.M. Scanlon,** *What We Owe to Each Other* (for the contractualist idea that we follow rules to justify our conduct to others).
  *   **Elizabeth Anderson,** *Value in Ethics and Economics* (on expressive theories of rationality).
  *   **Chandra Sripada & Stephen Stich,** "A Framework for the Psychology of Norms" (distinguishing moral vs. conventional norms).
