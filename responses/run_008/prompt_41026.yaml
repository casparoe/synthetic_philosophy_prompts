prompt: |-
  I'm taking a seminar on social norms and convention, and I've become puzzled by the entire genre of travel-etiquette advice — guidebooks, State Department briefings for exchange students, the cross-cultural training modules that corporations put expatriates through before a posting. All of it issues the same instruction in the imperative mood: tip close to 20% in the United States, do not tip at all in Japan, stand in the queue in Britain, do not cross against the light in Germany even on an empty street at dawn. The advice is presented not as prudence ("you'll get better service") but as something closer to duty, and the visitor who ignores it is treated as having done something wrong, not merely something awkward. My question for the paper I have to write: what theory of the moral status of conventions does this practice presuppose? Does the genre commit itself to conventions being morally binding in themselves, or only to something narrower — say, that violating a local convention wrongs the locals by signalling contempt for their way of doing things? I notice the advice contains an odd asymmetry: newcomers seem to be excused in proportion to how recently they arrived, which fits a "conventions are like local laws" picture, yet the same advisors would never tell the visitor to adopt the locals' moral or religious convictions — only their conventions. So there must be some presupposed line between the two. Could you reconstruct the implicit theory, tell me which parts of the practice strictly require it and which are compatible with several rival views (for instance, a Lewis-style account of conventions as coordination solutions versus a respect-based account), and say what the advice would have to look like if we instead assumed conventions bind no one morally and only self-interest recommends following them?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user is writing a paper for a seminar on social norms and convention.
      *   **Observation:** Travel etiquette advice (guidebooks, State Dept, corporate training) uses imperative language ("Do X," "Don't do Y"). It frames violations as *wrong*, not just imprudent or awkward.
      *   **Key Puzzle:** There's an asymmetry. Newcomers are excused based on recency of arrival (like local laws), but visitors aren't told to adopt local *moral/religious* convictions, only *conventions*.
      *   **Core Question:** What theory of the moral status of conventions does this practice presuppose?
      *   **Specific Sub-questions:**
          1.  Reconstruct the implicit theory.
          2.  Identify which parts of the practice strictly require this theory vs. which are compatible with rival views (e.g., Lewisian coordination vs. Respect-based).
          3.  Describe what the advice would look like if conventions were assumed to have *no* moral binding force (pure self-interest).

  2.  **Initial Brainstorming & Theoretical Landscape:**

      *   *David Lewis (Convention: A Philosophical Study):* Conventions are arbitrary coordination solutions. They solve recurrent coordination problems. Following them is rational (self-interest), but not necessarily *moral*. If everyone else drives on the left, I should too to avoid crashing. But is it *wrong* to drive on the right on an empty street? Lewis says no, it's just irrational if it causes confusion later.
      *   *Hume/Custom:* Conventions arise from habit and utility.
      *   *Respect-Based Accounts (e.g., Margaret Gilbert, Seamus Miller, or general liberal multiculturalism):* Following local norms is a sign of respect for the community. Violating them expresses contempt or arrogance.
      *   *Fairness/Reciprocity:* If I benefit from the order they maintain, I ought to contribute to it (fair play).
      *   *The "Local Law" Analogy:* The user notes newcomers are excused like law-breakers with ignorance defenses. This suggests a quasi-legal obligation.
      *   *The Moral/Convention Distinction:* Turiel's Social Domain Theory distinguishes moral rules (harm, justice) from social-conventional rules (authority, tradition). Travel advice seems to blur this by making conventions feel obligatory.

  3.  **Reconstructing the Implicit Theory:**

      *   The advice treats conventions as *morally binding on visitors*, but *conditionally*.
      *   Condition 1: Locality (lex loci).
      *   Condition 2: Knowledge/Intent (the "newcomer excuse").
      *   Condition 3: Distinction from deep morality (you don't have to convert, just comply).
      *   *Name for this:* "The Principle of Local Compliance as Respect" or "Conventional Obligation via Fair Play/Respect."
      *   It's not pure Lewisian coordination because Lewis doesn't generate *moral* "oughts" on empty streets.
      *   It's not pure Moral Relativism because they don't ask you to adopt local *morals* (e.g., if a culture thinks theft is okay, the guidebook won't say "steal here").
      *   *Best Fit:* A hybrid of **Fair Play** (you benefit from the social order, so you must uphold its rules) and **Expressive Respect** (following norms signals you value the hosts).

  4.  **Analyzing the Asymmetry (Morals vs. Conventions):**

      *   Why follow tipping norms but not local views on women's rights (if regressive)?
      *   The implicit theory must posit a threshold. Conventions are "surface" rules that facilitate interaction without compromising core moral agency.
      *   This aligns with a **Liberal Cosmopolitan** view: Core morals are universal; conventions are local tools for peaceable coexistence.

  5.  **Addressing the Sub-questions:**

      *   *Reconstruction:* The theory is likely "Conventions create provisional obligations of compliance based on respect and fair play, contingent on epistemic access."
      *   *Strict Requirements vs. Compatibility:*
          *   *Imperative Mood:* Compatible with Lewis (if framed as prudential imperative), but the *moralizing* tone ("wrong," not "awkward") requires a moral theory (Respect/Fair Play).
          *   *Empty Street/Germany:* Lewis says no obligation. The advice says obligation. This *strictly requires* a non-Lewisian account (likely Expressive/Respect).
          *   *Newcomer Excuse:* Compatible with Legal Positivism (ignorance of law) and Respect (couldn't signal respect if you didn't know).
          *   *Morals vs. Conventions:* Requires a distinction between universal moral truths and local arbitrary rules. Lewis fits here (conventions are arbitrary), but Lewis doesn't explain the *obligation*.
      *   *Pure Self-Interest Version:* "If you want good service, tip." "If you want to avoid fines, don't jaywalk." No "should," only "if-then."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. It's a great philosophical puzzle.
      *   *Section 1: The Implicit Theory.* Call it "The Principle of Conventional Compliance as Respectful Participation." It combines Fair Play (benefiting from order) and Expressive Respect (signaling goodwill). It treats conventions as *quasi-legal* but distinct from *deep morality*.
      *   *Section 2: Lewis vs. Respect.*
          *   Lewis: Conventions solve coordination problems. Violation is irrational, not immoral.
          *   The Practice: Violation is *rude/wrong*.
          *   The "Empty Street" Test: This is the smoking gun. Lewis says walk. The Guidebook says wait. Why? Because the *act* expresses disrespect for the system, not just risk of accident. This rules out pure Lewisianism.
      *   *Section 3: The Asymmetry (Morals vs. Conventions).* How does the theory handle this? Conventions are *arbitrary* but *constitutive* of local social order. Morals are *universal*. You respect the locals by following their arbitrary rules, but you don't respect them by adopting their (potentially wrong) moral beliefs. This implies a Universalist Moral Realism underlying the Convention Relativism.
      *   *Section 4: The Newcomer Excuse.* This is epistemic. You can't signal respect if you don't know the code. It aligns with *mens rea* in law.
      *   *Section 5: The Counterfactual (Pure Prudence).* Rewrite the advice. "In Japan, tipping causes confusion." "In Germany, jaywalking risks fines." Remove the "ought."
      *   *Conclusion:* Summarize. The practice presupposes that conventions are the "currency of respect" in a pluralistic world.

  7.  **Refining the Philosophical Nuance:**

      *   Need to mention **Margaret Gilbert** (Joint Commitment). She argues conventions create obligations because they are joint commitments. This fits the "wronging the locals" idea better than Lewis.
      *   Need to mention **Scanlon** or contractualism? Maybe too deep. Stick to Lewis vs. Respect/Fair Play.
      *   The "Empty Street" case is crucial. It proves the obligation isn't about *consequences* (coordination failure) but about *attitude* (solidarity/respect).
      *   The distinction between *Moral* and *Conventional* is key. The advice assumes conventions are *morally neutral in content* but *morally charged in compliance*.

  8.  **Final Polish:** Check tone. Ensure it sounds like a helpful academic collaborator. Make sure all parts of the prompt are answered. (Self-Correction: Make sure to explicitly address the "strictly require" vs "compatible" distinction requested).

      *   *Check:* Did I explain why the newcomer excuse fits? Yes, epistemic condition on respect.
      *   *Check:* Did I explain the Morals vs. Conventions line? Yes, Universalism vs. Localism.
      *   *Check:* Did I provide the Prudence rewrite? Yes.

