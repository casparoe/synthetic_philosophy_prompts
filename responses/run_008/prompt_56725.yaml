          *   Lie (Announce safety): Low probability of severe harm (contamination), but if wrong, people get sick/die on her say-so.
      *   **Action:** Lied outright ("tested and safe").
      *   **Outcome:** Implicitly, the lie prevented the panic deaths (otherwise the debate would be moot), but the moral status is the issue.

  3.  **Analyze the Moves:**

      *   **Marco 1 (Deontological/Rule-Based):** Lying violates trust defining the office. Rules matter most when breaking them is expedient. Good consequences don't excuse the violation.
          *   *Strengths:* Protects institutional integrity, aligns with Kantian duties of office.
          *   *Weaknesses:* Potentially rigid ("rule-worship"), ignores catastrophic consequences.
      *   **Lena 1 (Consequentialist/Necessity):** Preventing greater harm is the priority. "Clean hands" is self-indulgence. Confusing sadness with wrongness.
          *   *Strengths:* Addresses the stakes (life and death), pragmatic.
          *   *Weaknesses:* Risks slippery slope, undermines trust if generalized.
      *   **Marco 2 (Generalization/Institutional):** If outcomes license deception, *every* government has an excuse. Trust depends on officials *not* reasoning this way (Kantian universalization/Rule Utilitarianism).
          *   *Strengths:* Strong point about systemic trust. If officials think like Lena, the institution collapses.
          *   *Weaknesses:* Might be too abstract for the immediate emergency context.
      *   **Lena 2 (Dirty Hands/Moral Remainder):** Act justified *but* remains a wrong. Official ought to feel guilt. Owes apology/restoration, not just shrug.
          *   *Strengths:* Captures the tragic nature of political choice. Acknowledges the cost to the deceived.
          *   *Weaknesses:* Potentially contradictory (How can X be obligatory and wrong?).
      *   **Marco 3 (The Contradiction Charge):** Guilt implies wrong -> shouldn't have done it. Obligatory -> guilt is theater. It's double-talk/paradox-mongering.
          *   *Strengths:* Logically rigorous challenge to coherence.
          *   *Weaknesses:* Assumes a binary moral ontology (Act is either Right or Wrong, no residue).

  4.  **Evaluate Coherence of "Dirty Hands" (The Central Question):**
      *   *The Problem:* Standard deontology says "Don't lie." Standard consequentialism says "Maximize good." Dirty Hands (Walzer, Nagel, Williams) says "Sometimes you must do wrong to do right."
      *   *Is it coherent?* It depends on the moral ontology.
          *   If "Right" = "All-things-considered obligation," then saying "It was obligatory but wrong" seems contradictory *unless* "wrong" refers to a specific *pro tanto* duty (duty of truth-telling) that was overridden but not erased.
          *   The "Moral Remainder" is the key. If I override a right (citizens' right to truth) for a greater good, I incur a debt. The guilt isn't theater; it's the recognition of the debt.
          *   Marco assumes moral monism (one supreme metric). Lena assumes moral pluralism (conflicting genuine values).
      *   *Verdict:* Lena is philosophically defensible (Walzerian), but Marco is logically correct *within a monistic framework*. The coherence hinges on accepting moral pluralism.

