      Marco 3: Charge of contradiction.
      If "Dirty Hands" is coherent, Marco 3 fails. If "Dirty Hands" is incoherent, Marco 3 wins. Most contemporary political philosophy (Walzer, etc.) accepts Dirty Hands as coherent under pluralism. So Lena wins the coherence debate. But Marco wins the "danger" debate.
      I will rule that Lena is more right about the *moral status of the act*, but Marco identifies the crucial *political constraint*. Overall, Lena's position is more philosophically adequate to the tragedy, provided she accepts Marco's constraint on *frequency*.
      Let's go with: Lena is more right on the specific ethics, Marco on the institutional theory. But since the question is about the *coherence of the justification*, Lena wins.

      *Refining the "Moral Remainder" analysis:* I need to be careful not to just say "Walzer says yes." I need to explain *why* it works. It works because rights (to truth) are infringed, not just utilities calculated. Infringement creates a debt.

