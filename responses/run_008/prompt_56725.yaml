answer: |-
  As the referee in this dispute, I have reviewed the transcript of the exchange between Marco and Lena regarding the Emergency Director's decision. The case presents a classic "tragic choice" in political ethics: a conflict between the deontological duties of public office (truth-telling, fiduciary trust) and the consequentialist imperative to preserve life.

  Below is my move-by-move adjudication, followed by an analysis of the central philosophical coherence of the "Dirty Hands" position, the utility of the "moral remainder," and a final verdict.

  ### Part I: Move-by-Move Adjudication

  **1. Marco's Opening Move**
  *Claim:* The Director did wrong, full stop. Lying violates the trust defining the office; rules matter most when breaking them is expedient.
  *Assessment:* **Substantially Right on Principle, Mistaken on Application.**
  *Justification:* Marco correctly identifies that public office is a fiduciary role defined by specific duties, chief among them honesty. His point that rules against lying are *most* important when expediency tempts us is a robust deontological insight (reminiscent of Kant). However, his judgment is "clearly mistaken" in its absolutism regarding the *outcome*. To say the Director did wrong "full stop" ignores the moral weight of the preventable deaths caused by panic. In extreme emergencies, the duty to preserve the polity's existence can temporarily override the duty of candor. Marco treats the duty of truth as absolute rather than *prima facie*, which renders his theory unable to handle catastrophic edge cases.

  **2. Lena's First Reply**
  *Claim:* Rule-worship that lets citizens die is self-indulgence. If lying prevented greater harm, it was obligatory. Marco confuses sadness with wrongness.
  *Assessment:* **Substantially Right on Stakes, Reckless on Precedent.**
  *Justification:* Lena is right that morality cannot be a project of keeping one's own soul clean at the expense of others' lives ("clean hands" criticism). Her distinction between the *sadness* of a choice and its *wrongness* is initially compelling. However, she is mistaken to dismiss the institutional cost so readily. By framing the lie as simply "what she ought to have done" without qualification, she risks normalizing paternalistic deception. She correctly identifies the immediate moral necessity but fails to account for the long-term corrosion of the office's integrity.

  **3. Marco's Second Move**
  *Claim:* This proves too much. If outcomes license deception whenever officials judge the balance to favor it, trust collapses. The lie's effectiveness depends on officials *not* reasoning this way.
  *Assessment:* **Highly Persuasive (The Strongest Argument).**
  *Justification:* This is Marco's strongest move, invoking a version of the "publicity condition" or rule-utilitarian reasoning. He correctly notes that the value of truth-telling in politics is systemic. If the public knows officials employ a private calculus to justify lying, the assurance value of official statements vanishes. The Director's lie worked *because* the public assumes officials do not lie. Marco correctly identifies that Lena's justification, if generalized into a policy, would destroy the very trust the Director relied upon to save lives.

  **4. Lena's Second Move (The Dirty Hands Claim)**
  *Claim:* The act was justified yet remains a wrong. The official ought to feel lasting guilt and owe restitution. This is the lesson of "dirty hands."
  *Assessment:* **Philosophically Robust.**
  *Justification:* Lena here invokes the Walzerian/Nagelian tradition of "Dirty Hands." She concedes Marco's point about the violation (it is a "wrong") but maintains the consequentialist necessity (it was "justified"). By insisting on guilt and restitution, she acknowledges the cost to the moral fabric that Marco warned about. This move saves her position from simple act-consequentialism. It acknowledges that rights (the citizens' right to truth) were infringed, not just utilities calculated. This is a sophisticated ethical move that captures the tragedy of the situation better than Marco's binary "wrong/right."

  **5. Marco's Final Charge**
  *Claim:* This is double-talk. If guilt is fitting, the act was wrong (so don't do it). If obligatory, guilt is theater. You are proud of an inconsistency.
  *Assessment:* **Logically Valid within Monism, Mistaken within Pluralism.**
  *Justification:* Marco's charge lands only if one accepts **Moral Monism**—the idea that there is a single metric by which an act is judged (e.g., either it maximizes utility OR it follows the rule). If there is only one "ought," then saying "I ought to do X" and "X is wrong" is a contradiction. However, if one accepts **Moral Pluralism** (that there are conflicting genuine values, like "truth" and "life," which cannot be fully reduced to one another), then the contradiction dissolves into a paradox. Marco is logically correct that Lena's language is tense, but he is philosophically mistaken to assume that tension indicates incoherence rather than moral complexity.

  ---

  ### Part II: The Central Question — Coherence of "Dirty Hands"

  **Is Lena's position coherent, or does Marco's charge land?**

  Lena's position is **coherent**, provided we accept a pluralistic moral ontology. Marco's charge of contradiction assumes that "justified" and "wrong" are mutually exclusive predicates in the same sense. They are not.

  In political ethics, we must distinguish between the **all-things-considered obligation** and the **pro tanto wrong**.
  1.  **All-things-considered:** Given the totality of the circumstances (imminent mass death vs. risk of contamination), the Director was obligated to lie. This is the "justified" part.
  2.  **Pro tanto wrong:** The lie infringed upon the citizens' right to知情 (know) and violated the deontological constraint of the office. This is the "wrong" part.

  When Lena says the Director "ought to feel guilt," she is not engaging in theater. She is acknowledging that the *pro tanto* wrong was not erased by the necessity. The guilt is the psychological recognition of the moral debt incurred by overriding a right.

  Marco's charge lands only if he insists that "Ought implies Permissible." In Dirty Hands theory, "Ought" implies "Necessary despite being Impermissible in isolation." Marco is treating morality as a ledger that must balance to zero. Lena is treating it as a landscape where one can do the "right" thing and still leave a scar. Lena is correct: the scar is real. Therefore, her position is not inconsistent; it is tragic.

  ---

  ### Part III: The Moral Remainder — Explanatory Work or Relabeling?

  The concept of a "moral remainder" (the residue of wrongdoing that persists after a justified act) is often accused of being emotional hand-waving. In this case, however, it does **genuine explanatory work** in three specific areas:

  1.  **Selection of Agents:** It explains why we do not want sociopaths in high office. A person who lies easily without guilt (no remainder) is dangerous because they will lie when it is *not* necessary. The capacity to feel the "remainder" is a safeguard against the slippery slope Marco fears.
  2.  **Obligation of Repair:** It grounds the requirement for restitution. If the lie was simply "right," the Director owes the citizens nothing once the crisis passes. If there is a "remainder," she owes them an accounting, an apology, or policy changes to prevent future necessities. It transforms the aftermath from "moving on" to "making amends."
  3.  **Institutional Memory:** It prevents the normalization of the exception. By codifying the act as a "wrong," the remainder ensures the lie remains an anomaly. If we call it purely "right," it becomes a precedent.

  **Where it may be relabeling:**
  It risks relabeling if "guilt" becomes a substitute for accountability. If the Director feels bad but faces no consequences, the "remainder" is merely aesthetic. For the concept to hold, the guilt must translate into political cost (e.g., resignation, independent review, or compensation). If Lena means "she should feel bad internally," it is relabeling. If she means "she incurs a debt that must be paid," it is explanatory. Based on her mention of owing citizens "something more than a shrug," Lena seems to mean the latter.

  ---

  ### Part IV: Premises to Surrender

  To stop talking past each other, each colleague must surrender a core premise:

  **Marco must surrender Moral Monism.**
  He must accept that moral values (truth vs. life) can conflict incommensurably. He needs to admit that an act can be the *best available option* without being *morally pure*. If he admits that the "wrongness" of lying doesn't vanish just because it was necessary, his "double-talk" charge fails.

  **Lena must surrender the Privacy of the Justification.**
  She must accept Marco's second move: that this reasoning cannot be publicized as a general rule. She must concede that while the Director was right *in this instance*, the *principle* she used cannot be adopted as public policy. She must agree that the "Dirty Hands" exception must remain rare, tragic, and subject to post-hoc scrutiny, or else Marco's institutional collapse becomes reality.

  ---

  ### Part V: Final Verdict

  **Who comes out more right overall?**

  **Lena comes out more right.**

  While Marco's second move regarding institutional trust is the strongest single argument in the exchange, his overall framework is too rigid to account for the reality of political leadership in emergencies. A political ethics that forbids lying even when lying is the only way to prevent a massacre is not a moral system; it is a fetishization of procedure.

  Lena wins because her framework accommodates the tragedy that Marco's denies. She acknowledges the cost to the truth (validating Marco's concern) without succumbing to paralysis (validating the need to save lives). Her insistence on guilt and debt ensures that the exception does not become the rule, which answers Marco's fear of normalization.

  Marco is right that the act damages the office. Lena is right that saving the citizens *is* the purpose of the office. When the survival of the citizens and the purity of the office conflict, the citizens must win, but the damage to the office must be mourned and repaired. Lena captures this dual obligation; Marco captures only half of it.

  **Ruling:** The Director's action was **justified but wrongful**. Lena's "Dirty Hands" explanation is **coherent**, provided the "moral remainder" entails actual accountability, not just internal sentiment. Marco's charge of contradiction is **rejected** as stemming from an overly simplistic moral ontology.
