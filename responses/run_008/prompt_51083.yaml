      *   *Item 2 (Prediction vs. Retrodiction):* Cliody says fitting past data validates the model; Historian says that's curve-fitting.
      *   *Item 3 (Agency):* Cliody downplays individual agency; Historian emphasizes it.
      *   *Item 4 (Unit of Analysis):* Cliody likes large polities/centuries; Historian prefers specific contexts/decades.

  5.  **Drafting Section 3 & 4: Cruxes and Pre-registered Predictions:**
      *   *Goal:* Define tests that could actually change minds.
      *   *Crux 1 (Out-of-Sample Forecasting):* Can we predict the next 10-20 years?
