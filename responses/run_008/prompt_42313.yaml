answer: |-
  This is a sophisticated stalemate, and your hypothesis is correct: you are no longer arguing about physics. You are arguing about **ontological commitment** and the **rules of inference** allowed between physical formalism and metaphysical conclusion.

  You and your brother agree on the map (Minkowski spacetime, Lorentz transformations, light cones). You disagree on what the map *is a map of*.

  Here is the diagnosis of the disagreement, the prospects for breaking it, and the verdict on General Relativity.

  ### 1. The Diagnosis: Three Layers of Disagreement

  This is not merely verbal, nor is it fully substantive in the way a dispute over a physical constant would be. It is a **methodological clash regarding underdetermination.**

  **Layer A: The Semantics of "Existence" (Verbal/Conceptual)**
  Your brother is operating with a **tenseless quantifier** view of existence. For him, to say "Event $E$ exists" is to say "$E$ is a value of a bound variable in our best theory's ontology." Since the manifold contains $E$, $E$ exists. The "now" is just an indexical label on a worldline, like "here."
  You are operating with a **causal/definiteness** view of existence (following Stein). For you, "real" is not a binary property of the manifold but a relation of *ontological settledness* relative to an event.
  *   **The Clash:** He thinks you are redefining "real" to save intuition. You think he is redefining "real" to save a substantivalist reading of the manifold. Neither definition is ruled out by the math, but they are incompatible.

  **Layer B: The Transitivity Premise (Substantive/Logical)**
  The Rietdijk–Putnam argument hinges on the transitivity of the relation "is real for."
  *   **Brother's Commitment:** Reality is absolute. If $A$ is real for Observer 1, and Observer 1 is real for Observer 2, then $A$ is real for Observer 2. This treats "real for" as an equivalence relation. He views this as a logical truth about existence, not a physical one.
  *   **Your Commitment:** Following Stein, you deny transitivity across spacelike separation. "Real for" is anchored to the causal past ($J^-$). Since $J^-$ is not transitive across spacelike intervals, the chain breaks.
  *   **The Clash:** He views your non-transitive "real" as *solipsism* or *relativized existence* (which he finds metaphysically incoherent). You view his transitive "real" as *magical action at a distance* (granting ontological status to events that can never causally interact).

  **Layer C: The Derivation Rule (Methodological/Bedrock)**
  This is the core.
  *   **Brother's Rule:** **Ontic Structural Realism.** The structure of the physical theory *is* the structure of reality. If the theory treats time as a dimension analogous to space, reality *is* a block. To deny this is to deny the truth of the theory.
  *   **Your Rule:** **Metaphysical Autonomy.** Physical theories are models of empirical regularities. They do not dictate ontology without metaphysical bridge principles. The theory says "simultaneity is relative"; it does not say "existence is relative" or "existence is absolute." That choice is external to the physics.

  **Verdict:** This is a **bedrock disagreement about the authority of physics over metaphysics.** He believes physics absorbs metaphysics; you believe metaphysics frames physics.

  ### 2. Can the Deadlock Be Broken?

  **Honest Answer:** No. Not by argument, and not by math.

  **Why Math Won't Save You:**
  There is no theorem in Special Relativity that proves Eternalism. The Putnam argument is a *philosophical* argument *using* physics, not a *physical* proof.
  *   Malament's Theorem (1977) is often brought up here. It shows that standard simultaneity is the only equivalence relation definable from causal structure *given certain constraints*. But Stein's relation isn't an equivalence relation, and Presentists can reject the constraints (e.g., they don't need an equivalence relation, they need a foliation).
  *   Your brother wants a theorem that says "Becoming is impossible." It doesn't exist.
  *   You want a theorem that says "The Block is not required." It doesn't exist.
  The formalism is neutral. It supports a Block interpretation elegantly, but it does not logically exclude a Steinean becoming interpretation.

  **Why Conceptual Distinctions Won't Save You:**
  You have already deployed the best one (Stein's causal availability). He rejects it not because it's mathematically wrong, but because it is *metaphysically unsatisfying*. It makes "what exists" dependent on where you are and how you move. To a substantivalist, that sounds like denying the reality of the rest of the universe when you turn your back. To you, it sounds like respecting the speed of light limit on *being*.
  You cannot argue him out of his intuition that existence should be absolute, and he cannot argue you out of your intuition that existence should be causal.

  **The Only Path Forward:**
  Stop trying to prove the other wrong. Shift to **Explanatory Trade-offs.**
  *   **Ask him:** "What explanatory work does the Block Universe do that Steinean Becoming doesn't?" (Usually: It simplifies the ontology of the manifold.)
  *   **Ask yourself:** "What explanatory work does Objective Becoming do that the Block doesn't?" (Usually: It accounts for the phenomenology of passage and the openness of the future.)
  *   **Acknowledge:** He is choosing **Parsimony of Structure** (one manifold, no extra 'becoming' relation). You are choosing **Parsimony of Intuition** (matches experience, respects causal limits).
  *   **Resolution:** You are both "right" relative to your methodological priors. The disagreement is a choice of philosophical framework, not a discovery of fact.

  ### 3. The General Relativity Complication

  You mentioned neither of you knows GR well. This is relevant because **GR actually weakens your brother's case and complicates yours.**

  1.  **Against the Brother (No Global Slices):** In generic GR spacetimes, there are no global inertial frames and often no global way to slice spacetime into "space" + "time." If the Block Universe requires a specific foliation to make sense of "all times existing," GR says you often can't even do that globally. However, Eternalists just say "The 4-manifold exists," which GR supports. So GR doesn't kill Eternalism.
  2.  **Against You (Cosmic Time):** In FLRW cosmological models (the standard model of our universe), there *is* a preferred foliation: **Cosmic Time** (defined by the average density of matter/CMB rest frame).
      *   **The Trap:** A Presentist could say, "Aha! Physics *does* give us a privileged present!"
      *   **The Counter:** This preferred slice is contingent, not fundamental. It exists because of the distribution of matter, not because of the nature of time. If the matter were distributed differently, the slice might vanish. Relying on it makes Presentism contingent on cosmology, which is philosophically risky.
  3.  **The Killer for Both (Closed Timelike Curves):** Some GR solutions allow CTCs. If you can travel to your own past, the distinction between "fixed past" and "open future" collapses locally. This hurts Objective Becoming more than the Block Universe.

  **Summary on GR:** It doesn't solve the SR stalemate. It just adds more variables. It shows that "simultaneity" is even less fundamental than SR suggests, which helps your Steinian view (simultaneity isn't the marker of reality), but the causal structure issues remain.

  ### 4. Conclusion: The Peace Treaty

  You asked what kind of disagreement this is. It is a **Category Error Disagreement.**

  *   Your brother is treating a **metaphysical interpretation** (Eternalism) as if it were a **physical prediction** (like light bending).
  *   You are treating a **physical constraint** (causal structure) as if it were a **metaphysical proof** (of Becoming).

  **Why you are stuck:**
  You are waiting for him to admit that physics underdetermines ontology. He is waiting for you to admit that denying the Block makes the physics "less real."
  *   He won't admit it because, to him, "real" means "in the theory."
  *   You won't admit it because, to you, "real" means "causally impactful."

  **Recommendation:**
  Tell him this: *"We agree on the geometry. We agree on the transformations. We disagree on whether the geometry exhausts reality. You believe the map is the territory. I believe the map only shows the roads, not whether the destinations exist before we arrive. Neither of us can prove the other wrong because this isn't physics anymore; it's a choice of how much metaphysical baggage we want to carry."*

  If he insists the physics *forces* the Block, he is committing the **Fallacy of Misplaced Concreteness** (Whitehead). He is mistaking the mathematical model for the ontological ground.
  If you insist Stein's relation *forces* Becoming, you are committing the **Phenomenological Fallacy**. You are mistaking the structure of causal access for the structure of being.

  **Final Verdict:** Expect to stay stuck. But you can stop fighting. You are playing different games on the same board. Acknowledge that the Rietdijk–Putnam argument is valid *if* you accept the transitivity of reality, and Stein's critique is valid *if* you restrict reality to causal pasts. The choice between those axioms is not physical. It's philosophical. And on that, reasonable people (even brothers) can differ.
