prompt: |-
  I'm a lay member of the committee that adjudicates disciplinary cases at a state board of nursing licensure. We hear roughly forty cases a year in which a nurse is alleged to have done something wrong — documenting a medication she didn't actually witness, overriding a safety protocol, sharing a patient's information with someone who turned out not to be authorized — and the sanctions range from a written reprimand to revocation of the license. A hearing lasts one afternoon, we have a staff attorney but no philosopher, and the nurse's livelihood is on the line, so the stakes are high and the time is short.

  More and more, the defense we hear is some version of "I couldn't have done otherwise": the unit was short-staffed and following protocol was physically impossible in the time available; my supervisor told me to falsify the chart or be fired; my ex-partner, who had threatened me, demanded I take the medication from the cabinet; I was in acute withdrawal and not in control. Half the committee thinks that if there genuinely was no permissible alternative, responsibility goes out the window. The other half thinks the nurse did the wrong thing regardless of what the alternatives were, and that excusing her punishes the colleague who reported it. We keep splitting these cases on vibes, and I want better than vibes.

  Some years ago I read about the so-called Frankfurt cases in philosophy, and they seem to bear directly on our problem. As I understand the classic shape of it: someone performs a wrongful act entirely for her own reasons, while an intervener — in the thought experiments, a neuroscientist with electrodes implanted — stands ready to force her to do it if she shows any sign of wavering. She never wavers, the intervener never acts, and yet many people's intuition is that she's responsible even though she couldn't have done otherwise. The suggestion is that what matters for responsibility isn't the availability of alternatives but whether the actual explanation of the act runs through the agent or through the thing that removed the alternatives. I also gather there's a well-known objection — something like: if she was never going to waver, you can't tell a story about what she would have done if she'd tried, so the thought experiment never really removes the alternatives it claims to remove — and I don't know whether the objection defeats the cases or not.

  What I want from you is a decision procedure the committee could actually run on a "no alternative" defense: an ordered list of questions to ask, what counts as a sufficient answer to each, which answers end the inquiry with no discipline and which end it with full discipline, and which points hand the decision back to the committee because the question is one of values rather than facts. The conceptual core should be the Frankfurtian one — distinguishing cases where the constraint explains the wrongdoing from cases where the constraint was mere backdrop and the agent's own reasons did the work — but translated into questions a non-philosopher can ask a witness under oath. Then run the procedure on three cases we actually face: a nurse who falsified intake times under a supervisor's explicit threat of termination; a nurse who diverted opioids while being coerced by an abusive partner; and a nurse who says short-staffing left no compliant option for a medication-error reporting deadline, where I suspect the procedure will return an answer the majority of my committee won't like. Tell me where the procedure will misfire.

  Two requests about how you present it. First, wherever the procedure depends on a philosophical claim that specialists still argue about — including the question of whether Frankfurt-style cases succeed at all, given the objection I mentioned — say so explicitly and mark the branch of the procedure that rests on it, rather than building the whole thing on a contested reading presented as settled. Second, tell me plainly which steps of the procedure are real tests and which are judgment calls dressed up as procedure, since we'll be handing this to committee members who will follow it literally.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Lay member of a state board of nursing licensure disciplinary committee.
      *   **Context:** Adjudicates ~40 cases/year. High stakes (nurse's livelihood). Time-constrained (one afternoon/hearing). No philosopher, has staff attorney.
      *   **Problem:** Increasing frequency of "I couldn't have done otherwise" defenses (duress, coercion, systemic constraints, addiction). Committee is split 50/50 on whether lack of alternatives negates responsibility. Decisions are currently based on "vibes."
      *   **Goal:** A concrete decision procedure (ordered list of questions) based on Frankfurt-style cases (actual sequence vs. alternative possibilities) but translated for non-philosophers.
      *   **Specific Requirements:**
          1.  Apply the procedure to three specific cases (Supervisor threat, Abusive partner diversion, Short-staffing deadline).
          2.  Identify where the procedure might misfire.
          3.  **Constraint 1:** Explicitly mark philosophical claims that are contested among specialists (e.g., the validity of Frankfurt cases).
          4.  **Constraint 2:** Distinguish between "real tests" (factual/observable) and "judgment calls" (normative/value-based).

  2.  **Deconstruct the Philosophical Core (Frankfurt Cases):**
      *   *Core Idea:* Moral responsibility depends on the *actual sequence* of events (did the agent's own mechanisms produce the action?) rather than the *alternative possibilities* (could they have done otherwise?).
      *   *The Objection (Flicker of Freedom/Incompatibilist):* If the intervener is perfect, there *are* no alternatives, so the intuition that the agent is responsible must be wrong, or the case is incoherent.
      *   *Application to Nursing:* We need to distinguish between *coercion that bypasses agency* (or completely overwhelms it) vs. *coercion that influences agency* but leaves the agent's own reasoning as the primary driver.
      *   *Translation:* Instead of "Could she have done otherwise?" ask "Did the constraint *cause* the action, or did it just *influence* the choice while the nurse's own judgment/character remained the engine?"

  3.  **Drafting the Decision Procedure (The "Actual Sequence" Protocol):**
      *   *Goal:* Move from "Could they have done otherwise?" to "Was this action *theirs*?"
      *   *Structure:* Needs to be linear, actionable, and clear about where philosophy ends and policy begins.
      *   *Step 1: Factual Existence of Constraint.* (Did the threat/pressure exist?) -> *Real Test.*
      *   *Step 2: Causal Link.* (Did the constraint *make* them do it, or just make them *want* to do it?) -> *Judgment Call/Philosophical Claim.* (This is the Frankfurt core).
      *   *Step 3: Alignment of Will.* (Did they agree with the act, or were they a reluctant tool?) -> *Real Test (via testimony/evidence).*
      *   *Step 4: Proportionality/Reasonableness.* (Was the threat immediate/serious enough to override professional duty?) -> *Judgment Call (Policy).*
      *   *Step 5: Mitigation vs. Exoneration.* (Even if responsible, does the constraint reduce the sanction?) -> *Judgment Call (Policy).*

      *Refining the Philosophical Markers:* I need to be careful not to present Frankfurtism as settled law. It's a heuristic for *attribution*, not a metaphysical truth. I must flag that Step 2 relies on the "Actual Sequence" view which is contested by "Alternative Possibilities" proponents.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Supervisor Threat (Falsifying Intake).*
          *   Constraint: Job loss.
          *   Agency: Nurse chose job over ethics.
          *   Frankfurt Analysis: The threat didn't bypass her will; it gave her a new reason. She acted on her own reasoning (prioritizing income).
          *   Outcome: Responsible, but maybe mitigation.
      *   *Case 2: Abusive Partner (Diversion).*
          *   Constraint: Physical safety/Threat.
          *   Agency: Fear vs. Duty.
          *   Frankfurt Analysis: Harder. If the threat is immediate violence, does it bypass agency? Usually, diversion implies planning. If she diverted *to give to him*, she exercised agency. If he held a gun to her head *while* she did it, that's different. Let's assume coercion over time.
          *   Outcome: Likely responsible but significant mitigation (duress).
      *   *Case 3: Short-Staffing (Deadline Miss).*
          *   Constraint: Systemic/Physical impossibility.
          *   Agency: "No compliant option."
          *   Frankfurt Analysis: This is the tricky one. If it was *physically* impossible, the "actual sequence" wasn't her choice, it was physics/logistics. However, usually, it's "I chose to skip the report to save the patient."
          *   Outcome: The procedure might exonerate (no agency), but the Board might hate that (public safety). This highlights the "Misfire" point.

  5.  **Addressing the Constraints (Philosophy & Judgment Calls):**
      *   *Philosophy:* The distinction between "compulsion" (bypasses will) and "coercion" (influences will) is the Frankfurt hinge. I need to label this clearly. The "Flicker of Freedom" objection suggests we can't truly know if alternatives existed. I need to note that the procedure *assumes* we can determine the source of motivation.
      *   *Judgment Calls:* Determining "reasonable fear" or "professional duty" is normative, not factual. I need to label these as Policy Decisions, not Fact Findings.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty and the philosophical basis (Frankfurt) without jargon.
      *   **The Protocol:** The step-by-step guide. Use icons or bold text to mark [Philosophical Claim] and [Judgment Call].
      *   **Case Applications:** Run the three cases through the protocol.
      *   **Failure Modes:** Where does this break? (Epistemic limits, Policy vs. Responsibility, The "Vibes" return).
      *   **Conclusion:** Final advice.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use plain English. Instead of "Actual Sequence," use "Source of the Action."
      *   *Critique:* Did I address the "Flicker" objection?
      *   *Fix:* Yes, in the "Philosophical Claim" markers. I need to explain that the procedure *brackets* the metaphysical question of free will and focuses on *attribution*.
      *   *Critique:* Is the distinction between "Real Test" and "Judgment Call" clear?
      *   *Fix:* I will add a legend or specific tagging system (e.g., **[FACT]** vs. **[VALUE]**).
      *   *Critique:* The user asked for "which answers end the inquiry with no discipline and which end it with full discipline."
      *   *Fix:* I need to make the decision tree explicit. Step X = Exoneration. Step Y = Sanction.

  8.  **Final Polish:** Check tone. Respectful of the board's gravity. Honest about the limitations of philosophy in law. Ensure the "Short-Staffing" case gets the critical treatment the user suspects it needs. (The user suspects the procedure will return an answer the committee won't like—likely exoneration or reduced blame, which conflicts with public safety mandates).

  *(Self-Correction on the Frankfurt Objection)*: The user mentioned the objection: "if she was never going to waver, you can't tell a story about what she would have done." This is the "Flicker of Freedom" or "Dilemma Defense." I need to acknowledge that the procedure *presumes* we can identify the *actual* cause, even if we can't prove counterfactuals. I will mark this as a contested epistemic assumption.

  *(Refining the "Short-Staffing" Case)*: If a nurse says "I literally could not physically document this," that's a factual claim. If she says "I couldn't do it *and* care for patients," that's a triage choice. The procedure needs to distinguish physical impossibility from prioritization.

