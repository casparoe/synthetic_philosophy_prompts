      *   **Address (5) & (6):** Explain that (5) is actually an admission that PBP violates (2), which is fine if (2) is wrong. (6) fails because the "agenda" is the legal doctrine the judges are sworn to uphold.
      *   **The Cost:** We must accept that collective rationality requires *institutional constraints* on voting. Not all votes count equally on all questions. Some questions are derivative. This makes the court less like a direct democracy and more like a reasoned body.

  8.  **Self-Correction/Nuance Check:**
