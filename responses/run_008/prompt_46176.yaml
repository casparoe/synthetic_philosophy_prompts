      *   **The Cost:** We admit that collective judgment requires *structure* imposed from outside the immediate votes (the legal doctrine). It means the "collective agent" is defined not just by the sum of votes, but by the *rules of reasoning* it is mandated to follow. This leans slightly towards a functionalist view of the group, but doesn't require a mystical "group mind" (keeping Premise 1 safe).
