prompt: |-
  My game theory professor keeps crossing stuff out. We're on iterated elimination, and every time she strikes a row she says 'a rational player never plays a dominated strategy, so we can just delete it' — and then, with the row gone, some column becomes dominated, so she deletes that too, and on it goes until one cell is left, which she announces is 'the' rational outcome. The first deletion I'm fine with. Its the iterating that feels like cheating: the strategy only became dominated *after* we pretended the earlier deletions were real, and I can't tell what licenses treating the reduced game as if it's the game the players were facing all along.

  Can you untangle what that one sentence she keeps repeating actually commits her to? I suspect there are several distinct theses packed into it — e.g. whether 'dominated' includes dominated only by a mixed strategy (last week she deleted some row that was beaten by no single other row but was beaten by a mix of two others, and I wasn't sure that was allowed), whether the players merely need to be rational or need to know that everyone is rational, and whether knowledge of rationality has to climb another level for each further round of deletion.

  Please give me a table I can bring to office hours. One row per distinct precise reading of the slogan, with columns:

  1. reading — the actual claim, stated precisely (not the slogan again);
  2. what it assumes — about knowledge of rationality, about the payoffs being common knowledge, about how the players think about the reduced game, whatever it needs;
  3. verdict — trivially true / substantive but defensible / false, with one sentence why;
  4. licenses iterating? — whether that reading alone supports delete-then-redelete until a single cell is left, including whether it covers the dominated-only-by-a-mixture case.

  Then one final row for whichever reading you think she's actually relying on when she declares the last surviving cell 'the' outcome, and say honestly whether that final step needs something the slogan by itself doesn't give her. If two readings only differ in some corner case that never matters in a 2x2 or 3x3, just merge them and note it. Also fine to include a reading that's obviously too strong — I'd rather see the full menu than the defensible subset.
