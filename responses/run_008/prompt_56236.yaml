prompt: |-
  I do trust & safety analytics for a mid-sized marketplace that sells hobby stuff -- miniatures paints, 3D printing filament, board game accessories -- and about a year ago we made the call to show average star ratings prominently in search results and on the product page. Ever since I've been semi-obsessed with the possibility that our ratings are partly self-fulfilling: a product gets a couple of early good reviews, everyone who buys it after that sees the score before they've formed their own opinion, and the later reviews are then partly just... echoes. I've been reading about information cascades and the part that really gets me is that this can happen even if every single reviewer is being perfectly rational -- once the accumulated signal from previous reviewers is strong enough, each new reviewer is right to lean on it over their own noisy experience, and past some point the chain basically stops transmitting new information, so two early reviews can end up setting the consensus for thousands of later buyers. Our head of product thinks I'm overthinking it and that "the wisdom of crowds sorts it out eventually."

  Here's what I want: an actual procedure I can run on a product's review history to decide how much of its rating is genuine quality signal versus cascade copying. I review maybe 25-40 flagged products a week, so it has to be something I can do in an hour or so per product, not a research project. I have decent data: timestamps, verified purchase flags, star rating, review text, whether the review came before or after our redesign that made scores more prominent, and roughly how each user got to the product (search, recommendation, external link). I can write SQL and do simple stats but I'm not going to fit a Bayesian reviewer model, and I can't run controlled experiments without six weeks of sign-off. Give me a set of tests in the order I should run them, what each one can and can't distinguish -- I keep getting tangled up on the difference between an informational cascade and a reputational one, and also between a genuine cascade and plain old social proof where reviewers just parrot what other reviewers said because it's easy -- where the procedure should just say "can't tell from this data", and where it hands the call off to a human because it's a values question, not a measurement. And be honest about which steps are judgement calls dressed up as procedure.

  Then run it on two products I'm actively arguing about with the head of product. One is a miniatures primer that took off after a big YouTuber reviewed it, and whose average rating has drifted steadily upward with each new wave of reviews, most of which read like "lives up to the hype" rather than describing the product. The other is a coffee grinder that the same YouTuber trashed, whose rating has been sliding ever since, with later reviewers explicitly citing earlier reviewers' complaints. He wants to feature the primer on the homepage and bury the grinder, and my suspicion is that both ratings are partly cascade artifacts and that our search ranking is just amplifying whatever that one video did. If the procedure ends up saying he's right and I'm wrong on either product, I want to hear that too -- and tell me what the procedure flatly cannot resolve, like whether we should even be showing aggregate scores up front given all this, or whether hiding the average from first-time viewers is the only real fix.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Role:** Trust & Safety Analytics at a mid-sized hobby marketplace (miniatures, 3D printing, board games).
      *   **Problem:** Concern that prominent star ratings create self-fulfilling prophecies (information cascades) rather than reflecting true quality.
      *   **Conflict:** Head of Product (HoP) believes "wisdom of crowds" fixes it; User suspects rational herding/cascades distort ratings.
      *   **Specific Goal:** A practical, hour-per-product procedure to distinguish genuine quality signal from cascade copying in review history.
      *   **Constraints:**
          *   Must be doable in ~1 hour/product (25-40/week workload).
          *   User knows SQL/simple stats, *not* Bayesian modeling.
          *   No controlled experiments (too slow).
          *   Data available: Timestamps, verified purchase, stars, text, pre/post-redesign, traffic source.
          *   Must distinguish: Informational Cascade vs. Reputational Cascade vs. Social Proof/Parroting.
          *   Must admit limitations (where it's a judgment call or unknowable).
          *   Must apply the procedure to two specific case studies (Miniatures Primer vs. Coffee Grinder).
          *   Must address the policy question (show vs. hide scores).
      *   **Tone:** Honest, analytical, pragmatic, acknowledging uncertainty.

  2.  **Theoretical Grounding (Mental Check):**

      *   *Informational Cascade:* Rational agents ignore private signals because public history is overwhelming. (e.g., "Everyone says it's 5 stars, my 4-star experience must be user error, I'll write 5.")
      *   *Reputational Cascade:* Agents conform to avoid social cost. (e.g., "If I say this YouTuber-loved product sucks, people will think I'm an idiot.")
      *   *Social Proof/Parroting:* Lazy reviewing. (e.g., "Yeah, what they said.")
      *   *Wisdom of Crowds:* Errors cancel out, signal remains. Requires independence. Cascades violate independence.
      *   *Key Indicator of Cascade:* Discontinuity or structural break in review behavior correlated with visibility of prior ratings or external shocks (YouTuber), specifically where private signal (text) contradicts public signal (stars).

  3.  **Developing the Procedure (The "Cascade Audit"):**

      *   *Goal:* Fast, SQL-friendly, heuristic-based.
      *   *Step 1: The Timeline Breakpoint.* Identify when the "momentum" started. Was it organic or external (YouTuber)?
      *   *Step 2: Text-Star Divergence.* This is the strongest signal. If stars are 5.0 but text is neutral/vague ("good," "nice"), that's herding. If text is specific and negative but stars are 5, that's rational herding (ignoring private signal).
      *   *Step 3: The "Verified" Split.* Unverified reviews herd faster. Compare verified vs. unverified trends.
      *   *Step 4: Traffic Source Correlation.* Did the surge come from Search (intent) or Recs/External (influence)?
      *   *Step 5: The "Disconfirmation" Test.* Look for negative reviews *after* the trend is established. Are they defensive? Do they apologize for disagreeing?
      *   *Step 6: The "Variance Collapse."* True quality has variance. Cascades suppress variance. Check standard deviation over time.

      *   *Refining the Steps for Time:* Keep it to 4 core SQL queries + 15 mins of reading.
      *   *Distinguishing Cascade Types:*
          *   Info Cascade: "I thought it was bad, but everyone else says good, so I'll rate good." (Hard to see directly, infer from Text-Star mismatch).
          *   Reputational: "I don't want to look like I don't know what I'm doing." (Seen in defensive text).
          *   Social Proof: "I didn't really use it, but it seems popular." (Seen in vague text + early review time).

  4.  **Applying to Case Studies:**

      *   **Product A (Miniatures Primer):**
          *   *Context:* YouTuber praised it. Rating drifted *up*. Reviews say "lives up to hype."
          *   *Analysis:* "Lives up to hype" is a keyword for expectation confirmation bias (cascade). Drifting *up* over time is suspicious (usually products drift down as mass market adopts). High correlation with external traffic.
          *   *Verdict:* Likely Cascade (Reputational/Info mix). HoP is wrong.
      *   **Product B (Coffee Grinder):**
          *   *Context:* YouTuber trashed it. Rating sliding *down*. Later reviewers cite earlier complaints.
          *   *Analysis:* Citing earlier complaints is *textual evidence* of an Information Cascade. They are adopting the public signal over private experience.
          *   *Verdict:* Likely Cascade (Info). HoP is wrong.
      *   **Comparison:** Both show signs of external shock driving the consensus, not organic quality discovery.

  5.  **Addressing the "Values" and "Unknowns":**

      *   *What can't be solved:* We can't know the "true" quality without a blind control group.
      *   *Policy Question:* Hiding scores helps independence but hurts UX. A "delayed reveal" or "verified purchase weighted score" might be middle grounds.
      *   *Judgment Calls:* Determining if "lives up to hype" is genuine satisfaction or social conformity is subjective.

  6.  **Drafting the Response:**

      *   *Introduction:* Validate the user's concern (it's real, HoP is oversimplifying).
      *   *The Procedure:* "The Cascade Audit." Break it down into Steps 1-5. Include SQL logic concepts. Define what each step detects.
      *   *The Distinctions:* Clearly define Info vs. Reputational vs. Social Proof in the context of the audit.
      *   *The Case Studies:* Run the audit on the Primer and Grinder. Be decisive but nuanced.
      *   *The Limitations:* Be honest about what data can't show.
      *   *The Policy:* Address the "show vs. hide" question.

  7.  **Refining the Tone:**

      *   Avoid academic jargon where possible, but keep the rigor.
      *   Acknowledge the political reality (arguing with HoP).
      *   Ensure the "1 hour per product" constraint is respected (focus on heuristics, not p-values).
      *   *Self-Correction during drafting:* I initially thought about suggesting sentiment analysis. *Correction:* User said "simple stats," no ML/NLP pipelines. Stick to keyword counting and manual reading samples.
      *   *Self-Correction on Case Studies:* The prompt says the Primer rating drifted *upward*. Usually, ratings drift *down* as adoption widens. An upward drift after an influencer hit is a massive red flag for herding. I need to highlight this.

  8.  **Final Review against constraints:**
      *   Procedure order? Yes.
      *   Distinguish cascade types? Yes.
      *   Admit "can't tell"? Yes.
      *   Run on two products? Yes.
      *   Address policy question? Yes.
      *   Honest about judgment calls? Yes.

  9.  (Final Polish): Make sure the SQL hints are actionable but not overly specific (since schema is unknown). Ensure the distinction between "Information Cascade" (rational ignoring of private info) and "Reputational" (fear of social cost) is clear in the text analysis section.

  *(Self-Correction on the Coffee Grinder)*: Wait, if the YouTuber trashed it, and ratings are sliding, is that a cascade? Yes, if new buyers are looking for the flaws mentioned rather than experiencing them independently. The prompt says "later reviewers explicitly citing earlier reviewers' complaints." That is the definition of an Information Cascade.

  *(Self-Correction on the Primer)*: "Lives up to the hype." This implies the review is about the *expectation* set by others, not the *object*. This is Reputational/Social Proof.

  Okay, ready to write.
answer: |-
  This is a classic Trust & Safety dilemma. Your Head of Product (HoP) is relying on the *Condorcet Jury Theorem* (wisdom of crowds), which assumes voter independence. You are worried about *Information Cascades*, which violate independence. In a marketplace with strong social signals (YouTubers, prominent ratings), independence is almost guaranteed to be violated.

  You cannot prove a cascade with 100% certainty without a blind control group (which you can't run). However, you can detect the *structural fingerprints* of a cascade.

  Here is a procedure designed for your constraints: ~45 minutes of SQL/data pulling, ~15 minutes of human reading. I call this the **Cascade Audit**.

  ### Part 1: The Cascade Audit Procedure

  Run these steps in order. If any step triggers a "High Risk" flag, the product is suspect. If 3+ trigger, you have strong evidence of a cascade artifact.

  #### Step 1: The Variance Collapse Test
  *   **Logic:** Genuine quality has variance. Even great products have some 3-star reviews from people with different use-cases. In a cascade, variance suppresses over time as the "public signal" overwhelms "private signals."
  *   **SQL:** Calculate the rolling standard deviation of star ratings (window = 10 reviews) over time.
  *   **Signal:** If the standard deviation trends toward zero as review count increases, that is unnatural.
  *   **Distinguishes:** *Cascade* (variance collapses) vs. *Wisdom of Crowds* (variance stabilizes but remains non-zero).
  *   **Limitation:** Niche products (e.g., specialized filament) naturally have low variance. Check against category baselines.

  #### Step 2: The Text-Star Divergence (The "Polite 5-Star" Check)
  *   **Logic:** In an **Information Cascade**, a rational reviewer ignores their negative private experience because the public score is so high. They leave a 5-star rating but write ambiguous text. In a **Reputational Cascade**, they leave 5 stars and write text defending the consensus.
  *   **Procedure:** Filter for 5-star reviews *after* the product became popular (post-YouTuber/post-redesign). Randomly sample 20.
  *   **Signal:** Count reviews that lack specific product attributes (e.g., "pigment density," "grind consistency") and use social validation language ("lives up to hype," "glad I listened," "just like [Influencer] said").
  *   **Distinguishes:** *Information Cascade* (Stars > Text Sentiment) vs. *Genuine Quality* (Stars ≈ Text Sentiment).
  *   **Judgment Call:** You must decide what counts as "specific." (e.g., is "works great" specific? No. is "covers in one coat" specific? Yes.)

  #### Step 3: The "Disconfirmation" Defense
  *   **Logic:** If a cascade is active, reviewers who *do* have a negative experience will feel social pressure to justify why they are the outlier.
  *   **Procedure:** Filter for 1-3 star reviews *after* the average rating stabilized >4.5. Read the text.
  *   **Signal:** Look for apologetic language ("I know everyone loves this, but...", "Maybe I got a bad batch, but...", "I'm probably doing something wrong").
  *   **Distinguishes:** *Reputational Cascade* (Reviewers feel social cost for dissenting) vs. *Genuine Quality* (Negative reviews are confident in their criticism).
  *   **Can't Tell:** Whether the negative reviewer is actually wrong or just a victim of bad luck.

  #### Step 4: The Traffic Source Correlation
  *   **Logic:** Cascades require a common source of information. If the rating surge correlates with "Recommendation" or "External Link" traffic rather than "Search," the signal is likely imported, not discovered.
  *   **SQL:** Plot average rating vs. % of traffic from "Search" over time.
  *   **Signal:** If ratings go up while % Search traffic goes down (and Referral/Recs goes up), the rating is being driven by influenced buyers, not intent-driven buyers.
  *   **Distinguishes:** *Social Proof* (Buyers come because it's popular) vs. *Organic Discovery* (Buyers come because they need the item).

  #### Step 5: The Pre/Post-Redesign Break
  *   **Logic:** Since you have the date where ratings became prominent, use it.
  *   **SQL:** Compare the slope of the rating trendline before vs. after the redesign.
  *   **Signal:** If the rating trend flattens or becomes artificially stable immediately after scores became visible, visibility is anchoring the reviews.
  *   **Distinguishes:** *Visibility Bias* (The UI caused the cascade) vs. *Product Lifecycle* (Natural maturation).

  ---

  ### Part 2: Distinguishing the Mechanisms

  You mentioned getting tangled in the types of cascades. Here is how the Audit separates them:

  1.  **Information Cascade (Rational Herding):**
      *   *Mechanism:* "The score is 4.9. My experience was a 4.0. I must be wrong. I will submit a 5.0."
      *   *Audit Indicator:* **Step 2 (Text-Star Divergence).** The star is 5, the text is vague or expresses doubt.
      *   *Implication:* The data is corrupted by rational actors. The "truth" is lost.

  2.  **Reputational Cascade (Social Cost):**
      *   *Mechanism:* "If I say this YouTuber-loved product sucks, people will think I'm an idiot/noob. I'll say it's great."
      *   *Audit Indicator:* **Step 3 (Disconfirmation Defense).** Negative reviewers apologize; positive reviewers cite the influencer.
      *   *Implication:* The community culture is suppressing dissent.

  3.  **Social Proof (Lazy Reviewing):**
      *   *Mechanism:* "It has 5 stars, so it's good. I didn't really use it much, but I'll confirm."
      *   *Audit Indicator:* **Step 4 (Traffic Source) + Step 1 (Variance Collapse).** High referral traffic + zero variance.
      *   *Implication:* Low effort, high conformity.

  **Where the Procedure Says "Can't Tell":**
  *   **True Quality:** You cannot know if the primer is *actually* good. It might be great *and* have a cascade. The audit only tells you if the *rating* reflects independent verification.
  *   **Malice vs. Herding:** You cannot distinguish between a paid review farm and a strong information cascade using this alone. (You need device fingerprinting/IP analysis for that).

  **Where the Call Hands Off to Human/Values:**
  *   **Step 2 & 3:** Deciding if "lives up to the hype" is a genuine expression of satisfaction or a signal of conformity is a qualitative judgment.
  *   **Intervention Threshold:** At what point do you suppress a rating? 80% cascade probability? 50%? That is a policy decision, not a data one.

  ---

  ### Part 3: Running the Audit on Your Two Products

  Here is the analysis based on the details you provided.

  #### Product A: The Miniatures Primer (YouTuber Praised)
  *   **Observation:** Rating drifted *upward* over time. Reviews say "lives up to the hype."
  *   **Audit Results:**
      *   *Step 1 (Variance):* **High Risk.** Ratings almost never drift *up* over time in e-commerce. Usually, as a product scales from early adopters to mass market, ratings drift *down* (regression to the mean). An upward drift suggests the "public signal" is correcting early outliers.
      *   *Step 2 (Text-Star):* **High Risk.** "Lives up to the hype" is not a product attribute. It is a confirmation of an external expectation. This is textual evidence of an Information Cascade.
      *   *Step 4 (Traffic):* **High Risk.** Likely heavy external/referral traffic from the video.
  *   **Verdict:** **Cascade Artifact (Reputational/Social Proof).**
      *   *Why:* The reviewers are reviewing the *YouTuber's accuracy*, not the *primer's performance*. They are rewarding the product for matching the prophecy.
      *   *HoP Check:* Your HoP is wrong. The "wisdom of crowds" requires independent signals. These signals are correlated via the video.

  #### Product B: The Coffee Grinder (YouTuber Trashed)
  *   **Observation:** Rating sliding down. Later reviewers cite earlier complaints.
  *   **Audit Results:**
      *   *Step 2 (Text-Star):* **Critical Risk.** "Explicitly citing earlier reviewers' complaints" is the textbook definition of an Information Cascade. They are not reporting their own private signal; they are reporting the public history.
      *   *Step 3 (Disconfirmation):* **Likely High Risk.** You will likely find 4-5 star reviews on this item apologizing for liking it ("I know people say it jams, but mine works...").
      *   *Step 1 (Variance):* **High Risk.** Variance likely collapsed as the "defect" narrative solidified.
  *   **Verdict:** **Cascade Artifact (Informational).**
      *   *Why:* Buyers are primed to find the fault. If the grinder jams once, they attribute it to the "known defect" rather than user error. If it works, they are surprised. The rating reflects the *narrative*, not the failure rate.
      *   *HoP Check:* Your HoP is wrong here too. Burying this product based on the rating punishes it for a narrative cascade, not necessarily a quality failure.

  #### Comparison & Conclusion
  **You are right on both.** Both products show strong signatures of ratings being driven by external narrative shocks (the YouTuber) rather than independent accumulation of quality data.
  *   **Primer:** Inflated by positive herding.
  *   **Grinder:** Deflated by negative herding (confirmation bias).
  *   **Search Ranking:** By ranking based on these ratings, you are indeed amplifying the YouTuber's opinion, not the marketplace's collective experience.

  ---

  ### Part 4: What The Data Cannot Resolve (The Values Question)

  You asked where the procedure hands off to a human. Here is the hard truth:

  **1. The "True Quality" Problem**
  This audit cannot tell you if the Primer is actually better than the Grinder. It only tells you that the *ratings* are contaminated. It is possible the Primer is a miracle product and the Grinder is junk. The cascade just exaggerated the gap.
  *   **Decision:** Do you penalize a good product because its fans are too enthusiastic? Do you punish a bad product because its critics are too vocal?
  *   **Recommendation:** Do not suppress the rating. Instead, **weight** it. If the Cascade Audit flags a product, apply a "Novelty/Influence Discount" to its search ranking score (not the displayed stars). Treat the rating as less reliable for sorting, but keep it visible for transparency.

  **2. The "Show vs. Hide" Policy**
  You asked if hiding the average from first-time viewers is the only fix.
  *   **Data Limit:** Your data cannot prove that hiding scores would improve long-term marketplace health. You can't measure the counterfactual.
  *   **Values Call:** This is a UX vs. Integrity tradeoff.
      *   *Showing Scores:* Reduces friction, helps quick decisions, but encourages cascades.
      *   *Hiding Scores:* Increases independence, but increases cognitive load and reduces conversion.
  *   **Middle Ground (The "Verified" Fix):** Since you have `verified_purchase` flags, consider displaying two scores: "All Reviews" and "Verified Purchase Only." Cascades often rely on unverified or low-effort reviewers. If the "Verified" score diverges significantly from the "All" score (check this in Step 1), display the Verified score more prominently. This rewards the "private signal" holders over the "public signal" followers.

  ### Summary for your Head of Product
  Don't argue theory ("information cascades"). Argue data integrity.
  1.  Show them the **Variance Collapse** on the Primer. (Ask: "Why does variance disappear as we get more data? That violates statistics.")
  2.  Show them the **Text-Star Divergence**. (Ask: "If the text doesn't describe the product, what is the star rating measuring?")
  3.  Propose a **Search Ranking Adjustment**, not a rating removal. "We shouldn't hide the data, but we shouldn't let one YouTuber dictate our search algorithm via herd behavior. Let's discount the ranking weight of products with high cascade risk."

  This moves the conversation from "You're overthinking it" to "Here's a risk to our search relevance we can mitigate."
