  The winning principle is **Reasonable Foreseeability with a Complicity Constraint**, and it requires you to abandon the intuition that **working at an AI lab under radical uncertainty is morally distinct from having a child**.

  This principle holds that you are obligated to produce clear, foreseeable good where the causal link is reliable (effective charity) and forbidden to directly participate in clear harm even if your marginal contribution is negligible (dietary choices), but you are permitted to undertake actions with massive but opaque causal ripples (procreation, career paths) without extra moral scrutiny. Your hesitation on the tech work contradicts your zero-hesitation stance on procreation; both are interventions with irresolvable long-term uncertainty, so if one is permissible by default, the other must be too, absent evidence of direct harm. The voting case fits as a special civic duty exception based on participation rather than impact, while the foreign donation fails the test because you lack the standing and local knowledge to make the effects legible.

  On the tobacco company job, the principle commits you to **rejecting the offer**. Unlike finance, which is a neutral tool, selling tobacco involves direct complicity in a harmful product, violating the constraint against participating in clear harm regardless of your plan to offset it with donations. You cannot trade direct, legible harm for distant, speculative good, just as you cannot ignore the direct harm of eating meat because the individual impact is small.
