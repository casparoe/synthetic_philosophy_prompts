answer: |-
  ### Desiderata for the Justification of Transitional Amnesty

  To advise the drafters effectively, we must distinguish between a *functional* amnesty (one that stops the shooting) and a *legitimate* amnesty (one that sustains the peace). The following criteria separate the structural necessities of transition from the ideological preferences of specific camps.

  **1. The Differentiation of Liability (Non-Negotiable)**
  The instrument must distinguish between categories of offending. It cannot treat crimes against humanity (torture, disappearance, extrajudicial killing) identically to political offenses (sedition, insurrection) or ordinary crimes committed under cover of conflict.
  *   *Case Requirement:* Must rule out the Argentine "Full Stop" approach for core atrocities while allowing it for lower-level political orders.
  *   *Rationale:* Indiscriminate blanket amnesty violates *jus cogens* norms and destroys the moral distinction between the regime and the resistance.

  **2. The Agency of Forgiveness (Non-Negotiable)**
  The justification must specify *who* is granting the remission. The state cannot forgive crimes committed *by* the state *against* its citizens on behalf of the victims.
  *   *Distinction:* Must distinguish **Amnesty** (extinguishing liability before/during trial) from **Pardon** (remitting sentence after conviction). A pardon acknowledges guilt; amnesty often obscures it.
  *   *Rationale:* If the state is the author of the crime, a sovereign act of closure (Argentine model) constitutes a second violence—a laundering of the crime through administrative fiat. Victims retain a residual claim to truth even if punishment is waived.

  **3. The Peace Constraint (Non-Negotiable)**
  The instrument must empirically reduce the likelihood of a return to armed conflict.
  *   *Constraint:* Must account for the empirical finding that amnesties correlate with reduced conflict *only* when they are part of a negotiated settlement, not when imposed unilaterally by victors or losers.
  *   *Rationale:* A justification that leads to a coup is a failed justification. However, this cannot be a "blank check"; the threat must be credible, not merely asserted by the military to escape accountability.

  **4. The Remedy Substitution (Contested/Prejudice)**
  If criminal punishment is waived, an alternative remedy must be provided.
  *   *Case Requirement:* Must accommodate the South African model (Truth for Amnesty) but reject the idea that "knowing the truth" is automatically equivalent to "justice" for all victims.
  *   *Rationale:* This is often a prejudice of the reconciliation camp. For some victims, truth without punishment is salt in the wound. The desideratum is not that victims *accept* the remedy, but that a remedy *exists* (reparations, lustration, public record).

  **5. The Non-Erasure Clause (Non-Negotiable)**
  The amnesty cannot mandate historical silence. It must allow for the establishment of a public record.
  *   *Constraint:* Cannot contradict the state's interest in not laundering its agents' crimes through a reconciliation narrative.
  *   *Rationale:* Amnesty may stop punishment, but it cannot stop history. A "right to forget" imposed by the state delegitimizes the new regime.

  **6. The International Compliance Floor (Non-Negotiable)**
  The instrument must navigate the trend against impunity for the worst categories of crime.
  *   *Constraint:* Cannot grant immunity for genocide, torture, or enforced disappearance if it exposes the state to valid universal jurisdiction claims that destabilize the transition.
  *   *Rationale:* Total impunity invites foreign intervention or sanctions that cripple the new democracy.

  ***

  ### The Joint Unsatisfiability Problem

  Drafters must be warned that **Desideratum 3 (Peace/Perpetrator Credibility)** and **Desideratum 4 (Victim Remedy)** are likely jointly unsatisfiable in a zero-sum environment.
  *   *The Tension:* For amnesty to be credible to perpetrators (guaranteeing they won't be prosecuted later), it must be robust and final. For amnesty to be acceptable to victims as a remedy, it must be conditional, grudging, and accompanied by stigma (e.g., public confession).
  *   *The Reality:* A mechanism robust enough to assure the military they will not face prison (Sovereign-Closure) is inherently too blunt to satisfy victims' demand for individualized accountability. Conversely, a mechanism granular enough to satisfy victims (SA Trade Model) is often viewed by militaries as too risky (admitting guilt invites civil suits or future prosecution). You cannot maximize both security for the oppressor and justice for the oppressed simultaneously; one must be prioritized as the *sine qua non* of the transition.

  ***

  ### Model Evaluations

  **The Trade Model (South African TRC)**
  This model scores highly on the Non-Erasure Clause and Agency of Forgiveness by forcing public confession, thereby acknowledging the victim's status without requiring prison time. It attempts to solve the Remedy Substitution by offering truth as currency. However, it struggles with the Peace Constraint regarding lower-level operatives who feared the amnesty conditions were too risky, and it often fails the Victim Remedy desideratum when perpetrators lie to secure amnesty, leaving victims with a corrupted record and no punishment. It treats amnesty as a transaction, which risks commodifying suffering.

  **The Sovereign-Closure Model (Argentine Full-Stop/Due Obedience)**
  This model excels at the Peace Constraint in the immediate term by removing uncertainty for the military hierarchy, effectively neutralizing the coup threat through legislative fiat. However, it fails the Agency of Forgiveness and Non-Erasure desiderata catastrophically; by treating amnesty as a sovereign gift rather than a negotiated exchange, it laundered state crimes and silenced the historical record. It violates the Differentiation of Liability by shielding torturers alongside conscripts. While it stabilizes the chain of command, it delegitimizes the judiciary and stores up social rage that erupts decades later, failing the long-term Peace Constraint.

  **The Plea-Bargain Model (Rwandan Gacaca)**
  This model addresses the capacity constraint of the judiciary, allowing for a high volume of cases that neither the Trade nor Sovereign models can handle. It respects Differentiation of Liability by offering sentence reductions rather than total immunity for the worst offenders. However, it struggles with International Compliance and Due Process standards, as community-based adjudication often lacks legal safeguards. It risks violating the Agency of Forgiveness by pressuring communities to "reconcile" locally while structural impunity remains. It functions as administrative efficiency but often sacrifices the depth of truth required for the Non-Erasure Clause.
