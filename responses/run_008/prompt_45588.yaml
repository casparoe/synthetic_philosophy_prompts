answer: |-
  Here is the breakdown of Dara's heuristic, the prediction for Marco, and the test to see if she's actually doing math or just dressing up intuition.

  ### The Prediction
  Dara will give Marco's documentary odds in the **high teens (15–18%)**.

  She will anchor on the **20% statistic** (films where the producer has played the festival before). She will treat this as the valid "Reference Class" (similar to her use of "Fintech sector" or "This airline/route").

  She will explicitly **discount Marco's 0-for-3 history**. Consistent with the restaurant call, she will classify this as "biography" (small-n individual track record) rather than data. She will likely say something like, "Three submissions is noise; the producer's track record is the structural signal."

  She will also **reject the "Programming Director Change" variable**. Consistent with her eye-roll at the Senator pundit, she will view this as post-hoc data dredging ("some guy online" sounds like the pundit to her), unless you can prove the sample size is massive and the criteria were pre-defined.

  ### The Rule She Is Running
  **"Structural Reference Class Prioritization."**

  Dara is attempting to run a specific version of Outside View forecasting. Her rule appears to be:
  1.  **Identify the most specific *structural* reference class with a large sample size.** (e.g., Fintech sector, This Airline/Route, Producer's Festival History).
  2.  **Discard *individual biography* unless validated by a gatekeeper.** (e.g., She ignored the Chef's history, but counted the Novelist's sales *because* there was an Agent involved. The Agent/Producer is a structural filter; the Chef/Founder is an individual variable).
  3.  **Reject *post-hoc* sub-classes.** (e.g., The Senator pundit's "midterm governor" rule, the online guy's "director change" rule).

  She is trying to distinguish between **systemic probability** (which she trusts) and **anecdotal momentum** (which she distrusts).

  ### Alternative Rules (Equifinality)
  Her track record is consistent with two other heuristics that would yield the same number but imply she is less coherent:

  **1. The "Sample Size Threshold" Rule**
  She simply has a hard cutoff for $N$.
  *   $N < 5$ is "Biography/Vibes" (Chef's 2 restaurants, Senator's 5 elections, Marco's 3 subs).
  *   $N > 50$ is "Data" (Flight routes, Fintech sector stats).
  *   *The Glitch:* The Novelist had only 2 sales. Why did that count?
  *   *Explanation:* She might count "Agent + Sales" as a single high-validity signal, whereas "Chef + Restaurants" is low validity. If this is the rule, she is coherent, but arbitrary about what counts as a "valid signal."

  **2. The "Contrarian Correction" Rule**
  She defaults to the number that corrects the person she is talking to.
  *   Friend worries about Restaurant -> Dara gives bleak base rate (Don't get hopes up).
  *   Pundit boasts about Senator odds -> Dara lowers them (Don't trust pundits).
  *   Friend worries about Startup -> Dara uses sector rate (Don't overvalue the founder).
  *   Friend shops Novel -> Dara gives decent odds (Encouragement).
  *   *Implication:* If this is the rule, her numbers are social tools, not predictions. For Marco, if the group is hopeful, she might lower the odds to manage expectations. If the group is gloomy about the 0-for-3, she might raise them to be supportive.

  ### The Dessert Test
  To determine if she is running a **Coherent Heuristic** (Structural Prioritization) or just **Vibes with Decimals** (Contrarian/Inconsistent), you need to force a conflict between *Individual Biography* and *Structural Class* in a direction she hasn't navigated before.

  **The Scenario:**
  *"My friend Sarah is opening a restaurant. She's a famous Chef with five previous hits (Strong Individual Biography). But she's partnering with a management group that has never opened a successful venue before (Weak Structural Class). The general failure rate for new restaurants is 60%."*

  **The Question:**
  *"What are the odds Sarah's place closes in two years?"*

  **How to Interpret Her Answer:**
  *   **If she says ~60% (High Risk):** She is **Coherent**. She is consistently prioritizing Structural Class (Management Group/General Rate) over Individual Biography (Chef's track record), matching her Restaurant and Startup calls. She believes systems beat talent.
  *   **If she says ~20% (Low Risk):** She is **Inconsistent/Vibes**. She is crediting the "Famous Chef" despite ignoring the "Chef" in the first restaurant example. This reveals she likely gave the Novelist good odds because she liked the friend, not because of the "Agent" rule. It proves she treats "Biography" as valid when it predicts success for people she roots for, but invalid when it predicts success for neutral parties.
  *   **If she hedges ("It depends on the contract"):** She is **Uncertain**. She realizes her heuristic has a hole in it.

  **Why this splits the rules:**
  In the Marco case, the Structural Class (Producer) is *positive* and the Biography (Marco) is *negative*. She is predicted to trust the Structure.
  In the Sarah case, the Structural Class (Management) is *negative* and the Biography (Chef) is *positive*.
  If she truly follows **Structural Reference Class Prioritization**, she must predict failure for Sarah, just as she predicts success (relative to base rate) for Marco. If she flips, she's just doing vibes.
