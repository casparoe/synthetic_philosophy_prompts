answer: |-
  This is a sophisticated critique of a metaphor that has hardened into dogma. The "Spandrels of San Marco" argument is one of the most famous pieces of evolutionary writing, but its rhetorical power often outstrips its technical precision when applied to evolutionary psychology (EP).

  Here is an audit of the analogy, the breakdown of its mapping, and an evaluation of whether the "spandrel" dismissal is logically licensed.

  ### 1. The Correspondence Table

  To see where the analogy strains, we must first formalize the mapping between the Basilica and the Organism.

  | Architectural Element (San Marco) | Biological Counterpart (Standard Adaptationist View) | Biological Counterpart (Gould–Lewontin View) |
  | :--- | :--- | :--- |
  | **The Architect** | Natural Selection (personified as a designer) | **Physical/Developmental Constraints** + Selection on *other* traits |
  | **The Dome & Arches** | The Primary Adaptation (e.g., large brain, bipedalism) | The Bauplan (Body Plan) or Primary Adaptation |
  | **The Spandrel** | A useless structural gap (initially) | A non-adaptive byproduct (phenotypic correlation) |
  | **The Mosaicist** | N/A (Adaptationists assume the trait *is* the mosaic) | **Secondary Selection** (Exaptation) or **Cultural Elaboration** |
  | **The Mosaics** | The proposed Function (e.g., music, religion) | Current utility or cultural usage |

  **Crucial Distinction:** In the adaptationist view, the "Spandrel" cell is often empty; they argue the trait *is* the arch (direct adaptation). In the G&L view, the trait is the empty space (byproduct) that was later painted (exapted).

  ### 2. Where the Mapping Breaks

  The analogy is pedagogically brilliant but biologically leaky. Here are the specific failure points you identified, plus one additional structural flaw.

  **A. Foresight vs. Filtering (The Architect Problem)**
  *   **Architecture:** The architect chooses the dome and arches *knowing* spandrels will result. The spandrel is a foreseen consequence of a chosen design.
  *   **Biology:** Selection has no foresight. It does not "choose" a large brain *knowing* it will produce a chin or a capacity for music. The byproduct is not a foreseen consequence; it is a blind physiological correlate.
  *   **The Break:** In architecture, the spandrel is structurally integral to the *design choice*. In biology, the byproduct is often a loose developmental consequence that could potentially be decoupled. The architectural analogy implies a rigidity that biology does not possess.

  **B. Geometric Necessity vs. Developmental Correlation**
  *   **Architecture:** Given Euclidean geometry, if you put a round dome on square arches, triangular spaces *must* exist. There is no way to have the arches without the spandrels.
  *   **Biology:** Biological byproducts are rarely geometrically necessitated. They are usually the result of **pleiotropy** (one gene affects multiple traits) or **developmental constraint**.
  *   **The Break:** A geometric necessity is absolute. A genetic correlation is probabilistic and evolvable. If a "spandrel" trait becomes costly, selection can often break the correlation over time (e.g., via modifier genes). Calling a trait a spandrel in biology implies a permanence that architectural spandrels have, but biological byproducts often lack.

  **C. The Mosaicist and Exaptation**
  *   **Architecture:** The mosaics are added later by humans. They add aesthetic value but do not change the structural role of the spandrel (it remains non-load-bearing).
  *   **Biology:** When a byproduct becomes useful (e.g., feathers for warmth, then flight), natural selection acts on it. It is not just "painted"; it is often reshaped, refined, and genetically assimilated.
  *   **The Break:** In biology, the "mosaic" can make the spandrel **load-bearing**. If a trait is co-opted (exaptation), it becomes an adaptation *for its current use*, even if it wasn't one *at its origin*. The architectural analogy freezes the trait as "originally useless," whereas biology allows it to become "currently essential."

  **D. Optimization (Additional Trouble Spot)**
  *   **Architecture:** Spandrels in San Marco are decorated to *look* like they fit the design, but they don't hold weight.
  *   **Biology:** If a trait is a byproduct, it should show signs of "good enough" design, not "optimized" design. However, if selection acts on the byproduct (exaptation), it will look optimized.
  *   **The Break:** It is empirically difficult to distinguish a highly refined exaptation from a direct adaptation just by looking at the trait's complexity. The analogy suggests we can spot a spandrel by looking at it (like seeing the triangle), but in biology, you usually need phylogenetic history to tell the difference.

  ### 3. Audit Question 1: Does the Disanalogy Matter for the Polemic?

  **Yes, the disanalogy matters significantly.**

  Your circle uses "spandrel" to mean "not an adaptation," implying the inference from *usefulness* to *selected-for-ness* is blocked.

  *   **The Strict (Architectural) Sense:** If a trait is a geometric necessity, it cannot be selected *against* without destroying the primary structure. In this case, usefulness is irrelevant to its *existence*. The inference from usefulness to origin is indeed blocked.
  *   **The Loose (Biological) Sense:** If a trait is a correlated byproduct (pleiotropy), it *can* be selected against if the cost is high enough, or selected *for* if the benefit is high enough (exaptation).

  **Why it matters:**
  If your circle uses "spandrel" in the loose sense, they are claiming that because a trait *started* as a byproduct, its current utility is irrelevant to its maintenance. This is false. A trait can originate as a spandrel and be maintained by selection (exaptation).
  *   **Example:** The human chin is likely a structural byproduct of jaw reduction (spandrel). However, if it now plays a role in sexual selection or speech mechanics, selection may be maintaining it.
  *   **The Polemical Error:** Using "spandrel" to block the inference from usefulness to *current maintenance* is a category error. It only blocks the inference from usefulness to *historical origin*. Since evolutionary psychology often cares about why a trait persists (current function) as much as how it originated, the "spandrel" dismissal is often a conversation-stopper that lacks logical bite. It proves the trait wasn't *originally* selected, but not that it isn't *currently* adaptive.

  ### 4. Audit Question 2: Does the Dismissal Survive?

  **No, the conclusion that "calling something a spandrel defeats the adaptationist explanation, case closed" does not survive scrutiny.**

  The analogy was carrying the dismissal the whole time, not the logic. Here is why:

  1.  **The "Load-Bearing" Renovation:** As you noted, a space can become load-bearing. In biology, this is **genetic assimilation**. A trait that begins as a plastic byproduct can become genetically fixed if it provides a fitness advantage. If your circle dismisses a trait as a spandrel, they ignore the possibility that the "mosaic" (the function) has become heavy enough that the "spandrel" is now under active selection. Dismissing it halts inquiry into *current* adaptive value.
  2.  **The Function of the Mosaic:** In San Marco, the mosaics are religious art. They have a function (didactic, aesthetic), even if the wall behind them doesn't. In biology, if a "spandrel" trait (e.g., capacity for music) confers a fitness advantage (social cohesion, mate attraction), it is functionally an adaptation *now*, regardless of its origin. To say "it's just a spandrel" is to say "its history is non-adaptive," but EP often asks "what is it for *now*?"
  3.  **The Burden of Proof:** The G&L paper was intended to shift the **burden of proof**, not to reverse it. They argued adaptationists assume function without testing. The "spandrel" label should mean "We need more evidence before claiming adaptation." Your circle uses it to mean "We have evidence it is *not* adaptation." That is a misuse of the null hypothesis.

  **Is the Spandrel Picture the Wrong Tool?**
  Yes, for the specific job of deciding when to infer function from usefulness. The architectural analogy is static; evolution is dynamic. It encourages a binary view (Adaptation vs. Spandrel) rather than a continuum (Direct Adaptation -> Exaptation -> Byproduct -> Drift).

  **A Better Tool: The Phylogenetic Null Hypothesis**
  Instead of the Spandrel analogy, use the **Comparative Method with Phylogenetic Control**.

  *   **How it works:** You do not ask "Does this trait look useful?" (which invites the spandrel critique). You ask "Does this trait covary with the ecological pressure across the phylogenetic tree?"
  *   **Why it's better:**
      1.  **Distinguishes Origin from Maintenance:** It allows you to see if a trait arose *before* the putative selective pressure (suggesting exaptation/spandrel) or *with* it (suggesting adaptation).
      2.  **Quantifies Constraint:** It allows you to model how much of the trait variance is explained by shared ancestry (constraint/byproduct) vs. ecological adaptation.
      3.  **Avoids Binary Traps:** It doesn't force a "Spandrel vs. Adaptation" verdict. It produces a probability that selection acted on the trait.

  **Alternative from Gould's Own Toolkit: Bauplan Analysis**
  If you want to stay true to G&L, use their positive methodology, not just their metaphor. They argued for analyzing the **Bauplan (Body Plan)**.
  *   **The Test:** If a trait is universal across a clade regardless of ecological niche (e.g., all mammals have 7 neck vertebrae, even giraffes), it is likely a constraint/byproduct. If it varies with the niche (e.g., beak shape in finches), it is likely an adaptation.
  *   **Application to EP:** Instead of saying "Religion is a spandrel," ask: "Is religious inclination universal across all human cultures (Bauplan/Constraint) or does it vary with ecological stressors (Adaptation)?" If it's universal, it might be a byproduct of cognition (a spandrel). If it varies, it might be adaptive. This moves the debate from metaphorical name-calling to empirical testing.

  ### Summary Verdict

  The "Spandrel" analogy is a **methodological warning**, not an **ontological verdict**.

  *   **Valid Use:** To remind researchers that usefulness does not prove historical origin (the Gould–Lewontin error).
  *   **Invalid Use:** To claim that a useful trait is therefore *not* maintained by selection, or to close the case on a trait's evolutionary history without phylogenetic evidence.

  When your circle announces a trait is "just a spandrel," they are often committing the reverse of the error they accuse adaptationists of: they are assuming that because a trait *could* be a byproduct, it *is* one, and that its current utility is irrelevant. The architectural analogy licenses this dismissal only by hiding the fact that in biology, mosaics can make spandrels load-bearing. A better heuristic is to treat "Spandrel" as a **Null Hypothesis to be tested**, not a **Conclusion to be announced**.
