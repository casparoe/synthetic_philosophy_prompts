prompt: |-
  A pop-sci book I'm reading wraps up its chapter on Occam's razor like this: 'Solomonoff induction finally puts a number on Occam's razor. It assigns every hypothesis a prior probability that shrinks exponentially with the length of the shortest program that computes it, so simpler theories are literally more likely to be true. Kolmogorov complexity supplies the measuring stick — the length of the shortest program that outputs your data — and since we can in principle search through all programs and find the shortest one, science now has a theorem that the simplest explanation is the best one. And the choice of programming language doesn't matter, because any computer can simulate any other, so at last Occam's razor has been proven rather than just assumed.' Something about this felt too clean to me, but I cant put my finger on where it goes wrong, if it does. Can you go through it piece by piece and tell me what someone who actually works on algorithmic probability would accept, where they'd wince, and what's flat wrong? And separately: does the final 'proven rather than assumed' claim follow from whatever correct parts survive your audit?
