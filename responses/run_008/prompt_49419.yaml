      *(Final check on Dummett)*: Dummett's book is short and accessible. He argues that the "right to exclude" is a myth inherited from the Westphalian system that doesn't hold up to moral scrutiny, especially given global economic disparity. He explicitly links the resistance to immigration to racism (fear of "the other"). I will synthesize this.

