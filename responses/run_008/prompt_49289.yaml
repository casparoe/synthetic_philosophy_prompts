prompt: |-
  I'm a software engineer with no formal philosophy training, but I've thought about decision theory enough to have settled on a position I take quite seriously: Hofstadter's superrationality. Where a group of agents reason the same way about the same symmetric problem, they will converge on one shared strategy, so the right move is to choose the strategy you'd want that shared strategy to be — cooperate in a one-shot prisoner's dilemma against a sufficiently similar reasoner, send a telegram with probability 1/20 in Hofstadter's Platonia setup, and so on. I like that it's not philanthropy: against a known conventional defector, you defect. I'm aware people file it somewhere between evidential decision theory and functional decision theory, though I've never fully sorted out the family relations. Tell me what would count against this view. I want the defeaters ranked by how damaging they'd be, from ones that would sink it to ones a committed superrationalist could shrug off, and including things that have arguably already happened: Hofstadter ran a real test, the Luring Lottery in Scientific American in 1983, where the prize was a million dollars divided by the total number of entries, the superrational prescription was for each reader to submit a single entry (or, on the mixed-strategy version, to randomize so that about one entry would arrive in total), and in fact enough readers submitted astronomically large numbers — several a googolplex — that the prize shrank to a fraction of a cent and no winner could be determined. Was that a failed prediction, mere evidence that Scientific American readers weren't superrational thinkers, or out of scope because the game was asymmetric in practice? Relatedly, I want an honest verdict on whether the clause about "sufficiently similar reasoners" has quietly insulated the view from any possible refutation, and whether that matters for a normative decision principle the way it would for an empirical theory. And if the strongest surviving form of the idea really is functional decision theory, tell me what that successor's best-known embarrassments are and whether they drag my view down with it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, no formal philosophy training, but deeply thought about decision theory. Settled on Hofstadter's Superrationality (SR).
      *   **Core Belief:** SR is the correct normative principle for symmetric problems with similar reasoners (Cooperate in PD, randomize in Platonia). It's not altruism; it's strategic reasoning about correlation.
      *   **Awareness:** Knows it's related to Evidential Decision Theory (EDT) and Functional Decision Theory (FDT).
      *   **Specific Questions:**
          1.  What counts against this view? (Ranked by damage level).
          2.  Analyze the "Luring Lottery" (1983 Scientific American) result: Failed prediction? Evidence readers aren't SR? Out of scope (asymmetry)?
          3.  Is the "sufficiently similar reasoners" clause a get-out-of-jail-free card (unfalsifiable)? Does that matter for a normative principle?
          4.  If FDT is the successor, what are *its* embarrassments, and do they drag SR down?
      *   **Tone:** Intellectual, rigorous, honest, respectful of the user's sophistication but willing to challenge the view.

  2.  **Deconstruct Superrationality (SR):**
      *   *Core Idea:* If I am rational, and you are rational, and we face the same problem, we will choose the same action. Therefore, my choice *determines* yours (logically, not causally). I should choose the action that yields the best outcome given that correlation.
      *   *Relation to EDT/FDT:* SR is essentially a precursor to FDT. It relies on logical correlation rather than causal influence. EDT sees correlation but gets tripped up by common causes (Smoking Lesion). FDT formalizes the "logical output of the decision algorithm" aspect.
      *   *Key Condition:* "Similar reasoners." This is the crux of the critique.

  3.  **Address the Luring Lottery:**
      *   *Setup:* Prize = $1,000,000 / N (where N is total entries).
      *   *SR Prescription:* If everyone reasons the same, they should all submit 1 entry (or randomize to keep N low).
      *   *Result:* People submitted $10^{100}$ entries. Prize collapsed.
      *   *Analysis:*
          *   *Failed Prediction?* Yes, empirically, people didn't behave SR.
          *   *Readers aren't SR?* Plausible. Most people are Causal Decision Theorists (CDT) or naive maximizers.
          *   *Asymmetry?* The game was symmetric in rules, but asymmetric in *belief*. If I think *you* will defect (submit many), my best response is to defect. SR requires common knowledge of SR.
          *   *Verdict:* It doesn't refute the *normative* claim (you *should* have submitted 1 if you knew others would), but it refutes the *descriptive* claim (people *will* do this). It highlights the fragility of the "similarity" assumption.

  4.  **Rank the Defeaters (Damage Assessment):**
      *   *Level 1 (Fatal):* Logical incoherence or impossibility of the "similarity" condition in any real scenario. If "similarity" is never met, the theory is vacuous.
      *   *Level 2 (Severe):* The "Similarity" clause makes it unfalsifiable/unactionable. If I can always say "they weren't similar enough," is it useful?
      *   *Level 3 (Moderate):* Conflicts with established intuitions in edge cases (e.g., Newcomb's Problem variants, Parfit's Hitchhiker).
      *   *Level 4 (Minor):* Empirical failures (like the Lottery) which can be explained away by lack of common knowledge.

  5.  **Address the "Similarity" Clause (Unfalsifiability):**
      *   *Normative vs. Empirical:* Normative theories tell you what to do *given* certain premises. If the premises (similarity) aren't met, the theory doesn't apply. This isn't necessarily a bug, but it limits scope.
      *   *The Trap:* If "similarity" is defined *post hoc* by "did they cooperate?", it's circular. If defined *a priori* (e.g., "same source code"), it's too narrow for humans.
      *   *Verdict:* It insulates the theory from empirical refutation but risks making it practically empty. For a software engineer, think of it like a precondition in a function. If `precondition == false`, the function doesn't run. That's valid code, but if the precondition is never true in production, the function is dead code.

  6.  **Address FDT and Embarrassments:**
      *   *FDT as Successor:* Yes, FDT (Yudkowsky/Soares) formalizes SR. It treats the decision as the output of a function.
      *   *FDT Embarrassments:*
          *   *Computational Intractability:* How do I know if another agent runs the same function? (The "Similarity" problem formalized).
          *   *The "Blackmail" Problem:* FDT agents might pay blackmailers to prevent the blackmail offer in the first place (acausal trade), which looks irrational to CDT agents.
          *   *Counterfactuals:* Defining logical counterfactuals is mathematically hard (open problem in logic).
          *   *Exploitation:* Can an FDT agent be exploited by a CDT agent who knows the FDT agent's source code? (Sometimes yes, in specific bargaining scenarios).
      *   *Drag on SR:* Since SR is the intuitive version of FDT, FDT's formal struggles reflect on SR's vagueness.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the sophistication. Validate the position (it's a respectable niche in decision theory).
      *   *Section 1: The Luring Lottery.* Be direct. It was a descriptive failure, not necessarily normative. But it exposes the "Common Knowledge" hurdle.
      *   *Section 2: Ranked Defeaters.*
          *   1. The Epistemic Barrier (How do you *know* they are similar?).
          *   2. The Asymmetry of Belief (I know I'm SR, but do I know *you* know?).
          *   3. Logical Counterfactuals (What does it *mean* for me to choose differently?).
          *   4. Empirical Irrelevance (Humans aren't SR).
      *   *Section 3: The "Similarity" Clause.* Discuss the "No True Scotsman" risk. Distinguish normative vs. empirical.
      *   *Section 4: FDT Connection.* Explain the lineage. List FDT critiques (Logical Uncertainty, Bargaining).
      *   *Conclusion:* Summarize. SR is a powerful heuristic but fragile in implementation.

  8.  **Refining the Tone:**
      *   Avoid condescension regarding "no formal training." The user clearly grasps the concepts.
      *   Use engineering analogies (source code, preconditions, API contracts).
      *   Ensure the ranking is clear.
      *   Make sure to answer the specific question about whether the "similarity" clause matters for normative theories. (Yes, because normative theories must be action-guiding).

  9.  **Self-Correction/Nuance Check:**
      *   *Did Hofstadter claim the Lottery would work?* He hoped it would demonstrate the concept. The failure is often cited as proof humans aren't superrational.
      *   *Is SR exactly FDT?* Not quite. FDT is more rigorous about logical counterfactuals. SR is more heuristic. I should clarify that distinction.
      *   *Is the "similarity" clause unfalsifiable?* If defined loosely, yes. If defined strictly (same algorithm), it's falsifiable but rarely applicable. This tension is key.

  10. **Final Polish:** Check against the prompt requirements (ranked defeaters, lottery verdict, similarity clause analysis, FDT embarrassments). Ensure the "damage ranking" is explicit. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "FDT is better." I need to explain *why* the user's view might be dragged down by FDT's problems. The user asked if FDT's embarrassments drag *their* view down. Since SR is the informal ancestor, yes, formal problems in FDT highlight the hand-waving in SR.

  *(Final check on the Lottery)*: Hofstadter actually analyzed the results. He concluded that people failed to be superrational. I should mention that. The "asymmetry" argument is weak because the rules were symmetric, but the *meta-game* (beliefs about others) was not.

  *(Final check on Normative vs Empirical)*: A normative theory that never applies is useless. If "similarity" is never satisfied, the theory is vacuous. This is a strong philosophical objection.

