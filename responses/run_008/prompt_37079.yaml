answer: |-
  You have independently rediscovered one of the most significant frameworks in contemporary philosophy of biology and mind. Your intuition is precise: you are describing the move from **causal role** to **selected effect**, and its application to mental content is known as **Teleosemantics**.

  Here are the answers to your three questions, followed by an analysis of the edges and limits of the theory.

  ### 1. The Name for Function by History
  The view you described—assigning a function based on why a trait was selected in the past, rather than what it is doing now—is called the **Etiological Theory of Function** (or the **Selected Effects Theory**).

  *   **The Core Idea:** A trait's function is the effect it performed in the past that contributed to the reproductive success of the organism's ancestors. This explains why a diseased heart is still "for" pumping: its *etiology* (history of selection) fixes its function, even if its current *capacity* is broken.
  *   **Key Proponents:** Larry Wright (1973), Ruth Millikan (1984), and Peter Godfrey-Smith.
  *   **The Contrast:** The opposing view is the **Causal Role Theory** (Robert Cummins), which defines function simply as what a part *does* within a containing system. Under Causal Role theory, a diseased heart's function might be "leaking fluid" if that's what it's currently doing. Your intuition correctly rejects this in favor of the Etiological view.

  ### 2. The Name for Extending This to the Mind
  Extending this historical/functional account to mental content (beliefs, desires) is called **Teleosemantics**.

  *   **The Core Idea:** A mental state represents $X$ because the mechanism producing that state was evolutionarily selected for correlating with $X$.
  *   **Solving False Belief:** As you guessed, this solves the problem of error. If a frog snaps at a BB pellet thinking it is a fly, the Causal Role theorist struggles to say why this is an *error* (maybe the mechanism is for "fly-or-BB"?). The Teleosemanticist says: The mechanism was selected for catching *flies* (nutrition). The BB case is a **misrepresentation** (a malfunction), just like the diseased heart. The normativity comes from history.
  *   **Key Proponents:** Ruth Millikan (*Language, Thought, and Other Biological Categories*), David Papineau, Karen Neander.

  ### 3. History vs. "Usual Cause" (Causal Covariation)
  You asked how the historical story differs from the simpler idea that a belief is about whatever *usually causes* it. This simpler idea is known as **Causal Covariation Theory** (associated with Fred Dretske and Jerry Fodor).

  **The Problem with "Usual Cause": The Disjunction Problem**
  If a belief is triggered by $A$ 90% of the time and $B$ 10% of the time, the Covariation theorist must say the belief is about "$A$-or-$B$." If so, the belief is *never false* when triggered by $B$. Error disappears.
  *   **Example:** If your "Snake!" belief is caused by snakes 95% of the time and coiled ropes 5% of the time, Covariation says your belief is actually about "Snake-or-Rope." When you fear the rope, you aren't mistaken; you're correctly identifying a "Snake-or-Rope." This is counterintuitive.

  **How History Handles It:**
  Teleosemantics cuts the disjunction. It asks: *Which of these causes (snake or rope) explains why this belief mechanism exists?*
  *   If ancestors survived because they avoided snakes, the function is **Snake**.
  *   The rope trigger is noise/interference.
  *   Therefore, the belief triggered by the rope is **false**.

  **Does it move the problem?**
  Critics argue it moves the problem to **Historical Indeterminacy**. It is often difficult to pinpoint exactly *which* historical effect was selected. Was the frog's tongue selected for "catching flies," "catching small moving things," or "maximizing calories"? If the history is ambiguous, the content is ambiguous. However, most teleosemanticists argue this is an empirical biological question, not a philosophical deadlock.

  ---

  ### Edges, Limits, and Coinages

  You asked to identify where the account struggles (side effects, learned habits) and to coin terms where established names are lacking. While Teleosemantics is a mature field, there are fuzzy edges.

  #### 1. Side Effects (Spandrels)
  **Established Term:** **Spandrels** (Gould & Lewontin).
  **The Edge:** Some traits exist not because they were selected for, but as unavoidable byproducts of other selected traits (e.g., the redness of blood is a side effect of hemoglobin's oxygen-carrying capacity; it wasn't selected for).
  **The Teleosemantic Verdict:** Spandrels have **no Proper Function**. Consequently, in a strict Teleosemantic view, mental states that are spandrels have **no determinate content**. This is a hard edge: if a cognitive quirk is a spandrel, Teleosemantics says it isn't "about" anything, even if it feels like it is.

  #### 2. Learned Habits (Ontogeny vs. Phylogeny)
  **The Problem:** Your heart example is phylogenetic (evolutionary). But what about a belief you learned last week? There is no evolutionary history for *that specific belief*.
  **Established Term:** **Derived Proper Functions** (Millikan).
  **The Explanation:** The specific habit isn't selected; the *mechanism that learned the habit* is. Your brain's learning circuits were selected for forming associations that track truth.
  **Coinage:** To clarify this distinction, let's coin the term **Ontogenetic Anchor**.
  *   **Definition:** An **Ontogenetic Anchor** is the historical selection pressure on a *learning mechanism* that fixes the content of a specific belief acquired during an organism's lifetime.
  *   **The Edge:** This works for simple learning (associating smoke with fire). It struggles with complex cultural concepts (e.g., believing in "quantum mechanics"). There was no selection pressure for ancestors to track quantum fields. Teleosemantics gets shaky here, often requiring a chain of "derived functions" through language and culture. If the chain breaks, the content becomes indeterminate.

  #### 3. The "Swampman" Edge
  **The Problem:** Imagine lightning strikes a swamp and randomly assembles a molecule-for-molecule duplicate of you (Swampman). Swampman has no history.
  **The Teleosemantic Verdict:** Swampman has **no beliefs**. He has no history of selection, so his states have no functions, so they have no content. He behaves like he believes it's raining, but he doesn't *really* believe it.
  **The Edge:** Many find this conclusion unacceptable. It suggests history is *too* strong a requirement. This is the strongest objection to the historical story: it severs the link between current structure and content.

  ### Summary
  You have accurately reconstructed the **Etiological Theory of Function** and **Teleosemantics**.
  *   **Function:** Fixed by **Selected Effects** (History), not Current Performance.
  *   **Mind:** Content fixed by **Teleosemantics**, solving error via **Malfunction**.
  *   **Vs. Covariation:** History solves the **Disjunction Problem** (Fly vs. Fly-or-BB) but risks **Historical Indeterminacy**.
  *   **Limits:** **Spandrels** lack function; **Learned Habits** rely on **Ontogenetic Anchors** (learning mechanisms); **Swampman** cases suggest history might not be the whole story.

  Your hunch is philosophically robust. The move to ground normativity in history is the standard solution for naturalizing intentionality, though it remains contested at the edges you identified.
