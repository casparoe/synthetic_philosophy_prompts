  7.  **Final Polish:** Ensure tone is academic but accessible (Senior Seminar level). (Self-Correction: Make sure not to get too bogged down in the math of anthropic reasoning, keep it conceptual.)

  8.  *(Final check of the "Philosopher's Conclusion" claim)*: The prompt says the narrator claimed the philosopher concluded we should accept it. Bostrom actually says "It is possible that we are living in a computer simulation... but we do not know." The narrator is definitely lying/misrepresenting here. I need to be firm on this.

  9.  *(Final check on Classmate)*: The classmate says the documentary *never mentioned* BIV. That's a specific claim about the documentary content I can't verify, but I can address whether the *argument* is just BIV. It's not *just* BIV. It uses BIV-like skepticism but grounds it in future tech stats.

  10. **Structure:**
      *   Intro: Identify Bostrom.
