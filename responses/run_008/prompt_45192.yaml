answer: |-
  This mapping reveals that the Confederate monument debate is not a clean application of Nietzsche's triad, but rather a collision between Nietzschean *vitalism* and modern *ethics*. When you run the positions through the *Untimely Meditation*, the categories fracture. Here is the honest breakdown.

  ### 1. The Heritage Defender: Corrupted Monumental, Not Antiquarian
  Superficially, the "Save the Statues" argument sounds Antiquarian. It appeals to age, tradition, and the preservation of "what is ours." But in Nietzsche's sense, true Antiquarianism is conservative and preservative; it loves the roots simply because they are roots. It would be satisfied to let the statue rust in a field or sit in a museum as a relic of a bygone era.

  Heritage defenders do not want the statues preserved as relics; they want them preserved as *active agents*. They want the statue to continue inspiring pride, defining identity, and anchoring a specific social order in the public square. This is **Monumental History**.

  However, it is **Corrupted Monumental History**. Nietzsche warns that monumental history risks flattening the past, ignoring the "causes" to focus on the "effects" (the greatness). The Lost Cause narrative is the perfect example of this flattening. It extracts "valor," "honor," and "heritage" (the usable effects) while surgically removing slavery and treason (the causes). A true Nietzschean monumental figure acknowledges the terrifying cost of greatness; the Heritage defender sanitizes it. They are not practicing Antiquarian reverence for the past *as it was*; they are practicing a reactive Monumentalism that treats a military defeat as a moral victory to fuel present-day *ressentiment*.

  ### 2. The Removalist: Critical History or Moralized Antiquarianism?
  Removalists claim the mantle of **Critical History**. Nietzsche defines this as the mode that "judges and condemns" the past to liberate the present. It requires the strength to break the past because the past is suffocating life. Tearing down a statue is undeniably an act of Critical history: it is a judgment that this symbol poisons the present.

  But here is the friction point you identified: Nietzsche ties Critical history to the capacity for **forgetting**. The goal of condemning the past is to shatter its chain so one can move forward unburdened. The modern removal movement, however, does not seek to forget. It seeks to *remember correctly*.

  When removalists demand the statue go to a museum, or demand context plaques, or demand lawsuits and documentaries, they are not practicing Nietzschean Critical history. They are practicing a **Moralized Antiquarianism**. They want to preserve the artifact (Antiquarian) but re-catalog it under a new moral regime. They want *more* history, not less. They want the past to remain hyper-visible, but judged.

  For Nietzsche, this is "historical sickness." Health requires the ability to close the horizon. The removalist demand for endless context, education, and reckoning is the opposite of Nietzschean health; it is an insistence that we cannot live until the past is fully adjudicated. So, the *act* of toppling is Critical, but the *political program* surrounding it is a demand for a new, stricter Antiquarian order.

  ### 3. Museums and Plaques: The Mummification and the Palimpsest
  *   **Museums:** This is the only clean fit. Moving a statue to a museum is pure **Antiquarian History**. The object is stripped of its "plastic power" to act on the living. It becomes a specimen. It is respected as "old," but it is no longer allowed to command the public square. Nietzsche would likely approve of this for dangerous idols: mummify them so they stop haunting the living.
  *   **Context Plaques/Counter-Monuments:** These are attempts to synthesize Critical and Monumental history, and Nietzsche would predict they fail. Adding a plaque to a monument creates a **historical palimpsest**. It asks the viewer to hold two contradictory modes simultaneously: reverence for the figure (Monumental) and condemnation of their acts (Critical). Nietzsche argues that for life to function, one must be able to feel *unhistorically*. A plaque forces the viewer to be *hyper-historically* conscious. It produces ambiguity, not vitality. It is a compromise that satisfies neither the need for inspiration nor the need for judgment.

  ### 4. The Flattening Warning: Who is Guilty?
  You asked if Nietzsche's warning that monumental history "flattens the past into usable effects" cuts against the heritage side or the removalists.

  It cuts against **both**, but differently.
  *   **Heritage:** Flattens the *complexity of the past* to extract *virtue*. (Ignores slavery to keep "honor.")
  *   **Removalists:** Flatten the *complexity of the past* to extract *vice*. (Ignores the specific historical contingencies of the 19th century to categorize the statue purely as "racism.")

  However, Nietzsche's deeper warning is about **imitation**. Monumental history tempts us to believe that because greatness existed once, it can be replicated. Heritage defenders want to replicate the "Southern Gent." Removalists often want to replace the Confederate statue with a statue of MLK or Harriet Tubman. This is still Monumental history. It assumes the solution to bad heroes is *good* heroes. Nietzsche might argue this keeps the culture trapped in the need for idols, rather than developing the strength to stand without them.

  ### 5. The Blind Spot: Injustice vs. Greatness
  This is where the triad breaks. Nietzsche's framework is built for a culture asking, *"How do we become greater?"* The Confederate debate is asking, *"How do we make amends?"*

  Nietzsche's triad assumes the subject of history is the **agent** (the hero, the culture, the conqueror).
  *   *Monumental:* Look at the hero to become a hero.
  *   *Antiquarian:* Look at the ancestors to know who you are.
  *   *Critical:* Destroy the ancestors to become yourself.

  The Confederate monument debate centers on the **victim**. The argument for removal is not primarily that the statues prevent white Southerners from achieving greatness (Nietzsche's concern); it is that the statues inflict harm on Black citizens (an ethical concern).

  Nietzsche has no category for **historical trauma**.
  *   For Nietzsche, "forgetting" is a sign of health. For a victim of historical injustice, "forgetting" is often a form of violence or erasure.
  *   For Nietzsche, the past is material to be used. For the removalist, the past is a debt to be paid.

  The triad is blind to the **political function of memory**. Nietzsche treats history as an aesthetic/nutritional resource for the individual or cultural will. He does not account for history as a site of *power distribution*. A Confederate statue isn't just a "memory"; it is a claim on public space and a signal of who belongs. Nietzsche's framework cannot distinguish between a statue that inspires "greatness" and a statue that enforces "subjugation," because both are expressions of will to power. He would likely view the removalists' concern with "offense" or "harm" as a symptom of weakness (slave morality), missing the point that the "strength" to condemn the past (Critical History) is being used here for social equity, not just individual vitality.

  **The Verdict:**
  The Heritage side is practicing a reactive, corrupted Monumentalism disguised as Antiquarianism. The Removalists are practicing Critical History in action but demanding Antiquarian rigor in memory. But the whole debate exposes the limit of Nietzsche's essay: it was written for a culture seeking to maximize its power, not for a pluralistic society seeking to negotiate a history of harm. Nietzsche asks if history serves *Life*. The monument debate asks if history serves *Justice*. Those are not the same question.
