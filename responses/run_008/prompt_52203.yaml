  3. Declining to vote lesser-evil and instead spoiling my ballot as a visible protest: somehow fine, even though it abandons the blocking that made 1 obligatory.
  4. Not voting in the mayoral race because I moved recently and haven't followed local issues: fine, arguably the right call.
  5. Voting in that same mayoral race after five minutes of skimming candidate websites: wrong — worse than not voting.
  6. Urging my apathetic, essentially uninformed brother to "just get out and vote" in the national election: good, admirable even.
  7. Spending a Sunday afternoon phone-banking for the lesser evil: supererogatory — praiseworthy if I do it, no blame if I don't.
  8. A referendum on a technical energy question I've researched deeply: I feel not merely permitted but required to vote; yet I'd also feel required to vote on it even un-researched, if turnout were forecast to be extremely low.

