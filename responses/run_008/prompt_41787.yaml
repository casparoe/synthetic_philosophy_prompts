answer: |-
  Dear Colleague,

  You have asked me to take Frank Jackson's knowledge argument, a staple of the philosophy of mind, and transcribe it into the technical language of colour science, stripping away the philosophical jargon in favour of spectra, encodings, and observer states. The goal is to see what remains of the argument when forced through the rigorous filter of your daily work. Let us begin by reconstructing Mary's situation using only the concepts you employ. In this translation, Mary is a scientist who possesses the complete spectral reflectance data for every surface object and the spectral power distributions for every illuminant. She knows the CIE cone fundamentals precisely, meaning she knows the exact weighting functions that map any incoming spectral power distribution to LMS cone excitations. Furthermore, she knows the post-receptoral transfer functions, including the non-linearities and the opponent-channel encodings that transform those cone excitations into the signals processed by the visual cortex. She understands device characterisation thoroughly, so she can predict how any physical stimulus will be encoded by a standard observer under any adaptation state. However, Mary has lived her entire life in an environment where her own visual system is deprived of chromatic input, perhaps through monochromatic illumination or neural blockade, so while she can compute the tristimulus values and the resulting opponent-coordinate vectors for any scene, she has never occupied the neural state corresponding to a chromatic experience. When she finally steps out and views a red rose, her optics transmit the long-wavelength energy, her cones excite according to the fundamentals she already knows, and her opponent channels fire, instantiating a specific state vector in her visual system. The argument claims that upon this instantiation, she learns something new.

  To make this claim precise in your vocabulary, we must define what knows all the physical facts means in terms of data possession versus system state. In your work, a physical fact is typically a measurement or a function relating measurements. If Mary knows all physical facts, she possesses the complete lookup table or the analytical function that maps input spectra to opponent-channel outputs. She knows that a specific reflectance spectrum under a specific illuminant yields a specific triplet of cone excitations, which subsequently yields a specific position in an opponent colour space like CIELAB or DKL. When she sees the rose, she does not acquire new spectral data; she already knew the reflectance curve of the rose. She does not acquire new transfer functions; she already knew the cone fundamentals. What changes is that she moves from possessing a description of the transformation to running the transformation on her own hardware. The learning event is not the acquisition of new external data but the instantiation of an internal state. She transitions from knowing that input X produces output state Y in the abstract, to actually being in state Y. The standard replies to the argument can be rendered similarly. The ability hypothesis suggests that what Mary gains is not new propositional data but a new practical capacity. In your terms, she gains the ability to recognise, imagine, or match the stimulus without external computation. She acquires a calibrated internal monitor profile that allows her to simulate the state voluntarily, whereas before she could only compute it theoretically. The phenomenal concept strategy argues that she acquires a new way of thinking about an old fact. Translated, this means she gains a direct indexical label for the opponent-channel state. Previously, she referred to the state descriptively, as the output of function f for input x. Now she refers to it demonstratively, as this state. It is the difference between knowing the RGB values of a pixel and seeing the pixel lit up on a display; the data is identical, but the access mode changes from indirect specification to direct instantiation. Jackson's own later recantation, where he conceded that qualia are physical states, translates to the claim that the opponent-channel state itself is a physical fact she was previously denied access to. On this view, she did not learn a non-physical fact; she simply gained access to a physical state of her own nervous system that was previously outside her observational reach.

  Now we must turn to the residue report, assessing what maps cleanly and what distorts or vanishes in this translation. The distinction between a spectral description and an opponent-channel state maps cleanly onto the distinction between knowing the specification and occupying the observer state. You deal with this constantly when distinguishing between a device-independent profile and the actual appearance on a specific display under specific viewing conditions. The difference between possessing a lookup table and running the transform is also a clear analogue for the difference between knowing the physics and having the experience. However, there is distortion. In philosophy, physical facts are often assumed to be objective and observer-independent, whereas in your vocabulary, the opponent-channel encoding is inherently observer-dependent. By defining Mary's knowledge as including the cone fundamentals and opponent weights, I have smuggled the observer's specific biology into the set of physical facts she already knows. This distorts the original argument, which intended physical facts to be purely external, objective facts about the world, not facts about the observer's internal processing. Furthermore, something has no expression in your vocabulary at all: the subjective feel of the state. Your framework describes the correlates of experience—the neural signals, the behavioural reports, the discrimination thresholds—but it does not measure the experience itself. You can measure the voltage on the neuron or the button press, but the what it is like aspect is outside the measurement protocol. In the translation, I have equated the experience with the occupancy of the neural state, but your science does not confirm that state occupancy is identical to feeling; it only confirms they are correlated. This is the primary residue: the translation converts a claim about consciousness into a claim about information access and system state, leaving the phenomenal character itself unaddressed.

  Let us apply this translated framework to your two test cases. First, consider tetrachromatic Mary, a trichromat who possesses every physical fact about tetrachromatic colour experience without being a tetrachromat herself. In your vocabulary, she knows the spectral sensitivity of the fourth cone and the expanded opponent-space geometry. She can compute the four-dimensional vector for any spectrum. However, her visual system collapses this into three dimensions. When she meets a tetrachromat, does she learn something new? In this framework, the distinction is clearer than in the ordinary case. She cannot instantiate the four-dimensional state because her hardware lacks the channel. The gap is not merely about access modes or concepts; it is about gamut mapping between devices with different primaries. She cannot render the signal. This suggests that in the ordinary trichromatic case, the knowledge argument might rely on a similar hardware limitation that is less obvious because the observer and the knower are the same type. The argument gains traction here because the impossibility of instantiation is physically obvious; she literally cannot generate the signal. Second, consider the metamer worry. Mary's data distinguish spectra that her own visual system cannot distinguish. Her room contains strictly more information than her experience does. Does the knowledge argument turn on anything beyond the distinction between a description and an instantiated encoding? In your vocabulary, this looks like the difference between having the spectral power distribution and having the tristimulus values. The experience is the tristimulus value; the physical fact includes the spectrum. If Mary knows the spectrum, she knows more than her experience tells her. When she sees the rose, she does not learn the spectrum; she learns the tristimulus value via direct encoding. This suggests the argument might turn on the lossiness of the visual encoding. The experience is a compressed version of the physical data. If learning something new means recovering the lost data, she fails; she only gets the compressed version. If learning something new means accessing the compressed version directly rather than via calculation, then the argument holds, but it looks less like discovering a new fact and more like changing the input method.

  Finally, you asked for my judgement on the residue itself: does it indicate that your framework is missing something the philosophers need, or that the philosophers' claim was never as clear as it looked? I will be direct. The translation suggests that the philosophers' claim was never as clear as it looked. When forced into the vocabulary of colour science, the knowledge argument dissolves into a confusion between data possession, system instantiation, and access modes. The robust distinctions you work with daily—between specification and appearance, between model and observer, between spectral data and cone excitation—are sufficient to explain the structural changes in Mary's situation without invoking non-physical facts. The residue, that missing subjective feel, appears to be a placeholder for a distinction that your vocabulary correctly identifies as outside the scope of physical measurement. If your framework is inadequate, it is only inadequate because it refuses to treat subjective feeling as a measurable variable, which is a feature of scientific rigour rather than a bug. The philosophers often treat the feel as a datum equivalent to a spectral measurement, but your work shows that experience is a state of the observer, not a property of the light. The argument survives only if one insists that the state of the observer is not a physical fact, but in your vocabulary, the opponent-channel state is as physical as the reflectance spectrum. Therefore, the residue indicates that the philosophical problem arises from a category error regarding information processing. They are treating the output of the visual system as if it were a separate ontological realm rather than the final stage of a physical transform. Your vocabulary does not miss something they need; rather, it exposes that what they think they need is a confusion between the map and the territory, or in your terms, between the spectral specification and the rendered image. The hard problem persists only if one refuses to accept that the rendering is the end of the physical story.
