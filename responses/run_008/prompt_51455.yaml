prompt: |-
  I got into an argument with my brother about the common prior assumption, and I want a second opinion with actual numbers. Quick setup so we're on the same page: the assumption says rational agents disagree only because they've seen different evidence — they'd have started from the same prior "before" any evidence, so once they share their information and reach common knowledge of each other's posteriors, they should agree (this is what's behind Aumann's agreement theorem, and the related no-trade results). My credence that the common prior assumption does more good than harm when we're modeling real disagreements between roughly informed, roughly honest people is about 0.6. His is more like 0.25. Give me your own number, but more importantly decompose it for me: how much rides on whether differing priors are mostly the residue of earlier differing evidence (i.e. there's a common prior "further back" if you dig), how much on whether a lot of apparent credal disagreements are really value or conceptual disagreements dressed up as probability estimates, how much on whether the fact that people obviously don't converge after talking reflects non-common-priors or just the fact that they never actually reach common knowledge of each other's views, plus any other terms you think belong. Give each term a rough probability with a one-line justification, then combine them. Then tell me which term you're least confident in, what evidence would move it, and finally: given my 0.6 and his 0.25, where do you think our disagrement most likely actually lives — the modeling question, or something about how much we care that the idealization is unrealistic in principle vs in practice?
