answer: |-
  This is a sophisticated objection, often called the **Continuity Argument** or the **Spectrum Argument** against lexical views. It is the standard "heavy artillery" used against threshold deontology and lexical utilitarianism. You are right to feel that it proves too much; if successful, it would eliminate not just your view, but any normative threshold based on a continuous variable (including many rights-based views and even some conceptions of personhood).

  Here is the diagnosis: The argument is **valid**, but it is **question-begging** against your specific view at **Premise (2)**.

  To maintain your view (3), you must reject (2). You cannot reject (5) without rejecting (2), and you should not retreat to incomparability without clarifying the decision procedure. Here is the breakdown of why rejecting (2) is the correct move, how to avoid the "ad hoc" charge, and how to handle the decision-theoretic consequences.

  ### 1. The Diagnosis: Reject Premise (2)

  **Premise (2):** *The disvalue of a pain is a continuous function of its intensity, at least in the neighborhood of the threshold.*

  This premise is the engine of the argument. It asserts that because pain intensity is continuous, moral disvalue *must* be continuous. Your view (Lexical Threshold Negative Utilitarianism) is explicitly the denial of this premise. Therefore, the argument assumes the falsity of your view to prove the falsity of your view.

  **Why you are entitled to reject it:**
  There is no metaphysical law requiring normative properties to track phenomenal properties continuously. We accept discontinuous normative shifts based on continuous inputs in many other domains:
  *   **Phase Transitions:** Water temperature is continuous. Its state (liquid vs. gas) is discrete. At 100°C, a negligible increase in heat causes a categorical change in state.
  *   **Personhood:** Biological development is continuous. Moral status (in many views) changes discretely at birth or viability.
  *   **Legal Thresholds:** As you noted, age is continuous, but legal liability is discrete.

  **The Cost:**
  The cost of rejecting (2) is the burden of explaining *why* the discontinuity exists. If you simply stipulate "The threshold is at 50 hedons," you are vulnerable to the charge of arbitrariness. To make the discontinuity principled rather than ad hoc, you must argue that suffering above $T$ is not just *more* suffering, but a **different kind** of suffering.

  **The Principled Defense:**
  You need a qualitative account of the threshold. For example:
  *   **Agency/Integrity:** Below $T$, pain is a frustration of preference. Above $T$, pain is a destruction of agency or a violation of integrity (torture breaks the will, whereas a headache merely annoys it).
  *   **Attention:** Below $T$, pain can be backgrounded. Above $T$, pain consumes the entire phenomenal field, making other goods inaccessible.

  If you can argue that $T$ marks a phase shift in the *nature* of the experience, then the discontinuity in disvalue is no more ad hoc than the discontinuity between liquid and gas.

  ### 2. Why Rejecting (5) Follows (But Isn't the Root)

  You asked: *If your answer is (5), tell me exactly how the disanalogy with legal and clinical thresholds is supposed to go.*

  Premise (5) is the **Tolerance Principle**: *If $p^-$ has a finite covering amount $F$, and $p^+$ is only negligibly worse than $p^-$, then $p^+$ has a covering amount only negligibly greater than $F$.*

  You should reject (5), but only because you have already rejected (2).
  *   If disvalue is continuous (2), then (5) is plausible.
  *   If disvalue is discontinuous (not-2), then (5) is false.

  **The Disanalogy with Legal Thresholds:**
  The opponent argues: "Legal thresholds are arbitrary conventions, so they can be discontinuous. Moral thresholds claim to be objective, so they must be continuous."
  **Your Response:** Moral thresholds are not arbitrary *if* they track objective qualitative shifts. The legal age of majority is indeed arbitrary (why 18 and not 18 years + 1 second?). But the threshold for "torture" is not arbitrary in the same way; it tracks the point where pain overwhelms the capacity for rational agency.
  *   **Legal:** We *stipulate* the cutoff for pragmatic reasons.
  *   **Moral:** We *discover* the cutoff based on the nature of the harm.

  So, the disanalogy holds: Legal thresholds admit arbitrariness; moral thresholds admit *categorical shifts*. The argument treats all thresholds as if they were merely legal-style stipulations, ignoring the possibility of natural kinds in moral ontology.

  ### 3. The Incomparability Reading (and its Trap)

  You asked: *If you think the incomparability reading rescues me, explain what the view then says when a decision must be made...*

  **Do not use "Incomparability." Use "Lexical Priority."**
  This is a crucial technical distinction.
  *   **Incomparability:** $A$ and $B$ cannot be compared. No relation holds. (Result: Decision paralysis. If I cannot compare torture to pleasure, I cannot choose.)
  *   **Lexical Priority:** $A$ and $B$ are comparable, but $A$ belongs to a higher order. Any amount of $A$ outweighs any amount of $B$. (Result: Clear decision rule.)

  If you claim incomparability, you cease to be a utilitarian (or any kind of consequentialist capable of action). You must claim that the *scale* of measurement changes.
  *   **Below $T$:** Measured in Hedons (Order 1).
  *   **Above $T$:** Measured in Torture-Units (Order 2).
  *   **Rule:** Minimize Order 2 first. Only if Order 2 is equal (or zero) do you minimize Order 1.

  **Does this solve the Sorites?**
  It solves the decision-theory problem, but it pushes the Sorites back one step. The opponent will ask: "Why does a 0.01 increase in pain move the experience from Order 1 to Order 2?"
  You answer this by returning to the **Qualitative Shift** defense in section 1. The move isn't about the *amount* of pain, but the *type* of harm.

  ### 4. Addressing the "Proves Too Much" Worry

  You are right that this argument threatens *all* thresholds. That is not a bug; it is a feature of the argument. It is an argument for **Radical Continuity**.
  *   If you accept the argument, you must be a Standard Hedonic Utilitarian (no thresholds anywhere).
  *   If you reject the argument, you must accept that normative properties can "jump" even when underlying properties do not.

  Since you (and most people) accept thresholds in law, medicine, and perhaps rights, you are already committed to rejecting the general principle that "continuous input requires continuous output." You are simply applying that existing commitment to the domain of value.

  ### 5. Summary of Recommendations

  1.  **Reject Premise (2).** Assert that moral disvalue is *not* a continuous function of pain intensity.
  2.  **Ground the Discontinuity.** To avoid the "ad hoc" charge, argue that suffering above $T$ involves a qualitative change (e.g., destruction of agency, violation of dignity) that suffering below $T$ does not. This makes the threshold a "natural kind" boundary rather than an arbitrary line.
  3.  **Clarify Lexical Priority.** Do not say $T$-pain has "infinite" disvalue (which creates math problems). Say it belongs to a **higher lexical order**. This invalidates Premise (5) because the "covering amount" doesn't grow negligibly; it ceases to exist within the lower order.
  4.  **Decision Procedure.** When forced to choose:
      *   Step 1: Minimize instances of $T$-level pain.
      *   Step 2: If $T$-level pain is equal (e.g., zero in both options), maximize net pleasure/minimize sub-$T$ pain.
      *   This gives you action guidance without collapsing into Standard Utilitarianism.

  **The Hard Truth:**
  You asked: *I am prepared to be told that wanting to keep (3) is the problem.*
  The only way keeping (3) is a problem is if you cannot defend the qualitative shift. If you cannot explain why $T$ is a special *kind* of pain and not just a *lot* of pain, then the Continuity Argument wins, and you are forced into Standard Utilitarianism. But if you can defend the qualitative shift, (3) is safe, and the argument fails because it assumes a continuous theory of value that your view explicitly denies.

  **Final Verdict:** Stand firm on (3), reject (2) as begging the question, and shore up your view with a qualitative account of suffering to deflect the "arbitrariness" charge.
