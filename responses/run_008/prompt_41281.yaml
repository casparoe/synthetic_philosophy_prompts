  My friend says (1)+(2) directly contradicts (3), that (2) makes (4) incoherent, and that (5) is me sawing off the branch everyone else climbs to escape. But I suspect he's lumping together things that aren't equally bad. Go through the pairs, tell me which are genuinely in tension and which ones dissolve once you look closer, rank the real tensions by severity, and be explicit about which one I should give up with the least collateral damage. Also, since I know none of this is as settled as my friend makes it sound: please separate what's basically agreed among people who work on this from what's a genuinely open fight, and flag wherever you're taking a side rather than reporting consensus -- I don't want to walk away thinking the majority position is unanimous when it isn't.
