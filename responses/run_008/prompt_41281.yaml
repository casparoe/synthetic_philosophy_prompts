  So I'm a backend engineer, no philosophy background, but I got nerd-sniped by this stuff because it's basically a thresholding problem and I keep thinking I can model my own head the way I model a service with confidence scores. Here's the set of positions I've ended up with after arguing with a friend who took epistemology in college, and I want to know if they can all be true at once:

