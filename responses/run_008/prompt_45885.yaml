  - "claim_assessments": an array, one object per substantive claim in the student's answer, ordered as the claims appear in the text. Each object must have these fields: "location" (a short locator, e.g. a paragraph number or a phrase of at most eight words quoted from the answer); "claim" (a neutral paraphrase of what the student asserts); "verdict" (exactly one of: "correct", "correct_but_imprecise", "subtly_incorrect", "clearly_incorrect", "misattributed", "unsupported_by_what_was_stated", "reasonable_but_contestable"); "explanation" (one to three sentences giving the precise correct content and why the verdict is what it is); "credit_impact" (exactly one of: "helps", "neutral", "costs_slightly", "costs_materially", "costs_heavily").
  - "missed_points": an array of brief strings naming things a strong answer would have included that this answer lacks, especially for part (a)'s instruction about how much rationality the impossibility needs and part (c)'s instruction about costs of the escape routes.
  - "hasty_grader_warnings": an array of brief strings flagging the specific places where a hurried grader would wrongly pass the answer or wrongly penalize it, with the reason in each case.
  - "borderline_calls": an array of objects, each with the fields "issue" (what is in question), "call" (how you resolved it), and "rationale" (why it could reasonably have gone the other way). If there are none, use an empty array.
  - "comments_to_student": two to four sentences of constructive feedback, as they would appear at the end of the exam booklet.
