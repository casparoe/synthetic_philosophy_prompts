      *   **Tone/Style:** Professional, direct, no-nonsense, precise. Avoid academic jargon unless defined. Treat the user as an expert in their field, not a philosophy student.
      *   **Constraints:** No philosophy background assumed (explain Kant/Grice briefly). Address the four specific points. Give a straight answer on the "leftover stuff."

  2.  **Deconstruct the Philosophical Debate (Lying vs. Misleading):**
      *   *Core Distinction:* Lying = asserting $P$ while believing $\neg P$. Misleading = asserting $P$ (believing $P$) but intending the listener to believe $Q$ (where $Q$ is false) via implication, omission, or context.
      *   *Moral Claim:* Many philosophers (e.g., Kant, Mahon, Fallis) argue lying is intrinsically worse because it violates the norm of assertion or trust more directly. Misleading is often seen as "shifty" but allows the liar to maintain technical truthfulness.
