  Regarding **cranes and skyhooks**, your friend is correct. Dennett argues that explaining complex design requires "cranes"—natural, bottom-up processes like natural selection—rather than "skyhooks," which are miraculous, unsupported lifters. Skyhooks assume the finished thing as a starting point. While Dennett associates skyhooks with creationist reasoning, he applies the term to any argument that posits an unexplained explainer, not just religious ones.

  The error lies in the conclusion about **reductionism**. Dennett defines "greedy reductionism" as skipping levels of organization (e.g., explaining chess directly via particle physics). However, he does *not* claim reductionism itself is bad. In fact, he is a committed reductionist. He argues for "good" reductionism that respects intermediate levels of organization rather than bypassing them.

  Therefore, the claim that "most reductionist scientists are secretly doing it wrong" does not follow. Dennett thinks scientists should avoid greed, not abandon reductionism. He defends evolutionary explanation precisely because it is the ultimate crane, providing a naturalistic account without skyhooks. For your bio class, the key takeaway is that Dennett champions evolution as a rigorous, bottom-up explanatory framework. Your friend's summary is half-right: the definitions are solid, but the implication that Dennett critiques reductionism itself is false. He critiques *bad* reductionism to save *good* science. Dennett's project is to show that Darwin's idea is dangerous because it eliminates skyhooks, not because it fails at reductionism.
