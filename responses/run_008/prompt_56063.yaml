prompt: |-
  I'm taking a seminar this semester on societal collapse (late Bronze Age, the Maya, Easter Island, that whole genre) and my professor keeps dropping the line that civilizations die from suicide, not by murder. I think it originally comes from Toynbee or someone like that, I've honestly seen it half-attribute to a few different people so don't take my word for it. Anyway she used it last week to wave off the whole external-shocks reading of the late Bronze Age collapse (the Sea Peoples, droughts, earthquakes, systems collapse à la Cline's 1177 B.C. -- you know the one), basically saying that if a civilization goes down it must have been something internal that did it, outside forces are never really the explanation. And yesterday she used it again to argue the Maya case wasn't really a collapse at all, more like a transformation, with power just shifting and life going on. It felt like the line was doing two pretty different jobs in those two uses, and I can't tell if either is actually licensed by the slogan.

  So, you're a historian who specializes in collapse narratives and the philosophy behind them, think carefully before answering, maybe brainstorm a bit first. I want you to take that one-liner -- civilizations die from suicide, not by murder -- and lay out the distinct precise claims it could be making. Like, from the most trivial reading (external forces never operate on a society with zero internal mediation, kind of a platitude) to the radical ones (societies are agents that can literally choose to fail, or that attributing collapses to external causes is always bad historiography, or even the transformative reading where collapse as a concept is basically broken and we should retire it). For each reading say whether it's plausible, contentious, or just false, and note where the ecocide-vs-rats fight over Easter Island and the whole "collapse vs. transformation" argument in Maya archaeology (southern lowlands vs. the northern cities) actually bears on it. Also flag where the line just becomes circular -- suicide meaning whatever internal factor we retroactively decide counts as the cause.

  Then tell me which reading my professor actually needs for each of her two moves, and whether the strongest version of that reading survives contact with the archaeological record. Please structure your answer with these sections, in this order: a short "First pass" (about 100 words on whether the slogan is doing the same work in both uses), then "The menu of readings" (sixish readings, 2-4 sentences each), then "Verdicts" (brief, which are platitudes, which are defensible, which are false), then "What my professor needs" (one paragraph per use), then "Settled vs. contested" (roughly 150 words clearly separating what archaeologists actually agree on here from what's still a live fight -- don't present a contested position as the consensus, I want to be able to push back in class without citing something everyone already rejected). One more thing, keep the bronze age stuff concrete, don't just talk about the slogan in the abstract.
