answer: |-
  ### First pass

  The slogan is performing an equivocation. In the Bronze Age context, it functions as a causal claim: internal weakness enables external defeat. In the Maya context, it functions as a definitional claim: societal change isn't death. These are logically distinct; the first demands internal failure, the second denies failure occurred. Your professor is using a single aphorism to mask two different argumentative burdens. While both invoke internal dynamics, one predicts demise while the other negates it. Consequently, the phrase isn't a unified theory but a rhetorical shield against different types of externalist explanations.

  ### The menu of readings

  1.  **The Mediation Platitude:** External forces always act through internal structures. A drought only kills if irrigation infrastructure fails to compensate. This is trivially true but explains nothing specific about the LBA or Easter Island. **Verdict: Platitude.**
  2.  **The Vulnerability Thesis:** Systems must be fragile to succumb to shocks. On Easter Island, this supports the ecocide view (trees gone before rats); in the LBA, it suggests palaces were already brittle before the Sea Peoples arrived. **Verdict: Plausible.**
  3.  **The Moral Agency Claim:** Civilizations are agents capable of intentional self-harm. This implies Maya elites chose ritual over adaptation. Societies lack unitary consciousness, making "suicide" a metaphorical overreach. **Verdict: False.**
  4.  **The Historiographical Critique:** Blaming outsiders is lazy history or nationalist apologetics. This argues invoking Sea Peoples excuses systemic flaws. Sometimes external shocks are genuinely catastrophic regardless of internal health. **Verdict: Contentious.**
  5.  **The Transformationalist View:** Continuity of culture means no collapse occurred. This fits the Maya North surviving the South's decline. It risks minimizing the demographic catastrophe in the Southern Lowlands. **Verdict: Contentious.**
  6.  **The Circular Definition:** "Suicide" is just a label for whatever internal factor we find post-hoc. If we find soil depletion on Easter Island, it's suicide; if we find rats, it's murder. This precludes falsification. **Verdict: False reasoning.**

  ### Verdicts

  *   **Platitudes:** Reading 1 (Mediation).
  *   **Defensible:** Reading 2 (Vulnerability), Reading 4 (Historiographical).
  *   **False/Flawed:** Reading 3 (Agency), Reading 6 (Circularity).
  *   **Contested:** Reading 5 (Transformation).

  ### What my professor needs

  For the Late Bronze Age, she needs Reading 2 (Vulnerability). She wants to argue that droughts and Sea Peoples only succeeded because palatial systems were already rigid or overextended. However, the strongest version of this admits external shocks were necessary triggers, not just opportunistic predators. Calling it "suicide" obscures Eric Cline's "systems collapse" model, where interconnectedness amplified shocks rather than internal moral failure causing death. The slogan implies intent where there was only fragility.

  For the Maya, she needs Reading 5 (Transformation). She uses "suicide" to imply agency was retained—power shifted rather than vanished. This survives contact with the record only if you focus on the Northern Yucatán or commoner resilience. However, it falters against the Southern Lowlands' demographic crash and monument cessation. Using "suicide" here is contradictory; if they transformed, they didn't die. The slogan masks the reality that for many Maya, the political order did effectively commit suicide, even if the people survived.

  ### Settled vs. contested

  Archaeologists agree the Late Bronze Age collapse was multifactorial; no single cause (Sea Peoples or drought) explains the systemic failure across the Eastern Mediterranean. There is consensus that Maya political collapse was regional (Southern Lowlands) rather than total, with Northern cities persisting. On Easter Island, pre-contact ecological stress is accepted, though the magnitude versus European impact is debated. Contested ground remains the weighting of these factors: was climate the primary driver or a stressor? Furthermore, the definition of "collapse" itself is live fire; some argue it is a normative judgment implying failure, while others see it as a descriptive reset. You can safely challenge the "suicide" framing as teleological, but you cannot claim external shocks alone caused the LBA without acknowledging internal fragility.
