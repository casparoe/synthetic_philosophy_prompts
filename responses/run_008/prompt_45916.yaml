answer: |-
  This is a sophisticated diagnosis of a well-worn debate. You are right to feel that the "25-year freeze" indicates a structural problem in the dialectic rather than just a lack of clever arguments. Your hypothesis that this is partly verbal but partly a conflation of distinct questions is close to the mark, but I think we can sharpen it further.

  Here is an evaluation of the dispute's structure, grounded in the specific claims of the protagonists, followed by a prescription for what progress would actually look like.

  ### 1. Diagnosis: It is not merely verbal; it is a clash of "Kind-Making" Criteria

  Your advisor's view (that it's all terminological) is half-right but dangerous. If it were *purely* verbal, the divergence in research programs (as you noted) wouldn't happen. Scientists don't build careers on synonyms. However, your intuition that they are answering different questions is the stronger lever.

  The stalemate persists because **Clark/Chalmers** and **Adams/Aizawa** are operating with incompatible criteria for what constitutes a *natural kind*.

  *   **The Extensionist Criterion (Functional Role):** Clark and Chalmers are functionalists. For them, the "kind" *cognition* is defined by what it *does*. If a process plays the functional role of memory (storing, retrieving, guiding action), it is memory. The substrate is irrelevant. Their question is: *"What is the smallest system that reliably produces this behavior?"*
  *   **The Internalist Criterion (Intrinsic Mechanism):** Adams and Aizawa are essentialists (often leaning toward biological naturalism). For them, the "kind" *cognition* is defined by *how it is made*. They argue that cognition involves specific causal mechanisms (e.g., neural plasticity, non-derived content) that notebooks lack. Their question is: *"What is the specific biological mechanism that generates this capacity?"*

  **The Coupling-Constitution Fallacy is the pivot point.**
  Adams and Aizawa charge that Extensionists confuse *causal coupling* (the notebook affects Otto) with *constitution* (the notebook is part of Otto). But this charge only sticks if you assume constitution requires intrinsic similarity. Clark rejects this premise. He argues that if the *functional organization* is identical, the constitution is identical.

  Therefore, the dispute is not just about the word "cognition." It is a **meta-ontological disagreement about how to carve nature at its joints.**
  *   Internalists believe joints are found in **material continuity** (skin/skull boundaries, neural tissue).
  *   Extensionists believe joints are found in **causal topology** (feedback loops, functional isomorphism).

  Because they agree on the *facts* (Otto looks at the notebook) but disagree on the *criteria for kindhood*, no amount of empirical data will resolve it. You cannot measure "constitution" directly; you have to interpret it through a theoretical lens.

  ### 2. Evaluating Your Hypotheses

  **Hypothesis A: It's a verbal dispute.**
  *Verdict:* **False, but symptomatic.**
  It feels verbal because they use the same label ("cognition") for different concepts. But it's not *just* semantics because the label carries theoretical weight. If you grant the label "cognition" to the notebook, you commit to a functionalist methodology. If you withhold it, you commit to a mechanistic/biological methodology. The fight over the word is a proxy fight over which methodology gets to define the field.

  **Hypothesis B: They are answering two different questions.**
  *Verdict:* **True.**
  This is the core of the impasse.
  1.  **Extensionists** are asking a **Methodological/Explanatory question**: "What is the most useful unit of analysis for predicting and explaining intelligent behavior?"
  2.  **Internalists** are asking a **Metaphysical/Categorical question**: "What are the necessary and sufficient conditions for a state to count as mental?"

  When Clark says "The mind extends," he means "The *explanatory system* extends." When Adams says "The mind stops at the skull," he means "The *ontological bearer* of mental properties stops at the skull." They are talking past each other because one is doing cognitive *engineering* (how to build/model it) and the other is doing cognitive *anatomy* (what is it made of).

  **Hypothesis C: The question is ill-posed.**
  *Verdict:* **Mostly True.**
  The question "Where does the mind end?" presupposes that "the mind" is a singular object with a spatial boundary. If cognition is a process rather than a thing, asking for its spatial boundary is a category mistake. It's like asking, "Where does the economy end?" The economy involves people, buildings, and digital servers. You can ask where the *institution* is legally bound, but not where the *process* physically stops.

  ### 3. What Would Count as Progress?

  Given this diagnosis, waiting for a "principled mark of the cognitive" (as Internalists demand) is a fool's errand. The Extensionists will never accept a mark that excludes functionally identical external processes, and Internalists will never accept a mark that includes inert matter.

  Progress requires **dissolving the boundary question in favor of a utility question.**

  **Do not seek:** A definitive answer to "Is the notebook *really* part of the mind?"
  **Do seek:** A framework that specifies *when* the Extended hypothesis is more fruitful than the Embedded hypothesis.

  **Concrete markers of progress for your group:**
  1.  **Abandon the "Is it?" question:** Stop asking if external resources *are* cognitive. Start asking: "Under what conditions does modeling this system as a coupled dyad yield better predictions than modeling it as an organism with tools?"
  2.  **Identify the "Glue":** Instead of arguing about boundaries, argue about **integration**. Rupert (who you mentioned) suggests "Cognitive Integration." Progress looks like defining the *degrees* of integration (e.g., transparency, reliability, trust) rather than a binary In/Out switch.
  3.  **Formal/Experimental Adjudication:** A result that counts as progress would be a formal model showing that an "Extended" model has lower computational complexity or higher predictive accuracy than an "Internal + Input" model for specific tasks. If the Extended model is just a metaphor for the Internal one, the Internalists win. If the Extended model captures dynamics the Internal one misses (e.g., in distributed problem solving), the Extensionists win.

  ### 4. A Well-Posed Replacement Question

  If you need something to bring back to the group to break the freeze, propose shifting the debate from **Ontology** (what exists) to **Individuation** (how we count systems).

  **Replace:** "Is the notebook part of Otto's memory?"
  **With:** "Does the Otto-Notebook system constitute a *single control loop* that cannot be decomposed without loss of explanatory power?"

  This reframes the debate:
  *   **Internalists** must show that the loop *can* be decomposed (Otto + Notebook) without losing predictive power.
  *   **Extensionists** must show that decomposing it *does* lose power (e.g., because the latency, trust, and accessibility are dynamically coupled).

  **Why this helps:**
  It moves the debate away from "Is it cognition?" (which relies on folk intuitions about minds) to "Is it a coupled dynamical system?" (which relies on measurable variables like feedback latency and error correction).

  ### 5. Summary for Your Group

  You can tell your group this:
  The debate is frozen because it is a **category clash**. Internalists are looking for **mechanisms** (neural processes), while Extensionists are looking for **systems** (functional loops). Both are valid scientific perspectives, but they cannot be adjudicated by appealing to the same evidence.

  The "Coupling-Constitution" charge is not a refutation; it is a statement of preference for biological mechanisms over functional roles.

  **The way out:**
  Acknowledge that "Cognition" is likely a **cluster concept** rather than a natural kind with a sharp boundary. The goal of cognitive science should not be to draw a line around the mind, but to map the **gradient of coupling**.
  *   **Weak Coupling:** Looking up a fact in a library once (Embedded).
  *   **Strong Coupling:** Otto's notebook, always carried, automatically trusted (Extended).

  Progress isn't deciding which side is "true." Progress is mapping the conditions under which the *Extended description* becomes necessary. If you can agree on that, you stop fighting over the word "cognition" and start fighting over the measurable variables of integration. That is a science you can actually do.
