answer: |-
  # PANEL OBJECTION SHEET
  **Subject:** Defense of Composite/Reconstructed Memoir Elements
  **Context:** "The Nonfiction Contract" Panel
  **Opposition:** Fact-Checker, Literary Editor, Strict Memoirist

  ---

  ### 1. THE "NUCLEAR" QUESTION (Hope Nobody Asks)
  **Source:** *The Logical Implication (likely voiced by the Editor or an audience member)*
  **Vocabulary:** *Liability, Harm, Defamation, Ethical Consistency.*

  **The Question:**
  "You argue there is no principled stopping point between compression and fabrication. But if your composite character were alive, or had living heirs who could be defamed by the merged traits, would you claim the same license? If not, doesn't that admit your 'slippery slope' is actually bounded by the risk of harm, not the nature of memory?"

  **Your Reply:**
  "You've identified the true contract: it isn't about purity, it's about consequence. With the dead, the 'harm' is to history, which is always interpretive. With the living, the harm is legal and personal. My disclosure convention protects the reader from expecting forensic reportage, while the death of the subjects removes the risk of libel. The principle is *transparency*, applied differently based on the stakes."

  **Where the Reply is Soft:**
  This concedes that your sorites argument (no bright line) is false. You *are* drawing a bright line, but it's based on *consequences* (harm) rather than *ontology* (truth). If pressed, you must admit that "nonfiction" means different things depending on who is alive, which weakens the claim that memory itself justifies the invention.

  ---

  ### 2. THE FACT-CHECKER'S CHALLENGE
  **Source:** *Magazine Fact-Checker*
  **Vocabulary:** *Verifiability, Record, Evidence, Misleading.*

  **The Question:**
  "If a reader attempts to verify the timeline of your second chapter against public records, they will find a discrepancy. You have compressed two years into one. At what point does 'narrative shaping' become a falsification of the record? How do you expect a reader to distinguish between a memory error and a deliberate structural lie?"

  **Your Reply:**
  "Memory *is* a compression algorithm; the brain does not store timestamps. By compressing the chronology, I am mirroring the subjective experience of that period, which felt like a single, continuous year. The 'record' tracks events; the memoir tracks the impact of events. I am not falsifying the record; I am prioritizing the psychological truth over the administrative one."

  **Where the Reply is Soft:**
  The Fact-Checker does not care about psychological truth. They care about the label "Nonfiction." You are redefining the genre to suit your text. If they press on "deliberate," you cannot claim this was a memory error. You must stand on the "Author's Note" as the only firewall between you and fraud.

  ---

  ### 3. THE EDITOR'S CONTRACT
  **Source:** *Literary Editor*
  **Vocabulary:** *Genre Expectations, Marketplace, Brand, Categorization.*

  **The Question:**
  "When a book is shelved as Memoir, the marketplace makes a promise: *This happened.* By merging two neighbors into one, you have created a character who never existed. Doesn't this void the genre contract? If you need to invent a person to make the theme work, why isn't this a novel? Are you not simply mislabeling the product to gain the authority of truth without the burden of accuracy?"

  **Your Reply:**
  "The 'authority of truth' I seek is not the authority of the police report, but of the witness. The composite neighbor represents a *type* of presence that defined that era, more accurately than two fragmented sketches would. I am not mislabeling the product if I disclose the method. The contract isn't 'every detail is forensic'; it's 'the author is honest about the reconstruction.'"

  **Where the Reply is Soft:**
  Most readers do not read the Acknowledgements or Author's Note. The Editor knows that the *cover* sells the book. If the disclosure is buried, the "honest line" you propose is functionally invisible. You are relying on a convention (disclosure) that the marketplace ignores.

  ---

  ### 4. THE TESTIMONY OBJECTION
  **Source:** *Strict Memoirist*
  **Vocabulary:** *Testimony, Sanctity, Witness, Betrayal, The Dead.*

  **The Question:**
  "We are witnesses to the dead. To put words in their mouths that they did not speak is a betrayal of their memory. You admit you reconstructed a dozen scenes. How can you claim to offer testimony when you concede the wording is invented? Does the fact that they are dead and cannot correct you make it easier to appropriate their voices?"

  **Your Reply:**
  "All dialogue in memoir is reconstruction. Unless you carried a tape recorder, your 'word-for-word' recall is also a confabulation. The difference is I am admitting the reconstruction. I am not appropriating their voices; I am channeling the *substance* of our interactions. To insist on word-for-word accuracy is to pretend human memory works like a hard drive, which is itself a falsehood."

  **Where the Reply is Soft:**
  This is your strongest philosophical ground (cognitive science), but it doesn't fully defend the *composite* character. Merging two people is not a memory error; it is an artistic choice. The Memoirist can argue that while *words* fade, the *number of people* does not. You are asking them to accept a fabrication as a memory.

  ---

  ### STRATEGIC NOTE
  **The Core Tension:** Your defense relies on the idea that *all* memoir is reconstruction (the Sorites paradox). Their offense relies on the idea that *some* memoir is record-keeping.

  **The Trap:** Do not let them force you to defend the *accuracy* of the scenes. Defend the *transparency* of the method. If you argue "this is essentially true," you lose. If you argue "this is honestly labeled reconstruction," you survive.

  **The Weak Link:** The "Living Person" question (Item 1). If you admit your rules change based on whether the subject can sue you, you admit your "truth principle" is actually a "liability principle." Be prepared to own that distinction without apologizing for it. Nonfiction about the dead *is* a different genre than nonfiction about the living. Claim that territory.
