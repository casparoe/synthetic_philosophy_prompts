  | **A. Maxmin (Worst-Case)** | She evaluates the bet using the lowest probability in the feasible set. | **REFUSE** | The worst case is 40 Red ($P=0.4$). An even-money bet requires $P \ge 0.5$. Since $0.4 < 0.5$, she rejects. |
