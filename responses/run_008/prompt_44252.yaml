      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Epistemology of Cryptography:**
      *   *The Core Tension:* Rigorous reductions (if $A$ then $B$) + Unproven assumptions ($A$ is hard).
      *   *The Practice:* Standards bodies (NIST, etc.) mandate moves based on future tech (QC) + current math stability.
      *   *The Social Aspect:* Contests, public cryptanalysis, "years of scrutiny" as a metric of security.
      *   *The Philosophy:* Is math discovered (Platonism) or constructed? Is hardness a physical fact or a mathematical one?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the profundity of the observation. Cryptography is a unique blend of pure math, engineering, and sociology. State the thesis: The practice is epistemologically hybrid, relying on a *pragmatic fallibilism* that treats mathematical truth as temporally stable rather than eternally fixed.

      *   **Platonism vs. Deflationism:**
          *   *Platonism:* Does the cryptographer need to believe factoring is *objectively* hard independent of human knowledge? Not strictly. They need to believe no algorithm *exists* in the search space of feasible computation.
          *   *Deflationism/Constructivism:* Could work. If truth is provability, then "hardness" is "no proof of easiness exists yet."
          *   *Verdict:* The practice is underdetermined here. It works with either, but leans towards a *temporal Platonism* (it's true now, might not be later).

      *   **Complexity as Natural Kinds/Physics:**
          *   This is a strong point. $P$ vs $NP$ is math, but "feasibility" is physical (energy, time, matter).
