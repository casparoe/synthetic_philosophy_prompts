      *   **The Asymmetry (Quantum Wager):**
          *   Betting QC *will* happen (physics/engineering optimism).
          *   Betting new lattice problems *won't* be broken (math pessimism/stability).
          *   *Epistemology:* This reveals a distinction between *engineering scalability* (seen as inevitable given investment) and *mathematical insight* (seen as sporadic/unpredictable). It presupposes that physical engineering is linear/predictable, while mathematical discovery is stochastic.

      *   **The Inconsistency (Proofs vs. Conjectures):**
          *   Is it inconsistent? No, it's a *separation of concerns*.
          *   Proofs ensure structural integrity (no backdoors, correct reduction).
          *   Conjectures ensure foundational stability.
          *   It's not hypocrisy; it's risk management. Hardness is a resource, like entropy.

      *   **Underdetermination (Strict Presuppositions):**
