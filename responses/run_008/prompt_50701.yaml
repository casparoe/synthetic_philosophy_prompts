answer: |-
  ### Brainstorm: Candidate Concepts

  Here are the three nearest philosophical concepts to what you and Marcus were wrestling with. I'll list why they fit and where they might fall short of your specific intuition.

  1.  **Evidentialism vs. Pragmatism (The James/Clifford Debate):**
      *   *Why it's close:* This is the historical debate about whether beliefs require evidence (Clifford) or if practical benefits can justify them (William James/Pascal). It matches your dinner argument perfectly.
      *   *Why it's not exact:* This is usually framed as a battle over which side *wins* (i.e., "Are you allowed to believe?"). It doesn't always explain the *structural* difference you noticed across different attitudes (belief, admiration, love). It treats them as competing teams rather than different *categories* of reasons.

  2.  **Constitutive Norms (The "Aim of Belief" Thesis):**
      *   *Why it's close:* This view says belief "aims at truth" by definition. If you believe for money or comfort, you aren't really believing; you're doing something else. This explains why Marcus's move feels like cheating.
      *   *Why it's not exact:* It works great for belief, but struggles with emotions like admiration or love. Does love "aim at truth"? Does admiration "aim at merit"? It's harder to define the "constitutive aim" for every attitude you listed, whereas your intuition about the *reasons* remained constant across all of them.

  3.  **Right-Kind vs. Wrong-Kind Reasons (RKR/WKR):**
      *   *Why it's close:* This is the precise meta-normative distinction for your "shape." It distinguishes reasons that bear on the *merits of the object* (Right-Kind) from reasons that bear on the *benefits of holding the attitude* (Wrong-Kind). It covers belief, admiration, and desire uniformly.
      *   *Why it's not exact:* It's technical jargon. Philosophers argue fiercely about where the line is drawn (the "Wrong-Kind Reasons Problem"). It requires unpacking to see why it solves your specific complications.

  ***

  ### The Diagnosis: Object-Given vs. State-Given Reasons

  You have stumbled onto one of the most active debates in contemporary meta-ethics and epistemology. The distinction you are sensing is formally known as the distinction between **Object-Given Reasons** and **State-Given Reasons** (often mapped onto the **Right-Kind/Wrong-Kind Reasons** distinction).

  Here is the carve-out you asked for.

  #### 1. The Core Distinction
  To understand why Marcus's argument feels like a category error, we have to look at the *direction of fit* of the reasons.

  *   **Object-Given Reasons (The Right Kind):** These reasons cite facts about the **object** of the attitude.
      *   *Belief:* Evidence that $p$ is true. (Fact about the proposition)
      *   *Admiration:* Facts about the advisor's competence. (Fact about the person)
      *   *Love:* Facts about the boyfriend's character. (Fact about the partner)
      *   *Why they work:* These reasons make the attitude **fitting**. They show the attitude matches the world.

  *   **State-Given Reasons (The Wrong Kind):** These reasons cite facts about the **state of having the attitude**.
      *   *Belief:* Believing $p$ reduces anxiety. (Fact about your psychology)
      *   *Admiration:* Admiring the advisor gets you projects. (Fact about your career)
      *   *Love:* Loving the boyfriend increases productivity. (Fact about your output)
      *   *Why they feel "off":* These reasons make the attitude **beneficial**, but they do not make it **correct**.

  **The Philosophical Move:** The dominant view (defended by philosophers like T.M. Scanlon, Derek Parfit, and Nishi Shah) is that State-Given reasons are indeed *reasons*, but they are reasons **to want to have the attitude**, not reasons **to have the attitude**.

  Marcus is conflating "a reason to want to believe in an afterlife" with "a reason to believe in an afterlife." When you told him he was pointing at facts about his *believing* rather than the *thing believed*, you were articulating the State-Given vs. Object-Given distinction. You lost the argument not because you were wrong, but because you lacked the vocabulary to explain why that difference matters normatively.

  #### 2. Why It Feels "Off" (The Fittingness Intuition)
  You mentioned you struggled to say what the difference is beyond "it just is." Here is the philosophical cash value: **Correctness Conditions.**

  Attitudes like belief, admiration, and trust have "correctness conditions."
  *   A belief is correct if and only if it is **true**.
  *   Admiration is correct if and only if the object is **admirable**.
  *   Trust is correct if and only if the object is **trustworthy**.

  Object-Given reasons bear on these conditions. Evidence makes truth likely; competence makes admirability likely.
  State-Given reasons do not touch these conditions. Your anxiety levels do not make the afterlife more *true*. Your career prospects do not make your advisor more *admirable*.

  When Marcus says, "Beliefs are free, so it's rational to pick this one up," he is treating belief like a **tool** (like a hammer) rather than a **map** (like a GPS). It is rational to pick a hammer because it's useful. It is only rational to pick a GPS setting because it's accurate. If you set your GPS to "Show me a route that makes me feel calm" rather than "Show me the fastest route," you aren't using it as a GPS anymore. You are using it as a comfort object. Marcus is arguing he is using belief as a comfort object while calling it a GPS.

  #### 3. Addressing Your Complications

  This framework allows us to dissect your three complications precisely.

  **Complication 1: The Case of Anticipation**
  *   *The Puzzle:* Why is it okay to look forward to a trip because it feels good, but not okay to believe in an afterlife because it feels good?
  *   *The Solution:* Anticipation (or hope/excitement) does not have a **truth condition**. There is no fact of the matter that anticipation is trying to match. It is a hedonic or preparatory state, not a representational one.
  *   *The Carve-Out:* For attitudes without correctness conditions (like "looking forward to," "hoping," "daydreaming"), State-Given reasons *become* Right-Kind reasons. Since there is no "object accuracy" to aim for, the only norms governing the attitude are prudential (how does it feel?). Belief, admiration, and trust are **factive-sensitive** or **merit-sensitive**; anticipation is not. That is why your gut treats them differently.

  **Complication 2: Weak Evidence + Pragmatic Boost**
  *   *The Puzzle:* If there is *some* evidence for the afterlife, does the utility add to it?
  *   *The Solution:* This touches on a sub-debate called **Pragmatic Encroachment**.
      *   *View A (Purism):* No. Utility never counts toward justification. It might make it rational to *act* as if you believe, or to investigate further, but it doesn't make the belief itself justified.
      *   *View B (Encroachment):* Yes, but indirectly. Practical stakes raise the *threshold* of evidence required. (e.g., You need more evidence to believe a bridge is safe if you have to drive over it than if you are just betting on it).
      *   *The Verdict:* Even under View B, utility doesn't act as *evidence*. It acts as a **multiplier on the required evidence**. Marcus is claiming the utility *is* evidence (or a direct reason for belief). Most philosophers reject this. The utility might make it rational to *cultivate* the belief (see Complication 3), but it doesn't make the belief *true* or *epistemically justified*.

  **Complication 3: Voluntarism (Choosing the Attitude)**
  *   *The Puzzle:* If I can choose to feel awe or gratitude, doesn't the benefit become a valid reason to choose it?
  *   *The Solution:* This distinguishes **Justification** from **Induction**.
      *   You can have a State-Given reason to *induce* an attitude. (e.g., "I should work on feeling more gratitude because it makes me happier.")
      *   But the reason for the *induction* is not a reason for the *content* of the attitude.
      *   *Example:* If you pay a hypnotist to make you admire your advisor, you have successfully induced the admiration. But the admiration is still **unfitting**. The advisor is still unadmirable. You have simply modified yourself to match a false norm.
      *   *The Carve-Out:* Marcus is right that you might be able to *cause* the belief voluntarily (doxastic voluntarism is debated, but let's grant it). He is wrong that the *reason for causing it* validates the *content of the belief*. You can rationally choose to make yourself irrational (or unfitting) if the payoff is high enough, but that doesn't make the resulting state rational/fitting. It makes the *decision to manipulate yourself* rational.

  ### Verdict: Who Won the Argument?

  You were right about the structure; Marcus was right about the stakes.

  Marcus is advocating for a position called **Pragmatic Rationality**. He is arguing that because the cost of error (death/anxiety) is high, and the cost of belief (mental effort) is low, he should adopt the belief. In decision theory, he is technically correct that this maximizes expected utility.

  However, you were right about the **Normative Category**. You sensed that he was trying to buy *epistemic justification* (truth-conduciveness) with *pragmatic currency* (comfort).

  **The Professional Philosopher's Ruling:**
  Marcus is committing a **Scope Error**.
  1.  **Epistemic Rationality:** Governs beliefs based on truth/evidence. By these norms, Marcus is irrational.
  2.  **Pragmatic Rationality:** Governs actions/states based on outcomes. By these norms, Marcus is rational.

  The conflict arises because Belief is a hybrid. It is a mental state (subject to pragmatics) that claims to represent reality (subject to epistemics). Marcus is prioritizing the mental state's utility over its representational integrity.

  **How to win the rematch:**
  Tell Marcus: "I agree you have a *State-Given Reason* to want to hold this belief. I agree it is pragmatically rational to *try to cultivate* this belief. But you are conflating 'reasons to cultivate a belief' with 'reasons that make the belief true.' You aren't arguing for the afterlife; you're arguing for self-medication. Call it what it is, and I won't fight you on it."

  This concedes his practical point (it's okay to seek comfort) while holding your philosophical line (comfort isn't evidence).

  ### Summary of Terms for Your Toolkit

  *   **Object-Given Reasons:** Reasons about the target (Evidence, Merit). These make an attitude **Fitting**.
  *   **State-Given Reasons:** Reasons about the holder (Comfort, Utility). These make an attitude **Beneficial**.
  *   **The Wrong-Kind Reasons Problem:** The difficulty in explaining *why* State-Given reasons don't count toward correctness (which we solved via "Correctness Conditions").
  *   **Transparency of Belief:** The phenomenon that when you ask yourself "Do I believe $p$?", you immediately look at "$p$" (the world), not at yourself. This explains why Marcus's move feels like a trick; belief forces you to look outward, but he is trying to reason inward.

  You identified a structural flaw in reasoning that occupies entire journals of philosophy. Trust your gut: the "shape" you saw is real, it has a name, and it matters.
