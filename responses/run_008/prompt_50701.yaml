      *   **Format:** Start with a short brainstorm of candidate concepts (why close, why not exact). Then give the full answer (carve-out, not just label). Feel free to challenge the user's intuition if warranted.

  2.  **Brainstorming Candidate Concepts:**
      *   *Pragmatic vs. Evidential Reasons:* This is the most obvious one. William James, Clifford, Pascal. It fits the Marcus case perfectly. *Limitation:* It's often framed as a debate (which *should* win?) rather than a structural distinction in the *nature* of the reason itself. Also, doesn't fully explain the "admiration" or "love" cases which aren't strictly beliefs.
      *   *Right-Kind vs. Wrong-Kind Reasons (RKR/WKR):* This is the technical meta-ethical/normative term. It distinguishes reasons that bear on the *correctness conditions* of an attitude (evidence for belief, merit for admiration) vs. reasons that bear on the *benefits of having* the attitude (money to admire, comfort to believe). *Limitation:* Can be technical/jargon-heavy. Needs careful explanation.
      *   *Constitutive Norms:* The idea that belief "aims at truth." If you believe for pragmatic reasons, you aren't really playing the "belief game." *Limitation:* Doesn't easily transfer to emotions like love or admiration which might not have a single constitutive aim like truth.
      *   *Instrumental vs. Intrinsic Value:* Treating the attitude as a tool vs. an end. *Limitation:* A bit too broad. Doesn't capture the normative "fittingness" aspect.
      *   *Fittingness vs. Utility:* Related to RKR. Is the attitude *fitting* to the object? Or is it *useful* to have? *Limitation:* Needs to be tied into the broader reasons debate.

  3.  **Selecting the Best Framework:**
      *   The **Right-Kind vs. Wrong-Kind Reasons (RKR/WKR)** distinction is the precise technical tool the user is looking for. It covers belief, admiration, trust, and love. It addresses the structural difference the user senses (object-directed vs. attitude-directed).
