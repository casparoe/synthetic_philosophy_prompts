prompt: |-
  I keep running into "history is written by the victors" in arguments with a friend who does oral history work. Latest one: she's collecting oral traditions in a community where local memory of a land dispute flatly contradicts what the surviving documents say — deeds, court records, a government commission report — and she says the slogan shows the documents shouldn't automatically win, since they were produced by the side that had the scribes and the courts on its side. I have the feeling the slogan is doing like four different jobs at once in that argument and I want to pull them apart. Lay out the distinct precise claims it could be making — everything from the near-trivial reading (surviving records skew toward whoever was literate and in power) to the radical one (there's no fact of the matter about what happened, just competing power-laden narratives) — and for each reading say whether it's true, whether it's substantive, and crucially whether it actually gets her the conclusion that community memory should get priority when the two conflict. I'd also like to know if any reading supports the weaker middle position, that the archive and the oral tradition are just two sources to be weighed against each other like any other testimony, with neither enjoying automatic priority — because honestly that's where my intuitions sit and I can't tell if the slogan is even needed to get there. Give me the readings as a menu I can actually bring to our next argument, not one official interpretation.
