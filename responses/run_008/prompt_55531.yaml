answer: |-
  **EXAMINATION PAPER**

  **Course:** Historiography: Theory and Method  
  **Time Allowed:** 3 Hours (Answer Two Questions)  
  **Instructions:** Closed book. No external materials permitted.

  **Question 2**

  Read the following scenario carefully:

  > A fictional student, R., has written a thesis chapter on a fictional nineteenth-century municipal reformer, E. M. Corven (1838–1902), who campaigned successfully for clean water and sewers in a fast-growing industrial city — reforms that demonstrably saved thousands of lives — and whose private papers also show her as an early and enthusiastic advocate of segregating and eventually sterilizing people classified as feeble-minded, a cause she shared with several respected medical voices of her own generation. The chapter reports both facts without commentary. Two examiners have now clashed over it: one demands an added paragraph of explicit moral condemnation, arguing that silence in the face of such views is itself a moral stance; the other demands the removal of all evaluative language, calling the proposed paragraph "presentism" and a failure of historical empathy.

  Adjudicate this disagreement. Do not simply define presentism or contextualism; instead, analyze whether this clash is genuinely about presentism at all. In your response, address whether the demand for neutrality is itself historically situated, whether we apply different standards to Corven's successes than her failures, and whether describing her views as eugenic constitutes an anachronism. (70 minutes)

  ***

  **MODEL ANSWER**

  The clash between the examiners is not merely a procedural dispute over presentism; it is a substantive conflict about the moral obligations of the historian. To resolve it, we must dismantle the assumption that "neutrality" is the default, timeless position of the profession. The second examiner's demand to remove evaluative language relies on the idea that historians can and should escape the standards of their own time. However, the ideal of value-neutral scholarship is itself a norm with a history, emerging from specific twentieth-century commitments to objectivity. To claim that silence avoids presentism is to ignore that silence is also a stance taken in the present. By refusing to condemn sterilization advocacy, the historian adopts a modern norm of detachment that Corven herself would not recognize. Therefore, the refusal to evaluate is not an escape from contemporary standards, but an adherence to a different set of them.

  Furthermore, the objection to condemnation cannot rest on the claim that Corven should only be judged by standards she shared, because we do not apply this rule consistently. There is an applause asymmetry at work: the chapter credits Corven with saving thousands of lives through sanitation reforms. Yet, the metric of "saving lives" is a universalist moral standard, not one confined to 1890s municipal politics. If we are permitted to praise Corven for reducing mortality—a good she pursued but which we value independently of her specific cultural framework—we are already judging her by our standards. To praise the sanitation work while withholding condemnation for the eugenic work on the grounds of "historical empathy" is inconsistent. We cannot claim the credit for her virtues while disclaiming the judgment of her vices based on the same temporal distance.

  Additionally, the second examiner's charge of presentism conflates conceptual anachronism with moral evaluation. Describing Corven's position as "eugenic" is not anachronistic; the concept and the term were available in her lifetime, and she advocated for policies that fit the definition. An anachronism would be calling her a "fascist" or using a psychological framework unknown to her. Moral evaluation, however, is not a conceptual label but a judgment of right and wrong. Identifying her views accurately is historical work; condemning them is ethical work. The historian can do both without violating factual integrity.

  Consequently, the first examiner is correct that silence is a moral stance, but wrong to assume a simple paragraph of condemnation resolves the tension. The second examiner is incorrect that evaluation constitutes presentism. This is not really a debate about whether we can escape our time—we cannot. It is a debate about which of our current standards are defensible.

  The question "whose standards?" is therefore misleading if asked only once. It becomes productive only if followed by asking which standards could be defended to the historical actors themselves on terms they had access to. We can condemn sterilization not merely because it violates 2024 norms, but because it violates the principle of bodily integrity that Corven claimed for herself in her sanitation campaigning. The disagreement is not about escaping the present, but about constructing a moral dialogue across time that avoids both sanctification and caricature.

  ***

  **MARKING SCHEME**

  **Total Marks: 20 (5 Points × 4 Marks)**

  1.  **Neutrality as a Norm:** The candidate must identify that the refusal to evaluate is not a neutral, timeless stance but itself a norm with a history (the modern commitment to value-neutral scholarship).
      *   *Common Error:* Candidates treat "objectivity" as the default baseline rather than a historical construct that cuts against appeals to "escaping our standards."
  2.  **Applause Asymmetry:** The candidate must note that we happily credit Corven for sanitation reforms by standards she did not fully share, so the objection to condemnation cannot simply be "the standards aren't hers."
      *   *Common Error:* Candidates argue we must judge her entirely by 1890s standards, ignoring that praising life-saving reforms already violates strict contextualism.
  3.  **Conceptual vs. Moral:** The candidate must distinguish conceptual anachronism from moral evaluation, noting that describing Corven's position as eugenic is not anachronistic in the way calling it by some later label would be.
      *   *Common Error:* Candidates conflate using modern moral judgments with using modern conceptual categories, labeling accurate descriptions as anachronistic.
  4.  **Adjudication:** The candidate must explicitly adjudicate the disagreement (e.g., Examiner 1 is right about silence, Examiner 2 is wrong about presentism) rather than remaining agnostic.
      *   *Common Error:* Candidates hedge by saying "both have a point" without resolving the logical inconsistency between the two examiner demands.
  5.  **Nature of Disagreement:** The candidate must answer whether this is really about presentism (concluding it is about which present standards are defensible, not escaping them).
      *   *Common Error:* Candidates accept the frame that presentism is the core issue, rather than identifying it as a proxy for moral responsibility.

  **Distinction between A and B Answers**
  A answers demonstrate that "whose standards?" is the wrong question if asked once, and only a good question if the candidate goes on to ask which standards could be defended to the historical actors themselves, on terms those actors had some access to. B answers typically stop at identifying the asymmetry or the historical nature of neutrality without proposing this method of cross-temporal defensibility.
