      *   *Wait, let's look closer at 2 vs 5.* Is it a contradiction or just a contextual distinction? The user calls CEV "neutral." If CEV overrides actual human commands (because they aren't extrapolated), it is paternalistic. If the user is anti-paternalist in medicine because "actual say-so" matters, why does it not matter for AI? This is a consistency challenge regarding the *moral weight of actual vs. ideal agency*. I'll rank this high because it undermines the principled stance on autonomy.

