      *   *The Big One (Claim 1/3 vs 4):* This is the "Racist Problem." If well-being is desire-based, and values are fixed, the informed racist is living their best life. Claim 4 denies this.
          *   *Cost:* Drop 4 (become pure subjectivist) or Drop 1/3 (accept objective goods/value correction).
