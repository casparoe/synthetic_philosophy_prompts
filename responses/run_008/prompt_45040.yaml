          *   *Analysis:* This is a classic distinction between *prudential value* (what is good for me) and *moral authority/autonomy* (who decides). Many philosophers hold both (e.g., Mill). It's a tension, but arguably a stable dualism. Is it a contradiction? No. One defines the *good*, the other defines the *right to decide*.
