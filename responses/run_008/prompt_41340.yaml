  The principle that best captures your verdicts is a **Risk-Adjusted Person-Affecting Threshold Principle**, which holds that procreation is permissible only if the child's life is expected to exceed a threshold of reasonable acceptability and does not involve a significant risk of falling below it, though there is no obligation to maximize wellbeing above this threshold.

  This principle consists of three precise clauses. First, the **No-Duty-to-Create Clause** states that there is no moral obligation to bring into existence people who would have happy lives, which directly accommodates your verdicts on the childfree couple and the egg donor; it rejects total utilitarianism by denying that potential wellbeing creates a demand on existing agents. Second, the **Harm Threshold Clause** states that it is wrong to cause someone to exist if their life will predictably fall below a threshold of "worth living" (defined not merely as positive welfare, but as a life free from unremitting misery), which captures your verdict on the couple conceiving a child with unremitting misery and explains your wavering on the below-neutral case as a function of where exactly that threshold lies. Third, the **Risk Constraint Clause** states that it is wrong to impose a significant probability of a life falling below this threshold, even if the expected value of the life is positive or the most likely outcome is good; this captures your verdict on the 30%-gamble couple by treating the imposition of risk itself as a procreative wrong, independent of the actual outcome.

  This framework handles your non-identity cases cleanly. For the couple conceiving now (fine life) versus waiting (great life), the Harm Threshold Clause is satisfied in both scenarios, and since there is no obligation to maximize wellbeing above the threshold, choosing the fine life is not wrong. Similarly, for the couple conceiving in poverty (good life) versus waiting (better life), the principle verdicts "not wrong" because both outcomes clear the threshold and no specific child is harmed by being the "poorer" version. The asymmetry you feel is thus explained: we have duties to avoid harming existing or future persons (by imposing misery or risk of misery), but no duties to benefit non-existent persons by creating them.

  Applying this to your unlisted cases yields specific verdicts. In a case where delaying conception would prevent a definite short-but-decent life in favor of a longer, better one (involving a numerically different child), the principle verdicts **not wrong** to have the short-lived child; as long as the short life clears the Harm Threshold, you are not obligated to sacrifice it for a different, better child, mirroring your "fine vs. great" intuition. In a case involving a "right to be born" once conception has occurred, the principle verdicts **no such right exists**; since the No-Duty-to-Create Clause applies even post-conception (abortion ethics aside), the mere potential for a happy life does not generate an obligation to continue the pregnancy, though the Harm Threshold Clause would forbid continuing a pregnancy known to result in unremitting misery.

  Regarding your suspected inconsistency between the "barely-above-neutral" case and the "30%-gamble" case: my principle accommodates both verdicts logically, but only at a theoretical cost you must accept. To judge the 30%-gamble wrong while permitting the certain mediocre life, you must embrace an **Ex Ante** conception of harm rather than an **Ex Post** one. In the gamble case, if the child is born healthy, no one is worse off than they would have been (non-existence), so strict person-affecting views cannot call it wrong; my principle requires you to say the wrongness lies in the *risk imposition* itself, not the outcome. If you demand an identifiable victim who is actually worse off, you cannot sustain the verdict that the gamble is wrong. Furthermore, while you do not strictly have to give up either verdict, you must ensure your "threshold of reasonable acceptability" is set high enough to condemn the risk of misery but low enough to permit chronic low-grade unhappiness; if "barely worth living" in the gamble case is qualitatively similar to "chronic low-grade unhappiness" in the certain case, maintaining opposite verdicts relies entirely on risk-aversion, which may feel unstable upon reflection. You can keep both verdicts, but you must abandon the intuition that wrongness always requires an ex-post victim.
