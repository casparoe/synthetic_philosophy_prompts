answer: |-
  # The Epistemic Intuition Quiz: How Do You Solve the Lottery Paradox?

  Welcome to the seminar blog. We spend a lot of time in class labeling views (Contextualism! Fallibilism! Skepticism!), but often our actual intuitions are messier than the labels suggest. 

  This quiz is designed to bypass the jargon. Below are eight concrete scenarios. Don't overthink them; go with your gut reaction about what you would *say*, *believe*, or *know* in the situation. At the end, you'll find a scoring key to help you map your answers onto the major philosophical positions.

  ***

  ### Question 1: The Million-Ticket Lottery
  Imagine a fair lottery with one million tickets and exactly one winner. You hold ticket #345,892. The drawing hasn't happened yet.
  **How do you regard the proposition "Ticket #345,892 will lose"?**

  *   **A.** I know it will lose. It's rational to treat it as a fact.
  *   **B.** I don't *know* it will lose, but I still fully believe it will.
  *   **C.** I shouldn't say I believe it will lose. I should only say it's highly probable.
  *   **D.** If I can't know this ticket will lose, I probably can't know ordinary things either (like where I parked my car).

  ### Question 2: The Historian's Preface (The Preface Paradox)
  A careful historian writes a book with 1,000 factual claims. In the introduction, she writes: "I have checked every claim, but given human fallibility, at least one claim in this book is likely false."
  **Is the historian being irrational?**

  *   **A.** Yes. She can't believe every claim is true while also believing one is false.
  *   **B.** No. It's rational to believe each individual claim, even if she knows the whole bunch can't all be true together.
  *   **C.** No. She doesn't actually "believe" the claims in a binary way; she just has high confidence in each.

  ### Question 3: The Blue Bus (Statistical vs. Specific Evidence)
  **Case 1:** 99% of the buses in town are Blue Bus Co. A bus hits your car. You didn't see the color.
  **Case 2:** A reliable witness says a Blue Bus Co. car hit you. The witness is right 99% of the time.
  **In which case are you justified in believing "A Blue Bus Co. vehicle hit me"?**

  *   **A.** I'm justified in both cases. The odds are the same.
  *   **B.** I'm justified in Case 2 (Witness), but not Case 1 (Statistics).
  *   **C.** I'm not fully justified in either case; I only have probability, not knowledge.

  ### Question 4: Combining Beliefs (Conjunction)
  Imagine you believe 100 different lottery tickets will lose. Each belief is just as strong as your belief that your morning coffee will not spill.
  **Do you believe the single combined claim: "Ticket 1 will lose AND Ticket 2 will lose AND... Ticket 100 will lose"?**

  *   **A.** Yes. If I believe each one, I must believe the combination.
  *   **B.** No. I believe them individually, but I know the combination is false (since one must win).
  *   **C.** The question is flawed. I don't have "beliefs" that combine like that; I just have 100 separate confidence levels.

  ### Question 5: The High-Stakes Medicine
  You have a mild headache. You have a pill that is 99.9% effective.
  **Scenario A:** If it fails, you'll have a headache for another hour.
  **Scenario B:** If it fails, you will die.
  **In which scenario do you *know* the pill will work?**

  *   **A.** I know it will work in both scenarios. The evidence hasn't changed.
  *   **B.** I know it in Scenario A, but I don't know it in Scenario B.
  *   **C.** I don't truly *know* it in either scenario; I'm just taking a risk.

  ### Question 6: The Long Chain (Deduction)
  You start with a fact you know (Step 1). You deduce Step 2 from it. Then Step 3 from Step 2, and so on, for 1,000 logical steps. Each step is 99.9% secure.
  **Do you know the final conclusion (Step 1,000)?**

  *   **A.** Yes. If I know the start and the logic is good, I know the end.
  *   **B.** No. The tiny risks at each step add up until the end is too uncertain to know.
  *   **C.** No. I didn't really know the starting fact well enough to begin a chain this long.

  ### Question 7: The Feeling of Belief
  Think about your belief that "The sun will rise tomorrow" versus your belief that "My lottery ticket will lose."
  **Do these feel like the same kind of mental state?**

  *   **A.** Yes. They are both flat-out beliefs. One is just based on better evidence.
  *   **B.** No. The sunrise is a belief; the lottery ticket is just a hunch or a calculation of odds.
  *   **C.** It depends on the context. Sometimes the lottery ticket feels like a belief, sometimes it doesn't.

  ### Question 8: The Near Miss (Safety)
  You believe your ticket will lose. It turns out you were right; it lost. However, in a very similar possible situation, it could have easily won.
  **Does the fact that you *could* easily have been wrong matter?**

  *   **A.** No. I was right, and I had good evidence. That's what matters.
  *   **B.** Yes. If I could easily have been wrong, I didn't *know* it, even if I was right.
  *   **C.** It matters for "knowledge," but not for "belief." I believed it, I just didn't know it.

  ***

  # Scoring Key & Interpretation

  *Note on Limitations:* Philosophical positions are complex systems, not just checklists. This quiz cannot perfectly distinguish between **Safety Theorists** and **Skeptics** on Question 1, as both often deny knowledge in lottery cases. The distinction usually lies in whether they *also* deny everyday knowledge (Skeptics do; Safety theorists usually don't). Similarly, **Kyburgians** and **Deflationists** may give similar answers on conjunction (Question 4), but for different metaphysical reasons. Use this key as a heuristic, not a diagnosis.

  ### Tally Your Answers

  **The Skeptical Solution**
  *   **Primary Indicators:** Q1 (D), Q3 (C), Q5 (C), Q6 (C).
  *   **The View:** You are willing to bite the bullet. If the lottery paradox shows that high probability isn't enough for knowledge, then we have much less knowledge than we think. You likely deny knowledge in the lottery case *and* worry that this undermines everyday claims (like where you parked your car).
  *   **Key Intuition:** "If I can't know the ticket will lose, I can't know much of anything else either."

  **The Probabilistic / Kyburg-Style Rule**
  *   **Primary Indicators:** Q1 (A), Q2 (B), Q4 (B), Q6 (B).
  *   **The View:** You accept that we can believe individual high-probability claims (like a single ticket losing), but you reject the idea that belief aggregates. You are comfortable holding inconsistent beliefs (believing P, believing Q, but not believing P&Q) to avoid the paradox.
  *   **Key Intuition:** "It's rational to believe each ticket loses, but irrational to believe they all lose."

  **The Anti-Luck / Safety Diagnosis**
  *   **Primary Indicators:** Q1 (B or C), Q3 (B), Q5 (A or C), Q8 (B).
  *   **The View:** You distinguish between statistical evidence (lottery) and specific evidence (witness/perception). You deny knowledge in the lottery case because your belief isn't "safe"—in nearby possible worlds where the ticket wins, you'd still believe it loses. However, unlike the Skeptic, you usually want to save everyday knowledge.
  *   **Key Intuition:** "Statistical odds aren't enough; my belief needs to be sensitive to the truth."

  **The Contextualist / Standards-Based View**
  *   **Primary Indicators:** Q1 (A), Q5 (B), Q7 (C), Q8 (C).
  *   **The View:** You think the standards for "knowledge" or "belief" shift depending on the conversation. In casual chat, you know the ticket will lose. In a philosophy seminar or high-stakes court case, the standards rise, and you no longer "know."
  *   **Key Intuition:** "Whether I can claim to know depends on what's at stake in the conversation."

  **The Degree-of-Belief Deflationary View**
  *   **Primary Indicators:** Q1 (C), Q2 (C), Q4 (C), Q7 (B).
  *   **The View:** You think the whole paradox arises from a mistake in language. There is no such thing as "flat-out" belief (a binary on/off switch). There are only degrees of confidence (credences). You never "believe" the ticket will lose; you just assign it a 99.9999% probability.
  *   **Key Intuition:** "Belief isn't a switch; it's a dimmer. The paradox disappears if we stop using binary terms."

  ### Troubleshooting Your Score

  *   **Mixed Safety and Skeptic Answers:** If you denied knowledge in the lottery (Q1) but also denied knowledge in everyday high-stakes cases (Q5), you lean Skeptic. If you denied lottery knowledge but affirmed everyday knowledge, you lean Safety.
  *   **Mixed Kyburg and Deflationary Answers:** If you said you *believe* the individual claims but not the conjunction (Kyburg), but also said belief is really just degrees (Deflationary), you are in good company. Many modern epistemologists blend these views. The quiz separates them on Q7 (Phenomenology).
  *   **The "It Depends" Pattern:** If you chose Contextualist options frequently, you likely reject the idea that there is one single "correct" solution to the paradox that applies in every situation. For you, the solution is pragmatic.
