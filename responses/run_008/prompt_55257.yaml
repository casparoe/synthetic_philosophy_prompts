      *   **(2) Substrate Independence:** Computation depends on formal organization, not material. Silicon/neurons/hydraulics can run the same computation.
      *   **(3) Chinese Room (CR) / Syntax $\neq$ Semantics:** Syntax manipulation isn't enough for understanding/semantics. LLMs don't understand.
      *   **(4) Anti-Pancomputationalism:** Not everything computes. Implementation requires constraints (causal structure, etc.). Rocks don't compute everything.
      *   **(5) Analog/Continuous/Noisy:** The brain is not a *digital* computer in a straightforward sense. Discretization involves loss.
      *   **(6) Two Verdicts:**
