answer: |-
  This is a classic tension between Causal Decision Theory (CDT) and what is now often called Functional Decision Theory (FDT) or Timeless Decision Theory (TDT). Your intuitions are pulling you in two directions: you want the payoff-maximizing benefits of logical correlation (Cases 3 & 4) without abandoning the causal sovereignty that feels intuitive in physically separated cases (Cases 1 & 5).

  Here is the diagnosis, the principle, the application, and the hard truth about which verdicts must be sacrificed.

  ### 1. The Principle: Functional Dependence under Epistemic Symmetry

  There is no single principle that accommodates all seven of your verdicts without contradiction. Specifically, Verdict 3 (Twin Cooperate) and Verdict 5 (Sealed Twin Defect) are logically incompatible under any theory that treats logical correlation as decision-relevant.

  However, the principle that best underwrites your *stable* and *defensible* verdicts (1, 3, 4, 6) is **Functional Dependence under Epistemic Symmetry (FDES)**.

  **The Principle:**
  An agent should treat another agent's move as contingent on their own (and thus cooperate/one-box) if and only if:
  1.  **Logical Correlation:** There is a high-probability logical correlation between the agent's decision algorithm and the counterpart's output (motivated by Cases 3 & 4).
  2.  **Epistemic Symmetry:** The agent conceives of the counterpart as running the *same* deliberative procedure concurrently, rather than as a fixed fact of the past (motivated by the tension between 3 & 5).
  3.  **Reference Class Specificity:** The correlation is grounded in specific structural identity or prediction, not merely broad demographic similarity (motivated by the distinction between 1 & 7).

  **How it maps to your cases:**
  *   **Case 1 (Random):** Fails Clause 1. No logical link. **Verdict: Defect.**
  *   **Case 3 (Twin):** Satisfies Clause 1 & 2. You are running the same code. **Verdict: Cooperate.**
  *   **Case 4 (Newcomb):** Satisfies Clause 1. The predictor simulates your code. **Verdict: One-Box.**
  *   **Case 6 (Asymmetry):** Satisfies Clause 1 & 2. The wavering is due to utility function adjustments (altruism vs. self-interest), not decision theory. **Verdict: Context dependent.**
  *   **Case 2 (Similar Mind):** Satisfies Clause 1 partially. The correlation is probabilistic, not certain. **Verdict: Unstable Lean.**

  ### 2. Application to New Cases

  **Case A: The Copycat (Counterpart instructed to copy your move)**
  *   **Setup:** A counterpart is told your move in advance and instructed to copy it.
  *   **Analysis:** This creates a *causal* link from your move to theirs, but only if your move is made *first*. If they are told your move *in advance*, your move is fixed relative to their instruction. However, from *your* perspective, if you know they will copy whatever you decide, your decision functionally determines theirs.
  *   **Principle Application:** Satisfies Clause 1 (Correlation is 100%). Satisfies Clause 2 (Your deliberation determines the output they copy).
  *   **Verdict:** **Cooperate.** (This is structurally identical to Newcomb's Problem where the box is filled based on your predicted move).

  **Case B: The Recent Duplicate (Created last week with your memories)**
  *   **Setup:** A duplicate of you created recently, sharing memories up to last week.
  *   **Analysis:** The logical correlation is extremely high, arguably identical to the Twin case, provided the divergence in experience over the last week hasn't altered the core decision algorithm.
  *   **Principle Application:** Satisfies Clause 1 (Natural correlation). Satisfies Clause 2 (Concurrent deliberation implied).
  *   **Verdict:** **Cooperate.** (The recency of creation is irrelevant to the logical identity of the decision algorithm).

  ### 3. The Hard Truth: Which Verdicts Must Go

  You asked for honesty regarding which verdicts cannot be accommodated. To achieve a coherent decision theory, you must overturn **Verdict 5** and critically revise **Verdict 7**.

  **The Primary Casualty: Verdict 5 (Sealed Twin Defect)**
  This is the inconsistency in your framework. You cannot consistently Cooperate in Case 3 (Twin) and Defect in Case 5 (Sealed Twin).
  *   **Why it must go:** The physical sealing of an envelope does not break the *logical* link between identical reasoning processes. In Case 3, you assume your twin has "already decided" by the time you reason it through, just as in Case 5. The "already sealed" instruction in Case 5 merely makes the *temporal fixity* explicit.
  *   **The Conflict with Newcomb:** You One-Box in Case 4 (Newcomb). In Newcomb, the money is *already in the box* before you choose. The predictor's move is a fixed fact of the past, just like the twin's sealed envelope. If you treat the fixed box in Newcomb as contingent on your choice (because of the logical link), you must treat the sealed envelope in Case 5 as contingent on your choice for the exact same reason.
  *   **The Correction:** You must Cooperate in Case 5. Your intuition to Defect is a CDT reflex triggered by the *temporal indexical* ("already done"), but logical facts do not have timestamps. If you accept Case 3 and Case 4, Case 5 is an error.

  **The Secondary Casualty: Verdict 7 (Voting)**
  Your justification for Voting is evidential ("my decision evidentially correlates with like-minded voters"), but you reject this same engine in Case 1 (Random PD).
  *   **The Problem:** If you reject cooperation in Case 1 because "my choice doesn't *cause* theirs," you must reject Voting for the same reason. "Like-mindedness" is a psychological correlation, identical in kind to the "similar training" in Case 2.
  *   **The Correction:** You have two options:
      1.  **Accept EDT/FDT consistently:** Admit that you have reason to Cooperate in Case 1 and Case 2 to the degree that you believe you correlate with the population. (This is a hard pill for a CDT-leaning theorist).
      2.  **Change the Voting Justification:** Admit that Voting is not instrumentally rational under your current theory (CDT/FDES). Justify Voting on deontic grounds (duty) or expressive grounds, not on the consequentialist expectation of influencing the outcome via correlation. Do not use the "evidential correlation" argument for Voting if you refuse to use it for the Random PD.

  ### Summary Recommendation

  1.  **Adopt Functional Dependence:** Accept that logical correlation makes outcomes contingent on your choice, even without causal influence.
  2.  **Overturn Verdict 5:** Cooperate with the Sealed Twin. The envelope is a red herring; the logic is identical to the unsealed Twin and Newcomb's Box.
  3.  **Purge Verdict 7's Justification:** Stop using evidential correlation to justify Voting unless you are willing to apply it to the Random Prisoner's Dilemma. If you won't Cooperate in Case 1, you cannot consistently claim Voting is instrumentally rational based on correlation.

  Your instability in Case 2 and your wavering in Case 6 are natural consequences of this tension. Resolving Case 5 in favor of Cooperation will likely stabilize Case 2 toward Cooperation (proportionate to the estimated correlation) and force you to either drop the Voting argument or expand your cooperation horizon.
