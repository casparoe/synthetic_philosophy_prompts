  3.  **Call out the Substrate Bias.** Point out that Gradient Descent is just Natural Selection with a faster clock and a clearer metric. If the Heart has a function because Selection kept it, the Crate Detector has a function because Gradient Descent kept it.
  4.  **The Beetle Constraint:** Remind her that if she says "Yes" to the Screened Enzyme (Case b), she contradicts the Beetle. If she says "No" to the RL Agent (Case c), she contradicts the Heart. Consistency demands she treat GD like Natural Selection.

  She's running a **Selected Effects** algorithm but hasn't fully generalized "Selection" to include non-biological, non-intentional retention (like the Bug or GD). That's the gap.
