answer: |-
  Here is your Q&A battle card. The audience is technically proficient and views Williams as a solved problem. They will be polite but relentless on formal consistency. Your goal isn't to convert them to anti-consequentialism, but to show that their "solution" changes the subject rather than solving the problem.

  ### 1. The "Indirect Consequentialism" Shield
  **The Objection:**
  "You're attacking a straw man of naive act-consequentialism. We endorse indirect consequentialism. The *criterion* of rightness is maximizing the good, but the *decision procedure* involves heuristics, personal projects, and integrity. If living a life of integrity produces better outcomes than constant calculation, consequentialism commands you to have integrity. So Williams's objection dissolves; we get the same behavior with a better justification."

  **Your Reply (2 mins):**
  "I concede that indirect consequentialism mimics the *behavior* of integrity. It tells you to love your spouse, pursue your art, and rest. But Williams's point isn't about the output; it's about the *source*. On your view, my projects are held on loan from the impartial standpoint. I am permitted to love my spouse only insofar as doing so doesn't violate the maximizing criterion.
  Williams argues this severs the link between agent and action. If my commitment to my project is contingent on it passing an impartial test, I am not truly identified with it. I am merely a vessel for utility. The sophisticated view saves the action but sacrifices the *integrity* of the agent, which consists in those projects being *mine*, not instruments of the universe. You haven't answered the objection; you've just made the alienation more subtle."

  **Concede Up Front:**
  Admit that indirect consequentialism yields the same practical recommendations in 99% of cases. Don't fight on outcomes.

  **Where the Reply is Soft:**
  A hard-nosed consequentialist will ask: "If the outcome is identical, why does the metaphysical grounding matter?" You need to be prepared to argue that the *experience* of agency has intrinsic value, which they may dismiss as mysticism.

  ### 2. The "One Thought Too Many" Reversal
  **The Objection:**
  "Williams argues that saving your spouse requires 'one thought too many' if you calculate utility. But isn't your objection the inverse? When you insist on integrity *against* the impartial good, aren't *you* having one thought too many? Why not just save the spouse because it's right, without the meta-commentary about your 'ground projects'?"

  **Your Reply (2 mins):**
  "That's a clever inversion, but it misses the phenomenology. For Williams, the 'one thought' is the *impartial justification*. If I save my spouse, I do so because she is *my wife*. That is the immediate reason.
  The consequentialist, even the sophisticated one, must add the thought: 'Saving her is permissible because it aligns with the optimal decision procedure.' That is the alienating thought. My argument isn't that you need a meta-commentary to act; it's that the consequentialist framework *forces* a meta-commentary onto every action to validate it. Integrity is the absence of that gap between 'what I want' and 'what is permitted.' You are accusing me of over-thinking, but your system requires the over-thinking to justify the instinct."

  **Concede Up Front:**
  Agree that in the moment of action, deliberation should be minimal. Both sides want the agent to just act.

  **Where the Reply is Soft:**
  This relies heavily on introspective reports about deliberation. A math-heavy audience might view phenomenology as anecdotal data. If they press on "But does the justification happen *during* the act?", you risk getting bogged down in psychology.

  ### 3. The "Bigot's Integrity" Trap
  **The Objection:**
  "You say integrity protects our ground projects. But what about the segregationist whose 'ground project' is maintaining racial purity? He feels alienated by integration. Does Williams grant him integrity-based veto power? If not, aren't you just smuggling in a consequentialist ranking to decide which integrity matters?"

  **Your Reply (2 mins):**
  "Williams isn't proposing integrity as a standalone moral theory that trumps all other values. He's making a structural point about agency. We can condemn the bigot on other grounds—justice, harm, rights.
  The point is that even for *good* projects—raising a child, writing a novel—the consequentialist structure makes them answerable to an external ranking. The bigot problem shows that integrity needs constraints, yes. But adding constraints doesn't solve the alienation problem for the *rest* of us. You can stop the bigot without turning the scientist or the parent into a utility channel. My claim is that your system turns *everyone* into a channel, even when they're doing good."

  **Concede Up Front:**
  Concede immediately that integrity cannot justify immoral acts. Williams never claimed it could.

  **Where the Reply is Soft:**
  They will press: "How do you distinguish the bigot's integrity from the scientist's without using an impartial metric?" If you admit you need an impartial metric to filter projects, they will argue you've already accepted the consequentialist criterion as the ultimate arbiter.

  ### 4. The "Hope Nobody Asks" (The Laziness Charge)
  **The Objection:**
  "Be honest: Isn't 'integrity' just a dignified label for egoism? Isn't this whole argument just a way for people to avoid the hard math of effective altruism because they don't want to give up their comforts? Is it normative philosophy or just rationalization?"

  **Your Reply (2 mins):**
  "That's the hardest question, and I take it seriously. It is true that 'integrity' can be abused as a shield for laziness. But the existence of a counterfeit doesn't invalidate the real thing.
  The question is: Is a life where you are the author of your actions fundamentally different from a life where you are a servant of the good, even if the servant life saves more people? I'm arguing that there is a value in *agency* itself. If we reduce the agent to a location where utility is calculated, we might save more lives, but we lose the 'we' who are doing the saving. I'm not saying you shouldn't bother. I'm saying that if you bother solely as an instrument, you've already lost something essential to being human."

  **Concede Up Front:**
  Acknowledge that people *do* use this argument in bad faith. It makes you look reasonable and not just defensive.

  **Where the Reply is Soft:**
  This is your weakest point. Against a room full of people who believe "lives saved" is the only metric that matters, "agency" sounds like a luxury good. You may not be able to prove the value of agency without appealing to intuition, which they are trained to distrust.

  ***

  **General Advice for the Room:**
  *   **Don't get bogged down in exegesis.** They know Williams. They think he's wrong. Focus on the *structural* claim (answerability to impartial ranking), not the textual details.
  *   **Use their language.** When you talk about "impartial ranking," frame it as an "optimization constraint." When you talk about "agency," frame it as "local vs. global optimization."
  *   **The Moral Uncertainty Move:** If they bring up moral uncertainty (weighting integrity intuitions against utilitarian ones), hit your thesis hard: "That treats integrity as a preference *within* the system. Williams says integrity is what makes you a system-user in the first place. You can't weigh the scale against the weights."
