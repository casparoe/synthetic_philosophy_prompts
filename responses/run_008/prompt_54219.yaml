answer: |-
  # Joint Statement on Consequentialist Guidance Under Causal Ignorance

  **Signatories:** The Optimizer Camp, The Skeptic Camp  
  **Date:** December 2023  
  **Subject:** Adversarial Collaboration on Cluelessness and Action-Guidance

  ## 1. Agreed Claims

  We, the undersigned camps, affirm the following substantive claims as the baseline for our continued discourse. These are not merely procedural; they represent philosophical concessions required to make our disagreement precise.

  1.  **The Epistemic Privilege of the Near-Term:** Both camps agree that direct, first-order consequences within a 5-to-10-year horizon are epistemically tractable. We reject the notion that *all* causal chains are equally opaque. Disagreement begins at the horizon where second- and third-order effects dominate.
  2.  **The Empirical Nature of Symmetry:** Both camps agree that the "Symmetry Thesis" (the claim that unknown effects cancel out to an expected value of zero) is an empirical hypothesis about the structure of the world, not an *a priori* truth of logic. The Optimizers reject the thesis as empirically false; the Skeptics accept it as the rational prior under radical ignorance.
  3.  **The Criterion of Rightness:** Both camps affirm act-consequentialism as the correct *criterion of rightness*. The Skeptics do not argue that non-consequentialist theories are true; they argue that consequentialism fails to provide a *decision procedure* under specific conditions of cluelessness.
  4.  **Expert Reliability:** Both camps agree that expert consensus on long-range forecasting (50+ years) provides a non-zero informational signal but is subject to systemic bias and black-swan vulnerability. Neither side treats expert models as ground truth, though they weight them differently.
  5.  **The Possibility of Asymmetry:** Both camps agree that if an intervention can be demonstrated to have a *structurally asymmetric* impact profile (where upside potential vastly outweighs downside risk, or vice versa), the Skeptics' symmetry objection is neutralized. The dispute is whether such demonstrations are possible for speculative interventions.

  ## 2. Disagreements Table

  | Claim in Dispute | The Optimizer Camp | The Skeptic Camp |
  | :--- | :--- | :--- |
  | **The Washout Thesis**<br>*(Do unknown long-term effects cancel out?)* | **False.** We posit that the distribution of long-term effects is fat-tailed and asymmetric. Intelligent intervention can skew the distribution positively (e.g., reducing existential risk). To assume symmetry is to assume the world is randomly hostile to human flourishing without evidence. | **Provisionally True.** Under radical causal ignorance, we lack the information to break symmetry. For every plausible positive ripple, there is an equiprobable negative ripple. Without specific causal models, the rational expectation is zero. |
  | **Action-Guidance Threshold**<br>*(When does uncertainty preclude action?)* | **Low Threshold.** If the best available model suggests positive expected value (EV), action is required. Waiting for certainty is itself a costly intervention with negative EV. We act on estimates. | **High Threshold.** If the confidence interval includes zero due to cluelessness, the theory yields no guidance. We restrict action to "robustly good" options where the sign of the EV is invariant across plausible models (e.g., direct aid). |
  | **Speculative Intervention**<br>*(Is work on existential risk rational?)* | **Yes.** The stakes (infinite or near-infinite future value) dominate the probability. Even with low confidence, the EV of mitigating existential risk outweighs near-term sureties. | **No (or Suspended).** The causal models linking specific research to existential risk mitigation are too brittle. The "washout" applies doubly here: we cannot know if the intervention prevents risk or inadvertently accelerates it. |
  | **Moral Paralysis**<br>*(Does the theory demand inaction?)* | **Reject.** This is a strawman. We advocate for *model-based* action, not paralysis. The Skeptics confuse "lack of certainty" with "lack of guidance." | **Accept (Qualified).** We accept "paralysis" only regarding *speculative* long-term interventions. We are not paralyzed regarding near-term robust goods. But strictly speaking, consequentialism cannot guide the big choices. |

  ## 3. Cruxes and Historical Test Cases

  We identify the following sub-questions as "cruxes." Settling these empirically or theoretically would cause at least one camp to revise its position. Following the cruxes, we apply them to two historical test cases. We commit to stating what we would have concluded *at the time*, and what we predict the other side would have concluded *at the time*.

  ### Core Cruxes
  1.  **Causal Density:** Is the social/ecological web dense enough that intervention effects diffuse to zero (Skeptic), or sparse enough that leverage points exist (Optimizer)?
  2.  **Value Aggregation:** Does moral value aggregate linearly over time (favoring Optimizers), or does discounting/uncertainty compound to negate distant value (favoring Skeptics)?
  3.  **Model Robustness:** Can we construct causal models for existential risk that survive the "cluelessness" critique?

  ### Test Case A: DDT (Decision Point: 1945)
  *Context: DDT is known to be highly effective at killing insect vectors. Malaria is a leading killer. Ecological bioaccumulation is unknown.*

  | Camp | Our Conclusion in 1945 | Prediction of Other Camp's 1945 View |
  | :--- | :--- | :--- |
  | **Optimizers** | **Deploy Widely.** The immediate EV (lives saved from malaria/crop loss) is massive and tractable. The risk of unknown ecological side-effects is symmetric but dwarfed by the certainty of human suffering. We bet on the tractable. | *We predict the Skeptics would have hesitated or called for extreme restriction, prioritizing the unknown ecological risk over the known human toll, effectively valuing "purity" over lives.* |
  | **Skeptics** | **Restrict/Localize.** The ecological system is complex and opaque. While malaria is bad, introducing a persistent toxin into the biosphere creates an unmodelable risk profile. The EV washes out; we should prefer non-chemical vector control where possible. | *We predict the Optimizers would have ignored the structural risk of bioaccumulation, treating the immediate malaria data as sufficient for global deployment, displaying overconfidence in their models.* |

  ### Test Case B: The Haber–Bosch Process (Decision Point: 1910)
  *Context: Synthetic nitrogen fixation is scalable. It will feed billions. It also enables high-explosives manufacturing on an industrial scale.*

  | Camp | Our Conclusion in 1910 | Prediction of Other Camp's 1910 View |
  | :--- | :--- | :--- |
  | **Optimizers** | **Accelerate Development.** The capacity to feed half the future population is an asymmetric good that outweighs the risk of enhanced warfare. Starvation is a certainty; war is a contingent risk. The EV is overwhelmingly positive. | *We predict the Skeptics would have flagged the dual-use nature as a symmetry-breaker for the worse, arguing that arming future conflicts negates the value of feeding the combatants.* |
  | **Skeptics** | **Pause/Regulate.** The dual-use nature creates a symmetric risk: the same mechanism that prevents starvation also enables total war. Without a model for global governance, the EV is indeterminate. We should not unlock this capacity without political safeguards. | *We predict the Optimizers would have dismissed the war risk as a secondary political problem, focusing solely on the caloric output and assuming the "good" of survival dominates the "bad" of conflict.* |

  ## 4. Substantive vs. Verbal Disagreements

  We have reviewed our remaining friction points and classify them as follows:

  **Substantive Disagreements:**
  *   **Priors on Asymmetry:** This is the core empirical split. Optimizers believe the world contains leverage points where human intervention creates net positive asymmetry. Skeptics believe the world is causally dense enough that intervention risks are symmetric. This is not verbal; it is a disagreement about the structure of reality.
  *   **Discounting:** We disagree on how to treat probability discounting over centuries. Optimizers treat low-probability/high-stakes events as decisive; Skeptics treat the compounding uncertainty as a discount rate that approaches 100%.

  **Verbal (or Pseudo-) Disagreements:**
  *   **"Paralysis":** The Optimizers use "paralysis" to imply *inaction*. The Skeptics use it to imply *lack of theoretical guidance*. The Skeptics do act (on robust goods); they just deny consequentialism *justifies* their speculative choices. We agree this is a definitional clash regarding "action-guiding."
  *   **"Cluelessness":** Optimizers treat cluelessness as a gradient (more or less data). Skeptics treat it as a threshold (once causal chains exceed modeling capacity, you are "clueless"). We agree to adopt the gradient definition for future work, acknowledging that "radical cluelessness" is the limit case, not the default state.

  ***

  ### Note on Contested Characterizations

  In drafting this document, the facilitators made two specific choices that lean on contested interpretations of the camps' positions:

  1.  **The Skeptic's "Robust Goods":** We have characterized the Skeptics as endorsing "robustly good, near-term options." Some hardline Skeptics in the group argue that if consequentialism yields no guidance, *no* option is rationally preferable, even near-term ones. We have smoothed this to make the position signable, assuming that Skeptics rely on a heuristic of "minimizing foreseeable harm" when EV is unknowable.
  2.  **The Optimizer's "Estimates":** We have characterized Optimizers as acting on "best estimates." Some Optimizers argue they act on *possibility* rather than *expectation* (Pascal's Wager style). We have forced them into an EV framework to maintain the shared consequentialist language, which may understate their willingness to bet on low-probability tails.

  We sign this not because we are no longer opposed, but because our opposition is now located.
