answer: |-
  ### (1) The nearest named concepts

  In standard decision theory, this scenario is almost universally misdiagnosed as the **Sunk Cost Fallacy** or, in organizational behavior, as **Escalation of Commitment**. Both terms presuppose that the decision to continue is driven by a psychological desire to justify past expenditures rather than a cold calculation of future utility. In economics, the concept of **Switching Costs** acknowledges that moving to a new system incurs friction, but this usually refers to contractual penalties or technical incompatibility, not the loss of intangible competence. The most rigorous economic explanation lies in Transaction Cost Economics, specifically **Asset Specificity** (Oliver Williamson), which describes investments that have high value in one context but low value outside it. However, this term typically describes the *asset* itself, not the *decision pattern* of continuing a project based on that asset's hidden value.

  ### (2) What is distinctive about the pattern as I described it

  The distinctive feature of your observation is that the "sunk" expenditure was not merely spent money, but rather the capitalization of **tacit knowledge** and **team-specific human capital**. Standard accounting treats the years of troubleshooting as expenses with zero residual value, whereas your analysis correctly identifies them as an investment in a non-fungible asset: the integrated competence of the team-machine system. The rationality here does not violate the rule to ignore sunk costs; rather, it corrects the valuation of *future* benefits. The bespoke instrument is not cheaper to build, but cheaper to *operate* and *trust* because the "lore" lowers the variance and risk of future experimental runs. The decision is rational not because the past costs matter, but because the past costs created a unique future advantage that an off-the-shelf solution cannot replicate.

  ### (3) A hard boundary case

  The boundary between rational continuation and pathological commitment becomes genuinely unclear when the "lore" is person-dependent rather than system-dependent. Suppose the lead experimentalist who intuitively understands the cryostat's drift patterns retires, and their knowledge was never fully codified in logbooks or protocols. The bespoke machine remains physically identical, and the accounting for finishing it remains unchanged, but the "tacit asset" has walked out the door. At this precise moment, continuing the project shifts from rational exploitation of specific capital to irrational escalation, yet the external financial metrics look identical to the previous week. Determining whether the know-how is embedded in the *instrument* (rational to continue) or the *individual* (irrational to continue) is often impossible until after the transition fails.

  ### (4) Verdict

  The most precise existing concept is **Human Asset Specificity**, which validates the economic reality that the value resides in the specific match between the team and the tool. However, because decision theory lacks a positive label for this decision pattern—typically lumping it into the negative category of Escalation of Commitment—I propose coining the term **"The Tacit Continuation Exception."** This is defined as: *A decision to proceed with a project despite negative net accounting value, justified by the presence of non-transferable, team-specific knowledge that lowers future operational risk below that of available alternatives.* This distinguishes the rational harvesting of embedded competence from the irrational defense of past mistakes.
