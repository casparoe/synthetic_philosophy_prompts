      *   Address specific phrases ("man within," "impartial spectator," "praise vs praiseworthy")? Check.
      *   Honest verdict on tension? Check.

  9.  **Final Polish:** Ensure the distinction between the "man within" as a psychological mechanism and the "impartial spectator" as a normative standard is clear, as Smith sometimes blurs them. (Self-correction: Smith often uses them interchangeably, but the *function* shifts. I should clarify that shift).

      *   *Key Textual Evidence to recall:*
          *   Part III, Chapter 1: Formation of conscience.
          *   Part III, Chapter 5: Praise vs. Praiseworthiness.
          *   Part VI: The character of the "man within" becomes more sublime.
          *   The distinction between the "partial spectator" (real people) and "impartial spectator" (ideal).

  10. **Finalizing the Verdict:** The tension is real but resolved by seeing the "man within" as an *educated* faculty, not just a *recording* of society. It starts as society but becomes a critic of society.

      *(Self-Correction during drafting)*: Make sure not to make Smith sound like Kant. The "impartial spectator" isn't pure reason; it's still based on sentiment/sympathy, just refined. Keep it grounded in Smith's moral psychology.

