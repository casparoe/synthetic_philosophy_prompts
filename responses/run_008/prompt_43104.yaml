      *   *BM Reality:* BM *needs* a preferred slicing to define the particle trajectories consistently in a relativistic context. Even if empirically hidden (as per 5), ontologically it exists. If (4) means "ontologically there is no preferred frame," BM is false. If (4) means "empirically undetectable," BM fits, but standard relativistic philosophy usually interprets (4) ontologically (Minkowski spacetime).
