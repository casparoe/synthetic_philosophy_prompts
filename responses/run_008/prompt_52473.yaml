answer: |-
  This is one of the classic headaches of metaphysics and legal theory. You have independently rediscovered the debate surrounding H.L.A. Hart and Tony Honoré's *Causation in the Law* (1959), as well as contemporary work by philosophers like Sarah McGrath and Jonathan Schaffer.

  Your intuition that "counterfactuals alone aren't enough" (Case 6 and 8 prove this) is correct. If causation were *only* "If X hadn't happened, Y wouldn't have," then your dead grandfather and every person on earth would be mass murderers every time a plant died.

  Here is the principle that best unifies your list, how it handles the awkward cases, and the hard truth about which of your intuitions you likely need to sacrifice.

  ### The Principle: Normative Expectation + Salience

  The most robust principle isn't just about **Duty** (which is too legalistic) or **Counterfactuals** (which is too broad). It is about **Deviation from a Normatively Expected Course of Events.**

  An omission counts as a cause if:
  1.  **Counterfactual Dependence:** Had the action occurred, the outcome would have been prevented.
  2.  **Capacity:** The agent was physically/mentally able to act (rules out Grandfather).
  3.  **Normative Expectation:** There was a specific social, contractual, or situational expectation that *this* agent would perform *this* action, making their inaction a "deviation" from the normal course of things.

  We don't count omissions as causes when they are just "background conditions" (like gravity not lifting the plant). We count them when they represent a **failure of a specific system** designed to prevent the outcome.

  ### Applying the Principle to Your List

  *   **Cases 1, 2, 4 (The Duty Cases):** These fit perfectly. In Case 1 and 4, there is a specific system (promise, employment) that sets a norm. The omission is a deviation. In Case 2, the neighbor is background noise; his inaction is the "default state" of the universe, not a deviation.
  *   **Case 6 (Grandfather):** Fails Capacity. A dead man cannot deviate from a norm.
  *   **Case 8 (Everyone on Earth):** Fails Normative Expectation. There is no system in place where "everyone" is the designated plant-saver. Their inaction is the default state.
  *   **Case 3 (Two Neighbors):** This is **Overdetermination**. Your worry ("doesn't add up to two full causes") assumes causation is like a pie—if I take a slice, there's less for you. It isn't. Causation is a status label. If two snipers shoot a victim simultaneously, both caused the death. If two duty-bound neighbors forget, both deviated from the norm, and both are causes. It is not "half-cause."
  *   **Case 7 (The Lie):** This is actually a **Commission**, not just an omission. By telling the third neighbor "I've got it," you actively altered the normative landscape. You removed a backup cause. This is a stronger cause than simple forgetting. It's one causal chain: you disabled the safety net *and* failed to catch the fall.

  ### The Verdict on Case 5 (The Lone Beachgoer)

  This is the case that breaks the "Duty" rule, and it's where your gut is fighting your head.

  **The Principle's Verdict:** Strictly speaking, the lone beachgoer did **not** cause the death.
  **Why you flip-flop:** You are conflating **Moral Responsibility** with **Causation**.

  In Case 5, the beachgoer is a moral monster. But metaphysically, his inaction is still the "default state" of a stranger. There was no system in place (lifeguard stand, contract, promise) that made his intervention the "expected" course of events. The reason it *feels* like causation is that the moral blame is so overwhelming it bleeds into our causal language. We say "He killed that swimmer" as a shorthand for "He is so morally responsible for the death that he might as well have caused it."

  **However**, there is a nuance: Some philosophers argue that in extreme isolation, the **Situational Norm** shifts. If you are the *only* human present, the "normal course of events" for a human in the presence of a drowning person *is* to help. If you accept this "Situational Norm" view, Case 5 flips to **Cause**.

  **My advice:** Keep them separate. Call him morally responsible, but don't call him the cause. It keeps your ontology cleaner.

  ### Predictions for Your New Cases

  **1. The Off-Duty Doctor**
  *   *Scenario:* Doctor is at Hospital B. Patient dies at Hospital A. Doctor is the only one who could have saved them.
  *   *Prediction:* **Not a Cause.**
  *   *Reasoning:* While Capacity and Counterfactuals hold, Normative Expectation fails. The "system" of medical care assigns duty by location and shift. An off-duty doctor is like the neighbor in Case 2. They are a potential savior, but their non-action is not a deviation from the expected norm of their role *at that time*.

  **2. The Smoking Security Guard**
  *   *Scenario:* Guard is paid to watch Door A. Leaves for smoke. Thief enters Door A.
  *   *Prediction:* **Cause.**
  *   *Reasoning:* Fits Case 4 perfectly. The guard is part of a specific system designed to prevent this exact outcome. Leaving the post is a deviation from the norm. Even though the thief *commissioned* the crime, the guard's omission is a causal factor (often legally treated as enabling).

  ### The Hard Truth: Which Verdicts Must You Overturn?

  You asked for honesty. If you want a consistent principle, you have to sacrifice **Case 3's confusion** and **Case 5's ambivalence.**

  1.  **Stop treating Causation as Conserved (Case 3):** You need to accept that two people can each be "the cause" of the same event. It feels weird because we associate cause with blame, and we feel like blaming two people "dilutes" the blame. It doesn't. Both neighbors in Case 3 are 100% causes.
  2.  **Separate Morality from Metaphysics (Case 5):** This is the hardest pill. You must accept that a person can be **100% morally blameworthy** for a death without being the **cause** of the death.
      *   *Why?* Because if you say the beachgoer *caused* the death, you have to explain why the person on the other side of the world didn't. Is it a sliding scale? That gets messy.
      *   *The Fix:* Admit that "Cause" is a limited tool. It tracks *systems and norms*, not just *bad outcomes*. The beachgoer violated a moral norm, not a causal norm.

  ### Summary
  The unifying principle is **Deviation from Normative Expectation.**
  *   It explains why duties matter (they create the norm).
  *   It explains why the dead grandfather doesn't count (no capacity to deviate).
  *   It explains why the crowd doesn't count (no specific expectation for any individual).
  *   It resolves Case 3 by treating causation as a binary status, not a divisible resource.
  *   It resolves Case 5 by forcing you to admit you are sensing *moral* weight, not *causal* structure.

  If you hold to this, you stop flip-flopping on the beachgoer. He's a villain, but he's not a cause. And that distinction is actually vital—if we treat every moral failure as a causal act, the concept of "cause" loses all its power to describe how the world works.
