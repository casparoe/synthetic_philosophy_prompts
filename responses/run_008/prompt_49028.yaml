prompt: |-
  My wife and I just went through IVF and something about the paperwork got me thinking. The clinic does genetic testing on the embryos, ranks them by health stuff, and hands us a report so we can pick which one to transfer — all totally standard, no ethics lecture attached. But on the same form there's a part saying they won't do sex selection (illegal where we live I think), and obviously zero chance they'd help you pick an embryo for deafness. So the clinic will happily rank embryos on medical grounds and give the parents the choice, but draws a hard line at choosing on other grounds. What's the actual principle underneath that? Does the routine practice of ranking embryos presuppose some view of what parents owe their future kid — like a duty to pick the healthiest one, not just permission to? And if so, why doesn't the same logic make sex selection, or someday picking for intelligence, just more of the same — why is the line where it is? The non-identity thing occured to me too: the kid born from the chosen embryo couldn't have existed otherwise, so it's not like the unchosen embryos get wronged. I don't want a survey of positions here — take an actual stance on what the practice commits you to, whether the clinic's implicit theory is coherent or just vibes, and where you'd draw the line and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and his wife went through IVF with PGT (Preimplantation Genetic Testing). They noticed a discrepancy in the clinic's approach: ranking embryos by health/viability is standard and encouraged, but sex selection and selecting for disabilities (e.g., deafness) are forbidden/prohibited.
      *   **Core Question:** What is the underlying ethical principle? Does ranking imply a *duty* to pick the healthiest? If so, why isn't sex selection or intelligence enhancement treated the same? Is the clinic's stance coherent or just "vibes"?
      *   **Constraints:** Do *not* give a survey of positions (e.g., "Some say X, others say Y"). Take an *actual stance*. Evaluate the coherence of the clinic's implicit theory. Draw a line and justify it.
      *   **Philosophical Concepts Mentioned:** Non-identity problem (acknowledged by the user).
      *   **Tone:** Philosophical, analytical, direct, engaged.

  2.  **Deconstruct the Clinic's Implicit Ethic:**
      *   *Practice:* Rank embryos by medical viability/health. Allow parents to choose among top tier.
      *   *Prohibition:* No sex selection. No selecting for disability.
      *   *Implicit Principle:* It looks like a "Best Interest" or "Harm Reduction" principle, but it's constrained by "Medical Necessity."
      *   *Coherence Check:* Is it coherent to say "Maximize health" but not "Maximize X" where X is a trait?
      *   *The "Duty" Question:* Does ranking imply a duty to pick #1? Usually, clinics say "Choose among the top viable ones." They don't mandate #1. So it's more about *permission* to avoid disease, not a *mandate* to optimize.

  3.  **Formulate a Stance:**
      *   *Thesis:* The clinic's practice is *mostly* coherent but rests on a specific distinction between **restoring normal function/avoiding harm** vs. **social engineering/enhancement**. However, the user is right to press on the boundary. The strongest philosophical grounding isn't about "harming the child" (due to non-identity) but about **parental obligation to minimize suffering** vs. **parental right to shape a life**.
      *   *Refinement:* I need to argue for a specific principle. Let's call it the **Principle of Medical Necessity vs. Social Preference**.
      *   *Critique:* The clinic's line is often arbitrary (e.g., why is sex selection worse than selecting against a mild genetic condition?). But there is a defensible line.
      *   *My Stance:* The practice commits parents to a **duty of rescue** regarding serious pathology, but not a **duty to optimize**. The line should be drawn at **pathology vs. variation**. Sex selection is variation. Deafness (in this context) is often viewed by the Deaf community as culture, but medically as pathology. Intelligence is enhancement.
      *   *Wait, I need to be firmer.* The prompt asks me to take a stance on whether the theory is coherent.
      *   *Decision:* I will argue that the clinic's implicit theory is *pragmatically* coherent but *philosophically* unstable unless anchored in a specific view of medicine's purpose. The purpose of medicine is to treat pathology, not to satisfy consumer preference. Therefore, ranking for health is medical; selecting for sex is consumerist.
      *   *The "Duty":* There is no duty to pick the *absolute* healthiest (otherwise they wouldn't let you choose among top 3), but there is a duty not to pick *knowingly worse* (e.g., deafness).
      *   *The Line:* The line is **Pathology**.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the sharpness of the observation. It's the "Expressivist Objection" vs. "Procreative Beneficence."
      *   *The Clinic's Logic:* They operate under a **Medical Model**. IVF is a treatment for infertility/genetic disease. PGT is a diagnostic tool.
      *   *Coherence:* Is it coherent? Yes, if the goal is *healthy offspring*, not *designer offspring*.
      *   *The Duty:* Does ranking imply a duty? No, it implies a **permission to prevent harm**. If you pick a lower-ranked embryo (assuming both are healthy enough to live), you aren't harming the child (non-identity). But if you pick one with a known severe defect over a healthy one, you are violating a duty of **procreative beneficence** (Savulescu's term, though I won't just name-drop, I'll use the concept).
      *   *Sex Selection:* Why ban it? Because sex is not a pathology. Selecting for it turns the child into a product satisfying a preference, violating the **unconditional acceptance** norm of parenting.
      *   *Deafness:* Why ban it? Because it limits the child's "open future." Even if the Deaf community argues otherwise, medically it reduces functional capacity.
      *   *Intelligence:* Why ban it? Because it's enhancement, not therapy. It exacerbates inequality and treats the child as a project.
      *   *My Line:* The line is **Therapy vs. Enhancement**.
      *   *Critique of the Clinic:* They are often inconsistent (e.g., allowing family balancing in some jurisdictions). But the *principle* holds.
      *   *Refining the "Duty":* I need to address the "duty to pick the healthiest." If I have Embryo A (100% health score) and Embryo B (95% health score), do I owe it to B to pick A? Most ethicists say no, provided B is above a threshold of health. The duty is negative (don't pick C with a fatal defect), not positive (must pick the absolute best).
      *   *Finalizing the Stance:* The clinic's stance is coherent *if* we view reproduction as a **medical intervention** rather than a **consumer transaction**. The line is drawn at **medical necessity**.

  5.  **Addressing Specific Prompt Requirements:**
      *   *Take a stance:* I will argue the clinic's distinction is defensible based on the **Therapy/Enhancement Distinction** and the **Open Future** principle.
      *   *Coherence:* It is coherent, but fragile.
      *   *Duty:* There is a duty to avoid harm, not a duty to maximize.
      *   *Non-Identity:* Acknowledge it but explain why it doesn't dissolve the obligation (the "person-affecting" view vs. "impersonal" view). I'll lean towards the idea that while the specific child isn't harmed, the *act of parenting* is corrupted if we treat children as designed products.

  6.  **Writing the Response (incorporating the "Voice"):**
      *   Avoid academic hedging ("Some philosophers argue...").
      *   Use direct language ("Here is the principle," "The line is here").
      *   Engage with the "vibes" comment.
      *   Make sure to address the "duty" aspect specifically.

      *(Self-Correction during drafting)*: I need to be careful not to just repeat standard bioethics. The user wants *my* take on what the practice *commits* them to.
      *   *Commitment:* By using PGT to rank, you commit to the idea that **health is a relevant moral category in selection**.
      *   *Incoherence:* The incoherence arises if you think health is the *only* category.
      *   *My Line:* I will defend the **Threshold View**. You must ensure the child meets a threshold of health (avoiding severe disease), but you have no duty to maximize above that threshold. Sex selection falls below the threshold of relevance.

      *(Refining the "Deafness" point)*: This is tricky. The prompt mentions "obviously zero chance they'd help you pick an embryo for deafness." I need to explain *why* that's banned while health is promoted. It's about the **Open Future**.

      *(Refining the "Sex Selection" point)*: Why is this banned? It's often about social harm (gender imbalance) and the commodification of children.

      *(Final Plan)*:
      1.  Identify the core principle: **Medical Necessity vs. Parental Preference**.
      2.  Address the Duty: **Negative Duty (avoid harm) vs. Positive Duty (maximize)**.
      3.  Defend the Line: **Therapy vs. Enhancement/Preference**.
      4.  Conclude on Coherence: It's coherent if medicine's role is limited, but collapses if IVF becomes a marketplace.

  7.  **Final Polish:** Check tone. Ensure it sounds like a thoughtful philosophical engagement, not a medical advice column. Ensure I don't just survey views but argue for one. (I will argue for the "Threshold of Normal Functioning" view).

      *Wait, one more thing:* The user asked "Does the routine practice... presuppose some view of what parents owe their future kid?"
      *Answer:* Yes. It presupposes a duty to **not knowingly disable**. It does *not* presuppose a duty to **optimize**.
      *Why the line?* Because optimization leads to eugenics/commodification. Avoiding disability is rescue.

      *Let's lock in the argument:* The clinic's policy is coherent *only if* we accept that the moral goal of procreation is to produce a child with an **open future**, not a child who fulfills a **specific design**. Health ranking serves the open future (removing barriers). Sex selection serves a design (imposing a preference).

      *Okay, ready to write.*
answer: |-
  The clinic's paperwork isn't just "vibes," but it is philosophically precarious. It rests on a specific, defensible distinction that often goes unstated: the difference between a **duty of rescue** and a **project of design**.

  Here is the stance: The practice of ranking embryos commits you to the view that parents have a **negative duty to avoid imposing preventable suffering**, but it does not commit you to a **positive duty to maximize traits**. The line is drawn at **pathology versus preference**. The clinic's policy is coherent only if we view medicine's role as restoring or preserving "normal species functioning," not as a service bureau for parental consumerism.

  Here is why that distinction holds, where the duty lies, and why sex selection and intelligence enhancement fall on the wrong side of the line.

  ### 1. The Duty: Rescue, Not Optimization
  You asked if ranking embryos implies a duty to pick the healthiest one. The answer is no, but it does imply a duty not to pick the *unhealthiest* when a healthier option exists.

  This is the **Threshold View**. By using PGT (Preimplantation Genetic Testing) to screen out aneuploidy or Tay-Sachs, you are acknowledging that bringing a child into existence with a known, severe medical burden is a harm you have the power to prevent. This is a **duty of rescue**. You are rescuing the future child from a life of pain or early death.

  However, once embryos cross a threshold of "medically viable and healthy," the duty evaporates. If Embryo A is ranked #1 (slightly higher implantation potential) and Embryo B is ranked #5 (still high potential, no genetic defects), you owe it to neither to pick A. Why? Because both promise a life within the range of "normal functioning."

  If the clinic's logic implied a duty to *maximize* health, they would mandate the transfer of the #1 ranked embryo every time. They don't. They give you a choice among the "good" ones. This proves the ethic is about **avoiding harm**, not **optimizing goods**.

  ### 2. Why Sex Selection Crosses the Line
  If we are allowed to choose for health, why not sex? Both are genetic traits. The difference is that health is a **precondition for an open future**, while sex selection is a **specification of a social role**.

  *   **Health:** Selecting against a heart defect removes a barrier to whatever life the child wants to lead. It maximizes their autonomy.
  *   **Sex:** Selecting for a boy or a girl imposes a parental preference onto the child's identity before they exist. It treats the child as a means to satisfy a parental desire (for balance, for a son to carry the name, etc.) rather than an end in themselves.

  This is the **Commodification Objection**. When you select for health, you are preparing a vessel to hold a person. When you select for sex, you are ordering the person. The clinic bans sex selection not because being male or female is "unhealthy," but because allowing it shifts the parent-child relationship from **stewardship** to **manufacturing**. It signals that the child is accepted conditionally, based on traits, rather than unconditionally.

  ### 3. The Case of Deafness and Intelligence
  You mentioned deafness. The clinic bans selecting *for* deafness. Critics (particularly in Deaf Culture) argue this is ableist, that deafness is a cultural identity, not a defect. However, from the perspective of the clinic's ethical framework (and the one I defend), the ban is based on the **Principle of the Open Future**.

  Even if a Deaf community provides a rich life, selecting *for* deafness deliberately closes doors (hearing music, hearing a child cry, certain career paths) that could otherwise be open. Parents have a right to shape their child's environment, but they do not have a right to deliberately limit their child's biological capacities to fit a lifestyle. That violates the duty to act in the child's best interest regarding their future autonomy.

  Intelligence enhancement is the mirror image. Selecting *for* high IQ isn't about avoiding pathology; it's about **enhancement**.
  *   **Therapy:** Bringing a child up to the normal range of functioning (fixing a deficit).
  *   **Enhancement:** Pushing a child above the normal range (creating an advantage).

  If we allow enhancement, we enter a market of genetic arms races. This exacerbates social inequality and turns parenting into a competitive sport. More importantly, it increases the pressure on the child. A child selected for health is expected to be *healthy*. A child selected for intelligence is expected to be *smart*. The former is a baseline for well-being; the latter is a performance metric.

  ### 4. Is the Clinic's Theory Coherent?
  The clinic's theory is coherent, but only if you accept a **Medical Model of Reproduction**.

  *   **Coherent:** If IVF is a medical treatment for infertility and genetic disease, then interventions must be medically indicated. Screening for disease is medically indicated. Selecting for blue eyes or male sex is not. The line is "Medical Necessity."
  *   **Incoherent:** If IVF is a consumer service for building families, the line is arbitrary. Why is avoiding a mild genetic risk okay, but avoiding having a daughter not? If the customer is always right, the ban on sex selection is just prejudice.

  The clinic is betting on the Medical Model. They are asserting that **doctors are not vendors**. They are saying, "We will help you have a healthy child, but we will not help you build a custom child."

  ### 5. Where I Draw the Line
  I draw the line at **Normal Species Functioning**.

  1.  **Permissible:** Selecting against traits that cause disease, disability, or significant impairment. This fulfills the duty to minimize suffering and maximize the child's future autonomy.
  2.  **Impermissible:** Selecting *for* traits (sex, eye color, intelligence) or selecting *for* disabilities. This violates the duty to treat the child as an independent person with an open future, rather than a project designed to meet parental specifications.

  **The Non-Identity Problem:**
  You noted that the unchosen embryo isn't "wronged" because it never exists. This is true. The ethical obligation isn't to the *embryo* left in the freezer; it's to the **practice of parenting**.

  If we normalize selecting for sex or intelligence, we change the social meaning of having children. We shift the norm from "welcoming a gift" to "accepting a product." If the product is defective (wrong sex, low IQ), the implication is that it can be rejected. By drawing the line at medical necessity, we protect the idea that children are owed **unconditional acceptance**, provided they are given the best chance at a healthy life possible.

  ### Summary
  The paperwork isn't inconsistent. It reflects a commitment to **Procreative Beneficence** (do the best you can to ensure a good life) without sliding into **Procreative Perfectionism** (design the best possible life).

  *   **Ranking for health** = Removing obstacles to a good life. (Duty)
  *   **Selecting for sex/IQ** = Imposing a blueprint for a specific life. (Preference)

  The clinic is right to distinguish them. The moment you conflate avoiding disease with satisfying preference, you stop treating the future child as a person to be born and start treating them as a product to be built. The line holds because the moral status of "healing" is fundamentally different from the moral status of "enhancing."
