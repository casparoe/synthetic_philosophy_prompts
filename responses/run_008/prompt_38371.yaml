      *   Does asymmetry break it? Parfit usually treats connectedness as requiring *some* two-way traffic (memory + intention). If the future self is a stranger to me, but I am not a stranger to them (because they don't exist yet), that's tricky.
      *   Actually, the scenario describes *future* selves having no access to *now*. That's the standard direction of memory.
      *   If the thinning is *only* forward-looking (I remember everything, but my future self won't remember me), that is exactly what memory is. The issue is the *degree*.
      *   If the future self retains full access to the past (including me), then Connectedness is high from their end. But Connectedness is usually defined by the holding of relations. If Future-Me remembers Present-Me, that's a link.
      *   Wait, the prompt asks: "whether the case still works if the thinning is only forward-looking (you keep full access to your past, but your future self has almost no access to you-now)."
