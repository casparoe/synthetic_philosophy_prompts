answer: |-
  **The Scenario**

  Consider a patient diagnosed with "Progressive Associative Degeneration," a rare condition where neural pathways calcify unless actively rewritten, treated with a mandatory, decade-long regimen of "Synaptic Recalibration Therapy." The treatment is medically perfect: the body remains robustly healthy, pain is absent, and the patient reports a consistently flourishing quality of life throughout the process. However, the mechanism of recalibration requires that to form new stable pathways, old memory engrams and character traits must be pruned and replaced. Consequently, while psychological connectedness remains high between adjacent days (the patient remembers yesterday vividly and carries out yesterday's intentions), the overlap degrades rapidly over longer intervals. Ten years from now, the patient will share almost no specific memories, values, or intentions with the person entering treatment today, despite an unbroken chain of day-to-day psychological links linking them. The body remains numerically identical throughout, but the psychological distance between the current self and the distant future self becomes vast, even though no single step in the chain feels like a break.

  ***

  **Analysis of the Three Views**

  1.  **Bodily Continuity:** The bodily theorist secures the intuitive high ground here. Since the biological organism and the brain substrate persist without interruption, identity is strictly preserved. Because identity is binary and all-or-nothing, the bodily theorist mandates full future-directed concern. The fact that the future psychology is alien is irrelevant; it is *my* alien future, so I should care about it just as much as I care about tomorrow.
  2.  **Simple Psychological Continuity:** A theorist holding that identity *just is* psychological continuity (without Parfit's reductionist nuance) faces a dilemma. If they define continuity as an overlapping chain, identity is preserved (the chain is unbroken). However, this view often struggles to explain why concern should vary. If they say identity holds, they typically imply full concern, aligning them with the bodily theorist. If they admit identity is a matter of degree, they collapse into Parfit's view.
  3.  **Parfit's Reductionism:** Parfit distinguishes between *Continuity* (the overlapping chain) and *Connectedness* (direct psychological links). He argues that while Continuity may suffice for survival (in a loose sense), *What Matters* for rational concern is Connectedness. In this scenario, Continuity holds, so the subject survives. However, because direct Connectedness between *Now* and *Ten-Years-Hence* is nearly zero, Parfit's machinery dictates that the current patient has significantly *less* reason for special concern for that future person than for their immediate tomorrow. This creates the reversal: The Bodily theorist demands full concern; the Parfitian advises emotional detachment, despite agreeing the subject survives.

  **The Feature Doing the Work**
  The crucial feature is the **decoupling of local connectedness from global connectedness**. By maintaining high fidelity between $t$ and $t+1$ while allowing fidelity between $t$ and $t+10$ to evaporate, the scenario exploits Parfit's claim that concern should be proportional to the degree of direct psychological relation. The Bodily view is immune to this gradation, which is why it ends up licensing *more* concern than the psychological view in this specific instance.

  **Playing Defense: Parfitian Objections**

  A sophisticated Parfitian would resist the conclusion that concern should fade by attacking the "threadbare" nature of the chain.
  1.  **Continuity is Enough:** Parfit sometimes suggests that *Continuity* (the chain itself), not just *Connectedness* (direct links), is what matters. If the chain is unbroken, What Matters is preserved fully, regardless of how thin the direct links are. If the Parfitian takes this route, the case fails to generate the reversal.
  2.  **Ordinary Aging:** A Parfitian might argue this is just an accelerated version of ordinary aging. We already accept that we have less in common with our selves 40 years hence. The case might be cheating by presenting a pathological acceleration of a natural phenomenon, making the fade in concern seem counterintuitive only because it is fast, not because the principle is wrong.
  3.  **Quality of Life:** They might argue that if the future life is "decent," the lack of memory doesn't reduce the *value* of that life to the present self, only the *recognition*. But Parfit ties concern to the relation, not just the value.

  **The Asymmetry Question**

  Does the case work if the thinning is only forward-looking (you keep full access to your past, but your future self has almost no access to you-now)?
  **Yes, and it strengthens the Parfitian conclusion.** Parfitian connectedness relies heavily on memory (past-directed) and intention-fulfillment (future-directed). If the future self has no access to you-now (no memory of your plans, values, or experiences), the direct psychological link from *their* end is broken. Even if *you* can imagine them, the relation R is not fully held. For Parfit, concern is rational only insofar as there is a psychological grip between the stages. If the future self cannot "hold" the present self in memory, the present self has less rational ground to "hold" the future self in concern. The Bodily theorist remains unaffected by this asymmetry, as the physical causal chain runs forward regardless of memory access, preserving their position that full concern is warranted. Thus, the asymmetry highlights the divergence between the views rather than breaking the case.
