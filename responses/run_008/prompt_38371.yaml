      *   If the asymmetry is that *I* remember *them* (impossible) vs *They* remember *me*.
      *   Let's clarify: "You keep full access to your past" = Standard. "Your future self has almost no access to you-now" = Amnesia regarding the present self.
      *   If the future self doesn't remember the present self, direct connectedness is broken. Parfit's view holds: concern should fade.
      *   Does it break the case? No, it reinforces it. The Bodily theorist still says "It's you." The Parfitian says "Weak connection, weak concern."

  7.  **Refining the Output:**
