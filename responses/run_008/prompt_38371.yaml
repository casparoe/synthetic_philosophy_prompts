  4.  **Analyzing the Views:**
      *   *Bodily Continuity:* The body/brain is the same. Identity is preserved. Concern is full. (High Ground).
      *   *Simple Psychological Continuity:* Usually requires *enough* continuity. If the chain is unbroken, they might say identity holds. But if they define it by "non-branching psychological continuity," they might say survival occurs. However, the *degree* of concern isn't usually part of the simple view (it's often binary). I need to distinguish Simple Psychological *Identity* from Parfit's *What Matters*.
