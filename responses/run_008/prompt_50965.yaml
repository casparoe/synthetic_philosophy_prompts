answer: |-
  **Session Plan: The Credibility Gap (50 mins)**

  **1. Sequence: Credibility Before Concepts**
  Start with **Testimonial Injustice** (being disbelieved), then move to **Hermeneutical Injustice** (lacking the words to be understood).
  *Why:* Your guys know the pain of not being believed. That's the hook. Once they agree that *unfair* disbelief is real, you can introduce the deeper problem: sometimes you can't even explain the harm because the language doesn't exist yet. If you start with the "missing words" concept, it feels abstract. Start with the "lying cop/judge" dynamic they live daily.

  **2. The Core Example: The ER Patient**
  Use the **chronic pain/drug-seeking** example, not sexual harassment.
  *Why:* Sexual harassment relies on a gendered experience many in this room may not share. The ER example mirrors their specific grievance: authority figures (medics, cops, parole) interpreting their pain or excuses as manipulation.
  *The Scenario:* A guy walks into the ER with a back injury. He says, "I'm in pain." The doctor sees his record or his clothes and hears, "He wants pills." The truth is ignored not because of evidence, but because of *who* he is perceived to be.
  *Whiteboard:* Draw two columns. "What He Said" vs. "What They Heard."

  **3. Heading Off Misconceptions**
  *   **"Any doubt is injustice."**
      *   *When:* Minute 20, during the ER example.
      *   *How:* Ask: "If the story doesn't add up, is the doctor wrong to doubt?" Let them say no. Clarify: Injustice isn't doubt; it's *discounting* someone because of prejudice (ex-con, addict, poor). Normal doubt checks facts; unfair doubt checks identity.
  *   **"The fix is to believe everyone."**
      *   *When:* Minute 45, during wrap-up.
      *   *How:* Be clear: We aren't asking for blind belief. We're asking for a *fair hearing*. If you give everyone the same benefit of the doubt, you might still disagree, but you haven't wronged them.

  **4. What to Refuse**
  State this at Minute 5.
  *   **No Case Work:** "We aren't fixing your parole hearings today. Don't bring specific cases for me to solve."
  *   **No Therapy:** "We aren't diagnosing trauma. We're looking at the system's rules, not your personal pain."
  *   *Why:* Keeps the session philosophical, not legal or clinical. Prevents you from promising help you can't give.

  **5. The Closing Question**
  To test if they grasp the difference between being mistaken and committing injustice, ask this:

  *"If a judge rejects your alibi because your timeline is shaky, is that unfair? What if he rejects it because he thinks guys with your record always lie?"*

  **Logistics**
  *   **0-5 mins:** Set boundaries (Refusals). Title the board: "Being Heard vs. Being Humored."
  *   **5-25 mins:** The ER Example (Credibility). Discuss the "Prejudice Discount."
  *   **25-40 mins:** The Missing Words (Concepts). Use "PTSD" before it was named. You knew you weren't right, but couldn't prove it because the map was missing.
  *   **40-50 mins:** Misconceptions & Closing Question.

  **Facilitator Note:** Keep your hands off the marker after the first 10 minutes. Let them write the words they wish they'd had. If they get angry at the system, validate the anger but pivot back to the mechanism: "That anger is the signal. What caused it?"
