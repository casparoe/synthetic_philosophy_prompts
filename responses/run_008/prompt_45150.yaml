answer: |-
  The practice of Iterated Elimination of Dominated Strategies (IEDS) rests on a specific, demanding reconstruction of rationality and epistemic conditions. To reconcile its normative certification in mechanism design with its descriptive failure in games like the Traveler's Dilemma, we must distinguish between the logic's strict requirements and the contextual assumptions practitioners import to make it viable.

  **(i) Epistemic Depth and Common Knowledge**
  Strictly, each round of deletion consumes one order of mutual knowledge. Round 1 requires that each player is rational. Round 2 requires that each player knows the others are rational. Round $k$ requires $k$-th order mutual knowledge of rationality. For the process to terminate in a unique profile (as required for certification), **Common Knowledge of Rationality (CKR)** is a strict logical presupposition. Without unbounded CKR, the chain of reasoning halts prematurely, leaving multiple survivors.
  However, the practice sits comfortably with the view that CKR is an idealization. In mechanism design, practitioners often hope that **incentive compatibility** (Round 1 dominance) does the heavy lifting, rendering deep iteration unnecessary. In the Traveler's Dilemma, the equilibrium requires ~50 layers of reasoning; in a second-price auction, truth-telling is (weakly) dominant, requiring only self-rationality. The practice presupposes CKR for the *theorem*, but relies on **structural salience** to approximate it in *application*.

  **(ii) Mixed-Dominance and Randomization**
  The step allowing a mixed strategy to dominate a pure one presupposes **von Neumann-Morgenstern expected utility theory**. Strictly, it requires that players:
  1.  Have access to a costless, private randomizing device.
  2.  Evaluate lotteries linearly (risk neutrality or consistent risk attitudes).
  3.  Play in a simultaneous setting where opponents cannot condition on the realization of the mix.
  This is largely an **idealization of the model** rather than a claim about actual cognitive machinery. In one-shot play, "implementing a mixture" is behaviorally equivalent to choosing a pure strategy drawn from the distribution, provided the opponent cannot detect the choice beforehand. If players could not randomize, mixed-dominance deletions would vanish, significantly enlarging the set of survivors and weakening the certification power of the mechanism.

  **(iii) Ordering and Transparency of Reasoning**
  The fact that order does not matter for strict dominance (if $A$ is dominated by a mix including $B$, and $B$ is later deleted, $A$ remains dominated by a new mix) presupposes **logical omniscience** and a **timeless view of deduction**. It requires that players perceive the entire payoff structure transitively; the justification for deleting $A$ does not depend on $B$ surviving, but on $B$ being *logically available* to construct the dominating argument at the outset. This requires **transparency of reasoning**: players must be able to replicate the theorist's full elimination chain instantly. If reasoning is procedural or bounded, the chain breaks, and earlier deletions may become unjustified.

  **(iv) Reconciliation of Analysis and Design**
  The divergence between the Traveler's Dilemma (analysis) and Auctions (design) is reconciled by the **epistemic burden** imposed by the mechanism.
  *   **Analytic Use:** In abstract games, there is no external support for CKR. High-order iteration is cognitively costly and unsupported by context, so predictions fail.
  *   **Design Use:** Mechanism designers trust IEDS because they assume **publicity of rules and concentrated incentives manufacture effective common knowledge**. In a market, repeated play and financial stakes teach rationality, simulating CKR.
  *   **Strict vs. Comfortable:** Strictly, the practice presupposes CKR. Comfortably, it assumes **institutions substitute for epistemic depth**. If only first-order rationality were assumed, design certification would be restricted to Dominant Strategy Implementation (Round 1 only), rendering many "dominance-solvable" mechanisms uncertified.

  The practice ultimately relies on the belief that while humans are not naturally common-knowledge reasoners, well-designed institutions can compel them to act as if they were.

  \answer{Common knowledge of rationality and game structure.}
