      *(Re-evaluating the "Perfect Memory" constraint)*: If memory is perfect, she never misremembers. So empirically, she is consistent. The failure is conceptual. I need to make sure the walkthrough explains that the *conceptual* failure exists despite the *empirical* success.

      *(Two-Person Version)*: If two people compare, they create a public check. But if the sensation is essentially private, how do they compare? They can't. This highlights that privacy blocks the *correction* mechanism essential for meaning.

      *(Final Plan)*:
      1. Scenario (1 paragraph).
