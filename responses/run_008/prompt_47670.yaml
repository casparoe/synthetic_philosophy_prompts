  2.  **Deconstruct the Philosophical Core:**
      *   *The Friend's Position:* The "Memory Objection." Wittgenstein says we can't check if 'S' is used correctly later because we only have memory. If memory is infallible, the check succeeds.
      *   *The User's Position (Standard Wittgensteinian):* Memory isn't the point. The point is the *possibility* of a distinction between *seeming* right and *being* right. Even with perfect memory, who decides what counts as "the same"?
      *   *Key PI Passages:* §258 (the diary case), §202 (private rule following), §265 (the table in the head).
      *   *The Crucial Distinction:* Normativity vs. Causality/Regularity. A machine (or perfect memory) can be regular, but can it be *wrong*?

  3.  **Drafting the Scenario (Constraint Checklist):**
      *   Single diarist.
      *   Perfect memory (no slipping).
      *   Recurring inner state (invariant).
      *   Diary mark 'S'.
      *   No tech.
      *   One paragraph.
      *   Failure must emerge, not be stipulated.

      *Drafting thought:* I need to show that even with perfect memory, the *connection* between the sensation and the sign is the problem. It's not about forgetting the sensation; it's about establishing the *rule* for the sign.
      *Refining:* The scenario needs to highlight the moment of definition. She says "This is S." Later she feels it and writes "S." Memory confirms it matches. But does "matches" mean anything without a practice?

  4.  **Developing the Walkthrough:**
      *   *Where PLA bites:* It's not about storage (memory); it's about the *standard*. In public language ("red"), there's a communal practice correcting usage. In private, even with perfect memory, there is no distinction between "I am disposed to call this S" and "This is correctly S."
      *   *Contrast with "red":* With "red," others can say "That's orange." With "S," no one can correct her, and she cannot correct herself because her impression *is* the standard.
      *   *Feature doing the work:* Normativity. The lack of an independent check on *correctness*, not on *recall*.

  5.  **Addressing the Friend's Counter & Rule-Following:**
      *   Friend says: Perfect memory closes the gap between seeming and being right.
      *   Wittgenstein's Reply (RFC): The gap isn't epistemic (knowing); it's constitutive (what makes it a rule). §202: "It is not possible to obey a rule 'privately'."
      *   Relocation: Yes, it relocates from memory (psychology) to normativity (logic of rules). Is this a retreat? No, it's digging deeper. The fight moves from "Can we trust the record?" to "What makes a record a record of *meaning* rather than just a noise?"

  6.  **The Two-Person Version (Bonus):**
      *   Two diarists, perfect memory, compare notes.
      *   If they agree, does it become public?
      *   If they disagree, how do they settle it?
      *   This isolates "privacy." If two people can't establish a rule without a shared form of life/practice, then privacy isn't the only issue, but it exacerbates the lack of corrective friction. Actually, the key is that *comparison* implies a shared standard. If they just compare "S" and "S", they are still in the boat unless they have a shared practice of using S.

  7.  **Final Verdict:**
      *   Does the perfect-memory diarist survive? No.
      *   Why? Because meaning requires the *possibility* of error, not just the *absence* of forgetting. Perfect memory makes error impossible, which paradoxically makes correctness meaningless. (The "Right/Seeming Right" collapse).
      *   Wittgensteinian Retreat: Move to "Forms of Life" and public criteria.

