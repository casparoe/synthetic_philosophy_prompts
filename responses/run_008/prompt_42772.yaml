prompt: |-
  In the UK and several other European jurisdictions, a woman who carries a pregnancy for others may be a surrogate only on an unpaid basis: she may be reimbursed for expenses and, at most, some lost earnings, the contract is unenforceable, and any outright payment beyond that risks the refusal of a parental order. Yet the same jurisdictions routinely allow fertility clinics to pay egg donors a fixed per-cycle 'compensation' — a sum that, whatever the label, functions as a price for time, discomfort, and medical risk, and that these systems regulate rather than prohibit. I have two questions about what this pattern presupposes. First, what implicit theory of the body, of commodification, and of exploitation must be in place for the two rules to sit side by side — is it something like the Titmuss thought that money degrades gift relationships, applied selectively to gestation but not to gametes; or a view that a surrogate would be selling a child whereas an egg donor is only selling tissue; or a worry that payment exploits the surrogate's economic vulnerability, which would underwrite the ban on payment but not the permission of the unpaid, medically risky arrangement? Second, a colleague of mine insists the whole asymmetry can be saved by distinguishing indemnification from remuneration: the law tolerates making a surrogate whole for her ordeal but never paying her for a service, and the egg donor's compensation is just the same indemnification. I suspect this moves the problem rather than solving it, but I want the objection pressed properly. Please reconstruct the implicit theory the expenses-only regime actually rests on, say whether that theory is internally consistent once egg-donor payments are taken into account or whether the practice is instead philosophically underdetermined — compatible with several theories none of which it requires — and tell me concretely what would have to change in either the surrogacy rule or the egg-donation rule if the presupposed theory were made consistent. Close your reply with a line beginning 'Verdict:', in one sentence, stating whether the asymmetry can be defended without abandoning one of the two rules.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The legal and ethical asymmetry between unpaid surrogacy (expenses only) and paid egg donation (fixed compensation) in the UK/Europe.
      *   **Core Question 1:** What implicit theory of the body, commodification, and exploitation underpins this asymmetry? (Is it Titmuss/gift vs. market? Child vs. tissue? Vulnerability/exploitation?)
      *   **Core Question 2:** Evaluate the colleague's argument (indemnification vs. remuneration). Does this distinction save the asymmetry or just move the problem?
      *   **Task:** Reconstruct the implicit theory, assess its internal consistency given egg donation practices, determine if it's underdetermined, and specify what would need to change to make it consistent.
      *   **Constraint:** Close with a line beginning 'Verdict:', in one sentence, stating whether the asymmetry can be defended without abandoning one of the two rules.

  2.  **Deconstruct the Legal/Ethical Landscape:**
      *   *Surrogacy (UK):* Surrogacy Arrangements Act 1985, Human Fertilisation and Embryology Act 1990/2008. Commercial surrogacy is illegal. Surrogates can receive "reasonable expenses." Parental orders transfer legal parenthood.
      *   *Egg Donation (UK):* Regulated by HFEA. Donors can receive £750 per cycle (fixed rate). This is framed as "compensation" for time/inconvenience, not payment for gametes.
      *   *The Tension:* Both involve bodily intrusion, medical risk, and time. One is strictly altruistic (surrogacy), the other is incentivized (egg donation).

  3.  **Address Question 1: The Implicit Theory:**
      *   *Commodification of the Child:* The strongest argument against paid surrogacy is that it looks like buying a baby. The surrogate carries the *potential child*. Paying her looks like paying for the product. Egg donation is tissue (gametes), not a formed life.
      *   *Relational/Gestational Bond:* Gestation creates a unique physical and psychological bond. Turning *that* specific relationship into a service contract is seen as more dehumanizing than providing genetic material.
      *   *Exploitation/Vulnerability:* Surrogacy requires a long-term commitment (9 months), significant lifestyle changes, and higher physical risk. The fear is that poor women would be coerced by high sums. Egg donation is shorter, less invasive (relatively), and the fixed fee is lower, reducing the coercive potential (arguably).
      *   *Titmuss/Gift:* There is an element of this. Surrogacy is framed as a "gift of life" (altruistic). Egg donation is also framed as altruistic, but the "compensation" acknowledges the burden more explicitly.
      *   *Synthesis:* The implicit theory is likely a hybrid: **The "Non-Commodification of Personhood" theory combined with a "Gradient of Bodily Intrusion."** It posits that gestation is constitutive of personhood/parentage in a way gamete provision is not. Therefore, gestation must remain in the "gift sphere" to prevent the child from becoming a commodity, whereas gametes can be in a "regulated market sphere" because they are biological material, not a relationship.

  4.  **Address Question 2: The Colleague's Argument (Indemnification vs. Remuneration):**
      *   *The Claim:* Surrogate expenses = indemnification (making whole). Egg donor compensation = indemnification (making whole). Therefore, they are the same.
      *   *The Counter:* Egg donor compensation is *fixed* (£750/cycle) regardless of actual lost earnings or specific expenses. It is standardized. Surrogate expenses are *receipt-based* and variable.
      *   *The Problem:* If egg donor money is truly indemnification, it should vary by individual loss. Since it's a flat rate, it functions as a price signal (remuneration). If surrogate money is truly indemnification, why is it capped or scrutinized so heavily compared to the flat rate for donors?
      *   *Conclusion:* The distinction collapses under scrutiny. The egg donor payment *is* remuneration disguised as indemnification to fit the legal framework.

  5.  **Assess Internal Consistency:**
      *   Is the system consistent? No.
      *   Why? If the goal is to prevent commodification of the body, egg donation payments commodify reproductive tissue. If the goal is to prevent exploitation, unpaid surrogacy exploits women's altruism while paid egg donation acknowledges labor.
      *   Is it underdetermined? Yes. It tries to satisfy too many conflicting moral intuitions (protect the child, respect the woman's labor, prevent a market, ensure supply of donors).
      *   What needs to change for consistency?
          *   *Option A (Strict Altruism):* Ban payment for egg donors. Make it pure expenses/lost earnings only.
          *   *Option B (Regulated Market):* Allow reasonable remuneration for surrogates (beyond expenses), acknowledging the labor involved, similar to egg donors.
          *   *Option C (Child Focus):* Argue gestation creates parenthood, gametes don't. Maintain asymmetry but clarify the "child vs. tissue" distinction explicitly (but this still struggles with the bodily risk element).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the question. It's a classic bioethics puzzle.
      *   *Reconstructing the Theory:* Focus on the "Child vs. Tissue" distinction and the "Gestational Labour" distinction. The law treats the womb as a sanctuary that cannot be rented, but the ovaries as a resource that can be incentivized. It relies on a **Status vs. Contract** distinction (Maine). Surrogacy touches on the status of the child/mother; egg donation touches on biological supply.
      *   *Evaluating the Colleague:* The "indemnification" argument fails because of the *fixed* nature of donor compensation. It's a price, not a reimbursement.
      *   *Consistency Check:* The current regime is philosophically underdetermined. It's a pragmatic compromise, not a coherent ethical system. It wants the supply of eggs (hence payment) but fears the supply of babies (hence no payment).
      *   *Required Changes:* To be consistent, either surrogates get paid (labor model) or egg donors get only expenses (pure gift model).
      *   *Verdict:* Needs to be punchy and direct.

  7.  **Refining the "Verdict":**
      *   Draft 1: Verdict: The asymmetry cannot be defended without changing one of the rules. (Too simple)
      *   Draft 2: Verdict: The asymmetry is indefensible because the distinction between tissue and gestation does not hold up under scrutiny regarding bodily risk. (A bit long)
      *   Draft 3: Verdict: The asymmetry cannot be coherently defended without abandoning either the ban on surrogate remuneration or the fixed compensation model for egg donors. (Better)
      *   *Constraint Check:* Must start with 'Verdict:' and be one sentence.

  8.  **Final Polish:** Ensure the tone is analytical and philosophical. Use terms like "commodification," "altruism," "indemnification," "ontological status." Make sure to explicitly answer the "what would have to change" part.

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's inconsistent." I need to explain *why* the specific theory (e.g., child commodification) fails when applied to egg donation (tissue commodification). The key is that the law pretends egg donation isn't commodification, but it functionally is. The surrogacy law admits commodification is bad. So they conflict.

      *Revised Plan for "Implicit Theory":* The theory is **"The Graduated Sanctity of Reproductive Capacity."** It holds that genetic material is separable from the self (can be compensated), but gestational capacity is constitutive of the self/relationship (must be gifted).
      *Revised Plan for "Colleague's Objection":* The fixed rate proves it's remuneration. Indemnification is individual; remuneration is standardized.
      *Revised Plan for "Consistency":* It is underdetermined. To fix: Either pay surrogates (labor view) or stop paying donors (gift view).

  9.  **Final Review against constraints:**
      *   Reconstruct implicit theory? Yes.
      *   Say if internally consistent? Yes.
      *   Tell what would have to change? Yes.
      *   Close with 'Verdict:' line? Yes.
      *   One sentence verdict? Yes.

      *Let's write it.*
answer: |-
  The implicit theory underpinning the UK and European asymmetry is a hybrid of **ontological distinction** and **relational commodification**. It presupposes that gametes are biological *tissue* separable from the person, whereas gestation is a *relational process* constitutive of parenthood. Under this view, paying for eggs is permissible because it compensates for the medical procedure and loss of tissue without purchasing a person, whereas paying a surrogate is prohibited because it risks converting the child into a product of contract rather than a subject of gift. This relies on a specific interpretation of exploitation: that the surrogate's long-term physical and emotional entanglement makes her uniquely vulnerable to coercive pricing in a way the egg donor, undergoing a short-term medical procedure, is not. Consequently, the law treats the womb as a sanctuary that must remain outside the market to preserve the moral status of the child, while treating the ovaries as a resource bank that requires market-like incentives to ensure supply.

  Your colleague's distinction between indemnification and remuneration collapses under the weight of the regulatory mechanics. True indemnification is restorative and individualized, covering actual loss; however, egg donor compensation is a fixed tariff (£750 per cycle in the UK) paid regardless of actual lost earnings or specific discomfort, which functions economically as a price signal (remuneration) rather than a reimbursement. By contrast, surrogate expenses are scrutinized for reasonableness and tied to receipts. If the theory were that *all* reproductive labor must be purely altruistic to prevent commodification, egg donors should receive only verified expenses. If the theory were that *all* reproductive labor involves burden deserving of standardized compensation, surrogates should receive a fixed fee for their time and risk. The current system attempts to hold both views simultaneously: it acknowledges the burden on egg donors with a flat fee while denying the same recognition to surrogates to avoid the appearance of baby-selling.

  This makes the practice philosophically underdetermined rather than internally consistent. It is a pragmatic compromise designed to secure egg supply while mitigating political anxiety over "renting wombs," rather than a coherent ethical framework. To make the presupposed theory consistent, one of two concrete changes would be required. Either the egg donation model must be purged of fixed tariffs, restricting donors to verified expenses and lost earnings to align with the strict non-commodification principle of surrogacy; or the surrogacy model must be reformed to allow standardized remuneration for gestational labor, acknowledging that if paying for ovarian stimulation is not exploitative commodification, paying for nine months of gestational risk should not be either.

  Verdict: The asymmetry cannot be coherently defended without abandoning either the ban on surrogate remuneration or the fixed compensation model for egg donors.
