answer: |-
  We, the undersigned, commit this document to paper as a record of our shared understanding and our precise points of divergence regarding the interpretation of unitary quantum mechanics. We have argued this case for years, often talking past one another, and we now seek to establish a common foundation from which our disagreement can be productively tested. This letter serves as the starting point for our adversarial collaboration, setting out the claims we both accept, the specific nature of our dispute, and the conditions under which we would each concede our position. We intend this to be a living document, binding us to the arguments rather than to our current convictions, and we agree that if the predictions recorded herein fail, the signatory is committed to moving their position accordingly.

  We begin with our shared ontology. We both accept that the quantum state is a real, physical object and that its evolution is strictly unitary. There is no collapse of the wavefunction, no hidden variables, and no additional physical dynamics beyond the Schrödinger equation. We agree that the appearance of definite outcomes is explained by decoherence, which dynamically separates components of the wavefunction into effectively non-interacting branches. These branches are not merely epistemic conveniences but reflect an objective structure in the physical world, wherein multiple macroscopic histories coexist. Consequently, we both regard the measurement problem as partially solved. The problem of definite outcomes is resolved by the relativity of states to observers within branches, rendering the question of why we see one outcome rather than a superposition a category error. However, we agree that the probability problem remains deferred. While the formalism predicts branching, it does not, on its face, predict the statistical frequencies observed in experiments, specifically the squared amplitude weights known as the Born rule.

  We further agree on what does not work. Naive branch counting is rejected by both parties. We accept that counting the number of branches to determine probability is incoherent because the definition of a branch is basis-dependent and continuous. Decoherence does not produce a discrete integer number of worlds that can be tallied; rather, it produces a continuous decomposition of the wavefunction where the number of branches depends on the granularity of the decoherence basis. Therefore, any account of probability that relies on counting distinct outcomes without weighting them by amplitude is physically unmotivated and mathematically ill-defined. We also agree that the observed statistics of quantum experiments are robust and must be accounted for by any viable interpretation. The dispute is not about the data but about the theoretical status of the rule that connects the formalism to that data.

  Our disagreement concerns the origin and justification of the Born rule within this branching ontology. One of us holds that the Born rule can be derived from the formalism of unitary quantum mechanics combined with principles of rational decision theory. On this view, an agent who knows the quantum state and accepts the reality of branching is rationally compelled to act as if the Born weights are probabilities. The derivation proceeds by establishing axioms of rational behaviour, such as ordering, continuity, and specifically branching indifference, which state that an agent should not care about the mere fact of branching itself, only about the rewards their successors receive. If these axioms are accepted as requirements of rationality, the Born rule follows as a theorem. The other of us holds that probability must be postulated as an additional physical law or primitive norm. On this view, a deterministic theory in which every outcome occurs leaves nothing genuinely uncertain for the agent prior to measurement. Since probability requires uncertainty, and branching eliminates objective uncertainty, the decision-theoretic axioms that purport to derive the Born rule are smuggling probabilistic assumptions into the premises. For this party, rationality cannot create probability out of certainty, and the Born rule must be added to the theory by hand to recover the observed statistics.

  The first crux of our dispute lies in the status of the decision-theoretic axioms, particularly branching indifference and diachronic consistency. The proponent of derivation argues that these are normative requirements for any agent who wishes to maximise expected utility across their future successors. To care about the number of branches rather than the weights is argued to be irrational, akin to caring about the description of a bet rather than the payoff. The proponent of postulation argues that these axioms are not neutral norms of rationality but are themselves physical claims disguised as logic. Specifically, the claim that an agent should be indifferent to branching structure unless it affects payoff is argued to presuppose that the branch weight is the only thing that matters, which is precisely what is being proved. We agree to test this by examining whether a toy agent who counts branches rather than weighting them by squared amplitude can be shown to violate a norm of rationality that both sides independently endorse. If such an agent can be constructed who is dynamically stable and evolutionarily successful despite violating branching indifference, the derivation proponent will concede that the axioms are not universal norms. Conversely, if it can be shown that branch-counting leads to guaranteed losses in betting scenarios across the multiverse, the postulation proponent will concede that rationality constrains the weights.

  The second crux concerns the availability of self-locating uncertainty. The derivation proponent argues that an agent prior to measurement faces genuine uncertainty about which branch they will find themselves in, even if they know all outcomes occur. This is analogous to a duplication experiment where an agent is copied; upon waking, the copies are uncertain about which one they are. This self-locating uncertainty provides the necessary gap for probability to enter. The postulation proponent argues that this analogy fails because quantum branching is deterministic and known. In a duplication scenario, there is objective chance about the outcome of the copying process or the environment, but in unitary quantum mechanics, the agent knows with certainty that they will have successors on every branch. Therefore, there is no epistemic gap for uncertainty to fill, and any appeal to self-locating uncertainty is a confusion of subjective ignorance with objective chance. We agree that the resolution of this crux depends on whether a rigorous definition of self-locating uncertainty can be formulated in a fully deterministic context that yields non-trivial probabilities. If a formalism is produced that derives subjective uncertainty from deterministic branching without circularity, the postulation proponent will move towards the derivation view. If it is proven that self-locating uncertainty in this context is logically incoherent, the derivation proponent will accept that probability must be postulated.

  The third crux involves the inexactness and decoherence-relativity of the branching structure itself. The derivation programme relies on treating branches as distinct outcomes for the purpose of decision theory. However, decoherence is a matter of degree, and the boundaries between branches are fuzzy. The postulation proponent argues that a theorem derived from exact mathematical premises cannot hold when the underlying structure is approximate and context-dependent. If the branches are not sharp, the decision-theoretic proof loses its rigour. The derivation proponent argues that approximate branching is sufficient for practical rationality, just as approximate classical states are sufficient for everyday decision-making. We agree that this bears on the robustness of the derivation. If it can be shown that small changes in the decoherence threshold lead to large changes in the derived probabilities, the derivation proponent will concede that the theorem is physically unstable. If it can be shown that the decision-theoretic results are robust against variations in the decoherence basis, the postulation proponent will accept that the fuzziness is not a fatal objection.

  We also acknowledge a potential verbal dispute regarding the definition of probability. One of us may be using the term to refer to objective chance, while the other uses it to refer to degree of belief. If it turns out that the derivation successfully accounts for degree of belief but not objective chance, or vice versa, we agree to clarify whether the dispute is substantive or merely semantic. However, we both insist that whatever probability is, it must recover the Born rule statistics in the limit of many trials. If the derivation yields the correct betting behaviour but fails to explain why the frequencies match the weights in the world, the derivation proponent will accept that the account is incomplete. If the postulation yields the frequencies but fails to explain why agents should care about them, the postulation proponent will accept that the account is psychologically inert.

  We record our predictions in advance to hold ourselves accountable. The derivation proponent predicts that a coherent model of rational agency in a branching universe will necessarily converge on the Born rule, and that any agent violating this will be susceptible to Dutch books or dynamic inconsistency. The postulation proponent predicts that such a model will either fail to constrain the weights or will require probabilistic premises to function. Furthermore, the derivation proponent predicts that self-locating uncertainty will be successfully formalised in deterministic contexts, while the postulation proponent predicts that such formalisations will rely on hidden probabilistic assumptions. We agree to revisit this document in five years. If the consensus of the relevant physics and philosophy community has shifted decisively towards one side based on the arguments outlined above, or if a specific technical result resolves one of the cruxes in favour of one party, the losing party commits to updating their public position accordingly. We sign this not because we expect to agree soon, but because we agree on how to disagree productively.

  Signed,

  The Proponent of Derivation

  The Proponent of Postulation
