answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on a diagnosis, let us lay out the conceptual terrain. The phenomenon you describe sits at the intersection of several distinct but overlapping mechanisms in social epistemology and economics.

  1.  **Informational Cascades (Bikhchandani, Hirshleifer, Welch):** This is your friend's suggestion. Individuals ignore their private information (reviews, personal judgment) to follow the public history of actions (the queue). *Fit:* High. *Mismatch:* As you noted, canonical cascades are theoretically fragile to the release of precise public information.
  2.  **Herding (Banerjee; Welch):** Often used interchangeably with cascades, but technically distinct. Herding implies individuals are making the *same* choice, but not necessarily ignoring private information; they might just have correlated signals. *Fit:* Medium. It describes the outcome, not the epistemic error.
  3.  **Social Proof (Cialdini):** A psychological heuristic where uncertainty leads individuals to copy others. *Fit:* High descriptively, but lacks the formal mechanism regarding *signal weight* and *fragility* that you are probing.
  4.  **Path Dependence / Increasing Returns (Arthur; David):** The idea that early historical accidents lock in a superior or inferior standard (e.g., QWERTY keyboards). *Fit:* High for the *outcome* (the mediocre restaurant survives), but this is a macro-structural description, not a micro-epistemic one.
  5.  **Network Externalities / Bandwagon Effects:** Utility increases as more people adopt (e.g., a phone is useful because others have one). *Fit:* Low. You do not enjoy the pasta *more* because others are eating it; you only *believe* it is better. This is an epistemic effect, not a utility effect.
  6.  **Anchoring (Tversky & Kahneman):** Relying too heavily on the first piece of information offered (the first speaker in the panel). *Fit:* High for the interview panel example, less so for the restaurant queue.
  7.  **Reputational Cascades (Kuran; Scharfstein & Stein):** People conform publicly to avoid sanction, while privately disagreeing. *Fit:* Low. Restaurant customers are anonymous; they genuinely seem to believe the food is good.

  ### The Diagnosis: An Endogenous Signal Cascade

  You are correct to be unsatisfied with your friend's explanation. He has correctly identified the genus (**Informational Cascade**) but misidentified the species' resilience. In the canonical 1992 model, a cascade is indeed fragile: if a public signal (like a reliable review aggregate) contradicts the herd, the cascade should shatter because the public signal is common knowledge, whereas the herd's actions are only inferred private signals.

  However, your restaurant example introduces a critical variation: **The signal is endogenous and continuous.**

  In the standard model, the "herd" is a history of past actions. In your case, the "queue" is a *current, visible stock* of actions. It is not just a record of the past; it is a live, updating signal that competes directly with the reviews. Because the queue is a measure of **revealed preference** (people voting with their feet and money) and the reviews are **stated preference** (people typing on phones), rational agents often weight the queue higher. The crowd treats the queue not merely as "others followed others," but as "others possess aggregated private information that outweighs these reviews."

  Because the queue grows *because* people join it, the signal strength increases over time, effectively drowning out the static public information (the reviews).

  There is no single, canonical noun phrase in the literature that captures *exactly* this configuration (noise start + endogenous signal + resistance to public data). Economists might call this a **"Spurious Informational Cascade with Endogenous Signaling."** Sociologists might call it **"Cumulative Advantage."**

  However, to carve the terrain precisely as you requested, I propose we term this:

  ## **The Spurious Consensus Lock-In**

  ### Definition and Commitments
  A **Spurious Consensus Lock-In** occurs when:
  1.  **Noise Initiation:** A collective behavior begins due to a random shock or transient condition (the festival fortnight) rather than genuine private information about quality.
  2.  **Epistemic Misattribution:** Observers interpret the behavior of the crowd as a signal of underlying quality (aggregated private information) rather than recognizing it as a reaction to the transient shock.
  3.  **Endogenous Reinforcement:** The behavior itself generates a visible signal (the queue length) that grows stronger as more people participate, creating a feedback loop where the *size* of the consensus is mistaken for the *strength* of the evidence.
  4.  **Public Information Resistance:** The belief persists despite the availability of contradictory public data (reviews), because the endogenous signal (the queue) is weighted as more reliable (revealed preference) than the exogenous data (stated preference).

  ### Boundary Cases and Nearest Relatives

  To understand what this concept commits us to, we must distinguish it from its nearest neighbors.

  **1. Vs. Standard Informational Cascade**
  *   **Similarity:** Both involve ignoring private signals to follow public actions.
  *   **Difference:** A standard cascade is **fragile**. If a reliable public signal is released (e.g., "The health department closed the busy restaurant"), the cascade unwinds immediately. A *Spurious Consensus Lock-In* is **robust**. The endogenous signal (the queue) updates continuously and can absorb or outweigh static public negative information. The crowd treats the queue as *more* informative than the reviews.
  *   **Commitment:** We commit to the idea that the signal source is *internal* to the herd's behavior, not external.

  **2. Vs. Plain Conformity (Normative Social Influence)**
  *   **Similarity:** People do what others do.
  *   **Difference:** Conformity is driven by a desire for social acceptance or fear of sanction (e.g., laughing at a joke you didn't understand). In a *Lock-In*, the agents are acting on **epistemic inference**. They genuinely believe the pasta is better. They are not trying to fit in; they are trying to eat well.
  *   **Commitment:** We commit to the agents being *rationally mistaken*, not socially pressured.

  **3. Vs. Self-Fulfilling Prophecy**
  *   **Similarity:** A belief brings about its own truth.
  *   **Difference:** A self-fulfilling prophecy usually refers to the *outcome* (e.g., "People think the bank is insolvent, so they run, so the bank becomes insolvent"). In your restaurant case, the prophecy is **epistemic**, not ontological. The restaurant does not become *objectively* better because of the queue; it only becomes *reputedly* better. The quality remains mediocre, but the belief in quality is sustained.
  *   **Commitment:** We commit to a divergence between *perceived quality* and *actual quality*, whereas SFP often implies the belief creates the reality.

  **4. Vs. Path Dependence (The QWERTY Effect)**
  *   **Similarity:** Early accidents determine long-term outcomes.
  *   **Difference:** Path dependence is a macro-structural description of *history*. *Spurious Consensus Lock-In* is the micro-epistemic mechanism *explaining* that history. Path dependence tells you *that* the mediocre restaurant won; Lock-In tells you *why* the customers keep choosing it.
  *   **Commitment:** We commit to an explanation rooted in individual inference, not just systemic inertia.

  ### The Restaurant vs. The Interview Panel

  You asked whether your restaurant example is the same phenomenon as the interview panel. **They are not the same mechanism, though they produce similar outcomes.**

  *   **The Restaurant (Spurious Consensus Lock-In):** This is **Observational Learning**. The agents are anonymous and sequential. They are inferring quality from the *revealed preferences* of strangers. The mechanism is epistemic (inferring truth).
  *   **The Interview Panel (Anchoring + Reputational Cascade):** This is **Social Coordination**. The first speaker sets an **Anchor** (a cognitive bias where subsequent judgments are biased toward the initial value). Furthermore, later panelists may fear the reputational cost of contradicting the first speaker without overwhelming evidence. This is closer to a **Reputational Cascade** (Scharfstein & Stein), where agents ignore private signals to protect their professional standing, rather than to find the truth.

  **Why the distinction matters:**
  If you disrupt the restaurant queue (e.g., by paying people to leave), the Lock-In may break because the *signal* is removed. If you disrupt the interview panel (e.g., by making votes anonymous), the Anchoring may persist because it is cognitive, but the Reputational Cascade would vanish. The restaurant is a failure of **inference**; the panel is a failure of **incentives and cognition**.

  ### Summary

  Your friend is half-right: it is a cascade. But he is wrong about the fragility. The phenomenon you are observing is a **Spurious Consensus Lock-In**: a noise-initiated informational cascade where the herd's behavior generates an endogenous signal (the queue) that is weighted more heavily than exogenous public evidence (reviews).

  It differs from standard cascades because it is self-reinforcing rather than fragile; from conformity because it is epistemic rather than normative; and from the interview panel because it relies on observational learning rather than anchoring and reputational pressure. It is a specific, robust failure mode of social learning where the crowd mistakes its own momentum for wisdom.
