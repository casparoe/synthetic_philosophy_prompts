      *   *Claim 4: $7 \times 8 = 56$ vs. $57$.*
          *   **Analysis:** This touches on necessity vs. convention. Even if numbers are mental constructs or social agreements, within the *system* of arithmetic, $7 \times 8 = 56$ is necessary. Changing it breaks the system.

  3.  **Address the "Teaching Arithmetic" Aspect:**
      *   Why teach it as fact? Because it works. Engineering, science, and daily life rely on the consistency of mathematics. Whether numbers are "real" in a metaphysical sense doesn't change their utility or internal truth conditions.
      *   Analogy: Chess. The rules of chess aren't "laws of the universe," but within chess, a knight *must* move in an L-shape. You can't teach a kid to play chess saying "the knight moves straight sometimes."

