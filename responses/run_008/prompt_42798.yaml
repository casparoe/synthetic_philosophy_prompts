      *   *Claim 2: Saying "numbers exist" is like saying "the average taxpayer exists."*
          *   **Analysis:** This is a specific philosophical stance (Fictionalism or perhaps Quinean instrumentalism). It treats mathematical statements as useful fictions.
      *   *Claim 3: The "old worry" (Access Problem).*
