          *   Could $7 \times 8 = 57$? No. Because "7", "8", "56", and "$\times$" are defined by relationships. If you change the result, you aren't doing arithmetic anymore; you're playing a different game.
          *   Why teach as fact? Because the *relationships* are stable and necessary for navigating the physical world, regardless of the metaphysical status of numbers.

