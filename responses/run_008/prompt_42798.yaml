answer: |-
  You are asking a question that cuts right to the heart of the philosophy of mathematics. It is not a dumb question at all. In fact, it is one of the oldest and deepest questions in the field.

  The short answer is: **Your friend's husband is presenting one side of a heated, ongoing debate as if it were a settled fact.** It is not settled. While the view he described (that numbers are useful fictions) is respected and widely held, the opposing view (that numbers are real, abstract objects) is equally respected and widely held.

  Here is the breakdown of what is settled, what is still fought over, and why we teach arithmetic the way we do regardless of the answer.

  ### 1. Is it settled that numbers don't exist?
  **Status: Live Debate (Not Settled)**

  Your friend's husband is describing a view called **Mathematical Fictionalism** (or sometimes Nominalism). This view holds that mathematical statements are like statements about a novel: "Sherlock Holmes lived on Baker Street" is true *in the story*, but Holmes doesn't exist in reality. Similarly, "7 × 8 = 56" is true *in the story of mathematics*, but numbers don't exist outside that story.

  However, the opposing view, **Mathematical Platonism** (or Realism), is still very much alive. Platonists argue that numbers are "abstract objects." They don't exist in space and time (you can't trip over them), but they exist independently of human minds, much like the laws of logic or the concept of "justice."

  **The Data:** In a major 2020 survey of professional philosophers (the PhilPapers Survey), about **43%** leaned toward Platonism (numbers are real), while about **39%** leaned toward Anti-Realism (numbers are not real). The rest were undecided or took other views.
  *   **Verdict:** There is no consensus. The "no-numbers" team has not won. It is roughly a tie among the experts.

  ### 2. The "Average Taxpayer" and the "Skull" Worry
  **Status: Strong Arguments on Both Sides**

  Your friend mentioned two specific arguments. It is helpful to know what they are called so you can see they are counters, not knock-out punches.

  *   **The "Average Taxpayer" Analogy:** This argues that numbers are just shorthand for physical things.
      *   *The Counter-Argument:* The "Indispensability Argument." Philosophers like W.V.O. Quine argued that we believe in electrons because our best physics says they exist. But physics is written in the language of mathematics. If you believe in electrons, you have to believe in the numbers used to describe them. You can't keep the science and throw away the math.
  *   **The "Skull" Worry (The Access Problem):** This is a famous objection raised by philosopher Paul Benacerraf in 1973. He asked: If numbers exist outside space and time, how do our physical brains (which are inside space and time) interact with them? It seems like magic.
      *   *The Counter-Argument:* Platonists reply that we don't need physical contact to know things. We don't "touch" the law of gravity; we observe its effects. Similarly, we might not touch the number 7, but we observe its relationships in the physical world (7 apples, 7 stars). Others argue that mathematical knowledge is rational, not empirical—we grasp it through reasoning, not sensory contact.

  ### 3. Why do we teach arithmetic as fact?
  **Status: Settled (Pedagogically and Practically)**

  This is where your confusion about the math teacher comes in. You are asking an *ontological* question (what exists?), but the teacher is answering a *functional* question (what works?).

  Even if the Fictionalists are right and numbers are "made up," **the rules of the game are rigid.**

  Think of it like Chess.
  *   **Do Knights exist?** No. They are carved wood or digital pixels.
  *   **Is it true that a Knight moves in an 'L' shape?** Yes. Absolutely.
  *   **Could we have agreed that a Knight moves straight?** We could have invented a *different game*, but it wouldn't be Chess anymore.

  If you tell a child, "The Knight moves straight," they will lose every game they play against anyone else. The *existence* of the Knight is debatable; the *rules* governing the Knight are fixed.

  **Regarding $7 \times 8 = 56$:**
  Even if numbers are just habits or agreements, they are agreements about **relationships**.
  *   "7" is defined as the successor of 6.
  *   "Multiplication" is defined as repeated addition.
  *   Therefore, $7 \times 8$ is defined as adding 8 to itself 7 times.
  *   If you count that out, you get 56.

  If you say $7 \times 8 = 57$, you aren't proposing a "different habit." You are breaking the internal logic of the system. You could invent a system where that symbol string equals 57, but it wouldn't connect to the physical world (counting apples, building bridges, coding computers) the way standard arithmetic does.

  We teach it as fact because **the relationships are necessary.** Whether those relationships exist in a heavenly realm (Platonism) or in the structure of human logic (Fictionalism), the result is the same: if you want to build a bridge that doesn't collapse, you must act *as if* $7 \times 8 = 56$.

  ### 4. Why did the teacher look at you like you were crazy?
  **Status: Context Mismatch**

  The teacher wasn't dismissing your intelligence; they were protecting the lesson plan.
  *   **In a Philosophy Seminar:** Your question is brilliant and necessary.
  *   **In a 3rd Grade Classroom:** Your question is paralyzing.

  To learn math, a child must accept the axioms (the starting rules) to build fluency. If a student stops to question the metaphysical status of every integer, they will never learn to calculate. The teacher's job is to teach the student how to use the tool, not to debate the origin of the steel the tool is made from.

  ### Summary
  1.  **Is it settled that numbers don't exist?** No. It is a roughly 50/50 split among professional philosophers. Your friend's husband spoke with more certainty than the field possesses.
  2.  **Is $7 \times 8 = 56$ a fact?** Yes. It is a "necessary truth." Even if numbers are fictional, it is *true within the fiction*, and that fiction is the only one that successfully maps onto the physical universe.
  3.  **Could it have been 57?** No. Not unless you change the definitions of "7", "8", "multiply", or "56." If you do that, you aren't doing arithmetic anymore; you're speaking a different language.
  4.  **Why teach it as fact?** Because the consistency of math is reliable regardless of its metaphysical status. We teach navigation without debating whether "North" is a physical object or a directional convention.

  You aren't missing anything basic. You actually stumbled into a graduate-level philosophical debate at a barbecue. The only thing you missed is that the debate is far from over.
