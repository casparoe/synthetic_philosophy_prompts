          *   *Other views:* Structuralism, Naturalism.
          *   *Key Takeaway:* It's a live fight, not a finished war.

      *   **Section 2: The "Average Taxpayer" Analogy:**
          *   Explain what the friend meant (Fictionalism).
          *   Explain the counter-argument: Math is different from statistics. "The average taxpayer" is a shorthand for a calculation about real people. "7" seems to apply to *anything* (7 apples, 7 stars).
          *   The "Indispensability Argument" (Quine/Putnam): We need numbers for our best science. If electrons exist (science says so), and science uses numbers essentially, maybe numbers exist too.

      *   **Section 3: The "Access Problem" (The Skull Worry):**
          *   Explain Benacerraf's challenge clearly.
