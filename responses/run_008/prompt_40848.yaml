answer: |-
  Here is my assessment, running the numbers on the current dialectical landscape. I will adopt the persona of a colleague evaluating the state of play, because you asked for a derivation, not a disclaimer.

  **My Bottom Line Credence in Sparse Universals: 0.45**

  I am slightly more skeptical than you. I think the "sane middle ground" is actually a high-wire act that requires balancing two heavy burdens: the mystery of immanence (how one thing is in many places) and the mystery of structure (how complex properties compose). Resemblance nominalism is ugly, but Armstrong's universals are mysterious in a way that sometimes looks like disguised magic.

  Here is the decomposition. I have adjusted your probabilities based on where I think the literature has moved in the last decade (specifically regarding grounding and structural realism).

  ### The Decomposition

  **1. The One-Over-Many demand is a genuine datum (not grammar).**
  *   **My Number:** 0.65
  *   **Reasoning:** I am higher than you here. The "grammar conning us" line (à la Wittgenstein or deflationists) has lost steam because it fails to account for the *projectibility* of predicates. We don't just say "red"; we say "red" because it supports counterfactuals and induction. Deflationism explains the truth conditions of "a is F," but it struggles to explain the *success* of the practice without smuggling in a realist commitment. The datum isn't the sentence; it's the inductive success.

  **2. Resemblance nominalism can survive the degrees/imperfect community problems.**
  *   **My Number:** 0.25
  *   **Reasoning:** I am lower than you. Rodriguez-Pereyra's work tightened the ship, but the cost was making "resemblance" a primitive that does heavy lifting. The problem isn't just that it's primitive; it's that it's *ungrounded*. If $a$ resembles $b$, and $b$ resembles $c$, but $a$ does not resemble $c$ (in the relevant respect), the nominalist must stipulate a specific respect. But specifying the respect looks suspiciously like specifying the universal. The "matching without sharing" line works only if you are willing to accept brute modal connections between distinct particulars. That is a high ideological cost.

  **3. Structural universals don't sink the ship.**
  *   **My Number:** 0.40
  *   **Reasoning:** I am lower than you. This is the realist's Achilles' heel. Lewis's argument that structural universals collapse into sets of simpler universals (or require mereological essentialism that contradicts immanence) remains largely unanswered. Armstrong's "partial identity" is an intuition pump, not a mechanism. If methane requires a universal *being-methane* that is distinct from the universals *carbon* and *hydrogen* arranged thus-and-so, we have proliferation. If it is *built* of them, we have the problem of how a universal can be a part of another universal without losing its "one-over-many" status. This is where parsimony turns ugly for the realist.

  **4. The dispute isn't merely verbal.**
  *   **My Number:** 0.85
  *   **Reasoning:** I am higher than you. Quantifier variance is a dead end here. The dispute is about *grounding*. The realist claims the resemblance facts hold *in virtue of* the universal facts. The nominalist claims the universal-talk is true *in virtue of* the resemblance facts. This is a substantive disagreement about the direction of metaphysical explanation, not just what the word "exists" means. If it were merely verbal, we couldn't argue about which explanation is better. We do argue about that. Therefore, it's substantive.

  **5. Science would need them.**
  *   **My Number:** 0.35
  *   **Reasoning:** I am significantly lower than you. This is the biggest divergence. You suspect physics forces realism. I suspect physics forces *structuralism*. A finished physics likely describes fields, symmetries, and relations. It is not clear that a symmetry group requires an Aristotelian universal inhering in a substance. It might require a mathematical structure that nominalists can paraphrase (à la Hartry Field, though difficult) or, more likely, a ontology of tropes or processes. The "quantities" argument is strong, but quantities look more like determinables/determinates which strain the universal model (is *mass* one universal or infinitely many?). Science is pushing towards ontology where "shared features" is the wrong category entirely.

  ---

  ### Sensitivity Analysis

  **Which premise drives the bottom line?**
  My credence is most sensitive to **Premise 5 (Science)**.
  If you convince me that fundamental physics *cannot* be formulated without commitment to genuinely shared, immanent properties (not just mathematical structures), my credence jumps from 0.45 to 0.75 instantly. The metaphysical arguments (1–4) are largely stalemates of intuition vs. parsimony. The scientific indispensability argument is the only external anchor.

  **What would move it?**
  Not an argument, but a **case study**.
  We need a specific example from fundamental physics where a nominalistic paraphrase fails *explanatorily*, not just syntactically.
  *   *Example:* If you can show that explaining quantum entanglement or gauge invariance *requires* literal identity across spacetime regions (not just structural isomorphism), that breaks the nominalist back.
  *   *Current State:* Most physicists are happy with structural realism, which bypasses the universal/nominalist divide. That's why my number on Q5 is low. The science doesn't seem to care about our metaphysics of properties.

  ---

  ### Diagnosing the Disagreement (0.6 vs. 0.2)

  You asked where the real disagreement lives between you and your office-mate. You guessed it's about "how much explanatory weight you're allowed to hang on primitive resemblance."

  You are half-right, but you are framing it as a dispute about *weight*. I think it is a dispute about **the direction of fit between ontology and ideology.**

  **1. The Currency Mismatch**
  *   **You (Realist, 0.6):** You prioritize *Ideological Parsimony* (fewer primitives). You are willing to pay an *Ontological Cost* (adding universals to the inventory of being) to reduce the number of unexplained brute facts. You think primitive resemblance is a "free lunch" that tastes like fraud. You want the resemblance to be *grounded*.
  *   **Her (Nominalist, 0.2):** She prioritizes *Ontological Parsimony* (fewer categories of being). She is willing to pay an *Ideological Cost* (accepting primitive resemblance as a brute fact) to keep the inventory of being clean (just particulars). She thinks universals are "free lunches" that cost too much ontological credit.

  **2. The Real Sticking Point: Identity vs. Bruteness**
  The disagreement isn't about whether resemblance exists. It's about whether **exact similarity is a form of identity.**
  *   **Your Intuition:** When two electrons have the same charge, there is a *sense* in which the charge is the *very same thing* present in both. To deny this is to make the universe's uniformity a cosmic accident.
  *   **Her Intuition:** To say the charge is the "very same thing" is a category mistake. Things (particulars) can be in two places; features (if they are things) shouldn't be. If they aren't things, they don't exist. So, the electrons are just distinct particulars that match. The "sameness" is a description of the match, not an entity causing it.

  **3. Why you circle for a decade**
  You circle because you are arguing past each other on **what counts as an explanation.**
  *   For you, explaining $a$ resembles $b$ by saying "$a$ and $b$ share Universal U" is an explanation because it reduces a relational fact to two monadic facts (instantiation).
  *   For her, this is not an explanation because "instantiation" is just as mysterious as "resemblance," and now you have added "Universal U" to the story. She sees your "explanation" as *naming* the problem, not solving it.

  **The Verdict:**
  The 0.6 vs. 0.2 split is not about the evidence. It is about **metaphysical risk tolerance.**
  *   You are risk-averse regarding *brute connections* (you fear Humean worlds where things match for no reason).
  *   She is risk-averse regarding *category mistakes* (she fears reifying abstractions into concrete constituents).

  **How to break the deadlock:**
  Stop arguing about whether universals exist. Argue about **Instantiation.**
  Ask her: "What is the difference between $a$ having $U$ and $a$ not having $U$, if $U$ is not an entity?"
  If she says "It's just a primitive fact," press her on whether that primitive fact is *internal* or *external* to the particular.
  *   If internal: The particular is defined by its properties (bundle theory). Now you have to explain the unity of the bundle.
  *   If external: You have a relation between a particular and... what? If not a universal, then what is the relatum?

  The deadlock breaks when one of you admits that your preferred primitive (Universals vs. Resemblance) entails a cost you previously denied. You need to admit that "partial identity" in structural universals is deeply mysterious. She needs to admit that "primitive resemblance" is a modal brute fact that looks suspiciously like a universal without the name.

  **My advice for the lecture:**
  Tell the students the truth. The 0.6/0.4 split (or 0.6/0.2) is maintained because both sides offer a trade-off between *ontological clutter* and *ideological bruteness*. There is no knock-down argument because the dispute is ultimately about which kind of mystery you find more palatable. The "sane middle ground" is sane only if you think mysteries of composition (Armstrong) are better than mysteries of modal connection (Nominalism). That is a preference, not a proof.
