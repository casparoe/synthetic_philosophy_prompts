answer: |-
  The principle that captures your ledger is **the Distinction Between Constitutive and Allocative Goods.**

  This principle holds that values fall into two distinct moral domains. In the **Domain of Integrity**, goods are *constitutive* of who you are, your relationships, or your civic standing. These goods are incommensurable; trading them corrupts the practice or identity they sustain. In the **Domain of Welfare**, goods are *allocative* resources meant to serve human functioning. These goods are commensurable; they must be weighed and optimized to produce the greatest aggregate benefit, often following a hierarchy of need (Life > Basic Sustenance > Cultural Enrichment).

  Your friend is right that trade-offs are inevitable, but wrong that they apply everywhere. You are right that some things are sacred, but wrong to apply that sanctity to resource allocation.

  ### How the Principle Judges Your Ledger

  **1. The Domain of Integrity (No Trade-Offs Allowed)**
  *   **The Wedding Ring:** This is constitutive of your family history and memory. Selling it trades a piece of your identity for utility. Your refusal to sell is correct.
  *   **The Vote:** This is constitutive of civic agency. Selling it turns citizenship into a commodity, degrading the practice itself. Your refusal is correct, and the increasing insult at higher prices confirms that this is a protected value, not a high-priced one.
  *   **The Friends' Weddings:** Friendship is constitutive of a relationship of equals. Ranking them treats friends as allocative resources. A coin flip preserves their equal status. Your intuition is correct.

  **2. The Domain of Welfare (Trade-Offs Required)**
  *   **The House:** While sentimental, a house is primarily property (an allocative resource). Selling it converts one resource into another to improve welfare. Your willingness to sell is correct.
  *   **Senior Meals vs. Historic Theater:** Both are allocative. However, within this domain, there is a lexical priority: **Biological Survival > Basic Functioning > Cultural Enrichment.** Meals sustain life/functioning; the theater sustains culture. Choosing meals is the principled optimization.
  *   **Theater vs. Hospital Equipment:** Choosing the theater over equipment violates the hierarchy (Culture > Health). You are right to call this a mistake.
  *   **Vaccination:** This is a pure welfare calculation. Statistical lives are weighed against statistical harm. Optimization demands accepting the few severe reactions to save the many lives. Your endorsement is correct.

  ### The Verdict You Must Reject

  Your principle breaks on one case: **The Identified Child vs. The Screening Program.**

  You wrote: *"If the local hospital could fund either one identified child's rare and expensive surgery or a screening program that would statistically save more lives, I would fund the child without feeling the pull of the alternative at all."*

  This verdict is inconsistent with your endorsement of the vaccination program. Both cases are identical in structure: **One identified life (or few) vs. Many statistical lives.** In the vaccination case, you correctly accepted the statistical calculus. In the child case, you succumbed to the "identifiable victim effect," a cognitive bias, not a moral principle.

  If you are acting as the allocator of hospital funds (which the phrasing "If the local hospital could fund..." implies), you are in the **Domain of Welfare**. You are not a rescuer stumbling upon a drowning child; you are an administrator managing a budget. In this domain, a life is a unit of welfare to be preserved, not a constitutive bond. To choose the one identified child over the many statistical lives is to value *visibility* over *life itself*. It is a failure of impartiality.

  **You must discard this verdict.** The pull you feel is emotional, not principled. A principled agent feels the ache of the lost child but recognizes that saving the greater number is the only defensible choice in the Domain of Welfare.

  ### The Ruling: The Health Board Case

  **Case:** A health board deciding whether to stop covering one identified, named patient's very expensive ongoing treatment in order to fund prevention that will save unnamed others.

  **Ruling:** **Stop the treatment. Fund the prevention.**

  **Reasoning:**
  The health board is an institutional allocator, operating squarely in the **Domain of Welfare**. Its mandate is to maximize the health of the population it serves.
  1.  **Impartiality:** The board cannot privilege the "identified" patient over the "statistical" others without violating the equality of claimants. Name and proximity do not generate moral weight in public policy.
  2.  **Optimization:** If the prevention saves more lives (or more life-years) than the treatment, the utilitarian calculus of the Welfare Domain demands it.
  3.  **Integrity of the System:** Continuing the treatment degrades the system's ability to fulfill its primary function (saving the most lives possible).

  **Conclusion:**
  Your gut was right to resist your friend's claim that *everything* is tradable. The Ring, the Vote, and Friendship are protected by the **Domain of Integrity**. But your gut failed you on the Identified Child. Once you enter the **Domain of Welfare**, sentiment must yield to arithmetic. The Health Board must make the cold calculation, because the cold calculation saves more lives.
