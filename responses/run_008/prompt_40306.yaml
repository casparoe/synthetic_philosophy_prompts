prompt: |-
  i'm taking a seminar this semester on long-run economic history, basically "why are some nations rich and others poor," and we just hit the part of the course where the three big candidate explanations get trotted out: institutions (inclusive property rights, constraints on elites, that whole Acemoglu-Johnson-Robinson line), geography (disease environments, latitude, resource curses), and culture (trust, work norms, time preference). the thing that's actually eating me is less "which one is right" and more whether the question is answerable at all, because the whole field seems to rest on inferring causes from exactly one run of history with no controls. like the famous move is using european settler mortality as an instrument for institutional quality, and someone later went through those mortality numbers and found serious coding problems, and even before that there's the deeper worry that settler mortality is correlated with geography (disease!) so the instrument is arguably picking up the thing it was supposed to screen out. and then there's the point my TA keeps making: maybe "the nation" is the wrong unit entirely, since the divergence shows up within countries (north vs south italy, the regional stuff in china) just as much as between them, and any answer at the country level might be aggregating away the actual mechanism.

  so here's what I want from you. my credence that "institutions are the dominant cause of the great divergence and the current gaps in national income" is true is around 0.6, and my roommate -- she's more of a geography person -- says 0.2 and thinks i'm basically parroting the econ textbook. give me YOUR number, but don't just hand me one. decompose it:

  1. probability that there is even a single dominant cause rather than an interaction mess where geography shaped institutions which then took on a life of their own (in which case "dominant" needs a definition -- does causing the cause count as dominance?).
  2. probability that the causal inference methods this field actually has (natural experiments, instruments, before/after colonial episodes, the reversal-of-fortune comparison) can in principle distinguish the candidates, even with perfect data.
  3. probability that they can distinguish them with the data we will ever actually have -- settler mortality numbers and colonial records are not getting better than they are now.
  4. probability that "institutions" and "culture" are separable explananda at all, or whether every institution gets maintained by norms and every norm gets enforced by some institution, so the two explanations are competing bookkeeping of the same facts.

  give me a rough number and one line of justification for each term, then tell me how you combine them into the final credence, and which single term the final number is most sensitive to. then tell me which of those two people at 0.6 and 0.2 you think most likely disagrees about -- is it the actual history, or is it something about what counts as an explanation?

  one more thing: do NOT give me the "it's probably a mix of all three factors" shrug. that's what half my seminar does every week and its useless, because the mix claim can absorb any evidence whatsoever. commit to a position, tell me where the weight sits and why, and if you think the whole framing is broken say that instead but then defend the alternative you'd put in its place. also totally fine if you tell me my four terms are the wrong decomposition -- just replace them with better ones and use those. also pls flag any places where you're leaning on a contested empirical claim or a reading of the history that a specialist might push back on, since i might use this in my final paper and i dont want to cite something that falls apart.
