prompt: |-
  I run patient safety investigations for an NHS trust, and every serious incident report we produce has a seperate section for 'causal and contributory factors'. The arguments I keep getting into are about omissions — things somebody *didn't* do. The pre-op pause wasn't done before a wrong-site block; the call bell was left out of reach and hourly rounding hadn't happened before a fall at night; the on-call doctor didn't escalate to the consultant. Half my team thinks listing an omission as a cause is basically meaningless (nothing didn't happen, so how can nothing cause something?), and the other half wants to stick every conceivable non-action into the report, which dilutes it so much that none of the recommendations ever get made. I gather philosophers have actually worked on this — causation by omission, whether it turns on what *should* have happened versus what usually happens, that kind of thing — but I need something my investigators can run in under an hour per case, with zero philosophy background, and phrased so it survives being read by a coroner and by bereaved families, not just by us.

  So please write me a decision procedure: the questions to ask in order about any candidate omission, what counts as a good enough answer at each step, where the procedure stops with 'don't list it', and the points where it has to hand the call over to the panel because the question is one of values rather than facts. Then run it on three cases: (1) a wrong-site nerve block that went in because the team didn't do the pre-procedure pause, though the surgeon had also marked the wrong limb beforehand, so both an act and an omission are candidates; (2) the night-time fall where the bell was out of reach and rounding hadn't happened, and we genuinely cant tell which one mattered; (3) a delayed diagnosis where the on-call doctor didn't escalate overnight and the delay probably made no difference to the outcome, but the family is (understandably) furious and wants it listed as a cause. Include at least one case where the procedure gives an answer I won't like — I suspect it'll come out exonerating somebody I'd rather it didn't. And please be upfront about what the procedure can't settle, since the report has to go out either way. Please write the whole thing in British English. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs patient safety investigations for an NHS Trust.
      *   **Problem:** Disagreement within the team about listing "omissions" (things not done) as causal/contributory factors in Serious Incident (SI) reports. One side says omissions can't cause anything; the other side lists everything, diluting recommendations.
      *   **Goal:** A practical decision procedure (algorithm/checklist) to determine if an omission should be listed as a causal factor.
      *   **Constraints:**
          *   Must be usable by investigators in under an hour.
          *   Zero philosophy background required.
          *   Language must survive scrutiny by a coroner and bereaved families (clear, accountable, empathetic, legally robust).
          *   British English.
          *   Must include a "handover to panel" point for value judgments.
          *   Must apply the procedure to three specific cases (Wrong-site block, Night-time fall, Delayed diagnosis/no harm).
          *   Must include at least one outcome the user won't like (exonerating someone).
          *   Must be upfront about limitations.

  2.  **Deconstruct the Philosophy (for internal use, not for the output):**
      *   *Causation by Omission:* The core philosophical problem is counterfactual dependence. "If X had happened, would Y have been prevented?"
      *   *Normative Element:* Omissions aren't just physical absences; they are breaches of duty or expectation. "Nothing" causes something only if there was a duty to do the "something."
      *   *Hart & Honoré:* Distinguish between conditions and causes. An omission is a cause if it violates a norm/expectation and the outcome would likely have been different.
      *   *Practical Application:* We need to filter out "background conditions" (things that usually don't happen but aren't required) from "breaches of duty" (things that *should* have happened).

  3.  **Drafting the Decision Procedure (The "Omission Test"):**
      *   *Tone:* Professional, clinical, structured, NHS-style (PSIRF aligned).
      *   *Structure:* Step-by-step questions. Yes/No/Maybe.
      *   *Step 1: Duty/Expectation.* Was there a rule, protocol, or reasonable expectation? (Filters out "why didn't they read my mind?").
      *   *Step 2: Capability/Opportunity.* Could they actually have done it? (Filters out impossible tasks).
      *   *Step 3: Counterfactual Impact.* If they *had* done it, would the harm likely have been prevented or mitigated? (The "But-for" test).
      *   *Step 4: Significance.* Is this a systemic learning point or just individual blame? (Aligns with Just Culture).
      *   *Stop/Handover:* Where do we stop? If Step 1 is No, stop. If Step 3 is uncertain, handover to panel.

  4.  **Refining the Language for Stakeholders:**
      *   *Coroner:* Needs legal robustness. Avoid speculation. Use "on the balance of probabilities."
      *   *Families:* Needs empathy. Avoid jargon. Acknowledge the breach without necessarily admitting legal liability (though SI reports are tricky here). Use "contributory factor" rather than "legal cause."
      *   *Investigators:* Needs clarity. "If No, stop."

  5.  **Developing the Three Case Studies:**

      *   *Case 1: Wrong-site block (No pause + Wrong mark).*
          *   *Analysis:* Duty exists (WHO checklist). Capability exists. Counterfactual: Would the pause have caught the wrong mark? Likely yes.
          *   *Outcome:* List the omission. But note the active error (marking) is also a cause.
          *   *Nuance:* Don't let the omission obscure the active error.

      *   *Case 2: Fall (Bell out of reach + No rounding).*
          *   *Analysis:* Duty exists for both. Counterfactual: Unknown which one mattered. Patient might have fallen anyway even with the bell. Patient might have fallen even with rounding.
          *   *Outcome:* This is the "Uncertainty" case. The procedure should flag this as a "Handover to Panel" or list both as *potential* contributory factors with caveats. Let's make the procedure say: If you can't establish counterfactual impact, don't list as *causal*, list as *context*, or hand over. To meet the prompt's requirement for a clear procedure, I'll make Step 3 a hard gate. If you can't say "Likely Prevented," it doesn't pass as a *cause*, but might be a *contributory factor*. Actually, the prompt asks for "Causal and Contributory". So if it *contributed* to the risk, it counts. But if we *genuinely can't tell*, listing it as a cause is speculative.
          *   *Decision:* The procedure should force a decision on likelihood. If "Unknown," it goes to the Panel.

      *   *Case 3: Delayed Diagnosis (No escalation + No outcome difference).*
          *   *Analysis:* Duty exists (escalation protocol). Capability exists. Counterfactual: Prompt says "delay probably made no difference to outcome."
          *   *Outcome:* This is the "Exonerating" case. If the harm would have happened anyway, the omission is not a *cause* of the harm. It is a breach of process, but not a cause of the incident *harm*.
          *   *User Constraint:* "Include at least one case where the procedure gives an answer I won't like." This fits perfectly. The user wants to list it because the family is furious. The procedure should say "Do not list as causal factor for the harm."

  6.  **Review against Constraints:**
      *   *British English:* Check (e.g., "programme", "centre", "whilst", "NHS Trust").
      *   *Time:* Under an hour? Yes, it's a checklist.
      *   *Philosophy:* Hidden. No mention of Hart & Honoré or counterfactuals by name, just the logic.
      *   *Coroner/Family:* Language needs to be careful about "cause" vs "contributed to risk."
      *   *Handover:* Explicitly defined.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the tension. Validate both sides (omissions feel like nothing, but duties matter).
      *   *The Procedure:* Call it the "Omission Causality Test (OCT)".
      *   *Steps:*
          1.  The Duty Test (Normative).
          2.  The Ability Test (Possibility).
          3.  The Difference Test (Counterfactual).
          4.  The Proportionality Test (Value judgment/Panel handover).
      *   *Case Applications:* Walk through strictly.
      *   *Limitations:* Be honest. This doesn't solve legal liability. It doesn't solve family anger.

  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is Step 3 too hard? "Would it *definitely* have prevented it?" No, that's too high. "On the balance of probabilities, would it have prevented or significantly mitigated?" Better.
      *   *Critique:* Case 2 (The Fall). If we can't tell which mattered, do we list both? The prompt says "dilutes it so much that none of the recommendations ever get made." The procedure should advise caution. If *neither* passes the Difference Test individually, maybe they pass together? Let's make the procedure handle "Joint Necessity." If A *and* B were needed to prevent, both are causes. If A *or* B would have prevented, but we don't know which, we have to be careful. I will steer towards listing them as *system vulnerabilities* rather than direct causes if the link is weak, to satisfy the "dilution" concern.
      *   *Critique:* Case 3 (The Delay). The user says the family is furious. If I say "Don't list it," the family will be angrier. I need to explain *where* to put it if not in "Causal Factors." Maybe "Process Breaches" separate from "Cause of Harm." This distinguishes *blame* from *causation*. This is a crucial distinction for the Coroner too.

  9.  **Final Polish:** Ensure the tone is supportive but firm. Ensure the "Exonerating" case is clear. Ensure British spelling (programme, analyse, centre, defence, etc.).

  *(Self-Correction during drafting Case 3)*: I need to make sure I don't sound like I'm dismissing the family's anger. The procedure must distinguish between "Cause of Harm" and "Breach of Standard." The omission is a breach, but not a cause of the *outcome*. This is the nuance that satisfies the Coroner (facts) and manages the Family (acknowledgement without false causality).

  10. **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Handover points? Yes.
      *   Three cases run? Yes.
      *   One outcome user won't like? Yes (Case 3).
      *   Upfront about limitations? Yes.
      *   British English? Yes.

  Let's write it.cw
answer: |-
  # The Omission Causality Test (OCT)
  **For use in NHS Trust Serious Incident Investigations**

  ## Introduction
  This procedure is designed to resolve disagreements about whether a non-action (an omission) should be listed as a causal or contributory factor in a Serious Incident (SI) report. It balances the need for accountability with the need for factual accuracy. It is not a philosophical exercise; it is a risk-assessment tool for report writing.

  **Time required:** Approx. 45–60 minutes per candidate omission.
  **Audience:** Designed to produce findings robust enough for a Coroner, clear enough for a bereaved family, and actionable for your safety team.

  ---

  ## The Procedure

  Take each candidate omission (e.g., "The pre-op pause was not done") and run it through the four questions below in order.

  ### Step 1: The Duty Test (Normative)
  **Question:** Was there a clear, existing expectation that this action *should* have been taken at that specific moment?
  *   **Look for:** Written policy, protocol, local guideline, or a widely accepted standard of care (e.g., WHO Checklist, NICE guideline, Trust policy on hourly rounding).
  *   **Good enough answer:** "Yes, Policy X paragraph Y requires this," or "Yes, this is standard training for this role."
  *   **Stop point:** If the answer is **No** (e.g., "It would have been nice if they had," but there was no rule or standard), **do not list it.** Record it as 'Context' if relevant, but not as a causal factor.
  *   **Why:** An omission is only a cause if there was a duty to act. Without duty, it is merely a background condition.

  ### Step 2: The Ability Test (Possibility)
  **Question:** Was it reasonably possible for the individual to have performed the action at that time?
  *   **Look for:** Evidence of capacity, resources, time, and knowledge.
  *   **Good enough answer:** "Yes, they were trained, the equipment was available, and they were not incapacitated."
  *   **Stop point:** If the answer is **No** (e.g., "The only person trained was off sick," or "The alarm was broken"), **do not list the individual's omission.** Instead, list the *system failure* that made the action impossible as the causal factor.
  *   **Why:** You cannot list a person's failure to do the impossible as a cause. The cause is the system constraint.

  ### Step 3: The Difference Test (Counterfactual)
  **Question:** On the balance of probabilities, would performing the action have prevented the harm or significantly mitigated its severity?
  *   **Look for:** Evidence, expert opinion, or logical inference. Avoid speculation.
  *   **Good enough answer:** "Yes, expert advice suggests the error would have been caught," or "Yes, the patient would likely have been assisted."
  *   **Stop point:** If the answer is **No** (i.e., the harm would have happened anyway), **do not list it as a cause of the harm.** (See *Handling Uncomfortable Outcomes* below).
  *   **Handover Point:** If the answer is **"We cannot tell"** (genuine equipoise), stop here. **Hand over to the Investigation Panel.** This is no longer a factual question; it is a value judgment on how much uncertainty the Trust is willing to endorse in a public report.

  ### Step 4: The Proportionality Test (Learning Value)
  **Question:** Does listing this omission lead to a specific, actionable recommendation, or does it simply attribute blame?
  *   **Look for:** Link to recommendations.
  *   **Good enough answer:** "Yes, it leads to Recommendation Z (e.g., 'Audit compliance with pauses')."
  *   **Stop point:** If listing it adds no learning value beyond what is already covered by other factors (i.e., it dilutes the report), **group it** under a broader systemic heading (e.g., "Communication Failures") rather than listing it as a standalone bullet point.
  *   **Why:** This prevents the "dilution" problem where 20 minor omissions obscure the 2 major safety fixes.

  ---

  ## Application to Case Studies

  Here is the procedure applied to your three scenarios.

  ### Case 1: Wrong-Site Nerve Block
  **Facts:** Surgeon marked the wrong limb (Act). Team did not do the pre-procedure pause (Omission).
  **Investigation:**
  1.  **Duty:** Yes. WHO Surgical Safety Checklist is mandatory Trust policy.
  2.  **Ability:** Yes. Team was present, time allowed, no emergency precluding it.
  3.  **Difference:** Yes. The specific purpose of the pause is to verify site and side. Expert opinion confirms that a properly conducted pause would likely have identified the mismatch between the mark and the consent form.
  4.  **Proportionality:** Yes. Leads to recommendation on Checklist compliance auditing.

  **Verdict:** **List the omission.**
  **Wording for Report:** "The failure to conduct the pre-procedure pause was a contributory factor. While the incorrect marking was the primary error, the pause is the designed safety net to intercept such errors. Its absence allowed the error to reach the patient."
  **Note:** Do not let the omission overshadow the active error. Both are causes. The mark was the spark; the missing pause was the failed firebreak.

  ### Case 2: Night-Time Fall (Bell & Rounding)
  **Facts:** Call bell out of reach (Omission A). Hourly rounding not done (Omission B). Cannot determine which failure actually mattered (patient might have tried to get up regardless of bell; might have fallen even if rounded on).
  **Investigation:**
  1.  **Duty:** Yes to both. Trust policy on environment safety and nursing rounding standards.
  2.  **Ability:** Yes to both. Bell was available; staff were rostered.
  3.  **Difference:** **Uncertain.**
      *   *If Bell:* Would they have used it? Maybe they were confused.
      *   *If Rounding:* Would staff have stopped them? Maybe the fall happened between rounds.
  4.  **Handover:** Because Step 3 yields "We cannot tell," this **hands over to the Panel.**

  **Panel Decision Logic:** The Panel must decide if these are *risk factors* or *causes*.
  **Verdict:** **List as 'Contributory System Vulnerabilities' rather than 'Direct Causes'.**
  **Wording for Report:** "It is not possible to determine definitively which failure precipitated the fall. However, the combination of an inaccessible call bell and missed rounding created an environment of high risk where a fall was significantly more likely. Both are recorded as contributory factors to the *risk environment*."
  **Why:** This satisfies the Coroner (factual accuracy) without making a speculative claim about causation that could be challenged in court. It allows you to recommend fixes for both without claiming one definitely stopped the fall.

  ### Case 3: Delayed Diagnosis (No Escalation / No Harm Difference)
  **Facts:** On-call doctor did not escalate to Consultant overnight (Omission). Diagnosis delayed. Clinical evidence suggests the delay made no difference to the final outcome (Omission did not change the harm). Family is furious and wants it listed.
  **Investigation:**
  1.  **Duty:** Yes. Escalation policy clearly breached.
  2.  **Ability:** Yes. Consultant was on call.
  3.  **Difference:** **No.** Clinical expert advice confirms that even with immediate escalation, the treatment pathway and outcome would have been identical. The harm was caused by the underlying condition, not the delay.
  4.  **Proportionality:** Listing it as a *cause of harm* is factually incorrect.

  **Verdict:** **Do not list as a cause of the harm.** (This is the uncomfortable outcome).
  **How to handle the Family/Coroner:**
  You must distinguish between *Cause of Harm* and *Breach of Standard*.
  **Wording for Report:** "The failure to escalate was a breach of Trust protocol. However, clinical evidence indicates that this delay did not alter the patient's outcome. Therefore, while this is a serious governance concern, it is not a causal factor in the patient's injury."
  **Recommendation:** "Investigate separately as a governance breach regarding escalation culture."

  **Why this is the right answer:**
  If you list it as a cause of harm, you are lying to the Coroner. If you lie to the Coroner, you lose credibility. If you lose credibility, the family's legitimate anger about the *breach* gets lost because they think you are admitting liability for the *death/injury* which you medically cannot support.
  **The Compromise:** Acknowledge the breach loudly in the "Process Issues" section, just not in the "Causation of Harm" section. This validates the family's anger without falsifying the medical causality.

  ---

  ## Limitations and Handover Protocol

  This procedure cannot settle the following. If your investigation hits these walls, you must escalate to the SI Panel or the Medical Director.

  1.  **The "Moral Cause" vs. "Physical Cause":**
      Families often feel that a breach of duty *is* the cause, regardless of the physical outcome (Case 3). The OCT prioritises physical causality for the report. The Panel must decide how to communicate the moral breach without conflating it with medical causation.
  2.  **Resource-Constrained Duties:**
      If Step 2 (Ability) fails because of chronic understaffing, listing the omission as an individual failure is unjust. The Panel must decide if the 'Duty' itself was realistic. This is a strategic risk decision, not an investigative one.
  3.  **Legal Liability:**
      This procedure is for patient safety learning. It does not determine legal negligence. Do not use the phrase "negligent" in the report. Use "breach of protocol" or "deviation from standard."

  ## Summary for Investigators
  *   **No Duty?** It's context, not a cause.
  *   **No Ability?** It's a system failure, not an individual omission.
  *   **No Difference?** It's a governance breach, not a cause of harm.
  *   **Uncertain Difference?** Hand over to the Panel.

  **Final Note:**
  This tool is designed to protect the integrity of your reports. A report that lists every omission as a cause eventually lists nothing as a cause. By filtering rigorously, the omissions you *do* list will carry more weight when you present recommendations to the Board.
