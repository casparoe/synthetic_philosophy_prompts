      *   Move 3: Irina's No Theater. (Relies on functionalism/Multiple Drafts).
      *   Move 4: Tom's Rejoinder on substantive claims. (Highlights the cost of Irina's view).
      *   Verdict: Irina is right about the mechanism (no theater), Tom is right about the intuition (moral weight), but both miss that the dichotomy itself is the problem (Multiple Drafts).
      *   Premise: Coherent only with caveats.

