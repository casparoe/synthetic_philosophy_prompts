  | Question Part | Max Marks | Awarded | Notes |
  | :--- | :---: | :---: | :--- |
  | **(i) Premises & Structure** | 8 | 5 | Good on IBE structure; lost marks for conflating Infinity Argument with POS. |
  | **(ii) Kind of Innateness** | 8 | 6 | Good on domain-specificity; lost marks for overclaiming "complete grammar." |
  | **(iii) Statistical Models** | 9 | 4 | Identified Premise 2 correctly; lost marks for ignoring "strongest form" instruction and misunderstanding model biases. |
