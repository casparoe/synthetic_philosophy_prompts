answer: |-
  The episode exposes an anomaly in the individualist concept of intelligence, favoring your view that genuine cognitive competence was present, though your friend is correct that validating this requires redefining the system boundaries to avoid conceptual inflation.

  Under **Methodological Individualism** (your friend's lens), the system is the horse's nervous system alone. The task is arithmetic reasoning or semantic comprehension. Success requires internal manipulation of numerical concepts independent of external scaffolding. On this map, Hans failed completely; the correct hoof taps were causal byproducts, not cognitive outputs. This theory is silent on how the horse achieved such high accuracy without the posited internal mechanism, forced to categorize the performance as "null" rather than explaining the mechanism that *was* present. It treats the interaction loop as noise to be filtered rather than a component to be modeled.

  Under **Distributed Cognition** (your lens), the system is the horse–questioner dyad. The task is the collaborative production of a correct answer. Success is defined by the flow of information from the questioner's knowledge state to the horse's motor output via the interaction loop. On this map, the system succeeded reliably; the "intelligence" is a property of the coupling, not the individual organism. This theory is silent on where agency resides when the loop breaks, and it risks conceptual inflation unless it distinguishes between mere causal coupling and normatively constrained information processing. It explains the data your friend dismisses but must defend against the charge that it makes intelligence ubiquitous.

  Under **Ecological Psychology** (Pfungst's actual finding), the system is the organism–environment field. The task is the perception of invariant information (micro-postural shifts) affixed to the questioner's body. Success is high-fidelity pickup of subtle sensory cues. On this map, Hans succeeded remarkably; the competence was perceptual, not arithmetic. This theory is silent on whether such perceptual acuity warrants the label "intelligence" rather than "reflex" or "conditioning," as it describes the *how* without settling the ontological status of the *what*.

  Regarding the concept of intelligence itself, the episode presents a case the received concept never anticipated. The received concept assumes intelligence is an internal property of an agent that survives isolation. Hans demonstrates that successful problem-solving can be a relational property that vanishes upon isolation. This does not confirm the received concept, nor is it merely an anomaly; it is a boundary case that forces a choice between retaining a narrow definition that excludes observable competence or expanding the definition to include distributed systems.

  The analysis favors you, but with your friend's caution attached. You are right that Pfungst's data reveal a serious cognitive competence—perceptual discrimination of involuntary human cues is a difficult task that requires attention, memory, and association, which are cognitive goods. To call this "no intelligence" is to ignore the work the horse was actually doing. However, your friend is right that if we call this "arithmetic intelligence," the concept loses its predictive power. The resolution is to accept your claim that competence was real and distributed, while accepting your friend's constraint that we must specify the system boundary before attributing intelligence. Hans was not intelligent in isolation, but the horse–human system was intelligent collectively; denying this because the horse lacked internal arithmetic is like denying a calculator is computing because the silicon lacks understanding.
