answer: |-
  This is a fascinating ethical puzzle. You are essentially testing Maya against the debate between **Traditional Just War Theory** (symmetry of combatants), **Revisionist Just War Theory** (liability based on moral responsibility for the threat), and a stricter **Collective Asymmetry** (liability based purely on which side you are on).

  Based on her phrase "they started it, so nothing they do counts as self-defense" and her willingness to target non-shooting supply guards, she is rejecting the Traditional View. She is operating somewhere between Revisionism and Collective Asymmetry.

  Here is the breakdown of your three cases, the analysis of her underlying rules, and the best way to split them.

  ### 1. Predictions & Rule Analysis

  Here is how I predict Maya will rule, based on the "Collective/Status" hypothesis (Rule 1) appearing stronger in her current statements than the "Individualist" hypothesis (Rule 2).

  **Case 1: The Invader Engineer (Civilian, making shells)**
  *   **My Prediction of Maya:** **Not Permissible (Immune).**
  *   **Why:** Her current verdicts focus on members of the *armed forces* (conscripts, soldiers, supply guards). Even though she targets non-shooting soldiers, she hasn't yet expanded liability to civilians. Most people, even those with asymmetric views, hesitate to cross the civilian/combatant line.
  *   **Rule 1 (Status/Collective):** Predicts **Immune**. He is not in the "invader's armed forces." Aggression rubs off on the army, not the factory.
  *   **Rule 2 (Individualist):** Predicts **Liable** (likely). If liability is about "contributing to the unjust side," making the shells is a direct causal contribution, often viewed as making one liable in revisionist ethics.
  *   **The Split:** If she says "Kill him," she is likely Rule 2. If she says "Spare him," she is likely Rule 1 (or a hybrid).

  **Case 2: The Defender Raider (Targeting Civilians)**
  *   **My Prediction of Maya:** **Not Permissible (Immune).**
  *   **Why:** Her rigidity ("nothing they do counts as self-defense") suggests she views the *invaders'* rights as forfeit and the *defenders'* rights as absolute. She may view the defender's war crimes as a separate issue that doesn't restore the invaders' right to kill.
  *   **Rule 1 (Status/Collective):** Predicts **Immune**. He is on the "Defender" side. Status protects him regardless of action.
  *   **Rule 2 (Individualist):** Predicts **Liable**. He is now contributing to an *unjust* threat (killing civilians). His individual actions make him liable, regardless of his uniform.
  *   **The Split:** This is the moral stress test. If she allows the invaders to shoot him, she admits individual action matters more than side.

  **Case 3: The Invader Deserter (Walking home, no rifle, uniform)**
  *   **My Prediction of Maya:** **Permissible (Liable).**
  *   **Why:** She already approved killing a supply guard "who isn't shooting at anyone that minute." This suggests she does not require an *immediate* threat, only membership in the unjust machine. A deserter walking home is still technically a soldier until captured or discharged.
  *   **Rule 1 (Status/Collective):** Predicts **Liable**. He is in the invader's armed forces (uniform). Status is sufficient.
  *   **Rule 2 (Individualist):** Predicts **Immune**. He has ceased contributing. He is no longer a causal link in the unjust threat.
  *   **The Split:** This isolates the "current contribution" variable without introducing civilians or war crimes.

  ### 2. Which Rule Fits Best?

  **Rule 1 (Collective/Status: "Aggression rubs off on the whole army") fits her track record best.**

  *   **Reasoning:** Her justification ("They started it") is a collective judgment about the *war*, not the *individual*. When she allows killing the supply depot guard, she isn't arguing that the guard is personally responsible for the invasion; she is arguing that he is part of the *invading entity*. If she were running Rule 2 (Individualist), she would likely have expressed hesitation about the reluctant conscript or the non-shooting guard, focusing on their lack of personal moral responsibility. Instead, she was "no problem" with killing them. This suggests the Uniform/Side is the trigger, not the individual's causal contribution.

  ### 3. The Best Case to Split the Rules

  **Case 3 (The Invader Deserter) is the best diagnostic tool.**

  *   **Why:** Case 1 introduces "Civilians," which brings in a whole new set of intuitions (non-combatant immunity) that might confuse the data. Case 2 introduces "War Crimes," which is emotionally charged; she might say invaders can kill him simply because *everyone* hates child-killers, not because of her war principle.
  *   **Case 3 is the cleanest control.** It keeps the subject as a *soldier* (her existing domain) but removes the *threat/contribution*.
      *   If she says **Kill**: She confirms Rule 1 (Status is king). The supply guard wasn't shooting, and the deserter isn't fighting; both are liable because of the uniform.
      *   If she says **Spare**: She confirms Rule 2 (Contribution is king). The supply guard was *working* (contributing), but the deserter is *leaving* (not contributing). This would force her to refine her view on the supply guard (i.e., "We could kill him because he was maintaining the capability, not just because he was an invader").

  ### 4. Consistency Check

  **I do not see a logical inconsistency in her verdicts *so far*, but there is a tension.**

  *   **Logical Consistency:** Her views are internally consistent if she holds a **Strict Asymmetry** position. In this view, *Jus ad Bellum* (justice of the war) completely determines *Jus in Bello* (justice in fighting). If you are the aggressor, you lose the right to kill and gain the liability to be killed. If you are the defender, you gain the right to kill and lose liability. Within that framework, killing a non-shooting invader and sparing a shooting defender is perfectly consistent.
  *   **The Tension:** The inconsistency risk lies in her moral reasoning. She justifies the asymmetry by saying "They started it" (a moral claim). However, if she rules that Defenders are *never* liable (Case 2), she risks detaching her view from morality entirely and making it purely tribal ("My side is immune"). If she claims her view is based on *Justice*, but her rules protect *Injustice* (Defenders killing civilians), her theory becomes self-undermining.
  *   **Verdict:** She is logically consistent *for now*, but Case 2 (The Defender Raider) is the trap that will likely expose a contradiction between her moral reasoning ("They started it") and her practical verdicts ("Defenders can do anything").

  ### Recommendation for Your Conversation

  Lead with **Case 3 (The Deserter)**.

  It is the most direct follow-up to the "supply depot" case she already ruled on. It forces her to choose between "Is he liable because he's an **Invader**?" or "Is he liable because he's a **Threat**?"

  *   **If she says "Fair Game":** She is a Status Absolutist. You can then press her on Case 2 to see if she thinks Defenders have unlimited license.
  *   **If she says "Not Fair Game":** She is a Revisionist/Individualist. You can then ask her why the supply guard was fair game (was it because he was *working*?), which helps you map the boundary of "contribution."

  Good luck. This is deep water for a pizza argument, but it's the best way to find out what she actually believes.
