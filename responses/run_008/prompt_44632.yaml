      *   Ensure the distinction between "Northern European" (low key, bus-riding) and "British" (coronets, gold) is respected, though the political theory is similar.
      *   *Self-Correction during drafting:* Make sure I don't just say "it's complicated." I need to give specific theories she can wrestle with.
      *   *Key Insight:* The "Accident of Birth" is the only thing that guarantees neutrality. If you choose the leader, you choose a side. If fate chooses, they belong to no side.

  6.  **Final Polish:**
