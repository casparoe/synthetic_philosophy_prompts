answer: |-
  **Exam Question: The Copycat Microdomain Extended**

  Consider a modification to the Copycat microdomain in which the alphabet is treated as cyclic: the successor of `z` is `a`. In this extended domain, the successor relation at the boundary acquires two rival readings: the ordinary dead-end successor (where `z` has none) and the cyclic successor (where `z` maps to `a`). 

  Focus your analysis on the analogy problem: **$abc \Rightarrow abd$**, **$xyz \Rightarrow$ ?**

  1.  **Architectural Prediction:** Describe how the Copycat architecture (Slipnet, Workspace, Codelets, Temperature) would process this problem. Specifically, predict where the system would struggle and how the temperature would fluctuate as competing interpretations of the `z`-boundary clash.
  2.  **The Nature of Slippage:** Argue whether the difficulty introduced by this wraparound extension is a fixable engineering matter (e.g., adding a "cyclic" node) or a symptom of a deeper limitation. In your argument, address whether conceptual slippage in Copycat amounts to anything more than movement along hand-coded distances in the Slipnet.
  3.  **Fluid Concepts:** Judge whether this case supports the claim that fluid concepts require a pressure-driven, interactive architecture rather than a model that treats concepts as static points in a fixed similarity space. Justify your position using the behavior predicted in part 1.

  ***

  **Model Answer**

  In the extended Copycat domain, the problem $abc \Rightarrow abd$, $xyz \Rightarrow$ ? triggers a fundamental architectural conflict. Initially, codelets build structures identifying the `successor` rule in the source string. When applying this to $xyz$, codelets encounter the `z`. In the standard domain, `z` is a dead end, often forcing a slippage to `predecessor` (yielding $wyz$) or a focus on group structure ($xyz$ as a whole). With the cyclic extension, a new rivalry emerges: the `successor` concept now activates both the standard termination and the new `cyclic-successor` pathway.

  The Workspace would show a spike in competition. Codelets proposing $xya$ (cyclic) compete with those proposing $xyd$ (literal replacement) or $wyz$ (predecessor slippage). Temperature, which reflects the system's dissatisfaction with current interpretations, would rise sharply as incompatible structures fight for dominance. If the Slipnet link between `successor` and `cyclic` is weak, the system may oscillate, failing to cool down to a single answer. The struggle is not merely finding a rule, but resolving which *context* defines the rule's validity at the boundary.

  This difficulty suggests the wraparound issue is not a simple engineering fix. Adding a `cyclic` node to the Slipnet patches the domain but exposes a deeper limitation: slippage in Copycat is largely constrained by pre-defined links. While the architecture allows probabilistic selection, the *possibility* of slippage (e.g., from `successor` to `cyclic-successor`) depends on hand-coded distances. If the link does not exist, the slippage cannot occur. Thus, conceptual fluidity is limited to the topology of the Slipnet. True fluidity would require the system to *construct* the relevance of cyclicity from the context, not merely traverse a static map of pre-ordained similarities. The engineering patch works for this specific microdomain but does not generalize to novel conceptual realms where the relevant dimensions of similarity are unknown.

  Consequently, this case strongly supports the claim that fluid concepts require a pressure-driven, interactive architecture. A static similarity space model would treat `successor` and `cyclic-successor` as fixed vectors; it could not explain why the salience of `cyclic` changes based on the "pressure" of the impasse at `z`. In Copycat, the high temperature (pressure) caused by the boundary failure actively increases the probability of exploring distant Slipnet nodes. This interaction—where dissatisfaction drives the search for new conceptual connections—is the core of fluidity. However, because the connections themselves are fixed, Copycat only simulates fluidity within a bounded horizon. The wraparound extension demonstrates that while pressure-driven architecture is necessary for fluid concepts, it is not sufficient if the conceptual space itself remains rigid and hand-coded. True cognitive fluidity requires the architecture to dynamically reconfigure the similarity space itself, not just navigate it under pressure.

  ***

  **Marking Scheme**

  | **Must-Hit Point** | **Marks** | **Note on Memorizers** |
  | :--- | :---: | :--- |
  | **1. Architectural Mechanics:** Correctly predicts temperature spikes and codelet competition due to conflicting `successor` interpretations at the `z` boundary. | 4 | *Often recite standard $ijk \Rightarrow ijl$ results without adapting to the new boundary constraints.* |
  | **2. Boundary Struggle:** Identifies that the struggle is not just rule application, but the contextual validity of the rule at the domain edge (impasse). | 4 | *Tend to describe the boundary as a simple "error" rather than a competition between rival conceptual pathways.* |
  | **3. Slipnet Limitation:** Argues that slippage is constrained by hand-coded links; adding nodes is an engineering patch, not a solution to the rigidity of the representation. | 4 | *Usually claim Copycat is fully "emergent" and miss the critique that Slipnet distances are pre-defined.* |
  | **4. Engineering vs. Deep Symptom:** Distinguishes between fixing the specific task (engineering) and addressing the inability to generate new conceptual dimensions (deep symptom). | 4 | *Often conflate "making it work" with "solving the theoretical problem of concept formation."* |
  | **5. Pressure-Driven Argument:** Judges that pressure (temperature) is necessary for fluidity but insufficient without dynamic reconfiguration of the similarity space itself. | 4 | *Typically repeat the slogan "fluid concepts need pressure" without critiquing the static nature of the Slipnet.* |
