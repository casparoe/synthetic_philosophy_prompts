      *   It **is** a disagreement about the *mode of inquiry* appropriate for "framework questions."
      *   Key distinction: **Solving a puzzle** (science) vs. **Dissolving/Reframing a problem** (philosophy).
      *   The pessimist assumes philosophy *should* be puzzle-solving. The optimist assumes philosophy *is* problem-reframing.
      *   Since they disagree on the *function*, they disagree on the *metric*.

  8.  **Determine What Progress on *This* Question Looks Like:**
