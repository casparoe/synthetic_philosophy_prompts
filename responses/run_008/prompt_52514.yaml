answer: |-
  You have a very solid grasp of the history, and your skepticism is shared by many researchers today. The confusion you are experiencing is not a bug in your understanding; it is a feature of the literature. The term "Frame Problem" has undergone significant semantic drift since 1969, leading to two distinct problems that share a name but differ in scope and solvability.

  Here is the breakdown of where the consensus lies, where the disagreement burns, and why the "it's just attention" objection is the central pivot point of the debate.

  ### 1. The Technical Frame Problem (Mostly Settled)
  **Your understanding:** *Originally a technical AI problem about efficiently updating world states without re-verifying unchanged facts. Largely sorted by the 90s via non-monotonic logic, etc.*

  **Verdict:** **Mostly Correct.**

  *   **The Consensus:** Among AI researchers working in knowledge representation and reasoning (KR&R), the *logical* frame problem is considered solved. We have formalisms (Situation Calculus with successor state axioms, Event Calculus, Fluent Calculus) that allow a system to infer what changes and what stays the same without writing infinite frame axioms.
  *   **The Nuance:** It is solved *given a specific ontology*. If you can define the world in terms of discrete fluents and actions, logic handles the inertia.
  *   **The Remaining Technical Hitch:** While the *logic* is solved, the *tractability* in open-ended environments is not. If the database of facts is the size of the internet, even efficient frame axioms require indexing structures that are non-trivial. However, this is viewed as an engineering constraint, not a fundamental logical paradox.

  ### 2. The Philosophical Frame Problem (Highly Contested)
  **Your understanding:** *Philosophers (Fodor, Dennett) turned this into a problem about rationality and relevance. You suspect this is just the psychological problem of attention.*

  **Verdict:** **This is the live wire.**

  The shift happened when Daniel Dennett (1978) and later Jerry Fodor (1983, 1987) argued that the technical solution didn't touch the cognitive reality. They argued that before a system can apply frame axioms, it must know *which* axioms to apply.

  **Is it just "Attention"?**
  This is the crux of your question. If you say, "The brain solves this with attention mechanisms," proponents of the philosophical frame problem argue you have **begged the question**.

  *   **The Regress Argument:** Attention is a filter. But what sets the filter?
      *   If the filter is set by a rule (e.g., "attend to moving objects"), what happens when the relevant fact is static (e.g., "the absence of a sound")?
      *   If the system needs a rule to decide which rule to apply, you enter an infinite regress.
      *   **Fodor's Point:** Peripheral systems (vision, language parsing) are modular and encapsulated; they have fixed attention filters. Central systems (belief fixation, planning) are *isotropic* (anything might be relevant) and *Quinean* (confirmation depends on the whole web of belief). You cannot have a fixed filter for central cognition without risking missing the one weird fact that matters (the "baby in the bathtub" problem).
  *   **Why Symbol Systems Specifically?**
      *   **Classical Computationalism (GOFAI):** Requires explicit representation. To check relevance, the relevance must be represented. If you have to represent the relevance of every potential fact to every potential goal, the database explodes.
      *   **Connectionism/Neural Nets:** Proponents argue neural nets bypass this. Relevance isn't "checked"; it emerges via activation spreading. A pattern matches without the system explicitly iterating through irrelevant facts.
      *   **The Counter-Counter:** Critics argue neural nets just hide the frame problem. They work well on training distributions but fail catastrophically on out-of-distribution cases (exactly when relevance detection is most needed). They don't *solve* relevance; they statistically approximate it, which fails when the "frame" shifts unexpectedly.

  ### 3. Consensus vs. Live Disagreements

  Per your request, here is the separation of settled ground from active combat zones.

  #### **Where there is reasonable consensus:**
  1.  **Terminological Ambiguity:** Everyone agrees the term "Frame Problem" is overloaded. It refers to at least three things: (1) The logical persistence problem (McCarthy), (2) The computational tractability problem, and (3) The epistemological relevance problem (Fodor/Dennett).
  2.  **Logical Solution:** The 1969 logical formulation is formally resolved within bounded domains. No one thinks we need infinite frame axioms anymore.
  3.  **Cognitive Reality:** Humans *do* solve this somehow. We don't freeze up when making coffee. The problem is descriptive (how do we do it?) not existential (is it possible?).

  #### **Where the live disagreements are:**
  1.  **Is the Philosophical Version a Pseudo-Problem?**
      *   *Side A (e.g., Daniel Dennett later, some embodied cognitivists):* The philosophical frame problem is a artifact of bad philosophy of mind. Once you drop the idea that the brain is a database of explicit sentences, the problem dissolves. It's only hard for a system that represents the world the way McCarthy did.
      *   *Side B (e.g., Fodor, some classical cognitivists):* It is a deep problem. Any system that manipulates representations (which cognition must do) faces the relevance problem. Changing the architecture (to neural nets) doesn't explain how *semantic* relevance is captured, only statistical correlation.
  2.  **Modularity of Mind:**
      *   *Side A:* The frame problem proves central cognition cannot be computational in the classical sense. It suggests cognition is largely modular or embodied, avoiding the need for global search.
      *   *Side B:* The frame problem shows the limits of modularity. Since central belief fixation is unencapsulated, we need a theory of how non-modular computation is possible.
  3.  **The "Attention" Dismissal:**
      *   *Side A (Your view):* Evolution provided heuristics and attention filters. It's an engineering problem of tuning, not a philosophical crisis.
      *   *Side B:* Evolutionary tuning *is* the solution, but it implies the system is not truly "rational" in the general sense; it is a bag of tricks adapted to a specific niche. If you move the human to a radically different environment, the "attention" filters fail. Therefore, general intelligence (AGI) still faces the frame problem even if biological humans don't notice it in their niche.

  ### 4. Why your "Attention is Cheap" intuition meets resistance
  You asked: *"Attention is cheap in any architecture once evolution hands you the right filters, no?"*

  The resistance to this view comes from the requirement for **General Intelligence**.
  *   **Niche vs. General:** Evolutionary filters work because the environment is stable. If you build an AGI, you cannot pre-install filters for a world you don't know yet.
  *   **The Symbol Grounding Issue:** For a symbol system, "attention" implies selecting a symbol. To select the symbol, you must identify it. To identify it, you must know its properties. To know its properties... you are back to searching the database.
  *   **Context Sensitivity:** Relevance is radically context-sensitive. A fact that is irrelevant in 99% of contexts (e.g., "the color of the doorknob") becomes critical in 1% (e.g., "the doorknob is electrified"). A fixed attention filter misses the 1%. A dynamic filter requires a rule to change the filter, which returns us to the regress.

  ### Summary
  You are not going wrong; you are identifying the exact point where the AI engineering community diverged from the philosophy of mind community.

  *   **For AI Engineers:** The Frame Problem is a solved constraint satisfaction issue regarding state persistence.
  *   **For Philosophers of Mind:** The Frame Problem is an argument about the nature of representation and relevance.

  If you view the mind as a biological machine tuned by evolution to a specific niche, your "attention" critique holds water. The "problem" only becomes intractable if you demand a system that can reason generally about *any* possible world without prior evolutionary tuning. Fodor's indictment was specifically against **Classical Computationalism's claim to explain general rationality**, not against biological survival.

  The live debate is whether "general rationality" is even a coherent goal, or if intelligence is always necessarily a collection of specialized, framed modules (Side A) vs. whether there is a missing theory of global relevance that classical systems lack (Side B).
