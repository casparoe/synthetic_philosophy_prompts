answer: |-
  # QUIZ: DECISION PROFILES

  **Instructions:** For each of the following nine scenarios, choose the single option you would genuinely prefer. Assume all probabilities are exact and all payments are made immediately in cash. There are no "right" answers; we are interested in your actual choices.

  **Q1.**
  *   **Option A:** Receive \$1,000,000 for sure.
  *   **Option B:** 10% chance of \$5,000,000; 89% chance of \$1,000,000; 1% chance of \$0.

  **Q2.**
  Assume your current liquid wealth is **\$100,000**.
  *   **Option A:** Your wealth remains unchanged (\$0 change).
  *   **Option B:** 50% chance of losing \$100; 50% chance of gaining \$110.

  **Q3.**
  Assume your current liquid wealth is **\$1,000,000**.
  *   **Option A:** Your wealth remains unchanged (\$0 change).
  *   **Option B:** 50% chance of losing \$100; 50% chance of gaining \$110.

  **Q4.**
  An urn contains 90 balls. 30 are Red. The other 60 are either Black or Yellow, but you do not know the proportion of Black to Yellow. One ball will be drawn at random.
  *   **Option A:** Win \$100 if the ball is Red.
  *   **Option B:** Win \$100 if the ball is Black.

  **Q5.**
  *   **Option A:** 50% chance of \$200; 50% chance of \$300.
  *   **Option B:** 50% chance of \$200; 50% chance of \$250.

  **Q6.**
