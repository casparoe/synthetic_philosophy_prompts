  # SCORING KEY AND INTERPRETATION

  *Note: This key is for post-quiz analysis. Do not consult it while answering the questions.*

  This instrument sorts respondents based on revealed preference patterns. It does not test knowledge of decision theory. The categories below describe the structural commitments implied by your choices.

  ### 1. Strict Expected-Utility Maximizer
  **Pattern:**
  *   **Allais Consistency:** You chose **A in Q1** AND **A in Q9** (or **B in Q1** AND **B in Q9**).
  *   **Rabin Consistency:** You chose **B in Q2** OR **B in Q3** (Accepting the small bet). *Alternatively*, if you chose **A in Q2/3** (Rejecting small bet), you must also choose **A in Q6** (Rejecting large bet).
  *   **FOSD:** You chose **A in Q5**.
  *   **Ellsberg:** Indifference or any choice (See Note 1).

  **Most Awkward Commitment:** To maintain consistency after rejecting the small-stakes bet (Q2/Q3), you must also reject the massively favorable large-stakes bet (Q6), implying implausible aversion to large-scale risk.
  **Honesty Limit:** This category cannot distinguish between linear utility with risk neutrality and concave utility with risk aversion without more data; it only identifies adherence to the independence axiom and utility consistency.

  ### 2. Cautious Non-EU (Mechanism Underdetermined)
  **Pattern:**
  *   **Allais Paradox:** You chose **A in Q1** (Sure thing) AND **B in Q9** (Riskier gamble).
  *   **Rabin Calibration:** You chose **A in Q2/Q3** (Reject small bet) AND **B in Q6** (Accept large bet).
  *   **FOSD:** You chose **A in Q5**.
  *   **Risk Attitude:** You chose **A in Q7** (Risk averse on even bet).

  **Most Awkward Commitment:** You commit to risk attitudes that shift depending on the probability structure or stake size in ways that standard utility curvature cannot explain, requiring a separate risk-weighting parameter.
  **Honesty Limit:** **This label is "Cautious Non-EU, Mechanism Underdetermined."** Your choices are consistent with Risk-Weighted Expected Utility (Buchak), Rank-Dependent Utility, or Cumulative Prospect Theory. This quiz cannot distinguish between a global risk function ($r$-curvature) and a prospect-theoretic value function ($v$-curvature + weighting).

  ### 3. Globally Daring Non-EU
  **Pattern:**
  *   **Risk Seeking:** You chose **B in Q7** AND **B in Q8**.
  *   **FOSD:** You chose **A in Q5**.
  *   **Allais:** Any pattern (or inverse Allais).

  **Most Awkward Commitment:** You systematically prefer lower expected monetary value for the chance of a higher maximum payoff, even when the probability of gaining anything is high (Q8).
  **Honesty Limit:** Like the Cautious profile, this does not distinguish between a "daring" risk function in REUT and convex utility in EUT, though the Allais pattern (if present) would rule out strict EUT.

  ### 4. Mixed or Locally Varying Risk Function
  **Pattern:**
  *   **Sensitivity:** You chose **A in Q7** (Averse on 50/50) BUT **B in Q8** (Seeking on 90/10).
  *   **FOSD:** You chose **A in Q5**.

  **Most Awkward Commitment:** Your risk attitude flips from cautious to daring based solely on the probability range, implying a risk function that is not globally concave or convex.
  **Honesty Limit:** This pattern is difficult to model with a single global risk function in REUT without local parameters; it strongly suggests a weighting function that overweights small probabilities (as in Prospect Theory).

  ### 5. Incoherent or Unrepresentable
  **Pattern:**
  *   **FOSD Violation:** You chose **B in Q5**.
  *   *OR*
  *   **Logical Contradiction:** You chose **A in Q1**, **B in Q9**, but also **A in Q6** after rejecting **Q2** (implies conflicting models of risk).

  **Most Awkward Commitment:** You prefer less money to more money in a state-by-state comparison (Q5), which violates the basic dominance principle required by all standard normative theories.
  **Honesty Limit:** If this pattern is not a mistake, it suggests preferences that cannot be represented by any weighted utility model, potentially requiring state-dependent utility or non-transitive preferences.

