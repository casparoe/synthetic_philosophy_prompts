  ### EXPLANATORY NOTES ON SPECIFIC QUESTIONS

  **Note 1 (The Ellsberg Trap - Q4):**
  Your choice in Q4 does **not** sort Expected Utility from Risk-Weighted Expected Utility. Both theories are typically defined over known probabilities. Preferring Option A indicates *ambiguity aversion*, which requires an extension to either theory (e.g., Maxmin Expected Utility). Do not count this toward your REUT/EUT classification.

  **Note 2 (The Convergence Case - Q7):**
  Choosing Option A in Q7 indicates risk aversion. However, this question does **no separating work** between Expected Utility and Risk-Weighted Expected Utility. A concave utility function (EUT) and a linear utility function with a cautious risk function (REUT) can both produce this choice. It establishes risk attitude, not theoretical framework.

  **Note 3 (The Rabin Calibration - Q2, Q3, Q6):**
  This sequence tests the source of your risk aversion. If you reject the small bets (Q2, Q3) due to diminishing marginal utility (EUT), the math forces you to reject the large bet (Q6). If you reject the small bets but accept the large one, you violate Expected Utility Theory but remain consistent with Risk-Weighted Expected Utility (where risk attitudes are governed by a function separate from utility curvature).

  **Note 4 (The Allais Pair - Q1, Q9):**
  These questions are separated to prevent immediate comparison. Choosing the sure thing in Q1 but the riskier option in Q9 violates the Independence Axiom of Expected Utility Theory. This is the primary diagnostic for moving from EUT to a risk-weighted framework.
