  Here's a thinking process that leads to the document above:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of mind working group (12 grad students, 2 faculty) has spent a year on the Knowledge Argument (Mary's Room).
      *   **Situation:** Two hardened camps (Physicalists vs. Anti-Physicalists). They argue past each other.
      *   **Task:** Write a joint statement document resulting from an adversarial collaboration.
      *   **Tone/Style:** Precise, stiff, scrupulously symmetrical, no adjudication, no winner. It must look like a preprint both sides could sign.
      *   **Required Sections:**
          1.  Numbered list of agreed claims (substantive, covering stipulations, non-assumptions, argument structure, invalid resolutions).
          2.  Disagreements Table (fair formulations, distinguishing verbal vs. substantive disagreements).
          3.  Cruxes Section (3-4 sub-questions, concrete cases/experiments, specifically including the "Self-Prediction Variant" where Mary predicts her reaction).
          4.  Closing Section (conditions for abandoning positions, joint statement on whether cruxes are empirically testable or insulated).

  2.  **Deconstruct the Philosophical Content:**
      *   **The Knowledge Argument (Jackson):** Mary knows all physical facts. She leaves the room. She learns something new. Therefore, not all facts are physical facts.
      *   **Physicalist Responses:**
          *   *Ability Hypothesis:* She gains abilities (know-how), not knowledge-that.
          *   *Representational/Mode of Presentation:* She gains a new way of accessing old facts (indexical or phenomenal concepts).
          *   *Illusion:* The intuition that she learns something new is mistaken.
      *   **Anti-Physicalist Responses:**
          *   *New Fact:* She learns a new proposition about the world (qualia exist).
          *   *Explanatory Gap:* Physical facts don't entail phenomenal facts.
      *   **The "Self-Prediction Variant":** Mary knows her own brain state. Can she predict her own report?
          *   *Physicalist:* Yes, in principle, she can predict the functional output. If she's surprised, it's a psychological glitch, not a metaphysical gap.
          *   *Anti-Physicalist:* She can predict the *behavior*, but not the *experience* accompanying it. If she writes the exact words but lacks the experience until release, the words mean something different.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound academic and collaborative. "Joint Statement on the Knowledge Argument."
      *   **Introduction:** Brief context setting (adversarial collaboration).

      *   **Section 1: Agreed Stipulations and Constraints.**
          *   Need to lock down the thought experiment so no one moves the goalposts.
          *   *Completeness:* Mary knows *all* physical facts (including neurophysiology).
          *   *Competence:* No cognitive deficits. She understands the concepts.
          *   *The Release:* She sees red.
          *   *What doesn't count:* Redefining "knowledge" purely verbally. Denying the intuition without argument.
          *   *Goal:* Focus on the metaphysical implication, not just semantics.

      *   **Section 2: Disagreements Table.**
          *   Need to capture the core clash without strawmanning.
          *   *Disagreement 1: The Nature of the Gain.* Physicalist: New mode/access. Anti-Physicalist: New fact/content.
          *   *Disagreement 2: The Status of Phenomenal Concepts.* Physicalist: Physical concepts in disguise/special role. Anti-Physicalist: Distinct ontological category.
          *   *Disagreement 3: Verbal vs. Substantive.* Is "propositional knowledge" the fight?
          *   *Refinement:* Ensure the "Verbal" row explicitly states that even if we fix terms, the metaphysical disagreement remains (e.g., do phenomenal concepts refer to physical properties or non-physical properties?).

      *   **Section 3: Cruxes and the Self-Prediction Variant.**
          *   Need 3-4 specific sub-questions.
          *   *Crux 1: The Predictive Gap.* Can physical knowledge entail the first-person report?
          *   *Crux 2: The Surprise Intuition.* Is surprise evidence of new fact or cognitive limitation?
          *   *Crux 3: Conceptual Possibility.* Is a physical duplicate without qualia conceivable? (Zombies).
          *   *The Variant:* Mary predicts her utterance.
              *   *Scenario:* Mary writes "Wow, red is like this."
              *   *Physicalist Prediction:* She can derive this output functionally.
              *   *Anti-Physicalist Prediction:* She can predict the utterance as behavior, but not the *truth conditions* or the *justification* for it until she experiences it.
              *   *Outcome:* If she is verbatim correct but surprised, Physicalists say "See? Functional prediction works." Anti-Physicalists say "See? The experience adds something the prediction lacked."

      *   **Section 4: Falsification Conditions and Meta-Analysis.**
          *   *Physicalist Falsification:* If it is shown that no functional/physical story can account for the discriminatory behavior associated with the experience.
          *   *Anti-Physicalist Falsification:* If it is shown that phenomenal concepts are logically supervenient on physical concepts without remainder.
          *   *Joint Meta-Statement:* This is crucial. We need to admit if the debate is insulated.
          *   *Honesty:* The Knowledge Argument is largely conceptual/a priori. Empirical data (neuroscience) doesn't settle it because the argument accepts *all* physical facts. The crux is modal (possibility/necessity), not empirical. We must state this clearly.

  4.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is it too dry? It needs to be "precise, a little stiff."
      *   *Symmetry Check:* Did I give the Physicalists short shrift? Did I make the Anti-Physicalists look like dualists too quickly? (Ensure "Anti-Physicalist" is used, not "Dualist," though they often converge).
      *   *Constraint Check:* Did I include the Self-Prediction Variant in Section 3? Yes.
      *   *Constraint Check:* Is Section 4 honest about insulation? Yes, this is a key philosophical insight. The Knowledge Argument is an a priori argument against physicalism; empirical tests often miss the point. The document should reflect that the "experiments" are thought experiments, not lab work.
      *   *Formatting:* Use clear headings, tables, and numbered lists.

  5.  **Final Polish:**
      *   Ensure the language regarding "propositional knowledge" is careful.
      *   Make sure the "Joint Meta-Statement" doesn't sound like a victory for skepticism, but a shared recognition of the dialectical landscape.
      *   Check the "Self-Prediction" details: Mary predicts her *reaction*.
      *   *Refining the Variant:* If Mary predicts the exact words, Physicalists say the physical facts determined the output. Anti-Physicalists say the physical facts determined the *output behavior*, but not the *phenomenal ground* of the assertion. This distinction needs to be sharp.

  6.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).
answer: |-
  **JOINT STATEMENT ON THE KNOWLEDGE ARGUMENT**
  **Adversarial Collaboration Working Group on Philosophy of Mind**
  **Date:** October 26, 2023
  **Signatories:** [Physicalist Camp Representatives], [Anti-Physicalist Camp Representatives]

  ### 1. Agreed Stipulations and Constraints

  The undersigned camps agree to the following stipulations regarding the Mary scenario (Jackson 1982, 1986) and the structure of the ensuing debate. These claims are intended to fix the reference of the thought experiment and rule out dialectical maneuvers that either side considers illegitimate.

  1.  **Completeness of Pre-Release Knowledge:** Mary possesses all available physical information regarding color vision prior to release. This includes complete knowledge of neurophysiology, optics, functional roles, and behavioral dispositions associated with color processing in human beings. It is stipulated that no physical fact is withheld from her.
  2.  **Cognitive and Sensory Competence:** The scenario does not stipulate that Mary lacks concepts, suffers from cognitive deficits, or is unable to process information. Furthermore, it is not stipulated that she lacks the capacity to imagine color in a propositional or functional sense; the restriction is strictly on *visual experience*. Upon release, her visual system functions normally; there are no deficits in transduction or processing.
  3.  **The Phenomenon of Release:** Upon leaving the monochromatic room and viewing a red tomato, Mary undergoes a change in state. Both camps agree that she says, "I see red now," and that she exhibits discriminatory behavior consistent with normal color vision. Both camps agree there is a salient difference between her pre-release and post-release state.
  4.  **Structure of the Argument:** Both camps agree the argument under discussion is: (P1) Mary knows all physical facts pre-release. (P2) Mary learns something new upon release. (C) Therefore, not all facts are physical facts. The disagreement concerns the truth of P2 and the validity of the inference to C.
  5.  **Invalid Resolutions:**
      *   **Mere Redescription:** A resolution cannot consist solely of redefining "knowledge" or "fact" to stipulate away the intuition (e.g., defining "knowledge" exclusively as "physical knowledge" renders the argument trivial).
      *   **Denial of Intuition:** A resolution cannot consist solely of insisting that Mary learns *nothing* new, without an account of why the strong intuition that she does is systematically misleading.
      *   **Equivocation:** A resolution cannot rely on shifting the meaning of "physical fact" mid-argument (e.g., expanding "physical" to include phenomenal properties by fiat).

  ### 2. Disagreements Table

  The following table isolates the specific points of contention. For each row, the Physicalist and Anti-Physicalist formulations have been vetted by their respective camps as accurate representations of their views.

  | Topic | Physicalist Formulation | Anti-Physicalist Formulation | Status of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Nature of the Gain** | Upon release, Mary acquires new *abilities* (to recognize, imagine, remember) or a new *mode of presentation* (a phenomenal concept) for facts she already possessed under a physical mode. No new truth-conditional content is added to her worldview. | Upon release, Mary acquires new *propositional knowledge* regarding the intrinsic nature of experience. This content is not entailed by, nor reducible to, the physical facts she previously knew. | **Substantive.** Disagreement over whether the new state represents a new fact about the world or a new relation to an old fact. |
  | **The Status of Phenomenal Concepts** | Phenomenal concepts are distinct from physical-functional concepts, but they refer to the same physical properties. The "gap" is conceptual, not ontological. | Phenomenal concepts refer to properties that are not identical to physical-functional properties. The "gap" in concepts reflects a gap in the properties themselves. | **Substantive.** Disagreement over the reference of phenomenal concepts (rigid designation of physical states vs. non-physical states). |
  | **The Meaning of "Learns"** | To say Mary "learns something new" is compatible with physicalism if "learns" denotes acquiring a new cognitive skill or accessing old information via a new channel. | To say Mary "learns something new" implies the acquisition of a true belief that was not previously justified or entailed by her existing belief set. | **Verbal (with residual substantive core).** Even if we agree on a definition of "propositional knowledge," the camps disagree on whether Mary's new belief is *entailed* by the physical facts. |
  | **The Explanatory Gap** | The feeling that something is missing is an artifact of human cognitive architecture. We lack the capacity to intuitively grasp how brain states generate experience, but this is an epistemic limitation, not a metaphysical one. | The explanatory gap is evidence of an ontological discontinuity. If physicalism were true, the connection between physical processes and experience would be logically necessary, not merely contingent. | **Substantive.** Disagreement over whether the gap is epistemic (limits of understanding) or metaphysical (limits of reality). |

  ### 3. Cruxes and the Self-Prediction Variant

  To move the dialectic forward, both camps agree to focus on three specific sub-questions. We further agree to analyze these questions in the context of the **Self-Prediction Variant**: *Mary is given a complete functional and neural description of her own visual cortex prior to release. She is asked to write down, in advance, the exact wording of her first-person report and her internal reaction at the moment of release.*

  **Crux 1: The Predictability of First-Person Reports**
  *   **Question:** Can complete physical knowledge entail the specific first-person utterance Mary will make?
  *   **Test Case:** In the Self-Prediction Variant, Mary writes: "Wow, red is like *this*." Upon release, she sees red and says, "Wow, red is like *this*."
  *   **Physicalist Prediction:** Mary can derive this output from the physical facts. The utterance is a functional output determined by neural states. If she predicts it correctly, it demonstrates that the physical facts determine the behavior and the report.
  *   **Anti-Physicalist Prediction:** Mary may predict the *utterance* as a behavioral event, but she cannot know the *truth conditions* or the *justification* for the utterance until release. She predicts the noise, not the meaning.
  *   **Divergent Interpretation:** If Mary's prediction is verbatim correct: Physicalists claim this shows physical sufficiency. Anti-Physicalists claim this shows only that behavior is physically determined, not that the *experience* grounding the report was known.

  **Crux 2: The Significance of Surprise**
  *   **Question:** If Mary predicts her report correctly but reports being "surprised" by the experience, what does the surprise signify?
  *   **Test Case:** Mary predicts the words "Wow, red is like *this*." Upon release, she says the words but adds, "I knew I would say that, but I didn't know it would feel like *this*."
  *   **Physicalist Prediction:** The surprise is a psychological reaction to the activation of a new conceptual module. It indicates a change in cognitive access, not a change in the world.
  *   **Anti-Physicalist Prediction:** The surprise is rational evidence of new information. One cannot be rationally surprised by the activation of a module one already knew one possessed; the surprise indicates contact with a new fact.
  *   **Divergent Interpretation:** Physicalists treat surprise as a datum about cognitive processing. Anti-Physicalists treat surprise as a datum about informational content.

  **Crux 3: The Possibility of the Zombie Report**
  *   **Question:** Could a physical duplicate of Mary (a Zombie) make the same prediction and report without the experience?
  *   **Test Case:** Consider Zombie-Mary, who is physically identical but lacks qualia. She writes the prediction and makes the report upon seeing the tomato.
  *   **Physicalist Prediction:** Zombie-Mary is inconceivable upon rigorous analysis. If she is physically identical, she must have the experience. If she is conceivable, she is not physically identical.
  *   **Anti-Physicalist Prediction:** Zombie-Mary is conceivable. She would write the same prediction and make the same report based on functional programming, but she would be lying (or mistaken) when she says "I see red," because she does not.
  *   **Divergent Interpretation:** Physicalists view the Zombie scenario as a failure of imagination. Anti-Physicalists view it as a proof of logical possibility.

  ### 4. Falsification Conditions and Meta-Analysis

  **Conditions for Abandoning Positions**

  *   **Physicalist Camp:** We would abandon physicalism if it were demonstrated that there exists a fact about conscious experience that makes a difference to the causal structure of the world which cannot be captured by any physical description. Specifically, if it were shown that Mary's post-release behavior *cannot* be explained by her pre-release physical knowledge plus functional laws, we would concede the argument.
  *   **Anti-Physicalist Camp:** We would abandon anti-physicalism if it were demonstrated that phenomenal concepts are logically supervenient on physical concepts without remainder. Specifically, if a derivation were provided showing that the truth of "Mary has a red experience" is a logical consequence of "Mary is in neural state N" in the same way that "The water is H2O" follows from microphysical facts, we would concede the argument.

  **Joint Meta-Statement on Empirical Insulation**

  After reviewing the Cruxes in Section 3, the undersigned camps make the following joint finding regarding the testability of our disagreement:

  We acknowledge that the core disagreement is **insulated from standard empirical resolution**. The Knowledge Argument is an *a priori* argument concerning modal logic (possibility and necessity) and conceptual entailment, not an empirical hypothesis about neurophysiology.

  1.  **Regarding the Self-Prediction Variant:** Both camps agree that empirical data showing Mary *can* or *cannot* predict her report does not settle the metaphysical question. If she predicts it correctly, Physicalists attribute this to physical determination, while Anti-Physicalists attribute it to behavioral determination distinct from phenomenal knowledge. If she fails to predict it, Physicalists attribute this to computational complexity limits, while Anti-Physicalists attribute it to the absence of the relevant fact.
  2.  **Regarding the Nature of the Dispute:** We jointly conclude that the disagreement rests on divergent interpretations of the same intuitions. The Physicalist camp prioritizes the causal closure of the physical domain; the Anti-Physicalist camp prioritizes the primacy of the phenomenal intuition.
  3.  **Conclusion:** No experiment described in Section 3 can force a concession from either side without one side first accepting the other's background metaphysical assumptions. Consequently, this document records the disagreement as **conceptually fundamental**. Progress requires not new data, but a new conceptual framework that can account for the validity of the phenomenal intuition without violating the causal closure of the physical, or vice versa. Until such a framework is proposed, the camps agree to maintain their positions as live, incompatible options.

  **Signed,**

  *The Physicalist Working Group*
  *The Anti-Physicalist Working Group*
