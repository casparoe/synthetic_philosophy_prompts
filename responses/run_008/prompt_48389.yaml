answer: |-
  You are absolutely right to be frustrated, because Marco and his sister are describing two different layers of the problem, and neither of them has the complete picture. You have stumbled onto one of the most famous and contentious puzzles in the history of economic theory.

  There isn't one single word for the whole phenomenon, but there are precise names for each piece of the configuration you described. Here is the breakdown of the terminology, the logic, and why your intuition is actually more sophisticated than the "rational" model your friend's sister learned.

  ### 1. The Mechanism: Backward Induction in a Finite Repeated Game
  The specific dynamic you observed—the unraveling starting from the end and moving backward—is called **Backward Induction**.

  In game theory, your office scenario is modeled as a **Finitely Repeated Prisoner's Dilemma** (or Finitely Repeated Game).
  *   **The Logic:** If the game ends on December 31st, everyone knows that on December 31st, there is no future punishment for defecting (not covering a shift). Therefore, a "rational" selfish actor will defect on the last day.
  *   **The Unraveling:** If everyone defects on Dec 31, then Dec 30 becomes the *effective* last day. So everyone defects on Dec 30. This logic cascades backward to day one.
  *   **The Name:** This theoretical prediction is often called the **Unraveling Result** or the **Terminal Period Problem**.

  Marco's sister is technically correct about the *standard* mathematical model. If everyone is perfectly rational, selfish, and everyone *knows* everyone else is perfectly rational and selfish (this is called **Common Knowledge of Rationality**), cooperation should collapse immediately.

  ### 2. The Paradox: The Chainstore Paradox
  You noted that empirically, this *doesn't* happen. People cooperate for a while and only defect near the end. This discrepancy between the theory (defect immediately) and reality (cooperate for a while) is a famous problem known as the **Chainstore Paradox**.

  It was formalized by Reinhard Selten (a Nobel laureate) in 1978. He described a scenario where a chain store faces competitors in 20 cities sequentially. Theory said he should fight the first one to build a reputation, but backward induction said he should accommodate everyone because fighting the last one makes no sense. Just like your office, the logic unravels.

  When people observe cooperation in a finite game where theory predicts immediate defection, they are observing a violation of the **Nash Equilibrium** prediction for finite games. This is the "weird puzzle" you mentioned.

  ### 3. The Solution: Reputation Effects under Incomplete Information
  This is the piece that resolves your circular thinking and validates your intuition over Marco's.

  The reason the "Backward Induction" argument fails in the real world (and in your office) is that it assumes **Complete Information**. It assumes you know for a fact that Marco is a purely rational, selfish maximizer.

  In reality, there is **Incomplete Information**. You don't know for sure if Marco is a "Rational Selfish Type" or a "Reciprocal Type" (someone who cooperates regardless, or punishes defectors emotionally).

  The formal name for the solution to this puzzle is the **Reputation Model**, specifically the **KMRW Model** (named after Kreps, Milgrom, Roberts, and Wilson, who published the seminal paper in 1982, often referred to as the **"Gang of Four" paper**).

  Here is how it fits your puzzle:
  *   **The "Irrational" Cooperator:** You asked what to infer when someone cooperates past the "rational" bail point. In the KMRW model, you infer that there is a non-zero probability they are a **"Commitment Type"** (someone who is hardwired to cooperate or punish).
  *   **The Rational Mimic:** Even if Marco is actually a selfish rational actor, it is *rational* for him to pretend to be a "Commitment Type" early in the game. Why? To build a **Reputation**. If he builds a reputation for cooperation, you will cooperate with him, which yields him higher payoffs than defecting immediately.
  *   **The Unraveling Point:** Cooperation holds until the probability that the game is near the end becomes high enough that the future value of the reputation is outweighed by the immediate gain of defecting. This explains why your office worked for years, held for a while after the announcement, and then unraveled in October/September.

  So, the "clean mathematical unraveling" you saw is actually a **Sequential Equilibrium** in a game of incomplete information.

  ### 4. How it differs from a Standard Prisoner's Dilemma
  You asked how this is different from an ordinary Prisoner's Dilemma (PD) breakdown.

  1.  **One-Shot PD:** In a standard, single-round PD, defection is the dominant strategy. There is no future, so no reputation.
  2.  **Infinitely Repeated PD:** If the game goes on forever (or the end date is unknown), cooperation can be sustained indefinitely. This is known as the **Folk Theorem**. The threat of future punishment keeps everyone in line.
  3.  **Finitely Repeated PD (Your Scenario):** The known end date destroys the Folk Theorem *unless* you introduce Incomplete Information (The KMRW Model).
      *   **Marco's View:** He thinks it's "trust breaking down." In game theory terms, "trust" is usually a placeholder for "expectation of future reciprocity." He is describing the *symptom*.
      *   **The Sister's View:** She is describing the *Complete Information Nash Equilibrium*. She is describing the *theoretical baseline* that ignores human complexity.
      *   **Your View:** You are describing the *Dynamic Unraveling of Reputation*. You noticed that the collapse is time-dependent and linked to the horizon.

  ### Summary of Terms for Your Argument
  If you want to win this argument (or at least end the circle), here is the vocabulary you need:

  1.  **The Phenomenon:** The **Endgame Effect** (colloquial) or **Backward Induction Unraveling** (technical).
  2.  **The Theoretical Conflict:** The **Chainstore Paradox** (why theory says defect now, but reality says wait).
  3.  **The Reason it Works (for a while):** **Reputation Effects** in a **Game of Incomplete Information**.
  4.  **The Specific Model:** The **KMRW Model** (Kreps, Milgrom, Roberts, Wilson).
  5.  **The "Irrational" Player:** A **Commitment Type** (a player who is perceived as potentially irrational, which paradoxically makes it rational for others to cooperate with them).

  **The Verdict:**
  Marco is wrong; it isn't just "trust." Trust is the output, not the mechanism. His sister is half-right; backward induction is the engine, but she is running it on the wrong fuel (complete information). You are right: it is a mathematical unraveling driven by the updating of probabilities regarding other players' types. The moment the office closure was announced, the game shifted from an *Infinitely Repeated Game* (where the Folk Theorem applies) to a *Finitely Repeated Game with Incomplete Information* (where the KMRW Reputation Model applies). The unraveling began when the "shadow of the future" became too short to sustain the cost of maintaining a reputation.
