answer: |-
  # The Discursive Dilemma: A Diagnostic Tree for Collective Judgment

  **Starting Point:** *You accept that majority voting on interconnected propositions (e.g. premises and conclusions) can produce a collectively inconsistent verdict, even when every individual member is consistent.*

  Follow the path that best matches your intuitions about concrete cases (e.g. a hiring committee, a parole board, a church synod).

  ### 1. The Consistency Check
  Imagine a three-member panel finds that a defendant **did** commit the act and **did** breach a duty, but votes 2–1 that they are **not liable** (because the majority on 'liability' differed from the majority on the premises).
  **Q1:** Is this contradictory collective verdict a fatal error that must be avoided, or an acceptable price of democratic voting?
  *   **Acceptable:** Go to **Leaf A**.
  *   **Fatal Error:** Go to Q2.

  ### 2. The Completeness Check
  To avoid contradiction, the group might leave some propositions undecided (e.g. voting on premises but abstaining on the conclusion).
  **Q2:** In a high-stakes decision (like granting tenure), is it worse to be logically inconsistent or to fail to reach a verdict on the main question?
  *   **Worse to fail to verdict:** Go to Q3.
  *   **Worse to be inconsistent:** Go to **Leaf B**.

  ### 3. The Equality Check
  Consider a grant panel with senior professors and junior researchers.
  **Q3:** To ensure consistency, must every member's vote count exactly the same, or can some members carry more weight?
  *   **Exactly the same:** Go to Q6.
  *   **Some carry more weight:** Go to Q4.

  ### 4. The Source of Weight
  If votes are weighted, what justifies the inequality?
  **Q4:** Is the extra weight due to **formal authority** (e.g. the Chair has a casting vote) or **proven competence** (e.g. the statistician decides the methodology)?
  *   **Formal Authority:** Go to Q5.
  *   **Proven Competence:** Go to **Leaf C**.

  ### 5. The Concentration of Authority
  If formal authority decides the outcome to ensure consistency:
  **Q5:** Should this authority rest with a **single individual** (to guarantee transitivity) or a **small subset** of the group (e.g. a bureau)?
  *   **Single Individual:** Go to **Leaf D**.
  *   **Small Subset:** Go to **Leaf E**.

  ### 6. The Object of the Vote
  If votes are equal, how do we structure the ballot to avoid the paradox?
  **Q6:** Should the members vote directly on the **final outcome** (e.g. 'Hire/Don't Hire') and ignore the reasons?
  *   **Yes, vote on outcome:** Go to **Leaf F**.
  *   **No, vote on reasons:** Go to Q7.

  ### 7. The Logical Constraint
  If members vote on the reasons (premises):
  **Q7:** If the majority accepts premises that logically entail a conclusion the majority rejected, must the group adopt the conclusion anyway?
  *   **Yes, follow the logic:** Go to **Leaf G**.
  *   **No, follow the vote:** Go to **Leaf H**.

  ### 8. The Integrity Check (Refinement)
  For those who follow the logic (Leaf G path):
  **Q8:** Must the group publicly endorse the reasons that generated the verdict, even if no single member endorsed *that specific set* of reasons?
  *   **Yes, the group speaks as one:** **Leaf G** (Confirmed).
  *   **No, publish the votes only:** **Leaf H** (Modified).

  *(Note: For the purpose of this diagnostic, Q8 refines the distinction between robust premise-based procedures and fragmented voting.)*

  ---

  ## The Leaves: Positions & Awkward Commitments

  **Leaf A: The Bullet-Biter (Majority on Everything)**
  *Position:* Accept collective inconsistency as the price of equal voting on every proposition.
  *Awkward Commitment:* You must defend the group's right to hold contradictory beliefs (e.g. 'Guilty' and 'No Breach') without shame.

  **Leaf B: The Fragmentalist (Incomplete Judgments)**
  *Position:* Prioritise consistency over completeness; abstain on propositions that trigger paradoxes.
  *Awkward Commitment:* You must accept that some committees will dissolve without a decision simply because the agenda was logically tight.

  **Leaf C: Epistemic Deference (Technocracy)**
  *Position:* Weight votes according to track-record competence on specific issues.
  *Awkward Commitment:* You must admit that democratic equality is subordinate to accuracy, potentially silencing minority ethical perspectives.

  **Leaf D: Dictatorship (The Decider)**
  *Position:* One member's consistent judgment set becomes the group's judgment.
  *Awkward Commitment:* You reduce the committee to a rubber stamp; the 'collective' label is merely decorative.

  **Leaf E: Oligarchy (Weighted Voting)**
  *Position:* A subset of members (e.g. senior partners) determines the consistent outcome.
  *Awkward Commitment:* You institutionalise a caste system within the panel, risking resentment and reduced buy-in from junior members.

  **Leaf F: Conclusion-Based Procedure (Direct Voting)**
  *Position:* Vote only on the final verdict; treat reasons as private motivations.
  *Awkward Commitment:* The group cannot explain *why* it decided, undermining accountability and precedent.

  **Leaf G: Premise-Based Procedure (Reasoned Voting)**
  *Position:* Vote on premises; derive the conclusion logically to ensure consistency.
  *Awkward Commitment:* The group may be forced to accept a conclusion (e.g. 'Liable') that a majority of members actually voted against.

  **Leaf H: The Unstable Hybrid (Vote Reasons, Ignore Logic)**
  *Position:* Vote on premises but allow the conclusion vote to override the logical implication.
  *Awkward Commitment:* **Undefended.** This is logically unstable; if you vote on reasons, ignoring their implication renders the reason-vote meaningless.

  ---

  ## Navigator's Notes for the Seminar Leader

  ### 1. Theoretical Ghosts (Coherent but Undefended)
  *   **Leaf H (Above):** As noted, this position is rarely defended because it renders the premise-vote decorative. It is unstable once spelled out: if the logic doesn't bind, why vote on the premises at all?
  *   **Randomised Dictatorship:** A coherent position where a dictator is chosen by lot *ex ante* to ensure consistency and equality. It is rarely defended in judicial/committee contexts because it severs the link between *expertise* and *authority*, though it has traction in pure democratic theory.

  ### 2. Blind Spots (Observational Indistinguishability)
  *   **Premise-Based vs. Agenda Restriction:** In practice, a Premise-Based Procedure (Leaf G) often looks identical to a committee that simply *removes* the conclusion from the agenda and only votes on premises. The tree cannot separate these if the output is the same, though the *justification* differs (logic vs. scope).
  *   **Epistemic Deference vs. Oligarchy:** If the 'competent' members (Leaf C) are always the same people as the 'senior' members (Leaf E), the outcomes will be identical. The tree separates them by *principle* (skill vs. rank), but you may not see the difference in the voting record.

  ### 3. Implementation Advice
  *   **Printing:** This fits on two pages if printed with 1.15 line spacing.
  *   **Usage:** Ask students to trace their path silently first, then reveal their leaf to a partner. The friction usually occurs at Q3 (Equality) and Q7 (Logical Constraint).
  *   **British English Note:** Ensure spellings remain consistent (e.g. *judgement* vs *judgment*—legal contexts prefer *judgment*, general *judgement*; this handout uses the legal convention for the leaves and general for the questions). *Programme*, *Centre*, *Defence* should be used if added.

