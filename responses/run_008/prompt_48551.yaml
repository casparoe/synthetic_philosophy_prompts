prompt: |-
  so last night my friend and I got into a three-hour argument about the Principal Principle — Lewis's old rule that if you know the objective chance of some event is x, and your other evidence is "admissible," your credence in the event should just be x. his line: the principle is basically empty, because all the work is done by the word "admissible," and you can't explain that word without either (a) saying "evidence that isn't about the outcome" — in which case the chance already summarizes the outcome-relevant facts and the principle collapses into "defer to the chance except when you shouldn't," thanks a lot — or (b) just defining admissible as "evidence given which you should defer," which makes the whole thing circular. my line: the principle still has teeth, because there are real cases where you're handed a chance and you still shouldn't defer, and the principle is what tells you where that line is.

  anyway, I teach an upper-level seminar on philosophy of probability — 12 students, 90-minute session, and in two weeks we hit the Principal Principle. I want to settle this argument in the classroom by making the students feel where the content actually lives. design me an in-class betting game where they trade on outcomes of physical chance setups (spinners, loaded dice, urns — whatever works) and where the game is rigged so the admissibility clause is the only thing seperating the winners from the losers. roughly what I'm imagining:

  - some rounds where they get a "calibration report" stating the chance of the event — here they should defer, and the ones who second-guess the number should get bled dry by the house;
  - a round with an extra piece of information that is clearly inadmissible — my friend and I sketched a tip from a source with a known track record of matching outcomes, so the rational credence is NOT the stated chance and deference is a losing play;
  - and a round with information that *looks* admissible but isn't — the one we couldn't stop arguing about: the stated chance comes from a "theory card," and mid-round they get a leak that the theory behind the card is about to be refuted. if they keep deferring to the card's number there, the house destroys them.

  so the students get punished for deferring at the wrong moments and rewarded for deferring at the right ones, and the debrief can point at specific things that actually happened in the room and map them onto parts of the principle. I want the full write-up: materials, rules, the trading mechanic (no real money — chips and a leaderboard), the exact sequence of rounds, timing, the debrief, plus (a) what will predictably go wrong the first time I run it and how to handle it, and (b) an honest note on which part of the idea the game cannot reproduce and I'll have to just tell them. my own guess on (b) is the part where the chance isn't handed to you on a card but is something you have to infer — but you tell me if that's right or if there's something worse hiding in there.

  after the write-up, give me a JSON object summarizing the whole thing so I can file it with my other lesson plans. schema, spelled out:

  {
    "title": string — short name for the activity,
    "rounds": array, one object per round, each with:
        "setup": string — the physical device and its true chance,
        "evidence": string — what students recieve that round,
        "admissible": one of "yes", "no", "contested",
        "deference_prediction": string — what a strict follower of the Principle does here,
        "smart_play": string — what actually makes money,
        "likely_failure": string — how students will predictably mess this round up,
    "debrief_map": array of objects, each with:
        "game_moment": string,
        "idea": string — the part of the Principle it maps onto,
    "predictable_problems": array of strings — first-run problems and fixes,
    "cannot_reproduce": string — the honest note on what the game can't show
  }

  answer in american english, and if the game can also settle the argument with my friend — show which of us is right about where the principle's content actually lives — that would be a nice bonus. he's coming to visit that week and I'd love to make him sit in.
